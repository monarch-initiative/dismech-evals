        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cfchs_clefting_not_modelled
        prompt: Why do neither the Amotl1 R157C knock-in mouse nor R157C-expressing zebrafish develop
          a cleft, when clefting is present in nearly every affected person?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - phenotypes#Orofacial Cleft
        - pathophysiology#Disrupted Craniofacial and Cardiac Morphogenesis
        rationale: The cellular mechanism (escape from tankyrase-mediated degradation, junctional disruption,
          slowed migration) is shown in cultured cells, and zebrafish reproduce jaw, heart and trunk defects,
          but the defining human malformation is absent in both animal models. It is unknown whether this
          reflects species differences in palatal development, redundancy among the AMOT family, or a
          requirement for the stable heterozygous germline state that mRNA injection does not provide.
      selected_evidence:
        snippet: However, neither the injected zebrafish nor the mouse model carrying the R157C variant
          exhibited phenotypes comparable to cleft lip or palate reported in affected human patients
        supports: SUPPORT
