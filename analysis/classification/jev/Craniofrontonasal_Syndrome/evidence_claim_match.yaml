        description: Mosaic ephrin-B1 expression drives segregation of expressing and non-expressing cells,
          first in the early neuroepithelium and later in craniofacial mesenchyme. Sorting is driven by
          unidirectional EphB kinase signaling into ephrin-B1-expressing neighbors, which creates a Rho
          kinase-dependent cortical actomyosin differential. EPHB2 and EPHB3 are the main receptors in
          craniofacial tissue. The ectopic boundaries are the proposed basis of cellular interference.
        biological_scale: CELLULAR
        genes:
        - preferred_term: EFNB1
