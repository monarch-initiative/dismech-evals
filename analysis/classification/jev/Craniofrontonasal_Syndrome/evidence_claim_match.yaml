          term:
            id: GO:0048013
            label: ephrin receptor signaling pathway
        cell_types:
        - preferred_term: neuroepithelial cell
          term:
            id: CL:0000710
            label: neurecto-epithelial cell
        - preferred_term: craniofacial mesenchymal cell
          term:
            id: CL:0008019
            label: mesenchymal cell
      selected_evidence:
        snippet: unidirectional EphB kinase signaling leads to cell sorting by the Rho kinase-dependent
