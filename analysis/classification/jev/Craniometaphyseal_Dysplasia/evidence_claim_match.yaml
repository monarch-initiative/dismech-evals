      assertion_type: Biochemical
      assertion:
        name: Serum alkaline phosphatase activity
        presence: INCREASED
        context: 'Serum alkaline phosphatase is elevated in CMD, with normal or transiently decreased
          calcium and phosphate and a normal parathyroid hormone. This is the diagnostically important
          mirror image of hypophosphatasia, where persistently LOW alkaline phosphatase is the cardinal
          marker and the consequence is failed mineralization. The two diseases sit at opposite ends of
          the same pyrophosphate axis (see entry notes), and the ALP direction is where that contrast
          becomes a bedside measurement. Note that there is no CMD-specific biomarker; elevated ALP here
          is a marker of high bone turnover, not a diagnostic test.

          '
        notes: No reference_ranges are curated because no CMD-specific interval was found; the finding
          is a direction of change against the local laboratory's normal range, not a disease-specific
          threshold.
      selected_evidence:
        snippet: Laboratory findings include normal or transiently decreased blood calcium and phosphate,
          elevated serum alkaline phosphatase (ALP), normal parathyroid hormone (PTH).
        supports: SUPPORT
