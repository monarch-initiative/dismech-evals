            term:
              id: MONDO:0015465
              label: craniometaphyseal dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced ANKH-Mediated Pyrophosphate Export
        description: 'ANKH encodes a multipass transmembrane protein classically described as moving inorganic
          pyrophosphate (PPi) from the cytosol into the extracellular matrix. That substrate assignment
          has been revised: more recent work describes ANK/ANKH as a transporter of small molecules including
          citrate and ATP, with extracellular PPi generated downstream from exported ATP by ENPP1 rather
          than exported as PPi in appreciable amounts. The node is retained because the *direction* of
          the lesion is unchanged under either reading — less ANKH activity means less extracellular pyrophosphate
          — but curators should not treat "ANKH is the PPi transporter" as settled. AD-CMD-causing variants
          cluster within a few amino acids of one cytosolic domain and abolish measurable PPi transport
          in the oocyte assay. The mutant protein is also short-lived and mislocalized: steady-state ANK/ANKH
          levels fall through rapid proteasomal and lysosomal degradation, and what protein remains is
          found in the cytoplasm rather than at the plasma membrane. Notably, co-expression experiments
          show mutant ANK does not impair wild-type ANK, arguing against the classical dominant-negative
          reading of the original report.

          '
        genes:
        - preferred_term: ANKH
          term:
            id: hgnc:15492
            label: ANKH
        role: trigger
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: Inorganic pyrophosphate export to the extracellular matrix
          term:
            id: GO:0030505
            label: inorganic diphosphate transport
          modifier: DECREASED
      selected_evidence:
        snippet: Wild-type ANK stimulates saturable transport of pyrophosphate ions across the plasma
          membrane, with half maximal rates attained at physiological levels of pyrophosphate.
        supports: SUPPORT
    origin:
