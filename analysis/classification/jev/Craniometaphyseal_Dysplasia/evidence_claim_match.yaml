      assertion_type: Treatment
      assertion:
        name: Historical and Unestablished Medical Therapy
        description: 'Calcitonin, and a low-calcium diet supplemented with calcitriol, have been used
          in an attempt to modulate osteoclast and osteoblast activity. These are recorded because they
          appear in the clinical literature and a curator will encounter them, NOT because they are effective:
          no medical therapy has been shown to reverse or arrest the hyperostosis, and treatment remains
          surgical. Dietary phosphate restriction delayed craniofacial hyperostosis in the CMD mouse but
          has not been tested in patients.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: To date, CMD is managed by decompression surgery to relieve neurological symptoms. Effective
          pharmaceutical therapy for CMD is still missing largely because the pathogenesis of CMD remains
          incompletely understood.
        supports: SUPPORT
