      assertion:
        name: Connexin 43 Gap Junction Dysfunction
        description: 'The autosomal recessive arm. GJA1 encodes connexin 43, the predominant gap junction
          protein of osteoblasts, osteocytes, osteoclasts, and chondrocytes, through which small molecules
          and ions are exchanged between adjacent bone cells. The recessive CMD allele p.Arg239Gln lies
          in the connexin 43 C-terminus and produces altered spatial expression of the protein with mild
          reduction of gap junction and hemichannel activity. Importantly, the knock-in mouse phenotype
          is not reproduced by Cx43 ablation models, so simple loss of connexin 43 function is unlikely
          to be the whole mechanism and the downstream bone-remodeling defect remains to be worked out.

          '
