          term:
            id: UBERON:0001474
            label: bone element
      selected_evidence:
        snippet: The ANK protein spans the outer cell membrane and shuttles inorganic pyrophosphate (PPi),
          a major inhibitor of physiologic and pathologic calcification, bone mineralization and bone
          resorption.
        supports: SUPPORT
