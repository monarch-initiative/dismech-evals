  a96d33660d482a26ae8421ad1b8c3b0d8dfb81d0afc359fcf5e83ef0d8f42e08:
    claim:
      about:
        disease:
          name: Craniometaphyseal Dysplasia
          disease_term:
            preferred_term: craniometaphyseal dysplasia
            term:
              id: MONDO:0015465
              label: craniometaphyseal dysplasia
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ppi_depletion_model
        hypothesis_label: Extracellular pyrophosphate depletion relieves inhibition of mineralization
        status: CANONICAL
        applies_to_subtypes:
        - AD-CMD
        description: 'The model proposed with the original gene discovery and still the textbook account
          of AD-CMD. ANKH normally exports intracellular inorganic pyrophosphate into the bone extracellular
          matrix, where PPi inhibits hydroxyapatite crystal formation. CMD-causing variants reduce that
          export, so extracellular PPi falls, the constitutive brake on mineral deposition is released,
          and bone is mineralized and accumulated in excess. Two independent strands support it: CMD-mutant
          ANK has no measurable PPi transport activity in a direct transport assay, and plasma PPi is
          significantly reduced in the knock-in mouse.'
        notes: 'Note that the transport data refine the original proposal as much as they confirm it.
          Reichenberger et al. inferred a dominant-negative effect, but CMD-mutant ANK turns out to have
          no transport activity at all and does not interfere with wild-type ANK when co-expressed, which
          points to loss of function with haploinsufficiency and mislocalization rather than to classical
          dominant negativity.

          A second refinement this model has NOT absorbed: the substrate itself is disputed. More recent
          work from the same group describes ANK/ANKH as a transporter of citrate and ATP, with extracellular
          PPi arising downstream from exported ATP via ENPP1. That does not reverse the model''s direction
          — less ANKH activity still means less extracellular pyrophosphate — but it moves the lesion
          one step upstream and means the model should not be stated as "ANKH fails to export PPi" without
          qualification. Curators should also not classify every ANKH variant as a simple null allele;
          a dominant function of the mutant protein has been proposed and is not excluded.'
      selected_evidence:
        snippet: Craniometaphyseal dysplasia mutations do not transport pyrophosphate and cannot rescue
          the defects of Ank null mice.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17186460
      reference_title: Biochemical and genetic analysis of ANK in arthritis and bone disease.
      evidence_source: IN_VITRO
      explanation: Direct radiolabeled transport assay confirming the transport lesion this model depends
        on.
