              label: craniometaphyseal dysplasia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Radiographic Differential Diagnosis Among Craniotubular Dysplasias
        description: 'CMD sits within the craniotubular bone dysplasias, a group that shares abnormal
          skeletal modeling and must be separated radiographically. Distinguishing CMD from craniodiaphyseal
          dysplasia is the discrimination that matters most here, and it turns on WHERE the tubular bones
          are involved: CMD produces metaphyseal flaring with relative radiolucency, whereas craniodiaphyseal
          dysplasia thickens the diaphyses. Erlenmeyer-flask deformity does not discriminate — it is shared
          with frontometaphyseal dysplasia, Pyle disease, Engelmann diaphyseal dysplasia, Melnick-Needles
          osteodysplasty, otopalatodigital syndrome type I, and craniodiaphyseal dysplasia itself — so
          the differential rests on the distribution of hyperostosis and on molecular testing. This is
          the same distinction the entry `notes` argue MONDO should reflect in its hierarchy.'
        diagnosis_term:
          preferred_term: diagnostic imaging
          term:
            id: NCIT:C16502
            label: Diagnostic Imaging Testing
      selected_evidence:
        snippet: It is important to recognize this condition from other causes of craniotubular bone dysplasias
          to institute early treatment and explain prognosis.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27594963
      reference_title: 'Craniometaphyseal dysplasia in a 14-month old: a case report and review of imaging
