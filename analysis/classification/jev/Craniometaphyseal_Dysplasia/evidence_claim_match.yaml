      assertion:
        name: Extracellular Pyrophosphate Depletion
        description: 'Extracellular inorganic pyrophosphate is a physiological inhibitor of hydroxyapatite
          crystal nucleation and growth, and also of bone resorption. When ANKH export fails, the local
          and circulating PPi concentration falls and the constitutive brake on mineral deposition is
          released. The size of this effect within bone is contested: plasma PPi is significantly reduced
          in the knock-in mouse, but compensatory upregulation of ENPP1, which generates PPi from ATP,
          can leave extracellular PPi around mutant osteoblasts comparable to wild type.

          '
        role: central_effector
        biological_scale: MOLECULAR
        biological_processes:
