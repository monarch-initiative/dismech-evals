      assertion:
        name: Metaphyseal Modeling Defect
        description: 'Failure of normal metaphyseal modeling in the growing long bones, so the metaphysis
          stays broad instead of tapering toward the diaphysis. The radiographic result is club-shaped
          widening with cortical thinning and loss of the normal concave di-metaphyseal curve, classically
          described as Erlenmeyer-flask deformity of the distal femora. Unlike the craniofacial arm this
          is largely a radiographic diagnostic feature and is not usually itself disabling.

          '
        role: consequence
        biological_scale: TISSUE
        locations:
        - preferred_term: Metaphysis
          term:
            id: UBERON:0001438
            label: metaphysis
      selected_evidence:
        snippet: The deformity consists of lack of modeling of the di-metaphysis with abnormal cortical
          thinning and lack of the concave di-metaphyseal curve resulting in an Erlenmeyer flask-like
          appearance.
        supports: SUPPORT
