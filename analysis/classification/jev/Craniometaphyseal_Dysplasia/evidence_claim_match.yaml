        direction: DECREASED
        interpretation: Locates the recessive-arm cellular defect in osteoclast resorptive activity rather
          than in osteoclast formation.
      selected_evidence:
        snippet: Although formation of resting OCs in Cx43+/+ and Cx43KI/KI mice is comparable, the actively
