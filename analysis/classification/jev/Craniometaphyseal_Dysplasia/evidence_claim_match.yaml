            description: 'The mainstay of treatment. Hyperostotic bone is drilled away to relieve compression
              of the affected cranial nerve or, at the foramen magnum, of the cervicomedullary junction.
              Reported procedures include transmastoid facial nerve decompression with ossicular chain
              reconstruction for facial palsy with conductive hearing loss, surgical treatment for optic
              nerve impaction, and suboccipital craniectomy with dural augmentation for foramen magnum
              stenosis. The dysplastic bone is extremely thick and mineralized, so removal requires lengthy
              drilling, and the complication rate is correspondingly higher than for the same operations
              in other settings.

              '
            therapeutic_modality: SURGERY
            treatment_term:
              preferred_term: surgical decompression of cranial nerve foramina
              term:
                id: NCIT:C15329
                label: Surgical Procedure
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Cranial Foraminal Narrowing and Cranial Nerve Compression
        treatment_effect: INHIBITS
        description: 'Removing the encroaching bone directly relieves the compression that produces the
          neurological deficit. The treatment acts on the compressive consequence, not on the upstream
          mineral or cellular lesion, which is why it does not prevent recurrence.

          '
      selected_evidence:
        snippet: Surgical cranial nerve decompression of and ossicular chain reconstruction may be effective
          treatments for patients with CMD.
        supports: SUPPORT
