        context: []
      assertion_type: Treatment
      assertion:
        name: Surgical Decompression of Narrowed Cranial Foramina
        description: 'The mainstay of treatment. Hyperostotic bone is drilled away to relieve compression
          of the affected cranial nerve or, at the foramen magnum, of the cervicomedullary junction. Reported
          procedures include transmastoid facial nerve decompression with ossicular chain reconstruction
          for facial palsy with conductive hearing loss, surgical treatment for optic nerve impaction,
          and suboccipital craniectomy with dural augmentation for foramen magnum stenosis. The dysplastic
          bone is extremely thick and mineralized, so removal requires lengthy drilling, and the complication
          rate is correspondingly higher than for the same operations in other settings.

          '
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: surgical decompression of cranial nerve foramina
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: However, caution should be used because surgical intervention may be associated with
          a higher incidence of complications because of lengthy procedures and the spectrum of craniofacial
          impairments in patients with CMD.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/0
