      assertion:
        name: Impaired Osteoclast Differentiation and Bone Resorption
        description: 'Osteoclast formation and function are reduced in CMD. Bone marrow-derived macrophage
          cultures from the knock-in mouse and peripheral blood cultures from CMD patients both show decreased
          osteoclastogenesis; the osteoclasts that do form have disrupted actin rings, impaired fusion,
          and reduced resorptive activity. Because bone mass is set by the balance of formation and resorption,
          a resorption deficit alone will raise bone mass, and bone marrow transplantation partially corrects
          the phenotype in the mouse.

          '
        role: effector
        biological_scale: CELLULAR
