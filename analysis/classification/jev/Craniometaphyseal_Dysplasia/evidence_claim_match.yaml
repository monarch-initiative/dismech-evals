              and club-shaped femurs, and shows the altered connexin 43 localization with reduced channel
              activity, but leaves the causal route from that molecular change to the bone phenotype unresolved.

              '
            limitations: A marked sex difference not described in human AR-CMD is present, with female
              homozygotes showing considerably more bone overgrowth than males with age; and the mutation's
              mechanism cannot be equated with connexin 43 loss of function, since ablation models do
              not phenocopy it.
