      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: impaired_bone_cell_differentiation_model
        hypothesis_label: Impaired osteoclast and osteoblast differentiation drives high bone mass
        status: ALTERNATIVE
        description: 'A competing (or superimposed) model in which the high bone mass of CMD comes principally
          from a cell-differentiation defect rather than from unopposed mineral deposition. In the Ank
          knock-in mouse and in cells from CMD patients, both osteoblastogenesis and osteoclastogenesis
          are impaired; osteoclasts are fewer, form defective actin rings, and resorb less bone, and bone
          marrow transplantation partially rescues the increased bone mass. The model additionally accounts
          for three observations the pyrophosphate model does not: the hyperostotic bone is itself hypomineralized
          and less mature, compensatory ENPP1 activity can leave extracellular PPi comparable to wild-type
          in mutant osteoblasts, and pharmacological restoration of plasma PPi fails to rescue the skeletal
          phenotype.'
      selected_evidence:
        snippet: Increased bone mass could partially be rescued by bone marrow transplants supporting
          our hypothesis that reduced osteoclastogenesis contributes at least in part to hyperostosis.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
