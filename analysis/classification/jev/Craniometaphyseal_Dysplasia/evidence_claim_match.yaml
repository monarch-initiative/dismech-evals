            name: AD-CMD
            display_name: Autosomal dominant craniometaphyseal dysplasia (ANKH)
            description: 'The common form, caused by heterozygous variants in ANKH that cluster within
              a small stretch of the protein. Progressive craniofacial hyperostosis with cranial nerve
              entrapment and metaphyseal widening; life expectancy is normal in uncomplicated disease
              but can be reduced when the foramen magnum is compromised. Approximately 30% of cases arise
              from a de novo variant.

              '
            subtype_term:
              preferred_term: craniometaphyseal dysplasia, autosomal dominant
              term:
                id: MONDO:0007397
                label: craniometaphyseal dysplasia, autosomal dominant
            genes:
            - preferred_term: ANKH
              term:
                id: hgnc:15492
                label: ANKH
          role: subtype
      assertion_type: Genetic
      assertion:
        name: ANKH
        subtype: AD-CMD
        notes: 'ANKH (progressive ankylosis protein homolog) encodes a multipass transmembrane protein
          that transports intracellular inorganic pyrophosphate into the extracellular matrix. Heterozygous
          CMD-causing variants are point substitutions, single-amino-acid insertions, or in-frame deletions
          clustering within a few residues of one cytosolic domain, mostly toward the C-terminus. Functionally
          these behave as loss-of-function alleles: the mutant protein has no measurable pyrophosphate
          transport activity, is rapidly degraded, and does not interfere with wild-type ANK when co-expressed.
          Variants elsewhere in ANKH are instead associated with calcium pyrophosphate deposition disease,
          so which disease results depends on the variant rather than on the gene alone. The cited transport
          study establishes that the two variant classes behave differently but does not itself localise
          the CPPD variants, so no claim about their position in the protein is made here.'
        gene_term:
          preferred_term: ANKH
          term:
            id: hgnc:15492
            label: ANKH
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: Here we carry out mutation analysis of ANKH, revealing six different mutations in eight
          of nine families.
        supports: SUPPORT
