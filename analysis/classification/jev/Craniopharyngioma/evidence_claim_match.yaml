        display_name: Adamantinomatous Craniopharyngioma
        description: Adamantinomatous craniopharyngioma is the CTNNB1/Wnt-driven subtype that occurs in
          children and adults, often with cystic/solid components, calcification, wet keratin, palisading
          epithelium, and a reactive inflammatory/glial microenvironment.
      selected_evidence:
        snippet: ACP and PCP subtypes can be identified by the presence of mutations in CTNNB1 and BRAF
          genes, with prevalence around 60% and 90%, respectively.
        supports: SUPPORT
