      assertion_type: Definition
      assertion:
        name: Craniopharyngioma literature definition
        definition_type: CASE_DEFINITION
        description: A rare intracranial epithelial tumor arising from Rathke pouch remnants in the sellar/parasellar
          region, histologically low-grade but clinically morbid because of its position near the optic,
          hypothalamic, and pituitary structures.
      selected_evidence:
        snippet: 'Craniopharyngioma (CP) is a rare intracranial tumor arising from the epithelial remnants
          of Rathke''s pouch, most frequently originating in the sellar/parasellar region. Histologically,
          CP is a benign low-grade tumor (WHO grade 1) with two distinct phenotypes: adamantinomatous
          CP (ACP) and papillary CP (PCP).'
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
