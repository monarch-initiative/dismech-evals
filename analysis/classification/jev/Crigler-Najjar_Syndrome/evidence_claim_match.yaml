        description: 'When plasma unconjugated bilirubin exceeds albumin binding capacity, the free pigment
          crosses the blood-brain barrier and binds to specific brain tissues, causing acute bilirubin
          encephalopathy and its chronic sequela, kernicterus. This is the complication the whole management
          strategy exists to prevent, and it is what makes type 1 a neonatal emergency. The risk is strongly
          graded by subtype: it is high in type 1, where no enzyme activity remains, and little to none
          in type 2. Once brain damage occurs it is irreversible, which is why the timing of liver transplantation
          is critical.'
        role: consequence
