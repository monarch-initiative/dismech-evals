            term:
              id: MONDO:0009044
              label: Crigler-Najjar syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: UGT1A1
        notes: Biallelic pathogenic variants in UGT1A1, on chromosome 2q37, cause Crigler-Najjar syndrome.
          Variants abolishing enzyme activity produce type 1; those leaving residual activity produce
          type 2. The gene is the same one in which a promoter TA-repeat polymorphism causes Gilbert's
          syndrome.
        gene_term:
          preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        relationship_type: CAUSATIVE
        variants:
        - name: Alleles abolishing UGT1A1 activity
          description: Genotypes leaving no measurable bilirubin-glucuronidating activity produce type
            1 disease. Because the residual activity is nil, phenobarbital has nothing to induce, which
            is why enzyme induction separates the two types clinically as well as biochemically.
        - name: Missense alleles retaining partial UGT1A1 activity
          description: Type 2 genotypes retain measurable enzyme activity. In vitro characterisation of
            Crigler-Najjar missense alleles shows that residual activity is both allele-dependent and
            substrate-dependent, ranging in one series from undetectable to most of wild-type activity
            depending on which substrate is measured.
        - name: UGT1A1*28 promoter TA-repeat polymorphism in cis
          description: The Gilbert-syndrome promoter allele (an extra TA in the TATA box, UGT1A1*28) reduces
            UGT1A1 expression and was shown to be linked in cis to structural Crigler-Najjar alleles in
            this cohort. It is a modifier of expressed bilirubin level rather than an independent cause
            of Crigler-Najjar syndrome, and is the reason the same gene spans Crigler-Najjar and Gilbert's
            syndrome.
      selected_evidence:
        snippet: Both Crigler-Najjar syndrome (CNS) type I and CNS type II are hereditary conditions characterized
          by elevated levels of unconjugated bilirubin due to mutations in the UGT1A1 gene located on
          chromosome 2q37
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
