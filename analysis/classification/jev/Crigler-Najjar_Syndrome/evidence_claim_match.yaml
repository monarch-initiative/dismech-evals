              label: Crigler-Najjar syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Severe Unconjugated Hyperbilirubinaemia
        description: 'Unconjugated bilirubin accumulates in plasma to concentrations far above those seen
          in Gilbert''s syndrome, producing persistent non-haemolytic jaundice from the first days of
          life. The defining biochemical picture is an isolated unconjugated elevation: conjugated bilirubin,
          transaminases, synthetic function, and liver imaging are normal, and there is no haemolysis.
          This distinguishes Crigler-Najjar syndrome from liver disease and from the conjugated hereditary
          hyperbilirubinaemias.'
        role: central_effector
        biological_scale: ORGANISM
        conforms_to: bilirubin_conjugation_transport#Hyperbilirubinaemia
        biological_processes:
        - preferred_term: bilirubin transport
          term:
            id: GO:0015723
            label: bilirubin transport
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Crigler–Najjar syndrome (CNS) is a rare autosomal recessive disorder characterized by
          severe unconjugated hyperbilirubinemia. CNS results in nonhemolytic jaundice, with its most
          serious complication being bilirubin-induced neurologic dysfunction.
        supports: SUPPORT
