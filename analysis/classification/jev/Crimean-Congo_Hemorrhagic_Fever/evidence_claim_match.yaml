        description: The OTU (ovarian tumour-like protease) domain of the CCHFV L protein blocks RIG-I-dependent
          initiation of the type I interferon response through its deubiquitylating activity. Early failure
          of antiviral immunity permits high-titre viraemia, and the severity of CCHF correlates with
          the magnitude of viral load and dissemination. This is the CCHF-specific substitution at the
          module's shared high-viremia node.
