            term:
              id: MONDO:0020501
              label: Crimean-Congo hemorrhagic fever
        context: []
      assertion_type: AgentLifeCycle
      assertion:
        description: CCHFV is maintained in an enzootic cycle between Hyalomma ticks, the principal vector
          and reservoir, and a range of wild and domestic vertebrates that develop viraemia without apparent
          illness and serve as amplifying hosts (livestock such as cattle, sheep and goats, and wild hosts
          including hares, small rodents and ostriches). The virus is passed in both vertical and horizontal
          transmission cycles within the tick population, and amplifying hosts spread virus from infected
          to uninfected ticks by co-feeding or by supporting a viraemic blood meal. Humans are incidental,
          dead-end hosts that do not maintain the cycle.
        hosts:
        - preferred_term: Hyalomma tick (principal vector and reservoir)
          role: vector and reservoir host
          term:
            id: NCBITaxon:34625
            label: Hyalomma
        - preferred_term: Human (incidental dead-end host)
          role: incidental (dead-end) host
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        vectors:
        - Hyalomma spp. ticks (principal vector and reservoir)
      selected_evidence:
        snippet: These animal species serve as important amplifying hosts for CCHFV, enabling CCHFV to
          spread from infected ticks to uninfected ticks through either co-feeding or feeding on a viraemic
          animal
        supports: SUPPORT
