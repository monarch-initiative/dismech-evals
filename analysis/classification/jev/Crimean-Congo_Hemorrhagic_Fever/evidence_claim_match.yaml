        - preferred_term: Human (incidental dead-end host)
          role: incidental (dead-end) host
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        vectors:
        - Hyalomma spp. ticks (principal vector and reservoir)
      selected_evidence:
        snippet: CCHFV is maintained in vertical and horizontal transmission cycles involving ixodid ticks
          and a variety of wild and domestic vertebrates, which do not show signs of illness.
        supports: SUPPORT
