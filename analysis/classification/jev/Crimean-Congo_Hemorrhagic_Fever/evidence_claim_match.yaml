        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: How faithfully do type I interferon-deficient mouse models, in which innate immunity must
          be ablated to produce lethal disease, represent CCHF pathogenesis in immunocompetent humans?
        attaches_to:
        - pathophysiology#OTU-mediated interferon antagonism and high viremia
        rationale: Wild-type mice resist lethal CCHFV infection, so the standard small-animal models require
          genetic or antibody-mediated ablation of type I interferon signalling. This confounds study
          of how intact innate immunity controls the virus and of how the virus antagonises it, which
          is the human-relevant question, and biases the models toward immune-evasion mechanisms.
      selected_evidence:
        snippet: disease is typically associated with uncontrolled viral replication, inflammatory immune
          responses, liver pathology and eventually death
        supports: SUPPORT
