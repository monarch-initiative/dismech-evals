        - path: /discussions/1
          value:
            discussion_id: gap_crohn_creeping_fat_stricture_causality
            prompt: Are creeping fat-derived CTHRC1-positive mechanosensitive fibroblasts a necessary
              and targetable driver of Crohn strictures, or are they a downstream marker of bowel-wall
              inflammation and established fibrosis?
            kind: KNOWLEDGE_GAP
            status: OPEN
            attaches_to:
            - pathophysiology#Fibrosis and Stricture Formation
            - pathophysiology#Intestinal Inflammation and Epithelial Injury
            - pathophysiology#Myeloid-Stromal Cell Crosstalk
            rationale: The Crohn entry captures inflammation-driven fibrosis, but recent single-cell and
              animal-model work suggests that mesenteric creeping fat may supply a mechanosensitive fibroblast
              population at the fat-bowel interface. Testing necessity and reversibility would determine
              whether future anti-fibrotic experiments should target bowel inflammation alone or the mesenteric-fat
              interface as a separate disease mechanism.
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: exp_crohn_creeping_fat_bowel_interface_yap_taz_rescue
        name: Patient-derived creeping-fat bowel-interface fibrosis-on-chip assay
        description: Construct a patient-derived Crohn bowel-wall organoid or organ-on-chip that juxtaposes
          intestinal epithelial organoids, bowel-wall stromal cells, mesenteric adipose stromal cells,
          and myeloid cells on tunable-stiffness matrix; then deplete or inhibit CTHRC1-positive/YAP-TAZ-high
          fibroblasts to test whether extracellular-matrix deposition and stricture-like tissue contraction
          are prevented or reversed.
        experiment_type:
          preferred_term: patient-derived organ-on-chip fibrosis perturbation experiment
        model_systems:
        - name: Crohn creeping-fat bowel-interface organ-on-chip
          description: Microphysiological model of the fibrotic Crohn fat-bowel interface combining intestinal
            epithelium, lamina propria stromal cells, mesenteric adipose stromal cells, fibroblasts, and
            myeloid cells under tunable mechanical stiffness.
          experimental_model_type: ORGAN_ON_CHIP
          namo_type: namo:OrganOnChip
          organism:
            preferred_term: human
            term:
              id: NCBITaxon:9606
              label: Homo sapiens
          tissue_term:
            preferred_term: ileum
            term:
              id: UBERON:0002116
              label: ileum
          cell_types:
          - preferred_term: intestinal epithelial cell
            term:
              id: CL:0002563
              label: intestinal epithelial cell
          - preferred_term: fibroblast
            term:
              id: CL:0000057
              label: fibroblast
          - preferred_term: adipocyte
            term:
              id: CL:0000136
              label: adipocyte
          - preferred_term: macrophage
            term:
              id: CL:0000235
              label: macrophage
          cell_source: resection-derived Crohn bowel wall, creeping fat, and patient-matched immune cells
          culture_system: tunable-stiffness microfluidic matrix with epithelial-organoid and mesenteric-fat
            compartments
        perturbations:
        - name: CTHRC1-positive fibroblast depletion
          target: pathophysiology#Fibrosis and Stricture Formation
          description: Genetic, antibody-based, or sorting-based removal of CTHRC1-positive/YAP-TAZ-high
            fibroblasts from the creeping-fat compartment to test necessity for fibrotic remodeling.
          gene:
            preferred_term: CTHRC1
        - name: YAP/TAZ mechanotransduction inhibition
          target: pathophysiology#Fibrosis and Stricture Formation
          description: Pharmacologic or genetic blockade of YAP/TAZ activity under high-stiffness matrix
            conditions to test whether mechanosensitive signaling maintains extracellular-matrix deposition.
          genes:
          - preferred_term: YAP1
          - preferred_term: WWTR1
          biological_processes:
          - preferred_term: regulation of transcription by RNA polymerase II
            term:
              id: GO:0006357
              label: regulation of transcription by RNA polymerase II
        - name: Myeloid-stromal inflammatory challenge
          target: pathophysiology#Myeloid-Stromal Cell Crosstalk
          description: Myeloid-cell cytokine challenge used to test whether creeping-fat fibroblasts require
            inflammatory crosstalk to invade the bowel-wall compartment.
          biological_processes:
          - preferred_term: inflammatory response
            term:
              id: GO:0006954
              label: inflammatory response
        readouts:
        - name: Extracellular-matrix deposition and contraction
