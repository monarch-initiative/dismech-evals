        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_nod2_autophagy_th17_mucosal_dysregulation_model
        hypothesis_label: Canonical NOD2 / Autophagy / Th17 Mucosal Dysregulation Model
        status: CANONICAL
        description: Crohn's disease arises from a polygenic susceptibility to impaired mucosal innate
          immunity (NOD2, ATG16L1, IRGM, and other autophagy genes) combined with environmental triggers
          (smoking, diet, microbiota perturbation) that produce defective bacterial sensing and clearance
          by Paneth cells, macrophages, and intestinal epithelial cells. The resulting chronic exposure
          of lamina propria APCs to commensal antigens drives IL-23-dependent Th17/Th1 polarization, granuloma
          formation, and transmural inflammation. Anti-TNF (infliximab, adalimumab), anti-IL-12/23 (ustekinumab),
          anti-α4β7 (vedolizumab), and JAK inhibitors all corroborate this immune-dysregulation model
          by interrupting specific cytokine and trafficking axes downstream of the underlying innate-immunity
          defect.
        notes: 'Retained as CANONICAL but with a partially-supported qualification. The 2026 falcon hypothesis-search
          report (kb/hypotheses/Crohn_Disease/canonical_nod2_autophagy_th17_mucosal_dysregulation_model;
          openscientist timed out at 3600s) finds direct human and mechanistic evidence continues to strongly
          support that autophagy/innate-microbial-handling risk variants produce cell-type-specific defects
          in antigen handling and Paneth-cell homeostasis, with IL-23-driven innate cytokine programs
          detectable in macroscopically healthy mucosa. Three critical qualifications mark the model as
          best treated as a modular, context-dependent framework rather than a universal mechanism: (1)
          some canonical risk alleles show no functional effect in specific assays/cell types — e.g.,
          NOD2 R702W in DC autophagy flux; NDP52 Val248Ala in epithelial AIEC xenophagy assays; (2) the
          IL-23 → IL-17 step is not consistently observed in early human disease, despite IL-23 detection
          in pre-clinical mucosa; (3) parallel upstream mechanisms — macrophage LRRK2 hyperactivity (especially
          with smoking), virome sensing deficits, and microbiome virulence programs such as type III secretion
          systems — can produce Crohn-like inflammatory trajectories WITHOUT requiring an epithelial-intrinsic
          NOD2/autophagy defect as the initiating event. The canonical model remains a strong scaffold
          for a subset of Crohn biology but does not capture all etiologic paths.'
      selected_evidence:
        snippet: Several factors have been implicated in the cause of Crohn's disease, including a dysregulated
          immune system, an altered microbiota, genetic susceptibility and environmental factors
        supports: SUPPORT
    origin:
