      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pgs_context_amplification
        hypothesis_label: Amplification of polygenic Crohn disease risk in adverse contexts via shared
          intestinal-inflammation convergence
        status: EMERGING
        description: 'Polygenic-score-by-context (PGS×C) interactions reported for inflammatory bowel
          disease in the UK Biobank appear to reflect amplification rather than context-specific causal
          variants: the same susceptibility loci (e.g. NOD2, ATG16L1, IL23R) exert systematically larger
          effects in disease-promoting contexts. This entry proposes that the amplification arises because
          polygenic liability and adverse exposures — notably tobacco smoking (a risk factor in Crohn
          disease, in contrast to its protective association in ulcerative colitis) and diet — converge
          on the shared Intestinal Inflammation and Epithelial Injury node, so their joint effect on the
          liability-threshold scale is super-additive rather than additive. Nagpal & Gibson (Nat Genet
          2026, PMID:42443528) report pervasive PGS×context interactions for prevalent IBD.'
        notes: EMERGING hypothesis motivated by population-scale PGS×context analyses (primary source
          PMID:42443528; general amplification mechanism corroborated by PMID:37228747). The convergence
          claim (polygenic liability + smoking/diet → Intestinal Inflammation and Epithelial Injury) is
          a mechanistic interpretation and is not itself established as causal — see the reverse-causation
          knowledge gap under discussions.
      selected_evidence:
        snippet: The predominant mechanism for PGS×C is the amplification of genetic effects in adverse
          contexts, such as low polyunsaturated fatty acids or social determinants of ill health
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42443528
      reference_title: Pervasive interactions between exposures and polygenic risk can inform more effective
        clinical and behavioral interventions.
      evidence_source: COMPUTATIONAL
      explanation: 'Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and 75 contexts,
        amplification of genetic effects in adverse contexts is identified as the predominant mechanism
        of PGS×context interaction — the mechanism applied in this hypothesis.'
