        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hamartomatous polyp formation in the gastrointestinal tract
        description: 'Cronkhite-Canada syndrome is characterized by widespread hamartomatous polyps involving
          the entire gastrointestinal tract, most commonly the stomach, small intestine, and colon. The
          polyps are composed of abundant lamina propria inflammatory infiltrate with cystic glands. Pathological
          examination shows gland/crypt changes including cystic dilatation filled with protein fluid
          or mucus, gland withering and branching, and lamina propria edema.

          '
        biological_processes:
        - preferred_term: Epithelial cell proliferation
          term:
            id: GO:0050673
            label: epithelial cell proliferation
        - preferred_term: Epithelial cell morphogenesis
          term:
            id: GO:0003382
            label: epithelial cell morphogenesis
      selected_evidence:
        snippet: CCS is characterized by an extremely rare, nonfamilial hamartomatous polyposis syndrome,
          in which polyps are distributed in the stomach and colon (90%), small intestine(80%), and rectum
          (67%), while sparing the esophagus.
        supports: SUPPORT
    origin:
