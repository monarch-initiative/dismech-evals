      assertion_type: Treatment
      assertion:
        name: Corticosteroids
        description: 'Systemic corticosteroids (prednisone or methylprednisolone) are the first-line treatment
          for Cronkhite-Canada syndrome. Initial dosages typically range from 30-60 mg/day (1 mg/kg body
          weight), with gradual dose reduction after symptom improvement. Over 85% of patients respond
          to dosages above 30 mg/day, often resulting in complete remission of polyps and resolution of
          cutaneous manifestations. Glucocorticoids work by reducing gastrointestinal inflammation and
          suppressing autoimmune responses.

          '
        treatment_term:
          preferred_term: corticosteroid agent therapy
