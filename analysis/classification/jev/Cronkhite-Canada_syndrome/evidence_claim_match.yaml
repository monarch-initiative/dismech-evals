  3a1788abd6863124904f3f8a2273b710ab0ad13233287178a2987519dc71501a:
    claim:
      about:
        disease:
          name: Cronkhite-Canada syndrome
          disease_term:
            preferred_term: Cronkhite-Canada syndrome
            term:
              id: MONDO:0008283
              label: Cronkhite-Canada syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Eosinophilic Gastroenteritis
        disease_term:
          preferred_term: eosinophilic gastroenteritis
          term:
            id: MONDO:0016129
            label: eosinophilic gastroenteritis
        description: 'EGE presents with similar symptoms to CCS including chronic diarrhea, abdominal
          pain, and GI inflammation with mucosal edema. Early in the disease course, before polyp formation
          is evident, patients with CCS may present with diffuse gastroduodenal mucosal edema and eosinophilic
          infiltration that resembles EGE. Both conditions can present with protein-losing enteropathy
          and nutritional deficiencies. Careful endoscopy and follow-up imaging are required to differentiate
          the two conditions.

          '
        distinguishing_features:
        - Characteristic peripheral eosinophilia and elevated IgE are common in EGE but not typical of
          CCS
        - Histology shows predominantly eosinophilic infiltration (>20 eosinophils/hpf) in EGE vs. mixed
          inflammatory infiltrate in CCS
        - Diffuse polyp formation throughout the GI tract is characteristic of CCS; EGE primarily presents
          with mucosal thickening and edema
        - Alopecia, nail dystrophy, and hyperpigmentation are specific to CCS
        - Food allergy history is common in EGE; CCS etiology is unknown but may relate to autoimmune
          mechanisms
        - Follow-up endoscopy typically shows polyp development in CCS but not in EGE
      selected_evidence:
        snippet: the patient was initially misdiagnosed as having eosinophilic gastroenteritis. However,
          gastric mucosal atrophy and numerous polyps of the entire digestive tract were found several
          weeks later.
        supports: SUPPORT
