        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Peutz-Jeghers Syndrome
        disease_term:
          preferred_term: Peutz-Jeghers syndrome
          term:
            id: MONDO:0008280
            label: Peutz-Jeghers syndrome
        description: 'Both PJS and CCS present with gastrointestinal polyposis and can have cutaneous
          manifestations. PJS is characterized by hamartomatous polyps throughout the GI tract and characteristic
          mucocutaneous pigmentation. However, the clinical presentation, genetic basis, and associated
          systemic features differ significantly. PJS polyps are typically larger and less diffuse than
          in CCS, and PJS carries increased cancer risk through a different mechanism (STK11 mutations).

          '
        distinguishing_features:
        - Characteristic mucocutaneous pigmentation (dark macules on lips and oral mucosa) in PJS; hyperpigmentation
          in CCS is typically truncal and acral
        - PJS is autosomal dominant (STK11 mutations); CCS is nonhereditary and sporadic
        - PJS polyps are typically larger (>1 cm), fewer in number, and predominantly in small intestine;
          CCS polyps are smaller, more diffuse, and widespread
        - Alopecia and nail dystrophy are characteristic of CCS but absent in PJS
        - PJS presents in childhood; CCS typically presents in middle-aged adults
        - Taste loss is characteristic of CCS, absent in PJS
      selected_evidence:
        snippet: 'Typical digestive-tract polyps need to be differentiated from the following: Peutz–Jeghers
          syndrome, familial adenomatous polyposis, juvenile polyposis, Cowden disease, cap polyposis,
          and Ménétrier''s disease'
        supports: SUPPORT
