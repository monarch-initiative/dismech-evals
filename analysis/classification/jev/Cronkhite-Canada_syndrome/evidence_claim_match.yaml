      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ulcerative Colitis
        disease_term:
          preferred_term: ulcerative colitis
          term:
            id: MONDO:0005101
            label: ulcerative colitis
        description: 'Early-stage CCS can present with abdominal pain, diarrhea, bloody stool, and colonoscopy
          findings of colitis-like appearance, making it clinically indistinguishable from ulcerative
          colitis. Both conditions present with chronic diarrhea, gastrointestinal inflammation, and mucosal
          changes. However, CCS typically involves the entire GI tract including the small intestine and
          is accompanied by distinctive cutaneous manifestations (alopecia, nail dystrophy, hyperpigmentation)
          that develop later in the disease course.

          '
        distinguishing_features:
        - Distinctive cutaneous triad of alopecia, onychodystrophy, and hyperpigmentation (pathognomonic
          for CCS, absent in UC)
        - Involvement of small intestine and stomach (seen in ~80-90% of CCS vs. rare in UC)
        - Hamartomatous rather than inflammatory polyps on histology (UC shows crypt distortion and epithelial
          damage)
        - Taste loss and hypogeusia (characteristic early symptom of CCS, absent in UC)
        - Protein-losing enteropathy is typical of CCS but less prominent in UC
        - CCS spares the esophagus while UC is limited to colon/rectum
      selected_evidence:
        snippet: endoscopic features of diffuse gastric mucosa nodularity with circumferential nodular
          pancolitis and a solitary colonic polyp initially mimicking inflammatory bowel disease.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
