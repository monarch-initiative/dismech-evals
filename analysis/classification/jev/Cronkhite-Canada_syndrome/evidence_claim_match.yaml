            label: classic familial adenomatous polyposis
        description: 'FAP presents with hundreds to thousands of adenomatous polyps throughout the colon
          and rectum, similar to the polyposis seen in CCS. Both conditions carry significant cancer risk
          and require surveillance and intervention. However, FAP is autosomal dominant (APC mutations)
          whereas CCS is sporadic and nonhereditary. The polyp types, anatomical distribution, and systemic
          manifestations are distinctly different.

          '
        distinguishing_features:
        - FAP is autosomal dominant with positive family history; CCS is sporadic and nonhereditary
        - FAP polyps are adenomatous; CCS polyps are hamartomatous
        - FAP polyps are typically limited to colon/rectum with upper GI involvement in ~25% of cases;
          CCS involves entire GI tract
        - Extraintestinal manifestations in FAP (congenital hypertrophy of retinal pigment epithelium,
          desmoid tumors, osteomas) are absent in CCS
        - Distinctive cutaneous triad (alopecia, nail changes, hyperpigmentation) is specific to CCS
        - FAP typically presents in childhood/adolescence; CCS presents in middle-aged adults
      selected_evidence:
        snippet: 'Typical digestive-tract polyps need to be differentiated from the following: Peutz–Jeghers
          syndrome, familial adenomatous polyposis, juvenile polyposis, Cowden disease, cap polyposis,
          and Ménétrier''s disease'
