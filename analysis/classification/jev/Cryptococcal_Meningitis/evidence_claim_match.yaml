            preferred_term: cryptococcal meningitis
            term:
              id: MONDO:0005723
              label: Cryptococcal meningitis
        context: []
      assertion_type: Treatment
      assertion:
        name: Deferred Antiretroviral Therapy Initiation
        description: 'A timing decision, not an antifungal: in a person presenting with cryptococcal meningitis
          who is not yet on antiretroviral therapy, starting ART is deferred by about four to five weeks
          rather than begun immediately. Starting ART too early restores an inflammatory response to residual
          cryptococcal antigen in the central nervous system (immune reconstitution inflammatory syndrome),
          and the COAT trial found that earlier initiation carried higher mortality, concentrated in the
          first few weeks.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: antiretroviral therapy timing
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: The excess deaths associated with earlier ART initiation occurred 2 to 5 weeks after
          diagnosis
        supports: SUPPORT
