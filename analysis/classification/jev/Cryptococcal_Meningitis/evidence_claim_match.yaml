        context: []
      assertion_type: AgentLifeCycle
      assertion:
        description: Cryptococcus neoformans is an environmental saprophyte with no animal or arthropod
          stage required for human disease. It persists in soil, trees and bird droppings, and humans
          acquire it by inhalation. There is no person-to-person transmission, so the human host is a
          dead end for the organism rather than part of its cycle, which is why this block records an
          environmental reservoir and no vector.
        hosts:
        - preferred_term: Homo sapiens
          role: Incidental, dead-end host; infection follows inhalation from the environment and does
            not transmit onward.
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        notes: 'Birds are associated with the reservoir through their droppings rather than as infected
          hosts, so they are deliberately not recorded as a host here: the cited sources name the droppings
          as an environment the fungus lives in, not avian infection.'
      selected_evidence:
        snippet: Cryptococcus neoformans (C. neoformans) is an encapsulated pathogenic fungus that infects
          humans and animals
        supports: SUPPORT
    origin:
      assertion_path: /agent_life_cycle
      evidence_path: /agent_life_cycle/evidence/1
