        name: Cryptococcus gattii
        infectious_agent_term:
          preferred_term: Cryptococcus gattii
          term:
            id: NCBITaxon:37769
            label: Cryptococcus gattii
        description: 'The sibling species complex of C. neoformans, associated with trees rather than
          bird droppings and with temperate and tropical outbreak regions. It differs clinically in the
          host it infects: it causes disease in apparently immunocompetent people more often than in the
          immunosuppressed, and a large share of those apparently immunocompetent cases are in fact driven
          by acquired neutralising autoantibodies against GM-CSF, a hidden immune defect that an HIV/CD4
          framing misses. It is more prone to parenchymal cryptococcomas than to the diffuse meningitis
          that dominates in HIV-associated C. neoformans disease.'
      selected_evidence:
        snippet: gattii are more often reported in immunocompetent patients with undefined risk than in
          the immunocompromised.
        supports: SUPPORT
