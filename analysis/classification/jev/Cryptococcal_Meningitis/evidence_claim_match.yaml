      assertion_type: Discussion
      assertion:
        discussion_id: gap_cryptococcal_cns_tropism
        prompt: Why does Cryptococcus neoformans, which reaches the bloodstream from the lung, declare
          itself in the central nervous system rather than in other perfused organs, and what determines
          whether a disseminating infection crosses the blood-brain barrier?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Haematogenous Dissemination and Blood-Brain Barrier Invasion
        rationale: 'The dissemination node records the tropism as an observation and does not explain
          it. The review cited there frames barrier crossing as a current question and describes candidate
          routes without settling which operates in human disease, and the entry''s own chain therefore
          contains no mechanism for organ selection. This matters for prevention rather than for treatment:
          antigen screening works on the stage before invasion, so knowing what commits a disseminating
          infection to the brain would identify whom to treat pre-emptively.'
      selected_evidence:
        snippet: To enter the brain, C. neoformans must cross the BBB, and three major pathways have been
          proposed for crossing the BBB including Trojan horse, transcytosis, and paracellular crossing
        supports: SUPPORT
    origin:
