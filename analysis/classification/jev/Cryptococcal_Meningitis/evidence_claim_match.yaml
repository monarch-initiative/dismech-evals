      assertion_type: Pathophysiology
      assertion:
        name: Amphotericin B Extraction of Membrane Ergosterol
        role: therapeutic_vulnerability
        biological_scale: MOLECULAR
        conforms_to: fungal_membrane_ergosterol_binding#Polyene Binding and Ergosterol Extraction / Pore
          Formation
        description: 'The second half of induction therapy acts on a target that is not an enzyme at all.
          Amphotericin B is an amphiphilic macrolactone that engages Cryptococcus neoformans membrane
          ergosterol directly: large extramembranous aggregates physically pull the sterol out of the
          bilayer, and binding ergosterol rather than the minor pore-forming fraction is what makes the
          drug fungicidal. Selectivity rests on a single fungal-specific feature, since polyenes bind
          ergosterol more avidly than the mammalian cholesterol that replaces it, and the discrimination
          being imperfect is why the drug carries dose-limiting nephrotoxicity and why the liposomal formulation
          exists. Two consequences matter for this disease specifically. Because the target is a finished
          membrane lipid rather than a mutable gene product, clinically significant polyene resistance
          in cryptococcal disease is rare, which is why a drug in use for five decades remains the induction
          backbone. And because the killing is physicochemical rather than replication-dependent, it clears
          organisms from cerebrospinal fluid at a rate that can be measured directly, which is the endpoint
          the single-high-dose liposomal regimen was judged on. This node is a therapeutic vulnerability
          rather than a step in the disease.'
        notes: 'No biological_processes or molecular_functions term is bound here, following the module
          node this conforms to, which records the reason on itself: the polyene mechanism is a direct
          drug-lipid interaction, and GO''s biological-process and molecular-function branches describe
          gene-product activities, so any term would misrepresent a physical sterol-extraction event.
          The ergosterol substrate is annotated on the module''s upstream trigger node rather than duplicated
          here.'
      selected_evidence:
        snippet: amphotericin exists primarily in the form of large, extramembranous aggregates that kill
          yeast by extracting ergosterol from lipid bilayers
        supports: SUPPORT
        directness: DIRECT
