        context: []
      assertion_type: Treatment
      assertion:
        name: Combined Resection of Presacral Mass, Anorectal Repair and Spinal Untethering
        description: Surgery is the main treatment. The presacral mass is excised, the anorectal malformation
          is corrected, usually through a posterior sagittal approach, and the dysraphic spinal anomalies
          are repaired with untethering of the cord. These can be done in a single combined neurosurgical
          and general surgical operation, in which the spinal canal is opened through a midline laminoplasty
          and the incision extended to a posterior sagittal approach to the presacral mass; this approach
          has been reported without recurrence, retethering or cerebrospinal fluid fistula. Early resection
          is advised because of the risks of infection, meningitis and malignant transformation of an
          undiagnosed presacral mass. Constipation and neurogenic bladder dysfunction often persist afterwards.
          A neonate presenting with obstruction may first need a colostomy, with the definitive operation
          staged later. Anal stenosis in this syndrome responds poorly to dilatation alone.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: presacral mass resection with anorectoplasty and spinal cord untethering
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: In all cases, the lumbosacral spinal canal was accessed via a midline approach with laminoplasty,
          allowing spinal cord untethering and repair of the dysraphic anomalies.
        supports: SUPPORT
