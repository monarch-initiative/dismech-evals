        description: Because penetrance is incomplete and carriers may be asymptomatic, first degree relatives
          of an index patient are offered clinical evaluation, sacral radiography and, where a familial
          MNX1 variant is known, testing. Carriers found this way, including asymptomatic ones, can be
          screened by MRI for an occult presacral mass.
