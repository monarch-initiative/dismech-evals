  95ab10ddbeeb21ca8886882f22b08449a131486c2e584719283cbdaacfe7a960:
    claim:
      about:
        disease:
          name: Currarino Triad
          disease_term:
            preferred_term: Currarino triad
            term:
              id: MONDO:0008305
              label: Currarino triad
        context: []
      assertion_type: Genetic
      assertion:
        name: MNX1
        gene_term:
          preferred_term: MNX1
          term:
            id: hgnc:4979
            label: MNX1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: Intragenic MNX1 truncating and homeodomain missense variants
          description: More than a hundred different heterozygous intragenic MNX1 variants are reported.
            Frameshift and nonsense variants make up more than half, supporting haploinsufficiency; missense
            variants cluster in the homeodomain and replace highly conserved residues. No consistent genotype-phenotype
            correlation has been found among intragenic variants.
          type: frameshift, nonsense, splice-site and homeodomain missense
        - name: Whole MNX1 gene deletion
          description: A heterozygous 5.8 kb deletion removing the entire MNX1 gene and no other known
            gene causes typical Currarino syndrome in a Norwegian family, showing that loss of one copy
            is sufficient. Dosage analysis (MLPA or microarray) is needed when sequencing is negative.
          variant_type: deletion
        - name: 7q36 microdeletions including MNX1
          description: Terminal or interstitial deletions of 7q36 that include MNX1 cause the triad with
            additional features, chiefly developmental delay or intellectual disability, growth retardation
            and facial dysmorphism, attributed to other deleted genes. These patients should have chromosomal
            microarray first.
          variant_type: copy number variation
        notes: 'Heterozygous MNX1 loss of function is the established cause. Pooled across published series,
          an MNX1 variant or deletion is found in about 57% of patients: almost all familial cases but
          only about a third of sporadic ones. Proposed explanations for the MNX1-negative sporadic cases
          are somatic mosaicism (one adult woman with a mosaic MNX1 variant present in fewer than half
          of her cells has been reported), variants outside the coding region, other loci, and misdiagnosis;
          several MNX1-negative patients have subtly different phenotypes, and in a multicentre series
          MNX1-positive patients more often had the complete triad. MNX1 variants are not found in caudal
          regression syndrome without the Currarino features. Biallelic MNX1 variants cause a different,
          recessive disorder, permanent neonatal diabetes, which is not part of this entry. No ClinGen
          gene-disease validity assertion for MNX1 was found in the ClinGen export, so no gene_disease_validity
          tier is recorded.'
      selected_evidence:
        snippet: We excluded several candidate genes before identifying patient-specific mutations in
          a homeobox gene, HLXB9, which was previously reported to map to 1q41-q42.1 and to be expressed
          in lymphoid and pancreatic tissues.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
