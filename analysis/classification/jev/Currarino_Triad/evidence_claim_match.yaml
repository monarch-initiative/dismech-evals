      assertion:
        name: Persistent Endodermal-Neural Communication
        biological_scale: TISSUE
        description: Failure of the caudal notochord to separate ventral gut from dorsal neural tissue
          is proposed to leave a communication between them. Its remnants are thought to explain neurenteric
          cysts, the frequent continuity between the presacral mass and the spinal canal, and the defect
          in the anterior sacral dura through which an anterior meningocele herniates into the presacral
          space.
      selected_evidence:
        snippet: There was a communication between the presacral tumor and the spinal canal in 12 cases,
          and tethering of the spinal cord in 17 cases.
        supports: SUPPORT
