        context: []
      assertion_type: Diagnosis
      assertion:
        name: MNX1 Sequencing and Copy Number Analysis
        description: Patients with the classic triad and normal growth, development and facial appearance
          should have MNX1 sequencing first, followed by dosage analysis (MLPA or chromosomal microarray)
          if sequencing is negative, because whole-gene deletions occur. When developmental delay, growth
          delay or dysmorphism are present, chromosomal microarray should come first to detect a 7q36
          deletion. Molecular testing identifies asymptomatic carriers in a family, but a negative result
          does not exclude the diagnosis in a sporadic patient.
        diagnosis_term:
          preferred_term: MNX1 genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: This work underscores the importance of dosage analysis of MNX1 when Sanger sequencing
          is negative.
        supports: SUPPORT
    origin:
