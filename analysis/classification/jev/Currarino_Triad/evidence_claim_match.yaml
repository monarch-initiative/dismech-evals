        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Caudal Notochord and Dorsal-Ventral Patterning Defect
        biological_scale: TISSUE
        description: The favoured embryological model places the primary error at the caudal end of the
          developing notochord at about Carnegie stage 7 (16 days after ovulation), in the tail bud from
          which notochord, neural tube, somites and hindgut all arise. A caudal notochord defect is thought
          to disturb the separation of ventral gut endoderm from dorsal neuroectoderm, leaving abnormal
          connections between them, and to derange secondary neurulation and formation of the sacral vertebrae.
          The model explains why anorectal, sacral, presacral and spinal anomalies occur together, but
          it is inferred from the anatomy of the malformations rather than observed.
        locations:
        - preferred_term: notochord
          term:
            id: UBERON:0002328
            label: notochord
        biological_processes:
        - preferred_term: caudal notochord development
          term:
            id: GO:0030903
            label: notochord development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Malformation at the caudal end of the developing notochord at approximately Carnegie
          stage 7 (16 post-ovulatory days), which results in aberrant secondary neurulation, can explain
          the observed pattern of anomalies.
        supports: SUPPORT
        directness: INDIRECT
