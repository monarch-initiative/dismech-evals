  04809c76e8743ee641b85532a3b911bcf0467f071a169929054c841e141b2133:
    claim:
      about:
        disease:
          name: Currarino Triad
          disease_term:
            preferred_term: Currarino triad
            term:
              id: MONDO:0008305
              label: Currarino triad
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mnx1_mouse_human_mismatch
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#MNX1 Haploinsufficiency
        - pathophysiology#Caudal Notochord and Dorsal-Ventral Patterning Defect
        - animal_models#Mouse
        prompt: Why does losing one copy of MNX1 malform the human caudal embryo when losing both copies
          of Hlxb9 leaves the mouse sacrum, hindgut and anorectum normal, and where in the human tail
          bud is MNX1 needed?
        rationale: 'The human genetics is strong: truncating variants, homeodomain missense variants and
          a deletion of MNX1 alone all cause the triad, which points to haploinsufficiency. The mouse
          evidence exists and is negative: no Hlxb9 mutant, heterozygous or null, shows any feature of
          the triad, while the null loses its dorsal pancreas, an organ that is normal in patients. So
          the only model organism for the gene models different tissues. The human embryo expression data
          add a second problem: MNX1 was found in the basal plate of the spinal cord, the foregut derivatives
          and the pancreas, but not in the tail bud notochord where the embryological model places the
          primary defect. Species differences in expression, a different human protein function, and a
          non-null effect of human variants have all been proposed. Until the caudal requirement for MNX1
          is located in human tissue, the link from MNX1 dosage to the notochord defect is inferred.'
        proposed_experiments:
        - experiment_id: human_caudal_mnx1_expression_map
          name: MNX1 expression in early human caudal embryo and tail bud models
          description: Map MNX1 transcript and protein in human embryos before Carnegie stage 12 and in
            human pluripotent stem cell models of the tail bud and neuromesodermal progenitors, with heterozygous
            MNX1 loss-of-function lines, to find where and when the caudal axis depends on MNX1 dosage.
      selected_evidence:
        snippet: Signal was detected in the basal plate of the spinal cord and hindbrain and in the pharynx,
          esophagus, stomach, and pancreas.
        supports: SUPPORT
