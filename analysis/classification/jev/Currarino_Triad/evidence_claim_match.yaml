        - disease#
        prompt: What causes Currarino syndrome in the roughly two thirds of sporadic patients with no
          MNX1 variant or deletion?
        rationale: Pooled data find no MNX1 alteration in 68% of sporadic and 7.7% of familial patients.
          Proposed explanations are somatic mosaicism below the detection limit (one mosaic adult is reported),
          non-coding or regulatory variants, other loci, and clinical misdiagnosis; many MNX1-negative
          patients have subtly different phenotypes and fewer have the complete triad. None of these is
          established, so this entry keeps MNX1-negative patients within the disease without a separate
          subtype.
      selected_evidence:
        snippet: Genetic heterogeneity is suspected, since at least 19 of the 24 patients without HLXB9
          gene mutation harbor subtle phenotypic variations.
        supports: SUPPORT
