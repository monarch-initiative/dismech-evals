        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Systemic Glucocorticoid Toxicity
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        description: 'Every clinically important consequence of Cushing disease sits at this node rather
          than at the tumour. Chronic cortisol excess produces central adiposity with peripheral wasting,
          proximal myopathy, dermal atrophy with wide purple striae, insulin resistance and diabetes,
          hypertension, osteoporosis, hypercoagulability, immunosuppression and mood and cognitive disturbance.
          The burden is cumulative and outlives the biochemistry: mortality is raised relative to the
          general population, and quality of life after remission does not fully normalise.'
      selected_evidence:
        snippet: In addition to classical features of glucocorticoid excess, such as proximal muscle weakness
          and wide purple striae, patients may present with the associated comorbidities that are caused
          by hypercortisolism. These include cardiovascular disease, thromboembolic disease, psychiatric
          and cognitive deficits, and infections.
        supports: SUPPORT
