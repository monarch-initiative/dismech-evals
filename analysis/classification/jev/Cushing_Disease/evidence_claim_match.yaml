      assertion_type: Diagnosis
      assertion:
        name: Screening for Hypercortisolism
        description: 'Two of three tests are used to establish endogenous hypercortisolism before the
          cause is pursued: 24-hour urine free cortisol, late-night salivary cortisol, and the 1 mg overnight
          dexamethasone suppression test. Exogenous glucocorticoid use has to be excluded first, and each
          test has a documented false-positive profile - oral oestrogens raise cortisol-binding globulin,
          CYP3A4-interacting drugs alter dexamethasone clearance, and the pseudo-Cushing states raise
          urine free cortisol physiologically.'
        diagnosis_term:
          preferred_term: laboratory procedure
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: 'The guideline recommends using two of three screening tests to establish the diagnosis:
          UFC, late night salivary cortisol or 1mg dexamethasone suppression test'
