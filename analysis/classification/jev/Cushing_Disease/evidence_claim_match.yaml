  770b397b65fe4ed0c6c1516e857056d296b77fbc7d18013d6fa73c13c0689d93:
    claim:
      about:
        disease:
          name: Cushing Disease
          disease_term:
            preferred_term: Cushing disease due to pituitary adenoma
            term:
              id: MONDO:0009050
              label: Cushing disease due to pituitary adenoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sustained EGFR Signalling
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: Wild-type USP8 is held inactive by 14-3-3 binding. Variants in that motif disrupt
          the interaction, allowing proteolytic cleavage into a hyperactive fragment which deubiquitinates
          EGFR. Ubiquitination is the signal that routes an activated receptor to the lysosome, so removing
          it rescues EGFR from degradation and returns it to the surface. The corticotroph therefore experiences
          continuous EGF pathway signalling from a normal amount of ligand - the defect is in receptor
          disposal, not in ligand supply. BRAF V600E reaches the same downstream state by constitutively
          activating the MAPK cascade below the receptor.
        biological_processes:
        - preferred_term: epidermal growth factor receptor signaling pathway
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0007173
            label: epidermal growth factor receptor signaling pathway
        - preferred_term: ERK1 and ERK2 cascade
          modifier: INCREASED
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
        cell_types:
        - preferred_term: corticotroph
          term:
            id: CL:0002309
            label: corticotroph
      selected_evidence:
        snippet: Cleavage of USP8 led to increased deubiqutination of the EGF receptor, impairing its
          downregulation and sustaining EGF signaling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25485838
      reference_title: Mutations in the deubiquitinase gene USP8 cause Cushing's disease.
      evidence_source: IN_VITRO
      explanation: The mechanistic step from the mutant protease to sustained receptor signalling. (The
        spelling of "deubiqutination" is as published.)
