      about:
        disease:
          name: Cushing Disease
          disease_term:
            preferred_term: Cushing disease due to pituitary adenoma
            term:
              id: MONDO:0009050
              label: Cushing disease due to pituitary adenoma
        context: []
      assertion_type: Subtype
      assertion:
        name: USP8-mutant
        display_name: USP8-mutant corticotroph adenoma
        description: 'The commonest molecular subgroup. Individual series have reported anything from
          35% to 62%, but a meta-analysis of 2,171 cases pools the prevalence at 31.1%, and much of the
          between-study spread turns out to track the sex ratio of the cohort rather than anything about
          the tumours. Variants cluster in the 14-3-3 binding motif encoded by exon 14, and are essentially
          confined to corticotroph adenomas - the same variants are not found in other pituitary adenoma
          types.

          The clinical profile is distinctive and internally tensioned: these patients are predominantly
          female, are diagnosed about four and a half years younger, and are *both* more likely to achieve
          postoperative remission and more likely to recur.'
      selected_evidence:
        snippet: Pooled prevalence was 31.1% (95% CI, 26.5%-36.0%) and was higher in cases with functional
          tumours (34.1%; 95% CI, 29.4%-39.1%).
        supports: SUPPORT
    origin:
