      assertion_type: Biochemical
      assertion:
        name: Early postoperative nadir serum cortisol
        notes: Measured during the first week after transsphenoidal surgery, this is the practical predictor
          of durable remission. A nadir at or below 3 mcg/dL predicts long-term remission with 94% positive
          predictive value - but only 50% negative predictive value, so a low nadir is reassuring while
          a higher one is not by itself a verdict.
      selected_evidence:
        snippet: Nadir cortisol concentrations ≤3 mcg/dL during the first post-operative week predicted
          long-term remission with 74% sensitivity, 85% specificity, 94% positive predictive value, and
          50% negative predictive value (area under the curve 0.808, p = 0.001).
        supports: SUPPORT
