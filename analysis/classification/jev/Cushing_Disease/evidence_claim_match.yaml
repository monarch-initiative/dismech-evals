      assertion_type: Treatment
      assertion:
        name: Pasireotide
        therapeutic_modality: PEPTIDE
        description: 'A multi-receptor somatostatin analogue with affinity for SSTR5, which corticotroph
          adenomas express. Unlike osilodrostat it acts on the tumour rather than the adrenal. In the
          long-acting Phase III extension, urinary free cortisol was at or below the upper limit of normal
          in about half of patients at last assessment and clinical improvements were sustained. The cost
          is metabolic and predictable rather than idiosyncratic: SSTR5 agonism impairs insulin secretion,
          and hyperglycaemia-related adverse events occurred in 39.5% of patients.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: pasireotide
            term:
              id: CHEBI:72312
              label: pasireotide
      selected_evidence:
        snippet: mUFC was ≤ULN in 42/81 (51.9%), 13/81 (16.0%) and 43/81 (53.1%) patients at extension
          baseline, month (M) 36 and last assessment.
        supports: SUPPORT
