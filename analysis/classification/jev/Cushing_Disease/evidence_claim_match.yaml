            term:
              id: MONDO:0009050
              label: Cushing disease due to pituitary adenoma
        context: []
      assertion_type: Treatment
      assertion:
        name: Transsphenoidal Selective Adenomectomy
        therapeutic_modality: SURGERY
        description: 'First-line treatment and the only one that addresses the lesion itself. Reported
          initial remission in a 1106-patient single-centre series was 72.5%, with about a quarter left
          in persistent hypercortisolism. Remission is substantially lower with invasive tumours, macroadenomas,
          pathologically negative specimens and repeat surgery, so the figure quoted for any given patient
          depends on which of those apply. Remission is not the end of the story: recurrence occurred
          in 27.4% of patients over a median 38 months in one operated series, and is markedly higher
          after macroadenoma resection than after microadenoma or no visible lesion (45% versus 19%).
          An early postoperative nadir cortisol at or below 3 mcg/dL is the best available predictor of
          durable remission.'
        treatment_term:
          preferred_term: surgical procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: After surgery, the overall postoperative initial remission rate was 72.5, and 27.5% of
          patients maintained persistent hypercortisolism.
        supports: SUPPORT
