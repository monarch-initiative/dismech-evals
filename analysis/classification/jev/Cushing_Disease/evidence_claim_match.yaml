  f79e6676c9eb87fa5c5ddbbd50e840f53e0fd6939fd228c8bf30fa73934334e3:
    claim:
      about:
        disease:
          name: Cushing Disease
          disease_term:
            preferred_term: Cushing disease due to pituitary adenoma
            term:
              id: MONDO:0009050
              label: Cushing disease due to pituitary adenoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic Driver Mutation in the Corticotroph
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: A somatic variant arises in a single anterior pituitary corticotroph and gives it
          a growth and secretory advantage. USP8 is the commonest driver, with variants clustering in
          the 14-3-3 protein binding motif rather than being distributed across the gene - a positional
          pattern that signals a gain-of-function mechanism rather than loss of the protease. In USP8
          wild-type tumours the drivers are USP48 (p.M415I/p.M415V) and BRAF p.V600E. The three are close
          to mutually exclusive across a 169-tumour series, which is the evidence that they are alternative
          entries into one pathway. Loss-of-function variants in NR3C1, the glucocorticoid receptor, appear
          in a minority and attack the same autonomy from the feedback side.
        genetic_context:
          gene:
            preferred_term: USP8
            term:
              id: hgnc:12631
              label: USP8
          functional_impact_category: GAIN_OF_FUNCTION
          variant_origin: SOMATIC
        molecular_functions:
        - preferred_term: cysteine-type deubiquitinase activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004843
            label: cysteine-type deubiquitinase activity
        biological_processes:
        - preferred_term: protein deubiquitination
          modifier: INCREASED
          term:
            id: GO:0016579
            label: protein deubiquitination
        cell_types:
        - preferred_term: corticotroph
          term:
            id: CL:0002309
            label: corticotroph
        locations:
        - preferred_term: adenohypophysis
          term:
            id: UBERON:0002196
            label: adenohypophysis
      selected_evidence:
        snippet: We found somatic mutations in the USP8 deubiquitinase gene in 4 of 10 adenomas. The mutations
          clustered in the 14-3-3 protein binding motif and enhanced the proteolytic cleavage and catalytic
          activity of USP8.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25485838
      reference_title: Mutations in the deubiquitinase gene USP8 cause Cushing's disease.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the somatic USP8 driver and the positional clustering that indicates gain
