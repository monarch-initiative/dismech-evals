              label: osilodrostat
      selected_evidence:
        snippet: More patients maintained a complete response with osilodrostat versus with placebo at
          week 34 (31 [86%] vs ten [29%]; odds ratio 13·7 [95% CI 3·7-53·4]; p<0·0001).
        supports: SUPPORT
