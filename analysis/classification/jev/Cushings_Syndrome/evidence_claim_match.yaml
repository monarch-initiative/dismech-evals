        description: 'Chronic cortisol excess induces insulin resistance, hepatic gluconeogenesis, protein
          catabolism in muscle and skin, redistribution of adipose tissue to central deposits, and altered
          lipid metabolism, leading to the characteristic phenotypic features of the syndrome.

          '
        biological_processes:
        - preferred_term: response to glucocorticoid
          term:
            id: GO:0051384
            label: response to glucocorticoid
      selected_evidence:
        snippet: Cushing syndrome is associated with hyperglycemia, protein catabolism, immunosuppression,
          hypertension, weight gain, neurocognitive changes, and mood disorders.
        supports: SUPPORT
