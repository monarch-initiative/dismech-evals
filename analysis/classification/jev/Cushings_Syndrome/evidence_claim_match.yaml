      assertion_type: Pathophysiology
      assertion:
        name: Chronic Cortisol Excess
        description: 'Cushing''s syndrome results from prolonged exposure to excess glucocorticoids, either
          exogenous (iatrogenic from corticosteroid therapy) or endogenous (from pituitary adenomas secreting
          ACTH, adrenal tumors, or ectopic ACTH production). Elevated cortisol causes widespread metabolic,
          immunologic, and cardiovascular effects.

          '
        biological_processes:
        - preferred_term: glucocorticoid secretion
          term:
            id: GO:0035933
            label: glucocorticoid secretion
        cell_types:
        - preferred_term: glucocorticoid secreting cell
          term:
            id: CL:0000460
            label: glucocorticoid secreting cell
      selected_evidence:
        snippet: Cushing syndrome is defined as a prolonged increase in plasma cortisol levels that is
          not due to a physiological etiology.
        supports: SUPPORT
    origin:
