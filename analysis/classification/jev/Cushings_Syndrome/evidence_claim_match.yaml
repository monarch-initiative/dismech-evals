      assertion_type: Pathophysiology
      assertion:
        name: Hypothalamic-Pituitary-Adrenal Axis Dysregulation
        description: 'In endogenous Cushing''s, the normal negative feedback regulation of cortisol on
          the HPA axis is disrupted. ACTH-dependent forms involve autonomous ACTH secretion from pituitary
          or ectopic sources, while ACTH-independent forms involve autonomous adrenal cortisol production
          bypassing normal regulation.

          '
        cell_types:
        - preferred_term: corticotroph
          term:
            id: CL:0002309
            label: corticotroph
      selected_evidence:
        snippet: Cushing disease, in which corticotropin excess is produced by a benign pituitary tumor,
          occurs in approximately 60% to 70% of patients with Cushing syndrome due to endogenous cortisol
          production.
        supports: SUPPORT
