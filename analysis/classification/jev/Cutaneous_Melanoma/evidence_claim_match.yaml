  dd5cff85b102211011d02fffffd9536a417e73e4fc6ba10c8be52796140dbc1f:
    claim:
      about:
        disease:
          name: Cutaneous Melanoma
          disease_term:
            preferred_term: cutaneous melanoma
            term:
              id: MONDO:0005012
              label: cutaneous melanoma
        context:
        - path: /experimental_models/0
          value:
            name: Xmrk-activated melanocytes in three-dimensional dermal collagen
            experimental_model_type: CELL_LINE
            culture_system: Three-dimensional type I collagen gel reconstituting the dermal environment
            publication: PMID:12183442
            description: Melanocytes carrying the Xiphophorus melanoma receptor tyrosine kinase Xmrk are
              embedded in a three-dimensional collagen I gel, the matrix that normally kills melanocytes
              that leave the epidermis. The assay asks what an activated receptor has to supply for a
              pigment cell to survive in the dermis, which is the step a melanoma must take to move from
              radial to vertical growth. Differential display in this system identified osteopontin as
              the secreted factor that permits it, and osteopontin has since become a prognostic marker
              in human melanoma. The system is the in-vitro arm of the Xiphophorus melanoma model and
              is how a fish oncogene was used to name a human invasion mechanism.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Invasive Plasticity and Migration
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Reconstitutes the survival barrier a melanocyte meets on entering the dermis, and
          identifies receptor-driven osteopontin secretion acting through integrin alpha-v beta-3 as the
          autocrine loop that overcomes it.
        limitations: A three-dimensional gel is not a vascularized dermis and reports survival and spreading
          rather than true invasion, vascular entry, or distant colonization, so it covers only the first
          step of the node. The driving receptor is the fish Xmrk oncogene rather than a human melanoma
          driver, and the assay carries no immune or stromal compartment. The responding cell is a cultured
          melanocyte line rather than a human melanocyte in situ, so any species difference between that
          host cell and human melanocytes is uncontrolled here and is a second translational gap alongside
          the fish receptor. Treat it as evidence for the osteopontin mechanism, not for metastatic competence.
        readouts:
        - name: Melanocyte survival and spreading in collagen I with and without osteopontin
          target: Invasive Plasticity and Migration
          description: Adhesion, spreading, and apoptosis of melanocytes in three-dimensional collagen
            gels, scored against osteopontin availability in the medium.
          direction: RESTORED
          interpretation: Osteopontin is sufficient to rescue melanocytes from matrix-induced apoptosis
            and necessary for the receptor-driven rescue, which is what identifies it as the effector
            of dermal survival.
      selected_evidence:
        snippet: In melanocytes, expression of the secreted adhesion protein OPN was up-regulated by the
          melanoma-inducing receptor tyrosine kinase Xmrk
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0/modeled_mechanisms/0
      evidence_path: /experimental_models/0/modeled_mechanisms/0/evidence/0
      context_paths:
