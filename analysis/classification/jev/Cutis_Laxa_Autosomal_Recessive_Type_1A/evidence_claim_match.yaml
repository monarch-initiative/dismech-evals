  ec24debf21ab26b6877a7f8f1392461ec938073bc417cb845423ac064c9f62c1:
    claim:
      about:
        disease:
          name: Cutis Laxa Autosomal Recessive Type 1A
          disease_term:
            preferred_term: Cutis Laxa Autosomal Recessive Type 1A
            term:
              id: MONDO:0009052
              label: cutis laxa, autosomal recessive, type 1A
        context: []
      assertion_type: Genetic
      assertion:
        name: FBLN5
        gene_term:
          preferred_term: FBLN5
          term:
            id: hgnc:3602
            label: FBLN5
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        features: FBLN5 encodes fibulin-5 (DANCE, EVEC), a calcium-dependent elastin-binding matrix protein
          that localizes to the surface of elastic fibers and binds cell-surface integrins through an
          RGD motif. Biallelic loss-of-function variants cause this disorder; heterozygous dominant FBLN5
          alleles cause the distinct autosomal dominant cutis laxa type 2.
        notes: No ClinGen gene-disease validity assertion exists for FBLN5 and this disease; the only
          cached ClinGen FBLN5 record concerns demyelinating hereditary motor and sensory neuropathy.
        variants:
        - name: c.998T>C (p.Ser227Pro)
          description: Homozygous in a consanguineous Turkish family with four affected and in an Iranian
            recessive pedigree sharing the same intragenic haplotype. Fourth cbEGF-like domain. Misfolds,
            is secreted slowly, triggers ER stress, and binds tropoelastin and fibrillin-1 poorly.
          clinical_significance: PATHOGENIC
          type: missense_variant
        - name: c.649T>C (p.Cys217Arg)
          description: Homozygous in a Lebanese family and in a second Lebanese family likely sharing
            a common ancestor. Removes a disulfide-bonded cysteine in the fourth cbEGF-like domain; the
            recombinant mutant binds tropoelastin poorly and is not incorporated into elastic fibers.
          clinical_significance: PATHOGENIC
          type: missense_variant
        - name: c.1171G>T (p.Glu391Ter)
          description: Homozygous nonsense allele in a consanguineous Algerian family.
          clinical_significance: PATHOGENIC
          type: stop_gained
        - name: c.432C>G (p.Cys144Trp)
          description: Homozygous in a girl with emphysema, valve prolapse and conjunctivochalasis; parents
            heterozygous.
          type: missense_variant
        - name: c.518A>G (p.Arg173His)
          description: Homozygous in a child with parents heterozygous; classified by the authors only
            as possibly pathogenic on bioinformatic grounds.
          type: missense_variant
        - name: c.862G>T (p.Asp288Tyr)
          description: Homozygous in a Turkish girl; unaffected parents were carriers.
          type: missense_variant
        - name: c.544G>C (p.Ala182Pro)
          description: Homozygous in monozygotic twins from a consanguineous Iranian family who lacked
            pulmonary, gastrointestinal and genitourinary complications; only one twin had a ventricular
            septal defect.
          type: missense_variant
      selected_evidence:
        snippet: we provide evidence that a genetic defect in fibulin-5 (FBLN5, also known as EVEC or
          DANCE) is responsible for a recessive form of cutis laxa in humans
        supports: SUPPORT
