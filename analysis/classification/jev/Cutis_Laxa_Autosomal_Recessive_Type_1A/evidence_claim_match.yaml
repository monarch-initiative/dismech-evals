        description: Germline homozygous FBLN5 variants. Most reported alleles are missense substitutions
          in calcium-binding EGF-like domains (S227P and C217R in the fourth cbEGF domain, C144W), with
          one nonsense allele (E391X). Recessive alleles cause loss of function through misfolding and
          intracellular retention, in contrast to the heterozygous dominant FBLN5 alleles of ADCL2.
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: FBLN5
