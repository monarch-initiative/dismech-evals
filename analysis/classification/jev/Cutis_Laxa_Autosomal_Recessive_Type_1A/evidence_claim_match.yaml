            label: FBLN5
        molecular_functions:
        - preferred_term: fibulin-5 elastin binding
          modifier: DECREASED
          term:
            id: GO:0050840
            label: extracellular matrix binding
      selected_evidence:
        snippet: Here we show that fibulin-5 is a calcium-dependent, elastin-binding protein that localizes
          to the surface of elastic fibres in vivo.
        supports: SUPPORT
