      assertion_type: Discussion
      assertion:
        discussion_id: arcl2e_no_independent_replication
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the ARCL2E phenotype hold outside the four founding families, and does the N-terminal
          versus C-terminal split carry any clinical consequence?
        attaches_to:
        - pathophysiology#Biallelic LTBP1 Premature Truncating Variants
        - genetic#LTBP1
        rationale: 'The disorder rests on one publication. Every frequency in this entry is a fraction
          of eight, every functional claim about the branch split comes from two fibroblast lines, and
          the ascertainment was entirely through consanguineous families identified by research sequencing.
          What a non-consanguineous compound heterozygote looks like is unknown, and so is whether the
          N-terminal and C-terminal classes differ clinically rather than only in cell culture.

          The only other human LTBP1 finding located is a candidate variant in a craniosynostosis sequencing
          cohort, reported without segregation, zygosity or functional work, and grouped by its authors
          with other variants of uncertain relevance. It is a lead for where the second cohort might come
          from, not a replication.'
      selected_evidence:
        snippet: Moreover, we identified potentially relevant variants in 87% of the remaining families
          with no previously detected causal variants, including novel variants in ADAMTSL4, ASH1L, ATRX,
          C2CD3, CHD5, ERF, H4C5, IFT122, IFT140, KDM6B, KMT2D, LTBP1, MAP3K7, NOTCH2, NSD1, SOS1, SPRY1,
          POLR2A, PRRX1, RECQL4, TAB2, TAOK1, TET3, TGFBR1, TCF20, and ZBTB20.
        supports: NO_EVIDENCE
