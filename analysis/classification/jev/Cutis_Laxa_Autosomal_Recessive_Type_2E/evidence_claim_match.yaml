            term:
              id: MONDO:0030337
              label: cutis laxa, autosomal recessive, type 2E
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: arcl2e_zebrafish_no_craniosynostosis
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Can craniosynostosis be modelled in an ltbp1-deficient animal at all, and if not, what
          system would test the suture mechanism?
        attaches_to:
        - pathophysiology#Impaired Skeletal Matrix Assembly and Ossification
        - animal_models#Zebrafish
        rationale: 'Craniosynostosis is present in three-quarters of affected humans and is the feature
          that separates this disorder from the rest of the cutis laxa group, yet neither zebrafish line
          develops it - the interfrontal, coronal, sagittal and lambdoid sutures are all normal, as is
          craniofacial morphology. The mouse literature offers only minor craniofacial abnormalities in
          an Ltbp1-null. So the single most diagnostically useful feature of ARCL2E currently has no animal
          model, and the proposed reduced-TGF-beta-in-bone mechanism has never been tested in a system
          that produces the phenotype.

          The authors suggest genetic compensation, or residual mutant transcript, as reasons the fish
          may be protected, and propose an RNA-less allele as the test. Neither explanation has been evaluated.'
      selected_evidence:
        snippet: A possible explanation for the lack of these features could be the induction of genetic
          compensation mechanisms, which could partly rescue the craniosynostosis phenotype.
        supports: SUPPORT
