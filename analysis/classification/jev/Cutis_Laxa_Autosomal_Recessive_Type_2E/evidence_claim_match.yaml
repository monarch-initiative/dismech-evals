  5221e665616c4f56e3949f16ee626c82bbc417991f70055d829e73845805995a:
    claim:
      about:
        disease:
          name: Cutis Laxa Autosomal Recessive Type 2E
          disease_term:
            preferred_term: LTBP1-related cutis laxa syndrome
            term:
              id: MONDO:0030337
              label: cutis laxa, autosomal recessive, type 2E
        context: []
      assertion_type: Genetic
      assertion:
        name: LTBP1
        gene_term:
          preferred_term: LTBP1
          term:
            id: hgnc:6714
            label: LTBP1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        features: LTBP1 encodes latent TGF-beta binding protein 1, a multidomain secreted matrix protein
          with fifteen calcium-binding EGF-like domains, three EGF-like domains, two TGF-beta-binding
          domains, a hybrid motif and a 4-cysteine domain. It tethers the small latent TGF-beta complex
          to the matrix and is anchored there through its C-terminal region to fibrillin-1 and its N-terminal
          region to fibronectin. Two promoters give a long and a short isoform; variant numbering in the
          source uses the long isoform, GenBank NM_206943.4.
        notes: 'All four reported alleles are premature termination codons, and it would be natural to
          record the gene as simply loss of function. The functional work argues against collapsing them
          that way. The one N-terminal allele tested undergoes nonsense-mediated decay and behaves as
          a null; the C-terminal alleles escape decay and produce a protein that is made, secreted, and
          incorporated into rudimentary fibers while binding fibrillin poorly - a protein present and
          misbehaving rather than absent. The functional_impact_category on the initiating pathophysiology
          node is recorded as LOSS_OF_FUNCTION because that is what the authors demonstrate for the alleles
          at the protein-function level, but the downstream cellular phenotype of the C-terminal class
          is one of excess matrix and excess signaling.

          Two fibroblast lines is the entire functional dataset, one allele per class, so the split is
          a two-sample observation and the authors say so explicitly. No genotype-phenotype correlation
          can be drawn from the clinical data either: the individual without craniosynostosis and the
          individual with severe intellectual disability carry different alleles from each other, and
          the numbers are far too small to test.'
        variants:
        - name: c.1342C>T (p.Gln448*)
          description: Family 4, Saudi Arabian. Homozygous nonsense variant in exon 7, altering the second
            EGF-like domain. Undergoes nonsense-mediated decay; the fibroblasts show no LTBP1 protein,
            reduced FBN1 mRNA, and normal TGF-beta levels and Smad2 phosphorylation.
        - name: c.4844del (p.Asn1615Ilefs*23)
          description: Family 1, Turkish. Homozygous frameshift in exon 29, altering the third EGF-like
            domain. Escapes nonsense-mediated decay; the fibroblasts show rudimentary LTBP1 fibers, loss
            of fibulin-4 from the matrix, increased LTBP2, increased total TGF-beta and an increased pSmad2/Smad2
            ratio.
        - name: c.4431T>A (p.Cys1477*)
          description: Family 2, Pakistani; four affected individuals. Homozygous nonsense variant in
            exon 26, altering the 13th calcium-binding EGF-like domain. No fibroblasts were available;
            the recombinant C-terminal fragment carrying this variant shows the same reduced fibrillin-1
            and fibrillin-2 binding as the c.4844del fragment.
        - name: c.3991dup (p.Thr1331Asnfs*22)
          description: Family 3, Pakistani; two affected individuals. Homozygous duplication in exon 23,
            altering the 12th calcium-binding EGF-like domain. The original publication described this
            allele as c.3991_3995del (p.Thr1331Asnfs*20); a 2021 erratum corrected it to c.3991dup (p.Thr1331Asnfs*22).
            The corrected form is the one recorded here.
      selected_evidence:
        snippet: 'Exome sequencing (ES) identified homozygous premature truncating variants in LTBP1 (GenBank:
          NM_206943.4) in eight affected children from four different families.'
        supports: SUPPORT
