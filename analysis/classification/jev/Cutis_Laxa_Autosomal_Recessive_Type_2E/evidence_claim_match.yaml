              label: cutis laxa, autosomal recessive, type 2E
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other autosomal recessive cutis laxa syndromes
        description: The cutis laxa group is genetically heterogeneous and the skin phenotype alone does
          not discriminate within it. ARCL2A (ATP6V0A2), ARCL2B and ARCL3 (PYCR1, ALDH18A1), ARCL1A (FBLN5)
          and ARCL1B (EFEMP2) all present with loose skin in infancy.
        distinguishing_features:
        - The skeletal constellation - craniosynostosis with short stature, brachydactyly, clinodactyly
          and syndactyly - is what the authors identify as separating ARCL2E from the rest of the group.
        - ARCL2A carries a combined N- and O-linked glycosylation abnormality on serum transferrin and
          apolipoprotein C-III isoelectric focusing; no glycosylation abnormality is reported in ARCL2E.
        - Progeroid appearance, corpus callosum dysgenesis and dystonic posturing point to PYCR1 or ALDH18A1
          rather than LTBP1.
        notes: The glycosylation and neuroimaging discriminators listed above are properties of the comparator
          disorders, curated in this repository's ARCL2A entry from its own sources. They are stated here
          as differentiating features rather than cited to the LTBP1 paper, which does not discuss them.
      selected_evidence:
        snippet: The craniofacial features, short stature, brachydactyly, variable craniosynostosis, and
          variable mild heart defects clearly distinguish this AR CL syndrome from other subtypes of CL
          syndrome.
        supports: SUPPORT
