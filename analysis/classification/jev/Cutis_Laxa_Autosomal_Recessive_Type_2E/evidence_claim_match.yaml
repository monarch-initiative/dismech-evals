  8fe820c2ebee44454ff34ecef1f77f2506b5e30353934bc00a43e3432972f4f4:
    claim:
      about:
        disease:
          name: Cutis Laxa Autosomal Recessive Type 2E
          disease_term:
            preferred_term: LTBP1-related cutis laxa syndrome
            term:
              id: MONDO:0030337
              label: cutis laxa, autosomal recessive, type 2E
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ltbp1_tissue_specific_tgfbeta
        hypothesis_label: Tissue-Specific Direction of TGF-beta Dysregulation
        status: EMERGING
        description: 'The TGF-beta abnormality demonstrated in ARCL2E is an increase, and it was measured
          in dermal fibroblasts from one individual carrying a C-terminal allele. The authors argue that
          the skeletal phenotype may require the opposite: craniosynostosis has been produced in mice
          by reducing TGF-beta bioavailability in the bone matrix through Ltbp3 ablation, and skull deformities
          are reported in Ltbp1-null mice. Under this model the direction of the TGF-beta change is set
          by the local matrix rather than by the variant, so dermis and cranial suture can move in opposite
          directions from the same genotype.

          Nothing in the published work measures TGF-beta in human ARCL2E bone or suture tissue, so the
          skeletal limb of this model is unmeasured. A competing possibility the same authors raise is
          that the relevant LTBP1 function in bone is not TGF-beta handling at all.'
      selected_evidence:
        snippet: However, the mechanisms controlling the tissue bioavailability of TGFβ are most likely
          tissue specific.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
