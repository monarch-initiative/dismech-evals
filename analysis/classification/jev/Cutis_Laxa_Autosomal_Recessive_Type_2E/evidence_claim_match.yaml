      assertion_type: Discussion
      assertion:
        discussion_id: arcl2e_mouse_human_cardiac_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why is Ltbp1 loss lethal in the mouse heart and survivable in humans, and what does that
          imply for using rodent data to predict human cardiovascular risk?
        attaches_to:
        - pathophysiology#Biallelic LTBP1 Premature Truncating Variants
        - animal_models#Mouse
        rationale: 'Ltbp1L-null and Ltbp1-null mice die perinatally with persistent truncus arteriosus
          and interrupted aortic arch, from decreased TGF-beta activity in the outflow tract. Humans homozygous
          for premature truncating LTBP1 variants have no conotruncal defect, survive into adolescence
          at least, and show mild variable cardiac findings instead. The zebrafish lines have normal cardiac
          function on ultrasound. The mismatch is not a detail: it is the reason the mouse literature
          cannot be used to counsel cardiac risk in this disorder, and it is a specific argument that
          LTBP paralog redundancy differs between species.

          It also cuts the other way. The absence of a severe cardiac phenotype in eight humans is not
          the same as its absence in the disorder, and the oldest individual reported was 17 years 5 months.
          Adult cardiovascular outcome in ARCL2E is simply unobserved.'
      selected_evidence:
        snippet: Remarkably, Ltbp1L−/− and Ltbp1−/− mice present with truncus arteriosus, interrupted
          aortic arch, and perinatal lethality. Our observations imply differences in functional redundancy
          of LTBP family members or other compensatory mechanisms for Ltbp1 deficiency in mice versus
          humans and teleosts.
        supports: SUPPORT
