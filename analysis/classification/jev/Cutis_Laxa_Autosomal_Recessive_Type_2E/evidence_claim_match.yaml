        description: Craniosynostosis is present in three-quarters of reported individuals, the suture
          pattern is not stereotyped, and a copper-beaten calvarium indicating raised intracranial pressure
          was documented radiographically in two. Suture imaging is therefore part of the assessment of
          any child with this diagnosis, not only those with an obviously abnormal head shape. This is
          reasoning from the reported findings rather than a published surveillance protocol, of which
          none exists.
