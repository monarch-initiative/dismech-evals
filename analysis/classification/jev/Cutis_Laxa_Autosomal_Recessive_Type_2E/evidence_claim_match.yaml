      assertion_type: ExperimentalModel
      assertion:
        name: Proband dermal fibroblast cultures (c.4844del and c.1342C>T)
        experimental_model_type: PRIMARY_CELL_CULTURE
        description: Primary dermal fibroblasts from two probands, one per truncation class, each compared
          against two age- and sex-matched control lines. This is the entire functional dataset for the
          disorder, and every mechanistic claim about the branch split rests on it. Skin biopsies were
          unavailable from the other six affected individuals.
        modeled_mechanisms:
        - target: Excess TGF-beta Activation and Canonical Smad2 Signaling
          relationship: MEASURES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Total TGF-beta by ELISA in conditioned medium, pSmad2/Smad2 by immunoblot, CTGF
            and POSTN by RT-qPCR.
          limitations: One proband line per truncation class, and dermal fibroblasts cannot report the
            bone and suture compartments where the skeletal phenotype arises. The authors note that growth
            factor signaling in fibroblasts may not represent osteogenic pathways.
          readouts:
          - name: Total TGF-beta in conditioned medium
            target: Excess TGF-beta Activation and Canonical Smad2 Signaling
            direction: INCREASED
            interpretation: Increased in the C-terminal-variant line only.
        - target: Failure of Fibulin-4 Incorporation into the Elastic Fiber Scaffold
          relationship: MEASURES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Immunofluorescent analysis of the matrix fraction at 9 days post-confluency for
            fibulin-4, LTBP1, LTBP2, fibrillin-1, and collagens I and III.
          limitations: A confluent fibroblast monolayer builds a matrix that is not dermis, and one line
            per branch gives no measure of between-individual variation.
      selected_evidence:
        snippet: We used dermal fibroblasts cultured from skin biopsies of F1:IV-2 and F4:II-1 in this
          study. Skin biopsies of F2:V-3, F2:V-4, F2:V-8, F2:V-9, F3:II-1, and F3:II-2 are not available.
        supports: SUPPORT
