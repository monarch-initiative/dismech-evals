  a8c91d2c811ac09464dd1115d75bcfe7a6ef54f762dcf64a9fe068b8bc27f1f5:
    claim:
      about:
        disease:
          name: Cyanide Poisoning
          disease_term:
            preferred_term: cyanide poisoning
            term:
              id: MONDO:0018754
              label: cyanide poisoning
        context: []
      assertion_type: Treatment
      assertion:
        name: Hydroxocobalamin
        description: 'First-line antidote for confirmed cyanide poisoning. The cobalt(III) centre binds
          cyanide in a 1:1 ratio to form cyanocobalamin, which is excreted in urine. It does not impair
          oxygen-carrying capacity, which is the basis for giving it empirically to a fire victim whose
          carboxyhaemoglobin status is unknown - unlike the nitrites, which would compound the hypoxia.
          That empiric indication is where the evidence is weakest: a 2025 systematic review of 1238 patients
          found no mortality benefit in smoke inhalation and signals for acute kidney injury and methaemoglobinaemia.
          Chromaturia and pink skin discoloration are the usual adverse effects in confirmed poisoning.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: hydroxocobalamin
            term:
              id: CHEBI:27786
              label: hydroxocobalamin
      selected_evidence:
        snippet: Hydroxocobalamin is an attractive antidote due to its rapid cyanide binding and its lack
          of serious side-effects, even in the absence of cyanide intoxication.
