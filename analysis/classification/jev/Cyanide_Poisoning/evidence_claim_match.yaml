      assertion:
        name: Basal Ganglia Necrosis
        description: 'The globus pallidus and putamen sustain bilateral, often haemorrhagic necrosis,
          visible as altered signal on MRI within weeks. The lesion is not confined there: the sensorimotor
          cortex can show pseudolaminar necrosis for the same reason - high oxygen dependency - and imaging
          series also report cerebellar and cortical involvement. The node is named for the basal ganglia
          because that is the consistent and clinically decisive site, and it is the substrate of the
          delayed dystonic-parkinsonian syndrome.'
        biological_scale: TISSUE
        locations:
