          preferred_term: carbon monoxide poisoning
          term:
            id: MONDO:0800373
            label: carbon monoxide poisoning
        description: The most important differential and, in fire victims, usually a co-exposure rather
          than an alternative. Both are products of the same fire and both produce impaired tissue oxygen
          use with depressed consciousness.
        distinguishing_features:
        - Carbon monoxide poisoning is confirmed rapidly by carboxyhaemoglobin on co-oximetry, whereas
          no comparably fast cyanide assay exists.
        - 'The practical consequence runs the other way from most differentials: a fire victim with a
          raised carboxyhaemoglobin should be presumed cyanide-exposed as well, so the two are co-treated
          rather than discriminated.'
        - Carboxyhaemoglobinaemia is a reason to avoid the methaemoglobin-forming antidotes, which would
          compound the loss of oxygen-carrying capacity.
      selected_evidence:
        snippet: We usually encounter carbon monoxide intoxication, but it is necessary to think about
          the possibility of poisoning by other combustion products.
        supports: SUPPORT
