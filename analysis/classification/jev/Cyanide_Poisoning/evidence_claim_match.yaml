        kind: KNOWLEDGE_GAP
        prompt: Does TST (rhodanese) genotype predict individual susceptibility to cyanide poisoning in
          exposed humans?
        attaches_to:
        - genetic#TST
        - pathophysiology#Rhodanese-Mediated Cyanide Detoxification
        rationale: 'The enzymology is settled: functional TST promoter and coding variants cut expression
          by 40-73% and intrinsic clearance by half. What is missing is any demonstration that carriers
          of these alleles are actually more susceptible. The variants were characterised in fifty French
          individuals with no exposure outcome attached, and no poisoned or occupationally exposed cohort
          has been genotyped. Until one is, the pathway from genotype to clinical risk is an inference
          from in vitro clearance, not an observation.'
      selected_evidence:
        snippet: This work constitutes the first report of the existence of a functional genetic polymorphism
          affecting TST activity and should be of great help to investigate certain disorders for which
          impairment of CN(-) or H(2)S detoxification have been suggested to be involved.
        supports: SUPPORT
