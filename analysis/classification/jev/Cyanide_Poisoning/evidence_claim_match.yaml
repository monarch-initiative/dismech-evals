        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Acute toxidrome
        duration: Seconds to hours from exposure
        notes: Onset is seconds to minutes after hydrogen cyanide inhalation, minutes after ingestion
          of a cyanide salt, and 30 minutes to several hours after ingestion of cyanogenic glycosides,
          which must be hydrolysed first. The course runs from headache, vertigo, weakness and tachypnea,
          through confusion and hypotension, to seizures, coma and cardiovascular collapse, and can traverse
          the whole range within minutes at high dose.
      selected_evidence:
        snippet: This process prevents aerobic metabolism, which results in diffuse clinical symptoms
          such as dizziness, headache, weakness, and tachypnea, with progression to seizures, paralysis,
          and coma
        supports: SUPPORT
