      assertion_type: Genetic
      assertion:
        name: TST
        relationship_type: MODIFIER
        gene_term:
          preferred_term: TST
          term:
            id: hgnc:12388
            label: TST
        notes: TST encodes rhodanese (thiosulfate sulfurtransferase), the mitochondrial enzyme that detoxifies
          cyanide to thiocyanate. Functional promoter and coding polymorphisms reduce enzyme expression
          and intrinsic clearance, so TST genotype is a plausible determinant of individual cyanide susceptibility.
          These are population-frequency modifier alleles, not Mendelian pathogenic variants, and they
          have not been validated as clinical risk predictors in poisoned cohorts.
      selected_evidence:
        snippet: The P(285)A variant appears to encode a protein with a 50% decrease of in vitro intrinsic
          clearance compared to the wild-type enzyme.
        supports: SUPPORT
