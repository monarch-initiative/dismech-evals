      assertion_type: Discussion
      assertion:
        discussion_id: cyanide_empiric_hydroxocobalamin_smoke_inhalation
        kind: KNOWLEDGE_GAP
        prompt: Does empiric hydroxocobalamin improve outcome in smoke-inhalation victims with suspected
          but unconfirmed cyanide toxicity?
        attaches_to:
        - treatments#Hydroxocobalamin
        - environmental#Structure fire smoke inhalation
        rationale: 'Hydroxocobalamin is first-line for confirmed cyanide poisoning, and its safety profile
          is what justifies giving it empirically at a fire scene where no cyanide assay is available.
          But the evidence for that empiric use is thin: a 2025 systematic review of six studies and 1238
          patients found similar mortality between hydroxocobalamin and supportive treatment, with signals
          for acute kidney injury and methaemoglobinaemia, and could not pool the data. The same uncertainty
          runs the other way in the exposure literature, where a forensic series argues cyanide is an
          infrequent independent contributor to fire deaths. Resolving it needs a randomised trial that
          has never been done.'
      selected_evidence:
        snippet: Well-designed randomized controlled trials are urgently needed to establish optimal treatment
          strategies for this patient population.
        supports: SUPPORT
