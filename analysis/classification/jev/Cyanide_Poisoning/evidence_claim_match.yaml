      assertion_type: AnimalModel
      assertion:
        name: Mouse lethal cyanide poisoning model (inhaled and intraperitoneal)
        species: Mouse
        publication: PMID:20704457
        description: Paired inhaled and intraperitoneal mouse models of lethal cyanide poisoning used
          to rank antidote efficacy. Cobinamide, the cobalamin precursor, outperformed hydroxocobalamin,
          sodium thiosulfate, sodium nitrite, and the thiosulfate-nitrite combination, and rescued mice
          given cobinamide sulfite intramuscularly after more than two minutes of apnoea.
        modeled_mechanisms:
        - target: Systemic Cyanide Burden
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Delivers a controlled lethal systemic cyanide burden by two routes that mirror
            the human inhalational and parenteral exposures.
          limitations: Antidote potency ratios derived in mice have not translated into human efficacy
            data; cobinamide remains investigational, and the model uses pre-planned dosing with immediate
            treatment rather than the delayed, uncertain-dose presentation of real poisoning.
      selected_evidence:
        snippet: We found Cbi more effective than hydroxocobalamin, sodium thiosulfate, sodium nitrite,
          and the combination of sodium thiosulfate-sodium nitrite in treating cyanide poisoning.
        supports: SUPPORT
