      assertion_type: Pathophysiology
      assertion:
        name: Cytochrome c Oxidase Inhibition
        description: 'Cyanide binds with high affinity to the ferric heme a3 centre of cytochrome c oxidase
          (mitochondrial Complex IV), the oxygen-reducing terminus of the electron transport chain, and
          reversibly arrests the transfer of electrons to molecular oxygen. Nitric oxide modulates this
          in a dose-dependent and two-directional way: constitutive, low-level mitochondrial NO potentiates
          the inhibition, which is part of why onset is so fast, while high exogenous NO attenuates it
          - which is why the same molecule appears here as an aggravating factor and under Sodium Nitrite
          as the antidotal one.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: cytochrome-c oxidase activity
          modifier: DECREASED
          term:
            id: GO:0004129
            label: cytochrome-c oxidase activity
        cellular_components:
        - preferred_term: mitochondrial respiratory chain complex IV
          term:
            id: GO:0045277
            label: respiratory chain complex IV
      selected_evidence:
        snippet: Acute cyanide toxicity is attributed to inhibition of cytochrome c oxidase (CcOX), the
          oxygen-reducing component of mitochondrial electron transport
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
