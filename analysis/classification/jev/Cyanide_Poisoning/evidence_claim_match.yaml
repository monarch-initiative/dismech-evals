          potential and the transporters that clear synaptic glutamate. The clinical expression is immediate
          and graded, from headache and vertigo through confusion to seizures and coma.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Particularly harmful to neurons is the malfunction of glutamate transport and sodium/potassium
          ion exchangers, contributing to excitotoxicity due to excessive extracellular glutamate
        supports: SUPPORT
