      assertion_type: AnimalModel
      assertion:
        name: Gottingen minipig lethal KCN bolus model
        species: Pig
        publication: PMID:31389254
        description: Anaesthetised Gottingen minipig model in which bolus potassium cyanide injection
          at doses comparable to human lethal doses simulates high-dose hydrogen cyanide inhalation, used
          to quantify antidote efficacy against lactate and survival endpoints. Licensed doses of dicobalt
          edetate and hydroxocobalamin were effective at just-lethal doses and failed at less than twice
          the estimated LD50.
        modeled_mechanisms:
        - target: Anaerobic Glycolytic Shift
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Bolus KCN reproduces the dose-dependent arterial lactate rise that defines the
            metabolic lesion in human poisoning, and the lactate endpoint is the same one used clinically.
          limitations: Antidotes were given before exposure rather than after, which is the opposite of
            the clinical sequence and makes the observed efficacy an upper bound; the authors say so explicitly.
          readouts:
          - name: Arterial lactate concentration
            target: Anaerobic Glycolytic Shift
            direction: INCREASED
            interpretation: Dose-dependent arterial lactate rise as the metabolic correlate of cyanide
              exposure in this model.
      selected_evidence:
        snippet: In this porcine study of cyanide exposure, with pre-exposure antidote administration,
          licenced doses of dicobalt edetate and hydroxocobalamin were effective at just lethal doses
          but ineffective at less than twice the estimated LD50.
        supports: SUPPORT
