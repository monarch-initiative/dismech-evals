      assertion_type: Definition
      assertion:
        name: Clinical case definition for acute cyanide poisoning
        definition_type: CASE_DEFINITION
        description: Acute cyanide poisoning is a toxidrome in which absorbed cyanide inhibits cellular
          oxygen utilization, recognised from a compatible exposure history (fire smoke, cyanide salt,
          cyanogenic glycoside, or nitroprusside infusion) together with rapidly progressive depressed
          consciousness, cardiovascular instability, and high-anion-gap lactic acidosis. Confirmatory
          blood cyanide measurement is rarely available in time, so plasma lactate is the practical diagnostic
          surrogate.
        scope: Disease-level clinical framing for acute poisoning and its delayed sequelae
      selected_evidence:
        snippet: Cyanide poisoning is a life-threatening condition that impairs cellular oxygen utilization,
          leading to lactic acidosis.
        supports: SUPPORT
    origin:
