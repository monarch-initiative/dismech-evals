        context:
        - path: /animal_models/1
          value:
            name: Grey Collie canine cyclic hematopoiesis
            species: Dog
            genotype: AP3B1 frameshift, homozygous
            publication: PMID:35904319
            description: 'The classical animal model, described in Grey Collies as the lethal grey syndrome.
              It reproduces the oscillation itself, on a twelve-day rather than a twenty-one-day cycle,
              and historically it shaped how the human disease was understood. It is genetically distinct:
              the canine disease is a recessive AP3B1 defect, not an ELANE one.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Oscillatory Granulopoiesis
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Reproduces a genuine cyclic oscillation of neutrophils originating in the bone marrow,
          confirmed by reciprocal bone marrow transplantation.
        limitations: 'Genetically distinct from the human disease: a homozygous recessive AP3B1 frameshift
          rather than a heterozygous dominant ELANE mutation, with a twelve to fourteen day period rather
          than twenty-one, and a lethal course in the first months of life. It therefore models the oscillation
          as a phenomenon of marrow regulation, not the ELANE mechanism.'
      selected_evidence:
        snippet: Genetic testing determined that the patient was homozygous mutant for the frameshift
          mutation in the adaptor protein complex 3 β-subunit (AP3B1) gene, originally identified in gray
          collies with cyclic hematopoiesis (CH).
        supports: SUPPORT
