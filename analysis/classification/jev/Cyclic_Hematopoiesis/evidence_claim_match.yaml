      assertion_type: Pathophysiology
      assertion:
        name: ELANE Mutation and Neutrophil Elastase Misfolding
        description: The initiating lesion. A heterozygous mutation in ELANE yields a neutrophil elastase
          that misfolds. Elastase is synthesised in neutrophil precursors early in primary granule formation,
          which is why the consequences fall on the granulocytic lineage specifically rather than on cells
          generally.
        genes:
        - preferred_term: ELANE
          term:
            id: hgnc:3309
            label: ELANE
        cell_types:
        - preferred_term: promyelocyte
          term:
            id: CL:0000836
            label: promyelocyte
      selected_evidence:
        snippet: Recent genetic, molecular, and cellular studies have shown that autosomal-dominant cyclic
          neutropenia and sporadic cases of this disease are due to a mutation in the gene for neutrophil
          elastase (ELA2), located at 19p13.3. This enzyme is synthesized in neutrophil precursors early
          in the process of primary granule formation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11957190
      reference_title: Cyclic neutropenia.
      evidence_source: HUMAN_CLINICAL
      explanation: Names the causal gene and locates elastase synthesis in neutrophil precursors, which
        is the basis for lineage specificity.
