      assertion_type: AnimalModel
      assertion:
        name: G193X Elane transgenic mouse
        species: Mouse
        genotype: G193X Elane
        publication: PMID:21285438
        description: 'A targeted Elane mutation reproducing a human severe congenital neutropenia allele.
          It is included here because of what it fails to do: the mice are not neutropenic, which is a
          real problem for the unfolded protein response model as a complete account.'
        modeled_mechanisms:
        - target: Endoplasmic Reticulum Stress and Unfolded Protein Response
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Granulocytic precursors carrying the mutation are selectively sensitive to endoplasmic
            reticulum stress, which supports the mechanism, but they show no basal unfolded protein response
            activation.
          limitations: The sensitivity is only revealed by chemical or proteasome-inhibitor challenge;
            unstressed animals look normal. The allele is also a severe congenital neutropenia allele
            rather than a cyclic one.
        - target: Apoptosis of Granulocytic Progenitors
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The mice do not develop neutropenia. Basal and stress granulopoiesis are normal,
            so the model does not reproduce the ineffective granulopoiesis that defines the human disease.
          limitations: Recorded as a negative result rather than omitted, because a model that fails at
            the key phenotype constrains the mechanism more informatively than one that succeeds.
      selected_evidence:
        snippet: To test this model, we generated transgenic mice carrying a targeted mutation of Elane
          (G193X) reproducing a mutation found in SCN.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
