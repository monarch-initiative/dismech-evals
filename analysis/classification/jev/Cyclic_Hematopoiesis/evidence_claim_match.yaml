      assertion:
        phase: Long-term outcome
        notes: The point at which this disease diverges completely from its allelic partner, and the reason
          the two are curated separately. Severe congenital neutropenia carries a 15 to 25% risk of myelodysplasia
          or acute myeloid leukaemia after fifteen years of G-CSF. Cyclic neutropenia carries no recognised
          risk, treated or untreated. The divergence is attributed to disease severity rather than to
          the ELANE mutation itself, so it is not predictable from the genotype.
      selected_evidence:
        snippet: Cyclic neutropenia is not associated with risk of malignancy or conversion to leukemia.
