        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Progenitor depletion raises G-CSF, which drives compensatory proliferation; the repopulated
          compartment is then hit by the unfolded protein response again, and the loop repeats with a
          period of about three weeks.
      selected_evidence:
        snippet: We suggest that in CyN patients, some HSPCs escape the UPR-induced endoplasmic reticulum
