      assertion_type: Genetic
      assertion:
        name: ELANE
        gene_term:
          preferred_term: ELANE
          term:
            id: hgnc:3309
            label: ELANE
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Heterozygous Missense Mutation, Autosomal Dominant
        case_fractions:
        - population: Cyclic neutropenia patients screened in the Hannover/SCNIR cohort
          case_fraction_percent: 55.0
          cohort_size: 51
          notes: Detection rate is higher in cyclic neutropenia than in severe congenital neutropenia,
            where the same screen found 41%.
        notes: Genotype does not cleanly predict phenotype. Cyclic and severe congenital neutropenia have
          partly distinct mutation spectra, but the severity distributions overlap, and one kindred is
          documented in which the same S97L allele on a shared paternal haplotype produced cyclic neutropenia
          in one child and severe congenital neutropenia in seven others. That observation argues for
          modifying genes and for treating the two conditions as a phenotypic spectrum rather than as
          separate diseases.
      selected_evidence:
        snippet: CyN-associated mutations were predicted to be more benign than CN-associated mutations,
          but the mutation severity largely overlapped.
        supports: SUPPORT
