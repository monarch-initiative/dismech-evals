      assertion_type: ProgressionInfo
      assertion:
        phase: Prolonged untreated illness
        notes: Untreated illness is protracted, with average symptom duration exceeding three weeks and
          no self-treatment shown to shorten it.
      selected_evidence:
        snippet: Cyclospora is a coccidian (previously referred to as cyanobacterium-like bodies) that
          has been implicated in cases of prolonged diarrhoea. The average duration of symptoms is more
          than three weeks, and no specific treatment has been shown to shorten the illness. ... Eradication
          of the organism was correlated with clinical improvement. There was no evidence of relapse of
          infection among treated patients followed for an additional 7 days. Treatment with co-trimoxazole
          for 7 days was effective in curing cyclospora infection among an expatriate population in Nepal.
        supports: SUPPORT
