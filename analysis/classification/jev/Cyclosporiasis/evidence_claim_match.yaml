      reference_title: Placebo-controlled trial of co-trimoxazole for Cyclospora infections among travellers
        and foreign residents in Nepal.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies Cyclospora and the prolonged illness described before this trial. The same
        study subsequently found co-trimoxazole effective; the introductory absence of proven treatment
