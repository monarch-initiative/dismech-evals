  c137514fc68d6a2514ae8d4d78e1e8881695d005ea4316bc28dfcd56c33309c5:
    claim:
      about:
        disease:
          name: Cystic echinococcosis
          disease_term:
            term:
              id: MONDO:0018408
              label: cystic echinococcosis
            preferred_term: Cystic echinococcosis
        context:
        - path: /agent_life_cycle
          value:
            description: 'Echinococcus granulosus runs a two-host cycle: the adult tapeworm lives in the
              gut of a canid definitive host, eggs shed in canid faeces are eaten by a grazing herbivore,
              and the larva forms the cyst that closes the cycle when a canid eats infected offal. Humans
              enter it accidentally in the intermediate host position, where the cyst forms but the cycle
              stops.'
            hosts:
            - preferred_term: domestic dog
              role: Definitive host harbouring the adult tapeworm and shedding eggs in faeces
              term:
                id: NCBITaxon:9615
                label: Canis lupus familiaris
            - preferred_term: sheep
              role: Intermediate host for the cyst-forming larval stage, and the most commonly affected
                livestock species
              term:
                id: NCBITaxon:9940
                label: Ovis aries
            - preferred_term: pig
              role: Intermediate host for the cyst-forming larval stage
              term:
                id: NCBITaxon:9823
                label: Sus scrofa
            - preferred_term: cattle
              role: Intermediate host for the cyst-forming larval stage
              term:
                id: NCBITaxon:9913
                label: Bos taurus
            - preferred_term: Homo sapiens
              role: Accidental intermediate host; the cyst forms but the cycle is not completed from humans
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            notes: 'No vectors are recorded: transmission is by ingestion of eggs, with no arthropod vector.
              Two stages are bound to OPL; the oncosphere, metacestode, and hydatid-cyst stages are left
              unbound because OPL has no terms for them, which was checked against the local OPL build.'
          role: ancestor
      assertion_type: AgentLifeCycleStage
      assertion:
        name: Egg stage shed in canid faeces
        life_cycle_stage_term:
          preferred_term: tapeworm egg shed in faeces
          term:
            id: OPL:0000180
            label: egg stage
        description: Gravid proglottids release eggs into the faeces of the definitive host, contaminating
          pasture, water, food, and soil.
      selected_evidence:
        snippet: These eggs can then be ingested by intermediate hosts where they mature into cysts and
          daughter cysts, such as in sheep that acquire the infection by grazing upon grass contaminated
          with dog feces containing the eggs.
        supports: SUPPORT
