  d416f9766d02eab13c3811dee7f721f72d8978db1c05f5bacc9fd243008805b2:
    claim:
      about:
        disease:
          name: Cystinuria
          disease_term:
            preferred_term: cystinuria
            term:
              id: MONDO:0009067
              label: cystinuria
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive and semi-dominant inheritance
        description: 'Cystinuria is usually autosomal recessive, with incompletely dominant or semi-dominant
          expression recognized particularly for some SLC7A9 heterozygotes.

          A digenic type AB genotype exists - double compound heterozygotes carrying mutations in both
          SLC3A1 and SLC7A9 - but this entry deliberately does NOT bind a digenic inheritance term (HP:0010984)
          and is not a member of the Digenic and Oligogenic Disorders grouping. The International Cystinuria
          Consortium found it in two of 164 families and reported that its contribution is limited to
          raising aminoaciduria values, a partial biochemical phenotype, rather than causing the stone-forming
          disease. The second locus adds to a quantitative trait; it is not required for cystinuria. This
          is recorded explicitly because OLIDA scores the cystinuria combination at its maximum confidence,
          so an automated import from that database would bind the term here on evidence that, read directly,
          argues against doing so.

          '
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Digenic inheritance is an exception (two of 164 families), with a limited contribution
          to the aminoaciduria values (partial phenotype) in cystinuria.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15635077
      reference_title: 'New insights into cystinuria: 40 new mutations, genotype-phenotype correlation,
        and digenic inheritance causing partial phenotype.'
      evidence_source: HUMAN_CLINICAL
      explanation: The International Cystinuria Consortium's own assessment of the type AB genotype, and
        the basis for not binding a digenic inheritance term here.
