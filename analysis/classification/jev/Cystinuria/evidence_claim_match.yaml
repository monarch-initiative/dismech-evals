              at risk of crystallization and stone formation.
          - name: Undersaturated (positive capacity)
            lower_bound: 0.0
            unit: mg/L
            abnormal_flag: NORMAL
            interpretation: Positive cystine capacity indicates undersaturated urine; an increasing, positive
              capacity is the goal of medical therapy.
