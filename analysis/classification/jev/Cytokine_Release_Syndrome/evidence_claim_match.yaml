            conforms_to: cytokine_storm_hyperinflammation#Uncontrolled Immune Activation Trigger
            description: 'The initiating event is engagement of target antigen by an infused or redirected
              immune effector cell. Signalling through the chimeric antigen receptor, or through a bispecific
              antibody bridging the effector cell to its target, drives effector cell proliferation, cytokine
              secretion and target cell lysis. The magnitude of this engagement scales with antigen burden
              and with infused cell dose. Host properties matter too: pre-existing neurological comorbidity
              was an independent risk factor for the neurological arm in multivariable analysis, so this
              node is not the only determinant of severity.'
