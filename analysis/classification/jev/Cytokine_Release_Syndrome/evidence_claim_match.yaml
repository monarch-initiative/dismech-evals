      assertion_type: Pathophysiology
      assertion:
        name: Blood-Brain Barrier Disruption and Pericyte Stress
        biological_scale: TISSUE
        description: A proposed mechanism for the neurological arm. Increased blood-brain barrier permeability
          admits high concentrations of systemic cytokines to the cerebrospinal fluid; interferon gamma
          and tumour necrosis factor then stress brain vascular pericytes, which secrete interleukin-6
          and vascular endothelial growth factor and further increase barrier permeability. This is a
          candidate account rather than a settled one. The consensus panel states that the neurotoxicity
          syndrome has unclear pathophysiology, distinct from CRS, and that it does not usually respond
          to IL-6 receptor blockade, so the mechanism here is not simply the systemic one acting in the
          brain.
        cell_types:
        - preferred_term: brain pericyte
          term:
            id: CL:2000043
            label: brain pericyte
      selected_evidence:
        snippet: During acute neurotoxicity, the concentrations of IFN-γ, TNF-α, IL-6, and TNFR p55 had
          increased markedly, and were comparable between serum and CSF
        supports: SUPPORT
