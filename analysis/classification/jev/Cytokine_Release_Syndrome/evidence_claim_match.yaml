  b0dfaf7a923d98fbe310d6d050f9bdde53e0aa0357f93af96591073cd9bb55c3:
    claim:
      about:
        disease:
          name: Cytokine Release Syndrome
          disease_term:
            preferred_term: cytokine release syndrome
            term:
              id: MONDO:0600008
              label: cytokine release syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: crs_neurotoxicity_mechanism_distinct_from_crs
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Blood-Brain Barrier Disruption and Pericyte Stress
        prompt: What mechanism accounts for the neurological arm of immune effector cell toxicity, given
          that it follows CRS but does not respond to IL-6 receptor blockade?
        rationale: The consensus panel states that the neurotoxicity syndrome has unclear pathophysiology
          distinct from CRS, and that it does not usually respond to tocilizumab. The endothelial and
          pericyte account recorded in this entry is a candidate, supported by one detailed clinical and
          autopsy series plus cell-culture work; the IL-1 result that separates the two arms is from a
          mouse model. So the entry records a vascular mechanism for the systemic syndrome with reasonable
          confidence and the neurological arm as open. Resolving it bears directly on whether IL-1 blockade
          should be preferred over IL-6 blockade in patients.
      selected_evidence:
        snippet: Neurologic symptoms may occur during or more commonly following CRS symptoms (but rarely
          before CRS), are variable between patients, and have an unclear pathophysiology, distinct from
          CRS.
        supports: SUPPORT
