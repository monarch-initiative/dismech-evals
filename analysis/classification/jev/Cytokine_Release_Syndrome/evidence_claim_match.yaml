  3d25aeec7a13805c1e02b83f1aaff15d59bbea0221188986f46d48488b1cfcd5:
    claim:
      about:
        disease:
          name: Cytokine Release Syndrome
          disease_term:
            preferred_term: cytokine release syndrome
            term:
              id: MONDO:0600008
              label: cytokine release syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Prophylactic Tocilizumab
        description: 'A single dose of tocilizumab given before the first step-up dose of a T-cell-engaging
          bispecific antibody, to prevent CRS rather than treat it. This is a different clinical claim
          from reactive tocilizumab above: it is the point where IL-6 receptor blockade has been shown
          to lower CRS incidence. The evidence comes from bispecific-treated relapsed/refractory multiple
          myeloma, not CAR-T, and from cohort and single-arm studies rather than randomised trials; the
          meta-analysis authors call for prospective randomised studies. A reduction in grade 2 or higher
          CRS did not reach significance in the pooled analysis.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: prophylactic pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: tocilizumab
            term:
              id: NCIT:C84217
              label: Tocilizumab
      selected_evidence:
        snippet: 'Meta-analysis of 3 comparative studies demonstrated that prophylactic tocilizumab is
          associated with lower all-grade CRS incidence (RR: 0.29, 95% CI: 0.16-0.53; p < 0.0001), with
          moderate heterogeneity (I2 = 59%).'
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
