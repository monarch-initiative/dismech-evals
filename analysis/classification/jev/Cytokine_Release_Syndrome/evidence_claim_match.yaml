      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnf_upstream_of_myeloid_amplification
        hypothesis_label: Effector-derived TNF as the upstream initiator of myeloid amplification
        status: EMERGING
        description: IL-6 and IL-1 beta are well characterised as the effectors of CRS, but which effector-cell
          signal initiates the myeloid amplification is less settled. Selective disruption of TNF signalling
          in a mouse model places effector-derived TNF upstream, acting at least in part through the host
          macrophage compartment and governing severity and lethality. The evidence is from mouse models
          and humanised xenochimeras, not from human intervention, so the position of TNF in the human
          syndrome remains open.
      selected_evidence:
        snippet: We further show that TNF is a determinant of CRS severity in humanized xenochimeras,
          governing the overall disease course including eventual lethality.
        supports: SUPPORT
