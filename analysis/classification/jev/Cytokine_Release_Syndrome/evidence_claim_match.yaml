        context: []
      assertion_type: Definition
      assertion:
        name: ASTCT consensus CRS definition and grading (2019)
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        scope: American Society for Transplantation and Cellular Therapy consensus, 2019
        description: CRS is a supraphysiologic response to any immune therapy that activates or engages
          endogenous or infused T cells or other immune effector cells, and fever at onset is required.
          Severity is graded on clinical observation, not laboratory values. Grade 1 is fever (>=38.0
          C) alone. Grade 2 adds hypotension not needing vasopressors and/or hypoxia managed with low-flow
          nasal cannula (<=6 L/min) or blow-by. Grade 3 adds hypotension needing one vasopressor (with
          or without vasopressin) and/or hypoxia needing high-flow nasal cannula, facemask, non-rebreather
          or venturi mask. Grade 4 adds hypotension needing multiple vasopressors (excluding vasopressin)
          and/or hypoxia needing positive pressure. Grade 5 is death due to CRS. Neurotoxicity (ICANS)
          and HLH/MAS are excluded from the definition and graded or handled separately.
      selected_evidence:
        snippet: Therefore, we define CRS as “a supraphysiologic response following any immune therapy
          that results in the activation or engagement of endogenous or infused T cells and/or other immune
          effector cells. Symptoms can be progressive, must include fever at the onset and may include
          hypotension, capillary leak (hypoxia) and end organ dysfunction.”
        supports: SUPPORT
