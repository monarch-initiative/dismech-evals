        biological_scale: MOLECULAR
        description: A heterozygous c.823C>T transition in exon 13 of COL2A1 replaces arginine 275 with
          cysteine in the triple-helical domain of the pro-alpha-1(II) collagen chain. Unlike the glycine
          substitutions that dominate the severe type II collagenopathies, this variant alters a non-glycine
          residue, and it is the only allele so far identified in molecularly confirmed cases.
        genes:
