          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
          modifier: ABNORMAL
      selected_evidence:
        snippet: We identified the R275C substitution in two of the original patients reported with Czech
          dysplasia and three additional patients.
        supports: SUPPORT
