              chain degrades the load-bearing collagen network of that matrix. The tissue distribution
              of the resulting disease follows the tissues in which type II collagen is load-bearing,
              which is why the vertebral bodies, the appendicular joints and the metatarsals are affected
              while the eye and palate — also type II collagen tissues, but affected in the other COL2A1
              disorders — are spared here.
