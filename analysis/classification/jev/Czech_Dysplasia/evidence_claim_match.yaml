              modifier: ABNORMAL
            mechanism_confidence: HYPOTHETICAL
            notes: 'Curated with `mechanism_confidence: HYPOTHETICAL` on purpose, but the reason is narrower
              than it first appears. Recombinant work on this exact substitution (PMID:29439465, where
              the allele is written R75C in mature-helix numbering rather than R275C in precursor numbering)
