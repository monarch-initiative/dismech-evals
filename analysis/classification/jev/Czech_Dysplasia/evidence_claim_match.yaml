  80806727db937d7a9c068386c19a4979daab67c414eec050d759b089b2324621:
    claim:
      about:
        disease:
          name: Czech dysplasia
          disease_term:
            preferred_term: spondyloepiphyseal dysplasia with metatarsal shortening
            term:
              id: MONDO:0012206
              label: spondyloepiphyseal dysplasia with metatarsal shortening
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Type II Collagen Fibril in Cartilage Matrix
        biological_scale: TISSUE
        description: Type II collagen is the principal fibrillar constituent of hyaline cartilage, including
          articular cartilage and the vertebral growth plate. A structurally abnormal alpha-1(II) chain
          degrades the load-bearing collagen network of that matrix. The tissue distribution of the resulting
          disease follows the tissues in which type II collagen is load-bearing, which is why the vertebral
          bodies, the appendicular joints and the metatarsals are affected while the eye and palate —
          also type II collagen tissues, but affected in the other COL2A1 disorders — are spared here.
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: collagen fibril organization
          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: ABNORMAL
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
        mechanism_confidence: HYPOTHETICAL
        notes: 'Curated with `mechanism_confidence: HYPOTHETICAL` on purpose, but the reason is narrower
          than it first appears. Recombinant work on this exact substitution (PMID:29439465, where the
          allele is written R75C in mature-helix numbering rather than R275C in precursor numbering) has
          measured several of the properties that might have been expected to be unknown: the mutant chain
          folds correctly by circular dichroism, retains trypsin resistance, traffics normally from ER
          to Golgi, and triggers neither the unfolded-protein response nor apoptosis. Its melting temperature
          is 2.5 degrees Celsius below wild type, which the authors read as a slight structural difference.
          What remains unmeasured is the state of the fibril and the matrix in patient cartilage, and
          the tissue selectivity of the disease. The node stays HYPOTHETICAL for that reason, not for
          want of any biophysics.'
      selected_evidence:
        snippet: coding for the triple helical domain of the alpha 1 chain of the type II collagen
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19764028
      reference_title: Czech dysplasia occurring in a Japanese family.
      evidence_source: HUMAN_CLINICAL
      explanation: Places the lesion in the structural domain of the cartilage collagen. PARTIAL because
