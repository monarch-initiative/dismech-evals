      assertion_type: Pathophysiology
      assertion:
        name: IDH2 neomorphic molecular function gain (type II)
        biological_scale: MOLECULAR
        notes: 'Modelling note: type II is mechanistically the INVERSE of type I. Type I is a loss-of-function
          block interrupting D-2-HG clearance; type II is a neomorphic gain that manufactures D-2-HG,
          a reaction the normal pathway does not perform at all. Both converge on the same accumulating
          metabolite by opposite routes, which is why the disease is one entity with two etiologically
          distinct subtypes rather than two severities of one lesion.

          '
        description: 'In D-2-HGA type II, heterozygous IDH2 gain-of-function variants (typically at Arg140)
          confer neomorphic catalytic activity.

          '
        genes:
        - preferred_term: IDH2
        molecular_functions:
        - preferred_term: neomorphic NADPH-dependent reduction of alpha-ketoglutarate to D-2-hydroxyglutarate
          term:
            id: GO:0016616
            label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
          modifier: GAIN_OF_FUNCTION
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: 'These mutations disable the enzymes'' normal ability to convert isocitrate to 2-ketoglutarate
          (2-KG) and confer on the enzymes a new function: the ability to convert 2-KG to d-2-hydroxyglutarate
          (D-2-HG).'
        supports: SUPPORT
