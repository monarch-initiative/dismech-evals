      assertion:
        name: D-2-Hydroxyglutarate
        presence: INCREASED
        context: 'D-2-HG is the primary accumulating metabolite and diagnostic biomarker in D-2-HGA. It
          is markedly elevated in urine, plasma, and CSF. D-2-HG levels are substantially higher in type
          II compared to type I, consistent with the production-driven mechanism in type II. Chiral analytical
          methods are required to distinguish D-2-HG from L-2-HG.

