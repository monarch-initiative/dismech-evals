  332a7f125ecf2b738f48b62d9225bf2323183b871e3fa8544a097f378e3134c0:
    claim:
      about:
        disease:
          name: D-2-Hydroxyglutaric Aciduria
          disease_term:
            preferred_term: D-2-hydroxyglutaric aciduria
            term:
              id: MONDO:0010924
              label: D-2-hydroxyglutaric aciduria
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: D2HGDH molecular function deficiency (type I)
        biological_scale: MOLECULAR
        notes: 'No conforms_to edge to metabolic_intoxication_decompensation. That module models the intoxication-type
          inborn errors, in which catabolic stress unmasks a block and precipitates ACUTE decompensation
          - metabolic acidosis, hyperammonemia and/or hypoglycemia - progressing to encephalopathy. D-2-HGA
          is a cerebral organic aciduria: none of those features occur, no catabolic trigger is described,
          and the course is progressive or static rather than episodic. The superficial resemblance (an
          enzyme deficiency causing metabolite accumulation with neurological injury) is not sufficient
          for conformance, and asserting it would misclassify the disease.

          '
        description: 'In D-2-HGA type I, autosomal recessive D2HGDH loss-of-function variants reduce mitochondrial
          D-2-hydroxyglutarate dehydrogenase catalytic activity.

          '
        genes:
        - preferred_term: D2HGDH
        molecular_functions:
        - preferred_term: D-2-hydroxyglutarate dehydrogenase activity
          term:
            id: GO:0051990
            label: (R)-2-hydroxyglutarate dehydrogenase activity
          modifier: DECREASED
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: Overexpression studies in HEK-293 cells of proteins containing the missense mutations
          showed a marked reduction of d-2-hydroxyglutarate dehydrogenase activity, proving that mutations
          in the d-2-hydroxyglutarate dehydrogenase gene cause d-2-hydroxyglutaric aciduria.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15609246
      reference_title: Mutations in the D-2-hydroxyglutarate dehydrogenase gene cause D-2-hydroxyglutaric
        aciduria.
      evidence_source: IN_VITRO
      explanation: Demonstrates reduction of D2HGDH catalytic function in type I disease.
