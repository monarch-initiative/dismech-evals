              label: DDX17-related neurodevelopmental disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DDX17 Haploinsufficiency
        biological_scale: MOLECULAR
        description: Heterozygous de novo DDX17 variants are predicted to reduce DDX17 dosage or function.
          Five are predicted loss-of-function (frameshift, canonical splice) and six are missense; five
          of the six missense changes fall in the conserved helicase core, two within core DEAD-box motifs.
          Phenotype severity did not differ between missense and truncating variants, so the authors attribute
          the disorder to haploinsufficiency rather than a dominant-negative or gain-of-function effect.
          The gene is strongly constrained against loss-of-function variation in population data (gnomAD
          LOEUF 0.13).
        genes:
        - preferred_term: DDX17
          term:
            id: hgnc:2740
            label: DDX17
        molecular_functions:
        - preferred_term: RNA helicase activity
          modifier: DECREASED
          term:
            id: GO:0003724
            label: RNA helicase activity
        genetic_context:
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: There were no substantial differences in phenotype severity between patients harbouring
          missense variants versus LoF variants, suggesting DDX17 haploinsufficiency causes the observed
          phenotype.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
