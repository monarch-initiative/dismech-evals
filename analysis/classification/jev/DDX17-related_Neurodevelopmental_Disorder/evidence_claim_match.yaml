      assertion_type: Genetic
      assertion:
        name: DDX17
        gene_term:
          preferred_term: DDX17
          term:
            id: hgnc:2740
            label: DDX17
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        association: Heterozygous de novo DDX17 variants (predicted loss-of-function and missense) cause
          the disorder. MONDO:0700368 names DDX17 as its causal gene.
        notes: 'The gene-disease relationship rests on one case series of 11 individuals with de novo
          variants plus mouse, Xenopus and cell-line functional data. No ClinGen gene-disease validity
          classification was found for this pair, so no gene_disease_validity tier is recorded. Variants
          (NM_006386.5): c.481_482del, c.997_998dup, c.739-2A>G, c.953del, c.1380del (predicted loss-of-function)
          and p.(Gln454Arg), p.(Arg304His), p.(Pro203Leu), p.(Gln259Arg), p.(Thr217Ala), p.(Ala69Asp)
          (missense). The p.(Ala69Asp) change lies in the N-terminal extension specific to the p82 isoform.

          Named-entity caution. DDX17 is a paralogue of DDX5 and belongs to the same DEAD-box family as
          DDX3X and DDX41, which cause unrelated disorders (DDX3X-related intellectual disability and
          DDX41-related myeloid neoplasia). Every citation here was checked to concern DDX17. Most published
          DDX17 literature is about cancer or virology and was not used.'
      selected_evidence:
        snippet: All 11 patients in our case series had a neurodevelopmental phenotype, whereby intellectual
          disability, delayed speech and language, and motor delay predominated.
        supports: SUPPORT
