  bc1d895a2dc5417ce1b745a2bc621a9bd47e4451a781af504fe4e97100288b5f:
    claim:
      about:
        disease:
          name: DDX17-related Neurodevelopmental Disorder
          disease_term:
            preferred_term: DDX17-related neurodevelopmental disorder
            term:
              id: MONDO:0700368
              label: DDX17-related neurodevelopmental disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Neurodevelopmental Gene Expression
        biological_scale: CELLULAR
        description: 'DDX17 is a multifunctional regulator of gene expression: a transcriptional co-regulator,
          a spliceosome component that controls alternative splicing, and a cofactor of the Drosha/DGCR8
          microprocessor in microRNA biogenesis. During neuronal differentiation it associates with REST,
          promotes REST binding to a subset of its target promoters, and with DDX5 regulates proneural
          microRNAs that target the REST complex. Knocking down DDX17 alone in human SH-SY5Y neuroblastoma
          cells deregulates 350 genes enriched for nervous system development, including transcription
          factors (NEUROG2, RARB, MYCN) and axon-guidance receptors and ligands (DCC, EFNB2, PLXNA2, PLXNA4,
          SEMA6A, SEMA6D, ROBO2, UNC5D). Which of these targets carries the disease is not known.'
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: regulation of gene expression
          modifier: DYSREGULATED
          term:
            id: GO:0010468
            label: regulation of gene expression
      selected_evidence:
        snippet: DDX17 associates with REST, promotes its binding to the promoter of a subset of REST-targeted
          genes and co-regulates REST transcriptional repression activity.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29931089
      reference_title: The RNA helicase DDX17 controls the transcriptional activity of REST and the expression
        of proneural microRNAs in neuronal differentiation.
      evidence_source: IN_VITRO
      explanation: Cell-based study of normal DDX17 function in neuronal differentiation, describing the
        REST co-repressor role through which reduced DDX17 is proposed to alter neuronal gene expression.
        It does not study patient variants.
