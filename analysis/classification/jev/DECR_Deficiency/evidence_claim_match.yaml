        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial NADP(H) deficiency due to NADK2 loss
        description: 'Biallelic loss-of-function variants in NADK2 (mitochondrial NAD kinase) abolish
          the mitochondrial NAD kinase activity required for NADP biosynthesis. This causes a profound
          deficiency of mitochondrial NADP(H), the cofactor pool that supplies reducing equivalents to
          multiple NADP(H)-dependent mitochondrial oxidoreductases. NADPH acts not only as a cosubstrate
          but also as a molecular chaperone that activates and stabilizes these enzymes, so its loss produces
          a combined, secondary enzyme deficiency state.

          '
        genes:
        - preferred_term: NADK2
          term:
            id: hgnc:26404
            label: NADK2
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: NADP+ biosynthetic process
          term:
            id: GO:0006741
            label: NADP+ biosynthetic process
          modifier: DECREASED
        cellular_components:
        - preferred_term: Mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: Thus NADPH is not only crucial as a cosubstrate, but can also act as a molecular chaperone
          that activates and stabilizes enzymes.
        supports: SUPPORT
