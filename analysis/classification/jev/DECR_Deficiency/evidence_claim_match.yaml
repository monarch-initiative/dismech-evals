        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired lysine degradation causing hyperlysinemia
        description: 'The first step of mitochondrial lysine degradation is catalyzed by the bifunctional
          aminoadipic semialdehyde synthase (AASS), whose lysine-ketoglutarate reductase activity is NADP(H)-dependent.
          With mitochondrial NADP(H) deficient, lysine catabolism is impaired in vivo, producing hyperlysinemia.
          The co-occurrence of elevated C10:2 acylcarnitine and hyperlysinemia is the distinctive combined
          biochemical signature of NADK2-related DECR deficiency.

          '
        biological_processes:
        - preferred_term: L-lysine catabolic process
          term:
            id: GO:0019477
            label: L-lysine catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: DECR and also the first step in lysine degradation are performed by NADP-dependent oxidoreductases
          explaining their in vivo deficiency.
        supports: SUPPORT
    origin:
