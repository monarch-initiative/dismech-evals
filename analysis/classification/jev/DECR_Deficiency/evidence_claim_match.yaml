  2176d4755a406021972512a7d4225cc1f3fc1d0603f3e2b87aee7bc7fceb63af:
    claim:
      about:
        disease:
          name: DECR Deficiency
          disease_term:
            preferred_term: DECR Deficiency
            term:
              id: MONDO:0014464
              label: progressive encephalopathy with leukodystrophy due to DECR deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired DECR-mediated polyunsaturated fatty acid beta-oxidation
        description: 'Mitochondrial 2,4-dienoyl-CoA reductase (DECR) is an NADP(H)-dependent auxiliary
          enzyme of the mitochondrial beta-oxidation system that reduces the 2,4-dienoyl-CoA intermediates
          generated during oxidation of polyunsaturated fatty acids. With mitochondrial NADP(H) depleted,
          DECR activity is deficient (residual fibroblast activity ~10%), beta-oxidation of unsaturated
          fatty acids stalls at the dienoyl-CoA step, and PUFA-derived intermediates accumulate and appear
          in blood as the diagnostic C10:2 (decadienoyl) acylcarnitine. This impairs energy production
          from fatty acids under catabolic stress.

          '
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: Fatty acid beta-oxidation
          term:
            id: GO:0006635
            label: fatty acid beta-oxidation
          modifier: DECREASED
        - preferred_term: Unsaturated fatty acid metabolic process
          term:
            id: GO:0033559
            label: unsaturated fatty acid metabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: DECR activity was also deficient in lysates of patient fibroblasts and could only be
          rescued by transfecting patient cells with functional NADK2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
