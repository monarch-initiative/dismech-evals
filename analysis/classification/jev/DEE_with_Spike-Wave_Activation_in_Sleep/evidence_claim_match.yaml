          so whether or not treatment worked. That spontaneous termination is as developmentally regulated
          as the onset, and it is the single most important thing to understand about prognosis: the electroencephalogram
          will normalize on its own, but the cognitive ground lost while it was active may not be recovered.
          It is also why treatment is judged on cognition rather than on the eventual disappearance of
          the pattern, which would have happened anyway.'
