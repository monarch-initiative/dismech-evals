            term:
              id: MONDO:0800501
              label: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
        context: []
      assertion_type: Subtype
      assertion:
        name: EE-SWAS
        display_name: Epileptic encephalopathy with spike-wave activation in sleep
        description: The arm in which development was normal until the regression, so the encephalopathy
          is purely epileptic in the sense that the child had nothing wrong before it started. An etiology
          is found in only about a quarter of these children, and the intellectual outcome is better than
          in DEE-SWAS. Landau-Kleffner syndrome is the best-known presentation within this arm, distinguished
          by the activation sitting over perisylvian language cortex so that the regression is specifically
          an acquired auditory agnosia. This is the arm the randomized treatment evidence was generated
          in.
      selected_evidence:
        snippet: We identified the etiology in 42/91 (46%) patients in our Core cohort, including 29/44
          (66%) with DEE-SWAS and 13/47 (28%) with EE-SWAS.
        supports: SUPPORT
