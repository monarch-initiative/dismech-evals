  983faf48956764e891bce29e7684a2d99b80952a3aa7c5146e358117e2357d6c:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy with Spike-Wave Activation in Sleep
          disease_term:
            preferred_term: developmental and/or epileptic encephalopathy with spike-wave activation in
              sleep
            term:
              id: MONDO:0800501
              label: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dee_swas_does_the_eeg_cause_the_regression
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: Does the sleep-activated epileptiform discharge actually cause the developmental regression,
          or are the discharge and the regression parallel consequences of the same underlying lesion,
          and what would distinguish the two?
        attaches_to:
        - pathophysiology#Sleep-Potentiated Spike-Wave Activation
        - pathophysiology#Disruption of Sleep-Dependent Synaptic Plasticity
        - pathophysiology#Developmental Regression and Cognitive-Behavioural Encephalopathy
        rationale: 'The syndrome''s name embeds the causal claim, and there is a coherent mechanism for
          it: slow-wave sleep is when synaptic strengths are rescaled and cortical maps consolidate during
          critical periods, so filling that window with continuous discharge should damage exactly what
          it appears to damage. The topographic correlation supports it too, since the domain lost tracks
          which cortex carries the activation rather than tracking seizure burden. The strongest evidence
          is therapeutic: in the only randomized trial, children given corticosteroids were substantially
          more likely to gain intelligence quotient points than children given clobazam, which is hard
          to explain if the discharge were a bystander. But the case is not closed. The trial stopped
          early without its target sample, and its two co-primary cognitive measures disagreed, with the
          sum score showing no difference at all. The alternative reading is that a single lesion, whether
          a thalamic injury or a gene, produces both an abnormally excitable cortex and a cortex that
          develops badly, and that suppressing the discharge treats a marker. Two observations sit awkwardly
          for the strong causal reading. The electrographic pattern remits spontaneously at adolescence
          in essentially everyone, yet cognitive recovery is variable and often incomplete, which is at
          least consistent with the deficit having been set by the lesion rather than accumulated by the
          discharge. And regression patterns are similar in DEE-SWAS and EE-SWAS despite those groups
          differing substantially in underlying etiology and in eventual outcome. The stake is concrete:
          if the discharge is causal, aggressive early suppression is worth its steroid toxicity, and
          normalizing the sleep record is a legitimate treatment target. If it is a marker, both of those
          are wrong.'
        proposed_experiments:
        - experiment_id: exp_dee_swas_discharge_burden_mediation
          name: Mediation analysis of discharge burden between etiology and cognitive outcome
          description: A prospective cohort with etiology characterized at entry, quantified spike-wave
            index measured serially through the active period, and standardized cognitive testing at fixed
            intervals, analysed to test whether discharge burden mediates the relationship between etiology
            and cognitive trajectory, or whether etiology predicts outcome independently of how much discharge
            occurred.
          decision_criterion: If cumulative discharge burden mediates the etiology-outcome relationship
            and predicts cognitive decline after adjustment for etiology, the causal reading is supported
            and suppression is a legitimate target. If etiology predicts outcome with no independent contribution
            from discharge burden, the discharge is a marker and treatment should be judged on cognition
            alone.
        - experiment_id: exp_dee_swas_eeg_response_versus_cognitive_response
          name: Dissociation of electrographic and cognitive response to treatment
          description: Within treated cohorts, classify children by whether the sleep record normalized
            and separately by whether cognition improved, and quantify the agreement between the two.
            Cases of electrographic response without cognitive response, and the reverse, are the informative
            cells.
          decision_criterion: Tight concordance would support the causal chain. A substantial number of
            children whose record normalizes without cognitive benefit would show that suppressing the
            discharge is not sufficient, and would undermine normalization of the electroencephalogram
            as a treatment endpoint.
      selected_evidence:
        snippet: The trial was terminated prematurely, and the target sample size was not met, so our
          findings must be interpreted with caution.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/3
