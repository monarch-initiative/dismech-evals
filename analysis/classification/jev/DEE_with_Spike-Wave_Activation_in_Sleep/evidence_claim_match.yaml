      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant, usually de novo
        description: Most of the identified genetic causes are autosomal genes in which a single variant
          is sufficient, and the variants are typically de novo rather than inherited, which is why the
          family history is usually blank. The counselling consequence is that recurrence risk for siblings
          is low but not zero, because parental gonadal mosaicism cannot be excluded.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: 'We identified 10 novel D/EE-SWAS genes with a range of functions: ATP1A2, CACNA1A, FOXP1,
          GRIN1, KCNMA1, KCNQ3, PPFIA3, PUF60, SETD1B, and ZBTB18, and 2 novel copy number variants, 17p11.2
          duplication and 5q22 deletion.'
        supports: SUPPORT
    origin:
