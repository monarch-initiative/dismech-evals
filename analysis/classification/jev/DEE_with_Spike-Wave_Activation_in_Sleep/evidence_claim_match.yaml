              label: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sleep-Potentiated Spike-Wave Activation
        biological_scale: ORGANISM
        description: 'Two things coincide in non-rapid-eye-movement sleep and neither is sufficient alone:
          brainstem activation falls away, which is the condition under which the augmenting response
          is strongest, and sleep spindles supply rhythmic drive in precisely the frequency band the cortex
          has become abnormally responsive to. The result is that discharge which was intermittent or
          absent in wakefulness becomes near-continuous once the child falls asleep. This state-dependence
          is the defining feature of the syndrome and the reason a routine waking electroencephalogram
          can be reported as normal.'
        biological_processes:
        - preferred_term: sleep
          term:
            id: GO:0030431
            label: sleep
      selected_evidence:
        snippet: Because this response is potentiated by sleep states of reduced brainstem activation
          and by appropriate stimulating rhythms, such as sleep spindles, the simultaneous occurrence
          of these two factors in nonrapid-eye-movement sleep is proposed as an explanation for CSWS in
          our patients.
        supports: SUPPORT
    origin:
