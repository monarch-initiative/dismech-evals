        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Selective Thalamocortical Disconnection
        biological_scale: TISSUE
        description: What the thalamic lesion produces is not a general loss of thalamic function but
          a selective severing of thalamic-cortical fibres on one side, with ipsilateral white matter
          loss. The selectivity is the point. Sleep spindles are preserved and the waking electroencephalogram
          is only mildly affected, so the rhythmic drive that normally organizes non-rapid-eye-movement
          sleep still arrives at a cortex that has lost its normal thalamic regulation. The continuous
          sleep spiking then appears on the side of the lesion, which is the observation tying the anatomy
          to the electrophysiology.
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: 'Unilateral selective thalamic-cortical disconnection is a common feature in our patients
          and is associated with both a focal pattern of CSWS and a pathological type of frequency-dependent
          excitability (peak: 10-20Hz).'
        supports: SUPPORT
