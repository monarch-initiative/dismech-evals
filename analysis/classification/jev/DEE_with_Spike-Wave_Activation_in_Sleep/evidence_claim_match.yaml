  387f9b36169e2116703a9e6892b43435f0d6909462bee1bf7ce198a94508c240:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy with Spike-Wave Activation in Sleep
          disease_term:
            preferred_term: developmental and/or epileptic encephalopathy with spike-wave activation in
              sleep
            term:
              id: MONDO:0800501
              label: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Sleep electroencephalography
        description: The diagnostic test, and one that will be missed if only a waking recording is done.
          A sleep study, ideally whole-night, is required to demonstrate the activation, because the waking
          record can be normal or show only sparse discharge. Quantifying how much of non-rapid-eye-movement
          sleep is occupied is what turns the observation into a diagnosis. This entry deliberately does
          not assert a numeric spike-wave index threshold. Published thresholds differ, the ILAE definition
          cited here does not mandate one, and a curated number would give a false impression of consensus
          about who has this disease.
        diagnosis_term:
          preferred_term: Electroencephalography
          term:
            id: NCIT:C38054
            label: Electroencephalography
        results: Marked activation of epileptiform discharge in non-rapid-eye-movement sleep relative
          to wakefulness, often near-continuous, and lateralized to the side of any structural lesion.
      selected_evidence:
        snippet: Longitudinal whole-night and high-density electroencephalograms (EEGs) were performed,
          as well as detailed imaging and clinical evaluation.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
