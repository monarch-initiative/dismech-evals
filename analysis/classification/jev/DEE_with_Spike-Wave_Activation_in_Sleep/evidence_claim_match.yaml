        with spike-wave activation in sleep (RESCUE ESES): a multicentre randomised controlled trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: The limitation the investigators attach to their own result, recorded here so the therapeutic
        argument is not overstated.
