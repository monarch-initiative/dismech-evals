        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of sodium channel blocking antiseizure medications
        description: 'Carbamazepine, oxcarbazepine, phenytoin, and phenobarbital can induce or worsen
          the sleep activation, which makes stopping them the cheapest intervention available in this
          syndrome and one that costs nothing to try. The trap is structural rather than careless: these
          children often have focal seizures, focal seizures are a standard indication for carbamazepine,
          and the sleep activation that the drug then aggravates is invisible unless someone records a
          sleep electroencephalogram.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Cases of worsening or induction of ESES with phenytoin, carbamazepine and phenobarbital
          have been reported.
        supports: SUPPORT
