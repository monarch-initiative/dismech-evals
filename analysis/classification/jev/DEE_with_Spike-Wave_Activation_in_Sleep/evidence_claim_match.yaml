  eba54302aef18b9529bc47074b3ec65124db99f74bb33c2d041b852db28f4bd9:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy with Spike-Wave Activation in Sleep
          disease_term:
            preferred_term: developmental and/or epileptic encephalopathy with spike-wave activation in
              sleep
            term:
              id: MONDO:0800501
              label: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dee_swas_one_syndrome_or_two
        kind: CONTROVERSY
        status: OPEN
        prompt: Is the ILAE split between DEE-SWAS and EE-SWAS, which rests entirely on whether development
          was already impaired before the spike-wave activation began, a real boundary or a description
          of the starting point?
        attaches_to:
        - pathophysiology#Developmental Regression and Cognitive-Behavioural Encephalopathy
        - pathophysiology#Heterogeneous Genetic Etiology
        rationale: 'The two labels differ only in baseline development, which is a statement about the
          child before the process started rather than about the process. The mechanism modeled in this
          entry is the same for both, which is why they are curated together. Evidence for the split being
          real is that the arms behave differently in ways a mere baseline difference does not obviously
          predict: an etiology is found in about two thirds of DEE-SWAS but only about a quarter of EE-SWAS,
          and DEE-SWAS carries a longer duration of epilepsy and a poorer intellectual outcome. Evidence
          against is that the regression itself looks the same in both, which is what one expects if a
          common process is acting on two different starting points. There is also a measurement problem
          underneath the boundary: mild pre-existing delay is hard to establish retrospectively once a
          child has regressed, and families reconstruct the before-picture through the after-picture,
          so some children are probably assigned to the wrong arm. The practical consequence of getting
          this right is diagnostic effort, because the etiological yield difference between the arms is
          large enough that the label changes how hard it is worth looking for a cause.'
        proposed_experiments:
        - experiment_id: exp_dee_swas_prospective_baseline_phenotyping
          name: Prospectively measured baseline development before regression
          description: Use cohorts in which developmental assessment was performed before the onset of
            spike-wave activation, such as children under surveillance for another reason or those with
            an early structural lesion followed from infancy, to assign the arms on prospectively measured
            rather than retrospectively recalled baselines, then compare etiological yield and outcome.
          decision_criterion: If the etiological yield and outcome differences survive prospective baseline
            assignment, the split is a real boundary. If they shrink toward each other, much of the apparent
            difference was misclassification driven by retrospective assessment.
      selected_evidence:
        snippet: Although developmental regression patterns were similar in both syndromes, DEE-SWAS was
          associated with a longer duration of epilepsy and poorer intellectual outcome than EE-SWAS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39096015
      reference_title: Solving the Etiology of Developmental and Epileptic Encephalopathy with Spike-Wave
        Activation in Sleep (D/EE-SWAS).
      evidence_source: HUMAN_CLINICAL
      explanation: 'Cuts both ways, which is why it is PARTIAL: the shared regression pattern argues for
        one process, the outcome difference argues for two entities.'
