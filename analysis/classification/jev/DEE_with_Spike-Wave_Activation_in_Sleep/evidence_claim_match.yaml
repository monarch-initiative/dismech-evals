              label: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dee_swas_developmental_gating
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does this syndrome switch on in mid-childhood and switch itself off at adolescence,
          in a child whose causal lesion, whether a thalamic injury or a germline variant, was present
          all along and does not go away?
        attaches_to:
        - pathophysiology#Sleep-Potentiated Spike-Wave Activation
        - pathophysiology#Age-Dependent Remission of the Electrographic Pattern
        rationale: 'Both ends of the course are developmentally regulated, and neither is explained. A
          perinatal thalamic lesion is present from birth, yet the sleep activation does not appear for
          years and then disappears on its own, regardless of treatment, while the lesion remains. Whatever
          gates it is a property of the developing cortex rather than of the cause. Candidate explanations
          exist but have not been discriminated: the closure of a critical period, so that the augmenting-response
          plasticity the syndrome exploits is simply no longer available; maturational change in the sleep
          architecture itself, since slow-wave sleep declines steeply across adolescence and would withdraw
          the drive; developmental change in inhibitory circuit maturation; or myelination altering the
          conduction properties of the surviving thalamocortical projections. Distinguishing them matters
          for practice in a specific way: if remission comes from withdrawal of the slow-wave drive, then
          interventions targeting sleep architecture become rational, and the treatment window is defined
          by the child''s developmental stage rather than by the duration of therapy.'
        proposed_experiments:
        - experiment_id: exp_dee_swas_sleep_architecture_trajectory
          name: Longitudinal sleep architecture through onset and remission
          description: Serial whole-night polysomnography with quantified slow-wave activity and spindle
            density in the same children from before onset through to spontaneous remission, testing whether
            the appearance and disappearance of the activation track measurable changes in the sleep parameters
            that are proposed to drive it.
          decision_criterion: If onset and remission coincide with the rise and fall of the specific sleep
            parameters that supply the drive, sleep maturation explains the gating and becomes a therapeutic
            target. If the activation appears and disappears with sleep architecture unchanged, the gate
            is in cortical plasticity rather than in the drive.
      selected_evidence:
        snippet: Early neonatal thalamic lesions account for about 14% of continuous spike-wave of sleep
          (CSWS) syndrome, representing the most common etiology in this epileptic encephalopathy in children
        supports: SUPPORT
