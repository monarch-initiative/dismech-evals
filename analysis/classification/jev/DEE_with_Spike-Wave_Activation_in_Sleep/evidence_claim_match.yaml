  265110952b1e492c245785d9c5f07a23027c5b5c3a9adfbd246d776b2dcc2ea8:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy with Spike-Wave Activation in Sleep
          disease_term:
            preferred_term: developmental and/or epileptic encephalopathy with spike-wave activation in
              sleep
            term:
              id: MONDO:0800501
              label: developmental and/or epileptic encephalopathy with spike-wave activation in sleep
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dee_swas_why_do_steroids_work
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Corticosteroids outperform a benzodiazepine on cognitive outcome in this syndrome, but
          no immune or inflammatory mechanism has been established for it. What are steroids actually
          doing, and would knowing let us keep the benefit without the toxicity?
        attaches_to:
        - pathophysiology#Sleep-Potentiated Spike-Wave Activation
        - pathophysiology#Disruption of Sleep-Dependent Synaptic Plasticity
        rationale: 'This is an uncomfortable gap because the treatment recommendation is relatively firm
          while the reason for it is not. Corticosteroids are used across several developmental and epileptic
          encephalopathies with a similar pattern of empirical success and mechanistic silence, and in
          this syndrome the randomized comparison showed them beating clobazam on intelligence quotient
          gain. Several accounts are available and none is established. The neuroinflammatory account
          holds that there is an immune contribution to the cortical hyperexcitability that steroids suppress,
          but no confirmed inflammatory mechanism has been demonstrated in this syndrome, and the corollary
          prediction, that other immunotherapies should work comparably, has not been tested head to head.
          A second account is genomic and has nothing to do with immunity: glucocorticoid receptors are
          abundant in cortex and hippocampus and steroids alter expression of genes governing excitability
          and synaptic scaling, which would act directly on the plasticity mechanism this entry models.
          A third possibility is that the effect is on sleep architecture itself, since steroids measurably
          alter slow-wave sleep, which would withdraw the very drive that potentiates the discharge. These
          make different predictions and are separable. The practical stake is real: steroid toxicity
          is the main reason treatment is delayed or truncated, and weight gain was the commonest adverse
          event in the trial. A mechanism would tell us which better-tolerated drug to reach for instead.'
        proposed_experiments:
        - experiment_id: exp_dee_swas_steroid_mechanism_biomarker_panel
          name: Inflammatory and sleep-architecture markers across steroid response
          description: In children starting corticosteroids, measure cerebrospinal fluid and serum inflammatory
            markers, quantified slow-wave sleep parameters, and spike-wave burden before and during treatment,
            and relate each to cognitive response. Responders and non-responders provide the contrast.
          decision_criterion: If response tracks a fall in inflammatory markers, the immune account is
            supported and other immunotherapies become rational comparators. If response tracks a change
            in slow-wave sleep parameters with inflammatory markers unchanged, the mechanism is architectural
            and sleep-directed treatments become the better-tolerated alternative to chase.
      selected_evidence:
        snippet: Our findings strengthen those from previous uncontrolled studies that support the early
          use of corticosteroids for children with EE-SWAS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38081201
      reference_title: 'Corticosteroids versus clobazam for treatment of children with epileptic encephalopathy
        with spike-wave activation in sleep (RESCUE ESES): a multicentre randomised controlled trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the effect this gap is about is real enough to drive a treatment recommendation,
        which is what makes the missing mechanism worth curating rather than merely noting.
