      assertion_type: Subtype
      assertion:
        name: DEE-SWAS
        display_name: Developmental and epileptic encephalopathy with spike-wave activation in sleep
        description: 'The arm in which development was already impaired before the spike-wave activation
          began, so the child has both a developmental encephalopathy and an epileptic one. It behaves
          differently from its sibling arm in two ways that a mere difference in starting point does not
          obviously predict: an etiology is found roughly two thirds of the time, more than twice as often
          as in EE-SWAS, and the epilepsy runs longer with a poorer intellectual outcome. Whether that
          makes it a distinct entity is an open question curated in the discussions block.'
      selected_evidence:
        snippet: We identified the etiology in 42/91 (46%) patients in our Core cohort, including 29/44
          (66%) with DEE-SWAS and 13/47 (28%) with EE-SWAS.
        supports: SUPPORT
