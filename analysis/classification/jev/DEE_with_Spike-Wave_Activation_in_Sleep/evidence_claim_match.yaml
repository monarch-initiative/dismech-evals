        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disruption of Sleep-Dependent Synaptic Plasticity
        biological_scale: CELLULAR
        description: 'Slow-wave sleep is not passive for a developing cortex. It is when synaptic strengths
          are rescaled and the day''s experience is consolidated into developing cortical maps, and it
          does this during critical periods when those maps are still plastic. Occupying that window with
          continuous epileptiform discharge is the proposed mechanism by which an electroencephalographic
          abnormality becomes a cognitive one, and it explains why the deficit tracks which cortex is
          involved rather than seizure burden: perisylvian activation costs language, frontal activation
          costs attention and behaviour.'
        cell_types:
        - preferred_term: pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: regulation of synaptic plasticity
          term:
            id: GO:0048167
            label: regulation of synaptic plasticity
          modifier: ABNORMAL
      selected_evidence:
        snippet: The role of slow-wave sleep in normal cortical plasticity during developmental critical
          periods, how disruption of slow-wave sleep by electrographic seizures could affect cortical
          maps and development, and the organization and functional connectivity of the thalamic structures
          that when damaged are thought to produce these seizure disorders are reviewed.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
