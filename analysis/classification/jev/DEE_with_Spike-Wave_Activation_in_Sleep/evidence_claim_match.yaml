      assertion_type: Treatment
      assertion:
        name: Corticosteroids
        description: The best-supported treatment, and unusually for this syndrome the support is randomized.
          In a head-to-head trial against clobazam, a quarter of children given corticosteroids gained
          at least eleven and a quarter intelligence quotient points at six months while none of the clobazam
          group did. The trial's other cognitive measure showed no difference, and it stopped early without
          reaching its target sample, so the result strengthens rather than settles the case for early
          steroid use. Either continuous oral prednisolone or pulsed intravenous methylprednisolone is
          used.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
