      assertion_type: Pathophysiology
      assertion:
        name: Reduced Surface CTLA-4 Availability
        biological_scale: CELLULAR
        description: Patient T cells show impaired regulation of CTLA-4 surface trafficking and reduced
          functional CTLA-4 availability, a phenotype reproduced in DEF6-knockout Jurkat cells. This is
          a functional CTLA-4 insufficiency arising from a normal CTLA4 locus, which is why the disorder
          is clinically grouped with CTLA-4 insufficiency and LRBA deficiency despite having a different
          causal gene.
        cell_types:
        - preferred_term: regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
      selected_evidence:
        snippet: Patient T cells exhibit impaired regulation of CTLA-4 surface trafficking associated
          with reduced functional CTLA-4 availability, which is replicated in DEF6-knockout Jurkat cells.
