          This is the shared final common step of the CTLA-4/LRBA/DEF6 group of immune-dysregulation disorders.
        cell_types:
        - preferred_term: regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        biological_processes:
        - preferred_term: negative regulation of T cell activation
          term:
            id: GO:0050868
            label: negative regulation of T cell activation
          modifier: DECREASED
      selected_evidence:
        snippet: mainly attributed to a defective suppressive activity of Tregs, as all three diseases
          reduce overall surface expression of CTLA-4
        supports: SUPPORT
