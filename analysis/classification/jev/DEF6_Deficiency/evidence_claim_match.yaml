      assertion:
        name: Biallelic DEF6 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic DEF6 variants abolish or cripple the guanine nucleotide exchange factor.
          Two mechanisms are documented: homozygous missense variants that leave protein expression strongly
          reduced (index report), and a homozygous nonsense variant (c.940C>T, p.Gln314Ter) that behaves
          as a null allele with complete loss of detectable DEF6 in patient T-cell blasts (second family).'
        genes:
        - preferred_term: DEF6
          term:
            id: hgnc:2760
            label: DEF6
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
      selected_evidence:
        snippet: we identify biallelic mutations in three patients from two unrelated families in differentially
          expressed in FDCP6 homolog (DEF6) as the molecular cause of an inborn error of immunity with
          systemic autoimmunity
        supports: SUPPORT
