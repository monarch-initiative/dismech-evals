  b8385f51348ebe8e988a95d75d6cbf46360643f50ebe91dacec5e57b75749a19:
    claim:
      about:
        disease:
          name: DEF6 Deficiency
          disease_term:
            preferred_term: DEF6 deficiency
            term:
              id: MONDO:0030457
              label: immunodeficiency 87 and autoimmunity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted RAB11-Dependent CTLA-4 Vesicle Trafficking
        biological_scale: CELLULAR
        description: DEF6 interacts with the small GTPase RAB11, which governs the recycling endosome.
          Mutant DEF6 shows disrupted binding to RAB11, and DEF6-mutated cells contain fewer RAB11-positive,
          CTLA-4-positive vesicles. The lesion is therefore in the delivery machinery for CTLA-4, not
          in CTLA-4 itself — the same failure point that LRBA deficiency reaches by a different route.
        cell_types:
        - preferred_term: regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        biological_processes:
        - preferred_term: vesicle-mediated transport
          term:
            id: GO:0016192
            label: vesicle-mediated transport
          modifier: DECREASED
      selected_evidence:
        snippet: we identify the small GTPase RAB11 as an interactor of the guanine nucleotide exchange
          factor DEF6, and find disrupted binding of mutant DEF6 to RAB11 as well as reduced RAB11+CTLA-4+
          vesicles in DEF6-mutated cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
