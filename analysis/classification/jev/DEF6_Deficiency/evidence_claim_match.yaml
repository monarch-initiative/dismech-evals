  71edf4942e35c2266282555acc8080c43620591c84024307537ed8998d2e1502:
    claim:
      about:
        disease:
          name: DEF6 Deficiency
          disease_term:
            preferred_term: DEF6 deficiency
            term:
              id: MONDO:0030457
              label: immunodeficiency 87 and autoimmunity
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: def6_skiv2l_confound
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Biallelic DEF6 Loss of Function
        - disease#DEF6 Deficiency
        prompt: Which features of the originally reported DEF6 phenotype are attributable to DEF6 and
          which to the co-occurring SKIV2L variant?
        rationale: Two of the three patients in the index report also carried a homozygous predicted-pathogenic
          SKIV2L variant. SKIV2L deficiency causes trichohepatoenteric syndrome, whose features — intractable
          diarrhoea, liver disease, developmental abnormality and combined immunodeficiency — overlap
          substantially with the severe digestive and cardiac involvement described in those patients.
          The second report makes this point explicitly and describes a four-sibling family with no other
          pathogenic variant detected, in whom the phenotype is autoimmunity and EBV susceptibility without
          the extrahaematologic features. Until more unconfounded patients are reported, the digestive
          and cardiac manifestations should not be treated as established DEF6 phenotypes, and the same
          applies to the severe bacterial and respiratory infections, which the second report also localises
          to the SKIV2L carriers. The phenotypes section is scoped accordingly.
      selected_evidence:
        snippet: 'However, 2

          of the 3 patients were also carrying a predicted pathogenic

          homozygous variant in SKIV2L'
        supports: SUPPORT
    origin:
