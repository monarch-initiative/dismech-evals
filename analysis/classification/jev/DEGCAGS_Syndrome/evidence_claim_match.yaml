              id: MONDO:0859181
              label: DEGCAGS syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Hematopoiesis and Lymphocyte Development
        description: 'Anemia or pancytopenia in over half of the founding cohort, leukopenia in later
          cases, and one patient investigated for suspected inherited bone marrow failure. The immune
          arm was first characterised in 2026 in a 20-year-old with recurrent severe lower respiratory
          infection and bronchiectasis: near-absent circulating B cells, reduced naive CD4 and CD8 T cells,
          impaired mitogen response and reduced kappa-deleting recombination excision circles, with normal
          immunoglobulins and vaccine responses, meeting ESID criteria for combined immunodeficiency.
          Immunodeficiency or recurrent infection is reported in about two fifths of patients. Whether
          the defect is one of hematopoietic stem cell output or of lineage-specific lymphocyte development
          is not known; the 2025 bone marrow failure report is said to have raised an RNA polymerase II
          and ribosome biogenesis analogy, but its abstract is not in the cache and that proposal is not
          curated here.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: naive T cell
          term:
            id: CL:0000898
            label: naive T cell
        biological_processes:
        - preferred_term: hemopoiesis
          term:
            id: GO:0030097
            label: hemopoiesis
          modifier: DECREASED
      selected_evidence:
        snippet: Immunodeficiency and/or recurrent infections are reported in 42.3% of patients
        supports: SUPPORT
