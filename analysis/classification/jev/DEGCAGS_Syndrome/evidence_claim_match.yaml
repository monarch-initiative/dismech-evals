  6d11f545086c950e0abcfaf502cd315a87b772b1802ba197a78cff2ec9fb4130:
    claim:
      about:
        disease:
          name: DEGCAGS Syndrome
          disease_term:
            preferred_term: DEGCAGS syndrome
            term:
              id: MONDO:0859181
              label: DEGCAGS syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Genome-wide DNA Methylation
        description: 'Peripheral-blood DNA from patients carries a robust, specific methylation episignature
          that separates DEGCAGS from controls, from heterozygous carriers and from other episignature-bearing
          neurodevelopmental disorders. The signature is established as a diagnostic biomarker. Whether
          it also mediates the phenotype is not: the 2024 differentially-methylated-region analysis suggested
          effects on genes that could be relevant to pathogenesis, and that is where the evidence stops.
          The downstream edges from this node are therefore tagged with the epigenetic-mediation hypothesis
          rather than asserted.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: peripheral blood leukocyte
          term:
            id: CL:0000738
            label: leukocyte
        biological_processes:
        - preferred_term: genome-wide DNA methylation pattern
          description: GO has retired its DNA methylation process terms, so the episignature is bound
            to the epigenetic-regulation parent whose definition names cytosine methylation.
          term:
            id: GO:0040029
            label: epigenetic regulation of gene expression
          modifier: ABNORMAL
      selected_evidence:
        snippet: Analysis of differentially methylated regions suggested an effect on genes potentially
          implicated in the syndrome's pathogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
