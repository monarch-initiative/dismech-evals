        hypothesis_label: Loss of ZNF699-directed methylation at target loci mediates the malformation,
          neurodevelopmental and hematopoietic phenotypes
        status: EMERGING
        description: 'KRAB zinc finger proteins recruit the co-repressor KAP1 (TRIM28) through their KRAB
          domain, and KAP1 in turn deposits H3K9me3 and DNA methylation at the bound loci; DEGCAGS patients
          carry a robust blood methylation episignature. The hypothesis is that the episignature is the
          visible trace of a genome-wide loss of ZNF699-directed repression, and that derepression of
          specific target genes during development produces the phenotype. The 2024 cohort''s differentially-methylated-region
          analysis pointed at genes plausibly involved in pathogenesis but did not test any. Against the
          hypothesis: the episignature is measured in blood leukocytes, not in the developing organs;
          the KRAB-KAP1 axis has been validated structurally and functionally for other KRAB zinc finger
          proteins (ZNF93) but never for ZNF699; and no ZNF699 target has been identified. The hypothesis
          predicts that ZNF699-null cells would show derepression and hypomethylation at a definable set
          of loci and that those loci would be enriched for developmental regulators of the affected organs.'
      selected_evidence:
        snippet: Analysis of differentially methylated regions suggested an effect on genes potentially
          implicated in the syndrome's pathogenesis.
        supports: SUPPORT
        directness: INDIRECT
