        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: degs1_glia_primary_neurodegeneration
        hypothesis_label: Glia-Primary Disease Driving Neuronal Loss
        status: EMERGING
        description: 'Model-organism work places the primary lesion in glia rather than neurons: the Drosophila
          DEGS1 homolog ifc is expressed mainly in glia, and knocking it down in glia but not neurons
          drives neuronal death. If this holds in humans, oligodendrocyte and other glial dysfunction
          would be upstream of the neurodegeneration seen as thalamic and cerebellar atrophy.'
      selected_evidence:
        snippet: RNAi knockdown of ifc in glia but not neurons drives neuronal cell death, suggesting
          that ifc function in glia promotes neuronal survival.
        supports: SUPPORT
    origin:
