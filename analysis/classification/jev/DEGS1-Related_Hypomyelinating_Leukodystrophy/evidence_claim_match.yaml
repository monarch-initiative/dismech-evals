        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: degs1_model_translational_validity
        prompt: How faithfully do the invertebrate and larval models capture a human vertebrate myelination
          disease, given that none has characterised CNS myelin in a mammal?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Zebrafish
        - animal_models#Fruit fly
        - pathophysiology#CNS Hypomyelination
        rationale: The mechanism rests on a Drosophila model with no myelin, where glial ensheathment
          stands in for myelination, and on a transient zebrafish morpholino knockdown scored at the larval
          stage, whose phenotypes are not always reproduced in stable mutants. The biochemistry transfers
          well across species, but the central claim, that the sphingolipid imbalance causes mammalian
          oligodendrocyte myelin failure, has not been shown in a mammalian model with characterised CNS
          myelin. A conditional oligodendrocyte Degs1 mouse would test it directly and is the obvious
          missing experiment.
        proposed_experiments:
        - experiment_id: exp_degs1_oligodendrocyte_cko_mouse
          name: Oligodendrocyte-specific Degs1 conditional knockout mouse
          description: Delete Degs1 in the oligodendrocyte lineage and score myelination, dihydroceramide/ceramide
            ratio, and neurological phenotype against littermate controls, with and without upstream ceramide-synthase
            inhibition. Mammalian CNS hypomyelination from an oligodendrocyte-autonomous deletion would
            close the translational gap.
          would_support:
          - mechanistic_hypotheses#degs1_dihydroceramide_accumulation_hypomyelination
      selected_evidence:
        snippet: we used a knockdown approach for disease modeling in Danio rerio
        supports: SUPPORT
