      assertion_type: Discussion
      assertion:
        discussion_id: degs1_genotype_severity
        prompt: Do residual-activity (partial loss-of-function) alleles cause milder disease than null
          alleles, enough to count as a genotype-phenotype correlation?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - genetic#DEGS1
        - phenotypes#Global developmental delay
        rationale: 'The hint is consistent: p.Asn255Ser and p.Leu175Gln keep about 12% of wild-type activity,
          the p.Ala280Val patient (about 20% residual) survived to at least 22, and the mildest founding
          patient was a compound heterozygote carrying a residual-activity allele. Against a clean correlation,
          the Grinberg family shows notable variability between relatives carrying the same variant, so
          genotype is not the whole story. Establishing it would need a larger cohort with paired in vitro
          activity and standardised severity scoring, which no study has done. It matters for counselling
          and for predicting who might benefit most from a substrate-reduction therapy.'
      selected_evidence:
        snippet: In vitro desaturase activity was lost by many variants except L175Q and N255S, which
          maintain a catalytic efficiency close to 12% of the WT enzyme.
        supports: SUPPORT
