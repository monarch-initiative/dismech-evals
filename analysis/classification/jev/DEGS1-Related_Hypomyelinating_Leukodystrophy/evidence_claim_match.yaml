          name: DEGS1-Related Hypomyelinating Leukodystrophy
          disease_term:
            preferred_term: leukodystrophy, hypomyelinating, 18
            term:
              id: MONDO:0032730
              label: leukodystrophy, hypomyelinating, 18
        context: []
      assertion_type: Genetic
      assertion:
        name: DEGS1
        gene_term:
          preferred_term: DEGS1
          term:
            id: hgnc:13709
            label: DEGS1
        relationship_type: CAUSATIVE
        notes: 'Biallelic germline variants at 1q42.11: missense, nonsense, frameshift, splice-site, and
          whole- or partial-gene deletions. The recurrent p.(Asn255Ser) allele (also written p.N219S on
          another isoform) appeared in 3 of the 13 founding families and keeps about 12% of wild-type
          activity, as does p.Leu175Gln; these partial-activity alleles associate with milder disease.
          Deletion testing is recommended because the gene has no MLPA assay and single-exon or whole-gene
          deletions in trans with a point variant are missed by sequencing alone. The atypical base SPB
          18:1(14Z) and the in vitro desaturase assay help classify variants of uncertain significance.'
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_8a3090a0-8f88-4114-9438-87f8645ea133-2026-02-02T170000.000Z
        variants:
        - name: p.Asn255Ser
          description: Recurrent missense allele (c.764A>G; also c.656A>G p.N219S on another isoform),
            seen in 3 founding families, in Dolgin and in Zanobio. Retains about 12% of wild-type desaturase
            activity and associates with milder disease.
          functional_effects:
          - function: sphingolipid delta-4 desaturase activity
            description: Retains about 12% of wild-type catalytic efficiency in vitro.
            type: partial-loss-of-function
        - name: p.Ala280Val
          description: Homozygous missense in the Karsai patient, who had combined central and peripheral
            disease and survived to at least 22; about 20% residual activity and about 80% less protein.
          functional_effects:
          - function: sphingolipid delta-4 desaturase activity
            description: About 20% residual activity with about 80% less protein than wild type.
            type: partial-loss-of-function
      selected_evidence:
        snippet: underscoring the importance of considering whole or partial gene deletions in the diagnostic
          pipeline
        supports: SUPPORT
