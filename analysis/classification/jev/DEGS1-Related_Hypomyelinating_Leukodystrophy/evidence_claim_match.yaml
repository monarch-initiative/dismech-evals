            term:
              id: MONDO:0032730
              label: leukodystrophy, hypomyelinating, 18
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: degs1_glia_versus_neuron_primary
        prompt: Is the human disease primarily a glial (oligodendrocyte) disorder with neuronal loss as
          a consequence, or does DEGS1 loss injure neurons directly?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Glial ER Expansion and Lipid-Droplet Depletion
        - pathophysiology#Neuronal Rac1-NOX Oxidative Stress
        - pathophysiology#Neurodegeneration
        - mechanistic_hypotheses#degs1_glia_primary_neurodegeneration
        rationale: 'The name says leukodystrophy, which implies a myelin and therefore glial disease,
          and the fly work supports that: ifc is expressed mainly in glia, and knocking it down in glia
          but not neurons kills neurons. But the same field also shows a cell-autonomous neuronal mechanism,
          where dihydroceramide mislocalises Rac1 and drives NOX oxidative stress in photoreceptors and
          in a human neuronal line. Both can be true, in different compartments, and the human disease
          has both hypomyelination and progressive thalamic and cerebellar atrophy. Which is primary bears
          on whether an oligodendrocyte-directed therapy would be enough or whether neurons also need
          protecting. No human tissue study resolves the order of events.'
      selected_evidence:
        snippet: Our work identifies glia as the primary site of disease progression in HLD-18
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
