          name: DEGS1-Related Hypomyelinating Leukodystrophy
          disease_term:
            preferred_term: leukodystrophy, hypomyelinating, 18
            term:
              id: MONDO:0032730
              label: leukodystrophy, hypomyelinating, 18
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: degs1_dihydroceramide_accumulation_hypomyelination
        hypothesis_label: DEGS1 Loss / Dihydroceramide Accumulation / Hypomyelination Model
        status: CANONICAL
        description: Loss of DEGS1 Delta-4-desaturase activity blocks the last step of de novo ceramide
          synthesis, so dihydroceramide and other dihydrosphingolipids accumulate while ceramide and its
          downstream products fall. The altered sphingolipid pool impairs oligodendrocyte and Schwann-cell
          membrane biology and produces CNS hypomyelination with variable peripheral demyelination. Whether
          the disease is driven by dihydroceramide gain or by loss of ceramide and its products is not
          resolved (see discussion degs1_gain_versus_loss).
      selected_evidence:
        snippet: This enzyme converts dihydroceramide (DhCer) into ceramide (Cer) in the final step of
          the de novo biosynthesis pathway. We detected a marked increase of the substrate DhCer and DhCer/Cer
          ratios in patients' fibroblasts and muscle.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
