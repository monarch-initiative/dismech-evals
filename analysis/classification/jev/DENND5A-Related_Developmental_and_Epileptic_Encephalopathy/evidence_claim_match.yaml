          spread over the whole protein rather than clustering in one domain: nine in the DENN domain,
          two in RUN1, six in PLAT, four in RUN2 and four in the linkers, plus copy number and splice-site
          variants. That distribution is itself mechanistically informative - it is what a loss-of-function
          disorder looks like, as opposed to the domain-restricted clustering seen in gain-of-function
          DEEs.'
        genes:
