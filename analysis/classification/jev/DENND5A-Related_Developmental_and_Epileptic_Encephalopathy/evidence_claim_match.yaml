            term:
              id: MONDO:0015002
              label: developmental and epileptic encephalopathy, 49
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Rab-Directed Membrane Trafficking
        biological_scale: MOLECULAR
        description: 'The second, older mechanistic thread, and the one the gene is named for. DENND5A
          carries a DENN domain, the module that confers guanine nucleotide exchange factor activity toward
          Rab GTPases, and two RUN domains through which it binds active Rab6 and sorting nexin 1. Structural
          modeling qualifies this: the predicted Rab enzymatic site may be occluded by the DENN-RUN1/PLAT
          interaction in the closed conformation, while Rab6 binding to RUN1 needs no conformational change
          - so the two functions are predicted to require different conformations of the same protein.
          This node is kept separate from the polarity arm rather than merged into it, because no source
          available to this entry shows that trafficking loss is what causes the spindle defect.'
        molecular_functions:
        - preferred_term: guanyl-nucleotide exchange factor activity
          term:
            id: GO:0005085
            label: guanyl-nucleotide exchange factor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: vesicle-mediated transport
          term:
            id: GO:0016192
            label: vesicle-mediated transport
          modifier: DECREASED
        - preferred_term: retrograde transport, endosome to Golgi
          term:
            id: GO:0042147
            label: retrograde transport, endosome to Golgi
      selected_evidence:
        snippet: DENND5A contains a DENN domain, an evolutionarily ancient enzymatic module conferring
          guanine nucleotide exchange factor (GEF) activity to multiple proteins serving as GEFs for Rabs,
          which are key regulators of membrane trafficking
        supports: SUPPORT
