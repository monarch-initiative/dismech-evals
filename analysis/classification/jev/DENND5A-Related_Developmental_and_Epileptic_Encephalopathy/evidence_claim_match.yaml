            experimental_model_type: IPSC_DERIVED_MODEL
            description: Neural rosettes formed from wild-type and CRISPR/Cas9 DENND5A knockout human
              iPSCs. A rosette is a polarized in vitro model of early neural development with a central
              F-actin-rich lumen standing in for the ventricular surface, which is what makes the mitotic
              spindle angle measurable at all. This is the system that produced the disorder's central
              quantitative finding.
            publication: PMID:39174524
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Mitotic Spindle Misorientation in Apical Neural Progenitors
        relationship: RECAPITULATES
        fidelity: HIGH
        limitations: 'Human but not patient-derived: the knockout is engineered, so the model tests the
          consequence of absent DENND5A rather than of any particular patient allele. The spindle-angle
          measurement also required excluding cells whose chromatin was abnormally condensed - a class
          over-represented in the knockouts - so the reported angle distribution is drawn from the subset
          of knockout divisions that looked normal enough to measure.'
        description: Direct quantification of mitotic spindle angle relative to the apical surface.
        readouts:
        - name: Mitotic spindle angle relative to the apical surface
          target: Mitotic Spindle Misorientation in Apical Neural Progenitors
          direction: DECREASED
          interpretation: Knockout progenitors divide at a much shallower angle to the apical surface
            than wild-type, and most fall below the 45 degree line that separates symmetric from oblique
            division.
        - name: Apical localization of PALS1
          target: Mitotic Spindle Misorientation in Apical Neural Progenitors
          direction: UNCHANGED
          interpretation: A real negative result that constrains the mechanism. PALS1 still reaches the
            apical membrane without DENND5A, so DENND5A is not required to traffic the polarity complex
            there - which is why the edge from the interaction node to this one is curated with unknown
            intermediates rather than as a direct trafficking failure.
      selected_evidence:
        snippet: We performed a neural rosette formation assay, a polarized in vitro model of early neural
          development, to examine for potential alterations in the symmetry of cell division following
          loss of DENND5A
        supports: SUPPORT
