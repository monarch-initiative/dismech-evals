            label: neural progenitor cell
      selected_evidence:
        snippet: All patient-derived cells exhibit a reduction in DENND5A protein (Supplementary Fig.
          2a, b), supporting that disease phenotypes are a result of protein loss of function
        supports: SUPPORT
