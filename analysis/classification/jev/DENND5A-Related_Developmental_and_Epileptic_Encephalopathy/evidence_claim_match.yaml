            term:
              id: MONDO:0015002
              label: developmental and epileptic encephalopathy, 49
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of DENND5A-MUPP1/PALS1 Association at the Apical Membrane
        biological_scale: MOLECULAR
        description: 'DENND5A binds MUPP1 and PALS1, two components of the Crumbs apical polarity complex
          that is required for symmetric division of neural progenitors. The interaction is conformation-dependent:
          full-length DENND5A binds these partners only weakly, because the binding region makes intramolecular
          contacts with the DENN domain, and a conformational change is needed to expose it. Losing DENND5A
          therefore removes a conformationally gated link into the apical polarity machinery, which is
          the point at which this trafficking protein becomes a developmental one.'
        protein_complexes:
        - preferred_term: Crumbs apical polarity complex (MUPP1-PALS1)
        biological_processes:
        - preferred_term: establishment or maintenance of cell polarity
          term:
            id: GO:0007163
            label: establishment or maintenance of cell polarity
          modifier: DECREASED
        cellular_components:
        - preferred_term: apical plasma membrane
          term:
            id: GO:0016324
            label: apical plasma membrane
      selected_evidence:
        snippet: Mass spectrometry of purified proteins revealed members of the Crb polarity complex,
          MUPP1, and PALS1, as major DENND5A binding partners
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
