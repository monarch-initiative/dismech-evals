      assertion_type: Pathophysiology
      assertion:
        name: Premature Neuronal Differentiation and Cell Cycle Exit
        biological_scale: CELLULAR
        description: 'Knockout progenitors do not merely divide differently, they are inherently more
          likely to leave the cycle. One day after passaging into progenitor maintenance medium - conditions
          meant to keep them undifferentiated - 47.29 percent of knockout cells had developed neuronal
          processes against 10.67 percent of wild-type. The same shift is present in the adult mouse:
          knock-in animals have a higher proportion of NeuN-positive post-mitotic neurons in the subventricular
          zone. This is a propensity of the cells themselves, which is why it is curated as its own node
          with an input from the division defect rather than only as its consequence.'
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: neuron differentiation
          term:
            id: GO:0030182
            label: neuron differentiation
          modifier: INCREASED
        - preferred_term: cell fate commitment
          term:
            id: GO:0045165
            label: cell fate commitment
          modifier: INCREASED
      selected_evidence:
        snippet: Our results suggest that DENND5A expression promotes stemness and its loss drives cell
          cycle exit and premature differentiation into neuronal phenotypes
        supports: SUPPORT
