      assertion_type: Pathophysiology
      assertion:
        name: Seizure Generation and Developmental and Epileptic Encephalopathy
        biological_scale: ORGANISM
        conforms_to: epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures
        description: Recurrent, usually drug-resistant seizures in 21 of 24 individuals, with focal to
          bilateral tonic-clonic the most common type. Seizures then act back on development, the defining
          feature of a developmental and epileptic encephalopathy. Conformance attaches at the module's
          Recurrent Unprovoked Seizures node - the clinical endpoint - and not at the upstream excitation-inhibition
          or hyperexcitability nodes, because no ion-channel or synaptic measurement exists for this disorder
          to support those. The developmental encephalopathy here has an independent origin in the neurogenesis
          defect and is not solely seizure-driven.
        notes: Three of the 24 individuals had no seizures at all, so the seizure phenotype is not obligate
          even though the disorder is classified as a DEE. Those individuals also had milder neurological
          findings, which is consistent with the variant-class severity gradient recorded in the genetic
          section.
      selected_evidence:
        snippet: The phenotypes observed in more than 50% of individuals with biallelic DENND5A variants
          were seizures (21/24), microcephaly (16/24), ventriculomegaly (15/24), hypertonia (14/24), cerebral
          hypoplasia (13/24), and hyperreflexia (13/24)
        supports: SUPPORT
