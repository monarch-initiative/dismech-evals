        context: []
      assertion_type: Genetic
      assertion:
        name: DENND5A
        gene_term:
          preferred_term: DENND5A
          term:
            id: hgnc:19344
            label: DENND5A
        relationship_type: CAUSATIVE
        association: 'Biallelic loss-of-function variants in DENND5A cause DEE49. Thirty unique variants
          are reported across 22 families - 25 coding, 2 copy number and 3 splice-site - distributed across
          all folded domains. Variant class is itself a severity modifier: biallelic frameshift or nonsense
          variants produce significantly more neurological abnormality than biallelic missense variants.'
        notes: The recurrent missense variant R710H is the one place where a simple loss-of-function reading
          is insufficient. R710H sits in the DENN-RUN1 linker and is predicted to break a salt bridge
          to D598 that holds the closed conformation; experimentally it INCREASES binding to MUPP1 and
          PALS1 rather than abolishing it. The gain-of-interaction and the loss-of-protein findings are
          recorded here without being reconciled, because no source available to this entry does so -
          see the corresponding discussion. The deep-research report used to build this entry attributes
          PMID:27866705 to "Suri et al. 2016" and PMID:39174524 to "Rodrigues et al."; the actual first
          authors are Han and Banks respectively. The PMIDs themselves are correct and are what this entry
          cites.
      selected_evidence:
        snippet: caused by recessive loss-of-function mutations in DENND5A
        supports: SUPPORT
