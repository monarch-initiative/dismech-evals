          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 49
            term:
              id: MONDO:0015002
              label: developmental and epileptic encephalopathy, 49
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: rab_trafficking_neurotrophin_model
        status: ALTERNATIVE
        description: Loss of DENND5A's Rab-directed trafficking function raises neurotrophin receptor
          abundance and hence downstream signaling, and it is that signaling change that alters neuronal
          development. This was the founding account and it remains the one predicted by the protein's
          domain architecture, but it rests on knockdown experiments and has not been re-examined in the
          patient-derived neural progenitor and rosette systems that established the polarity mechanism.
          The two accounts are not mutually exclusive - a single protein with two conformations may serve
          both - and the trafficking arm is retained here rather than retired.
      selected_evidence:
        snippet: Mechanistically, these changes appear to result from upregulation of neurotrophin receptors,
          leading to enhanced downstream signaling
        supports: SUPPORT
