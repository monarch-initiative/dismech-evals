        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: apical_polarity_spindle_orientation_model
        status: CANONICAL
        description: Loss of DENND5A removes a conformationally gated link to the MUPP1/PALS1 apical polarity
          complex, apical progenitors misorient their mitotic spindles, symmetric proliferative division
          is lost, the progenitor pool is depleted early, and neurogenesis is cut short - producing microcephaly
          and cortical malformation, with seizures arising from the mispositioned neurons. This is the
          account with quantitative support in human iPSC-derived cells and corroboration in mouse and
          zebrafish.
      selected_evidence:
        snippet: This study provides a mechanism for DENND5A-related DEE that may be generalizable to
          other developmental conditions and provides variant-specific clinical information for physicians
          and families
        supports: SUPPORT
