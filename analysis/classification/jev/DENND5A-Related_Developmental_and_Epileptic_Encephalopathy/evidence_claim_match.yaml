            label: pseudo-TORCH syndrome
        description: 'The closest mechanistic mimic, and not by coincidence. OCLN encodes the tight-junction
          protein occludin, and recessive OCLN variants cause a DEE through a defect in the same process
          this disorder disrupts - neural progenitor symmetric cell division, there via impaired mitotic
          spindle formation and centrosome misalignment. The imaging converges too: cortical migration
          abnormalities plus calcifications.'
