      assertion:
        name: Reduced DENND5A Protein
        biological_scale: MOLECULAR
        description: 'The convergent proximal consequence. Cells from five cohort members - three iPSC-derived
          neural progenitor lines and two immortalized lymphoblast lines, spanning frameshift, nonsense
          and missense variants - all show reduced DENND5A protein. The reduction is post-transcriptional:
          patient mRNA levels do not differ significantly from controls, so the protein is lost after
          it is made rather than because the transcript is absent. This node is curated separately from
          the variants above because the protein and transcript measurements come apart, and it is the
          protein measurement that carries the loss-of-function claim.'
        cell_types:
        - preferred_term: neural progenitor cell
          term:
