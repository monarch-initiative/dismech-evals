      assertion_type: Diagnosis
      assertion:
        name: Brain Magnetic Resonance Imaging
        description: Neuroimaging is how these patients reach genetic testing rather than how the diagnosis
          is made. The imaging phenotype is distinctive enough to prompt a specific search - occipital-predominant
          pachygyria with striatal and periventricular calcifications, ventriculomegaly, corpus callosum
          agenesis or hypoplasia, basal ganglia and diencephalic-mesencephalic junction dysplasia - but
          not specific enough to settle it, since the same constellation raises OCLN-related disease,
          the tubulinopathies, LIS1-related lissencephaly and congenital infection.
        diagnosis_term:
          preferred_term: Magnetic Resonance Imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        notes: 'CT is an acceptable substitute where MRI is unavailable and was the modality in at least
          one cohort member, but it is not separately curated: NCIT''s CT terms describe the procedure
          without the neuro qualifier that would make the entry more informative than this one.'
      selected_evidence:
        snippet: These imaging studies highlight the heterogenous neuroanatomical manifestations of biallelic
          DENND5A variants, but certain features including volume loss, ventriculomegaly, and hypoplasia
          of the corpus callosum appear more frequently
        supports: SUPPORT
