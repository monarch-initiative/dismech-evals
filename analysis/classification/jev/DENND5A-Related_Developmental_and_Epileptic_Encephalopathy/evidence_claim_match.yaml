        name: LIS1-related lissencephaly
        description: LIS1 encodes a neuronal migration protein and produces a posterior gradient of lissencephaly
          - the same posterior-predominant direction as the DENND5A pachygyria, which is what makes it
          a live differential rather than a distant one.
        distinguishing_features:
        - Calcifications are absent in LIS1-related lissencephaly and present in DENND5A.
        - Corpus callosum size in LIS1 varies in both directions, including thicker than normal; in the
          DENND5A cohort it was normal, thin or absent with no case of increased volume. The directionality
          of the callosal finding, not merely its presence, is the discriminator.
        notes: No disease_term is bound. MONDO has no single term for LIS1-related lissencephaly as a
          class - the relevant concepts are gene- and syndrome-specific (Miller-Dieker, isolated lissencephaly
          sequence) and the source speaks of "variants in LIS1" generally, so binding any one of them
          would narrow the claim beyond what is written.
      selected_evidence:
        snippet: In contrast, corpus callosum volumes were either normal, thin, or absent with no cases
          of increased volume in our cohort
        supports: SUPPORT
