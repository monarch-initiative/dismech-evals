            label: vesicle-mediated transport
          modifier: DECREASED
        - preferred_term: retrograde transport, endosome to Golgi
          term:
            id: GO:0042147
            label: retrograde transport, endosome to Golgi
      selected_evidence:
        snippet: we aligned the co-crystal structure of DENND1B and Rab35 with the predicted DENND5A structure
