            term:
              id: MONDO:0015002
              label: developmental and epileptic encephalopathy, 49
        context: []
      assertion_type: Treatment
      assertion:
        name: Antiseizure Medication
        description: Management is symptomatic. No agent has disease-specific efficacy evidence, seizures
          are generally drug-resistant, and the cohort record includes agents that worsened seizures as
          well as agents that helped - phenytoin and lamotrigine each worsened seizures in one individual.
          Levetiracetam and sodium valproate were the most commonly reported agents achieving control.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: levetiracetam
            term:
              id: CHEBI:6437
              label: levetiracetam
          - preferred_term: valproic acid
            term:
              id: CHEBI:39867
              label: valproic acid
        notes: The mechanism gives no obvious therapeutic handle. The rate-limiting defect - spindle misorientation
          in apical progenitors - occurs during prenatal neurogenesis and is complete before the disorder
          presents, so a treatment aimed at the mechanism would have to act on a window that has closed
          by the time of diagnosis. This is a structural limitation of the disorder, not a gap in the
          drug literature.
      selected_evidence:
        snippet: Seizures were generally drug-resistant, but control was achieved in 6 cases with variable
          antiepileptic treatment. Anti-seizure medications variably helped, did not affect, or worsened
          seizures
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39174524
      reference_title: Loss of symmetric cell division of apical neural progenitors drives DENND5A-related
        developmental and epileptic encephalopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Curated PARTIAL: it records a mixed and often unsuccessful response, not an effective
        treatment. The explicit inclusion of worsening is why this cannot be read as support for antiseizure
        medication as such.'
