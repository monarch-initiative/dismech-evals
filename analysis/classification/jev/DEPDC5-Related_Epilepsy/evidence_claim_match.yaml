      assertion:
        name: DEPDC5 Germline Loss of Function and GATOR1 Complex Dysfunction
        description: A heterozygous germline loss-of-function variant in DEPDC5 (predominantly nonsense,
          frameshift, or splice variants acting through haploinsufficiency) depletes functional DEPDC5,
          a subunit of the GATOR1 complex. GATOR1 is the amino-acid-sensing GTPase-activating repressor
          of mTORC1, so reduced DEPDC5 dose impairs GATOR1's ability to restrain mTORC1. This is the inherited
          "first hit" of the DEPDC5 mTORopathy.
        role: trigger
