      assertion_type: Pathophysiology
      assertion:
        name: Brain-Somatic Second-Hit Biallelic DEPDC5 Loss
        description: In the subset of DEPDC5 carriers who develop a focal cortical lesion, a post-zygotic
          brain-somatic DEPDC5 variant arising during cortical development inactivates the second allele
          in trans within a focal neuronal clone. Deep sequencing of resected human epileptogenic cortex
          reveals a mosaic gradient, with the highest mutant fraction in the seizure-onset zone, providing
          proof of concept for a biallelic germline-plus-somatic two-hit mechanism that explains the focal
          nature of the dysplasia.
        role: driver
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: negative regulation of TOR signaling
          modifier: DECREASED
          term:
            id: GO:0032007
            label: negative regulation of TOR signaling
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: a biallelic 2-hit - brain somatic and germline - mutational mechanism in DEPDC5 causes
          focal epilepsy with FCD
        supports: SUPPORT
