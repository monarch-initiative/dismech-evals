      assertion_type: Discussion
      assertion:
        discussion_id: gap_depdc5_two_hit_universality
        prompt: Does the germline-plus-brain-somatic two-hit model account for all DEPDC5 focal cortical
          dysplasia (and nonlesional focal epilepsy), or do some lesions arise from germline haploinsufficiency
          alone or other second-hit routes?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Brain-Somatic Second-Hit Biallelic DEPDC5 Loss
        - pathophysiology#Dysmorphic Neurons and Focal Cortical Dysplasia
        rationale: The two-hit model is proven as a proof of concept in resected human tissue, with a
          mosaic gradient peaking at the seizure-onset zone, but somatic second hits are not detected
          in every DEPDC5 FCD case and nonlesional carriers have seizures without visible dysplasia. Whether
          biallelic loss is universally required for the lesion, or whether haploinsufficiency alone (or
          an undetected/undetectable somatic event) suffices, remains unresolved.
        proposed_experiments:
        - experiment_id: exp_depdc5_two_hit_prevalence
          name: Systematic somatic second-hit detection across DEPDC5 FCD and nonlesional cortex
          description: Apply ultra-deep and single-nucleus sequencing to a large series of resected DEPDC5
            epileptogenic specimens (both FCD-positive and MRI-normal) to quantify the fraction harboring
            a detectable brain-somatic second hit and correlate mutant allele fraction with histopathology
            severity.
          experiment_type:
            preferred_term: somatic variant prevalence study
          model_systems:
          - name: DEPDC5 surgical tissue biobank
            description: Resected epileptogenic cortex from germline DEPDC5 carriers spanning FCD and
              nonlesional phenotypes.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: a biallelic 2-hit - brain somatic and germline - mutational mechanism in DEPDC5 causes
          focal epilepsy with FCD
        supports: SUPPORT
