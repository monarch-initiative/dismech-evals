        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_depdc5_incomplete_penetrance
        prompt: Why do only some heterozygous DEPDC5 germline loss-of-function carriers develop epilepsy,
          given that up to 64% of pathogenic variants are inherited from clinically unaffected parents?
          What genetic, somatic, or environmental modifiers determine penetrance?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#DEPDC5 Germline Loss of Function and GATOR1 Complex Dysfunction
        rationale: 'The germline DEPDC5 allele is necessary but frequently insufficient for disease: a
          large cohort found dominant inheritance from an asymptomatic parent in 64% of probands, illustrating
          markedly reduced penetrance. The determinants of who among carriers becomes affected (a focal
          somatic second hit, additional modifier variants, or environmental triggers) are not established,
          and this directly limits genetic counseling.'
        proposed_experiments:
        - experiment_id: exp_depdc5_penetrance_somatic_screen
          name: Deep-sequencing screen for brain-somatic second hits across affected vs unaffected carriers
          description: In carriers with epilepsy versus unaffected relatives carrying the same germline
            DEPDC5 variant, use high-depth sequencing of resected/biopsy brain tissue (or surrogate tissues)
            to test whether a focal brain-somatic second hit, additional modifier variants, or mTORC1-pathway
            polygenic background distinguishes affected from unaffected carriers.
          experiment_type:
            preferred_term: genetic modifier and somatic-variant association study
          model_systems:
          - name: Carrier cohort with paired germline and brain-tissue sequencing
            description: Families segregating a DEPDC5 germline variant with both affected and unaffected
              carriers, with access to resected epileptogenic tissue where available.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: Variants were dominantly inherited from an asymptomatic parent in 64% (29/45) of the
          probands, illustrating the reduced penetrance of GATOR1 variants.
        supports: SUPPORT
    origin:
