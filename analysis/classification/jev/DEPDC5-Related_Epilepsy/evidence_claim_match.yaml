        prompt: Does mTORC1 inhibition (sirolimus/everolimus) modify seizures or epileptogenesis in humans
          with DEPDC5-related epilepsy, as it does in Depdc5-loss mouse models, or is the preclinical
          rescue not translatable?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Constitutive mTORC1 Hyperactivation
        rationale: Chronic mTORC1 inhibition rescues behavioral and biochemical deficits in neuronal Depdc5-knockout
          mice, providing strong model-organism support for a precision-therapy rationale. However, controlled
          human evidence that mTOR inhibitors reduce seizures or SUDEP risk in DEPDC5 carriers is lacking,
          and focal biallelic-loss lesions may respond differently from a global germline knockout; translational
          validity is therefore the open question.
        proposed_experiments:
        - experiment_id: exp_depdc5_mtor_inhibitor_trial
          name: Controlled trial of mTOR inhibition in DEPDC5/GATOR1 drug-resistant focal epilepsy
          description: Conduct a controlled clinical trial (or well-powered n-of-1 series) of sirolimus
            or everolimus in genetically confirmed DEPDC5 drug-resistant focal epilepsy, with seizure
            frequency, EEG, and pharmacodynamic mTORC1 (pS6) readouts as endpoints, to test whether the
            mouse rescue translates to humans.
          experiment_type:
            preferred_term: interventional clinical trial
          model_systems:
          - name: DEPDC5 drug-resistant focal epilepsy cohort
            description: Genetically confirmed DEPDC5 carriers with drug-resistant focal epilepsy who
              are not immediate surgical candidates.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: Collectively, our data provide the first evidence of behavioral alterations in mice with
          Depdc5 loss and support mTOR inhibition as a rational therapeutic strategy for DEPDC5-related
          epilepsy in humans
        supports: SUPPORT
