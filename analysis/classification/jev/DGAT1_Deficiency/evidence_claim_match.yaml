        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Enteropathy with Intestinal Protein Loss
        description: The effector node and the disorder's most distinctive feature. Mucosal injury produces
          an exudative (protein-losing) enteropathy in which serum proteins leak into the gut lumen, giving
          hypoalbuminemia, hypogammaglobulinemia and elevated stool alpha-1-antitrypsin, with peripheral
          edema when albumin falls far enough and susceptibility to recurrent infection when immunoglobulins
          do. Hypertriglyceridemia commonly accompanies it. The mucosa is nonetheless endoscopically and
          histologically unremarkable in most cases, which is why this disorder is missed by the biopsy-first
          diagnostic pathway that serves the structural enteropathies.
        role: effector
        biological_scale: TISSUE
        locations:
        - preferred_term: Small intestine
          term:
            id: UBERON:0002108
            label: small intestine
      selected_evidence:
        snippet: are mainly manifested by chronic diarrhea, vomiting, growth retardation, hypoalbuminemia
          to varying degrees, and some associated with hypogammaglobulinemia and hyperlipidemia. Endoscopy
          usually shows no specific changes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
