  1a1db07240839967148817f33da542b2b0f2ef95436fdfb18476140568e8a5a3:
    claim:
      about:
        disease:
          name: DGAT1 Deficiency
          disease_term:
            preferred_term: DGAT1 deficiency
            term:
              id: MONDO:0014375
              label: congenital diarrhea 7 with exudative enteropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Enterocyte Triglyceride Packaging and Substrate Accumulation
        description: 'The rate-limiting step, and the point at which the disorder becomes fat-dependent.
          Within the enterocyte, triglyceride is either stored in cytoplasmic lipid droplets or packaged
          into chylomicrons for export to the lymphatic system; both routes require DGAT1-synthesised
          triglyceride. Without it, neither can proceed, and the unesterified DGAT substrates - diacylglycerol
          and fatty acyl-CoA - build up in the intestinal mucosa. This substrate accumulation, rather
          than the absence of triglyceride as such, is the proposed proximate cause of mucosal injury,
          and it explains the dose dependence on dietary fat: the more fat is presented for absorption,
          the more substrate accumulates.'
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Small-intestinal enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        biological_processes:
        - preferred_term: Chylomicron assembly
          term:
            id: GO:0034378
            label: chylomicron assembly
          modifier: DECREASED
        - preferred_term: Intestinal lipid absorption
          term:
            id: GO:0098856
            label: intestinal lipid absorption
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Cytoplasmic lipid droplet
          term:
            id: GO:0005811
            label: lipid droplet
      selected_evidence:
        snippet: The precise cause of diarrhea is unknown, but we speculate that it relates to abnormal
          fat absorption and buildup of DGAT substrates in the intestinal mucosa.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
