        context:
        - path: /treatments/0
          value:
            name: Low-Fat Amino Acid Formula
            description: The treatment of choice, and a clean demonstration that the disorder is fat-load-dependent.
              A low-fat amino-acid-based formula for special medical purposes rapidly relieves diarrhea
              and vomiting and improves nutritional status and growth. The comparison that makes this
              specific is that neither hydrolysed formula nor high-medium-chain-triglyceride formula relieved
              the diarrhea in the same infants - so the benefit comes from lowering the fat load presented
              for absorption, not from altering protein hydrolysis or fatty acid chain length. Tolerance
              for dietary fat improves with age, allowing gradual liberalisation.
            therapeutic_modality: BEHAVIORAL
            treatment_term:
              preferred_term: dietary intervention
              term:
                id: NCIT:C15447
                label: Dietary Intervention
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Failure of Enterocyte Triglyceride Packaging and Substrate Accumulation
        treatment_effect: INHIBITS
        description: Reducing dietary fat lowers the diacylglycerol and fatty acyl-CoA load presented
          to the enterocyte, limiting the accumulation of unesterified DGAT substrates in the mucosa without
          restoring enzyme activity.
      selected_evidence:
        snippet: Neither hydrolyzed nor high-medium chain triglyceride (MCT) formula significantly alleviated
          diarrheal symptoms; however, a low-fat amino acid diet rapidly relieved symptoms and significantly
          improved nutritional status, with infants showing better tolerance to dietary fat content with
          age.
        supports: SUPPORT
