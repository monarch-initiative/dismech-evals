              label: congenital disorder of glycosylation, type 1DD
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DHRSX Oxidoreductase Deficiency
        description: 'The reported variants — p.(Thr49Met), p.(Val181Phe), and p.(Leu215Phe) — cluster
          around the predicted NAD(P)+ binding site and the substrate access channel. Thr49 is an obligatory
          residue of the Class IV NAD(P)+ binding motif; Val181 contacts the cofactor directly and sits
          at the mouth of the substrate channel; Leu215 lies along that channel. All three are therefore
          expected to impair the enzyme''s oxidoreductase function. They also destabilize the protein:
          patient cells carry about 4-5% of control DHRSX protein while mRNA remains at 34-68% of control,
          so the dominant effect is loss of the enzyme rather than a purely catalytic lesion in a normally
          abundant one.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: NAD(P)-dependent oxidoreductase activity of DHRSX
          term:
            id: GO:0016616
            label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Altogether, the variants observed in our patients were expected to severely impact the
          putative oxidoreductase function of DHRSX.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
