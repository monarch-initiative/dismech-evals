        name: Multisystem Glycoprotein Dysfunction
        conforms_to: congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction
        biological_scale: ORGANISM
        description: 'The organism-level convergence. Because many glycoproteins are underglycosylated
          at once, the disease presents across systems rather than in one organ: distinctive facial features,
          severe neurological involvement, profound sensorineural hearing loss with absent cochlear and
          vestibular nerves, ocular surface disease, skeletal deformity, severe failure to thrive, respiratory
          insufficiency and hepatic involvement. Which organs dominate is not predictable from the enzyme
          defect, which is why every edge out of this node is indirect with unknown intermediates. The
          cochlear nerve agenesis in particular is not a general CDG feature and is the subject of its
          own knowledge gap.'
        biological_processes:
        - preferred_term: protein N-linked glycosylation
