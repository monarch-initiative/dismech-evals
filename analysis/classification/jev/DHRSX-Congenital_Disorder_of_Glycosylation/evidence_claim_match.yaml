            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Biallelic missense variants in DHRSX, which lies in pseudoautosomal region 1 of the
          X and Y chromosomes. Because PAR1 genes are present in two copies in both sexes and escape X-inactivation,
          transmission is effectively autosomal recessive rather than X-linked — the affected individuals
          include both females and males. HPO has no dedicated pseudoautosomal-recessive term, so the
          standard autosomal recessive term is bound here and the pseudoautosomal location recorded in
          this description.
      selected_evidence:
        snippet: Here, we report a CDG caused by biallelic missense variants in DHRSX, a gene located
          in the pseudoautosomal region 1 of the X and Y chromosomes.
        supports: SUPPORT
