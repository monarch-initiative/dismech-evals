        context: []
      assertion_type: Diagnosis
      assertion:
        name: Polyisoprenoid profiling
        description: The confirmatory second-tier test, and the one that discriminates this disorder from
          SRD5A3-CDG where transferrin isoelectric focusing cannot. DHRSX deficiency raises polyprenol
          and its derivatives and lowers dolichol and its derivatives while leaving polyprenal unchanged
          - it is the unchanged polyprenal that localizes the block to the DHRSX-catalysed steps rather
          than the SRD5A3 step between them.
      selected_evidence:
        snippet: Both cell lines showed increased levels of polyprenol and its derivatives, concomitant
          with decreased levels of dolichol and derivatives, but no change in polyprenal levels, suggesting
          DHRSX deficiency.
        supports: SUPPORT
