      assertion_type: Pathophysiology
      assertion:
        name: Defective Lipid-Linked Oligosaccharide Maturation
        conforms_to: congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect
        description: Dolichol-phosphate is rate-limiting for N-glycosylation because dolichol-phosphate
          sugars are used at seven steps of LLO assembly. DPAGT1 (which transfers GlcNAc-1-P onto Dol-P),
          DPM synthase, and ALG3 (which adds the sixth mannose) are all markedly inefficient when handed
          the polyprenol-linked analogue instead. The LLO therefore stalls as an immature linear Man-5
          species, with Man-4 arising downstream through EDEM3.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: dolichol-linked oligosaccharide biosynthetic process
          term:
            id: GO:0006488
            label: dolichol-linked oligosaccharide biosynthetic process
          modifier: DECREASED
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
      selected_evidence:
        snippet: The availability of dolichol-phosphate is rate-limiting for N-glycosylation, since dolichol-phosphate
          sugars are used in seven steps during the formation of the LLO.
        supports: SUPPORT
