      assertion_type: Diagnosis
      assertion:
        name: Molecular testing of the pseudoautosomal region
        description: Sequencing is the definitive test, but DHRSX lies in pseudoautosomal region 1, which
          standard variant-calling pipelines cover poorly because reads map ambiguously between the X
          and Y copies. PAR1-aware calling is needed, and a negative exome that did not handle PAR1 correctly
          does not exclude this diagnosis.
      selected_evidence:
        snippet: Here, we report a CDG caused by biallelic missense variants in DHRSX, a gene located
          in the pseudoautosomal region 1 of the X and Y chromosomes.
        supports: SUPPORT
