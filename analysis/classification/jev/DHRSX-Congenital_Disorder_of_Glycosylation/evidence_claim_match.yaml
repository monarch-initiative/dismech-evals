  9cf5a287e8083445524dd48387b76e632f22bce8382103ae99a8eafcdd5a6ebc:
    claim:
      about:
        disease:
          name: DHRSX-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: congenital disorder of glycosylation, type 1DD
            term:
              id: MONDO:0975846
              label: congenital disorder of glycosylation, type 1DD
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dolichol_role_versus_autophagy_role
        kind: KNOWLEDGE_GAP
        prompt: Does DHRSX's reported secreted, autophagy-regulating role contribute to this disease,
          or is the phenotype entirely explained by the ER dolichol synthesis defect?
        attaches_to:
        - pathophysiology#DHRSX Oxidoreductase Deficiency
        - pathophysiology#Protein Hypoglycosylation
        rationale: 'Before its role in dolichol biosynthesis was known, DHRSX was characterized as a non-classical
          secretory protein that positively regulates starvation-induced autophagy. The patient variants
          cluster around the NAD(P)+ binding site and substrate channel, which on structural grounds alone
          would suggest a specifically catalytic lesion - but patient cells retain only about 4-5% of
          control DHRSX protein, so the enzyme is largely absent and both the oxidoreductase and the autophagy-associated
          functions would be lost together. That is what makes this question live rather than academic:
          the autophagy role cannot be assumed spared. Separating the two would need catalytically dead
          versus secretion-deficient constructs in a disease-relevant cell type. It matters because the
          entire pathograph in this entry runs through glycosylation, and an unrecognised autophagy contribution
          would be a parallel arm it does not represent.'
      selected_evidence:
        snippet: these results demonstrate that DHRSX is a novel non-classical secretory protein involved
          in the positive regulation of starvation induced autophagy
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25076851
      reference_title: DHRSX, a novel non-classical secretory protein associated with starvation induced
        autophagy.
      evidence_source: IN_VITRO
      explanation: Establishes the second, non-glycosylation function of DHRSX that this gap is about.
        Indirect for the disease because the work is overexpression and siRNA knockdown in HeLa and U2OS
        cells with no patient material and no connection to the CDG phenotype.
