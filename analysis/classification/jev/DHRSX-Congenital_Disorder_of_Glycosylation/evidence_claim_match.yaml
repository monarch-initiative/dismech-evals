  0199061c5918079220e36de3b9973381ba9ca48d7f8155442a5f328799450f85:
    claim:
      about:
        disease:
          name: DHRSX-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: congenital disorder of glycosylation, type 1DD
            term:
              id: MONDO:0975846
              label: congenital disorder of glycosylation, type 1DD
        context: []
      assertion_type: Genetic
      assertion:
        name: DHRSX
        notes: Biallelic missense variants in DHRSX (NM_145177.3), encoding a dehydrogenase/reductase
          with dual NAD+-dependent dehydrogenase and NADPH-dependent reductase activity in dolichol biosynthesis.
          Reported alleles are c.146C>T p.(Thr49Met), c.541G>T p.(Val181Phe), and c.643C>T p.(Leu215Phe).
          The gene lies in pseudoautosomal region 1, so it is present on both sex chromosomes and inherited
          as if autosomal. The variants are predicted to disrupt NAD(P)+ cofactor binding or substrate
          access, and they additionally destabilize the protein - measured at roughly 4-5% of control
          levels in patient cells against near-normal mRNA.
        gene_term:
          preferred_term: DHRSX
          term:
            id: hgnc:18399
            label: DHRSX
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: NM_145177.3:c.146C>T (p.Thr49Met)
          description: Thr49 is an obligatory residue of the Class IV NAD(P)+ binding motif, so this substitution
            is predicted to disrupt cofactor binding.
          type: missense
          clinical_significance: PATHOGENIC
        - name: NM_145177.3:c.541G>T (p.Val181Phe)
          description: Val181 contacts the cofactor directly and sits at the interface of the NAD(P)+
            site and the substrate access channel; inserting a bulky phenylalanine is predicted to disrupt
            both.
          type: missense
          clinical_significance: PATHOGENIC
        - name: NM_145177.3:c.643C>T (p.Leu215Phe)
          description: Leu215 lies along the substrate access channel, close to Lys212, which is predicted
            to hydrogen-bond the cofactor.
          type: missense
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: we report a pseudoautosomal-recessive disease presenting as a congenital disorder of
          glycosylation in patients with missense variants in DHRSX (DHRSX-CDG)
        supports: SUPPORT
    origin:
