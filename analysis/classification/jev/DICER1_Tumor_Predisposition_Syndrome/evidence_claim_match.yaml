        description: 'The diagnosis rests on a heterozygous germline DICER1 variant known or suspected
          to cause loss of function. The zygosity and the mechanism in that sentence both matter for this
          entry: the constitutional variant is loss-of-function and heterozygous, whereas the somatic
          event characteristic of DICER1 tumors is an RNase IIIb missense change that alters rather than
          abolishes enzyme activity — which is why this entry conforms only partially to the two-hit module.'
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: A heterozygous germline loss-of-function DICER1 variant establishes the diagnosis and
          starts age-structured surveillance.
