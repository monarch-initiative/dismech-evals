  d7d6295e547c4a589ff9ac537cacf8ddac408cd392a7e50ef8b6b0684c32797b:
    claim:
      about:
        disease:
          name: DICER1 Tumor Predisposition Syndrome
          disease_term:
            preferred_term: DICER1-related tumor predisposition
            term:
              id: MONDO:0100216
              label: DICER1-related tumor predisposition
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Compartment-Restricted Loss of DICER1 Expression
        description: 'In pleuropulmonary blastoma, DICER1 protein is undetectable in the epithelial component
          of the tumor but retained in the malignant mesenchyme — the opposite of what a conventional
          second-hit model would predict, since it is the mesenchyme that transforms. This node deliberately
          does NOT declare conformance to the biallelic-loss node of the germline two-hit module: the
          somatic event characteristic of DICER1 tumors is a missense change in the RNase IIIb domain
          that alters strand-selective processing rather than abolishing the enzyme, and the compartment
          in which expression is lost is not the compartment that becomes malignant.'
        role: amplifier
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: pre-miRNA processing
          term:
            id: GO:0031054
            label: pre-miRNA processing
          modifier: DECREASED
      selected_evidence:
        snippet: Expression of DICER1 protein was undetectable in the epithelial component of PPB tumors
          but was retained in the malignant mesenchyme (sarcoma).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19556464
      reference_title: DICER1 mutations in familial pleuropulmonary blastoma.
      evidence_source: HUMAN_CLINICAL
      explanation: The immunohistochemical observation that establishes the compartment restriction and
        is the reason this entry withholds conformance to the classical biallelic node.
