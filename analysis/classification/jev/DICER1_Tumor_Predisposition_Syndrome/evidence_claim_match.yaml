      assertion_type: Pathophysiology
      assertion:
        name: Germline DICER1 First-Hit Inactivation
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        description: 'A heterozygous germline DICER1 variant is present constitutionally; in the original
          multiplex pleuropulmonary blastoma families ten of eleven alleles truncated the protein proximal
          to its two carboxy-terminal RNase III domains and were therefore loss-of-function. Heterozygosity
          is well tolerated: the majority of obligate carriers are phenotypically normal and mice haploinsufficient
          for Dicer1 show no overt abnormality, so one functional allele suffices for normal development
          and is insufficient for tumor formation.'
        role: trigger
        biological_scale: MOLECULAR
        gene:
          preferred_term: DICER1
          modifier: DECREASED
          term:
            id: hgnc:17098
            label: DICER1
        genetic_context:
          gene:
            preferred_term: DICER1
            term:
              id: hgnc:17098
              label: DICER1
          variant_origin: GERMLINE
          allelic_hit_role: FIRST_HIT
          allelic_events:
          - PATHOGENIC_VARIANT
          - NONSENSE_VARIANT
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Constitutional heterozygous DICER1 variant, predominantly truncating proximal to
            the RNase III domains.
      selected_evidence:
        snippet: Apart from PPB-associated tumors in a subset of family members, the majority of obligate
          carriers with DICER1 mutations are phenotypically normal indicating that loss of one DICER1
          allele is compatible with normal development and insufficient for tumor formation.
        supports: SUPPORT
