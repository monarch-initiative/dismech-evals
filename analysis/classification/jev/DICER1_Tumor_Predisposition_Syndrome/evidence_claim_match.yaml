              label: DICER1-related tumor predisposition
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-Cell-Autonomous Mesenchymal Transformation
        description: 'The proposed mechanism linking epithelial DICER1 loss to mesenchymal malignancy:
          without normal microRNA processing, the developing lung epithelium mis-regulates diffusible
          factors that control proliferation of the mesenchymal cells in the cyst wall, which then expand
          and acquire further genetic changes. This is explicitly a hypothesis in the source and is curated
          as such rather than as established mechanism; the cystic-to-sarcomatous natural history of pleuropulmonary
          blastoma is itself the observation that suggests a multi-step pathogenesis.'
        role: effector
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: We hypothesize that loss of DICER1 in the epithelium of the developing lung alters the
          regulation of diffusible factors that promote mesenchymal proliferation.
        supports: SUPPORT
