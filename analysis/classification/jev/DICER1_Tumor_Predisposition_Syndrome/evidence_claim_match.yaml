              label: DICER1-related tumor predisposition
        context: []
      assertion_type: Treatment
      assertion:
        name: Age-Structured Tumor Surveillance
        notes: 'Curated under `treatments:` as a management intervention, not as a claim that imaging
          or biochemistry is itself therapeutic. In a two-hit predisposition syndrome the second hit cannot
          be prevented, so the only available lever is stage at detection: surveillance is the intervention
          that converts an unavoidable tumor into a resectable one. Where a `target_mechanisms` link is
          present it points at the clinical-outcome node for that reason, and never at an upstream mechanistic
          node.'
        description: 'Surveillance in DICER1 syndrome is structured around organ development rather than
          run at a constant rate: chest imaging is dense in infancy and early childhood when pleuropulmonary
          blastoma presents, then tapers; thyroid ultrasound starts at age eight; pelvic ultrasound covers
          the gynaecological tumors of adolescence and early adulthood. GeneReviews puts family education
          about symptoms first, ahead of any imaging schedule.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Ultrasound Imaging
          term:
            id: NCIT:C17230
            label: Ultrasound Imaging
      selected_evidence:
        snippet: Family education regarding signs and symptoms of DICER1-related tumors is the cornerstone
          of surveillance.
        supports: SUPPORT
