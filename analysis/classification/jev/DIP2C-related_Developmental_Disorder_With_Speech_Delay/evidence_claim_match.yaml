              is loss of one functional DIP2C copy. Two de novo missense variants were also reported and
              their effect is unknown. DIP2C is expressed most highly in the human neocortex in mid-gestation,
              which places the dosage loss in the period of cortical development. Across the conserved
              DIP2 family, the acyl-CoA synthetase (fatty acyl-AMP ligase-like) domains regulate a specific
              subset of diacylglycerols; whether DIP2C does this in human neurons has not been tested.
