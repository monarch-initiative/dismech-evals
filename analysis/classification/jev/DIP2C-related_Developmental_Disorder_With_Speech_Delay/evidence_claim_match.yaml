            label: DIP2C
        presence: PRESENT
        relationship_type: CAUSATIVE
        association: Heterozygous DIP2C variants are the defining cause. In the 23-patient cohort the
          variants were nonsense, frameshift and canonical splice-site alleles predicted to cause loss
          of function, plus two de novo missense variants; ten patients had de novo variants and nine
          had inherited ones. Earlier reports include a de novo canonical splice-acceptor variant in a
          child ascertained for childhood apraxia of speech (later included as patient 14 of the 23-patient
          cohort), and a de novo splice-site variant in an infant with focal epilepsy. A high-impact DIP2C
          frameshift was also prioritized in a Swedish cohort with severe developmental language disorder.
          A 67.6 kb mosaic deletion removing at least two DIP2C exons, classed as a variant of uncertain
          significance, was found in two children with hemiplegic cerebral palsy, one of whom also had
          a middle cerebral artery infarction. No ClinGen gene-disease validity record exists for DIP2C.
      selected_evidence:
        snippet: With the cases presented herein, we provide phenotypic and genotypic data supporting
          the association between loss-of-function variants in DIP2C with a neurocognitive phenotype.
        supports: SUPPORT
