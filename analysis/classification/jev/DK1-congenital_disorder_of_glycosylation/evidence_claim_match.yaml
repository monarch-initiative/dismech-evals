            label: Laboratory Procedure
        description: Serum transferrin isoelectric focusing or mass-spectrometry-based glycoform analysis
          detects the characteristic type I CDG screening pattern.
        results: Type I underglycosylated transferrin supports DK1-CDG and should prompt confirmatory
          DOLK sequencing.
      selected_evidence:
        snippet: ESI-MS of transferrin (Mayo Clinic, Rochester, MN) demonstrated elevated mono-oligosaccharide:di-oligosaccharide
