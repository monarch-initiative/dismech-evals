          transferrin ratio of 0.216 (reference range < 0.050). These ratios are indicative of Type I
          CDG, resulting in impaired synthesis or transfer of the LLO precursor that subsequently generates
          proteins with unoccupied glycosylation sites [2].
        supports: SUPPORT
