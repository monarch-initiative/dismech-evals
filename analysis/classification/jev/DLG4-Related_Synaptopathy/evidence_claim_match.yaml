        description: 'PSD-95 level is instructive, not merely permissive, for excitatory synapse maturation:
          raising it drives glutamatergic synapses to maturity, enhances presynaptic terminal maturation
          transsynaptically, and increases the number and size of dendritic spines. Halving it therefore
          leaves a developing cortex with fewer functionally mature excitatory synapses during the window
          of synaptogenesis.

          The maturation failure is functional and is explicitly dissociated from spine morphology, which
          is the single most important caveat on this node. In the complete knockout the functionally
          silent synapses sit on morphologically mature spines, and PSD-95 mutant mice show unaffected
          synaptic morphology — so this entry deliberately does not assert a dendritic-spine-development
          deficit, and a negative spine-imaging result in a DLG4 model or patient neuron would not count
          against the node.

          '
