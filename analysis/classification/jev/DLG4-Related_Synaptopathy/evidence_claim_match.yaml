              in DLG4 (PSD-95); the OMIM/MONDO label is "intellectual developmental disorder 62" (MRD62).
            term:
              id: MONDO:0032919
              label: intellectual developmental disorder 62
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dlg4_genotype_phenotype
        prompt: Why do individuals carrying the same DLG4 variant differ so widely in severity, from mild
          intellectual disability without epilepsy to a regressive DEE-SWAS course? What determines whether
          a given individual develops sleep-activated epileptiform encephalopathy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Sleep-Activated Epileptiform Encephalopathy (DEE-SWAS/ESES)
        - pathophysiology#Developmental Regression
        - pathophysiology#Neurodevelopmental Phenotypic Output
        rationale: The largest epilepsy-focused cohort could not identify a genotype-phenotype relationship
          even between individuals carrying identical DLG4 variants, which rules out variant identity
          as the explanation and points instead to modifier genes, developmental timing or stochastic
          circuit factors. Because DEE-SWAS is the single strongest predictor of regression, predicting
          who will develop it is the question with the most direct clinical consequence in this disorder.
        proposed_experiments:
        - experiment_id: dlg4_prospective_sleep_eeg_cohort
          name: Prospective longitudinal sleep-EEG cohort in DLG4 variant carriers
          description: Follow an unselected cohort of DLG4 variant carriers with serial sleep or 24-hour
            EEG to establish the incidence, age window and clinical predictors of DEE-SWAS onset, which
            no retrospective series can supply.
          decision_criterion: Identification of a reproducible pre-DEE-SWAS EEG or clinical signature
            would make the regression risk predictable and the surveillance interval evidence-based.
        - experiment_id: dlg4_psd95_partner_modifier_screen
          name: Modifier screen in PSD-95 interaction partners
          description: Test whether variation in PSD-95 binding partners already implicated in epilepsy
            (LGI1-ADAM22, KCNA1/KCNA2, GRIN2A/GRIN2B) modifies the epilepsy phenotype among DLG4 carriers,
            the leading candidate explanation for within-variant phenotypic divergence.
      selected_evidence:
        snippet: We could not identify a clear genotype-phenotype relationship even between individuals
          with the same DLG4 variants.
        supports: SUPPORT
    origin:
