              in DLG4 (PSD-95); the OMIM/MONDO label is "intellectual developmental disorder 62" (MRD62).
            term:
              id: MONDO:0032919
              label: intellectual developmental disorder 62
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
        biological_scale: CELLULAR
        role: central_effector
        conforms_to: excitatory_synapse_scaffold_disruption#Impaired Synaptic Plasticity and Excitatory-Inhibitory
          Imbalance
        description: 'PSD-95 couples the NMDA receptor to the machinery that decides whether a given firing
          pattern potentiates or depresses a synapse. Without it, the frequency-response function of NMDA-dependent
          long-term potentiation and depression is shifted, producing strikingly enhanced LTP across stimulation
          frequencies rather than a simple loss of plasticity — a bidirectional learning rule broken in
          the direction of over-potentiation. The excitation-inhibition framing is an inference rather
          than a measurement in this disorder: the studies cited here quantified glutamatergic transmission
          and plasticity only, and none of them measured GABAergic transmission alongside it. PSD-95 is
          confined to excitatory synapses, so a shifted set point is the expected consequence, but a comparable
          inhibitory deficit has not been excluded.

          '
        cell_types:
        - preferred_term: Glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: Long-term synaptic potentiation
          term:
            id: GO:0060291
            label: long-term synaptic potentiation
          modifier: DYSREGULATED
        - preferred_term: Regulation of synaptic plasticity
          term:
            id: GO:0048167
            label: regulation of synaptic plasticity
          modifier: DYSREGULATED
        - preferred_term: Glutamatergic synaptic transmission
          term:
            id: GO:0035249
            label: synaptic transmission, glutamatergic
          modifier: DECREASED
      selected_evidence:
        snippet: In mutant mice lacking PSD-95, the frequency function of NMDA-dependent LTP and LTD is
          shifted to produce strikingly enhanced LTP at different frequencies of synaptic stimulation.
        supports: SUPPORT
