  ceedbd2058ee492b7d1d6ed4da3070dd5b2a0724c0d019d56df80d408ec3055e:
    claim:
      about:
        disease:
          name: DLG4-Related Synaptopathy
          disease_term:
            preferred_term: DLG4-related synaptopathy
            description: Autosomal dominant synaptopathy caused by heterozygous loss-of-function variants
              in DLG4 (PSD-95); the OMIM/MONDO label is "intellectual developmental disorder 62" (MRD62).
            term:
              id: MONDO:0032919
              label: intellectual developmental disorder 62
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hmm_homozygous_null_vs_human_haploinsufficiency
        prompt: The mechanistic literature that defines PSD-95 function — the shifted LTP/LTD frequency-response,
          the AMPA-receptor and silent-synapse phenotype, the autism-relevant behavioural profile — comes
          almost entirely from homozygous Dlg4-null or PSD-95-truncating mice, whereas every affected
          human is heterozygous. Does halving PSD-95 dose produce a proportionate, qualitatively similar
          synaptic phenotype, or does the near-complete loss studied in mice engage compensations and
          failure modes that a haploinsufficient synapse never reaches?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
        - pathophysiology#Impaired Excitatory Synaptic Plasticity and Excitation-Inhibition Imbalance
        rationale: The gap is not hypothetical. Homozygous Dlg4 deletion adversely affects survival in
          mice, so the null phenotype is measured in a survivor-selected population with no human counterpart,
          and the complete knockout leaves a substantial subpopulation of synapses unaffected, implying
          a threshold rather than a linear dose-response. The one heterozygous patient-allele model published
          to date does reproduce reduced PSD-95 protein and cognitive and sleep phenotypes, but showed
          no spontaneous seizures despite epilepsy affecting about half of affected humans — the clearest
          signal so far that the heterozygous state is not simply a milder null.
        proposed_experiments:
        - experiment_id: dlg4_het_vs_null_synaptic_physiology
          name: Side-by-side heterozygous versus homozygous Dlg4 synaptic physiology
          description: Measure LTP/LTD frequency-response functions, AMPA/NMDA ratio and silent-synapse
            fraction in Dlg4+/- and Dlg4-/- hippocampus on one genetic background, to establish whether
            the half-dose state is a proportionate version of the null or a qualitatively different phenotype.
          decision_criterion: A monotonic, proportionate shift across genotypes would support extrapolating
            null-mouse mechanism to human haploinsufficiency; a threshold effect, with Dlg4+/- indistinguishable
            from wild type, would refute it.
        - experiment_id: dlg4_ipsc_neuron_synaptic_content
          name: Synaptic PSD-95 and AMPA-receptor content in patient iPSC-derived neurons
          description: Quantify PSD-95 protein per synapse and synaptic AMPA-receptor content in neurons
            differentiated from the patient-derived AOUMEYi004-A iPSC line against an isogenic corrected
            control, moving the receptor-anchoring claim into human cells at the correct heterozygous
            dose.
        - experiment_id: dlg4_knockin_provoked_seizure_threshold
          name: Provoked-seizure threshold in the Dlg4 V692Wfs*12/+ knock-in
          description: Test chemically or electrically provoked seizure susceptibility in the heterozygous
            patient-allele knock-in, since spontaneous seizures were absent but the seizure threshold
            was never probed.
          decision_criterion: A lowered provoked-seizure threshold would reconcile the model with the
            ~50% human epilepsy frequency; a normal threshold would sharpen the mismatch.
      selected_evidence:
        snippet: We also observed that a significant population of synapses appeared unaffected by PSD-95
          gene deletion, suggesting that the functional role of PSD-95 displays synapse-specificity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17148601
      reference_title: Synapse-specific regulation of AMPA receptor function by PSD-95.
      evidence_source: MODEL_ORGANISM
      explanation: Even complete PSD-95 deletion spares many synapses, so extrapolating a null phenotype
        to a half-dose state is not straightforward.
