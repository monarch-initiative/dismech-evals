              label: intellectual developmental disorder 62
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sleep-Activated Epileptiform Encephalopathy (DEE-SWAS/ESES)
        biological_scale: TISSUE
        role: consequence
        description: 'In about a quarter of individuals with DLG4-related epilepsy, epileptiform activity
          is massively potentiated by slow-wave sleep, producing encephalopathy related to status epilepticus
          during slow-wave sleep (ESES) / developmental epileptic encephalopathy with spike-wave activation
          during sleep (DEE-SWAS). This is a distinct circuit state, not merely more seizures: the abnormality
          is near-continuous sleep-activated spike-wave, and because the driving activity occurs in sleep
          it is invisible to a routine awake EEG. Sleep or 24-hour EEG is therefore the specific investigation
          this node motivates.

          '
        biological_processes:
        - preferred_term: Chemical synaptic transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Occurrence of ESES/DEE-SWAS in DLG4-related synaptopathy requires proper investigation
          with sleep EEG.
        supports: SUPPORT
