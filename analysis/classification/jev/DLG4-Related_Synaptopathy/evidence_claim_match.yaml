        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DLG4 Loss of Function and PSD-95 Haploinsufficiency
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: excitatory_synapse_scaffold_disruption#Postsynaptic Scaffold Disruption
        description: 'A heterozygous protein-truncating variant (nonsense, frameshift, canonical splice-site)
          — or a synonymous, deep-intronic or missense variant that disrupts splicing or protein folding
          — halves the functional dose of PSD-95, the prototypic MAGUK scaffold of the excitatory postsynaptic
          density. The endpoint that is actually measured is reduced PSD-95 protein; the route to it is
          allele-dependent and should not be assumed. Truncating alleles in the body of the transcript
          are conventionally expected to be cleared by nonsense-mediated decay, but the one DLG4 allele
          for which this has been tested directly — the GK-domain frameshift V692Wfs*12 — escapes decay
          and still yields less protein, so degradation of the transcript is not a prerequisite for haploinsufficiency
          here. Any surviving protein product lacks one or more of the PDZ, SH3 and guanylate-kinase domains
          through which PSD-95 organizes the postsynaptic density. Because the paralogous DLG-MAGUKs do
          not compensate, the single remaining wild-type allele is insufficient; DLG4''s position among
          the most loss-of-function-intolerant genes in the genome is the population-genetic footprint
          of that fact, not its cause.

          '
        cell_types:
        - preferred_term: Glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: Synapse assembly
          term:
