  cf399429b5f8a928cb0570b909234272a6685bd640af64c55526abdd75c37b8e:
    claim:
      about:
        disease:
          name: DLG4-Related Synaptopathy
          disease_term:
            preferred_term: DLG4-related synaptopathy
            description: Autosomal dominant synaptopathy caused by heterozygous loss-of-function variants
              in DLG4 (PSD-95); the OMIM/MONDO label is "intellectual developmental disorder 62" (MRD62).
            term:
              id: MONDO:0032919
              label: intellectual developmental disorder 62
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_no_disease_modifying_strategy
        prompt: 'Every clinically advanced PSD-95-directed drug programme is designed to *disrupt* a PSD-95
          interaction — nerinetide (Tat-NR2B9c) and the small-molecule PSD-95/nNOS disruptors developed
          for ischaemic stroke and neuropathic pain. For a haploinsufficiency disorder the required direction
          is the opposite: restore PSD-95 dose or function. Is there any tractable route to that — transcriptional
          upregulation of the remaining allele, targeted augmentation of a paralogous MAGUK, or stabilization
          of the residual protein — and in what developmental window would it have to act?'
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#DLG4 Loss of Function and PSD-95 Haploinsufficiency
        - pathophysiology#Impaired Functional Maturation of Excitatory Synapses
        rationale: 'The existence of a mature PSD-95-directed pharmacology is easy to mistake for a therapeutic
          head start for this disorder, and it is not one: those agents deliberately uncouple PSD-95 from
          nNOS to suppress excitotoxic nitric oxide, which in a PSD-95-deficient brain would push the
          lesion further in the direction it is already broken. The window question is equally unresolved
          — PSD-95 is described as essential during synaptogenesis and neurodevelopment, so a dose-restoring
          therapy started after that window may have nothing left to rescue, and no natural-history data
          yet define when the window closes.'
        proposed_experiments:
        - experiment_id: dlg4_postnatal_restoration_window
          name: Conditional postnatal restoration of PSD-95 dose in a heterozygous model
          description: Restore PSD-95 expression at a series of postnatal ages in Dlg4+/- or Dlg4 V692Wfs*12/+
            mice and test which synaptic, cognitive and sleep phenotypes remain reversible at each age.
          decision_criterion: Reversibility of a phenotype after the close of synaptogenesis would make
            dose-restoring therapy worth pursuing beyond infancy; strict developmental-window dependence
            would restrict it to a prenatal or early-infantile intervention.
      selected_evidence:
        snippet: Collectively, the evidence positions PSD-95/nNOS disruption as a versatile, clinically
          achievable approach for mitigating excitotoxic and nociceptive pathology and sets the stage
          for first-in-class therapies that uncouple toxic NO signaling without silencing healthy synapses.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40712457
      reference_title: 'Uncoupling toxic NO signaling: Progress, challenges, and therapeutic promise of
        disrupting the PSD-95/nNOS protein-protein interaction.'
      evidence_source: OTHER
      explanation: Establishes that the mature PSD-95-directed pharmacology is aimed at disrupting a PSD-95
        interaction for excitotoxicity and pain — the opposite direction from what a PSD-95 haploinsufficiency
        disorder needs.
