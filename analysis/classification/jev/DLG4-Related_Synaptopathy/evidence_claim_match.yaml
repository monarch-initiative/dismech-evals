        biological_scale: MOLECULAR
        role: central_effector
        conforms_to: excitatory_synapse_scaffold_disruption#Excitatory Postsynaptic Structural Deficit
        description: 'PSD-95 clusters in postsynaptic nanodomains where its PDZ1-2 supermodule binds the
          C-terminal PDZ-binding motifs of NMDA-receptor GluN2 subunits and of TARP/stargazin, the auxiliary
          subunit that tethers AMPA receptors, while PDZ3 binds neuroligin-1 and the LGI1-ADAM22 complex.
          Losing PSD-95 dose fragments the postsynaptic density, reduces its size, and destabilizes AMPA
          receptors at the synaptic membrane, increasing the proportion of "silent" synapses that carry
          NMDA receptors but no functional AMPA receptors. The NMDA-receptor current is not simply lost
          but qualitatively altered, decaying more slowly with a greater GluN2B contribution — a shift
          toward an immature receptor complement.

          '
        cell_types:
        - preferred_term: Cortical and hippocampal pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
