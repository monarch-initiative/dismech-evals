            publication: PMID:23268962
            description: A domain-specific model that leaves PSD-95 present but unable to bind ligands
              through PDZ1/PDZ2 — the supermodule that docks NMDA-receptor GluN2 subunits and TARP-coupled
              AMPA receptors. It therefore isolates the receptor-anchoring function from PSD-95 abundance,
              and is the closest available model for the minority of human missense alleles that fall
              in the PDZ domains.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Disabling PDZ1/2 ligand binding alone depletes PSD-95, PSD-93 and AMPA receptor subunits
          from the hippocampal postsynaptic density fraction.
        limitations: Homozygous, and models a ligand-binding defect rather than the reduced protein dose
          that most human alleles produce; the effect was also age- and subregion-dependent, so a single
          developmental snapshot can mislead.
        readouts:
        - name: PSD-fraction accumulation of PSD-95, PSD-93 and AMPA receptor subunits
          target: Impaired Glutamate Receptor Anchoring at the Postsynaptic Density
          direction: DECREASED
          interpretation: Biochemical measure of failed scaffold-dependent receptor anchoring.
      selected_evidence:
        snippet: These findings reveal that PSD-95 including its ligand binding of the PDZ1/2 domains
          controls the synaptic clustering of PSD-MAGUKs and AMPA receptors, which may have an essential
          role in regulating hippocampal synaptic transmission, plasticity, and hippocampus-dependent
          behavior.
        supports: SUPPORT
