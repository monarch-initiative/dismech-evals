            term:
              id: MONDO:0032919
              label: intellectual developmental disorder 62
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Adulthood
        age_range: Adulthood
        notes: Survival into adulthood is documented and the disorder is not known to shorten life expectancy,
          but the adult phenotype is poorly characterized because genetic testing was historically not
          offered to adults — diagnoses made fourteen years after presentation are on record. Late cognitive
          regression and progressive generalised dystonia have both been reported in adults, so the course
          is not reliably static after childhood.
      selected_evidence:
        snippet: We report a 34-year-old male with childhood developmental delay, severe intellectual
          disability in adulthood, episodes of agitation with a previous diagnosis of schizoaffective
          disorder and adult-onset cognitive regression who developed progressive generalised dystonia
          due to a de novo DLG4 pathogenic loss-of-function variant.
        supports: SUPPORT
    origin:
