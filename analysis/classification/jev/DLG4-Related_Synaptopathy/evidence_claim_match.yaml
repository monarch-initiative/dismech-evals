  1b236f5f7f0fa9a8d457c919e4ecc1d3ca1c7e20d7f854466b2cb6324e41de43:
    claim:
      about:
        disease:
          name: DLG4-Related Synaptopathy
          disease_term:
            preferred_term: DLG4-related synaptopathy
            description: Autosomal dominant synaptopathy caused by heterozygous loss-of-function variants
              in DLG4 (PSD-95); the OMIM/MONDO label is "intellectual developmental disorder 62" (MRD62).
            term:
              id: MONDO:0032919
              label: intellectual developmental disorder 62
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Developmental Regression
        biological_scale: ORGANISM
        role: consequence
        description: 'Loss of previously acquired verbal and/or motor skills, which converts an otherwise
          largely static developmental disorder into an actively regressive one and is the strongest determinant
          of cognitive outcome.

          This node is deliberately separate from the sleep-activated encephalopathy that most often drives
          it, because the evidence decouples them in both directions: regression occurred in every individual
          with ESES/DEE-SWAS but also in some who never developed it, so it has a second route from cortical
          circuit dysfunction that does not pass through the sleep-activated state. Regression is also
          not confined to childhood — intellectual regression without motor delay has been reported at
          age two, and cognitive regression with progressive dystonia in adulthood.

          '
      selected_evidence:
        snippet: Regression in motor development and/or language has been reported in about 40% of affected
          individuals.
        supports: SUPPORT
