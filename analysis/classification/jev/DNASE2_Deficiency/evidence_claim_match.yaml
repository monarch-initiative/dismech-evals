        description: Macrophages at sites of definitive erythropoiesis (fetal liver Kupffer cells, bone
          marrow macrophages) and at sites of developmental apoptosis engulf expelled erythroid nuclei
          and apoptotic cells but cannot digest their chromatin, which accumulates as undigested DNA in
          their lysosomes. Unlike the classical lysosomal storage diseases, the damage that follows is
          driven by innate immune sensing of the stored DNA rather than by storage cytotoxicity, so this
          entry conforms only to the first two nodes of the lysosomal module.
        role: central_effector
        biological_scale: CELLULAR
