            description: Biallelic DNASE2 variants abolish or sharply reduce the activity of DNase II,
              a lysosomal acid endonuclease. In the index families the missense and exon 4-skipping alleles
              left little or no measurable activity against plasmid DNA when expressed in HEK293T cells,
              and patient fibroblast lysates had markedly reduced activity that wild-type DNASE2 restored.
              This is the lysosomal-hydrolase substitution at the trigger node of the lysosomal substrate
              accumulation module; the stored substrate is DNA.
