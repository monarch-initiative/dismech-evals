              id: MONDO:0800132
              label: autoinflammatory-pancytopenia syndrome due to DNASE2 deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: DNASE2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: DNASE2
          term:
            id: hgnc:2960
            label: DNASE2
        notes: Reported pathogenic alleles include the homozygous missense variants c.347G>C (p.Gly116Ala,
          which also causes exon 4 skipping) and c.362A>T (p.Asp121Val) in the index families, the homozygous
          proximal intronic splice variant c.511+5G>A (exon 4 skipping) in two unrelated Tatar and Bashkir
          patients, and a compound heterozygous frameshift (p.Gly48AlafsTer49) plus start-loss (p.Met1?)
          genotype in an antenatal-onset case. The authors of that case suggest that null alleles on both
          sides explain its severity, whereas the earlier alleles are hypomorphic with leaky splicing
          or residual activity. A single heterozygous DNASE2 p.Gly322Asp variant was reported in a Spanish
          patient with a suspected lupus-like disorder (PMID:32222431); one heterozygous allele does not
          fit the recessive model, so that case is not counted here. No ClinGen gene-disease validity
          classification was found for DNASE2, so gene_disease_validity is left unset.
      selected_evidence:
        snippet: In both families we identify biallelic mutations in DNASE2, associated with a loss of
          DNase II endonuclease activity.
        supports: SUPPORT
        directness: DIRECT
    origin:
