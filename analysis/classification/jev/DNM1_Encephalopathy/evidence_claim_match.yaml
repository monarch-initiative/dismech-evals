        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Synaptic Vesicle Endocytosis and Recycling
        conforms_to: synaptic_vesicle_cycle#Impaired Synaptic Vesicle Endocytosis and Recycling
        description: Dynamin-1 is the fission GTPase that pinches off endocytosing synaptic vesicles from
          the presynaptic plasma membrane to regenerate the recycling vesicle pool. Dominant-negative
          impairment of dynamin-1 slows vesicle fission and retrieval, depleting release-ready vesicles
          during sustained neuronal firing and causing activity-dependent synaptic transmission failure
          — the "vesicle fission" disease.
        role: central_effector
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: synaptic vesicle endocytosis
          term:
            id: GO:0048488
            label: synaptic vesicle endocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: The focal point of the vesicle cycle is Ca2+-triggered exocytosis that is followed by
          different routes of endocytosis and recycling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15217342
      reference_title: The synaptic vesicle cycle.
      evidence_source: OTHER
      explanation: Establishes endocytosis/recycling as the vesicle-cycle arm mediated by dynamin-1 and
        disrupted in this disorder.
