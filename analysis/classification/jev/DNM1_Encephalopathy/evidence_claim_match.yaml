            term:
              id: MONDO:0014598
              label: developmental and epileptic encephalopathy, 31A
        context: []
      assertion_type: Treatment
      assertion:
        name: Antiseizure Medication
        description: Seizures, including infantile spasms and Lennox-Gastaut syndrome, are managed with
          antiseizure medications and spasm-directed therapies; response is often incomplete. About 83%
          of patients remain refractory. Benzodiazepines (clobazam, clonazepam) are the agents most often
          reported to improve seizure control without producing seizure freedom, followed by steroids
          or ACTH and by topiramate or zonisamide. Levetiracetam and cannabidiol have each been reported
          to worsen seizures in individual patients, though levetiracetam combined with lamotrigine also
          produced sustained seizure freedom in another, so the effect is patient-specific rather than
          a property of the drug. No agent corrects the underlying dynamin-1 fission defect.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: clobazam
            term:
              id: CHEBI:31413
              label: clobazam
          - preferred_term: clonazepam
            term:
              id: CHEBI:3756
              label: clonazepam
      selected_evidence:
        snippet: 'Seizure outcome was assessed in 18 patients: 15 of 18 patients (83%) had refractory
          seizures. Three patients (17%) became seizure-free on treatment.'
        supports: SUPPORT
