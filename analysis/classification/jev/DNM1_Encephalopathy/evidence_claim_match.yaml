  9719226eb7caa53338428e003173243c189e777386f79ec985ca838da6b59081:
    claim:
      about:
        disease:
          name: DNM1 Encephalopathy
          disease_term:
            preferred_term: DNM1 developmental and epileptic encephalopathy
            term:
              id: MONDO:0014598
              label: developmental and epileptic encephalopathy, 31A
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dnm1_fitful_mouse_human_fidelity_isoform_switch
        prompt: Does the Dnm1 fitful mouse faithfully model the human DNM1-DEE trajectory (infantile spasms
          evolving to Lennox-Gastaut syndrome with profound intellectual disability), given that fitful
          is a DNM1a-isoform-specific missense allele and the DNM1a/DNM1b isoform pair follows a developmental
          expression switch that may itself shape the human phenotypic window?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Neurotransmission and Cortical Hyperexcitability
        rationale: 'The fitful mouse reproduces recurrent seizures and an activity-dependent synaptic
          defect, making it the primary in vivo DNM1 epilepsy model. But its fidelity to human DNM1-DEE
          is uncertain on two counts: fitful mutates only the DNM1a-defining exon while sparing DNM1b,
          whereas most human DEE variants sit in shared GTPase/middle domains affecting both isoforms;
          and DNM1b is highest in early development with DNM1a rising postnatally, so an isoform-restricted
          allele may engage a different developmental window than the human disease. Whether the mouse
          recapitulates the specific human trajectory (infantile spasms to Lennox-Gastaut, profound intellectual
          disability) rather than seizures in general is the open translational question.'
        proposed_experiments:
        - experiment_id: exp_dnm1_shared_domain_knockin_trajectory_benchmark
          name: Shared-domain DNM1 knock-in developmental-trajectory benchmark
          description: Generate a mouse carrying a recurrent human shared-domain DEE variant (e.g., p.Arg237Trp)
            that affects both DNM1a and DNM1b, and benchmark its seizure semiology, EEG evolution, and
            cognitive/developmental trajectory against the DNM1a-restricted fitful allele and against
            the human disease course.
          experiment_type:
            preferred_term: knock-in model developmental phenotyping experiment
          perturbations:
          - name: Shared-domain DNM1 knock-in allele
            target: pathophysiology#Dominant-Negative Dynamin-1 Dysfunction
            genes:
            - preferred_term: DNM1
              term:
                id: hgnc:2972
                label: DNM1
            description: Knock-in of a recurrent human GTPase/middle-domain DEE variant affecting both
              DNM1a and DNM1b, compared with the DNM1a-restricted fitful allele.
          readouts:
          - name: Seizure and developmental trajectory concordance
            target: pathophysiology#Reduced Neurotransmission and Cortical Hyperexcitability
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: ABNORMAL
            assays:
            - preferred_term: video-EEG monitoring
            - preferred_term: behavioral neurodevelopmental battery
            direction: POSITIVE
          controls:
          - name: Fitful allele mice
            description: DNM1a-restricted fitful mice as the isoform-specific comparator.
          - name: Wild-type littermates
            description: Wild-type littermate controls.
          decision_criterion: Model-to-human fidelity is supported if a shared-domain knock-in reproduces
            the human trajectory (early spasms evolving to Lennox-Gastaut-like EEG with profound developmental
            impairment) more closely than the isoform-restricted fitful allele.
          would_support:
          - pathophysiology#Reduced Neurotransmission and Cortical Hyperexcitability
      selected_evidence:
        snippet: Fitful is a missense mutation in an exon that defines the DNM1a isoform, leaving intact
          the alternatively spliced exon that encodes DNM1b.
        supports: SUPPORT
