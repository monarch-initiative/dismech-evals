      assertion_type: Discussion
      assertion:
        discussion_id: gap_dnm1_dominant_negative_vs_haploinsufficiency
        prompt: How firmly established is the dominant-negative "oligomer-poisoning" mechanism relative
          to simple haploinsufficiency for DNM1-DEE variants, and if it is dominant-negative, would allele-selective
          knockdown of the mutant transcript (e.g., an antisense oligonucleotide) rescue endocytic function
          better than gene supplementation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dominant-Negative Dynamin-1 Dysfunction
        rationale: 'Most DNM1-DEE variants cluster in the GTPase and middle/stalk domains and are inferred
          to poison the wild-type dynamin oligomer rather than merely halve dosage, and mutant DNM1a fails
          to self-assemble and interferes with endocytic recycling in cell culture. The mechanistic distinction
          is therapeutically decisive: a true dominant-negative allele predicts benefit from allele-selective
          mutant knockdown (leaving the wild-type allele intact), whereas haploinsufficiency would call
          for gene supplementation. The strength of the dominant-negative inference — currently structural
          modeling plus limited functional data — and its variant-by-variant generality remain open.'
        proposed_experiments:
        - experiment_id: exp_dnm1_allele_selective_knockdown_rescue
          name: Allele-selective mutant DNM1 knockdown rescue in patient-derived neurons
          description: In patient-derived (or isogenic knock-in, e.g. p.Arg237Trp) human neurons, selectively
            knock down the mutant DNM1 transcript with an allele-selective antisense oligonucleotide and
            test whether activity-dependent synaptic vesicle endocytosis is restored, versus wild-type
            DNM1 supplementation.
          experiment_type:
            preferred_term: allele-selective knockdown and rescue experiment
          perturbations:
          - name: Allele-selective mutant DNM1 knockdown
            target: pathophysiology#Dominant-Negative Dynamin-1 Dysfunction
            genes:
            - preferred_term: DNM1
              term:
                id: hgnc:2972
                label: DNM1
            description: Allele-selective antisense-oligonucleotide knockdown of the mutant DNM1 allele,
              compared in parallel with wild-type DNM1 supplementation.
          readouts:
          - name: Restoration of synaptic vesicle endocytosis
            target: pathophysiology#Impaired Synaptic Vesicle Endocytosis and Recycling
            biological_processes:
            - preferred_term: synaptic vesicle endocytosis
              term:
                id: GO:0048488
                label: synaptic vesicle endocytosis
              modifier: INCREASED
            assays:
            - preferred_term: synaptic vesicle recycling assay
            direction: POSITIVE
          controls:
          - name: Non-targeting oligonucleotide
            description: Scrambled/non-targeting antisense oligonucleotide control.
          - name: Wild-type neurons
            description: Isogenic wild-type (variant-corrected) neurons as baseline.
          decision_criterion: A dominant-negative mechanism is supported if allele-selective mutant knockdown
            restores endocytosis toward wild-type levels more effectively than wild-type supplementation.
          would_support:
          - pathophysiology#Dominant-Negative Dynamin-1 Dysfunction
      selected_evidence:
        snippet: All mutations cluster within the GTPase or middle domains, and structural modeling and
          existing functional data suggest a dominant-negative effect on DMN1 function.
        supports: SUPPORT
