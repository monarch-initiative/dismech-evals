  fe783377b70247e213b4f446930dddc383f63ee979c6a43b4b579fe03d08144e:
    claim:
      about:
        disease:
          name: DNM1 Encephalopathy
          disease_term:
            preferred_term: DNM1 developmental and epileptic encephalopathy
            term:
              id: MONDO:0014598
              label: developmental and epileptic encephalopathy, 31A
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dnm1_endocytosis_release_causality_selective_vulnerability
        prompt: Is the epileptic, excitability phenotype of DNM1-DEE driven by activity-dependent vesicle-recycling
          failure that preferentially depletes fast-spiking inhibitory interneurons during high-frequency
          firing, and does that selective vulnerability explain how a vesicle-recycling (endocytosis)
          defect produces cortical hyperexcitability rather than global synaptic silencing?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Synaptic Vesicle Endocytosis and Recycling
        - pathophysiology#Reduced Neurotransmission and Cortical Hyperexcitability
        rationale: Dynamin-1 acts in the recycling (endocytic) arm of the synaptic vesicle cycle, yet
          the disease manifests as a release/excitability disorder. A parsimonious reconciliation is that
          impaired fission slows vesicle retrieval only under sustained high-frequency activity, so neurons
          that fire fastest — parvalbumin-positive inhibitory interneurons — deplete their release-ready
          pool first, disinhibiting cortex and generating seizures. The fitful mouse shows exactly this
          activity-dependent signature (slower recovery from depression after stimulus trains), but whether
          interneuron-selective vulnerability is the causal driver of human hyperexcitability is unresolved.
        proposed_experiments:
        - experiment_id: exp_dnm1_interneuron_activity_dependent_depletion
          name: Cell-type-resolved activity-dependent vesicle-depletion assay
          description: Compare fast-spiking (parvalbumin-positive) interneurons and pyramidal neurons
            carrying a DNM1-DEE variant during high-frequency stimulation, measuring vesicle-pool depletion
            and transmission failure to test whether interneurons are preferentially affected.
          experiment_type:
            preferred_term: cell-type-resolved electrophysiology and imaging experiment
          perturbations:
          - name: High-frequency stimulation of DNM1-variant neurons
            target: pathophysiology#Impaired Synaptic Vesicle Endocytosis and Recycling
            genes:
            - preferred_term: DNM1
              term:
                id: hgnc:2972
                label: DNM1
            description: Sustained high-frequency stimulus trains applied separately to fast-spiking interneurons
              and pyramidal neurons expressing a DNM1-DEE variant.
          readouts:
          - name: Activity-dependent synaptic transmission failure
            target: pathophysiology#Reduced Neurotransmission and Cortical Hyperexcitability
            biological_processes:
            - preferred_term: synaptic vesicle endocytosis
              term:
                id: GO:0048488
                label: synaptic vesicle endocytosis
              modifier: DECREASED
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology
            - preferred_term: synaptic vesicle recycling assay
            direction: NEGATIVE
          controls:
          - name: Wild-type neurons
            description: Isogenic wild-type neurons of each cell type under identical stimulation.
          - name: Low-frequency stimulation
            description: Same neurons stimulated at low frequency, where recycling demand is minimal.
          decision_criterion: Selective interneuron vulnerability is supported if fast-spiking interneurons
            show greater activity-dependent depletion and transmission failure than pyramidal neurons
            at high, but not low, stimulation frequency.
          would_support:
          - pathophysiology#Reduced Neurotransmission and Cortical Hyperexcitability
      selected_evidence:
        snippet: In mice, the mutation results in defective synaptic transmission characterized by a slower
          recovery from depression after trains of stimulation.
        supports: SUPPORT
