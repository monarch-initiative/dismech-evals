      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Dynamin-1 Dysfunction
        conforms_to: synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency
        description: 'De novo missense variants in DNM1 cluster in the GTPase and middle domains of dynamin-1
          and act by a dominant-negative mechanism: mutant subunits incorporate into the dynamin oligomer
          that assembles around the neck of an endocytosing vesicle and poison its GTP-dependent fission
          activity. The recurrent p.Arg237Trp variant accounts for about one-third of cases.'
        role: trigger
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
