  3a5b7b7cbfede97265302eca61a7afaa51ac33440adadbdf978a295739cba566:
    claim:
      about:
        disease:
          name: DOCK2 Deficiency
          disease_term:
            preferred_term: DOCK2 deficiency
            term:
              id: MONDO:0014637
              label: DOCK2 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Receptor-Driven RAC1 Activation
        biological_scale: MOLECULAR
        description: DOCK2 is the exchange factor that loads GTP onto RAC1 downstream of the T-cell receptor
          and of chemokine receptors. In patient T cells, engaging CD3 fails to produce GTP-bound RAC1
          at all, while control cells and a heterozygous carrier parent's cells do. This is the single
          molecular switch from which every downstream defect in this entry follows.
        biological_processes:
        - preferred_term: RAC1 signalling downstream of antigen and chemokine receptors
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0016601
            label: Rac protein signal transduction
      selected_evidence:
        snippet: Upon activation of polyclonal human T-cell lines with anti-CD3 mAb, GTP-bound RAC1 was
          clearly detected in T cells from the healthy control and from P2's mother, but not from P1 and
          P2
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26083206
      reference_title: Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections.
      evidence_source: HUMAN_CLINICAL
      explanation: Direct measurement of the failed RAC1 activation step in patient T cells, with a carrier
        control that shows heterozygosity is sufficient.
