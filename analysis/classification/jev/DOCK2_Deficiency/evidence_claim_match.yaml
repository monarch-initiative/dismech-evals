      assertion:
        name: Defective Actin Polymerization and Leukocyte Chemotaxis
        biological_scale: CELLULAR
        description: 'Without RAC1 activation, chemokine receptors cannot drive actin polymerization,
          so lymphocytes fail to migrate. Both the stimulated and the resting cytoskeleton are affected:
          CXCL12-induced actin polymerization is impaired and delayed, and baseline F-actin is reduced
          even before stimulation. Neutrophils are affected too, which is why DOCK2 deficiency is classified
          as a combined immunodeficiency with neutrophil abnormalities rather than a purely lymphoid defect.'
        cell_types:
        - preferred_term: T cell
