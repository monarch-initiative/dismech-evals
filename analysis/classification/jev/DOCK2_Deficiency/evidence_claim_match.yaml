          value:
            name: Heterozygous DOCK2-ELMO1 hypomorph
            display_name: Heterozygous DOCK2 ELMO1-binding-domain variants (viral susceptibility)
            description: Single heterozygous variants in the ELMO1-binding region. Reduced DOCK2 protein
              stability with preserved T-cell function, presenting across a wide age range as selective
              severe viral illness (HPV, RSV, SARS-CoV-2) rather than as combined immunodeficiency.
          role: subtype
      assertion_type: Genetic
      assertion:
        name: DOCK2 (heterozygous ELMO1-binding-domain variants)
        subtype: Heterozygous DOCK2-ELMO1 hypomorph
        gene_term:
          preferred_term: DOCK2
          term:
            id: hgnc:2988
            label: DOCK2
        presence: Positive
        association: Heterozygous ELMO1-Binding-Domain Hypomorphic Variants
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: Three distinct heterozygous variants, all inside the DOCK2 region that binds and stabilizes
          ELMO1, carried by six individuals from three unrelated families. Each reduces DOCK2 protein
          level, ELMO1 binding and RAC1 activation, so the mechanism is hypomorphic destabilization rather
          than the null or truncating alleles of the recessive form, and it converges on the same RAC1
          step. relationship_type is SUSCEPTIBILITY because the phenotype is severe illness on encountering
          particular viruses rather than a constitutive immunodeficiency. Note that the enum's own description
          for that value is written for polygenic GWAS loci; this is a monogenic susceptibility trait,
          and the value is used for its plain meaning. CAUSATIVE would assert a constitutive disease these
          carriers do not have.
      selected_evidence:
        snippet: All variants reside within the DOCK2 domain that binds and stabilizes ELMO1. Each variant
          reduced DOCK2 protein expression, ELMO1 binding, and DOCK2 function, as shown by diminished
          Rac1 activation and selective defects in Toll-like receptor signaling.
        supports: SUPPORT
