    claim:
      about:
        disease:
          name: DOCK2 Deficiency
          disease_term:
            preferred_term: DOCK2 deficiency
            term:
              id: MONDO:0014637
              label: DOCK2 deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular and Functional Diagnosis of DOCK2 Deficiency
        description: 'The diagnosis is genetic: biallelic DOCK2 variants on a primary-immunodeficiency
          panel or exome sequencing in a child with early-onset invasive infection and lymphopenia. Supporting
          functional assays, where available, are RAC1 activation after CD3 stimulation, chemokine-induced
          actin polymerization and chemotaxis, and NK-cell degranulation. Low TRECs on newborn screening
          can be the first signal.'
        notes: The diagnosis is easy to miss. In one reported case it was made 18 years after the patient
          had already been transplanted for a presumed combined immunodeficiency of unknown cause, and
          in another the transplant was performed before the genetic diagnosis was available. Anyone transplanted
          for undefined CID is a candidate for retrospective genetic diagnosis, which matters because
          the non-haematopoietic arm of the disease is not corrected by the transplant.
      selected_evidence:
        snippet: Very low to zero amounts of TREC and/or KREC were detected in 14 out of 23 cases of common
          variable immunodeficiency (CVID), 14 out of 17 cases of AT, 8 out of 20 cases of WAS, 6 out
          of 7 cases of DOCK8-deficiency patients, 4 out of 8 cases of HIES with unknown genetic defects
          and all patients with defects in DOCK2, PNP, and RAG1.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34418894
      reference_title: Investigating the Variation of TREC/KREC in Combined Immunodeficiencies.
      evidence_source: HUMAN_CLINICAL
      explanation: The measured basis for the TREC claim in the description. Note the DOCK2 arm of this
        series is a single patient, so it establishes that the assay is abnormal in DOCK2 deficiency rather
        than how sensitive it is.
