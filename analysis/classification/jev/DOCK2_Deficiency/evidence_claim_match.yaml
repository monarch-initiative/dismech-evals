            description: A mouse model developed specifically to separate DOCK2's own contribution to
              antiviral immunity from the treatments and comorbid infections that confound interpretation
              in patients.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired T Cell Activation and Antibody Response
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: Identifies a cell-intrinsic DOCK2 requirement for the initial expansion of antiviral
          CD8+ T cells, a step that is not visible in the human data because early activation markers
          look normal.
        limitations: The human node covers failed proliferation to mitogen and defective T-dependent antibody
          responses; the mouse result speaks only to antigen-specific CD8+ expansion after priming. The
          mouse also shows that DOCK2-deficient CD8+ cells are protective once primed in vitro, a rescue
          with no human counterpart, so the model bears on the mechanism of the T-cell defect rather than
          on its clinical severity.
        readouts:
        - name: Antiviral CD8+ T-cell expansion after HSV-1 priming
          target: Impaired T Cell Activation and Antibody Response
          direction: DECREASED
          interpretation: The expansion deficit is the functional correlate of the human T-cell activation
            defect.
      selected_evidence:
        snippet: These results shed light on a cellular deficiency that is likely to impact antiviral
          immunity in DOCK2-deficient patients.
        supports: SUPPORT
