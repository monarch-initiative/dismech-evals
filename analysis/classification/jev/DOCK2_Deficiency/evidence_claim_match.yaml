              label: DOCK2 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DOCK2 Loss of Function
        biological_scale: MOLECULAR
        description: DOCK2 is an atypical guanine nucleotide exchange factor expressed almost exclusively
          in haematopoietic and lymphoid tissue. Its DHR2 domain is what catalyses nucleotide exchange
          on RAC. Disease alleles either abolish the protein - frameshift and nonsense variants leave
          absent or trace amounts on immunoblot - or truncate it short of DHR2, which removes the catalytic
          function while leaving a protein product. Missense alleles hit evolutionarily conserved residues.
        genetic_context:
          gene:
            preferred_term: DOCK2
            term:
              id: hgnc:2988
              label: DOCK2
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: RAC guanine nucleotide exchange factor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005085
            label: guanyl-nucleotide exchange factor activity
      selected_evidence:
        snippet: Immunoblot analysis revealed absent or trace amounts of DOCK2 protein expression in T
          cell lines from P1 and P2, respectively, and markedly reduced levels of protein were detected
          in P3 EBV-B cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
