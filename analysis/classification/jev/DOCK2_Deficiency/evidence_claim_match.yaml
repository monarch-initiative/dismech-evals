            id: GO:0030041
            label: actin filament polymerization
        - preferred_term: leukocyte chemotaxis
          modifier: DECREASED
          term:
            id: GO:0030595
            label: leukocyte chemotaxis
      selected_evidence:
        snippet: Furthermore, CXCL12-induced actin polymerization in T and B lymphocytes from P1 and P2
          was impaired and delayed
        supports: SUPPORT
