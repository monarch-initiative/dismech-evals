      assertion:
        name: MGS-like
        display_name: DONSON-related Meier-Gorlin syndrome
        description: Neither an OMIM entry nor an ISDS row - a presentation, not a separate entity. Two
          apparently unrelated families homozygous for c.631C>T p.(Arg211Cys) had clinically typical Meier-Gorlin
          syndrome, and DONSON's later-established role in CMG helicase assembly explains why. No MONDO
          leaf exists for the DONSON-specific form, so this subtype carries no subtype_term; dismech also
          lists DONSON as a Meier-Gorlin gene in kb/disorders/Meier-Gorlin_Syndrome.yaml.
        genes:
        - preferred_term: DONSON
          term:
            id: hgnc:2993
            label: DONSON
      selected_evidence:
        snippet: Two apparently unrelated families with identical homozygous c.631C > T p.(Arg211Cys)
          variant had clinical features typical of Meier-Gorlin syndrome (MGS), while two siblings with
          compound heterozygous c.346delG p.(Asp116Ile*62) and c.1349A > G p.(Lys450Arg) variants presented
          with Seckel-like phenotype.
        supports: SUPPORT
