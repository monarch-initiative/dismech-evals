        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired CMG Helicase Assembly
        biological_scale: MOLECULAR
        description: DONSON binds directly but transiently to CDC45-MCM-GINS during S phase and is essential
          for assembling the helicase. It is dispensable for loading the MCM2-7 core onto chromatin in
          G1 - so the defect is specifically at the conversion of loaded MCM2-7 double hexamers into active
          CMG, not at licensing. This is the step that places DONSON alongside the twelve other Meier-Gorlin
          genes.
        cellular_components:
        - preferred_term: CMG complex
          term:
            id: GO:0071162
            label: CMG complex
        biological_processes:
        - preferred_term: DNA replication initiation
          term:
            id: GO:0006270
            label: DNA replication initiation
          modifier: DECREASED
      selected_evidence:
        snippet: we show that DONSON binds directly but transiently to CDC45-MCM-GINS during S-phase and
          is essential for chromosome duplication
        supports: SUPPORT
