        name: Molecular genetic testing of DONSON
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        presence: Biallelic hypomorphic DONSON variants
        description: 'There is no clinical criterion set, and there could not usefully be one: the same
          gene presents as microcephaly-micromelia syndrome, MISSLA, Meier-Gorlin syndrome, a Seckel-like
          phenotype, and in one instance Femoral-Facial syndrome, so the clinical label a patient arrives
          with does not predict the gene and the gene does not predict the label. Sequencing reached the
          diagnosis in every reported case. Two practical points: the variants are hypomorphic rather
          than null, so a result should not be dismissed for retaining residual protein; and while biallelic
          inheritance is the rule, a de novo heterozygous variant has been reported.'
      selected_evidence:
        snippet: We identified four unrelated families with five affected individuals having biallelic
          or de novo variants in DONSON presenting with a core phenotype of severe short stature (z score
          < -3 SD), additional skeletal abnormalities, and microcephaly.
        supports: SUPPORT
