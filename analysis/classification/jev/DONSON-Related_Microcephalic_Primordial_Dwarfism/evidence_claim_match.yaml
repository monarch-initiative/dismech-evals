      assertion:
        name: Replication Fork Instability and Nucleolytic Collapse
        biological_scale: CELLULAR
        description: 'The mechanism identified first, and distinct from the assembly defect: DONSON stabilizes
          forks during replication, and its loss causes severe replication-associated DNA damage arising
          from nucleolytic cleavage of stalled forks. ATR-dependent replication-stress signalling is also
          impaired, so checkpoint activity falls and chromosomal instability is potentiated - the cell
          both accumulates damage and fails to respond to it.'
        biological_processes:
        - preferred_term: DNA damage checkpoint signaling
          term:
            id: GO:0000077
            label: DNA damage checkpoint signaling
          modifier: DECREASED
        - preferred_term: DNA replication
          term:
            id: GO:0006260
            label: DNA replication
          modifier: ABNORMAL
      selected_evidence:
        snippet: ATR-dependent signaling in response to replication stress is impaired in DONSON-deficient
          cells, resulting in decreased checkpoint activity and the potentiation of chromosomal instability
        supports: SUPPORT
