  cc411b1f6357c44d16e986a2eedac767c7f34bc46cb976026ac40aaddfe8690c:
    claim:
      about:
        disease:
          name: DOORS Syndrome
          disease_term:
            preferred_term: DOORS syndrome
            term:
              id: MONDO:0009079
              label: DOORS syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired v-ATPase activity and endolysosomal acidification
        description: 'TBC1D24 interacts with the vacuolar ATPase (v-ATPase) in the brain and acts as a
          positive regulator of v-ATPase activity. Loss of TBC1D24 causes mislocalization of the V1 sector,
          increased pH in endo-lysosomal compartments, impaired autophagy, accumulation of lysosomes and
          non-degraded lipid material, and defective synaptic vesicle endocytosis and reacidification.
          The recurrent ATP6V1B2 p.Arg506* variant likewise impairs lysosomal acidification, defining
          a shared endolysosomal disease axis for DOORS syndrome.

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: DECREASED
        - preferred_term: Lysosome organization
          term:
            id: GO:0007040
            label: lysosome organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Lysosome
          term:
            id: GO:0005764
            label: lysosome
      selected_evidence:
        snippet: "In Tbc1d24 knockout neurons, we detected V1 mis-localization with increased pH \nat\
          \ endo-lysosomal compartments and autophagy impairment. Furthermore, synaptic \nvesicles endocytosis\
          \ and reacidification were impaired."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
