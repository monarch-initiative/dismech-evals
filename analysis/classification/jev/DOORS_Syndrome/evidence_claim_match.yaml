  2dbbf887cecad915c207fcf610ae012a62e07e2fc9af9a64e64f72ea24859fa4:
    claim:
      about:
        disease:
          name: DOORS Syndrome
          disease_term:
            preferred_term: DOORS syndrome
            term:
              id: MONDO:0009079
              label: DOORS syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cochlear glia-like supporting cell vesicle trafficking dysfunction
        description: 'Beyond auditory neurons, TBC1D24 is expressed in glia-like non-sensory (supporting)
          epithelial cells of the developing cochlear sensory epithelium and is virtually absent from
          adjacent sensory hair cells, with the distinguishing expression disappearing around the onset
          of hearing. This suggests that disturbed vesicle trafficking in cochlear supporting cells, rather
          than a hair-cell-intrinsic defect alone, may contribute to the sensorineural deafness of DOORS
          syndrome.

          '
        cell_types:
        - preferred_term: Organ of Corti supporting cell
          term:
            id: CL:0002490
            label: organ of Corti supporting cell
        - preferred_term: Sensory hair cell
          term:
            id: CL:0000855
            label: sensory hair cell
        locations:
        - preferred_term: Cochlea
          term:
            id: UBERON:0001844
            label: cochlea
      selected_evidence:
        snippet: "TBC1D24 was detected in glia-like \nnon-sensory epithelial cells during early developmental\
