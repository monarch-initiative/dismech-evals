            term:
              id: MONDO:0009079
              label: DOORS syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: Recurrent truncating ATP6V1B2 variant (p.Arg506*)
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: ATP6V1B2
          term:
            id: hgnc:854
            label: ATP6V1B2
        notes: 'ATP6V1B2 encodes the B2 subunit of the vacuolar (V1) ATPase. A recurrent truncating variant
          NM_001693.4:c.1516C>T (p.Arg506*) was identified in DOORS-syndrome individuals without TBC1D24
          variants; the same variant was previously reported in dominant deafness-onychodystrophy (DDOD)
          syndrome, suggesting DDOD and DOORS lie on a clinically and molecularly related spectrum. Both
          TBC1D24 and ATP6V1B2 converge on endolysosomal function. In contrast to the biallelic TBC1D24
          mechanism, the recurrent ATP6V1B2 p.Arg506* allele acts in an autosomal dominant / de novo manner.

          '
        inheritance:
        - name: Autosomal dominant inheritance
        variants:
        - name: ATP6V1B2 p.Arg506*
          description: NM_001693.4:c.1516C>T; p.Arg506* recurrent truncating variant.
      selected_evidence:
        snippet: "We identified the same truncating variant in ATP6V1B2 \n(NM_001693.4:c.1516C>T; p.Arg506*)\
          \ in nine individuals from eight unrelated \nfamilies with DOORS syndrome."
        supports: SUPPORT
    origin:
