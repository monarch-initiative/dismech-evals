            id: GO:0007040
            label: lysosome organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Lysosome
          term:
            id: GO:0005764
            label: lysosome
      selected_evidence:
        snippet: "DOORS [deafness, onychodystrophy, osteodystrophy, intellectual disability \n(mental\
