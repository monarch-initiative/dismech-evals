      assertion:
        name: Autosomal recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Disease requires biallelic DPAGT1 variants, homozygous or compound heterozygous,
          with unaffected heterozygous carrier parents. In the index family the paternal allele carried
          a missense change and the maternal allele a splicing defect; homozygous missense genotypes have
          since been reported in consanguineous families. No complete biallelic null has been described,
          consistent with the enzyme's essential role.
      selected_evidence:
        snippet: In vitro enzymatic analysis of microsomal fractions from the cultured cells indicated
          that oligosaccharyltransferase activity is normal, but the GPT activity is reduced to approximately
          10% of normal levels while parents have heterozygous levels.
        supports: SUPPORT
