        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dpagt1_er_stress_not_the_mechanism
        kind: OPEN_QUESTION
        status: OPEN
        prompt: If the unfolded protein response is not activated in DPAGT1-CDG fibroblasts, what does
          the increased sensitivity to tunicamycin in those cells represent?
        attaches_to:
        - pathophysiology#Global Protein N-Hypoglycosylation
        rationale: 'ER stress is an attractive candidate mediator for a disease of ER-resident glycan
          assembly, and it is active in other CDG subtypes. It was tested directly in DPAGT1-CDG patient
          fibroblasts and was not found: the unfolded protein response was inactive, unlike in PMM2-CDG
          or DPM1-CDG cells. The same cells were nonetheless more sensitive than controls to the GPT inhibitor
          tunicamycin. Whether that reflects a reduced reserve of the same enzyme rather than a stress-response
          phenotype is unresolved, and the negative result is worth recording so that ER stress is not
          assumed into this entry''s mechanism by analogy with other CDGs.'
      selected_evidence:
        snippet: The unfolded protein response (UPR; the response to ER stress) was found not to be active
          in patient-derived fibroblasts, unlike that seen in cells from patients with PMM2-CDG or DPM1-CDG.
        supports: REFUTE
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
