        context: []
      assertion_type: Genetic
      assertion:
        name: DPAGT1
        gene_term:
          preferred_term: DPAGT1
          term:
            id: hgnc:2995
            label: DPAGT1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: DPAGT1 encodes UDP-GlcNAc:dolichol phosphate N-acetylglucosamine-1-phosphate transferase
          (GPT), a polytopic endoplasmic reticulum membrane protein that catalyses the first committed
          step of dolichol-linked oligosaccharide assembly. GPT works at the same point of the pathway
          as the ALG13-ALG14 heterodimer, with which it forms a multiglycosyltransferase complex that
          carries out the first two committed steps of asparagine-linked glycosylation; ALG14 and ALG2
          are themselves disease genes, and the KB's Congenital Myasthenic Syndrome 15 entry curates the
          ALG14 side of the same complex. Reported DPAGT1 alleles act by disrupting splicing, destabilising
          the protein, or preventing its correct localisation in the ER membrane rather than by abolishing
          the coding sequence.
        variants:
        - name: DPAGT1 c.660A>G (p.Tyr170Cys)
          description: The paternal allele of the index patient. Over-expression of the mutant cDNA yields
            a full-length protein with essentially no transferase activity.
          clinical_significance: PATHOGENIC
        - name: DPAGT1 index maternal splicing allele
          description: The maternal allele of the index patient, which produces only a small fraction
            of normal mature transcript, the remainder being aberrantly spliced and frameshifted. It is
            the residual normal transcript from this allele that supplies the surviving enzyme activity.
          clinical_significance: PATHOGENIC
        - name: DPAGT1 c.341C>G (p.Ala114Gly)
          description: A homozygous allele in two patients with a severe phenotype of hyperexcitability,
            intractable seizures, bilateral cataracts, progressive microcephaly and hypotonia; both died
            in the first year of life.
          clinical_significance: PATHOGENIC
        - name: DPAGT1 c.902G>A (p.Arg301His)
          description: A homozygous allele identified by homozygosity mapping in a large consanguineous
            family with 18 affected infants, in which the disorder was uniformly fatal.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: The results obtained, together with those of bioinformatic studies, revealed these mutations
          to affect the splicing process, the stability of GTP, or the ability of this protein to correctly
          localise in the ER membrane.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
