      assertion:
        target: Biallelic Hypomorphic DPAGT1 Variants
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Complete enzyme loss produces peri-implantation lethality rather than the human phenotype,
          which is why every viable human genotype retains partial activity.
        limitations: 'A homozygous null, not a hypomorph, so it models the wrong end of the allelic series:
          the embryos die at days 4-5 post-fertilisation, long before the nervous system, lens or neuromuscular
          junction exist, and no DPAGT1-CDG phenotype can be assessed in them. A hypomorphic mouse allele
          matching a patient genotype has not been reported.'
      selected_evidence:
        snippet: We find that embryos homozygous for a deletion in the GPT gene complete preimplantation
          development and also implant in the uterine epithelium, but die shortly thereafter between days
          4-5 postfertilization with cell degeneration apparent among both embryonic and extraembryonic
          cell types.
