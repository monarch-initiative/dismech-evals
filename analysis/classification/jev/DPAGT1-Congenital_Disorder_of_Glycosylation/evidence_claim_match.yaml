      assertion_type: Pathophysiology
      assertion:
        name: Neuromuscular Transmission Impairment
        biological_scale: TISSUE
        description: 'Alongside the encephalopathy, DPAGT1-CDG patients have a myasthenic component to
          their weakness. The evidence for treating this as a transmission defect rather than as central
          hypotonia is therapeutic: cholinesterase inhibition improves the muscle weakness of DPAGT1-CDG
          patients, as it does in the allelic myasthenic syndrome. This is the same endplate vulnerability
          that makes milder DPAGT1 alleles present as a pure congenital myasthenic syndrome, and the same
          one that the KB''s Congenital Myasthenic Syndrome 15 entry curates for the neighbouring ALG14
          subunit.'
        biological_processes:
        - preferred_term: protein N-linked glycosylation
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
          modifier: DECREASED
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: 'Pathogenic mutations in DPAGT1 are manifested as two possible phenotypes: congenital
          disorder of glycosylation DPAGT1-CDG (also known as CDG-Ij), and limb-girdle congenital myasthenic
          syndrome (CMS) with tubular aggregates.'
        supports: SUPPORT
    origin:
