              label: DPAGT1-congenital disorder of glycosylation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic DPAGT1 Variants
        biological_scale: MOLECULAR
        description: 'Germline variants on both DPAGT1 alleles reduce, but do not abolish, the amount
          of functional GPT the cell can make. Functional analysis of patient alleles shows three mechanisms:
          disruption of splicing, destabilisation of the protein, and failure to localise correctly to
          the ER membrane. Residual activity is a requirement rather than an incidental finding, because
          complete loss of the enzyme is not compatible with post-implantation development.'
        genetic_context:
          genes:
