  cea601dd488f3ab792da42250c19e9a85327a082eb76a025770f156458ea8a30:
    claim:
      about:
        disease:
          name: DPM2-congenital disorder of glycosylation
          disease_term:
            preferred_term: DPM2-congenital disorder of glycosylation
            term:
              id: MONDO:0014023
              label: congenital muscular dystrophy with intellectual disability and severe epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dolichol-Phosphate-Mannose Depletion
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The destabilized complex synthesizes less dolichol-phosphate-mannose from GDP-mannose
          and dolichol phosphate. Dol-P-Man is flipped to the luminal face of the endoplasmic reticulum,
          where it serves as the sole mannosyl donor for four glycosylation pathways: lipid-linked oligosaccharide
          (N-glycan precursor) mannosylation, protein O-mannosylation, protein C-mannosylation, and GPI-anchor
          mannosylation. Depletion of this single shared donor is therefore the branch point that produces
          the disorder''s combined CDG-plus-dystroglycanopathy phenotype.'
        chemical_entities:
        - preferred_term: dolichol phosphate mannose
          modifier: DECREASED
          term:
            id: CHEBI:17624
            label: dolichyl beta-D-mannosyl phosphate
        - preferred_term: GDP-mannose
          term:
            id: CHEBI:15820
            label: GDP-alpha-D-mannose
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
      selected_evidence:
        snippet: The sugar transfer from dolichol-phosphate-sugars occurs exclusively on the luminal side
          of the endoplasmic reticulum and is utilized in all four glycosylation pathways.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
