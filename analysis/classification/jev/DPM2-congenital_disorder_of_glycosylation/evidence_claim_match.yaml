      assertion_type: Pathophysiology
      assertion:
        name: DPM Synthase Complex Destabilization
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: DPM synthase is a heterotrimer of DPM1 (the catalytic subunit), DPM2 (a regulatory
          subunit that stabilizes DPM1 and enhances dolichol-phosphate binding) and DPM3 (which tethers
          DPM1 to the ER membrane). Biallelic DPM2 variants — missense alleles in either transmembrane
          region, a nonsense allele, or a canonical splice-acceptor allele — reduce or functionally impair
          DPM2, destabilizing the complex. In patient fibroblasts carrying a nonsense/missense genotype,
          DPM2 fell to roughly 60% of control and DPM1 protein became undetectable, showing that loss
          of the regulatory subunit also collapses the catalytic subunit.
        genes:
        - preferred_term: DPM2
          term:
            id: hgnc:3006
            label: DPM2
        protein_complexes:
        - preferred_term: dolichol-phosphate-mannose synthase complex
          modifier: DECREASED
          term:
            id: GO:0033185
            label: dolichol-phosphate-mannose synthase complex
        molecular_functions:
        - preferred_term: dolichyl-phosphate beta-D-mannosyltransferase activity
          modifier: DECREASED
          term:
            id: GO:0004582
            label: dolichyl-phosphate beta-D-mannosyltransferase activity
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: DPMS is composed of DPM1, DPM2, and DPM3 (Figure 1). DPM1 is the catalytic subunit of
          DPMS while DPM2 and DPM3 have been described as regulatory and tethering subunits respectively
        supports: SUPPORT
