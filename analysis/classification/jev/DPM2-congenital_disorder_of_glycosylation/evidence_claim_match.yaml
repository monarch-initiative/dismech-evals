        name: DPM3-congenital disorder of glycosylation
        description: Caused by variants in the DPM3 tethering subunit. Overlaps DPM2-CDG in combining
          a CDG type I pattern with alpha-dystroglycan hypo-O-mannosylation; often milder and more cardiac-predominant,
          with several adult-onset cases.
        distinguishing_features:
        - Cardiac involvement is prominent (reported in four of six DPM3 patients), and transferrin isoelectric
          focusing may be normal or only mildly abnormal. Molecular testing distinguishes the subunits.
      selected_evidence:
        snippet: This mild Dol-P-Man biosynthesis defect due to DPM3 mutations is a cause for alpha-dystroglycanopathy,
          thereby bridging the congenital disorders of glycosylation with the dystroglycanopathies.
        supports: SUPPORT
