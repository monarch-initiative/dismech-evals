      assertion:
        name: Alpha-Dystroglycan Hypo-O-Mannosylation
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: The POMT1/POMT2 O-mannosyltransferases use Dol-P-Man to initiate the O-mannosyl glycan
          on alpha-dystroglycan. Dol-P-Man depletion therefore truncates this glycan, so alpha-dystroglycan
          cannot be extended into its laminin-binding matriglycan. Muscle immunohistochemistry in DPM2-CDG
          patients showed deficient O-mannosylation, making DPM2-CDG a secondary dystroglycanopathy —
          the same arm demonstrated directly in the sister disorder DPM3-CDG.
        biological_processes:
        - preferred_term: protein O-linked glycosylation via mannose
          modifier: DECREASED
          term:
            id: GO:0035269
            label: protein O-linked glycosylation via mannose
        cell_types:
        - preferred_term: Skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: Investigation of the four Dol-P-Man-dependent glycosylation pathways in the ER revealed
          strongly reduced O-mannosylation of alpha-dystroglycan in a muscle biopsy, thereby explaining
          the clinical phenotype of muscular dystrophy.
        supports: SUPPORT
