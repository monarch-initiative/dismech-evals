          under-glycosylated. In DPM2-CDG this is detected clinically as a CDG type I transferrin isoelectric
          focusing pattern, and experimentally as reduced ICAM1, a general hypoglycosylation reporter,
          in cells expressing a pathogenic DPM2 allele.
