        snippet: In vitro functional analysis demonstrated that this variant increased the expression
          level of DPM2 protein and western blot revealed a significant decrease in ICAM1, a universal
          biomarker for hypoglycosylation in patients with CDG, suggesting abnormal N-linked glycosylation.
