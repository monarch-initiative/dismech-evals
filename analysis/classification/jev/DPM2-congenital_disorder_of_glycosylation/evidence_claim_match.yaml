  af88d24bf2d70890393ad29a4ffa9665d15972be10813b4acf31049551391cf0:
    claim:
      about:
        disease:
          name: DPM2-congenital disorder of glycosylation
          disease_term:
            preferred_term: DPM2-congenital disorder of glycosylation
            term:
              id: MONDO:0014023
              label: congenital muscular dystrophy with intellectual disability and severe epilepsy
        context: []
      assertion_type: Genetic
      assertion:
        name: DPM2
        gene_term:
          preferred_term: DPM2
          term:
            id: hgnc:3006
            label: DPM2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        frequency: All reported patients (biallelic in every case)
        notes: 'DPM2 (9q34.11) encodes the 84-amino-acid, two-transmembrane regulatory subunit of DPM
          synthase. Reported pathogenic alleles are missense (p.Tyr23Cys, p.Gly58Asp, p.Gly66Glu), nonsense
          (p.Arg47Ter) and a canonical splice-acceptor variant (c.4-1G>C), all germline and biallelic.
          Variant position appears to track with severity: alleles in the region encoding the first domain
          associate with the severe, early-lethal phenotype, while second-domain alleles associate with
          the milder phenotype — a correlation the reporting authors themselves flag as needing more data.'
        variants:
        - name: NM_003863.4:c.68A>G (p.Tyr23Cys)
          description: Recurrent missense allele in the first transmembrane region, found homozygously
            in one Italian family and in compound heterozygosity with the c.4-1G>C splice allele in another.
            Associated with the severe, infantile-lethal phenotype.
          type: MISSENSE_VARIANT
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: DPM2
            term:
              id: hgnc:3006
              label: DPM2
        - name: NM_003863.4:c.4-1G>C
          description: Canonical splice-acceptor variant found in compound heterozygosity with p.Tyr23Cys
            in the first reported family.
          type: SPLICE_SITE_VARIANT
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: DPM2
            term:
              id: hgnc:3006
              label: DPM2
        - name: NM_003863.4:c.197G>A (p.Gly66Glu)
          description: Homozygous missense allele in the second domain region, found in two Chinese siblings
            with the mild phenotype. Functional testing showed increased DPM2 protein but reduced ICAM1
            glycosylation, indicating impaired function rather than reduced abundance.
          type: MISSENSE_VARIANT
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: DPM2
            term:
              id: hgnc:3006
              label: DPM2
        - name: NM_003863.4:c.139C>T (p.Arg47Ter)
          description: Nonsense allele carried in trans with p.Gly58Asp in the adult (fourth-reported)
            patient. Neither allele had been reported previously; patient fibroblasts showed DPM2 expression
            at about 60% of control with no quantifiable DPM1 protein, so the pair behaves as a hypomorphic
            rather than a complete-null genotype - consistent with that patient's milder-than-infantile
            course.
          type: NONSENSE_VARIANT
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: DPM2
            term:
              id: hgnc:3006
              label: DPM2
        - name: NM_003863.4:c.173G>A (p.Gly58Asp)
          description: Missense allele in trans with the p.Arg47Ter nonsense allele in the adult (fourth-reported)
            patient, predicted deleterious by multiple in-silico algorithms.
          type: MISSENSE_VARIANT
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: DPM2
            term:
              id: hgnc:3006
              label: DPM2
      selected_evidence:
        snippet: DNA analysis revealed mutations in DPM2, 1 of the subunits of the dolichol-phosphate-mannose
          (DPM) synthase; the patient in the first family is compound heterozygous for 2 mutations (c.68A>G,
          predicting a missense mutation p.Y23C and c.4-1G>C, a splice mutation), whereas the patients
          in the second family are homozygous for the same missense mutation (c.68A>G, p.Y23C).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
