      assertion_type: Pathophysiology
      assertion:
        name: Sarcolemmal Laminin Anchorage Failure
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: Hypoglycosylated alpha-dystroglycan loses its laminin-binding capacity, so the dystrophin-glycoprotein
          complex can no longer transmit force between the myofibre cytoskeleton and the basal lamina.
          The sarcolemma becomes mechanically fragile, myofibres degenerate with each contraction cycle,
          and creatine kinase leaks into serum — the congenital muscular dystrophy component of the disorder.
        cell_types:
        - preferred_term: Skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: The resulting morphant embryos showed early death, muscle disorganization, low DPMS complex
          activity, and increased levels of apoptotic nuclei, together with hypoglycosylated α-DG in muscle
          fibers, thus recapitulating most of the characteristics seen in patients with mutations in DPMS.
        supports: SUPPORT
