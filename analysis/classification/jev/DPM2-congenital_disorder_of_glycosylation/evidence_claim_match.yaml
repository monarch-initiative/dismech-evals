        name: Primary alpha-dystroglycanopathies
        description: Congenital muscular dystrophies caused by variants in the dedicated alpha-dystroglycan
          glycosylation genes (POMT1, POMT2, POMGNT1, LARGE, FKTN, FKRP, B3GALNT2 and others), spanning
          Walker-Warburg syndrome and muscle-eye-brain disease.
        distinguishing_features:
        - Primary dystroglycanopathies impair alpha-dystroglycan O-mannosylation without a generalized
          N-glycosylation defect, so serum transferrin isoelectric focusing is typically normal — the
          key discriminator from DPM2-CDG.
      selected_evidence:
        snippet: Most genes code for glycosyltransferases (POMT1, POMT2, POMGNT1, LARGE, GTDC2, B4GAT1,
          B3GALNT2) although a minority does not (DPM1, DPM2, DPM3, DOLK, POMK, GMPPB).
        supports: SUPPORT
