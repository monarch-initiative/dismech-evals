      assertion_type: Treatment
      assertion:
        name: Supportive and Multidisciplinary Care
        description: 'No disease-modifying therapy exists for DPM2-CDG. Unlike PMM2-CDG or MPI-CDG, the
          lesion is in Dol-P-Man synthesis itself rather than in substrate availability, so simple mannose
          supplementation would not be expected to bypass the block and none has been reported. Management
          is symptom-directed and multidisciplinary: seizure control, orthopedic and rehabilitative care,
          cardiac surveillance, and nutritional support.'
        action_category: THERAPEUTIC
        therapeutic_modality: OTHER
        treatment_term:
