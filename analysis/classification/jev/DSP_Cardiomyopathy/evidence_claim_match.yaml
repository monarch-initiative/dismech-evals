        name: Desmoplakin Haploinsufficiency — Desmosomal Disruption
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: Desmoplakin is the most abundant protein in desmosomes, linking the transmembranous
          desmosomal cadherins to the intermediate filament network. Heterozygous truncating variants
          in DSP lead to haploinsufficiency, weakening the desmosomal complex in cardiomyocytes. The left
          ventricle is frequently involved early, distinguishing DSP cardiomyopathy from classic right-dominant
          ARVC.
