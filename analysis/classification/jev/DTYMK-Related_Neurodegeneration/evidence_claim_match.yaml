        context: []
      assertion_type: Treatment
      assertion:
        name: Deoxycytidine plus deoxythymidine substrate-enhancement therapy (investigational)
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: deoxynucleoside substrate-enhancement pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: deoxycytidine
            term:
              id: CHEBI:15698
              label: 2'-deoxycytidine
          - preferred_term: thymidine
            term:
              id: CHEBI:17748
              label: thymidine
        description: An open-label phase II trial of oral deoxycytidine plus deoxythymidine for mitochondrial
          DNA depletion disorders lists DTYMK among its eligible genotypes. This is the only interventional
          study anywhere that names DTYMK. No result specific to a DTYMK-mutant participant has been published,
          and no DTYMK patient is known to have been enrolled.
        notes: 'This is curated as an investigational eligibility, NOT as an evidenced treatment, and
          the mechanistic caveat is the point of the entry. Substrate enhancement with deoxythymidine
          works in TK2 deficiency because TK2 performs the FIRST salvage step, so supplying thymidine
          downstream of the defective kinase restores flux. In DTYMK deficiency the block is at dTMP to
          dTDP, which is DOWNSTREAM of where supplemental thymidine enters the pathway. Supplying more
          thymidine therefore adds substrate proximal to the block and has no obvious route to restoring
          dTTP. Supplemental deoxycytidine could in principle relieve pyrimidine pool imbalance, but that
          is speculation. Additionally, the trial''s rationale is mtDNA depletion, and mtDNA depletion
          has never been demonstrated in a DTYMK patient (see the dtymk-mtdna-depletion mechanistic hypothesis).
          The inclusion of DTYMK in the eligibility list appears to follow from the 2019 paper''s title
          rather than from demonstrated mtDNA depletion. Nothing here should be read as a recommendation.

          The trial record is quoted from the cached ClinicalTrials.gov summary at references_cache/clinicaltrials_NCT04802707.md,
          which already existed in this repository and was not created for this entry.'
      selected_evidence:
        snippet: 'The subjects included are children (0-18Y), with positive MDS diagnosis and express
          mutations in one of the following genes: POLG, POLG2, C10orf2, RRM2B, MPV17, SUCLA2, SUCLG1,
          FBXL4, DTYMK.'
        supports: SUPPORT
