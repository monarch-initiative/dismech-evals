  024943933f95fa1e1478079f148d0b3d1a43bae421be49df7611b6e907ef4244:
    claim:
      about:
        disease:
          name: DTYMK-Related Neurodegeneration
          disease_term:
            preferred_term: childhood-onset neurodegeneration with progressive microcephaly
            term:
              id: MONDO:0859241
              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: Genetic
      assertion:
        name: DTYMK
        gene_term:
          preferred_term: DTYMK
          term:
            id: hgnc:3061
            label: DTYMK
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'DTYMK sits at chromosome 2q37.3 and encodes dTMPK (deoxythymidylate kinase, thymidylate
          kinase, TMPK), a 212-residue cytosolic nucleoside monophosphate kinase. PMID:34918187 identifies
          its P-loop motif at residues 13-21, a DR(Y/H) motif at residues 96-98 and a LID domain at residues
          135-150. Notably, neither disease variant lies within any of these named domains, which the
          authors state explicitly, so the near-total loss of activity in patient fibroblasts is not explained
          by direct disruption of a catalytic motif. Gene identity was verified against the MONDO gene-association
          relation `RO:0004003 HGNC:3061 ! DTYMK` on MONDO:0859241.

          A separate transcript-level point worth recording: PMID:34918187 uses NM_012145.3 and PMID:40696808
          uses NM_012145.4 for the same c.242C>T p.Pro81Leu allele. The version differs, the variant does
          not.'
        variants:
        - name: NM_012145.3:c.242C>T (p.Pro81Leu)
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: 'The recurrent allele. Homozygous in the Egyptian individual II of PMID:34918187
            and in the Mexican case of PMID:40696808, and inherited from the father in the compound heterozygous
            Dutch individual I. It substitutes a moderately conserved amino acid at a highly conserved
            nucleotide (phyloP 5.29). In silico prediction is discordant: SIFT called it tolerated, PolyPhen-2
            possibly damaging, MutationTaster disease-causing. In gnomAD as accessed by PMID:34918187
            in May 2021 it appeared once, heterozygous only. The functional evidence, not the prediction,
            is what establishes pathogenicity.'
        - name: NM_012145.3:c.382G>A (p.Asp128Asn)
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: The maternal allele in the compound heterozygous Dutch individual I of PMID:34918187.
            It changes an amino acid conserved as far as Saccharomyces cerevisiae at a highly conserved
            nucleotide (phyloP 5.61). SIFT called it tolerated; MutationTaster and PolyPhen-2 called it
            disease-causing and probably damaging. Reported four times in gnomAD as accessed in May 2021,
            never homozygous.
        - name: p.Ala99Thr
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: 'A third patient missense allele, characterised biochemically alongside p.Pro81Leu
            and p.Asp128Asn. Like them it converts the enzyme to a monomer with reduced substrate affinity
            and catalytic efficiency.

            Which patient carries this allele is deliberately NOT asserted. PMID:34926941 states that
            four variants have been identified in human patients without assigning them to individuals,
            and the only two families whose genotypes are individually published (PMID:34918187, PMID:40696808)
            carry p.Pro81Leu and p.Asp128Asn. It is therefore likely that p.Ala99Thr and the frameshift
            belong to the two siblings of PMID:31271740, whose specific variants are not named in the
            cached abstract, but that is an inference from elimination and is recorded here as such rather
            than curated as fact. Resolving it requires the Clin Chim Acta full text, which is not open-access
            and was not obtained for this entry.'
        - name: DTYMK frameshift allele (position not specified in cached sources)
          type: FRAMESHIFT
          clinical_significance: PATHOGENIC
          description: 'A frameshift allele reported among the four patient variants characterised by
            PMID:34926941. The cached sources for this entry name it only as a frameshift; no cDNA or
            protein coordinate is given in any text quoted here, so none is asserted.

            This variant record intentionally carries no HGVS name. The deep-research report for this
            entry proposed c.287_320del p.Asp96fs on the basis of a ClinVar lookup, and that may well
            be correct, but ClinVar was not independently queried during this curation and no cached reference
            states that coordinate. Naming it here would be asserting an identifier this entry cannot
            support. A curator with ClinVar access should complete this record.'
      selected_evidence:
        snippet: we identified loss-of-function of DTYMK as the cause of a severe postnatal neurodegenerative
          disease and highlight the essential nature of dTTP synthesis in the maintenance of genome stability
          and neuronal survival
        supports: SUPPORT
