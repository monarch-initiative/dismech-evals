        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Aicardi-Goutieres syndrome
        disease_term:
          preferred_term: Aicardi-Goutieres syndrome
          term:
            id: MONDO:0018866
            label: Aicardi-Goutieres syndrome
        description: The closest clinical and mechanistic mimic, and the comparison the primary paper
          itself draws. AGS also presents with progressive microcephaly, psychomotor retardation, white
          matter destruction, brain atrophy and death in early childhood, and at the mechanistic level
          both disorders are characterised by elevated ribonucleotide incorporation into genomic DNA -
          in AGS because RNase H2 cannot excise them, in DTYMK deficiency because the dTTP shortage causes
          them to be inserted in the first place.
        distinguishing_features:
        - 'Molecular: AGS is genetically heterogeneous (RNASEH2A/B/C, TREX1, SAMHD1, ADAR, IFIH1 and others)
          and is a type 1 interferonopathy; DTYMK deficiency is a single-gene nucleotide-biosynthesis
          defect with no interferon signature reported.'
        - 'Imaging and laboratory: intracranial calcification and CSF lymphocytosis are characteristic
          of AGS and are not reported in DTYMK deficiency. Systemic features of AGS such as thrombocytopenia
          and hepatosplenomegaly are also absent.'
        - 'Directionality of the ribonucleotide defect: in AGS, ribonucleotides accumulate because ribonucleotide
          excision repair fails. In DTYMK deficiency they accumulate because the replication machinery
          substitutes them for the missing deoxynucleotide. The shared readout has opposite upstream causes.'
      selected_evidence:
        snippet: at the mechanistic level, AGS and DTYMK deficiency are similar as both are characterized
          by elevated ribonucleotide incorporation in the genome
        supports: SUPPORT
    origin:
