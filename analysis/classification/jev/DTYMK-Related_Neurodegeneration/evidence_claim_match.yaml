          in DTYMK deficiency, so plasma thymidine and deoxyuridine are diagnostically elevated in MNGIE
          and are not a feature here.'
        - 'Clinical: MNGIE is a multisystem disorder dominated by gastrointestinal dysmotility, cachexia,
          ptosis and ophthalmoplegia, peripheral neuropathy and leukoencephalopathy, typically with onset
          in the second or third decade. DTYMK deficiency is an infantile brain-restricted degeneration
          with no gastrointestinal or neuromuscular signature reported.'
