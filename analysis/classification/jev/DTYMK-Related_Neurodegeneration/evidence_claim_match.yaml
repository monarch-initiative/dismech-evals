              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Disease requires two damaging DTYMK alleles. Of the three published families, one
          is a consanguineous Egyptian family with a homozygous missense allele, one is a non-consanguineous
          Dutch family with compound heterozygous missense alleles, and one is a Hong Kong family with
          two variants in trans; the fifth reported individual is homozygous. Carrier parents are clinically
          unaffected but have measurably reduced dTMPK activity in fibroblasts. Recurrence risk for siblings
          of a proband is 25 percent, and carrier testing plus genetic counselling are indicated for at-risk
          relatives.
      selected_evidence:
        snippet: have been diagnosed to harbor two heterozygous variants in trans in the DTYMK gene of
          the thymidine biosynthesis pathway
        supports: SUPPORT
