  dafdcf01d4704e07ab9ab9037b51d9255ef0182a271aa5d17c748d1af932590a:
    claim:
      about:
        disease:
          name: DTYMK-Related Neurodegeneration
          disease_term:
            preferred_term: childhood-onset neurodegeneration with progressive microcephaly
            term:
              id: MONDO:0859241
              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dtymk-mtdna-controversy
        prompt: Is DTYMK deficiency a mitochondrial DNA depletion syndrome, as its first description asserted,
          or a nuclear genome instability disorder?
        kind: CONTROVERSY
        status: OPEN
        rationale: 'PMID:31271740 titles DTYMK a novel gene for mitochondrial DNA depletion syndrome on
          the basis of an in silico inference. PMID:34918187 measured mtDNA copy number, mtDNA integrity
          and respiratory chain activity in patient fibroblasts and found all normal, and instead demonstrated
          a nuclear phenotype: impaired DNA replication, ribonucleotide misincorporation and a persistent
          DNA damage response. The question is not fully closed because the 2022 authors concede that
          fibroblast mtDNA copy number does not represent affected tissue and that muscle would be needed
          to settle it.'
        proposed_experiments:
        - experiment_id: exp_dtymk_mtdna_affected_tissue
          name: mtDNA copy number in affected tissue rather than fibroblasts
          description: Measure mtDNA copy number in post-mortem brain and in skeletal muscle from an affected
            individual, the tissues in which depletion would actually matter. PMID:34918187 explicitly
            states that fibroblast and blood copy number is not representative and that muscle is required,
            so this is the experiment its own authors nominate.
        - experiment_id: exp_dtymk_dntp_pool_in_neurons
          name: Direct dNTP pool measurement in patient-derived neurons
          description: Quantify the dNTP pool, including dTTP, directly in patient-derived neurons or
            cerebral organoids. Existing measurements were made in fibroblasts and whole zebrafish larvae
            and were normal; the cell type that actually dies has never been assayed.
      selected_evidence:
        snippet: Unfortunately, we do not have access to muscle tissue of the described individuals.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
