    evidence_metadata:
      reference: PMID:35346037
      reference_title: 'Differential expression of enzymes in thymidylate biosynthesis in zebrafish at
        different developmental stages: implications for dtymk mutation-caused neurodegenerative disorders.'
      evidence_source: MODEL_ORGANISM
      explanation: In zebrafish, brain carries the highest tissue level of this enzyme activity. This
        is curated as PARTIAL rather than SUPPORT because PMID:34918187 argues the opposite for human,
        stating that a restricted expression pattern of DTYMK is unlikely to explain the brain selectivity
        since DTYMK is expressed in all human tissues. The two statements are not strictly contradictory
        - highest activity is not the same as restricted expression, and one is fish and one is human
        - but the human paper's position should govern, so this is not used to assert a tissue-expression
        explanation for the human phenotype.
