      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autosomal recessive primary microcephaly (MCPH)
        disease_term:
          preferred_term: autosomal recessive primary microcephaly
          term:
            id: MONDO:0016660
            label: autosomal recessive primary microcephaly
        description: The differential that the disease name itself is built to exclude. Both are autosomal
          recessive, both present with severe microcephaly and profound developmental impairment in a
          consanguineous family, and both will be referred for exome sequencing on that basis. MCPH is
          a neurodevelopmental disorder in which the brain is small from the outset because too few neurons
          were generated; DTYMK deficiency is a neurodegenerative disorder in which a near-normal head
          circumference at birth is followed by destruction of brain already built.
        distinguishing_features:
        - 'Timing: MCPH is primary or congenital microcephaly, present at birth by definition. In DTYMK
          deficiency head circumference is at or near the normal range at birth and then falls away from
          the centiles, reaching minus 7.6 SD at 9 months in individual I and minus 7.4 SD at 26 months
          in individual II (see the Progressive Microcephaly phenotype, where those figures are evidenced).
          This is the single most discriminating feature and is why the disorder is named for PROGRESSIVE
          microcephaly.'
        - 'Trajectory: MCPH is classified as a neurodevelopmental disorder, not a degenerative one. DTYMK
          deficiency is degenerative - progressive neurodevelopmental regression is documented in the
          fifth reported case (PMID:40696808) and both individuals with reported outcomes died in early
          childhood. Note the honest limit here: in the two individuals of PMID:34918187 no milestone
          was ever gained, so regression could not be observed in them; the degenerative character in
          those two rests on serial imaging and on autopsy, not on skill loss. See the Developmental Regression
          phenotype, which records the same limitation.'
        - 'Imaging: what separates the two is SERIAL imaging, not a single scan. DTYMK deficiency shows
          a near-normal or only mildly abnormal neonatal scan followed within months by severe hemispheric
          and basal ganglia atrophy with ventricular and subarachnoid enlargement (see the brain-MRI diagnosis
          entry). A single small-brain scan in a microcephalic infant does not discriminate; two scans
          months apart do. No cached reference in this entry describes MCPH imaging, so no positive imaging
          claim is made about MCPH here.'
        - 'Molecular: MCPH is caused by variants in centrosomal and mitotic-spindle genes such as ASPM,
          WDR62 and MCPH1 (MONDO:0016660), whereas DTYMK deficiency is a nucleotide-biosynthesis defect
          (MONDO:0859241).'
        notes: 'Added on review. The distinguishing features above are drawn from claims already evidenced
          elsewhere in this entry (the onset, progression and imaging sections) plus the two quoted MCPH
          statements below. Nothing new is asserted about DTYMK deficiency here.

          Sourcing limits, stated rather than papered over. No cached reference for this entry mentions
          MCPH, ASPM or WDR62 - literal case-insensitive searches for `ASPM`, `WDR62`, `primary microcephaly`,
          `MCPH`, `congenital microcephaly` and `static` across references_cache/PMID_34918187.md and
          PMID_40696808.md on 2026-08-01 returned only a bibliography line. The MCPH side is therefore
          evidenced from PMID:35111754, an MCPH review already present in references_cache for the Autosomal_Recessive_Primary_Microcephaly
          entry; no new reference was fetched. That review states MCPH''s congenital and neurodevelopmental
          character, which is what the contrast turns on, but it does NOT contain a sentence asserting
          that MCPH is non-progressive in so many words, so the "static" wording in the trajectory bullet
          is a curatorial reading of "neurodevelopmental" and "present at birth" and is not directly quoted.
          The gene list (ASPM, WDR62, MCPH1) is not quoted either; it is common knowledge for this disorder
          and is stated in the distinguishing feature rather than as an evidenced claim.'
      selected_evidence:
        snippet: Autosomal recessive primary microcephaly (MCPH) is the prototype of isolated primary
          (congenital) microcephaly, affecting predominantly the cerebral cortex.
        supports: SUPPORT
