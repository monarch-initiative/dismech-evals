            term:
              id: MONDO:0859241
              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide reported literature
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No population-based prevalence study exists and no Orphanet prevalence class is available
          to adopt, because no ORPHA entity for this disorder exists (EBI OLS4 ORDO searches for `DTYMK`
          and for the disease name both returned numFound 0 on 2026-08-01, and MONDO:0859241 carries no
          ORPHA cross-reference). The published case count is therefore the only defensible measure. PMID:40696808,
          published in 2025, states that only four cases had been reported before its own, which it describes
          as the fifth. Those four resolve to the two siblings of PMID:31271740 and the two unrelated
          children of PMID:34918187, giving a cumulative published total of five individuals worldwide.
          That count places the disorder in the ultra-rare tier. Note that the five-case total is the
          arithmetic of adding the earlier series to the 2025 report; the number five is stated by PMID:40696808,
          but the attribution of the earlier four to those two specific papers is a curatorial reconciliation,
          not a statement read off that paper.
      selected_evidence:
        snippet: Only four cases have been reported in the literature to date.
        supports: SUPPORT
