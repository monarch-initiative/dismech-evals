        context: []
      assertion_type: Biochemical
      assertion:
        name: Normal routine metabolic work-up
        presence: NORMAL
        context: A normal biochemical screen is diagnostically load-bearing in this disorder rather than
          merely unremarkable. Glucose, lactate, ammonia, biotinidase, creatine kinase, acylcarnitines,
          amino acids, very long-chain fatty acids and urinary organic acids were all normal in individual
          II of PMID:34918187, and extensive metabolic investigation in individual I was likewise unrevealing.
          The corollary is that no first-line metabolic panel will raise this diagnosis and that a normal
          screen does not exclude it.
        readouts:
        - target: Block of Canonical dTTP Biosynthetic Flux
          relationship: READOUT_OF
          direction: PRESENT_ABSENT
          endpoint_context: DIAGNOSTIC
          interpretation: Read together with the separately curated finding that steady-state dTTP pools
            are normal, the normal metabolic screen is what forces the mechanistic claim to be about FLUX
            rather than about a measurable metabolite abnormality. There is no analyte to test for.
        notes: 'Curated as a normal finding on purpose. This is the biochemical counterpart of the diagnosis
          section''s statement that molecular testing establishes the diagnosis rather than confirming
          a biochemical suspicion. Denominator: the itemised panel is reported for individual II only;
          individual I is covered by a general statement that extensive metabolic investigations were
          performed. No purine/pyrimidine or dNTP-panel result is quoted here because the dTTP measurement
          is curated on the pathophysiology node it constrains.'
      selected_evidence:
        snippet: Extensive metabolic investigations were performed
        supports: SUPPORT
