        discussion_id: dtymk-zebrafish-eye-mismatch
        prompt: How much weight should the dtymk zebrafish eye phenotype carry for the human disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        rationale: The dtymk knockout zebrafish has small, deformed eyes lacking four of the six retinal
          layers, plus absent Meckel's cartilage. Neither human individual had a structural eye abnormality;
          their visual deficit was central, and formal ophthalmologic examination in individual II was
          normal. The model reproduces the microcephaly, neuronal apoptosis and early lethality faithfully,
          so it is a good model of the neurodegeneration, but its ocular and craniofacial readouts should
          not be back-projected onto the human phenotype. This matters for curation because it would be
          easy to add microphthalmia and a jaw anomaly to the human entry on the strength of a persuasive
          figure.
      selected_evidence:
        snippet: However, the eyes were morphologically normal in both individuals.
        supports: SUPPORT
