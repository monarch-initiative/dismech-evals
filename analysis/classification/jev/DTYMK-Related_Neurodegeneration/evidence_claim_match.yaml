  44e0df4c8ecac7a5d607856f4e6e37b6f40082aa4f9d2a79ab0da78b5c492f1f:
    claim:
      about:
        disease:
          name: DTYMK-Related Neurodegeneration
          disease_term:
            preferred_term: childhood-onset neurodegeneration with progressive microcephaly
            term:
              id: MONDO:0859241
              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Block of Canonical dTTP Biosynthetic Flux
        biological_scale: MOLECULAR
        description: 'dTTP is one of the four building blocks of DNA, and the canonical route to it is
          completely blocked. Crucially, this is a defect of FLUX, not a demonstrated depletion of the
          steady-state pool: measured dTTP nucleotide levels in patient fibroblasts and in mutant zebrafish
          resembled normal controls. The disorder is therefore best modelled as a demand-limited and possibly
          compartment-limited supply failure that manifests in cells with high replicative and repair
          demand, rather than as bulk pool depletion.'
        biological_processes:
        - preferred_term: dTTP biosynthetic process
          term:
            id: GO:0006235
            label: dTTP biosynthetic process
          modifier: DECREASED
        chemical_entities:
        - preferred_term: dTTP
          term:
            id: CHEBI:18077
            label: dTTP
        notes: 'The dTTP chemical is deliberately listed WITHOUT a DECREASED modifier. An earlier draft
          of this entry marked it DECREASED, which the sources do not support: PMID:34918187 reports that
          dTTP nucleotide levels in both the fibroblast and zebrafish models resemble those of normal
          controls. Only the biosynthetic PROCESS carries a DECREASED modifier. The practical corollary
          is that a normal dNTP panel on fibroblasts does not exclude this diagnosis.'
      selected_evidence:
        snippet: This study shows that impairment of the biosynthesis of one of the building blocks of
          DNA, dTTP, causes a severe, early-onset neurodegenerative disease.
        supports: SUPPORT
