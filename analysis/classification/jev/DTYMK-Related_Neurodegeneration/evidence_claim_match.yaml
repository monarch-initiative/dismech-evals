  c071a5e3a3e2f90b1166182c53143e2e943c9c399f776f4e8abd74d1c2bc475a:
    claim:
      about:
        disease:
          name: DTYMK-Related Neurodegeneration
          disease_term:
            preferred_term: childhood-onset neurodegeneration with progressive microcephaly
            term:
              id: MONDO:0859241
              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Global neuronal loss with sparing of dentate nucleus and brainstem
        description: 'Autopsy of individual I in PMID:34918187 showed severe atrophy of the neocortex,
          cerebral white matter and basal ganglia with massive neuronal dropout, while the brainstem,
          cerebellar dentate nucleus and the gross size of the cerebellum were preserved. The sparing
          pattern is the diagnostically informative part: this is not a uniform encephaloclastic process
          but a selective one that leaves specific structures intact, matching the imaging observation
          that brainstem and cerebellum look comparatively normal on MRI.'
        diagnostic: true
        notes: 'No finding_term is bound. The HistopathologyFindingTerm binding admits only NCIT terms
          reachable from the Histopathology Result branch (NCIT:C83490) plus a handful of HP rosette terms,
          and OAK searches of the NCIT Morphologic Finding branch on 2026-08-01 returned no term for neuronal
          loss or for a regional sparing pattern (candidates audited and rejected: NCIT:C50774 Tissue
          Degeneration and NCIT:C120874 Degeneration and Atrophy, both too generic to carry the sparing
          claim, which is the whole point of this record). The corresponding clinical phenotype is separately
          bound to HP:0002529 in the phenotypes section.

          Neuropathology exists for exactly ONE of the five published individuals, so no frequency is
          asserted for any entry in this section.'
      selected_evidence:
        snippet: Here, we describe two unrelated children with bi-allelic variants in DTYMK, encoding
          dTMPK, which catalyzes the penultimate step in dTTP biosynthesis. ... On MRI, the brain stem
          and cerebellum also appeared normal (Fig. 1b, individual I). ... Gross neuropathological examination
          showed severe atrophy of the neocortex, cerebral white mat- ter and basal ganglia, with normal
          size of brainstem and cerebellum (Fig. 2 Overview). Microscopy of the cerebral cortical ribbon
          revealed massive loss of neurons with astro- gliosis and minimal vascular proliferation (Fig.
          2 Histology). ... only sparing the dentate nucleus and brain stem.
        supports: SUPPORT
    origin:
