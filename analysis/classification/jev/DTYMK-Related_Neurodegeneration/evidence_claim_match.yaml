        name: Cerebral Visual Impairment
        category: Neurologic
        description: Neither individual in PMID:34918187 tracked objects; individual I was thought able
          to distinguish only light from dark. The eyes were morphologically normal and formal ophthalmologic
          examination in individual II was normal, so this is cortical or central visual impairment rather
          than an ocular abnormality.
        notes: 'No frequency band. Documented in 2/2 individuals in PMID:34918187 but not addressed in
          PMID:31271740 or in the PMID:40696808 abstract. A denominator of two out of a series of five
          is too thin to band.

          Curated as HP:0100704 Cerebral visual impairment rather than the more general HP:0000505 Visual
          impairment. The specific term is what the two curated snippets actually support taken together:
          absent visual tracking with morphologically normal eyes and a normal ophthalmologic examination
          is a central rather than an ocular deficit. HP:0100704 is also the term used in the HPO annotation
          set for OMIM:619847. No imaging of the optic radiations or visual cortex, and no VEP, is reported
          in any cached reference, so the localisation rests on the exclusion of an ocular cause rather
          than on a positive cortical finding.'
        phenotype_term:
          preferred_term: Cerebral visual impairment
          term:
            id: HP:0100704
            label: Cerebral visual impairment
      selected_evidence:
        snippet: However, the eyes were morphologically normal in both individuals.
