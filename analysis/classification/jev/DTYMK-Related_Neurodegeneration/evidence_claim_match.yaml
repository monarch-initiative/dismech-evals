          genuinely disagree. Radiological cerebellar atrophy is reported in 1 of the 3 imaged individuals
          (PMID:40696808), while PMID:34918187 explicitly describes the cerebellum as appearing normal
          on MRI in its two individuals - yet reports histological cerebellar neuronal loss in the one
          individual who came to autopsy. The term is retained because the histology and the third case
          both point to real cerebellar pathology, but a band would misrepresent a 1/3 imaging finding.
        phenotype_term:
          preferred_term: Cerebellar atrophy
          term:
            id: HP:0001272
            label: Cerebellar atrophy
