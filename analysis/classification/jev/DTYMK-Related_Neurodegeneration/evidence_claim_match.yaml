      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dtymk-nuclear-genome-instability
        hypothesis_label: Nuclear genome instability from dTTP depletion
        status: CANONICAL
        description: The accepted model. Loss of dTMPK collapses the dTTP pool, which impairs nuclear
          DNA replication, drives ribonucleotide misincorporation into genomic DNA, and leaves DNA damage
          unrepaired. Neurons and oligodendrocytes die by apoptosis and the brain atrophies postnatally.
          This model is supported by patient enzymology, patient fibroblast replication assays and an
          independent zebrafish knockout.
      selected_evidence:
        snippet: we identified loss-of-function of DTYMK as the cause of a severe postnatal neurodegenerative
          disease and highlight the essential nature of dTTP synthesis in the maintenance of genome stability
          and neuronal survival
        supports: SUPPORT
