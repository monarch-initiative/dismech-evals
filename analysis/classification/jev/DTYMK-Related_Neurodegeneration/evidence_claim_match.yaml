        context: []
      assertion_type: Treatment
      assertion:
        name: Supportive and symptomatic management
        action_category: THERAPEUTIC
        therapeutic_modality: OTHER
        description: 'No disease-modifying therapy exists and none has been trialled. All reported management
          has been symptomatic and is curated as separate atomic entries below: anti-seizure pharmacotherapy,
          nasogastric tube feeding, and blood transfusion for the anaemia in individual II, with genetic
          counselling recorded as a non-therapeutic action. Both individuals with reported outcomes nonetheless
          died in early childhood after intercurrent infection.'
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: 'This entry is the umbrella statement that management is supportive only; the individual
          interventions are curated one per entry below rather than bundled here. No cached reference
          for this entry uses the words "supportive care", "palliative" or "multidisciplinary" — literal
          case-insensitive searches for `supportiv`, `palliat`, `symptomatic`, `multidisciplinary`, `no
          cure`, `no specific`, `no effective` and `no disease-modif` across references_cache/PMID_34918187.md,
          PMID_40696808.md, PMID_31271740.md and PMID_34926941.md on 2026-08-01 all returned zero hits.
          The NCIT:C15747 binding is therefore a curatorial roll-up of the individually evidenced symptomatic
          interventions, not a quoted characterisation, and no separate "multidisciplinary/palliative
          care" treatment entry has been created because nothing in the cached literature would support
          one.

          The DTYMK inhibitors developed in the oncology literature are conceptually contraindicated in
          a loss-of-function disorder and are deliberately not curated. Deoxynucleoside substrate-enhancement
          therapy is curated separately below, with its mechanistic caveat, because unlike the inhibitors
          it is genuinely on the table.'
      selected_evidence:
        snippet: Further functional studies are needed to elucidate the mechanisms linking DTYMK dysfunction
          to neurodegeneration.
        supports: SUPPORT
