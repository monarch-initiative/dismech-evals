              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: ICIMDAssignment
      assertion:
        classification_value: pyrimidine_metabolism
        notes: 'dTMP and dTTP are pyrimidine deoxynucleotides, and dTMPK acts on the dTMP to dTDP step,
          so the defect sits in pyrimidine nucleotide metabolism. This matches the way MONDO classifies
          the two other dTTP-pathway disorders that PMID:34918187 uses as comparators: both MONDO:0011283
          (TYMP, MNGIE) and MONDO:0014647 (CAD, DEE50) are subclasses of MONDO:0019238 `inborn disorder
          of pyrimidine metabolism`. MONDO:0859241 itself is not currently placed under that grouping
          term, so this classification is a curatorial judgement rather than an inherited MONDO assertion.'
      selected_evidence:
        snippet: This makes dTMPK the bottleneck for dTTP biosynthesis
        supports: SUPPORT
