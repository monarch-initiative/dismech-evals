        target_phenotypes:
        - preferred_term: Absent neurodevelopmental progress
          term:
            id: HP:0001263
            label: Global developmental delay
        notes: 'No `status` is asserted. The cached ClinicalTrials.gov summary at references_cache/clinicaltrials_NCT04802707.md
          carries the study description only; it contains no recruitment-status field, and guessing one
          would be fabrication. Phase II is taken from the registered study title.

          Recorded here as well as under `treatments` so that it is queryable as a trial. The mechanistic
          objection - that deoxythymidine enters the pathway UPSTREAM of the dTMP-to-dTDP block, so substrate
          enhancement has no obvious route to restoring dTTP in this gene, unlike in TK2 deficiency -
          is set out in full in the corresponding treatment entry and applies equally here. The target_phenotype
          is the trial''s stated neurological target expressed with the nearest term this entry already
          uses; the registry text says only "Subjects with MDS expressing neurological phenotypes dysfunction"
          and names no specific phenotype, so nothing more granular is claimed.'
      selected_evidence:
        snippet: 'The subjects included are children (0-18Y), with positive MDS diagnosis and express
          mutations in one of the following genes: POLG, POLG2, C10orf2, RRM2B, MPV17, SUCLA2, SUCLG1,
          FBXL4, DTYMK.'
        supports: SUPPORT
