      evidence_source: IN_VITRO
      explanation: The 2022 authors state that the tissue in which mtDNA depletion could actually have
        been assessed was unavailable to them, which is why their negative fibroblast result does not
        formally close the question. Their fuller statement of the caveat, that fibroblast and blood copy
        number is not representative of affected tissue, is broken across a line-break hyphen in the cached
        PDF extraction and so is paraphrased in this discussion's rationale rather than quoted.
