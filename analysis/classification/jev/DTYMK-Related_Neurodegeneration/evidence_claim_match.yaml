            term:
              id: MONDO:0859241
              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of dTMP Kinase Catalytic Activity
        biological_scale: MOLECULAR
        description: 'dTMPK phosphorylates dTMP to dTDP. Because the de novo route (dUMP to dTMP via thymidylate
          synthase) and the salvage route (thymidine to dTMP via thymidine kinase) both converge on dTMP,
          dTMPK is the single obligatory enzyme downstream of that convergence and is therefore the bottleneck
          for the entire dTTP supply. In fibroblasts of the compound heterozygous individual, activity
          was 0.62 pmol/min/mg protein against 43.65 and 31.08 in the heterozygous mother and father respectively.
          The loss is not uniform across compartments: in patient fibroblasts carrying P81L and D128N,
          mitochondrial TMPK activity was completely absent while cytosolic activity was extremely low
          and unstable. That compartment asymmetry is the strongest remaining argument for a mitochondrial
          contribution to the phenotype.'
        genes:
        - preferred_term: DTYMK
          term:
            id: hgnc:3061
            label: DTYMK
        molecular_functions:
        - preferred_term: dTMP kinase activity
          term:
            id: GO:0004798
            label: dTMP kinase activity
          modifier: DECREASED
      selected_evidence:
        snippet: This makes dTMPK the bottleneck for dTTP biosynthesis
        supports: SUPPORT
