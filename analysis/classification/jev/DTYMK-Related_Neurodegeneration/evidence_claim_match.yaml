  c2aa4153e4f4c22b8bf4d0403dbf515efe6e821367995fb51550a5ba7ac353ba:
    claim:
      about:
        disease:
          name: DTYMK-Related Neurodegeneration
          disease_term:
            preferred_term: childhood-onset neurodegeneration with progressive microcephaly
            term:
              id: MONDO:0859241
              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dtymk-mtdna-depletion
        hypothesis_label: Mitochondrial DNA depletion
        status: ALTERNATIVE
        description: The original 2019 proposal was that DTYMK belongs to the mitochondrial DNA depletion
          syndrome gene set, on the basis of an in silico inference of mtDNA depletion in the more severely
          affected of two siblings. The 2022 study tested this directly in patient fibroblasts and found
          normal mtDNA copy number, no mtDNA deletions on long-range PCR, and normal respiratory chain
          complex I-V activities, alongside normal lactate and alanine in its own two individuals. The
          hypothesis is nevertheless kept as ALTERNATIVE rather than DEPRECATED for two reasons. First,
          the 2022 authors themselves state the caveat that fibroblast or blood mtDNA copy number is not
          representative of affected tissue and that they had no muscle biopsy. Second, and more substantively,
          the 2021 enzymology paper showed that in the same patient fibroblasts the loss of TMPK activity
          is COMPLETE in mitochondria and only near-complete in cytosol, which is a positive biochemical
          reason to keep a mitochondrial arm on the table.
        notes: 'This is the single most consequential disagreement in the DTYMK literature, and it matters
          for curation as well as for biology: the 2019 paper''s title calls DTYMK a mitochondrial DNA
          depletion syndrome gene, so any curator reading titles alone would classify this disease into
          the wrong mechanism class. Conversely, a curator reading only the 2022 paper would discard the
          mitochondrial arm entirely and miss that DTYMK is a listed eligible genotype in an active deoxynucleoside
          trial for mitochondrial depletion disorders (clinicaltrials:NCT04802707, curated under treatments).
          The evidence list below deliberately carries the original claim, the original authors'' own
          hedge, the disconfirming experiment with supports REFUTE, and the compartment finding that partially
          rehabilitates it, so the disagreement is visible in the data rather than resolved silently in
          prose.

          An earlier revision of this entry set this hypothesis to DEPRECATED. That was wrong, and specifically
          it was wrong because it had been written before PMID:34926941 was read. The status is corrected
          to ALTERNATIVE here.'
      selected_evidence:
        snippet: DTYMK may be the missing link in the mitochondrial nucleotide salvage pathway but further
          characterization and additional evidence would be needed.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
