          only two families whose genotypes are individually published (PMID:34918187, PMID:40696808)
          carry p.Pro81Leu and p.Asp128Asn. It is therefore likely that p.Ala99Thr and the frameshift
          belong to the two siblings of PMID:31271740, whose specific variants are not named in the cached
          abstract, but that is an inference from elimination and is recorded here as such rather than
