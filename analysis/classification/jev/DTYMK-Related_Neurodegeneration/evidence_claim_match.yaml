  cce0da100ea801a41428076039fbef0688ad57a6a44d77c712aa82ba1e642158:
    claim:
      about:
        disease:
          name: DTYMK-Related Neurodegeneration
          disease_term:
            preferred_term: childhood-onset neurodegeneration with progressive microcephaly
            term:
              id: MONDO:0859241
              label: neurodegeneration, childhood-onset, with progressive microcephaly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dtymk-viability-paradox
        prompt: How is any cell viable when the only route to dTTP is blocked?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: 'dTMPK sits downstream of the convergence of the de novo and salvage pathways, so a
          complete block should abolish dTTP entirely and be incompatible with life. Affected individuals
          nonetheless survived 18 and 32 months; patient fibroblasts still cycle and in one study proliferated
          at a normal rate; and measured dTTP levels in both patient fibroblasts and mutant zebrafish
          were normal. The primary authors call this remarkable without explaining it and state that a
          compensatory pathway remains to be proven. Two candidate explanations have been advanced and
          one has been excluded. CMPK2 (UMP-CMP kinase 2, sometimes called TMPK2) was considered and rejected
          by PMID:34918187 on the grounds that it cannot use dTMP as a substrate. An unidentified TMPK-like
          activity remains open: PMID:35346037 reports a TMPK-like enzyme in zebrafish at later developmental
          stages with similar biochemical properties to Dtymk but not recognised by the Dtymk antibody,
          and PMID:34926941 independently infers a hitherto unknown compensatory TMPK-like enzyme from
          the normal proliferation of patient fibroblasts. Whether a human counterpart exists is unknown.
          Resolving this would also explain why the brain is selectively vulnerable, since a compensating
          enzyme with restricted expression is one of the two hypotheses PMID:34918187 offers for the
          tissue selectivity.'
        proposed_experiments:
        - experiment_id: exp_dtymk_identify_compensatory_tmpk
          name: Biochemical identification of the compensatory TMPK-like activity
          description: Identify the postulated compensatory TMPK-like activity in human tissue, and test
            whether its expression is low in forebrain-derived structures. A compensating enzyme with
            restricted expression is one of the two explanations PMID:34918187 offers for why the brain
            is selectively vulnerable, so this experiment would resolve the compensation gap and the tissue-selectivity
            question at once.
        - experiment_id: exp_dtymk_residual_activity_ultrasensitive
          name: Ultrasensitive residual-activity assay of the patient alleles
          description: Determine the residual catalytic activity of recombinant p.Pro81Leu and p.Asp128Asn
            dTMPK with an assay sensitive well below the 0.62 pmol/min/mg floor reported in patient fibroblasts,
            to test whether survival is explained by sub-detection-threshold residual activity rather
            than by a separate compensating enzyme.
      selected_evidence:
        snippet: surprisingly the proliferation rate of the patient-derived fibroblasts was normal, suggesting
          the existence of an alternative and hitherto unknown compensatory TMPK-like enzyme for dTTP
          synthesis
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
