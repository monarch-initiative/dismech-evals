      assertion_type: DifferentialDiagnosis
      assertion:
        name: Angelman syndrome
        disease_term:
          preferred_term: Angelman syndrome
          term:
            id: MONDO:0007113
            label: Angelman syndrome
        description: Shares severe intellectual disability, absent or minimal speech, microcephaly, febrile
          and afebrile seizures, and a broad-based ataxic or hypertonic gait, leading several DYRK1A probands
          to be evaluated for Angelman syndrome prior to exome sequencing.
        distinguishing_features:
        - Characteristic DYRK1A facial gestalt (deep-set eyes, bitemporal narrowing, prominent nasal root,
          thin upper vermilion, microretrognathia) rather than Angelman facies.
        - Congenital microcephaly and intrauterine growth restriction are typical of DYRK1A syndrome,
          whereas microcephaly in Angelman syndrome usually develops postnatally.
        - Heterozygous pathogenic variant in DYRK1A at 21q22.13 rather than 15q11-q13 maternal deletion,
          UBE3A mutation, or imprinting defect.
      selected_evidence:
        snippet: Our study demonstrates that haploinsufficiency of DYRK1A results in a new recognizable
          syndrome, which should be considered in individuals with Angelman syndrome-like features and
          distinct facial features.
        supports: SUPPORT
