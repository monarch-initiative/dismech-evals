      assertion_type: Discussion
      assertion:
        discussion_id: disc_dyrk1a_lithium_therapeutic_lead
        prompt: Can lithium or downstream-substrate-targeting strategies (e.g., enhancing residual DYRK1A
          function) be translated into disease-modifying therapy for human DYRK1A syndrome?
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        rationale: 'Because the syndrome is a haploinsufficiency disorder, DYRK1A-inhibitor strategies
          developed for Down syndrome (gene-dosage increase) are mechanistically inappropriate. Instead,
          preclinical work suggests restoring DYRK1A function or compensating downstream circuitry: early
          lithium rescued multiple phenotypes in a patient-mutation knock-in mouse, and enhancing a DYRK1A-dependent
          inhibitory circuit reversed social-recognition deficits in Dyrk1a+/- mice. Neither approach
          has been tested clinically in MRD7.'
        proposed_experiments:
        - experiment_id: exp_dyrk1a_lithium_translation
          name: Cross-model validation and biomarker-guided trial design for DYRK1A restorative therapy
          description: Test whether early lithium or DYRK1A-substrate-targeting interventions improve
            neurodevelopmental outcomes in additional DYRK1A patient-mutation models, and assess the feasibility
            and safety of a biomarker-guided clinical study in MRD7.
        posed_date: '2026-06-04T00:00:00Z'
      selected_evidence:
        snippet: "targeting DYRK1A synaptic and circuit \nsubstrates as \"enhancers of DYRK1A function\"\
          \ harbors the potential to reverse \nDyrk1a haploinsufficiency-associated circuit and cognition\
          \ impairments."
        supports: SUPPORT
