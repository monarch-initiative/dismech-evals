        - Congenital microcephaly, intrauterine and postnatal growth retardation, febrile seizures/epilepsy,
          neonatal feeding difficulties, distinct facial dysmorphism, and ocular anomalies distinguish
          DYRK1A syndrome from nonsyndromic ASD.
        - Significantly lower nonverbal and verbal IQ and adaptive functioning compared with idiopathic
          ASD cohorts.
      selected_evidence:
        snippet: Results confirm a core clinical phenotype for DYRK1A disruptions, with a combination
          of features that is distinct from idiopathic ASD.
        supports: SUPPORT
