            term:
              id: MONDO:0013578
              label: DYRK1A-related intellectual disability syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Cortical Neurogenesis and Cell-Cycle Control
        description: 'DYRK1A regulates the cell cycle of cortical neural stem cells (radial glia) by controlling
          nuclear Cyclin D1 levels and G1-phase length, thereby balancing proliferative versus neurogenic
          divisions. Altered DYRK1A dosage disrupts the coupling of cell-cycle regulation and neuron production,
          producing a deficit in cortical projection neurons that underlies microcephaly and impaired
          corticogenesis. This dosage-sensitive control of neurogenesis explains how both DYRK1A loss-of-function
          (syndrome) and gain (Down syndrome) converge on cortical neuronal deficits.

          '
        cell_types:
        - preferred_term: Neural Stem Cell (Radial Glia)
          term:
            id: CL:0000047
            label: neural stem cell
        - preferred_term: Cortical Projection Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Neurogenesis
          term:
            id: GO:0022008
            label: neurogenesis
          modifier: DECREASED
        - preferred_term: Cerebral Cortex Development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
        - preferred_term: Cell Cycle G1 Phase Regulation
          term:
            id: GO:0007049
            label: cell cycle
          modifier: ABNORMAL
        - preferred_term: Neural Precursor Cell Proliferation
          term:
            id: GO:0061351
            label: neural precursor cell proliferation
          modifier: DECREASED
      selected_evidence:
        snippet: "the human DYRK1A \nkinase on chromosome 21 tightly regulates the nuclear levels of Cyclin\
          \ D1 in \nembryonic cortical stem (radial glia) cells"
        supports: SUPPORT
