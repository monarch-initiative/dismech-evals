        disease:
          name: DYRK1A-related intellectual disability syndrome
          disease_term:
            preferred_term: DYRK1A-related intellectual disability syndrome
            term:
              id: MONDO:0013578
              label: DYRK1A-related intellectual disability syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neocortical Circuit Development and E/I Imbalance
        description: 'Beyond its early role in neural precursor proliferation, DYRK1A regulates the assembly
          of neocortical and hippocampal circuits. Reduced DYRK1A dosage alters the proportions of excitatory
          and inhibitory neurons and synapses, producing an excitatory/inhibitory (E/I) imbalance. At
          the circuit level, DYRK1A controls a hippocampal mossy fiber to parvalbumin interneuron feed-forward
          inhibition pathway required for social recognition. This circuit-level dysfunction provides
          a mechanistic link between DYRK1A haploinsufficiency and the autistic behavior, social-cognition
          deficits, and seizure susceptibility of the syndrome, acting downstream of and in parallel to
          the early neurogenic defect.

          '
        cell_types:
        - preferred_term: Cortical Projection Neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Parvalbumin-Positive Inhibitory Interneuron
          term:
            id: CL:0000099
            label: interneuron
        biological_processes:
        - preferred_term: Cerebral Cortex Development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
        - preferred_term: Synaptic Signaling
          term:
            id: GO:0099536
            label: synaptic signaling
          modifier: ABNORMAL
      selected_evidence:
        snippet: "we identify a social \nexperience-sensitive mechanism in hippocampal mossy fiber-parvalbumin\
          \ \ninterneuron (PV IN) synapses by which DYRK1A recruits feedforward inhibition of \nCA3 and\
          \ CA2 to promote social recognition."
        supports: SUPPORT
    origin:
