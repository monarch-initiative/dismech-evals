        description: 'Osteopoikilosis is caused by heterozygous loss-of-function mutations in LEMD3 (also
          called MAN1), which encodes an inner nuclear membrane protein. The C-terminal domain of LEMD3
          binds receptor-activated SMADs and antagonizes both BMP and TGF-beta/activin signaling pathways.
          Loss of this antagonism leads to excessive SMAD-mediated signaling, perturbing bone formation
          and remodeling and producing focal osteosclerotic lesions.

          '
