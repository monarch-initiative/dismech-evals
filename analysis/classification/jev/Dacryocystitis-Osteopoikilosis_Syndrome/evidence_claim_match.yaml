        context: []
      assertion_type: Diagnosis
      assertion:
        name: Radiographic Diagnosis and Differential
        description: Plain radiographs are the primary modality for diagnosing osteopoikilosis, revealing
          the characteristic multiple, small, well-defined, symmetric periarticular sclerotic foci. A
          clinically important pitfall is confusion with osteoblastic bone metastases; bone scintigraphy
          is normal in OPK (unlike metastatic disease) and is the key discriminating investigation. Diagnosis
          is often incidental. When multiple symmetric sclerotic foci are identified, OPK should be included
          in the differential before alarming the patient with a cancer diagnosis.
        diagnosis_term:
          preferred_term: radiograph imaging procedure
          term:
            id: NCIT:C38101
            label: X-Ray Imaging
      selected_evidence:
        snippet: Bone scintigraphy is normal and useful for differential diagnosis.
        supports: SUPPORT
