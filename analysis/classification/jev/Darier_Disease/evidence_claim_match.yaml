        name: ATP2A2 Haploinsufficiency and Loss of SERCA2 Pump Activity
        conforms_to: desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade
        biological_scale: MOLECULAR
        description: A heterozygous loss-of-function variant in ATP2A2 halves the functional dose of SERCA2,
          the ATP-driven pump that moves cytosolic calcium into the sarco/endoplasmic reticulum. The gene
          is highly expressed in keratinocytes, and the resulting reduction in pump capacity is the proximal
          lesion of the disease.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        molecular_functions:
        - preferred_term: P-type calcium transporter activity
          term:
            id: GO:0005388
            label: P-type calcium transporter activity
          modifier: DECREASED
        locations:
        - preferred_term: skin
          term:
            id: UBERON:0002097
            label: skin of body
        genetic_context:
          gene:
            preferred_term: ATP2A2
            term:
              id: hgnc:812
              label: ATP2A2
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous ATP2A2 alleles, the majority premature-termination alleles. Recorded
            as LOSS_OF_FUNCTION (haploinsufficiency of SERCA2).
      selected_evidence:
        snippet: The majority of the mutations (54%; 13/24) led to a premature termination codon which
          further supports the proposal that haploin-sufficiency is a common molecular mechanism for DD.
        supports: SUPPORT
