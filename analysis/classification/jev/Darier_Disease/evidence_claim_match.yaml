      assertion_type: Pathophysiology
      assertion:
        name: Disturbed Endoplasmic Reticulum Calcium Signalling in Keratinocytes
        conforms_to: desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament
          Anchorage
        biological_scale: CELLULAR
        description: Loss of SERCA2 capacity disturbs the intracellular calcium signalling that keratinocyte
          adhesion and differentiation depend on. Because desmosomal proteins require calcium-dependent
          post-translational processing and trafficking through the ER and Golgi, the downstream failure
          is one of desmosome assembly rather than of any desmosomal protein itself - which is why Darier
          disease is a desmosomal disease with no primary desmosomal gene defect.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: intracellular calcium ion homeostasis
          term:
            id: GO:0006874
            label: intracellular calcium ion homeostasis
          modifier: ABNORMAL
        - preferred_term: desmosome organization
          term:
            id: GO:0002934
            label: desmosome organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: desmosome
          term:
            id: GO:0030057
            label: desmosome
      selected_evidence:
        snippet: Our results demonstrate that mutations in ATP2A2 cause DD and disclose a role for this
          pump in a Ca(2+)-signalling pathway regulating cell-to-cell adhesion and differentiation of
          the epidermis.
        supports: SUPPORT
    origin:
