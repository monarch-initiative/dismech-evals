        context: []
      assertion_type: Subtype
      assertion:
        name: WAC point mutation
        display_name: DeSanto-Shinawi syndrome due to WAC point mutation
        description: The form caused by a heterozygous intragenic WAC sequence variant — in reported series
          most often de novo nonsense, frameshift, or splice-site changes predicted to cause loss of function,
          alongside occasional missense variants. MONDO and Orphanet name this branch "point mutation"
          to contrast it with the contiguous-gene deletion form; the label should be read as "intragenic
          sequence variant" rather than as a restriction to single nucleotide substitutions. The published
          pathophysiology and phenotype of this entry are drawn almost entirely from cohorts of this kind.
        subtype_term:
          preferred_term: DeSanto-Shinawi syndrome due to WAC point mutation
          term:
            id: MONDO:0014741
            label: DeSanto-Shinawi syndrome due to WAC point mutation
        genes:
        - preferred_term: WAC
          term:
            id: hgnc:17327
            label: WAC
      selected_evidence:
        snippet: Five heterozygous de novo WAC mutations were identified in six patients. Three of the
          mutations were nonsense, and two were frameshift; all are predicted to cause loss of function
          either through nonsense-mediated mRNA decay or protein truncation.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
