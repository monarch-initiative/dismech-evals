          the general vision-abnormality term rather than narrowed. Note the intragenic-variant series
          separately reported eye abnormalities in five of six patients, but under different wording and
          ascertainment, so the two are not pooled here.
        phenotype_term:
          preferred_term: Various visual impairments
          term:
            id: HP:0000504
            label: Abnormality of vision
      selected_evidence:
        snippet: All patients also displayed various visual impairments and six out of seven patients
