              label: DeSanto-Shinawi syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: 10p11.21p12.31 microdeletion
        display_name: DeSanto-Shinawi syndrome due to 10p11.21p12.31 microdeletion
        description: The form caused by an interstitial deletion of 10p spanning WAC, first delineated
          as the 10p12p11 contiguous gene deletion syndrome. Reported deletions range from about 1 Mb
          to over 10 Mb, so genes other than WAC are lost in most patients and the phenotype is not necessarily
          reducible to WAC dosage alone; the smallest region of overlap nonetheless contains WAC, and
          the intragenic-variant cohorts recapitulate the core neurodevelopmental and craniofacial features.
          Cardiac malformation was reported in six of seven patients in the defining deletion series,
          a frequency not established for the intragenic form; it is recorded in this entry's phenotype
          section scoped to this subtype only.
        subtype_term:
          preferred_term: DeSanto-Shinawi syndrome due to 10p11.21p12.31 microdeletion
          term:
            id: MONDO:0017283
            label: DeSanto-Shinawi Syndrome due to 10p11.21p12.31 microdeletion
        genes:
        - preferred_term: WAC
          term:
            id: hgnc:17327
            label: WAC
      selected_evidence:
        snippet: Here we report the molecular karyotyping and phenotypic description of six new unrelated
          patients with partially overlapping microdeletions at 10p12.31p11.21 ranging from 1.0 to 10.6
          Mb.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
