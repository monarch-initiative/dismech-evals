            display_name: DeSanto-Shinawi syndrome due to 10p11.21p12.31 microdeletion
            description: The form caused by an interstitial deletion of 10p spanning WAC, first delineated
              as the 10p12p11 contiguous gene deletion syndrome. Reported deletions range from about 1
              Mb to over 10 Mb, so genes other than WAC are lost in most patients and the phenotype is
              not necessarily reducible to WAC dosage alone; the smallest region of overlap nonetheless
              contains WAC, and the intragenic-variant cohorts recapitulate the core neurodevelopmental
              and craniofacial features. Cardiac malformation was reported in six of seven patients in
              the defining deletion series, a frequency not established for the intragenic form; it is
              recorded in this entry's phenotype section scoped to this subtype only.
            subtype_term:
              preferred_term: DeSanto-Shinawi syndrome due to 10p11.21p12.31 microdeletion
              term:
