        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Bioenergetic Failure
        biological_scale: CELLULAR
        description: A respiratory deficit that is selective for neurons. hTim8a is required for complex
          IV assembly in neuronal cells specifically, through a transient interaction with the copper
          chaperone COX17, and the resulting oxidative stress shifts apoptotic regulators so that cells
          are primed for death. Patient iPSC-derived neurons show reduced complex IV level and activity,
          reduced ATP, and increased reactive oxygen species, with CHCHD2 downregulated as a downstream
          effector. This is the arm of the mechanism that explains why a ubiquitously expressed chaperone
          produces a disease of neurons, and notably it does not require the contested TIM23 step.
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
      selected_evidence:
        snippet: We show that hTim8a is required for the assembly of Complex IV in neurons, which is mediated
          through a transient interaction with Complex IV assembly factors, in particular the copper chaperone
          COX17.
        supports: SUPPORT
    origin:
