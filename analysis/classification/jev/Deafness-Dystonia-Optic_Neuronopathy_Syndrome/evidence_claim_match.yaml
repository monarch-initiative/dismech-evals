        name: Intragenic TIMM8A
        display_name: Intragenic TIMM8A variant (isolated DDON syndrome)
        classification: molecular
        description: Point mutations, frameshifts, and small indels confined to TIMM8A, producing DDON
          syndrome without immunodeficiency. Reported alleles include the structurally characterized C66W
          missense change, the initiation-codon variant p.Met1Leu, and frameshifts such as p.His21Argfs*11
          and p.Gln75fs95*.
      selected_evidence:
