      assertion_type: Treatment
      assertion:
        name: Cochlear Device Implantation
        description: 'Cochlear implantation is attempted and has been performed in DDON, but benefit is
          variable and generally less than in hair-cell sensorineural deafness. The reason is specific
          and follows from the pathograph: an implant works by bypassing the hair cells and electrically
          stimulating the spiral ganglion neurons directly, and in this disease those neurons are the
          population that has degenerated - 8.5% of the age-normal count remained in the case with a cytocochleogram,
          in an ear whose organ of Corti and hair cells were preserved. The device''s target is what the
          disease destroys, which is the opposite of the usual indication.'
