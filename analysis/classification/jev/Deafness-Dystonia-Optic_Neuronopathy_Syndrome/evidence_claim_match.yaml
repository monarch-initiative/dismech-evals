      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Morphology and Dynamics Disturbance
        biological_scale: CELLULAR
        description: 'Loss of DDP1 disturbs mitochondrial shape and the fusion-fission balance. The direction
          of the change is not consistent across systems and this entry does not force it into one: patient
          fibroblasts and DDP1-knockdown HeLa cells show elongated mitochondrial tubules, patient iPSC-derived
          neurons show fragmentation, and the mutant mouse hippocampus shows reduced mitochondrial size
          with upregulated Mtfp1/Mtp18, a positive regulator of fission. Cell type, species and whether
          the protein is knocked down or absent all differ between these results, so the shared claim
          is that dynamics are dysregulated, not that mitochondria are uniformly longer or shorter.'
        biological_processes:
        - preferred_term: mitochondrion organization
          modifier: DYSREGULATED
          term:
            id: GO:0007005
            label: mitochondrion organization
      selected_evidence:
        snippet: Patient fibroblasts exhibited elongation and/or increased fusion of mitochondria, consistent
          with prior reports.
