      assertion:
        name: Auditory Neuropathy Electrophysiologic Signature
        description: Preserved otoacoustic emissions with absent or abnormal auditory brainstem response
          and absent stapedial reflex, in a structurally normal inner ear, in a male with early-onset
          hearing loss. Because this pattern separates a neural from a hair-cell lesion, it is the practical
          entry point to the diagnosis and the reason TIMM8A belongs on auditory-neuropathy sequencing
          panels.
      selected_evidence:
        snippet: Furthermore, we found another two TIMM8A variations, the deletion c.133_135delGAG and
          a copy number variation (CNV) including the TIMM8A gene, in two independent case, when we performed
          NGS on an auditory neuropathy population.
        supports: SUPPORT
