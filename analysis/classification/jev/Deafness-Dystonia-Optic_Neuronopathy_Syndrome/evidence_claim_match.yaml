          — preserved otoacoustic emissions with absent or abnormal auditory brainstem response — reflecting
          spiral ganglion neuron loss rather than a cochlear hair-cell lesion. It is the earliest and
          most consistent manifestation and is near-universal in hemizygous males, but it is not obligate:
          a 2025 report describes a hemizygous adolescent with progressive dystonia and basal ganglia
          iron deposition and no hearing loss at all, so a normal audiogram does not exclude the diagnosis.'
        frequency: VERY_FREQUENT
