        display_name: Contiguous Xq22.1 deletion (with X-linked agammaglobulinemia when BTK is included)
        classification: molecular
        description: Deletions at Xq22.1 removing TIMM8A together with neighbouring genes. Where the deletion
          extends into BTK, which lies telomeric to TIMM8A, the patient additionally has X-linked agammaglobulinemia
          and needs immunoglobulin replacement. The immunodeficiency is a consequence of the deletion
          size, not of TIMM8A loss, so it is curated here and not as a pathophysiology node.
      selected_evidence:
        snippet: a contiguous gene deletion of Xq22.1 involving TIMM8A (~50% of affected males and females)
        supports: SUPPORT
