  726d9b5d7f243f9029c93dab2d90c90c3270d46ec35067d0b0cec0af81e38910:
    claim:
      about:
        disease:
          name: Deafness-Dystonia-Optic Neuronopathy Syndrome
          disease_term:
            preferred_term: deafness dystonia syndrome
            term:
              id: MONDO:0010578
              label: deafness dystonia syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Timm8a1 I23fs49X frameshift mouse
        species: Mouse
        genotype: Timm8a1 p.I23fs49X hemizygous (CRISPR/Cas9)
        publication: PMID:32820032
        description: A CRISPR/Cas9 knock-in mouse carrying a frameshift in the murine ortholog, generated
          alongside the characterization of a family carrying a novel hemizygous DDP1 variant.
        modeled_mechanisms:
        - target: Mitochondrial Morphology and Dynamics Disturbance
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Mutant mice show abnormal mitochondrial structure in several brain areas, quantified
            in hippocampus as reduced mitochondrial size with upregulated Mtfp1/Mtp18, alongside hearing
            impairment and cognitive deficit.
          limitations: 'The direction differs from the human cell result: mouse hippocampal mitochondria
            are smaller, whereas patient fibroblasts and knockdown HeLa cells show elongation. The node
            is scoped to dysregulated dynamics rather than a direction for this reason, but a reader should
            not take the mouse as evidence for the human direction. The mouse also shows the organelle
            change without frank hippocampal neuronal loss, so it models this node and not the degeneration
            downstream of it.'
          readouts:
          - name: Mitochondrial ultrastructure in brain
            target: Mitochondrial Morphology and Dynamics Disturbance
            direction: ALTERED
            interpretation: Electron-microscopic correlate of the mitochondrial arm of this node in the
              mouse.
          - name: Hippocampal mitochondrial size and Mtfp1/Mtp18 level
            target: Mitochondrial Morphology and Dynamics Disturbance
            direction: DECREASED
            interpretation: Mitochondrial size falls without frank neuronal loss, and the reduction tracks
              upregulation of the fission factor Mtfp1/Mtp18. In this model the organelle phenotype therefore
              precedes, rather than follows, neuronal death.
        - target: Impaired Intermembrane-Space Escort of Hydrophobic Precursors
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: MOLECULAR
          description: The mouse does not reproduce the TIM23 import defect that the human and yeast biochemistry
            places at the centre of the mechanism.
          limitations: 'Tim23 and Tom40 import and oxidative-phosphorylation biogenesis were all unaffected
            in the mutant mouse. This is the substantive negative result of the model: the animal has
            the disease-relevant hearing and cognitive phenotypes without the import lesion, so either
            the murine ortholog is functionally redundant for this step or the import defect is not the
            whole mechanism in vivo.'
      selected_evidence:
        snippet: The male mice with Timm8a1I23fs49X/y mutant exhibited less weight gain, hearing impairment
          and cognitive deficit.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
