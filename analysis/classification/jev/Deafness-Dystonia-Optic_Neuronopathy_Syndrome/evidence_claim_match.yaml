  9dd32cab7d1291b41c2a8f0076fdd65e8e2f292b1ee303923a1b4cc37a2412ff:
    claim:
      about:
        disease:
          name: Deafness-Dystonia-Optic Neuronopathy Syndrome
          disease_term:
            preferred_term: deafness dystonia syndrome
            term:
              id: MONDO:0010578
              label: deafness dystonia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TIMM8A Loss of Function
        biological_scale: MOLECULAR
        description: 'Hemizygous loss-of-function TIMM8A variants, or contiguous Xq22.1 deletions removing
          the gene, abolish or destabilize the deafness/dystonia peptide DDP1. The C66W missense change
          is the best-characterized example: it disrupts Zn2+ coordination by the conserved twin CX3C
          (Cys4) motif, so the protein is imported and sorted normally but is incorrectly folded.'
        molecular_functions:
        - preferred_term: zinc ion binding by the twin CX3C motif of DDP1 (the missense route to loss
            of function; frameshift, stop and whole-gene-deletion alleles leave no protein for this state
            to describe)
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0008270
            label: zinc ion binding
      selected_evidence:
        snippet: We now report small deletions in this candidate gene in the original DFN-1/MTS family,
          and in a family with deafness, dystonia and mental deficiency but not blindness. This gene,
          named DDP (deafness/ dystonia peptide), shows high levels of expression in fetal and adult brain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
