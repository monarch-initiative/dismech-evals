        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 4 (Other Non-Lymphoid Defects): row "GATA2
          deficiency GATA2 AD 137295", affected cells monocytes and peripheral dendritic cells, affected
          function multilineage cytopenias, associated features susceptibility to mycobacteria, HPV and
          histoplasmosis, alveolar proteinosis, MDS/AML/CMML and lymphedema.

          Scope: IUIS names the row generically as "GATA2 deficiency", whereas this entry is the Emberger
          presentation of that spectrum. Emberger is squarely inside the row — lymphedema is listed by
          name in the row''s own associated-features cell — but it is one presentation among several.
          MonoMAC syndrome / DCML deficiency (MONDO:0013607) is the other main presentation and is not
          yet curated; when it is, it will share this same Table 5 row rather than take a different one.
          iuis_category is single-valued and cannot be scoped to a subtype, so that restriction is recorded
          here in prose.'
      selected_evidence:
        snippet: GATA2 deficiency GATA2 AD 137295
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
      evidence_path: /classifications/iuis_category/evidence/0
