            term:
              id: MONDO:0060713
              label: deafness, congenital heart defects, and posterior embryotoxon
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Alagille syndrome
        disease_term:
          preferred_term: Alagille syndrome
          term:
            id: MONDO:0007318
            label: Alagille syndrome
        description: 'The single most important differential, and an allelic disorder: Alagille syndrome
          is caused by heterozygous variants in the same gene (JAG1, and less often NOTCH2), and shares
          two of this entity''s three cardinal features (congenital heart defects with pulmonary-artery
          predilection, and posterior embryotoxon). This entity is curated separately from kb/disorders/Alagille_syndrome.yaml,
          and the two must not be merged on the strength of shared gene identity alone.'
        distinguishing_features:
        - 'Present in Alagille syndrome and absent in the index kindred of this entity: cholestasis with
          paucity of interlobular bile ducts on liver biopsy (the defining Alagille criterion), butterfly
          vertebrae, and the characteristic facies.'
        - 'Present here and NOT an Alagille diagnostic criterion: highly penetrant mixed hearing loss
          with a mid-frequency configuration. Hearing loss does occur in Alagille syndrome, but as an
          associated finding rather than a cardinal criterion.'
        - 'Decisive statement from the index report: no individual in this kindred met diagnostic criteria
          for any previously described clinical syndrome.'
        - The dissociation is NOT explained by a milder molecular lesion. JAG1 p.Cys234Tyr is completely
          haploinsufficient, being EndoH sensitive, absent from the cell surface, and unable to activate
          Notch, so the difference from Alagille syndrome is neither gene, nor pathway, nor allele severity.
          The organ selectivity is attributed to unidentified modifying factors and is recorded here as
          an open knowledge gap. The superficially attractive graded-dose account, in which the developing
          heart tolerates reduced JAG1 dose less well than the developing liver does, derives from the
          DIFFERENT and genuinely leaky p.Gly274Asp allele, and was specifically tested and ruled out
          for this one.
      selected_evidence:
        snippet: No individual in this family met diagnostic criteria for any previously described clinical
          syndrome.
        supports: SUPPORT
