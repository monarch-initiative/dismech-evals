            description: The disease-initiating lesion is a heterozygous germline JAG1 missense variant,
              p.Cys234Tyr, that replaces the first cysteine of the first epidermal-growth-factor(EGF)-like
              repeat of Jagged1. EGF-like repeats are small, disulfide-stapled modules whose fold depends
              on a fixed pattern of six cysteines; losing one of them leaves an unpaired partner and destabilises
              the module. Missense variants in JAG1 are non-randomly distributed and cluster in exactly
              these regions - the amino-terminal region, the DSL domain, and two clusters within the EGF
              repeats - which is the structural context in which this substitution should be read.
