      assertion_type: Pathophysiology
      assertion:
        name: Modifier-Dependent Organ Selectivity of JAG1 Haploinsufficiency
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'This node is the mechanistic hinge that separates this entity from Alagille syndrome,
          and it is deliberately curated as an unsolved step rather than an explanation. Every cell in
          a p.Cys234Tyr carrier has the same half-dose of functional Jagged1, yet the heart, inner ear,
          middle ear and anterior ocular segment malform while the intrahepatic biliary tree does not.
          The obvious candidate explanation - that the allele is hypomorphic and leaves enough ligand
          for the less demanding tissues - was proposed for the leaky p.Gly274Asp allele and then specifically
          ruled out for p.Cys234Tyr, which is functionally null and still spares the liver. What remains
          is that unidentified modifying factors, not residual ligand, determine the organ set. The clinical
          corollary is unchanged and important: the absence of cholestasis does not exclude a JAG1 disorder,
          and JAG1 variants are recovered from individuals presenting with only one or two of the Alagille
          organ systems.'
        biological_processes:
        - preferred_term: Notch signaling pathway
          term:
            id: GO:0007219
            label: Notch signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: What remains unknown is why these cases present with only a cardiac phenotype and not
          the full clinical features of AGS, particularly hepatic disease.
        supports: SUPPORT
