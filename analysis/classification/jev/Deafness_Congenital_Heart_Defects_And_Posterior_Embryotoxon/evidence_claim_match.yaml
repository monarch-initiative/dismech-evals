      assertion_type: Diagnosis
      assertion:
        name: Slit-lamp examination for posterior embryotoxon
        description: 'Posterior embryotoxon is an anteriorly displaced, prominent Schwalbe line and is
          visible only on slit-lamp examination, not on routine visual assessment. It is usually visually
          silent in itself, so its value here is almost entirely diagnostic, and it is the element of
          the triad most likely to be missed because nothing prompts the patient to report it. Intraocular
          pressure measurement belongs in the same visit: it is the associated anterior-segment dysgenesis
          and glaucoma, rather than the embryotoxon, that threatens vision.'
        diagnosis_term:
          preferred_term: ophthalmic examination with slit-lamp biomicroscopy
          term:
            id: NCIT:C20989
            label: Physical Examination
        markers: Schwalbe line position, iridocorneal angle, intraocular pressure
        results: Posterior embryotoxon, seen as an anteriorly displaced and prominent Schwalbe line.
      selected_evidence:
        snippet: Our findings revealed a unique phenotype with highly penetrant deafness, posterior embryotoxon,
          and congenital heart defects
        supports: SUPPORT
