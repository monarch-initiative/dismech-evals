      assertion_type: DifferentialDiagnosis
      assertion:
        name: Axenfeld-Rieger anomaly and syndrome spectrum
        description: 'Posterior embryotoxon is also the leading element of the Axenfeld-Rieger anomaly
          triad, so an individual with this entity who comes to attention through an ophthalmologist can
          be labelled Axenfeld-Rieger rather than referred for JAG1 testing. This is not hypothetical:
          a 2023 cohort of Axenfeld-Rieger cases left unsolved after PITX2 and FOXC1 testing found JAG1
          variants in three separate families, one of whom - referred with Axenfeld-Rieger anomaly, bilateral
          sensorineural hearing loss and dysmorphism - is phenotypically close to this entity. The practical
          consequence is that JAG1 belongs on the differential of anterior-segment dysgenesis with syndromic
          features, particularly when hearing loss or a congenital heart defect accompanies it.'
        distinguishing_features:
        - Axenfeld-Rieger anomaly requires iridocorneal adhesions and iris anomalies (hypoplasia, corectopia,
          polycoria) in addition to posterior embryotoxon; the index kindred of this entity was reported
          with posterior embryotoxon alone, without the rest of the triad.
        - Classic Axenfeld-Rieger syndrome is caused by PITX2 (type 1, with dental and umbilical features)
          or FOXC1 (type 3), which together explain roughly 70% of cases; this entity is caused by JAG1.
          Note that FOXC1-associated disease can itself include hearing loss and congenital heart defects,
          so the clinical overlap with this entity is genuine and gene testing, not phenotype, settles
          it.
        - Glaucoma is a major concern in Axenfeld-Rieger anomaly and was not reported in the index kindred
          here; conversely the mid-frequency mixed hearing loss characteristic of this entity is not an
          Axenfeld-Rieger feature.
      selected_evidence:
        snippet: The identification of JAG1 variants, linked with Alagille syndrome, in three separate
          families with a clinical diagnosis of ARA/ARS highlights the overlapping features and high variability
          of these two phenotypes.
        supports: SUPPORT
