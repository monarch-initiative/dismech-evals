  ac44ebc3b35f08f161b6590ec8f0c8c16097ee5f0b3b5d101bbbb26b9fd0c3c4:
    claim:
      about:
        disease:
          name: Deafness, Congenital Heart Defects, and Posterior Embryotoxon
          disease_term:
            preferred_term: deafness, congenital heart defects, and posterior embryotoxon
            term:
              id: MONDO:0060713
              label: deafness, congenital heart defects, and posterior embryotoxon
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dche_organ_selectivity_modifiers
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: If JAG1 p.Cys234Tyr is completely haploinsufficient, what determines that the heart, ears
          and anterior segment are affected while the liver is spared?
        attaches_to:
        - pathophysiology#Modifier-Dependent Organ Selectivity of JAG1 Haploinsufficiency
        rationale: 'This is the central unsolved question of the entry, and it became sharper rather than
          softer once p.Cys234Tyr was assayed. The intuitive answer - that a partially functional allele
          leaves enough ligand for the tissues with the lowest requirement - was proposed on the strength
          of the hypomorphic p.Gly274Asp allele, and then specifically defeated: p.Cys234Tyr is EndoH-sensitive,
          absent from the cell surface, and unable to activate Notch, yet its carriers still have normal
          liver function. A functionally null allele and a leaky allele therefore produce the same liver-sparing
          pattern, which means residual ligand dose cannot be what distinguishes the spared organ from
          the affected ones. The assaying authors attribute the pattern to unidentified modifying factors.
          Nothing currently narrows what those are: candidate classes include trans-acting variation at
          other Notch-pathway loci, tissue-specific differences in the compensating ligand repertoire
          (JAG2, DLL1/4) or in receptor availability (NOTCH1 vs NOTCH2), and differences in how much developmental
          time each organ has to recover from a signalling deficit. Until that is resolved, the organ-selectivity
          node is curated HYPOTHETICAL and this entry does not claim a dose-threshold mechanism.'
        proposed_experiments:
        - experiment_id: dche_modifier_genome_analysis
          name: Genome-wide modifier search in discordant JAG1 carriers
          description: Whole-genome sequencing of JAG1 carriers concordant for genotype but discordant
            for hepatic involvement, within and across families, testing for trans-acting modifier variation
            at Notch-pathway and other loci. This is the study design the assaying authors themselves
            proposed.
        - experiment_id: dche_tissue_ligand_receptor_repertoire
          name: Comparative ligand and receptor repertoire across affected and spared organs
          description: Single-cell profiling of Notch ligand and receptor expression in developing bile
            duct, cardiac outflow tract, cochlea and periocular mesenchyme, to test whether the spared
            tissue is the one with the greatest redundancy from other ligands.
        - experiment_id: dche_allelic_series_organ_thresholds
          name: Allelic series comparison of organ-level thresholds
          description: Direct comparison of null, hypomorphic and knock-in p.Cys234Tyr alleles for bile-duct
            number, outflow-tract anatomy and auditory thresholds, to establish whether any organ phenotype
            tracks residual ligand dose at all.
      selected_evidence:
        snippet: the p.C234Y and p.P810L mutations appear to be completely haploinsufficient
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20437614
      reference_title: Jagged1 (JAG1) mutations in patients with tetralogy of Fallot or pulmonic stenosis.
