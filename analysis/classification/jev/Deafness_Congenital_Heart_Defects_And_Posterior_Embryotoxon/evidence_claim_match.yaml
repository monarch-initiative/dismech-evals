  448ec992feb54692adaa3784387b3418eb3cb1ab7ffd55c88a6d21ff2a1cd0c7:
    claim:
      about:
        disease:
          name: Deafness, Congenital Heart Defects, and Posterior Embryotoxon
          disease_term:
            preferred_term: deafness, congenital heart defects, and posterior embryotoxon
            term:
              id: MONDO:0060713
              label: deafness, congenital heart defects, and posterior embryotoxon
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dche_entity_status
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is DCHE a discrete disorder, or the liver-sparing tail of the JAG1 (Alagille) phenotypic
          continuum?
        attaches_to:
        - pathophysiology#Modifier-Dependent Organ Selectivity of JAG1 Haploinsufficiency
        rationale: 'Three facts pull in different directions and none of them settles the question. In
          favour of a discrete entity: OMIM and MONDO both catalogue it separately; the index report states
          explicitly that no affected individual met criteria for any previously described syndrome; and
          highly penetrant, mid-frequency mixed hearing loss is not a cardinal Alagille criterion. In
          favour of a continuum: the gene, the pathway, and two of the three cardinal features are shared
          with Alagille syndrome; JAG1 variants are routinely recovered from individuals expressing only
          one or two Alagille organ systems; and the mechanistic account offered here, complete haploinsufficiency
          whose organ selectivity is set by unidentified modifiers, is a continuum mechanism rather than
          a separate-disorder mechanism, since the very same class of null lesion underlies classic Alagille
          syndrome. The evidence base is also thin enough that the question may not be answerable: one
          kindred, one allele. dismech curates it as a separate entry because MONDO does and because the
          hearing phenotype is distinctive, while recording the continuum reading here rather than suppressing
          it.'
        proposed_experiments:
        - experiment_id: dche_jag1_cohort_audiology_slitlamp
          name: Audiological and slit-lamp phenotyping of a JAG1 cohort
          description: Systematic audiological and slit-lamp phenotyping of a molecularly defined JAG1
            cohort, to establish whether mid-frequency mixed hearing loss segregates with a particular
            allele class or is a general, under-ascertained feature of JAG1 disease.
        - experiment_id: dche_additional_c234y_kindreds
          name: Ascertainment of additional EGF-repeat cysteine kindreds
          description: Identification of additional unrelated p.Cys234Tyr (or other EGF-repeat-1 cysteine)
            kindreds, to test whether the liver-sparing triad is allele-specific or family-specific.
      selected_evidence:
        snippet: No individual in this family met diagnostic criteria for any previously described clinical
          syndrome.
        supports: SUPPORT
