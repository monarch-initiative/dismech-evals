              label: deafness, congenital heart defects, and posterior embryotoxon
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dche_model_organism_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the available Jag1 mouse models, none of which carries p.Cys234Tyr, faithfully represent
          the human DCHE mechanism?
        attaches_to:
        - pathophysiology#Impaired Notch-Dependent Inner Ear Sensory Patterning
        - pathophysiology#Impaired Jagged1-Notch2 Patterning of the Middle Ear Ossicles
        rationale: 'All three mouse models curated here are informative for Jagged1-dependent ear development,
          and none of them models this disorder. Htu is a different missense allele; Jag1 Ndr/Ndr is a
          homozygous hypomorph; the middle-ear work uses a heterozygous null. The heterozygous null is
          in fact the closest match on dose, since p.Cys234Tyr was subsequently shown to be functionally
          null rather than leaky; Htu is a different missense allele of unknown residual activity, and
          the homozygous hypomorph sits at a lower dose than any human carrier. Additionally, no mouse
          model reproduces the human triad: the ear models do not address the cardiac or ocular arms,
          and the cardiac model does not address hearing. Most importantly, no mouse model addresses the
          feature that actually defines this disorder against Alagille syndrome - whether bile-duct development
          is spared - so the models can corroborate the ear and heart arms while being silent on the entity''s
          defining negative.'
        proposed_experiments:
        - experiment_id: c234y_knockin_mouse_full_triad_phenotyping
          name: Jag1 p.Cys234Tyr knock-in mouse with full triad phenotyping
          description: A Jag1 p.Cys234Tyr knock-in mouse, phenotyped for auditory thresholds and configuration,
            vestibular function, outflow-tract anatomy, anterior-segment morphology, and bile-duct number
            - the last being the specific test of the liver-sparing claim.
        - experiment_id: jag1_allelic_series_organ_dose_thresholds
          name: Allelic series comparison of ear, heart and liver phenotypes
          description: Allelic series comparison (null, hypomorphic missense, p.Cys234Tyr knock-in) of
            ear, heart and liver phenotypes, to establish whether any organ phenotype tracks residual
            ligand dose at all.
      selected_evidence:
        snippet: a dominant mouse mutant headturner (Htu) contains a missense mutation in the Jag1 gene
          and displays missing posterior and sometimes anterior ampullae, structures that house the sensory
          cristae
        supports: SUPPORT
