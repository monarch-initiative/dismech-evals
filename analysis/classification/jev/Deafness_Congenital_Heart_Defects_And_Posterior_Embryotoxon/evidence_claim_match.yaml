  a33286a3477beb185de4466f4c04a8f8fa725f98646514d2004f54f08d0018c9:
    claim:
      about:
        disease:
          name: Deafness, Congenital Heart Defects, and Posterior Embryotoxon
          disease_term:
            preferred_term: deafness, congenital heart defects, and posterior embryotoxon
            term:
              id: MONDO:0060713
              label: deafness, congenital heart defects, and posterior embryotoxon
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: JAG1 First EGF-Like Repeat Cysteine Substitution
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: The disease-initiating lesion is a heterozygous germline JAG1 missense variant, p.Cys234Tyr,
          that replaces the first cysteine of the first epidermal-growth-factor(EGF)-like repeat of Jagged1.
          EGF-like repeats are small, disulfide-stapled modules whose fold depends on a fixed pattern
          of six cysteines; losing one of them leaves an unpaired partner and destabilises the module.
          Missense variants in JAG1 are non-randomly distributed and cluster in exactly these regions
          - the amino-terminal region, the DSL domain, and two clusters within the EGF repeats - which
          is the structural context in which this substitution should be read.
        genetic_context:
          gene:
            preferred_term: JAG1
            term:
              id: hgnc:6188
              label: JAG1
          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Heterozygous germline JAG1 p.Cys234Tyr (C234Y). Classified LOSS_OF_FUNCTION on
            direct functional assay of this allele: the mutant protein is EndoH-sensitive, absent from
            the cell surface, and unable to activate Notch signalling, i.e. complete haploinsufficiency.
            No dominant-negative activity has been demonstrated for the JAG1 missense proteins assayed
            to date.'
        genes:
        - preferred_term: JAG1
          term:
            id: hgnc:6188
            label: JAG1
      selected_evidence:
        snippet: A candidate-gene approach was undertaken and culminated in the identification of a novel
          Jagged 1 (JAG1) missense mutation (C234Y) in the first cysteine of the first epidermal-growth-factor-like
          repeat domain of the protein.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
