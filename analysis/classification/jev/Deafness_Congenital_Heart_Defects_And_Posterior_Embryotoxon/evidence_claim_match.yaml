  6ccfbb29a4780b9fd98ae112ef5eddf89208b595d8134a6ecf9fb674d7e92d1f:
    claim:
      about:
        disease:
          name: Deafness, Congenital Heart Defects, and Posterior Embryotoxon
          disease_term:
            preferred_term: deafness, congenital heart defects, and posterior embryotoxon
            term:
              id: MONDO:0060713
              label: deafness, congenital heart defects, and posterior embryotoxon
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cell-Surface Jagged1 and Failure of Notch Trans-Activation
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'Jagged1 is a membrane-tethered ligand that must be displayed on the surface of the
          signal-sending cell to activate Notch receptors on the adjacent signal-receiving cell. Because
          the p.Cys234Tyr product never reaches the surface, it contributes nothing to trans-activation:
          in a CBF-dependent luciferase reporter it behaves like the known null allele p.Leu37Ser and
          cannot initiate Notch signalling at all. The carrier is therefore left with only the wild-type
          allele''s ligand on the cell surface - complete haploinsufficiency, not a graded hypomorphic
          reduction. This distinction is load-bearing for this entry, because a hypomorphic "leaky allele"
          model was the leading explanation for liver-sparing JAG1 phenotypes until this allele was assayed
          and found to be null.'
        biological_processes:
        - preferred_term: Notch signaling pathway
          term:
            id: GO:0007219
            label: Notch signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: JAG1 is a cell-surface ligand in the Notch signaling pathway.
