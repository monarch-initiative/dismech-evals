      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Second Heart Field and Cardiac Neural Crest Outflow Tract Development
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'Jagged1-Notch signalling in second heart field progenitors sustains Fgf8 and Bmp4
          expression, and through them coordinates two neighbouring tissues: migrating cardiac neural
          crest and the endothelial-to-mesenchymal transition that populates the outflow-tract endocardial
          cushions. Loss of that signal produces aortic arch artery and outflow-tract anomalies of exactly
          the right-sided class seen in this kindred - tetralogy of Fallot, ventricular septal defect,
          and peripheral pulmonic stenosis. In the peripheral pulmonary arteries the corresponding structural
          lesion in JAG1 disease is a tunica media depleted of smooth muscle cells and thickened by collagen
          and elastic fibres.'
        cell_types:
        - preferred_term: cardiac neural crest cell
          term:
            id: CL:0011012
            label: neural crest cell
        - preferred_term: pulmonary artery smooth muscle cell
          term:
            id: CL:0002591
            label: smooth muscle cell of the pulmonary artery
          modifier: DECREASED
        biological_processes:
        - preferred_term: outflow tract morphogenesis
          term:
            id: GO:0003151
            label: outflow tract morphogenesis
          modifier: ABNORMAL
        - preferred_term: neural crest cell migration involved in heart formation
          term:
            id: GO:0003147
            label: neural crest cell migration involved in heart formation
          modifier: DECREASED
        locations:
        - preferred_term: cardiac outflow tract
          term:
            id: UBERON:0004145
            label: outflow tract
      selected_evidence:
        snippet: faulty migration of cardiac neural crest cells and defective endothelial-mesenchymal
