      assertion_type: Diagnosis
      assertion:
        name: Formal audiometry with tympanometry
        description: The audiological assessment is the diagnostically decisive test in this entity, and
          a screen is not sufficient for two independent reasons. First, the loss is mid-frequency predominant,
          so a protocol weighted toward the high frequencies where most acquired and hereditary sensorineural
          loss appears can return a reassuring result. Second, the loss is mixed, so tympanometry and
          air-bone gap measurement are required to demonstrate the conductive component that reflects
          the underlying ossicular malformation. Auditory brainstem response and otoacoustic emissions
          extend the same assessment to infants and to the auditory-neuropathy pattern that Jag1 loss
          produces in the mouse cochlea.
        diagnosis_term:
          preferred_term: audiometric assessment with tympanometry
          term:
            id: NCIT:C38036
            label: Audiometric Test
        markers: Air and bone conduction thresholds, air-bone gap, tympanogram
        results: Mild-to-severe mixed hearing loss with a mid-frequency predominant configuration; the
          air-bone gap identifies the conductive component attributable to ossicular malformation.
      selected_evidence:
        snippet: Six of seven available affected patients manifested mild-to-severe combined hearing loss,
          predominantly affecting middle frequencies.
        supports: SUPPORT
