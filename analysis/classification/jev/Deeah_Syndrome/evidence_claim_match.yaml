  137a54a74d4374a9bac7a5fad14edf2e29f9e37904df3470a366c61347544662:
    claim:
      about:
        disease:
          name: Deeah Syndrome
          disease_term:
            preferred_term: DEEAH syndrome
            term:
              id: MONDO:0033561
              label: deeah syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Rab-GEF Vesicular Trafficking
        description: MADD is a DENN-domain guanine-nucleotide exchange factor that activates Rab3 and
          Rab27 (and additional Rab substrates such as Rab8B, Rab15, Rab26, Rab37). Loss of MADD impairs
          Rab-dependent membrane trafficking and regulated secretion/endocytosis; patient cells show a
          defect in endocytosis of epidermal growth factor. Because Rab3/Rab27-dependent regulated exocytosis
          underlies neurotransmitter, hormone, and other secretory-granule release, this trafficking defect
          propagates to secretory tissues. Different missense alleles impair Rab activation to different
          degrees, offering a mechanistic basis for the severity spectrum (see the P372L/L346P evidence
          below).
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: Rab-regulated vesicle-mediated transport
          term:
            id: GO:0016192
            label: vesicle-mediated transport
          modifier: DECREASED
        - preferred_term: regulated exocytosis of secretory granules
          term:
            id: GO:0045055
            label: regulated exocytosis
          modifier: DECREASED
        - preferred_term: receptor internalization (EGF endocytosis)
          term:
            id: GO:0031623
            label: receptor internalization
          modifier: DECREASED
      selected_evidence:
        snippet: DENN domain-bearing proteins have guanine nucleotide exchange factor activity toward
          Rab GTPases
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40812422
      reference_title: Neurodevelopmental disorder mutations in the exchange factor DENN/MADD disrupt
        activation of Rab GTPases.
      evidence_source: IN_VITRO
      explanation: Establishes MADD's DENN domain as a Rab-GEF, the activity lost in disease.
