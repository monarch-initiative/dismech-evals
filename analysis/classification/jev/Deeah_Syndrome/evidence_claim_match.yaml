      assertion_type: Genetic
      assertion:
        name: MADD biallelic loss-of-function
        association: Causative
        gene_term:
          preferred_term: MADD
          term:
            id: hgnc:6766
            label: MADD
        notes: Biallelic (homozygous or compound heterozygous) germline MADD variants - including nonsense,
          frameshift, splice-site, and missense alleles - cause the disorder. Patient fibroblasts show
          aberrant MADD transcripts and drastic reduction or loss of MADD protein, consistent with a loss-of-function
          mechanism. MADD encodes the MAP-kinase-activating death domain protein (also called DENN/MADD,
          IG20, Rab3-GEP), a DENN-domain guanine-nucleotide exchange factor for Rab3 and Rab27. This is
          the gene MADD, distinct from the metabolic disorder abbreviation MADD (multiple acyl-CoA dehydrogenase
          deficiency).
      selected_evidence:
        snippet: we collected 23 patients with 21 different pathogenic MADD variants identified by next-generation
          sequencing
        supports: SUPPORT
