        description: Because Rab3/Rab27-dependent regulated secretion underlies hormone and exocrine-gland
          output, MADD deficiency produces combined endocrine and exocrine dysfunction. Reported manifestations
          include dysregulated glucose homeostasis (neonatal hypoglycemia and hyperglycemia), hypopituitarism
          with growth hormone deficiency, and other endo- and exocrine gland involvement. MADD-deficient
          stem-cell-derived pancreatic islets show reduced beta-cell number, decreased insulin content,
          and an increased proinsulin-to-insulin ratio.
        biological_scale: ORGANISM
