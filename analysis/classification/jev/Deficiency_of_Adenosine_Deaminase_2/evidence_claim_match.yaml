  f14d2dd9609241e07855940051b00cbd75b2124986fb6b5d52cdff17cc6db4f6:
    claim:
      about:
        disease:
          name: Deficiency of Adenosine Deaminase 2
          disease_term:
            preferred_term: Deficiency of adenosine deaminase 2
            term:
              id: MONDO:0014306
              label: deficiency of adenosine deaminase 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Lysosomal DNA Editing and TLR9 Immune Sensing
        description: 'An emerging (2024) mechanistic model expands the classical extracellular adenosine
          paradigm. ADA2 localizes within lysosomes, where it acts as a deoxyadenosine deaminase on DNA,
          converting deoxyadenosine (dA) to deoxyinosine (dI). This dA-to-dI editing modulates lysosomal
          innate immune sensing of nucleic acids through Toll-like receptor 9 (TLR9), providing a cell-intrinsic
          mechanism that may drive the type I interferon and TNF pathway activation seen in DADA2 (a recognized
          type 1 interferonopathy of childhood).

          '
        biological_processes:
        - preferred_term: toll-like receptor 9 signaling pathway
          term:
            id: GO:0034162
            label: toll-like receptor 9 signaling pathway
          modifier: ABNORMAL
        - preferred_term: type I interferon production
          term:
            id: GO:0032606
            label: type I interferon production
          modifier: INCREASED
      selected_evidence:
        snippet: we demonstrate that dA-to-dI editing of DNA molecules and ADA2 regulate lysosomal immune
          sensing of nucleic acids (NAs) by modulating Toll-like receptor 9 (TLR9) activation.
        supports: SUPPORT
    origin:
