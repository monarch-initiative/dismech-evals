  ca74ede1a407f31feb07286544dbf907040e4caa6a80c518ac25808e6eed7876:
    claim:
      about:
        disease:
          name: Deficiency of Adenosine Deaminase 2
          disease_term:
            preferred_term: Deficiency of adenosine deaminase 2
            term:
              id: MONDO:0014306
              label: deficiency of adenosine deaminase 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ADA2 Loss of Function
        description: 'Biallelic loss-of-function variants in ADA2 (formerly CECR1) markedly reduce or
          abolish the extracellular adenosine deaminase 2 enzyme, the major plasma adenosine deaminase.
          Diagnosis is supported by low (<5% of normal) or undetectable ADA2 catalytic activity in plasma
          or serum. ADA2 is a secreted protein with both adenosine-deaminating activity and growth-factor
          activity, so loss of function impairs purine catabolism and ADA2-dependent signaling in the
          vasculature and myeloid compartment.

          '
        biological_processes:
        - preferred_term: adenosine catabolic process
          term:
            id: GO:0006154
            label: adenosine catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: Recessive loss-of-function mutations of ADA2, a growth factor that is the major extracellular
          adenosine deaminase, can cause polyarteritis nodosa vasculopathy with highly varied clinical
          expression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24552285
      reference_title: Mutant adenosine deaminase 2 in a polyarteritis nodosa vasculopathy.
