        name: Myeloid Inflammatory Dysregulation
        description: 'ADA2 deficiency skews monocyte/macrophage differentiation toward a proinflammatory
          state and disrupts neutrophil homeostasis. In a zebrafish model, knockdown of the ADA2 homologue
          caused intracranial hemorrhages and neutropenia, phenotypes rescued by wild-type but not mutant
