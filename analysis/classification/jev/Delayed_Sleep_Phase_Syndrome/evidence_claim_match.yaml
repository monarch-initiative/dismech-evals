      assertion_type: Pathophysiology
      assertion:
        name: Circadian Clock Gene Polymorphisms
        role: trigger
        biological_scale: MOLECULAR
        subtypes:
        - Circadian-Delayed DSWPD
        conforms_to: circadian_phase_misalignment#Intrinsic Core Clock Period or Phase Lesion
        description: Variants in core circadian clock genes alter the molecular oscillator that drives
          the sleep-wake cycle. The circadian clock operates via transcription-translation feedback loops
          involving CLOCK, BMAL1, PER, and CRY gene families. A gain-of-function mutation in CRY1 (c.1657+3A>C)
          creates a transcriptional inhibitor with enhanced affinity for Clock and Bmal1, lengthening
          the circadian period by approximately 30 minutes. Additional polymorphisms in PER3 and CLOCK
          contribute to DSPS susceptibility.
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Circadian Rhythm
          term:
            id: GO:0007623
            label: circadian rhythm
        genes:
        - preferred_term: CRY1
          term:
            id: hgnc:2384
            label: CRY1
        - preferred_term: PER3
          term:
            id: hgnc:8847
            label: PER3
        - preferred_term: CLOCK
          term:
            id: hgnc:2082
            label: CLOCK
      selected_evidence:
        snippet: we report a hereditary form of DSPD associated with a dominant coding variation in the
          core circadian clock gene CRY1, which creates a transcriptional inhibitor with enhanced affinity
          for circadian activator proteins Clock and Bmal1. This gain-of-function CRY1 variant causes
          reduced expression of key transcriptional targets and lengthens the period of circadian molecular
          rhythms, providing a mechanistic link to DSPD symptoms.
        supports: SUPPORT
