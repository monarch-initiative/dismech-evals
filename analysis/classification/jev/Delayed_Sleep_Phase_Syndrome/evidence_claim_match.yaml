    claim:
      about:
        disease:
          name: Delayed Sleep Phase Syndrome
          disease_term:
            preferred_term: Delayed Sleep Phase Syndrome
            term:
              id: MONDO:0024377
              label: circadian rhythm sleep disorder, delayed sleep phase type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Photic Entrainment
        role: trigger
        biological_scale: CELLULAR
        conforms_to: circadian_phase_misalignment#Loss or Mistiming of Photic Entrainment Input
        description: The circadian system normally entrains to the 24-hour light-dark cycle through retinal
          light input to the SCN via melanopsin-containing intrinsically photosensitive retinal ganglion
          cells (ipRGCs). In DSPS, there may be increased sensitivity to the melatonin-suppressing effect
          of evening light, and potentially impaired melanopsin-dependent phototransduction, resulting
          in a net phase delay of the circadian oscillator.
        cell_types:
