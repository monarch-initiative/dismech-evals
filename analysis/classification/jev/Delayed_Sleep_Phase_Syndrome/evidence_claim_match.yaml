    claim:
      about:
        disease:
          name: Delayed Sleep Phase Syndrome
          disease_term:
            preferred_term: Delayed Sleep Phase Syndrome
            term:
              id: MONDO:0024377
              label: circadian rhythm sleep disorder, delayed sleep phase type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Misalignment Between Circadian Phase and Social Schedule
        description: 'The rate-limiting step, and a relation rather than a state of the clock alone: it
          requires both a delayed endogenous phase and an externally imposed schedule that the phase cannot
          meet. This is what makes delayed sleep-wake phase disorder unusual among diseases - the same
          physiology is pathological or benign depending only on what the person is required to do, and
          an extreme evening chronotype with a permissive schedule is not a patient. Sleep attempted during
          the circadian wake-maintenance zone is delayed in onset and curtailed by the alarm clock, while
          wake required near the core temperature minimum brings maximal sleepiness and severe sleep inertia.
          Released from the schedule, the same person sleeps normally at their own phase - the diagnostic
          hallmark separating this disorder from chronic insomnia, with which it is routinely confused
          and with which it shares no treatment.'
        role: central_effector
        biological_scale: ORGANISM
        conforms_to: circadian_phase_misalignment#Misalignment Between Endogenous Circadian Phase and
          the Imposed Sleep-Wake Schedule
        notes: Conformance to the circadian module is scoped by subtype elsewhere in this entry, but deliberately
          not here. The Circadian-Entrained subtype - roughly 40% of cases, presenting with clinically
          delayed sleep timing despite normal objective phase markers - does not satisfy the module's
          entry arms, since neither an intrinsic clock lesion nor an entrainment failure has been demonstrated
          in those patients. Whether that subtype belongs in this disease entry at all is a live question,
          recorded rather than resolved.
        biological_processes:
        - preferred_term: entrainment of circadian clock
          term:
            id: GO:0009649
            label: entrainment of circadian clock
          modifier: DECREASED
        - preferred_term: regulation of the circadian sleep/wake cycle
          term:
            id: GO:0042749
            label: regulation of circadian sleep/wake cycle
          modifier: ABNORMAL
      selected_evidence:
        snippet: CRSDs result from a misalignment between the timing of the circadian rhythm and the external
          environment (eg, jet lag and shift work) or a dysfunction of the circadian clock or its afferent
          and efferent pathways (eg, delayed sleep-phase, advanced sleep-phase, non-24-hour, and irregular
          sleep-wake rhythm disorders).
        supports: SUPPORT
