      assertion_type: Environmental
      assertion:
        name: Evening and Nighttime Light Exposure
        description: Exposure to artificial light, particularly short-wavelength (blue, ~480 nm) light
          from screens and indoor lighting during evening hours, suppresses melatonin secretion and exacerbates
          circadian phase delay. DSWPD patients may have higher photosensitivity to evening light compared
          to normal sleepers, amplifying the phase-delaying effect. The COVID-19 pandemic period demonstrated
          that behavioral changes in light exposure and schedule patterns can promote delayed sleep phase.
      selected_evidence:
        snippet: The pathophysiology of DSPD remains obscure with suspected causes including a differential
          susceptibility of an individual's circadian clock to environmental entrainment cues such as
          the light/dark cycle, and altered properties of the oscillator itself that affect its period
          length
