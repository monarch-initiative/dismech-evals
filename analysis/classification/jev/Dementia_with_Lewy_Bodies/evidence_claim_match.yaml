              label: Lewy body dementia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autophagy-Lysosome Dysfunction
        conforms_to: disabled_macroautophagy#Failure of Cytoplasmic Quality Control
        description: 'Impaired autophagy and lysosomal functions are central to DLB pathogenesis. Neurons
          are particularly vulnerable to autophagy-lysosomal defects due to their postmitotic nature and
          polarized morphologies. Mutations in genes regulating autophagy and lysosomal functions, particularly
          GBA, contribute to impaired clearance of alpha-synuclein aggregates and damaged organelles.
          This dysfunction creates a vicious cycle where accumulating protein aggregates further impair
          the autophagic-lysosomal system.

          '
        biological_processes:
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: DECREASED
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Autophagy is a lysosome-based degradative process used to recycle obsolete cellular constituents
          and eliminate damaged organelles and aggregate-prone proteins. Their postmitotic nature and
          extremely polarized morphologies make neurons particularly vulnerable to disruptions caused
          by autophagy-lysosomal defects, especially as the brain ages.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39107446
      reference_title: Mechanisms of autophagy-lysosome dysfunction in neurodegenerative diseases.
      explanation: This establishes that autophagy-lysosome dysfunction is a fundamental mechanism in
        neurodegenerative diseases including Parkinson disease and related Lewy body disorders.
