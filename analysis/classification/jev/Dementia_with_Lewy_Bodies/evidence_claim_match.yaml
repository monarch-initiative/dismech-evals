      assertion_type: ClinicalTrial
      assertion:
        name: NCT05869669
        phase: PHASE_II
        status: COMPLETED
        description: Phase 2b randomized controlled trial of neflamapimod, an oral p38α inhibitor, in
          159 patients with probable DLB. The trial was enriched for patients without Alzheimer disease
          co-pathology (plasma ptau181<27.2 pg/mL). Although the primary outcome (change in CDR-SB at
          16 weeks) was not significantly different between treatment and placebo arms, exploratory analyses
          showed potential benefit in patients with low plasma ptau181 levels. Structural MRI sub-study
          (n=18) showed improvement in right basal forebrain volume with neflamapimod compared to placebo.
          Biomarker analyses (GFAP, neurofilament light chain) showed no significant differences.
        target_phenotypes:
        - preferred_term: Dementia
          term:
            id: HP:0000726
            label: Dementia
        - preferred_term: Parkinsonism
          term:
            id: HP:0001300
            label: Parkinsonism
        notes: Results are reported in a preprint (PPR:PPR1298352, Research Square, DOI:10.21203/rs.3.rs-10623740/v1)
          that has not yet completed peer review; the exploratory ptau181-stratified subgroup finding
          and the basal-forebrain MRI sub-study result should be weighed accordingly. The registration
          identifier is corrected here to NCT05869669 — the preprint's own abstract misprints it as NCT0586966.
      selected_evidence:
        snippet: The purpose of this study is to determine whether neflamapimod can improve learning skills,
          problem solving skills, and memory loss in people diagnosed with DLB.
        supports: SUPPORT
