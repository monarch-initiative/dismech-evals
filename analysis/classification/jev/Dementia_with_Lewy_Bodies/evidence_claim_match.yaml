      reference_title: 'Diagnosis and management of dementia with Lewy bodies: Fourth consensus report
        of the DLB Consortium.'
      evidence_source: OTHER
      explanation: 'PSG-confirmed REM sleep without atonia in a person with dementia and an RBD history
        carries a >=90% likelihood of synucleinopathy and is by itself sufficient to justify a probable
        DLB diagnosis. RBD is a core clinical feature on clinical grounds, so this is a sufficiency claim
        rather than a requirement that every case be polysomnographically confirmed; it is the diagnostic-weighting
        basis for this phenotype''s `diagnostic: true` flag, and it is why the electrophysiological finding
        rather than the dream-enactment history is the appropriate anchor for mechanism curation.'
