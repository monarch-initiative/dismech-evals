          name: Dengue
          disease_term:
            term:
              id: MONDO:0005502
              label: dengue disease
            preferred_term: dengue disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Complement Cascade Dysregulation
        description: 'Transcriptional signature of complement dysregulation in pediatric dengue: classical
          and lectin pathway components are upregulated during primary infection with concurrent downregulation
          of several complement regulators (FDR-significant). The primary-versus-secondary comparison
          shows a nominal trend toward the reciprocal pattern (C1QA/C1QC/C2/C4b down, CFI/C4BP/MBL2/CFP
          up), which the authors interpret as a transition from activation to regulation in secondary
          infection, though this comparison did not reach FDR significance.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: complement activation
          term:
            id: GO:0006956
            label: complement activation
          modifier: INCREASED
        notes: 'The INCREASED modifier reflects the direction of differential *gene expression* in PBMCs,
          not measured complement pathway activity. The authors are explicit about this limitation ("We
          use the term ''activation'' here to describe the direction of differential gene expression rather
          than direct biochemical evidence of complement cascade activity"), and the cohort is small (n
          = 3 per arm) with no functional validation. The primary-versus-secondary comparison in the second
          evidence item is based on nominal expression trends rather than FDR-significant differential
          expression: "after correction for multiple testing (FDR < 0.05, |log₂FC | ≥ 2), none of the
          complement-pathway genes examined showed statistical significance in the direct primary-versus-secondary
          comparison." See discussion `gap_dengue_pbmc_transcriptomic_signatures_functional_validation`.'
      selected_evidence:
        snippet: Multiple classical and lectin pathway genes were upregulated in the primary dengue cohort,
          including MBL2, C1QA, C1QB, C1QC, C2, and C9 (Fig. 3). In contrast, several complement regulatory
          factors were downregulated in the primary dengue cohort, including CD93, properdin (CFP), CR1,
          SERPING, C4BPA, C4BPB, and CFD
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
