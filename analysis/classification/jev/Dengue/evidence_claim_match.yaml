        context:
        - path: /pathophysiology/9
          value:
            name: Complement Cascade Dysregulation
            description: 'Transcriptional signature of complement dysregulation in pediatric dengue: classical
              and lectin pathway components are upregulated during primary infection with concurrent downregulation
              of several complement regulators (FDR-significant). The primary-versus-secondary comparison
              shows a nominal trend toward the reciprocal pattern (C1QA/C1QC/C2/C4b down, CFI/C4BP/MBL2/CFP
              up), which the authors interpret as a transition from activation to regulation in secondary
              infection, though this comparison did not reach FDR significance.'
            biological_scale: CELLULAR
            biological_processes:
            - preferred_term: complement activation
              term:
                id: GO:0006956
                label: complement activation
              modifier: INCREASED
            notes: 'The INCREASED modifier reflects the direction of differential *gene expression* in
              PBMCs, not measured complement pathway activity. The authors are explicit about this limitation
              ("We use the term ''activation'' here to describe the direction of differential gene expression
              rather than direct biochemical evidence of complement cascade activity"), and the cohort
              is small (n = 3 per arm) with no functional validation. The primary-versus-secondary comparison
              in the second evidence item is based on nominal expression trends rather than FDR-significant
              differential expression: "after correction for multiple testing (FDR < 0.05, |log₂FC | ≥
              2), none of the complement-pathway genes examined showed statistical significance in the
              direct primary-versus-secondary comparison." See discussion `gap_dengue_pbmc_transcriptomic_signatures_functional_validation`.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Plasma Leakage
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Excessive or unbalanced complement activation is proposed to increase vascular permeability
          and drive the plasma leakage that defines severe dengue. The intermediates linking complement
          activation products to endothelial barrier failure are not established in this cohort.
      selected_evidence:
        snippet: Complement activation in dengue is reportedly a double-edged sword, as even though it
          aids in viral neutralization, inasmuch as excessive or unbalanced activation can contribute
          to vascular permeability, plasma leakage, which are pathognomonic hallmarks of severe dengue
        supports: SUPPORT
