  75229c7891cc0a5008382c6c18b1a9de1bd480c7d3fc19f9dbe86222d71b9bd1:
    claim:
      about:
        disease:
          name: Dengue
          disease_term:
            term:
              id: MONDO:0005502
              label: dengue disease
            preferred_term: dengue disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dengue_pbmc_transcriptomic_signatures_functional_validation
        prompt: Do the complement, macrophage and immune-checkpoint transcriptional signatures reported
          in pediatric dengue PBMCs correspond to actual changes in complement pathway activity, macrophage
          activation state, and lymphocyte effector function - and do any of them cause, rather than merely
          accompany, severe dengue?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Complement Cascade Dysregulation
        - pathophysiology#Macrophage-Mediated Innate Immune Activation
        - pathophysiology#Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue
        rationale: 'All three nodes rest on a single bulk PBMC RNA-seq study of nine children (n = 3 primary,
          n = 3 secondary, n = 3 healthy controls), with no serotyping and no functional assay. The authors
          twice flag the limits of what the data can establish: they state that "activation" denotes the
          direction of differential gene expression rather than biochemical complement activity, and the
          abstract calls the signatures preliminary and in need of systematic functional validation. Bulk
          PBMC expression also confounds cell-composition shifts with per-cell state changes, so an apparent
          macrophage-activation signature may partly reflect monocyte frequency. The ModifierEnum values
          on these nodes should therefore be read as transcript-level, and no causal edge to disease severity
          is asserted from them.

          Two further limits are specific to the primary-versus-secondary contrast, which is the comparison
          the secondary-infection arms of these nodes rest on. First, none of the complement-pathway genes
          reached significance in that contrast after multiple-testing correction, so the reported "transition
          from activation to regulation" is a nominal trend. Second, the paper''s Results and Discussion
          sections disagree on the direction of LAG3, TIGIT and CD96 in secondary dengue. Both are recorded
          in the `notes` of the affected nodes; resolving either needs an independent cohort rather than
          reanalysis of these nine samples.'
        proposed_experiments:
        - experiment_id: exp_dengue_complement_functional_readout
          name: Functional complement readout paired with the transcriptional signature
          description: In a larger, serotyped pediatric dengue cohort spanning non-severe and severe disease,
            pair PBMC transcriptomics with plasma complement activation-product measurement (C3a, C5a,
            sC5b-9, Bb) and functional pathway assays, sampled longitudinally across the febrile, critical
            and convalescent phases. This tests whether the transcriptional "activation to regulation"
            shift tracks measured complement turnover.
          experiment_type:
            preferred_term: prospective clinical cohort with paired transcriptomic and functional complement
              assays
          decision_criterion: Concordance between the direction of complement transcript change and measured
            plasma activation products, and association of the activation products with plasma leakage
            severity.
          supporting_outcome:
          - Measured complement activation products track the transcriptional signature and scale with
            plasma leakage, converting this node from a transcript-level observation into a measured mechanism
            and grounding its edge to plasma leakage.
          refuting_outcome:
          - Complement activation products are unchanged or discordant with the transcript direction,
            indicating the signature is a bystander readout and that the modifier on this node should
            not be read as pathway activity.
          would_support:
          - pathophysiology#Complement Cascade Dysregulation
          would_refute:
          - pathophysiology#Complement Cascade Dysregulation
        - experiment_id: exp_dengue_checkpoint_exhaustion_functional_assay
          name: Single-cell and functional test of the checkpoint-exhaustion signature
          description: Apply single-cell RNA-seq with surface-protein profiling to separate cell-composition
            shifts from per-cell state changes, and test exhaustion functionally in NK, MAIT and T cells
            from primary versus secondary pediatric dengue - antigen-stimulated cytokine production, proliferation
            and cytotoxicity, with and without PD-1/LAG3/TIGIT blockade ex vivo.
          experiment_type:
            preferred_term: single-cell multi-omic profiling with ex vivo functional lymphocyte assays
          decision_criterion: Reduced effector function in checkpoint-high lymphocytes from secondary
            dengue, partially restored by checkpoint blockade ex vivo.
          supporting_outcome:
          - Checkpoint-high NK/MAIT/T cells show measurably impaired effector function that is partially
            reversible, establishing exhaustion rather than transcript upregulation alone.
          refuting_outcome:
          - Effector function is preserved despite checkpoint upregulation, indicating transient activation-associated
            checkpoint expression rather than exhaustion, and requiring this node to be reframed.
          would_support:
          - pathophysiology#Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue
          would_refute:
          - pathophysiology#Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue
        notes: Antibody-dependent enhancement (ADE) is the canonical driver of secondary-dengue severity
          and is covered in this entry's deep-research artifacts, but is not yet modelled as a pathophysiology
          node. An ADE node would be the natural upstream anchor for these three secondary-infection nodes;
          that is a separate curation increment.
      selected_evidence:
        snippet: While our initial findings provide early insights into the transcriptional patterns potentially
          associated with disease outcomes, the dysregulated transcriptomic signatures reported here are
          preliminary requiring systemic functional validation to determine their biologic role in the
          immunopathogenesis of pediatric dengue infection
        supports: SUPPORT
