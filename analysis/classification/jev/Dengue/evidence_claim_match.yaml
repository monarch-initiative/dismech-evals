  3e16e382ecde63e3184a513e1577fc9f15ec6a394c3532475fc8c21dc71f3114:
    claim:
      about:
        disease:
          name: Dengue
          disease_term:
            term:
              id: MONDO:0005502
              label: dengue disease
            preferred_term: dengue disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue
        description: Transcriptional signature of immune-checkpoint upregulation (PDCD1/PD-1, LAG3, TIGIT,
          CD96, VSIG4) in pediatric dengue, markedly higher in secondary than in primary infection, which
          the authors interpret as immune exhaustion of NK, MAIT and T cells restricting antiviral effector
          function.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        - preferred_term: mucosal-associated invariant T (MAIT) cell
          term:
            id: CL:0000940
            label: mucosal-associated invariant T cell
        biological_processes:
        - preferred_term: checkpoint-mediated restraint of T cell activation
          term:
            id: GO:0050868
            label: negative regulation of T cell activation
          modifier: INCREASED
        notes: 'The INCREASED modifier reflects upregulated checkpoint-molecule transcripts in bulk PBMCs;
          no functional exhaustion assay (cytokine production, proliferation, cytotoxicity) was performed,
          and the authors describe the signatures as preliminary.

          The source is internally inconsistent on directionality for three of the five genes named in
          the quoted snippet. The Results section reports that in secondary dengue "immune checkpoints
          associated genes VSIG4, PDCD1, ICOS, and CD274 were upregulated whereas LAG3, BTLA, TIGIT, and
          CD96 exhibited downregulation", while the Discussion sentence quoted as evidence here places
          LAG3, TIGIT and CD96 among the upregulated set. The PDCD1/VSIG4 arm is consistent across both
          sections; LAG3, TIGIT and CD96 should be treated as unresolved in this source until a larger
          cohort settles them.

          See discussion `gap_dengue_pbmc_transcriptomic_signatures_functional_validation`.'
      selected_evidence:
        snippet: Immune checkpoint, including PDCD1, LAG3, TIGIT, CD96, and VSIG4, were upregulated in
          both primary and secondary pediatric dengue, with markedly higher expressions in the secondary
          cohort. This enhanced checkpoint activity aligns with the immune exhaustion observed in NK cells,
          MAIT cells, and T cells, which restrict antiviral effector function.
        supports: SUPPORT
