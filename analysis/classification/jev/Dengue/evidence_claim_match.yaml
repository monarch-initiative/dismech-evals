      assertion:
        name: Natural Killer Cell-Mediated Antibody-Dependent Cellular Cytotoxicity
        biological_scale: CELLULAR
        description: IgG antibodies (particularly IgG1) bound to dengue-infected cells engage Fcγ receptor
          IIIa (CD16a) on natural killer cells, triggering release of cytolytic molecules. This results
          in killing of DENV-infected cells, a protective effector function correlating with lower viremia
          in secondary infections.
        cell_types:
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        biological_processes:
        - preferred_term: antibody-dependent cellular cytotoxicity
          term:
            id: GO:0001788
            label: antibody-dependent cellular cytotoxicity
        - preferred_term: natural killer cell mediated cytotoxicity
          term:
            id: GO:0042267
            label: natural killer cell mediated cytotoxicity
        notes: 'The cited review limits how much weight the cohort item below can carry: direct evidence
          for ADCC in dengue comes mainly from in vitro work plus one early paediatric study, so the human
          data are an association with viraemia rather than a demonstration of NK-mediated killing in
          patients.'
      selected_evidence:
        snippet: ADCC, where IgG antibodies bind viral antigens on DENV-infected cells and trigger killing
          of infected cells by natural killer cells through engagement of FcγRIIIa (CD16a)
        supports: SUPPORT
