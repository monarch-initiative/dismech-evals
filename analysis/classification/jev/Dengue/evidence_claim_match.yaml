            description: 'Active immunization with tetravalent live-attenuated dengue vaccines — the DENV-2-backboned
              TAK-003 (Qdenga) or the yellow fever 17D-backboned chimeric CYD-TDV (Dengvaxia) — elicits
              neutralizing antibodies against all four DENV serotypes and, for TAK-003, non-structural
              protein (NS1) humoral and cellular immunity that limits viremia and prevents severe endothelial
              glycocalyx disruption. Clinical deployment is critically modified by baseline dengue serostatus:
              CYD-TDV lacks DENV NS1 antigens and sensitized baseline-seronegative vaccinees to antibody-dependent
              enhancement and increased hospitalization risk upon primary wild-type infection, restricting
              its indication to laboratory-confirmed seropositive individuals, whereas TAK-003 demonstrated
              4.5-year efficacy and safety against all four serotypes in baseline-seropositive individuals
              and against DENV-1 and DENV-2 in baseline-seronegative individuals.'
            therapeutic_modality: VACCINE
            treatment_term:
              preferred_term: Vaccination
              term:
                id: NCIT:C15346
                label: Vaccination
            effect_modifiers:
            - effect_modifier_type: BIOMARKER
              stratum: Baseline dengue-seronegative individuals (no prior DENV infection)
              comparator_stratum: Baseline dengue-seropositive individuals (prior DENV infection)
              modified_outcome: Risk of hospitalized virologically confirmed dengue and serotype breadth
                of vaccine efficacy
              effect_in_stratum: OPPOSITE_EFFECT
              description: In baseline-seronegative children, the chimeric YF-17D/DENV vaccine CYD-TDV
                acted as a silent primary sensitization that predisposed recipients to vaccine-enhanced
                hospitalized dengue upon subsequent wild-type DENV infection, restricting CYD-TDV to individuals
                with prior dengue infection. In contrast, TAK-003 (built on an attenuated DENV-2 backbone
                retaining DENV NS1) showed no increased hospitalization risk in seronegative recipients
                over 4.5 years and protected baseline-seropositive individuals against all four serotypes
                and baseline-seronegative individuals against DENV-1 and DENV-2, but did not show efficacy
                against DENV-3 in baseline-seronegative individuals.
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: NS1-Induced Endothelial Glycocalyx Degradation
        treatment_effect: INHIBITS
        description: By suppressing dengue viral replication and, in DENV-backboned vaccines such as TAK-003,
          priming anti-NS1 immunity, vaccination reduces circulating DENV NS1 antigen levels and downstream
          endothelial glycocalyx degradation and hospitalized plasma-leakage disease.
      selected_evidence:
        snippet: Cumulative vaccine efficacy was 61·2% (95% CI 56·0-65·8) against virologically confirmed
