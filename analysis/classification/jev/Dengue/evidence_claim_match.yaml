              label: dengue disease
            preferred_term: dengue disease
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Early virological diagnosis (NS1 antigen and dengue RNA)
        description: 'In the first days of illness dengue is confirmed by detecting the virus itself:
          NS1 antigen by immunoassay or viral RNA by RT-PCR. Both are most sensitive in the viraemic phase
          (pooled estimates are for days 0-4 after symptom onset), when IgM is often not yet detectable;
          IgM serology takes over from day 5 of illness (see the serology row). The timing rule is the
          reason the tests are not interchangeable: a negative IgM in the first days does not exclude
          dengue.'
        measurements:
        - preferred_term: dengue NS1 antigen
          term:
            id: LOINC:91064-6
            label: Dengue virus NS1 Ag [Presence] in Serum or Plasma by Immunoassay
        - preferred_term: dengue virus RNA (RT-PCR)
          term:
            id: LOINC:7855-0
            label: Dengue virus 1+2+3+4 RNA [Presence] in Serum by NAA with probe detection
        notes: 'A Monarch KG search found no LOINC Part and no method-less code for dengue NS1 antigen
          or for dengue RNA. NS1 binds the serum-or-plasma presence code by immunoassay, the method every
          NS1 test uses (ELISA and rapid tests alike), rather than the rapid-immunoassay or quantitative
          variants (LOINC:75377-2 Dengue virus NS1 Ag [Presence] in Serum, Plasma or Blood by Rapid immunoassay;
          LOINC:101206-1 Dengue virus NS1 Ag [Units/volume] in Serum or Plasma by Immunoassay). RNA binds
          the pan-serotype serum presence code; every dengue RNA presence code in the KG names an amplification
          method, and the serotype-specific codes would make one test four. No reference_ranges: both
          results are qualitative and the cited sources state no diagnostic threshold.'
      selected_evidence:
        snippet: RNA and NS1 were most valuable for early diagnosis of dengue, whereas IgM was best suited
          as a supplementary method for patients at day 5 or more after illness onset.
        supports: SUPPORT
