      assertion_type: Pathophysiology
      assertion:
        name: NS1-Induced Endothelial Glycocalyx Degradation
        description: 'Secreted dengue NS1 acts directly on vascular endothelium: it induces sialidase
          and heparanase expression and activates cathepsin L, which together strip sialic acid and shed
          heparan sulfate proteoglycans from the endothelial glycocalyx layer. Loss of that layer is an
          endothelial cell-intrinsic route to hyperpermeability, separate from the antibody- and cytokine-mediated
          arm above.'
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: Here, we demonstrate that DENV NS1 disrupts the EGL on human pulmonary microvascular
          endothelial cells, inducing degradation of sialic acid and shedding of heparan sulfate proteoglycans.
        supports: SUPPORT
