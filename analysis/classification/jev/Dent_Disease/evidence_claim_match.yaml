        description: 'Oral phosphate salts, titrated on serum alkaline phosphatase and on radiographic
          improvement, for patients with hypophosphataemia and signs of rickets or osteomalacia. Crucially,
          active vitamin D must not be added in the way it would be for X-linked hypophosphataemic rickets,
          because 1,25(OH)2 vitamin D is already inherently elevated in Dent disease and raising it further
          worsens the hypercalciuria.

          '
        therapeutic_modality: SMALL_MOLECULE
