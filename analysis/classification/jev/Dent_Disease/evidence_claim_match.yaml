            description: 'Roughly 15% of patients carry OCRL variants instead. The proximal tubular phenotype
              largely overlaps Dent disease 1, but mild extrarenal features may be present: raised muscle
              enzymes, mild developmental delay, short stature, and occasionally punctate cataract. The
              same gene causes Lowe syndrome, which dismech curates as a separate, more severe multisystem
              entry (Lowe_Syndrome); DD2 is modelled here as a subtype of Dent disease rather than duplicated
              there, matching the split that entry records. In the largest DD2 series 39% of patients
              had at least one extrarenal sign, with muscle findings much commoner than ocular ones, and
              the authors concluded DD2 is clinically distinct from Lowe syndrome rather than simply a
              mild version of it.

              '
