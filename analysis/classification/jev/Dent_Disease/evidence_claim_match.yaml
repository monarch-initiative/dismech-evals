              label: Dent disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: acidification_vs_chloride
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is defective endosomal acidification, or luminal chloride accumulation, the step through
          which ClC-5 loss causes proximal tubular endocytic failure?
        attaches_to:
        - pathophysiology#Defective Endosomal Acidification
        - pathophysiology#Megalin and Cubilin Trafficking Failure
        rationale: 'The textbook account is that ClC-5 supplies the countercurrent for the V-ATPase, so
          its loss impairs acidification and the ligand-receptor complex fails to dissociate. A knock-in
          mouse converting the exchanger into an uncoupled chloride channel breaks that account: its endosomes
          acidify normally, and it still shows the full renal phenotype and impaired proximal tubular
          endocytosis. Either luminal chloride concentration matters in its own right, or acidification
          is one of several parallel requirements. The question is not decorative: it determines whether
          a therapeutic strategy aimed at restoring endosomal pH could work at all.

          '
      selected_evidence:
        snippet: However, despite normal endosomal acidification, KI mice showed the same renal phenotype
          than KO mice and patients with Dent's disease, including LMW proteinuria, hyperphosphaturia
          and hypercalciuria.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
