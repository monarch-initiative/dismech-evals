              id: MONDO:0015612
              label: Dent disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tubulopathy_to_ckd_transition
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What converts a proximal tubular endocytic defect into progressive chronic kidney disease,
          and why is the trajectory so variable within one family?
        attaches_to:
        - pathophysiology#Tubulointerstitial Fibrosis and Progressive Nephron Loss
        - phenotypes#Chronic kidney disease
        rationale: 'The guideline states outright that the mechanism of this transition remains to be
          deciphered. Candidate routes are maladaptive proximal tubular responses driving inflammation
          and fibrosis, stress responses in distal nephron segments provoked by the tubular protein load,
          and a genuine podocyte component given that CLCN5 and OCRL appear to be expressed in podocytes.
          Because the same variant produces different outcomes within one family, whatever governs progression
          is not the genotype. This is the gap that matters most clinically, since kidney failure is what
          determines prognosis and nothing currently available is known to modify it.

          '
      selected_evidence:
        snippet: The mechanisms behind the transition from proximal tubular dysfunction to progressive
          chronic kidney disease (CKD) in DD remain to be deciphered.
        supports: SUPPORT
