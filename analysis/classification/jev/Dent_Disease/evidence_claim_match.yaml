  c2fe0ea8d19c9f092f88f7b14bcd7a2427dcc46ec7d705e60320c22a3ba1df47:
    claim:
      about:
        disease:
          name: Dent Disease
          disease_term:
            preferred_term: Dent disease
            term:
              id: MONDO:0015612
              label: Dent disease
        context: []
      assertion_type: Treatment
      assertion:
        name: Thiazide Diuretics
        description: 'Thiazides reliably lower urinary calcium in Dent disease - chlorthalidone normalised
          calcium excretion in seven of eight patients in a randomised crossover study, and hydrochlorothiazide
          cut spot urinary calcium by 42% in an open-label trial - yet the 2025 guideline recommends against
          systematic use. The reason is the toxicity, not a failure of effect: hypovolaemia, hypokalaemia
          and hyponatraemia appeared in the same trials, no long-term kidney or stone outcome data exist
          in this disease, and Dent disease 2 patients are especially prone to dehydration and acute kidney
          injury on thiazides.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: thiazide diuretic
            term:
              id: NCIT:C49185
              label: Thiazide Diuretic
          - preferred_term: hydrochlorothiazide
            term:
              id: CHEBI:5778
              label: hydrochlorothiazide
          - preferred_term: chlorthalidone
            term:
              id: CHEBI:3654
              label: chlorthalidone
      selected_evidence:
        snippet: With chlorthalidone, calcium excretion fell to normal (<4.0 mg/kg per d) in all but one
          patient in each group.
        supports: SUPPORT
