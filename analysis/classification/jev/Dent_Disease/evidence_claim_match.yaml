          metabolic adaptation - become maladaptive, promoting inflammation and tubulointerstitial fibrosis,
          with the tubular protein load itself contributing by stressing distal nephron segments. Biopsy
          series show focal interstitial fibrosis, interstitial lymphocytic infiltration and tubular damage
          alongside the glomerular lesions, and a knock-in mouse carrying a representative pathogenic
          Clcn5 missense variant develops fibrosis and apoptosis with age.

          '
