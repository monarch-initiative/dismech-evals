      assertion_type: AnimalModel
      assertion:
        name: OCRL-deficient zebrafish
        species: Zebrafish
        genotype: ocrl morphant and mutant lines
        publication: PMID:40778266
        genes:
        - preferred_term: OCRL
          term:
            id: hgnc:8108
            label: OCRL
        description: 'Zebrafish ocrl models cover both Lowe syndrome and Dent disease 2. They show defective
          pronephric endocytosis, abnormal lysosomal function and tubule shortening, which accounts for
          the low-molecular-weight proteinuria of both conditions, and they are tractable enough that
          chemical and genetic rescue makes a phenotypic drug screen realistic.

          '
        modeled_mechanisms:
        - target: Endosomal PI(4,5)P2 Accumulation and Actin Dysregulation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The renal tubular arm of the model reproduces the endocytic and lysosomal consequences
            of OCRL loss.
          limitations: The fish models do not separate Dent disease 2 from Lowe syndrome, since both are
            produced by the same ocrl loss; the human distinction rests on variant position and residual
            isoform expression, which these lines do not reproduce. Whether the neurodevelopmental defects
            lie downstream of trafficking or of ciliary dysfunction is unresolved in the model itself.
        notes: 'Ocrl knockout mice are a notable negative: they do not reproduce the human disease, which
          is attributed to compensation by the paralog Inpp5b. That is part of why non-mammalian models
          carry disproportionate weight for Dent disease 2.'
      selected_evidence:
        snippet: These defects can account for the low molecular weight proteinuria seen in Lowe syndrome
          and Dent-2 disease and may explain the other renal features seen in both conditions.
        supports: SUPPORT
