  5f5c500d895c70a20bf219ae53f2e1bcb7510be1a23c649b28f1e52966d3e782:
    claim:
      about:
        disease:
          name: Dent Disease
          disease_term:
            preferred_term: Dent disease
            term:
              id: MONDO:0015612
              label: Dent disease
        context: []
      assertion_type: Definition
      assertion:
        name: Clinical diagnostic criteria for Dent disease
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'The long-standing three-part clinical definition, set out in the 2010 Orphanet review
          and still the reference frame in the 2025 recommendations. All three parts are required. Note
          that the 2025 guideline goes further and states that hypercalciuria is not mandatory, so the
          criteria are best read as a high-specificity case definition rather than an exclusion rule;
          genetic testing is what confirms or excludes the diagnosis.

          '
        inclusion_criteria:
        - preferred_term: Low-molecular-weight proteinuria at least 5-fold above the upper limit of normal
        - preferred_term: Hypercalciuria above 4 mg/kg per 24 hours, or a spot calcium/creatinine ratio
            above 0.25 mg/mg
        - preferred_term: At least one of nephrocalcinosis, kidney stones, hematuria, hypophosphataemia,
            or renal insufficiency
      selected_evidence:
        snippet: 'The clinical diagnosis of Dent''s disease is based on the presence of all three of the
          following criteria: (i) LMW proteinuria (elevation of urinary excretion of β2-microglobulin,
          Clara cell protein and/or RBP by at least 5-fold above the upper limit of normality); (ii) hypercalciuria
          (> 4 mg/kg in a 24 h-hour collection or > 0.25 mg Ca2+ per mg creatinine on a spot sample);
          and (iii) at least one of the following: nephrocalcinosis, kidney stones, hematuria, hypophosphataemia,
          or renal insufficiency.'
        supports: SUPPORT
