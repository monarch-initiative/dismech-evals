        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Megalin and Cubilin Trafficking Failure
        biological_scale: CELLULAR
        description: 'The convergence point of both genetic forms. Megalin and cubilin are the multiligand
          receptors of the apical brush border that perform receptor-mediated endocytosis in the proximal
          tubule. Whichever lesion is upstream, they are lost or reduced at the brush border and their
          cargo is no longer retrieved from the filtrate. A Drosophila nephrocyte model of Dent disease
          1, confirmed in ClC-5 knockout mice, adds an earlier secretory-pathway step, with Cubilin accumulating
          in the endoplasmic reticulum and Amnionless reduced overall, so the receptor complex may never
          reach the surface rather than only failing to recycle.

          '
        cell_types:
        - preferred_term: kidney proximal convoluted tubule epithelial cell
          term:
            id: CL:1000838
            label: kidney proximal convoluted tubule epithelial cell
        locations:
        - preferred_term: renal proximal tubule
          term:
            id: UBERON:0004134
            label: proximal tubule
        biological_processes:
        - preferred_term: receptor-mediated endocytosis
          term:
            id: GO:0006898
            label: receptor-mediated endocytosis
          modifier: DECREASED
        - preferred_term: endocytic recycling
          term:
            id: GO:0032456
            label: endocytic recycling
          modifier: DECREASED
      selected_evidence:
        snippet: These vesicles belong to the receptor-mediated endocytic pathway, which involves the
          multiligand receptors, megalin and cubilin, located at the apical brush border of PT cells
        supports: SUPPORT
