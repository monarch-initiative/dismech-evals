            term:
              id: MONDO:0015612
              label: Dent disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tubulointerstitial Fibrosis and Progressive Nephron Loss
        biological_scale: TISSUE
        description: 'How a proximal tubulopathy becomes progressive chronic kidney disease is the least
          resolved part of the mechanism and the guideline says so plainly. The proposed route is that
          early adaptive changes in proximal tubular cells - proliferation, dedifferentiation, autophagy,
          metabolic adaptation - become maladaptive, promoting inflammation and tubulointerstitial fibrosis,
          with the tubular protein load itself contributing by stressing distal nephron segments. Biopsy
          series show focal interstitial fibrosis, interstitial lymphocytic infiltration and tubular damage
          alongside the glomerular lesions, and a knock-in mouse carrying a representative pathogenic
          Clcn5 missense variant develops fibrosis and apoptosis with age.

          '
        cell_types:
        - preferred_term: kidney proximal convoluted tubule epithelial cell
          term:
            id: CL:1000838
            label: kidney proximal convoluted tubule epithelial cell
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: DYSREGULATED
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: The mechanisms behind the transition from proximal tubular dysfunction to progressive
          chronic kidney disease (CKD) in DD remain to be deciphered.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/0
