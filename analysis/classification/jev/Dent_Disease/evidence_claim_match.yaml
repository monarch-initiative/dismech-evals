      assertion_type: Subtype
      assertion:
        name: DD1
        display_name: Dent disease 1 (CLCN5-related)
        classification: genetic
        subtype_term:
          preferred_term: Dent disease type 1
          term:
            id: MONDO:0010225
            label: Dent disease type 1
        description: 'The commonest form, accounting for roughly half to two-thirds of patients. Inactivating
          CLCN5 variants remove or disable the electrogenic 2Cl-/H+ exchanger ClC-5 from the early endosomes
          of the proximal tubular subapical compartment. The renal phenotype is therefore a pure proximal
          tubulopathy with no obligate extrarenal features, although rickets, osteomalacia, and growth
          retardation occur secondary to the tubular losses.

          '
        genes:
        - preferred_term: CLCN5
          term:
            id: hgnc:2023
            label: CLCN5
        inheritance:
        - name: X-linked recessive inheritance
      selected_evidence:
        snippet: 'DD1 (MIM #300 009) is caused by inactivating variants in the CLCN5 gene (located on
          Xp11.22), which encodes the electrogenic 2Cl−/H+ exchanger ClC-5'
        supports: SUPPORT
