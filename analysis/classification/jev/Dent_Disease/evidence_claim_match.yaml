  8afd04d3a8641e3a0f722eca8617100e4553546d07648bc68ea84d51d2c3306d:
    claim:
      about:
        disease:
          name: Dent Disease
          disease_term:
            preferred_term: Dent disease
            term:
              id: MONDO:0015612
              label: Dent disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Urinary Loss of Vitamin D-Binding Protein and Parathyroid Hormone
        biological_scale: ORGANISM
        description: 'Losing megalin/cubilin-mediated retrieval sends filtered vitamin D-binding protein,
          25(OH)-vitamin D3 and PTH into the urine. Two opposing effects follow. Reduced endocytosis of
          luminal PTH raises the concentration seen by apical PTH receptors, which should drive 1-alpha-hydroxylation
          of 25(OH)-vitamin D3 to the active hormone and so increase intestinal calcium absorption; at
          the same time the precursor itself is being lost in the urine. The balance of those two effects
          is the current explanation for why serum 1,25(OH)2-vitamin D3 is variable between patients and
          for why hypercalciuria is present in most but not all of them. The mechanism is inferred from
          the mouse model and from the known cargo of the receptor complex rather than demonstrated directly
          in patients.

          '
        cell_types:
        - preferred_term: kidney proximal convoluted tubule epithelial cell
          term:
            id: CL:1000838
            label: kidney proximal convoluted tubule epithelial cell
        biological_processes:
        - preferred_term: renal excretion of vitamin D metabolites and PTH
          term:
            id: GO:0007588
            label: excretion
          modifier: DYSREGULATED
      selected_evidence:
        snippet: This may be caused by an increased stimulation of luminal parathyroid hormone (PTH) receptors
          owing to the observed decreased tubular endocytosis of PTH. The rise in luminal PTH concentration
          should also stimulate the hydroxylation of 25(OH) vitamin D3 to the active hormone. However,
          this is counteracted by a urinary loss of the precursor 25(OH) vitamin D3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
