        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
        description: Both genetic forms are X-linked. The full phenotype is essentially confined to hemizygous
          males; heterozygous female carriers show attenuated features, most often low-molecular-weight
          proteinuria and, less consistently, hypercalciuria. De novo variants are not rare, accounting
          for roughly 12% of Dent disease 1 and up to 30% of Dent disease 2 cases.
      selected_evidence:
        snippet: These features are generally found in males only, and may be present in early childhood,
          whereas female carriers may show a milder phenotype.
        supports: SUPPORT
