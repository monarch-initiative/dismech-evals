        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Calcium Crystal Nucleation and Retention
        biological_scale: TISSUE
        conforms_to: nephrolithiasis_crystal_nucleation#Crystal Nucleation and Growth
        description: 'Supersaturated urine nucleates calcium crystals which must then be retained rather
          than flushed out for nephrocalcinosis or a stone to form. In Dent disease retention appears
          to carry independent weight, because nephrolithiasis and nephrocalcinosis have been reported
          in patients without hypercalciuria, which has been attributed to impaired clearance of microcrystals
          from the collecting duct epithelial surface. Nephrocalcinosis is typically detectable from childhood
          while discrete stones appear later.

          '
        cell_types:
        - preferred_term: renal tubular epithelial cell
          term:
            id: CL:0002518
            label: kidney epithelial cell
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
        biological_processes:
        - preferred_term: crystal-epithelial cell adhesion
          term:
            id: GO:0007155
            label: cell adhesion
      selected_evidence:
        snippet: which might be explained by impaired clearance of microcrystals from the surface of collecting
          duct cells, as demonstrated in vitro
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39794284
