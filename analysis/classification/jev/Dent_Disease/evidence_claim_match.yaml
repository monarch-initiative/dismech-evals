  fab386b184df3393360c06b431b7e6dc9e5d4a56268404e5a0a0a25127bd5b4d:
    claim:
      about:
        disease:
          name: Dent Disease
          disease_term:
            preferred_term: Dent disease
            term:
              id: MONDO:0015612
              label: Dent disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Endosomal Acidification
        biological_scale: MOLECULAR
        description: 'Progression along the endocytic pathway requires the V-ATPase to acidify each vesicle
          to about pH 5.0, which is what dissociates ligand from receptor and permits receptor recycling.
          That proton pumping needs a parallel chloride conductance for electroneutrality, and ClC-5 supplies
          it. Losing ClC-5 leaves positive charge accumulating in the lumen and acidification impaired.
          This node is necessary but not sufficient for the disease phenotype: a knock-in mouse converting
          the exchanger into an uncoupled chloride channel acidifies its endosomes normally and still
          reproduces the full renal phenotype, so luminal chloride accumulation rather than pH alone appears
          to carry part of the mechanism.

          '
        cellular_components:
        - preferred_term: proximal tubular subapical early endosome
          term:
            id: GO:0005769
            label: early endosome
        biological_processes:
        - preferred_term: endosomal lumen acidification
          term:
            id: GO:0048388
            label: endosomal lumen acidification
          modifier: DECREASED
      selected_evidence:
        snippet: Endosomal acidification (up to pH 5.0), that is necessary for dissociation of the ligand-receptor
          complex, recycling of receptors to the apical membrane, and progression of ligands into lysosomes,
          is achieved by ATP-driven transport of cytosolic H+ through the V-ATPase.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20946626
      reference_title: Dent's disease.
      evidence_source: OTHER
      explanation: Establishes why endosomal pH matters for receptor recycling, which is the next node
        in the chain.
