  261c84875029fafbf1d19d208189e5687703284cbc01aa479ecd629b73ce0939:
    claim:
      about:
        disease:
          name: Dent Disease
          disease_term:
            preferred_term: Dent disease
            term:
              id: MONDO:0015612
              label: Dent disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ocrl_mouse_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Can a mammalian model of Dent disease 2 be built, given that Ocrl knockout mice are essentially
          unaffected because of Inpp5b compensation?
        attaches_to:
        - pathophysiology#OCRL Phosphoinositide 5-Phosphatase Deficiency
        - animal_models#Zebrafish
        rationale: 'Mouse Ocrl loss does not reproduce the human renal phenotype, which is attributed
          to compensation by the paralog Inpp5b; the double knockout is embryonic lethal. The field therefore
          leans on zebrafish and on patient cells for Dent disease 2, and those models do not distinguish
          Dent disease 2 from Lowe syndrome, since both arise from ocrl loss and the human distinction
          depends on variant position and residual isoform expression. The mismatch is mechanistically
          meaningful rather than merely inconvenient: the human DD2/Lowe boundary is set by how much OCRL
          activity survives, which is exactly the variable a null allele removes.

          '
      selected_evidence:
        snippet: Zebrafish has been used to study OCRL function in vivo and to successfully model these
          two rare genetic conditions.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
