  907656d2d138e268f4d301239fb996aab7b6f55ec850680115c73a654ac9b7fb:
    claim:
      about:
        disease:
          name: Dent Disease
          disease_term:
            preferred_term: Dent disease
            term:
              id: MONDO:0015612
              label: Dent disease
        context: []
      assertion_type: Subtype
      assertion:
        name: DD2
        display_name: Dent disease 2 (OCRL-related)
        classification: genetic
        subtype_term:
          preferred_term: Dent disease type 2
          term:
            id: MONDO:0010359
            label: Dent disease type 2
        description: 'Roughly 15% of patients carry OCRL variants instead. The proximal tubular phenotype
          largely overlaps Dent disease 1, but mild extrarenal features may be present: raised muscle
          enzymes, mild developmental delay, short stature, and occasionally punctate cataract. The same
          gene causes Lowe syndrome, which dismech curates as a separate, more severe multisystem entry
          (Lowe_Syndrome); DD2 is modelled here as a subtype of Dent disease rather than duplicated there,
          matching the split that entry records. In the largest DD2 series 39% of patients had at least
          one extrarenal sign, with muscle findings much commoner than ocular ones, and the authors concluded
          DD2 is clinically distinct from Lowe syndrome rather than simply a mild version of it.

          '
        genes:
        - preferred_term: OCRL
          term:
            id: hgnc:8108
            label: OCRL
        inheritance:
        - name: X-linked recessive inheritance
      selected_evidence:
        snippet: Extrarenal manifestations of patients with DD2 are very mild compared with full-blown
          Lowe syndrome and may include punctuated congenital cataract, mild developmental delay, and
          short stature
        supports: SUPPORT
    origin:
