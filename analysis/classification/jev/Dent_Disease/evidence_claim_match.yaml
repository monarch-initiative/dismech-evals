      assertion_type: Treatment
      assertion:
        name: Potassium Citrate
        description: 'Alkalinising citrate is the treatment the 2025 ERA/ESPN recommendations place first
          for stone and nephrocalcinosis risk, on a weak recommendation grade because no human trial in
          Dent disease exists. The case rests on a high-citrate diet slowing CKD in Clcn5 knockout mice,
          on citrate''s proven benefit in idiopathic hypercalciuria with hypocitraturia, and on citrate
          excretion in Dent disease being lower than in other Fanconi syndromes. Urinary pH needs monitoring,
          since over-alkalinisation risks calcium phosphate precipitation.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: potassium citrate
            term:
              id: NCIT:C29372
              label: Potassium Citrate
        notes: Reported use is 13-25% of Dent disease patients. As citrate is metabolised to bicarbonate
          it also helps correct metabolic acidosis, but it may aggravate alkalosis in patients with significant
          hyperaldosteronism.
      selected_evidence:
        snippet: We suggest that citrate treatment may be considered in patients with DD, in particular
          in the presence of nephrocalcinosis/stone disease (Grade C, weak).
        supports: SUPPORT
