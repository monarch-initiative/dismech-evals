          make this a glomerular disease amenable to antiproteinuric therapy. The guideline recommends
          against routine use. Published case series show no fall in proteinuria, which is unsurprising
          given that the proteinuria is tubular rather than glomerular in origin, and the hypovolaemia
          risk is raised in a salt-losing tubulopathy. This treatment is curated because it is widely
          used, not because it is endorsed.

