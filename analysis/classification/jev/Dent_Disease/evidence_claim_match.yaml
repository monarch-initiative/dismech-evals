        subtype: DD2
        gene_term:
          preferred_term: OCRL
          term:
            id: hgnc:8108
            label: OCRL
        association: Loss-of-function
        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        frequency: approximately 15% of patients with Dent disease
        notes: 'OCRL variants cause both Dent disease 2 and the more severe Lowe syndrome. The position
          of a truncating variant largely determines which: variants in exons 1-7 give Dent disease 2,
          while exons 8-24 give Lowe syndrome, a difference attributed to an additional translation-initiation
          codon in exon 8 that permits expression of a shortened but partly functional OCRL isoform. Missense
          variants associated with DD2 map to the 5-phosphatase domain. The correlation is not absolute:
          both phenotypes have been reported for five OCRL variants.

          '
