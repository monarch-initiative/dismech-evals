            term:
              id: CHEBI:26020
              label: phosphate
      selected_evidence:
        snippet: We suggest treating patients with DD using phosphate salts in case of hypophosphatemia
          and signs of rickets of osteomalacia (Grade X, weak).
        supports: SUPPORT
