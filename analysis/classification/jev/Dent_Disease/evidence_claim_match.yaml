      assertion_type: DifferentialDiagnosis
      assertion:
        name: Idiopathic focal segmental glomerulosclerosis
        description: 'Not a competing genetic diagnosis so much as the label Dent disease is wrongly given.
          Because the tubular protein load can be nephrotic-range and biopsy shows glomerulosclerosis
          with foot-process effacement, patients are treated as steroid-resistant nephrotic syndrome;
          13% of one biopsy series had a repeat biopsy for steroid-resistant proteinuria.

          '
        distinguishing_features:
        - Serum albumin is normal and there is no oedema, despite nephrotic-range total protein.
        - Urinary protein is low-molecular-weight in origin, demonstrable by retinol-binding protein,
          beta-2-microglobulin, or an alpha-1-microglobulin/creatinine ratio above 120 mg/g.
      selected_evidence:
        snippet: A repeat biopsy for steroid-resistant proteinuria was performed in 13% (four of 30) of
          the patients.
        supports: SUPPORT
