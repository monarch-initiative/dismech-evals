          modifier: INCREASED
          term:
            id: ECTO:9000162
            label: exposure to carbohydrate
        description: 'High-frequency consumption of fermentable carbohydrates — particularly sucrose,
          but also glucose, fructose, and starch — is the primary environmental driver that initiates
          and sustains cariogenic oral microbiome dysbiosis. Sucrose is uniquely cariogenic because it
          is utilized by mutans streptococcal glucosyltransferases to synthesize insoluble extracellular
          glucans, in addition to serving as a fermentation substrate. Frequency of exposure, not total
          quantity, is the key determinant, since each carbohydrate event triggers an acid pulse selecting
          for the dysbiotic state.

          '
      selected_evidence:
        snippet: Risk for caries includes physical, biological, environmental, behavioural, and lifestyle-related
          factors such as high numbers of cariogenic bacteria, inadequate salivary flow, insufficient
          fluoride exposure, poor oral hygiene, inappropriate methods of feeding infants, and poverty.
        supports: SUPPORT
