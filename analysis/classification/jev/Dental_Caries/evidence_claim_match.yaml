            term:
              id: MONDO:0005276
              label: dental caries
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dentin Invasion and Pulpal Inflammation
        description: 'As demineralization breaches the enamel-dentin junction, caries progresses through
          dentin more rapidly due to lower mineral content and dentinal tubules that provide direct bacterial
          pathways to the pulp. Odontoblasts lining the pulp-dentin border serve as innate immune sentinel
          cells, recognizing bacterial PAMPs via toll-like receptors (TLRs) and triggering cytokine and
          chemokine release. Tertiary (reactionary) dentin is deposited as a protective barrier. Progressive
          bacterial invasion elicits pulpitis, and if untreated, pulp necrosis with periapical abscess
          formation.

          '
        cell_types:
        - preferred_term: Odontoblast
          term:
            id: CL:0000060
            label: odontoblast
        biological_processes:
        - preferred_term: Pulpal inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Discussion will include dentinal fluid, odontoblasts, neuropeptides, and neurogenic inflammation,
          which are not classic immune components but actively participate in the inflammatory response
          as the caries progress pulpally.
        supports: SUPPORT
    origin:
