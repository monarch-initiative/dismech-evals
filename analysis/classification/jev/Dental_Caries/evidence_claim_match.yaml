      - /disease_term
    evidence_metadata:
      reference: PMID:12624191
      reference_title: Are dental diseases examples of ecological catastrophes?
      evidence_source: HUMAN_CLINICAL
      explanation: 'Marsh 2003 establishes the ecological plaque hypothesis: caries results from a pH-driven
        shift in the oral microbial community, not from invasion by a specific pathogen. This is the foundational
        framing for dental caries as a microbiome disease.

        '
