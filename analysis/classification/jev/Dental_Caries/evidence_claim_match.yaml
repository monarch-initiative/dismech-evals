      assertion_type: Pathophysiology
      assertion:
        name: Cariogenic Biofilm Virulence Factors
        description: 'Within the dysbiotic plaque biofilm, mutans streptococci, especially Streptococcus
          mutans, express key virulence determinants that amplify the cariogenic microenvironment. Glucosyltransferases
          (gtfB, gtfC, gtfD) synthesize insoluble extracellular glucan polymers from sucrose, consolidating
          the biofilm matrix and retaining acidogenic bacteria at the tooth surface. Glucan-binding proteins
          (gbpB, gbpC) and two-component signal transduction systems (vicRK, liaSR) regulate adhesion,
          environmental adaptation, and stress responses, enabling cariogenic biofilm organisms to thrive
          under acidic conditions that suppress competitor species.

          '
        biological_processes:
        - preferred_term: Extracellular glucan biosynthesis (mutans streptococci, GTF-mediated)
          term:
            id: GO:0000271
            label: polysaccharide biosynthetic process
          modifier: INCREASED
      selected_evidence:
        snippet: Key virulence genes were identified, including glucosyltransferases (gtfB, gtfC, gtfD),
          glucan-binding proteins (gbpB, gbpC), and two-component systems (vicRK, liaSR). These genes
          contribute to adhesion, extracellular polysaccharide synthesis, and environmental adaptation,
          processes critical for biofilm development.
        supports: SUPPORT
