      assertion:
        name: Silver Diamine Fluoride
        description: 'Silver diamine fluoride (SDF) is a topical agent that arrests active carious lesions
          through combined antibacterial (silver) and remineralizing (fluoride) action, and is widely
          used as a minimally invasive caries-arrest therapy. Its dentin-pulp safety margin has been characterized
          in a microfluidic "tooth-on-a-chip" that cultures dental pulp stem cells under flow behind a
          dentin barrier: SDF penetrating thin dentin is cytotoxic to pulp cells, and SDF disrupts gingival
          epithelial integrity in 3D gingival equivalents, defining the dentin thickness and exposure
          conditions that bound safe use.

          '
        treatment_term:
          preferred_term: fluoride therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: silver diamine fluoride
            term:
