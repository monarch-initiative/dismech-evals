  cc41b2d0f731888a9670b0925904d448b1453b530871f63f604544df8bac4798:
    claim:
      about:
        disease:
          name: Dental Caries
          disease_term:
            preferred_term: Dental Caries
            term:
              id: MONDO:0005276
              label: dental caries
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acid-Mediated Enamel Demineralization
        description: 'The sustained low pH generated by the dysbiotic biofilm drives dissolution of hydroxyapatite
          mineral from the enamel surface. Below the critical pH (~5.5 for enamel, ~6.2 for dentin/cementum),
          calcium and phosphate ions diffuse out of the enamel crystal lattice, causing demineralization.
          When the pH rises (during eating cessation, salivary clearance), remineralization can occur
          if sufficient calcium and phosphate are available. Net caries progression occurs when acid challenge
          frequency and duration exceed the capacity for remineralization. This demineralization-remineralization
          imbalance is the proximate mechanism producing the carious lesion — the structural phenotype
          of the disease.

          '
        chemical_entities:
        - preferred_term: Tooth hydroxyapatite mineral
          term:
            id: CHEBI:52254
            label: apatite
          modifier: DECREASED
      selected_evidence:
        snippet: Dental caries forms through a complex interaction over time between acid-producing bacteria
          and fermentable carbohydrate, and many host factors including teeth and saliva.
        supports: SUPPORT
