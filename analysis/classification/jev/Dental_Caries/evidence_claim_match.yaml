        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oral Microbiome Dysbiosis
        description: 'In oral health, the dental plaque microbiome is ecologically stable and diverse,
          maintaining a balanced metabolic activity in which acid production is buffered by alkali-generating
          commensals. Frequent exposure to fermentable carbohydrates generates repeated episodes of low
          pH that function as ecological selection pressure, enriching acidogenic and acid-tolerant species
          (mutans streptococci, lactobacilli) while suppressing acid-sensitive health-associated taxa.
          This constitutes a microbiome regime shift — a self-reinforcing positive feedback loop in which
          low pH selects for more acidogenic organisms, which generate further acidification, perpetuating
          dysbiosis. The ecological plaque hypothesis (Marsh 2003) emphasizes that it is the shift in
          environmental conditions (repeated low pH), not the presence of any single pathogen, that drives
          the community toward a cariogenic state.

          '
        biological_processes:
        - preferred_term: Fermentation
          term:
            id: GO:0006113
            label: fermentation
          modifier: INCREASED
        - preferred_term: Response to acidic pH
          term:
            id: GO:0010447
            label: response to acidic pH
          modifier: INCREASED
        - preferred_term: Dental plaque biofilm formation
          term:
            id: GO:0042710
            label: biofilm formation
          modifier: INCREASED
      selected_evidence:
        snippet: acidification due to carbohydrate fermentation or inflammation in response to accumulated
          plaque select for a cariogenic or periopathogenic microbiota, respectively, in a chain of self-reinforcing
          events
        supports: SUPPORT
