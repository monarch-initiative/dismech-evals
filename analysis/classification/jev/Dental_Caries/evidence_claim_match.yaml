              label: dental caries
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disruption of Microbiome Resilience and Salivary Defense
        description: 'The healthy oral microbiome maintains resilience through negative feedback mechanisms
          that counteract disease drivers. Commensal bacteria produce ammonia (from arginine catabolism
          and urease activity) that neutralizes acid, maintaining pH above critical thresholds. Saliva
          provides an additional layer of defense through buffering capacity, calcium and phosphate ions
          for remineralization, antimicrobial proteins (lactoferrin, lysozyme, sIgA, histatins), and sugar
          clearance. Xerostomia, reduced salivary buffering, and depletion of health-promoting commensal
          taxa all reduce resilience and tip the balance toward a cariogenic regime shift.

          '
        biological_processes:
        - preferred_term: Salivary secretion
          term:
            id: GO:0046541
            label: saliva secretion
          modifier: DECREASED
        - preferred_term: Tooth remineralization
          term:
            id: GO:0034505
            label: tooth mineralization
          modifier: DECREASED
      selected_evidence:
        snippet: Health-maintaining mechanisms that limit the effect of disease drivers include the complex
          set of metabolic and functional interrelationships that develop within dental biofilms and between
          biofilms and the host.
        supports: SUPPORT
