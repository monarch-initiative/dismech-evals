        association: Causative
        gene_term:
          preferred_term: ATN1
          term:
            id: hgnc:3033
            label: ATN1
        notes: DRPLA is caused by a CAG repeat expansion in exon 5 of ATN1. Normal alleles are typically
          35 repeats or fewer. Alleles with 35-47 repeats are incompletely penetrant, while 48 or more
          repeats are typically fully penetrant. Larger expansions are associated with earlier onset,
          juvenile presentation, anticipation, and greater disease severity, especially with paternal
          transmission.
      selected_evidence:
        snippet: This phenomenon is thought to be driven by CAG repeat expansion in the gametes, particularly
          in spermatogenesis, as anticipation is more pronounced on paternal inheritance.
        supports: SUPPORT
