        phase: Prenatal and infantile onset
        age_range: Prenatal to infancy
        notes: Severe truncating ZNF526 variants present with prenatal and postnatal microcephaly (-4
          SD to -8 SD), infantile-onset developmental delay, epilepsy, and progressive bilateral cataracts,
          whereas homozygous missense variants may present with postnatal microcephaly (-2 SD) and severe
          intellectual disability without structural MRI abnormalities.
