        snippet: Four had variants resulting in truncation of ZNF526; they were affected by severe prenatal
          and postnatal microcephaly (ranging from -4 SD to -8 SD), profound psychomotor delay, hypertonic-dystonic
          movements, epilepsy and simplified gyral pattern on MRI. All of them also displayed bilateral
          progressive cataracts.
        supports: SUPPORT
