      assertion:
        name: Entrapment of Wild-Type DSPP and Reduced DSPP Secretion
        description: Retained mutant DSPP forms Ca2+-dependent complexes with co-expressed normal DSPP
          and reduces its exit from the rER in a dose-responsive manner, a dominant-negative effect that
          lowers the amount of DSPP secreted into the dentin matrix. N-terminal DPP frameshifts leave
          a shorter acidic Ca2+-binding segment before the frameshift and are thought to capture wild-type
          DSPP less efficiently, allowing more normal protein to be secreted and producing the milder
          DD-II phenotype rather than dentinogenesis imperfecta.
        role: intermediate
        biological_scale: CELLULAR
        cell_types:
