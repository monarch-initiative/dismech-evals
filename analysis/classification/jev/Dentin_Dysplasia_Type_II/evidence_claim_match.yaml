  9d71b61d1d3b8d68a66c942b297dd0ecf6fc1f9507cd6d255aa7f8cc21458488:
    claim:
      about:
        disease:
          name: Dentin Dysplasia Type II
          disease_term:
            preferred_term: dentin dysplasia type II
            term:
              id: MONDO:0007437
              label: dentin dysplasia type II
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ddii_dominant_negative_vs_haploinsufficiency
        prompt: Is DD-II caused by dominant-negative entrapment of wild-type DSPP in the rough endoplasmic
          reticulum, by reduced DSPP dosage, or by both, and does the answer differ between the frameshift,
          signal-peptide and splice-site allele classes?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Entrapment of Wild-Type DSPP and Reduced DSPP Secretion
        - animal_models#Mouse
        rationale: The dominant-negative model rests on transfection of HEK293 cells and on the premise
          that loss of a single Dspp allele causes no dental phenotype in mice. A later study reported
          a DD-II-like phenotype in aged Dspp+/- mice, and the signal-peptide p.Asp6Tyr allele was originally
          interpreted as loss of function, while the splice-site allele was proposed to act through a
          partial reduction in normal DSPP. Entrapment has not been shown in odontoblasts or in human
          DD-II tissue, and no knock-in model of a DD-II frameshift allele has been characterized.
        proposed_experiments:
        - experiment_id: ddii_frameshift_knockin_vs_heterozygous_null
          name: DD-II frameshift knock-in and allele-specific secretion assay
          description: Compare a knock-in mouse or odontoblast line carrying an N-terminal DPP frameshift
            with Dspp+/- littermates, measuring rER retention of wild-type DSPP and secreted DSP/DPP in
            dentin over age.
          would_support:
          - pathophysiology#Entrapment of Wild-Type DSPP and Reduced DSPP Secretion
      selected_evidence:
        snippet: Our report is the first to claim the haploinsufficiency of Dspp gene and a DD-II mouse
          model
        supports: REFUTE
