  c61e62a0eda4264d1c5f4086dbba0107fc31aa8c397db35c3c8765b7ac404089:
    claim:
      about:
        disease:
          name: Dentin Dysplasia Type II
          disease_term:
            preferred_term: dentin dysplasia type II
            term:
              id: MONDO:0007437
              label: dentin dysplasia type II
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous DSPP Pathogenic Variant
        description: A single germline pathogenic DSPP allele initiates DD-II. Most DD-II alleles are
          -1 frameshifts in the N-terminal third of the exon 5 region encoding the Ser-Ser-Asx repeats
          of dentin phosphoprotein (DPP), which replace the acidic repeat with a hydrophobic downstream
          sequence; a signal-peptide missense change (p.Asp6Tyr) and an intron 2 splice-acceptor variant
          (IVS2-6T>G) are also reported. More C-terminal DPP frameshifts tend to cause the more severe
          dentinogenesis imperfecta type II, with exceptions.
        role: trigger
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          gene:
            preferred_term: DSPP
            term:
              id: hgnc:3054
              label: DSPP
          description: Dominant-negative action is supported by cell-transfection data for the frameshift
            and leader-region classes; the signal-peptide p.Asp6Tyr allele was proposed to cause loss
            of function of the encoded proteins, and a haploinsufficiency contribution has not been excluded
            (see discussions).
        genes:
        - preferred_term: DSPP
          term:
            id: hgnc:3054
            label: DSPP
        molecular_functions:
        - preferred_term: calcium ion binding of the acidic dentin phosphoprotein repeat
          term:
            id: GO:0005509
            label: calcium ion binding
          modifier: DECREASED
      selected_evidence:
        snippet: In eight families (five mutations in the N-terminal third of DPP), the clinical and radiologic
          features were uniform and compatible with dentin dysplasia type II (DD-II) with major clinical
          signs in the deciduous dentition.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20949630
      reference_title: Frameshift mutations in dentin phosphoprotein and dependence of dentin disease
        phenotype on mutation location.
      evidence_source: HUMAN_CLINICAL
      explanation: Twelve-family series ties N-terminal DPP frameshifts to the DD-II phenotype.
