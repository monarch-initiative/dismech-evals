          gene:
            preferred_term: DSPP
            term:
              id: hgnc:3054
              label: DSPP
          description: Dominant-negative action is supported by cell-transfection data for the frameshift
            and leader-region classes; the signal-peptide p.Asp6Tyr allele was proposed to cause loss
            of function of the encoded proteins, and a haploinsufficiency contribution has not been excluded
            (see discussions).
        genes:
        - preferred_term: DSPP
          term:
            id: hgnc:3054
            label: DSPP
