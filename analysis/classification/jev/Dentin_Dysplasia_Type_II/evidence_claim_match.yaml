          -1 frameshifts in the N-terminal third of the exon 5 region encoding the Ser-Ser-Asx repeats
          of dentin phosphoprotein (DPP), which replace the acidic repeat with a hydrophobic downstream
          sequence; a signal-peptide missense change (p.Asp6Tyr) and an intron 2 splice-acceptor variant
          (IVS2-6T>G) are also reported. More C-terminal DPP frameshifts tend to cause the more severe
          dentinogenesis imperfecta type II, with exceptions.
        role: trigger
        biological_scale: MOLECULAR
