            label: protein secretion
          modifier: DECREASED
      selected_evidence:
        snippet: Trafficking out of the rER by coexpressed normal DSPP was reduced in a dose-responsive
          manner, probably due to formation of Ca2+-dependent complexes with the retained mutant DSPP.
        supports: SUPPORT
