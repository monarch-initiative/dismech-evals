      assertion:
        discussion_id: gap_ddii_primary_vs_permanent_dentition
        prompt: Why is the dentin defect in DD-II severe in the primary dentition but mild in the permanent
          dentition of the same individual?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Dentinogenesis imperfecta-like primary dentition
        - pathophysiology#Defective Dentin Mineralization
        rationale: The contrast between dentitions defines DD-II and also holds, to a lesser degree, across
          the DSPP spectrum, but no study has compared DSPP expression, secretion or rER retention in
          primary versus permanent odontoblasts. Differences in the rate of dentin formation or in the
          burden of mutant protein are possible explanations that have not been tested.
      selected_evidence:
        snippet: The increased severity of the clinical features in primary teeth when compared with the
          permanent teeth, usually described in DD-II, DGI-II and DGI-III, was confirmed in all the reviewed
          cases.
        supports: SUPPORT
