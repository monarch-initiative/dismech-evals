      assertion_type: Pathophysiology
      assertion:
        name: Mutant DSPP Retention in the Rough Endoplasmic Reticulum
        description: In odontoblasts, mutant DSPP fails to traffic normally through the secretory pathway.
          Frameshift DPP mutants carry a long hydrophobic tail that anchors them to rough endoplasmic
          reticulum (rER) membranes, leader-region mutants are retained in the rER, and the signal-peptide
          p.Asp6Tyr mutant fails to translocate into the endoplasmic reticulum at all.
        role: intermediate
