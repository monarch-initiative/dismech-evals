          by directing the complex to inappropriate ones. This is why the phenotype is more severe than
          that of a WT1 whole gene deletion.
      selected_evidence:
        snippet: A much more severe phenotype is seen in patients with Denys-Drash syndrome which results
          from heterozygous dominant-negative mutations of the gene.
        supports: SUPPORT
