      assertion_type: Pathophysiology
      assertion:
        name: WT1 Zinc-Finger Missense Variant
        biological_scale: MOLECULAR
        description: A heterozygous constitutional point mutation in the WT1 zinc finger region, clustered
          in the exons encoding zinc fingers 2 and 3, alters the residues that make base specific contacts
          with target DNA.
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          description: Heterozygous missense substitutions in the WT1 zinc finger DNA binding domain,
            clustered in exons 8 and 9, with a recurrent hot spot at zinc finger III. The phenotype requires
            an intact N terminal region alongside disrupted zinc finger function, which is the argument
            for dominant negative rather than haploinsufficient action.
        molecular_functions:
        - preferred_term: WT1 sequence-specific DNA binding
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: In ten independent cases of Denys-Drash syndrome, point mutations in the zinc finger
          domains of one WT1 gene copy were found.
        supports: SUPPORT
    origin:
