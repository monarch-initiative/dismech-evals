      assertion_type: Discussion
      assertion:
        discussion_id: wt1_continuum_vs_discrete_entity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Should Denys-Drash syndrome remain a distinct knowledge base entry, given that expert
          clinical practice has folded it into a WT1 disorder continuum?
        attaches_to:
        - disease#Denys-Drash Syndrome
        rationale: The GeneReviews WT1 Disorder chapter states that the Denys-Drash and Frasier designations
          are no longer clinically helpful and describes one phenotypic continuum. MONDO still carries
          separate terms, and there is no MONDO umbrella term for the continuum to bind, so the knowledge
          base cannot simply follow the clinical reframing. The mechanistic distinction is also real,
          a zinc finger missense dominant negative versus an intron 9 splice isoform imbalance, so collapsing
          the entries would lose a genuine mechanistic contrast. This entry is retained on that basis,
          with kb/groupings/WT1_Disorders.yaml carrying the continuum, and the question is recorded rather
          than silently resolved.
      selected_evidence:
        snippet: those designations are now recognized to be part of a phenotypic continuum and are no
          longer clinically helpful
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32352694
      reference_title: WT1 Disorder.
      evidence_source: HUMAN_CLINICAL
      explanation: The GeneReviews statement that motivates this gap, quoted so the entry does not assert
        a nosology its own baseline source contradicts.
