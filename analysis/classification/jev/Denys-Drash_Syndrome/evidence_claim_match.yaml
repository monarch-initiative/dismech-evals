          with focal segmental glomerulosclerosis, later kidney failure, and complete gonadal dysgenesis
          rather than diffuse mesangial sclerosis with early kidney failure.
        distinguishing_features:
        - Diffuse mesangial sclerosis with kidney failure usually before age five favors Denys-Drash syndrome.
        - Focal segmental glomerulosclerosis with later kidney failure and complete gonadal dysgenesis
          favors Frasier syndrome.
        - A zinc finger missense variant favors Denys-Drash syndrome; an intron 9 splice donor variant
          favors Frasier syndrome.
      selected_evidence:
        snippet: Here we show that a related disease, Frasier syndrome, characterized by focal glomerular
          sclerosis, delayed kidney failure and complete gonadal dysgenesis, is probably caused by specific
          intronic point mutations of WT1 that preferentially affect a CpG dinucleotide.
        supports: SUPPORT
