          allele. The name DHPS is also shared with bacterial dihydropteroate synthase, the sulfonamide
          target, which is a live source of literature-search confusion and has nothing to do with this
          gene.'
      selected_evidence:
        snippet: Hypusine is formed post-translationally from lysine and is found in a single cellular
          protein, eukaryotic translation initiation factor-5A (eIF5A), and its homolog eIF5A2.
        supports: SUPPORT
