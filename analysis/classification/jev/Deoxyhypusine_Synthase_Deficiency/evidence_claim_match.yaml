          name: Deoxyhypusine Synthase Deficiency
          disease_term:
            preferred_term: Deoxyhypusine synthase deficiency
            term:
              id: MONDO:0032775
              label: neurodevelopmental disorder with seizures and speech and walking impairment
        context: []
      assertion_type: Genetic
      assertion:
        name: DHPS
        association: Causal biallelic variant
        gene_term:
          preferred_term: DHPS
          term:
            id: hgnc:2869
            label: DHPS
        frequency: The only gene associated with this disorder.
        notes: 'Two things about interpreting a DHPS result.

          The recurrent allele matters more than its recurrence suggests. Every one of the five reported
          individuals carries c.518A>G p.(Asn173Ser) on one allele. That is not a founder effect established
          by haplotype - it has not been tested - but it does mean the disease as described is essentially
          the phenotype of one specific hypomorphic enzyme, and a patient with two different hypomorphs
          might look different.

          A biallelic-null genotype should not be expected and, if seen, should prompt a rethink. Dhps-null
          mice die as embryos, and the residual activity in reported patients comes from the missense
          allele. The name DHPS is also shared with bacterial dihydropteroate synthase, the sulfonamide
          target, which is a live source of literature-search confusion and has nothing to do with this
          gene.'
      selected_evidence:
        snippet: Our data suggest that rare biallelic variants in DHPS result in reduced enzyme activity
          that limits the hypusination of eIF5A and are associated with a neurodevelopmental disorder.
        supports: SUPPORT
