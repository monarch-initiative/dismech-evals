          target: Reduced GABAergic Interneuron Arborization
          direction: DECREASED
          interpretation: Anatomical correlate of the inhibitory deficit proposed to underlie the seizures.
        - name: Epileptiform electrophysiological activity
          target: Reduced GABAergic Interneuron Arborization
          direction: INCREASED
          interpretation: Functional correlate, measured in the same larvae as the anatomical deficit.
      selected_evidence:
        snippet: Our findings confirm that hypusination of eIF5A by DHPS is needed for early brain development,
          and zebrafish with an antisense knockdown of dhps model features of DHPS deficiency syndrome.
        supports: SUPPORT
