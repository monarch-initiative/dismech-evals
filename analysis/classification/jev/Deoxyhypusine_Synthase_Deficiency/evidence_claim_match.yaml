            label: Homo sapiens
        cell_source: iPSCs reprogrammed from a patient with biallelic DHPS variants (c.518A>G; c.1014+1G>A),
          with a double CRISPR-corrected isogenic line derived from the same patient as control.
        culture_system: Semi-guided cortical organoid protocol, suspension culture.
        publication: PMID:42239796
        modeled_mechanisms:
        - target: Altered Expression of Proteins Required for Neuronal Development
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Mutant organoids are significantly smaller than their isogenic controls, which
            is a developmental phenotype in human neural tissue carrying the patient alleles.
          limitations: Organoid diameter is a gross morphological readout, not a measurement of which
            proteins are altered, so the model demonstrates that the alleles impair human neurodevelopment
            without identifying the mechanism at this node. The authors also state the system lacks vascularization,
            immune components and long-range connectivity, and models early development only.
          readouts:
          - name: Cortical organoid diameter
            target: Altered Expression of Proteins Required for Neuronal Development
            direction: DECREASED
