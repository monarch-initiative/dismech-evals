      assertion_type: DifferentialDiagnosis
      assertion:
        name: DOHH deficiency
        description: The sibling disorder at the next step of the same pathway. DOHH catalyses the hydroxylation
          that converts deoxyhypusine to hypusine, so biallelic DOHH variants stall eIF5A one step further
          along and produce a similar neurodevelopmental phenotype. Only sequencing separates them - and
          microcephaly is a listed core feature there while it appears in one of five DHPS patients.
        notes: Deliberately left without a disease_term. MONDO carries the DOHH gene (HGNC:28662) but
          a search of the 2026 release returned no disease term for the DOHH-related neurodevelopmental
          disorder, which was described only in 2022. Rather than bind a plausible-looking neighbouring
          CURIE, the binding is omitted and the disorder is identified by gene and by the citation. Add
          the term when MONDO mints one.
        distinguishing_features:
        - Biallelic DOHH rather than DHPS
        - Accumulation of the deoxyhypusine intermediate rather than reduced deoxyhypusine formation
        - Microcephaly listed as a core feature
      selected_evidence:
        snippet: The DOHH variants are associated with a neurodevelopmental phenotype that is similar
          to phenotypes caused by DHPS or EIF5A variants and includes global developmental delay, intellectual
          disability, facial dysmorphism, and microcephaly.
        supports: SUPPORT
