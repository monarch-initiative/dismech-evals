  8d49af028b7971f586c5da87d32cdbda8520253a8dd24bc0fbdb0e4cc474bed2:
    claim:
      about:
        disease:
          name: Deoxyhypusine Synthase Deficiency
          disease_term:
            preferred_term: Deoxyhypusine synthase deficiency
            term:
              id: MONDO:0032775
              label: neurodevelopmental disorder with seizures and speech and walking impairment
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired eIF5A-Dependent Translation Elongation
        biological_scale: CELLULAR
        description: Hypusinated eIF5A binds the ribosome between the P and E sites and its hypusine side
          chain stabilises peptidyl-tRNA, letting the ribosome read through stalling motifs such as polyproline
          runs. Less hypusinated eIF5A therefore does not shut translation down globally; it biases which
          mRNAs are translated well, which is why the consequence is a specific set of proteins rather
          than general cell failure.
        biological_processes:
        - preferred_term: translational elongation
          modifier: DECREASED
          term:
            id: GO:0006414
            label: translational elongation
      selected_evidence:
        snippet: The hypusine side chain of eIF5A stabilizes the binding of the peptidyl tRNA to the 80S
          ribosome and facilitates peptide bond synthesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34688659
      reference_title: Neuron-specific ablation of eIF5A or deoxyhypusine synthase leads to impairments
        in growth, viability, neurodevelopment, and cognitive functions in mice.
      evidence_source: OTHER
      explanation: The molecular role of hypusine on the ribosome. Graded OTHER because it is a statement
        of established biochemistry in the paper's introduction rather than a result the paper reports.
