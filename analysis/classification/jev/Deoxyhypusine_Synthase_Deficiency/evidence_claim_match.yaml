        limitations: Morpholino knockdown rather than a genetic allele, with the usual off-target and
          transient-knockdown caveats and no stable mutant line. The knockdown is also dose-dependent
          and produces microcephaly, axis truncation and body curvature - a general developmental toxicity
          in which a specific interneuron phenotype is harder to attribute. Fidelity is recorded LOW for
          that reason, not because the finding is uninteresting.
        readouts:
