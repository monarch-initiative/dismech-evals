      assertion_type: AnimalModel
      assertion:
        name: Repetitive sulfur dioxide exposure mouse
        species: Mouse
        genotype: Wild-type, with a Sirtuin-3 overexpressing transgenic arm
        publication: PMID:38410870
        description: An inhalational model built around the sulfur dioxide exposure reported by the index
          cohort. It reproduces adaptive immune activation, airway wall remodeling and pulmonary vascular
          disease, and identifies endothelial oxidative stress (isolevuglandin adducts, SOD2 acetylation)
          as the driver of the vascular limb.
        modeled_mechanisms:
        - target: Distal Pulmonary Arterial Remodeling
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Repetitive sulfur dioxide produces pulmonary vascular remodeling that causes pulmonary
            hypertension and reduced exercise tolerance, and the remodeling is prevented by scavenging
            isolevuglandins or by Sirtuin-3 overexpression.
          limitations: Pulmonary hypertension has not been established as a feature of human DRCB; this
            model assigns the exercise limitation to the vascular compartment on the strength of a mouse
            phenotype. Sulfur dioxide is also only one of the candidate deployment exposures and was not
            reported by a substantial fraction of the index cohort.
          readouts:
          - name: Pulmonary vascular remodeling after isolevuglandin scavenging
            target: Distal Pulmonary Arterial Remodeling
            direction: ABOLISHED
            interpretation: Identifies the isolevuglandin-Sirt3-SOD2 oxidative axis as necessary for the
              vascular lesion in this model.
        - target: Sustained Club Cell Injury in Membranous Bronchioles
          relationship: PERTURBS
          fidelity: LOW
          model_scale: TISSUE
          description: Inhaled sulfur dioxide is delivered by the physiological route and produces airway
            wall remodeling, so unlike the CC-DTA model it tests an actual deployment-relevant inhalational
            exposure.
          limitations: The model does not demonstrate club-cell-specific injury; it shows airway wall
            remodeling downstream of an inhalational exposure, so the mapping onto this specific node
            is inferred from the CC-DTA work rather than shown here.
      selected_evidence:
        snippet: SO2 exposure led to increased formation of isolevuglandins (isoLGs) adducts and superoxide
          dismutase 2 (SOD2) acetylation in endothelial cells, which were attenuated by treatment with
          the isoLG scavenger 2-hydroxybenzylamine acetate (2-HOBA).
        supports: SUPPORT
