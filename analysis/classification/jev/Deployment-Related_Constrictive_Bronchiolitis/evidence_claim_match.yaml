  4269d9a3981ebbdd5ff57782e74123126138b64b27b2de2beb1ac6de7641c505:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: Prevalence
      assertion:
        population: US veterans deployed to Afghanistan and Southwest Asia (VA Cooperative Study "Service
          and Health Among Deployed Veterans", n=1960)
        measure_type: PERIOD_PREVALENCE
        prevalence_class: ABOVE_1_IN_1000
        rate_per_100000: 7300.0
        notes: Self-reported dyspnoea in the past 12 months in a deployed-veteran cohort. This is the
          symptom that brings personnel to evaluation, NOT the prevalence of biopsy-proven constrictive
          bronchiolitis, which is unknown because the diagnosis requires surgical lung biopsy and no population-based
          biopsy series exists.
      selected_evidence:
        snippet: The prevalence of dyspnoea, chronic bronchitis and wheeze in the past 12 months was 7.3%,
          8.2% and 15.6%, respectively.
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/0
      context_paths:
      - /name
