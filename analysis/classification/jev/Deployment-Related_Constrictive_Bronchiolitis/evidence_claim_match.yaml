      assertion_type: Pathophysiology
      assertion:
        name: Sustained Club Cell Injury in Membranous Bronchioles
        description: 'Club cells are the local progenitor population that repairs the distal airway epithelium
          after inhaled toxicant injury. Sustained loss of that progenitor compartment is the mechanistic
          hypothesis for how a diffuse inhalational exposure becomes a fibrotic small-airway lesion, and
          in mice it is sufficient on its own: no external antigen and no lymphocyte activation is required
          to produce constrictive bronchiolitis.'
        role: driver
        conforms_to: fibrotic_response#Tissue Injury
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: club cell
          term:
            id: CL:0000158
            label: club cell
        locations:
        - preferred_term: bronchiolar epithelium
          term:
            id: UBERON:0002051
            label: epithelium of bronchiole
        biological_processes:
        - preferred_term: Wound Healing
          term:
            id: GO:0042060
            label: wound healing
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Club cells are local progenitors critical for repairing the airway epithelium after exposure
          to various airborne toxins, and a prior study using an inducible transgenic murine model reported
          that 10 days of sustained targeted club cell injury causes constrictive bronchiolitis.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
