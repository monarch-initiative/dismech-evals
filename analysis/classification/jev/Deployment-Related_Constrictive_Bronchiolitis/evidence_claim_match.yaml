        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Asthma
        description: New-onset asthma is the other major post-deployment respiratory diagnosis and is
          the one for which the US Department of Veterans Affairs has issued a service-connection presumption.
          It is separated from constrictive bronchiolitis by bronchodilator responsiveness and by not
          requiring biopsy.
        distinguishing_features:
        - Reversible airflow obstruction with bronchodilator and controller response
        - Diagnosable noninvasively, without surgical lung biopsy
        - Constrictive bronchiolitis instead has fixed extrinsic airway narrowing, usually normal spirometry,
          and no approved pharmacotherapy
      selected_evidence:
        snippet: the Department of Veterans Affairs acknowledged these exposure–disease linkages and issued
          a presumption connecting asthma, chronic rhinitis, and sinusitis diagnosed within 10 years of
          military service in veterans with particulate matter exposure during SWA military deployment
          (9).
        supports: SUPPORT
