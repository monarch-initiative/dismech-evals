        description: Airway walls carry a more than three-fold increase in CD4 and CD8 T cells, with B-cell
          lymphoid follicles adjacent to small airways in 64% of affected soldiers and within alveolar
          tissue in 56%, against 12% and 6% in non-diseased controls. Airway tissue gene expression is
          skewed to Th1-type pro-inflammatory programs. This chronic adaptive immune activation is the
          reason the disease is suspected of being progressive rather than a fixed scar.
        notes: 'This node deliberately has no upstream edge. The sources establish the lymphocytic infiltrate
          and the follicles as a disease feature against controls, and they establish that a range of
          deployment inhalational exposures precede the syndrome, but none of them demonstrates which
          mechanism node drives the adaptive immune arm. PMID:34954211 argues the other way for the obvious
          candidate: in the mouse, sustained club cell injury reproduces the fibrotic lesion with no external
          antigen and no lymphocyte activation required. The node is therefore left rootless rather than
          attached to a guess.'
