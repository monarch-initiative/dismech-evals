  ed6770734f5981f9d9cb87629abf32a88ef0282a9be8f7c7f0938a9507f54695:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: AnimalModel
      assertion:
        name: CC-DTA sustained club cell injury mouse
        species: Mouse
        genotype: CC-DTA (club-cell-restricted, doxycycline-inducible diphtheria toxin A), doxycycline
          for 10 consecutive days
        publication: PMID:34954211
        description: An inducible transgenic model in which diphtheria toxin A expression is restricted
          to club cells, producing sustained progenitor-cell injury without any inhaled toxicant. It reproduces
          the epithelial, inflammatory and fibrotic features of DRCB and allows the macrophage-TGF-beta
          limb to be tested interventionally.
        modeled_mechanisms:
        - target: Sustained Club Cell Injury in Membranous Bronchioles
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The model imposes the node directly, by targeted club cell death, rather than reproducing
            the exposure that is thought to cause it in humans.
          limitations: Club cell death is induced genetically by diphtheria toxin A, not by inhaled particulate
            matter, so the model asserts nothing about which deployment exposure produces club cell injury
            or at what dose. The authors chose this design precisely because the causative exposure type,
            dose and duration in humans are unknown.
        - target: TGF-beta Activation and Myofibroblast Recruitment
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Depleting alveolar macrophages with clodronate liposomes lowers free active TGF-beta1
            and reduces peribronchiolar collagen, placing macrophage-driven TGF-beta activation causally
            upstream of the fibrotic lesion.
          limitations: Clodronate liposome depletion is not compartment-selective over time, since exudate
            macrophages rebounded 7.3-fold, so the experiment cannot separate alveolar from recruited
            macrophage contributions, and the authors note an antifibrotic role for the rebounding population
            cannot be excluded.
          readouts:
          - name: Peribronchiolar collagen deposition
            target: TGF-beta Activation and Myofibroblast Recruitment
            direction: DECREASED
            interpretation: Macrophage depletion reduces the matrix endpoint of the fibrotic limb.
          - name: Free active TGF-beta1 in bronchoalveolar lavage fluid
            target: TGF-beta Activation and Myofibroblast Recruitment
            direction: DECREASED
            interpretation: Confirms the mediator itself falls, not only its downstream matrix endpoint.
        - target: Subepithelial Fibrosis and Smooth Muscle Hypertrophy Narrowing Membranous Bronchioles
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Sustained club cell injury produces airway wall thickening with subepithelial matrix
            deposition, peribronchiolar infiltrates and intraluminal macrophage clusters that match the
            human lesion.
          limitations: 'The comparison on the human side rested on a very small amount of tissue: the
            authors state that quantitative or semiquantitative analysis of macrophage accumulation in
            DRCB was constrained by the paucity of research tissue, so the correspondence is qualitative
            and image-based.'
      selected_evidence:
        snippet: Collectively, these findings implicate sustained club cell injury in the development
          of DRCB and delineate pathways that may yield biomarkers and treatment targets for this disorder.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:34954211
      reference_title: Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related
        Constrictive Bronchiolitis.
      evidence_source: MODEL_ORGANISM
      explanation: The authors' own statement of what the model is informative for.
