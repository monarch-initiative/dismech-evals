  9c488cfd328ab669b3ff4c4d9c66e56515d63a42a591f56774922cc48291aa39:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kgap_exposure_dose_response
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which specific deployment exposures, at what dose and duration, produce small airways
          disease?
        attaches_to:
        - environmental#Deployment inhalation of respirable particulate matter
        - pathophysiology#Distal Deposition of Respirable Deployment Particulate Matter
        rationale: Individual-level exposure was never measured during deployment, so every exposure-response
          analysis rests on retrospective self-report. The index cohort contains soldiers with an identified
          point-source exposure and soldiers with none whose disease was indistinguishable, so no single
          agent accounts for the entity. Closing this gap requires either historical exposure reconstruction
          or prospective monitoring in future deployments.
      selected_evidence:
        snippet: the extent and mechanisms through which specific exposures result in impaired pulmonary
          function, small airways disease, and potentially future chronic pulmonary diseases
        supports: SUPPORT
