  7f9f23084574af775ed8d7e0e84f3a40cc4b54eb4e7c0767fe7bab1738737e5e:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: Environmental
      assertion:
        name: Deployment inhalation of respirable particulate matter
        description: Land-based deployers to Afghanistan and Southwest Asia inhaled high concentrations
          of respirable particulate matter from geologic desert dust, open-air burn pit smoke, engine
          and generator exhaust, and occupational vapours, gases, dusts and fumes. Individual-level exposure
          was never systematically measured during deployment, which is the principal limitation of every
          exposure-response analysis in this disease.
        exposure_term:
          preferred_term: exposure to respirable particulate matter during military deployment
          term:
            id: ECTO:7000116
            label: exposure to respirable suspended particulate matter
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
            notes: Respirable particulate matter is a chemical/mineral agent in the occupational-hygiene
              schemes, not a physical or biological agent.
          exposure_route:
          - classification_value: INHALATION
            notes: Only the respirable fraction reaching the membranous and respiratory bronchioles is
              relevant to this lesion.
          exposure_duration:
          - classification_value: INTERMEDIATE
            notes: ATSDR intermediate duration (15-364 days), matching the median 11.7 month deployment
              in the VA cooperative cohort; repeat deployments push some individuals into the chronic
              band.
          exposome_domain:
          - classification_value: SPECIFIC_EXTERNAL
            notes: An identifiable, occupationally bounded external agent in Wild's specific external
              domain.
      selected_evidence:
        snippet: Workshop participants agreed that there is substantial evidence linking deployment-related
          exposures to respiratory symptoms, pulmonary diagnoses, and lung pathology.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:42360728
      reference_title: 'Deployment-related respiratory health: bridging the gap between clinical and epidemiological
        associations and disease mechanisms: an official American Thoracic Society Workshop Report.'
      evidence_source: HUMAN_CLINICAL
      explanation: ATS workshop consensus that the exposure-disease link is supported, which is the warrant
        for treating deployment exposure as causal here.
    first_seen_at: '2026-10-03T22:37:05.021550+00:00'
