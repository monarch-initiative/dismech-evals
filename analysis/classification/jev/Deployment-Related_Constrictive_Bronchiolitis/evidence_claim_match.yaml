      reference: PMID:37968126
      reference_title: Chronic respiratory symptoms following deployment-related occupational and environmental
        exposures among US veterans.
      evidence_source: HUMAN_CLINICAL
      explanation: Gives the denominator-based symptom prevalence in a deployed veteran cohort, which
        is the population from which DRCB cases are drawn.
