      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: The disease ends military careers. In the original Fort Campbell series half of the
          affected soldiers left the service with a disability rating, and the symptom is by definition
          one that prevents meeting an occupational fitness requirement.
      selected_evidence:
        snippet: Of the 38 soldiers with constrictive bronchiolitis, 19 (50%) had left the service with
          a disability rating
        supports: SUPPORT
