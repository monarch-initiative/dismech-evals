  d98831fa1fe0b4f79cbf5446fcbcc5f559f6a10611932115a32f8f8f9066d96c:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kgap_particulate_causality
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the retained peribronchiolar particulate material causal, or only a marker of exposure
          intensity?
        attaches_to:
        - pathophysiology#Retained Peribronchiolar Particulate Burden
        rationale: Near every biopsy in the index series showed peribronchiolar pigment with polarizable
          material, and burn-pit combustion signatures are recoverable from lung tissue, but no study
          has shown that the retained material drives the fibrotic lesion rather than co-occurring with
          the exposure that does. The 2026 ATS workshop names this explicitly as one of three outstanding
          gaps, and the leading mechanistic model deliberately bypasses the question by inducing club
          cell injury genetically.
      selected_evidence:
        snippet: the contribution of exposure-related foreign material in the lung to clinical and pathologic
          findings
        supports: SUPPORT
