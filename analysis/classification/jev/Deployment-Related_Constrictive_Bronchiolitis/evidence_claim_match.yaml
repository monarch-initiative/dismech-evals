  4a623f1bfe86ae4b2f6bd95ea23a8b482528aa613f0b082ec0bdd33dc0258598:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hmm_pulmonary_hypertension_vascular_limb
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: The sulfur dioxide mouse attributes exercise limitation to pulmonary vascular disease
          rather than to the airway lesion; does that hold in humans, where pulmonary hypertension is
          not an established feature of this disease?
        attaches_to:
        - pathophysiology#Distal Pulmonary Arterial Remodeling
        - phenotypes#Exercise intolerance
        rationale: In the sulfur dioxide model, small airway abnormalities were explicitly not sufficient
          to alter lung mechanics, and it was pulmonary vascular remodeling that produced pulmonary hypertension
          and reduced exercise tolerance. Human morphometry does show arterial muscularization and raised
          wall-to-lumen ratio in the same lungs, so the substrate is present, but pulmonary hypertension
          is not a reported clinical feature of DRCB and the human exercise limitation is usually attributed
          to the airway lesion. If the mouse is right, the disease is being investigated in the wrong
          compartment and the diagnostic pathway, which is built around airway histology, is looking in
          the wrong place. If it is wrong, the model's headline physiological result does not transfer.
        proposed_experiments:
        - experiment_id: exp_drcb_exercise_hemodynamics
          name: Right heart catheterisation and cardiopulmonary exercise testing in biopsy-proven DRCB
          description: Measure pulmonary artery pressures and pulmonary vascular resistance at rest and
            during exercise in individuals with biopsy-proven DRCB, alongside quantitative-CT small airways
            measures, and test which better explains the exercise limitation.
          would_support:
          - pathophysiology#Distal Pulmonary Arterial Remodeling
          supporting_outcome:
          - Exercise pulmonary vascular resistance correlates with exercise limitation independently of
            quantitative-CT functional small airways disease.
          would_refute:
          - pathophysiology#Distal Pulmonary Arterial Remodeling
          refuting_outcome:
          - Pulmonary haemodynamics are normal at rest and on exercise, and the limitation tracks small
            airways measures alone.
      selected_evidence:
        snippet: Although abnormalities in small airways were not sufficient to alter lung mechanics,
          PV remodeling resulted in the development of pulmonary hypertension and reduced exercise tolerance
          in SO2-exposed mice.
        supports: SUPPORT
        directness: INDIRECT
