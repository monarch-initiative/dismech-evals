  8547e3522dc233e06bb73e310875ed4a132ae2de11bff7a55f707632ae222c10:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Distal Pulmonary Arterial Remodeling
        description: 'Pulmonary arteries running with the affected bronchovascular bundles are themselves
          remodeled: medial smooth-muscle hypertrophy plus adventitial thickening raise the wall-to-lumen
          ratio. In the sulfur dioxide mouse model this vascular limb, not the airway limb, is what produces
          pulmonary hypertension and reduced exercise tolerance, and it is driven by endothelial oxidative
          stress via isolevuglandin adducts and SOD2 acetylation.'
        notes: This node deliberately has no upstream edge. PMID:34081035 finds the arterial remodeling
          in arteries adjacent to affected bronchioles, but treats it as one compartment of a diffuse
          multicompartment injury rather than as a consequence of the airway lesion, and no source in
          this entry establishes a mechanism node upstream of it in humans. The one causal account available
          is the SO2 mouse, whose ROS/isoLG/Sirt3-SOD2 route is recorded on that model's modeled_mechanisms
          link rather than asserted as a human pathograph edge.
        role: driver
        biological_scale: TISSUE
        cell_types:
        - preferred_term: pulmonary arterial smooth muscle cell
          term:
            id: CL:0002591
            label: smooth muscle cell of the pulmonary artery
        locations:
        - preferred_term: pulmonary artery
          term:
            id: UBERON:0002012
            label: pulmonary artery
        biological_processes:
        - preferred_term: Smooth Muscle Cell Proliferation
          term:
            id: GO:0048661
            label: positive regulation of smooth muscle cell proliferation
          modifier: INCREASED
        - preferred_term: Response to Oxidative Stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: In adjacent arteries, smooth muscle hypertrophy and adventitial thickening resulted in
          increased wall-to-lumen ratio in affected soldiers.
        supports: SUPPORT
    origin:
