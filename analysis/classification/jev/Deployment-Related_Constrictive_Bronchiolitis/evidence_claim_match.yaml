  87f697f6bc996d6b839f48370c1af899d3435c29ad66d52764eb33d06d4bac83:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interp_drcb_pdrs_drrd_naming
        kind: INTERPRETATION
        status: OPEN
        prompt: Is this entry one disease with three names, or has the entity's scope genuinely widened
          from a bronchiolar lesion to a multicompartmental one?
        attaches_to:
        - disease#Deployment-Related Constrictive Bronchiolitis
        - pathophysiology#Subepithelial Fibrosis and Smooth Muscle Hypertrophy Narrowing Membranous Bronchioles
        - pathophysiology#Interalveolar Septal Fibrosis and Capillary Rarefaction
        - pathophysiology#Visceral Pleural Inflammation and Fibrosis
        rationale: 'The 2011 index series described a bronchiolocentric lesion in otherwise normal parenchyma.
          Quantitative morphometry of overlapping and later biopsies then found arterial, alveolar-septal
          and pleural changes in the same lungs, and the Vanderbilt group renamed the entity post-deployment
          respiratory syndrome to reflect that. A 2023 Delphi panel took a third position: it kept constrictive
          bronchiolitis as a histologic pattern and introduced deployment-related respiratory disease
          as a broad clinical descriptor subsuming it. These are not simply synonyms, because they disagree
          about whether the bronchiole is the seat of the disease. This entry is curated at the biopsy-defined
          entity and records all three names as synonyms, with the non-bronchiolar compartments as their
          own pathophysiology nodes so the disagreement is visible in the pathograph rather than buried
          in prose.'
      selected_evidence:
        snippet: deployment-related respiratory disease (DRRD) was proposed as a broad term to subsume
          a wide range of potential syndromes and conditions identified through noninvasive evaluation
          or when surgical lung biopsy reveals evidence of multicompartmental lung injury that may include
          CB.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:36343686
      reference_title: 'Consensus Statements on Deployment-Related Respiratory Disease, Inclusive of Constrictive
        Bronchiolitis: A Modified Delphi Study.'
      evidence_source: OTHER
      explanation: The consensus position that DRRD is the umbrella and CB one pattern within it.
