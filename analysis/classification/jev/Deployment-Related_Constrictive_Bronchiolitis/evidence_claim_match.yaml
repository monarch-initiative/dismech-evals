  bf88a1064f570e9c6b8cb5286890cba3f1a0298281e0a0ab9fce3c3695e8f3e5:
    claim:
      about:
        disease:
          name: Deployment-Related Constrictive Bronchiolitis
        context: []
      assertion_type: Prevalence
      assertion:
        population: Fort Campbell soldiers referred for unexplained post-deployment exertional dyspnea
          who proceeded to surgical lung biopsy (n=49)
        measure_type: UNKNOWN
        prevalence_class: COMMON
        notes: 'A referral-series proportion, not a population rate: 38 of 49 biopsied soldiers had constrictive
          bronchiolitis. It says how often the lesion explains otherwise-unexplained post-deployment dyspnea,
          and says nothing about how common the disease is among deployers.'
      selected_evidence:
        snippet: Of the 49 soldiers who underwent lung biopsy, all biopsy samples were abnormal, with
          38 soldiers having changes that were diagnostic of constrictive bronchiolitis.
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/1
      evidence_path: /prevalence/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:21774710
      reference_title: Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan.
      evidence_source: HUMAN_CLINICAL
      explanation: Source of the 38/49 referral-series proportion, and of the observation that every biopsy
        in the series was abnormal.
