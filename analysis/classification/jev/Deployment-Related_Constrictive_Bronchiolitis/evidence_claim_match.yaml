          entity and records all three names as synonyms, with the non-bronchiolar compartments as their
          own pathophysiology nodes so the disagreement is visible in the pathograph rather than buried
          in prose.'
      selected_evidence:
        snippet: Diffuse fibrosis with excessive collagen accumulation in airway walls, blood vessel walls,
          alveolar tissue, and visceral pleura is a prominent pathologic feature detected in the lungs
          of soldiers with PDRS.
        supports: SUPPORT
