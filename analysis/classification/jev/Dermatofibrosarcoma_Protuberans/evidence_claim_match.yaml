      assertion:
        phase: Indolent cutaneous growth with local recurrence and rare fibrosarcomatous transformation
        age_range: Adulthood
        notes: DFSP typically exhibits indolent dermal and subcutaneous growth with a high propensity
          for local recurrence after incomplete excision, while distant metastasis (<5% of cases) almost
          always follows prior local relapses or high-grade fibrosarcomatous transformation.
      selected_evidence:
        snippet: Although the cases of metastatic DFSP do not reach 5 % of the total, almost all of them
          appear after previous local relapses. The prognosis for metastatic cases is very poor with a
          survival of less than 2 years following detection of metastatic disease.
        supports: SUPPORT
