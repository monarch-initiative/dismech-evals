      assertion_type: Genetic
      assertion:
        name: ADAMTS2
        gene_term:
          preferred_term: ADAMTS2
          term:
            id: hgnc:218
            label: ADAMTS2
        relationship_type: CAUSATIVE
        notes: ADAMTS2 encodes procollagen I N-proteinase. Reported disease alleles are predominantly
          truncating and are scattered across the gene rather than concentrated in a functional region,
          which fits a straightforward loss-of-function mechanism. This is worth stating explicitly because
          it is the opposite of the pattern seen in several other EDS subtypes, where the position of
          a missense variant within a collagen chain determines both subtype and severity. Here the question
          is only whether the allele makes working enzyme.
      selected_evidence:
        snippet: We identified three novel homozygous loss-of-function mutations
        supports: SUPPORT
