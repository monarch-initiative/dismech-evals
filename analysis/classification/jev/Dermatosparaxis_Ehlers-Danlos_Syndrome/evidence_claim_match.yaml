      assertion_type: Biochemical
      assertion:
        name: pNalpha1(I) and pNalpha2(I) procollagen accumulation in dermal fibroblasts
        presence: INCREASED
        context: The biochemical hallmark of the disease and the basis of the collagen-processing diagnostic
          assay. Pulse-labelled fibrillar (pro)collagen chains secreted by cultured dermal fibroblasts
          are separated by SDS-PAGE and visualised by fluorography; because ADAMTS2 cannot excise the
          aminopropeptide, the pN-collagen bands accumulate while the fully processed pC-collagen and
          mature collagen bands are reduced or absent. This is a processing signature rather than a quantity
          signature - overall pepsin-digested collagen content is normal.
        readouts:
        - target: Failure of Procollagen N-Propeptide Excision
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Direct biochemical demonstration, in patient-derived cells, of the unprocessed
            procollagen species that the enzymatic defect is predicted to leave behind.
        cell_types:
        - preferred_term: cultured dermal fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
      selected_evidence:
        snippet: Procollagen analysis showed the characteristic accu- mulation of the bands representing
          pNα 1(I) and pNα 2(I) procollagen chains, although the accumulation was variable between patients
        supports: SUPPORT
