      assertion_type: Treatment
      assertion:
        name: Skin Protection and Wound Care
        therapeutic_modality: BEHAVIORAL
        description: 'No therapy addresses the enzymatic defect, and that is a documented position rather
          than an absence of searching: the EDS care-pathway review states there is no specific treatment
          for non-vascular EDS and that management is symptomatic, multidisciplinary and personalised.
          In practice that means avoiding trauma, careful consideration of skin closure techniques and
          manual handling, thorough investigation of acute pain, and caution with adhesive dressings,
          which can themselves tear the skin.'
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Discussion of management considerations includes thorough investigations of acute pain,
          careful consideration of skin closure techniques and manual handling, as well as monitoring
          for reduced bone mineral density after low-impact fracture and/or post-menopause.
        supports: SUPPORT
