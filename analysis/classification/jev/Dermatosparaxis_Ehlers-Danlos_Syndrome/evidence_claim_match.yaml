  2f05985e35294a4cc0f999e64d2c1fc573eed9ca78e6971d465a942c56e86070:
    claim:
      about:
        disease:
          name: Dermatosparaxis Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: Ehlers-Danlos syndrome, dermatosparaxis type
            term:
              id: MONDO:0009161
              label: Ehlers-Danlos syndrome, dermatosparaxis type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hieroglyphic Collagen Fibril Assembly
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: Retained N-propeptides end up on the surface of the assembling fibril, in the overlap
          zone of the D-period. Being there, they prevent the fibril from achieving a circular cross-section,
          and the fibril grows as a flattened, branching ribbon - "hieroglyphic" in transverse section,
          and in the most severely affected skin appearing as sheets rather than discrete fibrils. The
          dermatosparactic calf, in which this was quantified, carried 57% pN-collagen in its dermal fibrils.
          Notably the propeptides on such fibrils can no longer be removed even by exogenous N-proteinase,
          so the lesion is self-locking once assembly has occurred.
        biological_processes:
        - preferred_term: collagen fibril organization
          modifier: ABNORMAL
          term:
            id: GO:0030199
            label: collagen fibril organization
        - preferred_term: extracellular matrix organization
          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
        locations:
        - preferred_term: dermis
          term:
            id: UBERON:0002067
            label: dermis
      selected_evidence:
        snippet: the collagen fibrils in the skin of a dermatosparactic calf contained 57% type I pNcollagen
          and 43% type I collagen and the fibrils were irregularly arranged in bundles and hieroglyphic
          in cross-section
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
