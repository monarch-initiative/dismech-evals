  ef9e3e266158059ba08bafde7b4c24aed9b2929e3e374c49e98f0f382f0214f1:
    claim:
      about:
        disease:
          name: Dermatosparaxis Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: Ehlers-Danlos syndrome, dermatosparaxis type
            term:
              id: MONDO:0009161
              label: Ehlers-Danlos syndrome, dermatosparaxis type
        context: []
      assertion_type: Variant
      assertion:
        name: In-frame exon-skipping genomic deletions (exons 3-5, exons 14-16)
        description: A distinct allele class alongside the predominant truncating (nonsense/frameshift/splice)
          alleles. Genomic deletions remove exons 3-5 or exons 14-16 from the transcript without shifting
          the reading frame, so the resulting ADAMTS2 protein is missing an internal domain rather than
          being absent or grossly truncated. Neither deleted region had previously been recognised as
          functionally critical, but aminoprocollagen processing was still strongly impaired, so this
          class extends the requirement for intact enzyme structure beyond the domains already implicated
          by nonsense alleles.
        gene:
          preferred_term: ADAMTS2
          term:
            id: hgnc:218
            label: ADAMTS2
        clinical_significance: PATHOGENIC
        type: in-frame deletion (exon skipping)
        functional_effects:
        - function: procollagen I N-proteinase (aminoprocollagen) processing
          description: Removing exons 3-5 or exons 14-16 leaves the reading frame intact, so the protein
            is internally shortened rather than truncated or absent, yet aminoprocollagen processing is
            still strongly impaired both in vitro and in vivo. The affected domains had not previously
            been recognised as crucial for ADAMTS-2 activity.
          type: loss-of-function
      selected_evidence:
        snippet: The first patient was homozygous for a genomic deletion causing an in-frame skipping
          of exons 3-5 in the transcript. In the second patient, the allele inherited from the mother
          lacks exon 3, generating a premature stop codon, whereas the paternal allele has a genomic deletion
          resulting in an in-frame skipping of exons 14-16 at the mRNA level.
        supports: SUPPORT
    origin:
      assertion_path: /variants/0
      evidence_path: /variants/0/evidence/0
      context_paths:
