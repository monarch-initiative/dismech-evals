      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Two loss-of-function ADAMTS2 alleles are required, either in homozygous form or as
          compound heterozygotes. Heterozygous carriers are unaffected - roughly half-normal N-proteinase
          activity is sufficient to process procollagen, which is why this disease has no dominant counterpart
          in the way that several other EDS subtypes do.
      selected_evidence:
        snippet: The Ehlers-Danlos syndrome (EDS), dermatosparaxis type, is a recessively inherited connective
          tissue disorder caused by deficient activity of ADAMTS-2
        supports: SUPPORT
