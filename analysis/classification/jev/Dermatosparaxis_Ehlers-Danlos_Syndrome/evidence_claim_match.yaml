              label: Ehlers-Danlos syndrome, dermatosparaxis type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ADAMTS2 Loss of Function
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Both ADAMTS2 alleles carry variants that abolish procollagen I N-proteinase activity.
          The reported alleles are overwhelmingly truncating - nonsense, frameshift and splice variants
          distributed across the gene rather than clustered in one domain - which is consistent with the
          mechanism being simple loss of the enzyme rather than any position-specific effect on how it
          behaves. Five of the first six patients identified were homozygous for the same nonsense allele,
          Q225X.
        genetic_context:
          gene:
            preferred_term: ADAMTS2
            term:
              id: hgnc:218
              label: ADAMTS2
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: procollagen I N-proteinase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
        cell_types:
        - preferred_term: dermal fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
      selected_evidence:
        snippet: These data provide direct evidence that EDS type VIIC and dermatosparaxis result from
          mutations in the pNPI gene.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
