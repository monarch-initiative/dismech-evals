  820b93ba2ba8f5f4cbea3aef1250f8cb4e3ecf0855622e5d2c1cbe7b96ed6e27:
    claim:
      about:
        disease:
          name: Dermatosparaxis Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: Ehlers-Danlos syndrome, dermatosparaxis type
            term:
              id: MONDO:0009161
              label: Ehlers-Danlos syndrome, dermatosparaxis type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Procollagen N-Propeptide Excision
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'ADAMTS2 normally cleaves the aminoterminal propeptide from types I, II and III procollagen.
          Without it the N-propeptide is retained and the secreted molecule remains pN-collagen. This
          is a processing defect, not a synthesis defect: the amount of collagen protein reaching the
          matrix is not reduced, only its maturation state. ADAMTS3 and ADAMTS14 are homologous N-proteinases
          but do not compensate in skin, which is why the phenotype is dermatological even though the
          substrate is ubiquitous.'
        biological_processes:
        - preferred_term: protein processing
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0016485
            label: protein processing
        - preferred_term: collagen biosynthetic process
          modifier: ABNORMAL
          term:
            id: GO:0032964
            label: collagen biosynthetic process
      selected_evidence:
        snippet: 'the amino-propeptide is usually processed by procollagen N-proteinases: ADAMTS2, 3 and
          14'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25863161
      reference_title: The procollagen N-proteinases ADAMTS2, 3 and 14 in pathophysiology.
      evidence_source: OTHER
      explanation: 'Establishes that ADAMTS2 belongs to a three-member family, which is what makes the
        absence of compensation in skin a substantive observation rather than an assumption. Graded OTHER
        rather than IN_VITRO: the publication is a review and this sentence is its background statement,
        not an experiment it reports.'
