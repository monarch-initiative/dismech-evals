        name: Generalised Connective Tissue Fragility
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        description: 'Type I collagen is not confined to skin, so the processing defect is expressed wherever
          fibrillar collagen carries load. Clinically this appears as umbilical and inguinal herniation,
          joint laxity, craniofacial features reflecting a soft cranial vault with wide sutures and large
          fontanelles, and - in the more severely affected - visceral and vascular fragility including
          bladder and diaphragmatic rupture. The severity of this systemic component is what the 2016
          expansion of the phenotype turned on: three of five newly reported patients were substantially
          milder than every previously published case, so the multisystem burden is variable rather than
          obligate.'
