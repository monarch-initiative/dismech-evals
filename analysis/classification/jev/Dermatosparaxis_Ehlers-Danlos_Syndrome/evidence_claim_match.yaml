      assertion_type: Diagnosis
      assertion:
        name: Coagulation Studies Can Be Normal Despite Clinically Significant Bleeding
        description: Routine coagulation testing is not a reliable way to rule out or explain the bleeding
          complications seen in this disease, because the underlying defect is structural (connective-tissue
          and vascular fragility) rather than a disorder of the coagulation cascade itself. A negative
          coagulation workup should not be read as evidence against a bleeding complication being disease-related.
        diagnosis_term:
          preferred_term: coagulation testing
          term:
            id: NCIT:C112239
            label: Coagulation Index Measurement
      selected_evidence:
        snippet: Complete blood count, basic metabolic panel, lipid panel, and coagulation profile were
          normal. Factor assay and rotational thromboelastometry were within normal limits.
        supports: SUPPORT
