          name: Dermatosparaxis Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: Ehlers-Danlos syndrome, dermatosparaxis type
            term:
              id: MONDO:0009161
              label: Ehlers-Danlos syndrome, dermatosparaxis type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Dermal Tensile Strength
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: The tensile strength of dermis depends on near-cylindrical fibrils packing closely
          enough to interact along their length. Ribbon-shaped fibrils cannot do that, so load is no longer
          distributed between fibrils and the tissue tears at low force. This is the step at which a molecular
          processing defect becomes a mechanical one, and it explains why the skin is simultaneously fragile
          and redundant - the same loss of fibril-fibril engagement that lets it tear also lets it stretch
          and hang.
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
        locations:
        - preferred_term: skin of body
          term:
            id: UBERON:0002097
            label: skin of body
      selected_evidence:
        snippet: Partial loss of enzyme activity results in accumulation of pNcollagen (collagen with
          N-propeptides) and abnormal collagen fibrils in the fragile skin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9571043
      reference_title: Surface located procollagen N-propeptides on dermatosparactic collagen fibrils
        are not cleaved by procollagen N-proteinase and do not inhibit binding of decorin to the fibril
        surface.
      evidence_source: MODEL_ORGANISM
      explanation: Links the accumulated pN-collagen directly to the fragility of the skin.
