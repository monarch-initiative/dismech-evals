      assertion_type: Pathophysiology
      assertion:
        name: Mature Tri-Lineage Tissue Differentiation
        description: 'Within the cyst, the activated germ cell differentiates into mature, well-differentiated
          somatic tissues, with ectodermal derivatives predominating: a wall lined by keratinizing squamous
          epithelium with numerous adnexal structures (hair follicles, sebaceous glands, occasional apocrine
          glands and teeth), surrounded by a dense, concentrically arranged collagen stroma. The cyst
          lumen accumulates lamellar keratin, hair, and sebaceous material. At craniofacial and cutaneous
          sites the equivalent histology arises instead from ectoderm entrapped during midline fusion.

          '
        cell_types:
        - preferred_term: keratinizing squamous epithelial cell
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: sebaceous gland cell
          term:
            id: CL:2000021
            label: sebaceous gland cell
        biological_processes:
        - preferred_term: keratinocyte differentiation
          term:
            id: GO:0030216
            label: keratinocyte differentiation
        - preferred_term: hair follicle development
          term:
            id: GO:0001942
            label: hair follicle development
      selected_evidence:
        snippet: follicular tumors are classified according to the differentiation pattern seen in the
          corresponding part of the normal hair follicle
        supports: SUPPORT
