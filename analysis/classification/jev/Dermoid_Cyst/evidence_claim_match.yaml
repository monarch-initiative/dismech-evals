      assertion_type: Pathophysiology
      assertion:
        name: Germ Cell Parthenogenetic Origin
        description: 'Ovarian mature cystic teratoma originates from a single ovarian germ cell/oocyte
          that develops parthenogenetically (without fertilization). The tumor typically arises after
          completion of meiosis I with failure of meiosis II, producing a near-diploid genome that contains
          only maternal genetic material. This parthenogenetic origin explains the largely cytogenetically
          bland karyotype and the characteristic imprinting abnormalities of these tumors, distinguishing
          them from malignant germ cell tumors driven by isochromosome 12p and somatic mutation.

          '
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
        - preferred_term: granulosa cell
          term:
            id: CL:0000501
            label: granulosa cell
        biological_processes:
        - preferred_term: egg activation (parthenogenetic oocyte activation)
          term:
            id: GO:0007343
            label: egg activation
          modifier: INCREASED
        - preferred_term: meiotic cell cycle
          term:
            id: GO:0051321
            label: meiotic cell cycle
      selected_evidence:
        snippet: Precursory germ cells of the ovary form the basis of GCT.
        supports: SUPPORT
