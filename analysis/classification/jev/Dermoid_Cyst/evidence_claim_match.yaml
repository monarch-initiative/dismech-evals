      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Embryonic Midline Fusion and Ectodermal Entrapment
        description: 'For craniofacial, nasal, orbital, ocular-surface, and cutaneous dermoid cysts, the
          lesion arises developmentally rather than from a germ cell. Surface ectoderm becomes entrapped
          during fusion of the facial prominences and midline seam closure (the ectodermal-inclusion and
          embryonic closure-defect theories), producing an epithelial-lined cavity that contains epidermis,
          dermis, and adnexal structures. Nasal dermoids may retain a sinus tract and, in a subset, intracranial
          extension.

          '
        biological_processes:
        - preferred_term: multicellular organism development
          term:
            id: GO:0007275
            label: multicellular organism development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Developmental midline nasal masses including nasal dermoids (NDs), encephaloceles (EPHCs),
          and nasal glial heterotopias (NGHs) are a consequence of disrupted embryonal developmental processes
          in the frontonasal region.
        supports: SUPPORT
