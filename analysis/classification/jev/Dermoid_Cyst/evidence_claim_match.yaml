              label: dermoid cyst
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BMP15 / H-Ras-MAPK Dysregulation in Hereditary Ovarian Teratoma
        description: 'In a rare hereditary, X-linked dominant ovarian (immature) teratoma, a germline
          BMP15 missense mutation (C262T; p.Arg88Cys) reduces secretion of mature BMP15 by ~85%. Loss
          of BMP15 oocyte growth-factor signaling is associated with abnormal activation of the H-Ras/MAPK
          pathway in oocytes, which markedly increases the rate of spontaneous parthenogenetic activation
          and predisposes to teratoma formation. This defines a molecular, germline-mediated route to
          the parthenogenetic origin seen in sporadic tumors.

          '
        genes:
        - preferred_term: BMP15
          term:
            id: hgnc:1068
            label: BMP15
        biological_processes:
        - preferred_term: MAPK cascade activation
          term:
            id: GO:0043410
            label: positive regulation of MAPK cascade
          modifier: INCREASED
      selected_evidence:
        snippet: In the transgenic mouse model, the spontaneous parthenogenetic activation significantly
          increased in oocytes carrying the T allele.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
