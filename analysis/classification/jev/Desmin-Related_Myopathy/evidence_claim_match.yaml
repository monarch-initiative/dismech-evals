            label: DES
        relationship_type: CAUSATIVE
        notes: Desmin is the muscle-specific type III intermediate filament protein that links Z-discs
          to each other, to the sarcolemma (costameres), the nucleus, mitochondria and, in the heart,
          the intercalated discs. Dominant rod-domain missense variants (hotspot coil 2B, around R350P)
          act dominant-negatively; biallelic loss-of-function variants cause the recessive spectrum.
      selected_evidence:
