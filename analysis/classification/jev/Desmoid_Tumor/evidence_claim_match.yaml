      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant (FAP-associated subset)
        description: The sporadic form is not heritable; the driver is a somatic CTNNB1 mutation. The
          FAP-associated subset follows the autosomal dominant inheritance of the underlying germline
          APC mutation, so what is inherited is the polyposis predisposition rather than the desmoid tumour
          itself.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Most DTs are sporadic, harboring somatic mutations in the gene that encodes for β-catenin,
          whereas DTs occurring in patients with familial adenomatous polyposis have germline mutations
          in the APC gene, which encodes for a protein regulator of β-catenin.
        supports: SUPPORT
