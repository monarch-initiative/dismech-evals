              id: MONDO:0019373
              label: desmoplastic small round cell tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EWSR1-WT1 Fusion Oncogene
        description: The t(11;22)(p13;q12) translocation fuses EWSR1 on chromosome 22 with WT1 on chromosome
          11. The resulting fusion protein contains the potent transcriptional activation domain of EWSR1
          fused to the zinc finger DNA-binding domain of WT1. This chimeric transcription factor activates
          aberrant gene expression programs including PDGFA.
        biological_processes:
        - preferred_term: positive regulation of transcription by RNA polymerase II
          modifier: ABNORMAL
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
        locations:
        - preferred_term: peritoneum
          term:
            id: UBERON:0002358
            label: peritoneum
      selected_evidence:
        snippet: Using microdissection techniques, EWS-WT1-gene fusion transcripts were detected in the
          cystic (single-cell-layered), the papillary and the solid tumor proliferations (exon 7 of EWS
          on chromosome 22 with exon 8 of WT1 on chromosome 11).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
