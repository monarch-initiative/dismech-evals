        description: Mass spectrometry of the expressed protein identifies the actual translation start
          site, which is the observation the whole mechanism rests on and which no clinical measurement
          could supply.
        limitations: Constructs are expressed from a plasmid rather than from the endogenous locus, so
          transcript abundance and the 5' untranslated region context are not those of the patient allele.
          The system therefore establishes that reinitiation at methionine 18 occurs and that the product
