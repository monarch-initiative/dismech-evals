        description: 'The cell type matters, and it is not the neuron. Single-cell transcriptomic analysis
          of human tissue shows GLUL expressed in neural and glial progenitor cells and in mature astrocytes,
          and not in post-mitotic neurons. The astrocyte is where glutamate taken up from the synaptic
          cleft is converted to glutamine for return to the neuron, so an astrocytic enzyme running outside
          its feedback control acts directly on the supply side of the glutamate-glutamine cycle. Expression
          in progenitors adds a developmental dimension: the same dysregulation is present while the brain
          is being built, not only once it is working.'
        molecular_functions:
