        name: Seizures
        description: 'Seizures are the presenting feature in most patients. Onset spans the first two
          years of life, most often within the first months, though the one adult reported so far began
          at 24 months. They are frequently refractory: multiple antiseizure medications and a ketogenic
          diet were tried without lasting control in several reported patients. The semiology is not uniform.
          Generalized tonic-clonic, myoclonic, tonic, clonic, focal, atonic and spasm-like seizures have
          all been reported, and the mix differs between patients; in the adult proband the combination
          of seizure types and the electroencephalographic findings amounted to a clinical diagnosis of
          Lennox-Gastaut syndrome.'
