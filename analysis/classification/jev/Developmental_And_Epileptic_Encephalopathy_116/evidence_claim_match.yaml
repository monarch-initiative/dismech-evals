          others achieved partial control with valproic acid or perampanel added late. Agents reported
          in use include vigabatrin, prednisolone, topiramate, valproic acid, lacosamide, perampanel,
          lamotrigine and levetiracetam. No agent has been shown to work better than another in this disorder,
          and no genotype-directed choice is possible on current evidence.

