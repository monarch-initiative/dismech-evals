        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dee116_female_predominance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why were all nine individuals in the founding cohort female, and is the apparent female
          predominance real or an artefact of ascertainment?
        attaches_to:
        - pathophysiology#GLUL Start-Loss and 5' UTR Splice Variants
        - pathophysiology#Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors
        rationale: 'A de novo autosomal dominant disorder has no reason to affect one sex. This one appeared
          to: every one of the nine probands in the founding cohort was female, and the reporting authors
          noted that the phenotype was uncharacterized in males. The hypothesis they offered was a reported
          difference in glutamine metabolism between the sexes, which would place the modifier downstream
          of the variant rather than in transmission.

          The first male proband was reported the following year, and his phenotype matched the female
          cases: refractory seizures, global developmental delay, hypotonia. That settles the strong version
          of the question, which was whether males are affected at all. It does not settle the weaker
          one. With ten patients in total, nine of one sex, the imbalance could be chance, could be ascertainment,
          or could be real with males either less severely affected or affected differently enough to
          be diagnosed as something else.

          Distinguishing these needs more patients rather than a new experiment, but the metabolic hypothesis
          is separately testable and would be worth testing even at the current cohort size, because a
          sex difference in glutamine handling would bear on the biochemistry gap recorded in the other
          discussion here.'
        proposed_experiments:
        - experiment_id: dee116_sex_ratio_cohort_accrual
          name: Sex ratio in a prospectively accrued GLUL cohort
          description: Accrue patients through GeneMatcher and diagnostic laboratories without selecting
            on phenotype, and report the sex ratio. Ten patients cannot distinguish a real 9-to-1 imbalance
            from chance; a few dozen can.
        - experiment_id: dee116_sex_stratified_gs_turnover
          name: Sex-stratified measurement of glutamine synthetase turnover
          description: Measure glutamine synthetase abundance and glutamine-induced degradation in male
            and female control cells, and in patient cells of both sexes. This tests the specific hypothesis
            the founding authors offered, that sex differences in glutamine metabolism modify the consequence
            of losing the degron.
      selected_evidence:
        snippet: The original study highlighted that all reported individuals were female and that the
          phenotype remains uncharacterized in males. The overrepresentation of females was hypothesized
          to be due to the reported difference in glutamine metabolism between sexes.
        supports: SUPPORT
