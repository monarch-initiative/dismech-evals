  617dd8cfd6a84bc8c617715466aedd2a72abc40bbb16d53d3aef238b0b2cfb78:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 116
          disease_term:
            preferred_term: developmental and epileptic encephalopathy 116
            term:
              id: MONDO:0970945
              label: developmental and epileptic encephalopathy 116
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dee116_heterotopia_mouse_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: A patient with a start-loss GLUL variant had periventricular nodular heterotopia, but
          overexpressing stabilized glutamine synthetase in mouse cortex produced no migration defect.
          Does the human neuronal migration phenotype belong to this disease, and if so why does the mouse
          experiment not reproduce it?
        attaches_to:
        - pathophysiology#Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors
        - pathophysiology#Disrupted Glutamate-Glutamine Homeostasis in the Developing Brain
        rationale: 'The founding study reported one individual with periventricular nodular heterotopia,
          a disorder of neuronal migration, and then tested the obvious hypothesis directly: it overexpressed
          the stabilized enzyme in the developing mouse cortex by in utero electroporation and looked
          for migration defects. There were none. The authors report the negative result rather than omitting
          it, which is why it is curated here as a mismatch rather than as an absence of evidence.

          Three readings are open. The heterotopia may be coincidental in a single patient, in which case
          it is not a feature of the disease at all. The mouse experiment may not model the human condition
          adequately, since electroporation overexpresses the protein in a subset of cells for a limited
          window whereas patients carry the variant in every cell from conception, and since GLUL is expressed
          in progenitors whose human biology the mouse cortex represents imperfectly. Or the migration
          phenotype may depend on the astrocytic and progenitor context rather than on the enzyme being
          present in the migrating neuron, in which case overexpressing it in the electroporated cells
          tests the wrong cell type.

          Whether the heterotopia belongs to the disease is not resolvable from one patient, and no subsequent
          series has reported a second case; the more recent cohorts describe atrophy, callosal thinning
          and perivascular space enlargement instead.'
        proposed_experiments:
        - experiment_id: dee116_knockin_mouse_migration
          name: Germline knock-in mouse carrying the human start-loss allele
          description: Replace the electroporation overexpression model with a knock-in that carries the
            human variant in every cell from conception, and assess cortical lamination and neuronal migration.
            This tests the leading explanation for the negative result, that the model system rather than
            the hypothesis was inadequate.
        - experiment_id: dee116_imaging_review_for_heterotopia
          name: Systematic re-review of brain imaging across all reported patients
          description: Have a neuroradiologist blinded to genotype look specifically for heterotopia in
            the imaging of every reported patient. Periventricular nodular heterotopia is easy to miss
            when it is not being sought, and a second case would change the interpretation from coincidence
            to phenotype.
      selected_evidence:
        snippet: One individual with a start-loss GLUL variant demonstrated periventricular nodular heterotopia,
          a neuronal migration disorder, yet overexpression of stabilized GS in mice using in utero electroporation
          demonstrated no migratory deficits.
        supports: SUPPORT
