      assertion_type: Pathophysiology
      assertion:
        name: GLUL Start-Loss and 5' UTR Splice Variants
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'The disease alleles cluster on one target: the initiation codon of GLUL. They reach
          it two ways. Seven of the nine founding patients had variants in the start codon itself, and
          two had variants at the canonical splice site of the 5'' untranslated region that exclude the
          initiation codon from the mature transcript. Later reports add further alleles at the same splice
          acceptor. All are heterozygous and all arose de novo.

          The spectrum has since begun to widen past the start codon. A de novo heterozygous missense
          variant in the catalytic domain and an in-frame duplication have each been reported in a patient
          with the same phenotype. The duplication was shown to disrupt regulation of enzyme activity
          without changing protein expression, which is a different route to the same endpoint; the missense
          variant is not functionally characterised. Both are single observations and are curated here
          as spectrum expansion rather than as an established second mechanism.'
        genes:
        - preferred_term: GLUL
          term:
            id: hgnc:4341
            label: GLUL
        genetic_context:
          functional_impact_category: GAIN_OF_FUNCTION
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          description: Heterozygous de novo variants abolishing use of the canonical GLUL start codon,
            either by altering it directly or by excluding it through a 5' untranslated region splice
            defect.
      selected_evidence:
        snippet: Seven out of nine were start-loss variants and two out of nine disrupted 5' UTR splicing
          resulting in splice exclusion of the initiation codon.
        supports: SUPPORT
