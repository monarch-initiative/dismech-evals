        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Glutamate-Glutamine Homeostasis in the Developing Brain
        biological_scale: TISSUE
        role: intermediate
        mechanism_confidence: PROVISIONAL
        description: 'Glutamine synthetase sits at the junction of three things the brain cannot afford
          to get wrong: it makes the precursor from which both glutamate and GABA are regenerated, and
          it is the principal route by which ammonia is detoxified in the brain. Losing regulatory control
          of it during neurodevelopment is the proposed proximate cause of both the epilepsy and the developmental
          arrest.

          The confidence here is PROVISIONAL rather than ESTABLISHED, and deliberately so. The step is
          asserted on the basis of what the enzyme does rather than on a measurement of glutamate or glutamine
          in an affected brain, and the peripheral biochemistry that is available does not behave as the
          mechanism predicts. That mismatch is recorded as an open knowledge gap rather than resolved
          here.'
        biological_processes:
        - preferred_term: L-glutamine metabolic process
          modifier: DYSREGULATED
          term:
            id: GO:0006541
            label: L-glutamine metabolic process
        - preferred_term: glutamate metabolic process
          modifier: DYSREGULATED
          term:
            id: GO:0006536
            label: glutamate metabolic process
      selected_evidence:
        snippet: GS is pivotal for the generation of the neurotransmitters glutamate and gamma-aminobutyric
          acid and is the primary mechanism of ammonia detoxification in the brain.
        supports: SUPPORT
