  2ab7d6d83cf38c70d7ce27f3fa5ee2b7869b74c9e823661c72d8fff64568b4f7:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 116
          disease_term:
            preferred_term: developmental and epileptic encephalopathy 116
            term:
              id: MONDO:0970945
              label: developmental and epileptic encephalopathy 116
        context:
        - path: /animal_models/0
          value:
            name: Mouse in utero electroporation overexpressing stabilized glutamine synthetase
            species: Mouse
            genotype: Wild type, transiently overexpressing degron-truncated glutamine synthetase in embryonic
              neocortex
            publication: PMID:38579670
            description: Not a genetic model of the disease but a targeted test of one hypothesis. One
              patient with a start-loss GLUL variant had periventricular nodular heterotopia, a disorder
              of neuronal migration. The founding study electroporated the stabilized enzyme into embryonic
              mouse neocortex to ask whether stabilized glutamine synthetase disturbs migration. It did
              not, and the authors reported the negative result rather than omitting it.
            notes: 'Cross-reference: the interpretation of this negative result is curated as the HUMAN_MODEL_MISMATCH
              discussion dee116_heterotopia_mouse_mismatch, which sets out the three competing readings
              and the experiments that would distinguish them.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Overexpression of the stabilized enzyme in the developing mouse cortex produced no
          migratory deficit, so this model does not reproduce the periventricular nodular heterotopia
          seen in one patient and provides no support for a migration-defect route from the enzyme to
          the human brain phenotype.
        limitations: Three limitations bear directly on how far the negative result can be taken. Electroporation
          overexpresses the protein transiently, in a subset of cells, within a narrow developmental window,
          whereas patients carry the variant in every cell from conception. It adds stabilized protein
          on top of the endogenous wild-type enzyme rather than replacing it, so it models a gain of dose
          rather than the patient genotype. And GLUL is expressed in astrocytes and neural and glial progenitors
          rather than in post-mitotic neurons, so delivering it to electroporated cortical cells may not
          test the cell type in which the relevant activity resides. The result therefore weakens the
          migration hypothesis without excluding it.
        readouts:
        - name: Neuronal migration in the developing neocortex
          target: Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors
          direction: UNCHANGED
          interpretation: No migratory deficit was detected relative to control. This is a real negative
            result rather than an unperformed measurement.
      selected_evidence:
        snippet: One individual with a start-loss GLUL variant demonstrated periventricular nodular heterotopia,
          a neuronal migration disorder, yet overexpression of stabilized GS in mice using in utero electroporation
          demonstrated no migratory deficits.
        supports: REFUTE
