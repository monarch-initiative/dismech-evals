  284e982462aee31a7fddb359540b4c933d73697fa08c0e1cd25ca03753c311d9:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 116
          disease_term:
            preferred_term: developmental and epileptic encephalopathy 116
            term:
              id: MONDO:0970945
              label: developmental and epileptic encephalopathy 116
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Congenital glutamine deficiency
        description: 'The other GLUL disease, and the one a clinician is more likely to have heard of.
          It is caused by biallelic loss-of-function variants, is autosomal recessive, and presents in
          the neonatal period with severe brain malformation, multiorgan failure and death in infancy.
          Its biochemistry is the mirror image of what this entity was predicted to show: markedly reduced
          plasma and cerebrospinal fluid glutamine with hyperammonaemia.'
        distinguishing_features:
        - 'Inheritance separates them cleanly: biallelic inherited variants in the recessive disease versus
          a single de novo variant in this one.'
        - Outcome separates them. Congenital glutamine deficiency kills in infancy; every reported patient
          with the dominant disease was alive between 16 months and 16 years of age.
        - Biochemistry separates them in principle but not in practice. Low glutamine with raised ammonia
          is expected and usually observed in the recessive disease. In the dominant one glutamine is
          usually normal and ammonia is sometimes raised, so the panel neither confirms nor excludes it.
        - 'Imaging differs: brain malformation and ventriculomegaly in the recessive disease, against
          enlarged perivascular spaces and a thin corpus callosum in this one.'
      selected_evidence:
        snippet: Recessive forms are associated with congenital glutamine deficiency, manifesting with
          severe brain malformation, multiorgan failure, and early death.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
