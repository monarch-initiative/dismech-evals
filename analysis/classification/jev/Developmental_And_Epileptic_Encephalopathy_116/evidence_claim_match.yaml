      assertion_type: Pathophysiology
      assertion:
        name: Translation Reinitiation at Methionine 18
        biological_scale: MOLECULAR
        role: intermediate
        mechanism_confidence: ESTABLISHED
        description: 'The alternative start codon lies seventeen residues into the protein, in frame with
          the rest of it. Reinitiation there produces a glutamine synthetase that is complete except for
          its N-terminal seventeen amino acids. That short missing segment is the entire pathogenic consequence:
          it contains the degron, and nothing else about the protein is altered. This is why the variants
          are not loss-of-function despite abolishing the normal start codon.'
        biological_processes:
        - preferred_term: translational initiation
          modifier: ABNORMAL
          term:
            id: GO:0006413
            label: translational initiation
      selected_evidence:
        snippet: In both scenarios, a truncated protein is produced by reinitiation of the translation
          at an alternative start codon 17 amino acids downstream (Met18), removing a 5′ degron sequence
          critical to the regulation of glutamine synthetase degradation.
        supports: SUPPORT
