  6c7bdfe742c65348590da4ead8638fdcd019e54aebb75c91ea663dbd483c62c7:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 116
          disease_term:
            preferred_term: developmental and epileptic encephalopathy 116
            term:
              id: MONDO:0970945
              label: developmental and epileptic encephalopathy 116
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dee116_biochemistry_contradicts_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a stabilized, feedback-insensitive glutamine synthetase not produce the biochemical
          profile it predicts, and what is actually happening to glutamine and ammonia in the brains of
          these patients?
        attaches_to:
        - pathophysiology#Disrupted Glutamate-Glutamine Homeostasis in the Developing Brain
        - pathophysiology#Unregulated Glutamine Synthetase Activity in Astrocytes and Glial Progenitors
        rationale: 'The mechanism makes a clear prediction. An enzyme that converts glutamate and ammonia
          into glutamine, and that can no longer be degraded when glutamine is high, should raise glutamine
          and lower ammonia. The recessive disease behaves as the mirror of this: loss of the enzyme gives
          low glutamine and high ammonia, and that is what is usually measured.

          The dominant disease does not. The founding cohort of nine had normal plasma and cerebrospinal
          fluid biochemistry. A later series found heterogeneous profiles, with plasma glutamine low in
          one patient and normal in two, cerebrospinal fluid glutamine ranging from low to high across
          reported patients, and elevated ammonia in two of three. The reporting authors state plainly
          that the biochemistry did not agree with the gain-of-function mechanism.

          Several explanations are available and none has been tested. Peripheral blood may simply not
          report on astrocytic glutamine handling, in which case the measurement is wrong rather than
          the mechanism. The stabilized enzyme may be limited by substrate rather than by its own abundance,
          so more enzyme does not mean more product. The hyperammonaemia may be iatrogenic, since valproic
          acid raises ammonia and is among the drugs these patients receive, which is the explanation
          the reporting authors themselves offer. Or the pathogenic consequence may be something other
          than net flux through the enzyme, for instance the loss of a regulatory signal that the degron
          itself carries.

          This matters practically as well as mechanistically, because it is why biochemical testing cannot
          be used to screen for or confirm this diagnosis.'
        proposed_experiments:
        - experiment_id: dee116_brain_glutamine_mrs
          name: Magnetic resonance spectroscopy of glutamine and glutamate in patient brain
          description: 'Measure glutamine and glutamate directly in the brains of patients with confirmed
            dominant GLUL variants, rather than inferring brain metabolism from plasma. This distinguishes
            the two leading explanations: if brain glutamine is raised while plasma is normal, the mechanism
            is right and the peripheral measurement is uninformative; if brain glutamine is also normal,
            the mechanism needs revisiting.'
        - experiment_id: dee116_astrocyte_flux_assay
          name: Metabolic flux measurement in patient-derived astrocytes
          description: Differentiate astrocytes from patient induced pluripotent stem cells and measure
            labelled glutamate to glutamine conversion under varying glutamine and ammonia loads. Directly
            tests whether the stabilized enzyme increases flux, or whether flux is substrate-limited so
            that the extra enzyme has no metabolic consequence.
        - experiment_id: dee116_ammonia_valproate_stratification
          name: Ammonia measurement stratified by valproic acid exposure
          description: Compare ammonia levels in patients on and off valproic acid, or before and after
            starting it. This is the cheapest of the three and settles whether the hyperammonaemia is
            a disease feature or a drug effect, which currently confounds every biochemical description
            of the disorder.
      selected_evidence:
        snippet: We ascertained nine individuals with severe developmental delay, seizures, and white
          matter abnormalities but normal plasma and cerebrospinal fluid biochemistry with de novo variants
          in GLUL.
        supports: SUPPORT
