              id: MONDO:0970945
              label: developmental and epileptic encephalopathy 116
        context: []
      assertion_type: Genetic
      assertion:
        name: GLUL
        notes: 'GLUL encodes glutamine synthetase. It is the single causative gene, and it causes two
          different diseases by two opposite mechanisms. Biallelic loss-of-function missense variants
          abolish enzyme activity and cause congenital glutamine deficiency, an autosomal recessive disorder
          with brain malformation, multiorgan failure and infantile death. Heterozygous de novo variants
          that remove the N-terminal degron stabilize the enzyme and cause this entity. Reported dominant
          alleles include c.1A>C, c.1A>G, c.1A>T and c.3G>A affecting the initiation codon directly, c.-13-2A>G
          and c.-13-1G>A and c.-13-1G>C affecting the 5'' untranslated region splice acceptor, and more
          recently c.604T>C p.(Trp202Arg) and c.522_536dup in the coding sequence. Both diseases are rare:
          roughly six recessive and thirteen dominant patients had been reported by late 2025.'
        gene_term:
          preferred_term: GLUL
          term:
            id: hgnc:4341
            label: GLUL
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
      selected_evidence:
        snippet: Both loss-of-function and gain-of-function variants of GLUL are known to cause genetic
          disorders in humans.
        supports: SUPPORT
