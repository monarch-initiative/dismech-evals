        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Escape from Glutamine-Induced Degradation of Glutamine Synthetase
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'Glutamine synthetase is normally held in check by its own product. When glutamine
          is abundant, lysine residues in the N-terminal region are acetylated, which triggers ubiquitin-mediated
          degradation of the enzyme. That degron is a negative feedback loop implemented as protein turnover
          rather than as allosteric inhibition, and it is what the disease removes. The truncated enzyme
          is not degraded under high glutamine, so its abundance is no longer set by how much product
          it has made. The founding study named this gain of stabilization, and it is the rate-limiting
          step of the disorder: everything upstream converges on it, and everything downstream follows
          from it.'
        biological_processes:
        - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: DECREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
        - preferred_term: protein stabilization
          modifier: INCREASED
          term:
            id: GO:0050821
            label: protein stabilization
      selected_evidence:
        snippet: The truncated glutamine synthetase retains its enzymatic activity yet fails to undergo
          degradation in conditions of high glutamine
        supports: SUPPORT
