      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Hyperexcitability and Thalamocortical Hypersynchrony
        description: The excitation-inhibition shift converts into a hyperexcitable network that fires
          excessively and in synchrony. In the Gabra1 heterozygous mouse the ventrobasal thalamus is disinhibited
          by the loss of phasic GABAergic current, while the reticular nucleus paradoxically shows prolonged
          phasic currents — a partial compensation. In the Gabra1 A322D knock-in, EEG connectivity across
          sensorimotor cortex rises at the onset of both absence and myoclonic seizures, with somatosensory
          cortex leading motor cortex, showing that distinct seizure types in the same animal recruit
          overlapping cortical networks.
        biological_scale: TISSUE
        conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
        role: central_effector
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Action Potential
          term:
            id: GO:0001508
            label: action potential
          modifier: INCREASED
      selected_evidence:
        snippet: In addition, heterozygous loss of α1 subunit disinhibits VB by substantially reducing
          phasic GABAergic currents and surprisingly, it also increases nRT inhibition by prolonging phasic
          currents.
        supports: SUPPORT
