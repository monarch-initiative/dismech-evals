          inherited one. Inherited transmission does occur and is concentrated at the milder end of the
          spectrum: in the largest functional cohort, the two inherited transmembrane-domain variants
          were specifically noted as the exception to the rule that transmembrane variants cause severe
          phenotypes. ClinGen''s Epilepsy Gene Curation Expert Panel classifies the GABRA1-epilepsy relationship
          as Definitive with autosomal dominant inheritance.'
