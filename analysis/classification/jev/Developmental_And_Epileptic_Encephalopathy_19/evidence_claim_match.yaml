  a95ade0b87ecc389140468f02f69a0ddba6863947755be0c566373f7e8e82116:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 19
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 19
            term:
              id: MONDO:0014328
              label: developmental and epileptic encephalopathy, 19
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss-of-Function Reduction in GABA-A Receptor Current
        description: 'The most frequently demonstrated functional consequence of a pathogenic GABRA1 variant
          is a reduction in GABA-evoked chloride current through receptors containing the mutant subunit.
          Patch-clamp characterization of the de novo R214C variant showed the reduction arises from two
          separable defects: a shortened single-channel open time, and a fall in the amount of receptor
          present at all. Loss of function is the effect seen in the extracellular-domain variants and
          in a subset of transmembrane variants.'
        biological_scale: MOLECULAR
        role: amplifier
        genetic_context:
          gene:
            preferred_term: GABRA1
            term:
              id: hgnc:4075
              label: GABRA1
          allele_type: missense
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Missense variants in the extracellular domain and small transmembrane loops (for
            example p.Arg214Cys) are uniformly loss-of-function. Clinically they produce a more homogeneous
            and milder picture — infantile-onset focal seizures with fever sensitivity, posterior epileptiform
            discharges and mild cognitive impairment — with a generally favorable outcome. A subset of
            pore-forming transmembrane-helix variants is also loss-of-function but clinically more severe.
        molecular_functions:
