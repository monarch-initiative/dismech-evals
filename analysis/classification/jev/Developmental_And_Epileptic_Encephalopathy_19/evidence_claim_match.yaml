      assertion:
        name: Impaired GABAergic Inhibitory Neurotransmission
        description: Loss of alpha-1-containing GABA-A receptor function at the synapse weakens fast phasic
          inhibition. In the heterozygous Gabra1 mouse, this is directly measurable as a substantial reduction
          in the peak amplitude and frequency of miniature inhibitory postsynaptic currents in the ventrobasal
          thalamus, with no compensatory increase in tonic GABA-A current — establishing that the deficit
          is specifically in phasic synaptic inhibition. Compensation by other alpha subunits is region-specific
          and incomplete.
        biological_scale: CELLULAR
        conforms_to: epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance
        role: amplifier
