      assertion_type: Pathophysiology
      assertion:
        name: Drug-Resistant Epilepsy with Developmental Impairment
        description: 'The clinical endpoint is chronic epilepsy accompanied by developmental delay or
          intellectual disability, which affects the large majority of individuals with a pathogenic GABRA1
          variant. Outcome tracks the functional class of the variant: extracellular-domain loss-of-function
          variants generally have a favorable outcome, with most patients becoming seizure-free on monotherapy
          after an initial stormy phase, whereas transmembrane-helix variants — particularly gain-of-function
          ones — produce refractory seizures, regression and severe impairment. Additional neurodevelopmental
          and movement problems (autism spectrum disorder, ADHD and behavioral disturbance, ataxia, tremor,
          dystonia) are common.'
        biological_scale: ORGANISM
        conforms_to: epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures
        role: consequence
