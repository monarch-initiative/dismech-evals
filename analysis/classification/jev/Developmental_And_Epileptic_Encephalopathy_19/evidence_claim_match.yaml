      assertion_type: Treatment
      assertion:
        name: Broad-spectrum antiseizure pharmacotherapy
        description: 'Antiseizure medication is the mainstay of management. Response is strongly stratified
          by variant class: in the extracellular-domain loss-of-function group, most patients become seizure-free
          on monotherapy after an initial stormy phase, whereas antiseizure medications are reported to
          be ineffective in patients with gain-of-function variants and severe epilepsy. Within the loss-of-function
          group the choice of agent appears to be gene-specific, with levetiracetam identified as the
          most effective drug for GABRA1 (as against valproate for the paralogous GABRB3). This is a cohort
          observation rather than a trial result, so it is a treatment lead and not an established first-line
          recommendation.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: valproic acid
            term:
              id: CHEBI:39867
              label: valproic acid
          - preferred_term: levetiracetam
            term:
              id: CHEBI:6437
              label: levetiracetam
      selected_evidence:
        snippet: 6 of 11 (55%) subjects became seizure-free on monotherapy at an age ranging from 9 months
