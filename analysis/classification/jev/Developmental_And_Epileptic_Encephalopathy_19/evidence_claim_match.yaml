        context: []
      assertion_type: Diagnosis
      assertion:
        name: Functional (electrophysiological) variant classification
        description: Beyond confirming that a variant is present, determining whether it is gain-of-function
          or loss-of-function is prognostically and therapeutically informative, because the two classes
          differ in severity and in reported drug response. Classification is done by two-electrode voltage-clamp
          or patch-clamp electrophysiology of the variant receptor; where functional data are unavailable,
          the variant's structural location — extracellular domain and small transmembrane loops versus
          pore-forming transmembrane helices — provides partial prediction. This is a research-grade step
          rather than a routine clinical assay.
      selected_evidence:
        snippet: These findings establish the basis for a better understanding of the pathomechanism and
          a precision medicine approach in GABRA1-related disorders.
        supports: SUPPORT
