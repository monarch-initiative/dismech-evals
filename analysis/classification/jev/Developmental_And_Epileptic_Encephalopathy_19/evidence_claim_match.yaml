      assertion_type: Treatment
      assertion:
        name: Adjunctive vinpocetine for loss-of-function variants (investigational)
        description: Vinpocetine is a positive allosteric modulator of the GABA-A receptor, so it is mechanistically
          directed at the loss-of-function arm of the GABRA1 spectrum rather than at network excitability
          in general. A retrospective observational series of nine patients carrying eight loss-of-function
          GABA-A receptor variants reported reduced seizure frequency and improvement in non-seizure outcomes
          on add-on treatment, and a previously published patient with the loss-of-function GABRA1 Arg112Gln
          variant became seizure-free. This is uncontrolled observational evidence in a small, genotypically
          mixed cohort treated outside a trial, not established practice, and the same rationale predicts
          it would be inappropriate for the gain-of-function transmembrane variants at the severe end
          of this entry's scope.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: vinpocetine
            term:
              id: CHEBI:32297
              label: Vinpocetine
      selected_evidence:
        snippet: Adjunctive vinpocetine shows promise as a targeted therapy for patients with GABAA receptor
          LoF variants, decreasing seizure frequency and positively impacting nonseizure factors, with
          only mild AEs reported.
        supports: SUPPORT
