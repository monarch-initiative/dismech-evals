      assertion_type: Genetic
      assertion:
        name: GABRA1
        gene_term:
          preferred_term: GABRA1
          term:
            id: hgnc:4075
            label: GABRA1
        association: 'GABRA1 (5q34) encodes the alpha-1 subunit of the GABA-A receptor. Heterozygous,
          typically de novo, predominantly missense variants cause developmental and epileptic encephalopathy
          19. The variant landscape is organized by structural position within the subunit: extracellular-domain
          and small-transmembrane-loop variants are loss-of-function and produce a milder epilepsy with
          generally favorable outcome, whereas pore-forming transmembrane-helix variants — which may be
          either loss-of-function or gain-of-function — produce the severe encephalopathic phenotype,
          the gain-of-function subset being the most severe. ClinGen classifies the GABRA1-epilepsy relationship
          as Definitive.'
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        inheritance:
        - name: Autosomal dominant (typically de novo)
      selected_evidence:
        snippet: GABRA1 | HGNC:4075 | epilepsy | MONDO:0005027 | AD | Definitive
        supports: SUPPORT
