              label: developmental and epileptic encephalopathy, 19
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GABRA1 Variant and Alpha-1 Subunit Dysfunction
        description: The initiating lesion is a heterozygous, typically de novo variant in GABRA1, which
          encodes the alpha-1 subunit of the GABA-A receptor. GABA-A receptors are pentameric ligand-gated
          chloride channels that mediate most fast inhibitory neurotransmission in the mature brain; alpha-1
          is the most abundant alpha subunit in the adult brain, and its expression rises steeply over
          the first postnatal years as it replaces the alpha-2/alpha-3 subunits that predominate prenatally.
          That developmental expression switch is why a variant restricted to this subunit produces an
          epilepsy of infancy and early childhood. Most pathogenic variants are missense and cluster either
          in the extracellular domain or in the pore-forming transmembrane helices, and this structural
          position — not merely the presence of a variant — determines phenotype severity.
        biological_scale: MOLECULAR
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        role: trigger
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Regulation of Membrane Potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
        - preferred_term: Chemical Synaptic Transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
          modifier: ABNORMAL
        molecular_functions:
        - preferred_term: GABA-gated chloride ion channel activity of the alpha-1-containing receptor
          term:
            id: GO:0022851
            label: GABA-gated chloride ion channel activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: We detected disease-causing mutations in 2 novel genes for Dravet syndrome, with mutations
          in GABRA1 in 4 cases and STXBP1 in 3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
