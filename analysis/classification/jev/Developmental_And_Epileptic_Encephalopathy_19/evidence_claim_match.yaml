      assertion:
        name: Trio exome/genome sequencing or epilepsy gene panel
        description: 'Diagnosis is molecular: identification of a heterozygous pathogenic GABRA1 variant
          on a targeted epilepsy gene panel or on exome/genome sequencing, ideally in a proband-plus-parents
          (trio) design so that de novo status can be established. This matters because the clinical presentation
          does not distinguish DEE19 from its differentials — GABRA1 patients are routinely ascertained
          from within SCN1A-negative Dravet cohorts and from undifferentiated infantile-epilepsy cohorts,
          so the gene, not the phenotype, is what settles the diagnosis.'
      selected_evidence:
        snippet: We performed whole-exome sequencing in 13 SCN1A-negative patients with Dravet syndrome
          and targeted resequencing in 67 additional patients to identify new genes for this disorder.
        supports: SUPPORT
