  e4a1c1c1132e2cf2f7b3609c3e26244c6f95b5ca1e2dbe7becc8b8dce7935e8e:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 19
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 19
            term:
              id: MONDO:0014328
              label: developmental and epileptic encephalopathy, 19
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Gain-of-Function Shift in GABA Sensitivity and Desensitization
        description: A functionally opposite class of GABRA1 variants, localized to the pore-forming transmembrane
          helices, increases the apparent potency of GABA and alters receptor desensitization without
          reducing receptor expression or trafficking. The de novo A332V variant in transmembrane helix
          3 showed unchanged protein levels, normal assembly and normal forward trafficking, but a significant
          left shift in apparent GABA potency. Counterintuitively it is this gain-of-function group, not
          the loss-of-function group, that carries the most severe early-onset neurodevelopmental phenotype
          — a pattern also seen in the paralogous GABRB3 encephalopathy, and one that matters clinically
          because it inverts the expected direction of GABAergic pharmacotherapy.
        biological_scale: MOLECULAR
        role: amplifier
        genetic_context:
          gene:
            preferred_term: GABRA1
            term:
              id: hgnc:4075
              label: GABRA1
          allele_type: missense
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Missense variants in the pore-forming transmembrane helices (for example p.Ala332Val
            in TM3) increase apparent GABA potency without reducing receptor expression or trafficking.
            This is the most severe class, associated with early infantile developmental and epileptic
            encephalopathy.
        molecular_functions:
        - preferred_term: GABA-gated chloride ion channel activity
          term:
            id: GO:0022851
            label: GABA-gated chloride ion channel activity
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: In vitro assessment revealed unchanged protein levels, regular assembly and forward trafficking
          to the cell surface. On the functional level a significant left shift of the apparent GABA potency
          in two-electrode voltage clamp electrophysiology experiments was observed, as well as changes
          in the extent of desensitization.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32047208
      reference_title: A novel de novo variant of GABRA1 causes increased sensitivity for GABA in vitro.
      evidence_source: IN_VITRO
      explanation: Directly measures increased GABA potency and altered desensitization with preserved
        trafficking, defining the gain-of-function mechanism as distinct from the loss-of-function/trafficking
        arm.
