      assertion_type: DifferentialDiagnosis
      assertion:
        name: GABRB3-related developmental and epileptic encephalopathy (DEE43)
        description: 'The paralogous GABA-A receptor beta-3 subunit encephalopathy is mechanistically
          the closest neighbour: it too splits into gain-of-function and loss-of-function variant classes
          with the gain-of-function group more severely affected. Distinguishing them is a matter of which
          subunit gene carries the variant, and it matters because GABRB3 gain-of-function patients have
          a documented vigabatrin hypersensitivity that has no established GABRA1 counterpart.'
      selected_evidence:
        snippet: When administered vigabatrin, these patients responded with reduced seizures but suffered
          severe adverse effects, such as decreased alertness, extreme drowsiness, hypotonia, sedation
          and respiratory difficulties, that reversed upon treatment cessation.
        supports: SUPPORT
