          modifier: DECREASED
      selected_evidence:
        snippet: In addition, heterozygous α1 subunit deletion substantially reduced miniature inhibitory
          postsynaptic current (mIPSC) peak amplitudes and frequency in VB.
        supports: SUPPORT
