          reduced consciousness, and febrile respiratory infections precipitate status epilepticus and
          the terminal deteriorations reported in several patients. Fever is an aggravating trigger acting
          on an established disease, not a cause of it.'
        notes: 'No exposure_term is bound: ECTO and XCO were searched for fever / febrile illness / infection
          exposure concepts and neither ontology carries a suitable exposure term for endogenous fever
          or intercurrent febrile infection, so the entry is deliberately left free-text rather than bound
          to a broader, inaccurate term.'
      selected_evidence:
        snippet: At 6 months of age, she had her first seizure, followed by frequent episodes of both
          febrile and non-febrile seizures, some requiring hospitalization.
