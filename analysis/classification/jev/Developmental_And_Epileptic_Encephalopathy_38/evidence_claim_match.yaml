          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 38
            term:
              id: MONDO:0014868
              label: developmental and epileptic encephalopathy, 38
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gpi_versus_lipid_driver
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the neuronal injury in ARV1 deficiency driven mainly by the GPI-anchor biosynthesis
          defect, by disruption of ARV1's ancestral sterol/sphingolipid trafficking role, or by both acting
          together?
        attaches_to:
        - pathophysiology#Impaired GPI Anchor Biosynthesis
        - pathophysiology#Neuronal Dysfunction and Epileptic Encephalopathy
        rationale: 'Yeast Arv1 has documented roles in both GPI-anchor flow and sterol/sphingolipid homeostasis,
          and human ARV1 conserves both. The strongest direct human evidence points at the GPI-anchoring
          branch: patient cells show reduced surface GPI-anchored proteins, the 2025 reconstitution work
          places ARV1 in the GPI-GnT complex, and a patient allele impaired GPI-anchored Gas1 maturation
          without affecting sphingolipid synthesis. But whether residual lipid dyshomeostasis contributes
          independently to neuronal injury is not resolved, and the branch point is stated as open in
          the literature.'
        proposed_experiments:
        - experiment_id: exp_neuronal_gpi_vs_lipid_dissection
          name: Dissecting GPI versus lipid contributions in ARV1-null neurons
          description: In ARV1-null human iPSC-derived neurons, separately restore GPI-anchoring (e.g.
            by re-expressing an ARV1 mutant competent for GPI-GnT support but not lipid handling, or vice
            versa) and measure rescue of neuronal excitability, survival and GPI-anchored protein levels,
            to attribute the neuronal phenotype to each function.
      selected_evidence:
        snippet: complementation tests in yeast showed that the ARV1 p.Gly189Arg mutation leads to deficient
          maturation of Gas1, a GPI-anchored protein, but does not affect sphingolipid synthesis
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
