          with drug-refractory seizures, profound developmental delay with regression, and progressive
          cerebral and cerebellar atrophy. A neuronal conditional knockout of Arv1 in mice recapitulates
          the seizure phenotype and a severe adult survival defect, supporting a neuron-autonomous requirement
          for ARV1. This entry does not declare conformance to the epilepsy_excitation_inhibition_imbalance
          module: no excitation-inhibition measurement exists in ARV1 deficiency and asserting that mechanism
          would substitute a plausible route for an evidenced one (see gap_excitation_inhibition_route).'
