      assertion_type: Pathophysiology
      assertion:
        name: Reduced Cell-Surface GPI-Anchored Protein Expression
        biological_scale: CELLULAR
        role: central_effector
        description: Patient neutrophils and fibroblasts show significantly reduced surface expression
          of multiple GPI-anchored proteins (CD16 with ~5% residual expression, CD66b, CD55/CD59, and
          reduced FLAER binding in neutrophils; CD59 and CD87/uPAR in fibroblasts). This cellular readout
          is what assigns ARV1 deficiency to the inherited GPI-deficiency disorders and is corrected by
          lentiviral re-expression of wild-type ARV1, establishing it as the reversible core molecular
          defect.
        cell_types:
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: Dermal fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
      selected_evidence:
        snippet: The splice variants resulted in decreased ARV1 expression and significant decreases in
          GPI-anchored protein on the membranes of neutrophils and fibroblasts, indicating that the loss
          of ARV1 results in impaired GPI-anchor synthesis.
        supports: SUPPORT
