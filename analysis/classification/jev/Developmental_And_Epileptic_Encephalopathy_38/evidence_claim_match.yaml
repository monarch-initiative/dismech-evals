        prompt: By what route does reduced surface expression of GPI-anchored proteins produce neuronal
          hyperexcitability and seizures in the developing brain?
        attaches_to:
        - pathophysiology#Reduced Cell-Surface GPI-Anchored Protein Expression
        - pathophysiology#Neuronal Dysfunction and Epileptic Encephalopathy
        rationale: 'The link from the measured cellular defect to seizures is drawn by analogy to other
          inherited GPI-deficiency disorders that share the clinical and imaging picture, and to a proposed
          role for ER stress from immature GPI-anchored proteins. No excitation-inhibition measurement
          exists in ARV1 deficiency, so the entry deliberately does not conform to the epilepsy_excitation_inhibition_imbalance
          module: doing so would assert a mechanism that has not been measured here.'
        proposed_experiments:
        - experiment_id: exp_arv1_neuronal_excitability
          name: Excitation-inhibition measurement in ARV1-deficient neural models
          description: Use multi-electrode array or patch-clamp recordings in ARV1-null iPSC neuronal
            networks (and the neuronal Arv1 knockout mouse) to test whether a measurable excitation-inhibition
            imbalance underlies the seizures, and whether it tracks with loss of specific GPI-anchored
            synaptic/adhesion proteins.
      selected_evidence:
        snippet: this severe syndrome can be assigned to the group of inherited GPI deficiency disorders,
          with which it shares remarkably similar clinical and neuroimaging features
        supports: SUPPORT
