              label: developmental and epileptic encephalopathy, 38
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ARV1 Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        description: 'ARV1 is a ubiquitously expressed ~271-residue multi-pass ER transmembrane protein
          with an N-terminal conserved ARV1 homology domain carrying a putative zinc-binding motif. Biallelic
          variants reduce or abolish functional ARV1: truncating and frameshift alleles trigger nonsense-mediated
          decay, splice variants reduce transcript and protein and delete conserved domains, and missense/in-frame-deletion
          alleles fail (or only partially rescue) the temperature-sensitive growth defect of arv1-null
          yeast. Neither the p.Lys59_Asn98del nor the previously reported p.Gly189Arg allele produced
          detectable protein in mammalian cells.'
        genes:
        - preferred_term: ARV1
          term:
            id: hgnc:29561
            label: ARV1
      selected_evidence:
        snippet: In contrast to wild type human ARV1, neither variant expressed detectable levels of protein
          in mammalian cells.
        supports: SUPPORT
    origin:
