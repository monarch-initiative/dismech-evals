        - path: /pathophysiology/2
          value:
            name: Reduced Cell-Surface GPI-Anchored Protein Expression
            biological_scale: CELLULAR
            role: central_effector
            description: Patient neutrophils and fibroblasts show significantly reduced surface expression
              of multiple GPI-anchored proteins (CD16 with ~5% residual expression, CD66b, CD55/CD59,
              and reduced FLAER binding in neutrophils; CD59 and CD87/uPAR in fibroblasts). This cellular
              readout is what assigns ARV1 deficiency to the inherited GPI-deficiency disorders and is
              corrected by lentiviral re-expression of wild-type ARV1, establishing it as the reversible
              core molecular defect.
            cell_types:
            - preferred_term: Neutrophil
              term:
                id: CL:0000775
                label: neutrophil
            - preferred_term: Dermal fibroblast
              term:
                id: CL:0002620
                label: skin fibroblast
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Neuronal Dysfunction and Epileptic Encephalopathy
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Loss of GPI-anchored signaling and adhesion proteins on developing neuronal membranes
          is the proposed route to the encephalopathy, by analogy to other inherited GPI-deficiency disorders
          that share the clinical and neuroimaging picture. The intervening steps are not demonstrated
          in human neural tissue.
      selected_evidence:
        snippet: this severe syndrome can be assigned to the group of inherited GPI deficiency disorders,
          with which it shares remarkably similar clinical and neuroimaging features
        supports: SUPPORT
        directness: INDIRECT
