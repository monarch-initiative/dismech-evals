  3272cb1349d5e153f0aa8955dc44ccf13b8f6ba94968608b587d49b2a53a5461:
    claim:
      about:
        disease:
          name: Developmental And Epileptic Encephalopathy 38
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 38
            term:
              id: MONDO:0014868
              label: developmental and epileptic encephalopathy, 38
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired GPI Anchor Biosynthesis
        biological_scale: MOLECULAR
        description: The disease-relevant consequence of ARV1 loss is impaired initiation of GPI anchor
          biosynthesis. ARV1 associates with PIGQ within the GPI-GnT complex and promotes efficient recruitment
          of the phosphatidylinositol substrate; an ARV1 mutant unable to associate with PIGQ loses the
          ability to enhance GPI-GnT activity. In a complementation assay the human p.Gly189Arg allele
          caused deficient maturation of the GPI-anchored protein Gas1 without affecting sphingolipid
          synthesis, isolating the GPI-anchoring defect as the mechanistically decisive lesion. Whether
          ARV1's ancestral sterol/sphingolipid trafficking role contributes independently to neuronal
          injury is unresolved (see gap_gpi_versus_lipid_driver).
        biological_processes:
        - preferred_term: GPI anchor biosynthetic process
          term:
            id: GO:0006506
            label: GPI anchor biosynthetic process
          modifier: DECREASED
        molecular_functions:
        - preferred_term: phosphatidylinositol N-acetylglucosaminyltransferase activity
          term:
            id: GO:0017176
            label: phosphatidylinositol N-acetylglucosaminyltransferase activity
          modifier: DECREASED
      selected_evidence:
        snippet: complementation tests in yeast showed that the ARV1 p.Gly189Arg mutation leads to deficient
          maturation of Gas1, a GPI-anchored protein, but does not affect sphingolipid synthesis
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32462292
      reference_title: A defect in GPI synthesis as a suggested mechanism for the role of ARV1 in intellectual
        disability and seizures.
      evidence_source: IN_VITRO
      explanation: Isolates the GPI-anchoring defect from the sphingolipid role for a patient allele,
        supporting GPI biosynthesis as the decisive lesion.
