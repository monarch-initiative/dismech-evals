      assertion_type: Discussion
      assertion:
        discussion_id: gap_human_neuronal_bioenergetics
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do DEE40 patients actually have a measurable respiratory chain or bioenergetic deficit,
          and is it present in neural tissue?
        attaches_to:
        - pathophysiology#Defective Respiratory Chain Complex Assembly
        - pathophysiology#Neuronal Energy Failure and Epileptic Encephalopathy
        rationale: Every respiratory chain observation supporting this entry comes from yeast, worm, or
          cultured human cancer cells. No muscle or fibroblast respiratory chain enzymology, lactate,
          or oxidative phosphorylation measurement has been published for a GUF1 patient, and the discovering
          authors present the link to West syndrome as a suggestion. Until such a measurement exists,
          the central effector node of this entry is supported only by cross-species inference, which
          is also why no conformance to a mitochondrial mechanism module is declared (see notes).
        proposed_experiments:
        - experiment_id: exp_guf1_patient_respiratory_chain
          name: Respiratory chain assessment in GUF1 patient-derived cells
          description: Measure respiratory chain complex activities, assembly by blue-native electrophoresis,
            and mitochondrial translation rates in fibroblasts or iPSC-derived neurons from a GUF1 p.(Ala609Ser)
            homozygote against controls, to establish whether the assembly defect seen in model systems
            is present in patient cells and whether it is neuron-selective.
      selected_evidence:
        snippet: We suggest a new link between improper assembly of respiratory chain complexes and WS.
        supports: SUPPORT
        directness: INDIRECT
