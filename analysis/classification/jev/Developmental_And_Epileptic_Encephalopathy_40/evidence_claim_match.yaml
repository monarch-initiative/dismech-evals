          functional assay, and Orphanet lists GUF1 among the disease-causing genes for infantile epileptic
          spasms syndrome. External gene-disease validity curation reflects the same thin base: Genomics
          England PanelApp lists GUF1 at AMBER (confidence level 2) on its early onset or syndromic epilepsy
          panel, and at RED (level 1) on its mitochondrial disorders panel (PanelApp API, checked 2026-09-06;
          recorded as prose because PanelApp is not a snippet-citable structured source in this repository).
          No functional_impact_category is asserted: the yeast assay reports that the variant''s activity
          is "modified in suboptimal environments" rather than abolished, which does not license a loss-of-function
          call.'
      selected_evidence:
        snippet: An identifiable underlying genetic cause was identified in 48 (25%) out of 198 patients.
        supports: SUPPORT
