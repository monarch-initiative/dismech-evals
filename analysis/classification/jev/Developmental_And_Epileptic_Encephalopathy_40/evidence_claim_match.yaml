            term:
              id: MONDO:0014895
              label: developmental and epileptic encephalopathy, 40
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Translation Elongation Fidelity
        biological_scale: MOLECULAR
        description: 'GUF1/mtEF4 is a quality-control factor of mitochondrial protein synthesis rather
          than a core elongation engine: it binds mitoribosomes in a GTP-dependent manner, remobilizes
          stalled ribosomes, and transiently inhibits elongation so that synthesis remains accurate. No
          modifier is asserted on the elongation process below because the reported direction is condition-dependent
          — yeast lacking Guf1 show diminished synthesis rates at low temperature, whereas mouse mtEF4
          deletion accelerates mitochondrial translation at the cost of producing unstable proteins. What
          is consistent across systems is the loss of fidelity, not a single direction of rate change.'
        biological_processes:
        - preferred_term: mitochondrial translational elongation
          term:
            id: GO:0070125
            label: mitochondrial translational elongation
        molecular_functions:
        - preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
      selected_evidence:
        snippet: 'GUF1 encodes a protein essential in conditions that counteract faithful protein synthesis:
          it is able to remobilize stuck ribosomes and transiently inhibit the elongation process to optimize
          protein synthesis.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
