            term:
              id: MONDO:0014895
              label: developmental and epileptic encephalopathy, 40
        context: []
      assertion_type: Genetic
      assertion:
        name: GUF1
        gene_term:
          preferred_term: GUF1
          term:
            id: hgnc:25799
            label: GUF1
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: 'GUF1 (GTP binding elongation factor GUF1) is the only gene implicated in DEE40 (MONDO:0014895;
          OMIM 617065). The single reported segregating allele is the homozygous missense c.1825G>T, p.(Ala609Ser),
          found in three affected siblings of one consanguineous family by exome sequencing. A second,
          unspecified GUF1 variant was reported in one patient of a 198-patient targeted-panel cohort.
          The gene-disease relationship therefore rests on a single multiplex pedigree plus a supportive
          functional assay, and Orphanet lists GUF1 among the disease-causing genes for infantile epileptic
          spasms syndrome. External gene-disease validity curation reflects the same thin base: Genomics
          England PanelApp lists GUF1 at AMBER (confidence level 2) on its early onset or syndromic epilepsy
          panel, and at RED (level 1) on its mitochondrial disorders panel (PanelApp API, checked 2026-09-06;
          recorded as prose because PanelApp is not a snippet-citable structured source in this repository).
          No functional_impact_category is asserted: the yeast assay reports that the variant''s activity
          is "modified in suboptimal environments" rather than abolished, which does not license a loss-of-function
          call.'
      selected_evidence:
        snippet: We identified a homozygous variant (c.1825G>T/p.(Ala609Ser)) in the GUF1 gene in the
          three affected siblings.
        supports: SUPPORT
