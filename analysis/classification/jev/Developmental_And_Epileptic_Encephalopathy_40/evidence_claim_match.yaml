        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Respiratory Chain Complex Assembly
        biological_scale: CELLULAR
        role: central_effector
        description: 'Loss of mtEF4 function impairs biogenesis of the oxidative phosphorylation complexes,
          with complex IV the most consistently affected across model systems: cytochrome oxidase assembly
          fails in Guf1-deficient yeast at restrictive temperature, respiratory chain supercomplexes containing
          complex IV are disrupted in mtef4-null C. elegans at low temperature, and knockout of mtEF4
          in human cells induces respiratory chain complex defects and apoptosis. This node is the mechanistic
          pivot the discovering authors proposed for the epilepsy, and it is supported entirely by non-human
          or non-neural systems — no respiratory chain measurement has been reported in a DEE40 patient.'
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex assembly
          term:
            id: GO:0033108
            label: mitochondrial respiratory chain complex assembly
          modifier: DECREASED
      selected_evidence:
        snippet: At low temperature (15°C), mtef4 deletion reduces mitochondrial translation and disrupts
          the assembly of respiratory chain supercomplexes containing complex IV.
        supports: SUPPORT
