              id: MONDO:0014895
              label: developmental and epileptic encephalopathy, 40
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mouse_spares_nervous_system
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does mtEF4 knockout in the mouse produce testis-restricted disease while the human
          variant produces an epileptic encephalopathy with no reported fertility phenotype?
        attaches_to:
        - pathophysiology#Neuronal Energy Failure and Epileptic Encephalopathy
        - animal_models#mtEF4 knockout mouse
        rationale: 'This is a mismatch rather than an absence of evidence: the mouse knockout was made
          and characterised, and its phenotype is male infertility from testis-specific oxidative phosphorylation
          failure, with somatic tissues compensating through mTOR-driven cytoplasmic translation. The
          organ affected in the mouse is not the organ affected in the reported human family. Either the
          developing human brain cannot mount the somatic compensation that mouse somatic tissues can,
          or the human missense allele acts differently from a null, or the mouse neurological phenotype
          was simply not looked for. The distinction matters because the mouse is currently the only mammalian
          in vivo system available for this gene, and reading it as a model of DEE40 would misstate what
          has been shown.'
        proposed_experiments:
        - experiment_id: exp_neuro_phenotyping_mtef4_mouse
          name: Neurological phenotyping of mtEF4-deficient mice
          description: Perform EEG, seizure-susceptibility and developmental assessment in constitutive
            and neuron-specific mtEF4 knockout mice, and measure mTOR pathway activity and cytoplasmic
            translation rates in brain, to test whether the nervous system is genuinely spared or merely
            unexamined, and whether neuronal compensation differs from that in other somatic tissues.
        - experiment_id: exp_knockin_a609s_mouse
          name: Knock-in of the patient allele
          description: Generate a mouse carrying the orthologous p.(Ala609Ser) substitution rather than
            a null allele, to test whether the human missense variant produces a neurological phenotype
            that complete ablation does not.
      selected_evidence:
        snippet: Here we report that genetic ablation of mitochondrial EF4 (mtEF4) in mice causes testis-specific
          dysfunction in oxidative phosphorylation, leading to male infertility.
        supports: SUPPORT
