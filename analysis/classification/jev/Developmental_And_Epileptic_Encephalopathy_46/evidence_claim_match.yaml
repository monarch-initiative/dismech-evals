      assertion_type: Pathophysiology
      assertion:
        name: Impaired Activity-Dependent Synaptic Maturation
        biological_scale: CELLULAR
        description: NMDA-receptor signalling is the substrate of activity-dependent synapse maturation
          and plasticity, and GluN2D expression peaks early in development. Both the primary receptor
          defect and the superimposed epileptiform activity therefore act on circuit formation during
          the window in which it happens. Structural correlates are visible in the mouse model as enlarged
          presynaptic terminals and increased synaptic distance. This node is the reason seizure control
          alone does not reverse the developmental impairment.
        cell_types:
        - preferred_term: glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: chemical synaptic transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
          modifier: ABNORMAL
      selected_evidence:
        snippet: N-methyl-d-aspartate receptors (NMDARs), a subset of ligand-gated ionotropic glutamate
          receptors, are critical for learning, memory, and neuronal development.
        supports: SUPPORT
