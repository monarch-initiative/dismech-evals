      assertion_type: Discussion
      assertion:
        discussion_id: gap_grin2d_no_population_epidemiology
        prompt: What is the true birth prevalence of GRIN2D-related DEE, and how much of the apparent
          rarity is ascertainment?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - prevalence#Worldwide
        rationale: 'Every quantitative statement about how common DEE46 is, is a count of published or
          registry-known patients — roughly 30 globally in the most recent summary. No denominator exists,
          so no rate can be computed, and the count is a function of how many children with infantile-onset
          drug-resistant epilepsy have had trio exome or genome sequencing. Since GRIN2D is diagnosable
          only by sequencing and has no distinguishing clinical or imaging signature, the published count
          is a lower bound of unknown tightness. This matters practically: trial feasibility, and the
          decision whether a GRIN2D-specific trial is possible at all rather than a pan-GRIN one, depend
          on it.'
        proposed_experiments:
        - experiment_id: exp_grin2d_denominator_from_sequenced_dee_cohorts
          name: GRIN2D yield across systematically sequenced infantile-epilepsy cohorts
          description: Pool national and regional cohorts in which consecutive infants with developmental
            and epileptic encephalopathy underwent trio exome or genome sequencing, and compute the GRIN2D
            diagnostic yield with its denominator. Combine that yield with the incidence of infantile-onset
            DEE in the same catchment to derive a birth-prevalence estimate with confidence bounds.
      selected_evidence:
        snippet: According to The GRIN database, variants in GRIN2D have been identified in ∼30 patients
          globally.
        supports: SUPPORT
