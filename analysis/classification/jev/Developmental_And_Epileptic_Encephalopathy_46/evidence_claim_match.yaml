            term:
              id: MONDO:0014947
              label: developmental and epileptic encephalopathy, 46
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_grin2d_functional_class_predicts_memantine_response
        prompt: Does the in vitro functional class of a GRIN2D variant predict whether that patient will
          benefit from memantine, and if not, what does?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#NMDA Receptor Gain-of-Function
        - pathophysiology#NMDA Receptor Loss-of-Function and Mixed Channel Dysfunction
        - treatments#Memantine
        rationale: The whole therapeutic logic of this entry rests on the premise that gain-of-function
          receptors can be blocked back toward normal. Yet three individuals carrying the identical GRIN2D
          p.Val667Ile allele — the best-characterized gain-of-function variant in the gene — had opposite
          memantine outcomes, one of them seizure worsening severe enough to stop the drug. Genotype and
          functional class evidently do not determine response. Candidate explanations that have been
          raised but not tested include age at treatment onset, treatment duration, and the structural
          distance between the variant residue and the memantine binding site, but with three GRIN2D individuals
          in the literature none of these can be distinguished from noise. Until this is resolved, "gain-of-function,
          therefore give memantine" is a hypothesis being applied clinically rather than an established
          rule.
        proposed_experiments:
        - experiment_id: exp_grin2d_prospective_memantine_response_registry
          name: Prospective genotype-stratified memantine response registry
          description: Enrol GRIN2D variant carriers prospectively across the GRIN registry network with
            standardized functional classification of each variant, protocolized memantine titration,
            and harmonized outcome measures (seizure diary, quantitative EEG spectral measures, standardized
            developmental and behavioral instruments), recording age at initiation and treatment duration.
            Test whether functional class, residue-to-binding-site distance, or age at initiation predicts
            response.
          would_support:
          - treatments#Memantine
          supporting_outcome:
          - Response rate is materially higher in prospectively classified gain-of-function carriers than
            in loss-of-function or indeterminate carriers, and at least one pre-specified covariate predicts
            response within the gain-of-function group.
          would_refute:
          - treatments#Memantine
          refuting_outcome:
          - Response is no better than in functionally unclassified carriers, and no pre-specified covariate
            separates responders from non-responders.
      selected_evidence:
        snippet: Conclusively, the sample size is too small to draw meaningful comparisons between individuals
          carrying the same variant, regarding treatment response and benefits from memantine treatment.
        supports: SUPPORT
