          open-channel NMDA blocker — combined with magnesium, whose voltage-dependent pore block is itself
          weakened in GluN2D-containing receptors and further reduced by the variant. This is a single
          patient with EEG correlation, not evidence of general efficacy, and the mouse data below give
          a specific reason for caution about dose.
