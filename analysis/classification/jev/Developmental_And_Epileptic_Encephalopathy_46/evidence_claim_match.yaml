              id: MONDO:0014947
              label: developmental and epileptic encephalopathy, 46
        context: []
      assertion_type: Genetic
      assertion:
        name: GRIN2D
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: GRIN2D
          term:
            id: hgnc:4588
            label: GRIN2D
        notes: Heterozygous missense variants, characteristically de novo. Reported disease alleles include
          p.Asp449Asn, p.Ser573Phe, p.Thr674Lys, p.Ala675Val, p.Val667Ile, p.Leu670Phe, p.Ala675Thr, p.Ala678Asp,
          p.Met681Ile, p.Ser694Arg, p.Ser1271Leu and p.Arg1313Trp, clustering in the M3 gating helix and
          adjacent transmembrane regions with a minority in the intracellular carboxyl-terminal domain.
          c.1999G>A (p.Val667Ile) is the recurrent allele and is the one demonstrated to be gain-of-function.
          Protein-truncating GRIN2D alleles have not been reported in affected individuals, so haploinsufficiency
          is not an established route to this phenotype and a truncating allele should not be called causal
          on gene identity alone.
      selected_evidence:
        snippet: The resulting GluN2D p.Val667Ile exchange occurs in the M3 transmembrane domain involved
          in channel gating.
        supports: SUPPORT
    origin:
