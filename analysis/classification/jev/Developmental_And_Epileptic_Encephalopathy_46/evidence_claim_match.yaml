      assertion:
        name: GRIN2D Missense Variant Altering the GluN2D NMDA Receptor Subunit
        biological_scale: MOLECULAR
        description: The initiating lesion is a heterozygous, usually de novo, missense variant in GRIN2D
          that substitutes a single residue in the GluN2D subunit of the NMDA receptor. Reported disease
          alleles cluster in the M3 gating helix and the adjacent pre-M1 and transmembrane regions, with
          a smaller set in the intracellular carboxyl-terminal domain. Null (protein-truncating) GRIN2D
          alleles have not been reported in affected individuals, so unlike GRIN2B this disorder is not
          a haploinsufficiency syndrome.
        cell_types:
        - preferred_term: glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        molecular_functions:
        - preferred_term: NMDA glutamate receptor activity
          term:
            id: GO:0004972
            label: NMDA glutamate receptor activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: Null variants in GRIN2D gene (other than large scale deletions) have not yet been reported.
        supports: SUPPORT
