            relationship: RECAPITULATES
            fidelity: HIGH
            model_scale: ORGANISM
            description: Cell-type-restricted expression localizes the causal population for the electroclinical
              phenotype to GABAergic interneurons.
            limitations: Cre-driver expression is not perfectly cell-type-exclusive, and the human distribution
              of GluN2D across interneuron subclasses is less completely characterized than the mouse,
              so the interneuron attribution is stronger in the model than it can currently be shown to
              be in patients.
          role: ancestor
