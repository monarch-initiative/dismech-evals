            term:
              id: MONDO:0014947
              label: developmental and epileptic encephalopathy, 46
        context: []
      assertion_type: Treatment
      assertion:
        name: Memantine
        description: 'The mechanism-directed therapy of this disorder, and the reason DEE46 is curated
          separately from a generic DEE. Memantine is an uncompetitive open-channel NMDA-receptor blocker;
          in a gain-of-function receptor it blocks the excess conductance that the variant creates. It
          was given to both index p.Val667Ile children after their mutant receptors were shown in vitro
          to retain sensitivity to FDA-approved NMDA antagonists, and both showed mild to moderate improvement
          in seizure burden and development.

          The evidence level must be read honestly. These are case reports and retrospective series, not
          trials. In the largest multicentre GRIN memantine series, three individuals carrying the *same*
          GRIN2D p.Val667Ile variant had divergent outcomes — two with roughly 50% seizure reduction,
          one with worsening seizures and EEG that prompted discontinuation. Benefit is therefore neither
          uniform nor predictable from genotype alone, and the series authors are explicit that a beneficial
          response can be expected only for gain-of-function variants.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: memantine
            term:
              id: CHEBI:64312
              label: memantine
        notes: Dosing is not curated. The report used as a curation lead cites specific memantine regimens
          (2 mg/day titrated to 20 mg/day; approximately 0.5 mg/kg/day) to a source with no PubMed record,
          and those figures are not present in any reference cached for this entry, so they are deliberately
          omitted rather than carried over unsourced.
      selected_evidence:
        snippet: Based on these results, oral memantine was administered to both children, with resulting
          mild to moderate improvement in seizure burden and development.
        supports: SUPPORT
    origin:
