      assertion_type: Treatment
      assertion:
        name: Conventional Antiseizure Medication
        description: 'First-line management follows standard epilepsy practice, selected by seizure type.
          Agents reported in GRIN2D cases include phenobarbital, midazolam, levetiracetam, clonazepam,
          clobazam, topiramate, vigabatrin, valproate and pyridoxine, usually in combination. Response
          is poor: most reported patients achieved at best partial control, and no single conventional
          agent is established as preferred for GRIN2D. This is the baseline against which the NMDA-receptor-directed
          options below are judged, not a therapy this entry endorses as adequate.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: antiseizure pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: levetiracetam
            term:
              id: CHEBI:6437
              label: levetiracetam
          - preferred_term: valproic acid
            term:
              id: CHEBI:39867
              label: valproic acid
      selected_evidence:
        snippet: In the largest case series of 8 patients reported thus far, 7 received multiple anti-epileptic
          medications including clonazepam, levetiracetam, topiramate, vigabatrin and valproate, but only
          2 completely responded to the treatment while 3 had no response and 2 achieved mild amelioration
        supports: SUPPORT
