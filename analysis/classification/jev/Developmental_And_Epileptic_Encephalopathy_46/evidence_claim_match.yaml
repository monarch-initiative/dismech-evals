  c4cd1d7640e1b5d9768e67a41c8beeebb20f9019028772bd4d88ec1587911729:
    claim:
      about:
        disease:
          name: Developmental And Epileptic Encephalopathy 46
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 46
            term:
              id: MONDO:0014947
              label: developmental and epileptic encephalopathy, 46
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_grin2d_mouse_nmda_antagonist_response
        prompt: Why do NMDA-receptor antagonists that helped the index human patients perform poorly or
          harmfully in the variant-matched mouse, and which result should guide treatment?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#NMDA Receptor Gain-of-Function
        - treatments#Memantine
        - treatments#Ketamine with Magnesium for Refractory Status Epilepticus
        - animal_models#Grin2d V664I knock-in mouse (Rubinstein laboratory)
        rationale: 'This is a genuine mismatch, not an absence of evidence. The mouse at issue is the
          Rubinstein-laboratory Grin2d V664I knock-in (PMID:40277233), not the Frankel-laboratory conditional
          knock-in, which was not used for this pharmacology. It carries the orthologue of the exact human
          allele and reproduces the human disease closely — premature mortality, spontaneous seizures,
          motor then cognitive deficits, and an ECoG signature that parallels a patient''s EEG. On the
          strength of that construct validity it should be the natural testbed for the mechanism-directed
          therapy. Instead it inverts the clinical observation: memantine produced only a small corrective
          effect on ECoG, and ketamine — the drug credited with dramatic electroclinical improvement in
          the human status epilepticus case — provoked seizures at 4 and 10 mg/kg. Either the human benefit
          is smaller or more idiosyncratic than the case reports suggest, or the mouse diverges from human
          in receptor subunit composition, developmental timing, or drug exposure in a way that matters
          specifically for open-channel blockers. Resolving which is the case bears directly on whether
          NMDA-antagonist therapy should be pursued and at what dose.'
        proposed_experiments:
        - experiment_id: exp_grin2d_mouse_dose_exposure_bridging
          name: Dose-exposure bridging between the knock-in mouse and human treatment
          description: Measure free brain concentrations of memantine and ketamine in Grin2d knock-in
            mice across the tested dose range and compare them with the exposures achieved at reported
            human dosing; then repeat the ECoG pharmacology at exposure-matched rather than dose-matched
            levels, and separately at developmental ages matching the age at which the human patients
            were treated.
          would_support:
          - pathophysiology#NMDA Receptor Gain-of-Function
          supporting_outcome:
          - At human-equivalent free brain exposures and matched developmental age, memantine corrects
            the ECoG abnormality and ketamine is not proconvulsant, indicating the discrepancy was one
            of dose and timing rather than mechanism.
          would_refute:
          - treatments#Ketamine with Magnesium for Refractory Status Epilepticus
          refuting_outcome:
          - Ketamine remains proconvulsant across the full exposure range including human-equivalent exposures,
            indicating a real hazard that the single human case does not capture.
      selected_evidence:
        snippet: Acute administration of ketamine at a low dose (0.5 mg/kg) had a limited effect on the
          spectral properties, and higher dosages (4 or 10 mg/kg) caused seizures.
        supports: REFUTE
