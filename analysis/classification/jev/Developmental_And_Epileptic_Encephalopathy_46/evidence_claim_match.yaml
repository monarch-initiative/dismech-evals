        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NMDA Receptor Gain-of-Function
        biological_scale: MOLECULAR
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        description: 'In the gain-of-function branch the mutant GluN2D-containing receptor opens more
          readily and stays open longer. For the recurrent p.Val667Ile allele this is a combination of
          roughly two-fold higher glutamate and glycine potency, a roughly six-fold increase in channel
          open probability, reduced inhibition by endogenous extracellular protons, and a prolonged deactivation
          time course after glutamate is removed — the last of which lengthens the synaptic response itself.
          Other alleles reach the same endpoint by different combinations: p.Leu670Phe and p.Ala678Asp
          raise open probability from a wild-type value near 0.007 to 0.36 and 0.20 respectively, and
          p.Leu670Phe slows deactivation and increases charge transfer.'
        genetic_context:
          gene:
            preferred_term: GRIN2D
            term:
              id: hgnc:4588
              label: GRIN2D
          allelic_events:
          - MISSENSE_VARIANT
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: The recurrent de novo heterozygous M3-domain allele c.1999G>A (p.Val667Ile), which
            is the GRIN2D variant whose gain of channel function has actually been demonstrated by heterologous-expression
            electrophysiology (higher agonist potency, ~6-fold higher open probability, reduced proton
            inhibition, prolonged deactivation). p.Leu670Phe and p.Ala678Asp reach the same functional
            endpoint. This category applies to those alleles, not to GRIN2D missense variation as a class
            — the sibling node records the alleles that decrease channel function instead.
        cell_types:
        - preferred_term: glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        molecular_functions:
        - preferred_term: NMDA glutamate receptor activity
          term:
            id: GO:0004972
            label: NMDA glutamate receptor activity
          modifier: GAIN_OF_FUNCTION
        biological_processes:
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: Moreover, this mutation prolongs the deactivation time course after glutamate removal,
          which controls the synaptic time course.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
