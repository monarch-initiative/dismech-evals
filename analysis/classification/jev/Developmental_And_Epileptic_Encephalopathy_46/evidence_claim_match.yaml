        context: []
      assertion_type: Diagnosis
      assertion:
        name: Functional Characterization of the Variant
        description: A step that is specific to this disorder rather than generic. Because NMDA-receptor-directed
          treatment is available and its direction depends on whether the variant increases or decreases
          receptor function, ACMG classification alone is not sufficient to guide therapy for a novel
          missense allele. Two-electrode voltage clamp in Xenopus oocytes and whole-cell or single-channel
          recording in HEK293 cells measure agonist potency, open probability, deactivation kinetics,
          proton and magnesium sensitivity, and surface expression, and it is the combination of those
          parameters — not the variant's position — that assigns the functional class.
        diagnosis_term:
          preferred_term: heterologous-expression electrophysiology of the variant receptor
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: Genetic diagnosis for GluN2-related disorders may be clinically useful when considering
          drug therapy targeting NMDA receptors.
        supports: SUPPORT
