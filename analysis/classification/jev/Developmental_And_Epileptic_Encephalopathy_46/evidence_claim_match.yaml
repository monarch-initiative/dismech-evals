        description: 'A consequence shared across the tested GRIN2D disease alleles is reduced delivery
          of GluN2D-containing receptors to the plasma membrane. This is a distinct axis from channel
          gating: a variant may simultaneously reduce the number of surface receptors and increase the
          activity of each one, so "reduced surface expression" must not be read as net receptor loss
          of function. Where reduced surface expression is not offset by increased per-receptor activity
          it lowers current amplitude.'
