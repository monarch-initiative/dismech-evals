        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NMDA Receptor Loss-of-Function and Mixed Channel Dysfunction
        biological_scale: MOLECULAR
        description: 'The counterpart branch. Some GRIN2D alleles reduce rather than increase channel
          open probability, and combine that with only a mild rise in agonist potency and reduced proton
          sensitivity, so their net effect on receptor signalling is a decrease or is genuinely mixed.
          This branch matters clinically because it inverts the therapeutic logic of the gain-of-function
          branch: NMDA open-channel blockade would be expected to deepen, not correct, hypofunction, and
          the mechanism-directed strategy for these alleles is instead being tested as co-agonist supplementation
          (L-serine, NCT07377032, still recruiting). That is a trial hypothesis, not established practice
          — no controlled result exists, and prescribing a co-agonist on a presumed loss-of-function classification
          is neither validated nor known to be safe. Functional classification is nonetheless a prerequisite
          for any mechanism-directed treatment here, not an optional refinement.'
        cell_types:
        - preferred_term: glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        molecular_functions:
        - preferred_term: NMDA glutamate receptor activity
          term:
            id: GO:0004972
            label: NMDA glutamate receptor activity
          modifier: DECREASED
      selected_evidence:
        snippet: This work suggests the complexity of the pathological mechanisms of GRIN2D-mediated developmental
          and epileptic encephalopathy, as well as the potential benefit of precision medicine.
        supports: SUPPORT
