        notes: 'Response to uridine can be rapid and substantial. In the founding cohort seizures ceased
          immediately in both treated children, and a four-year-old previously in a minimally conscious
          state began to communicate and walk with assistance within nine weeks. Response is not uniform:
          a sibling started at 14 years had only a modest response where his sister started at 5 had a
          dramatic one, which is the clearest available signal that timing matters.'
