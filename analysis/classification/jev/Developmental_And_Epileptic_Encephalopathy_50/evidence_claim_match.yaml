            term:
              id: MONDO:0014647
              label: developmental and epileptic encephalopathy, 50
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intact Uridine Salvage Pathway
        biological_scale: MOLECULAR
        role: modifier
        description: 'This node is what the disease is bypassable through, not a lesion. Pyrimidines can
          be recycled from uridine by a route that does not use CAD and enters the pathway downstream
          of the block, so supplying uridine restores the depleted pools without repairing the enzyme.
          It is curated as a node so the treatment below can point at it. The contrast with DTYMK deficiency
          is instructive and is drawn out in that entry: DTYMK sits downstream of where de novo and salvage
          converge, so the same trick does not work there.'
        biological_processes:
        - preferred_term: pyrimidine nucleoside salvage
          term:
            id: GO:0043097
            label: pyrimidine nucleoside salvage
      selected_evidence:
        snippet: an error of pyrimidine de novo biosynthesis amenable to treatment via the uridine salvage
          pathway
        supports: SUPPORT
    origin:
