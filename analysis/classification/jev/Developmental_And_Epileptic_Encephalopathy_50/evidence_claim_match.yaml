              MDa hexameric particle carrying four catalytic domains in one chain: glutamine amidotransferase,
              carbamoyl phosphate synthetase II, aspartate transcarbamoylase and dihydroorotase. The covalent
              fusion of these activities into one particle is unique to animals. Biallelic variants reduce
              or abolish activity; missense alleles predominate and can act by disrupting oligomerization
              of a domain rather than by destroying a catalytic site — the feline variant below is a worked
              example of that route. A hypomorphic allelic class retaining partial activity produces a
              milder, primarily haematological phenotype.'
