        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_treatment_timing_and_reversibility
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How much of the neurological damage in CAD deficiency is reversible, and does the answer
          depend on age at which uridine is started?
        attaches_to:
        - pathophysiology#Progressive Neuronal Injury and Brain Atrophy
        rationale: 'The evidence that timing matters is real but thin: one sibling pair in which the younger
          sib treated at 5 improved dramatically and the older treated at 14 only modestly. That is a
          single family, and severity and age are confounded within it — the brother is described as having
          had a more severe course independently of when he was treated. The question is consequential
          because it is the argument for newborn screening, which the founding study and the largest series
          both raise.'
        proposed_experiments:
        - experiment_id: exp_age_stratified_uridine_response
          name: Age-stratified outcome registry
          description: Pool treated patients across centres and relate response — seizure freedom, developmental
            trajectory, arrest of atrophy on serial MRI — to age at treatment initiation and to pre-treatment
            severity separately, so the two can be disentangled. At the current cohort size this needs
            international pooling rather than a single series.
      selected_evidence:
        snippet: Her older brother had a more severe course and only modest response to uridine started
          at 14 years old.
