          value:
            name: Pyrimidine Nucleotide and UDP-Sugar Pool Depletion
            biological_scale: CELLULAR
            description: The consequence is not only a nucleic-acid precursor shortage. CTP and UTP fall,
              and so do nearly all UDP-activated sugars, which are the donor substrates for glycosylation.
              The original report of the disease framed it as a glycosylation disorder for exactly this
              reason. Cells that rely on de novo synthesis rather than salvage — proliferating cells such
              as erythroid precursors, and neurons during development — are the ones that feel it.
            biological_processes:
            - preferred_term: '''de novo'' UMP biosynthetic process'
              term:
                id: GO:0044205
                label: '''de novo'' UMP biosynthetic process'
              modifier: DECREASED
            cell_types:
            - preferred_term: Neuron
              term:
                id: CL:0000540
                label: neuron
            - preferred_term: Erythroid lineage cell
              term:
                id: CL:0000764
                label: erythroid lineage cell
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Dyserythropoiesis
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Erythroid precursors are proliferative and depend on de novo supply.
      selected_evidence:
        snippet: Our study confirms CAD deficiency as a progressive EIEE with recurrent status epilepticus,
          loss of skills, and dyserythropoietic anemia.
        supports: SUPPORT
        directness: INDIRECT
