      assertion_type: Pathophysiology
      assertion:
        name: Pyrimidine Nucleotide and UDP-Sugar Pool Depletion
        biological_scale: CELLULAR
        description: The consequence is not only a nucleic-acid precursor shortage. CTP and UTP fall,
          and so do nearly all UDP-activated sugars, which are the donor substrates for glycosylation.
          The original report of the disease framed it as a glycosylation disorder for exactly this reason.
          Cells that rely on de novo synthesis rather than salvage — proliferating cells such as erythroid
          precursors, and neurons during development — are the ones that feel it.
        biological_processes:
        - preferred_term: '''de novo'' UMP biosynthetic process'
          term:
            id: GO:0044205
            label: '''de novo'' UMP biosynthetic process'
          modifier: DECREASED
