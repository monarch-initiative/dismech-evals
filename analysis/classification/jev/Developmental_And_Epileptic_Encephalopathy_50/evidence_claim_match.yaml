      assertion_type: Genetic
      assertion:
        name: CAD
        gene_term:
          preferred_term: CAD
          term:
            id: hgnc:1424
            label: CAD
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: 'CAD is the only gene implicated. Missense variants dominate the reported spectrum, with
          nonsense and splice-site alleles making up the remainder. Two features complicate variant interpretation
          and are the practical reason the disorder is under-recognized: the gene is very large with over
          a thousand catalogued missense variants, and prediction tools perform poorly on it, so pathogenic
          alleles are frequently returned as variants of unknown significance. A cell-based complementation
          assay is what resolves them, and it reclassified more than half of a suspected cohort as not
          CAD-deficient. A hypomorphic allelic class retains partial activity and produces a primarily
          haematological phenotype.'
      selected_evidence:
        snippet: We establish CAD as a gene confidently implicated in this neurometabolic disorder, characterized
          by co-occurrence of global developmental delay, dyserythropoietic anaemia and seizures.
        supports: SUPPORT
