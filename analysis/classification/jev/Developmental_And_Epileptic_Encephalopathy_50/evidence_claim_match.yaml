          two surviving children with oral uridine led to immediate cessation of seizures in both. ...
          While the natural disease course can be lethal in early childhood, our findings support the
          efficacy of uridine supplementation, rendering CAD deficiency a treatable neurometabolic disorder
          and therefore a potential condition for future (genetic) newborn screening.
