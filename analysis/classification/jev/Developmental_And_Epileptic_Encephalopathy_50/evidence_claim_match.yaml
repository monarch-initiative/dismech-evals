  9bcc793f7023428e67c4cd11b89b8e877e1e005329556f4e1f41c96207c4c9d2:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 50
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 50
            term:
              id: MONDO:0014647
              label: developmental and epileptic encephalopathy, 50
        context: []
      assertion_type: Treatment
      assertion:
        name: Oral uridine supplementation
        description: Uridine bypasses the enzymatic block by entering the pyrimidine pool through the
          salvage route, which does not require CAD. It is given as uridine, uridine monophosphate or
          uridine triacetate. In treated patients seizures can stop immediately, development resumes,
          cerebellar atrophy can arrest and the blood film normalizes; supplementation was safe in the
          largest treated series. The disorder's authors recommend a trial in any patient with developmental
          delay, epilepsy and anaemia, in any patient with status epilepticus, and in any patient with
          neonatal seizures, until the diagnosis is excluded or six months have passed without benefit
          — an unusually permissive threshold that follows from the treatment's safety and the untreated
          mortality.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: uridine
            term:
              id: CHEBI:16704
              label: uridine
          - preferred_term: uridine triacetate
            term:
              id: CHEBI:90914
              label: uridine triacetate
        target_phenotypes:
        - preferred_term: Epileptic encephalopathy
          term:
            id: HP:0200134
            label: Epileptic encephalopathy
        - preferred_term: Anemia
          term:
            id: HP:0001903
            label: Anemia
        notes: Evidence is from case series and cohort reports; no randomized trial exists and none is
          likely at this cohort size. The recommendation to trial uridine empirically rests on safety
          plus untreated mortality, not on controlled comparison.
      selected_evidence:
        snippet: Supplementation of the two surviving children with oral uridine led to immediate cessation
          of seizures in both.
        supports: SUPPORT
