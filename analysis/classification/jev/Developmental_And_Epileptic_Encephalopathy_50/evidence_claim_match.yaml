  0cde32df66dc171628fe010ad37a0f7675cff49fa4697bfd816f81a001a27f3b:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 50
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 50
            term:
              id: MONDO:0014647
              label: developmental and epileptic encephalopathy, 50
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pyrimidine_depletion_to_neuronal_injury
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what route does depletion of pyrimidine nucleotides and UDP-sugars produce neuronal
          injury, seizures and brain atrophy, rather than a uniform proliferation defect?
        attaches_to:
        - pathophysiology#Pyrimidine Nucleotide and UDP-Sugar Pool Depletion
        - pathophysiology#Progressive Neuronal Injury and Brain Atrophy
        rationale: 'The metabolic lesion is measured directly in patient fibroblasts and the clinical
          endpoint is well described, but nothing in between is. Proposed routes include impaired glycosylation
          of neuronal proteins, since UDP-sugar donors are depleted, and impaired nucleic acid synthesis
          during neuronal differentiation; neither has been demonstrated in neural tissue from an affected
          individual or a model. The gap matters practically: it is why there is no biomarker of neuronal
          involvement, and why treatment response is monitored with seizure counts and blood films rather
          than anything mechanism-specific.'
        proposed_experiments:
        - experiment_id: exp_neuronal_glycosylation_in_cad_deficiency
          name: Glycosylation and nucleotide status in CAD-deficient neurons
          description: Differentiate neurons from a CAD-deficient patient iPSC line (one already exists)
            alongside isogenic controls, and measure UDP-sugar pools, protein glycosylation and neurite
            outgrowth with and without uridine. A glycosylation deficit correcting on uridine would support
            the glycosylation route; a normal glycan profile with impaired outgrowth would point at the
            nucleic-acid-synthesis route instead.
      selected_evidence:
        snippet: With no biomarker available, the diagnosis relies on genetic testing and functional validation
          in patient-derived fibroblasts.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
