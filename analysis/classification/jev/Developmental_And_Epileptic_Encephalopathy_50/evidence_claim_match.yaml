        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome sequencing with functional validation
        description: Diagnosis rests on sequencing, but sequencing alone is not sufficient. Because CAD
          is large and prediction tools perform poorly on it, candidate variants are commonly returned
          as variants of unknown significance; functional validation in patient-derived fibroblasts, or
          in the CAD-knockout complementation assay, is what establishes the diagnosis. The assay is a
          CRISPR-generated human CAD-knockout line that cannot grow without uridine and is rescued by
          transfection with functional recombinant CAD.
        diagnosis_term:
          preferred_term: whole exome sequencing
          term:
            id: NCIT:C101295
            label: Whole Exome Sequencing
      selected_evidence:
        snippet: Using CRISPR/Cas9, we generated a human CAD-knockout cell line that requires uridine
          supplements for survival. Transient transfection of the knockout cells with recombinant CAD
          restores growth in absence of uridine.
        supports: SUPPORT
