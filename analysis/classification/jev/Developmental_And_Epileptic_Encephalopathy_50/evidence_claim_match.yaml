      assertion_type: AnimalModel
      assertion:
        name: CAD-deficient Bengal cat
        species: Cat
        genotype: CAD p.Ser2015Asn homozygous
        category: Genetic
        description: A naturally occurring feline model. A four-month-old Bengal kitten with intractable
          seizures and abnormal behaviour carried a homozygous CAD variant predicted to disrupt oligomerization
          of the C-terminal ATCase domain, and the variant failed to rescue growth in the human CAD-knockout
          complementation assay. Four further carriers were found among 110 unaffected Bengals, so the
          allele segregates in the breed. This is a spontaneous large-animal model of a disorder whose
          human cohort is only a few dozen people.
        publication: PMID:40251393
        genes:
        - preferred_term: CAD
          term:
            id: hgnc:1424
            label: CAD
        modeled_mechanisms:
        - target: Biallelic CAD Loss of Function
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The feline variant abolishes CAD function in the same complementation assay used
            to classify human variants, and the affected kitten had intractable seizures.
          limitations: A single affected animal, characterized clinically rather than neuropathologically;
            the haematological arm of the human phenotype was not reported, and no uridine trial was performed,
            so the model's treatment responsiveness is inferred rather than demonstrated.
          readouts:
          - name: Growth rescue of CAD-knockout cells by the feline variant
            target: Biallelic CAD Loss of Function
            direction: ABOLISHED
            interpretation: The mutant protein cannot support growth without uridine, establishing loss
              of function rather than a benign substitution.
      selected_evidence:
        snippet: CAD-deficient Bengal cats might serve as a valuable spontaneous large animal model to
          further investigate the pathogenic mechanisms of this rare epileptic encephalopathy in humans.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
