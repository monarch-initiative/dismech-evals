          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Erythroid lineage cell
          term:
            id: CL:0000764
            label: erythroid lineage cell
      selected_evidence:
        snippet: CTP, UTP and nearly all UDP-activated sugars that serve as donors for glycosylation were
          decreased. Uridine supplementation rescued these abnormalities, suggesting a potential therapy
          for this new glycosylation disorder.
        supports: SUPPORT
