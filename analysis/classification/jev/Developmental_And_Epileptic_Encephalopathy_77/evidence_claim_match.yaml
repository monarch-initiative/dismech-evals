  a7f9120c259a352cb424d0fe5f9a4226565858dac0fec39abd527ba06f9336c7:
    claim:
      about:
        disease:
          name: Developmental And Epileptic Encephalopathy 77
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 77
            term:
              id: MONDO:0032808
              label: developmental and epileptic encephalopathy, 77
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PIGQ Variants
        biological_scale: MOLECULAR
        description: 'Germline biallelic PIGQ variants — homozygous or, more often, compound heterozygous.
          Reported alleles span splice-disrupting changes causing exon skipping, frameshifts, an in-frame
          single-codon deletion and missense substitutions. The recurrent allele is the in-frame deletion
          c.1199_1201del, p.(Tyr400del), found in six of the thirteen published patients and always in
          trans with a second variant — a pattern consistent with residual rather than absent PIGQ function,
          which is also what the group-level constraint on inherited GPI deficiency requires.

          '
        genes:
        - preferred_term: PIGQ
          term:
            id: hgnc:14135
            label: PIGQ
          modifier: DECREASED
        genetic_context:
          description: Germline biallelic PIGQ alleles. Both homozygous and compound heterozygous families
            are reported, so `zygosity` is deliberately left unset — the slot is single-valued and either
            value would misdescribe part of the cohort. `functional_impact_category` is PARTIAL_LOSS_OF_FUNCTION
            rather than LOSS_OF_FUNCTION because complete GPI deficiency is embryonically lethal, so every
            viable patient genotype must retain some activity; the recurrent Tyr400del allele was shown
            to restore GPI-anchored protein expression only mildly less efficiently than wild type.
          allelic_events:
          - MISSENSE_VARIANT
          - FRAMESHIFT_VARIANT
          - SPLICE_SITE_VARIANT
          - DELETION
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The fourth OS patient had a recessive mutation in PIGQ that led to exon skipping and
          defective glycophosphatidyl inositol biosynthesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
