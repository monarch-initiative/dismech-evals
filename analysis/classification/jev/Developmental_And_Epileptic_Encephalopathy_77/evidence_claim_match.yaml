            term:
              id: MONDO:0032808
              label: developmental and epileptic encephalopathy, 77
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pigq_pharmacological_upregulation
        kind: OPEN_QUESTION
        prompt: Can residual PIGQ expression be increased pharmacologically, as PIGM expression was by
          an HDAC inhibitor?
        attaches_to:
        - pathophysiology#Biallelic PIGQ Variants
        - pathophysiology#Reduced GPI-Anchored Protein Surface Expression
        rationale: 'Every viable PIGQ genotype is hypomorphic, so the disease is a residual-activity disorder
          rather than a null state — which makes raising residual output a coherent therapeutic target
          rather than a wish. There is one precedent within inherited GPI deficiency: in PIGM deficiency,
          where the lesion is a promoter mutation that disrupts Sp1 binding and leaves the coding sequence
          intact, the HDAC inhibitor butyrate raised PIGM transcription and surface GPI expression and
          stopped intractable seizures in a child. The mechanism does not transfer directly: the reported
          PIGQ alleles are coding, not promoter, so there is no hypoacetylated promoter to de-repress,
          and nothing suggests HDAC inhibition would help here. What the precedent establishes is the
          weaker and still useful claim that restoring GPI-anchored protein surface expression can control
          seizures in a patient — that the pathway is pharmacologically modifiable in principle. Whether
          any approach reaches PIGQ is untested.'
      selected_evidence:
        snippet: the drug caused complete cessation of intractable seizures in a child with inherited
          GPI deficiency.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
