        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serum alkaline phosphatase (supportive, not discriminating)
        description: 'Elevated in 62% of published PIGQ patients, so a raised value supports the diagnosis.
          It does not discriminate within the inherited GPI deficiencies — hyperphosphatasia is a variable
          feature across the group and was explicitly judged unsuitable for classifying them — and a normal
          value does not exclude PIGQ deficiency. It is listed here because the combination of the core
          clinical features with a raised alkaline phosphatase is what should prompt testing for a GPI
          biosynthesis defect.

          '
      selected_evidence:
        snippet: Alkaline phosphatase (ALP) is elevated only in 62% of cases.
        supports: SUPPORT
