        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Neurodevelopment and Cortical Network Excitability
        biological_scale: TISSUE
        description: 'Reducing the surface density of the GPI-anchored proteome during brain development
          yields a network that is both developmentally impaired and abnormally excitable. The epilepsy
          and the developmental impairment are two outputs of one lesion rather than a cause and its consequence,
          which is what a developmental and epileptic encephalopathy means. In the inherited GPI deficiencies
          as a group the process is progressive, with serial imaging showing cerebral and cerebellar volume
          loss over time.

          '
        biological_processes:
        - preferred_term: nervous system development
          modifier: DECREASED
          term:
            id: GO:0007399
            label: nervous system development
        - preferred_term: synaptic signaling
          modifier: DYSREGULATED
          term:
            id: GO:0099536
            label: synaptic signaling
      selected_evidence:
        snippet: The glycophosphatidylinositol (GPI) anchor pathway plays an essential role in posttranslational
          modification of proteins to facilitate proper membrane anchoring and trafficking to lipid rafts,
          which is critical for many cell functions, including embryogenesis and neurogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
