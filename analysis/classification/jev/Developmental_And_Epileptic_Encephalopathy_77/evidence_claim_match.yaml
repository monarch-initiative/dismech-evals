      assertion_type: Treatment
      assertion:
        name: Pyridoxine or Pyridoxal 5-Phosphate
        description: 'High-dose vitamin B6 (pyridoxine 20-30 mg/kg/day, switched to pyridoxal 5-phosphate
          if unresponsive) is the one intervention that has been prospectively tested in inherited GPI
          deficiency epilepsy. The result was modest and is reported honestly here: in a seven-participant
          cohort, two had a more than 50% reduction in seizure frequency and three a smaller reduction,
          none became seizure-free, and EEG did not improve in six of seven. The participants had PIGA,
          PIGT or PIGV deficiency, not PIGQ deficiency — PIGA is a partner subunit in the same first-step
          complex as PIGQ, which is the closest the evidence comes, and it is still an extrapolation.
          No PIGQ patient has been reported on this regimen.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: pyridoxine
            term:
              id: CHEBI:16709
              label: pyridoxine
          - preferred_term: pyridoxal 5'-phosphate
            term:
              id: CHEBI:18405
              label: pyridoxal 5'-phosphate
      selected_evidence:
        snippet: "AIM: To investigate the short-term efficacy and safety of high-dose pyridoxine \nand\
          \ pyridoxal 5-phosphate (P5P) in the treatment of inherited \nglycosylphosphatidylinositol (GPI)\
          \ deficiency-associated epilepsy."
        supports: SUPPORT
        directness: INDIRECT
