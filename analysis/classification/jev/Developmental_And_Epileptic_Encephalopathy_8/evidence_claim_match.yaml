      assertion_type: Pathophysiology
      assertion:
        name: Impaired Gephyrin-Dependent Glycine Receptor Clustering
        biological_scale: CELLULAR
        description: Proposed mechanism for hyperekplexia (exaggerated startle with neonatal stiffness),
          the hallmark of glycinergic synapse disorders, in the first reported patient. It is not established.
          In collybistin-knockout mice glycine receptors remain at postsynaptic sites, and hyperekplexia
          is absent in most later patients. On the other hand, mice carrying that patient's G55A variant
          do show an exaggerated acoustic startle, and the G55A protein aggregates with gephyrin and may
          act dominant-negatively, which a null allele would not. The node is kept so that the hyperekplexia
          phenotype is attached to its proposed mechanism and the uncertainty is visible.
        biological_processes:
        - preferred_term: glycine receptor clustering
          term:
