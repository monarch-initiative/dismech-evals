        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ARHGEF9 Loss of Function
        role: trigger
        biological_scale: MOLECULAR
        description: 'Pathogenic ARHGEF9 alleles reduce or abolish collybistin function. The allelic series
          includes whole-gene and intragenic deletions, chromosomal rearrangements whose breakpoints disrupt
          the gene (in one female, leaving transcripts that no longer encode the PH domain), nonsense,
          frameshift and splice variants, and missense variants. Missense variants studied functionally
          act through distinct domains: G55A in the N-terminal SH3 domain, where the mutant protein aggregates
          and may act dominant-negatively; R290H in the catalytic DH domain, which weakens the DH-PH intramolecular
          interaction and lowers phosphatidylinositol 3-phosphate (PI3P) binding; and R338W and R356Q
          in the PH domain, which abolish PI3P binding. The missense proteins tested fail to cluster gephyrin
          normally. The disease-relevant activity is PH-domain membrane targeting rather than the protein''s
          Cdc42 exchange activity: a collybistin mutant with no detectable Cdc42 GEF activity still builds
          gephyrin scaffolds, so the GEF activity is not recorded here as the lost function.'
        genes:
        - preferred_term: ARHGEF9
          term:
            id: hgnc:14561
            label: ARHGEF9
        genetic_context:
          gene:
            preferred_term: ARHGEF9
            term:
              id: hgnc:14561
              label: ARHGEF9
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          notes: Hemizygous in affected males; affected females are heterozygous (see the inheritance
            block). Variant origin is mixed (de novo, maternally inherited, and structural), so it is
            not set here. The G55A SH3-domain allele may additionally act dominant-negatively.
        molecular_functions:
        - preferred_term: phosphatidylinositol-3-phosphate binding
          term:
            id: GO:0032266
            label: phosphatidylinositol-3-phosphate binding
          modifier: DECREASED
      selected_evidence:
        snippet: Functional studies with heterologous expression of ARHGEF9G55A showed aggregation of
          CB protein as well as loss of gephyrin and GABAAR clusters, suggesting that the G55A mutation
          might act in a dominant-negative manner
        supports: SUPPORT
