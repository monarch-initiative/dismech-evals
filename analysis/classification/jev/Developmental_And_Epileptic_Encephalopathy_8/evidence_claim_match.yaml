      assertion:
        discussion_id: controversy_arhgef9_female_expression
        prompt: Are ARHGEF9 loss-of-function alleles X-linked dominant, or is disease in heterozygous
          females explained by skewed X-inactivation in brain that blood does not show?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - inheritance#X-linked
        rationale: The early affected females all carried chromosomal rearrangements with strongly skewed
          X-inactivation in favour of the abnormal X. Later females with de novo intragenic deletions
          or single-nucleotide variants had random X-inactivation in blood, prompting a proposal that
          loss-of-function alleles behave as X-linked dominant. Blood X-inactivation is an imperfect proxy
          for brain, and variants transmitted by mildly affected or unaffected mothers complicate the
          picture. The answer changes recurrence counselling for the mothers and sisters of affected boys.
      selected_evidence:
        snippet: Up to now, sequence variants and gross deletions have been identified in males, while
          only chromosomal aberrations have been reported in affected females who showed a skewed pattern
          of X-chromosome inactivation (XCI), suggesting an X-linked recessive (XLR) disorder.
        supports: SUPPORT
