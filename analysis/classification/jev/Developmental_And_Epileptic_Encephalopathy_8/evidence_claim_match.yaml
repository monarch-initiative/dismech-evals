          term:
            id: GO:0098690
            label: glycinergic synapse
      selected_evidence:
        snippet: The vital importance of collybistin for inhibitory synaptogenesis is underlined by the
          discovery of a mutation (G55A) in exon 2 of the human collybistin gene (ARHGEF9) in a patient
          with clinical symptoms of both hyperekplexia and epilepsy.
        supports: SUPPORT
