            isolates the alpha2 arm of the mechanism and cannot model gephyrin-wide or mTORC1 effects.
      selected_evidence:
        snippet: Gabra2-1 mice have deficits in working and recognition memory, as well as hyperactivity,
          anxiety, and reduced social preference, recapitulating the frequently reported features of ARHGEF9
          patients.
