            PH-domain alleles is not tested, and AIS pathology has not been examined in patient tissue.
      selected_evidence:
        snippet: The G55A variant also causes behavioral impairment and the generation of multiple seizure
          types including convulsive generalized tonic-clonic, tonic, spike-wave discharges, as well as
          interictal spikes.
