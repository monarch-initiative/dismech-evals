        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_arhgef9_hyperekplexia_mechanism
        prompt: What causes the exaggerated startle in the minority of ARHGEF9 patients who have it, given
          that collybistin-null mice keep glycine receptors at their synapses while mice carrying the
          G55A patient variant show hyperekplexia?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Gephyrin-Dependent Glycine Receptor Clustering
        - phenotypes#Exaggerated startle response
        rationale: The glycinergic explanation rests on the index patient and on gephyrin's role at glycinergic
          synapses. The null mouse preserves glycine receptor localization, and hyperekplexia is absent
          from most later patients. The G55A knock-in mouse does show an exaggerated startle, which fits
          an allele-specific (possibly dominant-negative) effect that a null cannot model; but glycine
          receptor clustering in brainstem and spinal cord of that model, the direct test of the glycinergic
          hypothesis, is not what its report examined.
      selected_evidence:
        snippet: Together, our data indicate that Cb is essential for gephyrin-dependent clustering of
          a specific set of GABAA receptors, but not required for glycine receptor postsynaptic localization.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
