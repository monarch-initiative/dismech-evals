          to the membrane. In collybistin-deficient mice gephyrin fails to cluster at postsynaptic sites
          and accumulates as cytoplasmic aggregates, in a region-specific pattern (hippocampus and basolateral
          amygdala), and collybistin is needed both to form and to maintain these clusters.
