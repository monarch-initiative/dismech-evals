        hypothesis_label: Hyperekplexia in ARHGEF9 disease reflects loss of gephyrin-dependent glycine
          receptor clustering
        status: ALTERNATIVE
        description: Proposed when the first patient, who had both hyperekplexia and epilepsy, was reported.
          It conflicts with the collybistin knockout mouse, in which glycine receptor localization is
          preserved, and with the rarity of hyperekplexia in later case series; it is consistent with
          the exaggerated startle of the G55A knock-in mouse. Whether the startle phenotype is glycinergic,
          specific to dominant-negative alleles such as G55A, or of another origin is unresolved.
      selected_evidence:
        snippet: This mislocalization of GABAA receptors, together with a corresponding expected deficit
          in glycine receptor trafficking in brain stem and spinal cord neurons, is likely to be causal
          for the clinical phenotype of the patient described above.
        supports: SUPPORT
