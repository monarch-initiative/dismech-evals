        description: Males are hemizygous and are the large majority of reported patients. Most male probands
          carry a de novo variant, but maternally inherited missense and nonsense variants occur, the
          mothers being unaffected or mildly affected. Affected females fall into two groups. Those with
          balanced X-autosome translocations, X-chromosome inversions or other rearrangements show strongly
          skewed X-inactivation in favour of the abnormal X, consistent with X-linked recessive expression.
          Females with de novo intragenic deletions or de novo loss-of-function or missense single-nucleotide
          variants have been reported with random X-inactivation in blood, which led one group to propose
          that loss-of-function alleles act as an X-linked dominant disorder while missense alleles act
          as X-linked recessive. Blood X-inactivation need not reflect the pattern in brain, so the dominant
          model is recorded as a proposal (see discussions), and the block is bound to the parent X-linked
          term rather than to either the recessive or the dominant child term.
      selected_evidence:
        snippet: The majority of variants in male probands are de novo; however, there are some familial
          cases of mildly affected mothers.
