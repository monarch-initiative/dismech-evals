              label: developmental and epileptic encephalopathy, 8
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Arhgef9 constitutive knockout mouse
        species: Mus musculus
        genotype: Arhgef9 null (collybistin-deficient)
        description: Constitutive collybistin knockout. Gephyrin and GABA-A receptor clusters are lost
          in a region-specific way from hippocampus and basolateral amygdala, dendritic GABAergic inhibition
          is reduced, hippocampal plasticity is abnormal, dentate gyrus excitability is increased in vivo,
          and the animals show increased anxiety and impaired spatial learning. Glycine receptor localization
          is preserved. Conditional forebrain deletion shows collybistin is needed both to form and to
          maintain these synapses.
        genes:
        - preferred_term: ARHGEF9
          term:
            id: hgnc:14561
            label: ARHGEF9
        publication: PMID:17690689
        modeled_mechanisms:
        - target: Loss of Postsynaptic GABA-A Receptor Clusters
          relationship: RECAPITULATES
          fidelity: MODERATE
          limitations: Mouse null allele; the loss is region-specific in the mouse, and the human brain
            distribution of the defect is unknown.
        - target: Impaired Gephyrin-Dependent Glycine Receptor Clustering
          relationship: FAILS_TO_RECAPITULATE
          fidelity: UNKNOWN
          limitations: Glycine receptor postsynaptic localization is preserved in the null mouse, so it
            does not model a glycinergic basis for the hyperekplexia seen in the SH3-domain G55A patient;
            a dominant-negative allele effect would not be captured by a null.
        - target: Cortical and Hippocampal Network Hyperexcitability
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          limitations: Shows increased evoked excitability of dentate granule cells in vivo; the constitutive-knockout
            papers cited here do not report spontaneous seizures.
      selected_evidence:
        snippet: Consistent with the anatomical and electrophysiological findings, the animals show increased
          levels of anxiety and impaired spatial learning.
        supports: SUPPORT
