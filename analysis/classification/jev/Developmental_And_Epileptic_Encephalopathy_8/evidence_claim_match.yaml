      assertion_type: Pathophysiology
      assertion:
        name: Disinhibited mTORC1 Signaling
        biological_scale: CELLULAR
        description: Collybistin binds mTOR and inhibits mTORC1 signalling and protein synthesis in neural
          progenitor cells. In iPSC-derived neural progenitors from a male with a whole-gene deletion,
          loss of collybistin is proposed to disinhibit mTORC1, a pathway implicated in other forms of
          intellectual disability and autism. This has been shown only in cultured cells and its contribution
          to the patient phenotype is untested.
        biological_processes:
        - preferred_term: TOR signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: INCREASED
      selected_evidence:
        snippet: These findings suggest that disinhibited mTORC1 signaling may also contribute to the
          pathological process in patients with loss-of-function variants in CB.
        supports: SUPPORT
