        name: Pyridoxine or pyridoxal-5-phosphate (vitamin B6) trial
        description: High-dose oral pyridoxine or pyridoxal-5-phosphate (P5P, the active vitamin B6 cofactor)
          has been trialed as a candidate disease-specific treatment for the drug-resistant epilepsy of
          inherited GPI deficiency, on the rationale that GPI-anchored alkaline phosphatase (which dephosphorylates
          extracellular P5P) is dysregulated in GPI deficiency. In a prospective compassionate-use cohort
          a partial seizure-frequency reduction was seen in some participants but none reached seizure
          freedom; efficacy in PIGB deficiency specifically is not established (the cohort enrolled PIGA/PIGT/PIGV
          participants).
        therapeutic_modality: SMALL_MOLECULE
