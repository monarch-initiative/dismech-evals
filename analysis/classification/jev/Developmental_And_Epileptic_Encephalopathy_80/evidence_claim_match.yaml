        biological_scale: MOLECULAR
        role: trigger
        description: PIGB (phosphatidylinositol glycan class B) encodes a 554-residue endoplasmic reticulum
          transmembrane protein with a small N-terminal cytoplasmic portion and a large C-terminal lumenal
          domain that carries the catalytic site. It is the GPI mannosyltransferase (GPI-MT-III) that
          transfers the third mannose onto the GPI precursor. Biallelic missense and truncating variants
          reduce or abolish PIGB function; ten different variants were found across the original ten families.
        genes:
        - preferred_term: PIGB
          term:
            id: hgnc:8959
            label: PIGB
      selected_evidence:
        snippet: Ten different PIGB variants were found in these individuals.
