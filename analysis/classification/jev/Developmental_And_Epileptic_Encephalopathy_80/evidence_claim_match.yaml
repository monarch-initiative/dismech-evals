            term:
              id: MONDO:0032822
              label: developmental and epileptic encephalopathy, 80
        context: []
      assertion_type: Genetic
      assertion:
        name: PIGB
        gene_term:
          preferred_term: PIGB
          term:
            id: hgnc:8959
            label: PIGB
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: 'PIGB (phosphatidylinositol glycan class B; the GPI mannosyltransferase that transfers
          the third mannose) is the only gene implicated in DEE80/EIEE80 (glycosylphosphatidylinositol
          biosynthesis defect 20). The variants are loss-of-function. The founding series reported ten
          different biallelic variants across ten unrelated families, spanning missense and truncating
          alleles; a later case added the biallelic p.Asp155His missense allele. A rough genotype-severity
          trend is described: the most severe cases (early death, peripheral neuropathy, and a metabolic
          2-oxoglutaric aciduria overlapping DOORS syndrome) cluster at the loss-of-function end of the
          spectrum. PIGB is a synthesis-stage GPI-anchor-pathway gene; in the largest cross-gene inherited-GPI-deficiency
          cohort, synthesis-stage variants were associated with a significantly shorter time to seizure
          onset than transamidase- and remodelling-stage variants, consistent with the early infantile
          onset seen in PIGB deficiency. Biallelic PIGB variants also extend beyond the classic DEE80
          phenotype: a recessively-inherited intronic PIGB variant causing exon skipping was identified
          in acrofrontofacionasal dysostosis type 1 (AFFND1), placing that dysostosis among the GPI-biosynthesis
          defects and broadening the PIGB phenotypic spectrum (Palagano et al., PMID:34400385).'
      selected_evidence:
        snippet: We describe ten unrelated families with bi-allelic mutations in PIGB, a gene that encodes
          phosphatidylinositol glycan class B, which transfers the third mannose to the GPI.
        supports: SUPPORT
