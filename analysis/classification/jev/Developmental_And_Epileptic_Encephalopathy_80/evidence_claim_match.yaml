    evidence_metadata:
      reference: PMID:22228761
      reference_title: Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol
        deficiency in patients with hyperphosphatasia mental retardation syndrome.
      evidence_source: IN_VITRO
      explanation: Establishes that in mannose-bearing GPI deficiency (which includes PIGB) the transamidase
