  a75a1326bf77eccabe0a6c7a136785699021dead5bea9cb5c0bc421682f152b1:
    claim:
      about:
        disease:
          name: Developmental And Epileptic Encephalopathy 80
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 80
            term:
              id: MONDO:0032822
              label: developmental and epileptic encephalopathy, 80
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gpi_to_seizure_route
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what route does reduced surface expression of GPI-anchored proteins produce neuronal
          dysfunction and seizures in the developing brain in PIGB deficiency?
        attaches_to:
        - pathophysiology#Reduced Cell-Surface GPI-Anchored Protein Expression
        - pathophysiology#Neuronal Dysfunction and Epileptic Encephalopathy
        rationale: 'The link from the measured cellular defect (reduced surface GPI-anchored proteins)
          to seizures is drawn from the known importance of GPI-anchored proteins in development and neurogenesis
          and by analogy to other inherited GPI-deficiency disorders. No excitation-inhibition or direct
          neuronal measurement exists in PIGB deficiency, so the entry deliberately does not conform to
          the epilepsy_excitation_inhibition_imbalance module. One specific, testable candidate route
          connects the hyperphosphatasia branch to the seizures: tissue-nonspecific alkaline phosphatase
          (TNAP) normally dephosphorylates extracellular pyridoxal-5''-phosphate (the active vitamin B6
          cofactor), and dysregulated TNAP handling in GPI deficiency could perturb B6-dependent neurotransmitter
          synthesis. This is the same B6 axis by which TNAP loss in hypophosphatasia causes vitamin-B6-responsive
          seizures, and it is the mechanistic rationale for the pyridoxine/pyridoxal-5-phosphate treatment
          trial in inherited GPI deficiency; it remains a candidate route, not a demonstrated one in PIGB
          deficiency.'
        proposed_experiments:
        - experiment_id: exp_pigb_neuronal_excitability
          name: Excitation-inhibition and GPI-anchored protein measurement in PIGB-deficient neural models
          description: In PIGB-null human iPSC-derived neurons, measure surface GPI-anchored protein levels
            alongside network excitability (multi-electrode array or patch-clamp) to test whether a measurable
            excitation-inhibition imbalance underlies the seizures and whether it tracks with loss of
            specific GPI-anchored synaptic/adhesion proteins.
      selected_evidence:
        snippet: abnormal metabolism of pyridoxal-5'-phosphate (the predominant form of vitamin B6)
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23860646
      reference_title: Multisystemic functions of alkaline phosphatases.
      evidence_source: OTHER
      explanation: 'Review establishing the TNAP -> pyridoxal-5''-phosphate axis: loss of TNAP activity
        (in hypophosphatasia) causes seizures through abnormal B6-cofactor metabolism. Cited INDIRECT
        because it grounds the candidate B6 route named in the rationale, not a route demonstrated in
        PIGB deficiency.'
