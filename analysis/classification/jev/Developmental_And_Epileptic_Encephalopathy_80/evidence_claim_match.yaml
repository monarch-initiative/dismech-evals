      assertion:
        name: PIGB-deficient CHO cell mutant
        experimental_model_type: CELL_LINE
        publication: PMID:22228761
        organism:
          preferred_term: Chinese hamster (CHO cell line)
          term:
            id: NCBITaxon:10029
            label: Cricetulus griseus
        cell_source: Chinese hamster ovary (CHO) cell mutants each defective in a single step of GPI biosynthesis,
          including a PIGB-deficient line, used as an isogenic panel to dissect the GPI lesion that produces
          alkaline-phosphatase secretion.
        description: The workhorse heterologous system for the ALP-shedding biochemistry of synthesis-stage
          GPI deficiency. Because CHO mutants can be made deficient in one GPI-pathway gene at a time,
          the panel isolates the effect of the PIGB (mannose-transfer) lesion from mannose-lacking lesions,
          which is not possible in patient material. It models the molecular mechanism of the hyperphosphatasia
          branch, not the neuronal phenotype.
        modeled_mechanisms:
        - target: Shedding of GPI-Anchored Alkaline Phosphatase into Serum
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: 'The PIGB-deficient CHO line reproduces the defining event of this node: soluble
            ALP is secreted rather than surface-anchored, and the contrast with mannose-lacking mutants
            (which degrade ALP instead) shows the secretion is specific to the mannose-bearing lesion
            class that PIGB deficiency belongs to.'
          limitations: A non-human (Chinese hamster) non-neuronal cell line that captures the cell-biological
            ALP-secretion mechanism only; it does not model the developmental and epileptic encephalopathy,
            and the PIGB mutant is an engineered null rather than a patient hypomorphic allele.
          readouts:
          - name: Soluble alkaline phosphatase released into culture medium
            target: Shedding of GPI-Anchored Alkaline Phosphatase into Serum
            direction: INCREASED
            interpretation: 'In vitro correlate of the patient hyperphosphatasia: the PIGB-deficient line
              sheds ALP into the medium instead of retaining it at the surface.'
      selected_evidence:
        snippet: we took advantage of CHO cell mutants that are defective in various steps of GPI biosynthesis
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
