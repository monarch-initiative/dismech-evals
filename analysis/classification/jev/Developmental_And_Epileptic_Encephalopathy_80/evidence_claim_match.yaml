      assertion_type: Pathophysiology
      assertion:
        name: Shedding of GPI-Anchored Alkaline Phosphatase into Serum
        biological_scale: CELLULAR
        description: Tissue-nonspecific alkaline phosphatase (TNAP) is normally a GPI-anchored ectoenzyme
          displayed at the cell surface. In synthesis-stage GPI deficiency such as PIGB deficiency, an
          incomplete GPI precursor that still bears mannose accumulates; the GPI transamidase recognizes
          this mannose-bearing precursor and cleaves the C-terminal GPI-attachment signal peptide, releasing
          soluble ALP into the medium (and, in patients, the serum) instead of anchoring it at the membrane.
          This is the molecular mechanism of hyperphosphatasia in mannose-bearing GPI defects, and it
          contrasts with the mannose-lacking defects (e.g. PIGL), in which ALP is degraded rather than
          secreted and serum ALP is not elevated.
      selected_evidence:
        snippet: transamidase recognizes incomplete GPI bearing mannose and cleaves a hydrophobic
        supports: SUPPORT
