  027d7530de069bc0c9951fbd08d9aba30794581b73ec5a80966eb4939b609cb6:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 89
          disease_term:
            preferred_term: developmental and epileptic encephalopathy 89
            term:
              id: MONDO:0030856
              label: developmental and epileptic encephalopathy 89
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dee89_early_combination_therapy_and_developmental_outcome
        prompt: Does starting vigabatrin plus a ketogenic diet in the first weeks after genetic diagnosis
          change developmental outcome in DEE 89, or only seizure frequency?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Developmental Encephalopathy
        - pathophysiology#GABA Depletion
        rationale: 'One infant started on the combination in the second month of life had seizures stop
          within two days and normal growth and psychomotor development at 7 months, which is remarkable
          against a cohort in which every patient with a neonatal burst-suppression EEG had profound delay.
          But a second patient on the same combination, with unreported treatment-start age, remained
          refractory with severe delay, and the commentary authors explicitly caution against generalizing
          from a single case. Because the disorder is ultra-rare and a critical treatment window has not
          been established, the question is unlikely to be settled by a conventional trial and needs a
          prospective registry with a pre-specified developmental endpoint.

          There is also a mechanistic objection that any such registry would have to stratify for. Vigabatrin
          works by blocking GABA catabolism, so it can only spare GABA that is being made; where the variant
          abolishes GAD67 activity there is little to spare, and the 2023 review argues on that basis
          that vigabatrin is not a suitable solution for severe-reduction or complete-loss alleles. That
          makes residual enzyme activity - the same quantity the allelic knowledge gap in this entry asks
          about - the plausible determinant of who responds, and it is not measured in any reported patient.
          The same review notes that oral GABA does not cross the blood-brain barrier but that brain-penetrant
          GABA derivatives might, which is the alternative route if the catabolism-blocking rationale
          really does fail at low residual activity.'
        proposed_experiments:
        - experiment_id: exp_dee89_treat_on_diagnosis_registry
          experiment_design: HUMAN_OBSERVATIONAL
          name: Prospective treat-on-diagnosis registry with developmental endpoints
          description: Enrol newly genetically diagnosed infants, record time from diagnosis to start
            of combination therapy, and follow standardized developmental assessments, so that outcome
            can be related to treatment latency rather than compared across ad hoc case reports.
        - experiment_id: exp_dee89_vigabatrin_response_by_residual_activity
          name: Vigabatrin response stratified by residual GAD67 activity
          description: For each reported allele, measure residual glutamate decarboxylase activity and
            relate it to that patient's vigabatrin response, to test the review's prediction that the
            drug fails where activity is abolished and works only where some synthesis remains.
      selected_evidence:
        snippet: The presence of a neonatal burst-suppression pattern on EEG generally has a dire prognosis,
          and all families reported in our study indeed had a profound developmental delay.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
