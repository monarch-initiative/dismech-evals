        relationship_type: CAUSATIVE
        notes: GAD1 (2q31.1, 21 exons) encodes GAD67. Reported pathogenic alleles include missense, nonsense,
          splice-site and in-frame deletion variants distributed across the protein, including the PLP-binding
          domain. A recurrent nonsense allele, c.1591C>T p.(Arg531*), has been seen in several unrelated
          populations.
      selected_evidence:
        snippet: The recurrent c.1591C>T, p.(Arg531*) variant has been reported three times (20% of all
          reported variants) in different populations, indicating it may be a probable hotspot mutation.
        supports: SUPPORT
