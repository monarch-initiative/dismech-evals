      assertion_type: Treatment
      assertion:
        name: Vigabatrin
        description: 'Vigabatrin irreversibly inhibits GABA transaminase, the enzyme that degrades GABA,
          and is therefore a mechanistically rational attempt to raise whatever GABA the residual synthetic
          capacity produces. Five of seven patients in the founding cohort who tried it had a good seizure
          response, but the authors themselves cautioned that the responders were particularly those with
          epileptic spasms, so the effect may be semiology-driven rather than GAD1-specific.

          The rationale has a published objection, and it is a mechanistic one rather than a null trial
          result: sparing GABA from degradation cannot help much when synthesis is the step that has failed,
          since GAD67 supplies over 90% of basal GABA. The 2023 review states that vigabatrin is therefore
          not a suitable solution "at least for mutations that result in severe reduction or complete
          loss of the enzyme function" - a genotype-stratified claim, which is the same residual-activity
          axis this entry records as an open gap. Two treated patients, including one on the vigabatrin-plus-ketogenic-diet
          combination, continued to have seizures. Both sides are curated as evidence below rather than
          resolved here, because the objection is an inference from the mechanism and the response is
          an observation, and neither refutes the other.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: vigabatrin
            term:
              id: CHEBI:63638
              label: vigabatrin
      selected_evidence:
        snippet: In our report, five of seven patients who tried vigabatrin showed a remarkably good seizure
          response.
