      assertion_type: AnimalModel
      assertion:
        name: Gad1-null mouse (GAD67 knockout)
        species: Mouse
        genotype: Gad1 (GAD67) homozygous null
        publication: PMID:9177246
        description: Targeted disruption of exon 1 of mouse Gad1 abolishes GAD67. Homozygotes are born
          at Mendelian frequency but die on the first morning after birth with severe cleft palate, and
          cortical GABA is reduced to 7% of wild type. Because death is neonatal, the model cannot be
          used to study the epilepsy that defines the human disorder.
        modeled_mechanisms:
        - target: GABA Depletion
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Direct biochemical measurement of the depletion: cortical GAD activity under 20%
            and GABA content 7% of wild type in newborn nulls.'
          limitations: Measured in newborn mouse cerebral cortex; the equivalent measurement has not been
            made in human patients, so the magnitude is transferred by inference.
          readouts:
          - name: Cerebral cortical GABA content
            target: GABA Depletion
            description: HPLC measurement of GABA in cerebral cortex homogenate of P0.5 nulls against
              wild-type littermates.
            direction: DECREASED
            interpretation: GABA at 7% of wild type is the quantitative correlate of the depletion node.
        - target: Failure of Palatal Shelf Elevation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Gad1-null mouse histology demonstrates failed palatal shelf elevation and cleft
            palate. CNS-specific deletion and oral explants support a neural movement-dependent mechanism,
            but the corresponding fetal intermediate has not been measured in human patients.
          limitations: Mouse cleft palate is highly penetrant and lethal, whereas the human malformation
            is variable and survivable. Human shelf elevation is not directly observed. The separate mouse
            umbilical-hernia finding does not establish identical human omphalocele.
          readouts:
          - name: Secondary palate fusion
            target: Failure of Palatal Shelf Elevation
            description: Gross and histological examination of the upper jaw and coronal facial sections
              in newborn and E17.5 animals.
            direction: ABOLISHED
            interpretation: Complete failure of secondary palate formation in every homozygote is the
              structural readout for this node.
        - target: Early-Onset Epileptic Seizures
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The defining human phenotype - neonatal epilepsy - cannot be observed in this model.
            Homozygotes die within a day of birth from the cleft palate, and their brains show no discernible
            structural defect, so the model gives no information about the seizure phenotype.
          limitations: 'This is a negative result by inaccessibility rather than by measurement: the animals
            do not survive long enough for an epilepsy phenotype to develop or be recorded, and no EEG
            was obtained. It should not be read as evidence that GAD67 loss fails to cause seizures.'
      selected_evidence:
        snippet: These mice were born at the expected frequency but died of severe cleft palate during
          the first morning after birth.
        supports: SUPPORT
