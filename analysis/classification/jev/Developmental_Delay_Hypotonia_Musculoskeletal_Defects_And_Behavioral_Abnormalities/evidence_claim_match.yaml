            term:
              id: MONDO:0859202
              label: developmental delay, hypotonia, musculoskeletal defects, and behavioral abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SRCAP Loss-of-Function Allele Outside the FLHS Hotspot
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'A de novo heterozygous variant in SRCAP that destroys the allele - nonsense, frameshift,
          canonical or deep-intronic splice-altering, or a retrotransposon insertion - and lies proximal
          or distal to exons 33-34.

          The location is the whole point. A truncation inside exons 33-34 escapes nonsense-mediated decay
          and yields a stable shortened protein, which is Floating-Harbor syndrome; anywhere else the
          transcript is degraded and the cell is simply short of SRCAP. So a curator or laboratory reading
          a novel SRCAP truncation should ask where it sits before predicting which disease it causes,
          and should not treat DEHMBA as a milder or severer FLHS.'
        genes:
        - preferred_term: SRCAP
          term:
            id: hgnc:16974
            label: SRCAP
        genetic_context:
          gene:
            preferred_term: SRCAP
            term:
              id: hgnc:16974
              label: SRCAP
          allele_type: truncating (nonsense, frameshift, splice-altering) or structural
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous null alleles outside exons 33-34, contrasted with the dominant-negative
            truncations inside that hotspot which cause Floating-Harbor syndrome.
      selected_evidence:
        snippet: Rare heterozygous variants in exons 33-34 of the SRCAP gene are associated with Floating-Harbor
          syndrome and have a dominant-negative mechanism of action. At variance, heterozygous null alleles
          falling in other parts of the same gene cause developmental delay, hypotonia, musculoskeletal
          defects, and behavioral abnormalities (DEHMBA) syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38448605
      reference_title: Combined exome and whole transcriptome sequencing identifies a de novo intronic
        SRCAP variant causing DEHMBA syndrome with severe sleep disorder.
      evidence_source: HUMAN_CLINICAL
      explanation: States the allelic rule this node encodes - null allele outside the hotspot for DEHMBA,
        dominant-negative inside it for FLHS - in one sentence.
