            term:
              id: MONDO:0859202
              label: developmental delay, hypotonia, musculoskeletal defects, and behavioral abnormalities
        context: []
      assertion_type: Genetic
      assertion:
        name: SRCAP
        association: De novo heterozygous loss-of-function variants outside the Floating-Harbor exon 33-34
          hotspot.
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        gene_term:
          preferred_term: SRCAP
          term:
            id: hgnc:16974
            label: SRCAP
        notes: The mutational spectrum is wider than point mutations. Beyond nonsense and frameshift variants,
          DEHMBA has been caused by a deep intronic splice-altering variant detectable only by adding
          RNA sequencing to exome sequencing, and by a full-length SVA retrotransposon insertion in exon
          13. Both are invisible to a standard short-read exome pipeline, which matters for anyone reporting
          a negative exome in a compatible phenotype.
      selected_evidence:
        snippet: Rare heterozygous variants in exons 33-34 of the SRCAP gene are associated with Floating-Harbor
          syndrome and have a dominant-negative mechanism of action. At variance, heterozygous null alleles
          falling in other parts of the same gene cause developmental delay, hypotonia, musculoskeletal
          defects, and behavioral abnormalities (DEHMBA) syndrome.
        supports: SUPPORT
