        role: effector
        mechanism_confidence: ESTABLISHED
        description: Reduced SRCAP dosage leaves the SRCAP chromatin-remodelling complex - the human counterpart
          of yeast SWR1 - operating below its normal capacity. The complex's defining job is ATP-dependent
          exchange of canonical H2A for the histone variant H2A.Z, so a shortfall here is a shortfall
          in H2A.Z deposition rather than a general chromatin defect.
        genes:
        - preferred_term: SRCAP
          term:
            id: hgnc:16974
            label: SRCAP
        molecular_functions:
        - preferred_term: ATP-dependent H2A.Z histone chaperone activity
          modifier: DECREASED
          term:
            id: GO:0140849
            label: ATP-dependent H2AZ histone chaperone activity
        protein_complexes:
        - preferred_term: SRCAP complex
          term:
            id: GO:0000812
            label: Swr1 complex
      selected_evidence:
        snippet: The main function of the SRCAP complex is to promote the exchange of histone H2A with
          the H2A.Z variant.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
