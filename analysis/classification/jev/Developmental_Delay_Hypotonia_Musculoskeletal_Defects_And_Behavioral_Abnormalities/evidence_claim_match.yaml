            term:
              id: MONDO:0859202
              label: developmental delay, hypotonia, musculoskeletal defects, and behavioral abnormalities
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Floating-Harbor syndrome
        description: 'The differential that matters, because it is the same gene. Everything depends on
          where the truncation sits: inside exons 33-34 gives a stable truncated protein and Floating-Harbor
          syndrome, outside gives a null allele and this disorder. Clinically the separator is growth
          and face - short stature, delayed bone age and a recognizable gestalt in FLHS, normal stature
          and non-specific features here - and where the clinical call is unclear, the two episignatures
          decide it.'
        disease_term:
          preferred_term: Floating-Harbor syndrome
          term:
            id: MONDO:0007621
            label: Floating-Harbor syndrome
        distinguishing_features:
        - Truncating variant located within SRCAP exons 33-34 rather than outside them.
        - Short stature and delayed bone age, which are absent or much milder in DEHMBA.
        - A recognizable facial gestalt, versus non-specific facial features in DEHMBA.
        - A distinct blood DNA-methylation signature; a classifier trained on the FLHS signature classifies
          DEHMBA cases negative.
      selected_evidence:
        snippet: In summary, for SRCAP, there is a clear relationship between variant location, DNAm profile,
          and clinical phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
