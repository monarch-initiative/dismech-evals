  c51cacf797fcb9a0212e1e9f47701247b3913f3d16e24c84c24c9ddc84a856c8:
    claim:
      about:
        disease:
          name: Developmental Delay With Short Stature, Dysmorphic Facial Features, And Sparse Hair 1
          disease_term:
            preferred_term: DPH1-related developmental delay with short stature, dysmorphic facial features
              and sparse hair
            term:
              id: MONDO:0800438
              label: developmental delay with short stature, dysmorphic facial features, and sparse hair
                1
        context: []
      assertion_type: Genetic
      assertion:
        name: DPH1
        gene_term:
          preferred_term: DPH1
          term:
            id: hgnc:3003
            label: DPH1
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: No external body has published a gene-disease validity classification for this pair, so
          `gene_disease_validity` is deliberately absent rather than filled with a curator-assigned tier.
          The support is two independently ascertained cohorts matched post-publication (PMID:26220823)
          plus subsequent unrelated families with distinct alleles (PMID:29410513, PMID:29362492) and
          experimental demonstration that patient alleles reduce enzyme function (PMID:37675463).
        variants:
        - name: c.17T>A (p.Met6Lys)
          description: Founder missense allele in a North American genetic isolate, homozygous in four
            affected individuals. In silico predictors called it benign and tolerated, so pathogenicity
            rests on segregation, the founder-allele frequency, and the later functional work on the pathway.
          clinical_significance: PATHOGENIC
        - name: c.701T>C (p.Leu234Pro)
          description: Homozygous missense allele in an extended consanguineous Saudi Arabian family whose
            phenotype was originally read as 3C (Ritscher-Schinzel) syndrome with renal involvement. Central
            nervous system malformations and early lethality were more frequent in this family than in
            the founder cohort.
          clinical_significance: PATHOGENIC
        - name: p.Leu125Pro and p.Tyr112Cys
          description: Two further missense alleles whose function was measured directly, in four new
            patients from two families. Both reduce DPH1 activity in the diphtheria-toxin ADP-ribosylation
            assay, placing them with p.Leu234Pro, p.Leu164Pro and the p.Ala411Argfs*91 frameshift among
            the five of seven tested alleles shown to be functionally compromised. Grouped in one record
            because the source reports them as a set within one functional series and does not separate
            their phenotypic effects.
          clinical_significance: PATHOGENIC
        - name: c.1227delG (p.Ala411Argfs*91)
          description: Homozygous frameshift allele in a consanguineous family with two affected siblings,
            who had agenesis of the corpus callosum and cleft palate and no renal findings.
          clinical_significance: PATHOGENIC
        - name: c.749+39G>A (deep intronic)
          description: Homozygous deep intronic variant in a sibling pair who had carried a clinical diagnosis
            of Fine-Lubinsky syndrome for years. Chromosomal microarray and quad exome sequencing were
            both non-diagnostic; a research reanalysis found the variant, and RNA sequencing on fibroblasts
            showed markedly reduced DPH1 transcript consistent with abnormal splicing followed by nonsense-mediated
            decay. The practical lesson is that this allele class is invisible to a standard exome pipeline,
            so a negative exome does not exclude the diagnosis.
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
        - name: c.289delG (p.Glu97Lysfs*8) and c.491T>C (p.Leu164Pro)
          description: Compound heterozygous pair in a patient from a non-consanguineous family, the first
            such genotype reported for this disease, presenting with airway obstruction and external genital
            anomalies in addition to the core features.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: The results show correlation between loss of activity, reduced size of the opening to
          the catalytic site, and changes in the size of the catalytic site with clinical severity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30877278
      reference_title: 'DPH1 syndrome: two novel variants and structural and functional analyses of seven
        missense variants identified in syndromic patients.'
      evidence_source: COMPUTATIONAL
      explanation: A genotype-phenotype correlation running from modelled catalytic-site geometry through
        measured residual activity to clinical severity, which is the only quantitative severity predictor
        reported for this disease. Graded COMPUTATIONAL because the structural part is a homology model
        with molecular dynamics rather than an experimental structure.
