              label: developmental malformations-deafness-dystonia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Actin Filament Depolymerization Dynamics
        biological_scale: CELLULAR
        description: 'The cellular readout, and the finding the disease was named from. Patient lymphoblastoid
          cells show a morphologically abnormal actin cytoskeleton and altered depolymerization kinetics
          when challenged with latrunculin A, a monomer-sequestering drug; the resistance is reproduced
          in fibroblasts expressing the mutant actin, so it is a property of the protein rather than of
          the patient''s cells. The modifiers are DYSREGULATED and ABNORMAL rather than DECREASED because
          that is as far as the source goes: it reports "altered" depolymerization dynamics and "morphological
          abnormalities" of the cytoskeleton. Latrunculin resistance does suggest disassembly is harder
          to induce, but that reading is an inference, and the node is named for the alteration rather
          than for a direction.'
        biological_processes:
        - preferred_term: actin filament depolymerization
          modifier: DYSREGULATED
          term:
            id: GO:0030042
            label: actin filament depolymerization
        - preferred_term: actin cytoskeleton organization
          modifier: ABNORMAL
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
      selected_evidence:
        snippet: Cellular studies of a lymphoblastoid cell line obtained from an affected patient demonstrated
          morphological abnormalities of the actin cytoskeleton and altered actin depolymerization dynamics
          in response to latrunculin A, an actin monomer-sequestering drug.
        supports: SUPPORT
