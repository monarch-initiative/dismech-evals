  354369ce04811b5dbfced2073dbd6bc0ac6fb86219c7402e912c1b5d652ad455:
    claim:
      about:
        disease:
          name: Developmental Malformations-Deafness-Dystonia Syndrome
          disease_term:
            preferred_term: developmental malformations-deafness-dystonia syndrome
            term:
              id: MONDO:0011823
              label: developmental malformations-deafness-dystonia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Trapped Closed-State Actin Monomer
        biological_scale: MOLECULAR
        description: 'The tryptophan stacks against Tyr69. That interaction perturbs nucleotide release
          from the monomer and biases it towards a closed conformation, which is what changes its polymerization
          behaviour. Recombinant protein work and molecular dynamics simulation agree on the mechanism.

          The modifier is ABNORMAL rather than DECREASED, and the reason is about export rather than about
          the biology. A closed nucleotide cleft retains its nucleotide, so what falls is exchange, not
          binding - but the bound term is GO:0000166 nucleotide binding, and kgx_export drops preferred_term
          and emits only the term id plus a direction qualifier. DECREASED here would put "beta-actin
          nucleotide binding is decreased" into the knowledge graph, which is the inverse of what the
          source reports. GO has no term for the exchange step itself, so the honest pairing is the binding
          term with a non-directional modifier.'
        molecular_functions:
        - preferred_term: actin nucleotide exchange
          modifier: ABNORMAL
          term:
            id: GO:0000166
            label: nucleotide binding
      selected_evidence:
        snippet: establishes an unusual stacking interaction with Tyr69 that perturbs nucleotide release
          from actin monomers and polymerization behavior by inducing a closed state conformation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25255767
      reference_title: Molecular mechanisms of disease-related human β-actin mutations p.R183W and p.E364K.
      evidence_source: IN_VITRO
      explanation: The structural mechanism, from recombinant protein assays and molecular dynamics.
