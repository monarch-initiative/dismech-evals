        notes: One patient, reported by the team that treated him. It is curated as a separate treatment
          from pallidal stimulation rather than folded into a generic "deep brain stimulation" record
          because the target is different and the evidence for each is a single-digit number of patients
          - merging them would make the combined evidence look stronger than either.
      selected_evidence:
        snippet: Significant improvement of motor function (Burke‐Fahn‐Marsden's Dystonia Rating Scales–Dystonia
