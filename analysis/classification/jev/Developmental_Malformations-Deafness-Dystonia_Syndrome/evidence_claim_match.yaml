          dystonia, and this patient was stimulated in the subthalamic nucleus instead, improving from
          a Burke-Fahn-Marsden motor score of 44 to 20 at twelve months. The benefit was topographically
          uneven - limbs far more than neck and trunk - which matters for a disease whose dystonia is
          generalized and whose bulbar involvement is what threatens life.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: bilateral subthalamic nucleus deep brain stimulation
