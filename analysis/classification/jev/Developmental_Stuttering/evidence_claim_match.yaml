  65e7cfd376412a3c2b163ec601e9a4c03e3b9545c803cfb1bff94fc4378545ea:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sparing of the Systemic Mucolipidosis Phenotype
        biological_scale: ORGANISM
        description: 'A negative node, curated because the absence is the finding. Carriers of stuttering-associated
          variants in these genes do not develop mucolipidosis II or III, despite mutations in the same
          pathway that causes those disorders.

          Three explanations are offered in the source, and they are not mutually exclusive: mucolipidosis
          II and III are recessive while nearly all the affected subjects here were heterozygous; all
          but one of the stuttering variants are missense rather than the truncating or deletion mutations
          typical of mucolipidosis, so the residual enzyme activity is presumably higher; and none of
          the specific variants found here has been reported in a mucolipidosis patient.

          The node matters for how the rest of the entry may be read: this is not a lysosomal storage
          disease with an unusually mild presentation, and it should not be curated as conforming to the
          lysosomal-substrate-accumulation module, because no substrate accumulation is demonstrated in
          these individuals.'
      selected_evidence:
        snippet: These three persons did not have the signs or symptoms typically seen in mucolipidosis
          types II and III
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:20147709
      reference_title: Mutations in the lysosomal enzyme-targeting pathway and persistent stuttering.
      evidence_source: HUMAN_CLINICAL
      explanation: The direct clinical examination establishing absence of the systemic phenotype.
