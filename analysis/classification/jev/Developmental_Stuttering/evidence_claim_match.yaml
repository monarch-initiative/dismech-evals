  27195f4eea4b3983a6f1d1257a59eda9e3af2b1e62873a7cf6f56ae7f63f8b84:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Treatment
      assertion:
        name: Behavioural Stuttering Intervention
        description: 'Speech and language therapy is the mainstay. A systematic review of 38 methodologically
          acceptable papers found the evidence base is markedly uneven by age: most evidence concerns
          early childhood stuttering, very little concerns school-aged children, and some concerns adults.
          The Lidcombe Program has the most convincing evidence in young children.

          In adults the review distinguishes two effects that are worth keeping separate: holistic approaches
          may influence both fluency and the overall experience of stuttering, whereas speech restructuring
          may improve the overt characteristics without affecting covert stuttering behaviour. A treatment
          that changes what a listener hears without changing what the speaker does is not the same result.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Speech Language Therapy
          term:
            id: NCIT:C159273
            label: Speech Language Therapy
      selected_evidence:
        snippet: The most convincing evidence is about the Lidcombe Program in the treatment of young
          children who stutter, but also other methods have promising evidence
        supports: SUPPORT
