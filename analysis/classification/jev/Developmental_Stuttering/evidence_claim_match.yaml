  0273484b3d4258e500a828bb8aed9b035ed3a26d9a9c064b6b490e7f144357db:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Treatment
      assertion:
        name: Dopamine D2 Receptor Antagonist Pharmacotherapy
        description: 'The pharmacological arm, and the therapeutic argument for the dopamine excess theory:
          antipsychotics that block striatal D2 receptors reduce stuttering symptoms. The mechanism runs
          through the node they act on - removing the indirect pathway from dopaminergic inhibition restores
          its efficacy, correcting the direct/indirect imbalance and returning inhibition of competing
          motor programs.

          Curated as mechanism, not as a recommendation. The cited review reports efficacy in passing
          and points to a separate review for the evidence base; it gives no dosing, no trial design and
          no comparison against behavioural therapy, which remains the mainstay curated above. The adverse-effect
          burden of chronic antipsychotic exposure in a non-psychotic and frequently paediatric population
          is not addressed by this source and is not curated here.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: dopamine D2 receptor antagonist (antipsychotic)
            term:
              id: NCIT:C29710
              label: Antipsychotic Agent
          - preferred_term: risperidone
            term:
              id: CHEBI:8871
              label: risperidone
      selected_evidence:
        snippet: antipsychotic drugs such as haloperidol and risperidone that block dopamine D2 striatal
          receptors are effective in treating symptoms of stuttering
        supports: SUPPORT
