  f75c57c23b98171e0eaa9c66bcb5586aa0ce698ec8e9e80bd5ea44c44a9a5a25:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Striatal Dopaminergic Direct/Indirect Pathway Imbalance
        biological_scale: CELLULAR
        description: 'The basal-ganglia-proper branch of the three candidate loci, and the one with a
          proposed molecular mechanism: the dopamine excess theory. Striatal dopamine acts in opposite
          directions on the two output pathways - exciting the direct pathway that activates the correct
          motor program, inhibiting the indirect pathway that suppresses competing ones. Excess dopamine
          therefore leaves too little inhibition of competing motor programs, so the desired program is
          not cleanly selected. The cited review maps that to the observable dysfluency types: a delayed
          choice yields a block or prolongation, an unstable initiation signal that drops out yields a
          repetition.

          Curated as a hypothesis, not a finding, and the modifier is deliberately omitted rather than
          set to INCREASED. Three things in the source argue against asserting a direction: the founding
          observation is three people who stutter against six controls; the same simulations show DECREASED
          striatal dopamine also producing dysfluency, which is how the review accounts for stuttering
          in Parkinson disease; and the authors themselves conclude there may be two subtypes with opposite
          imbalances. What is supported is that the direct/indirect balance is disturbed, not which way.'
        cell_types:
        - preferred_term: striatal medium spiny neuron
          term:
            id: CL:1001474
            label: medium spiny neuron
        biological_processes:
        - preferred_term: striatal dopamine receptor signaling
          term:
            id: GO:0007212
            label: G protein-coupled dopamine receptor signaling pathway
      selected_evidence:
        snippet: 'Striatal dopamine has opposite effects on the two pathways: it excites the direct pathway
          and inhibits the indirect pathway. Thus, excessive dopamine can lead to a situation in which
          there is insufficient inhibition to suppress competing motor programs'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:32047456
      reference_title: Involvement of the Cortico-Basal Ganglia-Thalamocortical Loop in Developmental
        Stuttering.
      evidence_source: HUMAN_CLINICAL
      explanation: States the direct/indirect mechanism. Marked PARTIAL because the review presents it
        as a hypothesis and elsewhere derives dysfluency from decreased striatal dopamine as well.
