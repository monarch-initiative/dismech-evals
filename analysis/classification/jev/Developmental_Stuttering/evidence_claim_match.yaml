  98c067fa8b074a6ef53fd2756ff1c70b0a2755a33f19934b62b69105f7a1dc3b:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mannose-6-Phosphate Lysosomal Enzyme Targeting
        biological_scale: MOLECULAR
        description: 'Variants in GNPTAB (the alpha/beta catalytic subunits of GlcNAc-phosphotransferase),
          GNPTG (its gamma recognition subunit) and NAGPA (the uncovering enzyme that performs the second
          step) impair generation of the mannose-6-phosphate signal that directs a diverse group of hydrolases
          to the lysosome.

          Mutations were found in 25 of 786 case chromosomes against 4 of 744 control chromosomes. The
          pathway argument is what carries this rather than any single variant: the mutations are scattered
          across three genes, but all three genes act in one well-defined metabolic pathway, and each
          affected residue is conserved across vertebrates.

          NAGPA is the striking member. No human disorder had previously been associated with mutations
          in it, so nonsyndromic persistent stuttering is the first phenotype attributed to loss of the
          uncovering enzyme.'
        biological_processes:
        - preferred_term: protein targeting to lysosome
          term:
            id: GO:0006622
            label: protein targeting to lysosome
          modifier: DECREASED
      selected_evidence:
        snippet: These genes encode enzymes that generate the mannose-6-phosphate signal, which directs
          a diverse group of hydrolases to the lysosome
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:20147709
      reference_title: Mutations in the lysosomal enzyme-targeting pathway and persistent stuttering.
      evidence_source: HUMAN_CLINICAL
      explanation: States the shared biochemical function of the three implicated genes.
