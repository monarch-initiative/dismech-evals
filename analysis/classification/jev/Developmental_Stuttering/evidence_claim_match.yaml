  eb2adf30673ca35daa4bd0aa0dc0ff8d5154320d3206ddee62fd24b6b79a0a78:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Genetic
      assertion:
        name: Common-Variant Architecture
        association: 'The entry is category Complex, and this is the evidence for that. Genome-wide analyses
          of self-reported stuttering across more than a million individuals - 99,776 cases and 1,023,243
          controls, stratified by sex and ancestry - identified 57 unique loci, with the genetic risk
          validated in two independent datasets.

          The polygenic picture and the rare-variant trafficking picture are not competitors. The four
          genes above come from consanguineous families and rare-variant burden; these 57 loci describe
          liability in the general population, where most stuttering sits.

          The same analysis reports genetic similarity with autism, depression and impaired musical rhythm
          across sexes. The rhythm correlation is the one worth flagging for mechanism: it is the only
          one of the three that points at timing, which is what the cortico-basal ganglia model of this
          disorder is about.'
        relationship_type: SUSCEPTIBILITY
      selected_evidence:
