  e214377a23862843fdebce0b788f93904df0906fc03f7beaa99eabb193c20848:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Genetic
      assertion:
        name: GNPTAB
        gene_term:
          preferred_term: GNPTAB
          term:
            id: hgnc:29670
            label: GNPTAB
        association: 'Encodes the alpha and beta catalytic subunits of GlcNAc-phosphotransferase. A Glu1200Lys
          missense variant was associated with stuttering in a large consanguineous Pakistani family and
          recurred in several others, appearing most common in populations from the Asian subcontinent;
          three further GNPTAB variants were found in unrelated affected subjects.

          Inheritance does not fit a clean dominant or recessive model. Two homozygotes and nine heterozygotes
          in the index family do not stutter, and the source proposes an additive model with nonpenetrance
          - noting that both nonpenetrant homozygotes were female, the sex with the higher recovery rate.
          Severely disruptive GNPTAB mutations cause mucolipidosis II, but none of the variants found
          here has been seen in a mucolipidosis patient.'
        relationship_type: SUSCEPTIBILITY
      selected_evidence:
        snippet: We identified a missense mutation in the N-acetylglucosamine-1-phosphate transferase
          gene (GNPTAB), which encodes the alpha and beta catalytic subunits of GlcNAc-phosphotransferase
        supports: SUPPORT
