  c36a23da396ef8c92483f0df340af14817db5262b81e3c36b390e8f5145c1b50:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Astrocyte Pathology in the Corpus Callosum
        biological_scale: CELLULAR
        description: 'The cell type that carries the deficit, and the closest thing this disease has to
          an answer for why a housekeeping-gene mutation hits only speech.

          Mice carrying human GNPTAB stuttering mutations show a marked decrease in astrocyte staining,
          most pronounced in the corpus callosum, with diffusion-tensor imaging detecting deficits in
          the same structure. The specificity is what makes it informative: Purkinje cells, oligodendrocytes,
          microglia and dopaminergic neurons were not significantly different in the same animals.

          The decisive experiment is conditional rather than correlational. Across a panel of cell-type-specific
          Cre drivers crossed to a Gnptab conditional knockout, only the astrocyte-specific animals reproduced
          the vocalisation deficit. So the requirement sits in astrocytes, not in the neurons of the speech-motor
          circuit - which is not where this entry''s circuit-level model would have predicted it.

          The authors read the corpus callosum localisation as support for interhemispheric accounts of
          stuttering. This entry records that reading without adopting it: the human imaging literature
          is not settled, and one mouse structure is not a human mechanism.'
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: protein targeting to lysosome
          term:
            id: GO:0006622
            label: protein targeting to lysosome
          modifier: DECREASED
      selected_evidence:
        snippet: Immunohistochemistry showed a marked decrease in staining of astrocytes, particularly
          in the corpus callosum of the Gnptab Ser321Gly homozygote mice compared to wild-type littermates,
          while the staining of cerebellar Purkinje cells, oligodendrocytes, microglial cells, and dopaminergic
          neurons was not significantly different
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:31405983
      reference_title: Human GNPTAB stuttering mutations engineered into mice cause vocalization deficits
        and astrocyte pathology in the corpus callosum.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the astrocyte deficit and, in the same sentence, the four cell types that
        were spared - which is what makes it specific rather than general pathology.
