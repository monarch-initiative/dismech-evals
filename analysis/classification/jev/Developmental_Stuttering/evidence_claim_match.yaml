  bcc16fbffbd9347878e86de95dd3df97f46ebc4d59d734cca81b4dbcbb8ae02b:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Genetic
      assertion:
        name: AP4E1
        gene_term:
          preferred_term: AP4E1
          term:
            id: hgnc:573
            label: AP4E1
        association: 'A fourth gene, and one that widens the mechanistic story rather than repeating it.
          Whole-exome sequencing identified two heterozygous coding variants co-segregating with persistent
          stuttering in a large Cameroonian family, with 23 further rare variants - including predicted
          loss-of-function - found in unrelated stuttering individuals across Cameroon, Pakistan and North
          America, at a rate significantly higher than in population-matched controls.

          AP4E1 encodes a subunit of the adaptor protein 4 complex, so it is intracellular trafficking
          rather than lysosomal enzyme targeting specifically. That matters for how this entry reads:
          the converging theme across all four genes is vesicular trafficking, of which mannose-6-phosphate
          targeting is one branch.'
        relationship_type: SUSCEPTIBILITY
      selected_evidence:
        snippet: Whole-exome sequencing identified two heterozygous AP4E1 coding variants, c.1549G>A (p.Val517Ile)
          and c.2401G>A (p.Glu801Lys), that co-segregate with persistent developmental stuttering in a
          large Cameroonian family
        supports: SUPPORT
