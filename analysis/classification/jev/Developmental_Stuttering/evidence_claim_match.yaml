  dd7e69308a6f2479ccd7c7fb90338d87b707c0f43abaf3d0aa8e7ce55003875c:
    claim:
      about:
        disease:
          name: Developmental Stuttering
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Speech Motor Sequencing Deficit
        biological_scale: TISSUE
        description: 'Malfunction in the cortico-basal ganglia-thalamocortical loop responsible for initiating
          speech motor programs, the leading neural account of stuttering. Three loci within that loop
          are candidates and the evidence does not yet discriminate among them: the basal ganglia proper,
          the axonal projections between cortex, basal ganglia and thalamus, and cortical processing itself.

          An interpretive caution the cited review is explicit about, and which this entry preserves rather
          than smoothing over: findings in adults who stutter may reflect compensatory reorganisation
          after years of stuttering rather than the core deficit, so adult and paediatric imaging results
          cannot be pooled uncritically.

          Deliberately carries no cell type: committing one here would pick out a single locus among the
          three the evidence does not discriminate. The basal-ganglia-proper branch is curated as its
          own node below, which is where the striatal cell type sits.'
        biological_processes:
        - preferred_term: vocalization behavior
          term:
            id: GO:0071625
            label: vocalization behavior
          modifier: ABNORMAL
      selected_evidence:
        snippet: we propose that the primary impairment underlying stuttering behavior is malfunction
          in the cortico-basal ganglia-thalamocortical (hereafter, cortico-BG) loop that is responsible
          for initiating speech motor programs
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:32047456
      reference_title: Involvement of the Cortico-Basal Ganglia-Thalamocortical Loop in Developmental
        Stuttering.
      evidence_source: HUMAN_CLINICAL
      explanation: States the circuit-level hypothesis, in its authors' framing as a proposal rather than
        an established fact.
