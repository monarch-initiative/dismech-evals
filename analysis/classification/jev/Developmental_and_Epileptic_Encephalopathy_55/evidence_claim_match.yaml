  c077d86bc581d65a722605689b8f1b66a967c20683d7da7e11a776210004a73b:
    claim:
      about:
        disease:
          name: Developmental and Epileptic Encephalopathy 55
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 55
            term:
              id: MONDO:0033364
              label: developmental and epileptic encephalopathy, 55
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired First Step of GPI Anchor Biosynthesis
        biological_scale: MOLECULAR
        description: 'GPI anchor precursors are assembled in the endoplasmic reticulum through a multistep
          pathway and then transferred to target proteins, which are further remodelled in the ER and
          Golgi before reaching the cell surface. PIGP is a subunit of the complex that performs the first
          step of that pathway; reduced PIGP function throttles flux at the entry point, so the deficit
          is felt by every downstream GPI-anchored protein rather than by a subset.

          '
        biological_processes:
        - preferred_term: GPI anchor biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0006506
            label: GPI anchor biosynthetic process
      selected_evidence:
        snippet: PIGP encodes a subunit of the enzyme that catalyzes the first step of GPI anchor biosynthesis.
        supports: SUPPORT
