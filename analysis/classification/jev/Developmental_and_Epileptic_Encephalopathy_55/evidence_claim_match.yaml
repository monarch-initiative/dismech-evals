      assertion_type: Pathophysiology
      assertion:
        name: Reduced GPI-Anchored Protein Surface Expression
        biological_scale: CELLULAR
        description: 'The measurable cellular lesion. Patient cells show reduced surface levels of GPI-anchored
          proteins, and this is restored by exogenous expression of wild-type PIGP — the rescue that establishes
          causation rather than correlation. Because over 150 human proteins are GPI-anchored, the effect
          is a class-wide reduction in surface density. This entry deliberately does not name a single
          culprit protein: no experiment attributes the neurological phenotype to any particular GPI-anchored
          protein, and the sources do not.

          '
        cell_types:
        - preferred_term: granulocyte
          term:
            id: CL:0000094
            label: granulocyte
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Functional studies with patient cells showed reduced PIGP mRNA levels, and an associated
          reduction of GPI-anchored cell surface proteins, which was rescued by exogenous expression of
          wild-type PIGP.
        supports: SUPPORT
