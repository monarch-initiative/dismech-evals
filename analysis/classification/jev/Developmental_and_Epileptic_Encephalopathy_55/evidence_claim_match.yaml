        biological_scale: MOLECULAR
        description: 'Compound heterozygous or homozygous PIGP variants. Reported alleles include c.74T>C
          (p.Met25Thr) with c.456delA (p.Glu153AsnFs*34) in the founding siblings, a recurrent homozygous
          c.384del in a large inbred family, and a start-codon variant in trans with a 136 kb deletion
          removing the whole gene. The effect is reduction rather than abolition of PIGP function: patient
          cells retained reduced PIGP mRNA, and c.384del is predicted to yield a longer-than-wild-type
          protein with impaired functionality rather than no protein at all.

          '
        genes:
        - preferred_term: PIGP
          term:
            id: hgnc:3046
            label: PIGP
          modifier: DECREASED
        genetic_context:
          description: Germline biallelic PIGP alleles spanning missense, frameshift, start-loss and a
            136 kb whole-gene deletion. Both compound heterozygous and homozygous families are reported,
            so `zygosity` is deliberately left unset rather than picking one — the slot is single-valued
            and either value would misdescribe half the cohort. The disease state is a partial rather
            than complete loss of function.
          allelic_events:
          - MISSENSE_VARIANT
          - FRAMESHIFT_VARIANT
          - DELETION
          - COPY_NUMBER_LOSS
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: 'Here, we report two siblings with compound heterozygous variants in the gene phosphatidylinositol
          glycan anchor biosynthesis, class P (PIGP) (NM_153681.2: c.74T > C;p.Met25Thr and c.456delA;p.Glu153AsnFs*34).'
        supports: SUPPORT
