            term:
              id: MONDO:0033364
              label: developmental and epileptic encephalopathy, 55
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serum alkaline phosphatase (a negative, not a screen)
        description: 'Hyperphosphatasia is strong evidence of an inherited GPI deficiency when present,
          but it arises from defects in the *later* steps of GPI biosynthesis and anchor remodelling —
          Mabry syndrome being the type case. PIGP acts at the first step, so a normal alkaline phosphatase
          does not argue against this diagnosis. Recorded here because using hyperphosphatasia as a screening
          test would systematically miss early-pathway defects like this one.

          '
      selected_evidence:
        snippet: Hyperphosphatasia is observed in some patients with IGDs, such as hyperphosphatasia mental
          retardation syndrome or Mabry syndrome, caused by mutations in genes in the later stage of GPI
          biosynthesis.
        supports: SUPPORT
