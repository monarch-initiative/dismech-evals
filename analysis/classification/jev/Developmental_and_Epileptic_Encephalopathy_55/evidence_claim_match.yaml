        name: PIGP
        gene_term:
          preferred_term: PIGP
          term:
            id: hgnc:3046
            label: PIGP
        relationship_type: CAUSATIVE
        notes: 'PIGP encodes a subunit of the GPI-GlcNAc transferase complex catalysing the first step
          of GPI anchor biosynthesis. It is one of seven genes (PIGA, PIGC, PIGH, PIGP, PIGQ, PIGY, DPM2)
          mediating that initial stage, which is why the PIGP phenotype resembles those of PIGA, PIGQ
          and PIGY deficiency rather than those of later-step genes.

          '
      selected_evidence:
        snippet: the initial stage of their biosynthesis is mediated by PIGA, PIGC, PIGH, PIGP, PIGQ,
          PIGY, and DMP2 genes, which have been linked to a wide spectrum of phenotypes depending on the
          gene damaged
        supports: SUPPORT
