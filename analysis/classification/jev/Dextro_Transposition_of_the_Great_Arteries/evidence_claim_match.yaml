            term:
              id: MONDO:0019443
              label: dextro-looped transposition of the great arteries
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormal conotruncal septation and cardiac looping
        description: During cardiac development, the conotruncal (outflow-tract) septum normally spirals
          as it descends, dividing the truncus arteriosus so that the aorta aligns with the left ventricle
          and the pulmonary trunk with the right ventricle. In d-TGA the conotruncal septum forms abnormally
          (non-spiraling / linear), and abnormal cardiac looping/alignment results in the aorta arising
          from the morphologic right ventricle and the pulmonary trunk from the morphologic left ventricle.
          Cardiac neural crest cells and second-heart-field progenitors that populate the outflow tract
          are central to this morphogenesis.
        cell_types:
        - preferred_term: migratory cardiac neural crest cell
          term:
            id: CL:2000073
            label: migratory cardiac neural crest cell
        biological_processes:
        - preferred_term: heart looping
          modifier: ABNORMAL
          term:
            id: GO:0001947
            label: heart looping
        - preferred_term: outflow tract septum morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003148
            label: outflow tract septum morphogenesis
        - preferred_term: cardiac neural crest cell development involved in outflow tract morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0061309
            label: cardiac neural crest cell development involved in outflow tract morphogenesis
      selected_evidence:
        snippet: New techniques for studying heart development have revealed many aspects of cardiac morphogenesis
          that are important in the development of CHDs, in particular transposition of the great arteries.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39000221
      reference_title: 'Cardiac Development and Factors Influencing the Development of Congenital Heart
        Defects (CHDs): Part I.'
      evidence_source: OTHER
      explanation: Connects the developmental cardiac morphogenesis program specifically to transposition
        of the great arteries.
