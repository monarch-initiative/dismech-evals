          modifier: ABNORMAL
          term:
            id: GO:0008015
            label: blood circulation
      selected_evidence:
        snippet: As a result, the pulmonary and systemic circulations are separated [the morphological
          right ventricle (RV) is connected to the aorta and the morphological left ventricle (LV) is
          connected to the pulmonary artery].
        supports: SUPPORT
