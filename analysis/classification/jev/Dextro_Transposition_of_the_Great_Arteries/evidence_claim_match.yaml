      assertion_type: Inheritance
      assertion:
        name: Oligogenic / complex (familial laterality-gene stratum)
        inheritance_term:
          preferred_term: Oligogenic inheritance
          term:
            id: HP:0010983
            label: Oligogenic inheritance
        description: 'Scoped deliberately to the familial stratum. Most d-TGA is sporadic with multifactorial
          pathogenesis and no identified locus; this block records the minority of familial or isolated
          cases in which multiple laterality-gene mutations segregate together, which is what places d-TGA
          in the same disease spectrum as heterotaxy. Because the Inheritance class has no genes slot,
          the loci are named here: ZIC3, NODAL, FOXH1, CFC1 and GDF1, plus the cardiac transcription factor
          NKX2-5; all are covered by the genetic section''s laterality and transcription-factor record.'
      selected_evidence:
        snippet: The present study provides evidence that some cases of familial TGA are caused by mutations
          in laterality genes and therefore are part of the same disease spectrum of heterotaxy syndrome,
          and argues for an oligogenic or complex mode of inheritance in these pedigrees.
        supports: SUPPORT
