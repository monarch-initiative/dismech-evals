              label: dextro-looped transposition of the great arteries
        context: []
      assertion_type: Subtype
      assertion:
        name: TGA-IVS
        display_name: d-TGA with intact ventricular septum
        description: d-TGA with an intact ventricular septum is the most common anatomic form. Intercirculatory
          mixing depends almost entirely on the patent foramen ovale and patent ductus arteriosus, so
          these neonates are typically the most profoundly cyanotic and present earliest. It is the classic
          indication for early prostaglandin E1, balloon atrial septostomy, and neonatal arterial switch
          operation.
      selected_evidence:
        snippet: Completely parallel circulatory circuits are incompatible with life and require a patent
          ductus arteriosus (PDA) or an atrial (ASD) or ventricular septal defect (VSD) to allow the mixing
          of oxygenated and deoxygenated blood
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30860704
      reference_title: Transposition of the Great Arteries.
      evidence_source: OTHER
      explanation: With an intact ventricular septum, survival depends on atrial- and ductal-level mixing
        (PFO/PDA), explaining the profound early cyanosis of this subtype.
