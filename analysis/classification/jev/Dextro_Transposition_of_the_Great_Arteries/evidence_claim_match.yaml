          and pulmonary circulations form two separate, parallel loops. Deoxygenated systemic venous blood
          is pumped back to the body and oxygenated pulmonary venous blood is pumped back to the lungs,
          so without a site of intercirculatory mixing the circulation is incompatible with life.
        locations:
