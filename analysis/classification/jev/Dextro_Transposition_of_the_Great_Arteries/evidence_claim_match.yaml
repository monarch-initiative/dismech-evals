      assertion_type: Pathophysiology
      assertion:
        name: Mixing-dependent neonatal cyanosis
        description: Systemic oxygen delivery in d-TGA depends on intercirculatory mixing across the patent
          foramen ovale, patent ductus arteriosus, and/or a ventricular septal defect. As the ductus closes
          after birth, mixing falls and profound hypoxemia ensues, producing central cyanosis within the
          first days to weeks of life. This dependence underlies the use of prostaglandin E1 to keep the
          ductus open and balloon atrial septostomy to enlarge atrial-level mixing.
      selected_evidence:
        snippet: Patients with d-TGA typically present with cyanosis within the first 30 days of life.
        supports: SUPPORT
