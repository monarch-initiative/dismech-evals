        name: Ventriculoarterial discordance and parallel circulation
        description: With the aorta arising from the morphologic right ventricle and the pulmonary artery
          from the morphologic left ventricle (with normal atrioventricular connections), the systemic
          and pulmonary circulations form two separate, parallel loops. Deoxygenated systemic venous blood
          is pumped back to the body and oxygenated pulmonary venous blood is pumped back to the lungs,
          so without a site of intercirculatory mixing the circulation is incompatible with life.
        locations:
        - preferred_term: aorta
          term:
            id: UBERON:0000947
            label: aorta
        - preferred_term: pulmonary artery
