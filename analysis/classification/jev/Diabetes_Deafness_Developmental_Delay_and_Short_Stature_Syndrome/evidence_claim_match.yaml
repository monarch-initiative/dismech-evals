        role: effector
        biological_scale: CELLULAR
        description: 'Beta cells are under high demand for insulin synthesis, folding and secretion, and
          proinsulin folds in the ER before it can be packaged. That standing load is why the beta cell
          is where an ER stress buffer is worth most, and it is the reason a ubiquitously relevant chaperone
          deficit produces diabetes as its cardinal feature.

          In MANF-knockout human beta-like cells the ER stress markers BiP, GRP170 and TXNIP trend upward
          and proinsulin accumulates. The stress is real but mild at baseline - the phenotype needs a
          challenge to become visible, which is the point of the next node.'
        cell_types:
        - preferred_term: pancreatic beta cell
          term:
            id: CL:0000169
            label: type B pancreatic cell
        biological_processes:
