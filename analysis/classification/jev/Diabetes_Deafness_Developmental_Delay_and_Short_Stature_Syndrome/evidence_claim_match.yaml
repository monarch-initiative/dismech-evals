  c3ec08a5fbe43c7b5894f6f4fe35bcd580cfd60e1d0f0d340fcfdca41cefa326:
    claim:
      about:
        disease:
          name: Diabetes Deafness Developmental Delay and Short Stature Syndrome
          disease_term:
            preferred_term: diabetes, deafness, developmental delay, and short stature syndrome
            term:
              id: MONDO:0957997
              label: diabetes, deafness, developmental delay, and short stature syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Beta-Cell Reserve Against Folding Challenge
        role: central_effector
        biological_scale: CELLULAR
        description: 'The node that carries the actual human finding, and the one that distinguishes this
          disease from a developmental beta-cell disorder. MANF-null human beta-like cells develop normally;
          they fail when challenged.

          The challenge experiments are discriminating rather than uniformly positive, which is informative
          about the mechanism. Tunicamycin (blocking N-linked glycosylation) and thapsigargin (depleting
          ER calcium) killed knockout and wild-type cells about equally. Brefeldin A, which blocks ER-to-Golgi
          cargo transfer, killed 29% of knockout cells against 18% of wild-type - a significant difference,
          and a modest one. So the vulnerability is not to ER stress in general but to a block in secretory
          export: a defect of the trafficking arm rather than of the folding arm.

          Both numbers are stated deliberately. Against a wild-type baseline of 18%, this is a shift in
          susceptibility rather than a switch between survival and death, and an entry that reported only
          the 29% would imply a starker result than the experiment produced.

          Transplantation supplies the in vivo counterpart: knockout grafts failed particularly in recipient
          mice that were themselves diabetic, i.e. under metabolic demand.'
      selected_evidence:
        snippet: Our results show that lack of MANF does not affect the development of human β-cells but
          increases their susceptibility to ER stress–induced functional failure.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33500254
      reference_title: Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic
        Reticulum Stress.
      evidence_source: IN_VITRO
      explanation: 'The central claim of the entry: normal development, lost reserve. This is also where
        the human result parts company with the mouse.'
