          term:
            id: GO:0034975
            label: protein folding in endoplasmic reticulum
          modifier: ABNORMAL
      selected_evidence:
        snippet: Loss of MANF induced mild ER stress and impaired insulin-processing capacity of β-cells
          in vitro.
        supports: SUPPORT
