  bea1c9acaaf1779a15a859956e865607a6cb3493fbed37e4b2b9f5fc86f9cd11:
    claim:
      about:
        disease:
          name: Diabetes Deafness Developmental Delay and Short Stature Syndrome
          disease_term:
            preferred_term: diabetes, deafness, developmental delay, and short stature syndrome
            term:
              id: MONDO:0957997
              label: diabetes, deafness, developmental delay, and short stature syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: human_model_mismatch_manf_beta_cell_route
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the Manf-null mouse, in which beta-cell mass is lost postnatally through reduced
          proliferation and increased apoptosis, model the human disease, in which MANF-knockout beta
          cells develop normally and fail only under secretory challenge?
        attaches_to:
        - pathophysiology#Loss of Beta-Cell Reserve Against Folding Challenge
        rationale: 'The two systems agree on the endpoint and disagree on the route. Both develop diabetes,
          and both show chronic UPR activation in islets. But the mouse gets there by losing beta-cell
          mass, and the human knockout does not lose beta cells at all - it loses their tolerance of a
          block in secretory export.

          The distinction is not academic. A mass-loss mechanism makes beta-cell regeneration the obvious
          therapeutic target, and MANF overexpression enhancing beta-cell regeneration in diabetic mice
          is exactly the conclusion the mouse paper draws. A reserve-loss mechanism points instead at
          reducing folding or trafficking demand in a beta-cell mass that is already there. Which of these
          is right for the two patients is unresolved, and this entry''s pathograph is built on the human
          result because it is the human result.

          Two things keep this a mismatch to be resolved rather than a verdict against the mouse. The
          authors themselves read the difference partly as one of rate: their patients were diagnosed
          at ten and seventeen years, against severe early-onset diabetes in the mouse, which they take
          to mean slower beta-cell failure in humans rather than a different failure. And outside the
          pancreas the mouse looks like the patients - the paper states that Manf-null mouse neurological
          phenotypes resemble the human ones.

          A caveat in the other direction: the human evidence is an isogenic embryonic-stem-cell knockout,
          not a patient-derived line carrying either observed variant, and differentiated beta-like cells
          are developmentally immature. A developmental phenotype appearing only in a mature islet over
          years would be invisible in that system - and the paper''s own in vivo arm is consistent with
          that reading, since deterioration became obvious only once the grafted cells carried the insulin
          demand of a diabetic host.'
        proposed_experiments:
        - experiment_id: manf_patient_ipsc_islet_mass_and_challenge
          name: Patient-derived iPSC islet organoids, mass versus challenge tolerance
          description: Derive induced pluripotent stem cells from both reported patients, differentiate
            to islet organoids, and compare beta-cell yield and proliferation index against isogenic corrected
            controls as well as challenge tolerance, so that the mass question and the reserve question
            are answered in the same patient genotype.
        - experiment_id: manf_longitudinal_beta_cell_function_in_patients
          name: Longitudinal stimulated C-peptide in the reported patients
          description: Follow C-peptide longitudinally in the reported patients against mixed-meal stimulation,
            to distinguish a progressively shrinking beta-cell mass from a stable mass with impaired stimulated
            secretion.
      selected_evidence:
        snippet: We generated MANF-deficient mice that strikingly develop severe diabetes due to progressive
          postnatal reduction of β cell mass, caused by decreased proliferation and increased apoptosis.
        supports: SUPPORT
