  077284e1049690b9bd88ecff4f38e5420c07973803db9e4b772bb720adc5a342:
    claim:
      about:
        disease:
          name: Diabetes Deafness Developmental Delay and Short Stature Syndrome
          disease_term:
            preferred_term: diabetes, deafness, developmental delay, and short stature syndrome
            term:
              id: MONDO:0957997
              label: diabetes, deafness, developmental delay, and short stature syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extrapancreatic Neurodevelopmental and Growth Phenotype
        role: outcome
        biological_scale: ORGANISM
        description: 'Severe short stature, bilateral sensorineural deafness, microcephaly and developmental
          delay accompany the diabetes and give the syndrome its name. The two patients have different
          homozygous variants and strikingly similar extrapancreatic features, which is itself an argument
          that these belong to the disease rather than to either family.

          The authors do offer a reason, and it is an argument from company rather than a demonstration:
          the brain is sensitive to ER-stress-mediated damage and is almost always affected alongside
          the pancreas in the other ER-stress monogenic diabetes syndromes, so the same is inferred here.
          For the cochlea there is a mouse experiment - inner-ear MANF inactivation kills outer hair cells
          progressively with hearing loss - and Manf-null mice also show a growth defect independent of
          their diabetes. So the extrapancreatic arm has a proposed mechanism supported by analogy and
          by mouse data, and no measurement in these patients. The entry curates it at that strength;
          the residual uncertainty is a knowledge gap below.

          One asymmetry between the two patients bears directly on the short stature: case 2 has partial
          hypopituitarism with growth hormone, thyroid-stimulating hormone and gonadotropin deficiency,
          while case 1 had none by fourteen years of age. Short stature in this syndrome may therefore
          not have a single route even across two patients.'
      selected_evidence:
        snippet: We show that homozygous loss-of-function variants in MANF cause a novel multisystem disorder
          characterized by childhood-onset diabetes, short stature, deafness, developmental delay, and
          microcephaly.
        supports: SUPPORT
    origin:
