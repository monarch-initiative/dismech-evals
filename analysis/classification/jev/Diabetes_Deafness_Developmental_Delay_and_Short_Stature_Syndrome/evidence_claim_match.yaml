  aeaf327d5de6a49d2135c69d0ecea05287d4f83a35457009aa75bc03a75a4279:
    claim:
      about:
        disease:
          name: Diabetes Deafness Developmental Delay and Short Stature Syndrome
          disease_term:
            preferred_term: diabetes, deafness, developmental delay, and short stature syndrome
            term:
              id: MONDO:0957997
              label: diabetes, deafness, developmental delay, and short stature syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_extrapancreatic_features_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Are the microcephaly, developmental delay, deafness and short stature of MANF syndrome
          caused by the same ER-stress mechanism as the diabetes, and is the short stature in case 2 a
          direct consequence of MANF loss or secondary to that patient's hypopituitarism?
        attaches_to:
        - pathophysiology#Extrapancreatic Neurodevelopmental and Growth Phenotype
        rationale: 'A mechanism is proposed for each extrapancreatic feature, and none is measured in
          these patients. The neurological argument is by analogy - the brain is ER-stress-sensitive and
          is affected in the other ER-stress diabetes syndromes, so it is inferred to be affected here.
          The cochlear and growth arguments rest on mouse experiments. Nothing has been assayed in patient
          tissue, which with two patients is unsurprising but leaves the whole extrapancreatic arm resting
          on inference.

          The sharpest concrete question is the short stature, because the two patients are not alike.
          Case 2 has partial hypopituitarism including growth hormone deficiency, which is a sufficient
          explanation for short stature on its own. Case 1 had no hypopituitarism by fourteen. Either
          short stature has two routes in two patients, or the hypopituitarism is itself a MANF consequence
          and case 1 has not manifested it yet. The mouse data favour a direct route, since Manf-null
          mice are short independently of their diabetes, but the mouse growth defect has not been shown
          to be pituitary-independent either.'
        proposed_experiments:
        - experiment_id: manf_pituitary_axis_longitudinal
          name: Longitudinal pituitary axis testing in both patients
          description: Serial growth hormone, thyroid-stimulating hormone and gonadotropin testing in
            case 1 into adulthood, to establish whether hypopituitarism is a late and universal feature
            of MANF loss or a finding specific to case 2.
        - experiment_id: manf_mouse_growth_pituitary_independence
          name: Pituitary-independent growth defect in Manf-null mice
          description: Test whether the diabetes-independent growth defect of Manf-null mice also persists
            under growth hormone replacement, separating a direct skeletal or systemic effect from a pituitary
            one.
      selected_evidence:
        snippet: Case 2 also has partial hypopituitarism with deficiency in growth hormone, thyroid-stimulating
          hormone, and gonadotropins. Hypopituitarism has not been detected in case 1 by 14 years of age.
        supports: SUPPORT
