              label: diabetes, deafness, developmental delay, and short stature syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_two_patients_bounds_every_frequency
        kind: INTERPRETATION
        status: OPEN
        prompt: How should phenotype frequencies be curated for a disease with two described patients?
        attaches_to:
        - pathophysiology#Extrapancreatic Neurodevelopmental and Growth Phenotype
        rationale: 'Every phenotype in this entry is banded OBLIGATE, and every one of those bands rests
          on n=2. That is technically accurate and epistemically almost empty: two patients cannot distinguish
          an obligate feature from a common one, and both were ascertained through a cohort selected for
          syndromic diabetes, which guarantees the diabetes and biases towards multisystem presentations.

          The authors bounded the rarity themselves. Sanger sequencing MANF in 187 further patients with
          diabetes plus microcephaly, developmental delay, deafness or short stature, together with individuals
          homozygous across the region, found no additional cases. So the absence of more patients is
          a measured result rather than an unsearched gap - but it also means the milder end of the phenotype,
          if there is one, was never eligible to be found, since the screen required the syndromic features.

          Recorded so that a future curator adding a third patient knows the existing bands were always
          provisional and should be recomputed rather than reinforced.'
      selected_evidence:
        snippet: Sanger sequencing of MANF from additional 187 patients presenting with diabetes and microcephaly,
          developmental delay, deafness, or short stature and/or are homozygous for the region incorporating
          MANF did not identify additional case subjects.
        supports: SUPPORT
