        context: []
      assertion_type: Diagnosis
      assertion:
        name: Differentiation from Wolfram Syndrome
        description: 'Wolfram syndrome is the nearest differential - it also has childhood-onset diabetes
          with progressive beta-cell dysfunction, developmental delay and deafness. The separating features
          run in both directions: Wolfram has optic atrophy, diabetes insipidus and urological defects,
          which MANF syndrome lacks; MANF syndrome has short stature and microcephaly, which are not reported
          in Wolfram.'
      selected_evidence:
        snippet: However, it lacks optic atrophy, diabetes insipidus, and urological defects that are
          common in Wolfram syndrome. Furthermore, the short stature and microcephaly seen in MANF syndrome
          are not reported in Wolfram syndrome.
        supports: SUPPORT
