          role: subtype
      assertion_type: Genetic
      assertion:
        name: PDX1
        gene_term:
          preferred_term: PDX1
          term:
            id: hgnc:6107
            label: PDX1
        relationship_type: CAUSATIVE
        subtype: maturity-onset diabetes of the young type 4
        notes: PDX1 encodes the homeodomain transcription factor that drives pancreatic development and
          beta-cell differentiation and directly regulates the insulin gene. Biallelic loss causes pancreatic
          agenesis; heterozygous variants are a rare cause of MODY. ClinGen had flagged PDX1 as a MODY
          gene whose evidence was insufficient to support or refute; a 2025 case-control burden analysis
          then found rare damaging PDX1 variants enriched in MODY cases, at a level comparable to the
          low-penetrance gene RFX6, so the relationship is curated here as causative with low penetrance
          rather than as disputed.
      selected_evidence:
