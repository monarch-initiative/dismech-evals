        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chronic Hyperglycemia (shared diabetic complication cascade)
        description: 'Sustained hyperglycemia is the shared, subtype-independent driver of diabetic tissue
          injury across every form of diabetes mellitus. Whatever the upstream route (autoimmune beta-cell
          destruction in type 1, insulin resistance with beta-cell secretory failure in type 2, undernutrition-associated
          beta-cell impairment in type 5, or a monogenic beta-cell defect), chronic hyperglycemia feeds
          one conserved cascade: hyperglycemia-induced oxidative and AGE-RAGE stress, endothelial dysfunction
          and vascular inflammation, micro- and macrovascular injury, and diabetic end-organ complications
          (kidney disease, retinopathy, neuropathy, atherosclerotic cardiovascular disease). That cascade
          is captured once in the diabetic_vascular_complications module, to which this node conforms;
          the per-type entries elaborate their own routes to hyperglycemia.'
        conforms_to: diabetic_vascular_complications#Chronic Hyperglycemia
        biological_processes:
        - preferred_term: glucose homeostasis
          term:
            id: GO:0042593
            label: glucose homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: According to the World Health Organization (WHO) diabetes mellitus is a chronic, metabolic
          disease characterized by elevated levels of blood glucose, which leads over time to damage to
          the heart, vasculature, eyes, kidneys and nerves.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
