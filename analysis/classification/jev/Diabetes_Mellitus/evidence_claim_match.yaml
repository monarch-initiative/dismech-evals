          which is the type 1 diabetes INS-region susceptibility association; the two are different assertions
          about the same gene. Heterozygous INS variants most often cause neonatal diabetes, but missense
          alleles cosegregating with a MODY phenotype have been reported in several families, and a 2026
          burden analysis found loss-of-function alleles that escape nonsense-mediated decay strongly
          enriched in MODY cases. Deliberately not bound as a gene descriptor on the Monogenic Beta-Cell
