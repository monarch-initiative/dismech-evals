              with secretory failure, the monogenic forms reach it through a primary functional defect
              of the beta cell itself: loss of a transcription factor governing pancreatic development
              and beta-cell function (HNF1A, HNF4A, HNF1B, PDX1, and on current evidence NEUROD1 and RFX6),
              a raised glucose set point for insulin release (GCK), a mishandled ATP-sensitive potassium
              channel (ABCC8, KCNJ11), an insulin-gene defect, or beta-cell loss within a wider syndrome
              (EIF2AK3, WFS1, ALMS1, CISD2, SLC19A2, CEL). This node exists so that those genes reach
              the pathograph; the per-gene mechanisms are not elaborated here, in keeping with the A2
