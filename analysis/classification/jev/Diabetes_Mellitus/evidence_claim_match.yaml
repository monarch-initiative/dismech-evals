        subtype: maturity-onset diabetes of the young type 14
        notes: Curated as disputed rather than causative. MONDO records APPL1 as the causal gene of maturity-onset
          diabetes of the young type 14 (MONDO:0014674, OMIM:616511). APPL1 was one of the genes ClinGen
          identified as having evidence insufficient to support or refute the relationship; a 2025 case-control
