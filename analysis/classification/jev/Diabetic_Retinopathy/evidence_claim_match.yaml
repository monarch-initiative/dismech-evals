              id: MONDO:0005266
              label: diabetic retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hyperglycemia-Induced Oxidative Stress and Metabolic Pathway Activation
        description: 'Chronic hyperglycemia activates four major biochemical pathways—increased polyol
          pathway flux, increased advanced glycation end product (AGE) formation, activation of protein
          kinase C (PKC) isoforms, and increased hexosamine pathway flux—all of which converge on a single
          unifying mechanism: overproduction of superoxide by the mitochondrial electron-transport chain.
          This excess reactive oxygen species (ROS) production drives oxidative stress that initiates
          the downstream cascade of retinal neurovascular injury, BRB disruption, neurodegeneration, and
          angiogenesis. DR is now recognized as a neurovascular disorder arising from chronic hyperglycemia-induced
          oxidative stress, inflammation, and vascular dysfunction.

          '
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: Diabetic retinopathy (DR), a leading cause of blindness in working-age adults, arises
          from chronic hyperglycemia-induced oxidative stress, inflammation, and vascular dysfunction.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
