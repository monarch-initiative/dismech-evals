        display_name: Severe Nonproliferative Diabetic Retinopathy (Severe NPDR)
        description: 'Advanced NPDR characterized by extensive microvascular lesions meeting the 4-2-1
          rule (≥20 intraretinal hemorrhages in each of 4 quadrants, venous beading in ≥2 quadrants, or
          prominent intraretinal microvascular abnormalities in ≥1 quadrant) without neovascularization.
          Carries high risk of progression to PDR (approximately 50% within 1 year without treatment)
          and warrants close follow-up and consideration of early anti-VEGF therapy.

          '
        subtype_term:
          preferred_term: severe nonproliferative diabetic retinopathy
          term:
            id: MONDO:0004687
            label: severe nonproliferative diabetic retinopathy
      selected_evidence:
        snippet: Vision loss from DR can be prevented with broad-level public health strategies, but these
          need to be tailored to a country's and population's resource setting.
