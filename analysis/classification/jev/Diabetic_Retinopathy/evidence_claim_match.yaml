  bb105f393a9f4e6d519b5b2de955b62f3cf2c44801c26d430ef0334bdc2c120a:
    claim:
      about:
        disease:
          name: Diabetic Retinopathy
          disease_term:
            preferred_term: Diabetic retinopathy
            term:
              id: MONDO:0005266
              label: diabetic retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinal Vascular Cell Injury and Pericyte Loss
        description: 'Sustained oxidative and metabolic injury selectively destroys retinal pericytes,
          the stabilizing mural cells of the microvasculature, while simultaneously damaging vascular
          endothelial cells. Pericyte loss is the earliest histopathological hallmark of DR and destabilizes
          the retinal microvasculature by disrupting ANGPT2-Tie2 signaling: interaction between angiopoietin
          2 and the Tie2 receptor results in aberrant signaling that further drives pericyte loss, neovascularization,
          and inflammation. Progressive capillary closure and acellular capillary formation lead to retinal
          ischemia, which upregulates VEGF as the pro-angiogenic signal driving PDR.

          '
        cell_types:
        - preferred_term: pericyte
          term:
            id: CL:0000669
            label: pericyte
        - preferred_term: retinal vascular endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: angiogenesis
          term:
            id: GO:0001525
            label: angiogenesis
          modifier: INCREASED
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: Interaction between angiopoietin 2 and the Tie2 receptor results in aberrant Tie2 signaling,
          resulting in loss of pericytes, neovascularization, and inflammation.
        supports: SUPPORT
