        context: []
      assertion_type: Treatment
      assertion:
        name: Panretinal Laser Photocoagulation
        description: 'Established standard of care for high-risk proliferative diabetic retinopathy (PDR).
          Panretinal photocoagulation (PRP) ablates ischemic peripheral retina, reducing the hypoxic stimulus
          for pathological VEGF production and causing regression of neovascularization. Network meta-analysis
          of 14 RCTs found anti-VEGF slightly superior to PRP for short-term visual acuity but PRP remains
          the backbone long-term treatment for PDR, particularly where frequent anti-VEGF injections cannot
          be sustained.

          '
        treatment_term:
          preferred_term: laser photocoagulation
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
        target_phenotypes:
        - preferred_term: Vitreous hemorrhage
          term:
            id: HP:0007902
            label: Vitreous hemorrhage
      selected_evidence:
        snippet: Vision loss from DR can be prevented with broad-level public health strategies, but these
          need to be tailored to a country's and population's resource setting.
        supports: SUPPORT
