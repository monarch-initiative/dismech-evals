      assertion_type: Pathophysiology
      assertion:
        name: VEGF-Driven Retinal Neovascularization
        description: 'Extensive retinal ischemia from capillary closure drives upregulation of vascular
          endothelial growth factor A (VEGF-A), the central molecular mediator of pathological neovascularization
          that defines PDR. VEGF is recognized as a crucial and central molecule in abnormal neovascularization,
          and anti-VEGF therapy is now the most successful form of treatment for retinal vascular disorders
          including DR. Notch signaling and hypoxia-inducible factors (HIFs) also contribute to pathological
          vessel growth. New fibrovascular membranes grow from the optic disc and retinal surface into
          the vitreous cavity, where rupture causes vitreous hemorrhage and contracture causes tractional
          retinal detachment.

          '
        biological_processes:
        - preferred_term: angiogenesis
          term:
            id: GO:0001525
