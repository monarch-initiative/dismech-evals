        name: Intravitreal Anti-VEGF Therapy
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: 'First-line therapy for center-involving diabetic macular edema (CI-DME) and vision-threatening
          PDR complications. Agents (ranibizumab, bevacizumab, aflibercept, faricimab) neutralize VEGF-A,
          reducing vascular permeability and pathological neovascularization. Landmark trials (RISE/RIDE
          for ranibizumab; VIVID/VISTA for aflibercept; PROTOCOL T) demonstrated superior outcomes over
          macular laser for CI-DME, with 18–45% of patients gaining ≥15 ETDRS letters. Best outcomes require
          frequent injections and close monitoring; real-world outcomes often fall short of trials due
          to treatment burden.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: anti-VEGF biologic
            term:
              id: NCIT:C20401
              label: Monoclonal Antibody
        target_phenotypes:
        - preferred_term: Macular edema
          term:
            id: HP:0040049
            label: Macular edema
        - preferred_term: Vitreous hemorrhage
          term:
            id: HP:0007902
            label: Vitreous hemorrhage
      selected_evidence:
        snippet: Anti-VEGF therapy represents a cornerstone in the management of DME, RVO-related ME,
          and nAMD, with significant improvements observed in BCVA and reductions in CMT across diverse
          patient populations.
        supports: SUPPORT
