      assertion:
        name: Proliferative Diabetic Retinopathy
        display_name: Proliferative Diabetic Retinopathy (PDR)
        description: 'Most advanced stage of DR, defined by the presence of pathological neovascularization
          arising from the optic disc or retinal surface in response to ischemia-driven VEGF overexpression.
          New vessels grow into the vitreous cavity, where they may rupture (vitreous hemorrhage) or promote
          traction through fibrovascular membrane contraction (tractional retinal detachment), causing
          severe vision loss. Panretinal photocoagulation (PRP) is the established primary treatment for
          high-risk PDR.

          '
        subtype_term:
          preferred_term: proliferative diabetic retinopathy
          term:
            id: MONDO:0001660
            label: proliferative diabetic retinopathy
      selected_evidence:
        snippet: The most severe form, proliferative diabetic retinopathy, carries a high risk of vision
          loss, vitreous haemorrhage, macular oedema and other harms. Panretinal photocoagulation is the
          primary treatment for proliferative diabetic retinopathy.
        supports: SUPPORT
