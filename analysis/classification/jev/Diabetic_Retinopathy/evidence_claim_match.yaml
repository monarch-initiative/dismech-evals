          glaucoma with elevated intraocular pressure. Results from severe retinal ischemia driving VEGF
          production that stimulates iris neovascularization. A serious late complication of PDR with
          poor prognosis and risk of blindness from combined optic nerve damage and macular dysfunction.

          '
        phenotype_term:
          preferred_term: Neovascular glaucoma
          term:
            id: HP:0000501
            label: Glaucoma
        subtype: Proliferative Diabetic Retinopathy
      selected_evidence:
        snippet: 'Despite advances in screening and treatment, including panretinal photocoagulation (PRP),
          intravitreal anti-vascular endothelial growth factor (anti-VEGF) agents and pars plana vitrectomy
          (PPV), outcomes remain heterogeneous: many eyes stabilise, whereas others progress to vitreous
          hemorrhage, tractional retinal detachment or neovascular glaucoma despite apparently adequate
          therapy.'
        supports: SUPPORT
