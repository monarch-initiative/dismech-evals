        snippet: Vascular endothelial growth factor (VEGF) is recognized as a crucial and central molecule
          in abnormal neovascularization and a key phenomenon in retinal vascular occlusion; thus, anti-VEGF
          therapy is now the most successful form of treatment for these disorders.
