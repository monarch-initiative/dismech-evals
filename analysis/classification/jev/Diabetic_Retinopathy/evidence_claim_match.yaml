      assertion_type: Subtype
      assertion:
        name: Nonproliferative Diabetic Retinopathy
        display_name: Nonproliferative Diabetic Retinopathy (NPDR)
        description: 'Early-to-moderate stage of DR in which retinal microvascular lesions are present
          (microaneurysms, intraretinal hemorrhages, hard exudates, cotton-wool spots, venous beading,
          intraretinal microvascular abnormalities) but pathological neovascularization has not yet developed.
          Eyes with NPDR have not yet developed neovascularization. Encompasses background (mild), moderate,
          and the milder end of severe NPDR.

          '
        subtype_term:
          preferred_term: nonproliferative diabetic retinopathy
          term:
            id: MONDO:0001661
            label: background diabetic retinopathy
      selected_evidence:
        snippet: Two trials were of patients with non-proliferative diabetic retinopathy; all others were
          in proliferative diabetic retinopathy.
        supports: SUPPORT
