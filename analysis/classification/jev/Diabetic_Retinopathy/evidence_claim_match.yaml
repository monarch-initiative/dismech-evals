  62b543edf82ba7b004ee1ce2149d362c817876f4a8a230864bbaf114dba7d954:
    claim:
      about:
        disease:
          name: Diabetic Retinopathy
          disease_term:
            preferred_term: Diabetic retinopathy
            term:
              id: MONDO:0005266
              label: diabetic retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Blood-Retinal Barrier Breakdown
        description: 'Disruption of the inner blood-retinal barrier (formed by retinal vascular endothelium
          with tight junctions) by VEGF, inflammatory cytokines, and loss of pericyte support allows plasma
          proteins and fluid to leak into the retinal parenchyma. Oxidative stress is a key driver of
          BRB disruption, which also promotes neurodegeneration and angiogenesis. BRB breakdown is the
          immediate cause of diabetic macular edema (DME) through fluid accumulation in the macular subfield,
          and contributes to ischemia through progressive endothelial dysfunction.

          '
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: Diabetic macular edema (DME) is a major cause of vision impairment in diabetic individuals,
          characterized by fluid accumulation in the macula due to a breakdown of the blood-retinal barrier
          (BRB).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38264181
      reference_title: 'Diabetic Macular Edema Management: A Review of Anti-Vascular Endothelial Growth
        Factor (VEGF) Therapies.'
      evidence_source: HUMAN_CLINICAL
