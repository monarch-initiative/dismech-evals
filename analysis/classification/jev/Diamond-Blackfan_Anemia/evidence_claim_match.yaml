        description: 'A distinct non-ribosomal mechanism causing DBA. GATA1 is an X-linked erythroid transcription
          factor essential for erythroid differentiation. Mutations in GATA1 (including splice site variants)
          reduce functional GATA1 protein levels, impairing erythroid gene expression. Unlike ribosomal
          protein mutations, GATA1 mutations directly affect erythroid transcription rather than global
          translation, but converge on the same erythroid differentiation failure.

          '
