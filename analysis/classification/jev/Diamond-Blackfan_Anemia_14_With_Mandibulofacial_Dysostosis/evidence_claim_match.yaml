  6abac44d4aa5aa448959e253802cfd2afc9f02209ee1f75c79245e7961a39784:
    claim:
      about:
        disease:
          name: Diamond-Blackfan Anemia 14 with Mandibulofacial Dysostosis
          disease_term:
            preferred_term: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
            term:
              id: MONDO:0010493
              label: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tsr2-bovine-model-mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: The only naturally occurring animal TSR2 variant causes hair follicle dysplasia with no
          reported anemia or craniofacial anomaly, while the human variant causes anemia and mandibulofacial
          dysostosis with no reported hair phenotype. Is this a species difference, an allele-class difference,
          or simply two incompletely examined phenotypes?
        attaches_to:
        - animal_models#Streaked hairlessness cattle (TSR2 exon 5 splice-site variant)
        - pathophysiology#TSR2 Escortin Deficiency
        rationale: 'Evidence exists in the model and its translational validity is the open question,
          which is what distinguishes this from a plain knowledge gap.

          The confounds run in both directions and neither has been controlled. The bovine allele is truncating
          and the human allele is a cargo-binding missense, so they may not be the same lesion. The cows
          are heterozygous females with mosaic X-inactivation and the patients are hemizygous males, so
          they are not in the same genetic state. And crucially, neither phenotype was looked for in the
          other species: the cattle report describes no haematology, and the human report describes no
          hair abnormality. "Not reported" is not "absent", and this entry does not record the bovine
          model as failing to recapitulate the human disease for exactly that reason.

          A knock-in of the human E64G allele in a mammal, phenotyped for both blood and skin, would separate
          the three explanations. Absent that, the honest position is that TSR2 is a housekeeping escortin
          whose tissue-restricted phenotypes are unexplained in either species.'
      selected_evidence:
        snippet: Thus, by dissecting a naturally occurring mutation in a domestic animal species, we identified
          TSR2 as a regulator of hair follicle development.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26203908
      reference_title: Hairless Streaks in Cattle Implicate TSR2 in Early Hair Follicle Formation.
      evidence_source: MODEL_ORGANISM
      explanation: The model's own conclusion - a hair follicle function for TSR2, which is not a function
        this disease is known to involve.
