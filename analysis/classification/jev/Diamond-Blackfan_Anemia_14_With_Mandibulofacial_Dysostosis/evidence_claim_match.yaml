        context:
        - path: /experimental_models/0
          value:
            name: Humanized yeast expressing hTsr2 E64G
            experimental_model_type: OTHER
            description: A conditional PGAL1-TSR2 Saccharomyces cerevisiae strain in which yeast Tsr2
              is repressed and the human protein - wild type or the DBA14 E64G variant - is supplied from
              a plasmid. This is the only system in which the human disease allele has been tested functionally,
              and it carries the whole weight of the functional argument for pathogenicity. Its readouts
              are growth, cytoplasmic accumulation of the immature 20S pre-rRNA, and direct binding of
              recombinant human Tsr2 to human eS26.
            organism:
              preferred_term: Saccharomyces cerevisiae
              term:
                id: NCBITaxon:4932
                label: Saccharomyces cerevisiae
            publication: PMID:30201955
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: TSR2 Escortin Deficiency
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: The binding assays use recombinant human Tsr2 and human eS26, so for this node the
          model is not really yeast at all - it is human proteins in vitro, and it reproduces the molecular
          lesion directly.
        limitations: A binding measurement on purified proteins does not establish the intracellular consequence,
          and the assay was run across a salt series rather than at a physiological condition alone.
        readouts:
        - name: Binding of human eS26 to immobilised GST-hTsr2
          target: TSR2 Escortin Deficiency
          direction: DECREASED
          interpretation: The disease allele's cargo affinity is reduced relative to wild type.
        - name: Far-UV circular dichroism spectra of wild-type and E64G human Tsr2
          target: TSR2 Escortin Deficiency
          direction: UNCHANGED
          interpretation: 'A deliberate negative result: secondary structure is unchanged, so the binding
            defect is not a folding defect.'
      selected_evidence:
        snippet: Notably, a Diamond-Blackfan anemia-associated Tsr2 mutant protein is impaired in binding
          to ESS, unveiling a critical role for this interaction in human hematopoiesis.
        supports: SUPPORT
    origin:
