  c3ca361f1cbbad29c4072a96573d263af93b15dd1fac98cb71cfe3e761e60444:
    claim:
      about:
        disease:
          name: Diamond-Blackfan Anemia 14 with Mandibulofacial Dysostosis
          disease_term:
            preferred_term: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
            term:
              id: MONDO:0010493
              label: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tsr2-cancer-risk
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does DBA14 carry the malignancy predisposition documented for Diamond-Blackfan anemia
          as a class, and should TSR2 carriers and patients be entered into DBA cancer surveillance?
        attaches_to:
        - treatments#Malignancy Surveillance
        - genetic#TSR2
        rationale: 'This is the question with the most direct consequence for a family carrying this variant,
          and it has no evidence either way.

          The class-level risk is real and substantial - AML, myelodysplastic syndrome and solid tumours
          including osteosarcoma - and GeneReviews sets a four- to six-monthly surveillance interval on
          that basis. But the DBA registries that generated those figures are built from the autosomal
          dominant ribosomal-protein genotypes. Nobody has reported a malignancy in a TSR2 patient, and
          nobody could: the entire cohort is two men, well at ages 16 and 24 at last report.

          The mechanistic argument cuts both ways. If the cancer risk in DBA follows from chronic ribosomal
          stress and p53 signalling in the marrow, DBA14 should share it, because it converges on the
          same eS26-deficient subunit. If it follows instead from the specific ribosomal protein lost,
          or from cumulative steroid and transfusion exposure, a mildly affected TSR2 patient may not.
          Extending surveillance is the conservative call and is what this entry records; asserting that
          the risk is established for this genotype would not be.'
      selected_evidence:
        snippet: DBA syndrome is associated with an increased risk for acute myelogenous leukemia, myelodysplastic
          syndrome, and solid tumors including osteogenic sarcoma.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/5
      evidence_path: /discussions/5/evidence/0
      context_paths:
