  a0863722d08c074fa6566cca1b37e35a02f18503ca40bd03cf74f4f60290e6f4:
    claim:
      about:
        disease:
          name: Diamond-Blackfan Anemia 14 with Mandibulofacial Dysostosis
          disease_term:
            preferred_term: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
            term:
              id: MONDO:0010493
              label: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Escortin Handover of eS26
        biological_scale: MOLECULAR
        description: 'TSR2 does three things in sequence: it dissociates the importin:eS26 complex on
          the nuclear side by a RanGTP-independent route, it binds and shields the released eS26 from
          proteolysis, and it delivers it to the 90S pre-ribosome. The disease allele is impaired at the
          binding step - it holds eS26 and the eukaryote-specific segment that recruits it less tightly
          - which puts every downstream step of the handover at risk. What has not been measured is which
          of the three steps fails first in a patient cell; the pathway description is from yeast and
          reconstituted human proteins.'
        biological_processes:
        - preferred_term: ribosomal small subunit assembly
          modifier: DECREASED
          term:
            id: GO:0000028
            label: ribosomal small subunit assembly
      selected_evidence:
        snippet: Subsequently, Tsr2 binds the released eS26, shields it from proteolysis, and ensures
          its safe delivery to the 90S pre-ribosome.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25144938
      reference_title: A RanGTP-independent mechanism allows ribosomal protein nuclear import for ribosome
