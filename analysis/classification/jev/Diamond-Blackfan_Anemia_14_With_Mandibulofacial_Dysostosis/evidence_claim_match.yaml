  52718f04c166c74c375f4ce0a94d16ead9fdae6347b2806fe8f683e334c61bc9:
    claim:
      about:
        disease:
          name: Diamond-Blackfan Anemia 14 with Mandibulofacial Dysostosis
          disease_term:
            preferred_term: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
            term:
              id: MONDO:0010493
              label: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tsr2-single-family
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is a single kindred with a single missense allele, plus functional work in a humanized
          yeast system, enough to call TSR2 a definitive DBA gene - and what would a second family change?
        attaches_to:
        - genetic#TSR2
        - pathophysiology#TSR2 Escortin Deficiency
        rationale: 'The whole entry rests on Family 1 of the 2014 series: two affected male cousins, one
          c.191A>G allele. The reporting authors called it "likely pathogenic" and wrote that functional
          studies were outside their purview. Those studies exist now and are strong - the human protein
          folds normally, binds eS26 weakly, fails to support growth in yeast, and is rescued by excess
          eS26 - but they establish that the allele is damaging, not that damaging TSR2 alleles cause
          this disease in the population.

          What is missing is genetic replication. A second unrelated family with an independent TSR2 allele
          and the same phenotype would settle it; so would a de novo variant in a sporadic case. Until
          then the honest reading is that the gene-disease relationship is supported mechanistically and
          by one segregating pedigree, which is what GeneReviews reflects when it introduces TSR2 with
          "rarely". This entry does not upgrade the authors'' own hedge.'
      selected_evidence:
        snippet: Functional studies of the newly identified and presumably disease causing genes would
          strengthen the evidence for pathogenicity, but is at this time out of our purview.
        supports: SUPPORT
        directness: DIRECT
