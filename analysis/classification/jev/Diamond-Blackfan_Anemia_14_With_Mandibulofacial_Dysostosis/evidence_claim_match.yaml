        description: 'TSR2 is on the X chromosome. In the one reported kindred the variant is hemizygous
          in the two affected male cousins and heterozygous in their unaffected mothers, and GeneReviews
          records TSR2-related DBA as X-linked with heterozygous females usually unaffected.

          `penetrance` is left UNKNOWN rather than called. Two affected hemizygotes is not a denominator:
          no unaffected hemizygous male has been reported, and with n=2 that is uninformative either way.
          The class-level statement for DBA as a whole is that penetrance is incomplete, but that is a
          statement about the autosomal dominant ribosomal-protein genotypes that make up the bulk of
          DBA and cannot be transferred to a hemizygous X-linked allele.

          `expressivity` is called VARIABLE on within-family evidence rather than on the class-level statement:
          the two cousins carry the same allele, and one was diagnosed with DBA at ten months and treated
          with steroids while the other never had overt anemia and showed only the laboratory markers.
          The craniofacial arm was present in both.'
      selected_evidence:
        snippet: GATA1- and TSR2-related DBA syndrome are inherited in an X-linked manner.
        supports: SUPPORT
