          term:
            id: NCIT:C28133
            label: Blood Cell Count
        markers: Hemoglobin, mean corpuscular volume, reticulocyte count, leukocyte and platelet counts
      selected_evidence:
        snippet: Complete blood counts several times a year, then one to two times per year once hemoglobin
          is stable; bone marrow aspirate/biopsy to evaluate morphology and cellularity only in the event
          of another cytopenia or a change in response to treatment.
        supports: SUPPORT
