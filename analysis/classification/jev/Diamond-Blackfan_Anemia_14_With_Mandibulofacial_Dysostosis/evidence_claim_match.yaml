              by a splice variant producing two frameshifted transcripts. It is curated here because it
              is a truncating TSR2 allele in a mammal and therefore the closest thing to a null model
              of this gene - and because what it produces is a phenotype nobody has described in DBA14.
              The cows are female heterozygotes whose skin phenotype follows Blaschko''s lines, which
              is the visible signature of X-inactivation mosaicism.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: TSR2 Escortin Deficiency
        relationship: PERTURBS
        fidelity: LOW
        model_scale: MOLECULAR
        description: 'A truncating variant that removes roughly a quarter of the protein perturbs TSR2
          function. It is not curated as recapitulating the human disease: the allele class is different
          (truncating rather than a cargo-binding missense), the animals are heterozygous females rather
          than hemizygous males, and the phenotype is cutaneous.'
        limitations: No haematologic or craniofacial assessment of the affected cows is reported, so the
          absence of a DBA-like phenotype in this model is unexamined rather than demonstrated - this
          cannot be read as a negative result. The animals are heterozygous with mosaic X-inactivation,
          which is a different genetic state from a hemizygous male. Bovine and human hair follicle biology
          also differ, and humans with DBA14 have no reported hair phenotype.
        readouts:
        - name: TSR2 transcripts in lesional skin
          target: TSR2 Escortin Deficiency
          direction: ALTERED
          interpretation: Both mutant transcripts are predominantly detected in the hairless skin, alongside
            the physiological ones - the mosaic pattern expected from an X-linked allele in a heterozygous
            female.
      selected_evidence:
        snippet: A point mutation at the 5'-splice junction of exon 5 of the TSR2, 20S rRNA accumulation,
          homolog (S. cerevisiae), gene led to the production of two mutant transcripts, both of which
          contain a frameshift and generate a premature stop codon predicted to truncate approximately
          25% of the protein.
        supports: SUPPORT
