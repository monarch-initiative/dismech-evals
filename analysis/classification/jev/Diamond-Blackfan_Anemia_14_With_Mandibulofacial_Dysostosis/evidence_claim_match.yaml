  c09855f76a97bd5389204f15d4e57a2ea678d460cc040ab4615fd59b38b82b51:
    claim:
      about:
        disease:
          name: Diamond-Blackfan Anemia 14 with Mandibulofacial Dysostosis
          disease_term:
            preferred_term: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
            term:
              id: MONDO:0010493
              label: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
        context: []
      assertion_type: Genetic
      assertion:
        name: TSR2
        gene_term:
          preferred_term: TSR2
          term:
            id: hgnc:25455
            label: TSR2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: X-linked recessive
        association: A hemizygous missense variant in TSR2 is the reported cause of DBA14. TSR2 encodes
          a 191-residue protein whose residues 11-92 form a WGG domain of then-unknown function; the disease
          allele changes a residue inside that domain. TSR2 is not a ribosomal protein - it is the direct
          binding partner and nuclear escortin of RPS26/eS26, whose own haploinsufficiency causes DBA10.
        variants:
        - name: c.191A>G (p.Glu64Gly)
          description: The single reported disease allele, hemizygous in both affected male cousins and
            heterozygous in their unaffected mothers. It changes a glutamate conserved from C. elegans
            to human inside the WGG domain. Later biochemistry showed the mutant protein folds normally
            but binds eS26 weakly, so the allele is best read as a partial loss of the escortin's cargo-binding
            function rather than as a null.
      selected_evidence:
        snippet: In another family a likely pathogenic X-linked mutation affecting a highly conserved
          residue was found in TSR2, which encodes a direct binding partner of RPS26.
        supports: SUPPORT
        directness: DIRECT
