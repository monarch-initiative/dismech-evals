  45f61990a6c78cb2d98f1677b09309f597f617484bdb4b835e8ca2e86de40c0a:
    claim:
      about:
        disease:
          name: Diamond-Blackfan Anemia 14 with Mandibulofacial Dysostosis
          disease_term:
            preferred_term: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
            term:
              id: MONDO:0010493
              label: Diamond-Blackfan anemia 14 with mandibulofacial dysostosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tsr2-stress-ribosome-role
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: TSR2 also removes and reinstalls eS26 on mature ribosomes as part of a reversible stress
          response. Does loss of that second function contribute to DBA14, or is the disease entirely
          a biogenesis defect?
        attaches_to:
        - pathophysiology#Impaired Escortin Handover of eS26
        rationale: 'The entry models TSR2 as a one-way delivery chaperone, because that is the function
          the disease allele was tested against. But the same protein has a second, later-described job:
          under sodium, sorbitol or pH stress it releases eS26 from fully assembled ribosomes to generate
          a distinct ribosome population, stores the freed protein, and reinstalls it when the stress
          passes. That is a regulated, reversible activity on mature ribosomes, not a biogenesis step.

          Whether the E64G allele impairs it is unknown - and it is not obvious that it would fail in
          the same direction, since a chaperone that binds eS26 too weakly might release it too readily
          as easily as fail to deliver it. The work is in yeast and the stresses are osmotic and pH, neither
          of which is an obvious feature of an erythroid progenitor''s life. It is recorded here because
          if this activity does contribute, the pathograph''s single biogenesis chain is the wrong shape
          rather than merely incomplete.'
      selected_evidence:
        snippet: The chaperone Tsr2 releases Rps26 in the presence of high Na+ or pH in vitro and is required
          for Rps26 release in vivo.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35213229
      reference_title: The chaperone Tsr2 regulates Rps26 release and reincorporation from mature ribosomes
        to enable a reversible, ribosome-mediated response to stress.
      evidence_source: IN_VITRO
      explanation: Establishes the second function - release from mature ribosomes - that this entry does
        not model.
