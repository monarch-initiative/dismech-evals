      assertion:
        target: Defective Small-Subunit Maturation and 18S rRNA Processing
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: CELLULAR
        description: Yeast expressing the human disease allele grow poorly and accumulate immature 20S
          pre-rRNA in the cytoplasm, and excess eS26 rescues the growth defect - which is what ties the
          phenotype to eS26 supply rather than to some other consequence of expressing a human protein
          in yeast.
        limitations: The host is yeast, and the yeast Tsr2 is repressed rather than deleted, so the assay
          reads a humanized replacement under a heterologous promoter. The yeast intermediate is 20S pre-rRNA;
          the human counterpart is 18S-E, and no equivalent measurement has been made in a DBA14 patient
          cell. Yeast has neither erythropoiesis nor a pharyngeal arch, so the model cannot speak to either
          arm of the human phenotype.
        readouts:
        - name: Cytoplasmic 20S pre-rRNA by FISH
          target: Defective Small-Subunit Maturation and 18S rRNA Processing
          direction: INCREASED
          interpretation: Accumulation of the immature precursor in the cytoplasm is the standard readout
            of stalled small-subunit maturation.
        - name: Growth of PGAL1-TSR2 cells expressing hTsr2E64G
          target: Defective Small-Subunit Maturation and 18S rRNA Processing
          direction: DECREASED
          interpretation: The organism-level correlate of the maturation defect in this system.
      selected_evidence:
        snippet: Tsr2 DBA mutant cells (hTsr2E64G) accumulate immature 20S pre-rRNA in the cytoplasm.
        supports: SUPPORT
