        biological_scale: MOLECULAR
        description: 'The consequence of a failed handover is a shortfall of eS26 on the assembling 40S
          subunit. This is the node at which DBA14 converges on DBA10: RPS26 haploinsufficiency reaches
          the same state by halving the supply of the protein, while TSR2 deficiency reaches it by failing
          to deliver a normal supply. That convergence is an inference from the two genes'' shared biology
          and is not something anyone has measured in a DBA14 patient cell.'
        biological_processes:
        - preferred_term: ribosomal small subunit biogenesis
          modifier: DECREASED
          term:
            id: GO:0042274
            label: ribosomal small subunit biogenesis
      selected_evidence:
        snippet: Thus, ESS:Tsr2 interactions are critical to dissociate eS26 from the importin and to
          protect and target eS26 to the pre-ribosome in vivo.
        supports: SUPPORT
        directness: INDIRECT
