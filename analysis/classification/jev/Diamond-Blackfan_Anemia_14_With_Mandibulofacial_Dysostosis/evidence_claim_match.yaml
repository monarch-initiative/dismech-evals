      assertion_type: DifferentialDiagnosis
      assertion:
        name: Treacher Collins syndrome
        description: 'The condition both affected males were thought to have on sight. It shares the zygomatic
          and mandibular hypoplasia, downslanted palpebral fissures, microtia and cleft palate, and it
          is also a ribosomopathy - the lesion is in RNA polymerase I transcription rather than in small-subunit
          assembly. The discriminator is haematologic: Treacher Collins does not cause a macrocytic anemia
          or raise eADA. A boy carrying both pictures is the case that should be sequenced beyond TCOF1,
          POLR1C and POLR1D.'
      selected_evidence:
        snippet: Most TCS patients have a heterozygous TCOF1 mutation, while heterozygous POLR1D and biallelic
          POLR1C mutations account for additional cases [Dauwerse et al., 2011].
