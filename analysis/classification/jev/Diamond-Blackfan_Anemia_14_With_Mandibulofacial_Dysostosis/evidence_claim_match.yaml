        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ribosomal Stress Response
        biological_scale: CELLULAR
        description: 'Impaired ribosome biogenesis in DBA activates p53 and a set of associated responses
          - translational dysfunction, inflammation, imbalanced globin and heme synthesis, autophagy dysregulation
          - that converge on the erythroid compartment. This node is curated at the level of the DBA class.
          Nobody has measured p53 activation, or any of the rest of it, in a TSR2-mutant cell, so the
          node carries the class-level claim and says so rather than being dropped: it is the step that
          connects a general biogenesis defect to a selectively erythroid outcome, and leaving it out
          would make the pathograph look better evidenced than it is.'
      selected_evidence:
        snippet: P53 activation, translational dysfunction, inflammation, imbalanced globin/heme synthesis,
          and autophagy dysregulation were shown to contribute to disrupted erythropoiesis and impaired
          red blood cell production.
        supports: SUPPORT
        directness: INDIRECT
