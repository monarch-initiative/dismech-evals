      assertion_type: Treatment
      assertion:
        name: Corticosteroid Therapy
        description: 'Standard first-line therapy for the anemia of DBA, started at age 12 months or older.
          Deliberately deferred through the first year, with chronic transfusion used instead, to avoid
          steroid-induced growth deficiency.

          The two sources give different response rates and the entry cites both rather than picking one:
          the 2014 series says 40%, GeneReviews says 60-80%. They are not directly comparable - the GeneReviews
          figure describes improvement in red blood cell count on a treatment given at a specified age,
          while the 2014 figure describes patients categorised as steroid-responsive alongside spontaneous
          remitters and transfusion-dependent patients. No steroid-response data exist for RPS28 patients
          specifically, so either way this is offered on the basis of the DBA literature rather than genotype-specific
          evidence.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: corticosteroid
            term:
              id: CHEBI:50858
              label: corticosteroid
      selected_evidence:
        snippet: The anemia remits spontaneously in about 20%, is steroid responsive in 40% and requires
          long term transfusions in about 40%
        supports: SUPPORT
        directness: INDIRECT
