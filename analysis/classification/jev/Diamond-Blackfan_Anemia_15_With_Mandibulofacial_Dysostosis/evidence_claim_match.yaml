            term:
              id: MONDO:0011639
              label: Diamond-Blackfan anemia 15 with mandibulofacial dysostosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Ribosome Biogenesis
        biological_scale: CELLULAR
        description: Reduced production of the small ribosomal subunit. Experimental depletion of RPS28
          in human cells, in a panel alongside the other DBA ribosomal proteins, reduces the corresponding
          subunit, fully assembled ribosomes and polysomes, and perturbs rRNA processing. The generalisation
