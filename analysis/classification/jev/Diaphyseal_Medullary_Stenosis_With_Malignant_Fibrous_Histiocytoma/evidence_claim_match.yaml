        biomarker_term:
          preferred_term: 5'-S-methyl-5'-thioadenosine
          term:
            id: CHEBI:17509
            label: 5'-S-methyl-5'-thioadenosine
        presence: Detectable in affected individuals; undetectable in unaffected controls
        notes: 'The direct substrate of MTAP, and the one measured biochemical abnormality in this disease.
          It is not normally present in human serum, so its appearance is interpretable as accumulation
          rather than variation within a range. In a blinded assay it was undetectable in all three unaffected
          individuals tested and accumulated in both affected individuals.

          Curated as a candidate analyte rather than an established test. Five people is the entire dataset,
          no reference interval exists, no assay is in clinical use, and nothing is reported about whether
          the level tracks disease activity or sarcoma risk.

          The evidence here duplicates what the Impaired Polyamine and Methionine Salvage Metabolism node
          carries, deliberately. That node needs it to justify its ESTABLISHED grade; this record makes
          the same measurement findable as a candidate diagnostic analyte, which is a different question.'
      selected_evidence:
        snippet: MTA is not normally present in human serum.
        supports: SUPPORT
