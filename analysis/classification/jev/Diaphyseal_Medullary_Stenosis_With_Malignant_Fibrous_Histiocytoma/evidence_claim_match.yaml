      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dmsmfh_prmt5_synthetic_lethality_untested
        hypothesis_label: MTAP-PRMT5 synthetic-lethality vulnerability in DMS-MFH tumours
        status: EMERGING
        description: 'DMS-MFH tumours share two features with the MTAP-homozygous-deletion, protein-null
          cancers that PRMT5 inhibitors target: serum methylthioadenosine accumulates in affected individuals,
          and the tumour loses the wild-type MTAP allele outright. Whether that combination raises intratumoural
          MTA enough to confer the same PRMT5 dependence has never been measured in a DMS-MFH tumour.
          The germline allele here is synonymous and leaves archetype MTAP protein intact, which is a
          different molecular state from the biallelic-deletion tumours the PRMT5 strategy was developed
          against, and immunohistochemistry for MTAP would likely read falsely negative in this setting.
          See discussion dmsmfh_prmt5_vulnerability_untested for the full reasoning and what would settle
          it.'
        notes: Nothing here supports offering PRMT5 inhibition to a patient with this syndrome; the treatments
          section's exclusion of that strategy stands. This entry records a hypothesis about tumour biology,
          not a therapeutic recommendation.
      selected_evidence:
        snippet: direct sequencing of this patient’s osteosarcoma genomic DNA demonstrated homozygosity
          for the c.885A >G mutation
        supports: SUPPORT
        directness: DIRECT
