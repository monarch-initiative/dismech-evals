      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Alternative Splicing of MTAP Isoforms
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Six distinct retroviral-sequence-containing MTAP isoforms exist, and each can physically
          interact with the archetype enzyme. Exon skipping in the mutated isoform dysregulates alternative
          splicing across all of them, so the defect is combinatorial rather than confined to one product.
          Because the isoforms bind the canonical trimeric enzyme, the plausible route to disease is interference
          with archetype MTAP rather than its simple absence, though no source states this as demonstrated.
        biological_processes:
        - preferred_term: regulation of alternative mRNA splicing, via spliceosome
          term:
            id: GO:0000381
            label: regulation of alternative mRNA splicing, via spliceosome
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Six distinct retroviral-sequence-containing MTAP isoforms, each of which can physically
          interact with archetype MTAP, have been identified.
        supports: SUPPORT
