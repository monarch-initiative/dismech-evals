      assertion_type: AnimalModel
      assertion:
        name: Mtap(lacZ) heterozygous knockout mouse
        species: Mouse
        genotype: Mtap/Mtap(lacZ) heterozygote
        publication: PMID:19567676
        description: A conventional MTAP knockout, made to ask whether MTAP loss drives tumorigenesis
          independently of the CDKN2A and ARF genes it is usually co-deleted with. Homozygous nulls die
          around day 8 postconception. Heterozygotes look normal for a year and then die early, median
          survival 585 days, with enlarged spleens, altered thymic histology and hepatic lymphocytic infiltration;
          the lymphomas are primarily T-cell.
        modeled_mechanisms:
        - target: Bone Sarcoma Predisposition
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The mouse confirms the principle and misses the disease. Losing one Mtap allele
            does predispose to malignancy, which supports the tumour-suppressor mechanism curated here.
            But the tumour is T-cell lymphoma, not bone sarcoma, and the animals have no bone dysplasia
            at all.
          limitations: This is a null allele, not the human lesion. The human mutations sit in retroviral-derived
            terminal exons that entered the primate genome and have no mouse counterpart, so the model
            cannot carry the actual allele and its isoform-balance effect is absent. What it models is
            complete loss of one copy, which is a different molecular state from a synonymous variant
            that shifts splicing among isoforms while leaving archetype MTAP intact. The tissue mismatch
            may follow from that, or from species differences in which lineage is vulnerable to MTAP loss;
            nothing distinguishes the two.
          readouts:
          - name: Tumour type in heterozygotes
            target: Bone Sarcoma Predisposition
            direction: ALTERED
            interpretation: T-cell lymphoma rather than bone sarcoma, with no skeletal phenotype. A divergence
              from the human disease, not a confirmation of it.
      selected_evidence:
        snippet: These studies show that Mtap is a tumor suppressor gene independent of CDKN2A and ARF.
        supports: SUPPORT
        directness: DIRECT
    origin:
