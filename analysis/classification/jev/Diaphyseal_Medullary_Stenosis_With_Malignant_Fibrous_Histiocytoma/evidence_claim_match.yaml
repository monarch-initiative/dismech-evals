  cc6bb99df382fe3bf6f58aa6bddeb612af7e6793207b9b9579b66ebffcb80d9d:
    claim:
      about:
        disease:
          name: Diaphyseal Medullary Stenosis with Malignant Fibrous Histiocytoma
          disease_term:
            preferred_term: diaphyseal medullary stenosis-bone malignancy syndrome
            term:
              id: MONDO:0007205
              label: diaphyseal medullary stenosis-bone malignancy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Polyamine and Methionine Salvage Metabolism
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'MTAP is a ubiquitously expressed homotrimeric enzyme central to polyamine metabolism
          and to the adenine and methionine salvage pathways, and the enzymatic step is demonstrably impaired
          in patients. Methylthioadenosine, the direct substrate of MTAP and a by-product of polyamine
          synthesis, is not normally present in human serum. In a blinded assay it was undetectable in
          all three unaffected individuals and accumulated in both affected individuals. Substrate accumulation
          in vivo is a direct demonstration that the enzyme step is compromised, not an inference from
          what the enzyme is known to do, and it is the reason MONDO''s classification of this syndrome
          as a disorder of polyamine metabolism is more than nominal.

          Two limits on how far that goes. The measurement is five people, two of them affected, so it
          establishes that the step is perturbed rather than how much. And flux through the downstream
          salvage pathways has not been measured at all: what is shown is that the substrate backs up,
          not what happens to polyamine or methionine economy as a result.'
        molecular_functions:
        - preferred_term: S-methyl-5-thioadenosine phosphorylase activity
          term:
            id: GO:0017061
            label: S-methyl-5-thioadenosine phosphorylase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: polyamine metabolic process
          term:
            id: GO:0006595
            label: polyamine metabolic process
          modifier: DYSREGULATED
        - preferred_term: L-methionine salvage
          description: No modifier is asserted. Flux through this pathway has not been measured in patients;
            what is measured is that the enzyme's substrate accumulates.
          term:
            id: GO:0071267
            label: L-methionine salvage
        - preferred_term: purine ribonucleoside salvage
          description: 'No modifier is asserted, for the same reason as L-methionine salvage: the direction
            is inferred from the enzymology, not measured.'
          term:
            id: GO:0006166
            label: purine ribonucleoside salvage
      selected_evidence:
        snippet: MTA is not normally present in human serum.
        supports: SUPPORT
