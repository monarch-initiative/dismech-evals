      assertion_type: Discussion
      assertion:
        discussion_id: dmsmfh_metabolic_route_to_bone_unmapped
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does dysregulated MTAP isoform splicing produce bone infarction, cortical dysplasia
          and sarcoma?
        attaches_to:
        - pathophysiology#Impaired Polyamine and Methionine Salvage Metabolism
        - pathophysiology#Diaphyseal Cortical Dysplasia and Medullary Stenosis
        - pathophysiology#Bone Sarcoma Predisposition
        rationale: 'The molecular lesion is well characterised, the clinical phenotype is well described,
          and almost nothing connects them. Both endpoints are now measured: substrate accumulation shows
          the enzymatic step is perturbed in patients, and somatic loss of the wild-type allele shows
          how the tumour arises. The road between them is not. No cell type, signalling pathway or bone-remodelling
          mechanism has been implicated in the dysplasia, and nothing connects the metabolic state to
          either the dysplasia or the transformation.

          There is no animal model of the human lesion, and that is structural rather than incidental:
          the causal exons are retroviral insertions specific to primates, so a mouse has nothing to mutate.'
      selected_evidence:
        snippet: two of these MTAP exons arose from early and independent retroviral-integration events
          in primate genomes at least 40 million years ago, and since then, their genomic integration
          has gained a functional role
        supports: SUPPORT
        directness: INDIRECT
