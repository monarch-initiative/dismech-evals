  ec59519953007dff25dec2ada0335014bba941794a6a8d659fd231ff610cb20e:
    claim:
      about:
        disease:
          name: Diaphyseal Medullary Stenosis with Malignant Fibrous Histiocytoma
          disease_term:
            preferred_term: diaphyseal medullary stenosis-bone malignancy syndrome
            term:
              id: MONDO:0007205
              label: diaphyseal medullary stenosis-bone malignancy syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: MTAP
        gene_term:
          preferred_term: MTAP
          term:
            id: hgnc:7413
            label: MTAP
        association: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Germline mutations in the most proximal of three retroviral-derived terminal exons
          of MTAP, causing exon skipping and dysregulated alternative splicing across the isoform family.
          The locus was mapped to 9p21-22 more than a decade before the gene was found; the delay is explained
          by the fact that the causal exons were not part of the annotated gene.

          Two variants account for the reported families and they do different things, which matters because
          this entry''s myopathy gap turns on the two myopathic families carrying different mutations.
          c.885A>G is synonymous, effectively R100R, and decreases expression of all exon-9 isoforms by
          roughly 70 percent while leaving archetype MTAP untouched. c.813-2A>G is a splice-acceptor variant
          with a different isoform consequence. Both increase MTAP_v3 and _v6 expression to the same degree,
          so what the two share is a shift in isoform balance rather than a common loss of one product.'
        notes: The germline syndrome and the corresponding sporadic tumour converge on this locus. Loss
          of heterozygosity across the 9p21-22 critical region was found in five of seven informative
          sporadic bone malignant fibrous histiocytoma specimens, and the minimal region of overlap narrowed
          the interval to 2 cM between D9S736 and D9S171. That somatic observation is recorded here because
          it bears on the germline mechanism; sporadic sarcoma is not in scope for this entry.
      selected_evidence:
        snippet: We previously mapped the DMS-MFH tumor-suppressing-gene locus to chromosomal region 9p21-22
          but failed to identify mutations in known genes in this region.
        supports: SUPPORT
