              label: diaphyseal medullary stenosis-bone malignancy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic Loss of the Wild-Type MTAP Allele
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The tumour-suppressive mechanism is characterised, and it is Knudson''s two hits.
          In an osteosarcoma from an affected individual carrying c.885A>G, the tumour DNA was homozygous
          for the mutation, and loss-of-heterozygosity analysis across the 2.9 Mb critical region showed
          complete loss of the wild-type allele from the unaffected chromosome. So the germline allele
          is the first hit and somatic loss of the remaining wild-type copy is the second.

          This is also what ties the syndrome to its sporadic counterpart: the same interval is lost in
          most informative sporadic bone malignant fibrous histiocytoma specimens, which is what motivated
          the search for a shared tumour suppressor in the first place.'
      selected_evidence:
        snippet: direct sequencing of this patient’s osteosarcoma genomic DNA demonstrated homozygosity
          for the c.885A >G mutation
        supports: SUPPORT
        directness: DIRECT
