        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Testing for MTAP Exon 9
        description: 'A negative gene panel does not exclude this diagnosis, and the reason is the same
          fact that makes the disease mechanistically interesting. The causal exon lies roughly 65 kb
          downstream of the canonical MTAP termination site and was not part of the annotated gene, so
          standard exome capture and standard hereditary-cancer or skeletal-dysplasia panels are not designed
          to report it. Testing has to target the retroviral-derived terminal exons specifically.

          The same history is why candidate screening of the linked region failed for over a decade: the
          gene was there, and the exons were not being looked at.'
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: Variant numbering is a live trap. The reported variants are numbered against the EST reference
          clone GenBank AK309365, not the canonical NM_002451 transcript, so reconciling them against
          ClinVar or a laboratory report requires knowing which reference was used. Recorded here rather
          than left for a reader to discover.
      selected_evidence:
        snippet: We previously mapped the DMS-MFH tumor-suppressing-gene locus to chromosomal region 9p21-22
          but failed to identify mutations in known genes in this region.
        supports: SUPPORT
