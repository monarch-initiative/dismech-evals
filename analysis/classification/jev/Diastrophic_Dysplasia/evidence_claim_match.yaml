            label: SLC26A2
        association: Causative
        notes: 'Biallelic pathogenic variants in SLC26A2 are causative for diastrophic dysplasia. SLC26A2
          encodes a sulfate/chloride antiporter expressed in chondrocytes and other tissues. Disease severity
          correlates with residual sulfate transporter activity: the Finnish founder mutation c.-26+2T>C
          is classified as severe, p.Arg279Trp as mild. Homozygosity for the Finnish mutation typically
          produces DTD, while compound heterozygosity with milder alleles can produce rMED.

          '
      selected_evidence:
        snippet: Diastrophic dysplasia (DTD) is an autosomal recessive skeletal dysplasia caused by SLC26A2
          mutations.
        supports: SUPPORT
