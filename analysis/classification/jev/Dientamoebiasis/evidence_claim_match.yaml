        description: Giardia intestinalis infection presents with diarrhea, abdominal cramps, bloating,
          and flatulence, symptoms largely indistinguishable from dientamoebiasis on clinical grounds
          alone. Both are protozoal infections of the intestinal tract transmitted via the fecal-oral
          route.
        disease_term:
          preferred_term: Giardiasis
          term:
            id: MONDO:0001103
            label: giardiasis
        distinguishing_features:
        - Giardia primarily affects the small intestine, D. fragilis the large intestine
        - Giardia has a well-characterized cyst-trophozoite cycle with environmentally resistant cysts
        - Giardia can cause steatorrhea and malabsorption, which are uncommon in dientamoebiasis
        - Specific stool antigen tests and PCR can differentiate the two organisms
      selected_evidence:
        snippet: Clinical manifestations of Giardia intestinalis infection also vary from asymptomatic
          carriage to acute and chronic diarrhoea with abdominal pain. These IBS-like symptoms can be
          continuous, intermittent, sporadic or recurrent, sometimes lasting years without correct diagnosis.
        supports: SUPPORT
