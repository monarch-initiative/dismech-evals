      - /disease_term
    evidence_metadata:
      reference: PMID:39481610
      reference_title: High rates of Dientamoeba fragilis and Blastocystis species in children's stool
        but minor clinical significance.
      evidence_source: HUMAN_CLINICAL
      explanation: Large pediatric cohort found limited clinical significance of D. fragilis, with increased
        anti-TTG referrals among positive children suggesting clinicians may consider celiac disease (and
        by extension IBS) in the differential workup.
