  ff22d219493068f142506fd3085397abe0e6bfb90d4ac08d9e45efd64cec99bc:
    claim:
      about:
        disease:
          name: Dientamoebiasis
          disease_term:
            term:
              id: MONDO:0024608
              label: dientamoebiasis
            preferred_term: Dientamoebiasis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Irritable bowel syndrome
        description: IBS presents with chronic or recurrent abdominal pain, bloating, and altered bowel
          habits, closely overlapping with dientamoebiasis symptoms. D. fragilis is known to cause IBS-like
          symptoms and may be misdiagnosed as IBS when stool parasitology is not performed. A meta-analysis
          found no significant association between D. fragilis and IBS (OR 1.13, 95% CI 0.22-5.72), suggesting
          the two are distinct conditions with overlapping presentations.
        disease_term:
          preferred_term: Irritable bowel syndrome
          term:
            id: MONDO:0005052
            label: irritable bowel syndrome
        distinguishing_features:
        - IBS is a diagnosis of exclusion with no identifiable infectious agent
        - Stool microscopy or PCR can identify D. fragilis trophozoites, whereas IBS workup is parasitology-negative
        - Whether eradicating D. fragilis resolves symptoms is contested; randomized and prospective studies
          in this entry found parasitological clearance without corresponding symptom improvement, so
          treatment response does not reliably distinguish the two
      selected_evidence:
        snippet: Children positive for DF or Bs did not exhibit higher odds for pre- or post-test composite
          outcomes compared to those with all-negative PCR results, except for increased rates of abdominal
          pain and referrals for anti-TTG testing among DF-positive children.
        supports: NO_EVIDENCE
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/3
      context_paths:
