        context: []
      assertion_type: Transmission
      assertion:
        name: Co-transmission via Enterobius vermicularis eggs
        description: A co-transmission hypothesis proposes that D. fragilis is carried within the eggs
          of the pinworm Enterobius vermicularis. D. fragilis DNA has been detected inside surface-sterilized
          E. vermicularis eggs from co-infected patients, and the higher-than-expected coincidence of
          D. fragilis and pinworm infections supports this mechanism. Because trophozoites are vulnerable
          to gastric acid and a human cyst stage has not been demonstrated, helminth egg vectoring provides
          a plausible route for surviving transit through the upper GI tract.
      selected_evidence:
        snippet: we detected D. fragilis DNA in 18 (85%) of 21 samples of E. vermicularis eggs collected
          from patients harbouring D. fragilis in faeces. This finding supports the hypothesis that E.
          vermicularis may have an important role in the transmission of D. fragilis.
        supports: SUPPORT
    origin:
