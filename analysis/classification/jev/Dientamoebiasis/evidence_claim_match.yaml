        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mucosal inflammatory response
        description: Colonization by D. fragilis trophozoites is hypothesized to elicit a host immune
          response involving mucosal inflammation. D. fragilis is non-invasive and the precise virulence
          factors are poorly characterized; a mucosal inflammatory mechanism is inferred from the clinical
          symptom association rather than demonstrated histologically, and pathogenicity itself remains
          contested (see notes). Peripheral eosinophilia has been observed in some patients, suggesting
          a possible Th2-skewed or allergic-type immune component.
        cell_types:
        - preferred_term: Epithelial cell of large intestine
          term:
            id: CL:0002253
            label: epithelial cell of large intestine
        - preferred_term: Mature eosinophil
          term:
            id: CL:0000041
            label: mature eosinophil
        biological_processes:
        - preferred_term: Inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        - preferred_term: Defense response to protozoan
          modifier: INCREASED
          term:
            id: GO:0042832
            label: defense response to protozoan
        locations:
        - preferred_term: Large intestine
          term:
            id: UBERON:0000059
            label: large intestine
        notes: The pathogenicity of D. fragilis remains debated. Some case-control studies find no significant
          difference in clinical signs between D. fragilis-positive and -negative patients regardless
          of parasite load, suggesting it may be a commensal of the digestive tract. Others demonstrate
          a dose-dependent association between parasite load and symptoms. Context-dependent factors such
          as co-infections (especially Blastocystis sp.), host immunity, and microbiome composition may
          determine clinical outcomes.
      selected_evidence:
        snippet: Usually, carriage of Dientamoeba is associated with symptoms such as abdominal pain and
