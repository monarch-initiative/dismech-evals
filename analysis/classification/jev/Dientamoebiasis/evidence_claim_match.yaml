        context: []
      assertion_type: Transmission
      assertion:
        name: Direct fecal-oral transmission via cysts
        description: Direct person-to-person fecal-oral transmission has been proposed as an alternative
          to the pinworm co-transmission hypothesis. The identification of a cyst stage of D. fragilis
          in rodents infected with a human isolate implies a life cycle similar to most other intestinal
          protistan parasites, where environmentally resistant cysts are shed in feces and ingested by
          a new host. The cyst wall may protect the organism during gastric transit, though this stage
          has not yet been confirmed in human infections.
        notes: As of 2024, cysts of D. fragilis have been identified only in experimentally infected mice
          and rats. No cyst stage has been confirmed in human stool samples. This limits the evidence
          for direct fecal-oral transmission in humans, though it remains a plausible mechanism given
          the ultrastructural characterization of a resistant cyst wall in rodent models.
      selected_evidence:
        snippet: These studies of cysts showed a clear cyst wall surrounding an encysted parasite. The
          cyst wall was double layered with an outer fibrillar layer and an inner layer enclosing the
          parasite.
        supports: SUPPORT
    origin:
      assertion_path: /transmission/1
      evidence_path: /transmission/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38250789
      reference_title: Observations on the transmission of Dientamoeba fragilis and the cyst life cycle
