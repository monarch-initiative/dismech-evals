  4523d15e9f396bebe4b2cb068a372cdfeaed87eca3caf7a37653ad59a220598a:
    claim:
      about:
        disease:
          name: Diethylene Glycol Poisoning
        context: []
      assertion_type: Treatment
      assertion:
        name: Hemodialysis
        description: 'Clears the parent compound - measured across a dialysis session in a treated child
          - and becomes renal replacement once tubular necrosis is established. A human case series reports
          acidaemia and renal impairment responding to emergent haemodialysis. Its availability matters:
          the paediatric epidemics in resource-constrained settings record deterioration despite peritoneal
          dialysis, and their authors call for haemodialysis facilities to be provided. An earlier draft
          asserted that haemodialysis availability was the main determinant of survival in the outbreaks
          and that peritoneal dialysis clears these solutes far less efficiently; neither is stated by
          a cited source and both were removed.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Hemodialysis
          term:
            id: NCIT:C15248
            label: Hemodialysis
        notes: '`NCIT:C15248` Hemodialysis is used rather than a broader procedure term. The deep research
          report offered `NCIT:C15571` for hemodialysis; that identifier is Differentiation Therapy, and
          was not used. The query run was a search of the OLS `ncit` index for "Hemodialysis", which returns
          `NCIT:C15248` as the exact match.'
      selected_evidence:
        snippet: We report a series of seven patients presenting with epidemic DEG poisoning from a correctional
          facility with varying degrees of metabolic acidemia and acute renal impairment responding to
          emergent hemodialysis (HD).
        supports: SUPPORT
