            label: aldehyde dehydrogenase (NAD+) activity
        notes: No CHEBI term is bound. Searching the OLS `chebi` index for "2-hydroxyethoxyacetic acid"
          and for "hydroxyethoxyacetic acid" returns nothing, so there is no identifier to bind rather
          than a better one that was missed.
      selected_evidence:
        snippet: After low and high doses of DEG, 2-hydroxyethoxyacetic acid (HEAA) was the primary metabolite
          in the urine, with only minor amounts of urinary diglycolic acid (DGA).
        supports: SUPPORT
