      assertion_type: Treatment
      assertion:
        name: Fomepizole
        description: 'The antidote, and unusually for a toxidrome its rationale is fully worked out: it
          inhibits alcohol dehydrogenase, so the parent compound is never converted to the acids that
          do the damage. In the rat model it prevents the metabolic acidosis and the renal and hepatic
          injury outright. Its value is therefore greatest before metabolism has occurred, and it cannot
          undo a lesion that diglycolic acid has already produced.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
