  fec5977842d95c2ffd17db02b96c76c72aff87956df85cf880f16d5e12756d49:
    claim:
      about:
        disease:
          name: Diethylene Glycol Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intracellular Diglycolic Acid Trapping
        biological_scale: CELLULAR
        description: Once inside, diglycolic acid is not effluxed. The cell has a route in and effectively
          no route out, so concentration builds - in rats kidney concentrations reach far above blood
          levels - which is why a metabolite circulating at modest concentration produces a lesion confined
          to this one cell type.
      selected_evidence:
        snippet: This study concluded that DGA is poorly transported out of cells and that stimulation
          of OAT transporters is not a viable target for reducing DGA accumulation in cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:36958672
      reference_title: Lack of efflux of diglycolic acid from proximal tubule cells leads to its accumulation
        and to toxicity of diethylene glycol.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: Establishes the one-way character of the step, and reports the negative result that
        the obvious efflux route cannot be recruited to reverse it.
