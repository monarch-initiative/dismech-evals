        description: Aldehyde dehydrogenase oxidises the aldehyde to 2-hydroxyethoxyacetic acid, the quantitatively
          dominant urinary metabolite. It is not the renal toxicant - it produces no death in human proximal
          tubule cells - but it is an organic acid and so contributes to the acidosis, and one review
