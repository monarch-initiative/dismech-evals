  fbd7bca8b45dcf6e9b28e96a2315bf8c28f7f4023c72c7b3751e3ba8083650c4:
    claim:
      about:
        disease:
          name: Diethylene Glycol Poisoning
        context: []
      assertion_type: Environmental
      assertion:
        name: Ingestion of a liquid medicine adulterated with diethylene glycol
        description: The dominant exposure route and the one behind every large outbreak. Diethylene glycol
          is substituted for pharmaceutical grade glycerin or propylene glycol in a syrup or elixir, usually
          as a cheaper adulterant introduced upstream in the excipient supply chain rather than by the
          finished-product manufacturer.
        exposure_term:
          preferred_term: exposure to diethylene glycol
          term:
            id: ECTO:9002156
            label: exposure to glycol
        notes: 'ECTO has no exposure class for diethylene glycol, so the genus term is bound and `preferred_term`
          carries the specificity. The searches run through the OLS `ecto` index were "diethylene glycol",
          "exposure to diethylene glycol", "diethyleneglycol", "diethylene", "oxydiethanol" and "2-(2-hydroxyethoxy)ethanol".
          The only ECTO hit among them is `ECTO:9001432` exposure to diethylenetriamine, a different chemical;
          `CHEBI:46807` diethylene glycol exists but ECTO has not generated an exposure class from it.

          Two near-misses were rejected on positive grounds rather than overlooked. `ECTO:9001111` exposure
          to ethylene glycol is exact for the wrong toxin - binding it would assert the confusion this
          entry''s top `notes` exists to prevent. `ECTO:9002161` exposure to glycol ether was rejected
          on narrower grounds than an earlier draft claimed. That draft said the term names the monoalkyl
          ethers of ethylene glycol, whose target organs are testis and bone marrow; that is industrial-hygiene
          usage, not the ontology''s definition, and ChEBI defines a glycol ether structurally as a hydroxyether
          - which diethylene glycol is. The term is therefore arguably correct and simply less apt than
          the bound one: `exposure to glycol` is the reading a curator would expect for this compound,
          and `glycol ether` invites the industrial-hygiene reading and its wrong target organs.'
      selected_evidence:
        snippet: 'After controlling for pre-existing hypertension and renal disease and the use of angiotensin-converting
          enzyme inhibitors, a significant association was found between ingestion of prescription cough
          syrup and illness onset (adjusted odds ratio: 31.0, 95% confidence interval: 6.93-138).'
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:18949211
      reference_title: 'Outbreak of acute renal failure in Panama in 2006: a case-control study.'
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The epidemiological link between the medicine and the illness, adjusted for the obvious
        renal confounders.
