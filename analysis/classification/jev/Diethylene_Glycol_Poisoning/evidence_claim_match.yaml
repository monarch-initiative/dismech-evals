        prompt: Is the delayed cranial and peripheral neuropathy of diethylene glycol poisoning caused
          by diglycolic acid acting directly on nerve, by 2-hydroxyethoxyacetic acid, or by retention
          of metabolite that only happens once the kidney has failed?
        attaches_to:
        - pathophysiology#Neuronal Mitochondrial Complex II Inhibition
        - phenotypes#Facial palsy
        rationale: 'Three accounts are live and this entry carries all three as hypothesis groups. The
          direct-toxicity account has the only positive mechanistic data, and it is an in vitro neuroblastoma
          result at millimolar concentrations. The 2-hydroxyethoxyacetic acid account comes from a review
          that states it as what is thought to be the case. The renal-dependence account has the most
          human support - a case series in which only the patients with established renal impairment went
          on to develop cranial neuropathy - and is echoed in two rat studies where brain metabolite accumulated
          only in animals with kidney injury. The three are not mutually exclusive: renal failure could
          supply the exposure that direct toxicity then acts on. What no source settles is why the facial
          nerve in particular.'
      selected_evidence:
        snippet: Established renal impairment may predict subsequent delayed neurologic toxicity.
        supports: SUPPORT
