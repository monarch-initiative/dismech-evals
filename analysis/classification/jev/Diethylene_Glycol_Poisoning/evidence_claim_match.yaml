  488eefcdd58fa61dc1e8db667f8f3409e9d2fffb391727c4b018bb27cf380ab6:
    claim:
      about:
        disease:
          name: Diethylene Glycol Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        kind: KNOWLEDGE_GAP
        discussion_id: oxalate_in_human_deg_cases
        prompt: If diethylene glycol is not metabolised to oxalate, why do calcium oxalate crystals appear
          in the kidneys of some human cases?
        attaches_to:
        - pathophysiology#Proximal Tubular ATP Depletion and Necrosis
        rationale: 'The rat metabolic study found no urinary oxalate or glycolate and concluded that toxicity
          does not proceed through conversion to ethylene glycol. A human autopsy case nonetheless describes
          calcium oxalate crystals in both kidneys. Candidate explanations the cited sources do not distinguish
          between: ethylene glycol generated endogenously as a minor metabolite of diethylene glycol -
          the rat study detected small amounts of it in urine even while finding no oxalate - ethylene
          glycol present as a contaminant alongside diethylene glycol in the ingested product, a species
          difference in that minor route, or oxalate of dietary or endogenous origin deposited in already
          necrotic tubules. An earlier draft of this rationale offered only the product-impurity explanation,
          which misread the quoted sentence: the ethylene glycol it reports was measured in the urine
          of dosed rats, so it is a metabolite, not an impurity. The entry records the conflict because
          the tidy version of the claim - that this poisoning never produces oxalate - is contradicted
          by a source it cites, and because the diagnostic advice that follows from it matters at the
          bedside.'
      selected_evidence:
        snippet: Small amounts of ethylene glycol (EG), but not oxalate or glycolate, were observed in
          the urine.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:20530232
      reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in
        rats.
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      explanation: 'The metabolic result: the oxalate route that drives ethylene glycol nephrotoxicity
        is not detectably engaged here.'
