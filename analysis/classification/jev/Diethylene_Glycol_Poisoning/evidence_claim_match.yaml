          therapeutic_agent:
          - preferred_term: fomepizole
            term:
              id: CHEBI:5141
              label: fomepizole
      selected_evidence:
        snippet: We report a case of DEG ingestion in a 17-month-old girl who was managed with activated
          charcoal, fomepizole (a recently available alcohol dehydrogenase inhibitor), and hemodialysis
          (HD).
        supports: SUPPORT
        directness: INDIRECT
