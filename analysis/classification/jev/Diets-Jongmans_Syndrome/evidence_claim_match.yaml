              disability, short stature and facial dysmorphism (OMIM:618846).
            term:
              id: MONDO:0030012
              label: Diets-Jongmans syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dijos_cancer_predisposition
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Do germline KDM3B variants predispose to childhood hematologic malignancy, and should
          people with Diets-Jongmans syndrome have any cancer surveillance?
        attaches_to:
        - phenotypes#Acute myeloid leukemia
        - phenotypes#Hodgkin lymphoma
        - pathophysiology#Impaired Hematopoietic Stem and Progenitor Cell Differentiation
        rationale: 'Two of the 17 founding individuals had a childhood hematologic malignancy, but both
          were recruited through a childhood cancer predisposition exome study, which introduces ascertainment
          bias. None of the later case reports and series cited in this entry (about ten further individuals)
          describes a malignancy, though follow-up in them is short. Separately, KDM3B lies in the 5q31
          region lost in myeloid neoplasms and was proposed as a candidate somatic tumor suppressor there,
          and homozygous Kdm3b-null mice have hematopoietic abnormalities resembling myelodysplastic syndrome.
          The somatic evidence is not uniformly tumor-suppressive: in other leukemia cell work KDM3B activates
          the LMO2 oncogene and represses differentiation. None of this somatic or homozygous-model evidence
          establishes that a single germline loss-of-function allele raises cancer risk, and no surveillance
          guideline addresses the syndrome. One later report cites the leukemia association when weighing
          growth hormone therapy.'
        proposed_experiments:
        - experiment_id: exp_dijos_malignancy_incidence_cohort
          name: Malignancy incidence in individuals ascertained for developmental phenotypes
          description: Follow individuals with DIJOS ascertained through developmental or growth referral
            (not through cancer studies) and compare observed with expected childhood hematologic malignancy
            incidence.
        - experiment_id: exp_kdm3b_heterozygous_hematopoiesis
          name: Hematopoiesis in Kdm3b heterozygous mice
          description: Test whether heterozygous, rather than homozygous-null, Kdm3b mice develop myelodysplasia-like
            changes or leukemia with aging or cooperating lesions.
      selected_evidence:
        snippet: We propose 5qNCA is a good candidate for the del(5q) tumor suppressor gene based on its
          predicted function and growth suppressive activities
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11687974
      reference_title: A novel nuclear protein, 5qNCA (LOC51780) is a candidate for the myeloid leukemia
        tumor suppressor gene on chromosome 5 band q31.
      evidence_source: IN_VITRO
      explanation: Somatic context only. 5qNCA is the former name of KDM3B; proposed as a 5q31 myeloid
        tumor suppressor candidate from somatic deletion mapping and cell-line growth suppression, not
        from germline data.
