          or act by another mechanism, and does variant class predict neurodevelopmental severity?
        attaches_to:
        - pathophysiology#KDM3B Heterozygous Loss of Function
        - genetic#KDM3B
        rationale: 'Haploinsufficiency is inferred from truncating and splice variants. About half of
          reported variants are missense, and their effect on demethylase activity has not been measured:
          the one reported assessment of a missense variant is an in silico structural prediction. A later
          review suggests that truncating variants may be associated with milder neurodevelopmental involvement
          than missense variants, which would imply that some missense variants act other than by simple
          loss of function, but that observation rests on small numbers.'
        proposed_experiments:
