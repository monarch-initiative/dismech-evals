      assertion:
        name: KDM3B Heterozygous Loss of Function
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        role: trigger
        description: A heterozygous germline KDM3B variant reduces functional KDM3B, a JmjC-domain demethylase
          of H3K9me1/2. Haploinsufficiency is the proposed mechanism on the strength of the nonsense,
          frameshift and splice variants (one splice variant shown to produce truncated transcripts) and
          the gene's constraint against loss of function. It is not established for the missense variants,
          whose effect on demethylase activity has not been measured experimentally. The confidence is
          therefore PROVISIONAL rather than ESTABLISHED.
        genes:
        - preferred_term: KDM3B
          term:
            id: hgnc:1337
            label: KDM3B
        molecular_functions:
        - preferred_term: histone H3K9me1/me2 demethylase activity
          term:
            id: GO:0140683
            label: histone H3K9me/H3K9me2 demethylase activity
          modifier: DECREASED
      selected_evidence:
        snippet: We identified missense and truncating variants, suggesting that KDM3B haploinsufficiency
          is the underlying mechanism for this syndrome.
        supports: SUPPORT
