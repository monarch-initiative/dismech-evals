      assertion:
        name: Autosomal dominant, mostly de novo
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        expressivity: VARIABLE
        de_novo_rate: Across the published cases the great majority of variants are de novo, with only
          a minority inherited from a similarly affected parent.
        description: Heterozygous KDM3B variants cause the syndrome in a dominant manner. Most arise de
          novo, but parent-to-child transmission is documented, including from parents with milder phenotypes
          (a mother with short stature and no intellectual disability; a family in which only one of four
          affected relatives met criteria for intellectual developmental disorder), which is the basis
          for recording variable expressivity. Penetrance has not been formally estimated.
      selected_evidence:
        snippet: By using exome sequencing and a gene matching approach, we identified de novo and inherited
          pathogenic variants in KDM3B in 14 unrelated individuals and three affected parents with varying
          degrees of intellectual disability (ID) or developmental delay (DD) and short stature.
        supports: SUPPORT
