      assertion_type: Discussion
      assertion:
        discussion_id: dijos_mouse_to_human_neurodevelopment
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Is the cerebellar motor-memory consolidation deficit of Kdm3b heterozygous mice a valid
          model of the developmental delay and intellectual disability of Diets-Jongmans syndrome?
        attaches_to:
        - pathophysiology#Altered Expression of Plasticity-Related Genes
        - pathophysiology#Impaired Memory Consolidation
        rationale: The heterozygous mouse is the right genetic model for a haploinsufficiency disorder,
          and it shows increased H3K9me2 and altered plasticity-gene expression in the cerebellum. But
          its phenotype is a selective deficit in consolidating one cerebellum-dependent memory, with
          normal acquisition and basal performance, whereas the human syndrome is global developmental
          and language delay beginning in infancy. No developmental, cortical or language-relevant phenotype
          has been reported in the mouse, and no patient-derived neural cells have been studied.
        proposed_experiments:
        - experiment_id: exp_kdm3b_patient_ipsc_neurons
          name: Patient-derived neuronal chromatin and transcriptome profiling
          description: Profile H3K9me2 and gene expression in iPSC-derived cortical neurons from individuals
            with truncating and missense KDM3B variants against isogenic corrected controls.
      selected_evidence:
        snippet: In the cerebellum-dependent optokinetic response (OKR) learning, Kdm3b+/- mice show deficits
          in memory consolidation, whereas they are normal in basal oculomotor performance and OKR acquisition.
        supports: SUPPORT
