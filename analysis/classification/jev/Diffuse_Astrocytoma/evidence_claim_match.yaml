        genetic_context:
          variant_origin: SOMATIC
        description: In diffuse hemispheric glioma of adolescents and young adults, H3F3A glycine-to-arginine
          (G34R) or glycine-to-valine (G34V) substitutions alter local chromatin near the H3 N-terminal
          tail, perturbing K36 methylation and reprogramming gene expression in cis. G34-mutant tumours
          typically arise in cerebral hemispheres and co-occur with ATRX loss, TP53 mutation, and alternative
          lengthening of telomeres.
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
      selected_evidence:
        snippet: Mutations in ATRX (α-thalassaemia/mental retardation syndrome X-linked) and DAXX (death-domain
          associated protein), encoding two subunits of a chromatin remodelling complex required for H3.3
          incorporation at pericentric heterochromatin and telomeres, were identified in 31% of samples
          overall, and in 100% of tumours harbouring a G34R or G34V H3.3 mutation.
        supports: SUPPORT
