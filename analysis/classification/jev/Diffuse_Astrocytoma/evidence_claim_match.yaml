              label: diffuse astrocytoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ATRX/TP53 Cooperative Loss
        description: In the adult IDH-mutant astrocytic lineage, ATRX loss-of-function mutations co-occur
          with TP53 mutations at very high frequency (approximately 86% ATRX and 94% TP53 in IDH-mutant
          non-codeleted lower-grade gliomas), and are mutually exclusive with 1p/19q codeletion. ATRX
          loss licenses alternative lengthening of telomeres (ALT); TP53 loss removes a key tumour-suppressor
          checkpoint. The ATRX-mutant / TP53-mutant / 1p19q-intact triad operationally defines astrocytic
          versus oligodendroglial differentiation in IDH-mutant diffuse glioma.
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
      selected_evidence:
        snippet: Nearly all lower-grade gliomas with IDH mutations and no 1p/19q codeletion had mutations
          in TP53 (94%) and ATRX inactivation (86%).
        supports: SUPPORT
    origin:
