        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MGMT Promoter Methylation as a Therapy-Response Axis
        description: Methylation of the O6-methylguanine-DNA methyltransferase (MGMT) promoter epigenetically
          silences MGMT expression and reduces tumour-cell capacity to repair O6-methylguanine adducts
          generated by alkylating chemotherapy (temozolomide). MGMT promoter methylation is a predictive
          biomarker for temozolomide benefit and is enriched in IDH-mutant astrocytomas through the G-CIMP
          background. It is a therapy-response axis, not an oncogenic driver per se.
        biological_processes:
        - preferred_term: DNA repair
          modifier: DECREASED
          term:
            id: GO:0006281
            label: DNA repair
      selected_evidence:
        snippet: Patients with glioblastoma containing a methylated MGMT promoter benefited from temozolomide,
          whereas those who did not have a methylated MGMT promoter did not have such a benefit.
        supports: SUPPORT
