            term:
              id: MONDO:0017863
              label: digitalis poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: potassium_threshold_as_absolute_rule
        kind: KNOWLEDGE_GAP
        prompt: Does a serum potassium above 5.5 mEq/L in acute digitalis poisoning really carry the near-certain
          mortality the classic stratification reports?
        attaches_to:
        - phenotypes#Hyperkalemia
        rationale: The 0% / 50% / 100% stratification by potassium band is quoted throughout the clinical
          literature and drives the decision to give antidote. It comes from a pre-antidote era and, on
          its face, asserts a 100% mortality that a single survivor falsifies. The case report that restates
          the rule is itself such a survivor, treated without Fab. That does not make the threshold useless
          - it remains the best-validated marker available and the right trigger for treatment - but the
          entry records the figure and its counterexample together rather than the figure alone.
      selected_evidence:
        snippet: We present a case of acute digoxin toxicity with high potassium level and good outcome
          despite unavailability of digoxin-specific Fab fragments.
        supports: REFUTE
        directness: DIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22737544
      reference_title: Good outcome after digoxin toxicity despite very high serum potassium level.
      evidence_source: HUMAN_CLINICAL
      explanation: Scoped narrowly to the "100% mortality above 5.5" claim, which a single survivor is
        sufficient to refute as an absolute. It does not refute the association between potassium and
        mortality, which the prognostic series supports and this entry records.
