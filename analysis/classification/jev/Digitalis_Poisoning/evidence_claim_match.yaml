  2283161beb463ad3645fc62eea2c8574b37de946682cd747800aa9a71b427459:
    claim:
      about:
        disease:
          name: Digitalis Poisoning
          disease_term:
            preferred_term: digitalis poisoning
            term:
              id: MONDO:0017863
              label: digitalis poisoning
        context: []
      assertion_type: Environmental
      assertion:
        name: Ingestion of a cardiac-glycoside-containing plant or animal product
        description: Foxglove, oleander, yellow oleander, lily-of-the-valley and toad-derived bufadienolide
          preparations all deliver cardiac glycosides and produce the same toxidrome by the same mechanism.
          In South Asia, yellow oleander seed ingestion is a major route of self-poisoning, and it is
          the setting in which the only randomised antidote trials for this class have been run.
        exposure_term:
          preferred_term: dietary exposure to a plant or animal cardiac glycoside
          term:
            id: ECTO:0000537
            label: exposure to toxin
        notes: Bound to the genus ECTO:0000537 exposure to toxin, after rejecting two nearer terms on
          positive grounds. Searched the pinned local build with `uv run runoak -i sqlite:obo:ecto search`
          for `l~glycoside`, `l~digital`, `l~cardenolide`, `l~oleander`, `l~digoxin`, `l~bufadienolide`
          and `l~ouabain` on 2026-09-19. `l~cardenolide`, `l~oleander`, `l~digoxin`, `l~bufadienolide`
          and `l~ouabain` return no ECTO exposure class. Two do exist and were rejected. ECTO:9000003
          exposure to digitalin is a real digitalis-glycoside exposure class, but digitalin is one specific
          compound of Digitalis purpurea; this entry covers digoxin, digitoxin, oleandrin and bufadienolides,
          and almost no patient in it is exposed to digitalin, so the term would be precise and wrong.
          ECTO:9000436 exposure to glycoside is its parent and would cover the whole entry, but `RO:0002309`
          relates it to CHEBI:24400 glycoside, a chemical class whose other members include the aminoglycoside
          antibiotics; nothing about the toxicity follows from the glycosidic bond, so it names the wrong
          feature of the molecule. ECTO:0000524 exposure to mycotoxin is wrong on its face - these are
          plant and amphibian toxins, not fungal. ECTO:0000537 matches the pattern of Ciguatera_Fish_Poisoning
          and Acute_Ackee_Fruit_Intoxication, which bind it and carry the agent in preferred_term.
      selected_evidence:
        snippet: cardiotoxicity from other cardenolides such as the yellow oleander are also a major problem,
          with tens of thousands of cases of poisoning each year in South Asia
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
