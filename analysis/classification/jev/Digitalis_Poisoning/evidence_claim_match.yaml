      assertion:
        name: Direct Cardiac Ion Channel Block
        biological_scale: MOLECULAR
        description: 'Inhibition of the L-type calcium current and of the rapid delayed rectifier potassium
          current by the glycoside itself, demonstrated with cytosolic calcium chelated and the sodium
          pump already blocked - so neither the calcium-overload chain nor pump inhibition accounts for
          it.

          The agent caveat is large enough to state plainly: the effect was measured mostly in bufadienolides,
          which are toad-derived, and the two cardenolides tested - ouabain and pecilocerin A, the class
          digoxin belongs to - showed around 10 to 15 per cent inhibition with IC50s above 100 micromolar,
          which is to say essentially none at attainable concentrations. Digoxin itself was not tested.
          The node is retained because the mechanism is real and this entry covers bufadienolide sources,
          but it should not be read as operating in ordinary digoxin poisoning.'
        molecular_functions:
        - preferred_term: voltage-gated calcium channel activity
          term:
            id: GO:0005245
            label: voltage-gated calcium channel activity
          modifier: DECREASED
        - preferred_term: delayed rectifier potassium channel activity
          term:
            id: GO:0005251
            label: delayed rectifier potassium channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: BF and CBG demonstrated a concentration-dependent (0.1 to100 µM) I Ca,L inhibition (maximal
          ≥50%) without and with the NKA activity blocked by 10 µM Oua
        supports: SUPPORT
        directness: DIRECT
