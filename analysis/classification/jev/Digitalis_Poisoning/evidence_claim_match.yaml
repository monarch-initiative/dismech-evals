          with block, junctional ectopic tachycardia, premature ventricular contractions, sinus bradycardia
          and ventricular fibrillation - are ECG diagnoses and had no diagnostic modality behind them
          until this entry was reviewed. It is not specific: no ECG pattern here is unique to digitalis,
          so the ECG localises and grades the rhythm disturbance while the history, the potassium and
          the drug level establish the cause.'
