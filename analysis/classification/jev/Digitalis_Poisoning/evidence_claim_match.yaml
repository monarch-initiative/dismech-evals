            term:
              id: MONDO:0017863
              label: digitalis poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: no_randomised_evidence_for_digoxin_itself
        kind: KNOWLEDGE_GAP
        prompt: Why is every randomised antidote trial for this poisoning in yellow oleander rather than
          in digoxin, and does that evidence transfer?
        attaches_to:
        - treatments#Digoxin-Specific Antibody Fragments
        - treatments#Multiple-Dose Activated Charcoal
        rationale: Both randomised results this entry cites - charcoal on mortality, Fab on dysrhythmia
          - come from yellow oleander self-poisoning in South Asia, where the case numbers are large enough
          to run a trial and the antidote is too expensive to be standard. For pharmaceutical digoxin,
          where the antidote is standard of care, the evidence is observational. The systematic review
          states that no antidote studies in other cardenolides were identified at all. The transfer argument
          is mechanistic - the same pump, the same chain - which is the sort of argument the rest of this
          entry is built to make explicit rather than assume.
      selected_evidence:
        snippet: Studies assessing the effect of antidotes on other cardenolides were not identified.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
