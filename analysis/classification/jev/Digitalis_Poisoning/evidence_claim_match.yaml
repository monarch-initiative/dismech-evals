        result in fifty healthy volunteers, and the counterweight to the post-mortem association above;
        the two are not in direct conflict, since one measures single-dose absorption and the other a
        post-mortem concentration, but recording only the positive one would misstate the field. The paper's
        own title states the negative result, but a title is not quoted here as a finding - this is the
        result sentence from the abstract.
