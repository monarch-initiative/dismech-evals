      assertion_type: Pathophysiology
      assertion:
        name: Triggered Automaticity
        biological_scale: TISSUE
        description: 'Ectopic beats arising from afterdepolarizations rather than from the sinus node.
          Named without a chamber because the foci are not confined to the ventricle: the same mechanism
          in the atrioventricular junction produces the accelerated junctional rhythm this entry also
          records, and the bound cell type CL:0002068 Purkinje myocyte spans the conduction system. When
          two foci with alternating exit pathways through the fascicles take turns, the result is bidirectional
