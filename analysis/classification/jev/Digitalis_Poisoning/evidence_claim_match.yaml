      assertion_type: Subtype
      assertion:
        name: Acute
        display_name: Acute poisoning
        description: A single large ingestion by someone not already taking the drug - usually deliberate
          self-poisoning, or a plant or animal cardenolide exposure. Gastrointestinal and cardiac features
          dominate. Potassium leaves cells faster than the kidney can redistribute it, so hyperkalemia
          and the potassium-based prognostic thresholds are features of this presentation rather than
          of digitalis toxicity in general, which is why the hyperkalemia phenotype and the serum potassium
          entries below are scoped to it.
      selected_evidence:
        snippet: In acute toxicity, gastrointestinal symptoms of nausea, anorexia and vomiting, and cardiac
          manifestations dominates, whereas malaise, weakness and visual disturbances predominate in chronic
          toxicity.
        supports: SUPPORT
        directness: DIRECT
