        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: calcium_in_digitalis_hyperkalemia
        kind: KNOWLEDGE_GAP
        prompt: Is intravenous calcium actually dangerous in digitalis-induced hyperkalemia, or is the
          contraindication inherited from older literature that controlled experiment does not support?
        attaches_to:
        - pathophysiology#Sarcoplasmic Reticulum Calcium Overload
        - treatments#Supportive Care and Electrolyte Management
        rationale: 'The mechanistic argument for withholding calcium is exactly this entry''s canonical
          chain: the cell is already calcium-overloaded, so adding calcium should make the arrhythmia
          worse - the "stone heart" concern. It is a textbook contraindication. The only controlled test
          in the cached literature is a twelve-animal porcine study that found no difference in time to
          death, and its own background section describes the contraindication as resting on older literature
          rather than on controlled data. Twelve pigs do not overturn a contraindication, and the study
          reports a pilot; but the asymmetry is worth recording, because the reasoning behind the dogma
          is a mechanistic inference from the same model this entry curates, and mechanistic inference
          is precisely what an outcome study is supposed to check.'
      selected_evidence:
        snippet: The administration of intravenous CaCl in the setting of hyperkalemia from acute digoxin
          toxicity did not affect mortality or time to death at the dose administered.
        supports: REFUTE
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
