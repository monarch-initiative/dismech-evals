      assertion_type: Pathophysiology
      assertion:
        name: Systemic Cardiac Glycoside Excess
        role: trigger
        biological_scale: ORGANISM
        description: 'Tissue concentrations of digoxin or another cardiac glycoside above what the myocardium
          tolerates. Reached three ways that behave differently: a single large ingestion in someone not
          already taking the drug, an extra dose on top of chronic therapy, and slow accumulation at an
          unchanged dose when renal clearance falls or a P-glycoprotein inhibitor is added. The distinction
          matters clinically, and the mechanism predicts why: a sudden large inhibition redistributes
          potassium faster than the kidney can compensate, which is the usual explanation for hyperkalemia
          being described as an acute-pattern finding.'
        chemical_entities:
        - preferred_term: digoxin
          term:
            id: CHEBI:4551
            label: digoxin
          modifier: INCREASED
      selected_evidence:
        snippet: The main route of elimination is renal excretion of digoxin, which is closely correlated
          with the glomerular filtration rate.
        supports: SUPPORT
        directness: DIRECT
