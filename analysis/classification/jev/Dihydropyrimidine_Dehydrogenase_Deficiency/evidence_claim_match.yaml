              label: dihydropyrimidine dehydrogenase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic DPYD Loss of Function
        biological_scale: MOLECULAR
        description: 'Deleterious variants in DPYD, which encodes dihydropyrimidine dehydrogenase. The
          enzyme is a large homodimeric redox protein carrying two FAD, two FMN, and eight iron-sulfur
          clusters arranged as electron-transfer chains, which is why loss of function is reachable by
          many mechanistically distinct routes: disruption of the substrate site, of cofactor binding,
          of the electron wire, or of dimer assembly and folding. Complete deficiency requires two alleles;
          a single deleterious allele reduces activity enough to matter only when a fluoropyrimidine is
          administered.'
        molecular_functions:
        - preferred_term: dihydropyrimidine dehydrogenase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0017113
            label: dihydropyrimidine dehydrogenase (NADP+) activity
      selected_evidence:
        snippet: arranged in two electron transfer chains that pass the dimer interface twice
        supports: SUPPORT
