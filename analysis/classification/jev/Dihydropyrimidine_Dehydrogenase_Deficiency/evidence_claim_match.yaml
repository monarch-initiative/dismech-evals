  4cb612b0bb050d30f7c6b44dd8d5bb71bde7b42f2df7bcbdef766e4f9006142a:
    claim:
      about:
        disease:
          name: Dihydropyrimidine Dehydrogenase Deficiency
          disease_term:
            preferred_term: Dihydropyrimidine Dehydrogenase Deficiency
            term:
              id: MONDO:0010130
              label: dihydropyrimidine dehydrogenase deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: DPYD
        gene_term:
          preferred_term: DPYD
          term:
            id: hgnc:3012
            label: DPYD
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'Encodes dihydropyrimidine dehydrogenase. Inheritance is autosomal recessive for the constitutive
          inborn error, but the pharmacogenomic arm is dose dependent rather than recessive: a single
          deleterious allele reduces activity enough to cause severe or fatal fluoropyrimidine toxicity,
          which is why heterozygotes who are otherwise entirely healthy are the population that pre-treatment
          genotyping is designed to protect. The clinically actionable variants include DPYD*2A (c.1905+1G>A),
          c.1679T>G, c.1236G>A/HapB3, and c.2846A>T. No genotype-phenotype correlation has been established
          for the neurological arm.

          One correction worth stating explicitly, because getting it wrong is a common error in entries
          for this disease: c.1236G>A is a linkage tag rather than the causal allele. It is assayed because
          it is easy to genotype and marks the HapB3 haplotype, but the functional lesion on that haplotype
          is a deep intronic variant, c.1129-5923C>G, which creates a cryptic splice donor site and inserts
          a 44 base-pair pseudo-exon into the transcript. A panel that reports c.1236G>A is reporting
          the flag, not the mechanism, and any mechanistic statement should attach to the intronic variant.

          Allele frequencies are strongly ancestry-dependent, which makes panel design an equity question
          rather than a technical one. DPYD*2A, c.2846A>T, and c.1679T>G are essentially absent in East
          Asian populations, while c.557A>G is markedly enriched in people of African ancestry and is
          not on every panel. A panel assembled from variants discovered in European cohorts will therefore
          under-detect risk in exactly the populations it was not built from, and a negative result carries
          different meaning depending on the patient''s ancestry.'
      selected_evidence:
        snippet: A clear correlation between the genotype and phenotype has not been established.
        supports: SUPPORT
