      assertion_type: Treatment
      assertion:
        name: Pre-Treatment DPYD Genotyping and Genotype-Guided Dosing
        description: 'The intervention that defines modern management, and it is preventive rather than
          therapeutic. Testing DPYD before the first fluoropyrimidine dose and reducing or avoiding the
          drug according to residual activity converts a lethal idiosyncratic reaction into a manageable
          one. The evidence is quantitative and among the strongest in pharmacogenomics: upfront genotyping
          with dose individualisation cut severe toxicity dramatically and abolished drug-induced death
          in the study population.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Genetic testing to guide fluoropyrimidine dosing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: The prospective study found that a 50 per cent reduction sufficed for DPYD*2A and c.1679T>G
          but that the 25 per cent reduction it used for c.1236G>A and c.2846A>T required further investigation.
          Current guidance uses a uniform 50 per cent reduction for intermediate metabolisers. Any curated
          dosing algorithm should cite the current guideline for the recommendation itself and this study
          only for the empirical basis.
      selected_evidence:
        snippet: The risk of grade ≥ 3 toxicity was thereby significantly reduced from 73% (95% CI, 58%
          to 85%) in historical controls (n = 48) to 28% (95% CI, 10% to 53%) by genotype-guided dosing
        supports: SUPPORT
