      assertion_type: Biochemical
      assertion:
        name: Plasma uracil concentration
        notes: Endogenous plasma uracil is the phenotyping approach to identifying DPD deficiency before
          treatment, and is one of the two methods the European Medicines Agency recommends. It measures
          what actually matters, namely residual enzyme activity, rather than inferring it from a handful
          of known variants. Interpretation is banded rather than binary, with partial deficiency between
          16 and 150 nanograms per millilitre and complete deficiency above 150 under French recommendations.
          High pre-treatment uracil predicts severe toxicity.
        presence: INCREASED
      selected_evidence:
        snippet: According to French recommendations, 7.3 % of patients were partially deficient (U 16-150
          ng/mL) and 0.02 % completely deficient
        supports: SUPPORT
