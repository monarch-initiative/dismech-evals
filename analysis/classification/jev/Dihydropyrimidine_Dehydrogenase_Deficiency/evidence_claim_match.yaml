      assertion_type: Diagnosis
      assertion:
        name: Genotype-phenotype discordance in pre-treatment testing
        description: The single most consequential fact about testing in this disease, and the reason
          both methods are curated rather than one. Genotyping and phenotyping identify overlapping but
          different patients, and targeted genotyping is not reliable enough on its own to find everyone
          with complete deficiency. A negative genotype is therefore not a clearance, which matters because
          the consequence of missing a complete deficiency is a potentially fatal first cycle.
      selected_evidence:
        snippet: These results reaffirm the poor concordance between DPD phenotyping and genotyping, suggesting
          that both approaches may be complementary and that targeted DPYD genotyping is not sufficiently
          reliable to identify all patients with complete deficiency.
        supports: SUPPORT
