      assertion_type: Pathophysiology
      assertion:
        name: Fluoropyrimidine Cytotoxicity in Proliferating Tissues
        biological_scale: TISSUE
        description: 'Supratherapeutic 5-fluorouracil exposure damages rapidly proliferating tissues by
          two routes: the metabolite FdUMP inhibits thymidylate synthase, producing thymineless stress
          and DNA damage, and FUTP is misincorporated into RNA. Bone marrow and gastrointestinal mucosa
          bear the brunt, with skin, myocardium, and central nervous system also affected. This node is
          the disease-specific substitution for the cytotoxic driver in the myelosuppression module: the
          insult is not an administered cytotoxic dose but an ordinary dose that the patient cannot clear.'
        conforms_to: myelosuppression#Cytotoxic Insult to Proliferating Hematopoietic Progenitors
      selected_evidence:
        snippet: uridine triacetate was a safe and effective lifesaving antidote
        supports: SUPPORT
