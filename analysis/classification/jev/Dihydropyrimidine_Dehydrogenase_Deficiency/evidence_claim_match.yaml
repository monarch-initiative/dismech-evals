        biological_scale: MOLECULAR
        description: 'Diminished or absent dihydropyrimidine dehydrogenase activity. This node is the
          hinge of the entry: everything constitutive runs downstream of it through the blocked catabolic
          pathway, and everything pharmacogenomic runs downstream of it only once a fluoropyrimidine arrives.
          Residual activity is continuous rather than binary, which is why the same node supports both
          a severe infantile presentation and a lifelong asymptomatic state.'
        biological_processes:
