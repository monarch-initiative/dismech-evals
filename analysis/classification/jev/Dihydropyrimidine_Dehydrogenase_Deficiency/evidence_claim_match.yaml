      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: altered_pyrimidine_homeostasis_neurotoxicity
        hypothesis_label: Altered pyrimidine and beta-alanine homeostasis causes the neurological phenotype
        status: EMERGING
        description: Holds that accumulated uracil and thymine, together with depleted beta-alanine and
          beta-aminoisobutyrate, disturb the developing central nervous system, and that this accounts
          for the seizures, developmental delay, and white-matter abnormalities seen in some patients.
          The pathway logic is coherent, since beta-alanine is a structural analogue of the two principal
          inhibitory neurotransmitters, and the metabolite disturbance itself is beyond doubt. What is
          unproven is the link from that disturbance to brain injury.
        notes: Deliberately EMERGING rather than CANONICAL. The decisive problem is not weak evidence
          for the mechanism but the existence of biochemically deficient individuals with no neurological
          phenotype whatsoever, which means the metabolite disturbance cannot be sufficient. Any complete
          account has to explain the unaffected as well as the affected, and none currently does.
      selected_evidence:
        snippet: An altered beta-alanine, uracil and thymine homeostasis might underlie the various clinical
          abnormalities encountered in patients with DPD deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
