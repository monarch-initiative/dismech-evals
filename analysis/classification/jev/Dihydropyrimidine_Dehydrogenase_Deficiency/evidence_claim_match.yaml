        description: The knockout does not reproduce the neurological phenotype that defines the human
          constitutive disease. Behavioural testing found no difference in cognitive, social, or affective
          domains, and no seizure phenotype is reported. This is a substantive negative result and is
          the reason the human neurological chain remains an EMERGING hypothesis rather than being supported
          by animal data.
