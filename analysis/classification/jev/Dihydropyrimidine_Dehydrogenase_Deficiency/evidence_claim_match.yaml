      assertion_type: Pathophysiology
      assertion:
        name: Impaired Fluoropyrimidine Clearance
        biological_scale: ORGANISM
        description: Exposure-gated node, and the reason this disease matters far beyond the handful of
          children with the inborn error. Dihydropyrimidine dehydrogenase performs the great majority
          of fluoropyrimidine catabolism, so a patient with reduced activity who receives a standard dose
          of 5-fluorouracil or capecitabine cannot clear it. Systemic exposure and half-life rise, and
          the patient effectively receives an overdose while being given a normal prescription. Nothing
          about this node is active until the drug is administered.
        biological_processes:
        - preferred_term: pyrimidine nucleobase catabolic process
          modifier: DECREASED
          term:
            id: GO:0006208
            label: pyrimidine nucleobase catabolic process
      selected_evidence:
        snippet: A polymorphism in the fluoropyrimidine metabolizing enzyme dihydropyrimidine dehydrogenase
          (DPD; ie, DPYD*2A) is strongly associated with fluoropyrimidine-induced severe and life-threatening
          toxicity.
        supports: SUPPORT
