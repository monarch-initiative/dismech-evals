  604af188d7b6a0e09dcdac0308c8eaae55803fd95f33412b0a7a1c54a9af2e0f:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy
          disease_term:
            preferred_term: dilated cardiomyopathy
            term:
              id: MONDO:0005021
              label: dilated cardiomyopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: C10orf71
        gene_term:
          preferred_term: C10orf71
          term:
            id: hgnc:26973
            label: C10orf71
        association: Autosomal dominant causal pathogenic variant. C10orf71 encodes an intrinsically disordered,
          cardiomyocyte-specific protein also reported as the z-disc protein CEFIP. Frameshift variants
          were identified in a large family with eight affected members and in four further loss-of-function
          carriers across two sporadic DCM cohorts. Null cardiomyocytes lose contractile function while
          sarcomere structure stays intact, so the lesion is contractile rather than structural.
      selected_evidence:
        snippet: C10orf71-null cardiomyocytes exhibited impaired contractile function with unaffected
          sarcomere structure. Cardiomyocytes and heart organoids derived from human induced pluripotent
          stem cells with C10orf71 frameshift variants also had contractile defects with normal electrophysiological
          activity. A rescue study using a cardiac myosin activator, omecamtiv mecarbil, restored contractile
          function in C10orf71-KO mice. These data support C10orf71 as a causal gene for DCM by contributing
          to the contractile function of cardiomyocytes.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/48
      evidence_path: /genetic/48/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38950288
      reference_title: Frameshift variants in C10orf71 cause dilated cardiomyopathy in human, mouse, and
        organoid models.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: Supports the contractile rather than structural nature of the lesion, in knockout mouse,
        null cardiomyocyte and human iPSC-derived organoid models.
