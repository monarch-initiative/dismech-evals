      assertion_type: Pathophysiology
      assertion:
        name: Cardiomyocyte Calcium Release Dysregulation
        biological_scale: CELLULAR
        description: 'JPH2 and RYR2 act on the sarcoplasmic reticulum calcium release step rather than
          on the contractile apparatus. JPH2 builds the junctional membrane complex that couples the t-tubule
          to the sarcoplasmic reticulum, and RYR2 is the release channel itself. The reported defect is
          a loss of control over when release terminates rather than a smaller release: the RyR2 exon-3
          region associated with dilated cardiomyopathy lowers the luminal calcium threshold at which
          release ends and increases the fractional release.'
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: regulation of sarcoplasmic reticulum calcium release
          term:
            id: GO:0010880
            label: regulation of release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
          modifier: DYSREGULATED
        genes:
        - preferred_term: JPH2
          term:
            id: hgnc:14202
            label: JPH2
        - preferred_term: RYR2
          term:
            id: hgnc:10484
            label: RYR2
      selected_evidence:
        snippet: we found that autosomal recessive, loss-of-function variants are associated with severe,
          early onset DCM, while autosomal dominant missense variants are associated with a wider range
          of cardiac disease, including HCM, arrhythmia, SCD, and cardiac conduction disease.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
