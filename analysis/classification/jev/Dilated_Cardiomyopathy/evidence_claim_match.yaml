  00ae8578030e6fb209b00b97bedc0a837aea028d9314358702af06cbd2aba9fa:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy
          disease_term:
            preferred_term: dilated cardiomyopathy
            term:
              id: MONDO:0005021
              label: dilated cardiomyopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: PPCS
        gene_term:
          preferred_term: PPCS
          term:
            id: hgnc:25686
            label: PPCS
        association: Autosomal recessive causal pathogenic variant. PPCS catalyses the second step of
          de novo coenzyme A biosynthesis from vitamin B5. Biallelic variants were found in five individuals
          from two unrelated families presenting with dilated cardiomyopathy, with reduced CoA levels
          in fibroblasts. This is a cofactor-biosynthesis lesion rather than a sarcomeric or cytoskeletal
          one, and CoA can be made from pantethine independently of PPCS, which is why pantethine was
          proposed as a targeted treatment.
      selected_evidence:
        snippet: Exome sequencing in five individuals from two unrelated families presenting with dilated
          cardiomyopathy revealed biallelic mutations in PPCS, linking CoA synthesis with a cardiac phenotype.
          Studies in yeast and fruit flies confirmed the pathogenicity of identified mutations. Biochemical
          analysis revealed a decrease in CoA levels in fibroblasts of all affected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/50
      evidence_path: /genetic/50/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29754768
      reference_title: Mutations in PPCS, Encoding Phosphopantothenoylcysteine Synthetase, Cause Autosomal-Recessive
