          factor that activates HSC70-mediated folding, FBXO32 (atrogin-1) is the substrate-recognition
          subunit of an SCF ubiquitin ligase, and PLEKHM2 positions lysosomes for autophagic flux. Most
          are recessive and several present in the neonatal or infantile period.
