          monosomy 1p36, MIB1 is the NOTCH pathway E3 ubiquitin ligase whose loss arrests trabecular maturation
          and compaction, and GATAD1 was mapped in a family with recessive DCM. Left ventricular noncompaction
          overlaps this group, reflecting arrested chamber development rather than degeneration of a formed
          myocardium.
