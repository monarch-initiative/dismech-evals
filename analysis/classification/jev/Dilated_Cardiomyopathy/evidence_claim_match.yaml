            term:
              id: MONDO:0005021
              label: dilated cardiomyopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: CAP2
        gene_term:
          preferred_term: CAP2
          term:
            id: hgnc:20039
            label: CAP2
        association: Autosomal recessive causal pathogenic variant. CAP2 encodes a cyclase-associated
          actin cytoskeleton regulatory protein required for the kinetics of actin filament repolymerization;
          a homozygous splice-consensus variant in a consanguineous Bedouin family caused DCM with supraventricular
          tachycardia, and patient fibroblasts showed altered actin repolymerization kinetics.
      selected_evidence:
        snippet: This is the first report of a recessive deleterious mutation in CAP2 and its association
          with DCM in humans. The clinical phenotype recapitulates the damaging effects on the heart observed
          in Cap2 knockout mice including DCM and cardiac conduction disease, but not the other effects
          on growth, viability, wound healing and eye development. Our data underscore the importance
          of the proper kinetics of actin polymerization for normal function of the human heart.
        supports: SUPPORT
