        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Coenzyme A Biosynthesis Deficiency
        biological_scale: MOLECULAR
        description: 'PPCS catalyses the second of the five enzymatic steps that make coenzyme A from
          vitamin B5, and biallelic PPCS variants lower cellular CoA. CoA is a cofactor for a large share
          of cellular enzymes including those of fatty-acid handling, so this is a metabolic cofactor
          lesion reaching the myocardium, distinct from the sarcomeric, ion-handling, proteostatic and
          transcriptional routes into the same phenotype. It is also the one route here with a directly
          implied treatment: CoA can be made from pantethine by a route that does not use PPCS.'
        biological_processes:
        - preferred_term: coenzyme A biosynthetic process
          term:
            id: GO:0015937
            label: coenzyme A biosynthetic process
          modifier: DECREASED
        chemical_entities:
        - preferred_term: coenzyme A
          term:
            id: CHEBI:15346
            label: coenzyme A
          modifier: DECREASED
        genes:
        - preferred_term: PPCS
          term:
            id: hgnc:25686
            label: PPCS
      selected_evidence:
        snippet: Exome sequencing in five individuals from two unrelated families presenting with dilated
          cardiomyopathy revealed biallelic mutations in PPCS, linking CoA synthesis with a cardiac phenotype.
          Studies in yeast and fruit flies confirmed the pathogenicity of identified mutations. Biochemical
          analysis revealed a decrease in CoA levels in fibroblasts of all affected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/12
      evidence_path: /pathophysiology/12/evidence/0
      context_paths:
      - /name
      - /disease_term
