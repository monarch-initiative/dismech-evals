        context:
        - path: /experimental_models/0
          value:
            name: Patient-specific TNNT2 R173W iPSC-derived cardiomyocytes (Clinical Trials in a Dish)
            description: Cardiomyocytes differentiated from induced pluripotent stem cells reprogrammed
              from skin fibroblasts of a three-generation family carrying the autosomal dominant sarcomeric
              TNNT2 R173W mutation, with mutation-negative relatives from the same family serving as isogenic-adjacent
              controls. A non-animal New Approach Methodology that puts the patient's own genotype into
              a dish and supports both disease modelling and pharmacological rescue testing.
            experimental_model_type: IPSC_DERIVED_MODEL
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: heart
              term:
                id: UBERON:0000948
                label: heart
            cell_types:
            - preferred_term: iPSC-derived cardiomyocyte
              term:
                id: CL:0000746
                label: cardiac muscle cell
            conditions:
            - familial dilated cardiomyopathy with the TNNT2 R173W sarcomeric mutation
            - beta-adrenergic agonist stress with norepinephrine
            - beta-blocker and SERCA2a rescue
            cell_source: 'Patient-derived: iPSC lines reprogrammed from skin fibroblasts of four TNNT2
              R173W carriers and three mutation-negative relatives in one family cohort'
            culture_system: Embryoid-body cardiac differentiation followed by dissociated beating clusters
              and single cardiomyocytes, assayed by immunocytochemistry, transmission electron microscopy,
              calcium transient imaging, microelectrode arrays and atomic force microscopy
            publication: PMID:22517884
            notes: 'Curated from the NAMeRS 2026 symposium New Approach Methodology tracker (monarch-initiative/dismech#4873),
              Panel 1 Clinical Trials in a Dish case study. No `namo_type` is recorded. NAMO defines no
              iPSC-derived model class (checked against its 56 classes) and its CellularSystem parent
              is abstract, so the choice was among the concrete culture-format siblings, and none of the
              three describes this system: CellLineModel is scoped to immortalized lines; ThreeDCellCulture
              fits the embryoid-body differentiation stage but not cells assayed after dissociation; TwoDCellCulture
              fits the single cardiomyocytes on atomic force microscopy and microelectrode arrays but
              not the 3D stage that produced them. The system spans two formats and NAMO has no value
              for the derivation that actually distinguishes it, so the slot is left absent rather than
              made to pick a half. `experimental_model_type: IPSC_DERIVED_MODEL` carries the distinction
              instead, and the upstream gap is monarch-initiative/namo#24. An earlier revision of this
              record used a coined InducedPluripotentStemCellDerivedModel CURIE (written here without
              its prefix so that prefix censuses over `kb/` do not match this file), which does not exist
              in NAMO; nothing validates `namo_type`, so it passed every gate. The adrenergic-stress readouts
              are split by direction because the source sentence reports both a fall in beating rate and
              contraction and a rise in cells with abnormal sarcomeric alpha-actinin, and `direction`
              is single-valued. The underlying evidence item was already cited on the Sarcomeric and Cytoskeletal
              Dysfunction node; this section adds the structured model record, its pathograph links and
              the rescue and adrenergic-stress readouts.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Neurohormonal Activation
        relationship: PERTURBS
        fidelity: LOW
        description: Exposing the cardiomyocytes to a beta-adrenergic agonist applies the catecholamine
          arm of this node directly to the cells and unmasks a genotype-dependent vulnerability that is
          not apparent at baseline.
        limitations: 'This is an acute pharmacological stimulus applied to isolated cardiomyocytes. It
          reproduces the receptor-level consequence of sympathetic drive but not neurohormonal activation
          as a disease process: there is no sympathetic nervous system, no renin-angiotensin-aldosterone
          axis, no natriuretic peptide counter-regulation and no feedback loop between cardiac output
          and neurohormonal tone.'
        readouts:
        - name: Contractile function under beta-adrenergic agonist stress
          target: Neurohormonal Activation
          direction: DECREASED
          interpretation: Under adrenergic stimulation patient cardiomyocytes slowed and lost contractile
            function, showing that catecholamine exposure degrades pump function in cells already carrying
            the sarcomeric lesion.
        - name: Sarcomeric disorganisation under beta-adrenergic agonist stress
          target: Neurohormonal Activation
          direction: INCREASED
          interpretation: The same adrenergic exposure spread sarcomeric disorganisation to more cells,
            so catecholamine stress aggravates the structural lesion and not only the functional one.
      selected_evidence:
        snippet: When stimulated with a β-adrenergic agonist, DCM iPSC-derived cardiomyocytes showed characteristics
          of cellular stress such as reduced beating rates, compromised contraction, and a greater number
          of cells with abnormal sarcomeric α-actinin distribution
        supports: SUPPORT
        directness: INDIRECT
