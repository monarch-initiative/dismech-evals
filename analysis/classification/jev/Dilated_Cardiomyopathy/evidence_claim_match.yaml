      selected_evidence:
        snippet: Genetic variants in the ABCC9 gene, encoding the SUR2 auxiliary subunit from KATP channels,
          were previously linked with various inherited diseases. This wide range of congenital disorders
          includes multisystem and cardiovascular pathologies. The gain-of-function mutations result in
          Cantu syndrome, acromegaloid facial appearance, hypertrichosis, and acromegaloid facial features.
          The loss-of-function mutations in the ABCC9 gene were associated with the Brugada syndrome,
          early repolarization syndrome, and dilated cardiomyopathy.
        supports: SUPPORT
