        description: SCN5A, ABCC9 and TNNI3K act on the cardiomyocyte action potential rather than on
          calcium release or on the contractile apparatus. SCN5A carries the cardiac sodium current, ABCC9
          is the SUR2 subunit of the cardiac KATP channel, and TNNI3K is a cardiac troponin I interacting
