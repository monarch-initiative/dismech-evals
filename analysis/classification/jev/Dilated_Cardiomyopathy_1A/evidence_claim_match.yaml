      assertion_type: Treatment
      assertion:
        name: Implantable Cardioverter-Defibrillator
        description: The signature intervention in this disease. Because sudden death risk tracks the
          conduction and arrhythmic phenotype rather than ejection fraction, a defibrillator is preferred
          over a pacemaker for every pacing indication in an LMNA carrier, and implantation is considered
          at ejection fractions that would not warrant a device in non-genetic dilated cardiomyopathy.
          Candidate selection is guided by the gene-specific risk factors and the LMNA-risk VTA model
          rather than by an EF threshold alone.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Implantable cardioverter-defibrillator placement
          term:
            id: NCIT:C80435
            label: Implantable Cardioverter-Defibrillator Placement
      selected_evidence:
        snippet: Carriers of LMNA mutations with a high risk of MVA can be identified using these risk
          factors. This facilitates selection of LMNA mutation carriers who are most likely to benefit
          from an ICD.
        supports: SUPPORT
