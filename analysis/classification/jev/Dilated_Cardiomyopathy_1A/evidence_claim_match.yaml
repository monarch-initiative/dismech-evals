      assertion_type: Genetic
      assertion:
        name: TTN
        notes: A co-occurring titin variant acts as a modifier rather than an independent cause. In an
          extended family segregating LMNA p.K219T, the four members who also carried TTN p.L4855F required
          heart transplantation substantially younger than single heterozygotes, and their myocardium
          showed increased nuclear length, sarcomeric disorganisation and myonuclear clustering. This
          is one documented source of the intrafamilial variability that is otherwise unexplained in this
          disease.
        gene_term:
          preferred_term: TTN
          term:
            id: hgnc:12403
            label: TTN
        relationship_type: MODIFIER
      selected_evidence:
        snippet: Myocardial specimens of doubly heterozygote individuals showed increased nuclear length,
          sarcomeric disorganization, and myonuclear clustering compared with samples from single heterozygotes.
        supports: SUPPORT
