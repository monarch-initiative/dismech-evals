            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: Mechanistically, lamin A interacts with sirtuin 1 (SIRT1) where mutant lamin A/C accelerates
          degradation of SIRT1, leading to mitochondrial dysfunction and oxidative stress.
