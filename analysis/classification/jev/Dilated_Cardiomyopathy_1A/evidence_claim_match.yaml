      assertion_type: Pathophysiology
      assertion:
        name: Chromatin and Lamina-Associated Domain Disorganization
        biological_scale: MOLECULAR
        role: effector
        description: The lamina tethers peripheral heterochromatin, so a defective meshwork releases and
          redistributes it. Lamin A/C-null cardiomyocyte nuclei show central displacement and fragmentation
          of heterochromatin, and heterochromatin is dislocated in the hearts of H222P knock-in mice alongside
          activated Smad signalling. Loss of the correct chromatin-lamina arrangement is the presumed
          route by which a structural protein defect becomes a transcriptional one, including a failure
          to mount the compensatory hypertrophic gene programme that normally accompanies ventricular
          stress.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Lmna(-/-) LV myocyte nuclei have marked alterations of shape and size with central displacement
          and fragmentation of heterochromatin; these changes are present but less severe in left atrial
          nuclei.
        supports: SUPPORT
