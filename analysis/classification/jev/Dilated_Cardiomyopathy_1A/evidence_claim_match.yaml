            term:
              id: MONDO:0007269
              label: dilated cardiomyopathy 1A
        context: []
      assertion_type: Treatment
      assertion:
        name: Early Cardiac Resynchronization Therapy
        description: An emerging, weakly evidenced deviation from standard practice. Because LMNA carriers
          frequently need pacing before their QRS widens, and right-ventricular pacing itself is dyssynchronising,
          one small comparative series implanted CRT-D rather than a conventional device in carriers with
          a narrow QRS who already had a pacemaker or ICD indication. Over 7.2 years none of the five
          CRT patients reached the composite of transplantation, death from end-stage heart failure or
          ventricular tachycardia ablation, versus three of five without. With ten patients and no randomisation
          this is hypothesis generating, not practice defining.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Cardiac resynchronization therapy
          term:
            id: NCIT:C80436
            label: Cardiac Resynchronization Therapy
        notes: Not a guideline recommendation. Curated because it is the only reported attempt to modify
          this disease's course with device programming rather than drugs, and because the rationale -
          avoiding pacing-induced dyssynchrony in a population that is paced early - is specific to LMNA
          rather than generic heart failure practice.
      selected_evidence:
        snippet: Of ten LMNA DCM patients (age 51±10 years, QRS 96±14 msec, EF 55±7%) with indication
          for pacemaker or ICD implantation, five underwent early CRT-D implantation. After 7.2±4 years,
          three patients (60%) in the non-CRT group reached the primary outcome, compared to no patients
          in the CRT group (P=0.046).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38495409
      reference_title: The role of early cardiac resynchronization therapy implantation in dilated cardiomyopathy
        patients with narrow QRS carrying lamin A/C mutation.
      evidence_source: HUMAN_CLINICAL
      explanation: The comparative outcome data. PARTIAL because ten patients, non-randomised and retrospectively
