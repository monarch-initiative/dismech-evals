            term:
              id: MONDO:0007269
              label: dilated cardiomyopathy 1A
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cardiac Sarcoidosis
        description: The highest-stakes mimic, and the only acquired one on this list. Cardiac sarcoidosis
          presents with the same triad of atrioventricular block, ventricular arrhythmia and heart failure,
          with patchy non-ischaemic late gadolinium enhancement on cardiac magnetic resonance. Distinguishing
          them changes management in opposite directions - immunosuppression versus early defibrillator
          - and endomyocardial biopsy can be equivocal, so genetic testing belongs in the initial workup
          rather than after imaging has been relied on alone.
        distinguishing_features:
        - A pathogenic LMNA variant, and a family history of conduction disease, pacemaker or sudden death
          at a young age.
        - Extracardiac sarcoid involvement, non-caseating granulomas on biopsy, and FDG-PET uptake favour
          sarcoidosis; but isolated cardiac sarcoidosis occurs and imaging criteria alone do not separate
          the two.
      selected_evidence:
        snippet: Also highlighted is the need for extreme caution when endomyocardial biopsies are equivocal
          and there is sole reliance on cardiac imaging to establish diagnostic criteria.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/3
      evidence_path: /differential_diagnoses/3/evidence/1
      context_paths:
