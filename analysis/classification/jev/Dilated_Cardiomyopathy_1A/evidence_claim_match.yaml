      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29095976
      reference_title: 'Lamin A/C cardiomyopathy: young onset, high penetrance, and frequent need for
        heart transplantation.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the LMNA share of familial dilated cardiomyopathy in a national referral
        cohort. PARTIAL because a diagnostic yield within a DCM cohort is not a population prevalence
        for CMD1A.
