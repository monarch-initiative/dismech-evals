        context: []
      assertion_type: Pathophysiology
      assertion:
        name: LMNA Variant and Nuclear Lamina Assembly Defect
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        genetic_context:
          gene:
            preferred_term: LMNA
            term:
              id: hgnc:6636
              label: LMNA
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          description: Applies to the missense alleles, which are modelled as co-assembling into and destabilising
            the lamina. Non-missense alleles are equally represented in CMD1A and behave differently in
            the clinic, with earlier conduction disease and higher arrhythmic risk; for those, haploinsufficiency
            through nonsense-mediated decay is the competing mechanism, and this entry does not claim
            a single functional mechanism across the whole allelic spectrum.
        description: A heterozygous pathogenic LMNA variant is the initiating lesion. LMNA encodes lamin
          A and lamin C by alternative splicing; both assemble into the nuclear lamina, a filamentous
          meshwork on the nucleoplasmic face of the inner nuclear membrane. Disease-associated variants
          are distributed across the gene with no single hotspot and include missense changes concentrated
          in the central alpha-helical rod domain as well as nonsense, frameshift and splice-affecting
          alleles. Missense alleles are thought to act largely by incorporating into and destabilising
          the meshwork (a dominant-negative effect), consistent with the reduced or absent nuclear lamin
          A/C immunostaining and the aberrant degradation product seen in patient myocardium; non-missense
          alleles behave differently in the clinic, conferring earlier conduction disease and higher arrhythmic
          risk.
        genes:
        - preferred_term: LMNA
          term:
            id: hgnc:6636
            label: LMNA
        cellular_components:
        - preferred_term: Nuclear lamina
          term:
            id: GO:0005652
            label: nuclear lamina
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: Myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        biological_processes:
        - preferred_term: Nuclear envelope organization
          term:
            id: GO:0006998
            label: nuclear envelope organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: 'Five novel missense mutations were identified: four in the alpha-helical-rod domain
          of the lamin A/C gene, and one in the lamin C tail domain.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10580070
      reference_title: Missense mutations in the rod domain of the lamin A/C gene as causes of dilated
        cardiomyopathy and conduction-system disease.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding CMD1A observation, establishing LMNA rod-domain missense variants as the
        causal lesion in autosomal dominant DCM with conduction-system disease.
