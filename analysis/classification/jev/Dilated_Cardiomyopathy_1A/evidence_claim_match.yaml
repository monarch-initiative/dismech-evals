              label: dilated cardiomyopathy 1A
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Lmna H222P knock-in mouse
        species: Mouse
        genotype: Lmna p.H222P homozygous knock-in
        publication: PMID:15548545
        description: Knock-in of a human LMNA missense allele originally found in an autosomal dominant
          Emery-Dreifuss family. Homozygotes develop chamber dilation, hypokinesia and conduction defects
          with muscle degeneration, fibrosis, dislocated heterochromatin and Smad activation, and it is
          the model in which the MAPK and AKT-mTOR signalling arms of this disease were established.
        modeled_mechanisms:
        - target: Cardiac Conduction System Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the combined conduction-defect-plus-dilation cardiac phenotype that
            defines the human disease.
          limitations: The cardiac phenotype requires homozygosity, whereas human CMD1A is a heterozygous
            dominant disease, and H222P was ascertained in an Emery-Dreifuss family rather than a cardiomyopathy-predominant
            one.
          readouts:
          - name: Cardiac chamber dimension and conduction
            target: Cardiac Conduction System Degeneration
            direction: ALTERED
            interpretation: Chamber dilation with hypokinesia and conduction defects in the intact animal.
        - target: MAPK Cascade Activation
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The model in which MAPK activation was shown to precede cardiomyopathy and in which
            AKT-mTOR hyperactivation with defective autophagy was identified and pharmacologically reversed.
          limitations: 'The therapeutic corollary did not translate: a p38 MAPK inhibitor developed on
            the strength of this signalling biology failed for futility in phase 3, so the model''s predictive
            validity for human treatment response is unestablished.'
          readouts:
          - name: Cardiac MAPK pathway activation
            target: MAPK Cascade Activation
