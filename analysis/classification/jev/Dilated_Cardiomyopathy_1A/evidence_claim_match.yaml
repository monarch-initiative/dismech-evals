            term:
              id: MONDO:0007269
              label: dilated cardiomyopathy 1A
        context: []
      assertion_type: Treatment
      assertion:
        name: Guideline-Directed Heart Failure Pharmacotherapy
        description: Standard heart failure therapy - ACE inhibitors or angiotensin receptor blockers,
          beta blockers, mineralocorticoid receptor antagonists, and contemporary additions such as sacubitril/valsartan
          and SGLT2 inhibitors - is applied as in other dilated cardiomyopathies. There is no LMNA-specific
          medical regimen, and the natural history data suggest medical therapy alone is insufficient
          in this genotype.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: beta-adrenergic antagonist
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
          - preferred_term: ACE inhibitor
            term:
              id: NCIT:C247
              label: ACE Inhibitor
          - preferred_term: SGLT2 inhibitor
            term:
              id: NCIT:C98083
              label: SGLT2 Inhibitor
          - preferred_term: sacubitril
            term:
              id: NCIT:C152281
              label: Sacubitril
        notes: 'Rate-slowing agents (beta blockers, non-dihydropyridine calcium channel blockers) must
          be used with awareness of the underlying conduction disease; device backup is often already
          in place in this population for the independent sudden-death indication.

          No pathophysiology node conforms to `cardiomyopathy_maladaptive_remodeling#Neurohormonal Activation`,
          which is the module node these drugs actually act on. That is deliberate: no source in this
          entry evidences renin-angiotensin-aldosterone or sympathetic activation specifically in LMNA
          carriers, as distinct from dilated cardiomyopathy in general, so the amplifier node is left
          unclaimed rather than asserted by analogy. This link therefore attaches to the contractile-dysfunction
          node it is intended to slow.'
      selected_evidence:
        snippet: Treatment of symptomatic DCM, including heart failure, is pharmacologic with ACE inhibitors,
          beta blockers, and other conventional approaches.
        supports: SUPPORT
