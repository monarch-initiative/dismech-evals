        context: []
      assertion_type: Prevalence
      assertion:
        population: Norwegian familial dilated cardiomyopathy probands
        measure_type: UNKNOWN
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No population-based prevalence estimate exists for the LMNA-specific form of dilated cardiomyopathy.
          The available figures are the share of dilated cardiomyopathy cohorts carrying an LMNA variant,
          which is a diagnostic yield rather than a population rate: 6.2% of unrelated familial DCM probands
          in Norway, and 8% of nuclear families in the US Familial Cardiomyopathy Registry. The yield
          rises sharply when atrioventricular block accompanies the cardiomyopathy.'
      selected_evidence:
        snippet: Of 561 unrelated familial DCM probands, 35 (6.2%) had an LMNA mutation.
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/0
