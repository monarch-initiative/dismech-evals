      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: CMD1A is transmitted as an autosomal dominant trait. Affected individuals are heterozygous
          for a pathogenic LMNA variant and each child has a 50% chance of inheriting it. Penetrance is
          age-dependent - young carriers may be entirely normal - but becomes high by mid-adulthood, and
          expressivity is variable both between and within families.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: LMNA-related DCM is inherited in an autosomal dominant manner.
        supports: SUPPORT
