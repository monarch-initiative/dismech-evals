            id: GO:0016236
            label: macroautophagy
          modifier: DECREASED
      selected_evidence:
        snippet: We also show defective autophagy in hearts of these mice and demonstrate that improvement
          in heart function induced by pharmacological interventions is correlated with enhanced autophagy.
        supports: SUPPORT
