      reference_title: 'Lamin AC Cardiomyopathy, the Next Masquerader: Laminopathy Mimicking Cardiac Sarcoidosis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the recommendation to resolve the differential genetically rather than by
        imaging, which is the practical consequence of the overlap.
