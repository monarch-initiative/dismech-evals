      assertion:
        name: LOXL2 Inhibition (Simtuzumab)
        description: A preclinical, not clinical, candidate. LOXL2 is upregulated in LMNA-mutant human
          iPSC cardiomyocytes, engineered heart tissue and mice, and the LOXL2 antibody simtuzumab prevented
          cardiac dysfunction and fibrosis in the mouse model. There is no human trial in this disease,
          so this is recorded as a mechanism-derived candidate targeting the fibrotic arm rather than
          as therapy.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: 'Preclinical only. No clinical trial of LOXL2 inhibition in LMNA-related dilated cardiomyopathy
          has been reported; simtuzumab failed in other fibrotic indications, so translation should not
          be assumed.

          `therapeutic_agent` is deliberately empty despite the agent being named. NCIT:C91735 (Simtuzumab)
          exists but is not reachable from the ChemicalEntityTerm dynamic-enum roots, so binding it fails
          term validation; CHEBI has no simtuzumab entry either. Leaving the slot unbound is preferred
          to forcing a less accurate agent term.'
      selected_evidence:
        snippet: Transcriptomic analysis revealed dysregulation of extracellular matrix remodeling and
          significant upregulation of Loxl2 in mutated hiPSC-cardiomyocytes, hiPSC-engineered heart tissues,
          and mice.
        supports: SUPPORT
