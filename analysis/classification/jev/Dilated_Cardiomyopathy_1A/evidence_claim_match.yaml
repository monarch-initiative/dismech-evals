        description: 'Mutant A-type lamins activate the ERK1/2, JNK and p38 MAPK branches in the heart.
          The timing is what makes this node upstream rather than reactive: activation is detectable in
          H222P knock-in mouse hearts before any clinical sign or molecular marker of cardiomyopathy,
          and expressing mutant lamin A in cultured cells is sufficient to reproduce it. The p38 branch
          was the explicit rationale for the ARRY-371797 clinical programme, which failed at phase 3 -
          so this node records a well-evidenced cascade whose causal weight in human disease is unsettled.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
