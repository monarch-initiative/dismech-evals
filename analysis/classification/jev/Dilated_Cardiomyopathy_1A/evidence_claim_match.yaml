              label: dilated cardiomyopathy 1A
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lmna_dcm_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        prompt: Do the two workhorse model systems for this disease - homozygous mutant or null mice and
          iPSC-derived cardiomyocytes - reproduce the human heterozygous, adult-onset, mechanically loaded
          disease faithfully enough for their mechanistic conclusions to transfer?
        attaches_to:
        - pathophysiology#Cardiomyocyte Nuclear Envelope Fragility and Rupture
        rationale: 'Human CMD1A is a heterozygous dominant disease of adult, chronically loaded myocardium.
          The mouse models that generated most of the mechanism are homozygous - either null or knock-in
          - and develop disease over months rather than decades; the null in particular models absence
          of lamin A/C rather than the dominant-negative action of a mutant protein that human myocardial
          western blots suggest. iPSC cardiomyocytes are genotypically faithful and support isogenic comparison,
          but are developmentally immature and are not subjected to the sustained mechanical load that
          the mechanical-fragility model says is the proximate cause of nuclear failure - so the arm they
          are least able to test is the one with the strongest human ultrastructural support. The clinical
          consequence is not hypothetical: the one mechanism taken from these models into a phase 3 trial
          did not translate.'
        proposed_experiments:
        - experiment_id: lmna_dcm_heterozygous_knockin_load
          name: Heterozygous knock-in under physiological load
          description: Characterise heterozygous knock-in mice carrying a recurrent human CMD1A allele,
            with and without imposed haemodynamic load, and compare nuclear rupture frequency and signalling
            activation against homozygous animals and against human myocardial samples.
        - experiment_id: lmna_dcm_engineered_heart_tissue
          name: Maturation-matched engineered heart tissue
          description: Study patient and isogenic-control iPSC cardiomyocytes in maturation-promoting
            engineered heart tissue under chronic auxotonic load, testing whether nuclear rupture emerges
            once the mechanical environment is restored.
      selected_evidence:
        snippet: Western blot protein analyses of three hearts with different mutations showed an additional
          30-kDa band, suggesting a degrading effect of mutated on wild-type protein.
        supports: SUPPORT
