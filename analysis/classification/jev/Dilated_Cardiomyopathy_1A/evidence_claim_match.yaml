        context: []
      assertion_type: Environmental
      assertion:
        name: Intense or competitive exercise
        description: 'Mechanical loading is the one modifiable input that the pathophysiology of this
          disease predicts should matter: nuclear damage in lamin A/C-deficient cardiomyocytes is generated
          by contraction-transmitted microtubule forces, so sustained high-intensity exertion is expected
          to accelerate it. Sports guidance treats lamin A/C as one of the specific genes for which permissive,
          surveillance-contingent recommendations do not apply, extending restriction even to genotype-positive,
          phenotype-negative carriers. The recommendation is precautionary and mechanism-derived; it has
          not been tested prospectively.'
        exposure_term:
          preferred_term: exposure to strenuous exercise
          term:
            id: ECTO:6000031
            label: exposure to strenuous exercise
        notes: No prospective trial has tested whether activity restriction alters progression in LMNA
          carriers; the openscientist deep-research run flagged this as an explicit evidence gap.
      selected_evidence:
        snippet: The recommendations to engage in intensive exercise and competitive sports are usually
          contingent on annual clinical surveillance, except for pathogenic variants in specific genes,
          such as lamin A/C or plakophilin-2.
        supports: SUPPORT
    origin:
