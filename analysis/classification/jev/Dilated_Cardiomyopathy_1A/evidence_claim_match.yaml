        biological_scale: CELLULAR
        role: effector
        description: A second, mechanistically distinct route from the lamina defect to arrhythmia, established
          in patient-derived iPSC cardiomyocytes. Mutant lamin A/C accelerates degradation of its interaction
          partner SIRT1, producing mitochondrial dysfunction and oxidative stress; the resulting reactive
          oxygen species activate the CaMKII-RYR2 axis and aggravate SUN1 accumulation, feeding both the
          calcium-handling and the nuclear-deformation phenotypes. Independent work on the H222P allele
          finds a converging mitochondrial lesion - reduced mitochondrial calcium uniporter expression
          with impaired mitochondrial calcium uptake - in a human cardiac organoid model.
        cell_types:
