              filaments detached from the nuclear surface.
      selected_evidence:
        snippet: We report that lamin A/C-deficient (Lmna(-/-)) mice develop rapidly progressive dilated
          cardiomyopathy (DCM) characterized by left ventricular (LV) dilation and reduced systolic contraction.
