      assertion_type: Pathophysiology
      assertion:
        name: DNA Damage Response and TP53 Pathway Activation
        biological_scale: CELLULAR
        role: effector
        description: Mutant lamin A/C expression in cardiomyocytes activates an E2F-DNA damage response-TP53
          axis. In a mouse model expressing a DCM-associated LMNA D300N protein in cardiac myocytes this
          axis is engaged alongside NF-kB and TGF-beta signalling, and the same DNA damage response/TP53
          signature is present in RNA sequencing of human hearts with LMNA-associated DCM - a rare instance
          where a model-derived mechanism was confirmed in the target human tissue. Conditional deletion
          of Tp53 in cardiac myocytes partially rescues fibrosis, apoptosis and ventricular dysfunction,
          establishing the pathway as pathogenic rather than a bystander.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: DNA damage response
          term:
            id: GO:0006974
            label: DNA damage response
          modifier: INCREASED
        - preferred_term: Signal transduction by p53 class mediator
          term:
            id: GO:0072331
            label: signal transduction by p53 class mediator
          modifier: INCREASED
      selected_evidence:
        snippet: Deletion of Tp53 partially rescued myocardial fibrosis, apoptosis, proliferation of nonmyocyte
          cells, left ventricular dilatation and dysfunction, and slightly improved survival.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/1
