          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          description: Applies to the missense alleles, which are modelled as co-assembling into and destabilising
            the lamina. Non-missense alleles are equally represented in CMD1A and behave differently in
            the clinic, with earlier conduction disease and higher arrhythmic risk; for those, haploinsufficiency
            through nonsense-mediated decay is the competing mechanism, and this entry does not claim
            a single functional mechanism across the whole allelic spectrum.
        description: A heterozygous pathogenic LMNA variant is the initiating lesion. LMNA encodes lamin
          A and lamin C by alternative splicing; both assemble into the nuclear lamina, a filamentous
          meshwork on the nucleoplasmic face of the inner nuclear membrane. Disease-associated variants
          are distributed across the gene with no single hotspot and include missense changes concentrated
          in the central alpha-helical rod domain as well as nonsense, frameshift and splice-affecting
          alleles. Missense alleles are thought to act largely by incorporating into and destabilising
          the meshwork (a dominant-negative effect), consistent with the reduced or absent nuclear lamin
          A/C immunostaining and the aberrant degradation product seen in patient myocardium; non-missense
          alleles behave differently in the clinic, conferring earlier conduction disease and higher arrhythmic
          risk.
