      assertion_type: Pathophysiology
      assertion:
        name: Cardiomyocyte Nuclear Envelope Fragility and Rupture
        biological_scale: CELLULAR
        role: effector
        description: A lamina built from mutant subunits cannot bear the mechanical load imposed on a
          cardiomyocyte nucleus by repetitive contraction. Patient myocardium shows focal disruptions
          of the nuclear membrane, bleb formation and clustered nuclear pores; lamin A/C-null mouse cardiomyocytes
          show grossly abnormal nuclear shape and size with displaced and fragmented heterochromatin,
          and the desmin intermediate filament network detaches from the nuclear surface, so force is
          no longer transmitted between nucleoskeleton and cytoskeleton. Deleting Lmna in adult cardiomyocytes
          reproduces the nuclear abnormalities and adds perinuclear Golgi dilation and fragmentation with
          CREB3-mediated stress signalling before any fall in cardiac function.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        cellular_components:
        - preferred_term: Nuclear envelope
          term:
            id: GO:0005635
            label: nuclear envelope
          modifier: ABNORMAL
        locations:
        - preferred_term: Myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        biological_processes:
        - preferred_term: Nuclear envelope organization
          term:
            id: GO:0006998
            label: nuclear envelope organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: The LMNA mutation exhibiting the most severe nuclear deformities, R249Q, additionally
          caused reduced nuclear stiffness and increased nuclear fragility.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/4
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37585285
      reference_title: Nuclear damage in LMNA mutant iPSC-derived cardiomyocytes is associated with impaired
        lamin localization to the nuclear envelope.
      evidence_source: IN_VITRO
      explanation: The direct mechanical measurement behind the word "fragility" in this node's name,
        made in human patient-derived cardiomyocytes rather than inferred from mouse morphology.
