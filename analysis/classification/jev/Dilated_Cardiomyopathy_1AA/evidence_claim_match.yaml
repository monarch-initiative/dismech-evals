        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: actn2_mouse_heterozygote_model_mismatch
        prompt: Why does a heterozygous Actn2 missense knock-in mouse remain phenotypically normal while
          heterozygous human carriers of comparable ACTN2 missense variants develop cardiomyopathy, and
          can such mice be used to model dominant ACTN2 disease at all?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Mutant Alpha-Actinin-2 Destabilization and Proteostatic Stress
        - pathophysiology#Sarcomeric Disarray and Cardiomyocyte Hypertrophy
        rationale: The only published Actn2 missense knock-in mouse shows no overt cardiac phenotype in
          heterozygotes (only molecular changes, and only in mature males), while homozygosity is embryonically
          lethal — a dosage profile that does not reproduce autosomal dominant human ACTN2 cardiomyopathy.
          Mechanistic inferences drawn from that model (proteasomal activation, mitochondrial and cell-cycle
          defects) therefore rest on either subclinical heterozygote molecular readouts or a lethal homozygous
          state with no human counterpart, and their translational weight for the human dilated phenotype
          is uncertain.
        proposed_experiments:
        - experiment_id: exp_actn2_mouse_stress_and_aging_challenge
          name: Stress- and age-challenged Actn2 heterozygote phenotyping with human comparison
          description: Phenotype Actn2 missense heterozygous mice under hemodynamic, exercise, and aging
            challenge with sex stratification, and compare the resulting molecular signatures against
            human ACTN2-variant myocardium and hiPSC-cardiomyocytes, to determine whether the silent heterozygote
            reflects a genuine species difference or an unstressed baseline.
      selected_evidence:
        snippet: Heterozygous Actn2 p.Met228Thr mice have no overt phenotype. Only mature males show molecular
          parameters indicative of cardiomyopathy.
        supports: SUPPORT
