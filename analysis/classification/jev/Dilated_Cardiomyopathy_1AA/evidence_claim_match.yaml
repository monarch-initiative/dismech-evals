        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: actn2_zdisc_force_transmission_model
        hypothesis_label: Z-disc force-transmission and myofilament-regulation model
        status: CANONICAL
        description: 'The canonical model holds that ACTN2 variants degrade the mechanical and regulatory
          function of the Z-disc: cross-linking of antiparallel actin filaments and anchoring of Z-disc
          titin are perturbed, altering both thin-filament calcium sensitivity and thick-filament activation,
          so force generation and relaxation become abnormal and the myocardium remodels.'
      selected_evidence:
        snippet: Our results can be explained by two Z-disc mediated communication pathways
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37834023
      reference_title: 'Disruption of Z-Disc Function Promotes Mechanical Dysfunction in Human Myocardium:
        Evidence for a Dual Myofilament Modulatory Role by Alpha-Actinin 2.'
      evidence_source: IN_VITRO
      explanation: The study of explanted human myocardium carrying an ACTN2 variant states the two-pathway
        (actin/thin-filament and titin/thick-filament) Z-disc communication model that underlies this
        hypothesis group. The quote stops before the clause naming the two pathways because the source
        text spells them with a Greek alpha; the quantitative findings are quoted on the corresponding
        pathophysiology node.
