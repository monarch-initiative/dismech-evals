          term:
            id: GO:0006874
            label: intracellular calcium ion homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: In heterozygous indel cells, the truncated protein incorporates into cardiac sarcomeres,
          leading to aberrant Z-disc ultrastructure.
        supports: SUPPORT
