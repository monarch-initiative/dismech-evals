      assertion_type: Pathophysiology
      assertion:
        name: Mutant Alpha-Actinin-2 Destabilization and Proteostatic Stress
        biological_scale: CELLULAR
        role: amplifier
        description: For a subset of variants, mutant alpha-actinin-2 is destabilized, misfolds, and aggregates
          within the cardiomyocyte. In isogenic hiPSC-cardiomyocyte models the mutant allele produces
          protein aggregation, multinucleation, hypertrophy, and myofibrillar disarray with activation
          of both the ubiquitin-proteasome system and the autophagy-lysosome pathway, loss of sarcomere-associated
          proteins, and reduced force in engineered heart tissue; an Actn2 missense knock-in mouse independently
          shows a destabilized protein with increased ubiquitin-proteasome activity. This proteopathy
          arm is variant-specific and has not been demonstrated in patient myocardium.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Inclusion body assembly
          term:
            id: GO:0070841
            label: inclusion body assembly
          modifier: INCREASED
        - preferred_term: Proteasome-mediated ubiquitin-dependent protein catabolic process
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: INCREASED
        - preferred_term: Autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: INCREASED
      selected_evidence:
        snippet: This study showed that ACTN2mut presents a higher percentage of multinucleation, protein
          aggregation, hypertrophy, myofibrillar disarray, and activation of both the ubiquitin-proteasome
          system and the autophagy-lysosomal pathway as compared to ACTN2wt in 2D-cultured hiPSC-CMs.
        supports: SUPPORT
