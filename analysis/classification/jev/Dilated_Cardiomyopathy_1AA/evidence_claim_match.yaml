        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: actn2_lumping_vs_mondo_splitting
        prompt: Should dismech keep phenotype-specific ACTN2 entities (CMD1AA, CMH23, restrictive and
          arrhythmogenic forms, ACTN2 myopathy) as separate entries, or follow ClinGen in lumping them
          into a single ACTN2-related cardiac and skeletal myopathy entity?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Alpha-Actinin-2 Z-Disc Dysfunction
        rationale: ClinGen's Hereditary Cardiovascular Disease GCEP explicitly applied the Lumping and
          Splitting framework and concluded there is insufficient evidence to split ACTN2 presentations
          by inheritance, phenotype, or mechanism, whereas MONDO retains the phenotype-specific nodes
          that dismech uses as disease_term. This entry is scoped to the dilated node (MONDO:0012808)
          and records the hypertrophic and noncompaction expressions as spectrum context; if the field
          converges on the lumped entity, the dismech representation should be revisited rather than duplicated
          across sibling entries.
      selected_evidence:
        snippet: Previously reported variants are in varying locations across the gene, but the potential
          clustering effect of pathogenic locations is not clearly understood.
        supports: SUPPORT
