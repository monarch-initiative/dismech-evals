        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiomyopathy Multigene Panel Sequencing with Copy-Number Analysis
        description: 'The confirmatory test is molecular: a clinically curated cardiomyopathy panel that
          includes ACTN2, interpreted against the caveat that many reported ACTN2 missense variants lack
          segregation or functional support. Copy-number analysis matters specifically here — two of the
          informative ACTN2 genotypes are structural rather than single-nucleotide (a heterozygous multi-exon
          deletion, and the 1q43 deletion removing ACTN2 with RYR2) — so a sequencing-only panel without
          CNV calling can return a false negative. Exome or genome sequencing is a useful adjunct when
          a family''s presentations do not fit one cardiomyopathy label.'
        diagnosis_term:
          preferred_term: cardiomyopathy multigene panel sequencing with copy-number analysis
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: However, limited segregation and functional data are available to support the pathogenicity
          of most previously reported missense variants and clear-cut genotype-phenotype correlations
          are currently only demonstrated for some ACTN2-related myopathies.
        supports: SUPPORT
