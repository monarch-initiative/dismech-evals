      assertion_type: Diagnosis
      assertion:
        name: Electrocardiography and Ambulatory Rhythm Monitoring
        description: 'Resting ECG plus ambulatory (Holter or extended) rhythm monitoring is disproportionately
          important in this disorder because the arrhythmic arm can precede or occur without ventricular
          dilation: conduction disease, atrial fibrillation or flutter, ventricular ectopy, and idiopathic
          ventricular fibrillation are all part of the ACTN2 spectrum. In population data on DCM gene
          carriers, arrhythmia or conduction disease is the commonest early expression, which makes rhythm
          assessment the highest-yield test in an otherwise phenotype-negative carrier.'
        diagnosis_term:
          preferred_term: electrocardiography and ambulatory rhythm monitoring
          term:
            id: NCIT:C38053
            label: Electrocardiography
      selected_evidence:
        snippet: Arrhythmias or conduction disease (15.2%) were the most common early DCM features
        supports: SUPPORT
