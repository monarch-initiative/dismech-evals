      assertion_type: Pathophysiology
      assertion:
        name: Impaired Z-Disc Force Transmission and Myofilament Regulation
        biological_scale: CELLULAR
        role: amplifier
        description: Because the Z-disc both transmits force between sarcomeres and relays regulatory
          information to the thin and thick filaments, an abnormal alpha-actinin-2 degrades contraction
          and relaxation simultaneously. Explanted myocardium carrying an ACTN2 EF-hand variant shows
          increased myofilament calcium sensitivity, reduced sinusoidal stiffness, faster tension redevelopment,
          and increased thick-to-thin filament separation, while patient-derived iPSC-cardiomyocytes show
          impaired contractility and aberrant calcium handling. Truncated alpha-actinin-2 that is still
          incorporated into the sarcomere distorts Z-disc ultrastructure, a dominant-negative pattern.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
