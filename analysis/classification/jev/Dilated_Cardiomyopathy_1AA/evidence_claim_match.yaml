      assertion:
        name: Loss of Sarcolemmal Partner Coupling and Arrhythmogenesis
        biological_scale: CELLULAR
        role: amplifier
        description: Beyond the sarcomere, the C-terminus of alpha-actinin-2 interacts with sarcolemma-associated
          proteins including alpha-actinin-1 (ACTN1) and connexin-43 (GJA1). C-terminal truncation disrupts
          these interactions, providing a mechanistic route from a Z-disc protein defect to impaired electrical
          coupling, arrhythmia, and abnormal relaxation. Clinically, ACTN2 carriers show atrial and ventricular
          arrhythmias, conduction abnormalities, and idiopathic ventricular fibrillation, which can precede
          or occur without overt ventricular dilation.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Cell communication by electrical coupling involved in cardiac conduction
          term:
            id: GO:0086064
            label: cell communication by electrical coupling involved in cardiac conduction
          modifier: ABNORMAL
      selected_evidence:
        snippet: Loss of the C-terminus of ACTN2 disrupts interaction with ACTN1 (alpha-actinin 1) and
          GJA1 (gap junction protein alpha 1), 2 sarcolemma-associated proteins, which may contribute
          to the clinical arrhythmic and relaxation defects.
        supports: SUPPORT
