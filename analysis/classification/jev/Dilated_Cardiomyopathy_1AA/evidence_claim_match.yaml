          would leave the recessive inheritance block without its clinical counterpart. The p.Gln860Ter
          patient''s detailed restrictive physiology is reported in the body of PMID:34802252 rather than
          its abstract, so the quotable evidence here is the ClinGen curation and the restrictive-cohort
          study.'
