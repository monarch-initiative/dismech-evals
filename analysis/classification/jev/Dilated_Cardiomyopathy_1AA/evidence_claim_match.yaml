      assertion_type: Phenotype
      assertion:
        category: Cardiovascular
        name: Myocardial Fibrosis
        description: Interstitial myocardial fibrosis accompanies the remodeling myocardium and is detectable
          in vivo as late gadolinium enhancement on cardiac MRI. In nonischemic dilated cardiomyopathy
          generally, LGE presence and extent — not ejection fraction — carry the dominant prognostic signal
          for mortality and arrhythmic events, which is why fibrosis imaging is part of the workup for
          an ACTN2 carrier rather than a purely descriptive finding.
        phenotype_term:
          preferred_term: Myocardial fibrosis
          term:
            id: HP:0001685
            label: Myocardial fibrosis
        notes: The prognostic evidence is DCM-wide rather than ACTN2-specific; no ACTN2 cohort has reported
          LGE burden. Severe interstitial fibrosis in explanted ACTN2 p.Gln860Ter myocardium is described
          in the body (not the abstract) of PMID:34802252 and is therefore not quotable here.
      selected_evidence:
        snippet: The presence and extent of LGE were associated with various adverse clinical outcomes,
          whereas LVEF was not significantly associated with mortality and arrhythmic end points in NIDCM.
        supports: SUPPORT
