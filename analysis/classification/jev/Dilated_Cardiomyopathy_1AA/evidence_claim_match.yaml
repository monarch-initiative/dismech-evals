        conforms_to: cardiomyopathy_maladaptive_remodeling#Neurohormonal Activation
        biological_scale: ORGANISM
        role: amplifier
        description: As in other cardiomyopathies, the fall in contractile performance activates the renin-angiotensin-aldosterone
          and sympathetic systems. Initially compensatory, chronic activation drives cardiomyocyte hypertrophy,
          apoptosis, and fibrosis, converting the primary Z-disc lesion into progressive structural remodeling;
          this axis is what standard heart-failure pharmacotherapy targets in ACTN2 disease as in DCM
          generally.
        biological_processes:
        - preferred_term: Response to angiotensin
          term:
            id: GO:1990776
            label: response to angiotensin
          modifier: INCREASED
      selected_evidence:
        snippet: The systemic as well as the tissue RAAS are also dedicated to promote tissue remodeling,
          particularly relevant after damage, when chronic activation may configure as a maladaptive response,
          leading to fibrosis, hypertrophy and apoptosis, and organ dysfunction.
        supports: SUPPORT
