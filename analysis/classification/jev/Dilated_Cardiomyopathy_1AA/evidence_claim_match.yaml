  e09d22569002c2fa7169a28c50bac23c1deaf642d3acd9073cf76f0d07d8da3b:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1AA
          disease_term:
            preferred_term: dilated cardiomyopathy 1AA
            term:
              id: MONDO:0012808
              label: dilated cardiomyopathy 1AA
        context: []
      assertion_type: Genetic
      assertion:
        name: ACTN2 Pathogenic Variants
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: ACTN2
          term:
            id: hgnc:164
            label: ACTN2
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        features: 'Reported ACTN2 variants are distributed across the gene rather than clustered in one
          domain: missense changes in the N-terminal actin-binding calponin-homology domains (Q9R, G111V,
          A119T), the spectrin-repeat rod (T495M, E583A, E628G), and the C-terminal EF-hand/calmodulin-like
          region (A868T), plus protein-truncating and splice variants. Heterozygous truncated protein
          can still be incorporated into the sarcomere (dominant-negative), while rare biallelic stop-gain
          genotypes act through a distinct, recessive mechanism; haploinsufficiency is not an established
          mechanism. Segregation and functional data are limited for many reported missense variants,
          so variant interpretation in this gene requires caution.'
        variants:
        - name: ACTN2 Q9R
          description: Missense variant in the N-terminal region identified in a patient with dilated
            cardiomyopathy; abolishes the alpha-actinin-2 interaction with muscle LIM protein in cell-based
            assays. The founding CMD1AA variant.
          gene:
            preferred_term: ACTN2
            term:
              id: hgnc:164
              label: ACTN2
        - name: ACTN2 Ala119Thr
          description: Actin-binding-domain missense variant segregating with a strikingly heterogeneous
            cardiac phenotype (left ventricular noncompaction, dilated cardiomyopathy, idiopathic ventricular
            fibrillation, sudden unexplained death) in two families sharing a common ancestral haplotype;
            also reported in hypertrophic cardiomyopathy, and shown to perturb Z-disc localization and
            dynamics in cardiomyocytes.
          gene:
            preferred_term: ACTN2
            term:
              id: hgnc:164
              label: ACTN2
        - name: ACTN2 A868T
          description: Variant in the EF 3-4 region that interacts with titin, studied in explanted myocardium
            from a heart-failure patient; associated with increased myofilament calcium sensitivity and
            reduced sinusoidal stiffness.
          gene:
            preferred_term: ACTN2
            term:
              id: hgnc:164
              label: ACTN2
      selected_evidence:
        snippet: In summary, there is definitive evidence to support the relationship between ACTN2 and
          ACTN2-related cardiac and skeletal myopathy.
        supports: SUPPORT
    origin:
