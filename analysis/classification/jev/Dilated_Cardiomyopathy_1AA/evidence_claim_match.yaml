        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Alpha-Actinin-2 Z-Disc Dysfunction
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        description: ACTN2 encodes alpha-actinin-2, the only alpha-actinin isoform expressed in cardiac
          muscle. As an antiparallel homodimer it cross-links thin filaments from adjacent sarcomeres
          at the Z-disc, anchors the N-terminal (Z-disc) region of titin, and provides a docking platform
          for Z-disc partners including muscle LIM protein (MLP/CSRP3). Disease-associated variants are
          distributed across the actin-binding calponin-homology domains, the spectrin-repeat rod, and
          the C-terminal EF-hand/calmodulin-like region; they perturb actin binding, titin interaction,
          Z-disc incorporation, protein stability, or partner binding rather than abolishing the protein,
          and haploinsufficiency is not an established mechanism.
        genes:
        - preferred_term: ACTN2
          term:
            id: hgnc:164
            label: ACTN2
        molecular_functions:
        - preferred_term: actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: ABNORMAL
        - preferred_term: structural constituent of muscle
          term:
            id: GO:0008307
            label: structural constituent of muscle
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: Myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        biological_processes:
        - preferred_term: Sarcomere organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: ACTN2 encodes alpha-actinin-2, a protein expressed in human cardiac and skeletal muscle.
          The protein, located in the sarcomere Z-disk, functions as a link between the anti-parallel
          actin filaments. This important structural protein also binds N-terminal titins, and thus contributes
          to sarcomere stability.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36116040
      reference_title: Mutation update for the ACTN2 gene.
      evidence_source: OTHER
      explanation: Establishes the normal Z-disc function of alpha-actinin-2 (actin cross-linking and
        titin anchoring) whose perturbation is the primary lesion of this disorder. Evidence source is
        OTHER because this is a mutation-update review.
