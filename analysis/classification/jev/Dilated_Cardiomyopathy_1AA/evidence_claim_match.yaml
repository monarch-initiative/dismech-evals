      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: actn2_variant_specific_proteotoxicity
        hypothesis_label: Variant-specific alpha-actinin-2 destabilization and proteostatic stress
        status: EMERGING
        description: An additional, variant-specific arm proposes that some mutant alpha-actinin-2 proteins
          are destabilized, misfold, and aggregate, triggering ubiquitin-proteasome and autophagy-lysosome
          activation and depleting sarcomere-associated proteins — a proteopathy superimposed on the mechanical
          defect. Human isogenic hiPSC-cardiomyocytes and an Actn2 knock-in mouse both show proteasomal
          activation, but whether this arm operates in the dilated (as opposed to hypertrophic or myopathic)
          presentations, and in patient myocardium rather than engineered tissue, is unresolved; ClinGen
          notes that the ACTN2 disease mechanism remains unclear and may be variant-specific.
      selected_evidence:
        snippet: The disease mechanism is currently unclear and may be variant-specific since some variants
          have been shown to result in protein aggregation while others do not have this effect
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
      - /name
      - /disease_term
