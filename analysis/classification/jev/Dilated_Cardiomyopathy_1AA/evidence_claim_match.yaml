      assertion_type: Discussion
      assertion:
        discussion_id: actn2_dcm_mechanism_gap
        prompt: Which molecular mechanism — dominant-negative incorporation of mutant alpha-actinin-2
          into the Z-disc, altered myofilament calcium sensitivity, protein destabilization with proteostatic
          stress, or loss of sarcolemmal ACTN1/GJA1 coupling — actually drives the dilated (as opposed
          to hypertrophic or arrhythmic) presentation, and what determines which phenotype a given carrier
          develops?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Z-Disc Force Transmission and Myofilament Regulation
        - pathophysiology#Mutant Alpha-Actinin-2 Destabilization and Proteostatic Stress
        rationale: The same ACTN2 variant can produce dilation in one relative and hypertrophy, noncompaction,
          arrhythmia, or nothing in another, and the available mechanistic studies each characterize a
          different single variant in a different system (explanted myocardium, patient iPSC-cardiomyocytes,
          isogenic hiPSC lines, knock-in mouse, purified protein). Without a variant-to-mechanism map
          the pathograph cannot state which arm is rate-limiting for the dilated phenotype, and variant
          interpretation stays unanchored to mechanism.
        proposed_experiments:
        - experiment_id: exp_actn2_allelic_panel_isogenic_hipsc_cm
          name: Allelic-panel isogenic hiPSC-cardiomyocyte comparison of ACTN2 variants
          description: Systematically phenotype an allelic panel of dilated-, hypertrophic-, and noncompaction-associated
            ACTN2 variants in isogenic hiPSC-cardiomyocytes and engineered heart tissue with matched readouts
            (Z-disc incorporation, protein stability and aggregation, myofilament calcium sensitivity,
            connexin-43 localization, force), so that phenotype-specific mechanisms can be compared directly
            rather than inferred across heterogeneous studies.
      selected_evidence:
        snippet: The disease mechanism is currently unclear and may be variant-specific since some variants
          have been shown to result in protein aggregation while others do not have this effect
        supports: SUPPORT
