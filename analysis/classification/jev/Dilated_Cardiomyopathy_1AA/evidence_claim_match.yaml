        biological_scale: TISSUE
        role: effector
        description: A subset of ACTN2 carriers show left ventricular noncompaction — prominent trabeculae
          with deep intertrabecular recesses over a thin compacted layer — either isolated or together
          with ventricular dilation, which is why the OMIM entity is designated "with or without LVNC".
          In a large rare-variant association analysis, ACTN2 truncating variants were among the few lesions
          associated specifically with noncompaction rather than shared with DCM/HCM, suggesting a partly
          distinct developmental route, plausibly through impaired cardiomyocyte maturation.
        locations:
        - preferred_term: Heart left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
      selected_evidence:
        snippet: In contrast, truncating variants in MYH7, ACTN2, and PRDM16 were uniquely associated
          with LVNC and may reflect a distinct LVNC etiology.
        supports: SUPPORT
