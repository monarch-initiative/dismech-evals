      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ischemic and other acquired dilated cardiomyopathy
        description: Coronary artery disease, hypertension, valvular disease, tachyarrhythmia, alcohol
          and other cardiotoxins, and endocrine or autoimmune disease all produce a dilated, hypocontractile
          ventricle and must be excluded before a genetic diagnosis is made.
        distinguishing_features:
        - Regional (coronary-territory) wall-motion abnormality, ischemic LGE pattern, or obstructive
          disease on angiography favors ischemic cardiomyopathy.
        - Absent family history plus an identified exposure or loading condition, with recovery after
          its removal, favors an acquired cause.
      selected_evidence:
        snippet: Nongenetic forms of DCM can result from different aetiologies, including inflammation
          of the myocardium due to an infection (mostly viral); exposure to drugs, toxins or allergens;
          and systemic endocrine or autoimmune diseases.
        supports: SUPPORT
