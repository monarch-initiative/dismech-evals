      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: No prevalence estimate exists for CMD1B. The locus rests on a single six-generation kindred
          plus two further families reported in one 1995 linkage study, and because no causal gene was
          ever identified there is no variant to ascertain in any subsequent cohort. For context on the
          parent category, familial disease accounted for 130 of 637 (20.4%) consecutively enrolled dilated
          cardiomyopathy patients in the Trieste group's registry; that series and the mapping study share
          investigators (Pinamonti, Gregori, Mestroni, Sinagra) and the same Heart Muscle Disease Study
          Group programme, though the 1995 report does not state that its kindred was drawn from this
          enrolment window.
      selected_evidence:
        snippet: Between 1988 and 2007, 637 DCM patients were consecutively enrolled. Of these, 130 patients
          (20.4%) had FDC, including 82 (12.9%) probands and 48 (7.5%) non-proband FDC patients (NP-FDC),
          identified by family screening.
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20525703
      reference_title: Prognostic impact of familial screening in dilated cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Gives the familial fraction of dilated cardiomyopathy in the Trieste group's consecutive
        registry, the closest available denominator for this locus. PARTIAL because it quantifies familial
        DCM as a whole, not CMD1B, for which no rate is or can currently be estimated.
