  7f9e36cd1c8f38ae7882a35a3ff019ed1396811c93f4cefdd42e81e375b0f567:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1B
          disease_term:
            preferred_term: dilated cardiomyopathy 1B
            term:
              id: MONDO:0010951
              label: dilated cardiomyopathy 1B
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd1b_causal_gene_unidentified
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which gene in the 9q13-q22 interval between D9S153 and D9S152 causes CMD1B, and is the
          locus still a distinct disease entity thirty years after it was mapped?
        attaches_to:
        - pathophysiology#Unidentified 9q13-q22 Disease Locus
        rationale: 'This is the central open question of the entry and the reason its pathophysiology
          chain begins with a placeholder node. The linkage evidence is strong - a maximum multipoint
          LOD of 4.2, exclusion of more than 95% of the genome across 251 markers, replication in two
          additional families, and no evidence of heterogeneity - so the locus is unlikely to be a false
          positive, yet no gene has been confirmed in the three decades since. MONDO still defines the
          entity by chromosome region rather than by gene, and NCBI Gene 1218 returns no genomic coordinates.
          The original report named positional candidates within the interval, of which TMOD1 (tropomodulin
          1, 9q22.33) is the most biologically attractive: tropomodulin caps the pointed end of the sarcomeric
          actin thin filament, and tropomodulin-overexpressing transgenic mice develop progressive dilated
          cardiomyopathy. That mouse phenotype is evidence of plausibility only; no TMOD1 variant has
          ever been reported in this kindred or in any other family with this locus, and the same is true
          of PRKACG (9q21.11). Resolution now would most plausibly come from whole-genome sequencing of
          surviving members of the original pedigree, which would also address the alternative possibilities
          that the causal variant is non-coding or structural and so invisible to the exome-based panels
          that dominate DCM testing, or that the kindred''s disease has since been reassigned to a gene
          now known to cause DCM but not resident at 9q13-q22, which would retire the locus. Note that
          TMOD1 and PRKACG are named here as positional candidates on the strength of secondary sources
          plus independently verified map positions inside the interval; the cached abstract of the original
          report does not name them.'
        notes: A curator reviewing this entry should resist the temptation to close the gap by binding
          TMOD1 or PRKACG as the causal gene. Neither has ever been shown to carry a variant segregating
          with disease in this kindred, and asserting one would convert a positional coincidence into
          a fabricated gene-disease claim.
      selected_evidence:
        snippet: The foundations of DCM genetics rest on marked locus and allelic heterogeneity.
        supports: SUPPORT
