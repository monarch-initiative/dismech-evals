              id: MONDO:0013030
              label: dilated cardiomyopathy 1BB
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Connexin-43 Gap Junction Remodeling
        description: 'Connexin-43, the principal ventricular gap junction protein, is mislocalised and
          reduced at the intercalated disc once desmosomal anchorage fails. This is the electrical-coupling
          counterpart of the sodium-current node: the two together explain why conduction is abnormal
          in DSG2 disease before there is enough scar to account for it. Stabilising desmoglein-2 binding
          restores connexin-43 localisation and abolishes the conduction irregularity, which is what makes
          this a consequence of the desmosomal lesion rather than an independent finding.'
        role: effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: ventricular cardiac muscle cell
          term:
            id: CL:2000046
            label: ventricular cardiac muscle cell
        biological_processes:
        - preferred_term: gap junction assembly
          term:
            id: GO:0016264
            label: gap junction assembly
          modifier: DECREASED
        cellular_components:
        - preferred_term: connexin-43 gap junction at the intercalated disc
          term:
            id: GO:0005921
            label: gap junction
      selected_evidence:
        snippet: All animals developed AC during postnatal growth with pronounced chamber dilation, calcifying
          cardiomyocyte necrosis, aseptic inflammation, interstitial and focal replacement fibrosis, and
          conduction defects with altered connexin 43 distribution.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
