      assertion_type: Pathophysiology
      assertion:
        name: Cardiomyocyte Necrosis
        conforms_to: desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent
          Tissues
        description: Detached cardiomyocytes die by necrosis, with myocardial calcification in the DSG2
          mouse. Necrosis - not apoptosis - is the initiating injury in this disease, and it is the event
          that both provokes the sterile inflammatory response and creates the defect that fibrofatty
          tissue fills.
        role: effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: cardiomyocyte necrosis
          term:
            id: GO:0008219
            label: cell death
          modifier: INCREASED
        notes: Deliberately bound to the broad GO term cell death rather than to a necrosis-specific one.
          GO:0070265 necrotic cell death is obsolete; GO:0097300 programmed necrotic cell death would
          assert a regulated necroptosis-like mechanism that the DSG2 literature does not establish; and
          GO:0010659 cardiac muscle cell apoptotic process - the binding used on the predecessor of this
          node and widely across the cardiac entries in this KB - names apoptosis, which is the mode of
          death the cited work explicitly contrasts this one with. The specificity that is lost sits in
          preferred_term, per the ontology term contract.
      selected_evidence:
        snippet: All animals developed AC during postnatal growth with pronounced chamber dilation, calcifying
          cardiomyocyte necrosis, aseptic inflammation, interstitial and focal replacement fibrosis, and
          conduction defects with altered connexin 43 distribution.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/12
      evidence_path: /pathophysiology/12/evidence/1
