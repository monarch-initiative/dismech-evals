              and reduced at the intercalated disc once desmosomal anchorage fails. This is the electrical-coupling
              counterpart of the sodium-current node: the two together explain why conduction is abnormal
              in DSG2 disease before there is enough scar to account for it. Stabilising desmoglein-2
              binding restores connexin-43 localisation and abolishes the conduction irregularity, which
              is what makes this a consequence of the desmosomal lesion rather than an independent finding.'
            role: effector
            biological_scale: CELLULAR
