            label: Autosomal recessive inheritance
        description: A minority of cases are recessive. Biallelic loss of function - homozygous, compound
          heterozygous, or hemizygous where a point mutation is unmasked by a large deletion of the second
          allele - produces earlier-onset, biventricular disease, and the obligate heterozygous parents
          are typically unaffected, which is why these families present without an apparent family history.
      selected_evidence:
        snippet: In conclusion, a recessive inheritance pattern is likely for both cases, which might
          contribute to the hidden medical history in both families.
        supports: SUPPORT
