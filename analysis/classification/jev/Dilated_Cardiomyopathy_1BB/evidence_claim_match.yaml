        context: []
      assertion_type: Genetic
      assertion:
        name: DSG2 Loss-of-Function and Missense Variants
        gene_term:
          preferred_term: DSG2
          term:
            id: hgnc:3049
            label: DSG2
        association: Causative
        inheritance:
        - name: Autosomal dominant
        - name: Autosomal recessive
        features: DSG2 encodes desmoglein-2, a type I transmembrane desmosomal cadherin whose four extracellular
          cadherin domains mediate calcium-dependent adhesion to desmocollin-2 across the intercalated
          disc. Pathogenic variants are predominantly missense and cluster in the extracellular domains;
          nonsense, frameshift, splice-site and whole-gene deletion alleles also occur and act through
          loss of function. Missense alleles may additionally act in a dominant-negative fashion, since
          mutant protein is incorporated into the desmosome rather than degraded. Multiple variants in
          the same individual are common and track with earlier onset and worse outcome.
        case_fractions:
        - population: Unselected idiopathic dilated cardiomyopathy referral cohort (UK)
          case_fraction_percent: 5.0
          cohort_size: 100
          notes: Share attributable to all five desmosomal genes screened together (plakoglobin, desmoplakin,
            plakophilin-2, desmoglein-2, desmocollin-2), not to DSG2 alone. Recorded here because it is
            the best available denominator for how often a desmosomal lesion underlies an unequivocal
            dilated cardiomyopathy presentation; the DSG2-only fraction is smaller and is not separately
            reported.
      selected_evidence:
        snippet: A total of 181 (66.8%) individuals carried missense variants, mainly distributed in the
          extracellular domains.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
