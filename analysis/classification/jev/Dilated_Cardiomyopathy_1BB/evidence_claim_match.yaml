      assertion_type: Diagnosis
      assertion:
        name: Task Force and Padua diagnostic criteria
        description: 'The 2010 modified International Task Force criteria and the 2020 Padua criteria
          are the formal diagnostic frameworks. The distinction matters specifically for this entry: the
          Task Force criteria are built around right ventricular structural abnormality and systematically
          under-recognise the left-dominant presentation, whereas the Padua criteria add left ventricular
          tissue characterisation and so classify the biventricular and left-dominant forms that CMD1BB
          describes.'
        diagnosis_term:
          preferred_term: application of the Task Force and Padua diagnostic criteria
        notes: Deliberately left without an ontology binding. NCIT has no clinical-action term for applying
          a named diagnostic criterion set, and this is an assessment framework rather than a test; binding
          it to a generic laboratory or evaluation term would say something false rather than something
          imprecise. It is recorded here because which criterion set is used determines whether a patient
          reaches this entry at all.
      selected_evidence:
        snippet: Recognizing the limitations of the International Task Force criteria and further additions
          might be needed to properly diagnose left-dominant ACM.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/5
      evidence_path: /diagnosis/5/evidence/0
      context_paths:
