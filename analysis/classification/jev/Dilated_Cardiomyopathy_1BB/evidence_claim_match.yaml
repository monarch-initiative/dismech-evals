      assertion_type: Environmental
      assertion:
        name: Endurance and high-intensity exercise
        description: Exercise is the principal environmental modifier of desmosomal cardiomyopathy. Because
          the underlying lesion is a failure of mechanical coupling, repeated high wall-stress loading
          accelerates myocyte detachment and death. Endurance athletes carrying desmosomal mutations become
          symptomatic younger, meet diagnostic criteria more often, and have worse arrhythmia-free and
          heart-failure-free survival; reducing exercise lowers subsequent arrhythmic risk. This makes
          exercise restriction a genuine disease-modifying intervention rather than generic advice.
      selected_evidence:
        snippet: Endurance exercise and frequent exercise increase the risk of VT/VF, HF, and ARVD/C in
          desmosomal mutation carriers.
        supports: SUPPORT
