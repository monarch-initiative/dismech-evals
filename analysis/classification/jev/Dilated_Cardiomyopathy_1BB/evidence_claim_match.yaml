      assertion_type: Diagnosis
      assertion:
        name: Cardiac magnetic resonance imaging with late gadolinium enhancement
        description: The modality that decides this entry. Echocardiography establishes that the ventricle
          is dilated and hypocontractile but cannot say why; CMR resolves the fibrofatty tissue characterisation
          - non-ischaemic mid-myocardial and epicardial late gadolinium enhancement, fatty infiltration,
          regional dyskinesia - that separates a DSG2 desmosomal cardiomyopathy from an otherwise identical
          idiopathic dilated cardiomyopathy. In the left-dominant presentation this entry curates, CMR
          is often what converts a working diagnosis of dilated cardiomyopathy into arrhythmogenic cardiomyopathy.
        diagnosis_term:
          preferred_term: cardiac magnetic resonance imaging with late gadolinium enhancement
          term:
            id: NCIT:C137915
            label: Magnetic Resonance Imaging of the Heart
        notes: Late gadolinium enhancement is not currently accepted as a stand-alone diagnostic criterion
          for left-dominant disease. The same case report that demonstrates CMR making the diagnosis also
          records that the patient failed the structural criteria of the 2010 modified Task Force criteria
          because her right ventricle was preserved - see the Task Force criteria entry below.
      selected_evidence:
        snippet: Subsequent CMR imaging confirmed the diagnosis of left-dominant ACM by demonstrating
          regional biventricular dyskinesia and a characteristic pattern of fibrofatty myocardial replacement.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
