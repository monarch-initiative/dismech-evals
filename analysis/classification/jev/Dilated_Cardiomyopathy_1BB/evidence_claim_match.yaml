          Because the cardiac intercalated disc is an area composita in which desmosomal and adherens-junction
          components are intermingled, the destabilisation is not confined to the desmosome proper; it
          also perturbs the junctional protein complexes that the sodium channel and gap junctions depend
          on. This node is the branch point of the entry.
