        context: []
      assertion_type: Treatment
      assertion:
        name: Heart failure pharmacotherapy
        description: Contemporary four-pillar guideline-directed medical therapy for dilated cardiomyopathy
          with reduced ejection fraction - beta-blockade, angiotensin receptor-neprilysin inhibition (or
          renin-angiotensin system inhibition where an ARNI is not tolerated), mineralocorticoid receptor
          antagonism, and an SGLT2 inhibitor. This is disease-modifying for the heart failure arm but
          is not specific to the desmosomal lesion, and no DSG2-specific trial evidence exists.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: carvedilol
            term:
              id: CHEBI:3441
              label: carvedilol
          - preferred_term: enalapril
            term:
              id: CHEBI:4784
              label: enalapril
          - preferred_term: spironolactone
            term:
              id: CHEBI:9241
              label: spironolactone
          - preferred_term: sacubitril (given as the sacubitril/valsartan ARNI)
            term:
              id: NCIT:C152281
              label: Sacubitril
          - preferred_term: dapagliflozin
            term:
              id: CHEBI:85078
              label: dapagliflozin
        notes: Only the beta-blocker and ARNI components carry a DSG2-specific citation, and that is a
          single treated case rather than an outcome study. The mineralocorticoid receptor antagonist
          and SGLT2 inhibitor pillars are listed because they are standard care for dilated cardiomyopathy
          with reduced ejection fraction, but no trial has tested any of these agents in DSG2-related
          disease, and citing a general heart failure trial as evidence for this entry would overstate
          what is known. Catheter ablation for recurrent ventricular arrhythmia and cardiac resynchronisation
          therapy for standard dyssynchrony indications are likewise part of the management of this disease;
          neither has been added as a treatment entry because the abstract-level sources fetched for this
          entry contain no finding about either in DSG2 carriers, only the fact that they are used in
          arrhythmogenic cardiomyopathy generally.
      selected_evidence:
        snippet: the patient was diagnosed with left-dominant ACM and was managed according to published
          recommendations with guideline-directed medical therapy (carvedilol 12.5 mg twice daily and
          sacubitril–valsartan 49–51 mg twice daily)
        supports: SUPPORT
        directness: INDIRECT
