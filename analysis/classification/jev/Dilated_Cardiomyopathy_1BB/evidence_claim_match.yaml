          here is exclusionary - the absence of granulomas in a DSG2 carrier with florid myocardial FDG
          uptake is what argues against cardiac sarcoidosis. Sampling error limits a negative result.
        diagnosis_term:
          preferred_term: endomyocardial biopsy
