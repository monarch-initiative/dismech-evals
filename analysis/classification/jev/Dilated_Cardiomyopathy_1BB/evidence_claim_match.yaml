          most Mendelian disease: a hemizygous genotype in which a point mutation is unmasked by a large
          deletion of the second allele is invisible to sequencing alone, and a low-coverage panel has
          been shown to miss a DSG2 variant that a later high-coverage panel found. Testing must be coupled
          to genetic counselling and cascade evaluation.'
