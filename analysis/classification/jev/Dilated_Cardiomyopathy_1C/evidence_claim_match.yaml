          carrier is reported: the father of a Barth syndrome proband who also carried a TAZ variant transmitted
          the LDB3 T350I allele and is healthy, although he shows prominent left ventricular trabeculation.
          No study counts unaffected and affected carriers of a disease-associated allele, so penetrance
          is recorded as UNKNOWN.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
