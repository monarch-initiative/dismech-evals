    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1C
          disease_term:
            preferred_term: dilated cardiomyopathy 1C
            term:
              id: MONDO:0011094
              label: dilated cardiomyopathy 1C
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dominant_mechanism_unresolved
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do dominant LDB3 missense alleles act through the same pathways that knockout mice reveal?
        attaches_to:
        - pathophysiology#Maladaptive Cardiomyocyte Stress Signalling
        - pathophysiology#Z-Disc Cytoskeletal Disorganization
        - animal_models#Global Cypher knockout mouse
        - animal_models#Cardiac-specific Cypher knockout mouse
        rationale: Nearly all mechanistic mouse work deletes Cypher or its isoforms. That matches recessive
          LDB3 disease. Heterozygous loss-of-function carriers in the recessive families were reported
          as asymptomatic. The one human allele tested biochemically for PKC binding (D626N) increases
          binding rather than removing it. The only allele-specific mouse is a transgenic overexpressor.
          So the signalling and Z-disc nodes are carried over from loss-of-function models, and no heterozygous
          knock-in or patient iPSC model tests them.
      selected_evidence:
        snippet: suggesting that heterozygous missense variants in the LDB3 gene may be more deleterious
          than heterozygous loss-of-function variants in this gene.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
