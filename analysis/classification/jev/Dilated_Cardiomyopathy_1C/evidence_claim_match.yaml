        rationale: The D117N allele was first reported in two sporadic cases. It did not segregate in
          two Bedouin families. It was found on 11 of 210 Bedouin chromosomes (5.2%, an allele frequency,
          all heterozygous). The M456R case also carried MYH6 and SYNE1 variants. Most LDB3 missense variants
          on clinical panels are of uncertain significance, which fits the Limited classification.
      selected_evidence:
        snippet: However, p.(D117N) did not segregate as the causative mutation in these families, i.e.
          it was not present in some patients and was found in several individuals who had no clinical
          manifestations.
