            preferred_term: dilated cardiomyopathy 1C
            term:
              id: MONDO:0011094
              label: dilated cardiomyopathy 1C
        context: []
      assertion_type: Prevalence
      assertion:
        population: Published LDB3 cardiomyopathy reports
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'The cited primary reports describe about 16 heterozygous index cases. These are 6 probands
          from the founding 100-proband screen, 1 Japanese dilated cardiomyopathy family (D626N, from
          96 patients), 2 Japanese noncompaction families (D626N, found in four members of two families
          with LVNC), 6 hypertrophic cardiomyopathy probands from 239 screened, and 1 oligogenic case
          that also carried MYH6 and SYNE1 variants. Two further LDB3 carriers are reported outside these
          counts: a Barth syndrome proband with a TAZ variant plus paternal LDB3 T350I, and one ARVC family
          (c.1051A>G), a disease ClinGen disputes for LDB3. The D117N allele was later shown not to segregate.
          It was first reported in two sporadic cases. The cached abstracts do not say whether those were
          among the founding six probands, so up to 2 of the ~16 index cases may rest on a refuted allele.
          Whether the two D626N noncompaction families are related to the D626N dilated family is not
          stated. GeneReviews attributes under 1% of dilated cardiomyopathy to LDB3. No population prevalence
          has been measured.'
      selected_evidence:
        snippet: Five mutations in six probands (6% of cases) were identified in patients with familial
          or sporadic DCM or INLVM.
        supports: SUPPORT
