              id: MONDO:0013147
              label: dilated cardiomyopathy 1CC
        context: []
      assertion_type: Genetic
      assertion:
        name: NEXN
        notes: NEXN (1p31.1) encodes nexilin, an F-actin-binding protein of cardiac and skeletal muscle
          comprising two actin-binding domains, a central coiled-coil region and a C-terminal immunoglobulin-superfamily
          (IGcam) domain. Deletion mapping in mice indicates that the C-terminal actin-binding and IGcam
          regions are indispensable. Reported disease alleles include protein-truncating variants subject
          to nonsense-mediated decay (c.1302del p.Ile435Serfs*3; c.1174C>T p.Arg392*), in-frame deletions
          (c.1949_1951del p.Gly650del; c.1579_1584del p.Glu527_Glu528del) and missense changes. Variant
          classification is allele-specific and should be refreshed against current ClinVar, ClinGen and
          gnomAD records rather than taken from the primary reports, several of which predate present
          ACMG/AMP practice.
        gene_term:
          preferred_term: NEXN
          term:
            id: hgnc:29557
            label: NEXN
        relationship_type: CAUSATIVE
        case_fractions:
        - population: Han Chinese idiopathic dilated cardiomyopathy cohort
          case_fraction_percent: 4.8
          cohort_size: 118
          notes: Share of the pathogenic and likely pathogenic variants identified in a prospective target-sequencing
            cohort of 118 idiopathic dilated cardiomyopathy patients, in which 41 patients carried 40
            such variants. This is a gene's share of a clinically ascertained sequencing cohort, not a
            population prevalence, and it is ancestry- and ascertainment-dependent. NEXN was tied with
            RBM20 at 4.8%, far behind TTN at 31.0%.
      selected_evidence:
        snippet: NEXN | HGNC:29557 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong | SOP10 | Dilated
          Cardiomyopathy Gene Curation Expert Panel | 2024-11-15T05:00:00.000Z
        supports: SUPPORT
    origin:
