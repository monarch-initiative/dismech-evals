        description: 'The endpoint therapy once medical and device management fail, and the only intervention
          that removes the nexilin-deficient myocardium. It is reported across both arms of this disease:
          an adult heterozygote assessed for transplant at an ejection fraction of 15%, and the published
          biallelic and childhood-onset series in which mechanical circulatory support or transplantation
          is the recorded endpoint. Durable mechanical circulatory support with a ventricular assist device
          serves as the bridge where a donor organ is not immediately available, and is the recorded endpoint
          for at least one heterozygous NEXN patient; it is described here rather than curated as a separate
          treatment because the cached sources record it only in a summary endpoint table without a quotable
          finding of its own.'
