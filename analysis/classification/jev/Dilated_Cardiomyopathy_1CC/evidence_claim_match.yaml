        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nexn_z_disc_versus_jmc_primary_lesion
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the primary cardiomyocyte lesion in NEXN cardiomyopathy Z-disc destabilisation or failure
          of the junctional membrane complex and T-tubule network?
        attaches_to:
        - pathophysiology#Z-Disc Destabilization
        - pathophysiology#Junctional Membrane Complex and T-Tubule Failure
        - mechanistic_hypotheses#nexn_z_disc_primary
        - mechanistic_hypotheses#nexn_jmc_ttubule_primary
        rationale: The two published models are not merely different emphases; the mouse study explicitly
          denies the Z-disc characterisation, while the founding zebrafish work and human carrier myocardium
          show Z-disc pathology directly. The answer determines which readout should be used to assess
          a candidate therapy and what a variant's position within the protein predicts, so it is not
          a purely taxonomic question. Species difference is a plausible reconciliation, as is a dual
          role for nexilin in both compartments, but neither has been tested.
        proposed_experiments:
        - experiment_id: exp_cmd1cc_human_myocardium_ultrastructure
          name: Z-disc versus dyad ultrastructure in genotyped human myocardium
          description: Electron microscopy and immunolocalisation on explanted or biopsy myocardium from
            NEXN variant carriers, scoring Z-disc integrity and T-tubule/junctional sarcoplasmic reticulum
            apposition in the same samples, stratified by allele class and zygosity. Both lesions present
            together would support a dual role and retire the framing of the two hypotheses as exclusive;
            a lesion confined to one compartment would settle which is primary, and preserved Z-disc ultrastructure
            alongside disrupted dyads would refute the Z-disc-primary model in the tissue that matters.
          would_support:
          - pathophysiology#Junctional Membrane Complex and T-Tubule Failure
          would_refute:
          - pathophysiology#Z-Disc Destabilization
      selected_evidence:
        snippet: our findings reveal that NEXN, rather than being a Z-disk protein as previously thought,
          interacts with SR proteins and is required for initiation of T-tubule invagination and overall
          T-tubule formation
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30982350
      reference_title: Nexilin Is a New Component of Junctional Membrane Complexes Required for Cardiac
        T-Tubule Formation.
      evidence_source: MODEL_ORGANISM
      explanation: The explicit denial of the Z-disc characterisation that puts the two models in direct
        conflict and defines this gap.
