      assertion_type: Pathophysiology
      assertion:
        name: Nexilin Loss of Function
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        description: The initiating lesion is a germline NEXN variant that reduces nexilin abundance or
          abolishes its normal F-actin-anchoring function. Frameshift and nonsense alleles are subject
          to nonsense-mediated decay, so biallelic carriers approach a true null; in-frame deletions and
          missense alleles in the IGcam and actin-binding domains act instead by producing a mislocalised
          or non-functional protein, and at least one (p.Gly650del) behaves as a dominant negative when
          expressed in zebrafish. This difference in allele mechanism, rather than variant position alone,
          is what separates the dominant and recessive arms of the disease.
        genes:
        - preferred_term: NEXN
          term:
            id: hgnc:29557
            label: NEXN
        molecular_functions:
        - preferred_term: actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: DECREASED
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: Myocardium
          term:
            id: UBERON:0002349
            label: myocardium
      selected_evidence:
        snippet: RNA sequencing spanning the variant in cDNA blood of heterozygote individuals revealed
          nonsense-mediated mRNA decay of the mutated transcripts.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35166435
      reference_title: Loss of nexilin function leads to a recessive lethal fetal cardiomyopathy characterized
