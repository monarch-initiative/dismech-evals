      assertion_type: Pathophysiology
      assertion:
        name: Z-Disc Destabilization
        biological_scale: CELLULAR
        role: mechanism
        description: In the Z-disc model, nexilin cross-links and stabilises the actin filaments anchored
          at the Z-disc, which is the site at which contractile force generated by the sarcomere is received
          and transmitted. Without it the Z-disc fails progressively under the repetitive load of cardiac
          contraction, producing the Z-disc pathology observed both in nexilin-deficient zebrafish and
          in myocardium from human NEXN variant carriers, and disrupting the sarcomeric organisation on
          which coordinated contraction depends.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: Sarcomere organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Nexilin mutation carriers showed the same cardiac Z-disk pathology as observed in nexilin-deficient
          zebrafish.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
