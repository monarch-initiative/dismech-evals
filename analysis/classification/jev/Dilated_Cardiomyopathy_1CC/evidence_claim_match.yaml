    evidence_metadata:
      reference: PMID:38783323
      reference_title: In vivo rescue of genetic dilated cardiomyopathy by systemic delivery of nexilin.
      evidence_source: MODEL_ORGANISM
      explanation: The closest model to a patient allele is still homozygous, which is the mismatch this
