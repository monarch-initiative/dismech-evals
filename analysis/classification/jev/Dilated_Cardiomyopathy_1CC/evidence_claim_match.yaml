      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: UNKNOWN
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No population-based prevalence estimate exists for the NEXN-specific form of dilated cardiomyopathy.
          NEXN is a minority cause: the 2021 ClinGen evidence-based reappraisal of dilated-cardiomyopathy
          genes placed it in the moderate-evidence tier alongside ACTN2 and TNNI3, below the definitive
          genes (TTN, LMNA, MYH7) that account for most genotyped familial disease. The dedicated ClinGen
          Dilated Cardiomyopathy Gene Curation Expert Panel subsequently upgraded NEXN to Strong under
          SOP10 in November 2024, which raises confidence in causality but supplies no frequency estimate.'
      selected_evidence:
        snippet: Seven genes (14%; ACTC1, ACTN2, JPH2, NEXN, TNNI3, TPM1, VCL) including 2 additional
          ontologies were classified as moderate evidence
        supports: SUPPORT
