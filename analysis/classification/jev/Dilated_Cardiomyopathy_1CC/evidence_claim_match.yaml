            label: T-tubule
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: T-tubule organization
          term:
            id: GO:0033292
            label: T-tubule organization
          modifier: DECREASED
      selected_evidence:
        snippet: We demonstrated that NEXN was one of the important components in maintaining the structure
          and function of cardiomyocyte junctional membrane complexes (JMCs), excitation-contraction coupling
          and energy metabolism of cardiomyocytes, while the loss of its function would lead to DCM.
        supports: SUPPORT
