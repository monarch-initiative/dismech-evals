      assertion:
        name: Junctional Membrane Complex and T-Tubule Failure
        biological_scale: CELLULAR
        role: mechanism
        description: In the competing model, nexilin is a component of the cardiomyocyte junctional membrane
          complex - the dyad in which the transverse tubule is apposed to the junctional sarcoplasmic
          reticulum - and is required to initiate the sarcolemmal invaginations that become T-tubules
          during postnatal development. Without nexilin the T-tubule network fails to form and the dyad
          is disorganised, so L-type calcium channel activation no longer reliably triggers ryanodine-receptor
          calcium release. This node is supported in mouse and in human iPSC-derived cardiomyocytes.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        cellular_components:
        - preferred_term: T-tubule
