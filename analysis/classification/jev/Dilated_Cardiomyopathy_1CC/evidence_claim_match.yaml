  471c6a101b3c2a5a364f3fcb4845b84f0e4f2050d07d55bbb3b15f7f33e5cc27:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1CC
          disease_term:
            preferred_term: dilated cardiomyopathy 1CC
            term:
              id: MONDO:0013147
              label: dilated cardiomyopathy 1CC
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nexn_models_are_all_biallelic_nulls
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the available NEXN model systems, all of which are complete nulls or homozygous knock-ins,
          tell us anything about the common human disease, which is heterozygous and adult-onset?
        attaches_to:
        - animal_models#Mouse
        - animal_models#Zebrafish
        - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
        rationale: 'Every published NEXN model reproduces the rare biallelic arm: mouse nulls die within
          days, the G645del knock-in is homozygous, and the human iPSC line is a homozygous knockout.
          Heterozygous mice show at most mild transient dilation that was absent on follow-up at 3 and
          10 months. The clinically dominant presentation - an incompletely penetrant dilated cardiomyopathy
          appearing near age 50 - therefore has no model at all, and the mechanism curated here is extrapolated
          to it from null systems. That extrapolation is the weakest link in this entry, and it also means
          the AAV rescue result, however striking, was obtained in a disease arm that is not the one most
          patients have.'
        proposed_experiments:
        - experiment_id: exp_cmd1cc_aged_heterozygous_knockin
          name: Aged heterozygous Nexn knock-in cohort with haemodynamic stress
          description: Longitudinal echocardiography in heterozygous Nexn G645del mice aged beyond 12
            months, with and without pressure-overload or pregnancy stress, to test whether an adult-onset
            heterozygous phenotype emerges when the model is aged and loaded rather than assessed in youth.
            Late-onset dilation would give the dominant human arm its first model and support the second-hit
            reading of its incomplete penetrance; normal function in aged, stressed heterozygotes would
            indicate that the murine heterozygous state does not model human dominant NEXN disease at
            all.
          would_support:
          - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
      selected_evidence:
        snippet: homozygous G645del mice resulted in a progressive DCM and recapitulated the clinicopathological
          features that have been observed in patients with the corresponding G650del mutation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
