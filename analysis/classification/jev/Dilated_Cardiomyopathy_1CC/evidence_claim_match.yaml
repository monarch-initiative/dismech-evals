          to it from null systems. That extrapolation is the weakest link in this entry, and it also means
          the AAV rescue result, however striking, was obtained in a disease arm that is not the one most
          patients have.'
        proposed_experiments:
        - experiment_id: exp_cmd1cc_aged_heterozygous_knockin
          name: Aged heterozygous Nexn knock-in cohort with haemodynamic stress
          description: Longitudinal echocardiography in heterozygous Nexn G645del mice aged beyond 12
            months, with and without pressure-overload or pregnancy stress, to test whether an adult-onset
            heterozygous phenotype emerges when the model is aged and loaded rather than assessed in youth.
            Late-onset dilation would give the dominant human arm its first model and support the second-hit
            reading of its incomplete penetrance; normal function in aged, stressed heterozygotes would
            indicate that the murine heterozygous state does not model human dominant NEXN disease at
            all.
          would_support:
          - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
      selected_evidence:
        snippet: Pathogenic heterozygous NEXN variants are associated with progressive dilated cardiomyopathy
          (DCM) usually presenting around 50 years of age.
        supports: SUPPORT
