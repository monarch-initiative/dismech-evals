            label: sarcomere organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Troponin complex
          term:
            id: GO:0005861
            label: troponin complex
      selected_evidence:
        snippet: A missense mutation R141W in the strong tropomyosin-binding region of cardiac troponin
          T (cTnT) has recently been reported to cause dilated cardiomyopathy (DCM), following the first
          report of a DCM-causing deletion mutation DeltaK210.
        supports: SUPPORT
