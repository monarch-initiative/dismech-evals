  39fc9a21cd63f1bfb1490f2d504aa74ca7cf2615f58e8bba9807c67af949f66f:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1D
          disease_term:
            preferred_term: dilated cardiomyopathy 1D
            term:
              id: MONDO:0011095
              label: dilated cardiomyopathy 1D
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Decreased Myofilament Calcium Sensitivity
        biological_scale: MOLECULAR
        role: effector
        description: 'The defining functional lesion of CMD1D, and the axis on which dilated and hypertrophic
          TNNT2 disease separate. Dilated cardiomyopathy alleles decrease the calcium sensitivity of force
          generation: the R141W mutation does so by stabilizing the troponin T-tropomyosin interaction,
          and DeltaK210 produces the same desensitization from outside the strong tropomyosin-binding
          region, so the functional direction rather than the structural location is what tracks with
          the phenotype. Hypertrophic TNNT2 alleles such as R94L do the opposite, increasing calcium sensitivity.
          A myofilament that requires more calcium to generate the same force is hypocontractile, which
          is why the ventricle dilates.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Regulation of Cardiac Muscle Contraction by Calcium
          term:
            id: GO:0010882
            label: regulation of cardiac muscle contraction by calcium ion signaling
          modifier: DECREASED
        - preferred_term: Muscle Contraction
          term:
            id: GO:0006936
            label: muscle contraction
          modifier: DECREASED
      selected_evidence:
        snippet: In contrast, a missense mutation R94L in the vicinity of the strong tropomyosin-binding
          region associated with hypertrophic cardiomyopathy (HCM) resulted in an increase in the Ca(2+)
          sensitivity of force generation, as in the case of the other HCM-causing mutations in cTnT reported
          previously.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:14654368
      reference_title: Cardiac troponin T mutation R141W found in dilated cardiomyopathy stabilizes the
        troponin T-tropomyosin interaction and causes a Ca2+ desensitization.
      evidence_source: IN_VITRO
      explanation: 'The direct experimental contrast that this entry rests on: hypertrophic TNNT2 alleles
        increase calcium sensitivity where the dilated alleles decrease it, measured in the same system.'
