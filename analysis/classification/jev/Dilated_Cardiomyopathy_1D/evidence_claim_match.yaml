        description: The initiating lesion in CMD1D is a heterozygous variant in TNNT2, encoding cardiac
          troponin T - the subunit that binds tropomyosin and anchors the troponin complex on the thin
          filament. The founding dilated allele is the in-frame deletion DeltaLys210; the missense allele
          Arg141Trp, located in the strong tropomyosin-binding region, was subsequently reported to cause
          the same disease. The mutant protein is incorporated into the thin filament and retunes calcium
          regulation rather than being lost.
