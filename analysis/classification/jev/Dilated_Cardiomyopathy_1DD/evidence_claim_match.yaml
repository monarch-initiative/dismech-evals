          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: RNA binding
          term:
            id: GO:0003723
            label: RNA binding
          modifier: DECREASED
      selected_evidence:
        snippet: RBM20 is preferentially expressed in the heart and encodes motifs prototypical of spliceosome
          proteins that regulate alternative pre-messenger RNA splicing, thus implicating a functionally
          distinct gene in human cardiomyopathy.
        supports: SUPPORT
