      assertion_type: Discussion
      assertion:
        discussion_id: controversy_rbm20_splicing_versus_condensates
        prompt: Is RBM20 cardiomyopathy caused by disrupted splicing of RBM20 target genes, by mislocalization
          of RBM20 into sarcoplasmic biomolecular condensates, or by both?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#RBM20 Loss-of-Function Variant in the RS Domain
        - pathophysiology#Loss of RBM20-Dependent Splicing Regulation
        - mechanistic_hypotheses#rbm20_spliceopathy
        - mechanistic_hypotheses#rbm20_condensate_mislocalization
        rationale: 'This entry''s pathograph routes every downstream consequence through loss of splicing
          repression, so the question is not decorative - if condensate formation is the operative lesion,
          the splicing edges are correlates rather than causes, and the therapeutic target moves from
          restoring the titin isoform balance to preventing RBM20 mislocalization. The two knock-in models
          point opposite ways: RS-domain variants produce both mis-splicing and condensates together,
          while an RRM variant produces mis-splicing without disease. The condensate model does not account
          for the whole gene either: exon 11 hotspot variants produce the same clinical picture without
          being expected to disturb nucleocytoplasmic trafficking, which either limits the condensate
          mechanism to nuclear-localization-signal variants or means the two variant classes reach the
          phenotype by different routes. Resolving this requires separating mis-splicing from mislocalization
          within a single model rather than comparing across models, and characterising the exon 11 class
          clinically, which is currently too sparsely described to compare.'
      selected_evidence:
        snippet: pathogenic variants in the exon 11 hotspot (Figure 1C) cause RBM20 cardiomyopathy even
          though they are not expected to affect RBM20 nucleocytoplasmic trafficking
        supports: SUPPORT
