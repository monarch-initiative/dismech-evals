            term:
              id: MONDO:0013168
              label: dilated cardiomyopathy 1DD
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of RBM20-Dependent Splicing Regulation
        biological_scale: MOLECULAR
        role: effector
        description: RBM20 represses inclusion of specific exons in a defined set of cardiac transcripts.
          Deep sequencing of the human and rat cardiac transcriptome established an RBM20-dependent programme
          of alternative splicing, and identified - alongside titin - a conserved set of around 30 genes
          whose splicing RBM20 regulates, a network enriched for genes previously linked to cardiomyopathy,
          ion homeostasis and sarcomere biology. Loss of RBM20 function therefore perturbs the myocyte
          at the level of transcript composition, and the ion-homeostasis arm of that network is the plausible
          substrate of the entity's arrhythmic phenotype.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Regulation of Alternative mRNA Splicing
          term:
            id: GO:0000381
            label: regulation of alternative mRNA splicing, via spliceosome
          modifier: DECREASED
        - preferred_term: RNA Splicing
          term:
            id: GO:0008380
            label: RNA splicing
          modifier: ABNORMAL
      selected_evidence:
        snippet: This network is enriched for genes that have previously been linked to cardiomyopathy,
          ion homeostasis and sarcomere biology.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
