        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pathological Titin Isoform Switch
        biological_scale: MOLECULAR
        role: effector
        description: Titin exists in a stiff (N2B) and a compliant (N2BA) isoform, and the ratio between
          them sets passive myocardial stiffness and thereby ventricular filling. RBM20 is the splicing
          factor that governs this switch. Loss of RBM20 function produces pathological expression of
          the overly compliant giant titin isoform, so the ventricle loses the passive elastic restoring
          force it needs for normal diastolic mechanics - a defect of the sarcomere's spring rather than
          of its motor.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Sarcomere Organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: the isoform switch of the sarcomeric protein titin, which adjusts ventricular filling
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22466703
      reference_title: RBM20, a gene for hereditary cardiomyopathy, regulates titin splicing.
      evidence_source: MODEL_ORGANISM
      explanation: States the physiological role of the titin isoform switch - adjusting ventricular filling
