  780e48c2a12fda753cb83e3a6a6dee5cffe139de1ebb86ae93e3e92832bf4f62:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1DD
          disease_term:
            preferred_term: dilated cardiomyopathy 1DD
            term:
              id: MONDO:0013168
              label: dilated cardiomyopathy 1DD
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: rbm20_condensate_mislocalization
        hypothesis_label: Condensate / Nucleocytoplasmic Transport Model
        status: EMERGING
        description: 'A competing, non-mutually-exclusive model in which RS-domain variants act beyond
          splicing: they impair RBM20''s nucleocytoplasmic transport and drive the protein into biomolecular
          condensates in the sarcoplasm. The discriminating observation is a knock-in contrast rather
          than a gain of detail - mice carrying a disease-associated RRM variant mis-splice RBM20 targets
          yet do not remodel or die suddenly, which is difficult to reconcile with mis-splicing alone
          being sufficient. Sarcoplasmic condensates are not a model-system artefact: they have been observed
          in the myocardium of affected individuals as well as in knock-in rodents and hiPSC-derived cardiomyocytes.
          What is not settled is whether they are pathogenic, and the model does not cover the whole gene
          - exon 11 hotspot variants cause the same disease without being expected to disturb nucleocytoplasmic
          trafficking. No pathophysiology node is curated for this route pending that resolution, since
          curating one would commit this entry''s pathograph to a mechanism the primary literature still
          describes as under debate.'
        notes: Surfaced from the committed deep-research artifact research/Dilated_Cardiomyopathy-deep-research-falcon.md
          (section 8.2), which flagged the debate; snippets here are quoted from the primary review, not
          the report.
      selected_evidence:
        snippet: variants in a specific portion of the arginine-serine-rich domain in RBM20 not only disrupt
          splicing but also hinder nucleocytoplasmic transport and lead to the formation of RBM20 biomolecular
          condensates in the sarcoplasm
        supports: SUPPORT
    origin:
