        name: RBM20 Loss-of-Function Variant in the RS Domain
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: The initiating lesion in CMD1DD is a heterozygous variant in RBM20, encoding a heart-enriched
          RNA binding protein with motifs prototypical of spliceosome proteins. Disease alleles cluster
          as a missense hotspot in the arginine/serine-rich (RS) domain encoded by exon 9, and act by
          loss of RBM20 splicing-regulatory function. Uniquely among the dilated cardiomyopathy genes
          curated here, the affected protein is a post-transcriptional regulator rather than a structural
          or quality-control component of the myocyte.
        genes:
        - preferred_term: RBM20
          term:
            id: hgnc:27424
            label: RBM20
        cell_types:
