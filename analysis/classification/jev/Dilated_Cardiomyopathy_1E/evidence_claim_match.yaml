        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SCN5A Missense Variant in the Cardiac Sodium Channel
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: The initiating lesion in CMD1E is a heterozygous missense variant in SCN5A, encoding
          the alpha subunit of the cardiac voltage-gated sodium channel Nav1.5. The founding allele is
          Asp1275Asn (D1275N), identified after refined locus mapping in a family with dilated cardiomyopathy
          and rhythm disturbance. Unlike every other gene in this series, the affected protein has no
          structural role in the contractile apparatus - it is an ion channel, and the same gene's other
          alleles cause the primary channelopathies curated elsewhere in the knowledge base (Brugada syndrome,
          progressive cardiac conduction disease).
        genes:
        - preferred_term: SCN5A
          term:
            id: hgnc:10593
            label: SCN5A
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: Voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: Refined locus mapping revealed SCN5A, encoding the cardiac sodium channel, as a candidate
          gene.
        supports: SUPPORT
