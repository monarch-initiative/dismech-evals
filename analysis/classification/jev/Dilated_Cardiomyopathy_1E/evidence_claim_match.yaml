            term:
              id: MONDO:0011003
              label: dilated cardiomyopathy 1E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Sodium Current with Conduction and Automaticity Impairment
        biological_scale: CELLULAR
        role: effector
        description: The mutant Nav1.5 channel disturbs the depolarizing sodium current that drives the
          action potential upstroke and propagates the impulse. Clinically this manifests as conduction
          delay, impaired automaticity, and a high burden of atrial fibrillation, which in this entity
          accompany rather than follow the ventricular disease. This node is the electrical arm of the
          phenotype and is the point of contact with the primary SCN5A channelopathies; how the same current
          disturbance also produces ventricular dilation is the entity's open mechanistic question.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Cardiac Conduction
          term:
            id: GO:0061337
            label: cardiac conduction
          modifier: ABNORMAL
        - preferred_term: Cardiac Muscle Cell Action Potential
          term:
            id: GO:0086001
            label: cardiac muscle cell action potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: Mutation scans identified a missense mutation (D1275N) that cosegregated with an age-dependent,
          variably expressed phenotype of DCM, atrial fibrillation, impaired automaticity, and conduction
          delay.
        supports: SUPPORT
