            term:
              id: MONDO:0013198
              label: dilated cardiomyopathy 1EE
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: MYH6-related sick sinus syndrome
        description: 'The allelic phenotype with much stronger genetic support. A missense variant, c.2161C>T
          (p.Arg721Trp), present in 0.38% of Icelanders, raises the lifetime risk of sick sinus syndrome
          from about 6% in non-carriers to roughly 50% in carriers, with an odds ratio above 12 in a population-scale
          study.

          The contrast is instructive rather than incidental: the same gene supports a population-scale,
          high-penetrance association for a conduction phenotype while its dilated-cardiomyopathy relationship
          is classified Limited.'
        distinguishing_features:
        - Sinus node dysfunction and bradycardia rather than ventricular dilatation
        - A common population variant with a measured lifetime risk, rather than private familial missense
          alleles
      selected_evidence:
        snippet: We show that the lifetime risk of being diagnosed with sick sinus syndrome is around
          6% for non-carriers of c.2161C>T but is approximately 50% for carriers of the c.2161C>T variant.
        supports: SUPPORT
