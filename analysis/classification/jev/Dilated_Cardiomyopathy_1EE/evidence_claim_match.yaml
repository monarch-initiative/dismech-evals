      assertion:
        name: MYH6-related left-sided congenital heart defects
        description: 'MYH6 variants are recurrent in congenital heart disease, and the phenotype is predominantly
          left-sided: in a French cohort of 29 individuals with congenital heart defects and a MYH6 variant,
          about two thirds had a left heart defect, most commonly hypoplastic left heart syndrome.

          Relevant to this entry because a MYH6 variant reported in a patient may have been ascertained
          through a congenital rather than a cardiomyopathy phenotype.'
        distinguishing_features:
        - Structural congenital malformation present from birth rather than acquired ventricular dilatation
          in adulthood
        - Left-sided obstructive lesions, particularly hypoplastic left heart syndrome
      selected_evidence:
        snippet: 'Of the 29 individuals included, 20 (68.9%) had a principal phenotype of left heart defect:
          hypoplastic left heart syndrome'
        supports: SUPPORT
