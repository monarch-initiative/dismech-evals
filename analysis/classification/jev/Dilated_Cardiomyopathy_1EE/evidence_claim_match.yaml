        description: 'Genetic testing is by panel or exome rather than single-gene sequencing. For MYH6
          that is not merely a matter of efficiency: with the gene-disease relationship classified Limited,
          a MYH6 variant found in isolation carries little interpretive weight, and the main value of
          testing is to find a variant in a gene with stronger support.

          A MYH6 variant in a dilated-cardiomyopathy proband should not be treated as a molecular diagnosis
          without further evidence, and cascade testing of relatives on the strength of one is difficult
          to justify.'
