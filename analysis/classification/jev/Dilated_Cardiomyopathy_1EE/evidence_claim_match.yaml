        role: outcome
        biological_scale: ORGANISM
        description: 'The clinical phenotype: a dilated, hypocontractile left ventricle presenting late.
          In the founding cohort the dilated-cardiomyopathy carrier phenotype was characterised specifically
          by late onset, in contrast with the hypertrophic phenotype seen with a different MYH6 allele
          in the same study, which progressed towards dilatation and refractory heart failure.

          Late onset matters for interpretation as much as for the clinic: a phenotype that appears in
          the sixth decade in some carriers and not at all in others is difficult to segregate convincingly
          in a pedigree, and thin segregation evidence is part of why the gene-disease relationship remains
          weakly supported.'
        locations:
        - preferred_term: heart left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
        cell_types:
