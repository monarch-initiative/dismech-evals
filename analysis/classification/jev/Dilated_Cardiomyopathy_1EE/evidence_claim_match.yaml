        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Sarcomere Contractile Output
        role: central_effector
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: 'The one place MYH6 dilated-cardiomyopathy variants have been studied functionally.
          Two of the founding alleles were expressed in adult rat ventricular myocytes and their contractile
          behaviour measured directly.

          The result is more interesting than a simple deficit. A1004S reduced peak sarcomere shortening;
          P830L shortened almost normally at baseline. Under beta-adrenergic stimulation the two diverged
          again, in opposite directions relative to the alpha and beta myosin controls. The authors''
          conclusion is that the two alleles alter myocyte contractility in completely different ways
          despite a shared clinical association.

          So there is no single "MYH6 contractile defect" to curate. There is a gene in which different
          disease-associated alleles perturb contraction differently - which is a substantive finding,
          and one reason the gene-level disease claim has been hard to establish.

          PROVISIONAL: adenoviral expression of human mutant protein in rat myocytes is a heterologous
          system, and no measurement has been made in human cardiac tissue or in patient-derived cardiomyocytes.'
        cell_types:
        - preferred_term: regular ventricular cardiac myocyte
          term:
            id: CL:0002131
            label: regular ventricular cardiac myocyte
        cellular_components:
        - preferred_term: sarcomere
          term:
            id: GO:0030017
            label: sarcomere
        - preferred_term: myosin filament
          term:
            id: GO:0032982
            label: myosin filament
        biological_processes:
        - preferred_term: muscle filament sliding
          term:
            id: GO:0030049
            label: muscle filament sliding
          modifier: ABNORMAL
        - preferred_term: cardiac muscle contraction
          term:
            id: GO:0060048
            label: cardiac muscle contraction
          modifier: ABNORMAL
      selected_evidence:
        snippet: Despite a shared association with DCM, the P830L and A1004S αMHC mutations alter myocyte
          contractility in completely different ways while at the same preserving peak intracellular calcium.
        supports: SUPPORT
