            description: 'Ventricular myocytes isolated from adult Sprague Dawley rats, infected with
              recombinant adenovirus carrying the P830L or A1004S mutant human alpha-myosin heavy chain,
              with sarcomere shortening and calcium transients recorded with and without isoproterenol.

              This is the single functional pillar of the entry. Its result is also the entry''s headline
