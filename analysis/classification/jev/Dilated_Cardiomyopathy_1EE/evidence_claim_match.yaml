              label: dilated cardiomyopathy 1EE
        context: []
      assertion_type: Genetic
      assertion:
        name: MYH6
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: MYH6
          term:
            id: hgnc:7576
            label: MYH6
        association: 'MYH6 encodes cardiac alpha-myosin heavy chain, the faster and less abundant of the
          two adult ventricular myosin isoforms. Heterozygous missense variants in it were proposed as
          a cause of dilated cardiomyopathy on the strength of a 2005 screen: three variants in 4.3% of
          dilated cardiomyopathy probands, in conserved residues, absent from controls, with a late-onset
          carrier phenotype.

          That claim has not strengthened with time. In March 2025 ClinGen''s Dilated Cardiomyopathy Gene
          Curation Expert Panel classified the MYH6 - dilated cardiomyopathy relationship as **Limited**
          under SOP10. Limited is the lowest classification above Disputed: it means some genetic evidence
          exists but is insufficient to establish the gene as a cause of the disease. A MYH6 variant found
          in a patient with dilated cardiomyopathy should be interpreted against that, and this entry
          types the relationship CAUSATIVE only because the OMIM-defined entity it curates makes that
          assertion - not because the evidence is settled.

          The same gene has better support for two other cardiac phenotypes: a common Icelandic variant
          confers a large increase in sick sinus syndrome risk, and MYH6 variants are recurrent in left-sided
          congenital heart defects. Both are curated as differential diagnoses. That MYH6 is genuinely
          a cardiac disease gene is not in question; what is in question is whether dilated cardiomyopathy
          is one of the things it causes.'
      selected_evidence:
        snippet: MYH6 | HGNC:7576 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited | SOP10 | Dilated
          Cardiomyopathy Gene Curation Expert Panel
        supports: SUPPORT
