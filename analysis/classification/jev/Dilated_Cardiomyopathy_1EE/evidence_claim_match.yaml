        target: Altered Sarcomere Contractile Output
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: Measures the contractile consequence of two of the founding alleles directly, and
          finds them diverging rather than converging - the observation the pathophysiology node is built
          on.
        limitations: The isoform context is wrong in a way that matters for this gene specifically. The
          adult rat ventricle is alpha-MyHC dominant while the adult human ventricle is beta-MyHC dominant,
          so a mutant alpha-MyHC is being expressed into a myocyte where the wild-type protein is the
          major ventricular isoform rather than the minor one. Expression is also adenoviral and supraphysiological
          rather than from the native locus, and nothing here was measured in human cardiac tissue or
          in patient-derived cardiomyocytes.
        readouts:
        - name: Peak sarcomere shortening (A1004S)
          target: Altered Sarcomere Contractile Output
          direction: DECREASED
          interpretation: A1004S reduced peak shortening; P830L shortened near-normally at baseline, so
            the two alleles do not share a contractile phenotype.
      selected_evidence:
        snippet: Despite a shared association with DCM, the P830L and A1004S αMHC mutations alter myocyte
          contractility in completely different ways while at the same preserving peak intracellular calcium.
        supports: SUPPORT
