  dffc363c3e875f360e377ef7689d81054fc6eab1614d6ff0aa1510ebdd9e835b:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1FF
          disease_term:
            preferred_term: dilated cardiomyopathy 1FF
            term:
              id: MONDO:0013211
              label: dilated cardiomyopathy 1FF
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Calcineurin-NFAT and Akt Signaling Activation
        biological_scale: CELLULAR
        role: intermediate
        description: 'Chronically paced cardiomyocytes expressing dominant thin-filament DCM mutations,
          including TNNI3 K36Q, show dephosphorylation and nuclear translocation of NFAT with concordant
          Akt phosphorylation, and no change in ERK activation. This is the link between an altered myofilament
          and a transcriptional remodeling program: the mutant sarcomere does not merely contract badly,
          it changes the calcium-dependent signalling that instructs the cell to remodel. Note that NFAT
          activation is not specific to the dilated direction — it is also a hypertrophic cardiomyopathy
          hallmark — so this node is a shared remodeling entry point rather than a discriminating feature
          of CMD1FF.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Calcineurin-NFAT signaling cascade
          term:
            id: GO:0033173
            label: calcineurin-NFAT signaling cascade
          modifier: INCREASED
      selected_evidence:
        snippet: We also observe dephosphorylation and nuclear translocation of the nuclear factor of
          activated T cells (NFAT), with concordant RAC-α-serine/threonine protein kinase (Akt) phosphorylation
