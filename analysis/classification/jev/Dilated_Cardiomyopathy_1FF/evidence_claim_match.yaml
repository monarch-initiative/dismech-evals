      assertion:
        name: Other genetic and acquired causes of dilated cardiomyopathy
        description: Dilated cardiomyopathy is genetically heterogeneous — titin, lamin A/C, MYH7, TNNT2,
          FLNC, RBM20, BAG3 and others — and roughly 30-40% of cases are familial, so a TNNI3 variant
          must compete with alternative genetic explanations in a gene-positive proband. Non-genetic causes
          (myocarditis, alcohol and other cardiotoxins, anthracyclines, peripartum, tachycardia-mediated,
          endocrine) must be excluded before a familial label is applied, and can also coexist with and
          unmask a genetic substrate.
      selected_evidence:
        snippet: Nongenetic forms of DCM can result from different aetiologies, including inflammation
          of the myocardium due to an infection (mostly viral); exposure to drugs, toxins or allergens;
          and systemic endocrine or autoimmune diseases.
