              label: dilated cardiomyopathy 1FF
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnni3_ad_haploinsufficiency
        hypothesis_label: Haploinsufficiency from a heterozygous truncating allele
        status: EMERGING
        description: 'A third route to dominant TNNI3 dilated cardiomyopathy has been described in human
          explanted myocardium: a heterozygous truncating allele (p.98trunc) that produces no altered
          protein but simply too little of the normal one. Troponin I fell to 39% of control with distorted
          stoichiometry across the three troponin subunits, and exchanging in recombinant wild-type troponin
          both restored protein levels and normalized every functional deficit — establishing the lesion
          as troponin-intrinsic rather than end-stage remodeling. Notably the functional consequence here
          ran in the opposite direction to the missense model: calcium sensitivity was increased, not
          decreased, with impaired length-dependent activation. Recorded as EMERGING because it rests
          on one studied heart, and because that directional discrepancy is unresolved (see the corresponding
          discussion).'
      selected_evidence:
        snippet: Moreover, upon exchange all functional deficits in the TNNI3p.98trunc and TNNT2p.K217del
          samples were normalized to control values confirming the pathogenic effects of the troponin
          mutations.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1113/jp274145
      reference_title: Genotype-specific pathogenic effects in human dilated cardiomyopathy
      evidence_source: IN_VITRO
      explanation: The troponin-exchange rescue is what establishes that the contractile defect is caused
        by the troponin lesion itself rather than by secondary end-stage remodeling in an explanted failing
        heart.
