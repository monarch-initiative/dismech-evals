        name: Family Screening of First-Degree Relatives
        description: Because the trait is dominant with incomplete and age-dependent penetrance, the diagnostic
          unit is the family rather than the proband. Longitudinal screening of first-degree relatives
          detects left ventricular systolic dysfunction before it declares itself clinically, and detection
          through a screening programme is associated with better outcomes than detection outside one.
          Carriage of a pathogenic variant is one of the main risk factors for developing dysfunction,
          so a CMD1FF genotype identifies precisely the relatives who need continuing rather than one-off
          evaluation.
        diagnosis_term:
          preferred_term: cascade family screening for dilated cardiomyopathy
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
