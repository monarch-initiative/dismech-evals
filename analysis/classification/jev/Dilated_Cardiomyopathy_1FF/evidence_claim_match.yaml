              label: dilated cardiomyopathy 1FF
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Uncoupling of Calcium Sensitivity from Troponin I Phosphorylation
        biological_scale: MOLECULAR
        role: modifier
        description: 'Beta-adrenergic stimulation normally accelerates cardiac relaxation by having protein
          kinase A phosphorylate troponin I, which desensitizes the myofilament to calcium two- to three-fold.
          In thin filaments carrying a dominant DCM allele — the CMD1FF allele K36Q among them — calcium
          sensitivity no longer tracks troponin I phosphorylation at all. The regulatory link is severed
          rather than the set point moved, so the myocardium loses the ability to change its calcium sensitivity
          on demand. This node is the substrate of the alternative mechanistic hypothesis: it predicts
          a blunted response to sympathetic drive as the operative deficit, which would show first as
          loss of contractile and relaxation reserve under stress rather than at rest.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Regulation of cardiac muscle cell contraction
          term:
            id: GO:0086004
            label: regulation of cardiac muscle cell contraction
          modifier: ABNORMAL
      selected_evidence:
        snippet: In thin filaments from normal human and mouse heart, protein kinase A (PKA) phosphorylation
          of troponin I caused a two- to three-fold decrease in myofibrillar Ca(2+) sensitivity.
        supports: SUPPORT
    origin:
