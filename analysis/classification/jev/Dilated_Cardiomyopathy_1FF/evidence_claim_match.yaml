      assertion:
        name: Molecular Genetic Testing
        description: Cardiomyopathy-panel or exome sequencing establishes the diagnosis and, as importantly,
          its zygosity. A heterozygous TNNI3 variant in a proband with a dilated ventricle points at CMD1FF;
          two loss-of-function alleles point at CMD2A; and a heterozygous missense allele must still be
          weighed against the much larger TNNI3 hypertrophic and restrictive literature before a dilated
          entity is assigned. Segregation in the family is what converts a plausible variant into a diagnosis,
          which is why the founding report evaluated its candidates by segregation analysis and control
          screening rather than by computational prediction.
        diagnosis_term:
          preferred_term: cardiomyopathy gene panel or exome sequencing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Genomic DNA was isolated and TNNI3 exons screened by heteroduplex analysis. Exons with
          aberrant profiles were sequenced and variants evaluated by segregation analysis and study of
          normal controls.
