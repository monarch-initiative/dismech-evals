      assertion_type: Pathophysiology
      assertion:
        name: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
        conforms_to: cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction
        biological_scale: CELLULAR
        role: amplifier
        description: At the level of the single myocyte the thin-filament lesion produces significantly
          reduced fractional shortening together with a reduced systolic calcium transient, with slowed
          contraction and slowed calcium reuptake. Sarcoplasmic reticulum calcium load rises while fractional
          release falls, reflecting reduced SERCA activity and increased sodium-calcium exchanger activity.
          These changes were shown for the CMD1FF allele K36Q alongside dominant DCM alleles in troponin
          T and tropomyosin, and were common to all three — evidence that this node is a shared convergence
          point of thin-filament dilated cardiomyopathy rather than an idiosyncrasy of one variant.
        cell_types:
        - preferred_term: Cardiac ventricular myocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Cardiac muscle cell contraction
          term:
            id: GO:0086003
            label: cardiac muscle cell contraction
          modifier: DECREASED
        - preferred_term: Intracellular calcium ion homeostasis
          term:
            id: GO:0006874
            label: intracellular calcium ion homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: In this work we have studied the functional consequences of mutations in cardiac troponin
          T (R131W), cardiac troponin I (K36Q) and α-tropomyosin (E40K) using adenovirally transduced
          isolated guinea pig left ventricular cardiomyocytes. We find significantly reduced fractional
          shortening with reduced systolic Ca2+.
        supports: SUPPORT
