            label: Genetic Counseling
      selected_evidence:
        snippet: 'Our review revealed consensus on several key aspects: the definition of DCM, the use
          of B-type natriuretic peptides and high-sensitivity troponin in laboratory testing, the essential
          role of multimodality cardiovascular imaging for initial diagnosis, genetic counselling, and
          the management of advanced disease.'
        supports: SUPPORT
