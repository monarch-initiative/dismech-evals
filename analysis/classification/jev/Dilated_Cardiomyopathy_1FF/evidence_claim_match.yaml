  4a206bc8800acb500ad272fe902738caf11eb7bf363b83be3087022ef3bcbab6:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1FF
          disease_term:
            preferred_term: dilated cardiomyopathy 1FF
            term:
              id: MONDO:0013211
              label: dilated cardiomyopathy 1FF
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd1ff_no_animal_model
        prompt: Does any whole-animal model of dominant TNNI3 dilated cardiomyopathy exist, and what does
          its absence cost the mechanistic account?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Adverse Ventricular Remodeling
        rationale: Every functional result behind this entry comes from reconstituted proteins, permeabilized
          human cardiomyocytes, or acutely transduced isolated myocytes. No knock-in animal carrying a
          CMD1FF allele has been reported, in contrast to the thin-filament DCM field generally, where
          knock-in mouse models exist for TNNT2 and TPM1 alleles and where the Tnni3-null mouse anchors
          the recessive entity. Consequently the steps from myofilament defect through remodeling to a
          dilated ventricle are asserted here from dilated cardiomyopathy as a class rather than demonstrated
          for this genotype, and questions that need an intact circulation — penetrance, the trigger for
          conversion from latent to manifest disease, and whether beta-blockade acts differently when
          phosphorylation-sensitivity coupling is lost — cannot currently be addressed.
        proposed_experiments:
        - experiment_id: exp_cmd1ff_knockin_mouse
          name: Tnni3 K36Q or N185K knock-in mouse
          description: Generate a heterozygous knock-in carrying a CMD1FF allele at the endogenous locus
            and characterize penetrance, age of onset, ventricular geometry, fibrosis and response to
            beta-blockade, to test whether the in vitro myofilament defect is sufficient for the disease.
      selected_evidence:
        snippet: 'To date, five gene-targeted knock-in mouse models of DCM carrying thin-filament mutations
          have been characterized: TnT ΔK210 (10), R141W (36), and R134W (15); actin E99K (46); and αTM
          E54K (35).'
        supports: SUPPORT
