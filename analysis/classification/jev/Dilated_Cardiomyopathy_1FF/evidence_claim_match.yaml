              label: ACE Inhibitor
          - preferred_term: beta-blocker
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
          - preferred_term: mineralocorticoid receptor antagonist (spironolactone as the class exemplar)
            term:
              id: NCIT:C840
              label: Spironolactone
      selected_evidence:
        snippet: As DCM eventually leads to impaired contractility, standard approaches to prevent or
          treat heart failure are the first-line treatment for patients with DCM.
        supports: SUPPORT
