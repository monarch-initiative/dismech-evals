              early-onset familial disease and each shown to alter thin-filament calcium regulation on
              reconstitution. A heterozygous truncating allele (p.98trunc) has additionally been characterized
              in explanted human myocardium and behaves as pure haploinsufficiency rather than as an altered-function
              allele. A TNNI3 variant list cannot be interpreted without its zygosity and variant class:
              the same gene''s heterozygous missense alleles more commonly cause hypertrophic (CMH7) and
              restrictive (RCM1) cardiomyopathy, and its biallelic null genotypes cause the recessive
              infantile entity CMD2A. Note that the p.Arg98* nonsense allele appears on both sides of
              that line — homozygous in reported CMD2A patients, and studied heterozygously as a haploinsufficient
              DCM allele — so allele identity alone does not assign an entity.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: TNNI3 p.98trunc (heterozygous)
        description: Heterozygous truncating allele studied in explanted left ventricular tissue from
          a transplanted DCM patient. Troponin I fell to 39% of control with distorted subunit stoichiometry,
          and exchange with recombinant wild-type troponin restored protein levels and normalized the
          functional deficits. It is the evidence that haploinsufficiency, not only altered function,
          is a route to dominant TNNI3 dilated cardiomyopathy.
        gene:
          preferred_term: TNNI3
          term:
            id: hgnc:11947
            label: TNNI3
      selected_evidence:
        snippet: Exchange with wild‐type troponin complex corrected troponin protein levels to 83% of
          controls in the TNNI3p.98trunc sample.
        supports: SUPPORT
