      assertion_type: Discussion
      assertion:
        discussion_id: cmd1ff_versus_cmd2a_split
        prompt: Is dominant TNNI3 dilated cardiomyopathy (CMD1FF) a separate dismech entity from recessive
          TNNI3 dilated cardiomyopathy (CMD2A), or should it be a subtype of it?
        kind: INTERPRETATION
        status: RESOLVED
        attaches_to:
        - pathophysiology#Heterozygous TNNI3 Variant Altering Cardiac Troponin I
        rationale: 'The two share a gene and an organ-level phenotype, so the split needs a reason beyond
          having two OMIM numbers. Four independent axes support it. Mechanism: CMD2A abolishes cardiac
          troponin I, whereas CMD1FF always retains a wild-type allele and — for the founding missense
          alleles — puts an altered protein into the troponin complex, so the lesion is a change in what
          the thin filament does rather than an absence of it. Direction of functional effect: the CMD1FF
          alleles lower maximum ATPase and calcium sensitivity, whereas the troponin I-null heart is characterized
          by global regulatory failure timed by a developmental isoform switch, a clock that has no meaning
          when one allele is intact. Natural history: obligate neonatal-to-infantile and near-uniformly
          severe in CMD2A, versus variable, incompletely penetrant, childhood-to-adult onset in CMD1FF.
          Clinical action: 50% per-offspring recurrence with longitudinal surveillance of first-degree
          relatives, versus 25% per sibship with carrier testing and reproductive counselling. ClinGen''s
          Dilated Cardiomyopathy GCEP reinforces this by issuing two separate TNNI3-DCM assertions differing
          only in mode of inheritance, both rated Strong. Recorded as RESOLVED in favour of a separate
          entry; if MONDO or ClinGen later collapses the two, this entry and CMD2A should be merged rather
          than left to duplicate each other.'
      selected_evidence:
        snippet: TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong
        supports: SUPPORT
    origin:
