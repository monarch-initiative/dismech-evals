      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: 'CMD1FF is transmitted as an autosomal dominant trait: a single heterozygous TNNI3
          allele is sufficient, transmission follows the classic vertical pattern, and each offspring
          of a carrier has a 50% recurrence risk. Penetrance is incomplete and expressivity variable,
          so a genotype-positive relative may be phenotype-negative for years — which is what makes longitudinal
          cascade surveillance, rather than a single screening echocardiogram, the appropriate family
          strategy. This dominant mode is the axis on which CMD1FF separates from CMD2A, where two loss-of-function
          alleles are required and heterozygous parents are typically unaffected.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: These are the first reported autosomal dominant DCM-causing mutations in TNNI3, and so
          the findings expand the spectrum of disease-causing genes that lead to either hypertrophic cardiomyopathy
          or DCM depending on the specific mutation.
        supports: SUPPORT
