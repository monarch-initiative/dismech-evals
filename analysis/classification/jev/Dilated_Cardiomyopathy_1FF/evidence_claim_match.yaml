      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnni3_ad_altered_thin_filament_regulation
        hypothesis_label: Altered thin-filament calcium regulation by mutant cTnI
        status: CANONICAL
        description: The canonical model holds that a heterozygous TNNI3 missense allele produces a full-length
          but functionally altered cardiac troponin I that is incorporated into the thin filament alongside
          the wild-type protein, and changes what the troponin complex does rather than how much of it
          there is. Reconstitution of troponin with either founding mutant (Lys36Gln, Asn185Lys) lowers
          the maximum actin-tropomyosin-activated myosin ATPase rate and lowers calcium sensitivity, and
          the resulting thin filaments have reduced calcium affinity. This is the same functional signature
          carried by proven dominant DCM alleles in the other thin-filament proteins, and it is directionally
          opposite to the calcium-sensitizing TNNI3 alleles that cause hypertrophic and restrictive cardiomyopathy
          — which is the mechanistic reason one gene produces three dominant cardiomyopathies. The consequence
          at the cell level is a weaker, slower contraction with a suppressed systolic calcium transient.
      selected_evidence:
        snippet: HCM and RCM models tended to have increased calcium sensitivity and DCM decreased sensitivity
          (P < .001).
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32278834
      reference_title: Meta-analysis of cardiomyopathy-associated variants in troponin genes identifies
        loci and intragenic hot spots that are associated with worse clinical outcomes.
      evidence_source: OTHER
      explanation: Establishes across the pooled troponin-variant literature that the calcium-sensitivity
        direction separates dilated from hypertrophic and restrictive disease, which is the generalization
        this model places CMD1FF inside. Evidence source is OTHER because it is a meta-analysis of previously
        published functional models rather than a single study type.
