        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Thin-Filament Calcium Regulation
        biological_scale: MOLECULAR
        role: intermediate
        description: With a mutant cTnI in the troponin complex, the thin filament's translation of calcium
          binding into cross-bridge activation is degraded. For the founding CMD1FF missense alleles this
          takes the form of a lower maximum actin-tropomyosin-activated myosin ATPase rate, lower calcium
          sensitivity, and reduced calcium affinity of the mutant thin filaments — a coordinated loss
          of activation rather than a leak of inhibition. This calcium-desensitizing direction is what
          places CMD1FF with the other dominant thin-filament dilated cardiomyopathies and separates it
          from the calcium-sensitizing TNNI3 alleles of hypertrophic and restrictive disease. In the reported
          haploinsufficient truncating case the measured direction was the opposite, which this entry
          records as an unresolved discrepancy rather than smoothing over.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Regulation of cardiac muscle contraction
          term:
            id: GO:0055117
            label: regulation of cardiac muscle contraction
          modifier: ABNORMAL
        - preferred_term: Regulation of striated muscle contraction
          term:
            id: GO:0006942
            label: regulation of striated muscle contraction
          modifier: ABNORMAL
      selected_evidence:
        snippet: Previous work has shown that changes to myofilament Ca2+ sensitivity caused by DCM mutations
          are qualitatively opposite from hypertrophic cardiomyopathy (HCM) mutations in the same genes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
