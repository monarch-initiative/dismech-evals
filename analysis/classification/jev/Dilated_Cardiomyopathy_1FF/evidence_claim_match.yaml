        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnni3_ad_pka_uncoupling
        hypothesis_label: Uncoupling of myofilament calcium sensitivity from troponin I phosphorylation
        status: ALTERNATIVE
        description: A competing, more specific proposal is that the primary defect is not the change
          in baseline calcium sensitivity at all, but the loss of its regulation. In normal thin filaments,
          protein kinase A phosphorylation of troponin I desensitizes the myofilament two- to three-fold,
          which is how beta-adrenergic stimulation accelerates relaxation. In thin filaments containing
          any of a panel of dominant DCM alleles — including the CMD1FF allele K36Q — calcium sensitivity
          no longer moves with troponin I phosphorylation at all. On this model the heart's inotropic
          and lusitropic reserve is what is lost, and chronic failure follows from the blunted beta-adrenergic
          response rather than from the resting sensitivity shift. It is recorded as ALTERNATIVE rather
          than CANONICAL because it has been demonstrated in vitro across mutant thin filaments but not
          yet shown to be the rate-limiting lesion in a CMD1FF patient or animal.
      selected_evidence:
        snippet: We conclude that DCM-causing mutations in thin filament proteins abolish the relationship
          between myofilament Ca(2+) sensitivity and troponin I phosphorylation by PKA.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
