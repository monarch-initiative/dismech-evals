      assertion_type: ExperimentalModel
      assertion:
        name: Adenovirally transduced adult guinea pig left ventricular cardiomyocytes expressing TNNI3
          K36Q
        description: Isolated adult guinea pig left ventricular myocytes transduced with FLAG-tagged K36Q
          cardiac troponin I alongside wild-type controls, paced and assayed for sarcomere shortening,
          calcium transients, sarcoplasmic reticulum load, and signalling. Guinea pig was chosen because
          its calcium handling resembles the human more closely than the mouse does. The design isolates
          the primary effect of the mutant protein before secondary remodeling, which is exactly what
          a patient-derived explant cannot do — and it studies the actual CMD1FF allele rather than a
          proxy.
        experimental_model_type: OTHER
        organism:
          preferred_term: domestic guinea pig
          term:
            id: NCBITaxon:10141
            label: Cavia porcellus
        cell_types:
        - preferred_term: Cardiac ventricular myocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        publication: PMID:32618513
        modeled_mechanisms:
        - target: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The model's central result is reduced fractional shortening with a suppressed systolic
            calcium transient in cells carrying the CMD1FF allele.
          limitations: 'Acute adenoviral overexpression in a non-human myocyte is not the same as lifelong
            heterozygous expression in a human heart: mutant and wild-type protein ratios are set by transduction
            rather than by allele dosage, and the 48-hour timescale excludes chronic adaptation. Guinea
            pig calcium handling is closer to human than murine but is still not human.'
          readouts:
          - name: Fractional sarcomere shortening
            target: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
            direction: DECREASED
            interpretation: Contractile output of the single myocyte carrying the mutant allele.
          - name: Systolic calcium transient amplitude
            target: Reduced Cardiomyocyte Contractility and Systolic Calcium Transient
            direction: DECREASED
            interpretation: Calcium available to activate the myofilament, measured by fura-2 ratiometry
              in the same cells.
        - target: Calcineurin-NFAT and Akt Signaling Activation
          relationship: MEASURES
          fidelity: MODERATE
          description: The model supplies the signalling readouts linking the mutant myofilament to a
            remodeling transcriptional program.
          limitations: NFAT and Akt were assayed in chronically paced isolated cells over hours; no remodeling
            phenotype develops in this system, so the link from signalling to tissue remodeling is inferred
            rather than observed here.
          readouts:
          - name: NFAT nuclear translocation
            target: Calcineurin-NFAT and Akt Signaling Activation
            direction: INCREASED
            interpretation: Activation of calcium-dependent remodeling signalling.
      selected_evidence:
        snippet: 'In this study we set out to investigate the functional effect of DCM-causing mutations
          in three separate thin-filament regulatory proteins: TnT R131W, TnI K36Q, and α-TM E40K, using
          our established adult guinea pig left ventricular cardiomyocyte model (39).'
        supports: SUPPORT
