      assertion:
        name: Genetic Counseling and Cascade Screening
        description: 'Counseling for a 50% per-offspring recurrence risk, predictive testing of first-degree
          relatives, and enrolment of genotype-positive relatives in longitudinal cardiac surveillance.
          The counseling content differs materially from CMD2A''s: there the conversation is about a 25%
          sibship risk and unaffected carrier parents, here it is about vertical transmission, incomplete
          penetrance, and the fact that a normal echocardiogram today does not discharge a carrier. Genetic
          counseling is one of the few points on which international DCM guidelines already agree.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
