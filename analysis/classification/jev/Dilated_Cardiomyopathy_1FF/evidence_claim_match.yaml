            term:
              id: MONDO:0013211
              label: dilated cardiomyopathy 1FF
        context: []
      assertion_type: Treatment
      assertion:
        name: Guideline-Directed Heart Failure Pharmacotherapy
        description: 'Standard anti-remodeling heart-failure therapy — renin-angiotensin system blockade,
          a beta-blocker, and a mineralocorticoid receptor antagonist — targeting the neurohormonal and
          remodeling amplifier downstream of the myofilament lesion. There is no TNNI3-directed or myofilament-correcting
          therapy for CMD1FF, so management is the generic dilated-cardiomyopathy regimen. One caveat
          is worth recording: if the uncoupling hypothesis is correct, the myofilament in this disease
          no longer responds to phosphorylation-mediated calcium desensitization, which is the arm of
          beta-adrenergic signalling that beta-blockade modulates — a reason to expect generic therapy
          to work through remodeling rather than through restoring myofilament regulation.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ACE inhibitor
            term:
