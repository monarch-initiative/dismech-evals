      assertion:
        name: Dilated cardiomyopathy 2A (recessive TNNI3 disease)
        description: The same gene, the opposite zygosity, and a different mechanism. CMD2A requires two
          loss-of-function alleles, abolishes cardiac troponin I entirely, and presents in the neonatal
          period or first year with refractory heart failure once the perinatal troponin I isoform switch
          withdraws the substituting slow skeletal isoform. Heterozygous parents are typically unaffected.
          A biallelic truncating genotype in an infant is CMD2A, not CMD1FF, and the recurrence risk and
          reproductive counselling that follow are different (25% per sibship rather than 50% per offspring).
      selected_evidence:
        snippet: In recent years, however, an increasing amount of evidence has validated the hypothesis
          that biallelic TNNI3 null mutations cause a severe form of neonatal dilated cardiomyopathy.
        supports: SUPPORT
