  390d5018257bcb38345201e80ee8a78a8365e616c43698ba6fbd5ff377d9df84:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1FF
          disease_term:
            preferred_term: dilated cardiomyopathy 1FF
            term:
              id: MONDO:0013211
              label: dilated cardiomyopathy 1FF
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd1ff_calcium_sensitivity_direction_conflict
        prompt: Do all dominant TNNI3 dilated-cardiomyopathy alleles decrease myofilament calcium sensitivity,
          given that the one heterozygous truncating allele studied in human myocardium increased it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Thin-Filament Calcium Regulation
        - mechanistic_hypotheses#tnni3_ad_haploinsufficiency
        rationale: 'The organising generalization for dominant thin-filament dilated cardiomyopathy is
          that its alleles desensitize the myofilament to calcium, opposite to the sensitizing hypertrophic
          and restrictive alleles — and the two founding CMD1FF missense alleles behave that way on reconstitution.
          But the single heterozygous TNNI3 truncating allele characterized in explanted human myocardium
          showed pure haploinsufficiency with *increased* calcium sensitivity and impaired length-dependent
          activation. Both results are credible and neither is a measurement error: they differ in allele
          class (altered-function missense versus reduced-quantity truncation), in preparation (reconstituted
          proteins versus permeabilized human cardiomyocytes), and in whether secondary remodeling of
          an end-stage explanted heart could contribute. Whether the two allele classes reach the same
          disease by opposite myofilament routes, or whether one of them belongs to a different mechanism
          entirely, is unresolved — and it matters, because a calcium-sensitizer or -desensitizer therapy
          would be predicted to help one group and harm the other.'
        proposed_experiments:
        - experiment_id: exp_cmd1ff_allele_class_calcium_sensitivity_series
          name: Paired calcium-sensitivity measurement across CMD1FF missense and truncating alleles
          description: Measure myofilament calcium sensitivity and length-dependent activation in one
            preparation across a panel of heterozygous TNNI3 dilated-cardiomyopathy alleles spanning both
            classes, so the direction of effect is not confounded by differences in assay system.
        - experiment_id: exp_cmd1ff_isogenic_ipsc_allele_comparison
          name: Isogenic human iPSC-cardiomyocyte comparison of missense versus truncating TNNI3 alleles
          description: Introduce K36Q, N185K, and a truncating TNNI3 allele into a single isogenic human
            iPSC background and compare calcium sensitivity, contractility, and length-dependent activation,
            removing both the species and the end-stage remodeling confounds.
      selected_evidence:
        snippet: Analysis of Ca(2+) regulation of actin-tropomyosin-activated myosin ATPase by troponin
          revealed that troponin reconstituted with either mutant troponin I gave lower maximum ATPase
          rates and lower Ca(2+) sensitivity than wild type.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19590045
      reference_title: Identification and functional characterization of cardiac troponin I as a novel
