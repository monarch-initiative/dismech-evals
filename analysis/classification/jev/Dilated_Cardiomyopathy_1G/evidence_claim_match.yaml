      assertion:
        name: TTN Truncating Variant in the A-Band
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: 'The initiating lesion in CMD1G is a titin truncating variant (TTNtv) - a nonsense,
          frameshift, splice-disrupting, or copy-number change predicted to substantially alter the full-length
          titin polypeptide. Position is the critical determinant of pathogenicity: disease-associated
          TTNtv are located predominantly in the inextensible A-band, the segment that binds myosin and
          myosin-binding protein C and is thought to be critical for biomechanical sensing and signaling.
          This positional dependence is what separates pathogenic from benign truncations, since TTNtv
          also occur in the general population.'
