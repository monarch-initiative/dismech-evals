  1d45ac07639c623c854d535cb49c7e2e10a7353a95aa36ea0e5bdeea293982e3:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1G
          disease_term:
            preferred_term: dilated cardiomyopathy 1G
            term:
              id: MONDO:0011400
              label: dilated cardiomyopathy 1G
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sarcomere Insufficiency and Impaired Mechanosensing
        biological_scale: MOLECULAR
        role: effector
        description: 'Titin is the molecular ruler and elastic backbone of the sarcomere: it templates
          myofibril assembly, provides the passive restoring force of diastole, and transduces mechanical
          strain into signalling at the Z-disc and M-band. A truncating allele removes full-length titin
          from half the molecular pool, and the truncated product does not substitute for it. The consequence
          is a sarcomere that assembles and transmits force imperfectly and that senses mechanical load
          abnormally - a contractile and mechanosensing deficit rather than the hypercontractility of
          the hypertrophic sarcomeropathies. Human heart tissue analyses integrating RNA and protein data
          underpin the discrimination of pathogenic from benign truncations on this basis.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Cardiac Myofibril Assembly
          term:
            id: GO:0055003
            label: cardiac myofibril assembly
          modifier: ABNORMAL
        - preferred_term: Muscle Contraction
          term:
            id: GO:0006936
            label: muscle contraction
          modifier: DECREASED
      selected_evidence:
        snippet: we coupled TTN gene sequencing with cardiac phenotyping in 5267 individuals across the
          spectrum of cardiac physiology and integrated these data with RNA and protein analyses of human
          heart tissues
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25589632
      reference_title: Integrated allelic, transcriptional, and phenomic dissection of the cardiac effects
