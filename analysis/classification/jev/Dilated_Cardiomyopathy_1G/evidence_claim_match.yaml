          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Sarcomeric A band
          term:
            id: GO:0031672
            label: A band
      selected_evidence:
        snippet: Our previous study of severe and familial DCM identified TTNtv that were located predominantly
