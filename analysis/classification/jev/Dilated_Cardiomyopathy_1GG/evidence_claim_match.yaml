  b89c9c97f7ea09798b0a33cdf0fc7e7f642f90578068bb61a851f62bbc80d538:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1GG
          disease_term:
            preferred_term: dilated cardiomyopathy 1GG
            term:
              id: MONDO:0013339
              label: dilated cardiomyopathy 1GG
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dcm1gg_riboflavin_untested
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Complex II is the only respiratory-chain complex with a flavin cofactor, and riboflavin
          has been given to patients with complex II deficiency. Has it ever been tried in the cardiac-restricted
          form, and would it be expected to help an allele whose defect is a destabilised subunit interface
          rather than impaired flavinylation?
        attaches_to:
        - treatments#Heart Failure Supportive Care
        - pathophysiology#Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
        rationale: 'No treatment is curated for the enzyme defect in this entry because none is supported
          for it, and this discussion records why rather than leaving the omission unexplained. The evidence
          that exists is about complex II deficiency as a biochemical class, is weak, and points in both
          directions: a systematic review of riboflavin across inherited metabolic diseases classifies
          its effect in complex II deficiency as uncertain by an explicit threshold, meaning fewer than
          three-quarters of patients responded, while individual reports describe mild improvement on
          mitochondrial cocktails that include riboflavin. None of that evidence comes from a patient
          with this disorder. There is also a mechanistic reason for caution specific to this allele:
          the defect here is a destabilised interface between the flavoprotein and the iron-sulfur subunit,
          not a failure to acquire the flavin cofactor, so cofactor supplementation does not have an obvious
          target. Curating riboflavin as a treatment of this disease would assert an indication the literature
          does not support.'
      selected_evidence:
        snippet: RF therapy was considered "effective" in an IMD if more than 75% of patients showed a
          positive response, "uncertain" in case of a positive response in fewer than 75% of patients
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42046426
      reference_title: 'Effectiveness of Riboflavin in Inherited Metabolic Diseases: A Systematic Review.'
      evidence_source: HUMAN_CLINICAL
      explanation: Defines what the "uncertain" verdict means, so the finding above is not read as a stronger
        or weaker claim than it is.
