            description: A clonal human SDHA-knockout line into which individual SDHA missense variants
              are reintroduced by site-specific recombination, after which succinate dehydrogenase activity
              and SDHA protein abundance are measured for each variant. It is the only published system
              in which this disorder's allele has been assayed in isolation in a human genetic background.
              The panel includes p.Gly555Glu, which scores at the low end of enzymatic activity, and the
              authors attribute its effect to disruption of SDHA-SDHB binding - a full-text derivation
              recorded in this entry's notes rather than a verified quotation, because the cached reference
              is abstract-only and names no individual variant.
            publication: PMID:39321216
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
        relationship: MEASURES
        fidelity: MODERATE
        description: The system measures the enzymatic consequence of the single allele on a null background,
          isolating the variant's effect from genetic modifiers and from the patient's tissue context.
          It agrees with the independent immunochemical evidence from patient material that the lesion
          is at the SDHA-SDHB interface.
        limitations: The study was designed to classify cancer-associated variants, not to model a cardiomyopathy,
          and HAP1 is a near-haploid chronic myelogenous leukaemia derivative rather than a cardiomyocyte
          - so it cannot address the tissue restriction that defines this disease, which is its central
          mechanistic question. The assay measures variant function on a knockout background at non-native
          expression, not the biology of a homozygous germline allele in myocardium. The authors themselves
          note that activity-score similarity between p.Gly555Glu and an unrelated cancer variant may
          reflect artefacts of this model system.
      selected_evidence:
        snippet: SDHA variants were introduced into a clonal SDHA-knockout cell line via Bxb1-mediated
          recombination. SDH activity and SDHA abundance were determined for each variant
        supports: SUPPORT
