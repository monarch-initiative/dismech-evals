  00cff054daeb937d6764d6cea4a4bbe27961a9550f7e32cc301eda3e0f48ed42:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1GG
          disease_term:
            preferred_term: dilated cardiomyopathy 1GG
            term:
              id: MONDO:0013339
              label: dilated cardiomyopathy 1GG
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dcm1gg_no_animal_model
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: No in vivo model carries SDHA p.Gly555Glu, and the one cardiac complex II model that exists
          disables an assembly factor in a tissue chosen by the experimenter. What model would let the
          tissue selectivity of this disease be studied rather than assumed?
        attaches_to:
        - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
        - disease#Dilated Cardiomyopathy 1GG
        rationale: 'No model of this disorder''s allele exists, but the gap is narrower than "no model",
          and the distinction matters. A conditional cardiac knockout of Sdhaf4, the assembly factor that
          brings SDHA together with SDHB, is curated in this entry''s animal models: it reproduces the
          SDHA-SDHB interface failure, the loss of assembled complex II, and progressive lethal dilated
          cardiomyopathy, and it is the model in which fumarate rescue was demonstrated. What it does
          not and cannot provide is the two things peculiar to this disease. It carries a null allele
          of a different gene rather than a hypomorphic missense substitution in the flavoprotein, so
          it cannot test whether an assembled but destabilised holoenzyme behaves the same way; and its
          cardiac restriction is imposed by the Cre driver rather than arising on its own, so it cannot
          address why a homozygous allele present in every cell disables the heart alone.

          Searches run on 2026-08-31 for Sdha knockout, knock-in, conditional-deletion and heterozygous
          mouse models, for Drosophila SdhA models, and for Caenorhabditis elegans complex II mutants
          returned no SDHA-subunit model of cardiomyopathy; the well-known nematode complex II mutant
          mev-1 is a cytochrome b (SDHC) allele, not an SDHA one, and the recently modelled SDHD H50R
          is a different subunit again. Beyond the Sdhaf4 mouse, the published functional work on this
          entity''s allele is confined to patient material and to a human knockout cell line, both curated
          in this entry. Scarcity of models is a recognised field-wide obstacle for complex II disease
          rather than a gap peculiar to this disorder. The consequence here is specific: the tissue-restriction
          question above cannot be settled in patient tissue alone, because the cardiac samples that would
          be needed come only from autopsy.'
        proposed_experiments:
        - experiment_id: dcm1gg_sdha_g555e_knockin_mouse
          name: Knock-in mouse carrying the orthologous Sdha Gly555Glu substitution
          description: Generate a homozygous knock-in of the residue-equivalent substitution and compare
            succinate dehydrogenase activity, assembled complex II abundance and contractile function
            across heart, skeletal muscle and brain, to test whether the tissue restriction reproduces
            outside the human founder background.
          would_support:
          - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
          supporting_outcome:
          - Homozygous animals show a cardiac-predominant enzyme deficit and dilated cardiomyopathy with
            preserved neurological function, reproducing the human tissue distribution.
          would_refute:
          - pathophysiology#Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
          refuting_outcome:
          - Homozygous animals show a uniform enzyme deficit across tissues, or an encephalopathic rather
            than cardiac phenotype, indicating that the tissue restriction depends on human-specific or
            founder-background factors rather than on the allele.
      selected_evidence:
        snippet: Further progress in understanding the role of complex II in disease, and in the development
          of new therapeutic approaches, is now being hampered by the lack of relevant cell and animal
          models.
        supports: SUPPORT
