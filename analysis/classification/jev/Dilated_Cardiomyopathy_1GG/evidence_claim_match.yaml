          in this entry. Cascade testing of relatives needs one caveat stated up front, because the founding
          report ran into it: a homozygous result does not predict disease. The father of one patient
          carried two copies of the allele and was clinically normal, so an asymptomatic homozygous relative
          should be offered cardiac surveillance rather than a diagnosis.'
