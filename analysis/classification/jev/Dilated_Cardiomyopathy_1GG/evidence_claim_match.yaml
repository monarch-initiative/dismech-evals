  2cb0f5bb1a5247a4d2b5f87894b6ef72166f2d996a3cd6fc97a8cbf6086d233b:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1GG
          disease_term:
            preferred_term: dilated cardiomyopathy 1GG
            term:
              id: MONDO:0013339
              label: dilated cardiomyopathy 1GG
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Myocardium-Restricted Loss of Succinate Dehydrogenase Activity
        description: 'The node that distinguishes this disease from every other SDHA phenotype, and the
          one nothing published explains. The same homozygous allele, present in every cell, produces
          a severe deficit of succinate dehydrogenase activity in cardiac muscle while substantial activity
          persists in skeletal muscle and in lymphoblastoid cells. The measured residual activities -
          roughly 15-21% of control in heart against 50-56% in skeletal muscle and 60-63% in lymphoblastoid
          cells - are a full-text derivation recorded in this entry''s notes; the cached abstract states
          the pattern qualitatively.

          Every explanation available for tissue-restricted respiratory-chain disease elsewhere is unavailable
          here. There is no heteroplasmy to invoke, because all four complex II subunits and both relevant
          assembly factors are nuclear-encoded and therefore present at the same dose in every tissue.
          The reporting authors sequenced SDHB, SDHD and SDHAF1 and found no modifier allele. What remains
          is a tissue-dependent difference in how much residual complex II a cell can tolerate, or in
          how efficiently the destabilised interface is assembled or degraded in cardiac mitochondria,
          and neither has been tested.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: succinate dehydrogenase activity
          modifier: DECREASED
          term:
            id: GO:0000104
            label: succinate dehydrogenase activity
        locations:
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
            label: myocardium
      selected_evidence:
        snippet: The cardiomyopathy is presumably caused by the significant tissue-specific reduction
