          the reported patient with cardiomyopathy and leukodystrophy; in DCM1GG the cardiac disease is
          isolated.
        - 'The tissue distribution of the enzyme deficit differs in kind: in DCM1GG the deficiency is
          severe in myocardium and partial elsewhere, whereas isolated complex II deficiency in MC2DN1
          is characteristically demonstrable in skeletal muscle or fibroblasts.'
