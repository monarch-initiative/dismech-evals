        description: 'Homozygosity for SDHA c.1664G>A, which substitutes a small uncharged glycine at
          position 555 of the flavoprotein subunit with glutamic acid. The residue lies in the region
          through which the flavoprotein contacts the iron-sulfur subunit, and the substitution introduces
          a charged side chain into that interface. This is a missense, interface-destabilising allele
          rather than a null: residual enzyme activity is measurable in every tissue examined, which is
          why the functional impact is recorded as partial rather than complete loss of function.'
        biological_scale: MOLECULAR
