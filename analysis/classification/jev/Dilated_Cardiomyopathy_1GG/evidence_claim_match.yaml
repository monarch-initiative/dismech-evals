      assertion_type: Diagnosis
      assertion:
        name: Respiratory-chain enzymology on cardiac tissue
        description: Measuring succinate dehydrogenase activity establishes the biochemical diagnosis,
          but the tissue chosen determines whether the defect is seen. Cardiac muscle shows the severe
          deficit; skeletal muscle and lymphoblastoid cells retain substantial activity, so a near-normal
          result in those tissues does not exclude the disorder.
      selected_evidence:
        snippet: The cardiomyopathy is presumably caused by the significant tissue-specific reduction
          in SDH enzymatic activity in the heart muscle, whereas substantial activity is retained in the
          skeletal muscle and lymphoblastoid cells.
        supports: SUPPORT
