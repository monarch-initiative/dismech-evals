          route. Because the same genotype occurs in patients with Leigh syndrome, a positive result establishes
          biallelic SDHA deficiency but does not by itself assign the patient to this disease rather than
          to mitochondrial complex II deficiency, nuclear type 1; that assignment rests on the clinical
          distribution.
