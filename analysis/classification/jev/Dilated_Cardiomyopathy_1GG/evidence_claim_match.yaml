        description: 'The primary differential and the genuinely hard one, curated separately in `kb/disorders/Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml`.
          It is not a mimicking disease but the other phenotypic outcome of the same lesion, and unlike
          the boundary with NDAXOA it cannot be drawn by zygosity: both are biallelic, and the p.Gly555Glu
          allele this entry is built on has itself been reported homozygous in a lethal infantile presentation
          and in Leigh syndrome. The discriminator is which organ failed, and nothing published explains
          why it differs.'
        distinguishing_features:
        - Neurological involvement is the discriminator. MC2DN1 presents with Leigh syndrome, leukodystrophy,
          developmental regression or seizures; the DCM1GG cohort had psychomotor development appropriate
          for age and no seizures.
        - Zygosity does not separate them. Both are recessive and biallelic, and the same homozygous p.Gly555Glu
          genotype has been published in both phenotypes.
