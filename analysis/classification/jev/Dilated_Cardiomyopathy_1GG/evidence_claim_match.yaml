      assertion_type: Biochemical
      assertion:
        name: Succinate dehydrogenase activity in cardiac muscle
        notes: Respiratory-chain enzymology on cardiac tissue is the assay that demonstrates the lesion
          in this disorder, and it is the only tissue in which the deficit is severe. Assays on skeletal
          muscle or on cultured blood-derived cells retain substantial activity and can therefore be misleadingly
          close to normal.
      selected_evidence:
        snippet: The cardiomyopathy is presumably caused by the significant tissue-specific reduction
          in SDH enzymatic activity in the heart muscle, whereas substantial activity is retained in the
          skeletal muscle and lymphoblastoid cells.
        supports: SUPPORT
