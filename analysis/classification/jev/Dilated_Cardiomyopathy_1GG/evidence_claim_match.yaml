      assertion_type: Pathophysiology
      assertion:
        name: Cardiomyocyte Bioenergetic Failure
        description: Loss of complex II activity in the cardiomyocyte interrupts two coupled pathways
          at once, which is the specific consequence of the lesion sitting in this enzyme rather than
          in any other respiratory-chain complex. Succinate is no longer efficiently oxidised to fumarate,
          so tricarboxylic acid cycle flux is impaired; and the electrons that oxidation would have delivered
          no longer reach ubiquinone, so that entry point into the electron transport chain is lost. The
          result is a chronic shortfall in oxidative ATP supply in a tissue with continuous, non-negotiable
          contractile demand and little capacity to reduce it.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
