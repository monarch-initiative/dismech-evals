      assertion_type: Pathophysiology
      assertion:
        name: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
        description: 'The molecular consequence of the substitution, and the step at which the published
          biochemistry is most direct. In the proband studied by immunochemistry, the amount of flavoprotein
          and of the iron-containing subunit were both reduced, and the assembled 130 kDa holoenzyme was
          reduced further still. A loss of assembled complex that exceeds the loss of its individual subunits
          is the signature of an interaction that has become labile rather than of a subunit that is absent,
          which is the basis for placing residue 555 in the interacting domain.

          An independent human cell system reaches the same conclusion by a different route. A clonal
          SDHA-knockout line into which SDHA missense variants are reintroduced singly, and in which succinate
          dehydrogenase activity is then measured directly, includes p.Gly555Glu in its panel; the variant
          scores at the low end of enzymatic activity and the authors attribute its effect to disruption
          of SDHA-SDHB binding. That per-variant result is a full-text derivation and is recorded as such
          in this entry''s notes, not as a verified quotation.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex II assembly
          modifier: DECREASED
          term:
            id: GO:0034553
            label: mitochondrial respiratory chain complex II assembly
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: In this proband, CRM for flavoprotein as well as iron-containing protein (Ip) was decreased,
          CRM for the entire complex II (130 kDa) being reduced even more.
        supports: SUPPORT
