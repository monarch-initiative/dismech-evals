  457904d8e8d36af287ef84354c2a5d14068bae5f916909cd0cd293d1e18bb27d:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1GG
          disease_term:
            preferred_term: dilated cardiomyopathy 1GG
            term:
              id: MONDO:0013339
              label: dilated cardiomyopathy 1GG
        context:
        - path: /animal_models/0
          value:
            name: Sdhaf4 conditional-null mouse
            species: Mouse
            genotype: Sdhaf4 fl/fl; Ckmm-Cre (muscle-directed) and Sdhaf4 fl/fl; Mer-CreMer (tamoxifen-inducible,
              cardiomyocyte-specific)
            background: Conditional knockout of the complex II assembly factor Sdhaf4
            category: GENETIC
            description: 'The closest published in vivo model of the process this disease destroys, though
              not of its gene. Conditional deletion of Sdhaf4, the assembly factor that brings SDHA together
              with SDHB, suppresses complex II assembly in the heart and produces progressive dilated
              cardiomyopathy and lethal heart failure, with no mutant surviving beyond twelve weeks. Two
              independent Cre drivers give the same result, one muscle-directed and one tamoxifen-inducible
              and cardiomyocyte-specific, which establishes the phenotype as cardiomyocyte-autonomous
              rather than an artefact of one deletion strategy.

              Its relevance to this entry is specific and mechanistic rather than generic: loss of Sdhaf4
              attenuates the SDHA-SDHB interaction and leads to subunit degradation, which is the same
              interface failure that the p.Gly555Glu substitution produces by a different route. The authors
              make the connection themselves, citing the human G555E cardiomyopathy report as the reason
              to expect complex II assembly to matter for cardiac homeostasis.'
            publication: PMID:35803927
            genes:
            - preferred_term: SDHAF4
              term:
                id: hgnc:20957
                label: SDHAF4
            notes: '`genes:` records SDHAF4, the gene this model actually deletes, not SDHA, the gene
              of the disease it informs. That follows the convention in the rest of the KB - the ADGRG1
              polymicrogyria entry carries a Col3a1-null mouse under `genes: Col3a1`, and Adams-Oliver
              Syndrome carries a conditional Rac1 deletion under `genes: RAC1` - and it keeps the field
              consistent with the `limitations` on the links below, which say the lesion is in a different
              gene. The connection to SDHA is the mechanism links themselves, not the gene binding.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: The model reproduces the molecular lesion at the level of the SDHA-SDHB interaction
          and its consequence, subunit degradation and loss of assembled complex II, which is what the
          human immunochemistry shows. It reaches that state by removing the assembly factor rather than
          by destabilising the interface from within the flavoprotein.
        limitations: The lesion is in a different gene. Sdhaf4 is an assembly factor, not a structural
          subunit, and the model is a conditional null rather than a hypomorphic missense allele, so residual
          complex II is likely lower and the failure mode is absence of assembly rather than instability
          of an assembled interface. Nothing in the model speaks to whether a p.Gly555Glu holoenzyme behaves
          the same way once assembled.
        readouts:
        - name: Coimmunoprecipitation of SDHB with SDHA from cardiac left ventricle
          target: Destabilised Flavoprotein-Iron-Sulfur Subunit Interface
          direction: DECREASED
          interpretation: Reduced recovery of SDHB with SDHA indicates that the interaction between the
            flavoprotein and the iron-sulfur subunit is weakened, which is the molecular event this node
            asserts.
      selected_evidence:
        snippet: Cardiac loss of Sdhaf4 suppresses complex II assembly and results in subunit degradation
          and complex II deficiency in fetal mice.
        supports: SUPPORT
