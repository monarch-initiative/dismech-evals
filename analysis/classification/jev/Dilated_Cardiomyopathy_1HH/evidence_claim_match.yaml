        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: 'The initiating lesion in CMD1HH is a loss-of-function variant in BAG3, encoding
          the heat shock protein co-chaperone Bcl2-associated athanogene 3. The founding allele was an
          8733 bp deletion removing exon 4, and the disease allele class also includes frameshift, nonsense,
          and missense variants. Unlike the sarcomeric dilated cardiomyopathies, the affected protein
          is not part of the contractile machinery: BAG3 is a quality-control co-chaperone, so the lesion
          removes maintenance capacity rather than force-generating capacity.'
        genes:
