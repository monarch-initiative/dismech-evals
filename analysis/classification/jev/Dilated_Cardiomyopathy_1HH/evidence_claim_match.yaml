        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
      selected_evidence:
        snippet: Impaired CASA results in Z disk disintegration and progressive muscle weakness in flies,
          mice, and men.
        supports: SUPPORT
