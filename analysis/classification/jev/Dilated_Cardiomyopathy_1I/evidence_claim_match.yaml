            term:
              id: MONDO:0011482
              label: dilated cardiomyopathy 1I
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intermediate Filament Network Disorganization and Desmin Aggregation
        biological_scale: CELLULAR
        role: effector
        description: 'The desmin network normally interconnects Z-discs and links them to the sarcolemma,
          mitochondria and nucleus. When desmin is absent or misassembled the network is lost and, for
          the aggregating allele class, desmin-positive deposits accumulate in the sarcoplasm - the histological
          hallmark of desminopathy. Ultrastructurally this manifests as subsarcolemmal granular material,
          expanded Z-band aggregation, distortion of myofilaments and focal Z-band streaming: the contractile
          apparatus loses its mechanical registration. This is the point at which CMD1I and myofibrillar
          myopathy share a lesion; they differ in which tissue bears the burden.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Intermediate Filament Organization
          term:
            id: GO:0045109
            label: intermediate filament organization
          modifier: ABNORMAL
        - preferred_term: Sarcomere Organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
      selected_evidence:
        snippet: Ultrastructurally, subsarcolemmal granular material, expanded Z-band aggregation, distortion
          of myofilaments, focal Z-band streaming, lobed and clustered myonuclei were observed.
        supports: SUPPORT
