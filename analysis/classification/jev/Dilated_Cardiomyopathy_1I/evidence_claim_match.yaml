      assertion_type: Pathophysiology
      assertion:
        name: DES Variant in the Desmin Intermediate Filament
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: 'The initiating lesion in CMD1I is a variant in DES, encoding desmin - the muscle-specific
          intermediate filament protein that regulates various cellular functions in muscle cells and
          forms the cytoskeletal network of the myocyte. Two allele classes operate: dominant missense
          variants that are incorporated into the filament and disrupt its assembly, and recessive truncating
          variants that abolish the protein outright, as in the reported homozygous p.Arg150Ter case where
          immunostaining showed complete lack of desmin expression. Unlike the sarcomeric members of this
          series, the affected protein is not part of the contractile machinery but of the scaffold that
          holds it in register.'
        genes:
        - preferred_term: DES
          term:
            id: hgnc:2770
            label: DES
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        cellular_components:
        - preferred_term: Intermediate filament
          term:
            id: GO:0005882
            label: intermediate filament
      selected_evidence:
        snippet: Desmin is a crucial intermediate filament protein regulating various cellular functions
          in muscle cells.
        supports: SUPPORT
