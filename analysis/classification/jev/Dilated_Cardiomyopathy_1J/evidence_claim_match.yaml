        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: eya4_haploinsufficiency
        hypothesis_label: EYA4 haploinsufficiency as the shared DFNA10 mechanism
        status: ALTERNATIVE
        description: 'The competing account for EYA4 disease generally is straightforward haploinsufficiency
          - truncated protein is not expressed, dosage falls, and the cochlea, which is more dosage-sensitive
          than the myocardium, fails first. This is well supported for DFNA10 hearing loss. It is recorded
          here as ALTERNATIVE rather than CANONICAL for CMD1J specifically, because a pure dosage model
          does not by itself explain why most truncating alleles spare the heart while E193 does not.
          The two models are not mutually exclusive: haploinsufficiency may drive the auditory branch
          while a dominant-negative effect is required for the cardiac one.'
      selected_evidence:
        snippet: Transient expression of the c-myc-tagged EYA4 mutants in mammalian COS7 cells revealed
          absence of expression of the p.S534* mutant, consistent with a model of haploinsufficiency reported
          for all previously described EYA4 truncating mutations.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32277154
      reference_title: Insights into the pathophysiology of DFNA10 hearing loss associated with novel
        EYA4 variants.
      evidence_source: IN_VITRO
      explanation: Direct expression evidence for the haploinsufficiency model in a truncating EYA4 allele,
        from a cohort whose probands had hearing loss without cardiomyopathy.
