      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: 'A single heterozygous truncating EYA4 allele is sufficient. Transmission is vertical
          with a 50% recurrence risk per offspring, and penetrance is age-dependent rather than incomplete
          in the usual sense: a young carrier typically has hearing loss and a normal echocardiogram,
          so one normal cardiac study does not exclude later disease. The original linkage analysis modelled
          95% penetrance, but that was a statistical parameter, not an observed lifetime figure, and it
          should not be curated as a penetrance estimate.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Clinical evaluations of 2 kindreds demonstrated autosomal-dominant transmission and age-related
          penetrance of both SNHL and DCM in the absence of other disorders.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
