            features: EYA4 sits at 6q23-q24 and encodes a transcriptional co-activator of roughly 640
              residues, organised as an N-terminal variable transactivation region and a conserved C-terminal
              Eya domain. The Eya domain carries the protein's phosphatase activity and its binding surface
              for the SIX family; since Eya proteins have no DNA-binding domain, that surface is how EYA4
              is delivered to target promoters at all. Both reported CMD1J alleles are heterozygous truncations.
              Two things complicate variant interpretation and neither can be skipped. First, the large
              majority of pathogenic EYA4 alleles cause isolated DFNA10 hearing loss with no cardiac disease,
              so gene identity does not assign the entity. Second, the once-proposed positional rule -
              N-terminal truncation predicts cardiac involvement, C-terminal truncation spares the heart
              - has been contradicted by an early-truncating family with normal cardiac studies, so variant
              position does not assign it either. What does is cardiac phenotyping, repeated over time.
          role: ancestor
