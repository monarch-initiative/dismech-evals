  a8720d5dd447691c1e76eba95b6f6bafd666dca33e9e738467cb1f97d5329231:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1J
          disease_term:
            preferred_term: dilated cardiomyopathy 1J
            term:
              id: MONDO:0011541
              label: dilated cardiomyopathy 1J
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd1j_epidemiology_and_penetrance_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the actual prevalence of CMD1J, and what fraction of carriers of a cardiomyopathy-associated
          EYA4 allele develop dilated cardiomyopathy by a given age?
        attaches_to:
        - prevalence#Worldwide
        - inheritance#Age-Dependent Penetrance
        rationale: Neither number exists. The entity rests on two kindreds plus scattered later reports,
          all ascertained through combined hearing-loss and cardiomyopathy clinics, which is the worst
          possible sampling frame for estimating either quantity. The 95% penetrance figure that circulates
          is a linkage-analysis model parameter, not an observation, and repeating it as a penetrance
          estimate would be a curation error. Because cardiac penetrance is age-dependent, any cross-sectional
          count is also an underestimate by construction. Meanwhile the number that clinicians actually
          need - the cardiac risk facing a person found to carry a pathogenic EYA4 variant through hearing-loss
          testing - is not derivable from a hearing-loss-ascertained series either. Resolving this needs
          prospective cardiac follow-up of an unselected EYA4-variant cohort, which no published study
          provides.
      selected_evidence:
        snippet: Clinical evaluations of 2 kindreds demonstrated autosomal-dominant transmission and age-related
          penetrance of both SNHL and DCM in the absence of other disorders.
        supports: SUPPORT
