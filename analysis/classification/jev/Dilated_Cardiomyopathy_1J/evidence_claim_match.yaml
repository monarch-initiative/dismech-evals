      assertion_type: Discussion
      assertion:
        discussion_id: cmd1j_no_interventional_trials
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is there any interventional evidence specific to EYA4-related dilated cardiomyopathy,
          as opposed to extrapolation from general heart-failure practice?
        attaches_to:
        - treatments#Guideline-Directed Heart Failure Pharmacotherapy
        - treatments#Serial Cardiac Surveillance of Variant Carriers
        rationale: No. A ClinicalTrials.gov API search run during curation for "EYA4" and for "dilated
          cardiomyopathy 1J" returned zero studies in each case, which is why this entry carries no clinical_trials
          block rather than an empty or speculative one. Every therapeutic statement here is therefore
          extrapolation, and the surveillance recommendation - the one intervention with a disease-specific
          rationale, since hearing loss marks carriers decades before cardiac disease - has no validated
          interval attached to it. The guideline synthesis cited in this entry independently names cardiac
          magnetic resonance in phenotype-negative, genotype-positive relatives as an unresolved question,
          which is exactly the population this gap concerns.
      selected_evidence:
        snippet: Significant evidence gaps persist, particularly regarding the clinical trajectory of
          genetic, non-genetic and gene-elusive forms of DCM, the use of cardiovascular magnetic resonance
          in phenotype-negative family members with genotype-positive probands, and the development of
          potential aetiology-oriented therapies.
        supports: SUPPORT
