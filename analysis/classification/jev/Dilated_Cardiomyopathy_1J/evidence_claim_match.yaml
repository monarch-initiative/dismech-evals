    evidence_metadata:
      reference: PMID:15735644
      reference_title: Mutation in the transcriptional coactivator EYA4 causes dilated cardiomyopathy
        and sensorineural hearing loss.
      evidence_source: IN_VITRO
      explanation: 'The binding contrast is the direct experimental basis of this hypothesis: the cardiac
        allele is the one that cannot join the complex, while the hearing-only alleles can.'
