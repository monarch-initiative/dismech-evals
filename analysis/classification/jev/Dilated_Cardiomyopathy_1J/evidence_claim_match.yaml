      assertion:
        name: DFNA10 (EYA4-related nonsyndromic hearing loss)
        description: 'The differential that matters most, because it shares the gene, the inheritance
          pattern, and the entire auditory phenotype. The distinction is cardiac and it is temporal: DFNA10
          carriers do not develop dilated cardiomyopathy, but a young CMD1J carrier has not developed
          it yet either, so a single normal echocardiogram in a young adult does not settle the question.
          Mechanistically the two appear to diverge on whether the truncated peptide can still join the
          Eya4-Six complex.'
        distinguishing_features:
        - 'Absence of ventricular dilation and systolic dysfunction on serial cardiac imaging into and
          beyond the fifth decade. Variant position is not a distinguishing feature: the proposal that
          N-terminal truncations predict the cardiac phenotype while C-terminal truncations spare the
          heart has been contradicted by an early-truncating family with normal cardiac studies.'
      selected_evidence:
        snippet: Two affected members show no cardiac abnormalities at least until now revealed by electrocardiography
          and echocardiography.
        supports: SUPPORT
