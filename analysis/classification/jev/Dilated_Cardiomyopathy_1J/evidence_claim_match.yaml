  2adae0c16d65d58d56df5eb76c6e0f3a4bf79f098a34fe1b7d89567d674f3bc1:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1J
          disease_term:
            preferred_term: dilated cardiomyopathy 1J
            term:
              id: MONDO:0011541
              label: dilated cardiomyopathy 1J
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd1j_transgenic_overexpression_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does cardiac-restricted transgenic overexpression of E193 model human CMD1J, when the
          human disease is a heterozygous endogenous allele and the model does not reproduce the hearing
          loss that defines the syndrome?
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#Disrupted Cardiomyocyte Hypertrophic Stress Response
        rationale: 'Every in vivo statement about the p27/CK2 alpha/HDAC2 pathway in this entry comes
          from a model whose construct is driven by a strong cardiac promoter at non-physiological levels,
          in one tissue, on a timescale set by the transgene rather than by the endogenous gene. Two specific
          concerns follow. First, a dominant-negative effect is dose-dependent by definition, so overexpression
          may manufacture a phenotype that a single endogenous mutant allele would not produce - which
          is precisely the question the previous discussion is about. Second, the model is cardiac-restricted,
          so it cannot address the auditory arm or the relationship between the two, and the temporal
          ordering that defines the human syndrome is untestable in it. This is a mismatch in translational
          validity, not an absence of evidence: the mouse data are real and internally well controlled,
          with a wild-type-Eya4 comparator moving the readouts the other way.'
        proposed_experiments:
        - experiment_id: cmd1j_endogenous_knockin_mouse
          name: Endogenous heterozygous Eya4 E193 knock-in mouse with auditory phenotyping
          description: Generate a mouse carrying the E193-equivalent truncation knocked into the endogenous
            Eya4 locus in heterozygosity, with no transgene and no promoter substitution. Phenotype longitudinally
            with serial echocardiography or cardiac MRI and with auditory brainstem response, and compare
            against an Eya4 heterozygous-null mouse and against the existing overexpression line under
            matched pressure-overload challenge.
          would_support:
          - pathophysiology#Disrupted Cardiomyocyte Hypertrophic Stress Response
          supporting_outcome:
          - The endogenous heterozygous knock-in develops age-dependent ventricular dilation together
            with progressive hearing loss, with the same p27/CK2 alpha/HDAC2 direction as the overexpression
            line. That would show the pathway assignment survives physiological dosage and that one allele
            generates both organ phenotypes, as in humans.
          refuting_outcome:
          - The endogenous heterozygote shows hearing loss but no cardiac phenotype even under pressure
            overload, matching the heterozygous null. The cardiac arm of the mechanism would then be an
            artefact of overexpression, and the human cardiac phenotype would need a different explanation.
      selected_evidence:
        snippet: Next, we generated transgenic mice with cardiac-specific overexpression of Eya4 or E193.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
