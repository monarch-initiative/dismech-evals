    evidence_metadata:
      reference: PMID:26499333
      reference_title: Eya4 Induces Hypertrophy via Regulation of p27kip1.
      evidence_source: MODEL_ORGANISM
      explanation: 'States the construct and its tissue restriction, which is the source of the mismatch:
        overexpression in one organ rather than endogenous heterozygous expression in both affected organs.'
