  8aaddc2addfba4605d96e64ab8be473683b56140135f8b9508a025186aac5cbb:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1J
          disease_term:
            preferred_term: dilated cardiomyopathy 1J
            term:
              id: MONDO:0011541
              label: dilated cardiomyopathy 1J
        context: []
      assertion_type: Genetic
      assertion:
        name: EYA4 Heterozygous Truncating Variants
        association: Heterozygous truncating and large-deletion alleles
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: EYA4
          term:
            id: hgnc:3522
            label: EYA4
        features: EYA4 sits at 6q23-q24 and encodes a transcriptional co-activator of roughly 640 residues,
          organised as an N-terminal variable transactivation region and a conserved C-terminal Eya domain.
          The Eya domain carries the protein's phosphatase activity and its binding surface for the SIX
          family; since Eya proteins have no DNA-binding domain, that surface is how EYA4 is delivered
          to target promoters at all. Both reported CMD1J alleles are heterozygous truncations. Two things
          complicate variant interpretation and neither can be skipped. First, the large majority of pathogenic
          EYA4 alleles cause isolated DFNA10 hearing loss with no cardiac disease, so gene identity does
          not assign the entity. Second, the once-proposed positional rule - N-terminal truncation predicts
          cardiac involvement, C-terminal truncation spares the heart - has been contradicted by an early-truncating
          family with normal cardiac studies, so variant position does not assign it either. What does
          is cardiac phenotyping, repeated over time.
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        variants:
        - name: EYA4 E193 (4,846-bp deletion)
          description: The founding CMD1J allele. A heterozygous deletion of 4,846 bp produces a peptide
            truncated after residue 193. Its distinguishing biochemical property is not that it is short
            but that it has lost the ability to bind wild-type Eya4 and Six proteins - a property the
            truncated peptides from hearing-loss-only families retain. That contrast is the entire experimental
            basis for treating the cardiac phenotype as a dominant-negative effect rather than a dosage
            effect, and it is the allele carried into the transgenic mouse work.
          gene:
            preferred_term: EYA4
            term:
              id: hgnc:3522
              label: EYA4
          clinical_significance: PATHOGENIC
        - name: EYA4 E215
          description: 'A second heterozygous truncating allele producing similar cardio-auditory features.
            The observation that matters mechanistically is that the mutant protein is stably expressed
            in myocardium: a stable truncated product is what a dominant-negative model needs and what
            a pure nonsense-mediated-decay haploinsufficiency model does not predict. Very few affected
            individuals have been reported, so this allele''s phenotype range is not defined.'
          gene:
            preferred_term: EYA4
            term:
              id: hgnc:3522
              label: EYA4
          clinical_significance: PATHOGENIC
        - name: EYA4 p.Gln393Ter (c.1177C>T)
          description: Included as a negative control on the entity boundary rather than as a CMD1J allele.
            A Japanese carrier of this pathogenic nonsense variant had progressive sensorineural hearing
            loss with only minor electrocardiographic and echocardiographic findings - no left ventricular
            dilatation and no impaired contractility. Annotating this variant as CMD1J-causal would be
            an error, and it is recorded here so that the mistake is visible rather than available.
          gene:
            preferred_term: EYA4
            term:
              id: hgnc:3522
              label: EYA4
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Unlike previously described mutations causing dilated cardiomyopathy that affect structural
          proteins, this mutation deletes 4,846 bp of the human transcriptional coactivator gene EYA4.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
