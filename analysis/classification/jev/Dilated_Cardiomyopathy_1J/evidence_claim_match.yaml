              label: dilated cardiomyopathy 1J
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: eya4_e193_dominant_negative
        hypothesis_label: E193 acts as a dominant-negative poison of the Eya4-Six complex
        status: CANONICAL
        description: The prevailing model is that the CMD1J allele is not merely a null. The truncated
          193-residue peptide loses the ability to bind wild-type Eya4 and Six proteins, which is precisely
          the property retained by the truncated peptides found in hearing-loss-only families. On this
          account the cardiac phenotype requires active disruption of the Eya4-Six transcriptional complex,
          and simple loss of one functional allele is not enough to produce it. This is the model that
          explains why most EYA4 truncations spare the heart.
      selected_evidence:
        snippet: Eya4 peptides associated with SNHL, but not the shortened 193-amino acid peptide associated
          with dilated cardiomyopathy and SNHL, bound wild-type Eya4 and associated with Six proteins.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
