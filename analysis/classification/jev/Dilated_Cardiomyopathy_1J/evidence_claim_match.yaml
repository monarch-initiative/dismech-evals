      assertion:
        name: Combined Cardiac and Audiologic Phenotyping
        description: The diagnosis is made by putting the two organ phenotypes together in one pedigree,
          not by either alone. Cardiac assessment follows the general dilated cardiomyopathy pathway -
          echocardiography first, cardiac magnetic resonance for tissue characterisation and function,
          ECG and rhythm monitoring, natriuretic peptides and high-sensitivity troponin - after excluding
          coronary disease, abnormal loading, valvular and congenital disease, myocarditis, toxic and
          endocrine causes. Pure-tone audiometry and a three-to-four-generation pedigree covering both
          hearing and cardiac history are what convert a general dilated cardiomyopathy workup into an
          assessment for this entity.
