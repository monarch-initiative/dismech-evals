  7b606a3b87316023fdf0370652c34c4af94c3db2606f3b2b282145b455a9904e:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1J
          disease_term:
            preferred_term: dilated cardiomyopathy 1J
            term:
              id: MONDO:0011541
              label: dilated cardiomyopathy 1J
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd1j_dominant_negative_vs_haploinsufficiency
        kind: CONTROVERSY
        status: OPEN
        prompt: Why do most pathogenic EYA4 truncating alleles cause hearing loss alone, while E193 and
          E215 also cause dilated cardiomyopathy - is the cardiac phenotype a dominant-negative effect,
          a dosage effect at a more sensitive threshold, or both?
        attaches_to:
        - pathophysiology#Failure of Eya4-Six1 Complex Assembly
        - mechanistic_hypotheses#eya4_e193_dominant_negative
        - mechanistic_hypotheses#eya4_haploinsufficiency
        rationale: 'The two models make different predictions and are supported by different experiments.
          The dominant-negative account rests on a single decisive observation: the 193-residue peptide
          loses Six and Eya4 binding, while hearing-loss-only peptides retain it. The haploinsufficiency
          account rests on expression data showing truncated EYA4 mutants are not expressed - but that
          work was done in DFNA10 alleles, in a heterologous cell line, and the CMD1J-adjacent E215 allele
          is reported to be stably expressed in myocardium, which a pure nonsense-mediated-decay model
          does not predict. The question is not academic: it determines whether a newly found EYA4 truncation
          in a hearing-loss family warrants lifelong cardiac surveillance or not, and no assay currently
          answers it prospectively.'
        proposed_experiments:
        - experiment_id: cmd1j_knockin_allelic_series
          name: Endogenous-locus allelic series of EYA4 truncations in human cardiomyocytes
          description: 'Introduce E193, E215, and two or three well-characterised hearing-loss-only truncating
            alleles into the endogenous EYA4 locus of isogenic human iPSC lines by knock-in, differentiate
            to cardiomyocytes, and compare against an EYA4 heterozygous-null line. A heterozygous null
            is the critical arm: it is what separates the two models. Read out Eya4-Six1 complex assembly,
            p27 levels, CK2 alpha activity and HDAC2 phosphorylation, and contractile function at baseline
            and under mechanical or adrenergic load.'
          would_support:
          - mechanistic_hypotheses#eya4_e193_dominant_negative
          would_refute:
          - mechanistic_hypotheses#eya4_haploinsufficiency
          supporting_outcome:
          - Cardiomyocytes carrying E193 or E215 show a worse phenotype than the heterozygous-null line
            on the p27/CK2/HDAC2 readouts and on contractile function, and the hearing-loss-only alleles
            are indistinguishable from the null. That ordering is only possible if the cardiac alleles
            do something the null does not.
          refuting_outcome:
          - All truncating alleles, including E193, phenocopy the heterozygous null across the readouts,
            with no allele exceeding it. Dosage would then be the whole story, and cardiac involvement
            would have to be explained by modifiers or ascertainment rather than by allele class.
      selected_evidence:
        snippet: Finally, we identified a new heterozygous truncating Eya4 mutation, E215, which leads
          to similar clinical features of disease and a stable myocardial expression of the mutant protein
          as seen with E193.
        supports: SUPPORT
