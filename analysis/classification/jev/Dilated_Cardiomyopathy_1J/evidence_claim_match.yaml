      evidence_source: IN_VITRO
      explanation: Cuts against a single shared dominant-negative mechanism for all EYA4 disease by establishing
        haploinsufficiency as the common mechanism on the hearing-loss side. Recorded as REFUTE with respect
        to the unified dominant-negative claim, not with respect to E193 specifically.
