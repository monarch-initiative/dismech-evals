              id: MONDO:0011541
              label: dilated cardiomyopathy 1J
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EYA4 Heterozygous Truncating Variant
        description: The initiating lesion is a germline heterozygous truncating change in EYA4 at 6q23-q24.
          The founding CMD1J allele deletes 4,846 bp and produces a peptide terminating after residue
          193; a second allele, E215, truncates slightly later and produces a stable mutant protein detectable
          in myocardium. EYA4 encodes a transcriptional co-activator with an N-terminal variable transactivation
          region and a conserved C-terminal Eya domain that carries phosphatase activity and mediates
          binding to the SIX family. Because Eya proteins have no DNA-binding domain of their own, that
          Six interaction is not incidental - it is how EYA4 reaches chromatin at all.
        biological_scale: MOLECULAR
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        cell_types:
        - preferred_term: ventricular cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: EYA4 transcription co-activator function
          modifier: DECREASED
          term:
            id: GO:0003712
            label: transcription coregulator activity
        - preferred_term: Eya-domain tyrosine phosphatase activity
          modifier: DECREASED
          term:
            id: GO:0004725
            label: protein tyrosine phosphatase activity
      selected_evidence:
        snippet: Unlike previously described mutations causing dilated cardiomyopathy that affect structural
          proteins, this mutation deletes 4,846 bp of the human transcriptional coactivator gene EYA4.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
