      assertion_type: Inheritance
      assertion:
        name: Age-Dependent Penetrance
        description: Cardiac penetrance is a function of age, not of an all-or-nothing modifier. In the
          founding families the auditory phenotype was established by late adolescence while ventricular
          dysfunction did not become clinically evident until after the fourth decade, leaving a long
          interval in which a carrier is hearing-positive and cardiac-negative. That interval is the surveillance
          window, and it is why the entry records no lifetime penetrance number.
        inheritance_term:
          preferred_term: Typified by incomplete penetrance
          term:
            id: HP:0003829
            label: Typified by incomplete penetrance
      selected_evidence:
        snippet: Moderate-to-severe hearing loss was evident by late adolescence, whereas ventricular
          dysfunction produced progressive congestive heart failure after the fourth decade.
        supports: SUPPORT
