              label: dilated cardiomyopathy 1JJ
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lama4_mouse_geometry_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does a constitutive Lama4-null mouse that develops cardiac HYPERTROPHY model a human disease
          defined by ventricular DILATION, and does absence of the chain model a missense loss of integrin
          binding?
        attaches_to:
        - pathophysiology#Adverse Ventricular Remodeling
        rationale: 'The mouse evidence carries almost all the mechanistic weight in this entry, and it
          differs from the human disease in two ways that are easy to elide. First, geometry: the null
          mouse was described as gradually developing cardiac hypertrophy with impaired function, whereas
          the human entity is a dilated cardiomyopathy. Second, allele class: a constitutive null models
          complete absence of laminin alpha-4, while the human integrin-domain alleles are heterozygous
          missense and nonsense changes whose proposed effect is loss of a specific protein-protein interaction.
          A model of absence cannot by itself establish that the human alleles act the way the entry proposes,
          and the Lama4-null mouse additionally develops chronic kidney disease, so it is not a cardiac-restricted
          model.'
        proposed_experiments:
        - experiment_id: exp_cmd1jj_serial_imaging_knockin
          name: Serial cardiac imaging of an integrin-domain knock-in versus the null
          description: Compare chamber geometry, ejection fraction and myocardial perfusion over time
            between a heterozygous integrin-domain knock-in, the Lama4 null, and wild type, to establish
            whether the human allele class produces a dilated rather than hypertrophic phenotype and whether
            the microvascular lesion precedes the myocardial one.
      selected_evidence:
        snippet: we demonstrate that laminin alpha4 deficient mice gradually develop cardiac hypertrophy
          with impaired function
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
