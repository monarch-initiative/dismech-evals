        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Laminin-Integrin Binding at the Cardiac Basement Membrane
        biological_scale: MOLECULAR
        role: central_effector
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: 'Laminin alpha-4 is a component of the laminin-8 and -9 heterotrimers of the cardiac
          extracellular matrix, where it serves both as a structural protein and as a signalling ligand.
          Losing its integrin-binding capacity degrades the cell-matrix link that normally couples a cardiomyocyte
          and a microvascular endothelial cell to the basement membrane, and it is upstream of integrin-linked
          kinase, the shared node the zebrafish screen identified. This is the disorder-specific substitution
          for the module''s primary insult: a cell-matrix adhesion and outside-in signalling lesion rather
          than a sarcomere defect. The mouse data below place a boundary on how far the lesion extends
          — it does not destabilise the dystrophin-glycoprotein complex or the sarcolemmal integrin complex,
          and it does not by itself stop an isolated cardiomyocyte contracting.'
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        - preferred_term: cardiac endothelial cell
          term:
            id: CL:0010008
            label: cardiac endothelial cell
        biological_processes:
        - preferred_term: cell-matrix adhesion
          term:
            id: GO:0007160
            label: cell-matrix adhesion
          modifier: DECREASED
        cellular_components:
        - preferred_term: basement membrane
          term:
            id: GO:0005604
            label: basement membrane
      selected_evidence:
        snippet: Additional experiments revealed the epistatic regulation between laminin-alpha4 (Lama4),
          integrin, and Ilk, which led us to screen for mutations in the human ILK and LAMA4 genes in
          patients with severe dilated cardiomyopathy.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
