            fidelity: LOW
            description: 'The model recapitulates this node''s positive content - absence of the chain
              degrades the cardiac basement membrane - and what it adds is a pair of informative NEGATIVE
              readouts that BOUND the mechanism: the lesion does not destabilise the sarcolemmal adhesion
              complexes, and it does not by itself stop an isolated cardiomyocyte contracting. Those negatives
              are why this entry routes the disease through the microvasculature rather than through a
              contractile or dystrophin-glycoprotein defect. The mechanism they exclude, sarcolemmal destabilisation,
              is deliberately not curated as a node here, so the negatives are carried as readouts on
              this link rather than as a separate failure claim.'
            limitations: This is a null allele rather than an integrin-binding-deficient missense knock-in,
              so the negative result bounds what absence of the chain does; it cannot exclude a dominant-negative
              or altered-signalling effect specific to the human integrin-domain alleles, which has never
              been tested in vivo.
          role: ancestor
