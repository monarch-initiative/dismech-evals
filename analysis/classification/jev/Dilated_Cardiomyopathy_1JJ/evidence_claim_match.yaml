        prevalence_class: NOT_YET_DOCUMENTED
        notes: No population-based prevalence estimate exists for a LAMA4-specific form of dilated cardiomyopathy,
          and none can be derived while the gene-disease relationship itself is classified as Limited.
          Reported human LAMA4 cardiomyopathy amounts to a handful of index cases and small families.
          For context, dilated cardiomyopathy overall has been reported at around 1 in 2700 in the USA
          and 1 in 7000 in Japan; LAMA4 accounts for no established share of that.
