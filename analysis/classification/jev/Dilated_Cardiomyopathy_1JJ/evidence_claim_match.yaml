        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lama4_dcm_gene_disease_validity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is LAMA4 a cause of human dilated cardiomyopathy at all, and if so by what genetic mechanism?
        attaches_to:
        - pathophysiology#LAMA4 Integrin-Interacting-Domain Variant
        rationale: 'ClinGen''s Dilated Cardiomyopathy GCEP classifies the LAMA4-DCM relationship as Limited.
          Every strand of the human evidence has a specific weakness: the founding alleles came from a
          candidate screen prompted by a zebrafish result rather than from independent segregation analysis;
          the later p.Gly218Arg allele is a ClinVar variant of uncertain significance supported by in
          silico prediction; and the infantile case carried a known MYH7 DCM mutation alongside the LAMA4
          variant. The mechanistic work is correspondingly lopsided — the mouse and zebrafish data are
          strong for the pathway and the binding data are quantitative, but neither addresses whether
          heterozygous human LAMA4 missense alleles are sufficient to cause disease. Until this is resolved
          no clinical inference should be drawn from a LAMA4 variant, and this entry curates the mechanism
          as proposed rather than established.'
        proposed_experiments:
        - experiment_id: exp_cmd1jj_case_control_burden
          name: Case-control rare-variant burden test for LAMA4 in dilated cardiomyopathy
          description: Test whether rare LAMA4 variants, and specifically integrin-domain missense variants,
            are enriched in large sequenced dilated-cardiomyopathy cohorts relative to ancestry-matched
            population controls — the analysis that would move the ClinGen classification in either direction,
            and the one that has not been reported.
        - experiment_id: exp_cmd1jj_integrin_domain_knockin_mouse
          name: Knock-in mouse carrying a human LAMA4 integrin-domain allele
          description: Generate a heterozygous knock-in of p.Pro943Leu or the murine equivalent and test
            whether it produces cardiac disease, which would distinguish a dominant effect of the disease
            alleles from the complete-absence phenotype of the existing null.
      selected_evidence:
        snippet: LAMA4 | HGNC:6484 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited
        supports: SUPPORT
