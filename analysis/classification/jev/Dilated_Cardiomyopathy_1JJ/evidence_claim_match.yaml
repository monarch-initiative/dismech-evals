  9d0827423e8236b94bbb59a53c9ce1811de062a0ffe3be3f7f00db46c0f7453b:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1JJ
          disease_term:
            preferred_term: dilated cardiomyopathy 1JJ
            term:
              id: MONDO:0014095
              label: dilated cardiomyopathy 1JJ
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiac Magnetic Resonance Imaging
        description: 'Cardiac MRI adds what echocardiography cannot: tissue characterisation, and with
          it the risk stratification that actually drives management in nonischemic dilated cardiomyopathy.
          In a meta-analysis of 103 studies and 29,687 patients, late gadolinium enhancement - both its
          presence and its extent - was associated with higher all-cause and cardiovascular mortality,
          arrhythmic events and heart failure events, while left ventricular ejection fraction was NOT
          associated with all-cause mortality or arrhythmic outcomes. That inversion is the point: the
          number echocardiography gives you is the weaker prognostic marker. None of this is LAMA4-specific,
          and no reported LAMA4 patient has published CMR.'
        diagnosis_term:
          preferred_term: cardiac magnetic resonance imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
      selected_evidence:
        snippet: Late gadolinium enhancement (LGE) presence and extent (per 1%) were associated with higher
          all-cause mortality
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
      context_paths:
