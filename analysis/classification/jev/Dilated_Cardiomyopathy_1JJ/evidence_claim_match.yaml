      assertion_type: Genetic
      assertion:
        name: LAMA4 variants of limited and disputed clinical validity
        gene_term:
          preferred_term: LAMA4
          term:
            id: hgnc:6484
            label: LAMA4
        association: Limited
        relationship_type: DISPUTED
        notes: 'Curated as DISPUTED rather than CAUSATIVE. The ClinGen Dilated Cardiomyopathy Gene Curation
          Expert Panel classified the LAMA4-dilated cardiomyopathy relationship as LIMITED on 2024-11-15
          under SOP10, and the panel''s published curation of 51 DCM genes recommends that high-evidence
          genes be used in clinical practice with caution exercised for variable-evidence genes. Individually,
          the reported human evidence is thin in the specific ways that produce a Limited classification:
          the two founding alleles (p.Pro943Leu, p.Arg1073X) came from a candidate screen driven by a
          zebrafish result rather than from independent segregation; the later p.Gly218Arg allele is of
          uncertain significance in ClinVar and its pathogenicity claim rests on in silico prediction;
          and the infantile case carried a LAMA4 variant together with a known MYH7 DCM mutation, so the
          LAMA4 contribution cannot be isolated from it. Note that MONDO nonetheless models CMD1JJ as
          a gene-anchored disease concept, which is why this entry exists — the DISPUTED marker records
          the evidence state, it does not retire the concept.'
        variants:
        - name: p.Pro943Leu
          description: Missense variant in the integrin-interacting domain; measured integrin affinity
            Kd 5 +/- 3 micromol/L versus 440 +/- 20 nmol/L for wild type.
        - name: p.Arg1073X
          description: Nonsense variant in the integrin-interacting domain; measured integrin affinity
            Kd 1 +/- 0.2 micromol/L versus 440 +/- 20 nmol/L for wild type.
        - name: p.Gly218Arg
          description: Missense variant in a laminin EGF-like domain, reported in a Chinese family with
            dilated cardiomyopathy and conduction system disease; classified as of uncertain significance
            in ClinVar, with the pathogenicity claim resting on bioinformatic prediction.
        - name: p.Asp1309Asn
          description: Missense variant reported in an infantile dilated cardiomyopathy case that also
            carried the known MYH7 DCM mutation p.Glu924Lys; the authors proposed a synergistic or dose
            effect of the two variants rather than a LAMA4-only cause.
      selected_evidence:
        snippet: LAMA4 | HGNC:6484 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited
        supports: REFUTE
