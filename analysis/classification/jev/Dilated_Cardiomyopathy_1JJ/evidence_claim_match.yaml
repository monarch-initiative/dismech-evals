      assertion_type: Pathophysiology
      assertion:
        name: LAMA4 Integrin-Interacting-Domain Variant
        biological_scale: MOLECULAR
        role: trigger
        description: The two founding LAMA4 alleles, p.Pro943Leu and p.Arg1073X, were identified by candidate
          screening of severe dilated cardiomyopathy patients after a zebrafish forward-genetic screen
          placed laminin-alpha-4 upstream of integrin and integrin-linked kinase. Both fall in the integrin-interacting
          domain of the protein. A third reported allele, p.Gly218Arg, lies in a laminin EGF-like domain
          instead and is annotated as of uncertain significance in ClinVar, so this node does not claim
          a single shared structural class for all reported variants.
        genes:
        - preferred_term: LAMA4
          term:
            id: hgnc:6484
            label: LAMA4
        cellular_components:
        - preferred_term: basement membrane
          term:
            id: GO:0005604
            label: basement membrane
      selected_evidence:
        snippet: We identified 2 novel amino acid residue-altering mutations
        supports: SUPPORT
