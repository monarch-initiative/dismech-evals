      assertion:
        name: Dominant-Negative Disturbance of the Sarcoglycan Complex
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: HYPOTHETICAL
        description: The proposed molecular effect is interference by the mutant protein with the sarcoglycan-sarcospan
          subcomplex of the dystrophin-glycoprotein complex. The two experimental systems disagree on
          how this happens. In rat cardiomyocytes, R97Q and R71T traffic normally and the complex assembles,
          but the membrane is fragile under strain. In transgenic mice, S151A is retained in the nucleus
          and sequesters beta- and gamma-sarcoglycan. Both systems overexpress the mutant, and R97Q was
          called a polymorphism in the founding report. In the one p.Lys238del explant, delta-sarcoglycan
          staining was reduced while alpha-, beta-, gamma-sarcoglycan and dystrophin staining was preserved.
        protein_complexes:
        - preferred_term: sarcoglycan complex
          term:
            id: GO:0016012
            label: sarcoglycan complex
        - preferred_term: dystrophin-associated glycoprotein complex
          term:
            id: GO:0016010
            label: dystrophin-associated glycoprotein complex
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Additionally, the R71T mutation creates an ectopic N-linked glycosylation site that results
          in aberrant glycosylation of the extracellular domain of δ-sarcoglycan.
        supports: SUPPORT
        directness: DIRECT
