        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: If heterozygous SGCD variants cause DCM, by what molecular mechanism, given that LGMD2F
          heterozygous carriers are not known to be affected?
        attaches_to:
        - pathophysiology#Dominant-Negative Disturbance of the Sarcoglycan Complex
        rationale: 'A dominant-negative effect is proposed because heterozygous null carriers in LGMD2F
          families are not described as affected. The two overexpression systems disagree on the mechanism:
          normal trafficking with fragile membranes in one, nuclear sequestration in the other. A functionally
          confirmed canonical splice variant (c.4-1G>A), reclassified likely pathogenic in a cardiomyopathy
          cohort, is a likely loss-of-function allele. If it is causal, a dominant-negative-only mechanism
          does not explain it; its carrier''s phenotype is not reported. A native-dosage S151A knock-in
          showed an intact sarcolemma, and S151A rescued Sgcd-null hearts. Systematic cardiac data on
          heterozygous LGMD2F relatives are lacking.'
      selected_evidence:
        snippet: Although heterozygotes within LGMD2F families have not been described to be affected,
          it is possible that cardiac evaluation overlooked cardiac pathology or the cardiac dysfunction
          had not become apparent at the time of evaluation
        supports: SUPPORT
