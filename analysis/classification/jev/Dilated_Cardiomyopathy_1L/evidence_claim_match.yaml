        kind: CONTROVERSY
        status: OPEN
        prompt: Do heterozygous SGCD variants cause Mendelian autosomal dominant DCM, or were the founding
          observations chance co-occurrences of rare variants with DCM?
        attaches_to:
        - pathophysiology#Heterozygous SGCD Variant
        rationale: Support comes from one three-carrier family, two apparently de novo sporadic children,
          one small Finnish family, and one splice variant of unreported phenotype. Against it are seven
          S151A carriers aged 3-64 years in an LGMD2F family who showed no clinical signs of cardiomyopathy,
          with normal ECG and echocardiography in the four compound heterozygotes (the others had clinical
          examination only); negative screens of 99 and 52 DCM patients, and a mild knock-in mouse. ClinGen
          rates the relationship Limited.
        proposed_experiments:
        - experiment_id: exp_cmd1l_case_control_burden
          name: SGCD rare-variant burden in large DCM case-control data
          description: Compare the burden of rare SGCD missense, in-frame and splice variants in DCM probands
            against population controls, stratified by variant class and protein domain. Collect cardiac
            phenotypes from heterozygous parents of LGMD2F patients as an internal penetrance check.
      selected_evidence:
        snippet: Comprehensive clinical and cardiac investigation in all of the compound heterozygous
          family members revealed no signs of cardiomyopathy or limb girdle muscular dystrophy.
        supports: SUPPORT
        directness: DIRECT
