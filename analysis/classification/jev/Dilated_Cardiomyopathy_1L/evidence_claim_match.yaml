      assertion_type: Discussion
      assertion:
        discussion_id: cmd1l_null_models_vs_heterozygous_disease
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: How informative are complete-loss and overexpression models for a disease attributed to
          one heterozygous SGCD allele?
        attaches_to:
        - pathophysiology#Cardiomyocyte Degeneration
        - pathophysiology#Nuclear Sequestration of Delta-Sarcoglycan with Lamin A/C Mislocalization
        rationale: The hamster, Sgcd-null mouse and SGCD-knockout pig are recessive nulls with skeletal
          myopathy, modeling LGMD R6 biology. The S151A transgenic mouse and fly overexpress the mutant,
          while the genotype-matched knock-in mouse shows only mild, subclinical change. The vascular
          mechanism of the null mouse is contradicted by normal coronaries in patients.
        proposed_experiments:
        - experiment_id: exp_cmd1l_isogenic_ipsc_cardiomyocytes
          name: Isogenic heterozygous SGCD variants in human iPSC cardiomyocytes
          description: Introduce S151A, p.Lys238del, R71T and a null allele heterozygously into one control
            iPSC line. Measure sarcoglycan localization, membrane permeability under cyclic stretch, and
            nuclear lamin A/C distribution against isogenic wild-type and heterozygous-null controls.
            This would separate a dominant-negative effect from haploinsufficiency and from overexpression
            artifacts.
      selected_evidence:
        snippet: Heydemann et al found up to sevenfold overexpression of the S151A sequence variant in
          hearts of their mice, which may suggest that rather the overall level of gene expression than
          the expression of the sequence variant has been responsible for the pathology in mice.
        supports: SUPPORT
        directness: INDIRECT
