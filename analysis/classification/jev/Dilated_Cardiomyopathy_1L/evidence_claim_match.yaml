        context: []
      assertion_type: Prevalence
      assertion:
        population: Published patients with heterozygous SGCD variants and DCM
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: The cached primary reports describe the S151A family (three affected carriers), two sporadic
          p.Lys238del children and two R71T carriers in one Finnish family. A Dutch c.4-1G>A carrier is
          not counted, because no phenotype is reported. Across two cohort screens of 99 and 52 DCM patients,
          no causal SGCD variant was found apart from the single Finnish family. Sylvius et al. estimated
          SGCD variants at less than 1% of idiopathic DCM. ULTRA_RARE is a qualitative tier inferred from
          this handful of published cases; no population prevalence has been measured.
      selected_evidence:
        snippet: We screened these two genes for mutations in 99 unrelated patients with sporadic or familial
          DCM.
        supports: SUPPORT
        directness: DIRECT
