        and endocardial fibroelastosis.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: A second dilated-cardiomyopathy proband, carrying W4R. The variant did not segregate
        with disease, so this case counts as a reported carrier, not as a segregating family.
