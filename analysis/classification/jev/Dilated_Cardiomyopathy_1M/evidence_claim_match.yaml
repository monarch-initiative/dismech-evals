            term:
              id: MONDO:0011840
              label: dilated cardiomyopathy 1M
        context: []
      assertion_type: Prevalence
      assertion:
        population: Dilated cardiomyopathy probands with a reported CSRP3 variant
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No population prevalence exists for CMD1M. The cited sources describe a handful of dilated-cardiomyopathy
          probands with a CSRP3 variant, and none reports a multigenerational family in which a CSRP3
          variant segregates with dilated cardiomyopathy. Counted from those sources: (1) the founding
          Knoll 2002 report of W4R in dilated cardiomyopathy, with no patient count in the abstract; (2)
          Mohapatra 2003, one patient with dilated cardiomyopathy and endocardial fibroelastosis carrying
          K69R, and one individual with dilated cardiomyopathy carrying W4R in a family where the variant
          did not segregate with disease; (3) Hershberger 2008, one proband (0.3%) out of 313 sequenced
          dilated-cardiomyopathy patients, carrying G72R; and (4) Trachoo 2022, one of 31 dilated-cardiomyopathy
          subjects, heterozygous for E191K (c.571G>A) and classified as a variant of uncertain significance.
          Against this, a 945-case burden comparison found no detectable excess of rare CSRP3 variants
          in dilated cardiomyopathy (odds ratio 1.10; a modest effect is not excluded). The W4R allele
          is far more common in the population (up to 1% of people of European ancestry) than the disease
          could be if W4R were a penetrant dominant cause. The prevalence class is NOT_YET_DOCUMENTED
          because no rate has been measured. The phrase "extremely rare, if it exists as a distinct entity"
          is a qualitative judgement, not a measured tier.'
      selected_evidence:
        snippet: In another individual with DCM, a W4R mutation was identified. However, this mutation
          did not segregate with disease in this family.
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
