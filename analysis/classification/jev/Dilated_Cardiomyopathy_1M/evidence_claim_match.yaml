        status: OPEN
        prompt: Why does loss of MLP give dilated cardiomyopathy in the knockout mouse but mainly hypertrophic
          cardiomyopathy in humans, in the W4R knock-in mouse and in human stem-cell cardiomyocytes?
        attaches_to:
        - animal_models#Csrp3 (Mlp) knockout mouse
        - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
        rationale: Most of the mechanistic chain in this entry comes from the MLP-null mouse. In humans,
          CSRP3 is a Definitive hypertrophic-cardiomyopathy gene, and biallelic truncating variants give
          adult hypertrophic cardiomyopathy. Knock-in of the founding dilated allele gives hypertrophic
          cardiomyopathy in mice, and MLP-null human ESC-derived cardiomyocytes develop hypertrophic features.
          The MLP-null mouse itself has hypertrophy along with dilation. So the dilated outcome may reflect
          mouse strain, complete null dose, or a late dilated phase of a hypertrophic process, rather
          than a distinct dilated mechanism.
      selected_evidence:
        snippet: We now report the generation and detailed analysis of the corresponding Mlp(W4R/+) and
          Mlp(W4R/W4R) knock-in animals, which develop an age- and gene dosage-dependent hypertrophic
          cardiomyopathy and heart failure phenotype, characterized by almost complete loss of contractile
          reserve under catecholamine induced stress.
        supports: SUPPORT
