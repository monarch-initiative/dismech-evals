      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous CSRP3 Missense Variant
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        mechanism_confidence: PROVISIONAL
        description: The proposed initiating lesion is a heterozygous germline missense variant in CSRP3.
          The reported dilated-cardiomyopathy alleles are W4R in the N-terminus and K69R, which lies in
          a conserved region next to the first LIM domain that is involved in alpha-actinin binding. W4R
          is a common European allele that did not segregate with disease in the one family where segregation
          was tested. Whether either allele causes dilated cardiomyopathy on its own is unresolved (see
          the discussions).
        genes:
        - preferred_term: CSRP3
          term:
            id: hgnc:2472
            label: CSRP3
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Further, a human MLP mutation (W4R) associated with dilated cardiomyopathy (DCM) results
          in a marked defect in T-cap interaction/localization.
        supports: SUPPORT
