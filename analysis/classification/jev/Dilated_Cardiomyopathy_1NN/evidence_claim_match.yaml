            description: 'Guideline-directed heart-failure therapy for the manifest phenotype, dosed for
              age. There is no RAF1-directed or CMD1NN-specific approved therapy, so management is phenotype-based
              and identical to that for other genetic dilated cardiomyopathies: renin-angiotensin blockade
              with an ACE inhibitor or an angiotensin receptor-neprilysin inhibitor, a beta-blocker, a
              mineralocorticoid receptor antagonist, and, in eligible patients, an SGLT2 inhibitor. A
              loop diuretic is used for congestion but is symptomatic rather than disease-modifying, and
              is not bound here because no cited source in this entry states that indication for dilated
              cardiomyopathy specifically. Nothing in this regimen acts on the RAF1 lesion; it acts on
              the neurohormonal remodelling downstream of it.'
