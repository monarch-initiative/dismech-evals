      assertion_type: Discussion
      assertion:
        discussion_id: cmd1nn_gene_disease_validity_unadjudicated
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Would RAF1-dilated cardiomyopathy survive a formal ClinGen gene-disease validity curation
          as an entity distinct from RAF1-Noonan syndrome?
        attaches_to:
        - genetic#RAF1
        rationale: ClinGen's RASopathy Gene Curation Expert Panel has curated RAF1 against Noonan syndrome
          and classified it Definitive. No ClinGen assertion exists for RAF1 against dilated cardiomyopathy,
          so the entity's gene-disease validity has never been graded by the body whose gradings this
          knowledge base otherwise treats as authoritative. The supporting human genetic evidence is concentrated
          in a single 2014 case-control resequencing report, and a subsequent clinical panel cohort found
          pathogenic RASopathy-gene variants only among patients tested for hypertrophic cardiomyopathy.
          This is a gap in adjudication rather than a positive refutation - the mechanism evidence is
          strong and independent - but it is the reason this entry does not describe the gene-disease
          relationship as definitive.
      selected_evidence:
        snippet: RAF1 | HGNC:9829 | Noonan syndrome | MONDO:0018997 | AD | Definitive
        supports: SUPPORT
        directness: DIRECT
