          value:
            name: RAF1 Variant Altering Kinase Activity
            biological_scale: MOLECULAR
            role: trigger
            conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
            description: 'The initiating lesion is a rare heterozygous RAF1 variant - in most reported
              cases a missense substitution, and in one North Indian case a frameshift truncation (p.R254fs)
              - in the gene encoding the RAF-1 (CRAF) serine/threonine kinase of the RAS-MAPK pathway.
              What distinguishes the dilated-cardiomyopathy alleles from the Noonan-syndrome ones is not
              merely their position but the direction of their effect on the kinase. The Noonan hotspots
              flank Ser259 and raise kinase activity; the dilated-cardiomyopathy alleles have been reported
              to have reduced kinase activity relative to the hypertrophic-cardiomyopathy alleles and
              to leave the residues critical to regulation unaltered. Molecular dynamics of the C-terminal
              variants makes the same point at residue resolution: the DCM-associated p.Leu603Pro substitution
              drives the kinase domain into an inactive conformation, while the HCM-associated S612T and
              L613V substitutions - only a few residues away - stabilise an active one. A single gain-of-function
              or loss-of-function label is therefore not warranted across the reported CMD1NN allele set,
              and none is asserted here.'
            genes:
            - preferred_term: RAF1
              term:
                id: hgnc:9829
                label: RAF1
            cell_types:
            - preferred_term: Cardiomyocyte
              term:
                id: CL:0000746
                label: cardiac muscle cell
            molecular_functions:
            - preferred_term: RAF-1 serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              modifier: ABNORMAL
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: BRAF-Dependent AKT Hyperactivation
        causal_link_type: DIRECT
        description: The altered RAF-1 kinase redirects signalling into the AKT arm rather than amplifying
          ERK.
      selected_evidence:
        snippet: Biochemical studies showed that DCM-associated RAF1 mutants had altered kinase activity,
          resulting in largely unaltered ERK activation but in AKT that was hyperactivated in a BRAF-dependent
          manner.
        supports: SUPPORT
        directness: DIRECT
