        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: 'CMD1NN is classified as an autosomal dominant trait (OMIM 615916). The reported
          alleles are heterozygous and predominantly missense substitutions in RAF1, with one frameshift
          truncation (p.R254fs) reported in the North Indian cohort of the discovery study, and the disease
          is described in the RASopathy cardiomyopathy literature as an inherited RAF1 phenotype. The
          direct evidence for the mode of inheritance is weaker than for the mechanism: the discovery
          report was a case-control resequencing study rather than a large pedigree study, and no penetrance
          estimate specific to RAF1 dilated cardiomyopathy has been published, so no penetrance value
          is recorded here.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: In addition, inherited abnormalities in one pathway gene, RAF1, cause pediatric-onset
          dilated cardiomyopathy.
        supports: SUPPORT
        directness: INDIRECT
