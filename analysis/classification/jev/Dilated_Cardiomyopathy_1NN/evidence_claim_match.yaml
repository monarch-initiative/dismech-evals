            term:
              id: MONDO:0014396
              label: dilated cardiomyopathy 1NN
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiomyopathy Gene Panel Including RASopathy Genes
        description: 'Molecular confirmation requires a cardiomyopathy panel that actually contains RAF1.
          This is not automatic: RASopathy genes were historically absent from cardiomyopathy panels,
          and the case for including them was made on the strength of the hypertrophic phenotype, where
          the yield is highest. The evidence for this route in dilated phenotypes is in fact negative:
          the one clinical service that prospectively tested 11 RASopathy genes in 419 referrals for dilated
          cardiomyopathy found no variant of clinical significance and concluded against testing in DCM.
          So the panel is the practical route to a molecular diagnosis of CMD1NN only because RAF1 happens
          to be carried on it, not because unselected DCM referrals are a productive place to look. A
          RAF1 variant of uncertain significance does not establish CMD1NN; phenotype fit, population
          frequency, segregation, allele class and functional data all have to be weighed, and the historical
          CMD1NN allele list carries mixed in-silico predictions.'
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: was recently associated with pediatric-onset dilated cardiomyopathy (DCM) (Dhandapany
          et al., 2014)
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
