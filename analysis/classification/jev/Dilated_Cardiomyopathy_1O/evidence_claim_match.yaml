        name: Cantu syndrome
        description: The gain-of-function pole of ABCC9 disease, and the mechanistic opposite of both
          CMD1O and AIMS. Cantu syndrome is autosomal dominant like CMD1O, so mode of inheritance does
          not separate them; the direction of the channel defect and the multisystem phenotype - hypertrichosis,
          vasodilation, hypotension, cardiomegaly - do. A report that says only "ABCC9 variant" without
          a direction cannot be assigned to any of the three.
      selected_evidence:
        snippet: The phenotype differs from Cantú syndrome, which is caused by gain-of-function ABCC9
          mutations, reflecting the opposing consequences of KATP loss- versus gain-of-function.
