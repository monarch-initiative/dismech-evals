      assertion_type: Pathophysiology
      assertion:
        name: Aberrant SUR2A ATP Hydrolytic Cycle
        description: SUR2A is an ABC protein and its nucleotide-binding domains hydrolyse ATP as part
          of normal channel operation; the hydrolytic cycle is the transduction step, not a housekeeping
          side reaction. In the mutant receptor the distribution of conformational states across that
          cycle is shifted, so the receptor no longer reports the prevailing Mg-nucleotide state faithfully
          to the pore. The defect is qualitative - regulation is displaced rather than simply reduced
          - which is why the modifier here is DYSREGULATED and not DECREASED.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: SUR2A nucleotide-binding-domain ATP hydrolysis
          modifier: DYSREGULATED
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
      selected_evidence:
        snippet: Mutant SUR2A proteins showed aberrant redistribution of conformations in the intrinsic
          ATP hydrolytic cycle, translating into abnormal K(ATP) channel phenotypes with compromised metabolic
          signal decoding.
        supports: SUPPORT
