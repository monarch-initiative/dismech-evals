      assertion:
        name: Sarcomeric and cytoskeletal dilated cardiomyopathy
        description: The high-evidence genetic causes of dilated cardiomyopathy - TTN, LMNA, FLNC, DSP,
          RBM20, PLN, BAG3, SCN5A, MYH7 and the other definitive and strong genes - are the differential
          that matters clinically, because they are what a cardiomyopathy panel is actually for and because
          an ABCC9 variant found alongside one of them does not explain the case. LMNA and FLNC in particular
          carry arrhythmic risk that changes management, so an arrhythmic dilated cardiomyopathy should
          not be attributed to ABCC9 until those are excluded.
      selected_evidence:
        snippet: Twelve genes (23%) from 8 gene ontologies were classified as having definitive (BAG3,
          DES, FLNC, LMNA, MYH7, PLN, RBM20, SCN5A, TNNC1, TNNT2, TTN) or strong (DSP) evidence.
        supports: SUPPORT
