      assertion:
        name: ABCC9 C-Terminal Catalytic-Domain Variant
        description: A heterozygous exon-38 ABCC9 variant in conserved C-terminal sequence adjacent to
          the second catalytic ATPase pocket of SUR2A. The two founding alleles are a missense p.(Ala1513Thr)
          and a frameshift p.(Leu1524fs); neither is a simple whole-protein null, and the frameshift truncates
          within the nucleotide-binding region rather than removing the subunit. Their location is the
          mechanistic point - these residues sit where the receptor performs nucleotide catalysis, not
          where it conducts potassium.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: These missense and frameshift mutations mapped to evolutionarily conserved domains adjacent
          to the catalytic ATPase pocket within SUR2A.
        supports: SUPPORT
