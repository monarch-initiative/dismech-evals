      assertion_type: Treatment
      assertion:
        name: Clinical Surveillance of First-Degree Relatives
        description: The recommendation that survives this gene's weak validity. Because ABCC9 is only
          Limited for dilated cardiomyopathy, a variant result cannot be used to release a relative from
          follow-up - but familial dilated cardiomyopathy is itself an indication for periodic clinical
          and imaging surveillance of first-degree relatives regardless of genotype, aimed at detecting
          disease early enough to treat. This entry elsewhere warns against acting on the genotype; without
          this record it would leave a reader with no positive recommendation for the family at all.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: cardiac surveillance of at-risk relatives
          term:
            id: NCIT:C15419
            label: Disease Screening
        notes: 'Curated as surveillance rather than as cascade genetic testing. The distinction is load-bearing
          for this gene: the testing caveat is covered separately under genetic counselling, and a Limited-validity
          gene does not support predictive testing, whereas clinical follow-up of the family stands on
          the familial phenotype alone.'
      selected_evidence:
        snippet: Provide a basic view of genetic risk assessment of at-risk asymptomatic relatives of
          a proband with DCM to inform cardiac surveillance and allow early detection and treatment of
          DCM to improve long-term outcome.
        supports: SUPPORT
