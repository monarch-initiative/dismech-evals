  10649cb364c7d0f7ba474b98b70bcb880bc8eb75b9e312ca1570ce7a7d9bcbe7:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1O
          disease_term:
            preferred_term: dilated cardiomyopathy 1O
            term:
              id: MONDO:0012062
              label: dilated cardiomyopathy 1O
        context: []
      assertion_type: Genetic
      assertion:
        name: ABCC9 variants of limited clinical validity for dilated cardiomyopathy
        gene_term:
          preferred_term: ABCC9
          term:
            id: hgnc:60
            label: ABCC9
        association: Limited
        relationship_type: DISPUTED
        notes: 'Curated as DISPUTED rather than CAUSATIVE. The ClinGen Dilated Cardiomyopathy Gene Curation
          Expert Panel classified the ABCC9-dilated cardiomyopathy relationship as LIMITED on 2024-11-15
          under SOP10, filed against the parent concept MONDO:0005021 rather than against MONDO:0012062.
          The human evidence has the shape that produces a Limited call: two probands from one 323-patient
          screen; segregation supported only by an affected father from whom no DNA was available; no
          independent replication cohort with comparable functional work; and a ClinVar spectrum in which
          variants of uncertain significance dominate. Later reports have added further ABCC9 alleles
          in Mexican and Chinese DCM cohorts, which is genuine accumulation but has not yet moved the
          classification. MONDO nonetheless models CMD1O as a gene-anchored disease concept, which is
          why this entry exists - DISPUTED records the evidence state, it does not retire the concept.'
        variants:
        - name: p.(Ala1513Thr)
          description: Missense variant, c.4537G>A, in exon 38, in conserved C-terminal sequence adjacent
            to the second catalytic ATPase pocket of SUR2A. One of the two founding alleles from the 323-patient
            idiopathic dilated cardiomyopathy screen. Case-level particulars (the proband's sex and age
            at diagnosis, her affected father, and the size of the control panel) appear only in the paywalled
            body of the 2004 paper and are not snippet-verifiable from the cached record, so they are
            not asserted as cited evidence anywhere in this entry.
        - name: p.(Leu1524fs)
          description: Frameshift variant, c.4570_4572delTTAinsAAAT, in exon 38, generating aberrant terminal
            residues and a premature stop within the SUR2A nucleotide-binding region. The second founding
            allele from the same screen. Because the truncation falls inside the regulatory nucleotide-binding
            machinery rather than removing the subunit, its consequence is curated as a catalytic and
            regulatory defect, not as a whole-protein null. As above, the case-level particulars are in
            the paywalled body of the 2004 paper only.
        - name: p.(Arg1506fs)
          description: Frameshift variant c.4517_4527del, reported subsequently in Mexican patients with
            dilated cardiomyopathy. Listed as part of the accumulating allele spectrum; not independently
            functionally characterised here.
        - name: p.(Lys976Ile)
          description: Missense variant reported in a Chinese dilated cardiomyopathy cohort. Listed as
            part of the accumulating allele spectrum.
        - name: p.(Arg1197Cys)
          description: Missense variant reported in a Chinese dilated cardiomyopathy cohort. Listed as
            part of the accumulating allele spectrum.
      selected_evidence:
        snippet: In DCM, ABCC9 and MYH6 have a high number of variants, predominantly VUS.
        supports: REFUTE
