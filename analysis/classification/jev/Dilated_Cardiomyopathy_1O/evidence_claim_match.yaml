          value:
            name: Adult cardiomyocyte-specific SUR2 deletion mouse
            species: Mouse
            genotype: Adult myocardium-restricted Abcc9 (SUR2) deletion
            publication: PMID:31061927
            description: The negative control the entry needs, and the single most important caveat on
              its mechanism. Deleting SUR2 selectively in the ADULT myocardium did not cause cardiomyopathy
              - it enhanced cardiomyocyte glucose uptake and protected against ischemia-reperfusion injury.
              Timing and tissue restriction therefore change the sign of the result, which argues against
              any simple rule that reduced cardiac SUR2 function produces dilated cardiomyopathy.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Failure of Metabolic-Electrical Adaptation Under Cardiac Stress
        relationship: FAILS_TO_RECAPITULATE
        fidelity: MODERATE
        description: Adult cardiomyocyte-restricted removal of the same subunit produced protection from
          ischemic stress rather than failed stress adaptation, the opposite direction to the node.
        limitations: This is a conditional complete deletion in the adult heart, not a germline heterozygous
          catalytic-domain variant, and its protective effect is attributed to a metabolic shift toward
          glucose uptake rather than to restored channel gating. It therefore constrains the causal claim
          without refuting the human association, and the discrepancy may reflect developmental timing,
          allele class, or the type of stress imposed.
        readouts:
        - name: Cardiomyocyte glucose uptake after adult SUR2 deletion
          target: Failure of Metabolic-Electrical Adaptation Under Cardiac Stress
          direction: INCREASED
          interpretation: The metabolic consequence of adult SUR2 deletion is a shift toward glucose utilisation,
            a compensation rather than the predicted failure.
      selected_evidence:
        snippet: This receptor was now selectively deleted in adult mouse myocardium resulting in protection
          from ischemia reperfusion injury.
        supports: REFUTE
