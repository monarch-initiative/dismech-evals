        rationale: 'This is the sharpest tension in the entry and it is a direction mismatch, not a strength-of-evidence
          quibble. Adult cardiomyocyte-restricted SUR2 deletion increased glucose uptake and protected
          against ischemia-reperfusion injury, the opposite sign to what the CMD1O mechanism predicts.
          Several things could explain it and they have different consequences. Developmental timing may
          matter, since the same gene deleted earlier produces cardiomyopathy. Allele class may matter:
          a conditional complete deletion is not a heterozygous catalytic-domain variant, and a receptor
          that is absent is not the same as a receptor that mis-reports nucleotide state - a mis-gated
          channel could plausibly be worse than no channel. The stressor may matter, since acute ischemia-reperfusion
          is not chronic hemodynamic load, and the KATP-null literature is explicit that phenotypes are
          unmasked by the specific stress imposed. Until this is resolved, the entry does not assert that
          reducing cardiac SUR2 function is sufficient for dilated cardiomyopathy.'
        proposed_experiments:
        - experiment_id: exp_cmd1o_timing_and_allele_comparison
          name: Matched comparison of adult conditional deletion, germline null, and catalytic-domain
            knock-in
          description: Impose the same chronic pressure-overload protocol on adult cardiomyocyte-specific
            SUR2 deletion, germline SUR2 loss, and a heterozygous catalytic-domain knock-in, with identical
            imaging and calcium readouts, to separate the timing, allele-class and stressor explanations
            for the sign reversal.
          would_refute:
          - pathophysiology#Failure of Metabolic-Electrical Adaptation Under Cardiac Stress
          supporting_outcome:
          - The catalytic-domain knock-in fails under chronic load while the adult conditional deletion
            does not, isolating allele class as the explanation.
          refuting_outcome:
          - All three genotypes are protected under chronic load, which would place the human association
            rather than the model in question.
      selected_evidence:
        snippet: SUR2-deleted cardiomyocytes had enhanced glucose uptake, and SUR2 forms a complex with
          the major glucose transporter.
        supports: SUPPORT
