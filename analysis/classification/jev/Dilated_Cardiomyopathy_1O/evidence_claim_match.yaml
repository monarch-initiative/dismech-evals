              label: dilated cardiomyopathy 1O
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Catalysis-Mediated KATP Pore Gating
        description: 'The sarcolemmal KATP channel is an octamer of four SUR2A subunits around four Kir6.2
          pores. With catalysis in SUR2A displaced, the pore''s nucleotide sensitivity is set incorrectly:
          the channel is present and can conduct, but it is no longer under proper regulatory control
          by the cell''s energetic state. That qualitative loss of regulatory control - rather than a
          quantitative drop in potassium current - is the reason this node carries LOSS_OF_FUNCTION rather
          than DECREASED.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: nucleotide-gated cardiac KATP channel activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0015272
            label: ATP-activated inward rectifier potassium channel activity
      selected_evidence:
        snippet: The major ventricular cardiomyocyte KATP channel is composed of SUR2 and Kir6.2, encoded
          by ABCC9 and KCNJ11, respectively.
        supports: SUPPORT
