  8aeb9ec8501a443de3cc491da399385c3973ca9f22c04369f91f9dd00affef8d:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1O
          disease_term:
            preferred_term: dilated cardiomyopathy 1O
            term:
              id: MONDO:0012062
              label: dilated cardiomyopathy 1O
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: abcc9_dcm_gene_disease_validity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is a heterozygous ABCC9 variant sufficient to cause dilated cardiomyopathy in humans,
          and if so which allele classes do it?
        attaches_to:
        - pathophysiology#ABCC9 C-Terminal Catalytic-Domain Variant
        - genetic#ABCC9 variants of limited clinical validity for dilated cardiomyopathy
        rationale: 'ClinGen''s Dilated Cardiomyopathy GCEP classifies ABCC9-DCM as Limited. The weaknesses
          are specific rather than general: two probands from a single screen; segregation resting on
          an affected father from whom no DNA was available; no replication cohort combining independent
          human genetics with comparable functional characterisation; and a ClinVar spectrum dominated
          by variants of uncertain significance. The functional work is strong for what it covers - the
          recombinant catalytic and gating defect is real and quantified - but it does not establish that
          a heterozygous allele is sufficient to produce the disease in a human heart. Until this is resolved
          no clinical inference should be drawn from an ABCC9 variant, and this entry curates the mechanism
          as proposed rather than established.'
        proposed_experiments:
        - experiment_id: exp_cmd1o_case_control_burden
          name: Case-control rare-variant burden test for ABCC9 in dilated cardiomyopathy
          description: Test whether rare ABCC9 variants, and specifically C-terminal nucleotide-binding-domain
            variants, are enriched in large sequenced dilated cardiomyopathy cohorts relative to ancestry-matched
            population controls. This is the analysis that would move the ClinGen classification in either
            direction and it has not been reported.
          would_support:
          - pathophysiology#ABCC9 C-Terminal Catalytic-Domain Variant
          supporting_outcome:
          - Significant excess of rare C-terminal ABCC9 variants in DCM cases over ancestry-matched controls
            after correction for multiple testing.
          refuting_outcome:
          - No enrichment, with the observed variant frequency in cases indistinguishable from population
            background.
        - experiment_id: exp_cmd1o_knockin_heterozygote
          name: Heterozygous knock-in of a human ABCC9 catalytic-domain allele
          description: Generate a heterozygous knock-in of p.(Ala1513Thr) or p.(Leu1524fs), or the murine
            equivalent, and test for stress-conditional cardiac disease. This would distinguish a dominant
            effect of the actual disease alleles from the complete-absence phenotype of the existing null
            models, which is the distinction the current animal evidence cannot make.
          would_support:
          - pathophysiology#Failure of Metabolic-Electrical Adaptation Under Cardiac Stress
          supporting_outcome:
          - Heterozygous knock-in animals develop ventricular dilation and reduced systolic function under
            adrenergic or pressure load while remaining near-normal at baseline.
          refuting_outcome:
          - Heterozygous knock-in animals are indistinguishable from wild type under the same imposed
            stress.
      selected_evidence:
        snippet: ABCC9 | HGNC:60 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited
        supports: SUPPORT
