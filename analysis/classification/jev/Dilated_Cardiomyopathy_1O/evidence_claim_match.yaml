      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: 'The asserted model is autosomal dominant: both founding probands carried a heterozygous
          ABCC9 variant. The 2004 report additionally describes an affected parent in one family from
          whom DNA was not available, so the transmission was never genotype-confirmed; that family detail
          sits in the paper''s paywalled body and is recorded here as context rather than as cited evidence.
          Penetrance and expressivity are unknown from two families, and ClinGen''s autosomal dominant
          classification of the gene-disease relationship is Limited rather than an endorsement of the
          mode. The contrast with the recessive ABCC9 disorder is load-bearing rather than incidental
          — in AIMS, heterozygous parents of biallelic probands show no conserved clinical pathology,
          so a single ABCC9 loss-of-function allele is not on its own sufficient for the AIMS phenotype.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
