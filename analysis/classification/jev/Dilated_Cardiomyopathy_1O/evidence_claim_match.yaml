      assertion_type: ChannelopathyAssignment
      assertion:
        classification_value: cardiac channelopathy
        notes: 'CMD1O is a KATP channelopathy of the ventricular cardiomyocyte. Note that the value is
          used here for a channel defect that presents as structural and contractile disease rather than
          as a primary rhythm syndrome in a structurally normal heart: ventricular tachycardia was prominent
          in both index cases, but the defining phenotype is chamber dilation with severely reduced systolic
          function. This is also why the entry conforms to cardiomyopathy_maladaptive_remodeling and NOT
          to cardiac_ion_channel_repolarization, whose scope is explicitly inherited arrhythmia syndromes
          in structurally normal hearts.'
      selected_evidence:
        snippet: KATP channelopathies implicated in patients with mechanical and/or electrical heart disease
          include dilated cardiomyopathy (with ventricular arrhythmia; CMD1O) and adrenergic atrial fibrillation.
        supports: SUPPORT
