          complication, rhythm assessment carries more weight here than in a purely mechanical dilated
          cardiomyopathy. There is no CMD1O-specific monitoring protocol; this reflects the arrhythmic
          phenotype of the founding cases and the general arrhythmic-risk-stratification pathway for DCM,
          which is itself an area where guidelines diverge.
        diagnosis_term:
          preferred_term: ambulatory electrocardiographic monitoring
          term:
            id: NCIT:C38064
            label: Holter Monitoring
      selected_evidence:
        snippet: Scanning of genomic DNA from individuals with heart failure and rhythm disturbances due
          to idiopathic dilated cardiomyopathy identified two mutations in ABCC9, which encodes the regulatory
          SUR2A subunit of the cardiac K(ATP) channel.
        supports: SUPPORT
