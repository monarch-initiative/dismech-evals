          the channel is present and can conduct, but it is no longer under proper regulatory control
          by the cell''s energetic state. That qualitative loss of regulatory control - rather than a
          quantitative drop in potassium current - is the reason this node carries LOSS_OF_FUNCTION rather
          than DECREASED.'
