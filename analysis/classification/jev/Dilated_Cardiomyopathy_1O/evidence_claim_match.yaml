        notes: The deep-research report gives a quantitative late-gadolinium-enhancement threshold predicting
          sudden cardiac death. That figure is not present in any reference cached for this entry and
          is therefore not curated.
      selected_evidence:
        snippet: cardiac magnetic resonance (CMR) is universally recommended for its ability to assess
          cardiac function and tissue characterization during the initial evaluation, as well as for identifying
          specific cardiomyopathy phenotypes and distinguishing them from phenocopies.
