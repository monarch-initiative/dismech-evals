  2fe517160c747d5bf5e6546797700640f4b3ac0d9505bf06c01b5a0316319f09:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1O
          disease_term:
            preferred_term: dilated cardiomyopathy 1O
            term:
              id: MONDO:0012062
              label: dilated cardiomyopathy 1O
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: abcc9_no_targeted_therapy_or_trials
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is there any CMD1O-directed therapy, and can KATP pharmacology be turned on this disease
          at all?
        attaches_to:
        - treatments#Guideline-Directed Medical Therapy for HFrEF
        - pathophysiology#Defective Catalysis-Mediated KATP Pore Gating
        rationale: 'A ClinicalTrials.gov search performed for this entry on 2026-09-04 returned no interventional
          trial for dilated cardiomyopathy 1O, CMD1O, or SUR2A-related cardiomyopathy. The single ABCC9-named
          registered study (NCT04120766) is a nicorandil trial in hippocampal sclerosis and dementia,
          not a cardiac study, so no `clinical_trials` block is curated here. The pharmacological obstacle
          is real rather than a matter of neglect: KATP openers and blockers cross-react across Kir6 and
          SUR subfamilies, so a drug aimed at cardiac SUR2A can produce the pancreatic or vascular version
          of the opposite pathology. The existing preclinical glibenclamide work addresses gain-of-function
          Cantu syndrome, which is the wrong direction for CMD1O, and the adult-deletion mouse result
          means even the intended direction of correction is not settled.'
        proposed_experiments:
        - experiment_id: exp_cmd1o_ipsc_cardiomyocyte_gating_rescue
          name: Patient-allele iPSC-cardiomyocyte gating and metabolic-stress rescue screen
          description: Build isogenic iPSC-derived cardiomyocytes carrying p.(Ala1513Thr) or p.(Leu1524fs),
            measure KATP gating and action-potential adaptation under metabolic challenge, and test whether
            subunit-selective channel modulators restore the adaptation. This would establish both whether
            the human alleles break stress adaptation in a human cardiomyocyte and whether the defect
            is pharmacologically addressable.
          would_support:
          - pathophysiology#Defective Catalysis-Mediated KATP Pore Gating
          supporting_outcome:
          - Variant cardiomyocytes fail to adapt action-potential duration under metabolic challenge and
            adaptation is restored by a SUR2-selective modulator.
          refuting_outcome:
          - Variant and isogenic control cardiomyocytes show indistinguishable gating and adaptation under
            the same challenge.
      selected_evidence:
        snippet: while available drugs can be effective treatments for specific pathologies, cross-reactivity
          with the other Kir6 or SUR subfamily members can result in drug-induced versions of each pathology
          and may limit therapeutic usefulness
        supports: SUPPORT
