      assertion_type: AnimalModel
      assertion:
        name: PLN-R14del knock-in mouse
        species: Mouse
        genotype: Pln p.(Arg14del) knock-in, heterozygous and homozygous
        publication: PMID:32555305
        description: Knock-in mouse carrying the human R14del lesion. Heterozygotes, the genotype that
          matches human carriers, develop inducible arrhythmia susceptibility and a cardiomyopathy only
          at 18 months. Homozygotes show an accelerated course with dilatation, contractile failure, low
          ECG voltages, fibrosis, phospholamban aggregation and early death - useful for testing therapies
          quickly, but not the human genotype.
        modeled_mechanisms:
        - target: Arrhythmogenic Substrate Formation
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Heterozygous animals reproduce the arrhythmic susceptibility that defines the human
            disease.
          limitations: Arrhythmia is induced ex vivo rather than observed spontaneously, and beta-adrenergic
            challenge did not accelerate disease as it might be expected to in carriers.
        - target: Perinuclear Phospholamban-Positive Deposits
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Homozygous animals reproduce the hallmark phospholamban-positive material seen
            in human myocardium.
          limitations: Only the homozygous animals show it on this timescale, and homozygosity is essentially
            absent among human carriers, so the finding is reached through a genotype the disease does
            not normally present with.
      selected_evidence:
        snippet: In conclusion, our novel PLN-R14del mouse model exhibits most features of human disease.
        supports: SUPPORT
    origin:
