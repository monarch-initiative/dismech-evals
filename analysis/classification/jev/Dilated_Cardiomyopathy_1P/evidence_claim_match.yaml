      assertion_type: Discussion
      assertion:
        discussion_id: pln_r14del_penetrance_modifiers
        kind: KNOWLEDGE_GAP
        prompt: What determines whether a PLN R14del carrier remains asymptomatic into their seventies
          or reaches end-stage heart failure in their twenties? No genetic, epigenetic, or environmental
          modifier is validated.
        attaches_to:
        - genetic#PLN
        - clinical_trials#NCT04978987
        rationale: Penetrance is incomplete and age-dependent and expressivity varies widely within a
          single family carrying one founder allele, so the variance cannot be attributed to allelic heterogeneity.
          Without a modifier, risk stratification has to rest entirely on acquired phenotypic markers
          - ejection fraction, ectopic burden, T-wave changes, QRS voltage - which is why the arrhythmia
          risk model looks the way it does. A completed multi-omics cohort was designed around this question
          and had not identified a modifier at the time of its registration.
      selected_evidence:
        snippet: Within the same family, patients can present either with over heart failure in their
          20's or completely asymptomatic until at least their 70's. So far, no modifiers have been identified.
        supports: SUPPORT
    origin:
