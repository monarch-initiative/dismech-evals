        name: PLN p.Leu39Ter
        description: 'A nonsense allele (T116G, L39stop) truncating the protein within transmembrane domain
          II. It is a true null: essentially no stable phospholamban is produced, what little is made
          is misrouted away from the sarcoplasmic reticulum, and SERCA2a is left uninhibited. It is also
          the allele that breaks the dominant pattern - heterozygotes show hypertrophy with preserved
          contractility, and only homozygotes develop dilated cardiomyopathy, requiring transplantation
          in adolescence or early adulthood. Human phospholamban deficiency is therefore lethal, the inverse
          of the well-tolerated PLN-null mouse.'
