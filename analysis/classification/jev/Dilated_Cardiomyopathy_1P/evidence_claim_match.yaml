              label: dilated cardiomyopathy 1P
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PLN Regulatory Domain Variant
        biological_scale: MOLECULAR
        description: The initiating lesion is a germline variant in PLN. Pathogenic alleles cluster in
          the cytoplasmic regulatory domain that contacts SERCA2a and carries the Ser16/Thr17 phosphorylation
          sites (p.Arg9Cys, p.Arg14del, p.Arg25Cys), or truncate the protein within transmembrane domain
          II (p.Leu39Ter). The downstream branches are allele-specific and are modelled separately rather
          than merged, because the three classes perturb the SERCA2a-phospholamban regulatory couple in
          different directions.
        locations:
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        cell_types:
        - preferred_term: ventricular cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: phospholamban inhibitor activity toward the SERCA2a calcium pump
          term:
            id: GO:0004857
            label: enzyme inhibitor activity
      selected_evidence:
        snippet: PLN is a 52 amino acid transmembrane protein that modulates Ca2+ homeostasis and cardiac
          contractility through reversible inhibition of the sarcoplasmic reticulum (SR) calcium ATPase
          (SERCA2a) activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37144056
      reference_title: 'Phospholamban R14del disease: The past, the present and the future.'
      evidence_source: OTHER
      explanation: 'Establishes the normal function that the disease alleles disrupt: reversible inhibition
        of SERCA2a, which places the lesion in calcium reuptake rather than in force generation.'
