          volume. Critically, the lateral-wall pattern is present in younger carriers whose ventricular
          structure and function are still completely normal, which is why this entry treats cardiac magnetic
          resonance as an early-detection tool rather than as confirmation of an already-evident cardiomyopathy.
        notes: The cohort is a single large Chinese PLN-R14del family, so the pattern is well described
          but its sensitivity and specificity are not established.
