      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pln_ser_malformation
        hypothesis_label: Sarco/Endoplasmic Reticulum Malformation and Proteostasis Model
        status: EMERGING
        description: 'A competing, non-mutually-exclusive model holding that the primary lesion is abnormal
          phospholamban distribution and malformed sarco/endoplasmic-reticulum membrane architecture,
          with the downstream proteostatic and autophagic failure that follows, rather than altered SERCA2a
          kinetics. Two observations drive it: the direction and magnitude of the R14del effect on SERCA
          activity is disputed across systems, and the hallmark perinuclear structures turn out on close
          inspection to be clustered membrane rather than protein aggregate. The distinction is not academic
          - it decides whether therapeutic effort should go to the SERCA axis or to correcting membrane
          architecture and autophagic flux. Both arms are curated as parallel branches in this entry''s
          pathograph because the relative contribution is unsettled, not because both are established.'
      selected_evidence:
        snippet: However, recent studies raised controversy regarding the effect of PLN-R14del on SERCA
          activity
        supports: REFUTE
    origin:
