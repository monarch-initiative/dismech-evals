      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pln_serca_superinhibition
        hypothesis_label: SERCA2a Superinhibition Model
        status: CANONICAL
        description: 'The original and long-dominant model, and the one the calcium arm of this entry''s
          pathograph is built on: mutant phospholamban chronically suppresses SERCA2a activity in a manner
          that protein kinase A phosphorylation cannot relieve, so sarcoplasmic-reticulum calcium reuptake
          is persistently impaired and contractile and electrical dysfunction follow. It originates in
          the coexpression experiments that accompanied the discovery of the R14del allele in 2006.'
      selected_evidence:
        snippet: Thus, by chronic suppression of sarcoplasmic reticulum Ca(2+)-ATPase activity, the nonreversible
          superinhibitory function of mutant PLN-R14Del may lead to inherited dilated cardiomyopathy and
          premature death in both humans and mice.
        supports: SUPPORT
