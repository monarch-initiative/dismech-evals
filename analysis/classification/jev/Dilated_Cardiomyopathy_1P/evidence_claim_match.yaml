      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: 'The common disease alleles -- p.Arg14del, p.Arg9Cys, p.Arg25Cys -- are heterozygous
          and act dominantly, with incomplete, age-dependent penetrance and markedly variable expressivity
          within a single family. The truncating p.Leu39Ter allele is the exception: heterozygotes show
          hypertrophy without contractile impairment, and only homozygotes develop lethal dilated cardiomyopathy,
          so that allele behaves recessively for the dilated phenotype.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
      selected_evidence:
        snippet: By middle age, heterozygous individuals developed left ventricular dilation, contractile
          dysfunction, and episodic ventricular arrhythmias, with overt heart failure in some cases.
        supports: SUPPORT
