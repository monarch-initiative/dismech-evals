  2f4e8b380d09c0ab91624722495858397e1be6bb51e84372939c5fbc4380923b:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1P
          disease_term:
            preferred_term: dilated cardiomyopathy 1P
            term:
              id: MONDO:0012362
              label: dilated cardiomyopathy 1P
        context: []
      assertion_type: Genetic
      assertion:
        name: PLN
        gene_term:
          preferred_term: PLN
          term:
            id: hgnc:9080
            label: PLN
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: PLN encodes phospholamban, a 52-amino-acid sarcoplasmic reticulum transmembrane protein
          that reversibly inhibits SERCA2a, an inhibition relieved by protein kinase A phosphorylation
          at Ser16 and CaMKII phosphorylation at Thr17. It is the sole causative gene for this entry.
          The allelic series is mechanistically heterogeneous and the alleles are curated separately below
          rather than merged, because they perturb the phospholamban-SERCA2a couple in different directions.
          p.Arg9Leu, p.Arg9His and p.Arg25Cys are further reported alleles that are not separately curated
          here and require individual ACMG/AMP assessment.
        variants:
        - name: PLN p.Arg14del
          description: NM_002667.5:c.40_42delAGA, p.(Arg14del); also written R14del or R14. An in-frame
            single-codon deletion in the cytoplasmic regulatory domain and the best-studied PLN allele,
            with independent founder lineages in the northern Netherlands and in Greece. It produces SERCA2a
            superinhibition that protein kinase A phosphorylation cannot relieve, and in parallel mislocalizes
            phospholamban into malformed sarco/endoplasmic-reticulum clusters that block autophagic flux.
            Clinically it carries a high arrhythmic burden, and it is the only allele for which a validated
            variant-specific arrhythmia risk model exists.
          clinical_significance: PATHOGENIC
          type: in-frame deletion
        - name: PLN p.Arg9Cys
          description: 'A missense allele at residue 9, reported in an inherited dilated cardiomyopathy
            with refractory congestive heart failure. Its mechanism is distinct from R14del: the mutant
            protein does not itself inhibit SERCA2a but sequesters protein kinase A, preventing phosphorylation
            of the wild-type phospholamban made from the normal allele. The inhibitory brake is therefore
            applied in trans, by the wild-type protein, rather than by the mutant.'
          clinical_significance: PATHOGENIC
          type: missense
        - name: PLN p.Leu39Ter
          description: 'A nonsense allele (T116G, L39stop) truncating the protein within transmembrane
            domain II. It is a true null: essentially no stable phospholamban is produced, what little
            is made is misrouted away from the sarcoplasmic reticulum, and SERCA2a is left uninhibited.
            It is also the allele that breaks the dominant pattern - heterozygotes show hypertrophy with
            preserved contractility, and only homozygotes develop dilated cardiomyopathy, requiring transplantation
            in adolescence or early adulthood. Human phospholamban deficiency is therefore lethal, the
            inverse of the well-tolerated PLN-null mouse.'
          clinical_significance: PATHOGENIC
          type: nonsense
      selected_evidence:
        snippet: The growing number of identified variants highlights the previously underappreciated
          role of PLN in cardiac pathophysiology.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
