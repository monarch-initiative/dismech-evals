      assertion_type: Discussion
      assertion:
        discussion_id: pln_null_mouse_human_divergence
        kind: HUMAN_MODEL_MISMATCH
        prompt: Phospholamban ablation is benign, even beneficial, in the mouse but lethal in humans.
          Which species is informative for the consequences of reducing phospholamban, and what does that
          mean for silencing and gene-editing strategies that lower mutant or total PLN?
        attaches_to:
        - pathophysiology#Loss of Phospholamban Protein
        - animal_models#Mouse
        rationale: 'This is a mismatch rather than a gap: the murine evidence is abundant and unambiguous,
          it simply points the opposite way. Mice lacking phospholamban show enhanced sarcoplasmic-reticulum
          function and normal lifespan, which historically made PLN suppression look like an attractive
          heart-failure target; the human L39stop homozygotes instead required transplantation in their
          teens and twenties. The discrepancy matters directly for therapy, because the leading experimental
          approaches in R14del disease act by reducing mutant or total phospholamban, and the safety margin
          for depletion cannot be read off the mouse.

          Scope note: animal-model entity references resolve on species, so the `animal_models#Mouse`
          reference above matches both mouse models in this entry. The model at issue here is the phospholamban-null
          mouse, not the R14del knock-in.'
      selected_evidence:
        snippet: In contrast to reported benefits of PLN ablation in mouse heart failure, humans lacking
          PLN develop lethal dilated cardiomyopathy.
        supports: SUPPORT
