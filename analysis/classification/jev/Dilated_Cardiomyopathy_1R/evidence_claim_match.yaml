              sarcomere, and it was the first sarcomeric gene in which DCM-causing mutations were reported.
              The essential curation problem with this gene is that its alleles do not converge on one
              disease. The same gene underlies hypertrophic cardiomyopathy, left ventricular noncompaction,
              atrial septal defect and a distal arthrogryposis syndrome with congenital heart defects,
              and the HCM and congenital-heart literatures are considerably larger than the DCM one. A
              search on the gene symbol will return mostly material that does not belong in this entry.

              The evidence asymmetry is recorded by ClinGen: the Hypertrophic Cardiomyopathy Gene Curation
              Expert Panel classified ACTC1 for HCM as Definitive in 2021, while the Dilated Cardiomyopathy
              Gene Curation Expert Panel classified the same gene for DCM as Moderate in 2026, in a curation
              keyed to MONDO:0013261 itself. ACTC1-DCM is a real gene-disease relationship on a weaker
              evidential footing than ACTC1-HCM.'
            relationship_type: CAUSATIVE
