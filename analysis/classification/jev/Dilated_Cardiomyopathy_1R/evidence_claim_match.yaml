          direction: DECREASED
          interpretation: 'The lusitropic readout. DECREASED refers to the dobutamine-induced *increment*:
            wild type gains about 50% and the mutant only 20 to 30%, so the drug-stimulated relaxation
            response is smaller, not that relaxation is slower at baseline.'
