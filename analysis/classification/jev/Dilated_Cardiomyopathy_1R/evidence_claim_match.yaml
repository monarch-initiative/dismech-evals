  78789a6c0f9623fa9bc2131f48c81195e8c7d4a13c147782a006f23e54ac09ff:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1R
          disease_term:
            preferred_term: dilated cardiomyopathy 1R
            term:
              id: MONDO:0013261
              label: dilated cardiomyopathy 1R
        context: []
      assertion_type: Genetic
      assertion:
        name: ACTC1
        notes: 'ACTC1 at 15q14 encodes cardiac alpha-actin, the thin-filament monomer of the cardiac sarcomere,
          and it was the first sarcomeric gene in which DCM-causing mutations were reported. The essential
          curation problem with this gene is that its alleles do not converge on one disease. The same
          gene underlies hypertrophic cardiomyopathy, left ventricular noncompaction, atrial septal defect
          and a distal arthrogryposis syndrome with congenital heart defects, and the HCM and congenital-heart
          literatures are considerably larger than the DCM one. A search on the gene symbol will return
          mostly material that does not belong in this entry.

          The evidence asymmetry is recorded by ClinGen: the Hypertrophic Cardiomyopathy Gene Curation
          Expert Panel classified ACTC1 for HCM as Definitive in 2021, while the Dilated Cardiomyopathy
          Gene Curation Expert Panel classified the same gene for DCM as Moderate in 2026, in a curation
          keyed to MONDO:0013261 itself. ACTC1-DCM is a real gene-disease relationship on a weaker evidential
          footing than ACTC1-HCM.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: ACTC1
          term:
            id: hgnc:143
            label: ACTC1
        variants:
        - name: p.Arg312His (R312H)
          description: 'The principal DCM allele and one of the two identified in 1998. Its interest is
            that the same codon carries an HCM allele: R312C is found in hypertrophic cardiomyopathy patients
            and R312H in dilated cardiomyopathy patients, which makes this pair the cleanest available
            demonstration that in ACTC1 the allele determines the phenotype. The biophysical characterisation
            of R312H is inconsistent across laboratories and is the basis for the three hypothesis groups
            in this entry. One source notes it has also been seen in HCM patients, so even this allele
            is not phenotypically exclusive.'
          clinical_significance: PATHOGENIC
          type: missense_variant
          gene:
            preferred_term: ACTC1
            term:
              id: hgnc:143
              label: ACTC1
        - name: p.Glu361Gly (E361G)
          description: The second 1998 allele, and the only ACTC1 DCM variant modelled in a transgenic
            animal. All of the in vivo mechanistic evidence in this entry comes from that mouse.
          clinical_significance: PATHOGENIC
          type: missense_variant
          gene:
            preferred_term: ACTC1
            term:
              id: hgnc:143
              label: ACTC1
        - name: p.Thr126Ile (T126I)
          description: A DCM-associated ACTC1 allele modelled in zebrafish through the orthologous Acta1b
            substitution. No human clinical report of this allele is cited here; it enters the entry through
            the animal model, which is why no clinical_significance is asserted for it.
          type: missense_variant
          gene:
            preferred_term: ACTC1
            term:
              id: hgnc:143
              label: ACTC1
        - name: p.Ala222Thr (c.664G>A)
          description: A de novo allele in a one-year-old with severe DCM and sudden cardiac death. Absent
            from gnomAD and the other control databases, and reported in ClinVar by other submitters,
            including two likely-pathogenic de novo DCM classifications. The case also carried a paternally
            inherited TTN variant classified as uncertain, and the authors do not attribute the phenotype
            to ACTC1 alone.
          clinical_significance: LIKELY_PATHOGENIC
          type: missense_variant
          gene:
            preferred_term: ACTC1
            term:
              id: hgnc:143
              label: ACTC1
      selected_evidence:
        snippet: ACTC1 | HGNC:143 | dilated cardiomyopathy 1R | MONDO:0013261 | AD | Moderate
        supports: SUPPORT
        directness: DIRECT
