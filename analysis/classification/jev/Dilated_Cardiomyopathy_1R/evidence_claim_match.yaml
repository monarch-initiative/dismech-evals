      assertion_type: DifferentialDiagnosis
      assertion:
        name: ACTC1-related hypertrophic cardiomyopathy
        description: The same gene with a different allele, and the commonest way an ACTC1 result is misattributed.
          ClinGen grades ACTC1 for HCM as Definitive, against Moderate for DCM, and the HCM literature
          on this gene is substantially larger. The R312 pair is the sharpest example, with R312C in HCM
          patients and R312H in DCM patients.
        distinguishing_features:
        - The imaging phenotype decides it - a thickened, non-dilated left ventricle with preserved or
          supranormal ejection fraction is HCM, not CMD1R.
        - Approximately 10 to 20 percent of HCM progresses to a dilated, hypokinetic stage, so a dilated
          ventricle in a known ACTC1 carrier may be end-stage HCM rather than primary DCM.
      selected_evidence:
        snippet: Even when a mutation causes a shift in contraction, long term effects can complicate
          diagnosis and treatment; for example, approximately 10-20 % of HCM cases are believed to progress
          into DCM (known as H-DCM)
        supports: SUPPORT
        directness: DIRECT
