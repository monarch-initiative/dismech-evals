      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: actc1_calcium_desensitization_model
        hypothesis_label: Thin-filament calcium-desensitization model
        status: CANONICAL
        description: 'The field''s default account of sarcomeric cardiomyopathy: hypertrophic alleles
          increase the calcium sensitivity of the myofilament and dilated alleles decrease it, so at a
          given systolic calcium transient the mutant sarcomere generates less force, the ventricle is
          hypocontractile, and it dilates. Applied to ACTC1 this is the model that predicts the R312C/R312H
          split at a single codon. It is recorded as CANONICAL because it is the frame the whole literature
          is written against, not because ACTC1 confirms it - the direct measurements on the ACTC1 DCM
          alleles are inconsistent with it as often as not, which is the substance of the other two hypothesis
          groups.'
        notes: The two REFUTE items disagree with each other as well as with the model - one laboratory
          reports R312H as calcium-sensitising and the other as desensitising. That disagreement is itself
          curated, in the knowledge-gap discussion, rather than resolved by picking a side.
      selected_evidence:
        snippet: HCM results from increases in calcium sensitivity and/or force production, while DCM
          results from reductions in these activities.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
