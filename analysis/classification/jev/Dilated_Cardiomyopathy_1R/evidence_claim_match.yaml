      reference: PMID:39802493
      reference_title: A gradient of force generation at rest differentiates cardiomyopathy outcomes with
        variants of actin located at the same residue.
      evidence_source: IN_VITRO
      explanation: The model stated in its own terms by a group that then goes on to test it on ACTC1.
