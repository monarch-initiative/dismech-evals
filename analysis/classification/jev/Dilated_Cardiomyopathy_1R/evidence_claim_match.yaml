  75796d6d78d38c872a93625710c4f3e59ce52e58db8e838482e635e2b0394f89:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1R
          disease_term:
            preferred_term: dilated cardiomyopathy 1R
            term:
              id: MONDO:0013261
              label: dilated cardiomyopathy 1R
        context:
        - path: /animal_models/1
          value:
            name: Acta1b p.T126I zebrafish
            species: Zebrafish
            genotype: Acta1b p.T126I, orthologous to human ACTC1 p.T126I
            publication: PMID:42563511
            description: 'A zebrafish knock-in carrying the fish orthologue of a human ACTC1 DCM allele,
              followed longitudinally and analysed separately by sex. Unlike the E361G mouse it develops
              spontaneous progressive dilated cardiomyopathy with ventricular dilation, pericardial effusion
              and reduced survival, without an imposed stress. Its most striking result is a sex effect:
              female mutants had earlier and sustained diastolic dysfunction, more remodelling and significantly
              worse survival.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Left Ventricular Dilation and Systolic Dysfunction
        relationship: RECAPITULATES
        fidelity: LOW
        description: Progressive dilation and pump failure arising without experimental provocation, which
          is the part of the human phenotype the mouse model does not reproduce unaided.
        limitations: 'Fidelity is LOW for a specific and important reason: the mutation was made in acta1b,
          a *skeletal* actin paralogue standing in for cardiac actin, because zebrafish gene duplication
          does not map one-to-one onto human ACTC1. The two-chambered zebrafish heart has no left ventricle,
          so "left ventricular dilation" is an interpretation of ventricular dilation in a single ventricle.
          The sexual dimorphism, which is the paper''s headline finding, has no established counterpart
          in human ACTC1 disease.'
        readouts:
        - name: Survival of adult mutants
          target: Left Ventricular Dilation and Systolic Dysfunction
          direction: DECREASED
          interpretation: Reduced survival accompanying progressive dilation, the organism-level consequence.
        - name: nppb transcript at pre-symptomatic stage
          target: Left Ventricular Dilation and Systolic Dysfunction
          direction: INCREASED
          interpretation: The natriuretic-peptide marker of cardiac stress rising before overt dysfunction,
            which is what makes this model informative about the pre-symptomatic phase.
      selected_evidence:
        snippet: These findings demonstrate that the Acta1b p.T126I mutation drives progressive, sex-specific
          DCM in zebrafish, highlighting biological sex as a critical modifier of sarcomeric cardiomyopathy
          progression and targeted therapy development.
        supports: SUPPORT
        directness: DIRECT
