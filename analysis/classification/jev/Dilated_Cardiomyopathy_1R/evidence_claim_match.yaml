      assertion:
        name: Cascade Screening of At-Risk Relatives
        description: 'Cardiac surveillance of first-degree relatives with genetic testing where the familial
          variant is known. The rationale in CMD1R is the disease''s own history: the gene was found by
          cosegregation in families, and the E361G mouse suggests carriers may look normal at rest until
          stressed, which is an argument for imaging relatives rather than waiting for symptoms. Contemporary
          implementation guidance for genotype-positive relatives of any cardiomyopathy gene suggests
          ECG plus echocardiography every one to three years before age sixty and every three to five
          years thereafter, individualised by variant, family history and phenotype. That interval is
          general cardiomyopathy practice, not an ACTC1 finding, and no CMD1R-specific surveillance schedule
          has been validated.'
