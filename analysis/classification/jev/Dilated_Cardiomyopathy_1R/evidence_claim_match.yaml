        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: actc1_tni_phosphorylation_uncoupling_model
        hypothesis_label: Troponin-I phosphorylation uncoupling and loss of cardiac reserve
        status: ALTERNATIVE
        description: 'The model with the best in vivo support in ACTC1. Normally, PKA phosphorylation
          of troponin I during beta-adrenergic stimulation desensitises the myofilament to calcium, which
          speeds relaxation and supplies inotropic and lusitropic reserve. The ACTC1 E361G allele abolishes
          that phosphorylation-dependent shift: calcium sensitivity becomes fixed rather than modulable.
          The predicted consequence is a heart that is normal at rest and fails under demand, and that
          is exactly what the E361G mouse shows - unremarkable baseline contractility and cardiac dimensions
          out to eighteen months, a blunted response to dobutamine, and overt systolic dysfunction only
          after four weeks of angiotensin II stress. Under this model the primary lesion is a regulatory
          one, and dilation is the consequence of chronic inability to meet load rather than of weak sarcomeres.'
        notes: Sourced entirely from one allele (E361G) in one transgenic line from one group. It is the
          most complete mechanistic account in ACTC1-DCM and also the narrowest, and no equivalent in
          vivo work exists for R312H.
      selected_evidence:
        snippet: We propose that the ACTC E361G mutation uncouples myofilament Ca(2+)-sensitivity from
          Troponin I phosphorylation and blunts the response to adrenergic stimulation, leading to a reduced
          cardiac reserve with consequent contractile dysfunction under stress, leading to dilated cardiomyopathy.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
