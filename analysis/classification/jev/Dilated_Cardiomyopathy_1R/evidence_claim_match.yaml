                id: hgnc:143
                label: ACTC1
          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Arg312His (R312H)
        description: 'The principal DCM allele and one of the two identified in 1998. Its interest is
          that the same codon carries an HCM allele: R312C is found in hypertrophic cardiomyopathy patients
          and R312H in dilated cardiomyopathy patients, which makes this pair the cleanest available demonstration
          that in ACTC1 the allele determines the phenotype. The biophysical characterisation of R312H
          is inconsistent across laboratories and is the basis for the three hypothesis groups in this
          entry. One source notes it has also been seen in HCM patients, so even this allele is not phenotypically
          exclusive.'
        clinical_significance: PATHOGENIC
