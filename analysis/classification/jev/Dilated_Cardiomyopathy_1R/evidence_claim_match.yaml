      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: actc1_residual_activity_relaxation_model
        hypothesis_label: Residual myosin activity under relaxing conditions
        status: EMERGING
        description: The newest proposal, and the one that most directly displaces calcium sensitivity
          as the discriminator. Characterising R312C and R312H side by side, both variants shifted calcium
          sensitivity in the same direction, but they differed in how much actomyosin activity persisted
          at pCa 10, where tropomyosin should be blocking myosin entirely. R312H filaments were the most
          active of the three under those relaxing conditions - every filament moved, where some wild-type
          filaments did not - while producing lower force under load. The proposal is that a sarcomere
          which never fully switches off cannot relax properly, and that chronic failure of relaxation,
          not weak contraction, is what dilates the ventricle.
        notes: 'The same 2024 paper notes that this has a therapeutic consequence which cuts against standard
          reasoning: a myosin activator, the intuitive drug for a hypocontractile DCM, would amplify the
          lesion if the lesion is excess resting activity.'
      selected_evidence:
        snippet: We observed a gradient of increased residual myosin activity with R312-ACTC variant proteins
          under relaxing conditions which may trigger different disease development.
        supports: SUPPORT
        directness: DIRECT
