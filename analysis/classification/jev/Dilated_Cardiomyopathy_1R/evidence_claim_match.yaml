  13b1a67339c17e034f046e2b9a8bf1c2382d5cdee4ed69d5d25534d2c818454a:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1R
          disease_term:
            preferred_term: dilated cardiomyopathy 1R
            term:
              id: MONDO:0013261
              label: dilated cardiomyopathy 1R
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Adrenergic Contractile and Lusitropic Reserve
        biological_scale: TISSUE
        role: amplifier
        mechanism_confidence: PROVISIONAL
        description: A ventricle that performs acceptably at rest but cannot increase its output or speed
          its relaxation when driven. In the E361G mouse, dobutamine raised cardiac output by 2,100 microlitres
          per minute in wild-type animals and only 900 in mutants, and the relaxation indices moved by
          a quarter to a third of the wild-type amount. Baseline cardiac dimensions and systolic function
          were essentially normal over four to eighteen months. The clinical reading is that CMD1R may
          be a disease of failed reserve, which would explain why human onset can be late and why an intercurrent
          stress can precipitate presentation.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: regulation of the force of heart contraction
          term:
            id: GO:0002026
            label: regulation of the force of heart contraction
          modifier: DECREASED
        locations:
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        notes: PROVISIONAL and mouse-only. No human CMD1R study has measured contractile reserve - by
          stress echocardiography, cardiopulmonary exercise testing or any other route - so this node
          is a mechanism imported from a transgenic model, not one observed in patients.
      selected_evidence:
        snippet: The inotropic effect of dobutamine was also blunted in ACTC E361G mice, and the dobutamine-stimulated
          increase in cardiac output (CO) was reduced from 2,100 to 900 μl/min.
        supports: SUPPORT
        directness: DIRECT
