          and lusitropic responses to dobutamine, measured by papillary muscle mechanics, conductance
          catheter and echocardiography, are the primary observations.
        limitations: A transgenic overexpression model rather than a knock-in, so the mutant protein competes
          with endogenous mouse actin at a ratio set by the transgene rather than by allelic balance.
          Mouse and human cardiac beta-adrenergic signalling and heart rates differ substantially, and
          the corresponding measurement - contractile reserve on stress testing - has never been made
          in a human ACTC1 carrier.
