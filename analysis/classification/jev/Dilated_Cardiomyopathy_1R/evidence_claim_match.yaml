      assertion_type: DifferentialDiagnosis
      assertion:
        name: TTN-truncating and other higher-evidence genetic dilated cardiomyopathy
        description: TTN truncating variants are the commonest identifiable genetic cause of DCM, and
          LMNA, BAG3, FLNC, RBM20, DES and PLN account for much of the rest. All are clinically indistinguishable
          from CMD1R; the separation is molecular. This differential is not academic for ACTC1 - the one
          detailed CMD1R case in the literature also carried a TTN variant, and its authors could not
          assign causality to either gene alone.
        distinguishing_features:
        - Only sequencing separates the genotypes; imaging and clinical course overlap.
        - A second variant in a higher-evidence DCM gene in the same patient weakens attribution to ACTC1,
          as in the reported infant case.
      selected_evidence:
        snippet: For a matter of fact, its crucial role and its nucleotide length make TTN the major affected
          gene in DCM cases [38, 39].
        supports: SUPPORT
        directness: DIRECT
