      assertion:
        name: ACTC1 Missense Variant in Cardiac Alpha-Actin
        biological_scale: MOLECULAR
        role: initiator
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        mechanism_confidence: ESTABLISHED
        description: A heterozygous missense substitution in cardiac alpha-actin, the monomer that polymerises
          into the thin filament. The DCM-associated alleles are single amino-acid changes at conserved
          residues; the two founding ones, R312H and E361G, lie in the parts of actin that engage the
          Z band and the intercalated disc rather than in the myosin-binding surface, which is why the
          original interpretation was a force-transmission defect. Notably, the intrinsic properties of
          the mutant protein are barely changed - polymerisation kinetics, melting temperature and DNase-I
          inhibition are close to wild type - so the lesion is in how the filament is regulated, not in
          whether it forms.
        genes:
        - preferred_term: ACTC1
          term:
            id: hgnc:143
            label: ACTC1
        molecular_functions:
        - preferred_term: actin filament binding within the cardiac thin filament
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: ABNORMAL
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: these results raise the possibility that defective transmission of force in cardiac myocytes
          is a mechanism underlying heart failure
        supports: SUPPORT
        directness: INDIRECT
