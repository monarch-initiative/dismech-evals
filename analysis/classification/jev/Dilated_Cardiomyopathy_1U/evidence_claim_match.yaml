          with dilated cardiomyopathy susceptibility in a 282-case, 306-control sample with an adjusted
          odds ratio of 1.30. It is not curated as a genetic record here. A single small unreplicated
          candidate-gene association is a different kind of claim from a monogenic locus, the effect size
          is at the edge of significance, and folding it in would make the CMD1U evidence base look broader
          than it is. It is recorded in a discussion instead.
