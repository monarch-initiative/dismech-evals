  b2fa246935fc8c9ed45949fba85f6ac660c85e6e9a043cf1568e54314fbf4222:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1U
          disease_term:
            preferred_term: dilated cardiomyopathy 1U
            term:
              id: MONDO:0013371
              label: dilated cardiomyopathy 1U
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Cardiovascular-restricted Psen1 conditional knockout mouse
        species: Mouse
        genotype: Psen1 conditional deletion (Sm22a-Cre or Myh6-Cre/ER, tamoxifen-induced); Psen1 null
        publication: PMID:28617969
        genes:
        - preferred_term: Psen1
          term:
            id: hgnc:9508
            label: PSEN1
        description: 'A panel of four genetically modified mouse lines deleting Psen1 constitutively or
          from the cardiovascular system and cardiomyocytes in the adult. Null animals die perinatally
          with retarded heart growth, ventricular dilatation, septal defects and valvular thickening;
          adult cardiovascular deletion produces sarcomeric and gap-junction ultrastructural abnormalities,
          spontaneous mortality and diastolic dysfunction.

          This is the only mouse work directed at the PSEN1-cardiomyopathy question rather than at Alzheimer
          disease. It is not a CMD1U model, and the entry does not treat it as one - the genes list carries
          PSEN1 because the lesion really is in that gene, but the lesion is deletion, not the CMD1U missense
          allele.'
        modeled_mechanisms:
        - target: Cardiac Sarcomeric and Intercalated-Disc Disorganisation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Deleting Psen1 from the mouse cardiovascular system reproduces a cardiomyocyte
            structural lesion and a functional cardiac deficit, establishing that presenilin-1 is required
            for normal cardiomyocyte architecture in vivo.
          limitations: Three separate gaps between this model and CMD1U. The allele is a deletion, while
            CMD1U is a heterozygous missense variant whose functional consequence - loss, gain, or neither
            - has never been determined; a knockout therefore cannot be assumed to model it. The functional
            phenotype reported is diastolic dysfunction with decreased left ventricular volume, which
            is not the dilated phenotype the human entity is named for, and the paper separately notes
            ventricular dilatation only in the constitutive null, which dies perinatally. And the model
            was not built on, or tested against, the Asp333Gly allele. No claim about the human disease
            mechanism rests on it.
          readouts:
          - name: Sarcomere Z-line width and sarcomere length in cardiomyocytes
            target: Cardiac Sarcomeric and Intercalated-Disc Disorganisation
            direction: ALTERED
            interpretation: 'Structural correlate of the disorganisation node: Z-lines widened and sarcomeres
              shortened in adult Psen1 knockout cardiomyocytes. Direction is ALTERED rather than INCREASED
              or DECREASED because the two measurements move in opposite directions.'
          - name: Left ventricular volume at end-systole and end-diastole
            target: Cardiac Sarcomeric and Intercalated-Disc Disorganisation
            direction: DECREASED
            interpretation: The functional consequence in this model is diastolic dysfunction with reduced
              ventricular volumes. Recorded because it is the opposite direction from the chamber dilatation
              the human entity is defined by, and that divergence is the main reason the model's fidelity
              is rated LOW.
      selected_evidence:
        snippet: PSEN1 null mutation resulted in perinatal death, retardation of heart growth, ventricular
          dilatation, septum defects, and valvular thickening.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
