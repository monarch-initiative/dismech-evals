  0a306aecb0a30b1b7e982e6f0207fb12d9333b0366945cd388bfc21c5c1de0ba:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1U
          disease_term:
            preferred_term: dilated cardiomyopathy 1U
            term:
              id: MONDO:0013371
              label: dilated cardiomyopathy 1U
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: psen1_dcm_calcium_evidence_tissue_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: The calcium mechanism proposed for CMD1U was measured in skin fibroblasts and in non-CMD1U
          myocardium. Does it hold in a cardiomyocyte carrying Asp333Gly?
        attaches_to:
        - pathophysiology#Dysregulated Cardiomyocyte Calcium Handling
        - mechanistic_hypotheses#psen1_calcium_handling_dcm
        rationale: 'Every piece of evidence for the calcium mechanism comes from the wrong cell, the wrong
          genotype, or both. Carrier calcium signalling was measured in cultured skin fibroblasts, which
          are not contractile and do not use SERCA2a. The presenilin-1/SERCA2a co-immunoprecipitation
          was done in myocardium from sporadic idiopathic dilated cardiomyopathy patients carrying promoter
          variants, not the CMD1U allele. The oligomer calcium experiment perturbed cardiomyocytes with
