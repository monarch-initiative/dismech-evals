  b4c2510cd62f3ca662518023a799412aaaff62d4107486d866543a1f5c23dd59:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1U
          disease_term:
            preferred_term: dilated cardiomyopathy 1U
            term:
              id: MONDO:0013371
              label: dilated cardiomyopathy 1U
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: psen1_dcm_gene_validity
        kind: CONTROVERSY
        status: OPEN
        prompt: Is PSEN1 a dilated cardiomyopathy gene at all, or is CMD1U an OMIM locus built on a single
          unreplicated family?
        attaches_to:
        - genetic#PSEN1
        - disease#Dilated Cardiomyopathy 1U
        rationale: 'Twenty years after the founding report there is still one family, one paper, and no
          independent pedigree. ClinGen''s expert panel has now looked at the evidence three times - 2020,
          2025, 2026 - and each time called it Disputed, on the ground that the reported disease-causing
          variants are too common in population data to be monogenic causes.

          The counter-argument is not nothing. The panel explicitly says its evidence neither supports
          nor refutes the relationship, and the founding pedigree''s segregation was real. Absence of
          replication in a locus nobody has looked for since is weak evidence of absence.

          This is recorded as an open controversy rather than resolved in either direction because the
          deciding experiment - a modern population-frequency and case-control reassessment of PSEN1 in
          a large dilated-cardiomyopathy cohort, or a cardiomyocyte model of Asp333Gly - has not been
          done. It matters practically: it determines whether PSEN1 belongs on a dilated-cardiomyopathy
          panel.'
        notes: The rs177415 association above is deliberately confined to this discussion rather than
          curated as a genetic record. Even taken at face value it is a susceptibility signal of small
          effect, not a monogenic locus, and a single unreplicated candidate-gene association at P = 0.039
          is the genre of finding least likely to survive replication. Curating it as a genetic record
          would make the CMD1U evidence base look broader than it is.
        proposed_experiments:
        - experiment_id: psen1_dcm_case_control_burden
          name: Modern population-frequency and case-control reassessment of PSEN1 in dilated cardiomyopathy
          description: Genotype PSEN1 across a large sequenced dilated-cardiomyopathy cohort and compare
            variant burden against a matched population reference, testing directly the observation the
            ClinGen classification rests on.
          would_support:
          - pathophysiology#PSEN1 Asp333Gly Missense Variant in Cardiomyocytes
          supporting_outcome:
          - Excess of rare, conserved PSEN1 missense variants in cases over ancestry-matched population
            controls, with Asp333Gly rare enough to be compatible with a monogenic effect.
          would_refute:
          - pathophysiology#PSEN1 Asp333Gly Missense Variant in Cardiomyocytes
          refuting_outcome:
          - No case-control burden difference, and reported disease-causing alleles present in population
            reference data at frequencies incompatible with a rare dominant cardiomyopathy.
      selected_evidence:
        snippet: Unconditional logistic regression adjusting for type 2 diabetes, hyperlipidemia, cigarette
          smoking, and gender, confirmed the association between that SNP rs177415 of the presenilin-1
          gene and the susceptibility of DCM (adjusted OR 1.300, 95% CI 1.013-1.669; P = 0.039).
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21656036
      reference_title: Polymorphisms of presenilin-1 gene associate with dilated cardiomyopathy susceptibility.
      evidence_source: HUMAN_CLINICAL
      explanation: The one other line of human evidence connecting PSEN1 to dilated cardiomyopathy, quoted
        so the effect size and the p-value are visible. INDIRECT because a common-variant susceptibility
        signal of this size is a different claim from a monogenic locus and cannot settle the controversy
        in either direction.
