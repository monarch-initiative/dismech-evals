      assertion:
        name: Natriuretic Peptide, Troponin and Multimodality Cardiac Imaging
        description: 'The laboratory and imaging workup that establishes the phenotype. A 2025 systematic
          review of dilated-cardiomyopathy guidelines found cross-guideline consensus on B-type natriuretic
          peptides and high-sensitivity troponin in laboratory testing and on multimodality cardiovascular
          imaging for initial diagnosis. None of this is PSEN1-specific: no biomarker, imaging feature
          or biopsy finding distinguishes a PSEN1 carrier from any other dilated cardiomyopathy, which
          is itself worth recording because it means the diagnosis of this entity rests entirely on sequencing
          plus pedigree.'
      selected_evidence:
        snippet: 'Our review revealed consensus on several key aspects: the definition of DCM, the use
          of B-type natriuretic peptides and high-sensitivity troponin in laboratory testing, the essential
          role of multimodality cardiovascular imaging for initial diagnosis, genetic counselling, and
          the management of advanced disease.'
