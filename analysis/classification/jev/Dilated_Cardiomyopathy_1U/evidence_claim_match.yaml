        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: psen1_calcium_handling_dcm
        hypothesis_label: Presenilin-1 dysfunction causes dilated cardiomyopathy through disturbed cardiomyocyte
          calcium handling
        status: ALTERNATIVE
        description: 'The only mechanistic model proposed for CMD1U: a PSEN1 variant perturbs presenilin-1
          in the cardiomyocyte, which disturbs sarcoplasmic-reticulum calcium handling - plausibly through
          the presenilin-1/SERCA2a association - and the resulting excitation-contraction defect drives
          dilatation and pump failure.

          It is recorded as ALTERNATIVE, not CANONICAL, because the disease it explains is itself disputed.
          Two supports exist and both fall short of the claim: carrier calcium signalling was measured
          in skin fibroblasts, and the PSEN1/SERCA2a co-immunoprecipitation came from idiopathic dilated
          cardiomyopathy hearts carrying promoter variants rather than the CMD1U allele. No cardiomyocyte
          carrying Asp333Gly has ever been studied.

          The model is nevertheless worth keeping, because it is amyloid-independent and is stated as
          such in the sources. That distinguishes it from the neuronal PSEN1 literature and makes it falsifiable:
          an isogenic D333G human iPSC-cardiomyocyte line with calcium-transient and SERCA2a-activity
          readouts would settle it in either direction.'
      selected_evidence:
        snippet: DCM may not be related to impaired APP cleavage by gamma secretase, suggesting that PSEN1
          (and PSEN2) could impact heart failure through an amyloid-independent mechanism
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
