      assertion_type: Pathophysiology
      assertion:
        name: PSEN1 Asp333Gly Missense Variant in Cardiomyocytes
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: HYPOTHETICAL
        description: 'A heterozygous germline PSEN1 missense variant, Asp333Gly, in the large hydrophilic
          cytoplasmic loop between transmembrane domains six and seven of presenilin-1. Presenilin-1 is
          expressed in myocardium as well as brain, so a cardiomyocyte-autonomous lesion is anatomically
          possible, and the founding study reported the variant segregating with aggressive dilated cardiomyopathy
          in one family.

          What the variant does to presenilin-1 in a cardiomyocyte has never been measured. There is no
          structural or biochemical characterisation of D333G in cardiac tissue, no D333G cardiomyocyte
          model, and no directional statement available about gamma-secretase activity in the heart of
          a carrier. The node is therefore typed as the proposed initiating lesion and given no modifier
          and no functional_impact_category: FunctionalImpactEnum has no value that would be honest here,
          since neither loss nor gain of function has been shown for this allele in this tissue.

          A second, independent PSEN1 lesion has been described in myocardium and is placed at the same
          point in the chain: two promoter-region variants found in sporadic idiopathic dilated cardiomyopathy
          that reduce presenilin-1 transcription and protein in the myocardium. These are a different
          genetic mechanism in different patients, not the CMD1U allele, and they are recorded here because
          they are the expression evidence ClinGen names as the only surviving support for a PSEN1-heart
          relationship.'
        genes:
        - preferred_term: PSEN1
          term:
            id: hgnc:9508
            label: PSEN1
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        genetic_context:
          gene:
            preferred_term: PSEN1
            term:
              id: hgnc:9508
              label: PSEN1
          allele_type: MISSENSE
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Heterozygous germline PSEN1 p.Asp333Gly, reported in a single dilated-cardiomyopathy
            family. No functional_impact_category is assigned because the functional consequence of this
            allele has not been determined in cardiac tissue or in a cardiomyocyte model.
      selected_evidence:
        snippet: Consistently, these variants decreased the expression of PS1 protein in the myocardium
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20194882
      reference_title: Protein aggregates and novel presenilin gene variants in idiopathic dilated cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Direct demonstration that PSEN1 sequence variation can reduce presenilin-1 protein
        in human myocardium. INDIRECT for this node because the variants concerned are promoter variants
        in sporadic idiopathic dilated cardiomyopathy, not the CMD1U Asp333Gly allele.
