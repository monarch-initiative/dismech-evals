        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ventricular Remodeling and Chamber Dilatation
        conforms_to: cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling
        biological_scale: TISSUE
        role: central_effector
        description: 'Adverse structural remodeling of the left ventricle - chamber dilatation with wall
          thinning - as the shared final common path of the cardiomyopathies. Nothing in the CMD1U literature
          characterises remodeling in a PSEN1 carrier heart specifically: there is no histology, no fibrosis
          quantification, and no imaging series. The node is curated because the reported clinical phenotype
          is dilated cardiomyopathy and this is the step that word names, and it conforms to the shared
          module rather than claiming disease-specific detail.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
      selected_evidence:
        snippet: 'Our review revealed consensus on several key aspects: the definition of DCM, the use
          of B-type natriuretic peptides and high-sensitivity troponin in laboratory testing, the essential
          role of multimodality cardiovascular imaging for initial diagnosis, genetic counselling, and
          the management of advanced disease.'
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
