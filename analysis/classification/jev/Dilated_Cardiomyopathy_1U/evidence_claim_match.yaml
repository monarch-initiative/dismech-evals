        name: Multigene Cardiomyopathy Panel Testing
        description: 'Genetic testing is by panel or exome. For PSEN1 the point is not efficiency but
          interpretation: with the gene-disease relationship classified Disputed, a PSEN1 variant found
          in a dilated-cardiomyopathy proband should not be reported as a molecular diagnosis, and cascade
          testing of relatives on the strength of one is difficult to justify. The value of testing such
          a patient is to find a variant in a gene with real support.

          Whether PSEN1 belongs on an evidence-based dilated-cardiomyopathy panel at all is a live question
          that this entry does not settle.'
