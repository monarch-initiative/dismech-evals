              id: MONDO:0013371
              label: dilated cardiomyopathy 1U
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Cardiomyocyte Calcium Handling
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'The proposed effector step: disturbed intracellular calcium regulation in the cardiomyocyte.
          Two separate observations point at it, and neither was made in a cardiomyocyte carrying the
          CMD1U allele.

          First, cultured skin fibroblasts from PSEN1 and PSEN2 mutation carriers in the founding families
          showed altered calcium signalling. Fibroblasts are an accessible surrogate, not a contractile
          cell, and the paper reports the abnormality without asserting a myocardial equivalent.

          Second, presenilin-1 co-immunoprecipitates with SERCA2a, the cardiac sarcoplasmic-reticulum
          calcium ATPase, in explanted idiopathic dilated cardiomyopathy hearts. That is a physical association
          in human myocardium and is the most cardiac-specific molecular result in this literature. It
          is an interaction, not a rate: no measurement of SERCA2a activity in a PSEN1-variant heart exists,
          so the node carries no direction. The biological process below is tagged DYSREGULATED rather
          than INCREASED or DECREASED for that reason - the sources say "altered", and choosing a direction
          would be an invention.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: calcium ion transmembrane transport
          term:
            id: GO:0070588
            label: calcium ion transmembrane transport
          modifier: DYSREGULATED
        molecular_functions:
        - preferred_term: SERCA2a P-type calcium transporter activity
          term:
            id: GO:0005388
            label: P-type calcium transporter activity
        locations:
        - preferred_term: left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
      selected_evidence:
        snippet: Calcium signaling was altered in cultured skin fibroblasts from PSEN1 and PSEN2 mutation
          carriers.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17186461
      reference_title: Mutations of presenilin genes in dilated cardiomyopathy and heart failure.
      evidence_source: IN_VITRO
      explanation: 'The only functional measurement made in cells from CMD1U carriers. Graded IN_VITRO
        because the measurement was made in cultured cells, and INDIRECT because skin fibroblasts are
        a surrogate tissue: it supports a calcium phenotype in carrier cells, not in myocardium.'
