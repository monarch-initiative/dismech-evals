        external_id: CGGV:assertion_d71e8591-dece-4855-ae6c-d43e20cbf836-2026-03-04T170000.000Z
        url: https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_d71e8591-dece-4855-ae6c-d43e20cbf836-2026-03-04T170000.000Z
        description: 'The ClinGen Dilated Cardiomyopathy Gene Curation Expert Panel classifies the autosomal
          dominant PSEN1 - dilated cardiomyopathy 1U relationship as Disputed. The curation is against
          MONDO:0013371 itself, so it is about this entity rather than about dilated cardiomyopathy in
          general. First evaluated 2020, re-evaluated under SOP10 in May 2025 with no change, report dated
          2026-03-04. Its evidence summary is unusually specific about why: the reported disease-causing
          variants are too common in population reference data, so there is no scorable human genetic
          evidence, and the assertion rests on expression studies.'
        notes: 'The panel''s evidence summary cites the supporting expression study as "Gianni et al.,
          2010, PMID: 2019488". That identifier is one digit short of PMID:20194882, the Gianni 2010 Circulation
          paper on protein aggregates and presenilin variants in idiopathic dilated cardiomyopathy, which
          matches the author, year and description exactly. This entry cites the full, correct identifier;
          the truncated form is left as-is inside the quoted snippets because a snippet belongs to its
          source.'
