      selected_evidence:
        snippet: Heart failure usually results from dilated cardiomyopathy (DCM). ... We hypothesized
          that mutations in presenilins may also be associated with DCM and that their discovery could
          provide new insight into the pathogenesis of DCM and heart failure. A total of 315 index patients
          with DCM were evaluated for sequence variation in PSEN1 and PSEN2. Families positive for mutations
          underwent additional clinical, genetic, and functional studies. A novel PSEN1 missense mutation
          (Asp333Gly) was identified in one family, and a single PSEN2 missense mutation (Ser130Leu) was
          found in two other families. Both mutations segregated with DCM and heart failure.
        supports: SUPPORT
