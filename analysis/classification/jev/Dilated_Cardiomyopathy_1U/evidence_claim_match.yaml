          ventricle. It is included because it is part of dilated-cardiomyopathy management and because
          the guidelines disagree about it: a 2025 systematic review found the criteria for prophylactic
          defibrillator implantation to be one of the areas where dilated-cardiomyopathy guidelines vary,
          along with arrhythmic risk stratification generally.

          Nothing about a PSEN1 result should shift that decision in either direction. There is no reported
          arrhythmic phenotype for this locus and, with the gene-disease relationship disputed, no basis
          for treating a PSEN1 variant as the kind of high-risk genotype - LMNA, FLNC, RBM20 - that does
          modify defibrillator thresholds.'
        treatment_term:
          preferred_term: implantable cardioverter-defibrillator placement
          term:
            id: NCIT:C80435
            label: Implantable Cardioverter-Defibrillator Placement
      selected_evidence:
        snippet: Nonetheless, notable areas of variation included the formation of multidisciplinary management
          teams, the role of cascade genetic testing, pathways for arrhythmic risk stratification, and
          the criteria for prophylactic defibrillator implantation.
        supports: SUPPORT
        directness: INDIRECT
