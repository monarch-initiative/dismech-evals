      assertion_type: Discussion
      assertion:
        discussion_id: psen1_cardiac_phenotype_breadth
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is the cardiac phenotype reported for PSEN1 dilated at all, given that the most recent
          case report describes hypertrophic cardiomyopathy?
        attaches_to:
        - phenotypes#Dilated Cardiomyopathy
        rationale: 'A 2026 case report describes a heterozygous PSEN1 variant in a man with nonobstructive
          hypertrophic cardiomyopathy and later ventricular fibrillation, framed by its authors as expanding
          the cardiac phenotype of PSEN1. That is a different variant and a different cardiomyopathy -
          hypertrophic, not dilated - so it is no evidence for CMD1U and is not curated as such.

          It is recorded because it bears on how the whole PSEN1 cardiac literature should be read. When
          single case reports attach a gene to hypertrophic cardiomyopathy, dilated cardiomyopathy, and
          arrhythmogenic right ventricular cardiomyopathy exome cohorts in turn, each on tiny numbers,
          the pattern is more consistent with a much-sequenced gene accruing incidental variants than
          with a coherent cardiac disease entity. That reading is the same one ClinGen''s population-frequency
          argument arrives at from a different direction.'
      selected_evidence:
        snippet: This report suggests an expansion of the phenotypic spectrum associated with PSEN1 variants
          and highlights the need for further investigation of potential cardiac manifestations in PSEN1
          variant carriers.
        supports: SUPPORT
        directness: INDIRECT
