      assertion_type: ExperimentalModel
      assertion:
        name: PSEN1 delta-exon-9 patient iPSC-derived cardiomyocytes
        experimental_model_type: IPSC_DERIVED_MODEL
        publication: PMID:38851626
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        description: 'Cardiomyocytes differentiated from induced pluripotent stem cells of patients carrying
          the PSEN1 exon 9 deletion, compared against isogenic controls. This is the only human cardiomyocyte
          system in which a PSEN1 variant has been studied, and it finds a sarcoplasmic-reticulum calcium
          leak that is not blocked by ryanodine-receptor or IP3-receptor inhibition, producing a diastolic
          calcium buildup near the perinuclear SR and less releasable calcium during systole.

          The allele is wrong for this entry. PSEN1 delta-exon-9 is a familial Alzheimer disease variant,
          not the CMD1U Asp333Gly allele, and the patients were ascertained for dementia. So this system
          does not resolve the tissue mismatch that this entry''s central hypothesis rests on - it narrows
          it, by showing that a PSEN1 variant can disturb cardiomyocyte calcium in human cells, while
          leaving open whether the CMD1U allele does.'
        modeled_mechanisms:
        - target: Dysregulated Cardiomyocyte Calcium Handling
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Demonstrates that a PSEN1 variant produces a specific, mechanistically characterised
            calcium-handling defect in human cardiomyocytes, which is the class of result this node needs
            and has otherwise never had.
          limitations: 'Different allele, different disease and different ascertainment: PSEN1 delta-exon-9
            causes familial Alzheimer disease and these donors were not dilated-cardiomyopathy patients,
            so nothing here shows that Asp333Gly behaves the same way. The defect is an SR leak rather
            than the SERCA2a-uptake failure the human myocardial work implicates, and it left electrophysiological
            properties unchanged, so it is not obviously a route to a dilated phenotype. iPSC-derived
            cardiomyocytes are also immature relative to adult myocardium.'
          readouts:
          - name: Sarcoplasmic reticulum calcium leak against isogenic control
            target: Dysregulated Cardiomyocyte Calcium Handling
            direction: INCREASED
            interpretation: 'The core measurement, made against an isogenic control so the comparison
              is clean, and pharmacologically dissected: the leak survives blockade of both ryanodine
              and IP3 receptors, so it is not through either channel.'
          - name: Electrophysiological properties of the cardiomyocytes
            target: Dysregulated Cardiomyocyte Calcium Handling
            direction: UNCHANGED
            interpretation: 'A negative result worth recording: the calcium leak did not change the cells''
              electrophysiology, so whatever this variant does to a cardiomyocyte it does not do it through
              the action potential.'
      selected_evidence:
        snippet: This demonstrates that PSEN1 ΔE9 induced SR Ca2+ leak has specific effects in iPSC-CMs,
          reflecting their unique structural and calcium signaling features.
        supports: SUPPORT
