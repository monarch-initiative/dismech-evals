  fcb34cfd8affa70da45b41ef19ca30f5b0078443ac9a6c9f81daa3db99b134c2:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1U
          disease_term:
            preferred_term: dilated cardiomyopathy 1U
            term:
              id: MONDO:0013371
              label: dilated cardiomyopathy 1U
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Drosophila dPsn cardiac knockdown and overexpression
        species: Fruit fly
        genotype: Transgenic RNAi knockdown or overexpression of dPsn, the Drosophila presenilin ortholog
        publication: PMID:21524270
        description: 'Transgenic flies in which the single Drosophila presenilin ortholog is silenced
          or overexpressed, with cardiac function measured in living adults by optical coherence tomography.
          It was built specifically to ask what presenilin does in the heart after the human PSEN1 dilated-cardiomyopathy
          report, so unlike almost everything else in the presenilin literature it is not an Alzheimer
          model that happens to have a heart.

          Silencing produces an age-dependent increase in end-diastolic dimension - a dilating heart,
          the direction this entity is named for and the direction the mouse knockout does not give -
          together with slowed rate, arrhythmia, myofibril defects and mitochondrial impairment. The calcium
          result is what makes it relevant here: silencing dPsn raises dIP3R and lowers dSERCA expression,
          which is the fly counterpart of the presenilin-SERCA relationship proposed in human myocardium.'
        modeled_mechanisms:
        - target: Dysregulated Cardiomyocyte Calcium Handling
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Links a change in presenilin level to altered expression of the calcium-handling
            machinery and to a dilating, arrhythmic heart in the same animal - the only in vivo system
            in which the calcium arm of this entry's hypothesis and a dilated phenotype have been observed
            together.
          limitations: 'The Drosophila heart is a linear contractile tube with no chambers, no valves
            in the mammalian sense and no coronary circulation, so "end-diastolic vertical dimension"
            is not a left ventricular volume and the resemblance to human dilatation is analogical. The
            manipulation is knockdown or overexpression of the whole gene rather than the CMD1U missense
            allele, and it is not even clear which direction models the human variant: the authors report
            opposite cardiac effects for silencing and overexpression. The calcium finding is transcript
            abundance by RT-PCR, not pump activity or a calcium transient, and dSERCA is the single fly
            SERCA rather than the cardiac SERCA2a isoform the human work implicates. The paper''s own
            framing is that the mechanism was not understood.'
          readouts:
          - name: dSERCA and dIP3R transcript abundance in cardiac cells
            target: Dysregulated Cardiomyocyte Calcium Handling
            direction: ALTERED
            interpretation: The calcium-machinery readout, and the reason this model is attached to this
              node. The two transcripts move in opposite directions under dPsn silencing, so the direction
              is ALTERED rather than INCREASED or DECREASED.
          - name: End-diastolic vertical dimension of the adult fly heart
            target: Dysregulated Cardiomyocyte Calcium Handling
            direction: INCREASED
            interpretation: A chamber-dilation analogue measured in a living animal, and the one place
              in the presenilin cardiac literature where reducing presenilin produces dilatation rather
              than the small-ventricle diastolic phenotype of the mouse.
      selected_evidence:
        snippet: Our data provide novel evidence that changes in presenilin level leads to cardiac dysfunction,
          owing to aberrant calcium channel receptor activities and disrupted Wnt signaling transduction,
          indicating a pathogenic role for presenilin mutations in DCM pathogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21524270
      reference_title: Changes in the expression of the Alzheimer's disease-associated presenilin gene
        in drosophila heart leads to cardiac dysfunction.
      evidence_source: MODEL_ORGANISM
      explanation: The authors' own conclusion, which is the claim that makes this model informative for
        this entry - and note it names two routes, calcium handling and Wnt signalling, of which only
        the first is curated here because only the first has any human cardiac counterpart.
