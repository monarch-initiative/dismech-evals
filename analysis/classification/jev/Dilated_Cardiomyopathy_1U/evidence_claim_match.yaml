      reference: DOI:10.1093/ehjqcco/qcae109
      reference_title: 'Diagnosis and management of dilated cardiomyopathy: a systematic review of clinical
        practice guidelines and recommendations'
      evidence_source: OTHER
      explanation: 'Cited to anchor the node in the recognised disease class rather than to make a mechanistic
        claim: a systematic review of dilated-cardiomyopathy guidelines reports cross-guideline consensus
        on the disease definition and on the imaging that establishes it, which is what this node names.
        INDIRECT because it is about dilated cardiomyopathy generally, not remodeling in a PSEN1 carrier
        - of which nothing has been reported.'
