        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Idiopathic Dilated Cardiomyopathy
        description: 'Dilated cardiomyopathy with no identified cause, which is what a CMD1V patient has
          if the PSEN2 attribution is not accepted. This is not an academic alternative: with the relationship
          at Limited and both reported variants too common in population data, it is the diagnosis implied
          for many PSEN2 carriers with the phenotype. Note also that the second PSEN2 allele the expert
          panel counts was itself found in idiopathic rather than familial cases, so the boundary between
          the two categories is where part of this locus''s evidence base sits.'
        distinguishing_features:
        - Absence of a family history or of a segregating variant. Given how weak the genetic evidence
          is, the practical boundary between this and CMD1V is the pedigree at least as much as the genotype.
      selected_evidence:
        snippet: The coding region and promoters of PSEN1 and PSEN2 were sequenced in 20 patients with
          iDCM.
        supports: SUPPORT
