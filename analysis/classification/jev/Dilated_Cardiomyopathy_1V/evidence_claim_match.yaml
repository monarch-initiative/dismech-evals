  175e6c8d01313716cc3084d21e5c45be9b77e3dc80b7d094adee3ca6afc567e7:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1V
          disease_term:
            preferred_term: dilated cardiomyopathy 1V
            term:
              id: MONDO:0013373
              label: dilated cardiomyopathy 1V
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: psen2_dcm_gene_validity
        kind: CONTROVERSY
        status: OPEN
        prompt: Is PSEN2 a dilated cardiomyopathy gene, or is CMD1V an OMIM locus resting on two families
          and a variant that turns out to be too common?
        attaches_to:
        - genetic#PSEN2
        - disease#Dilated Cardiomyopathy 1V
        rationale: 'Twenty years after the founding report the human evidence is two families from the
          original screen plus two sporadic patients carrying a different allele, and the expert panel
          counts four probands in total. ClinGen has looked at it three times - 2019, 2024, 2026 - and
          each time called it Limited, on the ground that both reported disease-causing variants are too
          common in population reference data for a monogenic effect, and that nothing new has appeared.

          The counter-argument is stronger here than at the sibling PSEN1 locus, and that asymmetry is
          the interesting part. The panel credits the founding study with limited segregation and functional
          evidence for this allele - where for PSEN1 it found no scorable human genetic evidence at all
          - and there is a defined cardiac interaction partner for presenilin-2 in RyR2 and sorcin. Limited
          is a positive tier: it means some evidence exists and more is needed, not that the relationship
          is contested.

          This is recorded as an open controversy rather than resolved in either direction because the
          deciding work - a modern population-frequency and case-control reassessment of PSEN2 in a large
          dilated-cardiomyopathy cohort, or a cardiomyocyte model of Ser130Leu - has not been done. It
          matters practically: it determines whether PSEN2 belongs on a dilated-cardiomyopathy panel.'
        proposed_experiments:
        - experiment_id: psen2_dcm_case_control_burden
          name: Modern population-frequency and case-control reassessment of PSEN2 in dilated cardiomyopathy
          description: Genotype PSEN2 across a large sequenced dilated-cardiomyopathy cohort and compare
            variant burden against a matched population reference, testing directly the observation the
            Limited classification rests on.
          would_support:
          - pathophysiology#PSEN2 Ser130Leu Missense Variant in Cardiomyocytes
          supporting_outcome:
          - Excess of rare, conserved PSEN2 missense variants in cases over ancestry-matched population
            controls, with Ser130Leu rare enough to be compatible with a monogenic effect.
          would_refute:
          - pathophysiology#PSEN2 Ser130Leu Missense Variant in Cardiomyocytes
          refuting_outcome:
          - No case-control burden difference, and reported disease-causing alleles present in population
            reference data at frequencies incompatible with a rare dominant cardiomyopathy.
      selected_evidence:
