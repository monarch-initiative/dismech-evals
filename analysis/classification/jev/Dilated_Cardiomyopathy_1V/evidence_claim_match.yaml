        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PSEN2 Ser130Leu Missense Variant in Cardiomyocytes
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: HYPOTHETICAL
        description: 'A heterozygous germline PSEN2 missense variant, Ser130Leu, reported in two dilated
          cardiomyopathy families in the founding screen and segregating with disease in them. Presenilin-2
          is expressed in myocardium as well as brain, so a cardiomyocyte-autonomous lesion is anatomically
          possible.

          What the variant does to presenilin-2 in a cardiomyocyte has never been measured. There is no
          structural or biochemical characterisation of Ser130Leu in cardiac tissue, no Ser130Leu cardiomyocyte
          model, and no directional statement available about gamma-secretase activity in the heart of
          a carrier. The node is therefore typed as the proposed initiating lesion and given no modifier
          and no functional_impact_category: neither loss nor gain of function has been shown for this
          allele in this tissue, and FunctionalImpactEnum has no value that would be honest here.

          A second PSEN2 allele has been reported in myocardial disease and is placed at the same point
          in the chain rather than given its own node: the missense variant Arg62His, found in two of
          twenty sporadic idiopathic dilated-cardiomyopathy patients whose presenilin genes were sequenced.
          It is a different allele in different, non-familial patients, and it is recorded because the
          expert panel counts it as one of the two variants behind the Limited classification.'
        genes:
        - preferred_term: PSEN2
          term:
            id: hgnc:9509
            label: PSEN2
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        genetic_context:
          gene:
            preferred_term: PSEN2
            term:
              id: hgnc:9509
              label: PSEN2
          allele_type: MISSENSE
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Heterozygous germline PSEN2 p.Ser130Leu, reported in two dilated-cardiomyopathy
            families. No functional_impact_category is assigned because the functional consequence of
            this allele has not been determined in cardiac tissue or in a cardiomyocyte model.
      selected_evidence:
        snippet: Both mutations segregated with DCM and heart failure.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17186461
      reference_title: Mutations of presenilin genes in dilated cardiomyopathy and heart failure.
      evidence_source: HUMAN_CLINICAL
      explanation: The segregation observation in the index families that produced the CMD1U and CMD1V
        locus assignments.
