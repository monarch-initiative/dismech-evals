  c8b1e1121abef593a4d824546de3a3ff3b2f461282da3169dd0d5b240f0f2d90:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1V
          disease_term:
            preferred_term: dilated cardiomyopathy 1V
            term:
              id: MONDO:0013373
              label: dilated cardiomyopathy 1V
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: psen2_knockout_direction_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: The only in vivo cardiac phenotype for presenilin-2 loss is increased contractility with
          no dilatation. Does the proposed calcium mechanism actually point towards dilated cardiomyopathy?
        attaches_to:
        - pathophysiology#Dysregulated Cardiomyocyte Calcium Handling
        - mechanistic_hypotheses#psen2_calcium_handling_dcm
        rationale: 'Every piece of evidence for the calcium mechanism at this locus comes from the wrong
          cell, the wrong genotype, or the wrong direction. Carrier calcium signalling was measured in
          cultured skin fibroblasts, which are not contractile. The RyR2 and sorcin interaction was demonstrated
          in mouse heart and in a heterologous overexpression system, not in a carrier. And the one functional
          cardiac phenotype - from Psen2 knockout mice - shows increased contractility, larger calcium
          transients and no hypertrophy, fibrosis or dilatation.

          That last point is the substance of this mismatch and is worth stating precisely. It is not
          a refutation: CMD1V is a heterozygous missense allele, and a missense variant need not behave
          like a deletion - it could be a gain of function, a dominant negative, or act on a presenilin-2
          function the knockout does not isolate. But it does mean the mechanism cannot be read off the
          knockout, and any account that treats "presenilin-2 dysfunction impairs cardiomyocyte calcium
          handling and the heart dilates" as established is asserting a direction that the only in vivo
          experiment contradicts.

          This is a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap because the evidence is not
          absent - the model exists, is well characterised and is internally sound. What is missing is
          any demonstration that it composes into the human disease mechanism in the relevant genotype
          and direction.'
        proposed_experiments:
        - experiment_id: psen2_s130l_ipsc_cardiomyocyte_calcium
          name: Isogenic PSEN2 Ser130Leu human iPSC-cardiomyocyte calcium phenotyping
          description: Introduce Ser130Leu into a human iPSC line by genome editing, differentiate to
            cardiomyocytes alongside the isogenic wild-type parent, and measure calcium transients, sarcoplasmic-reticulum
            calcium load, RyR2-mediated leak and contractility.
          would_support:
          - pathophysiology#Dysregulated Cardiomyocyte Calcium Handling
          supporting_outcome:
          - Altered calcium transient kinetics and impaired contractility in the Ser130Leu cardiomyocytes
            relative to the isogenic control, in the direction of reduced rather than enhanced systolic
            performance.
          would_refute:
          - pathophysiology#Dysregulated Cardiomyocyte Calcium Handling
          refuting_outcome:
          - Calcium transients, sarcoplasmic-reticulum load and contractility indistinguishable from the
            isogenic wild-type control.
      selected_evidence:
        snippet: Invasive hemodynamic analysis revealed that cardiac contractility in PS2KO mice increased
          compared with that in their littermate controls.
        supports: REFUTE
    origin:
      assertion_path: /discussions/1
