        description: 'Presenilin-2 is present in myocardium and its level moves with cardiac stress: it
          is detectable in cultured cardiac cells and in adult rat heart, rises with glucose deprivation
          and hypoxia in cardiac cells, and is increased in the failing myocardium of dogs with heart
          failure, where a contractility-modulation therapy that improves ventricular function normalises
          it again.

          This node is kept outside the disease''s causal chain deliberately, and no downstream edge is
          drawn from it. It is the expression work the ClinGen panel names as supporting the gene-disease
          relationship, so it belongs in the entry; but every observation in it is correlative and none
          involves a PSEN2 variant. The direction of causality is exactly what is unresolved - presenilin-2
          rising in a failing heart is at least as consistent with a response to failure as with a cause
          of it, and the canine result, in which the increase reverses when ventricular function improves,
          reads more naturally as the former.'
        cell_types:
