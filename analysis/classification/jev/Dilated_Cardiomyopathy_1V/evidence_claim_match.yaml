      assertion_type: Treatment
      assertion:
        name: Cardiac Surveillance of At-Risk Relatives
        therapeutic_modality: OTHER
        description: 'Serial cardiac assessment of first-degree relatives of an affected proband. For
          a partially penetrant, late-onset cardiomyopathy this is the intervention with the clearest
          rationale, because it detects dilatation before symptoms - and partial penetrance is exactly
          the setting in which a clinical rather than genotypic trigger matters, since an unaffected carrier
          may remain unaffected.

          Whether surveillance should be triggered by a PSEN2 variant specifically is a weaker question
          than at the sibling PSEN1 locus but still not settled: Limited validity does not support genotype-directed
          surveillance on a PSEN2 result alone. Clinical surveillance of relatives of an affected proband
          stands on the family history regardless of genotype.'
        treatment_term:
          preferred_term: serial cardiac surveillance
          term:
            id: NCIT:C168126
            label: Cardiac Disease Screening
      selected_evidence:
        snippet: The PSEN2 mutation showed partial penetrance, milder disease, and a more favorable prognosis.
        supports: SUPPORT
        directness: INDIRECT
