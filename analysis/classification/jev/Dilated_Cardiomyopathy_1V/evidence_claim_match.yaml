  3a593e70c41e71c7d8c8f8382cc5f71164860b158751a8545a9e17c679338b5c:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1V
          disease_term:
            preferred_term: dilated cardiomyopathy 1V
            term:
              id: MONDO:0013373
              label: dilated cardiomyopathy 1V
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Presenilin-2 knockout mouse (cardiac phenotype)
        species: Mouse
        genotype: Psen2 germline knockout (PS2KO)
        publication: PMID:16204356
        genes:
        - preferred_term: PSEN2
          term:
            id: hgnc:9509
            label: PSEN2
        description: 'Mice lacking presenilin-2, characterised specifically for cardiac phenotype rather
          than for Alzheimer biology. The animals develop normally with no hypertrophy or fibrosis, but
          invasive haemodynamics show increased contractility, and isolated papillary muscle shows larger
          calcium transients and higher peak tension. The study goes on to show that presenilin-2 interacts
          with sorcin and the cardiac ryanodine receptor RyR2 and colocalises with them at the Z-lines.

          This is the only in vivo work directed at the presenilin-2 cardiac question, and it is curated
          here as the molecular anchor for the calcium node while being explicit that its phenotype runs
          opposite to dilated cardiomyopathy.'
        modeled_mechanisms:
        - target: Dysregulated Cardiomyocyte Calcium Handling
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: MOLECULAR
          description: Establishes that presenilin-2 is a real participant in cardiomyocyte calcium handling
            in the intact heart, through a defined interaction with RyR2 and sorcin - the mechanistic
            premise this entry's hypothesis rests on.
          limitations: 'The allele is a germline deletion, while CMD1V is a heterozygous missense variant
            whose functional consequence has never been determined; a knockout therefore cannot be assumed
            to model it. More importantly the direction is wrong: knockout hearts contract better, with
            larger calcium transients and no hypertrophy, fibrosis or dilatation, which is the opposite
            of the phenotype this entity is named for. The model was not built on, or tested against,
            the Ser130Leu allele, and no claim about the human disease mechanism rests on it.'
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The model's quantity is calcium transient amplitude and contractility in a presenilin-2-null
              heart. The node's quantity is disturbed calcium handling caused by a missense allele, which
              need not act by loss of function.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Murine cardiomyocyte calcium handling and heart rate differ substantially from
              human, and no human carrier cardiomyocyte has been studied for comparison.
          readouts:
          - name: Peak amplitude of calcium transients in isolated papillary muscle
            target: Dysregulated Cardiomyocyte Calcium Handling
            direction: INCREASED
            interpretation: The calcium measurement that ties presenilin-2 to cardiomyocyte calcium handling
              in vivo - and the one whose direction is opposite to what a dilated cardiomyopathy mechanism
              would predict.
          - name: Cardiac hypertrophy and fibrosis
            target: Dysregulated Cardiomyocyte Calcium Handling
            direction: UNCHANGED
            interpretation: 'A negative structural result, recorded because it is what makes this model
              a poor analogue of the human entity: losing presenilin-2 does not remodel the mouse heart.'
        - target: Ventricular Remodeling and Chamber Dilatation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: 'The model does not reproduce the structural phenotype the human entity is named
            for: mice lacking presenilin-2 develop no dilatation, no hypertrophy and no fibrosis, and
            their hearts contract better than controls. This is the central model-fidelity problem for
            the locus, recorded structurally rather than left in prose.'
          limitations: A germline knockout is not a Ser130Leu knock-in, so this negative does not rule
            the mechanism out - a heterozygous missense allele could act by gain of function, dominant
            negativity, or a presenilin-2 function the deletion does not isolate. It does establish that
            simple loss of presenilin-2 is insufficient to produce dilated cardiomyopathy in the mouse.
      selected_evidence:
        snippet: Taken together, our results suggest that PS2 plays an important role in cardiac excitation-contraction
          coupling by interacting with RyR2.
        supports: SUPPORT
