        mechanism_confidence: HYPOTHETICAL
        description: 'The proposed effector step: disturbed intracellular calcium regulation in the cardiomyocyte.
          Three observations point at it, and none was made in a cardiomyocyte carrying the CMD1V allele.

          First, cultured skin fibroblasts from PSEN1 and PSEN2 mutation carriers in the founding families
          showed altered calcium signalling. Fibroblasts are an accessible surrogate, not a contractile
          cell, and the paper reports the abnormality without asserting a myocardial equivalent.

          Second, and this is where the PSEN2 story diverges from its PSEN1 sibling, presenilin-2 physically
          associates with the cardiac ryanodine receptor RyR2 and with sorcin, its modulator - shown by
          co-immunoprecipitation in mouse heart and by colocalisation at the Z-lines. Where the PSEN1
          cardiac work implicates the sarcoplasmic-reticulum calcium pump SERCA2a, the PSEN2 work implicates
          the release channel. Both are calcium handling; they are not the same lesion.

          Third, the presenilin sequencing study in sporadic disease concluded that presenilin missense
          mutations may alter the interaction of these proteins with the excitation-contraction coupling
          machinery.

          The node carries no direction. The interaction results are physical associations rather than
          rates, the only in vivo cardiac measurement comes from a knockout mouse and points towards increased
          rather than decreased calcium release, and the human sources say "altered". The biological process
          below is therefore tagged DYSREGULATED: choosing INCREASED or DECREASED would be an invention.'
