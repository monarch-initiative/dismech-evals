      assertion_type: Diagnosis
      assertion:
        name: Multigene Cardiomyopathy Panel Testing
        description: 'Genetic testing is by panel or exome. For PSEN2 the point is interpretation rather
          than efficiency: with the gene-disease relationship classified Limited, a PSEN2 variant found
          in a dilated-cardiomyopathy proband is weak evidence and should not carry the weight of a molecular
          diagnosis on its own. The panel''s specific observation - that both reported variants are too
          common in population reference data for a monogenic effect - applies directly to interpreting
          a new one.

          Limited is nevertheless a positive tier rather than a contested one, so this is a weaker caution
          than the sibling PSEN1 locus warrants. A PSEN2 finding in a proband with a compatible family
          history is worth pursuing; it is not on its own an answer.'
      selected_evidence:
        snippet: both of the reported missense variants have subsequently been found at a frequency higher
          than would be expected for a monogenic, pathogenic effect in population reference data sets
        supports: REFUTE
