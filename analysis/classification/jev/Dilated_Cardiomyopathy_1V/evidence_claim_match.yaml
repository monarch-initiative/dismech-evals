        description: 'The ClinGen Dilated Cardiomyopathy Gene Curation Expert Panel classifies the autosomal
          dominant PSEN2 - dilated cardiomyopathy 1V relationship as Limited. The curation is against
          MONDO:0013373 itself, so it is about this entity rather than about dilated cardiomyopathy in
          general. First evaluated December 2019, re-evaluated under SOP v10 in October 2024 with no change,
          approved by the working group in May 2025, report dated 2026-03-04. Its evidence summary is
          specific about the shape of the evidence: two missense variants in four probands across two
          studies, both variants too common in population reference data, no new human genetic evidence
          since the previous curation, and experimental support resting on two expression studies.

          This is one tier above the Disputed classification the same panel gives PSEN1 for dilated cardiomyopathy
          1U on the same report date - a difference worth preserving, since for PSEN1 the panel found
          no scorable human genetic evidence at all.'
