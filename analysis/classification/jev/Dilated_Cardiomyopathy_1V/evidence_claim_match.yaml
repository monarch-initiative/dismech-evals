        notes: 'Unlike the sibling PSEN1 locus, where the founding paper describes complete penetrance,
          the PSEN2 variant is explicitly reported with partial penetrance: carriers in the two reported
          families were not uniformly affected. No penetrance_percentage is recorded on the inheritance
          block, because a penetrance statement drawn from two small pedigrees with age censoring is a
          family observation rather than a population estimate.'
      selected_evidence:
        snippet: The PSEN2 mutation showed partial penetrance, milder disease, and a more favorable prognosis.
        supports: SUPPORT
