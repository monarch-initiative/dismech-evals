  faf91113f151676b0c380674881874a8e233f7939b7dddd4a661592f87a674e3:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1V
          disease_term:
            preferred_term: dilated cardiomyopathy 1V
            term:
              id: MONDO:0013373
              label: dilated cardiomyopathy 1V
        context: []
      assertion_type: Genetic
      assertion:
        name: PSEN2
        relationship_type: UNKNOWN
        variant_origin: GERMLINE
        gene_term:
          preferred_term: PSEN2
          term:
            id: hgnc:9509
            label: PSEN2
        association: 'PSEN2 encodes presenilin-2, a catalytic subunit of the gamma-secretase intramembrane
          protease and a paralogue of PSEN1. Its relationship with dilated cardiomyopathy was proposed
          in 2006 on the strength of two families carrying Ser130Leu, found in a screen of 315 dilated-cardiomyopathy
          index patients, together with altered calcium signalling in carrier skin fibroblasts. A second
          missense allele, Arg62His, was later reported in two of twenty sporadic idiopathic cases.

          ClinGen''s Dilated Cardiomyopathy Gene Curation Expert Panel first evaluated PSEN2 for dilated
          cardiomyopathy in December 2019, re-evaluated it under SOP10 in October 2024, and the classification
          did not change: **Limited**, re-reported March 2026. The panel counts two missense variants
          in four probands across two studies as the whole human genetic evidence base, records that the
          genetic evidence points decreased over time, and notes that both reported variants have since
          been found too frequently in population reference data for a monogenic pathogenic effect.

          The relationship is typed UNKNOWN rather than CAUSATIVE or DISPUTED, and the choice is deliberate
          in both directions. CAUSATIVE would assert what the panel declines to assert - Limited explicitly
          means the evidence does not establish the relationship. DISPUTED would import the sibling locus''s
          verdict: the enum''s own description binds DISPUTED to ClinGen "Disputed" or "Refuted", and
          PSEN2 is neither. Limited sits between the two, and UNKNOWN - "the relationship between the
          gene and the disease is unclear or not yet classified" - is the closest honest value the enum
          offers. The precise classification is recorded in the external_assertions block and in the evidence
          below, which is where a reader should look rather than relying on this coarse slot.

          The verdict is specific to the cardiac phenotype. PSEN2''s relationship with early-onset familial
          Alzheimer disease is not in question and is a separate matter from this entry.'
        variants:
        - name: PSEN2 p.Ser130Leu
          description: The founding CMD1V allele. A heterozygous missense substitution replacing serine
            with leucine, reported in two dilated-cardiomyopathy families with partial penetrance and
            milder disease than the PSEN1 allele found in the same screen. The original paper describes
            it at the nucleotide level in a historical transcript convention; that description is not
