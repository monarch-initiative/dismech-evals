  a71e78bfd8db57988f45cb949ba9dddb875a66a16aa79c411c8db47aa36b66ba:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1V
          disease_term:
            preferred_term: dilated cardiomyopathy 1V
            term:
              id: MONDO:0013373
              label: dilated cardiomyopathy 1V
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: psen2_calcium_handling_dcm
        hypothesis_label: Presenilin-2 dysfunction causes dilated cardiomyopathy through disturbed cardiomyocyte
          calcium handling
        status: ALTERNATIVE
        description: 'The only mechanistic model proposed for CMD1V: a PSEN2 variant perturbs presenilin-2
          in the cardiomyocyte, which disturbs sarcoplasmic-reticulum calcium handling - plausibly through
          the presenilin-2 association with RyR2 and sorcin - and the resulting excitation-contraction
          defect drives dilatation and pump failure.

          It is recorded as ALTERNATIVE, not CANONICAL, because the disease it explains carries only Limited
          gene-disease validity and because every support falls short of the claim. Carrier calcium signalling
          was measured in skin fibroblasts. The RyR2 and sorcin interaction was demonstrated in mouse
          heart and in a heterologous cell line, not in a carrier. No cardiomyocyte carrying Ser130Leu
          has ever been studied.

          Worse for the model than any of that: the one in vivo cardiac phenotype attributable to losing
          presenilin-2 points the wrong way. Psen2 knockout mice show increased contractility and larger
          calcium transients, with no hypertrophy or fibrosis - not the failing, dilating ventricle this
          entry is named for. That does not refute the hypothesis, since the CMD1V allele is a missense
          variant whose functional consequence is unknown and need not resemble deletion, but it does
          mean the mechanism cannot simply be read off the knockout.

          The model is nevertheless worth keeping, because it is amyloid-independent and stated as such
          in the sources, which distinguishes it from the neuronal presenilin literature and makes it
          falsifiable: an isogenic Ser130Leu human iPSC-cardiomyocyte line with calcium-transient and
          RyR2-flux readouts would settle it in either direction.'
      selected_evidence:
        snippet: DCM may not be related to impaired APP cleavage by gamma secretase, suggesting that PSEN1
          (and PSEN2) could impact heart failure through an amyloid-independent mechanism
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37176125
      reference_title: 'Presenilin-1 (PSEN1) Mutations: Clinical Phenotypes beyond Alzheimer''s Disease.'
      evidence_source: OTHER
      explanation: A review's statement of the amyloid-independent framing this hypothesis adopts, naming
        PSEN2 explicitly, and the reason the neuronal amyloid literature is excluded from the entry.
