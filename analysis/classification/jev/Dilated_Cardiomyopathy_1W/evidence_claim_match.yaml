      assertion_type: AnimalModel
      assertion:
        name: Vinculin Y822F knock-in mouse
        species: Mouse
        genotype: Vcl Y822F homozygous knock-in
        publication: PMID:41231303
        description: A mechanism-probing allele rather than a disease model. Substituting phenylalanine
          for tyrosine at vinculin residue 822 removes a phosphorylation site whose occupancy peaks while
          cardiac adhesions are remodeling and rises again after adult cardiac injury. Homozygous mice
          are viable and develop cardiac dysfunction by 28 weeks, and cultured mutant cardiomyocytes show
          disorganized cell-cell adhesion. Y822F is not a reported human CMD1W allele.
        genes:
        - preferred_term: VCL
          term:
            id: hgnc:12665
            label: VCL
        modeled_mechanisms:
        - target: Impaired Vinculin-Actin Coupling at Cardiomyocyte Adhesion Complexes
          relationship: PERTURBS
          fidelity: LOW
          description: Perturbs vinculin-dependent adhesion coupling through loss of a regulatory phosphosite,
            showing that the coupling is dynamically regulated rather than static.
          limitations: Y822F is an engineered allele that has not been reported in a human patient, and
            the mice are homozygous where human carriers are heterozygous. It bears on how vinculin coupling
            is regulated, not on how a CMD1W variant behaves.
          readouts:
          - name: Cardiomyocyte cell-cell adhesion organization
            target: Impaired Vinculin-Actin Coupling at Cardiomyocyte Adhesion Complexes
            direction: ALTERED
            interpretation: Disorganized cell-cell adhesion in mutant cardiomyocytes is the cellular correlate
              of impaired vinculin coupling.
      selected_evidence:
        snippet: We found that VCL pY822 regulated cardiomyocyte cell-matrix and cell-cell adhesions during
          postnatal heart development.
        supports: SUPPORT
    origin:
