          sequencing panel that includes VCL with copy-number analysis, since one of the reported allele
          classes is a multi-exon duplication. Two interpretive cautions are specific to this gene. Most
          VCL loss-of-function alleles are reported as variants of uncertain significance, so a positive
          result usually cannot be used for predictive cascade testing on its own. And uptake of testing
          is the binding constraint in practice rather than panel content: dilated cardiomyopathy has
          the lowest genetic testing rate of the guideline-indicated cardiovascular diagnoses.'
      selected_evidence:
