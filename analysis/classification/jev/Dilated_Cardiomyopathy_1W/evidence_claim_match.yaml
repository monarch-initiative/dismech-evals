      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: infantile_adhesion_immaturity_recovery
        hypothesis_label: Infantile dependence on vinculin explains early onset and later recovery
        status: EMERGING
        description: 'Proposed explanation for the two features that distinguish the loss-of-function
          phenotype: onset concentrated in infancy, and frequent normalization of ventricular function
          thereafter. If vinculin haploinsufficiency matters most while intercalated disc adhesion is
          still maturing, then the same allele would be more disruptive in infancy and less so once vinculin
          has localized into a mature disc. Supporting evidence that adhesion remodeling is a developmentally
          timed, vinculin-dependent process comes from the mouse; the human claim is an inference from
          a six-patient series and is not established.'
      selected_evidence:
        snippet: It is possible that vinculin haploinsufficiency may be more disruptive in infancy when
          E-cadherin is still immature.
        supports: SUPPORT
        directness: INDIRECT
    origin:
