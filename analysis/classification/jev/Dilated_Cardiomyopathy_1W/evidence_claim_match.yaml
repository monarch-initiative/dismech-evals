      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: metavinculin_altered_actin_crosslinking
        hypothesis_label: Metavinculin tail alleles act by qualitatively altered actin cross-linking
        status: CANONICAL
        description: The founding CMD1W alleles p.Arg975Trp and p.Leu954del lie in the metavinculin-specific
          exon and are not dosage lesions. They change how metavinculin cross-links actin filaments, which
          is a qualitative change in the behaviour of a protein that is still present, and their effect
          is confined to the muscle-specific isoform. This is the model under which force transmission
          at the thin filament-intercalated disc interface is disrupted without vinculin being lost.
      selected_evidence:
        snippet: significantly altered metavinculin-mediated cross-linking of actin filaments in an in
          vitro assay
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
