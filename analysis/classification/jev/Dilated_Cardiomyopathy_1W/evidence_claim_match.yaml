        description: The second contribution the loss-of-function class appears to need. In the aggregated
          families this took the form of co-occurring rare variants in other cardiomyopathy genes (MYH7,
          DSP, TPM1, LAMA4, SCN5A, MYBPC3); one segregation study found that only relatives heterozygous
          for both the VCL allele and a TPM1 missense variant were affected. A non-genetic stressor such
          as viral myocarditis is proposed as an alternative route but has not been measured in VCL carriers.
          The node is recorded as HYPOTHETICAL because no specific second hit has been established, only
          the requirement for one.
