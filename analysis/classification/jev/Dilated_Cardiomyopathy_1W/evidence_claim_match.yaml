        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reverse Remodeling with Recovered Ejection Fraction
        biological_scale: ORGANISM
        role: consequence
        mechanism_confidence: HYPOTHETICAL
        description: 'Normalization of left ventricular systolic function after an infantile presentation
          with severe dysfunction. This is the feature that most distinguishes CMD1W from the other numbered
          dilated cardiomyopathies and it is why the entity has been proposed as a genetic basis for heart
          failure with recovered ejection fraction. Two cautions are curated with it: recovery is not
          resolution, since guideline authors are explicit that improved ejection fraction does not mean
          the cardiomyopathic process has resolved and that therapy should continue; and one patient in
          the series relapsed after medications were withdrawn. The mechanism is unknown, with the developmental
