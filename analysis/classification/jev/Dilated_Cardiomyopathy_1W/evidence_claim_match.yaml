          disc to the lateral cell border make conduction heterogeneous. In the cardiomyocyte knockout
          mouse this produced defective myocardial conduction on optical mapping and ventricular tachycardia
          on conscious telemetry, and it did so while contractile function was still preserved. The human
          counterpart is the conduction and arrhythmia phenotypes seen in a minority of VCL loss-of-function
          probands; direct human connexin 43 data are not available.
        cell_types:
