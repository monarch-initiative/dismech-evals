  cdb7e6838780858be2273ccecd22bbebbed897378844bbac13e2b40eaeb03507:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1W
          disease_term:
            preferred_term: dilated cardiomyopathy 1W
            term:
              id: MONDO:0012667
              label: dilated cardiomyopathy 1W
        context: []
      assertion_type: Treatment
      assertion:
        name: Implantable Cardioverter-Defibrillator
        description: 'Primary-prevention defibrillator implantation for the expressed heart failure phenotype.
          The indication in CMD1W is the ordinary HFrEF one, resting on ejection fraction, symptoms and
          response to optimal medical therapy, and the genotype does not lower the threshold. Only a small
          number of cardiomyopathy genes carry a genotype-specific device recommendation, LMNA being the
          worked example, and VCL is not among them. That is the clinically load-bearing negative in this
          entry: the murine phenotype is arrhythmia-first and lethal, the human phenotype is heart-failure-first
          and frequently recoverable, and the mouse severity is recorded as a human-model mismatch rather
          than translated into a device indication.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: implantable cardioverter-defibrillator placement
          term:
            id: NCIT:C80435
            label: Implantable Cardioverter-Defibrillator Placement
      selected_evidence:
        snippet: Hence, LMNA cardiomyopathy constitutes one of the few genotype-specific evidenced-based
          guideline recommendations in the cardiomyopathies.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/1
