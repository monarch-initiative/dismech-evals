              label: dilated cardiomyopathy 1W
        context: []
      assertion_type: Treatment
      assertion:
        name: Heart Failure Pharmacotherapy
        description: 'Guideline-directed therapy for heart failure with reduced ejection fraction, applied
          to the expressed phenotype. There is no VCL-directed treatment. Contemporary HFrEF guidance
          rests on four pillars: renin-angiotensin system inhibition (an ACE inhibitor, an ARB, or an
          angiotensin receptor-neprilysin inhibitor), beta-blockade, a mineralocorticoid receptor antagonist,
          and an SGLT2 inhibitor, with a loop diuretic added for congestion. What the genotype-defined
          series documents is narrower. Every infant in it received an ACE inhibitor and a beta-blocker,
          and five of six recovered ventricular function; the series was uncontrolled, so it establishes
          what was given, not that the drugs caused the recovery. The MRA, SGLT2 inhibitor and ARNI agents
          curated below are quoted from adult HFrEF guidance and record the standard of care the expressed
          phenotype is managed under; they are not therapy documented in that infant cohort. Guideline
          authors are explicit that improved ejection fraction does not license stopping therapy, and
          the one patient in the series who was weaned off medication relapsed and needed it restarted.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ACE inhibitor
            term:
              id: NCIT:C247
              label: ACE Inhibitor
          - preferred_term: beta-adrenergic antagonist
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
          - preferred_term: angiotensin receptor-neprilysin inhibitor
            term:
              id: NCIT:C190796
              label: Angiotensin Receptor-Neprilysin Inhibitor
          - preferred_term: mineralocorticoid receptor antagonist
            term:
              id: NCIT:C101255
              label: Aldosterone Receptor Antagonist
          - preferred_term: SGLT2 inhibitor
            term:
              id: NCIT:C98083
              label: SGLT2 Inhibitor
          - preferred_term: loop diuretic
            term:
              id: NCIT:C49184
              label: Loop Diuretic
      selected_evidence:
        snippet: The four pillars of HF management (RAAS inhibition, beta-blockade, MRA, and SGLT2i) should
          be initiated in all patients with HFrEF as tolerated.
        supports: SUPPORT
