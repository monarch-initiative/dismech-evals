      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: vcl_plof_reduced_penetrance_risk_allele
        hypothesis_label: VCL loss-of-function alleles act as moderate-penetrance risk alleles requiring
          a second contribution
        status: CANONICAL
        description: Predicted loss-of-function alleles affect both the vinculin and the metavinculin
          transcripts and are strongly enriched in dilated cardiomyopathy referrals, but they are frequently
          inherited from unaffected parents and co-occur with variants in other cardiomyopathy genes.
          The best-supported reading is that they raise risk rather than determine disease, and that expression
          requires an additional genetic or environmental contribution. This is why the historical Mendelian
          label CMD1W should not be read as asserting that every heterozygous VCL variant is causal.
      selected_evidence:
        snippet: Overall, the data are most consistent with VCL pLOF variants acting as genetic modifiers
          that can lead to more severe disease or the precipitation of disease in the presence of additional
          risk factors, such as other genetic and/or environmental contributions.
        supports: SUPPORT
