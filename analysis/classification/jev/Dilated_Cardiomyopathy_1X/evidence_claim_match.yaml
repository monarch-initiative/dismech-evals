      assertion_type: Environmental
      assertion:
        name: Haemodynamic load of pregnancy
        description: 'Pregnancy is a documented precipitant of decompensation in established CMD1X. It
          is not causal, and the entry does not treat it as such: the reported course is a fall in cardiac
          function from the third trimester, requiring bed rest and elective early delivery, with the
          cardiac parameters returning to their pre-pregnancy baseline about a month postpartum. The skeletal
          muscle behaved differently in the same patient, with weakness that persisted afterwards, so
          the two compartments did not recover in step.'
      selected_evidence:
        snippet: The parameters of her cardiac function returned to the pre-pregnancy status in a month
          after delivery, whereas she realized persistent worsening of muscular weakness at postpartum.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26566449
      reference_title: A case of pregnancy complicated with dilated cardiomyopathy 1X.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the cardiac decompensation is reversible once the load is removed,
        while the skeletal muscle change was not, which is why this is recorded as an exacerbating exposure
        rather than a cause.
