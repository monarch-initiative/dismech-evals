        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Weakened Sarcolemma-to-Basement-Membrane Linkage in Cardiomyocytes
        biological_scale: CELLULAR
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: The dystrophin-glycoprotein complex normally transmits force between the cardiomyocyte
          cytoskeleton and the basement membrane. With alpha-dystroglycan unable to bind laminin, that
          linkage is weakened and the sarcolemma is less able to withstand the mechanical load of repeated
          contraction. Mouse data make the important qualification that this membrane-fragility route
          is not on its own sufficient to produce contractile failure.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Although cardiac Fktn elimination markedly reduced α-dystroglycan glycosylation and dystrophin-glycoprotein
          complex proteins in sarcolemma at all developmental stages, cardiac dysfunction was observed
          only in later adulthood, suggesting that membrane fragility is not the sole etiology of cardiac
          dysfunction.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31848331
      reference_title: Elimination of fukutin reveals cellular and molecular pathomechanisms in muscular
        dystrophy-associated heart failure.
      evidence_source: MODEL_ORGANISM
      explanation: Supports the loss of sarcolemmal dystrophin-glycoprotein complex at the cardiomyocyte
        membrane, and simultaneously constrains how much of the phenotype that loss can explain. Graded
        INDIRECT because it is a complete cardiac knockout rather than the hypomorphic human genotype.
