  cdc5e45074c8becd1a22eff0d072bf4173f9fe03a91b4ba3b3ea29eba678da46:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1X
          disease_term:
            preferred_term: dilated cardiomyopathy 1X
            term:
              id: MONDO:0012704
              label: dilated cardiomyopathy 1X
        context: []
      assertion_type: Genetic
      assertion:
        name: FKTN
        notes: 'FKTN, at 9q31.2, encodes fukutin, a 461-amino-acid Golgi ribitol-phosphate transferase.
          The allelic architecture is the explanation for why CMD1X exists as an entity distinct from
          Fukuyama congenital muscular dystrophy rather than being a mild case of it, and it is worth
          stating explicitly.

          The Japanese founder allele is a roughly 3 kb retrotransposal insertion of tandemly repeated
          sequence in the FKTN 3'' untranslated region, carried by 87 per cent of FCMD chromosomes, and
          it abolishes expression in patients who carry it. Two null alleles of this kind give Fukuyama
          congenital muscular dystrophy. CMD1X patients are compound heterozygotes who carry one severe
          allele in trans with a milder allele that retains partial enzyme function. Missense alleles
          reported in the cardiac-predominant phenotype include p.Ser299Arg and p.Asn442Ser. Deep-intronic
          alleles acting through aberrant splicing are also described in this gene.

          That one-severe-plus-one-hypomorphic model is what the entry''s functional_impact_category of
          PARTIAL_LOSS_OF_FUNCTION asserts at the level of the enzyme, and it is the reason the phenotype
          stops at the myocardium instead of extending to brain and skeletal muscle.'
        gene_term:
          preferred_term: FKTN
          term:
            id: hgnc:3622
            label: FKTN
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: The inserted sequence is about 3 kilobases long and is located in the 3' untranslated
          region of a gene encoding a new 461-amino-acid protein. This gene is expressed in various tissues
          in normal individuals, but not in FCMD patients who carry the insertion.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
