      assertion_type: Pathophysiology
      assertion:
        name: Impaired Compensatory Hypertrophic Signaling
        biological_scale: CELLULAR
        description: Fukutin-deficient cardiomyocytes fail to mount the adaptive hypertrophic response
          that normally offsets haemodynamic load. In the mouse, adrenergic and pressure-overload stress
          that produces compensated hypertrophy in controls instead produces chamber dilation, fibrosis
          and contractile failure, with loss of the expected Akt phosphorylation and a disrupted MEF2-histone
          deacetylase axis. This is the branch that best explains why the human disease is stress-sensitive
          and variable in onset rather than uniformly congenital.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: During young adulthood, Fktn-deficient mice were vulnerable to pathological hypertrophic
          stress with downregulation of Akt and the MEF2-histone deacetylase axis.
        supports: SUPPORT
        directness: INDIRECT
    origin:
