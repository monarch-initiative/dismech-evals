            term:
              id: MONDO:0012704
              label: dilated cardiomyopathy 1X
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Fukutin Ribitol-Phosphate Transferase Activity
        biological_scale: MOLECULAR
        description: Biallelic hypomorphic FKTN variants reduce, without abolishing, the Golgi ribitol-phosphate
          transferase activity of fukutin. Fukutin and fukutin-related protein act sequentially to transfer
          ribitol phosphate from CDP-ribitol, which is synthesised by ISPD, onto the core M3 O-mannosyl
          glycan of alpha-dystroglycan. The residual activity in this allele combination is what separates
          CMD1X from the null genotypes that cause Fukuyama congenital muscular dystrophy.
        genetic_context:
          gene:
            preferred_term: FKTN
            term:
              id: hgnc:3622
              label: FKTN
          zygosity: COMPOUND_HETEROZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
        biological_processes:
        - preferred_term: protein O-linked mannosylation
          term:
            id: GO:0035269
            label: protein O-linked glycosylation via mannose
          modifier: DECREASED
      selected_evidence:
        snippet: we demonstrate that isoprenoid synthase domain-containing protein (ISPD) synthesizes
          CDP-ribitol, present in muscle, and that both recombinant fukutin (FKTN) and fukutin-related
          protein (FKRP) can transfer a ribitol phosphate group from CDP-ribitol to α-dystroglycan
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27194101
      reference_title: ISPD produces CDP-ribitol used by FKTN and FKRP to transfer ribitol phosphate onto
        alpha-dystroglycan.
      evidence_source: IN_VITRO
      explanation: Establishes the enzymatic activity of fukutin that this node describes as reduced,
        using recombinant protein and cell assays.
