              label: dilated cardiomyopathy 1X
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Relative Sparing of Skeletal Muscle and Brain
        biological_scale: TISSUE
        description: The defining feature of CMD1X is what does not happen. The same hypoglycosylation
          of alpha-dystroglycan that destroys skeletal muscle and brain in Fukuyama congenital muscular
          dystrophy leaves these patients with normal intelligence and no or minimal limb girdle weakness,
          and with skeletal muscle biopsies showing only minimal dystrophic change. The residual fukutin
          activity of the hypomorphic allele combination is the usual explanation, but it does not by
          itself say why the myocardium is the tissue that cannot tolerate the shortfall. This tissue-selectivity
          is recorded as an open question rather than resolved.
      selected_evidence:
        snippet: FKTN mutations could cause much wider spectrum of clinical features than previously perceived,
          including familial dilated cardiomyopathy and mildest limb girdle muscular dystrophy.
        supports: SUPPORT
