      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Troponin C Variant and Thin-Filament Regulatory Defect
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        description: 'TNNC1 encodes cardiac troponin C, an 18-kDa four-EF-hand protein and the calcium
          sensor of the cardiac thin filament. Its structural C-domain carries two high-affinity sites
          permanently occupied by Ca2+ or Mg2+ and anchors cTnC to the rest of the troponin complex; its
          regulatory N-domain carries a single low-affinity site that is largely empty at diastolic Ca2+
          and, on binding Ca2+, opens to capture the troponin I switch region and release troponin I''s
          inhibitory segments from actin. Disease-associated missense variants are scattered across both
          domains — G159D and E135A in the C-terminal structural region, Y5H and G34R in or near the N-terminal
          regulatory region, M103I, D132N, D145E and I148V elsewhere — and none abolishes the protein.
          Instead they retune this switch: altering troponin I and troponin T binding, reducing alpha-helical
          content, and changing the equilibrium between the "active" and "dormant" orientations of the
          regulatory domain. Because the same gene also produces hypertrophic and restrictive phenotypes,
          the direction of the functional perturbation, not its presence, determines the clinical phenotype.'
        genes:
        - preferred_term: TNNC1
          term:
            id: hgnc:11943
            label: TNNC1
        molecular_functions:
        - preferred_term: calcium ion binding
          term:
            id: GO:0005509
            label: calcium ion binding
          modifier: ABNORMAL
        - preferred_term: troponin T binding
          term:
            id: GO:0031014
            label: troponin T binding
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
