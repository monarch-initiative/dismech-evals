        description: 'Most DCM-associated thin-filament variants shift the force-pCa relationship rightward,
          so more Ca2+ is required for the same force and the sarcomere is hypocontractile at physiological
          systolic Ca2+. Among TNNC1 variants this is documented for Y5H and M103I (decreased Ca2+ sensitivity
          of force development in skinned fibres), for D132N in the compound-heterozygous sibling pair,
          and for E135A in reconstituted human cardiac muscle. The shift is small in absolute terms —
          of the order of 0.1 pCa units for E135A — but it is applied to every beat over a lifetime. Because
          troponin is also the major Ca2+ buffer of the myocyte cytosol, an altered thin-filament Ca2+
          affinity feeds back onto the Ca2+ transient itself and hence onto Ca2+-sensitive remodeling
          signaling. The direction is not universal: D145E sensitizes, and in explanted G159D myocardium
          Ca2+ sensitivity was higher than donor tissue, which is why this node is curated under a hypothesis
          group rather than as settled fact.'
