              label: dilated cardiomyopathy 1Z
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tnnc1_d73n_mouse_model_mismatch
        prompt: Does the D73N knock-in mouse, whose substitution is explicitly not known to cause human
          disease, faithfully model the pathophysiology of human TNNC1 dilated cardiomyopathy?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Myofilament Calcium Sensitivity
        - pathophysiology#Adverse Ventricular Remodeling
        rationale: 'The only in vivo model of cTnC-driven dilated cardiomyopathy carries D73N, a substitution
          the authors engineered to reduce Ca2+ sensitivity and which they state is not known to be associated
          with heart disease in human patients. It demonstrates sufficiency — desensitizing the cTnC regulatory
          domain alone produces DCM in a mouse — but it cannot demonstrate necessity or fidelity for the
          human alleles. The mismatch is not merely formal: the best-studied human allele, G159D, sits
          in the structural C-domain rather than the regulatory N-domain, and in patient myocardium it
          raised rather than lowered Ca2+ sensitivity, so the mouse models the mechanism the human variant
          does not exhibit. No G159D or E135A knock-in mouse has been reported. Claims about CMD1Z pathophysiology
          sourced from this model are marked MODEL_ORGANISM in this entry and should be read as support
          for the desensitization hypothesis group, not as genotype-matched evidence.'
        proposed_experiments:
        - experiment_id: tnnc1_genotype_matched_knockin_mouse
          name: Genotype-matched TNNC1 knock-in mouse
          description: Generate a G159D or E135A knock-in mouse and test whether it reproduces the dilated
            phenotype and, specifically, the loss of beta-adrenergic myofilament responsiveness observed
            in human tissue.
          decision_criterion: Reproduction of the dilated phenotype together with a blunted myofilament
            PKA response would validate the mouse route for the human alleles; a normal or hypertrophic
            phenotype would confine the D73N result to the engineered allele.
        - experiment_id: tnnc1_patient_ipsc_cardiomyocytes_isogenic
          name: Patient-derived TNNC1 iPSC-cardiomyocytes with isogenic controls
          description: Derive induced pluripotent stem cell cardiomyocytes from TNNC1 variant carriers,
            with isogenic CRISPR-corrected controls, to obtain a human in vitro system that retains native
            post-translational modification and can be assayed for contractility, calcium handling, and
            beta-adrenergic response.
          decision_criterion: Concordance between iPSC-cardiomyocyte and explanted-myocardium measurements
            would establish the iPSC system as the human-relevant assay in place of the mouse.
      selected_evidence:
        snippet: we generated knock-in mice carrying a D73N mutation (not known to be associated with
          heart disease in human patients) in cTnC
        supports: SUPPORT
    origin:
