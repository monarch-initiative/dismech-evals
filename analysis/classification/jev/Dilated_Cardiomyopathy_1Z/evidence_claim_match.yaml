      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnnc1_activation_kinetics_model
        hypothesis_label: Slowed activation-kinetics model
        status: EMERGING
        description: A third, kinetic account proposes that the primary defect of at least some TNNC1
          variants lies in the rate at which the thin filament switches on rather than in the steady-state
          force-pCa relationship. G159D troponin incorporated into skinned fibres left Ca2+ sensitivity
          and cooperativity unchanged but halved the activation rate, which in an intact beating ventricle
          would truncate systolic force development within the available ejection time. A related kinetic
          reading comes from in silico modeling of the E135A variant, where a slowed Ca2+ off-rate and
          slowed myosin detachment predict increased ventricular stiffness alongside reduced ejection
          fraction. The model is EMERGING because the kinetic parameters have been measured in reconstituted
          and computational systems rather than in beating human myocardium.
      selected_evidence:
        snippet: Gly159Asp TnC had no significant effect on either the Ca(2+) sensitivity or cooperativity
          of force generation when compared to wild type. However, the mutation caused a highly significant
          (ca. 50%) decrease in the rate of activation.
        supports: SUPPORT
    origin:
