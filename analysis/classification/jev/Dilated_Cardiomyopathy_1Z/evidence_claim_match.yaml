                label: TNNC1
            features: 'TNNC1 is a small gene encoding a 161-residue protein, and reported DCM-associated
              variants are missense changes distributed across both EF-hand domains rather than clustered:
              G34R and Y5H in or near the N-terminal regulatory domain, M103I, D132N, E135A, D145E, I148V
              and G159D in the C-terminal structural region. No truncating or copy-number mechanism is
              established. The gene is pleiotropic — some substitutions (A8V, C84Y, E134D, and D145E in
              some cohorts) produce hypertrophic or restrictive rather than dilated disease, and ClinGen
              classifies both the TNNC1-DCM and the TNNC1-hypertrophic relationships as Definitive — so
              the phenotype cannot be predicted from the gene alone. Interpretation is further complicated
              by the scarcity of segregation data: most reported TNNC1 variants are de novo, so ClinGen-grade
              case-level evidence rests on a small number of informative pedigrees. ACMG has added TNNC1
              to its secondary-findings reporting list.'
          role: ancestor
