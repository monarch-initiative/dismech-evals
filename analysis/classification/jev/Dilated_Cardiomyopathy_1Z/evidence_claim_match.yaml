      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnnc1_phosphorylation_uncoupling_model
        hypothesis_label: Troponin-phosphorylation uncoupling model
        status: ALTERNATIVE
        description: A competing model, derived principally from explanted human myocardium rather than
          reconstituted systems, holds that the pathogenic lesion is not the absolute level of myofilament
          Ca2+ sensitivity but the loss of its regulation. Normally, PKA phosphorylation of troponin I
          at Ser23/24 during beta-adrenergic stimulation desensitizes the myofilament to Ca2+, accelerating
          relaxation and supplying inotropic and lusitropic reserve; dephosphorylation reverses this.
          In myocardium from a G159D carrier the mutant troponin abolished that phosphorylation-dependent
          shift, and the same abolition is seen for the E135A pedigree variant in reconstituted human
          cardiac muscle and for M103I in skinned fibres. Under this model the ventricle fails because
          it cannot respond to sympathetic drive, not because its resting Ca2+ sensitivity is low — indeed
          in the G159D explanted heart Ca2+ sensitivity was higher than donor myocardium, the opposite
          of the canonical prediction.
      selected_evidence:
        snippet: We conclude that this DCM mutant significantly blunts the contractile response to phosphorylation
          and this novel mechanism may contribute to its pathogenic effect.
        supports: SUPPORT
    origin:
