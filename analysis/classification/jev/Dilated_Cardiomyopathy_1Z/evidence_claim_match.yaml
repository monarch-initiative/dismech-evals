      assertion_type: Treatment
      assertion:
        name: Guideline-Directed Heart Failure Pharmacotherapy
        description: 'Standard heart-failure therapy for left ventricular systolic dysfunction — the four
          contemporary HFrEF pillars: an angiotensin receptor-neprilysin inhibitor (or an ACE inhibitor
          / angiotensin receptor blocker where ARNI is not tolerated), a beta-blocker, a mineralocorticoid
          receptor antagonist, and an SGLT2 inhibitor — targeting the neurohormonal amplifier of adverse
          remodeling. There is no TNNC1-specific disease-modifying therapy, so management is the generic
          DCM regimen. Note the mechanistic tension worth recording for this genotype: several TNNC1 variants
          abolish the myofilament response to PKA-mediated (beta-adrenergic) phosphorylation, so the myofilament
          substrate that beta-blockade normally protects is already unresponsive; whether this alters
          the benefit of beta-blockade in TNNC1 carriers has not been studied.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
