  2e79fd95f6a084b6b34cf638ea8ce5624696ceb7425c8b8f896e345cd49ac583:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1Z
          disease_term:
            preferred_term: dilated cardiomyopathy 1Z
            term:
              id: MONDO:0012745
              label: dilated cardiomyopathy 1Z
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tnnc1_mechanism_direction_conflict
        prompt: Does the founding CMD1Z variant G159D cause dilated cardiomyopathy by desensitizing the
          myofilament to calcium, as the canonical thin-filament model predicts, or by uncoupling troponin
          phosphorylation from calcium sensitivity — and why do reconstituted systems and native patient
          myocardium give opposite answers?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Myofilament Calcium Sensitivity
        - pathophysiology#Uncoupling of Troponin Phosphorylation from Calcium Sensitivity
        rationale: 'The canonical model, built from reconstituted thin filaments, holds that DCM variants
          lower and hypertrophic variants raise myofilament Ca2+ sensitivity. For G159D this prediction
          fails in the one system closest to the disease: in myocytes from an explanted G159D heart the
          Ca2+ sensitivity was higher than donor myocardium, while in reconstituted fibres it was unchanged
          and the defect was purely kinetic. The authors of the explanted-tissue study attribute the discrepancy
          to native post-translational modification state — reconstituted systems lack the endogenous
          troponin I and troponin T phosphorylation that modulates how a mutation behaves. This matters
          beyond G159D: it implies that variant-classification pipelines built on reconstituted-system
          Ca2+ sensitivity may systematically mispredict the direction of effect, and therefore the phenotype,
          for TNNC1 alleles.'
        proposed_experiments:
        - experiment_id: tnnc1_cross_variant_human_force_pca_panel
          name: Cross-variant force-pCa and PKA panel in one human preparation
          description: Measure the force-pCa relationship and the PKA response for a panel of TNNC1 variants
            side by side in the same cTnC-depleted human donor myocardium system, so that direction-of-effect
            comparisons are not confounded by species or preparation.
          decision_criterion: If desensitizing and sensitizing TNNC1 variants both reproduce their published
            directions in one common human preparation, the discrepancy is genotype-driven; if the directions
            converge, it was preparation-driven.
        - experiment_id: tnnc1_paired_phosphostoichiometry_calcium_sensitivity
          name: Paired phosphorylation-stoichiometry and calcium-sensitivity assay
          description: Assay troponin I Ser23/24 phosphorylation stoichiometry alongside each Ca2+-sensitivity
            measurement, to test directly whether native phosphorylation state accounts for the reconstituted-versus-explanted
            discrepancy.
          decision_criterion: If Ca2+-sensitivity direction tracks measured phosphorylation stoichiometry
            rather than the variant identity, the uncoupling model subsumes the desensitization result.
      selected_evidence:
        snippet: The differences between these data and previous in vitro results show that native phosphorylation
          of troponin I and troponin T and other posttranslational modifications of sarcomeric proteins
          strongly influence the functional effects of a mutation.
