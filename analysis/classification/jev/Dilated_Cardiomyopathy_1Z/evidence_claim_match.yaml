            term:
              id: MONDO:0012745
              label: dilated cardiomyopathy 1Z
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Uncoupling of Troponin Phosphorylation from Calcium Sensitivity
        biological_scale: MOLECULAR
        role: amplifier
        description: 'Beta-adrenergic stimulation drives PKA phosphorylation of troponin I at Ser23/24,
          which desensitizes the myofilament to Ca2+ and speeds relaxation; this is the principal route
          by which sympathetic drive supplies inotropic and lusitropic reserve. Several TNNC1 variants
          sever this link. In troponin extracted from an explanted G159D heart, dephosphorylating troponin
          I no longer produced the large Ca2+-sensitivity shift seen with wild-type troponin; reconstituted
          human cardiac muscle carrying E135A showed no myofilament response to PKA at all; and in skinned
          fibres Y5H and I148V diminished, and M103I abolished, the effect of PKA phosphorylation on Ca2+
          sensitivity. NMR work provides a structural correlate: DCM-associated cTnC substitutions and
          troponin I phosphomimetics both destabilize the "active" orientation of the regulatory domain,
          suggesting mutation and phosphorylation act on the same conformational equilibrium — so a mutation
          that has already shifted it leaves phosphorylation nothing to do. The functional consequence
          is a ventricle with no contractile reserve under sympathetic load.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: calcium ion binding
          term:
            id: GO:0005509
            label: calcium ion binding
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: Adrenergic receptor signaling pathway
          term:
            id: GO:0071875
            label: adrenergic receptor signaling pathway
          modifier: DECREASED
        - preferred_term: Regulation of cardiac muscle contraction
          term:
            id: GO:0055117
            label: regulation of cardiac muscle contraction
          modifier: ABNORMAL
      selected_evidence:
        snippet: In addition, the cTnC G159D mutation blunted the change in Ca(2+) sensitivity when TnI
          was dephosphorylated.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
