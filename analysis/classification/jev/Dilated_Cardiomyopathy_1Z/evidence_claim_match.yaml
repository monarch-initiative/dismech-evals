      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnnc1_calcium_desensitization_model
        hypothesis_label: Thin-filament calcium-desensitization model
        status: CANONICAL
        description: The canonical model of thin-filament cardiomyopathy holds that DCM-causing troponin
          and tropomyosin variants lower the Ca2+ sensitivity of the myofilament while hypertrophic variants
          raise it, so that at any given systolic Ca2+ transient the mutant sarcomere generates less force.
          Applied to TNNC1, a variant that destabilizes the regulatory N-domain, accelerates Ca2+ dissociation,
          or perturbs the cTnC structure reduces the fraction of thin filament switched on per beat, producing
          a hypocontractile ventricle that dilates. This model is directly supported for the TNNC1 variants
          Y5H and M103I, for the compound-heterozygous D132N allele, for the E135A pedigree variant, and
          by a knock-in mouse in which engineered Ca2+ desensitization of the cTnC N-domain alone was
          sufficient to cause early-onset DCM.
      selected_evidence:
        snippet: In vitro functional assays show that, in general, the presence of dilated cardiomyopathy
          mutations decreases the Ca(2+) sensitivity of contractility, whereas HCM mutations increase
          it.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17932326
      reference_title: Dilated and hypertrophic cardiomyopathy mutations in troponin and alpha-tropomyosin
        have opposing effects on the calcium affinity of cardiac thin filaments.
      evidence_source: IN_VITRO
      explanation: States the canonical opposing-Ca2+-sensitivity paradigm that this hypothesis group
        encodes, and the study then confirms it at the level of thin-filament Ca2+ affinity.
