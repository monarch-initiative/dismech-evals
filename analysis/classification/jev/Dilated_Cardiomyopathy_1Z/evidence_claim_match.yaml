          term:
            id: UBERON:0002349
            label: myocardium
        biological_processes:
        - preferred_term: Regulation of cardiac muscle contraction
          term:
            id: GO:0055117
            label: regulation of cardiac muscle contraction
          modifier: ABNORMAL
      selected_evidence:
        snippet: These results suggest that each mutation alters the function/ability of the myofilament
          to bind Ca(2+) as a result of modifications in cTnC structure.
        supports: SUPPORT
