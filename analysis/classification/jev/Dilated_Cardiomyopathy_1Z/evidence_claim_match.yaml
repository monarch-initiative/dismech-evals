      assertion_type: Discussion
      assertion:
        discussion_id: tnnc1_calcium_sensitizer_therapeutic_direction
        prompt: Should therapy for TNNC1 dilated cardiomyopathy aim to restore myofilament calcium sensitivity,
          and if so, how should the direction of correction be chosen for a given variant?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Myofilament Calcium Sensitivity
        - pathophysiology#Uncoupling of Troponin Phosphorylation from Calcium Sensitivity
        rationale: 'Troponin C is an unusually attractive drug target because it is the Ca2+ sensor itself,
          and engineered TnC constructs have been shown to correct abnormal thin-filament Ca2+ sensitivity
          in both directions, restoring actomyosin ATPase activity and force generation in skinned trabeculae.
          But no such agent exists for patients, and the direction of correction is genotype-dependent
          in a way that is not currently predictable: TNNC1 variants desensitize (Y5H, M103I, D132N, E135A),
          sensitize (D145E, and G159D in native myocardium), or leave steady-state sensitivity unchanged
          while slowing activation (G159D in reconstituted fibres). A variant-agnostic calcium sensitizer
          could therefore help one CMD1Z patient and harm another. The gap is twofold: no myofilament-directed
          therapy has reached TNNC1 patients, and no validated assay exists for assigning an individual
          variant to a correction direction.'
        proposed_experiments:
        - experiment_id: tnnc1_standardized_human_variant_triage_assay
          name: Standardized human variant-triage assay for TNNC1
          description: Build a standardized human cTnC-depleted myocardium assay that reports both steady-state
            Ca2+ sensitivity and PKA responsiveness for any candidate TNNC1 variant, and validate it against
            variants with known clinical phenotypes.
          decision_criterion: The assay is usable for triage if its two readouts separate variants with
            known dilated from known hypertrophic clinical phenotypes.
        - experiment_id: tnnc1_direction_specific_pharmacology_panel
          name: Direction-specific pharmacology across a TNNC1 variant panel
          description: Test whether calcium sensitizers and myofilament-directed agents produce genotype-dependent,
            direction-specific effects across a panel of desensitizing and sensitizing TNNC1 variants
            in the same preparation.
          decision_criterion: If a sensitizer corrects desensitizing variants but worsens sensitizing
            ones, myofilament therapy in TNNC1 disease must be genotype-gated rather than applied to CMD1Z
            as a class.
      selected_evidence:
        snippet: Rationally engineered TnC constructs corrected the abnormal Ca(2+) sensitivities of the
          thin filament, reconstituted actomyosin ATPase activity, and force generation in skinned trabeculae.
        supports: SUPPORT
    origin:
