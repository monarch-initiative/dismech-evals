  f81b9fd90baf2dff1f426ffb9cf95157d72ae77b6f9f3ddbb8245fc7cea0b783:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 1Z
          disease_term:
            preferred_term: dilated cardiomyopathy 1Z
            term:
              id: MONDO:0012745
              label: dilated cardiomyopathy 1Z
        context: []
      assertion_type: Genetic
      assertion:
        name: TNNC1 Pathogenic Variants
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: TNNC1
          term:
            id: hgnc:11943
            label: TNNC1
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        features: 'TNNC1 is a small gene encoding a 161-residue protein, and reported DCM-associated variants
          are missense changes distributed across both EF-hand domains rather than clustered: G34R and
          Y5H in or near the N-terminal regulatory domain, M103I, D132N, E135A, D145E, I148V and G159D
          in the C-terminal structural region. No truncating or copy-number mechanism is established.
          The gene is pleiotropic — some substitutions (A8V, C84Y, E134D, and D145E in some cohorts) produce
          hypertrophic or restrictive rather than dilated disease, and ClinGen classifies both the TNNC1-DCM
          and the TNNC1-hypertrophic relationships as Definitive — so the phenotype cannot be predicted
          from the gene alone. Interpretation is further complicated by the scarcity of segregation data:
          most reported TNNC1 variants are de novo, so ClinGen-grade case-level evidence rests on a small
          number of informative pedigrees. ACMG has added TNNC1 to its secondary-findings reporting list.'
        variants:
        - name: TNNC1 Gly159Asp
          description: c.476G>A, p.Gly159Asp. The founding CMD1Z variant, identified in a large kindred
            with 100% penetrance and severe disease, and by far the most functionally studied TNNC1 allele
            — characterized in skinned fibres, in reconstituted thin filaments, by NMR, and in explanted
            patient myocardium. Its functional signature is a blunted response to troponin phosphorylation
            and a halved activation rate rather than the canonical Ca2+ desensitization.
          gene:
            preferred_term: TNNC1
            term:
              id: hgnc:11943
              label: TNNC1
        - name: TNNC1 Glu135Ala
          description: c.404A>C, p.Glu135Ala. A variant in the G helix just before the fourth EF hand,
            at a residue 99% conserved across 230 vertebrate species; segregates with autosomal dominant
            DCM plus diastolic dysfunction and ventricular arrhythmia across a multigenerational family,
            and abolishes the myofilament response to PKA phosphorylation in reconstituted human cardiac
            muscle.
          gene:
            preferred_term: TNNC1
            term:
              id: hgnc:11943
              label: TNNC1
        - name: TNNC1 Tyr5His, Met103Ile, Asp145Glu and Ile148Val
          description: Four rare variants identified in DCM probands and characterized together. Y5H and
            M103I decreased the Ca2+ sensitivity of force development; Y5H and I148V diminished, and M103I
            abolished, the effect of PKA phosphorylation; all except I148V reduced alpha-helical content
            by circular dichroism. D145E has also been reported in hypertrophic cardiomyopathy, and in
            its original DCM proband co-occurred with an MYBPC3 variant, so its assignment to the dilated
            phenotype is not secure.
          gene:
            preferred_term: TNNC1
            term:
              id: hgnc:11943
              label: TNNC1
        - name: TNNC1 Asp132Asn (compound heterozygous with Asp145Glu)
          description: p.Asp132Asn, inherited in trans with p.Asp145Glu in two siblings with severe early-onset
            DCM — a rare compound-heterozygous rather than classic dominant genotype. In reconstituted
            cardiac muscle preparations D132N decreased and D145E increased Ca2+ sensitivity, and the
            two together mirrored wild type, so the biallelic mechanism is not a simple sum of the single-allele
            effects.
          gene:
            preferred_term: TNNC1
            term:
              id: hgnc:11943
              label: TNNC1
        - name: TNNC1 Gly34Arg
          description: c.100G>C, p.Gly34Arg. A de novo variant recurring in three siblings — one infant
            death and two stillbirths — implicating parental germline mosaicism. Marks the lethal perinatal
            extreme of the TNNC1 phenotype.
          gene:
            preferred_term: TNNC1
            term:
              id: hgnc:11943
              label: TNNC1
      selected_evidence:
        snippet: Twelve genes (23%) from 8 gene ontologies were classified as having definitive (BAG3,
          DES, FLNC, LMNA, MYH7, PLN, RBM20, SCN5A, TNNC1, TNNT2, TTN) or strong (DSP) evidence.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33947203
      reference_title: Evidence-Based Assessment of Genes in Dilated Cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: The ClinGen DCM gene curation places TNNC1 in the definitive-evidence tier, independently
        of the later gene-validity assertion.
