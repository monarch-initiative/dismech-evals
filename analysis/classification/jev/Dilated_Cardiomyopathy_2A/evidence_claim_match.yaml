              id: MONDO:0012746
              label: dilated cardiomyopathy 2A
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Perinatal Troponin I Isoform Switch and Loss of ssTnI Compensation
        biological_scale: CELLULAR
        role: intermediate
        description: 'The heart expresses two troponin I isoforms under developmental control: the slow
          skeletal isoform (ssTnI, TNNI1) in fetal and early postnatal myocardium, replaced by cardiac
          troponin I (cTnI, TNNI3) as the heart matures. In a cTnI-null heart, ssTnI initially occupies
          the troponin complex and supports normal development, normal birth weight, and normal cardiac
          structure at birth. Critically, ssTnI downregulation proceeds on its own developmental schedule
          and is not held back by the absence of cTnI, so the myocardium passes from ssTnI-supported regulation
          to no troponin I at all. This node explains the entity''s most distinctive clinical feature
          — a well child who decompensates abruptly in the neonatal period or first months — and is why
          CMD2A is a disease of infancy rather than of adulthood like most sarcomeric cardiomyopathy.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Regulation of striated muscle contraction
          term:
            id: GO:0006942
            label: regulation of striated muscle contraction
          modifier: ABSENT
      selected_evidence:
        snippet: The results show that (1) developmental downregulation of slow skeletal troponin I occurs
          even in the absence of cardiac troponin I and (2) the resultant troponin I depletion alters
          specific mechanical properties of myocardium and can lead to a lethal form of acute heart failure.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
