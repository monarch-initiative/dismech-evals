      assertion_type: Treatment
      assertion:
        name: Mechanical Circulatory Support (ECMO and Ventricular Assist Device)
        description: The bridge between failing medical therapy and transplantation. When an infant with
          CMD2A decompensates into low-output failure or cardiogenic shock, veno-arterial extracorporeal
          membrane oxygenation provides emergency rescue and a ventricular assist device provides durable
          support until a donor organ is available. This step sits between guideline-directed pharmacotherapy
          and heart transplantation in the care pathway, and matters disproportionately in this entity
          because the disease presents in infancy with severe, refractory systolic failure and because
          transplantation is the only definitive option.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: mechanical circulatory support as a bridge to transplantation
          term:
            id: NCIT:C80452
            label: Ventricular Assist Device Placement
        notes: No CMD2A-specific mechanical-support series exists. The evidence below is from pediatric
          dilated cardiomyopathy as a class and is marked PARTIAL accordingly. The Sorrentino 2023 CMD2A
          patients are reported to have required ECMO and ventricular assistance before transplantation,
          but that detail is in the paper's full text and is absent from the cached abstract, so it is
          deliberately not quoted here.
      selected_evidence:
        snippet: A 12-year-old girl with recurrent cardiac arrests underwent emergency LVAD implantation
          (EXCOR® Active) for 6 h for bridging to HTx.
        supports: SUPPORT
