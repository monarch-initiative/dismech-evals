    evidence_metadata:
      reference: PMID:41918167
      reference_title: A homozygous variant in cardiac troponin I3, TNNI3, causes severe pediatric restrictive
        cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: States the proposed positional rule as a suggestion drawn from a single patient — the
        open question this discussion records.
