        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnni3_residual_function_phenotype_model
        hypothesis_label: Residual-cTnI-dose model of dilated versus restrictive phenotype
        status: EMERGING
        description: An emerging refinement proposes that within the recessive TNNI3 allelic series it
          is the amount of residual cTnI function, not simply the presence of biallelic truncation, that
          determines whether the child develops dilated or restrictive cardiomyopathy. Complete absence
          of cTnI produces the systolic, dilated phenotype of CMD2A; a more distal nonsense allele that
          leaves a partially functional (though reduced-abundance) protein has been reported to produce
          severe pediatric restrictive cardiomyopathy instead. If correct, the recessive TNNI3 phenotype
          is a graded function of residual protein rather than a binary null state, and the CMD2A/RCM
          boundary is set by truncation position.
      selected_evidence:
        snippet: In myocardial biopsies of the patient, TNNI3 protein abundance was diminished, suggesting
          that residual TNNI3 function may underlie RCM, while TNNI3 absence causes DCM.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
