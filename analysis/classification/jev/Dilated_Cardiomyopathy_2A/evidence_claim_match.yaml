          TNNI3 genotype as a rare cause of neonatal-onset DCM rather than assigning it a population frequency.
          In the ClinGen curation of 51 DCM genes, TNNI3 sat in the moderate-evidence tier for DCM overall
          in 2021 and was subsequently upgraded to Strong for both the dominant and the recessive relationship.'
