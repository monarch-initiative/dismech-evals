  e4fecb10076a89e468e4b0ffbc93e34db987b7d17c1ee2fd76a0f87afddadffb:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 2A
          disease_term:
            preferred_term: dilated cardiomyopathy 2A
            term:
              id: MONDO:0012746
              label: dilated cardiomyopathy 2A
        context: []
      assertion_type: Genetic
      assertion:
        name: TNNI3 Biallelic Loss-of-Function Variants
        association: Biallelic Loss-of-Function Variants
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: TNNI3
          term:
            id: hgnc:11947
            label: TNNI3
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        features: 'CMD2A genotypes are biallelic and loss-of-function. Most reported alleles are protein-truncating
          (nonsense or frameshift), and the same alleles recur across unrelated families — p.Arg69Alafs*8
          in particular. Non-truncating routes to the null state also exist: a synonymous exon 2 variant
          (c.24G>A, p.Ala8Ala) that creates a cryptic splice donor and causes intron 2 retention was found
          in trans with a whole-gene deletion. Alleles reported in the homozygous state in affected children
          have also been seen in heterozygous unaffected carriers, consistent with a recessive mechanism
          and with the low penetrance of the heterozygous state. The recessive loss-of-function series
          is mechanistically separate from the heterozygous TNNI3 missense variants that cause dominant
          hypertrophic (CMH7) and restrictive (RCM1) cardiomyopathy, so a TNNI3 variant list cannot be
          interpreted without its zygosity and variant class.'
        variants:
        - name: TNNI3 p.Arg69Alafs*8 (c.204delG)
          description: Recurrent frameshift allele. Reported homozygous in a consanguineous Tunisian family
            with three infants who died at about one year of age, and independently in the review series
            of biallelic TNNI3 loss-of-function patients. Classified pathogenic by ACMG criteria.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
        - name: TNNI3 p.Arg98*
          description: Nonsense allele reported in the homozygous state in a patient with early-onset
            dilated cardiomyopathy, having previously been documented only in heterozygous patients and
            apparently healthy carriers — direct evidence that the heterozygous state is not equivalent
            to the biallelic one.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
        - name: TNNI3 c.24G>A (p.Ala8Ala)
          description: Synonymous exon 2 variant that nonetheless abolishes function by creating a cryptic
            intron 2 splice donor, producing intron retention; found in trans with a deletion of the entire
            gene in a Chinese infant with severe dilated cardiomyopathy. Demonstrated by minigene splicing
            assay.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
        - name: TNNI3 p.Arg136* (c.406C>T)
          description: More distal nonsense allele reported homozygous in a 2-year-old with severe pediatric
            restrictive rather than dilated cardiomyopathy, with diminished but detectable TNNI3 protein
            in myocardial biopsy. Included here as the boundary case of the recessive series that motivates
            the residual-function model.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
      selected_evidence:
        snippet: TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AR | Strong
        supports: SUPPORT
