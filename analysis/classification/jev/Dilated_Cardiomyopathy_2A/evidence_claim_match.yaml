              label: dilated cardiomyopathy 2A
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd2a_sstni_compensation_human_fidelity
        prompt: Does the murine slow-skeletal-troponin-I compensation-then-withdrawal mechanism, which
          supplies the timing explanation for CMD2A, actually operate on the same schedule in the human
          heart?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Perinatal Troponin I Isoform Switch and Loss of ssTnI Compensation
        rationale: 'The isoform-switch explanation for why a cTnI-null child is well at birth and fails
          weeks later rests almost entirely on the Tnni3-null mouse, where the schedule is sharp and well
          characterized (ssTnI decline from day 15, death on day 18). The human TnI isoform switch is
          known to occur perinatally, but no direct measurement of ssTnI persistence in the myocardium
          of a CMD2A patient has been reported, and the human presentation window is broader — neonatal
          in some reports, later in the first year in others. Whether that variability reflects individual
          differences in the timing of ssTnI withdrawal, residual cTnI from hypomorphic alleles, or unrelated
          modifiers is unresolved. This is a model-fidelity question, not an absence of evidence: the
          mouse result is strong, its human transferability is the open item.'
        proposed_experiments:
        - experiment_id: exp_cmd2a_human_myocardial_sstni_timing
          name: Myocardial ssTnI/cTnI abundance across CMD2A patient ages
          description: Measure ssTnI and cTnI protein abundance in myocardial tissue obtained at transplantation
            or autopsy from CMD2A patients of differing ages, to test whether clinical decompensation
            coincides with ssTnI withdrawal.
        - experiment_id: exp_cmd2a_ipsc_tni_isoform_schedule
          name: TnI isoform schedule in TNNI3-null human iPSC-cardiomyocytes
          description: Track TnI isoform composition during maturation of TNNI3-null iPSC-cardiomyocytes
            or engineered heart tissue against isogenic controls, to establish the human schedule in a
            controlled system.
      selected_evidence:
        snippet: Compensation was only temporary, however, as 15 days after birth slow skeletal troponin
          I expression began a steady decline, giving rise to a troponin I deficiency.
        supports: SUPPORT
