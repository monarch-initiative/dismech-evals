        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Thin-Filament Regulatory Failure and Impaired Myofilament Mechanics
        biological_scale: CELLULAR
        role: amplifier
        description: 'Without any troponin I, the thin filament loses the inhibitory element that normally
          keeps tropomyosin over the myosin-binding sites at low calcium and that transduces calcium binding
          at troponin C into cooperative filament activation. The measured consequence in troponin I-depleted
          ventricular myocytes is a combined systolic and diastolic defect: sarcomeres are shortened and
          resting tension is elevated under relaxing conditions, while myofilament calcium sensitivity
          is reduced under activating conditions. Contraction is therefore both incompletely switched
          off between beats and inefficiently switched on during systole, degrading net pump performance.
          In the recessive human allelic series the severity of this regulatory failure appears to track
          residual cTnI abundance.'
        cell_types:
        - preferred_term: Cardiac ventricular myocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Cardiac muscle contraction
          term:
            id: GO:0060048
            label: cardiac muscle contraction
          modifier: DECREASED
        - preferred_term: Regulation of cardiac muscle cell contraction
          term:
            id: GO:0086004
            label: regulation of cardiac muscle cell contraction
          modifier: ABNORMAL
      selected_evidence:
        snippet: Ventricular myocytes isolated from these troponin I-depleted hearts displayed shortened
          sarcomeres and elevated resting tension measured under relaxing conditions and had a reduced
          myofilament Ca sensitivity under activating conditions.
        supports: SUPPORT
