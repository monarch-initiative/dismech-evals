      assertion_type: Discussion
      assertion:
        discussion_id: cmd2a_mondo_node_versus_clingen_lumped_dcm
        prompt: Should CMD2A be curated as its own dismech entity, given that ClinGen curates the TNNI3
          relationship against the generic "dilated cardiomyopathy" entity (MONDO:0005021) and splits
          it only by mode of inheritance, while MONDO maintains a distinct CMD2A node (MONDO:0012746)?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Biallelic TNNI3 Loss of Function
        rationale: 'ClinGen''s Dilated Cardiomyopathy GCEP issued two separate TNNI3-DCM assertions on
          the same day, differing only in mode of inheritance (AD Strong, AR Strong), both against MONDO:0005021
          — it treats the recessive relationship as a distinct curatable claim but not as a distinct disease
          entity. MONDO instead assigns CMD2A its own node with its own OMIM anchor. dismech follows MONDO
          here, and the substantive justification is mechanistic rather than nomenclatural: the recessive
          entity has a different molecular lesion (complete loss of function versus dominant-negative/altered-function
          missense), a different age of onset governed by a developmental isoform switch, and a different
          natural history. If ClinGen or MONDO later converges on a single lumped TNNI3-cardiomyopathy
          entity, this entry should be revisited rather than duplicated against its dominant siblings.'
      selected_evidence:
        snippet: TNNI3 | HGNC:11947 | dilated cardiomyopathy | MONDO:0005021 | AR | Strong
        supports: SUPPORT
