      assertion_type: Discussion
      assertion:
        discussion_id: cmd2a_truncation_position_phenotype_boundary
        prompt: Does truncation position within TNNI3 determine whether a biallelic loss-of-function genotype
          produces dilated or restrictive cardiomyopathy, and if so where is the boundary?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Thin-Filament Regulatory Failure and Impaired Myofilament Mechanics
        rationale: The recessive TNNI3 series is currently modeled as producing dilated cardiomyopathy,
          but a homozygous distal nonsense allele (p.Arg136*) with diminished-but-detectable myocardial
          protein has been reported to produce restrictive cardiomyopathy instead. That single observation
          implies a graded residual-function relationship rather than a binary null state, but it is one
          patient, the protein-abundance measurement is semiquantitative, and no systematic genotype-to-phenotype
          series across truncation positions exists. Until it does, dismech should not assert a positional
          rule.
        proposed_experiments:
        - experiment_id: exp_cmd2a_truncation_position_genotype_series
          name: Multi-center biallelic TNNI3 truncation-position genotype-phenotype series
          description: Assemble a multi-center series of biallelic TNNI3 loss-of-function patients annotated
            by truncation position, cardiomyopathy subtype, and age of onset, to test whether phenotype
            tracks predicted residual protein length.
        - experiment_id: exp_cmd2a_residual_ctni_quantification
          name: Quantification of residual cTnI across recessive truncating alleles
          description: Quantify cTnI protein abundance and thin-filament incorporation in myocardial tissue
            or patient-derived iPSC-cardiomyocytes across the reported truncating alleles, to establish
            whether residual function is measurable rather than inferred.
      selected_evidence:
        snippet: Overall, recessive TNNI3 protein truncation causes severe pediatric RCM, suggesting that
          the allelic status, type of genetic alteration, and length of TNNI3 protein truncation determine
          cardiomyopathy onset and subtype manifestation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
