      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnni3_null_isoform_switch_model
        hypothesis_label: cTnI-null / perinatal TnI isoform-switch model
        status: CANONICAL
        description: The canonical model holds that biallelic TNNI3 loss-of-function abolishes cardiac
          troponin I, and that the resulting disease is timed by the developmental troponin I isoform
          switch. In fetal and neonatal myocardium the slow skeletal isoform (ssTnI, TNNI1) occupies the
          troponin complex and substitutes functionally for cTnI, so a cTnI-null heart develops and is
          born structurally normal. ssTnI is then downregulated on its own developmental schedule regardless
          of whether cTnI is available to replace it, and the heart is left globally troponin I-deficient.
          Thin-filament regulation fails — sarcomeres shorten, resting (diastolic) tension rises, and
          myofilament calcium sensitivity under activating conditions falls — giving an abrupt, severe,
          and frequently lethal heart failure in the neonatal period or first months of life. The Tnni3-null
          mouse reproduces exactly this time course.
      selected_evidence:
        snippet: Mice lacking cardiac troponin I were born healthy, with normal heart and body weight,
          because a fetal troponin I isoform (identical to slow skeletal troponin I) compensated for the
          absence of cardiac troponin I. Compensation was only temporary, however, as 15 days after birth
          slow skeletal troponin I expression began a steady decline, giving rise to a troponin I deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9915769
      reference_title: 'Cardiac troponin I gene knockout: a mouse model of myocardial troponin I deficiency.'
      evidence_source: MODEL_ORGANISM
      explanation: 'Directly demonstrates the isoform-switch timing that is the core of this model: normal
        birth under ssTnI cover, then decompensation when ssTnI is withdrawn.'
