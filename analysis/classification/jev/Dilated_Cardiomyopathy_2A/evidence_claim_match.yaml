              in particular. Non-truncating routes to the null state also exist: a synonymous exon 2 variant
              (c.24G>A, p.Ala8Ala) that creates a cryptic splice donor and causes intron 2 retention was
              found in trans with a whole-gene deletion. Alleles reported in the homozygous state in affected
              children have also been seen in heterozygous unaffected carriers, consistent with a recessive
              mechanism and with the low penetrance of the heterozygous state. The recessive loss-of-function
              series is mechanistically separate from the heterozygous TNNI3 missense variants that cause
              dominant hypertrophic (CMH7) and restrictive (RCM1) cardiomyopathy, so a TNNI3 variant list
              cannot be interpreted without its zygosity and variant class.'
