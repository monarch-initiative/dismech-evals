      assertion:
        name: Dilated cardiomyopathy 1FF (dominant TNNI3 disease)
        description: The same gene and the same organ-level phenotype, separated by zygosity. CMD1FF arises
          from a single heterozygous TNNI3 allele — classically a missense variant that puts an altered
          cardiac troponin I into the thin filament and lowers maximum ATPase and calcium sensitivity
          — so a wild-type allele is always retained and the myocardium is never troponin I-free. Onset
          is variable and incompletely penetrant rather than obligate and neonatal, and the recurrence
          risk is 50% per offspring rather than 25% per sibship. A heterozygous TNNI3 variant in a child
          with a dilated ventricle should be evaluated as CMD1FF, not reported as CMD2A.
      selected_evidence:
        snippet: These are the first reported autosomal dominant DCM-causing mutations in TNNI3, and so
          the findings expand the spectrum of disease-causing genes that lead to either hypertrophic cardiomyopathy
          or DCM depending on the specific mutation.
        supports: SUPPORT
