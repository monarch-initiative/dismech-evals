      assertion_type: Pathophysiology
      assertion:
        name: Biallelic TNNI3 Loss of Function
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        description: TNNI3 encodes cardiac troponin I, the inhibitory subunit of the troponin complex
          and one of the three regulatory proteins (with troponin C and troponin T) that confer calcium
          sensitivity on the sarcomeric thin filament. CMD2A arises when both TNNI3 alleles are inactivated
          — most often by nonsense or frameshift variants (p.Arg69Alafs*8, p.Arg98*), but also by a synonymous
          variant creating a cryptic splice site with intron retention in trans with a whole-gene deletion.
          The lesion is a true loss of function rather than the dominant-negative or altered-function
          mechanism that characterizes the heterozygous TNNI3 missense variants responsible for hypertrophic
          and restrictive cardiomyopathy, which is why the disease is recessive and heterozygous carriers
          are largely spared.
        genes:
