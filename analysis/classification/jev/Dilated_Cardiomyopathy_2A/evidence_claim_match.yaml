      assertion_type: ProgressionInfo
      assertion:
        phase: Prenatal and neonatal latency
        notes: A cTnI-null fetus develops normally and is born with normal heart and body weight, because
          slow skeletal troponin I occupies the troponin complex in place of the missing cardiac isoform.
          This is a true latent phase, not merely a presymptomatic one — the substituting protein is genuinely
          doing the regulatory job. It is also why prenatal imaging is not expected to identify affected
          pregnancies, and why families at 25% recurrence risk are counselled toward molecular prenatal
          diagnosis rather than fetal echocardiography.
      selected_evidence:
        snippet: Mice lacking cardiac troponin I were born healthy, with normal heart and body weight,
          because a fetal troponin I isoform (identical to slow skeletal troponin I) compensated for the
          absence of cardiac troponin I.
        supports: SUPPORT
