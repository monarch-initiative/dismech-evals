        hypothesis_label: Loss of phospho-Ser102/14-3-3 binding alters GATAD1 nucleocytoplasmic distribution
        status: EMERGING
        description: Ser102, the residue the variant replaces, is a phosphorylation site whose phosphorylated
          form binds 14-3-3 proteins, possibly masking a nuclear localization signal. Losing it could
          explain the disturbed GATAD1 distribution seen in the proband's myocardium. The binding is shown
          only with peptides and recombinant protein, and in HEK293 cells the tagged S102P protein still
          reached the nucleus.
      selected_evidence:
        snippet: Follow-up experiments reveal the structural basis of this interaction and suggest that
          14-3-3 binding affects GATAD1 nucleocytoplasmic transport by masking a nuclear localisation
          signal.
