        features: 'One allele reported: homozygous c.304T>C p.(Ser102Pro) in exon 2, in a consanguineous
          Norwegian-ancestry family. It was absent from HapMap, 1000 Genomes, 474 ancestry-matched controls
          and 273 unrelated dilated cardiomyopathy probands. Thirteen heterozygous relatives, examined
          up to their eighties, had no myocardial disease.'
        notes: ClinGen Limited means the gene-disease relationship rests on too little genetic evidence
          to be used confidently in clinical interpretation. The gene is recorded as causative here because
          this entry is defined by the GATAD1-linked family, not because causation is settled.
      selected_evidence:
        snippet: The mutation, absent in HapMap, 1000 Genomes, and 474 ethnically matched controls, altered
          a conserved residue of GATAD1, encoding GATA zinc finger domain-containing protein 1. Thirteen
          relatives were heterozygous mutation carriers with no evidence of myocardial disease, even at
          advanced ages.
