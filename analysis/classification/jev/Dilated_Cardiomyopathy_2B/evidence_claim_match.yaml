            term:
              id: MONDO:0013848
              label: dilated cardiomyopathy 2B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Homozygous GATAD1 p.Ser102Pro Variant
        description: The only reported CMD2B allele is c.304T>C in exon 2 of GATAD1, replacing serine
          102 with proline. It was the single rare variant shared by the two exome-sequenced sisters inside
          the 7q21 homozygous interval, and it was absent from 1,558 control and proband chromosomes.
          The mutant protein is present in patient myocardium, so the allele does not act by abolishing
          GATAD1 protein. Whether it is a loss-of-function allele or has a mutation-specific effect is
          unresolved; both models are recorded under mechanistic_hypotheses.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: GATAD1
          term:
            id: hgnc:29941
            label: GATAD1
        genetic_context:
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          allele_type: missense
          functional_impact_category: UNKNOWN
          description: NM_021167 c.304T>C p.(Ser102Pro), homozygous in all three affected siblings of
            a consanguineous family.
      selected_evidence:
        snippet: A solitary mutation in GATAD1 remained, for which the three affected siblings were homozygous
          and which mapped to the 7q21 critical region.
        supports: SUPPORT
    origin:
