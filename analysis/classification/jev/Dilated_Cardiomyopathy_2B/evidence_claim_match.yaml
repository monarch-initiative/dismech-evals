      assertion:
        discussion_id: gatad1_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does homozygous GATAD1 S102P cause dilated cardiomyopathy, and in which
          cell type does it act?
        attaches_to:
        - pathophysiology#Homozygous GATAD1 p.Ser102Pro Variant
        - pathophysiology#Perturbed GATAD1-Associated Chromatin Regulation
        - pathophysiology#Loss of Phospho-Ser102-Dependent 14-3-3 Binding
        rationale: 'Every step between the variant and the ventricle is unmeasured in human heart. The
          chromatin hypothesis is an inference from GATAD1''s interaction partners, which the variant
          does not disrupt in HEK293 cells; the 14-3-3 hypothesis rests on peptide binding and a crystal
          structure; and the abnormal GATAD1 distribution and globular nuclei come from one biopsy. The
          source papers name the experiments that would resolve it: an S102P knock-in and human iPSC-derived
          cardiomyocytes carrying the variant.'
        proposed_experiments:
        - experiment_id: gatad1_s102p_ipsc_cardiomyocytes
          name: Human iPSC-derived cardiomyocytes carrying GATAD1 S102P
          description: Compare homozygous S102P, knockout and isogenic control iPSC-derived cardiomyocytes
            for GATAD1 localization, nuclear shape, 14-3-3 binding, chromatin occupancy, transcriptome
            and contractility.
          would_support:
          - mechanistic_hypotheses#gatad1_s102p_mutation_specific
      selected_evidence:
        snippet: Utilizing human iPSC-derived cardiomyocytes with GATAD1 knockout or mutation could be
          an excellent approach to assess the function of human GATAD1 in cardiomyocyte differentiation.
        supports: SUPPORT
