          would_refute:
          - mechanistic_hypotheses#gatad1_loss_of_function
      selected_evidence:
        snippet: it is important to recognize that the function of GATAD1 in humans and mice may not be
          directly comparable. There could be unknown genetic modifiers necessary to manifest a cardiomyopathy
          phenotype.
