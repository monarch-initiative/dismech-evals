        status: EMERGING
        description: The mutant protein is present in patient heart, the patient nuclear and localization
          abnormalities are absent from the Gatad1 cardiomyocyte knockout mouse, and that mouse has no
          cardiomyopathy. These observations favour an effect specific to the S102P protein over simple
          deficiency. Heterozygous carriers are unaffected, so any such effect would have to be dose-dependent.
          The authors of the mouse study propose testing it in an S102P knock-in.
      selected_evidence:
        snippet: While the recessive mutation is often considered a loss-of-function mutation, it remains
          possible that the S102P mutation could be a gain-of-function mutation with dose-dependent effects
          that impair cellular functions.
