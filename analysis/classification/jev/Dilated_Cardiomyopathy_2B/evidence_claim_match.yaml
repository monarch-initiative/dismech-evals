      assertion:
        hypothesis_group_id: gatad1_loss_of_function
        hypothesis_label: S102P is a recessive loss-of-function allele
        status: EMERGING
        description: Recessive inheritance with healthy heterozygotes is the usual signature of loss of
          function, and gatad1 knockout zebrafish develop heart failure-like phenotypes when stressed.
          Against it, the mutant protein is present in patient myocardium, and deleting Gatad1 in mouse
          cardiomyocytes causes no cardiomyopathy up to 18 months or after pressure overload. The mouse
          result does not exclude a requirement for GATAD1 in other cardiac cell types or in cardiomyocyte
          progenitors before the Cre driver acts. A separate myocardium-specific Gatad1 knockout fared
          worse after ischemia-reperfusion, with GATAD1 acting as a transcriptional regulator of fatty
          acid and glucose oxidation genes; like the zebrafish result, the requirement shows only under
          an added stress, and ischemic injury is not the disease modelled here.
      selected_evidence:
        snippet: myocardium-specific Gatad1 knockout (Gatad1 CKO) significantly increased the myocardial
          infarct size, impaired cardiac function in I/R mice
        supports: SUPPORT
