              label: dilated cardiomyopathy 2B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Perturbed GATAD1-Associated Chromatin Regulation
        description: Hypothesized node. GATAD1 co-purifies with the EMSY/KDM5A/SIN3B complex (with PHF12
          and RBBP4/7), which binds H3K4me3-marked active promoters, and it was first identified as an
          H3K4me3-associated protein; HDAC1 and HDAC2 are also reported binding partners. The discovery
          paper inferred that GATAD1 S102P causes dilated cardiomyopathy through epigenetic dysregulation,
          by analogy with the dilated cardiomyopathy of combined Hdac1/Hdac2 cardiac knockout mice. No
          study has measured chromatin occupancy or gene expression driven by the S102P protein, and the
          variant does not change GATAD1's complex partners in HEK293 cells.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: GATAD1
          term:
            id: hgnc:29941
            label: GATAD1
        cellular_components:
        - preferred_term: Sin3-type complex (EMSY/KDM5A/SIN3B)
          term:
            id: GO:0070822
            label: Sin3-type complex
        biological_processes:
        - preferred_term: regulation of DNA-templated transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: DYSREGULATED
      selected_evidence:
        snippet: GATAD1 binds to a histone modification site that regulates gene expression. Consistent
          with murine DCM caused by genetic disruption of histone deacetylases, the data implicate an
          inherited basis for epigenetic dysregulation in human heart failure.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21965549
      reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive
