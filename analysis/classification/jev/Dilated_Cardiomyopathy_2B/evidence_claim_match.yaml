      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autosomal dominant familial dilated cardiomyopathy
        description: Clinically the GATAD1 family resembled ordinary autosomal dominant or sporadic dilated
          cardiomyopathy; only the consanguinity, the absence of disease in parents and offspring and
          the linkage analysis pointed to recessive inheritance. Exome data excluded homozygous variants
          in known dilated cardiomyopathy genes. LMNA-related disease (CMD1A) is a specific consideration
          because abnormal cardiomyocyte nuclear shape is a hallmark of Lmna-deficient cardiomyopathy.
        disease_term:
          preferred_term: familial isolated dilated cardiomyopathy
          term:
            id: MONDO:0700335
            label: familial isolated dilated cardiomyopathy
      selected_evidence:
        snippet: In fact, the only clues for recessive inheritance were consanguinity, lack of heart failure
          in the ancestors of affected family members by history, and lack of DCM in offspring of affected
          family members by echocardiographic screening.
        supports: SUPPORT
