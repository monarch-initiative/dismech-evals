            term:
              id: MONDO:0014355
              label: cardiomyopathy, dilated, with wooly hair, keratoderma, and tooth agenesis
        context: []
      assertion_type: Subtype
      assertion:
        name: EKC
        display_name: Erythrokeratodermia-cardiomyopathy (EKC) syndrome
        description: Severe congenital or infantile generalized erythrokeratodermia with alopecia, absent
          eyebrows and eyelashes, nail dystrophy, enamel defects, absent secondary teeth and initially
          silent progressive dilated cardiomyopathy, caused by de novo proline substitutions (Q616P, H618P,
          L622P) clustered within seven residues near the end of SR6. The former MONDO term for EKC syndrome
          (MONDO:0018774) is obsolete and merged into MONDO:0014355, so the subtype carries no term of
          its own.
        genes:
        - preferred_term: DSP
          term:
            id: hgnc:3052
            label: DSP
      selected_evidence:
        snippet: We show that de novo missense mutations clustered tightly within a single spectrin repeat
          of DSP cause this novel cardio-cutaneous disorder, which we term erythrokeratodermia-cardiomyopathy
          (EKC) syndrome.
        supports: SUPPORT
