      assertion:
        name: DSP Spectrin Repeat 6 Missense Variant
        description: A single heterozygous missense or in-frame variant alters a conserved residue in
          spectrin repeat 6 of the desmoplakin plakin domain, the N-terminal region that binds plakoglobin
          and the plakophilins. Structural modelling and the recurrent introduction of helix-breaking
          proline residues suggest that the variants destabilize the repeat. Whether the mutant protein
          acts through insufficient recruitment of desmoplakin to desmosomes or through a dominant-negative
          effect on other desmosomal proteins has not been tested.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: DSP
          term:
            id: hgnc:3052
            label: DSP
        genetic_context:
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
        molecular_functions:
        - preferred_term: desmoplakin structural linkage of the desmosomal plaque
          term:
            id: GO:0005200
            label: structural constituent of cytoskeleton
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: desmosome
          term:
            id: GO:0030057
            label: desmosome
      selected_evidence:
        snippet: In each patient we identified a single heterozygous de novo mutation in the desmoplakin
          gene DSP, p.Leu583Pro and p.Thr564Ile, leading to severe combined cardiac/dermatological and
          cardiac/dermatological/dental phenotypes. The DSP missense mutations are localised in the N
          terminal domain of desmoplakin.
        supports: SUPPORT
