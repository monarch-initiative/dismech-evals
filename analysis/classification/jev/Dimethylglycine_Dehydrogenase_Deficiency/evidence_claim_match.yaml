        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DMGDH-linked mitochondrial electron-transfer impairment
        mechanism_confidence: HYPOTHETICAL
        description: DMGDH is an FAD-dependent mitochondrial matrix enzyme whose reduced flavin is normally
          reoxidized by electron-transfer flavoprotein, which transfers reducing equivalents to the main
          respiratory chain through ETF-ubiquinone oxidoreductase. The H109R variant reduces flavin binding
          and catalytic activity, so reduced DMGDH-linked electron transfer is a plausible biochemical
          branch, but direct patient-level respiratory-chain dysfunction has not been demonstrated.
        molecular_functions:
        - preferred_term: electron transfer activity
          term:
            id: GO:0009055
            label: electron transfer activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial matrix
          term:
            id: GO:0005759
            label: mitochondrial matrix
        chemical_entities:
        - preferred_term: FAD
          term:
            id: CHEBI:57692
            label: FAD(3-)
          modifier: DECREASED
      selected_evidence:
        snippet: A comparative study with the H109R variant demonstrated that the variant suffers from
          decreased protein stability, cofactor saturation, and substrate affinity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1111/febs.13828
      reference_title: Structure and biochemical properties of recombinant human dimethylglycine dehydrogenase
        and comparison to the disease-related H109R variant
      evidence_source: IN_VITRO
      explanation: The disease-related variant affects properties needed for this FAD-dependent mitochondrial
