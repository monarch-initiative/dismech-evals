          respiratory chain through ETF-ubiquinone oxidoreductase. The H109R variant reduces flavin binding
          and catalytic activity, so reduced DMGDH-linked electron transfer is a plausible biochemical
          branch, but direct patient-level respiratory-chain dysfunction has not been demonstrated.
