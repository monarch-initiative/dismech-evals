        name: Cutaneous
        display_name: Cutaneous diphtheria
        description: Infection of skin, typically a chronic non-healing ulcer with a rolled or "punched-out"
          edge and a dirty grey membrane, most often on the lower limbs and usually polymicrobial with
          Staphylococcus aureus or Streptococcus pyogenes. It is now the presentation most frequently
          reported in high-income countries, is an important reservoir for transmission, and can still
          produce toxin-mediated systemic disease when the isolate is toxigenic.
        subtype_term:
          preferred_term: cutaneous diphtheria
          term:
            id: MONDO:0001479
            label: cutaneous diphtheria
      selected_evidence:
        snippet: They represent 57-86% of cases in literature and play an important role in the epidemiology
          of the disease
        supports: SUPPORT
