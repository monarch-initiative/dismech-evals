      assertion_type: Subtype
      assertion:
        name: Nasopharyngeal
        display_name: Nasopharyngeal diphtheria
        description: Involvement of the nasopharynx, often contiguous with faucial disease. It is recognized
          separately in treatment guidelines because posterior extension is associated with a larger toxin
          burden, and WHO dosing schedules assign it a higher antitoxin dose than pharyngeal or cutaneous
          disease of comparable duration.
        subtype_term:
          preferred_term: nasopharyngeal diphtheria
          term:
            id: MONDO:0020866
            label: nasopharyngeal diphtheria
      selected_evidence:
        snippet: For example, in WHO current guidelines, cutaneous or pharyngeal/laryngeal cases of two
          days duration require 20,000 eDAT IU; nasopharyngeal diseases less than 48 h duration require
          40,000 IU.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/0
      context_paths:
