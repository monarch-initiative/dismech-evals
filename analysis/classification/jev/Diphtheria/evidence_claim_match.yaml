      explanation: Comparative evidence that vaccination prevents the defining toxin-mediated lesion.
        Graded INDIRECT because the comparison is restricted to Corynebacterium ulcerans cases, so reading
        it as evidence about diphtheria toxoid generally takes an inference step. Separately from directness,
        it is an uncontrolled observational comparison, and the review reporting it states there is no
        randomised trial of vaccine efficacy for that species.
