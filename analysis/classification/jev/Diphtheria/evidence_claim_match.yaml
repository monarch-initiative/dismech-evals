            id: GO:0010106
            label: cellular response to iron ion starvation
      selected_evidence:
        snippet: DtxR is an iron-dependent sequence-specific DNA-binding protein that binds to the tox
          operator, an inverted-repeat nucleotide sequence located upstream from the diphtheria toxin
          gene.
        supports: SUPPORT
