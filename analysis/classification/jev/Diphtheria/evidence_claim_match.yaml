      assertion_type: Pathophysiology
      assertion:
        name: Lysogenic Conversion by a tox-Bearing Corynebacteriophage
        description: The structural gene for diphtheria toxin is not chromosomal in origin. It is carried
          by a beta-corynephage that integrates into the bacterial genome, so that toxigenic and non-toxigenic
          strains of the same species coexist and a non-toxigenic isolate can be converted by phage infection.
          This was the first virulence factor shown to be phage-encoded, and it is why toxigenicity, not
          species identity, determines whether a patient develops toxin-mediated disease.
        biological_scale: MOLECULAR
        role: susceptibility_factor
      selected_evidence:
        snippet: Since the ability to produce the diphtheria toxin is a result of β-corynephages infection,
          for each species toxigenic as well as non-toxigenic strains exist.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31294205
      reference_title: Adhesion properties of toxigenic corynebacteria.
      evidence_source: OTHER
      explanation: Establishes that toxin production is a consequence of phage lysogeny and that both
        toxigenic and non-toxigenic strains therefore exist within each species.
