  5be0206916dcc9cca841db90cccfbb48d62dca2be70b119cd2dbb3db59581b41:
    claim:
      about:
        disease:
          name: Diphtheria
          disease_term:
            preferred_term: diphtheria
            term:
              id: MONDO:0005504
              label: diphtheria
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Guinea pig diphtheria toxin intoxication and lethality model
        species: Guinea pig
        category: Toxin challenge model
        publication: PMID:23940209
        description: Subcutaneous challenge with a calibrated dose of purified diphtheria toxin in Hartley
          guinea pigs, monitored for 30 days for dehydration, hind-limb weakness, lethargy and death.
          It is the accepted in vivo system for diphtheria intoxication and the standardized assay by
          which antitoxin potency is measured in international units. Guinea pigs are used because mice
          and rats are naturally resistant, a difference that traces to the toxin receptor itself.
        modeled_mechanisms:
        - target: Translational Arrest and Host Cell Death
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Parenteral toxin challenge reproduces the systemic toxin-mediated illness and death
            that follow translational arrest in host tissues, and it is sensitive enough to grade antitoxin
            potency quantitatively.
          limitations: This is an intoxication model, not an infection model. Toxin is injected rather
            than elaborated by an adherent organism, so it bypasses mucosal colonization, pseudomembrane
            formation and the local-versus-haematogenous distinction that governs the clinical sequence
            in humans. It therefore speaks to what the toxin does, not to how much toxin a colonized patient
            actually absorbs.
          readouts:
          - name: 30-day survival after calibrated toxin challenge
            target: Translational Arrest and Host Cell Death
            description: Survival and symptom-free status at day 30 after subcutaneous challenge, with
              and without neutralizing antibody.
            direction: RESTORED
            interpretation: Complete protection by a neutralizing antibody establishes that lethality
              in this model is attributable to the toxin acting on this node.
          - name: Symptoms of diphtheria intoxication
            target: Translational Arrest and Host Cell Death
            description: Dehydration, hind-limb weakness and lethargy scored over 30 days of observation.
            direction: INCREASED
            interpretation: Hind-limb weakness in the challenged animal is the model counterpart of the
              toxin-mediated neuropathy seen in patients.
        - target: Diphtheria Toxin Binding to the proHB-EGF Receptor
          relationship: MEASURES
          fidelity: HIGH
          description: Because protection in this model tracks the ability of an antibody to keep toxin
            off its receptor, the assay is a functional readout of the receptor-binding step. The lead
            human monoclonal was shown to act precisely there, blocking toxin binding to HB-EGF.
          limitations: The model reports the net consequence of blocking receptor engagement rather than
            measuring binding directly; the receptor-blockade mechanism was established in a separate
            in vitro assay.
          readouts:
          - name: Blockade of toxin binding to HB-EGF
            target: Diphtheria Toxin Binding to the proHB-EGF Receptor
            description: Antibody-mediated inhibition of diphtheria toxin binding to recombinant human
              HB-EGF, mapped to the toxin receptor-binding domain.
            direction: ABOLISHED
            interpretation: Confirms that neutralization acts at the receptor-binding step modelled by
              this node.
      selected_evidence:
        snippet: The guinea pig is the accepted model system for the study of diphtheria intoxication
          due to its sensitivity to the toxin compared to the highly resistant mouse and rat.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23940209
      reference_title: Identification of a human monoclonal antibody to replace equine diphtheria antitoxin
        for treatment of diphtheria intoxication.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the guinea pig as the accepted in vivo model and names the rodent resistance
        that excludes mice and rats.
