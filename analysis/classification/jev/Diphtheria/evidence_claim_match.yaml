        name: Faucial
        display_name: Faucial (pharyngeal and tonsillar) diphtheria
        description: The classical and most common respiratory presentation, in which the pseudomembrane
          forms over the tonsils and posterior pharynx. It carries the greatest risk of systemic toxin
          absorption and therefore of myocarditis and neuropathy, and extensive cervical oedema produces
          the characteristic "bull neck".
        subtype_term:
          preferred_term: faucial diphtheria
          term:
            id: MONDO:0020860
            label: faucial diphtheria
      selected_evidence:
        snippet: Diphtheria is generally an acute respiratory infection, characterized by the formation
          of a pseudomembrane in the throat, but cutaneous infections are possible.
        supports: SUPPORT
