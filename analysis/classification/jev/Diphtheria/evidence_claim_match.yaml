      assertion_type: Diagnosis
      assertion:
        name: Culture and toxigenicity testing
        description: 'Diagnosis is clinical and is confirmed by isolating a member of the C. diphtheriae
          species complex and then demonstrating toxin production. Species identification alone is insufficient,
          because tox-bearing isolates may still fail to express toxin: in the French Guiana series five
          isolates were tox-positive by PCR yet all were negative by Elek test. Phenotypic toxigenicity
          testing therefore governs whether antitoxin is indicated.'
        measurements:
        - preferred_term: Corynebacterium diphtheriae culture
          term:
            id: LOINC:16676-9
            label: Corynebacterium diphtheriae [Presence] in Specimen by Organism specific culture
        - preferred_term: Corynebacterium ulcerans culture
          term:
            id: LOINC:104373-6
            label: Corynebacterium ulcerans [Presence] in Specimen by Organism specific culture
        - preferred_term: Phenotypic diphtheria toxin production (Elek test)
          term:
            id: LOINC:24102-6
            label: Corynebacterium toxin [Presence] in Specimen by Immune diffusion (ID)
        notes: 'Three measurements for the two steps this row describes. The first two are the isolation
          step, one code per organism the entry names as an agent; LOINC codes the members of the C. diphtheriae
          species complex separately and, in the Monarch KG LOINC set as of 2026-10-17, offers no code
          for the complex itself, nor any Part-level code for the genus. The third is the phenotypic toxigenicity
          step: the Elek test is an immunodiffusion assay for diphtheria toxin, which is how LOINC names
          its method, and it is the test whose disagreement with tox PCR this row turns on. The specimen-level
          codes are used because the row does not restrict the site.'
      selected_evidence:
        snippet: Clinical diagnosis is confirmed by the isolation and identification of the causative
          Corynebacterium spp., usually by bacterial culture followed by enzymatic and toxin detection
          tests.
        supports: SUPPORT
