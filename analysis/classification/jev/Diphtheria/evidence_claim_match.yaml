        description: Extension of the membrane into the larynx and trachea, historically called "membranous
          croup". Hoarseness and stridor progress to airway obstruction, and this is the presentation
          for which tracheotomy or intubation is life-saving.
        subtype_term:
          preferred_term: laryngeal diphtheria
          term:
            id: MONDO:0020863
            label: laryngeal diphtheria
      selected_evidence:
        snippet: The classical clinical manifestation of diphtheria is a pseudomembrane in the upper respiratory
          airways (tonsils, pharynx, or larynx) that can cause possible fatal airway obstruction.
        supports: SUPPORT
