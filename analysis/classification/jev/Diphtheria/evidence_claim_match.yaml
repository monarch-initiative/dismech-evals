          the diphtheria toxin sensitivity determinant, and it associates with the tetraspanin CD9 (DRAP27),
          which increases the number of functional receptors and raises toxin sensitivity by more than
          an order of magnitude. Species differences in this receptor explain why mice and rats are naturally
          resistant to the toxin.
