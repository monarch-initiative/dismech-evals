      assertion_type: Pathophysiology
      assertion:
        name: eEF2 Diphthamide ADP-Ribosylation
        description: The catalytic domain is a NAD+-dependent ADP-ribosyltransferase that transfers ADP-ribose
          onto diphthamide, a modified histidine unique to eukaryotic elongation factor 2. Diphthamide
          normally supports reading-frame fidelity; once ADP-ribosylated, eEF2 can no longer catalyse
          translocation of the peptidyl-tRNA-mRNA complex from the ribosomal A site to the P site. The
          reaction is catalytic rather than stoichiometric, which is why a single translocated catalytic
          domain is enough to kill the cell.
        biological_scale: MOLECULAR
        role: central_effector
        molecular_functions:
        - preferred_term: NAD+-diphthamide ADP-ribosyltransferase activity
          modifier: INCREASED
          term:
            id: GO:0047286
            label: NAD+-diphthamide ADP-ribosyltransferase activity
      selected_evidence:
        snippet: ADP-ribosylation (ADP(R)) of eEF2 by bacterial toxins on a unique diphthamide residue
          inhibits its translocation activity, but the mechanism is unclear.
        supports: SUPPORT
