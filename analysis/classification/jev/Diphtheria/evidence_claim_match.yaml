      assertion_type: Treatment
      assertion:
        name: Diphtheria Antitoxin
        description: Equine hyperimmune serum containing polyclonal antibody against diphtheria toxin.
          It is the only treatment that addresses the toxin itself and it neutralizes only toxin that
          has not yet entered cells, so benefit falls sharply with delay; administration five or more
          days after onset is associated with higher mortality. Adverse reactions to horse protein are
          frequent, and global supply has been constrained for years, which is itself a recognized contributor
          to outbreak mortality.
        treatment_term:
          preferred_term: immunoglobulin therapy
          term:
            id: NCIT:C62710
            label: Immunoglobulin Therapy
        therapeutic_modality: OTHER
        notes: therapeutic_modality is recorded as OTHER because equine polyclonal hyperimmune serum is
          neither a monoclonal antibody nor any other listed platform. A human monoclonal replacement
          (S315) has completed phase I but is not licensed.
      selected_evidence:
        snippet: Equine diphtheria antitoxin (eDAT), the cornerstone of treatment against toxinic complications
          of diphtheria, was invented more than 130 years ago, in 1890, and is still in use today.
        supports: SUPPORT
