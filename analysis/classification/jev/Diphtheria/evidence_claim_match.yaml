      assertion_type: Phenotype
      assertion:
        name: Palatal Palsy
        category: Neurologic
        description: Paralysis of the soft palate and posterior pharyngeal wall, the earliest and most
          characteristic neurological sign, reflecting local toxin action on adjacent nerves. It was the
          sole neurological finding in 53% of children in a diphtheritic polyneuropathy series.
        phenotype_term:
          preferred_term: Palatal palsy
          term:
            id: HP:0001283
            label: Bulbar palsy
        notes: 'HPO has no term for palatal palsy specifically. HP:0001283 (Bulbar palsy) is the most
          specific accurate term available and is what the cited series reports; the narrower localization
          is carried by preferred_term. HP:0000220 (Velopharyngeal insufficiency) was considered and rejected:
          it names a speech-time functional deficit rather than a paralysis, and its manifestation is
          already recorded separately as Hypernasal speech.'
      selected_evidence:
        snippet: All the children presented with bulbar palsy and had h/o membranous tonsillitis. Isolated
          palatal palsy was seen in 7 children (53%). 6 (46.1%) children developed quadriparesis.
        supports: SUPPORT
