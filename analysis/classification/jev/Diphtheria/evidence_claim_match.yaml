    evidence_metadata:
      reference: PMID:39841756
      reference_title: 'Diphtheria antitoxin treatment: from pioneer to neglected.'
      evidence_source: HUMAN_CLINICAL
      explanation: WHO guidance treats nasopharyngeal disease as a distinct anatomical presentation with
