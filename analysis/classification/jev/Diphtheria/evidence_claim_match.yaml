      assertion_type: Biochemical
      assertion:
        name: Serum diphtheria antitoxin titre
        loinc_term:
          id: LOINC:34625-4
          label: Corynebacterium diphtheriae toxin Ab [Units/volume] in Serum
        presence: PRESENT
        context: Population serosurveillance and individual susceptibility assessment
        notes: Measured by toxin neutralization test (TNT), the reference method, or by anti-toxoid ELISA,
          which is cheaper but correlates poorly with TNT at low titres and therefore understates the
          susceptible fraction of a population unless its threshold is recalibrated against TNT. Dried
          blood spots perform well against TNT and are a viable low-cost alternative to serum in low-
          and middle-income settings. The bound code names antibody to the toxin rather than to the organism,
          which is what an antitoxin titre measures, and reports it as a concentration, matching the IU/mL
          cut-offs below; it carries no method qualifier, so it covers both TNT and ELISA.
        reference_ranges:
        - unit: IU/mL
          population: General population, toxin neutralization test
          notes: The source establishes 0.01 and 0.1 IU/mL as the two reference cut-offs used in TNT and
            identifies titres below 0.01 IU/mL as the susceptible fraction. It does not label the 0.01-0.1
            IU/mL interval, so no protective category is asserted for it here.
          interpretation_bands:
          - name: Susceptible
            upper_bound: 0.01
            unit: IU/mL
            abnormal_flag: LOW
            interpretation: Titres below 0.01 IU/mL identify the susceptible fraction of a population.
          - name: Above the lower reference cut-off
            lower_bound: 0.01
            unit: IU/mL
            abnormal_flag: NORMAL
            interpretation: At or above the lower TNT cut-off. The source names 0.1 IU/mL as a second
              reference cut-off without defining a category for it, so no finer band is asserted.
      selected_evidence:
        snippet: The correlation between the ELISA results against diphtheria toxoid and the gold standard
          diphtheria toxin neutralization test (TNT) values is poor when ELISA values are <0.1 IU ml−1,
          which results in inaccurate estimates of susceptibility in populations when ELISA is used for
          measuring antibody levels.
        supports: SUPPORT
    origin:
