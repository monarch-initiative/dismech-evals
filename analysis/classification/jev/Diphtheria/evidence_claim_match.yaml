      assertion_type: Discussion
      assertion:
        discussion_id: human_monoclonal_antitoxin_replacement
        kind: KNOWLEDGE_GAP
        prompt: Can a human monoclonal antitoxin replace equine diphtheria antitoxin, and does earlier
          availability translate into lower mortality?
        attaches_to:
        - treatments#Diphtheria Antitoxin
        - pathophysiology#Systemic Toxin Dissemination
        rationale: Equine antitoxin is a 130-year-old product with frequent hypersensitivity reactions
          and a chronically constrained global supply, and antitoxin shortage is repeatedly identified
          as a contributor to outbreak mortality. A recombinant human replacement would remove both the
          adverse-effect burden and the animal-dependent manufacturing bottleneck. S315 has completed
          phase I in healthy volunteers, but no efficacy trial in patients exists, and because the mechanism
          is time-critical neutralization of extracellular toxin, an efficacy trial has to measure time-to-administration
          as well as the agent itself.
      selected_evidence:
        snippet: The resurgence of diphtheria cases, associated with poor vaccination coverage in multiple
          settings and shortage of existing eDAT products, underlines the urgent need for alternative
          DAT strategies.
        supports: SUPPORT
