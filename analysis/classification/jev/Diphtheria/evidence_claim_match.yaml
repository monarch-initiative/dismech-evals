  dfe8b51b5476e29fa3d0987684f00b8dee97b484b06f2fd98fefb6904ef1d390:
    claim:
      about:
        disease:
          name: Diphtheria
          disease_term:
            preferred_term: diphtheria
            term:
              id: MONDO:0005504
              label: diphtheria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rodent_hbegf_species_barrier
        kind: HUMAN_MODEL_MISMATCH
        prompt: Mice and rats are naturally resistant to diphtheria toxin because their proHB-EGF binds
          it poorly; how far can rodent work be trusted to describe human diphtheria?
        attaches_to:
        - pathophysiology#Diphtheria Toxin Binding to the proHB-EGF Receptor
        rationale: The species barrier sits at the very first step of the toxin cascade. Wild-type rodents
          cannot be intoxicated at physiological doses, so rodent studies either use transgenic animals
          expressing a toxin-sensitive receptor or bypass the receptor entirely, and neither reproduces
          the natural respiratory colonization that precedes intoxication. Guinea pigs are toxin-sensitive
          and remain the potency and neutralization model, but they are intoxication models rather than
          infection models. Claims about tissue tropism and the relative vulnerability of cardiomyocytes
          and Schwann cells therefore rest largely on human autopsy and biopsy material rather than on
          a faithful animal model.
      selected_evidence:
        snippet: Mouse cells are naturally resistant to DT, because they lack functional cell surface
          receptors for the toxin.
        supports: SUPPORT
