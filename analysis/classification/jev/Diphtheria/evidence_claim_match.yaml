      assertion_type: Transmission
      assertion:
        name: Respiratory spread of toxigenic Corynebacterium diphtheriae between people
        description: Classical respiratory diphtheria passes directly from person to person in respiratory
          droplets. Humans are the only reservoir of C. diphtheriae, and asymptomatic carriers sustain
          spread, which is why outbreaks follow crowding and interrupted immunization rather than any
          change in the organism.
      selected_evidence:
        snippet: 'The main mode of transmission of respiratory diphtheria is the respiratory route (droplets):
          the probability of contamination depends on the clinical presentation and carriage.'
        supports: SUPPORT
