      assertion:
        name: Toxin-Mediated Schwann Cell Injury and Demyelination
        description: Diphtheria toxin enters Schwann cells and blocks synthesis of myelin proteolipid
          protein and myelin basic protein, producing segmental demyelination without primary axonal loss.
          Because myelin maintenance depends on ongoing protein synthesis, the Schwann cell is among the
          cell types least able to tolerate a translational block. The clinical consequence is a descending
          neuropathy beginning with palatal and other bulbar weakness, later oculomotor and ciliary paralysis,
          and in severe cases limb weakness, with recovery in most survivors because axons are preserved.
        biological_scale: CELLULAR
        role: consequence
        locations:
        - preferred_term: peripheral nervous system
          term:
            id: UBERON:0000010
            label: peripheral nervous system
        cell_types:
        - preferred_term: myelinating Schwann cell
          term:
            id: CL:0000218
            label: myelinating Schwann cell
        biological_processes:
        - preferred_term: myelination
          modifier: DECREASED
          term:
            id: GO:0042552
            label: myelination
      selected_evidence:
        snippet: All the children presented with bulbar palsy and had h/o membranous tonsillitis. Isolated
          palatal palsy was seen in 7 children (53%). 6 (46.1%) children developed quadriparesis.
        supports: SUPPORT
