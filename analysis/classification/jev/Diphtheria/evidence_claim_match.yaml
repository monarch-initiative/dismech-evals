      assertion:
        name: Diphtheritic Myocarditis
        description: Toxin taken up by cardiomyocytes produces patchy myocyte necrosis with mononuclear
          infiltration, interstitial oedema and fibrosis, typically appearing about two weeks after the
          pharyngeal illness. Ultrastructurally the mitochondria are swollen with disorganized cristae
          and glycogen is depleted, consistent with a cell whose protein synthesis has been arrested.
          Cardiac involvement is the leading cause of death in diphtheria, and it is potentially reversible
          if the patient survives the acute phase.
