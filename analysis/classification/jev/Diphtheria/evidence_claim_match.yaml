      assertion_type: Pathophysiology
      assertion:
        name: Systemic Toxin Dissemination
        description: 'Toxin absorbed from the membrane-covered mucosa enters the bloodstream and reaches
          the heart, peripheral nerves and kidney. The distinction between local spread and haematogenous
          dissemination is clinically load-bearing: early palatal weakness reflects direct local toxin
          action, whereas the generalized demyelinating neuropathy that follows weeks later reflects blood-borne
          delivery. Only free toxin is neutralizable, so antitoxin given after dissemination and cellular
          uptake cannot reverse established injury.'
        biological_scale: ORGANISM
      selected_evidence:
        snippet: The severity of diphtheria is linked to the presence of diphtheria toxin, responsible
          for cardiac and neurological complications after its diffusion away from the infectious site.
        supports: SUPPORT
