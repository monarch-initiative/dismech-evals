          has no Corynebacterium class and no class for a bacterial pathogen acquired by respiratory droplet,
          so the organism and the route are carried by preferred_term. Same general-but-accurate-ancestor
          pattern as the Brucellosis livestock exposure and as the HP:0033151 binding on the pseudomembrane
          phenotype in this entry.'
      selected_evidence:
        snippet: Humans are the only hosts of the organism and is present in the upper respiratory tract.
        supports: SUPPORT
