      assertion:
        target: Iron-Regulated Diphtheria Toxin Expression
        description: 'Killing the organism removes the cells that are transcribing tox, so toxin output
          falls with the bacterial population. This is a different route to the same node than the macrolide
          edge takes: a ribosome inhibitor suppresses synthesis of the toxin protein in cells that are
          still alive, whereas a beta-lactam reduces output only by reducing the number of producers.
          The distinction is why protein-synthesis inhibitors are the preferred agents in toxin-mediated
          disease, and neither route touches toxin that has already been released.'
      selected_evidence:
        snippet: Antimicrobial treatment reduces transmission, but to improve survival, patients with
          toxinic symptoms do need DAT.
