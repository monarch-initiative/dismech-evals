      assertion_type: Pathophysiology
      assertion:
        name: Posttraumatic Developmental Dissociation
        description: DID is represented as a complex posttraumatic developmental disorder in which dissociation
          becomes organized into persistent self-states and clinically important discontinuities in memory
          and self-experience.
        biological_processes:
        - preferred_term: cellular response to stress
          term:
            id: GO:0033554
            label: cellular response to stress
          modifier: ABNORMAL
      selected_evidence:
        snippet: Dissociative identity disorder (DID) is a complex, posttraumatic, developmental disorder
          for which we now, after four decades of research, have an authoritative research base, but a
          number of misconceptualizations and myths about the disorder remain, compromising both patient
          care and research.
        supports: SUPPORT
