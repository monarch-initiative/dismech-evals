  63133f110853cc0cdf1de031748088b86b99c71d675548a8d9319d040fced33b:
    claim:
      about:
        disease:
          name: Distal Arthrogryposis Type 2B1
          disease_term:
            preferred_term: distal arthrogryposis type 2B1
            term:
              id: MONDO:0020820
              label: distal arthrogryposis type 2B1
        context: []
      assertion_type: Genetic
      assertion:
        name: TNNI2
        gene_term:
          preferred_term: TNNI2
          term:
            id: hgnc:11946
            label: TNNI2
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal Dominant
        notes: Fast skeletal troponin I (11p15.5, adjacent to TNNT3). All reported DA variants are missense,
          in-frame deletions or a truncation in the carboxy-terminal region. TNNI2 is the defining gene
          of DA2B1; TNNT3, MYH3, MYH8 and TPM2 cause clinically indistinguishable DA2B in other families.
        variants:
        - name: p.Arg174Gln (R174Q)
          description: Recurrent C-terminal missense variant; in reconstituted thin filaments and troponin-exchanged
            rabbit psoas fibers it increased Ca2+ sensitivity.
        - name: p.Arg156Ter (R156X)
          description: Truncating variant removing the C-terminal tail; in skinned fibers it raised both
            Ca2+ sensitivity and maximum force.
        - name: p.Glu167del (E167del)
          description: In-frame deletion reported in a three-generation family with a phenotype intermediate
            between DA2A and DA1.
        - name: c.523_525delAAG (p.Lys175del)
          description: In-frame deletion cosegregating with DA in a large Chinese family with DA1-like
            and DA2B-like members; the allele modelled in the knock-in mouse.
        - name: p.Lys176del (K176del)
          description: In-frame deletion in a three-generation family classified as DA1 with type 2 fiber
            myopathy.
        - name: c.485G>A (p.Arg162Lys)
          description: Missense variant in a girl with DA2B features and torticollis, inherited from a
            father whose only finding was hip dysplasia. The source prints the cDNA change as "c.485>A".
        - name: c.532T>C (p.Phe178Leu)
          description: Missense variant in a Japanese girl with typical DA2B, inherited from a mosaic,
            unaffected father.
        - name: p.Phe178Cys (F178C)
          description: Missense variant at the same residue reported in a three-generation Chinese family
            classified as DA1.
        - name: c.A493T (p.Ile165Phe)
          description: C-terminal missense variant in a family meeting strict Freeman-Sheldon (DA2A) criteria,
            including an adult mosaic carrier with facial contractures only.
      selected_evidence:
        snippet: Disease-causing mutations in 56/153 (37%) kindreds including 14/48 (29%) with DA1 and
          42/105 (40%) with DA2B were distributed nearly equally across TNNI2, TNNT3, TPM2, and MYH3.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23401156
      reference_title: Spectrum of mutations that cause distal arthrogryposis types 1 and 2B.
