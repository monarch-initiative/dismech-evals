              label: arthrogryposis- oculomotor limitation-electroretinal anomalies syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance with variable expressivity
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        expressivity: VARIABLE
        description: 'DA5 segregates as an autosomal dominant trait in families of up to four generations,
          and de novo variants occur in simplex patients. Severity varies between affected relatives carrying
          the same variant: in one three-generation family with p.Glu2727del, mobility, joint restriction
          and later complications differed between members. Orphanet also lists autosomal recessive inheritance.
          Reports proposing recessive inheritance of distal arthrogryposis type IIB predate PIEZO2 testing,
          and the recessive PIEZO2 disorder is a different, loss-of-function condition.'
      selected_evidence:
        snippet: The gain-of-function heterozygous mutation c.8181_8183delAGA (p.Glu2727del) of PIEZO2
          was identified in the proband, and the same mutation was also found in the mother, confirming
          the autosomal dominant inheritance of the condition.
        supports: SUPPORT
