          in limb mesenchyme, is sufficient for the contractures.
        limitations: The sensitive window was postnatal in the mouse, whereas human contractures are present
          at birth.
        divergences:
        - divergence_type: TEMPORAL_SCOPE
          materiality: QUALIFYING
          description: The critical window identified is postnatal days 7 to 21 in mice; whether it maps
            onto fetal development in humans, where contractures are congenital, is not tested.
