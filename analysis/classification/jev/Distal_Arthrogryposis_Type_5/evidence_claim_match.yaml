  859ab2f82f4e07f8ebbec568c80cd2e2e04414fc5c045b5afebc74b4b7534554:
    claim:
      about:
        disease:
          name: Distal Arthrogryposis Type 5
          disease_term:
            preferred_term: distal arthrogryposis type 5
            term:
              id: MONDO:0007158
              label: arthrogryposis- oculomotor limitation-electroretinal anomalies syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PIEZO2
        gene_term:
          preferred_term: PIEZO2
          term:
            id: hgnc:26270
            label: PIEZO2
        association: Causative (heterozygous, dominant, gain of function)
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: PIEZO2 encodes a large mechanically activated non-selective cation channel. In the 2014
          molecular series PIEZO2 variants were found in 24 of 29 DA5 families, so a minority of clinically
          diagnosed families had no detectable PIEZO2 variant. The same gene causes Gordon syndrome and
          a subset of Marden-Walker syndrome by heterozygous gain of function, and a recessive loss-of-function
          arthrogryposis with impaired proprioception and touch. No ClinGen gene-disease validity record
          for PIEZO2 and DA5 is cached in this repository.
        variants:
        - name: PIEZO2 c.8181_8183delAGA (p.Glu2727del)
          clinical_significance: PATHOGENIC
          description: Recurrent in-frame deletion in the C-terminal region (NM_022068.3). In patch clamp
            it speeds recovery from inactivation and slows inactivation. Reported in a three-generation
            and a four-generation family, and modelled in mice as the equivalent Piezo2 E2799del.
        - name: PIEZO2 p.Ile802Phe
          clinical_significance: PATHOGENIC
          description: Missense variant from the gene-discovery report; in patch clamp it speeds recovery
            of the channel from inactivation.
        - name: PIEZO2 c.4456G>C (p.Ala1486Pro)
          description: Heterozygous missense variant found by exome sequencing in a two-generation family
            with four affected members. Not functionally characterized in the cited source.
        - name: PIEZO2 c.2994G>A (p.Met998Ile)
          description: Recurrent de novo missense variant in exon 20 (NM_022068.3; c.3069G>A, p.Met1023Ile
            on NM_001378183.1), reported in a boy with a lethal respiratory course.
        - name: PIEZO2 c.8068A>C (p.Ser2690Arg)
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          description: Missense variant carried by all affected members of a three-generation Canadian
            family, reported as a variant of unknown clinical significance.
        - name: PIEZO2 p.Arg2718Pro
          description: DA5 missense variant whose C. elegans equivalent, pezo-1(R2405P), behaves as a
            gain-of-function allele in electrophysiology.
      selected_evidence:
        snippet: Using molecular inversion probes for targeted sequencing to screen PIEZO2, we found mutations
          in 24/29 (82%) DA5-affected families and one of two MWS-affected families.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24726473
      reference_title: Mutations in PIEZO2 cause Gordon syndrome, Marden-Walker syndrome, and distal arthrogryposis
