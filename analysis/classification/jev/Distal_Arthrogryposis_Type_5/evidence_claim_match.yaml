        discussion_id: da5_ocular_respiratory_mechanism_gap
        prompt: How does PIEZO2 gain of function cause the ophthalmoplegia, ptosis and restrictive chest
          disease that distinguish DA5 from other distal arthrogryposes, and does it act through sensory
          neurons, muscle or the chest wall?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Restrictive Chest Disease
        - phenotypes#Ophthalmoplegia
        - phenotypes#Ptosis
        rationale: The only mechanistic model, the E2799del knock-in mouse, explains the limb contractures
          through proprioceptive sensory neurons and tendon shortening, but ocular motility, eyelid position
          and respiratory function are not among its reported readouts. Clinical reports infer involvement
          of skeletal or respiratory muscles, and muscle fibrosis has been proposed for the ophthalmoparesis,
          without tissue evidence. The edges from the PIEZO2 node to these features are therefore recorded
          with unknown intermediates.
      selected_evidence:
        snippet: Restrictive chest disease is a component of DA5. This implies involvement of the skeletal,
          and/or respiratory muscles.
        supports: SUPPORT
