            label: SPTAN1
        description: 'Juvenile-onset autosomal dominant hereditary motor neuropathy caused by heterozygous
          nonsense variants in SPTAN1, the alpha-II spectrin gene, in three separate families. The mutant
          transcript is degraded by nonsense-mediated decay and patient cells carry reduced protein, so
          the mechanism is haploinsufficiency of a cytoskeletal scaffolding protein. Penetrance was variable
          in two of the three families and severity differed widely between affected individuals.

          The allelic mechanism is what separates this entity from the other SPTAN1 disease. ClinGen classifies
          SPTAN1 `Definitive` for genetic developmental and epileptic encephalopathy (MONDO:0100062, autosomal
          dominant; current table, file created 2026-09-25) and has no assertion against any neuropathy;
          that encephalopathy is curated in this knowledge base as `SPTAN1-Related_Developmental_and_Epileptic_Encephalopathy`.
          The founding motor-neuropathy report draws the distinction itself: the epilepsy phenotypes were
          attributed to dominant-negative alleles, whereas the neuropathy families carry nonsense alleles
          that are removed by nonsense-mediated decay. A Definitive gene-disease assertion is therefore
          not transferable between the two, and this row does not borrow it.

          '
      selected_evidence:
        snippet: We identified patients with heterozygous nonsense mutations in the αII-spectrin gene,
          SPTAN1, in three separate dominant hereditary motor neuropathy families via next-generation
          sequencing.
        supports: SUPPORT
