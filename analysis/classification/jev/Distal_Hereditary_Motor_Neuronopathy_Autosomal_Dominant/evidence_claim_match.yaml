  856f87649be8655a8d1921c20e8f35016782bf6f09b0f1013c4893a800f7b659:
    claim:
      about:
        disease:
          name: Distal Hereditary Motor Neuronopathy, Autosomal Dominant
          disease_term:
            preferred_term: autosomal dominant distal hereditary motor neuropathy
            term:
              id: MONDO:0015362
              label: neuronopathy, distal hereditary motor, autosomal dominant
        context:
        - path: /has_subtypes/5
          value:
            name: dHMN2C
            display_name: dHMN2C (HSPB3-related)
            description: 'Distal hereditary motor neuronopathy type 2C, caused by a heterozygous variant
              in HSPB3 (HSPL27), a third small heat-shock protein of the same family as the HSPB1 and
              HSPB8 genes that dominate this entry. The founding report identified c.21G>T (p.Arg7Ser)
              in the N-terminal domain in two affected siblings with an asymmetric, length-dependent,
              predominantly motor axonal neuropathy, found by screening all ten sHSP genes in a neuropathy
              cohort rather than by linkage. A second heterozygous allele, c.352T>C (p.Tyr118His) in the
              alpha-crystallin domain, was later reported in a Korean family that was ascribed to axonal
              CMT2 rather than to dHMN, so the two published alleles sit on either side of the dHMN/CMT2
              boundary that this entry otherwise draws electrophysiologically.

              The evidence base is deliberately recorded as thin. A 2016 review of the chaperone dHMNs
              states that only one family was then known to carry a clinical HSPB3 mutation, and ClinGen''s
              Gene-Disease Validity table (release pinned in data/clingen/MANIFEST.yaml) contains no HSPB3
              assertion at all, while it classifies HSPB8 as Definitive for MONDO:0015362 - this entry''s
              own disease term. HSPB3 is therefore curated here as a subtype row rather than as a separate
              disease entry: it has two reported alleles in two families and no disease-specific pathophysiology
              that is distinguishable from the chaperone/proteostasis chain this entry already models.

              Naming trap. dHMN2C (HSPB3) is not HMSN2C, the hereditary motor and sensory neuropathy caused
              by TRPV4 that appears in the `dHMN-TRPV4` row of this same entry. The two abbreviations
              differ by one letter and name different genes and different diseases.

              '
            subtype_term:
              preferred_term: neuronopathy, distal hereditary motor, type 2C
              term:
                id: MONDO:0013243
                label: neuronopathy, distal hereditary motor, type 2C
            genes:
            - preferred_term: HSPB3
              term:
                id: hgnc:5248
                label: HSPB3
          role: subtype
      assertion_type: Genetic
      assertion:
        name: HSPB3
        gene_term:
          preferred_term: HSPB3
          term:
            id: hgnc:5248
            label: HSPB3
        inheritance:
        - name: Autosomal Dominant
        subtype: dHMN2C
        notes: 'Heterozygous HSPB3 (HSPL27) missense variants are reported in two families: p.Arg7Ser
          in the N-terminal domain (dHMN2C) and p.Tyr118His in the alpha-crystallin domain (reported as
          axonal CMT2). HSPB3 differs from HSPB1 and HSPB8 in being tissue-restricted rather than ubiquitous,
          and it forms hetero-oligomers with HSPB2 and HSPB8, which is the proposed route by which a variant
          in it reaches the same chaperone machinery. ClinGen''s Gene-Disease Validity table (release
          pinned in data/clingen/MANIFEST.yaml) contains no HSPB3 assertion, so the gene-disease relationship
          has not been classified by that panel either way.

          '
      selected_evidence:
        snippet: HSPB3 interacts with HSPB2 and these two proteins in turn both interact with HSPB8, potentially
          contributing to maintain myofibril integrity
        supports: SUPPORT
    origin:
      assertion_path: /genetic/5
      evidence_path: /genetic/5/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /has_subtypes/5
    evidence_metadata:
      reference: PMID:28018906
      reference_title: 'Chaperonopathies: Spotlight on Hereditary Motor Neuropathies.'
      evidence_source: OTHER
      explanation: Places HSPB3 inside the same small heat-shock protein complex as HSPB8, which is why
        a variant in it plausibly acts through the proteostasis chain this entry models. The functional
        link is stated as a potential contribution, not a demonstrated disease mechanism.
