        description: 'Autosomal dominant distal motor neuropathy attributed to the heterozygous EMILIN1
          substitution p.R250C in the coiled-coil region, reported in four affected members of one family.
          EMILIN-1 is an extracellular matrix glycoprotein, so this is the only subtype on this entry
          whose lesion sits outside the motor neuron: the reported defect is reduced extracellular deposition
          of EMILIN-1 in a disorganised fibre network, with EMILIN-1 demonstrated in nerve structures
          on muscle biopsy.

          Two reasons this row is scoped narrowly. First, the evidence base is one family for the motor-predominant
          phenotype, plus an earlier single family in which an EMILIN1 missense variant was associated
          with an autosomal dominant connective tissue disorder and a motor-sensory neuropathy - so a
          neuropathy has been reported twice, in two different clinical contexts, in two families. Second,
          the one ClinGen Gene-Disease Validity assertion for EMILIN1 in the current table (file created
          2026-09-25) is `Definitive` for arterial tortuosity-bone fragility syndrome (MONDO:0971179)
          with autosomal recessive inheritance - a different disease and a different inheritance mode
          from the one MONDO''s HMND10 edge asserts, so that Definitive classification supports nothing
          about this subtype. ClinGen has not classified EMILIN1 against any neuropathy.

          '
      selected_evidence:
        snippet: located in the coiled coil forming region of the protein, in four affected members of
          an autosomal dominant family presenting a distal motor neuropathy phenotype
        supports: SUPPORT
