  120d8c312938793e03ea11b9723b75974e2343761ec0cbced4c805257b7c6296:
    claim:
      about:
        disease:
          name: Distal Hereditary Motor Neuronopathy, Autosomal Dominant
          disease_term:
            preferred_term: autosomal dominant distal hereditary motor neuropathy
            term:
              id: MONDO:0015362
              label: neuronopathy, distal hereditary motor, autosomal dominant
        context: []
      assertion_type: Subtype
      assertion:
        name: dHMN2C
        display_name: dHMN2C (HSPB3-related)
        description: 'Distal hereditary motor neuronopathy type 2C, caused by a heterozygous variant in
          HSPB3 (HSPL27), a third small heat-shock protein of the same family as the HSPB1 and HSPB8 genes
          that dominate this entry. The founding report identified c.21G>T (p.Arg7Ser) in the N-terminal
          domain in two affected siblings with an asymmetric, length-dependent, predominantly motor axonal
          neuropathy, found by screening all ten sHSP genes in a neuropathy cohort rather than by linkage.
          A second heterozygous allele, c.352T>C (p.Tyr118His) in the alpha-crystallin domain, was later
          reported in a Korean family that was ascribed to axonal CMT2 rather than to dHMN, so the two
          published alleles sit on either side of the dHMN/CMT2 boundary that this entry otherwise draws
          electrophysiologically.

          The evidence base is deliberately recorded as thin. A 2016 review of the chaperone dHMNs states
          that only one family was then known to carry a clinical HSPB3 mutation, and ClinGen''s Gene-Disease
          Validity table (release pinned in data/clingen/MANIFEST.yaml) contains no HSPB3 assertion at
          all, while it classifies HSPB8 as Definitive for MONDO:0015362 - this entry''s own disease term.
          HSPB3 is therefore curated here as a subtype row rather than as a separate disease entry: it
          has two reported alleles in two families and no disease-specific pathophysiology that is distinguishable
          from the chaperone/proteostasis chain this entry already models.

          Naming trap. dHMN2C (HSPB3) is not HMSN2C, the hereditary motor and sensory neuropathy caused
          by TRPV4 that appears in the `dHMN-TRPV4` row of this same entry. The two abbreviations differ
          by one letter and name different genes and different diseases.

          '
        subtype_term:
          preferred_term: neuronopathy, distal hereditary motor, type 2C
          term:
            id: MONDO:0013243
            label: neuronopathy, distal hereditary motor, type 2C
        genes:
        - preferred_term: HSPB3
          term:
            id: hgnc:5248
            label: HSPB3
      selected_evidence:
        snippet: A missense mutation in the gene encoding small heat shock protein B3 (HSPB3, also called
          HSP27, protein 3) was discovered in 2 siblings with an asymmetric axonal motor neuropathy.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/5
      evidence_path: /has_subtypes/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20142617
      reference_title: 'Mutant small heat shock protein B3 causes motor neuropathy: utility of a candidate
        gene approach.'
      evidence_source: HUMAN_CLINICAL
      explanation: Founding report assigning HSPB3 to a dominant-pattern axonal motor neuropathy, which
        is the gene-disease claim this subtype row makes.
