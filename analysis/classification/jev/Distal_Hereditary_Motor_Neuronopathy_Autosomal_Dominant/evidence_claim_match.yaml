        genes:
        - preferred_term: FBXO38
          term:
            id: hgnc:28844
            label: FBXO38
        description: 'Autosomal dominant distal SMA presenting with calf weakness, caused by the heterozygous
          FBXO38 missense substitution p.Cys206Arg in two unrelated families. FBXO38 is a coactivator
          of the transcription factor KLF7, and the substitution leaves FBXO38 correctly localised while
          impairing KLF7-driven transcription of genes needed for axon outgrowth and repair - a transcriptional
          rather than a chaperone or transport lesion, which is why this row records its own mechanism
          instead of deferring to the proteostasis chain that covers the small heat-shock protein subtypes.

          Calf-predominant weakness at onset is the distinguishing clinical feature against the foot-drop-first
          presentation the rest of this entry describes. PMID:31420593 later reported a homozygous FBXO38
          variant, p.Arg526Gln, in the child of consanguineous parents with a congenital mild neuronopathy,
          and proposed a loss-of-function mechanism, so dominant and recessive alleles are both on record
          for this gene. That report is named rather than cited as evidence because the entity this row
          curates is the dominant one; the dominant allele is what defines it.

          '
      selected_evidence:
        snippet: In two unrelated families affected by a distinct form of autosomal-dominant distal SMA
          initially manifesting with calf weakness, we identified by genetic linkage analysis and exome
          sequencing a heterozygous missense mutation, c.616T>C (p.Cys206Arg), in F-box protein 38 (FBXO38).
        supports: SUPPORT
