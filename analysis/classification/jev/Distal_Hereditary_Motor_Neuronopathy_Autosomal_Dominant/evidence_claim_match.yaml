  249018cb546da30250f49cf9a23bb67a0cdb4c73675de2d60a4ef0f9a4a996eb:
    claim:
      about:
        disease:
          name: Distal Hereditary Motor Neuronopathy, Autosomal Dominant
          disease_term:
            preferred_term: autosomal dominant distal hereditary motor neuropathy
            term:
              id: MONDO:0015362
              label: neuronopathy, distal hereditary motor, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Motor Neuron and Distal Axon Gene Defect
        description: 'Heterozygous (dominant) mutations in motor-neuron and distal-axon genes — small
          heat-shock protein chaperones (HSPB1, HSPB8), the ER protein seipin (BSCL2), glycyl-tRNA synthetase
          (GARS1), the dynactin axonal-transport adaptor (DCTN1), the choline transporter (SLC5A7), and
          the TRPV4 cation channel — impair the homeostatic functions that lower motor neurons require
          to build and maintain their long peripheral axons. Recurrent molecular consequences are protein
          misfolding/aggregation, impaired axonal transport, and defective tRNA charging.

          '
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        genes:
        - preferred_term: HSPB1
          term:
            id: hgnc:5246
            label: HSPB1
        - preferred_term: HSPB3
          term:
            id: hgnc:5248
            label: HSPB3
        - preferred_term: BSCL2
          term:
            id: hgnc:15832
            label: BSCL2
        - preferred_term: GARS1
          term:
            id: hgnc:4162
            label: GARS1
        - preferred_term: DCTN1
          term:
            id: hgnc:2711
            label: DCTN1
        - preferred_term: SLC5A7
          term:
            id: hgnc:14025
            label: SLC5A7
        - preferred_term: TRPV4
          term:
            id: hgnc:18083
            label: TRPV4
        - preferred_term: FBXO38
          term:
            id: hgnc:28844
            label: FBXO38
        - preferred_term: EMILIN1
          term:
            id: hgnc:19880
            label: EMILIN1
        - preferred_term: SPTAN1
          term:
            id: hgnc:11273
            label: SPTAN1
        - preferred_term: BAG3
          term:
            id: hgnc:939
            label: BAG3
        biological_processes:
        - preferred_term: Protein folding (chaperone function)
          term:
            id: GO:0006457
            label: protein folding
          modifier: DECREASED
        notes: 'This is the genetic-lesion node of the entry, and its `genes:` list binds every gene the
          entry curates as a dominant cause. The claim it makes of each of them is the one each founding
          report makes: a heterozygous variant impairs something lower motor neurons need in order to
          build and maintain their long peripheral axons. It does not claim they act by the same molecular
          route, and they do not - the small heat-shock proteins and seipin act through protein quality
          control, dynactin and glycyl-tRNA synthetase through axonal transport and local translation,
          SLC5A7 at the presynaptic terminal of the neuromuscular junction, TRPV4 through a calcium-permeable
          channel, FBXO38 through KLF7-dependent transcription of axon-outgrowth genes, SPTAN1 through
          the axonal spectrin cytoskeleton, and BAG3 through chaperone-assisted selective autophagy. Each
          route is stated in that gene''s `genetic:` record and subtype row.

          The bound `protein folding` process term describes the chaperone subset only (HSPB1, HSPB3,
          BSCL2, BAG3) and is not asserted of the other seven genes; no single ontology term covers what
          this node''s eleven genes have in common.

          EMILIN1 is the one binding that needs an explicit caveat. It encodes an extracellular matrix
          glycoprotein, so its lesion is outside the motor neuron rather than inside it, and the node''s
          bound cell type should not be read as locating the EMILIN1 defect in that cell. It is bound
          here because the reported consequence is a motor-axonal one - abnormal axonal arborization from
          spinal cord motor neurons in the zebrafish knockdown - which is what this node describes.

          '
      selected_evidence:
        snippet: We identified patients with heterozygous nonsense mutations in the αII-spectrin gene,
          SPTAN1, in three separate dominant hereditary motor neuropathy families via next-generation
          sequencing.
        supports: SUPPORT
