          of this entry.

          This row is deliberately thin, and points elsewhere rather than duplicating. The phenotype,
          its contrast with the sensory-predominant BAG3 neuropathy, and the variant-class-to-phenotype
          correlation across BAG3''s disease spectrum are curated in `Charcot-Marie-Tooth_Disease_Axonal_Type_2JJ`
          (MONDO:0976227 / OMIM:621095), which is the deeper treatment. The row exists here because MONDO
          makes HMND15 (MONDO:0976226 / OMIM:621094) a direct child of this entry''s own disease term
          and nothing in the knowledge base bound it, so the gene-defined subtype had no home. ClinGen
          classifies BAG3 `Definitive` for myofibrillar myopathy and for dilated cardiomyopathy 1HH (current
          table, file created 2026-09-25) and has no assertion against any neuropathy, so neither classification
          supports this row.

          '
