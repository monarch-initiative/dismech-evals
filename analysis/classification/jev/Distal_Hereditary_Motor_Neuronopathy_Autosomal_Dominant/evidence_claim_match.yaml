      assertion_type: Genetic
      assertion:
        name: SPTAN1
        gene_term:
          preferred_term: SPTAN1
          term:
            id: hgnc:11273
            label: SPTAN1
        association: Causative
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal Dominant
        subtype: dHMN-SPTAN1
        notes: 'Heterozygous SPTAN1 nonsense variants in three dominant hereditary motor neuropathy families
          act by nonsense-mediated decay and reduced alpha-II spectrin protein, i.e. haploinsufficiency.
          Penetrance was variable in two of the three families.

          ClinGen classifies SPTAN1 `Definitive` for genetic developmental and epileptic encephalopathy
          (MONDO:0100062) and carries no assertion against any neuropathy (current Gene-Disease Validity
          table, file created 2026-09-25). That assertion is not evidence for this record: the encephalopathy
          is attributed to dominant-negative alleles and the neuropathy to nonsense alleles removed by
          nonsense-mediated decay, a distinction the founding motor-neuropathy report makes itself. This
          knowledge base curates the encephalopathy separately as `SPTAN1-Related_Developmental_and_Epileptic_Encephalopathy`.

          '
      selected_evidence:
        snippet: We identified patients with heterozygous nonsense mutations in the αII-spectrin gene,
          SPTAN1, in three separate dominant hereditary motor neuropathy families via next-generation
          sequencing.
        supports: SUPPORT
