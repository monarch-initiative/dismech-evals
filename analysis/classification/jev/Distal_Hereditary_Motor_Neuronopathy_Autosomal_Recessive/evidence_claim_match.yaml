      assertion_type: Subtype
      assertion:
        name: dSMA1
        display_name: dSMA1 / SMARD1 (IGHMBP2-related, HMNR1)
        description: 'Spinal muscular atrophy with respiratory distress type 1 (SMARD1; HMNR1), caused
          by biallelic mutations in IGHMBP2. Presents in infancy with diaphragmatic paralysis and respiratory
          failure plus distal muscle weakness, due to progressive degeneration of alpha motor neurons.
          Allelic to CMT2S.

          '
      selected_evidence:
        snippet: 'Spinal muscular atrophy with respiratory distress type 1 (SMARD1; OMIM #604320, ORPHA:98920)
          is a rare autosomal recessive congenital motor neuron disease. It is caused by variants in the
          IGHMBP2 gene.'
        supports: SUPPORT
