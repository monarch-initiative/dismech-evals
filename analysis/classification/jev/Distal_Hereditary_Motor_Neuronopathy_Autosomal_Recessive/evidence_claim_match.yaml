              label: neuronopathy, distal hereditary motor, autosomal recessive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Distal Muscle Weakness and Wasting
        description: 'Clinically evident distal limb weakness and muscle atrophy, typically beginning
          in the feet and lower legs with foot drop and pes cavus, without prominent sensory loss; in
          severe infantile (SMARD1) forms, diaphragmatic and respiratory muscle involvement dominate.

          '
      selected_evidence:
        snippet: Neurological examination revealed a symmetrical severe muscle wasting and weakness in
          distal lower and upper limbs, with claw hands, footdrop with equinovarus deformity and hammer
          toes, generalized areflexia and normal sensory examination.
        supports: SUPPORT
