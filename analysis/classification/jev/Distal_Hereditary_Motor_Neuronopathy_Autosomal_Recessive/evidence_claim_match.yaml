        context: []
      assertion_type: Subtype
      assertion:
        name: dSMA2
        display_name: dSMA2 (SIGMAR1-related, HMNR2)
        description: 'Autosomal recessive distal hereditary motor neuropathy (HMNR2) caused by biallelic
          SIGMAR1 mutations, with childhood-onset distal weakness and atrophy and a pure chronic motor
          peripheral nerve involvement. SIGMAR1 encodes an endoplasmic reticulum chaperone; the gene is
          allelic to juvenile ALS16.

          '
      selected_evidence:
        snippet: 'Alterations of its normal function may contribute to two different phenotypes: juvenile
          amyotrophic lateral sclerosis (ALS 16) and distal hereditary motor neuropathies (dHMN).'
        supports: SUPPORT
