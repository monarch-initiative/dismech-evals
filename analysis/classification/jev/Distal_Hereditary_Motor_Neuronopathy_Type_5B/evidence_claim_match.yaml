      assertion_type: Genetic
      assertion:
        name: REEP1
        notes: 'Receptor expression-enhancing protein 1, at 2p11.2. A neuron-specific ER protein that
          induces membrane curvature through transmembrane hairpins and a C-terminal amphipathic helix,
          forms complexes with atlastin-1 and spastin, and binds microtubules to align the tubular ER
          along the cytoskeleton. The dominant allelic series splits by mechanism: loss-of-function alleles
          cause SPG31, while alleles that preserve shaping activity and escape degradation cause dHMN5B.
          The split is not exhaustive — a homozygous splice-donor variant produces a third, recessive
          phenotype, a SMARD1-like congenital axonal neuropathy with diaphragmatic palsy, distal arthrogryposis
          and pronounced hyperreflexia, which fits neither dominant category.'
        gene_term:
          preferred_term: REEP1
          term:
            id: hgnc:25786
            label: REEP1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: REEP proteins were required for ER network formation in vitro, and REEP1 also bound microtubules
          and promoted ER alignment along the microtubule cytoskeleton in COS7 cells.
        supports: SUPPORT
        directness: INDIRECT
