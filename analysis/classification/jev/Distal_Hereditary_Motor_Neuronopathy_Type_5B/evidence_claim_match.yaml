              link. The localization work is from an independent group and predates the accumulation model
              by more than a decade, which is why it is worth carrying: it is the only pre-2026, allele-specific
              mechanistic data available and it points the same way. But it was done by overexpression
              in non-neuronal cell lines, and nobody has shown that atlastin-1 mis-recruitment is what
              fragments the ER in the knock-in mouse.'
          role: ancestor
