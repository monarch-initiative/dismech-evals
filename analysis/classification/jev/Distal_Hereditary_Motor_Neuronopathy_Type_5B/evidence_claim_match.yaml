            term:
              id: MONDO:0013884
              label: neuronopathy, distal hereditary motor, type 5B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: REEP1 Exon 5 Skipping Variant
        biological_scale: MOLECULAR
        description: 'The founding allele is c.304-2A>G, which destroys the exon 5 splice acceptor. Skipping
          is complete and in frame, so the transcript escapes nonsense-mediated decay and is expressed
          at normal levels, encoding p.102_139del — a protein missing 38 internal residues that include
          part of the C-terminal amphipathic helix. This is the crucial feature: the product is a stable,
          internally shortened protein rather than an absent one.'
        genes:
        - preferred_term: REEP1
          term:
            id: hgnc:25786
            label: REEP1
        genetic_context:
          allele_type: SPLICE_SITE
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: NEOMORPHIC
          gene:
            preferred_term: REEP1
            term:
              id: hgnc:25786
              label: REEP1
          notes: Recorded as neomorphic rather than loss of function because the product retains its normal
            membrane-shaping activity and acquires resistance to degradation; the loss-of-function alleles
            of the same gene cause a different disease, SPG31.
      selected_evidence:
        snippet: A minigene assay confirmed complete loss of splice-acceptor functionality and skipping
          of the in-frame exon 5. The resulting mRNA is predicted to be expressed at normal levels and
          to encode an internally shortened protein (p.102_139del).
        supports: SUPPORT
