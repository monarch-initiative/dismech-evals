        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: REEP1-associated hereditary spastic paraplegia (SPG31)
        description: The same gene, the opposite mechanism, and the main diagnostic trap. SPG31 arises
          from loss-of-function REEP1 alleles and degenerates cortical motor neuron axons, giving spasticity
          and upper motor neuron signs; dHMN5B arises from alleles that preserve shaping and escape degradation,
          and gives distal wasting. Distal wasting is described in SPG31, and upper motor neuron involvement
          is documented for REEP1 in the recessive congenital phenotype, so the ends of the REEP1 spectrum
          are not cleanly separable on examination; the discriminator is the nature of the allele rather
          than the clinical picture alone.
      selected_evidence:
        snippet: REEP1 loss-of-function causes hereditary spastic paraplegia due to degeneration of cortical
          motoneuron axons.
        supports: SUPPORT
