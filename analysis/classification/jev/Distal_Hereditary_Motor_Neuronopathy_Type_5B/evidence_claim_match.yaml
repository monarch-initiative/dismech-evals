            term:
              id: MONDO:0013884
              label: neuronopathy, distal hereditary motor, type 5B
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: toxic_gain_of_shaping_competent_reep1
        hypothesis_label: dHMN5B is a toxic gain of REEP1 function in lower motor neurons, not a loss
          of function
        status: CANONICAL
        description: 'The dHMN-associated REEP1 variants retain membrane-curvature activity and escape
          ubiquitin-dependent degradation, so the protein accumulates rather than being lost. Two independent
          lines support this: the exon-5 knock-in mouse degenerates spinal motor neurons while the knockout
          degenerates cortical ones, and a separate nonstop REEP1 variant that unmasks a 3''UTR-encoded
          aggregation motif also produces a lower motor neuron phenotype. The model predicts that reducing
          mutant REEP1 abundance, rather than supplementing REEP1, is the rational therapeutic direction
          — untested.'
      selected_evidence:
        snippet: Therefore, it is proposed that accumulation of shaping-competent REEP1 variants in the
          ER drives ER fragmentation and spinal motoneuron degeneration in dHMN.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41268727
      reference_title: REEP1 Accumulation Disrupts ER Integrity and Drives Spinal Motoneuron Degeneration
        in Distal Hereditary Motor Neuropathy.
      evidence_source: MODEL_ORGANISM
      explanation: States the accumulation model in the authors' own terms.
