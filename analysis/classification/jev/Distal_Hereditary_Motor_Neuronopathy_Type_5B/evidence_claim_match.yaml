        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired HUWE1-Dependent REEP1 Degradation
        biological_scale: MOLECULAR
        description: Wild-type REEP1 is a short-lived protein cleared through the ubiquitin-proteasome
          system, with HUWE1 identified by proteomics as the E3 ligase responsible. The dHMN alleles are
          poorly ubiquitinated and therefore escape that clearance. This is a regulatory escape rather
          than a change in the protein's own catalytic or structural activity, which is why the node is
          tagged as a gain of function rather than as an increase in a normally regulated process.
        biological_processes:
        - preferred_term: HUWE1-dependent REEP1 ubiquitination
          modifier: DECREASED
          term:
            id: GO:0016567
            label: protein ubiquitination
        - preferred_term: proteasomal turnover of REEP1
          modifier: DECREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
      selected_evidence:
        snippet: Consistently, other REEP1 variants associated with dHMN also show compromised ubiquitination
          and preserved transmembrane hairpins.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
