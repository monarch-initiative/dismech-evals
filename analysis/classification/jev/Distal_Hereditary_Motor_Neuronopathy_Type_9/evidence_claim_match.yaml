              the T2-TrpRS fragment, an angiostatic cytokine that acts extracellularly by binding vascular
              endothelial-cadherin (VE-cadherin). The full-length enzyme is inactive for this function.
              The dHMN9 variant enhances that interaction. Whether the relevant consequence in motor axons
              is vascular or a direct effect on the neuron is not established.
