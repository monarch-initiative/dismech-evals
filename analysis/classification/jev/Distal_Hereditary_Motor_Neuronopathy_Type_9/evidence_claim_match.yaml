          endothelial-cadherin (VE-cadherin). The full-length enzyme is inactive for this function. The
          dHMN9 variant enhances that interaction. Whether the relevant consequence in motor axons is
          vascular or a direct effect on the neuron is not established.
        molecular_functions:
