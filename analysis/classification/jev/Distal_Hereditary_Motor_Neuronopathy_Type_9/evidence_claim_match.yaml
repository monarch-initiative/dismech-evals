          because both references cache with no abstract text, so there is no quotable finding - see the
          entry-level notes. Recorded so a curator with full-text access knows the allelic series is larger
          than the two variants evidenced above.
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
