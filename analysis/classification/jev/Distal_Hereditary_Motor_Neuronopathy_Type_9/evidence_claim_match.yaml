        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Distal hereditary motor neuronopathy, autosomal recessive 9 (COQ7)
        description: 'The most consequential differential for this entry, and the one most likely to be
          confused with it on paper. OMIM assigned the number 9 twice in the motor neuronopathy series:
          HMND9 (this entry) is WARS1, autosomal dominant, OMIM:617721; HMNR9 is COQ7, autosomal recessive,
          OMIM:620402. Same digit, different gene, different inheritance, and a completely different mechanism
          - COQ7 encodes an enzyme of coenzyme Q10 biosynthesis, so its dHMN is a mitochondrial bioenergetic
          disease rather than a translational one. The distinction is not academic: COQ7-related dHMN
          is potentially treatable by coenzyme Q10 supplementation, and no such option exists for WARS1
          dHMN9.'
        disease_term:
          preferred_term: distal hereditary motor neuronopathy, autosomal recessive 9
          term:
            id: MONDO:0957874
            label: neuronopathy, distal hereditary motor, autosomal recessive 9
        distinguishing_features:
        - Biallelic COQ7 variants and recessive transmission, versus a single heterozygous WARS1 allele
          transmitted dominantly.
        - Mitochondrial coenzyme Q10 biosynthesis defect, versus a cytoplasmic tRNA-charging and TrpRS-moonlighting
          defect.
        - A blood biomarker exists - 6-demethoxycoenzyme Q10 accumulates in patient plasma - whereas no
          serum biomarker is described for WARS1 dHMN9.
        - Potentially treatable with coenzyme Q10 or the precursor 2,4-dihydroxybenzoic acid; WARS1 dHMN9
          has no disease-modifying therapy.
      selected_evidence:
        snippet: Normal coenzyme Q10 and 6-demethoxycoenzyme Q10 levels were restored in vitro by using
          the coenzyme Q10 precursor 2,4-dihydroxybenzoic acid, thus bypassing the COQ7 requirement.
        supports: SUPPORT
