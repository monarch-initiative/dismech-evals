            term:
              id: MONDO:0032853
              label: myopathy, distal, 6, adult-onset, autosomal dominant
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other anterior-compartment / distal myopathies
        description: 'The distal (tibial/anterior-compartment) presentation overlaps clinically with other
          distal myopathies and neuropathies — TTN-related tibial muscular dystrophy (Udd), MYH7-related
          Laing distal myopathy, GNE myopathy, VCP-related and MYOT/TIA1 myofibrillar/Welander myopathies,
          sporadic inclusion body myositis, and peroneal neuropathy — which are distinguished by gene,
          muscle-MRI pattern, and biopsy.

          '
        distinguishing_features:
        - 'Serum CK separates some of them: mild elevation in actininopathy against the marked elevation
          (often over ten times the upper limit) of distal anoctaminopathy and the early high CK of Miyoshi/dysferlin
          myopathy.

          '
        - 'Upper-limb sparing argues against Welander and GNE myopathy, and preserved sensation with myopathic
          EMG argues against peroneal neuropathy and distal hereditary motor neuronopathy.

          '
        - 'ACTN2 is one of roughly twenty genes causing a dominant distal myopathy. Those entities differ
          in where weakness starts (hands in Welander, vocal cord and pharynx in VCPDM, anterior lower
          leg here), so the clinical pattern narrows the list without closing it; a multigene distal-myopathy
          panel is what settles it.

          '
      selected_evidence:
        snippet: Currently, almost 20 genes (ACTN2, CAV3, CRYAB, DNAJB6, DNM2, FLNC, HNRNPA1, HSPB8, KHLH9,
          LDB3, MATR3, MB, MYOT, PLIN4, TIA1, VCP, NOTCH2NLC, LRP12, GIPS1) have been associated with
          an autosomal dominant form of distal myopathy.
        supports: SUPPORT
