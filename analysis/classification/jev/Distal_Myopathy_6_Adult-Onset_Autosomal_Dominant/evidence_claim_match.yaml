            experimental_model_type: CELL_LINE
            description: 'C2C12 murine myoblasts expressing a panel of ACTN2 frameshift and missense variants
              drawn from dominant and recessive actininopathies, scored for alpha-actinin-2 aggregate
              formation. The panel design is what makes the result informative: it separates the variant
              classes rather than testing one allele in isolation.'
            organism:
              preferred_term: mouse
              term:
                id: NCBITaxon:10090
                label: Mus musculus
            publication: PMID:39095936
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Alpha-actinin-2 protein aggregation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Protein-extending dominant frameshift variants form alpha-actinin-2 aggregates in
          this system while recessive missense variants do not, which is the direct experimental basis
          for the aggregation node.
        limitations: 'A murine myoblast line is not adult human skeletal muscle: it lacks the mature sarcomere,
          the mechanical loading and the decades of exposure under which the human phenotype emerges.
          The assay scores aggregate formation, not the downstream Z-disk failure or muscle degeneration,
          and the authors state the mechanism accounts for only a limited number of variants.'
        readouts:
        - name: Alpha-actinin-2 aggregate formation
          target: Alpha-actinin-2 protein aggregation
          direction: INCREASED
          interpretation: Aggregates form with protein-extending dominant frameshift variants and are
            absent with recessive missense variants, separating the two variant classes.
      selected_evidence:
        snippet: Functional characterization in C2C12 cell model of several ACTN2 variants is conducted,
          including frameshift and missense variants associated with dominant and recessive actininopathies.
        supports: SUPPORT
