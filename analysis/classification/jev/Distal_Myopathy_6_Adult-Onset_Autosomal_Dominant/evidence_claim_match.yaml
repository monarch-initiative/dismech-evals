          modifier: ABNORMAL
          term:
            id: GO:0051015
            label: actin filament binding
      selected_evidence:
        snippet: High-throughput sequencing identified in each proband a heterozygous single nucleotide
          deletion (c.2558del and c.2567del) in the last exon of the ACTN2 gene.
