  aeef3e22ad365119c668007a7f2a5d147bd1406ecfdbb910179d8a8e82e63741:
    claim:
      about:
        disease:
          name: Distal Myopathy 6, Adult-Onset, Autosomal Dominant
          disease_term:
            preferred_term: myopathy, distal, 6, adult-onset, autosomal dominant
            term:
              id: MONDO:0032853
              label: myopathy, distal, 6, adult-onset, autosomal dominant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mpd6_no_allele_matched_animal_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Do the existing zebrafish and AAV-mouse ACTN2 models say anything about MPD6 specifically,
          given that both express p.Leu727Arg - an allele of the congenital core myopathy, not of MPD6?

          '
        attaches_to:
        - animal_models#Zebrafish ACTN2 p.Leu727Arg mRNA overexpression
        - animal_models#AAV2/9 ACTN2 p.Leu727Arg tibialis anterior mouse
        - pathophysiology#Z-disk and myofibrillar disorganization
        rationale: 'Both published in vivo models transiently overexpress an exogenous mutant ACTN2 allele
          that causes Multiple structured Core Disease, an early-onset respiratory-involved congenital
          myopathy. They support the general claim that mutant alpha-actinin-2 disorganizes the Z-disk
          and weakens muscle, and the mouse arm even uses the tibialis anterior. What no model addresses
          is the feature that defines MPD6: why an adult-onset process selects the anterior lower-leg
          compartment after decades of normal function. Supraphysiological transient overexpression over
          four weeks is the wrong time-course for that question, so the aggregate structural evidence
          should not be read as an MPD6 model.

          '
        proposed_experiments:
        - experiment_id: mpd6_knockin_mouse_endogenous_dosage
          name: Knock-in mouse carrying an MPD6 allele at endogenous ACTN2 dosage
          description: 'Generate heterozygous knock-in mice for a founder MPD6 missense allele (p.Cys487Arg
            or p.Ile134Asn) and for a last-exon protein-extending frameshift allele, and age them, comparing
            tibialis anterior with soleus and with a proximal control muscle for onset, fat replacement,
            force, and alpha-actinin-2 aggregate burden. Endogenous dosage and aging are the two things
            the existing models lack.

            '
          would_support:
          - pathophysiology#Distal skeletal muscle degeneration and weakness
          supporting_outcome:
          - Age-dependent, anterior-compartment-predominant force loss and Z-disk pathology appearing
            in adulthood in the MPD6 knock-in but not in littermate controls.
          would_refute:
          - pathophysiology#Alpha-actinin-2 protein aggregation
          refuting_outcome:
          - No detectable alpha-actinin-2 aggregation in muscle from the protein-extending knock-in despite
            an overt myopathy, which would place the aggregation mechanism outside the in vivo disease.
      selected_evidence:
        snippet: we identified de novo ACTN2 mutations, a missense and a deletion, in two unrelated patients
          presenting with progressive early-onset muscle weakness and respiratory involvement
        supports: SUPPORT
