        discussion_id: mpd6_therapeutic_window_allele_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Can a therapy lower or correct mutant alpha-actinin-2 without compromising the wild-type
          protein that healthy sarcomeres and myocardium depend on?

          '
        attaches_to:
        - treatments#Supportive Care
        - pathophysiology#Alpha-actinin-2 protein aggregation
        rationale: 'Gene addition does not help a dominant toxic-gain mechanism, so the obvious strategies
          are knockdown or editing. Alpha-actinin-2 is essential in both skeletal muscle and heart, so
          a non-allele-selective knockdown risks causing the disease it is meant to treat. This is the
          specific reason MPD6 has no therapeutic programme rather than simply not having attracted one,
          and it is what any candidate approach has to answer first.

          '
      selected_evidence:
        snippet: Given the essential physiological role of wild-type α-actinin-2 in maintaining sarcomeric
          stability, broad inhibition or knockdown strategies could induce severe cardiotoxicity or myopathy.
        supports: SUPPORT
