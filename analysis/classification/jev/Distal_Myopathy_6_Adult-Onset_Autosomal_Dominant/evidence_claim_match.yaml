  c3f714fdf79bb7a518858abaa40036b2775759d330d07fc7d4e49e882cda9fad:
    claim:
      about:
        disease:
          name: Distal Myopathy 6, Adult-Onset, Autosomal Dominant
          disease_term:
            preferred_term: myopathy, distal, 6, adult-onset, autosomal dominant
            term:
              id: MONDO:0032853
              label: myopathy, distal, 6, adult-onset, autosomal dominant
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: MODERATE
        rationale: MPD6 causes lifelong, slowly progressive lower-limb weakness that begins in adulthood
          and produces foot drop, falls risk, and eventual proximal involvement, requiring orthoses and
          later mobility aids. Against that, progression is slow, upper limbs are typically spared, and
          the two organ involvements that drive mortality in other sarcomeric myopathies - cardiac and
          respiratory - are not common in the reported dominant cohorts. The burden is therefore substantial
          for mobility and function without an established effect on survival.
      selected_evidence:
        snippet: The clinical phenotype ranged from asymptomatic to limb-girdle weakness and facial involvement
          and was depending on genotype. Cardiac and respiratory involvement were not common.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39812845
      reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes both the range of functional impairment and the low frequency of the cardiac
        and respiratory complications that would otherwise raise the burden level.
