      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: No population rate has been estimated for MPD6. The largest published series of non-congenital
          dominant ACTN2 myopathy assembled 37 patients from 11 Spanish and Belgian families; earlier
          reports describe four families (actininopathy) and individual last-exon frameshift kindreds.
          Because the published cohorts are ascertained through neuromuscular referral centres and two
          of the recurrent variants are founder alleles, the case counts index ascertainment rather than
          population frequency, so no rate_per_100000 is asserted.
      selected_evidence:
        snippet: Genetic, clinical, and muscle imaging data were collected from 37 patients with an autosomal
          dominant ACTN2 myopathy belonging to 11 families from Spain and Belgium.
        supports: SUPPORT
