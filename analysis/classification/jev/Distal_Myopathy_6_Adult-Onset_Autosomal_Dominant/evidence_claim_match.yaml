            term:
              id: MONDO:0032853
              label: myopathy, distal, 6, adult-onset, autosomal dominant
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mpd6_eccentric_load_selective_vulnerability
        hypothesis_label: Mechanical-load selectivity explains the distal predilection
        status: EMERGING
        description: 'Alpha-actinin-2 is expressed throughout skeletal and cardiac muscle, so a uniform
          Z-disk defect does not by itself explain why weakness starts in the anterior lower leg. The
          proposed explanation is that the distal locomotor muscles carry higher mechanical stress and
          eccentric load, so a Z-disk that is marginally destabilized fails there first. Two things keep
          this at EMERGING. It is a review-level inference from the anatomy of the deficit rather than
          an experimental result, offered by its source as a possibility and not tested in any model.
          And it competes with a genotype-specific account: the largest dominant cohort found the clinical
          pattern tracked genotype, spanning asymptomatic carriers to limb-girdle weakness, which a load-based
          explanation alone does not predict, since mechanical load is the same whichever allele a person
          carries. Note the muscle distribution does not settle it either way - the affected set (tibialis
          anterior and soleus, but also hamstrings and glutei) is a mix of distal and high-eccentric-load
          proximal muscles, so it neither confirms nor excludes a load account.'
      selected_evidence:
        snippet: The clinical phenotype ranged from asymptomatic to limb-girdle weakness and facial involvement
          and was depending on genotype.
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39812845
      reference_title: Clinical and imaging spectrum of non-congenital dominant ACTN2 myopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Genotype-dependent severity within a single disease argues against mechanical load
        being the determinant of where and whether muscle fails: loading does not vary by allele, so a
        load-only account cannot generate a genotype-dependent range from asymptomatic to limb-girdle.'
