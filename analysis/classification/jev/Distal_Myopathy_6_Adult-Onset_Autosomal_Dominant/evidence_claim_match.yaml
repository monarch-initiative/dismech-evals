            term:
              id: MONDO:0032853
              label: myopathy, distal, 6, adult-onset, autosomal dominant
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Recessive ACTN2-related myopathy (biallelic)
        description: 'Biallelic ACTN2 missense variants cause a recessive myopathy that is allelic to
          MPD6 and overlaps it clinically — asymmetric, progressive, distal-predominant lower-limb weakness
          — so a single heterozygous ACTN2 finding does not by itself establish the dominant entity. The
          recessive form additionally has prominent proximal involvement and, mechanistically, its missense
          variants do not form alpha-actinin-2 aggregates in the cell model, unlike the dominant protein-extending
          frameshift class.

          '
        distinguishing_features:
        - 'Biallelic rather than heterozygous ACTN2 genotype, with pedigree consistent with recessive
          transmission.

          '
        - 'Both proximal and distal lower-extremity weakness at presentation, with hamstring and adductor
          involvement in the thigh.

          '
        - 'Reported in a Palestinian founder population for the recurrent p.Arg506Gly allele.

          '
      selected_evidence:
        snippet: 'We report seven patients from five families with a recurring biallelic variant in ACTN2:
          c.1516A>G (p.Arg506Gly), all manifesting with a consistent phenotype of asymmetric, progressive,
          proximal, and distal lower extremity predominant muscle weakness.'
        supports: SUPPORT
    origin:
