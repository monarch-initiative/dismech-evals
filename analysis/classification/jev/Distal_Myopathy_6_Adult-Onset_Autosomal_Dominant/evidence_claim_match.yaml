      assertion_type: Pathophysiology
      assertion:
        name: Alpha-actinin-2 conformational destabilization
        biological_scale: MOLECULAR
        description: 'A candidate step upstream of aggregation, and one of the few leads on the missense
          class whose mechanism is otherwise undetermined. Systematic biophysical profiling of ACTN2 missense
          variants shows reduced solubility, reduced thermal and proteolytic stability, and a strong propensity
          to aggregate in solution, with the actin-binding domain the most vulnerable region. Structural
          work on actin-binding-domain variants shows the same variants incorporate less well into the
          Z-disc and that the unincorporated protein forms aggregates outside it. Both lines of evidence
          come from ACTN2 hypertrophic-cardiomyopathy variant panels rather than MPD6 alleles, so this
          node states a plausible shared property of destabilizing ACTN2 missense variants, not a demonstrated
          MPD6 mechanism.

          '
      selected_evidence:
        snippet: Limited proteolysis indicates reduced structural stability across variants, while size-exclusion
          chromatography coupled with multi-angle light scattering or small-angle X-ray scattering (SEC-MALS/SAXS)
          shows a strong propensity for aggregation.
        supports: SUPPORT
        directness: INDIRECT
