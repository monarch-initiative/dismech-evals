          myopathy. It is separated from MPD6 by age of onset rather than by gene: MsCD presents with
          early-onset weakness and respiratory involvement, whereas MPD6 begins in adulthood and rarely
          involves the respiratory system. The multi-minicores reported in some MPD6 biopsies make the
          histology a poor discriminator between the two.

          '
        distinguishing_features:
        - 'Early-onset (congenital/childhood) progressive weakness with respiratory involvement, versus
          adult onset with respiratory sparing.

          '
        - 'Structured cores with jagged Z-lines as the specific histological hallmark, usually de novo
          rather than transmitted through an affected pedigree.

          '
      selected_evidence:
        snippet: we identified de novo ACTN2 mutations, a missense and a deletion, in two unrelated patients
          presenting with progressive early-onset muscle weakness and respiratory involvement
        supports: SUPPORT
