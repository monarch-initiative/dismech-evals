          name: Distal Myopathy 7, Adult-Onset, X-Linked
          disease_term:
            preferred_term: myopathy, distal, 7, adult-onset, X-linked
            term:
              id: MONDO:0024771
              label: myopathy, distal, 7, adult-onset, X-linked
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mpd7_subclinical_auditory_involvement
        prompt: Has anyone systematically audiogrammed a cohort of SMPX missense-variant myopathy patients,
          and would formal audiometry find subclinical auditory involvement that clinical history and
          examination missed?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#SMPX
        - phenotypes#Distal muscle weakness
        rationale: 'This entry claims no auditory phenotype, and that claim rests on the defining cohort
          recording no hearing loss on examination into the eighth decade. What it does not rest on is
          a systematic audiometric study: the source reports absence of recorded hearing loss, not normal
          audiograms in a screened cohort. Aggregated phenotype annotations for MPD7 in third-party resources
          do list hearing impairment, so the annotation layer and the primary literature disagree. The
          question matters because a positive result would move SMPX from two allelic diseases towards
          one pleiotropic disease with allele-dependent emphasis, and would change how a clinician follows
          a myopathy patient.'
        proposed_experiments:
        - experiment_id: exp_mpd7_audiometry_in_missense_cohort
          name: Pure-tone and high-frequency audiometry in an SMPX missense-variant cohort
          description: Perform standardised pure-tone audiometry, extended high-frequency audiometry and
            otoacoustic emissions on hemizygous carriers of the reported SMPX missense alleles, comparing
            against age- and sex-matched normative data, and stratifying by N-terminal versus C-terminal
            allele since these differ in their effect on protein solubility.
          would_support:
          - phenotypes#Distal muscle weakness
          supporting_outcome:
          - Age-adjusted high-frequency threshold elevation in missense carriers would show that the myopathy
            alleles also affect the cochlea subclinically, and would require adding an auditory phenotype
            to this entry.
          refuting_outcome:
          - Audiograms within age-matched normative limits across the cohort would confirm the current
            claim that the missense alleles spare hearing.
          decision_criterion: A consistent, age-adjusted threshold shift relative to matched controls
            resolves the gap towards auditory involvement; thresholds within normative limits resolve
            it towards the current two-disease reading.
      selected_evidence:
        snippet: The weakness typically started in the forearms with finger extension defect and in the
          lower legs with ankle dorsiflexion weakness and progressed to scapular arm abduction muscles
          while sparing the heart and respiratory muscles.
        supports: SUPPORT
    origin:
