            id: HP:0001417
            label: X-linked inheritance
        description: 'All reported patients are hemizygous males. Most probands had a negative family
          history and presented as sporadic cases; only one family contributed two affected brothers.
          The generic X-linked term is bound deliberately rather than X-linked recessive or X-linked dominant:
          no female heterozygote has been phenotyped, so there is no basis for choosing between them,
          and published tabulations of this disease are inconsistent on the point.'
      selected_evidence:
        snippet: In all ten families, except the two brothers in F5, all probands reported negative family
          history of muscle weakness and presented as sporadic cases
        supports: SUPPORT
