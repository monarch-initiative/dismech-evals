  143029187686ee6000cae5aeced59bee8628c6fc2e8fd6065c74582cb6e7c828:
    claim:
      about:
        disease:
          name: Distal Myopathy 7, Adult-Onset, X-Linked
          disease_term:
            preferred_term: myopathy, distal, 7, adult-onset, X-linked
            term:
              id: MONDO:0024771
              label: myopathy, distal, 7, adult-onset, X-linked
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SMPX missense variant with increased aggregation propensity
        biological_scale: MOLECULAR
        description: Four hemizygous SMPX missense variants (p.P7T, p.A13V, p.P27A, p.S78N) have been
          reported. In silico aggregation prediction and cell fractionation agree that the mutant protein
          is less soluble than wild type, with the two N-terminal changes producing the largest effect.
          This is a change in the behaviour of the protein rather than its absence, which is what separates
          this disease from the SMPX loss-of-function alleles that cause DFNX4 hearing loss.
        genes:
        - preferred_term: SMPX
          term:
            id: hgnc:11122
            label: SMPX
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          allele_type: SNV
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'Hemizygous germline missense alleles in affected males. GAIN_OF_FUNCTION is used
            because the defining report states the mechanism in those words and contrasts it explicitly
            with the loss-of-function alleles that cause DFNX4 hearing loss. It is a toxic gain through
            aggregation, not increased normal SMPX activity. NEOMORPHIC was considered and rejected: no
            source reports a novel activity of the mutant protein, only reduced solubility and accumulation.'
        notes: No GO or PATO term is bound to this node. "Increased aggregation propensity" is a physicochemical
          property of the mutant protein; GO has no matching biological-process or molecular-function
          term, and binding a generic protein folding or oligomerization term would assert an activity
          the source does not report. The consequence is captured at the next node with GO:0070841.
      selected_evidence:
        snippet: they supported clearly reduced solubility of SMPX p.P7T and p.A13V, whereas the C-terminal
          mutations showed a minor yet significant effect
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33974137
      reference_title: Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy
        with protein inclusions.
      evidence_source: IN_VITRO
      explanation: The biochemical measurement behind the aggregation claim, and the reason the node describes
        the effect as graded across the four alleles rather than uniform.
