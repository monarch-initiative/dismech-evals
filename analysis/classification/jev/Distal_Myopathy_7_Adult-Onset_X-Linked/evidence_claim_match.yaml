  6db512336e669d7cbc0f7b9fa67de36667c5cee97ed03be8cacb01192388e023:
    claim:
      about:
        disease:
          name: Distal Myopathy 7, Adult-Onset, X-Linked
          disease_term:
            preferred_term: myopathy, distal, 7, adult-onset, X-linked
            term:
              id: MONDO:0024771
              label: myopathy, distal, 7, adult-onset, X-linked
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_smpx_zebrafish_knockdown_allele_class
        prompt: Smpx-deficient zebrafish show both inner-ear and muscle defects, but the model is a knockdown
          and human MPD7 is caused by aggregation-prone missense alleles. Does the fish pleiotropy say
          anything about this disease, or only about SMPX loss of function?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#SMPX missense variant with increased aggregation propensity
        - animal_models#Zebrafish
        rationale: The zebrafish result is the strongest single argument that SMPX is one pleiotropic
          gene rather than two diseases, because one perturbation produces both organ phenotypes. But
          the perturbation is loss of function, which in humans produces hearing loss without myopathy,
          and the fish phenotype is an embryonic developmental defect rather than an adult-onset degenerative
          one. No model yet expresses a human missense allele at endogenous levels in muscle, so the aggregation
          mechanism this entry models has no in vivo model at all. Until one exists, the fish pleiotropy
          cannot be used either to argue that MPD7 patients should be deaf or to argue that they should
          not be.
        proposed_experiments:
        - experiment_id: exp_smpx_knockin_missense_animal_model
          name: Knock-in animal model carrying a human SMPX missense allele
          description: Generate a knock-in model expressing an orthologous version of a human aggregation-prone
            SMPX allele at the endogenous locus, alongside a null allele and wild-type controls. Compare
            adult skeletal muscle for SMPX inclusions, rimmed vacuoles and progressive distal weakness,
            and compare the inner ear for hair-cell and auditory-threshold phenotypes.
          would_support:
          - pathophysiology#Sarcoplasmic SMPX inclusion body formation
          would_refute:
          - pathophysiology#SMPX-enriched stress granule persistence
          supporting_outcome:
          - Adult-onset muscle inclusions and weakness in the knock-in but not the null would confirm
            that the missense alleles act by a different mechanism from loss of function, and would separate
            the two SMPX diseases at the level of the model as well as the clinic.
          refuting_outcome:
          - An auditory phenotype in the knock-in equal to that of the null, without a muscle phenotype,
            would show the missense alleles are simply hypomorphic and undercut the gain-of-function reading.
          decision_criterion: Divergence between knock-in and null in the direction of muscle pathology
            supports the aggregation mechanism; convergence of the two on the auditory phenotype refutes
            it.
      selected_evidence:
        snippet: This piece of evidence highlights the need for more in-depth analyses in search for possible
          correlations between SMPX mutations and muscular disorders in humans, thus potentially turning
          this non-syndromic hearing loss-associated gene into the genetic cause of dysfunctions characterized
          by more than one symptom, making SMPX a novel syndromic gene.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
