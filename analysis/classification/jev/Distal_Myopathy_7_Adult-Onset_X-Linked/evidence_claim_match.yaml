              id: MONDO:0024771
              label: myopathy, distal, 7, adult-onset, X-linked
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sarcoplasmic SMPX inclusion body formation
        biological_scale: CELLULAR
        conforms_to: loss_of_proteostasis#Misfolded-Protein Aggregation
        description: Sarcoplasmic and subsarcolemmal protein inclusions accumulate in skeletal muscle
          fibres. They stain for SMPX itself along with SQSTM1/p62, ubiquitin, SMI-31 and vinculin, and
          are negative for TDP-43. Some inclusions bind Congo red with apple-green birefringence, so at
          least a subset has amyloid-like character. Equivalent SMPX-positive inclusions were not found
          in control myopathies with rimmed-vacuolar or myofibrillar pathology, which makes the finding
          specific to this disease rather than a shared end-stage change.
        biological_processes:
        - preferred_term: inclusion body assembly
          modifier: INCREASED
          term:
            id: GO:0070841
            label: inclusion body assembly
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: Histopathological and electron microscopic analysis of patient muscle biopsies revealed
          myopathic findings with rimmed vacuoles and the presence of sarcoplasmic inclusions, some with
          amyloid-like characteristics.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
