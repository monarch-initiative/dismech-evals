  aaeb237c7858f3c2dcdcc6a7d9e95ad915d5a5ea6a2fd7c0a1e65159ae6fb8e0:
    claim:
      about:
        disease:
          name: Distal Myopathy, Tateyama Type
          disease_term:
            preferred_term: distal myopathy, Tateyama type
            term:
              id: MONDO:0013686
              label: distal myopathy, Tateyama type
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'Autosomal dominant. In the Spanish family the heterozygous CAV3 p.Arg27Gln variant
          was found in affected members and not in the unaffected members tested. The original Japanese
          patient was a sporadic case, and the abstract does not report parental testing. A sporadic Chinese
          patient carried a c.136G>A (p.Ala46Thr) variant absent from both parents, so de novo occurrence
          is documented. Each child of an affected heterozygote has a 50% chance of inheriting the variant.
          Expressivity is variable across CAV3 disease: the same variant can produce different clinical
          phenotypes and muscle pathology in different patients. Penetrance is incomplete and age-dependent:
          younger carriers in the Spanish family had no motor symptoms, and in a rippling muscle disease
          family carrying the same arginine-to-glutamine variant one carrier was asymptomatic at 86. No
          penetrance figure has been published.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: We report a Spanish family affected from a late onset, hand-involved and autosomal dominant
          distal myopathy associated to Caveolin-3 mutation.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
