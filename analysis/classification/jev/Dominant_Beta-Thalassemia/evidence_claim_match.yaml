  b10a32d4694eecbe4e3f0b8e4ab50a8f1c1daf3b45c3f1572213ee218133b40e:
    claim:
      about:
        disease:
          name: Dominant Beta-Thalassemia
          disease_term:
            preferred_term: dominant beta-thalassemia
            term:
              id: MONDO:0011381
              label: dominant beta-thalassemia
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic hematopoietic stem cell transplantation
        description: 'The only established intervention that removes the dominant allele''s product from
          erythropoiesis, by replacing the patient''s hematopoietic compartment with a donor one. The
          asymmetry worth stating plainly is with gene addition: beti-cel and the other lentiviral gene-addition
          therapies work by supplying extra copies of a functional beta-globin gene, which corrects chain
          imbalance in a recessive disease where the problem is too little normal beta chain. In dominant
          beta-thalassemia the problem is the presence of a hyperunstable chain that precipitates, so
          adding functional copies leaves the toxic product being made. Allogeneic replacement and allele-directed
          editing address this subtype in a way gene addition structurally cannot. Recorded here because
          of that reasoning rather than because transplant is commonly done in a disease this mild: the
          balance of curative benefit against transplant-related mortality is quite different in an intermedia-band
          phenotype than in transfusion-dependent disease.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: Hematopoietic Cell Transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: No transplant series exists for dominant beta-thalassemia specifically. This entry records
          the mechanistic rationale and the reason it differs from the recessive disease, not an outcome
          claim.
      selected_evidence:
        snippet: For β-thalassemia major, hematopoietic stem cell transplantation (HSCT), cord blood transplantation
          from a related donor, or autologous HSCT with gene therapy.
        supports: SUPPORT
        directness: INDIRECT
