            label: Autosomal dominant inheritance
        description: 'A single mutant allele suffices. This is the defining feature and it is mechanistic:
          the allele makes a toxic product rather than failing to make a working one, so the normal allele
          cannot compensate.'
      selected_evidence:
        snippet: Homozygous or compound heterozygous mutations of the β-globin gene lead to β-thalassemia
          (β-thal) major (β-TM) or β-thal intermedia (β-TI), whereas heterozygotes usually show microcytosis
          with negligible or no hemolysis. Certain missense mutations in exon 3, however, produce unstable
          globins causing a dominant β-thal phenotype or hemolytic anemia in heterozygotes.
        supports: SUPPORT
