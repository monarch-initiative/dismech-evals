              id: MONDO:0011381
              label: dominant beta-thalassemia
        context: []
      assertion_type: Genetic
      assertion:
        name: HBB
        association: Causal heterozygous variant
        gene_term:
          preferred_term: HBB
          term:
            id: hgnc:4827
            label: HBB
        frequency: The only gene; the disorder is defined by a specific class of HBB allele.
        notes: 'What distinguishes a dominant HBB allele from an ordinary one is where it sits and what
          it produces, not how damaging it looks. Exon 3 is the location that matters, because a premature
          stop there escapes nonsense-mediated decay and gets translated; the same change in exon 1 or
          2 would be degraded and behave recessively. Reported alleles include nonsense changes at codons
          112 and 121, missense changes such as Hb Dieppe and Hb Hradec Kralove, and elongating frameshifts
          such as Hb Grand Junction.

          Two practical consequences. A variant-effect predictor that scores a nonsense allele as more
          damaging than a missense one gets the inheritance backwards here. And an apparently de novo
          case is entirely expected: one of the Czech families'' haplotypes suggested de novo origin,
          and because these alleles carry no malaria advantage they do not persist in populations.

          Modifier genotype is worth asking about. Co-inherited alpha-thalassemia reduces the chain imbalance
          and softens the phenotype, which has been seen directly in patients carrying a 3.7 kb alpha
          deletion alongside a hyperunstable beta variant.'
      selected_evidence:
        snippet: The haplotype in one of the families suggests a de novo origin of the mutation in CD
          121.
        supports: SUPPORT
