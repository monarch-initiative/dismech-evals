              label: dominant beta-thalassemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Excess Unpaired Alpha-Globin
        biological_scale: MOLECULAR
        description: 'Defective beta-globin leaves alpha chains without a partner. Alpha haemoglobin stabilising
          protein normally chaperones free alpha-globin, but the excess overwhelms it and the unpaired
          alpha chains precipitate too - so the erythroblast carries two aggregating species, not one.
          This is also why co-inherited alpha-thalassemia is protective: fewer alpha chains means less
          imbalance.'
      selected_evidence:
        snippet: AHSP protects the free α-Hb chains in maintaining it in the soluble state.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25724329
      reference_title: '[Role of alpha-hemoglobin molecular chaperone in the hemoglobin formation and
        clinical expression of some hemoglobinopathies].'
      evidence_source: OTHER
      explanation: 'The basis for this node''s claim that AHSP is what keeps surplus alpha chains soluble,
        and therefore for the claim that the pool can be overwhelmed. Note what the snippet does and does
        not establish: it states AHSP''s protective function, not that the chaperone is saturated in this
        disorder. The saturation step is an inference from the chain excess, and the entry''s second knowledge
        gap is about exactly that unmeasured step. Indirect: background biochemistry rather than a measurement
        in dominant beta-thalassemia.'
