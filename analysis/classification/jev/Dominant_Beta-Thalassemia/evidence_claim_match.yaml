  6075d3c00d3a3364a118319445fb845b4dcf872e3920ff4a28c0d293587b55ec:
    claim:
      about:
        disease:
          name: Dominant Beta-Thalassemia
          disease_term:
            preferred_term: dominant beta-thalassemia
            term:
              id: MONDO:0011381
              label: dominant beta-thalassemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Erythroid Protein Quality Control
        biological_scale: CELLULAR
        description: Erythroid precursors do try to clear the aggregates - free alpha-globin is polyubiquitinated
          and proteasomally degraded, proteasome subunits are coordinately induced through Nrf1, and autophagy
          is recruited as a compensatory route. Dominance is what happens when that machinery is outrun.
          This is the sense in which the disorder belongs with the protein-aggregation diseases rather
          than with the quantitative haemoglobinopathies.
        biological_processes:
        - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: INCREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
        - preferred_term: autophagy
          modifier: INCREASED
          term:
            id: GO:0006914
            label: autophagy
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
      selected_evidence:
        snippet: In β-thalassemic erythrocyte precursors, free α-globin was polyubiquitinated and degraded
          by the proteasome. These cells exhibited enhanced proteasome activity, and transcriptional profiling
          revealed coordinated induction of most proteasome subunits that was mediated by the stress-response
          transcription factor Nrf1.
        supports: SUPPORT
        directness: INDIRECT
