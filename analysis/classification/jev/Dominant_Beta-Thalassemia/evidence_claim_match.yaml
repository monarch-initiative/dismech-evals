              id: MONDO:0011381
              label: dominant beta-thalassemia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Hemoglobin analysis and stability testing, read with their failure modes
        description: Hemoglobin analysis (isoelectric focusing, HPLC) and an isopropanol or heat stability
          test are the standard workup for a suspected unstable variant, and in this disorder both can
          be negative in a patient who has it. The chain is degraded so fast that it may never accumulate
          to a detectable quantity, and stability testing loses sensitivity as the lysate ages. A negative
          result therefore does not exclude the diagnosis and should not be allowed to stop the workup
          before HBB is sequenced. This is the practical reason the recessive diagnostic algorithm, which
          rests on quantifying HbA, HbA2 and HbF on hemoglobin analysis, does not transfer to the dominant
          form.
        results: Frequently negative or only weakly positive. A severely unstable chain may be undetectable
          by isoelectric focusing and HPLC, and stability tests may be positive only in freshly prepared
          lysates.
      selected_evidence:
        snippet: this beta chain is severely unstable and could not be identified either as chain or as
          hemoglobin variant by isoelectrofocusing and various high performance liquid chromatography
          methods
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/0
