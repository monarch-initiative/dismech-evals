      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No population rate exists and the disorder is reported family by family. A 1994 survey
          of exon-3 nonsense alleles counted twelve families known worldwide, four of them Czech or Slovak.
          That regional concentration is not a founder effect in the usual sense - the authors attribute
          it to the absence of malaria-related positive selection that would otherwise have spread such
          alleles, which makes dominant alleles visible wherever they arise rather than concentrated where
          malaria was.
      selected_evidence:
        snippet: A relatively high incidence of dominant beta-thal. mutations in the Czech and Slovak
          Republic (4 of 12 families known world wide with a nonsense beta-thal. mutation in the 3rd exon)
          is explained by the absence of selective preference of these mutations in malaria infested areas
          as a result of serious clinical manifestations in heterozygotes.
        supports: SUPPORT
    origin:
