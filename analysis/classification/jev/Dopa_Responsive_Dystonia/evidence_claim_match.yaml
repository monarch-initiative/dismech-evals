      assertion:
        name: Sepiapterin Reductase Deficiency and Serotonin Co-Depletion
        description: In sepiapterin reductase-deficient DRD (DYT/PARK-SPR), biallelic pathogenic variants
          in SPR block the terminal step of de novo tetrahydrobiopterin (BH4) synthesis and pterin salvage
          in the brain (where alternative aldo-keto/carbonyl reductases cannot compensate as they do in
          peripheral liver), leading to CSF accumulation of sepiapterin and dihydrobiopterin (BH2) and
          dual cofactor starvation of both tyrosine hydroxylase and tryptophan hydroxylase. The resulting
          combined central dopamine and serotonin (5-HIAA) depletion drives levodopa-responsive dystonia,
          frequent oculogyric crises, circadian sleep disturbances, and psychiatric symptoms.
        genes:
        - preferred_term: SPR
          term:
            id: hgnc:11257
            label: SPR
        molecular_functions:
        - preferred_term: sepiapterin reductase (NADP+) activity
          modifier: DECREASED
          term:
            id: GO:0004757
            label: sepiapterin reductase (NADP+) activity
        biological_processes:
        - preferred_term: tetrahydrobiopterin biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0006729
            label: tetrahydrobiopterin biosynthetic process
        - preferred_term: serotonin biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0042427
            label: serotonin biosynthetic process
        chemical_entities:
        - preferred_term: tetrahydrobiopterin
          term:
            id: CHEBI:15372
            label: 5,6,7,8-tetrahydrobiopterin
          modifier: DECREASED
        - preferred_term: serotonin
          term:
            id: CHEBI:28790
            label: serotonin
          modifier: DECREASED
      selected_evidence:
        snippet: The analyte pattern consistent with a diagnosis of SRD includes decreased levels of homovanillic
