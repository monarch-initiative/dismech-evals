        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BH4 Cofactor Limitation
        description: GCH1-associated DRD (and rarer PTS and QDPR forms) reduces tetrahydrobiopterin (BH4)
          biosynthesis or regeneration, limiting cofactor availability for tyrosine hydroxylase and other
          aromatic amino acid hydroxylases and feeding the shared `Striatal Dopamine Biosynthesis Impairment`
          endpoint. Heterozygous GCH1 variants cause partial BH4 deficiency that impairs nigrostriatal
          dopamine synthesis with only transient or phenylalanine-load-induced hyperphenylalaninemia,
          whereas biallelic GCH1, PTS, or QDPR variants cause more severe BH4 depletion accompanied by
          hyperphenylalaninemia.
        genes:
        - preferred_term: GCH1
          term:
            id: hgnc:4193
            label: GCH1
        - preferred_term: PTS
          term:
            id: hgnc:9689
            label: PTS
        - preferred_term: QDPR
          term:
            id: hgnc:9752
            label: QDPR
        biological_processes:
        - preferred_term: tetrahydrobiopterin biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0006729
            label: tetrahydrobiopterin biosynthetic process
        molecular_functions:
        - preferred_term: GTP cyclohydrolase I activity
          modifier: DECREASED
          term:
            id: GO:0003934
            label: GTP cyclohydrolase I activity
        chemical_entities:
        - preferred_term: tetrahydrobiopterin
          term:
            id: CHEBI:15372
            label: 5,6,7,8-tetrahydrobiopterin
          modifier: DECREASED
        - preferred_term: L-phenylalanine
          term:
            id: CHEBI:58095
            label: L-phenylalanine zwitterion
          modifier: INCREASED
      selected_evidence:
        snippet: The GCH1 gene encodes the enzyme guanosine triphosphate cyclohydrolase I (GTPCH), which
          catalyzes the rate-limiting step in the biosynthesis of tetrahydrobiopterin (BH4), a critical
          cofactor in the production of monoamine neurotransmitters.
        supports: SUPPORT
