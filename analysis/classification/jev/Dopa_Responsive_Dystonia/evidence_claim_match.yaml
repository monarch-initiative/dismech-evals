      assertion_type: Pathophysiology
      assertion:
        name: Striatal Dopamine Biosynthesis Impairment
        description: The unifying mechanism across DRD subtypes is reduced dopamine biosynthesis in nigrostriatal
          dopaminergic neurons, either via tetrahydrobiopterin-cofactor limitation (classically GCH1;
          see the `BH4 Cofactor Limitation` subtype-specific node) or via direct loss of tyrosine-hydroxylase
          activity (TH). The reversible neurotransmitter deficit at this shared endpoint accounts for
          the dramatic sustained response to low-dose levodopa that defines the disease group.
        cell_types:
        - preferred_term: dopaminergic neuron
          term:
            id: CL:0000700
            label: dopaminergic neuron
        biological_processes:
        - preferred_term: dopamine biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0042416
            label: dopamine biosynthetic process
        - preferred_term: dopamine biosynthetic process from tyrosine
          modifier: DECREASED
          term:
            id: GO:0006585
            label: dopamine biosynthetic process from tyrosine
        - preferred_term: catecholamine biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0042423
            label: catecholamine biosynthetic process
        chemical_entities:
        - preferred_term: dopamine
          term:
            id: CHEBI:18243
            label: dopamine
          modifier: DECREASED
        - preferred_term: homovanillic acid
          term:
            id: CHEBI:545959
            label: homovanillic acid
          modifier: DECREASED
      selected_evidence:
        snippet: DRD is caused by the mutations in the genes encoding the enzymes involved in the dopamine
          and tetrahydrobiopterin (BH4) biosynthesis, including the GTP cyclohydrolase 1 (GCH1) gene and
          the tyrosine hydroxylase (TH) gene.
        supports: SUPPORT
