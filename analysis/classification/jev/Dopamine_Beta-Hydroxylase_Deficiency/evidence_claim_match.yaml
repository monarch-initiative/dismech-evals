        context: []
      assertion_type: Treatment
      assertion:
        name: Droxidopa
        description: L-threo-3,4-dihydroxyphenylserine (L-DOPS) is decarboxylated by aromatic L-amino
          acid decarboxylase directly to noradrenaline, bypassing DBH. It is taken up by sympathetic neurons
          and released on nerve stimulation, restoring sympathetic control. Doses of 400 to 1800 mg/day
          in 2 to 3 doses (rarely more than 1200 mg) give an almost immediate and sustained response;
          in children 2 mg/kg/day is titrated towards 5 to 10 mg/kg/day. The last dose is taken well before
          bedtime. Plasma noradrenaline rises but seldom normalises, adrenaline mostly stays undetectable,
          and orthostatic hypotension usually persists in milder form. Continuing it in pregnancy appears
          safe on limited data.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: droxidopa
            term:
              id: CHEBI:31524
              label: droxidopa
      selected_evidence:
        snippet: Doses ranged from 400 to 1800 mg/day, given in 2 to 3 doses. For the Dutch cohort, treatment
          follow‐up ranged from 1 to 21 years (median 13 years; Table 2). Treatment response was favorable
          and sustained in all patients
        supports: SUPPORT
