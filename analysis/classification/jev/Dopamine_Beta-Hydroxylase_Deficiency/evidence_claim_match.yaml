      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Untreated patients cannot stand for more than short periods, have very limited exercise
          capacity and suffer recurrent syncope, falls and orthostatic seizures, often misdiagnosed for
          years as epilepsy or other conditions. Droxidopa restores near-normal daily function, so the
          burden is largely one of delayed diagnosis.
      selected_evidence:
        snippet: By early adulthood, individuals have profound orthostatic hypotension, greatly reduced
          exercise tolerance, ptosis, and nasal stuffiness.
        supports: SUPPORT
