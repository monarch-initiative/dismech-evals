      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: renal_dopamine_toxicity
        hypothesis_label: Intracellular tubular dopamine toxicity causes the kidney dysfunction
        status: EMERGING
        description: 'The kidney dysfunction is attributed to toxic dopamine and dopamine metabolites
          in proximal tubular cells. It is proposed on indirect grounds: there is no supine hypertension,
          a single biopsy argued against hypoperfusion injury, and renal function improves only partly
          on droxidopa while dopamine stays high. No study has measured tubular dopamine or oxidative
          injury in patients.'
      selected_evidence:
        snippet: A potential damaging factor to the kidneys, which is quite unique to patients with DBH‐deficiency,
          is the very high level of dopamine intracellularly in the proximal tubular cells.
        supports: SUPPORT
