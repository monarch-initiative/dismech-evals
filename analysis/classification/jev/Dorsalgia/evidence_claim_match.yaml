              label: disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Facet Joint Osteoarthritis
        description: Intervertebral disc narrowing and bulging increase mechanical load on the posterior
          vertebral facet (zygapophyseal) joints, inducing degenerative facet joint osteoarthritis and
          osteophyte protrusion into the vertebral canal and lateral recesses.
        biological_processes:
        - preferred_term: response to mechanical stimulus
          modifier: DYSREGULATED
          term:
            id: GO:0009612
            label: response to mechanical stimulus
        locations:
        - preferred_term: vertebral column
          term:
            id: UBERON:0001130
            label: vertebral column
        - preferred_term: vertebral canal
          term:
            id: UBERON:0006692
            label: vertebral canal
      selected_evidence:
        snippet: The degenerative process of lumbar spinal stenosis leads to disc narrowing and bulging,
          infolding and thickening of the ligamentum flavum as well as facet osteoarthritis10–12. With
          advanced alterations, disc, ligamentum flavum, and facet joints protrude into the spinal canal.
          Increased stresses associated with disc degeneration and narrowing in turn induce in turn facet-joint
          and ligamentum-flavum degeneration. Thus degenerative disc changes may be a critical step in
          the cascade of events leading to lumbar spinal stenosis with its clinical manifestations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
