      assertion:
        category: Nervous System
        name: Mechanical allodynia and pain hypersensitivity
        description: Heightened sensitivity to mechanical stimuli, tactile allodynia, and secondary deep-tissue
          pressure hyperalgesia resulting from peripheral nociceptor sensitization and dorsal horn central
          sensitization in chronic discogenic and radicular low back pain.
        phenotype_term:
          preferred_term: Allodynia
