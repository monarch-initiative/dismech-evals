            description: Structural defects or depletion of type IX collagen (COL9A1, COL9A2, COL9A3)
              and aggrecan (ACAN) destabilize the collagen-proteoglycan network of the intervertebral
              disc and cartilaginous vertebral endplate. Loss of matrix structural integrity suppresses
