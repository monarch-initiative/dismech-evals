  3750c8a8eab2468317f3997241f9a519b75d93aec7b2ef02317e870f6f966fcf:
    claim:
      about:
        disease:
          name: Dorsalgia
          disease_term:
            preferred_term: Dorsalgia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intervertebral Disc Extracellular Matrix Degradation and Endplate Remodeling
        description: Structural defects or depletion of type IX collagen (COL9A1, COL9A2, COL9A3) and
          aggrecan (ACAN) destabilize the collagen-proteoglycan network of the intervertebral disc and
          cartilaginous vertebral endplate. Loss of matrix structural integrity suppresses extracellular
          matrix synthesis, accelerates proteoglycan and collagen catabolism, induces abnormal chondrocyte
          hypertrophy and endplate osteochondral remodeling, and results in annular fissures, disc tears,
          and loss of disc height.
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: hypertrophic chondrocyte
          term:
            id: CL:0000743
            label: hypertrophic chondrocyte
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
