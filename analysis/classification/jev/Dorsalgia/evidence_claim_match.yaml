      assertion:
        target: Nerve Ingrowth and Neoinnervation of the Degenerating Intervertebral Disc
        description: Proteolytic cleavage of chondroitin-sulfate-rich aggrecan and loss of axonal-repellent
          barrier molecules in degenerating discs permit nociceptive nerve fiber and microvessel ingrowth
          into the otherwise aneural inner disc.
      selected_evidence:
        snippet: 'In the healthy state, nerve fiber ingrowth is prevented by the barrier function imparted
          by the high concentration of the chondroitin sulfate component of aggrecan and other matrix
          molecules which are inhibitory to nerve outgrowth85. Noteworthy, during degeneration an increase
          in keratan sulfate: chondroitin sulfate ratio and proteolytic cleavage of aggrecan mediated
          by cytokine dependent ADAMTS4/5 activity may thus enhance nerve invasion27,52.'
        supports: SUPPORT
