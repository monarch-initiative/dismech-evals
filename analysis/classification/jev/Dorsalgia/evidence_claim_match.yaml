  337675b3ead6f5468d048d8e160b8ebec2e39774b9c56f73e49beb453eb1a882:
    claim:
      about:
        disease:
          name: Dorsalgia
          disease_term:
            preferred_term: Dorsalgia
            term:
              id: MONDO:0000001
              label: disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Peripheral and Central Nociceptive Sensitization in Chronic Back Pain
        description: Local mechanical pressure changes and inflammatory mediators in degenerating intervertebral
          discs sensitize peripheral A-delta and C nociceptive fibers, while sustained nociceptive barrage
          into the spinal cord dorsal horn induces a prolonged increase in central neuronal excitability
          and synaptic efficacy (central sensitization). In chronic low back pain and radiating disc herniation,
          this sensitization produces mechanical allodynia, secondary punctate or deep-tissue pressure
          hyperalgesia spreading beyond the primary lesion, and enhanced temporal summation of pain.
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: sensory perception of pain
          modifier: INCREASED
          term:
            id: GO:0019233
            label: sensory perception of pain
        - preferred_term: response to mechanical stimulus
          modifier: INCREASED
          term:
            id: GO:0009612
            label: response to mechanical stimulus
        locations:
        - preferred_term: dorsal horn of spinal cord
          term:
            id: UBERON:0002256
            label: dorsal horn of spinal cord
      selected_evidence:
        snippet: Nociceptor inputs can trigger a prolonged but reversible increase in the excitability
          and synaptic efficacy of neurons in central nociceptive pathways, the phenomenon of central
          sensitization. Central sensitization manifests as pain hypersensitivity, particularly dynamic
          tactile allodynia, secondary punctate or pressure hyperalgesia, aftersensations, and enhanced
          temporal summation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20961685
      reference_title: 'Central sensitization: implications for the diagnosis and treatment of pain.'
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: Defines the mechanism of central nociceptive sensitization and its clinical manifestation
        as tactile allodynia and secondary pressure hyperalgesia.
