        description: Local mechanical pressure changes and inflammatory mediators in degenerating intervertebral
          discs sensitize peripheral A-delta and C nociceptive fibers, while sustained nociceptive barrage
          into the spinal cord dorsal horn induces a prolonged increase in central neuronal excitability
          and synaptic efficacy (central sensitization). In chronic low back pain and radiating disc herniation,
          this sensitization produces mechanical allodynia, secondary punctate or deep-tissue pressure
          hyperalgesia spreading beyond the primary lesion, and enhanced temporal summation of pain.
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
