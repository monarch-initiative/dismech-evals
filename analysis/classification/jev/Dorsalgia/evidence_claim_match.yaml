      assertion:
        target: Intradiscal Nociceptive Neuropeptide Signaling and Primary Afferent Sensitization
        description: Newly ingrown DRG nociceptive fibers exposed to intradiscal NGF, BDNF, and inflammatory
          cytokines upregulate nociceptive neuropeptides (substance P, CGRP) and pain-associated cation
          channels (ASIC3, TRPV1).
      selected_evidence:
        snippet: At this time, NP tissue as well as the infiltrating immune cells continue to release
