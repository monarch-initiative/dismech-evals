        name: Tuberculous Spondylitis (Pott Disease)
        description: Granulomatous vertebral osteomyelitis and spondylodiscitis caused by Mycobacterium
          tuberculosis that presents with progressive lumbar or thoracic back pain and risks vertebral
          collapse, residual spinal deformity, and neurological deficits if diagnosis is delayed.
        distinguishing_features:
        - Subacute-to-chronic lumbar pain unresponsive to routine analgesics, often accompanied by constitutional
          symptoms or epidemiological exposure
        - Contiguous vertebral body destruction, spondylodiscitis, and paraspinal abscess on spinal imaging
          with microbiological/histological confirmation of M. tuberculosis
        disease_term:
          preferred_term: tuberculosis, spinal
          term:
            id: MONDO:0043836
            label: tuberculosis, spinal
      selected_evidence:
        snippet: The involvement of the spine, although rare, can have major consequences if not diagnosed
          and treated in a timely and effective manner, such as residual deformities and neurological
          deficits. On occasion, the atypical presentation of tuberculous spondylitis may cause a delay
          in treatment and therefore lead to less favorable outcomes.
        supports: SUPPORT
