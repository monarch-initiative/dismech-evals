        name: Non-committed VSD
        subtype_term:
          preferred_term: double outlet right ventricle with non-committed subpulmonary ventricular septal
            defect
          term:
            id: MONDO:0020388
            label: double outlet right ventricle with non-committed subpulmonary ventricular septal defect
        display_name: DORV with non-committed (remote) ventricular septal defect
        description: 'The interventricular communication lies outside the limbs of the septomarginal trabeculation,
          typically in the inlet or apical trabecular septum, and is therefore remote from both arterial
          roots. This is the most surgically difficult subtype: a baffle must traverse a long, tortuous
          course at risk of obstructing the tricuspid valve apparatus or the right ventricular outflow
          tract, so VSD enlargement, multiple patches, root translocation, or staged single-ventricle
          palliation are often required.'
      selected_evidence:
        snippet: Non-committed defects are no longer positioned within the limbs of the septomarginal
          trabeculation.
        supports: SUPPORT
