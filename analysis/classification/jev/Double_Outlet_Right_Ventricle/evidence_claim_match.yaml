        context: []
      assertion_type: Treatment
      assertion:
        name: Arterial switch operation with VSD-to-pulmonary-root baffle
        description: The preferred anatomic repair for the Taussig-Bing (subpulmonary VSD) form, and also
          used for selected non-committed VSDs. The ventricular septal defect is baffled to the pulmonary
          root, which then becomes the neo-aorta after the great arteries are transected and switched
          with coronary transfer, so the intraventricular tunnel is short and does not impinge on the
          tricuspid valve. Concomitant aortic arch repair is required in a large minority. In the largest
          reported single-centre series (225 children) early mortality was 12.9 per cent with 10-year
          survival of 85 per cent; a smaller 34-patient series reported 11 per cent hospital mortality.
          Reintervention, most often for pulmonary stenosis, is common.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Cardiac Surgery
          term:
            id: NCIT:C157806
            label: Cardiac Surgery
      selected_evidence:
        snippet: this is the most common surgical repair when the pulmonary valve is suitable for systemic
          circulation
        supports: SUPPORT
