  8ce0f7c6ad434322aa87e0f6791400a0df980e83c26b0b06538fe893939520e6:
    claim:
      about:
        disease:
          name: Double Outlet Right Ventricle
          disease_term:
            preferred_term: double outlet right ventricle
            term:
              id: MONDO:0018089
              label: double outlet right ventricle
        context: []
      assertion_type: Treatment
      assertion:
        name: Rastelli-type repair with right ventricle to pulmonary artery conduit
        description: When pulmonary outflow obstruction is valvar and the pulmonary valve cannot support
          the systemic circulation, the ventricular septal defect is baffled to the aorta and right ventricle
          to pulmonary artery continuity is restored with a valved conduit (Rastelli) or, in the REV variant,
          by direct anastomosis of the pulmonary trunk to the infundibulum after a LeCompte manoeuvre.
          Somatic outgrowth and stenosis of the conduit make reoperation predictable, and Rastelli-type
          repair carries higher late mortality and reintervention risk than other pathways.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Cardiac Surgery
          term:
            id: NCIT:C157806
            label: Cardiac Surgery
      selected_evidence:
        snippet: For complex double-outlet right ventricle, Rastelli-type repair increased early reintervention
          risk (P = .04) and late post-repair mortality (P = .02), whereas the arterial switch operation
          increased early post-repair mortality (P = .02) with a benefit of improved late post-repair
          survival.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/6
      evidence_path: /treatments/6/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17903515
      reference_title: Determinants of repair type, reintervention, and mortality in 393 children with
        double-outlet right ventricle.
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the reintervention and late mortality penalty of Rastelli-type repair relative
        to the arterial switch in complex DORV.
