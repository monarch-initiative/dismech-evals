          term:
            id: MONDO:0018498
            label: double outlet right ventricle with subaortic or doubly committed ventricular septal
              defect
        display_name: DORV with doubly committed (juxta-arterial) ventricular septal defect
        description: The rarest positional subtype. The outlet septum is deficient or fibrous and attaches
          to the inner heart curvature in the roof of the defect, so the interventricular communication
          lies immediately beneath both semilunar valves, which are in fibrous continuity with one another.
          An intraventricular tunnel is still feasible but usually requires a right ventriculotomy or
          transpulmonary approach because the baffle must be anchored to the fibrous tissue between the
          aortic and pulmonary annuli, with a risk of semilunar valve distortion.
      selected_evidence:
        snippet: The defect is subaortic when the outlet septum is attached to the cranial limb of the
          trabeculation, subpulmonary when attached to the caudal limb, and doubly committed when attached
          to the inner heart curvature in the roof of the defect.
