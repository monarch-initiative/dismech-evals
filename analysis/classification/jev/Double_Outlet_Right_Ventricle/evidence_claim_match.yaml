        context: []
      assertion_type: Subtype
      assertion:
        name: Subaortic VSD
        subtype_term:
          preferred_term: double outlet right ventricle with subaortic or doubly committed ventricular
            septal defect
          term:
            id: MONDO:0018498
            label: double outlet right ventricle with subaortic or doubly committed ventricular septal
              defect
        display_name: DORV with subaortic ventricular septal defect (VSD type)
        description: 'The most common form. The outlet septum attaches to the cranial (anterosuperior)
          limb of the septomarginal trabeculation, so the interventricular communication lies beneath
          the aortic root. Left ventricular blood streams preferentially to the aorta, giving a physiology
          resembling a large isolated ventricular septal defect: relatively well-saturated systemic flow
          with pulmonary overcirculation and congestive heart failure when pulmonary stenosis is absent.
          Repair is typically a straightforward intraventricular baffle tunnelling the left ventricle
          through the VSD to the aortic valve.'
      selected_evidence:
        snippet: The defect is subaortic when the outlet septum is attached to the cranial limb of the
          trabeculation, subpulmonary when attached to the caudal limb, and doubly committed when attached
          to the inner heart curvature in the roof of the defect.
        supports: SUPPORT
