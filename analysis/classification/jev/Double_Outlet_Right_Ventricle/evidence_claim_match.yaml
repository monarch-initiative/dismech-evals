  f03596086e1a87286f5a057464034a11ebc88adfc0a6c045fec1f7c6880fc550:
    claim:
      about:
        disease:
          name: Double Outlet Right Ventricle
          disease_term:
            preferred_term: double outlet right ventricle
            term:
              id: MONDO:0018089
              label: double outlet right ventricle
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disturbed Left-Right Patterning and Cardiac Looping
        role: trigger
        biological_scale: TISSUE
        description: A distinct upstream route to DORV runs through the left-right organiser. Motile monocilia
          at the embryonic node generate leftward flow that establishes the NODAL laterality cascade;
          failure of this step randomises cardiac looping and the spatial relationship of the great arteries.
          This is the mechanism behind Van Praagh type III DORV, the form associated with heterotaxy and
          atrial isomerism, and explains why laterality genes (ZIC3, CFC1, FOXJ1, NODAL-pathway genes)
          recur in DORV cohorts. Because a randomised or abnormal loop misplaces the ventricles relative
          to the arterial poles, it produces the same double-outlet connection by a different developmental
          route than a primary neural-crest defect.
        biological_processes:
        - preferred_term: determination of left/right symmetry
          modifier: ABNORMAL
          term:
            id: GO:0007368
            label: determination of left/right symmetry
        - preferred_term: heart looping
          modifier: ABNORMAL
          term:
            id: GO:0001947
            label: heart looping
        - preferred_term: cilium movement
          modifier: DECREASED
          term:
            id: GO:0003341
            label: cilium movement
      selected_evidence:
        snippet: Since Van Praagh type III DORV is associated with heterotaxy
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37818164
      reference_title: Double outlet right ventricle.
      evidence_source: OTHER
      explanation: Establishes the heterotaxy-associated (laterality) aetiologic class of DORV; PARTIAL
        because the source goes on to frame the specific laterality genes as predicted candidates rather
