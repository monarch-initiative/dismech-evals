          allows a torrential left-to-right shunt through the ventricular septal defect and into the pulmonary
          artery. The resulting pulmonary overcirculation produces tachypnoea, feeding difficulty and
          failure to thrive within the first weeks of life, ventricular volume overload and congestive
          heart failure, and, if repair is delayed beyond infancy, progressive pulmonary vascular remodelling
          and irreversible pulmonary arterial hypertension. This is the rationale for completing biventricular
          repair within the first six months of life or, when repair must be deferred, for interim pulmonary
          artery banding.
