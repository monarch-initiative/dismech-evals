    claim:
      about:
        disease:
          name: Double Outlet Right Ventricle
          disease_term:
            preferred_term: double outlet right ventricle
            term:
              id: MONDO:0018089
              label: double outlet right ventricle
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiovascular magnetic resonance
        description: Cardiovascular magnetic resonance is the reference modality for the three-dimensional
          geometry that determines whether DORV can be repaired biventricularly. Preoperatively it resolves
          the spatial relationship between the ventricular septal defect and the two arterial roots, which
          is the information required to decide whether an unobstructed intraventricular baffle can be
          constructed and to plan its course; CMR datasets are the input to virtual, 3D-printed and virtual-reality
          baffle-planning models, which are used preoperatively to test whether an unobstructed baffle
          pathway can actually be constructed and therefore to predict candidacy for biventricular repair.
          It also supplies biventricular volumes and function and, with 2D and 4D flow, quantifies outflow
          tract dimensions and shunt haemodynamics, all without ionising radiation. Postoperatively it
          is used for surveillance of late structural and functional complications such as baffle obstruction,
          conduit and outflow tract disease and ventricular dysfunction. Its limitations in this population
          are long acquisition times, the need for breath-holding or anaesthesia in young children, and
          non-conditional implanted devices.
      selected_evidence:
        snippet: Preoperative imaging is a critical tool for assessing the feasibility of a biventricular
          repair and for envisioning the potential baffle pathway.
        supports: SUPPORT
    origin:
