            term:
              id: MONDO:0018089
              label: double outlet right ventricle
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Tetralogy of Fallot
        description: 'Tetralogy of Fallot and DORV are not cleanly separable entities: they share a developmental
          origin in the second heart field and cardiac neural crest, and the boundary between "tetralogy
          with an overriding aorta" and "DORV with a subaortic or doubly committed VSD and pulmonary stenosis"
          is set by an arbitrary degree of aortic override rather than by a difference in mechanism. The
          DORV-Fallot subtype of this entry occupies exactly that overlap, and its physiology and repair
          (VSD-to-aorta baffle with relief of right ventricular outflow tract obstruction) are those of
          tetralogy. Overlap can be complete: tetralogy with pulmonary atresia and a single outlet from
          the right ventricle also satisfies the morphologic definition of DORV.'
        disease_term:
          preferred_term: tetralogy of Fallot
          term:
            id: MONDO:0008542
            label: tetralogy of fallot
        distinguishing_features:
        - Degree of aortic override is the operative discriminator; commonly a 50 per cent threshold is
          applied, but the threshold is conventional rather than mechanistic and different groups apply
          it differently.
        - Aortic-to-mitral fibrous continuity is classically retained in tetralogy and classically lost
          in DORV, but this criterion is unreliable because DORV with preserved arterial-to-atrioventricular
          valvar continuity is the more common form of DORV.
        - Bilateral (subaortic and subpulmonary) infundibula favour DORV; a single subpulmonary infundibulum
          with a resorbed subaortic conus favours tetralogy.
        - The distinction does not change the operation when the VSD is subaortic and pulmonary stenosis
          is present, which is why DORV-Fallot outcomes track tetralogy outcomes.
        notes: Because the boundary is conventional, the practical curation position taken in this entry
          is that VSD position and the presence of outflow tract obstruction, not the tetralogy-versus-DORV
          label, determine physiology and the surgical route.
      selected_evidence:
        snippet: One example would be TOF with DORV and pulmonary atresia.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37818164
      reference_title: Double outlet right ventricle.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents that a heart can simultaneously satisfy the tetralogy and the DORV definitions,
        demonstrating that the two categories overlap rather than exclude one another.
