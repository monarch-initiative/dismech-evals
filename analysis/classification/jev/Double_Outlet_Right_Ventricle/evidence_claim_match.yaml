            term:
              id: MONDO:0018089
              label: double outlet right ventricle
        context: []
      assertion_type: Treatment
      assertion:
        name: Intraventricular baffle repair
        description: 'The standard biventricular repair for a committed ventricular septal defect: a patch
          tunnel is constructed from the left ventricle through the VSD to the aortic valve, restoring
          a series circulation. For a perimembranous or subaortic defect the tunnel is relatively straight
          and can usually be built through the right atrium; for a doubly committed defect a right ventriculotomy
          or transpulmonary approach is generally required. A restrictive VSD is enlarged by resecting
          the ventriculo-infundibular fold and conal septum to prevent late subaortic obstruction. Repair
          is recommended within the first six months of life to limit the effects of pulmonary overcirculation.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Cardiac Surgery
          term:
            id: NCIT:C157806
            label: Cardiac Surgery
      selected_evidence:
        snippet: When the VSD is perimembranous or subaortic, a relatively straight intraventricular tunnel
          can be created between the VSD and the aortic valve
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/0
      context_paths:
