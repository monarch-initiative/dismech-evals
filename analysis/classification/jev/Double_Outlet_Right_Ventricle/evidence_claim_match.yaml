      assertion_type: Genetic
      assertion:
        name: Chromosomal aneuploidy and copy number variation
        association: Chromosomal abnormality
        relationship_type: SUSCEPTIBILITY
        notes: More than 40 per cent of patients with DORV carry an associated chromosomal abnormality,
          and most of these also have extracardiac defects. Trisomy 13, trisomy 18 and 22q11.2 deletion
          are the most commonly associated cytogenetic lesions, and the anatomic subtype of DORV differs
          between the trisomies and 22q11.2 deletion. Chromosome 8 abnormalities, Cri-du-chat (5p15.2
          deletion) and Jacobsen (11q terminal deletion) syndromes have also been reported. Chromosomal
          microarray is therefore first-line testing in complex or syndromic DORV.
      selected_evidence:
        snippet: Chromosomal abnormalities were present in 61 of the 149 cases of DORV. Trisomies 13 and
          18, and del 22q11 were the most commonly associated cytogenetic lesions; different anatomic
          subtypes of DORV were noted in trisomies 13 and 18 versus del 22q11.
        supports: SUPPORT
