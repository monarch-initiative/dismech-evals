  61d8790f6e878291b272e3c6762720037be4db1bb3bc671c5e59c41137328632:
    claim:
      about:
        disease:
          name: Double Outlet Right Ventricle
          disease_term:
            preferred_term: double outlet right ventricle
            term:
              id: MONDO:0018089
              label: double outlet right ventricle
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Outlet Septum Attachment Determines VSD Commitment
        role: effector
        biological_scale: TISSUE
        description: 'Because both arterial trunks are supported by the right ventricle, the outlet septum
          is itself a right ventricular structure, and the channel between the ventricles is roofed by
          the inner heart curvature. It is therefore the attachment of the outlet septum, muscular or
          fibrous, that determines to which subarterial outlet the interventricular communication is committed:
          the cranial limb of the septomarginal trabeculation gives a subaortic defect, the caudal limb
          a subpulmonary defect, and the inner heart curvature a doubly committed defect, while defects
          lying outside the limbs of the trabeculation are non-committed. This single anatomic variable,
          rather than the DORV label, determines the streaming physiology and the repair strategy.'
        locations:
        - preferred_term: interventricular septum
          term:
            id: UBERON:0002094
            label: interventricular septum
      selected_evidence:
        snippet: when both arterial trunks arise exclusively or predominantly from the morphologically
          right ventricle, the outlet septum, of necessity, is itself a right ventricular structure
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
