  33a6da7a56f701ab02b396360a3d44f439eed9996d85936c00c3675a547bca75:
    claim:
      about:
        disease:
          name: Double Outlet Right Ventricle
          disease_term:
            preferred_term: double outlet right ventricle
            term:
              id: MONDO:0018089
              label: double outlet right ventricle
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dorv_genotype_to_morphology_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cardiac Neural Crest and Second Heart Field Disruption
        - pathophysiology#Outlet Septum Attachment Determines VSD Commitment
        prompt: By what mechanism does a given genetic lesion or teratogenic exposure convert normal outflow
          tract morphogenesis into the specific DORV subtype it produces, and what determines whether
          the resulting ventricular septal defect is subaortic, subpulmonary, doubly committed or non-committed?
        rationale: 'The pathophysiology modelled in this entry describes a coherent developmental chain
          from neural crest and second-heart-field disruption to the double-outlet connection, and the
          literature reliably associates particular aetiologies with particular anatomic subtypes (trisomy
          13/18 versus 22q11.2 deletion produce different DORV subtypes). What is missing is the mechanistic
          bridge: no source explains how a specific lesion selects a specific outlet-septum attachment
          and therefore a specific VSD commitment. Because VSD position, not the DORV label, determines
          physiology and repair, this gap sits directly between the genetics and the clinically actionable
          anatomy.'
        proposed_experiments:
        - experiment_id: dorv_allelic_series_oft_transcriptomics
          name: Lineage-resolved transcriptomics of the outflow tract across DORV alleles
          description: Single-cell and spatial transcriptomics of the murine outflow tract across a panel
            of DORV-producing alleles (Lrp1, Shroom3, Foxj1, Tbx1), staged through conal rotation, to
            test whether each lesion perturbs a distinct progenitor compartment rather than converging
            on one.
          decision_criterion: Allele-specific perturbation of distinct neural-crest versus second-heart-field
            compartments would show that the developmental route, not just the endpoint, differs by aetiology.
        - experiment_id: dorv_outlet_septum_morphometry
          name: Three-dimensional morphometry of outlet septum attachment
          description: Quantitative three-dimensional morphometry of outlet-septum attachment across the
            same allelic series, testing whether attachment site predicts the resulting ventricular septal
            defect commitment.
          decision_criterion: A reproducible mapping from allele to attachment site to VSD commitment
            would supply the missing mechanistic bridge between genotype and the clinically actionable
            anatomy.
        - experiment_id: dorv_genotype_subtype_cohort
          name: Genotype-to-subtype association in a uniformly classified DORV cohort
          description: Genotype-to-subtype association analysis in a large clinically phenotyped DORV
            cohort with uniform ISNPCHD anatomic classification and trio genome sequencing.
          decision_criterion: Significant association between specific genomic lesions and specific VSD
            positions would confirm in humans the genotype-to-morphology relationship suggested by the
            trisomy 13/18 versus 22q11.2 subtype difference.
      selected_evidence:
        snippet: genetic anomalies or environmental exposures result in the development of DORV from normal
          structural cardiac anatomy are unknown
        supports: SUPPORT
