        association: X-linked laterality defect with isolated DORV
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: ZIC3, the X-linked laterality gene classically causing heterotaxy with complex congenital
          heart disease, is also mutated in a small subset of patients with apparently isolated DORV,
          placing those cases within the laterality-defect spectrum. In a screen of 89 DORV probands a
          missense variant (c.49G>T, p.Gly17Cys) was identified in a female with isolated DORV. The authors
          describe the variants as potentially disease-related and performed functional validation only
          on the separate heterotaxy variant, so this locus is typed as a susceptibility rather than an
          established causative gene for DORV.
      selected_evidence:
        snippet: ZIC3 mutations were rarely identified in isolated DORV and d-TGA suggesting that a subset
          of DORV and d-TGA may fall within the spectrum of laterality defects.
