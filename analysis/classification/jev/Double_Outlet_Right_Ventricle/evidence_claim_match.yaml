  4bcb6e15c498f3537984a52181fa342fd9a113fda7671d473fb47d8b23064302:
    claim:
      about:
        disease:
          name: Double Outlet Right Ventricle
          disease_term:
            preferred_term: double outlet right ventricle
            term:
              id: MONDO:0018089
              label: double outlet right ventricle
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Dextro-looped transposition of the great arteries with ventricular septal defect
        description: 'd-TGA with a VSD is the principal differential for the subpulmonary (Taussig-Bing)
          subtype, because both produce transposition-like physiology in the newborn: the aorta receives
          desaturated right ventricular blood and the pulmonary artery receives the oxygenated left ventricular
          stream. The distinction is one of ventriculo-arterial connection. In d-TGA both connections
          are discordant, whereas in DORV the aorta is discordant but the pulmonary artery remains concordant
          with the right ventricle. Where the pulmonary valve overrides the septal crest, the assignment
          turns on how much of the valve sits over each ventricle, so the same heart may be called Taussig-Bing
          DORV or d-TGA with an overriding pulmonary artery depending on the override threshold used.'
        disease_term:
          preferred_term: dextro-looped transposition of the great arteries
          term:
            id: MONDO:0019443
            label: dextro-looped transposition of the great arteries
        distinguishing_features:
        - In d-TGA both ventriculo-arterial connections are discordant; in DORV the aorta is discordant
          while the pulmonary artery is concordant.
        - When the pulmonary valve overrides, the lesion is called d-TGA if more than half the valve sits
          above the morphologic left ventricle, and Taussig-Bing DORV if more than half sits above the
          right ventricle.
        - Pulmonary-to-mitral fibrous continuity is present in d-TGA with a perimembranous VSD and an
          overriding pulmonary artery, and absent in the Taussig-Bing malformation.
        - Both are treated by an arterial switch, but the Taussig-Bing variant additionally requires a
          baffle routing the VSD to the pulmonary root and carries a high burden of aortic arch obstruction
          and coronary anomaly.
      selected_evidence:
        snippet: In contrast, in DORV, the aorta has a discordant connection while the PA has a concordant
          connection.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
