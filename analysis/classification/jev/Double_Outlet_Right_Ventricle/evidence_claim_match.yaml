        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Persistence of the Subaortic Conus
        role: mediator
        biological_scale: TISSUE
        description: 'In the normal heart the subpulmonary conus persists while the subaortic conal free
          wall resorbs, allowing the aortic valve to descend into fibrous continuity with the mitral valve.
          In DORV the subaortic conus characteristically persists, producing bilateral (subaortic and
          subpulmonary) infundibula and abolishing aorto-mitral fibrous continuity, so the aortic root
          remains elevated on a muscular sleeve above the right ventricle. This is the conal basis of
          the classical "50% rule": what is really being measured is whether conal muscle still interposes
          between the arterial root and the left ventricle. The criterion is not absolute, because DORV
          also occurs with fibrous continuity between the arterial and atrioventricular valves, so bilateral
          conus is sufficient but not necessary for the diagnosis.'
        biological_processes:
        - preferred_term: conus arteriosus morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003239
            label: conus arteriosus morphogenesis
        - preferred_term: outflow tract septum morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003148
            label: outflow tract septum morphogenesis
        locations:
        - preferred_term: conus arteriosus
          term:
            id: UBERON:0003983
            label: conus arteriosus
        - preferred_term: mitral valve
          term:
            id: UBERON:0002135
            label: mitral valve
      selected_evidence:
        snippet: Normally, the subaortic conus resorbs and brings the aorta in continuity with the mitral
          valve
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
