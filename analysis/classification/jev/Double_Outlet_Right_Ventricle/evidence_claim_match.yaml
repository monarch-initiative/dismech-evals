      assertion_type: Inheritance
      assertion:
        name: Multifactorial and sporadic
        inheritance_term:
          preferred_term: Non-Mendelian inheritance
          term:
            id: HP:0001426
            label: Non-Mendelian inheritance
        description: Most DORV is sporadic and multifactorial, arising from a combination of rare and
          common variation, developmental stochasticity and maternal or environmental influences. More
          than 40 per cent of patients nevertheless carry a chromosomal abnormality, most commonly trisomy
          13, trisomy 18 or a 22q11.2 deletion, and recurrence counselling should be based on the identified
          syndrome or gene when one is found.
      selected_evidence:
        snippet: Chromosomal abnormalities were present in 61 of the 149 cases of DORV. Trisomies 13 and
          18, and del 22q11 were the most commonly associated cytogenetic lesions; different anatomic
          subtypes of DORV were noted in trisomies 13 and 18 versus del 22q11.
        supports: SUPPORT
