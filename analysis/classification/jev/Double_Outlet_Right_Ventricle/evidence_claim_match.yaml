        name: Subpulmonary VSD
        subtype_term:
          preferred_term: double outlet right ventricle with subpulmonary ventricular septal defect
          term:
            id: MONDO:0020387
            label: double outlet right ventricle with subpulmonary ventricular septal defect
        display_name: DORV with subpulmonary VSD (Taussig-Bing anomaly, TGA type)
        description: The Taussig-Bing anomaly. The outlet septum attaches to the caudal (posteroinferior)
          limb of the septomarginal trabeculation, placing the interventricular communication beneath
          the pulmonary root, with the pulmonary valve overriding the crest of the ventricular septum
          by more than 50% and bilateral conus. Left ventricular blood streams preferentially into the
          pulmonary artery while systemic venous return is directed to the aorta, so the physiology is
          transposition-like with early severe cyanosis. Aortic arch obstruction (coarctation or interrupted
          arch) and coronary anomalies are frequent. Repair is an arterial switch operation combined with
          a VSD-to-pulmonary-root baffle, with concomitant arch repair when needed.
      selected_evidence:
        snippet: The defect is subaortic when the outlet septum is attached to the cranial limb of the
          trabeculation, subpulmonary when attached to the caudal limb, and doubly committed when attached
          to the inner heart curvature in the roof of the defect.
        supports: SUPPORT
