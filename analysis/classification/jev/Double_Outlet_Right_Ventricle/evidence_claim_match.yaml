      assertion_type: Treatment
      assertion:
        name: Rastelli-type repair with right ventricle to pulmonary artery conduit
        description: When pulmonary outflow obstruction is valvar and the pulmonary valve cannot support
          the systemic circulation, the ventricular septal defect is baffled to the aorta and right ventricle
          to pulmonary artery continuity is restored with a valved conduit (Rastelli) or, in the REV variant,
          by direct anastomosis of the pulmonary trunk to the infundibulum after a LeCompte manoeuvre.
          Somatic outgrowth and stenosis of the conduit make reoperation predictable, and Rastelli-type
          repair carries higher late mortality and reintervention risk than other pathways.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Cardiac Surgery
          term:
            id: NCIT:C157806
            label: Cardiac Surgery
      selected_evidence:
        snippet: 'The Rastelli procedure: It is one that includes closing the VSD to the aorta and placing
          a valved RV to PA conduit for RVOT reconstruction.'
        supports: SUPPORT
