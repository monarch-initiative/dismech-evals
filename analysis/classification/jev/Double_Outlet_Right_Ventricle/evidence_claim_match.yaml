      assertion_type: Pathophysiology
      assertion:
        name: Outlet Septum Malalignment and Outflow Tract Obstruction
        role: consequence
        biological_scale: TISSUE
        description: The muscular outlet septum partitions the two infundibula, and its displacement into
          either outflow tract creates subvalvar obstruction. Deviation into the subpulmonary outflow
          produces subpulmonary and pulmonary stenosis, the lesion that gives a subaortic-VSD heart its
          Fallot-type physiology. Deviation into the subaortic outflow, or a subpulmonary VSD that diverts
          fetal left ventricular flow away from the systemic outlet, produces subaortic stenosis and is
          associated with hypoplasia of the aortic arch, coarctation and interrupted aortic arch, the
          lesions that dominate the Taussig-Bing anomaly. Chronic obstruction to right ventricular ejection
          also drives right ventricular hypertrophy.
        locations:
        - preferred_term: outflow tract
          term:
            id: UBERON:0004145
            label: outflow tract
        - preferred_term: aorta
          term:
            id: UBERON:0000947
            label: aorta
      selected_evidence:
        snippet: The displacement of this outlet septum into the aortic or pulmonary out
        supports: SUPPORT
