      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Neural Crest and Second Heart Field Disruption
        role: trigger
        biological_scale: CELLULAR
        description: DORV originates in the two extracardiac progenitor populations that build the cardiac
          outflow tract. Cardiac neural crest cells delaminate from the dorsal neural tube, migrate through
          the caudal pharyngeal arches into the distal outflow tract and condense to form the aorticopulmonary
          septum, while second-heart-field progenitors are added to the arterial pole and provide the
          myocardium that elongates and rotates the outflow tract. Genetic lesions (chromosomal, transcription-factor,
          planar-cell-polarity, ciliary) and teratogenic exposures that perturb neural crest migration
          or second-heart-field addition converge on this step. DORV and tetralogy of Fallot are the two
          conotruncal phenotypes that most directly report this disturbance.
        cell_types:
        - preferred_term: migratory cardiac neural crest cell
          term:
            id: CL:2000073
            label: migratory cardiac neural crest cell
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: cardiac neural crest cell migration involved in outflow tract morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003253
            label: cardiac neural crest cell migration involved in outflow tract morphogenesis
        - preferred_term: cardiac neural crest cell development involved in outflow tract morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0061309
            label: cardiac neural crest cell development involved in outflow tract morphogenesis
        locations:
        - preferred_term: outflow tract
          term:
            id: UBERON:0004145
            label: outflow tract
      selected_evidence:
        snippet: Tetralogy of Fallot (TOF) and double-outlet right ventricle (DORV) are conotruncal defects
          resulting from disturbances of the second heart field and the neural crest, which can occur
          as isolated malformations or as part of multiorgan syndromes.
        supports: SUPPORT
