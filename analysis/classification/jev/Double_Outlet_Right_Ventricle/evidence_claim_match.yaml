          term:
            id: MONDO:0020386
            label: double outlet right ventricle with subaortic or doubly committed ventricular septal
              defect with pulmonary stenosis
        display_name: DORV with subaortic or doubly committed VSD and pulmonary stenosis (Fallot type)
        description: 'A physiologic variant of the committed-VSD forms in which pulmonary stenosis accompanies
          a subaortic or doubly committed ventricular septal defect. Because the outlet septum is deviated
          anterosuperiorly into the subpulmonary outflow, the physiology and surgical logic mirror tetralogy
          of Fallot: cyanosis rather than overcirculation, hypercyanotic spells, and repair combining
          an intraventricular baffle to the aorta with relief of right ventricular outflow tract obstruction.'
      selected_evidence:
        snippet: A subaortic VSD may mean that pulmonary stenosis and small branch pulmonary arteries
          are likely to develop.
        supports: SUPPORT
