        context: []
      assertion_type: Treatment
      assertion:
        name: Nikaidoh procedure and root translocation
        description: Posterior translocation of the aortic root, or double root translocation, creates
          a straight left ventricular outflow tract when routing the VSD to the aorta is not possible
          or would require a long akinetic tunnel at risk of late subaortic stenosis. It is favoured for
          remote ventricular septal defects, straddling atrioventricular valves and significant right
          ventricular hypoplasia. A pulmonary annulus smaller than 5 mm and a coronary artery crossing
          the right ventricular outflow tract at the transection level are contraindications.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Cardiac Surgery
          term:
            id: NCIT:C157806
            label: Cardiac Surgery
      selected_evidence:
        snippet: we do not offer a Nikaidoh procedure to patients with a pulmonary annulus size of less
          than 5 mm
        supports: SUPPORT
    origin:
