        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Outflow Tract Rotation and Alignment
        role: mediator
        biological_scale: TISSUE
        description: Normally the arterial pole rotates during looping so the aorta swings rightward and
          posteriorly over the left ventricle while the pulmonary trunk is displaced anteriorly and leftward.
          This rotation is driven in part by asymmetric addition of second-heart-field myocardium at the
          pulmonary side of the outflow tract, which pushes the pulmonary orifice into a higher, more
          frontal position relative to the aortic orifice (the "pulmonary push"). Deficient or disorganised
          right ventricular outflow tract expansion leaves the rotation incomplete, so the aortic root
          is never transferred across the ventricular septum and remains supported by the right ventricle.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: outflow tract morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003151
            label: outflow tract morphogenesis
        locations:
        - preferred_term: outflow tract
          term:
            id: UBERON:0004145
            label: outflow tract
      selected_evidence:
        snippet: We postulate that normally the pulmonary trunk and orifice are pushed in a higher and
          more frontal position relative to the aortic orifice by asymmetric addition of SHF-myocardium.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
