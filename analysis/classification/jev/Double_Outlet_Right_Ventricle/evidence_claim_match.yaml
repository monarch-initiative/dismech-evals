      assertion:
        name: FOXJ1
        gene_term:
          preferred_term: FOXJ1
          term:
            id: hgnc:3816
            label: FOXJ1
        association: Motile ciliopathy gene causing isolated congenital heart defects
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: FOXJ1 is the master transcriptional regulator of motile ciliogenesis, including the cilia
          of the embryonic left-right organiser. A truncating FOXJ1 variant (c.784_799dup; p.Glu267Glyfs*12)
          was identified by clinical exome sequencing in a patient with isolated congenital heart defects
          comprising atrial and ventricular septal defects, DORV and transposition of the great arteries.
          The variant failed to induce ectopic cilia in vivo or to transactivate a downstream ciliary
          target, and Foxj1 loss-of-function mice show randomised heart looping with DORV. FOXJ1 variants
          are nevertheless an infrequent cause of heterotaxy or heterotaxy-related congenital heart disease.
          The relationship is typed CAUSATIVE for the reported proband, but rests on a single family with
          functional support rather than on an established gene-disease association for DORV as a whole.
      selected_evidence:
        snippet: Here, we report a novel truncating FOXJ1 variant (c.784_799dup; p.Glu267Glyfs*12) identified
          by clinical exome sequencing from a patient with isolated congenital heart defects (CHD) which
          included atrial and ventricular septal defects, double outlet right ventricle (DORV) and transposition
          of the great arteries.
        supports: SUPPORT
