      assertion_type: Pathophysiology
      assertion:
        name: Left Ventricular Hypoplasia and Loss of Biventricular Repair Substrate
        role: outcome
        biological_scale: TISSUE
        description: 'When the interventricular communication is restrictive, remote from both arterial
          roots, or absent, fetal left ventricular filling and ejection are reduced and the left ventricle
          fails to grow. The same anatomic circumstances that limit left ventricular growth, together
          with straddling or hypoplastic atrioventricular valves and multiple ventricular septal defects,
          also make an unobstructed intraventricular baffle impossible. This node is therefore the hinge
          on which the entire management pathway turns: it converts DORV from a biventricular repair problem
          into a single-ventricle palliation problem.'
        locations:
        - preferred_term: heart left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
      selected_evidence:
        snippet: the LV will show an element of hypoplasia, which can vary from mild to severe
        supports: SUPPORT
