          DORV or d-TGA with an overriding pulmonary artery depending on the override threshold used.'
        disease_term:
          preferred_term: dextro-looped transposition of the great arteries
          term:
            id: MONDO:0019443
            label: dextro-looped transposition of the great arteries
        distinguishing_features:
        - In d-TGA both ventriculo-arterial connections are discordant; in DORV the aorta is discordant
          while the pulmonary artery is concordant.
        - When the pulmonary valve overrides, the lesion is called d-TGA if more than half the valve sits
          above the morphologic left ventricle, and Taussig-Bing DORV if more than half sits above the
          right ventricle.
        - Pulmonary-to-mitral fibrous continuity is present in d-TGA with a perimembranous VSD and an
          overriding pulmonary artery, and absent in the Taussig-Bing malformation.
        - Both are treated by an arterial switch, but the Taussig-Bing variant additionally requires a
          baffle routing the VSD to the pulmonary root and carries a high burden of aortic arch obstruction
          and coronary anomaly.
      selected_evidence:
        snippet: In TGA with a perimembranous VSD and overriding PA, the pulmonary –mitral continuity
          is present, whereas in the Taussig –Bing malformation, the pulmonary–mitral continuity is absent.
        supports: SUPPORT
