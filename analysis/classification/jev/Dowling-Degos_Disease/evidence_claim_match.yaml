      assertion_type: Pathophysiology
      assertion:
        name: Basal Keratinocyte Keratin 5 Haploinsufficiency
        description: Heterozygous loss-of-function variants in KRT5 reduce keratin 5 available for the
          basal keratinocyte intermediate-filament cytoskeleton. Functional studies implicate keratins
          in cell adhesion, melanosome uptake, organelle transport, and nuclear anchorage, so KRT5 haploinsufficiency
          is thought to disturb epidermal architecture and melanosome handling, producing the characteristic
          reticulate hyperpigmentation.
        genes:
        - preferred_term: KRT5
          term:
            id: hgnc:6442
            label: KRT5
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: melanocyte
          term:
            id: CL:0000148
            label: melanocyte
        cellular_components:
        - preferred_term: keratin filament
          term:
            id: GO:0045095
            label: keratin filament
        - preferred_term: melanosome
          term:
            id: GO:0042470
            label: melanosome
      selected_evidence:
        snippet: The identification of loss-of-function mutations, along with the results from additional
          functional studies, suggest a crucial role for keratins in the organization of cell adhesion,
          melanosome uptake, organelle transport, and nuclear anchorage.
        supports: SUPPORT
