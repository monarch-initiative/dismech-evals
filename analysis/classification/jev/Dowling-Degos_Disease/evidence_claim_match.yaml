        description: POFUT1 and POGLUT1 add O-linked fucose and glucose to EGF-like repeats of Notch receptors,
          and PSENEN encodes a gamma-secretase subunit required for release of the Notch intracellular
          domain. Loss of function in these genes reduces Notch signaling in the epidermis and melanocytes,
          converging with KRT5 haploinsufficiency on the reticulate pigmentary phenotype; both POGLUT1
          and POFUT1 are essential regulators of Notch activity.
        genes:
        - preferred_term: POFUT1
