      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_trisomy21_gene_dosage_model
        hypothesis_label: Canonical Trisomy 21 Gene Dosage / Multisystem Dysregulation Model
        status: CANONICAL
        description: Down syndrome is caused by trisomy 21 (typically meiotic non-disjunction), producing
          a third copy of all ~225 protein-coding HSA21 genes. Gene-dosage imbalance — particularly of
          DYRK1A, DSCAM, APP, RCAN1, SOD1, ETS2, and the chromosome 21 miRNA cluster — perturbs neurogenesis,
          synaptogenesis, cardiac outflow tract development, hematopoiesis, and immune regulation. The
          resulting multisystem phenotype includes intellectual disability, characteristic facies, congenital
          heart disease (~50% AV septal defects), early-onset Alzheimer disease (APP-driven), increased
          TMD/AMKL leukemia risk (GATA1 mutations on trisomic 21), autoimmune disorders, and characteristic
          musculoskeletal features. Trisomy 21 mouse models (Ts65Dn, Dp16) recapitulating segmental HSA21
          trisomy validate the gene-dosage model and have enabled mechanistic dissection of individual
          HSA21-gene contributions.
        notes: 'Retained as CANONICAL with major qualifications. The 2026 falcon hypothesis-search report
          (kb/hypotheses/Down_syndrome/canonical_trisomy21_gene_dosage_model; openscientist timed out
          at 3600s) finds SUPPORTED. Strongest evidence: direct gene-dosage perturbation experiments —
          correcting the interferon receptor (IFNR) cluster copy number in the Dp16 mouse rescues developmental
          delay, cognition, craniofacial changes, and CHD, attenuating IFN hyperactivity; systematic mapping
          in Dp1Tyb identifies DYRK1A triplication as NECESSARY for CHD (linked to cardiomyocyte proliferation
          / mitochondrial dysfunction; rescued by Dyrk1a 2-copy reduction); inducible XIST-mediated chromosome-scale
          dosage correction in human iPSC-derived neural lineages represses chr21 genes and rescues astrogenesis
          bias. Three key qualifications: (1) the model is NOT fully explained by single-gene or single-locus
          dosage — IFNR correction does not rescue all phenotypes; DYRK1A is necessary but not sufficient
          for all CHD contexts, implying additional interacting loci; (2) several DS systemic signatures
          (heme / hypoxia / stress erythropoiesis) are INDEPENDENT of IFNR/JAK modulation, indicating
          parallel trisomy-driven programs; (3) the historical Down Syndrome Critical Region (DSCR) model
          is refuted — DSCR triplication alone does NOT recapitulate key phenotypes; distributed multi-gene
          dosage with epistasis/compensation better explains the architecture. Genome-wide trans dysregulation
          and epigenetic remodeling beyond chr21 further amplify or reshape primary dosage effects.'
      selected_evidence:
        snippet: This increase is due to a shift from neuron to astrocyte differentiation during brain
          development.
        supports: SUPPORT
