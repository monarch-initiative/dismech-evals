          - NM_001039348.3:c.1033C>T
          description: Recurrent missense variant in fibulin-3 and the only variant included in the ClinGen
            curation. Other EFEMP1 variants cause different phenotypes and are out of scope here.
          gene:
            preferred_term: EFEMP1
            term:
              id: hgnc:3218
              label: EFEMP1
          clinical_significance: PATHOGENIC
          type: missense_variant
      selected_evidence:
        snippet: Here we use a combination of positional and candidate gene methods to identify a single
          non-conservative mutation (Arg345Trp) in the gene EFEMP1 (for EGF-containing fibrillin-like
          extracellular matrix protein 1) in all families studied.
        supports: SUPPORT
