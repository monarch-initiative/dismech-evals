  237ea225add0bd720bfdeee3adc94c13e20d1f6b4a0039ea599746ed14599775:
    claim:
      about:
        disease:
          name: Doyne Honeycomb Retinal Dystrophy
          disease_term:
            preferred_term: Doyne honeycomb retinal dystrophy
            term:
              id: MONDO:0007471
              label: Doyne honeycomb retinal dystrophy
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Efemp1 R345W knock-in mouse
        species: Mouse
        genotype: Efemp1 p.R345W knock-in (heterozygous and homozygous)
        description: Two independently generated knock-in lines carry the disease mutation in murine Efemp1.
          Heterozygous and homozygous mice develop sub-RPE basal (laminar) deposits from about 4 months
          that grow into continuous sheets, with fibulin-3 and TIMP3 in the deposits, abnormal Bruch's
          membrane ECM, local complement activation, Nlrp3 upregulation and, in older mice, RPE and choroidal
          degeneration. Mice have no macula, the deposits are microscopic rather than clinical drusen,
          and detectable retinal degeneration is not reproduced. The model has been used to show that
          removal or inhibition of C3, factor B, Nlrp3/caspase-1 and GSK3 reduces deposits.
        publication: PMID:17664227
        modeled_mechanisms:
        - target: Sub-RPE Basal Deposit and Drusen Formation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Reproduces the sub-RPE basal deposits that precede drusen.
          limitations: Mice lack a macula and form microscopic basal laminar deposits rather than clinically
            visible honeycomb drusen; detectable retinal degeneration and vision loss are not reproduced.
        - target: Alternative Complement Activation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Shows complement activation in RPE and Bruch's membrane and its requirement for
            deposits.
        - target: NLRP3 Inflammasome Activation
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: CELLULAR
          description: Shows inflammasome upregulation and its contribution to deposits; human relevance
            is untested.
        - target: Abnormal Bruch's Membrane Extracellular Matrix
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Shows proteoglycan accumulation, MMP/TIMP imbalance and reduced diffusion across
            Bruch's membrane.
      selected_evidence:
        snippet: Thus, the Efemp1 knock-in mice reconstitute the most important histopathologic symptoms
          of both ML and AMD.
        supports: SUPPORT
    origin:
