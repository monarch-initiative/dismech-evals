          term:
            id: GO:0005783
            label: endoplasmic reticulum
      selected_evidence:
        snippet: Here, we show that wild-type EFEMP1 is a secreted protein whereas mutant EFEMP1 is misfolded,
          secreted inefficiently, and retained within cells.
        supports: SUPPORT
