        relationship_type: CAUSATIVE
        association: Causative
        variant_origin: GERMLINE
        features: A single recurrent heterozygous missense variant, c.1033C>T p.(Arg345Trp) (R345W) in
          exon 10, accounts for molecularly confirmed DHRD/ML. It was absent from 477 controls and 494
          AMD patients in the original study. The variant occurs on more than one haplotype, and an apparently
          de novo case has been reported, consistent with recurrent mutation rather than a single founder.
          R345W acts as a toxic gain of function.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_2859008e-eeb1-4af4-8a6e-1bf5372bb3ab-2021-08-05T160000.000Z
        variants:
