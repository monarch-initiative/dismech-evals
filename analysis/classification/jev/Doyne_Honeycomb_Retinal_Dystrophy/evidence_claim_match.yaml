          limitations: A null allele does not model the dominant R345W toxic gain of function; the model
            is informative only as evidence against a loss-of-function mechanism.
      selected_evidence:
        snippet: No apparent macular degeneration associated defects were found in Efemp1(-/-) mice, suggesting
          that loss of fibulin-3 function is not the mechanism by which the mutation in EFEMP1 causes
          macular degeneration.
