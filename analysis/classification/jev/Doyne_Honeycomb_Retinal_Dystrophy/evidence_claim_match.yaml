      assertion:
        name: Abnormal Bruch's Membrane Extracellular Matrix
        description: 'Mutant fibulin-3 alters the extracellular matrix of the RPE basal lamina and Bruch''s
          membrane. In knock-in mice the basal deposits are made of normal ECM components in abnormal
          amounts and contain fibulin-3 and its binding partner TIMP3; proteoglycans accumulate in Bruch''s
          membrane and diffusion across it is impaired. ECM turnover is altered, but the reported direction
          of the MMP-2 change depends on the system: knock-in Bruch''s membrane shows reduced MMP-2 and
          MMP-9 with increased TIMP-3, whereas engineered and patient-derived RPE cultures report increased
          MMP-2 activity or activation.'
        biological_scale: TISSUE
