          EFEMP1 R345W overexpression attenuates cholesterol efflux and causes intracellular lipid droplet
          accumulation; R345W fibulin-3 also has a stronger inhibitory effect on EGFR signalling than
          wild type, which may suppress CES1 through reduced SP1.
