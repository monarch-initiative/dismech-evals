          peripapillary, often radially distributed, and coalesce into a honeycomb pattern with age; they
          can be present from adolescence. In knock-in mice, sub-RPE deposits appear from 4 months and
          grow into continuous sheets. Patient-derived RPE alone is sufficient to start drusen-like deposit
          formation.
        biological_scale: TISSUE
