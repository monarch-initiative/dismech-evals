      assertion_type: Pathophysiology
      assertion:
        name: Fibulin-3 R345W Misfolding and Impaired Secretion
        description: The heterozygous EFEMP1 p.Arg345Trp substitution causes fibulin-3 to misfold, in
          part through reduced native disulfide bonding in the domain carrying residue 345. Wild-type
          fibulin-3 is secreted, whereas the mutant is secreted inefficiently and retained within RPE
          cells. Loss of fibulin-3 does not reproduce the disease in mice, and Efemp1 knockout protects
          against sub-RPE deposits, so the variant acts as a toxic gain of function rather than through
          haploinsufficiency. Fibulin-3 is an extracellular matrix protein (its GO molecular function
          annotation is extracellular matrix structural constituent); that function is bound here as abnormal
          rather than decreased, because the mutant protein is retained and deposited abnormally rather
          than simply lost.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: EFEMP1
          term:
            id: hgnc:3218
            label: EFEMP1
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          allele_type: missense
          functional_impact_category: GAIN_OF_FUNCTION
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        molecular_functions:
        - preferred_term: fibulin-3 extracellular matrix structural constituent
          term:
