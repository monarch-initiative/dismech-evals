        context:
        - path: /biochemical/1
          value:
            name: BOLD cerebrovascular reactivity (CVR) to CO2
            context: 'Magnitude and speed of the blood-oxygenation-level-dependent fMRI signal change
              during a controlled hypercapnia challenge, i.e. the cerebral vasculature''s dilatory response
              to CO2. This is the primary endpoint of NCT07112365 (FAST-DS). It is a distinct construct
              from the hypercapnic ventilatory response above: CVR measures blood vessels responding to
              CO2, HCVR measures breathing responding to CO2. No NCIT biomarker term exists, so it is
              curated without a forced biomarker_term. No `presence` value is asserted because the direction
              of change in Dravet syndrome has not been measured.'
            assays:
            - preferred_term: hypercapnia-challenge BOLD functional magnetic resonance imaging
            notes: 'See the gap_dravet_cvr_surrogate_validity discussion for the confound that makes a
              positive result hard to interpret: fenfluramine is directly vasoactive, so a change in cerebrovascular
              reactivity need not reflect any change in neural chemoreception.'
          role: ancestor
      assertion_type: BiomarkerReadout
      assertion:
        target: Impaired CO2 Chemoreception and Postictal Hypoventilation
        relationship: PHARMACODYNAMIC_MARKER_OF
        endpoint_context: CANDIDATE_SURROGATE
        interpretation: PROPOSED AND UNVALIDATED. NCT07112365 proposes CVR as an imaging pharmacodynamic
          readout of fenfluramine action on this node, and will test it against the ventilatory response
          measured in the same session. No published study links CVR to CO2 chemoreception, to SUDEP risk,
          or to fenfluramine exposure. `direction` is deliberately left unset because no directional association
          has been observed. Do not promote this readout above CANDIDATE_SURROGATE without outcome-link
          evidence.
      selected_evidence:
        snippet: Changes in CVR and their relation to ventilatory responses will also be assessed during
          fMRI.
        supports: SUPPORT
