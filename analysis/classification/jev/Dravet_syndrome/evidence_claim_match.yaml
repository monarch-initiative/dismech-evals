      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sudep_serotonergic_chemoreflex_model
        hypothesis_label: Serotonergic Chemoreflex-Failure Model of SUDEP
        status: EMERGING
        description: 'A seizure-count-independent arm: a convulsive seizure transiently impairs brainstem
          serotonergic neurons, which are central CO2 chemoreceptors, so the hypercapnic ventilatory response
          is depressed for a prolonged period after the seizure ends. A patient whose chemoreflex gain
          is already low then fails to clear postictal hypercapnia and dies. Under this model fenfluramine
          protects by restoring postictal 5-HT tone, an action distinct from and additional to its anticonvulsant
          effect, and the hypercapnic ventilatory response becomes a candidate risk biomarker rather than
          merely a physiological curiosity. The model predicts a fenfluramine effect on the chemoreflex
          that is not proportional to its effect on seizure count, which is what makes it separable from
          the canonical model.'
        notes: 'All direct support for the protective arm is model-organism pharmacology. No human study
          has yet measured any effect of fenfluramine on CO2 chemoreception; NCT07112365 is the first
          attempt. Two scope caveats from the OpenScientist hypothesis review (see kb/hypotheses/Dravet_syndrome/sudep_serotonergic_chemoreflex_model/):
          the single-target 5-HT4 framing above is narrower than the wider literature, which implicates
          several 5-HT receptors plus noradrenergic co-signalling in a dorsal raphe-locus coeruleus-preBotzinger
          circuit (PMID:38820310, PMID:41208885, both now cited above); and serotonergic protection may
          act through autoresuscitation rather than chemoreflex gain, since fluoxetine blocks seizure-induced
          respiratory arrest without raising basal ventilation while breathing stimulants that do raise
          it fail to protect (PMID:26272185). That experiment measured basal ventilation, not the CO2
          response slope this model claims, so it narrows the mechanism rather than refuting it; the locus
          question is carried as gap_dravet_chemoreflex_gain_versus_autoresuscitation_locus.'
      selected_evidence:
        snippet: Our study reveals that serotonergic and noradrenergic systems synergistically regulate
          SUDEP, and further identifies that the DR-LC-PBC neural circuit exerts a protective effect through
          activation of 5-HT2A and NE-α1 receptors within the PBC.
        supports: SUPPORT
