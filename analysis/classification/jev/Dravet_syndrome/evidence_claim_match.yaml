  ff75809abb8d9e32fc11df1332a16bebbaf67df80f3e75a5465c5991a5cc6d02:
    claim:
      about:
        disease:
          name: Dravet_syndrome
          disease_term:
            preferred_term: Dravet syndrome
            term:
              id: MONDO:0100135
              label: Dravet syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hyp_dravet_scn1a_gof_vs_lof_bidirectional
        prompt: How does SCN1A produce opposite-direction disease, with loss-of-function variants causing
          Dravet syndrome but gain-of-function variants causing an early-infantile developmental and epileptic
          encephalopathy and hemiplegic migraine, and does variant functional direction predict whether
          sodium-channel-blocking drugs help or harm?
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        attaches_to:
        - pathophysiology#SCN1A Gene Mutation
        rationale: Classic Dravet syndrome reflects Nav1.1 loss of function in inhibitory interneurons,
          which is why sodium channel blockers typically worsen it. Gain-of-function SCN1A variants cluster
          in distinct channel inactivation regions and produce a phenotype opposite in mechanism, in which
          sodium channel blockers instead reduce seizures. The dismech SCN1A node currently models only
          the loss-of-function Dravet mechanism; whether the same gene node should carry an explicit gain-of-function
          counter-arm, and how functional direction maps to drug response, is an emerging question with
          direct therapeutic stakes.
        proposed_experiments:
        - experiment_id: exp_dravet_scn1a_variant_direction_drug_response
          name: SCN1A variant functional-direction and drug-response mapping
          description: Perform standardized whole-cell voltage-clamp electrophysiology on a panel of SCN1A
            variants spanning Dravet loss-of-function and early-infantile or hemiplegic-migraine gain-of-function
            classes, then correlate measured gating direction with clinical response to sodium channel
            blockers.
          experiment_type:
            preferred_term: voltage-clamp variant functional classification experiment
          perturbations:
          - name: SCN1A variant expression panel
            target: pathophysiology#SCN1A Gene Mutation
            genes:
            - preferred_term: SCN1A
              term:
                id: hgnc:10585
                label: SCN1A
            description: Express wild-type and disease variant Nav1.1 channels to measure whether each
              variant produces a net loss or gain of sodium current.
          readouts:
          - name: Sodium channel gating direction
