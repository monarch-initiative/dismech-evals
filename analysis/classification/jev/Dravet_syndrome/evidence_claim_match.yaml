  0da9ea9e6bff9905d8acda685410222dde8969933efbfc2c17a08c8a309bfa25:
    claim:
      about:
        disease:
          name: Dravet_syndrome
          disease_term:
            preferred_term: Dravet syndrome
            term:
              id: MONDO:0100135
              label: Dravet syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dravet_cvr_surrogate_validity
        prompt: Is BOLD cerebrovascular reactivity to CO2 a valid surrogate for the serotonergic CO2-chemoreception
          deficit that links convulsive seizures to SUDEP, or does it measure cerebral vascular physiology
          that is mechanistically distinct from the ventilatory chemoreflex and confounded by fenfluramine's
          direct vasoactive pharmacology?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
        - pathophysiology#Postictal Serotonergic Neuron Dysfunction
        rationale: 'NCT07112365 (FAST-DS) makes cerebrovascular reactivity its primary endpoint and the
          hypercapnic ventilatory response only secondary, but the published mechanistic chain runs entirely
          through the ventilatory arm. Cerebrovascular reactivity and the hypercapnic ventilatory response
          are different constructs sharing only a CO2 stimulus: CVR is the cerebral vasculature dilating,
          HCVR is the brainstem driving breathing. A literature search finds no publication linking CVR
          to SUDEP risk, to CO2 chemoreception, or to fenfluramine exposure; CVR has been used in epilepsy
          only to localize the epileptogenic zone, a different purpose entirely. Two failure modes follow.
          First, a null CVR result would not refute the serotonergic chemoreflex model, because that model
          makes no CVR prediction. Second, and more consequential, a positive CVR result is ambiguous:
          fenfluramine acts at 5-HT2B receptors on non-neural tissue, the same pharmacology behind its
          valvulopathy and pulmonary-hypertension liability, so a drug-induced change in cerebral vascular
          reactivity could be direct vasoactivity with no bearing on chemoreception or SUDEP risk. The
          trial''s own plan to relate CVR to the simultaneously measured ventilatory response is therefore
          the load-bearing analysis, and dismech should not promote CVR above CANDIDATE_SURROGATE until
          it reports.'
        proposed_experiments:
        - experiment_id: exp_dravet_cvr_vs_hcvr_concordance
          name: Within-subject concordance of cerebrovascular and ventilatory CO2 responses
          description: In the same hypercapnia session, measure BOLD cerebrovascular reactivity and the
            hypercapnic ventilatory response in Dravet syndrome patients and in healthy controls, before
            and after fenfluramine, and test whether the two co-vary within subject and whether fenfluramine
            moves them together or independently. Include a vasoactive control condition that changes
            cerebral vascular tone without changing serotonergic tone, so a CVR shift attributable to
            direct vasoactivity can be separated from one tracking chemoreflex gain.
          experiment_type:
            preferred_term: biomarker concordance and surrogate-validation experiment
          perturbations:
          - name: Fenfluramine exposure
            target: pathophysiology#Postictal Serotonergic Neuron Dysfunction
            description: Titrated fenfluramine to steady state, with paired pre-dose and on-drug hypercapnia
              challenges in the same participant.
          readouts:
          - name: Cerebrovascular reactivity to CO2
            target: pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
            assays:
            - preferred_term: hypercapnia-challenge BOLD functional magnetic resonance imaging
            direction: POSITIVE
          - name: Hypercapnic ventilatory response slope
            target: pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
            biological_processes:
            - preferred_term: regulation of respiratory gaseous exchange by nervous system process
              term:
                id: GO:0002087
                label: regulation of respiratory gaseous exchange by nervous system process
              modifier: DECREASED
            assays:
            - preferred_term: CO2 rebreathing hypercapnic ventilatory response test
            direction: POSITIVE
          controls:
          - name: Healthy control hypercapnia library
            description: Age-matched controls without epilepsy undergoing the identical hypercapnia protocol.
          - name: Non-serotonergic vasoactive challenge
            description: A condition that alters cerebral vascular tone without altering serotonergic
              tone, isolating direct vasoactivity as an explanation for any CVR change.
          decision_criterion: CVR earns promotion beyond CANDIDATE_SURROGATE only if within-subject CVR
            tracks HCVR and fenfluramine moves both in the concordant direction, while the non-serotonergic
            vasoactive control changes CVR without changing HCVR. Discordance, or a CVR shift matched
            by the vasoactive control, means CVR is reporting vascular pharmacology rather than chemoreception.
          would_support:
          - pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
      selected_evidence:
        snippet: evidence has highlighted the utility of 5-HT2B antagonists for the treatment of pulmonary
          arterial hypertension (PAH), valvular heart disease (VHD), and related
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
