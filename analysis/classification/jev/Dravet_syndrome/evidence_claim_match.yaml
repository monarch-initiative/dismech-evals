    evidence_metadata:
      reference: PMID:31301453
      reference_title: The association of serotonin reuptake inhibitors and benzodiazepines with ictal
        central apnea.
      evidence_source: HUMAN_CLINICAL
      explanation: Bounds the protective arm at the step that matters most. In 476 seizures from 204 patients,
        chronic serotonin-reuptake-inhibitor use halved ictal central apnea but showed no association
        with POSTCONVULSIVE central apnea, the phase where this model locates fatal chemoreflex failure.
        Recorded as a bounding observation rather than as REFUTE because serotonin reuptake inhibitors
        are not fenfluramine, which is a releaser plus sigma-1 modulator, and because a null association
        in an observational cohort is not a demonstrated absence of effect.
