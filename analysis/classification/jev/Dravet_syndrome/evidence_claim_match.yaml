      assertion_type: ClinicalTrial
      assertion:
        name: NCT07112365
        phase: PHASE_IV
        status: RECRUITING
        description: FAST-DS ("FINTEPLA as an Anti-SUDEP Therapy in Dravet Syndrome"), a single-arm phase
          4 mechanistic study at UTHealth Houston (PI Samden Lhatoo, est. n=25, ages 16+). Participants
          with Dravet syndrome and generalized convulsive seizures undergo fMRI with a controlled hypercapnia
          challenge (RespirAct device) at baseline and again after ~60 days of fenfluramine, to test whether
          fenfluramine changes cerebrovascular reactivity and the accompanying ventilatory response to
          carbon dioxide. Primary outcomes are the magnitude and speed of the BOLD cerebrovascular response
          to CO2; the ventilatory response is secondary.
        notes: Endpoints are imaging/physiology biomarkers of postictal cardiorespiratory vulnerability,
          not seizure counts or SUDEP incidence, so the trial probes a proposed anti-SUDEP mechanism for
          fenfluramine rather than demonstrating SUDEP reduction. Recruiting as of the 2026-07-13 record
          update; no results posted. Stiripentol and other serotonergic drugs are exclusions, which matters
          because stiripentol is part of standard Dravet combination therapy.
        target_phenotypes:
