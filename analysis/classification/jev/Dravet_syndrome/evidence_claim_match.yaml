        prompt: Do Scn1a heterozygous mouse phenotypes, whose seizure and SUDEP severity are strongly
          dependent on genetic background, faithfully model human Dravet syndrome severity and the mechanism
          of sudden unexpected death in epilepsy?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#SCN1A Gene Mutation
        - pathophysiology#Neuronal Hyperexcitability
        rationale: Most mechanistic and preclinical therapeutic evidence for Dravet syndrome comes from
          Scn1a heterozygous mice, in which seizure frequency and SUDEP are highly sensitive to strain
          background and in which murine sodium channel biology differs from human. The model reproduces
          core features such as electrographic seizures and premature death, but its quantitative fidelity
          to human disease severity, drug response, and SUDEP mechanism is not established. Curation should
          treat mouse-derived mechanism and SUDEP claims as model evidence whose human translation remains
          open, keeping human clinical anchors distinct.
        proposed_experiments:
        - experiment_id: exp_dravet_human_ipsc_vs_mouse_benchmarking
          name: Human iPSC neuron benchmarking against background-controlled Scn1a mice
          description: Compare interneuron sodium current, firing, and network hyperexcitability in human
            Dravet iPSC-derived cortical cultures against Scn1a heterozygous mice on several defined genetic
            backgrounds, testing whether the human deficit matches the range seen across mouse strains.
          experiment_type:
            preferred_term: human-versus-model benchmarking experiment
          model_systems:
          - name: Dravet patient iPSC-derived cortical culture
            description: Human iPSC-derived cortical culture containing GABAergic interneurons and excitatory
              neurons, used to measure sodium current and network activity.
            experimental_model_type: IPSC_DERIVED_MODEL
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: inhibitory interneuron
              term:
                id: CL:0000498
                label: inhibitory interneuron
          perturbations:
          - name: SCN1A haploinsufficiency in human iPSC neurons
            target: pathophysiology#SCN1A Gene Mutation
            genes:
            - preferred_term: SCN1A
              term:
                id: hgnc:10585
                label: SCN1A
            description: Model patient SCN1A haploinsufficiency in human iPSC-derived neurons for a side-by-side
              comparison with mouse.
          readouts:
          - name: Interneuron firing and network excitability
            target: pathophysiology#Neuronal Hyperexcitability
            biological_processes:
            - preferred_term: neuronal action potential
              term:
                id: GO:0019228
                label: neuronal action potential
              modifier: DECREASED
