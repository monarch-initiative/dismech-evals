      reference: PMID:37584406
      reference_title: '2B Determined: The Future of the Serotonin Receptor 2B in Drug Discovery.'
      evidence_source: OTHER
      explanation: Documents 5-HT2B as the receptor behind fenfluramine-class vascular and valvular tissue
        effects, establishing that the drug has direct non-neural vascular pharmacology capable of confounding
        a cerebrovascular readout.
