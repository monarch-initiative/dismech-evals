  c48940c397ca4ffbea062c3bc6f69cbbf99527e749f62a398b76dbd766e24daa:
    claim:
      about:
        disease:
          name: Dravet_syndrome
          disease_term:
            preferred_term: Dravet syndrome
            term:
              id: MONDO:0100135
              label: Dravet syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dravet_cholinergic_terminal_apnea_competitor
        prompt: Is the fatal postictal apnea of Dravet syndrome driven by central cholinergic outflow
          rather than by failed serotonergic chemoreception, and are the two rescues additive or redundant
          in Scn1a mice?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
        - phenotypes#Sudden Unexpected Death in Epilepsy
        rationale: This entry models one terminal route to sudden death, in which a depressed chemoreflex
          fails to clear postictal hypercapnia. In the Scn1a R1407X mouse the terminal event is central
          apnea followed by bradycardia, and it is prevented by muscarinic receptor antagonists at doses
          that reach the brain, including by intracerebroventricular infusion at a dose far below the
          systemic one. Peripheral parasympathetic blockade does not rescue. That is a complete alternative
          account of the same terminal apnea, running through central cholinergic drive rather than through
          chemoreceptor gain, and it is not modelled anywhere in this entry. The two accounts are not
          mutually exclusive and could be sequential or parallel, but nothing published tests whether
          serotonergic and antimuscarinic rescue are additive, redundant, or act on different animals.
          Until that is done, the chemoreflex chain curated here should not be read as the only terminal
          mechanism available in Dravet syndrome.
        proposed_experiments:
        - experiment_id: exp_dravet_serotonergic_versus_cholinergic_rescue_additivity
          name: Additivity of serotonergic and antimuscarinic rescue in Scn1a mice
          description: In Scn1a haploinsufficient mice subjected to hyperthermia-induced seizures, compare
            fenfluramine alone, a centrally acting muscarinic antagonist alone, and the two together,
            measuring postictal apnea duration, bradycardia, and survival. Test whether the combination
            outperforms either agent alone.
          experiment_type:
            preferred_term: combination-rescue additivity experiment
          perturbations:
          - name: Serotonergic versus antimuscarinic versus combined rescue
            target: pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
            description: Three treatment arms delivered before an identical seizure protocol, so that
              each rescue pathway is engaged alone and jointly.
          readouts:
          - name: Postictal apnea duration and survival
            target: pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
            biological_processes:
            - preferred_term: regulation of respiratory gaseous exchange by nervous system process
              term:
                id: GO:0002087
                label: regulation of respiratory gaseous exchange by nervous system process
              modifier: DECREASED
            assays:
            - preferred_term: postictal respiratory recording with survival ascertainment
            direction: POSITIVE
          controls:
          - name: Vehicle-treated seizure cohort
            description: Matched animals receiving vehicle before the same seizure protocol.
          - name: Peripherally restricted antimuscarinic arm
            description: A muscarinic antagonist dosed so that it does not cross the blood brain barrier,
              separating central from peripheral cholinergic blockade.
          decision_criterion: Additive protection means two separable terminal mechanisms, and the cholinergic
            arm should be curated as a parallel pathophysiology route. Redundant protection, where either
            agent alone reaches the ceiling, means the two act on one shared final step and the entry
            needs one node rather than two.
          would_support:
          - pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
      selected_evidence:
        snippet: Mice with an Scn1aR1407X/+ loss-of-function mutation were monitored and died after spontaneous
          and heat-induced seizures due to central apnea followed by progressive bradycardia.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/6
