      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sudep_seizure_burden_model
        hypothesis_label: Seizure-Burden Model of SUDEP Risk
        status: CANONICAL
        description: 'The default account of SUDEP risk in Dravet syndrome: generalized convulsive seizures
          are the dominant risk factor, so anything that lowers convulsive seizure frequency lowers SUDEP
          risk without requiring a separate protective mechanism. Under this model fenfluramine''s observed
          association with reduced SUDEP mortality is fully explained by its established anticonvulsant
          efficacy, and no chemoreflex-specific action need be invoked. This model is the null hypothesis
          that any claimed seizure-independent anti-SUDEP mechanism must be tested against.'
        notes: The supporting human data are a historical-control comparison, not a randomized SUDEP endpoint,
          and rest on three deaths across 1185 person years. The comparison therefore cannot by itself
          discriminate this model from the serotonergic chemoreflex model below.
      selected_evidence:
        snippet: The all-cause and SUDEP mortality rates during treatment with FFA was 1.7 per 1000 person-years
        supports: SUPPORT
    origin:
