      evidence_source: MODEL_ORGANISM
      explanation: Locates the protective serotonergic action inside a dorsal raphe to locus coeruleus
        to pre-Botzinger complex circuit that also requires noradrenergic co-signalling through NE-alpha1
        receptors. Serotonergic tone is therefore one necessary input to the effector node rather than
        the whole of it.
