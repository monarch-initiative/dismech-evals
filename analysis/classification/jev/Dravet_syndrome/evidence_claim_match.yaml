  3e522217041ce5603c6bc78a731f2e2c8f64b1c5b5452c1ac57d9089e6a3e3d6:
    claim:
      about:
        disease:
          name: Dravet_syndrome
          disease_term:
            preferred_term: Dravet syndrome
            term:
              id: MONDO:0100135
              label: Dravet syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dravet_chemoreflex_gain_versus_autoresuscitation_locus
        prompt: Does enhanced serotonergic tone protect against seizure-induced respiratory death by restoring
          CO2 chemoreflex gain, as this entry models it, or by facilitating autoresuscitation through
          the periaqueductal gray and pontomedullary respiratory nuclei without raising ventilatory drive
          at all?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Postictal Serotonergic Neuron Dysfunction
        - pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
        - mechanistic_hypotheses#sudep_serotonergic_chemoreflex_model
        rationale: 'The chemoreflex model asserts a specific locus for serotonergic protection: 5-HT tone
          sets the gain of the hypercapnic ventilatory response, so restoring it should restore ventilation
          to a CO2 load. Two model-organism results point somewhere else. Fluoxetine blocks seizure-induced
          respiratory arrest at doses that do not raise basal ventilation, while doxapram and PK-THPP
          raise ventilation and fail to protect, which is a double dissociation between the protective
          effect and ventilatory drive. Imaging of protected animals localizes the fluoxetine effect to
          the periaqueductal gray plus amygdala, reticular formation, Kolliker-Fuse nucleus, facial-parafacial
          group and pontine raphe, a distribution that reads as a network for recovery of breathing after
          an arrest rather than as chemoreceptor gain. Both experiments are in the audiogenic DBA/1 model
          rather than an Scn1a haploinsufficient Dravet model, and neither measured breathing during the
          seizure itself, so they motivate a competing locus without excluding a distinct seizure-window
          chemoreflex effect in Dravet. Until the two are separated, the pathophysiology chain curated
          here should be read as the model under test, not as the established mechanism.'
        proposed_experiments:
        - experiment_id: exp_dravet_chemoreflex_versus_autoresuscitation_dissection
          name: Circuit dissection of chemoreflex gain versus autoresuscitation
          description: In Scn1a haploinsufficient mice, chemogenetically restore medullary raphe serotonergic
            output selectively, without engaging periaqueductal gray or pre-Botzinger autoresuscitation
            nodes, then reverse the manipulation to drive the autoresuscitation nodes while leaving raphe
            chemoreceptor output depressed. Measure the hypercapnic ventilatory response, latency to resume
            breathing after seizure-induced apnea, and survival in each arm.
          experiment_type:
            preferred_term: chemogenetic circuit-dissection experiment
          perturbations:
          - name: Selective raphe serotonergic restoration
            target: pathophysiology#Postictal Serotonergic Neuron Dysfunction
            description: Chemogenetic activation restricted to medullary raphe serotonergic neurons, with
              a parallel arm activating periaqueductal gray and pontomedullary respiratory nodes instead.
          readouts:
          - name: Hypercapnic ventilatory response slope
            target: pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
            biological_processes:
            - preferred_term: response to carbon dioxide
              term:
                id: GO:0010037
                label: response to carbon dioxide
              modifier: DECREASED
            assays:
            - preferred_term: whole-body plethysmography hypercapnic challenge
            direction: POSITIVE
          - name: Latency to resume breathing after postictal apnea
            target: pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
            biological_processes:
            - preferred_term: regulation of respiratory gaseous exchange by nervous system process
              term:
                id: GO:0002087
                label: regulation of respiratory gaseous exchange by nervous system process
              modifier: DECREASED
            assays:
            - preferred_term: postictal respiratory recording with survival ascertainment
            direction: POSITIVE
          controls:
          - name: Non-serotonergic breathing stimulant arm
            description: A respiratory stimulant that raises ventilation without altering serotonergic
              tone, matched for the achieved ventilatory increase.
          - name: Vehicle-treated seizure cohort
            description: Matched animals receiving vehicle before the same seizure protocol.
          decision_criterion: The chemoreflex locus curated in this entry is supported if selective raphe
            restoration normalizes the hypercapnic ventilatory response and prevents death on its own.
            If survival instead tracks autoresuscitation latency and is rescued by driving the periaqueductal
            gray and pontomedullary nodes while the chemoreflex stays depressed, the protective mechanism
            should be relocated out of the chemoreflex node.
          would_support:
          - pathophysiology#Impaired CO2 Chemoreception and Postictal Hypoventilation
          would_refute:
          - mechanistic_hypotheses#sudep_serotonergic_chemoreflex_model
      selected_evidence:
        snippet: These data suggest that fluoxetine blocks S-IRA in DBA/1 mice by cellular/molecular mechanisms
          other than enhancement of basal ventilation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/5
      evidence_path: /discussions/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26272185
      reference_title: Abnormalities of serotonergic neurotransmission in animal models of SUDEP.
      evidence_source: MODEL_ORGANISM
      explanation: 'States the dissociation directly: the serotonergic protection is not delivered by
        increasing ventilation, which is the currency the chemoreflex arm of this model trades in.'
