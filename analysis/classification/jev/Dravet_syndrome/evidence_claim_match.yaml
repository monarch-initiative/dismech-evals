        name: Antisense Oligonucleotide Therapy (Zorevunersen/STK-001)
        description: 'Zorevunersen (STK-001) is an investigational splice-modulating antisense oligonucleotide
          that uses Targeted Augmentation of Nuclear Gene Output (TANGO) technology to prevent inclusion
          of the non-productive, nonsense-mediated-decay "poison" exon 20N in SCN1A pre-mRNA. Skipping
          the poison exon increases productive SCN1A transcript and Nav1.1 protein from the non-mutant
          allele, restoring inhibitory interneuron excitability rather than acting on seizure symptoms.
          Administered intrathecally. Preclinical models show increased productive Scn1a transcript with
          reduced seizures and SUDEP, and early clinical data report reduced seizure frequency.

          '
        notes: Disease-modifying gene-targeted therapy in clinical development. Allele-agnostic upregulation
          of the productive SCN1A transcript addresses the underlying haploinsufficiency.
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        oligonucleotide_details:
