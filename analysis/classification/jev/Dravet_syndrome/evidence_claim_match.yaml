        biological_scale: CELLULAR
        description: Convulsive seizures transiently impair brainstem serotonergic neuron function. Because
          5-HT neurons of the medullary raphe are central CO2 chemoreceptors and drive multiple aspects
          of respiratory control, this transient loss of serotonergic tone is the proposed cellular link
          between a seizure and the postictal respiratory failure implicated in SUDEP. Supporting the
          causal direction, depleting serotonin with para-chlorophenylalanine reproduces the deficit and
          increases postictal mortality, while the 5-HT releaser fenfluramine attenuates it.
        cell_types:
        - preferred_term: serotonergic neuron
          term:
            id: CL:0000850
            label: serotonergic neuron
        biological_processes:
        - preferred_term: serotonin secretion
          term:
            id: GO:0001820
            label: serotonin secretion
          modifier: DECREASED
          temporality: TRANSIENT
        locations:
        - preferred_term: raphe nuclei
          term:
            id: UBERON:0004684
            label: raphe nuclei
        - preferred_term: medulla oblongata
          term:
            id: UBERON:0001896
            label: medulla oblongata
        notes: Human evidence for this node is indirect. The postictal HCVR decrease is documented in
          epilepsy patients, but the serotonergic attribution rests on mouse pharmacology; see the gap_dravet_serotonin_sudep_human_attribution
          discussion.
      selected_evidence:
        snippet: Depleting 5-HT with para-chlorophenylalanine (PCPA) mimicked seizure-induced hypoventilation,
          partially occluded the postictal decrease in the HCVR, exacerbated hypothermia, and increased
          postictal mortality in DS mice.
        supports: SUPPORT
