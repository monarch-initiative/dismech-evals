              label: Dravet syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dravet_interneuron_hypothesis_completeness
        prompt: Is selective Nav1.1 loss in GABAergic, especially parvalbumin-positive, interneurons a
          complete account of Dravet syndrome, or do excitatory-neuron, astrocytic, and developmental
          contributions materially shape the phenotype?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#SCN1A Gene Mutation
        - pathophysiology#Neuronal Hyperexcitability
        rationale: 'The dominant model, grounded in Scn1a mouse work, attributes seizures to disinhibition
          from impaired interneuron firing with preserved excitatory pyramidal-neuron sodium current.
          Later single-cell, developmental, and glial data suggest the interneuron-only view may be incomplete:
          astrocytic calcium signalling is altered in the same model, interneuron deficits may be partly
          developmental and time-limited, and excitatory-neuron contributions have been proposed. For
          curation this means the interneuron node should remain the primary mechanism while additional
          cell-type and developmental contributions stay an open question rather than a settled one.'
        proposed_experiments:
        - experiment_id: exp_dravet_celltype_contribution_dissection
          name: Cell-type-selective Nav1.1 restoration and network panel
          description: In human iPSC-derived cortical microcircuits and conditional mouse models, restore
            or delete Nav1.1 selectively in interneurons, in excitatory neurons, and in astrocytes, then
            quantify how each manipulation changes network excitability and seizure-like activity.
          experiment_type:
            preferred_term: cell-type-selective rescue and network experiment
          perturbations:
          - name: Interneuron-selective Nav1.1 restoration
            target: pathophysiology#SCN1A Gene Mutation
            genes:
            - preferred_term: SCN1A
              term:
                id: hgnc:10585
                label: SCN1A
            description: Restore productive SCN1A selectively in GABAergic interneurons, then separately
              in excitatory neurons and astrocytes, in an otherwise haploinsufficient background.
          readouts:
          - name: GABAergic transmission and network excitability
            target: pathophysiology#Neuronal Hyperexcitability
            biological_processes:
            - preferred_term: synaptic transmission, GABAergic
              term:
                id: GO:0051932
                label: synaptic transmission, GABAergic
              modifier: DECREASED
            - preferred_term: neuronal action potential
              term:
                id: GO:0019228
                label: neuronal action potential
              modifier: DYSREGULATED
            assays:
            - preferred_term: multielectrode array recording
            - preferred_term: patch-clamp electrophysiology
            direction: POSITIVE
          controls:
          - name: Isogenic wild-type microcircuits
            description: Matched circuits with two functional SCN1A alleles.
          - name: Untargeted haploinsufficient microcircuits
            description: Haploinsufficient circuits with no cell-type-selective restoration.
          decision_criterion: Interneuron dysfunction is a complete account only if interneuron-selective
            Nav1.1 restoration normalizes network excitability while excitatory-neuron and astrocyte manipulations
            do not; residual excitability implicates additional cell types.
          would_support:
          - pathophysiology#SCN1A Gene Mutation
          - pathophysiology#Neuronal Hyperexcitability
      selected_evidence:
        snippet: Loss-of-function in Na(v) 1.1 channels results in severely impaired sodium current and
          action potential firing in hippocampal γ-aminobutyric acid (GABA)ergic interneurons without
          detectable changes in excitatory pyramidal neurons.
        supports: SUPPORT
