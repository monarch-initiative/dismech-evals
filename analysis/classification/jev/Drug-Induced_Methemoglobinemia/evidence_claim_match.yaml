      assertion_type: Pathophysiology
      assertion:
        name: NADH-Cytochrome b5 Reductase Recovery Capacity
        description: The draining side of the balance, and the reason baseline oxidation is invisible.
          Red cell NADH-cytochrome b5 reductase reduces ferric haem back so efficiently that circulating
          methemoglobin is insignificant. In this disease the enzyme is intact and simply outpaced. In
          the hereditary disease it is deficient. That is the whole difference between the two.
        role: modifier
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: NADH-cytochrome b5 reductase activity
          term:
            id: GO:0004128
            label: cytochrome-b5 reductase activity, acting on NAD(P)H
      selected_evidence:
        snippet: Under physiological conditions, methemoglobin reduction is accomplished mainly by red
          cell NADH-cytochrome b5 reductase (NADH-methemoglobin reductase) so efficiently that there is
          insignificant amounts of methemoglobin in the circulating blood.
        supports: SUPPORT
