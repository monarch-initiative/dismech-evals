      assertion_type: Pathophysiology
      assertion:
        name: Baseline Haemoglobin Autoxidation
        description: The standing condition this disease perturbs, curated as a node because without it
          the disease looks like the appearance of something abnormal rather than the failure of an existing
          balance. Ferrous haem is continuously oxidised simply by sitting in oxygen.
        role: trigger
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: The ferrous iron of hemoglobin is exposed continuously to high concentrations of oxygen
          and, thereby, is oxidized slowly to methemoglobin, a protein unable to carry oxygen.
        supports: SUPPORT
