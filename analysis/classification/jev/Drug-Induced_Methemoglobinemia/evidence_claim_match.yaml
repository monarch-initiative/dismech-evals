            term:
              id: MONDO:0018740
              label: drug-induced methemoglobinemia
        context: []
      assertion_type: Treatment
      assertion:
        name: Methylene blue
        description: The antidote, and one whose mechanism carries its own contraindication. It works
          by being reduced inside the red cell and then handing that reduction to ferric haem, and the
          reducing power comes from NADPH. So the antidote depends on a pathway the patient may not have.
          In glucose-6-phosphate dehydrogenase deficiency it is less effective or ineffective, and in
          the presence of haemolysis a high dose can make methemoglobin instead of clearing it. The same
          oxidising chemistry that treats the disease can cause it.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: methylene blue
            term:
              id: CHEBI:6872
              label: methylene blue
        notes: The NADPH dependence stated in this description is the mechanism behind the G6PD contraindication,
          and the cited source gives it as a dependence on NADP+ rather than tracing the pathway to glucose-6-phosphate
          dehydrogenase. The entry does not assert the pentose phosphate pathway step, which no source
          cited here states.
      selected_evidence:
        snippet: Methylene blue has been in medicinal use for centuries and is best known as an antidotal
          treatment for acquired methemoglobinemia (MetHB).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34463662
