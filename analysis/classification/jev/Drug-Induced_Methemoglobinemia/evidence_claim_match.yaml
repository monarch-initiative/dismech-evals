      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hereditary methemoglobinemia
        disease_term:
          preferred_term: hereditary methemoglobinemia
          term:
            id: MONDO:0018963
            label: hereditary methemoglobinemia
        description: 'The genetic phenocopy, and the closest one in this knowledge base because the two
          diseases share their central node outright. Both end at accumulated ferric haem and both present
          with cyanosis unresponsive to oxygen beside a normal arterial oxygen tension. They arrive from
          opposite sides of one balance: biallelic CYB5R3 variants remove the reductase, and an oxidant
          drug outruns a reductase that works. No measurement of the methemoglobin itself separates them.'
        distinguishing_features:
        - Exposure history, and resolution when the exposure is removed
        - Lifelong cyanosis from infancy in the hereditary form, against acute onset here
        - Cytochrome b5 reductase activity, which is reduced in the hereditary form and normal here
        - CYB5R3 sequencing
      selected_evidence:
        snippet: However, should methemoglobin formation be increased--e.g., due to the presence of oxidant
          drugs, or an abnormal methemoglobin not amenable to reduction (hemoglobin M), or a deficiency
          in red cell cytochrome b5 reductase--methemoglobinemia will result.
        supports: SUPPORT
