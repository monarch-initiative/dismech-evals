        - pathophysiology#Ocular-Surface Innate and Adaptive Inflammation
        rationale: The cited efficacy and mechanism data come from a five-day murine DED study. DED is
          heterogeneous, evaporative forms can have muted inflammation, and CO exposure has a narrow safety
          context. Translation therefore requires endotype selection, ocular and systemic safety assessment,
          controlled dose and light-delivery studies, and randomized human efficacy data.
      selected_evidence:
        snippet: In a murine DED model, topical administration of MCF for 5 days achieved 84% corneal
          epithelial recovery and alleviated corneal inflammation and tissue injury.
        supports: SUPPORT
