        hypothesis_label: Multidriver Tear-Film and Ocular-Surface Homeostasis Model
        status: CANONICAL
        description: DED is modeled as a heterogeneous loss-of-homeostasis state. Different combinations
          of tear-film deficiency, eyelid dysfunction, ocular-surface stress, inflammation, epithelial
          damage, and neurosensory dysfunction can converge on symptoms; no single downstream node is
          asserted to be present or dominant in every patient.
      selected_evidence:
        snippet: Dry eye is a multifactorial, symptomatic disease characterized by a loss of homeostasis
          of the tear film and/or ocular surface, in which tear film instability and hyperosmolarity,
          ocular surface inflammation and damage, and neurosensory abnormalities are etiological factors.
        supports: SUPPORT
    origin:
