  a9f0fb92bc903b9ebc343afbf76317cef61bd575315292588e5620283304fe8b:
    claim:
      about:
        disease:
          name: Du Pan Syndrome
          disease_term:
            preferred_term: du Pan syndrome
            term:
              id: MONDO:0009231
              label: acromesomelic dysplasia 2B
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: receptor_specificity_model
        hypothesis_label: Receptor-Binding-Specificity Model
        status: ALTERNATIVE
        description: A competing reading of the same interface data is that what matters is not only how
          much receptor binding an allele leaves, but which receptor it binds. GDF5 p.Arg438Leu, one residue
          away from the du Pan allele, keeps normal BMPR1B binding but gains BMPR1A binding and causes
          symphalangism, a joint-fusion phenotype rather than a hypoplasia. On this view the du Pan and
          Grebe alleles sit at the loss end of a two-dimensional space whose other axis is receptor choice,
          and a purely quantitative dose model cannot predict the phenotype of an allele that redistributes
          binding rather than reducing it. This has not been tested against any acromesomelic allele.
      selected_evidence:
        snippet: the symphalangism phenotype (R438L) is caused by a loss of receptor-binding specificity,
          resulting in a gain of function by the acquisition of BMP2-like properties
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16127465
      reference_title: Activating and deactivating mutations in the receptor interaction site of GDF5
        cause symphalangism or brachydactyly type A2.
      evidence_source: IN_VITRO
      explanation: States the specificity mechanism explicitly, as an alternative to a purely quantitative
        account of GDF5 allele effects.
