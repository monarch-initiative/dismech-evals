      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: residual_signalling_dose_model
        hypothesis_label: Residual GDF5-BMPR1B Signalling Dose Model
        status: CANONICAL
        description: The acromesomelic GDF5-BMPR1B disorders are one mechanism read at different doses.
          How much signalling an allele leaves, rather than which of the two genes it hits, determines
          whether the result is du Pan syndrome, Grebe dysplasia, or in the heterozygous state a brachydactyly.
          The strongest test is within BMPR1B, where the du Pan allele p.Arg31Cys and the Grebe allele
          p.Cys53Arg were assayed side by side and ranked in the order the phenotypes predict. The same
          logic holds for GDF5 p.Leu441Pro, which gives brachydactyly type A2 heterozygous and du Pan
          syndrome homozygous.
      selected_evidence:
        snippet: leads to a significant loss of BMPR1B function, but to a lesser extent than the previously
          reported p.Cys53Arg mutation that results in the more severe Grebe dysplasia
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
