      assertion_type: Discussion
      assertion:
        discussion_id: du_pan_gene_indistinguishability
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is there any clinical or radiographic feature that separates GDF5-related from BMPR1B-related
          du Pan syndrome?
        rationale: Polydactyly was the last candidate discriminator and it fell in 2024, when a BMPR1B
          case was reported with bilateral postaxial polydactyly. With so few published cases in either
          group, no feature is currently established as gene-specific, which is why this entry curates
          both aetiologies under one disease concept rather than splitting them.
        attaches_to:
        - genetic#Biallelic Hypomorphic GDF5 Variants
        - genetic#Biallelic Hypomorphic BMPR1B Variants
      selected_evidence:
        snippet: Our case expands the phenotypical overlap between the different ACD types, du Pan and
          Grebe.
        supports: SUPPORT
