        name: Biallelic Hypomorphic GDF5 Variants
        gene_term:
          preferred_term: GDF5
          term:
            id: hgnc:4220
            label: GDF5
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: The founding kindred is homozygous for a missense variant in the mature domain, T1322C
          predicting p.Leu441Pro. The 2002 report inferred a conformational change; direct biosensor measurement
          three years later showed the specific defect, which is loss of binding to the type I BMP receptor
          ectodomains. The same allele in the heterozygous state causes brachydactyly type A2, so p.Leu441Pro
          is a dosage series in one variant rather than two separate alleles.
      selected_evidence:
        snippet: Affected individuals were homozygous for a missense mutation, T1322C, in the coding region
          of the CDMP1 gene.
        supports: SUPPORT
