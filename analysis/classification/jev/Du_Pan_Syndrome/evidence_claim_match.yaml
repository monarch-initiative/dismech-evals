          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: One Polish family transmits du Pan syndrome dominantly. The affected allele carries
          three GDF5 variants in cis within the mature active domain, and the proposed explanation is
          that their combined effect on one allele reaches the threshold that normally requires two hit
          alleles. This is a single reported exception and should not be generalised.
      selected_evidence:
        snippet: Three new heterozygous mutations clustered on one allele of the CDMP1 gene were identified
          in the affected individuals resulting in the first familial case with dominant Du Pan syndrome.
        supports: SUPPORT
