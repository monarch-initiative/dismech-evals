      assertion:
        name: Abducens Nerve Hypoplasia and Failure to Innervate the Lateral Rectus
        description: The primary anatomical lesion of DRS is hypoplasia or absence of the abducens nerve,
          which fails to fully innervate the lateral rectus muscle. Postmortem and mouse studies establish
          this as the founding event from which the downstream miswiring follows. This denervation underlies
          the limitation of abduction.
        cell_types:
        - preferred_term: abducens motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: abducens nerve development
          term:
            id: GO:0021560
            label: abducens nerve development
          modifier: DECREASED
      selected_evidence:
        snippet: In 12 of the 14 patients with DRS1 and 9 of the 17 patients with DRS3, the abducens nerve
          was found to be absent in the MRI images, and in 4 of the patients with DRS2, the abducens nerve
          was detected as hypoplasia.
        supports: SUPPORT
