  2709d43652684eb21254c9dbcb59209165ef698c85bb611a4b8c1d143d783bef:
    claim:
      about:
        disease:
          name: Duane Retraction Syndrome
          disease_term:
            preferred_term: Duane retraction syndrome
            term:
              id: MONDO:0007473
              label: Duane retraction syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CHN1 Hyperactivation and MAFB Loss Disrupt Abducens Motor Neuron Development
        description: In the Mendelian forms of DRS, distinct molecular lesions converge on the development
          of abducens (sixth nerve) motor neurons. Gain-of-function missense variants in CHN1 hyperactivate
          alpha2-chimaerin, a Rac GTPase-activating (RacGAP) signaling protein that controls cytoskeletal
          dynamics during ocular motor axon pathfinding. Loss of function of MAFB, a transcription factor
          required for abducens motor neuron identity, removes a key determinant of sixth-nerve specification.
          Both lesions perturb the genetic program that builds the abducens nerve.
        cell_types:
        - preferred_term: abducens motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: regulation of Rac protein signal transduction
          term:
            id: GO:0035020
            label: regulation of Rac protein signal transduction
          modifier: DYSREGULATED
        - preferred_term: motor neuron axon guidance
          term:
            id: GO:0008045
            label: motor neuron axon guidance
          modifier: DYSREGULATED
        - preferred_term: Semaphorin-plexin signaling upstream of alpha2-chimaerin
          term:
            id: GO:0071526
            label: semaphorin-plexin signaling pathway
          modifier: DYSREGULATED
        - preferred_term: ephrin/EphA4 receptor signaling upstream of alpha2-chimaerin
          term:
            id: GO:0048013
            label: ephrin receptor signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Studying families with a variant form of the disorder (DURS2-DRS), we have identified
          causative heterozygous missense mutations in CHN1, a gene on chromosome 2q31 that encodes alpha2-chimaerin,
          a Rac guanosine triphosphatase-activating protein (RacGAP) signaling protein
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18653847
      reference_title: Human CHN1 mutations hyperactivate alpha2-chimaerin and cause Duane's retraction
        syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies heterozygous CHN1 missense mutations encoding the alpha2-chimaerin RacGAP
        as the cause of the DURS2 form of DRS.
