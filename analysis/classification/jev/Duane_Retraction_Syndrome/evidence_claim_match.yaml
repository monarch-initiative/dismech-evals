            preferred_term: Duane retraction syndrome
            term:
              id: MONDO:0007473
              label: Duane retraction syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Co-contraction of the Horizontal Recti and Globe Retraction
        description: Because the lateral rectus is innervated by the oculomotor nerve along with the medial
          rectus, attempted adduction drives simultaneous contraction (co-contraction) of both horizontal
          recti. The opposing forces pull the globe posteriorly into the orbit, producing the characteristic
          globe retraction and narrowing of the palpebral fissure, while abduction remains deficient.
          Upshoot or downshoot of the eye on adduction can result from the co-contracting lateral rectus
          slipping over or under the globe.
        cell_types:
        - preferred_term: horizontal rectus muscle cell
          term:
            id: CL:0000188
            label: cell of skeletal muscle
      selected_evidence:
        snippet: the characteristic findings are best explained by a paradoxical innervation of the lateral
          rectus muscle, which subsequently causes a cocontraction of the horizontal rectus muscles.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8310396
      reference_title: Duane's retraction syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes co-contraction of the horizontal recti from paradoxical lateral rectus
        innervation as the mechanism of the clinical findings.
