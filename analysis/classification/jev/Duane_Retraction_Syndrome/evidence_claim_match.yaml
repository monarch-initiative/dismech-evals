          No HPO term precisely captures upshoot/downshoot on adduction, so the broad "Abnormality of
          eye movement" term is used pending a New Term Request (NTR).
        phenotype_term:
          preferred_term: Upshoot or downshoot of the eye on adduction
          term:
            id: HP:0000496
            label: Abnormality of eye movement
      selected_evidence:
        snippet: retraction of the globe with narrowing of the lid fissure in attempted adduction, frequent
          abduction deficiency with variable limitation to adduction, and upshoot and/or downshoot of
          the affected eye on adduction.
        supports: SUPPORT
