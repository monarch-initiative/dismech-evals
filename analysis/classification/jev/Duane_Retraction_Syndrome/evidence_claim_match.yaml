            label: abducens nerve development
          modifier: DECREASED
      selected_evidence:
        snippet: The lateral movement anomaly results from failure of the abducens nucleus and nerve (cranial
          nerve VI) to fully innervate the lateral rectus muscle
        supports: SUPPORT
