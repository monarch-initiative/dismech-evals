          podocytes. The clinical consequence is focal segmental glomerulosclerosis and proteinuric kidney
          disease, which the MONDO and OMIM labels for this entity do not name but which is reported in
          DURS3-spectrum families. This arm is variably expressed and is not required for the diagnosis.
