      assertion_type: Diagnosis
      assertion:
        name: High-Resolution Cranial Nerve MRI
        description: Dedicated thin-section MRI of the cranial nerves shows the abducens nerve to be absent
          or hypoplastic. This is what separates a congenital dysinnervation disorder from an acquired
          sixth-nerve palsy, where the nerve is present, and it is the imaging correlate of the founding
          lesion in this entry's pathograph. It does not distinguish the MAFB form from the other genetic
          or unsolved forms of Duane syndrome; only sequencing does that.
      selected_evidence:
        snippet: In 12 of the 14 patients with DRS1 and 9 of the 17 patients with DRS3, the abducens nerve
          was found to be absent in the MRI images, and in 4 of the patients with DRS2, the abducens nerve
          was detected as hypoplasia.
        supports: SUPPORT
