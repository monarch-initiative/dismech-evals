    claim:
      about:
        disease:
          name: Duane Retraction Syndrome 3 With Or Without Deafness
          disease_term:
            preferred_term: Duane retraction syndrome 3 with or without deafness
            term:
              id: MONDO:0014880
              label: Duane retraction syndrome 3 with or without deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Rhombomere 5 Patterning and Abducens Motor Neuron Specification
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: The abducens motor neurons are born in hindbrain rhombomere 5, and the mouse MAFB
          ortholog kreisler is required for that segment to form at all. When MAFB function drops, rhombomere
          5 identity is not established and the abducens motor neuron pool is not specified. Mafb-null
          mice lack the sixth nerve motor nuclei outright, and zebrafish lacking the mafba ortholog show
          absent or hypoplastic abducens nuclei, so the requirement is conserved across vertebrates.
        cell_types:
        - preferred_term: abducens motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: rhombomere 5 development
          term:
            id: GO:0021571
            label: rhombomere 5 development
          modifier: DECREASED
        - preferred_term: abducens motor neuron fate specification
          term:
            id: GO:0048665
            label: neuron fate specification
          modifier: DECREASED
      selected_evidence:
        snippet: Using Hox/lacZ transgenic mice as reporter lines and by analyzing Eph/ephrin expression,
          we have found that while r5 fails to form in these mice, r6 is present. This shows that kreisler
          has an early role in the formation of r5.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10395784
      reference_title: The role of kreisler in segmentation during hindbrain development.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that the mouse MAFB ortholog is required to form rhombomere 5, the hindbrain
        segment from which the abducens motor neurons arise.
