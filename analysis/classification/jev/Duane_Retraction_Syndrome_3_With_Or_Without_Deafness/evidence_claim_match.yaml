      assertion:
        discussion_id: mafb_renal_arm_scope
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Should proteinuric kidney disease be treated as part of Duane retraction syndrome 3, or
          as a separate MAFB-related renal disease that sometimes co-occurs with it?
        attaches_to:
        - pathophysiology#Impaired Podocyte Differentiation and Glomerular Filtration Barrier Failure
        rationale: 'The MONDO and OMIM labels for this entity name deafness and not kidney disease, yet
          every affected member of the two families that defined the p.Leu239Pro allele had focal segmental
          glomerulosclerosis, and a more recently reported family includes a carrier with an isolated
          renal phenotype and no ocular involvement at all. This entry curates the renal arm on the strength
          of a 2026 report stating that DRS3 may co-occur with proteinuric kidney disease, but the boundary
          is genuinely unsettled: the same bZIP alleles are also reported under headings such as MAFB-associated
          glomerulopathy. The practical question is whether a carrier with kidney disease alone should
          be recorded as having this entity. Until a nosological decision is made, this entry keeps the
          renal features and marks them as variable rather than defining.'
      selected_evidence:
        snippet: 'Duane retraction syndrome 3 (DRS3; OMIM #617041), a congenital ocular cranial dysinnervation
          disorder that may co-occur with proteinuric kidney disease.'
        supports: SUPPORT
