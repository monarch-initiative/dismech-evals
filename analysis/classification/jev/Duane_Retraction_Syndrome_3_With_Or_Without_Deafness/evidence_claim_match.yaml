        mechanism_confidence: ESTABLISHED
        description: The abducens motor neurons are born in hindbrain rhombomere 5, and the mouse MAFB
          ortholog kreisler is required for that segment to form at all. When MAFB function drops, rhombomere
          5 identity is not established and the abducens motor neuron pool is not specified. Mafb-null
          mice lack the sixth nerve motor nuclei outright, and zebrafish lacking the mafba ortholog show
          absent or hypoplastic abducens nuclei, so the requirement is conserved across vertebrates.
