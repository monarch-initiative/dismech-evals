  335b43390c55f634a78d332ae9ca1987a1d63cd0fc84e3a13255364f98963d38:
    claim:
      about:
        disease:
          name: Duane Retraction Syndrome 3 With Or Without Deafness
          disease_term:
            preferred_term: Duane retraction syndrome 3 with or without deafness
            term:
              id: MONDO:0014880
              label: Duane retraction syndrome 3 with or without deafness
        context: []
      assertion_type: Genetic
      assertion:
        name: MAFB
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: MAFB (large-MAF bZIP transcription factor)
          term:
            id: hgnc:6408
            label: MAFB
        notes: 'MAFB is the sole gene attributed to this entity. It is intronless, so the coding sequence
          is a single exon, and the protein has two functionally separable parts: an N-terminal transactivation
          domain and a C-terminal basic leucine zipper that carries both the DNA-binding basic region
          and the dimerization zipper. Which domain a variant lands in predicts which MAFB disease results.
