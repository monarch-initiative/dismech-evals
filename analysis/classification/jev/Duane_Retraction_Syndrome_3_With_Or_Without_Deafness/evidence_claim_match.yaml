      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acquired Sixth Cranial Nerve Palsy
        description: The differential that matters most in practice, because it is the one with a treatable
          and sometimes dangerous cause behind it. An abduction deficit acquired later in life may signal
          raised intracranial pressure, a demyelinating lesion, microvascular ischaemia or a skull-base
          mass, none of which is compatible with a congenital dysinnervation disorder.
        distinguishing_features:
        - Onset is acquired, not congenital and non-progressive.
        - No globe retraction and no palpebral fissure narrowing on adduction, because there is no aberrant
          oculomotor co-innervation to co-contract the horizontal recti.
        - The abducens nerve is present on high-resolution MRI, whereas it is absent or hypoplastic in
          this entity.
        - No family history and no MAFB variant.
      selected_evidence:
        snippet: Duane syndrome is a strabismus condition clinically characterized by congenital non-progressive
          limited horizontal eye movement accompanied by globe retraction which results in narrowing of
          the palpebral fissure.
        supports: SUPPORT
