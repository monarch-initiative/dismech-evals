      assertion_type: Discussion
      assertion:
        discussion_id: mafb_het_mouse_dose_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does one copy of MAFB p.Leu239Pro cause focal segmental glomerulosclerosis and Duane
          retraction syndrome in a person, while the dose-matched heterozygous knock-in mouse stays healthy?
        attaches_to:
        - pathophysiology#Impaired Podocyte Differentiation and Glomerular Filtration Barrier Failure
        - pathophysiology#MAFB Transcriptional Output Falls Below Its Developmental Threshold
        rationale: 'The threshold model this entry is built on predicts that phenotype tracks the size
          of the shortfall in MAFB output. The mouse puts a number on where that threshold sits, and it
          is not in the same place in the two species: in the mouse, one mutant copy is tolerated and
          only the homozygote is affected, whereas in people one copy produces glomerulosclerosis and
          a cranial nerve that never formed. This is not a missing experiment; the heterozygote was examined
          and was normal. It matters for interpretation, because a negative result in a heterozygous mouse
          would otherwise look like evidence against a human MAFB allele being pathogenic, and it matters
          for the model, because it says the threshold is a property of the species and not of the protein.
          Candidate explanations include a difference in how much MafB the developing mouse glomerulus
          and hindbrain actually need, the far longer period over which a human glomerulus must be maintained,
          and modifier background. None has been tested.'
        proposed_experiments:
        - experiment_id: mafb_het_dose_output_comparison
          name: Quantify MAFB target-gene output at matched heterozygous dose in both species
          description: Measure MARE-driven target-gene transcription in podocytes and in rhombomere-5-derived
            motor neurons from heterozygous mouse and from human induced pluripotent stem cell lines carrying
            the same substitution, to establish whether the two species differ in residual output or in
            sensitivity to the same residual output.
      selected_evidence:
        snippet: Genetic analyses revealed that affected individuals harbor a rare heterozygous substitution
          (p.Leu239Pro) in MAFB, a leucine zipper transcription factor.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
