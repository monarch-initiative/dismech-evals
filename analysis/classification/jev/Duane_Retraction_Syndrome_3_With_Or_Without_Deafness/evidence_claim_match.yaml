      reference: PMID:40162949
      reference_title: Gene Identification for Ocular Congenital Cranial Motor Neuron Disorders Using
        Human Sequencing, Zebrafish Screening, and Protein Binding Microarrays.
      evidence_source: IN_VITRO
      explanation: An independent biophysical assay showing that a further MAFB variant from a cranial
