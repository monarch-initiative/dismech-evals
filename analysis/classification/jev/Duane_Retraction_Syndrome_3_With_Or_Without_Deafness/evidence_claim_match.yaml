              label: Duane retraction syndrome 3 with or without deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MAFB Transcriptional Output Falls Below Its Developmental Threshold
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: MAFB is a single-exon large-MAF basic leucine zipper transcription factor that homodimerizes
          and binds MAF recognition elements (MAREs) to drive transcription of nearby target genes. The
          DURS3 alleles reduce that output by two routes. Heterozygous truncating and other loss-of-function
          alleles halve the dose; missense alleles in or beside the C-terminal DNA-binding region, of
          which p.Leu239Pro is the best characterized, leave a protein that cannot engage the MARE and
          can additionally poison the wild-type partner in the dimer, giving a dominant-negative allele.
          Engle and colleagues framed the resulting allelic series as a threshold model, in which the
          depth of the shortfall determines how much of the MAFB-dependent developmental program is lost
          and therefore how far the phenotype extends beyond the eye.
        molecular_functions:
        - preferred_term: sequence-specific MARE binding by the MAFB bZIP domain
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: MAFB
            term:
              id: hgnc:6408
              label: MAFB
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous germline MAFB alleles. Three loss-of-function alleles and one dominant-negative
            missense allele were reported in the founding cohort; subsequently reported DURS3-spectrum
            missense alleles cluster in or beside the bZIP DNA-binding region.
      selected_evidence:
        snippet: In addition, protein binding microarrays demonstrated reduced or abolished DNA binding
          of human variants of uncertain significance in known and novel sequence-derived transcription
          factors PHOX2A (p.(Trp137Cys)), MAFB (p.(Glu223Lys)), and OLIG2 (p.(Arg156Leu)).
        supports: SUPPORT
