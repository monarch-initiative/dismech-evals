      assertion:
        name: CHN1- and SALL4-Related Duane Syndrome
        description: The genetic siblings, and the hardest differential of all, because the ocular phenotype
          can be indistinguishable. Only sequencing separates them, and the distinction matters because
          the extraocular surveillance differs.
        distinguishing_features:
        - CHN1 (DURS2) acts by gain of function in alpha2-chimaerin rather than loss of a transcription
          factor, and carries no deafness or renal involvement.
        - SALL4 produces the Duane-radial ray (Okihiro) spectrum, with radial ray limb anomalies absent
          from the MAFB form.
        - Neither carries the sensorineural hearing loss or proteinuric kidney disease that make a MAFB
          diagnosis change surveillance.
      selected_evidence:
        snippet: Duane retraction syndrome, the most common CCDD, results from the absence of the abducens
          nerve and innervation of the lateral rectus by oculomotor nerve axons; causative genes include
          CHN1, MAFB, HOXA1, SALL4, and EBF3, although most cases do not have a genetic diagnosis.
        supports: SUPPORT
