      assertion_type: Pathophysiology
      assertion:
        name: TRPC/SOCE-mediated Calcium Entry
        description: A parallel pathologic calcium entry route in dystrophic muscle operating through
          transient receptor potential canonical (TRPC) cation channels and STIM1-ORAI1 store-operated
          calcium entry (SOCE) complexes. Genetic studies in mice show that activation of these channels
          alone is sufficient to recapitulate the dystrophic phenotype, and that inhibiting them ameliorates
          pathology in mdx and delta-sarcoglycan-deficient models. This mechanism operates downstream
          of the unstable sarcolemma but independently of direct membrane rupture as a route of calcium
          influx.
        cell_types:
        - preferred_term: Skeletal Muscle Fiber
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        - preferred_term: Cardiac Muscle Cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Store-Operated Calcium Entry
          modifier: INCREASED
          term:
            id: GO:0002115
            label: store-operated calcium entry
        - preferred_term: Calcium Ion Transmembrane Transport
          modifier: INCREASED
          term:
            id: GO:0070588
            label: calcium ion transmembrane transport
      selected_evidence:
        snippet: overexpression of transient receptor potential canonical 3 (TRPC3) and the associated
          increase in calcium influx resulted in a phenotype of muscular dystrophy nearly identical to
          that observed in DGC-lacking dystrophic disease models
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/0
      context_paths:
