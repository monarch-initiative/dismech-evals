            features: 'DMD is an X-linked dystrophinopathy in which Duchenne severity usually follows
              the reading-frame rule: out-of-frame or truncating variants abolish functional dystrophin,
              while in-frame variants can preserve partially functional dystrophin and cause milder Becker
              or intermediate phenotypes. Variant class determines eligibility for mutation-specific therapies
              such as exon skipping or stop-codon readthrough.'
            notes: Contemporary cohort data continue to show that exonic deletions are the most common
              mutation class, followed by duplications and truncating or splice-disrupting sequence variants.
              Genotype-phenotype prediction is strong but not absolute because transcript processing,
              residual dystrophin, and mutation position can modify severity.
