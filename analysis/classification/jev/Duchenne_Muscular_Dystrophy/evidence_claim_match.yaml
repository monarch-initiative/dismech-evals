    claim:
      about:
        disease:
          name: Duchenne Muscular Dystrophy
          disease_term:
            preferred_term: Duchenne muscular dystrophy
            term:
              id: MONDO:0010679
              label: Duchenne muscular dystrophy
        context: []
      assertion_type: ComputationalModel
      assertion:
        name: Yoon multivariate DMD progression and virtual-trial models
        description: Five nonlinear mixed-effects progression models derived from the prospective longitudinal
          ImagingNMD cohort. Each model couples six-minute walk distance to MRI transverse relaxation
          time in one leg muscle and simulates how age, steroid use, baseline function, and baseline imaging
          alter virtual-patient trajectories.
        model_type: DIGITAL_TWIN
        repository_url: https://app.cop.ufl.edu/dmd/
        model_id: DMD-6MWD-MRI-T2-multivariate-models
        model_software: Monolix, Simulx, and R
        model_format: Nonlinear mixed-effects sigmoid Imax and Emax models
        publication: PMID:38609673
        modeled_mechanisms:
        - target: Progressive Muscle Degeneration
          relationship: MEASURES
          fidelity: MODERATE
          description: Uses age-dependent decline in walking distance and rise in muscle MRI-T2 to estimate
            heterogeneous human DMD progression trajectories.
          limitations: This is a cohort-derived statistical virtual-patient model rather than a mechanistic
            tissue twin. It was developed in individuals ambulatory at baseline, excludes disease-modifying
            treatment effects, and does not represent the early developmental gain in walking ability
            before age five.
        - target: Fibrofatty Muscle Replacement
          relationship: MEASURES
          fidelity: MODERATE
          description: Treats longitudinal muscle MRI-T2 as a quantitative imaging readout associated
            with replacement of contractile muscle by noncontractile tissue.
          limitations: MRI-T2 is not specific to fat or fibrosis and can also reflect edema and inflammation;
            muscle-specific trajectories cannot be generalized to every skeletal muscle or to cardiac
            tissue.
        variables:
        - name: Six-minute walk distance
          dataset_identifier: 6MWD
          description: Distance walked during the six-minute walk test
          unit: m
        - name: Muscle MRI transverse relaxation time
          dataset_identifier: MRI_T2
          description: MRI-T2 for one of five modeled leg muscles
          unit: ms
        - name: Age at assessment
          dataset_identifier: Age
          description: Time metric for the disease-progression trajectories
          unit: years
        - name: Steroid use
          dataset_identifier: steroid_use
          description: Covariate indicating corticosteroid treatment status
          unit: categorical
        - name: Half-maximal functional decline age
          dataset_identifier: DPT50_6MWD
          description: Age at which six-minute walk distance reaches half its maximum decrease
          unit: years
        - name: Half-maximal MRI-T2 increase age
          dataset_identifier: DPT50_MRI_T2
          description: Age at which muscle MRI-T2 reaches half its maximum increase
          unit: years
        findings:
        - statement: Sigmoid Imax and Emax functions best captured functional decline and MRI-T2 increase,
            with steroid use and baseline functional and imaging values as significant covariates.
        - statement: The five models produced similar half-decline ages for walking distance but muscle-specific
            half-increase ages for MRI-T2.
        notes: The public simulator supports real and virtual populations for trial-design use. The DIGITAL_TWIN
          label denotes individualized covariate-conditioned trajectories, not a mechanistic or continuously
          updated personal twin; clinical use beyond trial simulation would require external validation
          in the intended population.
      selected_evidence:
        snippet: Disease progression models were developed by a nonlinear mixed-effect modeling approach.
