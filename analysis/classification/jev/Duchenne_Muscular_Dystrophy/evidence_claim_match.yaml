      assertion_type: Pathophysiology
      assertion:
        name: DMD Loss-of-Function Variants
        description: Duchenne muscular dystrophy is caused by pathogenic variants in the X-linked DMD
          gene that abolish or severely reduce functional dystrophin. Out-of-frame deletions, duplications,
          nonsense, frameshift, and splice-disrupting variants typically produce the Duchenne phenotype,
          whereas in-frame variants that preserve partially functional dystrophin more often produce Becker
          or intermediate dystrophinopathy.
        gene:
          preferred_term: DMD
          modifier: DECREASED
          term:
            id: hgnc:2928
            label: DMD
      selected_evidence:
        snippet: Duchenne/Becker muscular dystrophies (DMD/BMD) lead to progressive irreversible muscle
          deterioration caused by recessive mutations in the dystrophin encoding gene (Xp21.1). Approximately
          60% of mutations are deletions, 10% are duplications and the remaining 30% are point mutations.
        supports: SUPPORT
    origin:
