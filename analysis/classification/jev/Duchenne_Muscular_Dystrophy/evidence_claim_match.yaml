        description: Follow-up use of the skeletal-muscle agent-based framework to vary extracellular-matrix
          area fraction and protein density, predict their effects on cell migration, growth-factor diffusion,
          and 28-day regeneration, and compare the prediction with TGF-beta-treated mdx mouse experiments.
        model_type: AGENT_BASED
        model_id: Virgilio-mdx-fibrosis-regeneration-2021
        base_model: Virgilio-mdx-muscle-regeneration-2018
        model_software: Repast
        model_format: Java agent-based simulation with two-dimensional muscle geometry
        publication: PMID:32748106
        modeled_mechanisms:
        - target: Fibrofatty Muscle Replacement
          relationship: PERTURBS
          fidelity: LOW
          description: Independently varies extracellular-matrix occupied area and effective protein density
            to test how distinct fibrosis properties affect regeneration.
          limitations: Fibrosis is represented by area fraction and density in mdx mouse muscle; matrix
            composition, architecture, fatty infiltration, and years-long human disease evolution are
            not represented.
        - target: Failed Satellite Cell Regeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Predicts regeneration loss through restricted cell migration and growth-factor
            diffusion, then revises that prediction when matrix density is reduced.
          limitations: Regeneration is assessed using cross-sectional area 28 days after an acute injury,
            not human muscle function or longitudinal DMD progression.
        variables:
        - name: Extracellular matrix area fraction
          dataset_identifier: ECM_area_fraction
          description: Fraction of the simulated cross-section occupied by extracellular matrix
          unit: fraction
        - name: Extracellular matrix protein density
          dataset_identifier: ECM_protein_density
          description: Effective matrix density controlling stiffness and transport constraints
          unit: relative density
        - name: Growth-factor diffusion
          dataset_identifier: growth_factor_diffusion
          description: Effective diffusion of regenerative signals through extracellular matrix
          unit: relative diffusivity
        - name: Cell migration
          dataset_identifier: cell_migration
          description: Effective movement of regenerative cells through the matrix
          unit: relative migration rate
        - name: Muscle cross-sectional area recovery
          dataset_identifier: CSA_day_28
          description: Regenerated muscle area at 28 days after injury
          unit: relative area
        findings:
        - statement: Increasing simulated fibrotic area initially reduced day-28 regeneration by limiting
            growth-factor diffusion and cell migration.
        - statement: The TGF-beta experiment did not show the predicted recovery difference; additional
            simulations reproduced that negative result when matrix protein density was reduced, showing
            that area fraction alone was insufficient.
        notes: 'This follow-up is especially useful as a negative-result case: the first model prediction
          failed when fibrosis area increased but matrix density fell. It should not be generalized from
          mdx mice to antifibrotic efficacy in people with DMD.'
      selected_evidence:
        snippet: This study (1) used an agent-based model to predict the effect of increased fibrosis
          in mdx muscle on regeneration from injury, and (2) experimentally tested the resulting model-derived
          hypothesis.
        supports: SUPPORT
