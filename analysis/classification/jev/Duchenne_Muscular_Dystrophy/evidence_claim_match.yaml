  75542860a431980dd6558ceb31a78b5f5412f5d412ef300b6f1888610fb28d0f:
    claim:
      about:
        disease:
          name: Duchenne Muscular Dystrophy
          disease_term:
            preferred_term: Duchenne muscular dystrophy
            term:
              id: MONDO:0010679
              label: Duchenne muscular dystrophy
        context: []
      assertion_type: ComputationalModel
      assertion:
        name: Virgilio agent-based model of regeneration in healthy and mdx skeletal muscle
        description: Spatial stochastic model of an acutely injured mouse muscle cross-section in which
          muscle fibers, extracellular matrix, necrotic tissue, fibroblasts, satellite stem cells, myogenic
          progenitors, neutrophils, and macrophage states interact over 28 days. Disease scenarios alter
          microenvironmental cell behaviors and initial injury using age-specific mdx experimental observations.
        model_type: AGENT_BASED
        model_id: Virgilio-mdx-muscle-regeneration-2018
        model_software: Repast
        model_format: Java agent-based simulation with histology-derived two-dimensional geometry
        publication: PMID:30070607
        modeled_mechanisms:
        - target: Failed Satellite Cell Regeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Simulates satellite-cell activation, proliferation, differentiation, and their
            contribution to recovery of injured muscle cross-sectional area.
          limitations: The model represents acute injury in young and aged mdx mouse muscle, not chronic
            human DMD progression; mdx disease is substantially milder than the human disorder, and cross-sectional
            area is not a direct measure of strength.
        - target: Chronic Muscle Inflammation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Represents neutrophils and multiple pro- and anti-inflammatory macrophage states
            as regulators of regeneration after contraction-induced injury.
          limitations: Immune behavior is encoded as literature-derived rules in a two-dimensional acute-injury
            setting and omits systemic immunity and the chronic inflammatory history of human DMD muscle.
        - target: Fibrofatty Muscle Replacement
          relationship: MEASURES
          fidelity: LOW
          description: Tracks fibroblast and extracellular-matrix behavior as microenvironmental determinants
            of regeneration in mdx scenarios.
          limitations: The model does not reproduce long-term fatty replacement and only represents a
            small muscle cross-section over 28 days.
        variables:
        - name: Initial injured muscle fraction
          dataset_identifier: initial_injury
          description: Fraction of the simulated muscle cross-section replaced by necrotic tissue
          unit: fraction
        - name: Satellite stem cell count
          dataset_identifier: SSC_count
          description: Number of quiescent and activated satellite stem-cell agents
          unit: cells
        - name: Fibroblast count
          dataset_identifier: fibroblast_count
          description: Number of fibroblast and myofibroblast agents
          unit: cells
        - name: Anti-inflammatory macrophage count
          dataset_identifier: M2_count
          description: Number of anti-inflammatory macrophage agents
          unit: cells
        - name: Muscle cross-sectional area recovery
          dataset_identifier: CSA_recovery
          description: Recovered muscle-fiber area 28 days after simulated injury
          unit: percent of pre-injury area
        findings:
        - statement: Recovery at day 28 depended on peak satellite stem-cell abundance, with suppressed
            peaks emerging in the impaired-regeneration aged-mdx scenario.
        - statement: Fibroblast and anti-inflammatory macrophage populations influenced satellite stem-cell
            abundance, but no single altered parameter explained the disease difference.
        notes: No durable public deposit of the exact 2018 Repast implementation was identified. This
          is an mdx mouse model, not a human or patient-specific DMD digital twin; its value is hypothesis
          generation about regeneration microenvironments.
      selected_evidence:
        snippet: The goals of this project were to 1) develop an agent-based model of skeletal muscle
          that predicts the dynamic regenerative response of muscle cells, fibroblasts, SSCs, and inflammatory
          cells as a result of contraction-induced injury, 2) calibrate and validate the model parameters
          based on comparisons with published experimental measurements, and 3) use the model to investigate
          how changing isolated and combined factors known to be associated with DMD (e.g., altered fibroblast
          or SSC behaviors) influence muscle regeneration.
        supports: SUPPORT
    origin:
      assertion_path: /computational_models/0
      evidence_path: /computational_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
