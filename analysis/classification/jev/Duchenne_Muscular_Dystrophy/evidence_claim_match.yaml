        context:
        - path: /discussions/0
          value:
            discussion_id: gap_dmd_microdystrophin_fibrosis_reversal
            prompt: Does restored dystrophin or microdystrophin expression reverse established skeletal-muscle
              and myocardial fibrosis in DMD, or does it mainly stabilize sarcolemmal injury before fibrotic
              remodeling becomes self-sustaining?
            kind: KNOWLEDGE_GAP
            status: OPEN
            attaches_to:
            - pathophysiology#Dystrophin Deficiency
            - pathophysiology#Sarcolemmal Fragility
            - pathophysiology#Fibrofatty Muscle Replacement
            - pathophysiology#Myocardial Fibrosis
            rationale: The entry already captures dystrophin loss, membrane fragility, chronic degeneration,
              and fibrofatty replacement. Recent human engineered-muscle work suggests that membrane stabilization
              and profibrotic signaling can decouple, making the reversibility of established fibrosis
              a distinct therapeutic knowledge gap rather than a simple proxy for dystrophin expression.
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: exp_dmd_fibrotic_myorganoid_microdystrophin_rescue
        name: Fibrotic patient-derived DMD MYOrganoid microdystrophin rescue assay
        description: Build patient-derived iPSC skeletal-muscle MYOrganoids with a fibroblast niche and
          induced fibrotic maturation, deliver microdystrophin before or after fibrotic priming, and compare
          membrane stability, contractile fatigue, and extracellular-matrix remodeling.
        experiment_type:
          preferred_term: patient-derived organoid perturbation experiment
        model_systems:
        - name: Patient-derived DMD skeletal-muscle MYOrganoid with fibroblast niche
          description: Three-dimensional iPSC-derived skeletal-muscle organoid containing fibroblasts
            so dystrophic membrane injury, repeated-contraction fatigue, and profibrotic muscle-fibroblast
            signaling can be measured in the same standardized human model.
          experimental_model_type: ORGANOID
          namo_type: namo:Organoid
          organism:
            preferred_term: human
            term:
              id: NCBITaxon:9606
              label: Homo sapiens
          tissue_term:
            preferred_term: skeletal muscle tissue
            term:
              id: UBERON:0001134
              label: skeletal muscle tissue
          cell_types:
          - preferred_term: skeletal muscle cell
          - preferred_term: fibroblast
            term:
              id: CL:0000057
              label: fibroblast
          cell_source: patient-derived iPSC-derived myogenic cells plus matched fibroblasts
          culture_system: collagen-based 3D engineered muscle ring with eccentric-contraction challenge
        perturbations:
        - name: Microdystrophin gene transfer
          target: pathophysiology#Dystrophin Deficiency
          description: AAV-like microdystrophin delivery or matched genetic rescue used to restore dystrophin-family
            membrane support in the engineered tissue.
          treatment_term:
            preferred_term: gene therapy
            term:
              id: NCIT:C15238
              label: Gene Therapy
        - name: Fibrotic niche priming
          target: pathophysiology#Fibrofatty Muscle Replacement
          description: Fibroblast-containing dystrophic culture conditions, optionally with TGF-beta pathway
            stimulation, used to establish a profibrotic baseline before rescue.
          biological_processes:
          - preferred_term: extracellular matrix organization
            term:
              id: GO:0030198
              label: extracellular matrix organization
        readouts:
        - name: Sarcolemmal membrane stability
          target: pathophysiology#Sarcolemmal Fragility
          description: Dye-exclusion or membrane-leak readout after eccentric contraction.
          assays:
          - preferred_term: membrane permeability assay
          direction: NEGATIVE
        - name: Contractile force and fatigue resistance
          target: pathophysiology#Progressive Muscle Degeneration
          description: Electrical-stimulation force and fatigue readouts in matched tissue rings.
          assays:
          - preferred_term: contractility assay
          direction: NEGATIVE
        - name: Profibrotic extracellular-matrix signaling
          target: pathophysiology#Fibrofatty Muscle Replacement
          description: Collagen, fibronectin, and TGF-beta-responsive transcriptional readouts interpreted
            as persistence or resolution of fibrotic remodeling.
          biological_processes:
          - preferred_term: extracellular matrix organization
            term:
              id: GO:0030198
              label: extracellular matrix organization
          assays:
          - preferred_term: single-cell transcriptomic profiling
          - preferred_term: extracellular matrix immunostaining
          direction: NEGATIVE
        controls:
        - name: Isogenic corrected MYOrganoid
          description: DMD-corrected tissue carrying the same genetic background.
        - name: Empty-vector DMD MYOrganoid
          description: Dystrophic organoid receiving vector or delivery control without microdystrophin.
        decision_criterion: Reversal is supported if delayed microdystrophin rescue improves membrane
          stability and contractile fatigue while reducing profibrotic extracellular-matrix readouts toward
          isogenic-corrected levels. Stabilization-only is supported if membrane and force readouts improve
          but fibrotic signaling remains elevated.
        would_support:
        - pathophysiology#Sarcolemmal Fragility
        - pathophysiology#Fibrofatty Muscle Replacement
        - pathophysiology#Myocardial Fibrosis
      selected_evidence:
        snippet: Western blot analysis of dystrophin content demonstrated an 11.6-fold increase
        supports: SUPPORT
