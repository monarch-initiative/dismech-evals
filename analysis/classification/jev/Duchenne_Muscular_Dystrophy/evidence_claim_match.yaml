        context: []
      assertion_type: Treatment
      assertion:
        name: Delandistrogene Moxeparvovec
        description: AAVrh74-based gene therapy (Elevidys/SRP-9001) that delivers a truncated micro-dystrophin
          transgene to muscle fibers via systemic intravenous administration. In a 2026 meta-analysis
          of ambulatory pediatric DMD patients, delandistrogene moxeparvovec significantly improved functional
          outcomes and increased dystrophin expression at 1-year follow-up. Administration carries substantial
          immune-mediated toxicity risk - principally AAV-capsid-directed hepatotoxicity (acute liver
          injury, with liver failure and death reported), plus myositis, myocarditis, and troponin elevation
          - requiring immunoprophylaxis and structured post-infusion hepatic and cardiac monitoring.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: At 1 year, the therapy significantly improved NSAA scores (MD = 2.48, p = 0.04) and TTR
          (MD = -0.85, p < 0.01). Sensitivity analysis demonstrated improved 10MWR (MD = -0.71, p = 0.02).
          Muscle dystrophin content significantly increased (MD = 28.39, p < 0.01).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/8
      evidence_path: /treatments/8/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42396397
      reference_title: 'Duchenne Muscular Dystrophy and Delandistrogene Moxeparvovec Gene Therapy in Children:
        A Systematic Review and Meta-Analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: 2026 systematic review and meta-analysis of 4 studies (302 participants, 107 on delandistrogene
        moxeparvovec) demonstrates significant improvement in NSAA (a functional outcome measure), time-to-rise,
        10-meter walk/run, and dystrophin expression at 1-year follow-up in ambulatory pediatric DMD patients.
