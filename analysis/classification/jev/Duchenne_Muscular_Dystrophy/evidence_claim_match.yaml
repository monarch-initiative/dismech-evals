      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_dystrophin_loss_membrane_fragility_model
        hypothesis_label: Canonical Dystrophin Loss and Membrane Fragility Model
        status: CANONICAL
        description: Out-of-frame DMD variants abolish functional dystrophin, the cytoskeletal link between
          cytoplasmic F-actin and the sarcolemmal dystrophin-glycoprotein complex (DGC). Without dystrophin
          the DGC is destabilized at the sarcolemma, leaving muscle fibers vulnerable to contraction-induced
          mechanical injury, calcium influx through stretched/damaged membrane, and activation of calcium-dependent
          proteases. Repeated cycles of fiber necrosis, satellite-cell-driven regeneration, chronic inflammation,
          and progressive fibro-fatty replacement of muscle ultimately exhaust regenerative capacity,
          producing the characteristic progressive proximal weakness, cardiomyopathy, respiratory failure,
          and short life expectancy of Duchenne muscular dystrophy. Exon-skipping and gene-replacement
          therapies that restore even partial dystrophin expression provide interventional validation
          of this canonical chain.
      selected_evidence:
        snippet: The severe Duchenne and milder Becker muscular dystrophy are both caused by mutations
        supports: SUPPORT
    origin:
