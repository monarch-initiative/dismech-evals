          value:
            name: DKCD
            display_name: Dyskeratosis congenita, digenic (TYMS-ENOSF1)
            description: 'Dyskeratosis congenita in which affected individuals inherit a germline TYMS
              coding variant from one parent and a haplotype with rare variants in the TYMS antisense
              regulator ENOSF1 from the other. Neither parent is affected, so transmission is digenic
              rather than autosomal recessive at a single locus despite appearing recessive in the pedigree.
              The mechanism is nucleotide metabolic rather than telomerase or shelterin: TYMS is silenced
              post-transcriptionally by elevated ENOSF1, deoxyribonucleotide triphosphate pools are altered,
              and telomere maintenance becomes abnormal downstream of that. Affected cells are hypersensitive
              to the TYMS-specific inhibitor 5-fluorouracil.

              This row carries the genes and the mode of inheritance for the parent pathograph; the disease
              itself is curated as its own entry, Dyskeratosis_Congenita_Autosomal_Recessive_8, which
              is bound to the wrong identifier. No subtype_term is bound here so that the duplicate binding
              is not created a second time; see the entry notes.'
            genes:
            - preferred_term: TYMS
              term:
                id: hgnc:12441
                label: TYMS
            - preferred_term: ENOSF1
              term:
                id: hgnc:30365
                label: ENOSF1
          role: subtype
      assertion_type: Genetic
      assertion:
        name: TYMS
        association: Loss of function
        subtype: DKCD
        gene_term:
          preferred_term: TYMS
          term:
            id: hgnc:12441
            label: TYMS
        notes: TYMS is the first of the two loci in the digenic form. Affected probands carry a heterozygous
