              in individuals with a dyskeratosis congenita / Hoyeraal-Hreidarsson phenotype: early-onset
              hypocellular bone marrow failure, B and NK lymphopenia, developmental anomalies, microcephaly
              and intrauterine growth retardation. All reported patients carry a missense variant at the
              same catalytic-domain residue, L142.

