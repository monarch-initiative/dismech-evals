      assertion:
        discussion_id: gap_dc_unexplained_genetic_cause
        prompt: What accounts for the roughly 20% of clinically diagnosed dyskeratosis congenita / telomere
          biology disorder cases in which no pathogenic variant is identified in any of the 16 known DC/TBD
          genes?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Telomere Maintenance
        rationale: GeneReviews reports that pathogenic variants in the 16 known DC/TBD genes are identified
          in approximately 80% of individuals meeting clinical diagnostic criteria, leaving roughly one
          in five clinically diagnosed patients genetically unexplained. These cases likely harbor variants
          in undiscovered genes, non-coding or structural variants in known loci, or somatic/mosaic events
          not captured by standard testing. Resolving this gap would extend the mechanistic chain (impaired
          telomere maintenance) to currently uncharacterized molecular causes and improve molecular diagnosis
          and counseling.
      selected_evidence:
        snippet: in approximately 80% of individuals who meet
        supports: SUPPORT
