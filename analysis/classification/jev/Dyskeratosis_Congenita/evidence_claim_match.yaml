          value:
            name: PFBMFT3
            display_name: RTEL1-related pulmonary fibrosis and/or bone marrow failure, telomere-related,
              3
            subtype_term:
              preferred_term: pulmonary fibrosis and/or bone marrow failure, Telomere-related, 3
              term:
                id: MONDO:0014613
                label: pulmonary fibrosis and/or bone marrow failure, Telomere-related, 3
            description: 'The adult, pulmonary-predominant RTEL1 presentation, and the third locus of
              the numbered telomere-related pulmonary fibrosis / bone marrow failure series (OMIM 616373).
              It is the dominant, later-onset half of a gene whose recessive half is Hoyeraal-Hreidarsson
              syndrome and severe childhood DC, and it is defined by two 2015 exome studies of familial
              pulmonary fibrosis.

              In the larger of the two, heterozygous rare RTEL1 variants segregated with familial interstitial
              pneumonia in nine of 188 kindreds - one of the original 25 exome families and eight of a
              further 163 - a yield of about five percent. The second study found RTEL1 significantly
              enriched for new damaging and missense variants at conserved residues in familial pulmonary
              fibrosis cases against 2,816 controls, and put RTEL1 and PARN together at roughly seven
              percent of familial pulmonary fibrosis.

              Two features distinguish this subtype from the gene-level RTEL1 row above rather than merely
              renaming it. Penetrance is incomplete in a way the childhood presentations are not: unaffected
              carriers in these families have short telomeres too, so the short-telomere phenotype and
              the lung disease come apart. And the functional signature reported alongside it is increased
              T-circle formation, the excised telomere loops that accumulate when the helicase fails to
              dismantle T-loops properly - which places the lesion at RTEL1''s specific biochemical job
              rather than at telomerase.'
            genes:
            - preferred_term: RTEL1
              term:
                id: hgnc:15888
                label: RTEL1
          role: subtype
      assertion_type: Genetic
      assertion:
        name: RTEL1-PFBMFT3
        gene_term:
          preferred_term: RTEL1
          term:
            id: hgnc:15888
            label: RTEL1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        subtype: PFBMFT3
        notes: 'The dominant, adult, pulmonary-led route into this entry through RTEL1, separated from
          the record above because the zygosity, age of onset and lead organ differ: heterozygous rare
          variants, adult onset, pulmonary fibrosis rather than the mucocutaneous triad. Penetrance is
          incomplete - unaffected heterozygous carriers in these families have short telomeres without
          lung disease - which is a property of this route specifically and not of the childhood recessive
          one. The mechanism ClinGen records for the gene as a whole is loss of function; the Genetic
          class carries no slot for that, so it is noted here.'
      selected_evidence:
        snippet: Evaluation of affected individuals in 163 additional kindreds revealed another eight
          families (4.7%) with heterozygous rare variants in RTEL1 that segregated with clinical FIP.
        supports: SUPPORT
