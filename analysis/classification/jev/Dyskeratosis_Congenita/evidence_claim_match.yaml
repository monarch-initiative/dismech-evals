      assertion_type: Pathophysiology
      assertion:
        name: Stem Cell Exhaustion in High-Turnover Tissues
        description: 'Because telomere reserve restricts replicative capacity, tissues with high proliferative
          demand are preferentially affected. Premature replicative exhaustion of stem and progenitor
          cells in the bone marrow, immune system, skin and mucosa, liver, and lung produces the characteristic
          multisystem phenotype: bone marrow failure, mucocutaneous changes, and hepatic and pulmonary
          fibrosis. Genomic instability from dysfunctional telomeres also underlies the predisposition
          to myelodysplastic syndrome, leukemia, and squamous cell carcinoma.'
        cell_types:
        - preferred_term: Hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        - preferred_term: Hematopoietic precursor cell
          term:
            id: CL:0008001
            label: hematopoietic precursor cell
        - preferred_term: Pulmonary alveolar type 2 cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
      selected_evidence:
        snippet: altered telomere maintenance as observed in TBDs typically results in premature replicative
          cellular exhaustion in the respective organ systems eventually leading to life-threatening complications
          such as bone marrow failure (BMF), pulmonary fibrosis, and liver cirrhosis.
        supports: SUPPORT
    origin:
