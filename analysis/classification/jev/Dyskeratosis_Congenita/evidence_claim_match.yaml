      assertion_type: Subtype
      assertion:
        name: DCLRE1B
        display_name: Apollo/SNM1B exonuclease deficiency (DCLRE1B; OMIM DKCB8)
        description: 'Biallelic variants in DCLRE1B, encoding the 5''-to-3'' DNA exonuclease Apollo/SNM1B,
          in individuals with a dyskeratosis congenita / Hoyeraal-Hreidarsson phenotype: early-onset hypocellular
          bone marrow failure, B and NK lymphopenia, developmental anomalies, microcephaly and intrauterine
          growth retardation. All reported patients carry a missense variant at the same catalytic-domain
          residue, L142.

          This row is a deliberate exception to the short-telomere criterion the rest of this entry is
          built on. Patient cells show telomere fragility and chromosome instability without global telomere
          shortening, and the founding report frames the entity as a genome-caretaker defect that reproduces
          the DC/HH clinical picture with normal telomere length. Telomere length testing therefore does
          not distinguish it.

          No subtype_term is bound. MONDO:0859319 is the class for this disease - OMIM:620133, gene MIM
          609683 (DCLRE1B) - but that identifier is already the disease_term of the Dyskeratosis_Congenita_Autosomal_Recessive_8
          entry, which curates the digenic TYMS-ENOSF1 disease under it. Binding it here would create
          a second, conflicting use of the same term. The reasoning is in the entry notes.'
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        genes:
        - preferred_term: DCLRE1B
          term:
            id: hgnc:17641
            label: DCLRE1B
      selected_evidence:
        snippet: We identified biallelic variants in the gene encoding the 5'-to-3' DNA exonuclease Apollo/SNM1B
          in 3 unrelated patients presenting with a DC/HH phenotype consisting of early-onset hypocellular
          bone marrow failure, B and NK lymphopenia, developmental anomalies, microcephaly, and/or intrauterine
          growth retardation.
        supports: SUPPORT
