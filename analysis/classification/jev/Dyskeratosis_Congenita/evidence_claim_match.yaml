            label: dyskeratosis congenita, autosomal recessive 3
        description: 'Autosomal recessive DC caused by biallelic variants in WRAP53 (TCAB1), the telomerase
          holoenzyme protein that traffics telomerase to Cajal bodies for recruitment to telomeres. This
          is the numbered designation DKCB3 (OMIM 613988). The defining report identified compound heterozygous
          TCAB1 missense variants in DC patients and showed that they disrupt telomerase localization
          to Cajal bodies, misdirecting telomerase RNA to nucleoli so that telomerase never reaches the
          telomere to elongate it. A later consanguineous Han Chinese family homozygous for p.Arg298Trp
          extends the allelic spectrum beyond compound heterozygosity and supports the recessive mode:
          the three heterozygous relatives had no mucocutaneous symptoms and normal blood counts, while
          the proband''s lymphocyte telomere length fell below the first percentile for age. Those relatives
          were not examined by marrow biopsy or pulmonary function testing, so their carrier status is
          unaffected on clinical grounds rather than exhaustively.'
