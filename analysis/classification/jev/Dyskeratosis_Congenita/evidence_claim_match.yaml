              is built on. Patient cells show telomere fragility and chromosome instability without global
              telomere shortening, and the founding report frames the entity as a genome-caretaker defect
              that reproduces the DC/HH clinical picture with normal telomere length. Telomere length
              testing therefore does not distinguish it.

              No subtype_term is bound. MONDO:0859319 is the class for this disease - OMIM:620133, gene
              MIM 609683 (DCLRE1B) - but that identifier is already the disease_term of the Dyskeratosis_Congenita_Autosomal_Recessive_8
              entry, which curates the digenic TYMS-ENOSF1 disease under it. Binding it here would create
              a second, conflicting use of the same term. The reasoning is in the entry notes.'
            genes:
            - preferred_term: DCLRE1B
              term:
                id: hgnc:17641
                label: DCLRE1B
          role: subtype
      assertion_type: Genetic
