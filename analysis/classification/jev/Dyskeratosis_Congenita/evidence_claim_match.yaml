          and related haematopoietic disease, and in which every carrier, but no wild-type relative, has
          short telomeres. The molecular lesion is specifically a telomerase-recruitment defect rather
          than a loss of telomere binding: expressed in 293T cells the mutant protein still reaches telomeres
          but no longer brings telomerase with it. Presentation in that family was led by bone marrow
          failure rather than by the classic mucocutaneous triad; how far that generalises is not established,
          since the dominant ACD allelic series is still small.'
