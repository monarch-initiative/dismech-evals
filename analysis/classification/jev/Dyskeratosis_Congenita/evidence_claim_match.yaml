          term:
            id: MONDO:0013522
            label: dyskeratosis congenita, autosomal dominant 3
        description: 'Autosomal dominant DC caused by variants in TINF2 encoding the shelterin component
          TIN2, and the numbered designation DKCA3 (OMIM 613990). TINF2 disease is often severe and early-onset,
          and is enriched for severe variants including Revesz syndrome and progression to liver disease.

          TINF2 was found in 2008 by linkage in a family with autosomal dominant DC in which DKC1, TERC
          and TERT had already been excluded. The founding report identified K280E in a proband and five
          affected relatives, R282H in three further unrelated probands and R282S in a fifth, found none
          of them in unaffected relatives or in 298 controls, and so made TINF2 the first shelterin component
          linked to human disease. The narrow clustering of those alleles is the feature that carries
          through the rest of the TINF2 literature: the pathogenic variants sit in a short stretch of
          exon 6, and the severe phenotypes at the Revesz end of the spectrum come from the same window.'
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        genes:
        - preferred_term: TINF2
          term:
            id: hgnc:11824
            label: TINF2
      selected_evidence:
        snippet: those with heterozygous TINF2 DC were significantly younger, predominantly male, and
          more likely to have DC-associated mucocutaneous triad features and severe bone marrow failure
        supports: SUPPORT
