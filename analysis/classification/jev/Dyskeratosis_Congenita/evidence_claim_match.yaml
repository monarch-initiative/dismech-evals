        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        subtype: PFBMFT8
        notes: The second, dominant POT1 route into this entry, separated from the recessive POT1 record
          above because the allele, the zygosity and the clinical presentation all differ. Curated for
          the heterozygous p.(L259S) allele only. The allele behaves as a dominant negative rather than
          a simple null, but that classification rests on the knock-in mouse, in which telomerase overexpression
          fails to lengthen telomeres in the presence of the mutant protein; the Genetic class carries
          no slot for it, so it is recorded here.
      selected_evidence:
        snippet: Importantly, overexpression of telomerase in adult Pot1aL261S/L261S mice did not lead
          to telomere lengthening, suggesting that the POT1a-L261S mutant protein is blocking the activity
          of telomerase-elongating telomeres and acts as a dominant negative.
        supports: SUPPORT
