      assertion_type: IUISAssignment
      assertion:
        classification_value: bone marrow failure
        notes: 'IUIS 2022 phenotypic classification of inborn errors of immunity (Tangye et al., PMID:35748970),
          Table 9 "Bone marrow failure". Dyskeratosis congenita is entered in that table as a block of
          fourteen gene rows sharing one Subcategory cell: DKCX1 (DKC1, XL), DKCA1 (TERC), DKCA2 (TERT),
          DKCA3 (TINF2), DKCA4 (RTEL1), DKCA5 (TINF2), DKCA6 (ACD), DKCB1 (NOLA3), DKCB2 (NOLA2), DKCB3
          (WRAP53), DKCB4 (TERT), DKCB5 (RTEL1), DKCB6 (PARN) and DKCB7 (ACD). This entry is the union
          of that block and the assignment is made against it rather than against any one gene row. Two
          scope notes. First, the entry''s has_subtypes list is broader than the table: CTC1, STN1, RPA1,
          POT1, POLA1, NAF1 and ZCCHC8 are curated here but the CTC1 and STN1 rows appear in Table 9 under
          a separate "Coats plus syndrome" heading, and the remaining four telomere genes are not in Table
          9 at all. Second, the DKCA5 row (TINF2, AD, OMIM 268130) is Revesz syndrome, which dismech curates
          as its own entry and which carries this same assignment there. Neither point changes the membership
          of dyskeratosis congenita proper.'
      selected_evidence:
        snippet: reticulate skin pigmentation; microcephaly, neurodevelopmental delay Dyskeratosis Congenita
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
      evidence_path: /classifications/iuis_category/evidence/0
