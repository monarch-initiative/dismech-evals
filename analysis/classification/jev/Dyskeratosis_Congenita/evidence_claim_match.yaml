            label: pulmonary fibrosis and/or bone marrow failure syndrome, telomere-related, 8
        description: 'The adult, pulmonary-fibrosis-predominant POT1 presentation, and the eighth locus
          of the numbered telomere-related pulmonary fibrosis / bone marrow failure series. It is defined
          by a Dutch family carrying the heterozygous POT1 p.(L259S) allele in which idiopathic pulmonary
          fibrosis segregates dominantly with short leukocyte telomeres and genetic anticipation. This
          is the same shelterin gene as the recessive POT1 subtype above but a different clinical entity:
          dominant rather than recessive, adult rather than childhood, and led by lung disease rather
          than by the mucocutaneous triad. Mechanistically L259S is not a simple null - the mutant protein
          fails to bind the telomeric overhang, to accumulate in the nucleus, to regulate telomerase negatively
          and to support lagging-strand maintenance, and patient cells show telomere loss, telomere-induced
          DNA damage and premature senescence with G1 arrest. The evidence base is one family plus functional
          characterisation, so the phenotypic boundaries of this subtype remain provisional.'
        genes:
        - preferred_term: POT1
          term:
            id: hgnc:17284
            label: POT1
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Exonic sequencing identified a family with idiopathic pulmonary fibrosis (IPF) containing
          a previously unreported heterozygous mutation in POT1 p.(L259S).
        supports: SUPPORT
