        context: []
      assertion_type: Inheritance
      assertion:
        name: Digenic inheritance
        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
        description: Digenic inheritance applies to the TYMS-ENOSF1 form, in which a germline TYMS coding
          variant inherited from one parent and a haplotype with rare variants in the TYMS antisense regulator
          ENOSF1 inherited from the other are both required. The pedigrees look recessive, but carriers
          of either variant alone are unaffected, so this is not autosomal recessive transmission at a
          single locus. The contributing genes are curated as the DKCD subtype and as the TYMS and ENOSF1
          records in the genetic section.
      selected_evidence:
        snippet: These cell and molecular abnormalities generated by the combination of germline digenic
          variants at the TYMS-ENOSF1 locus represent a unique pathogenetic pathway for DC causation in
          these affected individuals, whereas the parents who are carriers of either of these variants
          in a singular fashion remain unaffected.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/3
      evidence_path: /inheritance/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35931051
      reference_title: Germline thymidylate synthase deficiency impacts nucleotide metabolism and causes
        dyskeratosis congenita.
      evidence_source: HUMAN_CLINICAL
      explanation: States the two-locus requirement and the unaffected single-variant carrier parents,
        which is what the HPO digenic inheritance term asserts.
