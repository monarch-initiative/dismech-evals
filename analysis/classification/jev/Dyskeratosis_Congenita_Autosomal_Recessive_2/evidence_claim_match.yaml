          and each future sibling has a 25% recurrence risk. The zygosity line is not purely academic
          here: heterozygous NHP2 variants have been reported in adults with pulmonary fibrosis and in
          families with other telomere-biology features, but ClinGen''s Interstitial Lung Disease expert
          panel excluded those heterozygous cases from the gene-disease curation because of population
          frequencies and incomplete genotyping detail, so an autosomal dominant NHP2 entity is not established.'
      selected_evidence:
        snippet: 'Autosomal recessive: CTC1, NHP2, NOP10, POT1, STN1, and WRAP53.'
