        context:
        - path: /pathophysiology/0
          value:
            name: NHP2 Loss and Failed Incorporation into the H/ACA Complex
            biological_scale: MOLECULAR
            description: 'Biallelic NHP2 variants are missense changes or a stop-loss extension rather
              than clean nulls, and the lesion they cause is one of assembly rather than of catalysis:
              NHP2 has no enzymatic activity of its own. Variant NHP2 that cannot compete with wild-type
              protein for a place in the H/ACA complex is degraded by the proteasome, so the measurable
              defect in cells is reduced NHP2 protein. The mechanism is understood as loss of function,
              although ClinGen records that it has not been formally established.'
            genes:
            - preferred_term: NHP2
              term:
                id: hgnc:14377
                label: NHP2
            genetic_context:
              variant_origin: GERMLINE
              functional_impact_category: LOSS_OF_FUNCTION
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: H/ACA Ribonucleoprotein Assembly Failure
        causal_link_type: DIRECT
        description: NHP2 enters the H/ACA complex through NOP10; variants that cannot dock are lost,
          so the complex assembles less efficiently on its RNA substrates.
      selected_evidence:
        snippet: Furthermore, both variants fail to be incorporated in the H/ACA RNA binding complex when
          in competition with wild-type endogenous NHP2, and the lack of incorporation causes their drastic
          proteasomal degradation.
        supports: SUPPORT
    origin:
