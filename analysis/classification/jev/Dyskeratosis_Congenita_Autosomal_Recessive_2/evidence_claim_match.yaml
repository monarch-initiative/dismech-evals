          developed nail dystrophy, oral leukoplakia, greying hair and reticulate neck pigmentation only
          in the two years before the report. For a paediatrician this is the practical point of the entry:
          waiting for the triad postpones the diagnosis past the onset of marrow failure and liver disease.'
      selected_evidence:
