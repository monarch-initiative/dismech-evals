          impairs rRNA biogenesis. This is the branch that makes DKCB2 more than a short-telomere phenotype,
          and it is the obvious candidate explanation for the features that telomere attrition alone does
          not predict — the cataracts, the intellectual disability, the intracranial calcification. That
          link is a hypothesis and not a demonstrated route, which is why the edge below is drawn with
          unknown intermediates.
