  30cd2fa5cdc788ef7bd6e622c9e773267a058a7dd5cbe58484a5afbc004096ae:
    claim:
      about:
        disease:
          name: Dyskeratosis Congenita Autosomal Recessive 2
          disease_term:
            preferred_term: dyskeratosis congenita, autosomal recessive 2
            term:
              id: MONDO:0013519
              label: dyskeratosis congenita, autosomal recessive 2
        context: []
      assertion_type: Genetic
      assertion:
        name: NHP2
        gene_term:
          preferred_term: NHP2
          term:
            id: hgnc:14377
            label: NHP2
        relationship_type: CAUSATIVE
        notes: NHP2 (5q35.3), formerly NOLA2, encodes a small basic protein of the box H/ACA ribonucleoprotein.
          It has no catalytic activity; its contribution is structural, docking through NOP10 and contacting
          the telomerase RNA directly in the resolved holoenzyme structures. ClinGen's Interstitial Lung
          Disease expert panel classifies the NHP2 - dyskeratosis congenita autosomal recessive 2 relationship
          as Limited, reaffirmed in August 2025 after the additional case and functional data of PMID:37440454
          and PMID:31985013 did not change it. Limited is a statement about the quantity of evidence,
          not a doubt about the mechanism, and it is the honest headline for a gene with four curated
          probands.
        variants:
        - name: c.376G>A (p.Val126Met) in trans with c.460T>A (p.Ter154Arg)
          description: Compound heterozygous genotype of a long-followed patient. V126M is one of the
            two alleles shown to impair NOP10 association; the second is a stop-loss extension.
        - name: c.415T>C (p.Tyr139His), homozygous
          description: Homozygous genotype in two siblings of a consanguineous family, with both parents
            heterozygous. Y139H is the other allele shown to impair NOP10 association and H/ACA pre-ribonucleoprotein
            assembly.
        - name: p.Ala39Thr in trans with p.Thr44Met
          description: Compound heterozygous genotype of an adult with myelodysplastic syndrome and gastric
            cancer. Both variants sit in the N-terminal region and are mis-incorporated into the H/ACA
            complex, then degraded by the proteasome.
      selected_evidence:
        snippet: We have identified previously uncharacterized NHP2 mutations that can cause autosomal
          recessive dyskeratosis congenita but have not found any GAR1 mutations.
        supports: SUPPORT
