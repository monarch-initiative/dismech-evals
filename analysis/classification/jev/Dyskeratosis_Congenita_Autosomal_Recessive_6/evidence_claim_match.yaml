              label: dyskeratosis congenita, autosomal recessive 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TERC 3'-End Maturation Failure
        biological_scale: MOLECULAR
        description: 'TERC is transcribed by RNA polymerase II with a precise 3'' end and no long poly(A)
          tail, and shares a box H/ACA architecture with the small nucleolar RNAs that PARN is known to
          process. Post-transcriptional oligoadenylation flags it for exosomal degradation; PARN counteracts
          that. Without PARN, oligo(A)-tailed TERC accumulates and the mature species is depleted. The
          causal direction is fixed by a rescue: restoring PARN normalises both the TERC level and the
          oligo(A) fraction.'
        biological_processes:
        - preferred_term: telomerase RNA stabilization
          modifier: DECREASED
          term:
            id: GO:0090669
            label: telomerase RNA stabilization
      selected_evidence:
        snippet: These studies demonstrate that PARN deficiency results in diminished TERC levels independently
          of DKC1 (dyskerin), as well as in deficits in telomerase activity and telomere maintenance.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26482878
      reference_title: Poly(A)-specific ribonuclease (PARN) mediates 3'-end maturation of the telomerase
        RNA component.
      evidence_source: IN_VITRO
      explanation: Excludes the alternative route to low TERC — dyskerin loss — which is the mechanism
        in X-linked dyskeratosis congenita.
