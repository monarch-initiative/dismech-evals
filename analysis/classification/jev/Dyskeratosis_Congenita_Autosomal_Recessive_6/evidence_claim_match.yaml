      assertion_type: Phenotype
      assertion:
        category: Hematologic
        name: Short telomere length
        description: 'Leukocyte telomere length below the first percentile for age is the diagnostic hallmark.
          In Hoyeraal-Hreidarsson syndrome the telomeres are extremely short even by dyskeratosis congenita
          standards.

          The VERY_FREQUENT band rests on this being the diagnostic test for the disease rather than on
          a published fraction for this genotype. Telomere length below the first centile is how a telomere
          biology disorder is identified, so every ascertained patient has it by construction, and no
          PARN-specific denominator is reported. Bone marrow hypocellularity is graded FREQUENT for the
          complementary reason: it is the usual presentation but neither definitional nor given a denominator
          in any located source for this genotype.'
        phenotype_term:
          preferred_term: Short telomere length
          term:
            id: HP:0031413
            label: Short telomere length
        frequency: VERY_FREQUENT
      selected_evidence:
        snippet: Blood leukocyte telomere lengths less than the first percentile for age are consistent
          with the diagnosis of dyskeratosis congenita and a consequence of germline mutations in telomere
          biology genes
        supports: SUPPORT
