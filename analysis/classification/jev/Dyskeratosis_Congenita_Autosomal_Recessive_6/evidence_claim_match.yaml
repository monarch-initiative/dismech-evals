  9aa010a2b1f3e2daa510bc440bcd52a3f1e2af7c1b6147577d9a9bd3198be31c:
    claim:
      about:
        disease:
          name: Dyskeratosis Congenita Autosomal Recessive 6
          disease_term:
            preferred_term: dyskeratosis congenita, autosomal recessive 6
            term:
              id: MONDO:0014600
              label: dyskeratosis congenita, autosomal recessive 6
        context: []
      assertion_type: Genetic
      assertion:
        name: PARN
        gene_term:
          preferred_term: PARN
          term:
            id: hgnc:8609
            label: PARN
        relationship_type: CAUSATIVE
        notes: 'PARN (16p13.12) encodes poly(A)-specific ribonuclease. The gene is dose sensitive in both
          directions of the telomere phenotype: heterozygous loss-of-function segregates with adult autosomal
          dominant pulmonary fibrosis, while biallelic loss produces the severe childhood disease curated
          here. Monoallelic PARN deletions have separately been reported in individuals with developmental
          delay or mental illness, which complicates counselling of carrier parents and is not settled.'
        variants:
        - name: c.19A>C (p.Asn7His) in trans with a whole-gene deletion
          description: 'Genotype of the first proband: a missense change at a highly conserved residue
            inherited from the mother, with a deletion encompassing the entire PARN gene from the father.'
        - name: c.260C>T (p.Ser87Leu) in trans with a non-coding expression defect
          description: 'Genotype of the second proband: a maternally inherited missense variant with reduced
            transcript from the paternal allele, indicating a non-coding lesion not visible to exome sequencing.'
        - name: c.1200del (p.Leu401fs)
          description: A frameshift reported in a 2-year-old with Hoyeraal-Hreidarsson syndrome, classified
            as pathogenic by ACMG criteria.
      selected_evidence:
        snippet: Patient 1 was found to carry an undescribed missense variant, c.19A>C, on the allele
          inherited from his mother, resulting in the substitution of a highly conserved amino acid, p.Asn7His,
          and a large deletion encompassing the entire PARN gene on the allele inherited from his father
        supports: SUPPORT
