            id: HP:0000007
            label: Autosomal recessive inheritance
        description: DKCB6 requires two defective PARN alleles. Reported genotypes include compound heterozygosity
          for a missense variant with a whole-gene deletion, and a missense variant with a non-coding
          defect reducing expression of the other allele. The same gene also causes autosomal dominant
          pulmonary fibrosis in the heterozygous state, so zygosity is what separates the two diseases.
      selected_evidence:
        snippet: These data show compound heterozygous loss-of-function mutations in PARN in two families
          with dyskeratosis congenita and very short telomeres.
        supports: SUPPORT
