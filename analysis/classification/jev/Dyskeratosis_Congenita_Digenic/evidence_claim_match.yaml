        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Telomere Maintenance
        role: mechanism
        biological_scale: CELLULAR
        description: 'What makes this a telomere biology disorder clinically, and the finding that places
          it alongside the telomerase and shelterin forms of dyskeratosis congenita in diagnosis and management.

          The mechanistic point is the direction of causation, and it has to be stated precisely. In DKC1,
          TERT, TERC or TINF2 disease the primary lesion is in the telomere machinery. Here the primary
          lesion is in nucleotide supply and the telomere defect follows from it. That is not the same
          as the machinery being untouched: in proband cells telomerase activity is reduced, immature
          oligoadenylated TERC accumulates, and DKC1, TERT and SMUG1 are all reduced. What is preserved
          is shelterin. The authors'' own reading is that impaired telomerase regulation is a consequence
          of altered nucleotide metabolism rather than an independent lesion.

          An earlier draft of this entry said the telomere machinery was intact. That was too strong and
          is corrected here.'
        biological_processes:
        - preferred_term: telomere maintenance
          term:
            id: GO:0000723
            label: telomere maintenance
          modifier: ABNORMAL
      selected_evidence:
        snippet: These defects in the nucleotide metabolism pathway resulted in genotoxic stress, defective
          transcription, and abnormal telomere maintenance.
        supports: SUPPORT
    origin:
