  aa1e1b6a702e3c78467300e5a85b64af1120367ce60e10d0066afb2c2930a856:
    claim:
      about:
        disease:
          name: Dyskeratosis Congenita Digenic
          disease_term:
            preferred_term: dyskeratosis congenita, digenic
            term:
              id: MONDO:0031057
              label: dyskeratosis congenita, digenic
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Antimetabolite Hypersensitivity
        role: modifier
        biological_scale: CELLULAR
        description: 'A branch of the mechanism with direct clinical consequence rather than a downstream
          step of the disease process. Thymidylate synthase is the pharmacological target of 5-fluorouracil
          and capecitabine; a cell that has almost none of it has no margin. The same cells are separately
          hypersensitive to hydroxyurea, which inhibits ribonucleotide reductase rather than thymidylate
          synthase, so the vulnerability is to antimetabolites that squeeze dNTP supply generally and
          not to one drug class alone.

          This matters because dyskeratosis congenita carries an elevated risk of squamous cell carcinoma,
          for which fluoropyrimidines are a standard option. The genotype that causes the cancer risk
          also removes the tolerance for a common treatment of it.

          It is not only a prediction. One proband in the defining cohort was treated with topical 5-fluorouracil
          for squamous carcinoma and melanoma of the leg and had a severe adverse response. That is a
          single topical exposure rather than systemic dosing data, but it is a clinical observation and
          this entry previously stated, wrongly, that no such observation existed.'
      selected_evidence:
        snippet: Bilateral ptosis, tooth discolouration, intermediate increased response to mitomycin-C,
          basal carcinoma on the chest, squamous carcinoma and melanoma on the leg, severe response to
          topical 5-FU treatment.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/6
