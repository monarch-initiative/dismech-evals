  72cdaa49e955ed8848efd5da4c874a8668613074b07250a37dd7118ea2eb4695:
    claim:
      about:
        disease:
          name: Dyskeratosis Congenita Digenic
          disease_term:
            preferred_term: dyskeratosis congenita, digenic
            term:
              id: MONDO:0031057
              label: dyskeratosis congenita, digenic
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of Fluoropyrimidines and Hydroxyurea
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: avoidance of thymidylate synthase inhibitors
          term:
            id: NCIT:C15747
            label: Supportive Care
        description: 'The one management point specific to this genotype rather than shared with dyskeratosis
          congenita generally. Patient cells are hypersensitive to 5-fluorouracil, which acts on the enzyme
          these patients already lack, and separately to hydroxyurea.

          This is not a hypothetical. A proband in the defining cohort developed squamous carcinoma and
          melanoma of the leg - the cancer risk dyskeratosis congenita carries - was treated with topical
          5-fluorouracil, and had a severe adverse response. The situation the recommendation covers is
          therefore one that has already occurred once.

          What remains unestablished is the systemic case: that exposure was topical, in a single patient,
          with no dose data and no information on how a systemic fluoropyrimidine would behave. The recommendation
          to avoid is accordingly firmer than a pure cell-culture inference and weaker than a dose-adjustment
          guideline.'
        notes: 'Corrected after review. An earlier version of this entry stated in four places that no
          DKCD patient had ever received a fluoropyrimidine, and built a knowledge gap and a proposed
          experiment on that premise. It is not true: the cached full text of PMID:35931051 reports a
          proband with a severe adverse response to topical 5-FU during treatment for squamous carcinoma
          and melanoma. The claim came from reading the abstract and the deep-research report, which makes
          the same omission, rather than the full text that was already in this pull request.

          What the evidence now supports: one observed topical reaction, plus cellular hypersensitivity
          to both 5-fluorouracil and hydroxyurea in proband lymphoblastoid cells. What it does not support:
          any statement about systemic dosing, about severity grading, or about whether DPYD-based pharmacogenomic
          screening would flag such a patient.'
      selected_evidence:
        snippet: has shown a severe adverse response to topical 5-FU when undergoing treatment for her
          squamous carcinoma and melanoma in her leg
        supports: SUPPORT
        directness: DIRECT
