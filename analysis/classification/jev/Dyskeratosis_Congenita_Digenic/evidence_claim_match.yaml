      assertion_type: Phenotype
      assertion:
        category: Hematologic
        name: Bone Marrow Failure
        frequency: OCCASIONAL
        description: 'Graded from the cohort, not from the disease class, and the two disagree sharply.
          Marrow failure is definitional for dyskeratosis congenita and dominates its prognosis; in the
          eight-family TYMS cohort Table 1 records a haematological abnormality in 1 of 10 probands (anemia
          at 98 g/L with otherwise normal counts), with three further probands having normal counts but
          raised HbF. An earlier version of this entry graded this VERY_FREQUENT with severity SEVERE
          on the class-level statement alone.

          Two readings are open and the data do not separate them. Most of these probands were sampled
          young - six were four years old or less - and marrow failure in dyskeratosis congenita is progressive,
          so the cohort may simply be too young. Alternatively the TYMS-ENOSF1 form may genuinely spare
          the marrow relative to the telomerase forms, which would be a real distinction worth knowing.
          Raised HbF in three probands is a hint of early marrow stress in either reading. The `severity`
          qualifier has been dropped because nothing in either source supports a severity grading for
          this cohort.'
        phenotype_term:
          preferred_term: Bone marrow failure
          term:
            id: HP:0005528
            label: Bone marrow hypocellularity
      selected_evidence:
        snippet: Hematological abnormalities | N a | N | N b | Y c | N | N | N d | N | N | N
        supports: SUPPORT
        directness: DIRECT
