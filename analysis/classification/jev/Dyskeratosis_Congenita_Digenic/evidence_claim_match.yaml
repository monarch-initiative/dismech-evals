          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
        description: 'Two loci, both required, one contributed by each parent: a TYMS loss-of-function
          coding allele and, in trans, an ENOSF1 antisense haplotype with rare variants. Carriers of either
          alone are unaffected.

          The presentation mimics autosomal recessive inheritance closely enough that the defining study
          initially read it that way, and only targeted sequencing of the antisense regulator revealed
          otherwise. That is worth recording as a diagnostic caution rather than as a historical note:
          a pedigree that looks recessive with an apparently non-carrier parent is the signal.'
      selected_evidence:
        snippet: These cell and molecular abnormalities generated by the combination of germline digenic
          variants at the TYMS-ENOSF1 locus represent a unique pathogenetic pathway for DC causation in
          these affected individuals, whereas the parents who are carriers of either of these variants
          in a singular fashion remain unaffected.
        supports: SUPPORT
