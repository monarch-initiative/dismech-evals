      assertion_type: Pathophysiology
      assertion:
        name: ENOSF1-Mediated Silencing of the Wild-Type TYMS Allele
        role: mechanism
        biological_scale: MOLECULAR
        description: 'The epistatic step, and the part of this disease that is genuinely novel. ENOSF1
          is transcribed antisense to TYMS at the same locus. When it is elevated, it silences TYMS post-transcriptionally
          - so the coding-intact allele is present, transcribed, and then prevented from producing enzyme.

          This was not inferred from the pedigree structure. It was demonstrated by gene rescue in cells
          from affected probands, which is what turns "these two variants co-occur" into a mechanism.'
        biological_processes:
        - preferred_term: antisense silencing of TYMS by ENOSF1
          term:
            id: GO:0042868
            label: antisense RNA metabolic process
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Gene-rescue studies in cells from affected probands revealed that post-transcriptional
          epistatic silencing of TYMS is occurring via elevated ENOSF1.
        supports: SUPPORT
