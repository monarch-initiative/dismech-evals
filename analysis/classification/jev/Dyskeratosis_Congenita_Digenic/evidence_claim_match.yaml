        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Digenic TYMS-ENOSF1 Genotype
        role: trigger
        biological_scale: MOLECULAR
        description: 'The initiating lesion is a genotype rather than a variant: a TYMS loss-of-function
          coding allele from one parent, and in trans a specific ENOSF1 haplotype with rare variants from
          the other.

          Neither allele alone causes disease - the parents carrying one each are unaffected - and one
          parent''s TYMS coding sequence is entirely wild type. This is what distinguishes the disease
          from every single-gene recessive form of dyskeratosis congenita, and it is why the inheritance
          only appears recessive.'
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Although the inheritance appeared to be autosomal recessive, one parent in each family
          had a wild-type TYMS coding sequence. Targeted genomic sequencing identified a specific haplotype
          and rare variants in the naturally occurring TYMS antisense regulator ENOSF1 (enolase super
          family 1) inherited from the other parent.
        supports: SUPPORT
