      assertion_type: Pathophysiology
      assertion:
        name: Left Hemisphere Reading Network Dysfunction
        description: Functional neuroimaging consistently shows reduced (and, in compensatory regions,
          altered) activation across a distributed left-hemisphere reading network, including ventral
          occipito-temporal cortex (the "visual word form" region), inferior frontal gyrus, and inferior
          parietal cortex, rather than a single focal lesion. This is the systems-level neural correlate
          of the reading deficit.
        cell_types:
        - preferred_term: pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: cognition
          term:
            id: GO:0050890
            label: cognition
          modifier: ABNORMAL
      selected_evidence:
        snippet: Rather, recent evidence points to a dysfunction of a left hemisphere reading network,
          which includes occipito-temporal (OT), inferior frontal, and inferior parietal regions.
        supports: SUPPORT
