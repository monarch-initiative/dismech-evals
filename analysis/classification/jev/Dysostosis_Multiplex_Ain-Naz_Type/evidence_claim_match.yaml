        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: LysosomalStorageAssignment
      assertion:
        classification_value: mucolipidosis
        notes: 'Classified with the mucolipidoses rather than with a single-hydrolase storage disease
          because, as in mucolipidosis II, no individual lysosomal hydrolase is defective: loss of the
          mannose-6-phosphate recognition marker missorts many soluble acid hydrolases at once. The authors
          of the most recent clinical report explicitly propose "LYSET-related mucolipidosis" for this
          disorder; a separate group proposed "Mucolipidosis Type V". Neither name is yet adopted by MONDO
          or OMIM, which retain the Ain-Naz eponym.'
      selected_evidence:
        snippet: We propose the term "LYSET-related mucolipidosis" to describe this disorder
        supports: SUPPORT
