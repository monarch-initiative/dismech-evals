          the only whole-organism model that reaches the tissue-level disease.
        limitations: Zebrafish skeletal development differs substantially from human endochondral ossification,
          and the reported phenotype is a developmental dysplasia in the embryo rather than the progressive
          postnatal dysostosis multiplex of patients. Cardiac oedema has no clear human counterpart in
          this disorder.
      selected_evidence:
        snippet: In zebrafish, TMEM251 deletion leads to severe developmental defects including heart
          edema and skeletal dysplasia, which phenocopies Mucolipidosis Type II.
        supports: SUPPORT
