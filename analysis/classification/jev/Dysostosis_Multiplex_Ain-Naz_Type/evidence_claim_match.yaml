              label: dysostosis multiplex, Ain-Naz type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dmant_no_therapy
        kind: KNOWLEDGE_GAP
        prompt: Is any disease-modifying therapy plausible for a disorder of the mannose-6-phosphate targeting
          marker itself?
        attaches_to:
        - treatments#
        rationale: 'Nothing is published on treatment for this disorder. The mechanism argues against
          straightforward enzyme replacement, since the defect is in the receptor recognition marker rather
          than in one hydrolase, and infused enzyme relies on the same M6P-receptor uptake route. Every
          candidate strategy that exists has been tested in mucolipidosis II, which shares the downstream
          lesion but not the gene: haematopoietic stem cell transplantation, bisphosphonate treatment
          in a Gnptab knock-in mouse, and enzyme cross-correction with pre-tagged hydrolases. The two
          evidence items below are mucolipidosis II studies, cited here to show what the transferable
          candidate set is, and neither says anything about a patient with LYSET deficiency. Whether that
          transfer is valid is exactly what is unknown. This is an absence of evidence, not evidence of
          futility.'
        status: OPEN
      selected_evidence:
        snippet: HSCT resulted in a sustained reduction of lysosomal storage und bone metabolism markers.
        supports: SUPPORT
    origin:
