        description: A separate disorder that shares the Ain-Naz eponym only because the two reports share
          their first and last authors. It is caused by a homozygous GNPNAT1 variant and presents as extreme
          rhizomelic limb shortening with platyspondyly and hip dysplasia, not as dysostosis multiplex.
        distinguishing_features:
        - 'Different gene (GNPNAT1, encoding glucosamine 6-phosphate N-acetyltransferase, versus LYSET),
          different OMIM entry (619598 versus 619345), and a different skeletal pattern: rhizomelic shortening
          with platyspondyly rather than dysostosis multiplex. The founding report of the rhizomelic disorder
          describes neither coarse facies nor an abnormal lysosomal enzyme profile, though the abstract
          consulted here would not necessarily record their absence. The two are mechanistically adjacent
          — GNPNAT1 makes the UDP-GlcNAc that GlcNAc-1-phosphotransferase uses as substrate — but they
          are not the same entity and should not be merged.'
      selected_evidence:
        snippet: The patients presented with short stature due to extreme shortening of the proximal segments
          of the limbs.
        supports: SUPPORT
