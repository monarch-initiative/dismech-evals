      assertion:
        name: GlcNAc-1-Phosphotransferase Destabilization and Golgi Mislocalization
        biological_scale: MOLECULAR
        description: LYSET is a two-transmembrane Golgi protein that binds GlcNAc-1-phosphotransferase,
          supports its Site-1-protease cleavage and activity, and anchors it in the Golgi. In LYSET-deficient
          cells the phosphotransferase is destabilized and redistributes from the Golgi to lysosomes,
          where it is degraded.
        molecular_functions:
        - preferred_term: N-acetylglucosamine-1-phosphotransferase activity
          term:
            id: GO:0003976
            label: UDP-N-acetylglucosamine-lysosomal-enzyme N-acetylglucosaminephosphotransferase activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
