                c.215dupA p.(Tyr72Ter), c.112C>T p.(Gln38Ter), and c.197dupA. Consanguinity is reported
                in the families for which it is stated.'
            cellular_components:
            - preferred_term: Golgi apparatus
              term:
                id: GO:0005794
                label: Golgi apparatus
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: GlcNAc-1-Phosphotransferase Destabilization and Golgi Mislocalization
        causal_link_type: DIRECT
        description: LYSET is required to keep GlcNAc-1-phosphotransferase stable, cleaved, and retained
          in the Golgi; without it the enzyme is lost.
      selected_evidence:
        snippet: Without LYSET, GlcNAc-1-phosphotransferase was unstable because of a hydrophilic transmembrane
          domain.
        supports: SUPPORT
