      assertion_type: Genetic
      assertion:
        name: LYSET
        gene_term:
          preferred_term: LYSET
          term:
            id: hgnc:20218
            label: TMEM251
        relationship_type: CAUSATIVE
        association: Biallelic loss-of-function variants cause the disorder.
        variant_origin: GERMLINE
        notes: 'The gene has three names in current use: LYSET (lysosomal enzyme trafficking factor, the
          approved HGNC symbol), TMEM251 (the previous symbol, used in the founding clinical report),
          and GCAF (GNPTAB cleavage and activity factor, an alias). All four reported families are homozygous,
          and three of the four alleles are premature-termination variants. The p.(Arg45Trp) missense
          allele is expressed but fails to bind GlcNAc-1-phosphotransferase and does not rescue the sorting
          defect, so it too behaves as loss of function.'
        variants:
        - name: LYSET c.133C>T p.(Arg45Trp)
          description: Homozygous missense allele in family NMD02. The protein is expressed but is targeted
            to the Golgi less efficiently, binds GlcNAc-1-phosphotransferase poorly, and fails to rescue
            cathepsin missorting.
        - name: LYSET c.215dupA p.(Tyr72Ter)
          description: Homozygous premature-termination allele in family ID01.
        - name: LYSET c.112C>T p.(Gln38Ter)
          description: Homozygous nonsense allele found by whole-genome sequencing in the first reported
            Western patient, after more than a decade of undiagnosed investigation.
        - name: LYSET c.197dupA
          description: Homozygous frameshift allele in two Iranian brothers with an MLII-like presentation.
      selected_evidence:
        snippet: Our work implicates TMEM251 in the pathogenesis of a novel disorder
        supports: SUPPORT
