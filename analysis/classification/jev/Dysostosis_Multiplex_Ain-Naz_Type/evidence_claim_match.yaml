          same enzymes are deficient inside cultured fibroblasts, because the enzymes are made normally
          and then secreted instead of delivered. That paired pattern is the mucolipidosis II signature,
          so a patient reaching it without a GNPTAB or GNPTG variant is the one in whom LYSET should be
          tested.
        diagnosis_term:
          preferred_term: plasma and fibroblast lysosomal enzyme activity panel
