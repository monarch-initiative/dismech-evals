      assertion_type: Discussion
      assertion:
        discussion_id: dysplasminogenemia_thrombotic_risk
        kind: CONTROVERSY
        prompt: Does dysplasminogenemia, alone or combined with other thrombotic risk factors, increase
          the risk of venous thromboembolism or cerebral infarction?
        attaches_to:
        - mechanistic_hypotheses#reduced_fibrinolytic_reserve_thrombosis
        - phenotypes#Deep Venous Thrombosis
        - phenotypes#Cerebral Infarct
        rationale: Supporting reports are single cases, pedigrees ascertained through a thrombotic proband,
          and a series selected for both cerebral infarction and low plasminogen activity, none with controls.
          Family studies excluding probands, a Japanese population-based case-control comparison and a
          knock-in mouse found no increased risk. A thrombophilia family study found that about half of
          plasminogen-deficient probands had additional thrombophilic defects or circumstantial risk factors,
          so an interaction effect remains possible.
      selected_evidence:
        snippet: Based on our data, plg deficiency is a rare defect in thrombophilic patients and as a
          single defect it does not seem to be a strong thrombotic risk factor, as 11 of 23 propositi
          had additional thrombophilic defects or circumstantial risk factors, and in the family members
          thrombotic events were equally frequent in the plg-deficient and non-deficient subjects.
        supports: SUPPORT
