      assertion_type: Inheritance
      assertion:
        name: Semidominant
        description: The biochemical trait is expressed in heterozygotes (about half-normal plasminogen
          activity with normal antigen) and more severely in homozygotes or compound heterozygotes. Clinical
          thrombotic penetrance, if any, is low and unproven.
        inheritance_term:
          preferred_term: semidominant inheritance
          term:
            id: HP:0032113
            label: Semidominant inheritance
      selected_evidence:
        snippet: These studies suggested that the molecular abnormality was inherited as an autosomal
          characteristic, and the family members who had half the normal levels of activity with normal
          plasminogen antigen were heterozygotes whereas the one with practically no plasminogen activity
          was homozygote.
        supports: SUPPORT
    origin:
