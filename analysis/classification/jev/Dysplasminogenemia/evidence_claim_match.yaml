            rs121918027) in exon 15, beside the catalytic histidine. Activated to two-chain plasmin with
            severely impaired proteolytic activity.
          variant_type: single nucleotide variant
          identifiers:
          - dbSNP:rs121918027
          population_effects:
          - population: Japanese
            ancestry_terms:
            - preferred_term: Japanese
              term:
                id: HANCESTRO:0019
                label: Japanese
            ancestry_basis: NOT_STATED
            comparator_stratum: white populations
            effect_differences:
            - ALLELE_FREQUENCY
            allele_frequency: 0.02
        - name: p.Gly568Arg
          description: c.1702G>A, p.Gly568Arg in exon 14, reported in trans with p.Ala620Thr in a patient
            with cerebral infarction, 27% activity and 103% antigen; it impaired catalytic activity of
            recombinant plasminogen without affecting secretion.
          variant_type: single nucleotide variant
        - name: p.Gly712Arg
          description: p.Gly712Arg (mature numbering G693R), described in the heterozygous state in type
            II plasminogen deficiency.
          variant_type: single nucleotide variant
        - name: p.Gly751Arg
          description: Plasminogen Kanagawa-I, reported as G732R in mature-protein numbering (p.Gly751Arg
            in precursor numbering), found in exon 18 in a healthy heterozygote with half-normal activity
            and normal antigen.
          variant_type: single nucleotide variant
        - name: p.His133Arg
          description: c.398A>G, p.His133Arg, newly identified in a retrospective Chinese series of patients
            with cerebral infarction and low plasminogen activity; functional consequence not characterized.
          variant_type: single nucleotide variant
        - name: p.Gly703Asp
          description: c.2108G>A, p.Gly703Asp in the serine-protease domain, found in the same cerebral-infarction
            series; functional consequence not characterized.
          variant_type: single nucleotide variant
