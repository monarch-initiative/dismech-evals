        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Plasmin Catalytic Activity
        biological_scale: MOLECULAR
        description: The variant plasminogen is cleaved by plasminogen activators into two-chain plasmin,
          but the plasmin is catalytically inactive or impaired. For p.Ala620Thr the substituted threonine
          lies next to the catalytic histidine and is proposed to block the proton transfer of the serine-protease
          mechanism. In heterozygotes, half of the circulating molecules are defective, so specific activity
          is about half normal.
        genes:
        - preferred_term: PLG
          term:
            id: hgnc:9071
            label: PLG
        molecular_functions:
        - preferred_term: plasmin serine-type endopeptidase activity
          modifier: DECREASED
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
      selected_evidence:
        snippet: The Thr at position 55 in plasminogen (plasmin) Tochigi may perturb His-57 such that
          the proton transfers associated with the normal catalytic process cannot occur in the abnormal
          plasmin.
        supports: SUPPORT
    origin:
