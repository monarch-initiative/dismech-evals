      assertion:
        hypothesis_group_id: reduced_fibrinolytic_reserve_thrombosis
        hypothesis_label: Reduced fibrinolytic reserve predisposes to thrombosis
        status: ALTERNATIVE
        description: Dysplasminogenemia was first described in a patient with recurrent thrombosis, and
          later case reports and Chinese stroke series propose that reduced plasmin activity predisposes
          to venous thromboembolism and cerebral infarction. Family studies, a Japanese population study
          and the Plg-Tochigi knock-in mouse find no increased risk, so the prevailing view is that isolated
          dysplasminogenemia is not a significant thrombotic risk factor; an effect in combination with
          other risk factors is not excluded.
      selected_evidence:
        snippet: Although dysplasminogenemia was first reported in a Japanese patient with recurrent venous
          thromboembolism (VTE), subsequent studies have not demonstrated any clear association between
          the PLG Ala620Thr variant and the risk of VTE.
        supports: SUPPORT
