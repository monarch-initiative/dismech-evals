              label: dysplasminogenemia
        context: []
      assertion_type: Phenotype
      assertion:
        category: Blood
        name: Reduced Plasminogen Functional Activity
        description: 'The defining laboratory finding: plasma plasminogen activity is reduced (about 50-70%
          in heterozygotes, and much lower in homozygotes and compound heterozygotes) while plasminogen
          antigen is normal, giving a low activity-to-antigen ratio. It is congenital and lifelong.'
        frequency: OBLIGATE
        diagnostic: true
        phenotype_term:
          preferred_term: reduced plasminogen functional activity
          term:
            id: HP:0040224
            label: Abnormality of fibrinolysis
        notes: HPO has no term for reduced plasminogen activity. HP:0040228 Decreased circulating plasminogen
          concentration describes a reduced amount of plasminogen, which is the type I (hypoplasminogenemia)
          pattern and is wrong here, so the parent HP:0040224 is bound. The HPO search "plasminogen" returned
          HP:0040228 and plasminogen activator inhibitor and tissue plasminogen activator terms only,
          and HP:0040224 has no plasminogen-activity descendant.
      selected_evidence:
        snippet: PLG activity (PLG:A) in proband 1 and 3 of his tested family members, proband 2 and 2
          of his tested family members, and proband 3 and her father were all reduced to roughly 50% of
          normal levels.
        supports: SUPPORT
