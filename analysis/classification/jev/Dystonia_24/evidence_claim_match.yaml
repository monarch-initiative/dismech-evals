          value:
            name: TMEM16C knockout rat
            species: Rat
            genotype: Tmem16c (Ano3) knockout
            publication: PMID:23872594
            description: A knockout rat studied for pain processing, not for movement. In dorsal root
              ganglion nociceptors, loss of TMEM16C reduced expression of the sodium-activated potassium
              channel Slack, broadened action potentials and raised excitability, and the animals were
              more sensitive to heat and mechanical stimuli. No motor or dystonic phenotype is reported,
              and the striatum was not examined.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Striatal Neuronal Hyperexcitability
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: CELLULAR
        description: Shows that loss of ANO3 can make neurons hyperexcitable, which is the kind of change
          the node proposes, but in a different neuron type and through a different potassium channel.
        limitations: The neurons are peripheral nociceptors, not striatal medium spiny neurons. The potassium
          current affected is the sodium-activated Slack current, which the dystonia-variant cell study
          found unaffected; that study implicates KCa3.1 instead. The model is a complete knockout, whereas
          patients carry one heterozygous, mostly missense, allele whose direction of effect is unresolved.
          No dystonia or other motor phenotype was reported.
        divergences:
        - divergence_type: PROXY_QUANTITY
          materiality: QUALIFYING
          description: Excitability of dorsal root ganglion nociceptors stands in for excitability of
            striatal neurons, which were not recorded.
        - divergence_type: CONTESTED_ASSUMPTION
          materiality: QUALIFYING
          description: Using a null allele assumes the human variants act by loss of function, which is
            the open question recorded in the ano3_variant_effect_direction discussion.
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: Rat rather than human neurons; whether rat striatal ANO3 couples to the same potassium
            channels as human striatal ANO3 is not known.
      selected_evidence:
        snippet: DRG from TMEM16C knockout rats had diminished Slack expression, broadened action potentials
          and increased excitability.
        supports: SUPPORT
