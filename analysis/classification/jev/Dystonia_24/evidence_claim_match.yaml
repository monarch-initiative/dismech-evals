            co-expressed with wild type, and measure calcium-activated phosphatidylserine exposure, whole-cell
            currents and surface expression.
          would_support:
          - pathophysiology#Altered ANO3 Calcium-Activated Scramblase Function
          supporting_outcome:
          - Variants consistently reduce or alter scrambling, and co-expression shows whether the effect
            is dominant over wild type.
          refuting_outcome:
          - Variants leave scrambling and currents unchanged, which would place the lesion elsewhere,
            for example in protein interactions or trafficking.
      selected_evidence:
        snippet: Remarkably, functional in vitro analysis of ANO3-S116L showed only minor deviations from
          the normal wild-type ANO3 function, supporting the role of mutated ANO3 for the clinical phenotype.
        supports: SUPPORT
