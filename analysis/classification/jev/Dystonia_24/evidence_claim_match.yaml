      assertion:
        name: Altered ANO3 Calcium-Activated Scramblase Function
        biological_scale: MOLECULAR
        description: ANO3 is a calcium-activated phospholipid scramblase of the TMEM16 family, present
          largely in intracellular membranes. One group reports that it also conducts ions; another, studying
          human TMEM16C isoforms, found scrambling but no ion transport. How disease variants change scrambling
          itself has not been measured directly in the cited studies; what has been measured is their
          effect on cellular calcium signalling, recorded in the next node.
        molecular_functions:
        - preferred_term: calcium-activated phospholipid scramblase activity
          modifier: ABNORMAL
          term:
            id: GO:0017128
            label: phospholipid scramblase activity
        genes:
        - preferred_term: ANO3
          term:
            id: hgnc:14004
            label: ANO3
      selected_evidence:
        snippet: We identified ANO3 as a Ca2+-activated phospholipid scramblase that also conducts ions.
        supports: SUPPORT
