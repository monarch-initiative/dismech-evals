      assertion_type: Discussion
      assertion:
        discussion_id: ano3_variant_effect_direction
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do dystonia-causing ANO3 variants reduce ANO3 function, and does ANO3 act as an ion channel
          at all, or only as a scramblase?
        attaches_to:
        - pathophysiology#Heterozygous ANO3 Variants
        - pathophysiology#Altered ANO3 Calcium-Activated Scramblase Function
        rationale: The cited functional work measured downstream calcium and potassium signalling in fibroblasts
          and HEK293 cells expressing variants, not the scrambling or channel activity of each variant
          directly, and one variant tested deviated only slightly from wild type. The two groups that
          characterized ANO3 itself disagree on whether it conducts ions. The rat knockout links complete
          loss of ANO3 to neuronal hyperexcitability, but through sodium-activated potassium channels
          that the variant study found unaffected. Whether heterozygous missense variants act by loss
          of function, dominant-negative interference or altered function is therefore open, and the entry
          leaves functional_impact_category unset for that reason.
        proposed_experiments:
        - experiment_id: ano3_variant_panel_scrambling_and_currents
          name: Direct scramblase and current measurement across a panel of ANO3 variants
          description: Express wild-type ANO3 and a panel of familial and de novo variants, alone and
            co-expressed with wild type, and measure calcium-activated phosphatidylserine exposure, whole-cell
            currents and surface expression.
          would_support:
          - pathophysiology#Altered ANO3 Calcium-Activated Scramblase Function
          supporting_outcome:
          - Variants consistently reduce or alter scrambling, and co-expression shows whether the effect
            is dominant over wild type.
          refuting_outcome:
          - Variants leave scrambling and currents unchanged, which would place the lesion elsewhere,
            for example in protein interactions or trafficking.
      selected_evidence:
        snippet: In contrast to other TMEM16 proteins, flux assays and electrophysiology recording showed
          TMEM16C does not possess ion-transporting activity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36295764
      reference_title: Investigation of Phosphatidylserine-Transporting Activity of Human TMEM16C Isoforms.
      evidence_source: IN_VITRO
      explanation: One side of the disagreement on ion conduction.
