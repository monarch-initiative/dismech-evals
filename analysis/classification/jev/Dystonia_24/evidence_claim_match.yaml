        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous ANO3 Variants
        biological_scale: MOLECULAR
        description: 'Heterozygous ANO3 variants, almost all missense, spread across the protein rather
          than clustered in one domain. The two original familial variants lie in exon 15; many later
          childhood-onset variants are de novo, and one review proposes that variants near the scrambling
          domain track the more severe early-onset phenotype. The functional impact category is left unset
          on purpose: whether pathogenic variants reduce or alter ANO3 function is disputed (see the knowledge-gap
          discussion). The ANO3 gene binding sits on the next node, with the molecular function it encodes.'
        genetic_context:
          variant_origin: GERMLINE
      selected_evidence:
        snippet: Subsequent screening of these candidate causal variants in a large number of familial
          and sporadic cases of cervical dystonia led to the identification of a total of six putatively
          pathogenic mutations in ANO3, a gene encoding a predicted Ca(2+)-gated chloride channel that
          we show to be highly expressed in the striatum.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
