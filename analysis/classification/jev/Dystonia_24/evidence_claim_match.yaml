        notes: 'ANO3 is hgnc:14004 (previous symbols TMEM16C and C11orf25). The disease is defined by
          this gene in MONDO and OMIM (615034), so the record is typed CAUSATIVE for the entity. That
          typing is not a ClinGen tier: the ClinGen Gene-Disease Validity download of 2026-10-08 contains
          no ANO3 curation, so no gene_disease_validity assertion is recorded.

          Validity is genuinely debated. Rare protein-changing ANO3 variants occur in population controls
          and in Parkinson disease patients at rates close to those in dystonia cohorts, so a rare variant
          in a dystonia patient is not by itself evidence of pathogenicity; segregation, de novo occurrence
          or functional data are needed. A later Chinese cohort found rare variants enriched in dystonia
          over non-dystonic movement disorder controls, which is the stronger case-control signal. Cervical_Dystonia
          records ANO3 separately as SUSCEPTIBILITY for common sporadic cervical dystonia, and that record
          is a different claim from this one.'
