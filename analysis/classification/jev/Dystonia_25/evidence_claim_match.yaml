        context: []
      assertion_type: Subtype
      assertion:
        name: Biallelic DYT-GNAL
        display_name: Biallelic (autosomal recessive) DYT-GNAL
        description: Reported in two families. Two sisters from a consanguineous Turkish family homozygous
          for p.Arg329Trp had hypertonia from about one year of age that progressed to generalized dystonia,
          with mild intellectual disability; their heterozygous parents and siblings had no overt dystonia.
          A second, non-consanguineous patient compound heterozygous for a splice variant and a missense
          variant, both classed as of uncertain significance, had childhood language delay, truncal dystonia
          from age four, moderate intellectual disability, sensorineural hearing loss and dysmorphic features.
          Whether the hearing loss and dysmorphism belong to the GNAL disorder is not known.
        genes:
        - preferred_term: GNAL
          term:
            id: hgnc:4388
            label: GNAL
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: DYT-GNAL caused by biallelic GNAL pathogenic variants, reported to date in two sibs from
          a consanguineous family, is characterized by mild intellectual disability and childhood-onset
          hypertonia that progresses to generalized dystonia.
        supports: SUPPORT
