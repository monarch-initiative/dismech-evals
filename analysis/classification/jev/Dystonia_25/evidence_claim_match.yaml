      assertion:
        name: Impaired D1 and A2A Receptor Coupling to Adenylyl Cyclase in Striatal Projection Neurons
        biological_scale: CELLULAR
        description: Virtually all striatal projection neurons contain G-alpha-olf and no detectable G-alpha-s,
          so G-alpha-olf is required for adenylyl cyclase responses to dopamine through D1 receptors in
