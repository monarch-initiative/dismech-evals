          value:
            name: Gnal heterozygous knockout mouse
            species: Mouse
            genotype: Gnal+/- (heterozygous knockout)
            publication: PMID:28546310
            description: Mice with one inactivated Gnal allele. They have half the normal striatal G-alpha-olf,
              no overt dystonia at baseline and mild motor and behavioural changes, and develop dystonic
              postures and movements after systemic or intrastriatal oxotremorine. The authors propose
              untreated and treated mice as models of presymptomatic and symptomatic disease.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired D1 and A2A Receptor Coupling to Adenylyl Cyclase in Striatal Projection Neurons
        relationship: RECAPITULATES
        fidelity: HIGH
        model_scale: MOLECULAR
        description: Halved striatal G-alpha-olf with reduced receptor-stimulated cAMP production, matching
          the heterozygous human genotype.
        limitations: The measurements behind this link were made on whole caudate putamen, so they report
          a striatal average and do not say which projection neuron population carries the coupling deficit.
        divergences:
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: What is measured is G-alpha-olf protein and agonist-stimulated cAMP in caudate
            putamen, a tissue that also contains cholinergic and GABAergic interneurons, afferent terminals
            and glia. D1 receptor-expressing and A2A receptor-expressing projection neurons are not separated,
            so the per-neuron-type coupling the node names lies outside what this measurement resolves.
            Conditional Gnal deletion restricted to each population (PMID:40902679) is what later established
            it.
        - divergence_type: SCALE_EXTRAPOLATION
          materiality: QUALIFYING
          description: 'What is observed is biochemistry in striatal tissue: a protein amount and an agonist-stimulated
            second messenger response. The node is a claim about the signalling state of individual projection
            neurons, which is inferred from that biochemistry rather than recorded in those cells.'
      selected_evidence:
        snippet: Moreover, in the caudate putamen of mice heterozygous for the mutation, the amounts of
          Galpha(olf) were half of the normal levels, and the efficacy of dopamine- and CGS 21680 A(2)
          agonist-stimulated cAMP production was decreased.
        supports: SUPPORT
