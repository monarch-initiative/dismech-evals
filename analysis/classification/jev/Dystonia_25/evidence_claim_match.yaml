        prompt: Rodents with the human genotype, one inactivated Gnal allele, reproduce the striatal signalling
          and plasticity defects but do not develop dystonia without a pharmacological trigger. What converts
          the signalling deficit into adult-onset focal dystonia in some human carriers and not others?
        attaches_to:
        - pathophysiology#Striatal Motor Circuit Dysfunction
        - inheritance#Incomplete penetrance
        rationale: Heterozygous mice and rats have halved G-alpha-olf, reduced cAMP signalling, loss of
          corticostriatal long-term depression and abnormal cholinergic interneuron responses, yet show
          no spontaneous dystonia, and mice with Gnal deleted from D1 receptor-expressing projection neurons
          have no overt abnormal movements either. Dystonic movements in the mouse need an externally
          applied cholinergic agonist. Human disease begins in adulthood with incomplete penetrance. The
          rodent data therefore establish the signalling lesion but not the step from lesion to dystonia,
          and a second factor (age, an environmental or genetic modifier, or a cell population or region
          the models do not capture, such as the cerebellum) may be needed.
        proposed_experiments:
        - experiment_id: gnal_aged_and_combined_hit_models
          name: Ageing and second-hit challenge of Gnal heterozygous rodents
          description: Follow Gnal heterozygous mice or rats into old age, and combine the genotype with
            candidate second hits such as chronic D2 receptor blockade or a cerebellar perturbation, scoring
            for spontaneous dystonic postures.
          would_support:
          - pathophysiology#Striatal Motor Circuit Dysfunction
          supporting_outcome:
          - Spontaneous dystonia emerges with age or with a defined second hit, identifying a factor that
            could explain adult onset and incomplete penetrance.
          refuting_outcome:
          - No dystonia arises under any challenge, which would point to a species difference in how the
            striatal circuit compensates.
      selected_evidence:
        snippet: Our results reveal an increased cerebello-thalamic excitability in the presymptomatic
          state.
        supports: SUPPORT
