            preferred_term: dystonia 25
            term:
              id: MONDO:0014033
              label: dystonia 25
        context: []
      assertion_type: Genetic
      assertion:
        name: GNAL
        gene_term:
          preferred_term: GNAL
          term:
            id: hgnc:4388
            label: GNAL
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        case_fractions:
        - population: Spanish isolated dystonia cohort, southern and central Spain
          case_fraction_percent: 0.29
          cohort_size: 1053
          notes: Pathogenic or likely pathogenic GNAL variants among patients with isolated dystonia of
            all subtypes; the same study found GNAL variants in about 1.1 percent of patients across the
            published literature.
        - population: Serbian patients with isolated dystonia with craniocervical involvement
          case_fraction_percent: 0.4
          cohort_size: 236
          notes: One de novo variant among 236 patients.
        - population: Northeast Chinese patients with cervical-onset or cervical-involved primary dystonia,
            TOR1A and THAP1 negative
          case_fraction_percent: 3.4
          cohort_size: 59
          notes: Two carriers among 59 patients, one with a nonsense variant and one with a tentative
            splice-site variant; the cohort was pre-screened negative for TOR1A and THAP1, which raises
            the fraction.
        notes: 'GNAL is hgnc:4388, encoding G-alpha-olf. The disease is defined by this gene in MONDO,
          so the record is typed CAUSATIVE for the entity. That typing is not a ClinGen tier: the ClinGen
          Gene-Disease Validity download retrieved on 2026-10-20 contains no GNAL curation, so no gene_disease_validity
          assertion is recorded.

          GNAL variants explain a small fraction of isolated dystonia: under 1 percent in unselected cohorts,
          and about 3 percent in one cervical dystonia cohort pre-screened negative for TOR1A and THAP1.
          Rare GNAL missense variants are hard to interpret, so segregation, de novo occurrence or a functional
          assay is used before a novel missense variant is called pathogenic. Cervical_Dystonia records
          GNAL separately for common sporadic cervical dystonia, which is a different claim from this
          one.'
      selected_evidence:
        snippet: Screening of GNAL in 39 families with PTD identified 6 additional new mutations in this
          gene.
        supports: SUPPORT
    origin:
