      assertion:
        name: Reduced G-alpha-olf Signalling Capacity
        biological_scale: MOLECULAR
        description: G-alpha-olf is the stimulatory G protein alpha subunit that, with beta-2 and gamma-7
          subunits, transduces dopamine D1 and adenosine A2A receptor signals to adenylyl cyclase 5 in
          the striatum, and odorant receptor signals in olfactory neurons. Its level is rate-limiting
          for D1 receptor activation of adenylyl cyclase 5, so halving it reduces signalling. Disease
          variants either fail to support any D1 receptor response or impair association with G-beta-gamma
          and the amplitude of the response.
        molecular_functions:
        - preferred_term: G protein activity
          modifier: DECREASED
