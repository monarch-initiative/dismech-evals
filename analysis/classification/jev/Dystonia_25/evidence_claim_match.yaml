      assertion_type: Discussion
      assertion:
        discussion_id: gnal_biallelic_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do heterozygous parents of the biallelic patients have no dystonia, when single loss-of-function
          variants cause dominant dystonia in other families, and are the hearing loss and dysmorphism
          of the compound heterozygous patient part of GNAL disease?
        attaches_to:
        - has_subtypes#Biallelic DYT-GNAL
        rationale: The homozygous p.Arg329Trp variant impaired D1 receptor-driven activation in a cell
          assay, which the authors read as partial loss of function, differing from the stricter loss
          of function of dominant variants. A hypomorphic allele that causes disease only when biallelic
          would explain the unaffected carriers, but only two families are known and the compound heterozygous
          variants were not tested functionally. Incomplete penetrance of dominant variants is an alternative
          explanation for healthy heterozygous relatives.
      selected_evidence:
        snippet: The mutation seen in our patients seems to lead primarily to impaired Gαolf functional
          coupling to dopamine D1 receptors, differing from previously described mutations in GNAL that
          lead to a strict loss-of-function phenotype.
        supports: SUPPORT
