          term:
            id: GO:0007416
            label: synapse assembly
          modifier: DECREASED
      selected_evidence:
        snippet: these data show that inhibitory synaptic defects and elevated seizure susceptibility
          are hallmarks of severe dystroglycanopathy, and show that Dystroglycan plays an important role
          in organizing functional inhibitory synapse assembly
        supports: SUPPORT
