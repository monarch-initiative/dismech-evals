      assertion_type: Pathophysiology
      assertion:
        name: Sarcolemmal fragility and progressive muscle degeneration
        description: 'Loss of alpha-DG-laminin binding disrupts the dystrophin-glycoprotein complex (DGC)
          link between the intracellular cytoskeleton and the extracellular basement membrane. This renders
          the sarcolemma mechanically fragile, leading to contraction-induced damage, repeated cycles
          of muscle fiber necrosis and regeneration, progressive fibrosis, and fatty replacement. This
          mechanism is common to all severity types and underlies the progressive proximal muscular weakness
          and elevated serum creatine kinase characteristic of the disease.

          '
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        locations:
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
        biological_processes:
        - preferred_term: muscle contraction
          term:
            id: GO:0006936
            label: muscle contraction
          modifier: ABNORMAL
      selected_evidence:
        snippet: This smaller form of α-DG binds laminin and maintains specific force but does not prevent
          muscle pathophysiology, including reduced force production after eccentric contractions (ECs)
          or abnormalities in the neuromuscular junctions
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
