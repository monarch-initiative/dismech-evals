      assertion:
        name: Inhibitory synapse dysfunction and seizure susceptibility
        description: 'Beyond structural brain malformations, alpha-DG glycosylation plays a critical role
          in organizing functional inhibitory synapses. In the hippocampus, dystroglycan is required for
          CCK+/CB1R+ basket interneuron axon targeting and perisomatic inhibitory synapse assembly. Severe
          hypoglycosylation disrupts these inhibitory circuits, reducing GABAergic transmission and increasing
          seizure susceptibility. This represents a distinct neurological mechanism from cobblestone lissencephaly.

          '
        cell_types:
        - preferred_term: GABAergic interneuron
          term:
            id: CL:0011005
            label: GABAergic interneuron
        locations:
