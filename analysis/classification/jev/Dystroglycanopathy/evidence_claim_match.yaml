  089db20f15fea0d7613b27292caf807fe96958b71eed846deebefdbce5ed367d:
    claim:
      about:
        disease:
          name: Dystroglycanopathy
          disease_term:
            preferred_term: dystroglycanopathy
            term:
              id: MONDO:0018276
              label: muscular dystrophy-dystroglycanopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective alpha-dystroglycan O-mannosyl glycosylation
        description: 'The core mechanism shared by all dystroglycanopathies. Alpha-dystroglycan requires
          extensive O-mannosyl glycosylation to generate matriglycan, a repeating disaccharide polymer
          that serves as the laminin-binding moiety. At least 18 genes encode enzymes in this sequential
          biosynthetic pathway: POMT1/POMT2 initiate O-mannosylation, POMGNT2/B3GALNT2/POMK elaborate
          the core M3 glycan, FKTN/FKRP/CRPPA add ribitol-phosphate linkers, and LARGE1 polymerizes the
          terminal matriglycan. Mutations in any of these genes reduce or abolish matriglycan, preventing
          alpha-DG from binding laminin, agrin, and other extracellular matrix proteins.

          '
        conforms_to: pial_basement_membrane_radial_glial_endfoot_failure#Alpha-Dystroglycan Glycosylation
          and ECM Ligand Binding Failure
        genes:
        - preferred_term: POMT1
          term:
            id: hgnc:9202
            label: POMT1
        - preferred_term: POMT2
          term:
            id: hgnc:19743
            label: POMT2
        - preferred_term: POMGNT1
          term:
            id: hgnc:19139
            label: POMGNT1
