        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dystroglycanopathy_human_cobblestone_pmg_model_mismatch
        prompt: Does the lissencephalic rodent dystroglycanopathy model (brain-selective dystroglycan
          deletion, Pomgnt2-knockout), which faithfully reproduces the glia-limitans breach and neuroglial
          overmigration that define the cobblestone mechanism, capture the graded human cobblestone-lissencephaly
          spectrum (the Walker-Warburg syndrome to muscle-eye-brain to Fukuyama severity gradient and
          the cobblestone/polymicrogyria overlap across a gyrencephalic cortex), or does that human-specific
          phenotypic gradient require human iPSC-derived or gyrencephalic models to resolve?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Neuronal Overmigration Through Breached Glial Limitans
        - pathophysiology#Cobblestone Cortical Malformation
        rationale: 'The core boundary-breach mechanism of cobblestone malformation is well modeled in
          rodents: brain-selective dystroglycan-null and Pomgnt2-knockout mice reproduce pial basement-membrane
          / glia-limitans discontinuity and neuroglial overmigration, so the model is valid for the pial-boundary
          arm this node conforms to. What the mouse does not reproduce is the defining structure of the
          human disease, its graded, gyrencephalic phenotype. Human cobblestone lissencephaly is a continuum
          (Walker-Warburg syndrome, muscle-eye-brain disease, Fukuyama muscular dystrophy) spanning three
          neuropathological subtypes with different degrees of overmigration and cortical-plate disorganization,
          and at its milder end it overlaps with polymicrogyria, the very feature the module node "Cobblestone-Like
          Cortical Malformation and PMG Overlap" captures. Because the rodent cortex is naturally lissencephalic
          and lacks human gyral folding, the cobblestone-to-PMG gradient and the genotype/severity correlation
          that distinguish the human subtypes cannot be assigned from the knockout and remain an open
          human-model translational question.'
        proposed_experiments:
        - experiment_id: exp_dystroglycanopathy_human_cobblestone_pmg_gradient
          name: Human iPSC cortical-organoid and gyrencephalic comparison of the cobblestone-to-PMG gradient
          description: Test whether the graded human cobblestone-to-polymicrogyria phenotype requires
            a gyrencephalic/human cortical context by comparing graded alpha-dystroglycan hypoglycosylation
            (allelic POMT1/POMGNT1/LARGE series spanning the Walker-Warburg to muscle-eye-brain severity
            range) in human iPSC-derived cortical organoids against the conventional lissencephalic mouse
            knockout, and, where feasible, against a gyrencephalic ferret model, asking whether the degree
            of glia-limitans breach and overmigration scales into the cobblestone versus polymicrogyria-overlap
            range seen across the human subtypes.
          experiment_type:
            preferred_term: patient-derived cortical organoid and cross-species comparison experiment
          model_systems:
          - name: Human iPSC-derived cortical organoid with graded alpha-dystroglycan hypoglycosylation
            description: Human cortical organoids carrying an allelic series of dystroglycanopathy gene
              variants (POMT1, POMGNT1, LARGE) spanning the Walker-Warburg to muscle-eye-brain severity
              range, with isogenic corrected controls.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: cortical radial glial cell
              term:
                id: CL:0013000
                label: forebrain radial glial cell
            - preferred_term: migrating cortical neuron
              term:
                id: CL:0000540
                label: neuron
            conditions:
            - dystroglycanopathy
            - cobblestone lissencephaly
            cell_source: Patient-derived or CRISPR-engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cortical organoids with live-imaging glia-limitans/overmigration
              assays
          perturbations:
          - name: Graded alpha-dystroglycan hypoglycosylation allelic series
            target: pathophysiology#Defective alpha-dystroglycan O-mannosyl glycosylation
            genes:
            - preferred_term: POMT1
              term:
                id: hgnc:9202
                label: POMT1
            description: Introduce an allelic series of dystroglycanopathy gene variants of graded severity
              into an isogenic human iPSC background, with corrected controls.
          readouts:
          - name: Severity-scaled neuronal overmigration across the pial boundary
            target: pathophysiology#Neuronal Overmigration Through Breached Glial Limitans
            biological_processes:
            - preferred_term: neuron migration
              term:
                id: GO:0001764
                label: neuron migration
              modifier: INCREASED
            assays:
            - preferred_term: live-cell imaging assay
            direction: POSITIVE
          - name: Cobblestone-versus-polymicrogyria cortical architecture
            target: pathophysiology#Cobblestone Cortical Malformation
            biological_processes:
            - preferred_term: cerebral cortex development
              term:
                id: GO:0021987
                label: cerebral cortex development
              modifier: ABNORMAL
            assays:
            - preferred_term: histopathology assay
            direction: NEGATIVE
      selected_evidence:
        snippet: brain-selective deletion of dystroglycan in mice is sufficient to cause CMD-like brain
          malformations, including disarray of cerebral cortical layering, fusion of cerebral hemispheres
          and cerebellar folia, and aberrant migration of granule cells.
        supports: SUPPORT
