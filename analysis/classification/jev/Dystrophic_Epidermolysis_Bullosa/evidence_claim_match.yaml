      assertion_type: Treatment
      assertion:
        name: Recombinant Type VII Collagen (PTR-01)
        description: 'Investigational intravenous protein replacement therapy using recombinant type VII
          collagen (rC7) for systemic treatment of RDEB. Preclinical studies in RDEB mice and dogs demonstrated
          that IV rC7 accumulates at the basement membrane zone, reduces fibrosis via decreased TGF-β
          signaling, and promotes wound healing. Phase 2 clinical trial results have been reported but
          not yet published in peer-reviewed literature.

          '
        treatment_term:
          preferred_term: intravenous protein replacement therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Fortnightly IV injections of rC7 for 7 weeks in adult RDEB mice reduced fibrosis of skin
          and eye
        supports: SUPPORT
