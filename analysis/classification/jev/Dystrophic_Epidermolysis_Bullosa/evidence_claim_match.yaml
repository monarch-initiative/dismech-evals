        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COL7A1 Mutations and Loss of Type VII Collagen
        conforms_to: dermal_epidermal_junction_adhesion_failure#Basement Membrane Zone Attachment Component
          Defect
        description: 'Mutations in the COL7A1 gene encoding type VII collagen result in absent, reduced,
          or dysfunctional protein. In RDEB, biallelic loss-of-function mutations typically cause complete
          absence of type VII collagen, while in DDEB, dominant-negative mutations produce structurally
          abnormal collagen that disrupts anchoring fibril formation. Type VII collagen is the major structural
          component of anchoring fibrils at the dermal-epidermal junction.

          '
        genes:
        - preferred_term: COL7A1
          term:
            id: hgnc:2214
            label: COL7A1
        biological_processes:
        - preferred_term: collagen fibril organization
          modifier: ABNORMAL
          term:
            id: GO:0030199
            label: collagen fibril organization
        - preferred_term: extracellular matrix organization
          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: pathogenetic mutations in 16 distinct genes have been implicated in EB, encoding proteins
          influencing cellular integrity and adhesion
        supports: SUPPORT
