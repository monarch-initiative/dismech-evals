        context: []
      assertion_type: Treatment
      assertion:
        name: Gentamicin Readthrough Therapy
        description: 'Intravenous gentamicin induces translational readthrough of nonsense mutations in
          COL7A1, restoring functional type VII collagen at the dermal-epidermal junction. Applicable
          to approximately 30% of RDEB patients who carry nonsense mutations. An open-label pilot trial
          treated 3 RDEB patients with IV gentamicin for 14 days; all showed increased C7 at the DEJ persisting
          for at least 6 months, and monitored wounds exhibited greater than 85% closure.

          '
        treatment_term:
          preferred_term: gentamicin readthrough therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: gentamicin
            term:
              id: NCIT:C519
              label: Gentamicin
      selected_evidence:
        snippet: At 1 and 3 months post-treatment, 100% of the monitored wounds exhibited > 85% closure
        supports: SUPPORT
