  f6c484487b88c95bf4225458b38eb1072c82ec8bc4b34b65b42fea45d92f5ec2:
    claim:
      about:
        disease:
          name: E-Cigarette or Vaping Product Use-Associated Lung Injury
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ketene_thermal_degradation_route
        hypothesis_label: Thermal degradation of vitamin E acetate to ketene
        status: ALTERNATIVE
        description: 'A competing account in which the injurious agent is not vitamin E acetate itself
          but ketene, a highly toxic gas formed when the compound is heated in the device. It is not merely
          a rival: it is compatible with every piece of evidence supporting the canonical route, because
          a patient who inhales ketene has also inhaled vitamin E acetate, and lavage sampling would recover
          the parent compound either way. That is what makes the two hard to separate from human specimens,
          and why this entry curates the exposure node in terms of the compound inhaled rather than the
          species that does the damage.'
        notes: Curated as a hypothesis rather than as pathophysiology nodes because no cited source demonstrates
          ketene in a patient. Adding a ketene node to the pathograph would assert a route that has been
          shown in a device, not in a lung.
      selected_evidence:
        snippet: A potential mechanism for EVALI may involve VEA's thermal decomposition product, ketene,
          a highly poisonous gas, being generated under vaping conditions.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:39078936
      reference_title: Conditions Leading to Ketene Formation in Vaping Devices and Implications for Public
        Health.
      evidence_source: OTHER
      explanation: States the alternative mechanism as a mechanism, in the authors' own hedged terms.
        Tagged OTHER because the study is a device-chemistry experiment rather than clinical, in vitro
        or animal biology.
    first_seen_at: '2026-09-25T14:50:45.623561+00:00'
