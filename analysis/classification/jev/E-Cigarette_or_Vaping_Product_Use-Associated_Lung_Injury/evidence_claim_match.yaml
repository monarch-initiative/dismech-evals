        name: Systemic Glucocorticoid Therapy
        description: 'Systemic corticosteroids are the mainstay of treatment, given alongside oxygen and
          supportive care. The evidence is observational: patients improved on treatment in uncontrolled
          cohorts, and no controlled trial exists, so response cannot be separated from removal of the
          exposure and the natural course of an acute injury.'
