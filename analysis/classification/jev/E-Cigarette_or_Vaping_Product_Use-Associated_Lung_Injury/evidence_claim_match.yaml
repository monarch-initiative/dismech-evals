  186563122683a0a0d23081cbd0d4ac807c21948bc89815e9fefbee1510ac4af0:
    claim:
      about:
        disease:
          name: E-Cigarette or Vaping Product Use-Associated Lung Injury
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vitamin_e_acetate_association_versus_causation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Vitamin E acetate is recovered from the lungs of nearly every EVALI patient and from no
          comparator. Does it cause the disease, and is it the only thing that does?
        attaches_to:
        - pathophysiology#Inhalation of Vitamin E Acetate from Vaping Aerosol
        - pathophysiology#Disruption of Pulmonary Surfactant Function
        rationale: 'The exposure evidence here is unusually strong for an environmental disease: the agent
          was measured in the affected compartment, in 94% of cases and 0 of 99 comparators, with five
          rival toxicants assayed in the same fluid and essentially absent. It is much better than the
          correlational exposure data most entries in this knowledge base rest on.

          It is still an association, and the source paper says so. Its conclusion claims association
          in a convenience sample and does not claim causation, and the mouse study that followed opens
          by stating that additional studies are needed to establish whether a causal link exists. This
          entry follows both sources rather than rounding them up: the pathograph runs from the exposure
          to the injury, but the surfactant node is described as a proposal and the edges out of it are
          typed with unknown intermediates.

          Two specific gaps sit underneath. Nothing cited here demonstrates the surfactant lesion in human
          EVALI lung, so the mechanism connecting a recovered compound to an injured alveolus is inferred
          rather than observed. And 3 of 51 case patients had no detectable vitamin E acetate at all,
          which the single-agent account does not explain and which this entry does not explain away.
          National surveillance carries a second, independent version of the same problem: 2% of patients
          with product data reported using neither THC- nor nicotine-containing products at all, so the
          exposure route itself is unaccounted for in a small minority.'
        proposed_experiments:
        - experiment_id: surfactant_function_in_human_evali_lung
          name: Measure surfactant function in human EVALI lung
          description: 'In bronchoalveolar lavage fluid from acute EVALI, measure surface tension and
            surfactant phospholipid composition directly, against both healthy vapers and patients with
            non-EVALI acute lung injury. The second comparator is the one that matters: a surfactant abnormality
            found in any acute lung injury would not support a vitamin E acetate-specific mechanism. Relate
            the measurements to the vitamin E acetate concentration in the same specimen, and include
            the case patients in whom none is detectable.'
      selected_evidence:
        snippet: Vitamin E acetate was associated with EVALI in a convenience sample of 51 patients in
          16 states across the United States.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:31860793
      reference_title: Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI.
      evidence_source: HUMAN_CLINICAL
      explanation: The source's own conclusion, and the reason this is a gap rather than a settled mechanism.
        It claims association in a convenience sample. PARTIAL because it supports the exposure-disease
        link while explicitly declining the causal claim this discussion is about.
