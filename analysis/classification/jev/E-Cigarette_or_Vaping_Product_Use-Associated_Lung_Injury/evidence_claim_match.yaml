            id: CHEBI:32321
            label: alpha-Tocopherol acetate
        - preferred_term: tetrahydrocannabinol
          term:
            id: CHEBI:66964
            label: Delta(9)-tetrahydrocannabinol
      selected_evidence:
        snippet: No other priority toxicants were found in BAL fluid from the case patients or the comparator
          group, except for coconut oil and limonene, which were found in 1 patient each.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:31860793
      reference_title: Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI.
