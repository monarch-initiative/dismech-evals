        context: []
      assertion_type: Treatment
      assertion:
        name: Supplemental Oxygen and Mechanical Ventilation
        description: 'Oxygen, and mechanical ventilation where needed, is the treatment that addresses
          the gas-exchange failure directly. It is supportive rather than disease-modifying: it substitutes
          for the failing alveolus while the injury resolves. Named for the two interventions rather than
          for supportive care in general, so that the DEVICE modality describes what is actually delivered.'
        notes: 'The generic NCIT:C15747 Supportive Care action term is deliberate. NCIT:C94624 Oxygen
          Therapy was proposed as a closer fit and does exist (OAK-verified, and already bound by three
          other entries), but it names only half of what this treatment covers: NCIT separates oxygen
          therapy from mechanical ventilation (NCIT:C171457, NCIT:C191573) and has no term spanning both.
          Binding it would trade accurate generality for a precision that excludes the ventilation arm,
          which is the same mismatch the rename fixed, running the other way.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Nearly half the patients (47%) required intensive care to treat respiratory failure.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:31860793
      reference_title: Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Quantifies the need for this treatment rather than its efficacy: nearly half of patients
