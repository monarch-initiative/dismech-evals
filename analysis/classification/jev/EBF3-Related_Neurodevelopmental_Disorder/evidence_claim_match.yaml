  b82c33850cb22d8069e714021b0508592be682a0a2a3b932216966f328dab288:
    claim:
      about:
        disease:
          name: EBF3-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: hypotonia, ataxia, and delayed development syndrome
            term:
              id: MONDO:0015021
              label: hypotonia, ataxia, and delayed development syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: EBF3
        gene_term:
          preferred_term: EBF3
          term:
            id: hgnc:19087
            label: EBF3
        association: Pathogenic Mutations
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: Missense variants cluster in the DNA-binding domain, with recurrent changes at Arg163 and
          Arg209; nonsense, frameshift and splice-site variants and 10q26.3 deletions removing EBF3 also
          cause the disorder. ClinGen records loss of function as the mechanism and notes that some studies
          also suggest a dominant-negative effect of missense variants. De novo noncoding variants in
          hs737, a brain-specific enhancer that targets EBF3, are enriched in simplex autism (PMID:34256850);
          the carriers had intact cognition with hypotonia or motor delay, so whether they fall within
          this disorder is not settled, and they are not counted as causal variants here.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_c194cac3-00f5-44b5-9993-64cf7aca9cf4-2023-05-16T160000.000Z
      selected_evidence:
        snippet: Our findings indicate that mutations in EBF3 cause a genetic neurodevelopmental syndrome
        supports: SUPPORT
