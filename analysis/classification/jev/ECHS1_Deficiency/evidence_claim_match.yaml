      assertion_type: Prevalence
      assertion:
        notes: ECHS1 deficiency is a rare inborn error of metabolism. It was first described in 2014,
          and subsequent case series and reviews have reported a growing but still small number of patients
          worldwide; a precise population prevalence has not been established. Haack et al. identified
          ten unrelated individuals by exome sequencing across three diagnostic centers screening cohorts
          with suspected mitochondrial disease.
      selected_evidence:
        snippet: Using exome sequencing, we identified ten unrelated individuals carrying compound heterozygous
          or homozygous mutations in ECHS1.
        supports: SUPPORT
