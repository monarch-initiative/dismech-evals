          as a mechanism-directed, investigational therapy aimed at reducing production of the toxic metabolites.
          Reported outcomes are variable; in one pediatric case a valine- and fat-restricted diet was
          associated with improvement in dystonia and appeared to limit disease progression, but evidence
          remains limited to small case reports.

          '
