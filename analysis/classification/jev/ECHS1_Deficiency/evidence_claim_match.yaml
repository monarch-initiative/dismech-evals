          complex.
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - Reactive methacrylyl-CoA/acryloyl-CoA adduct formation on sulfhydryl-bearing mitochondrial proteins
      selected_evidence:
        snippet: Accumulation of toxic methacrylyl-CoA and acryloyl-CoA, two highly reactive intermediates
          that spontaneously react with sulfhydryl groups of, for example, cysteine and cysteamine, is
          suspected to cause brain pathology and biochemical phenotype in β-hydroxyisobutyryl-CoA hydrolase
          (HIBCH) deficiency
        supports: SUPPORT
