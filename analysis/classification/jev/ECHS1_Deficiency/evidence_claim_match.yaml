        name: Valine- and fat-restricted diet
        description: 'Because the neurotoxicity is attributed to accumulation of valine-pathway intermediates
          (methacrylyl-CoA and acryloyl-CoA), a valine-restricted (and fat-restricted) diet is being explored
          as a mechanism-directed, investigational therapy aimed at reducing production of the toxic metabolites.
          Reported outcomes are variable; in one pediatric case a valine- and fat-restricted diet was
          associated with improvement in dystonia and appeared to limit disease progression, but evidence
          remains limited to small case reports.

          '
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: dietary intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
          dietary_modifications:
          - action: RESTRICT
            description: Restriction of dietary valine (and branched-chain amino acids) to reduce toxic
              valine-pathway metabolite production.
          - action: RESTRICT
            description: Restriction of total and dairy fat intake as an adjunct in the reported regimen.
      selected_evidence:
        snippet: A valine-restricted and total fat-restricted diet was considered as a therapeutic option
          after the genetic diagnosis.
        supports: SUPPORT
