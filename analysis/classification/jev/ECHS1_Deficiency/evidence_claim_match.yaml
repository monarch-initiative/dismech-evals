        description: 'Biallelic pathogenic variants in ECHS1 markedly reduce short-chain enoyl-CoA hydratase
          (SCEH/crotonase) protein and enzyme activity in the mitochondrial matrix. SCEH is a multifunctional
          hydratase acting on substrates from several pathways, catalyzing the second step of the fatty-acid
          beta-oxidation spiral and an early hydration step of valine catabolism.

          '
        genes:
        - preferred_term: ECHS1
          term:
            id: hgnc:3151
            label: ECHS1
        molecular_functions:
        - preferred_term: enoyl-CoA hydratase activity
          term:
            id: GO:0004300
            label: enoyl-CoA hydratase activity
          modifier: DECREASED
        locations:
        - preferred_term: mitochondrial matrix
          term:
            id: GO:0005759
            label: mitochondrial matrix
      selected_evidence:
        snippet: The human ECHS1 gene encodes the short-chain enoyl coenzyme A hydratase, the enzyme that
          catalyzes the second step of β-oxidation of fatty acids in the mitochondrial matrix.
        supports: SUPPORT
