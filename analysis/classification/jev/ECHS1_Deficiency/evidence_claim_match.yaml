          term:
            id: GO:0005759
            label: mitochondrial matrix
      selected_evidence:
        snippet: The human ECHS1 gene encodes the short-chain enoyl coenzyme A hydratase, the enzyme that
          catalyzes the second step of β-oxidation of fatty acids in the mitochondrial matrix.
        supports: SUPPORT
