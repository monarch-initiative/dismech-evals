        snippet: Additional co-immunoprecipitation assays revealed that p.D120Y-, p.L122R-, and p.D123N-mutant
          EDARADD markedly prevented the interaction between EDAR and wild-type EDARADD, which further
          indicated a dominant negative effect by these mutations. Finally, we found that p.D120Y-, p.L122R-,
          and p.D123N-mutant EDARADD completely lost the ability to bind with TRAF6, while p.E152K-mutant
          EDARADD showed a mild reduction in the affinity.
        supports: SUPPORT
