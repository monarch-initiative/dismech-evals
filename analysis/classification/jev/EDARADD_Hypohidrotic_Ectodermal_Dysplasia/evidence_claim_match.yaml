          modifier: DECREASED
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
        - preferred_term: Ectodermal Placode Formation
          modifier: DECREASED
          term:
            id: GO:0060788
            label: ectodermal placode formation
        - preferred_term: Sweat Gland Development
          modifier: DECREASED
          term:
            id: GO:0060792
