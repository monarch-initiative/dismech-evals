        conforms_to: eda_edar_nfkb_ectodermal_appendage#EDA-EDAR-EDARADD Canonical NF-kappaB Signaling
          Failure
        description: EDARADD is the intracellular adaptor protein that bridges the EDAR receptor to downstream
          NF-κB signaling. Upon EDA ligand binding to EDAR, the receptor's intracellular death domain
          recruits EDARADD, which in turn recruits TRAF6 to activate the IKK complex and NF-κB transcription
          factors. Loss of EDARADD function completely blocks this signaling cascade, preventing NF-κB-dependent
          transcriptional programs required for ectodermal appendage initiation and morphogenesis.
