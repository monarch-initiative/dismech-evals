            term:
              id: MONDO:0013983
              label: ectodermal dysplasia 11B, hypohidrotic/hair/tooth type, autosomal recessive
        context: []
      assertion_type: Prevalence
      assertion:
        population: Hypohidrotic ectodermal dysplasia patient cohorts
        notes: 'EDARADD-related HED is the rarest of the four core HED genetic forms: in a French screen
          of 28 EDA/EDAR-negative HED families (PMID:20222921), only 1 carried a causative EDARADD mutation;
          in a 61-patient French HED cohort (PMID:20979233), the four core genes accounted for 92% (56/61)
          of cases (EDA 58%, WNT10A 16%, EDAR 16%, leaving ~2% for EDARADD); and in a 261-family Russian
          HED cohort with 183 genetically solved probands (PMID:41645317), 0 of 183 carried pathogenic
          EDARADD variants.'
      selected_evidence:
        snippet: We identified one EDARADD 6-bp homozygous in-frame deletion (c.402-407del, p.Thr135-Val136del)
          in a patient born to consanguineous parents. Functional studies showed that the p.Thr135-Val136del
          impaired the EDAR-EDARADD interaction and then severely inhibited NF-kappaB activity. In the
          remaining 27 patients, we failed to find causative mutations in EDARADD, or in TRAF6, TAB2 or
          TAK1.
        supports: SUPPORT
    origin:
