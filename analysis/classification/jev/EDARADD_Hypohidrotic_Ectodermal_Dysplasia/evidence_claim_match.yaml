        - preferred_term: ectoderm development
          term:
            id: GO:0007398
            label: ectoderm development
      selected_evidence:
        snippet: Nuclear factor (NF)-κB reporter assays demonstrated that all the mutant EDARADD showed
          reduction in activation of NF-κB.
        supports: SUPPORT
