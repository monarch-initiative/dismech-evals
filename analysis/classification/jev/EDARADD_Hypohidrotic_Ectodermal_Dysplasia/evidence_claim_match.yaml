            label: Molecular Analysis
        description: Multigene ectodermal dysplasia panel sequencing (including EDA, EDAR, EDARADD, and
          WNT10A) or whole-exome sequencing to identify biallelic or heterozygous pathogenic variants
          in EDARADD. Molecular testing is essential for definitive diagnosis because EDARADD-related
          HED is clinically indistinguishable from EDA- and EDAR-related HED.
        results: Identification of biallelic pathogenic variants in EDARADD (confirming autosomal recessive
          ECTD11B) or a heterozygous dominant-negative EDARADD pathogenic variant in a male or female
          (confirming autosomal dominant ECTD11A).
      selected_evidence:
        snippet: Identification of a hemizygous EDA pathogenic variant in an affected male or biallelic
          EDAR, EDARADD, or WNT10A pathogenic variants in an affected male or female confirms the diagnosis.
          The diagnosis of mild HED is established in a female by identification of a heterozygous EDA,
          EDAR, EDARADD, or WNT10A pathogenic variant. The diagnosis of mild HED is established in a male
          by identification of a heterozygous EDAR, EDARADD, or WNT10A pathogenic variant.
        supports: SUPPORT
