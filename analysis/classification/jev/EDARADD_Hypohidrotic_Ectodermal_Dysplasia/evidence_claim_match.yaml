            term:
              id: MONDO:0013983
              label: ectodermal dysplasia 11B, hypohidrotic/hair/tooth type, autosomal recessive
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: Heterozygous missense variants in the death domain of EDARADD—which encodes two alternatively
          spliced isoforms differing by 10 N-terminal amino acids (205-amino-acid isoform A and 215-amino-acid
          isoform B)—including c.335T>G (p.Leu112Arg in isoform A, corresponding to c.365T>G, p.Leu122Arg
          in isoform B), c.358G>T (p.Asp120Tyr in isoform B, residue 110 in isoform A), and c.367G>A (p.Asp123Asn
          in isoform B, residue 113 in isoform A), cause autosomal dominant hypohidrotic ectodermal dysplasia
          (ECTD11A, OMIM 614940) through a dominant-negative mechanism that impairs TRAF6 recruitment
          and suppresses wild-type EDARADD-mediated NF-κB activation. Each child of an individual with
          autosomal dominant EDARADD-related HED has a 50% chance of inheriting the pathogenic variant.
      selected_evidence:
        snippet: Here, we report a large Moroccan family with an autosomal dominant EDA. We mapped the
          disease gene to chromosome 1q42.2-q43, and identified a novel missense mutation in the EDARADD
          gene (c.335T>G, p.Leu112Arg). Thus, the EDARADD gene accounts for both recessive and dominant
          EDA.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/0
      context_paths:
