        - Frequent nail dysplasia and palmoplantar keratoderma (odonto-onycho-dermal dysplasia spectrum)
        - Pathogenic variants in WNT10A on molecular genetic testing
      selected_evidence:
        snippet: Although no clinical differences between patients carrying EDA1, EDAR, or EDARADD mutations
          could be identified, patients harboring WNT10A mutations displayed distinctive clinical features
          (marked dental phenotype, no facial dysmorphism), helping to decide which gene should be first
          investigated in HED/EDA.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20979233
      reference_title: Only four genes (EDA1, EDAR, EDARADD, and WNT10A) account for 90% of hypohidrotic/anhidrotic
        ectodermal dysplasia cases.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates that WNT10A-related HED displays a distinctive marked dental phenotype
        without classic HED facial dysmorphism, distinguishing it from EDARADD-related HED.
