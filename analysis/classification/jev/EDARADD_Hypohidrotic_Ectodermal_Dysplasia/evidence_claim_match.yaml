                label: EDARADD
            features: Biallelic loss-of-function variants in the C-terminal death domain of EDARADD (chromosome
              1q42.3-q43) cause autosomal recessive hypohidrotic ectodermal dysplasia (ECTD11B, OMIM 614941,
              HED3). Because EDARADD has two alternatively spliced isoforms differing by 10 N-terminal
              amino acids (205-amino-acid isoform A and 215-amino-acid isoform B), the original recessive
              missense variant is numbered p.Glu142Lys in isoform A (Bal et al. 2007) and p.Glu152Lys
              (p.E152K) in isoform B (Asano et al. 2021); it shows a mild reduction in TRAF6 binding affinity
              while retaining significant ability to activate the NF-κB pathway and therefore causes disease
              only in the homozygous state. Homozygous truncating variants in the last exon, such as c.322_323insCGGGC
              p.(Arg108ProfsTer7), also cause classic autosomal recessive HED. Across all HED cohorts,
              EDARADD pathogenic variants account for ~1%–2% of cases.
          role: ancestor
        - path: /has_subtypes/0
          value:
            name: AR
            display_name: Autosomal Recessive EDARADD-Related HED (ECTD11B, OMIM 614941)
            description: Classic autosomal recessive subtype (ECTD11B, OMIM 614941, MONDO:0013983, HED3)
              caused by biallelic loss-of-function variants in EDARADD, such as homozygous c.424G>A (p.Glu142Lys
              in the 205-amino-acid isoform A; p.Glu152Lys in the 215-amino-acid isoform B), homozygous
              c.402-407del (p.Thr135-Val136del), or homozygous c.322_323insCGGGC (p.Arg108ProfsTer7).
              Affects males and females with equal severity and produces the full classic HED triad of
              hypohidrosis, sparse hair, and hypodontia with conical teeth.
            subtype_term:
              preferred_term: ectodermal dysplasia 11B, hypohidrotic/hair/tooth type, autosomal recessive
              term:
                id: MONDO:0013983
                label: ectodermal dysplasia 11B, hypohidrotic/hair/tooth type, autosomal recessive
