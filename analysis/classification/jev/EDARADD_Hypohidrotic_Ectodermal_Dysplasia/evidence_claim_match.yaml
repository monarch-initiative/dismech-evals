            id: hgnc:14341
            label: EDARADD
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        features: Biallelic loss-of-function mutations in EDARADD cause HED3. EDARADD encodes a death
          domain-containing adaptor protein that interacts with the intracellular death domain of EDAR
          and recruits TRAF6 to activate the NF-κB pathway. Most reported mutations are missense variants
          affecting the death domain. Recessive variants typically retain partial NF-κB activation, while
          dominant EDARADD variants (causing the separate entity ECTD11A) act via a dominant negative
          mechanism.
        variants:
        - name: p.Glu142Lys (p.E142K)
          description: Recessive missense variant in the death domain of EDARADD. The first EDARADD mutation
            identified in a human HED family. Retains partial ability to activate NF-κB, consistent with
            recessive inheritance.
        - name: p.Thr135_Val136del
          description: Recessive in-frame deletion of two residues in the death domain. Identified in
            a consanguineous family. Impairs the EDAR-EDARADD interaction and severely inhibits NF-κB
            activity.
        - name: p.Arg108ProfsTer7
          description: Recessive homozygous frameshift insertion (c.322_323insCGGGC) in the last exon
            of EDARADD, introducing a premature stop codon. Identified in two consanguineous siblings
            with classical HED phenotype.
      selected_evidence:
        snippet: We also identify a missense mutation in its human orthologue, EDARADD, that is present
          in a family affected with hypohidrotic ectodermal dysplasia.
        supports: SUPPORT
