              variant is reported as c.335T>G (p.Leu112Arg) in isoform A and as p.Leu122Arg (p.L122R)
              in isoform B, alongside the adjacent isoform B dominantly inherited missense variants p.Asp120Tyr
              (p.D120Y) and p.Asp123Asn (p.D123N). All three dominant-negative mutants markedly prevent
              the interaction between EDAR and wild-type EDARADD, completely lose the ability to bind
              TRAF6, and suppress NF-κB activation induced by wild-type EDARADD.
