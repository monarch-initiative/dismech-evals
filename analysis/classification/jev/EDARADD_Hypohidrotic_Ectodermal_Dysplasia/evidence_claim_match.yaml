          Failure
        description: EDARADD encodes the intracellular death domain adaptor protein—expressed as two alternatively
          spliced isoforms differing by 10 N-terminal amino acids (205-amino-acid isoform A and 215-amino-acid
          isoform B)—that self-associates and interacts via its C-terminal death domain with the cytoplasmic
          death domain of the ectodysplasin A receptor (EDAR), linking ligand-bound EDAR to TRAF6, TAB2,
          and TAK1 to activate the IKK complex and canonical NF-κB transcription in embryonic surface
          ectoderm. Biallelic loss-of-function variants (such as c.424G>A [p.Glu142Lys in isoform A /
          p.Glu152Lys in isoform B], which impairs EDAR interaction while retaining partial NF-κB activity,
          c.402-407del [p.Thr135-Val136del], or frameshift insertions in the death domain) and heterozygous
          dominant-negative death domain missense variants (c.335T>G [p.Leu112Arg in isoform A / c.365T>G,
          p.Leu122Arg in isoform B], c.358G>T [p.Asp120Tyr in isoform B], and c.367G>A [p.Asp123Asn in
          isoform B], which abolish TRAF6 binding and suppress wild-type EDARADD signaling) abrogate downstream
          canonical NF-κB activation required for ectodermal placode induction and morphogenesis of eccrine
          sweat glands, hair follicles, and teeth.
