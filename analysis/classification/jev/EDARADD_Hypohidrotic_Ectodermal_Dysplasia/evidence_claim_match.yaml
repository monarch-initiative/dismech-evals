        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted EDA-EDAR-EDARADD-NF-κB Signaling
        conforms_to: eda_edar_nfkb_ectodermal_appendage#EDA-EDAR-EDARADD Canonical NF-kappaB Signaling
          Failure
        description: EDARADD is the intracellular adaptor protein that bridges the EDAR receptor to downstream
          NF-κB signaling. Upon EDA ligand binding to EDAR, the receptor's intracellular death domain
          recruits EDARADD, which in turn recruits TRAF6 to activate the IKK complex and NF-κB transcription
          factors. Loss of EDARADD function completely blocks this signaling cascade, preventing NF-κB-dependent
          transcriptional programs required for ectodermal appendage initiation and morphogenesis.
        cell_types:
        - preferred_term: ectodermal cell
          term:
            id: CL:0000221
            label: ectodermal cell
        biological_processes:
        - preferred_term: canonical NF-κB signaling
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
        - preferred_term: ectoderm development
          term:
            id: GO:0007398
            label: ectoderm development
      selected_evidence:
        snippet: This adapter, which we have called Edaradd (for Edar-associated death domain), interacts
          with the death domain of Edar and links the receptor to downstream signalling pathways.
        supports: SUPPORT
