        context: []
      assertion_type: Genetic
      assertion:
        name: EDAR Loss-of-Function Mutations
        association: Pathogenic Variants
        gene_term:
          preferred_term: EDAR
          term:
            id: hgnc:2895
            label: EDAR
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        features: Biallelic (AR) or heterozygous dominant-negative (AD) mutations in EDAR (2q11-q13).
          The gene encodes a TNF receptor superfamily member with an extracellular ligand-binding domain,
          transmembrane domain, and intracellular death domain. Missense mutations in the ligand-binding
          domain (extracellular TNFR domain) prevent EDA binding; mutations in the death domain (exon
          12) prevent EDARADD recruitment and produce dominant-negative effects. Recessive mutations are
          found throughout the gene; dominant mutations cluster in the death domain. EDAR accounts for
          approximately 6.5% of all HED and about 25% of non-EDA HED.
        variants:
        - name: p.Arg420Trp
          description: Missense variant in the death domain showing variable expressivity from isolated
            tooth agenesis to full HED phenotype.
        - name: p.W434R
          description: Recurrent homozygous missense variant in exon 12 causing severe AR-HED, identified
            in consanguineous Kashmiri families.
        - name: p.Phe96Ser
          description: Novel missense variant in the extracellular ligand-binding domain causing AD-HED,
            demonstrating that some extracellular domain mutations can also have dominant effects.
        case_fractions:
        - population: French four-gene HED/EDA patient cohort (61 unrelated HED/EDA patients)
          case_fraction_percent: 16.0
          cohort_size: 61
          notes: EDAR pathogenic variants were responsible for 16% of cases among 61 unrelated patients
            presenting with hypohidrotic/anhidrotic ectodermal dysplasia (HED/EDA) in a French multi-gene
            cohort.
        - population: Russian genetically solved HED probands (183 solved probands from 261 unrelated
            families)
          case_fraction_percent: 6.5
          cohort_size: 183
          notes: EDAR pathogenic or likely pathogenic variants accounted for 6.5% (12 of 183 genetically
            solved probands, from 261 total unrelated HED families) in the Russian HED cohort.
        - population: Non-EDA (non-ED1) hypohidrotic ectodermal dysplasia patients
          case_fraction_percent: 25.0
          cohort_size: 37
          notes: EDAR mutations were identified in 9 of 37 (~25%) unrelated HED families or sporadic cases
            with no detected mutations in the EDA (ED1) gene.
      selected_evidence:
        snippet: The putative protein is predicted to have a single transmembrane domain, and shows similarity
          to two separate domains of the tumour necrosis factor receptor (TNFR) family.
        supports: SUPPORT
