      assertion:
        name: WNT10A-Related Ectodermal Dysplasia (Odonto-Onycho-Dermal Dysplasia)
        description: Caused by pathogenic variants in WNT10A, which account for 8.8% of genetically solved
          HED probands in the Russian cohort and 16% of HED/EDA cases in the French four-gene cohort.
          WNT10A variants cause a spectrum of ectodermal dysplasias—including autosomal recessive odonto-onycho-dermal
          dysplasia (OODD, bound here as MONDO:0009773) and Schöpf-Schulz-Passarge syndrome—presenting
          with overlapping hypodontia/oligodontia, hypohidrosis, and hypotrichosis.
        distinguishing_features:
        - Marked dental phenotype (severe oligodontia of permanent dentition) with absence of classic
          HED craniofacial dysmorphism (frontal bossing, depressed nasal bridge)
        - Pathogenic variants in WNT10A on molecular genetic testing
        disease_term:
          preferred_term: odonto-onycho-dermal dysplasia
          term:
            id: MONDO:0009773
            label: odonto-onycho-dermal dysplasia
      selected_evidence:
        snippet: 'The distribution of mutated genes was as follows: EDA (n = 155, 84.7%), WNT10A (n =
          16, 8.8%), and EDAR (n = 12, 6.5%).'
        supports: SUPPORT
