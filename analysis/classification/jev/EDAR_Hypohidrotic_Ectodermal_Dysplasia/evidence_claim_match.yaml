            term:
              id: MONDO:0016535
              label: hypohidrotic ectodermal dysplasia
        context:
        - path: /genetic/0
          value:
            name: EDAR Loss-of-Function Mutations
            association: Pathogenic Variants
            gene_term:
              preferred_term: EDAR
              term:
                id: hgnc:2895
                label: EDAR
            features: Biallelic (AR) or heterozygous dominant-negative (AD) mutations in EDAR (2q11-q13).
              The gene encodes a TNF receptor superfamily member with an extracellular ligand-binding
              domain, transmembrane domain, and intracellular death domain. Missense mutations in the
              ligand-binding domain (extracellular TNFR domain) prevent EDA binding; mutations in the
              death domain (exon 12) prevent EDARADD recruitment and produce dominant-negative effects.
              Recessive mutations are found throughout the gene; dominant mutations cluster in the death
              domain. EDAR accounts for approximately 6.5% of all HED and about 25% of non-EDA HED.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Arg420Trp
        description: Missense variant in the death domain showing variable expressivity from isolated
          tooth agenesis to full HED phenotype.
      selected_evidence:
        snippet: The same missense variant, c.1258C>T (p.Arg420Trp), has actually been reported to be
          restricted to the Icelandic population and to be associated with non-syndromic tooth agenesis
          but not HED. As our patient has no known relationship to Icelandic individuals and displays
          a rather severe HED phenotype, we suggest that EDAR-Arg420Trp is a more widespread variant,
          possibly with variable clinical expressivity.
        supports: SUPPORT
