        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative EDAR Mechanism
        description: Heterozygous EDAR mutations, primarily in the death domain (exon 12), produce a dominant-negative
          effect in AD-HED. Mutant EDAR binds wild-type EDAR but cannot recruit EDARADD, suppressing NF-kB
          activation from the wild-type allele. The subcellular localization of dominant-negative alleles
          differs dramatically from recessive or wild-type alleles, explaining the different mode of inheritance.
        biological_processes:
        - preferred_term: Canonical NF-kappaB Signaling
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
          modifier: DECREASED
      selected_evidence:
        snippet: the p.F398* mutant EDAR completely lost its affinity to EDARADD, and suppressed the downstream
          nuclear factor-κB activation induced by wild-type EDAR in a dominant-negative manner.
        supports: SUPPORT
    origin:
