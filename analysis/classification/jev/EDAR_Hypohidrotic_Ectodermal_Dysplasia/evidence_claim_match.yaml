          intracellular death domain, which activates the NF-kB signaling cascade. Biallelic loss-of-function
          EDAR mutations (AR) prevent ligand binding or adaptor recruitment, abolishing downstream NF-kB
          activation required for ectodermal appendage initiation and morphogenesis.
        cell_types:
