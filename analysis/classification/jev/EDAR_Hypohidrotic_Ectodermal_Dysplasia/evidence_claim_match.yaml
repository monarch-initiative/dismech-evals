        description: Caused by hemizygous (in males) or heterozygous (in females) pathogenic variants
          in EDA (Xq12-q13.1), accounting for 58%-85% of all HED cases. Classic autosomal recessive EDAR-related
          HED produces a pathomorphologic phenotype clinically indistinguishable from X-linked EDA-related
          HED in affected males.
        distinguishing_features:
        - X-linked inheritance with full expression in hemizygous males and variable or mosaic expression
          along Blaschko lines in heterozygous females, whereas autosomal recessive EDAR-related HED affects
          males and females with equal severity
        - Pathogenic variant in EDA rather than EDAR on molecular genetic testing
        disease_term:
          preferred_term: X-linked hypohidrotic ectodermal dysplasia
          term:
            id: MONDO:0010585
            label: X-linked hypohidrotic ectodermal dysplasia
      selected_evidence:
        snippet: 'The X-linked form of the disease, caused by mutations in the ED1 gene, represents the
          majority of HED cases. Autosomal-dominant and -recessive forms occur occasionally and result
          from mutations in at least two genes: EDAR and EDARADD. These different forms are phenotypically
          indistinguishable.'
        supports: SUPPORT
