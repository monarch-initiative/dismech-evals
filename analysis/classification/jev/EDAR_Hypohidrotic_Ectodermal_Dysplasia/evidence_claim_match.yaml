        snippet: the subcellular localization of dominant negative alleles of downless is dramatically
          different from that of recessive or wild-type alleles. This together with differences in NF-kappaB
          responses suggests an explanation for the different mode of inheritance of the different downless
          alleles.
        supports: SUPPORT
