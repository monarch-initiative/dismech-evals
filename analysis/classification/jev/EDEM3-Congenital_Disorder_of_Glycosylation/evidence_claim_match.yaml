        name: Impaired Glycoprotein ER-Associated Degradation
        biological_scale: CELLULAR
        description: Trimmed high-mannose glycans are the signal recognised by the lectins that deliver
          misfolded glycoproteins to ERAD. EDEM3 overexpression accelerates ERAD of misfolded glycoproteins,
          and combined EDEM1 and EDEM3 loss delays it. Slower clearance of misfolded glycoproteins is
          therefore the expected consequence of EDEM3 loss, but it has not been measured in patient cells.
        biological_processes:
        - preferred_term: ERAD pathway
          term:
            id: GO:0036503
            label: ERAD pathway
          modifier: DECREASED
      selected_evidence:
        snippet: EDEM3 accelerates glycoprotein ERAD in transfected HEK293 cells, as shown by increased
          degradation of misfolded alpha1-antitrypsin variant (null (Hong Kong)) and of TCRalpha.
        supports: SUPPORT
