              label: congenital disorder of glycosylation, type 2v
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deficient ER Mannose Trimming
        biological_scale: MOLECULAR
        genes:
        - preferred_term: EDEM3
          term:
            id: hgnc:16787
            label: EDEM3
        description: Without EDEM3, alpha-1,2-linked mannose is not trimmed from Man8GlcNAc2 isomer B
          to Man7-5GlcNAc2, and Man5GlcNAc2 is not trimmed to Man4GlcNAc2, with accumulation of Glc1Man5GlcNAc2
          in patient fibroblasts. The authors suggest that this Man5 species may come from the lipid-linked
          oligosaccharide precursor rather than from trimming, which would imply an additional effect
          on precursor synthesis; this is speculative. In purified enzyme assays EDEM3 alone converts
          M8B to M7, M6 and M5 and is a major alpha-1,2-mannosidase for this second trimming step.
        molecular_functions:
        - preferred_term: mannosyl-oligosaccharide 1,2-alpha-mannosidase activity
          term:
            id: GO:0004571
            label: mannosyl-oligosaccharide 1,2-alpha-mannosidase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: mannose trimming involved in glycoprotein ERAD pathway
          term:
            id: GO:1904382
            label: mannose trimming involved in glycoprotein ERAD pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Overexpression of EDEM3 also greatly stimulates mannose trimming not only from misfolded
          alpha1-AT null (Hong Kong) but also from total glycoproteins
        supports: SUPPORT
