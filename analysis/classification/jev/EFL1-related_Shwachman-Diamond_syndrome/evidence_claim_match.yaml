          term:
            id: hgnc:25789
            label: EFL1
        biological_processes:
        - preferred_term: ribosomal large subunit assembly
          modifier: ABNORMAL
          term:
            id: GO:0000027
            label: ribosomal large subunit assembly
      selected_evidence:
        snippet: Similar to the molecular pathology of SDS, mutant EFL1 proteins do not promote the release
          of cytoplasmic Tif6 from the 60S subunit, likely preventing the formation of mature ribosomes.
        supports: SUPPORT
