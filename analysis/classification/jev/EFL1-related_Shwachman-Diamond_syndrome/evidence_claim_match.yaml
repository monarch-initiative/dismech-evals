      assertion_type: IUISAssignment
      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 1 (Congenital Neutropenias). Four Table 5
          rows are printed under the Shwachman-Diamond Syndrome disease label, one per causal gene: SBDS
          (AR, MIM 607444), DNAJC21 (AR, MIM 617052), EFL1 (AR, MIM 617941) and SRP54 (AD, MIM 604857).
          This entry claims the EFL1 row specifically — affected cells N + HSC, affected function neutrophil
          maturation, chemotaxis and ribosomal biogenesis. The other three rows sit on the Shwachman-Diamond
          syndrome entry, mirroring the split already recorded in the isds_skeletal_category notes above;
          neither entry claims the other''s rows.

          IUIS 2022 places Shwachman-Diamond syndrome in Table 5, NOT in Table 9 (bone marrow failure),
          whose members are Fanconi anemia, MIRAGE, ataxia-pancytopenia, dyskeratosis congenita, BMFS1/2/5,
          Coats plus and MECOM.'
      selected_evidence:
        snippet: EFL1 AR 617941 N + HSC
        supports: SUPPORT
