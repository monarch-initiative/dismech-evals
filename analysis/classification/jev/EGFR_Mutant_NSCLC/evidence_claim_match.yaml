      assertion_type: Pathophysiology
      assertion:
        name: Oncogene Addiction
        description: EGFR-mutant tumors exhibit oncogene addiction, with survival critically dependent
          on continued EGFR signaling. EGFR inhibition leads to rapid tumor regression through induction
          of apoptosis and cell cycle arrest. This creates the therapeutic window for TKI therapy.
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: Osimertinib showed efficacy superior to that of standard EGFR-TKIs in the first-line
          treatment of EGFR mutation-positive advanced NSCLC, with a similar safety profile and lower
          rates of serious adverse events.
        supports: SUPPORT
    origin:
