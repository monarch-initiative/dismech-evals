      assertion:
        name: TKI Resistance Mechanisms
        description: 'Resistance to EGFR TKIs develops through multiple mechanisms: secondary EGFR mutations
          (T790M, C797S), bypass pathway activation (MET amplification, HER2 amplification and other oncogenic
          fusions), AP-1/EMT transcriptional states, and histologic transformation (small cell or squamous).
          Understanding resistance guides sequential therapy selection and combination strategies.'
        biological_processes:
        - preferred_term: response to drug
          modifier: ABNORMAL
          term:
            id: GO:0009410
            label: response to xenobiotic stimulus
      selected_evidence:
        snippet: in two of five patients with acquired resistance to gefitinib or erlotinib, progressing
          tumors contain, in addition to a primary drug-sensitive mutation in EGFR, a secondary mutation
          in exon 20, which leads to substitution of methionine for threonine at position 790 (T790M)
          in the kinase domain.
        supports: SUPPORT
