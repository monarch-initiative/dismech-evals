  24742792c07b821cbdb286265fbee5fec80c14f952194b3c684ab5148bda67ab:
    claim:
      about:
        disease:
          name: EGFR-Mutant Non-Small Cell Lung Cancer
          disease_term:
            preferred_term: lung adenocarcinoma
            term:
              id: MONDO:0005061
              label: lung adenocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EGFR Oncogenic Mutations
        genetic_context:
          variant_origin: SOMATIC
        description: Activating EGFR mutations occur in the tyrosine kinase domain and cause constitutive
          receptor activation independent of ligand binding. Mutations alter the ATP-binding pocket, favoring
          the active kinase conformation and enhancing sensitivity to ATP-competitive TKIs.
        cell_types:
        - preferred_term: type II pneumocyte
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        biological_processes:
        - preferred_term: epidermal growth factor receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007173
            label: epidermal growth factor receptor signaling pathway
      selected_evidence:
        snippet: Somatic mutations were identified in the tyrosine kinase domain of the EGFR gene in eight
          of nine patients with gefitinib-responsive lung cancer, as compared with none of the seven patients
          with no response (P<0.001). Mutations were either small, in-frame deletions or amino acid substitutions
          clustered around the ATP-binding pocket of the tyrosine kinase domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15118073
      reference_title: Activating mutations in the epidermal growth factor receptor underlying responsiveness
        of non-small-cell lung cancer to gefitinib.
      evidence_source: HUMAN_CLINICAL
      explanation: Lynch et al. 2004 landmark paper identifying somatic EGFR mutations in the tyrosine
        kinase domain that correlate with gefitinib sensitivity, establishing the molecular basis of EGFR-mutant
        NSCLC.
