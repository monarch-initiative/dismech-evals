        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Pseudohypoxic Chromaffin Tumorigenesis
        prompt: Why is pheochromocytoma/paraganglioma such a rare event among EGLN1 carriers, and what
          additional factors determine which carriers develop a tumor?
        rationale: Erythrocytosis is near-universal in EGLN1 carriers, but tumor development is a very
          rare event with marked variable expressivity, and the mouse data suggest the pseudohypoxic chromaffin
          phenotype depends on dysregulation during adrenal development rather than on PHD2 loss per se.
          Whether a somatic second hit is necessary and sufficient, or whether additional genetic/developmental
          events are required, is unresolved.
      selected_evidence:
        snippet: showed that tumor development can be considered a very rare event
        supports: SUPPORT
