      assertion_type: Pathophysiology
      assertion:
        name: Germline EGLN1/PHD2 Loss-of-Function
        biological_scale: MOLECULAR
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        description: 'A heterozygous germline loss-of-function variant in EGLN1 reduces the catalytic
          activity of PHD2, the principal HIF prolyl hydroxylase, in every cell. Reported alleles are
          missense and truncating (nonsense, frameshift) and the overall mechanism of pathogenicity is
          loss of function. For the erythroid phenotype this single allele is sufficient: haploinsufficiency
          and partial deregulation of PHD2 is enough to cause erythrocytosis, so no second hit is required.
          For the tumor phenotype the constitutional allele is the first hit of a two-hit tumor-suppressor
          mechanism.'
        genes:
        - preferred_term: EGLN1
          term:
            id: hgnc:1232
            label: EGLN1
        molecular_functions:
        - preferred_term: HIF prolyl hydroxylase (PHD2) activity
          term:
            id: GO:0160082
            label: hypoxia-inducible factor-proline dioxygenase activity
          modifier: DECREASED
      selected_evidence:
        snippet: We show that this mutation in PHD2 results in a marked decrease in enzyme activity and
          is associated with familial erythrocytosis
        supports: SUPPORT
