        features: Heterozygous germline EGLN1 (PHD2) variants, both missense and truncating (nonsense,
          frameshift); the mechanism of pathogenicity is loss of function. ClinGen included 23 missense
          and nonsense variants reported in 31 probands across 7 publications in its curation. Erythrocytosis
          follows from haploinsufficiency (a single allele is sufficient); the rare pheochromocytoma/paraganglioma
          follows a two-hit tumor-suppressor mechanism, with somatic loss of heterozygosity of the wild-type
          allele demonstrated in tumor tissue. Tumor development is a very rare event among carriers and
          the PPGL spectrum shows variable expressivity, so additional genetic events are likely contributory.
        gene_disease_validity:
