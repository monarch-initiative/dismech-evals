          Loss of ELF4 removes this restraint.'
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: negative regulation of inflammatory response
          term:
            id: GO:0050728
            label: negative regulation of inflammatory response
          modifier: DECREASED
      selected_evidence:
        snippet: Elf4 both sustained the expression of anti-inflammatory genes, such as Il1rn, and limited
          the upregulation of inflammation amplifiers, including S100A8, Lcn2, Trem1 and neutrophil chemoattractants
        supports: SUPPORT
