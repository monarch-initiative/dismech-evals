        context: []
      assertion_type: Genetic
      assertion:
        name: ELF4 variants
        gene_term:
          preferred_term: ELF4
          term:
            id: hgnc:3319
            label: ELF4
        relationship_type: CAUSATIVE
        notes: Loss-of-function ELF4 variants cause DEX. Reported classes span frameshift (A339Pfs*32,
          G148Vfs*113, H156Ifs*105) and nonsense/early-termination (R234X, Q39X, R185X) alleles that trigger
          nonsense-mediated decay with loss of protein, missense variants disrupting the ETS DNA-binding
          domain in exon 7, an exon 2-7 deletion, and an intronic splice variant. Across 14 patients from
          13 families there are 11 distinct mutations; most are maternally inherited (11/12 with known
          origin), with one confirmed de novo (P6).
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_625f18f6-e14f-457b-9134-a2b1aeedc410-2025-06-25T160000.000Z
      selected_evidence:
        snippet: frameshift (A339Pfs*32, G148Vfs*113, and H156Ifs*105) or an early termination (R234X,
          Q39X, and R185X)
        supports: SUPPORT
