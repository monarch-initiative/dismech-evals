  42cb0a34996e0d09469cd511760a5e44020d64a00b2f80e00a19cfa927436d8e:
    claim:
      about:
        disease:
          name: EML1-related Ribbon-like Subcortical Heterotopia
          disease_term:
            preferred_term: EML1-associated ribbon-like subcortical heterotopia
            term:
              id: MONDO:0020491
              label: subcortical band heterotopia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_eml1_mouse_organoid_translatability
        prompt: Which EML1 progenitor defects are conserved between mouse cortical heterotopia models
          and human iPSC-derived cerebral organoids, and which disease branches depend on human-specific
          basal radial glia, extracellular matrix, or OSVZ-like biology?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Centrosome, Cilium and Mitotic Spindle Perturbation in Apical Radial Glia
        - pathophysiology#Apical Radial Glia Delamination and Ectopic Progenitors
        - pathophysiology#Ectopic Neurogenesis and Cortical Neuron Misplacement
        - pathophysiology#Ribbon-like Subcortical Heterotopia and Brain Overgrowth
        rationale: Mouse HeCo, knockout and conditional Eml1 models establish the conserved centrosome/cilium/spindle
          lesion and in vivo microtubule-rescue effect, but human cerebral organoids add disease-specific
          evidence for ectopic neural rosettes, heterotopic neuron clusters, basal radial glial marker
          expansion and human-specific extracellular matrix signatures. The open question is whether these
          organoid phenotypes are direct consequences of the same EML1-centrosome lesion or a human-amplified
          OSVZ/oRG branch that is only partly represented in lissencephalic rodent cortex.
        proposed_experiments:
        - experiment_id: exp_eml1_isogenic_organoid_microtubule_yap1_rescue
          name: EML1 isogenic organoid microtubule and YAP1 rescue panel
          description: Compare patient-derived EML1 organoids, CRISPR-corrected isogenic organoids and
            knock-in mutant controls, with orthogonal rescue arms that restore microtubule formation or
            dampen YAP1-triggered expansion. Quantify centrosome/cilium integrity, spindle orientation,
            radial-glial delamination, ectopic rosette formation, basal radial glial markers, extracellular
            matrix programs and heterotopic neuron clusters.
          experiment_type:
            preferred_term: isogenic cerebral organoid rescue assay
          model_systems:
          - name: Human iPSC-derived cerebral organoid EML1 model
            description: Patient-derived or genome-edited human cerebral organoids carrying EML1 loss-of-function
              or patient missense variants, with matched isogenic corrected controls.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: radial glial cell
              term:
                id: CL:0000681
                label: radial glial cell
            - preferred_term: neural progenitor cell
              term:
                id: CL:0011020
                label: neural progenitor cell
            cell_source: Patient-derived or isogenic engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cerebral organoid with imaging and single-cell readouts
          perturbations:
          - name: EML1 variant correction or knock-in
            target: pathophysiology#EML1 Loss of Function and Microtubule Dysregulation
            description: Correct patient EML1 variants or introduce matched variants into control iPSCs
              to separate causal EML1 effects from donor background.
          - name: Microtubule formation rescue
            target: pathophysiology#Apical Radial Glia Delamination and Ectopic Progenitors
            description: Test whether the mouse in vivo microtubule-rescue effect also rescues human organoid
              radial-glial delamination and ectopic rosette formation.
          - name: YAP1 pathway dampening
            target: pathophysiology#Ectopic Neurogenesis and Cortical Neuron Misplacement
            description: Perturb the organoid YAP1 expansion branch to test whether it is necessary for
              ectopic progenitor expansion and heterotopic neuron clusters downstream of EML1 loss.
          readouts:
          - name: Progenitor architecture and heterotopic neuron output
            target: pathophysiology#Ribbon-like Subcortical Heterotopia and Brain Overgrowth
            description: Quantify ectopic neural rosettes, basal radial glial markers, extracellular matrix
              programs and heterotopic neuron clusters across mutant, corrected and rescue conditions.
            assays:
            - preferred_term: immunostaining
            - preferred_term: single-cell transcriptomic profiling
            direction: POSITIVE
          controls:
          - name: Isogenic corrected organoids
            description: Matched organoids in which the EML1 variant is corrected.
          - name: Isogenic knock-in organoids
            description: Wild-type-background organoids carrying introduced EML1 variants.
          decision_criterion: A conserved EML1-centrosome skeleton is supported if variant correction
            or microtubule rescue normalizes both mouse and organoid progenitor delamination readouts.
            A human-specific branch is supported if organoid basal radial glial, extracellular-matrix
            or YAP1 phenotypes persist as separable outputs not captured by the mouse model.
          would_support:
          - pathophysiology#Apical Radial Glia Delamination and Ectopic Progenitors
          - pathophysiology#Ectopic Neurogenesis and Cortical Neuron Misplacement
      selected_evidence:
        snippet: The lack of human-specific models hampers our understanding of the molecular underpinnings
          of the intricate processes leading to MCD.
        supports: SUPPORT
