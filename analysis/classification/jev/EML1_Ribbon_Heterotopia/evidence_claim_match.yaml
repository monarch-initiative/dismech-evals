        - Subcortical heterotopia in Chudley-McCullough syndrome is less diffuse and shows a predilection
          for the cingulate gyrus
      selected_evidence:
        snippet: The imaging pattern also shows overlap with that observed in the Chudley McCullough syndrome.
          In these individuals subcortical heterotopia, agenesis/hypogenesis of the corpus callosum, and
          ventriculomegaly are frequently present
        supports: SUPPORT
