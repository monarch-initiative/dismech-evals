      assertion_type: Pathophysiology
      assertion:
        name: Apical Radial Glia Delamination and Ectopic Progenitors
        conforms_to: neural_progenitor_centrosome_spindle_dysfunction#Abnormal Progenitor Division and
          Fate Choice
        description: Centrosome/spindle perturbation causes apical radial glia to lose their apical anchoring
          and delaminate from the ventricular zone, so that dividing progenitors become abnormally distributed
          throughout the cortical wall rather than confined to the ventricular and subventricular zones.
          Misplaced apical progenitors are the critical initiating event for heterotopia formation, and
          rescuing microtubule formation in vivo reduces both delamination and heterotopia volume, establishing
          the causal link.
        cell_types:
        - preferred_term: apical radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: establishment of mitotic spindle orientation
          term:
            id: GO:0000132
            label: establishment of mitotic spindle orientation
          modifier: DYSREGULATED
      selected_evidence:
        snippet: EML1-deficient organoids display ectopic neural rosettes at the basal side of the ventricular
          zone areas and clusters of heterotopic neurons.
        supports: SUPPORT
