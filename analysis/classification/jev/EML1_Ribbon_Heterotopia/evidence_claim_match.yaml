            term:
              id: MONDO:0020491
              label: subcortical band heterotopia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EML1 Loss of Function and Microtubule Dysregulation
        description: Biallelic loss-of-function variants in EML1 abolish full-length EMAP-1, a microtubule-associated
          protein expressed in cortical apical radial glia. In the spontaneous HeCo mouse, a retrotransposon
          insertion eliminates full-length Eml1 transcripts, and knockdown reproduces the progenitor phenotype
          while re-expression rescues it, establishing EML1 loss as the initiating molecular lesion. EML1
          loss perturbs microtubule dynamics in progenitor cells, the proximal cytoskeletal defect from
          which the centrosome, cilium and spindle abnormalities follow.
        cell_types:
        - preferred_term: apical radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        biological_processes:
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: DYSREGULATED
      selected_evidence:
        snippet: We identified Eml1, encoding a microtubule-associated protein, as the gene mutated in
          HeCo mice
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24859200
      reference_title: Mutations in Eml1 lead to ectopic progenitors and neuronal heterotopia in mouse
