          emerge in a substantial fraction of aromatase-inhibitor-pretreated metastatic tumors, conferring
          acquired resistance to estrogen deprivation. This node is the rationale for oral SERDs (elacestrant)
          active against ESR1-mutant disease.
        biological_processes:
        - preferred_term: constitutive ligand-independent estrogen receptor signaling
          modifier: INCREASED
          term:
            id: GO:0030520
            label: estrogen receptor signaling pathway
      selected_evidence:
