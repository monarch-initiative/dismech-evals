        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PI3K-AKT-mTOR Pathway Activation
        conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation
        description: Activating PIK3CA hotspot mutations (E542K, E545K, H1047R; ~40% of HR+ tumors), AKT1
          E17K mutation, and PTEN loss drive constitutive PI3K-AKT-mTOR signaling. This pathway cross-talks
          with and can bypass ER signaling, sustaining proliferation and survival and contributing to
          endocrine resistance. It is the therapeutic target of alpelisib (PI3Kalpha), capivasertib (AKT),
          and everolimus (mTOR). This is the constitutive-mitogenic-pathway-activation node of the sustaining-proliferative-signaling
          hallmark, substituting the PIK3CA/AKT1/PTEN lesion for the module's generic RTK/RAS/PI3K driver.
        biological_processes:
        - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          modifier: INCREASED
