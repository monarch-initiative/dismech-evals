  6e4fb20a9626c5cf683dceee6bac8920c62f29b671a54189f4a32b03e4aceeb1:
    claim:
      about:
        disease:
          name: ETV6-Related Thrombocytopenia
          disease_term:
            preferred_term: ETV6-related thrombocytopenia (THC5)
            term:
              id: MONDO:0014536
              label: thrombocytopenia 5
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Cytoplasmic Retention of ETV6
        biological_scale: MOLECULAR
        description: Germline ETV6 missense and truncating variants yield stable mutant protein that is
          retained in the cytoplasm instead of the nucleus. Because ETV6 acts as a pointed-domain homodimer,
          mutant protein dimerises with and also retains wild-type ETV6 in the cytoplasm, a dominant-negative
          effect. For the recurrent central-domain variant p.Pro214Leu the mechanism is the de novo creation
          of an XPO1-dependent nuclear export signal; for ETS-domain variants nuclear import or retention
          is impaired by a mechanism that is less well defined.
        genes:
        - preferred_term: ETV6
          term:
            id: hgnc:3495
            label: ETV6
        molecular_functions:
        - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
          term:
            id: GO:0001227
            label: DNA-binding transcription repressor activity, RNA polymerase II-specific
          modifier: DECREASED
        biological_processes:
        - preferred_term: XPO1-dependent nuclear export of ETV6 p.Pro214Leu
          term:
            id: GO:0006611
            label: protein export from nucleus
          modifier: INCREASED
      selected_evidence:
        snippet: These results indicate that the mutant forms of ETV6 mislocalize inside cells, and by
          dimerizing with endogenous WT protein, may also prevent nuclear localization, further compromising
          ETV6 repression activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
