            label: Genetic Testing
        description: Diagnosis rests on finding a heterozygous germline pathogenic ETV6 variant, usually
          on an inherited platelet disorder or leukaemia predisposition gene panel. ETV6 should be tested
          together with RUNX1 and ANKRD26 in any autosomal dominant thrombocytopenia with normal platelet
          size, because routine laboratory findings do not distinguish the disorder. Rare ETV6 variants,
          especially outside the ETS and central domains, need functional or segregation evidence, since
          some behave like wild type in localisation and reporter assays.
        results: A heterozygous germline pathogenic ETV6 variant establishes the diagnosis.
      selected_evidence:
        snippet: The diagnosis of ETV6-related thrombocytopenia and predisposition to leukemia is established
          in a proband by identification of a heterozygous germline pathogenic variant in ETV6 by molecular
          genetic testing.
