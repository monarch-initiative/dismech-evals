      assertion:
        name: RUNX1 familial platelet disorder with associated myeloid malignancy
        disease_term:
          preferred_term: RUNX1 familial platelet disorder with associated myeloid malignancy
          term:
            id: MONDO:0100083
            label: hereditary thrombocytopenia and hematological cancer predisposition syndrome associated
              with RUNX1
        description: Autosomal dominant thrombocytopenia with normal platelet size and malignancy predisposition,
          resolved by molecular testing.
        distinguishing_features:
        - A germline RUNX1 variant rather than an ETV6 variant.
        - Malignancies are predominantly myeloid, whereas B-ALL predominates in ETV6 carriers.
        - RUNX1-mutant iPSC-derived megakaryocytes are fewer and more agonist-responsive, the opposite
          of ETV6-mutant ones.
      selected_evidence:
        snippet: Since the dominant thrombocytopenias due to mutations in RUNX1 and ANKRD26 are also characterized
          by normal platelet size and predispose to hematologic malignancies, we suggest that screening
          for ETV6, RUNX1 and ANKRD26 mutations should be performed in all subjects with autosomal dominant
          thrombocytopenia and normal platelet size.
        supports: SUPPORT
