        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Germline variants are mostly missense changes in the ETS DNA-binding domain (for example
          p.Arg369Gln, p.Arg399Cys, p.Arg418Gly, p.Leu349Pro, p.Ala377Thr, p.Tyr401Asn) or the central
          linker domain (recurrent p.Pro214Leu), with occasional nonsense and frameshift alleles such
          as p.Asn385fs. Rare ETV6 variants outside these domains have behaved like wild type in reporter
          assays, so pathogenicity needs functional or segregation support. In leukaemic cells the germline
          allele is often accompanied by somatic loss of the wild-type ETV6 allele and cooperating lesions.
        gene_disease_validity:
