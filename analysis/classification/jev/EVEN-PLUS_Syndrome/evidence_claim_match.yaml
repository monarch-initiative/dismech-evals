  05670646d66b95cb872feea46836e3e59ec28b6485e42c3517a54a710421ee15:
    claim:
      about:
        disease:
          name: EVEN-PLUS Syndrome
          disease_term:
            preferred_term: even-plus syndrome
            term:
              id: MONDO:0014801
              label: even-plus syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic HSPA9 Variants
        biological_scale: MOLECULAR
        description: 'Thirteen variants across the published cohort. The missense alleles cluster on the
          nucleotide-binding domain surface (p.R126W, p.Y128C, p.L319F), with a recurrent frameshift (c.882_883delAG,
          p.V296*) and a nonsense allele (p.L273X). Those truncating alleles remove more than half the
          protein including the entire substrate-binding domain and are subject to nonsense-mediated decay,
          so a truncating allele in trans with a missense allele is the commonest configuration. The missense
          residues sit away from the ATP site but adjacent to the predicted interface between the nucleotide-binding
          and substrate-binding domains, which is the allosteric coupling that makes an Hsp70 work.

          The nucleotide-binding-domain framing is not the whole spectrum. Splice variants at c.1822-1G>A
          and c.1411-3T>G act on the substrate-binding domain instead, abolishing part of it, which is
          a second and distinct way to reach a hypomorphic chaperone.

          '
        genes:
        - preferred_term: HSPA9
          term:
            id: hgnc:5244
            label: HSPA9
          modifier: DECREASED
        genetic_context:
          description: 'Germline biallelic hypomorphic HSPA9 alleles: homozygous missense in the consanguineous
            family, compound heterozygous missense plus truncating in the others.'
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Patient 1 was found to be heterozygous for variants c.383A > G (p.Y128C) and c.882_883delAG
          (p.V296*). Patients 2 and 3 were found to be homozygous for variant c.376C > T (p.R126W).
        supports: SUPPORT
    origin:
