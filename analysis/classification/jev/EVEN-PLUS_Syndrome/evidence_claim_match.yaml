      assertion_type: Treatment
      assertion:
        name: Reproductive genetic counseling with prenatal or preimplantation testing
        description: 'The only intervention in this entry with a reported outcome rather than an inferred
          one, and it is preventive rather than therapeutic. In one Chinese family the biallelic genotype
          was identified in two affected fetuses, mutation-free embryos were selected, and a healthy daughter
          was born. For a recessive condition with no disease-modifying treatment and a recurrence risk
          of one in four, this is what "management" currently means for a family after a first affected
          child.

          '
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Mutation-free embryos were selected for transplantation and reconfirmed to possess no
          mutations. A healthy daughter was successfully born into the family.
        supports: SUPPORT
