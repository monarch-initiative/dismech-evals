      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing
        description: 'The diagnosis is molecular. Every published case was made by exome sequencing, in
          several instances after a clinical diagnosis of CODAS syndrome had been made and LONP1 testing
          returned negative. A skeletal survey showing coronal vertebral clefts with severe proximal femoral
          epiphyseal dysplasia, in a child with bilateral microtia and a flat nose, is the phenotype that
          should prompt HSPA9 testing.

          '
      selected_evidence:
        snippet: We report here the fifth case of EVEN-PLUS syndrome with novel variants c.818 T > G (p.L273X)
          and c.955C > T (p.L319F) in the HSPA9 gene identified through whole-exome sequencing.
        supports: SUPPORT
