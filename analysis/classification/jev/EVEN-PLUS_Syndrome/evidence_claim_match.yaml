  ab4091546ac6dce06522914feb1fcab33c2309e8870144dae4b72253224dd73c:
    claim:
      about:
        disease:
          name: EVEN-PLUS Syndrome
          disease_term:
            preferred_term: even-plus syndrome
            term:
              id: MONDO:0014801
              label: even-plus syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hspa9_chaperone_to_morphogenesis_gap
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Disturbed Embryonic Morphogenesis
        prompt: By what molecular route does partial loss of the mitochondrial matrix Hsp70 produce a
          patterning phenotype - microtia, nasal hypoplasia, anal atresia, sacral agenesis - rather than
          the bioenergetic failure seen in classical mitochondrial disease?
        rationale: 'This is the load-bearing gap in the entry. Causal genetics are settled and replicated
          across four independent reports, and the clinical phenotype is consistent; what is missing is
          any demonstrated intermediate between chaperone deficiency and dysmorphogenesis. The primary
          report says so in as many words, and no subsequent paper has closed it. Curating the edge from
          chaperone failure to morphogenesis without recording this gap would misrepresent an assumed
          step as an established one.

          There are candidate routes in the literature that this entry deliberately does not curate as
          mechanism, because nothing tests them in this disease: an effect on iron-sulfur cluster biogenesis,
          in which mortalin is the matrix Hsp70 partner; and reported interactions of HSPA9 with FGF1
          and with SMAD2, which would place it on signalling pathways with obvious developmental relevance.
          They belong in an experiment, not in a pathophysiology node.

          '
        proposed_experiments:
        - experiment_id: hspa9_lineage_conditional_hypomorph
          name: Conditional Hspa9 hypomorph in neural crest and limb-bud mesenchyme
          description: Introduce the recurrent human missense alleles (p.R126W, p.Y128C) as knock-in hypomorphs
            and delete Hspa9 conditionally in cranial neural crest and in limb-bud/sclerotome mesenchyme,
            then ask whether the craniofacial and skeletal phenotypes segregate with lineage rather than
            with tissue energy demand.
          would_support:
          - pathophysiology#Disturbed Embryonic Morphogenesis
          supporting_outcome:
          - Lineage-restricted loss reproduces microtia, nasal hypoplasia and epiphyseal dysplasia with
            normal respiratory-chain assembly and normal lactate, dissociating the malformation phenotype
            from bioenergetic failure.
          would_refute:
          - pathophysiology#Disturbed Embryonic Morphogenesis
          refuting_outcome:
          - The malformations appear only where oxidative-phosphorylation capacity is measurably reduced,
            and correlate with respiratory-chain deficiency rather than with lineage, which would make
            this an energy-failure disease after all.
      selected_evidence:
        snippet: the pathogenesis of the developmental defects associated with LONP1 and HSPA9 mutations
          remain unexplained
        supports: SUPPORT
