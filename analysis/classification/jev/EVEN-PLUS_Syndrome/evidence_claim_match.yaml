      assertion:
        target: Disturbed Embryonic Morphogenesis
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Neither available dosage models the disease. Complete loss kills the embryo before
          a malformation phenotype can be assessed, and half dosage produces viable mice in which nothing
          resembling EVEN-PLUS is described. Between them they bracket the human condition without reaching
          it, which is a structural reason no mouse model of this syndrome exists.
        limitations: A null allele on both counts, whereas every human genotype retains partial mortalin
          function. The study was designed around haematopoiesis in del(5q) myelodysplastic syndrome and
          did not phenotype the skeleton or craniofacial structures, so the absence of a skeletal phenotype
          in heterozygotes is an absence of reporting as well as, probably, an absence of phenotype. A
          knock-in of the human hypomorphic alleles is the experiment this model cannot substitute for.
      selected_evidence:
        snippet: Although homozygous knockout of Hspa9 is embryonically lethal, mice with heterozygous
          deletion of Hspa9 (Hspa9(+/-)) are viable and have a 50% reduction in Hspa9 expression.
        supports: SUPPORT
