            term:
              id: MONDO:0014801
              label: even-plus syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: HSPA9
        notes: 'The sole gene reported for this disorder. It encodes mortalin / mtHSP70 / GRP75, the matrix
          Hsp70 that drives presequence import through TIM23 and is required for LONP1 protease activity.
          Reported EVEN-PLUS alleles are hypomorphic rather than null; the recurrent c.882_883delAG (p.V296*)
          has been seen in patients of both Korean and Chinese ancestry, which raises the question of
          an East Asian founder effect.

          '
        gene_term:
          preferred_term: HSPA9
          term:
            id: hgnc:5244
            label: HSPA9
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: This finding expands the spectra of EVEN-plus syndrome phenotype and pathogenic variants
          and suggests that c.882_c.883delAG may have a higher distribution frequency in East Asian populations.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
