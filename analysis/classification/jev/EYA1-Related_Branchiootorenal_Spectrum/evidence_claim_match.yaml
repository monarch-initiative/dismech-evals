              label: branchiootic syndrome 1
        context:
        - path: /animal_models/1
          value:
            name: Xenopus BOS/BOR Six1 substitution embryos
            species: Xenopus laevis
            genotype: Embryos expressing Six1 carrying the human BOS/BOR substitutions V17E, R110W, W122R
              or Y129C in the protein-protein interaction domain or homeodomain
            publication: PMID:31980437
            description: Frog Six1 is identical to human SIX1 across both domains in which BOS/BOR substitutions
              fall, so expressing the patient substitutions in embryos reports on the human protein rather
              than an orthologue. The four mutants are all nuclear but transcriptionally deficient, and
              each produces its own pattern of disruption in neural border, neural crest and pre-placodal
              gene domains and in otic vesicle patterning, ending in a smaller but structurally complete
              inner ear. The model addresses the SIX1 side of the EYA1-SIX1 partnership; it does not model
              EYA1 haploinsufficiency, which is the more common cause of this spectrum.
            genes:
            - preferred_term: SIX1
              term:
                id: hgnc:10887
                label: SIX1
            alleles:
            - V17E
            - R110W
            - W122R
            - Y129C
          role: ancestor
        - path: /animal_models/1/modeled_mechanisms/1
          value:
            target: Otic Placode and Inner Ear Developmental Arrest
            relationship: PARTIALLY_RECAPITULATES
            fidelity: MODERATE
            description: Mutant Six1 perturbs pre-placodal and otic vesicle patterning genes and yields
              a reduced otic capsule, otoliths, lumen and sensory patches — a hypoplastic rather than
              arrested inner ear.
            limitations: Auditory and vestibular structures still form, so this is inner ear hypoplasia
              rather than the developmental arrest the node names; the phenotypes are also highly variable
              between and within mutants, which mirrors the clinical variability but limits how firmly
              any single substitution can be tied to an outcome.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Neural border, neural crest and pre-placodal gene domain size
        target: Otic Placode and Inner Ear Developmental Arrest
        direction: ALTERED
        interpretation: Locates the earliest detectable effect at the ectodermal patterning step that
          precedes otic placode formation.
      selected_evidence:
        snippet: Analysis of craniofacial gene expression showed that each mutant causes specific, often
          different and highly variable disruptions in the size of the domains of neural border zone,
          neural crest and pre-placodal ectoderm genes.
        supports: SUPPORT
