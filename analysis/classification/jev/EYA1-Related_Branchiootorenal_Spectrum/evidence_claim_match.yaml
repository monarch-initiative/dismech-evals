  a61c417eee864b37e204a4eb0c4f97811f847f52582ebdb600905978ec0f07be:
    claim:
      about:
        disease:
          name: EYA1-Related Branchiootorenal Spectrum Disorder
          disease_term:
            preferred_term: EYA1-related branchiootorenal spectrum disorder
            term:
              id: MONDO:0011258
              label: branchiootic syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of EYA1-SIX1 Transcriptional Coactivation
        biological_scale: MOLECULAR
        role: central_effector
        description: EYA1 is a transcriptional coactivator that cannot bind DNA itself; it is recruited
          to target promoters by the SIX1 homeodomain transcription factor. EYA proteins additionally
          carry an intrinsic protein tyrosine phosphatase activity, and it is that enzymatic activity
          which switches the SIX1-DACH complex from repression to activation. Reduced EYA1 dosage therefore
          withdraws activation from the SIX1-dependent gene programme that controls precursor cell proliferation
          and survival across several organ primordia, which is why one gene defect produces a multi-organ
          malformation bundle.
        molecular_functions:
        - preferred_term: EYA1 transcriptional coactivator function
          term:
            id: GO:0003713
            label: transcription coactivator activity
          modifier: DECREASED
        - preferred_term: EYA1 protein tyrosine phosphatase activity
          term:
            id: GO:0004725
            label: protein tyrosine phosphatase activity
          modifier: DECREASED
        notes: 'ALLELIC DISTINCTION WORTH PRESERVING. EYA1 mutations causing ocular defects (anterior
          segment anomalies with or without cataract) retain near-normal phosphatase activity, whereas
          the BOR/BOS-associated mutations lose it (PMID:16797546). The two EYA1 phenotypes are therefore
          mechanistically distinct at this node, not a severity continuum. This matters practically: the
          ocular disease name is an easily confused EYA1 label, and a literature search keyed on it will
          return eye-disease papers that have nothing to do with this entry.'
      selected_evidence:
        snippet: The phosphatase function of Eya switches the function of Six1-Dach from repression to
          activation, causing transcriptional activation through recruitment of co-activators.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:14628042
      reference_title: Eya protein phosphatase activity regulates Six1-Dach-Eya transcriptional effects
        in mammalian organogenesis.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the phosphatase-dependent repression-to-activation switch that is the molecular
        function lost in haploinsufficiency.
