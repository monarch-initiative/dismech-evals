        description: 'Failure of normal development and obliteration of the second pharyngeal (branchial)
          cleft and pouch, leaving epithelium-lined remnants that present as lateral cervical fistulae,
          sinuses or cysts, and disturbed development of the arch-derived external ear, producing preauricular
          pits and tags. The second-arch defect dominates and gives the disorder its name, but the EYA1-dependent
          programme is not confined to that arch: the auricle forms from first- and second-arch hillocks
          and the external auditory canal from the first pharyngeal cleft, so external-ear canal anomalies
          belong to this node even though they are not strictly second-arch derivatives. The node is named
          for the predominant lesion rather than the full anatomical extent.'
        biological_processes:
