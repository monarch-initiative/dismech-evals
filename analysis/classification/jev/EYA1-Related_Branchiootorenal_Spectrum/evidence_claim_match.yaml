              label: branchiootic syndrome 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical diagnostic criteria for branchiootorenal spectrum disorder
        description: A major/minor criteria scheme. The clinical diagnosis is established by three or
          more major criteria, or two major plus two minor criteria, or one major criterion together with
          a first-degree relative meeting criteria. Molecular confirmation rests on a heterozygous pathogenic
          variant in EYA1 (this entry) or SIX1. Note that the criteria do not require renal involvement,
          so a single criteria set diagnoses both the BOR1 and BOS1 presentations.
        notes: GENETIC TESTING STRATEGY. A negative exome does not exclude EYA1 disease. About 20% of
          EYA1 mutations are complex genomic rearrangements invisible to coding-sequence analysis (PMID:15146463),
          so testing should pair sequencing with a dosage-sensitive assay; whole-genome sequencing additionally
          resolves balanced structural variants such as inversions, which neither sequencing nor MLPA
          detects (PMID:38766525 reports an EYA1 inversion-with-deletion found only by WGS after both
          exome and MLPA were negative). A stepwise sequencing → CNV/MLPA → WGS series reported in the
          deep-research artifact quantifies the incremental yield, but it is cited there only by DOI,
          and `DOI:` is in `skip_prefixes` so a snippet from it could not be snippet-validated; it is
          therefore summarized here rather than curated as an evidence item.
      selected_evidence:
        snippet: The clinical diagnosis of BORSD is established in an individual based on the presence
          of three or more major criteria OR two major criteria and two minor criteria OR one major criterion
          and a first-degree relative with BORSD.
        supports: SUPPORT
    origin:
