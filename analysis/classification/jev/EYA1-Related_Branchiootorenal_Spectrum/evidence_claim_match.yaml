        snippet: In some instances, patients exhibit symptoms similar to those of BOR, with the exception
          of renal anomalies; they are diagnosed with branchio-oto syndrome-1 (BOS1; OMIM#602588) or branchio-oto
          syndrome-3 (BOS3; OMIM#608389).
        supports: SUPPORT
