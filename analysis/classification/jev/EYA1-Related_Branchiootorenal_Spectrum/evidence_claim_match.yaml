        role: central_effector
        description: 'Reduction of functional EYA1 protein below the dosage threshold required for normal
          development. Dosage sensitivity is the operative mechanism: an allelic series in mouse showed
          that roughly 20% of normal Eya1 protein suffices to establish the metanephric blastema and induce
          ureteric bud formation, but not to support its normal branching — so different EYA1-dependent
          developmental steps have different dosage thresholds. This graded-threshold behaviour is a mechanistically
          plausible substrate for the variable expressivity seen clinically, though it has not been shown
          to be its cause in humans.'
