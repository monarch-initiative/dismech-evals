              label: branchiootic syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Metanephric Mesenchyme Specification Failure
        biological_scale: TISSUE
        description: EYA1 specifies the metanephric blastema within the intermediate mesoderm and functions
          at the top of the genetic hierarchy controlling kidney organogenesis, acting with SIX1 and PAX2
          to drive Gdnf expression. Gdnf directs ureteric bud outgrowth via c-Ret; in the Eya1 null it
          is not detected in metanephric mesenchyme and the ureteric bud never forms. In humans the partial
          (heterozygous) equivalent produces the CAKUT spectrum rather than bilateral agenesis. This branch
          is variably penetrant, and its presence or absence is what the BOR1/BOS1 clinical labels record.
        biological_processes:
        - preferred_term: metanephros development
          term:
            id: GO:0001656
            label: metanephros development
          modifier: ABNORMAL
        - preferred_term: ureteric bud development
          term:
            id: GO:0001657
            label: ureteric bud development
          modifier: DECREASED
        locations:
        - preferred_term: metanephric mesenchyme
          term:
            id: UBERON:0003220
            label: metanephric mesenchyme
        cell_types:
        - preferred_term: metanephric mesenchyme stem cell
          term:
            id: CL:0000324
            label: metanephric mesenchyme stem cell
      selected_evidence:
        snippet: Gdnf expression, which is required to direct ureteric bud outgrowth via activation of
          the c-ret Rtk (refs 5, 6, 7, 8), is not detected in Eya1-/- metanephric mesenchyme.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
