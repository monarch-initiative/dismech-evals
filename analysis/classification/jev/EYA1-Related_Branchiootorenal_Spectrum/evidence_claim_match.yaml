          ureteropelvic junction obstruction, calyceal cysts or diverticula and vesicoureteral reflux.
          Reported in roughly 38% of affected individuals; its presence is what defines the BOR1 rather
          than BOS1 label.
        notes: FREQUENCY CAVEAT. The 38.2% figure derives from clinically ascertained BOR/BOS cohorts
