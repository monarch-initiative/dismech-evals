        biological_scale: TISSUE
        description: EYA1 is expressed from the emergence of the otic placode and is required for development
          of all components of the inner ear. In the mouse null, inner ear development arrests at the
          otic vesicle stage and all inner ear components and specific cranial sensory ganglia fail to
          form; heterozygotes show conductive hearing loss resembling the human disorder. In humans the
          corresponding lesion is a graded malformation — cochlear hypoplasia, dysplastic semicircular
          canals, dilated internal auditory canal, enlarged vestibular aqueduct, and a deformed ossicular
          chain — rather than a complete developmental arrest.
        biological_processes:
        - preferred_term: otic placode development
