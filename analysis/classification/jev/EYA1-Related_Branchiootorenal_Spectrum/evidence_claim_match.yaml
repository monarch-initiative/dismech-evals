      assertion:
        name: SIX1
        gene_term:
          preferred_term: SIX1
          term:
            id: hgnc:10887
            label: SIX1
        relationship_type: COOPERATING
        variant_origin: GERMLINE
        notes: SIX1 is recorded as pathway context, not as a causal gene for this entry. It is the obligate
          DNA-binding partner through which EYA1 acts, so the EYA1-SIX1 complex rather than EYA1 alone
          is the functional unit disrupted here. SIX1 variants independently cause the mechanistically
          convergent branchiootic syndrome 3 and branchiootorenal syndrome 2 by disrupting that same complex;
          those are curated separately because the causal lesion differs (loss of protein-protein and
          protein-DNA interaction rather than EYA1 dosage loss), MONDO codes them separately (MONDO:0012025),
          and the stub queue carries Branchiootic_Syndrome_3 as its own item. See `notes` for the split
          rationale.
      selected_evidence:
        snippet: By direct sequencing of exons, we identified three different SIX1 mutations in four BOR/BO
          kindreds, thus identifying SIX1 as a gene causing BOR and BO syndromes.
        supports: SUPPORT
