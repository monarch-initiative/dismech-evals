      assertion:
        target: Failure of EYA1-SIX1 Transcriptional Coactivation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Establishes that the patient substitutions leave Six1 nuclear but unable to activate
          transcription, which is the functional failure this node asserts, approached from the SIX1 rather
          than the EYA1 side.
        limitations: SIX1 substitutions account for roughly 4% of BOS/BOR, so this models a minority genotype
          within an entry anchored on EYA1; the readout is transcriptional deficiency of injected mutant
