              label: branchiootic syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EYA1 Loss-of-Function Variant
        biological_scale: MOLECULAR
        role: trigger
        description: A heterozygous pathogenic EYA1 variant — nonsense, frameshift, splice-site, missense,
          or a whole- or partial-gene deletion arising from complex genomic rearrangement. Missense variants
          cluster in the highly conserved C-terminal 271-amino-acid Eya homologous region (eyaHR), the
          domain that mediates SIX1 binding and carries the phosphatase activity, which is why coding-sequence
          analysis alone misses a substantial minority of cases.
        genetic_context:
          gene:
            preferred_term: EYA1
            term:
              id: hgnc:3519
              label: EYA1
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous germline loss-of-function alleles. Point mutations and copy-number
            losses both occur, and both act by reducing functional EYA1 dosage rather than by producing
            a toxic product.
      selected_evidence:
        snippet: To date, 14 mutations have been detected in BOR patients, all of which are different.
          However, all the mutations are located within or in the immediate vicinity of the eyaHR
        supports: SUPPORT
    origin:
