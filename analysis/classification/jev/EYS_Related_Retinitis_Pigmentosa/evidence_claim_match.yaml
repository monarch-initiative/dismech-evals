      assertion:
        name: Ciliary Structural Disruption
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        description: EYS localizes near the connecting cilium/transition zone of photoreceptors and to
          the ciliary axoneme, shown by immunostaining in zebrafish and primate retina and in ciliated
          human Y79 photoreceptor-like cells. The connecting cilium is the narrow bridge linking the photoreceptor
          inner segment (biosynthetic compartment) to the outer segment (disc-containing phototransduction
          compartment); it is functionally equivalent to the transition zone of primary cilia. In zebrafish,
          loss of EYS disrupts the ciliary pocket of cone photoreceptors and mislocalizes outer segment
          proteins, indicating a requirement for EYS in maintaining this compartment and in delivering
          outer segment components; the corresponding localization and transport claims for human photoreceptors
          are inferred from these non-human vertebrate and cell-line data rather than directly demonstrated.
          On this basis EYS is treated as a photoreceptor-restricted ciliopathy gene. In Drosophila, the
          ortholog spam/eyes shut maintains the physical separation between rhabdomeric photoreceptors
          in the open rhabdom; without it, photoreceptors collapse together.
        cellular_components:
        - preferred_term: connecting cilium
          term:
            id: GO:0035869
            label: ciliary transition zone
