      assertion_type: Genetic
      assertion:
        name: EYS Biallelic Variants
        association: Causative
        gene_term:
          preferred_term: EYS
          term:
            id: hgnc:21555
            label: EYS
        features: Biallelic loss-of-function variants in EYS (eyes shut homolog), encoding an approximately
          3,145–3,165 amino acid extracellular protein with EGF-like and LamG domains. The gene spans
          over 2 Mb of genomic DNA at chromosome 6q12 and is the largest gene expressed in the human eye.
          Variant classes include nonsense mutations, frameshift deletions, splice-site variants, and
          large intragenic copy-number deletions. The six variants described in the original report all
          created premature stop codons, predicted to undergo nonsense-mediated mRNA decay and produce
          absence of functional protein; subsequent cohort screening also identified missense, silent
          and splice-site changes, so truncation is the best-characterized but not the only reported class
          of EYS sequence variant.
        case_fractions:
        - population: French cohort of 239 sporadic and autosomal recessive RP cases
          case_fraction_percent: 12.0
          cohort_size: 239
          notes: Minimum estimate reported by the authors ("12% or more") for the share of this cohort
            explained by EYS.
        - population: Japanese cohort of 100 autosomal recessive RP patients
          case_fraction_percent: 18.0
          cohort_size: 100
          notes: Minimum observed prevalence of distinct EYS mutations; 9 of the 18 patients carried two
            very likely pathogenic mutations and 9 carried only one.
      selected_evidence:
        snippet: a 10-kb transcript, starting with the annotated exons of EGFL11 and spanning 44 exons
          and 2 Mb of genomic DNA. The transcript is predicted to encode a 3165-aa extracellular protein
          containing 28 EGF-like and five laminin A G-like domains.
        supports: SUPPORT
