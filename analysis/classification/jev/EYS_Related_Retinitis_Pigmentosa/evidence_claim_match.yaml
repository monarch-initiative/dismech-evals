      assertion_type: Treatment
      assertion:
        name: Gene Augmentation Therapy (EYS, Investigational)
        description: Adeno-associated virus (AAV)-mediated delivery of wild-type EYS cDNA to photoreceptors
          is the obvious disease-modifying strategy for EYS-RP, but it faces two constraints documented
          here rather than a cited clinical program. The EYS coding region is approximately 9 kb, well
          beyond the packaging capacity of a standard AAV vector, so any augmentation approach would need
          a dual-vector or large-capacity system; and rodents lack an intact EYS gene, so the conventional
          mouse-knockout preclinical route is unavailable. No approved gene therapy for EYS-RP exists,
          and no specific investigational program is cited in this entry.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
