      assertion:
        name: Rod Photoreceptor Apoptosis
        conforms_to: photoreceptor_degeneration#Rod Photoreceptor Apoptosis
        description: Structural disruption of the photoreceptor outer segment and connecting cilium resulting
          from EYS deficiency produces progressive rod photoreceptor death via apoptosis, the final common
          pathway of rod-cone dystrophies. Rods are the primary affected cell type because EYS is expressed
          in both rod and cone photoreceptors but the initial rod-predominant degeneration produces the
          characteristic nyctalopia and peripheral field loss of retinitis pigmentosa. Secondary cone
          degeneration follows as rods are lost, converting night blindness to broader visual field loss
          and ultimately severe central visual impairment.
        cell_types:
        - preferred_term: rod photoreceptor cell
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: Retinitis pigmentosa (RP) is an inherited retinal dystrophy leading to progressive loss
          of the photoreceptors and retinal pigment epithelium and resulting in blindness usually after
          several decades.
        supports: SUPPORT
