        description: Zebrafish retain a functional eys gene, unlike mouse and rat in which it is disrupted,
          and are the vertebrate system in which EYS loss of function has been studied in vivo. A TALEN-generated
          EYS-knockout line shows early visual impairment and progressive, cone-predominant retinal degeneration
          with mislocalization of outer segment proteins; engineered mutant alleles disrupt the ciliary
          pocket of cone photoreceptors and cause progressive loss of both cones and rods. No gene-therapy
          efficacy study in this model is cited in this entry.
