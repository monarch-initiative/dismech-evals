              label: retinitis pigmentosa 25
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Secondary Cone Degeneration
        description: Progressive loss of rod photoreceptors leads to non-cell-autonomous secondary cone
          degeneration. Rods provide trophic support to cones and maintain normal outer retinal oxygen
          tension; as rods are lost, elevated oxygen levels in the outer retina and loss of rod-derived
          survival factors drive cone photoreceptor death. This converts the initial rod-dominant disease
          (nyctalopia, peripheral field loss) to central vision impairment and legal blindness.
        cell_types:
        - preferred_term: cone photoreceptor cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: Retinitis pigmentosa (RP) is an inherited retinal dystrophy leading to progressive loss
          of the photoreceptors and retinal pigment epithelium and resulting in blindness usually after
          several decades.
        supports: SUPPORT
