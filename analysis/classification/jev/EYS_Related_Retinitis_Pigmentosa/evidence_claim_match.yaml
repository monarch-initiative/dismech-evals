              label: retinitis pigmentosa 25
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EYS Protein Deficiency
        description: Biallelic EYS variants lead to loss of the EYS protein, an extracellular spacer/structural
          protein in the photoreceptor outer segment zone. EYS is the human ortholog of Drosophila spacemaker
          (spam/eyes shut), a protein that maintains the open rhabdom architecture between photoreceptors
          in insect eyes; in the vertebrate retinas examined to date (zebrafish and primate), EYS localizes
          near the connecting cilium/transition zone and the photoreceptor ciliary axoneme, where it is
          believed to help maintain the structural integrity of the ciliary compartment and outer segment.
          The protein contains at least 21 EGF-like domains and five C-terminal laminin G (LamG) domains.
          Unlike most RP genes, EYS encodes an extracellular/secreted protein rather than an intracellular
          component of the phototransduction cascade. Loss of EYS disrupts photoreceptor outer segment
          morphology, likely through a structural scaffolding role at the ciliary interface.
        gene:
          preferred_term: EYS
          modifier: ABSENT
          term:
            id: hgnc:21555
            label: EYS
        cell_types:
        - preferred_term: rod photoreceptor cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: cone photoreceptor cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: photoreceptor cell maintenance
          term:
            id: GO:0045494
            label: photoreceptor cell maintenance
          modifier: DECREASED
        - preferred_term: cilium assembly
          term:
            id: GO:0060271
            label: cilium assembly
          modifier: DECREASED
      selected_evidence:
        snippet: RP25 is predicted to be a multidomain protein containing 3,145 amino acids with at least
          21 epidermal growth factor (EGF)-like domains in its N-terminus followed by five C-terminal
          LamG domains, interspersed by further EGF repeats
        supports: SUPPORT
    origin:
