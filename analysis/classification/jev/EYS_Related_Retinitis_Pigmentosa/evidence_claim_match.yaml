          Given the large size of EYS (2 Mb, 43–44 exons), copy-number variant analysis (MLPA or array
          CGH) must supplement sequencing because large intragenic deletions are common. Molecular diagnosis
          confirms RP25, enables cascade family testing, and is required for gene therapy trial eligibility.
        diagnosis_term:
          preferred_term: genetic testing
