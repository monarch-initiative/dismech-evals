      assertion:
        name: Increased Persistent Sodium Current
        biological_scale: MOLECULAR
        role: mechanism
        description: Gain-of-function variants in the sodium-channel alpha subunits SCN2A, SCN8A, SCN3A
          and rarely SCN1A slow fast inactivation, accelerate its recovery, or increase persistent inward
          sodium current, raising intrinsic neuronal excitability. This is the arm of the EIDEE channelopathy
          spectrum that responds to sodium-channel-blocker therapy, and it is why the functional direction
          of a sodium-channel variant - not the gene name - determines the prescription.
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        cell_types:
        - preferred_term: Neuron
          term:
