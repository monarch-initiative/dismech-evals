  5e066a88116be65ee37bc0d371fee08d51d7417cc5dbb74d5960a3c24129ec14:
    claim:
      about:
        disease:
          name: Early-Infantile Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: early-infantile DEE
            term:
              id: MONDO:0800491
              label: early-infantile DEE
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Developmental and Epileptic Encephalopathy
        biological_scale: ORGANISM
        role: outcome
        description: 'The clinical endpoint is a two-component encephalopathy. A developmental encephalopathy
          arises directly from the etiology and impairs development independently of any seizure; an epileptic
          encephalopathy is superimposed when the epileptiform activity itself further degrades cognition
          and behaviour beyond what the underlying pathology alone would produce. The distinguishing feature
          of EIDEE specifically is that these two components cannot be separated: onset at or before three
          months means the etiology and the epileptiform activity act on the same window of development.
          This is the mechanistic reason EIDEE is defined as a developmental AND epileptic encephalopathy
          rather than a pure epileptic encephalopathy, and the reason seizure control alone does not restore
          development.

          Module note: this node declares no conforms_to. The epilepsy_excitation_inhibition_imbalance
          module terminates at recurrent unprovoked seizures (conformed above by Recurrent Drug-Resistant
          Seizures); the two-component developmental-plus-epileptic encephalopathy is EIDEE-specific content
          that lies beyond the module''s chain. The module''s "Seizure Generation and Epileptogenesis"
          node is likewise not separately instantiated: in EIDEE the epileptogenesis step is not clinically
          separable from the burst-suppression effector that precedes it, so splitting it out would create
          a node with no independent evidence.'
        biological_processes:
        - preferred_term: Nervous System Development
          term:
            id: GO:0007399
            label: nervous system development
          modifier: ABNORMAL
      selected_evidence:
        snippet: developmental impairment and an EE, such as EIDEE, including Ohtahara syndrome and Early
          Myoclonic Encephalopathy
        supports: SUPPORT
    origin:
