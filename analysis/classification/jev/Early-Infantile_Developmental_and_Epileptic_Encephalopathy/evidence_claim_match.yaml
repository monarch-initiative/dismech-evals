  8fcae8e03fa548fc293ba751a8fe47ecea7e5f1f1419d2b5a838df4c0553fd14:
    claim:
      about:
        disease:
          name: Early-Infantile Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: early-infantile DEE
            term:
              id: MONDO:0800491
              label: early-infantile DEE
        context: []
      assertion_type: Definition
      assertion:
        name: ILAE 2022 Syndrome Definition of EIDEE
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: The ILAE Task Force on Nosology and Definitions defines EIDEE as an epilepsy syndrome
          with seizure onset at or before 3 months of age, frequent drug-resistant seizures of multiple
          types (tonic, clonic, myoclonic, focal, epileptic spasms), an abnormal interictal EEG (burst-suppression,
          multifocal epileptiform discharges or hypsarrhythmia), an abnormal neurological examination,
          and developmental impairment. The syndrome subsumes the previously separate Ohtahara syndrome
          and early myoclonic encephalopathy. The 2022 position statement publishes per-syndrome tables
          of mandatory features, cautionary alerts and exclusionary features, and provides guidance for
          syndrome diagnosis in resource-limited settings where EEG, MRI and genetic testing may be unavailable.
        scope: Syndrome-level diagnostic criteria applied to neonates and infants with seizure onset in
          the first three months of life.
        inclusion_criteria:
        - preferred_term: Seizure onset at or before 3 months of age
          description: The mandatory age-at-onset criterion that defines the syndrome.
        - preferred_term: Frequent, typically drug-resistant seizures
          description: Multiple seizure types may occur - tonic, clonic, myoclonic, focal and epileptic
            spasms.
        - preferred_term: Abnormal interictal EEG
          description: Burst-suppression, multifocal epileptiform discharges, or hypsarrhythmia.
          term:
            id: HP:0002353
            label: EEG abnormality
        - preferred_term: Abnormal neurological examination
          description: Typically axial hypotonia with or without limb hypertonia or spasticity.
        - preferred_term: Developmental impairment
          description: Impairment beyond that attributable to the epileptiform activity alone, reflecting
            the developmental as well as the epileptic component.
          term:
            id: HP:0001263
            label: Global developmental delay
        exclusion_criteria:
        - preferred_term: Acute provoked (acute symptomatic) neonatal seizures
          description: Seizures secondary to an acute reversible insult such as hypoglycaemia, hypocalcaemia
            or acute infection, without an ongoing epilepsy.
        - preferred_term: Self-limited neonatal or infantile epilepsy
          description: Normal development and normal interictal EEG with spontaneous remission - the self-limited
            arm of the ILAE neonatal/infantile classification.
        - preferred_term: Seizure onset after 3 months of age
          description: Later onset points to infantile epileptic spasms syndrome, Dravet syndrome, or
            another infantile syndrome.
        notes: The exact mandatory/alert/exclusionary tables are in the full text of the position statement;
          only the abstract is available in the reference cache, so the criteria listed here are the syndrome
          features documented in the abstract, the MONDO:0800491 definition, and the primary cohort literature.
      selected_evidence:
        snippet: The tables summarize mandatory features, cautionary alerts, and exclusionary features
          for the common syndromes.
        supports: SUPPORT
    origin:
