        context: []
      assertion_type: Treatment
      assertion:
        name: Etiology-Guided Diagnostic Workup and Precision Treatment
        description: 'Because EIDEE is defined electroclinically but treated etiologically, the single
          most consequential intervention is rapid etiologic diagnosis: video EEG, epilepsy-protocol brain
          MRI, targeted metabolic testing, and rapid trio exome or genome sequencing. Molecular diagnosis
          was achieved in 69% of tested infants in a prospective EIDEE cohort. The diagnosis then determines
          treatment direction - vitamin supplementation, sodium-channel blockade, channel opener, resective
          surgery or ketogenic diet - and the same gene can require opposite treatments depending on the
          functional direction of the variant.'
        treatment_term:
          preferred_term: Targeted Therapy
          term:
            id: NCIT:C93352
            label: Targeted Therapy
        therapeutic_modality: OTHER
      selected_evidence:
        snippet: A molecular diagnosis was achieved in 53 out of 77 patients tested (69%). Next-generation
          sequencing had a yield of 51%, while microarray had a yield of 14%.
        supports: SUPPORT
