      reference: PMID:35765990
      reference_title: 'Treatment of children with infantile spasms: A network meta-analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Supports hormonal therapy for infantile spasms, the syndrome EIDEE characteristically
        evolves into. Marked PARTIAL because the evidence is for the spasms phase, not for EIDEE in its
        suppression-burst phase. Evidence source is HUMAN_CLINICAL: this is a network meta-analysis synthesising
        randomised trials in children, not a narrative review.'
