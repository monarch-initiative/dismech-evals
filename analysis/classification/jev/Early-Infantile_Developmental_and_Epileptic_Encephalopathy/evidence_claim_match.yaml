        phase: Later childhood - chronic drug-resistant epilepsy with profound impairment
        age_range: 1 year onward
        notes: Further evolution from West syndrome to Lennox-Gastaut syndrome occurs in some, with the
          EEG moving from hypsarrhythmia to diffuse slow spike-waves at around age 1 year. Seizures may
          remit in some genotypes (over 50% of KCNQ2-EIDEE by age 9 months to 4 years) without corresponding
          developmental recovery, leaving moderate-to-profound impairment.
      selected_evidence:
        snippet: Seizures generally cease between ages nine months and four years. At onset, EEG shows
          a burst-suppression pattern or multifocal epileptiform activity; early brain MRI can show basal
          ganglia hyperdensities and later MRIs may show white matter or general volume loss. Moderate-to-profound
          developmental impairment is present.
        supports: SUPPORT
