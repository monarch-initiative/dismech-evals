              label: early-infantile DEE
        context: []
      assertion_type: Treatment
      assertion:
        name: Sodium Channel Blocker Therapy for Gain-of-Function Channelopathies
        description: Carbamazepine, phenytoin and related sodium-channel blockers are the prototype EIDEE
          precision therapy. In infants with gain-of-function SCN2A, SCN3A or SCN8A variants, and in KCNQ2
          loss-of-function EIDEE, sodium-channel blockade is often markedly more effective than other
          antiseizure medications; the same drugs are contraindicated in SCN1A loss-of-function Dravet
          syndrome, where they aggravate seizures. Because EIDEE and Dravet syndrome can both be caused
          by SCN1A, the functional direction of the variant - not the gene name - must drive the prescription.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: carbamazepine
            term:
              id: CHEBI:3387
              label: carbamazepine
          - preferred_term: phenytoin
            term:
              id: CHEBI:8107
              label: phenytoin
        therapeutic_modality: SMALL_MOLECULE
        notes: Agents to avoid. The DEE Primer records that sodium-channel blockers may exacerbate seizures
          in SCN1A loss-of-function Dravet syndrome; the same caution does not apply to the gain-of-function
          EIDEE phenotypes described here, which is why the functional direction of the variant must be
          established before prescribing.
      selected_evidence:
        snippet: most frequently present with early onset epilepsy (<3 months), and demonstrate good response
          to sodium channel blockers (SCBs)
        supports: SUPPORT
