  9efac53fffb372716a357802ef57339a907e2a3c21ca37f3a49954c6e0e5ed4c:
    claim:
      about:
        disease:
          name: Early-Infantile Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: early-infantile DEE
            term:
              id: MONDO:0800491
              label: early-infantile DEE
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eidee_developmental_vs_epileptic_component
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: In EIDEE specifically, what share of the eventual developmental impairment is attributable
          to the epileptiform activity itself and is therefore potentially modifiable by seizure and EEG
          control, versus fixed by the underlying etiology?
        attaches_to:
        - pathophysiology#Developmental and Epileptic Encephalopathy
        rationale: The DEE construct asserts two separable contributors, but at onset before three months
          both act on the same developmental window and the DEE Primer states the distinction is often
          impossible to make. The natural experiment - KCNQ2-EIDEE, where seizures remit in over half
          of patients by age 9 months to 4 years yet impairment remains severe to profound - suggests
          the developmental component dominates for at least some genotypes. Resolving this determines
          whether aggressive seizure suppression in the neonatal period is developmentally worthwhile
          or only symptomatically so, and it is the central unstated assumption behind every EIDEE precision-therapy
          trial endpoint.
        proposed_experiments:
        - experiment_id: exp_eidee_epileptiform_burden_vs_developmental_quotient
          name: Longitudinal correlation of interictal epileptiform burden with developmental outcome
          description: Genotype-stratified longitudinal studies correlating quantitative interictal epileptiform
            burden in the first six months with developmental quotient at 2 and 5 years, controlling for
            etiologic group.
          decision_criterion: An independent association between epileptiform burden and later developmental
            quotient after adjusting for genotype would establish a modifiable epileptic component.
        - experiment_id: exp_eidee_eeg_normalization_outcome_comparison
          name: Outcome comparison by early EEG normalization
          description: Compare developmental outcome between EIDEE infants achieving early complete EEG
            normalization and matched infants with persistent epileptiform activity but equivalent clinical
            seizure control.
          decision_criterion: Better outcome in the EEG-normalized arm at equivalent seizure control would
            isolate the epileptic contribution to the encephalopathy.
      selected_evidence:
        snippet: Seizures generally cease between ages nine months and four years.
        supports: SUPPORT
    origin:
