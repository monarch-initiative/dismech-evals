      assertion_type: Pathophysiology
      assertion:
        name: Reduced Kv7.2/Kv7.3 M-Current
        biological_scale: MOLECULAR
        role: mechanism
        description: 'KCNQ2 and KCNQ3 form the heterotetrameric M-channel that regulates neuronal excitability.
          De novo loss-of-function KCNQ2 variants reduce the M-current that repolarizes neurons after
          firing, removing a brake on repetitive discharge and producing neonatal-onset EIDEE. The same
          gene''s inherited variants instead cause self-limited familial neonatal epilepsy, so the lesion
          is dose- and mechanism-dependent rather than gene-dependent. This node is deliberately separated
          from the sodium-channel gain-of-function node below: the two are opposite-direction lesions
          converging on the same downstream imbalance, and only one of them is a sodium-channel-blocker
          target.'
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        cell_types:
