      assertion_type: Treatment
      assertion:
        name: Vitamin and Cofactor Trials for Treatable Metabolic Causes
        description: A monitored empiric trial of pyridoxine (for ALDH7A1 pyridoxine-dependent epilepsy),
          pyridoxal 5'-phosphate (PNPO deficiency), folinic acid and biotin (biotinidase deficiency) is
          a priority in any infant presenting with EIDEE, because these are the only etiologies with a
          demonstrably favourable seizure outcome. In a prospective EIDEE cohort all metabolic causes
          were vitamin-responsive, and vitamin responsiveness was the only independently significant positive
          predictor of seizure control. Pyridoxine trials require cardiorespiratory monitoring because
          apnoea can occur.
        treatment_term:
          preferred_term: Pharmacotherapy
