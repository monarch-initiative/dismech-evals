          name: Early-Infantile Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: early-infantile DEE
            term:
              id: MONDO:0800491
              label: early-infantile DEE
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eidee_ohtahara_eme_merge_residual_structure
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the ILAE 2022 merge of Ohtahara syndrome and early myoclonic encephalopathy into
          EIDEE discard clinically actionable structure, given that the historical split tracked etiology
          (structural versus metabolic) and that the two arms differ in predominant seizure type?
        attaches_to:
        - pathophysiology#Etiologic Lesion of the Immature Brain
        rationale: 'The 2012 review that argued for unification did so on the basis of overlapping clinical
          presentation, prognosis and EEG signature. But the 2023 prospective EIDEE cohort found that
          etiologic group is strongly predictive within EIDEE: tonic seizures are enriched in the genetic/unknown
          group (risk ratio 0.66 for the vitamin-responsive/structural group) while clonic seizures are
          enriched in the vitamin-responsive/structural group (risk ratio 1.36), and severe developmental
          delay differs by an odds ratio of 57 between the groups. That is close to the axis the Ohtahara/EME
          split was tracking. If the seizure-type-plus-etiology structure is reproducible, EIDEE may need
          documented etiologic strata rather than a single undifferentiated syndrome.'
        proposed_experiments:
        - experiment_id: exp_eidee_etiology_stratified_seizure_type_cohort
          name: Etiology-stratified prospective EIDEE cohort with seizure-type and EEG phenotyping
          description: Prospective multi-centre EIDEE cohorts reporting seizure type, interictal EEG pattern
            and outcome stratified by etiologic group, powered to test whether the tonic versus myoclonic/clonic
            distinction is independent of etiology.
          decision_criterion: If seizure type remains associated with the historical Ohtahara/EME split
            after adjustment for etiologic group, the merged syndrome is hiding reproducible structure.
        - experiment_id: exp_eidee_historical_series_reclassification
          name: Retrospective reclassification of historical Ohtahara and EME series
          description: Reclassify published Ohtahara syndrome and early myoclonic encephalopathy case
            series against the ILAE 2022 EIDEE criteria with modern genomic and metabolic testing, to
            determine how cleanly the historical labels map onto contemporary etiologic strata.
          decision_criterion: A clean mapping would indicate the historical labels were etiologic proxies;
            a poor mapping would support the merge.
      selected_evidence:
        snippet: Newer understandings of underlying etiologies of these conditions may support the previously
          suggested concept that they represent a single spectrum of disease rather than two distinct
          disorders.
        supports: SUPPORT
