  a628f23e959404dd5290964315fc337137643eb56adef62a0466e98d0ca3095a:
    claim:
      about:
        disease:
          name: Early-Infantile Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: early-infantile DEE
            term:
              id: MONDO:0800491
              label: early-infantile DEE
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: eidee_epileptic_component_reversibility
        hypothesis_label: Suppressing epileptiform activity in EIDEE recovers a separable share of developmental
          potential
        status: EMERGING
        description: 'The DEE construct implies that the epileptic component of the encephalopathy is,
          in principle, modifiable: if the epileptiform activity independently degrades development, then
          abolishing it should yield developmental gains over and above the fixed developmental encephalopathy.
          There are clear proofs of principle in other DEEs (withdrawal of contraindicated sodium-channel
          blockers in Dravet syndrome, EEG normalization in Landau-Kleffner syndrome). Whether this holds
          for EIDEE specifically is unresolved, because at onset before three months the two components
          act on the same developmental window and cannot be dissociated clinically. In KCNQ2-EIDEE, for
          example, seizures remit in more than half of patients in early life yet impairment remains severe
          to profound - which argues that the developmental component dominates in at least some genotypes.'
      selected_evidence:
        snippet: there are clear examples where improvement of seizure control or resolution of interictal
          EEG abnormalities ameliorate cognitive outcome
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
