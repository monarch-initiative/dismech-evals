      assertion_type: Treatment
      assertion:
        name: Conventional Antiseizure Medication
        description: Phenobarbital, levetiracetam, benzodiazepines, valproate and vigabatrin are the conventional
          first- and second-line antiseizure medications used while the etiology is being established
          and in the majority of infants for whom no precision option exists. Phenobarbital, valproic
          acid and vigabatrin are the most commonly used agents in STXBP1 encephalopathy, the commonest
          single-gene EIDEE. Roughly a quarter of STXBP1 patients are refractory to antiseizure medication
          altogether.
