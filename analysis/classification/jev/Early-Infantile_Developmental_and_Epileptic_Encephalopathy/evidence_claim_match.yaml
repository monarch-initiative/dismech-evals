              id: MONDO:0800491
              label: early-infantile DEE
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Etiologic Lesion of the Immature Brain
        biological_scale: MOLECULAR
        role: trigger
        description: 'EIDEE is a final common electroclinical phenotype rather than a single disease,
          and the upstream lesion is heterogeneous: a pathogenic variant in an ion-channel, synaptic,
          transcriptional or metabolic gene; a structural malformation of cortical development or acquired
          perinatal brain injury; or an inborn error of metabolism, frequently a vitamin-responsive one.
          In a prospective EIDEE cohort an etiology was established in 83% of infants - genetic in 50%,
          structural in 19% and metabolic in 14%, with all metabolic cases vitamin-responsive.'
        notes: 'On biological_scale. This node is tagged MOLECULAR because the genetic and metabolic etiologies
          that account for the substantial majority of EIDEE (50% + 14% = 64% of the prospective cohort,
          versus 19% structural) are molecular lesions. The structural arm - malformation of cortical
          development and acquired perinatal injury - is genuinely TISSUE-scale, so the single tag under-describes
          that minority. This is a deliberate and disclosed compromise, not an oversight: EIDEE is defined
          by the ILAE as an etiologically heterogeneous final common electroclinical phenotype, so a single
          heterogeneous entry-point node is the correct model for it, and splitting the node by scale
          would fragment that construct without adding mechanism. Revisit if the structural arm is ever
          elaborated into its own chain.'
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Regulation of Membrane Potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
        - preferred_term: Chemical Synaptic Transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
          modifier: ABNORMAL
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: 'patients were further classified into four aetiological groups: genetic (50%), structural
          (19%), metabolic (14%; all were vitamin responsive) and unknown'
        supports: SUPPORT
    origin:
