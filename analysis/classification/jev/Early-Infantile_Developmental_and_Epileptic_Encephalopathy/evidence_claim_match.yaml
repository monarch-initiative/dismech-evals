          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: INCREASED
      selected_evidence:
        snippet: mutations associated with early infantile epilepsy result in increased sodium channel
          activity with gain-of-function, characterized by slowing of fast inactivation, acceleration
          of its recovery or increased persistent sodium current
        supports: SUPPORT
