        role: central_effector
        description: 'Net excitatory bias in the immature cortex produces hypersynchronous population
          discharge whose electrographic expression in EIDEE is characteristically a suppression-burst
          pattern: bursts of 1-3 seconds of high-voltage activity alternating with a nearly flat suppression
          phase of 2-5 seconds, present regardless of the circadian cycle. Tonic spasms occur concomitantly
          with the bursts. Burst-suppression is characteristic but not obligatory - in a prospective EIDEE
          cohort it was present in 42%, with multifocal discharges in 30% and hypsarrhythmia in 13%.'
        conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
        cell_types:
