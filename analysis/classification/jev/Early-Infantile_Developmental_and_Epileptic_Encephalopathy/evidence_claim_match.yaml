            preferred_term: early-infantile DEE
            term:
              id: MONDO:0800491
              label: early-infantile DEE
        context: []
      assertion_type: Treatment
      assertion:
        name: Hormonal Therapy with ACTH or Corticosteroid
        description: 'Adrenocorticotropic hormone and high-dose corticosteroid are the standard of care
          once EIDEE evolves into infantile epileptic spasms syndrome (West syndrome), the commonest downstream
          syndrome, typically at 3-6 months as the EEG moves from suppression-burst to hypsarrhythmia.
          Hormonal therapy is far less consistently effective for EIDEE in its suppression-burst phase,
          and spasm-phase efficacy should not be read back onto the neonatal phase. No `target_mechanisms`
          edge is declared: the mechanism by which hormonal therapy suppresses spasms is not established,
          and asserting an edge into this entry''s pathograph would overstate what is known.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: corticotropin
            term:
              id: CHEBI:3892
              label: corticotropin
          - preferred_term: prednisolone
            term:
              id: CHEBI:8378
              label: prednisolone
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: Treatments including ACTH and high dose prednisolone are more effective in achieving
          electroclinical and clinical remissions for infantile spasms.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/0
