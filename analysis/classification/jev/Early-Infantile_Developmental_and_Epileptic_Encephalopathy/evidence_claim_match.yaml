        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: Autosomal dominant, typically de novo. A deliberate boundary case. Loss-of-function SCN1A
          causes Dravet syndrome (curated as Dravet_syndrome), which is NOT EIDEE - onset is typically
          at 5-6 months. Rare gain-of-function SCN1A variants instead cause a non-Dravet EIDEE phenotype
          with onset by three months, and carry the opposite sodium-channel-blocker recommendation. Assigning
          an SCN1A case to EIDEE versus Dravet syndrome therefore requires the functional direction of
          the variant, not just the gene name.
