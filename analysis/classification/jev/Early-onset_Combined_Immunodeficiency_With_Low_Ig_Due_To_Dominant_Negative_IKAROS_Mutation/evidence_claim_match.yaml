              and they produce little IL-1 beta, IL-6 or TNF in response to agonists of Toll-like receptors
              1/2, 2, 4, 5 and 6/2, while their interferon and IL-4 responses are intact. Adding healthy-donor
              monocytes restored the proliferation of patient T cells, so this myeloid defect feeds back
              onto the T-cell phenotype.'
