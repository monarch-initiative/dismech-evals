            term:
              id: MONDO:0979316
              label: early-onset combined immunodeficiency with low ig due to dominant negative IKAROS
                mutation
        context: []
      assertion_type: Genetic
      assertion:
        name: IKZF1
        gene_term:
          preferred_term: IKZF1
          term:
            id: hgnc:13176
            label: IKZF1
        relationship_type: CAUSATIVE
        presence: PRESENT
        variant_origin: GERMLINE
        notes: 'Disease-causing variants in this allele class are missense substitutions of asparagine
          159, in zinc finger 2 of the N-terminal DNA-binding domain. Position within the domain does
          not by itself place a variant here: N159K at the same codon is haploinsufficient, and other
          DNA-binding-domain variants are haploinsufficient too, so a new variant needs a co-transfection
          assay against wild-type IKAROS before it is called dominant-negative. No gene_disease_validity
          is recorded, because ClinGen files its IKZF1 assertion against a broader IKAROS-related immunodeficiency
          term rather than against this disease.'
        variants:
        - name: IKZF1 p.N159S
          description: c.476A>G missense in zinc finger 2 of the DNA-binding domain, carried by six of
            the seven founding patients and absent from public exome databases. It abolishes DNA binding
            and has a stronger dominant-negative effect on wild-type foci formation than N159T.
          clinical_significance: PATHOGENIC
        - name: IKZF1 p.N159T
          description: An A>C transversion at the same codon, in one patient whose B-cell numbers were
            initially normal and declined over time and whose memory T cells were preserved. Its dominant-negative
            effect on foci formation was weaker than that of N159S.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: IKZF1 | IKAROS family zinc finger 1 | hgnc:13176 | Disease-causing germline mutation(s)
          in
        supports: SUPPORT
