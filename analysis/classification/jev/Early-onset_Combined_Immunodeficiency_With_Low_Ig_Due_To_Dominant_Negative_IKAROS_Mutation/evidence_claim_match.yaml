        biological_scale: CELLULAR
        description: CD34+ progenitors from a patient carrying the N159S allele, differentiated in an
          artificial thymic organoid, stopped at the CD4-CD8- double-negative stage and kept high CD45RA,
          whereas a haploinsufficient N159K progenitor reached the double-positive stage. This places
          part of the T-cell defect before the thymic exit and matches the naive, recent-thymic-emigrant
          phenotype of circulating patient T cells.
        cell_types:
