      assertion_type: AnimalModel
      assertion:
        name: Plastic mouse (Ikzf1 H191R DNA-binding zinc finger point mutant)
        species: Mouse
        genotype: Ikzf1 p.H191R (ENU-induced, zinc finger 3 of the DNA-binding domain)
        publication: PMID:12871645
        description: An ENU-derived point mutation in a DNA-binding zinc finger that abolishes DNA binding
          while the full-length protein still assembles into higher-order complexes. Homozygotes die in
          utero with blocked lymphopoiesis and defective granulocyte and erythrocyte differentiation;
          heterozygotes show a partial block in lymphocyte differentiation. The paper that describes the
          strain calls the allele recessive and niche-filling, while the founding paper of this disease
          reads Plastic heterozygotes as carrying a dominant-negative missense mutation and draws its
          own comparison to them, so the allele's relation to the human N159 alleles is contested between
          the two sources rather than settled here.
        modeled_mechanisms:
        - target: Early B Cell Developmental Arrest
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The heterozygote, the genotype that matches the human disease, has a partial block
            in lymphocyte differentiation.
          limitations: The mouse allele is H191R in zinc finger 3, not N159 in zinc finger 2, and it was
            not tested for interference with the wild-type protein, so it is an allele of the same class
            rather than a model of the human variant. The heterozygous block is partial and described
            for lymphocytes generally, not staged within the B-cell lineage as in the human marrow studies,
            and the severe multilineage phenotype requires homozygosity, which is embryonically lethal
            and has no human counterpart.
        - target: Loss of IKAROS Lymphoid Tumor Suppression
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The founding paper of this disease reads the abnormal lymphopoiesis of its patients
            as reminiscent of the early T-cell development abnormalities that raise leukemia risk in Plastic
            heterozygotes, and cites that strain for the comparison.
          limitations: The link rests on the human authors' comparison rather than on a leukemia phenotype
            reported for Plastic in the paper describing the strain, which reports a partial block in
            lymphocyte differentiation in heterozygotes and embryonic lethality in homozygotes. The allele
            is H191R in zinc finger 3, not N159 in zinc finger 2.
      selected_evidence:
        snippet: Here we describe a mouse strain, Plastic, with a point mutation in a zinc finger of Ikaros
          that disrupts DNA binding but preserves efficient assembly of the full-length protein into higher
          order complexes.
        supports: SUPPORT
