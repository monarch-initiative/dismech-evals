          twenty-four months of age, and most also had invasive bacterial respiratory infection, severe
          or recurrent viral infection, or fungal infection. The susceptibility is not uniform: live viral
          and BCG vaccines were given without complication, and chickenpox ran an uncomplicated course,
          which the authors attribute to preserved proliferation under strong stimulation and to normal
          interferon responses.'
