                mutation
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: IKZF1 haploinsufficiency
        description: Haploinsufficient IKZF1 variants, including N159K at the same codon, cause a CVID-like
          antibody deficiency with progressive B-cell loss. T-cell and myeloid biology are not affected
          in a clinically relevant way, and the T-cell phenotype runs the other way, with memory cells
          increased and naive cells reduced. Those variants are curated as the IKAROS subtype of Common_Variable_Immunodeficiency.
        distinguishing_features:
        - Naive-predominant T cells, absent plasma cells, myeloid involvement and early Pneumocystis pneumonia
          in the dominant-negative class; an older age at presentation, memory-predominant T cells and
          autoimmunity in the haploinsufficient class.
      selected_evidence:
        snippet: Interestingly, haploinsufficient mutations preserving one functionally active allele
          do not seem to impact T cell and myeloid biology in a clinically relevant manner (15, 18, 22),
          which demonstrates that one fully functional IKZF1 copy is sufficient to retain normal T cell
          and myeloid functions.
        supports: SUPPORT
    origin:
