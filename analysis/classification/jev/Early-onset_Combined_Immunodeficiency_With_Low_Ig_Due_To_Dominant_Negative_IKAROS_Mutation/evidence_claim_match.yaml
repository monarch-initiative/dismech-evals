      assertion_type: Discussion
      assertion:
        discussion_id: no_n159_knock_in_model
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Dominant-Negative Inhibition of Wild-Type IKAROS
        prompt: Does a heterozygous N159 knock-in reproduce the human disease, including the susceptibility
          to Pneumocystis, in an animal model?
        rationale: The dominant-negative mechanism rests on co-transfection of tagged proteins into cell
          lines and on immunophenotyping of patient cells, plus an organoid differentiation of patient
          progenitors. The animal evidence comes from other DNA-binding-domain alleles. PubMed searches
          for (Ikzf1 OR Ikaros) AND (knock-in OR knockin) AND (N159 OR "zinc finger 2" OR "DNA-binding
          domain") AND mice, and for IKZF1 N159S mouse model, run on 2026-10-23, returned no records,
          so no model carries the human allele and the step from the molecular lesion to the multilineage
          disease is inferred from patients. Two near-misses exist and neither fills the gap. A DNA-binding-domain
          knock-in, Ikzf1 L132P in zinc finger 1, was shown to act by haploinsufficiency and gives a B-cell-restricted,
          CVID-like phenotype, so it models the sibling disease rather than this one. A knock-in of the
          AIOLOS residue paralogous to IKAROS N159, p.N160S, does reproduce a dominant-negative immunophenotype,
          but in a different gene.
      selected_evidence:
        snippet: Expression levels and functional effects of mutant proteins IKZF1N159S and IKZF1N159T
          were assessed in patients’ cells as well as in vitro expression experiments.
        supports: SUPPORT
