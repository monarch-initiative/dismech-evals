              label: early-onset combined immunodeficiency with low ig due to dominant negative IKAROS
                mutation
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation
        description: 'Transplantation replaces the patient''s hematopoiesis with donor cells that carry
          two wild-type IKZF1 alleles, and is the only treatment that addresses the defect itself. Four
          patients with dominant-negative variants were reported in a dedicated transplant series: all
          achieved more than 99% donor chimerism, one died of liver failure about a year afterwards following
          earlier cryptosporidial cholangitis, and the survivors came off immunoglobulin replacement and
          antimicrobial prophylaxis. Because functionally defective monocytes contribute to the T-cell
          defect, the founding authors warn that lymphoid engraftment alone or mixed chimerism may not
          be enough.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: allogeneic hematopoietic stem cell transplantation
          term:
            id: NCIT:C46089
            label: Allogeneic Hematopoietic Stem Cell Transplantation
      selected_evidence:
        snippet: Although this is small cohort, HSCT appears as a valid curative option for IKZF1 DN disease,
          an early onset, severe, progressive immunodeficiency with T, B and myeloid involvement, and
          increased susceptibility to hematologic malignancies.
        supports: SUPPORT
