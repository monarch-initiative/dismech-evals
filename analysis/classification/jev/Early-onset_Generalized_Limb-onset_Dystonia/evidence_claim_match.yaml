          term:
            id: CL:0000540
            label: neuron
        molecular_functions:
        - preferred_term: cofactor-dependent torsinA ATP hydrolysis
          modifier: DECREASED
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
      selected_evidence:
        snippet: This deletion results in loss of one of a pair of glutamic-acid residues in a conserved
          region of a novel ATP-binding protein, termed torsinA.
        supports: SUPPORT
