            term:
              id: MONDO:0007492
              label: early-onset generalized limb-onset dystonia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Targeted TOR1A molecular genetic testing
        description: 'The diagnosis is established by finding a heterozygous pathogenic TOR1A variant
          in a proband with a suggestive clinical picture. This disease is unusually favourable for targeted
          testing rather than panel or exome sequencing, because more than 98% of affected individuals
          carry the same c.907_909delGAG allele - so a single-variant assay answers the question in nearly
          every case, and a negative targeted result is informative rather than merely uninformative.

          Two consequences of the genetics govern how the result is read, and both are curated elsewhere
          in this entry. Penetrance is about 30%, so identifying the variant in a relative predicts dystonia
          in a minority of carriers and an unaffected parent cannot be assumed to be a non-carrier. And
          about 5% of affected individuals present after age 30, so a later presentation does not exclude
          the diagnosis.'
        diagnosis_term:
          preferred_term: targeted TOR1A single-variant molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: 'NCIT:C15709 Genetic Testing was checked against cache/ncit/terms.csv for its label and
          against the treatmentactionterm enum cache for membership in the dynamic enum that diagnosis_term
          binds to, which is reachable from NCIT:C25218 Clinical Intervention or Procedure. preferred_term
          carries the specificity the action term does not - that the assay is targeted at one variant
          in one gene rather than a broad genomic test.

          A levodopa trial to exclude dopa-responsive dystonia was considered as a second diagnostic item
          and is deliberately not curated, because no fetched source states it as a diagnostic step. The
          GeneReviews chapter does not mention levodopa at all, and the only fetched reference that does
          (PMID:30707939) is a mouse study whose levodopa content is a methods paragraph plus the result
          that levodopa does not increase striatal dopamine release. That result is curated where it belongs,
          on the Reduced Striatal Dopamine Release node, and it supports the pharmacological contrast
          with dopa-responsive dystonia without supporting a recommendation to perform a trial. Adding
          the item would have meant asserting a diagnostic pathway from a mouse experiment.'
      selected_evidence:
        snippet: The diagnosis of DYT-TOR1A is established in a proband with suggestive findings and a
          heterozygous pathogenic variant in TOR1A identified by molecular genetic testing.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
