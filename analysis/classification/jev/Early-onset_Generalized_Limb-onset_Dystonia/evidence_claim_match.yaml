        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Basal Ganglia and Cerebellothalamocortical Network Dysfunction
        biological_scale: TISSUE
        description: The convergence point, and the least mechanistically closed node in the entry. Functional
          imaging in DYT1 carriers shows reduced striatal GABA and dopamine receptor availability, increased
          metabolic activity in the lentiform nucleus, supplementary motor area and cerebellum, and an
          abnormal cerebellothalamocortical pathway. Notably these changes are present in carriers irrespective
          of whether they manifest dystonia, so network abnormality alone is not sufficient for disease
          - what distinguishes manifesting from non-manifesting carriers appears to involve the distal
          thalamocortical segment and compensatory putaminal changes. That is the imaging-level correlate
          of 30% penetrance. What remains unestablished is the causal step from this network state to
          the dystonic movement itself; the entry asserts the association and stops there.
        locations:
        - preferred_term: globus pallidus
          term:
            id: UBERON:0001875
            label: globus pallidus
        - preferred_term: striatum
          term:
            id: UBERON:0002435
            label: striatum
      selected_evidence:
        snippet: we propose that DYT1 dystonia is a cerebellostriatothalamocortical network disorder affecting
          either the structure or function of the different structures or nodes in the network
        supports: SUPPORT
