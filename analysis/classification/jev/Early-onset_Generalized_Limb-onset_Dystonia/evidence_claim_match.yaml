        asserts the gene-to-activity link rather than the reduction itself, which the conserved-region
        glutamate loss above and the cofactor-cycle evidence on the next node carry. Graded HUMAN_CLINICAL
        because the quoted sentence states the human genetic aetiology, with quote_role BACKGROUND because
        it is this in-vitro paper''s framing of established genetics rather than its own result.'
