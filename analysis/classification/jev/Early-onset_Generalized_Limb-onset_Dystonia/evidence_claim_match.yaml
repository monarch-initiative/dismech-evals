          at that size. This follows the reasoning recorded on the same treatment in Torsion_Dystonia_6,
          which also notes that the KB is inconsistent on this point.

          therapeutic_agent is left absent. NCIT:C163032 Botulinum Toxin exists, but the cited source
          is a cognitive-outcomes review that names the modality without specifying a serotype or product,
          so binding a specific agent would assert more than the evidence carries.'
      selected_evidence:
        snippet: The successful treatment of dystonia with botulinum toxin injections or deep brain stimulation
