      assertion_type: Phenotype
      assertion:
        category: Neurocognitive
        name: Largely preserved cognition with isolated executive dysfunction
        description: Cognition in DYT1 dystonia is largely intact. This is a defining negative feature
          - it is what makes the disease an isolated dystonia rather than a complex neurodevelopmental
          syndrome, and it separates this entry from KMT2B-related dystonia, where developmental delay
          and intellectual disability are usual. The qualification is that isolated executive dysfunction
          is reported, and that abnormal temporal and spatial discrimination thresholds are present in
          unaffected relatives and non-manifesting carriers as well, so they are endophenotypes of the
          genotype rather than consequences of the dystonia. Note that high-dose anticholinergic treatment
          can itself impair memory, so a cognitive complaint in a treated patient is not necessarily disease-related.
        phenotype_term:
          preferred_term: Isolated executive dysfunction on a background of intact cognition
          term:
            id: HP:0033051
            label: Impaired executive functioning
      selected_evidence:
        snippet: In idiopathic or DYT1 dystonia, cognition is largely intact with only isolated executive
          dysfunction.
