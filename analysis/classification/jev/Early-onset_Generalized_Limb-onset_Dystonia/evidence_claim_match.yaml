              label: early-onset generalized limb-onset dystonia
        context: []
      assertion_type: Prevalence
      assertion:
        population: Ashkenazi Jewish population
        measure_type: CARRIER_FREQUENCY
        prevalence_class: BAND_1_5_PER_10000
        rate_low: 16.7
        rate_high: 50.0
        notes: 'A frequency of the founder GAG-deletion mutation, not disease prevalence. The reported
          1/6,000 to 1/2,000 range converts to 16.7-50 per 100,000; no synthetic midpoint is assigned.
          Because penetrance is approximately 30%, the frequency of manifesting disease in this population
          is substantially lower than this figure, but the cited source does not report a manifesting
          rate and none is derived here.

          What measure_type should be is not fully resolved by the source, and the record is deliberately
          not written as though it were. The quoted sentence says only that "this dominant mutation" has
          a "current high frequency", and its closing clause speaks of "disease allele frequencies" -
          so whether 1/6,000-1/2,000 is a heterozygote (carrier) frequency or an allele frequency is left
          open, and the two differ by a factor of about two. CARRIER_FREQUENCY is recorded because PrevalenceMeasureEnum
          has no allele-frequency value (permissible values checked: POINT_PREVALENCE, BIRTH_PREVALENCE,
          LIFETIME_PREVALENCE, PERIOD_PREVALENCE, ANNUAL_INCIDENCE, CARRIER_FREQUENCY, CASES_IN_LITERATURE,
          UNKNOWN) and because for a heterozygous dominant allele the carriers are the heterozygotes the
          enum''s own definition names. Treat the band as the magnitude the source supports, not as a
          resolved carrier rate.'
      selected_evidence:
        snippet: its current high frequency (between 1/6,000 and 1/2,000)
        supports: SUPPORT
