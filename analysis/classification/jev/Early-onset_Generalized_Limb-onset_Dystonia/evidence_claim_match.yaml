      assertion:
        name: Maturation-Dependent Disruption of Neuronal Development
        biological_scale: CELLULAR
        description: The consequences of torsinA loss are tied to a developmental window rather than to
          progressive adult injury. Nuclear envelope abnormalities appear in postmigratory embryonic neurons
          and worsen as those neurons mature; in conditional mouse mutants dystonic movements emerge during
          juvenile CNS maturation; and patient-derived motor neurons show reduced neurite length and branching.
          This node is why the disease is described as functional and developmental rather than degenerative,
          and it is the mechanistic counterpart of the clinical observation that symptoms begin in childhood,
          spread over a few years, and then persist without shortening life span.
        biological_processes:
        - preferred_term: neuron projection development
          modifier: DECREASED
          term:
            id: GO:0031175
            label: neuron projection development
        cell_types:
        - preferred_term: developing neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: These membrane abnormalities develop in postmigratory embryonic neurons and subsequently
          worsen with further neuronal maturation, a finding evocative of the developmental dependence
          of DYT1 dystonia.
        supports: SUPPORT
