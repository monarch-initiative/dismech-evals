    evidence_metadata:
      reference: PMID:30707939
      reference_title: Trihexyphenidyl rescues the deficit in dopamine neurotransmission in a mouse model
        of DYT1 dystonia.
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      explanation: 'Sources the levodopa half of this node''s description, which was previously asserted
        without a citation. It is the pharmacological discriminator that separates this disease from dopa-responsive
        dystonia: the dopaminergic deficit here is in activity-dependent release rather than in dopamine
        synthesis or content, so supplying precursor does not correct it. The snippet reproduces the source''s
        small-capital letter in "ʟ-DOPA" verbatim.'
