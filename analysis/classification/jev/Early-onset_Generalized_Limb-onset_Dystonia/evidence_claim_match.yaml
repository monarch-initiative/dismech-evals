            term:
              id: MONDO:0007492
              label: early-onset generalized limb-onset dystonia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Striatal Dopamine Release
        biological_scale: CELLULAR
        description: 'Striatal dopamine signalling is abnormal in both directions of evidence. Knock-in
          mice carrying the heterozygous deletion show significantly reduced evoked dopamine release,
          and DYT1 patients show reduced striatal D2 receptor availability. The link to the cholinergic
          node above is mechanistic rather than merely associative: trihexyphenidyl restores dopamine
          release in Dyt1 mice through a nicotinic-receptor-dependent route, which is the clearest account
          available of how the clinically preferred drug works. Levodopa, by contrast, does not increase
          dopamine release in these mice, matching the clinical observation that DYT1 dystonia is not
          dopa-responsive.'
        cell_types:
        - preferred_term: nigrostriatal dopaminergic neuron
          term:
            id: CL:0000700
            label: dopaminergic neuron
        biological_processes:
        - preferred_term: striatal dopamine secretion
          modifier: DECREASED
          term:
            id: GO:0014046
            label: dopamine secretion
        locations:
        - preferred_term: striatum
          term:
            id: UBERON:0002435
            label: striatum
      selected_evidence:
        snippet: In contrast, ʟ-DOPA, which is not usually effective for the treatment of DYT1 dystonia,
          did not increase dopamine release in either Dyt1 or control mice.
        supports: SUPPORT
