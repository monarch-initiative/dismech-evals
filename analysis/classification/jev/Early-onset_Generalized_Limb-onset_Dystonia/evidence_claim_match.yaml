  038cce096e229be570cdbe249fd2a7a4ca6af14aaf8c303d77abd930fdadc066:
    claim:
      about:
        disease:
          name: Early-onset Generalized Limb-onset Dystonia
          disease_term:
            preferred_term: DYT1 early-onset generalized limb-onset dystonia
            term:
              id: MONDO:0007492
              label: early-onset generalized limb-onset dystonia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dyt1_reduced_penetrance_determinants
        kind: KNOWLEDGE_GAP
        prompt: Why do roughly 70% of TOR1A GAG-deletion carriers never develop dystonia, when functional
          imaging shows the same network abnormality in manifesting and non-manifesting carriers alike?
        attaches_to:
        - pathophysiology#Basal Ganglia and Cerebellothalamocortical Network Dysfunction
        - inheritance#Autosomal dominant with reduced penetrance
        - genetic#TOR1A p.D216H
        rationale: 'Reduced penetrance is usually treated as a counselling fact, but here it is also the
          sharpest mechanistic question in the disease, because the obvious candidate explanation has
          been excluded. Reduced striatal GABA and dopamine receptor availability, increased lentiform,
          supplementary motor area and cerebellar metabolism, and an abnormal cerebellothalamocortical
          pathway are all present in carriers irrespective of whether they manifest. So the network abnormality
          this entry places immediately upstream of the movement disorder is not sufficient to produce
          it.

          The systematic review''s proposal is that the distinguishing factor lies in the distal thalamocortical
          segment, disrupted in non-manifesting carriers in a way that may prevent abnormal impulses reaching
          cortex, together with larger putaminal volumes that appear compensatory and a correspondingly
          reduced response to plasticity-inducing protocols. That is a hypothesis generated from cross-sectional
          imaging of small cohorts rather than an established mechanism.

          One genetic modifier is established, and it is a partial answer rather than none. The TOR1A
          coding polymorphism D216H (rs1801968) modifies penetrance of the GAG deletion: the 216H allele
          carried in trans is highly protective, D216 in cis appears to be required for the deletion to
          be penetrant at all, and the derived penetrance estimates are about 35% for a carrier with D216
          in trans against about 3% for one carrying 216H. It is curated as a MODIFIER record in `genetic:`.

          What keeps this a knowledge gap is the size and the scope of that answer, stated by the same
          study that found it. The 216H allele has a potent effect but explains only a small proportion
          of the reduced penetrance, so most of the 70% is still unaccounted for. And nearly all manifesting
          carriers were D216 homozygotes, which means the modifier says nothing about the second question
          sitting beside penetrance - why, among those who do manifest, severity ranges from writer''s
          cramp that never spreads to generalized dystonia. Beyond D216H this entry records no determinant
          of penetrance, and none was found in the sources fetched for it: no environmental trigger, no
          developmental variable, and no further modifier locus.

          Until this is settled, the final edge in this entry - from network dysfunction to dystonia -
          is an association plus a therapeutic argument, and the entry says so at that node rather than
          implying a closed causal chain.'
      selected_evidence:
        snippet: Although the 216H allele has a potent effect, it explains only a small proportion of
          the reduced penetrance associated with carrying the DYT1 GAG-deletion mutation.
        supports: SUPPORT
        directness: DIRECT
