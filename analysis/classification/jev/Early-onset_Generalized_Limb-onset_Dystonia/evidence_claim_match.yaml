  fead511330a35ced04a8a13a76649ffb6c5215cc2b2619fd7d1718fcaa3da45f:
    claim:
      about:
        disease:
          name: Early-onset Generalized Limb-onset Dystonia
          disease_term:
            preferred_term: DYT1 early-onset generalized limb-onset dystonia
            term:
              id: MONDO:0007492
              label: early-onset generalized limb-onset dystonia
        context: []
      assertion_type: Genetic
      assertion:
        name: TOR1A p.D216H
        gene_term:
          preferred_term: TOR1A
          term:
            id: hgnc:3098
            label: TOR1A
        relationship_type: MODIFIER
        variant_origin: GERMLINE
        association: Intragenic modifier of penetrance of the c.907_909delGAG allele. The 216H allele
          carried in trans is highly protective; the D216 allele in cis appears to be required for the
          deletion to be penetrant.
        notes: 'D216H (rs1801968) is a common coding polymorphism in TOR1A itself - the same gene as the
          causative allele, which is why the effect is described as intragenic rather than as a second
          locus. The histidine allele is present on roughly 12% of control chromosomes, so this is ordinary
          population variation rather than a rare modifier allele.

          The direction is protective, and the effect is phase-dependent, which is the unusual part. In
          a case-control comparison of manifesting against non-manifesting GAG-deletion carriers, the
          216H allele was enriched in carriers without dystonia and depleted in carriers with it; haplotype
          analysis localized the protective effect to the H allele in trans with the deletion, with suggestive
          evidence that D216 in cis is needed for penetrance at all. The authors'' derived figures are
          a penetrance of about 35% for a carrier with D216 in trans against about 3% for one with 216H.

          relationship_type is MODIFIER rather than PROTECTIVE because the claim is about penetrance of
          another allele rather than about risk of disease in the general population, and because "gene
          modifier" is the cited study''s own framing. Both values would be defensible; MODIFIER is the
          one that matches what the evidence measures.

          This does not close the penetrance question, and the entry does not let it look as though it
          does. The same paper states that 216H explains only a small proportion of the reduced penetrance
          and that nearly all manifesting carriers were D216 homozygotes, so what modulates severity among
          those who do manifest is still unaccounted for. That is recorded on the dyt1_reduced_penetrance_determinants
          discussion.'
      selected_evidence:
        snippet: Analysis of haplotypes demonstrated a highly protective effect of the H allele in trans
          with the GAG deletion; there was also suggestive evidence that the D216 allele in cis is required
          for the disease to be penetrant.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/1
      evidence_path: /genetic/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17503336
      reference_title: Intragenic Cis and Trans modification of genetic susceptibility in DYT1 torsion
        dystonia.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The result that establishes the modifier and, unusually, its phase dependence - protective
        in trans, permissive in cis. This is the sentence the MODIFIER classification rests on.
