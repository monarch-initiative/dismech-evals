        model_scale: CELLULAR
        description: Demonstrates the nuclear envelope lesion and its neuron-selectivity, and establishes
          its developmental timing.
        limitations: The genotypes are homozygous null or homozygous deletion; patients are heterozygous,
          and heterozygous mice show no pathology. The specific morphology seen here - perinuclear blebs
          - is also not what patient-derived human neurons show, so the node is supported but its mouse
          morphology should not be assumed to transfer. Fidelity is MODERATE rather than HIGH for those
          two reasons together.
        readouts:
        - name: Neuronal nuclear membrane morphology
          target: Neuronal Nuclear Envelope Disruption
          direction: ALTERED
          interpretation: The structural lesion defining the node, restricted to neurons.
      selected_evidence:
        snippet: These observations demonstrate that neurons have a unique requirement for nuclear envelope
          localized torsinA function and suggest that loss of this activity is a key molecular event in
          the pathogenesis of DYT1 dystonia.
        supports: SUPPORT
