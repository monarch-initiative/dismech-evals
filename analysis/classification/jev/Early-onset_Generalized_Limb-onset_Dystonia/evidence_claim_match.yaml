      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous TOR1A GAG Deletion
        biological_scale: MOLECULAR
        description: A heterozygous in-frame three-base-pair deletion, c.907_909delGAG, in exon 5 of TOR1A.
          It removes one of a pair of glutamate residues from a conserved C-terminal region of torsinA
          without shifting the reading frame, so a near-full-length protein is made. More than 98% of
          affected individuals carry this same allele, which is unusual for a Mendelian disease and is
          why the entry can describe one variant rather than a spectrum.
        genetic_context:
          variant_origin: GERMLINE
          allele_type: DELETION
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
