        biological_scale: CELLULAR
        description: Loss of torsinA function produces abnormal nuclear envelope architecture that is,
          strikingly, restricted to neurons even though TOR1A is widely expressed - the classic statement
          of the tissue-specificity problem in this disease. In mouse null and homozygous knock-in neurons
          the lesion takes the form of perinuclear membrane blebs or herniations. In human patient-derived
          cholinergic motor neurons carrying the heterozygous deletion the lesion instead appears as a
          markedly thickened nuclear lamina with disrupted nuclear morphology and LMNB1 dysregulation,
          without the blebs. Both are nuclear envelope pathology; they are not the same lesion, and the
          entry does not treat the mouse morphology as established in humans. See the HUMAN_MODEL_MISMATCH
          discussion.
        biological_processes:
