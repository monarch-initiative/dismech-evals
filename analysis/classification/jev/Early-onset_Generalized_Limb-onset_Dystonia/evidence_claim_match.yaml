        biological_scale: CELLULAR
        description: 'Dorsal striatal large cholinergic interneurons have a distinctive requirement for
          torsinA during striatal maturation. In mice with conditional forebrain deletion, the emergence
          of dystonic movements coincides with selective loss of these cells, and the survivors are morphologically,
          electrophysiologically and connectionally abnormal. Cholinergic abnormalities are also present
          in postmortem striatum from DYT1 patients, which is the main piece of human tissue evidence
          anywhere in this chain. Note the terminological hazard: the mouse model shows selective degeneration
          of this one interneuron class, which is not the same as the disease being a neurodegeneration
          - the human disorder has no overt neuropathological signature.'
        cell_types:
