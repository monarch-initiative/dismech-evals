          physical therapy to that value. It reads oddly for an exercise programme, but the enum''s own
          definition of BEHAVIORAL explicitly covers a "behavioral, physical, dietary, or lifestyle intervention",
          so physical therapy is inside it by definition rather than by stretch.

          preferred_term is deliberately more specific than the bound label: the intervention as GeneReviews
          describes it is physiatry directing physical therapy, and NCIT:C15302 names only the therapy.
          The specificity is carried in preferred_term rather than by reaching for a term that does not
          mean this.'
      selected_evidence:
