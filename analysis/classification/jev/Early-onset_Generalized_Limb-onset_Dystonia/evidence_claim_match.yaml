        description: 'Patient-derived DYT1 motor neurons show impaired bidirectional traffic across the
          nuclear envelope, affecting both protein import and export and the export of mRNA. A specific
          molecular correlate has been identified: RANBP17, an importin-beta superfamily nuclear transport
          receptor, is strongly downregulated in DYT1 motor neurons, and restoring it rescues both the
          transport defect and the neurodevelopmental phenotype. That rescue is what makes this node causal
          rather than merely correlated, and it places impaired transport upstream of the developmental
          abnormality rather than beside it.'
