  94ba99cd32370ef1268f9d1a9f01782f89d935d26202c82c212df1469348d130:
    claim:
      about:
        disease:
          name: Early-onset Generalized Limb-onset Dystonia
          disease_term:
            preferred_term: DYT1 early-onset generalized limb-onset dystonia
            term:
              id: MONDO:0007492
              label: early-onset generalized limb-onset dystonia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired TorsinA AAA+ ATPase Function
        biological_scale: MOLECULAR
        description: TorsinA is an AAA+ ATPase resident in the endoplasmic reticulum lumen and the contiguous
          perinuclear space. Unlike most AAA+ proteins it lacks a complete catalytic site of its own and
          depends on the membrane cofactors LAP1 (nuclear envelope) and LULL1 (bulk ER), each of which
          supplies an arginine finger to complete the active site and trigger hydrolysis. The disease
          deletion sits in the region that mediates this regulated cycle, so the mutant protein is impaired
          in the cofactor-driven ATPase activity through which torsinA does its work. The functional readout
          that matters is not the catalytic rate in isolation but the ability to rescue nuclear envelope
          defects in torsin-deficient cells.
        molecular_functions:
        - preferred_term: cofactor-dependent torsinA ATP hydrolysis
          modifier: DECREASED
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
      selected_evidence:
        snippet: TorsinA is an essential AAA+ ATPase requiring LAP1 or LULL1 as cofactors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
