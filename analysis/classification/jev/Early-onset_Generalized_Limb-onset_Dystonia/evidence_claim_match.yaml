  205855cceb1d61ccb49bcb7c357f8dbe29d283a4458701e562c3dc7a9982d620:
    claim:
      about:
        disease:
          name: Early-onset Generalized Limb-onset Dystonia
          disease_term:
            preferred_term: DYT1 early-onset generalized limb-onset dystonia
            term:
              id: MONDO:0007492
              label: early-onset generalized limb-onset dystonia
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neurologic
        name: Limb-onset dystonia
        description: 'The presenting feature and the one the disease is named for. Dystonia begins in
          a leg or an arm, with a median onset age of 9 years. It is initially action-specific - an abnormal
          gait with foot inversion or knee flexion, or a hand posture that appears only on writing - and
          becomes present at rest as it progresses. Onset in axial, cervical or cranial regions occurs
          but is much less common, which is the clinical signature separating this entity from DYT6/THAP1
          dystonia. Pain is not prominent.

          Onset is childhood in the great majority, but not exclusively: about 5% of affected individuals
          present after age 30. That tail matters clinically because "early-onset" in the entity''s own
          name invites a late presentation being read as excluding the diagnosis, and it matters for counselling,
          because an at-risk relative who is well in their twenties is not thereby past risk.'
        phenotype_term:
          preferred_term: Limb-onset dystonia
          term:
            id: HP:0002451
            label: Limb dystonia
          onset:
            onset_category: CHILDHOOD
            notes: 'Median age of onset 9 years, interquartile range 7-12 years, with about 5% of individuals
              presenting after age 30. Only onset_category is set: the source reports a median and an
              interquartile range, and putting 9 into mean_age_years or 7/12 into min_age_years/max_age_years
              would relabel a median as a mean and quartile bounds as extremes. The numbers are kept here
              verbatim instead, and both are carried by their own evidence items on this phenotype.'
      selected_evidence:
        snippet: Dystonia typically begins in a leg or arm. While onset can occur in axial, cervical,
          or cranial regions, these are far less common than onset in a limb.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/0
      evidence_path: /phenotypes/0/evidence/0
