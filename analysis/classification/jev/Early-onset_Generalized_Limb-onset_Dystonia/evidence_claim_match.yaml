        description: 'Tailored exercise programmes, adaptive aids and gait support, directed by physical
          medicine and rehabilitation. Its purpose here is specific and worth stating precisely: it does
          not treat the dystonia, it treats what sustained dystonic posturing does to the musculoskeletal
          system. That makes it the one intervention in this entry aimed at the secondary complications
          - contracture, hip displacement, spinal deformity - rather than at the movement disorder, which
          is also why it runs alongside pallidal stimulation rather than competing with it.

          Note the direction of the contrast with the environmental record in this entry: the rehabilitation
          pathway is active exercise and adaptation, whereas immobilizing a dystonic part can worsen the
          dystonia.'
