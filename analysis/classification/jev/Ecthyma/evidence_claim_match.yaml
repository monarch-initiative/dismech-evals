      assertion_type: Transmission
      assertion:
        name: Close-Contact and Fomite Spread
        description: Because ecthyma is the deeper ulcerative form of impetigo, bacteria from impetigo-spectrum
          skin lesions can spread through close contact and contaminated personal objects to seed breached
          epidermis in close contacts or at new excoriated sites.
      selected_evidence:
        snippet: Reducing the spread and recurrence of impetigo includes good hand hygiene, thoroughly
          washing objects used by people with impetigo, and refraining from returning to work or school
          until 12 to 24 hours after initiating antibiotic treatment or clinical improvement occurs.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /transmission/0
      evidence_path: /transmission/0/evidence/0
      context_paths:
