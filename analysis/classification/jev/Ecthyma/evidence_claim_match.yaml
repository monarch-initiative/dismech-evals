    evidence_metadata:
      reference: PMID:41839109
      reference_title: 'Impetigo: Rapid Evidence Review.'
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      explanation: This review is about impetigo, not ecthyma. Its spread-control advice (hand hygiene,
        washing shared objects, exclusion until treated) implies contact and fomite spread of impetigo;
        the route is extended to ecthyma here because the same organisms cause both and ecthyma is the
        deeper form of the same infection.
