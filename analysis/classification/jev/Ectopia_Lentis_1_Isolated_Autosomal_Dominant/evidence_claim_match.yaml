      assertion_type: DifferentialDiagnosis
      assertion:
        name: Marfan syndrome
        description: The same gene and the same ocular lesion. Under the revised Ghent nosology an FBN1
          carrier with ectopia lentis is diagnosed with Marfan syndrome once aortic root dilation or dissection
          is present, or once the variant has been reported with aortic disease; the isolated diagnosis
          applies only on the ectopia lentis syndrome side of that line.
        disease_term:
          preferred_term: Marfan syndrome
          term:
            id: MONDO:0007947
            label: Marfan syndrome
        distinguishing_features:
        - Aortic root dilation or dissection, the second cardinal Ghent feature
        - An FBN1 variant previously reported with aortic dilation or dissection
        - A systemic score reaching the Ghent threshold
      selected_evidence:
        snippet: aortic root aneurysm and ectopia lentis are the cardinal clinical features
        supports: SUPPORT
