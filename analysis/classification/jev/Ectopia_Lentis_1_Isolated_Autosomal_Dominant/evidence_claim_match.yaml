            term:
              id: MONDO:0007514
              label: ectopia lentis 1, isolated, autosomal dominant
        context: []
      assertion_type: Genetic
      assertion:
        name: FBN1
        gene_term:
          preferred_term: FBN1
          term:
            id: hgnc:3603
            label: FBN1
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: 'FBN1 is the defining gene of this entry. Within ectopia lentis as a whole it is the predominant
          cause: FBN1 variants explained 23 of 36 probands with ectopia lentis who did not meet the Ghent
          criteria for Marfan syndrome in a British series (PMID:20564469), and 97.4% of 156 Chinese ectopia
          lentis families (PMID:38190127, a cohort not restricted to non-syndromic cases). Reported isolated-ectopia-lentis
          variants are mostly missense changes that introduce or remove a cysteine; truncating variants
          have not been found in the isolated phenotype (PMID:19353630). Splice variants causing in-frame
          skipping of exon 11 (the hinge region) also cause it (PMID:39939800). No ClinGen gene-disease
          validity classification exists for FBN1 and this MONDO disease, so gene_disease_validity is
          left empty.'
      selected_evidence:
        snippet: Causative FBN1 mutations were identified in 23/36 (64%) of probands while homozygous
          or compound heterozygous ADAMTSL4 mutations were identified in 6/12 (50%) of the remaining probands.
        supports: SUPPORT
    origin:
