  598dc174f05797256b9c7c45c70796705d13a7b521696a9a0e0e99cedd7912b9:
    claim:
      about:
        disease:
          name: Ectopic Pregnancy
          disease_term:
            preferred_term: ectopic pregnancy
            term:
              id: MONDO:0000755
              label: ectopic pregnancy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ep_no_animal_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Can any non-primate animal model reproduce tubal ectopic pregnancy, or is the human mechanism
          only ever approachable through descriptive human tissue studies?

          '
        attaches_to:
        - pathophysiology#Tubal Implantation Without Decidual Investment
        - pathophysiology#Endocannabinoid Tone Dysregulation
        rationale: 'This is a mismatch of the strongest kind: the endpoint itself does not occur in the
          model. Tubal ectopic pregnancy appears restricted to primates, and the mouse CB1 work, which
          is the most rigorous causal evidence in the field, produces oviductal embryo retention and pregnancy
          failure rather than tubal implantation. The likely reason is evolutionary. Deeply invasive haemochorial
          placentation combined with spontaneous decidualization is a primate specialisation, so in most
          mammals a retained embryo simply fails instead of implanting ectopically. The consequence for
          the knowledge base is concrete: the retention arm of this pathograph has causal model evidence,
          while the implantation and rupture arms rest on human observational and ex vivo data only, and
          the field''s own review describes the aetiological literature as mostly descriptive.

          '
        proposed_experiments:
        - experiment_id: ep_primate_or_organoid_model
          name: Primate or tubal-organoid model of ectopic implantation
          description: 'Establish an implantation-competent model of the human tubal-trophoblast interface,
            either in a non-human primate or in a fallopian tube organoid co-cultured with trophoblast
            organoids, and test whether the receptivity manipulations implicated in humans, namely raised
            PROKR1 or PROKR2 and altered MUC1 barrier function, are sufficient to convert retention into
            attachment and invasion.

            '
          experiment_type:
            preferred_term: organoid co-culture and non-human primate implantation assay
          would_support:
          - pathophysiology#Aberrant Tubal Receptivity
          - pathophysiology#Tubal Implantation Without Decidual Investment
      selected_evidence:
        snippet: While abdominal pregnancy has been described in both human and animal species, tubal
          ectopic pregnancies would appear to be restricted to primates.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
