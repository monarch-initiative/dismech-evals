      assertion:
        name: Tubal
        display_name: Tubal ectopic pregnancy
        description: 'Implantation within the fallopian tube, the overwhelmingly dominant site and the
          form responsible for most ectopic-pregnancy mortality. Subdivided by tubal segment: ampullary
          (most common), isthmic, and fimbrial. Isthmic implantation invades the wall earlier and more
          deeply, and therefore ruptures sooner.

          '
        subtype_term:
          preferred_term: tubal pregnancy
          term:
            id: MONDO:0043762
            label: tubal pregnancy
      selected_evidence:
        snippet: EP sites were interstitial (2.4%), isthmic (12.0%), ampullary (70.0%), fimbrial (11.1%),
          ovarian (3.2%) or abdominal (1.3%).
        supports: SUPPORT
