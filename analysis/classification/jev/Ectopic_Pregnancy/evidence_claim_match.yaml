      assertion_type: Discussion
      assertion:
        discussion_id: ep_genetic_ancestry_limitation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Do the MUC1 and chromosome 10 susceptibility signals for ectopic pregnancy replicate
          outside European-ancestry populations, and do paternal or fetal genomes contribute?

          '
        attaches_to:
        - pathophysiology#Aberrant Tubal Receptivity
        rationale: 'The only large genome-wide association meta-analysis of ectopic pregnancy draws on
          European-ancestry biobanks and captured maternal genomes only. Since implantation is a two-genome
          event, restricting analysis to the maternal side leaves an entire plausible axis of susceptibility
          unexamined, and the chromosome 10 locus still has no assigned gene. This gap is worth recording
          because ectopic pregnancy mortality falls disproportionately on populations that the genetic
          data do not represent.

          '
      selected_evidence:
        snippet: The main limitation is that the findings are based on European-based ancestry populations,
          with limited data on other populations, and we only captured maternal genomes.
        supports: SUPPORT
