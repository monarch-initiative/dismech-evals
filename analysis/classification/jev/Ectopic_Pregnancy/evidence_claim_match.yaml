      assertion_type: Discussion
      assertion:
        discussion_id: ep_mortality_disparity
        kind: OPEN_QUESTION
        status: OPEN
        prompt: 'What drives the persistent racial and age disparities in ectopic pregnancy mortality
          despite a large overall decline in deaths?

          '
        attaches_to:
        - pathophysiology#Hypovolaemic Shock
        rationale: 'United States national data show ectopic pregnancy mortality falling by more than
          half between the early 1980s and the mid 2000s, yet the mortality ratio remained several times
          higher for African American women and for women over 35. Because the decline was driven largely
          by earlier diagnosis through ultrasound and serial hCG in early pregnancy assessment services,
          the residual disparity is plausibly a question of access to those services rather than of tubal
          biology. Distinguishing an access explanation from a biological one matters for where prevention
          effort should go.

          '
      selected_evidence:
        snippet: The ectopic pregnancy mortality ratio was 6.8 times higher for African Americans than
          whites and 3.5 times higher for women older than 35 years than those younger than 25 years during
          2003-2007.
        supports: SUPPORT
