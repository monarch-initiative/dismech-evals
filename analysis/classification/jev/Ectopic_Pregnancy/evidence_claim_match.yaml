      assertion_type: Pathophysiology
      assertion:
        name: Cigarette Smoke Exposure
        biological_scale: MOLECULAR
        description: 'Smoking is a dose-dependent risk factor for ectopic pregnancy with a defined receptor-level
          mechanism. The nicotine metabolite cotinine acts on nicotinic acetylcholine receptor alpha-7
          in tubal epithelium to raise PROKR1 expression. Because prokineticin signalling regulates both
          angiogenesis and smooth muscle contractility, this single axis touches both the receptivity
          and the transport arm.

          '
        biological_processes:
        - preferred_term: G protein-coupled receptor signaling pathway
          term:
            id: GO:0007186
            label: G protein-coupled receptor signaling pathway
          modifier: DYSREGULATED
        genes:
        - preferred_term: CHRNA7
          term:
            id: hgnc:1960
            label: CHRNA7
        - preferred_term: PROKR1
          term:
            id: hgnc:4524
            label: PROKR1
      selected_evidence:
        snippet: PROKR1 transcription was higher in FTs from smokers (P<0.01).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
