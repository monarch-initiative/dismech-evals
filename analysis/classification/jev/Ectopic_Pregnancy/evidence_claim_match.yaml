            term:
              id: MONDO:0000755
              label: ectopic pregnancy
        context: []
      assertion_type: Treatment
      assertion:
        name: Methotrexate
        description: 'Systemic antifolate that inhibits dihydrofolate reductase and arrests rapidly dividing
          trophoblast. First-line medical management for the haemodynamically stable patient with an unruptured
          ectopic pregnancy, acceptable hCG, and reliable follow-up. Given as single-dose, two-dose, or
          multi-dose regimens; meta-analysis favours the two-dose protocol over single-dose. Contraindicated
          in haemodynamic instability, rupture, and hepatic, renal, or haematological impairment. Patients
          must be counselled about separation pain, a transient increase in pain that is easily mistaken
          for rupture.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: methotrexate
            term:
              id: CHEBI:44185
              label: methotrexate
        notes: 'The efficacy of medical management has come under renewed scrutiny; roughly a third of
          medically managed patients still require rescue surgery.

          '
      selected_evidence:
        snippet: Once diagnosed, ectopic pregnancy can be managed expectantly, treated medically with
          methotrexate or managed surgically.
        supports: SUPPORT
    origin:
