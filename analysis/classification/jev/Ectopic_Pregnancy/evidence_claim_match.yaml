      assertion:
        name: Endocannabinoid Tone Dysregulation
        biological_scale: MOLECULAR
        description: 'Basal endocannabinoid signalling through CB1, acting together with beta-adrenergic
          receptors in the oviductal muscularis, coordinates the smooth muscle contraction and relaxation
          that moves the embryo. Silencing CB1 in mice retains embryos in the oviduct, and CB1 transcript
          is low in fallopian tube from women with ectopic pregnancy. The causal arm of this evidence
          is murine; the human arm is correlative, and a candidate CNR1 polymorphism did not reach significance.

          '
        genes:
        - preferred_term: CNR1
          term:
            id: hgnc:2159
            label: CNR1
        cell_types:
        - preferred_term: fallopian tube smooth muscle cell
          term:
