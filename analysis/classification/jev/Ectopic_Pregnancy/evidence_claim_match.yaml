      assertion_type: Subtype
      assertion:
        name: Caesarean scar
        display_name: Caesarean scar ectopic pregnancy
        description: 'Implantation into the fibrous defect of a previous caesarean hysterotomy scar. Part
          of the emerging "uterine ectopic" class, defined as implantation outside the endometrial cavity
          but within the confines of the uterus. Rising in step with caesarean delivery rates. MONDO has
          no term for this entity at time of curation, so the subtype is deliberately left without an
          ontology binding rather than forced onto an ill-fitting parent.

          '
      selected_evidence:
        snippet: In comparison to ectopic pregnancies outside the uterus, uterine ectopic pregnancies
          are more difficult to diagnose and manage, and are also associated with increased maternal morbidity,
          mortality, and adverse reproductive outcomes.
        supports: SUPPORT
