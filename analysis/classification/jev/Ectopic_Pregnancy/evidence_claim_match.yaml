            label: fallopian tube smooth muscle cell
        biological_processes:
        - preferred_term: smooth muscle contraction
          term:
            id: GO:0006939
            label: smooth muscle contraction
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Here we show that genetic or pharmacologic silencing of cannabinoid receptor CB1 causes
          retention of a large number of embryos in the mouse oviduct, eventually leading to pregnancy
          failure.
        supports: SUPPORT
