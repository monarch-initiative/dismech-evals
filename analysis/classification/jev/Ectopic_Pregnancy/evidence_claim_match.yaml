              id: MONDO:0000755
              label: ectopic pregnancy
        context: []
      assertion_type: Genetic
      assertion:
        name: MUC1
        gene_term:
          preferred_term: MUC1
          term:
            id: hgnc:7508
            label: MUC1
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        association: 'Candidate gene for the chromosome 1 signal in the only large genome-wide association
          meta-analysis of ectopic pregnancy to date. MUC1 encodes an anti-adhesive apical epithelial
          glycoprotein whose removal from the endometrial surface is part of normal receptivity, so a
          variant altering its barrier function in tubal epithelium is a biologically coherent route to
          ectopic implantation. This is a susceptibility signal, not a causal Mendelian gene: ectopic
          pregnancy has no causative gene, no ACMG-classifiable pathogenic variants, and no clinical genetic
          testing.

          '
        notes: 'Ancestry limitation stated by the authors: findings derive from European-ancestry populations
          and maternal genomes only. The second genome-wide significant locus, on chromosome 10, has no
          confidently assigned gene and is deliberately not curated here.

          '
      selected_evidence:
        snippet: Follow-up analyses propose MUC1, which codes for an epithelial glycoprotein with an important
          role in barrier function, as the most likely candidate gene for the association on chromosome
          1.
        supports: SUPPORT
