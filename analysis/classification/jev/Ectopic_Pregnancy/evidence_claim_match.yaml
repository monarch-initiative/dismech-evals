  85078d30f01d2038a5e299c336d5eef39fbaa96ef60a45ce67b0df3b395d0963:
    claim:
      about:
        disease:
          name: Ectopic Pregnancy
          disease_term:
            preferred_term: ectopic pregnancy
            term:
              id: MONDO:0000755
              label: ectopic pregnancy
        context: []
      assertion_type: Subtype
      assertion:
        name: Abdominal
        display_name: Abdominal ectopic pregnancy
        description: 'Implantation within the peritoneal cavity, on mesentery or abdominal viscera. The
          primary form arises when a fertilised oocyte implants directly in the peritoneal cavity; a secondary
          form follows tubal or uterine rupture with expulsion of the conceptus into the abdomen. The
          distinction matters for cross-species comparison, because the abdominal ectopic pregnancies
          reported in domestic animals are almost always the secondary form.

          '
        subtype_term:
          preferred_term: abdominal ectopic pregnancy
          term:
            id: MONDO:0043759
            label: abdominal ectopic pregnancy
      selected_evidence:
        snippet: 'The latter may be subdivided into two subtypes: the primary form, when a fertilized
          oocyte enters the peritoneal cavity and becomes attached to the mesentery or abdominal viscera,
          and the secondary form, which follows the rupture of an oviduct or the uterus after the fetus
          has been implanted, and the fetus is expelled into the peritoneal cavity.'
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16595714
      reference_title: Ectopic pregnancy in animals and humans.
      evidence_source: OTHER
      explanation: 'Defines the primary and secondary forms of abdominal ectopic pregnancy, the distinction
        that governs comparative interpretation.

        '
