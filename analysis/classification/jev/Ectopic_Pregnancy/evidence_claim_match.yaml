      assertion_type: Subtype
      assertion:
        name: Interstitial
        display_name: Interstitial (cornual) ectopic pregnancy
        description: 'Implantation in the intramural segment of the fallopian tube where it traverses
          the myometrium. Rare but disproportionately dangerous: the surrounding myometrium accommodates
          more growth, so presentation is later and rupture is more catastrophic. Note that "cornual"
          and "interstitial" are used interchangeably in older literature but are not strictly synonymous
          in modern classification, where cornual properly denotes implantation in the horn of a bicornuate
          or septate uterus.

          '
        subtype_term:
          preferred_term: pregnancy, cornual
          term:
            id: MONDO:0044101
            label: pregnancy, cornual
      selected_evidence:
        snippet: EP sites were interstitial (2.4%), isthmic (12.0%), ampullary (70.0%), fimbrial (11.1%),
          ovarian (3.2%) or abdominal (1.3%).
        supports: SUPPORT
