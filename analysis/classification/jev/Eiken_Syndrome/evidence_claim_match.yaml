  c2d2b730a6ba4f44859f553ea07106bc450f0d55653c086381595219ba420b74:
    claim:
      about:
        disease:
          name: Eiken Syndrome
          disease_term:
            preferred_term: Eiken syndrome
            term:
              id: MONDO:0010803
              label: Eiken syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PTH1R Signaling Alteration
        biological_scale: MOLECULAR
        description: 'Homozygous PTH1R variants produce a receptor that is expressed and binds ligand
          but signals abnormally. The R485X truncation removes the C-terminal serine/threonine cluster
          that is phosphorylated on activation, increasing basal cAMP signaling. The E35K and Y134S extracellular-domain
          variants weaken PTHrP binding, and the I237N and D241E transmembrane-helix variants raise basal
          cAMP signaling while blunting responses to PTH and PTHrP.

          '
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: 'functional_impact_category is left unset: the reported alleles combine increased
            basal signaling with reduced ligand-induced responses, and the direction of the net effect
            depends on ligand and tissue.'
        gene:
          preferred_term: PTH1R
          term:
            id: hgnc:9608
            label: PTH1R
        molecular_functions:
        - preferred_term: PTH/PTHrP type 1 receptor activity
          modifier: DYSREGULATED
          term:
            id: GO:0004991
            label: parathyroid hormone receptor activity
      selected_evidence:
        snippet: Here, using a variety of cell-based assays, we show that R485X increases the receptor's
          basal rate of cAMP signaling and decreases its capacity to recruit β-arrestin2 upon ligand stimulation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37268817
      reference_title: Altered Signaling and Desensitization Responses in PTH1R Mutants Associated with
        Eiken Syndrome.
      evidence_source: IN_VITRO
      explanation: Cell-based assays show the C-tail truncation raises basal cAMP signaling.
