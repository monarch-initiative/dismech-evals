      assertion_type: Discussion
      assertion:
        discussion_id: kdm5a_heterozygous_mouse_vs_monoallelic_human_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why do monoallelic (de novo heterozygous or dominantly inherited) KDM5A variants cause
          syndromic intellectual disability, absent speech, and autism spectrum disorder in humans, whereas
          heterozygous Kdm5a+/- mice display normal spatial learning and memory on the Morris water maze?
        attaches_to:
        - animal_models#Kdm5a-/-
        rationale: In humans, half of the reported cohort (15/33 individuals across PMID:33350388 and
          PMID:41889174) harbor monoallelic KDM5A variants and present with severe speech impairment,
          developmental delay, intellectual disability, and ASD indistinguishable in core neurodevelopmental
          spectrum from biallelic patients. By contrast, in the mouse model characterized by El Hayek
          et al. (2020, PMID:33350388), heterozygous Kdm5a+/- littermates exhibited normal spatial learning
          and memory on the Morris water maze, and severe vocalization, sociability, repetitive behavior,
          cognitive, and dendritic morphogenesis deficits required homozygous Kdm5a-/- inactivation. This
          dosage sensitivity divergence may reflect species differences in human cortical/hippocampal
          chromatin regulation by KDM5A or variant-specific dominant/hypomorphic effects of human missense
          and PLU1-domain alleles.
      selected_evidence:
        snippet: WT and Kdm5a+/- littermates had normal learning abilities shown by the decrease in latency
          to locate the hidden platform over a period of 4 days, as well as normal memory by showing preference
          for the quadrant where the platform was during the probe test (target quadrant). However, Kdm5a-/-
          mice displayed severe disabilities in both learning and memory.
        supports: SUPPORT
