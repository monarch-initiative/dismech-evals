              label: El Hayek-Chahrour neurodevelopmental disorder
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Kdm5a-/- constitutive knockout mouse
        species: Mus musculus
        genotype: Kdm5a-/-
        background: C57BL/6J
        category: KNOCKOUT
        publication: PMID:33350388
        description: Constitutive Kdm5a knockout mice exhibit severe impairment in ultrasonic vocalizations,
          repetitive forepaw wringing and self-grooming behaviors, sociability deficits, severe disabilities
          in spatial learning and memory on the Morris water maze, reduced basal dendritic complexity
          and spine density in cortical layer II/III neurons, increased dendritic complexity and length
          in hippocampal neurons, and altered hippocampal excitatory (CA1, CA2, CA3) and inhibitory (Pvalb+,
          Sst+) neuronal subtype proportions.
        modeled_mechanisms:
        - target: Dysregulated Neurodevelopmental and Autism Risk Gene Transcription
          relationship: RECAPITULATES
          description: Hippocampal bulk RNA-seq in Kdm5a-/- mice recapitulates dysregulation of 450 genes
            enriched in neurological processes, RNA splicing, neurogenesis, and ASD risk gene homologs.
        - target: Altered Hippocampal Neuronal Subtype Identity and Accelerated Maturation
          relationship: RECAPITULATES
          description: Single-nucleus RNA-seq of Kdm5a-/- mouse hippocampi demonstrates altered proportions
            of excitatory (CA1, CA2, CA3) and inhibitory (Pvalb+, Sst+) neuronal subtypes and accelerated
            maturation trajectories.
        - target: Hippocampal Neuronal Dendritic Hyper-Arborization
          relationship: RECAPITULATES
          description: Golgi-Cox staining and Sholl analysis of Kdm5a-/- mouse hippocampal excitatory
            neurons reveal increased dendritic branching complexity (~116%) and total dendritic length
            (~67%).
        - target: Cortical Pyramidal Neuron Dendritic and Spine Hypoplasia
          relationship: RECAPITULATES
          description: Golgi-Cox staining of cortical layer II/III pyramidal neurons in Kdm5a-/- mice
            shows severe reductions in basal dendritic complexity (~67%), length (~50%), and spine density
            (~33%).
      selected_evidence:
        snippet: To validate our discovery, we generated a Kdm5a knockout mouse model (Kdm5a-/-) and confirmed
          that inactivating Kdm5a disrupts vocalization. In addition, Kdm5a-/- mice displayed repetitive
          behaviors, sociability deficits, cognitive dysfunction, and abnormal dendritic morphogenesis.
          Loss of KDM5A also resulted in dysregulation of the hippocampal transcriptome.
        supports: SUPPORT
    origin:
