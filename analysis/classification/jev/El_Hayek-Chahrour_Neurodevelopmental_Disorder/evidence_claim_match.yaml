      assertion_type: Pathophysiology
      assertion:
        name: KDM5A Loss of Function and Reduced H3K4 Demethylase Dosage
        description: Pathogenic monoallelic (de novo or inherited heterozygous) and biallelic (homozygous
          or compound heterozygous) truncating, splice-site, multi-exon deletion, and missense variants
          in KDM5A (frequently affecting the PLU1 chromatin-binding motif and the composite JmjN/JmjC
          catalytic core) cause nonsense-mediated decay, protein destabilization, or loss of enzymatic
          activity, resulting in reduced KDM5A protein levels and H3K4 demethylase dosage.
        genes:
        - preferred_term: KDM5A
          term:
            id: hgnc:9886
            label: KDM5A
        molecular_functions:
        - preferred_term: histone H3K4me/H3K4me2/H3K4me3 demethylase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0034647
            label: histone H3K4me/H3K4me2/H3K4me3 demethylase activity
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
      selected_evidence:
        snippet: We analyzed the impact of the KDM5A mutations and found that they resulted in decreased
          protein levels and in one case a truncated protein.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
