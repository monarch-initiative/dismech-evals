          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Hedgehog Signaling
          term:
            id: GO:0007224
            label: smoothened signaling pathway
        - preferred_term: Endochondral Ossification
          term:
            id: GO:0001958
            label: endochondral ossification
        - preferred_term: Limb Development
          term:
            id: GO:0060173
            label: limb development
      selected_evidence:
        snippet: Mutations in EVC or EVC2 disrupt Hh signaling in tooth and bone development.
        supports: SUPPORT
