      assertion_type: Pathophysiology
      assertion:
        name: Primary Cilium Dysfunction
        description: 'EVC and EVC2 form an interdependent complex that localizes to the EvC zone at the
          base of primary cilia, where it is anchored by the EFCAB7-IQCE tethering module and associates
          with Smoothened (SMO). Loss-of-function variants in EVC or EVC2 lose or mislocalize this ciliary-base
          complex. The defect is in complex localization within the cilium rather than in building the
          cilium; the downstream Hedgehog signalling consequences are described on the Hedgehog Signaling
          Disruption node.

          '
        genes:
        - preferred_term: EVC
          term:
            id: hgnc:3497
            label: EVC
        - preferred_term: EVC2
          term:
            id: hgnc:19747
            label: EVC2
        molecular_functions:
        - preferred_term: smoothened binding
          term:
            id: GO:0005119
            label: smoothened binding
        biological_processes:
        - preferred_term: EVC-EVC2 localization to the primary cilium
          modifier: DECREASED
          term:
            id: GO:0061512
            label: protein localization to cilium
        cellular_components:
        - preferred_term: Primary Cilium
          term:
            id: GO:0005929
            label: cilium
        - preferred_term: EvC zone at the ciliary base
          term:
            id: GO:0097546
            label: ciliary base
      selected_evidence:
        snippet: Evc and Evc2 are mutually required for localizing to primary cilia and also for maintaining
          their normal protein levels.
