      assertion_type: Pathophysiology
      assertion:
        name: Hedgehog Signaling Disruption
        description: 'EVC and EVC2 form a complex at the base of the primary cilium that is required for
          transduction of Hedgehog (Hh) signaling. The complex interacts with Smoothened (Smo) and regulates
          Gli transcription factor processing. Loss of function of either protein impairs Hh-dependent
          processes including skeletal patterning, endochondral ossification, and cardiac septation.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Hedgehog Signaling
          term:
            id: GO:0007224
            label: smoothened signaling pathway
        - preferred_term: Endochondral Ossification
          term:
            id: GO:0001958
            label: endochondral ossification
        - preferred_term: Limb Development
          term:
            id: GO:0060173
            label: limb development
      selected_evidence:
        snippet: Mutations in EVC or EVC2 disrupt Hh signaling in tooth and bone development.
        supports: SUPPORT
