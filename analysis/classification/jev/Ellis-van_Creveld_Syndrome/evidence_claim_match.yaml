      assertion:
        name: Cardiac Septation Defect
        description: 'Hedgehog signaling is required for proper atrioventricular septation. Disruption
          of EVC/EVC2-mediated Hh signaling leads to common atrium and other cardiac septal defects through
          impaired endocardial cushion development. The cardiac phenotype is strongly reminiscent of heterotaxy
          syndromes, suggesting a cilia-dependent mechanism.

          '
        biological_processes:
        - preferred_term: Heart Development
          term:
            id: GO:0007507
            label: heart development
        - preferred_term: Cardiac Septum Morphogenesis
          term:
            id: GO:0060411
            label: cardiac septum morphogenesis
      selected_evidence:
        snippet: The frequent association of these abnormalities is strongly reminiscent of the cardiac
          phenotype found in patients with heterotaxy syndromes.
        supports: SUPPORT
