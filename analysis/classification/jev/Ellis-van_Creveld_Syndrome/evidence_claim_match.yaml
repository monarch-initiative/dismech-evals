          findings (disproportionate short stature, postaxial polydactyly, chondrodysplasia, and the EvC-zone
          dental/oral findings) and confirmed by molecular genetic testing of the EVC/EVC2 ciliary Hedgehog
          genes and other short-rib/ciliopathy loci. Early echocardiography is a diagnostic priority because
