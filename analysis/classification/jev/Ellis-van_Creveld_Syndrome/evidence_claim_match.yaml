          ribs, acromesomelic limb shortening, and polydactyly, but typically lacking characteristic EvC
          common atrium, multiple labiogingival frenula, and nail/dental dysplasia.
      selected_evidence:
        snippet: Postnatally, the essential differential diagnoses include Jeune dystrophy, McKusick-Kaufman
          syndrome and Weyers syndrome.
