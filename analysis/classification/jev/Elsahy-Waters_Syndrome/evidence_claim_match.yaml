      assertion:
        name: CDH11
        gene_term:
          preferred_term: CDH11
          term:
            id: hgnc:1750
            label: CDH11
        association: Causative
        notes: CDH11 (cadherin-11 / OB-cadherin, OMIM 600023, chromosome 16q21) is the sole gene known
          to cause Elsahy-Waters syndrome. Biallelic truncating (loss-of-function) variants, such as the
          homozygous nonsense variant c.127A>T (p.Lys43*) in the first exon, abolish functional protein.
          Heterozygous missense variants in the same gene cause the allelic but phenotypically distinct
          Teebi hypertelorism syndrome (OMIM 145420).
      selected_evidence:
        snippet: Exome sequencing led to the identification of a novel homozygous nonsense variant in
          the first exon of the cadherin-11 gene (CDH11), which results in a prematurely truncated form
          of the protein.
        supports: SUPPORT
