      assertion:
        name: Partial Trisomy 11q23-qter and 22q11
        biological_scale: MOLECULAR
        description: 'The zygote carries 47 chromosomes: two normal 11s, two normal 22s, and the der(22).
          The consequence is a third copy of distal 11q and of proximal 22q. This is a contiguous-gene
          dosage lesion rather than the disruption of any one gene, and no single gene in either interval
          has been shown to account for the phenotype.'
      selected_evidence:
        snippet: The diagnosis of Emanuel syndrome is established in a proband by detection of a duplication
          of 22q10-22q11 and duplication of 11q23-qter on a supernumerary derivative chromosome 22 [der(22)].
        supports: SUPPORT
