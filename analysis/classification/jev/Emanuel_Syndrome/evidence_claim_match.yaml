              label: Emanuel syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Chromosome analysis demonstrating the supernumerary der(22)
        description: Diagnosis rests on demonstrating duplication of 22q10-22q11 together with duplication
          of 11q23-qter carried on a supernumerary derivative chromosome 22. Karyotype identifies the
          extra marker chromosome; array or FISH defines the duplicated intervals. Parental karyotyping
          follows, because in essentially every case one parent carries the balanced translocation and
          their recurrence risk and their relatives' carrier risk both depend on finding it.
        diagnosis_term:
          preferred_term: cytogenetic analysis
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: 47 chromosomes with a supernumerary der(22)t(11;22), and a balanced t(11;22)(q23;q11.2)
          in one parent.
      selected_evidence:
        snippet: The diagnosis of Emanuel syndrome is established in a proband by detection of a duplication
          of 22q10-22q11 and duplication of 11q23-qter on a supernumerary derivative chromosome 22 [der(22)].
        supports: SUPPORT
