      assertion_type: Pathophysiology
      assertion:
        name: Recurrent Constitutional t(11;22) Translocation
        biological_scale: MOLECULAR
        description: 'The reciprocal exchange produces a balanced t(11;22)(q23;q11.2) carrier. The carrier
          is phenotypically normal, because gene dosage is unchanged, and is usually identified only through
          reproductive difficulty. This node is the silent intermediate that separates the molecular lesion
          from the disease: the person who carries the rearrangement is not the person who has the syndrome.'
      selected_evidence:
        snippet: The origin of this imbalance is 3:1 malsegregation of a parental balanced translocation
          between chromosomes 11 and 22, which is the most common recurrent reciprocal translocation in
          humans.
        supports: SUPPORT
