      assertion_type: Pathophysiology
      assertion:
        name: Multisystem Developmental Disruption from Trisomic Gene Dosage
        biological_scale: ORGANISM
        description: Trisomic dosage across the two duplicated segments disrupts craniofacial, cardiac,
          renal, genital and central nervous system development, together with prenatal and postnatal
          growth. The pattern is a recognisable syndrome rather than a random collection of malformations,
          but the mapping from individual genes in the duplicated intervals to individual features is
          not established. The resulting developmental disability is static rather than progressive; morbidity
          and mortality are driven by the structural malformations and are concentrated in infancy.
      selected_evidence:
        snippet: Emanuel syndrome is characterized by pre- and postnatal growth deficiency, microcephaly,
          hypotonia, severe developmental delays, ear anomalies, preauricular tags or pits, cleft or high-arched
          palate, congenital heart defects, kidney abnormalities, and genital abnormalities in males.
        supports: SUPPORT
