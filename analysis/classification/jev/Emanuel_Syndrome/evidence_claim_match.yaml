        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 3:1 Meiotic Malsegregation Producing a Supernumerary der(22)
        biological_scale: CELLULAR
        description: In a balanced carrier the two normal chromosomes and the two derivatives pair as
          a quadrivalent at meiosis I. Tertiary trisomy arises when this segregates three-to-one, so a
          gamete receives the der(22) in addition to a complete haploid complement. Most malsegregant
          conceptuses are lost; the der(22) product is the one that is compatible with survival to term,
          which is why this particular imbalance is the one seen clinically.
      selected_evidence:
        snippet: 'possible outcomes of future pregnancies of the proband''s parents include: normal chromosomes,
          supernumerary der(22) syndrome, balanced t(11;22) carrier, and spontaneous abortion as a result
          of supernumerary der(22) or another meiotic malsegregant'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20301440
      reference_title: Emanuel Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Enumerates the segregation outcomes, including the pregnancy losses, which is what
        makes the liveborn der(22) a selected subset rather than the commonest product.
