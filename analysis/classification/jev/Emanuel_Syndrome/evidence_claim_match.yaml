        notes: Early mortality and long-term survival both occur, and the balance between them is not
          established. The largest cohort reports five deaths among 63 individuals, four of them in the
          first five months and one at 33 years, while the surviving 58 ranged from 9 months to 33 years.
          The cohort paper states plainly that the true infant mortality rate is unknown and that long-term
          survival is possible, so this section records a range of outcomes rather than a prognosis. The
          two ascertainment biases that limit the cohort are quoted here as well, because they are what
          stops these figures being read as a survival estimate.
