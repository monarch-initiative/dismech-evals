        context: []
      assertion_type: Inheritance
      assertion:
        name: Balanced parental translocation with 3:1 meiotic malsegregation
        description: Emanuel syndrome is not inherited in a Mendelian pattern. In more than 99 per cent
          of cases one parent is a phenotypically normal balanced carrier of t(11;22)(q23;q11.2), usually
          having inherited it from their own parent, and the affected child receives the der(22) as a
          supernumerary chromosome through 3:1 malsegregation at meiosis. Carriers are typically ascertained
          through recurrent miscarriage, infertility, or the birth of an affected child. The recurrence
          risk differs by which parent carries the translocation.
      selected_evidence:
        snippet: In more than 99% of cases, one of the parents of a proband with Emanuel syndrome is a
          balanced carrier of a t(11;22)(q23;q11.2) and is phenotypically normal.
        supports: SUPPORT
