              id: MONDO:0012176
              label: Emanuel syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cruciform Extrusion at Palindromic AT-rich Repeats
        biological_scale: MOLECULAR
        description: The breakpoints of the recurrent t(11;22) lie at the centre of palindromic AT-rich
          repeats on 11q23 and 22q11. Palindromic sequence of this kind can extrude cruciform secondary
          structure, and the repeat regions carry a measurably elevated rate of double-strand breakage
          in both mitotic and meiotic cells. This is the reason the same translocation arises independently
          in unrelated families instead of tracing to a single ancestral event, and it is the true upstream
          cause of the syndrome.
      selected_evidence:
        snippet: Overall, these experiments demonstrate an elevated rate of DSBs at PATRR regions, an
          indication that the structure of PATRR containing DNA may lead to increased breakage in multiple
          cellular environments.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33258468
      reference_title: Double strand breaks (DSBs) as indicators of genomic instability in PATRR-mediated
        translocations.
      evidence_source: IN_VITRO
      explanation: Supplies the measured double-strand break excess at the repeat regions, which is the
        evidence that the structure actually predisposes to breakage rather than merely being present
        at the breakpoints.
