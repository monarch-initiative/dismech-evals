          disease_term:
            preferred_term: embryonal carcinoma
            term:
              id: MONDO:0005440
              label: embryonal carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Epigenetic Regulation of the Pluripotency Driver Genes
        description: Which pluripotency driver panel a GCNIS-derived tumour expresses is set epigenetically
          rather than by mutation of the driver genes themselves. Cytosine methylation of DNA and methylation/acetylation
          of histone 3 lysines regulate expression of these drivers between the TGCT subtypes, and this
          is the layer at which embryonal carcinoma's OCT4/SOX2/LIN28/NANOG panel diverges from the OCT4/SOX17/KLF4/MYC
          panel of seminoma. It is therefore the upstream determinant of the SOX2-positive, SOX17-negative
          immunophenotype the entry uses diagnostically, and of the switch in panel that accompanies the
          seminoma-to-EC distinction.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: epigenetic regulation of gene expression
          modifier: ABNORMAL
          term:
            id: GO:0040029
            label: epigenetic regulation of gene expression
      selected_evidence:
        snippet: a seminoma subtype expresses an induced pluripotent stem cell (iPSC) panel with four
          upregulated genes, OCT4/POU5F1, SOX17, KLF4, and MYC, and embryonal carcinoma (EC) has four
          upregulated genes, OCT4/POU5F1, SOX2, LIN28, and NANOG
        supports: SUPPORT
