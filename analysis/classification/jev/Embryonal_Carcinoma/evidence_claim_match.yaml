      assertion_type: Subtype
      assertion:
        name: Non-CNS-localized EC
        display_name: Non-central nervous system-localized embryonal carcinoma
        subtype_term:
          preferred_term: non-central nervous system-localized embryonal carcinoma
          term:
            id: MONDO:0017328
            label: non-central nervous system-localized embryonal carcinoma
        description: 'Embryonal carcinoma at any site other than the central nervous system. This Orphanet-derived
          concept is defined purely by exclusion of the CNS, so it does not partition cleanly against
          its sibling subtypes here: it properly subsumes both Testicular EC (MONDO:0006446) and Ovarian
          EC (MONDO:0003581), which are the great majority of non-CNS disease. What it uniquely adds beyond
          those two gonadal subtypes are the extragonadal midline presentations outside the CNS - most
          importantly the anterior mediastinum, and less often the retroperitoneum and sacrococcygeal
          region - which are thought to arise from primordial germ cells misrouted during embryonic migration.
          Mediastinal disease in particular carries a higher rate of TP53 mutation and a worse prognosis
          than gonadal disease.'
      selected_evidence:
        snippet: Primary extragonadal malignant germ cell tumors (EMGCTs) are rare and characterized by
          the location in the midline of the body, including mediastinum, CNS, retroperitoneum and coccyx.
        supports: SUPPORT
