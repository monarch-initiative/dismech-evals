            term:
              id: MONDO:0005440
              label: embryonal carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Isochromosome 12p Formation and 12p Gain
        description: Gain of the short arm of chromosome 12, most often as an isochromosome, is the near-universal
          cytogenetic lesion of GCNIS-derived germ cell tumours including embryonal carcinoma. It is thought
          to be acquired during progression from GCNIS to invasive disease and is diagnostically useful
          for confirming germ cell origin in primary and metastatic lesions. 12p carries NANOG, KRAS,
          CCND2 and LDHB, so the gain simultaneously raises the dosage of a pluripotency factor, a mitogenic
          GTPase, a G1 cyclin and a glycolytic enzyme. Embryonal carcinoma otherwise has a strikingly
          quiet point-mutation landscape; its genomic instability is chromosomal (aneuploidy) rather than
          a mutator phenotype.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: chromosome organization
          modifier: ABNORMAL
          term:
            id: GO:0051276
            label: chromosome organization
        genes:
        - preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        - preferred_term: CCND2
          term:
            id: hgnc:1583
            label: CCND2
        - preferred_term: NANOG
          term:
            id: hgnc:20857
            label: NANOG
        - preferred_term: LDHB
          term:
            id: hgnc:6541
            label: LDHB
      selected_evidence:
        snippet: It is thought that the isochromosome 12p develops during the progression of a GCNIS to
          an invasive TGCT.
        supports: SUPPORT
    origin:
