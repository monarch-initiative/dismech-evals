        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GCNIS-Derived Germ Cell Transformation
        description: 'Post-pubertal embryonal carcinoma is a type II germ cell tumour: it develops from
          germ cell neoplasia in situ (GCNIS), a non-invasive intratubular lesion of arrested fetal germ
          cells that retains embryonic pluripotency factors. Progression from GCNIS to an invasive tumour
          is the initiating event, and the same precursor gives rise to seminoma, embryonal carcinoma,
          choriocarcinoma, yolk sac tumour and post-pubertal teratoma - which is why these histologies
          co-occur in mixed tumours.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: primordial germ cell
          term:
            id: CL:0000670
            label: primordial germ cell
        biological_processes:
        - preferred_term: cell differentiation
          modifier: ABNORMAL
          term:
            id: GO:0030154
            label: cell differentiation
        locations:
        - preferred_term: testis
          term:
            id: UBERON:0000473
            label: testis
      selected_evidence:
        snippet: Type II GCT develop from a non-invasive germ cell neoplasia in situ (GCNIS) and show
          an isochromosome 12p (i12p) or gain of 12p material as a common and characteristic molecular
          alteration.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
