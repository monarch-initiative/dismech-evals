  d287d632f320b8c710c504e0b360e879bbdc4330b04068fd4397ba1e7240bc58:
    claim:
      about:
        disease:
          name: Embryonal Carcinoma
          disease_term:
            preferred_term: embryonal carcinoma
            term:
              id: MONDO:0005440
              label: embryonal carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intact Apoptotic Apparatus with Limited DNA Repair Capacity
        description: Unlike most solid tumours, embryonal carcinoma and its sibling germ cell tumour histologies
          retain wild-type TP53 and an unusually low apoptotic threshold, while having limited capacity
          to repair platinum-induced DNA adducts. Cisplatin therefore produces persistent DNA damage in
          a cell that is primed to die, and both the death receptor (FAS/FASL) and the mitochondrial (Bax/Noxa
          versus Bcl-2) apoptotic pathways are strongly engaged. Experimentally, p53 levels move inversely
          to OCT4, SOX2 and NANOG on cisplatin exposure, tying the chemosensitivity directly to the pluripotency
          state rather than to a separate lesion.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: DNA repair
          modifier: DECREASED
          term:
            id: GO:0006281
            label: DNA repair
        - preferred_term: extrinsic apoptotic signaling pathway
          modifier: INCREASED
          term:
            id: GO:0097191
            label: extrinsic apoptotic signaling pathway
        - preferred_term: intrinsic apoptotic signaling pathway in response to DNA damage
          modifier: INCREASED
          term:
            id: GO:0008630
            label: intrinsic apoptotic signaling pathway in response to DNA damage
        genes:
        - preferred_term: TP53
          term:
            id: hgnc:11998
            label: TP53
      selected_evidence:
        snippet: metastatic testicular germ cell tumors (TGCT) are cured in over 80% of patients using
          cisplatin-based combination therapy. Published data suggest that TGCTs are sensitive to cisplatin
          due to limited DNA repair and presumably also to a propensity to undergo apoptosis
        supports: SUPPORT
