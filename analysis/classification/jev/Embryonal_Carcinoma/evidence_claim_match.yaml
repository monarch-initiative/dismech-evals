      assertion:
        name: Testicular EC
        display_name: Testicular embryonal carcinoma
        subtype_term:
          preferred_term: testicular embryonal carcinoma
          term:
            id: MONDO:0006446
            label: testicular embryonal carcinoma
        description: 'Embryonal carcinoma arising in the testis, by far the commonest site. It is a GCNIS-derived
          (type II) germ cell tumour and is usually one component of a mixed non-seminomatous germ cell
          tumour rather than a pure tumour. Diagnosis rests on high-grade embryonal-carcinoma-like nuclear
          morphology supported by an OCT3/4-positive, SOX2-positive, CD30-positive, SOX17-negative immunophenotype.
          Management follows non-seminoma pathways: radical inguinal orchiectomy, then surveillance, retroperitoneal
          lymph node dissection or cisplatin-based chemotherapy according to stage and risk.'
      selected_evidence:
        snippet: Type II GCT include seminoma, embryonal carcinoma, choriocarcinoma, postpubertal-type
          teratoma and postpubertal-type YST.
        supports: SUPPORT
