        context: []
      assertion_type: Diagnosis
      assertion:
        name: Immunohistochemical Distinction of Embryonal Carcinoma from Seminoma
        description: 'The core diagnostic problem for embryonal carcinoma is separating it from seminoma/germinoma,
          because that distinction changes management. Morphology (high-grade overlapping nuclei, glandular
          and pseudopapillary architecture) is supported by immunohistochemistry: both are OCT3/4-positive,
          but embryonal carcinoma is SOX2-positive, CD30-positive, cytokeratin-positive and SOX17-negative,
          whereas seminoma is the reverse.'
      selected_evidence:
        snippet: 'Immunohistochemical staining is optional in the following scenarios: identification
          of GCNIS, distinguishing embryonal carcinoma from seminoma, confirming presence of yolk sac
          tumor and/or choriocarcinoma'
        supports: SUPPORT
