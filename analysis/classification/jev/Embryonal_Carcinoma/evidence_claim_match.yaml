            label: embryonal carcinoma of the central nervous system
        description: Intracranial embryonal carcinoma, one of the non-germinomatous germ cell tumour (NGGCT)
          histologies. Intracranial germ cell tumours arise predominantly in the pineal and suprasellar
          regions of children and adolescents and present with raised intracranial pressure, visual disturbance
          and endocrine failure rather than a mass lesion at a gonadal site. Unlike germinoma, NGGCT requires
          intensive chemotherapy, resection of residual tumour and high-dose radiotherapy, and its prognosis
          is more guarded.
      selected_evidence:
        snippet: NGGCTs include embryonal carcinoma, yolk sac tumor, choriocarcinoma, and teratomas and
          often secrete tumor markers like alpha-fetoprotein (AFP) and beta-hCG, which guide diagnosis
          and treatment without biopsy.
