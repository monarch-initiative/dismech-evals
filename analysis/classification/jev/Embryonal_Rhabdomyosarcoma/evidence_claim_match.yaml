        notes: 'The TP53 association in ERMS is predominantly a germline predisposition rather than a
          recurrent somatic driver, and it is concentrated in the anaplastic variant. In the series below,
          every rhabdomyosarcoma arising in a TP53 germline carrier was nonalveolar and anaplastic, and
