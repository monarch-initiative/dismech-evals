          of malignancies and is neither necessary nor sufficient for this one. The predisposition syndrome
          itself is curated separately as Li-Fraumeni Syndrome, per the cancer-granularity rule that germline
          predisposition syndromes stay distinct from the somatic tumour entries they predispose to.'
