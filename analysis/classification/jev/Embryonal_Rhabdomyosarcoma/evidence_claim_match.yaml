          in all four children who had both familial pleuropulmonary blastoma and ERMS, while somatic
          DICER1 variants appeared in a small minority of sporadic ERMS tumours.

          Recorded as GERMLINE_AND_SOMATIC because both allele states are reported in that single study,
          and as RISK_FACTOR rather than CAUSATIVE for the same reason as TP53: a germline DICER1 variant
          predisposes to a spectrum of tumours and is neither necessary nor sufficient for this one. The
          predisposition syndrome itself belongs in its own entry, not here.'
