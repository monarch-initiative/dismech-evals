        snippet: RMS tumors diagnosed in 11 TP53 germline mutation carriers all exhibited nonalveolar,
          anaplastic histology as evidenced by the presence of enlarged hyperchromatic nuclei with or
          without atypical mitotic figures.
        supports: SUPPORT
