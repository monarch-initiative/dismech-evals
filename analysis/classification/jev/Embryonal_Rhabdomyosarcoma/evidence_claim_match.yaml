            term:
              id: MONDO:0009993
              label: embryonal rhabdomyosarcoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Heterozygosity at 11p15
        description: 'Loss of heterozygosity (LOH) at chromosome 11p15.5 is the hallmark genetic event
          in ERMS. This region contains the imprinted IGF2 gene, and LOH results in loss of the maternal
          allele with duplication of the paternal allele, leading to biallelic IGF2 expression and growth
          factor pathway activation. No frequency is stated here: the sources cited on this node establish
          that the lesion is characteristic and that it commonly takes the form of paternal uniparental
          disomy, but none of them reports a share of ERMS tumours carrying it.'
        genetic_context:
          variant_origin: SOMATIC
          allele_type: Loss of heterozygosity across the imprinted 11p15.5 interval
          functional_impact_category: UNKNOWN
          description: The transforming lesion is a somatic, region-level allelic loss with duplication
            of the paternal allele rather than a coding variant, so no single functional impact category
            describes it. It is recorded as the somatic event of this entry so the cell of origin derives
            from this node's cell type.
          genes:
          - preferred_term: IGF2
            term:
              id: hgnc:5466
              label: IGF2
        cell_types:
        - preferred_term: skeletal muscle myoblast
          term:
            id: CL:0000515
            label: skeletal muscle myoblast
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: Allelic losses of 11p15.5 are characteristic of embryonal RMS (eRMS), whereas an increase
          in the expression of the Igf2 gene located on 11p15.5 has regularly been observed in eRMS and
          alveolar RMS (aRMS).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
