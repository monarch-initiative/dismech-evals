        - path: /has_subtypes/1
          value:
            name: Spindle Cell Embryonal Rhabdomyosarcoma
            description: A variant with elongated spindle-shaped cells. When arising in paratesticular
              region, has excellent prognosis. Some cases harbor MYOD1 mutations.
            genes:
            - preferred_term: MYOD1
              term:
                id: hgnc:7611
                label: MYOD1
          role: subtype
      assertion_type: Genetic
      assertion:
        name: MYOD1 p.Leu122Arg neomorphic mutation
        association: Oncogenic Driver Mutation defining a poor-outcome ERMS subset
        relationship_type: SOMATIC_DRIVER
        variant_origin: SOMATIC
        subtype: Spindle Cell Embryonal Rhabdomyosarcoma
        gene_term:
          preferred_term: MYOD1
          term:
            id: hgnc:7611
            label: MYOD1
        notes: 'A single recurrent somatic substitution, p.Leu122Arg, in the basic domain of the myogenic
          transcription factor MYOD1. It is neomorphic rather than a simple loss: the substituted residue
          is the one that differs between the myogenic and the MYC-family bHLH factors, so the mutant
          both blocks wild-type MYOD1 function and binds MYC consensus sites - a switch from differentiation
          to proliferation. The tumours are frequently spindle-cell in morphology, which is why this entry
          keys the record to that subtype, and they co-occur with PI3K-AKT pathway mutations.'
        case_fractions:
        - population: ERMS tumours genotyped for MYOD1 Leu122Arg (Kohsaka et al.)
          case_fraction_percent: 10.0
          cohort_size: 104
          notes: 10 of 104 ERMS carried the p.Leu122Arg substitution.
      selected_evidence:
        snippet: Here we report the discovery, through whole-exome sequencing, of a recurrent somatic
          mutation encoding p.Leu122Arg in the myogenic transcription factor MYOD1 in a distinct subset
          of ERMS tumors with poor outcomes that also often contain mutations altering PI3K-AKT pathway
          components.
        supports: SUPPORT
    origin:
