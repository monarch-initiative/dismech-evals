              id: MONDO:0009993
              label: embryonal rhabdomyosarcoma
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC22A18 (SLC67A1)
        association: Reported 11p15.5 candidate, not supported as an ERMS driver
        relationship_type: DISPUTED
        variant_origin: SOMATIC
        gene_term:
          preferred_term: SLC67A1
          term:
            id: hgnc:10964
            label: SLC22A18
        notes: 'Recorded here because MONDO asserts this gene as the somatic-mutation basis of embryonal
          rhabdomyosarcoma - `MONDO:0009993 RO:0004004 HGNC:10964` - and a reader comparing dismech with
          MONDO should find the claim addressed rather than absent. It is graded DISPUTED after investigation.

          What the assertion rests on is a single point mutation in a single rhabdomyosarcoma cell line,
          TE125-T, reported in 1998 in a paper whose subject was the transcriptional map of a 170 kb interval
          at 11p15.5 and whose own conclusion was the hedged "BWR1A may play a role in tumorigenesis".
          The same paper reports one further alteration, in a breast cancer cell line. There is no patient
          tumour series, no recurrence, and no functional demonstration in rhabdomyosarcoma.

          Two further considerations argue against reading it as a driver. The gene lies inside the 11p15.5
          imprinted interval whose loss of heterozygosity is the hallmark somatic event of ERMS, so any
          alteration found there is a candidate for being a passenger of the regional lesion the entry
          already models. And the comprehensive rhabdomyosarcoma sequencing study of 147 tumour/normal
          pairs names NRAS, KRAS, HRAS, FGFR4, PIK3CA, CTNNB1, FBXW7 and BCOR as the recurrently altered
          genes; this gene is not among them.

          Nomenclature note: HGNC renamed this gene from SLC22A18 to SLC67A1, which is why MONDO''s axiom
          prints the newer symbol. The OBO build this repository validates against still carries SLC22A18,
          so `term.label` holds that value while `preferred_term` records the current HGNC symbol.'
      selected_evidence:
        snippet: These results indicate that BWR1A may play a role in tumorigenesis.
        supports: SUPPORT
