        name: Cardiac Conduction Disease and Arrhythmogenesis
        description: Cardiac involvement is the principal determinant of morbidity and mortality in EDMD.
          Nuclear-envelope dysfunction in atrial and conduction-system cardiomyocytes produces an atrial
          myopathy with progressive conduction disease (AV block, sinus node dysfunction), atrial arrhythmia
          (atrial fibrillation/flutter), and atrial standstill, with attendant thromboembolic risk. EMD
          and especially LMNA variants additionally confer a high risk of malignant ventricular arrhythmia
          and progression to dilated cardiomyopathy, end-stage heart failure, and sudden cardiac death.
          Pacing alone does not prevent sudden death from ventricular arrhythmia, so ICD therapy is often
          required.
        genes:
