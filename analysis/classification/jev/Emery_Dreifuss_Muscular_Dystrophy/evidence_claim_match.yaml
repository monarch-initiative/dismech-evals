              label: Emery-Dreifuss muscular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nuclear Envelope and LINC Complex Dysfunction
        description: EDMD is caused by loss or dysfunction of nuclear-envelope proteins (emerin, lamin
          A/C) and LINC-complex components (nesprins, SUN proteins, LUMA) that physically couple the nucleoskeleton
          to the cytoskeleton. These proteins form an interacting network spanning the nuclear lamina,
          inner nuclear membrane, and outer nuclear membrane. Pathogenic variants disrupt nesprin/emerin/lamin
          binding, mislocalize emerin and SUN2, and compromise nuclear envelope integrity, which is the
          upstream defect common across all EDMD subtypes.
        cell_types:
        - preferred_term: skeletal muscle myoblast
          term:
            id: CL:0000056
            label: myoblast
        cellular_components:
        - preferred_term: nuclear envelope
          term:
            id: GO:0005635
            label: nuclear envelope
        - preferred_term: nuclear lamina
          term:
            id: GO:0005652
            label: nuclear lamina
        - preferred_term: inner nuclear membrane
          term:
            id: GO:0005637
            label: nuclear inner membrane
        biological_processes:
        - preferred_term: nuclear envelope organization
          term:
            id: GO:0006998
            label: nuclear envelope organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: diminished nuclear envelope localization of nesprins and impaired nesprin/emerin/lamin
          binding interactions were common features of all EDMD patient fibroblasts.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17761684
      reference_title: Nesprin-1 and -2 are involved in the pathogenesis of Emery Dreifuss muscular dystrophy
