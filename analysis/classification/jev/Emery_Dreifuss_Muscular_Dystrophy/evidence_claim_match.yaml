        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mechanical-Stress-Induced Nuclear Damage and DNA Damage Response
        description: Mechanically fragile EDMD nuclei accumulate damage under physiologic strain, including
          stretch-induced DNA damage and activation of DNA-damage responses (e.g., gamma-H2A.X foci, p53
          signaling). Muscle-specific loss of the nuclear-envelope protein NET39 in mice recapitulates
          EDMD-like muscle wasting with abnormal myonuclei and DNA damage, and renders myoblasts hypersensitive
          to mechanical stretch, establishing a mechanical-stress to DNA-damage axis as a contributor
          to muscle degeneration.
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: DNA damage response
          term:
            id: GO:0006974
            label: DNA damage response
          modifier: INCREASED
      selected_evidence:
        snippet: cKO mice recapitulated key skeletal muscle features of EDMD, including muscle wasting,
          impaired muscle contractility, abnormal myonuclear morphology, and DNA damage. The loss of Net39
          rendered myoblasts hypersensitive to mechanical stretch, resulting in stretch-induced DNA damage.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37395273
      reference_title: Net39 protects muscle nuclei from mechanical stress during the pathogenesis of
