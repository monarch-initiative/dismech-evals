  7bc94be1a24d800a564f6e72b23d861017d1e11239f9cea7480aba96f60a82de:
    claim:
      about:
        disease:
          name: Emery-Dreifuss Muscular Dystrophy
          disease_term:
            preferred_term: Emery-Dreifuss muscular dystrophy
            term:
              id: MONDO:0016830
              label: Emery-Dreifuss muscular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mechanotransduction and Nuclear Mechanical Fragility
        description: Striated muscle nuclei are continuously exposed to mechanical strain. A functional
          nuclear envelope / LINC complex transmits and buffers these forces. In EDMD, defective nucleo-cytoskeletal
          coupling impairs mechanotransduction and renders nuclei mechanically fragile. In LMNA-mutant
          (EDMD2) myoblasts under cyclic stretch, lamin A/C fails to recruit desmin and plectin to the
          nuclear periphery and nuclei fail to reorient properly, directly linking the molecular defect
          to defective mechanosignaling.
        genes:
        - preferred_term: LMNA
          term:
            id: hgnc:6636
            label: LMNA
        cell_types:
        - preferred_term: skeletal muscle myoblast
          term:
            id: CL:0000056
            label: myoblast
        biological_processes:
        - preferred_term: cellular response to mechanical stimulus
          term:
            id: GO:0071260
            label: cellular response to mechanical stimulus
          modifier: ABNORMAL
      selected_evidence:
        snippet: in Emery-Dreifuss Muscular Dystrophy (EDMD2) myoblasts exposed to mechanical stretching,
          the recruitment of desmin and plectin to the nucleus and nuclear orientation were impaired,
          suggesting that a functional lamin A/C is crucial for the response to mechanical strain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38247853
      reference_title: Desmin and Plectin Recruitment to the Nucleus and Nuclei Orientation Are Lost in
        Emery-Dreifuss Muscular Dystrophy Myoblasts Subjected to Mechanical Stimulation.
      evidence_source: IN_VITRO
      explanation: 'Directly demonstrates impaired mechanotransduction in EDMD2 myoblasts: lamin A/C dysfunction
        prevents recruitment of cytoskeletal proteins to the nucleus and proper nuclear reorientation
