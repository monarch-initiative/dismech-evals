        description: Nuclear-envelope dysfunction alters chromatin organization and gene expression programs.
          Transcriptomic analysis of EDMD-spectrum patient myotubes across seven causal genes shows convergent
          dysregulation of fibrosis/ECM, metabolism, myogenic signaling, and splicing pathways. This maladaptive
          reprogramming drives muscle fiber degeneration with fibro-fatty remodeling in skeletal muscle
          and contributes to fibrosis and electrical instability in the heart.
        cell_types:
