  a2c591ba22a441e788e37f854cb97c5ca5404f3dec69214727231b173ebab5f6:
    claim:
      about:
        disease:
          name: Empty Nose Syndrome
          disease_term:
            term:
              id: MONDO:1060148
              label: empty nose syndrome
            preferred_term: Empty Nose Syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted nasal airflow dynamics
        description: The turbinates normally create resistance and direct laminar airflow through the
          nasal cavity. Their removal results in abnormally wide nasal passages with turbulent airflow
          patterns and paradoxical redistribution of airflow away from the inferior meatus toward the
          middle meatus, reducing mucosal wall shear stress and sensory stimulation.
        locations:
        - preferred_term: Nasal cavity
          term:
            id: UBERON:0001707
            label: nasal cavity
      selected_evidence:
        snippet: symptomatic ENS patients have paradoxical significantly less airflow in the inferior
          meatus
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1002/alr.22350
      reference_title: 'Computational fluid dynamic analysis of aggressive turbinate reductions: is it
        a culprit of empty nose syndrome?'
      evidence_source: COMPUTATIONAL
      explanation: CFD analysis demonstrates paradoxical redistribution of airflow away from the inferior
        meatus in ENS patients despite surgical enlargement of the nasal passages.
