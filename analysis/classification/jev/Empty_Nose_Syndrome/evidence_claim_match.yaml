      assertion_type: DifferentialDiagnosis
      assertion:
        name: Atrophic rhinitis
        description: Primary atrophic rhinitis shares features of nasal dryness, crusting, and widened
          nasal cavity but occurs without a history of turbinate surgery. ENS is sometimes termed iatrogenic
          atrophic rhinitis, though the pathophysiology may differ.
        distinguishing_features:
        - Secondary to iatrogenic turbinate resection rather than primary idiopathic mucosal atrophy or
          Klebsiella ozaenae infection
        - Histopathology shows largely intact respiratory epithelium with goblet cell metaplasia in ENS
          versus diffuse epithelial atrophy in primary atrophic rhinitis
        disease_term:
          term:
            id: MONDO:0005659
            label: atrophic rhinitis
          preferred_term: Atrophic rhinitis
      selected_evidence:
        snippet: The result of empty nose syndrome or iatrogenic atrophic rhinitis as a consequence of
          turbinectomy remains a controversial topic that deserves further scrutiny.
        supports: SUPPORT
