  70ede7c8784f1178607ddfa8939f775006a36c1c3e1b63123014f7d3d0ac130c:
    claim:
      about:
        disease:
          name: Empty Nose Syndrome
          disease_term:
            term:
              id: MONDO:1060148
              label: empty nose syndrome
            preferred_term: Empty Nose Syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired nasal air conditioning
        description: The nasal turbinates play a critical role in warming, humidifying, and filtering
          inspired air through their rich vascular supply and seromucinous glands. Surgical resection
          of turbinate tissue reduces the mucosal surface area and submucosal gland density available
          for conditioning inspired air, leading to mucosal dryness, crusting, and nasal discomfort. Histopathology
          demonstrates squamous metaplasia, submucosal fibrosis, and reduced submucosal gland number.
        cell_types:
        - preferred_term: Nasal serous secreting cell
          term:
            id: CL:4042016
            label: nasal serous secreting cell
        biological_processes:
        - preferred_term: Mucus secretion
          modifier: DECREASED
          term:
            id: GO:0070254
            label: mucus secretion
        locations:
        - preferred_term: Nasal cavity mucosa
          term:
            id: UBERON:0001826
            label: nasal cavity mucosa
      selected_evidence:
        snippet: Patients with ENS presented significantly more squamous metaplasia, a higher rate of
          submucosal fibrosis, and a lower submucosal gland number grading.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32125703
      reference_title: Distinct Histopathology Characteristics in Empty Nose Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Histopathological evidence directly demonstrating reduced submucosal glands and mucosal
        remodeling that impairs the capacity to warm and humidify inspired air.
