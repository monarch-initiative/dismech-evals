              label: empty nose syndrome
            preferred_term: Empty Nose Syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Turbinate tissue loss from surgical resection
        description: Surgical reduction or total resection of the nasal turbinates, most commonly the
          inferior turbinates and sometimes the middle turbinates, removes the mucosal and bony tissue
          that normally modulates nasal airflow. This can result from turbinectomy, aggressive turbinoplasty,
          or submucosal resection performed for chronic nasal obstruction or rhinitis.
        cell_types:
        - preferred_term: Nasal cavity respiratory epithelium epithelial cell
          term:
            id: CL:2000094
            label: nasal cavity respiratory epithelium epithelial cell of viscerocranial mucosa
        locations:
        - preferred_term: Inferior nasal concha
          term:
            id: UBERON:0005922
            label: inferior nasal concha
        - preferred_term: Nasal cavity mucosa
          term:
            id: UBERON:0001826
            label: nasal cavity mucosa
      selected_evidence:
        snippet: Empty nose syndrome (ENS) is a complex iatrogenic condition resulting from excessive
          inferior turbinate resection, leading to paradoxical nasal obstruction despite an objectively
          patent airway.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
