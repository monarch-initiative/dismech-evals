  e442620c60faa7c222082c0a063120aaf3642de6b51e10463cd9dfaaeb201c0a:
    claim:
      about:
        disease:
          name: Empty Nose Syndrome
          disease_term:
            term:
              id: MONDO:1060148
              label: empty nose syndrome
            preferred_term: Empty Nose Syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired mucociliary clearance
        description: Turbinate mucosa is rich in goblet cells that produce the mucus blanket essential
          for mucociliary clearance. Surgical removal of turbinate tissue reduces goblet cell density
          and disrupts the mucociliary escalator, impairing particle trapping and pathogen removal. Histopathology
          shows goblet cell metaplasia, indicating mucosal remodeling that alters normal secretory function
          and mucociliary transport.
        cell_types:
        - preferred_term: Nasal mucosa goblet cell
          term:
            id: CL:0002480
            label: nasal mucosa goblet cell
        biological_processes:
        - preferred_term: Mucociliary clearance
          modifier: DECREASED
          term:
            id: GO:0120197
            label: mucociliary clearance
        locations:
        - preferred_term: Nasal cavity mucosa
          term:
            id: UBERON:0001826
            label: nasal cavity mucosa
      selected_evidence:
        snippet: Additionally, a unique histological change called goblet cell metaplasia was found in
          the ENS group.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32125703
      reference_title: Distinct Histopathology Characteristics in Empty Nose Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies goblet cell metaplasia as a distinct histological feature of ENS, reflecting
        mucosal remodeling that disrupts normal goblet cell secretory function and mucociliary clearance.
