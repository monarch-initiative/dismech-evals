        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Trigeminal neurosensory dysfunction
        description: Loss of nasal airflow sensory feedback due to damage or downregulation of trigeminal
          cool thermoreceptors, particularly TRPM8 channels, in the remaining nasal mucosa. ENS patients
          demonstrate impaired menthol lateralization detection thresholds and significantly lower TRPM8
          immunoexpression compared to controls, indicating peripheral neurosensory dysfunction that contributes
          to paradoxical obstruction.
        cell_types:
        - preferred_term: Trigeminal sensory neuron
          term:
            id: CL:4023170
            label: trigeminal sensory neuron
        biological_processes:
        - preferred_term: Sensory perception of temperature stimulus
          modifier: DECREASED
          term:
            id: GO:0050951
            label: sensory perception of temperature stimulus
        locations:
        - preferred_term: Trigeminal ganglion
          term:
            id: UBERON:0001675
            label: trigeminal ganglion
        - preferred_term: Nasal cavity mucosa
          term:
            id: UBERON:0001826
            label: nasal cavity mucosa
      selected_evidence:
        snippet: The ENS group had a significantly lower expression level of TRPM8.
        supports: SUPPORT
