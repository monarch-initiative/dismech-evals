            term:
              id: MONDO:0014905
              label: encephalopathy due to defective mitochondrial and peroxisomal fission 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Peroxisome Maturation and Redox Imbalance
        biological_scale: CELLULAR
        description: The peroxisomal consequence is not what a peroxisomal disorder usually means. Overall
          peroxisomal biochemical function is preserved; what is lost is the compartment's import competence,
          so pre-peroxisomal membrane structures accumulate, and the intra-peroxisomal redox state and
          pH shift. Pexophagy is intact - the elongated peroxisomes are still cleared. This is a plasticity
          defect rather than an enzyme deficiency, and it is why a conventional peroxisomal biochemical
          screen would look normal.
        biological_processes:
        - preferred_term: protein import into peroxisome matrix
          modifier: DECREASED
          term:
            id: GO:0016558
            label: protein import into peroxisome matrix
        - preferred_term: peroxisomal redox homeostasis
          modifier: DYSREGULATED
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
      selected_evidence:
        snippet: Here, we show that MFF deficiency does not cause alterations to overall peroxisomal biochemical
          function. However, loss of MFF results in reduced import-competency of the peroxisomal compartment
          and leads to the accumulation of pre-peroxisomal membrane structures.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
