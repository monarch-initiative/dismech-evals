            name: MFF frameshift Bullmastiff
            species: Dog
            genotype: MFF c.471_475delinsCGCTCT, p.(Glu158Alafs*14), homozygous
            publication: PMID:36085405
            description: A naturally occurring canine disease, described as familial cerebellar ataxia
              with hydrocephalus in Bullmastiffs almost 40 years before its cause was found. Whole-genome
              sequencing identified a private homozygous MFF frameshift variant truncating 55% of the
              open reading frame, and genotyping showed perfect segregation across four affected and 70
              unaffected dogs. The authors propose renaming the canine disease mitochondrial fission encephalopathy
              by analogy with the human phenotype.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Regional Neuronal Dysfunction and Loss
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: Juvenile-onset progressive neurological disease with bilateral symmetrical focal
          brain lesions on MRI - the same kind of finding as the human Leigh-like pattern, and the closest
          organism-level match to the human encephalopathy that any model provides.
        limitations: The lesions localise to the cerebellar nuclei rather than to the basal ganglia and
          subthalamic nuclei affected in human patients, and the canine phenotype includes hydrocephalus,
          which is not part of the human disease. Onset at around 6 months is juvenile rather than first-year-of-life.
          No peroxisomal biochemistry or neuropathology has been reported in the dogs.
      selected_evidence:
        snippet: Genotypes in a cohort of four affected and 70 unaffected Bullmastiffs showed perfect
          segregation with the disease phenotype.
        supports: SUPPORT
