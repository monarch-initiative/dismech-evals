            fidelity: HIGH
            model_scale: ORGANISM
            description: Deleting the fusion gene Mfn1 completely rescues heart dysfunction, lifespan
              and respiratory chain function in the Mff-null mouse. The therapeutic target this identifies
              is rebalancing fission against fusion, not restoring fission.
