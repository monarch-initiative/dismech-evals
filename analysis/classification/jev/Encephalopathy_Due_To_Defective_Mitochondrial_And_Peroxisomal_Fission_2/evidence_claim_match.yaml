  2e95afa6ac391ef12e69543d741d12ea7c7e17cb8edef9a07f1d705430a82026:
    claim:
      about:
        disease:
          name: Encephalopathy Due To Defective Mitochondrial And Peroxisomal Fission 2
          disease_term:
            preferred_term: encephalopathy due to defective mitochondrial and peroxisomal fission 2
            term:
              id: MONDO:0014905
              label: encephalopathy due to defective mitochondrial and peroxisomal fission 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Calcium Overload and Oxidative Stress in Neurons
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: In dopaminergic neurons differentiated from dental pulp stem cells, MFF silencing
          does more than elongate mitochondria. It accelerates calcium influx from the endoplasmic reticulum
          through the IP3 receptor, and MFF co-immunoprecipitates with VDAC1, a component of the ER-mitochondrial
          calcium transport system - suggesting MFF normally restrains that flux. The resulting mitochondrial
          calcium overload drives excessive reactive oxygen species and downregulates PGC-1alpha, so mitochondrial
          biogenesis falls as well. Neurite outgrowth is impaired. This is the best available cellular
          model of the neuronal phenotype, and it identifies ROS and biogenesis as separable downstream
          targets.
        cell_types:
        - preferred_term: dopaminergic neuron
          term:
            id: CL:0000700
            label: dopaminergic neuron
        biological_processes:
        - preferred_term: mitochondrial calcium ion homeostasis
          modifier: DYSREGULATED
          term:
            id: GO:0051560
            label: mitochondrial calcium ion homeostasis
        - preferred_term: reactive oxygen species metabolic process
          modifier: INCREASED
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
      selected_evidence:
        snippet: MFF silencing also caused mitochondrial Ca2+ accumulation through accelerated Ca2+ influx
          from the endoplasmic reticulum (ER) via the inositol 1,4,5-trisphosphate receptor. Mitochondrial
          Ca2+ overload led DNs to produce excessive reactive oxygen species (ROS), and downregulated
          peroxisome proliferator-activated receptor-gamma co-activator-1 alpha (PGC-1α).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
