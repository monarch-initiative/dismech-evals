            term:
              id: MONDO:0014905
              label: encephalopathy due to defective mitochondrial and peroxisomal fission 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MFF Loss of Function
        biological_scale: MOLECULAR
        description: 'MFF is an outer-membrane protein that recruits DRP1 to the sites where mitochondria
          and peroxisomes will divide. It does not do this as a monomer: MFF is a dynamic oligomer, most
          likely a trimer, associating and dissociating through its C-terminal coiled coil, and that oligomerization
          is required for DRP1 activation. Actin filaments do not bind MFF but lower the effective MFF
          concentration roughly tenfold, so the same machinery is assembled more efficiently at the cytoskeleton.
          Disease alleles are truncating - the canine variant removes 55% of the open reading frame -
          so the receptor is absent rather than misregulated.'
        genetic_context:
          gene:
            preferred_term: MFF
            term:
              id: hgnc:24858
              label: MFF
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: DRP1 recruitment and activation at the organelle membrane
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005096
            label: GTPase activator activity
      selected_evidence:
        snippet: Here we show that Mff is an oligomer (most likely a trimer) that dynamically associates
          and disassociates through its C-terminal coiled coil, with a Kd in the range of 10 µM. Dynamic
          Mff oligomerization is required for Drp1 activation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
