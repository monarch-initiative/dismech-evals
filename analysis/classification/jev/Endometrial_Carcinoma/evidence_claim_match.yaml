            term:
              id: MONDO:0002447
              label: endometrial carcinoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Endometrial Hyperplasia without Atypia
        description: Hyperplasia lacking cytologic atypia is a common histologic result of endometrial
          sampling for postmenopausal bleeding. It shares the unopposed-estrogen proliferative mechanism
          modeled in this entry and produces a similarly thickened endometrium on transvaginal ultrasound,
          but it is not the precursor lesion that atypical hyperplasia/endometrial intraepithelial neoplasia
          is, and it is managed medically rather than oncologically.
        distinguishing_features:
        - Absence of cytologic atypia on histology separates it from atypical hyperplasia/EIN and from
          invasive carcinoma.
        - Endometrial sampling is required; sonographic thickening alone does not distinguish it from
          carcinoma.
        disease_term:
          preferred_term: endometrial hyperplasia without atypia
          term:
            id: MONDO:0006193
            label: endometrial hyperplasia without atypia
      selected_evidence:
        snippet: The most common histological pattern observed in postmenopausal women with AUB was complex
          hyperplasia without atypia (30.9%)
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/4
      evidence_path: /differential_diagnoses/4/evidence/0
      context_paths:
