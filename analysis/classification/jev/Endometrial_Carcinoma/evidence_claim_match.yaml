              than carcinoma. This makes tamoxifen the clearest case in this entry where one exposure
              produces both the malignant outcome and its commonest benign mimic.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Unopposed Estrogen Signaling
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: Tamoxifen antagonises the oestrogen receptor in breast tissue but behaves as a partial
          agonist at the endometrial receptor, so adjuvant therapy drives this node directly and without
          progestin opposition. That the resulting endometrial pathology is largely prevented by a levonorgestrel
          intrauterine system is evidence the route is the progestin-opposable oestrogenic one rather
          than a separate genotoxic effect of the drug.
      selected_evidence:
        snippet: The use of LNG-IUS reduced the incidence of endometrial hyperplasia (OR = 0.13, 95% CI
          0.03-0.58, p = 0.007).
        supports: SUPPORT
