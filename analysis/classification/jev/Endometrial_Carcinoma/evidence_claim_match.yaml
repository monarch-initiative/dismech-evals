      assertion_type: Environmental
      assertion:
        name: Tamoxifen Therapy for Breast Cancer
        chemicals:
        - tamoxifen
        notes: exposure_term is deliberately left unbound. The ECTO release pinned for this repository
          carries no tamoxifen exposure term - both ECTO:9002223 (exposure to tamoxifen) and ECTO:0900485
          (exposure to tamoxifen via ingestion) resolve on OLS but are absent from the configured sqlite:obo:ecto
          build. The nearest available term, ECTO:2000006 (exposure to estrogen modification therapy),
          is a child of ECTO:2000005 (exposure to hormone replacement therapy) and would misclassify adjuvant
          anti-oestrogen cancer therapy as hormone replacement, so it was rejected. Revisit when the ECTO
          build is refreshed.
        description: Adjuvant tamoxifen for oestrogen-receptor-positive breast cancer raises endometrial
          carcinoma risk. It also produces a wide spectrum of benign endometrial change - polyps, hyperplasia,
          a proliferative endometrium and increased sonographic thickness - so a thickened endometrial
          stripe in a tamoxifen-treated patient reflects benign drug effect far more often than carcinoma.
          This makes tamoxifen the clearest case in this entry where one exposure produces both the malignant
          outcome and its commonest benign mimic.
      selected_evidence:
        snippet: Tamoxifen was associated with higher risk of endometrial cancer and cataracts compared
          with placebo.
        supports: SUPPORT
