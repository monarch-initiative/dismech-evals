    evidence_metadata:
      reference: PMID:28586596
      reference_title: Histological Pattern Of Endometrial Samples In Postmenopausal Women With Abnormal
        Uterine Bleeding.
      evidence_source: HUMAN_CLINICAL
      explanation: In this single-centre postmenopausal abnormal-bleeding cohort, hyperplasia without
        atypia was the most frequent histologic result, supporting it as a benign diagnosis that competes
        with carcinoma in the presentation leading to endometrial sampling. The share is cohort-dependent
        and is lower in series that report hyperplasia and carcinoma together as under 10% of cases.
