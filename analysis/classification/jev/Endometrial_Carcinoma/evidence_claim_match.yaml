        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Endometrial Polyp
        description: A benign focal overgrowth of endometrial glands and stroma. Polyps are among the
          commonest causes of postmenopausal bleeding and of a thickened or focally irregular endometrial
          stripe, so they compete with carcinoma for the same presenting findings. A minority harbor hyperplasia
          or carcinoma, which is why the distinction is made histologically rather than sonographically.
        distinguishing_features:
        - Focal, well-demarcated intracavitary lesion on saline infusion sonography or hysteroscopy, rather
          than diffuse endometrial thickening.
        - Benign glandular and stromal histology on polypectomy specimen, with no invasion.
        disease_term:
          preferred_term: endometrial polyp
          term:
            id: MONDO:0006195
            label: endometrial polyp
      selected_evidence:
        snippet: The most common etiology of PMB is vaginal or endometrial atrophy and endometrial polyps,
          while endometrial hyperplasia and carcinoma account for less than 10% of PMB.
        supports: SUPPORT
