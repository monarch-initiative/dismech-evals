          name: Endometrial Carcinoma
          disease_term:
            preferred_term: endometrial carcinoma
            term:
              id: MONDO:0002447
              label: endometrial carcinoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Endometrial Atrophy
        description: Thinning and inactivity of the postmenopausal endometrium, which bleeds from fragile
          surface vessels. It is among the leading causes of postmenopausal bleeding and so is a frequent
          benign alternative to carcinoma in women presenting with this entry's cardinal symptom. Note
          that atrophy is the opposite of a thickened endometrium, so it is separated from carcinoma by
          endometrial thickness in the direction opposite to hyperplasia and polyps.
        distinguishing_features:
        - Thin endometrial stripe on transvaginal ultrasound, in contrast to the thickened endometrium
          typical of carcinoma.
        - Inactive or atrophic glands without proliferation, hyperplasia, or invasion on sampling.
        notes: No MONDO term for human endometrial atrophy was available at curation time - the only close
          match, MONDO:1016756, is scoped to non-human animals - so disease_term is deliberately left
          unbound rather than bound to an inappropriate term.
      selected_evidence:
        snippet: The most common etiology of PMB is vaginal or endometrial atrophy and endometrial polyps,
          while endometrial hyperplasia and carcinoma account for less than 10% of PMB.
        supports: SUPPORT
