  a1e176c49a8d0099709c3f58949ffa6de278b4baca6e29837d4d9ea498d704ff:
    claim:
      about:
        disease:
          name: Endometriosis
          disease_term:
            preferred_term: endometriosis
            term:
              id: MONDO:0005133
              label: endometriosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_endometriosis_neuroimmune_circuit_subtype_scope
        prompt: Does the neuroimmune nociceptor-sensitization circuit operate across all endometriosis
          subtypes, or is it largely confined to peritoneal and deep infiltrating lesions while ovarian
          endometriomas generate pain by a different route?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Lesion-Peritoneal Neuroangiogenesis
        - pathophysiology#Peripheral Nociceptor Sensitization
        - mechanistic_hypotheses#neuroimmune_pain_sensitization_model
        rationale: Transcriptomic comparison separates the two commonest lesion types into an immune-active
          peritoneal niche and a fibromuscular ovarian one, which invites the conclusion that a chemokine
          and macrophage driven pain circuit should be a peritoneal and deep infiltrating phenomenon.
          That conclusion is not yet earned. The transcriptomic work carries no nerve fibre, neurotrophin,
          or nociceptive ion-channel readout at all, so it cannot locate the pain circuit; and the one
          study that measured nociplastic pain features specifically in ovarian endometriosis found them
          common there. Until neurotrophin and ion-channel expression is profiled across matched subtypes
          in the same patients, the entry models one circuit for the disease and records the subtype question
          here rather than restricting the hypothesis to a subset of lesions. The answer decides whether
          pain-directed therapy should be selected by lesion type.
        proposed_experiments:
        - experiment_id: exp_endometriosis_subtype_matched_neurotrophin_channel_profiling
          name: Subtype-matched neurotrophin and nociceptive ion-channel profiling
          description: In patients carrying concurrent peritoneal, ovarian, and deep infiltrating lesions,
            profile matched specimens from the same individual for nerve fibre density, neurotrophin and
            neurotrophin-receptor expression, and nociceptive ion-channel expression, alongside per-site
            pain mapping and quantitative sensory testing. Sampling within patients removes the between-patient
            confounding that makes cross-cohort subtype comparisons uninterpretable.
          experiment_type:
            preferred_term: cross-sectional within-patient comparative tissue study
          would_support:
          - pathophysiology#Peripheral Nociceptor Sensitization
          - mechanistic_hypotheses#neuroimmune_pain_sensitization_model
          would_refute:
          - mechanistic_hypotheses#neuroimmune_pain_sensitization_model
          supporting_outcome:
          - Innervation density, neurotrophin signaling, and nociceptive channel expression are elevated
            in every symptomatic lesion type relative to unaffected peritoneum, supporting one shared
            circuit whose strength varies quantitatively rather than a subtype-restricted mechanism.
          refuting_outcome:
          - Ovarian endometriomas show no elevation of innervation, neurotrophin, or nociceptive channel
            measures despite comparable reported pain, which would mean ovarian pain is generated by a
            route the current pathograph does not model and the hypothesis needs an explicit subtype scope.
          decision_criterion: Consistent within-patient elevation across lesion types keeps a single circuit;
            a reproducible ovarian null alongside preserved pain forces a separate mechanism for that
            subtype.
      selected_evidence:
        snippet: Our single-cell atlas revealed fundamentally distinct cellular ecosystems. EcP was enriched
          for CCL19 + perivascular cells (6.4-fold vs. control) and immune-active niches, whereas EcO
          exhibited pronounced smooth muscle differentiation and NNMT upregulation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
