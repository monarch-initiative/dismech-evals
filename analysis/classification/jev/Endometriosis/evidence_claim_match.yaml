        description: 'Endometriotic lesions produce their own estrogen via aromatase and are highly estrogen-responsive.
          Progesterone resistance impairs normal tissue regression.

          '
        biological_processes:
        - preferred_term: Estrogen Response
          term:
            id: GO:0043627
            label: response to estrogen
      selected_evidence:
        snippet: Estrogen is the most important known factor that stimulates the growth of endometriosis.
          Estrogen delivery to endometriotic implants was classically viewed to be only via the circulating
          blood in an endocrine fashion. We recently uncovered an autocrine positive feedback mechanism,
          which favored the continuous production of estrogen and prostaglandin (PG)E2 in the endometriotic
          stromal cells.
        supports: SUPPORT
