        biological_processes:
        - preferred_term: Response to progesterone
          modifier: DECREASED
          term:
            id: GO:0032570
            label: response to progesterone
      selected_evidence:
        snippet: The end result is deficient metabolism of E2 in endometriosis giving rise to high local
          concentrations of this local mitogen.
        supports: SUPPORT
