    evidence_metadata:
      reference: PMID:42010552
      reference_title: Integrated single-cell and spatial transcriptomics reveal divergent immunological
        and stromal programs in peritoneal versus ovarian endometriosis.
      evidence_source: COMPUTATIONAL
      explanation: 'Establishes that the immune microenvironment differs sharply between peritoneal and
        ovarian lesions, which is the premise of the gap. It is an integrative reanalysis of previously
        published transcriptomes and reports no neural or nociceptive measurement, so it raises the subtype
        question without answering it.

        '
