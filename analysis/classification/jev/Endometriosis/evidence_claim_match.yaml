  e0895dd9810cd38b2ab6b5381e00cb7bff3ef9ee7fd7ea608459aa5a828415ee:
    claim:
      about:
        disease:
          name: Endometriosis
          disease_term:
            preferred_term: endometriosis
            term:
              id: MONDO:0005133
              label: endometriosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: neuroimmune_pain_sensitization_model
        hypothesis_label: Neuroimmune Nociceptor-Sensitization Model
        status: EMERGING
        description: 'Endometriosis-associated pain is driven by lesion- and peritoneal microenvironment
          signals that promote neuroangiogenesis, peripheral nociceptor sensitization, and later central
          sensitization, so pain severity can persist or amplify independently of visible lesion burden.

          '
        notes: 'Focused hypothesis for dismech#3666. OpenScientist report kb/hypotheses/Endometriosis/neuroimmune_pain_sensitization_model/openscientist.md
          judged the model partially supported but recommended retaining EMERGING status. The model treats
          lesion burden as one input into a neuroimmune pain circuit, not as a sufficient proxy for symptom
          severity. The strongest support is for individual components (neuroangiogenesis, prolactin/nociceptor
          sensitization, central sensitization); the unresolved gap is how to weight these components
          by subtype and in an individual patient. The assessment sidecar assessments/openscientist-assessment-by-claude-opus-5.yaml
          beside that report verified its citations and promoted the layers the entry was missing: nociceptive
          ion-channel and IL-33 macrophage biology on the peripheral node, insula neurochemistry on the
          central node, and NGF as a GWAS locus here. It declined the report''s inference that the circuit
          is restricted to peritoneal and deep infiltrating disease, which is now carried as an open knowledge
          gap rather than as a scope limit on the hypothesis.'
      selected_evidence:
        snippet: Identified signals explained up to 5.01% of disease variance and regulated expression
          or methylation of genes in endometrium and blood, many of which were associated with pain perception/maintenance
          (SRP14/BMF, GDAP1, MLLT10, BSN and NGF).
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36914876
      reference_title: The genetic basis of endometriosis and comorbidity with other pain and inflammatory
        conditions.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Genetic support that is orthogonal to the tissue and imaging evidence for this model:
        risk loci from 60,674 cases act through genes involved in pain perception and maintenance, NGF
        among them. This implicates neurotrophin biology in disease susceptibility; it does not by itself
        demonstrate an NGF-to-pain causal chain in patients.

        '
