      assertion:
        name: Dysregulated Peritoneal Metalloproteinase Activity
        description: 'Endometriosis is associated with altered extracellular-matrix metalloproteinase
          activity in the peritoneal compartment. Multiplexed droplet-microfluidic protease-activity profiling
          of patient peritoneal fluid — a non-animal, microphysiological (New Approach Methodology) measurement
          platform — resolved disease-associated differences in specific metalloproteinase activities,
          in particular decreased MMP-2 and ADAM-9 activity in subjects with endometriosis versus controls.
          This describes a measured activity signature in the peritoneal microenvironment rather than
          an established causal driver of lesion establishment.

          '
        biological_processes:
        - preferred_term: Extracellular Matrix Disassembly
          term:
            id: GO:0022617
