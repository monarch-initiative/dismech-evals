              id: MONDO:0005133
              label: endometriosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Warburg-like Metabolic Reprogramming
        biological_scale: CELLULAR
        conforms_to: deregulated_cellular_energetics#Aerobic Glycolysis (Warburg Effect)
        description: 'Endometriotic lesions and the peritoneal mesothelium of women with endometriosis
          undergo a cancer-like ("Warburg") metabolic shift away from mitochondrial respiration toward
          aerobic glycolysis. TGF-beta1, which is elevated in endometriosis peritoneal fluid, drives human
          peritoneal mesothelial cells to upregulate glycolysis-associated genes (HIF1A, PDK1, LDHA, SLC2A1)
          and secrete lactate. This glycolytic phenotype — higher glycolysis, lower mitochondrial respiration,
          and reduced pyruvate dehydrogenase activity — favors lesion establishment and survival and is
          the target of the investigational metabolic therapy dichloroacetate.

          '
        cell_types:
        - preferred_term: Peritoneal Mesothelial Cell
          term:
            id: CL:0000077
            label: mesothelial cell
        biological_processes:
        - preferred_term: Aerobic Glycolysis (Warburg Effect)
          modifier: INCREASED
          term:
            id: GO:0006096
            label: glycolytic process
        - preferred_term: Response to Hypoxia
          modifier: INCREASED
          term:
            id: GO:0001666
            label: response to hypoxia
      selected_evidence:
        snippet: human peritoneal mesothelial cells (HPMCs) recovered from the pelvic peritoneum of women
          with endometriosis exhibit significantly higher glycolysis, lower mitochondrial respiration,
          decreased enzymatic activity of pyruvate dehydrogenase (PDH), and increased production of lactate
          compared to HPMCs from women without disease
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/3
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1073/pnas.1916144116
      reference_title: Repurposing dichloroacetate for the treatment of women with endometriosis
      evidence_source: IN_VITRO
      explanation: 'Primary mesothelial cells from women with endometriosis show the full Warburg-like
        signature (higher glycolysis, lower respiration, reduced PDH, more lactate) relative to disease-free
        controls.

        '
