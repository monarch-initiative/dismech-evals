      explanation: 'Adds a brain-level correlate to a node otherwise built on sensory testing and questionnaires:
        excitatory neurotransmitter concentration and salience network connectivity differ in patients
        with pain. Two limits are load-bearing and are why this is not stronger evidence than it looks.
        The same study found no significant difference in endometriosis patients without pelvic pain,
        and its authors conclude the change may operate independently of the presence of endometriosis,
        so the signature tracks chronic pelvic pain rather than the disease. Group sizes are small (17
        with pain, 13 without).

