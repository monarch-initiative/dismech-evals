      assertion_type: Pathophysiology
      assertion:
        name: Retrograde Menstruation
        description: 'Menstrual blood flows backward through fallopian tubes into pelvic cavity. Most
          women have retrograde menstruation, but only some develop endometriosis, suggesting other factors
          involved.

          '
      selected_evidence:
        snippet: Although multiple theories have been put forth to explain the pathophysiology and pathogenesis
          of endometriosis, the retrograde menstruation theory of Sampson is the most widely accepted.
          However, since retrograde menstruation occurs in most of the reproductive age women, it is clear
          that there must be other factors which may contribute to the implantation of endometrial cells
          and their subsequent development into endometriotic disease.
        supports: SUPPORT
