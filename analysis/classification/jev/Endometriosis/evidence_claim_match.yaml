      assertion_type: Pathophysiology
      assertion:
        name: Progesterone Resistance
        biological_scale: CELLULAR
        description: 'Endometriotic tissue is resistant to progesterone action. Progesterone receptor
          levels are reduced and the PR-B isoform is essentially absent, so progesterone fails to induce
          epithelial 17beta-hydroxysteroid dehydrogenase type 2 (17beta-HSD-2). Because 17beta-HSD-2 normally
          inactivates estradiol to estrone, its deficient induction leaves high local concentrations of
          the mitogen estradiol, and this progesterone resistance explains why a subset of patients do
          not respond to progestin therapy.

          '
        cell_types:
        - preferred_term: Endometrial Stromal Cell
          term:
            id: CL:0002255
            label: stromal cell of endometrium
        - preferred_term: Endometrial Epithelial Cell
