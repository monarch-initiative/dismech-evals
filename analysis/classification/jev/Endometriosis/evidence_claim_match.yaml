      assertion_type: Pathophysiology
      assertion:
        name: Somatic Cancer-Driver Mutations
        biological_scale: MOLECULAR
        description: 'Deep-infiltrating endometriotic lesions harbor recurrent somatic cancer-driver mutations
          (KRAS, PIK3CA, ARID1A, PPP2R1A) that are largely confined to the epithelial compartment. Endometrial
          cells can already carry these cancer-associated mutations before reaching ectopic sites. Despite
          these oncogenic drivers, deep-infiltrating lesions remain benign — morphologically normal, non-expansile,
          and at virtually no risk of malignant transformation; ovarian endometrioma, in contrast, is
          a recognized precursor of endometriosis-associated ovarian cancer.

          '
        cell_types:
        - preferred_term: Endometriotic Epithelial Cell
          term:
            id: CL:0002149
            label: epithelial cell of uterus
        biological_processes:
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
      selected_evidence:
        snippet: Ten of 39 deep infiltrating lesions (26%) carried driver mutations; all the tested somatic
          mutations appeared to be confined to the epithelial compartment of endometriotic lesions.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
