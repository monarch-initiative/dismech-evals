      assertion_type: Pathophysiology
      assertion:
        name: Peripheral Nociceptor Sensitization
        description: 'Lesion and peritoneal mediators, including inflammatory mediators and prolactin/prolactin-receptor
          signaling, can sensitize pelvic nociceptive sensory neurons. Human peritoneum and lesions over-express
          the nociceptive transducer and voltage-gated channels TRPV1, TRPA1, SCN11A and SCN9A, and estradiol
          raises TRPV1 in sensory neurons, so the sensitized state is both inflammatory and hormonally
          amplified. This provides a mechanism by which pain may be amplified without requiring proportional
          increases in lesion burden.

          '
        cell_types:
        - preferred_term: nociceptor
          term:
            id: CL:0000198
            label: pain receptor cell
        biological_processes:
        - preferred_term: Sensory perception of pain
          modifier: INCREASED
          term:
            id: GO:0019233
            label: sensory perception of pain
      selected_evidence:
        snippet: We highlight our current understanding of prolactin-mediated mechanisms of nociceptor
          sensitization in females and how this mechanism may apply to endometriosis.
        supports: SUPPORT
