      assertion_type: Discussion
      assertion:
        discussion_id: gap_endometriosis_pain_lesion_burden_discordance
        prompt: Which combination of lesion neuroangiogenesis, inflammatory mediators, prolactin/prolactin-receptor
          signaling, peripheral nociceptor sensitization, and central sensitization best explains why
          endometriosis pain often does not scale with visible lesion burden?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Lesion-Peritoneal Neuroangiogenesis
        - pathophysiology#Peripheral Nociceptor Sensitization
        - pathophysiology#Central Sensitization and Nociplastic Pain
        - phenotypes#Pelvic Pain
        rationale: The entry now models a neuroimmune pain circuit, but the relative causal weights of
          lesion-local innervation, soluble mediators, peripheral nociceptor threshold shifts, and central
          pain amplification remain unresolved. This gap determines whether patients should be stratified
          primarily by lesion phenotype, molecular/peritoneal mediator profile, quantitative sensory testing,
          or central-sensitization/nociplastic-pain measures when predicting persistent pain after lesion-directed
          treatment.
        proposed_experiments:
        - experiment_id: exp_endometriosis_multimodal_pain_stratification_cohort
          name: Multimodal lesion-sensitization pain stratification cohort
          description: Prospectively measure lesion subtype and burden, lesion/peritoneal neuroangiogenic
            markers, inflammatory and prolactin-pathway mediators, quantitative sensory testing, central-sensitization
            questionnaires, and pain outcomes before and after surgery or hormonal suppression to test
            which layer best predicts persistent pelvic pain.
          experiment_type:
            preferred_term: prospective longitudinal cohort study
          decision_criterion: A model that combines peripheral mediator/innervation measures with central-sensitization
            readouts should predict persistent pain better than lesion burden or surgical stage alone.
      selected_evidence:
        snippet: Despite its prevalence, the underlying molecular mechanisms of this disease remain poorly
          understood.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
