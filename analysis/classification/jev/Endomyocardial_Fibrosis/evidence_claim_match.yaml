      assertion_type: Pathophysiology
      assertion:
        name: Eosinophil degranulation and endocardial injury
        description: 'Degranulating eosinophils release cationic granule proteins into the subendocardium,
          injuring endocardial endothelium and the subendocardial layer of myocytes. This is Davies stage
          one, the acute necrotic phase, lasting some months. It is the stage almost never observed in
          tropical endomyocardial fibrosis, because patients in endemic areas do not present until they
          are in heart failure, and it is the single largest gap in the evidence for this disease.

          '
        biological_scale: CELLULAR
        role: mechanism
        cell_types:
        - preferred_term: Eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        - preferred_term: Endocardial endothelial cell
          term:
            id: CL:0002350
            label: endocardial cell
        biological_processes:
        - preferred_term: eosinophil degranulation
          term:
            id: GO:0043308
            label: eosinophil degranulation
          modifier: INCREASED
        locations:
        - preferred_term: Endocardium
          term:
            id: UBERON:0002165
            label: endocardium
      selected_evidence:
        snippet: Hypereosinophilia likely contributes to early myocardial necrosis through eosinophil
          granule proteins (major basic protein, eosinophil peroxidase), initiating an inflammatory-fibrotic
          cascade
        supports: SUPPORT
