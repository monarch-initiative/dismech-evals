  203eb5796ed810450edb4b529dedd316fb18391336511dc4ab2bb56cd87a2fae:
    claim:
      about:
        disease:
          name: Endomyocardial Fibrosis
          disease_term:
            preferred_term: endomyocardial fibrosis
            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Fibroblast and cardiomyocyte coculture
        description: 'The only cell-based system used for this disease, and explicitly not a disease model.
          Cocultures of RT3 fibroblasts with SV40-transformed RL-14 cardiomyocytes show fibroblast migration,
          vimentin upregulation, inhibition of cardiomyocyte proliferation, and distortion of cardiomyocyte
          morphology. The published limitations are unusually candid and are reproduced here because they
          matter for how the results should be read: the cell lines are artificial, there are no eosinophils
          and no endothelial cells in the system, and the extracellular matrix is not physiologic. Since
          eosinophils and endocardial endothelium are precisely the cells the accepted mechanism turns
          on, this system cannot speak to the initiating injury at all.

          '
        experimental_model_type: CO_CULTURE
        modeled_mechanisms:
        - target: Fibroblast activation and excessive collagen deposition
          description: 'The coculture models the fibroblast-cardiomyocyte interaction of the fibrogenic
            step only, downstream of the injury it cannot represent.

            '
        publication: PMID:41399600
      selected_evidence:
        snippet: demonstrating fibroblast migration, vimentin upregulation, inhibition of cardiomyocyte
          proliferation, and morphologic distortion of cardiomyocytes
        supports: SUPPORT
        directness: INDIRECT
