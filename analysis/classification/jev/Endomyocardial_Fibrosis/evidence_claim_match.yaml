      assertion:
        name: Plantain and serotonin dietary models
        description: 'A refuted hypothesis, retained because the refutation is the useful part. High urinary
          5-hydroxyindole-acetic acid in West and East Africans suggested that serotonin from a plantain-based
          diet caused the disease. Plantains were fed to guinea pigs, rats, and Patas monkeys, and typical
          lesions did not appear; serum 5-hydroxytryptamine failed to rise in patients fed plantains in
          Nigeria; and the line of inquiry stopped. Curating this prevents the hypothesis being rediscovered
          as a lead, and it shows that this disease''s model literature contains genuine negative results
          rather than only untested proposals.

          '
        experimental_model_type: OTHER
        modeled_mechanisms:
