  b4a3639362f1ffd8b30450333836569b9c4f8c956ebc85ff313a36323d11fb79:
    claim:
      about:
        disease:
          name: Endomyocardial Fibrosis
          disease_term:
            preferred_term: endomyocardial fibrosis
            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Cassava-fed Cercopithecus aethiops with protein deprivation
        description: 'The only animal model that reproduces the human lesion from a proposed natural exposure
          rather than from a laboratory insult. Three African green monkeys were fed uncooked cassava
          and three uncooked banana, and hearts were taken for histology as health deteriorated. Cassava-fed
          animals developed endocardial thickening, interstitial fibrosis, papillary muscle fibrosis,
          and apical left ventricular fibrosis; banana-fed animals did not. The banana arm is the crucial
          control, because it was also protein-free, which separates a cassava-specific effect from generic
          protein deprivation. Limitations are real: n is three per arm, the endpoint is histology in
          a deteriorating animal rather than a defined disease state, and no eosinophilic phase was described,
          so the model supports the nutritional arm without addressing the eosinophil arm at all.

          '
        experimental_model_type: OTHER
        organism:
          preferred_term: Chlorocebus aethiops
          term:
            id: NCBITaxon:9534
            label: Chlorocebus aethiops
        modeled_mechanisms:
        - target: Chronic antigenic or toxic stimulus in a susceptible host
          description: 'The model instantiates the proposed dietary toxic exposure directly.

            '
        - target: Dense endocardial fibrous scar
          description: 'The model reproduces the defining endocardial lesion, including its apical and
            papillary distribution.

            '
        publication: PMID:8756020
      selected_evidence:
        snippet: By the 160th day, the former exhibited marked thickening of the endocardium, interstitial
          fibrosis, fibrous septa formation, pappillary muscle fibrosis as well as apical fibrosis of
          the left ventricle, which findings occur in the human disease.
        supports: SUPPORT
