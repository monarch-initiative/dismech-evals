  551f68015a786bee857d445c540e94979c1ea8b16a36829baa31425e989f6257:
    claim:
      about:
        disease:
          name: Endomyocardial Fibrosis
          disease_term:
            preferred_term: endomyocardial fibrosis
            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: autoimmunity_cause_or_consequence
        prompt: 'Do circulating anti-myocardial antibodies sustain injury in endomyocardial fibrosis,
          or merely mark injury that has already occurred?

          '
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Anti-myocardial autoantibody response
        rationale: 'Anti-myocardial IgG is present in about half of patients and a tenth of controls,
          and its intensity correlates with disease activity. Correlation with activity is compatible
          with both readings, since an antibody that drives injury and an antibody that reports injury
          would both track it. The authors of the only study explicitly declined to resolve it. The stakes
          are concrete rather than academic: only the causal reading would justify trialling immunosuppression
          in a disease that currently has no medical therapy at all, and giving immunosuppression on the
          strength of a marker would expose a malnourished, often parasitised population to real harm.
          That trial has in fact been attempted once. A pilot randomised trial of prednisolone in 35 Ugandan
          patients found the drug safe but failed to show a reduction in ascites reaccumulation, with
          a relative risk of 0.70 and a confidence interval crossing one. It targeted the ascites rather
          than the autoantibody arm, and with 16 patients on active drug and six lost to follow-up it
          cannot exclude a modest effect, so it does not settle this question. It does mean the question
          is no longer purely hypothetical, and that any future immunosuppression proposal has to say
          what it would do differently.

          '
        proposed_experiments:
        - experiment_id: exp_emf_autoantibody_temporal_sequence
          name: Serial autoantibody measurement in a screen-detected cohort followed to progression
          description: Measure anti-myocardial IgG serially in screen-detected early cases, and determine
            whether antibody appearance and titre rise precede or follow echocardiographic progression
            in individual patients.
          decision_criterion: Antibody appearance preceding progression within individuals would support
            a causal or perpetuating role and would justify a pilot immunosuppression trial; antibody
            rise following progression would establish it as a marker and rule out that trial.
      selected_evidence:
        snippet: These immune markers seem to be related with activity and might provide an adjunct tool
          for diagnosis and classification of EMF, therefore improving its management by identifying patients
          who may benefit from immunosuppressive therapy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20422043
      reference_title: Presence of circulating anti-myosin antibodies in endomyocardial fibrosis.
      evidence_source: HUMAN_CLINICAL
      explanation: States the activity correlation and the therapeutic hope that rests on the causal reading.
