      assertion:
        name: Constrictive pericarditis
        description: 'The classic mimic, since both produce restrictive filling with preserved systolic
          function and prominent right-sided congestion. Imaging separates them by locating the lesion:
          a thickened, adherent pericardium in constriction versus a thickened endocardium with an obliterated
          apex and tethered subvalvular apparatus in endomyocardial fibrosis. The distinction matters
          because pericardiectomy and endocardial decortication are different operations.

          '
      selected_evidence:
        snippet: Diagnosis is often delayed due to overlap with other causes of heart failure and limited
          access to advanced imaging.
