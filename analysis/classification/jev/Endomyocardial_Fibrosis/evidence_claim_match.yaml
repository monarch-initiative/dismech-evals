      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hypereosinophilic syndrome with cardiac involvement
        description: 'Löffler endocarditis produces an endocardial lesion that is histologically and echocardiographically
          indistinguishable from tropical endomyocardial fibrosis at the fibrotic stage. The separation
          is by context, not by cardiac appearance: a documented marked eosinophilia, often with an identifiable
          clonal or reactive cause, versus an endemic tropical setting with no eosinophilia at presentation.
          This is more than a differential, since it is the disease from which the mechanism of endomyocardial
          fibrosis is inferred.

          '
      selected_evidence:
        snippet: its pathology resembles conditions such as eosinophilic cardiomyopathy and hypereosinophilic
          syndrome
        supports: SUPPORT
