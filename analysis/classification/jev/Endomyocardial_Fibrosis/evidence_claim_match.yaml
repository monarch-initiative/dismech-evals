            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Prednisolone for recurrent ascites
        description: 'The only randomised trial of a disease-directed medical therapy in this disease,
          and it was negative. Thirty-five Ugandan patients with grade 2 ascites were randomised to prednisolone
          1 mg/kg/day or placebo for up to eight weeks; the drug was safe but did not significantly reduce
          progression to grade 3 ascites, with a relative risk of 0.70 and a confidence interval crossing
          one. It is curated here precisely because it is negative: the rationale was the peritoneal inflammation
          thought to drive the ascites, and the result is the single most relevant piece of evidence against
          reaching for immunosuppression on the strength of the autoimmune findings elsewhere in this
          entry. A pilot of 35 with six lost to follow-up cannot exclude a modest benefit, so this is
          a failure to demonstrate efficacy rather than a demonstration of futility.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: prednisolone
            term:
              id: NCIT:C769
              label: Prednisolone
      selected_evidence:
        snippet: Prednisolone was safely administered in this setting.
        supports: SUPPORT
