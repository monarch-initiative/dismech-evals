      assertion_type: Pathophysiology
      assertion:
        name: Chronic antigenic or toxic stimulus in a susceptible host
        description: 'The initiating exposure is not established. Chronic helminth infection, malaria,
          cassava-based diets with protein deprivation, and geochemical exposures such as cerium in monazite-rich
          soils have all been proposed, and none accounts for the disease''s distribution. The strongest
          structural observation is negative: hypotheses that explain why the disease occurs where it
          does fail to explain why it does not occur in other regions with the same parasite burden or
          the same diet. What is well supported is that exposure alone is insufficient, since only a minority
          of people living in identical conditions develop the disease.

          '
        biological_scale: ORGANISM
        role: trigger
        conforms_to: fibrotic_response#Tissue Injury
      selected_evidence:
        snippet: Despite several hypotheses regarding cause, no account of the etiology of this disease
          has yet fully explained its unique geographical distribution.
        supports: SUPPORT
