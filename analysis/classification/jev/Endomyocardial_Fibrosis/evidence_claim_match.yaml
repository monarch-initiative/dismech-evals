            preferred_term: endomyocardial fibrosis
            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eosinophil_hypothesis_untestable_in_endemic_setting
        prompt: 'Is tropical endomyocardial fibrosis actually caused by eosinophil-mediated endocardial
          injury, or has that mechanism been imported wholesale from hypereosinophilic syndrome on the
          strength of a shared end-stage lesion?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Sustained eosinophilia and Th2-skewed immune activation
        - pathophysiology#Eosinophil degranulation and endocardial injury
        rationale: 'The eosinophil model is coherent and is directly evidenced in hypereosinophilic syndrome,
          where the acute infiltrative stage, the thrombotic stage, and the fibrotic stage are all observed
          prospectively in the same patients. In tropical endomyocardial fibrosis, none of that is observed.
          Patients present at the fibrotic stage, eosinophilia is usually absent by then, and biopsy at
          that point is uninformative in a specific and vicious way, because degranulation and replacement
          by fibrosis erase the evidence of the very process being looked for. The inference therefore
          runs backwards from a shared end-stage appearance, which is exactly the reasoning pattern that
          would also be satisfied if two different upstream processes converged on one scar. The alternative
          worth taking seriously is that the endemic disease is driven by something else entirely, with
          the eosinophilic endocarditis of hypereosinophilic syndrome being a separate route to the same
          architecture. Population screening now makes the decisive study possible for the first time,
          because it identifies affected people before the fibrotic stage.

          '
        proposed_experiments:
        - experiment_id: exp_emf_prospective_early_stage_cohort
          name: Longitudinal follow-up of screen-detected early endomyocardial fibrosis with serial eosinophil
            and cardiac biomarker measurement
          description: Enrol screen-detected asymptomatic and mild cases from an endemic population, and
            follow them with serial eosinophil counts, troponin, cardiac magnetic resonance tissue characterisation,
            and echocardiographic severity scoring, comparing those who progress against those who do
            not.
          decision_criterion: Eosinophilia or a troponin and magnetic resonance signature of active eosinophilic
            inflammation preceding progression would establish the eosinophil route in the endemic disease;
            progression without any such signal would show that the mechanism inferred from hypereosinophilic
            syndrome does not transfer.
      selected_evidence:
        snippet: may be non-contributive due to sampling issues or eosinophil degranulation or replacement
          by fibrosis
        supports: SUPPORT
