          count is not informative. Its yield is limited in a characteristic way: by the time fibrosis
          is established the eosinophils have degranulated or been replaced, so a negative biopsy does
          not exclude an eosinophilic origin. That is a mechanistically informative limitation, not just
          a technical one.

          '
        diagnosis_term:
          preferred_term: endomyocardial biopsy
