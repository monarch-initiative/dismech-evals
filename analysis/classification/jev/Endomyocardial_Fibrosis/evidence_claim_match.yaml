      assertion_type: ProgressionInfo
      assertion:
        phase: Acute necrotic stage
        notes: 'Davies stage one, lasting up to about five months: eosinophilic infiltration of the subendocardium
          with myocyte necrosis and troponin release. In hypereosinophilic syndrome this stage is generally
          asymptomatic and detectable by troponin and cardiac magnetic resonance. In tropical endomyocardial
          fibrosis it is almost never observed, because patients in endemic areas do not reach care until
          heart failure has developed.

          '
      selected_evidence:
        snippet: At the early generally asymptomatic stage, related to subendocardial eosinophilic infiltrates,
          elevation of the biomarker of cardiac damage (serum troponin) and cardiac MRI are the best tools
          for diagnosis.
        supports: SUPPORT
