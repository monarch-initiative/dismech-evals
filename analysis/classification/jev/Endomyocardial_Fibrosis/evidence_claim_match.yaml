  1cc2e54002dadeb2a202c3e8ca665f4625bbdc977263b7ae02a1291d970de2a6:
    claim:
      about:
        disease:
          name: Endomyocardial Fibrosis
          disease_term:
            preferred_term: endomyocardial fibrosis
            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sustained eosinophilia and Th2-skewed immune activation
        description: 'Persistent eosinophilia is the pivot of the accepted model. In hypereosinophilic
          syndrome, where the eosinophil count is by definition high and the cardiac disease is followed
          prospectively, eosinophil-mediated endomyocardial damage is directly established. In tropical
          endomyocardial fibrosis, eosinophilia is variably present and typically absent by the time the
          fibrotic stage is diagnosed, so the inference runs backwards from a shared end-stage lesion.
          That asymmetry is real and is curated as such rather than smoothed over.

          '
        biological_scale: ORGANISM
        role: mechanism
        conforms_to: fibrotic_response#Inflammatory Recruitment and Amplification
        cell_types:
        - preferred_term: Eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Although its pathogenesis and etiology are not fully understood, its pathology resembles
          conditions such as eosinophilic cardiomyopathy and hypereosinophilic syndrome.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
