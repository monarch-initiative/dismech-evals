      assertion:
        name: Endocardial decortication with atrioventricular valve repair or replacement
        description: 'The only intervention that changes the course of established disease. The fibrous
          endocardial peel is stripped from the ventricle to restore cavity volume and compliance, and
          the tethered atrioventricular valve is repaired or replaced at the same operation. Operative
          risk is high and the procedure is available to almost none of the people who need it, which
          is the defining inequity of this disease rather than a technical limitation.

          '
        therapeutic_modality: SURGERY
