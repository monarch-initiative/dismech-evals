  3365598d749c6cef1519991fdf07d2c13901aaa4be2205a3ba9bdf6c62544b91:
    claim:
      about:
        disease:
          name: Endomyocardial Fibrosis
          disease_term:
            preferred_term: endomyocardial fibrosis
            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: screen_detected_disease_natural_history
        prompt: 'Do the mild, asymptomatic cases found by population echocardiographic screening progress
          to clinical endomyocardial fibrosis, or are they a largely stable finding?

          '
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Dense endocardial fibrous scar
        - pathophysiology#Restrictive diastolic physiology
        rationale: 'Screening a rural Mozambican population found echocardiographic disease in nearly
          a fifth of people, but only 22.7 percent of those were symptomatic and most had only mild-to-moderate
          abnormalities. Two readings have opposite consequences. If most screen-detected cases progress,
          then the clinical disease is the visible fraction of a very large iceberg, screening would identify
          a huge population for early intervention, and the prevalence figure is a public-health emergency.
          If most are stable, then the screening criteria are detecting a common structural variant or
          a self-limited healed lesion, and treating the prevalence as a burden estimate overstates it
          substantially. No longitudinal follow-up of a screen-detected cohort has been published, so
          the question is open on the evidence rather than merely contested.

          '
        proposed_experiments:
        - experiment_id: exp_emf_screen_detected_longitudinal_followup
          name: Ten-year longitudinal follow-up of an echocardiographically screen-detected endomyocardial
            fibrosis cohort
          description: Re-examine the screen-detected cohort at fixed intervals with the same standardised
            criteria and severity score, recording progression in severity grade, onset of symptoms, incident
            complications, and mortality, against screen-negative controls from the same sampling frame.
          decision_criterion: Substantial progression in severity grade or symptom onset in a majority
            of screen-detected mild cases would establish them as early disease and justify screening
            programmes; stability across a decade would require the screening criteria to be recalibrated
            and the prevalence figure reinterpreted.
      selected_evidence:
        snippet: Most affected subjects had mild-to-moderate structural and functional echocardiographic
          abnormalities. Only 48 persons with endomyocardial fibrosis (22.7%) were symptomatic.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
