      assertion_type: Environmental
      assertion:
        name: Cassava-based diet with severe protein deprivation
        description: 'The best-evidenced environmental hypothesis, and the only one with a controlled
          experimental test behind it. Populations in endemic areas subsist on cassava with little animal
          protein, and feeding uncooked cassava to African green monkeys under protein restriction reproduces
          the endomyocardial lesion while a banana diet lacking the same protein does not. That control
          is what makes this more than a poverty correlation: it separates the cassava from the protein
          deficiency that accompanies it.

          '
      selected_evidence:
        snippet: Investigations into nutritional factors in EMF have focused on a possible connection
          with cassava toxicity.
        supports: SUPPORT
