          term:
            id: hgnc:4932
            label: HLA-B
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: 'HLA-B*58 occurred more frequently in Mozambican patients with endomyocardial fibrosis
          than in ethnically matched controls. This is one of only two loci from the only formal genetic
          study of the disease, in 71 patients and 137 controls, and it has not been replicated or followed
          by a genome-wide study. It is curated as susceptibility rather than causation, consistent with
          the model in which genotype determines who among the exposed develops fibrosis.

          '
      selected_evidence:
        snippet: with EMF patients being more likely than controls to have the HLA-B*58 allele in Mozambique
          (p-0.03)
