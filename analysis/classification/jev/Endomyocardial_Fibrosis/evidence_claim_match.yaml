  8561a5c8ed46ef98f697233d2a920d0f27cb520e46aaf950ce63a555a694c5e7:
    claim:
      about:
        disease:
          name: Endomyocardial Fibrosis
          disease_term:
            preferred_term: endomyocardial fibrosis
            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: geographic_distribution_unexplained
        prompt: 'Why is endomyocardial fibrosis confined to specific equatorial regions, when the exposures
          proposed to cause it are not?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Chronic antigenic or toxic stimulus in a susceptible host
        rationale: 'This is the constraint every etiologic hypothesis has failed. Filariasis and schistosomiasis
          are widespread far beyond the endemic zone; cassava is eaten across the tropics; malaria''s
          distribution does not match the disease''s. A systematic review across six decades concluded
          that no proposed account explains the geography. Three structurally different explanations remain
          open. The cause may be a genuinely localised exposure not yet identified, such as a soil geochemical
          factor, in which case the geography is the signal rather than the puzzle. It may require a specific
          conjunction of exposures that happens to co-occur only in those regions, in which case single-factor
          studies were always going to fail. Or the apparent geography may be substantially an artefact
          of where anyone has looked, which population screening in non-endemic tropical regions could
          test directly and cheaply.

          '
        proposed_experiments:
        - experiment_id: exp_emf_geographic_screening_survey
          name: Standardised echocardiographic prevalence survey across matched endemic and non-endemic
            tropical regions
          description: Apply the same standardised echocardiographic criteria and severity score used
            in the Mozambique population study to random population samples in tropical regions with comparable
            helminth burden, diet, and poverty but no reported endomyocardial fibrosis, alongside a contemporaneous
            endemic-region sample as a positive control.
          decision_criterion: Comparable prevalence in supposedly non-endemic regions would show the geography
            is largely an ascertainment artefact and would redirect etiologic search away from localised
            exposures; a genuinely sharp geographic boundary under identical ascertainment would make
            a localised environmental factor the leading hypothesis and would define where to look for
            it.
      selected_evidence:
        snippet: Despite several hypotheses regarding cause, no account of the etiology of this disease
          has yet fully explained its unique geographical distribution.
        supports: SUPPORT
