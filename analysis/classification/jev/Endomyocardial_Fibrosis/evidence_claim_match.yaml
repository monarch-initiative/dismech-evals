            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Subclinical detected disease
        notes: 'Population echocardiographic screening reveals a large reservoir of the disease that never
          reaches clinical attention. In rural Mozambique, only 22.7 percent of screen-detected cases
          were symptomatic, and most had mild-to-moderate structural abnormalities. Whether these represent
          early disease destined to progress, or a stable non-progressive form, is unknown and is arguably
          the most consequential open question about the natural history.

          '
      selected_evidence:
        snippet: Most affected subjects had mild-to-moderate structural and functional echocardiographic
          abnormalities. Only 48 persons with endomyocardial fibrosis (22.7%) were symptomatic.
        supports: SUPPORT
