        prompt: 'How much of what is unknown about endomyocardial fibrosis reflects genuine biological
          difficulty rather than the absence of research capacity where the disease occurs?

          '
        kind: CURATION_TODO
        status: OPEN
        attaches_to:
        - pathophysiology#Chronic antigenic or toxic stimulus in a susceptible host
        rationale: 'This entry has no transcriptomic, proteomic, metabolomic, or single-cell data to cite.
          It has exactly one molecular-profiling study of any kind, a plasma cytokine panel in 27 patients,
          and one randomised trial, a 35-patient pilot of prednisolone that was negative. Its only genetic
          association has never been replicated, its only animal model dates from 1996, and the only cell
          system in use is explicitly described by its own authors as not a disease model. That is the
          entire modern molecular literature for a disease affecting nearly a fifth of a screened population.
          Publication volume has fallen since the 1980s. These are not properties of the biology; they
          are properties of where the biology happens. The curation consequence is that absence of evidence
          in this entry should not be read as evidence of absence anywhere it appears, and that flagging
          a gap here is frequently a statement about research funding rather than about a hard scientific
          problem. This is recorded as a standing caveat over the whole entry rather than as a question
          with an experiment attached.

          '
      selected_evidence:
        snippet: The volume of publications on endomyocardial fibrosis has declined since the 1980s.
        supports: SUPPORT
