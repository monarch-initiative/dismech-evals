          name: Endomyocardial Fibrosis
          disease_term:
            preferred_term: endomyocardial fibrosis
            term:
              id: MONDO:0006746
              label: endomyocardial fibrosis
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'A progressive, incurable cardiomyopathy of children and young adults, presenting in
          New York Heart Association class III or IV in nearly all diagnosed cases, with one-third to
          one-half of advanced patients dead within two years. There is no disease-specific drug. The
          only intervention that prolongs survival is open-heart surgery, which carries high operative
          risk and is unavailable to the overwhelming majority of affected people, who live in rural low-income
          settings.

          '
        notes: 'The burden is inseparable from the setting. Population screening in rural Mozambique found
          nearly one in five people affected, with a peak in adolescence, which makes this a major endemic
          cause of heart failure in the affected regions rather than a rare disease in the usual sense.
          Late diagnosis is driven by lack of clinical awareness and poor access to care, so the complications
          of heart failure, thromboembolism, and arrhythmia are typically already present when the disease
          is first recognised.

          '
      selected_evidence:
        snippet: Medical care currently remains very challenging as one-third to half of patients with
          an advanced disease die within 2 years.
        supports: SUPPORT
