      assertion:
        name: Endogenous
        display_name: Endogenous (hematogenous) endophthalmitis
        description: Results from hematogenous seeding of the eye during bacteremia or fungemia from a
          distant source (e.g. endocarditis, urinary tract infection, indwelling catheter, hepatic abscess)
          rather than direct inoculation. Candida species are a leading cause in the fungal endogenous
          route; see Invasive_Candidiasis.yaml, which curates Candida chorioretinitis/endophthalmitis
          as a metastatic complication of candidemia rather than duplicating that content here.
      selected_evidence:
        snippet: Endogenous bacterial endophthalmitis arises from bacteraemic seeding of the eye. Endocarditis,
          usually caused by S. aureus or streptococci, accounts for 40% of endogenous endophthalmitis
          cases in the USA
        supports: SUPPORT
