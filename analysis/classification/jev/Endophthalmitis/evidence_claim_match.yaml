      assertion_type: Transmission
      assertion:
        name: Exogenous inoculation through a breach of the globe
        description: The common route. Organisms are introduced directly into the eye when the globe is
          opened, by intraocular surgery, penetrating trauma, intravitreal injection, a filtering bleb,
          or extension from an infected cornea. The inoculum is usually the patient's own periocular and
          conjunctival flora at the moment the barrier is breached, which is why the organism recovered
          tracks the route of entry rather than any systemic source.
      selected_evidence:
        snippet: Most cases are exogenous and occur after eye surgery, after penetrating ocular trauma,
          or as an extension of corneal infection.
        supports: SUPPORT
