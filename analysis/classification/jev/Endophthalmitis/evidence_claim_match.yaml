        role: consequence
        biological_scale: CELLULAR
        description: Bacteria or fungi replicate within the vitreous cavity. The organism identity differs
          systematically by route of entry (coagulase-negative staphylococci in acute postoperative disease,
          Cutibacterium acnes in chronic postoperative disease, Bacillus cereus in post-traumatic disease,
          streptococci in bleb-associated and post-injection disease, and Staphylococcus aureus, streptococci,
          or Candida in endogenous disease), which is why empirical antibiotic selection is route-of-entry-dependent.
      selected_evidence:
        snippet: Coagulase-negative staphylococci are the most common causes of post-cataract endophthalmitis,
          and these bacteria and viridans streptococci cause most cases of post-intravitreal anti-VEGF
          injection endophthalmitis, Bacillus cereus is a major cause of post-traumatic endophthalmitis,
          and Staphylococcus aureus and streptococci are important causes of endogenous endophthalmitis
          associated with endocarditis.
        supports: SUPPORT
