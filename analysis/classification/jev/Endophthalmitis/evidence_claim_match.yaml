              label: endophthalmitis
        context: []
      assertion_type: Transmission
      assertion:
        name: Endogenous haematogenous seeding during bacteraemia or fungaemia
        description: 'The minority route. Organisms circulating in the blood cross the blood-retinal barrier
          and seed the eye, so the eye is a metastatic site of a systemic infection rather than the point
          of entry. Pathogens reach the highly vascular choroid first and spread into the vitreous from
          there, which is why these cases are often bilateral and present against a background of systemic
          illness such as endocarditis, liver abscess, indwelling catheters, or candidaemia. Spread runs
          one way only: an infected eye is never itself a source of bacteraemia.'
      selected_evidence:
        snippet: Endophthalmitis may also be endogenous, arising from bacteraemic or fungaemic seeding
          of the eye.
        supports: SUPPORT
