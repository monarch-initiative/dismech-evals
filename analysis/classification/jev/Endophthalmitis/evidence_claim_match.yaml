      assertion_type: Pathophysiology
      assertion:
        name: Bacterial Peptidoglycan Precursor and Lipid II Synthesis (Vancomycin Target)
        role: therapeutic_vulnerability
        biological_scale: MOLECULAR
        conforms_to: bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Precursor and Lipid II Synthesis
        description: Gram-positive organisms causing endophthalmitis (coagulase-negative staphylococci,
          Cutibacterium acnes, streptococci) assemble the lipid II peptidoglycan precursor terminating
          in a D-Ala-D-Ala dipeptide. Glycopeptides such as vancomycin bind and sequester this exposed
          D-Ala-D-Ala terminus, blocking peptidoglycan polymerization. This is the fungus- and host-cell-independent,
          bacteria-specific vulnerability exploited by empirical intravitreal vancomycin.
        biological_processes:
        - preferred_term: Peptidoglycan Biosynthetic Process
          term:
            id: GO:0009252
            label: peptidoglycan biosynthetic process
      selected_evidence:
        snippet: the antimicrobial activity of other vancosamine-modified glycopeptides depends upon both
          d-Ala-d-Ala stem-terminus recognition (primary binding site) and stem-bridge recognition (secondary
          binding site).
        supports: SUPPORT
    origin:
