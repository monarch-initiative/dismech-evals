      assertion_type: Pathophysiology
      assertion:
        name: Breach of the Blood-Ocular Barrier and Loss of Immune Privilege
        role: trigger
        biological_scale: TISSUE
        description: The eye is an immune-privileged site maintained in part by the blood-aqueous and
          blood-retinal barriers, which normally limit infiltration of systemic immune cells into the
          intraocular cavities. Surgical incision, penetrating trauma, a filtering bleb, an intravitreal
          injection needle track, or hematogenous seeding each provide a route by which this barrier is
          breached and organisms gain direct access to the aqueous and vitreous humor.
      selected_evidence:
        snippet: Anatomically, the eye is normally protected from infection by several defense mechanisms,
          including an intact corneal epithelium, conjunctival immune surveillance, tear-film antimicrobial
          components, and the blood–aqueous and blood–retinal barriers. These barriers maintain ocular
          immune privilege by limiting infiltration of systemic immune cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
