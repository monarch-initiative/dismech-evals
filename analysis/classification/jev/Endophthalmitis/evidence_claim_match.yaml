        display_name: Chronic (delayed-onset) postoperative endophthalmitis
        description: A low-grade, indolent form presenting weeks to months after intraocular surgery,
          classically associated with Cutibacterium acnes (formerly Propionibacterium acnes) sequestered
          within the capsular bag, producing a smoldering inflammation rather than the fulminant course
          of acute postoperative disease.
