  87a37f3dff045c1e7cd57bdccca7282bc324581507bca059ef97009fe5ca975a:
    claim:
      about:
        disease:
          name: Enhanced S-Cone Syndrome
          disease_term:
            preferred_term: enhanced S-cone syndrome
            term:
              id: MONDO:0100288
              label: enhanced S-cone syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Photoreceptor Cell-Fate Mis-specification and S-Cone Excess
        description: 'In the absence of NR2E3 repression, the retina overproduces S (blue) cones at the
          expense of rods and L/M cones. This developmental cell-fate mis-specification is the mechanistic
          signature that distinguishes ESCS from the rod-first apoptotic pathway of typical retinitis
          pigmentosa: rather than a mature photoreceptor topography being depleted, the retina is built
          with an abnormal S-to-L/M cone ratio and a near-absence of rods, and is disorganized from the
          outset.

          '
        role: central_effector
        cell_types:
        - preferred_term: S cone cell
          modifier: INCREASED
          term:
            id: CL:0003050
            label: S cone cell
        - preferred_term: retinal rod cell
          modifier: DECREASED
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: retinal rod cell differentiation
          modifier: DECREASED
          term:
            id: GO:0060221
            label: retinal rod cell differentiation
        - preferred_term: retinal cone cell differentiation
          modifier: ABNORMAL
          term:
            id: GO:0042670
            label: retinal cone cell differentiation
      selected_evidence:
        snippet: may result from abnormal cell-fate determination, leading to excess S cones at the expense
          of other photoreceptor subtypes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11773633
      reference_title: The nuclear receptor NR2E3 plays a role in human retinal photoreceptor differentiation
        and degeneration.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Directly states the cell-fate-mis-specification mechanism producing excess S cones
