              label: enhanced S-cone syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NR2E3 Loss of Function
        conforms_to: photoreceptor_degeneration#Photoreceptor Gene Defect
        description: 'The initiating lesion is biallelic loss of function of NR2E3, which encodes a photoreceptor-specific
          ligand-dependent nuclear-receptor transcription factor whose expression is restricted to the
          outer nuclear layer of the retina. NR2E3 normally acts within maturing rod precursors to activate
          rod genes and to repress the cone (particularly the S-cone) transcriptional program. Pathogenic
          variants cluster in the conserved DNA-binding and ligand-binding domains; the novel homozygous
          c.1182del p.(Ile395*) allele deletes the entire NR2E3 AF2 activation domain, abolishing coregulator-dependent
          transcriptional activity.

          '
        role: trigger
        gene:
          preferred_term: NR2E3
          modifier: DECREASED
          term:
            id: hgnc:7974
            label: NR2E3
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        biological_processes:
        - preferred_term: regulation of DNA-templated transcription
          modifier: DECREASED
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
        - preferred_term: eye photoreceptor cell development
          modifier: ABNORMAL
          term:
            id: GO:0042462
            label: eye photoreceptor cell development
      selected_evidence:
        snippet: its physiological activity is essential for proper rod and cone photoreceptor development
          and maintenance
        supports: SUPPORT
