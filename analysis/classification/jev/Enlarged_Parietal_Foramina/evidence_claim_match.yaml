        description: 'The dural venous and posterior fossa anomalies seen with enlarged parietal foramina
          are proposed to arise from the same dosage defect as the bone lesion, acting on the ectomeninx
          that forms both the calvarial bones and the dura. The proposal rests on the co-occurrence of
          the two sets of findings and on shared expression; it has not been tested experimentally. Edges
          that belong to it carry hypothesis_groups: [ectomeninx_patterning].'
      selected_evidence:
        snippet: The similarity of the dural and calvarial abnormalities consequent upon reduced expression
          of both ALX4 or MSX2 suggests that a comparable defect in patterning of the ectomeninx underlies
          both disorders.
