          disease_term:
            preferred_term: eosinophilic esophagitis
            term:
              id: MONDO:0005361
              label: eosinophilic esophagitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_eoe_eosinophil_symptom_causality
        prompt: Which eosinophil-dependent versus eosinophil-independent effector mechanisms drive dysphagia
          and fibrostenotic symptoms in EoE?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Eosinophil Recruitment to Esophagus
        - pathophysiology#Esophageal Fibrosis and Remodeling
        - mechanistic_hypotheses#barrier_antigen_type2_specificity_model
        rationale: 'Eosinophil recruitment is a defining histologic and diagnostic axis, but eosinophil
          depletion alone has not consistently translated into symptom improvement. The symptom-producing
          tissue effectors may include epithelial remodeling, mast cells, neuromuscular dysfunction, and
          fibrosis in addition to eosinophils. A phase 3 trial of the eosinophil-depleting anti-IL-5 receptor
          antibody benralizumab put the dissociation beyond doubt: 87.4% of treated patients reached histologic
          response against 6.5% on placebo, with no significant difference in the Dysphagia Symptom Questionnaire
          and no substantial difference in the endoscopic reference score. That result rules out tissue
          eosinophilia as a sufficient explanation of symptoms; it does not identify the effector that
          is responsible, and the persistent mast cell arm modeled in Esophageal Mast Cell Accumulation
          is one candidate among several.'
      selected_evidence:
        snippet: In this trial involving patients 12 to 65 years of age with eosinophilic esophagitis,
          a histologic response (≤6 eosinophils per high-power field) occurred in significantly more patients
          in the benralizumab group than in the placebo group. However, treatment with benralizumab did
          not result in fewer or less severe dysphagia symptoms than placebo.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
