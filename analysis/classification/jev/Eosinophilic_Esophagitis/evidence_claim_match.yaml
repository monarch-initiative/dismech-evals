    evidence_metadata:
      reference: PMID:38924732
      reference_title: Eosinophil Depletion with Benralizumab for Eosinophilic Esophagitis.
      evidence_source: HUMAN_CLINICAL
      explanation: The randomized phase 3 MESSINA trial separates histologic from symptomatic response
        under near-complete eosinophil depletion, the strongest available evidence that esophageal eosinophilia
        does not by itself produce dysphagia.
