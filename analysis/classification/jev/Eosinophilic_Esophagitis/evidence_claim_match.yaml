        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Epithelial Type II IL-4 Receptor Signaling
        description: IL-13 released by the type 2 infiltrate acts on the type II IL-4 receptor, the IL-4Rα
          and IL-13Rα1 heterodimer expressed predominantly by esophageal epithelial cells, driving the
          EoE transcriptional signature, basal cell proliferation, epithelial and lamina propria thickening,
          and eotaxin-driven eosinophilia. Epithelium-restricted deletion of Il13ra1 protects mice from
          experimental EoE, and single-cell profiling of human EoE biopsies localizes IL-13Rα1 to the
          epithelium. The causal step is therefore established in a conditional-knockout mouse and supported
          by human expression data. Dupilumab blocks IL-4 and IL-13 signaling across many cell types,
          so it validates the receptor pharmacologically without isolating an epithelium-specific human
          route; this node is accordingly curated as a strongly supported experimental route rather than
          a proven exclusive human effector pathway.
        genes:
        - preferred_term: IL13
          term:
            id: hgnc:5973
            label: IL13
        cell_types:
        - preferred_term: Esophageal epithelial cell
          term:
            id: CL:0002252
            label: epithelial cell of esophagus
      selected_evidence:
        snippet: In vivo targeted deletion of Il13ra1 in esophageal epithelial cells rendered mice protected
          from experimental EoE.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
