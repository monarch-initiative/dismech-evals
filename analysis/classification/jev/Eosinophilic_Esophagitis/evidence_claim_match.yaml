        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_eoe_barrier_cause_or_consequence
        prompt: Does esophageal epithelial barrier dysfunction precede EoE inflammation, or is the barrier
          defect measured at diagnosis largely a consequence of type 2 cytokine signaling?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Esophageal Epithelial Barrier Dysfunction
        - mechanistic_hypotheses#barrier_antigen_type2_specificity_model
        rationale: 'The model places barrier disruption upstream of the type 2 cascade, and two observations
          are usually offered in support: rare desmosome variants that impair barrier integrity in a fifth
          of multiplex families, and barrier abnormalities that persist into histologic remission. Neither
          settles the direction. Persistence after disease is not precedence before it, and IL-13 impairs
          esophageal epithelial barrier function directly, so the defect seen at diagnosis is at least
          partly inflammation driven. Deciding this needs sampling from before disease onset in an at-risk
          cohort rather than more cross-sectional biopsies of established or treated disease.'
      selected_evidence:
        snippet: Esophageal biopsies from patients with these variants retain dilated intercellular spaces
          and decrease DSP and PPL expression even during disease remission.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34815391
      reference_title: Desmoplakin and periplakin genetically and functionally contribute to eosinophilic
        esophagitis.
      evidence_source: HUMAN_CLINICAL
      explanation: This persistence in variant carriers is the observation most often read as showing
        an upstream barrier defect, and it is the claim this gap asks to test prospectively.
