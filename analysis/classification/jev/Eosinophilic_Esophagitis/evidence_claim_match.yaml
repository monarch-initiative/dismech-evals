        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_eoe_type2_molecular_heterogeneity
        prompt: Do the molecular endotypes of active EoE defined by esophageal type 2 gene expression
          predict who responds to a given type 2 directed therapy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Type 2 Immune Activation
        - mechanistic_hypotheses#barrier_antigen_type2_specificity_model
        rationale: A 10-site cohort resolved active EoE into five subgroups by expression of IL4, IL5,
          IL13, CCL26, TSLP, CLC, CCR3 and CPA3. The subgroups differed sharply in EoE diagnostic panel
          score and in age, and one carried the highest IL5, TSLP and CCL26 together with tissue-remodeling
          genes, yet they did not differ in eosinophil counts. The single histologic measure used to diagnose
          and monitor the disease therefore does not track the type 2 program that the approved biologics
          target. Whether these endotypes predict response to an IL-4Rα, IL-5 or TSLP directed agent has
          not been tested prospectively, so the entry models one shared type 2 activation node rather
          than stratified ones.
      selected_evidence:
        snippet: These groups differed in age (P < .02) and EoE diagnostic panel score (P < 1.08E-30)
          but not in eosinophil levels.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
      context_paths:
