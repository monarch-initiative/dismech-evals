      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: barrier_antigen_type2_specificity_model
        hypothesis_label: Barrier-Antigen Type 2 Specificity Model
        status: EMERGING
        description: 'Esophageal epithelial barrier dysfunction increases exposure to food and aeroallergen
          antigens and triggers epithelial alarmin release. TSLP and IL-33 then polarize local ILC2/Th2
          inflammation, IL-5/IL-13 responses, and CCL26-mediated eosinophil recruitment. The broad barrier-to-type-2
          axis is well supported, but the patient-specific selection of food antigens remains an open
          mechanistic subproblem rather than a settled causal edge. A second edge of the chain is also
          unsettled at its far end: near-complete eosinophil depletion yields histologic without symptomatic
          response, so the step from tissue eosinophilia to dysphagia is not closed either.'
      selected_evidence:
        snippet: Eosinophilic esophagitis is a recently recognized but expanding disorder characterized
          by antigen-driven eosinophil accumulation in the esophagus.
        supports: SUPPORT
    origin:
