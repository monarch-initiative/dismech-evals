            term:
              id: MONDO:0005361
              label: eosinophilic esophagitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_eoe_food_antigen_specificity
        prompt: Why do individual EoE patients react to different specific food antigens despite sharing
          a common esophageal epithelial barrier defect and type 2 inflammatory program?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Esophageal Epithelial Barrier Dysfunction
        - pathophysiology#Type 2 Immune Activation
        - mechanistic_hypotheses#barrier_antigen_type2_specificity_model
        rationale: A shared barrier defect and type 2 axis do not explain patient-specific antigen selectivity.
          The connecting mechanism likely involves pre-existing local IgE sensitization and Th2 memory
          to particular foods, but there is no clean mechanistic consensus, and it cannot currently be
          modeled as a single causal edge from barrier disruption to a defined antigen response. The mechanism
          is not evidence free, however. Bulk T-cell receptor sequencing of biopsies from patients with
          endoscopically confirmed triggers found relative clonality in children and more shared and similar
          receptors among milk-triggered patients than among patients with differing triggers, which is
          direct molecular evidence for food-specific T-cell recognition. What is missing is a validated
          way to predict an individual patient's trigger and an account of how that repertoire is selected
          in the first place.
      selected_evidence:
        snippet: However, several unmet needs are to be solved urgently, as finding a non-invasive disease-monitoring
          methods and biomarkers for routine practice, the development or new therapies, novel food allergy
          testing to detect triggering foods, drug, and doses required for initial therapy and safety
          issues with long-term maintenance therapy, amongst others.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30364207
      reference_title: 'Eosinophilic Esophagitis: Review and Update.'
      evidence_source: HUMAN_CLINICAL
      explanation: Review identifies better food allergy testing to detect triggering foods as an unmet
        need, supporting the antigen-specificity gap.
