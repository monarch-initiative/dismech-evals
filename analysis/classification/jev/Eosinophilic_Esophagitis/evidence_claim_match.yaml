          The connecting mechanism likely involves pre-existing local IgE sensitization and Th2 memory
          to particular foods, but there is no clean mechanistic consensus, and it cannot currently be
          modeled as a single causal edge from barrier disruption to a defined antigen response. The mechanism
          is not evidence free, however. Bulk T-cell receptor sequencing of biopsies from patients with
          endoscopically confirmed triggers found relative clonality in children and more shared and similar
          receptors among milk-triggered patients than among patients with differing triggers, which is
          direct molecular evidence for food-specific T-cell recognition. What is missing is a validated
          way to predict an individual patient's trigger and an account of how that repertoire is selected
          in the first place.
      selected_evidence:
        snippet: We confirmed relative clonality in children but not adults with active EoE and identified
          potential food-specific TCRs, particularly for milk-triggered EoE. Further studies are needed
          to better identify the broad TCR repertoire relevant to food triggers.
        supports: SUPPORT
