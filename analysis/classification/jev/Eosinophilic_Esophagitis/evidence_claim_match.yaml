  3aea26a039a3455809da534998fe4b199837e66debf3af77fdbf70ed9bcac198:
    claim:
      about:
        disease:
          name: Eosinophilic Esophagitis
          disease_term:
            preferred_term: eosinophilic esophagitis
            term:
              id: MONDO:0005361
              label: eosinophilic esophagitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Esophageal Mast Cell Accumulation
        description: 'Active EoE carries an epithelium-restricted mast cell infiltrate alongside the tissue
          eosinophilia, and in a subgroup of patients epithelial mast cells remain high after epithelial
          eosinophils have normalized in clinical remission. IgE-activated mast cells lower esophageal
          epithelial resistance in coculture and secrete oncostatin M, which is overexpressed in active
          EoE and itself reduces barrier function and filaggrin and desmoglein-1 expression while inducing
          calpain-14. Mast cells are curated here as a parallel effector arm feeding back onto the barrier,
          not as the primary clinical effector: the human data are associative and the mechanistic work
          is coculture based, and what drives their accumulation within the type 2 program is left unasserted.'
        cell_types:
        - preferred_term: Mast cell
          term:
            id: CL:0000097
            label: mast cell
      selected_evidence:
        snippet: Active EoE is characterised in addition to the well-known tissue eosinophilia by a marked
          epithelium-restricted mast cell infiltration.
        supports: SUPPORT
