            id: CL:0000097
            label: mast cell
      selected_evidence:
        snippet: Interestingly, whereas epithelial mast cells and eosinophils were high in active EoE,
          some patients in remission, e.g. normalised epithelial eosinophils, showed remaining high numbers
          of mast cells.
