              label: eosinophilic esophagitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Esophageal Epithelial Barrier Dysfunction
        conforms_to: epithelial_barrier_dysfunction#Epithelial Barrier Insult and Junctional Disruption
        description: Impaired esophageal epithelial barrier function is a primary and initiating abnormality
          in EoE. The main disease susceptibility loci encode epithelium-produced gene products, and profound
          loss of the serine protease inhibitor SPINK7 unleashes proteolytic activity that disrupts barrier
          integrity and triggers proinflammatory and proallergic cytokine release. Rare heterozygous missense
          variants in the desmosome-associated genes DSP and PPL segregate in a fifth of multiplex EoE
          families and impair barrier integrity in esophageal epithelial cells, adding an epithelium-intrinsic
          genetic susceptibility arm to this node. The temporal direction is not settled for the general
          EoE population, since IL-13 also impairs barrier function directly; that unresolved question
          is tracked in gap_eoe_barrier_cause_or_consequence.
        genes:
        - preferred_term: SPINK7
          term:
            id: hgnc:24643
            label: SPINK7
        - preferred_term: CAPN14
          term:
            id: hgnc:16664
            label: CAPN14
        - preferred_term: DSG1
          term:
            id: hgnc:3048
            label: DSG1
        - preferred_term: DSP
          term:
            id: hgnc:3052
            label: DSP
        cell_types:
        - preferred_term: Esophageal epithelial cell
          term:
            id: CL:0002252
            label: epithelial cell of esophagus
      selected_evidence:
        snippet: Furthermore, genetic and functional data establish a primary role for impaired epithelial
          barrier function in disease susceptibility and pathoetiology.
        supports: SUPPORT
