      assertion_type: Pathophysiology
      assertion:
        name: Type 2 Immune Activation and Eosinophil Recruitment
        description: A triggering insult (commonly strenuous exertion, drug exposure such as immune checkpoint
          inhibitors, or infection) drives a Th2-skewed immune response in the deep fascia with recruitment
          of eosinophils and T cells. Eosinophils are detected within the fascia and degranulate, releasing
          effector molecules. Activators of the Th2-M2 pathway (STAT6, IL-4) are upregulated at the muscle-fascia
          interface.
        cell_types:
        - preferred_term: Eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: M2 macrophage (CD206+)
          term:
            id: CL:0000890
            label: M2 macrophage
        biological_processes:
        - preferred_term: Eosinophil degranulation
          term:
            id: GO:0043308
            label: eosinophil degranulation
          modifier: INCREASED
        - preferred_term: Adaptive (type 2) immune response
          term:
            id: GO:0002250
            label: adaptive immune response
          modifier: INCREASED
      selected_evidence:
        snippet: Activators of the so-called Th2-M2 pathway like STAT6 and IL-4 are upregulated leading
          to high expression levels of CD206.
        supports: SUPPORT
