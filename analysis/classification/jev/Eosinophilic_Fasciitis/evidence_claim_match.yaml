      assertion_type: DifferentialDiagnosis
      assertion:
        name: systemic sclerosis
        disease_term:
          preferred_term: systemic sclerosis
          term:
            id: MONDO:0005100
            label: systemic sclerosis
        description: The principal differential. EF and systemic sclerosis both produce scleroderma-like
          skin induration, but EF spares the fingers and face, lacks Raynaud phenomenon and nailfold capillary
          changes, lacks anti-centromere and anti-Scl-70 autoantibodies, and lacks visceral organ involvement,
          and the fibrosis is centered on the deep fascia rather than the dermis.
        distinguishing_features:
        - EF spares the fingers and face, whereas systemic sclerosis characteristically involves the fingers
          (sclerodactyly).
        - EF lacks Raynaud phenomenon and nailfold capillary changes typical of systemic sclerosis.
        - EF lacks anti-centromere and anti-Scl-70 (topoisomerase) autoantibodies.
        - EF lacks the visceral (lung, GI, kidney, heart) organ involvement seen in systemic sclerosis.
        - EF fibrosis is centered on the deep fascia; diagnosis requires a full-thickness fascial biopsy.
      selected_evidence:
        snippet: patients lack the classic features of scleroderma, including extracutaneous organ involvement,
          sclerodactyly, Raynaud disease, and nail-fold capillary changes
        supports: SUPPORT
