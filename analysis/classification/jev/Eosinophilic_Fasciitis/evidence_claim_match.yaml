              id: MONDO:0009175
              label: eosinophilic fasciitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TGF-beta-Driven Fascial Fibroblast Activation
        description: Eosinophil effector molecules and type 2 cytokines (including TGF-beta, IL-4, IL-13)
          activate resident fascial fibroblasts, driving their differentiation toward collagen-producing
          myofibroblasts. This is the central profibrotic effector step shared with other scleroderma-like
          fibrosing disorders.
        conforms_to: fibrotic_response#Mesenchymal Cell Activation
        cell_types:
        - preferred_term: Fascial fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: Myofibroblast
          term:
            id: CL:0000186
            label: myofibroblast cell
        biological_processes:
        - preferred_term: TGF-beta receptor signaling
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
        - preferred_term: Positive regulation of fibroblast proliferation
          term:
            id: GO:0048146
            label: positive regulation of fibroblast proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: Activation of eosinophils and disordered regulation of fibroblast collagen synthesis,
          apoptosis, and proliferation are recurrent findings in these disorders.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11890876
      reference_title: Scleroderma-like cutaneous syndromes.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes eosinophil activation coupled to dysregulated fibroblast collagen synthesis/proliferation
        as a recurrent mechanism in eosinophilic fasciitis and related scleroderma-like disorders.
