            id: hgnc:28449
            label: ZFTA
        notes: ZFTA (formerly C11orf95) fusion, most commonly ZFTA-RELA, defines the dominant supratentorial
          ependymoma type and is present in more than two-thirds of supratentorial cases. Fusions arise
          by chromothripsis of 11q13.1. Non-RELA ZFTA fusion partners (including NCOA1/2) produce the
          same histomolecular entity but with marked histopathological heterogeneity.
      selected_evidence:
        snippet: This modification reinforces the idea that supratentorial-ependymomas exhibiting fusion
          that implicates the C11orf95 (now called ZFTA) gene with or without the RELA gene, represent
          the same histomolecular entity.
        supports: SUPPORT
