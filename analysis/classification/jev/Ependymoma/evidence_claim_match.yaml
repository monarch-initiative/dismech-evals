            id: GO:0140718
            label: facultative heterochromatin formation
      selected_evidence:
        snippet: Here we find that a conserved sequence in EZHIP is necessary and sufficient to inhibit
          PRC2 catalytic activity in vitro and in vivo. EZHIP directly contacts the active site of the
          EZH2 subunit in a mechanism similar to the H3 K27M oncohistone.
        supports: SUPPORT
