            display_name: Myxopapillary ependymoma
            description: Histopathologically defined ependymal tumor type arising almost exclusively in
              the region of the conus medullaris, cauda equina and filum terminale. WHO CNS5 assigns it
              grade 2, a change from its previous grade 1 designation.
          role: subtype
