      assertion:
        name: DNA methylation array profiling
        description: 'Genome-wide DNA methylation profiling is the reference method for assigning an ependymal
          tumor to its molecular group and is definitional for the WHO CNS5 types. It is not merely confirmatory:
          in a series of histopathologically diagnosed ependymoma variants, integrated diagnosis had to
          be revised in more than a third of cases once methylation class was taken into account.'
        diagnosis_term:
          preferred_term: methylation testing
          term:
            id: NCIT:C165222
            label: DNA Methylation Array
      selected_evidence:
        snippet: Overall, integrated diagnosis had to be changed in 35.6% of cases as compared to the
          initial diagnosis.
        supports: SUPPORT
