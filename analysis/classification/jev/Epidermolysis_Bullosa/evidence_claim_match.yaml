      assertion_type: Subtype
      assertion:
        name: Epidermolysis Bullosa Simplex
        description: 'Intraepidermal cleavage, typically within basal keratinocytes. Most commonly caused
          by mutations in KRT5 or KRT14 encoding keratin 5 and keratin 14. Ranges from localized palmoplantar
          blistering to severe generalized forms. Generally autosomal dominant inheritance.

          '
      selected_evidence:
        snippet: In EBS, blistering occurs within basal keratinocytes
        supports: SUPPORT
