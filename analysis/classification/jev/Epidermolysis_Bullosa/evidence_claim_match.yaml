        name: Junctional Epidermolysis Bullosa
        description: 'Cleavage occurs within the lamina lucida of the basement membrane zone. Caused by
          mutations in genes encoding laminin-332 (LAMA3, LAMB3, LAMC2) or type XVII collagen (COL17A1),
