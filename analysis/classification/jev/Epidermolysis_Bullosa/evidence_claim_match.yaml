        description: 'FDA-approved topical gene therapy for dystrophic epidermolysis bullosa (May 2023).
          Beremagene geperpavec-svdt (VYJUVEK) is a topically applied, redosable, replication-defective
          HSV-1 vector-based gene therapy that delivers functional COL7A1 to restore type VII collagen
          production. In the phase 3 GEM-3 trial, complete wound healing at 6 months occurred in 67% of
          B-VEC-treated wounds vs 22% of placebo wounds. Approved for wounds in patients aged 6 months
          and older with DEB carrying COL7A1 mutations.

          '
