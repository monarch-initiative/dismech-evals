            term:
              id: MONDO:0006541
              label: epidermolysis bullosa
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Immunofluorescence Mapping (IFM)
        description: 'Skin biopsy technique using a panel of antibodies against basement membrane zone
          proteins to determine the level of cleavage and identify the deficient protein. IFM achieves
          97% sensitivity and 100% specificity for EB subtype classification when compared to genetic
          testing as the reference standard. IFM has largely superseded transmission electron microscopy
          (TEM) for routine EB diagnosis due to superior diagnostic accuracy.

          '
        presence: Gold standard tissue-based test
        notes: 'IFM subclassified EB into its three major forms in 29/30 cases (97%) compared to 24/30
          (80%) for TEM. TEM sensitivities and specificities were only 71% and 81% respectively. IFM is
          now the preferred tissue-based diagnostic method in the current diagnostic algorithm.

          '
      selected_evidence:
        snippet: TEM subclassified EB into its three major forms in 24/30 cases (80%) and IFM in 29/30
          cases (97%)
        supports: SUPPORT
