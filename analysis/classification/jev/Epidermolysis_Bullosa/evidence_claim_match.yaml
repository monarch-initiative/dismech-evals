              id: MONDO:0006541
              label: epidermolysis bullosa
        context: []
      assertion_type: Subtype
      assertion:
        name: Dystrophic Epidermolysis Bullosa
        description: 'Cleavage occurs beneath the lamina densa in the uppermost dermis. Caused by mutations
          in COL7A1 encoding type VII collagen, the major component of anchoring fibrils. Both autosomal
          dominant and autosomal recessive forms exist. Recessive dystrophic EB is associated with severe
          scarring, pseudosyndactyly, esophageal strictures, and increased risk of squamous cell carcinoma.

          '
      selected_evidence:
        snippet: 'DEB is divided into two major types depending on inheritance pattern: recessive dystrophic
          epidermolysis bullosa (RDEB) and dominant dystrophic epidermolysis bullosa (DDEB)'
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/2
