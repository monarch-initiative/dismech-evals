      assertion:
        name: KLHL24 Gain-of-Function Drives Ubiquitin-Mediated Keratin 14 Degradation
        biological_scale: MOLECULAR
        description: 'Heterozygous start-codon variants in KLHL24 produce a receptor lacking its first
          28 residues, which can no longer autoubiquitinate and therefore accumulates. Keratin 14 is a
          substrate of this receptor, so the stabilized form drives excessive ubiquitination and degradation
          of keratin 14. The basal keratin network is depleted without any mutation in a keratin gene,
          which is why this node is drawn separately from the dominant-negative route. This is the node
          the EBS KLHL24 subtype row acts at.

          '
        genes:
        - preferred_term: KLHL24
          term:
            id: hgnc:25947
            label: KLHL24
        biological_processes:
        - preferred_term: ubiquitination of keratin 14
          modifier: INCREASED
          term:
            id: GO:0016567
            label: protein ubiquitination
        cell_types:
        - preferred_term: basal keratinocyte
          term:
            id: CL:0002187
            label: basal cell of epidermis
      selected_evidence:
        snippet: We have further identified keratin 14 (KRT14) as a KLHL24 substrate and found that KLHL24-ΔN28
          induces excessive ubiquitination and degradation of KRT14.
        supports: SUPPORT
        directness: DIRECT
