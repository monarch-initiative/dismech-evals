      assertion_type: Treatment
      assertion:
        name: Diacerein (Anti-IL-1beta Therapy)
        description: 'Topical diacerein 1% ointment, an anti-inflammatory agent that inhibits IL-1beta
          signaling. A phase 2/3 crossover trial (n=17) showed 86% of diacerein-treated patients achieved
          >40% blister reduction versus 14% with placebo. However, a larger randomized controlled trial
          (n=54) found no significant difference in the primary endpoint (>=60% BSA reduction at 8 weeks),
          though post hoc analysis in severe EBS showed a potential signal (46.2% vs 15.4% achieving optimal
          skin scores). Multiple ongoing trials continue to evaluate diacerein in EBS.

          '
        treatment_term:
          preferred_term: diacerein anti-IL-1beta therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: Diacerein
            term:
              id: NCIT:C166759
              label: Diacerein
      selected_evidence:
        snippet: Although there was no significant difference in outcomes between the groups, further
          study may elucidate the effects of diacerein on EBS lesions, especially in patients with severe
          EBS
        supports: SUPPORT
