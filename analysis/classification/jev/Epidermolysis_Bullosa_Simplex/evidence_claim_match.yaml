  38578f314cc79214280be28b77599d4c2a7b56a7cd3df7f90de013155bb198a7:
    claim:
      about:
        disease:
          name: Epidermolysis Bullosa Simplex
          disease_term:
            preferred_term: epidermolysis bullosa simplex
            term:
              id: MONDO:0017610
              label: epidermolysis bullosa simplex
        context: []
      assertion_type: Subtype
      assertion:
        name: EBS Localized (formerly Weber-Cockayne)
        display_name: EBS localized (EBS-loc; formerly Weber-Cockayne)
        subtype_term:
          preferred_term: epidermolysis bullosa simplex 1C, localized
          term:
            id: MONDO:0007551
            label: epidermolysis bullosa simplex 1C, localized
        mappings:
          mondo_mappings:
          - term:
              id: MONDO:0030527
              label: epidermolysis bullosa simplex 2C, localized
            mapping_predicate: skos:closeMatch
            mapping_source: MONDO
            mapping_justification: OMIM and MONDO split localized EBS by causal keratin gene. EBS1C (MONDO:0007551,
              OMIM 131800) carries MONDO's KRT14 gene association; EBS2C (MONDO:0030527, OMIM 619594)
              carries the KRT5 one. This row is the single clinical localized subtype and covers both
              routes, so the KRT5-side term is recorded here as a close match. Deliberately not an exact
              or narrow match, which would retire an uncurated concept from the curation queue.
        description: 'Blistering mainly confined to hands and feet, exacerbated by heat and increased
          physical activity. The mildest form of EBS and one of its most frequent variants. Onset typically
          in infancy or early childhood. Caused by heterozygous dominant-negative variants in either KRT14
          or KRT5, which OMIM and MONDO now code as two separate terms (EBS1C and EBS2C respectively)
          despite the same clinical picture. This row binds MONDO:0007551, the term that carries the Weber-Cockayne
          eponym together with the Orphanet localized-EBS and SNOMED cross-references, and records the
          KRT5-side term as a mapping.

          '
        genes:
        - preferred_term: KRT14
          term:
            id: hgnc:6416
            label: KRT14
        - preferred_term: KRT5
          term:
            id: hgnc:6442
            label: KRT5
        inheritance:
        - name: Autosomal dominant
      selected_evidence:
        snippet: We report novel keratin 5 and 14 gene mutations in four unrelated German families with
          the localized subtype of the dominantly inherited blistering disease epidermolysis bullosa simplex
          Weber-Cockayne (MIM# 131800)
        supports: SUPPORT
        directness: DIRECT
    origin:
