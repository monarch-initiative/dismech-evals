              close match for the same reason as the localized and intermediate rows.
        description: 'Grouped herpetiform blistering, palmoplantar keratoderma, and nail dystrophy. The
          most severe keratin-associated form of EBS. Blistering tends to improve with age, likely due
          to the suprabasal switch from K5/K14 to K1/K10 during keratinocyte differentiation reducing
          dependence on mutant basal keratins. Improvement with age is common in all variants of EBS but
          is not invariable. The pathognomonic transmission electron microscopy (TEM) finding is tonofilament
          (keratin) clumping in basal cells. Laryngeal involvement may occur. Caused by heterozygous dominant-negative
          variants in either KRT14 or KRT5, typically in the central rod domain.

          '
        genes:
        - preferred_term: KRT14
