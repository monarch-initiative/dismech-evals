      assertion_type: Pathophysiology
      assertion:
        name: Desmosomal Plaque Deficiency Causes Suprabasal Acantholysis
        biological_scale: CELLULAR
        description: 'The two suprabasal routes in this entry. Loss of plakophilin 1, a desmosomal plaque
          protein expressed mainly in the spinous layer, or truncation of the desmoplakin tail that carries
          desmoplakin''s intermediate filament-binding subdomains, detaches keratin filaments from desmosomes
          above the basal layer. The cleavage plane is therefore suprabasal rather than intrabasal, and
          the histology is acantholysis resembling pemphigus rather than basal-cell cytolysis. This node
          is drawn separately from the basal routes for that reason, and is where the EBS-PD and LAEB
          subtype rows act.

          '
        genes:
        - preferred_term: PKP1
          term:
            id: hgnc:9023
            label: PKP1
        - preferred_term: DSP
          term:
            id: hgnc:3052
            label: DSP
        biological_processes:
        - preferred_term: desmosome organization
          modifier: ABNORMAL
          term:
            id: GO:0002934
            label: desmosome organization
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: Histology showed suprabasal clefting and acantholysis throughout the spinous layer, mimicking
          pemphigus. Electron microscopy revealed disconnection of keratin intermediate filaments from
          desmosomes.
        supports: SUPPORT
        directness: DIRECT
