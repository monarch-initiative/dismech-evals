      assertion_type: Pathophysiology
      assertion:
        name: Exophilin-5 Deficiency Impairs Keratinocyte Vesicle Trafficking and Adhesion
        biological_scale: CELLULAR
        description: 'Biallelic EXPH5 truncating variants remove the C-terminus of exophilin-5 (Slac2-b),
          a Rab27B effector in intracellular vesicle trafficking. The product is not a structural component
          of the keratin-hemidesmosome apparatus, as the keratin, plectin and BPAG1-e routes'' products
          are; the route to fragility runs instead through disordered vesicle handling, with perinuclear
          and plasma-membrane-proximal vesicle accumulation, keratin filament disruption and reduced keratinocyte
          adhesion in the lower epidermis. This is the node the EBS EXPH5 subtype row acts at.

          '
        genes:
        - preferred_term: EXPH5
          term:
            id: hgnc:30578
            label: EXPH5
        biological_processes:
        - preferred_term: vesicle-mediated transport
          modifier: ABNORMAL
          term:
            id: GO:0016192
            label: vesicle-mediated transport
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: Analysis of an affected person's skin showed loss of Slac2-b immunostaining (C-terminal
          antibody), disruption of keratinocyte adhesion within the lower epidermis, and an increased
          number of perinuclear vesicles.
        supports: SUPPORT
        directness: DIRECT
