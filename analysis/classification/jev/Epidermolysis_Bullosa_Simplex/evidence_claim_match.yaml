        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'Desmoplakin, the desmosomal plaque protein that links the intermediate filament network
          to the desmosomal cadherins. Only the lethal acantholytic epidermolysis bullosa end of the DSP
