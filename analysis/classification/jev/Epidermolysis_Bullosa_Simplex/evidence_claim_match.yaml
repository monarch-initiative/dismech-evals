        inheritance:
        - name: Autosomal dominant
        notes: 'Keratin 5 gene on chromosome 12q13.13. Encodes the type II keratin that pairs with keratin
          14 in basal keratinocytes. Dominant-negative missense mutations, particularly in the helix boundary
          motifs, cause EBS. Hotspot mutations in the 1A and 2B rod domain helix boundaries correlate
          with more severe phenotypes. No `subtype` foreign key is set on this record: KRT5 is the causal
          gene of six of this entry''s subtype rows (localized, generalized intermediate, generalized
          severe, the recessive KRT5 row, mottled pigmentation, and migratory circinate erythema) and
          the slot holds one value. The gene-to-row mapping is carried on the rows themselves, each of
          which binds KRT5 in its `genes` list.

          '
      selected_evidence:
        snippet: the most important and most commonly occurring molecular defects in these patients are
          the defects of keratins 5 and14 (KRT5 and KRT14)
        supports: SUPPORT
