            label: Autosomal recessive inheritance
        description: 'Biallelic CD151 loss-of-function alleles. Every published proband is homozygous,
          and all but one arose in a consanguineous or founder pedigree; no compound heterozygote has
          been reported. Carriers are usually asymptomatic, but the recessive label should not be read
          as strictly all-or-nothing: in the Saudi pedigree two heterozygous sisters had partial phenotypes
          - one steroid-responsive nephrotic syndrome, the other hearing impairment with low-grade proteinuria
          - while other heterozygous relatives were unaffected. That is one family and is recorded in
          `discussions` rather than asserted as a general carrier phenotype.'
      selected_evidence:
        snippet: Nephrotic syndrome (NS)-epidermolysis bullosa (EB) sensorineural deafness syndrome is
          an autosomal recessive rare genetic disease caused by a CD151 gene homozygous mutation on chromosome
          11p15.5.
        supports: SUPPORT
