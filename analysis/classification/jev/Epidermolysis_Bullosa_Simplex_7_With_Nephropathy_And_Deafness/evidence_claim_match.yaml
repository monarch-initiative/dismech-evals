      assertion_type: ClinicalBurden
      assertion:
        burden_level: VARIABLE
        rationale: The renal arm dominates prognosis and is what makes the burden variable rather than
          uniformly high. All three probands in the founding pedigree reached end-stage kidney disease
          and two were on peritoneal dialysis; the Saudi proband reported eighteen years later had proteinuria
          detected incidentally at home and was managed on an oral ACE inhibitor. The skin disease is
          a lifelong dressing and wound-care burden but is not by itself life-limiting. Nothing in the
          cited sources characterises survival for the condition as a whole, so no mortality claim is
          made.
      selected_evidence:
        snippet: The findings emphasize that even a single genotype can result in variable phenotypic
          expression, necessitating the assessment of the pleiotropic effects of the disease on the patient,
          which can range from severe to mild.
        supports: SUPPORT
