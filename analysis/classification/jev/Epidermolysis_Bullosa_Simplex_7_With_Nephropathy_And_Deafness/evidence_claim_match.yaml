              id: MONDO:0012190
              label: epidermolysis bullosa simplex 7, with nephropathy and deafness
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cd151_renal_severity_modifiers_unknown
        status: OPEN
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Glomerular Basement Membrane Disorganization
        - phenotypes#Stage 5 chronic kidney disease
        prompt: What determines whether a CD151-null individual reaches end-stage kidney disease in adolescence
          or carries an incidental proteinuria into adulthood?
        rationale: 'The renal course is the most variable thing about this disease and nothing explains
          the variance. All three probands in the founding pedigree reached end-stage kidney disease;
          a later proband''s renal involvement was an incidental dipstick finding, on a comparably truncating
          allele. Allele severity therefore does not obviously predict outcome.

          The mouse says the missing factor is at least partly extrinsic to CD151. The same null allele
          produces early massive proteinuria and kidney failure on an FVB background and essentially no
          spontaneous kidney phenotype on C57BL/6, and the resistant background becomes susceptible once
          blood and transcapillary filtration pressure are raised. So there is a genetic modifier acting
          somewhere, and a haemodynamic gate on top of it, and in humans neither has been identified.

          This is a knowledge gap rather than a controversy: nobody has proposed competing answers, because
          the cohort needed to look for one does not exist. It is recorded because it bears directly on
          management - if filtration pressure is the gate, the case for early and sustained RAAS blockade
          in an asymptomatic CD151 patient is stronger than the single reported human drug response can
          establish on its own.'
      selected_evidence:
        snippet: Although global Cd151-null B6 mice were not susceptible to renal disease, as has been
          shown previously, increasing blood and transcapillary filtration pressure induced nephropathy
          in these mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22201679
      reference_title: Blood pressure influences end-stage renal disease of Cd151 knockout mice.
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      explanation: 'Establishes both halves of the gap: a strain-dependent modifier, and filtration pressure
        as a gate on the same lesion.'
