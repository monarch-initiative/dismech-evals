      assertion_type: Treatment
      assertion:
        name: Wound Care and Withdrawal of Immunosuppression
        description: 'Skin management is non-adherent dressings, protection and nutrition. The substantive
          therapeutic finding in this disease is a negative one: because the blistering is often mistaken
          for an acquired autoimmune blistering disease, patients are treated with immunosuppressants
          that cannot work on a structural adhesion defect. One proband had years of topical and systemic
          corticosteroids, minocycline, nicotinamide, mycophenolate mofetil and methotrexate with no benefit,
          and improved substantially once they were all withdrawn in favour of skin care. Stopping the
          wrong treatment is the actionable consequence of making the genetic diagnosis.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: wound care management
          term:
            id: NCIT:C116681
            label: Wound Care Management
      selected_evidence:
        snippet: She was tapered off of all forms of immunosuppressants, with a care plan that was shifted
          to careful skin care, nutrition, and ocular health.
        supports: SUPPORT
        directness: DIRECT
