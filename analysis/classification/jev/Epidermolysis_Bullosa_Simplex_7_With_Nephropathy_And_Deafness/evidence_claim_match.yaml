          Defect
        role: Shared molecular lesion upstream of all three organ arms
        description: 'CD151 normally clusters integrin alpha-3/beta-1 and alpha-6/beta-4 laterally and
          stabilises their engagement with laminin in the underlying basement membrane. In its absence
          the receptors are still expressed but the adhesion they mediate is weaker and less persistent.
          This single molecular failure is what makes the disorder multi-organ: the same integrin-laminin
          axis anchors basal keratinocytes to laminin-332 in skin and podocytes to laminin-521 in the
          glomerulus.'
        molecular_functions:
        - preferred_term: laminin binding by the CD151-integrin complex
          term:
            id: GO:0043236
            label: laminin binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: integrin-mediated cell-matrix adhesion
          term:
            id: GO:0033627
            label: cell adhesion mediated by integrin
          modifier: DECREASED
      selected_evidence:
        snippet: We show that CD151, through binding to integrin α3β1, plays a critical role in the stabilization
          of an adhesion structure with a distinct molecular composition of hemidesmosomes with tetraspanin
          features.
        supports: SUPPORT
        directness: DIRECT
    origin:
