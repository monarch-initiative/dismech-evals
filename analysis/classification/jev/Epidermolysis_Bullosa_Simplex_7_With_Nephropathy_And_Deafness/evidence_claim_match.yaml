      assertion_type: Pathophysiology
      assertion:
        name: CD151 Loss of Function
        biological_scale: MOLECULAR
        role: Initiating genetic lesion
        description: Biallelic CD151 alleles that truncate the protein before or within its large extracellular
          loop. The reported lesions are a frameshifting single-nucleotide insertion stopping translation
          at codon 140, a donor splice-site change that removes the whole of exon 5, and the nonsense
          alleles p.Gln136* and p.Arg165*. What they have in common is loss of the integrin-binding region,
          so the resulting protein cannot perform the one function CD151 has in this disease.
        genetic_context:
          gene:
            preferred_term: CD151
            term:
              id: hgnc:1630
              label: CD151
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: All published alleles are truncating and homozygous. No missense or hypomorphic
            allele has been reported, so there is no allelic series here to grade severity against.
        genes:
        - preferred_term: CD151
          term:
            id: hgnc:1630
            label: CD151
      selected_evidence:
        snippet: The resultant truncated protein would lack its integrin-binding domain.
        supports: SUPPORT
        directness: DIRECT
