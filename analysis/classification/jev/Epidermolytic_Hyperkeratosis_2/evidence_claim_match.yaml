              label: epidermolytic hyperkeratosis 2
        context: []
      assertion_type: Genetic
      assertion:
        name: KRT10 heterozygous dominant-negative variants
        gene_term:
          preferred_term: KRT10
          term:
            id: hgnc:6413
            label: KRT10
        association: Causative
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal Dominant
        notes: 'Heterozygous missense variants and small in-frame changes in the conserved 1A helix initiation
          motif (Arg10 recurrent), the 2B segment and the helix termination motif. Mild atypical disease
          resembling peeling skin syndrome has been reported with L12 linker variants. Severity is more
          variable than with KRT1: in a German cohort KRT10 patients were spread evenly across localized,
          intermediate and severe forms. This row covers subtypes EHK2A and AEI1; `Genetic.subtype` is
          single-valued, so those rows carry the reciprocal link through their own `genes` descriptors.
          KRT10 frameshifts into the alternative arginine-rich reading frame cause ichthyosis with confetti,
          which is a different disease and is not covered here.'
      selected_evidence:
        snippet: In most cases of severe EI, heterozygous single point mutations are found at the highly
          conserved helix boundary motifs of KRT1 and KRT10 that play a critical role in filament formation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
