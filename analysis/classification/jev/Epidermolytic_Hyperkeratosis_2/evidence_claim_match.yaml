          cause transcript decay and complete absence of keratin 10 protein in the epidermis. The suprabasal
          network then lacks its type I partner; wound keratins K6, K16 and K17 are induced but do not
          compensate. One normal KRT10 allele is sufficient for network formation, so carriers are unaffected.
          This node conforms to the module's variant-initiation node as the loss-of-function route into
