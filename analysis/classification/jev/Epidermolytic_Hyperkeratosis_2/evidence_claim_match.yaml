        notes: Left unbound. HP:0034067 Tonofilament clumping is the matching concept but lies outside
          the HistopathologyFindingTerm enum (it is not under HP:0025461 Abnormal cell morphology). The
          nearest NCIT ultrastructural term found by OLS search for "intermediate filament aggregate",
          NCIT:C45956 Concentric Aggregates of Intermediate Filaments Present, names a concentric arrangement
          that the sources do not describe.
      selected_evidence:
        snippet: Histologic examination showed the typical pathology of epidermolytic hyperkeratosis,
          and ultrastructural analysis revealed abnormal keratin filament networks and tonofilament clumping
          with a perinuclear distribution.
