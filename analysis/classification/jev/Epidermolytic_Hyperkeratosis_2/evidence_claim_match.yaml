              id: MONDO:0958184
              label: epidermolytic hyperkeratosis 2
        context: []
      assertion_type: Subtype
      assertion:
        name: AEI1
        display_name: Annular Epidermolytic Ichthyosis 1 (KRT10)
        subtype_term:
          preferred_term: annular epidermolytic ichthyosis, KRT10 type
          term:
            id: MONDO:0100303
            label: ichthyosis, annular epidermolytic 1
        description: Dominant variant of KRT10 epidermolytic ichthyosis with bullous ichthyosis in early
          childhood, later flexural and extensor lichenified hyperkeratotic plaques, and intermittent
          flares of annular, polycyclic, erythematous scaly plaques on the trunk and proximal limbs. Reported
          KRT10 variants lie in the 2B helical segment and its helix termination motif. MONDO places this
          class under both MONDO:0958184 and MONDO:0011870 annular epidermolytic ichthyosis; its KRT1
          sibling, MONDO:0859574, is a subtype row of KRT1_Keratinopathies.
        genes:
        - preferred_term: KRT10
          term:
            id: hgnc:6413
            label: KRT10
        inheritance:
        - name: Autosomal dominant inheritance
          description: Annular epidermolytic ichthyosis segregates as a dominant trait across two affected
            generations.
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Molecular analysis revealed a novel tandem CG to GA 2-bp mutation in the same allele
          of keratin 10 in affected individuals, resulting in an arginine to glutamate substitution at
          residue 83 (R83E) of the 2B helical segment. We conclude that annular epidermolytic ichthyosis
          should be considered a variant of bullous congenital ichthyosiform erythroderma.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/2
      evidence_path: /has_subtypes/2/evidence/0
      context_paths:
      - /name
      - /disease_term
