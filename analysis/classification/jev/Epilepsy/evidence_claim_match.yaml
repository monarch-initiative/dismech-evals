          term:
            id: MONDO:0012960
            label: intellectual disability, autosomal dominant 5
        description: 'A monogenic developmental and epileptic encephalopathy caused by SYNGAP1 haploinsufficiency.
          Presents with intellectual disability, generalized epilepsy, and autism spectrum-associated
          behavioral and sensory abnormalities. Individuals typically present in infancy with global developmental
          delay and hypotonia, with later-onset generalized epilepsy characterized by atypical absences,
          myoclonic and myoclonic-atonic seizures, and eyelid myoclonia with reflex triggers. Drug resistance
          is common, and developmental regression frequently coincides with seizure and EEG worsening.
          Nearly all individuals manifest moderate-to-severe intellectual disability with disproportionately
          severe expressive language impairment, autism spectrum features, ADHD-like symptoms, severe
          irritability, and marked sensory abnormalities.

          '
      selected_evidence:
        snippet: most individuals present in infancy with global developmental delay, hypotonia, and later-onset
