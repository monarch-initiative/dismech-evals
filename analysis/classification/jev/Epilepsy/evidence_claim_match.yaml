          PTE include dysregulation of immediate-early genes and MAPK signaling components, reflecting
          a common pathological trajectory from acute brain injury to chronic epileptogenesis. DUSP1 and
          EGR1 emerge as hub genes linking TBI and PTE, functioning at the intersection of neuroprotective
          and epileptogenic processes.

          '
