      assertion_type: Pathophysiology
      assertion:
        name: Mitochondria-Associated Endoplasmic Reticulum Membrane Dysfunction
        description: 'Mitochondria-associated endoplasmic reticulum membranes (MAMs) are specialized inter-organellar
          contact sites that regulate calcium signaling, lipid metabolism, mitochondrial dynamics, autophagy,
          and oxidative stress responses. A 2026 review consolidating molecular and genetic evidence identifies
          MAMs as a critical hub in epilepsy and proposes that dysregulation of the processes they regulate
          may contribute to seizure initiation and progression, with particular relevance to drug-resistant
          epilepsy. The specific route from MAM dysfunction to a pro-epileptic state is proposed rather
          than established: the cited source does not report calcium-sequestration defects, ion-channel
          gating changes, or lipid-peroxidation measurements in epileptic tissue.

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: Calcium-Mediated Signaling
          term:
            id: GO:0019722
            label: calcium-mediated signaling
          modifier: DYSREGULATED
        - preferred_term: Mitochondrial Dynamics
          term:
            id: GO:0007005
            label: mitochondrion organization
          modifier: DYSREGULATED
        - preferred_term: Autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: DYSREGULATED
        - preferred_term: Oxidative Stress Response
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: DYSREGULATED
        notes: 'This node rests on a single sentence from a single review, and that is the honest state
          of the evidence for the mechanism rather than an artifact of light curation. Two further sentences
          from the same abstract were considered and rejected as evidence: the opening "This review examines
          the potential role ... and how dysregulation of these processes may contribute" is a statement
          of what the review sets out to analyze, and the closing sentence on small-molecule, nanodelivery
          and neuromodulation strategies is about therapeutics and would belong in treatments if anywhere.
          Neither is a finding. The two downstream edges are therefore labelled as proposed; they should
          be re-evaluated, and the node''s biological_processes modifiers re-graded, when primary experimental
          work on MAMs in epileptic tissue becomes citable.'
      selected_evidence:
        snippet: By consolidating current molecular and genetic evidence, we identify MAMs as a critical
          hub in epilepsy and propose that targeting their integrity and function may represent a strategy
          to overcome drug resistance and modify disease progression.
        supports: SUPPORT
    origin:
