        name: EGR1-Mediated Neuroplasticity and Network Remodeling
        description: 'Early growth response 1 (EGR1) is an immediate-early transcription factor that plays
          dual roles in post-traumatic brain pathophysiology. Following TBI, EGR1 expression is rapidly
          induced and promotes neuroprotection by regulating neurotrophic factor expression supporting
          neuronal survival, repair, and circuit reconstruction. However, excessive or sustained EGR1
          activation also contributes to maladaptive synaptic reorganization, promoting neuronal hyperexcitability
          and epileptogenic network remodeling. This dual role positions EGR1 at the critical juncture
          between post-traumatic recovery and epileptogenesis, where dysregulation can shift the balance
          toward pathological outcomes.

          '
