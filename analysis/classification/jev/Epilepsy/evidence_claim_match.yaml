            label: MAPK cascade
          modifier: DECREASED
        - preferred_term: Inflammatory Response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: DECREASED
      selected_evidence:
        snippet: By suppressing excessive inflammatory activation, DUSP1 may reduce secondary neuronal
          injury and potentially influence the development of PTE.
        supports: SUPPORT
