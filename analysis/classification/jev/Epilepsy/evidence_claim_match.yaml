      assertion:
        name: DUSP1-Mediated MAPK Negative Regulation
        description: 'Dual-specificity phosphatase 1 (DUSP1) functions as a negative regulator of mitogen-activated
          protein kinase (MAPK) signaling through dephosphorylation of phosphorylated MAPK substrates.
          Following TBI, DUSP1 expression is significantly elevated, promoting neuroprotection by attenuating
          excessive MAPK pathway activation. DUSP1-mediated MAPK suppression reduces pro-inflammatory
          cytokine production, inhibits microglial and astrocytic activation, and mitigates secondary
          neuronal injury, thereby limiting the pathological cascade that contributes to post-traumatic
          epileptogenesis.

          '
        cell_types:
        - preferred_term: Microglia
          term:
            id: CL:0000129
            label: microglial cell
        - preferred_term: Astrocyte
          term:
            id: CL:0000127
            label: astrocyte
