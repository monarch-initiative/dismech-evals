      assertion_type: Pathophysiology
      assertion:
        name: Lipoxygenase-Mediated Lipid Peroxidation and Eicosanoid Signaling
        description: 'Lipoxygenase (LOX) enzymes, particularly 5-LOX and 12/15-LOX, catalyze the generation
          of bioactive lipid metabolites (eicosanoids including leukotrienes and lipoxins) from arachidonic
          acid. LOX-mediated lipid peroxidation contributes to oxidative stress and pro-inflammatory signaling,
          with dysregulation of LOX activity contributing to blood-brain barrier disruption, glial cell
          activation, cytokine release, immune cell infiltration, and neuronal hyperexcitability. These
          eicosanoid mediators propagate neuroinflammatory cascades that promote seizure susceptibility
          and drug-resistant epilepsy.

          '
        cell_types:
        - preferred_term: Microglia
          term:
            id: CL:0000129
            label: microglial cell
        - preferred_term: Astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: Endothelial Cell
