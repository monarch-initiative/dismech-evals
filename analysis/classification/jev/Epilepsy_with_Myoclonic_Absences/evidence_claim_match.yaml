            relating its build-up to discharge features and to brainstem reflex measures, to test whether
            it is a slow envelope of the same cortical drive or an independently generated phenomenon.
          decision_criterion: A tonic component that tracks discharge parameters would indicate a single
            cortical generator with two output timescales. A tonic component that varies independently
            and correlates with brainstem measures would establish a second generator, and would explain
            why this syndrome sits closer than typical absence epilepsy to the tonic-seizure epilepsies
            it sometimes evolves into.
      selected_evidence:
        snippet: Myoclonic absences (MAs) were characterized by rhythmic, bilateral, synchronous, symmetric
          3-Hz spike-wave discharges, associated with EMG myoclonic bursts at 3 Hz, superimposed on a
