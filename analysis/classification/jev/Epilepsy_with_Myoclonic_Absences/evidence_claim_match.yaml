      assertion_type: Pathophysiology
      assertion:
        name: Drug-Resistant Course with Cognitive Decline in a Subset
        biological_scale: ORGANISM
        description: The outcome splits, and it splits along a line that is visible at diagnosis. Children
          whose only seizure type is the myoclonic absence generally do well on combination therapy. Children
          who also have generalized tonic-clonic seizures do worse, and a subset deteriorate cognitively
          or evolve toward Lennox-Gastaut syndrome. Whether that reflects two different diseases wearing
          the same seizure or one disease with variable severity is unresolved and is curated as a discussion.
      selected_evidence:
        snippet: The more benign cases usually present with MA as the only seizure type, while patients
          who experience other seizures, especially generalised tonic-clonic seizures, in association
          with MA may have a less favourable outcome.
        supports: SUPPORT
