      assertion_type: Inheritance
      assertion:
        name: Presumed polygenic, mostly sporadic
        description: No single-gene inheritance pattern is established. Most cases are sporadic, although
          sibling pairs are reported, and the syndrome sits within the genetic generalized epilepsies
          whose liability is generally polygenic. A minority of cases are symptomatic, occurring on the
          background of an identifiable structural or chromosomal abnormality, and those are not heritable
          in the same sense at all.
        inheritance_term:
          preferred_term: Sporadic
          term:
            id: HP:0003745
            label: Sporadic
      selected_evidence:
        snippet: Idiopathic and symptomatic EMAs need to be differentiated from childhood absence epilepsy
          with myoclonia.
        supports: SUPPORT
