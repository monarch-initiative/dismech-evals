  09142c3100b341e33ac728da5e8f32a7649ddcfcd5d9b178d9ab5c632ce3cc15:
    claim:
      about:
        disease:
          name: Epilepsy with Myoclonic Absences
          disease_term:
            preferred_term: epilepsy with myoclonic absences
            term:
              id: MONDO:0019487
              label: epilepsy with myoclonic absences
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ema_distinct_syndrome_or_absence_variant
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: Is epilepsy with myoclonic absences a distinct syndrome, or is it childhood absence epilepsy
          with a prominent myoclonic accompaniment that happens to have been named separately?
        attaches_to:
        - pathophysiology#Hypersynchronous Three-Hertz Thalamocortical Spike-Wave Oscillation
        - pathophysiology#Cycle-Locked Recruitment of Motor Output
        rationale: 'The syndrome was defined on a seizure type rather than on an etiology, an age, or
          a gene, and the literature that defined it now describes it as a somewhat controversial entity
          in those words. The case for distinctness is real: the motor recruitment is not a soft accompaniment
          but a cycle-by-cycle coupling with a separate progressive tonic component, the sex ratio runs
          the opposite way to childhood absence epilepsy, drug resistance is commoner, and a subset evolve
          toward Lennox-Gastaut, which typical absences do not. The case against is equally real: the
          electroencephalographic discharge is explicitly described as similar to that of childhood absence
          epilepsy, no distinct genetic or structural basis has been identified, and myoclonic components
          have since been described across a range of generalized epilepsies with absences, which erodes
          the specificity of the original defining observation. If myoclonic accompaniments form a continuum,
          then where this syndrome ends and childhood absence epilepsy with myoclonia begins is a matter
          of degree, and the boundary is drawn by whoever is holding the electromyography leads. The practical
          stake is not trivial: the label carries a worse prognosis and a lower threshold for surgical
          referral, so misassignment in either direction changes what a family is told.'
        proposed_experiments:
        - experiment_id: exp_ema_quantitative_myoclonus_continuum
          name: Quantitative polygraphic comparison across absence syndromes
          description: Apply identical quantitative electromyographic analysis, measuring burst amplitude,
            the proportion of discharge cycles carrying a burst, and tonic baseline drift, to unselected
            children with absence seizures across the syndromes, and test whether the distribution is
            bimodal, which would support two entities, or continuous, which would support one.
          decision_criterion: A bimodal distribution with a gap between myoclonic absences and other absences
            with myoclonic accompaniment would support distinctness. A continuous distribution would show
            the boundary is conventional, and the syndrome would be better modeled as a severity region
            of a spectrum.
        - experiment_id: exp_ema_genetic_architecture_comparison
          name: Shared versus distinct genetic architecture with childhood absence epilepsy
          description: Compare common-variant liability and rare-variant burden between children meeting
            criteria for epilepsy with myoclonic absences and children with childhood absence epilepsy,
            ascertained in the same centres with the same polygraphic protocol.
          decision_criterion: A shared genetic architecture would support one spectrum with the motor
            phenotype as a modifier. A distinguishable architecture would support two entities and would
            give the syndrome a basis beyond its seizure semiology.
      selected_evidence:
        snippet: the sound and evident clinical characteristics on which it was identified some 30 years
          ago have evolved, mostly as a consequence of changes in the practical management of epilepsies
          and to the description of myoclonic components in a variety of other generalised epilepsies
          with absences
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17044728
      reference_title: Epilepsy with myoclonic absences.
      evidence_source: OTHER
      explanation: Gives the specific reason the boundary has eroded, namely that the defining feature
        turned out not to be unique to this syndrome.
