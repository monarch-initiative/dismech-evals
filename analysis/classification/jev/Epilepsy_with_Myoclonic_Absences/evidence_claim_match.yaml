            term:
              id: MONDO:0019487
              label: epilepsy with myoclonic absences
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cycle-Locked Recruitment of Motor Output
        biological_scale: CELLULAR
        description: This is the node that makes the syndrome what it is. Each spike-wave cycle is accompanied
          by a muscle burst at the same three-per-second rate, and the relation is described as strict
          rather than approximate, which is what distinguishes a driven motor output from an incidental
          one. Superimposed on the rhythmic jerks is a tonic contraction that builds progressively through
          the seizure, raising the arms, and it is a separate phenomenon from the jerks rather than their
          summation. Why the same oscillation engages motor cortex and corticospinal output here and not
          in childhood absence epilepsy is not known, and is recorded as a knowledge gap.
        biological_processes:
        - preferred_term: regulation of postsynaptic membrane potential
          term:
            id: GO:0060078
            label: regulation of postsynaptic membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: Neurophysiologically, axial hypertonia and rhythmic jerks may be recorded on polygraphic
          surface electromyogram leads in association with the typical SW discharges
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17044728
      reference_title: Epilepsy with myoclonic absences.
      evidence_source: OTHER
      explanation: Establishes that both the tonic and the myoclonic components are measurable motor phenomena
        time-locked to the discharge, which is the content of this node.
