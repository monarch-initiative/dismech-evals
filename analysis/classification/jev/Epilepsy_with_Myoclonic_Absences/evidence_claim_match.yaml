      assertion_type: Treatment
      assertion:
        name: Ketogenic diet for glucose transporter deficiency
        description: The one genotype-directed and mechanistically corrective treatment available in this
          syndrome, and it applies only to the small group whose myoclonic absences are caused by SLC2A1
          variants. In glucose transporter type 1 deficiency the brain cannot import enough glucose; ketones
          enter by a different transporter that is intact, so a ketogenic diet supplies the fuel the broken
          protein cannot. That makes testing for the gene worth doing even though it explains few cases,
          because the finding changes the treatment rather than only the label.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Ketogenic Diet
          term:
            id: NCIT:C173168
            label: Ketogenic Diet
      selected_evidence:
        snippet: Glucose transporter type 1 deficiency syndrome (GLUT1DS) is an inborn error of brain
          energy metabolism characterized by impaired glucose transport into the brain.
        supports: SUPPORT
