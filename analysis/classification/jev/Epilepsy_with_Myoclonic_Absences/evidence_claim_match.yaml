      assertion:
        name: Epilepsy with Myoclonic-Atonic Seizures
        disease_term:
          preferred_term: epilepsy with myoclonic atonic seizures
          term:
            id: MONDO:0014633
            label: epilepsy with myoclonic atonic seizures
        description: 'A nomenclature trap as much as a clinical one. The names differ by one word and
          this entry now curates an atonic seizure phenotype in 40 percent of patients, so the two are
          easy to conflate on paper. The seizures are not the same event: there the myoclonic jerk and
          the loss of tone are one sequence producing a fall, here the jerks are locked to each spike-wave
          cycle on a rising background of tonic contraction, and the atonic component when present is
          an additional feature rather than the defining one.'
        distinguishing_features:
        - The defining seizure is a myoclonic-atonic drop attack, not an absence with cycle-locked myoclonus.
        - Consciousness is not the primary casualty; the fall is.
        - Classified by the ILAE among the developmental and epileptic encephalopathies rather than among
          the generalized epilepsies.
        - No progressive tonic contraction building through the seizure.
      selected_evidence:
        snippet: 'developmental and/or epileptic encephalopathies, comprising five syndromes: epilepsy
          with myoclonic-atonic seizures, Lennox-Gastaut syndrome, developmental and/or epileptic encephalopathy
          with spike-and-wave activation in sleep, hemiconvulsion-hemiplegia-epilepsy syndrome, and febrile
          infection-related epilepsy syndrome.'
        supports: SUPPORT
