        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypersynchronous Three-Hertz Thalamocortical Spike-Wave Oscillation
        biological_scale: CELLULAR
        conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
        description: The engine of the seizure is the same thalamocortical loop oscillation that produces
          typical absences, discharging bilaterally, synchronously, and symmetrically at three per second.
          The literature makes the equivalence explicit, comparing it directly to the discharge of childhood
          absence epilepsy. Because the oscillation itself is shared, nothing about this node explains
          what makes the syndrome different; the difference is entirely in what the oscillation is coupled
          to downstream.
        cell_types:
        - preferred_term: pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
      selected_evidence:
        snippet: The ictal EEG shows bilateral, synchronous and symmetrical spike and wave discharges
          repeated at 3 Hz (similar to that observed in typical absences of childhood absence epilepsy)
          in strict relation with myoclonias recorded on EMG.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15737698
      reference_title: Epilepsy with myoclonic absences.
      evidence_source: OTHER
      explanation: 'States both halves of what this entry turns on: the discharge is the same as in childhood
        absence epilepsy, and it is in strict temporal relation with the muscle jerks.'
