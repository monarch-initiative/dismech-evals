      assertion_type: Diagnosis
      assertion:
        name: Video-electroencephalography with surface electromyography
        description: The diagnostic test, and the reason the syndrome is under-recognized. The electroencephalogram
          alone shows generalized three-hertz spike-wave and looks like childhood absence epilepsy. What
          makes the diagnosis is simultaneous electromyography from the deltoids showing myoclonic bursts
          locked to each discharge on a rising baseline of tonic contraction. Without video and polygraphy
          the diagnosis is routinely missed.
        diagnosis_term:
          preferred_term: Electroencephalography
          term:
            id: NCIT:C38054
            label: Electroencephalography
        results: Generalized three-hertz spike-wave with time-locked myoclonic bursts on surface electromyography,
          superimposed on a progressively increasing tonic contraction.
      selected_evidence:
        snippet: Myoclonic absences (MAs) were characterized by rhythmic, bilateral, synchronous, symmetric
          3-Hz spike-wave discharges, associated with EMG myoclonic bursts at 3 Hz, superimposed on a
          progressively increasing tonic muscle contraction.
        supports: SUPPORT
