        name: Avoidance of carbamazepine and other seizure-aggravating drugs
        description: 'Sodium channel blockers aggravate generalized absence seizures, and in this syndrome
          the effect has been documented dramatically: seizure frequency rose from five to a hundred a
          day on carbamazepine and phenobarbitone, and fell on withdrawal. This is a mechanism-derived
          contraindication, not a tolerability issue, and it matters because the conspicuous motor component
          invites a misdiagnosis of focal epilepsy, for which carbamazepine would be a natural choice.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive Care
