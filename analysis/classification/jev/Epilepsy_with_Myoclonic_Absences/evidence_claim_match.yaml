  0337057f619e59e5713d43b5069ece4582d97389bc83ac502c0f77ab85360853:
    claim:
      about:
        disease:
          name: Epilepsy with Myoclonic Absences
          disease_term:
            preferred_term: epilepsy with myoclonic absences
            term:
              id: MONDO:0019487
              label: epilepsy with myoclonic absences
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ema_two_diseases_behind_one_seizure
        kind: CONTROVERSY
        status: OPEN
        prompt: The outcome splits sharply according to whether generalized tonic-clonic seizures accompany
          the myoclonic absences. Are these two different diseases sharing a seizure type, or one disease
          with a severity gradient?
        attaches_to:
        - pathophysiology#Drug-Resistant Course with Cognitive Decline in a Subset
        - pathophysiology#Heritable Thalamocortical Susceptibility
        rationale: 'The prognostic split is unusually clean for a childhood epilepsy. Children with myoclonic
          absences as their only seizure type generally respond to combination therapy and do well; children
          who also have generalized tonic-clonic seizures often persist, deteriorate cognitively, or move
          toward Lennox-Gastaut syndrome. The two-disease reading takes the associated tonic-clonic seizures
          as a marker of a different underlying condition, most obviously a symptomatic form with a structural
          or chromosomal cause that happens to express myoclonic absences among its seizure types; the
          literature already distinguishes idiopathic from symptomatic forms, which gives this reading
          a foothold. The one-disease reading takes the tonic-clonic seizures as a severity marker of
          the same liability, on the grounds that additional seizure types accompany greater severity
          across the generalized epilepsies generally, and notes that no distinct etiology has actually
          been demonstrated for the worse-outcome group. A newer case series complicates both by identifying
          an atonic component as a separate and strong predictor of medication failure, three quarters
          of that subgroup failing to reach seizure freedom, which suggests the relevant stratification
          may not be the one the older literature drew. The stake is prognostic honesty: a family told
          at diagnosis that this syndrome usually responds well to valproate and ethosuximide is being
          given the statistics of a subgroup their child may not belong to.'
        proposed_experiments:
        - experiment_id: exp_ema_etiology_stratified_outcome_cohort
          name: Etiology-stratified outcome cohort with systematic investigation
          description: A multicentre cohort in which every child meeting polygraphic criteria receives
            the same investigation, including high-resolution imaging, chromosomal microarray, and epilepsy
            gene panel, with outcome recorded against both the presence of generalized tonic-clonic seizures
            and the presence of an identified etiology and of an atonic component.
          decision_criterion: If poor outcome tracks identified etiology rather than seizure co-occurrence,
            the two-disease reading is supported and the prognosis should be given on etiology. If poor
            outcome tracks seizure co-occurrence independently of etiology, it is a severity marker within
            one disease.
      selected_evidence:
        snippet: The evolution is variable and seems to depend on the existence or not of GTCS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15737698
      reference_title: Epilepsy with myoclonic absences.
