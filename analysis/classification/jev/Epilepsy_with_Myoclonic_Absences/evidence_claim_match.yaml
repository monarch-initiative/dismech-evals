      assertion:
        name: SLC2A1
        gene_term:
          preferred_term: SLC2A1
          term:
            id: hgnc:11005
            label: SLC2A1
        relationship_type: CAUSATIVE
        association: 'Glucose transporter type 1 deficiency, caused by SLC2A1 variants, usually produces
          typical absences but can present with myoclonic absences. This is the single most management-relevant
          genetic cause in the syndrome, because the disease is an energy-delivery failure rather than
          a channel problem and it has a specific treatment: ketones reach the brain by a different transporter,
          so a ketogenic diet bypasses the broken one. A child with myoclonic absences who is not responding
          as expected is a child worth testing for this.'
      selected_evidence:
        snippet: Here we describe a novel Turkish patient with a hot-spot mutation (R126C) in the SLC2A1
          gene who presented with unusual myoclonic absence epilepsy and paroxysmal shivering.
        supports: SUPPORT
