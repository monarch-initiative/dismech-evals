        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a three-hertz thalamocortical spike-wave discharge drive rhythmic myoclonus and
          a building tonic contraction in this syndrome, when the same discharge produces a motionless
          stare in childhood absence epilepsy?
        attaches_to:
        - pathophysiology#Cycle-Locked Recruitment of Motor Output
        - pathophysiology#Hypersynchronous Three-Hertz Thalamocortical Spike-Wave Oscillation
        rationale: 'This is the central unexplained fact of the syndrome and it is unusually well-posed,
          because the confounder is controlled by nature: the oscillation is described as similar in the
          two conditions, so whatever differs is downstream of it. Several accounts are available and
          none has been tested against the others. The discharge may involve motor cortex in this syndrome
          and not in childhood absence epilepsy, which is a straightforward source-localization question
          that modern high-density recording could answer and apparently has not. The coupling between
          cortical discharge and corticospinal output may be abnormally strong, which is a corticomuscular
          coherence question. The tonic component may not share a generator with the jerks at all, since
          it builds progressively rather than following the three-hertz rhythm, which would suggest a
          separate brainstem or reticulospinal contribution running in parallel. Or the difference may
          lie in developmental maturation of descending motor pathways, which would predict that age at
          onset, later here than in childhood absence epilepsy, is part of the explanation rather than
          an incidental demographic fact. Answering this would also bear directly on the nosological dispute
          curated alongside it, because a demonstrated difference in generator would settle the question
          of whether this is a separate entity.'
