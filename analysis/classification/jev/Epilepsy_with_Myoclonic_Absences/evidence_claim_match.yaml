        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Rhythmic Myoclonus with Progressive Tonic Contraction
        biological_scale: ORGANISM
        conforms_to: epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures
        description: 'The visible seizure: rhythmic bilateral jerking of shoulders, arms, and legs at
          three per second, with the arms rising progressively as axial tone builds. Seizures occur many
          times a day, which is part of why the syndrome is disabling out of proportion to the individual
          event. In a substantial minority an atonic component is present instead of or alongside the
          tonic one, and those children do markedly worse on medication.'
      selected_evidence:
        snippet: Of patients with an atonic component, 75% did not achieve seizure freedom with medication
          alone.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
