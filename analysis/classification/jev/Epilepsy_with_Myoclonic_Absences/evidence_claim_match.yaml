      assertion:
        name: Cytogenetic testing (karyotype or chromosomal microarray)
        description: Worth doing rather than relying on a gene panel alone, because the reported chromosomal
          causes of this syndrome are copy number changes that sequencing a gene list will not find. Trisomy
          12p is the best-documented example, and the authors of that report argue from it that myoclonic
          absences can be a direct or indirect consequence of a chromosomal abnormality in at least some
          patients. This is the test that separates the symptomatic form from the idiopathic one when
          imaging is unrevealing.
        diagnosis_term:
          preferred_term: Cytogenetic Analysis
          term:
            id: NCIT:C18280
            label: Cytogenetic Analysis
        results: A copy number abnormality in the symptomatic minority; normal in the idiopathic form.
      selected_evidence:
        snippet: Our patient and other sporadic reports in the literature seem to support the hypothesis
          that, at least in some cases, myoclonic absences can be a direct or indirect effect of a chromosomopathy.
        supports: SUPPORT
