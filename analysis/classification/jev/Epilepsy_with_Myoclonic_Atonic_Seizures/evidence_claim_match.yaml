    claim:
      about:
        disease:
          name: Epilepsy with Myoclonic-Atonic Seizures
          disease_term:
            preferred_term: epilepsy with myoclonic atonic seizures
            term:
              id: MONDO:0014633
              label: epilepsy with myoclonic atonic seizures
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: doose-gat1-lof-paradox
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired GABA Transporter (GAT-1) Function
        - pathophysiology#Disrupted GABAergic Inhibitory Balance
        prompt: 'GAT-1 clears GABA from the synapse, so loss of function would naively be expected to
          raise synaptic GABA and increase inhibition - yet SLC6A1 loss-of-function causes epilepsy. By
          what mechanism does reduced GABA re-uptake produce seizures: chronic receptor desensitization,
          a shift in the balance of phasic versus tonic inhibition, impaired reverse (tonic-supplying)
          transport, or a developmental effect on circuit maturation?'
        rationale: Resolving this paradox is central to rational therapy for SLC6A1 epilepsy, including
          whether GABAergic drugs help or harm and whether GAT-1-directed precision approaches are viable.
          The loss-of-function-yet-epileptogenic relationship is documented but its circuit-level explanation
          is unsettled.
        proposed_experiments:
        - experiment_id: doose-gat1-inhibition-balance
          name: Phasic/tonic inhibition study of GAT-1 loss of function
          description: Use human iPSC-derived neurons and Gat1-deficient models carrying EMAtS SLC6A1
            variants to dissect how reduced GABA re-uptake alters phasic versus tonic inhibition and network
            excitability, and to test GABAergic and GAT-1-directed interventions.
          readouts:
          - name: Phasic versus tonic inhibition and network excitability
            target: pathophysiology#Disrupted GABAergic Inhibitory Balance
          would_support:
          - pathophysiology#Impaired GABA Transporter (GAT-1) Function
      selected_evidence:
        snippet: It is intriguing that the inhibition of SLC6A1-encoding GABA transporter 1 (GAT-1) increases
          tonic inhibition and gives rise to absence seizures in animal models
        supports: SUPPORT
        directness: DIRECT
