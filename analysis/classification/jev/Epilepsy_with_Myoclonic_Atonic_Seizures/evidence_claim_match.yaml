      assertion:
        name: SLC6A1
        gene_term:
          preferred_term: SLC6A1
          term:
            id: hgnc:11042
            label: SLC6A1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: SLC6A1 encodes the GABA transporter GAT-1; loss-of-function variants are the best-established
          single-gene cause of EMAtS and impair GABAergic inhibition.
      selected_evidence:
        snippet: GAT-1, encoded by SLC6A1, is one of the major gamma-aminobutyric acid (GABA) transporters
          in the brain and is responsible for re-uptake of GABA from the synapse. ... In this study, targeted
          resequencing of 644 individuals with epileptic encephalopathies led to the identification of
          six SLC6A1 mutations in seven individuals, all of whom have epilepsy with myoclonic-atonic seizures
          (MAE). ... Overall, pathogenic mutations occurred in 6/160 individuals with MAE, accounting
          for ~4% of unsolved MAE cases.
        supports: SUPPORT
