        - preferred_term: synaptic transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
        locations:
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
            label: cerebellum
      selected_evidence:
        snippet: 4-AP restores the severely diminished precision of pacemaking in Purkinje cells of EA2
          mutant mice by prolonging the action potential and increasing the action potential afterhyperpolarization.
        supports: SUPPORT
