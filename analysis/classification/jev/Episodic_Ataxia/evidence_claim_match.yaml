              label: hereditary episodic ataxia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical Attack Characterization and Interictal Examination
        description: 'Clinical diagnosis begins with characterization of attack history: onset age, duration
          (seconds–minutes in EA1; hours in EA2), frequency, and associated symptoms (ataxia, dysarthria,
          nausea, vertigo). Precipitating triggers including physical exertion, emotional stress, or startle
          should be documented. Interictal neurological examination is key for subtyping: myokymia (rippling
          of muscles, most visible perioral or in the hands) is characteristic of EA1; nystagmus (gaze-evoked
          or downbeat) is characteristic of EA2. Attacks with normal or near-normal interictal neurological
          function indicate episodic channelopathy and should prompt molecular genetic testing.'
        diagnosis_term:
          preferred_term: clinical assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: Episodic ataxia (EA) is a rare, familial disorder producing attacks of generalized ataxia,
          with normal or near-normal neurological function between attacks. One type of EA is characterized
          by brief episodes of ataxia with myokymia (rippling of muscles) evident between attacks.
        supports: SUPPORT
    origin:
