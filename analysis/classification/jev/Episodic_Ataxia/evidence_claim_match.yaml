          output. 4-aminopyridine restores Purkinje pacemaking precision by prolonging the action potential
          and increasing the afterhyperpolarisation.

          '
        genes:
        - preferred_term: CACNA1A
          term:
            id: hgnc:1388
            label: CACNA1A
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
