        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CTGF-Integrin-RAS-MAPK Signaling
        biological_scale: MOLECULAR
        role: effector
        conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation
        description: 'Connective tissue growth factor (CTGF/CCN2) is a tumorigenic transcriptional target
          of TAZ-CAMTA1. Secreted CTGF binds integrin alphaIIbbeta3, sustaining anchorage-independent
          proliferation, and drives RAS and MAPK signalling; CTGF knockdown reduces pathway activity and
          MEK inhibition with PD 0325901 or trametinib abolishes fusion-driven anchorage-independent growth
          and xenograft expansion. This is the disease-specific route by which a Hippo-pathway lesion
          converges on the conserved constitutive-mitogenic-signalling hallmark node, and it supplied
          the preclinical rationale for the phase II trametinib trial. Model caveat: this arm was mapped
          in TAZ-CAMTA1-transformed NIH3T3 fibroblasts and their xenografts, not in native human EHE endothelium,
          so its fidelity to the endothelial disease is an open question (see the linked HUMAN_MODEL_MISMATCH
          discussion).'
        biological_processes:
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
        - preferred_term: ERK1 and ERK2 cascade
          modifier: INCREASED
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
        - preferred_term: anoikis
          modifier: DECREASED
          term:
            id: GO:0043276
            label: anoikis
      selected_evidence:
        snippet: We identified connective tissue growth factor (CTGF) as a tumorigenic transcriptional
          target of TC.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
