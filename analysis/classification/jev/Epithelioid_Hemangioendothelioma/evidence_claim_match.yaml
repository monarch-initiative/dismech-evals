  0a806a91c4df1dd8af09c8d11db7fbc2734148c1eb10ffd72c59b8120b89c88d:
    claim:
      about:
        disease:
          name: Epithelioid Hemangioendothelioma
          disease_term:
            preferred_term: epithelioid hemangioendothelioma
            term:
              id: MONDO:0015523
              label: epithelioid hemangioendothelioma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constitutive Nuclear TAZ-TEAD Transcriptional Activation
        biological_scale: MOLECULAR
        role: central_effector
        description: 'Normally, Hippo-pathway LATS kinases phosphorylate TAZ, promoting 14-3-3 binding
          and cytoplasmic sequestration. TAZ-CAMTA1 loses the C-terminal regulatory elements and gains
          CAMTA1-mediated nuclear localisation, so it is largely relieved of that restraint and behaves
          as a constitutively activated TAZ. Importantly, the restraint is attenuated rather than abolished:
          LATS1/2 deletion and mutation of the LATS phosphosites still increase the fusion''s nuclear
          localisation and target-gene output, so TAZ-CAMTA1 remains susceptible to Hippo regulation -
          which is why interventions that drive YAP/TAZ phosphorylation and cytoplasmic sequestration
          (e.g. statins) can inhibit it. The nuclear fusion drives TEAD-dependent transcription; disruption
          of the fusion-TEAD interaction or expression of a dominant-negative TEAD blocks transformation,
          identifying this node as the central effector of the disease and the primary fusion-directed
          drug target.'
        molecular_functions:
        - preferred_term: transcription coactivator activity
          modifier: INCREASED
          term:
            id: GO:0003713
            label: transcription coactivator activity
        biological_processes:
        - preferred_term: hippo signaling
          modifier: DECREASED
          term:
            id: GO:0035329
            label: hippo signaling
        - preferred_term: positive regulation of transcription by RNA polymerase II
          modifier: INCREASED
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: disruption of the TAZ-CAMTA1-TEAD interaction or ectopic expression of a dominant negative
          TEAD in vivo inhibits TAZ-CAMTA1-mediated transformation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33766984
      reference_title: WWTR1(TAZ)-CAMTA1 reprograms endothelial cells to drive epithelioid hemangioendothelioma.
