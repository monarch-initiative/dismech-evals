      assertion_type: ProgressionInfo
      assertion:
        phase: Heterogeneous course from indolent to rapidly fatal
        notes: EHE has a markedly heterogeneous natural history. Solitary soft-tissue disease is often
          managed with curative surgery and follows an uneventful course, while pleural involvement or
          lymph node metastasis produces a course akin to high-grade sarcoma. Five-year overall survival
          was 59% in the WWTR1-CAMTA1 subset versus 86% in the YAP1-TFE3 subset in a large single-institution
          translocation-positive cohort, and only 22% and 30% in patients with pleural disease or lymph
          node metastases respectively.
      selected_evidence:
        snippet: Patients with conventional epithelioid hemangioendothelioma with WWTR1-CAMTA1 fusion
          had a less favorable outcome compared with the YAP1-TFE3 subset, the 5-year overall survival
          being 59% versus 86%, respectively.
        supports: SUPPORT
