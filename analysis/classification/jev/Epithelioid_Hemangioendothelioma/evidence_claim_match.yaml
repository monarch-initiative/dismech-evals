        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Epithelioid angiosarcoma
        distinguishing_features:
        - Marked nuclear pleomorphism, brisk mitotic activity and necrosis
        - Negative for both WWTR1-CAMTA1 and YAP1-TFE3 fusions
        - High-grade clinical behaviour rather than intermediate malignancy
        description: 'The principal high-grade mimic. No `disease_term` is bound here because MONDO currently
          has no separate class for epithelioid angiosarcoma - it is listed as an EXACT synonym of MONDO:0015523
          itself (inherited from NCIT:C3800). That is an ontology defect: the two are distinct entities
          with different genetics, treatment and prognosis, and binding the EHE term to its own differential
          would propagate the error.'
      selected_evidence:
        snippet: This recurrent translocation has not been detected in any of the morphologic mimics of
          EHE, such as EH, E-AS or epithelioid sarcoma-like EHE, and thus can serve as a useful molecular
          diagnostic tool in challenging cases.
        supports: SUPPORT
