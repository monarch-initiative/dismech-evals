        context: []
      assertion_type: Pathophysiology
      assertion:
        name: WWTR1-CAMTA1 Fusion Oncogene Formation
        genetic_context:
          variant_origin: SOMATIC
        biological_scale: MOLECULAR
        role: trigger
        description: A somatic t(1;3)(p36.23;q25.1) translocation fuses the 5' portion of WWTR1 (encoding
          the Hippo effector TAZ) on 3q25 to the 3' portion of CAMTA1 on 1p36. The chimeric gene is driven
          by the WWTR1 promoter, which is highly active in endothelial cells, so CAMTA1 sequence - normally
          expressed only in brain - is inappropriately activated by a promoter-switch mechanism. The fusion
          retains the TAZ 14-3-3-binding and WW domains together with the CAMTA1 TIG DNA-binding domain,
          ankyrin repeats and IQ calmodulin-binding motifs.
        genes:
        - preferred_term: WWTR1
          term:
            id: hgnc:24042
            label: WWTR1
        - preferred_term: CAMTA1
          term:
            id: hgnc:18806
            label: CAMTA1
        gene_products:
        - preferred_term: TAZ-CAMTA1 fusion oncoprotein
          term:
            id: NCIT:C121673
            label: WWTR1/CAMTA1 Fusion Protein
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: This WWTR1/CAMTA1 gene fusion is under the transcriptional control of the WWTR1 promoter
          and encodes a putative chimeric transcription factor that joins the amino terminus of WWTR1,
          a protein that is highly expressed in endothelial cells, in-frame to the carboxyl terminus of
          CAMTA1, a protein that is normally expressed only in brain.
        supports: SUPPORT
