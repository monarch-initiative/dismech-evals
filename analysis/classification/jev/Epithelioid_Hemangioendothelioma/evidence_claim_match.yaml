        subtype_term:
          preferred_term: EHE with YAP1-TFE3 gene fusion
          term:
            id: NCIT:C177553
            label: Epithelioid Hemangioendothelioma with YAP1-TFE3 Gene Fusion
        description: A minority molecular subset (about 5% of cases, reported from <5% up to ~10%) occurring
          in younger adults, with more overt vasoformative architecture, voluminous eosinophilic to vacuolated
          cytoplasm, strong nuclear TFE3 expression and negative CAMTA1. Reported survival is higher than
          in the WWTR1-CAMTA1 subset (86% vs 58-59% at 5 years) despite a high propensity for multifocal
          and metastatic presentation, but the difference did not reach statistical significance in the
          largest comparison (p = 0.095), so the prognostic separation should be treated as suggestive
          rather than established.
      selected_evidence:
        snippet: Although the disease specific survival rate at 5 years was 86% in TFE3-rearranged patients
          compared to 58% in CAMTA1-rearranged patients, the difference between groups did not reach statistical
          signficance (p = 0.095).
        supports: SUPPORT
