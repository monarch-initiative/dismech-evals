      assertion_type: Pathophysiology
      assertion:
        name: Local Invasion and Metastatic Dissemination
        description: Epithelioid sarcoma is locally infiltrative along fascial planes and tendon sheaths
          and metastasizes, with an unusually high rate of regional lymph node involvement (in addition
          to pulmonary spread) compared with most soft-tissue sarcomas. This behavior underlies its high
          recurrence and metastatic rates.
        biological_processes:
        - preferred_term: tumor cell migration and invasion
          modifier: INCREASED
          term:
            id: GO:0016477
            label: cell migration
      selected_evidence:
        snippet: Follow-up data, available in 202 cases (84%), showed a 77% recurrence and a 45% metastatic
          rate. The most common initial sites of metastasis were lymph nodes (48%) and lungs (25%).
        supports: SUPPORT
