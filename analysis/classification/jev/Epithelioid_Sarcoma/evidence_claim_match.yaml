            preferred_term: epithelioid sarcoma
            term:
              id: MONDO:0017387
              label: epithelioid sarcoma
        context: []
      assertion_type: Subtype
      assertion:
        name: Proximal
        display_name: Proximal (Large-Cell) Type
        description: The proximal-type (large-cell) variant arises in deep axial soft tissues of the pelvis,
          perineum, genital tract, and trunk in older adults. It is composed of large epithelioid cells
          with prominent nucleoli and frequent rhabdoid features, behaves more aggressively, and carries
          a worse prognosis than the classic type.
      selected_evidence:
        snippet: In contrast to the conventional, "distal-type" epithelioid sarcoma, the proximal variant
          is characterized by a predominantly large-cell, epithelioid cytomorphology, marked cytologic
          atypia, frequent occurrence of rhabdoid features, and lack of a granuloma-like pattern in most
          cases. It appears to be somewhat more aggressive (or at least metastasizes earlier) than usual
          epithelioid sarcoma.
        supports: SUPPORT
    origin:
