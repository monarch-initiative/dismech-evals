  462228d8b61b2fbb3399922108ce345b088ab8ba3f07ec2e08849713a12ab2fb:
    claim:
      about:
        disease:
          name: Epithelioid Sarcoma
          disease_term:
            preferred_term: epithelioid sarcoma
            term:
              id: MONDO:0017387
              label: epithelioid sarcoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EZH2/PRC2 Dependency and H3K27 Hypermethylation
        description: SWI/SNF normally opposes Polycomb repressive complex 2 (PRC2). When SMARCB1 is lost,
          PRC2/EZH2 activity is unopposed, increasing trimethylation of histone H3 at lysine 27 (H3K27me3)
          and epigenetically repressing differentiation and tumor-suppressor genes. SMARCB1-deficient
          tumors become dependent on EZH2 activity, the rationale for therapeutic EZH2 inhibition.
        molecular_functions:
        - preferred_term: histone H3K27 methyltransferase activity
          modifier: INCREASED
          term:
            id: GO:0046976
            label: histone H3K27 methyltransferase activity
        biological_processes:
        - preferred_term: negative regulation of gene expression, epigenetic
          modifier: INCREASED
          term:
            id: GO:0045814
            label: negative regulation of gene expression, epigenetic
      selected_evidence:
        snippet: Over 90% of tumours have lost INI1 expression, leading to oncogenic dependence on the
          transcriptional repressor EZH2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33035459
      reference_title: 'Tazemetostat in advanced epithelioid sarcoma with loss of INI1/SMARCB1: an international,
        open-label, phase 2 basket study.'
      evidence_source: HUMAN_CLINICAL
      explanation: This phase 2 study states the mechanistic rationale directly - loss of INI1 in over
        90% of epithelioid sarcomas creates an oncogenic dependence on the EZH2 transcriptional repressor.
