      assertion_type: Discussion
      assertion:
        discussion_id: erb_prevention_ceiling
        kind: KNOWLEDGE_GAP
        attaches_to:
        - environmental#Shoulder dystocia at delivery
        prompt: How much of the residual injury burden is preventable at all, given that most shoulder
          dystocia occurs without identifiable risk factors?
        rationale: 'Prevention here is obstetric, and it works: twelve years of multi-professional shoulder-dystocia
          simulation training was followed by a fall in brachial plexus injury from 7.4% to 1.3% of shoulder
          dystocia deliveries. But that is training in how to manage the event, not in how to avoid it.
          Risk-factor-based prevention has a hard ceiling, because half to two-thirds of shoulder dystocia
          happens in women with none of the recognised risk factors. Distinguishing the two kinds of prevention
          matters for what a service should invest in, and the literature does not separate their contributions.'
      selected_evidence:
        snippet: 'MAIN OUTCOMES: Neonatal morbidity (brachial plexus injury, humeral fracture, clavicular
          fracture, 5-minute Apgar score <7) and documented management of shoulder dystocia (resolution
          manoeuvres performed, traction applied, head-to-body delivery interval).'
        supports: SUPPORT
