      assertion_type: Prevalence
      assertion:
        population: Germany, 2005-2018, national hospital discharge data
        measure_type: ANNUAL_INCIDENCE
        prevalence_class: BAND_1_9_PER_100000
        rate_per_100000: 15.0
        rate_denominator: LIVE_BIRTHS
        notes: Reported as 0.15 per 1000 live births in 2018, down from 0.28 in 2005; normalized here
          to 15 per 100,000 live births. The rate is falling, and the source pairs the decline with rising
          cesarean delivery rates. This is obstetric brachial plexus injury overall rather than the Erb
          subtype specifically, so it is an upper bound on the Erb-specific rate. Note also that published
          incidence figures for this condition vary by roughly an order of magnitude across countries
          and ascertainment methods, so a single national figure should not be read as the worldwide rate.
      selected_evidence:
        snippet: The incidence of OBPI per 1000 live births significantly decreased by 47.57%, from 0.28
          in 2005 to 0.15 in 2018 (p < 0.001), representing a mean annual decrease of 0.010 ± 0.026.
        supports: SUPPORT
