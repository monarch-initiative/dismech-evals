      assertion_type: Discussion
      assertion:
        discussion_id: erb_rat_glenoid_direction_mismatch
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Glenohumeral Dysplasia
        - animal_models#Neonatal rat C5-C6 neurotomy model
        prompt: Does the rat glenoid deformity model the human one, given that the version change goes
          in the opposite direction?
        rationale: The rat model reproduces the contracture faithfully and is the main evidence that the
          dysplasia is load-driven rather than primary. But its glenoid moves from retroversion to anteversion,
          whereas the human deformity is characterised by increasing retroversion with posterior subluxation.
          Quadrupedal shoulder loading is not bipedal shoulder loading, so the discrepancy is explicable,
          but it means the model supports the general claim that a growing glenoid remodels under sustained
          abnormal force and does not support the specific human deformity. This entry uses it for the
          former only, and the human dysplasia phenotype is evidenced from human data.
      selected_evidence:
        snippet: Glenoid version changed from 2 degrees +/- 2 of retroversion (left side) to 8 degrees
          +/- 3 of anteversion.
        supports: SUPPORT
        directness: INDIRECT
