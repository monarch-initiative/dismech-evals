      assertion_type: Discussion
      assertion:
        discussion_id: erb_two_sufficient_contracture_routes
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Subscapularis Denervation Atrophy and Impaired Longitudinal Growth
        - pathophysiology#Rotator Muscle Imbalance
        prompt: Denervation atrophy and rotator imbalance are each sufficient to produce the contracture
          in the rat. What is their relative contribution in a given child?
        rationale: 'Two selective-denervation experiments each produce the contracture on their own, and
          neither was designed to weigh them against the other. That is not an academic question, because
          the treatments act on different routes: botulinum toxin weakens the intact internal rotators
          and so targets imbalance, while therapy aimed at maintaining subscapularis length targets the
          atrophy route. Which one dominates in a particular child would predict which treatment helps
          them, and nothing measures it. One of the two papers raises the point itself.'
      selected_evidence:
        snippet: Our study shows that subscapularis denervation, per se, could explain shoulder contracture
          after neonatal brachial plexus injury, though its relevance compared to other pathogenic factors
          needs further investigation.
        supports: SUPPORT
        directness: INDIRECT
