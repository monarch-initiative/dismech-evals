      assertion:
        name: Excessive Lateral Traction on the Upper Brachial Plexus at Delivery
        biological_scale: ORGANISM
        description: The initiating event. Increasing the head-to-shoulder angle during delivery, most
          often when the anterior shoulder is impacted behind the symphysis, stretches the upper brachial
          plexus. This is a mechanical lesion and there is no molecular initiating step above it.
      selected_evidence:
        snippet: 'Shoulder dystocia was the strongest risk factor for BPBI in the logistic regression
          model [adjusted odds ratio (AOR): 56.9, P <0.001].'
        supports: SUPPORT
