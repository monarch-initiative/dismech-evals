  011f08e91bff3845e1e095fa3a657d10a0074f922ec8d1d6ee0365248c73c994:
    claim:
      about:
        disease:
          name: Erdheim-Chester Disease
          disease_term:
            preferred_term: Erdheim-Chester disease
            term:
              id: MONDO:0018153
              label: Erdheim-Chester disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MAPK/ERK Pathway Activation
        description: Constitutive activation of the MAPK/ERK signaling pathway drives histiocyte proliferation
          and survival. The BRAF V600E mutation is found in 57-70% of cases, with MAP2K1 mutations in
          close to 20%. Additional mutations in NRAS, KRAS, and other MAPK pathway genes are found in
          many remaining cases. This positions ECD as a clonal inflammatory myeloid neoplasm.
        cell_types:
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
        - preferred_term: ERK1 and ERK2 cascade
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
      selected_evidence:
        snippet: The discovery of BRAF mutations and of other MAP kinase pathway alterations, as well
          as the co-occurrence of ECD with LCH in 15% of patients with ECD, led to the 2016 revision of
          the classification of histiocytoses in which LCH and ECD belong to the "L" group. Both conditions
          are considered inflammatory myeloid neoplasms.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32107533
      reference_title: Erdheim-Chester disease.
      evidence_source: HUMAN_CLINICAL
      explanation: ECD is now classified as an inflammatory myeloid neoplasm based on the discovery of
        clonal MAPK pathway mutations.
