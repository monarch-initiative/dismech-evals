        disease_term:
          preferred_term: Langerhans cell histiocytosis
          term:
            id: MONDO:0018310
            label: Langerhans cell histiocytosis
        description: Clonal L-group histiocytosis that shares MAPK pathway driver mutations and can co-occur
          with or mimic Erdheim-Chester disease in up to 15% of cases.
        distinguishing_features:
        - ECD is characterized by foamy CD68-positive, CD1a-negative histiocytes and bilateral symmetric
          long-bone osteosclerosis, whereas Langerhans cell histiocytosis is defined by CD1a-positive
          dendritic histiocytes.
      selected_evidence:
        snippet: The discovery of BRAF mutations and of other MAP kinase pathway alterations, as well
          as the co-occurrence of ECD with LCH in 15% of patients with ECD, led to the 2016 revision of
          the classification of histiocytoses in which LCH and ECD belong to the "L" group.
        supports: SUPPORT
