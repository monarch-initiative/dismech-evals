  ffe6a4d48237d0142138be5c8f7112d5bbd716ba0e4482fd7b28f93dcc927585:
    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Cattle fescue toxicosis (endophyte-infected tall fescue grazing)
        species: Cattle
        description: 'Cattle grazing endophyte-infected tall fescue ingest ergopeptine alkaloids and develop
          a vasoconstrictive syndrome; cattle are also susceptible to gangrenous ergotism from Claviceps-contaminated
          feed. This is a naturally occurring disease in an outbred population on an unrestricted diet,
          which is its value and its limitation at once: the exposure is real but uncontrolled, the principal
          alkaloid in fescue is ergovaline rather than the Claviceps mixture humans encounter, and the
          studied endpoints are herd performance and cytokine profiles rather than the vascular lesion.'
        notes: Included because it is the model the literature on this disease actually uses, not because
          it is a close match. The report that informed this entry described fescue toxicosis as closely
          recapitulating the human gangrenous phenotype and cited a veterinary manual and a farming magazine
          for it; the peer-reviewed source cited here supports chronic ergot-alkaloid exposure and a tolerance
          split, and a separate review supports cattle susceptibility to gangrenous ergotism. Neither
          establishes the recapitulation claim, so the link below is `PARTIALLY_RECAPITULATES` rather
          than `RECAPITULATES`.
        publication: PMID:33327425
        modeled_mechanisms:
        - target: Distal Tissue Ischemia and Dry Gangrene
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Cattle exposed to ergot alkaloids develop gangrenous ergotism, so the species reaches
            the same endpoint node as the human disease by the same dietary route.
          limitations: 'The alkaloid is different - ergovaline from an endophyte in fescue rather than
            the Claviceps sclerotial mixture - and the cited cattle study measured herd performance and
            cytokines, not the ischaemic lesion. The gangrene claim rests on statements about the species
            rather than on a measurement in these animals, and those statements qualify it heavily: gangrenous
            ergotism in cattle is described as rare, requiring acute exposure to very high alkaloid concentrations
            together with cold temperatures, while what chronic fescue grazing usually produces is reduced
            productivity and reduced blood flow to the extremities. So the species reaches this node,
            but not by the route or at the frequency the human gangrenous disease does.'
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The cited study's measured quantities are animal performance parameters and circulating
              cytokines. This node's quantity is tissue perfusion and necrosis in the distal extremity.
              Performance decline under chronic ergot exposure is a downstream systemic consequence, not
              the lesion.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The exposure differs in kind, not only in species. These cattle grazed infected
              pasture continuously for thirteen weeks; the human iatrogenic form is a discrete oral dose
              taken at a migraine attack, and the human dietary form is contaminated flour eaten as meals.
              The shared feature is the receptor pharmacology, not the dose, the schedule, or the alkaloid.
      selected_evidence:
        snippet: Fescue toxicosis is a multifaceted syndrome common in cattle grazing endophyte-infected
          tall fescue
        supports: SUPPORT
