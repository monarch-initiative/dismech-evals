            id: NCIT:C15329
            label: Surgical Procedure
        notes: Bound to the generic `NCIT:C15329` because NCIT has no sympathectomy term. OLS `q=sympathectomy`
          returns `SNOMED:57071006`, `mesh:D013562`, `OMIT:0014426` and four further SNOMED children,
          and no NCIT identifier at all; `q=sympathectomy, ontology=ncit`, `q=sympathetic denervation,
          ontology=ncit` and `q=lumbar sympathectomy, ontology=ncit` each return nothing. `NCIT:C21110`
          Sympathetic Block exists but names an anaesthetic or chemical block rather than the surgical
          division performed in the cited series, so it is not a substitute. The specificity is carried
          in `preferred_term`.
