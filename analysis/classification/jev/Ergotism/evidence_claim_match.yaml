  bdb8c08bc4813e3906c491ebf61fb6c380799657b73c87ae3bf366ecd42cf390:
    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Clavine-type ergot alkaloid cytotoxicity in HepG2 and PANC-1 cells
        experimental_model_type: CELL_LINE
        description: Two human carcinoma cell lines exposed to clavine-type ergot alkaloids - pyroclavine,
          agroclavine and festuclavine - with apoptosis read out by annexin V / propidium iodide double
          staining on flow cytometry. Agroclavine is named a causative agent of ergotism and is monitored
          by EFSA, and the same study found clavine-type alkaloids alongside the peptide-type ones in
          most of the Japanese sclerotia it analysed, so this is a real constituent of the exposure rather
          than a laboratory curiosity.
        cell_source: immortalized human carcinoma cell lines
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        publication: PMID:36635416
        notes: Included as the only structured record in this entry of a mechanism that is not vasoconstriction.
          Every other node here runs through receptor agonism and ischaemia; direct cytotoxicity would
          be a parallel route to tissue injury. The cell lines are hepatoma and pancreatic carcinoma,
          neither of which is a tissue this disease damages, so the link below is `MEASURES` at `LOW`
          fidelity and no pathophysiology node asserts direct cytotoxicity in the human disease. The open
          question is recorded as a `KNOWLEDGE_GAP` discussion rather than as a mechanism.
        modeled_mechanisms:
        - target: Distal Tissue Ischemia and Dry Gangrene
          relationship: MEASURES
          fidelity: LOW
          model_scale: CELLULAR
          description: Shows that a constituent of the ingested exposure kills cells outright at the concentrations
            tested, which is a candidate contributor to the tissue loss this node records and is independent
            of perfusion.
          limitations: Nothing here is vascular, distal or ischaemic. The cells are HepG2 hepatoma and
            PANC-1 pancreatic carcinoma lines under a direct alkaloid application; the human lesion is
            necrosis of a distal extremity starved of blood. No concentration reached in a poisoned patient
            is established as comparable, and the authors themselves state the cytotoxic mechanism is
            unelucidated. This link records that the observation exists, not that it operates in the disease.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The measured quantity is annexin V / PI-defined apoptosis in a carcinoma cell
              line under direct application. This node's quantity is necrosis of distal tissue following
              sustained arterial spasm. Cell death is common to both, but its cause is the thing in dispute.
          - divergence_type: SCALE_EXTRAPOLATION
            materiality: QUALIFYING
            description: The model observes single cells in culture; the node it is linked to is a tissue-level
              lesion. Apoptosis in a dish does not aggregate to necrosis of a limb segment without an
              account of how many cells, in which tissue, at what exposure - none of which this model
              supplies. The one-step gap from `CELLULAR` to `TISSUE` is why this link is `MEASURES` rather
              than `PARTIALLY_RECAPITULATES`.
          - divergence_type: BOUNDARY_OMISSION
            materiality: INVALIDATING
            description: The circulation is not in the model at all. Absorption, first-pass metabolism,
              plasma protein binding and delivery to the distal limb are all outside its boundary, so
              the model cannot say whether the tested concentrations are ever reached in the tissue that
              dies.
      selected_evidence:
        snippet: We performed annexin V and PI double-staining followed by flow cytometric analysis to
          detect apoptosis in HepG2 and PANC-1 cells after exposure to Clavine-type EAs.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/1
      evidence_path: /experimental_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36635416
      reference_title: 'Ergot alkaloids in sclerotia collected in Japan: synthetic profiles and induction
        of apoptosis by Clavine-type compounds.'
      evidence_source: IN_VITRO
      explanation: The preparation, the exposure and the assay.
