  b3df8695db59b9ce9464e99093802e0b35315bfbbd3695c7157a5e805d832e20:
    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Bovine lateral saphenous vein myography
        experimental_model_type: OTHER
        description: Isolated lateral saphenous vein rings from cattle mounted for myography. This is
          the standard ex vivo preparation in the ergot-alkaloid vascular literature, and the study cited
          here uses it to establish which serotonin receptor subtypes the vessel carries and what each
          does - the receptor repertoire that the ergoline agonism node acts on.
        organism:
          preferred_term: cattle
          term:
            id: NCBITaxon:9913
            label: Bos taurus
        publication: PMID:38946059
        notes: Cited for the vessel's receptor pharmacology, not for ergot action. The study's agonists
          are serotonin itself and subtype-selective 5-HT agonists; no ergot alkaloid was applied. The
          deep-research report listed this preparation among ergot-alkaloid model systems, which overstates
          what this particular paper shows, and the `divergences` block below records that rather than
          repeating it.
        modeled_mechanisms:
        - target: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
          relationship: MEASURES
          fidelity: LOW
          model_scale: MOLECULAR
