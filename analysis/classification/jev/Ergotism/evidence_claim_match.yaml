              label: ergotism
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neurologic
        name: Cerebral ischaemia
        description: Vasospasm is not confined to the limbs. Cerebral ischaemia is recorded alongside
          limb ischaemia in the fatal darunavir interaction, and an ergometrine case shows extensive cortical
          infarction whose pattern was read as a reversible vasoconstriction syndrome - the same lesion
          as the limb disease, in the cerebral circulation.
        phenotype_term:
          preferred_term: Cerebral ischemia
          term:
            id: HP:0002637
            label: Cerebral ischemia
          temporality: ACUTE
        notes: 'The ergometrine case also suffered a later middle cerebral artery occlusion, but that
          one followed left ventricular thrombus formation and is embolic rather than vasospastic. It
          is deliberately not cited here: the same patient having both a vasospastic and an embolic cerebral
          event is exactly the confusion this phenotype would otherwise import.'
      selected_evidence:
        snippet: The pattern of cortical involvement with subcortical sparring raised the possibility
          of a reversible vasoconstriction syndrome
        supports: SUPPORT
    origin:
