          it lasts. In an arterial tissue bath a single dose of ergocristine produced contraction sustained
          across a three-hour incubation, and the response persists well beyond the point at which the
          alkaloid would have been cleared. That persistence is why the clinical syndrome is a spasm that
          resists reversal rather than a transient squeeze, and why case reports describe failure of first-line
          vasodilators.
