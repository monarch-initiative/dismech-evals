      assertion:
        name: Exposure history with non-atherosclerotic distal ischaemia
        notes: 'Left without a `diagnosis_term`. `diagnosis_term` is a `TreatmentDescriptor` whose term
          must be reachable from `NCIT:C25218` Clinical Intervention or Procedure, and history-taking
          is not in that branch: `NCIT:C146918` Medical History Taking exists and is the obvious candidate,
