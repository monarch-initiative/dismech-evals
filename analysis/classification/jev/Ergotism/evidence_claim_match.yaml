      assertion_type: Discussion
      assertion:
        discussion_id: convulsive_form_as_serotonin_syndrome
        kind: KNOWLEDGE_GAP
        prompt: Was convulsive ergotism epidemic serotonin syndrome, and does that identity hold well
          enough to model the two as the same mechanism?
        attaches_to:
        - pathophysiology#Central Serotonergic Overstimulation
        - pathophysiology#Convulsive and Neuropsychiatric Syndrome
        rationale: 'The argument is good and it is still an argument. Ergot alkaloids are serotonin agonists;
          dihydroergotamine binds serotonin receptors in the dorsal horn, which is where the neuropathology
          of convulsive ergotism was found; dihydroergotamine can cause serotonin syndrome in people;
          and the clinical picture - twitching, spasm, altered mental state, sweating, fever - is the
          picture of serotonergic excess. That is a chain of circumstantial fits, not a demonstration,
          and the epidemics it explains ended before anyone could measure anything in a patient.

          The geographical split is the part that most needs explaining and is least settled. Convulsive
          outbreaks east of the Rhine and gangrenous ones west of it is a striking pattern, and the proposed
          explanation - an alkaloid abundant in eastern ergot acting on the CNS at a concentration too
          low to close down peripheral arteries - is offered by the author as a possibility, with the
          alkaloid unnamed. Confirming it would need compositional analysis of historical ergot from both
          regions against a modern receptor panel.'
        notes: Recorded as a gap rather than curated as fact. The entry models the central serotonergic
          branch, which is well supported, without asserting the identification with serotonin syndrome,
          which is not.
      selected_evidence:
        snippet: The serotonin syndrome may, therefore, have been a public-health problem long before
          it was recognised as a complication of modern psychopharmacology.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
