          ''TreatmentActionTerm''". The OLS search behind that attempt, `q=medical history taking, ontology=ncit`,
          returns `NCIT:C146918` Medical History Taking, `NCIT:C83067` Medical History Occurrence, `NCIT:C85522`
          Medical History Yes No Indicator and `NCIT:C85833` Work-Up Examination; the first three are
          data-collection concepts rather than procedures and the fourth is broader than this entry. No
          binding is better than a wrong one.'
        description: 'There is no confirmatory assay in routine use. The diagnosis is made by finding
          arterial insufficiency without atherosclerosis, thrombus or vasculitis, and then finding the
          exposure - which in the iatrogenic form means asking specifically about migraine self-medication
          and about any recently started drug. That question is the one that gets missed: in the fatal
          darunavir case the ergotamine use surfaced only after the ischaemia had spread and the family
          were interviewed.'
