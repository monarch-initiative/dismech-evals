      assertion_type: ClinicalBurden
      assertion:
        burden_level: VARIABLE
        rationale: Outcome ranges from subclinical vasospasm through fully reversible ischaemia to amputation,
          stroke and death, and which end a patient reaches is set by how quickly the exposure is recognised
          and stopped rather than by the illness itself. One hospital series of seven severe cases needed
          no amputations; a poison-centre series of twelve required two partial foot amputations and had
          two deaths. Subclinical ergotism is reported at 15% prevalence among users against a severe
          incidence below 0.5 per 100,000 per year, so the same exposure spans three orders of magnitude
          of harm.
      selected_evidence:
        snippet: It is concluded that incidence of severe ergotism is less than 0.5/100,000/year in Geneva.
          This contrasts with the high prevalence (15%) of subclinical ergotism reported by others.
        supports: SUPPORT
