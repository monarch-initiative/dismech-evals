  7e325555dd92b996aaba9411bc80e6ee36400564b3c4f43f1b4d0f4c0f12539e:
    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: Treatment
      assertion:
        name: Corticosteroid rescue therapy
        description: A second-line option for spasm that does not yield to a vasodilator. In one case,
          pulses that had been lost despite sodium nitroprusside and heparin became palpable two hours
          after a single 1 mg/kg intravenous dose of methylprednisolone sodium succinate, with angiographic
          improvement at twelve hours. The authors state plainly that the mechanism is unknown, which
          is why this is recorded as an observation about an intractable case rather than as a mechanism-directed
          treatment.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: methylprednisolone sodium succinate
            term:
              id: CHEBI:6890
              label: Methylprednisolone sodium succinate
        notes: 'No `target_mechanisms`. An edge would have to name the node the steroid acts on, and the
          cited source explicitly declines to: "The mechanism by which corticosteroids dilate arteries
          is not clear." Leaving the treatment unlinked records what is known; guessing at the receptor
          node would not.

          Heparin was co-administered in this case and is named in the same sentence as the nitroprusside,
          but no outcome is attributed to it and the recovery followed the steroid. It is therefore not
          curated as a separate treatment here - a treatment whose only support is that it was given alongside
          something else is not a treatment claim.'
      selected_evidence:
        snippet: Ischemia in an extremity secondary to ergotamine-induced vasospasm unresponsive to sodium
          nitroprusside may be treated successfully with methylprednisolone.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/0
      context_paths:
