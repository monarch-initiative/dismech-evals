    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Sheep single-dose oral ergot sclerotia exposure
        species: Sheep
        description: 'Twelve adult ewes, six dosed once orally with ground ergot sclerotia at 600 ug/kg
          bodyweight total ergot and six given water, euthanised twelve hours later, with the pedal artery
          of the left hind limb mounted in an isolated tissue bath and its contractile response to phenylephrine
          compared between groups. This is the closest thing to a controlled experiment on the human disease
          that exists: the exposure is the same sclerotial alkaloid mixture, the route is oral, and the
          readout is the vascular smooth muscle response this entry''s chain runs through. It models the
          vascular arm only - sheep ergotism is a gangrenous disease, and nothing here addresses the convulsive
          branch.'
        publication: PMID:33924041
        modeled_mechanisms:
        - target: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Exposure to the sclerotial alkaloid mixture left the pedal artery more sensitive
            to an alpha-1 agonist, and an alpha-1 antagonist was a more potent blocker in exposed animals
            than in controls - which is the adrenergic half of this node measured directly rather than
            inferred.
          limitations: Only the alpha-1 adrenergic arm is interrogated. The 5-HT receptor contribution
            that this node also asserts is not measured here, and the authors reach it only through the
            general statement they cite from elsewhere. Twelve animals, one dose, one timepoint.
          readouts:
          - name: Pedal artery contractile sensitivity to phenylephrine
            target: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
            description: EC50 for phenylephrine-induced contraction of the isolated dorsal metatarsal
              III artery, exposed group against water control.
            direction: INCREASED
            interpretation: Increased sensitivity to an alpha-1 agonist after ergot exposure is the measurable
              signature of ergoline action at the adrenergic receptor.
        - target: Sustained Vascular Smooth Muscle Contraction
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The isolated-vessel preparation reads out contraction of vascular smooth muscle,
            which is this node, in tissue taken from an animal exposed by the same route as a human eating
            contaminated grain.
          limitations: Twelve hours after a single dose. Human ergotism is usually the product of sustained
            exposure, and the entry's own progression section describes a subclinical phase running for
            weeks, which a single-dose model cannot reach.
      selected_evidence:
        snippet: Each ewe within the treatment group received a single oral treatment of ground ergot
          sclerotia at a dose of 600 µg/kg BW (total ergot) while each ewe in the control group received
          water.
        supports: SUPPORT
