          study found the (S)-epimer producing a sustained contraction too, though weaker than the (R)
          form, and a docking study puts it at the 5-HT2A and alpha-2A sites.

          What this does not establish is how much it matters in a diet. The experiments are bovine arterial
          tissue at defined molar concentrations, not dietary exposure; the two epimers interconvert in
          a way that depends on temperature, pH and solvent, so the ratio in a food is not fixed; and
          no study has yet asked whether including the (S) forms would change where a regulatory limit
          should sit. The authors go as far as saying the (S) forms should be monitored, which is a recommendation
          rather than a quantified risk.'
