      assertion_type: Discussion
      assertion:
        discussion_id: s_epimer_bioactivity_and_food_limits
        kind: KNOWLEDGE_GAP
        prompt: If the (S)-epimers of ergot alkaloids are vasoactive after all, do the regulatory limits
          that measure only (R)-epimers understate dietary exposure?
        attaches_to:
        - pathophysiology#Sustained Vascular Smooth Muscle Contraction
        - environmental#Ingestion of cereal grain contaminated with Claviceps sclerotia
        rationale: 'Ergot alkaloids exist as (R)- and (S)-epimers, and only the (R) forms are monitored
          in diets in North America, on the understanding that the (S) forms are biologically inactive.
          Tissue-bath work contradicts that: all four (S)-epimers tested produced concentration-dependent
          arterial contraction comparable to the (R) forms, and one of them, ergotaminine, contracted
          more strongly than two of the (R)-side comparators at the highest concentration used. A second
          study found the (S)-epimer producing a sustained contraction too, though weaker than the (R)
          form, and a docking study puts it at the 5-HT2A and alpha-2A sites.

          What this does not establish is how much it matters in a diet. The experiments are bovine arterial
          tissue at defined molar concentrations, not dietary exposure; the two epimers interconvert in
          a way that depends on temperature, pH and solvent, so the ratio in a food is not fixed; and
          no study has yet asked whether including the (S) forms would change where a regulatory limit
          should sit. The authors go as far as saying the (S) forms should be monitored, which is a recommendation
          rather than a quantified risk.'
      selected_evidence:
        snippet: Ergot alkaloids exist in two forms known as the (R)- and (S)-epimers with only the former
          being monitored in diets in North America.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
