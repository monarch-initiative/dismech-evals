            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CYP3A4 Inhibition Raising Systemic Ergotamine Concentration
        biological_scale: MOLECULAR
        description: The step that makes ergotism a live problem in countries with clean grain. Ergotamine
          is destroyed on first pass through the liver by CYP3A4, leaving under 5% oral bioavailability
          - which is why an ordinary migraine dose is tolerated at all. A strong CYP3A4 inhibitor removes
          that first-pass barrier, and the same tablet delivers a toxic plasma concentration. The inhibitors
          implicated are the HIV protease inhibitors, the pharmacokinetic booster cobicistat, and the
          macrolide antibiotics.
        notes: Modelled as a mechanism node rather than as a `genetic:` CYP3A4 entry. The claim here is
          pharmacological inhibition of the enzyme by a co-administered drug, which is an exposure, not
          a host genotype. Inherited CYP3A4 variation might plausibly do something similar, but no ergotism-specific
          pharmacogenomic study was found, so it is not curated.
      selected_evidence:
        snippet: Ergotamine, typically used to treat migraine, has less than 5% bioavailability due to
          extensive first-pass metabolism by cytochrome P450 3A4 (CYP3A4).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24531557
      reference_title: 'Ergotism in Thailand caused by increased access to antiretroviral drugs: a global
