  aa9ce8e5519e6eecbf21df7a9bc34c4221be07351ecbaa675d8d1f5ccb3450d5:
    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: Environmental
      assertion:
        name: Therapeutic ergot alkaloid administration
        description: Ergotamine and dihydroergotamine for migraine, and ergometrine or methylergometrine
          for postpartum haemorrhage, are still in use. At therapeutic dose they are usually tolerated;
          the exposure becomes toxic through overdose, prolonged use, or - much the commonest route in
          modern series - a CYP3A4 interaction.
        exposure_term:
          preferred_term: therapeutic exposure to ergot alkaloid vasoconstrictors
          term:
            id: ECTO:9001855
            label: exposure to vasoconstrictor agent
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
          exposure_route:
          - classification_value: MULTIPLE
          exposure_duration:
          - classification_value: INTERMITTENT
          - classification_value: CHRONIC
        notes: 'Bound to `ECTO:9001855` exposure to vasoconstrictor agent rather than to the broader `ECTO:0000509`
          exposure to drug. `runoak -i sqlite:obo:ecto search ''l~ergotamine''` returns nothing, so no
          agent-specific class exists; `search ''l~vasoconstrict''` returns `ECTO:9001855`, and `info
          ECTO:9001855 -O obo` shows it is `is_a ECTO:0000509` exposure to drug and involves `CHEBI:50514`
          vasoconstrictor agent. That is exact for what these drugs are and for the property that makes
          them toxic here, so it is preferred to the parent. `exposure_route` is `MULTIPLE` because the
          implicated preparations are oral (ergotamine tablets), intramuscular (ergometrine) and intravenous
          (dihydroergotamine) across the cited cases.

          `exposure_duration` is `INTERMITTENT` and `CHRONIC` rather than `ACUTE`. Migraine dosing is
          by definition recurrent discrete exposures separated by exposure-free intervals, which is what
          `INTERMITTENT` means, and the cases in this entry ran for years - the fatal darunavir case records
          the patient "self-medicating for years", and `PMID:1908611` finds a subclinical phase preceding
          severe disease by weeks, which no 1-14 day window contains. An acute single overdose is a real
          presentation too, but it is the exception in the cited series rather than the shape of this
          exposure.'
      selected_evidence:
        snippet: Ergot's derivatives are widely used to treat and prevent migraine and, associated with
          heparin, for the prevention of deep vein thrombosis.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/1
      evidence_path: /environmental/1/evidence/0
