  17245515873effc3c3b3cde26fed17420a67aba27f97fae9bab9cdde17b02c98:
    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ergoline Agonism at Vascular 5-HT and Alpha-Adrenergic Receptors
        biological_scale: MOLECULAR
        description: The pharmacological lesion. Ergot alkaloids bind serotonin and alpha-adrenergic receptors
          on vascular smooth muscle, acting as agonists and partial agonists rather than as the antagonists
          a drug designed for this target would be. Molecular docking puts ergocristinine at the 5-HT2A
          and alpha-2A adrenergic binding sites with hydrogen bonding to the site residues, and the pharmacological
          counterpart is that a non-competitive alpha-adrenergic antagonist attenuates the contraction
          the alkaloid produces.
        molecular_functions:
        - preferred_term: agonism of ergot alkaloids at G protein-coupled serotonin receptors
          term:
            id: GO:0004993
            label: G protein-coupled serotonin receptor activity
        biological_processes:
        - preferred_term: serotonin receptor signaling driven by ergot alkaloid agonism
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0007210
            label: serotonin receptor signaling pathway
        - preferred_term: adrenergic receptor signaling driven by ergot alkaloid agonism
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0071875
            label: adrenergic receptor signaling pathway
        notes: 'Both receptor-signalling descriptors take `GAIN_OF_FUNCTION` rather than `INCREASED` deliberately,
          under the rule in CLAUDE.md that distinguishes the two. The claim is qualitative, not quantitative:
          an exogenous agonist is driving these pathways outside host regulatory control, in the same
          way HTLV-1 Tax drives NF-kB in `Adult_T_Cell_Leukemia_Lymphoma`, rather than a normally regulated
          pathway running above its usual level. That trade gives up the PATO grounding `INCREASED` would
          carry, which is why it is recorded here.'
        chemical_entities:
        - preferred_term: ergotamine
          term:
            id: CHEBI:64318
            label: ergotamine
      selected_evidence:
        snippet: The binding energy (kcal/mol) of ergocristinine was - 9.7 or - 11.0 to the serotonin
          (5-HT) 2 A receptor and - 8.7 or - 11.4 to the alpha 2 A adrenergic receptor, depending on the
          software used.
        supports: SUPPORT
    origin:
