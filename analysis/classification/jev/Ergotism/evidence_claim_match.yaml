        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: direct_clavine_cytotoxicity
        kind: KNOWLEDGE_GAP
        prompt: Does direct cytotoxicity of the clavine-type ergot alkaloids contribute to the tissue
          loss in ergotism, alongside ischaemia from vasospasm?
        attaches_to:
        - pathophysiology#Distal Tissue Ischemia and Dry Gangrene
        - experimental_models#Clavine-type ergot alkaloid cytotoxicity in HepG2 and PANC-1 cells
        rationale: 'Every pathophysiology node in this entry reaches tissue injury the same way: receptor
          agonism, sustained contraction, vasospasm, starvation of the distal tissue. That account is
          well supported and it may not be the whole account. Clavine-type ergot alkaloids reduce cell
          viability and induce apoptosis in human cell lines outright, with no vessel involved, and agroclavine
          - one of the clavines tested - is named a causative agent of ergotism and is monitored in food
          by EFSA. The same survey found clavine and peptide alkaloids together in most of the sclerotia
          it analysed, so a person eating contaminated grain is exposed to both.

          What is missing is any bridge from the dish to the limb. The cells are HepG2 hepatoma and PANC-1
          pancreatic carcinoma, neither of which is a tissue this disease damages; the alkaloid is applied
          directly at concentrations nobody has related to a plasma level in a poisoned patient; and the
          authors state that the cytotoxic mechanism itself is unelucidated. So this cannot currently
          be modelled as a mechanism. It is recorded here because the alternative - saying nothing - would
          leave the entry asserting that ischaemia is the only route to the lesion, which the evidence
          does not establish either.

          Two things would settle it: a cytotoxicity measurement in vascular endothelium, smooth muscle
          or skin rather than carcinoma lines, and a pharmacokinetic comparison between the concentrations
          that kill cells and the concentrations reached in the distal circulation during poisoning. Note
          also that the iatrogenic form of this disease involves no clavines at all - ergotamine and ergometrine
          are peptide-type - so if direct cytotoxicity does contribute, it would differentiate the dietary
          form from the drug form rather than apply to both.'
      selected_evidence:
        snippet: Clavine-type EAs are known to cause cytotoxicity, but the mechanism has not been elucidated.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
