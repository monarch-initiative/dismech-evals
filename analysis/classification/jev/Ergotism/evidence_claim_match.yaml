  bc776d6c5e9bbe4fb5b1c932450daeb20eb7dce712e41a7527f7971a967b61f4:
    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Central Serotonergic Overstimulation
        biological_scale: CELLULAR
        description: The parallel branch, and the one that produces the convulsive form. Dihydroergotamine
          binds serotonin receptors in the dorsal horn of the spinal cord, which is where the neuropathological
          changes of convulsive ergotism are found. The clinical picture - twitching, spasm, altered mental
          state, hallucination, sweating and fever over weeks - is the picture of serotonergic overstimulation,
          and dihydroergotamine given to people can produce serotonin syndrome outright.
        biological_processes:
        - preferred_term: central serotonin receptor signaling driven by ergot alkaloid agonism
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0007210
            label: serotonin receptor signaling pathway
        cell_types:
        - preferred_term: dorsal horn neuron
          term:
            id: CL:0000540
            label: neuron
        notes: The `dorsal horn neuron` cell type is bound to the broad `CL:0000540` neuron on purpose.
          CL does carry a narrower term - OLS `q=spinal cord dorsal horn interneuron, ontology=cl` returns
          `CL:0011000` dorsal horn interneuron - but the cited source says only "serotonin receptors in
          the dorsal horn of the spinal cord", and the dorsal horn contains projection neurons as well
          as interneurons. Binding `CL:0011000` would assert an interneuron the source does not name,
          which is the manufactured narrower match the term contract forbids. `q=dorsal horn neuron, ontology=cl`
          returns only dorsal root ganglion substance P neurons, which sit in the ganglion rather than
