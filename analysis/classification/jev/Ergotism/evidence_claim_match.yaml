        diagnosis_term:
          preferred_term: non-invasive blood pressure measurement
          term:
            id: NCIT:C167233
            label: Blood Pressure Measurement
        description: A trap specific to this disease. Vasospasm severe enough to abolish the peripheral
          signal makes non-invasive blood pressure read as low or unmeasurable, so the patient appears
          shocked. Treating that apparent hypotension with a vasoconstrictor would be the wrong move;
          giving an intravenous vasodilator instead makes the recorded pressure rise paradoxically, which
          is both the clue and the treatment.
      selected_evidence:
        snippet: Five of these patients initially had factitiously low or unmeasurable blood pressure
          using non-invasive technique and had paradoxical increase following intravenous vasodilator
          administration.
        supports: SUPPORT
