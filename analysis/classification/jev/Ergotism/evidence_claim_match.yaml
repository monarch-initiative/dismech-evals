      assertion_type: Environmental
      assertion:
        name: Ingestion of cereal grain contaminated with Claviceps sclerotia
        description: The historical route and still the epidemic one. Claviceps species replace the grain
          of rye and other cereals with sclerotia; if these are not removed before milling, the flour
          carries the alkaloids. This is the route of the medieval European epidemics and of the modern
          outbreaks in Ethiopia and India, which occurred where grain-cleaning infrastructure was weakest
          rather than where the fungus was newest.
        exposure_term:
          preferred_term: dietary exposure to ergot alkaloids in Claviceps-contaminated grain
          term:
            id: ECTO:0000524
            label: exposure to mycotoxin
        exposure_classifications:
          hazard_agent_type:
          - classification_value: BIOLOGICAL
          exposure_route:
          - classification_value: ORAL
          exposure_duration:
