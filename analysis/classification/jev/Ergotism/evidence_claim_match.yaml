  fc6d95f9cd7ec1fdab2c885214a2bd270f2e656d599892cfa282a04b53f5e709:
    claim:
      about:
        disease:
          name: Ergotism
          disease_term:
            preferred_term: ergotism
            term:
              id: MONDO:0042496
              label: ergotism
        context: []
      assertion_type: Environmental
      assertion:
        name: Co-administration of a strong CYP3A4 inhibitor
        description: Not a source of ergot alkaloid, but the exposure that converts a therapeutic dose
          of one into a toxic dose. The implicated inhibitors are the HIV protease inhibitors, the booster
          cobicistat, and the macrolide antibiotics. This is now the dominant precipitant of severe ergotism
          in the published record, and the combination is regarded as contraindicated.
        exposure_term:
          preferred_term: co-exposure to a strong CYP3A4 inhibitor
          term:
            id: ECTO:0000509
            label: exposure to drug
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
          exposure_route:
          - classification_value: ORAL
          exposure_duration:
          - classification_value: ACUTE
          - classification_value: CHRONIC
        notes: 'Bound to the broad `ECTO:0000509` exposure to drug on purpose. The exposure is defined
          by an enzyme-inhibition property shared across three unrelated drug classes rather than by any
          one agent, and there is no ECTO class for that property: `runoak -i sqlite:obo:ecto search ''l~cytochrome''`
          and `search ''l~CYP''` both return nothing, and `search ''l~protease inhibitor''` returns no
          exposure class either. The specific classes are named in `description` instead.

          `exposure_duration` carries both `ACUTE` and `CHRONIC` because the implicated drug classes sit
          at opposite ends of it: a macrolide course is a few days, while the HIV protease inhibitors
          and cobicistat behind most of the modern cases are taken indefinitely. The interaction needs
          only that the two exposures overlap, so neither value alone describes it.'
      selected_evidence:
        snippet: A total of 13 cases of clinical ergotism in HIV-infected patients has been published
          since 1997
        supports: SUPPORT
    origin:
