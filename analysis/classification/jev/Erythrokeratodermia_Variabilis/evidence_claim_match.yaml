        context:
        - path: /has_subtypes/6
          value:
            name: EKVP7
            display_name: EKVP7 (PERP-related, recessive)
            classification: gene
            description: Recessive desmosomal form. Homozygosity for an N-terminal PERP truncation ablates
              expression and causes widespread erythrokeratoderma. The same gene causes Olmsted syndrome
              when a C-terminal truncation is heterozygous, and the reporting authors propose that the
              two PERP diseases have distinct pathobiology rather than differing only in severity.
            subtype_term:
              preferred_term: erythrokeratodermia variabilis et progressiva 7
              term:
                id: MONDO:0030941
                label: erythrokeratodermia variabilis et progressiva 7
            genes:
            - preferred_term: PERP
              term:
                id: hgnc:17637
                label: PERP
          role: subtype
      assertion_type: Genetic
      assertion:
        name: PERP
        association: Causative
        relationship_type: CAUSATIVE
        subtype: EKVP7
        gene_term:
          preferred_term: PERP
          term:
            id: hgnc:17637
            label: PERP
        features: PERP encodes a component of desmosomes. Homozygosity for an N-terminal truncation ablates
          expression and causes the widespread erythrokeratoderma of EKVP7; heterozygosity for a C-terminal
          truncation causes Olmsted syndrome instead. Both allele classes produce immature desmosomes
          and impaired intercellular adhesion.
        notes: The two PERP diseases are allele-class dependent rather than a severity gradient. The authors
          note that the recessive allele's carriers - the proband's consanguineous parents - are unaffected,
          and that PERP heterozygous truncating variants occur in control databases, which is their argument
          against haploinsufficiency explaining the dominant disease.
      selected_evidence:
        snippet: Here we show that mutations in PERP, encoding a crucial component of desmosomes, cause
          both dominant and recessive human keratoderma.
        supports: SUPPORT
