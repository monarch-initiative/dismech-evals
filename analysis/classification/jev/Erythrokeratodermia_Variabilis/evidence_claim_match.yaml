        display_name: EKVP4 (KDSR-related, recessive)
        classification: gene
        description: 'Recessive ceramide-synthesis form caused by biallelic KDSR mutations. The reported
          phenotype sits in the progressive symmetric erythrokeratoderma spectrum rather than the migratory-patch
          picture of the connexin subtypes: severe lesions of thick scaly skin on the face and genitals,
          and thickened, red and scaly skin on the hands and feet. Systemic isotretinoin achieved nearly
          complete resolution in the two probands in whom it was applied.'
        subtype_term:
          preferred_term: erythrokeratodermia variabilis et progressiva 4
          term:
            id: MONDO:0033014
            label: erythrokeratodermia variabilis et progressiva 4
        genes:
        - preferred_term: KDSR
          term:
            id: hgnc:4021
            label: KDSR
      selected_evidence:
        snippet: we show that mutations in KDSR (3-ketodihydrosphingosine reductase), encoding an enzyme
          in the ceramide synthesis pathway, lead to a previously undescribed recessive Mendelian disorder
          in the progressive symmetric erythrokeratoderma spectrum
        supports: SUPPORT
