        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ferrochelatase Enzymatic Deficiency
        description: Ferrochelatase (FECH), the terminal enzyme of heme biosynthesis, catalyzes insertion
          of ferrous iron into protoporphyrin IX to form heme. In FECH-related EPP, one severe loss-of-function
          allele in trans to the low-expression IVS3-48C allele reduces total ferrochelatase activity
          below roughly 30% of normal, the threshold needed to keep pace with protoporphyrin production.
        cell_types:
        - preferred_term: erythroid progenitor cell
          term:
            id: CL:0000038
            label: erythroid progenitor cell
        biological_processes:
        - preferred_term: heme biosynthesis
          term:
            id: GO:0006783
            label: heme biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: EPP results from the deficient activity of ferrochelatase, the final enzyme in the heme-biosynthetic
          pathway
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
