      assertion_type: Pathophysiology
      assertion:
        name: Phototoxic Reactive Oxygen Species Dermal Injury
        description: Energy transfer from photoexcited protoporphyrin IX to oxygen generates singlet oxygen
          and other reactive oxygen species in and around dermal capillaries. These oxidize endothelial
          membranes, activate complement, and release histamines and chemotactic factors, producing perivascular
          tissue and vessel damage that is experienced as immediate burning pain, and clinically as erythema
          and edema.
        cell_types:
        - preferred_term: dermal microvascular endothelial cell
          term:
            id: CL:0002139
            label: endothelial cell of vascular tree
        - preferred_term: mast cell
          term:
            id: CL:0000097
            label: mast cell
        biological_processes:
        - preferred_term: reactive oxygen species production
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
          modifier: INCREASED
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
      selected_evidence:
        snippet: This energy is presumably released as fluorescence and by formation of singlet oxygen
          and other oxygen radicals that can produce tissue and vessel damage secondary to activation
          of the complement system.
        supports: SUPPORT
