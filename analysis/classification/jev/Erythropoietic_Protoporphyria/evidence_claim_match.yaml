        name: Erythroid Protoporphyrin IX Accumulation
        description: Whether from deficient ferrochelatase or excess precursor supply, metal-free protoporphyrin
          IX accumulates. It is generated chiefly by bone-marrow reticulocytes and late erythroid precursors,
          then loaded into circulating erythrocytes and released into plasma, from which it distributes
          to skin and the hepatobiliary system.
        cell_types:
        - preferred_term: reticulocyte
          term:
            id: CL:0000558
            label: reticulocyte
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: Protoporphyrin is released from the bone marrow into the circulating erythrocytes and
          plasma where it is taken up by the liver and vascular endothelium including the superficial
          skin vasculature.
        supports: SUPPORT
