              label: erythropoietic protoporphyria
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ALAS2 Gain-of-Function Precursor Overproduction
        description: In X-linked protoporphyria, gain-of-function C-terminal mutations in the erythroid-specific
          5-aminolevulinate synthase ALAS2 increase the rate of the first, committed step of heme biosynthesis.
          The resulting excess flux through the pathway overwhelms normal ferrochelatase capacity, so
          protoporphyrin IX (with a relatively higher zinc-protoporphyrin fraction) still accumulates.
        cell_types:
        - preferred_term: erythroid progenitor cell
          term:
            id: CL:0000038
            label: erythroid progenitor cell
        biological_processes:
        - preferred_term: porphyrin biosynthesis
          term:
            id: GO:0006779
            label: porphyrin-containing compound biosynthetic process
          modifier: INCREASED
      selected_evidence:
        snippet: Prokaryotic expression studies show that both mutations markedly increase ALAS2 activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
