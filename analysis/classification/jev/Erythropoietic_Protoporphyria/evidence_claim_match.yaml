      assertion_type: Pathophysiology
      assertion:
        name: Hepatobiliary Protoporphyrin Loading
        description: Protoporphyrin IX is lipophilic and cannot be excreted by the kidney; its only elimination
          route is biliary. Hepatocytes take up the excess protoporphyrin IX from plasma and concentrate
          it for biliary excretion, and when biliary excretion cannot keep pace with the load the pigment
          progressively accumulates in the liver.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Progressive accumulation of protoporphyrin may occur in the liver when the biliary excretion
          does not keep pace with the load being presented to the liver.
        supports: SUPPORT
