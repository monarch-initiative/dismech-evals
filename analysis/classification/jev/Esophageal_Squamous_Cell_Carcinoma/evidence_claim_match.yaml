        name: TP53 Dysfunction
        description: TP53 alteration is the dominant recurrent genetic event in ESCC and compromises cell-cycle
          checkpoint control, apoptosis, and genome integrity. Loss of p53 function permits survival and
          expansion of damaged esophageal epithelial clones.
        genes:
        - preferred_term: TP53
          term:
            id: hgnc:11998
            label: TP53
        biological_processes:
        - preferred_term: cell cycle checkpoint signaling
          modifier: DECREASED
          term:
            id: GO:0000075
            label: cell cycle checkpoint signaling
        - preferred_term: apoptotic process
          modifier: DECREASED
          term:
            id: GO:0006915
            label: apoptotic process
      selected_evidence:
        snippet: 'TP53 (68.6%; 95% CI: 61.6-74.9), CCND1 (39.3%; 95% CI: 26.2-54.1), MDM2 (24.9%; 95%
          CI: 9.5-51.0), NOTCH1/2/3 (17.9%; 95% CI: 15.0-21.2), KMT2D (17.4%; 95% CI: 12.4-23.8), CDKN2A
          (15.0%; 95% CI: 8.1-26.1), PIK3CA (13.8%; 95% CI: 10.3-18.1), FAT1 (13.3%; 95% CI: 11.7-15.0),
          and EGFR (9.9%; 95% CI: 5.6-17.0) were the most common involved genetic factors in developing
          ESCC.'
        supports: SUPPORT
