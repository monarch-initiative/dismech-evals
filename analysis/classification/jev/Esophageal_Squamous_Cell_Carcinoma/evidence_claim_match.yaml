              id: MONDO:0005580
              label: esophageal squamous cell carcinoma
        context:
        - path: /experimental_models/0
          value:
            name: Patient-derived esophageal squamous cell carcinoma organoid library (ESCCO)
            description: A library of tumor organoids grown from resected primary tumors of 24 ESCC patients
              spanning a range of stages, ages, and prior treatments, alongside organoids from each patient's
              tumor-free marginal esophageal epithelium. A non-animal New Approach Methodology that retains
              the oncogenic mutations of the parental tumor and the patient-specific chemotherapy response,
              and that was used to identify the antioxidant stress response as the feature separating
              chemo-resistant from chemo-sensitive disease.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: esophagus
              term:
                id: UBERON:0001043
                label: esophagus
            cell_types:
            - preferred_term: esophageal tumor epithelial cell
              term:
                id: CL:0002252
                label: epithelial cell of esophagus
            conditions:
            - esophageal squamous cell carcinoma
            - cisplatin and 5-fluorouracil exposure
            - chemotherapy-resistant disease
            cell_source: Organoids established from resected primary ESCC tissue of 24 patients, with
              paired organoids from tumor-free marginal esophageal epithelium as the non-malignant comparator
            culture_system: Three-dimensional organoid culture supported by Noggin, EGF, R-spondin 1 and
              the ROCK inhibitor Y-27632
            publication: PMID:40169778
            notes: 'Curated for the NAMeRS 2026 symposium New Approach Methodology pass (monarch-initiative/dismech#4873,
              sub-issue #9793). The sibling entry Esophageal_Adenocarcinoma carries an equivalent organ-chip
              record; this closes the same gap on the squamous side with a squamous-specific source.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Chemotherapy Resistance
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Reproduces patient-specific resistance to cisplatin and 5-fluorouracil in human tumor
          cells, and resolves the elevated antioxidant stress response that accompanies it.
        limitations: The organoids are composed exclusively of tumor cells, so stromal, vascular and immune
          contributions to chemotherapy resistance are outside what this system reports. Resistance is
          measured as organoid survival under drug exposure rather than as clinical response in the source
          patient.
        readouts:
        - name: Cisplatin and 5-fluorouracil sensitivity across the organoid library
          target: Chemotherapy Resistance
          direction: ALTERED
          interpretation: Drug response varied between organoid lines from different patients, with 7
            of 24 lines potently resistant, so resistance behaves as a heritable property of the tumor
            cells rather than of the treatment context.
        - name: Antioxidant stress response gene expression and chromatin accessibility
          target: Chemotherapy Resistance
          direction: INCREASED
          biological_processes:
          - preferred_term: antioxidant stress response
            description: Transcript-level and chromatin-accessibility readout of the antioxidant stress
              response in resistant lines
            term:
              id: GO:0034599
              label: cellular response to oxidative stress
          interpretation: Chemo-resistant lines showed higher antioxidant stress response gene expression
            and more open chromatin at those loci than sensitive lines, which is the molecular correlate
            this node describes.
        - name: Fedratinib-induced cell death in chemo-resistant organoids
          target: Chemotherapy Resistance
          direction: INCREASED
          interpretation: Screening the library identified a compound that kills the resistant lines,
            showing the model can be used to look for treatments for the resistant state and not only
            to describe it.
      selected_evidence:
        snippet: the chemo-resistant ESCCOs show higher genes involved in antioxidant stress response
          pathways and more accessible chromatin at their loci than the sensitive ESCCOs
        supports: SUPPORT
    origin:
