          with a constitutively elevated antioxidant stress response: chemo-resistant patient-derived
          organoids carry higher expression of antioxidant stress response genes, and more accessible
          chromatin at those loci, than sensitive organoids from the same library.'
        cell_types:
        - preferred_term: esophageal tumor epithelial cell
          term:
            id: CL:0002252
            label: epithelial cell of esophagus
        biological_processes:
        - preferred_term: antioxidant stress response
          description: Basal activation of the antioxidant stress response distinguishes chemo-resistant
            from chemo-sensitive ESCC organoids
          modifier: INCREASED
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
        notes: No causal edge is asserted into or out of this node. The organoid library establishes that
          chemo-resistance segregates with an elevated antioxidant stress response, but not which of the
          upstream nodes curated here produces that state, so an edge would over-assert.
      selected_evidence:
        snippet: The ESCCOs respond differently to cisplatin and 5-fluorouracil, chemotherapeutic agents
          commonly used to treat ESCC patients, with 7 ESCCOs exhibiting potent chemo-resistance.
        supports: SUPPORT
