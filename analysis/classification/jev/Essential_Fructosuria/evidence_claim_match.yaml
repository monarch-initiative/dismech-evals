  29de0384ceca2cca7c53cbacf572d00aca1baee508f33cf80795576760253f36:
    claim:
      about:
        disease:
          name: Essential Fructosuria
          disease_term:
            preferred_term: essential fructosuria
            term:
              id: MONDO:0009252
              label: essential fructosuria
        context: []
      assertion_type: Genetic
      assertion:
        name: KHK
        gene_term:
          preferred_term: KHK
          term:
            id: hgnc:6315
            label: KHK
        relationship_type: CAUSATIVE
        notes: KHK is alternatively spliced into KHK-C (exon 3c), the high-affinity isoform of liver,
          kidney and small intestine, and KHK-A (exon 3a), a low-affinity isoform expressed at low levels
          in other tissues. Only one family has been characterized at the molecular level (compound heterozygosity
          for p.Gly40Arg and p.Ala43Thr), so genotype-phenotype correlation beyond that family is undefined.
          No ClinGen gene-disease validity record for KHK is cached in references_cache.
        variants:
        - name: p.Gly40Arg
          description: Missense variant in a conserved region of KHK, found in trans with p.Ala43Thr in
            the affected siblings of the index family and absent from 52 unrelated controls. Recombinant
            KHK-A and KHK-C carrying Gly40Arg are inactive and largely insoluble, so the allele behaves
            as a null.
          gene:
            preferred_term: KHK
            term:
              id: hgnc:6315
              label: KHK
          type: missense_variant
        - name: p.Ala43Thr
          description: Missense variant in the same conserved region, on the allele that also carries
            the common p.Val49Ile change in the index family. The mutant enzyme retains activity but is
            thermolabile; at physiological temperature KHK-C activity is substantially lost while KHK-A
            activity is not.
          gene:
            preferred_term: KHK
            term:
              id: hgnc:6315
              label: KHK
          type: missense_variant
        - name: p.Val49Ile
          description: Common KHK missense variant (rs2304681), present on more than a third of chromosomes
            in UK Biobank participants. It does not produce fructosuria in the homozygous state and is
            not a disease allele on its own.
          gene:
            preferred_term: KHK
            term:
              id: hgnc:6315
              label: KHK
          type: missense_variant
      selected_evidence:
        snippet: Direct evidence that mutation of the KHK structural gene is the cause of essential fructosuria
          was also obtained.
        supports: SUPPORT
    origin:
