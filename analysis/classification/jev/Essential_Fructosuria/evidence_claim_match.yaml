      assertion_type: Pathophysiology
      assertion:
        name: Extrahepatic Hexokinase-Mediated Fructose Phosphorylation
        description: The fructose that is neither metabolized in liver nor excreted is phosphorylated
          at C6 by hexokinase in skeletal muscle and adipose tissue, entering glycolysis as fructose 6-phosphate.
          This route is slow, which is consistent with the slow clearance of blood fructose. It is an
          alternative pathway rather than a disease mechanism, and no clinical consequence of it is known.
        biological_scale: CELLULAR
        role: alternative metabolic route
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        - preferred_term: adipocyte
          term:
            id: CL:0000136
            label: adipocyte
        molecular_functions:
        - preferred_term: hexokinase activity
          term:
            id: GO:0004396
            label: hexokinase activity
        chemical_entities:
        - preferred_term: fructose 6-phosphate
          term:
            id: CHEBI:88003
            label: fructose 6-phosphate
          modifier: INCREASED
      selected_evidence:
        snippet: In addition, the observation of significant levels of fructose-6-phosphate in skeletal
          muscle tissue of Khk KO, but not WT, mice suggests a potential mechanism, whereby fructose is
          metabolized via muscle hexokinase in the absence of KHK.
        supports: SUPPORT
