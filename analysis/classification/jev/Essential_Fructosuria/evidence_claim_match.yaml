          A UK Biobank study found no participant with the known disease genotype, so it could not test
          long-term outcomes in affected people. This matters beyond the disease itself because KHK inhibition
          is proposed as a treatment for fatty liver disease on the premise that KHK loss is harmless.
      selected_evidence:
        snippet: inhibition of KHK offers the potential to protect from diet-induced hepatic steatosis
          and insulin resistance.
