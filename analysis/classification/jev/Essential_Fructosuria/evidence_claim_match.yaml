      assertion_type: Discussion
      assertion:
        discussion_id: khk_a_preservation
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Hepatic Ketohexokinase-C Deficiency
        - genetic#KHK
        prompt: Is essential fructosuria a hepatic-selective KHK-C deficiency with KHK-A preserved, and
          does it matter whether KHK-A is lost too?
        rationale: The only molecularly characterized family is compound heterozygous for a null allele
          and a thermolabile allele that, in recombinant enzyme, loses KHK-C activity at body temperature
          while KHK-A survives. Whether patients really retain peripheral KHK-A, and whether a genotype
          that removes both isoforms would still be benign, has not been examined in humans. Mouse knockouts
          lacking both isoforms are healthy, but mouse and human fructose handling are not interchangeable.
      selected_evidence:
        snippet: Further mutation analysis in this rare disorder could illuminate the question of whether
          ketohexokinase-A activity is, unlike that of ketohexokinase-C, physiologically indispensable.
        supports: SUPPORT
    origin:
