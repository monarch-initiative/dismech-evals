        name: JAK-STAT Pathway Hyperactivation
        conforms_to: jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear Translocation
        description: Driver mutations in JAK2, CALR, or MPL converge on constitutive JAK-STAT signaling
          activation. JAK2 V617F directly activates the kinase; CALR mutations cause aberrant activation
          of MPL receptor; MPL mutations cause constitutive thrombopoietin receptor activation.
        cell_types:
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
        biological_processes:
        - preferred_term: JAK-STAT signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
        locations:
        - preferred_term: bone marrow
          term:
            id: UBERON:0002371
            label: bone marrow
      selected_evidence:
        snippet: Polycythemia vera (PV) and essential thrombocythemia (ET) are chronic myeloproliferative
          neoplasms (MPNs), often associated with mutations in JAK2, CALR, and MPL.
        supports: SUPPORT
