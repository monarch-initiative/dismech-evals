        display_name: Hereditary essential tremor 1 (DRD3)
        description: The DRD3-defined hereditary essential tremor class. It rests on the Ser9Gly (rs6280)
          variant, which associated and cosegregated with familial ET in French families at the 3q13 linkage
          locus, with Gly-9 homozygotes presenting earlier or more severely. Ser9Gly is a common polymorphism
          rather than a rare pathogenic allele, and later case-control studies and a meta-analysis did
          not reproduce the association, so this subtype records a disputed locus rather than an established
          Mendelian form.
        subtype_term:
          preferred_term: tremor, hereditary essential, 1
