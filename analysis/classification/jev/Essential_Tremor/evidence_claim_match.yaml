              label: essential tremor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cerebellar GABAergic disinhibition
        description: Reduced GABAergic inhibitory tone within the cerebellum contributes to ET. Postmortem
          studies report reduced GABA-A and GABA-B receptor binding in the dentate nucleus, and in mouse
          models loss of the GABA-A receptor alpha1 subunit from Purkinje cells is sufficient to induce
          tremor. It remains debated whether this GABAergic deficit is a primary contributing factor or
          a downstream consequence of Purkinje-cell dysfunction/loss. Partial temporary suppression of
          tremor by ethanol (via cerebellar alpha6-containing extrasynaptic GABA-A receptors on granule
          cells) and by GABAergic drugs supports a functional role for GABAergic signaling.
        cell_types:
        - preferred_term: GABAergic neuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        - preferred_term: cerebellar granule cell
          term:
            id: CL:0001031
            label: cerebellar granule cell
        biological_processes:
        - preferred_term: gamma-aminobutyric acid signaling pathway
          term:
            id: GO:0007214
            label: gamma-aminobutyric acid signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: It remains to be elucidated whether reduced GABAergic tone is a primary contributing
          factor to ET pathophysiology, a consequence of altered Purkinje cell function, or even a result
          of Purkinje cell death.
        supports: SUPPORT
    origin:
