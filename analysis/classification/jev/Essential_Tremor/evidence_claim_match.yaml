      assertion_type: Pathophysiology
      assertion:
        name: Cerebello-thalamo-cortical oscillatory propagation
        description: Synchronized cerebellar output is relayed through the deep cerebellar (dentate) nuclei
          to the ventral intermediate nucleus (VIM) of the thalamus and onward to the motor cortex, producing
          coherent oscillatory drive to spinal motor neurons and the clinically observed action tremor.
          Aberrant synchronous oscillation across cerebellum, inferior olive, thalamus, and cortex is
          the proximate generator of tremor, and the VIM is the principal surgical target for tremor control.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: rhythmic synaptic transmission
          term:
            id: GO:0060024
            label: rhythmic synaptic transmission
          modifier: INCREASED
      selected_evidence:
        snippet: it primarily manifests as postural and kinetic tremors, predominantly in the upper limbs
        supports: SUPPORT
