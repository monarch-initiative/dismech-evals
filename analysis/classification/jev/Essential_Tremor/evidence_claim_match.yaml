      assertion_type: Pathophysiology
      assertion:
        name: FUS haploinsufficiency through nonsense-mediated decay
        biological_scale: MOLECULAR
        description: 'The ET-associated FUS nonsense allele p.Gln290Ter is degraded by nonsense-mediated
          decay, so the mutant transcript does not make a truncated protein, in contrast to the FUS variants
          that cause amyotrophic lateral sclerosis. This is the proposed mechanism of the ETM4 subtype.
          In Drosophila, expressing the human Q290X protein in dopaminergic and serotonergic neurons caused
          motor dysfunction with impaired GABAergic signaling that gabapentin rescued (PMID:27395408);
          that model overexpresses the truncated protein rather than reproducing the decay of the transcript,
          and does not involve the cerebellum, so it is not evidence for the haploinsufficiency this node
          records. The node therefore has no downstream edge in this entry, as for the other ETM genes:
          no study connects reduced FUS dosage to the olivocerebellar circuit. The decreased RNA binding
          below is inferred from the loss of one functional allele; no study has measured it in ETM4.'
        genes:
        - preferred_term: FUS
          term:
            id: hgnc:4010
            label: FUS
        molecular_functions:
        - preferred_term: FUS RNA binding
          term:
            id: GO:0003723
            label: RNA binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: nonsense-mediated decay of the mutant FUS transcript
          term:
            id: GO:0000184
            label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
      selected_evidence:
        snippet: we have shown that the ET FUS nonsense mutation is degraded by the nonsense-mediated-decay
          pathway, whereas amyotrophic lateral sclerosis FUS mutant transcripts are not
        supports: SUPPORT
