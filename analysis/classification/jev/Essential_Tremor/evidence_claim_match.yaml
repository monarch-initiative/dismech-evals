      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_cerebellar_oscillation_gaba_model
        hypothesis_label: Canonical Olivocerebellar/Cerebello-Thalamo-Cortical Oscillation and GABAergic-Dysfunction
          Model
        status: CANONICAL
        description: The prevailing model holds that ET arises from pathological, synchronized 4-12 Hz
          oscillation generated within the olivocerebellar and cerebello-thalamo-cortical circuits. The
          inferior olive's intrinsic oscillatory pacemaking, transmitted via climbing fibers, entrains
          Purkinje cells to fire synchronously; structural Purkinje-cell pathology (climbing-fiber territory
          expansion, axonal torpedoes, dendritic/spine changes, cell loss) and reduced GABAergic (dentate/Purkinje)
          inhibitory tone amplify and propagate this rhythmic activity through the dentate nucleus and
          thalamus (VIM) to motor cortex, producing action tremor. The GABA hypothesis is supported by
          pharmacology (ethanol, benzodiazepines, primidone reduce tremor), animal models (harmaline/beta-carboline;
          GABA-A alpha1 loss), and postmortem receptor-binding studies, though whether reduced GABAergic
          tone is primary or a consequence of Purkinje-cell injury remains debated.
      selected_evidence:
        snippet: demonstrated functional, neurotransmitter-related, and structural abnormalities within
          the cerebello-thalamo-cortical circuit
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
