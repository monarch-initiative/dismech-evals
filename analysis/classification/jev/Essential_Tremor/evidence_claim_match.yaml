      assertion:
        name: Inferior olivary oscillation and climbing-fiber entrainment
        description: Neurons of the inferior olive possess intrinsic oscillatory (pacemaker) properties
          that, via climbing-fiber projections, entrain cerebellar Purkinje cells to fire synchronous
          complex spikes. Enhanced electrotonic coupling of olivary neurons increases this synchrony.
          The harmaline (beta-carboline) rodent model reproduces this mechanism, generating a phenotypically
          ET-like action tremor by driving synchronized olivary firing.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
