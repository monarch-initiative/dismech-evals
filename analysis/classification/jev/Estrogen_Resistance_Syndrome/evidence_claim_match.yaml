  bd5919e6c7bfbd0a713e7134c3a3cd7941d67785fe6a9141daffcb9e42eedd8d:
    claim:
      about:
        disease:
          name: Estrogen Resistance Syndrome
          disease_term:
            preferred_term: estrogen resistance syndrome
            description: Rare genetic endocrine disease of estrogen receptor insensitivity with elevated
              estrogen and gonadotropin serum levels.
            term:
              id: MONDO:0014148
              label: estrogen resistance syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ESR1 Loss-of-Function
        biological_scale: MOLECULAR
        description: Homozygous ESR1 variants abolish or severely reduce the transcriptional activity
          of estrogen receptor alpha. The index variant is a premature stop codon at codon 157 that truncates
          the receptor; the later missense variants (Q375H, E385V, R394H, M543T) sit in the ligand-binding
          domain and impair ligand anchoring, coactivator recruitment or nuclear translocation, so the
          receptor is present but cannot drive estrogen-responsive transcription.
        genes:
        - preferred_term: ESR1
          description: The gene encoding estrogen receptor alpha, the nuclear receptor whose biallelic
            loss defines the disease.
          term:
            id: hgnc:3467
            label: ESR1
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: nuclear estrogen receptor activity
          modifier: LOSS_OF_FUNCTION
          description: The receptor cannot transduce estradiol into transcriptional output. This is a
            qualitative loss in the receptor's own function rather than a lower level of a regulated activity,
            hence LOSS_OF_FUNCTION rather than DECREASED.
          term:
            id: GO:0030284
            label: nuclear estrogen receptor activity
      selected_evidence:
        snippet: Direct sequencing of exon 2 revealed a cytosine-to-thymine transition at codon 157 of
          both alleles, resulting in a premature stop codon.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
