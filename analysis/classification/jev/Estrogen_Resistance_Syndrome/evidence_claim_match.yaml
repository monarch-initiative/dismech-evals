        description: 'The biochemical signature is markedly elevated estradiol together with elevated
          gonadotropins, which separates receptor resistance from aromatase deficiency: in that disease
          the same high gonadotropins accompany low or undetectable estradiol. Estrogen-regulated hepatic
          binding proteins are not raised despite the high estradiol, which is the confirmatory sign that
          the hormone is not being transduced. Diagnosis is completed by ESR1 sequencing, which in every
          reported case shows a homozygous variant.'
