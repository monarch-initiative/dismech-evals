  8808b137c5a55f42491fab1281c706f05b2acd6857a79e6bd883dd8e482fbeaf:
    claim:
      about:
        disease:
          name: Estrogen Resistance Syndrome
          disease_term:
            preferred_term: estrogen resistance syndrome
            description: Rare genetic endocrine disease of estrogen receptor insensitivity with elevated
              estrogen and gonadotropin serum levels.
            term:
              id: MONDO:0014148
              label: estrogen resistance syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Estrogen Administration
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: Estrogen given to test or overcome the resistance. Transdermal estradiol for six
          months produced no detectable response in the index male, and ethinyl-estradiol followed by
          tamoxifen did not arrest bone loss in a female followed for eight years. Ethinyl-estradiol did
          improve insulin sensitivity, lower leptin and raise some estrogen-regulated liver proteins in
          that patient, so a partial metabolic benefit is documented while the skeletal phenotype is not
          treatable by this route. No effective therapy for the bone disease is known.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: estradiol
            term:
              id: CHEBI:23965
              label: estradiol
          - preferred_term: ethinylestradiol
            description: The agent used in the eight-year follow-up, where it improved insulin sensitivity
              without arresting bone loss.
            term:
              id: CHEBI:4903
              label: 17alpha-ethynylestradiol
          - preferred_term: diethylstilbestrol
            description: Tried for two and a half years in the first female case because it transactivated
              her variant receptor in vitro; it induced no secondary sexual characteristics.
            term:
              id: CHEBI:41922
              label: diethylstilbestrol
      selected_evidence:
        snippet: Osteoporosis worsened (Z-score -5.6 at the lumbar spine; Z-score -4.4 at the femoral
          neck) despite successive treatments with ethinyl-estradiol and tamoxifen (selective estrogen
          modulator).
        supports: REFUTE
