          the receptor; the later missense variants (Q375H, E385V, R394H, M543T) sit in the ligand-binding
          domain and impair ligand anchoring, coactivator recruitment or nuclear translocation, so the
          receptor is present but cannot drive estrogen-responsive transcription.
