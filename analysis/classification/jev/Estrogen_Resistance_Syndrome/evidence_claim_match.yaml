        notes: 'Every reported case is homozygous. Variants: p.Arg157Ter (the 1994 index male), p.Gln375His
          (the first female, 2013), p.Arg394His (three Algerian siblings, 2017), p.Glu385Val (two Jordanian
          sisters, 2022), p.Met543Thr (a 2025 case report) and an unspecified homozygous variant in a
          13-year-old girl reported in 2024 (PMID:39295121). That report''s abstract calls the syndrome
          autosomal dominant, which contradicts its own homozygous finding and related parents, and is
          not followed here. A heterozygous p.Ala207Thr variant reported in a woman with polycystic ovary
          syndrome and a poor gonadotropin response during IVF (PMID:36401248) is not counted here: it
          is heterozygous, functionally untested and in a patient with a different diagnosis.'
      selected_evidence:
        snippet: Direct sequencing of exon 2 revealed a cytosine-to-thymine transition at codon 157 of
          both alleles, resulting in a premature stop codon.
