        name: Progestin Suppression of Gonadotropin-Driven Ovarian Enlargement
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: Norethisterone given to the first female case was temporally associated with falling
          estradiol and with reduction in ovarian volume and cyst number, which returned when it was stopped.
          The progesterone receptor is intact in this disease, so progestin feedback can restrain the
          gonadotropin drive that the absent estrogen feedback releases. This is the only reported intervention
          that changes a phenotype here, and it addresses the ovarian consequence rather than the receptor
          defect.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: norethisterone
            term:
              id: CHEBI:7627
              label: norethisterone
      selected_evidence:
        snippet: In addition, the administration of norethindrone was temporally associated with reductions
          in ovarian volume and number of cysts, which suggests that negative feedback mediated by progesterone
          receptor was intact.
        supports: SUPPORT
