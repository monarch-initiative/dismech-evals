      assertion_type: Biochemical
      assertion:
        name: Serum osmolal gap
        notes: Rises first and falls as metabolism proceeds, because it tracks the unmetabolised parent
          alcohol. The two gaps therefore cross over in time. A patient sampled early can have a wide
          osmolal gap and a normal anion gap, and a patient sampled late the reverse, so either test alone
          can reassure wrongly. Both being abnormal at once is the informative combination.
      selected_evidence:
        snippet: The presence of both laboratory abnormalities concurrently is an important diagnostic
          clue, although either can be absent, depending on the time after exposure when blood is sampled.
        supports: SUPPORT
