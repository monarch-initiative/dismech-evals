  1929f8bd7de52ccd97d1976d2dc7ce26df1424d0d864a7faebefef9a2f144878:
    claim:
      about:
        disease:
          name: Ethylene Glycol Poisoning
          disease_term:
            preferred_term: ethylene glycol poisoning
            term:
              id: MONDO:0017861
              label: ethylene glycol poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oxalic Acid Production and Calcium Oxalate Crystal Deposition
        description: 'Oxalate is the terminal metabolite. It precipitates with calcium as insoluble calcium
          oxalate in the renal tubules. Plasma and urinary oxalate outlast the parent alcohol by days:
          in a reported case the parent compound was cleared within 36 hours by dialysis while plasma
          oxalate peaked on day 3 and did not normalise until day 7. The crystal burden is therefore still
          being laid down after the poison itself has gone.'
        role: mechanism
        biological_scale: TISSUE
        locations:
        - preferred_term: proximal tubule
          term:
            id: UBERON:0004134
            label: proximal tubule
      selected_evidence:
        snippet: Both lead to calcium-oxalate oversaturation and hence to the risk of local (renal) or
          systemic crystal deposition.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18696123
      reference_title: Hyperoxaluria after ethylene glycol poisoning.
      evidence_source: HUMAN_CLINICAL
      explanation: Links raised plasma and urinary oxalate to calcium oxalate oversaturation and crystal
        deposition.
