  9c7b4b86223ba67b782665420904345c0c48db32eedb74f2fe6bd6bd52ed277c:
    claim:
      about:
        disease:
          name: Ethylene Glycol Poisoning
          disease_term:
            preferred_term: ethylene glycol poisoning
            term:
              id: MONDO:0017861
              label: ethylene glycol poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Glycolic Acid Accumulation and High Anion Gap Metabolic Acidosis
        description: 'Glycolic acid accumulates and consumes bicarbonate, producing the high anion gap
          acidosis that dominates early presentation. The osmolal gap moves the other way in time: it
          is highest while unmetabolised alcohol is still present, and falls as the anion gap rises. A
          patient sampled late can have a normal osmolal gap and a large anion gap, and a patient sampled
          early the reverse, which is why either alone can mislead.'
        role: amplifier
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Accumulation of the alcohols in the blood can cause an increment in the osmolality, and
          accumulation of their metabolites can cause an increase in the anion gap and a decrease in serum
          bicarbonate concentration.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18045860
      reference_title: 'Toxic alcohol ingestions: clinical features, diagnosis, and management.'
      evidence_source: OTHER
      explanation: Separates the osmolal gap, which tracks the parent alcohol, from the anion gap, which
        tracks the metabolites - the basis for the timing caveat in this node's description.
