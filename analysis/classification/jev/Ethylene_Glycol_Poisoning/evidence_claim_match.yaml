            term:
              id: MONDO:0017861
              label: ethylene glycol poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Proximal Tubular Epithelial Cell Death
        description: 'Death of proximal tubular epithelium. The killing agent is the crystal, not the
          ion: calcium oxalate monohydrate crystals produce membrane damage and cell death in human proximal
          tubule cells, while oxalate held in solution and prevented from crystallising does not. Acidosis
          potentiates that crystal cytotoxicity, so the two arms of this poisoning are not independent
          - the glycolic acid load makes the oxalate crystals more lethal to the same cells. Glycolate
          itself does not potentiate it.'
        role: central_effector
        biological_scale: TISSUE
        conforms_to: drug_induced_nephrotoxicity#Proximal Tubular Epithelial Cell Death
        cell_types:
        - preferred_term: kidney proximal tubule epithelial cell
          term:
            id: CL:0002306
            label: epithelial cell of proximal tubule
        biological_processes:
        - preferred_term: cell death
          term:
            id: GO:0008219
            label: cell death
          modifier: INCREASED
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: These results demonstrate that COM crystals, and not the oxalate ion, are responsible
          for the membrane damage and cell death observed in normal human and rat PT cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15695020
      reference_title: The cytotoxicity of oxalate, metabolite of ethylene glycol, is due to calcium oxalate
        monohydrate formation.
      evidence_source: IN_VITRO
      explanation: Discriminates crystal from ion as the cytotoxic species in human proximal tubule cells,
        which is what makes crystal deposition the causal step rather than a marker of oxalate load.
