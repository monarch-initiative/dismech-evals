              id: MONDO:0017861
              label: ethylene glycol poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ethylene Glycol Ingestion and Alcohol Dehydrogenase Bioactivation
        description: Ingested ethylene glycol is oxidised by alcohol dehydrogenase to glycolaldehyde and
          onward to glycolic and oxalic acid. The parent alcohol is only mildly intoxicating; the toxicity
          belongs to the metabolites. That is what makes this a bioactivation poisoning rather than a
          direct one, and it is why an enzyme inhibitor works as an antidote while removing the parent
          compound alone does not.
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake
        molecular_functions:
        - preferred_term: alcohol dehydrogenase (NAD+) activity
          term:
            id: GO:0004022
            label: alcohol dehydrogenase (NAD+) activity
          modifier: INCREASED
        notes: Conformance is asserted on the shared step of a nephrotoxin being concentrated and acted
          on in the kidney, not on the agent being a drug. The module's trigger names a nephrotoxic drug;
          ethylene glycol is an ingested industrial alcohol. Unlike the chronic dietary exposures curated
          elsewhere in this KB, the acute time course of the module fits this disease exactly.
      selected_evidence:
        snippet: The effects of these substances, except for isopropanol and possibly alcoholic ketoacidosis,
          are due to their metabolites, which can cause metabolic acidosis and cellular dysfunction.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18045860
      reference_title: 'Toxic alcohol ingestions: clinical features, diagnosis, and management.'
      evidence_source: OTHER
      explanation: States that the toxicity belongs to the metabolites rather than the parent alcohols,
        which is the claim this node is built on.
