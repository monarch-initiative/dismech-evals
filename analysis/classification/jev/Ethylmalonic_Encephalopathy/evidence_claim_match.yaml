        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hydrogen sulfide accumulation
        description: 'In the absence of ETHE1-sulfur dioxygenase, hydrogen sulfide (H2S) accumulates in
          critical tissues — colonic mucosa, liver, muscle, and brain — and thiosulfate is excreted in
          massive amounts in urine. H2S is a powerful inhibitor of cytochrome c oxidase and of short-chain
          fatty acid oxidation and has vasoactive/vasotoxic effects, making it the central toxic species
          of the disease.

          '
        chemical_entities:
        - preferred_term: hydrogen sulfide
          term:
            id: CHEBI:16136
            label: hydrogen sulfide
          modifier: INCREASED
        - preferred_term: thiosulfate
          term:
            id: CHEBI:26977
            label: thiosulfate
          modifier: INCREASED
      selected_evidence:
        snippet: The main consequence of the absence of Ethe1-SDO is the accumulation of sulfide (H(2)S)
          in critical tissues, including colonic mucosa, liver, muscle, and brain.
        supports: SUPPORT
