            label: ETHE1
        inheritance:
        - name: Autosomal recessive
          description: Biallelic pathogenic ETHE1 variants are required; carriers are asymptomatic.
        features: 'ETHE1 encodes a beta-lactamase-like, iron-coordinating metalloprotein imported into
          the mitochondrial matrix that functions as a sulfur dioxygenase. Recurrent pathogenic variants
          reported in the literature include the homozygous p.R163Q, p.R163W, exon 4 deletion, p.Glu44ValfsTer62
          and p.M1I alleles.

          '
      selected_evidence:
        snippet: The most common ETHE1 gene homozygous state mutations were (p.R163Q) (c.488G>A), exon
          4 deletion, (p.R163W)(c.487C>T), (p.Glu44ValfsTer62)(c.131_132delAG) and (p.M1I)(c.3G>T) mutations,
          respectively.
        supports: SUPPORT
