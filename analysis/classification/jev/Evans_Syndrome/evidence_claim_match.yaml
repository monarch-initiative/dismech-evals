              label: Evans syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: es-as-iei-presentation
        hypothesis_label: Evans syndrome as a presenting phenotype of an inborn error of immunity
        status: EMERGING
        description: 'On this view Evans syndrome in a child is not a diagnosis but a presentation, and
          the real diagnosis is a named inborn error of immunity. It is EMERGING rather than CANONICAL
          because the yield is partial: in a prospective cohort referred specifically for this evaluation,
          the classic autoimmune lymphoproliferative syndrome was confirmed in 16 percent, leaving most
          patients without that label even after biomarker and genetic assessment.'
      selected_evidence:
        snippet: Interestingly, an association between ALPS and ES has been documented only in children.
        supports: SUPPORT
