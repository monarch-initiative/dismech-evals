  2242a650c69069dda71893054fec1938c07d319fd36dc539c525a77715d02d68:
    claim:
      about:
        disease:
          name: Evans Syndrome
          disease_term:
            preferred_term: Evans syndrome
            term:
              id: MONDO:0016030
              label: Evans syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Hematologic
        name: Mucocutaneous Bleeding
        description: 'Spontaneous bleeding into skin and mucous membranes: petechiae, ecchymoses, gingival
          bleeding and epistaxis. This is the clinical manifestation the platelet arm produces, and it
          is the counterpart of the jaundice the erythrocyte arm produces. The entry previously asserted
          the outcome, naming bleeding among the leading causes of death in progression, without modelling
          the manifestation.'
        phenotype_term:
          preferred_term: Mucocutaneous bleeding
          term:
            id: HP:0001892
            label: Abnormal bleeding
        notes: No frequency band, because the two cached sources make different claims. One lists the
          bleeding manifestations as part of the general clinical picture with no denominator; the other
          reports 12 of 42 children with a haemorrhagic complication, which is a severity claim rather
          than a prevalence one. Banding either as the frequency of bleeding would overstate what was
          measured. On the binding, `runoak -i ols:hp search "mucocutaneous bleeding"` and `search "mucosal
          hemorrhage"` both return nothing, and `search "bleeding"` returns HP:0011889 Bleeding with minor
          or no trauma as the nearest narrower candidate. That was rejected because neither source states
          the trauma context, so it would assert more than the quotes support. HP:0001892 covers the four
          named manifestations without adding a qualifier. The individual manifestations resolve (HP:0000967
          Petechiae, HP:0031364 Ecchymosis, HP:0000225 Gingival bleeding, HP:0000421 Epistaxis) and could
          be split out if a source ever reports them with separate frequencies.
      selected_evidence:
        snippet: Twenty-four (58%) patients had complications – 12 hemorrhagic and 12 suffered severe
          infections, mainly sepsis, pneumonia, meningitis, abscess and osteomyelitis.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/5
