      assertion_type: Pathophysiology
      assertion:
        name: Loss of Lymphocyte Self-Tolerance
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: The unifying lesion, and the reason the syndrome is one disease rather than two coincident
          ones. Tolerance fails broadly enough that autoantibodies arise against more than one blood lineage.
          In children this failure increasingly has a named molecular cause in an inborn error of immunity;
          in adults it more often sits on lupus, a lymphoproliferative disorder or common variable immunodeficiency,
          and in half of cases no cause is found at all.
        genes:
        - preferred_term: CTLA4
          term:
            id: hgnc:2505
            label: CTLA4
        - preferred_term: LRBA
          term:
            id: hgnc:1742
            label: LRBA
