      assertion_type: EpidemiologyInfo
      assertion:
        name: Rarity relative to its component cytopenias
        description: Evans syndrome is an order of magnitude rarer than either of the diseases it combines,
          which is why most of what is known comes from small retrospective series rather than trials.
      selected_evidence:
        snippet: At an incidence of approximately 10 to 30 times lower than AIHA and ITP, respectively,
          ES has been historically overlooked
        supports: SUPPORT
