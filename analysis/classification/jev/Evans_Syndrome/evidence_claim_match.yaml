      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cd4-cd8-ratio-direction
        hypothesis_label: The CD4 to CD8 ratio as cause versus consequence
        status: ALTERNATIVE
        description: 'A reduced CD4 to CD8 ratio is reported consistently in this syndrome, and the literature
          groups it with the molecular deficiencies as an explanation of pathophysiology. But an alternative
          reading is available and is not excluded by any cached source: chronic destruction of blood
          cells is itself a chronic antigenic stimulus, and an expanded cytotoxic compartment is what
          that would produce. The observation would look the same either way. This is recorded as ALTERNATIVE
          rather than folded into the main pathograph because the entry should not present a correlation
          as a direction.'
      selected_evidence:
        snippet: Recent molecular theories explaining the physiopathology of ES include deficiencies of
          CTLA-4, LRBA, TPP2 and a decreased CD4/CD8 ratio.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
