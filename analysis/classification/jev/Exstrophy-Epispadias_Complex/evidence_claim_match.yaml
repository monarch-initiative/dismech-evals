            name: Cloacal Membrane Overdevelopment and Premature Rupture
            description: 'The leading developmental hypothesis holds that EEC results from mechanical
              disruption or enlargement of the cloacal membrane. The cloacal membrane is a bilaminar (ectoderm-endoderm)
              structure at the caudal end of the embryo with no intervening mesoderm. An abnormally large,
              caudally positioned membrane acts as a mechanical wedge that prevents the medial migration
              of infraumbilical mesenchyme that should form the lower abdominal wall, pelvis, and genital
              tubercle. The timing of premature rupture of this unstable membrane determines the severity
              of the resulting malformation: rupture after complete urorectal septation yields classic
              bladder exstrophy, very early rupture (before the urorectal septum has divided the cloaca)
              yields cloacal exstrophy, and a limited dorsal defect yields isolated epispadias.'
