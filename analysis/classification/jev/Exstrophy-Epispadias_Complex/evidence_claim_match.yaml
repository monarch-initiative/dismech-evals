      assertion_type: Pathophysiology
      assertion:
        name: ISL1-Associated Disruption of Pericloacal Mesenchyme and Urinary Tract Development
        description: Genome-wide association studies have identified the LIM-homeodomain transcription
          factor ISL1 (at chromosomal region 5q11.1) as the major susceptibility gene for classic bladder
          exstrophy. ISL1 is a master control gene expressed in the pericloacal mesenchyme and urorectal
          septum during the critical time frame for human bladder-exstrophy development. Developmental
          biology models (mouse lineage tracing, zebrafish) localize ISL1 activity to the forming urinary
          tract and genital region, supporting a model in which altered ISL1-dependent regulation of pericloacal
          mesenchyme and urinary tract development predisposes to the failure of lower abdominal wall
          and bladder closure.
        cell_types:
        - preferred_term: Pericloacal mesenchymal cell
          term:
            id: CL:0008019
            label: mesenchymal cell
        locations:
        - preferred_term: Urorectal septum
          term:
            id: UBERON:0005760
            label: urorectal septum
        biological_processes:
        - preferred_term: Urinary bladder development
          term:
            id: GO:0060157
            label: urinary bladder development
          modifier: ABNORMAL
        - preferred_term: External genitalia morphogenesis
          term:
            id: GO:0035261
            label: external genitalia morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: The present study identified the first genome-wide significant locus for CBE at chromosomal
          region 5q11.1, and provides strong evidence for the hypothesis that ISL1 is the responsible
          candidate gene in this region.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
