  f1be4b88f07c1b4ddbd0caad606fd66105e40ab5d271b968af0f47fbe5bdcaaf:
    claim:
      about:
        disease:
          name: Exstrophy-Epispadias Complex
          disease_term:
            preferred_term: Exstrophy-Epispadias Complex
            term:
              id: MONDO:0017919
              label: exstrophy-epispadias complex
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cloacal Membrane Overdevelopment and Premature Rupture
        description: 'The leading developmental hypothesis holds that EEC results from mechanical disruption
          or enlargement of the cloacal membrane. The cloacal membrane is a bilaminar (ectoderm-endoderm)
          structure at the caudal end of the embryo with no intervening mesoderm. An abnormally large,
          caudally positioned membrane acts as a mechanical wedge that prevents the medial migration of
          infraumbilical mesenchyme that should form the lower abdominal wall, pelvis, and genital tubercle.
          The timing of premature rupture of this unstable membrane determines the severity of the resulting
          malformation: rupture after complete urorectal septation yields classic bladder exstrophy, very
          early rupture (before the urorectal septum has divided the cloaca) yields cloacal exstrophy,
          and a limited dorsal defect yields isolated epispadias.'
        cell_types:
        - preferred_term: Infraumbilical body-wall mesenchymal cell
          term:
            id: CL:0008019
            label: mesenchymal cell
        locations:
        - preferred_term: Cloacal membrane
          term:
            id: UBERON:0006217
            label: cloacal membrane
        - preferred_term: Urorectal septum
          term:
            id: UBERON:0005760
            label: urorectal septum
        biological_processes:
        - preferred_term: Cloaca development
          term:
            id: GO:0035844
            label: cloaca development
          modifier: ABNORMAL
        - preferred_term: Embryonic morphogenesis of the ventral body wall
          term:
            id: GO:0048598
            label: embryonic morphogenesis
          modifier: ABNORMAL
        - preferred_term: Medial migration of mesenchyme into the lower abdominal wall
          term:
            id: GO:0090497
            label: mesenchymal cell migration
          modifier: DECREASED
      selected_evidence:
        snippet: EEC results from mechanical disruption or enlargement of the cloacal membrane; the timing
          of the rupture determines the severity of the malformation.
        supports: SUPPORT
