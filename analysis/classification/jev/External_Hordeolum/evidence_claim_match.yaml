      assertion:
        name: Internal Hordeolum
        description: Internal hordeolum affects the tarsal-plate meibomian gland, whereas external hordeolum
          affects the glands of Zeis or Moll associated with eyelash follicles.
        distinguishing_features:
        - Internal lesions are meibomian-gland centered rather than lash-follicle associated.
      selected_evidence:
        snippet: When the meibomian gland in the tarsal plate is affected, internal hordeolum occurs,
          while when the glands of Zeis or Moll associated with eyelash follicles are affected, external
          hordeolum, or stye occurs.
        supports: SUPPORT
