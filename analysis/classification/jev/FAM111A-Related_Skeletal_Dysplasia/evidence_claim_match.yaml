  e70df81f8db04af07cd173a564289b04e26b11dd8cdf757ed68ab7baf967d346:
    claim:
      about:
        disease:
          name: FAM111A-Related Skeletal Dysplasia
          disease_term:
            preferred_term: FAM111A-related skeletal dysplasia
            term:
              id: MONDO:1060172
              label: FAM111A-related skeletal dysplasia
        context: []
      assertion_type: Genetic
      assertion:
        name: FAM111A
        gene_term:
          preferred_term: FAM111A
          term:
            id: hgnc:24725
            label: FAM111A
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: 'FAM111A (11q12.1) encodes a 611-amino-acid putative trypsin-like serine protease that
          protects replication forks from stalling at PARP1-DNA complexes and topoisomerase-1 cleavage
          complexes. Disease variants are missense and confined to a few residues within the trypsin-like
          peptidase domain. Molecular modelling places the KCS and OCS residues away from the active site
          and clustered on or near the outer surface, which is why the proposed pathogenesis involves
          altered partner interaction rather than impaired catalysis.


          Three features of the allelic spectrum are worth stating explicitly. First, there is a single
          dominant hotspot: c.1706G>A p.(Arg569His). Seven of eight patients in the largest Chinese series
          carried it, it recurs in unrelated patients across independent reports, and a systematic review
          of 46 genetically confirmed KCS2 patients concluded it is *the* hotspot variant. Notably R569H
          lies outside the peptidase domain, in the C-terminal region - so the "confined to the peptidase
          domain" summary above is true of most disease alleles but not of the commonest one.


          Second, de novo occurrence is the rule but not the law. The discovery cohort was entirely de
          novo, yet a three-generation Chinese family established father-to-daughter transmission, so
          the recurrence counselling cannot assume a de novo event without testing the parents.


          Third, the alleles are quantitatively rather than qualitatively different. Recombinant FAM111A
          carrying the recessive Y414C substitution dimerizes normally and is more active than wild type
          but less active than the dominant KCS2 mutants. That graded activation is what reconciles dominant
          and recessive inheritance in one gene: a strongly activating allele suffices in one copy, a
          weakly activating one needs two.'
        variants:
        - name: c.1706G>A p.(Arg569His)
          description: The dominant hotspot allele. Heterozygous, usually de novo, and recurrent in unrelated
            KCS2 patients across independent reports. It lies outside the trypsin-like peptidase domain,
            in the C-terminal region, and enhances rather than compromises FAM111A autocleavage activity.
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: Hypermorphic - increases FAM111A activity
            description: Grouped with the other KCS2 and OCS alleles that enhance autocleavage; the disease
              mechanism is excess rather than absent protease function.
        - name: c.1241A>G p.(Tyr414Cys)
          description: A recessive, weakly activating allele. Homozygotes have KCS2; the heterozygous
            relatives are asymptomatic. The paired allele c.1240T>A p.(Tyr414Asn) at the same residue
            causes the lethal OCS phenotype when homozygous.
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: Hypermorphic - mildly increases FAM111A activity
            description: More active than wild type but less active than the dominant KCS2 mutants, which
              is why two copies are required.
      selected_evidence:
        snippet: All cases harboured missense variants of FAM111A, and nucleotides c.1706 arose as a mutational
          hotspot, with seven individuals harbouring a c.1706G>A (p.Arg569His) variant, and one child
          harbouring a c.1531T>C (p.Tyr511His) variant.
        supports: SUPPORT
    origin:
