      assertion_type: Pathophysiology
      assertion:
        name: Peptidase-Dependent Single-Stranded DNA Accumulation
        biological_scale: MOLECULAR
        description: 'The first cellular step downstream of the hypermorphic protease. FAM111A is a replisome-associated
          protein that supports efficient activation of DNA replication origins; when it is present in
          excess, the same activity produces extensive single-stranded DNA. Three dependencies pin this
          to protease action during replication rather than to a structural role: the ssDNA requires S-phase
          entry, it requires FAM111A peptidase activity, and it does not require PCNA binding. What is
          still missing is the substrate - the repertoire of FAM111A substrates has not been identified
          - so nothing yet explains why parathyroid and skeletal progenitors are the tissues that fail.'
        biological_processes:
        - preferred_term: DNA replication initiation
          term:
            id: GO:0006270
            label: DNA replication initiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: we show that FAM111A facilitates efficient activation of DNA replication origins
        supports: SUPPORT
