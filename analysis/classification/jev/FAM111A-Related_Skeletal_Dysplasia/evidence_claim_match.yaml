      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing of FAM111A
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        presence: Heterozygous FAM111A pathogenic variant, most often c.1706G>A p.(Arg569His)
        description: 'GeneReviews requires a heterozygous pathogenic variant, which covers the dominant
          presentations that account for nearly all cases. Two caveats it predates: recessive disease
          exists - homozygosity for a weakly activating Tyr414 allele, with unaffected heterozygous parents
          - so a homozygous result in a consanguineous family is not a reporting error; and vertical transmission
          has been documented, so an apparently de novo variant should still prompt parental testing before
          recurrence counselling.'
      selected_evidence:
        snippet: In the present study, we have identified 2 FAM111A missense variants that replace the
          same critical amino acid, p.Y414C and p.Y414N, that cause KCS2 and OCS, respectively, only when
          homozygous.
        supports: SUPPORT
