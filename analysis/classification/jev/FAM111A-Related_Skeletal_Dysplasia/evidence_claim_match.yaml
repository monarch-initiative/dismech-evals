  4a7b3b9dfaba3e5bfc2fbc55e43aeea6cf44c4291948d141ca17e078ba85712c:
    claim:
      about:
        disease:
          name: FAM111A-Related Skeletal Dysplasia
          disease_term:
            preferred_term: FAM111A-related skeletal dysplasia
            term:
              id: MONDO:1060172
              label: FAM111A-related skeletal dysplasia
        context:
        - path: /animal_models/0
          value:
            name: Fam111a knockout mouse (Fam111a-/- C57BL/6N)
            species: Mouse
            genotype: Fam111a-/- (constitutive knockout), C57BL/6N
            publication: PMID:35715480
            description: 'The first and so far only in vivo characterization of FAM111A, and a comprehensively
              negative one: knockout mice have normal weight, normal serum PTH, normal serum and 24-hour
              urinary magnesium, calcium and phosphate, normal expression of the calciotropic, magnesiotropic
              and phosphotropic transport genes in kidney, duodenum and colon, normal femoral bone morphology
              and density, and normal kidney and parathyroid histology.


              This is a model of the wrong lesion, and its negative result is the point. Human disease
              alleles are hypermorphic missense variants that make FAM111A more active, so deleting the
              gene is not a milder version of the disease - it is the opposite manipulation. The absence
              of any phenotype in the null is therefore consistent with, rather than contrary to, a gain-of-function
              mechanism, and it means that no animal model of KCS2 or OCS currently exists.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Parathyroid Hormone Production and Calcium Homeostasis
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: 'The defining endocrine phenotype of the human disease is entirely absent: serum
          PTH, calcium, phosphate and magnesium are all unaltered, and parathyroid histology is normal.'
        limitations: A constitutive null models loss of function, whereas human KCS2 and OCS are caused
          by hypermorphic missense alleles - so the model tests the wrong direction of effect and cannot
          bear on whether excess FAM111A protease activity damages the parathyroid. The authors additionally
          note the animals were on a standard diet, leaving open whether a challenge would unmask a phenotype.
        readouts:
        - name: Serum PTH, calcium, phosphate and magnesium
          target: Impaired Parathyroid Hormone Production and Calcium Homeostasis
          direction: UNCHANGED
          interpretation: A genuine negative result - the electrolyte and PTH abnormalities that define
            the human disease do not occur when Fam111a is deleted.
      selected_evidence:
        snippet: In conclusion, our study is the first to characterise the function of FAM111A in vivo
          and we report that mice lacking FAM111A exhibit normal electrolyte homeostasis on a standard
          diet.
        supports: REFUTE
    origin:
      assertion_path: /animal_models/0/modeled_mechanisms/0
      evidence_path: /animal_models/0/modeled_mechanisms/0/evidence/0
