            term:
              id: MONDO:0980755
              label: mitochondrial complex IV deficiency, nuclear type 24
        context: []
      assertion_type: Biochemical
      assertion:
        name: Reduced cytochrome c oxidase activity
        presence: Decreased
        context: Patient fibroblasts have predominantly complex IV deficiency; subject 3 muscle also has
          abnormal combined respiratory-chain assays. Normal routine muscle morphology does not exclude
          the enzymatic defect.
      selected_evidence:
        snippet: The activity of the OXPHOS complexes was measured in a muscle biopsy specimen from subject
          3. This analysis showed a severe deficiency in complex IV activity. Addition- ally, complex
          II activity was profoundly increased, while complex II+III activity was only slightly elevated,
          indicating a deficiency in complex III activity. Rotenone-sensitive complex I+III activity was
          also decreased (Table S2).
        supports: SUPPORT
