  d6301a365a0d7b3a93f736f35fbe61534121ca441dcea5c55bbd03ba45d266a9:
    claim:
      about:
        disease:
          name: FASTKD5-Related COX Deficiency
          disease_term:
            preferred_term: FASTKD5-related COX deficiency (MC4DN24)
            term:
              id: MONDO:0980755
              label: mitochondrial complex IV deficiency, nuclear type 24
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Respiratory-chain enzyme and muscle evaluation
        description: Enzymology can support variant interpretation. Subject 2 had COX-deficient muscle
          histochemistry; subject 3 had normal routine pathology but severe complex IV enzymatic deficiency
          and abnormal combined assays. An isolated complex IV pattern is not a required finding in every
          tissue.
      selected_evidence:
        snippet: The activity of the OXPHOS complexes was measured in a muscle biopsy specimen from subject
          3. This analysis showed a severe deficiency in complex IV activity. Addition- ally, complex
          II activity was profoundly increased, while complex II+III activity was only slightly elevated,
          indicating a deficiency in complex III activity. Rotenone-sensitive complex I+III activity was
          also decreased (Table S2).
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/0
      context_paths:
