          p.Tyr125Cys partly restores COX activity, motivating a proposal to stabilize that protein. No
          stabilizing compound or clinical gene therapy was tested in this report.
      selected_evidence:
        snippet: The p.Tyr125Cys FASTKD5 protein was unstable, as it was ex- pressed at levels significantly
          lower than the WT protein in fibroblasts from both the subjects and control individ- uals (Figure
          4A). However, expression of this variant was able to double the COX activity in subject 2 (from
          32% to 66%), confirming that the effect of the variant p. Tyr125Cys is hypomorphic due to the
          reduced stability of the protein (Figure 4B).
        supports: SUPPORT
