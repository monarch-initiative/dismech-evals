      assertion_type: Genetic
      assertion:
        name: FASTKD5
        gene_term:
          preferred_term: FASTKD5
          term:
            id: hgnc:25790
            label: FASTKD5
        inheritance:
        - name: Autosomal recessive
        features: The founding series contains three missense and two frameshift alleles in three unrelated
          compound heterozygous subjects. Protein instability and impaired processing function are distinct
          mechanisms. The shared p.Tyr125Cys allele retains function; residual activity in cultured cells
          is not a validated individual prognostic test. Subject 2 additionally has a maternally inherited
          1q21.1 deletion, which may contribute to dysmorphism and is not a FASTKD5 structural variant.
        variants:
        - name: NM_021826.5:c.1716dup
          description: p.Pro573Alafs*17. Subject 1 maternal frameshift allele, in trans with p.Leu634Pro.
          gene:
            preferred_term: FASTKD5
            term:
              id: hgnc:25790
              label: FASTKD5
          variant_type: insertion
          clinical_significance: PATHOGENIC
        - name: NM_021826.5:c.1901T>C
          description: p.Leu634Pro. Subject 1 paternal missense allele. The expressed mutant fails complementation
            despite wild-type-comparable abundance.
          gene:
            preferred_term: FASTKD5
            term:
              id: hgnc:25790
              label: FASTKD5
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
        - name: NM_021826.5:c.1210C>T
          description: p.Arg404Cys. Subject 2 paternal missense allele. The expressed mutant fails complementation
            despite wild-type-comparable abundance.
          gene:
            preferred_term: FASTKD5
            term:
              id: hgnc:25790
              label: FASTKD5
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
        - name: NM_021826.5:c.374A>G
          description: p.Tyr125Cys. Shared by subjects 2 and 3; maternally inherited in subject 2. The
            protein is unstable but hypomorphic, with partial rescue on overexpression.
          gene:
            preferred_term: FASTKD5
            term:
              id: hgnc:25790
              label: FASTKD5
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
        - name: NM_021826.5:c.2028_2029del
          description: p.Ala678Hisfs*79. Subject 3 frameshift allele, in trans with p.Tyr125Cys; the frameshift
            alters the C-terminal translated sequence.
          gene:
            preferred_term: FASTKD5
            term:
              id: hgnc:25790
              label: FASTKD5
          variant_type: deletion
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: we identified three missense variants and two frameshift variants leading to a premature
          stop codon
        supports: SUPPORT
