              label: mitochondrial complex IV deficiency, nuclear type 24
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired noncanonical mitochondrial RNA processing
        description: Cleavage at the CO1 5-prime end and ATP8/6-CO3 junction is severely impaired in patient
          fibroblasts. Precursors accumulate and mature CO1 and CO3 decline. Mature CYB remains available
          with residual FASTKD5 function; complete knockout also disrupts ND5-CYB processing. CO3 can
          still be translated from the tricistronic precursor, so impaired processing does not imply loss
          of every encoded protein.
        biological_processes:
        - preferred_term: mitochondrial mRNA processing
          term:
            id: GO:0090615
            label: mitochondrial mRNA processing
          modifier: DECREASED
      selected_evidence:
        snippet: the accumulation of unprocessed 5 ′ end MT-CO1, MT-ATP8/6-CO3, and MT-ND5-CYB transcripts,
          with a lack of mature MT-CO1 and MT-CO3 (Figure 2E), but normal levels of mature MT-CYB, suggesting
          that residual activity of the FASTKD5 variants in the subjects’ fibro- blasts was sufficient
          to process MT-ND5-CYB pre-mRNA, resembling the situation in FASTKD5 knockdown cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
