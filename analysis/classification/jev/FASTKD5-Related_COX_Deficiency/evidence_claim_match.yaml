            term:
              id: MONDO:0980755
              label: mitochondrial complex IV deficiency, nuclear type 24
        context: []
      assertion_type: Treatment
      assertion:
        name: Experimental FASTKD5 complementation and protein stabilization concept
        description: Wild-type gene complementation rescues patient fibroblast defects. Overexpressed
          p.Tyr125Cys partly restores COX activity, motivating a proposal to stabilize that protein. No
          stabilizing compound or clinical gene therapy was tested in this report.
      selected_evidence:
        snippet: Stable expres- sion of FLAG-tagged FASTKD5 protein (to 1.6 and 4.2 times of endogenous
          control FASTKD5 levels in subjects 1 and 2, respectively; Figures 2A and 2B) resulted in the
          rescue of MT-CO1 and MT-CO3 processing (Figures 2E and 3), an increase in the translation of
          the MT-CO1 poly- peptide (Figure 2F), rescue of the steady-state level of the MT-CO1 protein
          (Figures 2A and 2B), and concomitant rescue of COX assembly (Figure 2C) and enzymatic activ-
          ity (Figure 2D).
        supports: SUPPORT
