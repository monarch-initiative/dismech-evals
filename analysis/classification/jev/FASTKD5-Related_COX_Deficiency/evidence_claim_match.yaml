  c7151058bc2525ea89b75905a3959ac104ae75e7c640e25e454337d600464989:
    claim:
      about:
        disease:
          name: FASTKD5-Related COX Deficiency
          disease_term:
            preferred_term: FASTKD5-related COX deficiency (MC4DN24)
            term:
              id: MONDO:0980755
              label: mitochondrial complex IV deficiency, nuclear type 24
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FASTKD5 Loss and Defective Mitochondrial mRNA Processing
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic FASTKD5 variants reduce the steady-state level of FASTKD5, a mitochondrial
          protein essential for processing mRNAs at non-canonical cleavage sites in the polycistronic
          primary mitochondrial transcript. Defective processing impairs maturation of the mtDNA-encoded
          COX1 mRNA, so translation of the core catalytic subunit COX1 falls and assembly of Complex IV
          is impaired, producing an isolated Complex IV biogenesis failure. This situates the lesion at
          the mitochondrial mRNA-processing step, upstream of COX1 translation and holoenzyme assembly
          — distinct from the assembly-factor, metallochaperone, and structural-subunit defects that underlie
          most other nuclear-type COX deficiencies.

          '
        biological_processes:
        - preferred_term: mitochondrial mRNA processing
          term:
            id: GO:0090615
            label: mitochondrial mRNA processing
          modifier: DECREASED
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: compound heterozygous variants of unknown significance in FASTKD5, a gene that codes
          for a mitochondrial protein essential for processing mRNAs at non-canonical cleavage sites in
          the primary mitochondrial transcript, in three subjects with Leigh syndrome
        supports: SUPPORT
