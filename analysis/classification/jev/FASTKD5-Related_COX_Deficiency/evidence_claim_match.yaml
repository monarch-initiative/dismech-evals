      assertion_type: Pathophysiology
      assertion:
        name: Reduced CYB translation in complete-knockout cells
        description: Complete FASTKD5 knockout prevents efficient translation of unprocessed CYB RNA in
          143B and HEK293T models. This additional defect is not established in residual-function patient
          fibroblasts, where mature CYB and complex III assembly are preserved.
        biological_processes:
        - preferred_term: mitochondrial translation
          term:
            id: GO:0032543
            label: mitochondrial translation
          modifier: DECREASED
      selected_evidence:
        snippet: Quantification of these results (Supplementary Fig. S1F) showed that the translation
          of CO1 and CYB was specifically decreased, to near zero, consistent with the results of the
          Northern blot analysis (Fig. 1C) demonstrating that the presence of 5′-UTRs on these transcripts
          prevents translation on mitochondrial ribosomes.
        supports: SUPPORT
