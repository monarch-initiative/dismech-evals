      assertion_type: Genetic
      assertion:
        name: FASTKD5 pathogenic variants causing MC4DN24
        gene_term:
          preferred_term: FASTKD5
          term:
            id: hgnc:25790
            label: FASTKD5
        inheritance:
        - name: Autosomal recessive
        features: 'Biallelic FASTKD5 variants cause MC4DN24. Across three subjects the authors identified
          three missense variants and two frameshift variants leading to a premature stop codon. Two of
          the three missense mutations caused near complete loss of function, while one was hypomorphic
          owing to impaired protein stability. Re-expression of a wild-type FASTKD5 cDNA — but not the
          missense cDNAs — rescued the molecular defects in patient fibroblasts, confirming pathogenicity.

          '
      selected_evidence:
        snippet: we identified three missense variants and two frameshift variants leading to a premature
          stop codon
        supports: SUPPORT
