          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial outer membrane
          term:
            id: GO:0005741
            label: mitochondrial outer membrane
      selected_evidence:
        snippet: We determined that FBXL4 functions as an integral outer-membrane protein that forms an
          SCF-FBXL4 ubiquitin E3 ligase complex.
        supports: SUPPORT
