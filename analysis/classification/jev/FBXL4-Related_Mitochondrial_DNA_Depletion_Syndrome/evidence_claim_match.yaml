          modifier: DECREASED
      selected_evidence:
        snippet: Here, we report that SCFFBXL4 , an SKP1/CUL1/F-box protein ubiquitin ligase complex,
          localises to the mitochondrial outer membrane in unstressed cells and mediates the constitutive
