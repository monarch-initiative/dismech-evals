        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: excessive_bnip3_nix_mitophagy
        hypothesis_label: Excessive BNIP3/NIX-Dependent Basal Mitophagy
        status: CANONICAL
        description: FBXL4 is the substrate adaptor of an SCF ubiquitin ligase that degrades the mitophagy
          receptors BNIP3 and NIX. Pathogenic FBXL4 variants fail to assemble an active ligase, BNIP3
          and NIX accumulate, basal mitophagy rises, and cells lose mitochondrial content and mtDNA. Several
          independent groups reported the ligase-substrate relationship in 2023, and deleting Bnip3 or
          Nix rescues the viability of Fbxl4 knockout mice.
      selected_evidence:
        snippet: Together, beyond identifying SCF-FBXL4 as a novel mitochondrial ubiquitin E3 ligase restraining
          basal mitophagy, our results reveal hyperactivated mitophagy as a cause of mitochondrial disease
          and suggest therapeutic strategies.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36896912
      reference_title: A mitochondrial SCF-FBXL4 ubiquitin E3 ligase complex degrades BNIP3 and NIX to
        restrain mitophagy and prevent mitochondrial disease.
      evidence_source: MODEL_ORGANISM
      explanation: Genetic rescue in mice establishes hyperactive mitophagy as causal.
