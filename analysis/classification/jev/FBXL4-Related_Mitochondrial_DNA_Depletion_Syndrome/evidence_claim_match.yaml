        description: Biallelic germline FBXL4 variants (nonsense, frameshift, splice and missense) distributed
          across the gene, without a clear genotype-phenotype correlation. FBXL4 is the substrate-binding
          F-box subunit of an SCF (CRL1) ubiquitin ligase on the mitochondrial outer membrane. Tested
          pathogenic variants leave FBXL4 able to bind BNIP3 and NIX but unable to assemble an active
          ligase. Re-expression of wild-type FBXL4 restores mtDNA copy number in patient cells.
        genes:
        - preferred_term: FBXL4
