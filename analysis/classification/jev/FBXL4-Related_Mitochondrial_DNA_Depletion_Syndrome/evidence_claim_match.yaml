        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: primary_oxphos_defect_secondary_mitophagy
        hypothesis_label: Primary Oxidative Phosphorylation Defect with Secondary Mitophagy
        status: ALTERNATIVE
        description: Before the ligase studies, one fibroblast study of two patients found increased mitochondrial
          mass, fragmentation and autophagy but interpreted them as secondary to a primary oxidative phosphorylation
          defect, and one of the two lines had normal mtDNA copy number. A neonatal case likewise showed
          relative sparing of mitochondrial mass in fibroblasts despite profound respiratory failure.
          These observations predate, and have not been reconciled with, the BNIP3/NIX data.
      selected_evidence:
        snippet: Further analysis of fibroblasts allowed to establish that increased mitochondrial mass,
          mitochondrial fragmentation, and augmented autophagy are associated with FBXL4 deficiency in
          cells, but are probably secondary to a primary metabolic defect affecting oxidative phosphorylation.
        supports: SUPPORT
    origin:
