          has been reported with a milder course, and one missense variant gave different courses in unrelated
          carriers.'
        variants:
        - name: c.1641_1642delTG (homozygous frameshift)
          description: Homozygous frameshift in a neonate; proposed by the authors to represent the severe
            end of the spectrum.
        - name: c.1303C>T
          description: Missense variant reported in three unrelated individuals with different clinical
            courses.
        - name: c.1750T>C (p.Cys584Arg)
          description: Homozygous missense in two siblings with cardiac hypertrophy; unlike wild-type
            FBXL4 the variant does not promote mitochondrial fusion.
        - name: c.486T>G (p.Tyr162Ter)
          description: Homozygous nonsense variant in a 4.5-year-old boy with a milder course than usual.
      selected_evidence:
        snippet: Biallelic pathogenic variants in FBXL4 are associated with an encephalopathic mtDNA maintenance
          defect syndrome that is a multisystem disease characterized by lactic acidemia, developmental
          delay, and hypotonia.
        supports: SUPPORT
