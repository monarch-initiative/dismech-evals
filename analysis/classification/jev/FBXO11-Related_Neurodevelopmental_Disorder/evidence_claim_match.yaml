        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: Heterozygous de novo loss-of-function (nonsense, frameshift, splice-site, partial or whole-gene
          deletion) and missense variants in FBXO11 cause the disorder. FBXO11 encodes the substrate-recognition
          subunit of an SCF E3 ubiquitin ligase; loss of function and haploinsufficiency are the proposed
          mechanism, with functional studies suggesting a loss-of-function effect even for missense variants.
      selected_evidence:
        snippet: The identified de novo aberrations comprise two large deletions, ten likely gene disrupting
          variants, and eight missense variants distributed throughout FBXO11.
        supports: SUPPORT
