  1447b2bc9837ebbd153a4e1c8ac0f6f9b196c8100277dd63da3d661109709206:
    claim:
      about:
        disease:
          name: FGF12-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 47
            term:
              id: MONDO:0014949
              label: developmental and epileptic encephalopathy, 47
        context: []
      assertion_type: Genetic
      assertion:
        name: FGF12
        gene_term:
          preferred_term: FGF12
          term:
            id: hgnc:3668
            label: FGF12
        relationship_type: CAUSATIVE
        association: 'FGF12 encodes fibroblast growth factor homologous factor 1 (FHF1), an intracellular,
          non-secreted FGF that modulates voltage-gated sodium channel inactivation. Three variant classes
          cause disease: recurrent heterozygous gain-of-function missense variants (p.Arg52His, p.Gly50Ser),
          whole-gene duplication, and - separately - biallelic loss-of-function structural or single-nucleotide
          variants.'
        notes: 'The recurrent p.Arg52His variant is numbered in the FHF1B isoform; the same change is
          p.Arg114His in FHF1A, and both numberings appear in the literature for one variant. In the founding
          family the variant was de novo yet shared by two affected siblings, which implies parental germline
          mosaicism - relevant to recurrence-risk counselling even though a de novo finding would ordinarily
          suggest low recurrence risk. Scope note: FGF12 also appears in the cardiac arrhythmia literature
          as a minor Brugada syndrome gene, and the GeneReviews chapter that mentions FGF12 is the Brugada
          Syndrome chapter, not a chapter about this disorder. That cardiac-channelopathy literature is
          a separate disease context and is deliberately not curated into this entry; the cardiac content
          here comes only from DEE47-genotype sources.'
      selected_evidence:
        snippet: FGF12 heterozygous recurrent missense variants with gain-of-function or heterozygous
          entire duplication of FGF12 are known causes of epilepsy, but biallelic SNVs/SVs have never
          been described
        supports: SUPPORT
