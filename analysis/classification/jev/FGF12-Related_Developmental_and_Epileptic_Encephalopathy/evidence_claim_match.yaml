      assertion:
        name: Increased Intrinsic Neuronal Excitability
        biological_scale: CELLULAR
        description: 'Neurons carrying the variant are expected to fire more readily. Kept separate from
          the channel biophysics node because excitability is a cell-level property rather than a channel
          property. The status of this node is weaker than the nodes on either side of it: the founding
          study measured channel gating in Neuro2A cells and *predicted* increased excitability rather
          than recording it, so this is curated as a predicted step. No cell type is bound, because the
          supporting measurement was made in a neuroblastoma line rather than in an identified neuronal
          population.'
        conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
      selected_evidence:
