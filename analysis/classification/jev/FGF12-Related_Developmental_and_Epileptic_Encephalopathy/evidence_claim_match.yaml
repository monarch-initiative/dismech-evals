      assertion:
        target: Cardiac Arrhythmia
        relationship: RECAPITULATES
        fidelity: MODERATE
        limitations: The mouse phenotype is uniformly lethal between 12 and 26 days of age, whereas the
          human disorder spans a lethal encephalopathy through to drug-responsive epilepsy with favourable
          cognitive outcome. The model therefore represents the severe pole only and cannot speak to the
          milder end of the spectrum, which is where the treatment question now sits.
        description: Ictal bradyarrhythmia. Basal rhythm is explicitly normal, so the model shows a seizure-triggered
          cardiac event rather than a standing cardiac phenotype - the two readouts below record that
          contrast directly.
        readouts:
        - name: Basal heart rhythm prior to seizure
          target: Cardiac Arrhythmia
          direction: UNCHANGED
          interpretation: 'No intrinsic cardiac phenotype between seizures. This is a real negative result
            and is what makes the downgrade of the channel-to-arrhythmia edge correct: the cardiac sodium
            channel defect is demonstrable in vitro yet produces no measurable resting rhythm abnormality
            in the intact animal.'
        - name: Ictal heart rate
          target: Cardiac Arrhythmia
          direction: DECREASED
          interpretation: An abrupt fall in heart rate within seconds of seizure onset, attributed to
            a parasympathetic surge.
      selected_evidence:
        snippet: All Fhf1R52H/+ mice experienced seizure or seizurelike episodes with lethal ending between
          12 and 26 days of age
        supports: SUPPORT
