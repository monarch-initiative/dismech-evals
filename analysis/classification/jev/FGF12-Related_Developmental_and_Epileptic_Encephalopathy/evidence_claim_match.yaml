      assertion_type: Pathophysiology
      assertion:
        name: Weakened FHF1 Binding to the Nav Cytoplasmic Tail
        biological_scale: MOLECULAR
        description: The counterintuitive step, and the reason it is curated as its own node. The gain-of-function
          effect is predicted to arise from a *weaker* interaction between mutant FHF1 and the sodium
          channel cytoplasmic tail - a loss of binding producing a gain of channel function. Collapsing
          this into the downstream channel node would hide the fact that the direction of the binding
          change is opposite to the direction of the functional change.
        molecular_functions:
        - preferred_term: sodium channel regulator activity
          modifier: ABNORMAL
          term:
            id: GO:0017080
            label: sodium channel regulator activity
      selected_evidence:
        snippet: Surprisingly, the gain-of-function effect is predicted to result from weaker interaction
          of mutant FHF1 with the Nav cytoplasmic tail
        supports: SUPPORT
