        name: Altered Cardiac Sodium Channel Function
        biological_scale: MOLECULAR
        description: FHF1 binds Nav1.5 in cardiomyocytes by the same mechanism it uses on neuronal channels,
          so the variant has a direct cardiac substrate independent of seizures. This node is drawn from
          the variant rather than from the neuronal chain, because the two organs are affected in parallel
          by one molecular lesion.
        molecular_functions:
        - preferred_term: voltage-gated sodium channel activity involved in cardiac muscle cell action
            potential
          modifier: ABNORMAL
          term:
            id: GO:0086006
            label: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Although ectopic overexpression of FHF1BR52H in cardiomyocytes induced a 15-mV depolarizing
          shift in voltage of steady-state sodium channel inactivation and slowed the rate of channel
          inactivation, heart rhythm was normal in Fhf1R52H/+ mice prior to seizure
        supports: SUPPORT
