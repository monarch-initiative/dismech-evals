        biological_scale: MOLECULAR
        description: 'The arm that disqualifies BBDS from the FGFR gain-of-function grouping. Membrane
          FGFR2 levels are selectively reduced and the receptor''s responsiveness to extracellular FGF
          is markedly diminished, demonstrated both in patient-derived chondrocytes and in a cell-based
          assay. This is loss of canonical signaling, not gain — the mechanistic inverse of the constitutive,
          ligand-independent activation that characterizes Apert, Crouzon, Pfeiffer, Jackson-Weiss and
          Beare-Stevenson syndrome.

          '
