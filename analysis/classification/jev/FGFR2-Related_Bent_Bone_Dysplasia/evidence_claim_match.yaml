            label: FGFR2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: De novo heterozygous missense variants placing a polar residue in the hydrophobic transmembrane
          domain. Reported alleles include p.Tyr381Asp (c.1141T>G) and p.Met391Arg. Substitutions at FGFR2
          Tyr-381 have been reported to cause either Crouzon syndrome or bent bone dysplasia depending
          on the substituting residue, making this codon a clean demonstration that the disorder is set
          by the biophysical consequence of the substitution rather than by its position.
      selected_evidence:
        snippet: Four unrelated affected individuals were found to be heterozygous for missense mutations
          that introduce a polar amino acid into the hydrophobic transmembrane domain of FGFR2.
        supports: SUPPORT
