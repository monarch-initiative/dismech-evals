              label: bent bone dysplasia syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nucleolar Disorganization and Rpl11-MDM2-p53 Stress Response
        biological_scale: CELLULAR
        description: 'Nucleolar morphology is governed by chromatin structure, so the high levels of euchromatic
          rDNA produced by the BBDS mutations disorganize the nucleolus and alter ribosome biogenesis.
          That in turn activates the Rpl11-MDM2-p53 nucleolar stress pathway. This is the node with therapeutic
          relevance: inhibiting p53 in cells expressing the BBDS mutations rescues the delayed osteoblast
          differentiation, which identifies p53 activation as an essential pathogenic step rather than
          a bystander.

          '
        biological_processes:
        - preferred_term: ribosome biogenesis
          term:
