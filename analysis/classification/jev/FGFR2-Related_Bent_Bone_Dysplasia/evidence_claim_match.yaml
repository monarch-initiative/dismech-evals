              label: bent bone dysplasia syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Enhanced Nucleolar FGFR2 Occupancy at rDNA
        biological_scale: MOLECULAR
        description: 'The gain in BBDS is of receptor location, not receptor activity. The mutations amplify
          nucleolar targeting of FGFR2, where it occupies the ribosomal DNA promoter and activates rDNA
          transcription through interactions with FGF2 and UBF1, de-repressing RUNX2. A second study showed
          the mutant receptor also augments recruitment of histone-remodeling factors that epigenetically
          activate rDNA that is normally transcriptionally silent — so the effect is not only more transcription
          at active loci but conversion of silent loci to euchromatin.

          '
        cellular_components:
        - preferred_term: nucleolus
          term:
            id: GO:0005730
            label: nucleolus
        biological_processes:
        - preferred_term: rRNA transcription
          term:
            id: GO:0009303
            label: rRNA transcription
          modifier: INCREASED
      selected_evidence:
        snippet: In this study, we find that these mutations, despite reducing canonical signaling, enhance
          nucleolar occupancy of FGFR2 at the ribosomal DNA (rDNA) promoter.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
