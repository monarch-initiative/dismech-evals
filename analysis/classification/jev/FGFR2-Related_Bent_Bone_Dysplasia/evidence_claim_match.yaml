          '
      selected_evidence:
        snippet: We have identified de novo FGFR2 mutations in a sporadically occurring perinatal lethal
          skeletal dysplasia characterized by poor mineralization of the calvarium, craniosynostosis,
          dysmorphic facial features, prenatal teeth, hypoplastic pubis and clavicles, osteopenia, and
          bent long bones.
        supports: SUPPORT
