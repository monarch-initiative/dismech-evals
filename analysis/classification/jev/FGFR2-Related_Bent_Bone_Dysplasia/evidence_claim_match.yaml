  e9bfe3a96156b20753866ff66346e5fd15d360d41a1a7869bddd6d24cddad71f:
    claim:
      about:
        disease:
          name: FGFR2-Related Bent Bone Dysplasia
          disease_term:
            preferred_term: bent bone dysplasia syndrome 1
            term:
              id: MONDO:0013815
              label: bent bone dysplasia syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FGFR2 Transmembrane Polar Substitution
        role: trigger
        biological_scale: MOLECULAR
        description: 'A de novo heterozygous FGFR2 missense variant introducing a polar amino acid into
          the hydrophobic transmembrane domain — the reported alleles include p.Tyr381Asp and p.Met391Arg.
          This is the same domain in which achondroplasia (FGFR3 p.Gly380Arg) and Beare-Stevenson syndrome
          (FGFR2 p.Tyr375Cys) alleles sit, and FGFR2 Tyr-381 substitutions have been reported to give
          either Crouzon syndrome or bent bone dysplasia depending on which residue is substituted in.
          Despite that adjacency, the consequence here is not constitutive activation, which is why this
          entry carries no conforms_to anchor against the FGFR gain-of-function module.

          '
        gene:
          preferred_term: FGFR2
          description: Fibroblast growth factor receptor 2. In BBDS the variant alters receptor trafficking
            and subcellular distribution rather than conferring constitutive kinase activity.
          term:
            id: hgnc:3689
            label: FGFR2
      selected_evidence:
        snippet: Four unrelated affected individuals were found to be heterozygous for missense mutations
          that introduce a polar amino acid into the hydrophobic transmembrane domain of FGFR2.
        supports: SUPPORT
    origin:
