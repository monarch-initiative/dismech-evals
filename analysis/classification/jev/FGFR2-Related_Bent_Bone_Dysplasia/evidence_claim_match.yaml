      assertion:
        name: Impaired Bone Mineralization and Structural Weakness
        biological_scale: TISSUE
        description: 'Osteoprogenitors that proliferate without differentiating do not deposit and mineralize
          matrix normally. The clinical readout is poor calvarial mineralization, reduced bone mineral
          density and osteopenia, and long bones weak enough to bend in utero — the feature the disorder
          is named for. Note this is a mineralization failure secondary to a cell-fate defect: it is not
          the calciopenic, phosphopenic or mineralization-inhibitor-excess mechanism of the defective_skeletal_mineralization
          module, so no conformance is declared there either.

          '
        biological_processes:
