  99c10b6aaecfceaa0681b006dcb5ce42fc765ad26c2c57ffc97ec307845bc80e:
    claim:
      about:
        disease:
          name: FGFR2-Related Bent Bone Dysplasia
          disease_term:
            preferred_term: bent bone dysplasia syndrome 1
            term:
              id: MONDO:0013815
              label: bent bone dysplasia syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bbds_same_residue_opposite_disease
        prompt: Why do different substitutions at the same FGFR2 transmembrane residue produce either
          Crouzon syndrome, a canonical gain-of-function craniosynostosis, or bent bone dysplasia, a disorder
          of reduced membrane signalling?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#FGFR2 Transmembrane Polar Substitution
        - pathophysiology#Reduced Plasma-Membrane FGFR2 and Deficient Canonical FGF Signaling
        rationale: 'This is the cleanest available natural experiment on how FGFR2 transmembrane substitutions
          are read out, and it is unresolved. Substitutions at FGFR2 Tyr-381 have been reported to cause
          either Crouzon syndrome or bent bone dysplasia depending on which residue is introduced, so
          position alone does not determine the disease. The plausible discriminator is the biophysical
          character of the substituting residue — a cysteine enabling intermolecular disulfide bonding
          and constitutive dimerization versus a polar residue disrupting membrane insertion and trafficking
          — but no study cited here compares the two classes side by side in one system, and the nucleolar
          relocalization arm has not been tested in the gain-of-function alleles at all. It matters for
          the knowledge base as well as for biology: the FGFR-Related Skeletal Dysplasias grouping admits
          members on constitutive receptor activation, so whether a given transmembrane allele belongs
          is a mechanistic question that cannot be settled from the domain it sits in.'
        proposed_experiments:
        - experiment_id: exp_fgfr2_tm_allele_series_side_by_side
          name: Side-by-side comparison of FGFR2 transmembrane allele classes
          description: Express Crouzon-type and BBDS-type substitutions at the same FGFR2 transmembrane
            residue in one cell system and measure membrane localization, ligand-dependent and ligand-independent
            kinase activity, and nucleolar occupancy together, so the discriminating property is measured
            rather than inferred across papers.
        - experiment_id: exp_nucleolar_fgfr2_in_gof_alleles
          name: Nucleolar FGFR2 occupancy in gain-of-function craniosynostosis alleles
          description: Test whether Apert, Crouzon and Beare-Stevenson FGFR2 alleles also alter nucleolar
            rDNA occupancy. A negative result would make the nucleolar arm genuinely specific to BBDS;
            a positive one would mean the two mechanisms are not mutually exclusive.
      selected_evidence:
        snippet: Using diseased chondrocytes and a cell-based assay, we determined that these mutations
          selectively reduced plasma-membrane levels of FGFR2 and markedly diminished the receptor's responsiveness
          to extracellular FGF.
        supports: SUPPORT
