          name: FGFR2-Related Bent Bone Dysplasia
          disease_term:
            preferred_term: bent bone dysplasia syndrome 1
            term:
              id: MONDO:0013815
              label: bent bone dysplasia syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bbds_p53_inhibition_translation
        prompt: Does p53 inhibition, which rescues delayed osteoblast differentiation in cells carrying
          the BBDS FGFR2 mutations, represent a viable therapeutic direction for a disorder whose damage
          is largely done before birth?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Nucleolar Disorganization and Rpl11-MDM2-p53 Stress Response
        - pathophysiology#Osteoprogenitor Proliferation with Delayed Differentiation
        rationale: 'This is the only therapeutic lead BBDS has, and it is a genuine mechanistic result
          rather than a correlation: inhibiting p53 in cells expressing the BBDS mutations rescues the
          differentiation delay, which is what licenses calling p53 activation essential rather than incidental.
          Three problems stand between that and a treatment. First, the rescue is in cells; no animal
          model of BBDS has been reported to test whether systemic p53 inhibition rescues the skeletal
          phenotype, and the entry should not be read as claiming otherwise. Second, the timing is adverse
          in a way that distinguishes this from most therapeutic gaps: bent long bones, hypoplastic clavicles
          and poor calvarial mineralization are established in utero, so a postnatal intervention would
          be addressing a developmental lesion after it has formed, and the window in which p53 inhibition
          could matter may close before the diagnosis is made. Third, p53 is a tumour suppressor and inhibiting
          it systemically in a developing child carries an obvious and unquantified oncogenic hazard;
          no dose, route, duration or selectivity has been proposed. Nothing here should be curated as
          an emerging treatment.'
        proposed_experiments:
        - experiment_id: exp_bbds_mouse_model_p53_rescue
          name: p53 inhibition in an animal model of BBDS
          description: Generate a knock-in animal carrying a BBDS transmembrane allele and test whether
            genetic or pharmacological p53 reduction rescues bone mineralization and long-bone bowing
            in vivo, which is the step between the existing cell result and any claim about the skeleton.
        - experiment_id: exp_bbds_developmental_window
          name: Developmental window for differentiation rescue
          description: Establish the latest developmental stage at which reducing p53 still restores osteoblast
            differentiation, since a window closing in utero would make postnatal treatment futile regardless
            of efficacy.
      selected_evidence:
        snippet: Inhibition of p53 in cells expressing the FGFR2 mutations in BBDS rescues delayed osteoblast
          differentiation, suggesting that p53 activation is an essential pathogenic factor in, and potential
          therapeutic target for, BBDS.
        supports: SUPPORT
    origin:
