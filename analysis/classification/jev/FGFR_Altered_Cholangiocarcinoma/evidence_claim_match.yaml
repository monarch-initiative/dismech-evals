          term:
            id: UBERON:0003704
            label: intrahepatic bile duct
      selected_evidence:
        snippet: Gene fusions are among the most frequent alterations, involving FGFR2 in 10-15% of iCCAs
          in particular, and NTRK genes at a lower frequency (<1%).
        supports: SUPPORT
