              label: intrahepatic cholangiocarcinoma
        context: []
      assertion_type: Genetic
      assertion:
        name: FGFR2 Fusions
        association: Somatic Gene Fusion
        notes: FGFR2 fusions occur in 10-15% of intrahepatic cholangiocarcinomas. Common partners include
          BICC1, PPHLN1, AHCYL1, TACC3, MGEA5, and others. Over 100 different fusion partners have been
          identified. Detected by RNA-based NGS, FISH, or break-apart assays.
      selected_evidence:
        snippet: Recently, several actionable genetic aberrations were identified with significant enrichment
          in intrahepatic CCA, including FGFR2 gene fusions with a prevalence of 10-15%.
        supports: SUPPORT
    origin:
