          variant_origin: SOMATIC
        description: FGFR2 fusions join the FGFR2 kinase domain to various partner genes (BICC1, PPHLN1,
          AHCYL1, and others). Partner genes typically provide oligomerization domains that cause ligand-independent
          FGFR2 dimerization and constitutive kinase activation. This drives oncogenic signaling through
          multiple downstream pathways.
