        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FGFR2 Fusion and Constitutive Activation
        genetic_context:
          variant_origin: SOMATIC
        description: FGFR2 fusions join the FGFR2 kinase domain to various partner genes (BICC1, PPHLN1,
          AHCYL1, and others). Partner genes typically provide oligomerization domains that cause ligand-independent
          FGFR2 dimerization and constitutive kinase activation. This drives oncogenic signaling through
          multiple downstream pathways.
        cell_types:
        - preferred_term: intrahepatic cholangiocyte
          term:
            id: CL:0002538
            label: intrahepatic cholangiocyte
        biological_processes:
        - preferred_term: fibroblast growth factor receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
        locations:
        - preferred_term: intrahepatic bile duct
          term:
            id: UBERON:0003704
            label: intrahepatic bile duct
      selected_evidence:
        snippet: Gene fusions are among the most frequent alterations, involving FGFR2 in 10-15% of iCCAs
          in particular, and NTRK genes at a lower frequency (<1%).
        supports: SUPPORT
    origin:
