            label: FGFR3
        association: Somatic Activating Mutations and Fusions
        notes: FGFR3 alterations occur in 15-20% of metastatic urothelial carcinomas. Common mutations
          include S249C, Y373C, R248C, and G370C. FGFR3-TACC3 fusions and other rearrangements also activate
          the pathway. FGFR2 alterations are less common.
      selected_evidence:
        snippet: Specific mutations have been identified that predict response to therapy including ERCC2
          mutations and cisplatin, DNA damage and repair mutations and checkpoint inhibitors, and FGFR3
          mutations and FGFR tyrosine kinase inhibitors such as erdafitinib.
        supports: SUPPORT
