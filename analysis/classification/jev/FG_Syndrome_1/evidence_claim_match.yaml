              label: FG syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MED12 p.Arg961Trp Alters CDK8 Kinase Module Function
        biological_scale: MOLECULAR
        description: MED12 is a subunit of the dissociable CDK8 kinase module (MED12, MED13, cyclin C,
          CDK8) that reversibly associates with core Mediator and acts as the hub through which DNA-bound
          transcription factors communicate with RNA polymerase II. The recurrent germline hemizygous
          c.2881C>T (p.Arg961Trp) missense substitution does not abolish MED12 function globally; the
          evidence favors a pathway-selective altered-function defect that impairs recruitment of, or
          response to, particular regulatory complexes while sparing others. This distinguishes FGS1 from
          complete MED12 loss of function, which has broader and developmentally more severe consequences.
        mechanism_confidence: ESTABLISHED
        gene:
          preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
        protein_complexes:
        - preferred_term: Mediator CDK8 kinase module
          term:
            id: GO:1990508
            label: CKM complex
        molecular_functions:
        - preferred_term: transcription corepressor activity
          term:
            id: GO:0003714
            label: transcription corepressor activity
        biological_processes:
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: We report here that the original family for whom the condition is named and five other
          families have a recurrent mutation (2881C>T, leading to R961W) in MED12 (also called TRAP230
          or HOPA), a gene located at Xq13 that functions as a thyroid receptor-associated protein in
          the Mediator complex.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
