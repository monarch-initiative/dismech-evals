          FGS1-associated variant are typically unaffected carriers. Once the familial variant is known,
          heterozygote testing of at-risk female relatives and prenatal or preimplantation genetic testing
          are possible. Males with an MED12-related disorder are not known to reproduce.'
        action_category: COUNSELING_INFORMATIONAL
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: If the mother of a proband is heterozygous for a pathogenic variant, the chance of transmitting
          it in each pregnancy is 50%. Males who inherit the pathogenic variant will be affected.
        supports: SUPPORT
