    evidence_metadata:
      reference: PMID:17574621
      reference_title: Genitourinary anomalies of pediatric FG syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The only per-feature quantitative estimate available for this phenotype: 24%, which
        would fall in the OCCASIONAL band. PARTIAL, and deliberately NOT used to assign a band, because
        the 228-patient series was assembled on clinical diagnosis and predates routine MED12 testing,
        so its denominator is the historical clinical FG syndrome population of which fewer than 3% is
        molecularly confirmed FGS1. Banding FGS1 from a cohort that is ~97% not-FGS1 would assert more
        than the source supports.'
