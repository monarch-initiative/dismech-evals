      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes that relative macrocephaly, like absolute, is present in fewer than half
        of mutation-positive males. Read strictly this gives only an upper bound: the "(7 of 18)" is parenthetical
        to absolute macrocephaly, and "as was relative macrocephaly" carries over the predicate alone,
        so this sentence bounds the figure below 50% without setting a floor. The FREQUENT band is anchored
        by the count in the following evidence item, not by this sentence. Note also that this is the
        mutation-POSITIVE denominator; the separate "15 of 18 had macrocephaly" figure elsewhere in this
        paper belongs to the Italian mutation-NEGATIVE comparison group and must not be applied to FGS1.'
