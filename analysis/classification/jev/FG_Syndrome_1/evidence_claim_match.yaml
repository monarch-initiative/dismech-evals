      assertion_type: ProgressionInfo
      assertion:
        phase: Neonatal and infantile presentation
        age_range: birth to 1 year
        notes: FGS1 presents at birth or in early infancy with congenital hypotonia, feeding difficulties,
          and constipation, together with structural anomalies (anorectal malformations, congenital heart
          defects, corpus callosum agenesis/hypoplasia) that may be recognized neonatally. Mortality is
          concentrated in this window; one or more affected males died in childhood in 8 of the 10 reported
          families.
      selected_evidence:
        snippet: Although the 10 families reported here produced 30 live-born affected male patients,
          1 or more affected individuals died in childhood in 8 of these 10 families.
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
