        description: 'X-linked counseling for the family: a heterozygous mother has a 50% transmission
          risk per pregnancy, sons who inherit the variant are affected, and daughters who inherit an
          FGS1-associated variant are typically unaffected carriers. Once the familial variant is known,
          heterozygote testing of at-risk female relatives and prenatal or preimplantation genetic testing
          are possible. Males with an MED12-related disorder are not known to reproduce.'
        action_category: COUNSELING_INFORMATIONAL
