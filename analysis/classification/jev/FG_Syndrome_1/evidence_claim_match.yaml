      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hardikar syndrome
        description: Caused by de novo MED12 protein-truncating variants in females, presenting with cleft
          lip/palate, biliary and liver anomalies, intestinal malrotation, pigmentary retinopathy, and
          coarctation of the aorta, and notably without intellectual disability. It is the female-restricted
          end of the MED12 spectrum and shares essentially no clinical overlap with FGS1.
        distinguishing_features:
        - Occurs in females rather than hemizygous males
        - Intellectual disability is absent
        - Hepatobiliary anomalies, intestinal malrotation, and pigmentary retinopathy
        - Caused by de novo protein-truncating rather than missense MED12 variants
      selected_evidence:
        snippet: HS has been described in females with cleft lip and/or cleft palate, biliary and liver
          anomalies, intestinal malrotation, pigmentary retinopathy, and coarctation of the aorta. Developmental
          and cognitive concerns have not been reported in females with HS.
        supports: SUPPORT
