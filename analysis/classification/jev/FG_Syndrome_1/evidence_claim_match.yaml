  bae1da63ca0fcb1417fce83c4a84a739ab3c3093828079b70a0374b4ac86ca91:
    claim:
      about:
        disease:
          name: FG Syndrome 1
          disease_term:
            preferred_term: FG syndrome 1
            term:
              id: MONDO:0010590
              label: FG syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fgs1_tissue_relevance_of_mechanism
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the REST-silencing, GLI3-SHH, and immediate-early gene defects demonstrated in patient-derived
          EBV-immortalized lymphoblastoid cells actually operate in the human tissues that are malformed
          in FGS1 (developing cortex and callosal projection neurons, enteric nervous system, cardiac
          outflow tract, anorectal mesenchyme)?
        attaches_to:
        - pathophysiology#Impaired Neuronal Differentiation and Cortical Development
        - pathophysiology#Failure of Corpus Callosum Formation
        rationale: All three mechanistic arms of FGS1 rest on lymphoblastoid cell lines or engineered
          MED12-null rescue systems. Lymphoblasts do not model developing cortical neurons, enteric neurons,
          cardiomyocytes, or anorectal mesenchyme, and the immediate-early gene effect is explicitly reported
          to be cell-type specific. Evidence therefore exists but its translational validity to the affected
          human tissues is the open question, which is a model-fidelity gap rather than an absence of
          data. No knock-in model reproducing the complete human FGS1 phenotype has been reported.
        proposed_experiments:
        - experiment_id: fgs1_isogenic_ipsc_lineage_panel
          name: Isogenic MED12 p.Arg961Trp knock-in human iPSC lineage panel
          description: Generate isogenic MED12 p.Arg961Trp knock-in human iPSC lines and differentiate
            them into cortical neurons, enteric neural crest derivatives, and cardiomyocytes. Profile
            REST target derepression, GLI3-dependent SHH target expression (CREB5, BMP4, NEUROG2), and
            stimulus-evoked immediate-early gene responses, comparing each lineage against the published
            lymphoblastoid signatures.
          decision_criterion: Concordance of the neural, enteric, and cardiac signatures with the lymphoblastoid
            findings would support tissue generality; lineage-restricted or divergent signatures would
            establish that lymphoblastoid data cannot be extrapolated to the malformed tissues.
        - experiment_id: fgs1_knockin_mouse_phenotyping
          name: MED12 p.Arg961Trp knock-in mouse phenotyping
          description: Generate and phenotype a Med12 p.Arg961Trp knock-in mouse for callosal, anorectal,
            cardiac, and behavioural phenotypes, with parallel transcriptomic profiling of the affected
            tissues during the relevant developmental windows.
          decision_criterion: Recapitulation of callosal and anorectal defects would establish an in vivo
            model for FGS1; failure to recapitulate would itself constitute an informative human-model
            mismatch requiring human-derived systems.
      selected_evidence:
        snippet: We propose an isogenic iNeuron model to establish the unique gene expression patterns
          that are associated with the specific MED12 variants.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
