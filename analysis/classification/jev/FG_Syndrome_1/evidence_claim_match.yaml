      assertion_type: Pathophysiology
      assertion:
        name: Derepression of GLI3-Dependent Sonic Hedgehog Target Transcription
        biological_scale: MOLECULAR
        description: Activated GLI3 physically targets the MED12 interface within Mediator to reverse
          Mediator-dependent suppression of Sonic hedgehog target-gene transcription, placing MED12 as
          a direct restraint on the pathway. In patient-derived lymphoblastoid lines carrying MED12 XLID
          variants, transcripts of the GLI3-dependent SHH targets CREB5, BMP4, and NEUROG2 are significantly
          elevated, and p.Arg961Trp fails to restore normal SHH inhibition while showing reduced CDK8
          recruitment at GLI3 sites. Because SHH-GLI signalling patterns the forebrain, craniofacial skeleton,
          limb, gut, and heart, this arm offers a plausible unifying explanation for the multi-system
          malformation pattern of FGS1.
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: smoothened signaling pathway
          term:
            id: GO:0007224
            label: smoothened signaling pathway
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: MED12 mutations R961W and N1007S causing FG and Lujan syndromes, respectively, disrupt
          a Mediator-imposed constraint on GLI3-dependent Sonic Hedgehog (SHH) signaling.
        supports: SUPPORT
