      assertion_type: Pathophysiology
      assertion:
        name: Impaired REST-Dependent Silencing of Neuronal Genes
        biological_scale: MOLECULAR
        description: Mediator, the G9a histone methyltransferase, and the RE1 silencing transcription
          factor (REST/NRSF) form a protein interaction network that keeps neuronal genes silenced in
          non-neuronal cells, with the MED12 interface linking REST to G9a-dependent histone H3K9 dimethylation.
          Missense MED12 changes causing FG and Lujan syndromes disrupt this REST corepressor function,
          so neuronal genes escape scheduled repression. Rescue experiments indicate that p.Arg961Trp
          specifically fails to restore REST-mediated silencing while retaining beta-catenin rescue capacity,
          marking this as a pathway-selective, kinase-independent defect.
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
      selected_evidence:
        snippet: We show that the MED12 interface in Mediator links REST with G9a-dependent histone H3K9
          dimethylation to suppress neuronal genes in nonneuronal cells. Notably, missense mutations in
          MED12 causing the X-linked mental retardation (XLMR) disorders FG syndrome and Lujan syndrome
          disrupt its REST corepressor function.
        supports: SUPPORT
