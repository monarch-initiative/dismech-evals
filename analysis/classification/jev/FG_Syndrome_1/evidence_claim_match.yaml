      assertion:
        name: Dysregulated Immediate-Early Gene Response
        biological_scale: CELLULAR
        description: In EBV-immortalized lymphoblastoid cells from patients, individual MED12 variants
          including p.Arg961Trp generate variant-specific expression patterns of the immediate-early genes
          JUN, FOS, and EGR1, mirrored by the presence or absence of the MED12-containing complex and
          RNA polymerase II at their promoters. The effect is cell-type specific, and downstream late-response
          genes involved in neural plasticity and neuronal gene specification are consequently disturbed.
          This arm supports a model in which stimulus-responsive transcription, rather than constitutive
          housekeeping transcription, is the vulnerable process.
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: transcription by RNA polymerase II
          term:
            id: GO:0006366
            label: transcription by RNA polymerase II
      selected_evidence:
        snippet: Here, we investigated several MED12 patients mutations (p.R206Q, p.N898D, p.R961W, p.N1007S,
          p.R1148H, p.S1165P and p.R1295H) and show that each MED12 mutations cause specific expression
          patterns of JUN, FOS and EGR1 immediate early genes (IEGs), reflected by the presence or absence
          of MED12 containing complex at their respective promoters.
        supports: SUPPORT
