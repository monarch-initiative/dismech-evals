              label: FG syndrome 1
        context: []
      assertion_type: Genetic
      assertion:
        name: MED12
        notes: MED12 (Xq13.1) encodes the largest subunit of the Mediator CDK8 kinase module. Classic
          FGS1 is defined by the single recurrent hemizygous missense variant c.2881C>T (p.Arg961Trp)
          in exon 21. Other MED12 missense variants cause allelic but distinct disorders (Lujan-Fryns
          syndrome, classically p.Asn1007Ser; X-linked Ohdo syndrome), and de novo protein-truncating
          variants in females cause Hardikar syndrome or a severe syndromic intellectual disability phenotype;
          none of these should be labelled FGS1. A second FGS1-causing missense variant, p.Gly958Glu,
          has been reported in one family, showing that p.Arg961Trp is not strictly the only FGS1 allele.
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
        inheritance:
        - name: X-linked recessive inheritance
          inheritance_term:
            preferred_term: X-linked recessive inheritance
            term:
              id: HP:0001419
              label: X-linked recessive inheritance
      selected_evidence:
        snippet: We report here that the original family for whom the condition is named and five other
          families have a recurrent mutation (2881C>T, leading to R961W) in MED12 (also called TRAP230
          or HOPA), a gene located at Xq13
        supports: SUPPORT
    origin:
