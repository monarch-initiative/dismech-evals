      reference_title: 'FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype
        and an algorithm for diagnostic testing.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Names cryptorchidism among the additional anomalies in the mutation-positive cohort
        — the right population, but the word "frequent" is applied collectively to a ten-item list with
        no per-feature denominator, so it does not establish a per-feature band. Together with the preceding
        item this is why the phenotype carries no frequency: the source with the correct population gives
        only a collective qualitative term, and the source with a per-feature number is drawn from the
        wrong population. Asserting either band would be an overreach, and preferring the number here
        would invert the standard applied to Anxiety in this same entry, where a qualitative statement
        was judged insufficient to license a band.'
