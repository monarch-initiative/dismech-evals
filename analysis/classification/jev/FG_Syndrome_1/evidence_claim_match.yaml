            term:
              id: MONDO:0010590
              label: FG syndrome 1
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: MED12-negative FG syndrome phenotypes
        description: The large majority of individuals historically given a clinical FG syndrome diagnosis
          do not carry a MED12 variant. Systematic re-evaluation of 30 such patients identified the recurrent
          variant in only the single individual with the typical phenotype, and a definite or possible
          alternative diagnosis was found in 10 of the remaining 29. Variants in FLNA, UPF3B, and BRWD3
          account for some families previously mapped to "FG syndrome" loci.
        distinguishing_features:
        - No MED12 variant identified on full gene sequencing
        - A broader, less specific picture of hypotonia, constipation, and relative macrocephaly
        - Absence of the full FGS1 facial gestalt and congenital anomaly burden
        - Alternative X-linked causes including FLNA, UPF3B, and BRWD3
      selected_evidence:
        snippet: The R961W mutation was identified in the only patient who had the typical phenotype previously
          associated with this mutation. The remaining 29 patients displayed a wide variety of features
          and were shown to be negative for mutations in the entire MED12 gene. A definite or possible
          alternative diagnosis was identified in 10 of these patients.
        supports: SUPPORT
    origin:
