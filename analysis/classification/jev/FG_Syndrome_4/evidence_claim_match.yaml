  fc83450fb0387f8cd862279a91fa456b92a842ad23d72a8c507d644a7a0a6513:
    claim:
      about:
        disease:
          name: FG Syndrome 4
          disease_term:
            preferred_term: FG syndrome 4
            term:
              id: MONDO:0010318
              label: FG syndrome 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fgs4_nosological_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: FGS4 is defined jointly by a molecular criterion (a hypomorphic CASK variant) and membership
          in the historical, genetically heterogeneous "FG syndrome" clinical label. With only two reported
          FGS4-causing CASK variants and a broad, overlapping CASK phenotypic continuum, is "FG syndrome
          4" a discrete clinical entity or simply the mild, syndromic end of the CASK spectrum labelled
          with a legacy FGS name?
        attaches_to:
        - pathophysiology#CASK Hypomorphic Altered-Function Variant
        rationale: 'Only two families define FGS4 in the literature (Piluso 2009; Dunn 2017), and both
          reports frame the phenotype as one end of a CASK continuum rather than a separable entity. GeneReviews
          collapses the FGS4 presentation into "XLID with or without nystagmus" caused by hypomorphic
          CASK variants. The nosological status therefore remains open: FGS4 may be better modeled as
          a labelled region of the CASK spectrum than as an independent disorder, which affects how phenotype
          frequencies and boundaries should be curated as more cases accrue.'
        proposed_experiments:
        - experiment_id: fgs4_cask_genotype_phenotype_cohort
          name: CASK genotype-phenotype cohort delineating the FGS4 region of the spectrum
          description: Assemble a cohort of hemizygous males with hypomorphic CASK variants and systematically
            phenotype them for the FGS-associated features (intellectual disability, nystagmus/ocular
            anomalies, gastrointestinal hypomotility, feeding difficulties) alongside quantitative CASK
            protein levels, to test whether an "FGS4" cluster is distinguishable from the broader hypomorphic
            CASK phenotype.
          decision_criterion: A statistically distinct clustering of features and protein levels would
            support FGS4 as a discrete entity; a smooth continuum would support modeling it as a labelled
            region of the CASK spectrum.
      selected_evidence:
        snippet: three phenotypic groups can be distinguished that represent a clinical continuum
        supports: SUPPORT
