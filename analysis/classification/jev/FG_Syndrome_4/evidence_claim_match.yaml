        description: The severe end of the CASK allelic spectrum, caused by hemizygous CASK loss-of-function
          variants, presenting with progressive microcephaly, pontine and cerebellar hypoplasia, and severe
          intellectual disability, and in males frequently with epileptic encephalopathy. It is distinguished
          from FGS4 by its severity and by loss (rather than retention) of CASK protein.
        distinguishing_features:
        - Loss-of-function CASK variant with no detectable CASK protein, versus retained protein in hypomorphic
          FGS4 variants
        - Progressive microcephaly with pontine and cerebellar hypoplasia
        - Severe-to-profound intellectual disability and, in males, epileptic encephalopathy
      selected_evidence:
        snippet: MICPCH with severe epileptic encephalopathy caused by hemizygous loss-of-function mutations
        supports: SUPPORT
