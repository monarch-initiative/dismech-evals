  b33762a52401caf1ec4ff754b140e0a3b5e9211ea91f9988f43ebfcee7743585:
    claim:
      about:
        disease:
          name: FG Syndrome 4
          disease_term:
            preferred_term: FG syndrome 4
            term:
              id: MONDO:0010318
              label: FG syndrome 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CASK Hypomorphic Altered-Function Variant
        biological_scale: MOLECULAR
        description: FGS4 is caused by CASK variants that lie at the mild, hypomorphic end of the CASK
          allelic spectrum. Rather than abolishing CASK, these missense and splice variants leave CASK
          protein detectable while reducing its amount or altering its function. This distinguishes FGS4
          from the hemizygous loss-of-function CASK variants that cause the far more severe MICPCH phenotype
          with severe intellectual disability and, in males, epileptic encephalopathy. The first reported
          FGS4 variant, p.R28L (c.83G>T), causes partial skipping of CASK exon 2 through disrupted recognition
          of an exonic splicing enhancer; the second, the de novo splice-site variant c.2521-2A>G, causes
          skipping of exon 26 and yields an aberrant guanylate kinase domain.
        mechanism_confidence: ESTABLISHED
        gene:
          preferred_term: CASK
          term:
            id: hgnc:1497
            label: CASK
      selected_evidence:
        snippet: we observed a partial skipping of the exon 2 of CASK, presumably a consequence of improper
          recognition of exonic splicing enhancers (ESEs) induced by the c.83G-->T transversion.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19200522
      reference_title: A missense mutation in CASK causes FG syndrome in an Italian family.
      evidence_source: IN_VITRO
      explanation: Establishes the altered-splicing / hypomorphic molecular consequence of the FGS4 p.R28L
        variant rather than a simple missense change.
