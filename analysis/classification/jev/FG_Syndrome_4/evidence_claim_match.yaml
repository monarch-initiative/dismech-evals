      assertion_type: Pathophysiology
      assertion:
        name: Disrupted CASK Synaptic Scaffolding Complex
        biological_scale: MOLECULAR
        description: CASK is a multidomain MAGUK (membrane-associated guanylate kinase) scaffolding protein
          highly expressed in the central nervous system and localized to synapses. It forms competing
          tripartite CASK/Mint1/Velis and CASK/Caskin1/Velis complexes that physically associate with
          the cytoplasmic tail of neurexin at presynaptic sites, assembling large signaling complexes
          that regulate neurotransmission. FGS4 variants reduce or alter CASK so that these scaffolding
          interactions are perturbed; the exon-26-skipping variant specifically yields an aberrant guanylate
          kinase domain predicted to degrade CASK binding to neuronal and ocular development partners.
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: scaffold/adaptor activity
          term:
            id: GO:0030674
            label: protein-macromolecule adaptor activity
        biological_processes:
        - preferred_term: synapse organization
          term:
            id: GO:0050808
            label: synapse organization
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: CASK is a multidomain scaffold protein highly expressed in the central nervous system
          (CNS) with specific localization to the synapses, where it forms large signaling complexes regulating
          neurotransmission.
        supports: SUPPORT
    origin:
