        biological_scale: MOLECULAR
        description: CASK interacts with FRMD7, a FERM-domain protein required for normal ocular-motor
          development and a well-established cause of X-linked congenital (infantile) nystagmus. An FGS4
          variant that damages the CASK guanylate kinase domain is predicted to degrade the CASK-FRMD7
          interaction, providing a mechanistic basis for the congenital nystagmus seen in FGS4.
