      assertion:
        name: Growth Restriction and Skeletal Involvement
        biological_scale: ORGANISM
        role: consequence
        description: Short stature with variable skeletal involvement. In the original kindred patients
          were born at term with normal weight and length, and growth impairment appeared during early
          childhood - so the FILS end of the spectrum is postnatal-onset, unlike the intrauterine growth
          restriction reported at the POLE-IMAGe end. Growth hormone production and response were normal
          in the patients tested, so this is not a GH-axis disorder.
      selected_evidence:
        snippet: these individuals had clinical features closely resembling IMAGe syndrome (intrauterine
          growth restriction [IUGR], metaphyseal dysplasia, adrenal hypoplasia congenita, and genitourinary
          anomalies in males)
        supports: SUPPORT
