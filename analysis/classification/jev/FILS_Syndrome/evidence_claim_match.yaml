        presence: Homozygous POLE1 intron 34 splice variant g.G4444+3A>G, or other biallelic POLE variants
        description: The syndrome was defined in a single large consanguineous family, so the original
          diagnosis was made by linkage and candidate-gene sequencing rather than by a criterion set.
          The recurring allele is an intronic splice-site substitution that would be missed by a coding-exon-only
          analysis reported without intronic flanks - worth knowing when a clinically compatible patient
          has a negative exome.
      selected_evidence:
        snippet: Here, we report that a homozygous single base pair substitution in POLE1 (polymerase
          ε 1), encoding the catalytic subunit of Polε, caused facial dysmorphism, immunodeficiency, livedo,
          and short stature ("FILS syndrome") in a large, consanguineous family.
