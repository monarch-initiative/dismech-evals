      assertion_type: Pathophysiology
      assertion:
        name: Delayed G1-to-S Progression
        biological_scale: CELLULAR
        description: 'Polymerase deficiency impairs proliferation and delays the G1-to-S transition. The
          key observation for this entry is how broadly that block was reproduced: not only in patient
          T lymphocytes, but on Polε1 depletion in B lymphocytes, chondrocytes and osteoblasts - the same
          lesion in the immune and the skeletal lineages, which is why one gene gives both an immunodeficiency
          and a growth phenotype.'
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: G1/S transition of mitotic cell cycle
          term:
            id: GO:0000082
            label: G1/S transition of mitotic cell cycle
          modifier: DECREASED
      selected_evidence:
        snippet: We observed impairment in proliferation and G1- to S-phase progression in patients' T
          lymphocytes.
        supports: SUPPORT
