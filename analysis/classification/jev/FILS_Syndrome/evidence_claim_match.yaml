      assertion:
        discussion_id: pole_replisome_tissue_specificity
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Delayed G1-to-S Progression
        prompt: Why does a general deficiency of the leading-strand polymerase produce this particular
          combination of tissues - growth plate, adrenal cortex and lymphocyte - rather than uniform hypoproliferation?
        rationale: The POLE-IMAGe study frames this as an open question for the whole class, noting that
          disorders of DNA replication genes manifest growth restriction alongside adrenal dysfunction
          and immunodeficiency, and calling for studies of the tissue-specific developmental roles of
          the encoded proteins. The same question applies to the other replisome disorders in this nosology
          group - Meier-Gorlin, DONSON, the Seckel rows - so an answer here would generalize.
      selected_evidence:
        snippet: consolidating these as replisome phenotypes and highlighting a need for future studies
          to understand the tissue-specific development roles of the encoded proteins
        supports: SUPPORT
