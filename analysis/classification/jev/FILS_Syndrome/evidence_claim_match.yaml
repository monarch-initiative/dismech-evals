      reference_title: Polymerase ε1 mutation in a human syndrome with facial dysmorphism, immunodeficiency,
        livedo, and short stature ("FILS syndrome").
      evidence_source: HUMAN_CLINICAL
      explanation: Characterizes the original allele as a splice change reducing protein level, i.e. hypomorphic
