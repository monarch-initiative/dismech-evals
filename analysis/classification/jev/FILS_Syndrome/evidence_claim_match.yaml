              id: MONDO:0014058
              label: facial dysmorphism-immunodeficiency-livedo-short stature syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: POLE
        gene_term:
          preferred_term: POLE
          term:
            id: hgnc:9177
            label: POLE
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'POLE (12q24.33) encodes POLE1, the catalytic subunit of DNA polymerase epsilon. Because
          Polε is essential, disease alleles are hypomorphic: a homozygous single-base substitution causing
          alternative splicing in intron 34 in the original FILS kindred, and the recurrent intronic c.1686+32C>G
          splice-altering allele in trans with loss-of-function variants in the POLE-IMAGe series. This
          variant class is distinct from the heterozygous proofreading-domain missense variants that predispose
          to colorectal and endometrial cancer.'
      selected_evidence:
        snippet: which strongly decreased protein expression of Polε1 and also to a lesser extent the
          Polε2 subunit.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
