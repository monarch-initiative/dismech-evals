            label: enteric neuron
        - preferred_term: Enteric smooth muscle cell
          term:
            id: CL:0002504
            label: enteric smooth muscle cell
        biological_processes:
        - preferred_term: Actin cytoskeleton organization
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
        - preferred_term: Enteric nervous system development
          term:
            id: GO:0048484
            label: enteric nervous system development
        locations:
        - preferred_term: Intestine
          term:
            id: UBERON:0000160
            label: intestine
      selected_evidence:
        snippet: the filamin protein is present in the patient's lymphoblastoid cell line that shows abnormal
          cytoskeletal actin organization compared with normal lymphoblasts
        supports: SUPPORT
