        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FLNA Deficiency and Enteric Neuron Development Failure
        description: Loss-of-function FLNA mutations disrupt the N-terminal region of filamin A, which
          is crucial for proper enteric neuron development. A frameshift mutation between the two initial
          methionines of FLNA allows translation of a truncated protein from the second methionine, producing
          a filamin A protein with abnormal cytoskeletal actin organization. This impairs enteric nervous
          system development and function, leading to intestinal dysmotility and pseudo-obstruction.
        genes:
        - preferred_term: FLNA
          term:
            id: hgnc:3754
            label: FLNA
        molecular_functions:
        - preferred_term: actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
        cell_types:
