        conforms_to: cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling
        description: 'The tissue phenotype is a left-dominant, fibrosis-heavy remodelling: in the founding
          cohort left ventricular dilation was present in 68% of carriers, systolic dysfunction in 46%,
          and myocardial fibrosis in 67%. The prominence of fibrosis relative to the degree of systolic
          impairment is characteristic and is what gives the disease its overlap with arrhythmogenic cardiomyopathy:
          the electrocardiographic signature of that overlap - inferolateral negative T waves and low
          QRS voltages - was present in a third of carriers.'
        cell_types:
