  0ef4959eb71ef7243e1120c242cf9976f05b0ac788a588bb417ad0545d44fdf0:
    claim:
      about:
        disease:
          name: FLNC-Related Dilated Cardiomyopathy
          disease_term:
            preferred_term: FLNC-related dilated cardiomyopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FLNC Truncating Variant Causing Filamin C Haploinsufficiency
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: 'The initiating lesion is a truncating variant in FLNC - nonsense, frameshift or
          splice-disrupting - which acts by haploinsufficiency, reducing the amount of functional filamin
          C rather than introducing a misfolding protein into the Z-disc. This is the mechanistic fork
          that separates the entity from the non-truncating FLNC diseases: myocardial tissue from truncating
          carriers shows no abnormal filamin C aggregates, so the aggregation mechanism that drives the
          missense hypertrophic and myofibrillar phenotypes is not operating here.'
        genes:
        - preferred_term: FLNC
          term:
            id: hgnc:3756
            label: FLNC
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: Actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: DECREASED
        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
      selected_evidence:
        snippet: Immunohistochemical staining of myocardial tissue showed no abnormal filamin C aggregates
          in patients with truncating FLNC mutations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27908349
      reference_title: Truncating FLNC Mutations Are Associated With High-Risk Dilated and Arrhythmogenic
        Cardiomyopathies.
      evidence_source: HUMAN_CLINICAL
      explanation: Direct human myocardial evidence that the aggregate mechanism of the non-truncating
        FLNC diseases is absent in truncating carriers - the observation that separates this entity from
