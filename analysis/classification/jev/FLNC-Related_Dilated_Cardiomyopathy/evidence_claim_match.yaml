  3fec8ff66d09b20e4aa0091d652bd92c6dd4dab15417c4e2fdfeea927b69acdb:
    claim:
      about:
        disease:
          name: FLNC-Related Dilated Cardiomyopathy
          disease_term:
            preferred_term: FLNC-related dilated cardiomyopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Sarcomere Attachment to the Sarcolemma
        biological_scale: CELLULAR
        role: effector
        description: Filamin C cross-links actin at the Z-disc and is essential for attachment of the
          sarcomere to the plasma membrane, coupling contractile force to the cell surface and the surrounding
          matrix. Halving the available protein degrades that linkage, so force generated by an intact
          contractile apparatus is transmitted poorly to and between cells. The lesion is one of mechanical
          coupling rather than of force generation, calcium regulation or protein quality control.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Actin Filament Bundle Assembly
          term:
            id: GO:0051017
            label: actin filament bundle assembly
          modifier: ABNORMAL
        - preferred_term: Sarcomere Organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
      selected_evidence:
        snippet: Filamin C (encoded by the FLNC gene) is essential for sarcomere attachment to the plasmatic
          membrane.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
