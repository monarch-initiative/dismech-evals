          tracked by ejection fraction, as it is in ordinary dilated cardiomyopathy. FLNC sits with desmoplakin,
          lamin A/C, phospholamban, RBM20 and TMEM43 among the arrhythmogenic left ventricular cardiomyopathy
          genes for which left ventricular systolic function is an insensitive predictor of risk.
