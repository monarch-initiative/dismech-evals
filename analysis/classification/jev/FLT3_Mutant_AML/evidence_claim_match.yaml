        description: FLT3 is a class III receptor tyrosine kinase normally involved in hematopoietic progenitor
          cell survival and proliferation. FLT3-ITD mutations cause ligand-independent receptor dimerization
          and constitutive autophosphorylation. FLT3-TKD mutations stabilize the active kinase conformation.
          Both result in aberrant downstream signaling.
        cell_types:
        - preferred_term: myeloblast
          term:
            id: CL:0000835
            label: myeloblast
        molecular_functions:
        - preferred_term: protein tyrosine kinase activity
          modifier: INCREASED
          term:
            id: GO:0004713
            label: protein tyrosine kinase activity
      selected_evidence:
        snippet: In acute myeloid leukemia (AML), FLT3 mutations-most commonly internal tandem duplications
          (FLT3-ITD) and tyrosine kinase domain (FLT3-TKD) substitutions-are among the most frequent genetic
          alterations, driving constitutive activation of proliferative and antiapoptotic pathways and
          conferring adverse prognosis.
        supports: SUPPORT
