      assertion_type: Subtype
      assertion:
        name: FLT3-ITD Mutated AML
        description: AML with internal tandem duplications in the juxtamembrane domain of FLT3. ITD mutations
          cause ligand-independent receptor dimerization and constitutive activation. Associated with
          leukocytosis, high blast percentage, and poor prognosis, particularly when the ITD allelic ratio
          is high. Represents the most clinically significant FLT3 mutation subtype.
      selected_evidence:
        snippet: Patients with FLT3-ITD mutation present with a higher disease burden and have inferior
          overall survival, due to high relapse rates after achieving remission.
        supports: SUPPORT
