      assertion_type: Pathophysiology
      assertion:
        name: Intracellular Heme Accumulation and Toxicity
        description: 'Free heme is toxic to cells. In cells expressing loss-of-function FLVCR1, the heme
          that would normally be exported is inferred to accumulate intracellularly and to cause cellular
          toxicity; the published work measured heme export, mutant localization, and protein half-life
          rather than intracellular heme levels or cell death directly. Complete loss of Flvcr1 function
          is embryonically lethal in mice, underscoring the toxicity of unexported heme.

          '
        biological_processes:
        - preferred_term: Heme metabolic process
          term:
            id: GO:0042168
            label: heme metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: Thus, accumulation of heme in FLVCR1-mutant cells could cause cellular toxicity.
        supports: SUPPORT
        directness: DIRECT
