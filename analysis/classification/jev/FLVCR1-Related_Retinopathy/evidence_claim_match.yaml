              label: FLVCR1-related retinopathy with or without ataxia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FLVCR1 Loss-of-Function and Heme Export Failure
        description: 'Biallelic pathogenic FLVCR1 variants (missense substitutions within transmembrane
          domains, or splice-site changes) cause the mutant heme exporter to fail to fold properly in
          the endoplasmic reticulum. Rather than trafficking to the plasma membrane, mutant FLVCR1 accumulates
          in intracellular structures including lysosomes and is rapidly degraded (half-life 2-4 hours,
          versus >16 hours for wild-type protein), abolishing its heme-export activity.

          '
        biological_processes:
        - preferred_term: Heme export
          term:
            id: GO:0097037
            label: heme export
          modifier: DECREASED
      selected_evidence:
        snippet: FLVCR1 mutants did not localize to the plasma membrane and were observed in intracellular
          structures, including lysosomes. We hypothesize that the loss of function of FLVCR1 mutants
          is caused by their mislocation. We examined the half-life of FLVCR1 in cells, which was >16h
          for wild-type FLVCR1 compared with 2-4h for the mutants.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
