            term:
              id: MONDO:0100449
              label: FLVCR1-related retinopathy with or without ataxia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Proposed Residual FLVCR1 Function in Ataxia-Sparing Genotypes
        description: 'A proposed, currently unproven explanation for FLVCR1-related retinopathy without
          ataxia: splice-site FLVCR1 variants (e.g., c.1092+5G>A) may permit low-level production of correctly
          spliced, functional transcript despite triggering predominant exon skipping and a frameshift/premature
          stop codon on the majority of transcripts. Such residual functional protein would, on this hypothesis,
          be sufficient to protect the lower-FLVCR1-expressing posterior columns and cerebellum from heme
          toxicity while remaining insufficient to protect the higher-expressing retina. The suggestion
          rests on one 32-year-old patient plus two previously reported carriers of the same variant (aged
          9 and 34); no functional assay of residual FLVCR1 protein from a splice allele has been reported,
          the authors note that the effects of deep splice-site changes are difficult to predict, and
          the residual-protein step is itself inferred from the embryonic lethality of the mouse null.

          '
      selected_evidence:
        snippet: Splice-site FLVCR1 variants may result in the translation of some fully functional FLVCR1
          protein product which is sufficient for tissues in which FLVCR1 is expressed at a lower level
          (posterior columns and cerebellum), but which is insufficient to protect against the toxic effects
          of excess intracellular heme in tissues which express FLVCR1 highly (retina).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29192808
      reference_title: A splice-site variant in FLVCR1 produces retinitis pigmentosa without posterior
        column ataxia.
      evidence_source: HUMAN_CLINICAL
      explanation: States the genotype-phenotype hypothesis that this node is about, in the same terms
