        description: Disease-specific therapy is high-dose folinic acid (5-formyltetrahydrofolate, also
          called leucovorin), which bypasses the FRalpha transport block and restores CSF folate into
          the normal range. Oral high-dose therapy is usually sufficient (a reported oral dose is 5.2
          mg/kg/day), with intramuscular or intermittent intravenous dosing as alternatives, and CSF folate
          is monitored to confirm adequacy. Benefit is greatest when started early; presymptomatic treatment
          of affected sibs can prevent or markedly mitigate disease. Plain folic acid is avoided because
          it binds FRalpha tightly and may interfere with any residual receptor function.
