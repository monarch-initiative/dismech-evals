  9deb27018563f7e6157b3a8fa8d39fd067b3ffebc1f6dcb8746c989124297ff2:
    claim:
      about:
        disease:
          name: FOLR1-Related Cerebral Folate Transport Deficiency
          disease_term:
            preferred_term: FOLR1-related cerebral folate transport deficiency
            term:
              id: MONDO:0013110
              label: neurodegenerative syndrome due to cerebral folate transport deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deficient Exosomal Folate Delivery into Brain Parenchyma
        description: Beyond transcytosis into the CSF, folate receptor alpha is shed on FRalpha-positive
          exosomes that shuttle 5-methyltetrahydrofolate from the choroid plexus across the CSF into the
          brain parenchyma, where the exosomes are internalized by astrocytes and neurons. Loss of FRalpha
          eliminates these FRalpha-positive CSF exosomes, removing this second delivery step so that folate
          captured at the choroid plexus fails to reach parenchymal brain cells.
        role: intermediate
        cell_types:
        - preferred_term: choroid plexus epithelial cell
          term:
            id: CL:0000706
            label: choroid plexus epithelial cell
        biological_processes:
        - preferred_term: exosomal secretion
          term:
            id: GO:1990182
            label: exosomal secretion
          modifier: DECREASED
        locations:
        - preferred_term: choroid plexus
          term:
            id: UBERON:0001886
            label: choroid plexus
      selected_evidence:
        snippet: Loss of folate receptor-α-expressing cerebrospinal fluid exosomes correlates with severely
          reduced 5-methyltetrahydrofolate concentration, corroborating the importance of the folate receptor-α-mediated
          folate transport in the cerebrospinal fluid.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23828504
      reference_title: Choroid plexus transcytosis and exosome shuttling deliver folate into brain parenchyma.
      evidence_source: HUMAN_CLINICAL
      explanation: Loss of FRalpha-positive CSF exosomes tracks with severely reduced CSF 5-MTHF, evidencing
        the exosomal folate-delivery step lost in FOLR1-CFTD.
    first_seen_at: '2026-11-09T20:50:16.152365+00:00'
