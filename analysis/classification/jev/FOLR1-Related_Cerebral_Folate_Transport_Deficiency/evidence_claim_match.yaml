        - preferred_term: CNS hypomyelination
          term:
            id: HP:0003429
            label: CNS hypomyelination
        - preferred_term: Ataxia
          term:
            id: HP:0001251
            label: Ataxia
      selected_evidence:
        snippet: restored by folinic acid therapy and preceded clinical improvements.
