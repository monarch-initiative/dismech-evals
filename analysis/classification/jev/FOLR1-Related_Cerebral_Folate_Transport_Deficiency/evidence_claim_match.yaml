      assertion_type: Pathophysiology
      assertion:
        name: FOLR1 Biallelic Loss of Function and Folate Receptor Alpha Deficiency
        description: Biallelic loss-of-function variants in FOLR1 abolish functional folate receptor alpha
          (FRalpha), a GPI-anchored high-affinity folate-binding receptor highly expressed at the apical
          surface of choroid-plexus epithelium. Missense variants are expressed but mislocalize away from
          the cell surface, eliminating cellular folate binding, so both truncating and missense alleles
          converge on functional FRalpha loss at the blood-CSF barrier.
        role: trigger
        cell_types:
        - preferred_term: choroid plexus epithelial cell
          term:
            id: CL:0000706
            label: choroid plexus epithelial cell
        molecular_functions:
