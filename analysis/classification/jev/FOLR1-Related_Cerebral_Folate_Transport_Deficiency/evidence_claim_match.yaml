              label: neurodegenerative syndrome due to cerebral folate transport deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Folate Transport Across the Blood-CSF Barrier and Low CSF 5-MTHF
        description: FRalpha-mediated transcytosis moves 5-methyltetrahydrofolate from blood across the
          choroid-plexus epithelium into the cerebrospinal fluid. Loss of FRalpha blocks this blood-CSF
          folate transport, producing a severe isolated reduction of CSF 5-MTHF while serum/systemic folate
          remains normal, the biochemical hallmark of cerebral folate deficiency.
        role: intermediate
        cell_types:
        - preferred_term: choroid plexus epithelial cell
          term:
            id: CL:0000706
            label: choroid plexus epithelial cell
        biological_processes:
        - preferred_term: folate transmembrane transport
          term:
            id: GO:0098838
            label: folate transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: we identify folate receptor-α-positive intralumenal vesicles within multivesicular bodies
          and demonstrate the directional cotransport of human folate receptor-α, and labelled folate
          from the basolateral to the apical membrane in rat choroid plexus cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23828504
      reference_title: Choroid plexus transcytosis and exosome shuttling deliver folate into brain parenchyma.
      evidence_source: IN_VITRO
      explanation: Demonstrates FRalpha-dependent directional basolateral-to-apical (transcytotic) folate
