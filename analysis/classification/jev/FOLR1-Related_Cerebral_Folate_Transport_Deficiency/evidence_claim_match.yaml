          term:
            id: GO:0061714
            label: folic acid receptor activity
          modifier: DECREASED
        locations:
        - preferred_term: choroid plexus
          term:
            id: UBERON:0001886
            label: choroid plexus
      selected_evidence:
        snippet: We identified an inherited brain-specific folate transport defect that is caused by mutations
          in the folate receptor 1 (FOLR1) gene coding for folate receptor alpha (FRalpha).
        supports: SUPPORT
