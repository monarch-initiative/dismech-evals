  a46a591ad6428543fdd650b0680ac2525071a07ac8be6a52cf1181f0df4629a5:
    claim:
      about:
        disease:
          name: FOLR1-Related Cerebral Folate Transport Deficiency
          disease_term:
            preferred_term: FOLR1-related cerebral folate transport deficiency
            term:
              id: MONDO:0013110
              label: neurodegenerative syndrome due to cerebral folate transport deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_folr1_treatment_response_determinants
        prompt: What determines the degree and reversibility of neurologic recovery after folinic acid
          treatment in FOLR1-CFTD, and why do some deficits (particularly established hypomyelination
          and cognitive impairment) fail to reverse when treatment is started late despite normalization
          of CSF folate?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hypomyelination and Neurodegeneration
        - treatments#High-dose folinic acid (leucovorin)
        rationale: FOLR1-CFTD is a treatable disorder in which folinic acid can restore CSF folate and
          drive clinical improvement, yet clinical severity does not correlate cleanly with residual FRalpha
          function, and later-treated individuals may retain irreversible deficits. The determinants of
          treatment response, the therapeutic window relative to the postnatal myelination period, and
          whether irreversible deficits reflect a fixed developmental myelination defect versus ongoing
          correctable metabolic dysfunction remain unresolved, and are central to the case for early or
          newborn-screening-based diagnosis.
      selected_evidence:
        snippet: different clinical severities do not necessarily correlate with residual function of
          folate receptor alpha mutants and indicate that additional factors contribute to the clinical
          phenotype in cerebral folate transport deficiency.
        supports: SUPPORT
    origin:
