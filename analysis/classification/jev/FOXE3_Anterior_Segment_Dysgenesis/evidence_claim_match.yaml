        genes:
        - preferred_term: FOXE3
          term:
            id: hgnc:3808
            label: FOXE3
        description: 'Autosomal dominant form, corresponding to MONDO:0013067 (cataract 34, multiple types;
          OMIM:612968), caused by heterozygous FOXE3 alleles that extend the protein past its native stop
          codon. Phenotypes are highly variable and include congenital cataract (cerulean type and early
          onset nuclear/cortical cataract), Peters anomaly, iris colobomas, and other anterior segment
          defects. Penetrance is high with variable expressivity, and in the largest reported dominant
          series eye size was normal in most individuals even though a minority had microphthalmia, aphakia
          or sclerocornea more typical of recessive disease.

          '
      selected_evidence:
        snippet: the dominant mutations were penetrant, they gave rise to highly variable phenotypes including
          iris and chorioretinal colobomas, Peters' anomaly, and isolated cataract (cerulean type and
          early onset adult nuclear and cortical cataract)
        supports: SUPPORT
