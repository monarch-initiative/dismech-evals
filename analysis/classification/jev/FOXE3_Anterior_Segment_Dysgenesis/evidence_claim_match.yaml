          and one of the earliest integrators of signaling pathways required for lens formation. The two
          allele classes are functionally distinct rather than two points on one dosage curve. Dominant
          alleles are predominantly C-terminal extension variants that append a novel tail past the native
          stop codon, and in the largest functional survey they were severely impaired in protein stability,
          DNA binding, nuclear localization and transcriptional activity and behaved as dominant negatives;
          recessive alleles (truncating and forkhead-domain missense) showed variable effects across the
