            term:
              id: MONDO:0019503
              label: anterior segment dysgenesis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Lens Placode Induction and Differentiation
        description: 'FOXE3 is a forkhead transcription factor expressed exclusively in the anterior lens
          epithelium. It is a downstream target of PAX6 and RX and acts as one of the earliest integrators
          of FGF, BMP, and WNT signaling pathways that cooperate to induce lens formation. In homozygous
          loss-of-function mutations, complete absence of FOXE3 activity prevents lens placode development
          during the 4th-5th week of embryogenesis, resulting in primary aphakia. Because the lens serves
          as an organizer for anterior segment morphogenesis, its absence leads to secondary aplasia of
          iris, cornea, and anterior chamber structures.

          '
        genes:
        - preferred_term: FOXE3
          term:
            id: hgnc:3808
            label: FOXE3
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
        cell_types:
        - preferred_term: Lens epithelial cell
          term:
            id: CL:0002224
            label: lens epithelial cell
        biological_processes:
        - preferred_term: Lens development
          term:
            id: GO:0002088
            label: lens development in camera-type eye
        - preferred_term: Lens fiber cell differentiation
          term:
            id: GO:0070306
            label: lens fiber cell differentiation
      selected_evidence:
        snippet: During development Foxe3 is expressed in all undifferentiated lens tissues, and is turned
          off upon fiber cell differentiation
        supports: SUPPORT
