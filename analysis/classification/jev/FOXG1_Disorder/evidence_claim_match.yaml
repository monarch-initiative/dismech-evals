              label: FOXG1 disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: FOXG1
        association: Causal heterozygous pathogenic variant or dosage alteration
        gene_term:
          preferred_term: FOXG1
          term:
            id: hgnc:3811
            label: FOXG1
        notes: FOXG1 disorder is typically caused by de novo heterozygous intragenic variants, deletions,
          or duplications affecting FOXG1 dosage; germline mosaicism can create recurrence risk.
        variants:
        - name: P1 de novo t(9;14) downstream of FOXG1 (Mehrjouy 2018)
          variant_type: translocation
          genomic_contexts:
          - intergenic region
          affected_regions:
          - name: FOXG1 regulatory Domain A (proximal hESC TAD)
            chromosomal_region: 14q12
            description: The 14q12 breakpoint lies in Domain A, the proximal hESC TAD, approximately 502
              kb downstream of FOXG1 and proximal to the refined critical SRO. The translocation separates
              intact FOXG1 from the SRO, which lies proximal to the hESC-specific boundary between Domains
              A and B. Neither the SRO nor that boundary is shown to be deleted by P1's translocation.
          regulatory_target_gene:
            preferred_term: FOXG1
            term:
              id: hgnc:3811
              label: FOXG1
          description: Mehrjouy patient P1 (ClinVar SCV000576475) carries de novo t(9;14). Sanger sequencing
            placed the GRCh37 chromosome 14 junctions at 29,738,725 and 29,738,735, approximately 502
            kb downstream of FOXG1, with small junction deletions. The reported phenotype includes seizures,
            severe developmental delay, postnatal microcephaly, hypotonia, and absent speech. FOXG1 expression
            was not measured in P1; the regulatory target assignment reflects the clinical mapping model.
      selected_evidence:
        snippet: FOXG1 syndrome is an autosomal dominant disorder typically caused by a de novo pathogenic
          variant.
        supports: SUPPORT
