      assertion_type: Pathophysiology
      assertion:
        name: Extra-CNS Developmental Consequences of FOXP1 Dosage Reduction
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: FOXP1 is required outside the brain. In mice it has critical roles in spinal motor
          neuron, lymphocyte, cardiomyocyte, foregut and skeletal development, and reduced dosage in humans
          is associated with cardiac malformations, congenital anomalies of the kidney and urinary tract,
          cryptorchidism, ophthalmic anomalies, and recurrent sinopulmonary or airway infections. Which
          of these are obligate consequences of FOXP1 dosage versus variable stochastic developmental
          effects is unresolved; single-patient reports of lung and skeletal disease remain unreplicated.
      selected_evidence:
        snippet: In humans FOXP1 mutations have been associated with language and speech defects, intellectual
          disability, autism spectrum disorder, facial dysmorphisms, and congenital anomalies of the kidney
          and urinary tract.
        supports: SUPPORT
