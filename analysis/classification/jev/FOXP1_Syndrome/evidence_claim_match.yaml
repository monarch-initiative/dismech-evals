      assertion_type: Pathophysiology
      assertion:
        name: Autistic Features and Behavioral Dysregulation
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: A complex neurobehavioral profile rather than a single behavioral diagnosis. Restricted
          and repetitive behaviors are near-universal even in individuals who do not meet criteria for
          autism spectrum disorder; ADHD is the most common formal psychiatric diagnosis, followed by
          anxiety, with sensory symptoms (particularly sensory seeking) common. The behavioral phenotype
          persists into adolescence and adulthood as anxiety plus externalizing behavior. The mechanistic
          path from FOXP1-dependent striatal and cortical circuits to these behaviors is supported by
          model systems but not established in humans.
      selected_evidence:
        snippet: In addition, 24% of the cohort met criteria for ASD. Seventy-five percent of individuals
          met DSM-5 criteria for attention-deficit/hyperactivity disorder and 38% for an anxiety disorder.
          Repetitive behaviors were almost universally present (95%) even without a diagnosis of ASD.
        supports: SUPPORT
