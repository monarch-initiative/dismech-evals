      assertion:
        target: Structural Brain Abnormality
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Disrupted FOXP1-dependent brain development is the presumed origin of the heterogeneous
          structural brain abnormalities seen on imaging in about half of individuals (ventricular dilatation,
          white-matter abnormalities, corpus callosum defects, cerebellar defects). The findings are non-specific
