              label: intellectual disability-severe speech delay-mild dysmorphism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of FOXP1 Transcriptional Repression
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: FOXP1 is a sequence-specific transcriptional repressor. Pathogenic alleles converge
          on loss of repression activity, most often accompanied by abnormal subcellular (cytoplasmic
          or aggregated nuclear) localization; the recurrent p.Arg525Gln allele loses repression while
          retaining normal nuclear localization, showing that the repression defect, not mislocalization
          per se, is the shared consequence. Repression is exerted in part through interaction with the
          NuRD chromatin-remodeling complex, an interaction that requires SUMOylation of FOXP1 during
          embryonic brain development.
        biological_processes:
        - preferred_term: negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: DECREASED
        - preferred_term: FOXP1 SUMOylation required for NuRD interaction
          term:
            id: GO:0016925
            label: protein sumoylation
      selected_evidence:
        snippet: Here we present three patients with the same FOXP1 mutation, c.1574G>A (p.R525Q), that
          results in the characteristic loss of transcription repression activity. This mutation, however,
          represents the first reported FOXP1 mutation that does not result in cytoplasmic or nuclear
          aggregation of the protein but maintains normal nuclear localization.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30385778
      reference_title: Characterization of a recurrent missense mutation in the forkhead DNA-binding domain
        of FOXP1.
      evidence_source: IN_VITRO
      explanation: Dissociates loss of repression from mislocalization, identifying loss of repression
        as the convergent molecular defect.
