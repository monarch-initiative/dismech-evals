        mechanism_confidence: PROVISIONAL
        description: FOXP1 is expressed in embryonic neural stem cells, and reducing it shifts the balance
          away from neuronal (and astrocytic) differentiation. In utero FOXP1 knockdown reduces neural
          stem cell differentiation and migration during corticogenesis, and transplanted FOXP1-knockdown
          neural stem cells fail to differentiate and function normally in vivo. The mechanism is established
          in murine and cellular models; direct confirmation in human FOXP1-syndrome brain tissue is lacking.
        cell_types:
