              label: intellectual disability-severe speech delay-mild dysmorphism syndrome
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Lifelong intellectual disability with a universal speech and language impairment,
          near-universal behavioral morbidity, and continuing dependence for activities of daily living
          into adulthood, with most individuals requiring extensive and often continuous caregiver support.
          Families rank intellectual disability, impaired communication, behavior problems, lack of age-appropriate
          self-reliance, attention problems and anxiety as the most burdensome features, a set dominated
          by cognition, communication and behavior rather than by the congenital malformations that defined
          the earliest reports. Incontinence, obsessions and a complex sensory profile rank disproportionately
          high relative to how uniformly they occur. Burden is high but not uniformly severe: skills continue
          to accrue and there is no regression.'
      selected_evidence:
        snippet: The most burdensome complaints for patients with FOXP1 syndrome, as perceived by parents,
          include intellectual disability, impaired communication, behaviour problems, lack of age-appropriate
          self-reliance, attention problems and anxiety.
        supports: SUPPORT
