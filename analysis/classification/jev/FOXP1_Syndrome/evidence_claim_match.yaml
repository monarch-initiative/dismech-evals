              label: intellectual disability-severe speech delay-mild dysmorphism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous FOXP1 Loss-of-Function Variation
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The initiating lesion is a heterozygous, usually de novo, pathogenic FOXP1 variant:
          whole- or partial-gene deletion, frameshift, nonsense, essential splice-site change, in-frame
          deletion, or missense substitution. Missense and in-frame alleles cluster in the C-terminal
          forkhead DNA-binding domain, where they either perturb residues required for DNA contact or
          interfere with the domain swap that mediates FOXP1 dimerization. FOXP1 also heterodimerizes
          with its paralog FOXP2, the classic speech-and-language gene, which is one route by which reduced
          FOXP1 dosage reaches speech circuitry.'
        genes:
        - preferred_term: FOXP1
          term:
            id: hgnc:3823
            label: FOXP1
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: DECREASED
        - preferred_term: FOXP1 domain-swap dimerization
          term:
            id: GO:0042803
            label: protein homodimerization activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: The majority of pathogenic missense and in-frame mutations, including all four missense
          mutations in our cohort, lie in the DNA-binding domain. Through structural analyses, we show
          that the mutations perturb amino acids necessary for binding to the DNA or interfere with the
          domain swapping that mediates FOXP1 dimerization.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29090079
      reference_title: Prospective investigation of FOXP1 syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes both the mutational clustering in the forkhead domain and the two structural
        mechanisms by which those alleles impair FOXP1 function.
