      assertion_type: Discussion
      assertion:
        discussion_id: foxp1_postnatal_reinstatement_window
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Postnatal FOXP1 reinstatement rescues electrophysiological, behavioral and cell-type-specific
          transcriptional phenotypes in mice. Does a comparable postnatal window of reversibility exist
          in humans, in whom the disorder is diagnosed after several years of atypical development and
          in whom cortical and striatal circuit maturation follows a much longer timescale?
        attaches_to:
        - pathophysiology#Altered Striatal Circuit Excitability
        rationale: This is a translational-validity question rather than an absence of evidence. Strong
          in vivo mouse evidence exists that the striatal arm of the mechanism is postnatally reversible,
          which would reclassify FOXP1 syndrome from a fixed prenatal malformation disorder to a partially
          modifiable circuit disorder and would justify FOXP1-restoration strategies. But mouse reinstatement
          occurs early in a short developmental program, whereas human diagnosis typically follows years
          of atypical development; delivery to the relevant cell types, dosage and isoform control, off-target
          transcriptional effects, and the human timing window are all unresolved. The cortical arm of
          the mechanism (lamination, barrel formation, dendritic spines) has not been shown to be reversible
          at all.
        proposed_experiments:
        - experiment_id: exp_foxp1_reinstatement_age_series
          name: Age-series mapping of the FOXP1 reinstatement window in mice
          description: Reinstate FOXP1 at a graded series of postnatal ages in the same conditional model
            and measure D2 SPN glutamatergic input strength, synaptically driven excitability, and the
            corresponding behavioral readouts at each timepoint. The objective is the shape of the closing
            window, not a single permissive early timepoint, because only a rate of closure can be extrapolated
            to the much longer human developmental timescale.
        - experiment_id: exp_foxp1_cortical_arm_reversibility
          name: Test whether the cortical arm is reversible under the same protocol
          description: Apply the same postnatal reinstatement protocol to cortex-restricted Foxp1 loss
            and assay laminar positioning, somatosensory barrel organization, dendritic spine density,
            and tactile behavior. A negative result would confine the reversibility claim to the striatal
            arm and would materially change what a FOXP1-restoration therapy could be expected to achieve.
        - experiment_id: exp_foxp1_dose_response_ipsc
          name: FOXP1 dose-response in patient-derived and isogenic human neurons
          description: Use patient-derived iPSC neurons and isogenic corrected lines to establish the
            FOXP1 dose-response relationship, determining whether a normal transcriptional state is reachable
            without overexpression toxicity and which isoforms must be restored. FOXP1 is dosage sensitive
            in both directions, so a human dose window is a prerequisite for any restoration strategy.
      selected_evidence:
        snippet: Caregivers reported continued development in adaptive skills even into adulthood.
        supports: SUPPORT
