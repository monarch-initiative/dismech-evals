          in practice exome or genome sequencing performed for neurodevelopmental delay, or chromosomal
          microarray when the lesion is a copy-number deletion. The recognizable facial gestalt plus a
          speech impairment disproportionate to cognitive level are the clinical triggers.
        presence: Positive
