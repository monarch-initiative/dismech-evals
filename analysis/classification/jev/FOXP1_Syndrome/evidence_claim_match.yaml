            term:
              id: CHEBI:6887
              label: methylphenidate
        target_phenotypes:
        - preferred_term: Attention deficit hyperactivity disorder
          term:
            id: HP:0007018
            label: Attention deficit hyperactivity disorder
      selected_evidence:
        snippet: Additionally, families reported ineffectiveness and poor tolerance of methylphenidate
          in these patients.
