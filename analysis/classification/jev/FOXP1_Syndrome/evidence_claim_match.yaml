        association: Causative
        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: FOXP1 (3p13) encodes a forkhead-box transcriptional repressor. Pathogenic alleles are heterozygous
          and, in the large majority of molecularly tested probands, de novo. The spectrum comprises whole-
          and partial-gene deletions (including cytogenetically visible 3p13-14.1 deletions and intragenic
          deletions), frameshift and nonsense variants, essential splice-site changes, in-frame deletions,
          and missense substitutions; balanced rearrangements disrupting FOXP1 have also been reported.
          Missense and in-frame alleles cluster in the C-terminal forkhead DNA-binding domain. All reported
          pathogenic alleles studied functionally converge on loss of transcriptional repression activity,
          supporting haploinsufficiency as the disease mechanism. Rare parental somatic-plus-germline
          mosaicism gives an approximately 1% sib recurrence risk.
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: Autosomal dominant, almost always de novo; each child of an affected individual
            has a 50% chance of inheriting the variant.
      selected_evidence:
        snippet: Haploinsufficiency of the forkhead-box protein P1 (FOXP1) gene leads to a neurodevelopmental
          disorder termed FOXP1 syndrome.
        supports: SUPPORT
