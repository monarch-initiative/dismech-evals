        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'Beyond specifying medium spiny neuron identity, FoxP1 dose sets the intrinsic excitability
          of these neurons. In patient-relevant heterozygous Foxp1 mice, reduced Foxp1 alters medium spiny
          neuron excitability and correlates with defective ultrasonic vocalization; brain-specific Foxp1
          knockout pups have strongly reduced ultrasonic vocalization and lose the normal sex-specific
          call rate. FoxP1 is co-expressed with the androgen receptor in striatal medium spiny neurons,
          and FOXP1 heterodimerizes with FOXP2, tying this node to the canonical speech-and-language pathway.
          The proximate mechanism is subtype specific: FOXP1 strengthens and matures the long-range cortical
          and thalamic glutamatergic inputs onto D2 (indirect-pathway) SPNs and thereby promotes their
          synaptically driven excitability. Critically, postnatal FOXP1 reinstatement in mice rescues
          the electrophysiological, cell-type-specific transcriptional, and behavioral abnormalities,
          so at least part of this node is not a fixed prenatal malformation.'
        cell_types:
        - preferred_term: medium spiny neuron
          term:
            id: CL:1001474
            label: medium spiny neuron
        biological_processes:
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: Foxp1 KO pups had strongly reduced USV and lacked the sex-specific call rate from WT
          pups, indicating that Foxp1 is essential for normal USV.
        supports: SUPPORT
