      assertion:
        phase: Non-regressive lifelong developmental trajectory
        age_range: Infancy through adulthood (observed 2-54 years)
        notes: FOXP1 syndrome follows a static-encephalopathy-like course. Caregiver-report studies spanning
          childhood to adulthood (age 2-54 years) document continued, if slow, acquisition of adaptive
          and communication skills into adulthood with no developmental regression, no neuropsychiatric
          decompensation, and no catatonia. Educational placement typically shifts toward special education
          by late elementary school, and caregiver concerns move from cognitive and developmental issues
          in childhood to independence, safety, and housing in adolescence and adulthood.
      selected_evidence:
        snippet: There was no reported regression or loss of skills, early in development or during adolescence/adulthood.
        supports: SUPPORT
