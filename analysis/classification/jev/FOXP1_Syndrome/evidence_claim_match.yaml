            biological_scale: MOLECULAR
            mechanism_confidence: ESTABLISHED
            description: 'Reduced FOXP1 dosage releases repression of its direct targets and reconfigures
              the downstream network. Two arms are best characterized: de-repression of Notch pathway
              genes, notably the ligand Jagged1, which sustains Notch signaling and holds progenitors
              in a proliferative, undifferentiated state; and dysregulation of autism-associated signaling
              pathways and neuronal-activity genes, including a striatal neuron-identity program that
              is conserved between mouse brain and human neural progenitors. In developing neocortex the
              Foxp1-regulated networks are specifically enriched for neurogenesis and neuronal-migration
              effectors.'
            biological_processes:
            - preferred_term: regulation of transcription by RNA polymerase II
              term:
                id: GO:0006357
                label: regulation of transcription by RNA polymerase II
              modifier: DYSREGULATED
            - preferred_term: Notch signaling pathway
              term:
