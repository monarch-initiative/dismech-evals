        disease:
          name: Fabry disease
          disease_term:
            preferred_term: Fabry disease
            term:
              id: MONDO:0010526
              label: Fabry disease
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cardiac Amyloidosis
        disease_term:
          preferred_term: Amyloidosis
          term:
            id: MONDO:0019065
            label: amyloidosis
        description: 'Cardiac amyloidosis presents with heart failure, arrhythmias, and LGE patterns similar
          to Fabry disease. Both conditions can cause concentric or apical hypertrophy, conduction abnormalities,
          and restrictive physiology. Systolic dysfunction may occur in both. The apical sparing pattern
          seen on imaging can occur in both amyloidosis and Fabry disease, making differentiation challenging
          without additional diagnostic markers.

          '
        distinguishing_features:
        - Extracardiac systemic manifestations (neuropathic pain, angiokeratomas, renal disease) are typical
          of Fabry disease but absent in cardiac amyloidosis
        - Distinctive cornea verticillata, a whorl-like corneal opacity on slit-lamp examination, is characteristic
          of Fabry disease
        - Young age of symptom onset is characteristic of Fabry disease (often in childhood); cardiac
          amyloidosis is more common in elderly
        - Male predominance with severe phenotype indicates X-linked inheritance typical of Fabry disease
        - Elevated lyso-Gb3 biomarker is diagnostic for Fabry disease
        - Skin or conjunctival biopsy showing amyloid (amyloidosis) versus genetic testing for GLA mutations
          (Fabry disease) provides definitive diagnosis
      selected_evidence:
        snippet: An apical sparing pattern on longitudinal strain has also been described in FD, similarly
          to amyloidosis
        supports: SUPPORT
