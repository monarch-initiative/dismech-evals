            label: Chagas disease
        description: 'Chagas disease, caused by Trypanosoma cruzi, can present with cardiac manifestations
          including cardiomyopathy, arrhythmias, and sudden cardiac death, overlapping with Fabry disease
          cardiac phenotypes. Both can cause left ventricular dysfunction and conduction abnormalities.
          Chronic Chagas disease produces cardiomyopathy with LGE patterns that can mimic Fabry disease.
          However, systemic manifestations differ significantly.

          '
        distinguishing_features:
        - Acroparesthesia and pain crises are characteristic of Fabry disease but not seen in Chagas disease
        - Angiokeratomas and cornea verticillata are pathognomonic for Fabry disease
        - Renal involvement with progressive proteinuria and chronic kidney disease is typical of Fabry
          disease but absent in Chagas disease
        - Geographic/epidemiological risk differs (Chagas disease endemic to Central/South America; Fabry
          disease worldwide with X-linked inheritance)
        - Gastrointestinal involvement (megaesophagus, megacolon) is typical of Chagas disease but not
          seen in Fabry disease
        - Serological testing for Trypanosoma cruzi antibodies versus genetic testing for GLA mutations
          provides definitive diagnosis
      selected_evidence:
        snippet: this LGE pattern is not exclusive of FD and may also be found in myocarditis, Chagas
          disease, and sarcoidosis [52].
        supports: SUPPORT
