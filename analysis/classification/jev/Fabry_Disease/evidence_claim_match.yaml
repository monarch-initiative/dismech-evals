        notes: 'Loss-of-function mutations in GLA cause deficiency of α-galactosidase A. Disease shows
          X-linked inheritance with hemizygous males severely affected and heterozygous females showing
          variable phenotypes due to X-inactivation. Genetic testing is the gold standard for diagnosis
          and can identify a wide spectrum of variants including point mutations, insertions, deletions,
          and deep intronic variants. Long-read sequencing approaches enable comprehensive variant detection.

          '
        inheritance:
        - name: X-linked recessive
          description: Males are hemizygous and severely affected; females are heterozygous carriers with
            variable presentation. In males, diagnosis is based on enzyme activity testing showing very
            low or absent α-galactosidase A activity in classical forms (near zero) or reduced activity
            (under 30%) in late-onset forms.
