      assertion:
        name: Myocarditis
        disease_term:
          preferred_term: Myocarditis
          term:
            id: MONDO:0004496
            label: myocarditis
        description: 'Myocarditis frequently occurs in Fabry disease (reported in 56% of patients) and
          can also present as an independent disorder. Both can cause acute or subacute cardiac dysfunction,
          ventricular dysfunction, arrhythmias, and myocardial inflammation on imaging. Myocarditis in
          Fabry disease results from chronic Gb3 accumulation in cardiomyocytes, while primary myocarditis
          is typically triggered by viral infections, autoimmune mechanisms, or drug reactions. The distinction
          is critical for treatment planning.

          '
        distinguishing_features:
        - Myocarditis in Fabry disease is chronic and progressive (from lysosomal substrate accumulation),
          whereas primary myocarditis is acute/subacute
        - Extracardiac features including neuropathic pain, angiokeratomas, renal disease, and cornea
          verticillata are absent in isolated myocarditis
        - Elevated lyso-Gb3 biomarker is diagnostic for Fabry disease
        - Family history showing X-linked inheritance pattern indicates Fabry disease, whereas primary
          myocarditis typically presents sporadically
        - Left ventricular hypertrophy pattern is characteristic of Fabry disease, while acute myocarditis
          presents with dilated cardiomyopathy
        - Prodromal viral illness preceding acute myocarditis is typically absent in Fabry disease
      selected_evidence:
        snippet: Endomyocardial biopsies have shown myocarditis in 56% of FD patients
        supports: SUPPORT
