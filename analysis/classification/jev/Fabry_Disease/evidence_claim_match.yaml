              id: MONDO:0010526
              label: Fabry disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_gla_deficiency_gb3_lysosomal_storage_model
        hypothesis_label: Canonical α-Galactosidase A / Gb3 Lysosomal Storage Model
        status: CANONICAL
        description: Fabry disease is an X-linked lysosomal storage disorder caused by loss-of-function
          variants in GLA on Xq22.1 encoding the lysosomal enzyme α-galactosidase A (α-Gal A). Loss of
          α-Gal A catalytic activity prevents lysosomal hydrolysis of globotriaosylceramide (Gb3) and
          related glycosphingolipids, leading to progressive accumulation in lysosomes of vascular endothelium,
          podocytes, cardiomyocytes, dorsal root ganglion neurons, and other cell types. Substrate accumulation
          causes endothelial dysfunction, microvascular ischemia, cardiomyopathy, progressive renal failure,
          small-fiber neuropathy, and stroke. Enzyme replacement therapy (agalsidase alfa/beta), pharmacological
          chaperone therapy (migalastat for amenable mutations), and substrate reduction trials all corroborate
          the α-Gal A deficiency / Gb3 accumulation axis as the canonical pathogenic mechanism.
        notes: 'Retained as CANONICAL but flagged as "mechanistically incomplete as a storage-only model."
          The 2026 falcon hypothesis-search report (kb/hypotheses/Fabry_Disease/canonical_gla_deficiency_gb3_lysosomal_storage_model;
          openscientist timed out at 3600s) confirms α-Gal A restoration → reduced Gb3/lyso-Gb3 burden
          across tissues via enzyme replacement (agalsidase alfa/beta, pegunigalsidase alfa), pharmacological
          chaperone (migalastat for amenable mutations), substrate reduction, and gene therapy — with
          EM reduction of storage inclusions in preclinical AAV-GLA models. However, the storage model
          is qualified by four refinements: (1) downstream programs — inflammation, oxidative stress /
          NO dysregulation, ER stress / unfolded protein response (''agalopathy''), autophagy-lysosomal
          dysfunction, fibrosis — can persist despite biochemical normalization and may become partially
          self-sustaining, limiting reversibility in advanced disease; (2) lyso-Gb3 (globotriaosylsphingosine)
          is not only a pharmacodynamic biomarker but a likely bioactive mediator that propagates pathology
          even when total Gb3 is reduced; (3) tissue-specific responses differ markedly — vascular endothelium
          clears Gb3 readily with ERT while podocytes and cardiomyocytes show only partial clearance,
          explaining persistent nephropathy/cardiomyopathy on long-term therapy; (4) inflammation/innate
          immune activation in Fabry cardiomyopathy and nephropathy reframes the canonical storage-only
          model as a storage + cytokine/oxidative-axis disorder requiring combined therapeutic strategies.'
      selected_evidence:
        snippet: Fabry disease represents an X-linked, multisystem lysosomal storage disorder caused by
          defective function of the enzyme alpha-galactosidase A (α-Gal A).
        supports: SUPPORT
