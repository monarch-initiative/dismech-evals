            label: sarcoidosis
        description: 'Sarcoidosis is a multisystem granulomatous disorder that can involve heart (cardiac
          sarcoidosis), kidneys, nervous system, and skin, creating potential overlap with Fabry disease
          systemic manifestations. Both can cause cardiomyopathy, arrhythmias, conduction abnormalities,
          renal disease, and neuropathy. Cardiac sarcoidosis with LGE on imaging can superficially resemble
          Fabry disease cardiomyopathy. Neurological involvement (stroke, neuropathy) occurs in both conditions.

          '
        distinguishing_features:
        - Acroparesthesia with pain crises is characteristic of Fabry disease, whereas sarcoidosis causes
          other neuropathy types
        - Angiokeratomas and cornea verticillata are pathognomonic for Fabry disease and absent in sarcoidosis
        - Pulmonary involvement with hilar lymphadenopathy is typical of sarcoidosis but absent in Fabry
          disease
        - Cutaneous manifestations differ (angiokeratomas in Fabry disease versus erythema nodosum or
          lupus pernio in sarcoidosis)
        - Calcium metabolism abnormalities (hypercalcemia, hypercalciuria) are typical of sarcoidosis
          but absent in Fabry disease
        - Elevated lyso-Gb3 biomarker is diagnostic for Fabry disease, while elevated ACE and serum calcium
          suggest sarcoidosis
        - Skin or conjunctival biopsy showing granulomas versus genetic testing for GLA mutations provides
          definitive diagnosis
      selected_evidence:
        snippet: this LGE pattern is not exclusive of FD and may also be found in myocarditis, Chagas
          disease, and sarcoidosis [52].
        supports: SUPPORT
