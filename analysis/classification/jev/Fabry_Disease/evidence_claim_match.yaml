      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hypertrophic Cardiomyopathy (HCM)
        disease_term:
          preferred_term: Hypertrophic Cardiomyopathy
          term:
            id: MONDO:0005045
            label: hypertrophic cardiomyopathy
        description: 'HCM is the most common cardiac differential diagnosis for Fabry disease, as both
          conditions present with left ventricular hypertrophy, cardiomyocyte dysfunction, and arrhythmias.
          Both can cause sudden cardiac death and progressive heart failure. The cardiac phenotype of
          Fabry disease (apical involvement, LGE pattern, reduced ejection fraction) overlaps significantly
          with HCM. Systemic manifestations including neuropathic pain, renal disease, and skin lesions
          are distinguishing features of Fabry disease absent in HCM.

          '
        distinguishing_features:
        - Prominent basal inferolateral late gadolinium enhancement (LGE) pattern (~50% of Fabry patients)
        - Acroparesthesia and pain crises (absent in HCM)
        - Angiokeratomas and cornea verticillata (pathognomonic for Fabry disease)
        - Progressive renal disease with proteinuria and decline in GFR (rare in HCM)
        - X-linked inheritance pattern (HCM typically autosomal dominant)
        - Elevated lyso-Gb3 biomarker (diagnostic for Fabry disease)
        - Prominent papillary muscles are characteristic of Fabry disease
      selected_evidence:
        snippet: Hypertrophic cardiomyopathy (HCM) is the main cardiac manifestation of FD
        supports: SUPPORT
