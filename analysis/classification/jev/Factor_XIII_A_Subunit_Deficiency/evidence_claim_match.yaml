              id: MONDO:0013187
              label: factor XIII, A subunit, deficiency of
        context:
        - path: /pathophysiology/1
          value:
            name: Absent Plasma Factor XIII Transglutaminase Activity
            biological_scale: MOLECULAR
            description: 'Thrombin normally cleaves the activation peptide from each A subunit and millimolar
              calcium then releases the B-subunit dimer, exposing a Cys-His-Asp catalytic triad that transfers
              acyl groups between glutamine donors and lysine acceptors to form epsilon-(gamma-glutamyl)lysine
              isopeptide bonds. With no functional A subunit there is no triad and no cross-linking chemistry,
              whatever thrombin does. The consequence branches three ways, according to which substrate
              is no longer cross-linked: fibrin itself, alpha-2-antiplasmin, or the extracellular matrix
              proteins that tie the clot to the wound bed.'
            molecular_functions:
            - preferred_term: plasma factor XIIIa transglutaminase activity
              modifier: LOSS_OF_FUNCTION
              term:
                id: GO:0003810
                label: protein-glutamine gamma-glutamyltransferase activity
            biological_processes:
            - preferred_term: isopeptide cross-linking of clot proteins
              modifier: DECREASED
              term:
                id: GO:0018149
                label: peptide cross-linking
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure of Fibrin Gamma- and Alpha-Chain Cross-Linking
        causal_link_type: DIRECT
        description: Fibrin chains are the best-characterised FXIIIa substrate; with no enzyme, gamma-gamma
          dimerization and alpha-chain multimerization do not occur.
      selected_evidence:
        snippet: The best characterized substrates are fibrin chains (γ–γ dimerization and α-chain multimerization),
          which impart tensile strength and viscoelastic stability to the clot.
        supports: SUPPORT
