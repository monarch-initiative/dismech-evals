        context:
        - path: /animal_models/3
          value:
            name: Black and Tan Coonhound with a homozygous F13A1 frameshift
            species: Dog
            genotype: F13A1 c.1234_1239delinsTCAA (exon 11), homozygous; predicted frameshift from residue
              412 with a premature stop codon
            publication: PMID:42184124
            description: 'Naturally occurring disease rather than an engineered model, and the only record
              in this entry in which both arms of the mechanism were measured in the same individual.
              A 4-month-old dog presented with spontaneous hemoperitoneum and bleeding that persisted
              after surgery; whole-genome sequencing against 3,023 other dogs found a private homozygous
              deletion-insertion in exon 11 of F13A1 predicting a frameshift and premature stop, with
              a predicted loss of 43% of the protein and probable nonsense-mediated decay. Plasma FXIII
              activity was 5%. The diagnostic picture is the human one reproduced in another species:
              PT, aPTT, thrombin time, fibrinogen and every individual factor assay within reference limits,
              and a clot that dissolved completely in 5 M urea. Viscoelastic testing showed both reduced
              maximum clot firmness and a markedly abnormal 45-minute lysis index at the same time, and
              both normalised as plasma and cryoprecipitate were given - which is the closest thing in
              this entry to a direct demonstration that the mechanical and fibrinolytic arms are separable
              states of one clot. Canine F13A1 encodes a 733-residue protein 88% identical to the human
              one.'
            notes: 'This is the second reported clinical case of FXIII deficiency in dogs and the first
              genetic characterisation of the disorder in a companion animal; it is not the first canine
              description, and is not curated as such. Graded MODEL_ORGANISM throughout, per CLAUDE.md:
              a veterinary observation in a non-human mammal is animal evidence however carefully the
              individual was worked up.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Intact Thrombin Generation and Fibrin Polymerisation Upstream of Cross-Linking
        relationship: RECAPITULATES
        fidelity: HIGH
        model_scale: MOLECULAR
        description: The normal-screening-test finding, reproduced in a second species and in an animal
          whose causal variant is known. This is the only non-human support in the entry for the node
          that carries the diagnostic trap.
        limitations: A single animal, so the observation is that the screen can be normal in F13A1-null
          disease, not an estimate of how often it is.
        readouts:
        - name: Routine coagulation screen and individual factor assays
          target: Intact Thrombin Generation and Fibrin Polymerisation Upstream of Cross-Linking
          direction: UNCHANGED
          interpretation: PT, aPTT, thrombin time, fibrinogen and the individual procoagulant factor assays
            all sat within reference limits in an animal with 5% FXIII activity and overt bleeding - the
            upstream cascade reporting itself intact, which is what this node claims.
      selected_evidence:
        snippet: Unlike other procoagulant factors, FXIII is not required for the transformation of plasma
          fibrinogen into the polymerized fibrin fibrils that form a fibrin clot.
        supports: SUPPORT
