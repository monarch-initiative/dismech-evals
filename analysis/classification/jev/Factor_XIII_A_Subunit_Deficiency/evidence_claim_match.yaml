      assertion_type: DifferentialDiagnosis
      assertion:
        name: Factor XIII B subunit deficiency
        description: 'A different locus, not a subtype of this entry. F13B encodes the carrier subunit;
          its loss lowers the circulating heterotetramer concentration by removing stabilisation and transport
          rather than abolishing catalysis, and the phenotype is correspondingly milder - severe F13B
          deficiency may be managed on demand rather than with mandatory primary prophylaxis. It accounts
          for the small minority of congenital factor XIII deficiency. The distinction is therapeutically
          load-bearing, not taxonomic bookkeeping: recombinant FXIII-A2 is effective in A-subunit disease
          and is not indicated in B-subunit disease. MONDO:0013190 covers it; dismech has no entry for
          it at the time of writing.'
      selected_evidence:
        snippet: On the other hand, patients with severe FXIII-B deficiency may only require on-demand
          therapy, while heterozygotes are generally asymptomatic.
        supports: SUPPORT
