        context:
        - path: /animal_models/2
          value:
            name: FXIII-deficient mouse excisional wound-healing cohort
            species: Mouse
            genotype: FXIII-deficient (targeted subunit not stated in the cited report)
            publication: PMID:16113836
            description: 'The animal evidence for the non-haemostatic arm of this disease. Excisional
              wounds left unsutured and undressed closed more slowly in FXIII-deficient mice than in controls
              - 15%, 27% and 27% less closure at days 4, 8 and 11 - and were only 73.23% closed at day
              11 against 100% in controls. Histology at day 11 showed delayed re-epithelialisation and
              a necrotised fissure. The informative arm is the third group: FXIII concentrate raised day-11
              closure to 90.06% and normalised the histology, which is what makes this a model of the
              FXIII-dependent step rather than of an incidental strain difference.'
            notes: The cited report calls its animals "FXIII-deficient mice" and does not state which
              subunit was targeted, so the genotype is recorded as reported rather than as FXIII-A-null.
              At the time of publication the described knockout lines were A-subunit lines, which makes
              an A-subunit genotype likely, but that is an inference and is not asserted here. Treat the
              link below as evidence about FXIII rather than specifically about FXIII-A.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Poor wound healing
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: Quantified delay in excisional wound closure with delayed re-epithelialisation on
          histology, corrected by FXIII concentrate.
        limitations: Two limitations. The report does not say which FXIII subunit was targeted, so the
          model speaks to FXIII deficiency rather than specifically to A-subunit deficiency. And a murine
          excisional wound left unsutured and undressed is not the clinical scenario the human phenotype
          describes, which is dehiscence of a surgical wound; the shared claim is that FXIII is required
          for timely closure, not that the wound types correspond.
        readouts:
        - name: Percentage excisional wound closure at days 4, 8 and 11
          target: Poor wound healing
          direction: DECREASED
          interpretation: A graded, time-resolved deficit rather than a single endpoint, which is what
            makes the delay rather than the failure of healing the claim.
        - name: Day-11 wound closure with and without FXIII replacement
          target: Poor wound healing
          direction: RESTORED
          interpretation: The rescue arm. Replacement moves day-11 closure from 73.23% back toward the
            control value, which attributes the deficit to the missing protein.
        - name: Re-epithelialisation on day-11 histology
          target: Poor wound healing
          direction: DECREASED
          interpretation: Ties the macroscopic closure deficit to the cellular process the human mechanism
            names - re-epithelialisation over a provisional matrix.
      selected_evidence:
        snippet: The findings of this study confirm that in FXIII-deficient mice wound healing is delayed
          and the cellular and tissue defects can be corrected by treatment with FXIII, providing evidence
          for the essential role of FXIII in wound repair and remodeling.
        supports: SUPPORT
