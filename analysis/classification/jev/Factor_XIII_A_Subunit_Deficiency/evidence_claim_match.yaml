      assertion_type: Treatment
      assertion:
        name: Plasma-Derived Factor XIII Concentrate Prophylaxis
        description: Pathogen-inactivated plasma-derived FXIII concentrate (Corifact, Fibrogammin) given
          monthly as primary prophylaxis, and at 20-40 IU/kg on demand or perioperatively. It remains
          first-line for routine prophylaxis across age groups, and unlike recombinant FXIII-A2 it covers
          both A- and B-subunit disease, because it supplies the intact A2B2 heterotetramer. Labelled
          dosing starts at 40 IU/kg every 28 days, titrated in 5 IU/kg steps to a trough of roughly 5-20%;
          children often clear it faster and need closer titration. An Iranian series of 38 patients who
          had already had an intracranial haemorrhage started all but one of them on 10 IU/kg every 4-6
          weeks and reported a good response with no recurrence, again with one exception. That is the
          clearest available evidence that prophylaxis prevents the outcome that matters most, and it
          is uncontrolled.
        therapeutic_modality: PROTEIN_REPLACEMENT
        dosing_interval: every 28 days
        dosing_interval_days: 28
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: human plasma-derived factor XIII concentrate
            term:
              id: NCIT:C200601
              label: Human Factor XIII Concentrate
      selected_evidence:
        snippet: Product labeling supports an initial dose of 40 IU/kg intravenously every 28 days with
          subsequent titration (typically in 5 IU/kg increments) to maintain a trough activity of ~5–20%
