        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_fxiii_a_prophylaxis_trough_target
        kind: KNOWLEDGE_GAP
        prompt: What trough factor XIII activity should prophylaxis target, and does a higher target reduce
          intracranial haemorrhage or improve pregnancy outcome?
        rationale: Every activity threshold in this entry - the 5-20% prophylaxis trough, the 10-15% spontaneous-bleeding
          threshold, the 30% perioperative target, the trimester-specific obstetric targets - comes from
          product labelling, narrative review and observational series, not from a trial that compared
          targets against outcomes. The review that is this entry's principal source says so explicitly
          and names the comparison that is missing. This matters more here than it would for most thresholds,
          because the outcome being prevented is permanent neurological injury in a young child, and because
          the interval between doses is long enough that the trough is the operative quantity.
        attaches_to:
        - biochemical#Plasma factor XIII activity
        - treatments#Plasma-Derived Factor XIII Concentrate Prophylaxis
      selected_evidence:
        snippet: Despite these advancements, sustained progress in FXIII deficiency will require studies
          that link target activity thresholds to outcomes in the settings where decisions are most time
          sensitive.
        supports: SUPPORT
