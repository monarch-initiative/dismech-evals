        description: A different disease, not a late-onset form of this one. It arises either immunologically,
          from autoantibodies (commonly IgG4) against FXIII-A or less often FXIII-B, or non-immunologically
          from consumption, dilution or reduced synthesis in major surgery, trauma, sepsis, liver disease
          and disseminated intravascular coagulation. It presents in adults with abrupt severe bleeding,
          there is no pathogenic variant, and the definitive treatment of the immune form is inhibitor
          eradication with immunosuppression rather than lifelong replacement. A 1:1 mixing study that
          fails to correct separates it from congenital deficiency at the bench. MONDO:0021133 covers
          it.
