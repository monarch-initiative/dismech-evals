          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: The impaired wound healing observed in FXIII deficiency reflects multiple mechanisms
          beyond hemostasis, whereby FXIIIa-mediated crosslinking of fibrin to extracellular matrix proteins
          creates a stable scaffold essential for fibroblast migration, keratinocyte re-epithelialization,
          and angiogenesis during tissue repair.
        supports: SUPPORT
