        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'F13A1 (coagulation factor XIII A chain) on chromosome 6p24-p25 encodes the 731-residue
          catalytic transglutaminase subunit of factor XIII. Biallelic loss-of-function variants cause
          this disease and account for about 95% of congenital factor XIII deficiency. The variant spectrum
          is broad - roughly 200 variants reported across F13A1 and F13B, predominantly missense, with
          large deletions rarest - and there are no mutational hotspots, so molecular confirmation needs
          full-gene sequencing or a panel that includes the whole gene. Founder variants dominate locally:
          Trp187Arg is the most common variant in Iran. Genotype does not predict phenotype; residual
          activity does so moderately well. The HGNC CURIE was resolved from the HGNC REST API during
          curation (symbol F13A1 -> HGNC:3531, "coagulation factor XIII A chain"), and the F13B symbol
          was resolved separately (HGNC:3534) to confirm the two are distinct loci.'
      selected_evidence:
        snippet: The F13A1 gene (chromosome 6p24–p25; 15 exons) encodes a 731-amino-acid catalytic subunit
          that contains the transglutaminase core
        supports: SUPPORT
