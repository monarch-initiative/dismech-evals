            publication: PMID:12933578
            description: An independently derived FXIII-A knockout line, analysed specifically for reproductive
              failure. Homozygous females conceive, but most die of excessive vaginal bleeding during
              gestation; histology shows massive placental haemorrhage and subsequent necrosis in the
              uterus by gestational day 10, irrespective of fetal genotype - so the lesion is maternal.
              The authors call the result reminiscent of spontaneous miscarriage in pregnant humans with
              FXIII deficiency and conclude that maternal FXIII is required for uterine haemostasis and
              maintenance of the placenta. This line is why the human pregnancy-loss phenotype has animal
              support at all; the exon-7 deletion line above remains fertile.
          role: ancestor
        - path: /animal_models/1/modeled_mechanisms/0
          value:
            target: Recurrent pregnancy loss
            relationship: RECAPITULATES
            fidelity: MODERATE
            model_scale: ORGANISM
            description: Gestational placental haemorrhage and pregnancy loss in homozygous FXIII-A-null
              dams, attributed by the authors to maternal FXIII.
            limitations: Two divergences from the human phenotype. The mice largely die of maternal haemorrhage,
              which is not the usual human outcome - unprophylaxed women miscarry and survive. And the
              murine loss is dated to gestational day 10 with placental haemorrhage and necrosis, whereas
              the human mechanism is placed in the first trimester and attributed partly to failure of
              FXIII-dependent matrix cross-linking during cytotrophoblast invasion, which murine placentation
              cannot test. Fidelity is therefore MODERATE rather than HIGH despite the phenotype matching.
          role: ancestor
