        biological_scale: TISSUE
        description: 'The second arm of the defect, and mechanistically separate from mechanical weakness:
          the clot is actively digested sooner because it lacks the covalently bound alpha-2-antiplasmin
          that would have restrained plasmin locally. In a ferret embolism model, blocking FXIIIa activity
          alone raised endogenous lysis from about 14% to about 43% - comparable to giving tissue plasminogen
          activator - which is the scale of protection the cross-links normally provide.'
        biological_processes:
        - preferred_term: plasmin-mediated dissolution of the haemostatic clot
          modifier: INCREASED
          term:
            id: GO:0042730
            label: fibrinolysis
      selected_evidence:
        snippet: Inhibition of factor XIIIa activity increased endogenous lysis markedly (group 1 versus
          2; P<0.0001), to a level comparable to that achieved with TPA (group 2 versus 3; P<0.05).
        supports: SUPPORT
