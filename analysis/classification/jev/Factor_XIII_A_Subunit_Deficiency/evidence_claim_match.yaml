          without prophylaxis miscarried, against 3 of 16 with prophylaxis. A systematic review of the
          published literature found 124 of 136 unprophylaxed pregnancies (91%) ended in miscarriage.
          The mechanism is not purely haemostatic - FXIII-dependent matrix stabilisation is required for
          cytotrophoblast invasion and implantation.'
        phenotype_term:
          preferred_term: Recurrent first-trimester pregnancy loss
        notes: 'Left ontology-unbound, following the precedent in `Asherman_Syndrome` and `Thrombophilia`.
          HP:0200067 (Recurrent spontaneous abortion) exists and means exactly this, but HPO files it
          under Past medical history / Pregnancy history rather than under HP:0000118 phenotypic abnormality,
          so it is outside the `PhenotypeTerm` dynamic enum and binding it fails `just validate-terms`.
          HP:0005268 (Miscarriage) is no better: its ancestors are Clinical modifier / Prenatal death
          / Mortality-Aging. Searched `l^Spontaneous abortion`, `l^Miscarriage`, `l^Recurrent miscarriage`,
          `l^Abortion`, `l^Pregnancy loss` and `l^Fetal death` against `ols:hp`; HPO has no phenotypic-abnormality
          term for recurrent pregnancy loss.'
      selected_evidence:
        snippet: In 136 pregnancies without prophylactic therapy, 124 (91%) resulted in a miscarriage
          and 12(9%) progressed to viability stage.
        supports: SUPPORT
