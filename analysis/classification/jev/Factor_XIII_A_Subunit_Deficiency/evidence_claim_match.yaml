        biological_scale: TISSUE
        description: 'FXIIIa cross-links fibrin(ogen) to fibronectin, vitronectin and other matrix proteins,
          turning the clot into a provisional scaffold that fibroblasts migrate through, keratinocytes
          re-epithelialise over, and new vessels grow into. Losing this is a tissue-repair defect rather
          than a bleeding defect: the provisional matrix is compromised, granulation is delayed, and wounds
          dehisce even when haemostasis looked adequate. The same matrix-stabilising requirement applies
          at the maternal-fetal interface, where cytotrophoblast invasion and placentation depend on it.'
        biological_processes:
        - preferred_term: FXIIIa-dependent provisional matrix formation in wound repair
          modifier: DECREASED
          term:
