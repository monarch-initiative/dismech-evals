        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic F13A1 Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: Homozygous or compound heterozygous pathogenic variants in F13A1 (chromosome 6p24-p25,
          15 exons, encoding the 731-residue catalytic A subunit) are the initiating lesion. Roughly 200
          variants are described across F13A1 and F13B, most of them missense, with large deletions the
          rarest class; there are no mutational hotspots, so confirmation relies on sequencing the whole
          gene or a panel that includes it. Founder alleles dominate in some populations - Trp187Arg is
          the commonest Iranian variant. A-subunit defects account for about 95% of congenital FXIII deficiency
          and produce the more severe phenotype, because what is lost is catalytic activity rather than
          carriage.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HOMOZYGOUS
          description: Germline biallelic loss of function. Compound heterozygosity is equally common
            in non-consanguineous families; HOMOZYGOUS is recorded because that is the configuration in
            the consanguineous populations where most described patients live, and the functional consequence
            is the same.
        molecular_functions:
        - preferred_term: factor XIII-A transglutaminase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0003810
            label: protein-glutamine gamma-glutamyltransferase activity
        cell_types:
        - preferred_term: resident macrophage (source of plasma FXIII-A)
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: platelet (cellular FXIII-A pool)
          term:
            id: CL:0000233
            label: platelet
      selected_evidence:
        snippet: The F13A1 gene (chromosome 6p24–p25; 15 exons) encodes a 731-amino-acid catalytic subunit
          that contains the transglutaminase core
        supports: SUPPORT
