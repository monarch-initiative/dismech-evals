      assertion_type: Discussion
      assertion:
        discussion_id: gap_fxiii_a_diagnosis_before_first_ich
        kind: KNOWLEDGE_GAP
        prompt: Can diagnosis be made before the first intracranial haemorrhage in children without a
          known family history?
        rationale: The preventable outcome is frequently the presenting one. In a South Indian paediatric
          cohort the median age at symptom onset was 6 months and the median age at diagnosis 1 year,
          and intracranial bleeding was the first presentation in a significant number of children; in
          the FranceCoag cohort 7 of 15 patients who had an intracranial haemorrhage were already diagnosed
          but untreated. Those are two different failures - one of diagnosis, one of treatment - and both
          are addressable. No newborn screening exists, and the only test that would find the disease
          is one that most laboratories cannot run.
        attaches_to:
        - definitions#Laboratory diagnosis of factor XIII A subunit deficiency
        - phenotypes#Intracranial hemorrhage
      selected_evidence:
        snippet: The median age of symptom onset was 6 mo, and the median age of diagnosis was 1 y, demonstrating
          a delay in diagnosis.
        supports: SUPPORT
