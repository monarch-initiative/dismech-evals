  cfb47f928934389bf0df59b37d693514d24ce4dd270c9c23fe52703aa9aae92e:
    claim:
      about:
        disease:
          name: Factor XIII A Subunit Deficiency
          disease_term:
            preferred_term: Factor XIII A subunit deficiency
            term:
              id: MONDO:0013187
              label: factor XIII, A subunit, deficiency of
        context: []
      assertion_type: Biochemical
      assertion:
        name: Plasma factor XIII activity
        presence: DECREASED
        frequency: VERY_FREQUENT
        biomarker_term:
          preferred_term: factor XIII activity
          term:
            id: NCIT:C174313
            label: Factor XIII Activity Measurement
        notes: The diagnostic test. Measured by a quantitative functional assay - most commonly ammonia
          release, in which thrombin and calcium activate FXIII and the liberated ammonia is quantified
          through a glutamate dehydrogenase-coupled NADH oxidation - and reported as a percentage of normal.
          Isopeptidase and amine-incorporation assays are alternatives. Severe disease is usually below
          5-10% and often at or below 1-3%. The interpretation bands below are the activity thresholds
          used clinically to set prophylaxis troughs and perioperative targets; they are not a laboratory
          normal interval and they are drawn from narrative review rather than prospective validation,
          which the review itself says is the outstanding evidence gap. The biomarker is bound to the
          NCIT term for the measurement because NCIT's clinical-measurement branch is where this concept
          sits; the analyte-level LOINC codes are on the reference ranges.
        readouts:
        - target: Absent Plasma Factor XIII Transglutaminase Activity
          relationship: READOUT_OF
          direction: NEGATIVE
          endpoint_context: DIAGNOSTIC
          interpretation: The assay measures the transglutaminase activity that the pathophysiology node
            says is absent, which is why it is the one test that detects this disease.
        reference_ranges:
        - loinc_term:
            id: LOINC:27815-0
            label: Coagulation factor XIII activity actual/normal in Platelet poor plasma by Chromogenic
              method
          unit: '%'
          population: Patients with congenital factor XIII deficiency
          notes: No normal interval is asserted. The bands below are clinical decision thresholds expressed
            as percent of normal FXIII activity, taken from a narrative review; the same review states
            that linking target activity thresholds to outcomes is an open research question. The LOINC
            code is the platelet-poor-plasma percent-of-normal activity measurement, which is the quantity
            these bands are expressed in.
          interpretation_bands:
          - name: Severe deficiency
            upper_bound: 3.0
            unit: '%'
            abnormal_flag: CRITICAL_LOW
            severity: SEVERE
            interpretation: Activity at or below about 1-3% of normal; the phenotype is usually severe,
              with spontaneous bleeding and intracranial risk. This is where essentially all genetically
              confirmed A-subunit null patients sit.
          - name: Spontaneous bleeding risk range
            lower_bound: 3.0
            upper_bound: 15.0
            unit: '%'
            abnormal_flag: LOW
            severity: MODERATE
            interpretation: Below roughly 10-15% of normal the risk of spontaneous bleeding is increased.
              Prophylaxis troughs are conventionally titrated into the lower part of this range (about
              5-20%).
          - name: Haemostatic for minor procedures
            lower_bound: 15.0
            upper_bound: 30.0
            unit: '%'
            abnormal_flag: LOW
            severity: MILD
            interpretation: Above the spontaneous-bleeding threshold but below the target generally recommended
              for surgery.
          - name: Perioperative target
            lower_bound: 30.0
            unit: '%'
            abnormal_flag: NORMAL
            interpretation: At least 30% activity, and higher for major operations, is the level generally
              aimed for to secure surgical haemostasis. Flagged NORMAL because it is the intended therapeutic
              state, not because 30% is a normal endogenous value.
      selected_evidence:
        snippet: Quantitative FXIII activity measurement is the recommended first-line diagnostic modality;
          while many clinical laboratories still lack the ability to perform such assays, in those that
          do, at the time of writing, ammonia-release assays predominate.
        supports: SUPPORT
