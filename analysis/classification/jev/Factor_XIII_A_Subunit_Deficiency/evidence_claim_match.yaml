      assertion_type: DifferentialDiagnosis
      assertion:
        name: Congenital afibrinogenemia and hypofibrinogenemia
        description: The other inherited disorder that classically causes delayed umbilical stump bleeding,
          so it is the main alternative when that sign presents. It is separable on the routine screen,
          which is grossly abnormal in afibrinogenaemia and normal here, and on the fibrinogen concentration.
          Fibrinogen abnormalities also confound the clot solubility test - low or dysfunctional fibrinogen
          produces false positives - which is one more reason not to rely on that test.
      selected_evidence:
        snippet: Hypofibrinogenemia and dysfibrinogenemia can cause false positives, whereas increased
          fibrinogen may reduce sensitivity and contribute to false negative results.
        supports: SUPPORT
