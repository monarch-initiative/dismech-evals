  8aa53e3f07508fd15a451e6faaa4ce2e09671e73be7cd7a999484816c2fc2338:
    claim:
      about:
        disease:
          name: Factor XIII A Subunit Deficiency
          disease_term:
            preferred_term: Factor XIII A subunit deficiency
            term:
              id: MONDO:0013187
              label: factor XIII, A subunit, deficiency of
        context: []
      assertion_type: Treatment
      assertion:
        name: Cryoprecipitate or Plasma Bridging
        description: 'Cryoprecipitate or plasma (fresh frozen plasma, or plasma frozen within 24 hours
          of phlebotomy) raises FXIII activity where concentrate is unavailable or cannot be obtained
          quickly. It is explicitly second-line: FXIII content varies widely between units and products,
          plasma carries a volume load, and pathogen reduction is often absent. In practice it is nevertheless
          the treatment many patients actually receive - fourteen of the twenty children in the South
          Indian paediatric cohort were on cryoprecipitate prophylaxis, and four children had breakthrough
          bleeds when the schedule slipped, including one intracranial bleed during a pandemic supply
          interruption. That is the clearest illustration of why a bridging product is not an equivalent.'
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: transfusion of a factor XIII-containing blood component
          term:
            id: NCIT:C15192
            label: Blood Transfusion
          therapeutic_agent:
          - preferred_term: cryoprecipitated plasma
        notes: Two bindings are deliberately imprecise and the reasons are recorded rather than papered
          over. NCIT has no cryoprecipitate-transfusion clinical-action term, so the action is bound to
          the general Blood Transfusion term; NCIT:C180873 Cryoprecipitated Plasma exists but is a blood-product
          term that is not reachable from the Clinical Intervention or Procedure root and so cannot occupy
          the `treatment_term` slot, and it was not verified to be a valid ChemicalEntityTerm either,
          so `therapeutic_agent` carries the free-text name only. Fresh frozen plasma has its own action
          term (NCIT:C116475) but is curated here together with cryoprecipitate because the cited sources
          treat them as one second-line bridging option with the same rationale and the same caveats.
      selected_evidence:
        snippet: can serve as temporary bridges to raise FXIII activity, but they are second-line because
          of FXIII content variability, larger volumes (plasma), and lack of pathogen reduction in many
          settings.
        supports: SUPPORT
