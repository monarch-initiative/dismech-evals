      assertion_type: Definition
      assertion:
        name: Insensitivity of the clot solubility screen
        definition_type: OTHER
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'Recorded as a definition rather than a note because it is a statement about what
          a test does and does not establish, and getting it wrong is the commonest route to a missed
          diagnosis. The urea (5 M) or monochloroacetic acid (1%) clot solubility test is still the first
          and often only screen available in many laboratories. A positive result does indicate severe
          deficiency, at activity levels of roughly 1-5% depending on method. A negative result establishes
          nothing: sensitivity is poor, raised fibrinogen reduces it further, and hypofibrinogenaemia
          and dysfibrinogenaemia generate false positives. Contemporary guidance restricts the test to
          crude adjunctive use in low-resource settings and is explicit that a normal result must not
          delay quantitative activity testing.'
        attaches_to:
        - biochemical#Fibrin clot solubility in urea or monochloroacetic acid
      selected_evidence:
        snippet: A positive result strongly suggests severe deficiency at very low activity levels (~1
          to 5% depending on method); however, sensitivity is poor.
        supports: SUPPORT
