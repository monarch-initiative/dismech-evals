        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_fxiii_a_activity_severity_modifiers
        kind: KNOWLEDGE_GAP
        prompt: Why does residual factor XIII activity predict clinical severity only moderately well,
          and what modifies the bleeding phenotype at a given activity level?
        rationale: Genotype does not predict phenotype in this disease at all, and activity predicts it
          only moderately to strongly. Both facts are reported rather than explained. Candidate modifiers
          are visible in the mechanism this entry models - the relative contribution of the mechanical
          and fibrinolytic arms could differ between patients, and the platelet FXIII-A pool is a compartment
          that plasma activity assays do not report - but nothing in the literature reviewed here tests
          that. The practical consequence is that a measured activity cannot be used on its own to decide
          who needs prophylaxis.
        attaches_to:
        - genetic#F13A1
        - biochemical#Plasma factor XIII activity
      selected_evidence:
        snippet: There is no correlation between genotype and phenotype and a moderate to strong correlation
          between factor activity and clinical severity in FXIII-A deficiency, making it difficult to
          predict bleeding patterns based on genotype and FXIII activity levels.
        supports: SUPPORT
