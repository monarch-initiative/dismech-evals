      assertion:
        name: Recombinant Factor XIII-A2 Prophylaxis (Catridecacog)
        description: 'Monthly intravenous recombinant FXIII A-subunit dimer, given as primary prophylaxis.
          This is the one treatment that is specific to this entry rather than to factor XIII deficiency
          in general: because it replaces only the A subunit, it works in F13A1 deficiency and does not
          work in isolated F13B deficiency. In the mentor-2 extension trial 60 patients with severe (<0.05
          IU/mL) A-subunit deficiency received 35 IU/kg every 28 days for at least 52 weeks, with a mean
          annualized bleeding rate of 0.043 per patient-year, no neutralizing antibodies, and enough haemostatic
          coverage for twelve minor surgeries without supplementary FXIII. The 28-day interval is possible
          because FXIII has a terminal half-life of about 13.7 days - an order of magnitude longer than
          the upstream factors.'
        therapeutic_modality: PROTEIN_REPLACEMENT
