  49f58c0ebb93acf71b1a4d2e15ebd747c265ce77405d7f795f18db0eff9b99ba:
    claim:
      about:
        disease:
          name: Factor XIII A Subunit Deficiency
          disease_term:
            preferred_term: Factor XIII A subunit deficiency
            term:
              id: MONDO:0013187
              label: factor XIII, A subunit, deficiency of
        context: []
      assertion_type: Definition
      assertion:
        name: Laboratory diagnosis of factor XIII A subunit deficiency
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'The diagnostic problem in this disease is entirely a problem of test selection,
          and it is the clinical core of the entry. Suspicion comes from the bleeding history - delayed
          or disproportionate bleeding - because every routine test is normal. The prothrombin time, activated
          partial thromboplastin time, thrombin time and fibrinogen concentration interrogate thrombin
          generation and fibrin polymerisation, both of which are intact; they cannot detect a cross-linking
          defect and a normal set does not lower the probability of the diagnosis. Confirmation requires
          a quantitative FXIII activity assay, first-line, usually an ammonia-release method. FXIII-A
          and FXIII-B antigen assays then separate the A-subunit disease modelled here from B-subunit
          disease, and sequencing of F13A1 and F13B confirms it and determines which replacement product
          is appropriate. Two pre-analytical requirements matter: the plasma must be platelet-poor, because
          platelet FXIII-A contaminates the antigen measurement, and the sample must be timed relative
          to any replacement, because the 7-14 day half-life of FXIII can mask the deficiency after a
          dose.'
        scope: Laboratory confirmation of severe congenital A-subunit deficiency. It excludes the acquired
          autoantibody-mediated form, which needs a mixing study and inhibitor titration in addition,
          and it excludes isolated F13B deficiency, which this laboratory sequence is designed to separate
          out rather than to include.
        attaches_to:
        - pathophysiology#Intact Thrombin Generation and Fibrin Polymerisation Upstream of Cross-Linking
        - pathophysiology#Absent Plasma Factor XIII Transglutaminase Activity
        inclusion_criteria:
        - preferred_term: Bleeding that is delayed or out of proportion to the clinical context
        - preferred_term: Markedly reduced quantitative FXIII activity, usually below 5-10% of normal
        - preferred_term: Reduced FXIII-A antigen, with FXIII-B antigen secondarily low or normal
        - preferred_term: Biallelic pathogenic F13A1 variants on sequencing
        exclusion_criteria:
        - preferred_term: Correction of low FXIII activity in a 1:1 mix with pooled normal plasma, indicating
            an inhibitor rather than congenital deficiency
        - preferred_term: Absent or markedly reduced FXIII-B antigen with a pathogenic F13B genotype,
            indicating B-subunit deficiency
        - preferred_term: Reliance on a normal urea or monochloroacetic acid clot solubility test to exclude
            the diagnosis
        notes: No LOINC-coded computable phenotype algorithm is asserted. The LOINC codes for the relevant
          assays are recorded on the `biochemical` records below, where the reference intervals live;
          this definition is a clinical-laboratory diagnostic sequence, not a validated EHR case-finding
          query, so `validation_status` is deliberately absent rather than guessed at.
      selected_evidence:
        snippet: Quantitative FXIII activity measurement is the recommended first-line diagnostic modality
        supports: SUPPORT
    origin:
