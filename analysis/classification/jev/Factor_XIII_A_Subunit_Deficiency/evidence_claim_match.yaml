        context: []
      assertion_type: Biochemical
      assertion:
        name: Plasma factor XIII-B subunit antigen
        presence: DECREASED
        biomarker_term:
          preferred_term: factor XIII antigen
          term:
            id: NCIT:C112277
            label: Factor XIII Measurement
        notes: 'A secondary, not a primary, abnormality in this disease, and worth curating because it
          is a trap: FXIII-B antigen is also low in A-subunit deficiency, so a low FXIII-B does not mean
          F13B disease. The mechanism is clearance, not synthesis - the B subunit is made by hepatocytes
          independently of the A subunit, and in FXIII-A deficiency free FXIII-B2 is cleared from the
          circulation faster because there is no A2 to complex with it. Infusing recombinant FXIII-A2
          raises FXIII-B2 back up, in humans and in mice. The discriminator between A- and B-subunit disease
          is therefore the combination of both antigens plus the genotype, not FXIII-B alone.'
        cell_types:
        - preferred_term: hepatocyte (source of the FXIII-B subunit)
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: These data show FXIII-A2 prevents FXIII-B2 loss from circulation and establish the mechanism
          underlying FXIII-B2 behavior in FXIII-A deficiency and during rFXIII-A2 therapy.
        supports: SUPPORT
