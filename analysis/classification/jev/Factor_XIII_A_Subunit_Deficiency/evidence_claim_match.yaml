      assertion_type: Pathophysiology
      assertion:
        name: Failure of Fibrin Gamma- and Alpha-Chain Cross-Linking
        biological_scale: MOLECULAR
        description: Without FXIIIa, fibrin gamma-chains are not dimerised and alpha-chains are not multimerised
          into high-molecular-weight polymers. Gamma-chain dimerization is the reaction whose product
          is absent in plasma from FXIII-A null animals, and alpha-chain cross-linking is the one that
          governs whether a contracting clot retains red cells. The cross-links are what give fibrin tensile
          strength and viscoelastic stability, so the polymer that forms is mechanically inferior rather
          than absent.
        biological_processes:
        - preferred_term: fibrin gamma- and alpha-chain isopeptide cross-linking
          modifier: DECREASED
          term:
            id: GO:0018149
            label: peptide cross-linking
      selected_evidence:
        snippet: FXIII is essential for hemostasis, its deficiency results in severe bleeding diathesis.
          FXIIIa mechanically stabilizes fibrin by cross-linking its α-, and γ-chains.
        supports: SUPPORT
