              PT, aPTT, thrombin time, fibrinogen and every individual factor assay within reference limits,
              and a clot that dissolved completely in 5 M urea. Viscoelastic testing showed both reduced
              maximum clot firmness and a markedly abnormal 45-minute lysis index at the same time, and
              both normalised as plasma and cryoprecipitate were given - which is the closest thing in
              this entry to a direct demonstration that the mechanical and fibrinolytic arms are separable
              states of one clot. Canine F13A1 encodes a 733-residue protein 88% identical to the human
              one.'
            notes: 'This is the second reported clinical case of FXIII deficiency in dogs and the first
              genetic characterisation of the disorder in a companion animal; it is not the first canine
              description, and is not curated as such. Graded MODEL_ORGANISM throughout, per CLAUDE.md:
              a veterinary observation in a non-human mammal is animal evidence however carefully the
              individual was worked up.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Accelerated Fibrinolytic Dissolution of the Hemostatic Clot
        relationship: RECAPITULATES
        fidelity: HIGH
        model_scale: TISSUE
        description: Hyperfibrinolysis measured in the same tracings as the firmness deficit, and corrected
          alongside it. The entry models these as two arms of one lesion, and this is the record in which
          both were observed together.
        limitations: The lysis indices and the firmness measure come from the same viscoelastic tracings,
          so the two arms are distinguishable here but not independently manipulated - unlike the ferret
          embolism experiments cited on the node itself, where one cross-linking reaction was blocked
          and the other left intact. The dog also received tranexamic acid alongside blood products, so
          the correction is not attributable to FXIII repletion alone.
        readouts:
        - name: Viscoelastic lysis index at 45 minutes
          target: Accelerated Fibrinolytic Dissolution of the Hemostatic Clot
          direction: RESTORED
          interpretation: Markedly abnormal at baseline and normal after replacement, which is the fibrinolytic
            arm behaving as this entry's model predicts.
      selected_evidence:
        snippet: The findings of unstable clot formation and premature clot lysis in a viscoelastic assay
          combined with complete clot dissolution in urea indicated that FXIII deficiency should be considered
          high on the differential list as the underlying cause of abnormal bleeding for this dog.
        supports: SUPPORT
