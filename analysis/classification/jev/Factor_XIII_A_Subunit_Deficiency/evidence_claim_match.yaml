            id: NCIT:C112277
            label: Factor XIII Measurement
        notes: 'Immunoreactive FXIII-A concentration, reduced in parallel with activity in the quantitative
          A-subunit defects that make up most of this disease. This is the measurement that assigns a
          patient to A-subunit rather than B-subunit deficiency. Two caveats: it is less sensitive than
          the activity assay for qualitative (dysfunctional) variants, and platelet contamination of the
          plasma artefactually raises it, because platelets carry their own FXIII-A pool - hence the platelet-poor-plasma
          requirement. NCIT has no separate A-subunit antigen term, so the generic Factor XIII Measurement
          term is bound and the subunit specificity is carried in the record name and the LOINC code.'
        reference_ranges:
        - loinc_term:
            id: LOINC:3238-3
            label: Coagulation factor XIII Ag [Units/volume] in Platelet poor plasma by Immunoassay
          unit: IU/dL
          population: Patients with congenital factor XIII deficiency
          notes: No interval is asserted. The LOINC code is recorded so the analyte is machine-identifiable;
            no reference interval was curated because none was found in a citable source during this curation,
            and the clinically actionable thresholds in this disease are activity-based rather than antigen-based.
      selected_evidence:
        snippet: In F13A1-related quantitative defects, both activity and FXIII-A antigen are reduced,
          and FXIII-B antigen may be secondarily decreased because heterotetramer formation is impaired.
