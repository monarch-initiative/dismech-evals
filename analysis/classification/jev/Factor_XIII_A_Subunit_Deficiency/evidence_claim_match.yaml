      assertion_type: Pathophysiology
      assertion:
        name: Mechanically Unstable Fibrin Clot
        biological_scale: TISSUE
        description: A clot that is present, visually adequate and mechanically inferior. Without fibrin-chain
          cross-links it has reduced tensile strength and viscoelastic stability, loses red cells during
          contraction, and fails under physiological load. Thromboelastography in FXIII-A null mice shows
          the defect directly and shows that it is corrected dose-dependently by replacing the missing
          protein. Note that standard viscoelastic testing in humans is insensitive to isolated FXIII
          deficiency, so the node is better supported by the animal and biochemical data than by bedside
          viscoelastometry.
        biological_processes:
        - preferred_term: fibrin clot mechanical stabilisation
          modifier: DECREASED
          term:
            id: GO:0072378
            label: blood coagulation, fibrin clot formation
      selected_evidence:
        snippet: Thrombelastography (TEG) experiments demonstrated impaired clot stabilization in FXIII-A
          mutant mice, replacement with human FXIII led to dose-dependent TEG normalization.
        supports: SUPPORT
