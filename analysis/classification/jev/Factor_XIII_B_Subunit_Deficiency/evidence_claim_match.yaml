      assertion_type: Discussion
      assertion:
        discussion_id: f13b_phenotype_extrapolation_gap
        kind: KNOWLEDGE_GAP
        prompt: What is the risk of intracranial haemorrhage, umbilical stump bleeding, impaired wound
          healing and recurrent pregnancy loss in biallelic F13B deficiency specifically?
        rationale: 'These are the phenotypes that define severe congenital FXIII deficiency, and the cohort
          data behind every published frequency for them is dominated by A-subunit disease, which is about
          95% of cases. This entry therefore does not carry them, and that omission is a deliberate scoping
          decision rather than an oversight: the reviews describe B-subunit disease as milder and as often
          needing only on-demand therapy, so importing A-subunit frequencies would assert a risk profile
          nobody has measured in this disease. Recorded here so that a later curator does not read the
          absence as an accident and fill it from the A-subunit literature. Closing it needs a B-subunit-specific
          case series, which with roughly eleven reported patients does not yet exist.'
        attaches_to:
        - phenotypes#
      selected_evidence:
        snippet: patients with severe FXIII-B deficiency present with a milder phenotype.
        supports: SUPPORT
