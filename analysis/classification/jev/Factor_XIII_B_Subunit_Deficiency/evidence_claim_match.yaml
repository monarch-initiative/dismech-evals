      assertion_type: Pathophysiology
      assertion:
        name: Biallelic F13B Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: Homozygous or compound heterozygous pathogenic variants in F13B, which encodes the
          B subunit of factor XIII, a protein built from ten sushi domains held together by disulphide
          bonds. Reported variants include premature-termination alleles (the AAC insertion at Tyr-80
          that is a founder allele in Italian families, and a splice-boundary deletion that is a founder
          allele in Japanese families), frameshifts, and missense variants that remove or sit next to
          a structural disulphide bond. Most of them reduce the amount of FXIII-B that leaves the cell
          rather than producing a secreted but inactive protein.
        genes:
        - preferred_term: F13B
          term:
            id: hgnc:3534
            label: F13B
        molecular_functions:
        - preferred_term: fibrinogen binding
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0070051
            label: fibrinogen binding
      selected_evidence:
        snippet: DNA sequence analysis showed that a nucleotide triplet (AAC) was inserted within the
          codon for Tyr-80 in exon III of the gene for a female proband's b subunit, resulting in the
          creation of a stop codon.
        supports: SUPPORT
    origin:
