        name: Plasma-Derived Factor XIII Concentrate
        description: Plasma-derived FXIII concentrate contains both subunits and is the replacement product
          for B-subunit deficiency. Because the phenotype is mild, patients may need it only on demand
          for bleeding or before surgery rather than as routine prophylaxis. Recombinant FXIII-A2 (catridecacog),
          the prophylactic product used for A-subunit deficiency, is not appropriate here, because it
          supplies no FXIII-B. Repeated concentrate infusion led to anti-FXIII-B alloantibodies in one
          patient with complete absence of FXIII-B, after which replacement became less effective.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
