          term:
            id: hgnc:9848
            label: RANBP2
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        association: Heterozygous missense variants in the RANBP2 leucine-rich N-terminal domain
        features: The recurrent p.Thr585Met variant (c.1880C>T, also reported as c.1754C>T on a shorter
          transcript) accounts for most families, has arisen independently and de novo several times,
          and is absent from controls. p.Thr653Ile and p.Ile656Val alter conserved residues in the same
          leucine-rich domain. A biallelic p.Thr585Met case has been reported. The variants are not found
          in isolated (sporadic, non-recurrent) ANE.
        gene_disease_validity:
        - validity_classification: MODERATE
          classified_by: CLINGEN
          external_id: CGGV:assertion_7e375774-fce0-48a2-b83d-c7814c9de23f-2024-04-02T160000.000Z
        variants:
        - name: RANBP2 p.Thr585Met
          description: Recurrent heterozygous missense variant, c.1880C>T (c.1754C>T on an alternative
            transcript numbering), found in most ANE1 families.
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: RANBP2
            term:
              id: hgnc:9848
              label: RANBP2
        - name: RANBP2 p.Thr653Ile
          description: Heterozygous missense variant (c.2085C>T) at a conserved leucine-rich-domain residue.
          gene:
            preferred_term: RANBP2
            term:
              id: hgnc:9848
              label: RANBP2
        - name: RANBP2 p.Ile656Val
          description: Heterozygous missense variant (c.2094A>G) at a conserved leucine-rich-domain residue.
          gene:
            preferred_term: RANBP2
            term:
              id: hgnc:9848
              label: RANBP2
        - name: RANBP2 p.Trp681Cys
          description: De novo heterozygous missense variant reported in an infant with recurrent ANE.
          gene:
            preferred_term: RANBP2
            term:
              id: hgnc:9848
              label: RANBP2
        - name: RANBP2 p.Glu3014Gly
          description: Heterozygous missense variant (c.9041A>G) reported in a four-generation Chinese
            ANE1 family; it lies outside the leucine-rich domain where the other recurrent variants cluster.
          gene:
            preferred_term: RANBP2
            term:
              id: hgnc:9848
              label: RANBP2
      selected_evidence:
        snippet: Patients from 9 of 15 additional kindreds with familial or recurrent ANE had the identical
