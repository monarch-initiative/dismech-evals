        description: The ANE1 variants are germline heterozygous missense substitutions in RANBP2 (Nup358);
          the recurrent ones (p.Thr585Met, p.Thr653Ile, p.Ile656Val) cluster in the N-terminal leucine-rich
          domain. RANBP2 is a large cytoplasmic-filament component of the nuclear pore complex with SUMO
          E3 ligase, nuclear transport, microtubule and mitochondrial-trafficking functions. The variant
          does not cause disease by itself; it creates a susceptibility that is expressed only during
          a febrile infection.
