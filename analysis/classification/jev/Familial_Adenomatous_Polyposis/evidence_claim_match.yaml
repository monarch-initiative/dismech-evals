    evidence_metadata:
      reference: PMID:15710876
      reference_title: Genetic basis of variation in adenoma multiplicity in ApcMin/+ Mom1S mice.
      evidence_source: MODEL_ORGANISM
      explanation: Records the failure of the leading mouse modifier candidate to transfer to humans,
        which is what leaves the human modifier question open. Note the quoted sentence comes from the
        paper's own account of prior work; the study itself attributes its 3-to-5-fold multiplicity difference
        to a locus near Apc or to structural variation on chromosome 18, not to Mom1/Pla2g2a.
