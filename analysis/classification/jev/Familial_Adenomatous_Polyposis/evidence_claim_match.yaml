        discussion_id: human_fap_polyp_burden_modifier_genes
        prompt: Which human genetic modifiers account for the variation in polyp burden and age at diagnosis
          seen among FAP patients carrying the same APC variant?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Colorectal Polyposis
        rationale: 'Mouse work established that background genotype alone changes adenoma multiplicity
          several fold at a fixed Apc mutation, so modifiers are real in principle, and intrafamilial
          variability in FAP families sharing one APC variant says they are likely real in patients. The
          human loci are unidentified. The mouse candidate that came closest, Pla2g2a at the Mom1 locus,
          did not transfer: human studies did not confirm PLA2G2A as a major modifier because the relevant
          functional polymorphism does not exist in humans. Until human modifiers are known, APC genotype
          is the only stratifier available for deciding surveillance intensity and the timing of prophylactic
          surgery, and it does not explain the observed spread.'
        proposed_experiments:
        - experiment_id: exp_fap_modifier_gwas
          name: Modifier GWAS across FAP registries stratified by APC genotype
          description: Assemble more than 500 genetically confirmed FAP patients across national polyposis
            registries, use cumulative polyp burden and age at first adenoma as quantitative phenotypes,
            and adjust for APC variant position so that the known genotype effect does not absorb the
            modifier signal.
          would_support:
          - phenotypes#Colorectal Polyposis
          supporting_outcome:
          - Replicating modifier loci reach significance for polyp burden independently of APC variant
            position, giving a stratifier that APC genotype alone does not provide.
          refuting_outcome:
          - No locus reaches significance at adequate power, indicating the residual variation is environmental,
            stochastic, or driven by rare variants that a common-variant scan cannot see.
        notes: Raised from the 2026 openscientist hypothesis-search report Gap 4. The assessment sidecar
          qualifies that report's attribution of the mouse effect to Mom1/Pla2g2a. Missing spaces in the
          quoted snippet are an artefact of the cached full text and are reproduced verbatim.
      selected_evidence:
        snippet: Unfortunately, studies in humans did not confirmPLA2G2Aas a major modifier of colorectal
          cancer risk in humans because functional polymorphic variation did not exist
        supports: SUPPORT
