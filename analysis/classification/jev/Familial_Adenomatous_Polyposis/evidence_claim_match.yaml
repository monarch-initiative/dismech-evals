    claim:
      about:
        disease:
          name: Familial Adenomatous Polyposis
          disease_term:
            preferred_term: familial adenomatous polyposis 1
            term:
              id: MONDO:0021056
              label: familial adenomatous polyposis 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: apc_beta_catenin_nuclear_localization_discordance
        prompt: Does APC inactivation invariably produce nuclear β-catenin accumulation in FAP adenomas,
          or can APC loss drive tumorigenesis with transcriptional Wnt output decoupled from β-catenin
          nuclear localization?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Wnt/β-Catenin Pathway Activation
        rationale: 'The edge from APC loss to nuclear β-catenin is the load-bearing step of the canonical
          model, and it has been reported not to hold. Bala et al. found no correlation between APC mutation
          and β-catenin nuclear localization on serial sections of the same tumour regions, and could
          not explain the discordance by KRAS status; the result reproduced in colorectal cancer cell
          lines carrying various APC mutations. The scope limit matters: those samples are early-onset
          sporadic rectal cancers, not FAP adenomas, so the gap is whether the same decoupling occurs
          in the germline-APC setting this entry models. Spatial heterogeneity of Wnt output within a
          tumour could explain part of the finding as an immunohistochemistry sampling artefact, but has
          not been shown to explain all of it. If the decoupling is real in FAP, then nuclear β-catenin
          is an unreliable pharmacodynamic readout for Wnt-directed intervention, and part of APC''s tumour-initiating
          function runs through some other output.'
        proposed_experiments:
        - experiment_id: exp_fap_acute_apc_deletion_beta_catenin_dynamics
          name: Single-cell β-catenin dynamics after acute APC deletion in FAP organoids
          description: Induce acute biallelic APC deletion with inducible Cre in patient-derived intestinal
            organoids from FAP carriers and from non-carrier controls, then track β-catenin subcellular
            localization, TCF/LEF transcriptional output, and cell fate at single-cell resolution over
            roughly two weeks. Read nuclear β-catenin by immunocytochemistry against Wnt target gene expression
            by single-cell RNA sequencing in the same cells, and score a chromosomal instability marker
            in parallel so a discordant cell can be checked for the alternative APC output.
          would_support:
          - pathophysiology#Wnt/β-Catenin Pathway Activation
          supporting_outcome:
          - APC deletion is followed in essentially every transformed cell by nuclear β-catenin accumulation
            together with matching TCF/LEF target induction, making the reported discordance an artefact
            of fixed-tissue sampling or of the sporadic rectal cancer context.
          refuting_outcome:
          - A reproducible subpopulation shows Wnt target induction without nuclear β-catenin, or transformation
            without either, identifying conditions under which the canonical APC to nuclear β-catenin
            link does not hold in cells of FAP origin.
        notes: Raised from the 2026 openscientist hypothesis-search report, whose Gap 1 flags this as
          the highest-impact challenge to the canonical model. The assessment sidecar qualifies the claim
          on scope (sporadic early-onset rectal cancer, not FAP).
      selected_evidence:
        snippet: The lack of correlation was validated in CRC cell lines harboring various APC mutations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36586069
      reference_title: 'To β or Not to β: Lack of Correlation Between APC Mutation and β-Catenin Nuclear
        Localization in Colorectal Cancer.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the discordance survives in a controlled cell-line setting rather
        than being a property of one tissue series, which is what makes it a knowledge gap rather than
        a sampling complaint.
