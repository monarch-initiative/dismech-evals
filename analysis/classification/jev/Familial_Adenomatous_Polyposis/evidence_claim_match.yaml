      assertion_type: Genetic
      assertion:
        name: APC
        gene_term:
          preferred_term: APC
          term:
            id: hgnc:583
            label: APC
        association: Germline Loss-of-Function Mutations
        inheritance:
        - name: Autosomal Dominant
        notes: 'APC (5q22.2) encodes adenomatous polyposis coli, a key component of the β-catenin destruction
          complex. Most germline mutations are truncating (nonsense, frameshift) resulting in loss of
          function. De novo mutations account for 20-30% of cases. Mutation location correlates with phenotype:
          MCR mutations (codons 1250-1464) cause classic severe FAP; 5'' mutations (before codon 157)
          and 3'' mutations (after codon 1595) cause attenuated FAP. Postzygotic APC mosaicism is a further
          route to the same phenotype and accounts for a substantial share of polyposis that germline
          testing leaves unexplained; detection depends on the sequencing method and on the tissue assayed,
          with multiple colorectal adenomas more informative than leukocyte DNA.'
      selected_evidence:
        snippet: Several lines of evidence show that germline mutations affect the functional domains
          of the APC gene that are responsible for interactions of the transcript with β-catenin, whereas
          somatic second mutations involve the downstream region of the gene.
        supports: SUPPORT
