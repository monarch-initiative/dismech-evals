            term:
              id: MONDO:0021056
              label: familial adenomatous polyposis 1
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_apc_wnt_betacatenin_polyp_carcinoma_model
        hypothesis_label: Canonical APC / Wnt-β-Catenin / Polyp-to-Carcinoma Model
        status: CANONICAL
        description: Familial adenomatous polyposis (FAP) is caused by germline heterozygous loss-of-function
          variants in APC on 5q22.2 encoding the adenomatous polyposis coli tumor suppressor. APC normally
          serves as a scaffold in the β-catenin destruction complex (with Axin, GSK-3β, CK1) targeting
          β-catenin for ubiquitin-proteasomal degradation. Biallelic APC inactivation (germline + somatic
          'second hit') stabilizes cytoplasmic β-catenin, allowing nuclear translocation and TCF/LEF-dependent
          transcription of pro-proliferative targets (MYC, CCND1, LGR5), initiating colorectal adenoma
          formation throughout the colon. Sequential acquisition of KRAS, TP53, and SMAD4 mutations follows
          the Vogelstein adenoma-carcinoma progression model, producing virtually 100% CRC risk by age
          40 in classic FAP without intervention. Prophylactic colectomy is the standard of care; mouse
          Apc^Min/+ models recapitulate intestinal polyposis and validate the Wnt-axis as the canonical
          initiating lesion.
        notes: 'Retained as CANONICAL with mechanistic qualifications. The 2026 openscientist hypothesis-search
          report (kb/hypotheses/Familial_Adenomatous_Polyposis/canonical_apc_wnt_betacatenin_polyp_carcinoma_model)
          finds SUPPORTED. The core APC-loss → β-catenin stabilization → TCF/LEF-dependent proliferation
          → adenoma cascade is validated by biochemical reconstitution, near-100% untreated lifetime CRC
          risk, Apc^Min/+ mouse polyposis, and convergent APC/CTNNB1 mutations in extracolonic tumors
          (desmoids, thyroid, salivary). Three qualifications: (1) the ''just-right'' signaling model
          — second APC hits are non-randomly selected to produce OPTIMAL (not maximal) Wnt activation;
          truncating mutations after the SAMP-repeats are favored, producing intermediate β-catenin levels
          that maximize transformation; (2) APC has Wnt-independent tumor-suppressive functions including
          chromosomal instability regulation, DNA replication control, and cytoskeletal/microtubule regulation,
          explaining why complete APC loss often differs from CTNNB1 activation; (3) some colorectal cancer
          contexts show lack of correlation between APC mutation and β-catenin nuclear localization, challenging
          the assumption that Wnt activation is the sole mechanistic output of APC loss (documented in
          early-onset sporadic rectal cancer rather than in FAP adenomas; see the discussions entry).
          ClinGen''s Hereditary Cancer Gene Curation Expert Panel classifies the APC gene-disease relationship
          with classic or attenuated FAP as Definitive; the separate ClinGen InSiGHT Variant Curation
          Expert Panel maintains APC-specific ACMG/AMP criteria for classifying individual germline variants.
          These are different products and the second does not establish the first.'
      selected_evidence:
        snippet: It is characterized by the presence of hundreds of colonic polyps, which have a high
          tendency to undergo malignant transformation.
        supports: SUPPORT
