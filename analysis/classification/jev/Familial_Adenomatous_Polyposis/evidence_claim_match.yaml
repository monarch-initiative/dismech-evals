          risk, Apc^Min/+ mouse polyposis, and convergent APC/CTNNB1 mutations in extracolonic tumors
          (desmoids, thyroid, salivary). Three qualifications: (1) the ''just-right'' signaling model
          — second APC hits are non-randomly selected to produce OPTIMAL (not maximal) Wnt activation;
          truncating mutations after the SAMP-repeats are favored, producing intermediate β-catenin levels
          that maximize transformation; (2) APC has Wnt-independent tumor-suppressive functions including
          chromosomal instability regulation, DNA replication control, and cytoskeletal/microtubule regulation,
          explaining why complete APC loss often differs from CTNNB1 activation; (3) some colorectal cancer
          contexts show lack of correlation between APC mutation and β-catenin nuclear localization, challenging
          the assumption that Wnt activation is the sole mechanistic output of APC loss (documented in
          early-onset sporadic rectal cancer rather than in FAP adenomas; see the discussions entry).
          ClinGen''s Hereditary Cancer Gene Curation Expert Panel classifies the APC gene-disease relationship
          with classic or attenuated FAP as Definitive; the separate ClinGen InSiGHT Variant Curation
          Expert Panel maintains APC-specific ACMG/AMP criteria for classifying individual germline variants.
          These are different products and the second does not establish the first.'
      selected_evidence:
        snippet: Here, we provide evidence for a surprising lack of correlation between APC mutation and
          β-catenin nuclear localization in early-onset sporadic rectal cancer samples.
        supports: REFUTE
