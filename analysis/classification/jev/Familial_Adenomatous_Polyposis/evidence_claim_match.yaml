      assertion_type: Pathophysiology
      assertion:
        name: APC-Driven Chromosomal Instability
        biological_scale: CELLULAR
        description: APC accumulates at the kinetochore during mitosis and is required for efficient microtubule
          attachment. Truncating alleles that remove the APC sequences C-terminal to the β-catenin regulatory
          domain produce chromosome and spindle aberrations, so APC loss drives aneuploidy through a route
          that does not pass through β-catenin. This parallel arm is thought to accelerate the accumulation
          of the additional driver lesions required for adenomas to become carcinomas, and it is the reason
          Wnt-directed intervention alone may not capture the whole consequence of APC loss.
        cell_types:
        - preferred_term: intestinal epithelial cell
          term:
            id: CL:0002563
            label: intestinal epithelial cell
        biological_processes:
        - preferred_term: chromosome segregation
          modifier: ABNORMAL
          term:
            id: GO:0007059
            label: chromosome segregation
        notes: Added from the 2026 openscientist hypothesis-search assessment as the Wnt-independent arm
          of APC tumour suppression. Evidence is mouse embryonic stem cells and human colorectal cancer
          cell lines; the relative contribution of this arm versus Wnt deregulation to human FAP tumorigenesis
          has not been separated experimentally, which is recorded as a knowledge gap in the discussions
          section.
      selected_evidence:
        snippet: Here we show that Apc mutant ES cells display extensive chromosome and spindle aberrations,
          providing genetic evidence for a role of APC in chromosome segregation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
