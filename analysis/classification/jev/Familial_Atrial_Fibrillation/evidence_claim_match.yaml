        association: Reported in a single adrenergic AF proband
        relationship_type: UNKNOWN
        variant_origin: GERMLINE
        subtype: ABCC9-related
        features: A missense substitution, Thr1547Ile, in the KATP channel regulatory subunit SUR2A, reported
          in one woman with activity-precipitated paroxysmal AF originating from the vein of Marshall.
        gene_term:
          preferred_term: ABCC9
          term:
            id: hgnc:60
            label: ABCC9
        notes: 'Graded UNKNOWN rather than CAUSATIVE because the human evidence is a single proband. The
          report is a clinical case with supporting molecular phenotyping and a targeted knockout, not
          a family with segregation, and no independent AF family was found when PubMed was searched for
          ABCC9 with atrial fibrillation, and for SUR2A with KATP channel and atrial fibrillation, in
          September 2026: those searches returned this case report and reviews citing it, and no independent
          family series. MONDO nevertheless lists the gene as the causal gene of atrial fibrillation,
          familial, 12, which is what this record reconciles against; the disagreement is about strength
          of evidence rather than about whether the observation exists.

          No inheritance block is recorded here on purpose: a single proband does not establish a mode
          of inheritance.'
      selected_evidence:
        snippet: K(ATP) channelopathy caused by missense mutation (Thr1547Ile) of the ABCC9 gene conferring
