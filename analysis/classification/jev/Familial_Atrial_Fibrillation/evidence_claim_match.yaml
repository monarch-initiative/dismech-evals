      explanation: Establishes the gain-of-function direction that defines this subtype, and distinguishes
        it from the loss-of-function KCNQ1 variants of long QT syndrome, which is why the same gene supports
        two separate diseases. The quoted result is heterologous-expression electrophysiology in COS cells,
        not a human observation, so it is graded IN_VITRO.
