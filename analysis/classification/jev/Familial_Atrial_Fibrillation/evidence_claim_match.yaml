              The reported Thr1547Ile variant impairs ADP-dependent channel opening while leaving ATP-induced
              inhibition intact, so the defect is a loss of stress-responsive KATP activation rather than
              a gain of function. The index report is a single patient whose relatives declined testing,
              so no co-segregation was established and the "familial" label here rests on the MONDO class
              rather than on demonstrated inheritance.
