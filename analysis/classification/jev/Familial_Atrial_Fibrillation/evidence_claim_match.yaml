        snippet: We identified 2 nonsynonymous variants in SCN1B (resulting in R85H, D153N) and 2 in SCN2B
          (R28Q, R28W) in patients with AF. These occur at residues highly conserved across mammals and
          were absent in control subjects.
        supports: SUPPORT
