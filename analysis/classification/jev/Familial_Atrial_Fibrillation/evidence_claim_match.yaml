      assertion_type: Pathophysiology
      assertion:
        name: Shortened Atrial Action Potential and Refractoriness
        conforms_to: cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling
        description: Enhanced atrial repolarizing current shortens the atrial action potential duration
          and effective refractory period. A shorter refractory period reduces the wavelength of atrial
          reentry, allowing more simultaneous reentrant wavelets to be accommodated within the atria.
          KCNQ1, KCNE2 and KCNJ2 reach this node by gain of function; KCNA5 does not, and is modelled
          on the opposite route - loss of IKur lengthens rather than shortens the atrial action potential
          and produces early afterdepolarizations instead.
        genes:
        - preferred_term: KCNQ1
          term:
            id: hgnc:6294
            label: KCNQ1
        - preferred_term: KCNE2
          term:
            id: hgnc:6242
            label: KCNE2
        - preferred_term: KCNJ2
          term:
            id: hgnc:6263
            label: KCNJ2
        cell_types:
        - preferred_term: Atrial Cardiomyocyte
          term:
            id: CL:0002129
            label: regular atrial cardiac myocyte
        biological_processes:
        - preferred_term: Atrial cardiac muscle cell action potential
          term:
            id: GO:0086014
            label: atrial cardiac muscle cell action potential
          modifier: DECREASED
        - preferred_term: Membrane repolarization during cardiac action potential
          term:
            id: GO:0086013
            label: membrane repolarization during cardiac muscle cell action potential
          modifier: INCREASED
      selected_evidence:
        snippet: Thus, the S140G mutation is likely to initiate and maintain AF by reducing action potential
          duration and effective refractory period in atrial myocytes.
        supports: SUPPORT
