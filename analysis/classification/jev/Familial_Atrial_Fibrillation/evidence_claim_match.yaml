                label: atrial fibrillation, familial, 18
            description: Autosomal recessive familial AF caused by loss-of-function variants in MYL4,
              encoding the atrial-specific essential myosin light chain. Associated with early-onset AF,
              atrial myopathy, and progressive atrial cardiomyopathy. Unlike the channelopathy subtypes,
              this one is a structural atrial disease, so the entry's framing of familial AF as arising
              in structurally normal hearts does not hold here.
            genes:
            - preferred_term: MYL4
              term:
                id: hgnc:7585
                label: MYL4
          role: subtype
      assertion_type: Genetic
      assertion:
        name: MYL4 biallelic loss-of-function variant
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: MYL4-related
        features: A rare frameshift deletion, c.234delC, in the atrial-specific essential myosin light
          chain, fully penetrant for early-onset AF in the homozygous state.
        gene_term:
          preferred_term: MYL4
          term:
            id: hgnc:7585
            label: MYL4
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'MYL4 is the clearest demonstration in this entry that a monogenic AF gene need not be
          a channel: the product is the atrial-selective essential myosin light chain, and the phenotype
          is an atrial cardiomyopathy that includes sick sinus syndrome, stroke and sudden death alongside
          the arrhythmia. An independent family, reported separately, cosegregated a different MYL4 missense
          variant with atrial standstill, and knock-in and knockout rats reproduced the progressive electrical,
          contractile and fibrotic phenotype.

          It is also the only locus here found by a population approach rather than by following a family,
          which is why the penetrance statement is unusually strong for this list. No case fraction is
          recorded: the study reports the allelic frequency and a homozygote count rather than a share
          of cases, and computing one from those two numbers would not be a reported figure.'
      selected_evidence:
        snippet: We discovered a rare frameshift deletion in the myosin MYL4 gene (c.234delC) that associates
          with early-onset AF under a recessive mode of inheritance (allelic frequency = 0.58%).
        supports: SUPPORT
