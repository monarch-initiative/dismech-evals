        - path: /has_subtypes/6
          value:
            name: KCNA5-related
            display_name: KCNA5 (Kv1.5) loss-of-function familial AF
            subtype_term:
              preferred_term: KCNA5 familial atrial fibrillation
              term:
                id: MONDO:0012828
                label: atrial fibrillation, familial, 7
            description: 'Familial AF caused by loss-of-function variants in KCNA5, encoding the voltage-gated
              potassium channel Kv1.5 (ultra-rapid delayed rectifier current, IKur), which is predominantly
              expressed in atrial cardiomyocytes. Loss of IKur prolongs atrial action potential duration
              and may predispose to early afterdepolarizations and AF. This subtype runs the entry''s
              main mechanism backwards: the potassium-channel arm shortens the atrial action potential
              and this one lengthens it, so a shortened refractory period is not a necessary condition
              for familial AF.'
            genes:
            - preferred_term: KCNA5
              term:
                id: hgnc:6224
                label: KCNA5
          role: subtype
      assertion_type: Genetic
      assertion:
        name: KCNA5 loss-of-function variants
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: KCNA5-related
        features: A heterozygous nonsense variant, E375X, truncates Kv1.5 before the voltage sensor and
          pore, abolishing the atrial-selective ultrarapid delayed rectifier current IKur and acting dominant-negatively
          on the wild-type channel.
        gene_term:
          preferred_term: KCNA5
          term:
            id: hgnc:6224
            label: KCNA5
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: 'KCNA5 runs opposite to the potassium-channel subtypes above: KCNQ1, KCNE2 and KCNJ2 act
          by gain of function and shorten the atrial action potential, whereas KCNA5 loss of IKur prolongs
          it and produces early afterdepolarization and triggered activity. Both routes converge on an
          arrhythmogenic atrium, which is worth keeping visible because it means action potential shortening
          is not a necessary feature of monogenic AF.

          The channel is described by its discoverers as expressed in human atria, which is the reason
          a defect in it produces an atrial arrhythmia.'
      selected_evidence:
        snippet: The heterozygous E375X mutation, present in a familial case of atrial fibrillation and
          absent in 540 unrelated control individuals, introduced a premature stop codon disrupting the
          Kv1.5 channel protein.
        supports: SUPPORT
