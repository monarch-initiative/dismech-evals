              term:
                id: MONDO:0013100
                label: atrial fibrillation, familial, 8
            description: 'The 16q22 ZFHX3 locus. Unlike the other numbered entities listed here, this
              one did not come from family linkage: it was found by genome-wide association, and the reported
              signal is a common intronic variant with a per-allele odds ratio near 1.2. It is therefore
              a common-variant susceptibility locus sitting inside a series of otherwise Mendelian-framed
              entities, and this entry grades it SUSCEPTIBILITY rather than causative - see the ZFHX3
              genetic record and the entry notes.'
            genes:
            - preferred_term: ZFHX3
              term:
                id: hgnc:777
                label: ZFHX3
          role: subtype
      assertion_type: Genetic
      assertion:
        name: ZFHX3 common-variant susceptibility locus
        association: Common-variant association at 16q22, not a Mendelian locus
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        subtype: ATFB8-locus
        features: An intronic single-nucleotide polymorphism, rs7193343-T, in ZFHX3 on 16q22, associated
          with AF at genome-wide significance with a per-allele odds ratio of 1.21 and also with cardioembolic
          stroke.
        gene_term:
          preferred_term: ZFHX3
          term:
            id: hgnc:777
            label: ZFHX3
        notes: 'This record exists to reconcile a MONDO assertion this entry disagrees with. MONDO relates
          atrial fibrillation, familial, 8 to ZFHX3 with RO:0004003, "has material basis in germline mutation
          in" - the same relation it uses for KCNQ1 and MYL4. The underlying finding is not of that kind.
          It is a genome-wide association signal at a common intronic variant with an odds ratio of about
          1.2, discovered in 2,385 cases and 33,752 controls and replicated in Norwegian and US samples;
          no rare coding variant, no family, and no segregation is reported.

          Three further features mark it as a common-variant locus rather than a Mendelian one. The risk
          allele did not reach significance in a Han Chinese cohort, where it is also far more common
          (control frequency 0.68 against 0.14-0.20 in the European samples). The same variant associates
          with ischaemic and cardioembolic stroke, as a downstream consequence of AF. And the authors
          found no association between the variant and ZFHX3 expression in the tissues they tested, so
          even the gene assignment within the locus is by proximity rather than by demonstrated effect.

          It is retained, and bound, because the association itself is solid: it was replicated in two
          independent non-Icelandic samples in the original report, and in the same study only the previously
          known 4q25/PITX2 signal was more significant. What is wrong is the relation, not the fact.'
      selected_evidence:
        snippet: A variant in the ZFHX3 gene on chromosome 16q22, rs7193343-T, associated significantly
          with AF (odds ratio OR = 1.21, P = 1.4 x 10(-10)).
        supports: SUPPORT
