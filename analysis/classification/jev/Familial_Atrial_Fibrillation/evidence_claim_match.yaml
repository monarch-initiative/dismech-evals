        description: 'A germline (or, for GJA5, atrial-tissue-restricted somatic) variant alters an atrial
          ion channel, a gap-junction protein, or another atrial-restricted protein. The best-characterized
          variants are gain-of-function in atrial potassium channels (KCNQ1/IKs, KCNJ2/IK1, KCNE2), with
          additional families carrying GJA5 (connexin 40), NPPA, SCN5A, and loss-of-function KCNA5 (IKur)
          variants. Three further loci reach this node without a pore-forming potassium or sodium channel
          being the mutated protein: ABCC9 encodes SUR2A, the regulatory rather than pore-forming subunit
          of the KATP channel; NUP155 is a nuclear pore component; and MYL4 encodes the atrial-selective
          essential myosin light chain. The sodium channel beta subunits SCN1B and SCN2B act indirectly,
          by reducing SCN5A-mediated current.'
