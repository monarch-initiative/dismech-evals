          involved in the post-translational activation of LPL. MONDO names this class combined lipase
          deficiency. LMF1 is the rarest of the five FCS genes, reported in 1% to 2% of cases. Note that
          partial loss of LMF1 function has been reported with a multifactorial chylomicronemia phenotype
          rather than FCS, so this row is keyed on the biallelic loss-of-function presentations that were
          clinically consistent with FCS.
        subtype_term:
