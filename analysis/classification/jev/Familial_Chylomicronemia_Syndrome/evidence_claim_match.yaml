        context: []
      assertion_type: Treatment
      assertion:
        name: Very Low-Fat Diet
        description: 'A strict, lifelong very low-fat diet (<15% of energy from fat) is the cornerstone
          of FCS management, reducing chylomicron formation and lowering plasma triglycerides to mitigate
          pancreatitis risk. Total alcohol avoidance is recommended. Agents known to increase endogenous
          triglyceride concentration must be avoided, including oral estrogens, diuretics, isotretinoin,
          glucocorticoids, selective serotonin reuptake inhibitors, and beta-adrenergic blocking agents.
          Notably, fish oil (omega-3) supplements are contraindicated in FCS because they contribute to
          chylomicron levels — in contrast to other forms of hypertriglyceridemia, where omega-3 fatty
          acids are beneficial.

          '
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: dietary intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
      selected_evidence:
        snippet: Agents known to increase endogenous triglyceride concentration such as alcohol, oral
          estrogens, diuretics, isotretinoin, glucocorticoids, selective serotonin reuptake inhibitors,
          and beta-adrenergic blocking agents; fish oil supplements are contraindicated because they contribute
          to chylomicron levels.
        supports: SUPPORT
