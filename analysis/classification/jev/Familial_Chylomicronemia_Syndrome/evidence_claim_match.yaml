  3dcaf0b9391816c5daeb4dd2a73fe12524d6471241f734eb6d9c63c386f23418:
    claim:
      about:
        disease:
          name: Familial Chylomicronemia Syndrome
          disease_term:
            preferred_term: Familial Chylomicronemia Syndrome
            term:
              id: MONDO:0018637
              label: familial chylomicronemia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective LPL Maturation, Trafficking, and Activation
        description: 'Four of the five FCS genes act on lipoprotein lipase rather than encoding it. LMF1
          is an endoplasmic reticulum chaperone involved in the post-translational activation of LPL;
          GPIHBP1 is the capillary endothelial protein that attaches to LPL and carries it to the capillary
          lumen; apoC-II is one of the cofactors that regulate LPL activity; and apoA-V binding to the
          lipoprotein particle is required for normal hydrolysis of triglyceride-rich lipoproteins. Biallelic
          loss of function leaves the LPL gene intact, and measured LPL activity is nonetheless reduced
          in GPIHBP1, LMF1 and APOA5 genotypes, which is the readout that ties these genes to the lipase
          deficiency node downstream. Two processes are bound here because the four genes do not share
          one: positive regulation of lipoprotein lipase activity covers the APOC2 and APOA5 cofactor
          step and, more loosely, the LMF1 maturation step, whereas GPIHBP1 transports and anchors the
          enzyme rather than regulating its activity, which is protein localization to the cell surface.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: LMF1
          term:
            id: hgnc:14154
            label: LMF1
        - preferred_term: GPIHBP1
          term:
            id: hgnc:24945
            label: GPIHBP1
        - preferred_term: APOC2
          term:
            id: hgnc:609
            label: APOC2
        - preferred_term: APOA5
          term:
            id: hgnc:17288
            label: APOA5
        biological_processes:
        - preferred_term: positive regulation of lipoprotein lipase activity
          term:
            id: GO:0051006
            label: positive regulation of lipoprotein lipase activity
          modifier: DECREASED
        - preferred_term: localization of lipoprotein lipase to the capillary endothelial surface
          term:
            id: GO:0034394
            label: protein localization to cell surface
          modifier: DECREASED
      selected_evidence:
        snippet: genetic defects or autoantibodies affecting lipoprotein lipase (LPL), the key enzyme
          responsible for the metabolism of chylomicrons and very-low-density lipoproteins (VLDL), or
          its associated proteins, including apolipoprotein (apo) C-II, apoA-V, glycosylphosphatidylinositol-anchored
          high-density lipoprotein-binding protein 1 (GPIHBP1), and lipase maturation factor 1 (LMF1)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
