        subtype_term:
          preferred_term: familial cold autoinflammatory syndrome 2
          term:
            id: MONDO:0012724
            label: familial cold autoinflammatory syndrome 2
        genes:
        - preferred_term: NLRP12
          term:
            id: hgnc:22938
            label: NLRP12
        description: 'A cold-induced hereditary periodic fever syndrome caused by heterozygous NLRP12
          (NALP12/Monarch-1) mutations, clinically resembling FCAS1 but genetically distinct. NLRP12 mutations
          impair NF-kappaB regulation. "FCAS2" names the cold-triggered presentation of what is more broadly
          called NLRP12-associated autoinflammatory disease (NLRP12-AID). In a 17-patient paediatric NLRP12-AID
          series, described by its authors as one of the largest such cohorts, a cold trigger was present
          in only three patients, and the authors conclude that the disease affects various tissues, especially
          the musculoskeletal and gastrointestinal systems, apart from FCAS symptoms.

          '
      selected_evidence:
        snippet: we identified nonambiguous mutations in NALP12 (i.e., nonsense and splice site) in two
          families with periodic fever syndromes.
        supports: SUPPORT
