            description: 'The shared downstream phenotype on which all FCAS etiologies converge: episodic,
              cold-triggered systemic sterile inflammation. In NLRP3-driven FCAS1 this is principally
              IL-1-driven, whereas the NLRP12 (NF-kappaB dysregulation) and PLCG2 (cold-dependent leukocyte/mast-cell
              activation) etiologies act through parallel inflammatory pathways that are not strictly
              IL-1-dependent. Clinically it manifests as cold-triggered urticarial rash, low-grade fever,
              arthralgia/myalgia, and conjunctivitis; across the broader CAPS spectrum it can extend to
              sensorineural hearing loss, CNS inflammation, and AA amyloidosis.

              '
