              term:
                id: hgnc:22938
                label: NLRP12
            description: 'A cold-induced hereditary periodic fever syndrome caused by heterozygous NLRP12
              (NALP12/Monarch-1) mutations, clinically resembling FCAS1 but genetically distinct. NLRP12
              mutations impair NF-kappaB regulation. "FCAS2" names the cold-triggered presentation of
              what is more broadly called NLRP12-associated autoinflammatory disease (NLRP12-AID). In
              a 17-patient paediatric NLRP12-AID series, described by its authors as one of the largest
              such cohorts, a cold trigger was present in only three patients, and the authors conclude
              that the disease affects various tissues, especially the musculoskeletal and gastrointestinal
              systems, apart from FCAS symptoms.

              '
          role: subtype
      assertion_type: Genetic
      assertion:
        name: NLRP12
        gene_term:
          preferred_term: NLRP12
          term:
            id: hgnc:22938
            label: NLRP12
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        subtype: FCAS2
        inheritance:
        - name: Autosomal dominant
        notes: 'Heterozygous NLRP12 (NALP12) nonsense and splice-site mutations cause FCAS2, impairing
          NF-kappaB regulation. The gene-disease relationship is accepted (IUIS 2022 Table 7 lists FCAS2/NLRP12
          as an autosomal dominant gain-of-function inflammasome defect), but variant interpretation is
          not settled: a 2025 systematic review of the reported NLRP12 literature assigned 49 of the 60
          reported coding variants to the combined VUS/pathogenic/likely-pathogenic group without separating
          those categories, and reports incomplete penetrance and variable expression. Note that the review''s
          sentence does not say how many of the 49 are VUS, so no share is claimed here. ClinGen has no
          gene-disease validity curation for NLRP12: the gene-disease validity table committed in this
          repository (cache/clingen/gene_validity.csv, header "FILE CREATED: 2026-01-24") contains no
          NLRP12 row, so no ClinGen classification can be cited for or against this relationship.

          '
      selected_evidence:
        snippet: Overall, these data identify a group of HPFs defined by molecular defects in NALP12,
          opening up new ways to manage these disorders.
        supports: SUPPORT
