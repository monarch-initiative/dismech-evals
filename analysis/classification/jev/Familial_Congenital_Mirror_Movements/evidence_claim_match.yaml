        description: Diagnosis rests on recognizing involuntary mirrored movements during unilateral voluntary
          actions (especially of the hands/fingers), with onset in infancy/early childhood, persistence
          beyond the age at which physiological mirror movements resolve, and a supportive family history.
          Severity is graded with the Woods and Teuber classification or the Cohen Mirror Movement Scale.
        diagnosis_term:
          preferred_term: physical examination
          term:
            id: NCIT:C20989
            label: Physical Examination
      selected_evidence:
        snippet: 'DIAGNOSIS/TESTING: The diagnosis of CMM is established in a proband with suggestive
          clinical findings and occasionally by identification of a heterozygous pathogenic variant in
          DCC, NTN1, or RAD51 by molecular genetic testing.'
