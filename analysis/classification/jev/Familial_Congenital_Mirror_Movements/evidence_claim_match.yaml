          are the most common cause of CMM and account for most solved cases; penetrance is incomplete
          (~68%, higher in males). Variants in the extracellular domain can disrupt netrin-1 binding or
          cause truncation/haploinsufficiency, while the cytoplasmic-tail R1343H variant disrupts the
