        name: Callosal commissural development failure
        description: DCC/netrin-1 signaling is required for midline guidance of commissural axons, including
          corpus callosum development. In DCC-related CMM, this developmental role explains the callosal
          agenesis/dysgenesis and broader neurodevelopmental phenotype seen in the CMM1 subtype.
        subtypes:
        - CMM1
        locations:
