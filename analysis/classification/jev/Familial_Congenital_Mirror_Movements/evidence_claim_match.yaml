        description: Netrin-1-DCC guidance requires downstream cytoskeletal effectors. DCC signals through
          a conserved WIRS motif to the WAVE regulatory complex (WRC) to drive actin dynamics, and through
          RhoGEF effectors (ARHGEF7/GIT1) that activate Rac1/Cdc42, inhibit Arf1, and increase cell-surface
          DCC. CMM-associated variants that disrupt these effector interactions impair netrin-1-DCC axon
          guidance even when ligand binding is intact.
