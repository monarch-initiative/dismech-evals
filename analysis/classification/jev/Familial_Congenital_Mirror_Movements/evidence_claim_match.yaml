      assertion_type: Subtype
      assertion:
        name: CMM3
        display_name: CMM3 (DNAL4)
        description: A rare recessive form of CMM identified in a large consanguineous Pakistani family
          with autosomal recessive inheritance, caused by a homozygous splice site mutation in DNAL4 (dynein
          axonemal light chain 4) on chromosome 22q13.1 that leads to skipping of exon 3. Affected individuals
          lack features of primary ciliary dyskinesia, situs inversus, or defective sperm.
      selected_evidence:
        snippet: Whole exome sequencing was employed, and identified a splice site mutation in the dynein
          axonemal light chain 4 gene, DNAL4.
        supports: SUPPORT
