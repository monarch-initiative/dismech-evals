      assertion_type: Pathophysiology
      assertion:
        name: Defective actin-cytoskeletal effector signaling downstream of DCC
        description: Netrin-1-DCC guidance requires downstream cytoskeletal effectors. DCC signals through
          a conserved WIRS motif to the WAVE regulatory complex (WRC) to drive actin dynamics, and through
          RhoGEF effectors (ARHGEF7/GIT1) that activate Rac1/Cdc42, inhibit Arf1, and increase cell-surface
          DCC. CMM-associated variants that disrupt these effector interactions impair netrin-1-DCC axon
          guidance even when ligand binding is intact.
        genes:
        - preferred_term: ARHGEF7
          term:
            id: hgnc:15607
            label: ARHGEF7
        - preferred_term: DCC
          term:
            id: hgnc:2701
            label: DCC
        molecular_functions:
        - preferred_term: guanyl-nucleotide exchange factor activity
          modifier: DECREASED
          term:
            id: GO:0005085
            label: guanyl-nucleotide exchange factor activity
        cell_types:
        - preferred_term: Commissural / pyramidal projection neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: Actin cytoskeleton organization
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
          modifier: ABNORMAL
        - preferred_term: Regulation of small GTPase mediated signal transduction
          term:
            id: GO:0051056
            label: regulation of small GTPase mediated signal transduction
          modifier: DYSREGULATED
      selected_evidence:
        snippet: The CMM-associated R1343H variant of DCC, which altered the WIRS motif, prevented the
          DCC-WRC interaction and impaired axon guidance in cultured commissural neurons and in Drosophila.
        supports: SUPPORT
