        cell_types:
        - preferred_term: Commissural / pyramidal projection neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: Actin cytoskeleton organization
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
          modifier: ABNORMAL
        - preferred_term: Regulation of small GTPase mediated signal transduction
          term:
            id: GO:0051056
            label: regulation of small GTPase mediated signal transduction
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Arhgef7/Git1 activates Rac1 and Cdc42 and inhibits Arf1 downstream of Netrin-1. Furthermore,
          Arhgef7/Git1, via Arf1, mediates the Netrin-1-induced increase in cell surface Dcc.
