            display_name: CMM1 (DCC, MRMV1)
            description: The most common genetic form of CMM, caused by heterozygous (monoallelic) variants
              in DCC, the gene encoding the netrin-1 receptor. DCC accounts for the majority of solved
              CMM cases. Variants impair netrin-1-DCC attractive signaling required for commissural and
              corticospinal midline crossing. Biallelic loss-of-function DCC variants cause the more severe
              allelic developmental split-brain syndrome with corpus callosum agenesis.
          role: subtype
