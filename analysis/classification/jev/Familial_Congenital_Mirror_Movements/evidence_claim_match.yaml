      assertion:
        name: Netrin-1/DCC axon-guidance failure of midline crossing
        description: Pathogenic variants in netrin-1/DCC pathway genes impair attractive axon-guidance
          signaling required for commissural and corticospinal axons to cross the midline during development.
          Netrin-1 (NTN1), a secreted guidance cue, binds its receptor DCC to attract commissural axons
          to the midline. NTN1 mutations cause intracellular retention of netrin-1 (loss of secreted function),
          and DCC variants disrupt netrin-1 binding or downstream signaling, so the attractive guidance
          program fails.
        genes:
        - preferred_term: DCC
          term:
            id: hgnc:2701
            label: DCC
        - preferred_term: NTN1
          term:
            id: hgnc:8029
