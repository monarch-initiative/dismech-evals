      assertion_type: Pathophysiology
      assertion:
        name: Netrin-1/DCC axon-guidance failure of midline crossing
        description: Pathogenic variants in netrin-1/DCC pathway genes impair attractive axon-guidance
          signaling required for commissural and corticospinal axons to cross the midline during development.
          Netrin-1 (NTN1), a secreted guidance cue, binds its receptor DCC to attract commissural axons
          to the midline. NTN1 mutations cause intracellular retention of netrin-1 (loss of secreted function),
          and DCC variants disrupt netrin-1 binding or downstream signaling, so the attractive guidance
          program fails.
        cell_types:
        - preferred_term: Commissural / pyramidal projection neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        - preferred_term: Upper motor neuron (corticospinal projection)
          term:
            id: CL:0008048
            label: upper motor neuron
        - preferred_term: Radial glial cell (netrin-1 transport)
          term:
            id: CL:0000681
            label: radial glial cell
        biological_processes:
        - preferred_term: Netrin-activated signaling pathway
          term:
            id: GO:0038007
            label: netrin-activated signaling pathway
          modifier: DECREASED
        - preferred_term: Commissural neuron axon guidance
          term:
            id: GO:0071679
            label: commissural neuron axon guidance
          modifier: ABNORMAL
        - preferred_term: Axon guidance
          term:
            id: GO:0007411
            label: axon guidance
          modifier: ABNORMAL
      selected_evidence:
        snippet: When expressed in HEK293 or stable HeLa cells, the 3 mutated netrin-1 proteins were almost
          exclusively detected in the intracellular compartment, contrary to WT netrin-1, which is detected
          in both intracellular and extracellular compartments.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28945198
      reference_title: Mutations in the netrin-1 gene cause congenital mirror movements.
      evidence_source: IN_VITRO
      explanation: Shows that CMM-causing NTN1 mutations cause intracellular retention of netrin-1, indicating
        loss of secreted guidance-cue function.
