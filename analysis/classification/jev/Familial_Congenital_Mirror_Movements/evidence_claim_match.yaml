      assertion_type: Treatment
      assertion:
        name: Supportive and rehabilitative care
        description: No disease-modifying therapy is established. Management is supportive and function-oriented,
          including adaptation of the school environment (extra examination time and limiting the amount
          of handwriting), avoiding stigmatization of affected children and adolescents, career counseling
          to avoid professions requiring complex bimanual movements or extensive handwriting, standard
          therapy for any concomitant neurocognitive issues, and avoidance of sustained or repetitive
          bimanual hand activity to reduce upper-limb pain or discomfort.
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: 'MANAGEMENT: Treatment of manifestations: Adaptation of the school environment (e.g.,
          allocation of extra time during examinations and limitation of the amount of handwriting) is
          recommended. Stigmatizing children and adolescents should be avoided to assure that educational
          opportunities are not lost as a result of mirror movements. Adolescents and young adults should
          be encouraged to consider a profession that does not require complex bimanual movements, repetitive
          or sustained hand movements, or extensive handwriting. Standard therapy for any neurocognitive
          issues is recommended. Agents/circumstances to avoid: Complex bimanual movements or sustained/repetitive
          hand activity in order to reduce pain or discomfort in the upper limbs.'
        supports: SUPPORT
