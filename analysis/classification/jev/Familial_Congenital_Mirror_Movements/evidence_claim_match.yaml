        description: Homozygous splice-site loss-of-function variants in DNAL4 (dynein axonemal light
          chain 4) are proposed to impair the cytoplasmic dynein complex required for netrin-1-directed
          retrograde transport in commissural neurons, potentially disrupting cross-brain midline axon
          wiring in autosomal recessive CMM3.
        subtypes:
