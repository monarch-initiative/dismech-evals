            term:
              id: MONDO:0011732
              label: familial digital arthropathy-brachydactyly
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Thiemann disease
        description: A non-inflammatory digital arthropathy of adolescence with substantial clinical and
          radiological overlap with FDAB and no causative gene identified. It begins at the proximal interphalangeal
          joints and the middle phalangeal bases, whereas FDAB begins distally with the middle phalangeal
          heads as the primary site; radial deviation and brachydactyly favour FDAB. One reported father-and-son
          pair referred as Thiemann disease carried a TRPV4 variant previously reported in FDAB, raising
          the possibility that the two labels describe one entity.
        distinguishing_features:
        - Thiemann disease starts at the proximal interphalangeal joints and the middle phalangeal bases;
          FDAB starts at the distal joints with the middle phalangeal heads as the primary site of change
        - Radial deviation of the fingers has been described only in FDAB
        - More extensive joint involvement and brachydactyly are expected in FDAB
        - No causative gene has been identified for Thiemann disease, so a TRPV4 pathogenic variant favours
          FDAB
      selected_evidence:
        snippet: Although more extensive joint involvement, a distal hand joint preponderance and brachydactyly
          are expected in FDAB, there are striking clinical and radiological similarities between the
          two entities.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
