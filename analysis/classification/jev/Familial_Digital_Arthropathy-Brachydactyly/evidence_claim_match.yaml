      assertion:
        discussion_id: disc_fdab_thiemann_identity
        prompt: Are familial digital arthropathy-brachydactyly and Thiemann disease one entity or two?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - phenotypes#Non-Inflammatory Digital Arthropathy
        - differential_diagnoses#Thiemann disease
        rationale: A father and son referred with a diagnosis of Thiemann disease carried a heterozygous
          TRPV4 variant previously reported to cause FDAB, and a review of nineteen published Thiemann
          cases found five whose clinical and radiological findings also fit FDAB. The authors propose
          the two labels may be phenotypic variability of one entity. It remains unresolved because no
          DNA could be obtained from any historical Thiemann case, so the hypothesis has not been tested
          against the population it would reclassify.
      selected_evidence:
        snippet: Despite many attempts to identify other reported patients affected by Thiemann disease,
          we were not able to procure DNA from any of the cases to verify our findings.
        supports: SUPPORT
