              label: familial digital arthropathy-brachydactyly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_fdab_follistatin_divergence
        prompt: Why does FDAB produce a joint-restricted osteoarthropathy rather than the growth-plate
          dysplasia other TRPV4 alleles cause?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Articular Cartilage Homeostasis
        - pathophysiology#Subchondral Destruction of the Phalangeal, Metacarpal and Metatarsal Heads
        rationale: 'The TRPV4 skeletal dysplasias act on growth-plate chondrocytes through calcium-dependent
          upregulation of follistatin, which inhibits BMP signaling and slows endochondral ossification.
          When an FDAB (arthropathy) allele was put through the same chondrocyte assay it left follistatin
          essentially unchanged, while three dysplasia alleles raised it two- to 2.3-fold. That single
          negative result is the clearest published evidence that FDAB reaches cartilage failure by a
          different route, and it fits the clinical picture: articular rather than growth-plate cartilage,
          normal stature, and a skeleton otherwise spared. The route FDAB does take is not established
          - the entry models it as failure of articular cartilage homeostasis on the strength of the gene-discovery
          paper''s own interpretation, not on a demonstrated downstream pathway.'
      selected_evidence:
        snippet: FST was significantly up-regulated in primary chondrocytes transfected with 3 different
          dysplasia-causing TRPV4 mutations (2- to 2.3-fold), but was not affected by an arthropathy mutation
          (1.1-fold).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24577120
      reference_title: 'Follistatin in chondrocytes: the link between TRPV4 channelopathies and skeletal
        malformations.'
      evidence_source: IN_VITRO
      explanation: The negative result for the arthropathy allele set against positive results for three
        dysplasia alleles in the same assay.
