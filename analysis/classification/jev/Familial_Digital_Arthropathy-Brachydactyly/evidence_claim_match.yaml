  0639d689b8f8995607ddf17abcdc465251e556a7d1d70ee3a2769cdd7fd96a52:
    claim:
      about:
        disease:
          name: Familial Digital Arthropathy-Brachydactyly
          disease_term:
            preferred_term: familial digital arthropathy-brachydactyly
            term:
              id: MONDO:0011732
              label: familial digital arthropathy-brachydactyly
        context: []
      assertion_type: Genetic
      assertion:
        name: TRPV4
        association: Causative
        gene_term:
          preferred_term: TRPV4
          term:
            id: hgnc:18083
            label: TRPV4
        notes: All reported FDAB alleles are heterozygous missense substitutions in the intracellular
          ankyrin-repeat domain at residues 270-273. A later report identified a heterozygous TRPV4 variant
          (c.809G>T) in a father and son referred with a diagnosis of Thiemann disease, and states the
          identical variant had previously been reported to cause FDAB. TRPV4 variants outside this domain
          cause the skeletal dysplasias (the recurrent R594 and P799 hotspots) and the TRPV4 peripheral
          neuropathies, so the ankyrin-repeat-domain cluster is the genotypic signature that separates
          FDAB within the allelic series.
        variants:
        - name: p.Gly270Val
          description: Heterozygous missense substitution in the intracellular ankyrin-repeat domain of
            TRPV4, one of the three FDAB alleles identified in the gene-discovery study.
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: TRPV4
            term:
              id: hgnc:18083
              label: TRPV4
        - name: p.Arg271Pro
          description: Heterozygous missense substitution in the intracellular ankyrin-repeat domain of
            TRPV4, one of the three FDAB alleles identified in the gene-discovery study. Arg271 is a charged
            residue, which is relevant to the unresolved question of whether the FDAB alleles gain or
            lose channel function.
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: TRPV4
            term:
              id: hgnc:18083
              label: TRPV4
        - name: p.Phe273Leu
          description: Heterozygous missense substitution in the intracellular ankyrin-repeat domain of
            TRPV4, one of the three FDAB alleles identified in the gene-discovery study.
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: TRPV4
            term:
              id: hgnc:18083
              label: TRPV4
        - name: c.809G>T
          description: A heterozygous TRPV4 coding variant found in a father and son referred with a diagnosis
            of Thiemann disease. The reporting authors state the identical variant had previously been
            reported to cause FDAB; its protein-level identity with one of the three ankyrin-repeat-domain
            alleles is not asserted here beyond what that report says.
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: TRPV4
            term:
              id: hgnc:18083
              label: TRPV4
      selected_evidence:
        snippet: Here we show in three unrelated families that FDAB is caused by mutations encoding p.Gly270Val,
          p.Arg271Pro and p.Phe273Leu substitutions in the intracellular ankyrin-repeat domain of the
          cation channel TRPV4.
        supports: SUPPORT
