        context:
        - path: /pathophysiology/0
          value:
            name: TRPV4 Ankyrin Repeat Domain Missense Variants
            description: FDAB is caused by heterozygous missense substitutions clustered in the intracellular
              ankyrin-repeat domain of TRPV4 at residues 270-273 (p.Gly270Val, p.Arg271Pro, p.Phe273Leu).
              This is a different part of the protein from the pore-region and C-terminal residues carrying
              the recurrent skeletal-dysplasia hotspots, and the restriction of FDAB to the digital joints
              tracks with that positional difference.
            biological_scale: MOLECULAR
            genetic_context:
              gene:
                preferred_term: TRPV4
                term:
                  id: hgnc:18083
                  label: TRPV4
              allele_type: missense
              zygosity: HETEROZYGOUS
              variant_origin: GERMLINE
              functional_impact_category: LOSS_OF_FUNCTION
              description: 'Graded as loss of function on the strength of the only study that assayed
                the FDAB alleles themselves, which reported poor cell-surface localization and reduced
                agonist-evoked calcium influx for all three. This grading is contested: later structure-function
                work treats pathogenic TRPV4 variants as a class that gains channel function and is cytotoxic.
                See the discussion disc_fdab_channel_direction.'
            molecular_functions:
            - preferred_term: TRPV4 calcium channel activity
              term:
                id: GO:0005262
                label: calcium channel activity
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired TRPV4 Cell-Surface Trafficking
        causal_link_type: DIRECT
        description: The mutant channel proteins are poorly delivered to the plasma membrane in a heterologous
          expression system.
      selected_evidence:
        snippet: Functional testing of mutant TRPV4 in HEK-293 cells showed that the mutant proteins have
          poor cell-surface localization.
        supports: SUPPORT
    origin:
