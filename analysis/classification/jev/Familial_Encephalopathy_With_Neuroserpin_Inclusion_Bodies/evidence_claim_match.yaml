      assertion:
        name: SERPINI1
        gene_term:
          preferred_term: SERPINI1
          term:
            id: hgnc:8943
            label: SERPINI1
        relationship_type: CAUSATIVE
        notes: SERPINI1 encodes neuroserpin, a neuron-specific serine protease inhibitor of tissue plasminogen
          activator. Pathogenic variants are heterozygous missense changes in the shutter/breach region
          that destabilise the fold; disease onset and severity track the variant's polymerization rate
          (S49P/Syracuse mildest, G392E most severe).
        variants:
        - name: S49P (Syracuse)
          description: The least destabilising variant; presents as presenile dementia after the fifth
            decade.
        - name: S52R (Portland)
          description: A more destabilising shutter variant with earlier onset and progressive myoclonus
            epilepsy with a frontal syndrome.
        - name: G392E
          description: The most destabilising variant; severe childhood/adolescent progressive myoclonus
            epilepsy, and can arise de novo.
        - name: H338R
          description: A shutter-region neuroserpin variant.
      selected_evidence:
        snippet: cosegregation of point mutations in the neuroserpin gene
        supports: SUPPORT
