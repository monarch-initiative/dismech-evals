      assertion_type: HistopathologyFinding
      assertion:
        name: Reduced intraepidermal nerve fibre density with unmyelinated axon degeneration
        description: 'Skin biopsy in some patients shows reduced intraepidermal nerve fibre density and
          vacuolar degeneration of unmyelinated axons - a small-fibre neuropathy. This is the finding
          that qualifies the otherwise-true statement that investigation in this disease is normal: routine
          studies interrogate large fibres, and the lesion is in the small ones. It also matters for prognosis,
          since degeneration of the fibres carrying the pain has been proposed as a mechanism for the
          age-dependent remission.'
        finding_term:
          preferred_term: reduced intraepidermal nerve fibre density
        notes: Present in some patients rather than all, and the source does not report a frequency.
      selected_evidence:
        snippet: Skin biopsies in some FEPS3 patients have revealed different degrees of reduction of
          intraepidermal nerve fiber density and vacuolar degeneration of unmyelinated axons, indicating
          small-fiber neuropathy
        supports: SUPPORT
