              label: familial episodic pain syndrome with predominantly lower limb involvement
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: age_dependent_remission_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do episodes attenuate spontaneously around adolescence when the causal variant is
          present for life?
        attaches_to:
        - progression#Spontaneous attenuation around adolescence
        - pathophysiology#Nociceptor Hyperexcitability with Reduced Firing Threshold
        rationale: 'The remission is the most clinically important fact about this disease - it is why
          the prognosis is benign - and no mechanism has been demonstrated. The germline variant does
          not change, so the attenuation must come from something acquired or developmental: changing
          NaV1.9 expression, changing nociceptor properties, or changing central processing. A fourth
          candidate is proposed in the literature and is the most uncomfortable one, because it makes
          the good news and the bad news the same event: long-term NaV1.9 dysfunction may itself degenerate
          the unmyelinated fibres, so pain could remit because the fibres carrying it are being lost.
          That would tie this gap directly to the small-fibre histopathology curated in this entry. It
          is offered speculatively by its authors and has not been measured across the relevant age range
          in patients, nor in the knock-in mice, which are studied at six to eight weeks.'
      selected_evidence:
        snippet: Affected participants were characterized by infantile recurrent pain episodes, with spontaneous
          mitigation around adolescence
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
