  8097e72ab0b29bd94cf37c0e69eee3876b960473dd049d1a8f0e912b2050df01:
    claim:
      about:
        disease:
          name: Familial_Episodic_Pain_Syndrome_With_Predominantly_Lower_Limb_Involvement
          disease_term:
            preferred_term: familial episodic pain syndrome with predominantly lower limb involvement
            term:
              id: MONDO:0014247
              label: familial episodic pain syndrome with predominantly lower limb involvement
        context: []
      assertion_type: Genetic
      assertion:
        name: SCN11A
        gene_term:
          preferred_term: SCN11A
          term:
            id: hgnc:10583
            label: SCN11A
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: p.Arg222His
          description: The most frequently reported allele and a founder mutation in the Tohoku region
            of Japan, seen in seven of forty-eight families in the largest series.
          functional_effects:
          - function: NaV1.9 voltage-gated sodium channel gating
            description: Gain of function.
        - name: p.Arg222Ser
          description: The second allele identified in the founding series, and the one modelled as a
            knock-in mouse.
          functional_effects:
          - function: NaV1.9 voltage-gated sodium channel gating
            description: Gain of function, demonstrated in a knock-in mouse.
        - name: p.Arg225Cys
          description: Reported in a four-generation Chinese family in which early-onset episodic pain
            co-segregated with adult-onset essential tremor.
          functional_effects:
          - function: NaV1.9 voltage-gated sodium channel gating
            description: Gain of function.
        - name: p.Phe814Cys and p.Phe1146Ser
          description: Two novel alleles from the forty-two-family Japanese expansion series, each validated
            by an orthologous knock-in mouse.
          functional_effects:
          - function: NaV1.9 voltage-gated sodium channel gating
            description: Gain of function, demonstrated by increased resting membrane potential and firing
              frequency in orthologous knock-in mice.
        - name: p.Val1184Ala
          description: Identified by exome sequencing in a European case with cold-aggravated peripheral
            pain, and the allele on which the cold-resistant hyperexcitability mechanism was demonstrated.
          functional_effects:
          - function: NaV1.9 voltage-gated sodium channel gating
            description: Gain of function through hyperpolarized shift in voltage dependence of opening.
        - name: p.Asn816Lys
          description: Reported in a child with early-onset episodic pain in both legs together with episodic
            abdominal pain and chronic constipation, which is the allele linking the enteric branch of
            the phenotype to the channel.
          functional_effects:
          - function: NaV1.9 voltage-gated sodium channel gating
            description: Gain of function through increased current density and a ten-millivolt hyperpolarizing
              shift in activation, enlarging the window current.
        - name: p.Leu811Phe
          description: 'A novel allele in a four-generation Japanese pedigree, and the more informative
            half of a residue that diverges by substitution: p.Leu811Phe causes episodic pain while p.Leu811Pro
            at the same residue causes congenital insensitivity to pain.'
          functional_effects:
          - function: NaV1.9 voltage-gated sodium channel gating
            description: Increases the structural stability of NaV1.9 and impedes the conformational changes
              required for normal gating, by molecular dynamics simulation.
        notes: 'Variants are point missense throughout; no frameshift, nonsense or structural variant
          has been reported for the episodic-pain phenotype, which is consistent with a mechanism that
          requires an altered channel rather than an absent one. The most instructive fact in the allelic
          series is that SCN11A is pleiotropic in a graded way: moderate gain of function gives episodic
          pain, while extreme gain of function gives congenital insensitivity to pain through sustained
          depolarization block. Leu811 shows this within a single residue.'
      selected_evidence:
        snippet: p.R222S and p.R222H, were identified in SCN11A by linkage analysis
        supports: SUPPORT
