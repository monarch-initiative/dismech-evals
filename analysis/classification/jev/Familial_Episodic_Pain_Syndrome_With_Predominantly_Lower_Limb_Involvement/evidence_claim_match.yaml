              label: familial episodic pain syndrome with predominantly lower limb involvement
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gain_of_function_degree_threshold
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether a gain-of-function SCN11A variant causes episodic pain or congenital
          insensitivity to pain?
        attaches_to:
        - pathophysiology#Hyperpolarized NaV1.9 Activation with Enlarged Window Current
        - genetic#SCN11A
        rationale: Both phenotypes arise from gain of function in the same channel, and at Leu811 they
          arise from different substitutions of the same residue. The proposed explanation is that moderate
          gain of function lowers the firing threshold while extreme gain of function depolarizes the
          membrane far enough to inactivate the sodium channels needed to fire at all. No study has measured
          a quantitative boundary between the two regimes, so a novel variant with demonstrated gain of
          function cannot yet be assigned to a phenotype on biophysics alone. This matters clinically
          because the two conditions have opposite management.
      selected_evidence:
        snippet: we propose a model in which the physiological consequence of a mutation, that is, augmented
          versus absent pain, is critically dependent on the type of NaV1.9 hyperactivity
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26645915
      reference_title: Cold-aggravated pain in humans caused by a hyperactive NaV1.9 channel mutant.
