  17d3933dbdd9976e3b7ddff2199b4a7755ccac6a458fccdd641a470614fcf4c1:
    claim:
      about:
        disease:
          name: Familial Erythrocytosis 4
          disease_term:
            preferred_term: erythrocytosis, familial, 4
            term:
              id: MONDO:0012729
              label: erythrocytosis, familial, 4
        context: []
      assertion_type: Genetic
      assertion:
        name: EPAS1 germline gain-of-function
        gene_term:
          preferred_term: EPAS1
          term:
            id: hgnc:3374
            label: EPAS1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Heterozygous germline missense variants in EPAS1 (HIF2A), clustered in exon 12 close
          to the prolyl-hydroxyl-acceptor Pro531. Reported alleles include G537W (the first identified),
          G537R, M535V, M535I, M535T, P534L, and the more N-terminal D525G, L526F, G527K and A530S; the
          described causal span runs roughly from amino acid 525 to 537. The mechanism is gain of function:
          the variants impair PHD2-mediated hydroxylation and VHL binding, stabilising HIF-2-alpha. Serum
          erythropoietin is inappropriately normal to elevated.'
        notes: Two points of granularity. Some residues (A530S, Y532C) have been reported both as germline
          variants causing erythrocytosis alone and at somatic state in tumours, so residue identity alone
          does not predict which presentation a carrier has. And although germline ECYT4 is characteristically
          erythrocytosis-only, one germline exon-9 variant (F374Y, inherited from the proband's mother)
          has been reported in a polycythemic patient who developed pheochromocytoma/paraganglioma; the
          reporting authors concluded the variant was predisposing rather than causative for the tumour,
          and no loss of heterozygosity or second somatic hit was found. No tumour phenotype is curated
          on this entry on the strength of that single case; the chromaffin tumour spectrum belongs to
          the somatic mosaic entity, Pacak-Zhuang syndrome.
        variants:
        - name: G537W
          description: The first identified ECYT4 allele (c.1609G>T), replacing the small conserved glycine
            with a bulky tryptophan in the oxygen-dependent degradation domain.
        - name: G537R
          description: Recurrent exon 12 missense variant at Gly537.
        - name: M535V
          description: Exon 12 missense variant near Pro531.
        - name: D525G
          description: One of four variants described close to Pro531 in the European EPAS1 erythrocytosis
            collection, broadening the causal span N-terminally.
        - name: A530S
          description: Reported as a germline variant causing erythrocytosis alone, having previously
            been identified at somatic state in tumours.
      selected_evidence:
        snippet: identify 4 additional patients with novel heterozygous Met535Val and Gly537Arg mutations
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
