      assertion_type: Pathophysiology
      assertion:
        name: Germline EPAS1/HIF-2-alpha Gain-of-Function Variant
        biological_scale: MOLECULAR
        description: 'A heterozygous germline missense variant in EPAS1 alters a residue in or near the
          oxygen-dependent degradation domain of HIF-2-alpha, close to the prolyl-hydroxyl-acceptor Pro531
          (reported changes include G537W, G537R, M535V, M535I, M535T and P534L). The variants are gain-of-function:
          they impair recognition of HIF-2-alpha by the PHD2 hydroxylase and by the von Hippel-Lindau
          protein. Functional characterisation across these alleles shows a common endpoint of impaired
          degradation despite distinct effects on PHD2 and VHL interaction.'
        genes:
        - preferred_term: EPAS1
          term:
            id: hgnc:3374
            label: EPAS1
        molecular_functions:
        - preferred_term: HIF-2-alpha transcription factor activity
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
          modifier: GAIN_OF_FUNCTION
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: We describe a family with erythrocytosis and a mutation in the HIF2A gene, which encodes
          the HIF-2alpha protein
        supports: SUPPORT
