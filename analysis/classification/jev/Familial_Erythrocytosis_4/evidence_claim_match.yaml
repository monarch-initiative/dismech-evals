              label: erythrocytosis, familial, 4
        context: []
      assertion_type: Treatment
      assertion:
        name: HIF-2-alpha inhibition (belzutifan)
        description: 'HIF-2-alpha is the direct effector of the disease, so HIF-2-alpha inhibition is
          a mechanistically targeted therapy. Belzutifan, a HIF-2-alpha inhibitor, has been reported to
          normalise the haemoglobin in EPAS1-associated polycythemia without further phlebotomy. Carriers
          with a causal EPAS1 variant in the hydroxylation region are candidates for this treatment. The
          evidence is case-level: the 2026 management review of JAK2-unmutated erythrocytosis states that
          the role of HIF2A inhibitors remains unclear, so this is a mechanistically rational therapy
          whose place in care is not yet settled.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: belzutifan
            term:
              id: CHEBI:757730
              label: belzutifan
      selected_evidence:
        snippet: all the patients carrying a causal mutation in EPAS1, located between amino acids 525
          to 537, are theoretically eligible for HIF-2α inhibitor treatment
        supports: SUPPORT
