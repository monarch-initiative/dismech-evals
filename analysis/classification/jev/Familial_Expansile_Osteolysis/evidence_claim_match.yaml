      assertion_type: Diagnosis
      assertion:
        name: Panoramic Dental Radiography and Cone-Beam CT for Root Resorption
        diagnosis_term:
          preferred_term: panoramic dental radiography and cone-beam CT
          term:
            id: NCIT:C150663
            label: Orthopantomogram
        description: Clinical and radiographic dental examination detects cervical and apical external
          root resorption of the permanent teeth, which is an early manifestation, precedes skeletal disease
          in many patients and predicts later bone involvement. A panoramic radiograph is the screening
          view; cone-beam CT resolves the extent of resorption of individual roots and is the modality
          on which progression has been followed. Multiple external root resorption with no local cause
          in a child should prompt the systemic and genetic evaluation recorded below. Cone-beam CT is
          carried in the preferred term because the schema binds one procedure term per diagnostic item;
          NCIT:C71695 is its identifier.
        results: Cervical and/or apical external root resorption of several permanent teeth, with narrowed
          pulp chambers from irregular secondary dentine; deciduous teeth largely spared.
      selected_evidence:
        snippet: Twenty-seven family members, aged 3 to 60 years, were examined clinically and radiographically,
          and it was found that cervical and/or apical root resorption is an early manifestation of the
          dysplasia.
        supports: SUPPORT
