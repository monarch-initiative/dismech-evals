              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: Genetic
      assertion:
        name: TNFRSF11A
        gene_term:
          preferred_term: TNFRSF11A
          term:
            id: hgnc:11908
            label: TNFRSF11A
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Encodes RANK (receptor activator of NF-kappaB), the TNF receptor superfamily member on
          osteoclast precursors that binds RANKL (TNFSF11, hgnc:11926) and is essential for osteoclast
          formation. Mutation spectrum in FEO: a heterozygous in-frame 18-bp tandem duplication in exon
          1, 84dup18, in every FEO kindred reported, plus a second 18-bp duplication one base proximal
          in two unrelated patients; both add the same six residues to the signal peptide. Intragenic
          haplotypes show at least three independent origins for the recurrent duplication. The allelic
          signal-peptide duplications, 27-bp (PDB2), 15-bp (ESH, and JPD2 at 87dup15) and 12-bp (PEBD),
          cause the related disorders described in the entry notes; a 2023 report of the 12-bp duplication
          arising de novo shows that these duplications can occur without family history. The duplications
          are activating in the sense of producing a heterozygous high-turnover phenotype and increased
          NF-kappaB signalling on overexpression; biallelic loss of function of the same gene causes osteoclast-poor
          osteopetrosis, so the disease is not a dosage effect of the receptor but a consequence of the
          misprocessed protein. No ClinGen gene-disease validity assertion for TNFRSF11A and FEO was found
          in the cached ClinGen records.'
      selected_evidence:
        snippet: We identified two heterozygous insertion mutations in exon 1 of TNFRSF11A in affected
          members of four families with FEO or familial Paget disease of bone (PDB).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
