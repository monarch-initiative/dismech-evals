          have extensive limb and even skull disease from childhood. Sporadic cases with no family history
          occur. Penetrance is recorded as complete on the strength of the kindred descriptions; no formal
          penetrance estimate has been published.'
      selected_evidence:
        snippet: We report 40 cases in one family of an autosomal dominant bone dysplasia, which, though
          similar in some aspects to Paget's disease, seems unique in some features and in its natural
          history.
