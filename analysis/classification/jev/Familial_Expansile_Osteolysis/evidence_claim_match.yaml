        context: []
      assertion_type: Treatment
      assertion:
        name: Denosumab
        description: 'The anti-RANKL monoclonal antibody, reported in a single adult with FEO in 2025,
          in whom it improved the radiological appearance of affected bone and quality of life and permitted
          limb-salvage surgery in place of amputation. Its use is mechanistically interesting rather than
          established: if the mutant receptor signals independently of ligand, blocking the ligand should
          do little, so a response implies that osteoclast activity in FEO retains a RANKL-dependent component.
          The same hypocalcaemia caution as for bisphosphonates applies, and rebound turnover on withdrawal
          is a known property of the drug in other settings.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: denosumab
            term:
              id: NCIT:C61313
              label: Denosumab
      selected_evidence:
        snippet: We present the case of a 54-year-old man with FEO who was treated with denosumab.
        supports: SUPPORT
    origin:
