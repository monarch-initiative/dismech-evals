      assertion_type: Pathophysiology
      assertion:
        name: Ligand-Independent RANK Signalling and NF-kappaB Activation
        biological_scale: MOLECULAR
        description: 'RANK signalling that is no longer under the control of RANK ligand. In the discovery
          study, recombinant mutant RANK increased RANK-mediated NF-kappaB signalling in vitro relative
          to wild type, and the mutations were read as activating; reviews state the mechanism as osteoclast
          activation through NF-kappaB independent of ligand. The later study of stably transfected cells
          found that constitutive activation occurred only with overexpression, of wild-type as well as
          mutant RANK, and not at low expression levels, and concluded that the disease cannot be explained
          by the mutant receptor alone. The modifier is recorded as GAIN_OF_FUNCTION rather than INCREASED
          because the claim is qualitative: the pathway has escaped its ligand, not merely risen above
          its normal level. The disagreement about how it escaped is the entry''s knowledge gap.'
        biological_processes:
        - preferred_term: ligand-independent RANK-mediated NF-kappaB signalling
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
          modifier: GAIN_OF_FUNCTION
        - preferred_term: tumour necrosis factor receptor superfamily (RANK) signalling
          term:
            id: GO:0033209
            label: tumor necrosis factor-mediated signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Both mutations caused an increase in RANK-mediated nuclear factor-kappaB (NF-kappaB)
          signalling in vitro, consistent with the presence of an activating mutation.
        supports: SUPPORT
