        conforms_to: osteoporosis_bone_resorption#RANKL-Driven Osteoclastogenesis
        description: 'Osteoclasts form, persist and resorb in excess of what the skeleton has asked for.
          Affected bone shows increased osteoclast and osteoblast activity, and the mouse carrying the
          allelic 75dup27 duplication shows what the heterozygous state does to the lineage: RANKL-induced
          osteoclast formation and signalling in marrow cells is impaired, yet osteoclast survival is
          increased independently of RANKL, and the animals develop focal osteolytic lesions. The same
          allele in homozygous form abolishes osteoclasts altogether and causes osteopetrosis, which shows
          that the mutant receptor is not simply hyperactive but that one mutant allele beside a wild-type
          one changes osteoclast behaviour in a way that neither allele alone explains. This node conforms
          to the module''s RANKL-driven osteoclastogenesis step with the substitution that the driver
          is a receptor escaped from ligand control rather than an excess of ligand.'
        cell_types:
