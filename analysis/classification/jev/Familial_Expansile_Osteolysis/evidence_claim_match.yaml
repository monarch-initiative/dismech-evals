  fe02cdfc8f0443c0a446e38df5df4ab0be943b8d634b5b6009b50ce420c69793:
    claim:
      about:
        disease:
          name: Familial Expansile Osteolysis
          disease_term:
            preferred_term: Familial Expansile Osteolysis
            term:
              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: feo_mouse_allele_mismatch
        prompt: How far does the Tnfrsf11a 75dup27 knock-in mouse, which carries the early-onset Paget
          allele, model the lytic, expansile, appendicular disease and the ossicular and dental resorption
          of the human 18-bp duplication?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Focal Expansile Osteolysis with Medullary Expansion and Cortical Thinning
        - pathophysiology#Middle-Ear Ossicular Resorption
        - pathophysiology#External Root Resorption of Permanent Teeth
        rationale: 'The model reproduces focal, age-dependent, drug-preventable osteolysis from a heterozygous
          signal-peptide duplication, which is strong evidence for the shared mechanism. What it does
          not do is carry the FEO allele: the 27-bp duplication produces a Paget-like lytic-sclerotic
          disease with jaw and skull involvement in humans, where the 18-bp duplication produces purely
          lytic limb lesions that end in fat-filled bone. Duplication length appears to matter to phenotype
          in the human allelic series, so an inference from one allele to another is an inference across
          the very variable that separates the disorders. The abstract reports no hearing or dental phenotype,
          so the two earliest human manifestations are unmodelled. This is recorded as HUMAN_MODEL_MISMATCH
          rather than KNOWLEDGE_GAP because the model evidence exists and is good; what is open is its
          transfer to the specific human allele.'
        proposed_experiments:
        - experiment_id: feo_75dup27_mouse_ossicle_and_tooth_phenotyping
          name: Ossicular and dental phenotyping of the 75dup27 heterozygous mouse
          description: Micro-CT of the auditory ossicles and molar roots in heterozygous 75dup27 mice
            across age, with auditory brainstem responses, to test whether the earliest human manifestations
            of the signal-peptide duplication are present in the existing model before an 18-bp line is
            made.
      selected_evidence:
        snippet: To understand the mechanisms underlying these disorders, we developed a mouse model carrying
          the 75dup27 mutation which causes EoPDB.
        supports: SUPPORT
    origin:
