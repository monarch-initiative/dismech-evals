  a1ca81b6aa7580b242d37d8f6467331ad99dddf892135f602950aa5e56589841:
    claim:
      about:
        disease:
          name: Familial Expansile Osteolysis
          disease_term:
            preferred_term: Familial Expansile Osteolysis
            term:
              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Fibrous and then fatty replacement of the medulla at the end stage of a lesion
        description: 'The advancing lytic lesion destroys the medullary bone, which is replaced first
          by fibrous tissue and finally by fat, so that the burnt-out lesion is a thin-walled, fat-filled
          shell rather than the sclerotic bone of a late Paget lesion. The same fibrous replacement is
          seen in the middle ear, where the incus is replaced by fibrous tissue. Left unbound because
          no NCIT morphologic-finding term covers the fibrous-to-fatty sequence of medullary replacement:
