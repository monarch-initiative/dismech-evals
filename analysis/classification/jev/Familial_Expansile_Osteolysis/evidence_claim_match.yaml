      reference_title: Mutations in TNFRSF11A, affecting the signal peptide of RANK, cause familial expansile
        osteolysis.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The discovery of the causal lesion: heterozygous exon 1 insertions in affected members
        of four families.'
