        biological_processes:
        - preferred_term: osteoclast differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
          modifier: INCREASED
        - preferred_term: osteoclast survival (reduced apoptosis)
          term:
            id: GO:0043066
            label: negative regulation of apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: This intriguing study has shown that in heterozygous form, the 75dup27 mutation causes
          focal osteolytic lesions in vivo reminiscent of the human disorder and extends osteoclast survival
          independently of RANKL signaling.
        supports: SUPPORT
        directness: INDIRECT
    origin:
