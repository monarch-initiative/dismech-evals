        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of RANK Signal-Peptide Cleavage and Endoplasmic Reticulum Retention
        biological_scale: MOLECULAR
        description: The elongated signal peptide is not removed. In two independent in vitro translation
          systems the mutant proteins fail signal-peptide cleavage, and when expressed in cells mutant
          RANK does not reach the plasma membrane but accumulates in extensive areas of organised smooth
          endoplasmic reticulum, where wild-type RANK is found at the membrane and in the Golgi. Reviews
          describe the consequence as the protein translated from the mutant allele being trapped in the
          endoplasmic reticulum. The mutant receptor that does accumulate cannot be activated by RANK
          ligand, so whatever it does to the cell, it does not do it by responding to ligand in the ordinary
          way.
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
        biological_processes:
        - preferred_term: retention of mutant RANK in the endoplasmic reticulum
          term:
            id: GO:0035437
            label: maintenance of protein localization in endoplasmic reticulum
          modifier: INCREASED
      selected_evidence:
        snippet: This intracellular accumulation of the mutant proteins is probably the result of lack
          of signal peptide cleavage because, using two in vitro translation systems, we demonstrate that
          the mutations in RANK prevent cleavage of the signal peptide.
        supports: SUPPORT
    origin:
