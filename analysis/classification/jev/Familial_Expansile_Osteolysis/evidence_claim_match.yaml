  3ab05165df02aa493d4e3eaf5153231c58956e09f4296e839f08a9e7bb67611e:
    claim:
      about:
        disease:
          name: Familial Expansile Osteolysis
          disease_term:
            preferred_term: Familial Expansile Osteolysis
            term:
              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: feo_denosumab_ligand_dependence
        prompt: Does RANKL blockade with denosumab control the osteoclast overactivity of FEO, and if
          so what does that say about the ligand dependence of signalling from the mutant receptor?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Denosumab
        - pathophysiology#Ligand-Independent RANK Signalling and NF-kappaB Activation
        rationale: 'The mechanism curated above is described as ligand-independent, and the ER-retained
          mutant receptor cannot be activated by ligand in vitro, which would predict that neutralising
          RANKL does little. Against that, one adult with FEO treated with denosumab in 2025 showed radiological
          improvement, better quality of life and enough control to permit limb salvage. A response to
          ligand blockade implies that osteoclast activity in FEO retains a RANKL-dependent component,
          most plausibly through the wild-type receptor in the same heterozygous cell. One case cannot
          settle it, and the knock-in mouse''s osteoclasts survived without RANKL, which predicts a partial
          rather than complete response. The question is practical: bisphosphonates act on the osteoclast
          regardless of the receptor''s state, denosumab does not.'
        proposed_experiments:
        - experiment_id: feo_denosumab_turnover_marker_series
          name: Prospective turnover-marker response to denosumab in FEO
          description: Treat a small series of adults with molecularly confirmed FEO with denosumab under
            a hypocalcaemia protocol and measure bone resorption markers and lesion scintigraphic activity
            before and after, comparing the depth of suppression with that achieved by zoledronic acid
            in the same patients. Complete suppression implies fully ligand-dependent osteoclast activity;
            partial suppression quantifies the ligand-independent component.
      selected_evidence:
        snippet: The use of denosumab for FEO displays improvement in radiological appearances of the
          affected bone, increased quality of life and may prevent the development of further lesions.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41264685
      reference_title: 'A Novel Approach to the Treatment of Familial Expansile Osteolysis: A Rare Genetic
