        diagnosis_term:
          preferred_term: Clinical Evaluation
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        description: 'The diagnosis is suspected from the stereotyped sequence: conductive hearing loss
          from early childhood, external root resorption and premature loss of the permanent teeth in
          adolescence, and from the second decade painful expansile osteolytic lesions of the limb bones
          on a background of raised bone-turnover markers with normal calcium and phosphate. A family
          history compatible with autosomal dominant transmission strengthens the suspicion but sporadic
          cases occur, and in a child the presenting finding is usually the deafness or unexplained multiple
          root resorption at the dental clinic. No consensus diagnostic criteria exist; recognition of
          the pattern is what prompts the imaging and molecular workup below.'
        results: A compatible clinical pattern that triggers biochemical, imaging and TNFRSF11A testing;
          not by itself diagnostic.
      selected_evidence:
        snippet: Constitutive activation of RANK signaling should be considered a possible cause in any
          young person with rapid bone turnover, particularly in the context of early-onset deafness and/or
          root resorption of permanent teeth.
        supports: SUPPORT
