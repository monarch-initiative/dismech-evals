      assertion_type: HistopathologyFinding
      assertion:
        name: Osteoclast-rich resorption with increased osteoclast number and multinuclearity
        description: Affected bone shows an increase in osteoclast number, in the number of nuclei per
          osteoclast and in osteoclast activity, with coupled osteoblast activity, the histological picture
          of a high-turnover osteoclast-driven lesion. This is the tissue basis of the pathophysiology
          node "Constitutive Osteoclast Formation, Survival and Activation". The bound NCIT term covers
          the increase in osteoclast number; the multinuclearity and activity components are carried by
          the preferred term and the quoted evidence.
        finding_term:
          preferred_term: increased osteoclast number and multinuclearity
          term:
            id: NCIT:C147498
            label: Increased Osteoclasts
        notes: The primary histological descriptions of the Northern Irish kindred are not cached with
          an abstract that states the microscopic findings, so the finer features reported in the literature
          (woven trabeculae, vascular fibrous marrow, and the absence of the mosaic lamellar pattern of
          Paget disease) are not curated here; only what the cached sources state is recorded.
      selected_evidence:
        snippet: Affected areas show an increase in osteoclast number, multinuclearity, and activity,
          which leads to the notion that these diseases are driven by osteoclast overactivity, as is classic
          late-onset Paget disease of bone.
        supports: SUPPORT
