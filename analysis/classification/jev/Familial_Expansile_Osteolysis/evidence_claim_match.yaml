  75b5cae1e97539a57d7eb5ddfb8779ebad8039233be948825dcd7bd760348f98:
    claim:
      about:
        disease:
          name: Familial Expansile Osteolysis
          disease_term:
            preferred_term: Familial Expansile Osteolysis
            term:
              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: TNFRSF11A Exon 1 Duplication Testing
        diagnosis_term:
          preferred_term: duplication-sensitive sequencing of TNFRSF11A exon 1
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: 'Molecular confirmation is a heterozygous in-frame 18-bp tandem duplication in exon
          1 of TNFRSF11A, found in every FEO kindred published. Because the lesion is a small tandem duplication
          in a GC-rich repeated sequence, the assay must be duplication-sensitive: Sanger sequencing of
          exon 1 in both directions, or a skeletal-dysplasia panel that provides deletion/duplication
          analysis alongside sequencing, detects it; a pipeline that does not resolve small tandem duplications
          can miss it. The length of the duplication identifies the allelic disorder (27 bp for early-onset
          familial Paget disease, 15 bp for expansile skeletal hyperphosphatasia, 12 bp for panostotic
          expansile bone disease), so the test also settles the differential among the RANK signal-peptide
          disorders. Parental testing distinguishes inherited from de novo duplications, and cascade testing
          identifies at-risk relatives before skeletal lesions form. Unexplained multiple external root
          resorption in a child is a recognised trigger for testing.'
        results: Heterozygous 84dup18, or the one-base-shifted 18-bp duplication, in exon 1 of TNFRSF11A.
      selected_evidence:
        snippet: We identified two heterozygous insertion mutations in exon 1 of TNFRSF11A in affected
          members of four families with FEO or familial Paget disease of bone (PDB).
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/5
      evidence_path: /diagnosis/5/evidence/0
      context_paths:
