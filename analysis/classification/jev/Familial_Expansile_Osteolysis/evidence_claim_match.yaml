          orthodontic force and invasive dental surgery. Root resorption is often the presenting finding
          in a child and is a prognosticator of later bone disease; the recommendation that unexplained
          external root resorption should prompt genetic testing is recorded in the diagnosis section.
          Whether antiresorptive drugs slow root resorption is unproven; alendronate was proposed for
          that purpose in the allelic ESH family before the gene was known.
