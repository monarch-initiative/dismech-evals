      assertion_type: Treatment
      assertion:
        name: Bisphosphonate Therapy
        description: 'Nitrogen-containing bisphosphonates are the mainstay. Intravenous zoledronic acid
          or pamidronate, or oral alendronate, suppress the biochemical markers of turnover for prolonged
          periods and in the allelic disorders have mineralised early lesions and improved bone density;
          the first-generation agents etidronate and clodronate gave only transient responses, which is
          why aminobisphosphonates are preferred. Whether treatment changes the natural history of established
          lesions, deafness or tooth loss is uncertain: in early-onset Paget disease the biochemical response
          was not matched by clinical benefit for deformity, deafness or tooth loss, and the strongest
          argument for early treatment is a single child with a 12-bp duplication who developed no focal
          lesions on alendronate. In the 75dup27 mouse, zoledronic acid completely prevented lesion development.
          The specific hazard is prolonged hypocalcaemia after potent intravenous dosing in a high-turnover
          skeleton, so calcium and vitamin D are replete before treatment and calcium is monitored after
          it.'
        therapeutic_modality: SMALL_MOLECULE
