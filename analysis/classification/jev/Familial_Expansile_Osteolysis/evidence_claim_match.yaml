  edf741ed1c81659b8dea6c88d66163b9ed3707ebde271ef4ba8c7affb4b541bd:
    claim:
      about:
        disease:
          name: Familial Expansile Osteolysis
          disease_term:
            preferred_term: Familial Expansile Osteolysis
            term:
              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: feo_constitutive_activation_versus_misprocessing
        prompt: Does the heterozygous TNFRSF11A signal-peptide duplication cause osteoclast overactivity
          through constitutive, ligand-independent NF-kappaB signalling by the mutant receptor, or through
          an effect of the misprocessed, ER-retained protein on the wild-type receptor or on the cell,
          such as an unfolded-protein response?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of RANK Signal-Peptide Cleavage and Endoplasmic Reticulum Retention
        - pathophysiology#Ligand-Independent RANK Signalling and NF-kappaB Activation
        rationale: 'The two positions are both in the literature and are not reconciled. The discovery
          study found increased NF-kappaB signalling from recombinant mutant RANK and called the mutations
          activating, and reviews still state the mechanism as ligand-independent NF-kappaB activation.
          The 2011 study found that constitutive activation occurred only with overexpression and of wild-type
          RANK as much as mutant, that at low expression the mutant receptor neither activated NF-kappaB
          constitutively nor responded to ligand, and that the mutant protein sits in the endoplasmic
          reticulum rather than at the membrane; it concluded that the disease cannot be explained by
          the mutant receptor alone. The knock-in mouse then showed that two mutant alleles abolish osteoclasts
          while one mutant allele beside a wild-type one prolongs osteoclast survival without RANKL, which
          is compatible with either a dominant effect of the misfolded protein on the cell or an interaction
          with wild-type receptor, and with neither simple model. Reviews have proposed an unfolded-protein-response
          route to NF-kappaB, which has not been tested in osteoclasts. The question matters for treatment:
          if signalling is truly ligand-independent, RANKL blockade should be ineffective, and the single
          denosumab response argues the other way. Every functional study to date has used the 27-bp or
          heterologous overexpression systems; no patient-derived osteoclast study of the 18-bp allele
          has been published.'
        proposed_experiments:
        - experiment_id: feo_patient_osteoclast_84dup18_signalling
          name: NF-kappaB and unfolded-protein-response signalling in heterozygous 84dup18 osteoclasts
          description: Differentiate osteoclasts from peripheral blood monocytes or iPSC-derived precursors
            of FEO patients carrying 84dup18, and from isogenic corrected controls, and measure basal
            and RANKL-stimulated NF-kappaB activity, osteoclast survival without RANKL, and unfolded-protein-response
            markers. A cell that shows basal NF-kappaB activity with UPR induction and no RANKL dose-response
            supports the misprocessing model; one that shows a shifted RANKL dose-response supports an
            interaction of mutant with wild-type receptor.
          would_support:
          - pathophysiology#Ligand-Independent RANK Signalling and NF-kappaB Activation
          supporting_outcome:
          - Basal NF-kappaB activity in heterozygous patient osteoclasts at endogenous expression levels,
            absent in isogenic controls.
          refuting_outcome:
          - No basal NF-kappaB activity, with prolonged survival explained by a pathway other than NF-kappaB.
        - experiment_id: feo_84dup18_knock_in_mouse
          name: Knock-in mouse carrying the FEO 18-bp duplication
          description: Generate a Tnfrsf11a 84dup18 knock-in and compare the heterozygous skeletal, ossicular
            and dental phenotype with the 75dup27 line, to test whether the length of the signal-peptide
            extension determines the lytic versus Paget-like pattern and whether the homozygous osteopetrosis
            is general to the allelic series.
      selected_evidence:
        snippet: These results strongly suggest that the increased osteoclast formation/activity caused
          by these mutations cannot be explained by studying the homozygous phenotype alone but requires
          further detailed investigation of the heterozygous expression of the mutant RANK proteins.
        supports: SUPPORT
