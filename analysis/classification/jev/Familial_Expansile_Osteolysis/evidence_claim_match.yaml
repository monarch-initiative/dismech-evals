          it weakens; the sequence ends in pain, severe deformity and pathological fracture. Unlike Paget
          disease, the lesion does not pass into a sclerotic phase: osteolysis progresses to fat-filled
          bone. Extensive peripheral and even skull involvement has been described in childhood-onset
          disease. Conforms to the module''s central resorption effector with the caveat that here the
          resorption is focal and expansile rather than the diffuse trabecular loss of osteoporosis.'
