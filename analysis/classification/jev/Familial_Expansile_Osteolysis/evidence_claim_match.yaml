            term:
              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Skeletal Radiography
        diagnosis_term:
          preferred_term: plain radiography of the limb bones
          term:
            id: NCIT:C38101
            label: X-Ray Imaging
        description: 'Plain radiographs of symptomatic sites, or a skeletal survey, show the two classes
          of change described in the original kindred: generalised alteration of the trabecular pattern
          and modelling of the long bones, which can be seen before any focal lesion, and focal lytic
          areas that enlarge along the shaft, expand the bone and thin the cortex until the medulla is
          replaced by fibrous and then fatty tissue. The distribution is the discriminating feature: almost
          all lesions are appendicular, and the pelvis, spine and skull that classic Paget disease favours
          are spared. Radiographs are also how lesion advance, fracture and response to treatment are
          followed.'
        results: Appendicular expansile lytic lesions with medullary expansion and cortical thinning,
          with or without generalised trabecular coarsening; the axial skeleton is spared. The radiological
          differential is Paget disease, polyostotic fibrous dysplasia and osteofibrous dysplasia.
      selected_evidence:
        snippet: Focal features comprise lytic areas which progressively enlarge, producing expansion
          of the bone and eventual disintegration due to fibrous and finally fatty replacement of the
          normal medulla.
        supports: SUPPORT
