  1754895458b765c328b45a63ead5286336f9ff8291df11d2bb2167e1ecb1ba13:
    claim:
      about:
        disease:
          name: Familial Expansile Osteolysis
          disease_term:
            preferred_term: Familial Expansile Osteolysis
            term:
              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TNFRSF11A Exon 1 Signal-Peptide Tandem Duplication
        biological_scale: MOLECULAR
        role: trigger
        description: The initiating lesion. A heterozygous in-frame 18-base-pair tandem duplication in
          exon 1 of TNFRSF11A, the gene encoding receptor activator of NF-kappaB (RANK), inserts six amino
          acids into the signal peptide of the receptor. The classic allele is 84dup18; a second 18-bp
          duplication one base proximal to it adds the same six residues. Intragenic haplotypes show that
          the identical duplication has arisen independently at least three times, and the exon 1 sequence
          can form a stable secondary structure that may favour tandem duplication, which is why the same
          lesion recurs in unrelated families. The allelic 27-, 15- and 12-bp duplications in the same
          signal peptide cause the related disorders described in the notes.
        genes:
        - preferred_term: TNFRSF11A
          term:
            id: hgnc:11908
            label: TNFRSF11A
        genetic_context:
          genes:
          - preferred_term: TNFRSF11A
            term:
              id: hgnc:11908
              label: TNFRSF11A
          allele_type: in-frame 18-bp tandem duplication in exon 1 (signal peptide)
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'Classified as gain of function on the basis of the original functional characterisation,
            in which both signal-peptide duplications increased RANK-mediated NF-kappaB signalling in
            vitro, and on the heterozygous disease phenotype of excessive osteoclast activity. The category
            is held with the caveat recorded in the knowledge gap below: the mutant receptor by itself
            cannot be activated by ligand, and how one mutant allele overactivates osteoclasts in heterozygous
            cells is unresolved.'
      selected_evidence:
        snippet: We identified two heterozygous insertion mutations in exon 1 of TNFRSF11A in affected
          members of four families with FEO or familial Paget disease of bone (PDB).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
