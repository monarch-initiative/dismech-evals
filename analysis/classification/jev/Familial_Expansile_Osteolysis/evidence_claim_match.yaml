        fidelity: LOW
        model_scale: CELLULAR
        description: 'Two copies of the mutant allele produce the opposite of the human disease at the
          osteoclast: no osteoclasts at all.'
        limitations: No homozygous human exists, so the model tests a state the disease never occupies;
          its value is mechanistic, not phenotypic. It shows that the mutant receptor alone cannot drive
          osteoclastogenesis and that the human heterozygous phenotype depends on the co-presence of wild-type
          RANK, which is the content of the knowledge gap.
      selected_evidence:
        snippet: Surprisingly, Tnfrsf11a75dup27/75dup27 homozygotes had osteopetrosis at birth, with complete
          absence of osteoclasts.
        supports: SUPPORT
