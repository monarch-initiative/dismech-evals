  c1da2e46a8fb266c77765fd70383ab3e54164a3e41893d40b8ac5067386417e5:
    claim:
      about:
        disease:
          name: Familial Expansile Osteolysis
          disease_term:
            preferred_term: Familial Expansile Osteolysis
            term:
              id: MONDO:0008275
              label: familial expansile osteolysis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Technetium-99m Bone Scintigraphy
        diagnosis_term:
          preferred_term: whole-body technetium-99m bone scintigraphy
          term:
            id: NCIT:C17646
            label: Bone Scan
        description: 'Whole-body radionuclide bone scan maps the extent of disease: tracer uptake is increased
          at focal osteolytic lesions and, in the original kindred, in the tibiae of patients who had
          no focal lesion, reflecting the generalised high turnover. It is the imaging test that shows
          the multifocal, polyostotic nature of the disease in one study and identifies lesions before
          they are symptomatic. A normal scan does not exclude a signal-peptide duplication: a child with
          the allelic 12-bp duplication and mild disease had a normal scan despite raised resorption markers.'
        results: Increased tracer uptake at multiple appendicular foci, sometimes with diffusely increased
          uptake in the tibiae without a focal lesion; may be normal in early or mild disease.
      selected_evidence:
        snippet: In addition, tracer uptake was reported to be increased in the tibiae of patients without
          focal bone lesions in keeping a generalized elevation in bone turnover.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
