      evidence_source: MODEL_ORGANISM
      explanation: 'The clearest cellular statement of what a heterozygous signal-peptide duplication
        does to osteoclasts: it extends their survival without RANKL. Indirect because the allele is the
        PDB2 27-bp duplication, not the FEO 18-bp one.'
