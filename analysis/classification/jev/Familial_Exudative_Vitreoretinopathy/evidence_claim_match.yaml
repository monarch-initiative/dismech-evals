      - /disease_term
    evidence_metadata:
      reference: PMID:23716654
      reference_title: ZNF408 is mutated in familial exudative vitreoretinopathy and is crucial for the
        development of zebrafish retinal vasculature.
      evidence_source: HUMAN_CLINICAL
      explanation: A second, independent human FEVR family carrying a ZNF408 missense variant, beyond
        the two related Dutch families.
