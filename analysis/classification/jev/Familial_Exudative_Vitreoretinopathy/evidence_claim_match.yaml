        name: CTNNB1-FEVR
        display_name: CTNNB1-Related FEVR (EVR7, autosomal dominant)
        description: FEVR caused by heterozygous, usually de novo, variants in CTNNB1, encoding beta-catenin,
          the intracellular effector of canonical Wnt signaling. Exudative vitreoretinopathy occurs both
          alongside the CTNNB1 neurodevelopmental phenotype (severe intellectual disability, microcephaly,
          spasticity) and in isolation. ClinGen lumped exudative vitreoretinopathy 7 with severe intellectual
          disability-progressive spastic diplegia syndrome into one CTNNB1-related disease entity on the
          grounds of a shared haploinsufficiency mechanism and a similar variant spectrum, so the ClinGen
          assertion for this subtype is recorded against that combined term (MONDO:0100571) rather than
          against MONDO:0033123.
