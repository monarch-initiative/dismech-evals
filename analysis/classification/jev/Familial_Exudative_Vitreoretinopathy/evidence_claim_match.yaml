      assertion:
        name: ZNF408 dysfunction impairing retinal vascular development
        genes:
        - preferred_term: ZNF408
          term:
            id: hgnc:20041
            label: ZNF408
        description: A FEVR mechanism that does not run through the Norrin/FZD4 receptor complex. Morpholino
          knockdown of zebrafish znf408 produces defects in the developing retinal vasculature that co-injected
          wild-type human ZNF408 RNA rescues and the p.His455Tyr mutant does not. In transfected cells
          the p.His455Tyr protein is localized almost exclusively to the cytoplasm and retains wild-type
          ZNF408 there, consistent with a dominant-negative mechanism. How ZNF408 acts on retinal vasculogenesis
          is not established, and a review lists it with CTNNB1 and KIF11 as later-discovered FEVR genes
          some of which operate outside the Norrin/Wnt signalling pathway, so this node is kept separate
          from the receptor-complex node rather than folded into it.
        biological_processes:
        - preferred_term: retina vasculature development in camera-type eye
          modifier: DECREASED
          term:
            id: GO:0061298
            label: retina vasculature development in camera-type eye
      selected_evidence:
        snippet: morpholino-induced knockdown of znf408 in zebrafish revealed defects in developing retinal
          and trunk vasculature, that could be rescued by coinjection of RNA encoding human WT ZNF408
          but not p.His455Tyr mutant ZNF408
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
