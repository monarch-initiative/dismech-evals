            description: KIF11 encodes EG5, a homotetrameric kinesin required for bipolar mitotic spindle
              assembly. Heterozygous KIF11 mutations impair spindle formation in proliferating progenitors,
              compromising CNS growth (microcephaly) and the development of retinal and lymphatic structures.
              This mechanism operates outside the canonical Norrin/Wnt pathway and defines the KIF11-related
              FEVR spectrum (microcephaly-lymphedema-chorioretinal dysplasia).
            gene:
              preferred_term: KIF11
