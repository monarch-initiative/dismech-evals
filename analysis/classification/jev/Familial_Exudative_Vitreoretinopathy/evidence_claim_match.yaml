        description: Norrin/Wnt signaling in retinal endothelial cells governs not only developmental
          angiogenesis but also formation and maintenance of the inner blood-retinal barrier (iBRB). Loss-of-function
          in FZD4, LRP5, NDP, or TSPAN12 impairs iBRB integrity, producing aberrant vascular permeability
          that contributes to retinal exudation independently of ischemia-driven neovascularization. FEVR,
          Norrie disease, and persistent fetal vascular syndrome share this iBRB dysfunction as a unifying
          pathophysiological element.
        cell_types:
