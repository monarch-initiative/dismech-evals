              label: exudative vitreoretinopathy
        context: []
      assertion_type: Subtype
      assertion:
        name: ZNF408-FEVR
        display_name: ZNF408-Related FEVR (EVR6, autosomal dominant)
        description: Autosomal dominant FEVR caused by heterozygous variants in ZNF408, encoding zinc
          finger protein 408. The gene was identified by linkage analysis and exome sequencing in a large
          Dutch FEVR family, and screening 132 further individuals with FEVR found a second missense variant
          in a Japanese family. The p.His455Tyr allele is localized almost exclusively to the cytoplasm
          and retains wild-type ZNF408 there, consistent with a dominant-negative mechanism, and morpholino
          knockdown of zebrafish znf408 produces retinal vascular defects that wild-type but not mutant
          human ZNF408 rescues. ZNF408 is not a component of the Norrin/FZD4 receptor complex, and a review
          lists it with CTNNB1 and KIF11 as later-discovered FEVR genes some of which operate outside
          the Norrin/Wnt signalling pathway.
        subtype_term:
          preferred_term: exudative vitreoretinopathy 6
          term:
            id: MONDO:0014652
            label: exudative vitreoretinopathy 6
        genes:
        - preferred_term: ZNF408
          term:
            id: hgnc:20041
            label: ZNF408
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Sequence analysis of ZNF408 in 132 additional individuals with FEVR revealed another
          potentially pathogenic missense variant, p.Ser126Asn, in a Japanese family.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/5
      evidence_path: /has_subtypes/5/evidence/0
      context_paths:
