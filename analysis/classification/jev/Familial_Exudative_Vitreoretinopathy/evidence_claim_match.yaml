        context:
        - path: /has_subtypes/5
          value:
            name: ZNF408-FEVR
            display_name: ZNF408-Related FEVR (EVR6, autosomal dominant)
            description: Autosomal dominant FEVR caused by heterozygous variants in ZNF408, encoding zinc
              finger protein 408. The gene was identified by linkage analysis and exome sequencing in
              a large Dutch FEVR family, and screening 132 further individuals with FEVR found a second
              missense variant in a Japanese family. The p.His455Tyr allele is localized almost exclusively
              to the cytoplasm and retains wild-type ZNF408 there, consistent with a dominant-negative
              mechanism, and morpholino knockdown of zebrafish znf408 produces retinal vascular defects
              that wild-type but not mutant human ZNF408 rescues. ZNF408 is not a component of the Norrin/FZD4
              receptor complex, and a review lists it with CTNNB1 and KIF11 as later-discovered FEVR genes
              some of which operate outside the Norrin/Wnt signalling pathway.
            subtype_term:
              preferred_term: exudative vitreoretinopathy 6
              term:
                id: MONDO:0014652
                label: exudative vitreoretinopathy 6
            genes:
            - preferred_term: ZNF408
              term:
                id: hgnc:20041
                label: ZNF408
          role: subtype
      assertion_type: Genetic
      assertion:
        name: ZNF408 zinc finger protein defect
        gene_term:
          preferred_term: ZNF408
          modifier: DECREASED
          term:
            id: hgnc:20041
            label: ZNF408
        relationship_type: CAUSATIVE
        subtype: ZNF408-FEVR
        notes: ZNF408 encodes a zinc finger protein; pathogenic variants cause FEVR with typically mild
          clinical phenotypes. ZNF408 variants may act partly outside the canonical Norrin/Wnt signaling
          pathway. In the largest infant cohort, patients with ZNF408 mutations presented the mildest
          clinical phenotypes compared to other FEVR genotypes.
      selected_evidence:
        snippet: discovery of pathological variants in additional genes such as CTNNB1, KIF11, and ZNF408,
          some of which operate outside of the Norrin Wnt-signaling pathway
        supports: SUPPORT
