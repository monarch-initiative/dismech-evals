            label: GABAergic neuron
        biological_processes:
        - preferred_term: TOR signaling
          modifier: INCREASED
          term:
            id: GO:0031929
            label: TOR signaling
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
