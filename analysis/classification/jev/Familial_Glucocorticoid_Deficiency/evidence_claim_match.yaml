        context: []
      assertion_type: Subtype
      assertion:
        name: FGD3
        display_name: FGD3 (STAR-Related, Partial Function)
        subtype_term:
          preferred_term: glucocorticoid deficiency 3
          term:
            id: MONDO:0012214
            label: glucocorticoid deficiency 3
        genes:
        - preferred_term: STAR
          term:
            id: hgnc:11359
            label: STAR
        description: Originally defined by linkage of unexplained FGD (unlinked to MC2R or MRAP) to a
          locus on chromosome 8, subsequently resolved as certain partial-function missense mutations
          (e.g., R192C, R188C) in STAR, encoding the steroidogenic acute regulatory protein that mediates
          the rate-limiting transfer of cholesterol across mitochondrial membranes for steroidogenesis;
          accounts for approximately 5-10% of FGD. This is distinct from classic, complete STAR loss-of-function,
          which instead causes lipoid congenital adrenal hyperplasia with combined adrenal and gonadal
          steroidogenic failure and disordered sex development in 46,XY individuals; the partial-function
          FGD3 variants retain enough residual StAR activity in the adrenal to spare mineralocorticoid
          and gonadal steroidogenesis while cortisol production still fails.
      selected_evidence:
        snippet: A locus on chromosome 8 has previously been linked to the disease in three families,
          but no underlying gene defect has to date been identified.
        supports: SUPPORT
    origin:
