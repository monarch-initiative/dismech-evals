          term:
            id: CL:0002097
            label: cortical cell of adrenal gland
      selected_evidence:
        snippet: Since MCM4 is one part of a MCM2-7 complex recently confirmed as the replicative helicase
          essential for normal DNA replication and genome stability in all eukaryotes, it is possible
          that our patients may have an increased risk of neoplastic change.
