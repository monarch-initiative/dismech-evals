        - preferred_term: MC2R
          term:
            id: hgnc:6930
            label: MC2R
        description: Caused by biallelic loss-of-function mutations in MC2R, the ACTH receptor itself,
          accounting for approximately 25% of FGD cases; the founding example is the c.220G>T (Ser74Ile)
          missense mutation in the second transmembrane domain. Most MC2R mutations are missense variants
          with varying degrees of impaired trafficking to the cell surface, often leaving some residual
          receptor function. Distinguished clinically from FGD2 by a later, more variable age of presentation
          (median 2.0 years) and unusually tall stature not seen in FGD2.
      selected_evidence:
        snippet: The affected male proband showed a single base mutation, ser74-->ile, in the sequence
          coding for the second transmembrane domain of the ACTH receptor.
        supports: SUPPORT
