      assertion_type: Subtype
      assertion:
        name: FGD2
        display_name: FGD2 (MRAP-Related)
        subtype_term:
          preferred_term: glucocorticoid deficiency 2
          term:
            id: MONDO:0011826
            label: glucocorticoid deficiency 2
        genes:
        - preferred_term: MRAP
          term:
            id: hgnc:1304
            label: MRAP
        description: Caused by biallelic loss-of-function mutations in MRAP, the single-pass transmembrane
          accessory protein required for trafficking MC2R from the endoplasmic reticulum to the cell surface;
          accounts for approximately 20% of FGD cases. Reported MRAP mutations are predominantly splice-site
          or nonsense variants predicted to abolish the transmembrane domain essential for MC2R interaction,
          so MC2R is retained in the ER rather than reaching the plasma membrane. Presents earlier than
          FGD1 (median age 0.08 years) and, unlike FGD1, is not associated with tall stature.
      selected_evidence:
        snippet: We show that MRAP interacts with MC2R and may have a role in the trafficking of MC2R
          from the endoplasmic reticulum to the cell surface.
        supports: SUPPORT
