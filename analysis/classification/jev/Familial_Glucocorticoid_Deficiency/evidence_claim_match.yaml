      assertion_type: Pathophysiology
      assertion:
        name: STAR-Mediated Cholesterol Transport Deficiency
        biological_scale: MOLECULAR
        description: STAR (steroidogenic acute regulatory protein) mediates the rate-limiting transfer
          of cholesterol from the outer to inner mitochondrial membrane in adrenocortical cells, the substrate-delivery
