        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Classic (STAR-Null) Lipoid Congenital Adrenal Hyperplasia
        description: Complete loss-of-function STAR mutations cause a severe, distinct disorder with combined
          adrenal and gonadal steroidogenic failure (glucocorticoid, mineralocorticoid, and sex steroid
          deficiency) and disordered sex development in 46,XY individuals, in contrast to the partial-function
          STAR mutations underlying FGD3, which spare mineralocorticoid and gonadal steroidogenesis.
        distinguishing_features:
        - Combined mineralocorticoid deficiency (salt-wasting) occurs in classic lipoid congenital adrenal
          hyperplasia but not FGD3.
        - Disordered sex development in 46,XY individuals occurs in classic lipoid congenital adrenal
          hyperplasia but not FGD3.
      selected_evidence:
        snippet: Mutations in STAR usually cause lipoid congenital adrenal hyperplasia, a disorder characterized
          by both gonadal and adrenal steroid deficiency. Our results demonstrate that certain mutations
          in STAR (R192C and the previously reported R188C) can present with a phenotype indistinguishable
          from that seen in FGD.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19773404
      reference_title: Nonclassic lipoid congenital adrenal hyperplasia masquerading as familial glucocorticoid
        deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Directly contrasts the combined-deficiency phenotype of classic STAR loss with the
        FGD-like phenotype of partial-function STAR mutations.
