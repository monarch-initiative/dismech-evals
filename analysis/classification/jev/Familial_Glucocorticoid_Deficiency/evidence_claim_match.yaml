            description: 'MCM4 is part of the MCM2-7 complex, the core replicative helicase required for
              normal DNA replication and genome stability in eukaryotic cells. Biallelic loss-of-function
              MCM4 variants define a third mechanistic route to adrenocortical failure, distinct from
              both ACTH-receptor-signaling failure (FGD1-3) and oxidative-stress-driven apoptosis of mature
              steroidogenic cells (FGD4-5): Mcm4-depleted mouse adrenal cortex shows grossly abnormal
              morphology, with non-steroidogenic GATA4- and Gli1-positive cells persisting within the
              cortex and reducing the number of cells that differentiate into steroidogenic zona fasciculata
              cells.'
