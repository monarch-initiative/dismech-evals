  91e5dd74de8157ccb92d68a2d6f3ecef239d612cd155e8499abc3e441bc0bfc0:
    claim:
      about:
        disease:
          name: Familial Glucocorticoid Deficiency
          disease_term:
            preferred_term: familial glucocorticoid deficiency
            term:
              id: MONDO:0008733
              label: familial glucocorticoid deficiency
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autoimmune Addison Disease and Other Combined-Deficiency Causes of Chronic Primary Adrenal
          Insufficiency
        description: Autoimmune Addison disease and other causes of combined-deficiency chronic primary
          adrenal insufficiency (e.g., adrenoleukodystrophy, adrenal hemorrhage, infiltrative or infectious
          adrenalitis) present with cortisol deficiency and hyperpigmentation similarly to FGD, but additionally
          lose zona glomerulosa (aldosterone) function, producing hyponatremia, hyperkalemia, salt-wasting,
          and compensatory hyperreninemia that are absent in FGD. FGD itself sits within the broader chronic
          primary adrenal insufficiency umbrella (see `parents`) as its isolated-glucocorticoid, genetic-only
          branch; this differential names the combined-deficiency causes within that same umbrella that
          must be excluded, of which autoimmune Addison disease (`kb/disorders/Addisons_Disease.yaml`)
          is the most common.
        disease_term:
          preferred_term: autoimmune primary adrenal insufficiency
          term:
            id: MONDO:0100480
            label: autoimmune primary adrenal insufficiency
        distinguishing_features:
        - Elevated plasma renin activity (compensatory hyperreninemia) occurs in combined-deficiency primary
          adrenal insufficiency but not FGD.
        - Decreased aldosterone (mineralocorticoid deficiency) occurs in combined-deficiency primary adrenal
          insufficiency but not FGD.
        - Hyponatremia, hyperkalemia, and salt-wasting occur in combined-deficiency primary adrenal insufficiency
          but not FGD.
      selected_evidence:
        snippet: characterized by elevated plasma ACTH, and low or undetectable cortisol in the absence
          of overt mineralocorticoid deficiency
