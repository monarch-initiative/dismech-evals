              the rate-limiting transfer of cholesterol across mitochondrial membranes for steroidogenesis;
              accounts for approximately 5-10% of FGD. This is distinct from classic, complete STAR loss-of-function,
              which instead causes lipoid congenital adrenal hyperplasia with combined adrenal and gonadal
              steroidogenic failure and disordered sex development in 46,XY individuals; the partial-function
              FGD3 variants retain enough residual StAR activity in the adrenal to spare mineralocorticoid
