      reference_title: Phenotypic characteristics of familial glucocorticoid deficiency (FGD) type 1 and
        2.
      evidence_source: HUMAN_CLINICAL
      explanation: States the preserved-mineralocorticoid-production biochemical hallmark that distinguishes
