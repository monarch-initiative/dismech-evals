        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preserved Zona Glomerulosa Mineralocorticoid Production
        biological_scale: TISSUE
        description: The zona glomerulosa (aldosterone-producing layer of the adrenal cortex, UBERON:0002053)
          is regulated principally by the renin-angiotensin-potassium axis rather than by ACTH, so it
          is functionally spared in FGD even when the ACTH-dependent zona fasciculata (cortisol-producing
          layer) fails. This is the mechanistic basis for the normal plasma renin activity and serum aldosterone
          that distinguish FGD from combined-deficiency forms of primary adrenal insufficiency, such as
          autoimmune Addison disease, congenital adrenal hyperplasia, or classic (complete) STAR-null
          lipoid congenital adrenal hyperplasia, in which mineralocorticoid production is also lost.
      selected_evidence:
        snippet: The biochemical findings are a markedly elevated plasma ACTH in the presence of low cortisol
          but with a preserved mineralocorticoid production and are characteristic of ACTH insensitivity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
