            term:
              id: MONDO:0008733
              label: familial glucocorticoid deficiency
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Triple A (Allgrove) Syndrome
        description: 'The classic clinical differential for FGD: also presents with ACTH-resistant primary
          adrenal insufficiency and preserved mineralocorticoid production, caused by biallelic AAAS variants
          (a nuclear pore complex protein), but is distinguished by the additional cardinal features of
          esophageal achalasia and alacrima, plus progressive neurological involvement not seen in isolated
          FGD.'
        distinguishing_features:
        - Esophageal achalasia is a defining feature of Triple A syndrome, absent in FGD.
        - Alacrima (deficient tear production) is a defining feature of Triple A syndrome, absent in FGD.
        - Progressive peripheral/central neuropathy or cerebellar ataxia occur in Triple A syndrome but
          not isolated FGD.
        - AAAS sequencing distinguishes the two when the clinical triad of Triple A syndrome is incomplete.
      selected_evidence:
        snippet: Of particular relevance to our patients is Triple A syndrome (OMIM 231550)
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
