          failure (FGD1-3) and oxidative-stress-driven apoptosis of mature steroidogenic cells (FGD4-5):
          Mcm4-depleted mouse adrenal cortex shows grossly abnormal morphology, with non-steroidogenic
          GATA4- and Gli1-positive cells persisting within the cortex and reducing the number of cells
          that differentiate into steroidogenic zona fasciculata cells.'
        genes:
        - preferred_term: MCM4
