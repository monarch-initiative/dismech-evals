          to generate high concentrations of NADPH, which TXNRD2 (thioredoxin reductase 2) and glutathione
          peroxidases require to detoxify reactive oxygen species by maintaining a high reduced-to-oxidized
          glutathione (GSH/GSSG) ratio. Biallelic loss-of-function variants in either NNT (FGD4) or TXNRD2
          (FGD5) impair this antioxidant axis specifically in adrenocortical mitochondria, without affecting
          ACTH receptor signaling itself.
