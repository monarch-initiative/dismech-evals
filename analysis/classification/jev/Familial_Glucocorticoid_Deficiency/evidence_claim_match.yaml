          described specifically in FGD type 1 (MC2R-related) but not FGD type 2 (MRAP-related); growth
          hormone and IGF-I levels are normal, and growth normalizes toward the population mean after
          glucocorticoid replacement is started.
        phenotype_term:
          preferred_term: Tall stature
          term:
            id: HP:0000098
            label: Tall stature
      selected_evidence:
        snippet: All patients demonstrated excessive linear growth over that predicted from parental indices
