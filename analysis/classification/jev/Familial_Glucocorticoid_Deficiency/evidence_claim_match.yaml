          a numbered subtype in the FGD1-5 series, so it is not curated here as a `has_subtypes` entry;
          only its adrenocortical (replicative-stress) mechanism is represented on this entry''s pathophysiology
          graph. ClinGen''s SCID-CID Gene Curation Expert Panel curates MCM4 against that separate disease
          term (MONDO:0012383) rather than against any FGD term, which is the same split this entry records.
          Read the relationship_type carefully: CAUSATIVE records that biallelic MCM4 loss of function
          is the mendelian cause of the disorder whose adrenal arm is modeled here, which is the only
          MCM4 gene-disease relationship reported. It is not a claim that MCM4 defines a numbered FGD
          subtype, and it is not read off the ClinGen row quoted below - that row reads Moderate, and
          it is against MONDO:0012383, a disease term this entry does not curate. As with the CIDEC and
          PLAAT3 records in the lipodystrophy entry, the value rests on the primary report and on OMIM/MONDO
          recognition of the locus rather than on a ClinGen classification against this entry''s disease.'
      selected_evidence:
        snippet: MCM4 | HGNC:6947 | primary immunodeficiency with natural-killer cell deficiency and adrenal
          insufficiency | MONDO:0012383 | AR | Moderate
        supports: SUPPORT
