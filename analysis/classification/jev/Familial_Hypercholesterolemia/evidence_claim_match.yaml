  735bb966cff0563583328047b2463ac84ca71d618b7bda43e827385eeaefb37c:
    claim:
      about:
        disease:
          name: Familial Hypercholesterolemia
          disease_term:
            preferred_term: Familial Hypercholesterolemia
            term:
              id: MONDO:0005439
              label: familial hypercholesterolemia
        context: []
      assertion_type: Genetic
      assertion:
        name: LDLR
        gene_term:
          preferred_term: LDLR
          term:
            id: hgnc:6547
            label: LDLR
        association: Pathogenic Mutations
        presence: Positive
        frequency: ~85-90%
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: 'Mutations in LDLR on chromosome 19p13.2 account for the majority of FH cases (~85-90%).
          Over 2000 different LDLR mutations have been described. LDLR variants are classified into five
          mechanistic classes: (1) null alleles with no receptor synthesis, (2) transport-defective alleles
          with impaired ER-to-Golgi processing, (3) binding-defective alleles with reduced LDL affinity,
          (4) internalization-defective alleles with impaired clustering in clathrin-coated pits, and
          (5) recycling-defective alleles with failure to release LDL and recycle to the cell surface.
          Class 1 (null) mutations generally cause the most severe phenotype, particularly in homozygous
          state, as they result in absent LDLR protein.

          '
        variants:
        - name: Class 1 - Null mutations
          description: 'No LDLR protein synthesized. Most severe class. Large deletions, frameshift, and
            nonsense mutations. Homozygous null patients have minimal response to statins since there
            is no residual receptor to upregulate.

            '
          type: 'null'
          clinical_significance: PATHOGENIC
        - name: Class 2 - Transport-defective
          description: 'LDLR protein synthesized but fails to properly fold or transport from ER to Golgi.
            Receptor is retained intracellularly and degraded.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: Class 3 - Binding-defective
          description: 'LDLR reaches cell surface but cannot bind LDL particles normally. Mutations affect
            the ligand-binding domain (repeats 2-7).

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: Class 4 - Internalization-defective
          description: 'LDLR binds LDL but fails to cluster in clathrin-coated pits for endocytosis. Mutations
            typically affect the cytoplasmic NPXY motif.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: Class 5 - Recycling-defective
          description: 'LDLR internalizes LDL but fails to release it in the endosome and does not recycle
            back to the cell surface. Receptor is degraded along with the ligand.

            '
          type: missense
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Most cases are caused by autosomal dominant mutations in LDLR, which encodes the LDL
          receptor
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
