        context:
        - path: /definitions/2
          value:
            name: FIND FH (machine-learning case detection)
            definition_type: PHENOTYPE_ALGORITHM
            derivation_basis: ESTABLISHED_CRITERIA
            description: Machine-learning (random forest) classifier developed by the FH Foundation's
              FIND FH initiative with Stanford to surface undiagnosed ("missed") FH patients from EHR
              data, rather than replicate a criteria checklist. Trained on known FH cases versus matched
              non-cases and used to flag high-probability candidates for confirmatory FH screening, addressing
              the >95% false-positive rate of simple LDL-C threshold screening.
            scope: EHR data (developed at Stanford Health Care; externally validated at the Geisinger
              Health System)
            notes: Unlike the DLCN/Simon Broome operationalizations, FIND FH is a predictive classifier
              optimized to find undiagnosed cases for downstream screening, not to render a diagnosis
              on its own.
          role: ancestor
      assertion_type: AlgorithmValidationStatus
      assertion:
        status: VALIDATED_AGAINST_GOLD_STANDARD
        rationale: The random forest achieved PPV 0.88 and sensitivity 0.75 on a held-out test set; external
          validation at Geisinger (466 FH patients, 236 genetically proven) achieved PPV 0.85, and chart
          review confirmed 84% of the highest-probability flags.
      selected_evidence:
        snippet: In external validation on 466 FH patients (236 with genetically proven FH) and 5000 matched
          non-cases from the Geisinger Healthcare System our FH classifier achieved a PPV of 0.85.
        supports: SUPPORT
