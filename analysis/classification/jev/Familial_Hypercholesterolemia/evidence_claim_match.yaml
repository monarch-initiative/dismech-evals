        association: Gain-of-Function Mutations
        presence: Positive
        frequency: <5%
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: 'Gain-of-function mutations in PCSK9 increase degradation of LDL receptors, reducing LDL
          clearance. PCSK9 binds the extracellular domain of LDLR and directs the complex to lysosomal
          degradation instead of allowing receptor recycling. Patients with PCSK9 gain-of-function mutations
          respond well to PCSK9 inhibitor therapy. Conversely, loss-of-function PCSK9 variants are associated
          with lower LDL-C and reduced cardiovascular risk.

          '
        variants:
        - name: D374Y (p.Asp374Tyr)
          description: 'One of the most severe PCSK9 gain-of-function mutations. Increases PCSK9 affinity
            for LDLR, leading to enhanced receptor degradation and severe hypercholesterolemia. Excellent
            response to PCSK9 inhibitor therapy.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: S127R (p.Ser127Arg)
          description: 'French Canadian founder mutation. Gain-of-function variant producing a moderately
            severe FH phenotype.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: F216L (p.Phe216Leu)
          description: 'Gain-of-function variant associated with FH. Enhances PCSK9-mediated LDLR degradation.

            '
          type: missense
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: PCSK9 discovery in FH by Abifadel et al.
        supports: SUPPORT
