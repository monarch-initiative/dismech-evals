      assertion_type: Definition
      assertion:
        name: PheKB EHR Phenotyping Algorithm for Familial Hypercholesterolemia (SEARCH)
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        description: Electronic-health-record ePhenotyping algorithm (Safarova & Kullo, Mayo Clinic) that
          operationalizes the Dutch Lipid Clinic Network (DLCN) diagnostic criteria from structured EHR
          fields plus natural language processing of family history and physical-exam FH stigmata (tendon
          xanthomas, corneal arcus). A structured-data prefilter first selects LDL-C >= 190 mg/dL with
          triglycerides < 400 mg/dL and no secondary causes of hyperlipidemia, after which DLCN points
          are scored. Published to the Phenotype KnowledgeBase (PheKB) and deployed in the SEARCH study;
          portable to eMERGE/OMOP sites.
        scope: Structured EHR plus clinical-note NLP (developed and deployed at Mayo Clinic; PheKB-published)
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: In the SEARCH cohort (131,000 primary-care patients) blinded expert chart review
            yielded positive and negative predictive values of 94% and 97%.
        criteria_sets:
        - name: Structured-data prefilter
          description: Coded-data prescreen applied before DLCN scoring.
          inclusion_criteria:
          - preferred_term: LDL-C >= 190 mg/dL
            description: Low-density lipoprotein cholesterol at or above 190 mg/dL.
          - preferred_term: Triglycerides < 400 mg/dL
            description: Excludes marked hypertriglyceridemia.
          exclusion_criteria:
          - preferred_term: Secondary causes of hyperlipidemia
            description: Excludes patients with identified secondary causes of hyperlipidemia.
        - name: Dutch Lipid Clinic Network criteria ascertainment
          description: DLCN scoring from structured data supplemented by note NLP.
          inclusion_criteria:
          - preferred_term: DLCN structured components
            description: LDL-C level and coded personal/family history of premature cardiovascular disease
              and hypercholesterolemia.
          - preferred_term: NLP-extracted family history and FH stigmata
            description: Natural language processing of notes for family history and physical-exam stigmata
              such as tendon xanthomas and corneal arcus.
        notes: Published to the Phenotype KnowledgeBase (PheKB) as "Electronic Health Record-based Phenotyping
          Algorithm for Familial Hypercholesterolemia." See also Kullo & Safarova, "Lessening the Burden
          of Familial Hypercholesterolemia Using Health Information Technology" (Circulation Research
          2018, PMID:29301842).
      selected_evidence:
        snippet: Our EHR-based algorithm ascertained the Dutch Lipid Clinic Network criteria for FH using
          structured data sets and natural language processing for family history and presence of FH stigmata
          on physical examination.
        supports: SUPPORT
