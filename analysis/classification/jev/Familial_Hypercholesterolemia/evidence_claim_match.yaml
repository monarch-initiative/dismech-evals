        association: Loss-of-Function Mutations
        presence: Positive
        frequency: <1%
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'Biallelic loss-of-function mutations in LDLRAP1 (also known as ARH) cause autosomal recessive
          hypercholesterolemia. LDLRAP1 encodes an adaptor protein required for clathrin-mediated endocytosis
          of the LDLR-LDL complex. Without functional LDLRAP1, LDLR cannot be properly internalized via
          clathrin-coated pits despite normal receptor expression. Phenotype can be as severe as HoFH
          but may be somewhat milder. Patients typically respond to statin therapy since LDLR can still
          be upregulated and can function in cell types that do not depend on ARH (e.g., fibroblasts).

          '
      selected_evidence:
        snippet: Variants in the LDLRAP1 gene causes FH with a recessive inheritance and a specific APOE
          variant was described as causative of FH, contributing to increase FH genetic heterogeneity.
        supports: SUPPORT
