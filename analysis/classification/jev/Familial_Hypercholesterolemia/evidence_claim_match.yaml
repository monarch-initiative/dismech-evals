        description: 'A fully human monoclonal antibody against ANGPTL3 (angiopoietin-like protein 3).
          Evinacumab works through an LDLR-independent mechanism, lowering LDL-C by approximately 50%
          at 15 mg/kg IV every 4 weeks. This is critical for HoFH patients with null LDLR mutations who
          do not respond to LDLR-dependent therapies. Long-term real-world data show sustained LDL-C reduction
          (56% at 6 months, sustained over 3.5 years) and improved cardiovascular event-free survival.
          Approved for pediatric patients age 5 and older with HoFH.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
