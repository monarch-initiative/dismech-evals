              label: Monoclonal Antibody
      selected_evidence:
        snippet: Real-life, long-term evinacumab adjunctive to lipid-lowering therapy including lipoprotein
          apheresis led to sustained low-density lipoprotein cholesterol lowering and improved cardiovascular
          event–free survival of patients with HoFH.
        supports: SUPPORT
