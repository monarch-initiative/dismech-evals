      - /disease_term
    evidence_metadata:
      reference: PMID:37543519
      reference_title: Relationship between lifestyle habits and cardiovascular risk factors in familial
        hypercholesterolemia.
      evidence_source: HUMAN_CLINICAL
      explanation: Healthy lifestyle showed no statistically significant association with LDL-C in FH
        (P=0.54), consistent with the genetic basis of hypercholesterolemia. However, favorable associations
        with HbA1c and trends for HDL-C suggest dietary modification benefits other CVD risk factors even
        if LDL-C reduction is modest.
