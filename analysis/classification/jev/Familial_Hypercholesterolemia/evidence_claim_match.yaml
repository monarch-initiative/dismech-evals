                label: exposure to socioeconomic factors
            description: 'Socioeconomic disparities significantly affect FH outcomes. Limited access to
              healthcare, genetic testing, specialist lipid clinics, and expensive therapies (PCSK9 inhibitors,
              evinacumab) creates inequities in diagnosis and treatment. The EAS 2023 consensus specifically
              addresses inequities in HoFH care worldwide and recommends creation of national screening
              programmes and education to improve awareness. Low health literacy, food insecurity, and
              inability to afford medications contribute to suboptimal outcomes.

              '
            effect: Delayed diagnosis, undertreatment, and worse cardiovascular outcomes
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Premature Atherosclerotic Cardiovascular Disease
        environmental_effect: EXACERBATES
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: 'An unusual link for this backfill, and worth stating why it is drawn the way it
          is. This exposure does not act on lipid biology at all: it acts on whether a diagnosis is made
          and whether treatment is accessible, and reaches the disease outcome through undertreatment.
          That is why it targets the cardiovascular endpoint rather than any mechanism node, and why the
          intervening step is recorded as known rather than unknown, the step being the lipid lowering
          that does not happen. The cited consensus statement is a set of recommendations rather than
          a measurement of outcome disparity, which is why it is partial.'
      selected_evidence:
        snippet: To improve HoFH care around the world, the statement recommends the creation of national
          screening programmes, education to improve awareness, and management guidelines that account
          for the local realities of care, including access to specialist centres, treatments, and cost.
        supports: SUPPORT
