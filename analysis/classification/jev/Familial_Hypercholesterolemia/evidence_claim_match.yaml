        context: []
      assertion_type: Definition
      assertion:
        name: FAMCAT (Familial Hypercholesterolaemia Case Ascertainment Tool)
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        description: Primary-care case-finding prediction model (Weng, Qureshi et al., University of Nottingham)
          that flags patients with high probability of FH from routine electronic primary-care records
          so they can be prioritized for further clinical assessment against established diagnostic criteria.
          The core FAMCAT model uses nine diagnostic variables (including total/LDL cholesterol, triglycerides,
          and family history of premature myocardial infarction and hypercholesterolemia); the FAMCAT2
          variant adds personal history of premature coronary heart disease. It is a statistical prediction
          model rather than a criteria checklist.
        scope: Routine UK primary-care EHR (derived and validated on the Clinical Practice Research Datalink,
          CPRD)
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: Derived and validated on 2,975,281 CPRD patients including 5050 documented FH cases;
            the nine-variable model achieved AUC 0.860 (95% CI 0.848-0.871), and external validation and
            head-to-head studies show it outperforms the Simon Broome, DLCN, and 99th-centile-cholesterol
            approaches.
        notes: A logistic-regression prediction model intended to prioritize individuals for further assessment
          using established diagnostic criteria, not a standalone diagnosis. Externally validated (Lancet
          Public Health 2019) and shown to outperform Simon Broome / DLCN in head-to-head primary-care
          studies (PMID:34635577).
      selected_evidence:
        snippet: Data were analysed for 2,975,281 patients with total or LDL-cholesterol measurement from
          1 Jan 1999 to 31 August 2013 using the Clinical Practice Research Datalink (CPRD). Included
          in this cohort study were 5050 documented cases of FH.
        supports: SUPPORT
