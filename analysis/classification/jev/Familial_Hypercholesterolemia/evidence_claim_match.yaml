  47d87e3a15b3877310c47c16dbecc517c9da4ce2a5897475f9538237b361ffc8:
    claim:
      about:
        disease:
          name: Familial Hypercholesterolemia
          disease_term:
            preferred_term: Familial Hypercholesterolemia
            term:
              id: MONDO:0005439
              label: familial hypercholesterolemia
        context: []
      assertion_type: Treatment
      assertion:
        name: Dietary Modification
        description: 'Heart-healthy dietary patterns are foundational but insufficient as sole therapy
          in FH. Key dietary interventions include: reduction of saturated fat to <7% of total calories,
          elimination of trans fats, increase in dietary fiber (especially soluble fiber from oats, legumes,
          psyllium), incorporation of plant stanols/sterols (2g/day can reduce LDL-C by 6-15%), omega-3
          fatty acids from fish, and a Mediterranean-style diet rich in fruits, vegetables, whole grains,
          and olive oil. Dietary modification can provide an additional 10-15% LDL-C reduction on top
          of pharmacotherapy.

          '
        treatment_term:
          preferred_term: Dietary Intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
      selected_evidence:
        snippet: we found no evidence of an association between the HLS and concentrations of LDL-cholesterol
          (β = 0.04, 95% CI = -0.08, 0.15 mmol/L; P = 0.54). However, the HLS was favorably associated
          with HbA1c levels
        supports: SUPPORT
    origin:
      assertion_path: /treatments/11
      evidence_path: /treatments/11/evidence/1
      context_paths:
