          50% for first-degree relatives of an affected individual (autosomal dominant). Early identification
          allows treatment initiation before significant atherosclerotic burden develops.

          '
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Cascade screening can contribute to early diagnosis of the disease in family members
          of an affected individual, which is crucial because familial hypercholesterolaemia can be asymptomatic
          for decades.
        supports: SUPPORT
