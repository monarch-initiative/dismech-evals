              label: familial hypercholesterolemia
        context: []
      assertion_type: Biochemical
      assertion:
        name: Phospholipids to total lipids in very large VLDL, percent (XL-VLDL-PL%)
        specificity: 'Research NMR lipoprotein-composition ratio, not a clinical FH test. Ranked as the
          metabolite with the largest risk-increasing Mendelian randomization effect estimate for familial
          hypercholesterolaemia across 313 plasma measures in a 274,241-participant UK Biobank atlas.

          '
        context: 'XL-VLDL-PL% is one of 313 plasma measures on the Nightingale Health NMR platform used
          in UK Biobank. No presence value is recorded because the reported quantity is a genetically
          instrumented effect estimate rather than an observed patient-versus-control level. The estimate
          must not be read as evidence that this metabolite causes monogenic FH: LDLR, APOB and PCSK9
          defects impair receptor-mediated clearance of all apoB-containing lipoproteins, so genetic instruments
          for VLDL composition and for the FH diagnosis share the same lipoprotein-handling genes. What
          the finding does add is that compositional remodelling of large triglyceride-rich lipoproteins
          is part of the FH lipoprotein signature, beyond the LDL-C measurement that defines the disorder
          clinically.

          '
        readouts:
        - target: Reduced Hepatic LDL Clearance
          relationship: CORRELATES_WITH
          direction: POSITIVE
          interpretation: 'Curatorial mapping, not a claim made by the source: phospholipid enrichment
            of very large VLDL tracks impaired receptor-mediated clearance of apoB-containing lipoproteins,
            of which LDL is the best-measured member.

            '
      selected_evidence:
        snippet: the ratio of phospholipids to total lipids in the very large VLDL percentage (XL-VLDL-PL%)
          exhibited the largest effect size in increasing the risk of familial hypercholesterolaemia (odds
          ratio (OR) = 5.03 (3.97-6.38)
        supports: SUPPORT
