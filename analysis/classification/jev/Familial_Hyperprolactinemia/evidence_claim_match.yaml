          role is less defined. Loss of receptor signalling is proposed to impair fertility independently
          of ovulation: one heterozygous carrier was infertile with normal ovulatory cycles, and Prlr-null
          female mice are sterile from implantation failure. The human step is inferred, not demonstrated.'
        biological_scale: TISSUE
      selected_evidence:
        snippet: Indeed, prolactin and the prolactin receptor have been reported to have roles in the
          luteal phase and peri-implantation period, and abnormalities of circulating prolactin have been
          associated with early pregnancy loss.
