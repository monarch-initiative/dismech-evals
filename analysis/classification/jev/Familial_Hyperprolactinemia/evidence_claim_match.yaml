        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fhp_reproductive_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does PRLR loss of function cause oligomenorrhea, and does reduced receptor signalling
          in the reproductive tract cause the infertility?
        attaches_to:
        - phenotypes#Oligomenorrhea
        - phenotypes#Menorrhagia
        - pathophysiology#Reproductive Tract Prolactin Resistance
        rationale: Acquired hyperprolactinemia suppresses the gonadal axis through prolactin acting on
          its hypothalamic receptor. Heterozygous carriers keep one wild-type allele, and co-expression
          only reduced signalling, so residual signalling at very high prolactin could still suppress
          GnRH pulsatility; the discovery paper proposes this age-related mechanism, and a role for mixed
          mutant/wild-type receptor dimers, without testing either. The menstrual phenotypes are therefore
          left unconnected to a mechanism. The infertility node rests on one carrier and on complete-knockout
          mice, not on any measurement of luteal or implantation function in a patient.
      selected_evidence:
        snippet: Furthermore, the balance among the normal prolactin-receptor homodimers, mutant homodimers,
          and heterodimers within cells of the hypothalamic–pituitary–gonadal axis may also contribute
          to these phenotypic variations.
        supports: SUPPORT
