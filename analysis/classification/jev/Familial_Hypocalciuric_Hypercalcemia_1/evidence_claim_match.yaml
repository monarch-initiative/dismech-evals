  dc6be743460a0d4c1f88845200ba96c2a5e60e10ebf63aff29e26d2981fc9801:
    claim:
      about:
        disease:
          name: Familial Hypocalciuric Hypercalcemia 1
          disease_term:
            preferred_term: familial hypocalciuric hypercalcemia 1
            term:
              id: MONDO:0007791
              label: familial hypocalciuric hypercalcemia 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Parathyroid Localization Imaging
        description: 'Listed here to record what it does not do. Sestamibi scintigraphy, ultrasound and
          4D-CT locate parathyroid tissue for a surgeon who has already decided to operate; they do not
          establish that the hypercalcaemia is parathyroid-driven in the first place, and a positive study
          does not exclude FHH1. A positive scan in a patient whose biochemistry has not resolved the
          differential is therefore not a reason to proceed, and this is a documented route to an operation
          that cannot work: in the case cited below, scintigraphy showed focal uptake beside the thyroid,
          that finding together with a mildly raised PTH settled a diagnosis of primary hyperparathyroidism,
          and the patient was still hypercalcaemic months after a total parathyroidectomy.

          Two further traps in the same case are worth recording. The uptake sat above the left thyroid
          lobe, which is also where a thyroid nodule sits, and the resected glands showed four-gland mild
          hyperplasia - a feature of FHH1 itself rather than evidence against it, so the operative histology
          did not correct the error either. The order of evidence that should have governed the decision
          is the reverse of the one followed: the differential rests on the biochemistry and on CASR genotype,
          not on where an isotope collects.'
        diagnosis_term:
          preferred_term: parathyroid localization imaging
          term:
            id: NCIT:C16502
            label: Diagnostic Imaging Testing
      selected_evidence:
        snippet: A diagnosis of PHPT was made likely secondary to parathyroid hyperplasia or a parathyroid
          adenoma. This was based on the elevated PTH concentration and scintigraphy results.
        supports: SUPPORT
