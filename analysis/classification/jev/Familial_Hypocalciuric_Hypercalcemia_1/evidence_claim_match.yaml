      assertion_type: Diagnosis
      assertion:
        name: Calcium/Creatinine Clearance Ratio
        description: 'The discriminating test, from paired serum and 24-hour urine calcium and creatinine.
          It is a screening step and not a rule: roughly a fifth of FHH patients are not hypocalciuric
          by the strict cut-off, and a substantial minority of primary hyperparathyroidism patients fall
          below it, so the ratio stratifies who should be sequenced rather than settling the diagnosis.
          Recent thiazide use, lithium, low calcium intake and vitamin D deficiency all move it.'
        diagnosis_term:
          preferred_term: Laboratory Procedure
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: Overlap analysis revealed that a cut-off point for CCCR at < 0.020 would sample 98% (53/54)
          of all patients with FHH and include 35% (34/97) of the PHPT patients.
        supports: SUPPORT
