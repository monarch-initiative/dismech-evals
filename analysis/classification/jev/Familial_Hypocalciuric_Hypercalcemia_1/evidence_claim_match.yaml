        name: Cinacalcet
        description: A calcimimetic - a positive allosteric modulator that lowers the calcium concentration
          needed to activate the receptor - and therefore a drug aimed at the actual lesion rather than
          at the number. It is reserved for the minority with symptomatic or marked hypercalcaemia, since
          most carriers need nothing. Reported to lower serum calcium and improve calcium clearance, and
          used successfully in the neonatal forms as well.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
