  65497e54d36985e05f56e10e3d9a04526baf4a5a3888b0e4e8f298d690b3104c:
    claim:
      about:
        disease:
          name: Familial Hypocalciuric Hypercalcemia 1
          disease_term:
            preferred_term: familial hypocalciuric hypercalcemia 1
            term:
              id: MONDO:0007791
              label: familial hypocalciuric hypercalcemia 1
        context: []
      assertion_type: Subtype
      assertion:
        name: NSHPT
        display_name: Neonatal severe hyperparathyroidism (biallelic CASR loss of function)
        description: 'Homozygous or compound heterozygous inactivating CASR variants remove calcium sensing
          almost entirely rather than blunting it, and the result is a different disease in severity and
          urgency: marked hypercalcaemia presenting in the first days of life with muscular weakness,
          respiratory distress, fractures and failure to thrive, carrying real mortality. It is curated
          here as a subtype rather than as a separate entry because the lesion is the same receptor at
          a higher dose, which is the relationship the entry''s genetic block records.

          Management inverts the adult rule. Parathyroidectomy is generally inappropriate in FHH1 and
          is the definitive treatment in NSHPT, and subtotal resection is reported as ineffective. A neonate
          carrying a single paternally inherited or de novo variant may instead present with the milder
          neonatal hyperparathyroidism that resolves over the first months, so the biallelic and monoallelic
          neonatal presentations must be distinguished before committing to surgery.'
      selected_evidence:
        snippet: Infants with NSHPT develop significant and symptomatic hypercalcemia with muscular weakness,
          respiratory distress, fractures, and failure to thrive in the early days of life
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
