        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of Parathyroidectomy
        description: The single most consequential management decision in the disease, and the reason
          the diagnosis matters. Parathyroidectomy is the treatment for primary hyperparathyroidism and
          is inappropriate here, because the glands are responding correctly to a receptor that under-reports
          calcium; removing them does not reset the set point. The exception is the neonatal biallelic
          subtype, where parathyroidectomy is the definitive treatment and subtotal resection is reported
          as ineffective.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: In children, adolescents and young adults with FHH the main challenge is to distinguish
          the condition from primary hyperparathyroidism and thereby to avoid unnecessary treatments including
          parathyroidectomy.
        supports: SUPPORT
