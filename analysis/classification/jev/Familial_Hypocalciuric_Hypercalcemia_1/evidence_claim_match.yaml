        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Increased Renal Tubular Calcium Reabsorption
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: In the thick ascending limb the receptor normally responds to a rise in blood calcium
          by reducing paracellular calcium permeability, acting through the tight-junction protein claudin-14.
          A blunted receptor does not apply that brake, so calcium continues to be reabsorbed at concentrations
          where it should be shed. This is the limb that converts what would otherwise be ordinary hypercalcaemia
          into the hypocalciuric form.
        biological_processes:
        - preferred_term: paracellular calcium reabsorption in the thick ascending limb
          modifier: INCREASED
          term:
            id: GO:0006816
            label: calcium ion transport
      selected_evidence:
        snippet: Functional studies demonstrate that hypercalcemia-induced increases in urinary calcium
          excretion depend on renal CASR signaling, primarily through reduced paracellular calcium permeability
          in the TAL. Loss of the renal Casr in mice impairs urinary calcium excretion in conditions of
          hypercalcemia.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42261748
      reference_title: Role of the calcium-sensing receptor in regulating calcium transport in the thick
        ascending limb.
