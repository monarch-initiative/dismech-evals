  0f9f1ee61c63ed22b6e69f745700fbbd01eaa85fadf1d622133e7b88cbd13db5:
    claim:
      about:
        disease:
          name: Familial Hypocalciuric Hypercalcemia 1
          disease_term:
            preferred_term: familial hypocalciuric hypercalcemia 1
            term:
              id: MONDO:0007791
              label: familial hypocalciuric hypercalcemia 1
        context: []
      assertion_type: Phenotype
      assertion:
        category: Renal
        name: Absence of Nephrolithiasis and Nephrocalcinosis
        description: 'Recorded because the rarity of these complications is mechanistically informative
          rather than merely unremarkable. Chronic hypercalcaemia normally produces stones and nephrocalcinosis
          by way of hypercalciuria; the renal limb of the CASR lesion removes that intermediate step,
          so the renal burden that defines primary hyperparathyroidism is markedly lower here. The claim
          is comparative, not absolute: nephrolithiasis is reported in the moderate-to-severe end of the
          FHH1 range, which is why the REFUTE item below is carried alongside.

          Curated as a negative phenotype, and deliberately carrying NO phenotype_term and NO frequency.
          The schema has no negation slot and FrequencyEnum has no EXCLUDED value, so binding HP:0000787
          with a frequency here would export as the assertion that FHH1 patients have nephrolithiasis
          - the inverse of the point, and it would invert this entry''s own argument for distinguishing
          FHH1 from primary hyperparathyroidism. The REFUTE grading on an evidence item is claim-relative
          and never reaches the phenotype assertion, so it cannot substitute. This follows the pattern
          in Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11 ("Absence of Retinitis Pigmentosa") and Amyotrophic_Lateral_Sclerosis_27_Juvenile
          ("Absence of Sensory Neuropathy").'
      selected_evidence:
        snippet: Although typically asymptomatic, some patients with moderate-to-severe hypercalcemia
          may present with classical hypercalcemic symptoms (i.e., polyuria- polydipsia, fatigue, acute
          and chronic pancreatitis, gallstones and chondrocalcinosis, acute pancreatitis, chondrocalcinosis,
          and nephrolithiasis)
        supports: REFUTE
    origin:
      assertion_path: /phenotypes/6
      evidence_path: /phenotypes/6/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35566721
      reference_title: 'Disorders of the Calcium Sensing Signaling Pathway: From Familial Hypocalciuric
        Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.'
      evidence_source: OTHER
      explanation: Refutes an absolute reading of this absence - nephrolithiasis is named among the presentations
        seen with moderate-to-severe hypercalcaemia, so the defensible claim is comparative rather than
        categorical.
