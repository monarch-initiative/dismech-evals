            label: CASR
        relationship_type: CAUSATIVE
        notes: 'CASR is one of the clearest allelic series in medicine, and FHH1 is best read against
          the rest of it: heterozygous loss of function gives this disease, biallelic loss of function
          gives neonatal severe hyperparathyroidism, and heterozygous gain of function gives autosomal
          dominant hypocalcaemia type 1, curated separately in this knowledge base. One receptor, dosed
          in both directions from normal.

          Two limits on genetic testing are worth recording. FHH1 accounts for roughly two-thirds of FHH;
          the remainder is FHH2 (GNA11) and FHH3 (AP2S1), which affect the receptor''s downstream partners
          rather than the receptor itself and are clinically similar, so a negative CASR result does not
          exclude FHH. And within CASR, variant interpretation carries the usual difficulty that a rare
          missense change of uncertain significance is not by itself a diagnosis.'
        case_fractions:
        - population: Familial hypocalciuric hypercalcemia, all genetic subtypes
          case_fraction_percent: 65.0
          notes: Share of FHH attributable to CASR (FHH1) rather than GNA11 (FHH2) or AP2S1 (FHH3).
      selected_evidence:
        snippet: We demonstrate that mutations in the human Ca(2+)-sensing receptor gene cause familial
          hypocalciuric hypercalcemia (FHH) and neonatal severe hyperparathyroidism (NSHPT), two inherited
          conditions characterized by altered calcium homeostasis.
        supports: SUPPORT
