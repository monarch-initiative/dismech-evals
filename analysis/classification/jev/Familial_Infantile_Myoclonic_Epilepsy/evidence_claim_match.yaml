          in later families). The founding alleles lose TBC1D24's neurite-promoting activity in cultured
          neurons. Partial rather than complete loss of function is inferred from the in-frame nature
          of the alleles and from the absence of the axon-formation defect in neurons from a mildly affected
          patient; it has not been measured directly. The protein is expressed mainly in cerebral cortex
          and hippocampus.
