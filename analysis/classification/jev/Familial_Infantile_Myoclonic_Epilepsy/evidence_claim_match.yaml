            term:
              id: MONDO:0011506
              label: familial infantile myoclonic epilepsy
        context: []
      assertion_type: Genetic
      assertion:
        name: TBC1D24
        notes: TBC1D24 (16p13.3) encodes a protein with a TBC (Rab-GAP-like) domain and a C-terminal TLDc
          domain; it binds the small GTPase ARF6 and is expressed mainly in cerebral cortex and hippocampus.
          The founding FIME family carries compound heterozygous D147H and A509V missense variants. Later
          FIME families carry homozygous E153K or an in-frame 12-bp deletion (c.241_252del12), so the
          FIME alleles reported so far all leave the protein in frame.
        gene_term:
          preferred_term: TBC1D24
          term:
            id: hgnc:29203
            label: TBC1D24
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: We found a homozygous missense mutation, c.457G>A/p.Glu153Lys, in the two affected brothers.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
