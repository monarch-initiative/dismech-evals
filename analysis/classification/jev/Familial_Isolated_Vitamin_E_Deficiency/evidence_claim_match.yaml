              label: familial isolated deficiency of vitamin E
        context: []
      assertion_type: Genetic
      assertion:
        name: TTPA
        association: Causal Biallelic Loss-of-Function Variants
        gene_term:
          preferred_term: TTPA
          term:
            id: hgnc:12404
            label: TTPA
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        features: Biallelic pathogenic variants in TTPA (chromosome 8q12.3) cause familial isolated vitamin
          E deficiency. Truncating variants (most notably the Mediterranean/North African founder frameshift
          c.744delA, as well as c.513insTT, c.219insAT, and c.717delC) produce a severe early-onset phenotype
          with higher risk of cardiomyopathy and retinitis pigmentosa, whereas missense variants (such
          as p.Gly246Arg, p.His101Gln, p.Ala120Thr, and p.Arg192His) preserve partial alpha-TTP activity
          and correlate with milder, later-onset, slowly progressive disease.
        variants:
        - name: c.744delA
          type: Frameshift Variant
          clinical_significance: PATHOGENIC
          identifiers:
          - dbSNP:rs121909545
          description: Mediterranean and North African founder frameshift variant accounting for the majority
            of mutant alleles in North Africa and Italy; associated with early onset and severe phenotype.
        - name: c.219insAT
          type: Frameshift Variant
          clinical_significance: PATHOGENIC
          description: Severe truncating insertion variant identified in homozygous state in Italian AVED
            patients.
        - name: p.Gly246Arg
          type: Missense Variant
          clinical_significance: PATHOGENIC
          description: Missense TTPA variant associated with a mild and slowly progressive neurological
            phenotype.
        - name: c.717delC
          type: Frameshift Variant
          clinical_significance: PATHOGENIC
          description: Frameshift variant in exon 5 of TTPA reported in association with AVED complicated
            by retinitis pigmentosa and macular degeneration.
      selected_evidence:
        snippet: A 744delA mutation accounts for 68% of the mutant alleles in the 17 families analysed
          and appears to have spread in North Africa and Italy. This mutation correlates with a severe
          phenotype but alters only the C-terminal tenth of the protein.
        supports: SUPPORT
