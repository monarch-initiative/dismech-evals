        snippet: 'Compilation of the clinical records of 43 patients with documented mutation in the alpha-TTP
          gene revealed differences from Friedreich ataxia: cardiomyopathy was found in only 19% of cases,
          whereas head titubation was found in 28% of cases and dystonia in an additional 13%.'
