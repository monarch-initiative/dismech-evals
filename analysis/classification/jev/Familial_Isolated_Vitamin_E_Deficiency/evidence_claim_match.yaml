        name: Friedreich ataxia
        description: Autosomal recessive spinocerebellar ataxia caused by FXN GAA trinucleotide repeat
          expansion that closely mimics AVED clinically (progressive gait and limb ataxia, dysarthria,
          loss of proprioception, areflexia, and Babinski sign). AVED is distinguished by severely reduced
          plasma vitamin E levels, more frequent head titubation (28%) and dystonia, less frequent cardiomyopathy
          (19%), absence of FXN repeat expansion, and dramatic stabilization with vitamin E therapy.
        distinguishing_features:
        - Normal plasma vitamin E concentration in Friedreich ataxia vs. severely reduced plasma vitamin
          E in AVED
        - Lower frequency of cardiomyopathy (19% in AVED vs. majority of classic Friedreich ataxia patients)
        - Higher frequency of head titubation (28%) and pigmentary retinopathy in AVED
        - Biallelic TTPA pathogenic variants in AVED vs. FXN GAA repeat expansion in Friedreich ataxia
        disease_term:
