              label: familial isolated deficiency of vitamin E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oxidative Neuronal Damage
        description: 'Loss of the lipid-soluble antioxidant vitamin E leaves neuronal and axonal membranes
          unprotected against lipid peroxidation and reactive oxygen species. Large-caliber myelinated
          sensory neurons of the dorsal root ganglia, the posterior columns (dorsal columns), and cerebellar
          pathways are preferentially vulnerable, producing the spinocerebellar degeneration that clinically
          resembles Friedreich ataxia.

          '
        cell_types:
        - preferred_term: dorsal root ganglion sensory neuron
          term:
            id: CL:1001451
            label: sensory neuron of dorsal root ganglion
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
        - preferred_term: lipid peroxidation
          term:
            id: GO:0034440
            label: lipid oxidation
          modifier: INCREASED
      selected_evidence:
        snippet: "is a rare autosomal recessive neurodegenerative disease \ncharacterized clinically by\
          \ symptoms with often striking resemblance to those of \nFriedreich ataxia."
        supports: SUPPORT
