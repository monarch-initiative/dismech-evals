          disease_term:
            preferred_term: Ataxia with vitamin E deficiency
            term:
              id: MONDO:0010188
              label: familial isolated deficiency of vitamin E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Alpha-Tocopherol Transfer Protein Deficiency
        description: 'Biallelic loss-of-function variants in TTPA abolish hepatic alpha-tocopherol transfer
          protein (alpha-TTP) activity. Alpha-TTP normally selects and transfers RRR-alpha-tocopherol
          within hepatocytes for incorporation into nascent very-low-density lipoprotein (VLDL); without
          functional alpha-TTP, alpha-tocopherol is not retained or re-secreted into plasma lipoproteins
          and is instead excreted, so dietary vitamin E cannot reach peripheral tissues.

          '
        biological_processes:
        - preferred_term: vitamin transport
          term:
            id: GO:0051180
            label: vitamin transport
          modifier: DECREASED
        - preferred_term: VLDL alpha-tocopherol incorporation
          term:
            id: GO:0034379
            label: very-low-density lipoprotein particle assembly
          modifier: ABNORMAL
      selected_evidence:
        snippet: "AVED patients have an \nimpaired ability to incorporate alpha-tocopherol into lipoproteins\
          \ secreted by \nthe liver, a function putatively attributable to the alpha-tocopherol transfer\
          \ \nprotein (alpha-TTP)."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
