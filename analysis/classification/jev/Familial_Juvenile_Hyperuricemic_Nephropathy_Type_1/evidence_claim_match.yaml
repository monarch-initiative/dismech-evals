      assertion:
        name: Mutant Uromodulin Retention in the Endoplasmic Reticulum
        description: Misfolded uromodulin cannot leave the ER of thick ascending limb cells; it binds
          ER chaperones (BiP, calnexin, PDI) and forms intracytoplasmic aggregates seen on kidney biopsy,
          with bundled and cystic ER on electron microscopy. Less uromodulin reaches the apical membrane
          and urine. Some mutant protein escapes, reaches the membrane and forms extracellular aggregates
          with a dominant-negative effect on co-expressed wild-type protein.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: protein folding in endoplasmic reticulum
          modifier: DECREASED
          term:
            id: GO:0034975
            label: protein folding in endoplasmic reticulum
        cell_types:
        - preferred_term: thick ascending limb epithelial cell
          term:
            id: CL:1001106
            label: kidney loop of Henle thick ascending limb epithelial cell
      selected_evidence:
        snippet: UMOD mutations have a common gain-of-toxic-function effect, causing mutant uromodulin
          retention in the endoplasmic reticulum (ER).
        supports: SUPPORT
