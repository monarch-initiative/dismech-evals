          NSAID use should be avoided, though short courses may be used for gout before stage 3 CKD. ACE
          inhibitors are contraindicated in pregnancy because of fetal harm. A single case report describes
          a reversible rise in creatinine on fenofibrate.
        therapeutic_modality: BEHAVIORAL
      selected_evidence:
        snippet: The use of angiotensin-converting enzyme inhibitors even in early pregnancy can result
          in fetal damage and death.
        supports: SUPPORT
