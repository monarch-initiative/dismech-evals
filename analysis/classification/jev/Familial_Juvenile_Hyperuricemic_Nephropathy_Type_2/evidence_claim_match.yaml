            label: REN
        description: The most common and most severe group. Variants reduce the hydrophobicity of the
          signal peptide so preprorenin is not translocated into the endoplasmic reticulum. Presentation
          is usually in childhood with anemia, sometimes with acute kidney injury or with anemia, acidosis
          and kidney failure; median age at kidney failure was 57 years.
      selected_evidence:
        snippet: Signal group patients were most severely affected, presenting at a mean age of 19.7 years,
