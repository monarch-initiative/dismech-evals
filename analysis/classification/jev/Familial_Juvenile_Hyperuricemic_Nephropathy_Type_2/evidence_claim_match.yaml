        biological_processes:
        - preferred_term: renin secretion into blood stream
          modifier: DECREASED
          term:
            id: GO:0002001
            label: renin secretion into blood stream
        notes: The DECREASED modifier on aspartic-type endopeptidase activity refers to the renin enzymatic
          activity produced and secreted, measured in cell culture media and seen clinically as low plasma
          renin activity. It is not a claim that each mature renin molecule from the normal allele is
          less active.
