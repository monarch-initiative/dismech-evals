          (for example Asp578His) cause sporadic testotoxicosis or Leydig cell tumours and are outside
          this entry. No ClinGen gene-disease validity record was found for this pair.
      selected_evidence:
        snippet: A single A-->G base change that results in substitution of glycine for aspartate at position
          578 in the sixth transmembrane helix of the LH receptor was found in affected individuals from
          eight different families.
