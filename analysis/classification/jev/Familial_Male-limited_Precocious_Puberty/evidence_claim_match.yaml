        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Heterozygous constitutively activating missense variants, most in exon 11 (Asp578Gly, Asp578Tyr,
          Thr577Ile, Ala568Val, Met398Thr and others). Loss-of-function LHCGR variants cause the opposite
