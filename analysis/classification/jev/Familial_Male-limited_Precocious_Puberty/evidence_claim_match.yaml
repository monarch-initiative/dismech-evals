      assertion_type: Discussion
      assertion:
        discussion_id: fmpp_female_carrier_mouse_mismatch
        prompt: Why does the same activating LH receptor variant leave women unaffected but make female
          mice infertile with ovarian cysts and granulosa cell tumours?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - inheritance#Male-limited expression
        - animal_models#Mouse
        rationale: Male-limited expression in humans is explained by the need for FSH-driven granulosa
          cell aromatase in the ovary. The knock-in female mouse does not follow this pattern, which points
          to species differences in ovarian LH receptor expression and regulation. Female mouse data therefore
          cannot be used to predict the reproductive health of human female carriers.
      selected_evidence:
        snippet: These studies demonstrate that activating LHCGR mutations do not produce the same phenotype
          in female mice as in humans and clearly illustrate species differences in the expression and
          regulation of LHCGR in the ovary, but not in the testis.
        supports: SUPPORT
