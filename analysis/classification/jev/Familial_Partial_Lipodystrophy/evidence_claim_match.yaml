  8ff9f5612a549a7941030b2726ef55689e33cfb1dc9d918f7ad4e1a1e7a741e3:
    claim:
      about:
        disease:
          name: Familial Partial Lipodystrophy
          disease_term:
            preferred_term: Familial Partial Lipodystrophy
            term:
              id: MONDO:0020088
              label: familial partial lipodystrophy
        context: []
      assertion_type: Genetic
      assertion:
        name: NOTCH3 gain-of-function variants
        relationship_type: UNKNOWN
        variant_origin: GERMLINE
        notes: 'Heterozygous missense variants clustered in the heterodimerization domain of the NOTCH3
          negative regulatory region were reported in three unrelated families with familial partial lipodystrophy,
          with patient fibroblasts showing raised NOTCH3 expression and activation of senescence pathways.
          No subtype is assigned. OMIM has folded this gene-disease relationship into phenotype MIM 608600
          (familial partial lipodystrophy type 1, the Koebberling type), and MONDO therefore records NOTCH3
          as the causal gene of MONDO:0012072; the source report instead describes its families as a novel
          subtype of FPL and does not call them Koebberling, so this entry curates the gene without asserting
          that equivalence (see the review_notes on the FPLD1 subtype). relationship_type is UNKNOWN:
          the evidence is a single 2025 publication, the ClinGen validity table committed in this repository
          has no NOTCH3 row for any lipodystrophy (its only NOTCH3 row is a Disputed pulmonary arterial
          hypertension curation), and that publication carries an erratum (PMID:41147879) whose content
          could not be retrieved - see the FPLD1 review_notes.'
        gene_term:
          preferred_term: NOTCH3
          term:
            id: hgnc:7883
            label: NOTCH3
        inheritance:
        - name: Autosomal dominant
      selected_evidence:
        snippet: We conclude that gain-of-function missense variants in the negative regulatory region
          of NOTCH3 cause a novel subtype of FPL by activation of senescence pathways.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/8
      evidence_path: /genetic/8/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39652711
      reference_title: Gain of Function NOTCH3 Variants Cause Familial Partial Lipodystrophy Due to Activation
        of Senescence Pathways.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' own conclusion, which describes the entity as a novel subtype of familial
        partial lipodystrophy rather than as the Koebberling type that OMIM and MONDO attach the gene
        to.
