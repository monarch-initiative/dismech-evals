          term:
            id: CL:0000136
            label: adipocyte
        biological_processes:
        - preferred_term: Lipid droplet organization
          term:
            id: GO:0034389
            label: lipid droplet organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: In addition to describing a novel autosomal recessive form of familial partial lipodystrophy,
          these observations also suggest that CIDEC is required for unilocular lipid droplet formation
          and optimal energy storage in human fat.
        supports: SUPPORT
