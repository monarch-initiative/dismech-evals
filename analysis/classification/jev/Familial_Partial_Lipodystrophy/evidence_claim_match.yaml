        context: []
      assertion_type: Genetic
      assertion:
        name: MFN2 variants
        variant_origin: GERMLINE
        notes: 'Rare cases of partial lipodystrophy are associated with MFN2; identified in 0.9% of a
          genetically confirmed FPLD cohort. No subtype is assigned and relationship_type is left unset,
          because the entity ClinGen curates for MFN2 is not familial partial lipodystrophy: it is autosomal
          recessive multiple symmetric lipomatosis with partial lipodystrophy (MONDO:1060153, OMIM 151800),
          rated Definitive, in which every reported patient carries at least one p.Arg707Trp allele and
          upper-body adipose overgrowth accompanies the limb lipodystrophy. The inheritance also differs
          from the dominant FPLD forms curated above. MFN2 is retained on this entry because MFN2 carriers
          turn up in genetically screened FPLD cohorts and a curator reading an MFN2 result needs to find
          this disposition; it is a candidate for a separate dismech entry rather than an FPLD subtype.'
        gene_term:
          preferred_term: MFN2
          term:
            id: hgnc:16877
            label: MFN2
      selected_evidence:
        snippet: "PLIN1 \nin 2.8%, and MFN2 in 0.9%."
        supports: SUPPORT
    origin:
      assertion_path: /genetic/7
      evidence_path: /genetic/7/evidence/0
      context_paths:
      - /name
      - /disease_term
