          and subcutaneous abdominal fat), white adipocytes with multiloculated lipid droplets and insulin-resistant
          diabetes, who was found to be homozygous for a premature truncation mutation in the lipid droplet
          protein cell death-inducing Dffa-like effector C (CIDEC) (E186X).
        supports: SUPPORT
