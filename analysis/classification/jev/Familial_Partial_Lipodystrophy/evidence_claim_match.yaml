          term:
            id: MONDO:0958022
            label: lipodystrophy, familial partial, type 8
        genes:
        - preferred_term: ADRA2A
          term:
            id: hgnc:281
            label: ADRA2A
        description: Atypical autosomal dominant partial lipodystrophy reported in a single African-American
          pedigree with a heterozygous ADRA2A p.Leu68Phe variant. ADRA2A encodes the presynaptic inhibitory
          alpha-2A adrenergic receptor; activation normally suppresses adipocyte cAMP and lipolysis, and
          the mutant receptor loses that restraint, so the proposed mechanism is excessive depot-selective
          lipolysis rather than failed adipogenesis.
      selected_evidence:
        snippet: A heterozygous g.112837956C>T mutation on chromosome 10 (c.202C>T, p.Leu68Phe) affecting
          a highly conserved residue in adrenoceptor alpha 2A (ADRA2A) was found in all affected subjects
          but not in unaffected relatives.
        supports: SUPPORT
