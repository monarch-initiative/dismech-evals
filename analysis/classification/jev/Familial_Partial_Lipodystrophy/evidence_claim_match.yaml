        subtype_term:
          preferred_term: FPLD9 (PLAAT3-related)
          term:
            id: MONDO:0958034
            label: lipodystrophy, familial partial, type 9
        genes:
        - preferred_term: PLAAT3
          term:
            id: hgnc:17825
            label: PLAAT3
        description: Autosomal recessive lipodystrophy caused by homozygous loss-of-function variants
          in PLAAT3, a phospholipid-modifying enzyme expressed in neural tissue and white adipose tissue.
          Fat loss ranges from partial to generalized and is accompanied by variable neurological features
          (demyelinating neuropathy, intellectual disability), so the entity is broader than a purely
          adipose disorder; OMIM and MONDO nonetheless number it within the familial partial lipodystrophy
          series.
      selected_evidence:
        snippet: We identified seven patients from four unrelated consanguineous families, with homozygous
          loss-of-function variants in PLAAT3, who presented with a lipodystrophy syndrome with loss of
          fat varying from partial to generalized and associated with metabolic complications, as well
          as variable neurological features including demyelinating neuropathy and intellectual disability.
        supports: SUPPORT
