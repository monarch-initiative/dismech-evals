          term:
            id: UBERON:0002190
            label: subcutaneous adipose tissue
      selected_evidence:
        snippet: PPARγ plays an essential role in adipogenesis, stimulating the differentiation of preadipocytes
          into adipocytes. Loss-of-function pathogenic variants in PPARG reduce the activity of the PPARγ
          receptor and can lead to severe metabolic consequences associated with familial partial lipodystrophy
          type 3 (FPLD3).
