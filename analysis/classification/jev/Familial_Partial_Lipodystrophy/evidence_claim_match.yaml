      assertion:
        name: Adipocyte lipid-droplet formation defect
        biological_scale: CELLULAR
        description: CIDEC and PLIN1 act at the adipocyte lipid droplet itself. CIDEC is required for
          unilocular lipid droplet formation and for optimal energy storage in human fat; the truncating
          allele is mistargeted and fails to increase lipid droplet size, and the patient's white adipocytes
          are multiloculated (FPLD5). PLIN1 coats the droplet, and the FPLD4 frameshift alleles extend
          its C-terminus and act dominant-negatively rather than by haploinsufficiency.
        genes:
        - preferred_term: CIDEC
          term:
            id: hgnc:24229
            label: CIDEC
        - preferred_term: PLIN1
          term:
            id: hgnc:9076
            label: PLIN1
        cell_types:
