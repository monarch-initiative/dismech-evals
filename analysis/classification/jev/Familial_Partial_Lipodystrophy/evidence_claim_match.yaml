          unrelated consanguineous families with a lipodystrophy syndrome, with variable neurological
          involvement. The ClinGen validity table committed in this repository contains no PLAAT3 row,
          so the CAUSATIVE relationship_type rests on the primary report - multiple unrelated consanguineous
          families, a concordant mouse knockout, and CRISPR inactivation in human adipose stem cells -
