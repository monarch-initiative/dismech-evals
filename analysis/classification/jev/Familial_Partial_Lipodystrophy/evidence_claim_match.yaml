            id: MONDO:0011714
            label: partial lipodystrophy, congenital cataracts, and neurodegeneration syndrome
        description: 'Partial lipodystrophy caused by heterozygous variants in CAV1 (caveolin-1), a structural
          protein of adipocyte caveolae important for lipid uptake and storage. Only two variants from
          a single report are known. The reported phenotype is broader than lipoatrophy alone: ClinGen''s
          review records atypical partial lipodystrophy with severe type 5 hyperlipoproteinemia and recurrent
          pancreatitis, and congenital cataracts and neurological involvement in some affected individuals,
          which is the phenotype the bound MONDO class is named for.'
        genes:
        - preferred_term: CAV1
          term:
            id: hgnc:1527
            label: CAV1
      selected_evidence:
        snippet: So far, only two variants (a frameshift and a 5’UTR variant) have been reported in association
          with atypical partial lipodystrophy, severe type 5 hyperlipoproteinemia, recurrent pancreatitis,
          and, in some affected individuals, congenital cataracts and neurological involvement
        supports: SUPPORT
