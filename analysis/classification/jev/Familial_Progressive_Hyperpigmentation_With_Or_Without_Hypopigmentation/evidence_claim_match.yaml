  bc55d51b045724574040339bbbb9c5d75e431d73c15e37452a68c00c636b0c75:
    claim:
      about:
        disease:
          name: Familial Progressive Hyperpigmentation With Or Without Hypopigmentation
          disease_term:
            preferred_term: Familial progressive hyperpigmentation with or without hypopigmentation
            term:
              id: MONDO:0007771
              label: hyperpigmentation with or without hypopigmentation, familial progressive
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fphh_malignancy_risk
        kind: KNOWLEDGE_GAP
        prompt: Do KITLG gain-of-function alleles carry any increased risk of melanoma or other malignancy,
          or is the reported cancer an artefact of small numbers?
        attaches_to:
        - genetic#KITLG
        - clinical_burden#
        rationale: Malignancy - pharyngeal cancer, papillary thyroid cancer, and melanoma - was noted
          in two of the reported FPHH families, while the six-generation index family had none. Gain-of-function
          mutations in KIT, the receptor this ligand activates, cause gastrointestinal stromal tumour,
          so a neoplastic effect of chronic pathway activation is not implausible on its face. But the
          total reported literature is a few dozen patients, cancers of these types occur in unselected
          families, and no age-adjusted comparison has been made. This is recorded as an open question
          specifically so that it is not curated as an established complication, which would put surveillance
          recommendations on a single uncontrolled observation.
        proposed_experiments:
        - experiment_id: fphh_cancer_incidence_cohort
          name: Age-adjusted cancer incidence in an assembled KITLG-variant cohort
          description: Pool molecularly confirmed KITLG gain-of-function carriers across reporting centres
            and compare observed cancer incidence, melanoma in particular, against population rates matched
            for age, sex, and ancestry.
          supporting_outcome:
          - Cancer incidence significantly above matched population rates in variant carriers, which would
            make surveillance a live question.
          refuting_outcome:
          - Incidence indistinguishable from population rates, establishing the reported cancers as coincidental
            and closing the question.
      selected_evidence:
        snippet: Sparse lateral eyebrows and malignancy (pharyngeal cancer, papillary thyroid cancer and
          melanoma) were found in two families.
        supports: SUPPORT
