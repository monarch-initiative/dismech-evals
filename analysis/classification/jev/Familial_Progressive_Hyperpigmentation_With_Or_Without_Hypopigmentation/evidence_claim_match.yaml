            term:
              id: MONDO:0007771
              label: hyperpigmentation with or without hypopigmentation, familial progressive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Enhanced KITLG-KIT Signaling in Epidermal Melanocytes
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: 'Keratinocyte-derived KITLG binds KIT on neighbouring epidermal melanocytes, dimerising
          the receptor and activating its tyrosine kinase. That this axis is rate-limiting for epidermal
          pigment is well supported: adding soluble KITLG to grafted human skin darkens it, and blocking
          either KITLG or KIT depletes melanocytes.

          What is not established is the step this node names. The proposal is that the mutant ligand
          engages KIT more effectively than wild type, and the sources state it as a possibility rather
          than a finding - the affinity increase is inferred from homology modelling of the substituted
          residues, and no binding assay, receptor phosphorylation measurement, or dose-response comparison
          of mutant against wild-type ligand has been published. Every functional experiment in this literature
          reads out melanin or transcription downstream, not receptor engagement itself. The node is graded
          PROVISIONAL for that reason, and the evidence attached below characterises the wild-type axis
          rather than the mutant''s behaviour on it.'
        biological_processes:
        - preferred_term: Kit signaling pathway
          modifier: INCREASED
          term:
            id: GO:0038109
            label: Kit signaling pathway
        cell_types:
        - preferred_term: epidermal melanocyte
          term:
            id: CL:2000000
            label: epidermal melanocyte
      selected_evidence:
        snippet: KITLG, expressed by keratinocytes, binds to KIT on melanocytes, stimulating melanogenesis.
          Disturbances in the KITLG-KIT interaction result in diffuse hyperpigmentation in FPHH.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39269165
      reference_title: A case of familial progressive hyperpigmentation with or without hypopigmentation
        presenting with hypopigmented striae along the lines of Blaschko.
      evidence_source: HUMAN_CLINICAL
      explanation: States the cell-to-cell signalling axis and attributes the diffuse hyperpigmentation
