            term:
              id: MONDO:0007771
              label: hyperpigmentation with or without hypopigmentation, familial progressive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KITLG Gain-of-Function Variant in the Receptor-Binding Motif
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'A heterozygous missense substitution in KITLG, almost always within the conserved
          VTNNV motif spanning amino acids 33-37 in exon 2. The motif lies on a conserved beta-strand
          that forms the interface with the KIT receptor, so a substitution there alters the ligand-receptor
          contact rather than destabilising the protein. Reported alleles include p.Val33Ala, p.Thr34Pro,
          p.Thr34Ile, p.Asn35Ile, p.Asn35Lys, p.Asn36Ser, and p.Lys38Thr - the last extending the hotspot
          by one residue, so it is sometimes written VTNNVK, 33-38. Alleles outside the motif are also
          reported: p.Glu113Lys (c.337G>A, exon 4), described as lying at a different ligand-receptor
          interaction site; p.Ser78Leu, reported as novel with no stated structural interpretation; and
          a pair of exon-4 substitutions at c.329A.'
        genetic_context:
          gene:
            preferred_term: KITLG
            term:
              id: hgnc:6343
              label: KITLG
          functional_impact_category: GAIN_OF_FUNCTION
          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
        molecular_functions:
        - preferred_term: stem cell factor receptor binding
          modifier: INCREASED
          term:
            id: GO:0005173
            label: stem cell factor receptor binding
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: Mutation profiling of positional candidate genes detected a heterozygous transversion
          (c. 107A-->G) in exon 2 of the KIT ligand (KITLG) gene, predicted to result in the substitution
          of a serine residue for an asparagine residue at codon 36 (p.N-->S).
        supports: SUPPORT
