            term:
              id: MONDO:0007771
              label: hyperpigmentation with or without hypopigmentation, familial progressive
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Increased epidermal melanin, maximal in the basal layer
        description: 'Biopsy of hyperpigmented skin shows a striking increase in melanin throughout the
          epidermis, most marked in the basal cell layer, with hypopigmented-area biopsies showing lower
          epidermal melanin. Histology is supportive rather than diagnostic.

          Immunohistochemistry in the same biopsies goes further than melanin quantity, and it points
          somewhere this entry''s pathograph does not. S100 and HMB45 staining of the hyperpigmented areas
          was read as showing increased melanocytes as well as increased melanin - that is, more pigment
          cells, not only busier ones. The pathograph here models per-melanocyte hyperfunction, because
          that is what the KITLG functional experiments measure; the histology is evidence for the other
          reading. Both are recorded, and the conflict is left open rather than resolved by preference.

          One caution on how far any of this can be pushed: the family it comes from was screened across
          the entire KITLG coding region and had no mutation. So it describes the FPHH clinical phenotype
          rather than the KITLG mechanism specifically, and it is cited here for the tissue-level finding
          and, separately, as evidence of locus heterogeneity.'
      selected_evidence:
        snippet: skin biopsy specimens from the hyperpigmented areas showed a striking increase in melanin
          throughout the epidermis, especially in the basal cell layer, and staining of hypopigmented
          area specimens displayed lower levels of melanin in the epidermis
        supports: SUPPORT
