  ba395431559f72e6c1466564438e949e1f7dcd94d19058467c47d1a3cead6d4e:
    claim:
      about:
        disease:
          name: Familial Progressive Hyperpigmentation With Or Without Hypopigmentation
          disease_term:
            preferred_term: Familial progressive hyperpigmentation with or without hypopigmentation
            term:
              id: MONDO:0007771
              label: hyperpigmentation with or without hypopigmentation, familial progressive
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: The intervention with the clearest indication, and effectively the only one specific
          to the disease rather than borrowed from general dyschromia management. Autosomal dominant transmission
          carries a 50% recurrence risk to offspring, penetrance has been described as reduced, and de
          novo cases occur - including a demonstrated de novo exon-4 allele - so unaffected parents do
          not exclude transmissible disease in the proband's own children.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'No trial, series, or outcome data exist for any intervention in this disease. This entry
          records genetic counselling because it follows directly from the established inheritance pattern,
          and deliberately does not curate the cosmetic and depigmenting measures (photoprotection, topical
          lightening agents, Q-switched laser) that appear in the general hyperpigmentation literature:
          none has been reported in FPHH, and extrapolating them here would manufacture a treatment section
          out of inference.

          KIT inhibition is the mechanistically obvious idea and is deliberately not curated as a treatment.
          Imatinib does suppress melanogenesis and does cause depigmentation in treated patients, but
          no one has given it for this indication, systemic KIT inhibition for a benign cosmetic condition
          is not a defensible trade, and no topical or intralesional agent exists. It belongs in a hypothesis,
          not in this list.'
      selected_evidence:
        snippet: it would extend the mutation spectrum of KITLG gene. It would improve the disease knowledge
          base and offer a reliable reference for the clinical diagnosis and prevention of FPHH
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
