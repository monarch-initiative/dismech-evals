            term:
              id: MONDO:0007771
              label: hyperpigmentation with or without hypopigmentation, familial progressive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic Reversion of the KITLG Locus in Skin
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'A candidate explanation for the hypopigmented component, and one that would make
          the "hypo" in the disease name a misnomer. In a patient with hypopigmented macules and striae
          distributed along the lines of Blaschko, digital PCR found copy-neutral loss of heterozygosity
          at the KITLG locus in DNA from the pale lesion but not in blood - consistent with clones that
          lost the mutant allele, reverted to ordinary KITLG-KIT signalling, and appear pale only by contrast
          with the surrounding hyperpigmented skin. Blaschko-linear distribution is the expected pattern
          for a clonal somatic event in keratinocyte or melanocyte lineages, which is what makes the observation
          more than a coincidence.

          Graded HYPOTHETICAL: this is a single patient carrying a single allele, and the cafe-au-lait
          macules in the same individual did not follow Blaschko lines and superimposed on the hypopigmented
          striae, so they require a separate mechanism this one does not supply. The general question
          is explicitly open in the literature.'
        cell_types:
        - preferred_term: epidermal melanocyte
          term:
            id: CL:2000000
            label: epidermal melanocyte
      selected_evidence:
        snippet: Digital polymerase chain reaction analysis of the DNA from skin and blood tissues indicated
          a copy-neutral loss of heterozygosity at the KITLG locus, only in the hypopigmented macule.
          These findings suggest that the hypopigmented macules might result from revertant mosaicism.
        supports: SUPPORT
