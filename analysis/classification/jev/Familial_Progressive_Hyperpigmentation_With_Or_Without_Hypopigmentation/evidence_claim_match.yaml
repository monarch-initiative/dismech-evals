        discussion_id: fphh_extracutaneous_involvement
        kind: KNOWLEDGE_GAP
        prompt: Is FPHH strictly skin-limited, or do the extracutaneous features reported in some pedigrees
          belong to the KITLG disease?
        attaches_to:
        - phenotypes#Progressive Diffuse Hyperpigmentation
        - genetic#KITLG
        rationale: This entry curates no systemic phenotype, and that is a decision rather than a finding.
          On one side, an affected pedigree was explicitly reported to have no other skin, nail, hair,
          teeth, mucosal, or systemic disease. On the other, the same review's survey of reported families
          records sparse lateral eyebrows and malignancy in two families and short sutures in one, and
          older pre-molecular reports under the "melanosis universalis hereditaria" label describe growth
          and developmental abnormalities. The negative comes from a single pedigree and cannot carry
          a disease-level claim; the positives are mostly from families that were never genotyped, in
          an era when the label was applied loosely and when what is now known to be a separate 19p disease
          was not distinguishable. Until genotyped series report systematically on extracutaneous findings,
          neither "skin-limited" nor "syndromic" is supportable, so the entry asserts neither.
      selected_evidence:
        snippet: Sparse lateral eyebrows and malignancy (pharyngeal cancer, papillary thyroid cancer and
          melanoma) were found in two families. Short sutures were found in only one family, and mental
          retardation was not present in these FPHH patients
        supports: SUPPORT
