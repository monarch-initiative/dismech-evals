  87f60977df1c25650d128d1b3b4b20f4592fa57108c2494ed14a4f7109d941ce:
    claim:
      about:
        disease:
          name: Familial Progressive Hyperpigmentation With Or Without Hypopigmentation
          disease_term:
            preferred_term: Familial progressive hyperpigmentation with or without hypopigmentation
            term:
              id: MONDO:0007771
              label: hyperpigmentation with or without hypopigmentation, familial progressive
        context: []
      assertion_type: Genetic
      assertion:
        name: KITLG
        gene_term:
          preferred_term: KITLG
          term:
            id: hgnc:6343
            label: KITLG
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Two things about this gene make the entry''s scope decisions turn on it.

          First, direction of effect determines which KITLG disease a patient has. The FPHH alleles are
          heterozygous gain-of-function substitutions at the receptor-binding surface, and they cause
          too much pigment. Biallelic KITLG variants do the opposite: loss-of-function pairs have been
          proposed to cause generalized hypomelanosis, and residual-function pairs a variable auditory-pigmentary
          disorder resembling Waardenburg syndrome type 2 or piebaldism. That recessive disorder is a
          separate entity, not a severity band of this one, and it is kept out of this entry.

          Second, the same gene and in one case the same allele underlie concepts that are carried as
          distinct terms. p.Asn36Ser was reported first in a family labelled FPH - hyperpigmentation only
          - and then found segregating in two FPHH families, and the FPHH locus overlaps that of dyschromatosis
          universalis hereditaria 2. This entry therefore treats the hyper-only and hyper-plus-hypo presentations
          as one KITLG disease with a variable hypopigmented component. This argument is confined to KITLG
          and does not extend to FPH1 (OMIM:614233), which is a separate 19p13.1-pter locus with no identified
          gene.

          Locus heterogeneity is real and unresolved: FPHH families without any KITLG mutation have been
          reported, so a negative KITLG result does not exclude the clinical diagnosis.'
      selected_evidence:
        snippet: 'In aggregate, mutations in a single gene cause various pigmentation disorders: FPH,
          FPHH, and likely DUH2.'
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
