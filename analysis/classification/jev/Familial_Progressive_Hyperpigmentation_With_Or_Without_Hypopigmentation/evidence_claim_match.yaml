    evidence_metadata:
      reference: PMID:29186243
      reference_title: 'Familial progressive hyper- and hypopigmentation: a report on a Chinese family
        and evidence for genetic heterogeneity.'
      evidence_source: HUMAN_CLINICAL
      explanation: The prediction this node makes is that pale skin holds revertant melanocytes pigmenting
        normally - which requires melanocytes to be present. Here both a general and a melanocyte-specific
        marker are almost absent from hypopigmented skin, meaning the pale patches lack melanocytes rather
        than containing well-behaved ones. Two limits on how far it cuts - it is a different family, and
        one in which no KITLG mutation was found, so it may describe a different route to the same clinical
        picture, and no one has done this staining on a lesion shown to carry copy-neutral LOH. It is
        recorded as REFUTE because it contradicts the node's prediction on its face, and it is a substantial
        part of why the node is graded HYPOTHETICAL.
