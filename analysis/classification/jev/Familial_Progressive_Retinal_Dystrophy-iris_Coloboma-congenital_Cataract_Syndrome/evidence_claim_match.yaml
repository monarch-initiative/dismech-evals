            term:
              id: MONDO:0014747
              label: familial progressive retinal dystrophy-iris coloboma-congenital cataract syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mir204_gain_versus_loss_of_function
        kind: KNOWLEDGE_GAP
        prompt: Does MIR204 n.37C>T cause disease by repressing new targets, by losing repression of normal
          miR-204 targets, or both, and which targets drive photoreceptor death and coloboma?
        attaches_to:
        - pathophysiology#MIR204 Seed-Region n.37C>T Variant
        - pathophysiology#Photoreceptor Apoptosis and Retinal Degeneration
        rationale: 'The defining study interprets the mechanism as gain of function, based on altered
          targeting in vitro and photoreceptor apoptosis after injecting the mutant microRNA into fish.
          Loss of miR-204 also damages the eye: knockdown in fish causes coloboma and abnormal lens formation,
          and knockout mice have RPE dysfunction. A seed change can do both at once, and the coloboma
          and cataract arms of the disease have only loss-of-function model evidence. The specific targets
          that matter have not been identified.'
        proposed_experiments:
        - experiment_id: mir204_seed_knock_in
          experiment_design: TARGETED_PERTURBATION
          name: Heterozygous MIR204 n.37C>T knock-in
          description: Introduce the seed variant at the endogenous locus in mice or human retinal organoids,
            and compare its retinal, RPE and optic fissure phenotypes and repressed transcripts with a
            heterozygous null allele.
          decision_criterion: A phenotype in the knock-in that the heterozygous null lacks, together with
            repression of new targets, would support gain of function.
          would_support:
          - pathophysiology#MIR204 Seed-Region n.37C>T Variant
      selected_evidence:
        snippet: Finally, knockdown assays in medaka fish demonstrated that miR-204 is necessary for normal
          photoreceptor function.
        supports: SUPPORT
