        description: FOXE3 is a forkhead transcription factor whose loss acts on smooth muscle cell number
          and survival rather than on the contractile apparatus. In mice, Foxe3 deficiency reduces smooth
          muscle cell density and impairs smooth muscle cell differentiation in the ascending aorta, and
          increases smooth muscle cell apoptosis and ascending aortic rupture when aortic pressure rises.
          Rescue by p53 inhibition places the apoptotic arm downstream of p53. This is a distinct route
          into thoracic aortic wall failure from both the extracellular-matrix and the contractile-apparatus
          arms.
