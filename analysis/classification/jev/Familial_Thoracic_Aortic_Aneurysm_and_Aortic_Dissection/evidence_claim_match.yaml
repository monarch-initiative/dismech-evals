              label: familial thoracic aortic aneurysm and aortic dissection
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PRKG1 gain-of-function constitutive PKG-1 activation
        description: PRKG1-related familial thoracic aortic disease (AAT8) is the only gain-of-function
          locus among the nonsyndromic HTAD genes. The recurrent PRKG1 c.530G>A (p.Arg177Gln) variant
          yields a type I cGMP-dependent protein kinase (PKG-1) that is constitutively active even without
          cGMP. Persistent PKG-1 activity lowers phosphorylation of the myosin regulatory light chain,
          decreasing vascular smooth muscle contraction and weakening the thoracic aorta — contrasting
          with the loss-of-function contractile genes ACTA2, MYH11, and MYLK.
        genes:
        - preferred_term: PRKG1
          term:
            id: hgnc:9414
            label: PRKG1
        cell_types:
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: constitutive cGMP-dependent protein kinase (PKG-1) signaling
          modifier: INCREASED
          term:
            id: GO:0035556
            label: intracellular signal transduction
        - preferred_term: vascular smooth muscle contraction
          modifier: DECREASED
          term:
            id: GO:0006939
            label: smooth muscle contraction
      selected_evidence:
        snippet: the same rare variant, PRKG1 c.530G>A (p.Arg177Gln), in four families. This mutation
          segregated with aortic disease in these families with a combined two-point LOD score of 7.88.
        supports: SUPPORT
