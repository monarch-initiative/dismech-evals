          the bud stalk becomes the ureter and its insertion becomes the ureteric orifice, a misplaced
          bud lands laterally on the developing trigone with a short intramural course. The same misplacement
          means the bud contacts an inappropriate region of metanephric mesenchyme, so intrinsic renal
          hypodysplasia is generated at the same time as the refluxing ureter — the unified "budding position"
