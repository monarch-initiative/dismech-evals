        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vur_mek_inhibition_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Does pharmacological MEK/ERK inhibition during ureteric bud outgrowth, which prevents
          CAKUT in Robo2/Gen1 double-heterozygous mice, have any bearing on human familial VUR?

          '
        attaches_to:
        - pathophysiology#Abnormal Ureteric Bud Outgrowth Position
        rationale: 'Intraperitoneal U0126 given to pregnant mice prevents the CAKUT phenotype in Robo2(PB/+)Gen1(PB/+)
          offspring, identifying MAPK/ERK as a convergent downstream node of the budding-position defect.
          This is a striking mechanistic result, but its translational validity is unknown: the mouse
          model is engineered and digenic, the intervention is a systemic MEK inhibitor given during pregnancy
          (with obvious developmental-toxicity and ethical barriers), and no human VUR has been shown
          to be MAPK/ERK-driven. It is a mechanistic probe of the budding-position model rather than a
          therapeutic lead.

          '
        proposed_experiments:
        - experiment_id: vur_erk_patient_cells
          name: ERK pathway activity in human ROBO2/SLIT2 variant carriers
          description: 'Test whether patient-derived fibroblasts or urinary-tract organoids from human
            ROBO2 or SLIT2 variant carriers show altered ERK phosphorylation comparable to the mouse model.

            '
        - experiment_id: vur_gen1_oligogenic_burden
          name: Oligogenic burden test for GEN1 and ERK-pathway modifiers
          description: 'Determine whether GEN1 or other ERK-pathway modifier alleles contribute to human
            familial VUR in oligogenic burden analyses of multiplex cohorts.

            '
      selected_evidence:
        snippet: Intraperitoneal injection of U0126 during pregnancy prevented the development of the
          CAKUT phenotype in Robo2PB/+Gen1PB/+ mice.
        supports: SUPPORT
