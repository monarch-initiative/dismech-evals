        role: consequence
        conforms_to: fibrotic_response#Architectural Distortion and Organ Dysfunction
        description: 'The combined congenital (hypodysplastic) and acquired (post-pyelonephritic scarring)
          lesions reduce functioning nephron mass. Reflux nephropathy is a leading cause of childhood
          hypertension and contributes roughly 10-15% of kidney failure requiring dialysis or transplantation
          in children and young adults.

          '
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
        notes: 'The classical textbook account of progression beyond this point — surviving nephrons hyperfiltering,
          producing proteinuria and secondary focal segmental glomerulosclerosis with renin-angiotensin
          activation and a self-sustaining GFR decline that continues after the reflux itself has resolved
          — is the general remnant-nephron model rather than a VUR-specific finding, and is recorded here
          as a note because no VUR-specific citation with a verifiable quote has been curated for it.

          '
      selected_evidence:
        snippet: Primary vesicoureteric reflux accounts for approximately 10% of kidney failure requiring
          dialysis or transplantation, and sibling studies suggest a large genetic component.
        supports: SUPPORT
