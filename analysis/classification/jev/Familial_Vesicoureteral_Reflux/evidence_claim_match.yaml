      assertion:
        name: Congenital Renal Hypodysplasia
        biological_scale: TISSUE
        role: mechanism
        description: 'A component of the renal lesion in familial VUR is present at birth and is independent
          of infection: because the misplaced ureteric bud induces an inappropriate region of metanephric
          mesenchyme, the kidney it induces is hypoplastic and/or dysplastic. This "congenital reflux
          nephropathy" is not preventable by antibiotic prophylaxis or anti-reflux surgery, and accounts
          for a substantial share of the chronic kidney disease attributed to VUR.

          '
        locations:
