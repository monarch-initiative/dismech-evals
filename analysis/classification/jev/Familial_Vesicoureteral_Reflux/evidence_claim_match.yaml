        conforms_to: fibrotic_response#Inflammatory Recruitment and Amplification
        description: 'Bacterial burden in the refluxing renal segment recruits neutrophils and monocyte-derived
          macrophages in proportion to that burden. Neutrophils control bacterial ascent, but the macrophage-dominated
          inflammatory response is strong and ineffective, and it is the extent of this inflammation —
          not the infection itself — that best predicts subsequent fibrosis. Experimental tipping of the
          neutrophil-macrophage balance towards macrophages worsens scarring, identifying this recruitment
          step as the amplifier that converts a treatable infection into permanent renal damage.

          '
        locations:
        - preferred_term: cortex of kidney
          term:
            id: UBERON:0001225
            label: cortex of kidney
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: monocyte-derived macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
        - preferred_term: leukocyte migration
          term:
            id: GO:0050900
            label: leukocyte migration
          modifier: INCREASED
      selected_evidence:
        snippet: Exacerbated macrophage-mediated inflammatory responses promoted renal scarring and compromised
          renal function, as indicated by elevated serum creatinine, BUN, and potassium.
        supports: SUPPORT
