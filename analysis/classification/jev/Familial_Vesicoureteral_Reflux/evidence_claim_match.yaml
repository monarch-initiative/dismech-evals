        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vur_congenital_vs_acquired_renal_lesion
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Can any intervention prevent the renal lesion of familial VUR, given that halving urinary
          tract infection does not reduce renal scarring?

          '
        attaches_to:
        - pathophysiology#Renal Cortical Scarring
        - pathophysiology#Congenital Renal Hypodysplasia
        rationale: 'RIVUR showed that continuous antimicrobial prophylaxis halves recurrent UTI without
          changing the rate of renal scarring, while carrying a clear resistance cost. If a substantial
          fraction of the renal lesion is congenital hypodysplasia determined at the time of ureteric
          bud outgrowth, then no postnatal infection-directed strategy can prevent it, and the appropriate
          outcome measure for VUR trials may need to change. The relative contribution of congenital versus
          acquired injury in an individual child cannot currently be determined at diagnosis.

          '
        proposed_experiments:
        - experiment_id: vur_neonatal_dmsa_partition
          name: Neonatal DMSA cohort partitioning congenital from acquired renal lesions
          description: 'Prospectively image children detected antenatally or at first UTI with early (neonatal)
            DMSA plus longitudinal follow-up imaging, to separate pre-existing hypodysplasia from newly
            acquired post-pyelonephritic scars.

            '
        - experiment_id: vur_genotype_stratified_prophylaxis
          name: Genotype-stratified analysis of prophylaxis outcomes
          description: 'Re-analyse or prospectively stratify prophylaxis trials by molecular subtype (e.g.
            TNXB and PAX2 carriers) to test whether genotype predicts response to infection-directed therapy.

            '
      selected_evidence:
        snippet: The occurrence of renal scarring did not differ significantly between the prophylaxis
          and placebo groups (11.9% and 10.2%, respectively).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
