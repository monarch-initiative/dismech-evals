        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vur_unidentified_locus_genes
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'What genes underlie the VUR1 (1p13), VUR4 (chromosome 5), VUR5 (chromosome 13), VUR6
          (chromosome 18), VUR7 (12p11-q13) and 10q26 linkage intervals?

          '
        attaches_to:
        - pathophysiology#Abnormal Ureteric Bud Outgrowth Position
        rationale: 'Six of the mapped familial VUR loci still have no identified gene, and even resequencing
          of the strongest interval (10q26, ~9 Mb, 69 genes) did not clearly implicate a single gene.
          Together with the roughly 7% monogenic diagnostic yield of exome sequencing in unselected primary
          VUR and the finding that more than 80% of familial cases have no identifiable variant, this
          means the molecular basis of most familial VUR is unknown. Whether the missing signal is non-coding
          regulatory variation acting on ureteric bud positioning, structural variation, or oligogenic
          combinations is unresolved.

          '
        proposed_experiments:
        - experiment_id: vur_wgs_multiplex_pedigrees
          name: Whole-genome sequencing of large multiplex VUR pedigrees
          description: 'Sequence whole genomes (not exomes) in multigenerational familial VUR kindreds
            linked to the mapped intervals, to capture non-coding regulatory and structural variation
            missed by exome sequencing.

            '
        - experiment_id: vur_uvj_single_cell_atlas
          name: Single-cell and spatial atlas of the developing human ureterovesical junction
          description: 'Profile the human nephric duct and forming ureterovesical junction by single-cell
            and spatial transcriptomics to prioritise candidate genes expressed at the budding site within
            each linkage interval.

            '
      selected_evidence:
        snippet: The ~9Mb region contains 69 genes, including some good biological candidates. Resequencing
          this region in selected individuals did not clearly implicate any gene but FOXI2, FANK1 and
          GLRX3 remain candidates for further investigation.
        supports: SUPPORT
