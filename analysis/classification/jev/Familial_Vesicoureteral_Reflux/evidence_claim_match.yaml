      assertion:
        name: Ascending Infection and Acute Pyelonephritis
        biological_scale: ORGANISM
        role: trigger
        conforms_to: fibrotic_response#Tissue Injury
        description: 'Reflux carries bladder urine — and any bacteria in it — into the renal pelvis and,
          via intrarenal reflux, into the parenchyma, converting cystitis into acute pyelonephritis. Segmental
          scars form only in segments that both receive intrarenal reflux and are exposed to bacterial
          infection, making infection the essential second hit for the acquired component of reflux nephropathy.
          Bladder and bowel dysfunction (detrusor overactivity, voiding postponement, constipation) markedly
          increases infection risk on top of the reflux itself. This node is the kidney-specific instance
          of the fibrotic module''s dysregulated wound-healing trigger.

          '
        locations:
