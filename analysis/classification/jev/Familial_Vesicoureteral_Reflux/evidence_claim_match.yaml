          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'Many multigenerational VUR kindreds segregate the trait in a pattern consistent
          with autosomal dominant inheritance with reduced penetrance and highly variable expressivity
          (grade, laterality, and presence of reflux nephropathy all vary within a pedigree). Dominant-model
          parametric linkage underpins the VUR1 (1p13) and 10q26 signals. A 2q37 dominant locus is also
          reported in the linkage literature but has no OMIM VUR series number and is not modelled as
          a subtype here.

          '
      selected_evidence:
        snippet: parametric linkage analysis of 460 families (1062 affected individuals) under a dominant
          model identified a single region, on 10q26, that showed strong linkage (HLOD = 4.90; ZLRLOD
          = 4.39) to VUR
        supports: SUPPORT
