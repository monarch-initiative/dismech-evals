              label: familial vesicoureteral reflux
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ureterovesical Junction Incompetence
        biological_scale: TISSUE
        role: mechanism
        description: 'The ureterovesical junction normally acts as a passive flap valve: the distal ureter
          runs obliquely for 1-2 cm within the bladder wall between the mucosa and the detrusor, so rising
          intravesical pressure compresses the tunnel shut. In primary VUR the intramural tunnel is too
          short relative to ureteric diameter and the orifice is laterally displaced, so the valve fails
          and urine refluxes during filling and, above all, during voiding. Extracellular-matrix competence
          of the junction also matters: TNXB, mutated in VUR8, is expressed in the uroepithelium of the
          ureterovesical junction at the time it forms and is proposed to generate the tensile forces
          that close it, with patient fibroblasts showing defective focal-adhesion turnover.

          '
        locations:
        - preferred_term: ureterovesical junction
          term:
            id: UBERON:0009973
            label: ureterovesical junction
        - preferred_term: trigone of urinary bladder
          term:
            id: UBERON:0001257
            label: trigone of urinary bladder
        cell_types:
        - preferred_term: ureter urothelial cell
          term:
            id: CL:1000706
            label: ureter urothelial cell
        - preferred_term: ureter smooth muscle cell
          term:
            id: CL:1000979
            label: ureter smooth muscle cell
        biological_processes:
        - preferred_term: ureter maturation
          term:
            id: GO:0035799
            label: ureter maturation
          modifier: ABNORMAL
        - preferred_term: cell-matrix adhesion
          term:
            id: GO:0007160
            label: cell-matrix adhesion
          modifier: ABNORMAL
        genes:
        - preferred_term: TNXB
          term:
            id: hgnc:11976
            label: TNXB
      selected_evidence:
        snippet: Fibroblast cell lines carrying the T3257I mutation exhibited a reduction in both cell
          motility and phosphorylated focal adhesion kinase expression, suggesting a defect in the focal
          adhesions that link the cell cytoplasm to the extracellular matrix.
        supports: SUPPORT
