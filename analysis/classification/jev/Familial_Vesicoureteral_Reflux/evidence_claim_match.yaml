              id: MONDO:0017329
              label: familial vesicoureteral reflux
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retrograde Urine Flow and Intrarenal Reflux
        biological_scale: ORGANISM
        role: mechanism
        description: 'Once the flap valve fails, urine flows retrogradely up the ureter during voiding.
          In higher grades the refluxed bolus reaches the renal pelvis and then enters the collecting
          ducts (intrarenal reflux) through gaping duct orifices on compound papillae, which are concentrated
          at the upper and lower renal poles. Intrarenal reflux is the step that converts a ureteric problem
          into a parenchymal one, and it defines the polar distribution of the scars that follow. Grade
          (I-V, International Reflux Study) tracks the extent of retrograde filling and dilation and is
          the main determinant of both spontaneous resolution and scarring risk.

          '
        locations:
        - preferred_term: renal pelvis
          term:
            id: UBERON:0001224
            label: renal pelvis
        - preferred_term: ureter
          term:
            id: UBERON:0000056
            label: ureter
      selected_evidence:
        snippet: Primarily, only gaping collecting duct orifices, confined to compound papillae and mainly
          situated at the kidney poles, allow intrarenal reflux.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:3153345
      reference_title: Vesico-uretero-renal reflux and the kidney.
      evidence_source: OTHER
      explanation: 'Defines the anatomical route of intrarenal reflux and its polar distribution.

