              deficiency: mutant GATM forms intramitochondrial fibrillary deposits within elongated, abnormal
              mitochondria, which are associated with increased ROS production, NLRP3 inflammasome activation,
              enhanced expression of the profibrotic cytokine IL-18, and increased cell death. The reporting
              authors propose, rather than demonstrate, that this proximal tubular mitochondrial pathology
              initiates an inflammasome response with subsequent kidney fibrosis. The five kindreds in
