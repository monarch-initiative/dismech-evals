      assertion_type: Subtype
      assertion:
        name: FRTS2
        display_name: FRTS2 (SLC34A1)
        subtype_term:
          preferred_term: Fanconi renotubular syndrome 2
          term:
            id: MONDO:0013247
            label: Fanconi renotubular syndrome 2
        classification: genetic
        description: 'A phosphate-wasting-predominant form attributed to SLC34A1, which encodes the proximal
          tubular sodium-phosphate cotransporter NaPi-IIa. Loss of NaPi-IIa-mediated phosphate reabsorption
          causes phosphaturia, hypophosphatemia, and rickets, with a proposed downstream intracellular
          phosphate depletion and impaired ATP generation. The classic recessive FRTS2 description is
          extremely limited (reported in only two siblings) and the recessive Fanconi attribution is debated;
          the broader SLC34A1 spectrum includes hypercalciuria and nephrocalcinosis (OMIM #613388).

          '
        genes:
        - preferred_term: SLC34A1
          term:
            id: hgnc:11019
            label: SLC34A1
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Primary inherited Fanconi syndrome is caused by a mutation in the sodium-phosphate cotransporter
          (NaPi-II) in the proximal tubule.
        supports: SUPPORT
