      assertion:
        name: FRTS1
        display_name: FRTS1 (GATM-related arginine:glycine amidinotransferase aggregation syndrome)
        subtype_term:
          preferred_term: Fanconi renotubular syndrome 1
          term:
            id: MONDO:0024525
            label: Fanconi renotubular syndrome 1
        classification: genetic
        description: 'Autosomal dominant FRTS caused by monoallelic missense variants in GATM (glycine
          amidinotransferase), a proximal tubular enzyme of creatine biosynthesis. This GATM-related arginine:glycine
          amidinotransferase aggregation syndrome is distinct from recessive AGAT deficiency: mutant GATM
          forms intramitochondrial fibrillary deposits within elongated, abnormal mitochondria, which
          are associated with increased ROS production, NLRP3 inflammasome activation, enhanced expression
          of the profibrotic cytokine IL-18, and increased cell death. The reporting authors propose,
          rather than demonstrate, that this proximal tubular mitochondrial pathology initiates an inflammasome
          response with subsequent kidney fibrosis. The five kindreds in which FRTS1 was defined were
          ascertained through autosomal dominant renal Fanconi syndrome with kidney failure (OMIM #134600).

          '
        genes:
        - preferred_term: GATM
          term:
            id: hgnc:4175
            label: GATM
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: fully penetrant heterozygous missense mutations in GATM trigger intramitochondrial fibrillary
          deposition of GATM and lead to elongated and abnormal mitochondria
        supports: SUPPORT
