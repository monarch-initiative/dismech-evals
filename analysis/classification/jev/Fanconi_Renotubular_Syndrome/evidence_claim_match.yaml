            id: MONDO:0014275
            label: Fanconi renotubular syndrome 3
        classification: genetic
        description: 'Autosomal dominant isolated FRTS caused by the heterozygous EHHADH p.E3K missense
          variant, which creates a new N-terminal mitochondrial targeting motif that mistargets the peroxisomal
          fatty-acid-oxidation enzyme EHHADH to mitochondria, impairing oxidative phosphorylation by a
          dominant-negative mechanism. Affected individuals show lifelong proximal solute loss but typically
          preserved glomerular filtration (no kidney failure), distinguishing FRTS3 from other subtypes
          (OMIM #615605).

          '
        genes:
        - preferred_term: EHHADH
          term:
            id: hgnc:3247
            label: EHHADH
        inheritance:
