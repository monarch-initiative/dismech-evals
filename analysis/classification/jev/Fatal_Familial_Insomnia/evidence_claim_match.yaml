          glycoform relative to the di- and monoglycosylated forms. This distinguishes FFI both from other
          prion diseases (21 kDa, type 1) and from sporadic fatal insomnia (19 kDa but without the glycoform
          skew). It is a post-mortem or biopsy brain-tissue finding, not a clinically accessible fluid
          biomarker.'
        presence: INCREASED
        specificity: HIGH
      selected_evidence:
        snippet: the relative molecular mass of 19 kDa, corresponding to the so-called type 2,
        supports: SUPPORT
