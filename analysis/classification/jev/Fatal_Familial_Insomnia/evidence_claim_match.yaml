            name: Extrathalamic Olivocerebellar and Cortical Degeneration
            biological_scale: TISSUE
            description: FFI is thalamus-dominant but not thalamus-only. Beyond the defining thalamic
              lesion, the same disease process damages the inferior olives, the cerebellum (atrophy with
              axonal torpedoes), and the cerebral cortex (gliosis, and spongiform change in some cases).
              These lesions are primary rather than secondary to the thalamic damage, and they provide
              a plausible substrate for the somatomotor syndrome - ataxia, dysarthria, myoclonus, pyramidal
              signs - although individual symptom generators are not all localized. Cortical features
              distinguish codon-129 heterozygotes, who show more extensive cortical involvement on PET
              and at autopsy. Because neocortical PrPres accumulation rises with disease duration, this
              component is more prominent in the prolonged 129MV course.
            notes: The inferior olivary lesion is reported inconsistently in the primary literature -
              as severe atrophy in the five-case clinicopathologic series and as olivary hypertrophy in
              the 14-case codon-129 series. Both are recorded here rather than harmonized, because the
              discrepancy is in the sources, not in this entry.
