  e6038a095fe936791c64d0684f6015b82a6ad4316a35d703ae996292e39dcbad:
    claim:
      about:
        disease:
          name: Fatal Familial Insomnia
          disease_term:
            preferred_term: fatal familial insomnia
            term:
              id: MONDO:0010808
              label: fatal familial insomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extrathalamic Olivocerebellar and Cortical Degeneration
        biological_scale: TISSUE
        description: FFI is thalamus-dominant but not thalamus-only. Beyond the defining thalamic lesion,
          the same disease process damages the inferior olives, the cerebellum (atrophy with axonal torpedoes),
          and the cerebral cortex (gliosis, and spongiform change in some cases). These lesions are primary
          rather than secondary to the thalamic damage, and they provide a plausible substrate for the
          somatomotor syndrome - ataxia, dysarthria, myoclonus, pyramidal signs - although individual
          symptom generators are not all localized. Cortical features distinguish codon-129 heterozygotes,
          who show more extensive cortical involvement on PET and at autopsy. Because neocortical PrPres
          accumulation rises with disease duration, this component is more prominent in the prolonged
          129MV course.
        notes: The inferior olivary lesion is reported inconsistently in the primary literature - as severe
          atrophy in the five-case clinicopathologic series and as olivary hypertrophy in the 14-case
          codon-129 series. Both are recorded here rather than harmonized, because the discrepancy is
          in the sources, not in this entry.
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
        locations:
        - preferred_term: inferior olivary complex
          term:
            id: UBERON:0002127
            label: inferior olivary complex
        - preferred_term: cerebellar cortex
          term:
            id: UBERON:0002129
            label: cerebellar cortex
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: most of the cases had gliosis of the cerebral cortex, a moderate degree of cerebellar
          atrophy with "torpedoes," and severe atrophy of the inferior olivary nuclei
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:1736158
      reference_title: 'Fatal familial insomnia: clinical and pathologic study of five new cases.'
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the extrathalamic lesions - cortical gliosis, cerebellar atrophy with torpedoes,
        inferior olivary atrophy - that this node represents.
