            preferred_term: fatal familial insomnia
            term:
              id: MONDO:0010808
              label: fatal familial insomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Template-Directed Conversion of PrP-C to FFI-Type PrP-Sc
        biological_scale: MOLECULAR
        description: 'The autocatalytic core of the disease: a misfolded PrP molecule recruits and refolds
          native PrP-C, so that the conformation itself acts as the replicating template. In FFI the resulting
          protease-resistant core is a 19 kDa (type 2) fragment with marked underrepresentation of the
          unglycosylated glycoform - a molecular signature distinct from the 21 kDa fragment of sporadic
          and other inherited prion diseases. Inoculation of FFI brain extract into chimeric human-mouse
          PrP transgenic mice reproduces the 19 kDa fragment, establishing that conformation, not sequence,
          carries the strain information.'
        biological_processes:
        - preferred_term: protein homooligomerization
          term:
            id: GO:0051260
            label: protein homooligomerization
          modifier: INCREASED
        - preferred_term: protein refolding
          term:
            id: GO:0042026
            label: protein refolding
          modifier: INCREASED
      selected_evidence:
        snippet: formation of the 19-kilodalton PrPSc fragment
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/2
