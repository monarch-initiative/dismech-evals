  71c36dd745fe1133ce92753f2702bb3a988d2133419c2963fe88fff63089b9f3:
    claim:
      about:
        disease:
          name: Fatal Familial Insomnia
          disease_term:
            preferred_term: fatal familial insomnia
            term:
              id: MONDO:0010808
              label: fatal familial insomnia
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: native_state_destabilization
        hypothesis_label: Native-State Thermodynamic Destabilization of PrP-C
        status: DEPRECATED
        description: 'The historical model that familial PRNP substitutions cause disease by lowering
          the thermodynamic (and kinetic) stability of the folded C-terminal domain of PrP-C, so that
          the native alpha-helical fold more readily slips into a beta-sheet-rich, conversion-competent
          conformer. It is intuitive and still widely repeated, but it was tested directly and does not
          hold: measured stabilities of the familial-mutant proteins do not correlate with disease phenotype,
          and PrP-C folding is too fast and too cooperative to expose a folding-intermediate route to
          PrP-Sc. Recorded here as a DEPRECATED hypothesis rather than silently deleted, because an earlier
          revision of this entry asserted it as the mechanism of the "Acquisition of a Conversion-Prone
          PrP-C State" node, and the intuition is likely to be reintroduced by a future curator unless
          the refuting evidence stays attached to the claim it refutes.'
        notes: Deprecating this hypothesis does not resolve the mechanism - it only removes a wrong answer.
          How the D178N-129M haplotype actually confers conversion propensity, and why the same substitution
          with 129V yields familial CJD instead, remains open; see the strain-identity knowledge-gap discussion
          on this entry.
      selected_evidence:
        snippet: some hereditary forms of prion disease cannot be rationalized using the concept of mutation-induced
          thermodynamic destabilization of the cellular prion protein
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9813003
      reference_title: Familial mutations and the thermodynamic stability of the recombinant human prion
        protein.
      evidence_source: IN_VITRO
      explanation: The paper set out to test this exact hypothesis for the FFI (M129/D178N), GSS (P102L)
        and familial CJD (E200K) variants and concluded against it. D178N could not even be assayed because
        it aggregated; P102L was indistinguishable from wild-type and E200K only very slightly destabilized.
