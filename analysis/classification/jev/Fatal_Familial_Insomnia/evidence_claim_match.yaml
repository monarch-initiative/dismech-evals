  4e44b43def6adb9306a0d9bbe8e044e9849cc54e2dc150e56208c71a64963379:
    claim:
      about:
        disease:
          name: Fatal Familial Insomnia
          disease_term:
            preferred_term: fatal familial insomnia
            term:
              id: MONDO:0010808
              label: fatal familial insomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acquisition of a Conversion-Prone PrP-C State
        biological_scale: MOLECULAR
        description: 'The D178N substitution, in cis with 129M, renders PrP-C prone to adopting the misfolded,
          self-templating conformer that seeds propagation. Recombinant human PrP carrying the FFI M129/D178N
          haplotype is markedly aggregation-prone: unlike the GSS (P102L) and familial CJD (E200K) variants,
          which are recovered soluble, the D178N protein partitions into inclusion bodies. This is a gain
          of toxic conformation, not a loss of PrP function.'
        notes: 'Curation note on what this node deliberately does NOT claim. An earlier revision asserted
          that D178N lowers the "thermodynamic and kinetic barrier" separating the native alpha-helical
          fold from beta-sheet-rich conformers. That wording was removed: it states as mechanism a hypothesis
          the primary literature has tested and rejected. The refuting evidence is recorded at disease
          level as the DEPRECATED `native_state_destabilization` hypothesis (PMID:9813003, PMID:10079068,
          PMID:10360358) rather than here, so the refutation stays attached to the claim it refutes. This
          node is therefore scoped to the conversion and aggregation propensity that is actually observed;
          the mechanism by which the D178N-129M haplotype confers it remains open - see the strain-identity
          knowledge-gap discussion.'
        biological_processes:
        - preferred_term: protein folding
          term:
            id: GO:0006457
            label: protein folding
          modifier: ABNORMAL
      selected_evidence:
        snippet: whereas the D178N variant aggregated into inclusion bodies
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9813003
      reference_title: Familial mutations and the thermodynamic stability of the recombinant human prion
        protein.
      evidence_source: IN_VITRO
      explanation: 'Recombinant human PrP(90-231) carrying the FFI M129/D178N haplotype partitions into
        inclusion bodies, where the P102L and E200K variants are recovered soluble from the same expression
        system - so aggregation propensity distinguishes this haplotype from the other familial variants.
        Marked INDIRECT deliberately: inclusion-body formation in E. coli is an aggregation observation
        and a common expression artifact, not a clean proxy for self-templating conversion propensity
        in vivo, and the authors draw no such inference themselves - they report it only as the reason
        D178N could not be assayed.'
