      reference: PMID:10360358
      reference_title: Extremely rapid folding of the C-terminal domain of the prion protein without kinetic
        intermediates.
      evidence_source: IN_VITRO
      explanation: 'Refutes the kinetic half of the hypothesis specifically. Stopped-flow folding of the
        structured domain has a half-life of about 170 microseconds with no detectable intermediates,
        so a populated folding intermediate is not available as the PrP-Sc precursor. Species/construct
        caveat: measured on murine mPrP(121-231) carrying an engineered F175W fluorescence reporter -
        not human PrP and not the D178N-129M haplotype - so the argument is a cross-species extrapolation
        resting on the conservation of the C-terminal globular fold between mouse and human PrP. The authors
        show the reporter variant has "the same overall structure and stability as wild-type mPrP(121-231)",
        which addresses the construct but not the species step.'
