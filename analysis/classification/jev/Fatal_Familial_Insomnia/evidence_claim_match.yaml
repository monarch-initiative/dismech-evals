        context: []
      assertion_type: ProgressionInfo
      assertion:
        notes: 'Onset is typically in the sixth decade (GeneReviews gives 50-60 years for genetic prion
          disease broadly), though reported FFI onsets span roughly 19 to 68 years. The course is continuously
          progressive and death follows within months to about three years. Duration is bimodal by the
          codon-129 genotype of the non-mutant allele: about 9 months in methionine homozygotes versus
          about 31 months in methionine/valine heterozygotes. In national surveillance data, FFI and GSS
          patients tend to present earlier than point-mutation genetic CJD patients.'
      selected_evidence:
        snippet: ranges from 50 to 60 years
        supports: SUPPORT
