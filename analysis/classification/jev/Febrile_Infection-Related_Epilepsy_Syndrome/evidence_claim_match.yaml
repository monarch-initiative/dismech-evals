      assertion:
        discussion_id: fires-genetic-susceptibility
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Innate Neuroinflammatory Activation
        prompt: Why does a common febrile illness trigger catastrophic FIRES in a previously healthy child?
          Is there an underlying genetic predisposition of the innate immune response (e.g., in the IL-1
          pathway or other inflammasome/cytokine genes) that determines susceptibility?
        rationale: FIRES strikes previously healthy children without an identified pathogen or classic
          autoimmune antibody, suggesting a host-susceptibility factor. A functional deficiency of endogenous
          IL-1RA (IL1RN) has been demonstrated in small FIRES cohorts, but whether this is a reproducible,
          generalizable susceptibility signature - and how it interacts with the febrile trigger - remains
          open.
        proposed_experiments:
        - experiment_id: fires-host-susceptibility-genomics
          name: Host innate-immune susceptibility genomics in FIRES
          description: Perform genomic/immunogenetic profiling (e.g., IL-1 pathway and inflammasome genes)
            in a FIRES cohort versus controls to test for a susceptibility signature.
          readouts:
          - name: Innate-immune genetic susceptibility signature
            target: pathophysiology#Innate Neuroinflammatory Activation
          would_support:
          - pathophysiology#Innate Neuroinflammatory Activation
      selected_evidence:
        snippet: Our findings suggest that FIRES is associated with reduced expression of intracellular
          IL1RA isoforms and a functional deficiency in IL1RA inhibitory activity
        supports: SUPPORT
