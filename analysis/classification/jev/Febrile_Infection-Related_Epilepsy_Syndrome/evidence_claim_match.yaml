        description: The trigger drives activation of brain-resident innate immunity - microglia and astrocytes
          - with inflammasome activation and production of pro-inflammatory cytokines, prominently interleukin-1-beta
          and interleukin-6. A genetic predisposition of the innate immune response (e.g., variation in
          the IL-1 pathway) is hypothesized. This node captures the single concept of the central neuroinflammatory
          driver.
        role: mediator
        cell_types:
