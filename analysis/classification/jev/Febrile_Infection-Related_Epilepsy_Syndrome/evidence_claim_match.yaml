        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Innate Neuroinflammatory Activation
        - pathophysiology#Super-Refractory Status Epilepticus
        prompt: FIRES is hypothesized to be driven by an IL-1-beta/IL-6 innate-immune cytokine surge,
          and anakinra/tocilizumab appear more effective when started early. Does early, mechanism-targeted
          cytokine blockade (versus escalating anesthetics and later immunotherapy) shorten the super-refractory
          status epilepticus and improve chronic-phase epilepsy and cognitive outcome?
        rationale: The cytokinopathy model predicts that early IL-1/IL-6 blockade should interrupt the
          cascade before irreversible neuronal injury, but the evidence is largely from case series and
          retrospective cohorts, and the optimal timing and agent remain unestablished.
        proposed_experiments:
        - experiment_id: fires-early-cytokine-blockade-trial
          name: Early cytokine-blockade timing trial in FIRES
          description: In a multicenter FIRES registry/trial, compare time-to-resolution of super-refractory
            status epilepticus and chronic-phase seizure/cognitive outcomes by time from onset to initiation
            of IL-1/IL-6-targeted therapy.
          readouts:
          - name: Status-epilepticus duration and chronic outcome versus time-to-cytokine-blockade
            target: pathophysiology#Super-Refractory Status Epilepticus
          would_support:
          - pathophysiology#Innate Neuroinflammatory Activation
      selected_evidence:
        snippet: Cerebral spinal fluid analysis revealed elevated levels of proinflammatory cytokines
          before treatment that normalized on anakinra, suggesting a potential pathogenic role for neuroinflammation
          in FIRES
        supports: SUPPORT
