  b50002c9e37030730d44ebd6807595256a8a58821684a87bddb469019aef781f:
    claim:
      about:
        disease:
          name: Febrile Infection-Related Epilepsy Syndrome
          disease_term:
            preferred_term: febrile infection-related epilepsy syndrome
            term:
              id: MONDO:0015584
              label: febrile infection-related epilepsy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Functional IL-1RA Deficiency (Permissive Host Factor)
        description: 'A functional deficiency of endogenous interleukin-1 receptor antagonist (IL-1RA,
          encoded by IL1RN) is a candidate permissive host factor: with the natural brake on IL-1-beta
          signaling weakened, a common febrile trigger can drive unchecked IL-1-beta activity. This node
          captures the single concept of the "loss of the anti-inflammatory brakes" - the gene-environment
          convergence at the heart of the leading FIRES model - kept separate from the febrile trigger
          and from the downstream inflammatory activation it permits.'
        role: modifier
        cell_types:
        - preferred_term: Leukocyte
          term:
            id: CL:0000738
            label: leukocyte
        gene:
          preferred_term: IL1RN
          term:
            id: hgnc:6000
            label: IL1RN
        molecular_functions:
        - preferred_term: interleukin-1 receptor antagonist activity
          term:
            id: GO:0005152
            label: interleukin-1 receptor antagonist activity
          modifier: DECREASED
      selected_evidence:
        snippet: Our findings suggest that FIRES is associated with reduced expression of intracellular
          IL1RA isoforms and a functional deficiency in IL1RA inhibitory activity
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
