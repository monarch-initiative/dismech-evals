              label: febrile infection-related epilepsy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preceding Febrile Infection Trigger
        description: A nonspecific febrile illness (usually an upper-respiratory or gastrointestinal infection)
          precedes seizure onset by roughly 24 hours to two weeks in a previously healthy individual.
          No specific pathogen is consistently identified in the CNS, and the fever is understood as a
          trigger of a maladaptive immune response rather than a direct CNS infection. This node captures
          the single concept of the initiating febrile trigger.
        role: trigger
        cell_types:
        - preferred_term: Leukocyte
          term:
            id: CL:0000738
            label: leukocyte
      selected_evidence:
        snippet: A preceding febrile infection had been reported in 96% of them
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
