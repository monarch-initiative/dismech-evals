      - /disease_term
    evidence_metadata:
      reference: PMID:21883180
      reference_title: 'Febrile infection-related epilepsy syndrome (FIRES): pathogenesis, treatment,
        and outcome: a multicenter study on 77 children.'
      evidence_source: HUMAN_CLINICAL
      explanation: In the multicenter cohort, a preceding febrile infection was reported in 96% of FIRES
        patients - the defining trigger.
