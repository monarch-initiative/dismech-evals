      assertion_type: Genetic
      assertion:
        name: IL1RN
        gene_term:
          preferred_term: IL1RN
          term:
            id: hgnc:6000
            label: IL1RN
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: IL1RN encodes the endogenous interleukin-1 receptor antagonist (IL-1RA), the natural brake
          on IL-1-beta signaling. FIRES is not Mendelian; this is a candidate host-susceptibility factor
          rather than an established cause. In a small study, an index FIRES patient carried IL1RN variants
          of uncertain significance with reduced expression of intracellular IL-1RA isoforms, and functionally
          attenuated endogenous IL-1RA activity was demonstrated in a few patients - suggesting a permissive
          "loss of the anti-inflammatory brakes" mechanism that may be present in only some children and
          that also rationalizes anakinra (recombinant IL-1RA) therapy.
      selected_evidence:
        snippet: Our findings suggest that FIRES is associated with reduced expression of intracellular
          IL1RA isoforms and a functional deficiency in IL1RA inhibitory activity
        supports: SUPPORT
