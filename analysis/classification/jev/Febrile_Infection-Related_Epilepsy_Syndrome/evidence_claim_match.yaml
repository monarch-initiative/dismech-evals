              label: febrile infection-related epilepsy syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical Diagnosis by Consensus Criteria (Diagnosis of Exclusion)
        diagnosis_term:
          preferred_term: clinical assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        description: FIRES is a clinical diagnosis made when a previously healthy person develops new-onset
          refractory status epilepticus after a preceding febrile infection (typically 24 hours to 2 weeks
          before onset), once acute structural, toxic, metabolic, and identifiable infectious/autoimmune
          causes have been excluded. Workup includes MRI, EEG, CSF analysis, autoimmune/paraneoplastic
          antibody panels, and infectious and metabolic studies - all of which are, by definition, non-diagnostic
          of an alternative cause.
        results: New-onset refractory status epilepticus with a documented preceding febrile illness and
          no identified alternative cause.
      selected_evidence:
        snippet: FIRES is a subcategory of NORSE, applicable for all ages, that requires a prior febrile
          infection starting between 2 weeks and 24 hours prior to onset of refractory status epilepticus,
          with or without fever at onset of status epilepticus
        supports: SUPPORT
