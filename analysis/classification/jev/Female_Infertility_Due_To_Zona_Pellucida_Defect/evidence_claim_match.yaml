        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ZP1 Loss-of-Function and Cytoplasmic Co-Sequestration of Zona Pellucida Glycoproteins
        description: Pathogenic truncating, splice-site, or missense variants in ZP1 lead to premature
          stop codons, reduced protein stability, or misfolded ZP1 polypeptides that fail to undergo normal
          post-translational trafficking and cleavage-coupled secretion in growing oocytes. Instead of
          being secreted into the extracellular perivitelline space, mutant ZP1 accumulates inside the
          oocyte cytoplasm and endoplasmic reticulum and aberrantly binds and sequesters wild-type ZP1,
          ZP2, ZP3, and ZP4 intracellularly, preventing their transport to the oocyte surface.
        role: TRIGGER
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Germline homozygous, compound heterozygous, or heterozygous pathogenic ZP1 variants
            impair ZP1 expression, intracellular trafficking, secretion, and partner ZP glycoprotein transport.
        genes:
        - preferred_term: ZP1
          term:
            id: hgnc:13187
            label: ZP1
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
        locations:
        - preferred_term: ovary
          term:
            id: UBERON:0000992
            label: ovary
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
        biological_processes:
        - preferred_term: protein secretion
          term:
            id: GO:0009306
            label: protein secretion
          modifier: DECREASED
        molecular_functions:
        - preferred_term: structural constituent of egg coat
          term:
            id: GO:0035804
            label: structural constituent of egg coat
      selected_evidence:
        snippet: In vitro studies showed that defective ZP1 proteins and normal ZP3 proteins colocalized
          throughout the cells and were not expressed at the cell surface, suggesting that the aberrant
          ZP1 results in the sequestration of ZP3 in the cytoplasm, thereby preventing the formation of
          the zona pellucida around the oocyte.
        supports: SUPPORT
