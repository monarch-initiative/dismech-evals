              id: MONDO:0014342
              label: female infertility due to zona pellucida defect
        context: []
      assertion_type: Prevalence
      assertion:
        population: General population
        measure_type: UNKNOWN
        notes: Population-level prevalence of OOMD1 in the general population is unknown because affected
          women are asymptomatic until attempting conception or undergoing oocyte retrieval. In selected
          clinical cohorts, combined ZP1, ZP2, and ZP3 variants accounted for 18 of 35 (51.43%) unrelated
          Chinese women with genuine empty follicle syndrome and oocyte degeneration (with 20 ZP1 variants
          identified across the cohort), and the recurrent homozygous ZP1 c.1097G>A (p.Arg366Gln) founder
          variant alone accounted for 5 of 27 (18.5%; reported as an allelic frequency of 17.9% in the
          study text) North African women with severe oocyte maturation defect; gene-specific cohort attribution
          is recorded under genetic.case_fractions.
      selected_evidence:
        snippet: Here, we included four additional OMD patients and reanalyzed all 27 subjects. In addition
          to the seven patients with a previously identified defect, five carried the same deleterious
          homozygous ZP1 variant (c.1097G>A; p.Arg366Gln).
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35460069
      reference_title: A recurrent ZP1 variant is responsible for oocyte maturation defect with degenerated
        oocytes in infertile females.
      evidence_source: HUMAN_CLINICAL
      explanation: Shows that a single recurrent North African founder variant in ZP1 accounts for 5 of
