            label: Autosomal dominant inheritance
        description: A subset of patients harbor heterozygous ZP1 variants (such as p.Trp83Arg, p.Arg109His,
          p.Tyr262Cys, and p.Glu267Glyfs*80), frequently transmitted paternally with sex-limited expression
          in females, that act via dominant-negative interference with ZP secretion or filament assembly
          or via haploinsufficiency.
      selected_evidence:
        snippet: Here, we performed whole-exome sequencing in two probands with primary infertility whose
          oocytes lacked a ZP, and we identified a heterozygous mutation in ZP1 (NM_207341:c.326G>A p.Arg109His),
          which is situated in the N-terminus, and a heterozygous mutation in ZP3 (NM_001110354:c.400G>A
          p.Ala134Thr), which is situated in the ZP domain.
        supports: SUPPORT
