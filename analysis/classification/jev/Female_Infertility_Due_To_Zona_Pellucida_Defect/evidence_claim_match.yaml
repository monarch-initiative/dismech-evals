            label: ZP1
        publication: PMID:10433913
        description: Unlike humans and rats, mice possess only three functional zona pellucida genes (Zp1,
          Zp2, and Zp3, with Zp4 pseudogenized). Homozygous Zp1-null female mice still assemble a loosely
          organized, porous zona pellucida matrix composed of mZP2 and mZP3, with ectopic clusters of
          granulosa cells trapped in the perivitelline space. Zp1-null female mice remain fertile with
          reduced litter sizes (~50% of wild-type) due to fragile cleavage-stage embryos and precocious
          hatching in the oviduct, making the mouse knock-out a milder structural phenotype than the truncating/missense
          ZP1 mutations seen in humans and knock-in rats.
        modeled_mechanisms:
        - target: Failure of ZP1-N1 Disulfide Cross-Linking and Zona Pellucida Extracellular Matrix Assembly
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Demonstrates loss of ZP1 filament cross-linking and porous ZP architecture, but
            mice retain an uncross-linked ZP2/ZP3 coat and remain subfertile rather than completely sterile.
      selected_evidence:
        snippet: Although a zona pellucida composed of ZP2 and ZP3 was formed around growing Zp1(tm/tm)
          oocytes, the matrix was more loosely organized than zonae around normal oocytes. In some Zp1
          null follicles, this structural abnormality resulted in ectopic clusters of granulosa cells,
          lodged between the zona matrix and the oolemma, that perturbed normal folliculogenesis. Comparable
          numbers of eggs were ovulated from Zp1 null females and normal females following hormonal stimulation.
          However, after mating with males, fewer two-cell embryos were recovered from Zp1 null females,
          and their litters were significantly smaller than those produced by normal mice.
        supports: SUPPORT
