              label: female infertility due to zona pellucida defect
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Sperm-Zona Pellucida Recognition and Fertilization Failure
        description: In patients whose oocytes survive follicular aspiration as viable metaphase II (MII)
          gametes despite an absent or severely thinned zona pellucida, the naked oolemma lacks the ZP
          glycoprotein matrix required for normal species-specific sperm binding, acrosome reaction induction,
          and block to polyspermy. Consequently, conventional in vitro fertilization (IVF) fails completely,
          whereas direct intracytoplasmic sperm injection (ICSI) into the ooplasm can bypass the extracellular
          ZP defect.
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
        locations:
        - preferred_term: ovary
          term:
            id: UBERON:0000992
            label: ovary
        biological_processes:
        - preferred_term: binding of sperm to zona pellucida
          term:
            id: GO:0007339
            label: binding of sperm to zona pellucida
          modifier: ABNORMAL
      selected_evidence:
        snippet: Among ZP genes, ZP1 has emerged as a critical determinant of matrix assembly and oocyte
          viability. Loss-of-function mutations in ZP1 can result in incomplete or dysfunctional ZP formation,
          leading to failed fertilization (Wassarman & Litscher, 2021).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
