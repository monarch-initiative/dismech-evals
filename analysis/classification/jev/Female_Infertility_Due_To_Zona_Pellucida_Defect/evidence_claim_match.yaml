      selected_evidence:
        snippet: Consistent with an important role of W72 in the folding and dimerisation of cZP1-N1,
          this experiment showed that W83R not only decreases the secretion of hZP1-N1 but also significantly
          reduces its ability to form disulphide-bonded homodimers (Fig. 7b). This suggests that the mutation
          leads to lack of the ZP by hindering human ZP filament cross-linking.
        supports: SUPPORT
