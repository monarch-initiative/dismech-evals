        therapeutic_modality: SURGERY
        description: For the subset of ZP1-mutant patients (~20 to 25%) from whom mature metaphase II
          (MII) zona pellucida-free oocytes can be successfully aspirated (often facilitated by gentle
          follicular aspiration at reduced suction pressure or diagnostic natural-cycle aspiration), intracytoplasmic
          sperm injection (ICSI) directly injects a single spermatozoon into the ooplasm, bypassing the
          absent ZP required for conventional IVF sperm binding. Following careful individual microdrop
          culture of fragile ZP-free embryos to the blastocyst stage and embryo transfer, live births
          of healthy infants have been achieved.
