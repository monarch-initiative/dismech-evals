        context: []
      assertion_type: Inheritance
      assertion:
        name: Sex-limited expression
        inheritance_term:
          preferred_term: Sex-limited expression
          term:
            id: HP:0001470
            label: Sex-limited expression
        description: Because the zona pellucida is an oocyte-specific extracellular matrix, ZP1 pathogenic
          variants manifest exclusively in females. Heterozygous and homozygous male carriers are fertile
          and can transmit pathogenic ZP1 alleles to affected daughters.
      selected_evidence:
        snippet: In a patient (II-1) displaying abnormal zona pellucida formation, we successfully identified
          the heterozygous ZP1 mutation (ZP1-Y262C) via whole-exome sequencing. Subsequent exome sequencing
          of the patient’s father (I-2) confirmed his carrier status for the ZP1 mutation, while the mother
          (I-1) exhibited a normal genotype (Figures 2A,B).
        supports: SUPPORT
