      assertion_type: Discussion
      assertion:
        discussion_id: oomd1_species_zp_composition_divergence
        prompt: Why do human patients and Zp1-knock-in rats with ZP1 mutations exhibit complete absence
          of the zona pellucida or empty follicle syndrome, whereas Zp1-null knockout mice assemble a
          loosely organized ZP2/ZP3 coat and remain subfertile?
        kind: HUMAN_MODEL_MISMATCH
        status: RESOLVED
        attaches_to:
        - animal_models#Zp1 p.I390fs404X homozygous knock-in rat (Zp1MT/MT)
        - animal_models#Zp1-null knockout mouse (Zp1tm/tm)
        - pathophysiology#ZP1 Loss-of-Function and Cytoplasmic Co-Sequestration of Zona Pellucida Glycoproteins
        rationale: Humans, macaques, and rats express four zona pellucida glycoproteins (ZP1, ZP2, ZP3,
          ZP4), whereas mice have a pseudogenized Zp4 gene and express only three subunits (mZP1, mZP2,
          mZP3). Furthermore, human and rat truncating or missense ZP1 mutant proteins accumulate in the
          oocyte cytoplasm and actively bind and sequester ZP3 and ZP4 intracellularly, blocking their
          secretion and preventing any extracellular ZP matrix assembly, whereas complete Zp1 null alleles
          in mice allow unimpeded secretion of mZP2 and mZP3 to form an uncross-linked matrix.
      selected_evidence:
        snippet: Studies in 293T cells showed that mutant Zp1 resulted in a truncated ZP1 protein, which
          might be intracellularly sequestered and interacted with wild-type ZP3 or ZP4.
        supports: SUPPORT
