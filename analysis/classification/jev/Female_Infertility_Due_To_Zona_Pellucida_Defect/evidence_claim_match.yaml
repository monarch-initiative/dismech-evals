        snippet: Sixty-nine mutations of the ZP genes were reported in 87 patients with different clinical
          phenotypes, including empty follicle syndrome (EFS), ZP-free oocytes (ZFO), ZP-thin oocytes
          (ZTO), degenerated and immature oocytes. The phenotypes of patients were influenced by the types
          and location of the mutations. The most common effects of ZP mutations are protein truncation
          and dysfunction. Three patients with ZP1 mutations, two with ZP2 mutations, and three with ZP4
          mutations had successful pregnancies through Intracytoplasmic sperm injection (ICSI) from ZFO
          or ZTO.
