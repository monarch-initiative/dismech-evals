            term:
              id: MONDO:0014342
              label: female infertility due to zona pellucida defect
        context: []
      assertion_type: Genetic
      assertion:
        name: ZP1
        association: Causative
        gene_term:
          preferred_term: ZP1
          term:
            id: hgnc:13187
            label: ZP1
        case_fractions:
        - population: North African cohort of women with oocyte maturation defect
          case_fraction_percent: 18.5
          cohort_size: 27
          notes: Five of 27 (18.5%) North African patients with severe oocyte maturation defect harbored
            the homozygous founder variant ZP1 c.1097G>A (p.Arg366Gln), reported in the study text as
            an allelic frequency of 17.9% (10 of 56 alleles across analyzed subjects). In a separate Chinese
            cohort of 35 women with genuine empty follicle syndrome and oocyte degeneration (PMID:33272616),
            combined ZP1, ZP2, and ZP3 variants accounted for 18 of 35 cases (51.43%), with 20 distinct
            ZP1 variants identified across the cohort.
        variants:
        - name: c.1169_1176del (p.Ile390Thrfs*16)
          gene:
            preferred_term: ZP1
            term:
              id: hgnc:13187
              label: ZP1
          clinical_significance: PATHOGENIC
          variant_type: deletion
          type: frameshift_variant
          genomic_contexts:
          - coding sequence
          description: Index homozygous 8-bp frameshift deletion in the ZP-C subdomain of ZP1 resulting
            in premature truncation (p.Ile390Thrfs*16, also referred to as I390fs404X), abolishing the
            C-terminal consensus furin cleavage site and transmembrane domain, blocking ZP1 secretion,
            and causing cytoplasmic sequestration of ZP3 and ZP4.
        - name: c.1097G>A (p.Arg366Gln)
          gene:
            preferred_term: ZP1
            term:
              id: hgnc:13187
              label: ZP1
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
          type: missense_variant
          genomic_contexts:
          - coding sequence
          description: Recurrent North African founder missense variant in exon 6 within the ZP-N subdomain
            of ZP1; homozygosity causes oocyte death, retrieval of shriveled dark degenerated oocytes,
            or genuine empty follicle syndrome.
        - name: c.326G>A (p.Arg109His)
          gene:
            preferred_term: ZP1
            term:
              id: hgnc:13187
              label: ZP1
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
          type: missense_variant
          genomic_contexts:
          - coding sequence
          description: N-terminal ZP-N1 cross-linking domain missense variant that impairs ZP1 secretion
            and cross-linking function, reported in heterozygous state in a woman with ZP-free oocytes
            who achieved live birth after ICSI.
        - name: c.247T>C (p.Trp83Arg)
          gene:
            preferred_term: ZP1
            term:
              id: hgnc:13187
              label: ZP1
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
          type: missense_variant
          genomic_contexts:
          - coding sequence
          description: Missense variant in the N-terminal ZP-N1 domain (c.247T>C, p.Trp83Arg) that reduces
            hZP1-N1 secretion and disrupts intermolecular disulfide-bonded homodimerization required for
            human ZP filament cross-linking.
        - name: c.785A>G (p.Tyr262Cys)
          gene:
            preferred_term: ZP1
            term:
              id: hgnc:13187
              label: ZP1
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
          type: missense_variant
          genomic_contexts:
          - coding sequence
          description: Paternally inherited heterozygous missense variant in the trefoil domain of ZP1
            (c.785A>G, p.Tyr262Cys) that introduces an unpaired cysteine, impairs ZP1 glycosylation and
            secretion, and causes abnormal zona pellucida formation.
        notes: Over 47 pathogenic variants in ZP1 have been identified across all structural domains of
          the 638-amino-acid glycoprotein, including the N-terminal ZP-N1 cross-linking domain (e.g.,
          p.Cys80Tyr, p.Tyr81His, p.Trp83Arg, p.Arg109Cys, p.Arg109His), the proline-rich linker, the
          trefoil domain (e.g., p.Gln257Ter, p.Tyr262Cys, p.Glu267Glyfs*80), the bipartite zona pellucida
          domain (ZP-N and ZP-C subdomains, including the recurrent North African founder variant c.1097G>A
          p.Arg366Gln, the frameshift c.1169_1176del p.Ile390Thrfs*16, and p.Arg410Trp), the consensus
          furin cleavage site (CFCS), and the C-terminal transmembrane domain. Biallelic truncating or
          splice-site variants most frequently cause genuine empty follicle syndrome or severe oocyte
          degeneration, whereas certain missense or frameshift variants allow retrieval of ZP-free metaphase
          II oocytes.
      selected_evidence:
        snippet: Sequencing of candidate genes ZP1, ZP2, ZP3, and ZP4 revealed that six members of generation
          IV (the four patients and two unmarried family members) carried a homozygous frameshift deletion
          of 8 bp encompassing nucleotides 1169 through 1176 in ZP1 (GenBank accession number, KJ489454).
        supports: SUPPORT
