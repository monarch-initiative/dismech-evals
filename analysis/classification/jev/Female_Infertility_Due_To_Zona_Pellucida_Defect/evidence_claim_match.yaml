        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of ZP1-N1 Disulfide Cross-Linking and Zona Pellucida Extracellular Matrix Assembly
        description: In healthy human oocytes, secreted ZP2, ZP3, and ZP4 polymerize into long filaments
          that are covalently cross-linked into a stable three-dimensional extracellular matrix via intermolecular
          disulfide bonds (mediated by conserved Cys66 in chicken ZP1 and the corresponding Cys77 in the
          N-terminal ZP-N1 domain of human ZP1) forming ZP1-N1 homodimers, while human ZP4-N1 remains
          monomeric and cannot substitute for ZP1 cross-linking. Pathogenic ZP1 variants either eliminate
          secreted ZP1, disrupt ZP1-N1 homodimerization (such as p.Trp83Arg and p.Arg109His), alter the
          trefoil or ZP domains, or abolish heteromeric interaction with ZP2 and ZP3, resulting in a markedly
          thinned, fragile, or completely absent zona pellucida matrix.
        genes:
        - preferred_term: ZP1
          term:
            id: hgnc:13187
            label: ZP1
