          name: Female_Infertility_Due_To_Zona_Pellucida_Defect
          disease_term:
            preferred_term: female infertility due to zona pellucida defect
            term:
              id: MONDO:0014342
              label: female infertility due to zona pellucida defect
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oocyte Mitochondrial Dysfunction, Fragility, and Intra-Follicular Degeneration
        description: Deprived of a protective zona pellucida scaffold and cumulus-oocyte metabolic coupling,
          ZP1-deficient oocytes develop transcriptomic and ultrastructural hallmarks of cellular stress,
          including downregulation of antioxidant defenses (such as SOD2), oxidative stress, extensive
          mitochondrial swelling at germinal vesicle and metaphase II stages, increased autophagy, and
          extreme mechanical vulnerability to shear stress. Consequently, oocytes either degenerate within
          antral follicles prior to ovulation or rupture during transvaginal follicular aspiration, resulting
          in retrieval of shriveled, dark degenerated oocytes or genuine empty follicle syndrome (GEFS).
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
        locations:
        - preferred_term: ovary
          term:
            id: UBERON:0000992
            label: ovary
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        biological_processes:
        - preferred_term: oocyte development
          term:
            id: GO:0048599
            label: oocyte development
          modifier: ABNORMAL
      selected_evidence:
        snippet: The antral follicles were also defective in normal cumulus-oocyte complex organisation,
          leading us to speculate that the lack of ZP1 might lead to oocyte degeneration or increased
          fragility of the oocyte during follicular puncture, ultimately resulting in EFS.
        supports: SUPPORT
