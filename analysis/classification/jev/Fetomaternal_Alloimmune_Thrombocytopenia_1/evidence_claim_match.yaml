        description: 'Antenatal maternal intravenous immunoglobulin (IVIG), with or without corticosteroids,
          is the standard noninvasive management of a subsequent at-risk pregnancy, given to raise the
          fetal platelet count and reduce the risk of intracranial hemorrhage. A randomized trial comparing
          0.5 g/kg with 1 g/kg found a similarly low risk of adverse outcomes, but stopped early for poor
          recruitment and was underpowered to establish noninferiority.

          '
        therapeutic_modality: OTHER
        treatment_term:
