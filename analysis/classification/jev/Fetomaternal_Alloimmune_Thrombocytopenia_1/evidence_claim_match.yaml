      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other causes of neonatal thrombocytopenia
        description: 'A thrombocytopenic newborn is worked up for this disease against the other causes
          of neonatal thrombocytopenia. It is the commonest cause of severe neonatal thrombocytopenia,
          and the distinguishing features at presentation are quantitative rather than qualitative: a
          markedly lower platelet nadir and a greater need for treatment than in thrombocytopenia from
          other causes. There is no clinical predictor that settles it, so confirmation rests on maternal
          and neonatal HPA typing with antibody testing.

          '
      selected_evidence:
        snippet: 61.5% of NAIT+ infants required treatment compared with 23% of non-NAIT ( P =0.015)
        supports: SUPPORT
