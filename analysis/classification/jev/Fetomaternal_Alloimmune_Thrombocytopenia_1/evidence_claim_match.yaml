          numbers in culture by inducing apoptosis and death of early megakaryocytes and megakaryocyte
          progenitors, while the surviving cells mature normally. Impaired production therefore contributes
          to the low neonatal platelet count alongside accelerated clearance, and the degree of suppression
          correlates with the platelet count at birth.

          '
        cell_types:
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
        biological_processes:
