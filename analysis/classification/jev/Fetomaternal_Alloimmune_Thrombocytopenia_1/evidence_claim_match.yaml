        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ich_risk_determinants
        prompt: 'What determines whether a pregnancy affected by anti-HPA-1a FNAIT suffers intracranial
          hemorrhage, given that no predictive factor is available to guide antenatal prophylaxis and
          the relationship to the fetal platelet count is loose?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Antiendothelial Injury and Impaired Angiogenesis
        - phenotypes#Intracranial Hemorrhage
        rationale: 'The entry models two routes to hemorrhage, one through the platelet count and one
          through endothelial injury by the anti-alphaV-beta3 subtype. Which dominates in humans is unresolved,
          and it is the question that decides whether hemorrhage risk should be stratified on antibody
          level, antibody subtype, or obstetric history. The gap is practical as well as mechanistic:
          treatment in a subsequent pregnancy is currently allocated largely on history.

          '
      selected_evidence:
        snippet: No predictive factors for ICH are available to guide prophylactic treatment during pregnancy.
        supports: SUPPORT
