        context:
        - path: /pathophysiology/0
          value:
            name: Paternally Inherited HPA-1a Antigen on Fetal Platelet Integrin Beta-3
            role: trigger
            biological_scale: MOLECULAR
            description: 'The HPA-1 system is defined by a single Leu33Pro substitution on the PSI domain
              of the integrin beta-3 chain (platelet glycoprotein IIIa, ITGB3); the Leu33 form is HPA-1a.
              A fetus that inherits HPA-1a from the father carries the antigen on its platelet alphaIIb-beta3
              and on endothelial alphaV-beta3. When the pregnant person is HPA-1b/1b, that antigen is
              foreign and can prime an alloimmune response. The beta-3 chain''s own molecular function
              is unchanged by which HPA-1 allele it carries: this is a common blood-group polymorphism,
              not a pathogenic lesion in the affected individual, and the fibrinogen-binding function
              named here identifies the receptor the epitope sits on rather than asserting any loss of
              it.

              '
