      selected_evidence:
        snippet: The risk of adverse outcomes in FNAIT pregnancies treated with IVIG at 0.5 g/kg is very
          low, similar to that using 1 g/kg, although our uncompleted trial lacked the power to conclusively
          prove the noninferiority of using the low dose.
        supports: SUPPORT
