              label: fetomaternal alloimmune thrombocytopenia 1
        context: []
      assertion_type: Genetic
      assertion:
        name: ITGB3 (HPA-1 antigen locus)
        relationship_type: SUSCEPTIBILITY
        gene_term:
          preferred_term: ITGB3
          term:
            id: hgnc:6156
            label: ITGB3
        variants:
        - name: HPA-1a (ITGB3 Leu33)
          description: 'HPA-1a is the Leu33 form of the common Leu33Pro polymorphism on the PSI domain
            of integrin beta-3. It is an ordinary blood-group antigen rather than a pathogenic variant;
            disease arises only when a fetus inherits HPA-1a from the father while the pregnant person
            is HPA-1b/1b and alloimmunized.

            '
        notes: 'ITGB3 is curated here as the HPA-1 antigen locus, not as a disease gene in the usual sense.
          No pathogenic ITGB3 variant is involved: the relevant allele is the common antigen-positive
          HPA-1a (Leu33) form. The genotype that matters is the fetus''s, inherited from the father, so
          it does sit in the affected individual, but it is necessary and nowhere near sufficient: disease
          also requires the pregnant person to be HPA-1a negative (HPA-1b/1b), to carry HLA-DRB3*01:01
          in practice, and to be producing anti-HPA-1a IgG. SUSCEPTIBILITY is the closest available relationship
          value. The required discordance between two genomes, fetal and maternal, and the maternal HLA-DRB3*01:01
          restriction cannot be expressed in a single-genome gene-disease model, so both are recorded
          in the pathophysiology nodes instead of as further gene descriptors. This follows the modelling
          stance taken for the blood-group loci in Hemolytic Disease of the Fetus and Newborn. There is
          no Mendelian mode of inheritance, so no inheritance block is given.

          '
      selected_evidence:
        snippet: most frequently HPA-1a on integrin β3
        supports: SUPPORT
