      assertion_type: Diagnosis
      assertion:
        name: Radiographic Evaluation
        description: 'Postmortem or postnatal radiography reveals the characteristic combination of dumbbell-shaped
          long bones with metaphyseal flaring, pear-shaped platyspondyly with vertebral clefting, and
          short ribs with distal cupping. These findings distinguish fibrochondrogenesis from other lethal
          skeletal dysplasias.

          '
      selected_evidence:
        snippet: The long bones are short and dumbbell-shaped with metaphyseal flare. The spine is platyspondylic
          with superior-inferior clefting defects, and the ribs are short and distally cupped.
        supports: SUPPORT
