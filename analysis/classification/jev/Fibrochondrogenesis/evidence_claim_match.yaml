            term:
              id: MONDO:0016068
              label: fibrochondrogenesis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Collagen Fibril Disorganization
        description: 'Loss of functional type XI collagen disrupts the type II/XI collagen heterotypic
          fibril in cartilage, contributing to disordered matrix architecture. Type XI collagen normally
          templates and stabilizes the type II collagen fibril; without it, type II collagen is still
          synthesized but is prematurely degraded and mislocalized in maturing cartilage, leaving the
          fibril network frayed and irregular.

          '
        cell_types:
        - preferred_term: Growth Plate Chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: Collagen Fibril Organization
          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: ABNORMAL
        - preferred_term: Extracellular Matrix Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
        - preferred_term: Premature Type II Collagen Degradation
          term:
            id: GO:0030574
            label: collagen catabolic process
          modifier: INCREASED
      selected_evidence:
        snippet: We show that in col11a2 mutants, type II collagen is made but is prematurely degraded
          in maturing cartilage and ectopically expressed in the joint.
        supports: SUPPORT
