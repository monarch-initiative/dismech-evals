        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inflammatory Triggering of Flare-ups
        description: Macrophages, mast cells, and lymphocytes infiltrate affected tissues during the catabolic
          phase, releasing inflammatory cytokines that create a permissive microenvironment for heterotopic
          ossification. Mast cell depletion reduces HO by approximately 50%, and combined mast cell/macrophage
          depletion reduces HO by approximately 75%.
        cell_types:
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: Mast cell
          term:
            id: CL:0000097
            label: mast cell
        biological_processes:
        - preferred_term: Inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
        notes: Multiple lines of evidence indicate a key role for the immune system in driving FOP pathogenesis.
          Activin A produced by innate immune cells after soft-tissue injury aberrantly signals through
          mutant ACVR1.
      selected_evidence:
        snippet: Fibrodysplasia ossificans progressiva (FOP), a rare and as yet untreatable genetic disorder
          of progressive extraskeletal ossification, is the most disabling form of heterotopic ossification
          (HO) in humans
        supports: NO_EVIDENCE
