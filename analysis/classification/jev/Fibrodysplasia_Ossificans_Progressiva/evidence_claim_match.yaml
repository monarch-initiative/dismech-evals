  19b9cbdbe58cbc6281965f4c4679ed912a784bfae72a7965014dbb3ec66d2667:
    claim:
      about:
        disease:
          name: Fibrodysplasia Ossificans Progressiva
          disease_term:
            preferred_term: fibrodysplasia ossificans progressiva
            term:
              id: MONDO:0007606
              label: fibrodysplasia ossificans progressiva
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Activin A Neomorphic Signaling
        description: The R206H mutation renders ACVR1 responsive to Activin A ligands, which normally
          antagonize BMP signaling. This neomorphic gain-of-function allows Activin A to aberrantly activate
          osteogenic signaling, driving heterotopic ossification. Anti-Activin A antibodies can block
          HO. Activin A is an obligate factor for the initiation of HO in FOP.
        biological_processes:
        - preferred_term: BMP signaling pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
        notes: This discovery led to development of garetosmab (anti-Activin A antibody) as a targeted
          therapy for FOP.
      selected_evidence:
        snippet: Most FOP patients carry an activating mutation in a bone morphogenetic protein (BMP)
          type I receptor gene, ACVR1(R206H), that promotes ectopic chondrogenesis and osteogenesis and,
          in turn, HO
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26896819
      reference_title: Palovarotene Inhibits Heterotopic Ossification and Maintains Limb Mobility and
        Growth in Mice With the Human ACVR1(R206H) Fibrodysplasia Ossificans Progressiva (FOP) Mutation.
      evidence_source: MODEL_ORGANISM
      explanation: Supports mutant ACVR1-driven ectopic osteochondrogenesis, but does not directly establish
        Activin A neomorphic signaling.
