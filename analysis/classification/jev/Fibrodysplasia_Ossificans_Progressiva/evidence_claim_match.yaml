      assertion_type: Pathophysiology
      assertion:
        name: Constitutive BMP Signaling Activation
        description: The ACVR1 R206H mutation creates a pH-sensitive switch in the receptor's activation
          domain, leading to ligand-independent activation of BMP signaling and inappropriate osteogenic
          differentiation of connective tissue progenitors.
        biological_processes:
        - preferred_term: BMP signaling pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
      selected_evidence:
        snippet: Protein modeling predicts that substitution with histidine, and only histidine, creates
          a pH-sensitive switch within the activation domain of the receptor that leads to ligand-independent
          activation of ACVR1 in fibrodysplasia ossificans progressiva.
        supports: SUPPORT
    origin:
