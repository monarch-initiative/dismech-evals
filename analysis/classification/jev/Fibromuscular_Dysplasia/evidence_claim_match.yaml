            id: CL:0000115
            label: endothelial cell
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: Extensive studies have correlated the arterial lesions of FMD to histopathological findings
          of arterial fibrosis, cellular hyperplasia, and distortion of the abnormal architecture of the
          arterial wall.
        supports: SUPPORT
