      assertion_type: Pathophysiology
      assertion:
        name: Systemic non-atherosclerotic arteriopathy
        description: FMD involves abnormal arterial wall architecture in medium-sized muscular arteries,
          with fibrosis, cellular hyperplasia, and remodeling that can produce focal or multifocal stenoses
          and expanded vascular phenotypes such as aneurysm, dissection, and tortuosity.
        cell_types:
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        - preferred_term: endothelial cell
