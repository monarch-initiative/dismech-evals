            display_name: McCune-Albright syndrome (FD with extraskeletal disease)
            description: 'Fibrous dysplasia occurring together with extraskeletal manifestations of the
              same mosaic GNAS activation: cafe-au-lait macules and one or more hyperfunctioning endocrinopathies.
              It is not a separate disease from fibrous dysplasia but the extraskeletal end of one mosaic
              spectrum, which is why this entry covers both and is scoped as FD/MAS throughout.

              The distinction is one of which tissues carry the mosaic clone rather than of mechanism.
              The extraskeletal arm of the pathophysiology graph, downstream of Extraskeletal mosaic GNAS
              activation, is the MAS pathograph.

              Frequency note: the phenotypes assigned to this subtype carry no frequency band. The Orphanet
              source for this entry is ORPHA:249, fibrous dysplasia of bone, so its bands are frequencies
              within fibrous dysplasia as a whole, in which extraskeletal features are uncommon because
              most fibrous dysplasia is skeletal-limited. Within McCune-Albright syndrome the same features
              are defining rather than rare. Carrying the ORPHA:249 bands onto these phenotypes would
              state the frequency of the wrong population, so they are omitted until a MAS-scoped source
              is curated.'
            genes:
            - preferred_term: GNAS
              term:
                id: hgnc:4392
                label: GNAS
              description: The same post-zygotic activating GNAS variant that causes skeletal fibrous
                dysplasia; McCune-Albright syndrome differs by which tissues carry the mosaic clone, not
                by gene.
          role: subtype
