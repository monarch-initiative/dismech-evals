      assertion:
        name: Failure of Ficolin-3-Dependent Lectin Pathway Activation
        biological_scale: MOLECULAR
        description: Ficolin-3 is the recognition molecule that binds acetylated ligands on microbial
          and altered-self surfaces and recruits MASPs to cleave C4 and C2. Its absence abolishes ficolin-3-dependent
          complement activation specifically; mannose-binding lectin and the ficolin-2 arm remain, which
          is one reason the clinical consequence is more variable than a deficiency of a shared downstream
          component such as C2.
        biological_processes:
        - preferred_term: complement activation, lectin pathway
          term:
            id: GO:0001867
            label: complement activation, lectin pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Ficolin-3 (also called H-ficolin or Hakata antigen) is the most potent activator of the
          lectin pathway of complement in vitro.
        supports: SUPPORT
