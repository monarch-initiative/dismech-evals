        description: The +1637delC frameshift (rs28357092) distorts the C-terminal end of ficolin-3, which
          carries the fibrinogen-like recognition domain. Homozygotes have undetectable ficolin-3 in serum.
          Ficolin-3 is expressed in liver and lung, so the deficiency removes both the circulating and
          the airway pool.
        genetic_context:
          gene:
            preferred_term: FCN3
