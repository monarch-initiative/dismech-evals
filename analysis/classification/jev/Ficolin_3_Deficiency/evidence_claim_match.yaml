              id: hgnc:3625
              label: FCN3
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Characterization of recombinant Ficolin-3 derived from FCN3+1637delC showed that in the
          homozygous situation this allelic variant would lead to Ficolin-3 deficiency.
        supports: SUPPORT
