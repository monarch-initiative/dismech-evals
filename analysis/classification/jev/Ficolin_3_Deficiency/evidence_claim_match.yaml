  ec5c846ad4fde27913c2c603d336ca16f1ef48a635514f2012e6b60a92144fde:
    claim:
      about:
        disease:
          name: Ficolin 3 Deficiency
          disease_term:
            preferred_term: immunodeficiency due to ficolin3 deficiency
            term:
              id: MONDO:0013467
              label: immunodeficiency due to ficolin3 deficiency
        context: []
      assertion_type: Prevalence
      assertion:
        population: Newborns of European origin from Krasnoyarsk city, Siberia
        measure_type: UNKNOWN
        prevalence_class: ABOVE_1_IN_1000
        rate_per_100000: 3300.0
        notes: 'Read this record with its caveats or not at all.

          It is a genotype frequency in a newborn sample, not a disease prevalence - the deficiency genotype
          was counted, no phenotype was assessed, and the authors defer infectious-morbidity analysis
          to future work. measure_type is UNKNOWN rather than BIRTH_PREVALENCE for that reason: labelling
          it a birth prevalence would invite a consumer to read 3300 per 100,000 as the rate at which
          this disease is born.

          The population is the study''s comparison group, not its subject. Krasnoyarsk city sits around
          56 degrees north, roughly 2,000 km south of the Taimyr Dolgano-Nenets region whose indigenous
          populations the study is about. Those Arctic groups carry the genotype at 0% (Nenets) and 0.8%
          (Dolgans and Nganasans); the high figure belongs to the Caucasian controls.

          The figure is the full text''s 3.3% (10 of 302), not the abstract''s 3.5%.

          Most importantly, the genotype distribution is internally inconsistent. The same paper reports
          one heterozygote in the entire 926-newborn sample against 15 del/del homozygotes. Hardy-Weinberg
          at that homozygote rate predicts heterozygotes in the hundreds. A common rare homozygote with
          an absent heterozygote is the signature of allele dropout in a single-base-deletion assay, so
          this may be measuring the assay rather than the population. It is curated because it is the
          only unselected genotype screen published, not because the number is reliable.'
      selected_evidence:
        snippet: 'it was found in our cohort of the studied samples in

          10 Russian newborns (3.3 %), in 4 newborns from a mixed

          population (2.0 %) and in one of the Dolgan and Nganasan

          group (0.8 %)'
        supports: SUPPORT
    origin:
