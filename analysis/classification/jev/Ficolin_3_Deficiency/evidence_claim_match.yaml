  f966a87c76b6448776debb76fdd01611bd3099ad56f994d57436944a2f1ec867:
    claim:
      about:
        disease:
          name: Ficolin 3 Deficiency
          disease_term:
            preferred_term: immunodeficiency due to ficolin3 deficiency
            term:
              id: MONDO:0013467
              label: immunodeficiency due to ficolin3 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ficolin3_penetrance_versus_carrier_frequency
        kind: KNOWLEDGE_GAP
        attaches_to:
        - prevalence#White (Caucasian) populations
        prompt: Why have so few homozygotes been reported when the carrier frequency predicts many more?
        rationale: 'The Danish allele frequency of 0.011 implies roughly 1 in 10,000 homozygotes, which
          would be tens of thousands of people in Europe alone against fewer than a dozen clinically published
          cases. Either the deficiency is usually silent and those cases are an ascertainment tail, or
          homozygosity is rarer than Hardy-Weinberg predicts.

          What the published data can and cannot settle is worth stating precisely, because the obvious
          reading of the one unselected genotype screen does not survive reading its full text.

          That screen - 926 Siberian newborns, reported across two papers by the same group and not two
          independent cohorts - finds del/del at 1.6% overall and 3.3% in its Krasnoyarsk city comparison
          group. Taken at face value that is orders of magnitude above the Danish-derived prediction and
          would settle the question in favour of a usually-silent deficiency. It cannot be taken at face
          value. The same paper reports a single heterozygote in all 926, against 15 homozygotes; no allele
          frequency produces that distribution, and it is the signature of allele dropout in a single-base-deletion
          assay. The study also assessed no phenotypes, deferring infectious morbidity to future work,
          so the homozygotes are not known to be well - nobody looked.

          One thing does survive from it, and it is the part that matters here: the 1-in-10,000 figure
          is specific to the population it was computed from. The Danish allele frequency of 0.011 is
          not a global constant, and both the Siberian data and the Ensembl range the paper cites (1-3%
          variant allele, zero in Asian populations) say the denominator differs by population. There
          is no single worldwide prediction for the case count to fall short of.

          So the honest position is that the question is open and the evidence available to close it is
          one Polish neonatal series (613 serum concentrations, 529 genotypes), which found exactly one
          homozygote - who had a confirmed group B streptococcal infection - and one Siberian genotype
          screen whose internal distribution cannot be reconciled. Whether that single infected European
          homozygote is chance, ascertainment, or a real signal is not answerable from what is published.
          This bears directly on whether the pathophysiology nodes above describe a disease or a risk
          factor.'
      selected_evidence:
        snippet: Serum H-ficolin (ficolin-3) concentrations (n=613) and FCN3 genotypes (n=529) from a
          large group of neonates are presented.
        supports: SUPPORT
    origin:
