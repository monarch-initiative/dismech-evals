      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_ckap2l_knockout_mouse_lacks_human_phenotype
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does a constitutive Ckap2l knockout mouse show no overt developmental abnormality
          — no microcephaly, no growth failure, no digit anomaly — when biallelic human CKAP2L loss of
          function causes a multiple-congenital-anomaly syndrome?
        attaches_to:
        - pathophysiology#Neural Progenitor Division Failure
        - pathophysiology#Cortical Progenitor Pool Depletion
        - pathophysiology#Reduced Cortical Neuron Output and Postnatal Microcephaly
        rationale: 'This is the sharpest open problem in the disorder''s mechanism. The canonical model
          attributes human microcephaly to CKAP2L-dependent neural progenitor division, and the mouse
          ortholog radmis was the source of that model — yet the 2026 constitutive knockout produced only
          reduced male fertility with abnormally elongated sperm flagella, not the human developmental
          phenotype. Candidate explanations that would change how the mechanism should be curated include:
          (1) mouse-specific paralog redundancy (e.g. CKAP2) that human progenitors lack; (2) a human-specific
          requirement in outer radial glia and the OSVZ, the compartment responsible for primate cortical
          expansion and absent from lissencephalic mouse cortex — the same argument already recorded for
          other progenitor microcephalies in this KB; or (3) that the human phenotype does not in fact
          arise from the progenitor-proliferation arm at all. Until this is resolved, the mouse data support
          the cellular spindle phenotype but do not license the inference from spindle defect to human
          microcephaly.'
        proposed_experiments:
        - experiment_id: exp_ckap2l_human_cortical_organoid
          name: CKAP2L-null human cortical organoid phenotyping
          description: Generate CKAP2L-null and patient-variant human iPSC-derived cortical organoids
            alongside isogenic controls and quantify apical and basal progenitor number, outer-radial-glia
            abundance, spindle orientation, and organoid size across corticogenesis.
          experiment_type:
            preferred_term: human iPSC-derived organoid disease modeling
          decision_criterion: The progenitor arm is supported for human biology if CKAP2L-null organoids
            show reduced progenitor number and organoid size relative to isogenic controls; a null result
            would argue that the mouse-based progenitor model does not explain the human phenotype.
        - experiment_id: exp_ckap2l_ckap2_paralog_redundancy
          name: Ckap2l/Ckap2 paralog-redundancy test in mouse cortex
          description: Compare Ckap2l single-knockout with Ckap2l;Ckap2 double-knockout mouse cortex for
            progenitor depletion, spindle phenotype, and brain size.
          experiment_type:
            preferred_term: mouse compound-knockout genetic interaction study
          decision_criterion: Paralog redundancy explains the absent single-knockout phenotype if the
            double knockout, but not the single knockout, reproduces progenitor depletion and reduced
            brain size.
        - experiment_id: exp_ckap2l_primary_human_progenitor_spindle
          name: Spindle phenotype in primary human neural progenitors
          description: Assay primary human fetal neural progenitors, or patient-derived cells differentiated
            to a progenitor state, for the multipolar-spindle and cytokinesis-failure phenotypes described
            in lymphoblastoid cells.
          experiment_type:
            preferred_term: primary human cell immunofluorescence assay
          decision_criterion: The cellular defect is relevant to the disease-affected cell type if multipolar
            spindles and cytokinesis failure are reproduced in human neural progenitors, not only in lymphoblastoid
            lines.
      selected_evidence:
        snippet: Ckap2l knockout mice show no overt developmental abnormalities, with the exception of
          reduced male fertility, evidenced by decreased sperm count, impaired motility, and abnormally
          elongated flagella.
        supports: SUPPORT
