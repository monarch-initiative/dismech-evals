            term:
              id: MONDO:0010092
              label: Filippi syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: CKAP2L molecular genetic testing
        description: 'Molecular confirmation rests on demonstrating biallelic CKAP2L variants. Both routes
          taken in the literature are exome-based: homozygosity mapping plus whole-exome sequencing in
          the consanguineous discovery family, and trio/family whole-exome sequencing in the outbred family
          that established compound heterozygosity. Because most reported alleles are frameshift or canonical
          splice-site, a gene panel or exome with adequate CKAP2L coverage is sufficient; the one reported
          missense allele was only interpretable because it was phased in trans with a frameshift allele.'
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: 'A negative CKAP2L result does not exclude the clinical diagnosis: only four of eight individuals
          with clinical features consistent with Filippi syndrome carried biallelic CKAP2L variants in
          the replication cohort (PMID:25439729), which is the same genetic-heterogeneity caveat carried
          in the genetic counseling treatment entry and in the entry-level notes.'
      selected_evidence:
        snippet: We performed homozygosity mapping and whole-exome sequencing in a Sardinian family with
          two affected children and identified a homozygous frameshift mutation
        supports: SUPPORT
