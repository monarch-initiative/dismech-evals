      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: centrosomopathy_ciliary_model
        hypothesis_label: Centrosomopathy model (concurrent proliferation and ciliary defects)
        status: EMERGING
        description: A 2026 proposal that Filippi syndrome should be reclassified as a centrosomopathy
          in which CKAP2L loss simultaneously impairs mitosis and de-represses primary cilium elongation,
          with ciliary signalling contributing to the non-neural (craniofacial, digital, and possibly
          renal) features. The ciliary-length data are from human and mouse cell lines only; no patient
          tissue or clinical correlate has yet been reported, and the strongest in vivo test to date (the
          Ckap2l knockout mouse) produced no developmental phenotype at all.
      selected_evidence:
        snippet: these findings position CKAP2L as a multifunctional regulator of microtubule-based organelles
          and suggest that Filippi syndrome can be classified as a 'centrosomopathy' arising from concurrent
          defects in cell proliferation and ciliary function.
        supports: SUPPORT
