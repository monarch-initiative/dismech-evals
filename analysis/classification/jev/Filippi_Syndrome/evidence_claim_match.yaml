      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mitotic_proliferation_deficit_model
        hypothesis_label: Mitotic spindle / progenitor proliferation deficit model
        status: CANONICAL
        description: 'The established model: CKAP2L is a spindle-pole microtubule-associated protein required
          for bipolar spindle assembly and mitotic progression, and its biallelic loss produces multipolar
          spindles, chromosome missegregation, and cytokinesis failure. In the neural stem/progenitor
          compartment where the protein is enriched, this depletes the cortical progenitor pool and yields
          microcephaly; the same proliferation deficit is invoked, less directly, for the growth failure
          and craniodigital features.'
      selected_evidence:
        snippet: Our findings show that loss-of-function mutations in CKAP2L are a major cause of Filippi
          syndrome.
        supports: SUPPORT
