      assertion_type: Discussion
      assertion:
        discussion_id: gap_centrosomopathy_reclassification_clinical_correlate
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        prompt: Should Filippi syndrome be reclassified as a centrosomopathy/ciliopathy, and is there
          a clinical correlate of the ciliary-length defect in patients?
        attaches_to:
        - pathophysiology#Primary Cilium Elongation
        - pathophysiology#Impaired Craniofacial and Digital Morphogenesis
        rationale: The reclassification proposal rests on cell-line data showing elongated primary cilia
          after CKAP2L depletion. The clinical spectrum contains two features that are suggestive of a
          ciliopathy — renal cysts and renal hypoplasia, reported in three families in 2024 — but the
          two observations have never been connected in the same patients, and syndactyly plus microcephaly
          are not by themselves ciliopathy-specific. If the link holds, conformance to ciliopathy_dysfunction
          (and possibly renal_cystogenesis) would become appropriate; on current evidence it would be
          premature.
        proposed_experiments:
        - experiment_id: exp_ckap2l_patient_fibroblast_cilium_length
          name: Cilium length and Hedgehog competence in patient fibroblasts
          description: Measure primary cilium length and Hedgehog-response competence in fibroblasts derived
            from individuals carrying biallelic CKAP2L variants, alongside isogenic or unaffected-relative
            controls.
          experiment_type:
            preferred_term: patient-derived primary fibroblast assay
          decision_criterion: The centrosomopathy model gains patient-level support if biallelic-variant
            fibroblasts show significantly elongated cilia and blunted Hedgehog response relative to controls.
        - experiment_id: exp_ckap2l_systematic_renal_imaging
          name: Systematic renal imaging in molecularly confirmed patients
          description: Image the kidneys of all reported and newly ascertained CKAP2L-confirmed patients
            to establish whether renal cysts and hypoplasia are recurrent rather than incidental.
          experiment_type:
            preferred_term: cross-sectional clinical imaging study
          decision_criterion: Renal involvement belongs in the core spectrum, and supports a ciliopathy
            reading, if cysts or hypoplasia are found in a substantial fraction of molecularly confirmed
            patients rather than only the three index families.
      selected_evidence:
        snippet: Given the limited number of reported Filippi syndrome patients to date and the ongoing
          discovery of new clinical aspects of the disease, exploring its potential connection with kidney
          and skin pigmentation abnormalities could be valuable for future research.
        supports: SUPPORT
