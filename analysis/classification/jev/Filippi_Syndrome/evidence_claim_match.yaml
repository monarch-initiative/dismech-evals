        name: Primary Cilium Elongation
        biological_scale: CELLULAR
        description: 'A second, more recently described arm: CKAP2L also localizes to the ciliary basal
          body and acts as a conserved negative regulator of primary cilium length, so its loss markedly
          lengthens cilia in both human and mouse cells. On this basis Filippi syndrome has been proposed
          to be a "centrosomopathy" in which proliferation and ciliary signalling defects act together.
          The arm is curated as an EMERGING hypothesis, not as established disease mechanism: no patient
          tissue has been shown to carry elongated cilia, and no ciliopathy-specific clinical feature
          has been causally tied to it.'
        cell_types:
