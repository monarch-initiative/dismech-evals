      assertion_type: Pathophysiology
      assertion:
        name: Mitotic Spindle Disorganization and Cytokinesis Failure
        biological_scale: CELLULAR
        conforms_to: neural_progenitor_centrosome_spindle_dysfunction#Centrosome and Mitotic Spindle Perturbation
        description: 'Without CKAP2L at the spindle poles, dividing cells assemble disorganized, multipolar,
          and shortened mitotic spindles. The downstream mitotic consequences are twofold: chromosome
          missegregation (including chromosome bridges between separating daughter nuclei in the mouse
          knockdown model) and outright cytokinesis failure producing multinucleated cells. This is the
          conserved centrosome/spindle perturbation node of the neural-progenitor module, instantiated
          here by a spindle-pole-associated MAP rather than by a centriole-duplication or microtubule-severing
          lesion.'
        cell_types:
        - preferred_term: patient-derived lymphoblastoid cell (dividing)
          term:
            id: CL:0017006
            label: B-lymphoblast
        biological_processes:
        - preferred_term: mitotic spindle organization
          term:
            id: GO:0007052
            label: mitotic spindle organization
          modifier: ABNORMAL
        - preferred_term: chromosome segregation
          term:
            id: GO:0007059
            label: chromosome segregation
          modifier: ABNORMAL
        - preferred_term: cytokinesis
          term:
            id: GO:0000910
            label: cytokinesis
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitotic spindle
          term:
            id: GO:0072686
            label: mitotic spindle
      selected_evidence:
        snippet: Depletion of CKAP2L leads to shortened mitotic spindles and cytokinesis failure, resulting
          in multinucleation.
        supports: SUPPORT
