      assertion_type: Discussion
      assertion:
        discussion_id: gap_genotype_phenotype_correlation_ckap2l
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is there a genotype-phenotype correlation in CKAP2L-related Filippi syndrome — in particular,
          do hypomorphic (missense) alleles explain the reported patients with milder neurodevelopmental
          outcome?
        attaches_to:
        - pathophysiology#Reduced Cortical Neuron Output and Postnatal Microcephaly
        rationale: Cognitive outcome ranges from severe intellectual disability with epilepsy to preserved
          intellect in an adolescent male, yet almost all reported alleles are frameshift and presumed
          complete loss of function, leaving the variability unexplained by allele class alone. The single
          reported missense allele has not been functionally characterized. With only 43 published patients
          — a mixture of molecularly confirmed and clinically diagnosed cases — the cohort is too small
          and too heterogeneous to support a correlation analysis, which the systematic review states
          explicitly.
        proposed_experiments:
        - experiment_id: exp_ckap2l_patient_registry_genotype_phenotype
          name: CKAP2L patient registry for genotype-phenotype analysis
          description: Establish an international CKAP2L patient registry with standardized neurodevelopmental,
            growth, and imaging assessment, restricted to molecularly confirmed cases, to power a genotype-phenotype
            analysis.
          experiment_type:
            preferred_term: multicentre patient registry study
          decision_criterion: A genotype-phenotype correlation exists if allele class or residual function
            stratifies neurodevelopmental outcome across the registry cohort.
        - experiment_id: exp_ckap2l_arg689his_functional_characterization
          name: Functional characterization of the p.Arg689His missense allele
          description: Assay the p.Arg689His variant for CKAP2L spindle-pole localization, microtubule
            binding, and rescue of the multipolar-spindle phenotype in CKAP2L-null cells.
          experiment_type:
            preferred_term: variant functional rescue assay
          decision_criterion: The allele is hypomorphic rather than null if it retains partial spindle-pole
            localization and partially rescues the spindle phenotype.
      selected_evidence:
        snippet: Further studies will be needed to delineate genotype-phenotype correlation and standardize
          treatment guidelines.
        supports: SUPPORT
