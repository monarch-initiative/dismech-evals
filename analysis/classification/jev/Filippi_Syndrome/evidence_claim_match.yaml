      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CKAP2L Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function variants in CKAP2L — most commonly homozygous frameshift
          alleles, with rarer canonical splice-site, start-codon, and (in one family) missense alleles
          in trans — abolish or destabilize cytoskeleton-associated protein 2-like. CKAP2L is a bona fide
          microtubule-associated protein that localizes to microtubule-based organelles: the centrosome,
          the mitotic spindle and its poles, and the ciliary basal body. In lymphoblastoid cell lines
          from individuals homozygous for the founding c.571dupA allele, CKAP2L is no longer detectable
          at the spindle poles, establishing loss of function at the level of protein localization rather
          than a dominant-negative or gain-of-function mechanism.'
        genes:
        - preferred_term: CKAP2L
          term:
            id: hgnc:26877
            label: CKAP2L
        molecular_functions:
        - preferred_term: microtubule binding
          term:
            id: GO:0008017
            label: microtubule binding
          modifier: DECREASED
        cellular_components:
        - preferred_term: spindle pole
          term:
            id: GO:0000922
            label: spindle pole
        - preferred_term: centrosome
          term:
            id: GO:0005813
            label: centrosome
        - preferred_term: ciliary basal body
          term:
            id: GO:0036064
            label: ciliary basal body
      selected_evidence:
        snippet: identified a homozygous frameshift mutation, c.571dupA
        supports: SUPPORT
