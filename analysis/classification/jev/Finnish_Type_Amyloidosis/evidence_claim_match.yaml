  5e56b8b1a9617d4beae33bcfb2cb77fa32313ad618ce276002ec8676780fa36b:
    claim:
      about:
        disease:
          name: Finnish Type Amyloidosis
          disease_term:
            preferred_term: Finnish type amyloidosis
            term:
              id: MONDO:0007097
              label: Finnish type amyloidosis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hereditary transthyretin amyloidosis (ATTRv)
        description: 'The other classic hereditary systemic amyloidosis, and the only current member of
          the KB''s Hereditary_Systemic_Amyloidoses grouping. Both are autosomal dominant systemic amyloidoses
          with peripheral neuropathy, but the amyloidogenic mechanism differs fundamentally - ATTR proceeds
          by tetramer dissociation and misfolding of the intact monomer, whereas AGel requires two proteolytic
          cleavages to manufacture its precursor. The therapeutic consequence is a relocation of the stabilisation
          target, not its abolition. A tafamidis-style kinetic stabiliser cannot act on the deposited
          AGel species, because that species is an 8 kDa fragment that does not exist until after the
          protein has been cut. It can act one step earlier: the founding review proposes exactly this,
          a pharmacologic chaperone or kinetic stabiliser binding full-length D187N plasma gelsolin in
          the secretory pathway to hold G2 folded and so prevent the aberrant furin cleavage that starts
          the cascade, and cites the transthyretin programme as the precedent. So the two diseases share
          a drug strategy while differing in where in the pathway it has to be applied.'
        distinguishing_features:
        - AGel presents with the corneal lattice dystrophy / facial palsy / cutis laxa triad; ATTRv does
          not
        - ATTRv commonly involves the heart; cardiac involvement is not a cardinal AGel feature
        - In ATTRv the stabilisation target and the depositing species are the same protein; in AGel they
          are not, so a stabiliser must act on the uncleaved precursor upstream of furin rather than on
          the fragment that deposits
      selected_evidence:
        snippet: The resulting C-terminal 68 kDa fragment (C68) is susceptible to extracellular endoproteolytic
          events, possibly mediated by a matrix metalloprotease, affording 8 and 5 kDa amyloidogenic fragments
          of gelsolin.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
