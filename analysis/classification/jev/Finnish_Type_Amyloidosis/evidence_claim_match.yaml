  20cfc92dd857866bcb308208ee789b526c709d71550d60a39093a168d4254b80:
    claim:
      about:
        disease:
          name: Finnish Type Amyloidosis
          disease_term:
            preferred_term: Finnish type amyloidosis
            term:
              id: MONDO:0007097
              label: Finnish type amyloidosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Two-Step Proteolysis Releasing 8 and 5 kDa Amyloidogenic Fragments
        biological_scale: MOLECULAR
        description: The furin cut yields a C-terminal 68 kDa fragment (C68), which is then cut again
          outside the cell - probably by a matrix metalloprotease - to give the 8 and 5 kDa fragments
          that are the actual amyloid precursor. Two proteases, two compartments, and only the final products
          are amyloidogenic. This node is what the entry substitutes for the amyloidogenesis module's
          generic precursor node.
        conforms_to: amyloidogenesis#Amyloidogenic Precursor Protein
        biological_processes:
        - preferred_term: proteolysis
          term:
            id: GO:0006508
            label: proteolysis
          modifier: INCREASED
      selected_evidence:
        snippet: The resulting C-terminal 68 kDa fragment (C68) is susceptible to extracellular endoproteolytic
          events, possibly mediated by a matrix metalloprotease, affording 8 and 5 kDa amyloidogenic fragments
          of gelsolin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22360545
      reference_title: 'Gelsolin amyloidosis: genetics, biochemistry, pathology and possible strategies
        for therapeutic intervention.'
      evidence_source: IN_VITRO
      explanation: Establishes the second, extracellular cleavage and identifies the fragments that form
        the amyloid. Note the authors hedge the responsible protease ("possibly"), which is preserved
        in the description.
