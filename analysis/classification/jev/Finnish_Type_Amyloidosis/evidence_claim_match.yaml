      assertion_type: Pathophysiology
      assertion:
        name: GSN Domain 2 Calcium-Binding Variant
        biological_scale: MOLECULAR
        description: The initiating lesion. D187N or D187Y substitutions compromise calcium binding in
          gelsolin domain 2. The variant does not directly destabilise the whole protein into an aggregation-prone
          state; it removes the calcium coordination that holds domain 2 folded, so the domain begins
          to sample unfolded conformations.
        molecular_functions:
        - preferred_term: actin filament severing activity
          term:
            id: GO:0003789
            label: actin filament severing activity
      selected_evidence:
        snippet: It is the first and so-far only known disorder caused by a gelsolin gene defect, namely
          a G654A or G654T mutation.
        supports: SUPPORT
