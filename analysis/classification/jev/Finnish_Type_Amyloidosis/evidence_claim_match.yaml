  046e51cd3c8087adb50132567dd8e890a7a42915c23dc46722f7e0e1ef4866fa:
    claim:
      about:
        disease:
          name: Finnish Type Amyloidosis
          disease_term:
            preferred_term: Finnish type amyloidosis
            term:
              id: MONDO:0007097
              label: Finnish type amyloidosis
        context: []
      assertion_type: Genetic
      assertion:
        name: GSN
        gene_term:
          preferred_term: GSN
          term:
            id: hgnc:4620
            label: GSN
        relationship_type: CAUSATIVE
        association: 'A single copy of the mutant allele is reported to give complete penetrance. Heterozygous
          GSN variants at codon 187 - G654A giving D187N, and G654T giving D187Y - cause hereditary gelsolin
          amyloidosis. Gelsolin is a principal actin-modulating protein with roles in axonal transport,
          myelination, neurite outgrowth and neuroprotection, which raises the question of how much of
          the phenotype is amyloid deposition and how much is loss of normal gelsolin function. Three
          independent lines of evidence answer it in favour of gain of toxic function, and the entry curates
          the deposition mechanism accordingly rather than leaving the question open. Gelsolin knockout
          mice develop and live normally, with only a mild bleeding-time and cell-motility phenotype attributed
          to functional redundancy. Human D187N homozygotes have earlier and more severe disease - a dose
          effect on the toxic species, and a qualitative one in the kidney, where they develop severe
          nephrotic syndrome and end-stage renal failure - but no symptoms attributable to loss of function.
          And there is no reported sporadic or wild-type gelsolin amyloidosis, so the mutation, not the
          shortfall of normal protein, is what is required. The residual uncertainty is narrower than
          "which mechanism": it is whether local gelsolin dysfunction modulates severity in the affected
          tissues, not whether it causes the disease.'
      selected_evidence:
        snippet: FAF appears to be caused by a gain-of-toxic function associated with gelsolin fragment
          amyloidogenesis
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
