  8370571e85114ef9d1a33a015e1af586e5fe10fdaeb65e4acb1e6d5cb566d26b:
    claim:
      about:
        disease:
          name: Finnish Type Amyloidosis
          disease_term:
            preferred_term: Finnish type amyloidosis
            term:
              id: MONDO:0007097
              label: Finnish type amyloidosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_agel_tissue_tropism
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Systemic AGel Amyloid Deposition
        prompt: Why does AGel amyloid deposit preferentially in cornea, cranial nerves and skin, when
          the amyloidogenic fragments are generated from a plasma protein and released into the circulation?
        rationale: 'The disease is defined by a cornea-nerve-skin triad, while the heart, the dominant
          target in both ATTR and AL, is not a cardinal feature - and the precursor is a plasma protein
          whose fragments enter the circulation, so systemic availability alone predicts the wrong distribution.
          There is one leading hypothesis rather than a blank: the D187N transgenic mouse deposits amyloid
          only in tissues that themselves synthesise the mutant gelsolin, despite circulating C68 being
          present throughout, which argues that local synthesis rather than circulating precursor governs
          where deposition happens. What is open is whether that generalises to human tissue distribution,
          since muscle is the major source of plasma gelsolin while cornea and cranial nerve are not obviously
          so. Competing explanations remain live: local availability of the second, extracellular protease
          (MT1-MMP and possibly others), tissue-specific extracellular matrix components that nucleate
          these particular fragments, or slow clearance in poorly vascularised tissue such as cornea.
          Which is right matters therapeutically, because a treatment aimed at the circulating fragment
          and one aimed at local synthesis or deposition are different drugs.'
        proposed_experiments:
        - experiment_id: exp_agel_protease_tissue_survey
          name: Map local gelsolin synthesis and second-step protease activity against the disease distribution
          description: Two things need separating. First, quantify local GSN synthesis in cornea, peripheral
            nerve, skin and myocardium in human tissue, to test whether the mouse local-synthesis finding
            accounts for the human triad - the mouse used a muscle-specific promoter, so its tissue distribution
            was imposed by the construct rather than discovered. Second, map MT1-MMP activity, and that
            of other C68-cleaving proteases, across the same tissues. The review names MT1-MMP as the
            second-step protease at least in HT1080 cells while noting other extracellular proteases may
            contribute, so a survey has to be broader than MT1-MMP alone. If either measure tracks the
            disease distribution and the other does not, tropism is localised to that step.
      selected_evidence:
        snippet: amyloidogenesis is observed only in tissues synthesizing human D187N gelsolin, despite
          the presence of the 68 kDa cleavage product circulating in the blood, suggesting that local
          synthesis is required for amyloid fragment formation and/or deposition
        supports: SUPPORT
