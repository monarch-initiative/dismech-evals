              id: MONDO:0007097
              label: Finnish type amyloidosis
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neurological
        name: Multiple Cranial Neuropathy
        description: 'Cranial nerve involvement extends well beyond the facial nerve. In a series of 29
          patients, all had dysfunction of both the facial (VII) and trigeminal (V) nerves, two-thirds
          had oculomotor (III) and hypoglossal (XII) involvement, and half had vestibulocochlear (VIII)
          involvement - a distribution the authors describe as more widespread than previously recognised,
          correlating with age and with severity of facial paralysis.

          No frequency band is assigned despite those proportions being quoted, because that cohort was
          assembled from patients undergoing facial corrective surgery: it is selected for severe facial
          involvement, so its cranial-nerve proportions cannot be read as disease-wide frequencies.'
        phenotype_term:
          preferred_term: Abnormal cranial nerve physiology
          term:
            id: HP:0031910
            label: Abnormal cranial nerve physiology
          clinical_course: PROGRESSIVE
      selected_evidence:
        snippet: All showed dysfunction of facial (VII) and trigeminal (V) nerves, two-thirds of oculomotor
          (III) and hypoglossal (XII) nerves, and half of vestibulocochlear (acoustic) (VIII) nerve.
        supports: SUPPORT
