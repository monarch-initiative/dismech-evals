      assertion_type: Pathophysiology
      assertion:
        name: Domain 2 Unfolding and Exposure of a Cryptic Furin Site
        biological_scale: MOLECULAR
        description: 'An unfolded domain 2 exposes a site that furin cleaves while the protein is passing
          through the Golgi on its way to secretion. This is the step that converts a folding defect into
          a proteolysis problem, and it is compartment-specific: the wild-type protein traverses the same
          pathway untouched.'
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: When domain 2 is unfolded, gelsolin is subject to aberrant furin endoproteolysis as it
          passes through the Golgi on its way to the extracellular space.
        supports: SUPPORT
