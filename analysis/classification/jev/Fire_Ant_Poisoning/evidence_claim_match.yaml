      assertion:
        name: IgE-mediated mast cell activation on re-exposure
        description: On a later sting, venom antigen cross-links IgE on armed mast cells and basophils,
          releasing mediators that produce acute vascular permeability, generalized urticaria and, when
          the reaction is systemic, airway obstruction or circulatory collapse. Eosinophil recruitment
          driven by eotaxin follows at the sting site.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: mast cell
          term:
            id: CL:0000097
            label: mast cell
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        biological_processes:
        - preferred_term: mast cell activation
          modifier: INCREASED
          term:
            id: GO:0045576
            label: mast cell activation
        - preferred_term: eosinophil chemotaxis
          modifier: INCREASED
          term:
            id: GO:0048245
            label: eosinophil chemotaxis
        notes: The mediator-release step itself was explicitly not measured in the mouse study, whose
          authors mark it as part of their hypothesized scheme. The human evidence for this node is the
          observed clinical syndrome and its response to epinephrine and to venom immunotherapy, not a
          direct measurement of mast cell degranulation after a fire ant sting.
      selected_evidence:
        snippet: venom proteins per se can actively promote sensitization-dependent eosinophil recruitment
          to the peritoneal cavity after a second exposure through the production of eosinophilotactic
          signals such as eotaxin
        supports: SUPPORT
