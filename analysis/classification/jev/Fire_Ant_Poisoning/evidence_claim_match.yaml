          allergens, re-exposure triggers IgE-dependent mast cell activation, producing generalized urticaria,
          angioedema, airway compromise, or circulatory collapse. Systemic mastocytosis is a major risk
          factor, and in that group the reaction is frequently misdiagnosed and undertreated.
      selected_evidence:
        snippet: Fire ant and flying Hymenoptera-venom anaphylaxis prevalence in the general population
          was 0.048% and 0.083%, respectively.
        supports: SUPPORT
