        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Venom-specific IgE class switching
        description: Activated B cells undergo clonal expansion and mature into IgE-secreting plasma cells
          producing antibody specific for the venom allergens. The sensitization rate to fire ant venom
          exceeds 90% in colonized regions, far above sensitization to other stinging Hymenoptera, so
          this state is common while anaphylaxis remains uncommon.
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: immunoglobulin production
          modifier: INCREASED
          term:
            id: GO:0002377
            label: immunoglobulin production
        notes: 'Sensitization and disease are not the same thing here, and the gap is large: over 90%
          sensitization in colonized regions against a measured anaphylaxis prevalence of 0.085% in those
          states. A positive venom IgE test therefore does not identify who will react.'
      selected_evidence:
        snippet: the sensitization rate to FA venom can be >90% in colonized regions and is higher than
          sensitization to other stinging Hymenoptera
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40230786
      reference_title: Fire ant-venom anaphylaxis prevalence in the general population and patients with
        systemic mastocytosis.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports that venom sensitization is near-universal in colonized regions, which is
        what makes the gap between sensitization and clinical anaphylaxis important.
