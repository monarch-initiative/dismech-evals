      assertion_type: Definition
      assertion:
        name: Clinical case definition for fire ant poisoning
        definition_type: CASE_DEFINITION
        description: Fire ant poisoning is an acute, exposure-dependent sting injury in which Solenopsis
          venom is injected into skin, producing immediate local alkaloid toxicity and, in a sensitized
          minority, an IgE-mediated systemic allergic reaction. It is not an inherited disorder and requires
          no host genotype.
        scope: Disease-level framing covering both the direct-toxicity and allergic routes
      selected_evidence:
        snippet: Immediate effects of the stings are mainly caused by a major (>95%) fraction of toxic
          alkaloids, but the later allergic responses
        supports: SUPPORT
    origin:
