      assertion_type: Subtype
      assertion:
        name: Local Sting Reaction
        display_name: Local sting reaction (direct alkaloid toxicity)
        description: The near-universal form. Piperidine alkaloids injected into skin are directly cytotoxic,
          producing immediate burning pain and itching, a wheal, and a characteristic sterile pustule
          over roughly 24 hours. No prior sensitization is required, and large local reactions can persist
          up to 72 hours.
      selected_evidence:
        snippet: The typical local reactions following RIFA stings are itching and burning pain, accompanied
          by redness and the development of raised wheals and white pustules at the sting site, followed
          by IgE-mediated urticarial and erythematous reactions
        supports: SUPPORT
