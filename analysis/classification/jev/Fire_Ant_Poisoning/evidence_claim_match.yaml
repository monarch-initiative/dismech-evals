        name: Piperidine alkaloid cytotoxic injury to skin
        description: The piperidine alkaloids, named solenopsins, make up over 95% of the venom and are
          directly cytotoxic. In vitro they killed dendritic cells at 10 micrograms per millilitre, which
          is why the authors concluded the alkaloids are not the immunogenic component. This cytotoxicity
          is the basis of the immediate burning pain and local injury, and it requires no immune memory.
        biological_scale: CELLULAR
        locations:
        - preferred_term: skin epidermis
          term:
            id: UBERON:0001003
            label: skin epidermis
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        chemical_entities:
        - preferred_term: solenopsin A
          term:
            id: CHEBI:80722
            label: (-)-Solenopsin A
        biological_processes:
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        notes: 'The cytotoxicity figure is from cultured murine bone-marrow-derived dendritic cells, not
          from human skin. The precise molecular target in human sting lesions is not established, and
          no Wnt, MAPK or mTOR signalling lesion is asserted: isolated-solenopsin data from cancer-cell
          models do not transfer to clinical envenomation.'
      selected_evidence:
        snippet: The venom alkaloids proved extremely cytotoxic even at 10
        supports: SUPPORT
