      assertion_type: DifferentialDiagnosis
      assertion:
        name: Flying Hymenoptera venom anaphylaxis
        distinguishing_features:
        - Both produce IgE-mediated venom anaphylaxis, so the systemic presentations overlap closely
        - The fire ant sting leaves a characteristic sterile pustule that flying Hymenoptera stings do
          not
        - Fire ants deliver far less venom protein per sting, 10 to 100 ng against 2 to 20 micrograms
          for vespids
        - 'Immunotherapy differs by preparation: fire ant allergy is treated with whole-body extract,
          flying Hymenoptera with venom extract'
      selected_evidence:
        snippet: The amount of venom protein delivered in a single sting is highest in honey bee (25-150
          mcg) and vespids (2-20 mcg) and lowest in FAs (10-100 ng)
        supports: SUPPORT
