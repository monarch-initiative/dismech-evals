        description: R. felis, like other bacteria, depends on 70S-ribosome translation of its mRNA. Doxycycline
          targets this conserved bacterial translation machinery, explaining why a tetracycline is the
          preferred treatment for flea-borne rickettsioses.
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        biological_processes:
