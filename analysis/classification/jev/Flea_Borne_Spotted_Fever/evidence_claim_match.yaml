          modifier: INCREASED
          term:
            id: GO:0043117
            label: positive regulation of vascular permeability
      selected_evidence:
        snippet: The rickettsiae escape hematogenously and infect endothelial cells. Systemic endothelial
          infection and resultant inflammatory damage lead to increased vascular permeability.
        supports: SUPPORT
