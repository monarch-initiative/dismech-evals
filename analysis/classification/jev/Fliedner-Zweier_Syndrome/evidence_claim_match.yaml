      assertion_type: Pathophysiology
      assertion:
        name: SCAF4 Haploinsufficiency
        description: Heterozygous truncating and splice-site variants spread across SCAF4 are predicted,
          and for some alleles shown in patient blood RNA, to undergo nonsense-mediated decay or yield
          severely truncated protein, reducing the dose of SCAF4. SCAF4 binds the RNA polymerase II C-terminal
          domain phosphorylated on Ser2 and Ser5 through its N-terminal CTD-interacting domain (CID);
          the few missense variants reported cluster in the CID and are predicted to destabilise it, compatible
          with the same loss of function.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SCAF4
          term:
            id: hgnc:19304
            label: SCAF4
        molecular_functions:
        - preferred_term: RNA polymerase II CTD phosphoserine binding
          modifier: DECREASED
          term:
            id: GO:1990269
            label: RNA polymerase II C-terminal domain phosphoserine binding
      selected_evidence:
        snippet: For all truncating variants in the N-terminal part of SCAF4, a general loss-of-function
          mechanism or haploinsufficiency is therefore likely.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
