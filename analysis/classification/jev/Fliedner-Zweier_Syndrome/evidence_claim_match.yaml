      assertion_type: Diagnosis
      assertion:
        name: Exome sequencing
        description: Diagnosis rests on identifying a heterozygous SCAF4 loss-of-function variant by exome
          (often trio) sequencing in a child with developmental delay, speech delay, seizures or behavioural
          problems; the phenotype is non-specific, so the disorder is not recognisable clinically. Because
          variants are frequently inherited from mildly affected parents, inherited variants should not
          be filtered out in trio analysis.
        diagnosis_term:
          preferred_term: exome sequencing
