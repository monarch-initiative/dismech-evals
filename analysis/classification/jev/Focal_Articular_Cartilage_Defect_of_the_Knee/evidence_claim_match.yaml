        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progression to Secondary Osteoarthritis
        conforms_to: osteoarthritis_cartilage_degradation#Mechanical Overload and Chondrocyte Stress
        description: 'An untreated or inadequately repaired focal chondral defect concentrates mechanical
          stress on adjacent cartilage and subchondral bone, promoting progressive cartilage loss that
          converges on the degenerative phenotype of secondary osteoarthritis and may ultimately require
          joint replacement. This is post-traumatic osteoarthritis: the focal lesion is the discrete injury
          that imposes the abnormal mechanical loading and chondrocyte stress program captured by the
          conserved osteoarthritis degradation module, motivating early restoration of the articular surface.'
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: response to mechanical stimulus
          term:
            id: GO:0009612
            label: response to mechanical stimulus
          modifier: INCREASED
        - preferred_term: cellular response to stress
          term:
            id: GO:0033554
            label: cellular response to stress
          modifier: INCREASED
        locations:
        - preferred_term: articular cartilage
          term:
            id: UBERON:0010996
            label: articular cartilage of joint
      selected_evidence:
        snippet: Untreated lesions can lead to early development of arthritis and the need for joint replacement
        supports: SUPPORT
