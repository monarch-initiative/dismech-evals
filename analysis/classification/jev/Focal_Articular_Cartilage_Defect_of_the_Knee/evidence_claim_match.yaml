              that converges on the degenerative phenotype of secondary osteoarthritis and may ultimately
              require joint replacement. This is post-traumatic osteoarthritis: the focal lesion is the
              discrete injury that imposes the abnormal mechanical loading and chondrocyte stress program
              captured by the conserved osteoarthritis degradation module, motivating early restoration
              of the articular surface.'
