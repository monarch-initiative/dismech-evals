  35405cb2e446a64a578f4d61920124766a19cfaa02a9507fdb69254ff755e876:
    claim:
      about:
        disease:
          name: Focal Articular Cartilage Defect of the Knee
          disease_term:
            term:
              id: MONDO:0003816
              label: articular cartilage disorder
            preferred_term: Focal articular cartilage defect of the knee
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Intrinsic Cartilage Repair
        description: Mature hyaline articular cartilage is avascular, alymphatic, and aneural, and its
          resident chondrocytes are entrapped in a dense matrix with little capacity to proliferate or
          migrate into a defect. Consequently a full-thickness chondral lesion has minimal intrinsic self-repair
          and the damage is frequently permanent.
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        locations:
        - preferred_term: articular cartilage
          term:
            id: UBERON:0010996
            label: articular cartilage of joint
        biological_processes:
        - preferred_term: cartilage development
          term:
            id: GO:0051216
            label: cartilage development
          modifier: DECREASED
        - preferred_term: wound healing
          term:
            id: GO:0042060
            label: wound healing
          modifier: DECREASED
      selected_evidence:
        snippet: Articular cartilage has very little capacity for self-repair, so damage may be permanent
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28244303
      reference_title: 'Autologous chondrocyte implantation in the knee: systematic review and economic
        evaluation.'
      evidence_source: HUMAN_CLINICAL
      explanation: Directly supports the core mechanism that a focal full-thickness defect does not heal
        because of the limited intrinsic repair capacity of hyaline cartilage.
