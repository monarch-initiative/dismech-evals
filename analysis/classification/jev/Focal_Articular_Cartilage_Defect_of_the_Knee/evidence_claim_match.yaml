        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Intrinsic Cartilage Repair
        description: Mature hyaline articular cartilage is avascular, alymphatic, and aneural, and its
          resident chondrocytes are entrapped in a dense matrix with little capacity to proliferate or
          migrate into a defect. Consequently a full-thickness chondral lesion has minimal intrinsic self-repair
          and the damage is frequently permanent.
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        locations:
        - preferred_term: articular cartilage
          term:
            id: UBERON:0010996
            label: articular cartilage of joint
        biological_processes:
        - preferred_term: cartilage development
          term:
            id: GO:0051216
            label: cartilage development
          modifier: DECREASED
        - preferred_term: wound healing
          term:
            id: GO:0042060
            label: wound healing
          modifier: DECREASED
      selected_evidence:
        snippet: Articular cartilage has very little capacity for self-repair, so damage may be permanent
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
