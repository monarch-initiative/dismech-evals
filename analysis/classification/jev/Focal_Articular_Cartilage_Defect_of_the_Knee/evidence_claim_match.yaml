      assertion_type: Pathophysiology
      assertion:
        name: Fibrocartilaginous Repair Tissue Formation
        description: When repair does occur — spontaneously or after marrow-stimulation procedures (microfracture,
          drilling, abrasion arthroplasty) — bone-marrow mesenchymal stromal cells populate the defect
          and produce type I collagen-rich fibrocartilage rather than type II collagen hyaline cartilage.
          This fibrocartilage is biomechanically inferior and degrades over time, so it does not durably
          restore the articular surface.
        cell_types:
        - preferred_term: Marrow-derived mesenchymal stromal cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        cellular_components:
        - preferred_term: extracellular matrix
          term:
            id: GO:0031012
            label: extracellular matrix
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: INCREASED
      selected_evidence:
        snippet: produce only fibrocartilage and therefore do not offer a long-term cure
        supports: SUPPORT
