            preferred_term: Focal articular cartilage defect of the knee
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Full-Thickness Chondral Injury
        description: An acute traumatic shear/impact load, osteochondritis dissecans, or repetitive microtrauma
          produces a discrete full-thickness defect of the hyaline articular cartilage, disrupting the
          smooth load-bearing joint surface while leaving the surrounding cartilage relatively intact.
          The lesion may be purely chondral or osteochondral when it extends into the subchondral bone;
          because the cartilage and its supporting subchondral plate function together as an osteochondral
          unit, the extent of subchondral disease shapes both the mechanical consequences and the choice
          of restoration procedure.
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        locations:
        - preferred_term: articular cartilage
          term:
            id: UBERON:0010996
            label: articular cartilage of joint
        - preferred_term: knee joint
          term:
            id: UBERON:0001465
            label: knee
        cellular_components:
        - preferred_term: extracellular matrix
          term:
            id: GO:0031012
            label: extracellular matrix
      selected_evidence:
        snippet: The management of OCL is predicated on certain injury characteristics, including lesion
          location and the extent of subchondral disease
        supports: SUPPORT
