        context: []
      assertion_type: Treatment
      assertion:
        name: Matrix-Applied Autologous Chondrocyte Implantation (MACI)
        description: Two-stage autologous cell therapy for symptomatic full-thickness cartilage defects
          of the knee. Chondrocytes are arthroscopically harvested, expanded in culture, and seeded onto
          a porcine type I/III collagen membrane that is implanted into the debrided defect to regenerate
          hyaline-like cartilage. In the randomized SUMMIT trial, MACI was clinically and statistically
          superior to microfracture for symptomatic defects of the knee. MACI is indicated for focal cartilage
          defects, not for generalized osteoarthritis.
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: cellular therapy
          term:
            id: NCIT:C70601
            label: Cellular Therapy
          therapeutic_agent:
          - preferred_term: autologous cultured chondrocytes
            term:
              id: NCIT:C87436
              label: Autologous Cultured Chondrocytes
      selected_evidence:
        snippet: MACI offers a more efficacious alternative than MFX with a similar safety profile for
          the treatment of symptomatic articular cartilage defects of the knee
        supports: SUPPORT
