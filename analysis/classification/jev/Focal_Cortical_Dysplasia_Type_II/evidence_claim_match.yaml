        name: DEPDC5
        gene_term:
          preferred_term: DEPDC5
          term:
            id: hgnc:18423
            label: DEPDC5
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE_AND_SOMATIC
        notes: DEPDC5 is part of the GATOR1 complex, which restrains mTORC1. Loss of function therefore
          de-represses the pathway. In FCD type II the typical architecture is a germline first hit inherited
          or de novo, plus a somatic second hit confined to the lesion, which explains why carriers can
          be unaffected and why the malformation is focal rather than diffuse. dismech also carries a
          separate DEPDC5-Related_Epilepsy entry covering the broader GATOR1 phenotypic spectrum.
      selected_evidence:
        snippet: germline, somatic and two-hit loss-of-function variants in its repressors (DEPDC5, TSC1,
          TSC2) were found exclusively in FCD2/HME cases
        supports: SUPPORT
