        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysmorphic Neuron and Balloon Cell Formation
        biological_scale: CELLULAR
        description: mTORC1 drives cell growth, so mutant cells become cytomegalic. Dysmorphic neurons
          are enlarged, abnormally oriented neurons with aberrant neurofilament accumulation. Balloon
          cells, which define subtype IIb, are large cells with opalescent cytoplasm that can co-express
          neuronal and glial progenitor markers. Both cell populations carry the pathogenic variant. Whether
          balloon cells actually generate seizures is contested and is recorded as a discussion.
        cell_types:
        - preferred_term: dysmorphic neuron
          term:
            id: CL:0000540
            label: neuron
          modifier: ABNORMAL
      selected_evidence:
        snippet: These abnormal cells emerge during early brain development as a result of a hyperactive
          mTOR pathway and may express both neuronal and glial markers.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
