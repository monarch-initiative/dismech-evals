  db31a2acad2db70d6ffad85bfcefc4050ddf16cb3e5b4b3c268c80469fd25832:
    claim:
      about:
        disease:
          name: Focal Cortical Dysplasia Type II
          disease_term:
            preferred_term: isolated focal cortical dysplasia type II
            term:
              id: MONDO:0011818
              label: isolated focal cortical dysplasia type II
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fcd2_mtor_inhibition_negative_trial
        kind: CONTROVERSY
        status: OPEN
        prompt: The everolimus trial in FCD type 2 missed its primary endpoint. Does that refute mTOR
          inhibition as a therapeutic strategy for this disorder, or does it refute the trial design,
          given that the responders were concentrated in one genotype stratum?
        attaches_to:
        - pathophysiology#Constitutive mTORC1 Signalling in a Clonal Cortical Patch
        rationale: 'The mechanistic case for mTOR inhibition in FCD type II is about as clean as targeted
          therapy rationales get: the disease is defined by constitutive mTORC1 activity, and everolimus
          inhibits mTORC1. Yet the randomized crossover trial found no significant difference from placebo
          on the primary endpoint, with adverse events substantially more common on drug. Three readings
          are live. The first is that the trial is right and the strategy fails, plausibly because a systemically
          administered drug cannot reach a small deep clone at sufficient concentration, or because the
          dysplastic cortex is a fixed developmental structure whose epileptogenicity no longer depends
          on ongoing mTORC1 signalling. The second is that the trial was underpowered and unstratified:
          the patients who did become seizure-free carried MTOR variants or had no identified variant,
          and none of those with variants in other genes responded, which is what one expects if the effective
          population is a genotype subset. The third is that twelve weeks is too short. The practical
          stake is whether a patient who is not a surgical candidate should be offered a drug with real
          mucocutaneous toxicity. This entry records everolimus with REFUTE evidence for the primary endpoint
          and PARTIAL evidence for the genotype-restricted signal rather than presenting it as established
          therapy.'
        proposed_experiments:
        - experiment_id: exp_fcd2_genotype_stratified_mtor_trial
          name: Genotype-stratified mTOR inhibitor trial in FCD type II
          description: A trial of mTOR inhibition prospectively stratified by lesional genotype, powered
            within the activator-variant stratum, with a treatment period long enough to detect a delayed
            effect and with lesional drug exposure measured where tissue becomes available at subsequent
            surgery.
          decision_criterion: A significant effect confined to the activator-variant stratum would establish
            the negative overall trial as a stratification failure rather than a mechanism failure.
        - experiment_id: exp_fcd2_lesional_drug_exposure
          name: Lesional drug exposure and target engagement measurement
          description: Measure everolimus concentration and phospho-S6 suppression directly in resected
            dysplastic tissue from patients treated before surgery, to test whether the drug reaches and
            engages its target in the lesion.
          decision_criterion: Absent target engagement in lesional tissue would attribute the negative
            trial to pharmacokinetics rather than to the mechanistic hypothesis, and would redirect effort
            toward delivery rather than abandoning the target.
      selected_evidence:
        snippet: it showed promise, mostly in patients with a pathogenic variant in the MTOR gene, highlighting
          the need for further research into patient-specific factors influencing treatment response
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39607729
      reference_title: Efficacy and safety of everolimus for patients with focal cortical dysplasia type
        2.
      evidence_source: HUMAN_CLINICAL
      explanation: The trial authors' own reading, that the signal is genotype-dependent, which is the
        stratification-failure position in this controversy.
