      assertion_type: Inheritance
      assertion:
        name: Somatic mosaicism
        description: The activator arm of FCD type II is not inherited at all. A post-zygotic variant
          arises in a single cortical progenitor during corticogenesis and is confined to that clone,
          so it is absent from blood and from the germline. Recurrence risk for siblings and for the patient's
          own children is therefore not increased, which is a materially different counselling message
          from the repressor arm below.
        inheritance_term:
