        name: Intrinsically Epileptogenic Dysplastic Cortex
        conforms_to: pi3k_akt_mtor_cortical_overgrowth#Epileptogenic Cortical Dysplasia and Seizures
        biological_scale: TISSUE
        description: 'The dysplastic patch generates epileptiform activity intrinsically rather than merely
          irritating adjacent normal cortex. Mouse work titrating the mosaic burden shows a remarkably
          low threshold: a few thousand mutation-bearing neurons, well under a tenth of a percent of cells,
          suffice to produce spontaneous seizures, and the burden scales with seizure frequency and onset.'
      selected_evidence:
        snippet: approximately 8000-9000 neurons expressing the MTOR mutant, extrapolated to constitute
          0.08%-0.09% of total cells or roughly 0.04% of variant allele frequency in the mouse hemicortex,
          were sufficient to trigger epileptic seizures
        supports: SUPPORT
