            label: NPRL3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE_AND_SOMATIC
        notes: NPRL3 is a component of the GATOR1 complex alongside DEPDC5 and NPRL2. The reported NPRL3
          lesions are germline structural variants found in cases that coding-focused panels had called
          negative, which is exactly the detection blind spot this entry's mutation-negative discussion
          is about. NPRL2 is the third GATOR1 component and is mechanistically expected to behave the
          same way, but it is deliberately not given its own entry because no cited source reports a causal
          NPRL2 variant in FCD type II; it appears only inside sequencing-panel gene lists. Loss of function
          releases mTORC1 from amino-acid-dependent restraint and follows the germline-plus-somatic two-hit
          pattern.
