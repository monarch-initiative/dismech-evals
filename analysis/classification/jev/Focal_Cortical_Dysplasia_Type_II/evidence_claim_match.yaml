        biological_scale: TISSUE
        description: The mTOR pathway governs neuronal growth and migration, so the mutant clone fails
          to laminate normally. The result is loss of the normal six-layer cortical architecture with
          abnormal cellular polarity, the histological substrate of the radiological blurring of the grey-white
          junction.
        biological_processes:
        - preferred_term: neuron migration
          term:
            id: GO:0001764
            label: neuron migration
          modifier: ABNORMAL
      selected_evidence:
        snippet: FCDs are characterized by abnormal cortical lamination, cell morphology (e.g., cytomegaly),
          and cellular polarity.
        supports: SUPPORT
