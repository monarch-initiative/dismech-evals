      assertion:
        name: Global Developmental Delay
        category: Neurologic
        description: 'Moderate to severe developmental delay is present in roughly half of young children
          with FCD type II before surgery, and is associated with earlier seizure onset and a history
          of epileptic encephalopathy. Notably it does not reliably reverse: in the same cohort, developmental
          quotient improved at six months post-surgery in only four of 48 children who had preoperative
          moderate or severe delay, even though seizure outcome was excellent. That dissociation argues
          the delay is not purely a consequence of ongoing seizures.'
        phenotype_term:
          preferred_term: Global developmental delay
          term:
            id: HP:0001263
            label: Global developmental delay
        frequency: FREQUENT
      selected_evidence:
        snippet: For 48 children with preoperatively moderate/severe developmental delay, DQ rank at 6
          months postsurgery was improved in only four cases.
        supports: SUPPORT
