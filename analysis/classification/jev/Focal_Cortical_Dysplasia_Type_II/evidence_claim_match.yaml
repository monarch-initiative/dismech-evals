      - /disease_term
    evidence_metadata:
      reference: PMID:31444548
      reference_title: 'Dissecting the genetic basis of focal cortical dysplasia: a large cohort study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes mTORC1 activation as the convergent node, present even when sequencing
        fails to identify the causative variant, which is exactly the claim this node makes.
