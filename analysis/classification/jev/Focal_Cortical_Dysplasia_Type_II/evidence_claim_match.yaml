      assertion_type: Diagnosis
      assertion:
        name: Deep sequencing of resected brain tissue
        description: Genetic diagnosis requires the lesion, not the blood. Because variant allele fractions
          in resected tissue are frequently only a few percent, targeted sequencing at read depths of
          at least 2000-fold on matched blood-brain samples is the substrate that works; a blood-only
          test is uninformative by design for the mosaic arm. Yield is roughly two thirds in FCD type
          II, and a negative result does not exclude an mTORopathy.
        diagnosis_term:
          preferred_term: deep targeted sequencing of matched blood and brain samples
          term:
            id: NCIT:C19770
            label: Molecular Analysis
        results: A somatic activator variant or a germline-plus-somatic repressor variant is identified
          in roughly 63 percent of FCD type II cases.
      selected_evidence:
        snippet: We performed targeted gene sequencing ( ≥ 2000X read depth) on matched blood-brain samples
          to search for low-allele frequency variants in mTOR pathway and FCD genes.
        supports: SUPPORT
