  f7dfc5cdea81361127688c109b3c04e37933e1bf7be31b604ef3a50f1703532a:
    claim:
      about:
        disease:
          name: Focal Cortical Dysplasia Type II
          disease_term:
            preferred_term: isolated focal cortical dysplasia type II
            term:
              id: MONDO:0011818
              label: isolated focal cortical dysplasia type II
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fcd2_mutation_negative_cases
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Roughly 40 percent of FCD type II cases have no identifiable causative variant despite
          deep sequencing. Is that a detection-sensitivity floor, a set of variant classes the assays
          do not look for, or genuinely different biology?
        attaches_to:
        - pathophysiology#Somatic mTOR Pathway Variant in a Cortical Progenitor
        - pathophysiology#Constitutive mTORC1 Signalling in a Clonal Cortical Patch
        rationale: 'This gap has direct consequences for how the entry should be read. All FCD type II
          lesions, including sequencing-negative ones, show strong phospho-S6 staining, so the mTORC1
          node is present even when the genetic node is not demonstrated. Three explanations compete.
          The first is sensitivity: mouse work shows that a variant allele fraction around 0.04 percent
          is enough to cause seizures, which is below what routine bulk deep sequencing of resected tissue
          can resolve, and enriching for phospho-S6-positive cells by fluorescence-activated sorting before
          sequencing recovers variants that bulk sequencing missed. The second is variant class: structural
          variants and non-coding regulatory changes are not well covered by targeted gene panels. The
          third, least likely given the uniform phospho-S6 signal, is a non-genetic route to mTORC1 activation.
          The distinction matters clinically because a negative panel currently cannot be interpreted
          as excluding an mTORopathy, and because genotype appears to predict response to mTOR inhibition.'
        proposed_experiments:
        - experiment_id: exp_fcd2_single_cell_wgs_mutation_negative
          experiment_design: DESCRIPTIVE_PROFILING
          name: Single-cell whole-genome sequencing of sequencing-negative FCD II
          description: Single-cell or phospho-S6-enriched whole-genome sequencing of lesional tissue from
            panel-negative FCD type II cases, with explicit calling of structural and non-coding variants
            rather than coding single-nucleotide variants alone.
          decision_criterion: Recovery of causative variants in most previously negative cases would establish
            the gap as a detection artefact; persistent negativity with preserved phospho-S6 staining
            would point to an unrecognized activation route.
        - experiment_id: exp_fcd2_genotype_stratified_pathway_readout
          name: Pathway-level readout as a genotype-independent classifier
          description: Test whether a quantitative mTORC1 activity readout from lesional tissue, such
            as phospho-S6 level or a downstream transcriptional signature, predicts clinical features
            and mTOR-inhibitor response as well as or better than genotype.
          decision_criterion: If a pathway readout performs as well as genotype, the mutation-negative
            gap ceases to be an obstacle to targeted treatment decisions even if it remains genetically
            unexplained.
      selected_evidence:
        snippet: Despite a greater ability to detect low-level somatic mutations in the brain by deep
          sequencing and analytics, about 40% of cases remain genetically unexplained.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36700525
      reference_title: Ultra-Low Level Somatic Mutations and Structural Variations in Focal Cortical Dysplasia
        Type II.
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the gap this discussion is about, and attributes it to detection limits
        rather than to absence of a genetic cause.
