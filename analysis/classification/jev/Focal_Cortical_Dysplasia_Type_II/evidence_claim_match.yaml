      assertion_type: Pathophysiology
      assertion:
        name: Constitutive mTORC1 Signalling in a Clonal Cortical Patch
        conforms_to: pi3k_akt_mtor_cortical_overgrowth#PI3K-AKT-mTOR Pathway Hyperactivation in Neural
          Progenitors
        biological_scale: CELLULAR
        description: Whichever gene is hit, the convergent consequence is unrestrained mTORC1 activity
          in the mutant clone, read out histologically as strong phospho-S6 ribosomal protein immunostaining.
          This convergence is why FCD type II behaves as one disease despite a heterogeneous gene list,
          and why cases in which no variant is found are still classified as mTORopathies.
        biological_processes:
        - preferred_term: TORC1 signaling
          term:
            id: GO:0038202
            label: TORC1 signaling
          modifier: INCREASED
      selected_evidence:
        snippet: We show that panel-negative FCD2 cases display strong pS6-immunostaining, stressing that
          all FCD2 are mTORopathies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
