            term:
              id: MONDO:0011818
              label: isolated focal cortical dysplasia type II
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic mTOR Pathway Variant in a Cortical Progenitor
        biological_scale: MOLECULAR
        description: A post-zygotic variant arises in a neural progenitor during corticogenesis, either
          a gain-of-function change in an mTORC1 activator (MTOR itself, or AKT3, PIK3CA, RHEB) or loss
          of function in an mTORC1 repressor (DEPDC5, NPRL3 and the other GATOR1 components, or TSC1/TSC2).
          Because the variant is confined to the descendants of that one progenitor, it is present only
          in the affected patch of brain and is typically undetectable in blood. Repressor cases frequently
          require a germline first hit plus a somatic second hit in the lesion.
        biological_processes:
        - preferred_term: positive regulation of TOR signaling
          term:
            id: GO:0032008
            label: positive regulation of TOR signaling
          modifier: INCREASED
      selected_evidence:
        snippet: Somatic gain-of-function variants in MTOR and its activators (AKT3, PIK3CA, RHEB), as
          well as germline, somatic and two-hit loss-of-function variants in its repressors (DEPDC5, TSC1,
          TSC2) were found exclusively in FCD2/HME cases.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31444548
      reference_title: 'Dissecting the genetic basis of focal cortical dysplasia: a large cohort study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Names both arms of the genetic mechanism, activator gain-of-function and repressor
        loss-of-function, and establishes that they are specific to FCD type II rather than shared with
        FCD type I.
