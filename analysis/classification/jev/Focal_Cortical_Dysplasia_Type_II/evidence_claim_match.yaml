  91b661686a9c65a70b0ff4932dd8514e66e35e2d4d377705e20a7a27b4fe11b3:
    claim:
      about:
        disease:
          name: Focal Cortical Dysplasia Type II
          disease_term:
            preferred_term: isolated focal cortical dysplasia type II
            term:
              id: MONDO:0011818
              label: isolated focal cortical dysplasia type II
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fcd2_balloon_cell_epileptogenicity
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: Are balloon cells the seizure generators in FCD type IIb, or are they electrically inert
          passengers whose presence merely marks the mutant clone, with the dysmorphic neurons doing the
          actual epileptogenic work?
        attaches_to:
        - pathophysiology#Dysmorphic Neuron and Balloon Cell Formation
        - pathophysiology#Intrinsically Epileptogenic Dysplastic Cortex
        rationale: 'Balloon cells are the histological signature of FCD IIb and were for decades assumed
          to be the culprits of epileptogenic activity, on the reasonable grounds that they are the most
          conspicuously abnormal thing in the specimen. Patch-clamp work overturned that: balloon and
          giant cells in pediatric FCD IIb and tuberous sclerosis are unable to generate action potentials
          and lack synaptic inputs. A cell that cannot fire and receives no synapses is a poor candidate
          for a seizure generator. Two facts make this more than a technicality. First, FCD IIa has no
          balloon cells at all yet is just as epileptogenic, which on its own argues the balloon cell
          is not necessary. Second, both dysmorphic neurons and balloon cells carry the pathogenic variant,
          so their presence is genuinely informative about where the mutant clone is even if they are
          not what discharges. The unresolved question is whether balloon cells contribute indirectly,
          for example by distorting the local extracellular or metabolic environment or by supporting
          a pro-inflammatory milieu, or whether they are epileptogenically inert. This entry therefore
          models the cell-formation node as upstream of epileptogenic cortex via an indirect edge with
          unknown intermediates rather than asserting that balloon cells generate seizures.'
        proposed_experiments:
        - experiment_id: exp_fcd2_iia_versus_iib_epileptogenicity_matched
          name: Matched comparison of intrinsic epileptogenicity in FCD IIa versus IIb
          description: Compare intracranial-EEG measures of intrinsic epileptogenicity, such as interictal
            spike rate and high-frequency oscillation density, between FCD IIa and FCD IIb lesions matched
            for lesion volume, location, and genotype.
          decision_criterion: Equivalent epileptogenicity in balloon-cell-free IIa lesions would establish
            that balloon cells are not necessary for seizure generation; consistently higher epileptogenicity
            in IIb would indicate they add something.
        - experiment_id: exp_balloon_cell_indirect_contribution
          experiment_design: DESCRIPTIVE_PROFILING
          name: Test for indirect balloon-cell contribution to network excitability
          description: Combined electrophysiology and spatial transcriptomic or metabolic profiling of
            human FCD IIb tissue, testing whether proximity to balloon cells alters the firing behaviour,
            extracellular potassium handling, or inflammatory signature of neighbouring neurons.
          decision_criterion: A measurable change in neighbouring neuronal excitability as a function
            of balloon-cell proximity would support an indirect contribution; absence of any local effect
            would support epileptogenic inertness.
      selected_evidence:
        snippet: Once believed to be the culprits of epileptogenic activity, the functional properties
          of balloon/giant cells (BC/GC), commonly found in some malformations of cortical development
          including focal cortical dysplasia type IIb (FCDIIb) and tuberous sclerosis complex (TSC), are
          beginning to be unraveled.
        supports: SUPPORT
