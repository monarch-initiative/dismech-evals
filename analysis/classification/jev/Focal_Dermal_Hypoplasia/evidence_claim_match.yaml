      assertion:
        name: X-Linked Dominant Inheritance with Male Lethality and Mosaicism
        description: 'FDH is inherited in an X-linked dominant manner. Most affected individuals are heterozygous
          females (~90%); non-mosaic hemizygous males are presumed non-viable, so most live-born affected
          males (~10%) are mosaic for a de novo PORCN variant. In affected females, random X-chromosome
          inactivation (lyonization) produces a functional mosaic of PORCN-expressing and PORCN-deficient
          cells, which underlies the patchy, segmental distribution of lesions along the lines of Blaschko.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Females (90% of affected individuals) are heterozygous or mosaic for a PORCN pathogenic
          variant; most live-born affected males (10% of affected individuals) are mosaic for a de novo
          PORCN pathogenic variant. It is presumed that most non-mosaic hemizygous males are not viable.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
