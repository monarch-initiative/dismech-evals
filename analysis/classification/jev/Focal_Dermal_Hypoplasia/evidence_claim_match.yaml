        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PORCN Loss Impairs WNT Palmitoleoylation and Secretion
        description: 'PORCN encodes a membrane-bound O-acyltransferase resident in the endoplasmic reticulum
          that attaches a monounsaturated fatty acid (palmitoleic acid) to a conserved serine residue
          of WNT ligands. This lipid modification is required for WNT engagement of the WLS/Wntless cargo
          receptor and for export of WNT from the ER to the cell surface. Loss-of-function PORCN variants
          abolish WNT acylation, trapping WNT in the ER and reducing extracellular WNT signaling. Because
          WNT signaling governs proliferation, patterning, and differentiation of ectodermal and mesodermal
          derivatives during embryogenesis, PORCN deficiency produces the multisystem mesoectodermal phenotype
          of FDH.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: protein palmitoleoylation
          term:
            id: GO:0018345
            label: protein palmitoylation
          modifier: DECREASED
        - preferred_term: WNT protein secretion
          term:
            id: GO:0061355
            label: Wnt protein secretion
          modifier: DECREASED
        - preferred_term: canonical Wnt signaling
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Wnt-3a defective in acylation at Ser209 is not secreted from cells in culture or in Xenopus
          embryos, but it is retained in the endoplasmic reticulum (ER). Furthermore, Porcupine, a protein
          with structural similarities to membrane-bound O-acyltransferases, is required for Ser209-dependent
          acylation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17141155
      reference_title: 'Monounsaturated fatty acid modification of Wnt protein: its role in Wnt secretion.'
      evidence_source: IN_VITRO
      explanation: 'Demonstrates the core molecular mechanism: Porcupine acylates Wnt at a conserved serine
        residue, and this acylation is required for Wnt secretion from the ER. Loss of PORCN function
        therefore blocks Wnt secretion.

        '
