      assertion_type: Pathophysiology
      assertion:
        name: Glomerular Filtration Barrier Dysfunction
        conforms_to: nephrotic_podocyte_injury#Glomerular Filtration Barrier Breakdown
        description: 'Loss of podocyte structural integrity, especially foot process effacement and slit
          diaphragm disruption, increases glomerular permeability to albumin and other plasma proteins.
          Slit diaphragm proteins such as nephrin and podocin are essential structural and signaling components
          of the filtration barrier, so disruption of this compartment is a common final pathway in proteinuric
          FSGS. CRB2 and CD2AP act in this compartment rather than on the podocyte actin cytoskeleton:
          CRB2 is required for slit diaphragm formation and nephrin trafficking, and CD2AP links nephrin
          and podocin at the slit diaphragm.

          '
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
        genes:
        - preferred_term: NPHS2
          term:
            id: hgnc:13394
            label: NPHS2
        - preferred_term: CRB2
          term:
            id: hgnc:18688
            label: CRB2
        - preferred_term: CD2AP
          term:
            id: hgnc:14258
            label: CD2AP
        biological_processes:
        - preferred_term: cell-cell junction assembly
          term:
            id: GO:0007043
            label: cell-cell junction assembly
          modifier: ABNORMAL
      selected_evidence:
        snippet: By characterization of a loss-of-function mutation in zebrafish crb2b, we now show that
          zebrafish crb2b is required for podocyte foot process arborization, slit diaphragm formation,
          and proper nephrin trafficking.
        supports: SUPPORT
