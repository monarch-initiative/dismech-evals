        notes: 'Two APOL1 renal-risk alleles raise FSGS risk substantially in people of recent African
          ancestry, but the genotype is common in that population and most carriers never develop kidney
          disease, so this is a susceptibility relationship rather than a Mendelian cause. MONDO models
          it the same way: "focal segmental glomerulosclerosis 4, susceptibility to" (MONDO:0012931) is
          a child of inherited disease susceptibility with a `predisposes towards` relation to inherited
          FSGS, not a subclass of focal segmental glomerulosclerosis, and is deliberately not given a
          `has_subtypes` row on this entry. ClinGen''s Glomerulopathy Gene Curation Expert Panel classifies
          APOL1-MONDO:0012931 as Definitive with autosomal recessive inheritance, read from the Gene-Disease
          Validity download of 2026-09-25; that classification is about the susceptibility concept, not
          about a monogenic FSGS.'
      selected_evidence:
        snippet: In a recessive model, APOL1 variants conferred seventeenfold higher odds (95% CI 11 to
          26) for focal segmental glomerulosclerosis (FSGS) and twenty-nine-fold higher odds (95% CI 13
          to 68) for HIV-associated nephropathy (HIVAN).
        supports: SUPPORT
