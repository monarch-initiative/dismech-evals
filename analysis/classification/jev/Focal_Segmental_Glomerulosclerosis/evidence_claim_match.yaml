  cff8f6daafe1a83e3fa4c321753ce79acf5013eacddfe4a1ea4f569f30eef552:
    claim:
      about:
        disease:
          name: Focal Segmental Glomerulosclerosis
          disease_term:
            preferred_term: Focal Segmental Glomerulosclerosis
            term:
              id: MONDO:0100313
              label: focal segmental glomerulosclerosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: APOL1 Risk-Variant Cation Flux and Podocyte Cytotoxicity
        description: G1 and G2 are the two APOL1 coding variants that carry the excess risk of kidney
          disease. For G1, which is the allele the cited work tested, induction of the protein drives
          monovalent cation flux across the podocyte membrane, with potassium efflux, downstream calcium
          release, impaired mitochondrial ATP production and inhibited translation. This is the mechanism
          by which a common risk genotype, rather than a Mendelian lesion, reaches the podocyte-injury
          node. It is an upstream modifier of susceptibility, not a subtype of FSGS, and the reversal
          of the phenotype by a small-molecule APOL1 blocker is what identifies the cation flux as proximal
          rather than incidental.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: APOL1
          term:
            id: hgnc:618
            label: APOL1
