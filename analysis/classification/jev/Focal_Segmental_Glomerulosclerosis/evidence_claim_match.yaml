            label: focal segmental glomerulosclerosis 1
        description: Autosomal dominant FSGS caused by missense variants in ACTN4, encoding the actin-filament
          crosslinking protein alpha-actinin-4. The mutant protein binds F-actin more tightly than wild
          type, so the lesion is at the podocyte actin cytoskeleton. MONDO also files this concept under
          familial idiopathic steroid-resistant nephrotic syndrome.
        genes:
        - preferred_term: ACTN4
          term:
            id: hgnc:166
            label: ACTN4
        inheritance:
        - name: Autosomal dominant
      selected_evidence:
        snippet: Here we present evidence implicating mutations in the gene encoding alpha-actinin-4 (ACTN4;
          ref. 2), an actin-filament crosslinking protein, as the cause of disease in three families with
          an autosomal dominant form of FSGS.
        supports: SUPPORT
