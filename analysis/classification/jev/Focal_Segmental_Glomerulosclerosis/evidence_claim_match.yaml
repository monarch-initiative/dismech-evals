        notes: Separate from the recessive record above, and much weaker. The heterozygous claim rests
          on single-allele-ablating variants found in 2 of 30 African-American patients with idiopathic
          FSGS, and the accompanying Lancet commentary states plainly that the association could be accidental.
          ClinGen grades CD2AP against inherited FSGS (MONDO:0005363) as only Moderate with autosomal
          dominant inheritance, against Definitive for the recessive relationship, read from the same
          2026-09-25 download. Against the heterozygous claim, both parents of the homozygous patient
          described in PMID:17713465 carried the truncating allele with normal glomerular filtration and
          no proteinuria. Cd2ap heterozygous mice do develop FSGS-like lesions, so the species disagree
          here and the human dominant effect is unresolved rather than excluded.
