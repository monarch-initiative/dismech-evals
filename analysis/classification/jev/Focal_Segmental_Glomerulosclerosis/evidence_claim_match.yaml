            label: focal segmental glomerulosclerosis 5
        description: Autosomal dominant FSGS caused by missense variants clustered in the diaphanous inhibitory
          domain of INF2, a formin-family actin regulator. The separate INF2 phenotype combining FSGS
          with Charcot-Marie-Tooth neuropathy is curated by MONDO as Charcot-Marie-Tooth disease dominant
          intermediate E (MONDO:0013758), which is the concept ClinGen's Charcot-Marie-Tooth panel classifies
          as Definitive for INF2; no claim about that phenotype is made on this row.
        genes:
        - preferred_term: INF2
          term:
            id: hgnc:23791
            label: INF2
        inheritance:
        - name: Autosomal dominant
      selected_evidence:
        snippet: we detected nine independent nonconservative missense mutations in INF2, which encodes
          a member of the formin family of actin-regulating proteins. These mutations, all within the
          diaphanous inhibitory domain of INF2, segregate with FSGS in 11 unrelated families and alter
          highly conserved amino acid residues.
        supports: SUPPORT
