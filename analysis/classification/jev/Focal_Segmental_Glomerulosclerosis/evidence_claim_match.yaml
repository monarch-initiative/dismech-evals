        inheritance:
        - name: Autosomal recessive
        notes: 'CD2AP links nephrin and podocin at the slit diaphragm. Biallelic loss is an established
          recessive cause of FSGS: ClinGen''s Glomerulopathy Gene Curation Expert Panel classifies CD2AP-MONDO:0011917
          as Definitive with autosomal recessive inheritance, read from the Gene-Disease Validity download
          of 2026-09-25, and the defining report identifies a homozygous frameshift in three siblings
          and reproduces the disease with the same allele in mice. This record carries that recessive
          claim; the separate heterozygous claim is a weaker and distinct one and is recorded below. MONDO
          models the concept as "focal segmental glomerulosclerosis 3, susceptibility to" (MONDO:0011917),
          a child of inherited disease susceptibility that `predisposes towards` inherited FSGS rather
          than a subclass of FSGS, so neither record gets a `has_subtypes` row here; that is a disagreement
          with MONDO''s modelling of a Definitive recessive gene-disease relationship as a susceptibility,
          not with ClinGen''s grade.'
      selected_evidence:
        snippet: When the same frameshift mutation was introduced in mice by gene editing, the mice developed
          FSGS and kidney failure.
        supports: SUPPORT
