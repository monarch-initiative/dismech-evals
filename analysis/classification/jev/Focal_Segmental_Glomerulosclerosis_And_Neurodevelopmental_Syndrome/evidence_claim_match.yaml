              label: focal segmental glomerulosclerosis and neurodevelopmental syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TRIM8 C-terminal Truncation
        biological_scale: MOLECULAR
        description: Heterozygous nonsense and frameshift variants in the final exon of TRIM8 truncate
          the protein between residues 390 and 487. Because they lie in the last exon the transcripts
          escape nonsense-mediated decay, so a truncated protein lacking the C-terminal region is expected
          to be made. TRIM8 is an E3 ubiquitin ligase; ClinGen records that these variants are hypothesized
          to act through gain-of-function or toxic effects, while patient kidney tissue shows loss of
          detectable TRIM8 and accumulation of its ubiquitination target SOCS1. The direction of the change
          in ligase activity is therefore recorded as abnormal rather than decreased or increased.
        genes:
        - preferred_term: TRIM8
          term:
            id: hgnc:15579
            label: TRIM8
        genetic_context:
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          gene:
            preferred_term: TRIM8
            term:
              id: hgnc:15579
              label: TRIM8
        molecular_functions:
        - preferred_term: TRIM8 E3 ubiquitin protein ligase activity
          modifier: ABNORMAL
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
      selected_evidence:
        snippet: All TRIM8 variants cause protein truncation clustering within the last exon between residues
          390 and 487 of the 551 amino acid protein, indicating a correlation between this syndrome and
          loss of the TRIM8 C-terminal region.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33508234
      reference_title: De novo TRIM8 variants impair its protein localization to nuclear bodies and cause
        developmental delay, epilepsy, and focal segmental glomerulosclerosis.
      evidence_source: HUMAN_CLINICAL
      explanation: Defines the allelic class - last-exon truncations removing the C-terminal region.
