              label: focal segmental glomerulosclerosis and neurodevelopmental syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TRIM8 Mislocalization from Nuclear Bodies
        biological_scale: CELLULAR
        description: Wild-type TRIM8 forms nuclear bodies that frequently abut Gemini and Cajal bodies;
          truncated patient variants instead spread diffusely through the nucleoplasm in podocytes and
          neuronal cells. The study proposing this mechanism links it to both the kidney and brain disease.
          A 2025 preprint describes the bodies as condensates formed by the C-terminal disordered region
          and links their disruption to altered proteasomal regulation, TAK1/NF-kB signaling and podocyte
          dysfunction; this has not yet been peer reviewed, and no neuronal mechanism has been shown.
        genes:
        - preferred_term: TRIM8
          term:
            id: hgnc:15579
            label: TRIM8
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        cellular_components:
        - preferred_term: TRIM8 nuclear body
          term:
            id: GO:0016604
            label: nuclear body
      selected_evidence:
        snippet: Co-localization studies demonstrated that Gemini and Cajal bodies frequently abut a TRIM8
          nuclear body.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
