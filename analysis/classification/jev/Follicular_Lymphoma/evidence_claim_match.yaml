      assertion_type: Subtype
      assertion:
        name: Classic Follicular Lymphoma
        description: Conventional nodal FL with a follicular growth pattern and frequent t(14;18)(q32;q21)/IGH::BCL2
          translocation. Usually composed of centrocytes with variable centroblasts and follows an indolent
          relapsing course.
      selected_evidence:
        snippet: These cases are referred to as classic FL in the current World Health Organization classification
        supports: SUPPORT
