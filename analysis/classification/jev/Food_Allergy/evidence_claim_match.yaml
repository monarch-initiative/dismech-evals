      assertion_type: Treatment
      assertion:
        name: Peanut Oral Immunotherapy (AR101)
        description: 'Escalating-dose oral immunotherapy with a characterised peanut protein product,
          FDA-approved for peanut allergy. It raises the dose tolerated at challenge and reduces symptom
          severity on exposure, but it is an adjunct to avoidance and epinephrine rather than a replacement:
          it desensitises rather than curing, and patients continue to carry epinephrine.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: oral immunotherapy
          term:
            id: NCIT:C15262
            label: Immunotherapy
        notes: No therapeutic_agent is bound. The characterised drug product is defatted peanut flour
          (AR101 / Palforzia); OLS NCIT searches for "Peanut Allergen Powder", "AR101", "Palforzia" and
          "defatted peanut flour" returned no pharmacologic-substance term, and NCIT:C189453 Arachis hypogaea
          Antigen sits under Allergen/Antigen rather than NCIT:C1909 Pharmacologic Substance, so it is
          outside the ChemicalEntityTerm enum and cannot occupy that slot.
      selected_evidence:
        snippet: AR101 resulted in higher doses of peanut protein that could be ingested without dose-limiting
          symptoms and in lower symptom severity during peanut exposure at the exit food challenge than
          placebo.
        supports: SUPPORT
