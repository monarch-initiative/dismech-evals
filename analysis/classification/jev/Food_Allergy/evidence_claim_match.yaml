      assertion_type: Treatment
      assertion:
        name: Omalizumab
        description: Omalizumab is an anti-IgE monoclonal antibody, FDA-approved for reducing allergic
          reactions to foods in patients with one or more food allergies. It sequesters free IgE so that
          less is available to arm FcepsilonRI on mast cells and basophils, raising the reaction threshold
          across multiple foods at once. Like oral immunotherapy it raises the threshold rather than curing,
          and patients continue to avoid the culprit foods and carry epinephrine.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: omalizumab
            term:
              id: NCIT:C29299
              label: Omalizumab
      selected_evidence:
        snippet: A total of 79 of the 118 participants (67%) receiving omalizumab met the primary end-point
          criteria, as compared with 4 of the 59 participants (7%) receiving placebo (P<0.001).
        supports: SUPPORT
