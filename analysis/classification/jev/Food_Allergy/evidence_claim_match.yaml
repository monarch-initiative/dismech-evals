              label: food allergy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Multivalent FcepsilonRI Crosslinking
        biological_scale: MOLECULAR
        description: 'An allergen bearing two or more IgE epitopes bridges adjacent IgE-FcepsilonRI complexes,
          and the resulting receptor aggregate initiates signalling. Valency and epitope spacing are not
          merely permissive: tetravalent antigen produces larger, more complex aggregates and stronger
          responses than bivalent antigen, can signal at low IgE occupancy, and the geometry of the aggregate
          determines signalling efficiency. This is the step at which the oligomeric state of the allergen
          is converted into a quantitative difference in effector output.'
        cell_types:
        - preferred_term: mast cell
          term:
            id: CL:0000097
            label: mast cell
        - preferred_term: basophil
          term:
            id: CL:0000767
            label: basophil
        biological_processes:
        - preferred_term: Fc-epsilon receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0038095
            label: Fc-epsilon receptor signaling pathway
      selected_evidence:
        snippet: Thus, allergen valency and epitope spatial arrangement dictate FcεRI aggregate organization
          and subsequent effector cell activation.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42589421
      reference_title: IgE Occupancy and Antigen Valency Cooperate to Control FcεRI Aggregation Geometry
        and Signaling Efficiency.
      evidence_source: IN_VITRO
      explanation: Primary conclusion that allergen valency and epitope arrangement control receptor aggregate
        organisation and effector activation. Graded INDIRECT because the valency series was built from
        a grass-pollen (Phl p 1) epitope grafted onto a myoglobin scaffold rather than from a food allergen,
        so the principle transfers by inference.
