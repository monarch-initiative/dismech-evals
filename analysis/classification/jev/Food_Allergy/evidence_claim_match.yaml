        exposure_term:
          preferred_term: cutaneous exposure to food allergen through inflamed or barrier-impaired skin
          term:
            id: ECTO:0000726
            label: exposure to allergen
        effect: PREDISPOSES
        description: 'The dual-allergen-exposure hypothesis holds that encountering a food allergen across
          inflamed or barrier-impaired skin (as in atopic dermatitis) primes sensitisation, while the
          same allergen taken orally promotes tolerance. The outcome is context-dependent: healthy skin
          promotes tolerance, and only about a third of children with atopic dermatitis go on to a food
          allergy, so this is a predisposing route rather than a sufficient cause.'
      selected_evidence:
        snippet: The dual-allergen exposure hypothesis suggests that impaired skin barrier exposure leads
          to sensitization, whereas early oral intake induces tolerance.
        supports: SUPPORT
