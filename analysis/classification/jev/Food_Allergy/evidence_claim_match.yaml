      assertion:
        name: Dietary Protein Allergen Exposure
        biological_scale: ORGANISM
        description: Ingestion of an intact or partially digested food protein presents that protein to
          the gut mucosal immune system. A small number of foods account for the great majority of IgE-mediated
          disease, which is one reason allergen identity rather than diet composition in general is the
          exposure that matters.
      selected_evidence:
        snippet: In the US, 9 foods account for more than 90% of IgE-mediated food allergies-crustacean
          shellfish, dairy, peanut, tree nuts, fin fish, egg, wheat, soy, and sesame.
        supports: SUPPORT
