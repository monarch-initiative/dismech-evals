        snippet: We found that 63 kDa Ara h 1 occurs as higher order homo-oligomeric conformations such
          as decamer or nonamer, while 54 kDa Ara h 1 occurs exclusively as a homotrimer, indicating that
          the N-terminal domain of the 63 kDa molecule may be involved in higher order oligomerization.
        supports: SUPPORT
