            term:
              id: MONDO:0700226
              label: food allergy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oligomeric Allergen Epitope Display
        biological_scale: MOLECULAR
        description: 'Many major food allergens are not monomers. Native Ara h 1, the peanut 7S vicilin,
          assembles into higher-order homo-oligomers (nonamer or decamer), and a truncated 54 kDa isoform
          lacking the N-terminal domain is instead exclusively trimeric -- which localises the higher-order
          oligomerisation interface to that N-terminal domain. The cow''s milk whey lipocalin beta-lactoglobulin
          (Bos d 5) likewise associates into dimers in solution. Because oligomerisation multiplies the
          copies of an epitope carried on one particle, this quaternary structure sets the valency available
          for downstream FcepsilonRI crosslinking, and the oligomerisation interface is therefore a structural
          determinant of effector potency rather than an incidental biophysical property. The epitopes
          must also be *accessible*: in beta-lactoglobulin, occupancy of the lipocalin ligand pocket is
          predicted to mask major IgE and T-cell epitopes, so the same protein displays different epitope
          surfaces in its ligand-free and ligand-loaded states.'
        molecular_functions: []
        biological_processes:
        - preferred_term: allergen homo-oligomerisation
          term:
            id: GO:0051260
            label: protein homooligomerization
      selected_evidence:
        snippet: it was shown that β-lg forms dimeric structures in 50 mM HEPES buffer under various conditions
          of the medium
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
