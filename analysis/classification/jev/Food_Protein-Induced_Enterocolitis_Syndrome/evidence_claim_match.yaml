      assertion_type: Subtype
      assertion:
        name: Acute FPIES
        description: Repetitive vomiting 1 to 4 hours after intermittent ingestion of the trigger food,
          followed by lethargy and pallor and sometimes diarrhea within 5 to 10 hours; patients are well
          between episodes and symptoms resolve within 24 hours of food elimination.
      selected_evidence:
        snippet: Acute FPIES is characterized by repetitive vomiting that occurs 1-4 hours after food
          ingestion.
        supports: SUPPORT
