        status: EMERGING
        description: Ingestion of the trigger food is followed by systemic activation of monocytes, neutrophils,
          natural killer cells and eosinophils and by neuroendocrine activation, which together produce
          neutrophilia, vomiting and the shock-like systemic response. The innate activation itself is
          well documented in blood; the upstream event that confers food specificity and the link to the
          emetic reflex are not established.
      selected_evidence:
        snippet: FPIES reactions are associated with marked activation of innate immune and neuroendocrine
          pathways; however, the mechanism underlying the specific recognition of foods remains elusive.
        supports: SUPPORT
