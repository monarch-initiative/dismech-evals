      assertion_type: Diagnosis
      assertion:
        name: Supervised oral food challenge
        description: The diagnostic standard when history is unclear and the means of detecting resolution,
          usually no sooner than 12 months after the last reaction; a positive challenge requires the
          major criterion plus at least two minor criteria, which include a neutrophil rise of at least
          1,500/mm3 above baseline. Food-specific IgE testing before challenge identifies atypical FPIES
          needing an IgE-mediated challenge protocol.
      selected_evidence:
        snippet: The criterion standard to diagnosing FPIES is through OFC; however, this is not always
          necessary if the patient's history is consistent with an FPIES reaction and all other diagnoses
          have been ruled out.
        supports: SUPPORT
