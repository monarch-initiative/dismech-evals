        prompt: How is the trigger food specifically recognized in FPIES, given that food-specific antibodies
          are weak or absent and food-responsive T cells are within the range of tolerant controls, yet
          reactions are reproducibly food-specific?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Food Antigen-Responsive T-Cell Activation
        - pathophysiology#Systemic Innate Immune Activation
        - mechanistic_hypotheses#innate_immune_activation_model
        rationale: Without the recognition step the chain from ingestion to innate activation cannot be
          completed, and for cow's milk FPIES it is not known whether casein, whey proteins or a non-protein
          milk component is the operative antigen.
      selected_evidence:
        snippet: Further investigation is needed to identify the mechanism of antigen specificity of adverse
          reactions to foods in FPIES.
        supports: SUPPORT
