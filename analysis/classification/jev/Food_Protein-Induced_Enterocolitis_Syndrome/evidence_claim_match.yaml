        context: []
      assertion_type: Diagnosis
      assertion:
        name: Consensus clinical criteria for acute FPIES
        description: Acute FPIES is diagnosed with one major criterion (vomiting 1 to 4 hours after ingestion
          of the suspected food without IgE-mediated skin or respiratory symptoms) plus at least three
          minor criteria (repeated episodes, reaction to a different food, lethargy, pallor, emergency
          department visit, need for intravenous fluids, diarrhea within 24 hours, hypotension, hypothermia).
          Infectious gastroenteritis, sepsis, anatomic obstruction, necrotizing enterocolitis and anaphylaxis
          should be excluded. There is no diagnostic biomarker; absence of fever and a normal C-reactive
          protein favor FPIES over sepsis or gastroenteritis.
      selected_evidence:
        snippet: In the young vomiting child, lethargy, floppiness, pallor without fever, and normal CRP
          should alert clinicians to a possible diagnosis of FPIES.
        supports: SUPPORT
