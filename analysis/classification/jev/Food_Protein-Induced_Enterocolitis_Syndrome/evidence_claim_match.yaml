    claim:
      about:
        disease:
          name: Food Protein-Induced Enterocolitis Syndrome
          disease_term:
            preferred_term: food protein-induced enterocolitis syndrome
            term:
              id: MONDO:0100008
              label: food protein-induced enterocolitis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Food Antigen-Responsive T-Cell Activation
        description: T cells responsive to the trigger food (milk, soy or rice) are more frequent in active
          than in resolved FPIES, and casein stimulation elicits CD4+ T-cell proliferation with Th2 cytokines
          in cow's milk FPIES. Because similar responses occur in tolerant or IgE-allergic controls, these
