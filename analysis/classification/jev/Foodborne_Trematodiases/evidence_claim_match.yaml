        classification: etiologic_species
        geography:
        - Worldwide
        - Americas
        description: 'Liver-fluke infection by Fasciola hepatica or F. gigantica, and the one stratum
          whose first-line drug differs: it is treated with triclabendazole, not the praziquantel that
          treats every other foodborne trematodiasis here. It also differs on vehicle and reservoir —
          the metacercariae are eaten on raw aquatic vegetation rather than in fish or crustacea, and
          the maintenance hosts are ruminants — and on range, being reported from all regions with its
          highest prevalence in the Americas rather than in Asia.'
        subtype_term:
          preferred_term: fascioliasis
          term:
            id: MONDO:0004668
            label: fascioliasis
      selected_evidence:
        snippet: The consumption of raw vegetables and freshwater plants was a key risk factor in every
          geographical area where fascioliasis was reported.
        supports: SUPPORT
