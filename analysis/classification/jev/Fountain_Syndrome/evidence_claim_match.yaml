      assertion_type: DifferentialDiagnosis
      assertion:
        name: DOORS syndrome and the ATP6V1B2 deafness-onychodystrophy spectrum
        description: Deafness, ONychodystrophy, Osteodystrophy, mental Retardation, and Seizures (DOORS),
          together with dominant deafness-onychodystrophy (DDOD) and Zimmermann-Laband syndrome, overlaps
          with Fountain syndrome on the deafness + skeletal + intellectual-disability + seizures profile.
        distinguishing_features:
        - ATP6V1B2-related (DDOD/ZLS) or TBC1D24-biallelic (DOORS) with defined molecular tests; nail/distal-phalanx
          (onychodystrophy, triphalangeal thumbs) and gingival findings dominate, rather than Fountain's
          coarse full-lipped facies with progressive soft-tissue swelling and inner-ear malformation.
        disease_term:
          preferred_term: DOORS syndrome
          term:
            id: MONDO:0009079
            label: DOORS syndrome
      selected_evidence:
        snippet: 'De novo monoallelic variants of this gene have been associated with two distinct phenotypes:
          Zimmermann-Laband syndrome 2 (ZLS2), an intellectual deficiency/multiple malformation syndrome,
          and dominant deafness onychodystrophy (DDOD), a multiple malformation syndrome without cognitive
          involvement'
        supports: SUPPORT
