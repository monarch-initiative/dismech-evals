      assertion:
        phase: Age-dependent accentuation
        age_range: Childhood through adulthood
        notes: 'The syndrome is not degenerative, but its recognizability increases with age: the coarse
          facies, subcutaneous cheek/lip swelling, and skeletal features become progressively more evident,
          which is why the diagnosis is often made or confirmed later than the congenital deafness. This
          is a change in phenotypic expression rather than documented neurologic decline; no natural-history
          cohort, survival, or staging data exist. The trend rests on the 1996 series of five patients
          (two new isolated cases plus follow-up on three previously reported), too small a denominator
          to quantify a rate.'
