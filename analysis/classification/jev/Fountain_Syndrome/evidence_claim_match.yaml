  1a5923a96557ba303969f456b0953a71a69d5316f904f74e5cc5b25b269a77a5:
    claim:
      about:
        disease:
          name: Fountain Syndrome
          disease_term:
            preferred_term: fountain syndrome
            term:
              id: MONDO:0009241
              label: fountain syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mucopolysaccharidoses and other coarse-facies storage disorders
        description: 'The lysosomal storage disorders — mucopolysaccharidosis type I (Hurler) in particular
          — are the classic autosomal recessive cause of the combination that defines Fountain syndrome:
          coarse facial features, hearing loss, skeletal dysplasia, and intellectual disability. They
          are the highest-yield metabolic mimic to exclude before settling on a clinical Fountain diagnosis.'
        distinguishing_features:
        - Storage disorders are PROGRESSIVE and multisystem, with dysostosis multiplex affecting all bones,
          progressive arthropathy, corneal clouding, hepatosplenomegaly, and cardiorespiratory involvement
          — none of which is part of Fountain syndrome, whose skeletal changes are static broad/stubby
          hands and feet with hyperkyphosis. Decisively, MPS has a measurable biochemical defect (deficient
          alpha-L-iduronidase with urinary glycosaminoglycan excretion) and a molecular test, whereas
          the 1987 Fountain series reported an unrevealing biochemical and metabolic workup.
        disease_term:
          preferred_term: mucopolysaccharidosis type I (Hurler syndrome)
          term:
            id: MONDO:0001586
            label: mucopolysaccharidosis type 1
      selected_evidence:
        snippet: Progressive cardiorespiratory involvement, hearing loss, and corneal clouding are common
        supports: SUPPORT
