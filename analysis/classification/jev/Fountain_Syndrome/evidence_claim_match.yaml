      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hao-Fountain syndrome
        description: Shares the "Fountain" eponym (coincidentally) and includes intellectual disability
          with dysmorphism, so it is the primary Named-Entity-Confusion trap. It is a molecularly and
          clinically distinct disorder.
        distinguishing_features:
        - Caused by pathogenic USP7 variants (16p13.2) with autosomal DOMINANT (usually de novo) inheritance,
          not autosomal recessive; lacks the defining Fountain-syndrome triad of congenital sensorineural
          deafness with inner-ear malformation, coarse face with full-lip/soft-tissue swelling, and the
          broad stubby-hand skeletal dysplasia. Confirmed by USP7 sequencing.
        disease_term:
          preferred_term: Hao-Fountain syndrome
          term:
            id: MONDO:0014805
            label: Hao-Fountain syndrome
      selected_evidence:
        snippet: USP7-related Hao-Fountain syndrome is an autosomal dominant disorder typically caused
          by a de novo pathogenic variant
        supports: SUPPORT
    origin:
