        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: heme_import_model
        hypothesis_label: FLVCR2 Heme-Import Model
        status: ALTERNATIVE
        description: 'The original account, in which FLVCR2 imports heme and disease alleles produce an
          endothelial heme deficit. It was the field''s working model from 2010 and was supported by structural
          interpretation of the patient mutation set, but it was never demonstrated in patient tissue
          and the 2024 substrate work states that conclusive evidence for it never existed. It is retained
          as ALTERNATIVE rather than DEPRECATED because endothelial heme content remains a measured, manipulable
          variable with a mechanistic route to the angiogenic phenotype: reducing it de-represses NOTCH
          and perturbs tip/stalk specification, and heme precursor or hemin reverses that.'
      selected_evidence:
        snippet: Here, we report the cellular function of FLVCR2 as an importer of heme, based on the
          following observations.
        supports: SUPPORT
