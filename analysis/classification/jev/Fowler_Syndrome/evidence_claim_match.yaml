          modifier: ABNORMAL
        - preferred_term: Notch signaling pathway
          term:
            id: GO:0007219
            label: Notch signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Endothelial cell-specific deletion of Flvcr2 or chemical inhibition of heme synthesis
          during post-natal retinal vascularization led to reduced vascular expansion in both primary
          (superficial) and secondary (deep) vascular plexuses, and a more severe but partially penetrant
          phenotype with attenuation of retinal vascular development and formation of abnormal vascular
          glomeruloids.
        supports: SUPPORT
