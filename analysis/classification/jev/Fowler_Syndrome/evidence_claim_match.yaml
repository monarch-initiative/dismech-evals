  33fc840e8443ee2c479efd6251044373f05f5e43b8993bd871c6a8081c6c369c:
    claim:
      about:
        disease:
          name: Fowler Syndrome
          disease_term:
            preferred_term: Fowler syndrome
            term:
              id: MONDO:0009168
              label: Fowler syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic FLVCR2 Loss of Function
        biological_scale: MOLECULAR
        description: 'Autozygosity mapping in three consanguineous families localised the disorder to
          chromosome 14q24.3, and direct sequencing of candidate genes in the interval found five different
          germline FLVCR2 mutations across five families. FLVCR2 is a transmembrane carrier of the major
          facilitator superfamily. Reported alleles are predominantly missense; structural analysis of
          the published set has been interpreted as stabilising an occluded conformation or causing misfolding,
          and one splice-region deletion has been shown by minigene assay to impair splicing of exon 5.

          '
        genes:
        - preferred_term: FLVCR2
          term:
            id: hgnc:20105
            label: FLVCR2
        genetic_context:
          description: 'Biallelic germline FLVCR2 variants, homozygous in consanguineous kindreds and
            compound heterozygous in others. Complete transport-null alleles are not required: a compound
            heterozygote carrying p.(Arg492Trp) retained roughly a quarter to a third of wild-type transport
            activity.

            '
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
      selected_evidence:
        snippet: Direct sequencing of candidate genes within the target interval revealed five different
          germline mutations in FLVCR2 in five families with Fowler syndrome.
        supports: SUPPORT
    origin:
