        - path: /pathophysiology/9
          value:
            name: Fetal Akinesia Deformation Sequence
            biological_scale: ORGANISM
            description: 'Absent or reduced fetal movement produces a stereotyped deformation sequence:
              joint contractures, pterygia, micrognathia and postural abnormalities. In the fourteen-fetus
              series, joint contractures were present in twelve and pterygia in eleven, against micrognathia
              in ten. These are secondary mechanical consequences of immobility, not independent malformations,
              which is why they cluster so tightly with each other and so loosely with the severity of
              the cerebral lesion.

              '
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Micrognathia
        causal_link_type: DIRECT
        description: Reduced mandibular growth from absent fetal jaw movement.
