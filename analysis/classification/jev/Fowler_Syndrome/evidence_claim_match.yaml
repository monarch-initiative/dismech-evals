        name: CNS Endothelial Angiogenic Dysfunction
        biological_scale: CELLULAR
        description: 'The primary cellular lesion is in the endothelium of the developing CNS vasculature,
          which fails to build an orderly vascular bed. Endothelial-specific deletion of Flvcr2 in mouse,
          or chemical inhibition of heme synthesis, reduces vascular expansion of both retinal plexuses
          and in a subset produces frankly abnormal vascular glomeruloids - the same lesion seen in human
          CNS. Mechanistically the defect sits at tip/stalk specification, with loss of FLVCR2 attenuating
          the normal restraint on NOTCH1 and on VEGF-induced proliferation.

          '
        cell_types:
        - preferred_term: brain microvascular endothelial cell
          term:
            id: CL:2000044
            label: brain microvascular endothelial cell
        - preferred_term: retinal blood vessel endothelial cell
          term:
