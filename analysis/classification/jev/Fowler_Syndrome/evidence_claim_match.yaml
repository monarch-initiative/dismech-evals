          denervates fetal muscle, giving the muscular neurogenic atrophy that is part of the original
          phenotype definition. This is the node that converts a cerebrovascular disease into a fetal
          akinesia syndrome, and it is why Fowler syndrome belongs in the differential of lethal multiple
          pterygium syndrome rather than only in that of hydranencephaly.

          '
