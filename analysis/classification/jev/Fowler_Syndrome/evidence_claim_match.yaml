              label: Fowler syndrome
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Survival beyond infancy with profound disability
        notes: 'A minority survive. The first reported survivors, a brother and sister homozygous for
          FLVCR2 c.1289C>T, had severe intellectual and neurological disability with seizures, no functional
          movement and no means of communication, on a background of profound ventriculomegaly, calcifications
          and cerebellar hypoplasia. Intrafamilial variability is documented: of three siblings carrying
          identical alleles, only two showed the cerebral features seen in affected fetuses.

          '
      selected_evidence:
        snippet: The patients present a phenotype of severe intellectual and neurologic disability with
          seizures, absence of functional movements, and no means of communication.
        supports: SUPPORT
