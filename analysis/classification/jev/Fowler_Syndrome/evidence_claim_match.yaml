  580d3829c9b0a75f404835171187ff88708a361e044aaab4a9218cbebc812bba:
    claim:
      about:
        disease:
          name: Fowler Syndrome
          disease_term:
            preferred_term: Fowler syndrome
            term:
              id: MONDO:0009168
              label: Fowler syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired FLVCR2 Solute Transport at the CNS Endothelial Membrane
        biological_scale: MOLECULAR
        description: 'FLVCR2 is expressed in the endothelial cells of brain blood vessels, and the murine
          ortholog Mfsd7c is an endothelial transporter whose loss causes brain angiogenic growth deficiency
          and lethality. This node is the convergence point of the disease and is deliberately stated
          in substrate-neutral terms: what the carrier moves is contested, and the two candidate substrates
          are modelled as separate downstream arms opting into distinct hypothesis groups. Patient missense
          alleles have been shown directly to abolish or reduce transport activity, and a hypomorphic
          allele retaining a quarter to a third of activity was still sufficient for disease, so the lesion
          is graded rather than all-or-none.

          '
        genes:
        - preferred_term: FLVCR2
          term:
            id: hgnc:20105
            label: FLVCR2
        cell_types:
        - preferred_term: brain microvascular endothelial cell
          term:
            id: CL:2000044
            label: brain microvascular endothelial cell
      selected_evidence:
        snippet: The loss of the murine ortholog Mfsd7c, an endothelial transporter in brain blood vessels,
          causes brain angiogenic growth deficiency and lethality.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
