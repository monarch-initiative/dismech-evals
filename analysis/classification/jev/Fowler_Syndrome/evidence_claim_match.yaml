        biological_scale: TISSUE
        description: 'The pathognomonic lesion. Perforating vessels become abnormally thickened and aberrant,
          forming glomeruloid tufts of poorly organised endothelium with inclusion-bearing endothelial
          cells, throughout the central nervous system and the retinal vasculature. It was present in
          all fourteen fetuses of one autopsy series, though with variable extent of CNS involvement,
          and a focal form confined to restricted CNS territories exists alongside the classical diffuse
          form. Its confinement to the CNS is diagnostically decisive: the typical proliferative vasculopathy
          has never been observed outside the central nervous system.

          '
        cell_types:
        - preferred_term: brain microvascular endothelial cell
          term:
            id: CL:2000044
            label: brain microvascular endothelial cell
        biological_processes:
