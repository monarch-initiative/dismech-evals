  0f7ff888c38691670a415da014f8826a654d2794007b37130066a08a5192ab7e:
    claim:
      about:
        disease:
          name: Fowler Syndrome
          disease_term:
            preferred_term: Fowler syndrome
            term:
              id: MONDO:0009168
              label: Fowler syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: flvcr2_transport_direction_and_substrate
        prompt: Does FLVCR2 import choline into the brain across the blood-brain barrier, export lysophosphatidylcholine-derived
          choline out of it, or act principally as a heme importer - and which of these, if any, is the
          step whose failure causes the vasculopathy?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired FLVCR2 Solute Transport at the CNS Endothelial Membrane
        - mechanistic_hypotheses#choline_transport_model
        - mechanistic_hypotheses#heme_import_model
        rationale: 'Three readings of the same protein are live in the literature at once, and they are
          not simply a chronological succession. The 2010 heme-import assignment rested on binding, uptake,
          knockdown and toxicity experiments in cells, and structural analysis of patient alleles was
          later read as supporting it; the 2024 structural work states that conclusive evidence for it
          never existed and identifies choline and ethanolamine as the physiological substrates. But the
          two 2024 choline papers disagree with each other on direction: one demonstrates FLVCR2 as the
          blood-brain barrier choline importer responsible for most brain choline uptake, while the other,
          from endothelial-specific knockouts, finds brain choline paradoxically increased and concludes
          the carrier exports lysophosphatidylcholine-derived choline instead. And a 2026 retinal study
          revives heme as the operative variable, with a rescue arm. This entry therefore does not pick
          a winner: both substrate arms are curated as hypothesis groups converging on one endothelial
          node, and the causal edges from either substrate to the angiogenic defect are marked with unknown
          or named intermediates rather than asserted as mechanism.'
        proposed_experiments:
        - experiment_id: exp_flvcr2_directional_flux_in_patient_derived_bbb
          name: Directional choline flux across patient-genotype brain endothelium
          description: Build a blood-brain-barrier model from iPSC-derived brain microvascular endothelial
            cells carrying defined patient FLVCR2 genotypes, including the hypomorphic p.(Arg492Trp),
            and measure luminal-to-abluminal and abluminal-to-luminal choline flux separately with stable-isotope
            tracing. The published import and export claims were made in different systems, so measuring
            both directions in one human system with matched genotypes is the discriminating experiment.
          perturbations:
          - name: Introduce patient FLVCR2 genotypes into iPSC-derived brain endothelium
            target: pathophysiology#Impaired FLVCR2 Solute Transport at the CNS Endothelial Membrane
          readouts:
          - name: Direction-resolved choline flux
            target: pathophysiology#Failure of Brain Choline Supply
          would_support:
          - pathophysiology#Failure of Brain Choline Supply
        - experiment_id: exp_flvcr2_heme_vs_choline_rescue
          name: Substrate rescue arms in an angiogenic assay of FLVCR2-deficient endothelium
          description: In the same FLVCR2-deficient endothelial angiogenesis assay, compare rescue by
            heme precursor or cell-permeable hemin against rescue by choline or phosphatidylcholine supplementation.
            The heme rescue has been shown; the choline rescue has not been tested head to head against
            it, and whichever restores sprout organisation identifies the limiting substrate for the phenotype
            rather than for the transporter.
          perturbations:
          - name: Heme precursor versus choline supplementation of FLVCR2-deficient endothelium
            target: pathophysiology#Reduced Endothelial Heme Availability
          readouts:
          - name: Restoration of organised sprouting and loss of glomeruloid formation
            target: pathophysiology#CNS Endothelial Angiogenic Dysfunction
          would_support:
          - pathophysiology#Reduced Endothelial Heme Availability
      selected_evidence:
        snippet: Collectively, our work identifies MFSD7c as a choline exporter at the BBB and provides
          a foundation for future work to reveal the disease mechanisms of Fowler syndrome.
        supports: SUPPORT
