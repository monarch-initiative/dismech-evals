      assertion:
        name: Failure of Brain Choline Supply
        biological_scale: MOLECULAR
        description: 'Choline is required in large quantities for phosphatidylcholine synthesis, for betaine-dependent
          methylation and, in cholinergic neurons, for acetylcholine. The brain cannot synthesise it efficiently
          de novo and derives most of it from the circulation, so a blood-brain-barrier carrier defect
          constrains supply at its entry step. FLVCR1 and FLVCR2 select choline and ethanolamine through
          cation-pi interactions with conserved tryptophan and tyrosine residues, which is why the clinical
          missense alleles that line that pocket are transport-incompetent.

          '
        genes:
        - preferred_term: FLVCR2
          term:
            id: hgnc:20105
