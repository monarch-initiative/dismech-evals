  5f411e308203c4de21cb995bb8db45d3465ea1b6ddd6e424f1b1cee4bba8495c:
    claim:
      about:
        disease:
          name: Fowler Syndrome
          disease_term:
            preferred_term: Fowler syndrome
            term:
              id: MONDO:0009168
              label: Fowler syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fowler_syndrome_survival_determinants
        prompt: Why do a small minority of patients with biallelic FLVCR2 variants survive beyond birth,
          and what determines phenotype when genotype does not?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - progression#Survival beyond infancy with profound disability
        - genetic#FLVCR2 variants
        rationale: 'Six of seventy-two published patients survived beyond birth, and no clear genotype-phenotype
          correlation explains which. The decisive observation is intrafamilial: three siblings carrying
          identical compound heterozygous alleles diverged, two showing the fetal cerebral phenotype and
          one markedly milder. Since the alleles are the same, whatever separates them is not the FLVCR2
          genotype. The functional work points the same way - a patient allele retaining a quarter to
          a third of transport activity still produced the disease, and the authors explicitly raise extragenetic
          factors. Candidates include modifier loci acting on choline or heme handling, stochastic variation
          in the timing of the angiogenic insult relative to the vulnerable window of brain development,
          and maternal nutritional choline supply - none tested.'
        proposed_experiments:
        - experiment_id: exp_fowler_survivor_modifier_search
          name: Genome-wide modifier search across the surviving cohort
          description: Sequence and compare survivors against lethal cases matched on FLVCR2 genotype
            where possible, beginning with the discordant sibships that already exist in the literature,
            and test candidate modifiers in the choline and heme handling pathways. The discordant-sibling
            families are the highest-information available material because they hold the primary genotype
            constant.
          readouts:
          - name: Modifier variants segregating with survival
            target: genetic#FLVCR2 variants
      selected_evidence:
        snippet: The third sibling has a surprisingly milder clinical and radiological phenotype, suggesting
          intrafamilial variability.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32333401
      reference_title: 'Expanding the clinical spectrum of Fowler syndrome: Three siblings with survival
        into adulthood and systematic review of the literature.'
      evidence_source: HUMAN_CLINICAL
      explanation: The intrafamilial discordance at constant genotype that this gap records.
