      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: choline_transport_model
        hypothesis_label: FLVCR2 Choline/Ethanolamine Transport Model
        status: CANONICAL
        description: FLVCR2 is a choline and ethanolamine carrier at the blood-brain barrier, selecting
          its substrates through cation-pi interactions in a conserved aromatic pocket. Disease alleles
          disrupt that transport, constraining the brain's supply of a nutrient it cannot make for itself,
          and the developing CNS vasculature fails. This is the current physiological account, established
          in 2024 by independent structural and functional work, and it is the model against which a clinical
          allele has been assayed directly.
      selected_evidence:
        snippet: Our findings suggest that FLVCR2 deficiency may be sufficient to cause PVHH even in the
          absence of a complete loss of transport activity, possibly involving extragenetic factors in
          the pathophysiology of this complex condition.
        supports: SUPPORT
    origin:
