        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Fetal Akinesia Deformation Sequence
        biological_scale: ORGANISM
        description: 'Absent or reduced fetal movement produces a stereotyped deformation sequence: joint
          contractures, pterygia, micrognathia and postural abnormalities. In the fourteen-fetus series,
          joint contractures were present in twelve and pterygia in eleven, against micrognathia in ten.
          These are secondary mechanical consequences of immobility, not independent malformations, which
          is why they cluster so tightly with each other and so loosely with the severity of the cerebral
          lesion.

          '
      selected_evidence:
        snippet: Extra-cranial anomalies included micrognathia (10 fetuses), cleft palate (1 fetus), cystic
          hygroma (2 fetuses), joint contractures (12 fetuses), and pterygia (11 fetuses).
        supports: SUPPORT
