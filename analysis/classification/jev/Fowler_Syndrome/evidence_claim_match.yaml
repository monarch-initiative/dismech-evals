            id: GO:0015871
            label: choline transport
          modifier: DECREASED
        cell_types:
        - preferred_term: brain microvascular endothelial cell
          term:
            id: CL:2000044
            label: brain microvascular endothelial cell
      selected_evidence:
        snippet: Despite the brain’s high demand for choline, it cannot be efficiently synthesised de
          novo3. Instead, the brain derives the majority of its choline from systemic circulation, most
          of which originates from dietary sources1,3.
