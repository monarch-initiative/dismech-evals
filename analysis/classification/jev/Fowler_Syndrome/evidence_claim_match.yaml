      assertion_type: Genetic
      assertion:
        name: FLVCR2 variants
        gene_term:
          preferred_term: FLVCR2
          term:
            id: hgnc:20105
            label: FLVCR2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: Homozygous FLVCR2 c.1289C>T
          description: 'The allele in the first reported patients to survive beyond infancy, a brother
            and sister homozygous for it, identified by whole-exome sequencing.

            '
        - name: Compound heterozygous c.327T>A (p.Asn109Lys) and c.887C>T (p.Ser296Leu)
          description: 'Shared by three siblings who survived into adulthood, two with the cerebral features
            seen in affected fetuses and one considerably milder - the clearest published demonstration
            that genotype does not fix phenotype in this disease.

            '
        - name: Compound heterozygous c.1124+3_1124+6del and p.(Arg492Trp)
          description: 'A fetal case in which both alleles were functionally characterised: the splice
            variant impairs exon 5 splicing on minigene assay, and p.(Arg492Trp) was modelled as highly
            destabilising and shown to cut transport activity by half, leaving net activity of a quarter
            to a third.

            '
        features: 'Genetic homogeneity is the rule: no second locus has been reported since the gene was
          identified in 2010. No clear genotype-phenotype correlation exists, though some variants do
          appear to be associated with a phenotype mild enough to be compatible with life.

          '
      selected_evidence:
        snippet: Although no clear phenotype-genotype correlation exists, some variants appear to be associated
          with a less severe phenotype compatible with life.
        supports: SUPPORT
