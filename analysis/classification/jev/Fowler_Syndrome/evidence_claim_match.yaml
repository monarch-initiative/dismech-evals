          term:
            id: GO:0001525
            label: angiogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Histology of the brain showed the characteristic glomeruloid vascular proliferation of
          Fowler syndrome in all cases, but with variable extent of involvement of the central nervous
          system.
        supports: SUPPORT
