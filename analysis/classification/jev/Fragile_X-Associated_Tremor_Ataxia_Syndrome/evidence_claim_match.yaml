      assertion_type: Pathophysiology
      assertion:
        name: FMR1 premutation CGG expansion and elevated FMR1 mRNA
        description: The initiating lesion is a premutation-range (55-200 CGG) trinucleotide repeat expansion
          in the FMR1 5' UTR. In contrast to the full mutation, the premutation allele is not silenced;
          it is transcribed at elevated levels, producing an expanded CGG-repeat FMR1 mRNA that is the
          substrate for downstream RNA toxicity and RAN translation. Human postmortem single-nucleus RNA-seq
          shows the magnitude of FMR1 upregulation in brain is more modest (~1.3-fold in some glia) than
          the 4-8-fold reported in peripheral blood, implicating tissue- and cell-type-specific toxicity.
        gene:
          preferred_term: FMR1
          modifier: INCREASED
          term:
            id: hgnc:3775
            label: FMR1
        cell_types:
        - preferred_term: neuron
          term:
