      selected_evidence:
        snippet: transcribed premutation repeats alone are sufficient to cause neurodegeneration, suggesting
          that rCGG-repeat-binding proteins (RBPs) may be sequestered from their normal function by rCGG
          binding
        supports: SUPPORT
