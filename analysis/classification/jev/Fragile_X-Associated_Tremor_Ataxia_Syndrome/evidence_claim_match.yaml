            label: neuron
        - preferred_term: glial cell
          term:
            id: CL:0000125
            label: glial cell
        biological_processes:
        - preferred_term: gene expression
          term:
            id: GO:0010467
            label: gene expression
          modifier: INCREASED
      selected_evidence:
        snippet: We found only modest upregulation (~1.3-fold) of FMR1 in some glial populations associated
          with premutation expansions.
        supports: SUPPORT
