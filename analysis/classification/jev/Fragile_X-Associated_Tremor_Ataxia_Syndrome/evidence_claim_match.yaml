          and Pur alpha overexpression suppresses this toxicity, supporting a sequestration mechanism.
          Pur alpha is also found within the intranuclear inclusions of FXTAS patient brains.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
