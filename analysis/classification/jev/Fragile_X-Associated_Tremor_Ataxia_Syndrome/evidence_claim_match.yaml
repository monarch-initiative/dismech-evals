        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_fmr1_premutation_rna_gof_ran_translation_model
        hypothesis_label: Canonical FMR1 Premutation RNA Gain-of-Function / RAN-Translation (FMRpolyG)
          Model
        status: CANONICAL
        description: 'FXTAS arises from a 55-200 CGG repeat premutation expansion in the FMR1 5'' UTR.
          Unlike the full mutation (which silences FMR1 and causes fragile X syndrome via FMRP loss),
          the premutation is transcribed at elevated levels and is pathogenic through two non-exclusive
          gain-of-function routes: (1) RNA toxicity, in which the expanded CGG-repeat FMR1 mRNA sequesters
          CGG-repeat-binding proteins (e.g., Pur alpha, hnRNP A2/B1) into RNA foci, depleting them from
          their normal functions; and (2) repeat-associated non-AUG (RAN) translation, which produces
          a toxic polyglycine protein, FMRpolyG, that drives ubiquitin-proteasome system impairment. These
          converge on ubiquitin-positive intranuclear inclusions in neurons and astrocytes, proteostasis/autophagy
          failure, mitochondrial dysfunction and oxidative stress, and glial/white-matter disruption,
          culminating in cerebellar and fronto-subcortical circuit degeneration.'
      selected_evidence:
        snippet: The pathogenic mechanism is related to overexpression and toxicity of the FMR1 mRNA per
          se.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
