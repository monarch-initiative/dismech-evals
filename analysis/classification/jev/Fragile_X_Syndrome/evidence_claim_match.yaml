      assertion:
        name: Somatic CGG Repeat Expansion (FMR1)
        conforms_to: mismatch_repair_driven_repeat_instability#Aberrant Mismatch-Repair Processing of
          the Repeat
        biological_scale: TISSUE
        description: 'The FMR1 CGG repeat is processed by an aberrant DNA mismatch-repair route: the MutSβ
          (MSH2-MSH3) recognition complex, with the MutLγ (MLH1-MLH3) effector complex acting downstream,
          is required for germline and somatic CGG expansion in knock-in mouse models of the fragile X-associated
          disorders. This is the CGG-class instance of the module''s aberrant-MMR machinery and lies upstream
          of the full-mutation methylation silencing that abolishes FMRP. Unlike the CAG/CTG disorders,
          ongoing post-mitotic somatic expansion is not established as the rate-limiting driver of fragile
          X syndrome onset — in humans the premutation to full-mutation transition is predominantly a
          maternal-germline / early-embryonic event and the silencing is already set developmentally —
          so this node conforms only at the molecular MMR-processing level, not at the module''s somatic
          post-mitotic expansion node.'
        genes:
        - preferred_term: FMR1
          term:
            id: hgnc:3775
            label: FMR1
        - preferred_term: MSH3
          term:
            id: hgnc:7326
            label: MSH3
        biological_processes:
        - preferred_term: mismatch repair
          term:
            id: GO:0006298
            label: mismatch repair
          modifier: DYSREGULATED
      selected_evidence:
        snippet: MLH1/MLH3 (MutLγ), a protein complex that can act downstream of MutSβ in MMR, is also
          required for all germ line and somatic expansions.
        supports: SUPPORT
