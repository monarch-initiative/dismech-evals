        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_fmr1_silencing_fmrp_loss_synaptic_dysregulation_model
        hypothesis_label: Canonical FMR1 Silencing / FMRP Loss / Synaptic Translation Dysregulation Model
        status: CANONICAL
        description: Fragile X syndrome (FXS) is caused by CGG-trinucleotide repeat expansion (>200 repeats)
          in the 5' UTR of FMR1 on Xq27.3, leading to hypermethylation and transcriptional silencing of
          FMR1 and loss of its protein product FMRP. FMRP is an RNA-binding protein that represses translation
          of hundreds of synaptic mRNAs at dendrites and is required for the metabotropic glutamate receptor
          (mGluR)-dependent regulation of synaptic protein synthesis. Loss of FMRP produces excessive
          and decoupled local protein synthesis, leading to exaggerated mGluR-LTD, abnormal dendritic
          spine morphology, altered excitatory/inhibitory balance, and the cognitive and behavioral phenotypes
          of FXS. mGluR5 antagonists, GABAergic modulators, and IGF-1 / BDNF / MAPK-pathway perturbation
          studies in Fmr1-knockout mice and human iPSC-derived neurons all corroborate the canonical FMRP-loss
          / dysregulated synaptic-translation model.
        notes: 'Retained as CANONICAL with hub-and-spoke annotation. The 2026 openscientist hypothesis-search
          report (kb/hypotheses/Fragile_X_Syndrome/canonical_fmr1_silencing_fmrp_loss_synaptic_dysregulation_model)
          confirms CGG-expansion → FMR1 silencing → FMRP loss as the central lesion, with dCas9-Tet1 demethylation
          rescuing FMR1 expression and neuronal phenotypes (>5% FMRP restoration sufficient) providing
          the strongest causal proof. FMRP target mRNAs are enriched among de novo mutations in schizophrenia,
          autism, and intellectual disability, validating FMRP as a central translational regulator. Three
          critical refinements: (1) clinical translation failure — multiple Phase 2b mGluR5-antagonist
          trials failed in FXS patients, attributed by expert consensus to trial design but the question
          remains open; (2) mechanistic scope must expand beyond synaptic translation — FMRP has critical
          non-synaptic functions in genome stability (R-loop prevention), chromatin regulation (BRD4),
          astrocyte-autonomous GABA transport, and metabolic programming; (3) phenotypes are age- and
          condition-dependent — enhanced mGluR-LTD is restricted to the P30–60 age window in mice; spine
          density normalizes by adulthood while dendritic complexity progressively worsens. The report
          recommends annotating the model as a hub-and-spoke architecture in which FMRP loss disrupts
          multiple parallel effector arms, with synaptic translation being the best-studied but not the
          sole driver of clinical phenotypes.'
      selected_evidence:
        snippet: Numerous studies have demonstrated that FMRP interacts with both coding and non-coding
          RNAs and represses protein synthesis at dendritic and synaptic locations.
        supports: SUPPORT
