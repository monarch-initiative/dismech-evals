      assertion_type: Discussion
      assertion:
        discussion_id: fxs_nonsynaptic_effector_arms
        prompt: Are the nuclear genome-protection and glutaminase-dependent metabolic consequences of
          FMRP loss independent contributors to the fragile X phenotype, or downstream of, or incidental
          to, the cytoplasmic translational defect?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#FMRP loss of translational repression
        - pathophysiology#Excess translation of chromatin regulators
        rationale: FMRP loss has documented consequences that this entry's pathograph does not connect
          to any phenotype. Patient fibroblasts accumulate twice the double-strand breaks of controls,
          with breaks colocalizing with R-loop forming sequences under replication stress; patient iPSC-derived
          neurons show reduced glutaminolysis and impaired anaplerotic supply to the TCA cycle. Both are
          measured in patient-derived cells, so neither is a model artifact, but neither has been traced
          to a neural or clinical outcome, and no experiment has separated nuclear from cytoplasmic FMRP
          function. Until that is done, the entry curates these as observations rather than as arms of
          the causal chain, and the astrocytic and chromatin arms are curated as nodes only because each
          has an intervention that reverses a downstream phenotype.
        proposed_experiments:
        - experiment_id: fxs_nuclear_vs_cytoplasmic_fmrp_rescue
          name: Compartment-restricted FMRP rescue
          description: Express nuclear-localization-tagged FMRP against nuclear-export-tagged FMRP in
            FMRP-null cells and neurons, then measure protein synthesis rate, mGluR-dependent long-term
            depression, double-strand breaks, R-loops, chromatin marks, and glutaminolysis in each condition.
          would_support:
          - pathophysiology#FMRP loss of translational repression
          supporting_outcome:
          - Cytoplasmic FMRP alone corrects the genome-instability and metabolic readouts, showing they
            are downstream of the translational defect and need no separate arm in the model.
          refuting_outcome:
          - Only nuclear FMRP corrects the genome-instability readouts, establishing an effector arm that
            the synaptic translation formulation cannot account for.
      selected_evidence:
        snippet: We report that the genomes of FXS cells are inherently unstable and accumulate twice
          as many DSBs as those from an unaffected control.
        supports: SUPPORT
    origin:
