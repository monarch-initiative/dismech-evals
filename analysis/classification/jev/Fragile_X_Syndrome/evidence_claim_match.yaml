      assertion_type: Discussion
      assertion:
        discussion_id: fxs_mglur_ltd_age_and_condition_dependence
        prompt: Is exaggerated mGluR-dependent long-term depression a general property of FMRP loss, or
          an artifact of a narrow mouse age window and the pharmacological and metabolic conditions of
          the slice recording?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Synaptic protein synthesis and mGluR signaling dysregulation
        rationale: Exaggerated mGluR-LTD is the signature electrophysiological phenotype of the canonical
          model, but in the Fmr1 knockout mouse it appears only between P30 and P60, and only when NMDA
          receptors are pharmacologically blocked; the same study concludes that hyperactive GluN2B-containing
          NMDA receptors, not the mGluR arm alone, underlie the difference. The phenotype has never been
          demonstrated in human brain tissue or human neuronal preparations. So the entry's mGluR node
          rests on a mouse measurement whose scope is narrower than the claim usually made from it, and
          the translational status of the phenotype is the open question rather than its existence.
        proposed_experiments:
        - experiment_id: fxs_human_mglur_ltd_organoid_test
          name: mGluR-dependent long-term depression in human FXS neural tissue
          description: Test for exaggerated mGluR-dependent long-term depression in patient iPSC-derived
            brain organoids and, where available, acute human cortical tissue, under both standard and
            NMDA-receptor-blocked conditions and across differentiation stages matched to the mouse age
            window.
          would_support:
          - pathophysiology#Synaptic protein synthesis and mGluR signaling dysregulation
          supporting_outcome:
          - Human FXS neural tissue shows exaggerated mGluR-dependent long-term depression without requiring
            NMDA-receptor blockade, confirming the phenotype translates.
          refuting_outcome:
          - No difference in human tissue, or a difference only under the same pharmacological conditions
            required in mouse, confining the phenotype to the model system.
      selected_evidence:
        snippet: As expected, in the presence of APV, we found more LTD in the mouse KO than in WT. This,
          however, was only observed in the p30-60 age group.
        supports: SUPPORT
    origin:
