        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Astrocytic GABA transport dysregulation
        biological_scale: CELLULAR
        description: FMRP is lost in astrocytes as well as neurons. Human FXS iPSC-derived and mouse Fmr1
          knockout astrocytes accumulate GABA and the GABA-synthesizing enzymes GAD65/67, and deleting
          Fmr1 in astrocytes alone reduces inhibitory connectivity and degrades the fidelity of cortical
          temporal processing. This is a non-neuronal effector arm of FMRP loss that the synaptic translation
          branch does not cover. Blocking astrocytic GABA transport in the conditional knockout restores
          parvalbumin expression, EEG responses and exploratory behavior, which is what makes this a mechanism
          rather than a correlation. Evidence is currently one conditional-knockout study with a human
          cellular arm, so the node is model derived and awaits replication.
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: gamma-aminobutyric acid transport
          term:
            id: GO:0015812
            label: gamma-aminobutyric acid transport
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Our astrocyte-specific Fmr1 KO (cKO) mouse model reveals reduced inhibitory connectivity
          and impaired cortical responses to sound.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
