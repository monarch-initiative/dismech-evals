    claim:
      about:
        disease:
          name: Fragile X Syndrome
          disease_term:
            preferred_term: fragile X syndrome
            term:
              id: MONDO:0010383
              label: fragile X syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fxs_mglur5_translation_window
        prompt: Did the mGluR5-antagonist trials fail because the synaptic translation arm does not drive
          the clinical phenotype, or because they treated adolescents and adults, after the developmental
          window, against behavioral rating endpoints with a high placebo response?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Synaptic protein synthesis and mGluR signaling dysregulation
        - mechanistic_hypotheses#canonical_fmr1_silencing_fmrp_loss_synaptic_dysregulation_model
        - clinical_trials#NCT02920892
        rationale: 'The mGluR theory''s one testable clinical prediction has now failed twice over: two
          phase 2b mavoglurant trials in adolescents and adults missed their behavioral primary endpoints,
          and the later FXLEARN phase 3 trial in 3 to 6 year olds missed its primary language outcome.
          Yet mavoglurant did move biobehavioral measures in the same patients, so the drug was reaching
          its target. Nothing published so far separates the two explanations, and the distinction matters
          for what this entry asserts: whether the synaptic translation node is the therapeutically relevant
          driver of the cognitive and behavioral phenotype, or one arm among several. Expert reviews attribute
          the gap to trial design rather than to the model, but that is opinion rather than a result and
          should not be curated as a finding.'
        proposed_experiments:
        - experiment_id: fxs_early_intervention_eeg_endpoint_trial
          name: Early-intervention trial with EEG biomarkers as co-primary endpoints
          description: Randomized controlled trial of an mGluR5 modulator, with or without a GABA-B agonist,
            in children aged 2 to 6, using auditory inter-trial phase coherence and resting gamma power
            as co-primary endpoints alongside adaptive behavioral measures. Both EEG measures are abnormal
            in Fmr1 knockout mice from early postnatal ages and have human counterparts, which makes them
            candidate pharmacodynamic markers for a population in whom behavioral rating scales perform
            poorly.
          would_support:
          - pathophysiology#Synaptic protein synthesis and mGluR signaling dysregulation
          supporting_outcome:
          - EEG measures normalize and developmental trajectory improves, indicating that treatment timing
            rather than model validity explains the earlier failures.
          refuting_outcome:
          - EEG measures normalize while behavior does not, indicating that correcting the synaptic translation
            arm is insufficient and that the parallel effector arms carry a substantial part of the clinical
            phenotype.
      selected_evidence:
        snippet: The study shows that negative modulation of mGluR5 activity improves eye gaze behavior
          and alters sympathetically-driven reactivity to faces in patients with FXS, providing preliminary
          evidence of this drug's impact on behavior in humans with the disorder.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30653533
      reference_title: Effects of mavoglurant on visual attention and pupil reactivity while viewing photographs
        of faces in Fragile X Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: An eye-tracking biobehavioral probe embedded in the same trials did detect a drug effect,
        which is why the endpoint explanation for the failure cannot be dismissed.
