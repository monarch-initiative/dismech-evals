      about:
        disease:
          name: Fragile X Syndrome
          disease_term:
            preferred_term: fragile X syndrome
            term:
              id: MONDO:0010383
              label: fragile X syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Excess translation of chromatin regulators
        biological_scale: MOLECULAR
        description: Most characterized FMRP targets encode synaptic proteins, but FMRP also represses
          transcripts encoding transcriptional and chromatin-associated regulators, among them the BET
          protein BRD4. Losing that repression produces widespread chromatin misregulation and aberrant
          gene expression, and BET inhibition reverses several fragile X phenotypes in mice. This arm
          runs in parallel to the synaptic translation branch and is the best pharmacologically supported
          of the non-synaptic effector arms, but the evidence is currently mouse based and the intermediates
          between chromatin misregulation and circuit dysfunction are unresolved.
        biological_processes:
        - preferred_term: translation
          term:
            id: GO:0006412
            label: translation
          modifier: INCREASED
        - preferred_term: chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Inhibition of Brd4 function alleviated many of the phenotypes associated with FXS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28823556
      reference_title: Excess Translation of Epigenetic Regulators Contributes to Fragile X Syndrome and
        Is Alleviated by Brd4 Inhibition.
      evidence_source: MODEL_ORGANISM
      explanation: Pharmacological reversal through a chromatin reader, rather than through the mGluR
        pathway, is what supports treating this as a causal arm rather than an incidental transcriptional
        signature.
