          supporting_outcome:
          - EEG measures normalize and developmental trajectory improves, indicating that treatment timing
            rather than model validity explains the earlier failures.
          refuting_outcome:
          - EEG measures normalize while behavior does not, indicating that correcting the synaptic translation
            arm is insufficient and that the parallel effector arms carry a substantial part of the clinical
            phenotype.
      selected_evidence:
        snippet: Mavoglurant, a selective metabotropic glutamate receptor subtype-5 antagonist, has shown
          positive neuronal and behavioral effects in preclinical studies, but failed to demonstrate any
          behavioral benefits in two 12-week, randomized, placebo-controlled, double-blind, phase IIb
          studies in adults and adolescents with FXS.
        supports: SUPPORT
