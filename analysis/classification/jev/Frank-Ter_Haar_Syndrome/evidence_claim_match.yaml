          SH3PXD2B mutations, and one mutation-negative individual still had reduced TKS4 protein in dermal
          fibroblasts, implying a shared final mechanism reachable by other genetic routes. A proportion
          of Borrone dermato-cardio-skeletal syndrome is allelic with FTHS, though a third published BDCS
          family was excluded from this locus.'
