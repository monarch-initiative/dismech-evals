        - path: /animal_models/1
          value:
            name: pretzel zebrafish (sh3pxd2b mutant)
            species: Zebrafish
            genotype: sh3pxd2b mutant (pretzel)
            publication: PMID:33234702
            description: A sh3pxd2b mutant zebrafish that develops dermal and musculoskeletal fibrosis
              with contraction-driven deformity, isolating the fibrotic arm of the disease with comparatively
              mild skeletal change.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Fibrotic Soft-Tissue Change
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: Reproduces the dermal and musculoskeletal fibrosis and contractures, but only mild
          skeletal abnormalities, so it models one arm of the disease rather than the whole.
        limitations: The authors note that the discrepancy between the sh3pxd2b and mmp14a/b zebrafish
          mutants implies the spatiotemporal dependence of ECM remodelling on these genes differs between
          fish and humans, so the division of labour seen in this model may not transfer. Skeletal involvement,
          prominent in human disease, is relatively mild here.
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: In zebrafish, ECM remodelling depends on sh3pxd2b and mmp14a/b with a different
            spatiotemporal division than in humans, which is the authors' own explanation for why this
            mutant is fibrosis-dominant while the mmp14a/b mutant is bone-dominant.
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: 'The skeletal dysplasia that defines the human syndrome is effectively outside
            what this model represents: skeletal abnormalities in pretzel are relatively mild, so bone
            phenotypes cannot be read off it and the sibling mmp14a/b mutant carries that arm instead.'
      selected_evidence:
        snippet: In addition to relatively mild skeletal abnormalities, pretzel mutants develop dermal
          and musculoskeletal fibrosis
        supports: SUPPORT
