  1d89ae20e1e16389209b9e902154166748b73bce6cbfdfcfefad8319c42f43b0:
    claim:
      about:
        disease:
          name: Frank-Ter Haar Syndrome
          disease_term:
            preferred_term: Frank-Ter Haar syndrome
            term:
              id: MONDO:0009579
              label: Frank-Ter Haar syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Incomplete Podosome Formation and Failed MT1-MMP Recruitment
        biological_scale: CELLULAR
        description: 'TKS4 is required for podosomes and invadopodia, actin-rich membrane protrusions
          that coordinate pericellular proteolysis with cell migration. Fibroblasts lacking Tks4 form
          only incomplete podosomes, and crucially fail to recruit membrane type-1 matrix metalloproteinase
          (MT1-MMP) to them. The rescue experiments locate the defect precisely: reintroducing Tks4 restores
          both podosome formation and matrix degradation, whereas overexpressing the related Tks5 restores
          podosome formation only. TKS4 therefore carries a non-redundant role in the proteolytic arm
          specifically, which is the step that fails in this disease.'
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        cellular_components:
        - preferred_term: podosome
          term:
            id: GO:0002102
            label: podosome
          modifier: DECREASED
      selected_evidence:
        snippet: Furthermore, in the absence of Tks4, membrane type-1 matrix metalloproteinase (MT1-MMP)
          was not recruited to the incomplete podosomes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19144821
      reference_title: The novel adaptor protein Tks4 (SH3PXD2B) is required for functional podosome formation.
      evidence_source: IN_VITRO
      explanation: Identifies failed MT1-MMP recruitment as the specific molecular consequence, linking
        this disease to the MMP14/collagen-remodelling axis.
