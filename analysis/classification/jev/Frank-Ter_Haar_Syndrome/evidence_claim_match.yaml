        name: TKS4 Adaptor Loss of Function
        biological_scale: MOLECULAR
        description: SH3PXD2B encodes TKS4, a phox homology (PX) and SH3 domain-containing adaptor protein
          and Src substrate. Homozygosity mapping across FTHS families localised the disease to 5q35.1,
          and a homozygous deletion in one family mapped exactly to the smallest region of overlapping
          homozygosity, which contains SH3PXD2B alone. Patient fibroblasts from Borrone-phenotype families
          show complete loss of the protein on western blot, confirming that the molecular lesion is absence
          of functional TKS4.
        gene:
          preferred_term: SH3PXD2B
          term:
            id: hgnc:29242
            label: SH3PXD2B
      selected_evidence:
        snippet: For one family, a homozygous deletion mapped exactly to the smallest region of overlapping
          homozygosity, which contains a single gene, SH3PXD2B.
        supports: SUPPORT
