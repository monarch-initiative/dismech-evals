              label: Frank-Ter Haar syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Pericellular Matrix Remodelling
        biological_scale: TISSUE
        description: Without podosome-localised proteolysis, cells cannot degrade and remodel the extracellular
          matrix immediately around them. Extracellular matrix therefore accumulates rather than turning
          over, which is the proposed explanation for the progressive coarsening of facial features and
          for glaucoma refractory to treatment. This places FTHS within the defective collagen remodelling
          spectrum, whose other members carry MMP14 lesions — the protease that TKS4 fails to deliver.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        biological_processes:
        - preferred_term: extracellular matrix disassembly
          term:
            id: GO:0022617
            label: extracellular matrix disassembly
          modifier: DECREASED
        - preferred_term: cell migration
          term:
            id: GO:0016477
            label: cell migration
          modifier: DECREASED
      selected_evidence:
        snippet: we hypothesize that the alteration of podosomes function could lead to a reduction of
          the extracellular matrix degradation and accumulation of the latter in the extracellular space,
          which might explain the coarsening of the facial features and the severe refractory glaucoma
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
