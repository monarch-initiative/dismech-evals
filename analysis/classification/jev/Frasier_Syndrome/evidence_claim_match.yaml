      assertion_type: Discussion
      assertion:
        discussion_id: nosology_frasier_denys_drash_continuum
        prompt: Should Frasier syndrome be curated as a disease at all, given that the current GeneReviews
          chapter has retired it as a clinical designation in favour of a single WT1 disorder continuum?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#WT1 Intron 9 Donor Splice Site Variants
        - differential_diagnoses#Denys-Drash syndrome
        rationale: The entry is curated because MONDO carries the term, the historical literature is indexed
          under it, and the intron 9 splice mechanism is genuinely distinct in kind from the dominant
          negative zinc finger missense lesion at the other pole. The counter-argument is that the two
          poles differ quantitatively along one axis rather than being separate diseases, and that a continuum
          is the better model. Both readings are represented in the literature and the question is not
          settled here.
      selected_evidence:
        snippet: those designations are now recognized to be part of a phenotypic continuum and are no
          longer clinically helpful
        supports: SUPPORT
    origin:
