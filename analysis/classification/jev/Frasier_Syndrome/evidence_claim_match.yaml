      assertion_type: Treatment
      assertion:
        name: Kidney Transplantation
        description: 'Definitive treatment for the end stage kidney disease, and reported to be effective
          here. A mechanistic expectation is often stated alongside it: the lesion is genetic and intrinsic
          to the native podocyte, so a graft does not carry the defect, unlike primary FSGS where post-transplant
          recurrence is a major concern. That expectation is not directly evidenced in the sources cited
          here, which report graft survival but do not attribute the graft losses, so it is given as rationale
          rather than as an outcome claim.'
        treatment_term:
          preferred_term: Kidney Transplantation
          term:
            id: NCIT:C15265
            label: Kidney Transplantation
      selected_evidence:
        snippet: During a median time of follow-up of 9 years (range 2–28 years), there were 2 allograft
          losses after 7 and 10 years and no evidence of post-transplant malignancy.
        supports: SUPPORT
