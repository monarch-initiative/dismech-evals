        description: The other pole of the WT1 continuum. Denys-Drash syndrome arises from dominant negative
          zinc finger missense variants and presents with diffuse mesangial sclerosis, early kidney failure
          and a high risk of Wilms tumor.
        distinguishing_features:
        - Focal segmental glomerulosclerosis with kidney failure in adolescence or early adulthood favors
          Frasier syndrome.
        - Diffuse mesangial sclerosis with early kidney failure favors Denys-Drash syndrome.
        - An intron 9 donor splice site variant favors Frasier syndrome; a zinc finger missense variant
          favors Denys-Drash syndrome.
        - Absence of Wilms tumor on extended follow-up favors Frasier syndrome.
      selected_evidence:
        snippet: No case of Wilms' tumour has been reported, even in patients with extended follow-up.
        supports: SUPPORT
