          modifier: DECREASED
          term:
            id: hgnc:10892
            label: SIX6
      selected_evidence:
        snippet: 14q22q23 microdeletion syndrome, also called Frias syndrome, is an extremely rare partial
          deletion of the long arm of chromosome 14 characterized by the anomalies of the pituitary gland,
          eyes, and hand/foot.
        supports: SUPPORT
