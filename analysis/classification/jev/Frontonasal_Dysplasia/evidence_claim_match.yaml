  5170634f2941c308cc368a94cc3d9b8e7b173a35ab5da8c396c748bc3f39d2ab:
    claim:
      about:
        disease:
          name: Frontonasal Dysplasia
          disease_term:
            preferred_term: frontonasal dysplasia
            term:
              id: MONDO:0016643
              label: frontonasal dysplasia
        context: []
      assertion_type: Subtype
      assertion:
        name: Acromelic FND
        display_name: Acromelic Frontonasal Dysostosis (ZSWIM6)
        description: 'Acromelic frontonasal dysostosis is the ZSWIM6-related subtype, and it differs from
          the three ALX subtypes above on three axes rather than one. It is autosomal dominant and usually
          sporadic, with the variant de novo in the probands of the founding cohort, where the ALX subtypes
          are recessive; it adds limb malformations - preaxial polydactyly of the feet, tibial hypoplasia
          or aplasia, clubfoot - to the frontonasal malformation; and a single recurrent missense substitution
          accounts for the reported cases rather than a spectrum of loss-of-function alleles. Parental
          somatic mosaicism has been demonstrated and explains mildly affected transmitting parents.

          ZSWIM6 is bound here on the subtype row but deliberately not given a `genetic:` record wired
          into the pathograph. The protein''s molecular function is not established, patient-cell data
          are only suggestive of Hedgehog pathway activation, and the later case series states that a
          molecular-developmental explanation for the AFND malformation pattern is lacking. Adding a mechanism
          node for it would assert a step none of those sources supports; the ALX neural-crest cascade
          modelled below is not that mechanism.

          '
        genes:
        - preferred_term: ZSWIM6
          term:
            id: hgnc:29316
            label: ZSWIM6
        subtype_term:
          preferred_term: acromelic frontonasal dysostosis
          term:
            id: MONDO:0011359
            label: acromelic frontonasal dysostosis
        inheritance:
        - name: Autosomal dominant de novo ZSWIM6 inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: 'Heterozygous and de novo in origin in the reported probands, with parental somatic
            mosaicism accounting for mildly affected transmitting parents.

            '
      selected_evidence:
        snippet: A single recurrent heterozygous missense substitution in ZSWIM6, encoding a protein of
          unknown function, was previously shown to underlie this disorder in four unrelated cases.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26706854
      reference_title: 'Acromelic frontonasal dysostosis and ZSWIM6 mutation: phenotypic spectrum and
        mosaicism.'
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: Confirms a single recurrent substitution as the molecular cause and records that the
        protein's function was unknown; graded BACKGROUND because this sentence restates the earlier report
        rather than this paper's own result.
