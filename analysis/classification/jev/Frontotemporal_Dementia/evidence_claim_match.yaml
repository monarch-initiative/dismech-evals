          preferred_term: GRN-related frontotemporal lobar degeneration with Tdp43 inclusions
          term:
            id: MONDO:0011842
            label: GRN-related frontotemporal lobar degeneration with Tdp43 inclusions
        description: 'The GRN-defined molecular subtype, and like FTD3 a molecular rather than a clinical
          one: it is defined by progranulin haploinsufficiency and TDP-43 inclusions, not by a presenting
          syndrome. Its presentation is variable - behavioural, language or a mix - which is why it sits
          beside this entry''s clinical rows rather than replacing one of them. The nonfluent/agrammatic
          row above is where the language presentation of this genotype is recorded and it binds the same
          gene; the two rows cut the same patients along different axes, the genotype and the syndrome,
          and neither is a parent of the other. Mechanistically the lesion is loss of one functional GRN
          allele: patient-derived microglia carrying pathogenic or likely pathogenic GRN variants lose
          their homeostatic signature, show impaired phagocytosis, and accumulate cytoplasmic TDP-43 with
          lysosomal abnormalities, which places this genotype on this entry''s TDP-43 Proteinopathy node
          where GRN is already wired.

          '
        genes:
        - preferred_term: GRN
          term:
            id: hgnc:4601
            label: GRN
      selected_evidence:
        snippet: Progranulin (PGRN) haploinsufficiency due to progranulin gene (GRN) variants can cause
          frontotemporal dementia (FTD) with aberrant TAR DNA-binding protein 43 (TDP-43) accumulation.
        supports: SUPPORT
