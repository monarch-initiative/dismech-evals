  7121f1151ea5b9eb4f9240b25e44396185387ff4891ccd80b7b4bbed9c0dd071:
    claim:
      about:
        disease:
          name: Frontotemporal Dementia
          disease_term:
            preferred_term: frontotemporal dementia
            term:
              id: MONDO:0017276
              label: frontotemporal dementia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CHMP2B C-Truncation and Aberrant Endosome Formation
        description: 'The CHMP2B lesion acts on a different compartment from the three proteinopathies
          above. The chromosome 3 splice-acceptor mutation and an analogous nonsense mutation both predict
          a C-truncated CHMP2B, and expressing either in neuroblastoma cells produces large aberrant endosomal
          structures, so the proposed mechanism is disturbed endosome function in an ESCRT-III subunit
          rather than aggregation of a cytoplasmic protein. The pathology that follows is ubiquitin- and
          p62-positive and TDP-43-negative, which is why FTD-3 was reclassified as FTLD with ubiquitin-positive
          inclusions.

          '
        biological_scale: CELLULAR
        genes:
        - preferred_term: CHMP2B
          term:
            id: hgnc:24537
            label: CHMP2B
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: endosome organization
          term:
            id: GO:0007032
            label: endosome organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Overexpression of Belgian p.Gln165X in human neuroblastoma SK-N-SH cells showed the formation
          of large, aberrant endosomal structures that were highly similar to those observed for Danish
          p.Met178ValfsX2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
