        context: []
      assertion_type: Diagnosis
      assertion:
        name: Mini-Mental State Examination
        description: Widely used cognitive screening instrument, recorded here because the frontotemporal
          dementia literature compares the MoCA against it and uses it to track severity. It is less sensitive
          in frontotemporal dementia than the MoCA, and in primary progressive aphasia its dependence
          on language overestimates dementia severity.
        notes: 'Copyright © Vicki King for Psychological Assessment Resources. Used with permission. No
          reference range is recorded: no cited source states a frontotemporal dementia cut-off or severity
          scheme for the MMSE. A PubMed search for mini-mental[ti] frontotemporal[ti] returned comparisons
          with the MoCA and studies of MMSE change over time, none stating a cut-off, and MMSE[ti] frontotemporal[ti]
          cut-off returned no records. The instrument''s items are not reproduced in this entry.'
        measurements:
        - preferred_term: MMSE
          term:
            id: LOINC:72107-6
            label: Mini-Mental State Examination [MMSE]
      selected_evidence:
        snippet: Results suggest that the MMSE score, heavily dependent on language skill, overestimates
          dementia severity in PPA patients. However, the score may be a more accurate measure of functional
          impairment in bvFTD due to the influence of their executive function and attentional deficits
          on MMSE performance.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/1
      context_paths:
