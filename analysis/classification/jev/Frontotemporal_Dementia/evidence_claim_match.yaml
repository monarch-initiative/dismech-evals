      assertion:
        name: Montreal Cognitive Assessment
        description: Brief cognitive screening instrument. A validation study in behavioral-variant frontotemporal
          dementia found it more accurate than the MMSE for that syndrome, and in genetic frontotemporal
          dementia cohorts it distinguished presymptomatic pathogenic variant carriers from controls where
          the MMSE did not.
        notes: Copyright © Tina Brosseau for Center for Diagnosis & Research on Alzheimer's disease (CEDRA).
          Used with permission. The instrument is bound at its LOINC panel code and the cut-off at its
          total-score code. The instrument's items are not reproduced in this entry; only published thresholds
          are recorded. The genetic frontotemporal dementia study (PMID:39951678) reports group medians
          and discriminative accuracy but no cut-off, so it carries no range.
        measurements:
        - preferred_term: MoCA
          term:
            id: LOINC:72133-2
            label: Montreal Cognitive Assessment [MoCA]
        reference_ranges:
        - loinc_term:
            id: LOINC:72172-0
            label: Total score [MoCA]
          unit: '{score}'
          population: MoCA validation study for behavioral-variant frontotemporal dementia, three matched
            subgroups of 50 (bv-FTD, Alzheimer disease, healthy adults)
          notes: The abstract states the cut-off as "With a cutoff below 17 points"; a score below 17
            falls in the positive band, which the half-open bands reproduce exactly. The cut-off was derived
            in the behavioral variant only.
          interpretation_bands:
          - name: Below 17 (screen positive for bv-FTD)
            upper_bound: 17
            unit: '{score}'
            abnormal_flag: LOW
          - name: 17 or above
            lower_bound: 17
            unit: '{score}'
            abnormal_flag: NORMAL
      selected_evidence:
        snippet: The MoCA is a sensitive and accurate instrument for screening the patients with bv-FTD
          and represents a better option than the MMSE.
        supports: SUPPORT
