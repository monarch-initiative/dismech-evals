      assertion_type: Pathophysiology
      assertion:
        name: FUS Proteinopathy
        description: 'A minority of FTD cases are tau- and TDP-43-negative. Within that heterogeneous
          group (which also includes CHMP2B-associated FTLD-UPS), the cases whose inclusions are immunoreactive
          for FUS (fused in sarcoma) constitute FTLD-FUS, completing the TDP-43 / tau / FUS molecular
          triad underlying FTD.

          '
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: the discovery that the pathological changes in atypical FTLD with ubiquitinated inclusions,
          neuronal intermediate filament inclusion disease, and basophilic inclusion body disease are
          immunoreactive for the fused in sarcoma (FUS) protein, resulting in the creation of a new molecular
          subgroup (FTLD-FUS)
        supports: SUPPORT
