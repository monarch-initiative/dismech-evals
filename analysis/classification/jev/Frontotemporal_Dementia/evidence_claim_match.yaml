          term:
            id: MONDO:0010857
            label: semantic dementia
        description: 'A language-predominant FTD syndrome characterized by progressive loss of semantic
          knowledge (anomia, impaired word comprehension, surface dyslexia) with anterior temporal lobe
          degeneration. One of the three canonical PPA variants (with nonfluent/agrammatic and logopenic)
          defined by international consensus criteria. Typically sporadic with underlying TDP-43 type
          C pathology, showing weaker association with the three major FTD genes than the behavioral or
          nonfluent variants.

          '
      selected_evidence:
        snippet: Criteria for the 3 variants of PPA--nonfluent/agrammatic, semantic, and logopenic--were
          developed by an international group of PPA investigators who convened on 3 occasions to operationalize
          earlier published clinical descriptions for PPA subtypes.
        supports: SUPPORT
