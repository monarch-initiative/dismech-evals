            term:
              id: MONDO:0017276
              label: frontotemporal dementia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TDP-43 Proteinopathy
        description: 'TAR DNA-binding protein of 43 kDa (TDP-43) is the main ubiquitinated protein in
          tau-negative frontotemporal lobar degeneration (FTLD-TDP), accounting for over 50% of FTD cases.
          TDP-43 is typically a nuclear protein, and its aggregation and cytoplasmic translocation are
          thought to represent major pathogenic steps. The abnormal accumulation leads to neuronal dysfunction
          and death.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: TDP-43 is typically a nuclear protein, and its aggregation and cytoplasmic translocation
          are thought to represent major steps in the pathogenesis of FTLD due to TDP-43 proteinopathy
          (FTLD-TDP).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19664364
      reference_title: TDP-43 and frontotemporal dementia.
      explanation: This confirms that TDP-43 aggregation and mislocalization are central to the pathogenesis
        of FTLD-TDP, a major subtype of frontotemporal dementia.
