        subtype_term:
          preferred_term: behavioral variant of frontotemporal dementia
          term:
            id: MONDO:0017160
            label: behavioral variant of frontotemporal dementia
        description: 'The most common clinical presentation of FTD, characterized by progressive behavioral
          and personality change with frontal-lobe-predominant atrophy. Preferentially associated with
          MAPT mutations, which show earlier onset, prominent disinhibition, stereotyped behaviors, and
          temporal-predominant atrophy; also a common presentation in C9orf72 carriers, who additionally
          show psychotic symptoms and paradoxical social warmth.

          '
        genes:
        - preferred_term: MAPT
          term:
            id: hgnc:6893
            label: MAPT
        - preferred_term: C9orf72
          term:
            id: hgnc:28337
            label: C9orf72
      selected_evidence:
        snippet: MAPT patients were younger than other groups, and showed more frequent behavioural disinhibition,
          repetitive and stereotyped behaviours, semantic impairment and temporal predominance of atrophy.
        supports: SUPPORT
