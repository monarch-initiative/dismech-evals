  d5363446d06ed706bbcc1a7dd1e859eebfffd4568f38a5c949ab9374a7a08351:
    claim:
      about:
        disease:
          name: Frontotemporal Dementia
          disease_term:
            preferred_term: frontotemporal dementia
            term:
              id: MONDO:0017276
              label: frontotemporal dementia
        context: []
      assertion_type: Biochemical
      assertion:
        name: NEFL-C1QL2 Projection Neuron Plasma Proteomic Age Gap
        biomarker_term:
          preferred_term: NEFL-C1QL2 projection neuron plasma proteomic aging clock (age gap)
          term:
            id: NCIT:C97139
            label: Proteomic Profile
        presence: Elevated
        context: Blood-based cell-type-specific aging clock. Plasma proteins are mapped to their putative
          cell of origin using Human Protein Atlas single-cell transcriptomic data, and a machine-learning
          model estimates that cell type's biological age; the age gap is the difference between that
          estimate and chronological age. "Extreme" agers are those in the upper tail of the age-gap distribution.
        cell_types:
        - preferred_term: NEFL-C1QL2 projection neuron
          term:
            id: CL:0000540
            label: neuron
        notes: Read the cell-type label carefully. The Human Protein Atlas catalogues this population
          as "horizontal cell", a retinal interneuron type; the authors renamed it NEFL-C1QL2 projection
          neuron because the two defining transcripts point at a projection-neuron identity rather than
          a retinal one. Curated under the authors' relabelling, with CL:0000540 neuron as the only defensible
          binding - there is no CL term for this population, and binding it to the retinal horizontal
          cell would import an assignment the authors explicitly rejected. This makes the entry a worked
          example of the probabilistic protein-to-cell-type mapping being the weakest link in these clocks.
          It was the strongest cellular-aging predictor of incident frontotemporal dementia (HR 3.03,
          95% CI 2.47-3.72), followed by microglia (HR 2.84, 95% CI 2.33-3.47), and also the strongest
          cross-sectional association with prevalent FTD in the GNPC cohort (n = 199 FTD cases).
        readouts:
        - target: Neuronal Death
          relationship: PREDICTS
          direction: POSITIVE
          endpoint_context: PROGNOSTIC
          interpretation: An elevated NEFL-C1QL2 projection neuron age gap predicts incident frontotemporal
            dementia. The NEFL component is an established axonal-injury marker in FTD, which is what
            anchors the readout to the neurodegeneration arm rather than leaving it an unanchored risk
            score.
        - target: Frontal and Temporal Lobe Atrophy
          relationship: CORRELATES_WITH
          direction: POSITIVE
          endpoint_context: PROGNOSTIC
          interpretation: C1QL2 is enriched in the temporo-limbic structures that frontotemporal lobar
            degeneration targets, which is the authors' basis for reading this signature against the regional
            atrophy arm. This is a regional-expression argument, not a measured correlation with imaged
            atrophy.
      selected_evidence:
        snippet: extreme aging in NEFL-C1QL2 projection neurons demonstrated the strongest prognostic
          value
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42297981
      reference_title: Plasma proteomic signatures of cellular aging predict human disease.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes this signature as the leading cellular-aging predictor of incident frontotemporal
        dementia among the cell types tested.
