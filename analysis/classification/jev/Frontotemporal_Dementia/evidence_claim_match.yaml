        description: 'The chromosome 3-linked form, defined by heterozygous CHMP2B variants and originally
          delineated in a large Danish pedigree. It is a molecular subtype rather than a clinical one,
          and it is the reason this entry''s molecular classification is not exhausted by tau, TDP-43
          and FUS: its inclusions are ubiquitin- and p62-positive but TDP-43-negative, which is the FTLD-UPS
          class named in the FUS Proteinopathy node''s description. Presentation is usually FTD, with
          ALS features in a subset, and MONDO files the class under both behavioral variant FTD and familial
          ALS; it is kept here rather than at the ALS entry because the dementia phenotype is the usual
          one.

