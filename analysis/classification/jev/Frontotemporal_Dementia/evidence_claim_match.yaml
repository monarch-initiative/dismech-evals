        snippet: CHMP2B-related frontotemporal dementia (FTD)-amyotrophic lateral sclerosis (ALS) is characterized
          most frequently by FTD with subtle personality changes and slowly progressive behavioral changes,
          dysexecutive syndrome, and language disturbances.
        supports: SUPPORT
