        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Gluconeogenic Substrate Accumulation and Energy Deficit
        biological_scale: ORGANISM
        conforms_to: metabolic_intoxication_decompensation#Toxic Metabolite Accumulation and Energy Deficit
        role: amplifier
        description: Substrates that would normally be consumed by gluconeogenesis build up behind the
          block. Lactate accumulates and drives a high-anion-gap lactic acidosis; glycerol and glycerol-3-phosphate
          spill into urine (and can produce spurious pseudo-hypertriglyceridemia on glycerol-blanked triglyceride
          assays); urate rises. A catabolic stress — fever, fasting, reduced intake, vomiting, infection,
