            label: corneal endothelium
        notes: No biological_processes annotation is attached, and the reason is terminological. The process
          this node describes is endothelial-to-mesenchymal transition, and GO carries no general term
          for it. Searching GO for "EndMT", "EndoMT", "endothelial mesenchymal", "endothelial to mesenchymal
          transition" and "endothelial cell to mesenchymal cell transition" returns only GO:0140074 cardiac
          endothelial to mesenchymal transition and its three regulation terms. GO:0140074 is defined
          over cardiac endothelium and endocardial cells, so binding it to the corneal endothelium would
          assert the wrong anatomy. An earlier draft used GO:0001837 epithelial to mesenchymal transition,
          which asserts an epithelial substrate; the corneal endothelial cell annotated here is not epithelium,
          so that term put the node in contradiction with its own cell annotation. The cited sources call
          the event EMT, but they are describing corneal endothelial cells, which is the usage GO:0140074
          exists to separate. A curator who has a general EndMT term, or who obtains one from GO, should
          bind it here.
