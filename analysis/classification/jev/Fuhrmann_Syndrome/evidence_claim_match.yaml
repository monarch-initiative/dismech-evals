        snippet: The results suggest that a partial loss of WNT7A function causes Fuhrmann syndrome (and
          a phenotype similar to mouse Wnt7a knockout), whereas the more-severe limb truncation phenotypes
          observed in Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome result from null mutations
          (and cause a phenotype similar to mouse Shh knockout).
