      assertion_type: Pathophysiology
      assertion:
        name: Partial Loss of WNT7A Function
        biological_scale: MOLECULAR
        description: 'Homozygous missense WNT7A variants reduce, but do not abolish, the activity of the
          secreted dorsal-ectoderm signal. The residual activity is what separates Fuhrmann syndrome from
          AARRS: null alleles of the same gene produce the much more severe phocomelia phenotype.'
        genetic_context:
          gene:
            preferred_term: WNT7A
            term:
              id: hgnc:12786
              label: WNT7A
          allele_type: missense
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The results suggest that a partial loss of WNT7A function causes Fuhrmann syndrome (and
          a phenotype similar to mouse Wnt7a knockout), whereas the more-severe limb truncation phenotypes
          observed in Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome result from null mutations
          (and cause a phenotype similar to mouse Shh knockout).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
