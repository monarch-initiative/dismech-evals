  f0fd2a60fb83c2284594d19d6cd1b801da7d0ae15031bc2b1473ac31cdda6060:
    claim:
      about:
        disease:
          name: Fuhrmann Syndrome
          disease_term:
            preferred_term: Fuhrmann syndrome
            term:
              id: MONDO:0009232
              label: Fuhrmann syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Postaxial Limb Deficiency
        biological_scale: ORGANISM
        description: 'Absence or hypoplasia of the fibula with oligodactyly — the posterior skeletal elements
          this branch accounts for. The ulna, the postaxial forearm element and serial homolog of the
          fibula, fits the same branch by the same logic, but the only source naming it, PMID:21716096,
          is a case report titled "Hypoplasia/aplasia of pelvis, femora, fibulae, ulna, digits and nails:
          Fuhrmann syndrome without WNT7A mutations" — it names the ulna and pelvis outright, but in a
          WNT7A-negative patient, so attributing the ulnar phenotype to this branch is a serial-homology
          inference, not an observation in a WNT7A-mutant patient. Femoral bowing is deliberately not
          included: it is a proximal long-bone deformity, not a posterior element, and this branch does
          not explain it.'
      selected_evidence:
        snippet: Fuhrmann syndrome and the Al-Awadi/Raas-Rothschild/Schinzel phocomelia syndrome are considered
          to be distinct limb-malformation disorders characterized by various degrees of limb aplasia/hypoplasia
          and joint dysplasia in humans.
        supports: SUPPORT
    origin:
