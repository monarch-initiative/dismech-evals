      assertion_type: Pathophysiology
      assertion:
        name: Impaired Dorsoventral Patterning of the Limb
        biological_scale: TISSUE
        description: WNT7A from the dorsal ectoderm induces and maintains the LIM homeodomain transcription
          factor LMX1 in dorsal limb mesenchyme, which specifies dorsal identity. Weakened induction produces
          the dorsal-structure defects, including nail hypoplasia.
        biological_processes:
        - preferred_term: Dorsal/ventral pattern formation
          term:
            id: GO:0009953
            label: dorsal/ventral pattern formation
          modifier: DECREASED
      selected_evidence:
        snippet: Thus, the dorsalization of limb mesoderm appears to involve the WNT7a-mediated induction
          of Lmx1 in limb mesenchymal cells.
        supports: SUPPORT
    origin:
