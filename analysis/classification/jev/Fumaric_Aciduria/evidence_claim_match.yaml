      assertion_type: Discussion
      assertion:
        discussion_id: fumarate_oncometabolite_vs_energy_deficit
        kind: KNOWLEDGE_GAP
        prompt: Does the oncometabolite activity of accumulated fumarate (inhibition of alpha-ketoglutarate-dependent
          dioxygenases, pseudohypoxia via HIF stabilization) contribute to the neurological and developmental
          phenotype of recessive fumaric aciduria, or is the phenotype driven by energy-metabolism failure
          alone?
        attaches_to:
        - pathophysiology#Fumarate Accumulation
        rationale: Fumarate is a well-established oncometabolite in heterozygous FH-related tumorigenesis,
          but its contribution to the recessive neurometabolic phenotype is unresolved. In one study the
          nuclear translocation of HIF-1alpha in patient fibroblasts was similar to controls, arguing
          against pseudohypoxic signaling as the driver in those cells, yet the developing brain was not
          assessed.
      selected_evidence:
        snippet: The nuclear translocation of hypoxia-inducible factor (HIF)-1alpha (HIF1A) in cultured
          fibroblasts was similar to controls.
        supports: SUPPORT
