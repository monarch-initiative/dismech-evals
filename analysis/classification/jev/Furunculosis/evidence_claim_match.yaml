      assertion_type: Pathophysiology
      assertion:
        name: Staphylococcal Peptidoglycan Cross-Linking (Beta-Lactam Target)
        description: Staphylococcus aureus builds and maintains its peptidoglycan cell wall by penicillin-binding
          protein (PBP) transpeptidase cross-linking. This essential, bacteria-specific reaction is the
          target of the anti-staphylococcal beta-lactams (e.g. oxacillin) used for methicillin-sensitive
          S. aureus (MSSA) furunculosis; acylation of the PBP active site halts cross-linking and is bactericidal.
        role: therapeutic_vulnerability
        conforms_to: bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding
          Proteins
        biological_processes:
        - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
          term:
            id: GO:0009273
            label: peptidoglycan-based cell wall biogenesis
      selected_evidence:
        snippet: although glycan chain polymerization occurs in the absence of transpeptidation (for example,
          in the presence of penicillin), efficient transpeptidation requires ongoing GTase reactions
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
