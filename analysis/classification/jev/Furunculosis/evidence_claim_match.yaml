      assertion_type: Pathophysiology
      assertion:
        name: Methicillin Resistance via Low-Affinity PBP2a (MRSA)
        description: Methicillin-resistant S. aureus (MRSA) acquires the mecA-encoded penicillin-binding
          protein PBP2a, which retains transpeptidase activity but has very low affinity for beta-lactams,
          so cross-linking continues despite drug exposure. This protects the cross-linking step and is
          why MRSA furunculosis is treated with vancomycin rather than an anti-staphylococcal beta-lactam
          — the clearest case of resistance mechanism dictating drug choice.
        role: adaptive_escape
        conforms_to: bacterial_cell_wall_synthesis_inhibition#Acquired Resistance and Drug Inactivation
        biological_processes:
        - preferred_term: Response to Antibiotic
          term:
            id: GO:0046677
            label: response to antibiotic
      selected_evidence:
        snippet: the mechanisms by which bacteria are either intrinsically resistant or acquire resistance
          to antibiotics, including the prevention of access to drug targets, changes in the structure
          and protection of antibiotic targets and the direct modification or inactivation of antibiotics.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25435309
      reference_title: Molecular mechanisms of antibiotic resistance.
      evidence_source: OTHER
      explanation: Review of the resistance mechanisms encoded here, including target alteration (acquisition
        of low-affinity PBP2a). Evidence source is OTHER as this is a review article.
