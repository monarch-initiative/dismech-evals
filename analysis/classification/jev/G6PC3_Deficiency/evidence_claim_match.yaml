      assertion_type: Biochemical
      assertion:
        name: Absolute neutrophil count
        presence: DECREASED
        context: The absolute neutrophil count (ANC) is the defining laboratory measurement of the disease.
          In G6PC3 deficiency the ANC is typically in the severe band (<500/uL) at diagnosis and may fluctuate
          only marginally, in contrast to the regular oscillation of cyclic neutropenia. It is also the
          response variable for both G-CSF and empagliflozin therapy.
        biomarker_term:
          preferred_term: absolute neutrophil count
        readouts:
        - target: Endoplasmic reticulum stress and increased myeloid apoptosis
          relationship: READOUT_OF
          direction: NEGATIVE
          endpoint_context: DIAGNOSTIC
          interpretation: A falling ANC reports the net loss of maturing granulocytic precursors to apoptosis;
            ANC recovery is the standard endpoint for treatments aimed at the upstream metabolic lesion.
        reference_ranges:
        - loinc_term:
            id: LOINC:751-8
            label: Neutrophils [#/volume] in Blood by Automated count
          lower_bound: 1500.0
          unit: cells/uL
          population: adults
          notes: 'One-sided interval: chronic neutropenia is diagnosed below 1,500/uL, so only a lower
            bound is given. Paediatric lower limits are age-dependent and lower in infancy and in individuals
            of African ancestry (benign ethnic neutropenia); this interval is the adult chronic-neutropenia
            threshold.'
          interpretation_bands:
          - name: Normal
            lower_bound: 1500.0
            unit: cells/uL
            abnormal_flag: NORMAL
            interpretation: ANC at or above 1,500/uL is not neutropenic.
          - name: Mild neutropenia
            lower_bound: 1000.0
            upper_bound: 1500.0
            unit: cells/uL
            abnormal_flag: LOW
            severity: MILD
            phenotype_term:
              preferred_term: Neutropenia
              term:
                id: HP:0001875
                label: Decreased total neutrophil count
            interpretation: Mild neutropenia; infection risk is close to background. Some G6PC3 patients
              sit in this band and can be managed with prophylactic antibiotics alone.
          - name: Moderate neutropenia
            lower_bound: 500.0
            upper_bound: 1000.0
            unit: cells/uL
            abnormal_flag: LOW
            severity: MODERATE
            phenotype_term:
              preferred_term: Neutropenia
              term:
                id: HP:0001875
                label: Decreased total neutrophil count
            interpretation: Moderate neutropenia with intermediate infection risk.
          - name: Severe neutropenia
            upper_bound: 500.0
            unit: cells/uL
            abnormal_flag: CRITICAL_LOW
            severity: SEVERE
            phenotype_term:
              preferred_term: Severe congenital neutropenia
              term:
