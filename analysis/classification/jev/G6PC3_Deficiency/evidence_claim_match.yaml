      assertion:
        target: Neutrophil glycosylation and oxidase dysfunction
        description: The same loss of ER glucose-6-phosphatase activity is accompanied by a major defect
          of neutrophil N- and O-glycosylation, including hypoglycosylation of the NADPH-oxidase component
          gp91phox. This is the second, parallel branch out of the primary enzyme defect. Whether it is
          a genuinely independent consequence of the ER-luminal lesion or is itself downstream of reduced
          glucose-6-phosphate availability starving nucleotide-sugar synthesis is unresolved (see discussion
          gap_g6pc3_glycosylation_vs_metabolite).
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - Reduced ER-luminal glucose-6-phosphate handling.
        - Impaired nucleotide-sugar availability for glycan assembly.
        - Truncated neutrophil N- and O-glycan structures.
      selected_evidence:
        snippet: hypo-glycosylation of gp91(phox), the electron-transporting component of the NADPH oxidase,
          in all of these patients.
        supports: SUPPORT
