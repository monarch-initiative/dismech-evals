        context: []
      assertion_type: Treatment
      assertion:
        name: Granulocyte colony-stimulating factor (G-CSF)
        description: 'Recombinant G-CSF is the established first-line therapy. It raises the neutrophil
          count, prevents infection, and improves quality of life. It does NOT address the upstream metabolic
          lesion: it drives residual granulopoiesis harder rather than removing the 1,5-AG6P hexokinase
          block, so neutrophil function and the IBD phenotype may remain impaired, and some patients fail
          to respond even at large doses.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: granulocyte colony-stimulating factor therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: recombinant granulocyte colony-stimulating factor
            term:
              id: NCIT:C1287
              label: Recombinant Granulocyte Colony-Stimulating Factor
        target_phenotypes:
        - preferred_term: Severe congenital neutropenia
          term:
            id: HP:0001875
            label: Decreased total neutrophil count
        notes: 'Some patients fail to respond to G-CSF even in large doses, and mildly affected patients
          may be managed with prophylactic antibiotics alone (PMID:23758768). G-CSF corrects the neutrophil
          count but not the qualitative defect, because it drives residual granulopoiesis harder rather
          than relieving the upstream 1,5-AG6P hexokinase block — which is also why it is not protein
          replacement (patients are not G-CSF deficient). therapeutic_modality is therefore OTHER; see
          issue #7457 for the enum gap.'
      selected_evidence:
        snippet: Treatment with G-CSF leads to improvement in neutrophil numbers, prevents infections
          and improves quality of life.
        supports: SUPPORT
