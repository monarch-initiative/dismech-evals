  1d7d70fa96d726d7765dde4c9138944737f10bd45bf2ed3753c242d235f42b1e:
    claim:
      about:
        disease:
          name: G6PC3 Deficiency
          disease_term:
            preferred_term: G6PC3 deficiency (severe congenital neutropenia type 4)
            term:
              id: MONDO:0012930
              label: autosomal recessive severe congenital neutropenia due to G6PC3 deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Empagliflozin (SGLT2 inhibitor) — substrate-reduction repurposing
        description: 'Empagliflozin, an SGLT2 inhibitor licensed for type 2 diabetes, is repurposed here
          as a substrate-reduction therapy. Blocking renal reabsorption of 1,5-anhydroglucitol lowers
          the plasma 1,5-AG pool, which in turn lowers intra-neutrophil 1,5-AG6P and relieves the hexokinase
          block — treating the mechanism rather than compensating for its output. This is the same repurposing
          that works in G6PT/SLC37A4 deficiency (glycogen storage disease type Ib), which shares the identical
          final metabolic lesion: G6PT and G6PC3 collaborate to destroy 1,5-AG6P, so loss of either produces
          the same accumulation.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: empagliflozin
            term:
              id: CHEBI:82720
              label: empagliflozin
        target_phenotypes:
        - preferred_term: Severe congenital neutropenia
          term:
            id: HP:0001875
            label: Decreased total neutrophil count
        - preferred_term: Recurrent bacterial infections
          term:
            id: HP:0002718
            label: Recurrent bacterial infections
        notes: Off-label use. In the GSD-Ib series no symptomatic hypoglycaemia was observed. No dedicated
          randomised trial exists in G6PC3 deficiency; the evidence base is small treated case series.
      selected_evidence:
        snippet: A significant increase in all the hematopoietic cell lineages and substantial improvement
          in the quality of life was observed.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
