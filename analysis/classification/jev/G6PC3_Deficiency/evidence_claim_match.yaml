    claim:
      about:
        disease:
          name: G6PC3 Deficiency
          disease_term:
            preferred_term: G6PC3 deficiency (severe congenital neutropenia type 4)
            term:
              id: MONDO:0012930
              label: autosomal recessive severe congenital neutropenia due to G6PC3 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 1,5-AG6P accumulation and hexokinase inhibition
        biological_scale: MOLECULAR
        description: Granulocytes deficient in G6PC3 accumulate millimolar 1,5-AG6P, inhibiting hexokinase
          and reducing glucose utilization. This is especially damaging for neutrophils, which depend
          heavily on glycolysis for effector function. 1,5-AG6P is made by glucose-phosphorylating enzymes
          from 1,5-anhydroglucitol (1,5-AG), an abundant blood polyol of dietary origin — so the toxic
          metabolite is continuously regenerated from the circulating pool, which is what makes lowering
          plasma 1,5-AG a tractable therapeutic target.
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
