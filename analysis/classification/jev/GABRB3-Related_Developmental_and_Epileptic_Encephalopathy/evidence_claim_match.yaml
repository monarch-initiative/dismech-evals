          name: GABRB3-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 43
            term:
              id: MONDO:0014921
              label: developmental and epileptic encephalopathy, 43
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_gabrb3_mouse_models_lof_only
        prompt: Do the available Gabrb3 mouse models represent the human gain-of-function arm of DEE43,
          or only its loss-of-function arm — and can drug-response findings from them (notably cannabidiol)
          be generalized across the two functional classes?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Gain-of-Function Increase in GABA Sensitivity
        rationale: 'Every in vivo Gabrb3 model in current use sits on one side of the human disease. The
          constitutive knockout removes the subunit entirely, which is a loss-of-function extreme and
          additionally produces an Angelman-like phenotype rather than DEE43. The two knock-in lines (D120N,
          N328D) each model a single Lennox-Gastaut-associated human variant. No published model reproduces
          the reduced-desensitization gain-of-function subgroup that carries the earliest onset, movement
          disorder, and early-mortality risk in patients. This matters concretely: cannabidiol efficacy
          has been shown in the D120N line and is being read as a rationale for human use, but the functional
          class of D120N cannot be assumed to represent the gain-of-function patients in whom GABA-directed
          drugs behave oppositely.'
      selected_evidence:
        snippet: The loss of the single gene, gabrb3, in these mice is sufficient to cause phenotypic
          traits that have marked similarities to the clinical features of AS, indicating that impaired
          expression of the GABRB3 gene in humans probably contributes to the overall phenotype of Angelman
          syndrome.
        supports: SUPPORT
    origin:
