      assertion_type: Pathophysiology
      assertion:
        name: Altered Receptor Desensitization
        role: modifier
        biological_scale: MOLECULAR
        description: Desensitization — the decline of current during sustained agonist exposure — is a
          second, independent axis of gain-of-function severity. Variants that reduce desensitization
          at equilibrium sustain the excess conductance and worsen gain-of-function traits; these cluster
          in the pore-forming transmembrane region and are associated with the most severe outcomes (median
          first-seizure onset 0.5 months, movement disorder, migrating focal seizures, and risk of early
          mortality). Variants that instead accelerate current decay limit the gain-of-function effect,
          cluster in the activation coupling loops, and are associated with later onset and milder phenotypes.
        molecular_functions:
        - preferred_term: GABA-A receptor activity
          term:
            id: GO:0004890
            label: GABA-A receptor activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: Of the 20 gain-of-function variants assessed, 13 were found to alter receptor desensitization
          properties. Seven variants reduced desensitization at equilibrium, which acts to worsen gain-of-function
          traits. Six variants accelerated current decay kinetics, which limits gain-of-function traits.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
