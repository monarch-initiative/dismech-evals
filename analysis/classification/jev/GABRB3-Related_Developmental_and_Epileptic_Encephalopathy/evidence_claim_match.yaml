          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 43
            term:
              id: MONDO:0014921
              label: developmental and epileptic encephalopathy, 43
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Angelman syndrome (15q11.2-q13.1 deletion)
        description: 'Large maternal 15q11.2-q13.1 deletions remove GABRB3 together with UBE3A, GABRA5,
          GABRG3, and OCA2, and produce developmental delay, seizures, and hypotonia that overlap DEE43
          clinically. The mechanism is different — a contiguous-gene deletion with UBE3A loss as the primary
          driver and GABRB3 co-deletion as a severity modifier — and management and counselling differ,
          so chromosomal microarray should be used to separate the two. Ocular hypopigmentation, long
