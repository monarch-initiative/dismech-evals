        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Receptor Trafficking and Postsynaptic Clustering
        role: intermediate
        biological_scale: CELLULAR
        description: 'Mutant beta-3 subunits reduce surface and synaptic receptor levels and, more strikingly,
          act in trans on the wild-type receptor pool: they impair postsynaptic clustering of wild-type
          gamma-2 subunits and prevent gamma-2 from being incorporated into synaptic GABA-A receptors.
          Because gamma-2 is what anchors GABA-A receptors at the synapse, this converts a heterozygous
          subunit defect into a broader loss of synaptic inhibitory receptors. The same reduction in synaptic
          gamma-2 clustering is seen in Gabrb3 heterozygous knockout mice.'
        cell_types:
        - preferred_term: GABAergic neuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        biological_processes:
        - preferred_term: GABA-A receptor localization to the plasma membrane
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
          modifier: DECREASED
        cellular_components:
        - preferred_term: GABA-ergic synapse
          term:
            id: GO:0098982
            label: GABA-ergic synapse
      selected_evidence:
        snippet: Interestingly, both mutant β3 subunits impaired postsynaptic clustering of wild-type
          GABAA receptor γ2 subunits and prevented γ2 subunits from incorporating into GABAA receptors
          at synapses, although by different cellular mechanisms.
        supports: SUPPORT
