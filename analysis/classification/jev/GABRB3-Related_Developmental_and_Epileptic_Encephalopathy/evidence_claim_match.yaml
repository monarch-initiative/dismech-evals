  448610d30514de61f83babe2f6d6af74e1b5cc7d4382e58eb9c9619bfff36579:
    claim:
      about:
        disease:
          name: GABRB3-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 43
            term:
              id: MONDO:0014921
              label: developmental and epileptic encephalopathy, 43
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Gain-of-Function Increase in GABA Sensitivity
        role: intermediate
        biological_scale: MOLECULAR
        description: 'Gain-of-function variants raise the potency of GABA at the receptor (a leftward
          shift in the GABA concentration-response relationship) without necessarily changing maximal
          open probability or absolute current. Because tonic, extrasynaptic inhibition is driven by low
          ambient GABA concentrations, a potency increase disproportionately amplifies tonic chloride
          flux. Counterintuitively for a receptor whose job is inhibition, this class carries the more
          severe clinical phenotype: younger seizure onset, higher risk of severe intellectual disability,
          focal seizures at onset, hypotonia, and lower likelihood of seizure freedom.'
        molecular_functions:
        - preferred_term: GABA-A receptor activity
          term:
            id: GO:0004890
            label: GABA-A receptor activity
          modifier: GAIN_OF_FUNCTION
        biological_processes:
