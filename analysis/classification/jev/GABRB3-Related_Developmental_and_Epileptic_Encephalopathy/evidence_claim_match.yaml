            term:
              id: MONDO:0014921
              label: developmental and epileptic encephalopathy, 43
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_gabrb3_gof_paradox
        prompt: Why do gain-of-function GABRB3 variants — which increase the potency of an inhibitory
          neurotransmitter receptor — produce an earlier-onset and more severe epileptic encephalopathy
          than loss-of-function variants?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Gain-of-Function Increase in GABA Sensitivity
        - pathophysiology#Disrupted Excitation-Inhibition Balance in Developing Networks
        rationale: 'The excitation-inhibition framework predicts that reduced GABAergic inhibition causes
          seizures, and GABA-A receptor epilepsy variants were presumed to act that way. GABRB3 breaks
          the prediction: the class of variants that increases GABAergic activity has the worse outcome.
          Candidate explanations include preferential amplification of tonic extrasynaptic current, depolarizing
          GABA responses in immature neurons with high intracellular chloride, and disruption of the developmental
          patterning role of GABAergic signalling — but these have not been discriminated experimentally,
          and the answer determines whether GABA-enhancing drugs help or harm a given patient.'
      selected_evidence:
        snippet: Overall, patients with GABRB3 variants that increase GABAergic activity have more severe
          developmental and epileptic encephalopathies. This paradoxical finding challenges our current
          understanding of the GABAergic system in epilepsy and how patients should be treated.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
