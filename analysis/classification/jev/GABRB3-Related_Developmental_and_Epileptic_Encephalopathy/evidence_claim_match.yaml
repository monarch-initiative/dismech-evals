          is the mechanistic reason they were tolerated by a gain-of-function patient who could not tolerate
          vigabatrin. A patient with the gain-of-function p.Glu77Lys variant stabilized on nitrazepam
          plus the ketogenic diet, and a separate case report describes complete seizure cessation on
          clonazepam.
