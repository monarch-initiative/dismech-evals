              label: developmental and epileptic encephalopathy, 43
        context: []
      assertion_type: Treatment
      assertion:
        name: Vigabatrin (variant-class dependent — contraindicated in gain-of-function)
        description: Vigabatrin inhibits GABA transaminase and thereby raises tonic GABAergic current.
          Its effect in GABRB3-related DEE depends on which functional class the variant belongs to, and
          getting this wrong is harmful rather than merely ineffective. In loss-of-function variants it
          is expected to be safe and effective and a truncating-variant patient responded well. In gain-of-function
          variants it produces a hypersensitivity reaction with hypotonia, sedation, and respiratory suppression,
          because it further exaggerates an already excessive tonic current. Functional or structural
          classification of the variant should therefore precede a vigabatrin trial.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: vigabatrin
            term:
              id: CHEBI:63638
              label: vigabatrin
      selected_evidence:
        snippet: We therefore propose that the hypersensitivity reaction to vigabatrin is a result of
          GABRB3 variants that exacerbate GABAergic tonic currents and caution is required when prescribing
          vigabatrin.
        supports: SUPPORT
