        association: GABRB3 (15q12) encodes the GABA-A receptor beta-3 subunit. Heterozygous, almost always
          de novo, variants — predominantly missense, less often nonsense or truncating — cause developmental
          and epileptic encephalopathy 43. Variants segregate into functionally opposite gain-of-function
          and loss-of-function classes that both cause encephalopathy but with distinct clinical profiles,
          and phenotype additionally correlates with the variant's position in the three-dimensional subunit
          structure (extracellular domain versus pore-lining transmembrane domain).
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        inheritance:
        - name: Autosomal dominant (almost always de novo)
