        description: 'Lennox-Gastaut syndrome is an electroclinical syndrome diagnosis, not an alternative
          aetiology: a proportion of GABRB3-related DEE patients are labelled with it, and the two mouse
          knock-ins that model specific human GABRB3 variants (D120N, N328D) were both built to model
          GABRB3-associated Lennox-Gastaut syndrome. It is listed here because the syndromic label is
          what a patient usually carries before genetic testing, and it does not by itself identify the
          gene or predict the vigabatrin hazard, which depends on the variant''s functional class.'
        distinguishing_features:
        - The syndromic diagnosis describes seizure semiology and EEG pattern; it does not specify aetiology,
          and Lennox-Gastaut syndrome has many other genetic and structural causes.
        - Establishing GABRB3 as the cause requires molecular testing; the gain-of-function versus loss-of-function
          classification of the variant then determines whether vigabatrin is appropriate or hazardous.
        disease_term:
          preferred_term: Lennox-Gastaut syndrome
          term:
            id: MONDO:0016532
            label: Lennox-Gastaut syndrome
      selected_evidence:
        snippet: Mutations in GABRB3 have been increasingly recognized as a major cause for severe paediatric
          epilepsy syndromes such as Lennox-Gastaut syndrome, Dravet syndrome and infantile spasms with
          intellectual disability as well as relatively mild epilepsy syndromes such as childhood absence
          epilepsy.
