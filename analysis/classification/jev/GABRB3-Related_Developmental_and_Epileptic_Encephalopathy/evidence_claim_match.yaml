      assertion_type: Diagnosis
      assertion:
        name: Functional (electrophysiological) variant classification
        description: Beyond confirming a variant, determining whether it is gain-of-function or loss-of-function
          has direct therapeutic consequences, because the two classes respond oppositely to drugs that
          raise tonic GABAergic current. Classification is done by two-electrode voltage-clamp or patch-clamp
          electrophysiology of the variant receptor, and the variant's structural location (extracellular
          domain versus pore-lining transmembrane domain) provides partial prediction when functional
          data are unavailable.
      selected_evidence:
        snippet: These genotype-phenotype correlations will aid the genetic counseling and treatment of
          individuals affected by GABRB3-related disorders.
        supports: SUPPORT
