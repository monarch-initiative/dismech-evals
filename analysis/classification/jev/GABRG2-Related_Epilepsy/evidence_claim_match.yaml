            label: Autosomal dominant inheritance
        description: GABRG2-related epilepsy is inherited in an autosomal dominant manner. In multiplex
          families with milder phenotypes (febrile seizures, GEFS+, childhood absence epilepsy) the variant
          is transmitted dominantly with variable expressivity, whereas the severe developmental and epileptic
          encephalopathy end is enriched for de novo variants. In a multicenter cohort of 35 patients
          with GABRG2 variants, the majority (22 of 35) were de novo.
      selected_evidence:
        snippet: In 35 patients with GABRG2 variants, 22 variants were de novo, and 18 variants were novel.
        supports: SUPPORT
