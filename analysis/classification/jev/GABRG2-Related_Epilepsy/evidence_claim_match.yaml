        role: intermediate
        biological_scale: MOLECULAR
        description: 'A distinctive property of several GABRG2 variants is that their surface trafficking
          is temperature-sensitive: brief febrile-range temperature elevation dynamically reduces surface
          mutant receptors, while conversely lowering the temperature partially rescues surface expression.
          This provides a direct molecular link between the receptor-trafficking defect and the prominent
          fever-triggered seizures of GABRG2-related epilepsy.'
        cell_types:
        - preferred_term: GABAergic inhibitory interneuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        biological_processes:
        - preferred_term: GABA-A receptor localization to the plasma membrane
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
          modifier: DECREASED
      selected_evidence:
        snippet: suggesting that febrile seizures may be produced by a temperature-induced dynamic reduction
          of susceptible mutant surface GABAA receptors in response to fever.
        supports: SUPPORT
