            preferred_term: GABRG2-related epilepsy
            term:
              id: MONDO:0032725
              label: developmental and epileptic encephalopathy, 74
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Generalized epilepsy with febrile seizures plus (GEFS+)
        description: GEFS+ is a familial multi-gene epilepsy syndrome in which GABRG2 is one of several
          loci (alongside SCN1A, SCN1B, SCN9A, GABRD, and STX1B). It is curated as a separate dismech
          entry. This gene-anchored GABRG2 entry instead spans the full GABRG2 allelic spectrum, including
          the childhood absence epilepsy, Dravet-like, and severe developmental and epileptic encephalopathy
          presentations that fall outside the classic GEFS+ definition.
        distinguishing_features:
        - GEFS+ is defined at the syndrome/family level and is genetically heterogeneous (sodium-channel,
          GABA-A receptor, and SNARE genes), whereas this entry is anchored on the single gene GABRG2
          and its receptor-trafficking mechanism.
        - GABRG2 variants also cause phenotypes beyond GEFS+, including childhood absence epilepsy, Dravet
          syndrome, and severe developmental and epileptic encephalopathy.
