      assertion_type: Genetic
      assertion:
        name: GALNT2
        gene_term:
          preferred_term: GALNT2
          term:
            id: hgnc:4124
            label: GALNT2
        relationship_type: CAUSATIVE
        notes: 'GALNT2 encodes GalNAc-T2, a Golgi-localized type II membrane glycosyltransferase and one
          of the twenty-isoenzyme GalNAc-T family. Expression is broad rather than tissue-restricted.

          The same gene has a second, entirely separate literature: the GALNT2 locus is a well-replicated
          common-variant association with HDL cholesterol and triglycerides in population cohorts. Those
          are regulatory variants of small effect and do not cause this disease. The overlap is mechanistically
          informative - both arms run through apoC-III O-glycosylation - but a reader should not take
          a GALNT2 lipid GWAS hit as evidence about GALNT2-CDG, and the evidence items here that draw
          on that literature are graded INDIRECT for exactly this reason.'
      selected_evidence:
        snippet: GALNT2 encodes the Golgi-localized polypeptide N-acetyl-d-galactosamine-transferase 2
          isoenzyme.
        supports: SUPPORT
