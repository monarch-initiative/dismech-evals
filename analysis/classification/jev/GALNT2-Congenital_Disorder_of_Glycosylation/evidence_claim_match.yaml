            term:
              id: MONDO:0030043
              label: congenital disorder of glycosylation, type IIt
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ApoC-III Hypoglycosylation and Altered Lipoprotein Metabolism
        role: mechanism
        biological_scale: ORGANISM
        description: 'ApoC-III normally carries a mucin-type core-1 O-glycan and circulates in glycoforms
          that differ in sialylation. Loss of GalNAc-T2 abolishes the initiating GalNAc, so no glycoform
          is made at all.

          Because apoC-III regulates triglyceride-rich lipoprotein handling, this shifts plasma lipids,
          and the clinical readout is a low HDL cholesterol. The direction is corroborated from a second,
          entirely independent direction: common variation at the GALNT2 locus in population cohorts shifts
          apoC-III glycoform proportions and shifts HDL and triglycerides with them.'
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: On a genome-wide scale, we confirmed that the GALNT2-gene plays a major role i O-glycosylation
          of apolipoprotein-CIII, with subsequent associations with lipid parameters.
        supports: SUPPORT
        directness: INDIRECT
