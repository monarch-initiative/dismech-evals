  20202f9b8fc6478adc0d049d9113c54088b7d5fdd097fbd3fd395000d3cb024e:
    claim:
      about:
        disease:
          name: GALNT2-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: congenital disorder of glycosylation, type IIt
            term:
              id: MONDO:0030043
              label: congenital disorder of glycosylation, type IIt
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Insulin Receptor Hypoglycosylation and Altered Energy Homeostasis
        role: mechanism
        biological_scale: ORGANISM
        description: 'The second identified non-redundant substrate, and the reason the entry does not
          treat apoC-III as the whole of the mechanism. The insulin receptor is a GalNAc-T2 substrate,
          and Galnt2-null mice show altered insulin signalling, reduced adiposity and a shift in which
          fuel they burn.

          This matters for interpreting the human phenotype. Short stature and poor growth are core features
          of GALNT2-CDG and have no explanation in the lipid arm. A defect in insulin receptor glycosylation
          is a candidate explanation with a named substrate behind it, which is more than the neurological
          arm has.

          The caution is that the demonstration is murine. No study has shown altered insulin receptor
          glycosylation or insulin signalling in a GALNT2-CDG patient, so the human claim is an extrapolation
          and the entry marks it as such rather than curating a growth mechanism it cannot source in humans.'
      selected_evidence:
        snippet: we identify the insulin receptor as a novel substrate of GalNAc-T2 and demonstrate that
          Galnt2-/- mice exhibit decreased adiposity, alterations in insulin signaling and a shift in
          energy substrate utilization in the inactive phase.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
