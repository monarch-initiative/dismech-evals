  f20e30cb4f0f2f7c1427fee9fc022ed13ec777a4e9abb12eb8fc8d5fb58e8eba:
    claim:
      about:
        disease:
          name: GALNT2-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: congenital disorder of glycosylation, type IIt
            term:
              id: MONDO:0030043
              label: congenital disorder of glycosylation, type IIt
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Apolipoprotein C-III Glycoform Analysis
        description: 'The disease-specific biochemical test. Because apoC-III is a non-redundant GalNAc-T2
          substrate, its complete loss of O-glycosylation is a direct readout of the enzyme defect - unlike
          transferrin isoform analysis, which is the standard CDG screen and interrogates N-glycosylation,
          a pathway this disease does not affect.

          That distinction is the practical point: a GALNT2-CDG patient can screen normal on the routine
          CDG test.'
        notes: 'Specificity, not just sensitivity. The cohort finding above establishes that every reported
          patient had the abnormality; it does not establish that the abnormality is specific to this
          disease, and the cited review names at least one acquired cause of a core 1 O-glycan biosynthesis
          abnormality. Treat a positive glycoform result as an indication to sequence rather than as a
          diagnosis.

          The claim that transferrin analysis is normal in this disease is an inference from the fact
          that GALNT2 acts on O-glycosylation while transferrin screening interrogates N-glycosylation.
          No cited source states it for GALNT2-CDG patients, so it is recorded here in notes rather than
          as an evidenced diagnostic claim.'
      selected_evidence:
        snippet: All patients showed loss of O-glycosylation of apolipoprotein C-III, a non-redundant
          substrate for GALNT2.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
