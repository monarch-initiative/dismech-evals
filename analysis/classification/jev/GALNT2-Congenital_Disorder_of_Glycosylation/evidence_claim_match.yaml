              label: congenital disorder of glycosylation, type IIt
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of O-Glycosylation at Non-Redundant GalNAc-T2 Sites
        role: mechanism
        biological_scale: MOLECULAR
        description: 'The pivot of the disease. Most O-glycosites survive the loss of one isoenzyme; a
          minority do not, and those are what produce the phenotype.

          Apolipoprotein C-III is the substrate this was established on, and it is described as non-redundant
          for GalNAc-T2 explicitly: all seven patients lost its O-glycosylation entirely. That makes apoC-III
          both the mechanistic anchor and the diagnostic test.

          Beyond apoC-III the substrate set has been mapped rather than enumerated one at a time: glycoproteomics
          of Galnt2-null mouse tissue identifies a network of proteins lacking GalNAc-T2-specific glycans.
          That work is murine and is graded accordingly.'
      selected_evidence:
        snippet: We examined the Galnt2-null mouse model, which phenocopies congenital disorder of glycosylation
          involving GALNT2 and revealed a network of glycoproteins that lack GalNAc-T2-specific O-glycans.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
