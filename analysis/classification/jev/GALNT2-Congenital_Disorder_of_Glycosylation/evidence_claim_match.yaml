      assertion:
        name: Molecular Confirmation by Next-Generation Sequencing
        description: 'How the diagnosis is actually established. The apoC-III glycoform test above points
          at the enzyme, but every reported patient was confirmed by sequencing, and for a disorder this
          rare with a non-specific neurodevelopmental presentation the sequencing usually comes first:
          GALNT2-CDG is the kind of entity found by exome or genome sequencing in a child investigated
          for developmental delay, with the glycoform test used to confirm that the variants are doing
          what they appear to.'
