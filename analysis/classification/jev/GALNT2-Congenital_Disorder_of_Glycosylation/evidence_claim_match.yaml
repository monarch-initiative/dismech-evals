        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of GalNAc-T2 Initiation of Mucin-Type O-Glycosylation
        role: mechanism
        biological_scale: MOLECULAR
        description: 'GalNAc-T2 catalyses the first committed step of mucin-type O-glycosylation, adding
          GalNAc to serine or threonine on a secreted or membrane protein as it passes through the Golgi.

          This is where the redundancy question sits. GalNAc-T2 is one of a family, its expression is
          broad rather than tissue-restricted, and for most substrates another isoenzyme can do the same
          job. So the consequence of losing it is not a global O-glycosylation failure but a failure confined
          to the sites only GalNAc-T2 will modify.'
        molecular_functions:
        - preferred_term: GalNAc-T2 transferase activity
          term:
            id: GO:0004653
            label: polypeptide N-acetylgalactosaminyltransferase activity
          modifier: ABSENT
        biological_processes:
        - preferred_term: initiation of mucin-type O-glycosylation
          term:
            id: GO:0016266
            label: protein O-linked glycosylation via N-acetylgalactosamine
          modifier: DECREASED
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: GALNT2 is widely expressed in most cell types and directs initiation of mucin-type protein
          O-glycosylation.
        supports: SUPPORT
