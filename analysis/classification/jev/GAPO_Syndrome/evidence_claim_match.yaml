      assertion_type: Genetic
      assertion:
        name: ANTXR1
        gene_term:
          preferred_term: ANTXR1
          term:
            id: hgnc:21014
            label: ANTXR1
        relationship_type: CAUSATIVE
        notes: 'ANTXR cell adhesion molecule 1, at 2p13.3, encoding a matrix-interacting adhesion protein.
          It is better known as anthrax toxin receptor 1 — the name records what it was first found doing,
          not what it does — and biallelic loss of function causes GAPO syndrome.

          The allelic spectrum spans nonsense, splice, frameshift and missense variants, all reported
          homozygous. One of them is mechanistically distinctive: the splice change c.1435-12A>G theoretically
          encodes a truncated protein with a 118-residue neopeptide at its C terminus, which is a different
          molecular event from nonsense-mediated decay even if the clinical result is the same.'
        variants:
        - name: c.262C>T (p.Arg88*) and c.505C>T (p.Arg169*)
          description: Homozygous nonsense variants in the founding cohort, predicted to trigger nonsense-mediated
            mRNA decay and so to abolish the protein.
        - name: c.1435-12A>G (p.Gly479Phefs*119)
          description: A splicing variant that theoretically encodes a truncated ANTXR1 carrying a neopeptide
            of 118 unique amino acids at its C terminus.
        - name: c.1220_1221insT (p.Ala408Cysfs*2), c.411A>G (p.Gln137Gln), c.1150G>A (p.Gly384Ser)
          description: Three novel homozygous variants — frameshift, splice site and non-synonymous —
            found by whole exome sequencing in three Turkish kindreds.
        - name: c.410A>T (p.Q137L)
          description: A missense variant found homozygous in two siblings.
      selected_evidence:
        snippet: The transcript with the splicing mutation theoretically encodes a truncated ANTXR1 containing
          a neopeptide composed of 118 unique amino acids in its C terminus.
        supports: SUPPORT
