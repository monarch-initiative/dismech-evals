    evidence_metadata:
      reference: PMID:25045128
      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with
        GAPO syndrome.
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      explanation: The localisation. Among the tissues listed for the knock-out mouse, the skin entry
        is qualified as the basal aspects of the hair follicles, which is the peri-follicular compartment
        this gap is about. The same sentence carries the periodontal ligament finding that underpins the
        dental edge, so it is one observation supporting two very differently typed edges.
