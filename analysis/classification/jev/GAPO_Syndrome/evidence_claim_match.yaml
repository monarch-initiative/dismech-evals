  5e5b1664a23febdd7013e4c5756a2b76911d8c85062627b36f19d1357a03217e:
    claim:
      about:
        disease:
          name: GAPO Syndrome
          disease_term:
            preferred_term: GAPO syndrome
            term:
              id: MONDO:0009263
              label: GAPO syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gapo_neopeptide_allele
        kind: KNOWLEDGE_GAP
        prompt: Does the c.1435-12A>G splice allele behave as a null, or does its 118-residue neopeptide
          add an effect of its own?
        attaches_to:
        - genetic#ANTXR1
        rationale: 'The nonsense alleles are predicted to abolish the protein through nonsense-mediated
          decay, and the splice allele is predicted to produce a truncated protein carrying a novel C-terminal
          peptide, which is a different molecular event. The functional answer is partly in hand and narrows
          the question rather than leaving it open: all three of the originally reported alleles, the
          splice allele included, were confirmed to behave as null alleles in patient fibroblasts, and
          immunohistochemistry on patient fibroblast lines showed complete loss of the ANTXR1 isoform.
          What remains is narrower and is an assay question. An antibody raised against the normal isoform
          reporting its loss does not establish that no truncated neopeptide-bearing species is made,
          only that the isoform it detects is gone, and a species that is functionally null for adhesion
          could still do something else. With about 30 reported patients that distinction will not emerge
          from clinical correlation.'
      selected_evidence:
        snippet: Interestingly, all of them produce null alleles as confirmed by functional studies with
          fibroblasts obtained from GAPO patients.
        supports: SUPPORT
