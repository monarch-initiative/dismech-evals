        context: []
      assertion_type: Phenotype
      assertion:
        category: Dental
        name: Eruption failure
        description: 'Pseudoanodontia, the P of the acronym. The distinction the name carries is the mechanistically
          important one: the teeth are present but fail to erupt, which is not the same claim as tooth
          agenesis and is what makes a matrix-clearance defect the natural explanation. This is the feature
          the Antxr1-mutant mouse reproduces.'
        phenotype_term:
          preferred_term: Pseudoanodontia
          term:
            id: HP:0000706
            label: Eruption failure
        frequency: VERY_FREQUENT
      selected_evidence:
        snippet: GAPO syndrome's major phenotypic features, which include dental abnormalities and the
          accumulation of extracellular matrix, recapitulate those found in Antxr1-mutant mice and point
          toward an underlying defect in extracellular-matrix regulation.
        supports: SUPPORT
