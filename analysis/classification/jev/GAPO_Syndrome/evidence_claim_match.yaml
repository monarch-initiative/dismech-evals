        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Visceral involvement and premature death
        notes: GAPO is not a disorder of appearance alone and its published course includes death in childhood
          and in adult life from visceral causes. One patient in the cohort curated here died at 37 of
          central apnoea and respiratory insufficiency, and a separately reported patient died at 17 months
          of pulmonary hypertension. Pulmonary involvement is named as one of the life-span reducing manifestations.
          Nothing located establishes a survival distribution, and with roughly 30 published cases nothing
          is likely to; these are two reported deaths, recorded as such.
      selected_evidence:
        snippet: Clinical follow up of our families revealed that patient BAB5349 died at age 37 due to
          central apnea and respiratory insufficiency.
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/0
      context_paths:
