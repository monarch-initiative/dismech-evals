          value:
            species: Mouse
            genotype: Antxr1 mutant
            publication: PMID:23602711
            description: The Antxr1-mutant mouse reproduces the dental abnormalities and the extracellular-matrix
              accumulation. It is the evidence that makes the matrix hypothesis more than an interpretation
              of a fibroblast stain, because it shows the two features arising together from the same
              lesion in an animal.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Extracellular Matrix Accumulation
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: Shows extracellular-matrix accumulation together with the dental phenotype, which
          is the pairing the human matrix hypothesis rests on.
        limitations: The tissues assessed are enumerated and the ocular system is not among them. The
          knock-out shows a mild to moderate matrix increase in skin at the basal aspects of the hair
          follicles, endometrium, ovaries, periosteum of femur and vertebra, cranial sutures, and the
          periodontal ligament of the incisors, where it produces misalignment and dental dysplasia. Two
          limits follow. The increase is graded mild to moderate, against a human phenotype severe enough
          to prevent tooth eruption entirely and to coarsen the face with age. And nothing reports an
          optic nerve, a retinal or a hair-loss finding in the mouse, so the model speaks to the dental
          and connective-tissue arm and is silent on the two human features this entry types as least
          well explained.
        divergences:
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: The enumerated tissues cover skin, reproductive tract, bone, cranial sutures and
            periodontal ligament. Neither the optic nerve nor hair loss appears, so the two human features
            with the weakest mechanistic account in this entry are also the two the model does not report
            on.
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: The mouse matrix increase is graded mild to moderate. The human phenotype it is
            offered as a model of prevents tooth eruption outright, so the same lesion is producing quantitatively
            different tissue consequences in the two species.
      selected_evidence:
        snippet: 'In an Antxr1 knock-out mouse model a mild to moderate increase of extracellular matrix
          (especially collagen) has been observed in many tissues including: the skin (basal aspects of
          the hair follicles), endometrium, ovaries, periosteum of femurs and vertebra, cranial sutures
          of the skull, and the periodontal ligament of the incisors that leads to misalignment and dental
          dysplasia'
        supports: SUPPORT
    origin:
