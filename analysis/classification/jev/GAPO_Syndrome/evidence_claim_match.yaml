      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with
        GAPO syndrome.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The death in the cohort, with its age and its cause. BAB5349 is the oldest patient
        in the table and the only one in whom the disorder's late course is observed at all.
