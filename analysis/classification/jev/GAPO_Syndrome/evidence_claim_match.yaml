      assertion_type: Pathophysiology
      assertion:
        name: ANTXR1 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic ANTXR1 variants remove or truncate a matrix-interacting protein that works
          as an adhesion molecule. The reported alleles are mechanistically varied: nonsense changes predicted
          to trigger nonsense-mediated decay and so abolish the protein, and a splice change that theoretically
          encodes a truncated protein carrying a 118-residue neopeptide at its C terminus. Whether the
          neopeptide allele behaves as a plain null or has an additional effect is not resolved.'
        genes:
        - preferred_term: ANTXR1
          term:
            id: hgnc:21014
            label: ANTXR1
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The nonsense mutations predictably trigger nonsense-mediated mRNA decay, resulting in
          the loss of ANTXR1.
        supports: SUPPORT
    origin:
