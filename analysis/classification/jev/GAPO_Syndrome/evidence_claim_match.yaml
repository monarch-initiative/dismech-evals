  9d84407ef615f96b325b6fe8c439cbad4b574b6f71bd8bc5d59c092eca96867e:
    claim:
      about:
        disease:
          name: GAPO Syndrome
          disease_term:
            preferred_term: GAPO syndrome
            term:
              id: MONDO:0009263
              label: GAPO syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gapo_alopecia_route
        kind: KNOWLEDGE_GAP
        prompt: Is the alopecia a consequence of matrix accumulation in the dermis, or a separate developmental
          effect of ANTXR1 loss on the hair follicle?
        attaches_to:
        - phenotypes#Alopecia
        rationale: 'Alopecia with rarefaction of eyebrows and eyelashes is an ectodermal pattern, and
          the syndrome is classified among the ectodermal dysplasias for that reason, yet the proposed
          mechanism is mesenchymal. Hair follicle development depends on epithelial-mesenchymal signalling,
          so a dermal matrix defect could produce it, and one located source does put the matrix in the
          right place: in the Antxr1 knock-out mouse the extracellular-matrix excess is localised to the
          skin at the basal aspects of the hair follicles specifically, among several other tissues. That
          is a localisation, not a demonstration. No source reports whether that mouse loses hair, no
          source tests whether removing the peri-follicular matrix excess rescues anything, and the alternative
          that ANTXR1 has a follicle-intrinsic role is not excluded. The gap is therefore about the step
          from peri-follicular matrix accumulation to hair loss, not about whether anyone has looked at
          the follicle.'
      selected_evidence:
        snippet: 'In an Antxr1 knock-out mouse model a mild to moderate increase of extracellular matrix
          (especially collagen) has been observed in many tissues including: the skin (basal aspects of
          the hair follicles), endometrium, ovaries, periosteum of femurs and vertebra, cranial sutures
          of the skull, and the periodontal ligament of the incisors that leads to misalignment and dental
          dysplasia'
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
