        description: 'The O of the acronym, and the feature the acronym describes worst. Two things are
          wrong with reading the name as a frequency claim. First, the sources disagree on what the feature
          is: the founding paper says "progressive visual impairment" where later sources say "progressive
          optic atrophy", and those are not synonyms, one being a symptom and the other a finding. Second,
          and more importantly, the ophthalmologic literature does not find optic atrophy consistent,
          and the six-patient cohort curated here scored it positive in one patient, negative in three
          and not done in two. Glaucoma, which is not in the acronym, was positive in four of the same
          six. The frequency band therefore follows the cohort and not the name.'
