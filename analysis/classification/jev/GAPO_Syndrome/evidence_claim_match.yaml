  30372b0a06b2996663a05de3ec368a930151f600c03e9fc2ebb81b79e5fd2e95:
    claim:
      about:
        disease:
          name: GAPO Syndrome
          disease_term:
            preferred_term: GAPO syndrome
            term:
              id: MONDO:0009263
              label: GAPO syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gapo_optic_atrophy_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Does optic nerve compression by accumulated matrix account for the ocular feature, given
          that it was present in only one of six patients?
        attaches_to:
        - phenotypes#Optic atrophy
        rationale: 'There is a stated account, and it is mechanical: matrix accumulating around the optic
          nerve, with thickening of the surrounding dura, compresses it. The gap is not that nobody has
          proposed a route. It is that the proposed route does not fit the two things that are actually
          observed. A compressive lesion produced by matrix that accumulates with age predicts a deficit
          that is progressive, which matches, but it also predicts a deficit that is close to universal
          in a disorder whose matrix defect is generalised, and optic atrophy was scored positive in one
          of six patients here and is described in the ophthalmologic literature as not a consistent feature.
          Glaucoma, which is not in the acronym, was more frequent in the same cohort. Either the compression
          is modified by something not identified, or some of what has been called optic atrophy in this
          syndrome is a different optic neuropathy, or the acronym has fixed attention on the wrong ocular
          feature. Nothing located distinguishes those.'
      selected_evidence:
        snippet: It is concluded that optic nerve pathologies are observed potentially secondary to physical
          compression of the optic nerve by the accumulation of extracellular matrix and thickening of
          the dura matter surrounding the optic nerve
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
