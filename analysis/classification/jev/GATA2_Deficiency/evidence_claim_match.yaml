      assertion_type: Pathophysiology
      assertion:
        name: GATA2 Haploinsufficiency
        biological_scale: MOLECULAR
        description: Heterozygous null alleles, missense variants in the second zinc finger, and regulatory
          variants in the intron 5 +9.5 kb enhancer all reduce functional GATA2 dosage below the threshold
          required for hematopoietic stem and progenitor cell maintenance.
        genes:
        - preferred_term: GATA2
          term:
            id: hgnc:4171
            label: GATA2
      selected_evidence:
        snippet: Haploinsufficiency of the hematopoietic transcription factor GATA2 underlies monocytopenia
          and mycobacterial infections; dendritic cell, monocyte, B, and natural killer (NK) lymphoid
          deficiency; familial myelodysplastic syndromes (MDS)/acute myeloid leukemia (AML); and Emberger
          syndrome (primary lymphedema with MDS).
        supports: SUPPORT
