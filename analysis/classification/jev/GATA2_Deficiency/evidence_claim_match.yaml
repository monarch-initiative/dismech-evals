  bfc20264818045c99a2bb6decac48636bf3dcfcb2ab87117d511e7c1bffc56ff:
    claim:
      about:
        disease:
          name: GATA2 Deficiency
          disease_term:
            preferred_term: GATA2 deficiency
            term:
              id: MONDO:0042982
              label: GATA2 deficiency with susceptibility to MDS/AML
        context: []
      assertion_type: Genetic
      assertion:
        name: GATA2
        notes: 'Heterozygous germline GATA2 variants cause the disorder. Three variant classes are recognised:
          coding null alleles (frameshift, nonsense, whole-gene deletion) acting by haploinsufficiency;
          missense alleles concentrated in the second zinc finger that impair sequence-specific DNA binding;
          and regulatory variants disrupting the intron 5 +9.5 kb enhancer. Null alleles are over-represented
          among patients with lymphedema and severe viral disease.'
        gene_term:
          preferred_term: GATA2
          term:
            id: hgnc:4171
            label: GATA2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Viral infections and lymphedema were more common in individuals with null mutations (P
          = .038 and P = .006, respectively).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
