      assertion_type: Pathophysiology
      assertion:
        name: Alveolar Macrophage Depletion
        biological_scale: TISSUE
        description: Alveolar macrophages are continuously replenished from circulating monocytes. With
          the monocyte compartment depleted, that replenishment fails and surfactant clearance falls,
          producing pulmonary alveolar proteinosis and impaired gas transfer. The defect is one of macrophage
          supply rather than of macrophage signalling, which is what distinguishes it from the hereditary
          PAP caused by GM-CSF receptor defects. The cited sources here establish the monocyte-to-respiratory-disease
          link; they do not themselves address GM-CSF signalling.
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
      selected_evidence:
        snippet: The most common respiratory diseases are pulmonary alveolar proteinosis, recurrent respiratory
          tract infections, and pulmonary hypertension.
        supports: SUPPORT
