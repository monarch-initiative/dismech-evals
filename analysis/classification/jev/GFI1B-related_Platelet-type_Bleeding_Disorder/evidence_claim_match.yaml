              and histone methyltransferases, and mouse knockouts establish that it is required for both
              megakaryocytic and erythroid development. When its repressor function is lost, megakaryocytes
              become dysplastic, are abnormally distributed in the marrow, retain the progenitor marker
              CD34 that maturing megakaryocytes normally lose, and produce enlarged proplatelet tips in
              reduced numbers.
