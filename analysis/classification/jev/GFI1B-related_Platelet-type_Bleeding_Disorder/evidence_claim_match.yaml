          been proposed as an immunofluorescence screening test. Curated as a marker of arrested maturation,
          not as a step in the bleeding mechanism.
        phenotype_term:
          preferred_term: Ectopic CD34 expression on platelets and megakaryocytes
        notes: 'Left deliberately unbound. HP:0011875 (Abnormal platelet morphology) was tried and rejected:
          this is an antigen-expression abnormality, not a morphological one, and the platelets here are
          already covered by a separate macrothrombocytopenia entry. HP:0011878 (Abnormal platelet membrane
          protein expression) is the closest resolvable candidate but its textual definition reads "Presence
          of reduced amount of a membrane protein", whereas CD34 here is ectopically INCREASED - the opposite
          direction. No HPO term currently expresses gain of a progenitor marker on mature platelets,
          so this is recorded as a new-term request rather than bound to an approximate parent.'
      selected_evidence:
        snippet: An immunofluorescence analysis revealed decreased thrombospondin-1 and increased CD34
          expression in platelets from our patient.
