              label: platelet-type bleeding disorder 17
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of Immune-Thrombocytopenia-Directed Therapy
        description: 'The single most consequential management point in this disorder is a negative one.
          GFI1B-related thrombocytopenia is regularly mistaken for immune thrombocytopenia, and ITP-directed
          therapy does not work: the reported index patient had been splenectomised and was on eltrombopag
          under a working diagnosis of hepatitis C-associated ITP, with no improvement in her bleeding
          phenotype. Recognising the inherited cause spares a patient a splenectomy that cannot help.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: This is the only treatment entry the available evidence supports, and the omission of the
          rest is deliberate rather than an oversight. Platelet transfusion, antifibrinolytics such as
          tranexamic acid, hormonal control of menorrhagia and iron supplementation are all standard supportive
          management for inherited platelet disorders and are described in this entry's deep-research
          report, but that report carries no PMIDs and none of the references cached for this entry contains
          quotable text for any of them. Curating them would mean either an evidence-free treatment block
          or a snippet manufactured to fit, and the evidence SOP rules out both. They should be added
          when a citable management source is fetched.
      selected_evidence:
        snippet: she was splenectomized and being treated with eltrombopag (according to a working diagnosis
          of hepatitis C-associated immune thrombocytopenia), but the bleeding phenotype had not improved
        supports: SUPPORT
