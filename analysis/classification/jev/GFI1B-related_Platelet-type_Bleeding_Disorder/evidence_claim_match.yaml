              label: platelet-type bleeding disorder 17
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Isoform-Selective Loss of Full-Length GFI1B-p37
        biological_scale: MOLECULAR
        conforms_to: primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component
        description: 'Alternative splicing of exon 9 produces two GFI1B isoforms: the full-length p37
          protein with all six zinc fingers, and a shorter p32 isoform lacking the first two zinc fingers,
          which is the one necessary for human erythropoiesis. In a consanguineous kindred with severe
          recessive bleeding, a homozygous insertion creates a premature stop codon that affects only
          the longer p37 transcript, leaving p32 intact. GFI1B protein was undetectable in the index patient''s
          megakaryocytes. Because the retained p32 covers the erythroid requirement, these patients have
          a platelet disease with essentially unaffected erythropoiesis, which is what makes this family
          evidence for isoform-specific lineage commitment at the megakaryocyte-erythroid progenitor stage
          rather than simply a milder GFI1B deficiency.'
        genes:
        - preferred_term: GFI1B
          term:
            id: hgnc:4238
            label: GFI1B
      selected_evidence:
        snippet: In humans, alternative splicing of exon 9 leads to the formation of a shorter isoform
          of GFI1B (p32; NP_001128503). This isoform lacks the first two zinc fingers as compared to the
          p37 full length protein (NP_004179) and is implicated in erythropoiesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28550182
      reference_title: Recessive grey platelet-like syndrome with unaffected erythropoiesis in the absence
        of the splice isoform GFI1B-p37.
      evidence_source: HUMAN_CLINICAL
