        context: []
      assertion_type: Genetic
      assertion:
        name: GFI1B
        gene_term:
          preferred_term: GFI1B
          term:
            id: hgnc:4238
            label: GFI1B
        association: Heterozygous dominant-negative zinc-finger variants, or recessive isoform-selective
          loss of GFI1B-p37
        relationship_type: CAUSATIVE
        features: 'GFI1B encodes a six-zinc-finger transcriptional repressor with an N-terminal SNAG repression
          domain, paralogous to GFI1 and mapping to 9q34.13. The dominant alleles reported so far (including
          a nonsense variant and the frameshift p.Gly272fsX274) all disrupt the essential DNA-binding
          domain, abolish consensus-site recognition, fail to repress a reporter gene, and act dominant-negatively
          over wild-type protein. A mechanistically separate recessive form arises from a homozygous insertion
          (p.Ser185Leufs*3) that truncates only the full-length p37 isoform, sparing the shorter p32 variant
          produced by alternative splicing of exon 9. The reported variant classes therefore span nonsense,
          frameshift and in-frame changes in the zinc-finger region, an isoform-selective insertion, and
          at least one hypomorphic recessive missense allele in zinc finger 6 (p.Leu308Pro). A separate,
          GWAS-detected splice-affecting polymorphism is also known: rs150813342 (minor allele frequency
          0.009), reported as possibly disrupting a splice enhancer-binding site in exon 9 and associated
          with a mild phenotype that the source attributes, again only possibly, to residual p37 expression.
          Both hedges are the source''s own and are retained here; if the attribution holds it is consistent
          with the isoform logic of the recessive kindred, where p37 is lost entirely.'
      selected_evidence:
        snippet: p.G272fsX274 and the previous two mutations all predicted disruption of an essential
          DNA-binding domain in GFI1B.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
