        biological_scale: CELLULAR
        description: GFI1B is a SNAG-domain transcriptional repressor that recruits histone deacetylases
          and histone methyltransferases, and mouse knockouts establish that it is required for both megakaryocytic
          and erythroid development. When its repressor function is lost, megakaryocytes become dysplastic,
          are abnormally distributed in the marrow, retain the progenitor marker CD34 that maturing megakaryocytes
          normally lose, and produce enlarged proplatelet tips in reduced numbers.
        cell_types:
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
        biological_processes:
        - preferred_term: megakaryocyte differentiation
          term:
            id: GO:0030219
            label: megakaryocyte differentiation
          modifier: ABNORMAL
        - preferred_term: platelet formation
          term:
            id: GO:0030220
            label: platelet formation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Mutant-transduced megakaryocytes produced enlarged proplatelet tips which were reduced
          in number.
        supports: SUPPORT
