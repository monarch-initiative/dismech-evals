            term:
              id: MONDO:0009076
              label: autosomal recessive nonsyndromic hearing loss 1A
        context: []
      assertion_type: Inheritance
      assertion:
        name: Digenic inheritance (GJB2/GJB6)
        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
        description: 'A large fraction of patients carry only one GJB2 mutant allele; in many of these
          the second lesion is the del(GJB6-D13S1830) deletion in GJB6 (connexin 30) in trans, so that
          double heterozygosity for a GJB2 mutation and a GJB6 deletion causes hearing loss digenically.
          This is the canonical example of digenic inheritance in nonsyndromic deafness.

          '
      selected_evidence:
        snippet: Our data suggest that mutations in the complex locus DFNB1, which contains two genes
          (GJB2 and GJB6), can result in a monogenic or a digenic pattern of inheritance of prelingual
          deafness.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/0
