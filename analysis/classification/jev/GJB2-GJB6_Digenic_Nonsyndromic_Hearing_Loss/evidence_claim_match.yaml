            loss categories; the WHO report itself is not PubMed-indexed, so the grades are quoted from
            these restatements. No LOINC code was found for the better-ear four-frequency pure-tone average
            these grades read: Monarch KG searches for pure tone average, threshold average, average hearing,
            PTA and hearing level returned none. The range therefore names no loinc_term. A numeric band
            on the panel LOINC:89015-2 would put a number on an instrument, and on any one frequency code
            would misstate what is graded; the average is computed from the eight per-frequency codes
            bound above. LOINC:98422-9 (Hearing loss degree Ear - left) and LOINC:98427-8 (Hearing loss
            degree Ear - right) exist but carry the category, not the dB value, so they are not bound.
            The grading is generic to hearing loss of any cause, not specific to this disease. The severity
            words this entry uses come from its cited clinical sources, which do not necessarily use these
            boundaries.'
        - unit: dB
          population: Earlier WHO grades of hearing impairment (based on the 1991 version), better-ear
            average of 500, 1000, 2000 and 4000 Hz, as tabulated by Olusanya, Davis and Hoffman (WHO Bulletin)
          interpretation_bands:
          - name: 'Grade 0: no impairment'
            upper_bound: 26
            unit: dB
            abnormal_flag: NORMAL
          - name: 'Grade 1: slight impairment'
            lower_bound: 26
            upper_bound: 41
            unit: dB
            abnormal_flag: HIGH
          - name: 'Grade 2: moderate impairment'
            lower_bound: 41
            upper_bound: 61
            unit: dB
            abnormal_flag: HIGH
            severity: MODERATE
          - name: 'Grade 3: severe impairment'
            lower_bound: 61
            upper_bound: 81
            unit: dB
            abnormal_flag: HIGH
            severity: SEVERE
          - name: 'Grade 4: profound impairment including deafness'
            lower_bound: 81
            unit: dB
            abnormal_flag: HIGH
          notes: Superseded scheme, recorded because older clinical literature reports severity on it
            and its boundaries differ from the Global Burden of Disease grades above. The source states
            whole-decibel ranges (25 dB or better, 26-40 dB, 41-60 dB, 61-80 dB, 81 dB or greater); an
            average falling between two stated ranges, such as 25.5 dB, is not assigned by the source
            and falls in the upper grade under the half-open convention used here. The same source records
            that only adults with a permanent unaided impairment above 40 dB hearing level in the better
            ear, and children with more than 30 dB, were regarded as having a disabling hearing impairment.
            Severity is set only where the grade name is moderate or severe. The grading is generic to
            hearing loss of any cause.
      selected_evidence:
        snippet: Audiometric testing, including pure-tone audiometry and auditory evoked brainstem response,
          was also performed to determine the degree of hearing loss.
        supports: SUPPORT
