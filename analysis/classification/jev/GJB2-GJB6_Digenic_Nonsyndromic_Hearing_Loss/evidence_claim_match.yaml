        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
        description: 'Historical interpretation. Patients carrying one GJB2 mutant allele in trans with
          the del(GJB6-D13S1830) deletion were reported in 2002 as double heterozygotes with a digenic
          pattern of inheritance, and the genotype is often cited as the canonical example of digenic
          inheritance in nonsyndromic deafness. GeneReviews now describes these deletions as removing
          GJB2 regulatory regions on the same allele, which makes the genotype a compound heterozygous
          loss of GJB2 expression, that is, monogenic autosomal recessive disease. The REFUTE item below
          records that reading. The binding is kept because the published digenic interpretation is what
          this entry is named after; whether the entry should remain separate from GJB2-related autosomal
          recessive hearing loss is an open scope question.

          '
      selected_evidence:
        snippet: Twenty-two of the 33 subjects were heterozygous for both the GJB6 and GJB2 mutations,
          including all 9 with evidence of linkage to DFNB1.
        supports: SUPPORT
