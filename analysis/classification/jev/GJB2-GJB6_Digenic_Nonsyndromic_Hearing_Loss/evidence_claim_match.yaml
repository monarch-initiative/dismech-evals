              label: autosomal recessive nonsyndromic hearing loss 1A
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cochlear Connexin Gap-Junction Coupling
        description: 'Connexin 26 (GJB2) and connexin 30 (GJB6) co-assemble into the gap-junction plaques
          of the non-sensory epithelial supporting cells and the spiral ligament fibrocytes of the cochlea.
          A GJB2 loss-of-function mutation combined with a GJB6 deletion (or biallelic GJB2 mutation)
          disrupts this shared connexin network and abolishes intercellular coupling.

          '
        genes:
        - preferred_term: GJB2
          term:
            id: hgnc:4284
            label: GJB2
        - preferred_term: GJB6
          term:
            id: hgnc:4288
            label: GJB6
        cell_types:
        - preferred_term: Cochlear supporting cell
          term:
            id: CL:0000630
            label: supporting cell
        biological_processes:
        - preferred_term: Gap junction assembly
          modifier: DECREASED
          term:
            id: GO:0016264
            label: gap junction assembly
      selected_evidence:
        snippet: Immunohistochemical staining of human cochlear cells for Cx26 demonstrated high levels
          of expression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
