              label: autosomal recessive nonsyndromic hearing loss 1A
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Endocochlear Potassium Recycling
        description: 'The cochlear connexin gap-junction networks form the route by which potassium ions
          entering sensory hair cells during mechanotransduction are recycled back to the endolymph. Loss
          of connexin 26/30 coupling interrupts this potassium recycling pathway, disturbing endolymph
          homeostasis.

          '
        cell_types:
        - preferred_term: Cochlear supporting cell
          term:
            id: CL:0000630
            label: supporting cell
        biological_processes:
        - preferred_term: Potassium ion recycling
          modifier: DECREASED
          term:
            id: GO:0006813
            label: potassium ion transport
      selected_evidence:
        snippet: The two networks of gap junctions form the route by which K+ ions that pass through the
          sensory cells during mechanosensory transduction can be recycled back to the endolymphatic space,
          from which they reenter the sensory cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
