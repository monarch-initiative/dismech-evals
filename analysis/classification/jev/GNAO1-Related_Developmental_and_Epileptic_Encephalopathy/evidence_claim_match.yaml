      assertion_type: Pathophysiology
      assertion:
        name: Impaired Gbg Modulation of Presynaptic Calcium Channels
        description: Normally the Gbg subunit released from activated Go inhibits presynaptic voltage-gated
          (Cav2.1/Cav2.2) calcium channels to restrain neurotransmitter release and activates GIRK potassium
          channels. Variant Go disrupts this Gbg-mediated brake, dysregulating synaptic neurotransmitter
          release. This node captures the single concept of the synaptic/ion-channel effector arm and
          conforms to the shared epilepsy final common pathway.
        role: mediator
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Negative regulation of calcium ion transmembrane transport
          term:
            id: GO:1903170
            label: negative regulation of calcium ion transmembrane transport
          modifier: ABNORMAL
        - preferred_term: Regulation of neurotransmitter secretion
          term:
            id: GO:0046928
            label: regulation of neurotransmitter secretion
          modifier: ABNORMAL
      selected_evidence:
        snippet: Gαo-mediated inhibition of calcium currents by norepinephrine tended to be lower in three
          of the four Gαo mutants
        supports: SUPPORT
