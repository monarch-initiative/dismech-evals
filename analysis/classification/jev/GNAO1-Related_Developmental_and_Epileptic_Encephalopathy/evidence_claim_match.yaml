        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Adenylyl Cyclase-cAMP Signaling
        description: As a Gi/o-family subunit, Gao contributes to modulation of adenylyl cyclase-cAMP
          signaling downstream of inhibitory GPCRs; variants perturb this control in either direction.
          In vitro cAMP-inhibition assays classify GNAO1 variants by their effect on this arm - loss-of-function
          (reduced cAMP inhibition) segregates toward the epilepsy pole, whereas gain-of-function (enhanced
          cAMP inhibition) segregates toward the movement pole. This node captures the single concept
          of the second-messenger effector arm, which feeds both output poles.
        role: mediator
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
          term:
            id: GO:0007193
            label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
          modifier: ABNORMAL
      selected_evidence:
        snippet: determined functional Gαo-dependent cyclic adenosine monophosphate (cAMP) inhibition
          with a coexpressed α2A adrenergic receptor
        supports: SUPPORT
