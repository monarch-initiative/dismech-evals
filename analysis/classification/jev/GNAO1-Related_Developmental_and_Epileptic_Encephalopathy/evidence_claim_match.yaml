              id: MONDO:0014199
              label: developmental and epileptic encephalopathy, 17
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gnao1-gof-lof-pole-mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dysregulated Adenylyl Cyclase-cAMP Signaling
        - pathophysiology#Impaired Gbg Modulation of Presynaptic Calcium Channels
        prompt: GNAO1 variants segregate imperfectly into an epilepsy-predominant pole and a movement-predominant
          pole. Which molecular readout - effect on cAMP/adenylyl cyclase signaling versus effect on Gbg-mediated
          presynaptic calcium-channel and neurotransmitter-release control - best predicts which pole
          a given variant will produce, and can that be turned into a treatment-guiding classifier?
        rationale: Unlike the sodium-channel encephalopathies, GNAO1 does not cleanly split into gain-of-function
          versus loss-of-function; variants show heterogeneous effects across distinct downstream arms,
          so which assay best forecasts the clinical pole (and therefore treatment strategy) is unresolved.
        proposed_experiments:
        - experiment_id: gnao1-variant-pole-classifier
          name: GNAO1 variant functional-pole classifier
          description: Systematically assay a large panel of GNAO1 variants for effects on cAMP/adenylyl
            cyclase signaling and on Gbg-mediated presynaptic calcium-channel/GIRK modulation, and benchmark
            each readout against the observed epilepsy-versus-movement clinical pole and drug response.
          readouts:
          - name: Predicted versus observed clinical pole and drug response
            target: pathophysiology#Impaired Go Heterotrimeric G-Protein Signaling
          would_support:
          - pathophysiology#Impaired Gbg Modulation of Presynaptic Calcium Channels
      selected_evidence:
        snippet: There appears to be a strong predictive correlation between the in vitro biochemical
          phenotype and the clinical pattern of epilepsy vs movement disorder
        supports: SUPPORT
