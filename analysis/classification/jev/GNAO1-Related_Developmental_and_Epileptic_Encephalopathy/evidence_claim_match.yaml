  262f10d4053ba29a792271b3a8cb865eb9cb8dbb8c554e8f0f1e4dce4e630bf5:
    claim:
      about:
        disease:
          name: GNAO1-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 17
            term:
              id: MONDO:0014199
              label: developmental and epileptic encephalopathy, 17
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortical Excitation-Inhibition Imbalance
        description: 'Disrupted inhibitory G-protein signaling displaces the balance of excitation and
          inhibition in cortical networks. This node captures the single concept of the cortical network
          imbalance and conforms to the shared epilepsy final common pathway. The direction of the displacement
          is measured discordantly, so this node asserts the imbalance rather than a single sign: cellular
          and model-system work reports loss of inhibitory signaling, i.e. hyperexcitability, whereas
          the one direct measurement of the ratio in patients - resting-state quantitative EEG - reports
          inhibition-dominant alpha dynamics, which its authors read as compensation for underlying hyperexcitability
          rather than as its absence.'
        role: central_effector
