    evidence_metadata:
      reference: PMID:40576155
      reference_title: Neuronal oscillatory imbalances in GNAO1-related disorders associated with disease
        severity.
      evidence_source: HUMAN_CLINICAL
      explanation: The only direct measurement of the cortical excitation-inhibition ratio in patients
        - resting-state qEEG in 12 children with GNAO1-related disorder against 36 age-matched typically
        developing children - establishing that the network ratio is displaced, which is this node's claim.
        It also fixes the sign of that displacement at rest as inhibition-dominant, so the hyperexcitability
        asserted downstream of this node follows only through the authors' reading of the inhibitory state
        as compensatory.
