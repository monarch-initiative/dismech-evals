    claim:
      about:
        disease:
          name: GNE Myopathy
          disease_term:
            preferred_term: GNE Myopathy
            term:
              id: MONDO:0011603
              label: GNE myopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: GNE Biallelic Hypomorphic Variants
        gene_term:
          preferred_term: GNE
          term:
            id: hgnc:23657
            label: GNE
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Biallelic, homozygous or compound heterozygous, variants in GNE at 9p13.3. More than
          255 variants have been reported, predominantly missense and distributed across both the epimerase
          and kinase catalytic domains. Founder alleles dominate the epidemiology: p.Met743Thr in Middle
          Eastern and Persian Jewish populations, p.Val603Leu and p.Asp207Val in Japan. Complete biallelic
          loss of function is not compatible with the human phenotype, since Gne knockout is embryonic
          lethal in mouse, so surviving genotypes retain residual activity. Non-coding and structural
          variants are under-ascertained: deep intronic variants and a large insertion have been found
          only by genome and long-read sequencing, so a negative coding panel does not exclude the diagnosis.'
        frequency: OBLIGATE
        notes: 'Nomenclature hazard. GNE has two commonly cited transcripts and the older literature uses
          the shorter one, so every variant published before 2014 is offset by 31 residues: p.Met712Thr
          is p.Met743Thr, p.Val572Leu is p.Val603Leu, and p.Asp176Val is p.Asp207Val. Variants here are
          given in current NM_001128227 numbering. The mouse-model literature uses the legacy names, which
          is why the animal_models entry below looks as though it concerns a different allele when it
          does not.'
      selected_evidence:
        snippet: Our findings indicate that GNE is the gene responsible for recessive HIBM.
        supports: SUPPORT
