          pilot established target engagement, with free sialic acid rising in both dose groups and not
          in placebo, and reported improved proximal limb power at the higher dose. A subsequent placebo-controlled
          trial in eleven participants found a statistically significant difference in the increase in
          posterior thigh fat fraction on MRI, the imaging correlate of muscle degeneration; the anterior
          thigh and both lower-leg regions did not separate from placebo. Muscle strength did not differ
          between the groups either, with one carve-out the authors state explicitly: hand grip power
          fell in both arms, reaching significance only in the placebo arm. That asymmetry is a signal
          rather than a result, since with five and six participants per arm a decline failing to reach
          significance under treatment is as consistent with low power as with preservation, and the authors
          attribute the overall null to how little strength either group lost. Both trials are small and
          the strength endpoints were negative, so this is promising rather than established.'
