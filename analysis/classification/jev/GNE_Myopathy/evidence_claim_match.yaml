      assertion_type: Discussion
      assertion:
        discussion_id: gne_amyloid_causal_weight
        kind: OPEN_QUESTION
        prompt: Is beta-amyloid accumulation mechanistically upstream of myofiber atrophy in GNE myopathy,
          or a downstream marker of failed autophagic clearance?
        attaches_to:
        - pathophysiology#Amyloid and Misfolded Protein Accumulation
        rationale: The mouse model shows amyloid deposition preceding rimmed vacuole formation by ten
          weeks, which is consistent with amyloid being upstream but does not establish it, since both
          could be downstream of a shared clearance failure. Review literature has argued for a mechanistic
          role while stating plainly that the cause and process of amyloid formation in this disease are
          unclear. The entry therefore places amyloid in the chain with an indirect causal link to atrophy
          and unknown intermediates rather than asserting a direct one.
      selected_evidence:
        snippet: A compelling finding is the development of beta-amyloid deposition in myofibers by 32
          weeks, which clearly precedes RV formation at 42 weeks.
        supports: SUPPORT
