              label: GNE myopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gne_tissue_restriction_paradox
        kind: KNOWLEDGE_GAP
        prompt: Why is a systemic enzyme deficiency that lowers sialic acid in serum, muscle, and other
          organs expressed as a disease of skeletal muscle alone?
        attaches_to:
        - pathophysiology#Hyposialylation of Muscle Glycoproteins
        rationale: The enzymatic block is everywhere and the mouse model shows marked hyposialylation
          in serum, muscle, and other organs, yet the clinical disease is essentially confined to skeletal
          muscle. Two partial answers exist and neither closes the question. The quadriceps sparing observation
          shows that baseline sialic acid requirement differs between muscles, which suggests demand rather
          than supply sets vulnerability. And the total-versus-free sialic acid discrepancy suggests only
          a small subset of sialylation targets is pathogenically relevant. Identifying that target set
          is the field's central open question, and until it is answered the tissue restriction is described
          rather than explained.
      selected_evidence:
        snippet: Interestingly, these mice exhibit marked hyposialylation in serum, muscle and other organs.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17704511
      reference_title: A Gne knockout mouse expressing human GNE D176V mutation develops features similar
        to distal myopathy with rimmed vacuoles or hereditary inclusion body myopathy.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that the biochemical deficit is systemic while the disease is not, which
        is the paradox itself.
