        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gne_sialic_acid_trial_discordance
        kind: CONTROVERSY
        prompt: Does oral sialic acid replacement modify the course of GNE myopathy, given that a Class
          I international trial was negative and Japanese trials were equivocal-to-positive enough to
          support approval?
        attaches_to:
        - treatments#Aceneuramic Acid Extended-Release (Sialic Acid Replacement)
        rationale: Both results are real and this entry declines to pick between them. The international
          phase 3 gave Class I evidence of no benefit on muscle strength. The Japanese phase II/III missed
          its primary covariance analysis and reached significance only on a repeated-measures analysis
          in 20 patients; the confirmatory Japanese study in a smaller cohort showed a numerically smaller
          decline with a confidence interval crossing zero, which its authors call a trend. Approval followed
          in Japan in 2024. Candidate reconciliations include differences in cohort genotype, disease
          stage at enrolment, statistical approach, and endpoint sensitivity, none of which has been tested
          directly. A curator should not present either result alone.
      selected_evidence:
        snippet: This study provides Class I evidence that for patients with GNE myopathy, Ace-ER does
          not improve muscle strength compared to placebo.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
