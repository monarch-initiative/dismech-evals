            term:
              id: MONDO:0011603
              label: GNE myopathy
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Sporadic Inclusion Body Myositis
        description: The most expensive naming collision in this area. Both carry inclusion body in the
          name and both show rimmed vacuoles, but sporadic inclusion body myositis is an inflammatory,
          late-onset, non-Mendelian disease with a completely different mechanism. The discriminating
          histological feature is inflammation, which is present there and absent here, and which is precisely
          why the GeneReviews diagnostic criterion names the absence of inflammation explicitly.
        distinguishing_features:
        - Inflammatory infiltrate present in sporadic inclusion body myositis, absent here
        - Late onset after age 50 rather than in the twenties or thirties
        - Sporadic rather than autosomal recessive, with no GNE variants
        - Quadriceps involvement is characteristic rather than spared
      selected_evidence:
        snippet: The diagnosis of GNE myopathy is suspected in a proband with suggestive clinical findings
          and muscle histopathology (rimmed vacuoles, no inflammation) and is established by the presence
          of biallelic pathogenic variants in GNE identified by molecular genetic testing.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20301439
      reference_title: GNE Myopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: The explicit no-inflammation criterion is the histological separator from sporadic
