            term:
              id: MONDO:0011603
              label: GNE myopathy
        context: []
      assertion_type: Treatment
      assertion:
        name: N-Acetylmannosamine (ManNAc)
        description: 'The upstream precursor, and mechanistically the more interesting option: ManNAc
          enters the pathway downstream of the defective epimerase step, so it bypasses an epimerase block,
          and the phase 1 study showed it restores intracellular sialic acid synthesis even in patients
          homozygous for kinase-domain variants. An open-label phase 2 reported increased plasma sialic
          acid, increased sarcolemmal sialylation, and a slower rate of strength decline. The comparator
          there was historical natural history rather than placebo, which is the limitation that a placebo-controlled
          trial is meant to resolve.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: N-acetyl-D-mannosamine
            term:
              id: CHEBI:63153
              label: N-acetyl-D-mannosamine
      selected_evidence:
        snippet: Given that Neu5Ac is known to have a short half-life, the prolonged elevation of Neu5Ac
          after a single dose of ManNAc suggests that intracellular biosynthesis of sialic acid was restored
          in subjects with GNE myopathy, including those homozygous for mutations in the kinase domain.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
