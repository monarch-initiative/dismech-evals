              label: GNE myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic GNE Variants and Enzymatic Block
        biological_scale: MOLECULAR
        description: 'GNE encodes one polypeptide carrying two enzyme activities, UDP-GlcNAc 2-epimerase
          and N-acetylmannosamine kinase, which together run the first committed and rate-limiting steps
          of sialic acid synthesis. Biallelic hypomorphic variants, predominantly missense and distributed
          across both catalytic domains, reduce that throughput. The variants must be hypomorphic rather
          than null: Gne knockout is embryonic lethal in mouse, so every surviving human genotype retains
          residual enzyme activity, and that is why curating these alleles as complete loss of function
          overstates the lesion.'
        genes:
        - preferred_term: GNE
          term:
            id: hgnc:23657
            label: GNE
        molecular_functions:
        - preferred_term: UDP-N-acetylglucosamine 2-epimerase activity
          term:
            id: GO:0008761
            label: UDP-N-acetylglucosamine 2-epimerase activity
          modifier: DECREASED
        - preferred_term: N-acetylmannosamine kinase activity
          term:
            id: GO:0009384
            label: N-acylmannosamine kinase activity
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: GNE
            term:
              id: hgnc:23657
              label: GNE
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: 'Biallelic GNE alleles, homozygous (founder p.Met743Thr in Middle Eastern families)
            or compound heterozygous. Recorded as PARTIAL_LOSS_OF_FUNCTION: disease alleles are hypomorphic
            missense changes that retain residual epimerase/kinase activity, and complete loss of GNE
            is embryonic lethal in mice.'
      selected_evidence:
        snippet: Our findings indicate that GNE is the gene responsible for recessive HIBM.
        supports: SUPPORT
