      assertion_type: Diagnosis
      assertion:
        name: Clinical and Histopathological Suspicion
        description: The diagnosis is suspected from adult-onset distal weakness beginning with foot drop,
          relative quadriceps sparing, and muscle histopathology showing rimmed vacuoles without inflammation.
          The absent inflammation is what separates this from sporadic inclusion body myositis, and the
          naming collision between the two makes stating that negative explicitly worthwhile.
      selected_evidence:
        snippet: The diagnosis of GNE myopathy is suspected in a proband with suggestive clinical findings
          and muscle histopathology (rimmed vacuoles, no inflammation) and is established by the presence
          of biallelic pathogenic variants in GNE identified by molecular genetic testing.
        supports: SUPPORT
