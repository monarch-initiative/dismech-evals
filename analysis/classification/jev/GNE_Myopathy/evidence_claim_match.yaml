  1e31906c8e744b713ca27cc9bd38b481966c205cb2b6bf4d71b7c1609bd5d07c:
    claim:
      about:
        disease:
          name: GNE Myopathy
          disease_term:
            preferred_term: GNE Myopathy
            term:
              id: MONDO:0011603
              label: GNE myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hyposialylation of Muscle Glycoproteins
        biological_scale: MOLECULAR
        description: 'Muscle glycoproteins carry less sialic acid than they should. Two things should
          be said carefully here. First, the specific glycoprotein target or targets whose undersialylation
          is actually pathogenic have not been definitively identified, and the sialic acid measurements
          themselves hint that the set is small: total sialic acid differences between patients and controls
          were less distinct and more variable than the free pool differences. Second, that hyposialylation
          is causal rather than incidental was established by rescue in the mouse, and the authors of
          that rescue were careful to call it one of the key factors rather than the whole story.'
        biological_processes:
        - preferred_term: protein sialylation
          term:
            id: GO:1990743
            label: protein sialylation
          modifier: DECREASED
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: By showing that muscle atrophy and weakness are completely prevented in a mouse model
          of DMRV-hIBM after treatment with sialic acid metabolites orally, we provide evidence that hyposialylation
          is indeed one of the key factors in the pathomechanism of DMRV-hIBM.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19448634
      reference_title: Prophylactic treatment with sialic acid metabolites precludes the development of
        the myopathic phenotype in the DMRV-hIBM mouse model.
      evidence_source: MODEL_ORGANISM
      explanation: The pivotal causality proof, quoted with the authors' own hedge that hyposialylation
        is one of the key factors rather than the sole cause.
