              label: GNE myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autophagic Block and Proteostasis Failure
        biological_scale: CELLULAR
        description: Rimmed vacuoles are not vacuoles in the naive sense; they are accumulated autophagic
          material, and recent isogenic-model work supplies an actual signaling chain for why the material
          accumulates. Excessive extracellular matrix production drives aberrant activation of a noncanonical
          AKT-mTORC1 pathway, which phosphorylates and inhibits ULK1 and so suppresses autophagy initiation.
          Reactivating autophagy by PI3K inhibition restores ULK1 activity in patient-derived neuromuscular
          organoids, which is what makes this a causal chain rather than a correlation.
        biological_processes:
        - preferred_term: macroautophagy
          term:
            id: GO:0016236
            label: macroautophagy
          modifier: DECREASED
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: By performing transcriptome analysis on two independent GNE myoblast models derived from
          human pluripotent stem cells, we identified multiple autophagy-related gene sets as pathogenic
          signatures of GNE myopathy.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41963465
      reference_title: Defective autophagy in GNE myopathy is rescued by inhibition of noncanonical Akt-mTORC1
