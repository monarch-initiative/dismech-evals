          with the opposite pattern?
        attaches_to:
        - pathophysiology#Myofiber Atrophy and Degeneration
        rationale: Quadriceps sparing with anterior-compartment onset is the single most useful diagnostic
          discriminator in this disease, and it now has a biochemical explanation in the lower baseline
          sialic acid requirement of normal quadriceps. But at least one family broke the pattern entirely,
          with severe posterior calf involvement and a spared anterior compartment. The entry states the
          rule because it is diagnostically load-bearing, and records the exception so the rule is not
          read as absolute.
