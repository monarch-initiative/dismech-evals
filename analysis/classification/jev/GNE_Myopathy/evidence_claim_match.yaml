      assertion:
        burden_level: HIGH
        rationale: Onset falls in early working life and the disease is relentlessly progressive to wheelchair
          dependence over one to two decades, with late respiratory involvement. There is no approved
          disease-modifying therapy outside Japan, and the one Class I trial of the mechanism-matched
          therapy was negative. Function declines measurably even over a single year of observation.
