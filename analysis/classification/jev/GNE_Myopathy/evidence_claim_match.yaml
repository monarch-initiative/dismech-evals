      assertion_type: Treatment
      assertion:
        name: Aceneuramic Acid Extended-Release (Sialic Acid Replacement)
        description: The mechanism-matched therapy, and a genuinely split evidence base that this entry
          records in both directions rather than picking a side. An international phase 3 trial provided
          Class I evidence that extended-release sialic acid does not improve muscle strength compared
          with placebo. A smaller Japanese phase II/III trial missed significance on its primary covariance
          analysis and reached significance only on a repeated-measures analysis, and a confirmatory Japanese
          study showed a numerically smaller decline whose confidence interval crossed zero, described
          by its own authors as a trend. On that basis the N-acetylneuraminic acid extended-release tablet
          was approved in Japan in 2024, the first drug approved anywhere for this disease. It is not
          approved elsewhere.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: N-acetylneuraminic acid
            term:
              id: CHEBI:17012
              label: N-acetylneuraminic acid
      selected_evidence:
        snippet: Ace-ER was not superior to placebo in improving muscle strength and function in patients
          with GNE myopathy.
        supports: REFUTE
