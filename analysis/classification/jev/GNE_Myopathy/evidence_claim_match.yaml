  bf27e36de796e79f41e5c2caf0a4dcf040947f354ed0199500278d3ea3fe0d7e:
    claim:
      about:
        disease:
          name: GNE Myopathy
          disease_term:
            preferred_term: GNE Myopathy
            term:
              id: MONDO:0011603
              label: GNE myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hyposialylation of Muscle Glycoproteins
        biological_scale: MOLECULAR
        description: 'Muscle glycoproteins carry less sialic acid than they should. Two things should
          be said carefully here. First, the specific glycoprotein target or targets whose undersialylation
          is actually pathogenic have not been definitively identified, and the sialic acid measurements
          themselves hint that the set is small: total sialic acid differences between patients and controls
          were less distinct and more variable than the free pool differences. Second, that hyposialylation
          is causal rather than incidental was established by rescue in the mouse, and the authors of
          that rescue were careful to call it one of the key factors rather than the whole story.'
        biological_processes:
        - preferred_term: protein sialylation
          term:
            id: GO:1990743
            label: protein sialylation
          modifier: DECREASED
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: Differences in mean total SA levels in muscle from patients compared with normal controls
          were less distinct and more variable between different muscles, suggesting a small subset of
          sialylation targets could be responsible for the pathogenesis of GNEM.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28267778
      reference_title: Substantial deficiency of free sialic acid in muscles of patients with GNE myopathy
        and in a mouse model.
      evidence_source: HUMAN_CLINICAL
      explanation: Suggests the pathogenic target set is narrow. PARTIAL because it is an inference the
        authors themselves frame as a suggestion, and no specific target glycoprotein is identified.
