              label: GNE myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Free Sialic Acid Depletion
        biological_scale: MOLECULAR
        description: 'The best-quantified node in the disease, and the one that also explains its most
          distinctive clinical sign. Serum free sialic acid is 18% below age-matched controls, but muscle
          free sialic acid is down 72 to 85%, so the deficit is far more severe in the tissue that gets
          sick. The quadriceps sparing rule falls out of the same measurements: normal quadriceps already
          runs on 39% less free sialic acid than normal gastrocnemius, so it has less to lose when supply
          is throttled.'
        biological_processes:
        - preferred_term: N-acetylneuraminate biosynthetic process
          term:
            id: GO:0046380
            label: N-acetylneuraminate biosynthetic process
          modifier: DECREASED
        chemical_entities:
        - preferred_term: N-acetylneuraminic acid
          term:
            id: CHEBI:17012
            label: N-acetylneuraminic acid
          modifier: DECREASED
        locations:
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
      selected_evidence:
        snippet: These results show that serum and muscle free SA is severely reduced in GNEM, which is
          consistent with the biochemical defect in SA synthesis associated with GNE mutations.
        supports: SUPPORT
