      assertion_type: Subtype
      assertion:
        name: Kinase-domain
        display_name: Kinase-domain variant genotypes
        description: Genotypes with variants affecting the N-acetylmannosamine kinase domain. Recorded
          separately because the phase 1 N-acetylmannosamine study explicitly showed restored intracellular
          sialic acid biosynthesis in subjects homozygous for kinase-domain variants, which was not a
          foregone conclusion for a precursor entering upstream of that step.
      selected_evidence:
        snippet: Given that Neu5Ac is known to have a short half-life, the prolonged elevation of Neu5Ac
          after a single dose of ManNAc suggests that intracellular biosynthesis of sialic acid was restored
          in subjects with GNE myopathy, including those homozygous for mutations in the kinase domain.
        supports: SUPPORT
    origin:
