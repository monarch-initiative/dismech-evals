      reference_title: Safety, pharmacokinetics and sialic acid production after oral administration of
        N-acetylmannosamine (ManNAc) to subjects with GNE myopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the kinase-domain genotype is a separately relevant pharmacological
        category, and that the precursor works in it.
