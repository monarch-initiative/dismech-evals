              label: transient infantile hypertriglyceridemia and hepatosteatosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: acyl_dhap_diversion
        hypothesis_label: Diversion of excess DHAP into glycerolipid synthesis through the acyl-DHAP route
        status: EMERGING
        description: With GPD1 absent, DHAP produced by glycolysis is not reduced to G3P and is proposed
          to be acylated directly, entering glycerolipid synthesis through the acyl-DHAP pathway and driving
          hepatocellular triglyceride accumulation. The proposal is consistent with the raised DHAP and
          lowered G3P measured in Gpd1-null mouse tissue, but neither hepatic DHAP, acyl-DHAP flux nor
          hepatic G3P has been measured in a patient.
      selected_evidence:
        snippet: The mechanism of fatty liver in our patient may be due to acylation of excess DHAP.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24549054
      reference_title: A compound heterozygous mutation in GPD1 causes hepatomegaly, steatohepatitis,
        and hypertriglyceridemia.
      evidence_source: OTHER
      explanation: The authors' own mechanistic proposal, stated as a possibility in the discussion of
        a single case; no metabolite or flux measurement accompanies it, hence OTHER.
