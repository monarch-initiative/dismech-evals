        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Hepatocyte Triglyceride Accumulation
        - animal_models#Mouse
        prompt: Why does loss of GPD1 cause hepatic steatosis and hypertriglyceridemia in children, when
          the Gpd1-null mouse is protected from ethanol-induced hepatic triglyceride accumulation, oxidizes
          more fat and gains less weight?
        rationale: The mouse data fit the expectation that GPD1 supplies the glycerol backbone for hepatic
          triglyceride, so its loss should reduce triglyceride. Patients show the opposite. Either the
          human phenotype arises through a route the mouse does not use (the acyl-DHAP pathway has been
          proposed), or the mouse phenotyping has not tested the conditions that matter in infants, such
          as a milk-based high-fat diet. Until the discrepancy is explained, none of the proposed hepatic
          mechanisms can be regarded as tested.
      selected_evidence:
        snippet: On the other hand, in GPD1 null mice carrying normal GYK activity, no significant increase
          in hepatic TG level was observed after acute ethanol intake.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
