              label: transient infantile hypertriglyceridemia and hepatosteatosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hepatic_g3p_retention
        hypothesis_label: Reduced G3P-to-DHAP conversion increases hepatic G3P for triglyceride synthesis
        status: EMERGING
        description: Proposes that hypertriglyceridemia results because loss of GPD1 prevents oxidation
          of G3P back to DHAP, enlarging the hepatic G3P pool available for triglyceride synthesis. This
          runs opposite to the acyl-DHAP proposal on the direction of the metabolite change, and opposite
          to the low tissue G3P and high DHAP measured in the Gpd1-null mouse. It has not been tested
          in patient tissue.
      selected_evidence:
        snippet: Hypertriglyceridemia may result from reduced conversion of G3P to DHAP, increasing the
          hepatic G3P for triglyceride synthesis.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
