      assertion_type: Pathophysiology
      assertion:
        name: Impaired Glycerol-3-Phosphate Shuttle
        description: GPD1 and mitochondrial GPD2 together carry cytosolic reducing equivalents into mitochondria.
          In the Gpd1-null mouse the nonfunctional shuttle lowers the cytosolic NAD/NADH ratio and blocks
          glycolysis at glyceraldehyde-phosphate dehydrogenase, chiefly in skeletal muscle, where exercised
          mice could not maintain ATP. No human phenotype has been attributed to this node; muscle and
          brain energy metabolism have not been studied in patients, so it has no downstream phenotype.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: glycerol-3-phosphate shuttle
          term:
            id: GO:0006127
            label: glycerol-3-phosphate shuttle
          modifier: DECREASED
      selected_evidence:
        snippet: When exercised, mice were unable to maintain normal ATP levels in skeletal muscle.
        supports: SUPPORT
