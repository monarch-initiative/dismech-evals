        description: G3P formed from glycerol must be oxidized to DHAP by GPD1 to enter gluconeogenesis.
          Gpd1-null mice make less glucose from glycerol, but after one to four hours of fasting their
          blood glucose is higher than controls, with a compensatory shift to alanine-driven gluconeogenesis.
          Because the model compensates rather than becoming hypoglycemic, this node is not wired to the
          hypoglycemia seen in about one in ten patients; that phenotype has no sourced mechanism.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: gluconeogenesis
          term:
            id: GO:0006094
            label: gluconeogenesis
          modifier: DECREASED
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Although these data indicate that a lack of GPD1 inhibits gluconeogenesis from glycerol,
          chronic GPD1 deficiency may induce an adaptation that enhances gluconeogenesis from glycogenic
          amino acids.
        supports: SUPPORT
