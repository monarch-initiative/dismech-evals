      assertion_type: Pathophysiology
      assertion:
        name: GPD1 Loss of Function
        description: Biallelic GPD1 variants (splice-site, nonsense, frameshift, missense and a whole-gene
          deletion) abolish or reduce the cytosolic NAD+-dependent glycerol-3-phosphate dehydrogenase.
          The founding homozygous splice-acceptor variant c.361-1G>C produces aberrantly spliced mRNA
          predicted to truncate the protein, and GPD1 protein was absent on western blot of liver from
          a compound heterozygote carrying a deletion and p.Arg229Gln. Enzyme activity has not been reported
          for most missense alleles.
        role: trigger
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: GPD1
          term:
            id: hgnc:4455
            label: GPD1
        molecular_functions:
        - preferred_term: glycerol-3-phosphate dehydrogenase (NAD+) activity
          term:
            id: GO:0141152
            label: glycerol-3-phosphate dehydrogenase (NAD+) activity
          modifier: LOSS_OF_FUNCTION
        cellular_components:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Mutation analysis revealed a homozygous splicing mutation, c.361-1G>C, which resulted
          in an aberrantly spliced mRNA in the ten affected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
