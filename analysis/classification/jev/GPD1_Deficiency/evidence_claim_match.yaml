              label: transient infantile hypertriglyceridemia and hepatosteatosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hepatic_triglyceride_secretion
        hypothesis_label: Increased hepatic triglyceride secretion drives the hypertriglyceridemia
        status: EMERGING
        description: Proposes that the plasma hypertriglyceridemia reflects increased secretion of triglyceride
          by hepatocytes, based on a single HepG2 experiment in which a mutant GPD1 cDNA was overexpressed
          on top of the endogenous enzyme. That design tests whether the mutant protein does something,
          not what its absence does, so it is weak support for a loss-of-function mechanism. A later review
          restating the founding paper lists decreased hepatic triglyceride output instead, so the direction
          of hepatic export is itself unsettled.
      selected_evidence:
        snippet: Overexpression of mutant GPD1 in HepG2 cells, in comparison to overexpression of wild-type
          GPD1, resulted in increased secretion of triglycerides (p = 0.01).
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22226083
      reference_title: Transient infantile hypertriglyceridemia, fatty liver, and hepatic fibrosis caused
        by mutated GPD1, encoding glycerol-3-phosphate dehydrogenase 1.
      evidence_source: IN_VITRO
      explanation: The single experimental observation behind the secretion proposal.
