        prompt: Is GPD1 deficiency a transient infantile disorder, as its MONDO and Orphanet names state,
          or a persistent liver and lipid disorder whose infantile peak is followed by long-lasting milder
          disease?
        rationale: The founding cohort showed triglycerides declining with age, and Orphanet still describes
          reduction or normalization with age. Pooled follow-up of later cases finds triglycerides normalizing
          in under a third, fibrosis that can progress to cirrhosis, and persistent hypertriglyceridemia
          into adulthood. The answer determines whether surveillance should continue into adulthood. It
          is limited by short follow-up, selective biopsy, and the few adults reported.
      selected_evidence:
        snippet: Reduction or normalization of triglyceride serum levels occurs with advancing age.
