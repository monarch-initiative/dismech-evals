          liver disease has not been reported. Biopsy is done selectively, so the fibrosis and cirrhosis
          fractions among biopsied patients overstate their frequency in all patients. Conformance to
          the fibrosis node of the steatosis module is not claimed, because stellate-cell activation has
          not been examined in this disorder.
