      assertion_type: Pathophysiology
      assertion:
        name: GRIN1 Variant and Altered GluN1/NMDA Receptor Function
        description: De novo heterozygous missense variants (clustered in the transmembrane, pore, and
          ligand-binding domains) or biallelic missense/truncating variants in GRIN1 alter GluN1, the
          obligatory subunit of the NMDA receptor. Because every NMDA receptor contains two GluN1 subunits,
          these variants perturb the glutamate-gated, calcium-permeable channel that mediates excitatory
          neurotransmission across the developing brain.
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        molecular_functions:
        - preferred_term: NMDA glutamate receptor activity
          term:
            id: GO:0004972
            label: NMDA glutamate receptor activity
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: glutamate receptor signaling
          term:
            id: GO:0007215
            label: glutamate receptor signaling pathway
          modifier: ABNORMAL
      selected_evidence:
        snippet: Mutations cluster within transmembrane segments and result in loss of channel function
          of varying severity with a dominant-negative effect.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
