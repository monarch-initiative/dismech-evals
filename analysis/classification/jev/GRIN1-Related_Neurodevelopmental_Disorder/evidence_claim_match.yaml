  22431c0acd1a6990a97ec8d3c3136f0d75786185a0f6f39846d9624e4a33021d:
    claim:
      about:
        disease:
          name: GRIN1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: GRIN1-related complex neurodevelopmental disorder
            term:
              id: MONDO:1060123
              label: GRIN1-related complex neurodevelopmental disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_grin1_gof_vs_lof_precision_therapy
        prompt: Can GRIN1 variants be reliably partitioned into gain-of-function and loss-of-function
          classes, and does that functional classification predict the correct genotype-directed precision
          therapy (NMDA-receptor channel blockers such as memantine for gain-of-function versus NMDA-receptor
          co-agonist strategies such as L-serine for loss-of-function)?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#NMDA Receptor Gain-of-Function
        - pathophysiology#NMDA Receptor Loss-of-Function
        rationale: GRIN1 variants converge on the same disorder through opposite changes in receptor activity,
          so the gain-of-function versus loss-of-function distinction is potentially the key determinant
          of rational, opposite-direction treatment (channel blockade to damp excess activity versus co-agonist
          supplementation to boost deficient activity). However, functional classification requires electrophysiological
          characterization unavailable for most variants, many variants have mixed or indeterminate effects,
          and the founding cohort noted that the extent of measured loss of function correlated only marginally
          with the uniformly severe clinical phenotype, suggesting secondary compensatory mechanisms.
          Whether functional class prospectively predicts treatment response is central to precision therapy
          for GRIN1-NDD.
        proposed_experiments:
        - experiment_id: exp_grin1_functional_class_to_treatment_map
          name: Functional-class to genotype-directed treatment-response mapping
          description: Characterize a large panel of patient GRIN1 variants with standardized electrophysiology
            (agonist potency, open probability, calcium permeability, magnesium block, surface expression)
            to assign gain- or loss-of-function class, then prospectively correlate class with responses
            to genotype-matched therapy (memantine for gain-of-function; L-serine or other co-agonist
            strategies for loss-of-function).
      selected_evidence:
        snippet: Patients had GRIN2B, GRIN1 and GRIN2A variants (12, 6 and 5 cases, respectively).
        supports: SUPPORT
