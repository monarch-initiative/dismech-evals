      assertion_type: Pathophysiology
      assertion:
        name: NMDA Receptor Loss-of-Function
        description: 'Other GRIN1 variants reduce NMDA receptor function: de novo missense variants lower
          agonist potency and maximal current (frequently with a dominant-negative effect on hetero-oligomeric
          receptors), while biallelic truncating variants abolish receptor assembly. Because two GluN1
          subunits are obligatory, loss of both alleles produces a functional NMDA-receptor knockout.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: glutamate receptor signaling
          term:
            id: GO:0007215
            label: glutamate receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: As the NMDAR obligatorily contains 2 GluN1 subunits, truncation or lack of both GRIN1
          alleles would result in a knock-out and complete deprivation of the NMDAR.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
