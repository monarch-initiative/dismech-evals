          cerebral atrophy and a thin corpus callosum associated with subtle abnormalities of the white
          matter including hypomyelination of the terminal zones and the temporal lobes. ... Neuroimaging
          revealed widespread cerebral parenchymal volume loss, a thin corpus callosum, and abnormal myelination
          of the terminal zones and temporal lobes bilaterally. The cerebellum and brainstem were relatively
          spared (Fig.1B–D). These findings reflected progression compared to previous studies.
        supports: SUPPORT
