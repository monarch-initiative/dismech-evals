        - experiment_id: exp_grin2a_spontaneous_vs_induced_seizure_concordance
          name: Spontaneous versus induced seizure phenotyping across Grin2a models
          description: Perform long-term continuous video-EEG in heterozygous Grin2a gain-of-function
            knock-in mice to quantify spontaneous seizure burden, and compare that burden and its pharmacological
            responsiveness against the same animals' induced-seizure thresholds, to establish which readout
            predicts human treatment response.
        - experiment_id: exp_grin2a_human_neuron_circuit_validation
          name: Patient-derived neuronal network validation
          description: Compare excitability, bursting, and synchronicity phenotypes and drug responses
            between mouse knock-in cortical networks and isogenic patient-derived iPSC neuronal or organoid
            networks carrying the same GRIN2A variant, to determine whether the human cellular substrate
            reproduces the mouse discordance.
      selected_evidence:
        snippet: Heterozygous adults displayed susceptibility to induced generalized seizures, hyperactivity,
          repetitive and reduced anxiety behaviours, plus several unexpected features, including significant
          resistance to electrically-induced limbic seizures and to pentylenetetrazole induced tonic-clonic
          seizures.
