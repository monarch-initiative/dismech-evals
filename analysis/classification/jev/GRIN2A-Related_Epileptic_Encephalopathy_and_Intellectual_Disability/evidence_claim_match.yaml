      assertion_type: Discussion
      assertion:
        discussion_id: grin2a_dee_motor_tone_and_visual_phenotype_mechanisms
        prompt: Through which circuits does GRIN2A gain-of-function produce the dissociated tone pattern
          (axial hypotonia with appendicular hypertonia), the diffuse hyporeflexia, the hyperkinetic movement
          disorder, and the cerebral visual impairment of the severe phenotype?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Axial Hypotonia
        - phenotypes#Appendicular Hypertonia
        - phenotypes#Hyporeflexia
        - phenotypes#Hyperkinetic Movement Disorder
        - phenotypes#Cerebral Visual Impairment
        rationale: These phenotypes are documented clinically in the severe index case, but no study localizes
          any of them to a circuit or mechanism. NMDA receptors are ubiquitous in motor, brainstem, spinal,
          basal-ganglia, and visual pathways, so several routes are plausible - subcortical or corticospinal
          involvement for the dissociated tone, basal-ganglia dysfunction for the flinging hyperkinesia,
          visual-cortex dysfunction or the diffuse parenchymal loss for the cerebral visual impairment
          - and the closest the literature comes is a single, explicitly probabilistic sentence attributing
          motor dysfunction and other neurological features to excitotoxic drive. Wiring these phenotypes
          to the cortical excitation-inhibition-imbalance or synaptic-maturation nodes would therefore
          exceed the evidence, and they are deliberately left without causal edges.
      selected_evidence:
        snippet: In our proband, this likely led to neuronal loss, motor dysfunction, cognitive impairment,
          and the other neurological features.
        supports: SUPPORT
        directness: INDIRECT
