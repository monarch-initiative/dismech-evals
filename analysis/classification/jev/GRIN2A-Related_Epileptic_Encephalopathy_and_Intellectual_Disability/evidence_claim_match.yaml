      reference: PMID:30146685
      reference_title: Transient microstructural brain anomalies and epileptiform discharges in mice defective
        for epilepsy and language-related NMDA receptor subunit gene Grin2a.
      evidence_source: MODEL_ORGANISM
      explanation: 'A direct counterpoint: in the Grin2a knockout mouse the microstructural anomalies
        are transient rather than progressive, the opposite temporal profile to the human severe phenotype.
        Because the model is a knockout (loss-of-function) and the severe human phenotype is predominantly
        gain-of-function, this discordance may localize progressive tissue loss to the gain-of-function
        arm.'
