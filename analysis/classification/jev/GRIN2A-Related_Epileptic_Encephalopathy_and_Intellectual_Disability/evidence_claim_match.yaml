              mutation
            term:
              id: MONDO:0017325
              label: early-onset epileptic encephalopathy and intellectual disability due to GRIN2A mutation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: grin2a_dee_functional_class_precision_therapy
        prompt: Can a GRIN2A variant's functional class be assigned reliably enough, and early enough,
          to direct opposite precision therapies (NMDA-receptor channel blockade for gain-of-function
          versus co-agonist supplementation for loss-of-function) before irreversible developmental injury
          has occurred?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#NMDA Receptor Gain-of-Function
        - pathophysiology#NMDA Receptor Loss-of-Function
        rationale: 'This disorder is unusual in that two available therapies point in opposite directions
          and each is potentially harmful in the wrong functional class: L-serine is explicitly contraindicated
          in gain-of-function variants and has caused immediate behavioral deterioration when given in
          error, and NMDA-receptor blockers are to be used with caution in loss-of-function and null variants.
          Domain localization predicts functional class only probabilistically (transmembrane and linker
          missense variants predominantly rather than invariably cause gain-of-function), some variants
          have mixed biophysical effects (p.Asn615Lys abolishes magnesium block while decreasing calcium
          permeability), and definitive assignment requires electrophysiological characterization unavailable
          for most novel variants. Meanwhile the developmental injury the therapy is meant to prevent
          accrues in infancy. Whether prediction can be made accurate and fast enough to be actionable
          is the central open translational question for this entity.'
        proposed_experiments:
        - experiment_id: exp_grin2a_prospective_functional_stratified_trial
          name: Prospective functional-class-stratified precision-therapy trial
          description: Prospectively characterize newly identified GRIN2A variants with a standardized
            electrophysiology panel (agonist potency, deactivation kinetics, magnesium block, calcium
            permeability, surface expression) within a defined turnaround time, assign patients to memantine
            or a GluN2-subunit-selective negative allosteric modulator versus L-serine on that basis,
            and compare seizure, EEG, and developmental outcomes against unstratified historical controls.
            Include a prespecified analysis of whether domain localization alone predicts the assay result
            well enough to substitute for it.
        - experiment_id: exp_grin2a_variant_to_blocker_potency_map
          name: Variant-to-blocker potency map
          description: Systematically measure the potency of each available NMDA-receptor channel blocker
            (memantine, dextromethorphan, dextrorphan, amantadine, ketamine) and of GluN2-subunit-selective
            negative allosteric modulators against a panel of recombinant receptors carrying each reported
            GRIN2A gain-of-function variant, and test whether distance from the blocker binding site predicts
            clinical response.
      selected_evidence:
        snippet: In individuals with GRIN2A-related disorders due to pathogenic missense variants activating
          the NMDAR (i.e., gain-of-function variants), receptor-specific agonists and other activators
          (e.g., L-serine) should be avoided as this could result in worsening of symptoms.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27683935
      reference_title: GRIN2A-Related Disorders.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the bidirectional harm potential that makes correct functional classification
        essential.
