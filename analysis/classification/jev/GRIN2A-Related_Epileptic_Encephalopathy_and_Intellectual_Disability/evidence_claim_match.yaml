  3bcc58a9a10b0e5046cedd099627381a06046a02ca85cac096a69b06e19edf9d:
    claim:
      about:
        disease:
          name: GRIN2A-Related Epileptic Encephalopathy and Intellectual Disability
          disease_term:
            preferred_term: early-onset epileptic encephalopathy and intellectual disability due to GRIN2A
              mutation
            term:
              id: MONDO:0017325
              label: early-onset epileptic encephalopathy and intellectual disability due to GRIN2A mutation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GRIN2A Missense Variant in the Transmembrane and Linker Domains
        description: A heterozygous, typically de novo, GRIN2A missense variant falling in the transmembrane
          domains or the linkers that couple the ligand-binding domain to the channel (misTMD+Linker)
          alters the GluN2A subunit within the gating and ion-permeation machinery of the NMDA receptor.
          Recurrent examples include p.Leu812Met in the S2-M4 linker, p.Asn615Lys and p.Asn615Ser in the
