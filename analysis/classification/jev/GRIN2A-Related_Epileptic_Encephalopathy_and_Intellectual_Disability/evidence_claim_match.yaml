          seizures by the middle of the third week; heterozygous adults are susceptible to induced generalized
          seizures and show hyperactivity and repetitive behaviours. Network recordings demonstrate hyperexcitability
          with altered bursting and synchronicity, and NMDA receptor antagonists delay the onset of the
          lethal seizures. It is the principal in vivo model of GRIN2A developmental and epileptic encephalopathy.
      selected_evidence:
        snippet: A de novo missense variant, p.Ser644Gly, was identified in a child with this disorder,
          and Grin2a knock-in mice were generated to model and extend understanding of this intractable
          childhood disease.
