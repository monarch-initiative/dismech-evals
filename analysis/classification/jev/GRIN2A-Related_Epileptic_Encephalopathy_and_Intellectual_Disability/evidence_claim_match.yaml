            description: 'Dysregulated NMDA-receptor signaling shifts the balance between excitation and
              inhibition in developing cortical, hippocampal, and midbrain networks, producing neuronal
              hyperexcitability with abnormal bursting and abnormal network synchronicity. This is the
              substrate of the multiple early-onset, predominantly drug-resistant focal and generalized
              seizure types that define the epileptic component of the encephalopathy. The shift is not
              uniform across regions: in gain-of-function models midbrain circuits become hyperexcitable
              while hippocampal oscillatory activity is reduced.'
            biological_scale: CELLULAR
            conforms_to: epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance
            cell_types:
            - preferred_term: cortical glutamatergic neuron
              term:
