        context: []
      assertion_type: Treatment
      assertion:
        name: L-Serine Supplementation (NMDA Receptor Co-Agonist for Loss-of-Function Variants)
        description: 'Mechanism-directed therapy for the opposite functional class: oral L-serine is the
          metabolic precursor of the NMDA-receptor co-agonists D-serine and glycine, and supplementation
          potentiates hypofunctional receptors. A retrospective n-of-1 series of ten individuals with
          GRIN2A- or GRIN2B-related disorders found improvement in behaviour in 8 of 9 (89%) with loss-of-function
          missense or null variants, and a phase 2A open-label trial (NCT04646447) in 24 children with
          GRIN loss-of-function variants, 5 of whom had GRIN2A variants, reported improved adaptive behaviour,
          motor function, and quality of life, EEG normalization in five children, and reduced seizure
          frequency in one, with better response in milder phenotypes. Critically, L-serine must be avoided
          in individuals with gain-of-function variants: a gain-of-function patient treated in error experienced
          immediate behavioral deterioration.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: L-serine
            term:
              id: CHEBI:17115
              label: L-serine
      selected_evidence:
        snippet: In some individuals with pathogenic loss-of-function and null GRIN2A variants, treatment
          with the N-methyl-D-aspartate receptor (NMDAR) coagonist L-serine was associated with improvements
          in behavior, development, EEG features, and/or seizure frequency.
        supports: SUPPORT
