        prompt: Why do heterozygous Grin2a gain-of-function knock-in mice show paradoxical resistance
          to electrically induced limbic seizures and to pentylenetetrazole induced tonic-clonic seizures
          while patients with the same variant have intractable epilepsy, and does that discordance limit
          the model's use for preclinical drug selection?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cortical Excitation-Inhibition Imbalance and Network Hyperexcitability
        rationale: 'The Grin2a p.Ser644Gly knock-in is the principal in vivo model of this disorder, and
          it does reproduce network hyperexcitability, altered hippocampal morphology, and (in homozygotes)
          lethal spontaneous seizures. But the heterozygous genotype that actually matches the human condition
          displays significant resistance to two standard induced-seizure paradigms, the opposite direction
          from the human drug-resistant epilepsy, and the study authors themselves flag significant biological
          complexities. The second GRIN2A gain-of-function model points the same way: in Grin2aN615S mice
          midbrain circuits are hyperexcitable while hippocampal oscillatory activity is reduced, so the
          direction of the excitability change is region-dependent rather than global. If induced-seizure
          thresholds in the heterozygote run opposite to the human phenotype, then screening candidate
          anti-seizure or NMDA-receptor-directed drugs against those paradigms could select the wrong
          compounds. Whether the discordance reflects gene-dosage effects, mouse-specific compensatory
          circuit remodelling, or a genuine limitation of induced-seizure models as proxies for spontaneous
          GRIN2A epilepsy is unresolved, and it directly conditions how much weight preclinical rescue
          data (including the radiprodil audiogenic-seizure result) should carry for the ongoing radiprodil
          clinical programme.'
