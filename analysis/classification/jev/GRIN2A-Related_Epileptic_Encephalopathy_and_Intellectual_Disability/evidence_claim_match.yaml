            label: GRIN2A
        description: 'Knock-in mouse carrying the pore-loop gain-of-function Grin2a p.Asn615Ser variant,
          which renders GluN2A-type NMDA-receptor calcium signaling voltage-independent. It is one of
          only two Grin mouse lines with a spontaneous epileptic phenotype: audiogenic seizures arise
          from hyperexcitable midbrain circuits, while hippocampal oscillatory activity is paradoxically
          reduced, accompanied by exploratory hyperactivity and dysregulated attention that impairs associative
          learning. Audiogenic seizures are dose-dependently suppressed by radiprodil, a GluN2B-selective
          negative allosteric modulator, with an unexplained sex difference in drug response.'
      selected_evidence:
        snippet: By using our gene-targeted mouse line (Grin2aN615S), we show that voltage-independent
          glutamate-gated signaling of GluN2A-containing NMDA receptors is associated with NMDAR-dependent
          audiogenic seizures due to hyperexcitable midbrain circuits.
        supports: SUPPORT
