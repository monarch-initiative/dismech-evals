            term:
              id: MONDO:0017325
              label: early-onset epileptic encephalopathy and intellectual disability due to GRIN2A mutation
        context:
        - path: /treatments/1
          value:
            name: Memantine (NMDA Receptor Channel Blockade for Gain-of-Function Variants)
            description: 'Mechanism-directed therapy for gain-of-function GRIN2A variants: the use-dependent
              open-channel blocker memantine reduces the excessive NMDA-receptor current. In the index
              patient with the linker variant p.Leu812Met, in vitro screening confirmed retained memantine
              sensitivity and adjunct memantine cut seizure frequency from an average of 11.1 to 3.3 episodes
              per week, abolished the myoclonic jerks, and cleared the frontal spike-wave discharges from
              the EEG. A retrospective multicentre series of 34 individuals with GRIN variants found that
              74% of those with gain-of-function variants benefited, whereas those with loss-of-function
              or indeterminate variants benefited significantly less. Because blocker potency varies between
              variants (dextromethorphan and dextrorphan are more potent on p.Asn615Lys but less potent
              on p.Leu812Met), and because the distance of the variant from the memantine binding site
              tracks the response, blocker choice should be variant-specific. GeneReviews cautions that
              NMDA-receptor blockers be used with care in individuals with loss-of-function or null variants.'
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: memantine
                term:
                  id: CHEBI:64312
                  label: memantine
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: NMDA Receptor Gain-of-Function
        treatment_effect: INHIBITS
        description: Use-dependent open-channel blockade counteracts the excessive receptor activity of
          gain-of-function variants.
      selected_evidence:
        snippet: memantine inhibited GluN2A-L812M-containing NMDARs with an IC50 of 12
