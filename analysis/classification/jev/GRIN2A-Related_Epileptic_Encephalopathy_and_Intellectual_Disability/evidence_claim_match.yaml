                label: regulation of membrane potential
              modifier: ABNORMAL
            - preferred_term: modulation of chemical synaptic transmission
              term:
                id: GO:0050804
                label: modulation of chemical synaptic transmission
              modifier: DYSREGULATED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Drug-Resistant Focal Seizures
        causal_link_type: DIRECT
        description: Hyperexcitable cortical networks discharge as the focal, characteristically drug-resistant
          seizures of the severe phenotype.
