            label: NMDA glutamate receptor activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: ionotropic glutamate receptor signaling
          term:
            id: GO:0035235
            label: ionotropic glutamate receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: A de novo GRIN2A missense mutation (c.2434C>A; p.L812M) increased the charge transfer
          mediated by NMDA receptors containing the mutant GluN2A-L812M subunit.
        supports: SUPPORT
