  acb0b55ab37620a921adb577f2c5f35b099f4161d6630d80027b2173e94f4e04:
    claim:
      about:
        disease:
          name: GRIN2A-Related Epileptic Encephalopathy and Intellectual Disability
          disease_term:
            preferred_term: early-onset epileptic encephalopathy and intellectual disability due to GRIN2A
              mutation
            term:
              id: MONDO:0017325
              label: early-onset epileptic encephalopathy and intellectual disability due to GRIN2A mutation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GluN2A C-Terminal Domain Truncation and Receptor Mistargeting
        description: 'A mechanistically distinct third route to reduced GluN2A function, separate from
          gene-dosage loss and from impaired agonist binding: a frameshift truncating the GluN2A intracellular
          C-terminal domain leaves the receptor able to reach the postsynaptic membrane but destroys its
          PDZ interaction with the scaffolding protein PSD-95, so the receptor is mislocalized to extrasynaptic
          membrane while retaining Scribble1-mediated recycling. The consequence is fewer synapses and
          reduced dendritic spine density. This is a trafficking and localization defect rather than a
          channel-gating defect, and it was identified in a patient with epileptic encephalopathy, multiple
          seizure types, and severe aphasia.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: GRIN2A
          term:
            id: hgnc:4585
            label: GRIN2A
        cell_types:
        - preferred_term: cortical glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: protein localization to synapse
          term:
            id: GO:0035418
            label: protein localization to synapse
          modifier: ABNORMAL
      selected_evidence:
        snippet: Indeed, we observed impaired binding to the scaffolding protein postsynaptic protein-95
          (PSD-95); however, we found the mutant interacts with Scribble1, which facilitates the recycling
          of both the mutant and the WT GluN2A.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38050135
      reference_title: A Frameshift Variant of GluN2A Identified in an Epilepsy Patient Results in NMDA
        Receptor Mistargeting.
      evidence_source: IN_VITRO
      explanation: Identifies loss of PSD-95 binding with retained Scribble1 recycling as the molecular
        basis of the mislocalization.
