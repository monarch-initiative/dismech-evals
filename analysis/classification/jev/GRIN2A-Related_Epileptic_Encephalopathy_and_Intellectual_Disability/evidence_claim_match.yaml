        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: grin2a_domain_localization_functional_class_severity
        hypothesis_label: Variant domain localization determines NMDA-receptor functional class, which
          in turn determines phenotype severity
        status: CANONICAL
        description: The prevailing pathomechanistic model for the GRIN2A spectrum holds that the protein
          domain in which a variant falls predicts its electrophysiological consequence, and that consequence
          predicts clinical severity. Missense variants in the transmembrane and linker domains (misTMD+Linker)
          sit in the gating machinery and the ion-permeation pathway and predominantly produce NMDA-receptor
          gain-of-function, yielding the severe developmental and epileptic encephalopathy phenotype curated
          here. Missense variants in the amino-terminal or ligand-binding domains (misATD+LBD) exclusively
          produce loss-of-function and, together with null variants, yield the less severe epilepsy-aphasia
          phenotypes. This model is the basis for stratifying patients to opposite precision therapies
          (channel blockade versus co-agonist supplementation).
      selected_evidence:
        snippet: We found that pathogenic missense variants in transmembrane and linker domains (misTMD+Linker)
          were associated with severe developmental phenotypes, whereas missense variants within amino
          terminal or ligand-binding domains (misATD+LBD) and null variants led to less severe developmental
          phenotypes
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
