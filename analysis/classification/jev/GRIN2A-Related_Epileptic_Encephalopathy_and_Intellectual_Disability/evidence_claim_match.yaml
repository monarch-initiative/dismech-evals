          name: GRIN2A-Related Epileptic Encephalopathy and Intellectual Disability
          disease_term:
            preferred_term: early-onset epileptic encephalopathy and intellectual disability due to GRIN2A
              mutation
            term:
              id: MONDO:0017325
              label: early-onset epileptic encephalopathy and intellectual disability due to GRIN2A mutation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: grin2a_dee_progressive_atrophy_mechanism
        prompt: Is the progressive cerebral parenchymal volume loss in GRIN2A early-onset epileptic encephalopathy
          a consequence of NMDA-receptor-mediated excitotoxicity and calcium overload, a consequence of
          the seizure burden itself, or an independent developmental or neurodegenerative process?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive Cerebral Parenchymal Volume Loss and Abnormal Myelination
        rationale: 'Progressive atrophy with a thin corpus callosum is written into this disorder''s clinical
          definition and is one of the features that separates it from the milder GRIN2A epilepsy-aphasia
          phenotypes, yet its mechanism has never been established: the causal edge from network hyperexcitability
          to atrophy is curated here with unknown intermediates. The distinction matters therapeutically.
          If the atrophy is driven by excessive NMDA-receptor calcium influx then early channel blockade
          might slow it independent of seizure control; if it is seizure-driven then aggressive seizure
          control is the priority; if it is an independent developmental program then neither will help.
          The index patient''s cognitive ability was explicitly unchanged despite a two-thirds reduction
          in seizures on memantine, which is at least consistent with the atrophy and developmental impairment
          being partly seizure-independent. Two further observations pull in the same direction and sharpen
          the question. First, in an independent epilepsy-aphasia cohort the baseline spike-wave index
          did not correlate with intellectual disability level, and the authors concluded the neuropsychological
          deterioration is not driven by discharge severity alone. Second, and as a genuine counterpoint,
          longitudinal diffusion imaging of Grin2a knockout mice found microstructural anomalies that
          were TRANSIENT - present at postnatal day 30 but not at 15 days or 2 months - which is the opposite
          temporal profile to the progressive human atrophy. That contrast may itself be informative,
          since the mouse is a knockout (loss-of-function) whereas the severe human phenotype is predominantly
          gain-of-function, raising the possibility that progressive tissue loss is specific to the gain-of-function
          arm rather than a general consequence of GRIN2A disruption.'
        proposed_experiments:
        - experiment_id: exp_grin2a_serial_mri_seizure_burden_correlation
          name: Serial volumetric MRI against seizure burden and functional class
          description: In a prospective GRIN2A cohort, correlate serial volumetric MRI atrophy rates with
            quantified seizure burden, EEG spike load, variant functional class, and treatment exposure,
            to test whether atrophy tracks seizures, tracks receptor gain-of-function, or progresses independently.
        - experiment_id: exp_grin2a_model_neurodegeneration_timecourse
          name: Neurodegeneration time course in Grin2a knock-in models with and without seizure suppression
          description: Quantify neuronal loss, dendritic morphology, and white-matter myelination over
            time in Grin2a gain-of-function knock-in mice, comparing animals in which seizures are suppressed
            by a non-NMDA-receptor anti-seizure drug against animals treated with an NMDA-receptor antagonist,
            to separate seizure-driven from receptor-driven neurodegeneration.
      selected_evidence:
        snippet: Most MR-DTI alterations were detected at a specific developmental stage when mice were
          aged 30 days, but not at earlier (15 days) or later (2 months) ages.
        supports: SUPPORT
