        type: missense
        clinical_significance: PATHOGENIC
        description: De novo missense variant near the apex of the pore-lining M2 reentrant loop, identified
          in the index girl with GRIN2A early-onset epileptic encephalopathy. It eliminates the voltage-dependent
          extracellular magnesium block at physiological concentrations while also reducing calcium permeability.
          Unlike p.Leu812Met, agonist potency is unchanged, and dextromethorphan and dextrorphan are more
          rather than less potent on N615K-containing receptors, illustrating that channel-blocker choice
          is variant-specific.
        functional_effects:
