        notes: Heterozygous GRIN2A variants cause the disorder. At this severe end the variants are characteristically
          de novo missense changes in the transmembrane domains or the linkers coupling the ligand-binding
          domain to the channel, which predominantly confer NMDA-receptor gain-of-function. Null variants
          and missense variants in the amino-terminal or ligand-binding domains confer loss-of-function
          and predominantly produce the milder epilepsy-aphasia phenotypes. Assigning the functional class
          is a prerequisite for mechanism-directed treatment, because the two available precision therapies
          act in opposite directions.
