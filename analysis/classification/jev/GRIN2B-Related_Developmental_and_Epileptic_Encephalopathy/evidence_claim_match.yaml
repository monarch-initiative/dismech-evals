      assertion_type: Pathophysiology
      assertion:
        name: GRIN2B Variant Altering the GluN2B NMDA Receptor Subunit
        description: De novo heterozygous missense or protein-truncating variants in GRIN2B alter the
          GluN2B subunit of the NMDA receptor. Because GluN2B-containing NMDA receptors predominate in
          the developing forebrain, variants perturb the receptor at a developmentally critical window.
        cell_types:
        - preferred_term: glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: glutamate receptor signaling
          term:
            id: GO:0007215
            label: glutamate receptor signaling pathway
      selected_evidence:
        snippet: Either GRIN2B or GRIN2A, encoding the NMDA receptor subunits NR2B and NR2A, was found
          to be disrupted by chromosome translocation breakpoints in individuals with mental retardation
          and/or epilepsy.
        supports: SUPPORT
    origin:
