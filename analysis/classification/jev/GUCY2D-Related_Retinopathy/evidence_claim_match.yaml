          value:
            name: Dominant
            display_name: GUCY2D-Related Dominant Retinopathy (CORD6)
            subtype_term:
              preferred_term: GUCY2D-related dominant retinopathy
              term:
                id: MONDO:0100441
                label: GUCY2D-related dominant retinopathy
            description: 'Autosomal dominant cone-rod dystrophy (CORD6/CACD1) caused by heterozygous gain-of-function
              variants in GUCY2D. The dominant variant hotspot is at codon 838 in exon 13: c.2513G>A (p.Arg838His)
              occurs in ~54% of CORD patients, with c.2512C>T (p.Arg838Cys) and c.2513G>C (p.Arg838Pro)
              also recurrent. These variants alter calcium-sensitivity of RETGC-1 regulation by guanylate
              cyclase activating proteins (GCAPs), rendering the enzyme constitutively hyperactive and
              producing excess cGMP, sustained CNG channel opening, Na+/Ca2+ overload, and progressive
              cone-predominant photoreceptor apoptosis via PKG activation, calpain activation, and ER
              stress pathways. Disease presents in childhood or adolescence with progressive visual acuity
              loss, dyschromatopsia, photophobia, central scotoma, and progressive macular atrophy on
              OCT. ERG shows predominantly reduced cone responses with relative rod preservation early.
              Natural history studies document annual BCVA worsening of ~0.022 logMAR/year, with a 32%
              probability of blindness or severe visual impairment by age 40.'
          role: subtype
      assertion_type: Phenotype
      assertion:
        category: Ophthalmological
        name: Progressive visual loss
        subtype: Dominant
        frequency: VERY_FREQUENT
        description: Dominant CORD6 shows clearly progressive visual decline with annual BCVA worsening
          of approximately 0.022 logMAR/year. Natural history studies document a 32% probability of blindness
          or severe visual impairment by age 40. Structural degeneration on OCT becomes more apparent
