          under the photoreceptor-specific GRK1 promoter via unilateral subretinal injection, developed
          by Atsena Therapeutics for GUCY2D-LCA1. GUCY2D-LCA1 is particularly favorable for gene augmentation
          because of the characteristic structure-function dissociation — preserved central photoreceptor
          structure despite profound functional silence — providing viable cellular targets for gene replacement.
