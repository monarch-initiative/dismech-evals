        description: Keratoconus is a recognized secondary complication in LCA patients, caused by chronic
          mechanical deformation of the cornea from the characteristic oculodigital sign (Franceschetti
          sign) — the habitual behavior of pressing, poking, and rubbing the eyes that is nearly pathognomonic
          of LCA. This repetitive pressure deforms the corneal apex over time, producing corneal thinning
          and cone-shaped ectasia that further reduces vision. GeneReviews notes that children with LCA
          should be discouraged from repeatedly poking and pressing on their eyes to limit this secondary
          corneal complication.
        phenotype_term:
