      assertion_type: Pathophysiology
      assertion:
        name: Cone Photoreceptor Calcium Overload
        conforms_to: phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point
          Control
        description: Chronically elevated cGMP in dominant GUCY2D-CORD6 maintains CNG channels in a constitutively
          open state, producing sustained Na+/Ca2+ influx into cone photoreceptor outer segments. The
          resulting intracellular calcium overload activates PKG-dependent phosphorylation cascades, calpain-mediated
          proteolysis, endoplasmic reticulum stress, and downstream apoptotic cascades. Because RETGC-1
          is preferentially expressed in cone outer segments and cones have intrinsically higher baseline
          metabolic demands, cones are more vulnerable than rods to chronic Ca2+ overload, explaining
          the predominant cone loss and progressive macular atrophy characteristic of GUCY2D-CORD6. Rod
          involvement occurs later as disease progresses.
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: apoptotic process
          modifier: INCREASED
          term:
            id: GO:0006915
            label: apoptotic process
      selected_evidence:
        snippet: The potential mechanisms underlying cGMP signaling-induced photoreceptor degeneration
          involve the activation of PKG and impaired Ca2+ homeostasis/Ca2+ overload, resulting from overactivation
          of the CNG channels, as well as the subsequent activation of the downstream cellular stress/death
          pathways.
        supports: SUPPORT
