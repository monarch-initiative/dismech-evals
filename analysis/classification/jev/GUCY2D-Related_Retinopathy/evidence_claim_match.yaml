      assertion_type: Pathophysiology
      assertion:
        name: Impaired Phototransduction Recovery
        conforms_to: phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation
          or Timely Recovery
        description: Under normal conditions, RETGC-1 resynthesizes cGMP under GCAP-mediated calcium regulation
          after phototransduction, reopening CNG channels to restore the photoreceptor dark current. When
          RETGC-1 is absent or catalytically inactive, cGMP cannot be regenerated after light-induced
          hydrolysis by phosphodiesterase 6 (PDE6). CNG channels fail to reopen and photoreceptors remain
          in a persistently hyperpolarized, functionally silent state. This produces profound visual dysfunction
          despite early structural preservation of photoreceptor outer segments — the hallmark structure-function
          dissociation of GUCY2D-LCA that makes it particularly amenable to gene augmentation.
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: phototransduction
          modifier: DECREASED
          term:
            id: GO:0007602
            label: phototransduction
      selected_evidence:
        snippet: cGMP governs the cyclic nucleotide-gated (CNG) channels on the plasma membrane of the
          photoreceptor outer segments, thereby regulating membrane potential and signal transmission.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
