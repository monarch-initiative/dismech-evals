              label: GUCY2D-related recessive retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RETGC-1 Constitutive Hyperactivity
        description: Heterozygous gain-of-function variants at codon 838 in exon 13 of GUCY2D (p.Arg838His,
          p.Arg838Cys, p.Arg838Pro) alter the calcium-sensitivity of RETGC-1 regulation by guanylate cyclase-activating
          proteins (GCAPs), rendering the enzyme constitutively hyperactive independent of intracellular
          calcium levels. Under normal conditions, rising cytoplasmic Ca2+ (in darkness) activates GCAPs,
          which suppress RETGC-1 activity via a calcium-mediated negative feedback loop. Codon-838 GOF
          variants disrupt this GCAP-mediated inhibitory feedback, causing RETGC-1 to produce excess cGMP
          even at calcium concentrations that would normally silence the enzyme. The resulting chronically
          elevated cGMP causes constitutive CNG channel opening, continuous Na+/Ca2+ influx, and sustained
          intracellular Ca2+ overload, driving progressive cone-predominant photoreceptor toxicity.
        gene:
          preferred_term: GUCY2D
          modifier: INCREASED
          term:
            id: hgnc:4689
            label: GUCY2D
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: cGMP biosynthetic process
          modifier: INCREASED
          term:
            id: GO:0006182
            label: cGMP biosynthetic process
      selected_evidence:
        snippet: Abnormally elevated cGMP signaling interferes with various cellular events, which ultimately
          leads to photoreceptor degeneration.
        supports: SUPPORT
