        conforms_to: photoreceptor_degeneration#Rod Photoreceptor Apoptosis
        description: 'Progressive rod and cone photoreceptor degeneration and apoptosis result from sustained
          phototransduction failure and downstream cellular stress. A key feature distinguishing GUCY2D-LCA
          from other LCA subtypes is structure-function dissociation: OCT imaging frequently reveals preserved
          ellipsoid zone (EZ) and outer nuclear layer (ONL) centrally despite profoundly reduced visual
          function, indicating photoreceptors remain anatomically intact for extended periods before irreversible
          degeneration. This preservation represents the therapeutic window for gene augmentation therapy.
          Dysregulated cGMP signaling drives downstream stress pathways including PKG activation, Ca2+
          overload via CNG channel dysregulation, calpain activation, ER stress, and photoreceptor cell
          death.'
