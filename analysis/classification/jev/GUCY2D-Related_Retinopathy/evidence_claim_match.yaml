      assertion:
        name: RETGC-1 Deficiency
        conforms_to: phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect
        description: Biallelic loss-of-function variants in GUCY2D abolish or severely reduce the guanylyl
          cyclase activity of retinal guanylate cyclase-1 (RETGC-1), the enzyme responsible for cGMP synthesis
          in photoreceptor outer segments. RETGC-1 accounts for over 70% of cGMP production in photoreceptors
          and is expressed in both rod and cone outer segments. More than 248 pathogenic variants cause
          autosomal recessive LCA1/EOSRD; null alleles (frameshift, nonsense, splice-site) account for
          approximately 88% of LCA-causing alleles. Missense variants account for ~71% of all variant
          types. Notable recurrent variants include c.1694T>C (p.Phe565Ser) and c.2302C>T (p.Arg768Trp).
        gene:
