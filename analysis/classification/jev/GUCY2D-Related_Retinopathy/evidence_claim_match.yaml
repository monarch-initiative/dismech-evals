            association: Causative
            features: Over 248 pathogenic variants in GUCY2D cause autosomal recessive LCA1/EOSRD; null
              alleles (frameshift, nonsense, splice-site) account for approximately 88% of LCA-causing
              alleles. Approximately 30 additional variants cause autosomal dominant CORD6, strongly enriched
              at codon 838 in exon 13 (c.2513G>A p.Arg838His accounting for ~54% of dominant cases). Variants
              in the extracellular domain (exon 2) are associated with milder LCA phenotypes and better-preserved
              visual acuity.
