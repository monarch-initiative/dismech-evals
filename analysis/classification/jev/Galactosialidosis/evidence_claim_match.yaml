      assertion:
        name: Cathepsin A (PPCA) Deficiency and Secondary Combined NEU1/GLB1 Deficiency
        conforms_to: lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency
        description: Biallelic CTSA variants abolish protective protein/cathepsin A (PPCA), required to
          assemble, stabilize, and activate the lysosomal multienzyme complex containing neuraminidase-1
          and beta-galactosidase. PPCA loss secondarily inactivates both enzymes.
        gene:
          preferred_term: CTSA
          term:
            id: hgnc:9251
            label: CTSA
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: 'Mutations in the CTSA gene, that encodes the protective

          protein/cathepsin A or PPCA, lead to the secondary deficiency of β-galactosidase

          (GLB1) and neuraminidase 1 (NEU1), causing the lysosomal storage disorder

          galactosialidosis (GS).'
        supports: SUPPORT
