      assertion:
        name: Combined neuraminidase-1 (NEU1) and beta-galactosidase (GLB1) activity
        presence: DECREASED
        context: Secondary combined deficiency in patient fibroblasts and leukocytes due to loss of PPCA
          multienzyme complex protection
        readouts:
        - target: Secondary Combined NEU1 and GLB1 Deficiency
          relationship: READOUT_OF
          direction: NEGATIVE
          interpretation: Concurrent reduction of both NEU1 and GLB1 enzymatic activities in cells is
            the hallmark secondary biochemical signature of galactosialidosis.
      selected_evidence:
        snippet: Galactosialidosis is a glycoprotein storage disease caused by an inherited deficiency
          of the lysosomal protective protein/cathepsin A (PPCA) which is associated in a complex with
          both, α-neuraminidase (sialidase, NEU1, EC 3.2.1.18) and acid β-galatosidase (β-Gal, EC 3.2.1.23).
          PPCA is a multifunctional enzyme which binds and protects these two glycosidases from premature
          proteolysis. Therefore, the loss of PPCA results in a deficiency of α-neuraminidase and β-galactosidase
          activities [148].
        supports: SUPPORT
