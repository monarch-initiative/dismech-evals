      assertion_type: Pathophysiology
      assertion:
        name: Chronic Biliary Inflammation
        description: Chronic inflammation of the gallbladder mucosa, most commonly driven by cholelithiasis
          (gallstones) and chronic cholecystitis, but also by porcelain gallbladder, anomalous pancreaticobiliary
          junction, and chronic Salmonella Typhi infection, produces repeated cycles of epithelial injury
          and repair. Persistent inflammation and bile-acid exposure cause oxidative stress and DNA damage
          in gallbladder epithelial cells, creating the selective pressure that initiates malignant transformation.
          Metabolic risk (obesity/high BMI) further shapes incidence.
        cell_types:
        - preferred_term: gallbladder epithelial cell
          term:
            id: CL:1000415
            label: epithelial cell of gallbladder
        biological_processes:
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
        locations:
        - preferred_term: gallbladder
          term:
            id: UBERON:0002110
            label: gallbladder
      selected_evidence:
        snippet: Gallbladder cancer (GBC) is one of the commonest biliary malignancies seen in India,
          Argentina, and Japan. The disease has dismal outcome as it is detected quite late due to nonspecific
          symptoms and signs.
        supports: SUPPORT
