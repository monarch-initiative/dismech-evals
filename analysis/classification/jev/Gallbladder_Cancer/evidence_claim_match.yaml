  f5b504474dcf9b023e2e6de0f368edc54ec6c1bea86aeaa1a6406bcecd170413:
    claim:
      about:
        disease:
          name: Gallbladder Cancer
          disease_term:
            preferred_term: gallbladder cancer
            term:
              id: MONDO:0005411
              label: gallbladder cancer
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Invasion and Metastasis
        description: Gallbladder cancer progresses through loss of epithelial cell adhesion and acquisition
          of a migratory, invasive phenotype, with frequent early spread to adjacent liver segments and
          regional lymph nodes. Proteomic profiling identifies Carcinoembryonic Antigen-related Cell Adhesion
          Molecule 6 (CEACAM6) as significantly upregulated in GBC, where it decreases cell adhesion and
          promotes migration and invasion through integrin beta-1 (ITGB1) and protein kinase C delta (PRKCD)
          partners and downstream AKT/ERK signaling.
        cell_types:
        - preferred_term: gallbladder epithelial cell
          term:
            id: CL:1000415
            label: epithelial cell of gallbladder
        gene_products:
        - preferred_term: CEACAM6
          term:
            id: NCIT:C107471
            label: Carcinoembryonic Antigen-Related Cell Adhesion Molecule 6
        biological_processes:
        - preferred_term: epithelial cell proliferation
          modifier: INCREASED
          term:
            id: GO:0050673
            label: epithelial cell proliferation
        locations:
        - preferred_term: gallbladder
          term:
            id: UBERON:0002110
            label: gallbladder
