      assertion_type: Pathophysiology
      assertion:
        name: Immunosuppressive Microenvironment and Immune Evasion
        description: Single-cell transcriptomic profiling of gallbladder cancer reveals a suppressive
          immune microenvironment with dysfunctional T cells and tumor-associated macrophage infiltration.
          The epithelial regulator olfactomedin 4 (OLFM4) is elevated in GBC epithelial cells and is associated
          with worse prognosis; mechanistically, OLFM4 upregulates programmed death-ligand 1 (PD-L1) expression
          through the MAPK-AP1 axis, enabling tumor cells to evade immune clearance. This immune-evasive
          state underlies the rationale for combining immune checkpoint inhibitors with chemotherapy.
        cell_types:
        - preferred_term: gallbladder epithelial cell
          term:
            id: CL:1000415
            label: epithelial cell of gallbladder
        - preferred_term: tumor-associated macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        locations:
        - preferred_term: gallbladder
          term:
            id: UBERON:0002110
            label: gallbladder
        gene_products:
        - preferred_term: olfactomedin-4
          term:
            id: NCIT:C113594
            label: Olfactomedin-4
        - preferred_term: PD-L1
          term:
            id: NCIT:C96024
            label: Programmed Cell Death 1 Ligand 1
        biological_processes:
        - preferred_term: MAPK cascade
          modifier: INCREASED
          term:
            id: GO:0000165
            label: MAPK cascade
        - preferred_term: negative regulation of immune response (immune evasion)
          modifier: INCREASED
          term:
            id: GO:0050777
            label: negative regulation of immune response
      selected_evidence:
        snippet: our study identified elevated olfactomedin 4 (OLFM4) in epithelial cells as a central
          player in GBC progression. OLFM4 was related to T-cell malfunction and tumour-associated macrophage
          infiltration, leading to a worse prognosis in GBC.
        supports: SUPPORT
