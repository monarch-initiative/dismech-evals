        genetic_context:
          variant_origin: SOMATIC
        description: Whole-exome sequencing of gallbladder tumors identifies recurrent pathogenic and
          oncogenic alterations concentrated in a small set of driver genes and signaling programs. The
          eight most altered genes are TP53, SMAD4, ERBB3, KRAS, ARID1A, PIK3CA, RB1, and AXIN1, with
          pathogenic variants enriched in the RTK-RAS, WNT, and TP53 pathways. TP53 loss-of-function disables
          cell-cycle checkpoints and apoptotic responses, KRAS/ERBB-driven RTK-RAS signaling and PI3K-AKT
          activation drive proliferation and survival, and WNT/beta-catenin activation (CTNNB1, AXIN1)
          sustains the malignant phenotype. Mutational signatures link a subset of these alterations to
          patient age and tobacco exposure.
        cell_types:
