              label: pathological gambling
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endogenous Opioid Modulation of Striatal Dopamine Release
        conforms_to: addiction_cycle#Acute Mesolimbic Dopamine Reinforcement
        biological_scale: MOLECULAR
        description: 'Curated because a drug demands it. The best-evidenced pharmacotherapy for gambling
          disorder is opioid-receptor antagonism, not dopamine-receptor antagonism, and an entry whose
          only molecular nodes are dopaminergic cannot say what nalmefene and naltrexone act on.

          Endogenous opioid signalling modulates dopamine release in the ventral striatum, so blocking
          mu-opioid receptors damps the dopaminergic response to reward without targeting the dopamine
          receptor itself. This node exists to make that join explicit rather than leaving the treatment
          pointing at a node its mechanism does not describe.

          Its evidential status is weaker than the nodes around it and the entry does not disguise that:
          it is inferred from the drugs'' pharmacology and their trial results, not from a measurement
          of opioid signalling in people with gambling disorder.'
        biological_processes:
        - preferred_term: G protein-coupled opioid receptor signaling pathway
          term:
            id: GO:0038003
            label: G protein-coupled opioid receptor signaling pathway
      selected_evidence:
        snippet: placebo-controlled trials suggest that some medications, such as opioid-receptor antagonists,
          may be helpful
        supports: SUPPORT
        directness: INDIRECT
    origin:
