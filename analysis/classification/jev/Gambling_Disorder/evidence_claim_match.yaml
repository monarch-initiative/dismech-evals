  2ae571a908f6ed99e809a9adc548980f6b1a042349b727098b231f62cca1e255:
    claim:
      about:
        disease:
          name: Gambling Disorder
          disease_term:
            preferred_term: gambling disorder
            term:
              id: MONDO:0011662
              label: pathological gambling
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dopamine Agonist-Induced Impulse Control Dysregulation
        biological_scale: MOLECULAR
        description: 'The iatrogenic arm, and the entry''s causal anchor. Dopamine agonists prescribed
          for Parkinson disease precipitate gambling disorder in people who did not previously have it.
          In a cross-sectional study of 3,090 treated patients, an impulse control disorder was present
          in 13.6%, gambling specifically in 5.0%, and the rate was 17.1% on a dopamine agonist against
          6.9% off one (odds ratio 2.72).

          The direction of the pharmacology is what makes this informative. Agonists at D2-like receptors,
          given for a motor indication, generate a behavioural addiction as a side effect - so dopaminergic
          signalling is not merely correlated with the disorder in people who already have it. The effect
          was similar for pramipexole and ropinirole, which argues for a class effect rather than an idiosyncrasy
          of one drug.

          This node is a distinct route into the disorder, not a description of the common sporadic form,
          and is curated as its own trigger for that reason.'
        biological_processes:
        - preferred_term: regulation of dopamine receptor signaling pathway
          term:
            id: GO:0060159
            label: regulation of dopamine receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Impulse control disorders were more common in patients treated with a dopamine agonist
          than in patients not taking a dopamine agonist (17.1% vs 6.9%; odds ratio [OR], 2.72; 95% confidence
          interval [CI], 2.08-3.54; P < .001)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
