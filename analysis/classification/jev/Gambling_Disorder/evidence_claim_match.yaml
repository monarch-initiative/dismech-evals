        context: []
      assertion_type: Genetic
      assertion:
        name: Heritable Liability
        association: 'A meta-analysis of 18 twin studies partitioned the variance in gambling into moderate
          additive genetic and non-shared environmental components, with no detectable shared environmental
          contribution in the whole-sample analysis.

          The even split is worth reading carefully rather than as a headline heritability. It says that
          roughly half the variance tracks additive genetic differences and essentially all the remainder
          tracks experiences not shared between twins - which puts the family environment, the intuitive
          candidate for a behaviour learned at home, close to zero in this decomposition.'
        relationship_type: SUSCEPTIBILITY
      selected_evidence:
        snippet: The whole sample analyses showed moderate additive genetic (a2 = 0.50) and non-shared
          environmental influences (e2 = 0.50) on gambling
        supports: SUPPORT
