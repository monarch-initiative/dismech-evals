      assertion:
        name: Opioid Receptor Antagonists
        description: 'Nalmefene and naltrexone have the most supportive evidence in a network meta-analysis
          of 16 randomised trials, nalmefene reducing gambling severity with a standardised mean difference
          of -0.86 and naltrexone -0.42.

          The same analysis found both drugs had significantly higher dropout due to side effects than
          placebo, with odds ratios near 8 - so the best-evidenced pharmacotherapy is also the least tolerated,
          and efficacy and tolerability point in opposite directions. Neither holds a formal indication
          for this disorder.

          That an opioid antagonist works at all is itself mechanistically informative: it implicates
          endogenous opioid signalling, which modulates dopamine release in the ventral striatum, rather
          than acting on the dopamine receptor directly.'
