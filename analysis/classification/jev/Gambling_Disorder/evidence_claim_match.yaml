              label: pathological gambling
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reinforcement Learning Distortion
        conforms_to: addiction_cycle#Incentive Salience and Habit Formation
        biological_scale: ORGANISM
        description: 'The functional consequence: gambling continues to be chosen despite mounting losses.
          Curated as a distortion of reinforcement rather than as a failure of willpower, because gambling''s
          schedule of intermittent, variable-ratio reward is the schedule most resistant to extinction,
          and near-misses are processed as though they were partial wins.

          Marked ORGANISM rather than MOLECULAR because what is established is the behavioural output;
          the computational account of how the circuit produces it is a model rather than a measurement,
          and no source here measures a prediction-error signal.'
        biological_processes:
        - preferred_term: reinforcement learning
          term:
            id: GO:0008306
            label: associative learning
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Gambling disorder is characterized by a persistent, recurrent pattern of gambling that
          is associated with substantial distress or impairment
        supports: SUPPORT
    origin:
