            term:
              id: MONDO:0011662
              label: pathological gambling
        context: []
      assertion_type: Phenotype
      assertion:
        category: Psychiatric
        name: Suicidal Ideation and Suicide Mortality
        description: 'The outcome that makes this disorder matter, and the one an earlier version of this
          entry omitted while quoting a review that closes on it.

          In a Swedish nationwide register study of 2,099 people diagnosed with gambling disorder, all-cause
          mortality was 1.8-fold that of the general population aged 20-74, and suicide mortality was
          15-fold. Twenty-one of the sixty-seven deaths were suicides. Suicide death was predicted by
          depression rather than by gambling severity, which matters clinically: the treatable predictor
          is the comorbidity, not the gambling.'
        phenotype_term:
          preferred_term: Suicidal ideation
          term:
            id: HP:0031589
            label: Suicidal ideation
      selected_evidence:
        snippet: SMR calculations showed a 1.8-fold increase in mortality for individuals 20-74 years
          old with GD compared to the general population, and a 15-fold increase in suicide mortality
        supports: SUPPORT
