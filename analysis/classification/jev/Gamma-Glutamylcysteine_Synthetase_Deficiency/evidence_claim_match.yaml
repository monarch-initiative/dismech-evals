          and membrane sulfhydryls, so reactive oxygen species progressively damage haemoglobin and the
          red-cell membrane. This is the disease-specific amplification step in a red cell that is otherwise
          structurally and enzymatically normal - the peripheral smear, Coombs test, G6PD assay and spherocytosis
          screen are all normal in these patients, which is why the diagnosis is easily missed.

          '
