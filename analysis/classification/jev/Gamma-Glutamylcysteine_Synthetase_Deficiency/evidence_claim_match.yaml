  05a0dabc10660e6a5930e075b700ecc39a85504ab6a66c258b0b5304d6c66e7a:
    claim:
      about:
        disease:
          name: Gamma-Glutamylcysteine Synthetase Deficiency
          disease_term:
            preferred_term: gamma-glutamylcysteine synthetase deficiency
            term:
              id: MONDO:0009259
              label: gamma-glutamylcysteine synthetase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced glutamate-cysteine ligase activity
        biological_scale: MOLECULAR
        description: 'Glutamate-cysteine ligase catalyses the first and rate-limiting step of glutathione
          biosynthesis, the ATP-dependent ligation of glutamate and cysteine to gamma-glutamylcysteine.
          Erythrocyte enzyme activity in affected homozygotes has been measured at under 2% of normal,
          with heterozygous relatives at roughly half-normal activity. Because the block is at the first
          step, both gamma-glutamylcysteine and glutathione fall - the biochemical signature that separates
          this disorder from glutathione synthetase deficiency, in which gamma-glutamylcysteine instead
          accumulates.

          '
        genes:
        - preferred_term: GCLC
          term:
            id: hgnc:4311
            label: GCLC
        molecular_functions:
        - preferred_term: glutamate-cysteine ligase activity
          term:
            id: GO:0004357
            label: glutamate-cysteine ligase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: glutathione biosynthetic process
          term:
            id: GO:0006750
            label: glutathione biosynthetic process
          modifier: DECREASED
        chemical_entities:
        - preferred_term: L-gamma-glutamyl-L-cysteine
          term:
            id: CHEBI:17515
            label: L-gamma-glutamyl-L-cysteine
          modifier: DECREASED
      selected_evidence:
        snippet: 'Gamma-glutamylcysteine synthetase (gamma-GCS) catalyzes the first and rate-limiting
          step in glutathione (GSH) biosynthesis: the adenosine triphosphate (ATP)-dependent ligation
          of glutamate and cysteine.'
        supports: SUPPORT
    origin:
