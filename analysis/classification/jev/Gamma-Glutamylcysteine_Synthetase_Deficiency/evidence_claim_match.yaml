        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gclc_neurological_arm_mechanism
        prompt: Why do only some patients with glutamate-cysteine ligase deficiency develop progressive
          spinocerebellar and neuromuscular disease, and by what mechanism does glutathione depletion
          injure the nervous system in this disorder?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive neurological dysfunction
        rationale: 'Only 4 of the 12 published patients have neurological involvement, and no GCLC genotype
          predicts it - the same c.514T>A allele appears in children with normal neurological examinations
          and in an adult with late-onset spinocerebellar degeneration. The causal edge from glutathione
          depletion to neurodegeneration is therefore curated with unknown intermediates, and this node
          is deliberately not wired to cerebellar_purkinje_degeneration or peripheral_axonal_degeneration:
          asserting conformance would claim a mechanistic route the literature does not yet supply. Candidate
          explanations include a modifier locus, tissue-specific residual GCL activity, and cumulative
          oxidative injury that only becomes clinically apparent after decades - none of which has been
          tested.'
        proposed_experiments:
        - experiment_id: exp_gclc_neuro_natural_history
          name: Prospective neurological surveillance of a GCLC deficiency cohort
          description: Follow every genetically confirmed patient with serial neurological examination,
            nerve conduction studies and brain MRI, since the reported late-onset case shows a normal
            childhood examination cannot exclude the neurological arm. Pair with tissue-accessible glutathione
            measurement to test whether residual GCL activity outside the erythrocyte, rather than genotype,
            stratifies risk.
      selected_evidence:
        snippet: To date, no specific GCLC gene mutation has been attributed to the reported neurological
          constellation of symptoms.
        supports: SUPPORT
