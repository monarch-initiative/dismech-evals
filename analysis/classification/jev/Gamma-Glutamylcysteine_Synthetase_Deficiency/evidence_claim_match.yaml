        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive neurological dysfunction
        biological_scale: ORGANISM
        description: 'A minority of reported patients - 4 of the 12 in the published literature - develop
          progressive neurological disease. The reported constellation spans spinocerebellar degeneration
          with cerebellar atrophy, ataxia, lower-limb spasticity, motor-sensory peripheral neuropathy,
          cognitive impairment and myopathy, and may not appear until adulthood. Some of these patients
          also have generalized aminoaciduria, consistent with the gamma-glutamyl cycle''s role in amino-acid
          transport. No GCLC genotype has been shown to predict the neurological arm, and the mechanism
          connecting glutathione depletion to neurodegeneration in this disorder is unresolved (see the
          knowledge-gap discussion). The node is therefore modelled as a consequence with unknown intermediates
          rather than being wired into a specific neurodegeneration module.

          '
      selected_evidence:
        snippet: All presented with hemolytic anemia and 4 had additional neurological manifestations
          including cognitive impairment, neuropathy, ataxia, and myopathy.
        supports: SUPPORT
