              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Premature erythrocyte destruction
        causal_link_type: DIRECT
        description: 'Oxidatively injured erythrocytes are cleared prematurely from the circulation.

          '
      selected_evidence:
        snippet: Hereditary deficiency of gamma-GCS has been reported in a small number of patients and
          is associated with low erythrocyte levels of gamma-GCS and GSH leading to hemolytic anemia.
        supports: SUPPORT
