  00b80938bf0b87bd808a7c64c0a1e30481bf73359f351a812f7d5e090b57772b:
    claim:
      about:
        disease:
          name: Gamma-Glutamylcysteine Synthetase Deficiency
          disease_term:
            preferred_term: gamma-glutamylcysteine synthetase deficiency
            term:
              id: MONDO:0009259
              label: gamma-glutamylcysteine synthetase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilized GCLC-GCLM holoenzyme
        biological_scale: MOLECULAR
        description: 'Glutamate-cysteine ligase is a heterodimer of a catalytic subunit (GCLC) and a regulatory/modifier
          subunit (GCLM), the latter enhancing catalytic efficiency on heterodimer formation. Recombinant
          characterization of the clinical GCLC missense alleles shows that they do not all fail the same
          way: Arg127Cys, His370Leu and Pro414Leu have intrinsically compromised catalysis that is largely
          rescued by adding GCLM, whereas Pro158Leu has near-wild-type kinetic constants and is instead
          inferred to be destabilized in vivo through failure to form or persist as the heterodimer. This
          node captures that variant-specific, holoenzyme-level lesion upstream of the measured enzyme
          deficiency.

          '
        genes:
        - preferred_term: GCLC
          term:
            id: hgnc:4311
            label: GCLC
        - preferred_term: GCLM
          term:
            id: hgnc:4312
            label: GCLM
        molecular_functions:
        - preferred_term: glutamate-cysteine ligase activity
          term:
            id: GO:0004357
            label: glutamate-cysteine ligase activity
          modifier: DECREASED
        genetic_context:
          description: 'Biallelic hypomorphic missense variants in GCLC; reported patients are homozygous,
            frequently in consanguineous kindreds. Complete loss of GCLC has not been observed in patients.

            '
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
      selected_evidence:
        snippet: Kinetic characterizations of the recombinant GCLC mutants indicated that the Arg127Cys,
          His370Leu, and Pro414Leu mutants have compromised enzymatic activity that can largely be rescued
          by the addition of GCLM. Interestingly, the Pro158Leu mutant has kinetic constants comparable
          to those of wild-type GCLC, suggesting that heterodimer formation is needed for stability in
          vivo.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21657237
      reference_title: Enzymatic defects underlying hereditary glutamate cysteine ligase deficiency are
        mitigated by association of the catalytic and regulatory subunits.
      evidence_source: IN_VITRO
      explanation: Establishes two distinct molecular failure modes among the clinical GCLC alleles -
        impaired catalysis versus impaired heterodimer-dependent stability - and the modifier role of
        GCLM.
    first_seen_at: '2026-09-28T17:49:57.759551+00:00'
