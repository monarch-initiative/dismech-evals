          glutathione, which removes the red cell''s main defence against oxidative injury. Glutathione
          was effectively absent in a severely affected GCL-deficient proband. A three-patient Japanese
          series reported values of 4.4%, 13.1% and 6.9% of normal, but only two of those three patients
          had GCL deficiency (the third had glutathione synthetase deficiency) and the report does not
          say which value belongs to which enzyme defect, so that range is indicative of glutathione-synthesis
          defects generally rather than GCL-specific. This is the disease-specific substitution for the
          module''s generic intrinsic erythrocyte lesion.

