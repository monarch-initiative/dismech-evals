      assertion_type: Genetic
      assertion:
        name: GCLC variants
        gene_term:
          preferred_term: GCLC
          term:
            id: hgnc:4311
            label: GCLC
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: Biallelic GCLC missense variants
          description: 'All disease alleles reported to date are missense and hypomorphic (partial loss
            of function). The published set is c.379C>T (p.Arg127Cys), c.473C>T (p.Pro158Leu), c.514T>A
            (p.Ser172Thr), c.1109A>T (p.His370Leu), c.1241C>T (p.Pro414Leu) and c.1772G>A (p.Ser591Asn).
            Complete loss of GCLC is not observed in patients.

            '
        - name: Homozygous family-specific alleles in consanguineous kindreds
          description: 'Reported families are frequently consanguineous, and affected sibships are homozygous
            for a single family-specific allele - c.1772G>A (p.Ser591Asn) and c.514T>A (p.Ser172Thr) in
            two consanguineous families, c.379C>T (p.Arg127Cys) in an Arab-Muslim Israeli child.

            '
        features: 'Only six pathogenic GCLC alleles have been reported worldwide. Genotype does not predict
          whether a patient develops the neurological phenotype: c.514T>A (p.Ser172Thr) has been reported
          both in children with normal neurological examinations and in an adult with late-onset spinocerebellar
          degeneration.

          '
      selected_evidence:
        snippet: To date, no specific GCLC gene mutation has been attributed to the reported neurological
          constellation of symptoms.
        supports: SUPPORT
