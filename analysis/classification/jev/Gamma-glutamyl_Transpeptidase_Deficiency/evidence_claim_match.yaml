              label: gamma-glutamyl transpeptidase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired extracellular glutathione catabolism
        biological_scale: CELLULAR
        description: 'Glutathione is exported from cells and filtered at the glomerulus, and is normally
          degraded at the luminal brush border of the renal proximal tubule, where GGT is concentrated.
          Without GGT, filtered and circulating glutathione cannot be broken down for recovery of its
          constituent amino acids. Older work proposed that the gamma-glutamyl cycle mediates amino-acid
          transport, but GGT-deficient patients have normal plasma amino acids and renal amino-acid reabsorption,
          and the extracellular hydrolysis of glutathione is now regarded as the enzyme''s physiological
          role.

          '
        cell_types:
        - preferred_term: epithelial cell of proximal tubule
          term:
            id: CL:0002306
            label: epithelial cell of proximal tubule
        locations:
        - preferred_term: proximal tubule
          term:
            id: UBERON:0004134
            label: proximal tubule
        biological_processes:
        - preferred_term: glutathione catabolic process
          term:
            id: GO:0006751
            label: glutathione catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: Within the kidney, the enzyme is primarily associated with the luminal surface of the
          brush border membrane of the proximal straight tubule.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
