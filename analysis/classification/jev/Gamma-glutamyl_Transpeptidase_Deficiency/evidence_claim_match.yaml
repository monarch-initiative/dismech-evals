          description: 'Shows tissue glutathione depletion from chronic urinary loss, and its reversal
            by a cysteine prodrug.

            '
          limitations: 'Human patients are reported to have normal cellular glutathione and none has the
            mouse growth failure, cataracts or infertility, so the mouse tissue-depletion mechanism may
            not operate, or not to the same degree, in humans.

            '
          divergences:
