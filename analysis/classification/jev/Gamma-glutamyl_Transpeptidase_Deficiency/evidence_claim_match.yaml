      assertion:
        name: Loss of GGT1 glutathione hydrolase activity
        biological_scale: MOLECULAR
        description: 'GGT1 is an extracellular, plasma-membrane-anchored enzyme that hydrolyses or transfers
          the gamma-glutamyl moiety of glutathione and other gamma-glutamyl compounds; it catalyses the
          first step of glutathione degradation. In the one molecularly characterised family a homozygous
          16.9 kb intragenic GGT1 deletion abolishes it. Activity in affected individuals is very low
          or below detection in serum, but is not completely absent in all patients studied, consistent
          with contributions from other members of the GGT gene family.

          '
        genes:
        - preferred_term: GGT1
          term:
            id: hgnc:4250
            label: GGT1
        molecular_functions:
        - preferred_term: glutathione hydrolase activity
          term:
            id: GO:0036374
            label: glutathione gamma-glutamate hydrolase
          modifier: DECREASED
        - preferred_term: leukotriene C4 hydrolase activity
          term:
            id: GO:0002951
            label: leukotriene-C(4) hydrolase activity
          modifier: DECREASED
        genetic_context:
          description: 'Homozygous 16.9 kb intragenic deletion of GGT1 with a 13 bp insertion at the junction,
            in the only family with a molecular diagnosis.

            '
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
      selected_evidence:
        snippet: The well-characterized GGT1 is an extracellular enzyme that is anchored to the plasma
          membrane of cells. There, it hydrolyzes and transfers gamma-glutamyl moieties from glutathione
          and other gamma-glutamyl compounds to acceptors.
