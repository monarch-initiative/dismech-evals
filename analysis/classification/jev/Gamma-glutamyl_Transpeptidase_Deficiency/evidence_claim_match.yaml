            materiality: QUALIFYING
            description: 'The mouse loses enough cysteine through glutathionuria to deplete liver and
              lens glutathione, whereas cellular glutathione is reported normal in patients; differences
              in dietary cysteine supply or in compensating GGT family members between species are possible
              explanations that have not been tested.

              '
          readouts:
          - name: Growth and behaviour after cysteine-prodrug supplementation
            target: Systemic cysteine and glutathione salvage failure
            direction: RESTORED
            interpretation: Rescue by a cysteine prodrug supports cysteine/glutathione deprivation as
              the cause of the mouse phenotype.
      selected_evidence:
        snippet: Glutathionuric mice exhibited lethargy, severe growth failure, shortened life spans and
          infertility.
        supports: SUPPORT
