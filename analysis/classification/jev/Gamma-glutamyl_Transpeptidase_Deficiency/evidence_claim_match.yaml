      assertion_type: Pathophysiology
      assertion:
        name: Neurodevelopmental and behavioural involvement of uncertain attribution
        biological_scale: ORGANISM
        description: 'Five of the seven patients counted in a 2007 review had central nervous system involvement
          (intellectual disability, developmental delay, behavioural problems), and the two genetically
          confirmed siblings have mild psychomotor delay and mild neurological symptoms. This figure is
          strongly shaped by ascertainment: the disorder is found by measuring glutathione, which is not
          part of routine screening, and the early patients were found during metabolic investigation
          of intellectual disability. No genotype-first or otherwise unselected series exists, so there
          is no way yet to tell how often a deficient individual is neurologically normal. The review
          authors state that whether the neurological symptoms are part of the disease remains to be established.

          '
      selected_evidence:
        snippet: We report two siblings with mild psychomotor developmental delay and mild neurological
          symptoms, who presented a markedly increased excretion of glutathione in urine and a very low
          γ-glutamyl transpeptidase activity in serum.
        supports: SUPPORT
