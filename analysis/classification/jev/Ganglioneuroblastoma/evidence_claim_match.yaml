  0fea5f0a8968fd6817c1b1e3d8f6eb153bf2e9cc1e1e724fbd48e519ca0abc3a:
    claim:
      about:
        disease:
          name: Ganglioneuroblastoma
          disease_term:
            preferred_term: ganglioneuroblastoma
            term:
              id: MONDO:0005035
              label: ganglioneuroblastoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ganglioneuroma
        description: 'Ganglioneuroma is the Schwannian stroma-dominant category of the peripheral neuroblastic
          tumors, and intermixed ganglioneuroblastoma is the Schwannian stroma-rich category beside it.
          Both consist largely of Schwannian stroma containing mature or maturing ganglion cells, and
          the INPC maturing subtype of ganglioneuroma may also hold a minor component of individually
          scattered differentiating neuroblasts. Read side by side, their INPC definitions differ in the
          well-defined microscopic neuroblastic nests that characterize the intermixed category; differentiating
          neuroblasts scattered as single cells are compatible with maturing ganglioneuroma. For decades
          ganglioneuroblastoma caused some consternation for pathologists and oncologists, one reason
          being that there was no clear and objective delineation between it and ganglioneuroma. The INPC
          maturing subtype of ganglioneuroma is the tumor group that the earlier Shimada classification
          called ganglioneuroblastoma, well differentiated, so a tumor reported as well-differentiated
          ganglioneuroblastoma under the Shimada nomenclature is a ganglioneuroma under the INPC. Sampling
          adds another source of confusion: compared with surgical resection, core needle biopsy seems
          to be at a disadvantage with nodular ganglioneuroblastoma, in which a neuroblastoma nodule coexists
          with intermixed ganglioneuroblastoma or ganglioneuroma tissue.'
        disease_term:
          preferred_term: ganglioneuroma
          term:
            id: MONDO:0005033
            label: ganglioneuroma
        distinguishing_features:
        - Intermixed ganglioneuroblastoma is defined as tumor tissue more than 50% occupied by a ganglioneuromatous
          component and is characterized by well-defined microscopic nests of neuroblastic cells whose
          neurites are segmentally naked within the nests.
        - In ganglioneuroma, ganglion cells lie individually or in small clusters in Schwannian stroma
          and are either all completely mature (mature subtype) or a mixture of mature and maturing cells
          (maturing subtype); completely mature ganglion cells are covered with satellite cells, and naked
          neurites are not identified around the ganglion cells.
        - Under the INPC definition the maturing subtype of ganglioneuroma may also contain a minor component
          of individually scattered differentiating neuroblasts, present as single scattered cells rather
          than in the microscopic neuroblastic nests that characterize intermixed ganglioneuroblastoma.
        - Under the INPC, intermixed ganglioneuroblastoma is Schwannian stroma-rich and ganglioneuroma
          Schwannian stroma-dominant, while nodular ganglioneuroblastoma is a composite of stroma-rich
          or stroma-dominant tissue with stroma-poor tissue.
        - Compared with surgical resection, core needle biopsy seems to be at a disadvantage with nodular
          ganglioneuroblastoma, where a neuroblastoma nodule coexists with intermixed ganglioneuroblastoma
          or ganglioneuroma tissue; when the tumor is large, multiple cores may give a better chance than
          incisional biopsy of sampling the nodule, which is often hemorrhagic or necrotic and detected
          on radiological images.
        notes: MONDO:0005033 also has central nervous system parents (MONDO:0000640 central nervous system
          primitive neuroectodermal neoplasm and MONDO:0016729 mixed neuronal-glial tumor); this row concerns
          the neuroblastic tumor of the sympathetic nervous system that the MONDO definition describes.
      selected_evidence:
        snippet: By definition, more than 50% of the tumor tissue in this category is occupied by a ganglioneuromatous
          component (see below), where well-developed Schwannian stroma contains sporadic mature or maturing
          ganglion cells. The tumors are characterized by the presence of well-defined microscopic nests
          of neuroblastic cells in various stages of differentiation with actively producing and easily
          recognizable neurites around their cytoplasm (Fig. 2B). Their neurites are segmentally naked
          in those microscopic nests and eventually incorporated in the cytoplasm of Schwannian cells
          in the stromal areas. ... Tumor cells (ganglion cells) are distributed individually or making
          small clusters in Schwannian stroma (Fig. 2C). They are either completely mature (mature GN)
          or a mixture of mature and maturing ganglion cells (maturing GN). Completely mature ganglion
          cells are covered with satellite cells. Neurites produced by the ganglion cells are immediately
          incorporated in the cytoplasm of Schwannian stromal cells, so that naked neurites are not identified
          around the ganglion cells.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41612478
      reference_title: Pathology of peripheral neuroblastic tumors.
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      explanation: In this 2026 pathology review, part one of the quote comes from the section headed
        'Ganglioneuroblastoma, intermixed (Schwannian stroma-rich)' and says only 'this category'; the
        Fig. 2B legend it cites labels the image as ganglioneuroblastoma, intermixed. Part two comes from
        the section headed 'Ganglioneuroma (Schwannian stroma-dominant)' and names its category through
        the mature and maturing GN subtypes. Restating the International Neuroblastoma Pathology Classification,
        the review defines intermixed ganglioneuroblastoma as tumor tissue more than 50% occupied by a
        ganglioneuromatous component and characterizes it by well-defined microscopic nests of neuroblastic
        cells whose neurites are segmentally naked within the nests. In ganglioneuroma, ganglion cells
        lie individually or in small clusters in Schwannian stroma and are either completely mature (mature
        GN) or a mixture of mature and maturing cells (maturing GN); completely mature ganglion cells
        are covered with satellite cells, and because their neurites are immediately incorporated into
        Schwannian stromal cells, naked neurites are not identified around them. The review describes
        the two categories in separate paragraphs and does not compare them directly; read side by side,
        the definitions set the neuroblastic nests of the intermixed tumor against the individually distributed
        or clustered ganglion cells of ganglioneuroma. These are classification criteria, not case data.
