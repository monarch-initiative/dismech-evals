    evidence_metadata:
      reference: PMID:41612478
      reference_title: Pathology of peripheral neuroblastic tumors.
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      explanation: 'This 2026 pathology review discusses percutaneous core needle biopsy and how the INPC
        is applied to it. It advises that when core needle biopsy samples from one site show intermixed
        ganglioneuroblastoma or ganglioneuroma histology and another site in the same patient shows neuroblastoma,
        the pathologist should consider two readings. The first is a variant of nodular ganglioneuroblastoma:
        a neuroblastoma nodule in the primary tumor was not sampled, and the neuroblastoma is found at
        the metastatic site. The second, extremely rare, is multiple primaries presumably composed of
        different clones. For the first reading the review cites its reference for the 2003 modification
        of the INPC; for the second it cites a separate source. ''PNBC'' is the review''s misspelling
        of PCNB (percutaneous core needle biopsy), the abbreviation it uses elsewhere in the same paragraph.
        The sentence is an interpretive recommendation with citations, not case data.'
