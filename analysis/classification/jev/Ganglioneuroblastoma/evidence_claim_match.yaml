        a report from the CCG and COG.'
      quote_role: BACKGROUND
      evidence_source: OTHER
      explanation: 'Table I of this CCG/COG clinicopathological study of 552 ganglioneuroma and ganglioneuroblastoma
        cases restates the International Neuroblastoma Pathology Classification definition of the intermixed
        category. The definition gives the histology this finding records: a transitional form between
        neuroblastoma and ganglioneuroma whose maturation is incomplete, with scattered ''residual'' microscopic
        neuroblastomatous foci (pockets of neuropil holding neuroblastic cells) and a ganglioneuromatous
        component exceeding 50% of the total volume. It is a diagnostic criterion, not cohort data, and
        the 50% threshold applies to microscopic fields from representative sections, not to the whole
        tumour volume.'
