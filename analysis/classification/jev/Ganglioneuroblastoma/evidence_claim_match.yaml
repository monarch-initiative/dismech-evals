            description: 'The INPC composite category: one or more macroscopic, usually hemorrhagic, Schwannian
              stroma-poor neuroblastomatous nodules coexist with an intermixed ganglioneuroblastoma or
              ganglioneuroma component. The proportion of nodule to that component varies from case to
              case. The INPC also recognizes variants of this classical form. In one, neuroblastoma is
              found at a metastatic site while the primary tumor shows only intermixed ganglioneuroblastoma
              or ganglioneuroma histology, as when a nodule in the primary was not sampled; in a CCG/COG
              series the unfavorable nodule was found only at the metastatic site in 6 patients even after
              complete pathology evaluation of the primary tumor. Very rarely, such a discordance reflects
              separate primary tumors presumed to be of different clones. Once classed entirely as unfavorable
              histology, nodular tumors are now divided into favorable and unfavorable subsets by applying
              the neuroblastoma criteria of age at diagnosis, grade of neuroblastic differentiation and
              mitosis-karyorrhexis index to the nodules. The nodular component is favorable when poorly
              differentiated or differentiating with a low or intermediate index in a patient younger
              than 18 months, or differentiating with a low index from 18 months to 5 years; it is unfavorable
              when undifferentiated or of high index at any age, poorly differentiated or of intermediate
              index from 18 months to 5 years, and of any grade or index from 5 years (60 months). Every
              nodular tumor diagnosed at 5 years or older is therefore in the unfavorable subset; in a
              CCG/COG series the favorable-subset patients were 4 months to 4 years 11 months old at diagnosis,
              more than half of them younger than 18 months. Umehara and colleagues defined the two subsets
              in 2000 from a review of 70 Children''s Cancer Group patients. The International Neuroblastoma
              Pathology Committee re-reviewed the same patients, confirmed the diagnosis in 67 and the
              survival difference (8-year event-free survival 86.1% in the favorable versus 32.2% in the
              unfavorable subset), and in 2003 proposed adding the split to the classification. An INRG
              analysis identified 232 patients with nodular ganglioneuroblastoma among 4,071 with a known
              INPC category; 83% were older than 18 months, 83% had unfavorable INPC histology and 2%
              had MYCN-amplified tumors. Outcome in that cohort was very heterogeneous, with event-free
              and overall survival of 54% and 68%, and in the unfavorable subset of a CCG/COG series 5-year
              event-free survival was 80.1% without and 16.7% with stage 4 disease. MONDO subdivides the
              class by background into MONDO:0004408 (stroma-rich) and MONDO:0004407 (stroma-dominant).'
          role: subtype
      assertion_type: Pathophysiology
