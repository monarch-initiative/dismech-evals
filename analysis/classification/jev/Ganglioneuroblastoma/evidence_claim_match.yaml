      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      explanation: This 2026 pathology review restates the four INPC categories with their Schwannian
        stromal features; ganglioneuroblastoma, intermixed is stroma-rich, and the nodular form is composite,
