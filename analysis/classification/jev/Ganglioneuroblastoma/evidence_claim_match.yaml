    evidence_metadata:
      reference: PMID:25081755
      reference_title: 'The neuroblastoma and ganglion components of nodular ganglioneuroblastoma are
        genetically similar: evidence against separate clonal origins.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Analysing eight nodular ganglioneuroblastomas by SNP array and in situ hybridization,
        with DNA extracted separately from neuroblastomatous and ganglioneuromatous areas, the authors
        suggest that the clinical behaviour of nodular ganglioneuroblastoma cannot be explained by separate
        clones with distinct genetic signatures. This favours the single-clone position, arguing against
        independent clonal origins for the neuroblastoma nodule and the ganglion cells of the ganglioneuromatous
        component. It neither covers the Schwann cells, which the same abstract assigns a different origin,
        nor excludes a nodule subclone diverging from a common ancestor; the series is small.
