      reference: PMID:10421273
      reference_title: The International Neuroblastoma Pathology Classification (the Shimada system).
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In a review of 227 neuroblastic tumours by the six-member International Neuroblastoma
        Pathology Committee, consensus diagnoses (five or six of six pathologists agreeing) placed 19
        cases in ganglioneuroblastoma, nodular (composite Schwannian stroma-rich/stroma-dominant and stroma-poor)
        and 5 in ganglioneuroblastoma, intermixed (Schwannian stroma-rich), as separate categories, supporting
        this subtype as distinct from the intermixed form. The counts describe this review set, not subtype
        frequency. The abstract gives no morphologic criteria (described separately) and presents the
        classification as a modified Shimada classification, so it does not show that the split originated
        here.
