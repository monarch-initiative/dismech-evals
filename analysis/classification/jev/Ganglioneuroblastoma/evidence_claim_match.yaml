      reference: PMID:19530234
      reference_title: 'Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma:
        a report from the CCG and COG.'
      quote_role: BACKGROUND
      evidence_source: OTHER
      explanation: 'Table I of this CCG/COG clinicopathological series restates the International Neuroblastoma
        Pathology Classification definition of the ganglioneuroma, maturing subtype (Schwannian stroma-dominant):
        mostly ganglioneuromatous stroma with a minor component of individually scattered, evenly or unevenly
        distributed differentiating neuroblasts and/or maturing ganglion cells, beside fully mature ganglion
        cells that are always covered with satellite cells. So differentiating neuroblasts scattered as
        single cells can occur in this ganglioneuroma subtype. The intermixed row of the same table instead
        describes scattered ''residual'' microscopic neuroblastomatous foci presenting as pockets of neuropil;
        the contrast between single scattered cells and those foci is read from the two definitions side
        by side and is not stated in this row. It is a classification rule restated from the INPC papers,
        not a result of this cohort.'
