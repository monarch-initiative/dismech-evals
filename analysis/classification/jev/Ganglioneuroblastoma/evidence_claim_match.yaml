      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In the Results of this CCG/COG series, the authors summarize Table III: most patients
        with ganglioneuroma-maturing, GNB-intermixed and GNB-nodular favorable-subset tumors had localized
        (INSS stage 1, 2 or 3) disease and low- or intermediate-risk tumors. This supports localized disease
        as the usual presentation of this subtype and shows that the authors class stages 1-3 as localized.
        The sentence pools three favorable histologies and gives no counts.'
