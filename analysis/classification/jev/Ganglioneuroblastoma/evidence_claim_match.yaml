    evidence_metadata:
      reference: PMID:27465021
      reference_title: Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This summarises a retrospective study of localized tumours registered in the German
        neuroblastoma trials NB97 and NB2004, including 162 ganglioneuroma and 55 intermixed ganglioneuroblastoma
        (GNBI) patients. None of the 11 patients given chemotherapy, 9 with GNBI, reached a complete or
        very good partial response. No tumour of either type progressed after complete resection or with
        residuals under 2 cm, whereas all five progressions had residuals over 2 cm. Few patients received
        chemotherapy, and the authors allow that single GNBI patients with immature regions in large residuals
        might benefit.
