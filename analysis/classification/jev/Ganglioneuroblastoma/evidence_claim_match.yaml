      reference: PMID:25081755
      reference_title: 'The neuroblastoma and ganglion components of nodular ganglioneuroblastoma are
        genetically similar: evidence against separate clonal origins.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'Supports the position that the Schwannian stroma is non-neoplastic rather than derived
        from the neoplastic clone. In eight nodular ganglioneuroblastomas studied by SNP array and in
        situ hybridization, the authors conclude that the Schwann cells, unlike the genetically related
        neuroblasts and ganglion cells, have a different origin, possibly a non-neoplastic neural crest
        precursor. Limitations: the Schwann cell result rests on in situ hybridization, because the arrays
        used DNA from whole neuroblastomatous and ganglioneuromatous areas, and the precursor origin is
        proposed, not traced.'
