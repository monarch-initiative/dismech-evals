      reference: PMID:33712610
      reference_title: Schwann cell plasticity regulates neuroblastic tumor cell differentiation via epidermal
        growth factor-like protein 8.
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      explanation: Three neuroblastoma cell lines and two patient-derived short-term cultures were grown
        with primary human Schwann cells from excised peripheral nerve, either in contact or on a trans-well
        insert that let soluble molecules diffuse without contact. Without contact the neuronal differentiation
        marker NF200 rose significantly by day 16 in four of the five cultures, which places the effect
        on released Schwann cell factors rather than cell contact. The experiments are in vitro, the no-contact
        readout was NF200 rather than neurite length, and no ganglioneuroblastoma tissue was studied.
