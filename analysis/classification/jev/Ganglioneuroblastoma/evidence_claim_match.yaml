      reference: PMID:25081755
      reference_title: 'The neuroblastoma and ganglion components of nodular ganglioneuroblastoma are
        genetically similar: evidence against separate clonal origins.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: A case series of eight nodular ganglioneuroblastomas found, by in situ hybridization,
        MYCN gain (4-10 gene copies per nucleus) in the neuroblastoma component, which forms the nodule,
        in 7 of 8 tumours. Finding this copy-number change in the nodule's neuroblasts supports the inference
        that the nodule is formed by the neoplastic neuroblast population. The abstract reports this as
        MYCN gain and does not describe it as amplification. The result does not show whether the nodule
        is a separate clone.
