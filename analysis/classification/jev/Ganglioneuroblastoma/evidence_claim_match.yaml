    evidence_metadata:
      reference: PMID:32291317
      reference_title: Telomere Maintenance Mechanisms Define Clinical Outcome in High-Risk Neuroblastoma.
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      explanation: Three patient-derived high-risk neuroblastoma cell lines that lacked alternative lengthening
        of telomeres and were negative for telomerase activity shortened their telomeres continuously
        in culture, and 2 of 3 spontaneously lost viability. Losing both maintenance mechanisms therefore
        costs replicative capacity, which supports this edge by its converse. The cells are neuroblastoma
        lines, not ganglioneuroblastoma, so applying the result here assumes that whichever ganglioneuroblastoma
        component maintains its telomeres behaves like these cells; that is the inference step.
