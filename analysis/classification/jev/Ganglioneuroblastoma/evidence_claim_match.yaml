      evidence_source: HUMAN_CLINICAL
      explanation: In paraffin-embedded tissue from eight nodular ganglioneuroblastomas, in situ hybridization
        detected MYCN gain in 7 of 8 neuroblastoma samples and, in ganglioneuromatous regions, also in
