    evidence_metadata:
      reference: PMID:10964346
      reference_title: Histopathology defines prognostic subsets of ganglioneuroblastoma, nodular.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'Conclusion of a review of pathology and outcomes for 70 patients with nodular ganglioneuroblastoma
        in the CCG-3881 and CCG-3891 studies. It states that the nodular components are not always aggressive
        and that prognosis can be determined from age-linked histopathology, defined in the Methods as
        the INPC neuroblastoma criteria (age, differentiation grade, mitosis-karyorrhexis index) applied
        to the nodules. The abstract does not separate stage from histology: 63.0% of unfavourable-subset
        patients presented with distant metastasis. PMID:14601099 re-reviewed the same patients and PMID:19530234
        includes them, so these papers are not independent confirmation.'
