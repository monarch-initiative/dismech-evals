      reference_title: 'Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma:
        a report from the CCG and COG.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In this CCG/COG review of 552 centrally reviewed ganglioneuroma and ganglioneuroblastoma
        cases, no patient in the favorable-histology group (43 GN-maturing, 198 GNB-intermixed and 59
        GNB-nodular favorable-subset tumors) died of tumor. The sentence pools the three categories. The
        Results give 173 intermixed patients with survival data: 5 had an event within 5 years, and the
        one who died had developed secondary acute myeloid leukemia. Nearly all intermixed patients had
        stage 1-3 disease, and the cohort is patients registered on cooperative-group studies, not a population
        sample.'
