    evidence_metadata:
      reference: PMID:8108298
      reference_title: Evidence for molecular heterogeneity in human ganglioneuroblastoma.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This case report analysed one composite ganglioneuroblastoma (the older name for the
        nodular subtype) at initial resection and again 2 years later, after progressive disease. In the
        second sample, the more differentiated portion and the neuroblastic foci differed in DNA content
        and N-myc (MYCN) copy number, which the authors read as at least two clones, supporting the clonally
        distinct position. It is one case, and the abstract does not say whether stromal cells were separated
        from tumour cells, so the two clones are an inference from two tissue portions. The abstract reports
        the separate analysis of the two areas only for the sample taken after progression, so it does
        not show whether they already differed at initial resection.
