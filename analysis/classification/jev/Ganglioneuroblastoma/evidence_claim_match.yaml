        a report from the CCG and COG.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In a CCG/COG central pathology review of 552 ganglioneuroma and ganglioneuroblastoma
        tumours, the authors state that 70 (44.0%) of 159 patients in the unfavourable nodular subset
        (GNB-N-US) with a completely resected primary tumour already had distant metastasis from the unfavourable
        neuroblastomatous nodule at diagnosis. It supports this edge for the unfavourable subset only.
        The attribution rests on histological findings, and in 6 completely resected cases no unfavourable
        nodule was found in the primary, only at the metastatic site. Elsewhere the paper counts 74 of
        the 159, not 70.
