      assertion:
        discussion_id: gnb_tmm_prognostic_significance
        prompt: Does telomere maintenance mechanism status predict outcome in ganglioneuroblastoma, as
          it does in high-risk neuroblastoma?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Telomere Maintenance Mechanism Activation
        rationale: The series that established telomere maintenance in ganglioneuroblastoma says its clinical
          significance there is not yet assessable, because the cohort needs several more years of follow-up.
          This matters for how the pathophysiology node is read. In high-risk neuroblastoma, telomere
          maintenance is a poor-prognostic marker and is proposed for the next International Neuroblastoma
          Risk Group classification, so the temptation is to carry that prognostic meaning across to ganglioneuroblastoma
          on the strength of the shared mechanism and the nodular subtype's comparable positive rate.
          Nothing in the ganglioneuroblastoma data supports that step yet. This gap is why the node has
          no edge to an outcome or risk node, and why one should not be added from neuroblastoma evidence.
        posed_date: '2026-10-28T00:00:00Z'
      selected_evidence:
        snippet: a solid evaluation of the clinical significance of TMM status in GN and GNB will require
          several additional years of long-term follow-up.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
