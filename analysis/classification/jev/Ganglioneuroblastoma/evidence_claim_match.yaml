      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      explanation: 'In co-culture, human neuroblastoma tumours and cell lines increased the proliferation
        of human Schwann cells, and the authors conclude that this is an experimental hint that Schwann
        cell growth within neuroblastomas in vivo is caused by the neoplastic neuroblasts. The support
        for this edge is indirect: the stimulation was shown in vitro, so the in vivo link is the authors''
        inference rather than an observation in patients'' tumours, and no co-cultured tumour is identified
        as ganglioneuroblastoma. The result concerns Schwann cell proliferation, not where the stromal
