  56ba6be6a0627ed39188f6f4b3de2e351ea58cf47654f534ad03368bd9365d47:
    claim:
      about:
        disease:
          name: Ganglioneuroblastoma
          disease_term:
            preferred_term: ganglioneuroblastoma
            term:
              id: MONDO:0005035
              label: ganglioneuroblastoma
        context: []
      assertion_type: Treatment
      assertion:
        name: Watchful Observation
        description: 'For non-metastatic intermixed ganglioneuroblastoma and ganglioneuroma, studied together
          in retrospective series whose abstracts report no outcome for observed intermixed tumors on
          their own, a UK nationwide series concluded that watchful active observation can be a safe approach,
          with surgical resection reserved for symptomatic patients, and a single-center series that these
          tumors grow slowly and resection can carry significant morbidity, so watch-and-wait approaches
          should be considered for some patients. Observation rests on the biopsy diagnosis, which is
          not always upheld at surgery: in the UK series, 14 cases (12%) diagnosed on biopsy as ganglioneuroma
          or intermixed ganglioneuroblastoma had neuroblastoma or nodular ganglioneuroblastoma on surgical
          pathology, and a small proportion of observed patients had their diagnosis revised at surgery.'
        action_category: MONITORING
        treatment_term:
          preferred_term: watchful active observation
          term:
            id: NCIT:C25598
            label: Observation Activity
        context: Non-metastatic intermixed ganglioneuroblastoma (evidence pooled with ganglioneuroma)
        notes: NCIT:C15722 Patient Observation (synonyms include watchful waiting and active surveillance)
          fits the action more closely, but neither of its parents, Surveillance (NCIT:C15719) and Healthcare
          Activity (NCIT:C16205), is under NCIT:C25218, so the treatment-action enum rejects it. NCIT:C25598
          Observation Activity (watching something and taking note of what happens) reaches NCIT:C25218
          only through Diagnostic Procedure (NCIT:C18020). It is bound here for the observation step of
          a monitoring strategy (action_category MONITORING), not for a diagnostic test; Acoustic_Neuroma
          and Infantile_Myofibromatosis bind it to their observation rows in the same way. NCIT:C61256
          Monitoring and NCIT:C53607 Patient Monitoring are also outside NCIT:C25218.
      selected_evidence:
        snippet: Watchful active observation can be a safe approach, with surgical resection reserved
          for symptomatic patients. However, a small proportion of patients in the observation group had
          their diagnosis revised to malignant at surgery.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
