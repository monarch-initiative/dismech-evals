      reference: PMID:37243318
      reference_title: 'Ganglioneuroblastoma intermixed: Clinicopathological implications of diagnosis
        at presentation and genomic correlations.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this retrospective Memorial Sloan Kettering series of 53 patients with intermixed
        ganglioneuroblastoma (GNBI) at diagnosis, 16 were first diagnosed at the center and the rest elsewhere
        before referral, and every included GNBI diagnosis was reviewed and confirmed at the center. All
        12 with INRG stage M disease had GNBI diagnosed on biopsy and received neoadjuvant chemotherapy
        before resection, and the resected tumor showed neuroblastoma in 8 and GNBI in 4. The authors
        therefore urge high caution with a biopsy diagnosis of GNBI when metastases are present, and recommend
        a note in the pathology report that the biopsy may not represent the whole tumor. The figure rests
        on 12 patients from one tertiary center, all given chemotherapy between biopsy and resection.
