      reference_title: 'Is There a Role for Chemotherapy in Unresectable Ganglioneuroblastoma Intermixed?:
        A Case Series Analysis.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This abstract reports a retrospective single-centre series of 12 patients with nonmetastatic
        intermixed ganglioneuroblastoma at Phoenix Children's Hospital. The four patients given chemotherapy
        showed no significant tumour reduction and all still needed surgery, and chemotherapy caused febrile
        neutropenia and an anaphylactic reaction. The title and conclusion frame these tumours as unresectable,
        but the abstract does not say why each patient received chemotherapy. With only four treated patients
        the evidence is thin, and it says nothing about how complete a resection must be.
