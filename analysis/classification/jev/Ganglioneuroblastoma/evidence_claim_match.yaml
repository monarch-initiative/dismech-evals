      reference_title: A rare ganglioneuroblastoma secreting dopamine and the value of its measurement
        in diagnosis and prognosis.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Case report of an adrenal ganglioneuroblastoma that produced an excess of dopamine
        while noradrenaline, adrenaline and their methylated derivatives stayed normal. Urinary dopamine
