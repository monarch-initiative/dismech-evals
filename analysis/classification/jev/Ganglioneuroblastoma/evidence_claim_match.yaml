      reference_title: Role of ploidy, chromosome 1p, and Schwann cells in the maturation of neuroblastoma.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In 20 human maturing and mature neuroblastomas (maturing neuroblastoma being the abstract''s
        term for a tumour that differentiates toward ganglioneuroma), in situ hybridization and flow cytometry
        found abnormal chromosome numbers in the neuroblastic and ganglionic cells: near-triploidy in
        18 of 19 tumours and pentaploidy in the remaining one. The 1996 study predates the International
        Neuroblastoma Pathology Classification and does not say how many cases would now be classed as
        ganglioneuroblastoma. Reading these aneuploid cells as tumour cells is an inference from the finding.'
