      - /disease_term
    evidence_metadata:
      reference: PMID:39582110
      reference_title: 'Management of Ganglioneuroma and Ganglioneuroblastoma Intermixed: A United Kingdom
        Children''s Cancer and Leukaemia Group (UK CCLG) Nationwide Study Report.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This UK CCLG nationwide retrospective review covers 259 patients with histologically
        confirmed non-metastatic ganglioneuroma or intermixed ganglioneuroblastoma. It concludes that
        observation can be safe, with resection reserved for symptomatic patients, though a small proportion
        of observed patients had their diagnosis revised at surgery. The abstract calls that a revision
        to malignant, and its background describes both tumors as benign variants, whereas ICD-O-3 codes
        ganglioneuroblastoma as malignant (9490/3). The two diagnoses are pooled and survival is not reported
        by management arm, so the safety statement is the authors' judgement. Twenty-one of the 58 observed
        patients (36%) later needed surgery, with progressive tumour growth cited as a reason; how many
        of them were reclassified is not stated.
