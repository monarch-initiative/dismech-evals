            Classification
          term:
            id: NCIT:C18190
            label: Histopathologic Examination
      selected_evidence:
        snippet: It was always ideal for pathologist to have a completely resected sample for the final
          diagnosis, so as not to miss any unfavorable nodules or different clones. However, in real life,
          we sometimes encountered the situation/clinical decision where we had to evaluate a biopsy or
          incompletely resected material. For those Inco-R cases, FH diagnosis of GN-M, GNB-I, or GNB-N-FS
          was accompanied by the remark of "the diagnosis is made based on review of a limited material"
        supports: SUPPORT
        directness: DIRECT
