  24e66a96e808f6a29fb4a01cabb099e233a143f46f1476dc2cf943ce9f188c8c:
    claim:
      about:
        disease:
          name: Ganglioneuroblastoma
          disease_term:
            preferred_term: ganglioneuroblastoma
            term:
              id: MONDO:0005035
              label: ganglioneuroblastoma
        context:
        - path: /has_subtypes/0
          value:
            name: Intermixed
            display_name: Ganglioneuroblastoma, intermixed (Schwannian stroma-rich)
            classification: histological
            subtype_term:
              preferred_term: intermixed ganglioneuroblastoma
              term:
                id: MONDO:0003326
                label: intermixed schwannian stroma-rich ganglioneuroblastoma
            mappings:
              ncit_mappings:
              - term:
                  id: NCIT:C42057
                  label: Ganglioneuroblastoma, Intermixed
                mapping_predicate: skos:exactMatch
                mapping_source: NCIT
                mapping_justification: NCIT concept that MONDO records as an exact match of MONDO:0003326.
            description: 'The INPC Schwannian stroma-rich category: a transitional form between neuroblastoma
              and ganglioneuroma in which a ganglioneuromatous component makes up more than half of the
              tumor around scattered microscopic neuroblastic nests, with no macroscopic nodule. It is
              always classified as favorable histology. Because the category excludes a macroscopic neuroblastomatous
              nodule, it is typically assigned on examination of the entire resected tumor, since intermixed
              and nodular ganglioneuroblastoma are hard to tell apart on limited samples (the diagnosis
              record gives how a biopsy diagnosis is reported). Most patients have localized disease:
              in a CCG/COG series, 2 of 189 patients with known INSS stage had stage 4 disease. In one
              referral series, biopsy and resection agreed in 17 of 19 patients with localized disease
              who had both, and the authors judged a biopsy adequate there, but a biopsy diagnosis of
              intermixed ganglioneuroblastoma made alongside metastases was not confirmed at resection
              in 8 of 12 patients, all given chemotherapy first, whose resected tumors showed neuroblastoma.
              Localized disease has an excellent outcome: in the CCG/COG series no patient with a favorable-histology
              tumor, intermixed tumors included, died of tumor, and in the referral series none of the
              41 patients with locoregional disease relapsed. In that series 6 of the 12 patients with
              metastases at diagnosis relapsed and 2 died of disease.'
          role: subtype
      assertion_type: HistopathologyFinding
      assertion:
        name: Schwannian Stroma-Rich Ganglioneuromatous Component With Microscopic Neuroblastic Nests
        finding_term:
          preferred_term: ganglioneuromatous (Schwannian stroma-rich) component over 50% of the tumor
            with residual microscopic neuroblastic nests
          term:
            id: NCIT:C42062
            label: Schwannian Stroma More than 50 Percent of the Tumor Volume
        description: 'A ganglioneuromatous, Schwannian stroma-rich component that exceeds 50% of the tumor
          in representative sections, with scattered residual microscopic neuroblastomatous foci: pockets
          of neuropil containing neuroblasts, differentiating neuroblasts and ganglion cells. The tumor
          is maturing, but the process is incomplete. Under the INPC the favorable or unfavorable histology
          group is to be determined only from primary or metastatic tumor tissue obtained before chemotherapy
          or irradiation, and once assigned it is not to be changed during the clinical course, because
          therapy-associated changes, including neuroblastic differentiation and even Schwannian stromal
          development, may not have proven prognostic significance. A diagnosis of intermixed ganglioneuroblastoma
          made on a tumor resected after neoadjuvant chemotherapy does not take the effect of that chemotherapy
          into account.'
        diagnostic: true
        context: Primary or metastatic tumor tissue obtained before chemotherapy or irradiation, classified
          by the INPC
        subtype: Intermixed
        notes: NCIT:C42057 Ganglioneuroblastoma, Intermixed names the neoplasm rather than a microscopic
          finding, so the finding is bound to the morphologic-finding term NCIT:C42062.
      selected_evidence:
        snippet: 'Ganglioneuroblastoma-Intermixed (Schwannian stroma-rich): A transitional form between
          Neuroblastoma and Ganglioneuroma. Tumor is on its way toward full differentiation/maturation;
          however, the process is not complete, as evidenced by scattered "residual" microscopic neuroblastomatous
          foci presenting as pockets of neuropil containing varying numbers of neuroblastic cells with
          various stages of maturation including neuroblasts, differentiating neuroblasts, and/or ganglion
          cells. The proportion of the ganglioneuromatous component to "residual" neuroblastomatous foci
          should exceed 50% of the total volume in microscopic field(s) from representative section(s)
          of the tumor.'
        supports: SUPPORT
        directness: DIRECT
