        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gnb_nodule_clonality
        prompt: Is the neuroblastomatous nodule of nodular ganglioneuroblastoma a clone genetically distinct
          from the rest of the tumor, or a part of a single neoplastic clone that differs from the rest
          only in being less differentiated?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Schwannian Stroma-Poor Neuroblastomatous Nodule
        - has_subtypes#Nodular
        rationale: 'Evidence items use this convention: SUPPORT means the nodule is clonally distinct
          (a multiclonal tumor), that is, a genetically distinct clone, whether it arose independently
          or as a subclone of a common ancestor; REFUTE means the nodule''s neuroblasts and the ganglion
          cells of the ganglioneuromatous component belong to one clone and differ only in differentiation.
          A 2026 pathology review of the INPC describes nodular tumors as multi-clonal, and a 1993 single-case
          study found that the more differentiated portion and the neuroblastic foci of one composite
          ganglioneuroblastoma differed in DNA content and MYCN copy number. An 8-case genetic study found
          the nodule neuroblasts and the ganglion cells genetically related and concluded that the behavior
          of nodular tumors cannot be explained by separate clones with distinct genetic signatures; that
          argues against independent clonal origins but does not exclude a subclone that evolved from
          a common ancestor.'
        posed_date: '2026-10-21T00:00:00Z'
      selected_evidence:
        snippet: Tumors in this category are considered as multi-clonal tumors. In gross appearance, the
          NB component often forms hemorrhagic and necrotic nodule(s) in a background of elastic and yellowish
          white component of GNB-i or GN
        supports: SUPPORT
        directness: DIRECT
    origin:
