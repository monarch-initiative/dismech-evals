        95% of the primary tumor before chemotherapy or irradiation; the comparison group had biopsy or
        partial resection. In nodular unfavorable-subset ganglioneuroblastoma, whose prognosis depended
        significantly on stage, neither event-free nor overall survival differed significantly by resection
        status, but every estimate favored complete resection: 5-year EFS 83.4% vs 60.6% in non-stage
        4 patients, of whom only 16 were incompletely resected, and 24.3% vs 5.4% in stage 4 patients
        (74 vs 51). Resection after chemotherapy was not analysed, so the comparison does not address
        delayed surgery, and a benefit of complete resection is not excluded.'
