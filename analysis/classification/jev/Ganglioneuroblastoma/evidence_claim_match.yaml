      - /disease_term
    evidence_metadata:
      reference: PMID:41858373
      reference_title: Telomere maintenance mechanisms are activated in ganglioneuroblastoma and ganglioneuroma.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'The authors state the gap themselves, in their discussion, about their own cohort.
        It is what makes this an absence of evidence rather than a negative result: they do not report
        that telomere maintenance fails to predict outcome in ganglioneuroblastoma, only that their follow-up
        is too short to say.'
