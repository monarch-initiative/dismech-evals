    evidence_metadata:
      reference: PMID:19530234
      reference_title: 'Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma:
        a report from the CCG and COG.'
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: In a Children's Cancer Group/Children's Oncology Group clinicopathological study of
        ganglioneuroma and ganglioneuroblastoma, the authors note controversial reports on the cellular
        origin of Schwannian stromal cells, then restate Ambros et al.'s report that, in ganglioneuroma-maturing
        and intermixed ganglioneuroblastoma, these cells are not neoplastic but normal diploid cells recruited
        by biologically favourable hyperdiploid neuroblastic cells. The sentence records the disagreement
        and supports the non-neoplastic, recruited-stroma position. It restates another group's work without
        new data, and states this only for those two categories, not for nodular ganglioneuroblastoma.
