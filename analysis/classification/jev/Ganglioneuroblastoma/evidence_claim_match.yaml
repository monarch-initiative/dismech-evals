      reference_title: 'International neuroblastoma pathology classification for prognostic evaluation
        of patients with peripheral neuroblastic tumors: a report from the Children''s Cancer Group.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'This Children''s Cancer Group review of tumors from studies CCG-3881 and CCG-3891
        gives the age-linked INPC criteria for the neuroblastoma category: favorable histology is a poorly
        differentiated or differentiating tumor with low or intermediate MKI under 1.5 years, or a differentiating
        tumor with low MKI at 1.5-5 years; unfavorable histology is an undifferentiated or high-MKI tumor
        at any age, a poorly differentiated or intermediate-MKI tumor at 1.5-5 years, and any tumor at
        5 years or older. The criteria and the quoted survival figures are for neuroblastoma-category
        tumors; that the same criteria are applied to the nodules of nodular ganglioneuroblastoma rests
        on PMID:14601099 and PMID:10964346, so the support for the nodular rule is indirect.'
