    evidence_metadata:
      reference: PMID:11559566
      reference_title: Neuroblastic and Schwannian stromal cells of neuroblastoma are derived from a tumoral
        progenitor cell.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Laser-scanning cytometry of neuroblastoma touch imprints showed Schwannian stromal
        cells, identified by morphology and S-100 staining, with the same DNA content and GD2 staining
        as the neuroblastic cells in all 20 cases. In 7 of the cases, bicolor fluorescence in situ hybridization
        on touch imprints from manually microdissected neuroblast and stroma-rich areas showed the same
        chromosomal makeup in the two populations. From their combined results, the authors concluded
        that both cell types derive from genetically identical neoplastic cells, supporting derivation
        of the stroma from the neoplastic clone rather than recruitment of non-neoplastic cells. The abstract
        gives no INPC category for the tumours, so applying this to ganglioneuroblastoma assumes the stroma
        has the same origin in both tumour types.
