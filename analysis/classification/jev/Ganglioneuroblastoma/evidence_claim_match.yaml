      reference: PMID:19530234
      reference_title: 'Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma:
        a report from the CCG and COG.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In a retrospective CCG/COG cohort, the authors report that complete primary resection
        was not beneficial in nodular unfavourable-subset ganglioneuroblastoma (GNB-N-US), with or without
        distant metastasis. The analysis compared complete resection (at least 95% removed before chemotherapy
        or irradiation) with biopsy or partial resection in 226 patients otherwise treated by risk group.
        Differences were not significant but favoured complete resection (5-year EFS 83.4% vs 60.6%, p
        = 0.2227, non-stage 4, only 16 incompletely resected; 24.3% vs 5.4%, p = 0.1068, stage 4), so
        benefit is not excluded.
