      assertion_type: Pathophysiology
      assertion:
        name: Schwannian Stromal Development
        description: The Schwann-cell stroma that makes up more than half of an intermixed tumor and forms
          the background of a nodular one. The INPC names each category by its Schwannian stromal development,
          which gives intermixed tumors their elastic, yellowish-white gross appearance. In culture, neuroblastoma
          tumors and cell lines stimulate Schwann cell proliferation, and Schwann cell products induce
          neuronal differentiation of neuroblastoma cells. Whether the stromal cells are non-neoplastic
          cells recruited by the tumor or derive from the neoplastic clone is contested (discussion gnb_schwannian_stroma_origin).
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Schwannian stromal cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: Schwann cell proliferation
          term:
            id: GO:0014010
            label: Schwann cell proliferation
        notes: The node is named for the INPC term Schwannian stromal development rather than for stroma
          recruitment, because recruitment presumes the non-neoplastic origin that is still disputed.
      selected_evidence:
        snippet: Tumors in this category are elastic in consistency and yellowish white in color due to
          Schwannian stromal development (Fig. 2A).
        supports: SUPPORT
        directness: DIRECT
