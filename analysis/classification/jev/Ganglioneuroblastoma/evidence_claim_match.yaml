        biological_scale: CELLULAR
        description: Secretion of catecholamines by the tumour, which some ganglioneuroblastomas show.
          In a 3-year-old girl, epinephrine and norepinephrine production by a ganglioneuroblastoma caused
          hypertensive cardiomyopathy, and subtotal resection reduced the catecholamine levels. A ganglioneuroblastoma
          that produced an excess of dopamine alone was followed by its urinary dopamine, which rose with
          recurrence two years after resection. In localized intermixed ganglioneuroblastoma, raised urinary
          homovanillic and vanillylmandelic acid are frequent.
        biological_processes:
        - preferred_term: catecholamine secretion by the tumour
          term:
            id: GO:0050432
            label: catecholamine secretion
          modifier: INCREASED
        notes: No cell type is bound, because the cited reports do not say which tumour component secretes
          the catecholamines, and a ganglioneuroblastoma mixes neuroblastic, ganglionic and Schwannian
          stromal components. The node mirrors the one in the ganglioneuroma entry, whose evidence concerns
          ganglioneuroma and is not reused here.
      selected_evidence:
        snippet: A case is described of a patient with a ganglioneuroblastoma, initially located in the
          right adrenal, which produced an excess of dopamine (7646 and 7959 nmol/24 h), approximately
          two and a half times the upper limit of the normal daily urine output. ... Two years after surgical
          resection, recurrence was indicated by an increase in urinary dopamine (8507 nmol/24 h)
        supports: SUPPORT
