    evidence_metadata:
      reference: PMID:11792807
      reference_title: 'Pigment epithelium-derived factor (PEDF) in neuroblastoma: a multifunctional mediator
        of Schwann cell antitumor activity.'
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      explanation: 'In culture, pigment epithelium-derived factor (PEDF) was the major factor behind Schwann
        cells'' ability to induce differentiation of neuroblastoma tumor cells. The abstract also reports
        that PEDF is produced by ganglionic cells and Schwann cells but not by more primitive tumor cells,
        so it names one Schwann cell product behind this edge. The support is indirect: the result is
        in vitro, and the abstract does not say which Schwann cells or tumor cells were used or whether
        any tumor studied was a ganglioneuroblastoma. ''Major'' does not mean sole; PMID:33712610 identifies
        another secreted Schwann cell protein, EGFL8, as a neuritogen.'
