      explanation: 'The quoted sentence is the definition in the Ganglioneuroblastoma-Nodular row of Table
        I of this CCG/COG series, which restates the INPC definitions used to classify its centrally reviewed
        cases. A nodular tumor is composed of biologically different clones: one or more macroscopic,
        usually hemorrhagic, Schwannian stroma-poor neuroblastomatous nodules coexisting with stroma-rich
        intermixed ganglioneuroblastoma or stroma-dominant ganglioneuroma. The nodule is itself Schwannian
        stroma-poor, the stromal category of neuroblastoma, so what the definition adds is the coexisting
        stroma-rich or stroma-dominant component. It restates the INPC definition rather than reporting
        a finding of this cohort.'
