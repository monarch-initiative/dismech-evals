  c98f4f6ba48424464dbc3384c137a6bafab3ff22ae690473149898e3b7907cda:
    claim:
      about:
        disease:
          name: Ganglioneuroblastoma
          disease_term:
            preferred_term: ganglioneuroblastoma
            term:
              id: MONDO:0005035
              label: ganglioneuroblastoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gnb_schwannian_stroma_origin
        prompt: Is the Schwannian stroma of ganglioneuroblastoma a non-neoplastic host population recruited
          by the neoplastic neuroblasts, or is it derived from the neoplastic clone?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Schwannian Stromal Development
        rationale: 'Evidence items use this convention: SUPPORT means the stroma is a non-neoplastic,
          recruited population; REFUTE means it derives from the neoplastic clone. For the non-neoplastic
          view, a 1996 study of maturing neuroblastomas found normal chromosome numbers in Schwann cells
          but abnormal numbers in neuroblastic and ganglionic cells, and an 8-case study of nodular ganglioneuroblastoma
          found the neuroblasts'' MYCN gain in ganglion cells but not in Schwann cells. For the neoplastic
          view, a 2001 study of neuroblastomas found the same DNA content and GD2 staining in stromal
          and neuroblastic cells by laser-scanning cytometry in 20 tumors, and the same chromosomal makeup
          by fluorescence in situ hybridization in 7, and concluded that both derive from genetically
          identical neoplastic cells. A 2009 cooperative-group paper describes the reports as controversial.
          The answer decides whether ploidy and copy-number results from stroma-rich tumors describe the
          tumor cells, and whether maturation is an interaction between tumor and host cells.'
        posed_date: '2026-10-21T00:00:00Z'
      selected_evidence:
        snippet: Though there have been controversial reports on cellular origin of Schwannian stromal
          cells (28) (29), Ambros et al. report that Schwannian cells in GN-M and GNB-I are not neoplastic
          and do not share the same cellular origin of neural crest with neuroblastic cells, but they
          are normal diploid cells recruited by biologically favorable hyperdiploid neuroblastic cells.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/4
