      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this CCG/COG central review of ganglioneuroma and ganglioneuroblastoma cases registered
        on neuroblastoma studies in 1991-2006, median age at diagnosis was 4 years 1 month for the 198
        intermixed tumors (range 10 months to 16 years 3 months), 1 year 5 months for the 59 favorable-subset
        nodular tumors (4 months to 4 years 11 months) and 3 years 9 months for the 252 unfavorable-subset
        nodular tumors (6 months to 18 years 9 months). The series overlaps the Children's Cancer Group
        review above, including the 70 CCG-3881 and CCG-3891 nodular patients of PMID:10964346 and PMID:14601099,
