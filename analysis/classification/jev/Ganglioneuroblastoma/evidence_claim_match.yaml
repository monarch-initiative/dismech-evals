            description: 'The INPC Schwannian stroma-rich category: a transitional form between neuroblastoma
              and ganglioneuroma in which a ganglioneuromatous component makes up more than half of the
              tumor around scattered microscopic neuroblastic nests, with no macroscopic nodule. It is
              always classified as favorable histology. Because the category excludes a macroscopic neuroblastomatous
              nodule, it is typically assigned on examination of the entire resected tumor, since intermixed
              and nodular ganglioneuroblastoma are hard to tell apart on limited samples (the diagnosis
              record gives how a biopsy diagnosis is reported). Most patients have localized disease:
              in a CCG/COG series, 2 of 189 patients with known INSS stage had stage 4 disease. In one
              referral series, biopsy and resection agreed in 17 of 19 patients with localized disease
              who had both, and the authors judged a biopsy adequate there, but a biopsy diagnosis of
              intermixed ganglioneuroblastoma made alongside metastases was not confirmed at resection
              in 8 of 12 patients, all given chemotherapy first, whose resected tumors showed neuroblastoma.
              Localized disease has an excellent outcome: in the CCG/COG series no patient with a favorable-histology
              tumor, intermixed tumors included, died of tumor, and in the referral series none of the
              41 patients with locoregional disease relapsed. In that series 6 of the 12 patients with
              metastases at diagnosis relapsed and 2 died of disease.'
