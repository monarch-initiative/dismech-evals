    evidence_metadata:
      reference: PMID:10421272
      reference_title: 'Terminology and morphologic criteria of neuroblastic tumors: recommendations by
        the International Neuroblastoma Pathology Committee.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'This is the 1999 terminology paper of the International Neuroblastoma Pathology Committee,
        whose six member pathologists defined morphologically based classifications on the basis of a
        review of 227 cases. It classifies neuroblastic tumors into four categories, each labeled by its
        Schwannian stroma: neuroblastoma (stroma-poor), ganglioneuroblastoma, intermixed (stroma-rich),
        ganglioneuroma (stroma-dominant, with maturing and mature subtypes) and ganglioneuroblastoma,
        nodular, a composite of stroma-rich or stroma-dominant tissue with stroma-poor tissue. The scheme
        therefore separates ganglioneuroblastoma from stroma-poor neuroblastoma and from stroma-dominant
        ganglioneuroma. The abstract gives each category its name, its Schwannian stromal label and, for
        neuroblastoma and ganglioneuroma, the names of its subtypes, but not the morphologic criteria
        that the article says it defines. ''stroma-richlstroma-dominant'' is the source''s typo for stroma-rich/stroma-dominant,
        the spelling in the abstract of the companion INPC article in the same issue (PMID:10421273).
        In this abstract INPC abbreviates the Committee, which proposes the International Neuroblastoma
        Pathology Classification.'
