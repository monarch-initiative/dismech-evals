      explanation: This single-centre retrospective cohort (Hospital for Sick Children, 1990-2014) covers
        67 patients with ganglioneuroma or intermixed ganglioneuroblastoma (17 intermixed), 21 of them
        observed. Its conclusion recommends considering watch-and-wait for some patients, citing slow
        tumour growth and the significant morbidity resection can carry. It supports this rationale and
        recommendation only; metastatic status is not stated, and 6 of the 21 observed patients had progressive
