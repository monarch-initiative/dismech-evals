  d714d82e77fbdf6d0d1dc4aaf324269488d90cbb22fad1c121dc965c3f4e4ede:
    claim:
      about:
        disease:
          name: Ganglioneuroblastoma
          disease_term:
            preferred_term: ganglioneuroblastoma
            term:
              id: MONDO:0005035
              label: ganglioneuroblastoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Telomere Maintenance Mechanism Activation
        biological_scale: MOLECULAR
        conforms_to:
        - enabling_replicative_immortality#Telomere Maintenance Reactivation
        - enabling_replicative_immortality#Telomere Maintenance via Recombination
        mechanism_confidence: PROVISIONAL
        description: 'A subset of ganglioneuroblastoma maintains its telomeres, by either of the two routes
          used in neuroblastoma: alternative lengthening of telomeres, detected as C-circles, or raised
          TERT expression. In a Japanese series of 48 ganglioneuroblastomas, alternative lengthening was
          present in 6 and raised TERT expression in 7 of the 31 tested, with 12 of the 48 positive by
          either route. The activation is concentrated in the nodular subtype, where 10 of 21 were positive,
          a proportion close to the neuroblastoma figure in the same series. In the 18 ganglioneuromas,
          alternative lengthening was absent and one tumour had raised TERT expression. Among the positive
          ganglioneuroblastomas the authors report frequent ATRX alteration and infrequent TERT rearrangement,
          which they take to mean that TERT-high ganglioneuroblastomas raise TERT expression by some mechanism
          other than the rearrangement and promoter mutation that predominate in TERT-high MYCN-not-amplified
          neuroblastoma. Which mechanism that is, the series does not establish.'
        genes:
        - preferred_term: TERT
          term:
            id: hgnc:11730
            label: TERT
        - preferred_term: ATRX
          term:
            id: hgnc:886
            label: ATRX
        biological_processes:
        - preferred_term: telomere maintenance via telomerase
          modifier: INCREASED
          term:
            id: GO:0007004
            label: telomere maintenance via telomerase
        - preferred_term: telomere maintenance via recombination
          modifier: INCREASED
          term:
            id: GO:0000722
            label: telomere maintenance via recombination
        notes: The node binds both routes rather than splitting them, because the one series that measured
          them in ganglioneuroblastoma reports both and defines its positive group as either. Neuroblastoma
          models them as separate nodes, which that entry's larger evidence base supports; this entry
          should split them when a second series makes the two separately characterisable here. No causal
          edge is drawn to or from the nodular subtype node. The relationship reported is enrichment within
