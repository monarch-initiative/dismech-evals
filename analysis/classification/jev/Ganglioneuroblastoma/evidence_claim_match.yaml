      quote_role: BACKGROUND
      evidence_source: OTHER
      explanation: 'In the introduction to a Children''s Cancer Group and Children''s Oncology Group study
        of 552 ganglioneuroma and ganglioneuroblastoma cases, Okamatsu et al. state the INPC rule: GNB-intermixed
        (Schwannian stroma-rich) tumors are always classified as Favorable Histology (FH), whereas GNB-nodular
        tumors are classified as FH or Unfavorable Histology (UH) according to the characteristics of
        their neuroblastic component. It directly supports this subtype''s favorable histology status,
        in contrast to nodular tumors. The sentences restate the INPC papers, whose 2003 revision added
        the nodular split to the classification, rather than reporting a result of this cohort.'
