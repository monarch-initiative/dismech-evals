    evidence_metadata:
      reference: PMID:41612478
      reference_title: Pathology of peripheral neuroblastic tumors.
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      explanation: In its account of the INPC categories, this 2026 pathology review states that tumours
        in 'this category' are considered multi-clonal, and that the neuroblastoma component often forms
        haemorrhagic, necrotic nodules within a ganglioneuroblastoma-intermixed or ganglioneuroma background,
        which identifies the category as nodular ganglioneuroblastoma. It therefore supports the multiclonal
        (clonally distinct nodule) position. It is an expert classification statement with no clonality
        data, so it records how these tumours are classified rather than showing that the nodule is a
        separate clone.
