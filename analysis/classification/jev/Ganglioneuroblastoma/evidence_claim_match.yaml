      assertion_type: CausalEdge
      assertion:
        target: Unlimited Replicative Potential
        description: A telomere maintenance mechanism keeps telomeres from eroding, so the tumour cells
          that carry one can go on dividing. Neuroblastoma cell lines with neither telomerase activity
          nor alternative lengthening of telomeres shortened their telomeres in culture and mostly lost
          viability. No ganglioneuroblastoma cell line or cohort has tested the link.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: high-risk neuroblastoma cell lines that were non-ALT, low TERT expressing, and lacked
          telomerase activity showed continuous shortening of telomeres with growth in vitro and 2 of
          3 TERT-L/non-ALT cell lines spontaneously lost viability after multiple passages in culture
        supports: SUPPORT
        directness: INDIRECT
