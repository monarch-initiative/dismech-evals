      assertion_type: Treatment
      assertion:
        name: Risk-Adapted Chemotherapy-Based Therapy
        description: Patients are treated by neuroblastoma risk group. In Children's Cancer Group and
          Children's Oncology Group studies that registered patients from 1991 to 2006, low-risk patients
          had surgery alone, intermediate-risk patients moderate chemotherapy with surgery, and high-risk
          patients intensive chemotherapy, surgery, radiotherapy and often myeloablative therapy. In one
          referral series of intermixed ganglioneuroblastoma diagnosed at presentation (1995-2021), the
          12 patients presenting with metastases, all diagnosed on biopsy, were treated as high-risk neuroblastoma
          with high-dose chemotherapy, radiotherapy and anti-GD2 monoclonal antibody immunotherapy. Of
          the 41 with locoregional disease, 11 received intermediate-risk neoadjuvant chemotherapy and
          30 no cytotoxic therapy, and all 41 remained progression-free at a median follow-up of 4 years;
          in localized intermixed tumors chemotherapy has seemed ineffective (see Surgical Resection).
          Patients with nodular ganglioneuroblastoma older than 18 months with stage 4 disease form a
          high-risk subgroup that should be considered for aggressive upfront treatment.
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: risk-adapted chemotherapy within neuroblastoma risk-group protocols
          term:
            id: NCIT:C15632
            label: Chemotherapy
        context: Ganglioneuroblastoma assigned to a neuroblastoma risk group, notably high-risk nodular
          disease
        notes: Bound to Chemotherapy, the component shared by the intermediate- and high-risk arms; the
          high-risk arm also includes surgery, radiotherapy, myeloablative therapy and, in the referral
          series, anti-GD2 immunotherapy, so the binding is narrower than the protocols this row describes.
          No therapeutic_agent is recorded, because no cited source names a regimen or antibody for ganglioneuroblastoma.
      selected_evidence:
        snippet: 'Among a total of 3,953 patients registered in CCG and COG neuroblastoma studies from
