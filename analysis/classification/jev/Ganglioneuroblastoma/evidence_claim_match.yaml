        description: 'Ganglioneuroblastoma is diagnosed and subtyped by histopathologic examination of
          tumor tissue under the INPC. Because a macroscopic neuroblastomatous nodule separates nodular
          from intermixed tumors, which are hard to tell apart on limited samples, the completely resected
          tumor is the ideal sample. When only a biopsy or an incompletely resected tumor is available,
          a favorable classification is reported as based on review of limited material: the CCG/COG central
          reviewers did so, and a 2026 pathology review advises it for core needle biopsies that show
          only intermixed ganglioneuroblastoma or ganglioneuroma.'
        diagnosis_term:
