      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      explanation: This 2026 pathology review states that, compared with surgical resection, percutaneous
        core needle biopsy (PCNB) seems to be at a disadvantage for peripheral neuroblastic tumors with
        intra-tumoral heterogeneity, such as nodular ganglioneuroblastoma (GNB-n), where a neuroblastoma
        (NB) nodule coexists with GNB-intermixed (GNB-i) or ganglioneuroma (GN) tissue. When the tumor
        is large, PCNB with multiple cores may give a better chance than incisional biopsy of sampling
        the NB nodule, which is often hemorrhagic or necrotic and seen on imaging. So a core showing only
        GN or GNB-i tissue may come from a nodular tumor whose nodule was missed, and the review's next
        sentence advises reporting such a favorable classification as based on limited material. It is
        an expert statement without case data.
