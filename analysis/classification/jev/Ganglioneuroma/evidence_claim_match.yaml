    evidence_metadata:
      reference: PMID:41858373
      reference_title: Telomere maintenance mechanisms are activated in ganglioneuroblastoma and ganglioneuroma.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In this Japanese series of neuroblastic tumors sampled at diagnosis, alternative lengthening
        of telomeres (ALT) was found in 15% of neuroblastomas and in no ganglioneuroma, and a telomere
        maintenance mechanism (TMM: ALT and/or high TERT expression) in 1 of 18 ganglioneuromas. Graded
        NO_EVIDENCE because neither result says whether a neuroblastic tumor came first. In neuroblastoma
        both mechanisms were found more often in patients older than 18 months, at INSS stage 4 and in
        the high-risk group, while the maturation proposal concerns biologically favorable tumors (PMID:41612478),
        so little or no telomere maintenance in ganglioneuroma is what either answer to the question predicts.
        The authors draw no conclusion about the origin of ganglioneuroma, they leave the clinical significance
        of telomere maintenance in ganglioneuroma to longer follow-up, and the paper''s ganglioneuroma
        denominators differ between its abstract, Results and Discussion.'
