    evidence_metadata:
      reference: PMID:29369484
      reference_title: Characteristics and management of ganglioneuroma and ganglioneuroblastoma-intermixed
        in children and adolescents.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In this Hospital for Sick Children retrospective series (1990-2014) of 67 children
        and adolescents with ganglioneuroma (50) or intermixed ganglioneuroblastoma (17), the pathology
        classification changed at resection in three cases, which shows that a pre-resection diagnosis
        is not always upheld, but no ganglioneuroma was reclassified as neuroblastoma. It is a counterweight
        to the UK figure: in this series the changes did not turn a ganglioneuroma into neuroblastoma.
        The abstract does not say what the three changes were, whether the earlier diagnoses were made
        on biopsy, or how many patients had a biopsy before resection.'
