      reference_title: 'Terminology and morphologic criteria of neuroblastic tumors: recommendations by
        the International Neuroblastoma Pathology Committee.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'The 1999 terminology paper of the International Neuroblastoma Pathology Committee
        names ganglioneuroma the Schwannian stroma-dominant category of neuroblastic tumors, so the tumor
        is defined by its dominant Schwannian stroma. This is a classification label: it says nothing
        about how the stroma develops or where its cells come from, so its support for this node is indirect.
        The quote keeps the abstract''s spelling ''stroma-richlstroma-dominant''.'
