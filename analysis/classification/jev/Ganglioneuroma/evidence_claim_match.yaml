    evidence_metadata:
      reference: PMID:27465021
      reference_title: Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed.
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: 'In the discussion of this retrospective study of localized ganglioneuroma and intermixed
        ganglioneuroblastoma in patients aged 21 years or younger at diagnosis, registered in the German
        NB97 and NB2004 neuroblastoma trials, the authors ask why mature tumors can progress at all. They
        restate a suggestion by Nishihira and colleagues that a minor increase in tumor volume may also
        be caused by proliferation of the Schwannian stroma rather than of tumor cells, and add that this
        could explain volume changes too small to count as progression under the International Neuroblastoma
        Response Criteria. This is the evidence from patients for Schwann cell proliferation (GO:0014010)
        in this node, and it is weak: it is a hedged suggestion restated from another group, not a result
        of this study, and the sentence does not say what the original observation was. No measurement
        of Schwann cell division in ganglioneuroma is cited, so an increase in Schwann cells by recruitment
        into the tumor is not ruled out.'
