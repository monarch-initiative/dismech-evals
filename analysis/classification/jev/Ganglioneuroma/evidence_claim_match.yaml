      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this retrospective cohort of 51 consecutive patients whose primary retroperitoneal
        ganglioneuroma was resected at one high-volume sarcoma center, 11 (21.6%) had postoperative complications,
        including gastroparesis, pancreatic fistula, liver function impairment and wound infection, and
        one patient died of intestinal ischemia and necrosis; the Results place the death on postoperative
        day 8. Ten of the 11 patients had Clavien-Dindo grade I or II complications, and the death was
        grade V. The series is limited to retroperitoneal tumors, many of them large, and the authors
        warn that their referral cohort may be biased towards complex cases.
