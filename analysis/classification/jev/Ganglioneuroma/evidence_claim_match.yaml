      explanation: Retrospective review of all 101 patients diagnosed with ganglioneuroma at a single
        institution between 1995 and 2025 (mean age 26.9 years). Tumors arose in the retroperitoneum in
        46 (45.5%), the thoracic paraspinal or mediastinal region in 33 (32.7%), the presacral space in
