        aged 21 or younger at diagnosis, all primary sites): MIBG uptake was positive in 27 of 110 tested
        patients with ganglioneuroma (24.5%). This qualifies the adult adrenal series above, in which
        all 4 scanned ganglioneuromas were MIBG-negative: uptake is uncommon in ganglioneuroma but does
