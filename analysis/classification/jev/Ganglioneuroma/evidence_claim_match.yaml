              id: MONDO:0005033
              label: ganglioneuroma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tumoral Vasoactive Intestinal Peptide Secretion
        description: Secretion of vasoactive intestinal peptide (VIP) by the tumor, described in case
          reports of young children with ganglioneuroma and diarrhea. In one child with a retroperitoneal
          tumor, the tumor contained large amounts of VIP, plasma VIP was raised before surgery and the
          VIP concentration was normal after it; in a child with a thoracic tumor, the authors attributed
          the diarrhea to an excess of VIP secreted by the tumor; and in a 3-year-old girl with a thoracic
          paraspinal tumor, serum VIP was 314 pmol/l before surgery (normal less than 30) and 14 pmol/l
          6 months after it.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: vasoactive intestinal peptide (VIP) secretion by the tumor
          term:
            id: GO:0030072
            label: peptide hormone secretion
          modifier: INCREASED
        notes: No cell type is bound, because the cited reports do not say which tumor cells secrete VIP.
          OLS GO searches on 2026-10-28 for "vasoactive intestinal peptide secretion", "vasoactive intestinal"
          and "VIP secretion" returned VIP receptor binding and receptor activity terms (GO:0031890, GO:0004999)
          but no VIP secretion process, so the parent process peptide hormone secretion is bound.
      selected_evidence:
        snippet: The tumour contained large amounts of vasoactive intestinal polypeptide (VIP) and preoperative
          plasma concentration of this peptide was increased. Postoperatively the VIP concentration was
          normalized, and the diarrhea ceased. Analysis of catecholamine metabolites in urine was normal.
          The findings suggest that the watery diarrhea was due to the benign VIP-producing neural crest
          tumour.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7376870
      reference_title: Vasocative intestinal polypeptide (VIP)-producing ganglioneuroma in a child with
        chronic diarrhea.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Single case report of a 2 1/2-year-old girl with persistent watery diarrhea and a retroperitoneal
        ganglioneuroma. The tumor contained large amounts of VIP and plasma VIP was raised before surgery.
        After the operation the VIP concentration returned to normal and the diarrhea stopped, while urinary
        catecholamine metabolites were normal; the authors suggest the watery diarrhea was due to the
        VIP-producing tumor. This supports the tumor as the source of a circulating VIP excess. It is
        one case, the abstract does not say how much of the tumor was removed, and the tumor and an involved
        lymph node were made of benign ganglioneuroma cells, which the authors judged compatible with
        an originally metastasizing neuroblastoma that had matured late.
