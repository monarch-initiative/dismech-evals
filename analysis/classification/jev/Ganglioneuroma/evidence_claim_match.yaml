      assertion_type: Subtype
      assertion:
        name: Maturing
        display_name: Ganglioneuroma, maturing (Schwannian stroma-dominant)
        classification: histological
        subtype_term:
          preferred_term: maturing ganglioneuroma
          term:
            id: NCIT:C42064
            label: Maturing Ganglioneuroma
        subtype_frequency: VERY_FREQUENT
        description: In the INPC, maturing ganglioneuroma (Schwannian stroma-dominant) is composed predominantly
          of ganglioneuromatous stroma with a minor component of individually scattered differentiating
          neuroblasts and/or maturing ganglion cells, in addition to fully mature ganglion cells; the
          fully mature ganglion cells are always covered with satellite cells. The INPC assigns tumors
          in this category to its favorable histology group. The subtype corresponds to the tumor group
          that the earlier Shimada classification called ganglioneuroblastoma, well differentiated. In
          German trials of localized tumors in patients aged 21 years or younger, 144 of 162 ganglioneuromas
          (88.9%) were maturing, with a median age at diagnosis of 71 months; the very-frequent band describes
          that cohort. In CCG/COG studies, all 36 patients with maturing ganglioneuroma and a known stage
          had INSS stage 1-3 disease.
      selected_evidence:
        snippet: 'Ganglioneuroma-Maturing (Schwannian stroma-dominant): Composed predominantly of ganglioneuromatous
          stroma with a minor component of individually scattered, evenly or unevenly distributed differentiating
          neuroblasts and/or maturing ganglion cells, in addition to fully mature ganglion cells. Fully
          mature ganglion cells are always covered with satellite cells. Tumors in this category are classified
          into a Favorable Histology Group.'
        supports: SUPPORT
        directness: DIRECT
