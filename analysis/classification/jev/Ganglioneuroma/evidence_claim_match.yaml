      reference_title: Watery diarrhoea and ganglioneuroma with secretion of vasoactive intestinal peptide.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Case report of a young girl presenting with diarrhea and stridor who had a thoracic
        ganglioneuroma, partially resected, whose tissue held an abnormally high VIP content by radioimmunoassay.
        From this case the authors suggest that the diarrhea of the syndrome of ganglioneuroma and bowel
        dysfunction is due to an excess of VIP secreted by the tumor, which supports tumoral VIP secretion.
        It is a single case, generalized by the authors to the syndrome. The abstract reports no plasma
        VIP and records abnormal urinary catecholamines and catechol metabolites in the same child.
