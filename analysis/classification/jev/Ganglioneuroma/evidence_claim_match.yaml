    evidence_metadata:
      reference: PMID:27465021
      reference_title: Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In this retrospective study of 808 consecutive localized neuroblastic tumors registered
        in the German neuroblastoma trials NB97 and NB2004, in patients aged 21 years or younger with
        central histology review by INPC criteria, median age at diagnosis rose in order across the groups:
        9 months for neuroblastoma and nodular ganglioneuroblastoma, which the paper reports only as one
        pooled group of 591, 61 months for the 55 intermixed ganglioneuroblastomas, 71 months for the
        144 maturing and 125 months for the 18 mature ganglioneuromas. The abstract gives one p-value
        (p < 0.001) for the comparison, and no pairwise comparisons are reported in the text. Metastatic
        tumors and patients over 21 were excluded, so the 9-month figure is not the median age of neuroblastoma
        as a whole, and the ganglioneuroma medians leave out older patients.'
