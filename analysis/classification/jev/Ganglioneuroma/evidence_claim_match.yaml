      - /disease_term
    evidence_metadata:
      reference: PMID:39582110
      reference_title: 'Management of Ganglioneuroma and Ganglioneuroblastoma Intermixed: A United Kingdom
        Children''s Cancer and Leukaemia Group (UK CCLG) Nationwide Study Report.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this UK CCLG retrospective series of 259 patients with non-metastatic ganglioneuroma
        or intermixed ganglioneuroblastoma, surgical pathology differed from the biopsy diagnosis in 45
        cases, and in 14 (12%) a biopsy diagnosis of ganglioneuroma or intermixed ganglioneuroblastoma
        became neuroblastoma or nodular ganglioneuroblastoma at surgery. The abstract gives no denominator
        for the percentages, does not split the changes by biopsy diagnosis or management arm, and does
        not say whether they reflect limited sampling, reinterpretation or change in the tumor before
        surgery.
