    evidence_metadata:
      reference: PMID:27465021
      reference_title: Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Retrospective study of localized neuroblastic tumors registered in the German NB97
        and NB2004 trials (diagnosed 2000-2009 at age 21 or younger, with central histology review). The
        text says diagnosis was made at routine check-ups or visits to the doctor for other reasons in
        50% of all cases, with no significant difference between mature and immature tumors. Table 1 (the
        column headings and the Diagnosis by chance row) gives 70 of 161 patients with ganglioneuroma
        (43.5%), against 30 of 55 with intermixed ganglioneuroblastoma (54.5%) and 306 of 591 with neuroblastoma
        or nodular ganglioneuroblastoma (51.8%); p1 compares ganglioneuroma with intermixed tumors (0.163)
        and p2 the pooled mature tumors with the immature ones (0.177). Chance discovery is therefore
        common in ganglioneuroma but not distinctive of it. Metastatic tumors were excluded.
