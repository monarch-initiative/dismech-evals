      reference: PMID:27465021
      reference_title: Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In the Discussion of their German NB97/NB2004 series of localized neuroblastic tumors,
        the authors take their own age gradient as indirect support for the hypothesis that a good part
        of ganglioneuroma originates from neuroblastoma: patients with ganglioneuroma or intermixed ganglioneuroblastoma,
        taken together, were older at diagnosis than those with immature tumors, and the grade of differentiation
        rose with median age, which fits mature tumors having had time to mature in situ before they were
        found. The support is indirect: the gradient compares different patients at diagnosis, and although
        residual tumors were followed over time, the paper reports no tumor seen to mature during follow-up.
        It bears on whether ganglioneuroma arises from an earlier neuroblastic tumor more than on how
        neuroblasts differentiate into ganglion cells. In the next paragraph the authors add that widespread
        ultrasound check-ups of infants and young toddlers in Germany could find more small, asymptomatic
        localized immature neuroblastomas in infancy, a point that bears on the same age difference without
        involving maturation.'
