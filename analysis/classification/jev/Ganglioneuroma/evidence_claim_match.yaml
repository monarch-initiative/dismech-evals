              id: MONDO:0005033
              label: ganglioneuroma
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Histopathologic Classification
        description: 'Ganglioneuroma is diagnosed and subtyped by histopathologic examination of tumor
          tissue under the INPC. A biopsy diagnosis is not always upheld at surgery: in a UK nationwide
          series of ganglioneuroma and intermixed ganglioneuroblastoma, 14 (12%) biopsy diagnoses of ganglioneuroma
          or intermixed ganglioneuroblastoma changed to neuroblastoma or nodular ganglioneuroblastoma
          on surgical pathology, whereas in a Hospital for Sick Children series of the two tumors classification
          changed at resection in three cases and no ganglioneuroma was reclassified as neuroblastoma.
          A 2026 pathology review advises noting in the report that a favorable classification made on
          a core needle biopsy showing only intermixed ganglioneuroblastoma or ganglioneuroma was determined
          on review of limited material.'
        diagnosis_term:
          preferred_term: histopathologic examination under the International Neuroblastoma Pathology
            Classification
          term:
            id: NCIT:C18190
            label: Histopathologic Examination
      selected_evidence:
        snippet: In 45 cases (39%), surgical pathology was different from pathology at biopsy, and in
          14 (12%) the pathology changed from GN/GNBi to neuroblastoma/GNB nodular.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
