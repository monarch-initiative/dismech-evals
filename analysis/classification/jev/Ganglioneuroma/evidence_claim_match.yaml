      assertion_type: HistopathologyFinding
      assertion:
        name: Ganglion Cells in a Schwannian Stroma-Dominant Background
        finding_term:
          preferred_term: Schwannian stroma-dominant ganglioneuromatous tissue with mature or maturing
            ganglion cells
          term:
            id: NCIT:C42063
            label: Schwannian Stroma Predominant Component of the Tumor Volume
        description: Ganglion cells distributed singly or in small clusters in Schwannian stroma; in mature
          ganglioneuroma they are all completely mature, and in maturing ganglioneuroma mature and maturing
          ganglion cells are mixed. Completely mature ganglion cells are covered with satellite cells.
          Neurites produced by the ganglion cells are incorporated into the cytoplasm of Schwannian stromal
          cells, so naked neurites are not identified around the ganglion cells. Grossly the tumors are
          elastic, yellowish white, well circumscribed and encapsulated, although deeply seated tumors
          may grow into the surrounding fat, without prognostic significance. The INPC classifies ganglioneuroma
          as its Schwannian stroma-dominant category and always places it in the favorable histology group.
        diagnostic: true
        context: Tumor tissue classified by the INPC
        notes: NCIT:C3049 Ganglioneuroma names the neoplasm rather than a microscopic finding, so the
          finding is bound to the morphologic-finding term NCIT:C42063, a child of NCIT:C42062 Schwannian
          Stroma More than 50 Percent of the Tumor Volume, which the Ganglioneuroblastoma entry binds.
      selected_evidence:
        snippet: Tumors in this category represent the most mature form of pNTs. They are elastic and
          yellowish white, and free surfaces are well-circumscribed and encapsulated. However, infiltrative
          growth into the surrounding fatty tissue, without prognostic significance, may be observed in
          deeply seated GN. Tumor cells (ganglion cells) are distributed individually or making small
          clusters in Schwannian stroma (Fig. 2C). They are either completely mature (mature GN) or a
          mixture of mature and maturing ganglion cells (maturing GN). Completely mature ganglion cells
          are covered with satellite cells.
        supports: SUPPORT
        directness: DIRECT
