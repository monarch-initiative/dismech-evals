    evidence_metadata:
      reference: PMID:19530234
      reference_title: 'Clinicopathological characteristics of ganglioneuroma and ganglioneuroblastoma:
        a report from the CCG and COG.'
      quote_role: BACKGROUND
      evidence_source: OTHER
      explanation: Table I of this CCG/COG clinicopathological series of 552 ganglioneuroma and ganglioneuroblastoma
        cases restates the International Neuroblastoma Pathology Classification definition of the ganglioneuroma-maturing
        subtype (Schwannian stroma-dominant). The tumor is mostly ganglioneuromatous stroma, with a minor
        component of individually scattered differentiating neuroblasts and/or maturing ganglion cells
        beside fully mature ganglion cells. The fully mature ganglion cells are always covered with satellite
        cells, and tumors in this category are classified as favorable histology. It is a classification
        rule restated from the INPC papers, not a result of this cohort.
