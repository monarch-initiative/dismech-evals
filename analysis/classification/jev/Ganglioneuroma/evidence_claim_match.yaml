      reference: PMID:11745206
      reference_title: 'Histopathology (International Neuroblastoma Pathology Classification) and MYCN
        status in patients with peripheral neuroblastic tumors: a report from the Children''s Cancer Group.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This Children's Cancer Group series classified 628 neuroblastic tumors under the INPC,
        9 of them ganglioneuromas, and tested each for MYCN status. Amplification was seen almost exclusively
        in the neuroblastoma category, and none of the ganglioneuromas was amplified. This supports amplification
        being rare in ganglioneuroma and largely confined to neuroblastoma; it does not show that amplification
        never occurs, and the ganglioneuroma group is 9 tumors.
