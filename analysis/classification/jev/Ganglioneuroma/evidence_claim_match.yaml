    evidence_metadata:
      reference: PMID:33712610
      reference_title: Schwann cell plasticity regulates neuroblastic tumor cell differentiation via epidermal
        growth factor-like protein 8.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: The authors ran RNA-seq on fresh-frozen, Schwann cell stroma-rich areas of six diagnostic
        human ganglioneuroma specimens, collected at surgery or biopsy, in which S100B staining showed
        Schwann cells to be the prevalent cell population. They compared them with neuroblastoma tissue,
        which almost entirely lacks Schwann cells, and with human peripheral nerve fascicles, collected
        at reconstructive surgery, amputation or organ donation and left to degenerate ex vivo, a model
        in which Schwann cells take on the repair phenotype. After genes also expressed in neuroblastoma
        were excluded, the signature shared by ganglioneuroma and injured nerve contained nerve repair-associated
        genes, and the authors read this as stromal Schwann cells in ganglioneuroma taking on a repair-like
        state. This supports Schwann cells as the cell type of this node; it says nothing about Schwann
        cell proliferation. The profiles are of bulk tissue, so assigning the shared signature to the
        Schwann cells rests on sampling Schwann cell-rich areas and on subtracting the genes expressed
        in neuroblastoma. The grade reflects the ganglioneuroma side, which is patient tumor tissue; the
        injured-nerve comparator was a cultured nerve explant.
