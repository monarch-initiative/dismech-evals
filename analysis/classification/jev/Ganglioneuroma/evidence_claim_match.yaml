    evidence_metadata:
      reference: PMID:42537227
      reference_title: 'A comprehensive analysis of ganglioneuromas: a 30-year experience of 101 patients.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'A retrospective review of 101 patients diagnosed with ganglioneuroma at a single institution
        between 1995 and 2025 concludes that the tumors behave indolently, recur rarely and showed no
        malignant transformation. The abstract''s results give the figures: ''Two patients experienced
        recurrence (2.9%, 2/70). No malignant transformations were observed.'' The recurrence denominator
        is the 70 operated patients, not all 101. The absence of transformation was observed over a mean
        final follow-up of 33.8 months (90.9 months for the 31 patients managed by observation), so it
        cannot exclude a rare late event.'
