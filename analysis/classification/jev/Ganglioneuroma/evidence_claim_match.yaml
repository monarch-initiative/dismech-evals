      reference_title: Utility of Phox2b immunohistochemical stain in neural crest tumours and non-neural
        crest tumours in paediatric patients.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In this pediatric immunohistochemistry series, the 65 peripheral neuroblastic tumors
        (pNT) included 10 ganglioneuromas (GN), alongside undifferentiated (NB-UD), poorly differentiated
        (NB-PD) and differentiating (NB-D) neuroblastomas and ganglioneuroblastomas (GNB). Phox2b was
        expressed diffusely in all 65 pNT: strongly in NB-UD and NB-PD, and with less intensity in NB-D,
        GNB and GN. The sentence directly supports PHOX2B expression in ganglioneuroma, as in every pNT
        tested in this series, at lower intensity than in undifferentiated and poorly differentiated neuroblastoma.
        The abstract does not say whether the staining was nuclear or which ganglioneuroma cells stained,
        and the ganglioneuroma group is 10 tumors.'
