    evidence_metadata:
      reference: PMID:29369484
      reference_title: Characteristics and management of ganglioneuroma and ganglioneuroblastoma-intermixed
        in children and adolescents.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This Hospital for Sick Children retrospective series (1990-2014) includes 67 children
        and adolescents with ganglioneuroma (50) or intermixed ganglioneuroblastoma (17). Forty-six had
        upfront surgery and 4 of the 21 initially observed patients were resected later, and post-operative
        complications occurred in 15 of these 50 surgical patients (30%). The abstract gives the histology
        split only for the whole cohort, does not split complications by histology and does not say over
        what period they were counted, so the figure is a surgical complication rate for a pediatric group
        that may include intermixed ganglioneuroblastoma.
