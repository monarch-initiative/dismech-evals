      assertion:
        name: Schwannian Stromal Development
        description: The Schwann-cell stroma that dominates ganglioneuroma tissue; the INPC names ganglioneuroma
          for this feature (Schwannian stroma-dominant). Stromal Schwann cells in ganglioneuroma share
          the expression of nerve repair-associated genes with the repair Schwann cells of human nerve
          injured ex vivo, and repair-type Schwann cells and their secretome induce neuronal differentiation
          of neuroblastoma cells in culture. It has been suggested that a minor increase in the volume
          of mature tumors may also be caused by proliferation of the Schwannian stroma rather than of
          tumor cells. Whether the stromal cells derive from the neoplastic clone is discussed in the
          Ganglioneuroblastoma entry.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Schwannian stromal cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: Schwann cell proliferation
          term:
            id: GO:0014010
            label: Schwann cell proliferation
        notes: The node is named for the INPC term Schwannian stromal development rather than for stroma
          recruitment, because recruitment presumes a non-neoplastic origin that is disputed (discussion
          gnb_schwannian_stroma_origin in the Ganglioneuroblastoma entry).
      selected_evidence:
        snippet: 'Based on morphologic criteria defined in this article, NTs were classified into four
          categories and their subtypes: 1) neuroblastoma (Schwannian stroma-poor), undifferentiated,
          poorly differentiated, and differentiating; 2) ganglioneuroblastoma, intermixed (Schwannian
          stroma-rich); 3) ganglioneuroma (Schwannian stroma-dominant), maturing and mature; and 4) ganglioneuroblastoma,
          nodular (composite Schwannian stroma-richlstroma-dominant and stroma-poor).'
        supports: SUPPORT
        directness: INDIRECT
    origin:
