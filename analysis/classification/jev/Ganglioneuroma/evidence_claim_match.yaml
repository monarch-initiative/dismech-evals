    evidence_metadata:
      reference: PMID:34054050
      reference_title: 'A Metastatic Neuroblastic Tumor in a 28-Month-old Boy: Unusual Spontaneous Regression
        From Neuroblastoma to Ganglioneuroma?'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Single case report (abstract only). A 28-month-old boy had adrenal ganglioneuroblastoma
        with metastases to subcutaneous nodules, a lymph node and multiple bones. Tumors from different
        sites showed ganglioneuroblastoma and ganglioneuroma and shared the same molecular signatures.
        The authors conclude that the tumor probably differentiated spontaneously from neuroblastoma to
        ganglioneuroblastoma and then to ganglioneuroma, even in bone metastases, and they hedge this
        ('probable'; the title ends in a question mark). The abstract reports no neuroblastoma histology
        and no serial biopsies, so the neuroblastoma starting point and the sequence are inferred from
        histology at different sites, and 'spontaneous' rests on the patient staying healthy without aggressive
        chemotherapy. For one patient, the item supports ganglioneuroma arising by maturation of a neuroblastic
        tumor; it says nothing about how often this happens.
