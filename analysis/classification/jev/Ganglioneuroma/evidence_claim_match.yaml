      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Conclusion of a retrospective series of adrenal ganglioneuromas (AGNs) at a tertiary
        referral cancer center, in which catecholamine levels were normal in every patient with results.
        The authors conclude that isolated adrenal ganglioneuromas do not produce catecholamines, which
