      reference: PMID:11346873
      reference_title: Metabolic activity and clinical features of primary ganglioneuromas.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Retrospective series of primary ganglioneuromas, meaning tumors that were ganglioneuroma
        at diagnosis rather than ones evolving from a differentiating neuroblastoma, in patients registered
        with but not enrolled in national neuroblastoma trials. Plasma and/or urinary catecholamines were
        increased in 39%, and the authors conclude that ganglioneuroma may present with metabolic activity
        such as increased catecholamine secretion, which is the claim of this node. The abstract does
        not say how many patients were tested, which catecholamines were raised or in which fluid, and
        it reports no values after resection, so the tumor is the source by the authors' reading rather
        than by a demonstration such as normalization after surgery.
