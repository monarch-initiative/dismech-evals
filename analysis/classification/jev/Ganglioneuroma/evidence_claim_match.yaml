        confirmed non-metastatic ganglioneuroma or intermixed ganglioneuroblastoma (median age 62 months),
        163 of them with ganglioneuroma. It concludes that observation can be safe, with resection reserved
        for symptomatic patients, though a small proportion of observed patients had their diagnosis revised
        to malignant at surgery. The two diagnoses are pooled and survival is not reported by management
        arm, so the safety statement is the authors' judgement. Twenty-one of the 58 observed patients
        (36%) later needed surgery, with progressive tumor growth cited as a reason.
