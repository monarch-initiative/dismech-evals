      assertion:
        name: Urinary Catecholamine Metabolites
        description: In localized tumors registered in the German NB97 and NB2004 trials (patients aged
          21 years or younger), urinary homovanillic acid was raised in 31.7% and vanillylmandelic acid
          in 19.3% of tested patients with ganglioneuroma, less often than in intermixed ganglioneuroblastoma
          or in neuroblastoma and nodular ganglioneuroblastoma, so a normal result does not exclude the
          tumor. In a series of 27 adrenal ganglioneuromas at a referral cancer center, catecholamine
          levels were normal in all 21 patients with results. Among 45 histologically confirmed adrenal
          ganglioneuromas at one center, every tumor with an adrenergic or noradrenergic catecholamine
          profile was a composite ganglioneuroma-pheochromocytoma, and the authors, finding that pure
          and composite tumors overlap on imaging, judged testing for catecholamine excess essential in
          any indeterminate adrenal mass.
        diagnosis_term:
          preferred_term: urinary catecholamine metabolite measurement
          term:
            id: NCIT:C61044
            label: Urine Chemistry Measurement
        measurements:
        - preferred_term: urinary vanillylmandelic acid (VMA)
          term:
            id: LOINC:LP15947-2
            label: Vanillylmandelate
        - preferred_term: urinary homovanillic acid (HVA)
          term:
            id: LOINC:LP15096-8
            label: Homovanillate
        notes: VMA and HVA are bound at the LOINC Part level (Vanillylmandelate, Homovanillate), which
          names the analyte rather than one specimen or method code. The procedure is bound to Urine Chemistry
          Measurement because diagnosis_term takes one term and this row covers both analytes, as in the
          Neuroblastoma entry. The adrenal series cited here measured plasma or urine catecholamines or
          metanephrines, or did not say which.
      selected_evidence:
        snippet: '| | GN (n = 162) | p1 | GNBI (n = 55) | GN / GNBI (n=217) | p 2 | NB / GNBN (n = 591)
          | ... | HVA elevated ... | 45/142 | 0.001 ... | 27/44 | 72/186 | <0.001 ... | 327/531 | | 31.7
          % | 61.4 % | 38.7 % | 61.6 % |'
        supports: SUPPORT
