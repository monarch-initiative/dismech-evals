        (Schwannian stroma-dominant)', a heading the cached text drops; the quote itself refers to deeply
        seated GN, mature GN and maturing GN, and cites Fig. 2C, the ganglioneuroma panel. The review
        calls these tumors the most mature form of peripheral neuroblastic tumor and describes them as
        elastic, yellowish white, well circumscribed and encapsulated, with infiltration of the surrounding
        fat in deeply seated tumors that has no prognostic significance. It places the ganglion cells
        singly or in small clusters in Schwannian stroma, defines mature GN by completely mature ganglion
        cells and maturing GN by a mixture of mature and maturing ganglion cells, and states that completely
        mature ganglion cells are covered with satellite cells. This restates the INPC morphologic criteria
        rather than reporting case data.
