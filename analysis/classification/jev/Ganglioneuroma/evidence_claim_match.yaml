    evidence_metadata:
      reference: PMID:33721367
      reference_title: 'Presentation and outcomes of adrenal ganglioneuromas: A cohort study and a systematic
        review of literature.'
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: 'Pooling the authors'' single-center cohort of adrenal ganglioneuroma (AGN) at Mayo
        Clinic with the 14 published series in their systematic review (the pooled-analysis row of Table
        2), the mean age at diagnosis was 39 years. It applies to adrenal tumors only, and it is not an
        adult-only figure: the pooled series include a pediatric one (mean age 7.3 years in Table 2).
        The pooled patients include composite ganglioneuroma-pheochromocytoma tumors, 20 of the authors''
        45 patients, who were older than patients with pure AGN. The authors state that the data were
        insufficient for meta-analysis, so this is a descriptive pooled figure, and demographics were
        reported in only 10 of the 14 included studies.'
    first_seen_at: '2026-11-09T20:54:22.980814+00:00'
