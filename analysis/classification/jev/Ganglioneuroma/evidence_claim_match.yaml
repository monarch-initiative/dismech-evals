    evidence_metadata:
      reference: PMID:27465021
      reference_title: Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this retrospective study of localized ganglioneuroma (GN) and intermixed ganglioneuroblastoma
        (GNBI) in children and young people registered in the German neuroblastoma trials NB97 and NB2004,
        no tumor was seen to progress after complete resection or when the residual left behind was under
        2 cm on MRI. This held for GN and GNBI taken separately, and every progression in the series arose
        in a larger residual. The sentence reports a clinical outcome and does not mention the stroma.
        Reading it as support for this link rests on resection removing the stroma-dominant tumor tissue,
        so it is indirect. The authors could not rule out that progression in large residuals came from
        immature components, and they cite a suggestion that minor increases in tumor volume may come
        from Schwannian stroma proliferation, so the quote does not show that stromal growth is what resection
        controls.
