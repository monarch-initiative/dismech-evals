        classifies neuroblastic tumors into four categories: ganglioneuroma is Schwannian stroma-dominant,
        intermixed ganglioneuroblastoma stroma-rich, and nodular ganglioneuroblastoma a composite of stroma-rich
        or stroma-dominant tissue with stroma-poor tissue. The stroma-poor component therefore separates
        nodular ganglioneuroblastoma from ganglioneuroma. The quote keeps the abstract''s spelling ''stroma-richlstroma-dominant''.'
