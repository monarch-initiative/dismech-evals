    evidence_metadata:
      reference: PMID:8107654
      reference_title: Catecholamine metabolites in ganglioneuroma.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In a chart review of patients with ganglioneuroma (GN), raised urinary vanillylmandelic
        acid (VMA) and homovanillic acid (HVA) tended to go with larger tumors, even after excluding the
        patient whose later resection disclosed foci of neuroblastoma (NB), and the authors conclude that
        small tumors are unlikely to give positive urinary results. Raised values becoming more common
        with tumor size points to the tumor as the source of the urinary HVA, which is the inference this
        edge rests on, and the authors report the HVA association only as a trend (P = .14). They also
        conclude that raised VMA and HVA are consistent with a well-documented ganglioneuroma, but that
        extreme elevations should prompt a search for occult neuroblastoma, which may then be their source.
