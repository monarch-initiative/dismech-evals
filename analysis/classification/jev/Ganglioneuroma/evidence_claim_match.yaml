      reference_title: 'Clinical features and oncologic outcomes of primary retroperitoneal ganglioneuroma:
        a retrospective cohort study of 51 patients from a high-volume sarcoma center.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This retrospective cohort of 51 consecutive patients whose primary retroperitoneal
        ganglioneuroma (RGN) was resected at one high-volume sarcoma center (Peking University International
        Hospital) reports a median age at diagnosis of 28 years (range 12-73). The range starts at 12
        years, so the series is not restricted to adults. It covers resected retroperitoneal tumors at
        one specialist center, not all ganglioneuromas.
