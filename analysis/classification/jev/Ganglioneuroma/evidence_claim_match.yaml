      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This single-institution retrospective review covers 101 patients diagnosed with ganglioneuroma
        between 1995 and 2025. The authors conclude that observation is safe for asymptomatic tumors,
        particularly when they lie next to critical structures, with no growth observed on long-term follow-up
        apart from minimal growth in a few cases. This is their judgement about the 31 patients they observed,
        a group selected rather than randomized. The series did not compare observed tumors next to critical
        structures with others, so 'particularly' is the authors' recommendation, not a finding that observation
        is safer there. The abstract does not define safety; the outcomes it reports for the observed
        group are no new symptoms and at most minimal tumor growth.
