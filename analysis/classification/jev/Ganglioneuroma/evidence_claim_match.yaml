    evidence_metadata:
      reference: PMID:33721367
      reference_title: 'Presentation and outcomes of adrenal ganglioneuromas: A cohort study and a systematic
        review of literature.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'Mayo Clinic single-center cohort of 45 histologically confirmed adrenal ganglioneuromas
        (1995-2019; median age 44, range 6-87), 20 of them composite ganglioneuroma-pheochromocytomas.
        Every tumor with an adrenergic or noradrenergic catecholamine profile was composite (Table 1:
        15 adrenergic and 3 noradrenergic, all in the composite group), and all 17 tested pure ganglioneuromas
        were non-functional. The finding holds only for tumors with ganglioneuroma histology; it does
        not mean that adrenergic adrenal tumors in general are composite. One composite tumor was non-functioning,
        so a normal catecholamine result does not completely exclude a pheochromocytoma component.'
