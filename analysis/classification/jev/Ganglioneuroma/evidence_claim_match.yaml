      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this cohort, pure and composite adrenal ganglioneuromas did not differ in laterality,
        calcification, homogeneity, shape or appearance, although composite tumors were smaller (median
        39 vs 57 mm). From this the authors recommend testing for catecholamine excess in any indeterminate
        adrenal mass, which makes catecholamine status, not imaging, the way to detect a pheochromocytoma
        component. The support is indirect, because the sentence is a testing recommendation rather than
        a measured difference, and the cohort classified tumors by plasma or urine metanephrines or catecholamines,
        so it is not specific to urine testing.
