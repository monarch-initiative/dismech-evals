    evidence_metadata:
      reference: PMID:27465021
      reference_title: Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This summarizes a retrospective study of localized tumors registered in the German
        neuroblastoma trials NB97 and NB2004, including 162 ganglioneuroma and 55 intermixed ganglioneuroblastoma
        patients aged 21 years or younger. The authors conclude that outcome was excellent, that chemotherapy
        seems not to be effective and that incomplete resection leaving minor residuals under 2 cm appears
        to be sufficient treatment. Few patients received chemotherapy, most of them with intermixed ganglioneuroblastoma,
        and the conclusion pools the two tumor types.
