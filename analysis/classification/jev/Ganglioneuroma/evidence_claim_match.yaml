      reference: PMID:41306794
      reference_title: 'Clinical features and oncologic outcomes of primary retroperitoneal ganglioneuroma:
        a retrospective cohort study of 51 patients from a high-volume sarcoma center.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this retrospective cohort of 51 consecutive patients whose primary retroperitoneal
        ganglioneuroma was resected at one high-volume sarcoma center, postoperative complications occurred
        in 11 patients (21.6%), and one patient died of intestinal ischemia and necrosis; the Results
        place the death on postoperative day 8, from bowel ischemia with septic shock. The tumors were
        large (maximum diameter 4.1-30.2 cm) and 14 patients had multivisceral resection, and the authors
        warn that their referral cohort may be biased towards complex cases, so the rates may not generalize.
        The figure counts patients, not operations, and covers retroperitoneal tumors only.
