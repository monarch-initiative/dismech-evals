              id: MONDO:0005033
              label: ganglioneuroma
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: PHOX2B Immunoreactivity
        description: 'PHOX2B was expressed in every ganglioneuroma examined in two immunohistochemistry
          series: diffusely in all 65 peripheral neuroblastic tumors of a pediatric series, which included
          10 ganglioneuromas, with less intensity in differentiating neuroblastoma, ganglioneuroblastoma
          and ganglioneuroma than in undifferentiated and poorly differentiated neuroblastoma, and in
          all 8 ganglioneuromas of a series of 77 autonomic nervous system tumors. A third series, which
          did not report ganglioneuromas separately, found PHOX2B in 92% of 76 peripheral neuroblastic
          tumors, including two of four adult cases, so the marker is not positive in every tumor of the
          family.'
        notes: 'No finding term is bound: an OLS NCIT search for PHOX2B on 2026-10-28 returned the gene
          (NCIT:C97724), its wild-type allele (NCIT:C97725), gene mutation (NCIT:C135016), the protein
          (NCIT:C97726 Paired Mesoderm Homeobox Protein 2B), an anti-PHOX2B CAR T-cell product (NCIT:C220615)
          and two predisposition terms (NCIT:C115225 Hereditary Neuroblastoma, NCIT:C179469 Genetic Predisposition
          to Neuroblastoma), and no immunoreactivity finding. The two ganglioneuroma series do not say
          whether staining was nuclear or which ganglioneuroma cells stained. They disagree on pheochromocytoma
          and paraganglioma (all 23 positive in PMID:28986989; pheochromocytomas negative and 40% of paragangliomas
          positive in PMID:23715162), so PHOX2B is not used to separate ganglioneuroma from them.'
      selected_evidence:
        snippet: Phox2b was expressed diffusely in pNT (n = 65 of 65), strongly in NB-UD and NB-PD and
          with less intensity in NB-D, GNB and GN.
        supports: SUPPORT
        directness: DIRECT
