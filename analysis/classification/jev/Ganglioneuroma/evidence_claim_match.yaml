    evidence_metadata:
      reference: PMID:33721367
      reference_title: 'Presentation and outcomes of adrenal ganglioneuromas: A cohort study and a systematic
        review of literature.'
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: Pooled descriptive total from a single-center retrospective cohort of 45 patients with
        adrenal ganglioneuroma (Mayo Clinic, 1995-2019) and a PRISMA systematic review of 14 published
        series, 421 patients in the pooled analysis. Across the cohort and the review, 72% of patients
        were discovered incidentally, 20% through symptoms of mass effect and 8% through other symptoms.
        The authors judged the data insufficient for meta-analysis, and mode of discovery was reported
        in only 10 of the 14 reviewed studies, so the 72% is a share of the patients in those series and
        the cohort, not of all 421; one of those series, a 50-patient cross-sectional multicenter study,
        recorded every case as incidental (Table 2). It covers adrenal tumors only. In the single-center
        cohort alone 76% were incidental, and its 20 composite ganglioneuroma-pheochromocytoma tumors
        were found incidentally less often than pure ganglioneuromas (65% vs 84%).
