    evidence_metadata:
      reference: PMID:32728700
      reference_title: Ganglioneuromas are driven by activated AKT and can be therapeutically targeted
        with mTOR inhibitors.
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      explanation: 'In transgenic zebrafish expressing constitutively activated myr-Akt2 in the sympathetic
        nervous system, AKT activation caused a modest increase in proliferation and sympathoadrenal lineage
        cell hyperplasia, which the authors relate to the appearance of low-grade ganglioneuroma, and
        the discussion states that these fish did not develop neuroblastoma, although the same promoter
        driving MYCN or c-MYC induces neuroblastoma in this model. In this model, then, a ganglioneuroma
        formed with no neuroblastoma found, which argues against the proposal that every ganglioneuroma
        is a matured neuroblastoma, not against some arising that way. The authors do not ask whether
        human ganglioneuromas pass through a neuroblastoma stage: they state that ganglioneuroma and neuroblastoma
        both originate from migratory sympathetic neuroblasts of one progenitor lineage, and they propose
        that somatically acquired mutations or epigenetic alterations in the PI3K-AKT-mTOR pathway may
        initiate ganglioneuroma, so reading the model against the all-from-neuroblastoma proposal is the
        curator''s inference. The authors regard the model as faithful to human ganglioneuroma, which
        also shows AKT activation, but the fish tumors had poor Schwannian stroma, whereas human ganglioneuroma
        is defined by dominant Schwannian stroma, and the model does not show that human ganglioneuromas
        form without a neuroblastoma stage.'
