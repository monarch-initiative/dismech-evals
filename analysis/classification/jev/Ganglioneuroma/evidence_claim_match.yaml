    evidence_metadata:
      reference: PMID:41563553
      reference_title: 'Adrenal schwannomas and adrenal ganglioneuromas: our experience and CT characteristic-focused
        systematic review.'
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: 'This pooled series combines the authors'' own adrenal schwannomas (AS) and adrenal
        ganglioneuromas (AG) with histopathologically confirmed cases from a systematic literature review;
        most of the cases come from published reports (25 of the 30 schwannomas and 25 of the 27 ganglioneuromas),
        so the comparison is graded as a review synthesis. The authors report the two tumors as similar
        except for age: patients with ganglioneuroma were younger (28 vs 49.5 years). The abstract does
        not list which features entered this comparison, or say whether the ages are medians or means,
        and it reports separately that progressive delayed enhancement occurred in all AS but not in all
        AG, so ''similar'' should not be read as covering CT enhancement. The finding covers the adrenal
        site only.'
