      reference_title: 'A comprehensive analysis of ganglioneuromas: a 30-year experience of 101 patients.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This 30-year single-institution retrospective review of 101 patients with ganglioneuroma
        reports that seventy patients underwent 72 surgeries, all of them gross-total or subtotal resections,
        and the abstract uses 'cases' for those operations. Short-term postoperative complications followed
