    evidence_metadata:
      reference: PMID:42537227
      reference_title: 'A comprehensive analysis of ganglioneuromas: a 30-year experience of 101 patients.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'This 30-year single-institution retrospective review of 101 patients with ganglioneuroma
        reports that seventy patients underwent 72 surgeries, all of them gross-total (53/72) or subtotal
        (19/72) resections, and the abstract uses ''cases'' for those operations. Short-term postoperative
        complications followed 43.1% of these operations, most commonly neurological deficits (22.2%).
        The abstract does not say what the 22.2% is a share of, and it does not grade the complications
        by severity. The figure measures short-term surgical morbidity in this series, not lasting harm:
        the same abstract reports most patients stable or improved from baseline at final follow-up.'
