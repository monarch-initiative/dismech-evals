  efa9937374ce532edff79a36a88238a1752ee3452c0ac48e3ebb57668588624c:
    claim:
      about:
        disease:
          name: Ganglioneuroma
          disease_term:
            preferred_term: ganglioneuroma
            term:
              id: MONDO:0005033
              label: ganglioneuroma
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Zebrafish dbh:myr-Akt2 transgenic ganglioneuroma model
        species: Zebrafish
        genotype: Tg(dβh:mCherry;dβh:myr-Akt2), two independent lines
        background: Lines maintained by crossing heterozygous transgenic fish with wild-type AB fish
        description: Stable transgenic zebrafish lines that co-express mCherry and a constitutively active,
          membrane-targeted (myristoylated) mouse Akt2 in the peripheral sympathetic nervous system under
          the zebrafish dβh promoter. Tumours arise in the interrenal gland, the fish counterpart of the
          adrenal gland, from 13 weeks post-fertilization and reach a penetrance of 40-50% by 29 weeks.
          They are ganglioneuromas of differentiated, mature ganglion cells with poor Schwannian stroma,
          and they do not progress to neuroblastoma. A MYCN-transgenic line, Tg(dβh:EGFP-MYCN), which
          develops neuroblastoma in the same gland, is the paper's comparator.
        publication: PMID:32728700
        modeled_mechanisms:
        - target: AKT-mTOR-S6 Pathway Activation
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: ORGANISM
          description: 'The transgene switches AKT signalling on in sympathoadrenal cells, and the resulting
            tumours carry the downstream state seen in human ganglioneuromas: high phosphorylated mTOR,
            S6 ribosomal protein and EIF4EBP1. Phosphorylated mTOR and S6 were undetectable in the MYCN-driven
            fish neuroblastomas.'
          limitations: The activating event is a forced, membrane-targeted mouse Akt2, not a lesion found
            in patients; the cause of AKT activation in human ganglioneuroma is unknown. Because the construct
            bypasses upstream regulation, an allosteric AKT inhibitor that needs that regulation (MK-2206)
            cannot be tested in this model.
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: QUALIFYING
            description: Pathway activation is imposed by a constitutively active transgene rather than
              arising from a patient lesion, so the model shows that active AKT is sufficient for a ganglioneuroma-like
              tumour, not how AKT becomes active in human tumours.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The readouts are from zebrafish interrenal tumours; the human side of the comparison
              rests on immunohistochemistry of archival tumours in the same paper.
          readouts:
          - name: Phosphorylated mTOR, S6 ribosomal protein and EIF4EBP1 in tumour sections
            target: AKT-mTOR-S6 Pathway Activation
            direction: INCREASED
            interpretation: The pathway downstream of the transgene is active in the fish ganglioneuromas,
              as phosphorylated mTOR and S6 are in most human ganglioneuromas.
        - target: Neuroblast-to-Ganglion Cell Maturation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The fish tumours are made of differentiated, mature ganglion cells that carry neural
            markers and derive from sympathetic neuroblasts rather than chromaffin cells, and the authors
            find that they resemble human ganglioneuroma histologically and by gene expression. The model
            shows this mature end state, not the maturation itself.
          limitations: The model forms ganglion cells under a forced AKT signal; whether human ganglioneuromas
            mature from neuroblastic tumours in situ is not tested by it.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: The node describes a neuroblastic tumour maturing step by step through intermixed
              ganglioneuroblastoma to ganglioneuroma. The model shows only the end of that sequence, ganglion
              cells of neuroblast origin, and does not show the tumour passing through the earlier stages.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The tumours arise in the zebrafish interrenal gland, and their expression differences
              from fish neuroblastoma track the human differences only moderately (Pearson r = 0.39 across
              407 orthologous genes).
        - target: Schwannian Stromal Development
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: The fish ganglioneuromas have poor Schwannian stroma, whereas human ganglioneuroma
            is defined as the Schwannian stroma-dominant neuroblastic tumour.
          limitations: The model cannot be used to study how the Schwannian stroma of ganglioneuroma develops
            or what it does to the neuroblastic cells; the paper does not say whether the poor stroma
            reflects the species or the construct.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: INVALIDATING
            description: Schwann stromal cells, the dominant component of human ganglioneuroma, are largely
              absent from the fish tumours, which consist of ganglion cells.
      selected_evidence:
        snippet: Fish transgenic for myr-Akt2 developed mCherry-positive ganglioneuromas in the IRG starting
          at 13 wk postfertilization (wpf) with a penetrance of 40–50% by 29 wpf
        supports: SUPPORT
