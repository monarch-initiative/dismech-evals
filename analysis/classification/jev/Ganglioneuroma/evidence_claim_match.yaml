      reference_title: 'A comprehensive analysis of ganglioneuromas: a 30-year experience of 101 patients.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this retrospective review of all patients diagnosed with ganglioneuroma at one institution
        between 1995 and 2025, the 101 patients had a mean age of 26.9 ± 15.9 years. The abstract gives
        no age range and does not say whether age was taken at diagnosis or at presentation. No age limit
        is stated and PubMed indexes the record for child and adolescent age groups, so this is not an
        adult-only series. It is one institution's case mix, not a population sample.
