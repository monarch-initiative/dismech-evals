      assertion:
        name: Ganglioneuroblastoma
        disease_term:
          preferred_term: ganglioneuroblastoma
          term:
            id: MONDO:0005035
            label: ganglioneuroblastoma
        description: 'The next INPC category toward immaturity. Intermixed ganglioneuroblastoma is characterized
          by well-defined microscopic nests of neuroblastic cells whose neurites are segmentally naked
          within the nests, and nodular ganglioneuroblastoma is a composite of stroma-rich or stroma-dominant
          tissue with stroma-poor neuroblastoma. A biopsy diagnosis of ganglioneuroma or intermixed ganglioneuroblastoma
          is not always upheld at surgery: in a UK nationwide series that pooled the two tumors, 14 (12%)
          such biopsy diagnoses became neuroblastoma or nodular ganglioneuroblastoma on surgical pathology,
          whereas in a Hospital for Sick Children series, also pooled, classification changed at resection
          in three cases and no ganglioneuroma was reclassified as neuroblastoma. In German trials of
          localized tumors, ganglioneuroma less often took up MIBG and less often raised urinary catecholamine
          metabolites than intermixed ganglioneuroblastoma.'
        distinguishing_features:
        - 'Ganglioneuroma: neurites incorporated into the cytoplasm of Schwannian stromal cells, with
          no naked neurites identified around the ganglion cells; intermixed ganglioneuroblastoma: well-defined
          microscopic nests of neuroblastic cells whose neurites are segmentally naked within the nests'
        - Ganglioneuroma has no stroma-poor neuroblastomatous component, which nodular ganglioneuroblastoma
          contains
        - In German trials of localized tumors in patients aged 21 years or younger, MIBG uptake was positive
          in 24.5% of ganglioneuromas against 61.1% of intermixed ganglioneuroblastomas, and ganglioneuroma
          less often raised urinary catecholamine metabolites
      selected_evidence:
        snippet: Neurites produced by the ganglion cells are immediately incorporated in the cytoplasm
          of Schwannian stromal cells, so that naked neurites are not identified around the ganglion cells.
        supports: SUPPORT
        directness: DIRECT
