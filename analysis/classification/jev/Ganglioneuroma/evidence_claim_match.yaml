    evidence_metadata:
      reference: PMID:27465021
      reference_title: Treatment and outcome of Ganglioneuroma and Ganglioneuroblastoma intermixed.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'This retrospective analysis of the German neuroblastoma trials NB97 and NB2004 covers
        patients aged 21 or younger with a localized neuroblastic tumor diagnosed between 1 January 2000
        and 31 December 2009; 162 of the 808 tumors were ganglioneuroma (GN) and 55 were intermixed ganglioneuroblastoma
        (GNBI). Two deaths are reported, both from treatment-related complications: one GN patient died
        of surgery-related complications after complete resection at initial surgery, and one GNBI patient
        died of chemotherapy-related pulmonary edema. No patient in the pooled GN/GNBI cohort died of
        tumor progression, which includes every GN patient. The finding is limited to localized disease
        and to the study''s follow-up: residual GN tumors had a median observation time of 42 months.
        Local progression did occur in three GN patients, all with residuals over 2 cm, so the quote supports
        the absence of tumor deaths rather than the absence of progression.'
