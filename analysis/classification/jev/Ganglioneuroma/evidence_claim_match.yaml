    evidence_metadata:
      reference: PMID:28640941
      reference_title: PHOX2B reliably distinguishes neuroblastoma among small round blue cell tumours.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In a series of 76 peripheral neuroblastic tumors (median age 2 years, four adults)
        stained with a rabbit monoclonal antibody, positivity was defined as nuclear immunoreactivity
        in at least 5% of cells, and PHOX2B was positive in 70 (92%), including 68 of 72 pediatric and
        two of four adult cases. The abstract does not report ganglioneuromas separately, so it bears
        on this finding only through the tumor family as a whole; it shows that PHOX2B is not positive
        in every peripheral neuroblastic tumor.
