    evidence_metadata:
      reference: PMID:10421272
      reference_title: 'Terminology and morphologic criteria of neuroblastic tumors: recommendations by
        the International Neuroblastoma Pathology Committee.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: The 1999 terminology paper of the International Neuroblastoma Pathology Committee,
        whose six member pathologists defined the morphologic criteria from a review of 227 cases, classifies
        neuroblastic tumors into four categories. Ganglioneuroma is the third, the Schwannian stroma-dominant
        category, with maturing and mature subtypes; neuroblastoma is the stroma-poor category and intermixed
        ganglioneuroblastoma the stroma-rich one. Nodular ganglioneuroblastoma is a composite of stroma-rich
        or stroma-dominant tissue with stroma-poor tissue, so ganglioneuroma is the only category whose
        label is stroma-dominant alone. The abstract prints the composite label as 'stroma-richlstroma-dominant',
        and the quote keeps that spelling. The abstract does not assign ganglioneuroma to a prognostic
        group; the classification itself is reported in the companion article (PMID:10421273).
