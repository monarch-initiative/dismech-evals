      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Table 1 of this retrospective study of localized neuroblastic tumors registered in
        the German NB97 and NB2004 trials (diagnosed 2000-2009, age 21 or younger at diagnosis); the excerpt
        gives the column headings and the positive mIBG-uptake row. MIBG uptake was positive in 27 of
        110 tested patients with ganglioneuroma (24.5%), 22 of 36 with intermixed ganglioneuroblastoma
        (61.1%), 49 of 146 for the two mature types pooled (33.6%), and 398 of 444 with neuroblastoma
        or nodular ganglioneuroblastoma (89.6%). 24.5% falls in the occasional band (5-29%), while the
        pooled mature figure in the same row would fall in the frequent band, so the band rests on the
        ganglioneuroma column alone. Per the table footnote, p1 (<0.001) compares ganglioneuroma with
        intermixed ganglioneuroblastoma, and p2 (<0.001) compares the pooled mature tumors with the immature
        ones; no p-value compares ganglioneuroma alone with neuroblastoma. The percentages use the table's
        denominators, so 110 of the 162 ganglioneuromas contribute; the paper does not say why the others
        have no result. The paper does not name the MIBG isotope.
