  b04a936b1e224fce6d8e030fabf68168f55aab38c04a9c78294f40320dac3803:
    claim:
      about:
        disease:
          name: Ganglioneuroma
          disease_term:
            preferred_term: ganglioneuroma
            term:
              id: MONDO:0005033
              label: ganglioneuroma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Adrenal Gland Pheochromocytoma
        disease_term:
          preferred_term: adrenal gland pheochromocytoma
          term:
            id: MONDO:0004974
            label: adrenal gland pheochromocytoma
        description: An adrenal ganglioneuroma must be told from pheochromocytoma (see the Pheochromocytoma
          and Paraganglioma entry), with which it can occur as a composite tumor. Pure and composite adrenal
          ganglioneuromas overlap on imaging, and an unrecognized pheochromocytoma carries perioperative
          morbidity, so the distinction matters before adrenalectomy. Catecholamine excess and MIBG uptake
          favored pheochromocytoma in an adolescent and adult adrenal series, but a minority of ganglioneuromas
          in German trials of younger patients took up MIBG or raised urinary homovanillic acid, so neither
          finding excludes ganglioneuroma.
        notes: Bound to adrenal gland pheochromocytoma (MONDO:0004974), because every cited comparison
          is of adrenal tumors. The Pheochromocytoma and Paraganglioma entry is bound to pheochromocytoma-paraganglioma
          (MONDO:0035540), and OLS on 2026-10-28 gave MONDO:0004974 the parents sympathetic paraganglioma
          (MONDO:0021072) and adrenal medulla neoplasm (MONDO:0021237), not MONDO:0035540, so the row
          does not resolve to that entry by its term.
        distinguishing_features:
        - 'In an adolescent and adult adrenal series, catecholamine excess and MIBG uptake pointed to
          pheochromocytoma: 24-hour urinary catecholamines were raised in all 36 pheochromocytomas and
          normal in the 4 ganglioneuroma patients reported, and 131I-MIBG was positive in 25 (96.2%) pheochromocytomas
          and negative in all 4 ganglioneuromas scanned'
        - 'Neither finding excludes ganglioneuroma: in German trials of localized tumors at any site in
          patients aged 21 years or younger, 24.5% of tested ganglioneuromas took up MIBG and 31.7% raised
          urinary homovanillic acid, a catecholamine metabolite'
        - In another adrenal series catecholamine levels were normal in all 21 ganglioneuroma patients
          with results, and the authors concluded that isolated adrenal ganglioneuromas do not produce
          catecholamines; a catecholamine-secreting adrenal ganglioneuroma has been reported
        - Among 45 histologically confirmed adrenal ganglioneuromas at one center, every tumor with an
          adrenergic or noradrenergic catecholamine profile was a composite ganglioneuroma-pheochromocytoma
      selected_evidence:
        snippet: Catecholamine levels in a 24-hour urine sample were normal in 4 patients with adrenal
          ganglioneuroma and increased in 36 (100%) cases with adrenal pheochromocytoma. (131)I-MIBG nuclear
          scan showed negative results in 4 patients (100%) with adrenal ganglioneuroma and positive results
          in 25 (96.2%) with adrenal pheochromocytom.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19781327
      reference_title: Differential diagnosis and laparoscopic treatment of adrenal pheochromocytoma and
        ganglioneuroma.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'Retrospective series of 18 adrenal ganglioneuromas and 36 adrenal pheochromocytomas
        (1999-2007; ganglioneuroma mean age 41.2 years, range 16-67). 24-hour urinary catecholamines were
        raised in all 36 pheochromocytomas and normal in the 4 ganglioneuroma patients reported, and 131I-MIBG
        was positive in 25 (96.2%) pheochromocytomas and negative in all 4 ganglioneuromas scanned. The
        ganglioneuroma numbers are small: 9 asymptomatic ganglioneuromas under 4 cm had neither test,
        and the abstract does not say how many had urinary catecholamines measured. The result concerns
        adolescent and adult adrenal tumors. ''pheochromocytom'' is PubMed''s own spelling.'
