      assertion_type: Treatment
      assertion:
        name: Surgical Resection
        description: 'In German trials of localized tumors in patients aged 21 years or younger, no ganglioneuroma
          or intermixed ganglioneuroblastoma progressed after complete resection or with residuals under
          2 cm, and incomplete resection leaving minor residuals appeared to be sufficient treatment;
          the 11 patients given chemotherapy, 2 of them with ganglioneuroma, showed no substantial effect,
          and the authors'' conclusion that chemotherapy is not effective pools the two tumor types. Postoperative
          complications are common: short-term complications followed 43.1% of operations, most often
          neurological deficits (22.2%), in a 101-patient single-institution series; complications followed
          surgery in 11 of 51 patients (21.6%) with a resected retroperitoneal ganglioneuroma at a sarcoma
          center, one of whom died on postoperative day 8 of bowel ischemia; post-operative complications
          occurred in 15 of 50 surgical patients (30%) in a pediatric series, and a UK nationwide series
          reported a 19% complication rate, both pooling ganglioneuroma with intermixed ganglioneuroblastoma.
          In two children with a VIP-secreting ganglioneuroma, VIP returned to normal after the operation
          and the diarrhea stopped.'
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: surgical resection
          term:
            id: NCIT:C164212
            label: Tumor Resection
        therapeutic_modality: SURGERY
      selected_evidence:
        snippet: Outcome was excellent and chemotherapy seems not effective while incomplete resection
          with minor residuals (<2 cm) appears to be sufficient for treatment.
        supports: SUPPORT
        directness: DIRECT
