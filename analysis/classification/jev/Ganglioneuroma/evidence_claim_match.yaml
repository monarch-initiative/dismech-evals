    evidence_metadata:
      reference: PMID:33721367
      reference_title: 'Presentation and outcomes of adrenal ganglioneuromas: A cohort study and a systematic
        review of literature.'
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: 'Pooling the authors'' single-center cohort with the 14 published series in their systematic
        review, adrenal ganglioneuromas were discovered incidentally in 72% of patients, because of mass-effect
        symptoms in 20% and because of other symptoms in 8%. The authors attribute the symptoms in that
        fifth to the tumor mass, which their introduction describes as a stroma of mature Schwann cells,
        ganglion cells and nerve fibers. Support for an edge to Pain is indirect: the paper does not say
        which mass-effect symptoms occurred, never names pain, and does not discuss stromal growth. The
        pooled patients had adrenal tumors only, were mostly adults (mean age at diagnosis 39 years),
        and include composite ganglioneuroma-pheochromocytoma tumors.'
