    evidence_metadata:
      reference: PMID:42537227
      reference_title: 'A comprehensive analysis of ganglioneuromas: a 30-year experience of 101 patients.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this single-institution retrospective series, 31 patients (mean age 32.3 years)
        were managed with observation and followed for a mean of 90.9 months. The abstract reports this
        follow-up as 90.9 ± 151 months without saying what the ± value is; a spread larger than the mean
        suggests that follow-up length varied widely between patients. Proximity to major vascular or
        neural structures was the main reason for choosing observation (74.2%), which is a reason for
        the choice, not a comparison between tumors in different locations. No observed patient developed
        new symptoms, and two tumors grew minimally, at 0.08-0.17 cm/year. The abstract gives no imaging
        schedule, does not state whether the observed patients had symptoms when observation began, and
        does not say how their diagnosis was established.
