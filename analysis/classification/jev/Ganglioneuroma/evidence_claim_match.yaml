    evidence_metadata:
      reference: PMID:10755757
      reference_title: 'Malignant peripheral nerve-sheath tumor arising in a previously irradiated neuroblastoma:
        report of 2 cases and a review of the literature.'
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: This case report and literature review, published in 2000, states in its background
        that only ten cases of malignant peripheral nerve sheath tumor (MPNST) arising in a ganglioneuroma
        had been reported, either de novo or at a site of previous irradiation. A count of reported cases
        is not an incidence rate; it supports malignant transformation being rare while showing that it
        does occur. The sentence restates earlier literature rather than the paper's own finding. The
        abstract does not say how many of the ten arose de novo. The paper's own two cases, additional
        to the ten, arose inside a benign ganglioneuroma 12 years after radiotherapy for a ganglioneuroblastoma
        and a neuroblastoma, so some reported transformations occur at previously irradiated sites rather
        than in an untreated primary ganglioneuroma. Ten is the count as of this review, not a current
        total.
