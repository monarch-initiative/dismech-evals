        context:
        - path: /pathophysiology/3
          value:
            name: Tumoral Catecholamine Secretion
            description: 'Secretion of catecholamines by the tumor, which some ganglioneuromas show. In
              a series of primary ganglioneuromas, plasma and/or urinary catecholamines were increased
              in 39%, and the authors concluded that ganglioneuroma may present with increased catecholamine
              secretion; in an adrenal ganglioneuroma, raised urinary catecholamines normalized after
              resection, which the authors took as confirming the tumor as their source. Secretion is
              not universal: the authors of an adrenal series concluded that isolated adrenal ganglioneuromas
              do not produce catecholamines. In a chart review, raised urinary vanillylmandelic and homovanillic
              acid appeared to become more common with larger ganglioneuromas, and the authors advised
              a search for occult neuroblastoma when the values are extremely high.'
            biological_scale: CELLULAR
            biological_processes:
            - preferred_term: catecholamine secretion by the tumor
              term:
                id: GO:0050432
                label: catecholamine secretion
              modifier: INCREASED
            notes: No cell type is bound, because the cited reports do not say which tumor cells secrete
              catecholamines.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Elevated Urinary Vanillylmandelic Acid
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - Metabolism of the secreted catecholamines to vanillylmandelic acid and its excretion in urine
        description: Vanillylmandelic acid is a catecholamine metabolite excreted in urine. In a chart
          review of ganglioneuromas, raised values appeared to become more common with larger tumors,
          which points to the tumor as their source, though the authors report this only as a trend; they
          advise a search for occult neuroblastoma, which can be the source instead, when values are extremely
          high.
      selected_evidence:
        snippet: Even excluding this patient, there was a trend for elevated values in GN patients to
          correlate with tumor size (P = .07 and .14 for VMA and HVA, respectively). The incidence of
          elevated values appears to increase as a function of tumor size, and small tumors are not likely
          to result in positive urinary measurements. We conclude that while elevations of VMA and HVA
          are consistent with a well-documented diagnosis of GN, extreme elevations (> 3 x nl) should
          prompt careful serial evaluation for occult NB.
        supports: SUPPORT
        directness: INDIRECT
