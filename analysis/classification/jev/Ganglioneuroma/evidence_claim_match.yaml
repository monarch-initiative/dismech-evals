  aa9d84eaa76d00e0e30ac5eb9f2ee311bd1b032bfab3f25ae1dfbe84fbdc846b:
    claim:
      about:
        disease:
          name: Ganglioneuroma
          disease_term:
            preferred_term: ganglioneuroma
            term:
              id: MONDO:0005033
              label: ganglioneuroma
        context: []
      assertion_type: Treatment
      assertion:
        name: Watchful Observation
        description: 'Observation of selected asymptomatic tumors. In a single-institution series of 101
          patients, 31 (mean age 32.3 years) were managed by observation, chosen mainly because the tumor
          lay close to major vascular or neural structures (74.2%); none developed new symptoms over a
          mean follow-up of 90.9 months, reported as 90.9 ± 151 months, and two tumors grew minimally
          (0.08-0.17 cm/year). The authors concluded that observation is safe for asymptomatic tumors,
          particularly when adjacent to critical structures; the observed group was selected rather than
          randomized. A UK nationwide series of ganglioneuroma and intermixed ganglioneuroblastoma concluded
          that watchful active observation can be a safe approach, with resection reserved for symptomatic
          patients, although a small proportion of observed patients had their diagnosis revised to malignant
          at surgery, and a Hospital for Sick Children series concluded that, because these tumors grow
          slowly and resection can carry significant morbidity, watch-and-wait approaches should be considered
          for some patients. Both series pool ganglioneuroma with intermixed ganglioneuroblastoma, and
          in both a part of the observed group grew or went to surgery: in the UK series 21 of 58 observed
          patients (36%) required subsequent surgery, with progressive tumor growth given as a reason,
          and in the Hospital for Sick Children series 6 of 21 observed patients had progressive disease
          and 4 later underwent resection. The authors of a series of 51 retroperitoneal ganglioneuromas,
          all of them resected, regard active surveillance as a reasonable option for selected patients
          with small, asymptomatic tumors, particularly those with elevated surgical risk.'
        action_category: MONITORING
        treatment_term:
          preferred_term: watchful active observation
          term:
            id: NCIT:C25598
            label: Observation Activity
        context: Asymptomatic ganglioneuroma (the UK and Hospital for Sick Children evidence pools ganglioneuroma
          with intermixed ganglioneuroblastoma)
        notes: NCIT:C15722 Patient Observation fits the action more closely, but its parents, Surveillance
          (NCIT:C15719) and Healthcare Activity (NCIT:C16205), are not under NCIT:C25218, so the treatment-action
          enum rejects it. NCIT:C25598 Observation Activity reaches NCIT:C25218 through Diagnostic Procedure
          (NCIT:C18020) and is bound here for the observation step of a monitoring strategy (action_category
          MONITORING), as in the Ganglioneuroblastoma entry.
      selected_evidence:
        snippet: Thirty-one patients were managed with observation (mean age 32.3 ± 17.7 years; mean follow-up
          duration 90.9 ± 151 months). Observation was chosen primarily due to proximity to major vascular
          or neural structures (74.2%). No patient in the observation group developed new symptoms, and
          2 tumors exhibited minimal interval growth (0.08-0.17 cm/year).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /treatments/1
