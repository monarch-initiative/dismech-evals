      reference_title: Pathology of peripheral neuroblastic tumors.
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      explanation: 'This 2026 pathology review advises, as the authors'' routine practice, that when percutaneous
        core needle biopsy (PCNB) samples show only GNB-intermixed or ganglioneuroma histology, the report
        should note that the favorable INPC classification was determined on review of limited material.
        The preceding sentence gives the reason: a core needle biopsy can miss the neuroblastoma nodule
        of a nodular ganglioneuroblastoma. It is an expert recommendation about core needle biopsy, without
        case data.'
