        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Weakened TOMM7-TOMM40 Core Complex Interaction
        biological_scale: MOLECULAR
        description: TOMM7 is a small regulatory subunit that contacts the TOMM40 beta-barrel pore and
          modulates TOM complex assembly and stability. Pro29 breaks the alpha-helix of the kinked transmembrane
          segment, and Trp25 sits beside Arg24, which is needed for TOMM40 interaction. The P29L protein
          still localizes to mitochondria but binds TOMM40 and TOMM22 poorly.
        cellular_components:
        - preferred_term: TOM complex
          term:
            id: GO:0005742
            label: mitochondrial outer membrane translocase complex
      selected_evidence:
        snippet: This effect was not due to mislocalization, as GFP-tagged TOMM7wt and TOMM7P29L both
          localized to mitochondria
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36282599
      reference_title: Autosomal recessive progeroid syndrome due to homozygosity for a TOMM7 variant.
      evidence_source: IN_VITRO
      explanation: The defect is in complex binding, not in targeting of TOMM7 itself.
