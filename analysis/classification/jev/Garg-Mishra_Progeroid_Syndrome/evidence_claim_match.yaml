              label: Garg-Mishra progeroid syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Mitochondrial Preprotein Import
        biological_scale: CELLULAR
        description: Altered TOM complex function changes the abundance of a subset of the mitochondrial
          proteome rather than causing a global import block. In patient fibroblasts 91 of 587 detected
          mitochondrial proteins differed, with oxidative phosphorylation subunits increased and phospholipid
          metabolism proteins reduced, leading the authors to propose that wild-type TOMM7 acts as a negative
          regulator of import for some precursors. In endothelium, Tomm7 deficiency increases mitochondrial
          import of Rac1. The direction of the proteomic change differs by cell type (see notes).
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: mitochondrial preprotein import
          modifier: ABNORMAL
          term:
            id: GO:0070585
            label: protein localization to mitochondrion
      selected_evidence:
        snippet: Of the 587 detected mitochondrial proteins, 91 were differentially expressed (P < 0.05),
          indicating that a subset of the mitochondrial proteome is affected by the presence of the TOMM7P29L
          variant
        supports: SUPPORT
