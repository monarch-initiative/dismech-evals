        name: Epstein-Barr virus infection
        exposure_term:
          preferred_term: Epstein-Barr virus exposure
          term:
            id: ECTO:3000001
            label: exposure to virus
        description: Epstein-Barr virus is clonally present in the tumour epithelium of roughly 7-9% of
          gastric adenocarcinomas and defines one of the four TCGA molecular classes. Unlike H. pylori,
          salt and smoking, which act on the preinvasive Correa cascade, EBV is detected within the malignant
          cells themselves and marks a distinct route into gastric cancer, enriched proximally and in
          men. IARC classifies EBV as a Group 1 carcinogen; that classification is not snippet-quotable
          from the sources cited here and is reported as context rather than as an evidenced claim.
        notes: Bound to ECTO:3000001 exposure to virus, the most specific applicable ECTO term - ECTO
          has no Epstein-Barr or gammaherpesvirus exposure class (searched 2026-08-25). Same binding as
          the EBV exposure in Multiple_Sclerosis.
      selected_evidence:
        snippet: EBV prevalence in tumor cells was 7.5% (95% CI, 6.9%-8.1%) and was higher in men compared
          with women (PR, 2.1; 95% CI, 1.9-2.4), in diffuse type compared with intestinal type (PR, 1.3;
          95% CI, 1.1-1.5), and in the proximal region compared with the distal region (PR, 2.5; 95% CI,
          2.0-3.1).
        supports: SUPPORT
