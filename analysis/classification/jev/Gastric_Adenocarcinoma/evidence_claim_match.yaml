      assertion:
        name: EBV-positive
        subtype_frequency: 9% of the TCGA cohort (n=295)
        display_name: Epstein-Barr virus-positive gastric adenocarcinoma (TCGA)
        classification: molecular_tcga
        description: Approximately 9% of gastric adenocarcinomas. Defined by clonal EBV infection of the
          tumour epithelium and characterised by recurrent PIK3CA mutation, extreme DNA hypermethylation,
          and amplification of JAK2, CD274 (PD-L1) and PDCD1LG2 (PD-L2). The PD-L1/PD-L2 amplification
          makes this the molecular class with the clearest a priori rationale for checkpoint blockade.
          Curated in depth in the separate `EBV_Associated_Gastric_Cancer` entry.
      selected_evidence:
        snippet: tumours positive for Epstein-Barr virus, which display recurrent PIK3CA mutations, extreme
          DNA hypermethylation, and amplification of JAK2, CD274 (also known as PD-L1) and PDCD1LG2 (also
          known as PD-L2)
        supports: SUPPORT
