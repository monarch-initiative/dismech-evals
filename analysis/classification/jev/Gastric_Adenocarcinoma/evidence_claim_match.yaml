      assertion:
        name: Tumor Immune Evasion and Checkpoint Engagement
        biological_scale: CELLULAR
        role: therapeutic_vulnerability
        description: 'Tumour and stromal PD-L1 expression - constitutive in EBV-amplified tumours, interferon-induced
          in the neoantigen-rich MSI class - engages PD-1 on tumour-infiltrating CD8-positive T cells
          and restrains their cytotoxic function. Quantified clinically as the PD-L1 combined positive
          score (CPS), this is the directly actionable node: blocking the PD-1/PD-L1 axis with pembrolizumab
          or nivolumab added to chemotherapy improves survival, with benefit concentrated at higher CPS
          and in MSI-high disease.'
        cell_types:
