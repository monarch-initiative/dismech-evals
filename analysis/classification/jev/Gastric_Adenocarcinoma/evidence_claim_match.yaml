            term:
              id: MONDO:0005036
              label: gastric adenocarcinoma
        context: []
      assertion_type: Subtype
      assertion:
        name: Mixed
        display_name: Mixed-type gastric adenocarcinoma (Lauren)
        classification: histological_lauren
        description: Tumours containing both gland-forming intestinal and poorly cohesive diffuse components
          in appreciable proportion. Recognised as a third Lauren category; behaviour generally tracks
          the diffuse component. Included because the Lauren scheme is trichotomous, not binary - collapsing
          mixed tumours into one of the two poles loses the observation that the two programmes can coexist
          in one tumour.
      selected_evidence:
        snippet: the majority of which were histopathologically characterized by the presence of poorly
          differentiated adenocarcinomas together with more differentiated components in the gastric mucosa
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/2
      evidence_path: /has_subtypes/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24816255
      reference_title: Recurrent gain-of-function mutations of RHOA in diffuse-type gastric carcinoma.
      evidence_source: HUMAN_CLINICAL
      explanation: Direct histologic evidence that poorly differentiated (diffuse) and more differentiated
        (intestinal-like) components coexist within the same tumours - the observation the mixed Lauren
        category encodes. Support is PARTIAL because the paper describes the coexistence without using
        the "mixed type" label.
