      assertion_type: Pathophysiology
      assertion:
        name: EBV-Driven Hypermethylation and Checkpoint Ligand Amplification
        biological_scale: MOLECULAR
        role: driver
        description: 'In roughly 9% of gastric adenocarcinomas, clonal Epstein-Barr virus infection of
          the tumour epithelium drives an extreme CpG island methylator phenotype that silences tumour-suppressor
          loci, together with recurrent PIK3CA mutation and amplification of JAK2, CD274 (PD-L1) and PDCD1LG2
          (PD-L2). The PD-L1/PD-L2 amplification is the mechanistically important part: it makes checkpoint
          ligand overexpression a structural genomic feature rather than an inducible response, which
          is the rationale for prioritising checkpoint blockade in this class. Loss of the SWI/SNF chromatin
          remodeller ARID1A (mutated in 55% of EBV-positive tumours) cooperates with the methylator phenotype
          in this epigenetic reprogramming, while TP53 mutation - dominant in the CIN class - is characteristically
          rare here.'
        genes:
        - preferred_term: PIK3CA
          term:
            id: hgnc:8975
            label: PIK3CA
        - preferred_term: CD274
          term:
            id: hgnc:17635
            label: CD274
        - preferred_term: ARID1A
          term:
            id: hgnc:11110
            label: ARID1A
        biological_processes:
        - preferred_term: negative regulation of gene expression, epigenetic
          modifier: INCREASED
          term:
            id: GO:0045814
            label: negative regulation of gene expression, epigenetic
      selected_evidence:
        snippet: tumours positive for Epstein-Barr virus, which display recurrent PIK3CA mutations, extreme
          DNA hypermethylation, and amplification of JAK2, CD274 (also known as PD-L1) and PDCD1LG2 (also
          known as PD-L2)
