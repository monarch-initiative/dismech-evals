        description: Referral for genetic counselling is indicated for young-onset diffuse gastric cancer,
          a family history meeting HDGC criteria, bilateral or familial lobular breast cancer, Lynch-compatible
          MSI, or polyposis. Testing should use a hereditary gastric cancer panel covering CDH1, CTNNA1,
          the mismatch repair genes, APC, STK11, SMAD4, BMPR1A and TP53, including deletion/duplication
          analysis. Identification of a familial variant triggers cascade testing of at-risk relatives,
          which is what converts a diagnosis in one patient into prevention for the family.
