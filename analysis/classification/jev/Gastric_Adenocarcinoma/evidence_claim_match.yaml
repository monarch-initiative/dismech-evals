  f7fe3c6892fc2b9bfc9e4fc8fa773a35af59a9ef3356cd59260c5dd9dd0f1662:
    claim:
      about:
        disease:
          name: Gastric Adenocarcinoma
          disease_term:
            preferred_term: gastric adenocarcinoma
            term:
              id: MONDO:0005036
              label: gastric adenocarcinoma
        context: []
      assertion_type: Treatment
      assertion:
        name: Prophylactic Total Gastrectomy for Germline CDH1 Carriers
        action_category: THERAPEUTIC
        therapeutic_modality: SURGERY
        description: 'The highest-stakes actionable recommendation in this entry. For carriers of a pathogenic
          germline CDH1 variant, risk-reducing total gastrectomy remains the IGCLC recommended option
          for gastric cancer risk management, and is the only intervention that substantially eliminates
          it (rare post-gastrectomy diffuse gastric cancer is reported from residual mucosa at the anastomosis).
          Threshold and timing: surgery is recommended in early adulthood, generally between 20 and 30
          years of age, and is NOT recommended over age 70 unless there are significant mitigating circumstances.
          For carriers who decline or postpone, the IGCLC recommends annual endoscopy by endoscopists
          experienced in HDGC, and eradication of Helicobacter pylori if present. The 2020 IGCLC guidelines
          relaxed the genetic testing criteria (mainly by loosening age limits) and, critically, now express
          increasing confidence that endoscopic surveillance in expert centres can be safely offered to
          carriers who wish to postpone surgery or whose risk is not well defined - so the recommendation
          is no longer uniform. The reason the threshold has moved is quantitative: including less-selected
          families, the cumulative lifetime risk of advanced diffuse gastric cancer is now estimated at
          13-19%, far below older high-risk-family estimates, while roughly a third of carriers decline
          surgery because of its lifelong physical and psychological consequences. Surveillance is imperfect:
          almost every prophylactic gastrectomy specimen already contains small pT1a signet-ring-cell
          foci of unpredictable behaviour, so the goal of endoscopic surveillance must be detecting atypical
          deeper-infiltrating lesions rather than every signet-ring focus. CTNNA1 carriers should not
          be managed by simple extrapolation from CDH1, being moderate-penetrance. Lifelong sequelae of
          total gastrectomy include small frequent meals, weight loss, dumping, reflux, and iron and vitamin
          B12 deficiency.'
        treatment_term:
          preferred_term: Total Gastrectomy
          term:
            id: NCIT:C185240
            label: Total Gastrectomy
      selected_evidence:
        snippet: Prophylactic total gastrectomy remains the recommended option for gastric cancer risk
          management in pathogenic CDH1 variant carriers.
        supports: SUPPORT
