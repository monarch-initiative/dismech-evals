        description: Persistent colonisation of the gastric mucosa by Helicobacter pylori establishes
          a lifelong, non-resolving active gastritis. The organism cannot be cleared by the host response
          it provokes, so the inflammatory stimulus is indefinite - exactly the persistent, non-resolving
          inflammatory driver pattern the tumor-promoting inflammation module abstracts, and which that
          module names H. pylori gastritis preceding gastric cancer as an archetype of. This is the initiating
          step of the Correa cascade and the dominant cause of non-cardia gastric adenocarcinoma.
        biological_processes:
