      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: ANNUAL_INCIDENCE
        prevalence_class: UNKNOWN
        rate_per_100000: 11.5
        notes: GLOBOCAN 2022 places stomach cancer at 4.9% of all incident cancers worldwide (roughly
          970,000 new cases against ~20 million total), i.e. an order of magnitude near 11-12 per 100,000
          person-years crude. `prevalence_class` is left UNKNOWN rather than given an Orphanet band, because
          the Orphanet bands are point-prevalence classes and must not be applied to an annual-incidence
          rate. Adenocarcinoma accounts for approximately 90% of these. Incidence is strongly geographically
          concentrated (East Asia, Eastern Europe, Latin America) and is roughly twice as high in men,
          so the worldwide figure should not be applied locally.
      selected_evidence:
        snippet: followed by cancers of the female breast (11.6%), colorectum (9.6%), prostate (7.3%),
          and stomach (4.9%)
        supports: SUPPORT
