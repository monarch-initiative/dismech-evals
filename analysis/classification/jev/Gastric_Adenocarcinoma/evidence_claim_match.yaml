      assertion_type: Treatment
      assertion:
        name: Helicobacter pylori Screen-and-Treat (Primary Prevention)
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: Population-level detection and eradication of H. pylori, the leading supportable
          gastric cancer prevention strategy in intermediate- and high-incidence regions. Eradication
          is most effective before advanced atrophy and intestinal metaplasia develop - the mechanistic
          reason the intervention window is early in the Correa cascade. It also prevents peptic ulcer
          disease and gastric MALT lymphoma. A recognised trade-off is increased population antibiotic
          use. Note this treats the trigger; it does not treat established cancer.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: the screen and treat strategy for Helicobacter pylori (H. pylori) seems to be the most
