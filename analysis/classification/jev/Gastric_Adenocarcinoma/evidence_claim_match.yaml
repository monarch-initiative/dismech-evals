  34434472d8b9603bd1028f7339f75508a06aec0f877e4f1cef3451334b12a6a7:
    claim:
      about:
        disease:
          name: Gastric Adenocarcinoma
          disease_term:
            preferred_term: gastric adenocarcinoma
            term:
              id: MONDO:0005036
              label: gastric adenocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CagA and VacA Virulence Factor Delivery
        biological_scale: MOLECULAR
        role: mediator
        description: Strains carrying the cag pathogenicity island use a type IV secretion system to translocate
          the CagA oncoprotein into gastric epithelial cells, where it is tyrosine phosphorylated and
          acts as a promiscuous pathological scaffold, simultaneously engaging multiple host signalling
          pathways and deranging proliferation, differentiation and apoptosis. The vacuolating cytotoxin
          VacA contributes independently to epithelial injury. Because transformation, once established,
          no longer requires the oncoprotein, CagA is described as acting by a hit-and-run mechanism -
          a mechanistically important caveat, since it means CagA positivity in an established tumour
          is not required for CagA to have caused it. Note the `protein tyrosine kinase activity` annotation
          on this node refers to the HOST kinases (SRC, ABL) that phosphorylate the translocated CagA
          EPIYA motifs; CagA itself is the substrate, not a kinase.
        molecular_functions:
        - preferred_term: host SRC/ABL kinase activity phosphorylating CagA
          modifier: INCREASED
          term:
            id: GO:0004713
            label: protein tyrosine kinase activity
        cell_types:
        - preferred_term: gastric epithelial cell
          term:
            id: CL:0002178
            label: epithelial cell of stomach
      selected_evidence:
        snippet: CagA is the most important virulence factor in H. pylori, and is a translocated oncoprotein
          that induces morphofunctional modifications in gastric epithelial cells and a chronic inflammatory
          response that increases the risk of developing precancerous lesions.
        supports: SUPPORT
