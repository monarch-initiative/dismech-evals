              label: Autosomal dominant inheritance
          penetrance: INCOMPLETE
          penetrance_percentage: 13-19% cumulative lifetime risk of advanced diffuse gastric cancer
          expressivity: VARIABLE
          description: 'Age-dependent and family-dependent incomplete penetrance. Including less-selected
            families, cumulative lifetime risk of advanced diffuse gastric cancer in CDH1 carriers is
            now estimated at 13-19%, well below older high-risk-family estimates of roughly 42% in men
