        - preferred_term: vascular endothelial growth factor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0038084
            label: vascular endothelial growth factor signaling pathway
      selected_evidence:
        snippet: Conditioned media derived from OmAd (OmAd-CM) promoted the proliferation, migration and
          capacity to induce angiogenesis of GC cells through AKT phosphorylation and VEGFA overexpression,
          whereas silencing CXCL2 in OmAd cancelled OmAd-induced effects.
