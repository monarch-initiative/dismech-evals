          polarity, mitotic spindle orientation and anoikis control. Detached cells accumulate intracytoplasmic
          mucin that displaces the nucleus to the periphery, producing the signet-ring morphology. This
          node conforms to the module''s EMT-activation node because E-cadherin loss is that node''s canonical
          initiating lesion, but the conformance is deliberately scoped to the cadherin-loss / loss-of-adhesion
          arm only: diffuse gastric cancer loses E-cadherin structurally (mutation, promoter hypermethylation,
          LOH) rather than by SNAIL/SLUG/ZEB/TWIST-driven transcriptional repression, and does not execute
          a complete mesenchymal programme. The node therefore annotates only decreased cell-cell adhesion,
          NOT GO:0001837 epithelial to mesenchymal transition, which would overstate the biology.'
