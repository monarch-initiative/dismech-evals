      assertion_type: Treatment
      assertion:
        name: Breast Surveillance for Female CDH1 Carriers
        action_category: SCREENING
        therapeutic_modality: DEVICE
        description: Lobular breast cancer is the second tumour of hereditary diffuse gastric cancer,
          so gastric risk management alone is insufficient for female germline CDH1 carriers. The IGCLC
          offers annual breast surveillance as one of the two acceptable strategies for managing that
          risk (the other being risk-reducing mastectomy, curated separately below). Recorded as a distinct
          clinical action because it is co-equal in stakes with the gastric recommendation and is easily
          overlooked once prophylactic gastrectomy has been addressed.
        treatment_term:
          preferred_term: Cancer Screening
          term:
            id: NCIT:C15406
            label: Cancer Screening
      selected_evidence:
        snippet: LBC risk should be managed with either annual surveillance or bilateral risk-reducing
          mastectomy (BRRM).
