          acts as a promiscuous pathological scaffold, simultaneously engaging multiple host signalling
          pathways and deranging proliferation, differentiation and apoptosis. The vacuolating cytotoxin
          VacA contributes independently to epithelial injury. Because transformation, once established,
          no longer requires the oncoprotein, CagA is described as acting by a hit-and-run mechanism -
          a mechanistically important caveat, since it means CagA positivity in an established tumour
          is not required for CagA to have caused it. Note the `protein tyrosine kinase activity` annotation
          on this node refers to the HOST kinases (SRC, ABL) that phosphorylate the translocated CagA
          EPIYA motifs; CagA itself is the substrate, not a kinase.
