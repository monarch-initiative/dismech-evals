      assertion_type: DifferentialDiagnosis
      assertion:
        name: Benign gastric ulcer
        description: Peptic ulceration, most often H. pylori- or NSAID-related. Endoscopically an ulcerated
          gastric adenocarcinoma can be indistinguishable from a benign ulcer, which is why guidelines
          mandate biopsy of every gastric ulcer and endoscopic confirmation of healing. Curated separately
          as `Gastric_Ulcer`.
        disease_term:
          preferred_term: gastric ulcer
          term:
            id: MONDO:0001126
            label: gastric ulcer
        distinguishing_features:
        - Histology shows inflammation, granulation tissue and regenerative change without invasive malignant
          epithelium.
        - Benign ulcers heal completely on acid suppression and H. pylori eradication; persistent or non-healing
          ulceration mandates re-biopsy for malignancy.
        - Regular ulcer margins with radiating folds, versus the heaped, irregular, indurated margins
          of a malignant ulcer.
      selected_evidence:
        snippet: particularly in the setting of ulcerated lesions
        supports: SUPPORT
