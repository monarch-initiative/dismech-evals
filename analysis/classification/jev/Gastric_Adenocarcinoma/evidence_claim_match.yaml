          the first hit is a germline truncating variant present in every gastric epithelial cell and
          the second hit is most often CDH1 promoter hypermethylation (or loss of heterozygosity, or somatic
          mutation); in sporadic diffuse cancer both hits are somatic. Germline CTNNA1 truncating variants
          produce the mechanistically equivalent lesion one step down the junction, by nonsense-mediated
          decay of the alpha-E-catenin transcript, but with lower penetrance.
