      assertion_type: DifferentialDiagnosis
      assertion:
        name: Gastroesophageal junction adenocarcinoma
        description: 'Adenocarcinoma centred at the gastroesophageal junction. Deliberately modelled as
          a differential rather than a subtype: junctional tumours share systemic-therapy evidence with
          gastric adenocarcinoma (they were co-enrolled in ToGA, FLOT4, SPOTLIGHT and FIGHT) but differ
          in aetiology, being driven by obesity and reflux rather than H. pylori, and overlapping the
          Barrett-derived esophageal adenocarcinoma biology curated in `Esophageal_Adenocarcinoma`.'
        disease_term:
          preferred_term: gastroesophageal junction adenocarcinoma
          term:
            id: MONDO:0003219
            label: gastroesophageal junction adenocarcinoma
        distinguishing_features:
        - Anatomic epicentre at the junction (Siewert classification) rather than in the gastric body
          or antrum.
        - Aetiologically linked to gastroesophageal reflux, Barrett metaplasia and obesity, not to H.
          pylori-driven atrophic gastritis.
        - Higher HER2 positivity rate than distal gastric tumours, and different locoregional management
          (chemoradiation has a defined role at the junction).
      selected_evidence:
        snippet: To select the most appropriate therapy for advanced gastric cancer, including adenocarcinoma
          of the esophago-gastric junction
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/3
      evidence_path: /differential_diagnoses/3/evidence/0
      context_paths:
