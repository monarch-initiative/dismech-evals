              id: MONDO:0001126
              label: gastric ulcer
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CST1B Pathogenic Community Dominance
        description: 'Depletion of CST1A allows pathogenic CST1B communities to dominate the gastric microbiota.
          CST1B is enriched in gastroduodenal disease and favors nucleotide and peptidoglycan biosynthesis
          pathways. The CST1A-CST1B imbalance is preserved across age cohorts and disease stages. Note
          the provenance of that claim: the core structure was defined in a discovery cohort of 255 pediatric
          samples, and its persistence across disease stages rests on cross-cohort validation over eight
          further datasets (n = 1,299), not on the primary cohort.'
        biological_scale: TISSUE
      selected_evidence:
        snippet: CST1A is enriched in non-ulcer controls, whereas CST1B is associated with gastroduodenal
          disease
        supports: SUPPORT
