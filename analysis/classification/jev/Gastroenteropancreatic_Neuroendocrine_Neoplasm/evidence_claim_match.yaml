      assertion_type: Pathophysiology
      assertion:
        name: DAXX/ATRX Chromatin Remodeling Deficiency
        description: Mutually exclusive inactivating mutations in DAXX (~25%) or ATRX (~18%) occur in
          roughly 43% of pancreatic NETs. DAXX and ATRX form a complex depositing histone variant H3.3
          at telomeres and pericentric heterochromatin; loss drives alternative lengthening of telomeres
          (ALT) and chromosomal instability.
        cell_types:
        - preferred_term: pancreatic endocrine cell
          term:
            id: CL:0008024
            label: pancreatic endocrine cell
        biological_processes:
        - preferred_term: telomere maintenance
          modifier: DYSREGULATED
          term:
            id: GO:0000723
            label: telomere maintenance
        - preferred_term: chromatin organization
          modifier: DYSREGULATED
          term:
            id: GO:0006325
            label: chromatin organization
      selected_evidence:
        snippet: 43% had mutations in genes encoding either of the two subunits of a transcription/chromatin
          remodeling complex consisting of DAXX (death-domain-associated protein) and ATRX
        supports: SUPPORT
