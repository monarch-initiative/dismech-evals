        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: 44% of the tumors had somatic inactivating mutations in MEN1, which encodes menin, a
          component of a histone methyltransferase complex
        supports: SUPPORT
