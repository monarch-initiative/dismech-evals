        name: MEN1 Tumor Suppressor Inactivation
        description: Loss-of-function mutations in MEN1 (encoding menin) occur in approximately 44% of
          sporadic pancreatic NETs and define the hereditary MEN1 syndrome. Menin is a chromatin-modifying
          scaffold for the MLL/SET1-like histone methyltransferase complex regulating H3K4 methylation.
          Loss disrupts epigenetic control of cell cycle genes, driving uncontrolled proliferation of
          islet cells.
        cell_types:
        - preferred_term: pancreatic endocrine cell
          term:
            id: CL:0008024
            label: pancreatic endocrine cell
        biological_processes:
        - preferred_term: chromatin organization
          modifier: DYSREGULATED
