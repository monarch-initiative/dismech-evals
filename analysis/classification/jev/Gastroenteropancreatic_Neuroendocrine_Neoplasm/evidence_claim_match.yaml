        description: Poorly differentiated neuroendocrine carcinomas (small-cell and large-cell) are genetically
          distinct from well-differentiated NETs, characterized by frequent inactivation of the TP53 and
          RB1 tumor suppressors. This drives loss of cell-cycle control, genomic instability, rapid proliferation,
          and a clinical course resembling small-cell lung carcinoma.
        biological_processes:
        - preferred_term: cell cycle checkpoint dysregulation
          modifier: DYSREGULATED
          term:
            id: GO:0000075
            label: cell cycle checkpoint signaling
        - preferred_term: cell population proliferation
