        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: We also found mutations in genes in the mTOR (mammalian target of rapamycin) pathway
          in 14% of the tumors, a finding that could potentially be used to stratify patients for treatment
          with mTOR inhibitors.
        supports: SUPPORT
