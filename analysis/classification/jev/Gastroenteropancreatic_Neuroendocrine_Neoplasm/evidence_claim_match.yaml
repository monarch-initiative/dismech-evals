      assertion_type: Pathophysiology
      assertion:
        name: Neuroendocrine Cell Origin and Differentiation
        description: GEP-NENs arise from the diffuse neuroendocrine cell compartment of the gastrointestinal
          tract and pancreatic islets. These cells specialize in producing hormones and neuropeptides
          and share a neuroendocrine phenotype expressing chromogranin A and synaptophysin. Tumor cells
          retain features of their cell of origin, including dense-core secretory granules and regulated
          hormone secretion.
        cell_types:
        - preferred_term: neuroendocrine cell
          term:
            id: CL:0000165
            label: neuroendocrine cell
        - preferred_term: enteroendocrine cell
          term:
            id: CL:0000164
            label: enteroendocrine cell
        biological_processes:
        - preferred_term: peptide hormone secretion (regulated neuroendocrine release)
          modifier: DYSREGULATED
          term:
            id: GO:0030072
            label: peptide hormone secretion
      selected_evidence:
        snippet: In the SEER 18 registry grouping (2000-2012), the highest incidence rates were 1.49 per
          100 000 in the lung, 3.56 per 100 000 in gastroenteropancreatic sites
        supports: SUPPORT
