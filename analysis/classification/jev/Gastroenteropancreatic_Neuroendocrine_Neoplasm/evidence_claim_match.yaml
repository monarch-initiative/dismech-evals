      assertion:
        name: Somatostatin Receptor Overexpression
        description: Most well-differentiated GEP-NETs strongly overexpress somatostatin receptors (predominantly
          SSTR2). Somatostatin receptor signaling inhibits hormone secretion and cell proliferation; pharmacologic
          engagement with somatostatin analogs controls hormonal syndromes and exerts an antiproliferative
          effect, while receptor expression enables SSTR-targeted imaging and peptide receptor radionuclide
          therapy.
        cell_types:
        - preferred_term: neuroendocrine cell
          term:
            id: CL:0000165
            label: neuroendocrine cell
        biological_processes:
        - preferred_term: somatostatin signaling pathway
          modifier: INCREASED
          term:
            id: GO:0038170
            label: somatostatin signaling pathway
      selected_evidence:
        snippet: This randomized, controlled trial evaluated the efficacy and safety of lutetium-177 (177Lu)-Dotatate
          in patients with advanced, progressive, somatostatin-receptor-positive midgut neuroendocrine
          tumors.
        supports: SUPPORT
    origin:
