        description: 'Where an H2-receptor antagonist acts in this disease: it occupies the histamine
          H2 receptor on the gastric parietal cell, removing the histamine-driven arm of acid secretion.
          The node is the drug''s point of attack rather than a step in reflux pathogenesis, which is
          why it carries no downstream edge -- the relation to the mechanism below it is inhibitory, and
          a downstream edge would assert that antagonist occupancy causes the injury the drug is given
          to prevent. Reflux disease is a target for it because, as the cited review puts it, the disease
          combines oesophageal motor dysfunction with maintained gastric acid secretion: the motor defect
          is not addressed by acid suppression, and the acid is.'
