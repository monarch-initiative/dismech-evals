      assertion_type: Pathophysiology
      assertion:
        name: Lower Esophageal Sphincter Dysfunction
        description: 'Transient relaxations or chronic hypotension of the LES allow retrograde flow of
          gastric contents into the esophagus. Hiatal hernia exacerbates sphincter incompetence.

          '
        locations:
        - preferred_term: Lower Esophageal Sphincter
          term:
            id: UBERON:0004550
            label: gastroesophageal sphincter
        biological_processes:
        - preferred_term: Smooth Muscle Contraction
          term:
            id: GO:0006939
            label: smooth muscle contraction
      selected_evidence:
        snippet: GERD starts in the stomach, where the refluxate material is produced. Following the trajectory
          of reflux, the failure of the antireflux barrier, primarily the lower oesophageal sphincter
          and the crural diaphragm, enables the refluxate to reach the oesophageal lumen, triggering oesophageal
          or extra-oesophageal symptoms.
        supports: SUPPORT
    origin:
