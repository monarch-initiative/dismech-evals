      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38177402
      reference_title: 'Pathophysiology of gastro-oesophageal reflux disease: implications for diagnosis
        and management.'
      explanation: This review describes the failure of the antireflux barrier, particularly the lower
        esophageal sphincter, as a core mechanism allowing refluxate to enter the esophagus and cause
        symptoms.
