      assertion_type: Treatment
      assertion:
        name: Na+,K+-ATPase Beta1 Gene Therapy
        description: 'Electroporation-mediated gene delivery of Na+,K+-ATPase β1 plasmid to the esophageal
          mucosa to restore tight junction protein expression and barrier function. This approach addresses
          the underlying barrier dysfunction by upregulating claudins, ZO-1, and occludin to reduce dilated
          intercellular spaces and prevent further epithelial damage. This is a preclinical approach only:
          the published evidence is a rabbit cardiomyectomy GERD model and transfected EPC1 esophageal
          epithelial cells. There are no human data and no registered clinical trial, so unlike the other
          treatments listed here it is not clinically available.

          '
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        notes: 'Preclinical. Evidence is limited to a rabbit GERD model and cultured esophageal epithelial
          cells (PMID:42562993); no human studies or trial registrations exist as of this curation.

          '
      selected_evidence:
        snippet: DIS developed by 12 weeks in a rabbit GERD model and was reduced by 70% when the Na+,K+-ATPase
          β1 subunit was delivered.
        supports: SUPPORT
