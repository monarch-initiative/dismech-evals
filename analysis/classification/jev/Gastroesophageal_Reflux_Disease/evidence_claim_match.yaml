        description: 'Tight junction proteins including claudins (1, 3, 4, 18), ZO-1, and occludin are
          decreased in GERD patient biopsies, as is the Na+,K+-ATPase β1 subunit that supports their assembly.
          Loss of these apical junctional complex proteins is what produces the increased paracellular
          permeability of the esophageal squamous epithelium.

          '
        locations:
        - preferred_term: Esophageal Epithelium
          term:
            id: UBERON:0001976
            label: epithelium of esophagus
        cell_types:
