      assertion_type: Subtype
      assertion:
        name: Small Intestine
        display_name: Small Intestine Lymphoma
        description: 'Lymphoma of the small bowel, the second commonest gastrointestinal site. It carries
          the two distinctive non-gastric antigen-driven entities: enteropathy-associated T-cell lymphoma
          arising on a background of coeliac disease, and immunoproliferative small intestinal disease
          (alpha heavy chain disease). Small-bowel disease is disproportionately responsible for obstruction
          and perforation because the lumen is narrow and the wall thin.'
        subtype_term:
          preferred_term: small intestine lymphoma
          term:
            id: MONDO:0001852
            label: small intestine lymphoma
      selected_evidence:
        snippet: the most frequent sites in order of its occurrence are the stomach followed by small
          intestine and ileocecal region
        supports: SUPPORT
