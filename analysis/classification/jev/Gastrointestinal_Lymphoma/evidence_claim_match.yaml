      assertion_type: Diagnosis
      assertion:
        name: Staging and extent-of-disease workup
        description: Assessment of disease extent once lymphoma is confirmed. Stage is load-bearing for
          management in this disease — antigen-removal therapy is offered for early-stage gastric disease
          and systemic therapy for advanced disease — and cross-sectional and functional imaging with
          histologic identification of lesions is what establishes it. The workup described for the small-bowel
          T-cell arm comprises magnetic resonance enteroclysis, positron emission tomography, and histologic
          identification of lesions.
        diagnosis_term:
          preferred_term: positron emission tomography as part of the staging workup
          term:
            id: NCIT:C17007
            label: Positron Emission Tomography
        results: Anatomic extent of disease, used to assign stage and select between antigen-directed
          and systemic therapy.
        notes: 'The NCIT term binds the positron emission tomography component only; the cached source
          names magnetic resonance enteroclysis in the same workup, and NCIT has no enteroclysis term
          (searched via sqlite:obo:ncit). No formal staging system is asserted here: a stages: section
          using the Lugano classification would be the right home for that and is deliberately left to
          separate work rather than invented from these sources.'
      selected_evidence:
        snippet: Multivariate analysis showed that clinical stage and sources of cells were the significant
          independent prognostic factors.
        supports: SUPPORT
