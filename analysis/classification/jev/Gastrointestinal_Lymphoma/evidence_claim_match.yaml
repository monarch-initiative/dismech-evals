  55cb2c0662eea20844ffb8a0bb4ae3f55a4b4b4eb02b6fc7d25adeebde8981df:
    claim:
      about:
        disease:
          name: Gastrointestinal Lymphoma
          disease_term:
            preferred_term: gastrointestinal lymphoma
            term:
              id: MONDO:0004699
              label: gastrointestinal lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Transformation to Antigen-Independent Lymphoma
        biological_scale: MOLECULAR
        description: 'Acquisition of transforming genetic lesions during prolonged antigen-driven proliferation
          uncouples growth from the initiating stimulus. In the gastric MALT arm the paradigmatic lesions
          are translocations that constitutively activate NF-kB, above all t(11;18)(q21;q21) generating
          BIRC3::MALT1; in the coeliac arm they are JAK/STAT pathway mutations. The clinical corollary
          is direct and is why this node matters for management: once the tumour is antigen-independent,
          removing the antigen no longer treats it. The translocation biology itself is curated in MALT_Lymphoma
          and is referenced rather than duplicated here.'
        biological_processes:
        - preferred_term: canonical NF-kappaB signal transduction
          modifier: INCREASED
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
      selected_evidence:
        snippet: in a subset of MALT lymphomas, chromosomal translocations are acquired that render the
          lymphoma antigen-independent. The recurrent translocation t(11;18)(q21;q21) is associated with
          failure to respond to antibiotic therapy and increased rate of dissemination.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21568677
      reference_title: Protease activity of the API2-MALT1 fusion oncoprotein in MALT lymphoma development
        and treatment.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes both the acquired lesion and its clinical consequence, loss of response
        to antigen-directed therapy.
