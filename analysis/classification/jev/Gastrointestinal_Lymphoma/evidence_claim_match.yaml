      assertion_type: Subtype
      assertion:
        name: Gastric
        display_name: Gastric Lymphoma
        description: Lymphoma of the stomach, the commonest site of gastrointestinal lymphoma. Histologically
          dominated by diffuse large B-cell lymphoma and by extranodal marginal zone (MALT) lymphoma;
          the latter is the arm most tightly linked to chronic Helicobacter pylori infection and the one
          in which antibiotic eradication alone can induce remission. Gastric mantle cell lymphoma (MONDO:0006225)
          is a rarer site+histology combination not modelled as a separate subtype here.
        subtype_term:
          preferred_term: gastric lymphoma
          term:
            id: MONDO:0001059
            label: gastric lymphoma
      selected_evidence:
        snippet: The stomach was the most common site of gastrointestinal (GI) organ involvement by lymphoma
          (38.9%), followed by the small intestine (23.4%)
        supports: SUPPORT
