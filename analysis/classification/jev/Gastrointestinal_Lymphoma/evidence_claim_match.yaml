        association: Germline HLA susceptibility haplotype for coeliac disease and its progression to
          EATL
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        subtype: Small Intestine
        notes: 'The coeliac-disease HLA class II risk haplotype. This is a germline susceptibility/risk
          association, NOT a somatic driver: the haplotype is a common population variant that sets the
          risk of coeliac disease and of its malignant evolution, and is neither necessary nor sufficient
          for lymphoma. The gene_term slot is single-valued, so it is bound to HLA-DQB1; the HLA-DQ2.5
          heterodimer is encoded jointly by HLA-DQA1 (hgnc:4942) and HLA-DQB1, and neither locus alone
          names the haplotype. The reported 53.3% is the proportion of EATL patients who are HLA-DQ2.5
          homozygous — a frequency among cases, not a relative risk, an attributable fraction, or a per-gene
          case fraction — so it is not recorded in frequency or case_fractions.'
      selected_evidence:
        snippet: Furthermore, there is a strong correlation between HLA-DQ2.5 homozygosity and the development
          of EATL
        supports: SUPPORT
