              label: gastrointestinal lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mucosal and Transmural Lymphomatous Infiltration
        biological_scale: TISSUE
        description: 'The shared anatomic final common path. Lymphoma infiltrates the mucosa and then
          the full thickness of the gut wall, ulcerating the epithelium, narrowing or (because lymphoma
          tends to infiltrate without the desmoplastic stiffening of carcinoma) aneurysmally dilating
          the lumen, and thinning the wall. This single node accounts for the presenting syndrome shared
          across every site and histology — abdominal pain, bleeding from ulcerated mucosa, obstruction,
          and perforation — and for the fact that the presentation is clinically indistinguishable from
          other gastrointestinal disease. The diagnostic consequence of that non-specificity is modelled
          in the diagnosis: section rather than asserted here.'
        locations:
        - preferred_term: stomach
          term:
            id: UBERON:0000945
            label: stomach
        - preferred_term: intestine
          term:
            id: UBERON:0000160
            label: intestine
      selected_evidence:
        snippet: Gastrointestinal lymphomas are usually not clinically specific and indistinguishable
          from other benign and malignant conditions.
        supports: SUPPORT
