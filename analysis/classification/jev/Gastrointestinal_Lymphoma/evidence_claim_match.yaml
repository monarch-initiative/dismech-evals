        name: Helicobacter pylori Eradication
        description: Antibiotic eradication of H. pylori is first-line therapy for early-stage H. pylori-positive
          gastric MALT lymphoma and induces complete remission in about three quarters of such patients.
          It is the clearest demonstration in oncology that removing a driving antigen can cure a lymphoma,
          and it works only while the tumour remains antigen-dependent — the t(11;18)-positive, antigen-independent
          tumours modelled by the transformation node do not respond.
        context: Gastric subtype; early-stage, H. pylori-positive disease.
        treatment_term:
          preferred_term: antibiotic therapy
          term:
            id: NCIT:C15620
            label: Antibiotic Therapy
      selected_evidence:
        snippet: 'The pooled CR of H. pylori-positive early-stage GML after bacterial eradication was
          75.18% (95%CI: 70.45%-79.91%).'
