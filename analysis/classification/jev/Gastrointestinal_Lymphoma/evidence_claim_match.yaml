      assertion_type: Discussion
      assertion:
        discussion_id: gi_lymphoma_ipsid_campylobacter_causality
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Chronic Mucosal Antigenic Stimulation
        prompt: Is Campylobacter jejuni a causal driver of immunoproliferative small intestinal disease,
          or an associated coloniser of an already-abnormal small bowel?
        rationale: The association is established and IPSID can regress on antibiotics, which parallels
          the H. pylori/gastric MALT paradigm and would make it a second antigen-driven, antibiotic-reversible
          gastrointestinal lymphoma. But the cited review states explicitly that the organism's pathogenetic
          role is contested, and IPSID occurs in settings of heavy polymicrobial exposure where response
          to broad-spectrum antibiotics does not identify a single organism. The distinction matters for
          this entry because it determines whether the exposure link is TRIGGERS or PREDISPOSES; it is
          currently curated as PREDISPOSES with PARTIAL evidence.
        proposed_experiments:
        - experiment_id: gi_lymphoma_ipsid_targeted_antibiotic_cohort
          experiment_design: HUMAN_OBSERVATIONAL
          name: Organism-directed versus broad-spectrum antibiotic therapy in IPSID
          description: A prospective cohort in an IPSID-endemic region testing whether Campylobacter jejuni-directed
            therapy outperforms broad-spectrum antibiotics for histological remission, with molecular
            detection of the organism in small-bowel biopsies before and after treatment.
        posed_by: claude-code
        posed_date: '2026-08-18T00:00:00Z'
      selected_evidence:
        snippet: A link between Campylobacter jejuni infection and IPSID has been established, but there
          is controversy as to the role played by this organism in disease pathogenesis.
        supports: SUPPORT
