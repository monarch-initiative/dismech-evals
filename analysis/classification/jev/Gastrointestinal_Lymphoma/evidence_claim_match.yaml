            conforms_to: tumor_promoting_inflammation#Chronic Inflammatory Stimulus
            biological_scale: TISSUE
            description: 'A persistent, site-restricted antigenic stimulus drives chronic inflammation
              in gastrointestinal mucosa. The stimuli are organ-specific rather than systemic: Helicobacter
              pylori gastritis in the stomach, dietary gluten in coeliac disease in the small bowel, and
              chronic small-bowel infection in immunoproliferative small intestinal disease. The site-specificity
              is the defining feature and is directly evidenced: prior H. pylori infection raises the
              risk of gastric non-Hodgkin lymphoma roughly six-fold while conferring no measurable risk
              of non-gastric non-Hodgkin lymphoma. This is the disorder-specific substitution for the
              module''s generic chronic inflammatory trigger.'
            locations:
