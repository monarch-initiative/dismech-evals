  28a7c14b867fa6ef9fe67cee12057200aa76bf530d482227ac8dd93e7d1898fa:
    claim:
      about:
        disease:
          name: Gastrointestinal Lymphoma
          disease_term:
            preferred_term: gastrointestinal lymphoma
            term:
              id: MONDO:0004699
              label: gastrointestinal lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chronic Mucosal Antigenic Stimulation
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: intestinal intraepithelial lymphocyte
          term:
            id: CL:0020035
            label: intestinal intraepithelial lymphocyte
        conforms_to: tumor_promoting_inflammation#Chronic Inflammatory Stimulus
        biological_scale: TISSUE
        description: 'A persistent, site-restricted antigenic stimulus drives chronic inflammation in
          gastrointestinal mucosa. The stimuli are organ-specific rather than systemic: Helicobacter pylori
          gastritis in the stomach, dietary gluten in coeliac disease in the small bowel, and chronic
          small-bowel infection in immunoproliferative small intestinal disease. The site-specificity
          is the defining feature and is directly evidenced: prior H. pylori infection raises the risk
          of gastric non-Hodgkin lymphoma roughly six-fold while conferring no measurable risk of non-gastric
          non-Hodgkin lymphoma. This is the disorder-specific substitution for the module''s generic chronic
          inflammatory trigger.'
        locations:
        - preferred_term: stomach
          term:
            id: UBERON:0000945
            label: stomach
        - preferred_term: intestine
          term:
            id: UBERON:0000160
            label: intestine
        biological_processes:
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
      selected_evidence:
        snippet: Patients with gastric lymphoma were significantly more likely than matched controls to
          have evidence of previous H. pylori infection (matched odds ratio, 6.3; 95 percent confidence
          interval, 2.0 to 19.9).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
