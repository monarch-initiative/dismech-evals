        context: []
      assertion_type: Diagnosis
      assertion:
        name: Helicobacter pylori testing
        description: 'Determination of H. pylori status in gastric lymphoma. This is not a diagnostic
          test for the lymphoma itself but the test that GATES first-line therapy: eradication is recommended
          as the initial treatment of early-stage gastric MALT lymphoma, and the entire evidence base
          for that recommendation is drawn from H. pylori-positive patients, so a patient cannot be assigned
          to antigen-removal therapy without it.'
        diagnosis_term:
          preferred_term: Helicobacter pylori testing
          term:
            id: NCIT:C189536
            label: Helicobacter pylori Measurement
        results: H. pylori positive or negative status in a patient with gastric lymphoma.
        notes: Curated as the gate on treatment 1 (Helicobacter pylori Eradication) rather than as a confirmatory
          test for lymphoma. The cached sources establish that the eradication evidence base is restricted
          to H. pylori-positive early-stage disease; they do not compare the individual assays (urea breath
          test, stool antigen, histology, serology), so no specific method is asserted and the NCIT term
          is left at the general measurement level.
      selected_evidence:
        snippet: Prospective and retrospective observational studies evaluating the CR of early-stage
          GML following bacterial eradication in H. pylori-positive patients.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
