      reference: PMID:8145781
      reference_title: Helicobacter pylori infection and gastric lymphoma.
      evidence_source: HUMAN_CLINICAL
      explanation: Nested case-control study within 230,593 prospectively followed participants quantifies
        chronic H. pylori infection as an antecedent risk factor for gastric lymphoma.
