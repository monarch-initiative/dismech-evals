              label: gastrointestinal stromal tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PDGFRA Receptor Activation
        description: PDGFRA mutations, particularly D842V in the activation loop, result in constitutive
          kinase activity. These mutations activate similar downstream pathways as KIT but show different
          drug sensitivity profiles.
        biological_processes:
        - preferred_term: platelet-derived growth factor receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0048008
            label: platelet-derived growth factor receptor signaling pathway
      selected_evidence:
        snippet: Tumors expressing KIT or PDGFRA oncoproteins were indistinguishable with respect to activation
          of downstream signaling intermediates and cytogenetic changes associated with tumor progression.
          Thus, KIT and PDGFRA mutations appear to be alternative and mutually exclusive oncogenic mechanisms
          in GISTs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12522257
      reference_title: PDGFRA activating mutations in gastrointestinal stromal tumors.
      evidence_source: HUMAN_CLINICAL
      explanation: Heinrich et al. showed that KIT-wild-type GISTs harbor activating PDGFRA mutations
        that drive the same downstream signaling as KIT, establishing PDGFRA activation as an alternative
        oncogenic driver in GIST.
