              label: gastrointestinal stromal tumor
        context: []
      assertion_type: Treatment
      assertion:
        name: Imatinib
        description: First-line treatment for unresectable or metastatic GIST. Targets KIT and PDGFRA
          kinases. Standard dose is 400 mg daily, but exon 9 KIT mutations require 800 mg. Dramatically
          transformed outcomes for advanced GIST patients.
        treatment_term:
          preferred_term: targeted therapy
          term:
            id: NCIT:C93352
            label: Targeted Therapy
          therapeutic_agent:
          - preferred_term: imatinib
            term:
              id: CHEBI:45783
              label: imatinib
      selected_evidence:
        snippet: Imatinib induced a sustained objective response in more than half of patients with an
          advanced unresectable or metastatic gastrointestinal stromal tumor. Inhibition of the KIT signal-transduction
          pathway is a promising treatment for advanced gastrointestinal stromal tumors, which resist
          conventional chemotherapy.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12181401
      reference_title: Efficacy and safety of imatinib mesylate in advanced gastrointestinal stromal tumors.
      explanation: The Demetri et al. NEJM study demonstrated that imatinib achieves objective responses
        in 53.7% of advanced GIST patients by inhibiting the KIT signaling pathway.
