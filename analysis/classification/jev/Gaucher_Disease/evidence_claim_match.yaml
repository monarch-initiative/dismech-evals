  b0e48c1d6c6077976abb1c93e7334c0fda3b5402b356213b3d5969b076ce91a7:
    claim:
      about:
        disease:
          name: Gaucher Disease
          disease_term:
            preferred_term: Gaucher disease
            term:
              id: MONDO:0018150
              label: Gaucher disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gd_brain_substrate_in_gba1_parkinson
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does glucosylceramide or glucosylsphingosine actually accumulate in the brains of people
          with GBA1-associated Parkinson disease, or is that branch driven by misfolded GCase protein
          independently of substrate storage?
        attaches_to:
        - pathophysiology#GBA1-Associated Alpha-Synuclein Proteostasis
        - pathophysiology#Neuronal Glycosphingolipid Accumulation
        rationale: 'This entry models the Parkinson disease branch as flowing from reduced GCase activity
          and mutant GCase handling through impaired alpha-synuclein turnover, in parallel with the substrate
          accumulation that drives the other branches. Reviewers of the GBA1-Parkinson literature report
          that substrate accumulation has not been convincingly demonstrated in GBA1-Parkinson brains,
          and propose instead that misfolded GCase induces endoplasmic reticulum stress and an unfolded
          protein response that impairs the autophagy-lysosomal pathway. If that is right, the branch
          is a gain-of-function proteotoxicity operating alongside rather than downstream of the storage
          chain, and it predicts different therapeutic priorities: chaperone stabilization over substrate
          reduction. The absence is scoped to GBA1-Parkinson brains and does not transfer to neuronopathic
          types 2 and 3, where neuronal glucosylsphingosine accumulation is documented. This is the ER-stress
          question left unresolved in the canonical hypothesis notes. The stronger reading, that this
          absence proves gain-of-function predominance, is rejected in the codex assessment of the OpenScientist
          report: bulk-brain absence does not prove absence in the relevant cells, and heterozygous GBA1-Parkinson
          disease cannot be conflated with biallelic neuronopathic Gaucher disease. What remains is the
          open question recorded here.'
        proposed_experiments:
        - experiment_id: exp_gd_gba1pd_brain_lipidomics
          experiment_design: DESCRIPTIVE_PROFILING
          name: Region-resolved brain lipidomics in GBA1-associated Parkinson disease
          description: Mass spectrometry imaging of glucosylceramide and glucosylsphingosine in post-mortem
            GBA1-Parkinson brain, stratified by variant severity, region (substantia nigra, cortex, cerebellum)
            and disease stage, with paired endoplasmic reticulum stress markers and cell-type-resolved
            measurement separating neurons from glia.
          would_support:
          - pathophysiology#Neuronal Glycosphingolipid Accumulation
          supporting_outcome:
          - Glucosylceramide and glucosylsphingosine are elevated in affected regions and track alpha-synuclein
            pathology, placing the Parkinson branch downstream of substrate accumulation as the storage
            chain predicts.
          refuting_outcome:
          - Lipids are normal or minimally raised while endoplasmic reticulum stress markers are elevated,
            which would weaken the substrate-driven reading of this branch without by itself establishing
            that protein misfolding is the predominant mechanism.
          notes: No entity is listed in would_refute. The refuting outcome bears on whether neuronal glycosphingolipid
            accumulation extends to the Parkinson branch, which is the node already named in would_support;
            it does not refute the alpha-synuclein proteostasis node, whose description covers mutant
            GCase handling as well as reduced activity and is therefore compatible with an endoplasmic
            reticulum stress result.
        posed_date: '2026-09-17T00:00:00Z'
      selected_evidence:
        snippet: Preclinical evidence also shows that products of GCase activity can promote accumulation
          of α-synuclein, however there is no convincing evidence of substrate accumulation in GBA1-PD
          brains.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37080432
      reference_title: 'Targeting the GBA1 pathway to slow Parkinson disease: Insights into clinical aspects,
        pathogenic mechanisms and new therapeutic avenues.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the absence directly for GBA1-Parkinson brains, and sets it against the preclinical
        evidence that would predict the opposite.
