        description: Biallelic GBA1 pathogenic variants reduce lysosomal glucocerebrosidase activity and
          impair glucosylceramide and glucosylsphingosine degradation. Macrophage lipid storage, inflammatory
          amplification, and altered skeletal remodeling contribute to visceral, hematologic, and skeletal
          disease. Neuronopathic forms additionally involve neuronal and glial lipid homeostasis and injury;
          their CNS biology is not explained by macrophage infiltration alone. ERT and substrate reduction
          strongly support the systemic storage pathway, while individual toxic intermediates and CNS
          mechanisms require separate evidence.
        notes: The OpenScientist report is assessed twice beside the report, in assessments/openscientist-assessment-by-codex.yaml
          (overall PARTIALLY_SUPPORTED) and assessments/openscientist-assessment-by-claude-opus-5.yaml
          (overall SUPPORTED); both endorse keeping CANONICAL for the core axis, and the verdicts differ
          on how much of the report beyond that core is carried. Retain CANONICAL for the GBA1 enzyme/substrate
          axis. Glucosylsphingosine, complement signaling, bone-cell interactions, and lipid-reactive
          gammopathy refine that axis. Biomarker association does not prove that glucosylsphingosine is
          the dominant toxin, and therapy response does not identify every intervening mechanism. GBA1-associated
          Parkinson disease is a risk branch distinct from acute/chronic neuronopathic Gaucher disease.
          ER stress predominance and comparative CNS treatment efficacy remain unresolved.
      selected_evidence:
        snippet: the presence of a single N370S allele is diagnostic of the type 1 or nonneuronopathic
        supports: SUPPORT
