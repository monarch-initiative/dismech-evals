      assertion_type: Diagnosis
      assertion:
        name: Glucocerebrosidase activity and GBA1 testing
        description: Confirm deficient GCase activity in leukocytes or other nucleated cells and/or biallelic
          pathogenic GBA1 variants. Dried-blood-spot screening requires appropriate confirmatory evaluation;
          GBA1 testing must account for its homologous pseudogene and recombinant alleles.
        measurements:
        - preferred_term: Glucocerebrosidase (glucosylceramidase) activity
          term:
            id: LOINC:LP15604-9
            label: Glucosylceramidase
        notes: 'Bound the specimen-generic Part code (LOINC:LP15604-9) for identity. This row''s own description
          names leukocytes or other nucleated cells as the confirmatory specimen (matching LOINC:32540-7,
          Glucosylceramidase [Enzymatic activity/mass] in Leukocytes, if a specimen-specific code is later
          needed), separate from the dried-blood-spot screening specimen the same row already flags as
          requiring confirmation (LOINC:55917-9, Glucosylceramidase [Enzymatic activity/volume] in DBS,
          not bound here because this row does not describe a newborn-screening workflow). No reference_ranges
          band is recorded: the cited source states only that diagnosis "relies on demonstration of deficient"
          activity, with no numeric cut-off this entry could bound.'
      selected_evidence:
        snippet: The diagnosis of GD relies on demonstration of deficient glucocerebrosidase (glucosylceramidase)
