      assertion_type: Diagnosis
      assertion:
        name: Brain Magnetic Resonance Imaging (MRI) and Diffusion Tractography
        description: Structural brain MRI and diffusion tensor tractography demonstrate the pathognomonic
          combination of complete agenesis of the corpus callosum, absence of the anterior and hippocampal
          commissures, widely spaced lateral ventricles (racing car sign), longitudinal Probst bundles,
          and a deep midline cleft throughout the brainstem with a split pons, butterfly-shaped medulla
          oblongata, and absence of the superior cerebellar peduncle decussation (loss of the midbrain
          red dot sign on color fractional anisotropy maps).
        results: Agenesis of the corpus callosum, anterior commissure, and hippocampal commissure together
          with a split pons and butterfly-shaped medulla oblongata distinguishes HGPPS2 from ROBO3-related
          HGPPS1 (which has intact forebrain commissures).
        diagnosis_term:
          preferred_term: magnetic resonance imaging of brain
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
      selected_evidence:
        snippet: In posterior fossa, pons was split in midline, and medulla oblongata showed a butterfly
          shape because of large midline cleft throughout the brainstem (Fig. 3). In supratentorial space,
          total agenesis of corpus callosum and other commissural tracts was evident. Widely spaced lateral
          ventricles, often called as racing car sign, could be seen.
        supports: SUPPORT
