            label: synaptic transmission, GABAergic
      selected_evidence:
        snippet: The amygdala consists of inhibitory networks composed of GABAergic interneurons, responsible
          for modulating anxiety responses in both normal and pathological conditions. The GABAA receptor
          has allosteric sites (e.g., α/γ, γ/β, and α/β) which enable regulation of neuronal inhibition
          in the amygdala. These sites serve as molecular targets for anxiolytic medications such as benzodiazepine
          and barbiturates.
        supports: SUPPORT
