              id: MONDO:0001942
              label: generalized anxiety disorder
        context:
        - path: /animal_models/0
          value:
            name: Adult zebrafish novel tank diving anxiolytic-screening assay
            species: Zebrafish (Danio rerio)
            genotype: Wild type (pharmacological assay; no engineered allele)
            description: Adult zebrafish placed in a novel tank initially dwell in the bottom third and
              progressively explore higher levels of the tank. The proportion of time spent bottom-dwelling
              serves as the anxiety index, while swim speed is recorded in parallel so that sedation can
              be separated from anxiolysis. Drugs are given by brief immersion rather than injection.
              As a New Approach Methodology-tier behavioural pharmacology screen the assay is inexpensive
              and higher-throughput than its rodent equivalents, and it discriminates anxiolytic drugs
              across serotonergic, benzodiazepine and nicotinic classes.
            publication: PMID:19643124
            associated_phenotypes:
            - Anxiety-like bottom dwelling (diving response) in a novel environment
            notes: Scope is limited to the two neurotransmitter mechanisms the publication actually manipulated.
              The model is deliberately not linked to Amygdala Hyperactivity, HPA Axis Dysregulation,
              or the disease-level phenotypes, because no neural, endocrine, or symptom-level measurement
              was made.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Serotonin Dysregulation
        relationship: PERTURBS
        fidelity: MODERATE
        description: Acute immersion in the 5-HT1A receptor agonist buspirone reduces the diving response
          at doses that do not slow swimming, showing that the serotonergic (5-HT1A) anxiolytic target
          underlying this node is functionally conserved and pharmacologically addressable in zebrafish.
        limitations: Buspirone also carries D2 dopaminergic activity, so the effect cannot be attributed
          to 5-HT1A signalling alone, and a single 3-minute immersion cannot model the weeks of treatment
          that human serotonergic anxiolysis requires. The assay demonstrates conservation of an anxiolytic
          drug target, not that zebrafish reproduce the raphe-prefrontal serotonergic pathology curated
          for human GAD.
        readouts:
        - name: Novel-tank bottom dwelling under buspirone
          target: Serotonin Dysregulation
          description: Time spent in the bottom third of the novel tank across a 5-minute session after
            brief buspirone immersion, compared with vehicle controls, with swim speed measured concurrently
            as a sedation control.
          direction: DECREASED
          interpretation: A fall in bottom dwelling with no concurrent fall in swim speed is read as anxiolysis
            rather than sedation, so the readout reports specifically on pharmacological engagement of
            the serotonergic arm.
      selected_evidence:
        snippet: The zebrafish novel tank diving task can be useful in discriminating anxiolytic drugs
          of several classes (serotonergic, benzodiazepines and nicotinic).
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0/modeled_mechanisms/0
      evidence_path: /animal_models/0/modeled_mechanisms/0/evidence/0
      context_paths:
