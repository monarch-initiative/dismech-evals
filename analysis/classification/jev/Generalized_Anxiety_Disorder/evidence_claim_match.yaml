              Human SSRI anxiolysis emerges over weeks of dosing, so an acute immersion has no expectation
              of an effect, and the adult novel-tank model does detect acute 5-HT1A agonist anxiolysis
              with buspirone. The honest reading is that acute larval edge preference is insensitive to
              reuptake inhibition, which bounds the assay's use in screening serotonergic anxiolytics
