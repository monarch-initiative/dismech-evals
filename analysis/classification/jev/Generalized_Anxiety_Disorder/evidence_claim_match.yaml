    evidence_metadata:
      reference: PMID:19643124
      reference_title: Buspirone, chlordiazepoxide and diazepam effects in a zebrafish model of anxiety.
      evidence_source: MODEL_ORGANISM
      explanation: New Approach Methodology (NAM) evidence — the zebrafish novel-tank diving assay, an
        animal-model alternative for behavioral pharmacology screening, shows that the benzodiazepine
        diazepam (a GABA-A receptor agonist) produces a dose-dependent anxiolytic effect, supporting functional
        conservation of the GABAergic/benzodiazepine anxiolytic target relevant to GAD. (Chlordiazepoxide
        did not produce anxiolysis in the same assay, illustrating compound-level discrimination by the
        model.)
