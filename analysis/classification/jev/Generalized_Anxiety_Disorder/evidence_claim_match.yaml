        - path: /animal_models/2
          value:
            name: Larval zebrafish edge-preference (thigmotaxis) assay
            species: Zebrafish (Danio rerio)
            genotype: Wild type (pharmacological assay; no engineered allele)
            background: Larvae imaged in multiwell plates in five-fish and two-fish assay formats
            description: Automated imaging of larval preference for the edge of a multiwell plate, with
              and without a visual stimulus, used to dissociate anxiolytic drug classes. Diazepam, fluoxetine
              and caffeine were tested against the same endpoint, so the assay reports not only which
              compounds are active but which are not.
            publication: PMID:22155488
            associated_phenotypes:
            - Anxiety-like edge preference (thigmotaxis) in a multiwell plate
            notes: The fluoxetine null is curated deliberately. Recording only the compounds that worked
              would misrepresent this assay as a general anxiolytic screen when the source reports a dissociation
              between drug classes.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Serotonin Dysregulation
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Acute fluoxetine, a selective serotonin reuptake inhibitor and the drug class that
          is first-line for human GAD, did not alter larval edge preference, while diazepam tested in
          the same assay did. The assay therefore does not reproduce the serotonergic arm of human GAD
          pharmacology.
        limitations: This negative result is not evidence against serotonergic involvement in GAD. Human
          SSRI anxiolysis emerges over weeks of dosing, so an acute immersion has no expectation of an
          effect, and the adult novel-tank model does detect acute 5-HT1A agonist anxiolysis with buspirone.
          The honest reading is that acute larval edge preference is insensitive to reuptake inhibition,
          which bounds the assay's use in screening serotonergic anxiolytics rather than adjudicating
          the mechanism.
        readouts:
        - name: Larval edge preference under acute fluoxetine
          target: Serotonin Dysregulation
          description: Proportion of time larvae spend at the well edge under acute fluoxetine exposure
            relative to controls, assayed in the same experiment as the positive diazepam and caffeine
            comparators.
          direction: UNCHANGED
          interpretation: 'A negative result with internal positive controls in the same assay: the null
            is attributable to the compound class and exposure duration rather than to an insensitive
            endpoint.'
      selected_evidence:
        snippet: These results suggest that the edge preference in zebrafish larvae is a measure of anxiety
          and further illustrate that the pharmaceuticals used in the study have different mechanisms
          of action.
        supports: SUPPORT
