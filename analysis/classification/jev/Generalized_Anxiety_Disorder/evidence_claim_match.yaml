            - Anxiety-like bottom dwelling (diving response) in a novel environment
            notes: Scope is limited to the two neurotransmitter mechanisms the publication actually manipulated.
              The model is deliberately not linked to Amygdala Hyperactivity, HPA Axis Dysregulation,
              or the disease-level phenotypes, because no neural, endocrine, or symptom-level measurement
              was made.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: GABA System Dysfunction
        relationship: PERTURBS
        fidelity: MODERATE
        description: The benzodiazepine diazepam reduces the diving response at non-sedative doses, indicating
          that benzodiazepine-GABA-A signalling is present and anxiolytically effective in zebrafish.
          The second benzodiazepine tested, chlordiazepoxide, produced sedation but no anxiolysis, so
          the model engages this node only partially.
        limitations: Chlordiazepoxide is an effective GABA-A agonist and is anxiolytic in rodents, yet
          produced no reduction in bottom dwelling here over a broad dose range; the diazepam dose-response
          was also biphasic. Benzodiazepine responsiveness is therefore compound-specific in this model,
          and a negative result for a GABAergic compound must not be transferred to human GAD as evidence
          against a GABAergic mechanism.
        readouts:
        - name: Novel-tank bottom dwelling under diazepam
          target: GABA System Dysfunction
          description: Time spent in the bottom third of the novel tank after brief diazepam immersion,
            compared with vehicle controls, with swim speed measured concurrently as a sedation control.
          direction: DECREASED
          interpretation: Anxiolysis at doses that leave swimming intact is the positive readout for functional
            benzodiazepine-GABA-A signalling in this model.
        - name: Novel-tank bottom dwelling under chlordiazepoxide
          target: GABA System Dysfunction
          description: The same bottom-dwelling measure after chlordiazepoxide immersion across a dose
            range extending up to sedative concentrations.
          direction: UNCHANGED
          interpretation: 'A genuine negative result: the compound reached behaviourally active concentrations
            (it caused sedation) without producing anxiolysis, so the null is not explained by failure
            to reach the target tissue. This bounds how far benzodiazepine pharmacology in this model
            may be generalized.'
      selected_evidence:
        snippet: The zebrafish novel tank diving task can be useful in discriminating anxiolytic drugs
          of several classes (serotonergic, benzodiazepines and nicotinic).
        supports: SUPPORT
