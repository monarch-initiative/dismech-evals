          term:
            id: GO:0051932
            label: synaptic transmission, GABAergic
      selected_evidence:
        snippet: A decrease in GABAergic activity is present in both anxiety disorders and severe depression.
          Research on cerebral functional imaging in depressive individuals has shown reduced levels of
          GABA within the cortical regions. Additionally, animal studies demonstrated that a reduction
          in the expression of GABAA/B receptors results in a behavioral pattern resembling anxiety.
        supports: SUPPORT
