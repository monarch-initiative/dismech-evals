      assertion_type: Pathophysiology
      assertion:
        name: Amygdala Hyperactivity
        description: 'Exaggerated amygdala response to perceived threats leads to excessive fear and anxiety.
          Reduced prefrontal cortex regulation of amygdala activity.

          '
        cell_types:
        - preferred_term: Amygdala Pyramidal Neuron
          term:
            id: CL:4023110
            label: amygdala pyramidal neuron
        biological_processes:
        - preferred_term: Fear Response
          term:
            id: GO:0042596
            label: fear response
      selected_evidence:
        snippet: Evidence indicates that anxiety disorders arise from an imbalance in the functioning
          of brain circuits that govern the modulation of emotional responses to possibly threatening
          stimuli. The circuits under consideration in this context include the amygdala's bottom-up activity,
          which signifies the existence of stimuli that may be seen as dangerous. Moreover, these circuits
          encompass top-down regulatory processes that originate in the prefrontal cortex, facilitating
          the communication of the emotional significance associated with the inputs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38865810
      reference_title: GABAergic implications in anxiety and related disorders.
      explanation: This evidence supports the model of amygdala hyperactivity in anxiety and the role
        of prefrontal cortex in regulating amygdala responses to threat stimuli.
