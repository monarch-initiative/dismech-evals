            description: Adult zebrafish placed in a novel tank initially dwell in the bottom third and
              progressively explore higher levels of the tank. The proportion of time spent bottom-dwelling
              serves as the anxiety index, while swim speed is recorded in parallel so that sedation can
              be separated from anxiolysis. Drugs are given by brief immersion rather than injection.
              As a New Approach Methodology-tier behavioural pharmacology screen the assay is inexpensive
