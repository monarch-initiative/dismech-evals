              so the shared diazepam result is independent corroboration rather than duplication.'
          role: ancestor
        - path: /animal_models/1/modeled_mechanisms/0
          value:
            target: GABA System Dysfunction
            relationship: PERTURBS
            fidelity: MODERATE
            description: Diazepam attenuates dark-flash-evoked thigmotaxis in larvae, and the anxiogenic
              reference compound caffeine enhances it, giving the assay bidirectional pharmacological
              validation of the benzodiazepine-GABA-A anxiolytic target at larval stages.
            limitations: Thigmotaxis is a behavioural proxy; no GABAergic transmission, receptor occupancy,
              or brain-region measurement was made, so the link is to the drug target of this node rather
              than to a demonstrated GABAergic deficit. Reducing the light-to-darkness contrast lowered
              thigmotaxis as effectively as diazepam did, so the readout is also sensitive to stimulus
              intensity and is not specific to pharmacology.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Dark-flash-evoked larval thigmotaxis under diazepam
        target: GABA System Dysfunction
        description: Thigmotaxis of 5-days-post-fertilization larvae following a sudden light-to-darkness
          transition, measured under diazepam against vehicle-treated larvae and against the anxiogenic
          comparator caffeine.
        direction: DECREASED
        interpretation: Attenuation by an anxiolytic together with enhancement by an anxiogenic is what
          validates the endpoint as an anxiety index rather than a general locomotor measure.
      selected_evidence:
        snippet: Thigmotaxis was significantly attenuated by anxiolytic (diazepam) and significantly enhanced
          by anxiogenic (caffeine) drugs, thus representing the first validated thigmotaxis assay for
          larval zebrafish.
