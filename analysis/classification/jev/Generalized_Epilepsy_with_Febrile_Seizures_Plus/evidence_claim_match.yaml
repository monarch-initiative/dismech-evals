  825aaf0e35e922710badc9a2595f31c847714db3f0f4e5e3ee72f872317af71f:
    claim:
      about:
        disease:
          name: Generalized Epilepsy with Febrile Seizures Plus
          disease_term:
            preferred_term: Generalized Epilepsy with Febrile Seizures Plus
            term:
              id: MONDO:0018214
              label: generalized epilepsy with febrile seizures plus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired GABAergic inhibition
        description: GEFS+ variants in the GABA-A receptor subunit genes GABRG2 (gamma-2) and GABRD (delta)
          reduce inhibitory GABAergic neurotransmission. GABRG2 variants span missense, nonsense, frameshift,
          point, and splice-site classes; because the gamma-2 subunit is central to receptor trafficking,
          many variants reduce surface receptor expression and chloride conductance. In parallel, because
          Nav1.1 (SCN1A) is preferentially expressed in GABAergic interneurons, loss-of-function SCN1A
          variants reduce interneuron firing, producing a convergent disinhibition mechanism.
        genes:
        - preferred_term: GABRG2
          term:
            id: hgnc:4087
            label: GABRG2
        - preferred_term: GABRD
          term:
            id: hgnc:4084
            label: GABRD
        cell_types:
        - preferred_term: GABAergic inhibitory interneuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        biological_processes:
        - preferred_term: GABAergic synaptic transmission
          term:
            id: GO:0051932
            label: synaptic transmission, GABAergic
          modifier: DECREASED
        - preferred_term: GABA signaling pathway
          term:
            id: GO:0007214
            label: gamma-aminobutyric acid signaling pathway
          modifier: DECREASED
        - preferred_term: Chloride transmembrane transport
          term:
            id: GO:1902476
            label: chloride transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: The γ2 subunit plays a special role in receptor trafficking and is closely related to
          its structural specificity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
