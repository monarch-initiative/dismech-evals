          point, and splice-site classes; because the gamma-2 subunit is central to receptor trafficking,
          many variants reduce surface receptor expression and chloride conductance. In parallel, because
          Nav1.1 (SCN1A) is preferentially expressed in GABAergic interneurons, loss-of-function SCN1A
          variants reduce interneuron firing, producing a convergent disinhibition mechanism. On the presynaptic
          side, missense variants in SLC32A1, the vesicular GABA transporter VGAT, are predicted to alter
          GABA loading into synaptic vesicles.
