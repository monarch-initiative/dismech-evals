              label: generalized epilepsy with febrile seizures plus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gefsplus_fever_temperature_sensitivity_mechanism
        prompt: 'Why are seizures fever-triggered across mechanistically distinct GEFS+ genes (voltage-gated
          sodium channels, GABA-A receptor subunits, and the presynaptic SNARE syntaxin-1B): is there
          a direct temperature effect on each mutant protein''s gating or trafficking, or a shared thermosensitive
          circuit vulnerability?'
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Synaptic vesicle exocytosis dysfunction
        - pathophysiology#Network hyperexcitability and seizures
        rationale: Fever sensitivity is the unifying clinical hallmark of GEFS+, yet the causative genes
          act on very different molecular processes. Whether elevated temperature independently destabilizes
          each mutant protein or instead converges on a common thermosensitive network node is unresolved,
          and the answer bears on why a heterogeneous set of channel and synaptic lesions produces the
          same fever-triggered phenotype.
        proposed_experiments:
        - experiment_id: exp_gefsplus_temperature_ramp_variant_panel
          name: Temperature-ramp electrophysiology across GEFS+ variant classes
          description: In matched neuronal or heterologous systems expressing SCN1A, SCN1B, GABRG2, and
            STX1B GEFS+ variants, apply controlled temperature ramps and measure how each lesion alters
            excitability and inhibitory transmission relative to wild type.
          experiment_type:
            preferred_term: temperature-controlled electrophysiology experiment
          readouts:
          - name: Temperature-dependent excitability and inhibition
            target: pathophysiology#Network hyperexcitability and seizures
            biological_processes:
            - preferred_term: Membrane depolarization
              term:
                id: GO:0051899
                label: membrane depolarization
              modifier: INCREASED
            - preferred_term: GABAergic synaptic transmission
              term:
                id: GO:0051932
                label: synaptic transmission, GABAergic
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: Wild-type constructs at matched temperatures
            description: Wild-type channel, receptor, and SNARE constructs assayed across the same temperature
              range.
          decision_criterion: A direct thermosensitivity mechanism is supported if each mutant lesion
            shows a temperature-dependent functional shift steeper than wild type; a shared-circuit mechanism
            is favored if network destabilization emerges only in intact circuits and not at the single-protein
            level.
          would_support:
          - pathophysiology#Synaptic vesicle exocytosis dysfunction
          - pathophysiology#Network hyperexcitability and seizures
      selected_evidence:
        snippet: Video and local field potential analyses of zebrafish larvae with antisense knockdown
          of stx1b showed seizure-like behavior and epileptiform discharges that were highly sensitive
          to increased temperature.
        supports: SUPPORT
