    evidence_metadata:
      reference: PMID:9697698
      reference_title: Febrile seizures and generalized epilepsy associated with a mutation in the Na+-channel
        beta1 subunit gene SCN1B.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the channelopathy framework underlying GEFS+ and predicts additional sodium-channel
        subunit involvement (later confirmed for SCN1A).
