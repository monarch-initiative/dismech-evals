  2cd4da3c41e61d5112e6b9a30a05996c53f6ea95da655d803809bbd5d3e01c5a:
    claim:
      about:
        disease:
          name: Generalized Epilepsy with Febrile Seizures Plus
          disease_term:
            preferred_term: Generalized Epilepsy with Febrile Seizures Plus
            term:
              id: MONDO:0018214
              label: generalized epilepsy with febrile seizures plus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Voltage-gated sodium channel dysfunction
        description: Heterozygous variants in the neuronal voltage-gated sodium channel alpha-subunit
          SCN1A (Nav1.1) and the modulatory beta-1 subunit SCN1B alter channel gating and inactivation.
          The classic SCN1B C121W variant impairs the beta-1 subunit's ability to modulate channel-gating
          kinetics in a loss-of-function manner, while SCN1A missense variants (often in conserved domains/S4
          voltage sensors) shift gating/inactivation. These channelopathies established the founding "idiopathic
          epilepsies are channelopathies" paradigm.
        genes:
        - preferred_term: SCN1A
          term:
            id: hgnc:10585
            label: SCN1A
        - preferred_term: SCN1B
          term:
            id: hgnc:10586
            label: SCN1B
        cell_types:
        - preferred_term: GABAergic inhibitory interneuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        biological_processes:
        - preferred_term: Sodium ion transmembrane transport
          term:
            id: GO:0035725
            label: sodium ion transmembrane transport
          modifier: ABNORMAL
        - preferred_term: Membrane depolarization
          term:
            id: GO:0051899
            label: membrane depolarization
          modifier: INCREASED
      selected_evidence:
        snippet: This observation develops the theme that idiopathic epilepsies are a family of channelopathies
          and raises the possibility of involvement of other Na+-channel subunit genes in febrile seizures
          and generalized epilepsies with complex inheritance patterns.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
