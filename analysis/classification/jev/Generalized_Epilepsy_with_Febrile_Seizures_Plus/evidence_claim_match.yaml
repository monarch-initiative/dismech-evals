              label: generalized epilepsy with febrile seizures plus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gefsplus_modifier_background_intrafamilial_severity
        prompt: Within a single GEFS+ family sharing one pathogenic variant, what genetic modifier or
          polygenic background determines whether a carrier manifests simple febrile seizures, febrile
          seizures plus, or a severe developmental and epileptic encephalopathy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Network hyperexcitability and seizures
        rationale: 'GEFS+ shows incomplete penetrance and striking intrafamilial variable expressivity:
          relatives carrying the same primary channel or receptor variant range from unaffected through
          simple febrile seizures to severe epilepsy. Which second-locus modifiers or polygenic common-variant
          burden set an individual carrier''s position on this severity spectrum remains a long-standing
          open question with direct oligogenic and modifier-inheritance implications for genetic counseling.'
        proposed_experiments:
        - experiment_id: exp_gefsplus_family_modifier_severity_mapping
          experiment_design: HUMAN_OBSERVATIONAL
          name: GEFS+ intrafamilial modifier and polygenic-burden mapping study
          description: In multiplex GEFS+ families segregating a single primary variant, genotype mildly
            and severely affected carriers to test whether second-locus rare variants or a higher common-variant
            polygenic burden track with phenotype severity.
          experiment_type:
            preferred_term: family-based genetic modifier association study
          readouts:
          - name: Seizure-phenotype severity versus genetic background
            target: pathophysiology#Network hyperexcitability and seizures
            biological_processes:
            - preferred_term: Action potential
              term:
                id: GO:0001508
                label: action potential
              modifier: INCREASED
            assays:
            - preferred_term: whole genome sequencing
            - preferred_term: polygenic risk score analysis
            direction: POSITIVE
          controls:
          - name: Nonpenetrant variant carriers
            description: Family members carrying the primary variant without seizures.
          decision_criterion: A modifier is supported when a rare second-locus variant or higher polygenic
            burden reproducibly co-varies with greater seizure severity among carriers of the same primary
            variant.
          would_support:
          - pathophysiology#Network hyperexcitability and seizures
      selected_evidence:
        snippet: Only four individuals showed the FS or FS(+) phenotype.
        supports: SUPPORT
