      assertion_type: Discussion
      assertion:
        discussion_id: controversy_gefsplus_dravet_continuum_residual_function
        prompt: Is GEFS+ mechanistically a milder point on a single SCN1A severity axis set by residual
          channel and interneuron function, or is it qualitatively distinct from Dravet syndrome at the
          severe end of the spectrum?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Voltage-gated sodium channel dysfunction
        rationale: SCN1A missense variants that retain partial function tend to cause GEFS+, whereas truncating
          loss-of-function variants tend to cause Dravet syndrome, suggesting a quantitative residual-function
          continuum. It remains debated whether the milder and severe ends differ only in the degree of
          Nav1.1 interneuron dysfunction or whether additional qualitatively distinct mechanisms operate
          at the Dravet end, which affects whether GEFS+ and Dravet should be modeled on one mechanistic
          axis.
        proposed_experiments:
        - experiment_id: exp_gefsplus_scn1a_residual_function_genotype_severity
          name: SCN1A residual-function versus clinical-severity correlation
          description: Across a graded SCN1A allelic series spanning GEFS+ missense and Dravet truncating
            variants, quantify residual Nav1.1 function and interneuron firing in a common assay background
            and test correlation with clinical severity.
          experiment_type:
            preferred_term: genotype-function-severity correlation study
          readouts:
          - name: Residual sodium current and interneuron excitability
            target: pathophysiology#Voltage-gated sodium channel dysfunction
            biological_processes:
            - preferred_term: Sodium ion transmembrane transport
              term:
                id: GO:0035725
                label: sodium ion transmembrane transport
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology
            direction: NEGATIVE
          controls:
          - name: Wild-type SCN1A
            description: Wild-type Nav1.1 assayed in the same background.
          decision_criterion: A single continuous axis is supported if clinical severity correlates monotonically
            with loss of residual Nav1.1 function across the allelic series; a qualitatively distinct
            Dravet mechanism is favored if severe cases deviate from that function-severity relationship.
          would_support:
          - pathophysiology#Voltage-gated sodium channel dysfunction
      selected_evidence:
        snippet: These results indicate further clinical and genetic heterogeneity in GEFS(+).
        supports: SUPPORT
