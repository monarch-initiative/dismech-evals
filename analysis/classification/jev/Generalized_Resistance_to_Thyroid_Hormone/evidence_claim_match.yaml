      assertion_type: Pathophysiology
      assertion:
        name: THRB Dominant-Negative Receptor Formation
        description: Heterozygous missense mutations in THRB cluster in three hot-spot regions of the
          ligand-binding domain that border the T3-binding pocket. The mutant TRβ protein retains its
          DNA-binding domain and its capacity to heterodimerize with RXR at thyroid hormone response elements,
          but its hormone-binding pocket is distorted, so it binds T3 with markedly reduced affinity.
        genes:
        - preferred_term: THRB
          term:
            id: hgnc:11799
            label: THRB
        role: trigger
        biological_scale: MOLECULAR
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
          allele_type: missense
        molecular_functions:
        - preferred_term: Thyroid hormone receptor (TRβ) DNA/RXR-binding activity
          term:
            id: GO:0004879
            label: nuclear receptor activity
      selected_evidence:
        snippet: these three clusters of mutations border the T3-binding pocket
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15988389
      reference_title: Syndromes of thyroid hormone resistance.
      evidence_source: OTHER
      explanation: Localizes the RTH-beta mutation hot spots to the T3-binding pocket of the ligand-binding
        domain, consistent with a receptor that keeps its DNA-binding/dimerization function but loses
        normal hormone binding.
