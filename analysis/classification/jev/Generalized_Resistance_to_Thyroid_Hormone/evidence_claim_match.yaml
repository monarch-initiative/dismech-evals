      assertion:
        name: Supraphysiologic Intermittent Liothyronine (L-T3) and Avoidance of Ablative Therapy
        description: Because thyroidectomy and radioactive iodine reduce the intact wild-type receptor's
          compensatory hormone supply and leave persistently elevated TSH driving pituitary hyperplasia
          and recurrent goiter, ablative therapy is generally avoided in RTH-beta. Instead, supraphysiologic
          doses of liothyronine (L-T3) given intermittently (e.g., every other day) achieve a brief high
          peak that suppresses TSH and shrinks goiter, or improves ADHD/cognitive symptoms, without sustaining
          thyrotoxic hormone levels long enough to cause thyrotoxic side effects.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: liothyronine (L-T3)
            term:
              id: CHEBI:18258
              label: 3,3',5-triiodo-L-thyronine
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: radioactive iodine and surgical treatment are not recommended because they may lead to
          pituitary hyperplasia
        supports: SUPPORT
