  1a3efd60c65b46fdc4f28f32179b5351805dd49e369d1eee12fda5a46fc5a8b8:
    claim:
      about:
        disease:
          name: Generalized Resistance to Thyroid Hormone
          disease_term:
            preferred_term: generalized resistance to thyroid hormone
            term:
              id: MONDO:0009043
              label: generalized resistance to thyroid hormone
        context: []
      assertion_type: Treatment
      assertion:
        name: Supraphysiologic Intermittent Liothyronine (L-T3) and Avoidance of Ablative Therapy
        description: Because thyroidectomy and radioactive iodine reduce the intact wild-type receptor's
          compensatory hormone supply and leave persistently elevated TSH driving pituitary hyperplasia
          and recurrent goiter, ablative therapy is generally avoided in RTH-beta. Instead, supraphysiologic
          doses of liothyronine (L-T3) given intermittently (e.g., every other day) achieve a brief high
          peak that suppresses TSH and shrinks goiter, or improves ADHD/cognitive symptoms, without sustaining
          thyrotoxic hormone levels long enough to cause thyrotoxic side effects.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: liothyronine (L-T3)
            term:
              id: CHEBI:18258
              label: 3,3',5-triiodo-L-thyronine
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: Caution should be exercised in the reduction of TH levels with antithyroid medication
          and ablative therapies (radioactive iodine or surgery) as it leads to difficulty in the subsequent
          treatment of hypothyroidism.
        supports: SUPPORT
