      assertion_type: DifferentialDiagnosis
      assertion:
        name: TSH-Secreting Pituitary Adenoma (TSHoma)
        disease_term:
          preferred_term: TSH-secreting pituitary adenoma
          term:
            id: MONDO:0019611
            label: TSH-secreting pituitary adenoma
        description: 'The principal condition to exclude, particularly when there is no family history:
          TSHoma also produces elevated free thyroid hormone with a non-suppressed TSH. Testing first-degree
          relatives for the biochemical phenotype is a cost-effective way to support RTH-beta over TSHoma,
          since incidental pituitary lesions are found in up to 24% of RTH-beta patients, complicating
          imaging-based differentiation.'
        distinguishing_features:
        - Failure to suppress TSH after supraphysiologic T3 administration
        - Failure to normally stimulate TSH with TRH
        - Elevated serum SHBG
        - Increased pituitary alpha-glycoprotein/TSH molar ratio
        - Frequent co-secretion of growth hormone or prolactin, with an imaging-confirmed pituitary mass
      selected_evidence:
        snippet: Characteristics of a TSH-oma include failure to suppress TSH after the administration
          of supra-physiologic doses of T3, failure to normally stimulate TSH with TSH releasing hormone
          (TRH)
        supports: SUPPORT
