              label: generalized resistance to thyroid hormone
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Corepressor Release at Thyroid Hormone Response Elements
        description: Because the mutant receptor cannot undergo the normal T3-induced conformational change,
          it fails to release the nuclear receptor corepressor complex (NCoR/SMRT) that is bound in the
          unliganded state, and correspondingly fails to recruit coactivators. The mutant receptor continues
          to occupy DNA at thyroid hormone response elements, so the corepressor block is not a loss of
          binding but a persistence of the repressive complex despite the presence of circulating hormone.
        role: amplifier
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: Persistent NCoR/SMRT corepressor binding by mutant TRβ
          term:
            id: GO:0001222
            label: transcription corepressor binding
      selected_evidence:
        snippet: most TRB mutations impair the hormone binding to the receptor and interfere with the
          mechanism(s) of corepressor release and the consequent recruitment of coactivators
        supports: SUPPORT
