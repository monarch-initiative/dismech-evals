              the co-expressed wild-type receptor. Clinically heterogeneous, ranging from goiter and tachycardia
              (relative peripheral thyrotoxicosis in TRα-dominant tissues) to attention and learning difficulties,
              with biochemically elevated free T4/free T3 and a non-suppressed TSH.
