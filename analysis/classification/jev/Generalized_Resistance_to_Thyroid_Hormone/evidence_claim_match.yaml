  3040136de8fc5b2fc9b6b55dec1a7ce39dfff419fdc9157cb2c8a52acbb2ccb5:
    claim:
      about:
        disease:
          name: Generalized Resistance to Thyroid Hormone
          disease_term:
            preferred_term: generalized resistance to thyroid hormone
            term:
              id: MONDO:0009043
              label: generalized resistance to thyroid hormone
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tissue-Selective Peripheral Resistance
        description: 'Peripheral tissues vary in their relative TRα/TRβ expression, so the same circulating
          hormone excess produces a mixed clinical picture: TRβ-rich tissues (liver, pituitary) show blunted
          responsiveness (contributing to goiter from continued TSH drive), while TRα-predominant tissues
          (heart, bone) remain relatively hormone-responsive and show signs consistent with the elevated
          circulating hormone (tachycardia), producing the clinically heterogeneous, tissue-selective
          phenotype characteristic of RTH-beta.'
        role: amplifier
        biological_scale: TISSUE
      selected_evidence:
        snippet: The phenotypic manifestations of RTHβ and RTHα are to some extent correlated with the
          degree of disruption and the tissue distribution of the TRs being characterized by variable
          coexistence of hypothyroid or thyrotoxic manifestations in RTHβ
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31588528
      reference_title: Syndromes of Resistance to Thyroid Hormone Action.
      evidence_source: OTHER
      explanation: Directly attributes the mixed hypothyroid/thyrotoxic clinical picture of RTH-beta to
        differential tissue distribution of TRα versus TRβ.
