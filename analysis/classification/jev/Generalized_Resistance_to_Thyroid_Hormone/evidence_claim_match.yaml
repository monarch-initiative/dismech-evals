      assertion_type: Pathophysiology
      assertion:
        name: Pituitary Thyrotroph Resistance to Feedback
        description: Pituitary thyrotrophs predominantly express TRβ2. Dominant-negative inhibition of
          TRβ2-mediated transcription blunts the thyrotroph's ability to sense elevated circulating hormone,
          so the normal negative-feedback suppression of TSH secretion is lost even as free T4/T3 rise.
        role: amplifier
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Pituitary thyrotroph
          term:
            id: CL:0000476
            label: thyrotroph
      selected_evidence:
        snippet: inappropriate secretion of thyroid-stimulating hormone (TSH, normal or elevated).
        supports: SUPPORT
    origin:
