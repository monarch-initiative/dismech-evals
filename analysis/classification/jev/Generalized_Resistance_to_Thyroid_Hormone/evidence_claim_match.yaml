  5cf36fb38b466e50d17552e334673a2ca59253ca52a6937d9e4f69dec144682e:
    claim:
      about:
        disease:
          name: Generalized Resistance to Thyroid Hormone
          disease_term:
            preferred_term: generalized resistance to thyroid hormone
            term:
              id: MONDO:0009043
              label: generalized resistance to thyroid hormone
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Inhibition of Wild-Type Receptor Transcription
        description: Because the mutant receptor still dimerizes with RXR and binds DNA normally, it competes
          with the co-expressed wild-type TRβ (and TRα) for response-element occupancy and RXR partnering.
          The persistent corepressor complex it carries therefore silences T3-target gene transcription
          genome-wide, not only at alleles it occupies alone — the defining dominant-negative mechanism
          that distinguishes RTH-beta from a simple loss-of-function receptor null.
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: Dominant-negative suppression of thyroid hormone receptor signaling
          term:
            id: GO:0002156
            label: negative regulation of thyroid hormone receptor signaling pathway
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: The lack of interaction with coactivators appears to be an additional mechanism for the
          dominant negative effects of mutant TRB on the transcriptional activity of the normal receptor.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15988389
      reference_title: Syndromes of thyroid hormone resistance.
      evidence_source: OTHER
      explanation: States explicitly that the mutant receptor suppresses transcriptional activity driven
        by the co-expressed normal (wild-type) receptor, the hallmark of a dominant-negative rather than
        simple loss-of-function mechanism.
