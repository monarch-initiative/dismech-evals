        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Elevated Thyroid Hormone with Non-Suppressed TSH
        description: 'The net systemic result of thyrotroph resistance and continued TSH drive on an otherwise
          intact thyroid gland is the paradoxical biochemical signature that defines generalized RTH:
          elevated circulating free T4 and/or free T3 together with a measurable, non-suppressed TSH —
          a combination that in a gland with normal feedback would instead produce thyrotoxicosis with
          suppressed TSH.'
