            label: X-linked inheritance
        description: A small number of genetic DEE genes are X-linked, including CDKL5, PCDH19, and ARX,
          together accounting for 17% of molecularly diagnosed cases. X-linked disease and mosaicism complicate
          cellular targeting for emerging gene therapies. PCDH19 departs from the usual X-linked pattern
          in that heterozygous females are affected while hemizygous males are typically unaffected transmitting
          carriers; that observation is recorded in the PCDH19 genetic entry, while its mechanistic explanation
          (cellular interference) is left to the PCDH19 Clustering Epilepsy child entry, since no source
          cached here states it.
      selected_evidence:
