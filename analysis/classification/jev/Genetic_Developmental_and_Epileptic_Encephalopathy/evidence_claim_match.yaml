              label: genetic developmental and epileptic encephalopathy
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Genetic DEE is most commonly regarded as a de novo dominant disease class, and the
          highest-prevalence individual entities (SCN1A, SCN2A, STXBP1, KCNQ2, SCN8A) are indeed de novo
          autosomal dominant, so affected children typically have unaffected parents. Parental germline
          mosaicism gives a small but non-zero sibling recurrence risk. Note that this reflects the distribution
          of *cases*: counted by *gene*, more DEE genes follow autosomal recessive than dominant inheritance.'
      selected_evidence:
        snippet: Parental mosaicism places parents at an increased risk of having a second child with
          a DEE, as a small population of their sperm or ova carry the pathogenic variant.
        supports: SUPPORT
    origin:
