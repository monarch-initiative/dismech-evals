            term:
              id: MONDO:0100062
              label: genetic developmental and epileptic encephalopathy
        context: []
      assertion_type: Prevalence
      assertion:
        population: Italy (15 tertiary epilepsy centres, molecular diagnoses 2012-2022)
        measure_type: PERIOD_PREVALENCE
        prevalence_class: BAND_1_9_PER_100000
        rate_per_100000: 2.6
        notes: 'Genetic-DEE-specific figure derived from molecularly diagnosed patients across 98 genes,
          accumulated over the 11-year window 2012-2022 and used by the authors as a proxy for the prevalence
          rate. The source calls this a "mean incidence proportion", but it is a cumulative diagnosed
          proportion over a defined interval rather than an annual rate, so it is recorded as PERIOD_PREVALENCE
          with the observation window stated here. This is a lower bound: it counts only patients who
          received a molecular diagnosis within the surveyed gene panel, so undiagnosed and non-panel
          genetic DEE are not captured.'
      selected_evidence:
        snippet: We included 1568 unique patients and found a mean incidence proportion of 2.6 patients
          for 100.000 inhabitants (SD=1.13) with consistent values across most Italian regions.
        supports: SUPPORT
    origin:
