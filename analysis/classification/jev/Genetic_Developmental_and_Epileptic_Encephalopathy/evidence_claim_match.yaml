      assertion_type: Genetic
      assertion:
        name: Genetic Heterogeneity Across Ion Channel and Synaptic Genes
        notes: Pathogenic variants causing genetic DEE have been reported in more than nine hundred genes;
          the most frequent recurring categories are voltage-gated ion channel genes (SCN1A, SCN2A, SCN8A,
          KCNQ2, KCNA2, KCNT1), presynaptic vesicle-cycle genes (STXBP1, DNM1, SNAP25), and postsynaptic
          neurotransmitter-receptor genes (GRIN1, GRIN2A, GRIN2B), with most cases arising from de novo
          dominant variants. Individual gene-defined forms are curated as separate dismech entries.
      selected_evidence:
        snippet: genetic cause is found in >50% of patients using next generation sequencing technologies.
        supports: SUPPORT
