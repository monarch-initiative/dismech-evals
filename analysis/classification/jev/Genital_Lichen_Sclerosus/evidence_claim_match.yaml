          a Th1-skewed inflammatory profile, but the initiating antigen and exact causal sequence remain
          unresolved.
        cell_types:
        - preferred_term: T-helper 1 cell
          term:
            id: CL:0000545
            label: T-helper 1 cell
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: T-helper 1 type immune response
          term:
            id: GO:0042088
            label: T-helper 1 type immune response
        - preferred_term: Interferon-gamma production
          term:
            id: GO:0032609
            label: type II interferon production
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: The involved cells express the chemokine receptors CXCR3 and CCR5 and lack CCR3 and CCR4,
          suggesting a Th1 profile.
        supports: SUPPORT
