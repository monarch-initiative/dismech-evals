  2c445d90f2468994a85cef36c964cf5f31eb88953dd91bd5e3129465ef9df088:
    claim:
      about:
        disease:
          name: Genitopatellar Syndrome
          disease_term:
            preferred_term: Genitopatellar Syndrome
            term:
              id: MONDO:0011640
              label: genitopatellar syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulation of histone acetylation and transcriptional coactivation
        description: 'KAT6B is a MYST-family histone acetyltransferase that acetylates histone H3 (including
          H3K23 and H3K9) within multiprotein chromatin-modifying complexes and acts as a transcriptional
          coactivator. GPS alleles reduce histone H3 and H4 acetylation in patient-derived cells and impair
          the transcriptional activation function of the protein, dysregulating expression of downstream
          developmental target genes (e.g., RUNX2, NR5A1). This is the proximate molecular lesion linking
          the KAT6B variant to abnormal developmental gene programs.

          '
        biological_processes:
        - preferred_term: internal peptidyl-lysine acetylation (histone acetylation)
          term:
            id: GO:0018393
            label: internal peptidyl-lysine acetylation
          modifier: DECREASED
        - preferred_term: positive regulation of transcription by RNA polymerase II
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
          modifier: DECREASED
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
        cellular_components:
        - preferred_term: chromatin
          term:
            id: GO:0000785
            label: chromatin
      selected_evidence:
        snippet: We demonstrate a reduced level of both histone H3 and H4 acetylation in patient-derived
          cells suggesting that dysregulation of histone acetylation is a direct functional consequence
          of GPS alleles.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
