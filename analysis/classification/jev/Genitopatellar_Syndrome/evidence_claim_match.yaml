          preferred_term: pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Both compounds improved sociability in Kat6b+/- mice, and ALCAR treatment restored learning
          and memory.
