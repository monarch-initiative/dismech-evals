        description: 'A preclinical proof-of-principle strategy targets the core epigenetic lesion of
          KAT6B disorders by increasing histone acetylation. In KAT6B-haploinsufficient (SBBYSS-modeled)
          mice and patient-mutation human cells, a histone deacetylase inhibitor (valproic acid) and an
          acetyl donor (acetyl-carnitine / ALCAR) elevated histone acetylation and partially reversed
          behavioral and cognitive deficits. This is not yet clinically validated for GPS.

          '
