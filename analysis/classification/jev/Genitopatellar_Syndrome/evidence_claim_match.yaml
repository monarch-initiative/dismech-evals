              label: genitopatellar syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KAT6B C-terminal truncating variants
        description: 'GPS is caused by heterozygous truncating variants (predominantly frameshift and
          nonsense alleles) clustered in the terminal exon (exon 18) of KAT6B, most arising de novo. The
          variants are predicted to generate a truncated protein product lacking evolutionarily conserved
          C-terminal domains (including the transcriptional activation domain). Mutant transcripts escape
          nonsense-mediated decay and the truncated protein is expressed, supporting a dominant-negative
          or altered-function mechanism rather than simple haploinsufficiency.

          '
        gene:
          preferred_term: KAT6B
          term:
            id: hgnc:17582
            label: KAT6B
        molecular_functions:
        - preferred_term: histone acetyltransferase activity
          term:
            id: GO:0004402
            label: histone acetyltransferase activity
        cellular_components:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
      selected_evidence:
        snippet: All identified mutations are located within the terminal exon of the gene and are predicted
          to generate a truncated protein product lacking evolutionarily conserved domains.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
