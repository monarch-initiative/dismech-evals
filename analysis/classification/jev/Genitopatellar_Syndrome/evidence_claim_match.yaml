              id: MONDO:0011640
              label: genitopatellar syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted skeletal, genital, and CNS developmental programs
        description: 'Loss of normal KAT6B-dependent histone acetylation and transcriptional coactivation
          results in epigenetic dysregulation of the limb/skeletal, urogenital, and brain developmental
          programs. Human pathological analyses and mouse expression studies point to systemic roles of
          KAT6B in controlling organismal growth and development, and CRISPR-engineered truncating-variant
          cell models show dysregulation of pathways aligned with the phenotype. This convergent developmental
          dysregulation produces the multisystem GPS phenotype (patellar aplasia, genital anomalies, corpus
          callosum agenesis, intellectual disability, renal anomalies).

          '
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: skeletal system development
          term:
            id: GO:0001501
            label: skeletal system development
          modifier: ABNORMAL
        - preferred_term: urogenital system development
          term:
            id: GO:0001655
            label: urogenital system development
          modifier: ABNORMAL
        - preferred_term: nervous system development
          term:
            id: GO:0007399
            label: nervous system development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Together, the data support an epigenetic dysregulation of the limb, brain, and genital
          developmental programs.
        supports: SUPPORT
