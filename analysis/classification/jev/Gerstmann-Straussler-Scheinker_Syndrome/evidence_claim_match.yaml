            term:
              id: MONDO:0007656
              label: Gerstmann-Straussler-Scheinker syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acquisition of a Conversion-Competent PrP-C Conformer
        description: 'The substitution renders PrP-C susceptible to a stochastic conformational conversion
          into the PrP-Sc-templating fold, eventually making a misfolding event possible over years to
          decades. For the classic P102L GSS variant this is not explained by loss of native-state thermodynamic
          stability: recombinant human PrP(90-231) carrying P102L is recovered soluble, with secondary
          structure and guanidine/thermal unfolding stability indistinguishable from wild-type. (For A117V,
          an alternative upstream trigger is aberrant C-terminal-transmembrane PrP topogenesis rather
          than a globular-domain conformational change.)'
        notes: 'Curation note on what this node deliberately does NOT claim. An earlier revision named
          this node "Destabilization of the PrP-C Native Fold" and asserted that the substitution "lowers
          the thermodynamic/kinetic barrier" separating the native fold from beta-sheet conformers. That
          framing states as mechanism a hypothesis the primary literature directly rejects for GSS: Swietnicki
          et al. (PMID:9813003) assayed the P102L variant itself and found its stability indistinguishable
          from wild-type, and conclude that "some hereditary forms of prion disease cannot be rationalized
          using the concept of mutation-induced thermodynamic destabilization of the cellular prion protein."
          Liemann and Glockshuber (PMID:10079068) independently measured all eight C-terminal familial
          substitutions and found stability does not correlate with disease phenotype. Wildegger et al.
          (Nat Struct Biol, 1999) additionally showed PrP-C folds in ~170 microseconds with no detectable
          intermediate, undercutting a populated folding-intermediate route to PrP-Sc as well. See the
          disease-level `native_state_destabilization` mechanistic hypothesis (status DEPRECATED) for
          the retained refutation evidence. The true proximate trigger for PrP-C-to-PrP-Sc conversion
          in P102L GSS remains an open question.'
        biological_processes:
        - preferred_term: protein folding
          term:
            id: GO:0006457
            label: protein folding
          modifier: ABNORMAL
      selected_evidence:
        snippet: The stability properties of the P102L variant were indistinguishable from those of wild-type
          PrP
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
