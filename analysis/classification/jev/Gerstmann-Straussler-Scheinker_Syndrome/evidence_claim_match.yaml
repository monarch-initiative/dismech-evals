      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: native_state_destabilization
        hypothesis_label: Native-State Thermodynamic/Kinetic Destabilization Model
        status: DEPRECATED
        description: Familial PRNP substitutions cause disease by lowering the thermodynamic and/or kinetic
          barrier separating the native alpha-helical PrP-C fold from beta-sheet-rich conformers, so that
          a stochastic misfolding event becomes possible.
        notes: 'Deprecated for the GSS P102L variant specifically, not just as a general caveat: this
          is the one familial PRNP substitution in this literature that was directly assayed and found
          not to be thermodynamically destabilized. Swietnicki et al. (PMID:9813003) recovered recombinant
          P102L PrP(90-231) in soluble form with wild-type-like secondary structure and stability. Liemann
          and Glockshuber (PMID:10079068) independently found, across all eight C-terminal familial substitutions
          tested, that thermodynamic stability does not correlate with disease phenotype - not that no
          variant is destabilized: five of the eight substitutions they tested (none of them P102L) do
          destabilize PrP(121-231) relative to wild-type, while the other three do not. Retained as DEPRECATED
          for provenance so the barrier-lowering framing is not reintroduced as the explanation for P102L
          specifically.'
      selected_evidence:
        snippet: These data suggest that destabilization of PrPC is neither a general mechanism underlying
          the formation of PrPSc nor the basis of disease phenotypes in inherited human TSEs.
        supports: REFUTE
    origin:
