        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: emerging_gss_prp_lowering
        prompt: Given that GSS is a gain-of-toxic-function disease and PrP loss appears tolerated, will
          PrP-lowering therapies (antisense oligonucleotides, base editing) started before or early after
          symptom onset alter the disease course in humans?
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        attaches_to:
        - pathophysiology#Template-Directed Conversion of PrP-C to PrP-Sc
        rationale: Because the mutant allele actively templates misfolding and heterozygous PRNP loss-of-function
          is tolerated, lowering PrP is a mechanistically rational target. In vivo base editing lowered
          brain PrP and extended lifespan in a humanized prion mouse model, and the ION717 antisense oligonucleotide
          is in a first-in-human intrathecal trial. Whether these translate to clinical benefit - and
          how early they must start - is the central open therapeutic question.
        proposed_experiments:
        - experiment_id: exp_gss_prp_lowering_timing
          name: Timing-of-intervention study for PrP-lowering in genetic prion disease
          description: Use presymptomatic PrP and neurofilament biomarkers to define the therapeutic window
            in which PrP-lowering alters trajectory, in at-risk PRNP carriers and animal models.
      selected_evidence:
        snippet: depleting PrP in the brain is an established strategy to prevent or stall templated misfolding
          of PrP
        supports: SUPPORT
