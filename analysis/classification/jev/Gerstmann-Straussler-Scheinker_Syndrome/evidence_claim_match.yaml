      assertion_type: Pathophysiology
      assertion:
        name: Secondary Tau Pathology
        description: In the F198S (and Q217R) variants, neurofibrillary tangles indistinguishable from
          those of Alzheimer disease arise around PrP plaques. Bank-vole transmission shows the PrP amyloid
          and tau tangles are independent parallel pathologies rather than one driving the other, so this
