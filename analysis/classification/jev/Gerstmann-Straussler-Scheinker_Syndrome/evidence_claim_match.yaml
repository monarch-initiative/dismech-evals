      assertion_type: Discussion
      assertion:
        discussion_id: gap_gss_prnp_penetrance_modifiers
        prompt: Why do many reported GSS-associated PRNP variants show markedly reduced or uncertain penetrance,
          and what determines the codon-129 and APOE modifier effects on age at onset - including the
          counterintuitive report that APOE4 may delay rather than hasten onset in P102L?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#PRNP codon 129 (M129V) and APOE modifiers
        - pathophysiology#Acquisition of a Conversion-Competent PrP-C Conformer
        rationale: Large population control cohorts show that PRNP variants previously reported as pathogenic
          are far more common than expected and confer a wide range of lifetime risks, so penetrance is
          variant-specific rather than uniformly high. The codon-129 genotype (and its cis/trans phase)
          and APOE genotype modify onset by incompletely understood mechanisms, and the reported APOE4-delays-onset
          effect is the opposite of its effect in Alzheimer disease. Resolving these would sharpen predictive
          counseling and the timing of any presymptomatic PrP-lowering therapy.
        proposed_experiments:
        - experiment_id: exp_gss_penetrance_modifier
          name: Population-scale penetrance and modifier mapping for PRNP variants
          description: Integrate large biobank/control cohorts with kindred data to estimate variant-specific
            penetrance and to test codon-129 phase and APOE genotype as quantitative modifiers of age
            at onset.
      selected_evidence:
        snippet: other variants have genuine effects on disease susceptibility but confer lifetime risks
          ranging from
        supports: SUPPORT
