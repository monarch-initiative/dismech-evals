      assertion_type: Pathophysiology
      assertion:
        name: Fetal Hyperinsulinaemia
        biological_scale: ORGANISM
        description: 'The Pedersen hypothesis: maternal glucose crosses the placenta, the fetal pancreas
          responds with hyperinsulinaemia, and fetal insulin acts as the principal anabolic growth factor
          of late gestation. Cord-blood C-peptide is the direct measurable readout of this node, and HAPO
          showed it rises continuously with maternal glucose. Fetal hyperinsulinaemia explains both the
          antenatal consequence (excess growth and adiposity) and the neonatal one (hypoglycaemia when
          the maternal glucose supply is abruptly withdrawn at cord clamping while fetal insulin remains
          high).'
        cell_types:
        - preferred_term: pancreatic beta cell
          term:
            id: CL:0000169
            label: type B pancreatic cell
        biological_processes:
        - preferred_term: insulin secretion
          modifier: INCREASED
          term:
            id: GO:0030073
            label: insulin secretion
      selected_evidence:
        snippet: for cord-blood serum C-peptide level above the 90th percentile, 1.55 (95% CI, 1.47 to
          1.64), 1.46 (1.38 to 1.54), and 1.37 (1.30 to 1.44)
        supports: SUPPORT
