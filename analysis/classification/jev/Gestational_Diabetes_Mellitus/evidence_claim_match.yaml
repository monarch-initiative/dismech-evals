            label: exposure to phthalate
        description: 'Two independent meta-analyses put phthalate exposure in pregnancy at a small but
          consistent excess risk of GDM - pooled odds ratios of about 1.07 to 1.10, with lower confidence
          bounds only just clear of the null. The effect size is the point: this is a population-level
          exposure with a per-woman risk far smaller than obesity or prior GDM, and it should not be curated
          as though it were a comparable driver. No mediating step has been demonstrated in humans. Experimental
          work offers candidate routes - insulin resistance, beta-cell dysfunction, inflammation, oxidative
          stress - but names them collectively for a class of pollutants rather than tying any one to
          phthalates in pregnancy.'
      selected_evidence:
        snippet: PAEs and PFASs exposure were also positively associated with the risk of GDM, with summary
          ORs of 1.10 (95% CI = 1.03-1.16; n = 7 for PAEs)
