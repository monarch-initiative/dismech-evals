      assertion_type: Pathophysiology
      assertion:
        name: Placental Hormone-Driven Insulin Resistance
        biological_scale: ORGANISM
        description: 'From the second trimester, placental hormones and adipokines (human placental lactogen,
          placental growth hormone, progesterone, TNF-alpha, leptin) progressively reduce maternal insulin
          sensitivity in skeletal muscle, liver and adipose tissue. This is a normal adaptation, not a
          lesion: it spares maternal glucose for transplacental delivery to the fetus and reverses within
          days of placental delivery. It is the physiological load against which beta-cell reserve is
          tested.'
        cell_types:
        - preferred_term: syncytiotrophoblast
          term:
            id: CL:0000525
            label: syncytiotrophoblast cell
        biological_processes:
        - preferred_term: insulin receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0008286
            label: insulin receptor signaling pathway
      selected_evidence:
        snippet: Hyperglycaemia that develops during pregnancy and resolves after birth has been recognized
          for over 50 years
        supports: SUPPORT
