      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: beta_cell_reserve_unmasking_model
        hypothesis_label: Beta-Cell Reserve Unmasking Model
        status: CANONICAL
        description: 'Physiological insulin resistance of late pregnancy is universal and is not itself
          pathological. GDM arises when it is applied to a woman whose beta-cell compensatory capacity
          is already marginal, whether from chronic insulin resistance (obesity), age-related beta-cell
          decline, or inherited beta-cell dysfunction shared with type 2 diabetes. Pregnancy therefore
          functions as a physiological stress test of beta-cell reserve. Two predictions follow and are
          both observed: the risk-factor profile of GDM is the risk-factor profile of type 2 diabetes,
          and GDM strongly predicts later maternal type 2 diabetes and cardiovascular disease rather than
          simply resolving at delivery.'
      selected_evidence:
        snippet: Maternal overweight and obesity, later age at childbearing, previous history of GDM,
          family history of type 2 diabetes mellitus and ethnicity are major GDM risk factors.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31296866
      reference_title: Gestational diabetes mellitus.
      evidence_source: OTHER
      explanation: The GDM risk-factor set is the type 2 diabetes risk-factor set, as this model predicts
        if GDM is unmasked beta-cell insufficiency rather than a distinct pregnancy-specific disease.
