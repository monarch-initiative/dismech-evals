          value:
            name: Gestational phthalate exposure
            exposure_term:
              preferred_term: exposure to phthalate
              term:
                id: ECTO:9000522
                label: exposure to phthalate
            description: 'Two independent meta-analyses put phthalate exposure in pregnancy at a small
              but consistent excess risk of GDM - pooled odds ratios of about 1.07 to 1.10, with lower
              confidence bounds only just clear of the null. The effect size is the point: this is a population-level
              exposure with a per-woman risk far smaller than obesity or prior GDM, and it should not
              be curated as though it were a comparable driver. No mediating step has been demonstrated
              in humans. Experimental work offers candidate routes - insulin resistance, beta-cell dysfunction,
              inflammation, oxidative stress - but names them collectively for a class of pollutants rather
              than tying any one to phthalates in pregnancy.'
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Beta-Cell Compensatory Failure
        environmental_effect: PREDISPOSES
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'Drawn to the compensatory-failure node because that is the lesion of GDM - the point
          at which a normal gestational insulin-resistance load stops being matched by beta-cell output.
          The choice is by elimination, not by measurement: no human study places phthalates at either
          the insulin sensitivity or the secretion side of that balance. Experimental work nominates beta-cell
          dysfunction among several candidate mechanisms for pollutants as a class, which is why this
          edge is drawn at all, and why its intermediates are marked unknown.'
      selected_evidence:
        snippet: experimental studies suggested that the potential biological mechanisms of environmental
          pollutants contributing to GDM may involve insulin resistance, β-cell dysfunction, neurohormonal
          dysfunction, inflammation, oxidative stress, epigenetic modification, and alterations in gut
          microbiome
        supports: SUPPORT
