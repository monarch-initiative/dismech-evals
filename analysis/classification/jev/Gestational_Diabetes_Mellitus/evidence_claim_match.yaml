              id: MONDO:0005406
              label: gestational diabetes
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: continuous_glycaemic_risk_model
        hypothesis_label: Continuous Glycaemic Risk (No Threshold) Model
        status: CANONICAL
        description: 'Adverse perinatal outcomes are related to maternal glucose continuously across the
          whole non-diabetic range, without an inflection point that would identify a natural disease
          boundary. GDM is therefore a diagnostic convention imposed on a continuum for the purpose of
          allocating treatment, not a discrete biological entity. This has a direct curation consequence:
          the "prevalence" of GDM is largely a function of which cut-off a guideline adopts, and prevalence
          figures are not comparable across diagnostic criteria.'
      selected_evidence:
        snippet: Our results indicate strong, continuous associations of maternal glucose levels below
          those diagnostic of diabetes with increased birth weight and increased cord-blood serum C-peptide
          levels.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
