      assertion_type: Pathophysiology
      assertion:
        name: Beta-Cell Compensatory Failure
        biological_scale: CELLULAR
        description: 'Maternal pancreatic beta cells normally increase insulin secretion several-fold
          to offset gestational insulin resistance. In GDM this compensation is inadequate. The deficit
          is not created by pregnancy: it reflects chronic insulin resistance, age, and inherited beta-cell
          dysfunction shared with type 2 diabetes, which is why the same women remain at elevated metabolic
          risk long after delivery. This node is the actual lesion of GDM and the point at which the disorder
          diverges from normal pregnancy physiology.'
        cell_types:
        - preferred_term: pancreatic beta cell
          term:
            id: CL:0000169
            label: type B pancreatic cell
        biological_processes:
        - preferred_term: insulin secretion
          modifier: DECREASED
          term:
            id: GO:0030073
            label: insulin secretion
      selected_evidence:
        snippet: Maternal overweight and obesity, later age at childbearing, previous history of GDM,
          family history of type 2 diabetes mellitus and ethnicity are major GDM risk factors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
