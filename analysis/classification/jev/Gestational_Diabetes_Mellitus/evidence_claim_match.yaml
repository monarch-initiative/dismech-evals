        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gdm_diagnostic_threshold_convention
        prompt: Given that maternal glucose relates to adverse perinatal outcome continuously with no
          natural inflection, on what basis should a GDM diagnostic threshold be set, and what does "prevalence
          of GDM" mean when the denominator-defining cut-off differs between guidelines?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Maternal Hyperglycaemia
        - phenotypes#Maternal hyperglycemia
        rationale: 'This entry deliberately carries no prevalence record, despite GDM being described
          as the most common medical complication of pregnancy, because a prevalence figure is not interpretable
          without the diagnostic criterion that generated it: the same population yields materially different
          GDM rates under IADPSG, WHO, NICE or Carpenter-Coustan criteria. The underlying question is
          a decision-theoretic one - the threshold should fall where the benefit of treatment exceeds
          its harms and costs - rather than a biological one, and it cannot be resolved by more precise
          measurement of the glucose-outcome curve. Curators adding prevalence to this entry should record
          the diagnostic criterion in the population or notes field, and should not pool estimates across
          criteria.'
      selected_evidence:
        snippet: Hyperglycaemia that develops during pregnancy and resolves after birth has been recognized
          for over 50 years, but uniform worldwide consensus is lacking about threshold hyperglycaemic
          levels that merit a diagnosis of 'gestational diabetes mellitus' (GDM) and thus treatment during
          pregnancy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
