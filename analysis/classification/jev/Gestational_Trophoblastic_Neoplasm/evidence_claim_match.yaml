        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PD-1/PD-L1 Adaptive Immune Resistance
        conforms_to: immune_checkpoint_blockade#Adaptive Immune Resistance
        description: GTN is genetically a semi-allograft (the tumor genome differs from the host, being
          wholly or partly paternal), which makes it intrinsically immunogenic. To evade host T-cell attack,
          neoplastic trophoblast co-opts the placental immune-tolerance program and broadly expresses
          the immune checkpoint ligand PD-L1, engaging PD-1 on tumor-infiltrating T cells to suppress
          the anti-tumor T-cell response. This adaptive immune resistance is the mechanistic rationale
          for immune checkpoint inhibitor therapy, which is effective even in chemoresistant, ultra-high-risk,
          and PSTT/ETT disease.
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: negative regulation of T cell mediated immune response to tumor cell
          modifier: INCREASED
          term:
            id: GO:0002841
            label: negative regulation of T cell mediated immune response to tumor cell
      selected_evidence:
        snippet: "Immune checkpoint immunotherapy (CPI) targeting programmed cell \ndeath 1 (PD-1)/ligand\
          \ (PD-L1) has been shown to be an effective treatment for \ngestational trophoblastic neoplasia\
          \ (GTN)."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37703867
      reference_title: 'Immunotherapy for Gestational Trophoblastic Neoplasia: A New Paradigm.'
