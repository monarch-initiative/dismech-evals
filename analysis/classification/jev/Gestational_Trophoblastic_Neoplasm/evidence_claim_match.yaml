            label: Invasive Hydatidiform Mole
        description: Invasive mole arises when molar villi (most often from a complete hydatidiform mole)
          penetrate the myometrium or its vessels rather than remaining confined to the uterine cavity.
          It retains hydropic chorionic villi with trophoblastic hyperplasia and is the most common form
          of GTN, typically diagnosed by a rising or plateauing hCG after molar evacuation. It can metastasize,
          most often to the lungs, but is highly curable with chemotherapy.
