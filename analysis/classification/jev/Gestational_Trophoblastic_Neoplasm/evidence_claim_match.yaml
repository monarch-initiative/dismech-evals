      assertion:
        name: Androgenetic Diploid Genome (Complete Mole Precursor)
        notes: The complete hydatidiform mole that precedes most villous GTN is diploid but entirely paternal
          in origin, most often from duplication of a single sperm genome (monospermic/homozygous) and
          less often from dispermic fertilization. This androgenetic constitution leads to loss of maternally-expressed
          imprinted genes including CDKN1C (p57).
      selected_evidence:
