      assertion_type: Genetic
      assertion:
        name: Recurrent Mole Predisposition Genes (Meiosis I / Maternal-Effect)
        gene_term:
          preferred_term: HFM1
          term:
            id: hgnc:20193
            label: HFM1
        inheritance:
        - name: Autosomal recessive
        notes: Familial recurrent hydatidiform mole, a precursor condition that elevates lifetime GTN
          risk through repeated molar pregnancies, is caused by biallelic variants in maternal-effect
          and meiosis-I genes. Exome sequencing of women with recurrent androgenetic moles negative for
          the classic maternal-effect genes (NLRP7, KHDC3L) identified biallelic deleterious variants
          in the meiosis-I genes FOXL2, MAJIN, KASH5, SYCP2, MEIOB, and HFM1; these defects impair oocyte
          meiosis and de novo methylation, predisposing to androgenetic conceptions. HFM1 is used here
          as the gene anchor for this meiosis-I gene set.
      selected_evidence:
        snippet: "We identified biallelic deleterious variants in 6 \ngenes, FOXL2, MAJIN, KASH5, SYCP2,\
          \ MEIOB, and HFM1, in patients with \nandrogenetic HMs"
        supports: SUPPORT
    origin:
