      assertion_type: Pathophysiology
      assertion:
        name: Tumor Suppressor and Apoptosis Dysregulation
        description: Beyond imprinting-driven proliferation, malignant transformation along the gestational
          trophoblastic disease spectrum involves dysregulation of the p53 (TP53) tumor suppressor pathway
          and aberrant apoptotic signaling through anti-apoptotic BCL-2, together with altered growth-factor-receptor
          and microRNA expression. These changes impair the apoptotic clearance of proliferating trophoblast
          and help distinguish molar pregnancies and trophoblastic neoplasms from normal placental development,
          contributing to their progression from benign moles toward malignant GTN.
        genes:
        - preferred_term: TP53
          term:
            id: hgnc:11998
            label: TP53
        cell_types:
        - preferred_term: trophoblast cell
          term:
            id: CL:0000351
            label: trophoblast cell
        biological_processes:
        - preferred_term: regulation of apoptotic process
          modifier: ABNORMAL
          term:
            id: GO:0042981
            label: regulation of apoptotic process
      selected_evidence:
        snippet: "dysregulations in tumor suppressor genes such as p53, aberrant \napoptotic pathways\
          \ involving BCL-2 (B-cell lymphoma)"
        supports: SUPPORT
    origin:
