              label: gestational trophoblastic neoplasm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Androgenetic Origin and Loss of Genomic Imprinting
        description: 'Complete hydatidiform mole, the principal precursor of villous GTN (invasive mole
          and choriocarcinoma), is typically diploid but androgenetic: the entire genome is paternally
          derived (most commonly by duplication of a single sperm genome in an ovum that has lost its
          maternal chromosomes). Because the maternally-expressed, paternally-imprinted gene CDKN1C (encoding
          p57^KIP2) is silenced when the maternal genome is absent, p57 protein is lost in villous cytotrophoblast
          and stromal cells. This imbalance of imprinted gene dosage favors overgrowth of trophoblast
          and is the molecular basis for the diagnostic p57 immunostain.'
        cell_types:
        - preferred_term: trophoblast cell
          term:
            id: CL:0000351
            label: trophoblast cell
        genes:
        - preferred_term: HFM1
          term:
            id: hgnc:20193
            label: HFM1
        biological_processes:
        - preferred_term: genomic imprinting
          modifier: ABNORMAL
          term:
            id: GO:0071514
            label: genomic imprinting
      selected_evidence:
        snippet: "We identified biallelic deleterious variants in 6 \ngenes, FOXL2, MAJIN, KASH5, SYCP2,\
          \ MEIOB, and HFM1, in patients with \nandrogenetic HMs"
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39545410
      reference_title: Defects in meiosis I contribute to the genesis of androgenetic hydatidiform moles.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Places the maternal meiosis-I genes, HFM1 among them, upstream of this node: biallelic
        variants in them were found in patients whose moles were androgenetic, which is the genomic state
        this node describes. HFM1 is bound here as the gene anchor for that set.'
