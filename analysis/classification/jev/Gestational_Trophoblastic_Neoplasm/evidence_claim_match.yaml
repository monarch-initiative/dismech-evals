      assertion_type: Subtype
      assertion:
        name: Choriocarcinoma
        display_name: Gestational Choriocarcinoma
        subtype_term:
          preferred_term: Gestational Choriocarcinoma
          term:
            id: NCIT:C2948
            label: Choriocarcinoma
        description: 'Gestational choriocarcinoma is a highly malignant, rapidly metastasizing epithelial
          tumor composed of dimorphic neoplastic cytotrophoblast and syncytiotrophoblast without chorionic
          villi. It can follow any gestation (about half follow a complete mole, the remainder follow
          abortion, ectopic, or term pregnancy), secretes high levels of hCG, and has a strong propensity
          for hematogenous spread to lung, brain, and liver. Despite its aggressiveness it is highly chemosensitive
          and curable.

          Cross-reference: choriocarcinoma is also curated as a standalone dismech entry, `Choriocarcinoma`
          (MONDO:0005207), which is the authoritative model for its pathophysiology, histopathology, hCG
          biomarker and treatment algorithm, and which additionally covers the non-gestational (germ cell)
          form that falls outside the GTN spectrum. This subtype stub is retained because gestational
          choriocarcinoma genuinely is a member of the GTN spectrum; consult the standalone entry rather
          than expanding the model here. Whether the two are better expressed as a `Grouping` over the
          GTN member entries is an open nosological question flagged for curator adjudication.'
      selected_evidence:
        snippet: "Gestational choriocarcinoma is usually a rapidly spreading fatal disease, but it \n\
          is curable if diagnosed early and treated."
        supports: SUPPORT
