        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Why does Tbxas1 loss produce osteosclerosis and marrow failure in humans but not in the
          knockout mouse, which reproduces the prostaglandin shunt?

          '
        attaches_to:
        - pathophysiology#Bone Marrow Fibrosis and Failure of Hematopoiesis
        - pathophysiology#Diaphyseal Endosteal Hyperostosis With Medullary Narrowing
        rationale: 'The mouse shows the shunt but not its proposed consequences, so either the shunt is
          not sufficient, the mouse eicosanoid-bone coupling differs, or the phenotype needs time, stress
          or a second factor absent in the mouse. Until this is resolved, the edges from the shunt and
          the RANKL/OPG change to the bone and marrow phenotypes rest on human therapeutic response and
          cultured osteoblasts.

          '
      selected_evidence:
        snippet: moreover the mouse model do not show increased bone density, myelophthisic anemia, leukopenia
          and thrombocytopenia
        supports: SUPPORT
