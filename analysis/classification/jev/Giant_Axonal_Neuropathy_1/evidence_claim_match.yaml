      - /disease_term
    evidence_metadata:
      reference: PMID:34114613
      reference_title: 'Giant axonal neuropathy: cross-sectional analysis of a large natural history cohort.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes in a human cohort that central nervous system involvement is a distinct
        feature of the disease course, not merely a description of the peripheral neuropathy.
