          and later-onset and slower-progressing than the classic phenotype. Identified as a distinct
          subcohort in the largest reported natural history cohort. Same genetic mechanism as classic
          GAN — biallelic GAN loss of function — so this is a phenotypic, not a mechanistic, division.'
      selected_evidence:
        snippet: At the milder end of the spectrum are predominantly motor and sensory neuropathies (with
