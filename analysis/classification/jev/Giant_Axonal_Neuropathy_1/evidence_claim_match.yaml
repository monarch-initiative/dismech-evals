  c952a0a41115aa8c2974ea12d1cb60a24814fa88a50496c141fca17269286cb6:
    claim:
      about:
        disease:
          name: Giant Axonal Neuropathy 1
          disease_term:
            preferred_term: giant axonal neuropathy 1
            term:
              id: MONDO:0009749
              label: giant axonal neuropathy 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autophagy-Lysosome Failure
        biological_scale: CELLULAR
        description: 'A secondary, feed-forward consequence of the accumulation rather than a parallel
          cause of it. Neurofilament accumulations disrupt autophagy by two distinct routes: they interfere
          with the distribution of autophagic organelles, impairing maturation and fusion with lysosomes;
          and they sequester the chaperone 14-3-3, which is required for correct localization of the master
          autophagy regulator TFEB. Because degradative capacity is itself degraded, the arm feeds back
          onto the accumulation that produced it.'
        biological_processes:
        - preferred_term: autophagosome-lysosome fusion
          modifier: DECREASED
          term:
            id: GO:0061909
            label: autophagosome-lysosome fusion
        notes: 'Direction matters here and is easy to invert: this is neurofilament accumulation causing
          autophagy failure, not a primary autophagy defect causing accumulation. The entry does not conform
          this node to loss_of_proteostasis#Misfolded-Protein Aggregation, because GAN aggregation is
          failure of regulated degradation of correctly folded intermediate filaments rather than misfolding.'
      selected_evidence:
        snippet: First, neurofilament accumulations interfere with the distribution of autophagic organelles,
          impairing their maturation and fusion with lysosomes. Second, the accumulations attract the
          chaperone 14-3-3, which is responsible for the proper localization of the key autophagy regulator
          transcription factor EB (TFEB).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40059823
      reference_title: Neurofilament accumulation disrupts autophagy in giant axonal neuropathy.
      evidence_source: MODEL_ORGANISM
      explanation: Names both routes and, critically, their direction - the accumulations act on autophagy,
        not the reverse.
