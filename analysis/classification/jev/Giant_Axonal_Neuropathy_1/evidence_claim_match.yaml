          value:
            name: GAN A49E knock-in mouse
            species: Mouse
            genotype: GAN A49E/A49E knock-in
            publication: PMID:41402936
            description: A knock-in of a disease-causing GAN missense mutation rather than a gene deletion.
              Unlike the earlier knockout strains it produces an overt phenotype - early sensory-motor
              deficits and ataxia, giant axons, demyelination, and the neurofilament compaction and disorganization
              seen in patients - making it the first rodent model to reproduce the histological hallmarks.
              It also reveals neuromuscular junction and muscle involvement, and a sex bias with females
              more severely affected that has no established human counterpart.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Giant Axon Formation
        relationship: RECAPITULATES
        fidelity: HIGH
        description: Reproduces the pathognomonic lesion - giant axons with compacted, disorganized neurofilaments
          - which the knockout strains do not.
        limitations: Carries one specific missense allele (A49E), so it models the dominant mechanism
          of gigaxonin protein instability rather than the full mutational spectrum. The female-biased
          severity has no established human counterpart.
        readouts:
        - name: Giant axons and neurofilament compaction across the nervous system
          target: Giant Axon Formation
          direction: INCREASED
          interpretation: Presence of the human histological hallmark, absent from prior knockout models,
            is what makes this strain informative for this node.
      selected_evidence:
        snippet: Altogether, the GANA49E strain provides the first robust rodent model for GAN, recapitulating
          the symptoms and histological hallmarks of the human pathology.
        supports: SUPPORT
