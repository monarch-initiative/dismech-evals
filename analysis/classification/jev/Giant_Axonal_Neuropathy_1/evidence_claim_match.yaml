        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Intermediate Filament Degradation
        biological_scale: MOLECULAR
        description: Without gigaxonin-directed ubiquitination, intermediate filament proteins escape
          proteasomal turnover. Gigaxonin controls degradation of the entire intermediate filament family
          — vimentin in fibroblasts, and peripherin and neurofilament proteins in neurons — and proteasome
          inhibition reverses the clearance produced by gigaxonin overexpression, placing the defect in
          the ubiquitin-proteasome pathway.
        biological_processes:
        - preferred_term: proteasomal degradation of intermediate filament proteins
          modifier: DECREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
        - preferred_term: protein polyubiquitination of intermediate filament substrates
          modifier: DECREASED
          term:
            id: GO:0000209
            label: protein polyubiquitination
      selected_evidence:
        snippet: Using fibroblasts from patients and normal individuals, as well as Gan-/- mice, we demonstrated
          that gigaxonin was responsible for the degradation of vimentin IFs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
