  dd55e43b4cb57180f55701527a7b8af1b029b4b4e70b1d960eae19d1a536f9d0:
    claim:
      about:
        disease:
          name: Giant Axonal Neuropathy 1
          disease_term:
            preferred_term: giant axonal neuropathy 1
            term:
