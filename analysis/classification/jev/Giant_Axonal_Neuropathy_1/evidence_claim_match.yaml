      assertion_type: Discussion
      assertion:
        discussion_id: gan_knockout_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the preclinical evidence base for GAN - built largely on Gan-knockout mice that lack
          giant axons and neurofilament compaction - support inference about the human disease, and does
          the A49E knock-in change what earlier knockout results can be taken to show?
        attaches_to:
        - pathophysiology#Giant Axon Formation
        rationale: 'The gene-transfer work that supported the first-in-human trial was performed largely
          in knockout strains now reported to lack the two defining human lesions. That is a translational-validity
          question rather than a gap in evidence: the mouse results exist and are internally sound, but
          the model was missing the pathology the therapy is meant to reverse. The A49E knock-in reproduces
          those lesions and so offers a way to test whether the earlier conclusions hold. Its female-biased
          severity has no established human counterpart and should not be carried into human claims.'
        proposed_experiments:
        - experiment_id: gan_a49e_gene_transfer_replication
          name: Replicate intrathecal AAV9 GAN gene transfer in the A49E knock-in
          description: Repeat the preclinical intrathecal scAAV9/JeT-GAN dosing in GAN A49E/A49E mice
            and score giant axon burden and neurofilament compaction - endpoints unavailable in the knockout
            strains - alongside the rotarod and nerve ultrastructure measures used originally, powered
            to detect the reported sex difference.
      selected_evidence:
        snippet: Unlike previous GAN knock-out mice which show no overt phenotype, GANA49E/A49E mice exhibit
          early sensory-motor deficits and ataxia
        supports: SUPPORT
