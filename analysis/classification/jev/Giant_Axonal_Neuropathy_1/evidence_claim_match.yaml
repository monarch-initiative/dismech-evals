    claim:
      about:
        disease:
          name: Giant Axonal Neuropathy 1
          disease_term:
            preferred_term: giant axonal neuropathy 1
            term:
              id: MONDO:0009749
              label: giant axonal neuropathy 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Central Nervous System Degeneration
        biological_scale: TISSUE
        description: The central arm of the disease, parallel to peripheral axonal degeneration rather
          than downstream of it. Intermediate filament aggregation in central neurons and in astrocytes
          (where GFAP is the accumulating filament) is accompanied by inclusion bodies in brain, neuroinflammation,
          and loss of cortical and spinal neurons, and appears radiologically as periventricular and cerebellar
          white-matter T2 hyperintensity. This is the route by which cerebellar signs, pyramidal signs
          and cognitive decline arise; they are not consequences of distal peripheral axon loss.
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: neuronal apoptosis in cortex and spinal cord
          modifier: INCREASED
          term:
            id: GO:0051402
            label: neuron apoptotic process
        notes: How much of the central disease is attributable to intermediate filament disorganization
          specifically is not settled - the model-organism source states only that IF disorganization
          "can drive some neurodegenerative changes", and gigaxonin has substrates beyond intermediate
          filaments. The edge is curated as DIRECT on the strength of the human CNS involvement and the
          brain inclusion pathology, not as a claim that IF aggregation is the sole cause.
      selected_evidence:
        snippet: presents as a prominent sensorimotor neuropathy and commonly progresses to affect both
          the PNS and CNS
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
