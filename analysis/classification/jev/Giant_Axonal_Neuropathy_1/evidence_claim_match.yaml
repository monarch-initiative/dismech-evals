      assertion_type: Pathophysiology
      assertion:
        name: Gigaxonin Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic loss-of-function variants in GAN (16q23.2) abolish functional gigaxonin,
          the substrate-specific adaptor that recruits intermediate filament proteins to a cullin-3 ubiquitin
          ligase complex. Gigaxonin is a ubiquitously expressed, low-abundance protein composed of an
          N-terminal BTB domain followed by six kelch repeats.
        molecular_functions:
        - preferred_term: gigaxonin substrate-adaptor activity in a cullin-3 ubiquitin ligase complex
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0031625
            label: ubiquitin protein ligase binding
        genes:
        - preferred_term: GAN
          term:
            id: hgnc:4137
            label: GAN
      selected_evidence:
        snippet: Gigaxonin is composed of an amino-terminal BTB (for Broad-Complex, Tramtrack and Bric
          a brac) domain followed by a six kelch repeats, which are predicted to adopt a beta-propeller
          shape.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11062483
      reference_title: The gene encoding gigaxonin, a new member of the cytoskeletal BTB/kelch repeat
        family, is mutated in giant axonal neuropathy.
      evidence_source: HUMAN_CLINICAL
      explanation: The gene-discovery paper establishes the domain architecture of gigaxonin that underlies
