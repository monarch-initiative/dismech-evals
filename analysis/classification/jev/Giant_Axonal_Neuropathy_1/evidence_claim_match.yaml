            term:
              id: MONDO:0009749
              label: giant axonal neuropathy 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intermediate Filament Transport Failure
        biological_scale: CELLULAR
        description: Beyond failed degradation, loss of gigaxonin dramatically inhibits kinesin-1-driven
          transport of intermediate filaments along microtubules. The defect is selective — other kinesin-1
          cargoes apart from mitochondria move normally — and forcing kinesin-1 to bind filaments directly
          rescues their distribution, which places transport failure upstream of the abnormal distribution
          rather than downstream of it. A more than 20-fold rise in soluble vimentin oligomers accompanies
          the block.
        biological_processes:
        - preferred_term: kinesin-1-driven microtubule-based transport of intermediate filaments
          modifier: DECREASED
          term:
            id: GO:0099111
            label: microtubule-based transport
        notes: Curated as a parallel arm to failed degradation rather than a consequence of it. The authors'
          own proposed mechanism is that excess soluble vimentin oligomers saturate an unidentified kinesin-1
          adapter, which would make this arm downstream of the degradation defect; that linkage is explicitly
          speculative in the source and is not asserted here.
      selected_evidence:
        snippet: We have demonstrated that the loss of gigaxonin dramatically inhibited transport of IFs
          along microtubules by the microtubule motor kinesin-1. This inhibition was specific for IFs,
          as other kinesin-1 cargoes, with the exception of mitochondria, were transported normally.
        supports: SUPPORT
