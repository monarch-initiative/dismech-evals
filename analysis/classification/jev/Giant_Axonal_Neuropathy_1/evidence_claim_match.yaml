      assertion_type: Discussion
      assertion:
        discussion_id: gan_precocious_puberty_mechanism
        kind: KNOWLEDGE_GAP
        prompt: What causes the precocious puberty reported in roughly a quarter of the GAN natural history
          cohort - is it central (hypothalamic-pituitary, part of the CNS arm) or peripheral in origin?
        attaches_to:
        - phenotypes#Precocious puberty
        rationale: The natural history study reports precocious puberty in 11 of 45 individuals but does
          not localize its origin, and no cited source establishes a mechanism. Distinguishing a central
          origin - which would tie the phenotype to the central nervous system degeneration arm - from
          a peripheral one matters for whether it belongs downstream of the central pathology. The entry
          deliberately leaves this phenotype without a causal edge rather than asserting a speculative
          hypothalamic route.
      selected_evidence:
        snippet: 'Other commonly reported signs and symptoms reported in this GAN cohort include: reduced
          visual acuity (22/45; 49%), dysarthria (19/45; 42%), urinary abnormalities (hesitancy or incontinence)
          (13/45; 28%), precocious puberty (11/45; 24%)'
        supports: SUPPORT
