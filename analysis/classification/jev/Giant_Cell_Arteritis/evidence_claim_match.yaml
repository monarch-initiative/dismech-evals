  e702072098374a646f0dfcd9f5976f9c78af042a3bd90668d9ad57a888fa4d69:
    claim:
      about:
        disease:
          name: Giant Cell Arteritis
          disease_term:
            preferred_term: Giant Cell Arteritis
            term:
              id: MONDO:0008538
              label: temporal arteritis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Giant Cell Formation and Intimal Hyperplasia
        description: Multinucleated giant cells form at the media-intima junction. Smooth muscle cells
          proliferate causing intimal hyperplasia, leading to vessel stenosis and ischemic complications.
        cell_types:
        - preferred_term: Smooth Muscle Cell
          term:
            id: CL:0000192
            label: smooth muscle cell
        biological_processes:
        - preferred_term: Cell Proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: Due to the failure of the immuno-inhibitory PD-1 (programmed cell death protein 1)/PD-L1
          (programmed cell death ligand 1) pathway, wall-infiltrating immune cells arrive in a permissive
          tissues microenvironment, where multiple T cell effector lineages thrive, shift toward high
          glycolytic activity, and support the development of tissue-damaging macrophages, including multinucleated
          giant cells (Checkpoint 3).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36656970
      reference_title: Immunology of Giant Cell Arteritis.
      explanation: This describes the immune checkpoint failure that allows multinucleated giant cells
        to form in the vessel wall through unchecked macrophage activation.
