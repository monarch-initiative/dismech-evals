      assertion_type: Pathophysiology
      assertion:
        name: Th1 and Th17 T Cell Infiltration
        description: CD4+ T cells infiltrate the arterial wall and produce IFN-gamma (Th1) and IL-17 (Th17).
          IFN-gamma activates macrophages and promotes giant cell formation, while IL-17 drives vascular
          inflammation.
        cell_types:
        - preferred_term: CD4+ T Cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: Inflammatory Response
          term:
            id: GO:0006954
            label: inflammatory response
      selected_evidence:
        snippet: Loss of self-tolerance in the adaptive immune system is linked to aberrant signaling
          in the NOTCH pathway, leading to expansion of NOTCH1+CD4+ T cells and the functional decline
          of NOTCH4+ T regulatory cells (Checkpoint 1).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36656970
      reference_title: Immunology of Giant Cell Arteritis.
      explanation: This evidence describes the checkpoint mechanism by which CD4+ T cells become dysregulated
        through NOTCH signaling, enabling their pathogenic infiltration into the arterial wall.
