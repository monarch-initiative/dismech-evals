      assertion:
        name: LV-GCA
        display_name: Large-Vessel Giant Cell Arteritis (LV-GCA)
        description: Predominant large-vessel phenotype with constitutional symptoms, polymyalgia rheumatica,
          and involvement of the aorta and its major branches. Patients are generally younger, have longer
          diagnostic delay, and lower rates of positive temporal artery biopsy.
      selected_evidence:
        snippet: Fewer LV-GCA patients presented with cranial manifestations and only 53% met the 1990
          ACR Classification Criteria for GCA.
        supports: SUPPORT
