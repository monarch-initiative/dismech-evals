      assertion_type: Pathophysiology
      assertion:
        name: Dendritic Cell Activation in Vessel Wall
        description: Adventitial dendritic cells become activated and produce chemokines that recruit
          T cells and macrophages. Vascular dendritic cells may sense pathogen-associated or damage-associated
          molecular patterns.
        cell_types:
        - preferred_term: Dendritic Cell
          term:
            id: CL:0000451
            label: dendritic cell
        biological_processes:
        - preferred_term: Immune Response
          term:
            id: GO:0006955
            label: immune response
      selected_evidence:
        snippet: Once activated, dendritic cells recruit CD4 T cells and induce their activation, proliferation
          and polarization into Th1 and Th17, which produce interferon-gamma (IFN-γ) and interleukin-17
          (IL-17), respectively.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35629030
      reference_title: 'New Insights into the Pathogenesis of Giant Cell Arteritis: Mechanisms Involved
        in Maintaining Vascular Inflammation.'
      explanation: This evidence confirms that dendritic cells are key initiators of the immune response
        in GCA, recruiting and activating CD4 T cells in the vessel wall.
