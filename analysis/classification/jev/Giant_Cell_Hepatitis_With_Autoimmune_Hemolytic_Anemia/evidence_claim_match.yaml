            term:
              id: MONDO:1060166
              label: giant cell hepatitis with autoimmune hemolytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Systemic B-cell autoimmunity
        description: 'The syndrome is best supported as a systemic humoral autoimmune disorder: Coombs-positive
          hemolysis distinguishes it from early-onset autoimmune hepatitis, and liver injury responds
          in many refractory cases to B-cell depletion.'
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: immunoglobulin mediated immune response
          modifier: ABNORMAL
          term:
            id: GO:0016064
            label: immunoglobulin mediated immune response
      selected_evidence:
        snippet: Widespread complement-mediated hepatocyte injury and typical C3a and C5a complement-driven
          liver inflammation along with Coombs-positive hemolytic anemia in GCH-AHA provide convincing
          evidence that systemic B-cell autoimmunity plays a central pathologic mechanism in the disease.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23969541
      reference_title: Humoral immune mechanism of liver injury in giant cell hepatitis with autoimmune
        hemolytic anemia.
      evidence_source: HUMAN_CLINICAL
      explanation: This mechanistic case series directly identifies systemic B-cell autoimmunity as central
        to GCH-AHA.
