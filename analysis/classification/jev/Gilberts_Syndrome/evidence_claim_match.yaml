      assertion_type: Genetic
      assertion:
        name: G6PD
        gene_term:
          preferred_term: G6PD
          term:
            id: hgnc:4057
            label: G6PD
        association: Modifier
        relationship_type: MODIFIER
        notes: G6PD deficiency raises bilirubin production through haemolysis while the Gilbert genotype
          lowers clearance, so the two act on opposite sides of the same balance and co-inheritance produces
          hyperbilirubinemia neither explains alone. This is the combination that matters in the neonatal
          period, where the conjugating system is immature and bilirubin neurotoxicity is possible - the
          one setting where Gilbert syndrome is not benign. The size of the interaction is not established;
          see discussions#gs_neonatal_cofactor_risk.
      selected_evidence:
        snippet: The results showed that in certain cases, the presence of hyperbilirubinemia is not only
          associated with G6PD deficiency, but may be caused by the co-presence of a mutation in the UGTA1
          promoter related to Gilbert's syndrome.
        supports: SUPPORT
