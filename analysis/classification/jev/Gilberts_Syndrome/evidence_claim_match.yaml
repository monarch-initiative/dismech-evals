  1d5394a1a252ff2abe1842d186f280f5290e8864a345c13141670a104f3d5aba:
    claim:
      about:
        disease:
          name: Gilbert's Syndrome
          disease_term:
            preferred_term: Gilbert's syndrome
            term:
              id: MONDO:0007745
              label: Gilbert syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Glucuronidation of Drugs and Drug Metabolites
        description: 'UGT1A1 is not a bilirubin-specific enzyme. The same reduced transcription that lowers
          bilirubin conjugation also lowers glucuronidation of xenobiotic substrates that UGT1A1 handles,
          most importantly SN-38, the active metabolite of irinotecan. Reduced SN-38 glucuronidation raises
          systemic SN-38 exposure and the risk of severe neutropenia and diarrhoea. The reciprocal interaction
          also occurs: drugs that inhibit UGT1A1 - notably the HIV protease inhibitors atazanavir and
          indinavir - unmask the reduced reserve capacity and precipitate overt hyperbilirubinemia, while
          the UGT1A1 inducer efavirenz lowers bilirubin. This node is the pharmacogenomic arm of the same
          enzymatic lesion that produces the bilirubin phenotype, and it is the arm with the clearest
          clinical consequence.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        molecular_functions:
        - preferred_term: glucuronosyltransferase activity
          modifier: DECREASED
          term:
            id: GO:0015020
            label: glucuronosyltransferase activity
      selected_evidence:
        snippet: screening for UGT1A1*28 polymorphism may identify patients with lower SN-38 glucuronidation
          rates and greater susceptibility to irinotecan induced gastrointestinal and bone marrow toxicity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
