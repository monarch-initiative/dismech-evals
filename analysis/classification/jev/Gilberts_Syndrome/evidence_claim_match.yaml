        name: UGT1A1 Genotyping Prior to Irinotecan Therapy
        description: Carriers of UGT1A1*28 (and UGT1A1*6 in Asian patients) have significantly reduced
          capacity to glucuronidate SN-38, the active metabolite of irinotecan. This leads to increased
          SN-38 exposure and greater susceptibility to irinotecan-induced severe neutropenia and diarrhoea.
          Genetic testing before initiating irinotecan is classified as 'essential' by international pharmacogenomics
          guidelines. Poor metabolisers (homozygous or compound heterozygous) should receive a 70% starting
          dose.
        treatment_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: screening for UGT1A1*28 polymorphism may identify patients with lower SN-38 glucuronidation
          rates and greater susceptibility to irinotecan induced gastrointestinal and bone marrow toxicity.
        supports: SUPPORT
