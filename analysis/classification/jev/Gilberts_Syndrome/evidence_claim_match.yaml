            term:
              id: MONDO:0007745
              label: Gilbert syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bilirubin Antioxidant and Pleiotropic Effects
        description: Unconjugated bilirubin is a potent lipid-soluble antioxidant that scavenges peroxyl
          radicals in vitro at physiologically relevant oxygen concentrations. Observational epidemiological
          studies have reported inverse associations between serum bilirubin and cardiovascular disease
          risk, leading to hypotheses of systemic protection in Gilbert's syndrome carriers. However,
          Mendelian randomization studies using the UGT1A1*28 locus as an instrument for genetically raised
          bilirubin find no causal cardiovascular benefit, suggesting the observational associations are
          confounded. The clinical significance of bilirubin's antioxidant capacity in vivo thus remains
          debated.
      selected_evidence:
        snippet: Serum bilirubin has been shown to be inversely related to cardiovascular disease (CVD)
          in both retrospective and prospective studies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
