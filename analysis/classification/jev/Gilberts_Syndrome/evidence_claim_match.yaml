      assertion:
        name: Fatigue
        category: Clinical
        frequency: OCCASIONAL
        description: Non-specific fatigue, recorded in 1,401 of 9,240 Gilbert syndrome cases (15%) against
          12,581 of 150,846 controls (8%) in UK primary care. Long treated as a patient-reported complaint
          without an established relationship to bilirubin, it was one of only two features (with abdominal
          pain) that the same analysis found consistently more common up to five years before diagnosis,
          rather than only in the year of workup. That temporal pattern argues against it being purely
          an artefact of being investigated. The recorded rate differs by sex - 22% of female cases against
          12% of male cases - so the single band here averages over a real difference. Whether bilirubin
          causes it remains open - see discussions#gs_symptom_attribution.
        phenotype_term:
          preferred_term: Fatigue
          term:
            id: HP:0012378
            label: Fatigue
      selected_evidence:
        snippet: While most of these features appeared primarily in the year prior to diagnosis, only
          abdominal pain and fatigue were consistently more common in GS cases up to five years before
          diagnosis.
