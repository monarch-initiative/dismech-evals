              precipitates with calcium as pigment stone nidus. This is the one downstream consequence
              of the Gilbert genotype for which a causal, rather than merely associative, link to a clinical
              illness has been demonstrated. In a UK Biobank analysis of 138,125 participants with apparently
              healthy livers, cholelithiasis was the only illness out of 54 assessed whose raised prevalence
              in Gilbert syndrome survived adjustment for confounders and was confirmed by Mendelian randomization.
              The effect is much larger where bilirubin production is also increased: in sickle cell anemia,
              the UGT1A1 promoter genotype raises gallstone frequency and brings forward age at onset.'
