  1fc0eb4d4e63af446b646782a0c03aeb5b45a1d7660acd98bac5dd2fecb469a0:
    claim:
      about:
        disease:
          name: Gilbert's Syndrome
          disease_term:
            preferred_term: Gilbert's syndrome
            term:
              id: MONDO:0007745
              label: Gilbert syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
        conforms_to: bilirubin_conjugation_transport#UGT1A1-Dependent Bilirubin Glucuronidation Deficiency
        description: The UGT1A1 enzyme in hepatocytes conjugates unconjugated (indirect) bilirubin with
          glucuronic acid, making it water-soluble for biliary excretion. In Gilbert's syndrome, reduced
          UGT1A1 activity (approximately 30% of normal) leads to accumulation of unconjugated bilirubin
          in the blood. The most common cause in Western populations is a homozygous (TA)7TAA repeat (UGT1A1*28
          allele) in the TATAA box of the UGT1A1 promoter, which reduces transcription. In Asian populations,
          missense variants in the UGT1A1 coding region (e.g., Gly71Arg / UGT1A1*6) are more prevalent.
          Gilbert's syndrome is the most prevalent (2-19% in population studies) and mildest of the hereditary
          unconjugated hyperbilirubinaemia syndromes.
        genes:
        - preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: Bilirubin conjugation
          modifier: DECREASED
          term:
            id: GO:0006789
            label: bilirubin conjugation
        chemical_entities:
        - preferred_term: unconjugated bilirubin
          term:
            id: CHEBI:16990
            label: bilirubin IXalpha
          modifier: INCREASED
        molecular_functions:
        - preferred_term: glucuronosyltransferase activity
          modifier: DECREASED
          term:
            id: GO:0015020
            label: glucuronosyltransferase activity
      selected_evidence:
        snippet: Hepatic glucuronidating activity, essential for efficient biliary excretion of bilirubin,
          is reduced to about 30 percent of normal.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7565971
      reference_title: The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase
        1 in Gilbert's syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The Bosma 1995 NEJM paper demonstrates that UGT1A1 enzyme activity is substantially
        reduced in Gilbert's syndrome, confirming the enzymatic basis of the condition.
    first_seen_at: '2026-10-03T21:51:42.639822+00:00'
