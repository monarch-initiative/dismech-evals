    evidence_metadata:
      reference: PMID:18343383
      reference_title: 'Gilbert syndrome, UGT1A1*28 allele, and cardiovascular disease risk: possible
        protective effects and therapeutic applications of bilirubin.'
      evidence_source: OTHER
      explanation: Observational data are consistent with CVD protection, but causality remains unproven;
        hence PARTIAL support only.
