  45b304a076ac1451b79943115c90fd38f273c78c557896c25c3b98b3008c3b4c:
    claim:
      about:
        disease:
          name: Gilbert's Syndrome
          disease_term:
            preferred_term: Gilbert's syndrome
            term:
              id: MONDO:0007745
              label: Gilbert syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gs_neonatal_cofactor_risk
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How much does the Gilbert genotype add to neonatal hyperbilirubinemia risk when co-inherited
          with a bilirubin-production disorder such as G6PD deficiency, and is that increment large enough
          to screen for?
        attaches_to:
        - pathophysiology#Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
        rationale: 'Gilbert syndrome is benign in adults, so this entry treats it as benign throughout.
          The neonatal period is the exception the entry does not currently model: a newborn has an immature
          conjugating system already, and the same reduced-capacity allele sits upstream of the one bilirubin
          outcome that is genuinely dangerous. Published studies point the same way but do not agree on
          effect size, and the studies are small. The neonatal series in G6PD-deficient infants below
          reports increased hyperbilirubinemia with the promoter variant while stating the interaction
          is more complex than a two-locus model. This entry deliberately does not assert a neonatal risk
          figure because the literature does not support one yet.'
        proposed_experiments:
        - experiment_id: exp_gs_neonatal_ugt1a1_g6pd_interaction
          name: Powered newborn cohort for the UGT1A1 x G6PD interaction
          description: Prospective multi-ancestry newborn cohort genotyping UGT1A1 promoter repeat number
            and G6PD together, powered for the interaction term rather than for either main effect, with
            reaching the phototherapy threshold as the endpoint. Existing studies are small single-population
            series that can detect the main effects but not the interaction, which is the quantity that
            would decide whether combined screening is worthwhile.
          would_support:
          - pathophysiology#Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
          supporting_outcome:
          - A significant UGT1A1-by-G6PD interaction term on the phototherapy threshold endpoint, of a
            size that changes the number needed to screen.
          refuting_outcome:
          - No interaction beyond the additive contribution of each locus, indicating that genotyping
            UGT1A1 adds nothing to G6PD screening alone.
      selected_evidence:
        snippet: the interaction between G6PD deficiency, UGT1A1 promoter polymorphism, and NHB is more
          complex, possibly involving other genetic interactions, not yet described.
        supports: SUPPORT
