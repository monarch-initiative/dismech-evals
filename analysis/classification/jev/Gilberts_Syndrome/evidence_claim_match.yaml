      assertion_type: Diagnosis
      assertion:
        name: UGT1A1 promoter (TA)n genotyping
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: 'Sizing the TATA-box TA repeat, with coding-region sequencing where an East Asian
          ancestry or a discordant result suggests UGT1A1*6. Genotyping confirms rather than establishes
          the diagnosis: roughly 10-13% of Western populations are UGT1A1*28 homozygotes while clinically
          recognised Gilbert syndrome is far less common, so a positive genotype in the absence of hyperbilirubinemia
          does not make the diagnosis. An assay that scores only (TA)6 against (TA)7 will misclassify
          carriers of the (TA)5 and (TA)8 alleles found in African populations.'
      selected_evidence:
        snippet: We present a real time PCR method for genotyping the UGT1A1 (TA)n polymorphism (UGT1A1*28,
          UGT1A1*36, UGT1A1*37) using Taqman PCR.
        supports: SUPPORT
