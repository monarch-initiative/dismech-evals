        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: INCOMPLETE
        description: 'UGT1A1*28 homozygosity segregates recessively with the Gilbert phenotype, but it
          is necessary rather than sufficient: many homozygotes never reach a hyperbilirubinemic threshold,
          and the biochemical phenotype depends additionally on bilirubin production rate, hepatic uptake,
          sex, and age. The published UGT1A1*28 homozygote frequency in Western populations (roughly 10-13%)
          therefore exceeds the frequency of clinically recognised Gilbert syndrome, and genotype alone
          does not make the diagnosis.'
      selected_evidence:
        snippet: Reduced expression of bilirubin UDP-glucuronosyltransferase 1 due to an abnormality in
          the promoter region of the gene for this enzyme appears to be necessary for Gilbert's syndrome
          but not sufficient for the complete manifestation of the syndrome.
        supports: SUPPORT
