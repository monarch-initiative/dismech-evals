      assertion_type: Genetic
      assertion:
        name: UGT1A1*36 (TA)5 Promoter Allele
        gene_term:
          preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        association: Protective
        relationship_type: PROTECTIVE
        notes: 'The opposite end of the same promoter series: one fewer TA repeat raises UGT1A1 activity
          above wild-type, so this allele lowers bilirubin rather than raising it and works against the
          Gilbert phenotype. It is curated separately from UGT1A1*37 because the two point in opposite
          directions and a single record cannot carry both. Like *37 it occurs mainly in African populations,
          at frequencies up to 0.08, so a (TA)6-versus-(TA)7 assay misclassifies African-ancestry individuals
          in both directions - calling some higher-activity carriers wild-type and missing the lower-activity
          ones entirely.'
      selected_evidence:
        snippet: A variant lacking one TA repeat (TA)5 (UGT1A1*36) has been identified. (TA)8 repeats
          (UGT1A1*37) and (TA)5 (UGT1A1*36) have been detected in Africans (frequency up to 0.07 and 0.08
          respectively).
        supports: SUPPORT
