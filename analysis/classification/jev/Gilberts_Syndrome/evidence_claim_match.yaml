            label: UGT1A1
        description: 'The Gunn rat lacks UGT1A1 entirely and is the standard rodent model of inherited
          unconjugated hyperbilirubinemia. It is included here because it is the model system in which
          the bilirubin-conjugation lesion has been studied mechanistically, but its fidelity to Gilbert
          syndrome specifically is low: Gilbert syndrome is a partial (roughly 30% of normal) reduction
          in a regulated promoter, whereas the Gunn rat is a complete enzymatic null. The Gunn rat therefore
          models Crigler-Najjar type I, including bilirubin encephalopathy, which does not occur in Gilbert
          syndrome.'
        publication: PMID:33027804
        modeled_mechanisms:
        - target: Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Reproduces the enzymatic lesion (absent bilirubin glucuronidation) and the resulting
            unconjugated hyperbilirubinemia, but not its degree, regulation, or clinical consequences
            in Gilbert syndrome.
          limitations: Complete UGT1A1 absence rather than the partial promoter-driven reduction that
            defines Gilbert syndrome; the resulting bilirubin levels are in the Crigler-Najjar type I
            range and produce cerebellar bilirubin neurotoxicity that Gilbert syndrome never causes. The
            model also cannot represent the TA-repeat promoter mechanism itself, which is the actual human
            lesion.
          readouts:
          - name: Cerebellar weight and cerebellar-mediated behaviour after induced hyperbilirubinemia
            target: Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
            direction: DECREASED
            interpretation: Structural and behavioural consequence of unconjugated bilirubin accumulation
              in the UGT1A1-null rat. Reported here as a model readout; it has no counterpart in human
              Gilbert syndrome.
        notes: Both available rodent models sit at the severe, Crigler-Najjar end of the UGT1A1-deficiency
          spectrum rather than the mild Gilbert end; see the corresponding HUMAN_MODEL_MISMATCH discussion.
      selected_evidence:
        snippet: The homozygous Gunn rat lacks uridine diphosphate glucuronosyltransferase 1A1 (UGT1A1),
          the enzyme needed to biotransform bilirubin. This rodent model of hyperbilirubinemia emulates
          many aspects of bilirubin toxicity observed in the human infant.
        supports: SUPPORT
