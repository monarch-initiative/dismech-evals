        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: Gilbert syndrome diagnosed as total bilirubin at or above 1 mg/dL (17.1 micromol/L)
          with normal ALT and GGT and no hemolysis. This is the cutoff in long-standing clinical use and
          the one most laboratories report against. It is recorded here because it is what most published
          prevalence figures and most patients' diagnoses rest on, not because it is the better definition.
        validation_status:
          status: UNVALIDATED
          rationale: In wide clinical use but never validated against a genotype-anchored gold standard;
            a single unisex threshold is applied to an analyte whose distribution differs by sex, age,
            and UGT1A1 genotype.
        inclusion_criteria:
        - preferred_term: Raised total bilirubin
          description: Total bilirubin at or above 1 mg/dL (17.1 micromol/L).
        - preferred_term: Normal liver enzymes
          description: Alanine aminotransferase and gamma-glutamyl transpeptidase within reference limits.
        - preferred_term: Absence of haemolysis
          description: No laboratory or clinical evidence of a haemolytic process.
      selected_evidence:
        snippet: Historically, bilirubin ≥1 mg/dl (17.1 μmol/L) has been the standard cutoff for GS.
        supports: SUPPORT
