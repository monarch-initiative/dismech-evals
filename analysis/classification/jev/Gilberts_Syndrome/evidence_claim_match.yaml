              label: Gilbert syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Phenobarbital Enzyme Induction
        description: 'Phenobarbital induces UGT1A1 transcription and lowers unconjugated bilirubin. It
          is not indicated in Gilbert syndrome, which needs no bilirubin-lowering treatment, and is recorded
          here for two reasons: the bilirubin fall on phenobarbital is a classical discriminator against
          Crigler-Najjar type I, which does not respond; and it is the clearest demonstration that the
          Gilbert lesion is reduced transcription of an inducible gene rather than a fixed absence of
          enzyme. Sedation makes it unsuitable as a cosmetic treatment for a benign condition.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: phenobarbital
            term:
              id: CHEBI:8069
              label: phenobarbital
      selected_evidence:
        snippet: Crigler-Najjar type II syndrome which is treatable with phenobarbital therapy is associated
          with less dramatic missense mutations or heterozygous expression of mutant and normal alleles.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
