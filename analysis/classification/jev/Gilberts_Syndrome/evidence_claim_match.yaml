  546185b709900da3053f57178e571b5259b51216b621b315b8431cbed2c340b3:
    claim:
      about:
        disease:
          name: Gilbert's Syndrome
          disease_term:
            preferred_term: Gilbert's syndrome
            term:
              id: MONDO:0007745
              label: Gilbert syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gs_no_promoter_allele_animal_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: No animal model carries the UGT1A1*28 TA-repeat promoter allele, so is any conclusion
          about Gilbert syndrome drawn from the Gunn rat translationally valid?
        attaches_to:
        - animal_models#Gunn rat (homozygous jj, UGT1A1-null)
        - animal_models#Humanized UGT1 (hUGT1) mouse
        - pathophysiology#Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
        rationale: The longest-established rodent model of inherited unconjugated hyperbilirubinemia,
          the Gunn rat, is a UGT1A1 null. Gilbert syndrome is not a null; it is a roughly 30% residual
          activity produced by a promoter TA insertion that changes transcription rate. The two differ
          in the variable that matters. The Gunn rat's defining outcome, bilirubin encephalopathy, does
          not occur in Gilbert syndrome at all, and the model cannot address the questions Gilbert syndrome
          actually raises - what determines the threshold for clinical expression among genotype-positive
          people, and why penetrance is incomplete. The humanized UGT1 mouse also curated here is closer,
          since it carries human UGT1 regulatory sequence, but its spontaneous phenotype is likewise severe
          neonatal hyperbilirubinemia with neurologic dysfunction. So both available models sit at the
          Crigler-Najjar end of the spectrum, and an allelic series of the promoter repeat on a humanized
          background would be the experiment that resolves this.
        proposed_experiments:
        - experiment_id: exp_gs_humanized_promoter_allelic_series
          name: Humanized UGT1A1 promoter TA-repeat allelic series in mouse
          description: Knock the human UGT1A1 promoter TA-repeat allelic series - (TA)6, (TA)7, and the
            compound genotypes - into a Ugt1a1-humanized mouse, and measure basal unconjugated bilirubin,
            the response to a defined fast, and SN-38 glucuronidation as a function of repeat number.
            The point is to obtain a graded model of a regulated promoter rather than the null the Gunn
            rat provides, so that partial-reduction questions can be asked at all.
          would_support:
          - pathophysiology#Reduced UGT1A1 Activity and Impaired Bilirubin Glucuronidation
          supporting_outcome:
          - Basal bilirubin and fasting response increase monotonically with TA repeat number, and SN-38
            glucuronidation decreases, reproducing the human allele-dose relationship.
          refuting_outcome:
          - Repeat number does not change bilirubin handling in the humanized background, implying the
            human phenotype depends on species-specific regulatory context the model does not supply.
      selected_evidence:
        snippet: Hepatic glucuronidating activity, essential for efficient biliary excretion of bilirubin,
          is reduced to about 30 percent of normal.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7565971
      reference_title: The genetic basis of the reduced expression of bilirubin UDP-glucuronosyltransferase
        1 in Gilbert's syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The human lesion is a partial reduction, which is the quantity the null model cannot
        represent.
