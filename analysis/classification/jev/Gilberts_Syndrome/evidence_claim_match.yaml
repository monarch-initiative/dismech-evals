      assertion_type: Pathophysiology
      assertion:
        name: Fasting- and Stress-Induced Bilirubin Elevation
        description: Bilirubin levels in Gilbert's syndrome fluctuate and are exacerbated by physiological
          stressors such as fasting, dehydration, intercurrent illness, physical exertion, and menstruation.
          Fasting reduces caloric intake and increases fatty acid oxidation, which competes with bilirubin
          for hepatic uptake and conjugation pathways. These triggers can precipitate symptomatic jaundice
          in otherwise mildly affected individuals. A 24-hour fasting test is used diagnostically to provoke
          bilirubin elevation in suspected cases.
        biological_processes:
        - preferred_term: Bilirubin hepatic transport
          modifier: ABNORMAL
          term:
            id: GO:0015723
            label: bilirubin transport
        chemical_entities:
        - preferred_term: unconjugated bilirubin
          term:
            id: CHEBI:16990
            label: bilirubin IXalpha
          modifier: INCREASED
      selected_evidence:
        snippet: 14 volunteers underwent a 24 h fasting test to see if they had Gilbert's syndrome, and
          all four positives had the 7/7 genotype.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8596320
      reference_title: Genetic variation in bilirubin UPD-glucuronosyltransferase gene promoter and Gilbert's
        syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates that fasting precipitates jaundice specifically in homozygous UGT1A1*28
