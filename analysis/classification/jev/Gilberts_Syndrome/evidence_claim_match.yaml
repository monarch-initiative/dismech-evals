      assertion_type: Diagnosis
      assertion:
        name: Fasting provocation test
        description: A 24-48 hour caloric restriction raises unconjugated bilirubin disproportionately
          in Gilbert syndrome, and was historically used to provoke a diagnostic rise. It is largely superseded
          by UGT1A1 genotyping, which is not provocative and not affected by intercurrent illness. Recorded
          because the test is the clinical expression of the fasting-sensitivity mechanism this entry
          models, and because the published diagnostic thresholds derive from cohorts characterised this
          way.
      selected_evidence:
        snippet: 14 volunteers underwent a 24 h fasting test to see if they had Gilbert's syndrome, and
          all four positives had the 7/7 genotype.
        supports: SUPPORT
