      assertion_type: Discussion
      assertion:
        discussion_id: gs_penetrance_modifiers
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: UGT1A1*28 homozygosity is necessary but not sufficient. What supplies the remainder, and
          can it be measured?
        attaches_to:
        - inheritance#Autosomal recessive inheritance with incomplete penetrance
        rationale: Bosma stated in 1995 that the promoter abnormality is necessary but not sufficient,
          and thirty years later this entry still cannot name what supplies the difference. Candidate
          contributions - bilirubin production rate including occult haemolysis, hepatic uptake capacity,
          sex and androgen status, and age - are individually plausible and jointly unquantified. This
          matters practically because roughly 10-13% of Western populations are UGT1A1*28 homozygotes
          while clinically recognised Gilbert syndrome is less common, so a genotype-first diagnosis over-calls,
          and the entry has no modifier to offer in its place.
      selected_evidence:
        snippet: Sex and age are strongly correlated with bilirubin levels in healthy subjects, suggesting
          that appropriate personalized bilirubin levels should be defined.
        supports: SUPPORT
