      assertion_type: Genetic
      assertion:
        name: UGT1A1*37 (TA)8 Promoter Allele
        gene_term:
          preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'An eighth TA repeat reduces glucuronidation further than the (TA)7 UGT1A1*28 allele does,
          so the promoter is a graded series rather than a two-allele switch. UGT1A1*37 occurs mainly
          in African populations, at frequencies up to 0.07, and an assay that scores only (TA)6 against
          (TA)7 will not see it. This matters for irinotecan dosing as well as for diagnosis: the DPWG
          guideline lists UGT1A1*37 alongside *28 and *6 as a deficiency allele. Curated as CAUSATIVE
          rather than MODIFIER because it acts through the same reduced-transcription mechanism as UGT1A1*28,
          more strongly, rather than modifying a phenotype another variant drives.'
      selected_evidence:
        snippet: An extra TA insert leads to eight (TA)8 repeats (UGT1A1*37) resulting in a further reduction
          of glucuronidation activity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/2
