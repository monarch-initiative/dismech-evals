      assertion_type: Diagnosis
      assertion:
        name: Diagnosis of exclusion on isolated unconjugated hyperbilirubinemia
        description: Gilbert syndrome is diagnosed by exclusion, not by a positive test. The picture is
          isolated unconjugated hyperbilirubinemia - predominantly unconjugated, typically under 3 mg/dL
          - with normal ALT, AST, ALP and GGT, normal haemoglobin, reticulocytes, haptoglobin and blood
          film, and normal hepatic imaging. Both haemolysis and liver damage must be excluded, which is
          part of the accepted definition rather than an optional workup. Most diagnoses are made incidentally
          on blood tests taken for something else.
      selected_evidence:
        snippet: There is a consensual definition that GS in individuals is determined by the presence
          of hyperbilirubinemia in the absence of both hemolysis and liver damage, including the fibrosis
          stage.
        supports: SUPPORT
    origin:
