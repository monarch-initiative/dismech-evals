      assertion_type: DifferentialDiagnosis
      assertion:
        name: Haemolysis
        description: Increased bilirubin production from any haemolytic process produces unconjugated
          hyperbilirubinemia with normal liver enzymes, which is exactly the Gilbert biochemical picture.
          Excluding haemolysis is part of the consensual definition of Gilbert syndrome, not an optional
          extra test. The two also co-occur, and co-occurrence is clinically important because the combination
          is what drives early pigment gallstones.
        distinguishing_features:
        - Reticulocytosis
        - Reduced haptoglobin
        - Raised lactate dehydrogenase
        - Anaemia
      selected_evidence:
        snippet: There is a consensual definition that GS in individuals is determined by the presence
          of hyperbilirubinemia in the absence of both hemolysis and liver damage, including the fibrosis
          stage.
        supports: SUPPORT
