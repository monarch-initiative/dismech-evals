        measure_type: POINT_PREVALENCE
        prevalence_class: ABOVE_1_IN_1000
        rate_per_100000: 180.4
        rate_low: 174.4
        rate_high: 186.6
        notes: 'Clinically recorded prevalence, roughly fifty-fold lower than the genotype prevalence
          in the same kind of population. The gap is the entry''s most concrete measure of incomplete
          penetrance plus under-ascertainment: most genotype-positive people are never diagnosed. Diagnoses
          were commoner in men, peaked around age 35, and were commoner in less deprived areas, which
          means this figure carries ascertainment structure and is not a population rate.'
      selected_evidence:
        snippet: 'The estimated UK prevalence of GS was 180.4 per 100,000 (95% CI: 174.4-186.6), with
          diagnoses more common in men, peaking around age 35, and more frequent in areas of least social
          deprivation.'
        supports: SUPPORT
