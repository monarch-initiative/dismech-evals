        prompt: Are the fatigue, abdominal pain, and dyspepsia reported alongside jaundice episodes caused
          by bilirubin, or are they the ascertainment signature of having been investigated for jaundice?
        attaches_to:
        - phenotypes#Jaundice-Associated Gastrointestinal Symptoms
        - phenotypes#Fatigue
        rationale: Three lines of evidence pull in different directions and this entry does not resolve
          them. A clinic cohort reports these symptoms in over half of subjects during jaundice episodes,
          but clinic cohorts enrol people who presented with symptoms. A UK Biobank analysis tested 54
          illnesses and found that, apart from cholelithiasis, every raised prevalence was explained by
          confounders after adjustment. Against both, a UK primary-care analysis of 9,240 cases against
          150,846 controls found abdominal pain and fatigue - and only those two - consistently raised
          up to five years before diagnosis, which is the wrong temporal shape for a pure workup artefact.
          What is still missing is a symptom endpoint tested with the adjustment and Mendelian randomization
          applied to the illness endpoints. Until then the frequencies on these phenotypes record association,
          not causation.
