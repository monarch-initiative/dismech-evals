            term:
              id: MONDO:0007745
              label: Gilbert syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chronic Biliary Bilirubin Load and Pigment Gallstone Formation
        description: 'Bilirubin that is not conjugated in the hepatocyte is not simply retained in plasma;
          the fraction that does reach bile carries an increased unconjugated load, which precipitates
          with calcium as pigment stone nidus. This is the one downstream consequence of the Gilbert genotype
          for which a causal, rather than merely associative, link to a clinical illness has been demonstrated.
          In a UK Biobank analysis of 138,125 participants with apparently healthy livers, cholelithiasis
          was the only illness out of 54 assessed whose raised prevalence in Gilbert syndrome survived
          adjustment for confounders and was confirmed by Mendelian randomization. The effect is much
          larger where bilirubin production is also increased: in sickle cell anemia, the UGT1A1 promoter
          genotype raises gallstone frequency and brings forward age at onset.'
        biological_scale: ORGANISM
        chemical_entities:
        - preferred_term: unconjugated bilirubin
          term:
            id: CHEBI:16990
            label: bilirubin IXalpha
          modifier: INCREASED
      selected_evidence:
        snippet: The mean of total and unconjugated bilirubin and the frequency of cholelithiasis in GS
          patients were higher when compared to those without this condition, regardless of age (P < 0.05).
          Cumulative analysis demonstrated an early age-at-onset for cholelithiasis in GS genotypes (P
          < 0.05).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/1
      context_paths:
