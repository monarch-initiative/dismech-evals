        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Drug-Unmasked Hyperbilirubinemia
        description: In individuals with reduced UGT1A1 capacity, a UGT1A1-inhibiting drug and the UGT1A1*28
          genotype combine supra-additively to push bilirubin into the clinically visible jaundice range.
          In the Swiss HIV Cohort, 67% of UGT1A1*28 homozygotes receiving atazanavir or indinavir had
          repeated episodes of bilirubin above 2.5 mg/dL, against 7% of those with neither risk factor.
          A meta-analysis of six studies puts the odds of atazanavir hyperbilirubinemia in UGT1A1*28 homozygotes
          at roughly ten-fold that of wild type. The hyperbilirubinemia is benign, but it drives avoidable
          treatment discontinuation and diagnostic workup for liver disease.
        biological_scale: ORGANISM
        chemical_entities:
        - preferred_term: unconjugated bilirubin
          term:
            id: CHEBI:16990
            label: bilirubin IXalpha
          modifier: INCREASED
      selected_evidence:
        snippet: 67% of individuals homozygous for UGT1A1*28 and receiving atazanavir or indinavir had
          > or =2 episodes of hyperbilirubinemia in the jaundice range
        supports: SUPPORT
