        genes:
        - preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        description: Mice in which the mouse Ugt1 locus is replaced by the human UGT1 locus. They carry
          human UGT1A1 regulatory sequence, so unlike the Gunn rat they can in principle report on human
          promoter regulation, and they were the model that identified intestinal UGT1A1 as the site where
          breast milk acts to produce neonatal jaundice. Their spontaneous phenotype is nonetheless severe
          neonatal hyperbilirubinemia with bilirubin-induced neurologic dysfunction, which is a Crigler-Najjar-range
          phenotype, not the mild adult Gilbert one. Included here for the regulatory mechanism it establishes,
          not as a model of the Gilbert phenotype.
