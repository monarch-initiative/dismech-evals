  2b0d6354b343c71c77abe81a03cf6ad644f6d810f46f31973d71d3163ca03995:
    claim:
      about:
        disease:
          name: Gilbert's Syndrome
          disease_term:
            preferred_term: Gilbert's syndrome
            term:
              id: MONDO:0007745
              label: Gilbert syndrome
        context: []
      assertion_type: Definition
      assertion:
        name: Sex-, age- and genotype-stratified bilirubin centile definition
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'Gilbert syndrome defined as total bilirubin above the 90th centile of the distribution
          for the individual''s sex, age band, and UGT1A1 (rs887829) genotype, in the absence of liver
          damage. Derived from 138,125 UK Biobank participants with apparently healthy livers. The clinically
          important consequence is that the unisex 1 mg/dL cutoff systematically underdiagnoses women:
          applying stratified centiles identified Gilbert syndrome in 10% of women against 3.7% by the
          historical cutoff. Because bilirubin also falls with age, a fixed threshold misclassifies differently
          at different ages.'
        attaches_to:
        - phenotypes#Mild Unconjugated Hyperbilirubinemia
        - biochemical#Unconjugated Bilirubin
        validation_status:
          status: PROPOSED
          rationale: Derived and internally consistent in a single large European cohort, but not yet
            adopted in guidelines or replicated in another population. The reference intervals start at
            age 40, so their applicability to the adolescents and young adults in whom Gilbert syndrome
            is usually first recognised is untested by the source study itself.
        notes: The same paper reports that the reference intervals begin at age 40, which the authors
          flag as a limitation for younger subjects.
      selected_evidence:
        snippet: In women, we identified 10% (7,741/76,809) of GS versus 3.7% (2,819/76,809) using the
          historical cutoff of ≥1 mg/dL (P<0.0001).
        supports: SUPPORT
    origin:
      assertion_path: /definitions/1
      evidence_path: /definitions/1/evidence/0
      context_paths:
      - /name
