        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: bilirubin_systemic_antioxidant_protection
        hypothesis_label: Mildly raised bilirubin is systemically protective
        status: ALTERNATIVE
        description: 'The hypothesis that the raised unconjugated bilirubin of Gilbert syndrome confers
          systemic antioxidant protection, principally against cardiovascular disease. It has a real in
          vitro mechanism behind it and consistent observational support, and it is the reason Gilbert
          syndrome is often described as advantageous. Mendelian randomization does not support it: using
          the Gilbert genotype as an instrument, genetically raised bilirubin shows no causal protective
          effect on cardiovascular disease or COPD. It is retained as an ALTERNATIVE rather than deprecated
          because the in vitro antioxidant chemistry is not in dispute; what is refuted is the inference
          from it to a clinical benefit at Gilbert-range concentrations.'
        notes: 'The two hypothesis directions are not symmetric. The protective direction is unsupported
          causally, while the one causal association that has been demonstrated for bilirubin in this
          disease points the other way, at cholelithiasis. Recorded here because the protective framing
          is still widespread: the OpenScientist report used to recurate this entry presents cardiovascular
          protection as "a striking and reproducible feature" and proposes, as future work, the Mendelian
          randomization that PMID:37456363 had already published with a negative result. Reviewers of
          this entry should expect to keep meeting that framing in the secondary literature.'
      selected_evidence:
        snippet: Evidence from the analyses of genetic data suggests that bilirubin has no likely causal
          role in protection from cardiovascular disease, chronic obstructive pulmonary disease, or other
          key healthcare outcomes and therefore represents a poor target for therapeutic intervention
          for these outcomes.
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
