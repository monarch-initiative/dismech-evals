      assertion:
        name: UGT1A1*28 Promoter Polymorphism
        gene_term:
          preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        association: Causative
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: The UGT1A1*28 allele contains a (TA)7TAA repeat in the TATAA element of the UGT1A1 promoter,
          compared to the normal (TA)6TAA. Homozygosity for UGT1A1*28 is found in approximately 10-13%
          of Western populations and accounts for the majority of Gilbert's syndrome cases in those populations.
          The extra TA repeat reduces promoter transcription, lowering UGT1A1 activity to approximately
          30% of normal. UGT1A1*28 is also the pharmacogenomic variant most relevant to irinotecan toxicity.
      selected_evidence:
        snippet: The frequency of the 7/7 genotype in this eastern Scottish population was 10-13%.
        supports: SUPPORT
