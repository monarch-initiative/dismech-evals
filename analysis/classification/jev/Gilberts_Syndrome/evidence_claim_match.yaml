      reference: PMID:3029864
      reference_title: Bilirubin is an antioxidant of possible physiological importance.
      evidence_source: IN_VITRO
      explanation: Foundational Science paper demonstrating bilirubin's free radical scavenging capacity,
        providing the mechanistic basis for hypothesised antioxidant protection in Gilbert's syndrome.
