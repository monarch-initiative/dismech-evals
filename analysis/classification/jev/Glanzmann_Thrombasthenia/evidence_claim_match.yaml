  a5c19884505c130d9ac83dab7140ffdb53876ffd74aaea88179b32464dd5cc7b:
    claim:
      about:
        disease:
          name: Glanzmann Thrombasthenia
          disease_term:
            preferred_term: Glanzmann thrombasthenia
            term:
              id: MONDO:0100326
              label: Glanzmann thrombasthenia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Clot Retraction
        role: effector
        biological_scale: CELLULAR
        description: 'A parallel, outside-in consequence of losing the receptor: alphaIIbbeta3 engaged
          with fibrin transmits platelet actomyosin contraction to the clot, consolidating and shrinking
          it. Loss of clot retraction alongside absent aggregation defines type I disease; its preservation
          despite absent aggregation defines type II, so this node is the discriminator between the two
          severity classes rather than an independent bleeding mechanism.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
      selected_evidence:
        snippet: Mucocutaneous bleeding with absent platelet aggregation in response to all physiologic
          stimuli is pathognomonic for GT, and abnormal clot retraction is rarely observed in other disorders
        supports: SUPPORT
    origin:
