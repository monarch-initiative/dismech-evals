          value:
            name: Recombinant Activated Factor VIIa
            description: The bypass agent, and the mainstay for patients with platelet antibodies or transfusion
              refractoriness - precisely the patients for whom transfusion has stopped working. In the
              international Glanzmann Thrombasthenia Registry it provided effective surgical haemostasis
              across 206 procedures regardless of antibody or refractoriness status, with a low adverse-event
              rate; the one treatment-related event was a non-fatal thromboembolism, which is the expected
              hazard of a prohaemostatic bypass.
            therapeutic_modality: PROTEIN_REPLACEMENT
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Failure of Primary Hemostatic Plug Formation
        treatment_effect: BYPASSES
        description: Drives thrombin generation and fibrin formation on the available activated platelet
          surface, closing the haemostatic gap without restoring alphaIIbbeta3-mediated aggregation.
      selected_evidence:
        snippet: For all patients, regardless of platelet antibody or refractoriness status, recombinant
          factor VIIa, administered with or without platelets (±antifibrinolytics), provided effective
          hemostasis with a low frequency of adverse events in surgical procedures in Glanzmann thrombasthenia
          patients.
        supports: SUPPORT
