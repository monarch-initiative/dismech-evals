      assertion_type: DifferentialDiagnosis
      assertion:
        name: Storage Pool Disease and Agonist-Specific Receptor Defects
        description: Aggregation defects confined to a single agonist point upstream, to that agonist's
          receptor or signalling pathway; a defective second wave of aggregation to ADP points to dense-granule
          storage pool disease; a defective response to arachidonic acid points to a thromboxane A2 synthesis
          defect - or to recent aspirin, the acquired phenocopy that must be excluded before any of these
          are diagnosed.
      selected_evidence:
        snippet: Deficiencies in the platelet response to arachidonic acid can point either to an inherited
          abnormality in thromboxane A2 formation or a platelet function defect temporarily acquired through
          aspirin ingestion.
        supports: SUPPORT
