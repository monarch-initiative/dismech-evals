  7459c003fa97d7830fb79697321b5f7c6a847a7cf8495b6956cc98aa2959d30a:
    claim:
      about:
        disease:
          name: Glanzmann Thrombasthenia
          disease_term:
            preferred_term: Glanzmann thrombasthenia
            term:
              id: MONDO:0100326
              label: Glanzmann thrombasthenia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_beta3_null_mouse_placental_phenotype
        kind: HUMAN_MODEL_MISMATCH
        prompt: Do the placental defects and fetal mortality of the beta3-null mouse correspond to any
          reproductive consequence in human ITGB3-related Glanzmann thrombasthenia?
        attaches_to:
        - pathophysiology#Quantitative or Qualitative Deficiency of Integrin alphaIIbbeta3
        rationale: 'The beta3-null mouse recapitulates the platelet phenotype faithfully but also shows
          placental defects leading to fetal mortality, which arise from loss of alphaVbeta3 rather than
          alphaIIbbeta3. Human ITGB3-null patients likewise lack alphaVbeta3, yet no corresponding placental
          disease is an established feature of the human disorder - while pregnancy in these patients
          is hazardous, the documented hazard is haemorrhagic. This is a mismatch of translational validity,
          not an absence of evidence: the mouse result is solid, and what is unresolved is whether it
          means anything for patients. The distinction matters because it separates a genuine unstudied
          risk from a species artefact of constitutional knockout, and because it applies only to the
          ITGB3 arm, not the ITGA2B arm.'
        proposed_experiments:
        - experiment_id: exp_itgb3_pregnancy_outcome_registry
          name: Gene-stratified pregnancy outcome analysis
          description: Compare pregnancy outcomes - placental pathology, fetal growth restriction, and
            loss - between ITGB3-null and ITGA2B-null patients in an international registry, with haemorrhagic
            complications recorded separately so that a placental signal is not obscured by bleeding-driven
            outcomes. Equivalent outcomes across the two genotypes would settle the mouse finding as a
            species artefact.
      selected_evidence:
        snippet: Implantation appears to be unaffected, but placental defects do occur and lead to fetal
          mortality.
        supports: SUPPORT
