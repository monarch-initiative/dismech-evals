      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation
        description: The only curative option, and reserved for severe phenotypes because it trades a
          manageable bleeding disorder for transplant risk. The reported experience is small - 19 successful
          transplants in 18 type I patients, mean age 5 years, all alive at a median 25 months' follow-up
          - which is encouraging but far too short to establish long-term outcome, and 10 of those patients
          were already platelet-alloimmunized.
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: Hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: 19 successful HSCT in 18 GT type I patients have been reported. Mean age at transplantation
          was 5 years. All patients are still alive. The majority received sibling bone marrow transplant
          with busulfan and cyclophosphamid conditioning. GvHD incidence was within the normal range,
          but 10 patients showed alloimmunization of thrombocytes. Median follow up is 25 months.
        supports: SUPPORT
