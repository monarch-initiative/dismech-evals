        context: []
      assertion_type: Subtype
      assertion:
        name: Type I
        display_name: Type I (severe, <5% residual alphaIIbbeta3)
        description: 'The classic and commonest form: platelet aggregation is absent and clot retraction
          is absent, with essentially no surface alphaIIbbeta3. In the detailed Hopital Lariboisiere experience
          this accounted for 50 of 64 patients (78%). This is a phenotypic severity class cutting across
          both genes, not a third genotype.'
      selected_evidence:
        snippet: Those patients with absent platelet aggregation and absent clot retraction were subsequently
          termed as having type I disease; those with absent aggregation but residual clot retraction,
          type II disease
        supports: SUPPORT
