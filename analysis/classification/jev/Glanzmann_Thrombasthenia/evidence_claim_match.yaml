          in most inherited disorders. A patient whose platelets have never displayed alphaIIbbeta3 has
          no tolerance to it, so transfused normal platelets present a foreign antigen; the resulting
          anti-alphaIIbbeta3 antibodies cause refractoriness to further transfusion and, in women, risk
          fetal and neonatal alloimmune thrombocytopenia. The beta3 subunit carries the HPA-1 antigen
          system, and because beta3 also partners alphaV, an HPA-1bb patient who expresses no platelet
          alphaIIbbeta3 at all can still be immunized against HPA-1a through alphaVbeta3 on their own
          platelet surface - an exposure route that a purely alphaIIbbeta3-centred model of the disease
          would predict was closed. This is the reason management is built around avoiding transfusion
          rather than around delivering it.
      selected_evidence:
        snippet: we found that HPA-1bb patients who failed to express αIIb β3 on the platelet surface
          can develop alloantibodies against HPA-1a reacting with β3 as well as αv β3 . This is of particular
          importance as anti-HPA-1a alloantibodies might cause fetal neonatal alloimmune thrombocytopenia
          and/or platelet transfusion refractoriness.
        supports: SUPPORT
    origin:
