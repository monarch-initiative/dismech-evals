  41af9b73ede2bd9ada6b88f87c440929c39bf1933af3301b790f984fe29d3b6a:
    claim:
      about:
        disease:
          name: Glanzmann Thrombasthenia
          disease_term:
            preferred_term: Glanzmann thrombasthenia
            term:
              id: MONDO:0100326
              label: Glanzmann thrombasthenia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Quantitative or Qualitative Deficiency of Integrin alphaIIbbeta3
        role: amplifier
        biological_scale: MOLECULAR
        description: 'alphaIIb and beta3 must heterodimerize in the endoplasmic reticulum before the complex
          can traffic to the platelet surface, so a defect in either subunit removes the whole receptor.
          Three outcomes are possible and define the phenotypic classes: near-total absence of surface
          receptor (type I), reduced but measurable receptor (type II), or normal amounts of a receptor
          that cannot bind ligand (variant GT). The last is why a quantitative flow-cytometry result alone
          cannot exclude the diagnosis.'
        molecular_functions:
        - preferred_term: integrin alphaIIbbeta3 fibrinogen-binding activity
          term:
            id: GO:0005178
            label: integrin binding
          modifier: DECREASED
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
      selected_evidence:
        snippet: it is caused by the absence of platelet aggregation due to quantitative and/or qualitative
          deficiencies of the αIIbβ3 integrin coded by the ITGA2B and ITGB3 genes located at 17q21-23
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22102273
      reference_title: Glanzmann thrombasthenia-like syndromes associated with Macrothrombocytopenias
        and mutations in the genes encoding the αIIbβ3 integrin.
      evidence_source: HUMAN_CLINICAL
      explanation: Independent statement of the same receptor-level lesion and its two gene routes, including
        the chromosomal location asserted here.
