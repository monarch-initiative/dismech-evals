      assertion_type: Genetic
      assertion:
        name: ITGB3
        gene_term:
          preferred_term: ITGB3
          term:
            id: hgnc:6156
            label: ITGB3
        relationship_type: CAUSATIVE
        notes: 'Encodes the beta3 integrin subunit. Biallelic loss-of-function variants cause Glanzmann
          thrombasthenia 2. Distinct, mostly monoallelic variants at the cytoplasmic-tail salt bridge
          (beta3 Asp723, pairing with alphaIIb Arg995) do NOT cause classic thrombasthenia: they weaken
          the link that holds the integrin in its bent resting state, raise its activation status, and
          interfere with megakaryocytopoiesis, producing dominant macrothrombocytopenia with platelet
          anisotropy instead. Assigning an ITGB3 variant to this entry therefore requires the recessive,
          aggregation-loss phenotype, not merely a variant in the gene.'
      selected_evidence:
        snippet: This was brought to light by the discovery of mutations at Arg995 in αIIb and Asp723
          in β3 that lead to platelet anisotropy (increased size variation) and thrombocytopenia. Significantly,
          Arg995 and Asp723 form a salt linkage binding the cytoplasmic tails of αIIbβ3 together keeping
          the integrin in a bent resting state.
        supports: SUPPORT
