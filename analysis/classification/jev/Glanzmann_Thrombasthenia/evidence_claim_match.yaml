  4bf261c543b149d40f3d80849b6c5a84325f375a9ae58e37a14e4bf14bb72930:
    claim:
      about:
        disease:
          name: Glanzmann Thrombasthenia
          disease_term:
            preferred_term: Glanzmann thrombasthenia
            term:
              id: MONDO:0100326
              label: Glanzmann thrombasthenia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Interplatelet Fibrinogen Bridging and Aggregation
        role: central_effector
        biological_scale: CELLULAR
        conforms_to: primary_hemostatic_plug_failure#Failure of Integrin alphaIIbbeta3-Mediated Platelet
          Aggregation
        description: 'The rate-limiting lesion. Activated alphaIIbbeta3 normally binds fibrinogen and
          von Willebrand factor, which cross-link adjacent platelets into a growing aggregate; without
          it, platelets that have adhered and activated normally remain a monolayer. Because this is the
          final common step of aggregation, the failure is agonist-independent: ADP, collagen, thrombin,
          arachidonic acid and epinephrine all fail alike, whereas ristocetin-induced agglutination -
          which depends on GPIb-IX-V and von Willebrand factor rather than on alphaIIbbeta3 - remains
          normal. That dissociation is what separates this disorder from Bernard-Soulier syndrome at the
          bench.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: platelet aggregation
          term:
            id: GO:0070527
            label: platelet aggregation
          modifier: DECREASED
      selected_evidence:
        snippet: This receptor mediates the binding of adhesive proteins that attach aggregating platelets
          and ensure thrombus formation at sites of injury in blood vessels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
