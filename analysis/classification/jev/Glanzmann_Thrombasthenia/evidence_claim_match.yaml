            term:
              id: MONDO:0100326
              label: Glanzmann thrombasthenia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Loss of Function in ITGA2B or ITGB3
        genes:
        - preferred_term: ITGA2B
          term:
            id: hgnc:6138
            label: ITGA2B
        - preferred_term: ITGB3
          term:
            id: hgnc:6156
            label: ITGB3
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component
        description: Pathogenic variants in either of the two adjacent 17q21 genes encoding the alphaIIb
          and beta3 subunits cause the disease, and the mutational spectrum spans every class - missense,
          nonsense, frameshift, splice and large deletion - with no region of either gene exempt. Heterozygotes
          carry roughly half-normal platelet alphaIIbbeta3 and are almost always asymptomatic, so the
          disease is recessive at the level of receptor dose as well as inheritance. Founder variants
          dominate in several populations, including the ITGA2B c.1544+1G>A allele of French Gypsy patients.
        genetic_context:
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        cell_types:
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
      selected_evidence:
        snippet: Note that abnormalities are abundant in both αIIb and β3 genes and that no parts of either
          gene appear to be exempt.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
