        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_severity_not_predicted_by_genotype
        kind: KNOWLEDGE_GAP
        prompt: Why do patients carrying the same ITGA2B or ITGB3 variant differ so widely in bleeding
          frequency and severity?
        attaches_to:
        - pathophysiology#Mucocutaneous Bleeding Diathesis
        rationale: 'Clinical severity ranges from minimal bruising to fatal haemorrhage, and the source
          review states directly that individuals with the same mutation may differ widely. That means
          neither the causal genotype nor the residual receptor level (type I versus type II) is a sufficient
          predictor, so the modifier is elsewhere. This matters practically: prophylaxis and transplant
          decisions are severity-driven, and there is currently no molecular basis on which to make them.
          Candidate explanations include co-inherited prothrombotic variants, which have been reported
          to modulate the phenotype, and differences in vessel-wall or plasma-phase compensation.'
        proposed_experiments:
        - experiment_id: exp_modifier_genotype_bleeding_score
          name: Genotype-stratified bleeding-score study with thrombophilia panel
          description: In a multinational registry, pair a standardized bleeding-assessment tool score
            with the causal genotype, the quantified residual alphaIIbbeta3, and a panel of prothrombotic
            modifier alleles. Testing whether modifier genotype explains within-variant variance would
            either yield a usable prognostic model or exclude the leading candidate explanation.
      selected_evidence:
        snippet: with the same mutation may differ widely in the frequency and severity of bleeding
        supports: SUPPORT
