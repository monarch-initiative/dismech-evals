      assertion_type: Genetic
      assertion:
        name: OPTN
        gene_term:
          preferred_term: OPTN
          term:
            id: hgnc:17142
            label: OPTN
        association: Causative
        notes: 'Primarily normal-tension glaucoma. Typed Causative rather than Risk Factor because OPTN
          E50K is generally treated as a dominant causative variant rather than a susceptibility allele,
          which is the more standard reading of this gene.

          The NTG-specific source this note previously said was still needed has now been supplied: PMID:16043855
          reports that all 11 E50K-carrying patients in the Moorfields series had normal-tension glaucoma,
          with quantified normal presenting and peak diurnal pressures.

          The full mechanism lives in its own entry, `OPTN-related Open Angle Glaucoma` (MONDO:0100553)
          - the OPTN-TBK1 misfolding lesion, the block in autophagic flux and mitophagy in retinal ganglion
          cells, and the clinical course. It is deliberately NOT re-derived here: this umbrella entry
          keeps the generic IOP-driven trabecular-outflow account of adult POAG, which is the arm that
          does NOT apply to the OPTN entity.

          '
      selected_evidence:
        snippet: Certain mutations in optineurin (gene OPTN) are associated with primary open angle glaucoma.
        supports: SUPPORT
