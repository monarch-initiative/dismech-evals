  6a9975d9962cd63b366856664469bd664cb2d3f9c7bc498f9979cb3a08ff0f36:
    claim:
      about:
        disease:
          name: Glioblastoma, IDH-Wildtype
          disease_term:
            preferred_term: IDH-wildtype glioblastoma
            term:
              id: MONDO:0850335
              label: IDH-wildtype glioblastoma
        context: []
      assertion_type: ComputationalModel
      assertion:
        name: Serial-MRI High-Grade Glioma Data-Assimilation Digital Twin
        description: Patient-specific two-species reaction-diffusion model of enhancing and non-enhancing
          tumor regions. The platform repeatedly assimilates quantitative MRI-derived cell-density maps
          during chemoradiotherapy to update spatial tumor forecasts, and also evaluates longer forecasts
          initialized from two visits with patient-specific and cohort-derived parameters.
        model_type: DIGITAL_TWIN
        model_id: PMID:40730976#two-species-data-assimilation
        model_format: Reaction-diffusion PDE/MRI data-assimilation pipeline
        publication: PMID:40730976
        modeled_mechanisms:
        - target: Uncontrolled Cell Proliferation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The model represents spatially varying proliferation, invasion, and chemoradiotherapy
            response through enhancing and non-enhancing tumor-cell populations calibrated to serial MRI-derived
            cellularity.
          limitations: The cohort contains 21 high-grade glioma cases, including 19 IDH-wildtype and two
            IDH-mutant tumors, so it is not a pure match to this disease entry. Weekly multiparametric
            MRI is not standard care, ADC is an imperfect proxy for tumor cellularity, and the reactive
            forecasting approach cannot predict de-novo tumor hotspots or explicitly model molecular and
            immune heterogeneity.
          readouts:
          - name: Agreement of predicted and measured total tumor cell count
            target: Uncontrolled Cell Proliferation
            interpretation: Concordance between predicted and MRI-derived total tumor cell counts evaluates
              how well the model tracks the proliferative tumor-burden trajectory during treatment; it
              is not a clinical outcome endpoint.
        variables:
        - name: Enhancing tumor-cell fraction
          dataset_identifier: Phi_E
          description: MRI-informed spatial state for the contrast-enhancing tumor population.
          unit: dimensionless
        - name: Non-enhancing tumor-cell fraction
          dataset_identifier: Phi_N
          description: MRI-informed spatial state for the non-enhancing T2-hyperintense tumor population.
          unit: dimensionless
        - name: Total tumor cell count
          dataset_identifier: total_tumor_cell_count
          description: Combined enhancing and non-enhancing tumor-cell burden used for forecast evaluation.
          unit: cells
        findings:
        - statement: Weekly data assimilation yielded a median total-cell-count concordance of 0.91 and
            median tumor-volume error of -2.6%; less frequently updated forecasts had lower concordance.
        notes: No exact source-code repository was identified for this published model. TumorTwin is a
          related framework from the same modeling group but is curated separately above and must not
          be treated as the implementation of this study.
      selected_evidence:
        snippet: We present a novel computational platform that assimilates MRI data to continually predict
          spatiotemporal tumor changes during chemoradiotherapy.
        supports: SUPPORT
    origin:
      assertion_path: /computational_models/1
      evidence_path: /computational_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
