              macrophage-polarization mechanism, not evidence of clinical repolarization in patients.
        - target: Uncontrolled Cell Proliferation
          relationship: PERTURBS
          fidelity: MODERATE
          description: The model perturbs tumor-cell proliferation indirectly through simulated CSF1R
            inhibition of macrophage polarization and IGF1R inhibition of tumor cells, using tumor-cell
            density and predicted survival as optimization outputs.
          limitations: Validation is preclinical and computational rather than prospective or patient-specific,
            and the modeled glioblastoma is not stratified by IDH status. The agent model reduces macrophages
            to M0/M1/M2 states, omits T cells and other signaling pathways, and represents vasculature
            only as a source of recruited macrophages and drug penetration.
          readouts:
          - name: Tumor-cell density under optimized combination treatment
            target: Uncontrolled Cell Proliferation
            direction: DECREASED
            interpretation: Lower simulated tumor-cell density reports suppression of the modeled proliferative
              endpoint under the optimized schedule; it does not establish efficacy in people with IDH-wildtype
              glioblastoma.
