      assertion:
        name: IDH-Mutant Astrocytoma
        description: Adult-type diffuse glioma (WHO grade 2-4) defined by IDH1/2 mutation without 1p/19q
          codeletion, commonly with ATRX loss and TP53 mutation; prognosis is significantly better than
          IDH-wildtype glioblastoma. CDKN2A/B homozygous deletion upgrades the tumor to grade 4. Curated
          as a standalone dismech entry (IDH_Mutant_Astrocytoma; MONDO:0956994).
      selected_evidence:
        snippet: For the first time molecular features are not only relevant for the classification of
          IDH-mutant gliomas but may impact grading as well.
        supports: SUPPORT
