              id: MONDO:0021042
              label: glioma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IDH-Mutation Oncometabolite Epigenetic Reprogramming
        genetic_context:
          variant_origin: SOMATIC
        description: IDH1 or IDH2 mutation is the primary biological divider of adult-type diffuse glioma.
          Mutant IDH acquires neomorphic activity producing the oncometabolite D-2-hydroxyglutarate, which
          competitively inhibits alpha-ketoglutarate-dependent dioxygenases (TET DNA demethylases and
          histone demethylases), yielding a glioma CpG-island methylator phenotype and a block in glial
          differentiation. IDH-mutant tumors carry a more favorable prognosis than IDH-wildtype.
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: ABNORMAL
        - preferred_term: demethylation
          term:
            id: GO:0070988
            label: demethylation
          modifier: DECREASED
        - preferred_term: glial cell differentiation
          term:
            id: GO:0010001
            label: glial cell differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: For the first time molecular features are not only relevant for the classification of
          IDH-mutant gliomas but may impact grading as well.
        supports: SUPPORT
