          single disorder with a broad phenotypic spectrum ranging from early-onset global developmental
          delay to lethal early neonatal encephalopathy (PMID:41865506), and reviews table GLS loss-of-function
          as one entity. However, the two ends carry distinct OMIM identities (618412 vs 618328) and mechanistically
          distinct lesions: a noncoding 5'' UTR GCA-repeat expansion producing a relative/partial glutaminase
          deficiency (this entry) versus biallelic coding loss-of-function producing complete deficiency
          (neonatal form).'
        resolution_note: 'Curator decision: keep split. This entry is scoped specifically to the repeat-expansion
          form (MONDO:0032733 / OMIM:618412); the severe neonatal-onset form (OMIM 618328) is to be modeled
          as a separate Disease entry. Raised by ai4c-reviewer on PR #7138 and adjudicated by the curator.'
