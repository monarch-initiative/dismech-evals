      assertion:
        name: Leukocyte Recruitment and Glomerular Inflammation
        description: Complement fragments, Fc-receptor engagement on deposited complexes, and activated
          resident glomerular cells recruit neutrophils and monocytes into the capillary tuft and mesangium.
          Infiltrating and resident cells release cytokines, chemokines, reactive oxygen species, and
          proteases. Effector CD4 T cell (Th1/Th17) and CD8 T cell responses contribute substantially
          to the severe crescentic phenotype. Mesangial and endothelial cells proliferate, producing the
          endocapillary and mesangial hypercellularity seen on biopsy.
        biological_scale: CELLULAR
        cell_types:
