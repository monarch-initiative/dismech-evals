        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nephritogenic Antigen Exposure and Loss of Tolerance
        description: The initiating step is the appearance of a nephritogenic antigen-antibody pairing.
          This may be a foreign antigen from infection (streptococcal SpeB or NAPlr, hepatitis B or C,
          staphylococcal or endocarditis-associated antigen), a self antigen against which tolerance is
          lost (the alpha-3 chain of type IV collagen in anti-GBM disease, myeloperoxidase or proteinase-3
          in ANCA disease, PLA2R1 in membranous nephropathy, nuclear antigens in lupus nephritis), or
          an aberrantly glycosylated self immunoglobulin (galactose-deficient IgA1). GN is correspondingly
          grouped by immunopathogenesis rather than by histological pattern, because the lesion pattern
          does not identify the cause.
        role: trigger
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: adaptive immune response
          term:
            id: GO:0002250
            label: adaptive immune response
          modifier: ABNORMAL
        - preferred_term: immunoglobulin production
          term:
            id: GO:0002377
            label: immunoglobulin production
        cell_types:
        - preferred_term: plasma cell
          term:
            id: CL:0000786
            label: plasma cell
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
      selected_evidence:
        snippet: These disorders are currently classified largely on the basis of histopathological lesion
          patterns, but these patterns do not align well with their diverse pathological mechanisms and
          hence do not inform optimal therapy.
        supports: SUPPORT
