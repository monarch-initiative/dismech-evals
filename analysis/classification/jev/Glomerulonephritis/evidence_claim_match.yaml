        context: []
      assertion_type: Inheritance
      assertion:
        name: Complex non-Mendelian inheritance
        description: 'Glomerulonephritis as a whole is not a Mendelian disorder. Even in the complement-mediated
          arm, where the largest set of implicated genes is known, transmission is complex: familial clustering
          is the exception, and both dominant and recessive patterns have been described within the few
          multiplex families reported. This is the reason the complement genes below are curated as SUSCEPTIBILITY
          rather than as causal Mendelian loci.'
      selected_evidence:
        snippet: C3G is a complex genetic disorder that is rarely inherited in a simple mendelian fashion.
          Multiple affected persons within a single nuclear family are reported only occasionally, with
          both dominant and recessive inheritance being described.
        supports: SUPPORT
