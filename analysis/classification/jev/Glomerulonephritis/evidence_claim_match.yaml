      assertion_type: Pathophysiology
      assertion:
        name: Crescent Formation
        description: 'Where the capillary wall has ruptured, fibrin, plasma proteins, and inflammatory
          cells enter Bowman''s space and drive proliferation of parietal epithelial cells, with recruited
          macrophages, into the characteristic crescent. Crescents are the histological correlate of rapidly
          progressive glomerulonephritis: they compress the tuft, obliterate Bowman''s space, and, if
          they organize into fibrous crescents, render the glomerulus irrecoverable. Crescentic disease
          is the shared severe endpoint of anti-GBM disease, ANCA-associated GN, and severe immune-complex
          GN, and is what makes prompt immunosuppression time-critical.'
        biological_scale: TISSUE
        cell_types:
        - preferred_term: parietal epithelial cell
          term:
            id: CL:1000452
            label: parietal epithelial cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: epithelial cell proliferation
          term:
            id: GO:0050673
            label: epithelial cell proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: although presentation with oligoanuria, a high proportion of glomerular crescents, or
          kidney failure requiring dialysis augur badly for renal prognosis
        supports: SUPPORT
