      assertion_type: Prevalence
      assertion:
        population: Africa (biopsy-proven primary glomerular disease, 8 countries)
        measure_type: UNKNOWN
        prevalence_class: UNKNOWN
        notes: 'Pooled biopsy-series distribution rather than a population rate: among 6,494 biopsied
          individuals in 17 African studies, FSGS 26.10%, minimal change disease 22.40%, membranous nephropathy
          8.40%, MPGN 6.40%, mesangioproliferative GN 6.40%, post-infectious GN 2.60%, IgA nephropathy
          2.60%, and crescentic GN 1.40%. This is a subtype *distribution* among biopsies, not an incidence
          in the general population, and is subject to biopsy referral and ascertainment bias. No reliable
          global incidence exists for aggregate glomerulonephritis, because biopsy policy, coding, age
          structure, and infection burden differ between settings.'
      selected_evidence:
        snippet: Seventeen eligible articles (n = 6,494 individuals) from 8 African countries met the
          inclusion criteria. The overall pooled prevalence of FSGS, MCD, MN, MPGN, MesPGN, PIGN, IgAN
          and CresGN was 26.10%, 22.40%, 8.40%, 6.40%, 6.40%, 2.60%, 2.60%, 1.40%, respectively.
        supports: SUPPORT
