            label: glomerular basement membrane
      selected_evidence:
        snippet: The majority of patients develop widespread glomerular crescent formation, presenting
          with features of rapidly progressive GN, and 40%-60% will have concurrent alveolar hemorrhage.
        supports: SUPPORT
