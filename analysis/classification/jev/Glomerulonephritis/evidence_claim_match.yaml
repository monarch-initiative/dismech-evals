      assertion_type: Biochemical
      assertion:
        name: Anti-PLA2R autoantibody
        presence: Positive
        specificity: High for primary membranous nephropathy; absent in secondary membranous nephropathy
          and in other glomerulonephritis subtypes.
        notes: 'The one serologic marker in glomerulonephritis that is both mechanistically causal and
          clinically validated: it identifies the autoantigen driving the subepithelial deposition node,
          and its titre tracks disease activity closely enough that a positive result can substitute for
          biopsy in defined settings. Contrast the omics-derived candidate markers below, which remain
          unvalidated.'
      selected_evidence:
