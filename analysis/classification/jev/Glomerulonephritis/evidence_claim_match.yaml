      assertion_type: Pathophysiology
      assertion:
        name: Alternative Pathway Complement Dysregulation
        role: trigger
        description: 'In C3 glomerulopathy the fluid-phase alternative pathway escapes regulation, through
          acquired autoantibodies such as C3 nephritic factor that stabilize the C3 convertase, or through
          rare variants in complement genes (C3, CFH, CFI, CFB, CD46, CFHR1, CFHR5, DGKE). Continuous
          C3 turnover deposits C3 fragments in the glomerulus without accompanying immunoglobulin, giving
          the C3-dominant immunofluorescence pattern that defines the entity. This is an autoinflammatory
          route into GN: no adaptive antigen-antibody pairing is required.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: complement activation, alternative pathway
          term:
            id: GO:0006957
            label: complement activation, alternative pathway
          modifier: INCREASED
      selected_evidence:
        snippet: C3 glomerulopathy (C3G) is a complex ultra-rare complement-mediated renal disease caused
          by uncontrolled activation of the complement alternative pathway (AP) in the fluid phase
        supports: SUPPORT
    origin:
