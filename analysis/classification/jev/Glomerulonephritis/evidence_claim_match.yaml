      assertion_type: Diagnosis
      assertion:
        name: Kidney biopsy with light microscopy, immunofluorescence, and electron microscopy
        description: 'Kidney biopsy is the central diagnostic act in glomerulonephritis, because the clinical
          presentation — hematuria, proteinuria, hypertension, falling GFR — is shared across mechanistically
          unrelated subtypes and cannot distinguish them. All three modalities are needed: light microscopy
          defines the proliferative pattern, immunofluorescence separates immune-complex (granular), anti-GBM
          (linear), pauci-immune (scant), C3-dominant, and monoclonal light-chain patterns, and electron
          microscopy localizes deposits to the mesangial, subendothelial, or subepithelial compartment.
