      assertion_type: Pathophysiology
      assertion:
        name: Glomerular Immune Complex Deposition
        description: 'Circulating immune complexes are trapped in the glomerulus, or complexes form in
          situ when antibody binds an antigen already planted in the capillary wall. Deposit location
          determines the clinical syndrome: mesangial and subendothelial deposits sit on the blood side
          of the basement membrane, where they are accessible to circulating inflammatory cells and produce
          a nephritic, proliferative lesion; subepithelial deposits are separated from the circulation
          by the basement membrane and instead injure the podocyte.'
        biological_scale: TISSUE
        cell_types:
        - preferred_term: mesangial cell
          term:
            id: CL:0000650
            label: mesangial cell
        - preferred_term: glomerular capillary endothelial cell
          term:
            id: CL:1001005
            label: glomerular capillary endothelial cell
        biological_processes:
        - preferred_term: immune complex clearance
          term:
            id: GO:0002434
            label: immune complex clearance
          modifier: DECREASED
        locations:
        - preferred_term: renal glomerulus
          term:
            id: UBERON:0000074
            label: renal glomerulus
      selected_evidence:
        snippet: Deposition of circulating immune complexes or in situ formation of immune complexes in
          glomeruli, or both, results in glomerulonephritis.
        supports: SUPPORT
