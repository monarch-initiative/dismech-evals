      assertion_type: Diagnosis
      assertion:
        name: Mechanism-directed serologic panel
        description: 'Serology narrows the mechanism before and alongside biopsy, and each assay maps
          onto a specific pathophysiology arm modelled here: ANCA with PR3/MPO specificity for the pauci-immune
          neutrophil arm; anti-GBM antibody for the anti-alpha3(IV) arm; anti-PLA2R for the subepithelial
          podocyte arm; C3 and C4 for complement consumption; ANA and anti-dsDNA for lupus nephritis;
          hepatitis B/C, HIV and streptococcal serology (ASO, anti-DNase B) for the infection-related
          arm; and serum/urine electrophoresis with free light chains for monoclonal gammopathy-related
          disease. Anti-PLA2R is the one assay that has become a genuine non-invasive substitute for biopsy
          in a defined setting; the others remain adjuncts to it.'
        diagnosis_term:
          preferred_term: Autoantibody and complement serology
          term:
            id: NCIT:C181397
            label: Autoantibody Measurement
        results: 'A positive result assigns the mechanism: PR3/MPO-ANCA (pauci-immune), anti-GBM (linear
          anti-basement-membrane), anti-PLA2R (membranous), low C3 (post-infectious, C3 glomerulopathy,
          or lupus nephritis).'
      selected_evidence:
        snippet: the discovery of pathogenic circulating autoantibodies against phospholipase A2 receptor
          1 (PLA2R1) and thrombospondin type 1 domain-containing protein 7A (THSD7A)
        supports: SUPPORT
