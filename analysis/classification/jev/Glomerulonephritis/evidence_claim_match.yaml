      assertion_type: Pathophysiology
      assertion:
        name: Anti-GBM Autoantibody Binding to Type IV Collagen
        description: In anti-GBM disease, autoantibody binds a conformational epitope on the non-collagenous
          (NC1) domain of the alpha-3 chain of type IV collagen, an antigen normally sequestered within
          the hexameric collagen network of the glomerular and alveolar basement membrane. Because the
          antibody engages a fixed structural antigen along the whole capillary wall, injury is near-simultaneous
          across all glomeruli, which is why this subtype so characteristically produces widespread crescents
          and rapidly progressive disease, frequently with concurrent alveolar hemorrhage.
        biological_scale: MOLECULAR
        molecular_functions:
