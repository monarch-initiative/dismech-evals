          adhesion to the glomerular endothelium, respiratory burst, degranulation, and release of neutrophil
          extracellular traps. Because injury is delivered by the activated neutrophil rather than by
          deposited complexes, immunofluorescence shows little or no immunoglobulin — the defining "pauci-immune"
          feature. Complement, particularly the C5a-C5aR axis, amplifies the priming loop and is the target
          of avacopan.'
