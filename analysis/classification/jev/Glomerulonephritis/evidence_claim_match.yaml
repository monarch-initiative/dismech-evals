        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Complement Activation
        description: Complement is the principal amplifier converting antibody or convertase deposition
          into tissue injury. Classical-pathway activation by deposited IgG or IgM, lectin-pathway activation,
          and alternative-pathway amplification all converge on C3 cleavage, generating the anaphylatoxins
          C3a and C5a and the C5b-9 membrane attack complex. C5a is a potent neutrophil chemoattractant
          and primer; C5b-9 injures glomerular cells sublytically. Consumption of complement is clinically
          visible as a depressed serum C3 in post-infectious GN, C3 glomerulopathy, and lupus nephritis.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: complement activation
          term:
            id: GO:0006956
            label: complement activation
          modifier: INCREASED
        - preferred_term: complement activation, classical pathway
          term:
            id: GO:0006958
            label: complement activation, classical pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Individuals with C3G typically present with hematuria, proteinuria, hematuria and proteinuria,
          acute nephritic syndrome or nephrotic syndrome, and low levels of the complement component C3.
        supports: SUPPORT
