      assertion_type: Phenotype
      assertion:
        category: Clinical
        name: Pinpoint Tenderness
        description: Focal pressure over the lesion, classically with a pin head, reproduces the pain
          precisely at a single point (the Love pin test), while surrounding skin is unaffected. This
          is the most consistently present element of the triad.
        phenotype_term:
          preferred_term: Focal pinpoint tenderness (positive Love pin test)
          term:
            id: HP:0012531
            label: Pain
        frequency: VERY_FREQUENT
        notes: 'Ontology gap - term request needed. This phenotype and "Severe Paroxysmal Pain" both fall
          back to HP:0012531 Pain, which loses the clinically distinctive feature: point tenderness is
          the Love pin-test finding and the most sensitive element of the triad, whereas the paroxysmal
          pain is spontaneous and lancinating. HPO offers no usable alternative. HP:0025283 "Tender" is_a
          HP:0025280 Pain characteristic, i.e. it sits on the modifier branch rather than under HP:0000118
          Phenotypic abnormality, so it cannot serve as a phenotype_term; every other HPO tenderness term
          is specific to a body site other than the digit (HP:0020226 Nipple tenderness, HP:0100809 Scalp
          tenderness, HP:6000106 Costovertebral angle tenderness, HP:6000107 Cervical motion tenderness,
          HP:6001407 Peroneal tendon tenderness). The two phenotypes are therefore held apart by preferred_term
          until a localized/pinpoint tenderness HPO term exists.'
      selected_evidence:
        snippet: Localized point tenderness was observed in 10 patients (91%), whereas cold hypersensitivity
          was present in four patients (36%), and the complete symptom triad was observed in four patients
          (36%).
        supports: SUPPORT
