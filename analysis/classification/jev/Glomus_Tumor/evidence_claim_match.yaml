      assertion_type: Diagnosis
      assertion:
        name: Histopathologic examination with immunohistochemistry
        description: Definitive diagnosis is histopathologic. Sheets and perivascular cuffs of monomorphic,
          sharply bordered glomus cells are confirmed by an immunohistochemical panel showing diffuse
          smooth muscle actin, smoothelin and h-caldesmon positivity with pericellular type IV collagen,
          and negativity for S100/SOX10, cytokeratin and endothelial markers in the tumor cells. Desmin
          is variable. The same specimen is graded against the Folpe criteria to assign benign, symplastic,
          uncertain-malignant-potential or malignant category.
        diagnosis_term:
          preferred_term: histopathologic examination with immunohistochemistry
          term:
            id: NCIT:C16853
            label: Microscopy
        notes: NCIT:C16722 (Immunohistochemistry) is the semantically exact term but is not reachable
          from NCIT:C25218 (Clinical Intervention or Procedure), the root of the TreatmentActionTerm dynamic
          enum, so it fails term validation here. Microscopy is the nearest reachable ancestor; the specific
          procedure is carried by preferred_term.
      selected_evidence:
        snippet: all tumors were immunoreactive for muscle-specific actin, but only two expressed desmin
        supports: SUPPORT
