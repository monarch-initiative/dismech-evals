  12eeca07880b9d80e14ab75ba86473ef9da27348c28bfc29dfb82e82822b0f92:
    claim:
      about:
        disease:
          name: Glomus Tumor
          disease_term:
            preferred_term: glomus tumor
            term:
              id: MONDO:0018327
              label: glomus tumor
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: GLI1-altered soft tissue tumour (GLI1-fused or GLI1-amplified)
        description: 'The most contemporary addition to the pericytic/perivascular differential. A distinct
          group of soft tissue neoplasms defined either by GLI1 gene fusions (ACTB, MALAT1 or PTCH1 partners)
          or by GLI1 amplification with CDK4 and MDM2 co-amplification shows monomorphic ovoid-to-epithelioid
          cells in a nested-trabecular pattern separated by thin septa and a delicate capillary network.
          The authors of the defining series call this architecture highly reminiscent of glomus tumour
          and list glomus tumour/myopericytoma explicitly among the differential diagnoses. The distinction
          is prognostic, not academic: unlike conventional glomus tumour these are malignant soft tissue
          tumours, with high mitotic counts, necrosis, lymphovascular invasion and documented lymph node
          and lung metastases, and they cannot be separated from glomus tumour on morphology alone.'
        distinguishing_features:
        - GLI1 gene fusion, or GLI1 amplification usually with CDK4 and MDM2 co-amplification, rather
          than a MIR143-NOTCH fusion
        - Frequent S100 positivity and an inconsistent immunoprofile (CD56, SMA, pan-CK variably positive);
          glomus tumour is consistently actin-positive and S100-negative
        - High mitotic count and necrosis in a substantial minority, with lymphovascular invasion
        - Malignant behaviour is the rule rather than the rare exception it is in glomus tumour
        notes: MONDO has no class for GLI1-altered / GLI1-amplified soft tissue tumour (a MONDO search
          for "GLI1" returns only the HGNC gene record), so this differential is deliberately recorded
          without a disease_term rather than mapped to an approximate parent.
      selected_evidence:
        snippet: FISH showed GLI1 (12q13.3) gene amplification in all 10 cases, with co-amplification
          of CDK4 (12q14.1) in nine (90%) and MDM2 (12q15) in eight (80%) cases.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/3
      evidence_path: /differential_diagnoses/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31189998
      reference_title: GLI1-amplifications expand the spectrum of soft tissue neoplasms defined by GLI1
        gene fusions.
      evidence_source: HUMAN_CLINICAL
      explanation: Supplies the molecular signature that separates this group from glomus tumour.
    first_seen_at: '2026-09-28T17:55:13.188888+00:00'
