          term:
            id: hgnc:1097
            label: BRAF
        - preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        - preferred_term: NF1
          term:
            id: hgnc:7765
            label: NF1
        biological_processes:
        - preferred_term: MAPK cascade
          modifier: INCREASED
          term:
            id: GO:0000165
            label: MAPK cascade
      selected_evidence:
        snippet: Key discoveries include frequent inactivating mutations in the NF1 gene, leading to constitutive
          RAS/MAPK pathway activation, and recurrent "MIR143-NOTCH" gene fusions disrupting Notch signaling
        supports: SUPPORT
