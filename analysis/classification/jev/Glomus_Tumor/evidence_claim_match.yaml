        description: Gadolinium-enhanced high-resolution MRI is the preferred imaging study for a suspected
          subungual glomus tumor. The lesion is characteristically low signal on T1-weighted and markedly
          hyperintense on T2-weighted images with avid enhancement, and lesions as small as 2 mm can be
          detected. It also identifies additional asymptomatic lesions (which would raise the question
          of NF1 or glomuvenous malformation) and helps exclude alternative diagnoses.
        diagnosis_term:
          preferred_term: magnetic resonance imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
      selected_evidence:
        snippet: It is currently considered the gold standard diagnostic investigation. It is non-invasive
          and doesn’t involve any exposure to radiation. It can detect early lesions as small as 2 mm.
        supports: SUPPORT
