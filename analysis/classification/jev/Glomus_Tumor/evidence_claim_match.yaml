      assertion_type: Treatment
      assertion:
        name: Symptom-Directed Surveillance for Digital Glomus Tumour in NF1
        action_category: SCREENING
        description: 'Digital glomus tumour is part of the NF1 tumour spectrum and is the most under-recognised
          member of it, so the 2023 ERN GENTURIS NF1 tumour surveillance guideline manages it by symptom-directed
          clinical vigilance rather than by imaging. Adults with NF1 are assessed clinically at least
          once every three years, and every visit includes history taking and, for this tumour, direct
          questioning about localised tenderness, severe paroxysmal pain and cold sensitivity in the fingers
          and toes together with visual inspection of the nail beds and palpation. No routine imaging
          of asymptomatic digits is recommended. The rationale is diagnostic delay rather than mortality:
          patients frequently live with the pain for years without the diagnosis being considered, so
          the yield comes from asking. Because NF1-associated lesions are more often multifocal and both
          local recurrence and metachronous tumours are common, excision of one lesion does not end surveillance.'
        treatment_term:
          preferred_term: periodic clinical assessment with nail-bed inspection and symptom enquiry
          term:
            id: NCIT:C20989
