  ff5a66b951e880fb72f690264d5db91c5f4331ab5eefce08b2fd1329d1bd4d20:
    claim:
      about:
        disease:
          name: Glomus Tumor
          disease_term:
            preferred_term: glomus tumor
            term:
              id: MONDO:0018327
              label: glomus tumor
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Solitary fibrous tumour (formerly haemangiopericytoma)
        description: Historically confused with glomus tumour because "haemangiopericytoma" was once used
          for any perivascular-patterned tumour. Solitary fibrous tumour is now defined by the NAB2-STAT6
          fusion with nuclear STAT6 expression and CD34 positivity, and is a fibroblastic rather than
          pericytic lesion; the staghorn-vessel pattern it shares with glomus tumour is a non-specific
          architectural feature.
        disease_term:
          preferred_term: solitary fibrous tumor
          term:
            id: MONDO:0016238
            label: solitary fibrous tumor
        distinguishing_features:
        - Patternless spindle-cell proliferation with ropey collagen and staghorn vessels, not uniform
          round perivascular glomus cells
        - Nuclear STAT6 (NAB2-STAT6 fusion) and CD34 positive; glomus tumour is STAT6/CD34 negative and
          SMA positive
        - Fibroblastic lineage, not pericytic; no NOTCH fusion
        - Typically a deep-seated or serosal mass, painless, without the cold-sensitivity triad
        notes: 'Historically this differential carried no evidence item because no abstract in the reference
          set made the glomus-tumour-versus-SFT comparison directly. It is now backed from both sides:
          the NAB2-STAT6 / nuclear STAT6 discriminator by PMID:24030747, and the actin-plus-MIR143-NOTCH2
          glomus-tumour signature by PMID:31189998, which lists solitary fibrous tumour and glomus tumour/myopericytoma
          on the same differential. A single paper making the head-to-head comparison still does not appear
          to exist.'
      selected_evidence:
        snippet: In conclusion, STAT6 is a highly sensitive and almost perfectly specific immunohistochemical
          marker for SFT and can be helpful to distinguish this tumor type from histologic mimics.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/4
      evidence_path: /differential_diagnoses/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24030747
      reference_title: Nuclear expression of STAT6 distinguishes solitary fibrous tumor from histologic
        mimics.
      evidence_source: HUMAN_CLINICAL
      explanation: Validates nuclear STAT6 as the discriminator that separates solitary fibrous tumour
        from its histologic mimics, glomus tumour among them.
