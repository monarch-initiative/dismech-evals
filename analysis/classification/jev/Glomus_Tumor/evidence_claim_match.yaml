            term:
              id: MONDO:0018327
              label: glomus tumor
        context: []
      assertion_type: Phenotype
      assertion:
        category: Clinical
        name: Gastric (Visceral) Glomus Tumor
        description: Glomus tumor is not a cutaneous-only disease. Beyond the acral and subungual sites
          that dominate clinical practice, tumors arise at deep soft tissue and visceral sites, most characteristically
          in the gastric wall, where the antrum is the commonest location. Gastric lesions present as
          a submucosal mass found at endoscopy or on cross-sectional imaging, or with upper gastrointestinal
          bleeding, and are routinely mistaken preoperatively for gastrointestinal stromal tumor. They
          are the same entity as the soft tissue lesion - histologically and immunophenotypically comparable,
          actin- and type IV collagen-positive, and negative for the KIT/PDGFRA mutations of GIST - are
          almost always benign, and are cured by complete local resection. They do not produce the paroxysmal-pain
          and cold-sensitivity triad, which depends on the dense acral innervation modelled in the nociceptor-rich
          stroma node.
        phenotype_term:
          preferred_term: Neoplasm of the stomach
          term:
            id: HP:0006753
            label: Neoplasm of the stomach
        notes: No frequency band is asserted. The visceral share of all glomus tumors cannot be estimated
          from the available literature, which consists of single-institution surgical-pathology series
          (11 and 21 cases) with no common denominator; a numeric or banded frequency here would be fabricated.
      selected_evidence:
        snippet: The majority of GGTs are benign, and local surgery achieving complete resection is the
          most effective treatment method.
        supports: SUPPORT
