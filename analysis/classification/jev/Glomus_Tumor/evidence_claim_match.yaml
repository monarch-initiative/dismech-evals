      assertion_type: DifferentialDiagnosis
      assertion:
        name: Jugulotympanic paraganglioma ("glomus jugulare" / "glomus tympanicum")
        description: 'This is a NAMING COLLISION, not a biological differential. The skull-base and middle-ear
          tumours historically called "glomus jugulare" and "glomus tympanicum" are PARAGANGLIOMAS and
          are NOT glomus tumours in the sense of this entry. They arise from neural-crest-derived parasympathetic
          paraganglia of the jugular bulb and tympanic plexus, are neuroendocrine (chromogranin / synaptophysin
          positive, with S100/SOX10-positive sustentacular cells), are associated with germline SDHx variants,
          may be catecholamine-secreting, and are managed by skull-base surgery or stereotactic radiosurgery.
          They share nothing with the pericytic MIR143-NOTCH-driven soft-tissue glomus tumour except the
          nineteenth-century use of "glomus" for a vascular body. Anyone reaching this entry from a "glomus
          jugulare" query has the wrong entity: see MONDO:0021064 (jugulotympanic paraganglioma) instead.'
        disease_term:
          preferred_term: jugulotympanic paraganglioma
          term:
            id: MONDO:0021064
            label: jugulotympanic paraganglioma
        distinguishing_features:
        - Anatomic site is the jugular foramen / middle ear rather than the acral soft tissue or nail
          bed
        - Neuroendocrine chief-cell morphology with chromogranin and synaptophysin expression, and S100/SOX10-positive
          sustentacular cells; glomus tumour is S100-negative and actin-positive
        - Derived from neural-crest paraganglia, not from perivascular modified smooth muscle
        - Germline SDHx predisposition; no MIR143-NOTCH fusion
        - May secrete catecholamines and present with pulsatile tinnitus and lower cranial neuropathy,
          not with the paroxysmal-pain/cold-sensitivity triad
        notes: 'Curation guardrail. This is the single most consequential entity-resolution error for
          this disease name, and it is exactly the Named Entity Confusion failure mode described in CLAUDE.md:
          literature retrieved for "glomus tumor" will silently include head-and-neck paraganglioma papers
          whose PMIDs are real and whose snippets validate. Check that any candidate reference is about
          an acral/soft-tissue lesion before citing it here.'
      selected_evidence:
        snippet: Jugulotympanic paragangliomas (JTPs) are rare, hypervascular skull base tumors.
        supports: SUPPORT
    origin:
