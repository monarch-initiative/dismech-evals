            term:
              id: MONDO:0018327
              label: glomus tumor
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: glomus-subungual-fusion-negative
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What drives the classic painful subungual glomus tumor, given that this commonest subset
          lacks the MIR143-NOTCH fusions that define the disease molecularly?
        attaches_to:
        - pathophysiology#MIR143-NOTCH Gene Fusion
        rationale: 'The molecular model of glomus tumor rests on MIR143-NOTCH fusions found in over half
          of tumors, but the same cohort reports that the common subungual subset - the lesions that produce
          the classic clinical triad and account for most clinical practice - is fusion-negative. The
          BRAF/KRAS and NF1 arms do not fill the gap either: sporadic tumors showed no NF1 or RAS-MAPK
          abnormality, and BRAF V600E is enriched in proximal rather than distal lesions. The entry therefore
          models a driver landscape that does not explain its own flagship phenotype. Until this is resolved,
          no causal edge should be drawn from the fusion node to the subungual presentation.'
        proposed_experiments:
        - experiment_id: exp_glomus_subungual_fusion_negative_rnaseq
          name: RNA sequencing of fusion-negative subungual glomus tumors
          description: Sequence a dedicated cohort of classic painful subungual glomus tumors confirmed
            NOTCH-fusion-negative by break-apart FISH, to search for alternative fusions, cryptic NOTCH-pathway
            lesions, or an entirely distinct driver class.
        - experiment_id: exp_glomus_site_stratified_profiling
          name: Site-stratified methylation and single-cell profiling
          description: Compare subungual with deep and visceral glomus tumors by DNA methylation classification
            and single-cell profiling, to test whether they are one entity reached by two driver routes
            or two entities that converge on a shared morphology.
      selected_evidence:
        snippet: The common subungual GT subset lack NOTCH-gene fusions suggesting an alternative pathogenesis.
        supports: SUPPORT
