            term:
              id: MONDO:0018327
              label: glomus tumor
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: glomus-epidemiology-gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the population incidence of glomus tumor, and is the reported sex predominance
          real or an artifact of which anatomic subset a series samples?
        rationale: 'No population-based rate exists, so the prevalence record on this entry carries only
          the qualitative RARE band. The sex data are also internally inconsistent across the cited series
          in a way that looks anatomic rather than biological: a hand-only series reports 71% female,
          whereas a molecular-pathology cohort dominated by deep, visceral and NOTCH-rearranged tumors
          reports 82% male among benign fusion-positive cases. These may be two different populations
          rather than a contradiction, but the entry does not assert a sex ratio because the evidence
          cannot currently distinguish those possibilities.'
        proposed_experiments:
        - experiment_id: exp_glomus_registry_incidence
          name: Registry-based incidence estimation
          description: Estimate glomus tumor incidence from a population cancer or national pathology
            registry (e.g. SEER), stratified by acral versus deep/visceral site, to replace the current
            qualitative RARE band with a rate.
        - experiment_id: exp_glomus_pooled_sex_ratio
          name: Site-stratified pooled analysis of sex ratio
          description: Pool published glomus tumor series with site stratification to test whether the
            apparent contradiction between female-predominant hand series and male-predominant deep/visceral
            molecular cohorts is explained by anatomic sampling.
      selected_evidence:
        snippet: Out of 17 patients, majority (n=12; 70.58%) were females.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
