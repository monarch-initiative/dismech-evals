        display_name: Malignant Glomus Tumor (Glomangiosarcoma)
        description: A rare aggressive form defined by deep location together with size greater than 2
          cm, the presence of atypical mitotic figures, or moderate-to-high nuclear grade with at least
          5 mitotic figures per 50 high-power fields. Capable of local recurrence and distant metastasis.
          Note that the three qualifying criteria are alternatives, and that high nuclear grade alone
          (symplastic glomus tumor) or a single worrisome feature alone (uncertain malignant potential)
          does NOT meet this definition.
      selected_evidence:
        snippet: 'Malignant glomus tumor: Tumors with a deep location and a size of more than 2 cm, or
          atypical mitotic figures'
        supports: SUPPORT
