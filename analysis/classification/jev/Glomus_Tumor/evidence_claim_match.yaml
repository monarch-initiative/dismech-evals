      assertion_type: Treatment
      assertion:
        name: MEK Inhibition for NF1-Deficient Tumors
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: 'For NF1-deficient glomus tumors there is no BRAF kinase to inhibit, so the proposed
          systemic strategy is direct MEK blockade downstream of the unrestrained RAS. This is an investigational,
          mechanism-derived rationale rather than an established standard: it is put forward in narrative
          review for multifocal, metastatic, or surgically challenging cases, and no glomus-tumor-specific
          trial or response series supports it yet. Selumetinib is named as the exemplar MEK inhibitor
          because it is the agent approved in NF1-associated plexiform neurofibroma, not because it has
          been tested in glomus tumor.'
        treatment_term:
          preferred_term: Targeted Therapy
          term:
            id: NCIT:C93352
            label: Targeted Therapy
          therapeutic_agent:
          - preferred_term: selumetinib
            term:
              id: CHEBI:90227
              label: selumetinib
      selected_evidence:
        snippet: RAS mitogen-activated protein kinase hyperactivation was observed in cultured NF1(-/-)
          glomus cells, reflecting a lack of inhibition of the pathway by functional neurofibromin, the
          protein product of NF1.
        supports: SUPPORT
