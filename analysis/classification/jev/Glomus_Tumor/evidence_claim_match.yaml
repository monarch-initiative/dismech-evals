      assertion:
        name: Glomuvenous Malformation
        display_name: Glomuvenous Malformation (Familial Multiple Glomangioma)
        description: An inherited, multifocal cutaneous vascular malformation caused by loss-of-function
          variants in GLMN (glomulin). Lesions are typically multiple, blue-purple, compressible plaques
          or nodules that are less painful than solitary solid glomus tumors, and they are inherited in
          an autosomal dominant pattern with incomplete penetrance explained by a paradominant somatic
          second hit.
      selected_evidence:
        snippet: Glomuvenous malformation (GVM) ("familial glomangioma") is a localised cutaneous vascular
          lesion histologically characterised by abnormal smooth muscle-like "glomus cells" in the walls
          of distended endothelium lined channels.
        supports: SUPPORT
