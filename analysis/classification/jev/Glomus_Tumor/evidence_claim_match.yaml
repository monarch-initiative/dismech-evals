      assertion_type: ClinicalTrial
      assertion:
        name: NCT03422679
        phase: PHASE_I
        status: TERMINATED
        description: 'Dose-escalation study of CB-103, an oral pan-NOTCH transcription-complex inhibitor,
          in adults with locally advanced or metastatic solid tumours and haematological malignancies
          characterised by NOTCH pathway alterations. Malignant glomus tumor is one of the registry-indexed
          conditions, making this the first trial to prospectively select glomus tumors on the basis of
          their MIR143-NOTCH driver. Seventy-nine patients enrolled overall and the study was stopped
          early; the ClinicalTrials.gov record gives the reason for stopping as a business reason, not
          demonstrated inefficacy. The peer-reviewed phase I report found a manageable safety profile
          and pharmacodynamic evidence of Notch target-gene downregulation, but limited single-agent antitumor
          activity: no objective responses and stable disease in 49%. The population was dominated by
          adenoid cystic carcinoma (40 of 79, 51%) and no glomus-tumor-specific outcome was reported,
          so these basket-level results must not be attributed to the glomus subgroup in either direction.'
        target_phenotypes:
        - preferred_term: Neoplasm
          term:
            id: HP:0002664
            label: Neoplasm
        notes: 'Two provenance points that matter for reading the TERMINATED status correctly. First,
          the ClinicalTrials.gov record states the reason for stopping as a business reason; that field
          is not present in the cached registry summary, so it is recorded here as prose rather than as
          an evidence snippet. Second, "terminated" here is not a negative efficacy verdict on glomus
          tumor: the phase I publication PMID:37712875 reports the outcome for an adenoid-cystic-carcinoma-dominated
          basket, with no glomus-tumor-specific result of any kind.'
      selected_evidence:
        snippet: investigate the safety, tolerability and preliminary efficacy of CB-103
        supports: SUPPORT
