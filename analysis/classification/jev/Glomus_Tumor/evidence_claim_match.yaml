              id: MONDO:0018327
              label: glomus tumor
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Glomuvenous malformation (GLMN-related)
        description: Modelled in this entry as a subtype rather than a wholly separate disease, but the
          boundary matters and is easy to blur. Sporadic solitary glomus tumour is a somatic, fusion-driven
          NEOPLASM; glomuvenous malformation is an inherited GLMN-related vascular MALFORMATION in which
          a somatic second hit (usually acquired uniparental isodisomy of 1p) unmasks the germline allele
          locally. They are not two presentations of one lesion, and evidence about one must not be transferred
          to the other.
        disease_term:
          preferred_term: glomuvenous malformation
          term:
            id: MONDO:0007672
            label: glomuvenous malformation
        distinguishing_features:
        - Multiple, multifocal, compressible blue-purple plaques rather than a solitary subungual nodule
        - Much less painful, and pain is not paroxysmal or cold-provoked
        - Germline GLMN loss of function with a somatic second hit (paradominant), not a MIR143-NOTCH
          fusion
        - Dilated venous channels with only a few layers of glomus cells, rather than solid sheets of
          glomus cells
      selected_evidence:
        snippet: Glomuvenous malformation (GVM) ("familial glomangioma") is a localised cutaneous vascular
          lesion histologically characterised by abnormal smooth muscle-like "glomus cells" in the walls
          of distended endothelium lined channels.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/7
      evidence_path: /differential_diagnoses/7/evidence/0
