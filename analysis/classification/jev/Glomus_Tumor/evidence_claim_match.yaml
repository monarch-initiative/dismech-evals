        name: Nociceptor-Rich and Mast-Cell-Rich Tumor Stroma
        biological_scale: TISSUE
        role: mediator
        description: 'Glomus tumors are unusually densely innervated: numerous unmyelinated nociceptive
          nerve fibers ramify among the tumor cells, and the stroma contains abundant mast cells that
          show ultrastructural evidence of degranulation in close apposition to those fibers. Release
          of histamine and other algogenic granule contents onto adjacent nociceptors, together with pressure
          transmitted by contraction of the smooth-muscle-like tumor cells within a confined subungual
          compartment, accounts for the disproportionate severity of pain relative to lesion size.'
        cell_types:
        - preferred_term: mast cell
          term:
            id: CL:0000097
            label: mast cell
        biological_processes:
        - preferred_term: sensory perception of pain
          modifier: INCREASED
          term:
            id: GO:0019233
            label: sensory perception of pain
        - preferred_term: mast cell degranulation
          modifier: INCREASED
          term:
            id: GO:0043303
            label: mast cell degranulation
      selected_evidence:
        snippet: Electron microscopy revealed various types and degrees of degranulation of mast cell
          granules, and also disclosed a close correlation between mast cells and non-myelinated nerve
          fibers.
        supports: SUPPORT
