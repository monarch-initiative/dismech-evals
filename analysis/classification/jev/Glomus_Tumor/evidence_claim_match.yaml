        biological_scale: CELLULAR
        role: central_effector
        description: Whichever driver lesion is present, the tumor is formed by clonal expansion of glomus
          cells, the modified perivascular smooth muscle cells of the thermoregulatory glomus body. Immunohistochemical
          expression of smoothelin confirms that these cells are genuinely contractile smooth muscle cells.
          The proliferating cells form solid nests and concentric cuffs around branching, ectatic vascular
          spaces, replacing the normal Sucquet-Hoyer canal architecture of the arteriovenous anastomosis,
          and deposit a continuous pericellular type IV collagen basement membrane that reflects their
          retained myoid phenotype.
        cell_types:
        - preferred_term: glomus cell (modified perivascular smooth muscle cell)
          term:
            id: CL:0000192
            label: smooth muscle cell
        - preferred_term: pericyte
          term:
            id: CL:0000669
            label: pericyte
        biological_processes:
        - preferred_term: smooth muscle cell proliferation
          modifier: INCREASED
          term:
            id: GO:0048659
            label: smooth muscle cell proliferation
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
        notes: 'Known split candidate, deliberately deferred. This node carries two claims at two scales:
          a CELLULAR clonal-expansion claim (glomus cells proliferate) and a TISSUE-scale architectural
          claim (they form concentric cuffs around ectatic channels, replace the Sucquet-Hoyer canal,
          and deposit pericellular type IV collagen). Per CLAUDE.md, two competing biological_scale values
          are the canonical bundling signal, and the correct fix is to split this into an atomic proliferation
          node and an atomic perivascular-architecture node. That is not done here because this node is
          the convergence point of all four driver arms and the target of the excision treatment: splitting
          it would re-target four incoming edges, four outgoing edges and one target_mechanisms reference
          mid-review. biological_scale is set to CELLULAR on the leading claim and the split is left as
          a follow-up.'
      selected_evidence:
        snippet: Glomus tumor (GT) is a rare mesenchymal neoplasm presumed to originate from the neuromyoarterial
          glomus body.
        supports: SUPPORT
