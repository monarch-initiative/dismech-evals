      assertion:
        name: Fructose Absorption Spared (GLUT5)
        description: Unlike glucose and galactose, fructose is absorbed across the apical enterocyte membrane
          by the facilitated transporter GLUT5 (SLC2A5), which is independent of SGLT1 and functions normally
          in GGM. This selective sparing is the basis for fructose-based dietary management and explains
          why fructose becomes the primary dietary carbohydrate source for affected patients.
        genes:
        - preferred_term: SLC2A5
          term:
            id: hgnc:11010
            label: SLC2A5
        molecular_functions:
        - preferred_term: fructose transmembrane transporter activity
          term:
            id: GO:0005353
            label: fructose transmembrane transporter activity
      selected_evidence:
        snippet: Often, glucose-galactose malabsorption patients are highly dependent on fructose, their
          primary source of carbohydrates.
        supports: SUPPORT
    origin:
