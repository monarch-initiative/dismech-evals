          while the protein still reaches the plasma membrane; most others cause defective trafficking
          of SGLT1 to the brush-border apical membrane.
      selected_evidence:
        snippet: Sequence analysis of the amplified products has revealed a single missense mutation in
          SGLT1 which cosegregates with the GGM phenotype and results in a complete loss of Na(+)-dependent
          glucose transport in Xenopus oocytes injected with this complementary RNA.
        supports: SUPPORT
