      assertion:
        name: Osmotic Diarrhea and Dehydration
        conforms_to: diet_induced_osmotic_diarrhea#Substrate-Dependent Watery Diarrhea and Nutritional
          Consequences
        description: Unabsorbed luminal glucose and galactose create an osmotic gradient that draws water
          into the intestinal lumen, producing severe watery diarrhea (HP:0033310 Osmotic diarrhea) beginning
          in the neonatal period; continued fluid and electrolyte losses lead to dehydration (HP:0001944),
          often hypernatremic, and metabolic acidosis if untreated. Diarrhea resolves rapidly on dietary
          elimination of glucose/galactose and recurs promptly on rechallenge, a pattern used diagnostically
          to confirm GGM.
      selected_evidence:
        snippet: Persistent diarrhea lead to prolonged hospitalisation and recurrent hypernatremic dehydration.
        supports: SUPPORT
