        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Glutarate Re-esterification to Glutaryl-CoA
        description: 'SUGCT performs a metabolite-repair reaction: it returns free glutarate to glutaryl-CoA
          so it can be oxidised by glutaryl-CoA dehydrogenase. When the reaction fails, glutarate becomes
          a dead-end metabolite, and the glutaryl-CoA-derived products fall relative to glutarate. The
          enzyme is most highly expressed in kidney and liver.'
        biological_scale: MOLECULAR
        chemical_entities:
        - preferred_term: glutaryl-CoA
          term:
            id: CHEBI:15524
            label: glutaryl-CoA
          modifier: DECREASED
      selected_evidence:
        snippet: Since glutaric acid would otherwise be a dead-end metabolite excreted in urine, this
          process is viewed as an example of metabolite repair.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
