        features: SUGCT (formerly C7orf10) on 7p14.1 encodes a mitochondrial class III CoA-transferase.
          Reported alleles include an Old Order Amish missense founder variant (c.895C>T, p.Arg299Trp
          in the original numbering), nonsense variants (p.Arg108Ter, p.Arg142Ter), a novel missense p.Arg322Trp,
          a frameshift, and homozygous contiguous deletions that also remove MPLKIP and cause trichothiodystrophy
          type 4.
      selected_evidence:
        snippet: Direct sequencing of C7orf10 revealed that the three Amish individuals were homozygous
          for a nonsynonymous sequence variant (c.895C-->T, Arg299Trp).
