            label: succinate-hydroxymethylglutarate CoA-transferase activity
          modifier: DECREASED
      selected_evidence:
        snippet: We then sequenced three non-Amish children with GA3 and discovered two nonsense mutations
          (c.322C-->T, Arg108Ter, and c.424C-->T, Arg142Ter) in addition to the Amish mutation.
        supports: SUPPORT
