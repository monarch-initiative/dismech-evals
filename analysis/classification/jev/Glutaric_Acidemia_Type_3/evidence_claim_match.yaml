        notes: ClinGen rates the SUGCT-GA3 relationship Moderate, not Definitive or Strong, because few
          cases are published. The relationship is recorded as CAUSATIVE because biallelic SUGCT loss
          is sufficient for the biochemical trait that defines the disorder, demonstrated by enzyme studies
          and by two independent mouse lines; it is not a claim that SUGCT variants cause any clinical
          illness.
