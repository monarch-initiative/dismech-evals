      assertion_type: Discussion
      assertion:
        discussion_id: controversy_ga3_clinical_significance
        prompt: Is glutaric acidemia type 3 a disease, or a benign biochemical trait ascertained through
          unrelated illness?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - disease#Glutaric Acidemia Type 3
        - phenotypes#Episodic vomiting
        rationale: 'The enzymatic defect and its urinary signature are well established, but no clinical
          phenotype has been attributed to GA3. The Amish probands and a newborn-screened infant were
          asymptomatic. Symptomatic reports are mostly confounded: one child had a 6q terminal deletion,
          one had Graves hyperthyroidism and gastroenteritis at ascertainment, one had a second diagnosis
          of BCAP31-related syndrome that explained his neurodevelopmental findings, and two had trichothiodystrophy
          type 4 from a deletion that also removed SUGCT. A white-matter abnormality on MRI in one patient
          and cyclic vomiting in another remain unexplained single observations.'
      selected_evidence:
        snippet: However, we consider that it would be premature to assume that this condition is completely
          benign in all individuals at all times.
        supports: SUPPORT
