      assertion:
        name: Erythrocyte Oxidative and Membrane Injury
        conforms_to: hemolytic_anemia_erythrocyte_destruction#Oxidative and Membrane Injury
        description: With the GSH antioxidant buffer depleted, oxidant exposure denatures hemoglobin and
          damages the erythrocyte membrane, reducing cell integrity and marking the cell for removal.
          The reserve capacity of GR in normal red cells is large, so impaired GSH recovery under oxidant
          stress emerges only when enzyme activity is almost completely lost.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: In red cells stressed by these reagents, GSSG-R deficiency began to impair the regeneration
          of GSH only after greater than 80% of the normal enzyme activity had been abolished.
        supports: SUPPORT
    origin:
