      assertion_type: DifferentialDiagnosis
      assertion:
        name: Glucose-6-phosphate dehydrogenase (G6PD) deficiency
        description: G6PD deficiency is the common cause of oxidant-triggered (including favism) nonspherocytic
          hemolytic anemia and shares the biochemical endpoint of impaired NADPH-dependent glutathione
          protection. Inhibition of GR produces a phenocopy of G6PD-deficient cells.
        distinguishing_features:
        - G6PD deficiency is X-linked and reflects deficient NADPH generation, whereas GR deficiency is
          autosomal recessive and reflects failure to regenerate GSH from GSSG downstream of NADPH.
      selected_evidence:
        snippet: Only erythrocytes that had been rendered almost totally GSSG-R deficient, that is, had
          lost greater than 90% of baseline activity, became functionally equivalent to GdA- glucose-6-phosphate
          dehydrogenase-deficient cells.
