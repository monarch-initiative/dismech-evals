            term:
              id: MONDO:0019531
              label: hemolytic anemia due to glutathione reductase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Thioredoxin System Compensation
        description: The thioredoxin/thioredoxin reductase system can reduce GSSG to GSH and acts as a
          functional backup for GR. In Gsr-knockout mice, inner-ear thioredoxin and thioredoxin reductase
          activities rose and no oxidative damage or hearing deficit developed. This compensation is a
          candidate explanation for why hemolysis in the human disorder has been reported after oxidant
          triggers, but it has not been measured in GR-deficient patients, and any dampening effect on
          hemolysis is hypothesized rather than shown.
        biological_scale: MOLECULAR
        role: compensation
        molecular_functions:
        - preferred_term: thioredoxin-disulfide reductase (NADPH) activity
          term:
            id: GO:0004791
            label: thioredoxin-disulfide reductase (NADPH) activity
          modifier: INCREASED
      selected_evidence:
        snippet: Gsr deficiency resulted in increased activities of cytosolic thioredoxin and thioredoxin
          reductase in the inner ears.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28686716
      reference_title: 'GSR is not essential for the maintenance of antioxidant defenses in mouse cochlea:
