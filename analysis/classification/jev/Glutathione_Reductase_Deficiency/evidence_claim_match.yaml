        description: A chemically induced glutathione reductase mutant at the Gr1 structural locus on
          mouse chromosome 8. Homozygotes retain about 2% of normal blood GR activity, with the loss present
          in blood and other tissues. Without an oxidant challenge their erythrocyte indices are normal,
          as baseline red-cell GSH is normal in GR-deficient patients; triggered hemolysis was not tested.
        genes:
        - preferred_term: Gsr
          term:
            id: hgnc:4623
            label: GSR
        modeled_mechanisms:
        - target: GSR Loss-of-Function and Absent Glutathione Reductase Activity
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          limitations: The mouse allele is a chemically induced mutation at the Gr1 locus, not a human
            GSR variant, and leaves about 2% residual activity where the human enzyme-null patients have
            essentially none. The study measured erythrocyte indices only without an oxidant challenge,
            so it says nothing about oxidant-triggered hemolysis.
      selected_evidence:
        snippet: Homozygous mutants with only 2% residual enzyme activity were recovered in progeny of
          inter se matings of heterozygotes.
        supports: SUPPORT
