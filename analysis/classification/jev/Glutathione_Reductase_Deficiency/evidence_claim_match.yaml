        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure to Regenerate Reduced Glutathione
        description: Without GR, erythrocytes cannot reduce GSSG back to GSH after an oxidant challenge,
          so the reduced-glutathione pool collapses under oxidative stress. Baseline GSH may appear near-normal
          because little is consumed at rest, but glutathione stability during an oxidant challenge is
          severely diminished.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: glutathione metabolic process
          term:
            id: GO:0006749
            label: glutathione metabolic process
          modifier: DYSREGULATED
        chemical_entities:
        - preferred_term: glutathione disulfide
          term:
            id: CHEBI:17858
            label: glutathione disulfide
          modifier: INCREASED
        - preferred_term: glutathione
          term:
            id: CHEBI:16856
            label: glutathione
          modifier: DECREASED
      selected_evidence:
        snippet: Severely diminished glutathione stability during incubation with acetylphenylhydrazine
          was observed in the erythrocytes of the siblings
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:947404
