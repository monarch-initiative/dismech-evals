        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GSR Loss-of-Function and Absent Glutathione Reductase Activity
        description: Biallelic GSR variants abolish glutathione-disulfide reductase activity. GR is the
          NADPH- and FAD-dependent flavoenzyme that reduces oxidized glutathione disulfide (GSSG) back
          to reduced glutathione (GSH). In affected erythrocytes and leukocytes the enzyme protein is
          unstable or undetectable and GR activity is essentially absent and cannot be restored by FAD
          in vitro or by riboflavin in vivo, distinguishing the genetic defect from acquired FAD-undersaturation.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: glutathione-disulfide reductase (NADPH) activity
          term:
            id: GO:0004362
            label: glutathione-disulfide reductase (NADPH) activity
          modifier: DECREASED
        chemical_entities:
        - preferred_term: FAD
          term:
            id: CHEBI:16238
            label: FAD
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The enzyme activity could not be restored either by addition of FAD in vitro or by administration
          of riboflavin in vivo.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
