        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acquired (riboflavin-deficiency) low erythrocyte glutathione reductase activity
        description: Low red-cell GR activity is far more commonly acquired, resulting from dietary riboflavin
          (vitamin B2) insufficiency that leaves the GR apoenzyme undersaturated with its FAD cofactor.
          Unlike the hereditary defect, this activity is restored in vitro by FAD and in vivo by riboflavin
          supplementation, and it is not a genetic subtype of this disorder.
        distinguishing_features:
        - Restoration of GR activity by FAD in vitro or riboflavin in vivo indicates acquired FAD undersaturation
          rather than a structural GSR defect; hereditary deficiency is non-restorable.
      selected_evidence:
        snippet: Stimulation of glutathione reductase activity of red cells of normal subjects occurred
          when they were given 5 milligrams of riboflavin daily for 8 days.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
