        name: Glutathione synthetase molecular function deficiency
        description: 'Biallelic GSS variants reduce glutathione synthetase (glutathione synthase) activity,
          the ATP-dependent enzyme that condenses gamma-glutamylcysteine with glycine in the second and
          final step of glutathione biosynthesis. Most disease alleles are missense with residual activity;
          complete loss of both alleles is thought to be lethal.

          '
