          term:
            id: GO:0006750
            label: glutathione biosynthetic process
          modifier: DECREASED
        chemical_entities:
        - preferred_term: L-gamma-glutamyl-L-cysteine
          term:
            id: CHEBI:17515
            label: L-gamma-glutamyl-L-cysteine
        - preferred_term: glutathione
          term:
            id: CHEBI:16856
            label: glutathione
          modifier: DECREASED
      selected_evidence:
        snippet: "enzymatic block of the gamma-glutamyl cycle leads to a \ngeneralized glutathione deficiency."
