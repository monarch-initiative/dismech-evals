        relationship_type: CAUSATIVE
        variants:
        - name: ALDOA c.386A>G p.Asp128Gly
          description: The first molecularly defined allele, homozygous in a patient with haemolytic anaemia.
            Asp128 is conserved across aldolases A, B and C from humans to Drosophila.
          clinical_significance: PATHOGENIC
        - name: ALDOA p.Arg303X and p.Cys338Tyr, compound heterozygous
          description: A nonsense allele in the enzyme active site in trans with a destabilizing missense
            allele, in the most severely affected patient reported.
          clinical_significance: PATHOGENIC
        - name: ALDOA c.619G>A p.Glu207Lys
          description: Homozygous in two brothers with neonatal-onset disease, the most severe end of
            the reported spectrum.
          clinical_significance: PATHOGENIC
        - name: ALDOA c.971C>T p.Ala324Val
          description: A likely pathogenic allele reported in a patient whose rhabdomyolysis required
            haemodialysis.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: Autosomal recessive mutations in ALDOA, are extremely rare and cause hemolytic anemia
          and/or recurrent episodes of rhabdomyolysis, usually precipitated by fever.
        supports: SUPPORT
