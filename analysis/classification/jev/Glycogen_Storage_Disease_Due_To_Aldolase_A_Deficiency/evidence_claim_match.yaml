        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gsd12_arginine_rescue_mechanism
        kind: KNOWLEDGE_GAP
        prompt: By what mechanism does arginine rescue aldolase A deficiency in patient myoblasts, and
          does it work in patients?
        attaches_to:
        - pathophysiology#Thermolability of Residual Aldolase A Activity
        rationale: Arginine restored aldolase A activity in patient myoblasts while three other established
          chemical chaperones did not, which the authors take as evidence that it is not acting as a chaperone.
          What it is doing instead is unknown, and the result has not been tested in a patient. This is
          the only reported lead toward a mechanism-directed therapy for the disease, so the gap is worth
          naming rather than folding into supportive care.
      selected_evidence:
        snippet: The aldolase A deficiency was rescued by arginine supplementation in vitro but not by
          glycerol, betaine or benzylhydantoin, three other known chaperones, suggesting that arginine-mediated
          rescue operated by a mechanism other than protein chaperoning.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
