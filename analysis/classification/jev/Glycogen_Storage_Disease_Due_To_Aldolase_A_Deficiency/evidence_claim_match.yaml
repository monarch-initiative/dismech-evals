  f368efde7fd3dbfaa16933c82ecf35f2f0e66bfabf00733f8e7776ccb9bb1bc5:
    claim:
      about:
        disease:
          name: Glycogen Storage Disease Due To Aldolase A Deficiency
          disease_term:
            preferred_term: glycogen storage disease type XII
            term:
              id: MONDO:0012747
              label: glycogen storage disease due to aldolase A deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gsd12_tissue_selective_thermolability
        kind: KNOWLEDGE_GAP
        prompt: Why is the thermolability of a mutant aldolase A tissue-selective, sparing erythrocytes
          in some families?
        attaches_to:
        - pathophysiology#Thermolability of Residual Aldolase A Activity
        rationale: The same protein is expressed in both affected tissues, so a purely intrinsic thermodynamic
          defect should affect both. One family had thermolability that affected myoblasts but not erythrocytes,
          which implies that something about the cellular context modulates the mutant enzyme's stability.
          Nothing in the reported literature identifies what. Until it is known, an entry cannot predict
          from genotype which of the two organs a given patient will present with.
      selected_evidence:
        snippet: Our results expand the clinical spectrum of aldolase A deficiency to isolated temperature-dependent
          rhabdomyolysis, and suggest that thermolability may be tissue specific.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
