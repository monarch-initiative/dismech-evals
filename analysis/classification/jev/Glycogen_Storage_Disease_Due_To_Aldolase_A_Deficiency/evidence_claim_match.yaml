      reference_title: A thermolabile aldolase A mutant causes fever-induced recurrent rhabdomyolysis
        without hemolytic anemia.
      evidence_source: IN_VITRO
      explanation: The rescue, the negative controls, and the authors' own statement that the mechanism
        is not chaperoning.
