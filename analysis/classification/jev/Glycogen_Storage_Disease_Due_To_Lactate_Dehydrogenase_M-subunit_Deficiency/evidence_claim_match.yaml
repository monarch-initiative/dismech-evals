        - preferred_term: ATP metabolic process
          modifier: DECREASED
          term:
            id: GO:0046034
            label: ATP metabolic process
      selected_evidence:
        snippet: For this reason, ATP production was significantly impaired and muscle cells were damaged
          in these patients.
        supports: SUPPORT
