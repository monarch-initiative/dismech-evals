      assertion:
        name: Abortive Glycolysis and Muscle ATP Deficit
        biological_scale: CELLULAR
        description: The net result is that skeletal muscle cannot generate ATP anaerobically at the rate
          that brief maximal effort demands. Oxidative metabolism is intact — maximal oxygen uptake is
          73-92% of control and the respiratory exchange ratio rises normally above 1.0 — so endurance
          activity is tolerated and the deficit is specific to short, high-intensity, anaerobic work.
          Muscle compensates by activating AMP deaminase, which is why the ammonium response to a forearm
          exercise test is exaggerated to 25-30 times baseline while the lactate response is flat.
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
