            term:
              id: MONDO:0013047
              label: glycogen storage disease due to lactate dehydrogenase M-subunit deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cytosolic NADH Reoxidation Failure
        biological_scale: MOLECULAR
        description: 'During high-intensity exercise, mitochondrial NADH oxidation cannot keep pace with
          glycolytic flux, and the LDH reaction is what regenerates cytosolic NAD+. Without it NADH accumulates
          and glyceraldehyde-3-phosphate dehydrogenase, which requires NAD+, is inhibited. Glycolysis
          is therefore retarded at that step, and the metabolites immediately above it — glyceraldehyde
          3-phosphate, dihydroxyacetone phosphate and fructose 1,6-bisphosphate — accumulate. This is
          the reason the lactate curve on a forearm exercise test is flat while pyruvate rises steeply:
          pyruvate is produced but cannot be reduced.'
        biological_processes:
        - preferred_term: glycolytic process
          modifier: DECREASED
          term:
            id: GO:0006096
            label: glycolytic process
        - preferred_term: pyruvate metabolic process
          modifier: ABNORMAL
          term:
            id: GO:0006090
            label: pyruvate metabolic process
      selected_evidence:
        snippet: The glycolysis retardation may be attributed to the impaired reoxidation of NADH produced
          by GA3PD action.
        supports: SUPPORT
