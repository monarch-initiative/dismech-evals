            term:
              id: MONDO:0013047
              label: glycogen storage disease due to lactate dehydrogenase M-subunit deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of maximal anaerobic exertion
        description: The only management with a mechanistic rationale. Because the defect is confined
          to anaerobic ATP supply and oxidative capacity is preserved, endurance and moderate activity
          are tolerated while short maximal efforts — sprinting, competitive contact sport, isometric
          loading — are what precipitate rhabdomyolysis. Patients are advised to pace effort and to seek
          care for dark urine. This is standard metabolic myopathy advice rather than an LDHA-specific
          intervention tested in a trial.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: activity modification to avoid anaerobic exertion
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: No controlled study of activity modification in this disorder exists. The recommendation
          follows from the metabolic physiology and from the observation that patients are asymptomatic
          under ordinary circumstances.
      selected_evidence:
        snippet: Maximal oxygen uptake in the patients with severe and mild symptoms was approximately
          73% and 92% of control.
        supports: SUPPORT
