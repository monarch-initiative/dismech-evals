  0e431c0d9a1d32b1bac36c7e80db6a096dbec617e5a9f0f29cd04c33dd2ca948:
    claim:
      about:
        disease:
          name: Glycogen Storage Disease Due To Lactate Dehydrogenase M-subunit Deficiency
          disease_term:
            preferred_term: glycogen storage disease due to lactate dehydrogenase M-subunit deficiency
            term:
              id: MONDO:0013047
              label: glycogen storage disease due to lactate dehydrogenase M-subunit deficiency
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: McArdle disease (GSD V, PYGM)
        description: 'The closest mimic: exercise intolerance, exertional rhabdomyolysis and a flat lactate
          curve on the forearm test. The discriminator is pyruvate — it rises steeply in LDHA deficiency
          because the block is below pyruvate, and does not in McArdle disease because the block is at
          glycogen breakdown, above it. McArdle disease also shows a second-wind phenomenon, which LDHA
          deficiency does not, and has no cutaneous phenotype.'
      selected_evidence:
