        context: []
      assertion_type: Diagnosis
      assertion:
        name: Forearm exercise test with lactate, pyruvate and ammonium
        description: The functional test of choice. In an affected patient the venous lactate curve is
          flat, as it is in McArdle disease, but pyruvate rises steeply instead — that pyruvate rise is
          what separates a terminal glycolytic block from a glycogenolytic one. The ammonium response
          is exaggerated, around 25 to 30 times baseline against a normal 5 to 10 times, because AMP deaminase
          is recruited to compensate.
      selected_evidence:
        snippet: 'The response to ischemic forearm work is characteristic in these three families: an
          increase of venous lactate concentration after ischemic work was not observed and a marked increase
          of venous pyruvate was found.'
        supports: SUPPORT
