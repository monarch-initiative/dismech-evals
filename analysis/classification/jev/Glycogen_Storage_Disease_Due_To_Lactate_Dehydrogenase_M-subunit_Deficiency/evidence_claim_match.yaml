            term:
              id: MONDO:0013047
              label: glycogen storage disease due to lactate dehydrogenase M-subunit deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: LDHA Loss and Muscle Lactate Dehydrogenase Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic LDHA variants abolish the M subunit of lactate dehydrogenase. The reported
          alleles are nulls — a recurrent 20-base-pair frameshifting deletion in exon 6, nonsense variants
          such as p.Ser137Ter and p.Trp250Ter, and a frameshifting deletion in exon 7 — and the truncated
          protein is degraded rather than made. Because functional LDH is a tetramer assembled from M
          and H subunits, losing M removes four of the five isoenzymes: only H4 (LDH-1) survives, so the
          serum isoenzyme pattern collapses to a single band. Residual LDH activity in skeletal muscle,
          where the M subunit normally predominates, falls below 5% of control.'
        genes:
        - preferred_term: LDHA
          term:
            id: hgnc:6535
            label: LDHA
        genetic_context:
          gene:
            preferred_term: LDHA
            term:
              id: hgnc:6535
              label: LDHA
          allele_type: FRAMESHIFT
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Null alleles on both chromosomes. The most prevalent variant is a 20-base-pair
            deletion in exon 6 producing a premature stop; nonsense and other frameshifting alleles have
            the same consequence.
        molecular_functions:
        - preferred_term: L-lactate dehydrogenase (NAD+) activity
          modifier: DECREASED
          term:
            id: GO:0004459
            label: L-lactate dehydrogenase (NAD+) activity
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: The nucleotide sequences of seven protein-coding exons were determined and a deletion
          of 20 base-pairs in exon 6 was found. This mutation results in a frame-shift translation and
          premature termination.
        supports: SUPPORT
    origin:
