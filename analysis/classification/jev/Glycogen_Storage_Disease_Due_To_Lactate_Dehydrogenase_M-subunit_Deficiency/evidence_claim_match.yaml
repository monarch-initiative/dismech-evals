        context: []
      assertion_type: Genetic
      assertion:
        name: LDHA
        gene_term:
          preferred_term: LDHA
          term:
            id: hgnc:6535
            label: LDHA
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'LDHA at 11p15.1 has seven protein-coding exons and encodes the 331-amino-acid M subunit
          of lactate dehydrogenase. Reported disease alleles are predominantly null: a recurrent 20-base-pair
          deletion in exon 6 (the most prevalent variant, truncating the protein at 259 residues), the
          nonsense variants c.410C>A (p.Ser137Ter) and c.750G>A (p.Trp250Ter), and a frameshifting c.766_767delGT
          in exon 7. A splice variant and a small insertion have also been described.'
        variants:
        - name: 20-base-pair deletion in exon 6
          type: FRAMESHIFT
          description: The most prevalent reported allele. Frameshift and premature termination yield
            a 259-residue product that is not detectable immunologically.
        - name: NM_005566:c.410C>A (p.Ser137Ter)
          type: NONSENSE
          description: Found homozygous in one Spanish proband and compound heterozygous with c.750G>A
            in a second, on a shared haplotype.
        - name: NM_005566:c.766_767delGT
          type: FRAMESHIFT
          description: Homozygous exon 7 frameshift in a consanguineous North African family, with myopathy
            and severe treatment-resistant acne.
      selected_evidence:
        snippet: Exome analysis revealed a novel bi-allelic frameshifting deletion in exon 7 of the LDHA
          gene; c.766_767delGT.
        supports: SUPPORT
