        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum LDH isoenzyme pattern restricted to LDH-1 (H4)
        notes: Electrophoretic separation of serum or erythrocyte LDH isoenzymes shows a single band.
          Normally five tetramers are present (H4, H3M, H2M2, HM3, M4); with no M subunit, only H4 can
          be assembled. This is a cheap, decisive test, and it is diagnostic in a way that total LDH activity
          is not — total serum LDH is often normal or even raised, because the surviving H4 band is upregulated
          and because muscle damage releases what enzyme there is.
      selected_evidence:
        snippet: Electrophoretic analysis of serum LDH isoenzymes of the propositus demonstrated only
          one activity band of LDH H4.
        supports: SUPPORT
