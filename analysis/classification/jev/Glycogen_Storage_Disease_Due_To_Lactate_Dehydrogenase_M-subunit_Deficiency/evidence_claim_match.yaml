      assertion:
        name: Exertional Myocyte Injury
        biological_scale: TISSUE
        description: 'Damaged fibres release their cytosolic contents — creatine kinase and myoglobin
          — into the circulation, producing the biochemical and clinical picture of rhabdomyolysis. The
          structural correlate on biopsy is subtle: rare subsarcolemmal vacuoles, with LDHA immunostaining
          showing intracytoplasmic aggregates instead of the normal diffuse pattern, which has been described
          as a metabolic-driven vacuolar myopathy. Crucially the injury is episodic and exertion-dependent;
          between episodes patients are neurologically and biochemically much closer to normal, and there
          is no fixed weakness or atrophy.'
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: Consequently, the cytosolic enzymes and proteins such as creatine kinase and myoglobin
          were released into the blood stream.
