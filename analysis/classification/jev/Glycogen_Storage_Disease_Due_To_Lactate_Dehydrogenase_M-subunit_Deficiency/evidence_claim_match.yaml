            term:
              id: MONDO:0013047
              label: glycogen storage disease due to lactate dehydrogenase M-subunit deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Glycerol-3-Phosphate Shunt Compensation
        biological_scale: MOLECULAR
        description: 'Skeletal muscle cytosol is rich in alpha-glycerophosphate (glycerol 3-phosphate)
          dehydrogenase, which reoxidizes NADH by reducing dihydroxyacetone phosphate. This partially
          rescues the redox imbalance, but at a cost: it drains triose phosphates out of glycolysis, so
          the pathway becomes abortive rather than merely slow. How much of this shunt a patient has appears
          to set how severe the disease is — muscle glycerol-3-phosphate dehydrogenase activity was three
          times control in mildly affected patients and the sum of muscle pyruvate plus lactate was 65%
          of control in the mild group against 35% in the severe group, despite an identical LDHA genotype.'
        biological_processes:
        - preferred_term: glycerol-3-phosphate metabolic process
          modifier: INCREASED
          term:
            id: GO:0006072
            label: glycerol-3-phosphate metabolic process
      selected_evidence:
        snippet: This enzyme reoxidizes the excess NADH and drains triose phosphates from the glycolytic
          pathway under anaerobic conditions.
        supports: SUPPORT
