        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Epidermal and Follicular Glycolytic Failure
        biological_scale: TISSUE
        description: The second affected tissue is skin. Epidermal keratinocytes and the hair follicle
          depend heavily on glycolysis, and direct enzyme histochemistry in an affected patient found
          the epidermis of the lesional skin and the scalp hair follicles virtually devoid of LDH activity.
          The clinical result is a psoriasis-like eruption — erythematosquamous plaques on extensor surfaces,
          annular erythema, or frankly pustular psoriasiform lesions — that characteristically flares
          in warm weather and remits in autumn. Not every patient develops it, and in some it appears
          decades after the muscle phenotype is diagnosed, so it is best treated as a late and variable
          manifestation of the same enzyme defect rather than an obligate feature. The mechanism connecting
          the LDH deficit to psoriasiform inflammation is not established.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: hair follicular keratinocyte
          term:
            id: CL:2000092
            label: hair follicular keratinocyte
        molecular_functions:
        - preferred_term: L-lactate dehydrogenase (NAD+) activity
          modifier: DECREASED
          term:
            id: GO:0004459
            label: L-lactate dehydrogenase (NAD+) activity
      selected_evidence:
        snippet: These cases indicate that abnormal activity of LDH can induce pustular psoriatic lesions
          in the long term.
        supports: SUPPORT
