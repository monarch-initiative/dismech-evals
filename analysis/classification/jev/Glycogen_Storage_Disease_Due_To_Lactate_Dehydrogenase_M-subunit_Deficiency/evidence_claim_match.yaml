        - path: /animal_models/0
          value:
            name: Drosophila Ldh null larva (Ldh16/Ldh17)
            species: Drosophila melanogaster
            genotype: Ldh16/Ldh17 trans-heterozygous null
            publication: PMID:42465323
            description: Drosophila expresses a single LDH enzyme, so a trans-heterozygous null removes
              lactate dehydrogenase activity outright. Null larvae are viable at rest but die when forced
              to move continuously, and are slower in goal-directed crawling; a rescuing Ldh transgene
              abolishes both effects. This is currently the only published whole-organism model that reproduces
              the exertion-dependent character of the human disease.
            notes: 'PMID:42465323 is a bioRxiv preprint and has not been peer reviewed; the model is recorded
              with that caveat rather than withheld, because it is the only organism-level model of this
              disease in the literature. No mouse model of GSD XI exists: a PubMed search for Ldha-deficient
              mice with a muscle or exercise phenotype returns cancer and metabolism studies plus a 1987
              hemolytic-anaemia mouse mutant (PMID:3315726), none of which model the human exertional
              myopathy.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Abortive Glycolysis and Muscle ATP Deficit
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: 'Loss of LDH leaves the animal normal at rest and failing under sustained physical
          demand, which is the defining shape of the human node: an ATP deficit that appears only when
          glycolytic flux must be sustained anaerobically.'
        limitations: Drosophila has one LDH rather than the M/H subunit system, so the model cannot reproduce
          the tissue-restricted deficiency, the surviving H4 isoenzyme, or the diagnostic serum isoenzyme
          pattern that define the human disease. The endpoint is larval death during forced movement,
          which has no human counterpart -- LDHA-deficient people are exercise intolerant, not at risk
          of death from exertion -- and the authors report that muscle-specific rescue does not restore
          viability, so the fly phenotype is not muscle-autonomous in the way the human myopathy is. The
          NAD+-regeneration mechanism that would link this model to the node is offered as an interpretation,
          not measured. Neither rhabdomyolysis nor myoglobinuria is assayed.
        readouts:
        - name: Survival during forced-movement exertion challenge
          target: Abortive Glycolysis and Muscle ATP Deficit
          direction: DECREASED
          interpretation: Exertion-dependent failure, absent at rest and absent in the transgenic rescue,
            is the model's closest correlate of the human exercise intolerance.
        - name: Crawling speed and time to reach a food source
          target: Abortive Glycolysis and Muscle ATP Deficit
          direction: DECREASED
          interpretation: Baseline locomotor impairment, measured separately from the exertion challenge;
            it shows the deficit is not confined to extreme effort.
      selected_evidence:
        snippet: This exertion-dependent phenotype closely parallels the clinical presentation of LDHA
          deficiency in humans, where symptoms such as muscle pain, weakness, and rhabdomyolysis are typically
          triggered by physical activity rather than evident at rest
        supports: SUPPORT
