        context:
        - path: /pathophysiology/0
          value:
            name: Muscle Phosphoglycerate Mutase Deficiency
            biological_scale: MOLECULAR
            description: Biallelic PGAM2 variants (nonsense, frameshift and missense) abolish or severely
              reduce the M subunit of phosphoglycerate mutase. Because normal adult muscle derives about
              95% of its PGAM activity from the MM homodimer, residual activity in patient muscle is typically
              3-10% of normal and is carried by the BB isoenzyme. Tissues that rely on the BB isoenzyme,
              including cultured aneural muscle cells, are spared, which explains why the disease is confined
              to skeletal muscle.
            genes:
            - preferred_term: PGAM2
              term:
                id: hgnc:8889
                label: PGAM2
            molecular_functions:
            - preferred_term: phosphoglycerate mutase activity
              modifier: DECREASED
              term:
                id: GO:0004619
                label: phosphoglycerate mutase activity
            cell_types:
            - preferred_term: skeletal muscle fiber
              term:
                id: CL:0008002
                label: skeletal muscle fiber
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Partial Terminal Glycolytic Block
        description: Loss of PGAM activity interrupts glycolysis at the 3-phosphoglycerate to 2-phosphoglycerate
          step. The block is partial because of the residual BB isoenzyme activity.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Studies of anaerobic glycolysis in vitro showed decreased lactate production with glycogen,
          and with all hexose phosphate glycolytic intermediates, which was corrected by addition of purified
          PGAM to the reaction mixtures.
        supports: SUPPORT
