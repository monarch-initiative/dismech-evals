        description: Proposed mechanism for the cramps and contractures of GSD X, and possibly for its
          characteristic tubular aggregates, which are stacks of tubules derived from the sarcoplasmic
          reticulum. In one patient, muscle calcium content and Ca2+-ATPase activity were increased, and
          dantrolene, which inhibits calcium release from the sarcoplasmic reticulum, abolished exertional
          contractures. The authors inferred that cramps result from calcium release that outstrips re-uptake
          capacity. The trigger for tubular aggregate formation in GSD X is unknown.
