            term:
              id: MONDO:0009865
              label: glycogen storage disease due to phosphoglycerate mutase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Muscle Phosphoglycerate Mutase Deficiency
        biological_scale: MOLECULAR
        description: Biallelic PGAM2 variants (nonsense, frameshift and missense) abolish or severely
          reduce the M subunit of phosphoglycerate mutase. Because normal adult muscle derives about 95%
          of its PGAM activity from the MM homodimer, residual activity in patient muscle is typically
          3-10% of normal and is carried by the BB isoenzyme. Tissues that rely on the BB isoenzyme, including
          cultured aneural muscle cells, are spared, which explains why the disease is confined to skeletal
          muscle.
        genes:
        - preferred_term: PGAM2
          term:
            id: hgnc:8889
            label: PGAM2
        molecular_functions:
        - preferred_term: phosphoglycerate mutase activity
          modifier: DECREASED
          term:
            id: GO:0004619
            label: phosphoglycerate mutase activity
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: The glycolytic enzyme phosphoglycerate mutase (PGAM) is a dimer, and mature human skeletal
          muscle contains almost exclusively the MM form of the enzyme, PGAM-M.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8447317
      reference_title: The molecular genetic basis of muscle phosphoglycerate mutase (PGAM) deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that muscle depends on the M-subunit homodimer, so a PGAM2 defect is not
        buffered in muscle by another isoform.
