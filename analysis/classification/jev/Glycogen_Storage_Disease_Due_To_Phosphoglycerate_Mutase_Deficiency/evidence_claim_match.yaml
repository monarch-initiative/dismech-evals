        name: Muscle biopsy with phosphoglycerate mutase enzymology
        description: Muscle biopsy shows reduced PGAM activity with normal activities of the other glycolytic
          enzymes, and often tubular aggregates in type 2 fibres. Light microscopy can be nearly normal.
          The clinical triad of exercise-induced cramps, recurrent myoglobinuria and tubular aggregates
          on biopsy is highly suggestive of the diagnosis.
      selected_evidence:
        snippet: Muscle biopsy showed only mild abnormalities, but biochemical study revealed a defect
          of PGAM and genetic analysis showed two different mutations in the PGAM-M gene.
        supports: SUPPORT
