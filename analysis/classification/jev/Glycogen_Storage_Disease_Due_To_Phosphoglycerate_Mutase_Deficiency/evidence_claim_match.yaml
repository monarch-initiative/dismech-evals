        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is there an animal model of muscle PGAM (PGAM2) deficiency?
        attaches_to:
        - pathophysiology#Muscle Phosphoglycerate Mutase Deficiency
        rationale: The genetically modified phosphoglycerate mutase mice reported are a Pgam1 knockout,
          which is embryonic lethal when homozygous, and a Pgam2 overexpressing transgenic; neither models
          loss of the muscle isoform. Without a Pgam2 loss-of-function model, the exertional energy deficit,
          the calcium imbalance and tubular aggregate formation cannot be studied experimentally.
        proposed_experiments:
        - experiment_id: exp_gsd10_pgam2_knockout_mouse
          name: Pgam2 loss-of-function mouse with exercise and muscle histology phenotyping
          description: Generate a Pgam2 null or W78X knock-in mouse and assess high-intensity exercise
            tolerance, exertional CK release, muscle calcium handling and tubular aggregate formation.
      selected_evidence:
        snippet: We observed that homozygous knockout mice of Pgam1 were embryonic lethal.
        supports: SUPPORT
