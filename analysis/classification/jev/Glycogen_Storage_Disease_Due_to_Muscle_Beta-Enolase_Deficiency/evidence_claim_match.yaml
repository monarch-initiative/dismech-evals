        name: Muscle biopsy with beta-enolase enzymology
        description: Diagnosis rests on muscle enzymology together with molecular genetics. Beta-enolase
          protein is reduced on immunohistochemistry and immunoblotting while alpha-enolase is preserved,
          and muscle histology shows only minimal changes, so a normal-looking biopsy does not exclude
          the diagnosis.
      selected_evidence:
        snippet: The beta-enolase protein was dramatically reduced in the muscle of our patient, by both
          immunohistochemistry and immunoblotting, while alpha-enolase was normally represented.
        supports: SUPPORT
