              label: glycogen storage disease due to muscle beta-enolase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Beta-Enolase Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic ENO3 variants reduce or abolish muscle beta-enolase. Two distinct molecular
          routes are documented: destabilising missense substitutions that lower the amount of correctly
          folded dimeric enzyme, and variants that leave higher residual activity but alter the enzyme''s
          kinetic profile. Beta-enolase accounts for over 90% of enolase activity in adult human muscle,
          so there is no effective isoform redundancy in that tissue.'
        genes:
        - preferred_term: ENO3
          term:
            id: hgnc:3354
            label: ENO3
        molecular_functions:
        - preferred_term: phosphopyruvate hydratase activity
          modifier: DECREASED
          term:
            id: GO:0004634
            label: phosphopyruvate hydratase activity
      selected_evidence:
        snippet: A severe muscle enolase deficiency, with 5% of residual activity, was detected in a 47-year-old
          man affected with exercise intolerance and myalgias.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
