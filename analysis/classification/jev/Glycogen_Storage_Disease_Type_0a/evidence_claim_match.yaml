      assertion_type: Discussion
      assertion:
        discussion_id: open_gsd0a_benign_framing_long_term
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - phenotypes#Short Stature
        - phenotypes#Osteopenia
        prompt: Is the good long-term prognosis of GSD 0a established, or is it an artefact of a small
          and young reported cohort?
        rationale: The disease is repeatedly described as comparatively benign, and the supporting observations
          are real - fasting tolerance improves with age, four reported pregnancies all produced healthy
          offspring, and the hepatic and renal complications of the storage-side glycogenoses have not
          been reported. But "have not been reported" in a literature of fewer than thirty patients, most
          of them children, is a weak negative. Short stature and osteopenia are already acknowledged
          as common, and both are the kind of finding that accumulates with duration of poor metabolic
          control rather than appearing early. The question is whether adult follow-up would leave the
          benign framing intact or add chronic morbidity to it.
      selected_evidence:
        snippet: Short stature and osteopenia are common features, but other long-term complications,
          common in other types of GSD, have not been reported in GSD0.
        supports: SUPPORT
    origin:
