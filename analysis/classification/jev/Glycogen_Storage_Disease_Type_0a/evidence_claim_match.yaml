      assertion_type: Pathophysiology
      assertion:
        name: Gluconeogenic Substrate Limitation on Prolonged Fasting
        biological_scale: ORGANISM
        description: An amplifying loop that explains why a fast that is tolerated for hours can decompensate
          abruptly. Severe hyperketonemia and elevated free fatty acids suppress alanine release from
          skeletal muscle; alanine is the principal gluconeogenic precursor, and gluconeogenesis is the
          only remaining route to hepatic glucose output. The compensation that keeps this disease mild
          is therefore self-limiting.
      selected_evidence:
        snippet: With more prolonged fasting, however, severe hyperketonemia and free fatty acid elevation
          inhibit release of alanine from skeletal muscle leading to decreased gluconeogenic precursors
          and worsening hypoglycemia.
        supports: SUPPORT
