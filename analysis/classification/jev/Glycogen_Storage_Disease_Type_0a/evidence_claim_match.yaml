          of fifty children with ketotic hypoglycemia and an otherwise normal profile carried a GYS2 variant
          - so the disease is not a large hidden fraction of that presentation either. Both bounds are
          curated here rather than averaged, because they answer different questions: the case count says
          how many have been found, the sequencing study says how enriched one plausible screening population
          is.'
        proposed_experiments:
        - experiment_id: exp_gsd0a_paired_profile_enriched_sequencing
          name: GYS2 sequencing in children selected on the paired fed/fasted profile rather than on ketotic
            hypoglycaemia alone
          description: The one sequencing study available selected on ketotic hypoglycaemia with an otherwise
            normal biochemical profile and found a 1-in-50 yield. The hypothesis this entry's mechanism
            generates is that selecting instead on the diurnal signature - documented fasting ketotic
            hypoglycemia together with documented postprandial hyperglycemia and hyperlactatemia, in a
            child with a normal-sized liver - would enrich the yield substantially, since that pairing
            is what the pathophysiology uniquely predicts. Continuous glucose monitoring makes the fed-state
            half cheap to capture, which it was not when the earlier cohort was assembled.
          would_support:
          - pathophysiology#Diurnal Glycemic Oscillation
          supporting_outcome:
          - A materially higher proportion of biallelic GYS2 findings in the paired-profile-selected cohort
            than in selection on fasting ketotic hypoglycaemia alone.
          refuting_outcome:
          - No enrichment over selection on fasting ketotic hypoglycaemia alone, which would mean the
            postprandial arm adds no discriminating information in practice despite its mechanistic specificity.
