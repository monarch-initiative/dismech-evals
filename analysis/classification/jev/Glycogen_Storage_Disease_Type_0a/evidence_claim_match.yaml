      assertion_type: Pathophysiology
      assertion:
        name: Fasting Ketotic Hypoglycemia with Low Lactate
        biological_scale: ORGANISM
        description: The fasted half of the disease. Glucose falls, ketones rise, and - this is the discriminating
          detail - lactate and alanine are LOW rather than high. Low lactate follows from gluconeogenesis
          running at full tilt and consuming lactate as substrate, and low alanine from its consumption
          as a gluconeogenic precursor; both are the mirror image of GSD I, where the gluconeogenic block
          dams lactate up and produces fasting lactic acidosis. Symptoms typically surface in late infancy,
          when overnight feeds are dropped.
      selected_evidence:
        snippet: Fasting hypoglycemia usually manifests in late infancy when overnight feedings are stopped.
        supports: SUPPORT
