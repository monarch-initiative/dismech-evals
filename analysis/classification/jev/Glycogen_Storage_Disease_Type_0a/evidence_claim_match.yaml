        context: []
      assertion_type: Treatment
      assertion:
        name: Frequent High-Protein Feeds with Uncooked Cornstarch
        description: 'The mainstay, and entirely dietary. Frequent daytime meals high in protein supply
          gluconeogenic precursors, which works here precisely because gluconeogenesis is intact - the
          same logic as in GSD VI, and the opposite of GSD I where the gluconeogenic step is itself blocked.
          Uncooked cornstarch at bedtime, dosed at roughly 1-1.5 g/kg and repeated six-hourly during illness,
          provides slow-release glucose across the overnight fast. Preventing hyperketonemia is not just
          symptom relief: it lifts the feedback inhibition of alanine release from muscle, so the diet
          also protects the gluconeogenic substrate supply it depends on.'
        treatment_term:
          preferred_term: dietary intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
        therapeutic_modality: BEHAVIORAL
      selected_evidence:
        snippet: Clinical management is therefore based on frequent meals composed of high protein intake
          during the day and addition of uncooked cornstarch in the evening.
        supports: SUPPORT
