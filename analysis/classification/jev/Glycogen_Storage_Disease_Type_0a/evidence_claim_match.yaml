      assertion:
        name: Diurnal Glycemic Oscillation
        biological_scale: ORGANISM
        description: The integrating node, and the diagnostic signature of the disease. Because the liver
          can neither store glucose when fed nor release it when fasted, glycemia swings across the day
          between postprandial hyperglycemia with lactic acidemia and fasting ketotic hypoglycemia, instead
          of being buffered flat. Continuous or serial glucose monitoring shows daily fluctuation between
          the two poles; neither pole alone is specific, and it is the oscillation that is.
      selected_evidence:
        snippet: Glucose monitoring in both patients revealed daily fluctuations from fasting hypoglycemia
          to postprandial hyperglycemia and lactic acidemia.
        supports: SUPPORT
