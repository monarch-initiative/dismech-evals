        treatment_effect: INHIBITS
        description: Slowing carbohydrate absorption reduces the glucose flux presented to the liver at
          any moment, limiting how much is diverted into glycolysis.
      selected_evidence:
        snippet: The goal of treatment is to prevent hypoglycemia and to minimize the systemic acidosis
          by preventing post-prandial lactic acidosis and fasting hyperketonemia.
