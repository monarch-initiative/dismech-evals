        rationale: 'Every quantitative statement about how common this disease is comes from counting
          papers, and multiple independent sources argue that the count is an undercount rather than a
          prevalence. The proposed mechanisms of ascertainment failure are specific and testable: the
          diagnosis historically required a liver biopsy; the fasted presentation is indistinguishable
          from idiopathic ketotic hypoglycemia, which is common in childhood; the fed presentation is
          mistaken for early diabetes; and there is no hepatomegaly to prompt the glycogen-storage workup
          in the first place. Against that, targeted sequencing gives a concrete negative bound - one
          of fifty children with ketotic hypoglycemia and an otherwise normal profile carried a GYS2 variant
          - so the disease is not a large hidden fraction of that presentation either. Both bounds are
          curated here rather than averaged, because they answer different questions: the case count says
          how many have been found, the sequencing study says how enriched one plausible screening population
          is.'
