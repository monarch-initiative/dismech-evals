      assertion_type: Pathophysiology
      assertion:
        name: Hepatic Glycogen Synthase Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic GYS2 loss of function removes the liver isoform of glycogen synthase,
          the enzyme that transfers glucose from UDP-glucose onto the growing alpha-1,4 chain. This is
          the synthesis-side counterpart of the phosphorylase lesion in GSD VI: the same polymer, the
          opposite direction of the reaction, and therefore the opposite tissue consequence. Liver enzyme
          activity in affected children is extremely low or unmeasurable.'
        genes:
        - preferred_term: GYS2
          term:
            id: hgnc:4707
            label: GYS2
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic germline loss-of-function alleles, confirmed functionally by severely
            impaired activity of the mutant enzymes expressed in COS7 cells.
        molecular_functions:
        - preferred_term: liver glycogen synthase activity
          term:
            id: GO:0004373
            label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
          modifier: LOSS_OF_FUNCTION
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
      selected_evidence:
        snippet: Type 0 glycogen storage disease (GSD0) is caused by deficiency of the hepatic isoform
          of glycogen synthase.
        supports: SUPPORT
