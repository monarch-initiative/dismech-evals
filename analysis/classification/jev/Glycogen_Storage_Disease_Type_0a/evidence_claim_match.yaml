              than shared with the hepatic glycogenoses generally. Because ingested glucose is shunted
              to lactate, a rapidly absorbed carbohydrate load produces postprandial lactic acidosis;
              complex low-glycemic-index carbohydrate blunts that. The stated therapeutic goal is explicitly
              two-sided - prevent the fasting hyperketonemia AND the post-prandial lactic acidosis - which
              is the diurnal swing restated as a treatment target.
            treatment_term:
              preferred_term: dietary intervention
