              id: MONDO:0012693
              label: glycogen storage disease due to muscle and heart glycogen synthase deficiency
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Gys1-null mouse
        species: Mouse
        genotype: GYS1 gene disruption, homozygous null
        publication: PMID:15282316
        description: 'Constitutive disruption of Gys1 removes glycogen from muscle, heart and several
          other tissues. The model is informative for the substrate lesion, but its cardiac course diverges
          sharply from the human disease: about 90% of nulls die perinatally from a developmental cardiac
          defect arising between 11.5 and 14.5 dpc, while the roughly 10% that survive have hearts of
          normal morphology and function - the opposite of the human phenotype, where survivors are the
          ones who develop hypertrophic cardiomyopathy in childhood.'
        modeled_mechanisms:
        - target: Muscle and Cardiac Glycogen Store Depletion
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: Glycogen synthase and glycogen are undetectable in both cardiac and skeletal muscle,
            reproducing the defining substrate lesion of the human disease in the same two tissues.
          readouts:
          - name: Cardiac and skeletal muscle glycogen content
            target: Muscle and Cardiac Glycogen Store Depletion
            direction: ABOLISHED
            interpretation: Glycogen is undetectable in both tissues, matching the human biopsy finding.
        - target: Myocardial Hypertrophic Remodeling
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: The mouse does not reproduce the human cardiac lesion. Its cardiac pathology is
            a developmental malformation that kills most nulls around birth; the survivors show normal
            cardiac morphology and function rather than the hypertrophic remodeling seen in surviving
            human patients.
          limitations: The murine cardiac phenotype is developmental (defects beginning 11.5-14.5 dpc,
            about 90% perinatal lethality) and is therefore a different lesion from the postnatal hypertrophic
            cardiomyopathy of human GSD0B. The surviving minority are, by selection, those without a cardiac
            defect, so the model provides no surviving-animal readout of the human hypertrophic phenotype
            and cannot be used to study its natural history or to test interventions against it.
      selected_evidence:
        snippet: The results provide the first direct evidence that the ability to synthesize glycogen
          in cardiac muscle is critical for normal heart development
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /animal_models/0
