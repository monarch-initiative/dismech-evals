  5058bb61f5cbfe0068ce9d0e17734d6fc6da7931ee2a2aa8899be141715e7a8e:
    claim:
      about:
        disease:
          name: Glycogen Storage Disease Type 0b
          disease_term:
            preferred_term: Glycogen storage disease type 0b
            term:
              id: MONDO:0012693
              label: glycogen storage disease due to muscle and heart glycogen synthase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gsd0b_cardiac_vs_myopathic_spectrum
        prompt: Why does the same enzymatic lesion produce childhood hypertrophic cardiomyopathy with
          sudden cardiac arrest in some families and a benign adult-onset proximal myopathy with no cardiac
          involvement in others, and can a patient with a newly identified GYS1 genotype be assigned to
          one course or the other?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Myocardial Hypertrophic Remodeling
        rationale: 'The two published courses are not mild and severe versions of one presentation; they
          differ in which organ is affected. Three unrelated families have lost a child to cardiac arrest
          - the index siblings at 10.5 years, a Japanese girl at 12, and a Canadian child at 8 who collapsed
          during exercise with no prior symptoms - while two unrelated adults with the same enzymatic
          deficiency reached middle age with proximal weakness and explicitly no heart involvement. Too
          few individuals have been reported for a genotype-course correlation to be tested, and the variants
          concerned are of different classes (nonsense, frameshift, splice-donor, missense), so residual
          enzyme activity is a plausible but untested explanation. The Canadian case sharpens the problem
          rather than resolving it: a frameshift deletion is expected to be as severe as the index nonsense
          allele, and that child died youngest and without warning. This matters clinically because the
          decision to place a newly diagnosed patient under cardiac surveillance currently cannot be informed
          by genotype.'
        proposed_experiments:
        - experiment_id: exp_gsd0b_residual_activity_vs_cardiac_course
          name: Residual glycogen synthase activity against cardiac involvement across reported families
          description: Assemble the reported GSD0B individuals with paired quantitative muscle glycogen
            synthase activity (or measured GS protein) and cardiac imaging, and test whether residual
            activity separates the cardiac from the pure-myopathic course. Cascade-ascertained relatives
            are the informative group because they are identified before a cardiac event rather than through
            one.
          would_support:
          - pathophysiology#Myocardial Hypertrophic Remodeling
          supporting_outcome:
          - Individuals with the cardiac course cluster at lower residual glycogen synthase activity than
            those with the pure myopathic course, with cardiac involvement appearing below a reproducible
            activity threshold.
          refuting_outcome:
          - Residual activity is indistinguishable between the cardiac and myopathic groups, pointing
            to a modifier outside GYS1 rather than a dose effect of the enzymatic lesion.
      selected_evidence:
        snippet: This case of GSD 0b, caused by a novel GYS1 variant, highlights the disease's clinical
          and molecular heterogeneity.
        supports: SUPPORT
