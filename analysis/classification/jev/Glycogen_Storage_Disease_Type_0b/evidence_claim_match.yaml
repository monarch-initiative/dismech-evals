  4c1a28a3c9bb683439dc14cc6f2aac4b40469b94eb8347722809788484fd12f1:
    claim:
      about:
        disease:
          name: Glycogen Storage Disease Type 0b
          disease_term:
            preferred_term: Glycogen storage disease type 0b
            term:
              id: MONDO:0012693
              label: glycogen storage disease due to muscle and heart glycogen synthase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_gsd0b_gys1_null_mouse_heart
        prompt: Can the Gys1-null mouse say anything about the human cardiac phenotype, given that its
          glycogen-free surviving hearts are morphologically and functionally normal while the human survivors
          are precisely the ones who develop hypertrophic cardiomyopathy?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Myocardial Hypertrophic Remodeling
        - animal_models#Mouse
        rationale: 'The only established animal model of GYS1 loss reproduces the human substrate lesion
          exactly - glycogen synthase and glycogen are undetectable in cardiac and skeletal muscle - and
          yet its surviving animals have normal hearts. Its cardiac pathology is instead a developmental
          malformation causing perinatal death in about 90% of nulls, a lesion with no human counterpart
          in the reported families. The mismatch is mechanistically meaningful rather than a matter of
          severity: it means the step from Cardiomyocyte Energy Reserve Failure to Myocardial Hypertrophic
          Remodeling, the edge this entry marks as inferred from the human phenotype, has no supporting
          model system, and that a species difference in developmental dependence on cardiac glycogen
          sits between the model and the disease.'
        proposed_experiments:
        - experiment_id: exp_gsd0b_conditional_adult_cardiac_gys1_loss
          name: Conditional, postnatal cardiomyocyte-restricted Gys1 deletion
          description: Delete Gys1 in cardiomyocytes after cardiac development is complete, so the perinatal
            developmental lethality that selects the current surviving cohort is bypassed, and follow
            ventricular wall thickness, function and the exercise haemodynamic response into adulthood.
          would_support:
          - pathophysiology#Myocardial Hypertrophic Remodeling
          supporting_outcome:
          - Postnatal cardiomyocyte Gys1 loss produces hypertrophic remodeling and an abnormal exercise
            response, establishing a model of the human cardiac phenotype.
          refuting_outcome:
          - Postnatal cardiomyocyte Gys1 loss leaves the heart normal, indicating that human hypertrophic
            remodeling requires something beyond cardiomyocyte glycogen depletion alone.
      selected_evidence:
        snippet: Glycogen synthase and glycogen were undetectable in cardiac muscle and skeletal muscle
          from the surviving null mice, and the hearts showed normal morphology and function.
        supports: SUPPORT
