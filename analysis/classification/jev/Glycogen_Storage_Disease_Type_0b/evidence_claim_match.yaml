              label: glycogen storage disease due to muscle and heart glycogen synthase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Glycogen Synthase 1 Deficiency
        biological_scale: MOLECULAR
        description: Biallelic loss-of-function GYS1 variants abolish or severely reduce muscle glycogen
          synthase, the enzyme that elongates the glycogen chain by transferring glucose from UDP-glucose.
          Reported lesions include a homozygous nonsense variant, canonical splice-donor variants that
          mis-splice exon 4, and a missense variant, and the biochemical consequence has been measured
          directly as reduced enzyme activity and reduced protein.
        genes:
        - preferred_term: GYS1
          term:
            id: hgnc:4706
            label: GYS1
        cell_types:
        - preferred_term: Skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        molecular_functions:
        - preferred_term: glycogen synthase activity
          term:
            id: GO:0004373
            label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
          modifier: DECREASED
      selected_evidence:
        snippet: Our findings elucidate the molecular consequences of GYS1 deficiency, showing severely
          reduced GS protein levels
        supports: SUPPORT
