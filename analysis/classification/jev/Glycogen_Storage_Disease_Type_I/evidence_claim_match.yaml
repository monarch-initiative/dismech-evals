      assertion_type: Pathophysiology
      assertion:
        name: Secondary metabolic derangements
        description: 'The block in glucose-6-phosphate hydrolysis leads to accumulation of metabolic intermediates,
          resulting in several secondary biochemical abnormalities. Excess glucose-6-phosphate is shunted
          into glycolysis, producing excess pyruvate and lactate (lactic acidosis). Increased acetyl-CoA
          flux drives de novo lipogenesis, causing hypertriglyceridemia and hypercholesterolemia. Accelerated
          purine degradation from excess glucose-6-phosphate metabolism, combined with decreased renal
          urate clearance due to competitive inhibition by lactate, leads to hyperuricemia.

          '
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
