  b8973cc171cf65bbc9731769eeda35404acfb66e6fb5aa44c934b172d019350d:
    claim:
      about:
        disease:
          name: Glycogen Storage Disease Type I
          disease_term:
            preferred_term: glycogen storage disease type I
            term:
              id: MONDO:0002413
              label: glycogen storage disease I
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 1 (Congenital Neutropenias): row "Glycogen
          storage disease type 1b G6PT1 AR 602671", affected cells N + M, affected function myeloid differentiation,
          chemotaxis and O2- production, associated features fasting hypoglycemia, lactic acidosis, hyperlipidemia
          and hepatomegaly.

          SCOPE — this classification applies to the GSD Ib subtype ONLY. This entry is a combined Ia+Ib
          entry, and IUIS lists only type 1b: the neutropenia, neutrophil dysfunction and inflammatory
          bowel disease that earn the Table 5 row come from loss of the SLC37A4 glucose-6-phosphate transporter,
          and this entry''s GSD Ia subtype states explicitly that neutropenia is not a feature of type
          Ia. Because iuis_category is single-valued and cannot be scoped to a has_subtypes member, the
          restriction is recorded here in prose rather than structurally. The supporting content sits
          on the "Neutropenia and neutrophil dysfunction in GSD Ib" pathophysiology node.

          The paper prints the legacy gene symbol G6PT1; the current HGNC symbol is SLC37A4 (hgnc:4061),
          which is what this entry binds — the same gene, not a mismatch.'
      selected_evidence:
        snippet: Glycogen storage disease type 1b G6PT1 AR 602671
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
      evidence_path: /classifications/iuis_category/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /classifications
