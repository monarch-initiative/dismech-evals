      assertion_type: Prevalence
      assertion:
        population: Live births
        measure_type: BIRTH_PREVALENCE
        prevalence_class: BAND_1_9_PER_100000
        rate_per_100000: 1.0
        percentage: 1 in 100,000
        notes: Exact prevalence is not well established, but Orphanet's review reports an annual incidence
          around 1 in 100,000 births and notes that GSD Ia accounts for most cases.
      selected_evidence:
        snippet: Glucose-6-phosphatase deficiency (G6P deficiency), or glycogen storage disease type I
          (GSDI), is a group of inherited metabolic diseases, including types Ia and Ib, characterized
          by poor tolerance to fasting, growth retardation and hepatomegaly resulting from accumulation
          of glycogen and fat in the liver. Prevalence is unknown and annual incidence is around 1/100,000
          births. GSDIa is the more frequent type, representing about 80% of GSDI patients.
        supports: SUPPORT
