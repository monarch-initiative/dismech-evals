      assertion:
        name: Hepatocellular adenoma development
        description: 'Hepatocellular adenomas are a major long-term complication of GSD I, occurring in
          22-75% of affected adults. The adenomas develop typically in post-pubertal patients and carry
          an approximately 10% risk of malignant transformation to hepatocellular carcinoma. The pathogenesis
          is multifactorial and may involve chronic metabolic stress, altered hepatocyte growth signaling,
          and hormonal influences. Better dietary management and metabolic control appear to reduce adenoma
          incidence.

          '
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: the incidence of liver tumours in younger adults seems less than in older ones, suggesting
          that better dietary treatment, and thus improved metabolic control, may be protective.
        supports: SUPPORT
