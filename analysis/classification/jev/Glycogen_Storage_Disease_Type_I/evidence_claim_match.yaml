          value:
            name: Impaired glucose-6-phosphate hydrolysis and fasting hypoglycemia
            description: 'Deficiency of the glucose-6-phosphatase system blocks the final step of both
              glycogenolysis and gluconeogenesis, preventing the liver and kidneys from releasing free
              glucose into the bloodstream during fasting. Glucose-6-phosphate accumulates in the cytoplasm
              of hepatocytes and renal tubular cells, driving excessive glycogen and fat synthesis. The
              inability to maintain blood glucose between meals causes severe fasting hypoglycemia, which
              is the hallmark metabolic derangement of GSD I.

              '
