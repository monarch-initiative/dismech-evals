        subtype: IXa1
        notes: 'A secondary, not primary, glycosylation defect: the O-glycan on apolipoprotein C-III is
          undersialylated (monosialo ApoC-III1 up, disialo ApoC-III2 down), which is the serum pattern
          a congenital disorder of glycosylation screen looks for. It is therefore a diagnostic trap as
          much as a marker — an abnormal ApoC-III isoform profile in a child with hepatomegaly does not
          establish a CDG. The cohort authors attribute it to reduced availability of nucleotide sugars
          for glycosylation rather than to a lesion in the glycosylation machinery itself, which places
          it downstream of the entry''s carbohydrate-flux nodes.


          Frequency band. 31/39 = 79.5% sits one half-point below the VERY_FREQUENT floor, so FREQUENT
          is taken from the reported denominator rather than from the abstract''s rounded "80%". The measurement
          was made only in males with GSD IXa, so `subtype: IXa1` records the population it was established
          in; it has not been shown for the PHKB, PHKG2 or PHKA1 subtypes.'
      selected_evidence:
        snippet: We previously hypothesized that ApoC-III hypoglycosylation in GSD IX may result from
          reduced availability of nucleotide monosaccharides, particularly UDP-GalNAc, for glycosylation
          reactions
        supports: SUPPORT
