        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gsd9_diet_prevents_hepatic_complications
        prompt: Do uncooked cornstarch and a high-protein diet prevent the long-term hepatic complications
          of GSD IX, or only the acute metabolic ones?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hepatocellular Injury and Progressive Liver Fibrosis
        rationale: 'Nutritional therapy has demonstrated effects on the acute axis: in the 52-patient
          cohort it improved growth and reduced fasting hypoglycaemia episodes. Its effect on the hepatic
          axis is unproven, and the same cohort reported that hepatomegaly frequently persisted despite
          intervention. The natural-history study that first documented fibrosis in this group named this
          explicitly as an unanswered question. The distinction matters because hepatic complications
          are now the main long-term risk, and the treatments curated here are all justified against the
          acute axis.'
        proposed_experiments:
        - experiment_id: exp_gsd9_diet_fibrosis_endpoint
          name: Nutritional therapy trial with a hepatic fibrosis endpoint
          description: Run a multicentre prospective study of standardised cornstarch plus high-protein
            therapy in GSD IX using serial liver elastography and imaging as the primary endpoint rather
            than glucose and ketone control, powered to detect a difference in fibrosis progression.
      selected_evidence:
        snippet: There is a need for future studies if uncooked cornstarch and high protein diet would
          be able to prevent long-term complications of GSD-VI and -IX.
        supports: SUPPORT
