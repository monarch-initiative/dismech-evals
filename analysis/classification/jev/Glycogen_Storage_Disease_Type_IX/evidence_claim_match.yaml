  4c8da5b84d80d64784ddd925387b00c6940d2a3eb3488282ab71e3dd1ab3c651:
    claim:
      about:
        disease:
          name: Glycogen Storage Disease Type IX
          disease_term:
            preferred_term: Glycogen storage disease type IX
            term:
