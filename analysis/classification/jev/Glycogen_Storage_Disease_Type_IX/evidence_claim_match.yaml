            term:
              id: MONDO:0700291
              label: glycogen storage disease IX
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gsd9_genotype_phenotype
        prompt: Why does liver GSD IX range from an almost asymptomatic course to recurrent hypoglycaemia
          with childhood cirrhosis, when the largest modern cohort found no clear genotype-phenotype correlation
          and even individuals carrying the same variant differ?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Hepatic Glycogenolysis
        - pathophysiology#Hepatocellular Injury and Progressive Liver Fibrosis
        rationale: Subtype assignment carries real prognostic weight at the group level — PHKG2 confers
          the fibrosis and cirrhosis risk, PHKB is mildest — yet it does not predict an individual course.
          A 52-patient European cohort found no clear genotype-phenotype correlation, and the ACMG resource
          states plainly that the basis of the clinical variation is not understood. The one relationship
          that did hold in that cohort was genotype to residual enzyme activity, not genotype to clinical
          severity, which suggests the determinants of hepatic outcome lie downstream of enzyme activity.
        proposed_experiments:
        - experiment_id: exp_gsd9_hepatic_outcome_modifiers
          name: Prospective genotype-stratified hepatic outcome cohort in GSD IX
          description: Follow a molecularly confirmed GSD IX cohort with standardised, serial non-invasive
            fibrosis assessment (elastography plus serum panels), residual PhK activity where available,
            and recorded dietary adherence, and test whether variant class, residual activity, or metabolic
            control predicts progression to fibrosis independently of subtype.
      selected_evidence:
        snippet: Severe hypoglycemic episodes were uncommon, and no clear genotype-phenotype correlation
          emerged.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41732189
      reference_title: 'Glycogen storage disease type IX: Long-term follow-up of 52 patients from three
        European countries.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the absence of a genotype-phenotype correlation in the largest modern cohort.
