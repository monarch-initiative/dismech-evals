              label: glycogen storage disease IX
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Phosphorylase Kinase Subunit Deficiency
        biological_scale: MOLECULAR
        description: Pathogenic variants in a gene encoding one of the phosphorylase kinase (PhK) subunits
          reduce or abolish holoenzyme activity. PhK is a heterotetramer of four copies each of an alpha,
          beta, gamma and delta subunit; the gamma subunit carries the catalytic site and the alpha, beta
          and delta (calmodulin) subunits regulate it. Tissue-specific isoforms mean the resulting deficiency
          is confined to liver, to muscle, or to both, depending on which subunit gene is affected.
        genes:
        - preferred_term: PHKA2
          term:
            id: hgnc:8926
            label: PHKA2
        - preferred_term: PHKB
          term:
            id: hgnc:8927
            label: PHKB
        - preferred_term: PHKG2
          term:
            id: hgnc:8931
            label: PHKG2
        - preferred_term: PHKA1
          term:
            id: hgnc:8925
            label: PHKA1
        molecular_functions:
        - preferred_term: phosphorylase kinase activity
          term:
            id: GO:0004689
            label: phosphorylase kinase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Its activity is regulated by the phosphorylation state of the regulatory α and β subunits,
          and by the δ subunit (calmodulin) via calcium levels.
        supports: SUPPORT
