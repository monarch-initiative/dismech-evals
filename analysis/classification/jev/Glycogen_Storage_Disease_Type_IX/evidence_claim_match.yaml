  b08df7d70aef20f04a3ab4d27c5e9e2dc9dbeb1bc297d41814c5f34fc9df2f47:
    claim:
      about:
        disease:
          name: Glycogen Storage Disease Type IX
          disease_term:
            preferred_term: Glycogen storage disease type IX
            term:
              id: MONDO:0700291
              label: glycogen storage disease IX
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Early-childhood hepatic presentation
        age_range: First one to two years of life
        notes: Affected children typically come to attention in infancy or early childhood with hepatomegaly,
          growth deceleration, raised transaminases and hyperlipidaemia.
      selected_evidence:
        snippet: 'Glycogen storage disease type IX (GSD IX) arises from hepatic phosphorylase b kinase
          (PhK) deficiency attributable to pathogenic variants in the PHKA2, PHKB, and PHKG2 genes. This
          multicenter retrospective study evaluated clinical and biochemical data from 52 patients diagnosed
          across three European countries, with a median follow-up of 9.3 years (range: 1-49). ... The
          median age at symptom onset was 1.6 years, and the mean age at diagnosis was 2.0 years. Predominant
          manifestations included hepatomegaly (82%), elevated aminotransferases (81%), hypertriglyceridemia
          (71%), hypercholesterolemia (67%), hypoglycemia (46%), hyperlactatemia (38%), and short stature
          (30%). ... a recent review summarizing published cases reported that GSD IX typically manifests
          in infants or toddlers with hepatomegaly, growth delay, elevated aminotransferases, dyslipidemia,
          and episodes of fasting hypoglycemia'
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41732189
      reference_title: 'Glycogen storage disease type IX: Long-term follow-up of 52 patients from three
        European countries.'
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the hepatic GSD IX cohort, early onset and characteristic clinical findings,
        with the paper’s reviewed infants/toddlers presentation and growth delay.
