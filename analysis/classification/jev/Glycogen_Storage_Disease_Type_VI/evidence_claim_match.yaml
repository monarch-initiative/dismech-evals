              label: glycogen storage disease VI
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hepatic Glycogen Phosphorylase Deficiency
        biological_scale: MOLECULAR
        description: Biallelic PYGL loss of function removes the liver isoform of glycogen phosphorylase,
          the rate-limiting enzyme of glycogenolysis, which cleaves the alpha-1,4 bonds of glycogen to
          release glucose-1-phosphate. The enzyme is the substrate enzyme of the hepatic phosphorylase
          system; its activating kinase, phosphorylase kinase, is a distinct protein whose deficiency
          causes the separate disease GSD IX.
        genes:
        - preferred_term: PYGL
          term:
            id: hgnc:9725
            label: PYGL
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic germline loss-of-function alleles. Residual enzyme activity is variable,
            which is one candidate explanation for the wide clinical range, though no clear genotype-phenotype
            correlation has been established.
        molecular_functions:
        - preferred_term: glycogen phosphorylase activity
          term:
            id: GO:0008184
            label: glycogen phosphorylase activity
          modifier: LOSS_OF_FUNCTION
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
      selected_evidence:
        snippet: GSD VI is caused by deficient activity of hepatic glycogen phosphorylase, an enzyme encoded
          by the PYGL gene.
        supports: SUPPORT
