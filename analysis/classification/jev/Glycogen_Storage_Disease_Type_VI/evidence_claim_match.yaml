        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hepatic Stellate Cell Activation and Fibrogenesis
        conforms_to: fibrotic_response#Mesenchymal Cell Activation
        biological_scale: TISSUE
        description: The mechanistic route from glycogen overload to the hepatic complications runs through
          activation of hepatic stellate cells. In aged Pygl-null mice the number of alpha-SMA-positive
          activated stellate cells is increased, with periportal and perisinusoidal collagen deposition,
          portal inflammatory infiltrates, raised Ccl5 and Mcp-1, and elevated transaminases. This is
          the conserved mesenchymal-activation step of the fibrotic response, substituting the hepatic
          stellate cell as the organ-specific effector.
        cell_types:
        - preferred_term: hepatic stellate cell
