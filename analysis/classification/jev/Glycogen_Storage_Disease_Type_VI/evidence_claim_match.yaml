      assertion_type: Discussion
      assertion:
        discussion_id: gap_gsd6_gsd9_clinically_indistinguishable
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hepatic Glycogen Phosphorylase Deficiency
        prompt: Is there any clinical, biochemical or imaging feature that distinguishes GSD VI from GSD
          IX without enzymatic or genetic testing?
        rationale: 'The two diseases have adjacent but distinct lesions - PYGL is the substrate enzyme,
          phosphorylase kinase is its activating kinase - yet the largest systematic review states flatly
          that neither clinical nor laboratory findings allow differentiation, and the ACMG resource is
          a single joint guideline covering both. This matters for curation as well as for clinics: it
          means published cohorts described as "GSD VI" before molecular testing became routine may include
          GSD IX patients, so historical phenotype frequencies should be read with that in mind. It is
          also the reason a Hepatic_Phosphorylase_System_Deficiencies grouping over GSD VI and GSD IX
          would be well founded - two genuinely distinct diseases converging on one phenotype and one
          management pathway.'
      selected_evidence:
        snippet: Glycogen storage disease types VI and IX have a wide spectrum of clinical manifestations
          and often cannot be distinguished from each other, or from other liver GSDs, on clinical presentation
          alone.
        supports: SUPPORT
