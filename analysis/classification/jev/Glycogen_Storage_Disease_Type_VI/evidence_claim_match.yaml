      assertion_type: Treatment
      assertion:
        name: Glucagon (contraindicated as hypoglycaemia rescue)
        description: Curated as a treatment NOT to give, because the reason is mechanistically central
          rather than incidental. Glucagon raises blood glucose by activating hepatic glycogen phosphorylase
          - the very enzyme that is missing here - so it cannot work in GSD VI, and reaching for it in
          a hypoglycaemic episode wastes time in which cornstarch or glucose would help. GeneReviews lists
          it among agents to avoid.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        therapeutic_modality: PEPTIDE
      selected_evidence:
        snippet: 'Agents/circumstances to avoid: Excessive amounts of simple sugars and a high-carbohydrate
          diet; glucagon administration as a rescue therapy for hypoglycemia; growth hormone therapy for
          short stature; contact sports when hepatomegaly is present.'
        supports: REFUTE
