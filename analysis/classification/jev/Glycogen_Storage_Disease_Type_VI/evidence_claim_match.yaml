      assertion:
        name: Fasting Intolerance with Preserved Ketogenesis
        biological_scale: ORGANISM
        description: Reduced hepatic glucose output during fasting produces hypoglycaemia that is usually
          mild, because gluconeogenesis compensates. Intact fatty-acid oxidation shifts metabolism toward
          lipid, so ketone bodies rise. Ketosis is therefore a positive, expected finding here and can
          occur even when hypoglycaemia is slight - the discriminating feature against GSD I.
        biological_processes:
        - preferred_term: fatty acid beta-oxidation
          term:
            id: GO:0006635
            label: fatty acid beta-oxidation
        - preferred_term: ketone body biosynthetic process
          term:
            id: GO:0046951
            label: ketone body biosynthetic process
          modifier: INCREASED
      selected_evidence:
        snippet: lower fasting blood glucose levels and elevated blood ketone bodies
        supports: SUPPORT
