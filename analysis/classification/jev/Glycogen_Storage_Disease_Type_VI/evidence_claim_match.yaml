  ff377ae6771fc97a6809e125c5b779e262cc0f576505398fbc6965e64d610548:
    claim:
      about:
        disease:
          name: Glycogen Storage Disease Type VI
          disease_term:
            preferred_term: Glycogen Storage Disease Type VI
            term:
              id: MONDO:0009294
              label: glycogen storage disease VI
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Hepatic Glycogenolysis with Intact Synthesis and Gluconeogenesis
        biological_scale: CELLULAR
        description: 'This node is defined as much by what remains intact as by what fails. Glycogen breakdown
          is blocked, but glycogen synthesis, gluconeogenesis and fatty-acid oxidation are all preserved.
          That combination produces the two signatures of the disease: glycogen accumulates because synthesis
          continues unopposed, and fasting hypoglycaemia is comparatively mild and ketotic because gluconeogenesis
          can be upregulated and ketogenesis is available. The negative content of this node is the whole
          contrast with GSD I, where glucose-6-phosphatase failure blocks gluconeogenesis too and the
          hypoglycaemia is severe and non-ketotic.'
        biological_processes:
        - preferred_term: glycogen catabolic process
          term:
            id: GO:0005980
            label: glycogen catabolic process
          modifier: DECREASED
        - preferred_term: gluconeogenesis
          term:
            id: GO:0006094
            label: gluconeogenesis
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Pygl -/- mice exhibit hepatomegaly, excessive hepatic glycogen accumulation, and low
          hepatic free glucose along with lower fasting blood glucose levels and elevated blood ketone
          bodies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31701076
      reference_title: Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic Phenotype in a Murine
        Model of Glycogen Storage Disease Type VI.
      evidence_source: MODEL_ORGANISM
      explanation: The knockout reproduces the full biochemical signature including the preserved ketogenic
        response, confirming that ketosis is a positive consequence of intact fatty-acid oxidation rather
        than an incidental finding.
