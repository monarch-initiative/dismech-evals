            name: Avoidance of pre-exercise carbohydrate ("out-of-wind" phenomenon)
            description: Unlike in glycogenolytic defects such as McArdle disease (GSD V), consuming carbohydrates
              immediately before exercise exacerbates exercise intolerance in GSD VII. Because PFKM deficiency
              blocks utilization of both blood glucose and muscle glycogen, a pre-exercise carbohydrate
              load cannot supply pyruvate while the resulting insulin surge suppresses peripheral and
              intramyocellular lipolysis, depriving skeletal muscle of alternative oxidative free fatty
              acid substrates ("out-of-wind" phenomenon).
            therapeutic_modality: BEHAVIORAL
            treatment_term:
              preferred_term: dietary intervention
              term:
                id: NCIT:C15447
                label: Dietary Intervention
            target_phenotypes:
