      assertion_type: DifferentialDiagnosis
      assertion:
        name: Distal muscle glycolytic enzymopathies (PGK1, PGAM2, LDHA, ENO3, and ALDOA deficiencies)
        description: Deficiencies of glycolytic enzymes in the distal part of the glycolytic pathway —
          including phosphoglycerate kinase (PGK1), muscle phosphoglycerate mutase (PGAM2, GSD X), muscle
          lactate dehydrogenase (LDHA, GSD XI), beta-enolase (ENO3, GSD XIII), and aldolase A (ALDOA,
          GSD XII) — present with overlapping exercise intolerance, muscle cramps, and rhabdomyolysis,
          and are distinguished from PFKM deficiency by muscle enzyme assays, biopsy features, and molecular
          genetic testing.
        distinguishing_features:
        - X-linked inheritance (PGK1 on Xq13) with isolated or combined hemolytic anemia, myopathy, and
          central nervous system involvement (seizures, intellectual disability, stroke) in PGK1 deficiency
        - Frequent skeletal muscle tubular aggregates on muscle biopsy in PGAM2 deficiency (GSD X), which
          are not seen in other muscle glycogenoses
      selected_evidence:
        snippet: 'Other glycogenoses have been recognised in the distal part of the glycolytic pathway:
          these are infrequent but some may induce muscle cramps, exercise intolerance and rhabdomyolysis.
          Phosphoglycerate Kinase, Phosphoglycerate Mutase, Lactate Dehydrogenase, beta-Enolase and Aldolase
          A deficiencies have been described as distal glycogenoses.'
        supports: SUPPORT
