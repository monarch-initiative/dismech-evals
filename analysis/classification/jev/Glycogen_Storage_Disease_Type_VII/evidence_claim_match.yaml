      assertion_type: Pathophysiology
      assertion:
        name: Polyglucosan Storage in Skeletal Muscle
        description: An elevated ratio of muscle glycogen synthase (GYS1) to glycogen branching enzyme
          (GBE1) activity drives synthesis and intracellular accumulation of abnormal, poorly branched,
          diastase-resistant polyglucosan bodies in skeletal muscle fibers, particularly in older patients
          with late-onset fixed weakness.
        cell_types:
        - preferred_term: Skeletal muscle cell
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        biological_processes:
        - preferred_term: glycogen biosynthetic process
          term:
            id: GO:0005978
            label: glycogen biosynthetic process
          modifier: INCREASED
        chemical_entities:
        - preferred_term: glycogen
          term:
            id: CHEBI:28087
            label: glycogen
          modifier: INCREASED
      selected_evidence:
        snippet: We reasoned that this surprising finding could best be explained by the excessive accumulation
          of glucose-6-phosphate (G6P) upstream of the glycolytic block (49). As G6P is a functional activator
          of glycogen synthetase (GS), the finely balanced activity ratio of GS and GBE would be tilted
          in favor of GS and result in a polysaccharide with abnormally long and poorly branched chains,
          i.e. polyglucosan.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22106711
      reference_title: Progress and problems in muscle glycogenoses.
      evidence_source: OTHER
      explanation: Explains how G6P accumulation allosterically activates glycogen synthase and tilts
        the GS/GBE balance toward polyglucosan synthesis in GSD VII.
