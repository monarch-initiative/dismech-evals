                label: Exercise intolerance
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Skeletal Muscle Glycolytic Block
        treatment_effect: MODULATES
        description: Avoiding pre-exercise carbohydrate leaves the PFKM enzymatic block itself unchanged,
          and instead prevents carbohydrate-induced insulin release from suppressing peripheral and intramyocellular
          lipolysis and free fatty acid mobilization to exercising skeletal muscle.
      selected_evidence:
        snippet: for the glucose remains unavailablefor pyruvate production and the resultant increase
          in insulin inhibits the availability of substrates such as free fatty acids (from peripheral
          and IMCL lipolysis).
        supports: SUPPORT
