          term:
            id: MONDO:0009293
            label: glycogen storage disease V
        description: McArdle disease (myophosphorylase deficiency, PYGM) is the most common muscle glycogenosis
          and shares childhood-onset exercise intolerance, muscle cramps, exertional rhabdomyolysis, myoglobinuria,
          and a flat acute venous lactate response. Unlike McArdle disease, GSD VII lacks a typical "second
          wind" phenomenon, worsens after immediate pre-exercise carbohydrate ("out-of-wind" phenomenon),
          features compensated hemolysis and occasional gouty arthritis from myogenic hyperuricemia, and
          shows a late post-exercise lactate rise with exceptionally high exercise ammonia levels.
        distinguishing_features:
        - Absence of a typical second-wind phenomenon and occasional gouty arthritis due to myogenic hyperuricemia
          in GSD VII
        - Compensated hemolysis in GSD VII (absent in PYGM deficiency) and symptom exacerbation rather
          than improvement after immediate pre-exercise carbohydrate
        - Low exercise lactate followed by a late post-exercise lactate rise and exceptionally high ammonia
          in GSD VII
      selected_evidence:
        snippet: In conclusion, we show that Tarui disease is associated with low lactate levels during
          exercise with a late increase of lactate after exercise and exceptionally high ammonia levels
          during and after exercise. The particular lactate profile differentiates patients with Tarui
          disease from patients with McArdle disease and helps the clinician to choose proper genetic
          tests.
        supports: SUPPORT
