              label: glycosylphosphatidylinositol biosynthesis defect 18
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PIGS Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: Germline biallelic PIGS variants. The published alleles are missense, nonsense, in-frame
          indel or duplication, and splice variants (including a canonical splice-donor allele and exonic
          and intronic alleles shown by RNA studies to cause exon skipping). In the founding family the
          p.Trp36* allele lowered PIGS mRNA and protein, and downstream methionines produced truncated
          isoforms with some residual activity. PIGS is not the catalytic subunit, so the activity lost
          is that of the whole transamidase complex.
        molecular_functions:
        - preferred_term: GPI-anchor transamidase activity
          modifier: DECREASED
          term:
            id: GO:0003923
            label: GPI-anchor transamidase activity
        genes:
        - preferred_term: PIGS
          term:
            id: hgnc:14937
            label: PIGS
          modifier: DECREASED
        genetic_context:
          description: Germline biallelic PIGS alleles; both homozygous and compound heterozygous patients
            are reported, so zygosity is left unset.
          allelic_events:
          - MISSENSE_VARIANT
          - NONSENSE_VARIANT
          - SPLICE_SITE_VARIANT
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We present a study of six individuals from three unrelated families in which WES or WGS
          identified bi-allelic phosphatidylinositol glycan class S (PIGS) biosynthesis mutations.
        supports: SUPPORT
