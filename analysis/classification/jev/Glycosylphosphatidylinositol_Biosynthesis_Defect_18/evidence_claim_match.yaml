      assertion:
        name: Reduced Cell-Surface GPI-Anchored Proteins
        biological_scale: CELLULAR
        description: Precursor proteins that are not anchored do not reach the cell surface as GPI-anchored
          proteins. Patient granulocytes showed reduced CD16 in all tested individuals and reduced FLAER;
          CD55 and CD59 were reduced in some patients and normal in others. Amniocytes from an affected
          fetus showed reduced signal for every GPI-anchored marker tested, the lowest being CD24 at 85%
          below control. In PIGS-knockout HEK293 cells the founding p.Trp36* allele only partly restored
          surface GPI-anchored proteins. With over 150 GPI-anchored proteins, no single one has been shown
          to account for any clinical feature.
        cell_types:
        - preferred_term: granulocyte
          term:
            id: CL:0000094
            label: granulocyte
        - preferred_term: lymphocyte
          term:
            id: CL:0000542
            label: lymphocyte
      selected_evidence:
        snippet: Analysis on granulocytes indicated that individual cells had less signal of CD16 (all
          individuals) and CD55 and CD59 (individuals 1a and 1b) than age-matched control cells
        supports: SUPPORT
