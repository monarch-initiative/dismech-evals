      assertion:
        name: Impaired GPI Anchor Attachment to Precursor Proteins
        biological_scale: MOLECULAR
        description: The GPI transamidase in the endoplasmic reticulum cleaves the C-terminal GPI attachment
          signal of precursor proteins, forms a carbonyl intermediate with the substrate, and transfers
          the preassembled GPI to the new C terminus. PIGK carries the catalytic triad; PIGS and PIGT
          are required for formation of the carbonyl intermediate. Without PIGS the anchor is still synthesized
          but is not transferred to protein; in Drosophila, loss of PIG-S destabilizes PIG-K.
        biological_processes:
        - preferred_term: attachment of GPI anchor to protein
          term:
            id: GO:0016255
            label: attachment of GPI anchor to protein
          modifier: DECREASED
        protein_complexes:
        - preferred_term: GPI-anchor transamidase complex
          term:
            id: GO:0042765
            label: GPI-anchor transamidase complex
      selected_evidence:
        snippet: We also demonstrate that PIG-S and PIG-T form a protein complex with GAA1 and GPI8, and
          that PIG-T maintains the complex by stabilizing the expression of GAA1 and GPI8.
        supports: SUPPORT
    origin:
