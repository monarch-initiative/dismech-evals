          with actin filaments and microtubules. Its loss is expected to deregulate these motors and cytoskeletal
          interactions. This is inferred from normal KIFBP biochemistry; it should not be read as a uniform
          decrease in kinesin transport, and which deregulated motors matter for each disease feature
          is unknown. A primary mitochondrial respiratory defect is not supported: patient fibroblasts
          lacking KIFBP had normal respiratory chain activity.'
