  41fab566febed28687d06cd1b9760cd724da5891a0313e0b059ae041acf567b1:
    claim:
      about:
        disease:
          name: Goldberg-Shprintzen Syndrome
          disease_term:
            preferred_term: Goldberg-Shprintzen Syndrome
            term:
              id: MONDO:0012280
              label: Goldberg-Shprintzen syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: KIFBP
        gene_term:
          preferred_term: KIFBP
          term:
            id: hgnc:23419
            label: KIFBP
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Formerly KIAA1279, KIF1BP or KBP. Most reported alleles are truncating (nonsense, frameshift,
          exon deletions) and abolish protein expression; missense variants reported in two patients reduce
          expression in transfected cells, and one of them was classified likely benign by ACMG criteria,
          so missense pathogenicity is less secure. No correlation between variant position and severity
          was found.
        variants:
        - name: Truncating KIFBP variants
          description: Nonsense, frameshift and exon-deletion alleles, including p.Arg90Ter, p.Ser200Ter
            and p.Arg202IlefsTer2, which trigger nonsense-mediated mRNA decay and absence of KIFBP protein.
            Truncating variants in the 2020 series were classified pathogenic under ACMG criteria.
        - name: KIFBP missense variants
          description: Homozygous p.Pro189Ser and the compound heterozygous p.Glu23Gly/p.Ser427Gly combination
            reduce KIFBP expression in transfected cells; they were the first missense variants reported
            in GOSHS.
          variant_type: single nucleotide variant
      selected_evidence:
        snippet: We demonstrate that homozygous nonsense mutations in KIAA1279 at 10q22.1, encoding a
          protein with two tetratrico peptide repeats, underlie this syndromic form of Hirschsprung disease
          and generalized polymicrogyria
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
