  39bba7a3d38df1f17e0d7d9581f4d32c0f1e279c6c4e59f9d9e5cf313de9c16e:
    claim:
      about:
        disease:
          name: Gordon Syndrome
          disease_term:
            preferred_term: Gordon syndrome
            term:
              id: MONDO:0007252
              label: Gordon syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PIEZO2
        gene_term:
          preferred_term: PIEZO2
          term:
            id: hgnc:26270
            label: PIEZO2
        association: Causative (heterozygous, dominant)
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: PIEZO2 encodes a large mechanically activated non-selective cation channel, the principal
          mechanotransducer for proprioception and light touch. In the gene-discovery study PIEZO2 variants
          were found in all five exome-sequenced Gordon syndrome families and in five of seven further
          families, and nine families shared c.8057G>A (p.Arg2686His). Dominant PIEZO2 variants cluster
          toward the C-terminal region, whereas the recessive variants that cause a different, loss-of-function
          disorder cluster toward the N-terminal region. The same gene causes distal arthrogryposis type
          5 and a subset of Marden-Walker syndrome.
        variants:
        - name: PIEZO2 c.8057G>A (p.Arg2686His)
          clinical_significance: PATHOGENIC
          description: The recurrent Gordon syndrome variant, shared by nine families in the gene-discovery
            series and reported independently in a three-generation family and in a girl with Gordon syndrome
            and Dandy-Walker malformation. Cleft palate is significantly associated with this variant.
            The cited sources do not report a patch-clamp characterization of this specific variant; its
            gain-of-function action is inferred from the electrophysiology of other dominant PIEZO2 variants.
        - name: PIEZO2 c.8576G>A (p.Trp2859*)
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          description: A heterozygous nonsense variant in exon 56, classified by the reporting authors
            as of uncertain significance, found in a fetus with clubfoot, camptodactyly, micrognathia
            and cleft palate and absent from both parents. Its effect on the channel has not been tested.
      selected_evidence:
        snippet: Gain-of-function mutations in the human PIEZO2 gene cause three clinical types of autosomal
          dominant distal arthrogryposis.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28728825
      reference_title: Genetic Diseases of PIEZO1 and PIEZO2 Dysfunction.
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      explanation: A review places the dominant distal arthrogryposes, of which Gordon syndrome is one,
        under PIEZO2 gain of function.
