            species: Mouse
            genotype: Piezo2 E2799del (equivalent of human PIEZO2 E2727del), Cre-dependent knock-in, heterozygous
            publication: PMID:36634173
            description: Mouse carrying the mouse equivalent of the human distal arthrogryposis type 5
              variant E2727del, expressed constitutively or restricted by Cre driver to proprioceptive
              neurons (Pvalb), all sensory neurons (Advillin, inducible) or limb mesenchyme (Prrx1). Constitutive
              and proprioceptor-restricted mice develop hindlimb contractures and shortened tendons; mesenchyme-restricted
              mice do not. Botulinum toxin injected into the hindlimb at postnatal days 7 to 10, or a
              maternal diet enriched in eicosapentaenoic acid, which shortens PIEZO2 inactivation, reduced
              the defects.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Excessive Mechanotransduction in Proprioceptive Sensory Neurons
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Shows that gain-of-function PIEZO2 acting in proprioceptive sensory neurons, not
          in limb mesenchyme, is sufficient for the contractures.
        limitations: Models a distal arthrogryposis type 5 allele (E2727del), not the Gordon syndrome
          variant p.Arg2686His. The sensitive window was postnatal days 7 to 21 in the mouse, whereas
          human contractures are present at birth.
        divergences:
        - divergence_type: POPULATION_MISMATCH
          materiality: QUALIFYING
          description: The engineered allele is the DA5 variant E2727del. Gordon syndrome families mostly
            carry p.Arg2686His, which has not been modelled, so the mechanism is transferred across alleles
            of the same gene.
        - divergence_type: TEMPORAL_SCOPE
          materiality: QUALIFYING
          description: The critical window identified is postnatal in mice; whether it maps onto fetal
            development in humans, where contractures are congenital, is not tested.
      selected_evidence:
        snippet: These data suggest that overactive PIEZO2 in sensory neurons, but not in mesenchyme,
          is sufficient to induce DA5-like phenotypes in vivo.
        supports: SUPPORT
