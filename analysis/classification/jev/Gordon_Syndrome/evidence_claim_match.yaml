  12f60443d4f941fd97d7c709173b35924db0832e5995d225c7b945bd7e7acf8d:
    claim:
      about:
        disease:
          name: Gordon Syndrome
          disease_term:
            preferred_term: Gordon syndrome
            term:
              id: MONDO:0007252
              label: Gordon syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gordon_sensory_neuron_mechanism_translation
        prompt: Does the Gordon syndrome variant p.Arg2686His act through the same proprioceptive-neuron
          efferent mechanism shown for a distal arthrogryposis type 5 allele in mice, and is there a corresponding
          developmental window in humans during which reducing PIEZO2 activity would prevent contractures?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Excessive Mechanotransduction in Proprioceptive Sensory Neurons
        - animal_models#Gain-of-function Piezo2 E2799del knock-in mouse
        rationale: The sensory-neuron mechanism and the botulinum toxin and EPA rescues come from a mouse
          carrying the DA5 allele E2727del, with a postnatal critical window. Gordon syndrome is mostly
          caused by p.Arg2686His, which has not been electrophysiologically characterized or modelled
          in the cited sources, and its contractures are present before birth. Whether the mechanism and
          the window transfer decides whether the mouse rescues have any bearing on Gordon syndrome.
      selected_evidence:
        snippet: We also present proof-of-concept that Botox injection or dietary treatment can counteract
          the effect of overactive PIEZO2 function to evade DA-like phenotypes in mice when applied during
          a developmental critical period.
        supports: SUPPORT
