      assertion_type: Pathophysiology
      assertion:
        name: SMO Constitutive Activation
        biological_scale: MOLECULAR
        description: 'PTCH1 normally suppresses Smoothened (SMO) by preventing its accumulation in the
          primary ciliary membrane. When PTCH1 is lost via Knudson second-hit inactivation, SMO is no
          longer restrained and accumulates constitutively at the cilium, triggering downstream GLI signaling.
          This SMO-active state is the direct molecular target of the approved Hedgehog-pathway inhibitors
          vismodegib and sonidegib: both drugs bind SMO and restore its inhibited conformation. SUFU-mutant
          Gorlin disease bypasses this node entirely, predicting reduced efficacy of SMO inhibitors for
          that genotype.'
        conforms_to: hedgehog_pathway_activation#Constitutive Smoothened Activity
        cell_types:
        - preferred_term: basal cell of epidermis
          term:
            id: CL:0002187
            label: basal cell of epidermis
        biological_processes:
        - preferred_term: smoothened signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007224
            label: smoothened signaling pathway
      selected_evidence:
        snippet: Approximately, 85% of sporadic BCCs carry mutations in Hedgehog pathway genes, especially
          in PTCH, SUFU and SMO genes, which lead to the aberrant activation of GLI transcriptional factors,
          typically silent in cells of adult individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
