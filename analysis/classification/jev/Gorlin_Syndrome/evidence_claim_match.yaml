      assertion_type: Discussion
      assertion:
        discussion_id: gap_gli_directed_therapy_resistance
        prompt: Can GLI-directed agents control SMO-inhibitor-resistant or SUFU-driven Gorlin tumors,
          given that the durable therapeutic bottleneck lies at the convergent GLI node rather than at
          SMO?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#GLI Transcription Factor Activation
        - pathophysiology#SMO Constitutive Activation
        rationale: The only approved targeted therapies for Gorlin-associated BCC (vismodegib, sonidegib)
          act at SMO and therefore have limited efficacy in SUFU-related disease, which activates GLI
          downstream of SMO, and in tumors that acquire resistance via SMO mutation, SUFU loss, or GLI2
          amplification. No GLI-directed drug is approved, leaving SUFU carriers and SMO-inhibitor-resistant
          patients without a pathway-targeted option. Resolving whether GLI antagonists are effective
          and tolerable would close a major translational gap shared by the sufu_smo_independent_gli_model
          and gli_bypass_resistance_model hypotheses.
        proposed_experiments:
        - experiment_id: exp_gli_antagonist_sufu_resistant_models
          name: GLI-directed therapy in SUFU-null and SMO-inhibitor-resistant Gorlin models
          description: Test GLI-DNA-interaction inhibitors and GLI2 destabilizers against patient-derived
            SUFU-mutant medulloblastoma neural stem cells, PTCH1-mutant BCC organoids, and isogenic vismodegib-resistant
            BCC lines bearing SMO mutations or GLI2 amplification, comparing GLI output, proliferation,
            and tumor growth with SMO-antagonist arms.
          experiment_type:
            preferred_term: controlled perturbation experiment
          decision_criterion: GLI-directed agents reduce GLI target-gene expression and tumor growth in
            SUFU-null and SMO-inhibitor-resistant models where SMO antagonists fail.
          would_support:
          - mechanistic_hypotheses#gli_bypass_resistance_model
          - mechanistic_hypotheses#sufu_smo_independent_gli_model
          would_refute:
          - mechanistic_hypotheses#canonical_smo_dependent_model
      selected_evidence:
        snippet: GLI-DNA-interaction inhibitors (glabrescione B and GANT61), GLI2 destabilizers (arsenic
          trioxide and pirfenidone) and a GLI-deacetylation inhibitor (4SC-202) were shown to block GLI-dependent
          transcription and tumorigenesis in preclinical studies.
        supports: SUPPORT
