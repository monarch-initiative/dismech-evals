      reference_title: 'Mutations of the p53 and PTCH gene in basal cell carcinomas: UV mutation signature
        and strand bias.'
      evidence_source: HUMAN_CLINICAL
      explanation: PTCH mutations recovered from basal cell carcinomas carry the C to T and CC to TT changes
        at dipyrimidine sites that only ultraviolet light produces, so ultraviolet exposure is the mutagen
        inactivating the gene. The series is sporadic disease; the inference here is that the same mutagenic
        route supplies the somatic hit in germline carriers.
