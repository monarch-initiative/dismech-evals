      assertion_type: Pathophysiology
      assertion:
        name: PTCH1 Germline First-Hit Loss-of-Function
        biological_scale: MOLECULAR
        description: PTCH1 encodes Patched 1, a 12-pass transmembrane receptor that normally suppresses
          Smoothened (SMO) in the absence of Hedgehog ligand. Germline heterozygous loss-of-function mutations
          in PTCH1 predispose to tumors following Knudson's two-hit model. Loss of the remaining wild-type
          allele in somatic cells leads to constitutive Hedgehog pathway activation and tumor development.
        conforms_to: hedgehog_pathway_activation#Loss of Hedgehog Pathway Negative Regulation
        genetic_context:
          gene:
            preferred_term: PTCH1
            term:
              id: hgnc:9585
              label: PTCH1
          functional_impact_category: LOSS_OF_FUNCTION
          description: Germline plus somatic (Knudson two-hit) loss-of-function of the tumor-suppressor
            negative regulator PTCH1; gene-level loss produces net Hedgehog pathway activation.
        gene:
          preferred_term: PTCH1
          description: Patched 1, the canonical Hedgehog receptor that restrains Smoothened signaling.
          term:
            id: hgnc:9585
            label: PTCH1
        molecular_functions:
        - preferred_term: hedgehog receptor activity
          term:
            id: GO:0008158
            label: hedgehog receptor activity
          modifier: DECREASED
      selected_evidence:
        snippet: Loss of function variants within this gene have been associated with nevoid basal cell
          carcinoma syndrome.
        supports: SUPPORT
