              label: nevoid basal cell carcinoma syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GLI Transcription Factor Activation
        biological_scale: MOLECULAR
        description: Both PTCH1 loss (via SMO derepression) and SUFU loss (via direct release of GLI sequestration)
          converge on constitutive nuclear accumulation of GLI1 and GLI2. GLI1 transcriptionally activates
          pro-proliferative targets including CCND1, BCL2, and MYCN, and drives a positive-feedback loop
          by inducing PTCH1 expression. Loss of the GLI3 repressor arm (GLI3R, which requires PKA-GSK3B-BTRC-mediated
          partial proteolysis) compounds the transcriptional imbalance. This convergent GLI activation
          node links both genotypic etiologies to the full spectrum of Gorlin developmental and neoplastic
          phenotypes. Resistance to SMO inhibitors can emerge through amplification or activation of GLI
          downstream of SMO, a mechanism invisible in schema representations that bundle SMO and GLI as
          a single pathway node.
        conforms_to: hedgehog_pathway_activation#Constitutive GLI Transcriptional Output
        cell_types:
        - preferred_term: basal cell of epidermis
          term:
            id: CL:0002187
            label: basal cell of epidermis
        biological_processes:
        - preferred_term: smoothened signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007224
            label: smoothened signaling pathway
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: Approximately, 85% of sporadic BCCs carry mutations in Hedgehog pathway genes, especially
          in PTCH, SUFU and SMO genes, which lead to the aberrant activation of GLI transcriptional factors,
          typically silent in cells of adult individuals.
        supports: SUPPORT
