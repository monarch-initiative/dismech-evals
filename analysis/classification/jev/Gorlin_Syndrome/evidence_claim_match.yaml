            drug exposure, and quality-of-life endpoints over multi-year follow-up.
          experiment_type:
            preferred_term: randomized controlled trial
          decision_criterion: Topical therapy significantly reduces new-BCC incidence versus vehicle with
            low systemic exposure and acceptable tolerability sustained over years.
      selected_evidence:
        snippet: Given the scarcity of GS-specific data, expert consensus informed several recommendations,
