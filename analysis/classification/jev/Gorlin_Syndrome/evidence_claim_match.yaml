              label: nevoid basal cell carcinoma syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: gli_bypass_resistance_model
        hypothesis_label: SMO-Inhibitor Resistance via Downstream GLI Bypass
        status: EMERGING
        description: SMO antagonists eventually fail in a substantial fraction of advanced BCCs. Resistance
          arises from acquired SMO mutations, SUFU loss, GLI2 amplification, and non-canonical GLI activation
          that all converge below the drug target, leaving constitutive GLI output intact. This model
          frames the convergent GLI node — not SMO — as the durable therapeutic bottleneck and motivates
          GLI-directed agents for SMO-inhibitor-resistant and SUFU-driven disease.
        notes: 'OpenScientist deep research (kb/hypotheses/Gorlin_Syndrome/gli_bypass_resistance_model)
          judged this hypothesis PARTIALLY SUPPORTED: GLI-convergent bypass is a real, well-documented
          resistance route (acquired SMO mutations account for ~50% of resistant sporadic BCC; aPKC-ι/λ
          non-canonical GLI activation; GLI2 amplification; and inherent SUFU-driven activation below
          SMO), and GLI-node targeting (BET/HDAC/aPKC inhibitors) overcomes resistance preclinically.
          Qualifications: (1) the model is strongest for SUFU-driven disease (BCNS2/MHIBCC) and sporadic
          advanced BCC, but weak for PTCH1-mutant Gorlin syndrome, where BCCs are uniformly suppressed
          by SMO inhibitors and secondary resistance is rare. In an eight-year Australian series, all
          11 Gorlin patients who stayed on therapy kept sustained BCC suppression, while 10 of 13 locally
          advanced or metastatic BCC patients acquired resistance at a median of 13 months (PMID:40492880).
          The report''s headline "9.1% versus 77%" contrast is not a like-for-like comparison and is not
          repeated here: the 9.1% figure (PMID:38867459) is the share of treatment *interruptions* attributable
          to secondary resistance, not the share of the 351 Gorlin patients who became resistant. (2)
          In the one molecularly studied resistant Gorlin tumor, resistance arose via a GLI-independent
          basal-to-squamous lineage transition, not GLI bypass. (3) Additional GLI-independent routes
          exist (primary-cilia-loss RAS/MAPK switching; WNT-dependent persister cells). (4) The therapeutic
          corollary is clinically unproven — the only GLI-directed trial (arsenic trioxide + itraconazole,
          n=5) achieved ~75% GLI1 suppression but no meaningful tumor responses. Status EMERGING is retained
          pending Gorlin-specific, multi-patient resistance genomics.'
      selected_evidence:
        snippet: Resistance to SMO inhibitors is caused by acquired SMO mutations, SUFU deletions, GLI2
          amplification, other by-passing mechanisms of GLI activation and WNT/β-catenin signaling activation.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
