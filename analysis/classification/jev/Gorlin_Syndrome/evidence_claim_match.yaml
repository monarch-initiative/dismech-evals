      assertion_type: Subtype
      assertion:
        name: PTCH1-related
        description: The predominant form (~85-95% of cases), caused by germline PTCH1 mutations. Characterized
          by high rates of basal cell carcinomas, odontogenic keratocysts, skeletal anomalies, and calcification
          of the falx cerebri. Medulloblastoma risk is low (<2%). Many individuals have a recognizable
          facial appearance. Missense variants are associated with later diagnosis and milder phenotype.
      selected_evidence:
