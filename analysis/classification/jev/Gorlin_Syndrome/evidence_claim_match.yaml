            term:
              id: MONDO:0007187
              label: nevoid basal cell carcinoma syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: SUFU-related
        description: A minority form (~5% of cases), caused by germline SUFU mutations. Characterized
          by milder BCC burden, absence of jaw keratocysts, but markedly higher risk of medulloblastoma
          (up to 33%), meningioma (~11%), and gonadal tumors. Facial features are subtler. Often presents
          in early childhood with medulloblastoma.
      selected_evidence:
        snippet: The risk of developing medulloblastoma is substantially higher in individuals with an
          SUFU pathogenic variant (33%) than in those with a PTCH1 pathogenic variant (<2%).
        supports: SUPPORT
    origin:
