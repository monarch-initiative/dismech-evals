  9f801a29fbdcb3d6feed8b57ab7d442747c6f5c305c547e7a9295e69cf71c0ae:
    claim:
      about:
        disease:
          name: Gorlin Syndrome
          disease_term:
            preferred_term: nevoid basal cell carcinoma syndrome
            term:
              id: MONDO:0007187
              label: nevoid basal cell carcinoma syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gorlin_specific_resistance_mechanism
        prompt: When SMO-inhibitor resistance does arise in PTCH1-related Gorlin syndrome after years
          of suppressive therapy, does it proceed through GLI-convergent bypass, or through the GLI-independent
          routes documented in sporadic disease such as basal-to-squamous transition, primary-cilia loss
          with RAS/MAPK switching, or WNT-dependent persistence?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#gli_bypass_resistance_model
        - pathophysiology#GLI Transcription Factor Activation
        - phenotypes#Multiple Basal Cell Carcinomas
        rationale: The GLI bypass model was built almost entirely on sporadic advanced BCC and SHH medulloblastoma,
          and it does not transfer to Gorlin syndrome by default. PTCH1-related Gorlin tumors are uniformly
          suppressed by SMO antagonists and resistant clones are rare, so the resistance biology that
          has been characterized is not the resistance biology these patients experience. Exactly one
          Gorlin resistant tumor has been studied molecularly, after nearly a decade of therapy, and it
          escaped by a Hedgehog-independent basal-to-squamous lineage transition rather than by sustaining
          GLI output. A single patient cannot establish which route predominates, and the answer decides
          whether a GLI-directed agent, a MEK inhibitor, or a lineage-directed strategy is the rational
          second line for a Gorlin patient who progresses.
        proposed_experiments:
        - experiment_id: exp_multipatient_gorlin_resistance_genomics
          name: Paired pre-treatment and resistant tumor genomics in Gorlin patients with secondary resistance
          description: Assemble a multi-centre cohort of at least ten PTCH1-mutant Gorlin patients with
            documented secondary resistance to a Hedgehog pathway inhibitor, collect paired pre-treatment
            and resistant biopsies, and profile them by whole-exome sequencing, RNA-seq scored for GLI
            target-gene output, and spatial transcriptomics. Read out GLI1 and GLI2 expression, WNT target
            genes, squamous differentiation markers, ciliome mutation load, and cilia immunostaining side
            by side in the same lesions.
          experiment_type:
            preferred_term: paired longitudinal tumor genomic and transcriptomic profiling
          decision_criterion: Resistant Gorlin clones retain or raise GLI target-gene output and carry
            an identifiable lesion at or below SMO, rather than losing Hedgehog output while gaining squamous,
            WNT, or RAS/MAPK programs.
          would_support:
          - mechanistic_hypotheses#gli_bypass_resistance_model
          supporting_outcome:
          - Most resistant Gorlin lesions show sustained GLI target-gene expression with a new SMO mutation,
            SUFU loss, or GLI2 amplification absent from the paired pre-treatment sample.
          refuting_outcome:
          - Most resistant Gorlin lesions show reduced GLI target-gene expression with squamous differentiation,
            WNT activation, ciliome mutation, or cilia loss, placing Gorlin resistance outside the convergent
            GLI node entirely.
      selected_evidence:
        snippet: In rare cases, patients with Gorlin syndrome on long-term inhibitor therapy will develop
          individual resistant tumor clones that rapidly progress, but the basis of this resistance remains
          unstudied.
        supports: SUPPORT
