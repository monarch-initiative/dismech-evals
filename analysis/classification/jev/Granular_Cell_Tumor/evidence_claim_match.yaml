          modifier: DECREASED
          term:
            id: GO:0007035
            label: vacuolar acidification
        - preferred_term: proton transmembrane transport
          modifier: DECREASED
          term:
            id: GO:1902600
            label: proton transmembrane transport
      selected_evidence:
        snippet: "These results suggest that V-ATPase function is \nimpaired in GCTs not only by loss-of-function\
          \ mutations of ATP6AP1 and ATP6AP2 \nbut also through mutations of other subunits"
        supports: SUPPORT
