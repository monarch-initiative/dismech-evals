      assertion_type: Pathophysiology
      assertion:
        name: Oncogenic Signaling Activation
        description: Beyond producing granules, loss of ATP6AP1/ATP6AP2 confers oncogenic properties.
          V-ATPase/lysosomal dysfunction enhances signaling through PDGFR-beta, Src-family kinases (SFKs),
          and STAT5a/b, and engages the PI3K-AKT-mTOR axis (especially in malignant GCT, which additionally
          acquires TP53 and PIK3CA alterations), driving proliferation and survival of the Schwann-lineage
          tumor cells. This signaling rationale underlies the activity of the multi-kinase inhibitor pazopanib.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
        gene_products:
        - preferred_term: PDGFR-beta
          term:
            id: NCIT:C30164
            label: Platelet-Derived Growth Factor Receptor Beta
      selected_evidence:
        snippet: "antitumoral effects of pazopanib in \nGCT might be due to a loss-of-function of ATP6AP1/2\
          \ genes which consequently \nenhance signaling through several molecular pathways, such as SFKs,\
          \ STAT5a/b, \nand PDGFR-β"
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37958362
      reference_title: 'Antiangiogenics in Malignant Granular Cell Tumors: Review of the Literature.'
