              label: granular cell tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ATP6AP1/ATP6AP2 Loss-of-Function Mutation
        genetic_context:
          variant_origin: SOMATIC
        description: The genetic driver of most GCTs is a clonal, mutually exclusive, inactivating (truncating/frameshift/splice-site)
          somatic mutation in the V-ATPase accessory-protein genes ATP6AP1 (Xq28) or ATP6AP2 (Xp11.4).
          These are present in roughly 65-72% of GCTs across anatomic sites; other V-ATPase subunit genes
          (e.g., ATP6V0C, ATP6V1A, ATP6V0A4) are mutated in a minority. In multifocal disease, separate
          tumors carry distinct mutations, indicating independent clonal origins.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
      selected_evidence:
        snippet: "whole-exome sequencing and targeted sequencing analysis to reveal mutually \nexclusive,\
          \ clonal, inactivating somatic mutations in the endosomal pH regulators \nATP6AP1 or ATP6AP2\
          \ in 72% of GCTs"
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30166553
      reference_title: Loss-of-function mutations in ATP6AP1 and ATP6AP2 in granular cell tumors.
      evidence_source: HUMAN_CLINICAL
      explanation: The seminal study by Pareja et al. established mutually exclusive, clonal, inactivating
