      assertion_type: Pathophysiology
      assertion:
        name: ANCA-Mediated Neutrophil Activation
        conforms_to: necrotizing_vasculitis#Intramural Leukocyte Degranulation and Oxidative Burst
        description: Anti-proteinase 3 (PR3) antibodies bind to primed neutrophils, causing activation,
          degranulation, and release of reactive oxygen species and lytic enzymes. This causes direct
          endothelial damage and vessel wall necrosis. Neutrophil extracellular trap (NET) formation further
          amplifies vascular injury.
        cell_types:
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: Endothelial Cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Neutrophil Activation
          term:
            id: GO:0042119
            label: neutrophil activation
        - preferred_term: Neutrophil Extracellular Trap Formation
          term:
            id: GO:0140645
            label: neutrophil extracellular trap formation
      selected_evidence:
        snippet: The pathogenesis of AAV includes ANCA-mediated neutrophil activation, subsequent release
          of inflammatory cytokines and reactive oxygen species (ROS), and formation of neutrophil extracellular
          traps (NETs).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
