      assertion:
        name: Morphologic diagnostic marker for graphite pneumoconiosis
        definition_type: DIAGNOSTIC_CRITERIA
        description: The identifying morphologic feature is the nonasbestos ferruginous body with a black
          graphite core, which can be found in sputum as well as in tissue. Radiographic change is reticular
          and nodular, and bronchoalveolar lavage with transbronchial biopsy supports a mixed dust pattern
          rather than identifying the mineral.
        scope: Pathological and radiological recognition
      selected_evidence:
        snippet: The morphologic landmark of graphite pneumoconiosis is nonasbestos ferruginous bodies
          with a black graphite core.
        supports: SUPPORT
