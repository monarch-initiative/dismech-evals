        context: []
      assertion_type: Environmental
      assertion:
        name: Occupational inhalation of graphite dust in mining and milling
        description: Underground graphite mining and milling generates respirable graphite dust. Radiographic
          lesion prevalence fell from 18.3% in a 1972 survey to 3.4% in a 1987 survey at a different mine,
          and across three rounds of one prospective cohort; the source attributes the decline to dust
          control introduced after 1972 while noting the comparison is between different mines.
        exposure_term:
          preferred_term: exposure to respirable graphite dust
          term:
            id: ECTO:7000023
            label: exposure to mineral dust
          qualifiers:
          - predicate:
              preferred_term: has input
              term:
                id: RO:0002233
                label: has input
            value:
              preferred_term: graphite
              term:
                id: CHEBI:33418
                label: graphite
        effect: Delivers respirable graphite-containing dust, with its mineral impurities, to the distal
          lung over decades.
        notes: No ECTO class names graphite exposure. Searched the local ECTO build on 2026-10-07 with
          `runoak -i sqlite:obo:ecto info` for `l~graphite`, `l~carbonaceous`, `l~soot`, `l~plumbago`
          and `l~anthracite`, all of which return nothing; `l~carbon` returns only carbon monoxide, carbon
          dioxide and polycyclic hydrocarbon classes; `l~black` returns ECTO:9002171 exposure to carbon
          black, which is a different material from graphite and is not bound here. ECTO:7000023 exposure
          to mineral dust is therefore used as the nearest true parent, graphite being a mineral form
          of native carbon, with the specificity carried in `preferred_term` and the substance attached
          as a qualifier.
      selected_evidence:
        snippet: A cohort of workers from a graphite mine in Sri Lanka was studied in 1987, 1990 and 1993.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
