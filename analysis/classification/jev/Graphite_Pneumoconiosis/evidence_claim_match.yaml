          modifier: INCREASED
          term:
            id: GO:0006909
            label: phagocytosis
        notes: Measured in Fischer 344 rats after a single acute inhalation exposure, at doses of 1 to
          500 mg/m3 that are far above decades of workplace exposure. The retention is directly observed;
          the human chronic kinetics are inferred.
      selected_evidence:
        snippet: AM from the silica study, as well as from the 100 and 500 mg/m3 graphite studies, contained
          ingested particles throughout the entire 3 month experimental period.
