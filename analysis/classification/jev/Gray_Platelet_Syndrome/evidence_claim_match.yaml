      assertion:
        name: Reduced Effector T Cell CTLA-4 Expression
        biological_scale: MOLECULAR
        description: NBEAL2 associates with CTLA-4 in primary T cells, and its loss lowers CTLA-4 expression
          in patient effector T cells while leaving regulatory T cells apparently unaffected — a selectivity
          that matters, since it removes a brake from the effector compartment specifically. The mechanism
          has a close precedent in LRBA, a BEACH-domain relative whose recessive loss causes autoimmunity
          through defective CTLA-4 trafficking.
        cell_types:
        - preferred_term: effector T cell
          term:
            id: CL:0000911
            label: effector T cell
      selected_evidence:
        snippet: Investigating the potential association between NBEAL2 and CTLA-4 signalling suggested
          by the mass spectrometry results, we confirm by co-immunoprecipitation that CTLA-4 and NBEAL2
          interact with each other.
        supports: SUPPORT
