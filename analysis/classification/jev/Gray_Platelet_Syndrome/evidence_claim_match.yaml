              label: gray platelet syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Peripheral blood smear and electron microscopy
        description: Large, pale gray platelets on a stained smear are the diagnostic clue that names
          the disease; transmission electron microscopy showing absent or markedly reduced alpha-granules
          with preserved dense granules is the structural confirmation, and it is that contrast — alpha
          absent, dense preserved — that distinguishes GPS from the combined storage pool defects.
      selected_evidence:
        snippet: GPS platelets are large and appear gray on light microscopy (Fig. 1a-b)5-7; the diagnosis
          is confirmed by electron microscopy (EM) showing absent or markedly reduced α-granules in platelets8(Fig.
          1c-d) and in megakaryocytes9, although both platelets and megakaryocytes have rudimentary α-granule
          precursors10.
        supports: SUPPORT
    origin:
