              acts on the disease rather than on its consequences: transplantation replaces the NBEAL2-deficient
              haematopoietic compartment. It has been achieved in a GPS patient with severe myelofibrosis
              and pancytopenia, with full haematopoietic recovery and resolution of the marrow fibrosis
              — which is also the strongest available evidence that the fibrosis is driven by the haematopoietic
              cells rather than by an intrinsic stromal defect. It is curated as an option for selected
              patients with a severe course, not as standard care: the evidence is a single reported patient.'
            therapeutic_modality: CELL_THERAPY
            treatment_term:
              preferred_term: hematopoietic cell transplantation
              term:
                id: NCIT:C15431
                label: Hematopoietic Cell Transplantation
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Progressive Myelofibrosis
        treatment_effect: RESTORES
        description: Replacing the NBEAL2-deficient megakaryocyte compartment removes the source of the
          constitutive cargo release proposed to drive fibrosis; the reported resolution of marrow fibrosis
          after transplant is the closest thing to a test of that mechanism in a patient.
      selected_evidence:
        snippet: Successful hematopoietic stem cell transplantation has been achieved in a GPS patient
          with severe myelofibrosis and pancytopenia, with full hematopoietic recovery and resolution
