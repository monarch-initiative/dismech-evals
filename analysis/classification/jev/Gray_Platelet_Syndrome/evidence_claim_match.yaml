  2b64140ee16e6e66be7167875f500b42b07c3692fc7a75cb5fc5bfa4b55792cc:
    claim:
      about:
        disease:
          name: Gray Platelet Syndrome
          disease_term:
            preferred_term: gray platelet syndrome
            term:
              id: MONDO:0007686
              label: gray platelet syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gps_myelofibrosis_mechanism_unproven
        kind: KNOWLEDGE_GAP
        prompt: Is marrow fibrosis in GPS actually caused by constitutive megakaryocyte release of fibrogenic
          cargo, or is that inference from the packaging defect?
        attaches_to:
        - pathophysiology#Progressive Myelofibrosis
        rationale: 'The leakage model is the consensus account and it is mechanistically natural, but
          the primary literature states plainly that the basis of the myelofibrosis remains unknown, and
          the fibrogenic-growth-factor step has not been demonstrated by direct marrow measurement in
          patients. The causal edge into this node is therefore recorded as having unknown intermediates.
          What would settle it is quantification of PDGF and TGF-beta in GPS marrow alongside fibrosis
          grade, or a fibrosis rescue in the knockout by blocking those factors.

          Two further points bear on why this has stayed open. First, a second, non-exclusive candidate
          exists and is rarely stated alongside the leakage model: microarray data in GPS fibroblasts
          showed overexpression of fibronectin, which is essential for proplatelet formation and critical
          for megakaryocyte-matrix interaction - a matrix mechanism rather than a cargo-release one. The
          two predict different things about whether suppressing megakaryocyte output would slow the fibrosis.
          Second, the obstacle is concrete rather than merely one of priority: the fibrotic marrow itself
          prevented the gene-discovery authors from harvesting enough megakaryocytes to culture, and megakaryocytes
          are the only cell type that expresses the packaging defect. That is why the mouse, which reproduces
          the splenomegaly and granule phenotype, is the natural system in which to test a hypothesis
          human tissue has resisted.'
      selected_evidence:
        snippet: Our previous microarray data in GPS fibroblasts showed overexpression of fibronectin11,
          essential for proplatelet formation in cultured megakaryocytes12 and critical for megakaryocyte-matrix
          interactions13.
        supports: SUPPORT
