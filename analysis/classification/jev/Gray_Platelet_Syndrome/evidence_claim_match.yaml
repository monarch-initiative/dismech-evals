  9423905d60b50709e7dc1dda3ae41b43ed5f741a9829c4695e4c50e642ea1845:
    claim:
      about:
        disease:
          name: Gray Platelet Syndrome
          disease_term:
            preferred_term: gray platelet syndrome
            term:
              id: MONDO:0007686
              label: gray platelet syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gps_nbeal2_molecular_function_unknown
        kind: KNOWLEDGE_GAP
        prompt: How does loss of NBEAL2 function mechanistically cause defective alpha-granule biogenesis?
        attaches_to:
        - pathophysiology#Failure of Alpha-Granule Cargo Packaging
        rationale: The causal gene has been known since 2011 and the step it acts at has been bracketed
          - late in biogenesis, downstream of VPS33B/VPS16B - but the molecular function itself remains
          unstated. Its predicted interactors, WDFY3 and through it LYST, rest entirely on computational
          prediction, a limitation the gene-discovery paper states explicitly. This is a gap in molecular
          mechanism rather than in disease-gene assignment, and it is why the cargo-packaging node is
          necessarily described phenomenologically rather than as a pathway.
        proposed_experiments:
        - experiment_id: exp_nbeal2_interactome
          name: Proximity-labelling interactome of NBEAL2 in human megakaryocytes
          description: Use proximity-dependent biotinylation of tagged NBEAL2 in iPSC-derived human megakaryocytes
            to identify physical interactors at the dense tubular system, and test the predicted WDFY3
            interaction directly. Replacing computationally predicted partners with measured ones is the
            prerequisite for any mechanistic model of the packaging step.
      selected_evidence:
        snippet: How absence of NBEAL2 function in megakaryocytes results in defective α-granule biogenesis
          remains unknown.
        supports: SUPPORT
