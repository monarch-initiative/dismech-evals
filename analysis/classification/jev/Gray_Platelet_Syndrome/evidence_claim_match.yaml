  bab6c00582cc82308319a5a087e79f8b6d38069d0d4dbb4fba98918769a14491:
    claim:
      about:
        disease:
          name: Gray Platelet Syndrome
          disease_term:
            preferred_term: gray platelet syndrome
            term:
              id: MONDO:0007686
              label: gray platelet syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Leukocyte Granule Deficiency
        biological_scale: CELLULAR
        description: 'The same biogenesis defect expressed outside the megakaryocyte lineage. In patients,
          neutrophils show reduced specific and gelatinase granule content with elevated surface and circulating
          granule proteins — the signature of inappropriate release rather than failed synthesis, since
          neutrophils differentiated in vitro from the same patients'' progenitors have normal granule
          abundance — together with impaired extracellular trap formation, while azurophilic granules
          are preserved. The NK-cell defect is a separate claim with a separate evidence base: reduced
          numbers and impaired degranulation are established in Nbeal2-deficient mice, and whether the
          NK compartment is also altered in human GPS is explicitly an open question. Clinically the human
          picture is low leukocyte counts and a modest excess of mild infections rather than severe immunodeficiency.'
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        biological_processes:
        - preferred_term: neutrophil extracellular trap formation
          term:
            id: GO:0140645
            label: neutrophil extracellular trap formation
          modifier: DECREASED
      selected_evidence:
        snippet: Low leukocyte counts, decreased neutrophil granulation and impaired neutrophil extracellular
          trap formation represent prominent findings in GPS patients, reflecting deranged innate immunity
          and associated with an increased susceptibility to infection.
        supports: SUPPORT
