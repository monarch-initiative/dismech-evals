        description: 'Biallelic loss-of-function variants in NBEAL2, a 54-exon gene on 3p21 encoding a
          2754-amino-acid BEACH-domain scaffolding protein. The variant spectrum is broad — 86 different
          variants across 69 pedigrees, mostly private, comprising frameshift, nonsense, missense, splicing
          and small indels scattered along the gene — and no genotype-phenotype correlation has been demonstrated,
          either by mutation type or by position. That absence is itself informative: it argues the phenotype
          reflects loss of a single function rather than graded residual activity.'
        cell_types:
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
      selected_evidence:
        snippet: Eighty-six different NBEAL2 variants have been detected in 69 GPS pedigrees described
          to date, harbouring homozygous (65%) or compound heterozygous (35%) mutations.
        supports: SUPPORT
