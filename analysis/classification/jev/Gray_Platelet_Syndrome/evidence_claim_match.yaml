      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cargo_packaging_failure_model
        hypothesis_label: NBEAL2 loss as a failure of cargo packaging and retention, not of granule cargo
          synthesis
        status: CANONICAL
        description: The defect is downstream of synthesis. Megakaryocytes make alpha-granule proteins;
          what they cannot do is get them into, or keep them in, the developing granule. Two observations
          pin this down. Endogenously synthesized cargo (platelet factor 4, beta-thromboglobulin) is markedly
          reduced while endocytosed constituents are much less affected — exactly the asymmetry a packaging
          defect predicts and a synthesis defect does not. And in the mouse model, P-selectin is still
          present and externalized on activation and VPS33B/VPS16B levels are normal, placing NBEAL2 downstream
          of and independent from that trafficking axis, at a later stage of granule biogenesis.
      selected_evidence:
        snippet: In GPS, proteins synthesized in megakaryocytes are markedly reduced, while endocytosed
          α-granule constituents are less affected3. This suggests that GPS megakaryocytes fail to pack
          their endogeneously synthesized secretory proteins into developing α-granules.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
