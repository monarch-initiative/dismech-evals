      assertion:
        name: Haematopoietic stem cell transplantation
        description: 'The only reported curative option, and the only treatment in this entry that acts
          on the disease rather than on its consequences: transplantation replaces the NBEAL2-deficient
          haematopoietic compartment. It has been achieved in a GPS patient with severe myelofibrosis
          and pancytopenia, with full haematopoietic recovery and resolution of the marrow fibrosis —
          which is also the strongest available evidence that the fibrosis is driven by the haematopoietic
          cells rather than by an intrinsic stromal defect. It is curated as an option for selected patients
          with a severe course, not as standard care: the evidence is a single reported patient.'
