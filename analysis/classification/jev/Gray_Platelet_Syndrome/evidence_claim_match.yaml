  dda979d4839910ea13a0fdbc03d2a902623e71cbde8d2e5b7a67a485ab7eeed7:
    claim:
      about:
        disease:
          name: Gray Platelet Syndrome
          disease_term:
            preferred_term: gray platelet syndrome
            term:
              id: MONDO:0007686
              label: gray platelet syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Nbeal2 knockout mouse
        species: Mouse
        genotype: Nbeal2-/-
        publication: PMID:23863626
        description: 'The principal model, independently generated by more than one group with concordant
          results — including a spontaneous 8 bp Nbeal2 deletion found incidentally in an unrelated mutagenesis
          screen, which reproduces the same phenotype and so was not shaped by anyone''s expectation of
          it. It reproduces the human syndrome closely — splenomegaly, macrothrombocytopenia, absent platelet
          alpha-granules and their cargo — and adds the functional measurements that cannot be made in
          patients: impaired adhesion, aggregation and coagulant activity translating into defective arterial
          thrombus formation, and abnormal megakaryocyte maturation, survival and ploidy.'
        modeled_mechanisms:
        - target: Failure of Alpha-Granule Cargo Packaging
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the core lesion — defective alpha-granule biogenesis in megakaryocytes
            with absence from platelets and loss of the specific cargo proteins depleted in patients.
          limitations: 'One documented species difference matters for interpretation: azurophilic neutrophil
            granules are preserved in human GPS but reduced in the mouse, so the model overstates the
            neutrophil granule phenotype. Attributed to the review rather than curated as evidence here,
            since no citable primary comparison was established during curation.'
          readouts:
          - name: Platelet alpha-granule cargo content (VWF, thrombospondin-1, platelet factor 4)
            target: Failure of Alpha-Granule Cargo Packaging
            direction: DECREASED
            interpretation: Loss of the same cargo proteins depleted in patient platelets is the model's
              most direct correspondence to the human lesion.
        - target: Leukocyte Granule Deficiency
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the leukocyte arm — severe reduction in neutrophil granule content and
            dysfunctional NK cells with reduced degranulation — and supplies the infection-challenge data
            that cannot be obtained in patients.
          limitations: 'The reduction spans all neutrophil granule subsets in the mouse, whereas azurophilic
            granules are preserved in patients, so the model overstates the human neutrophil phenotype.
            The infection phenotype is also more severe: Nbeal2-deficient mice are susceptible to Staphylococcus
            aureus and murine CMV, while patients report mild respiratory infections rather than severe
            ones. NK involvement in human GPS is unestablished, so that half of the link is model-only.'
          readouts:
          - name: Neutrophil granule content across subsets
            target: Leukocyte Granule Deficiency
            direction: DECREASED
            interpretation: Granule depletion in a second lineage supports NBEAL2 acting as a general
              granule-biogenesis factor rather than a megakaryocyte-specific one.
          - name: NK cell degranulation
            target: Leukocyte Granule Deficiency
            direction: DECREASED
            interpretation: Impaired NK degranulation is the second lymphoid readout, and the one with
              no established human counterpart.
        - target: Macrothrombocytopenia and Impaired Platelet Function
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces both the count/size phenotype and the functional deficit, and supplies
            the in vivo thrombosis readout that establishes the deficit is haemostatically consequential
            rather than only detectable ex vivo.
          limitations: Murine bleeding assays and laser-induced arterial injury do not map onto the clinical
            bleeding phenotype (epistaxis, menorrhagia, post-procedural bleeding) in any quantitative
            way, so the model cannot be used to predict an individual patient's bleeding severity — which
            is also unpredictable from genotype in patients.
          readouts:
          - name: Arterial thrombus formation on intravital imaging
            target: Macrothrombocytopenia and Impaired Platelet Function
            direction: DECREASED
            interpretation: Defective thrombus formation in vivo confirms the ex vivo platelet function
              deficit has haemostatic consequence.
      selected_evidence:
        snippet: Here we show that Nbeal2-knockout mice display the characteristics of human GPS, with
          defective α-granule biogenesis in MKs and their absence from platelets.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23863626
      reference_title: Gray platelet syndrome and defective thrombo-inflammation in Nbeal2-deficient mice.
