      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pan_leukocyte_granule_defect_model
        hypothesis_label: NBEAL2 as a general granule-biogenesis factor across blood lineages, with CTLA-4
          mislocalization causing autoimmunity
        status: CANONICAL
        description: 'GPS is not confined to platelets. Proteomic comparison across GPS platelets, neutrophils,
          monocytes, and CD4 lymphocytes found that the proteins depleted in each are enriched for granule
          constituents — one molecular defect expressed in four lineages. The autoimmune arm has its own
          mechanism: NBEAL2 co-immunoprecipitates with CTLA-4, and NBEAL2 deficiency lowers CTLA-4 expression
          in patient effector T cells while sparing regulatory T cells, with knockdown in healthy T cells
          reproducing the finding. The parallel with LRBA — the same BEACH-domain family, autoimmunity
          through defective CTLA-4 trafficking — is what makes this more than a correlation.'
      selected_evidence:
        snippet: Proteins less abundant in these cells were enriched for constituents of granules, supporting
          a role for Nbeal2 in the function of these organelles across a wide range of blood cells.
        supports: SUPPORT
    origin:
