      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: megakaryocyte_leakage_myelofibrosis_model
        hypothesis_label: Constitutive megakaryocyte cargo release into marrow stroma as the driver of
          myelofibrosis
        status: CANONICAL
        description: The best available explanation for the disorder's most consequential complication.
          Because cargo cannot be retained, proteins that should only be released on platelet activation
          are instead released constitutively from megakaryocytes into the marrow. Chronic exposure of
          stroma to fibrogenic growth factors — platelet-derived growth factor prominently — is the proposed
          route to progressive fibrosis, with splenomegaly following as compensatory extramedullary haematopoiesis.
          Curated as CANONICAL because it is the consensus account across the primary literature and the
          review, while noting that the basis of the myelofibrosis has been explicitly described as unknown
          and the growth-factor step is inference from the packaging defect rather than a demonstrated
          marrow measurement in patients.
      selected_evidence:
        snippet: Proteins normally only released upon platelet activation are spontaneously released from
          MKs; most likely because of the lack of α-granules3.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
