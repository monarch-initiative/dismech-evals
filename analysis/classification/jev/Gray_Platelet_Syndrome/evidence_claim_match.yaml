      reference: PMID:21765412
      reference_title: NBEAL2 is mutated in gray platelet syndrome and is required for biogenesis of platelet
        α-granules.
      evidence_source: HUMAN_CLINICAL
      explanation: The cargo-origin asymmetry that distinguishes a packaging failure from a synthesis
