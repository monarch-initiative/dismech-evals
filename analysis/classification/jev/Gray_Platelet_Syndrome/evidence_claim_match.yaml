      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        description: Classic GPS is autosomal recessive, with biallelic NBEAL2 variants — homozygous in
          about two thirds of pedigrees and compound heterozygous in the remainder. Heterozygous carriers
          may show a mild reduction in alpha-granule content without thrombocytopenia. Autosomal dominant
          (GFI1B) and X-linked (GATA1) disorders producing gray, agranular platelets exist but are distinct
          entities and are curated as differentials rather than as subtypes here.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: The mode of inheritance was autosomal recessive (AR) in 11 and indeterminate in 3 families.
        supports: SUPPORT
