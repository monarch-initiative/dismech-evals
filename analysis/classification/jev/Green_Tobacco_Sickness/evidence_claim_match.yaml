      assertion_type: Pathophysiology
      assertion:
        name: Transdermal Nicotine Absorption
        description: 'Nicotine dissolved in dew, rainwater, or perspiration on tobacco leaf surfaces penetrates
          the skin upon direct contact, bypassing first-pass hepatic metabolism. The rate of absorption
          increases with moisture on leaves, ambient temperature, duration of skin contact, physical exertion,
          and compromised skin integrity. High ambient temperatures increase skin absorption and plasma
          nicotine concentrations by 30-45%. Physical labor shunts blood to the skin, further increasing
          dermal nicotine absorption.

          '
        chemical_entities:
        - preferred_term: Nicotine
          term:
            id: CHEBI:17688
            label: (S)-nicotine
      selected_evidence:
        snippet: It is caused by the absorption of nicotine through the skin while the workers are engaged
          in handling the uncured tobacco leaves.
        supports: SUPPORT
