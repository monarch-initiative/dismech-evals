        name: Central Nervous System Effects
        description: 'Nicotine crossing the blood-brain barrier acts on central nAChRs, directly stimulating
          the chemoreceptor trigger zone (area postrema) to produce reflex vomiting independent of peripheral
          gastrointestinal stimulation. Central nicotinic effects also alter cerebrovascular tone and
          vestibular processing, contributing to headache and dizziness. These central effects are mechanistically
          distinct from the peripheral autonomic ganglia dysfunction, though both contribute to the overall
          symptom profile.

          '
