        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nicotinic Acetylcholine Receptor Overstimulation
        description: 'Absorbed nicotine binds to nicotinic acetylcholine receptors (nAChRs) at autonomic
          ganglia, neuromuscular junctions, and in the central nervous system, causing initial stimulation
          followed by desensitization and blockade. This produces the characteristic constellation of
          gastrointestinal, neurological, and cardiovascular symptoms. Smokers and tobacco users may develop
          tolerance to nicotine effects via chronic nAChR desensitization, providing partial protection
          against GTS.

          '
        biological_processes:
        - preferred_term: Cholinergic Synaptic Transmission
          term:
            id: GO:0007271
            label: synaptic transmission, cholinergic
          modifier: INCREASED
      selected_evidence:
        snippet: Mecamylamine (Inversine®, Vecamyl®), a nicotinic acetylcholine receptor (nAChR) antagonist,
          should be tested as a remedy for green tobacco sickness.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
