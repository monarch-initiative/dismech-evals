              id: MONDO:1060229
              label: green tobacco sickness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuromuscular Junction Disruption
        description: 'Nicotine overstimulates nAChRs at the neuromuscular junction (the synapse between
          motor neurons and skeletal muscle fibers), initially causing excessive muscle activation followed
          by receptor desensitization and depolarization block. This produces generalized weakness, prostration,
          and impaired respiratory muscle function contributing to breathlessness. This mechanism is analogous
          to the depolarizing block produced by succinylcholine and is mechanistically distinct from the
          autonomic and central nervous system effects.

          '
        biological_processes:
        - preferred_term: Neuromuscular Synaptic Transmission
          term:
            id: GO:0007274
            label: neuromuscular synaptic transmission
          modifier: DECREASED
      selected_evidence:
        snippet: The symptoms include nausea, vomiting, pallor, dizziness, headaches, increased perspiration,
          chills, abdominal pain, diarrhea, increased salivation, prostration, weakness, breathlessness,
          and occasional lowering of blood pressure.
        supports: SUPPORT
