      assertion_type: Pathophysiology
      assertion:
        name: GLI3 Haploinsufficiency
        conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
        description: 'GLI3 is a bifunctional zinc-finger transcription factor that mediates Hedgehog (Hh)
          signaling. In the absence of Hh signal, GLI3 is proteolytically processed into a truncated repressor
          form (GLI3R); when Hh is present, full-length GLI3 acts as a transcriptional activator (GLI3A).
          GCPS results from reduced total GLI3 protein through diverse mutation types (deletions, translocations,
          missense, frameshift), consistent with haploinsufficiency.

          '
        genes:
        - preferred_term: GLI3
          term:
            id: hgnc:4319
            label: GLI3
        biological_processes:
        - preferred_term: Hedgehog Signaling Pathway
          term:
            id: GO:0007224
            label: smoothened signaling pathway
      selected_evidence:
        snippet: GCPS was caused by many types of alterations, including translocations, large deletions,
          exonic deletions and duplications, small in-frame deletions, and missense, frameshift/nonsense,
          and splicing mutations
        supports: SUPPORT
