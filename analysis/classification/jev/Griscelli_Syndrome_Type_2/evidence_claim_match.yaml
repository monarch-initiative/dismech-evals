      assertion_type: Pathophysiology
      assertion:
        name: Failure of Peripheral Melanosome Capture and Transfer to Keratinocytes
        conforms_to: lysosome_related_organelle_biogenesis#Failed Delivery of Functional Melanosomes to
          Keratinocytes
        biological_scale: CELLULAR
        description: 'Melanosomes are not captured at the melanocyte periphery and are not transferred
          to surrounding keratinocytes. The histological consequence is diagnostic and is the inverse
          of what albinism produces: melanocytes are large and distended with abundant melanin, while
          the adjacent keratinocytes contain essentially none. In the hair shaft the same failure produces
          the large, irregular clumps of melanin that give the hair its silvery appearance and are the
          microscopic hallmark of the disease.'
        cell_types:
        - preferred_term: melanocyte
          term:
            id: CL:0000148
            label: melanocyte
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: melanosome transport
          term:
            id: GO:0032402
            label: melanosome transport
          modifier: DECREASED
        - preferred_term: pigmentation
          term:
            id: GO:0043473
            label: pigmentation
          modifier: DECREASED
      selected_evidence:
        snippet: The melanocytes were large and distended with a large volume of melanin (Figure 2). The
          adjacent keratinocytes were completely devoid of melanin.
        supports: SUPPORT
