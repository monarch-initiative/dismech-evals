          curiosity. It is the usual presenting problem, recognized before the pigmentary clue, and it
          is the cause of death in untreated disease.'
      selected_evidence:
        snippet: Finally, we propose that all patients with GS have RAB27A mutations and immunologic abnormalities
          that sometimes result in secondary neurological involvement.
        supports: SUPPORT
