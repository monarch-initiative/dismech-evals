        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of a Component of the RAB27A-Melanophilin-Myosin Va Complex
        conforms_to: lysosome_related_organelle_biogenesis#Loss of a Lysosome-Related Organelle Biogenesis
          or Trafficking Component
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function variants remove one member of the tripartite complex
          that links melanosomes to the actin cytoskeleton: the small GTPase RAB27A on the melanosome
          membrane, the actin-based motor myosin Va on actin filaments, and melanophilin, which bridges
          the two. Melanophilin binds RAB27A through its N-terminal domain and myosin Va through its C-terminal
          coiled-coil region, so loss of any one member breaks the same physical link.'
        cell_types:
        - preferred_term: melanocyte
          term:
            id: CL:0000148
            label: melanocyte
        cellular_components:
        - preferred_term: melanosome
          term:
            id: GO:0042470
            label: melanosome
      selected_evidence:
        snippet: Cosedimentation assays using recombinant proteins reveal that melanophilin directly binds
          to Rab27a and myosin Va through its N-terminal and its first C-terminal coiled-coil region,
          respectively. Moreover, we show that Rab27a, melanophilin, and myosin Va form a ternary complex
          in the human melanocyte cell line HMV-II.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12062444
      reference_title: Melanophilin directly links Rab27a and myosin Va through its distinct coiled-coil
        regions.
      evidence_source: IN_VITRO
      explanation: Demonstrates the tripartite complex biochemically and in a human melanocyte line, establishing
        why three different genes give one disease.
