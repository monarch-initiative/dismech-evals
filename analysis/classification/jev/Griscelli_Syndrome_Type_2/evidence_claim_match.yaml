      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cytotoxic Granule Exocytosis
        conforms_to: lysosome_related_organelle_biogenesis#Failure of Other Lysosome-Related Organelles
          Sharing the Machinery
        biological_scale: CELLULAR
        description: RAB27A is required not only for melanosome transport but for the regulated exocytosis
          of cytotoxic granules by cytotoxic T lymphocytes and NK cells. The cytotoxic granule is a lysosome-related
          organelle like the melanosome, so the same trafficking lesion removes lymphocyte cytotoxic function
          alongside pigmentation. This arm is specific to the RAB27A subtype; it is absent in the MLPH-associated
          (GS3) disorder, whose gene product acts only within the melanosome complex.
        cell_types:
        - preferred_term: cytotoxic T cell
          term:
            id: CL:0000910
            label: cytotoxic T cell
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        biological_processes:
        - preferred_term: regulated exocytosis
          term:
            id: GO:0045055
            label: regulated exocytosis
          modifier: DECREASED
        notes: The mechanistic link from RAB27A to cytotoxic granule exocytosis is stated here on the
          strength of the clinical association plus RAB27A's established role as a regulator of regulated
          exocytosis. The cited sources support the association of HLH with the RAB27A subtype; they are
          not cited as demonstrating the granule-release defect experimentally, and the node is written
          to keep that distinction visible.
      selected_evidence:
        snippet: Most patients with GS display the hemophagocytic syndrome and have mutations in RAB27A,
          which codes for a small GTPase.
        supports: SUPPORT
    origin:
