        context: []
      assertion_type: Genetic
      assertion:
        name: MLPH
        notes: MLPH (2q37.3) encodes melanophilin, a RAB27A effector with an N-terminal RAB27-binding
          Slp homology domain, a C-terminal half that binds the myosin Va globular tail, and an actin-binding
          domain. Reported GS3 alleles are few; p.R35W recurs in Arab and Turkish families. Older reports
          number it c.102C>T and later ones c.103C>T for the same p.R35W change.
        gene_term:
          preferred_term: MLPH
          term:
            id: hgnc:29643
            label: MLPH
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: MLPH p.R35W
          description: Homozygous missense in the Slp homology domain (c.103C>T, reported as c.102C>T
            in older nomenclature). Recurrent in Arab and Turkish families; abolishes the RAB27A interaction
            and leaves almost no melanophilin protein in patient melanocytes.
        - name: MLPH p.D25H
          description: Homozygous missense (c.73G>C) in the Slp homology domain, reported in a Chinese
            Han patient from a non-consanguineous family. It reduces RAB27A binding without lowering protein
            level.
      selected_evidence:
        snippet: We herein present genetic and functional evidence that a third form of GS (GS3), whose
          expression is restricted to the characteristic hypopigmentation of GS, results from mutation
          in the gene that encodes melanophilin (Mlph), the ortholog of the gene mutated in leaden mice.
        supports: SUPPORT
