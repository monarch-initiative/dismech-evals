      assertion_type: Pathophysiology
      assertion:
        name: MLPH Loss of Function
        conforms_to: lysosome_related_organelle_biogenesis#Loss of a Lysosome-Related Organelle Biogenesis
          or Trafficking Component
        biological_scale: MOLECULAR
        description: Biallelic germline MLPH variants remove functional melanophilin. The recurrent p.R35W
          and the p.D25H missense variants sit in the N-terminal Slp homology (RAB27-binding) domain;
          p.E98X truncates the protein. In patient melanocytes homozygous for p.R35W, melanophilin protein
          is almost undetectable, whereas p.D25H leaves protein abundance unchanged and acts through loss
          of binding instead - two routes to the same functional loss.
        genes:
        - preferred_term: MLPH
          term:
            id: hgnc:29643
            label: MLPH
        cell_types:
        - preferred_term: melanocyte
          term:
            id: CL:0000148
            label: melanocyte
        molecular_functions:
        - preferred_term: small GTPase binding (RAB27A)
          term:
            id: GO:0031267
            label: small GTPase binding
          modifier: DECREASED
        - preferred_term: myosin V binding
          term:
            id: GO:0031489
            label: myosin V binding
          modifier: DECREASED
      selected_evidence:
        snippet: MLPH protein expression is nearly absent in both GSIII melanocytes lysates (0.65% for
          DB200 and 3.61% for DB212) compared to control (100%) (Figure 4B).
        supports: SUPPORT
