      assertion_type: Pathophysiology
      assertion:
        name: Failure of the RAB27A-Melanophilin-Myosin Va Tripartite Complex
        biological_scale: MOLECULAR
        description: Melanophilin binds GTP-RAB27A on the melanosome through its N-terminal Slp homology
          domain and the globular tail of myosin Va through its C-terminal half, and also binds actin.
          It is required for myosin Va to associate with melanosomes. When melanophilin is lost, RAB27A
          still reaches the melanosome but myosin Va is not recruited, so the organelle is not captured
          by the peripheral actin network.
        cellular_components:
        - preferred_term: melanosome
          term:
            id: GO:0042470
            label: melanosome
      selected_evidence:
        snippet: Deletion analysis and site-directed mutagenesis showed that the N-terminal Slp (synaptotagmin-like
          protein) homology domain of Slac2-a specifically binds Rab27A/B isoforms and that the C-terminal
          half directly binds the globular tail of myosin Va.
        supports: SUPPORT
    origin:
