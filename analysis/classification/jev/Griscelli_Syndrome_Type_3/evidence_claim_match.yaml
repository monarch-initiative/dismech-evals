          into neighbouring epidermal keratinocytes and into the growing hair shaft is reduced and uneven.
          Pigment synthesis itself is normal; the defect is in delivery, which is why hair contains a
          few large irregular melanin clumps rather than evenly dispersed granules and why the skin is
          lighter than the family background.
        cell_types:
