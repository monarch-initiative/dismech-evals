          that leaves no detectable protein in fibroblasts, but complete ZPR1 loss is embryonic lethal
          in mouse and these children were liveborn and lived months to years. Either the mouse and human
          requirements differ, or some ZPR1 remains in tissues nobody has assayed. If the latter, the
          syndrome is a hypomorph''s phenotype and no patient carrying two complete loss-of-function alleles
          would survive to be found - which is consistent with the years of clinical sequencing since
          2018 having produced no confirmed second pathogenic allele. Note that this predicts nothing
          about a single truncating allele in trans with a hypomorph, which would be viable; that is exactly
          what the 2026 case report would be if its variants are ever phased and reclassified, and its
          own authors state that ZPR1 is intolerant to complete loss of function.

          What would resolve it is a second independent allele established as pathogenic, or a quantitative
          assay of residual ZPR1 in a tissue other than skin. Neither exists.

          A practical consequence follows for anyone reading a ZPR1 variant in a diagnostic laboratory:
          outside this founder population the entire evidence base for interpreting one is a single case
          report of two unphased variants of uncertain significance, and the gene has no ClinGen gene-disease
          validity classification - it does not appear in the ClinGen Gene-Disease Validity CSV at all.'
      selected_evidence:
        snippet: ZPR1 is intolerant to complete loss of function, consistent with embryonic lethality
          in mouse models
        supports: SUPPORT
