      assertion_type: Prevalence
      assertion:
        population: Middle Rio Grande Valley, New Mexico (Hispanic ancestry)
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'Six children in five families across two reports: four children from three families of
          New Mexican Hispanic heritage in 2018, and two sisters in 2026. All are homozygous for the same
          founder allele and all trace to the same region, so the disease is geographically concentrated
          rather than uniformly ultra-rare. No carrier frequency has been published, and none of the reports
          estimates a prevalence, so ULTRA_RARE is a qualitative band and no rate_per_100000 is recorded.

          A seventh child, reported in 2026 with two ZPR1 variants of uncertain significance rather than
          the founder allele, is deliberately not counted in this population record. The genotype is unconfirmed,
          and that report gives no ancestry or geography that would place the child inside or outside
          the founder population, so counting the case would attribute it to a population on no evidence.'
      selected_evidence:
        snippet: Our report confirms that homozygosity for c.587 T>C in ZPR1 underlies a novel genetic
          syndrome with autosomal recessive inheritance and that c.587 T>C is a founder variant for ZPR1
          disorder in the Middle Rio Grande Valley.
        supports: SUPPORT
