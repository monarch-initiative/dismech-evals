  61abbe498f1f24893108ac46e0f5f1777b063d62dbea4539b5569cf4b5d0e7d9:
    claim:
      about:
        disease:
          name: Growth Restriction Hypoplastic Kidneys Alopecia And Distinctive Facies
          disease_term:
            preferred_term: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
            term:
              id: MONDO:0859146
              label: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Subnuclear Localization of SMN and NPAT
        description: 'ZPR1 moves into the nucleus during S phase and concentrates with the survival motor
          neurons protein and the histone gene-specific transcription factor NPAT in subnuclear foci,
          including Cajal bodies sitting on histone gene clusters. Without ZPR1, both proteins lose that
          localisation and histone gene expression falls.

          This node is imported from ZPR1-deficiency work in cell lines and in Zpr1-null mouse embryos,
          not from patients. No patient tissue has been examined for SMN or NPAT localisation, so the
          node describes what ZPR1 loss does rather than what was observed in this disease.'
        biological_scale: CELLULAR
        cellular_components:
        - preferred_term: Cajal body
          term:
            id: GO:0015030
            label: Cajal body
      selected_evidence:
        snippet: These changes in subnuclear architecture and cell cycle progression may be caused by
          transcriptional defects in ZPR1-deficient cells, including decreased histone gene expression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
