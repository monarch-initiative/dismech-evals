            term:
              id: MONDO:0859146
              label: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ZPR1 p.Ile196Thr Homozygous Founder Variant
        description: ZPR1 c.587T>C (p.Ile196Thr), homozygous, in every patient with a confirmed genotype.
          Structural modelling places the substituted isoleucine in the hydrophobic core of the protein,
          which predicts a folding rather than an interaction defect. It remains the only ZPR1 allele
          established as disease-causing. One further genotype has been reported - a compound heterozygous
          pair of variants of uncertain significance, including a truncating allele, in a child with an
          overlapping phenotype - but its phase was never established and neither variant is classified
          beyond uncertain, so the genotype-phenotype relationship of the gene as a whole is still unknown.
          The allelic spectrum is set out in full on the ZPR1 genetic record.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ZPR1
          term:
            id: hgnc:13051
            label: ZPR1
      selected_evidence:
        snippet: Exome sequencing of the surviving individual identified a homozygous c.587T>C (p.Ile196Thr)
          mutation in ZPR1 Zinc Finger (ZPR1) that segregated appropriately in her family.
        supports: SUPPORT
