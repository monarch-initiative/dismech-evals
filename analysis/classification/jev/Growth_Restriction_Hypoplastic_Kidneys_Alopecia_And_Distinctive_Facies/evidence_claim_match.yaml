  fb32b257d2d89f80ab566bddb7f6cdb085e0d01fb6bf0075b78c77f1be1b4099:
    claim:
      about:
        disease:
          name: Growth Restriction Hypoplastic Kidneys Alopecia And Distinctive Facies
          disease_term:
            preferred_term: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
            term:
              id: MONDO:0859146
              label: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: zpr1_single_allele_single_population
        kind: KNOWLEDGE_GAP
        prompt: Every patient with a confirmed genotype is homozygous for one founder allele in one region.
          Is this the phenotype of the gene, or the phenotype of p.Ile196Thr?
        attaches_to:
        - pathophysiology#ZPR1 p.Ile196Thr Homozygous Founder Variant
        - genetic#ZPR1
        - prevalence#Middle Rio Grande Valley, New Mexico (Hispanic ancestry)
        rationale: 'Six children, five families, one variant, one region - counting only the patients
          whose genotype is confirmed. Nothing published separates the gene''s disease from this allele''s
          disease, and the two could differ substantially.

          One further genotype has been reported and it does not close the gap. A 2026 case report describes
          a child with an overlapping phenotype carrying two compound heterozygous ZPR1 variants of uncertain
          significance, one of them a maternally inherited frameshift. Its phase was never established
          and neither variant is classified beyond uncertain, so it is a candidate second genotype rather
          than a second allele. It does narrow the question usefully: the gap is no longer "has anyone
          ever seen another ZPR1 genotype" but "can that one be phased and classified".

          The specific reason to expect gene and allele might differ: p.Ile196Thr is a missense change
          that leaves no detectable protein in fibroblasts, but complete ZPR1 loss is embryonic lethal
          in mouse and these children were liveborn and lived months to years. Either the mouse and human
          requirements differ, or some ZPR1 remains in tissues nobody has assayed. If the latter, the
          syndrome is a hypomorph''s phenotype and no patient carrying two complete loss-of-function alleles
          would survive to be found - which is consistent with the years of clinical sequencing since
          2018 having produced no confirmed second pathogenic allele. Note that this predicts nothing
          about a single truncating allele in trans with a hypomorph, which would be viable; that is exactly
          what the 2026 case report would be if its variants are ever phased and reclassified, and its
          own authors state that ZPR1 is intolerant to complete loss of function.

          What would resolve it is a second independent allele established as pathogenic, or a quantitative
          assay of residual ZPR1 in a tissue other than skin. Neither exists.

          A practical consequence follows for anyone reading a ZPR1 variant in a diagnostic laboratory:
          outside this founder population the entire evidence base for interpreting one is a single case
          report of two unphased variants of uncertain significance, and the gene has no ClinGen gene-disease
          validity classification - it does not appear in the ClinGen Gene-Disease Validity CSV at all.'
      selected_evidence:
        snippet: Our report confirms that homozygosity for c.587 T>C in ZPR1 underlies a novel genetic
          syndrome with autosomal recessive inheritance and that c.587 T>C is a founder variant for ZPR1
          disorder in the Middle Rio Grande Valley.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40776660
      reference_title: 'Congenital Alopecia, Hypoplastic Kidneys, Growth Restriction, Growth Hormone Resistance,
        and Liver Fibrosis: Confirmation of a New Syndrome Caused by Biallelic Variants in ZPR1.'
      evidence_source: HUMAN_CLINICAL
      explanation: The founder-variant finding. It is what makes the replication meaningful and what makes
        it insufficient to generalise from - both families share an ancestral allele.
