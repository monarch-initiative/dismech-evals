            term:
              id: MONDO:0859146
              label: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
        context: []
      assertion_type: Phenotype
      assertion:
        name: Growth Hormone Resistance
        category: Endocrine
        description: 'Growth hormone resistance in the 2026 siblings - growth failure that does not respond
          to growth hormone as expected. This matters clinically out of proportion to how briefly it is
          reported: it predicts that growth hormone therapy, an obvious thing to try in a child with severe
          growth restriction, will not work, and it suggests the growth failure is cell-autonomous rather
          than endocrine.'
        phenotype_term:
          preferred_term: growth hormone resistance
        notes: 'Deliberately left unbound. HPO has no term for growth hormone resistance or growth hormone
          insensitivity: a search of the ontology returned 52 terms matching "growth hormone", none of
          which describes resistance, and targeted searches for "resistance", "insensitivity" and "Laron"
          returned nothing applicable either. HP:0000845 (Elevated circulating growth hormone concentration)
          and HP:0030353 (Decreased circulating insulin-like growth factor 1 concentration) are the laboratory
          findings that would normally establish resistance, but the abstract reports neither value, so
          binding either would assert a measurement that was not published. No term beats a wrong one.'
      selected_evidence:
        snippet: We expand our understanding of the phenotype by describing abnormal glucose homeostasis,
          growth hormone resistance, and progressive liver disease with decompensated portal hypertension
          and esophageal varices despite the absence of cirrhosis.
        supports: SUPPORT
