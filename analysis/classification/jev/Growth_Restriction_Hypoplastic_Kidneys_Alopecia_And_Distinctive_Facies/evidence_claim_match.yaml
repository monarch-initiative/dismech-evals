        notes: 'Left unbound deliberately. HP:0003819 (Death in childhood) is the right concept, but it
          sits in the HPO Mortality/Aging branch rather than under HP:0000118 (Phenotypic abnormality),
          so it is not a member of the PhenotypeTerm dynamic enum and binding it fails term validation.
          The same is true of HP:0001522 (Death in infancy). Other entries in this repository handle it
          the same way - see Autosomal_Recessive_Spondylometaphyseal_Dysplasia_Megarbane_Type. The mortality
          is also recorded in `progression`.

          Numerator and denominator: 3 of the 4 children in the founding cohort, before age 3. The two
          children in the 2026 report were alive at publication and are not counted either way, so no
          frequency band is recorded.'
      selected_evidence:
        snippet: Three of the children died before 3 years of age from uremia and/or sepsis.
        supports: SUPPORT
