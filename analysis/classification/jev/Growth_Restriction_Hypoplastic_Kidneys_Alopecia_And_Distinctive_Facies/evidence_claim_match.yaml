          value:
            name: Zpr1 heterozygous null mouse
            species: Mouse
            genotype: Zpr1 +/- (ZPR1-deficient, viable)
            publication: PMID:16648254
            description: 'The viable ZPR1-deficient mouse, and the one that produces a postnatal phenotype.
              It develops axonal pathology and neurodegeneration, and it was made and studied to test
              ZPR1 as a modifier of spinal muscular atrophy rather than as a model of any human ZPR1 syndrome.

              It is included here precisely because its phenotype does not match the human disease. A
              curator reaching for "the ZPR1 mouse" will find a neurodegeneration model, and no reported
              patient with this syndrome - confirmed genotype or not - has a motor neuron disease.'
            genes:
            - preferred_term: ZPR1
              term:
                id: hgnc:13051
                label: ZPR1
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Global Developmental Delay
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: The only neurological phenotype reported in patients with a confirmed genotype is
          global developmental delay, characterised over a few months to a few years of life. The mouse's
          phenotype is axonal pathology and neurodegeneration - a different kind of neurological disease,
          and one that no report of this syndrome describes.
        limitations: 'The mismatch may be about dose rather than about biology: the mouse is heterozygous
          and retains one working allele, while the patients have no detectable protein in the tissue
          examined, so the two are not the same lesion and the comparison is not controlled. It may equally
          be that early death from renal failure precludes a neurodegenerative phenotype ever being observed
          in patients, or that nobody has looked - no neuropathology, nerve conduction study or electromyogram
          is reported for any affected child. The one further reported child, whose ZPR1 genotype is unconfirmed
          (see the ZPR1 genetic record), had generalized hypotonia and brainstem and internal-capsule
          T2 signal change; neither is motor neuron disease, and the genotype is not established, so the
          mismatch stands. Recorded as FAILS_TO_RECAPITULATE because the published phenotypes do not correspond,
          not because degeneration has been excluded in patients.'
      selected_evidence:
        snippet: A novel autosomal recessive disorder characterized by pre- and postnatal growth restriction
