  70532bef9e566084dc431d53a3aedf9b13e96172821f5176a4d89f41ab2297a7:
    claim:
      about:
        disease:
          name: Growth Restriction Hypoplastic Kidneys Alopecia And Distinctive Facies
          disease_term:
            preferred_term: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
            term:
              id: MONDO:0859146
              label: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: zpr1_smn_axis_versus_the_human_syndrome
        kind: HUMAN_MODEL_MISMATCH
        prompt: Nearly all ZPR1 biology comes from spinal muscular atrophy research - SMN binding, Cajal
          body localisation, ZPR1 as an SMA modifier, neurodegeneration in ZPR1-deficient mice. None of
          the reported children with the human ZPR1 syndrome has a motor neuron disease. How much of that
          literature applies?
        attaches_to:
        - animal_models#Zpr1 heterozygous null mouse
        - pathophysiology#Disrupted Subnuclear Localization of SMN and NPAT
        - genetic#ZPR1
        rationale: 'This is the interpretive problem the entry is built around. The mechanistic nodes
          between "no ZPR1 protein" and "cells stop cycling" are all imported from work whose purpose
          was to explain spinal muscular atrophy, and the phenotype they were developed to explain is
          not the phenotype these children have.

          What transfers cleanly is the cell-autonomous part. ZPR1 deficiency arrests the cell cycle in
          cultured cells, and patient fibroblasts show the same G1 arrest - that is the one place where
          the experimental literature and a human measurement agree, and it is why the proliferation chain
          is curated as the mechanism.

          What does not transfer is the neurological reading. The viable ZPR1-deficient mouse develops
          axonal pathology and neurodegeneration; the children have global developmental delay and hydrocephalus,
          with no reported motor neuron involvement. Three possibilities are open and nothing published
          distinguishes them. The mouse is heterozygous and the children have no detectable protein, so
          the lesions differ in dose and possibly in kind. Or the children died too early - three before
          age three, of renal failure - for a degenerative phenotype to declare itself. Or nobody has
          looked: no neuropathology, nerve conduction study or electromyogram is reported for any affected
          child.

          The consequence for this entry is deliberate. The SMN and Cajal body node is kept, because it
          is the best-supported account of how ZPR1 loss reaches the cell cycle, but it carries only model
          and cell-line evidence and its outgoing edge is INDIRECT_KNOWN_INTERMEDIATES. No neurodegeneration
          phenotype is curated, and the mouse link to developmental delay is recorded as FAILS_TO_RECAPITULATE
          rather than quietly omitted.'
      selected_evidence:
        snippet: These effects of Zpr1 gene disruption were confirmed and extended in studies of cultured
          motor neuron-like cells using small interfering RNA-mediated Zpr1 gene suppression; ZPR1 deficiency
          caused growth cone retraction, axonal defects, and apoptosis.
        supports: SUPPORT
