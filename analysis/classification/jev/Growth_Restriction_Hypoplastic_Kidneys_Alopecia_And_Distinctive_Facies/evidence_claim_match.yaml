        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Cell Proliferation in Developing Tissues
        description: 'The tissue-level step, occurring in parallel across many organs: a ubiquitously
          expressed protein required for cell cycle progression is absent, so tissues that must proliferate
          in order to form do not reach their normal size or number. This is the node that accounts for
          the breadth of the syndrome - growth, head circumference, kidney, hair, ear and genital development
          are affected together because the constraint is on proliferation itself rather than on any organ''s
          own programme.

          Direct evidence in humans is limited to the fibroblast arrest above; the proliferation deficit
          itself is demonstrated in the Zpr1-null mouse embryo, which shows reduced proliferation with
          increased apoptosis and dies early in development. No affected human tissue has been examined
          histologically.'
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: DECREASED
      selected_evidence:
        snippet: We found that Zpr1-/- mice die during early embryonic development, with reduced proliferation
          and increased apoptosis.
        supports: SUPPORT
