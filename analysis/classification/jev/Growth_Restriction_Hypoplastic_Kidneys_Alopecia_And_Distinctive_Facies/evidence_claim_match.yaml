  a133d71e489976522e56872a19a1f8fb249d8463e748fec7398985598719ac78:
    claim:
      about:
        disease:
          name: Growth Restriction Hypoplastic Kidneys Alopecia And Distinctive Facies
          disease_term:
            preferred_term: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
            term:
              id: MONDO:0859146
              label: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
        context: []
      assertion_type: Genetic
      assertion:
        name: ZPR1
        notes: 'ZPR1 encodes a ubiquitously expressed, highly conserved zinc finger protein that shuttles
          between cytoplasm and nucleus with the cell cycle, entering the nucleus in S phase and concentrating
          with the survival motor neurons protein and NPAT in Cajal bodies. It sits in the cytoplasm of
          quiescent cells and moves to the nucleus on mitogen stimulation, and its interaction with translation
          elongation factor 1-alpha was shown - in yeast genetics and in mammalian cells - to contribute
          to normal proliferation. That is the basis for the long-standing description of ZPR1 as transmitting
          proliferative signals from the cell membrane to the nucleus.

          One human disease allele is established: c.587T>C (p.Ile196Thr), homozygous in all six patients
          with a confirmed genotype and a founder variant of the Middle Rio Grande Valley. It is a missense
          change that behaves as a null in patient fibroblasts, where no ZPR1 protein is detectable.

          A second genotype has been reported once, and it is why the single-allele statement throughout
          this entry is a qualified one rather than an absolute. A 2026 case report describes a thirteen-month-old
          with microcephaly, generalized hypotonia, sensorineural hearing loss, visual impairment, alopecia,
          hypoplastic kidneys with chronic kidney disease and dysmorphic craniofacial features - a picture
          its authors read as resembling this syndrome - carrying two compound heterozygous ZPR1 variants
          of uncertain significance: a maternally inherited frameshift, c.84del, which those authors predict
          produces a null protein, and a missense change, p.(Leu149Ser), which they place in the eEF1-alpha
          binding domain and compare with p.Ile196Thr. Two things stop it counting as a second disease
          allele. Phasing was never established, because parental DNA was incomplete, so the two changes
          are inferred rather than shown to be in trans; and both remain of uncertain significance. For
          the same reasons no phenotype from that child is curated in this entry, and the case counts
          are stated as counts of confirmed genotypes.

          It does bear on the hypomorph question raised in the knowledge gap below. That report''s authors
          state that ZPR1 is intolerant to complete loss of function, and the truncating allele they describe
          is in a liveborn child - which fits their own statement only if the other allele retains some
          function.

          Nearly all published ZPR1 biology comes from spinal muscular atrophy research rather than from
          this syndrome: ZPR1 interacts with SMN complexes, is downregulated in SMA patients, and has
          been proposed as an SMA modifier. Whether any of that mechanism is what makes these children
          ill is unresolved, and is curated as a knowledge gap rather than assumed.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: ZPR1
          term:
            id: hgnc:13051
            label: ZPR1
        variants:
        - name: ZPR1 c.587T>C (p.Ile196Thr)
          description: The founder allele of the Middle Rio Grande Valley, homozygous in all six patients
            with a confirmed genotype. Structural modelling places the substituted isoleucine in the hydrophobic
            core of the protein, and patient fibroblasts contain no detectable ZPR1, so it behaves as
            a null in the one human tissue anybody has assayed.
          type: missense variant
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: ZPR1
            term:
              id: hgnc:13051
              label: ZPR1
        - name: ZPR1 c.84del
          description: A maternally inherited frameshift, reported once, in a thirteen-month-old with
            a phenotype overlapping this syndrome and presumed - not shown - to be in trans with p.(Leu149Ser).
            The reporting authors predict it produces a null protein lacking all characterised functional
            domains. It is the only truncating ZPR1 allele reported in a patient, and it is classified
            as of uncertain significance in that report.
          type: frameshift variant
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          gene:
            preferred_term: ZPR1
            term:
              id: hgnc:13051
              label: ZPR1
        - name: ZPR1 p.(Leu149Ser)
          description: A missense change of unknown parental origin reported in the same child, placed
            by the reporting authors in the eEF1-alpha binding domain and compared by them with p.Ile196Thr
            as a hydrophobic-to-polar substitution in the same pocket. Classified as of uncertain significance
            in that report.
          type: missense variant
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          gene:
            preferred_term: ZPR1
            term:
              id: hgnc:13051
              label: ZPR1
      selected_evidence:
        snippet: ZPR1 is a ubiquitously expressed, highly conserved protein postulated to transmit proliferative
          signals from the cell membrane to the nucleus.
        supports: SUPPORT
