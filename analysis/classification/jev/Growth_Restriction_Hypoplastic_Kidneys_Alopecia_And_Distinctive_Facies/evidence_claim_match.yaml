  2607c525a6b48e39707ca77c5277620daaefe94d8273f0c4ad210b6098cd863f:
    claim:
      about:
        disease:
          name: Growth Restriction Hypoplastic Kidneys Alopecia And Distinctive Facies
          disease_term:
            preferred_term: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
            term:
              id: MONDO:0859146
              label: growth restriction, hypoplastic kidneys, alopecia, and distinctive facies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absence of ZPR1 Protein
        description: 'Patient fibroblasts contain no detectable ZPR1. That is a stronger result than the
          missense genotype would suggest and it is the single most important fact about this disease''s
          mechanism: a core-destabilising substitution that leaves no protein behind makes the allele
          functionally null, at least in fibroblasts, and licenses reading the ZPR1-deficiency literature
          as relevant.

          The caveat is that fibroblasts are the only human tissue examined. Whether kidney, hair follicle,
          cochlea or brain also lack the protein entirely, or retain some, has not been tested, and a
          residual amount somewhere would matter - complete ZPR1 loss is embryonic lethal in mouse, and
          these children were liveborn.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Patient fibroblast cells showed no detectable levels of ZPR1 and the cells showed a defect
          in cell cycle progression where a significant number of cells remained arrested in the G1 phase.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29851065
      reference_title: A ZPR1 mutation is associated with a novel syndrome of growth restriction, distinct
        craniofacial features, alopecia, and hypoplastic kidneys.
      evidence_source: IN_VITRO
      explanation: Both the absence of protein and the cellular consequence, measured in cells from an
