        phase: Treated outcome, determined by age at initiation
        notes: 'Outcome tracks age at treatment initiation more than any other variable. In a 48-patient
          cohort, median age at treatment initiation was 25.5 months in those ending with mild developmental
          delay/intellectual disability, 39 months in those with moderate, and 11 years in those with
          severe - a monotonic relationship. The four patients treated younger than nine months had normal
          or almost normal developmental outcomes, and the one exception among them had inconsistent compliance.
          Therapy improved or stabilised symptoms in all symptomatic cases, but did not reverse established
          impairment.

          '
