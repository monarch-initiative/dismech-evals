      assertion_type: Genetic
      assertion:
        name: GAMT pathogenic variants
        gene_term:
          preferred_term: GAMT
          term:
            id: hgnc:4136
            label: GAMT
        inheritance:
        - name: Autosomal recessive
        features: 'GAMT deficiency is caused by biallelic pathogenic variants in GAMT (chromosome 19p13.3),
          encoding guanidinoacetate N-methyltransferase. The enzyme catalyzes methylation of guanidinoacetate
          to creatine using S-adenosylmethionine as the methyl donor. Loss-of-function variants result
          in deficient enzymatic activity, leading to creatine depletion and GAA accumulation. Consanguinity
          is a risk factor; 23% of affected cases in one scoping review were from consanguineous marriages.
          Countries with high consanguinity rates such as Saudi Arabia may have higher prevalence.

          '
      selected_evidence:
        snippet: Guanidinoacetate methyltransferase (GAMT) deficiency is an autosomal recessive disorder
          of creatine biosynthesis due to pathogenic variants in the GAMT gene that lead to cerebral creatine
          deficiency and neurotoxic levels of guanidinoacetate.
        supports: SUPPORT
