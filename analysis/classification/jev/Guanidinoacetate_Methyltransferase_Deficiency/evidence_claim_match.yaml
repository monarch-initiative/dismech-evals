              label: guanidinoacetate methyltransferase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GAMT molecular function deficiency
        biological_scale: MOLECULAR
        notes: 'No module conformance is asserted anywhere in this entry, deliberately. Two modules look
          superficially applicable and neither fits. metabolic_intoxication_decompensation models intoxication-type
          inborn errors in which catabolic stress precipitates acute decompensation with acidosis, hyperammonemia
          or hypoglycemia; GAMT deficiency has none of those and no crisis phenotype - it is a chronic
          cerebral energy-deficiency disorder. epilepsy_excitation_inhibition_imbalance is a closer call,
          since seizures affect most patients and guanidinoacetate is thought to act on inhibitory neurotransmission,
          but this entry''s own sources hedge that mechanism ("may alter inhibitory neurotransmission")
          and epilepsy here is one manifestation of cerebral creatine deficiency rather than the disease''s
          defining axis. Asserting either would import a mechanism the evidence does not support.

          '
        description: 'Biallelic pathogenic variants in GAMT reduce guanidinoacetate methyltransferase
          catalytic activity.

          '
        genes:
        - preferred_term: GAMT
          term:
            id: hgnc:4136
            label: GAMT
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
        molecular_functions:
        - preferred_term: guanidinoacetate N-methyltransferase activity
          term:
            id: GO:0030731
            label: guanidinoacetate N-methyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: creatine biosynthetic process
          term:
            id: GO:0006601
            label: creatine biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: Guanidinoacetate methyltransferase (GAMT) deficiency is an autosomal recessive disorder
          of creatine biosynthesis due to pathogenic variants in the GAMT gene that lead to cerebral creatine
          deficiency and neurotoxic levels of guanidinoacetate.
        supports: SUPPORT
