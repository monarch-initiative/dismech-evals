      assertion:
        name: Complement-Mediated Nerve Damage
        description: Antibody binding activates complement cascade, leading to membrane attack complex
          deposition on Schwann cells and nodes of Ranvier. This causes demyelination in AIDP or axonal
          damage in AMAN/AMSAN variants.
        cell_types:
        - preferred_term: Schwann Cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: Complement Activation
          term:
            id: GO:0006956
            label: complement activation
      selected_evidence:
        snippet: These data indicate that anti-ganglioside antibodies can diffuse into a desheathed nerve,
          bind to nodes of Ranvier and fix complement in vitro without resulting in any overt physiological
          deterioration of the nerve over 4-6 h.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10355667
      reference_title: Anti-ganglioside antibodies can bind peripheral nerve nodes of Ranvier and activate
        the complement cascade without inducing acute conduction block in vitro.
      evidence_source: MODEL_ORGANISM
      explanation: 'Ex vivo mouse sciatic nerve. Establishes the first two steps of this node only --
        anti-ganglioside antibody binding at nodes of Ranvier and complement fixation there. It does NOT
        demonstrate resulting nerve injury: the study found no electrophysiological deterioration over
        4-6 h and concluded the node of Ranvier is relatively resistant to acute antibody-mediated injury
        on that timescale, attributing the negative result to the short-term isolated preparation and
        recommending in vivo models. Cited as partial support for complement fixation, not for the damage
        step.'
