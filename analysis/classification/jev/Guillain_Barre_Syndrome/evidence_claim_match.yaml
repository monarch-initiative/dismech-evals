            term:
              id: MONDO:0016218
              label: Guillain-Barre syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: seronegative_bbe_mechanisms
        prompt: Bickerstaff Brainstem Encephalitis (BBE) is a central nervous system variant of the anti-GQ1b
          antibody syndrome spectrum, presenting with ophthalmoplegia, ataxia, and altered consciousness.
          However, approximately one-third of clinically defined BBE cases are seronegative for anti-GQ1b
          antibodies, suggesting alternative immune mechanisms beyond anti-GQ1b pathogenic cascades. What
          mechanisms drive seronegative BBE? How do alternative immune pathways (beyond anti-GQ1b) drive
          complement-mediated neural damage in the brainstem?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Molecular Mimicry and Antiganglioside Antibodies
        - pathophysiology#Complement-Mediated Nerve Damage
        rationale: BBE sits within the anti-GQ1b antibody syndrome spectrum but shows significant clinical
          and serological overlap with Miller Fisher syndrome and GBS. The discovery of seronegative BBE
          cases indicates that the canonical anti-GQ1b IgG mechanism does not explain all pathophysiology
          in this disease variant. Understanding alternative immune mechanisms in seronegative cases is
          critical for diagnosis and therapeutic targeting.
      selected_evidence:
        snippet: Bickerstaff Brainstem Encephalitis (BBE) is a rare, post-infectious autoimmune disorder
          characterized by ophthalmoplegia, ataxia, and altered consciousness. Its significant clinical
          and serological overlap with Miller Fisher syndrome (MFS) and Guillain-Barré syndrome (GBS)
          creates diagnostic challenges, particularly in atypical or seronegative presentations.
        supports: SUPPORT
