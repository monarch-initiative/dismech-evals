              id: MONDO:0979227
              label: Guillouet-Gordon syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MED16 Mediator mislocalization
        description: 'MED16 is a subunit of the tail module of the Mediator complex. Most disease-causing
          variants cause mislocalization of MED16 from the nucleus to the cytoplasm, and 3D modeling indicates
          a destabilizing effect on protein structural elements, disrupting Mediator-dependent transcription
          of developmental gene-expression programs. Homozygous med16 zebrafish and Med16 knockout mice
          confirm a conserved developmental requirement. MED16 belongs to the group of Mediator complex-associated
          disease genes.

          '
        genes:
        - preferred_term: MED16
          term:
            id: hgnc:17556
            label: MED16
        biological_processes:
        - preferred_term: transcription by RNA polymerase II
          term:
            id: GO:0006366
            label: transcription by RNA polymerase II
        - preferred_term: regulation of gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Immunofluorescence assays demonstrated protein mislocalization from the nucleus to the
          cytoplasm for 16 of the 17 variants studied.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40081376
      reference_title: Bi-allelic MED16 variants cause a MEDopathy with intellectual disability, motor
        delay, and craniofacial, cardiac, and limb malformations.
      evidence_source: IN_VITRO
      explanation: Establishes nuclear-to-cytoplasmic mislocalization as the disease mechanism for most
        MED16 variants.
