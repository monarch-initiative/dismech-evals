      assertion_type: Pathophysiology
      assertion:
        name: HOXA13 Homeodomain Missense Variant
        biological_scale: MOLECULAR
        description: 'A heterozygous missense variant in the HOXA13 homeobox (c.1112A>T, Q50L) alters
          a key residue in the recognition helix of the homeodomain and is predicted to perturb the DNA-binding
          transcription-factor activity of HOXA13, with both a loss and a specific gain of function. The
          variant arose on an allele also carrying a 2-bp deletion in the gene''s conserved promoter;
          that deletion produces no abnormality on its own but may contribute to the phenotype.

          '
        genes:
        - preferred_term: HOXA13
          term:
            id: hgnc:5102
