        context:
        - path: /pathophysiology/2
          value:
            name: Epigenetic Derepression and Aberrant Gene Activation
            description: Global loss of H3K27me3 causes derepression of genes normally silenced during
              development, including proliferative and stemness genes. Paradoxically, some loci show retained
              or increased H3K27me3, suggesting complex redistribution rather than simple loss.
            biological_processes:
            - preferred_term: gene expression
              modifier: INCREASED
              term:
                id: GO:0010467
                label: gene expression
            - preferred_term: cell population proliferation
              modifier: INCREASED
              term:
                id: GO:0008283
                label: cell population proliferation
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: GD2 Surface Antigen Expression
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - Upregulation of ganglioside synthesis pathway component genes, including B4GALNT1 (GD2 synthase)
        description: H3 K27M-mutant paediatric high-grade gliomas show upregulation of ganglioside-synthesis
          pathway component genes relative to H3 wild-type paediatric high-grade gliomas, which the authors
          read as the oncohistone driving GD2 overexpression. GD2 is therefore a downstream product of
          the epigenetic derepression programme rather than of the differentiation block.
      selected_evidence:
        snippet: Upregulation of ganglioside synthesis pathway component genes in H3K27M mutant pediatric
          high-grade gliomas relative to H3 WT pediatric high-grade gliomas suggests this mutation drives
          GD2 overexpression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2/downstream/1
      evidence_path: /pathophysiology/2/downstream/1/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /pathophysiology/2
    evidence_metadata:
