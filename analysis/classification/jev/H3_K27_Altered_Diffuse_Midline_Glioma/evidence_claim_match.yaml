  badca33e173712b8622afaf586b050ad09e8e0c6eaf63d61f94b1adf9f9dd1c8:
    claim:
      about:
        disease:
          name: Diffuse Midline Glioma, H3 K27-Altered
          disease_term:
            preferred_term: diffuse midline glioma, H3 K27-altered
            term:
              id: MONDO:1060171
              label: diffuse midline glioma, H3 K27-altered
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Anti-CAR Adaptive Immune Response
        description: Recipients mount a host adaptive immune response directed at the CAR construct rather
          than at the tumour. Peripheral CD4+ and CD8+ T cells react against epitopes concentrated in
          the murine-derived and engineered junctional regions of the receptor, and cerebrospinal-fluid
          B cells clonally expand and secrete human anti-CAR antibodies (HACAs) that bind GD2-CAR-expressing
          cells and impede their cytotoxic activity. This is an immunogenicity mechanism against the therapeutic
          product, distinct from tumour-intrinsic antigen loss.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cerebrospinal fluid B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: anti-CAR-reactive T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: adaptive immune response
          modifier: INCREASED
          term:
            id: GO:0002250
            label: adaptive immune response
        - preferred_term: immunoglobulin production
          modifier: INCREASED
          term:
            id: GO:0002377
            label: immunoglobulin production
        notes: The anti-CAR immunity evidence is currently a non-peer-reviewed preprint (PPR:PPR1276296)
          reporting correlative single-cell RNA/TCR sequencing from NCT04196413. Host anti-CAR immune
          rejection was already suspected during the same trial - the first-in-human report describes
          increased lymphodepletion before a re-infusion "given the concern for immune rejection of the
          CAR T cells" (PMID:35130560) - but the HACA mechanism itself awaits peer review and should not
          be treated as settled.
      selected_evidence:
        snippet: This was associated with appearance of circulating Human Anti-CAR Antibodies (HACAs)
          that bound cells expressing the GD2-CAR, as well as clonal expansion of CSF B cells which produced
          HACA which impeded the cytotoxic activity of GD2-CAR T cells.
        supports: SUPPORT
