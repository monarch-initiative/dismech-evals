      assertion_type: Subtype
      assertion:
        name: Diffuse Intrinsic Pontine Glioma (DIPG)
        subtype_term:
          preferred_term: H3 K27-altered diffuse intrinsic pontine glioma
          description: The bound MONDO class is broader than this row. MONDO:0006033 covers all diffuse
            intrinsic pontine glioma, including H3-wildtype tumors, and MONDO places this entry's own
            class, diffuse midline glioma, H3 K27-altered (MONDO:1060171), beneath it. No MONDO class
            is limited to the H3 K27-altered pontine tumors this row describes, so the binding is to the
            nearest broader term.
          term:
            id: MONDO:0006033
            label: diffuse intrinsic pontine glioma
        description: The most common form, arising in the pons with characteristic diffuse infiltration
          of pontine structures. Presents with classic triad of cranial nerve deficits, ataxia, and long
          tract signs. Diagnosis often made on imaging without biopsy. Median survival is less than 12
          months.
      selected_evidence:
        snippet: Diffuse intrinsic pontine gliomas constitute ~ 60-75% of tumors found within the pediatric
          brainstem. These malignant lesions present with rapidly progressive symptoms such as cranial
          nerve, long tract, or cerebellar dysfunctions.
        supports: SUPPORT
