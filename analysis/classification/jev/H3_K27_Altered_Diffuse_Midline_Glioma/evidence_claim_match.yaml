        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GD2 Surface Antigen Expression
        description: Patient-derived H3 K27M-mutant glioma cells express the disialoganglioside GD2 uniformly
          and at high levels, at all three midline sites (pons, thalamus and spinal cord). The reported
          specificity contrast is against H3 wild-type, GD2-negative paediatric glioma cultures, which
          GD2-CAR T cells do not kill; GD2 expression in normal brain has been reported separately, and
          the argument for a therapeutic window rests instead on the absence of significant neurotoxicity
          in human trials using the same 14g2a-derived binding domain. GD2 is synthesised by GD2 synthase
          (B4GALNT1); CRISPR deletion of B4GALNT1 abolishes GD2-CAR T cell recognition, establishing the
          ganglioside as the operative surface target rather than a bystander marker. This node is the
          therapeutic vulnerability that GD2-directed CAR T cell therapy addresses; it is not by itself
          a driver of tumour growth.
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: H3 K27M-mutant glioma cell
          term:
            id: CL:0001064
            label: malignant cell
        biological_processes:
        - preferred_term: ganglioside biosynthetic process
          modifier: INCREASED
          term:
            id: GO:0001574
            label: ganglioside biosynthetic process
        locations:
        - preferred_term: pons
          term:
            id: UBERON:0000988
            label: pons
        - preferred_term: dorsal plus ventral thalamus
          term:
            id: UBERON:0001897
            label: dorsal plus ventral thalamus
        - preferred_term: spinal cord
          term:
            id: UBERON:0002240
            label: spinal cord
      selected_evidence:
        snippet: Here, we report that patient-derived H3-K27M-mutant glioma cell cultures exhibit uniform,
          high expression of the disialoganglioside GD2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29662203
      reference_title: Potent antitumor efficacy of anti-GD2 CAR T cells in H3-K27M(+) diffuse midline
        gliomas.
      evidence_source: IN_VITRO
      explanation: Establishes uniform high GD2 surface expression on patient-derived H3 K27M-mutant glioma
