            term:
              id: MONDO:1060171
              label: diffuse midline glioma, H3 K27-altered
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GD2-CAR T Cell-Mediated Tumour Cytotoxicity
        description: Autologous T cells engineered with a GD2-directed chimeric antigen receptor (GD2
          binding domain, 4-1BB co-stimulatory domain, CD3-zeta signalling domain) recognise GD2 on midline
          glioma cells and mediate antigen-dependent cytotoxicity. In orthotopic xenografts this clears
          engrafted tumour except for residual GD2-low cells; in the phase I trial it produced volumetric
          tumour reduction and neurological improvement in a subset of patients. Because the tumour sits
          in the brainstem or cord, the same inflammatory response produces tumour inflammation-associated
          neurotoxicity.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: GD2-CAR-engineered cytotoxic T cell
          term:
            id: CL:0000910
            label: cytotoxic T cell
        biological_processes:
        - preferred_term: T cell mediated cytotoxicity
          modifier: INCREASED
          term:
            id: GO:0001913
            label: T cell mediated cytotoxicity
      selected_evidence:
        snippet: Four patients demonstrated major volumetric tumour reductions (52, 54, 91 and 100%),
          with a further three patients exhibiting smaller reductions.
        supports: SUPPORT
