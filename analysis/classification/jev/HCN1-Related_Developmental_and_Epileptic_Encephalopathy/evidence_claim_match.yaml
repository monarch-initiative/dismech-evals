        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hcn1_ih_variant_effect_to_phenotype
        prompt: How does the biophysical effect of an HCN1 variant on the Ih current (gain-of-function/cation-leak,
          loss-of-function, or shifted voltage dependence) map to clinical severity across the spectrum
          (severe developmental and epileptic encephalopathy versus milder GEFS+/generalized epilepsy),
          and would Ih-blocking or Ih-enhancing therapy be rational for a given functional class?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Aberrant Hyperpolarization-Activated Current
        - pathophysiology#Cortical Network Hyperexcitability
        rationale: Disease HCN1 variants have strikingly divergent effects on the Ih current, and the
          disorder spans a wide phenotypic range, so the variant's functional class is a plausible determinant
          of both severity and rational treatment. However, functional characterization is not available
          for most variants, some variants have mixed effects, and it is unclear whether reducing or enhancing
          Ih would help a given patient - so treatment remains empirical. Resolving the functional-class-to-phenotype-to-therapy
          mapping is central to precision care.
        proposed_experiments:
        - experiment_id: exp_hcn1_functional_class_phenotype_map
          name: HCN1 variant functional-class to phenotype and therapy mapping
          description: Characterize a large panel of patient HCN1 variants with standardized electrophysiology
            (voltage dependence, kinetics, cation-leak) to assign functional class, correlate class with
            deep clinical phenotyping, and test in neuronal models whether Ih blockers or enhancers normalize
            excitability for each class.
      selected_evidence:
        snippet: the mutations had striking but divergent effects  on homomeric channels.
        supports: SUPPORT
