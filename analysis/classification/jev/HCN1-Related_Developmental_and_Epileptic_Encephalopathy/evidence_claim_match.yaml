      assertion_type: Treatment
      assertion:
        name: Antiseizure Medication
        description: 'Seizures are managed with antiseizure medications; response is variable and the
          epilepsy is often drug-resistant at the severe end of the spectrum. Importantly, drug selection
          is genotype-mechanism-sensitive: because the severe form is a gain-of-function cation leak,
          sodium-channel-blocking antiseizure medications (phenytoin, lamotrigine, oxcarbazepine, lacosamide)
          can paradoxically worsen seizures and should be used with caution, whereas sodium valproate
          has been reported to help - the same "avoid sodium-channel blockers" trap seen in SCN1A Dravet
          syndrome.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: valproic acid
            term:
              id: CHEBI:39867
              label: valproic acid
      selected_evidence:
        snippet: treatment with sodium-channel-blocking ASMs including phenytoin, lamotrigine, oxcarbazepine,
          and lacosamide was associated with seizure worsening, with clinical improvement after drug discontinuation.
        supports: SUPPORT
