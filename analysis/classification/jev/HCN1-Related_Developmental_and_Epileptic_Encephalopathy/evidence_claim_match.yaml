        prompt: HCN1 DEE mouse models exhibit retinal dysfunction (reduced light sensitivity and impaired
          temporal processing), consistent with HCN1's known role in rod photoreceptor Ih. Is clinically
          significant retinal/visual dysfunction an under-recognized comorbidity in human HCN1-DEE patients,
          or is it a model-specific finding that does not translate to human disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#HCN1 Variant Altering the Ih Channel
        rationale: HCN1 is expressed in rod photoreceptors, where it shapes the light response, so retinal
          involvement is mechanistically plausible and has been demonstrated in mouse models. However,
          retinal/visual dysfunction is not a routinely reported feature of human HCN1-DEE, and it is
          unclear whether it is genuinely absent, subclinical, or simply not systematically assessed -
          a translational validity gap between the mouse comorbidity and the human phenotype.
        proposed_experiments:
        - experiment_id: exp_hcn1_human_retinal_phenotyping
          name: Systematic retinal phenotyping of human HCN1-DEE patients
          description: Perform electroretinography and visual-function testing in a cohort of genetically
            confirmed human HCN1-DEE patients to determine whether the retinal dysfunction seen in mouse
            models is present, subclinical, or absent in humans.
      selected_evidence:
        snippet: retinal dysfunction have also  been modelled in HCN1 DEE mice, suggesting HCN1 variants
          can cause a  dramatically reduced sensitivity to light
        supports: SUPPORT
