      assertion:
        name: Disrupted CoREST and NCoR Corepressor Complex Integrity
        biological_scale: MOLECULAR
        description: Variants reduce HDAC3 interaction with the CoREST and NCoR corepressor complexes
          - universally with KDM1A (CoREST) and, for most variants, with NCoR1/2 - compromising the corepressor
          machinery independently of catalytic activity. HDAC3 acts through the NCoR/SMRT corepressors
          that drive transcriptional repression during brain development.
      selected_evidence:
        snippet: our experiments demonstrate that HDAC3 variants perturb interactions with the CoREST
          and NCoR complexes, particularly involving KDM1A and NCoR1/2, which we posit as a central pathogenic
          mechanism underlying the clinical findings observed in the affected individuals
        supports: SUPPORT
