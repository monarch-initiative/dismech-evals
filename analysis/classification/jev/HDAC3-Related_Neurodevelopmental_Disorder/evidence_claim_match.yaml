  124b01a05bf3512a25bcac6da4540adaf9f6c86d0c9676afa309038ff3c54b39:
    claim:
      about:
        disease:
          name: HDAC3-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: HDAC3-related neurodevelopmental disorder
            term:
              id: MONDO:0700370
              label: HDAC3-related neurodevelopmental disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: HDAC3
        gene_term:
          preferred_term: HDAC3
          term:
            id: hgnc:4854
            label: HDAC3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'HDAC3 encodes the class I histone deacetylase that is the catalytic subunit of the NCoR1/SMRT
          (and CoREST) transcriptional corepressor complexes. Reported disease variants are heterozygous
          de novo missense changes. The mechanism is argued to be multifaceted: gnomAD constraint favours
          haploinsufficiency, but the exclusively missense spectrum and clustering at protein interfaces
          also implicate a dominant-negative contribution, so functional_impact is left uncategorised
          rather than forced to a single value. Two additional likely-pathogenic missense variants (p.Tyr298Cys,
          p.Arg301Gln) are recorded in ClinVar with intellectual disability and epilepsy.'
        variants:
        - name: p.Asp93Asn
          description: c.277G>A (NM_003883.4); near the catalytic pocket; defective HDAC activity.
          clinical_significance: LIKELY_PATHOGENIC
        - name: p.Ala110Thr
          description: c.328G>A; away from the catalytic pocket, retains HDAC activity but markedly disrupts
            NCoR-complex interaction and nuclear localisation.
          clinical_significance: LIKELY_PATHOGENIC
        - name: p.Pro201Ser
          description: c.601C>T; near the catalytic pocket; defective HDAC activity; mildest clinical
            presentation in the cohort.
          clinical_significance: LIKELY_PATHOGENIC
        - name: p.Leu266Ser
          description: c.797T>C; near the catalytic pocket; defective HDAC activity and impaired complex
            interaction and nuclear localisation.
          clinical_significance: LIKELY_PATHOGENIC
        - name: p.Gly267Ser
          description: c.799G>A; near the catalytic pocket; defective HDAC activity.
          clinical_significance: LIKELY_PATHOGENIC
        - name: p.Arg359Cys
          description: c.1075C>T; lies within the nuclear localisation signal; retains HDAC activity but
            impairs nuclear localisation.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: we correlated heterozygous de novo variants in HDAC3 with a neurodevelopmental disorder
          having variable clinical presentations, frequently associated with intellectual disability,
          developmental delay, epilepsy, and musculoskeletal abnormalities
        supports: SUPPORT
