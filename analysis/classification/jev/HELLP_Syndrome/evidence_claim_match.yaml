      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: fetal_fao_defect_maternal_liver
        hypothesis_label: Fetal Fatty-Acid-Oxidation-Defect Model (subset of cases)
        status: ALTERNATIVE
        description: 'In a distinct subset of pregnancies, maternal HELLP or acute fatty liver of pregnancy
          occurs in a heterozygous carrier mother gestating a fetus with a long-chain 3-hydroxyacyl-CoA
          dehydrogenase (LCHAD) or mitochondrial trifunctional protein deficiency. The proposed mechanism
          is that 3-hydroxy long-chain acyl intermediates accumulating in the deficient fetoplacental
          unit are exported into the maternal circulation and are hepatotoxic to a mother whose own beta-oxidation
          capacity is reduced by heterozygosity and by the metabolic demands of late pregnancy.

          '
        notes: 'Applies only to a small subset and is genotype-dependent - the association tracked the
          common HADHA Glu474Gln (E474Q) allele and was absent in children with complete trifunctional
          protein deficiency. The metabolite-export mechanism itself is inferred, not directly demonstrated
          in the cited study, which establishes the genetic association. The corresponding fatty-acid-oxidation
          disorder entries (Long-Chain_3-Hydroxyacyl-CoA_Dehydrogenase_Deficiency, Mitochondrial_Trifunctional_Protein_Deficiency,
          Carnitine_Palmitoyltransferase_1A_Deficiency) already record this relationship from the fetal
          side and were deliberately not modified by this entry.

          '
      selected_evidence:
        snippet: While carrying fetuses with the Glu474Gln mutation, 79 percent of the heterozygous mothers
          had fatty liver of pregnancy or the HELLP syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
