      assertion:
        name: HADHA (fetal genotype)
        gene_term:
          preferred_term: HADHA
          term:
            id: hgnc:4801
            label: HADHA
        relationship_type: MODIFIER
        variant_origin: GERMLINE
        notes: 'A distinctive genetic association in which the relevant genotype is the FETUS''s, not
          the mother''s: maternal HELLP or acute fatty liver of pregnancy is strongly associated with
          gestating a fetus homozygous or compound heterozygous for the HADHA Glu474Gln LCHAD-deficiency
          allele, the mother being an obligate heterozygote. Recorded here as a modifier of maternal risk
          rather than as a cause of HELLP in general.

          Curated only as a cross-reference from the maternal side. The corresponding fetal disorders
          are curated separately in Long-Chain_3-Hydroxyacyl-CoA_Dehydrogenase_Deficiency, Mitochondrial_Trifunctional_Protein_Deficiency,
          and Carnitine_Palmitoyltransferase_1A_Deficiency, none of which were modified by this entry.

          '
      selected_evidence:
        snippet: While carrying fetuses with the Glu474Gln mutation, 79 percent of the heterozygous mothers
          had fatty liver of pregnancy or the HELLP syndrome.
        supports: SUPPORT
