        snippet: Acute fatty liver of pregnancy and the HELLP syndrome (hemolysis, elevated liver-enzyme
          levels, and a low platelet count) are serious hepatic disorders that may occur during pregnancy
          in women whose fetuses are later found to have a deficiency of long-chain 3-hydroxyacyl-coenzyme
          A (CoA) dehydrogenase.
        supports: SUPPORT
