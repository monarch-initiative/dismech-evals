        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hellp_fao_metabolite_transfer
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Are 3-hydroxy long-chain acyl metabolites actually transferred from an LCHAD-deficient
          fetoplacental unit into the maternal circulation at hepatotoxic concentrations, or is the maternal
          liver injury explained by some other consequence of the fetal genotype?

          '
        attaches_to:
        - pathophysiology#Fetal Long-Chain Fatty-Acid Oxidation Defect
        rationale: 'The genetic association is strong and allele-specific, but the mechanistic step routinely
          quoted for it - placental export of toxic 3-hydroxy intermediates into a heterozygous mother
          with reduced beta-oxidation reserve - is an inference. The cited study establishes genotype-phenotype
          correlation, not metabolite transfer. The causal edge from this node is therefore typed INDIRECT_UNKNOWN_INTERMEDIATES.

          '
        proposed_experiments:
        - experiment_id: hellp_maternal_acylcarnitine_profiling
          name: Maternal acylcarnitine profiling stratified by fetal genotype
          description: 'Serial maternal plasma long-chain 3-hydroxyacylcarnitine measurement across the
            third trimester in pregnancies stratified by fetal HADHA/HADHB genotype, testing whether maternal
            metabolite concentrations rise before and track with maternal hepatic injury.

            '
      selected_evidence:
        snippet: Women with acute liver disease during pregnancy may have a Glu474Gln mutation in long-chain
          hydroxyacyl-CoA dehydrogenase.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
