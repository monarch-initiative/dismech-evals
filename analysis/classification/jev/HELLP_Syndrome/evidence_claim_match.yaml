      assertion_type: Treatment
      assertion:
        name: Terminal complement (C5) blockade with eculizumab
        description: 'INVESTIGATIONAL. A monoclonal antibody against complement C5, used off-label in
          reported cases of severe early preeclampsia/HELLP on the rationale that HELLP is an aHUS-like
