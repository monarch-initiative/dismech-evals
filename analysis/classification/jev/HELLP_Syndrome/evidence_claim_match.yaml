  9d89532209ae7e7630d0f4ae5e116b1845f96adccd9e0d1583076241d943997d:
    claim:
      about:
        disease:
          name: HELLP Syndrome
          disease_term:
            preferred_term: HELLP syndrome
            term:
              id: MONDO:0008585
              label: HELLP syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hellp_distinct_entity_or_pe_variant
        kind: CONTROVERSY
        status: OPEN
        prompt: 'Is HELLP a severe variant within the preeclampsia spectrum, or a distinct disease entity
          that merely co-occurs with preeclampsia?

          '
        attaches_to:
        - pathophysiology#Maternal Endothelial Injury and Systemic Inflammatory Amplification
        rationale: 'This is not a naming argument - it determines whether HELLP-specific mechanism nodes
          are warranted at all. Arguments for a variant: 70-80% of cases coexist with preeclampsia, the
          placental trigger appears shared, and ICD-10 codes HELLP as a subcode of preeclampsia (O14.2),
          which makes "HELLP without PE" unascertainable in administrative data. Arguments for a distinct
          entity: risk-factor profiles diverge (diabetes, chronic hypertension, and obesity track isolated
          preeclampsia while chronic inflammatory disease and lupus track HELLP), outcome dynamics diverge,
          and the liver-dominant thrombotic microangiopathy has no counterpart in uncomplicated preeclampsia.
          This entry takes the operational position of curating HELLP separately while modeling the shared
          upstream in a single compressed node.

          '
      selected_evidence:
        snippet: However, whether it represents a distinct condition or a severe variant within the PE
          spectrum has been debated.
        supports: SUPPORT
