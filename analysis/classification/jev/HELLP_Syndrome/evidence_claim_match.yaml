  d598ae269ceb178cee09cbfebd63e7c868dd3bc65b02b5a9369651ba8afbeaa5:
    claim:
      about:
        disease:
          name: HELLP Syndrome
          disease_term:
            preferred_term: HELLP syndrome
            term:
              id: MONDO:0008585
              label: HELLP syndrome
        context:
        - path: /definitions/1
          value:
            name: Mississippi Triple-Class HELLP System
            definition_type: DIAGNOSTIC_CRITERIA
            derivation_basis: ESTABLISHED_CRITERIA
            description: 'Martin''s severity grading, which stratifies HELLP by the platelet nadir reached
              at any point in the illness rather than by presenting values. Class 1 and 2 additionally
              require LDH > 600 U/L and AST or ALT >= 70 IU/L; class 3 relaxes the transaminase threshold
              to >= 40 IU/L and is regarded as a clinically significant transition phase capable of progressing.
              Unlike the Tennessee system this is a severity axis, not an inclusion test - the two answer
              different questions and should not be conflated.

              '
            scope: 'Severity classification of established HELLP syndrome, used to guide the intensity
              of surveillance and intervention.

              '
            notes: 'Because the two systems use different platelet thresholds and different transaminase
              cut-offs, published HELLP series are not directly comparable unless the classification used
              is stated - a point the source review makes explicitly about the difficulty of comparing
              the literature.

              '
          role: ancestor
      assertion_type: CriteriaSet
      assertion:
        name: Mississippi class 3 (mild / transition phase)
        description: 'Platelet nadir > 100 and <= 150 x 10^9/L, with LDH > 600 U/L and AST >= 40 IU/L.
          Considered a transition stage capable of progression rather than a benign category.

          '
      selected_evidence:
        snippet: class 3 requires only LDH > 600 U/L and AST ≥ 40 U/L in addition to the specific PLT
          count
        supports: SUPPORT
