      assertion_type: Pathophysiology
      assertion:
        name: Microangiopathic Erythrocyte Fragmentation and Destruction
        description: 'Erythrocytes are mechanically fragmented as they are forced across partly occluded
          microvessels, producing schistocytes on the peripheral smear, intravascular hemolysis with raised
          LDH and indirect bilirubin, and consumed haptoglobin. This is the "H" of HELLP and is the extrinsic,
          mechanical arm of the conserved hemolytic-anemia destruction pathway - the erythrocyte itself
          is normal, the insult is the vessel.

          '
        role: central_effector
        biological_scale: CELLULAR
        conforms_to: hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: The diagnosis of HELLP syndrome requires the presence of hemolysis based on examination
          of the peripheral smear, elevated indirect bilirubin levels, or low serum haptoglobin levels
        supports: SUPPORT
