      assertion:
        name: Periportal Hepatocyte Necrosis and Hepatic Injury
        description: 'Hepatocytes die by ischemic (coagulation) necrosis in a characteristically periportal
          distribution, releasing AST and ALT into the maternal circulation - the "EL" of HELLP. Two routes
          converge here: sinusoidal ischemia downstream of microthrombosis, and direct hepatocyte death
          signaling attributed to placental Fas ligand. The resulting confluent necrosis and intrahepatic
          hemorrhage are what underlie hepatic capsular distension, subcapsular hematoma, and, rarely,
          liver rupture.

          '
        role: effector
        biological_scale: TISSUE
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
