        context: []
      assertion_type: Definition
      assertion:
        name: Tennessee Classification System for HELLP syndrome
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'Sibai''s strict laboratory criteria for "true" or "complete" HELLP syndrome. All
          three components must be present; cases meeting only one or two are termed partial or incomplete
          HELLP (and, where hemolysis is absent, ELLP).

          '
        scope: 'Diagnostic case definition for complete HELLP syndrome; the more widely used of the two
          systems for establishing whether a case is HELLP at all.

          '
        criteria_sets:
        - name: Tennessee complete-HELLP criteria
          description: 'All three laboratory criteria required for complete HELLP syndrome.

            '
          inclusion_criteria:
          - preferred_term: Hemolysis
            description: 'Intravascular hemolysis, evidenced by an abnormal peripheral blood smear, raised
              serum bilirubin (>= 20.5 micromol/L or >= 1.2 mg/100 mL), and LDH > 600 U/L.

              '
          - preferred_term: Elevated liver enzymes
            description: AST >= 70 IU/L.
          - preferred_term: Low platelet count
            description: Platelets <= 100 x 10^9/L.
        notes: 'The published Tennessee platelet criterion is written as "< 100" in the review''s prose
          and "<= 100" in its Table 1; the criteria set records the table form. This is a real inconsistency
          in the source, not a transcription error.

          '
      selected_evidence:
        snippet: In the Tennessee Classification System diagnostic criteria for HELLP are haemolysis with
          increased LDH (> 600 U/L), AST (>or= 70 U/L), and platelets < 100 x 10(9)/L.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
