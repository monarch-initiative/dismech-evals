      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: complement_two_hit
        hypothesis_label: Alternative-Complement-Pathway Two-Hit Model
        status: EMERGING
        description: 'On this model HELLP behaves like an aHUS-type complement-mediated thrombotic microangiopathy:
          a germline defect in alternative-pathway complement regulation provides the first hit, and pregnancy
          provides the second, permitting unrestrained terminal complement activation, C5b-9 deposition,
          and endothelial injury. Its strongest support is the enrichment of rare germline alternative-pathway
          variants and positive modified Ham testing in affected women, plus reported clinical response
          to C5 blockade.

          '
        notes: 'Recorded as EMERGING, not CANONICAL. The genetic evidence is a single case-control study
          (n small, 46% vs 8%), the mHam is a functional surrogate rather than a direct measure of in
          vivo complement-mediated injury, and the eculizumab evidence is case reports and small series
          - there is no randomized trial. The complement arm should not be curated as an established causal
          chain, and this is the reason the C5-blockade treatment on this entry is marked as investigational.

          '
      selected_evidence:
        snippet: Significantly more participants with rare germline mutations in APC genes were present
          in the HELLP cohort compared with controls (46% versus 8%, P = 0.01).
        supports: SUPPORT
