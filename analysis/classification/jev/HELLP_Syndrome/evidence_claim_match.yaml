        context: []
      assertion_type: Treatment
      assertion:
        name: Antenatal corticosteroid therapy
        description: 'Betamethasone or dexamethasone, given between 24 and 34 weeks primarily for fetal
          lung maturation. Its value for the maternal syndrome is a genuine controversy and this entry
          does not resolve it: a Cochrane review of 11 trials found improved platelet counts (dexamethasone
          more than betamethasone) but no clear effect on maternal death, severe maternal morbidity, or
          perinatal death, and concluded there is insufficient evidence for routine use.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: dexamethasone
            term:
              id: CHEBI:41879
              label: dexamethasone
          - preferred_term: betamethasone
            term:
              id: CHEBI:3077
              label: betamethasone
        target_phenotypes:
        - preferred_term: Thrombocytopenia
          term:
            id: HP:0001873
            label: Thrombocytopenia
        notes: 'The fetal-lung-maturation indication (a single course between 24 and 34 weeks) is not
          in dispute; what the Cochrane review questions is corticosteroid treatment of the maternal syndrome
          itself. High-dose and repeated courses should be avoided.

          '
      selected_evidence:
        snippet: There is to date insufficient evidence of benefits in terms of substantive clinical outcomes
          to support the routine use of steroids for the management of HELLP.
        supports: REFUTE
