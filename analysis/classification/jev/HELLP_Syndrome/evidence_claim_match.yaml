        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hellp_complement_causal_role
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Is alternative-complement-pathway dysregulation a causal driver of HELLP syndrome in
          the subset of women who carry germline variants, or a bystander marker of the severe endothelial
          injury that HELLP shares with other thrombotic microangiopathies?

          '
        attaches_to:
        - pathophysiology#Alternative Complement Pathway Dysregulation
        rationale: 'The evidence is suggestive but does not settle direction. Germline alternative-pathway
          variants are enriched in HELLP cohorts and modified Ham testing is frequently positive, but
          the study is a single case-control series, complement activation is expected downstream of any
          severe endothelial injury, and the therapeutic evidence for C5 blockade is uncontrolled case
          reports in a condition that resolves on delivery. Resolving this determines whether eculizumab
          belongs on this entry as a treatment or only as a hypothesis.

          '
        proposed_experiments:
        - experiment_id: hellp_c5_blockade_rct
          name: Randomized trial of C5 blockade in early-onset HELLP
          description: 'A randomized trial of eculizumab or ravulizumab versus expectant management plus
            standard care in HELLP remote from term, with pregnancy prolongation and maternal organ-injury
            markers as endpoints, stratified by germline alternative-pathway genotype and baseline mHam
            status.

            '
        - experiment_id: hellp_apc_variant_replication
          name: Replication of the germline variant enrichment in an independent cohort
          description: 'Independent case-control sequencing of alternative-pathway complement genes in
            HELLP versus normotensive pregnancy and versus severe preeclampsia without HELLP, to test
            whether the enrichment is specific to HELLP or general to severe hypertensive disease of pregnancy.

            '
      selected_evidence:
        snippet: These findings suggest that the inhibition of the terminal complement pathway, possibly
          through C5 blockade, may be an effective strategy to treat preeclampsia and hemolysis, elevated
          liver enzymes, and low platelet count syndrome, but this strategy warrants further evaluation
          in clinical trials.
        supports: SUPPORT
