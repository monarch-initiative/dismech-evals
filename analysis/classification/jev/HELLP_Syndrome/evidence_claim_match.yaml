      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: shared_placental_antiangiogenic
        hypothesis_label: Shared Placental Anti-Angiogenic Model with HELLP-Specific Amplification
        status: CANONICAL
        description: 'HELLP shares its initiating placental lesion with preeclampsia: immune maladaptation
          at the maternal-fetal interface, defective trophoblast invasion, placental ischemia, and release
          of anti-angiogenic factors that injure the maternal endothelium. What is HELLP-specific under
          this model is not a different trigger but a quantitatively stronger downstream inflammatory
          and prothrombotic response, with soluble endoglin and Fas ligand rather than sFlt-1 carrying
          the differential signal, converting endothelial dysfunction into frank thrombotic microangiopathy.

          '
        notes: 'This entry deliberately does not duplicate the full preeclampsia pathograph; the shared
          trigger is represented by a single node and the mechanistic detail of trophoblast invasion failure
          and sFlt-1/VEGF signaling lives on the Preeclampsia entry. The evidence below supports amplification,
          not a distinct upstream cause.

          '
      selected_evidence:
        snippet: These factors trigger the vascular endothelium, resulting in an enhanced inflammatory
          response which is stronger in HELLP.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
