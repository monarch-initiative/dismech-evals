          for a long-chain 3-hydroxyacyl-CoA dehydrogenase (LCHAD) deficiency allele, classically HADHA
          Glu474Gln, while the mother is an obligate heterozygote. Accumulating 3-hydroxy long-chain acyl
          intermediates in the fetoplacental unit are proposed to reach the maternal circulation and injure
          a maternal liver whose own beta-oxidation reserve is reduced. The genetic association is well
          established; the metabolite-transfer step is inferred rather than directly measured.

          '
        role: trigger
