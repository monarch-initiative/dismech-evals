      assertion:
        name: Acute fatty liver of pregnancy
        description: 'The closest mimic. Clinical and biochemical features overlap substantially, and
          AFLP shares the fetal fatty-acid-oxidation-defect association. The histological discriminator
          is decisive when tissue is available: HELLP shows periportal coagulation necrosis with no fatty
          transformation of hepatocytes, whereas AFLP is defined by microvesicular steatosis.

          '
