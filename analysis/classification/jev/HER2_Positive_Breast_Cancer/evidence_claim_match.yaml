        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: grb2_conformational_pivot_resistance_model
        hypothesis_label: GRB2 Conformational Pivot Resistance Model
        status: EMERGING
        description: GRB2 is a thermodynamic pivot point whose conformational state determines whether
          HER2-driven tumors funnel into cytoplasmic effector dominance, nuclear RAD51-dependent replication-fork
          protection, or PARPi-STING innate-immune activation. Allosteric stabilization or PROTAC degradation
          of GRB2 would select between these interactome states and modulate trastuzumab/TKI resistance.
          This hypothesis is distinguishable from the canonical effector model by predicting that GRB2
          perturbation produces different phenotypes depending on which conformational state is locked,
          not simply graded loss of adaptor function.
      selected_evidence:
        snippet: Growth factor receptor-bound protein 2 (GRB2) is a cytoplasmic adapter for tyrosine kinase
          signaling and a nuclear adapter for homology-directed-DNA repair.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
