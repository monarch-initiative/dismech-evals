    claim:
      about:
        disease:
          name: HER2-Positive Breast Cancer
          disease_term:
            preferred_term: HER2 positive breast carcinoma
            term:
              id: MONDO:0006244
              label: HER2 positive breast carcinoma
        context:
        - path: /discussions/0
          value:
            discussion_id: gap_her2_grb2_adaptor_pivot
            prompt: Is the GRB2 adaptor hub a tractable allosteric pivot point for rebalancing the HER2+
              breast cancer interactome under HER2-targeted therapy resistance, and does conformational
              control of GRB2 (versus its degradation) change which adaptive bypass routes the tumor recruits?
            kind: KNOWLEDGE_GAP
            status: OPEN
            attaches_to:
            - pathophysiology#GRB2 Adaptor Hub
            - pathophysiology#Downstream Oncogenic Signaling
            rationale: 'HER2-targeted antibodies and TKIs do not eliminate downstream GRB2 adaptor output:
              resistant tumors typically rewire RAS-MAPK and PI3K-AKT signaling rather than lose HER2.
              GRB2 also has a documented nuclear RAD51 fork-protection role under replication stress.
              Treating GRB2 as a thermodynamic pivot — stabilizing distinct SH2/SH3 conformational states
              with allosteric binders, or degrading the protein with PROTAC warheads — would let us test
              whether different perturbations funnel the interactome into distinct pathological survival
              states (cytoplasmic effector dominance vs. nuclear fork-protection dominance vs. innate-immune
              activation through PARPi-induced cytosolic DNA).'
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: exp_her2_grb2_conformational_pivot
        name: Allosteric GRB2 stabilization versus PROTAC degradation in HER2+ organoids
        description: Treat HER2-amplified patient-derived breast cancer organoids and isogenic cell-line
          panels (HER2-amplified, HER2-amplified plus PIK3CA-mutant, trastuzumab-resistant derivatives)
          with (a) allosteric GRB2 SH2/SH3 binders tuned to stabilize discrete conformational states,
          (b) a GRB2-directed PROTAC warhead that physically degrades the adaptor, and (c) paired HER2
          inhibition (trastuzumab, tucatinib, T-DXd). Read out RAS-MAPK and PI3K-AKT effector signaling,
          nuclear GRB2 localization, RAD51 fork-protection at stalled replication forks, cytosolic DNA
          release, cGAS-STING activation, and immune-cell killing in autologous co-culture. Compare to
          PARP-inhibitor co-treatment arms to test whether GRB2 pivot state predicts PARPi-STING vulnerability.
        experiment_type:
          preferred_term: controlled perturbation experiment
        model_systems:
        - name: HER2-amplified patient-derived breast cancer organoid panel
          description: Matched patient-derived organoids spanning trastuzumab-naive, trastuzumab-resistant,
            and PIK3CA-co-mutant HER2+ disease, paired with autologous immune cells for co-culture readouts.
          experimental_model_type: ORGANOID
          organism:
            preferred_term: human
            term:
              id: NCBITaxon:9606
              label: Homo sapiens
          tissue_term:
            preferred_term: mammary gland
            term:
              id: UBERON:0001911
              label: mammary gland
          cell_types:
          - preferred_term: luminal epithelial cell of mammary gland
            term:
              id: CL:0002326
              label: luminal epithelial cell of mammary gland
        perturbations:
        - name: Allosteric GRB2 conformational stabilization
          target: pathophysiology#GRB2 Adaptor Hub
          description: Small-molecule allosteric binders tuned to stabilize distinct SH2/SH3 conformational
            states of GRB2 to test conformation-specific output.
          genes:
          - preferred_term: GRB2
            term:
              id: hgnc:4566
              label: GRB2
        - name: GRB2 PROTAC degradation
          target: pathophysiology#GRB2 Adaptor Hub
          description: Targeted GRB2 degradation via PROTAC warhead to compare adaptor loss with adaptor
            conformational locking.
          genes:
          - preferred_term: GRB2
            term:
              id: hgnc:4566
              label: GRB2
          effect: DECREASED
        - name: PARP inhibitor replication-stress challenge
          target: pathophysiology#GRB2 Adaptor Hub
          description: Co-administer PARP inhibitor to test whether GRB2 conformational state gates PARPi-induced
            cytosolic DNA and cGAS-STING activation.
        readouts:
        - name: RAS-MAPK and PI3K-AKT effector output
          target: pathophysiology#Downstream Oncogenic Signaling
          biological_processes:
          - preferred_term: MAPK cascade
            term:
              id: GO:0000165
              label: MAPK cascade
          direction: POSITIVE
        - name: Nuclear GRB2 / RAD51 fork-protection and innate-immune activation
          target: pathophysiology#GRB2 Adaptor Hub
          biological_processes:
          - preferred_term: DNA damage response
            term:
              id: GO:0006974
              label: DNA damage response
          - preferred_term: innate immune response
            term:
              id: GO:0045087
              label: innate immune response
          direction: NEGATIVE
          interpretation: Loss of nuclear GRB2 / RAD51 fork-protection together with increased innate-immune
            activation under PARP inhibition would support a conformation-gated state switch.
        decision_criterion: The conformational pivot model is supported if allosteric stabilization and
          PROTAC degradation produce distinct effector versus DDR phenotypes in matched HER2+ models,
          and if at least one perturbation sensitizes trastuzumab-resistant lines to PARP-inhibitor-driven
          cytosolic DNA and cGAS-STING activation.
        would_support:
        - pathophysiology#GRB2 Adaptor Hub
        - pathophysiology#Downstream Oncogenic Signaling
      selected_evidence:
        snippet: In GRB2-depleted cells, PARP inhibitor (PARPi) treatment releases DNA fragments from
          stalled forks into the cytoplasm that activate the cGAS-STING pathway to trigger pro-inflammatory
          cytokine production.
        supports: SUPPORT
