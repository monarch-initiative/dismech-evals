          effector complexes. In HER2-amplified breast tumors, the GRB2 adaptor function is constitutively
          engaged through ERBB2 homo- and heterodimers, driving sustained RAS-MAPK and PI3K-AKT signaling.
          The HER2 amplicon at 17q12 frequently co-amplifies GRB7, an SH2 adaptor whose expression correlates
          with GRB2-pathway output and adverse outcome. A second, nuclear GRB2 function in RAD51-dependent
          replication-fork protection may rebalance the tumor's interactome toward DNA-damage tolerance
          under HER2-targeted or chemotherapy-induced replication stress.
