        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cmtm6_her2_stabilization_resistance_model
        hypothesis_label: CMTM6 HER2 Stabilization Resistance Model
        status: EMERGING
        description: Trastuzumab resistance is sustained in part by post-translational stabilization of
          the HER2 receptor protein at the cell surface. CMTM6 (CKLF-like MARVEL transmembrane domain-containing
          6) directly interacts with HER2 and inhibits HER2 ubiquitination, preserving the GRB2-adaptor
          output even under trastuzumab pressure. Under the interactome-rebalancing framing, CMTM6 acts
          as a separate post-translational pivot point in parallel to GRB2 conformational state, and degrading
          or inhibiting CMTM6 may resensitize tumors to HER2-targeted therapy. This hypothesis is independent
          of (and complementary to) GRB2-level conformational control.
      selected_evidence:
        snippet: these findings highlight that CMTM6 stabilizes HER2 protein, contributing to trastuzumab
          resistance and implicate CMTM6 as a potential prognostic marker and therapeutic target for overcoming
          trastuzumab resistance in HER2+ breast cancer
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36627608
      reference_title: CMTM6 overexpression confers trastuzumab resistance in HER2-positive breast cancer.
      evidence_source: IN_VITRO
      explanation: Xu et al. directly establish CMTM6-mediated post-translational HER2 stabilization as
