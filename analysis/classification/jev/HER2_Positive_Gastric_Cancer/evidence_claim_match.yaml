        genetic_context:
          variant_origin: SOMATIC
        description: ERBB2 gene amplification leads to overexpression of the HER2 receptor tyrosine kinase.
          High-level HER2 expression promotes constitutive receptor dimerization (particularly HER2 homodimers
          and HER2/HER3 heterodimers), leading to ligand-independent signaling. HER2 amplification is
          a driver event in gastric carcinogenesis.
        cell_types:
        - preferred_term: epithelial cell of stomach
          term:
