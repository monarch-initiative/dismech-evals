      assertion_type: Genetic
      assertion:
        name: ERBB2 (HER2)
        association: Somatic Amplification
        notes: ERBB2 amplification occurs in 15-20% of gastric adenocarcinomas, with higher rates at the
          gastroesophageal junction (up to 30%) and in intestinal-type tumors. Copy number gain correlates
          with protein expression and clinical benefit from HER2-targeted therapy.
      selected_evidence:
        snippet: Patients with gastric or gastro-oesophageal junction cancer were eligible for inclusion
          if their tumours showed overexpression of HER2 protein by immunohistochemistry or gene amplification
          by fluorescence in-situ hybridisation.
        supports: SUPPORT
