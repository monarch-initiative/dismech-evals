          term:
            id: UBERON:0000945
            label: stomach
      selected_evidence:
        snippet: Human epidermal growth factor receptor 2 (HER2)-positive gastric cancer (GC) represents
          a distinct molecular cancer subtype that is often associated with a poor prognosis.
        supports: SUPPORT
