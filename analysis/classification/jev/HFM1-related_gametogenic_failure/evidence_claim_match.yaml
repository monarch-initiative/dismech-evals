              intermediates into designated crossovers during meiotic prophase I. HFM1 stabilizes the
              MutSγ complex (MSH4-MSH5) on Holliday junctions and promotes class I crossover formation.
              Its loss leads to varying reductions in HFM1 foci on chromosome axes and defects in synapsis
              and crossover formation, blocking meiotic progression.
