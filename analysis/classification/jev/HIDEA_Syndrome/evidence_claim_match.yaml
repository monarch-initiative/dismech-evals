        name: P4HTM Gene Loss-of-Function
        description: Biallelic loss-of-function variants in P4HTM result in loss of ER-resident transmembrane
          prolyl 4-hydroxylase activity. The enzyme contains an EF-hand domain that allows calcium-dependent
          regulation of its catalytic activity, linking the genetic defect to both HIF signaling and calcium
          homeostasis pathways.
        genes:
