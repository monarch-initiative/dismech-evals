  2fd3c02a7ae5f23468c333c0536a1a713b0e39b67b0d54ee73adb19f1e81da35:
    claim:
      about:
        disease:
          name: HIDEA_Syndrome
          disease_term:
            preferred_term: HIDEA syndrome
            term:
              id: MONDO:0032780
              label: hypotonia, hypoventilation, impaired intellectual development, dysautonomia, epilepsy,
                and eye abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Central Respiratory Control Dysfunction
        conforms_to: sleep_disordered_breathing_intermittent_hypoxia#Ventilatory Control Instability or
          Chemoreflex Failure
        notes: 'Conformance is declared at the module''s control-arm trigger, and specifically at its
          HYPORESPONSIVE rather than unstable branch: the chemoreflex here fails to respond (hypoventilation
          with blunted responses to hypoxia) rather than oscillating with high loop gain, which is the
          same branch congenital central hypoventilation syndrome enters through. As there, conformance
          is NOT declared at the module''s central node (#Chronic Intermittent Hypoxia and Reoxygenation):
          the gas-exchange lesion is sustained hypoventilation, not the cyclical desaturation-reoxygenation
          that drives that node''s oxidative-inflammatory arm. Note that obstructive sleep apnea is also
          reported in this syndrome, so an individual patient may additionally have disease entering through
          the module''s anatomic arm; that is a separate lesion and is not claimed by this node.'
        description: Loss of P4H-TM leads to impaired central respiratory control, with hypoventilation
          and blunted responses to hypoxia. Patients may require BiPAP support and are at risk for respiratory
          distress during infections.
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Regulation of respiratory system process
          term:
            id: GO:0044065
            label: regulation of respiratory system process
        - preferred_term: Response to hypoxia
          term:
            id: GO:0001666
            label: response to hypoxia
      selected_evidence:
        snippet: Hypoventilation, obstructive and central sleep apnea, and dysautonomia were identified
          as novel features associated with the phenotype.
        supports: SUPPORT
