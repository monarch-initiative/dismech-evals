          term:
            id: hgnc:28858
            label: P4HTM
        molecular_functions:
        - preferred_term: hypoxia-inducible factor-proline dioxygenase activity
          term:
            id: GO:0160082
            label: hypoxia-inducible factor-proline dioxygenase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Biallelic loss-of-function P4HTM gene variants cause hypotonia, hypoventilation, intellectual
          disability, dysautonomia, epilepsy, and eye abnormalities (HIDEA).
        supports: SUPPORT
