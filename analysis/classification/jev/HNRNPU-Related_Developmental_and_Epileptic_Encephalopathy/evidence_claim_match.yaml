          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Neural Progenitor Cell Death
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Provides the direct evidence for progenitor-selective cell death and, through the
          rescue experiments, for its causal role in the cortical phenotype.
        limitations: This is a conditional truncation removing HNRNPU function outright, whereas human
          disease is heterozygous loss of function; complete Hnrnpu knockout is embryonic lethal in mice,
          so the model sits at a far more severe point on the dose-response curve than any human genotype
          and produces near-complete cortical loss rather than the nonspecific MRI findings seen in patients.
        readouts:
        - name: Neural progenitor viability after Cre-mediated truncation
          target: Neural Progenitor Cell Death
          direction: DECREASED
          interpretation: Progenitors die rapidly and more readily than postmitotic neurons.
        - name: Cortical structure after rescue intervention
          target: Neural Progenitor Cell Death
          direction: RESTORED
          interpretation: Pharmacological and genetic agents partially reverse the cortical loss, supporting
            cell death as its cause rather than a correlate.
      selected_evidence:
        snippet: We aimed to understand HNRNPU's roles in the developing brain.
        supports: SUPPORT
