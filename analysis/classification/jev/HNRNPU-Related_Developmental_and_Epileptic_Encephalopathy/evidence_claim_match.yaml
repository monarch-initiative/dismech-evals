  55f518fc4bc644fc07e0af6fa81e4b0b524dac16f6743707b32dd4e1eaf68c76:
    claim:
      about:
        disease:
          name: HNRNPU-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 54
            term:
              id: MONDO:0033363
              label: developmental and epileptic encephalopathy, 54
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_conditional_truncation_versus_human_haploinsufficiency
        prompt: How much of the mouse cortical phenotype - rapid progenitor death and near-complete loss
          of cortical structures - reflects human HNRNPU disease, given that patients are heterozygous
          with nonspecific MRI findings and only 14-20% have microcephaly?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Neural Progenitor Cell Death
        - pathophysiology#Loss of Cortical Structure
        rationale: 'The mouse model is a conditional truncation that removes HNRNPU function outright,
          and complete knockout is embryonic lethal. Human disease is heterozygous, and the great majority
          of patients do not have microcephaly at all, which is hard to reconcile with a mechanism whose
          defining feature in the model is rapid, near-complete progenitor elimination. Either the human
          dose is far enough above the death threshold that the cell-death arm contributes little, or
          it operates at a much lower intensity than the model shows. The heterozygous human organoid
          does reach the same endpoint - it shows significant reductions in progenitor populations and
          generates significantly smaller organoids - so the mismatch is narrower than a bare dose argument
          suggests: progenitor loss is real at the human gene dose, and the open question is one of magnitude
          rather than of kind. The dose-matched heterozygous mouse now bears on this directly, and it
          lands on the patient side: brain size, callosal morphology, cortical thickness and hippocampal
          width are all unchanged, so an in vivo animal at the human genotype shows no gross structural
          phenotype at all. That measurement carries its own caveat, since it is gross morphometry at
          postnatal day 0 and the authors call for higher-resolution work, and the same mouse loses only
          about a fifth to a quarter of cortical hnRNP U rather than half - which may itself be why the
          phenotype is absent. What remains unexplained is why organoid size reduction is universal across
          mutant lines while microcephaly reaches only 14-20% of patients and the heterozygous mouse has
          none; the difference between an organoid and an intact brain, where compensation and continued
          growth are both available, is the obvious place to look.'
        proposed_experiments:
        - experiment_id: exp_heterozygous_progenitor_viability
          name: Progenitor viability in heterozygous rather than truncated models
          description: Measure neural progenitor apoptosis and proliferation directly in Hnrnpu-heterozygous
            mouse cortex and in isogenic heterozygous human organoids, using the same time-lapse and marker
            readouts as the conditional truncation study, to establish whether the cell-death arm operates
            at all at the human gene dose.
      selected_evidence:
        snippet: HNRNPU is critical in mammalian development, and knockout mice exhibit early lethality
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
