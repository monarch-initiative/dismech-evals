      - /disease_term
    evidence_metadata:
      reference: PMID:34823151
      reference_title: The role of SAF-A/hnRNP U in regulating chromatin structure.
      evidence_source: OTHER
      explanation: States directly that the chromatin arm's mechanism is not understood.
