  cd65000ebe0bec02589a4b6bbd778e0ab653cee3ec38b34cc4a8af0996bc314b:
    claim:
      about:
        disease:
          name: HNRNPU-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 54
            term:
              id: MONDO:0033363
              label: developmental and epileptic encephalopathy, 54
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_organoid_developmental_window_limits
        prompt: Do human brain organoids model HNRNPU-related disorder only within a narrow embryonic
          developmental window, and if so what system should be used to study the postnatal seizure phenotype
          that dominates the clinical picture?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Widespread Transcriptional Dysregulation
        - pathophysiology#Cortical Network Hyperexcitability
        rationale: The organoid study found co-dysregulation enriched against embryonic but explicitly
          not perinatal mouse cortex, and the authors conclude that organoids may only be suitable for
          certain cell types within a specific developmental window. That is a problem for this disorder
          specifically, because seizures affect 83-95% of patients and are a postnatal phenomenon, while
          the one human model system appears to lose fidelity exactly as development moves past the embryonic
          period. A therapeutic screen run in organoids would therefore be optimizing against an embryonic
          transcriptional signature while the target phenotype is postnatal epilepsy.
        proposed_experiments:
        - experiment_id: exp_extended_organoid_timecourse
          name: Extended organoid time course against postnatal cortex
          description: Profile HNRNPU-heterozygous organoids at successively later maturation stages,
            including sliced or vascularized long-term cultures, and test co-dysregulation against perinatal
            and postnatal mouse cortex, to determine whether fidelity can be recovered at later stages
            or whether a different system is required for the seizure phenotype.
      selected_evidence:
        snippet: Thus, hnRNPU deficient human organoids may only be suitable to model transcriptional
          dysregulation in certain cell types within a specific developmental time window.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36594023
      reference_title: Evidence of shared transcriptomic dysregulation of HNRNPU-related disorder between
        human organoids and embryonic mice.
      evidence_source: IN_VITRO
      explanation: The authors state the limitation of their own model system.
