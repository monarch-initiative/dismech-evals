          morphology, cortical thickness and hippocampal width are all unchanged, in sharp contrast to
          the near-complete cortical loss the conditional truncation produces.
        limitations: The measurements are gross morphometry at postnatal day 0, and the authors say explicitly
          that higher-resolution studies able to detect subtler abnormalities are still warranted - so
          this is evidence against a gross structural phenotype, not against a structural contribution
          as such. It is nonetheless the most directly relevant datum available for the dose question,
          since it is the only structural measurement made at the human genotype in vivo.
