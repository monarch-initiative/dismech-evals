  1b058627c0f3b867a8d3ecdaf1789b0dfdc792005f4c2ca194b55b20c7bbf168:
    claim:
      about:
        disease:
          name: HNRNPU-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 54
            term:
              id: MONDO:0033363
              label: developmental and epileptic encephalopathy, 54
        context:
        - path: /animal_models/1
          value:
            name: Hnrnpu+/113DEL heterozygous mouse
            species: Mouse
            genotype: Hnrnpu heterozygous 113-bp out-of-frame exon 1 deletion (Hnrnpu+/113DEL)
            publication: PMID:37782669
            description: 'A CRISPR-induced constitutive heterozygous truncating deletion in exon 1 of
              mouse Hnrnpu, targeting the region where at least five human patient truncating variants
              fall. This is the dose-matched counterpart of the conditional cortical knockout above: it
              models the human genotype rather than complete loss of function, and it is informative as
              much for what it fails to reproduce as for what it does.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Cortical Network Hyperexcitability
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Supplies the only direct excitability measurement at the human gene dose. The lowered
          electroconvulsive threshold is a measurement of network excitability rather than an inference
          from seizure counts, which is what the patient evidence on this node otherwise rests on.
        limitations: 'Excitability is measured as susceptibility to an electrically evoked seizure, not
          as spontaneous epileptiform activity, so it establishes a lowered seizure threshold rather than
          the ongoing hyperexcitable state patients are presumed to carry. The model also under-represents
          the human lesion: cortical hnRNP U falls by only about 20-26% rather than the expected half,
          which the authors read as evidence of compensation, so the measured effect is likely a floor.'
        readouts:
        - name: Maximal seizure electroconvulsive threshold
          target: Cortical Network Hyperexcitability
          direction: DECREASED
          interpretation: Less current is required to evoke a maximal tonic hindlimb extension seizure
            in heterozygous mutants than in wild-type littermates.
      selected_evidence:
        snippet: Heterozygous mutants demonstrated global developmental delay, impaired ultrasonic vocalizations,
