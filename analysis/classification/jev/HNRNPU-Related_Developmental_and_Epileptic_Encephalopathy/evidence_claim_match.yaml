        name: Heterozygous HNRNPU Loss-of-Function Lesion
        biological_scale: MOLECULAR
        description: A de novo heterozygous loss-of-function point variant in HNRNPU, or a 1q44 microdeletion
          encompassing the gene, is present. Both routes reduce HNRNPU to a single functional copy, which
          is the starting point this node records - but they are not the same lesion, because a 1q44 deletion
          also removes AKT3 and ZBTB18 (see the genetic section). This node records the HNRNPU lesion
          only, not its consequences.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: De novo loss-of-function variants in HNRNPU have been found to cause a neurodevelopmental
          syndrome
        supports: SUPPORT
