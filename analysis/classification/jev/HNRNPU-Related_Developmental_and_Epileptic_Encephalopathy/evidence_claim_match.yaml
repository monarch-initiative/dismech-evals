      assertion_type: Pathophysiology
      assertion:
        name: Reduced hnRNP U Protein Dose
        biological_scale: MOLECULAR
        description: Haploinsufficiency for an abundant, ubiquitously expressed nuclear protein. Because
          hnRNP U is required for mammalian development - complete knockout mice die early - the disease
          is specifically a dose problem rather than an absence problem, and the relevant question is
          which of its several functions are most dose-sensitive.
      selected_evidence:
        snippet: HNRNPU is critical in mammalian development, and knockout mice exhibit early lethality
        supports: SUPPORT
