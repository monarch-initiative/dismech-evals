          interpretation: The two regional measures most relevant to a progenitor-depletion mechanism
            are also unaffected.
      selected_evidence:
        snippet: Further examination of Hnrnpu+/113DEL brains also showed no significant change in cortical
          thickness and hippocampal width
        supports: SUPPORT
