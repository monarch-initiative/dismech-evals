              id: MONDO:0033363
              label: developmental and epileptic encephalopathy, 54
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_which_hnrnpu_function_drives_the_phenotype
        prompt: Which of hnRNP U's functions - alternative splicing, chromatin architecture via the SAF-A/RNA
          nuclear mesh, or transcriptional regulation - is the dose-sensitive one that produces the neurodevelopmental
          phenotype, and are they separable at all?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Alternative Splicing Program
        - pathophysiology#Destabilized SAF-A/RNA Nuclear Mesh and Chromatin Architecture
        - pathophysiology#Widespread Transcriptional Dysregulation
        rationale: 'The pathograph here carries three parallel molecular arms because the protein has
          three documented functions, not because three have been shown to matter for disease. No study
          has separated them: the splicing evidence comes from a conditional truncation that removes all
          functions at once, and the chromatin literature explicitly says a mechanistic understanding
          is lacking. The domain architecture offers a route, since the DNA/RNA-binding, oligomerisation,
          and protein-interaction functions map to separable domains, so this is a tractable question
          rather than a permanent unknown. It matters because a therapy would have to target the dose-sensitive
          arm, and at present a screen would have no defined molecular endpoint to screen against.'
        proposed_experiments:
        - experiment_id: exp_domain_separation_of_function_alleles
          name: Domain-selective HNRNPU separation-of-function alleles in human neurons
          description: Generate isogenic iPSC lines carrying alleles that selectively disable the DNA/RNA-binding
            domain, the ATP-dependent oligomerisation function required for mesh formation, or the RNA-binding
            motifs, and compare splicing changes, chromatin accessibility, transcriptional dysregulation,
            and progenitor viability across them, to establish which function the neurodevelopmental phenotype
            tracks.
      selected_evidence:
        snippet: This mesh is thought to regulate nuclear and chromatin architecture, yet a mechanistic
          understanding is lacking.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
