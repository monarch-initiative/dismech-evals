            name: Hnrnpu+/113DEL heterozygous mouse
            species: Mouse
            genotype: Hnrnpu heterozygous 113-bp out-of-frame exon 1 deletion (Hnrnpu+/113DEL)
            publication: PMID:37782669
            description: 'A CRISPR-induced constitutive heterozygous truncating deletion in exon 1 of
              mouse Hnrnpu, targeting the region where at least five human patient truncating variants
              fall. This is the dose-matched counterpart of the conditional cortical knockout above: it
              models the human genotype rather than complete loss of function, and it is informative as
              much for what it fails to reproduce as for what it does.'
          role: ancestor
        - path: /animal_models/1/modeled_mechanisms/2
          value:
            target: Loss of Cortical Structure
            relationship: FAILS_TO_RECAPITULATE
            fidelity: LOW
            description: No gross cortical phenotype appears at the human gene dose. Brain size, corpus
              callosum morphology, cortical thickness and hippocampal width are all unchanged, in sharp
              contrast to the near-complete cortical loss the conditional truncation produces.
            limitations: The measurements are gross morphometry at postnatal day 0, and the authors say
              explicitly that higher-resolution studies able to detect subtler abnormalities are still
              warranted - so this is evidence against a gross structural phenotype, not against a structural
              contribution as such. It is nonetheless the most directly relevant datum available for the
              dose question, since it is the only structural measurement made at the human genotype in
              vivo.
          role: ancestor
