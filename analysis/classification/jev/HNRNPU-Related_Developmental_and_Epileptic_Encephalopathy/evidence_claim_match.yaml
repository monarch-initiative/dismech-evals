      assertion_type: Genetic
      assertion:
        name: HNRNPU
        association: De novo heterozygous loss-of-function variants
        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: 'HNRNPU encodes heterogeneous nuclear ribonucleoprotein U, also known as scaffold attachment
          factor A. The protein binds RNA, DNA, and other proteins, and those interactions support its
          roles in organizing and stabilizing nuclear chromatin, regulating transcription, and RNA splicing
          and stability. Disease arises from de novo heterozygous loss-of-function point variants or from
          1q44 microdeletions encompassing the gene; both converge on haploinsufficiency for HNRNPU itself,
          but they are NOT interchangeable at the phenotype level: in the 1q43q44 contiguous-gene region,
          AKT3 haploinsufficiency is the main driver of microcephaly and ZBTB18 of corpus callosum anomalies,
          while HNRNPU alteration mostly drives the epilepsy and sets the degree of intellectual disability.
          A deletion patient''s microcephaly or callosal anomaly may therefore be attributable to a neighbouring
          gene rather than to HNRNPU. Complete loss is embryonic lethal in mice, so no null human genotype
          exists. A DNA methylation episignature has been developed for this disorder and can serve as
          a diagnostic biomarker, including for variant reclassification.'
        gene_term:
          preferred_term: HNRNPU
          term:
            id: hgnc:5048
            label: HNRNPU
      selected_evidence:
        snippet: De novo loss-of-function variants in HNRNPU have been found to cause a neurodevelopmental
          syndrome
        supports: SUPPORT
