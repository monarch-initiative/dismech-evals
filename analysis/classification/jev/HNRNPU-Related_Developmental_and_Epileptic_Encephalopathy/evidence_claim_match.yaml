  00a57dabaf24dbdf5c075763565c98226b8cef865526da9a378f5d32c9e57de6:
    claim:
      about:
        disease:
          name: HNRNPU-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 54
            term:
              id: MONDO:0033363
              label: developmental and epileptic encephalopathy, 54
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_valproate_efficacy_mechanism
        prompt: Why is sodium valproate reported as frequently effective in HNRNPU-related disorder, when
          seizures in most developmental and epileptic encephalopathies are refractory, and does that
          reflect a mechanistic relationship between valproate's chromatin effects and the HNRNPU lesion?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Recurrent Seizures
        - pathophysiology#Destabilized SAF-A/RNA Nuclear Mesh and Chromatin Architecture
        rationale: 'GeneReviews describes valproate as often used and frequently effective here, which
          stands out against the pharmacoresistance typical of DEEs. Valproate also has chromatin-level
          activity as a histone deacetylase inhibitor, and the HNRNPU lesion is partly a chromatin-architecture
          lesion, so a mechanistic rather than coincidental relationship is worth asking about. The question
          is speculative and is recorded as an open question, not a hypothesis with supporting evidence:
          it may simply be that this disorder''s seizure types, commonly tonic-clonic and absence, are
          ones valproate treats well in any aetiology. Distinguishing those two explanations would need
          a comparison against matched seizure types in other DEEs.'
        proposed_experiments:
        - experiment_id: exp_valproate_response_versus_matched_dees
          name: Valproate response rate against seizure-type-matched DEE controls
          description: Compare valproate response rates in HNRNPU-related disorder against other DEEs
            matched for seizure semiology, to test whether the reported efficacy exceeds what the seizure
            types alone predict; if it does, assay whether valproate's HDAC inhibition normalizes chromatin
            accessibility in HNRNPU-heterozygous human neurons.
      selected_evidence:
        snippet: Affected individuals are likely to experience seizures (most commonly tonic-clonic or
          absence) that may be refractory to treatment.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35274911
      reference_title: HNRNPU-Related Neurodevelopmental Disorder.
      evidence_source: HUMAN_CLINICAL
      explanation: Gives the seizure semiology behind the simpler alternative explanation, and notes that
        refractoriness still occurs, so the efficacy is not universal.
