          empty body - so it too is recorded here rather than cited. It is listed explicitly so a later
          curator does not read its presence in `references_cache/` as an uncited oversight.'
      selected_evidence:
        snippet: Autosomal-recessive PHNED has previously been mapped to chromosomal region 12q12-q14.1,
          which contains the type II hair keratin and HOXC clusters.
        supports: SUPPORT
    origin:
