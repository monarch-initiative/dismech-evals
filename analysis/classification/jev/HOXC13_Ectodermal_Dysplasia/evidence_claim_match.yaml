          term:
            id: hgnc:5125
            label: HOXC13
        relationship_type: CAUSATIVE
        variants:
        - name: c.390C>A (p.Tyr130*) nonsense
          description: Homozygous nonsense allele identified by whole-exome sequencing in a consanguineous
            Chinese family, the first HOXC13 variant reported in PHNED. Scalp tissue from the index case
            showed dramatically reduced HOXC13 mRNA and nearly absent protein in hair follicles, indicating
            nonsense-mediated decay.
          type: NONSENSE
        - name: 27.6 kb microdeletion of HOXC13 exon 1
          description: Homozygous 27.6 kb deletion removing the first exon of HOXC13, found in an affected
            female from a consanguineous Afghan family. A predicted null allele, and the reason deletion
            analysis belongs in the diagnostic strategy alongside sequencing.
          type: DELETION
        - name: c.355delC (p.Leu119Trpfs*20) frameshift
          description: Homozygous single-nucleotide deletion in a consanguineous Syrian family. Expression
            studies showed the truncated protein mislocalizes to the cytoplasm and cannot transactivate
            target-gene promoters, giving direct functional evidence for loss of function.
          type: FRAMESHIFT
        - name: c.812A>G (p.Gln271Arg) homeodomain missense
          description: Homozygous missense variant in the DNA-binding homeodomain, reported in a Hispanic
            child and the first missense HOXC13 allele described in PHNED. Pathogenicity support for this
            allele is familial cosegregation plus in silico prediction (PolyPhen-2, SIFT); no direct functional
            assay was performed.
          type: MISSENSE
        - name: c.929A>C (p.Asn310Thr) homeodomain missense
          description: Homozygous missense variant in the homeobox DNA-binding domain identified in a
            four-generation consanguineous Pakistani family mapped to the ECTD9 locus at 12q13.13. Homology
            modeling predicted loss of hydrogen bonding within the homeodomain fold.
          type: MISSENSE
        - name: c.931C>T (p.Arg311Trp) protein-destabilizing missense
          description: Homozygous homeodomain missense variant that, unlike other homeodomain alleles,
            acts by reducing HOXC13 protein stability rather than by abolishing DNA binding, establishing
            a third molecular route to the same phenotype.
          type: MISSENSE
        notes: 'HOXC13-related PHNED is exceptionally rare. The 2024 report describing p.Arg311Trp identifies
          its family as the ninth reported worldwide; that count appears in the paper''s introduction
          rather than its abstract, so it is recorded as a note rather than a quoted evidence snippet.
          Two further published families (PMID:23461661, Ali et al. 2013; PMID:29278420, Humbatova et
          al. 2018) are not cited with evidence blocks here because both cache as Letters with no retrievable
          abstract text. PMID:41714886 (Sharma & Vinay 2026, "Pure Hair-Nail Ectodermal Dysplasia: Expanding
