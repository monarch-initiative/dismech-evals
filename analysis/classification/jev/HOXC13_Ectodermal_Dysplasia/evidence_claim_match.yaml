          - name: Heterozygote phenotype and truncated protein persistence
            target: HOXC13 Transcription Factor Loss of Function
            direction: ALTERED
            interpretation: Heterozygous involvement plus retained truncated protein is the signature
              of a dominant-negative allele rather than haploinsufficiency.
      selected_evidence:
        snippet: Considering the low viability of the Hoxc13 KO mice, the Naked mutation provides an attractive
          new model for studying ECTD9 disease mechanisms.
        supports: SUPPORT
