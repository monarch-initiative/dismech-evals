  9eb8baad50e376441434bb4533e518c3d166edd0c95ad906cd46e290053aa483:
    claim:
      about:
        disease:
          name: HOXC13-Related Pure Hair-Nail Ectodermal Dysplasia
          disease_term:
            preferred_term: ectodermal dysplasia 9, hair/nail type
            term:
              id: MONDO:0013976
              label: ectodermal dysplasia 9, hair/nail type
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing with Exon-Level Copy-Number Analysis
        description: 'Suspect ECTD9 when congenital generalized hypotrichosis or alopecia co-occurs with
          dystrophy or hypoplasia of most or all twenty nails while teeth and sweating are normal. Confirmation
          is molecular: a hereditary hypotrichosis / ectodermal-dysplasia panel containing HOXC13, KRT74,
          and KRT85, or targeted HOXC13 sequencing when the phenotype is highly specific, followed by
          trio or family-based exome/genome sequencing if the panel is negative.

          The step that changes management is copy-number analysis. A 27.6 kb homozygous deletion removing
          HOXC13 exon 1 is an established cause of this disease, and a sequence-only assay will not see
          it. Any panel or exome used to exclude ECTD9 must therefore include exon-level CNV calling;
          a negative sequencing-only result is not a negative test. Chromosomal microarray is a poor substitute
          at this scale unless probe coverage over HOXC13 happens to be adequate.'
        notes: No diagnostic blood chemistry, circulating protein, metabolite, imaging study, electrophysiologic
          test, or enzyme assay is established. Hair microscopy and skin biopsy may show abnormal follicular
          differentiation but are not specific enough to replace molecular testing. Karyotyping, FISH,
          mitochondrial sequencing, and repeat-expansion testing are not indicated by the known mechanism.
          There is no population or newborn screening programme; cascade carrier testing, prenatal diagnosis,
          and preimplantation genetic testing become available once the familial biallelic variants are
          known.
      selected_evidence:
        snippet: In an additional affected female from a consanguineous Afghan family, we found a 27.6
          kb homozygous microdeletion involving the first exon of HOXC13.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
