          animal model. Hoxc13-null mice develop skeletal defects, progressive weight loss, and low viability;
          reported human ECTD9 patients have none of these. This exclusion is therefore also the anchor
          of the human/model mismatch discussion recorded on this entry.

          Term-scope caveat: the bound term HP:0009121 is *Abnormal axial skeleton morphology*, which
          is narrower than the node name. The absence being asserted covers the skeleton generally - the
          murine phenotype is vertebral, so the axial term is the closest available match to the specific
          finding that is missing in humans, but it does not by itself exclude appendicular involvement.
          HP:0009121 was chosen over a broader skeletal term because it names what the mouse literature
          actually reports; read the exclusion as scoped to that.'
