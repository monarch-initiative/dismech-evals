  7bd164d0d09e679514e5e06e5b5225e624835bf07e2a833624e40007c644acb6:
    claim:
      about:
        disease:
          name: HOXC13-Related Pure Hair-Nail Ectodermal Dysplasia
          disease_term:
            preferred_term: ectodermal dysplasia 9, hair/nail type
            term:
              id: MONDO:0013976
              label: ectodermal dysplasia 9, hair/nail type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HOXC13 Transcription Factor Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic HOXC13 variants deplete the functional pool of HOXC13 protein in hair
          follicle and nail matrix nuclei. Three demonstrated routes converge here in human disease: truncating
          and whole-exon deletion alleles that trigger nonsense-mediated decay or yield a cytoplasmically
          mislocalized protein; homeodomain missense alleles that impair sequence-specific DNA binding;
          and at least one homeodomain missense allele that destabilizes the folded protein. The shared
          endpoint is reduced nuclear HOXC13 activity.

          A fourth route exists in the mouse but does not belong to this node. The Naked (N) allele is
          a terminal truncation whose transcript escapes nonsense-mediated decay, leaving a persistent
          truncated protein that is pathogenic in heterozygotes - a dominant-negative mechanism rather
          than a depletion of functional protein. No such allele has been reported in humans, and every
          human ECTD9 pedigree is recessive. The mouse allele is curated under `animal_models` and its
          divergence is one of the questions in the `hoxc13_model_fidelity_disagreement` discussion; it
          is deliberately not folded into this loss-of-function node, which would misdescribe it.'
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We examined HOXC13 expression in scalp specimen obtained from the index individual of
          the Chinese family and detected dramatically reduced mRNA levels in skin tissue and nearly absent
          protein staining in hair follicles, suggesting a mechanism of nonsense-mediated mRNA decay.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
