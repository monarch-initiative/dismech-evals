    evidence_metadata:
      reference: PMID:23063621
      reference_title: Loss-of-function mutations in HOXC13 cause pure hair and nail ectodermal dysplasia.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Explains why HOXC13 and the type II hair keratin genes (KRT85, KRT74) are all PHNED
        candidates: they share the same 12q linkage interval. This is also why ECTD4, ECTD7, and ECTD9
        are readily confused in the literature.'
