        biological_scale: MOLECULAR
        description: HOXC13 drives the terminal differentiation program of hair- and nail-forming keratinocytes,
          including hair keratin genes. Reported HOXC13 target genes whose expression falls when HOXC13
          is lost include KRT35, KRT85, and FOXN1. Loss of this transcriptional output deprives differentiating
          keratinocytes of the structural proteins needed to build a normal hair shaft or nail plate.
          Notably, KRT85 is itself the gene mutated in ECTD4, so the HOXC13 and keratin forms of PHNED
          are linked as regulator and target within one pathway rather than being merely phenocopies.
