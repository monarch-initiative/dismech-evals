        publication: DOI:10.1111/exd.14469
        description: 'A spontaneous mouse mutation characterized as a terminal truncation of Hoxc13 and
          independently recreated by CRISPR/Cas9. It is the mechanistic outlier among the Hoxc13 animal
          models: the truncated transcript escapes nonsense-mediated decay, the truncated protein is present
          in follicles, and heterozygotes are affected - a semi-dominant, apparently dominant-negative
          behaviour unlike the recessive human pattern and unlike the heterozygous Hoxc13 knockout, which
          is unaffected.'
        modeled_mechanisms:
        - target: HOXC13 Transcription Factor Loss of Function
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: N/N homozygotes reproduce the cardinal ECTD9 appendage phenotype (generalized alopecia
            with abnormal nails), and the allele is a better practical model than the poorly viable Hoxc13
            knockout.
          limitations: The mechanism is not the human one. Human ECTD9 alleles act by nonsense-mediated
            decay, impaired DNA binding, or reduced protein stability, all recessive; the Naked allele
            instead escapes NMD and yields a persistent truncated protein that is pathogenic in heterozygotes.
            It therefore models the phenotype without modeling the loss-of-function route, and no dominant-negative
            HOXC13 allele has been reported in humans. N/N mice also have a short lifespan, which human
            patients do not.
          readouts:
