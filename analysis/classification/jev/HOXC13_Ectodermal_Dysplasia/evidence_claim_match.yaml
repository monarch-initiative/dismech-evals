      reference: PMID:23063621
      reference_title: Loss-of-function mutations in HOXC13 cause pure hair and nail ectodermal dysplasia.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that a whole-exon deletion is a real ECTD9 mechanism, which is what makes
        exon-level copy-number analysis necessary rather than optional.
