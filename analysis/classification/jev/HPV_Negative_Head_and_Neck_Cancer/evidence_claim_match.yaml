        context: []
      assertion_type: Environmental
      assertion:
        name: Ethanol Exposure
        description: Chronic alcohol consumption synergizes with tobacco to increase HNSCC risk multiplicatively.
          Alcohol acts as a solvent enhancing carcinogen penetration and is metabolized to acetaldehyde,
          a DNA-damaging agent. Ethanol is classified as a Group 1 carcinogen by IARC.
        notes: Named and bound for the chemical (ECTO:9000027, which involves CHEBI ethanol) rather than
          the drinking behaviour (ECTO:0001082) because the mechanism curated here is ethanol acting as
          a solvent and as an acetaldehyde source. Renamed from "Alcohol Consumption" so the binding is
          derivable from the entry's own name.
        exposure_term:
          preferred_term: exposure to ethanol
          term:
            id: ECTO:9000027
            label: exposure to ethanol
      selected_evidence:
        snippet: Smoking and alcohol independently increase the risk of both HPV-positive and HPV-negative
          HNSCC.
        supports: SUPPORT
    origin:
