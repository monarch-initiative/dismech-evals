        genetic_context:
          variant_origin: SOMATIC
        description: TP53 mutations occur in greater than 80% of HPV-negative HNSCC, representing the
          most common genetic alteration. Mutations are typically missense mutations in the DNA-binding
          domain caused by tobacco carcinogen-induced DNA adducts. Loss of p53 function eliminates cell
          cycle checkpoints and DNA damage repair.
        cell_types:
        - preferred_term: squamous epithelial cell
