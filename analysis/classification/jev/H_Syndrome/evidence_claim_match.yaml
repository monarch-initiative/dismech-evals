            name: hENT3 (SLC29A3) Nucleoside Transporter Deficiency
            description: Biallelic loss-of-function mutations in SLC29A3 abolish or impair the human equilibrative
              nucleoside transporter 3 (hENT3), a pH-dependent intracellular nucleoside/nucleobase transporter
              localized to lysosomal and mitochondrial membranes with affinity for adenosine. hENT3 normally
              moves nucleosides derived from lysosomal degradation of nucleic acids across the lysosomal
              membrane for salvage. Disease-associated mutations cause severe reductions or loss of nucleoside
              transport, compounded by mistrafficking and reduced stability of the mutant protein, most
              consequentially in the highly phagocytic, lysosome-rich monocyte-macrophage lineage where
              hENT3 is most abundantly expressed.
            biological_processes:
            - preferred_term: nucleoside transmembrane transport
              term:
                id: GO:1901642
                label: nucleoside transmembrane transport
              modifier: DECREASED
            - preferred_term: lysosomal transport
