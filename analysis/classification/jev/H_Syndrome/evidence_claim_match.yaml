        name: Nucleoside-Sensing TLR Activation and MAPK/Interferon Signaling
        description: Loss of hENT3 function activates nucleoside-sensing Toll-like receptors and downstream
          MAPK signaling, inducing cytokine secretion and inflammation; within the lysosome, TLR7 activation
          additionally drives type I interferon production. Affected patients show a high peripheral-blood
          interferon score. This positions H syndrome among the type I interferonopathies and links the
          otherwise germline (non-somatic) disorder to pathological MAPK-cascade activation, providing
          the rationale for MEK-inhibitor, JAK-inhibitor (baricitinib), and TLR7-directed (hydroxychloroquine)
          therapies aimed at the autoinflammatory component.
        biological_processes:
        - preferred_term: toll-like receptor signaling pathway
