  9a1e02ea40964b671e7669ae070e54233406c44a3464778e0b090f483fa5843d:
    claim:
      about:
        disease:
          name: H Syndrome
          disease_term:
            preferred_term: H syndrome
            term:
              id: MONDO:0011273
              label: H syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC29A3
        gene_term:
          preferred_term: SLC29A3
          term:
            id: hgnc:23096
            label: SLC29A3
        variant_origin: GERMLINE
        relationship_type: CAUSATIVE
        notes: 'Biallelic (homozygous or compound heterozygous) loss-of-function mutations in SLC29A3,
          encoding hENT3, cause H syndrome. Inheritance is autosomal recessive. Reported variants span
          the coding sequence and include missense (e.g., the recurrent c.1088G>A / p.Arg363Gln allele),
          frameshift, nonsense, start-loss, and exon-level deletion classes; mutation sites concentrate
          in the C-terminal exons. Most families are consanguineous, with population founder alleles in
          Arab, North African, Middle Eastern, and South Asian populations. SLC29A3 is loss-of-function-tolerant
          in heterozygotes (gnomAD LOEUF approximately 1.05), consistent with the recessive model - carriers
          are healthy. Expressivity is highly variable and genotype-phenotype discordant: the identical
          homozygous c.1088G>A allele produced classic H syndrome in some family members and cutaneous
          familial Rosai-Dorfman disease in another, implicating unidentified genetic-background modifiers.'
      selected_evidence:
        snippet: we report five new patients from a single family who present with phenotypes that associate
          features of H syndrome and Familial Rosai-Dorfman disease
        supports: SUPPORT
