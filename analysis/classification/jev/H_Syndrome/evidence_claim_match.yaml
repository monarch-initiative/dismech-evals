      assertion:
        discussion_id: hmm_hsyndrome_autophagy_stemcell_mouse
        prompt: Does the AMPK-mTOR-ULK autophagy defect and adult stem-cell deficit demonstrated in Slc29a3-null
          mice operate in human H syndrome, and does it account for the human multiorgan phenotype?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Autophagy and Adult Stem Cell Deficits
        rationale: The autophagy-regulated stem-cell-differentiation mechanism and its rescue by genetic/pharmacologic
          intervention are established in the Slc29a3-null mouse, but no human tissue confirmation exists.
          The mouse recapitulates the macrophage histiocytosis, yet whether the hematopoietic/mesenchymal
          stem-cell deficit drives the human endocrine, skeletal, and connective-tissue phenotype is unverified
          - evidence exists in a model, but translational validity to human disease is the open question.
        proposed_experiments:
        - experiment_id: exp_hsyndrome_patient_stemcell_autophagy
          name: Autophagic flux and AMPK-mTOR-ULK signaling in patient stem cells
          description: Assess autophagic flux and AMPK-mTOR-ULK pathway activity in patient-derived hematopoietic
            and mesenchymal stem/progenitor cells to test whether the mouse mechanism operates in human
            H syndrome.
        - experiment_id: exp_hsyndrome_ipsc_organoid_recapitulation
          name: Patient iPSC/organoid recapitulation of mouse stem-cell deficits
          description: Test whether the stem-cell-fate and tissue-integrity phenotypes reported in Slc29a3-null
            mice are reproduced in patient iPSC-derived organoid or stem-cell models.
      selected_evidence:
        snippet: Here, we identify adult stem cell deficits that drive ENT3-related abnormalities in mice.
        supports: SUPPORT
