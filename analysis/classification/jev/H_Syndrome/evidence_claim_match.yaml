        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: openq_hsyndrome_transport_to_phenotype
        prompt: How does loss of hENT3-mediated lysosomal/mitochondrial nucleoside transport mechanistically
          produce the pleiotropic H-syndrome phenotype (histiocyte proliferation, dermal fibrosis, insulin-dependent
          diabetes, hypogonadism, and hearing loss)?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#hENT3 (SLC29A3) Nucleoside Transporter Deficiency
        - pathophysiology#Histiocyte Activation and Tissue Infiltration
        - pathophysiology#Nucleoside-Sensing TLR Activation and MAPK/Interferon Signaling
        - pathophysiology#Impaired Autophagy and Adult Stem Cell Deficits
        rationale: Functional studies confirm that H-syndrome mutations abolish hENT3 nucleoside transport
          and destabilize the protein, and hENT3 is localized to lysosomes and mitochondria, but the 2010
          authors explicitly state that the precise connections between transporter dysfunction and the
          multiorgan pathophysiology remain unresolved. Two later mechanisms partially bridge this gap
          - lysosomal TLR7-driven type I interferon production (human) and AMPK-mTOR-ULK autophagy/adult-stem-cell
          deficits (mouse) - but how these unify the full endocrine, fibrotic, and sensorineural phenotype,
          and their relative contributions in human tissue, remain incompletely established.
      selected_evidence:
        snippet: the precise connections between hENT3 and the pathophysiology of these disorders remain
          unresolved
        supports: SUPPORT
