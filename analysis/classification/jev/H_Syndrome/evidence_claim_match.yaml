      assertion_type: Pathophysiology
      assertion:
        name: Histiocyte Activation and Tissue Infiltration
        description: hENT3 deficiency drives abnormal function, proliferation, and survival of monocyte-derived
          macrophages/histiocytes. Affected tissues are infiltrated by CD68-positive, CD163-positive,
          S100-variable, CD1a-negative (non-Langerhans) histiocytes admixed with lymphocytes and plasma
          cells. This mononuclear infiltrate, together with systemic autoinflammation and elevated inflammatory
          cytokines, underlies the systemic (hepatosplenomegaly, lymphadenopathy, fever) and local (cutaneous,
          endocrine) manifestations and places H syndrome in the R group of histiocytoses.
        cell_types:
        - preferred_term: CD68-positive non-Langerhans histiocyte
          term:
            id: CL:0000235
