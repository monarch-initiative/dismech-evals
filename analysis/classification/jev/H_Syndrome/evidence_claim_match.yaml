            id: GO:0032606
            label: type I interferon production
          modifier: INCREASED
      selected_evidence:
        snippet: We show that loss of function of ENT3 activates nucleoside-sensing toll-like receptors
          (TLR) and downstream MAPK signaling, inducing cytokine secretion and inflammation.
