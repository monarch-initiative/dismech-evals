      assertion:
        name: NKAP C-terminal Missense Variant
        biological_scale: MOLECULAR
        description: Hemizygous missense variants in NKAP, clustered in exons 8 and 9 encoding the conserved
          C-terminal (DUF926) region through which NKAP binds HDAC3 and post-catalytic spliceosomal proteins.
          Reported alleles include p.Arg330Cys, p.Arg330His, p.Arg333Gln, p.Ile337Thr and p.Arg361Gln.
          One proband carried an exon 4 variant (p.Arg204Ser) of uncertain significance, which, if confirmed,
          would widen the mutational spectrum beyond the C-terminal cluster.
        genes:
        - preferred_term: NKAP
          term:
            id: hgnc:29873
            label: NKAP
        molecular_functions:
        - preferred_term: transcription corepressor activity
          term:
            id: GO:0003714
            label: transcription corepressor activity
          modifier: DECREASED
        - preferred_term: histone deacetylase binding
          term:
            id: GO:0042826
            label: histone deacetylase binding
          modifier: DECREASED
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          description: 'Hemizygous missense alleles in males. The functional category is not established:
            transfected p.Arg330Cys lowers NKAP transcript but not protein and disturbs HDAC3 binding
            and intranuclear distribution, consistent with a partial loss of corepressor function rather
            than a null.'
      selected_evidence:
        snippet: These mutations are clustered in the C-terminal region of NKAP where NKAP interacts with
          HDAC3 and post-catalytic spliceosomal complex proteins.
        supports: SUPPORT
