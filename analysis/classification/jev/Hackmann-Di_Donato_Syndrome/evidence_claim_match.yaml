          with an N-terminal RS domain and a C-terminal DUF926 domain. All established disease variants
          are hemizygous missense changes in exons 8 and 9, within the C-terminal region that binds HDAC3
          and the post-catalytic spliceosome. The gene-disease relationship rests on a cohort of ten males
