      assertion_type: Inheritance
      assertion:
        name: X-linked recessive
        description: Hemizygous males are affected. Familial transmission from unaffected or much less
          severely affected heterozygous mothers has been documented in several families; the remaining
          cases in the original cohort were apparently de novo, and one pair of affected brothers born
          to an unaffected mother indicates maternal germline mosaicism, so an apparently de novo case
          still carries a recurrence risk. In a mouse model, females heterozygous for a deleterious Nkap
          allele show extreme skewing of X-chromosome inactivation against the mutant-bearing X, which
          offers a mechanism for the unaffected carrier state; the same phenomenon has unmasked haemophilia
          A in a human carrier of a disruptive NKAP variant.
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
      selected_evidence:
        snippet: Among these cases, evidence of familial transmission has been documented in five individuals
          from three unrelated families.
        supports: SUPPORT
