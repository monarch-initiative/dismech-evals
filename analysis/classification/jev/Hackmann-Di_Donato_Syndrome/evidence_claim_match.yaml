        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nkap_animal_alleles_vs_human_missense
        kind: HUMAN_MODEL_MISMATCH
        prompt: Both animal models carry alleles that truncate or disrupt Nkap (a C-terminal truncation
          in zebrafish; an N-terminal in-frame deletion in the mouse), whereas the human disease is caused
          by C-terminal missense variants that leave protein level unchanged. Do the model phenotypes
          reflect loss of the C-terminal interactions, or a null state the human alleles do not reach?
        rationale: Complete NKAP loss is lethal in mouse haematopoiesis and T cell development, which
          affected humans do not show, so the human alleles are at most hypomorphic for those functions.
          A knock-in of a patient allele would separate the two.
        attaches_to:
        - animal_models#nkap C-terminal truncation zebrafish
        - animal_models#Nkap mutant mouse (hemizygous males)
      selected_evidence:
        snippet: These data establish NKAP as one of a very small number of transcriptional regulators
          that is absolutely required for adult HSC maintenance and survival.
        supports: SUPPORT
        directness: INDIRECT
