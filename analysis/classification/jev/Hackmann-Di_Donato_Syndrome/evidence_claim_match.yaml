      assertion:
        name: Loss of NKAP-HDAC3 Corepressor Complex Function
        biological_scale: MOLECULAR
        description: NKAP is a transcriptional repressor that associates with histone deacetylase 3 and
          with the Notch corepressor complex, and it must bind HDAC3 to act in T cell maturation and haematopoietic
          stem cell survival. Mutant NKAP loses HDAC3 binding and mislocalises within the nucleus, so
          corepressor activity at NKAP target genes, including Notch targets, is expected to fall.
        molecular_functions:
        - preferred_term: transcription corepressor activity
          term:
            id: GO:0003714
            label: transcription corepressor activity
          modifier: DECREASED
        - preferred_term: histone deacetylase binding
          term:
            id: GO:0042826
            label: histone deacetylase binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: negative regulation of Notch signaling pathway
          term:
            id: GO:0045746
            label: negative regulation of Notch signaling pathway
