  a4733fd93e57b703e665ad79dd04381450092339c51b31ef86bfd11f91ce9365:
    claim:
      about:
        disease:
          name: Hackmann-Di Donato Syndrome
          disease_term:
            preferred_term: Hackmann-Di Donato syndrome
            term:
              id: MONDO:0026733
              label: intellectual developmental disorder, X-linked, syndromic, Hackmann-Di Donato type
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Nkap mutant mouse (hemizygous males)
        species: Mouse
        genotype: Nkap c.5_127del (p.Ala2_Gly43del), in-frame 123 bp deletion in exon 1 (N-terminal RS
          domain), hemizygous males
        publication: PMID:41828556
        description: CRISPR/Cas9-generated in-frame deletion in the N-terminal RS domain, not the C-terminal
          region mutated in humans. Hemizygous males show altered gait on CatWalk analysis, read by the
          authors as consistent with the hypotonia of affected humans, but normal weight and size and
          normal bone length and structure on X-ray, so the Marfanoid skeletal phenotype is not reproduced.
          Embryonic fibroblasts from mutant embryos proliferate poorly and senesce, and heterozygous females
          show skewed X-inactivation against the mutant allele.
        modeled_mechanisms:
        - target: Impaired Neurodevelopment
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Gait alteration is the only neurological readout and is interpreted as a hypotonia
            correlate.
          limitations: Gait parameters are an indirect proxy for hypotonia; cognition was not assessed,
            and the engineered allele is described as deleterious rather than matching a patient missense
            variant.
          readouts:
          - name: CatWalk XT gait parameters
            target: Impaired Neurodevelopment
            direction: ALTERED
            interpretation: Motor correlate of the hypotonia seen in affected males.
        - target: Reduced Cellular Proliferation and Senescence
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: CELLULAR
          description: Embryonic fibroblasts from this model are the source of the proliferation and senescence
            observation.
          limitations: The allele is an N-terminal in-frame deletion, so the result shows what a deleterious
            Nkap allele does to mouse cells, not what the human C-terminal missense alleles do; fidelity
            to the human disease is unknown.
        - target: Skewed X-Inactivation in Heterozygous Females
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Heterozygous females reproduce the skewed X-inactivation documented in a human
            NKAP carrier.
      selected_evidence:
        snippet: Gait analysis studies conducted in male mice hemizygous for mutant NKAP by the CatWalk
          XT system revealed significant alterations in gait parameters, consistent with hypotonia reported
          in human mutant NKAP patients.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
