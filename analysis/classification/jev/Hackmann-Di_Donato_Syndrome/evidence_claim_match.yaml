      assertion_type: Discussion
      assertion:
        discussion_id: nkap_missense_r_loop_genome_instability
        kind: KNOWLEDGE_GAP
        prompt: NKAP depletion causes R-loop accumulation, DNA damage and replication stress in cell lines
          through loss of the NKAP-HDAC3 complex. Do the hemizygous C-terminal missense alleles, which
          retain protein but lose HDAC3 binding, produce the same R-loop phenotype in patient cells?
        rationale: The patient transcriptome signature (downregulated long, exon-rich genes) is also what
          transcription-coupled R-loop stress would be expected to produce, and mutant embryonic fibroblasts
          proliferate poorly and senesce. Resolving this would decide whether the disorder is one of transcriptional
          corepression, of splicing, or of genome maintenance.
        attaches_to:
        - pathophysiology#Loss of NKAP-HDAC3 Corepressor Complex Function
        - pathophysiology#Reduced Cellular Proliferation and Senescence
      selected_evidence:
        snippet: In addition, NKAP prevents R-loop formation by maintaining RNA polymerase II pausing.
        supports: SUPPORT
        directness: INDIRECT
