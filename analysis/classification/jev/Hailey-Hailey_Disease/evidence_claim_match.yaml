        conforms_to: desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament
          Anchorage
        biological_scale: CELLULAR
        description: Cytoplasmic calcium regulation is impaired in patient keratinocytes and the normal
          epidermal calcium gradient - the rising calcium concentration from basal to granular layer that
          instructs keratinocyte differentiation and adhesion - is attenuated in patient skin in vivo.
          Because junctional proteins require calcium-dependent processing through the secretory pathway,
          the consequence is a failure of desmosome assembly rather than a defect in any desmosomal protein
          itself.
        cell_types:
