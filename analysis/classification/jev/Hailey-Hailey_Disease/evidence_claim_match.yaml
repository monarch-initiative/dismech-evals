      assertion:
        name: Ablative Laser Resurfacing
        description: 'Ablative resurfacing - carbon dioxide laser abrasion or erbium:YAG laser ablation
          - is used for recalcitrant intertriginous disease. It works on the same logic as excision: removing
          the affected epidermis lets it be replaced from adnexal structures, which are spared by the
          acantholytic process. It is a last-resort option, and the evidence is case-series level.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Surgical procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: 'In recalcitrant cases, further options including, invasive methods such as grenz ray
          therapy, carbon dioxide laser abrasion, and erbium: YAG laser ablation, dermabrasion, electron
          beam therapy, botulinum toxin, and full-thickness excision of affected skin with repair by split-thickness
          grafting have been reported as useful in treatment of HHD.'
        supports: SUPPORT
