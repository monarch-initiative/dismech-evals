      assertion_type: Definition
      assertion:
        name: Diagnostic definition of classic hairy cell leukemia
        definition_type: DIAGNOSTIC_CRITERIA
        description: Classic hairy cell leukemia is diagnosed by integrating hairy-cell morphology, the
          canonical HCL immunophenotypic score, marrow biopsy findings, and BRAF V600E testing.
        scope: Adult classic hairy cell leukemia
      selected_evidence:
        snippet: Diagnosis of HCL is based on morphological evidence of hairy cells, an HCL immunologic
          score of 3 or 4 based on the CD11C, CD103, CD123, and CD25 expression, the trephine biopsy which
          makes it possible to specify the degree of tumoral medullary infiltration and the presence of
          BRAFV600E somatic mutation.
        supports: SUPPORT
