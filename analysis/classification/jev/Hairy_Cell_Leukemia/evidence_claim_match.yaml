        name: Hairy Cell Leukemia Variant
        disease_term:
          preferred_term: hairy cell leukemia variant
          term:
            id: MONDO:0017600
            label: hairy cell leukemia variant
        description: HCL-v is an HCL-like mature B-cell leukemia that overlaps morphologically with classic
          HCL but does not share its canonical BRAF-driven immunophenotypic program or treatment sensitivity.
        distinguishing_features:
        - HCL-v lacks CD25 and usually lacks or only dimly expresses CD123, unlike classic HCL.
        - HCL-v is typically BRAF V600E negative.
        - Prominent nucleoli are common in HCL-v but uncommon in classic HCL.
        - HCL-v is resistant to traditional HCL therapy.
      selected_evidence:
        snippet: HCL-v was negative for both annexin A1 (100%) and BRAFV600E mutation (100%), in contrast
          to HCL (74% positive for annexin A1; 76% positive for BRAFV600E mutation). HCL-v is resistant
          to traditional HCL therapy, making accurate diagnosis imperative.
        supports: SUPPORT
