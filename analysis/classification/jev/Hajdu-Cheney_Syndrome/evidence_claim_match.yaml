        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NOTCH2 terminal-exon truncation escapes nonsense-mediated decay
        description: Heterozygous nonsense and frameshift mutations cluster in the last coding exon (exon
          34) of NOTCH2. Because they lie in the terminal exon, the mutant mRNAs escape nonsense-mediated
          decay and encode a truncated NOTCH2 protein that has lost the C-terminal PEST proteolytic-recognition
          (degradation) sequence.
        genes:
        - preferred_term: NOTCH2
          term:
            id: hgnc:7882
            label: NOTCH2
        biological_processes:
        - preferred_term: Notch signaling pathway
          term:
            id: GO:0007219
            label: Notch signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: All mutations cluster to the last coding exon of the gene, suggesting that the mutant
          mRNA products escape nonsense-mediated decay and that the resulting truncated NOTCH2 proteins
          act in a gain-of-function manner.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21378989
      reference_title: Truncating mutations in the last exon of NOTCH2 cause a rare skeletal disorder
        with osteoporosis.
      evidence_source: HUMAN_CLINICAL
      explanation: This directly supports terminal-exon clustering, escape from nonsense-mediated decay,
        and a gain-of-function mechanism.
