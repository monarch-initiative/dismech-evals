        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hfrs_ribavirin_efficacy_and_treatment_window
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is intravenous ribavirin genuinely effective in HFRS, and if so within what window - given
          that the single supporting randomised trial is from 1991 in China and that the same drug failed
          in cardiopulmonary-stage HCPS?
        attaches_to:
        - pathophysiology#Acute kidney injury with oliguric renal failure
        rationale: 'HFRS is unusual among viral haemorrhagic fevers in having a positive placebo-controlled
          antiviral trial: intravenous ribavirin reduced mortality sevenfold after adjustment and reduced
          the risk of entering the oliguric phase. But that trial was conducted in 1991 in a single country,
          the effect estimate is adjusted rather than crude, and a later randomised trial of the same
          drug in the cardiopulmonary stage of the New World syndrome found no trend towards benefit.
          Contemporary reviews continue to state that no specific effective antiviral treatment is available,
          so the field has not absorbed the 1991 result as practice-changing. Whether the discrepancy
          is about the drug, the syndrome, or the timing of administration is unresolved and directly
          determines whether an HFRS patient should be offered ribavirin.'
        proposed_experiments:
        - experiment_id: exp_hfrs_ribavirin_phase_stratified_rct
          name: Modern phase-stratified randomised trial of intravenous ribavirin in HFRS
          description: Conduct a multicentre randomised trial of intravenous ribavirin in HFRS stratified
            by clinical phase at enrolment (febrile versus hypotensive versus oliguric), against contemporary
            supportive care including renal replacement therapy, to test whether the 1991 benefit is real
            and whether it is confined to an early treatment window.
          decision_criterion: Benefit confined to febrile-phase enrolment would reconcile the positive
            1991 HFRS trial with the negative cardiopulmonary-stage HCPS trial as a treatment-window effect
            rather than a syndrome difference; a uniformly null result would retire ribavirin for HFRS.
      selected_evidence:
        snippet: Mortality was significantly reduced (sevenfold decrease in risk) among ribavirin-treated
          patients, when comparisons were adjusted for baseline risk estimators of mortality (P = .01;
          two-tailed).
        supports: SUPPORT
