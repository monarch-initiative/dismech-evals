          name: Hantavirus Hemorrhagic Fever with Renal Syndrome
          disease_term:
            preferred_term: hantavirus hemorrhagic fever with renal syndrome
            term:
              id: MONDO:0005784
              label: hantavirus hemorrhagic fever with renal syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hfrs_leak_mechanism_competing_models
        kind: CONTROVERSY
        status: OPEN
        prompt: Which proximal mechanism actually opens the endothelial barrier in HFRS - VEGF-driven
          VE-cadherin degradation, factor XII-dependent kallikrein-kinin activation with bradykinin release,
          or cytotoxic T cell attack on antigen-presenting endothelium - and are they sequential, parallel,
          or artefacts of different model systems?
        attaches_to:
        - pathophysiology#VEGF-driven VE-cadherin destabilisation of endothelial adherens junctions
        - pathophysiology#Factor XII-dependent kallikrein-kinin activation and bradykinin release
        - pathophysiology#Cytotoxic T cell attack on antigen-presenting endothelium
        - pathophysiology#Increased vascular permeability and capillary leak
        rationale: 'The three models are not merely underdetermined, they are in direct experimental tension.
          The VEGF/VE-cadherin model rests on infected endothelial monolayers; in a co-cultured endothelial/smooth-muscle
          vessel model, infected vessels retained integrity and showed no VE-cadherin degradation despite
          viral replication and the presence of VEGF, which is what motivated the kallikrein-kinin proposal.
          The T cell model has clinical correlations that run in opposite directions in HFRS and HCPS.
          The choice matters therapeutically: the models nominate anti-VEGF/VEGF-R2 blockade, a bradykinin
          B2 antagonist, and immunosuppression respectively - three interventions that are not interchangeable,
          and one of which (immunosuppression) could be harmful if the T cell response is protective.'
        proposed_experiments:
        - experiment_id: exp_hfrs_leak_model_head_to_head_3d_vessel
          name: Head-to-head test of the VEGF and kallikrein-kinin leak models in a three-dimensional
            vessel using an HFRS agent
          description: Run the VEGF/VE-cadherin and kallikrein-kinin readouts side by side in the same
            co-cultured endothelial/smooth-muscle vessel model, infected with an HFRS-causing agent (Hantaan
            or Puumala) rather than the HPS-associated Andes virus, so that virus identity and model dimensionality
            stop being confounded with each other. Measure secreted VEGF, junctional VE-cadherin, FXIIa/kallikrein
            activity, liberated bradykinin, and barrier impedance in the same wells.
          decision_criterion: If VE-cadherin degrades in the three-dimensional vessel with an Old World
            agent, the earlier negative result was virus-specific rather than model-specific; if bradykinin
            liberation but not VE-cadherin loss tracks the impedance fall, the kallikrein-kinin model
            is the better account of HFRS leak.
        - experiment_id: exp_hfrs_serial_leak_biomarkers_patient_cohort
          name: Serial plasma leak-mediator profiling across the five clinical phases of HFRS
          description: Measure plasma bradykinin, cleaved high-molecular-weight kininogen, VEGF, and soluble
            VE-cadherin serially in the same HFRS patient cohort, sampled by clinical phase, and test
            which mediator's rise precedes the onset of measured capillary leak and haemoconcentration.
          decision_criterion: The mediator whose rise consistently precedes rather than follows the leak
            onset is the candidate proximal driver in humans; a mediator that rises only after leak is
            established is downstream or epiphenomenal.
        - experiment_id: exp_hfrs_bradykinin_antagonist_rct
          name: Randomised trial of a bradykinin B2 receptor antagonist in severe HFRS
          description: Run an adequately powered randomised controlled trial of icatibant or an equivalent
            bradykinin B2 receptor antagonist in severe HFRS, with capillary leak and progression to the
            oliguric phase as primary endpoints. This is the interventional test that the existing single
            case report cannot provide.
          decision_criterion: A reduction in leak and in oliguric-phase entry would confirm the kallikrein-kinin
            arm as causal and therapeutically actionable in humans; a null result would leave the mechanism
            as an in-vitro finding without clinical reach.
      selected_evidence:
        snippet: In contrast to results obtained in monolayers of cultured EC, we found that despite viral
          replication in both cell types as well as the presence of VEGF, infected in vitro vessels neither
          lost integrity nor displayed evidence of VE-cadherin degradation.
        supports: SUPPORT
