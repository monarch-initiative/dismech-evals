      assertion_type: Pathophysiology
      assertion:
        name: Cytotoxic T cell attack on antigen-presenting endothelium
        biological_scale: CELLULAR
        description: 'A third, immunopathological model holds that hantavirus-specific cytotoxic T cells
          attack endothelial cells displaying viral antigen, and that this is what raises capillary permeability.
          The clinical correlation is direction-dependent and unresolved: T cell responses correlate positively
          with severity in HCPS but negatively with severity in HFRS in at least one report, so both too
          strong and too weak a T cell response may worsen disease.'
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        - preferred_term: endothelial cell of vascular tree
          term:
            id: CL:0002139
            label: endothelial cell of vascular tree
        biological_processes:
        - preferred_term: T cell mediated cytotoxicity
          modifier: INCREASED
          term:
            id: GO:0001913
            label: T cell mediated cytotoxicity
      selected_evidence:
        snippet: We previously hypothesized that increased capillary permeability observed in both hantavirus
          cardiopulmonary syndrome (HCPS) and hemorrhagic fever with renal syndrome (HFRS) may be caused
          by hantavirus-specific cytotoxic T cells attacking endothelial cells presenting viral antigens
          on their surface based on clinical observations and in vitro experiments.
        supports: SUPPORT
