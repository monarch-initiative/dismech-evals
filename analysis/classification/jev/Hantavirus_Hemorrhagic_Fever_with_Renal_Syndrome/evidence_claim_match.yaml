        biological_scale: MOLECULAR
        description: In the most widely cited model of hantavirus leak, infection raises secreted VEGF,
          and VEGF binding to VEGF-R2 dissociates the receptor from VE-cadherin and drives VE-cadherin
          internalisation and degradation, dismantling the adherens junction without killing the cell.
          Blocking VEGF-R2 activation prevents the infection-induced VE-cadherin loss.
        cell_types:
        - preferred_term: endothelial cell of vascular tree
          term:
            id: CL:0002139
            label: endothelial cell of vascular tree
        biological_processes:
        - preferred_term: vascular endothelial growth factor receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0048010
            label: vascular endothelial growth factor receptor signaling pathway
        - preferred_term: adherens junction organization
          modifier: DECREASED
          term:
            id: GO:0034332
            label: adherens junction organization
      selected_evidence:
        snippet: Here we report that increased secreted VEGF and concomitant decreased VE-cadherin are
          seen at early times postinfection of human primary lung endothelial cells with an HPS-associated
          hantavirus, Andes virus.
        supports: SUPPORT
