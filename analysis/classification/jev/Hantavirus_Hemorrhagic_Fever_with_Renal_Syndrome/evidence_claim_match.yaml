        - preferred_term: blood coagulation, intrinsic pathway
          modifier: INCREASED
          term:
            id: GO:0007597
            label: blood coagulation, intrinsic pathway
      selected_evidence:
        snippet: We show that incubation of factor XII (FXII), prekallikrein (PK), and high molecular
          weight kininogen (HK) plasma proteins with hantavirus-infected EC results in increased cleavage
          of HK, higher enzymatic activities of FXIIa/kallikrein (KAL) and increased liberation of bradykinin
          (BK).
        supports: SUPPORT
