      assertion_type: Pathophysiology
      assertion:
        name: Factor XII-dependent kallikrein-kinin activation and bradykinin release
        biological_scale: MOLECULAR
        description: A competing, non-mutually-exclusive model of the same leak. Factor XII binding and
          autoactivation are increased on the surface of hantavirus-infected endothelial cells; incubation
          with FXII, prekallikrein, and high-molecular-weight kininogen yields increased kininogen cleavage,
          higher FXIIa/kallikrein activity, and liberation of bradykinin, which dramatically increases
          endothelial permeability. Blocking bradykinin binding, FXIIa, or kallikrein prevents the permeability
          change.
        cell_types:
        - preferred_term: endothelial cell of vascular tree
          term:
            id: CL:0002139
            label: endothelial cell of vascular tree
        biological_processes:
        - preferred_term: kinin cascade
          modifier: INCREASED
          term:
