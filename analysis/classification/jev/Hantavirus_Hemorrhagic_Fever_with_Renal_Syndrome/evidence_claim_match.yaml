      assertion_type: Discussion
      assertion:
        discussion_id: hfrs_vegf_evidence_from_new_world_virus
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the VEGF/VE-cadherin leak mechanism, demonstrated with the HPS-associated Andes virus
          in human lung endothelial cells, actually operate in the Old World HFRS agents and in the renal
          microvasculature they injure?
        attaches_to:
        - pathophysiology#VEGF-driven VE-cadherin destabilisation of endothelial adherens junctions
        rationale: 'The canonical VEGF/VE-cadherin evidence in this entry is generated with Andes virus
          - a New World, HCPS-causing agent - in primary human lung endothelial cells. HFRS is caused
          by different viruses and its defining organ injury is renal, not pulmonary. Old and New World
          hantaviruses are known to differ in cell tropism, so importing the mechanism wholesale risks
          asserting a lung-derived, HPS-derived model as HFRS pathophysiology. This is a model-fidelity
          question rather than an absence of evidence: the experiments exist and are sound, but their
          translational reach to HFRS is the open question.'
        proposed_experiments:
        - experiment_id: exp_hfrs_vegf_in_renal_microvascular_endothelium
          name: VEGF induction and VE-cadherin loss in human renal microvascular endothelium infected
            with Old World hantaviruses
          description: Repeat the VEGF induction and VE-cadherin degradation measurements in primary human
            renal microvascular endothelial cells infected with Hantaan and Puumala virus, and compare
            them head to head with Andes virus in the same system, so that virus origin and vascular bed
            are varied independently.
          decision_criterion: Reproduction of VEGF induction and VE-cadherin loss with Old World agents
            in renal endothelium would license the mechanism for HFRS; failure would require the entry
            to demote this node to an HPS-specific model.
      selected_evidence:
        snippet: SNV readily infected pulmonary endothelial cells, while HTNV robustly amplified in endothelial
          cells, cardiomyocytes, and astrocytes.
        supports: SUPPORT
