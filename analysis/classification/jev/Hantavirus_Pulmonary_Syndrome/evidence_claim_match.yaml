      assertion_type: Transmission
      assertion:
        name: Person-to-person transmission of Andes virus
        description: Andes virus is the exception to the rule that hantaviruses do not pass between people.
          In a prospective Chilean household study, sex partners of index patients were at far higher
          risk than other household members, and person-to-person transmission was established in several
          secondary cases. This route is specific to ANDV and should not be generalized to Sin Nombre
          virus or the other New World species.
      selected_evidence:
        snippet: The risk of HCPS was 17.6% among sex partners of index case patients, versus 1.2% among
          other household contacts (P<.001).
        supports: SUPPORT
    origin:
      assertion_path: /transmission/1
      evidence_path: /transmission/1/evidence/1
