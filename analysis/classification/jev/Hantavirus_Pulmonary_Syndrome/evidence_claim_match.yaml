            label: Orthohantavirus
        description: Rodent-borne New World orthohantaviruses, including Sin Nombre virus and Andes virus,
          cause hantavirus pulmonary/cardiopulmonary syndrome after zoonotic respiratory exposure. "New
          World orthohantaviruses" is a geographical grouping of the American species rather than a taxon,
          so the binding here is the genus Orthohantavirus and the preferred_term carries the narrower
          sense. The genus also contains the Old World species that cause haemorrhagic fever with renal
          syndrome, which are not agents of this disease; the two species that are appear as their own
          records below.
      selected_evidence:
        snippet: Hantaviruses are zoonotically transmitted from rodents to humans through the respiratory
          route, with no currently approved antivirals or widely available vaccines.
        supports: SUPPORT
