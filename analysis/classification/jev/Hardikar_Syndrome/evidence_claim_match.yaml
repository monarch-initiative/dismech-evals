            term:
              id: MONDO:0012997
              label: cholestasis-pigmentary retinopathy-cleft palate syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extremely Skewed X-Chromosome Inactivation
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: All informatively tested individuals in the gene-discovery series showed extremely
          skewed X-chromosome inactivation. This is measured in accessible tissue, usually blood, and
          so constrains but does not establish which allele is expressed in liver, retina or any other
          affected organ; it is recorded here as a modifier of expression rather than as the initiating
          lesion.
        genes:
        - preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
        notes: No ontology term is bound on this node. HPO's inheritance subtree has no term for skewed
          X-inactivation as a cellular state, and the GO X-inactivation terms describe the normal developmental
          process rather than its skewing, so binding one with a modifier would assert a defect in the
          inactivation machinery that no source claims. Searched `runoak -i ols:go search 'l~X-inactivation'`
          and `runoak -i ols:hp search 'l~X-inactivation'`.
      selected_evidence:
        snippet: We additionally report the discovery of de novo pathogenic nonsense and frameshift variants
          in MED12 in these seven individuals and evidence of extremely skewed XCI in all patients with
          informative testing.
        supports: SUPPORT
        directness: DIRECT
