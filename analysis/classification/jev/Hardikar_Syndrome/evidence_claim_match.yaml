      assertion:
        discussion_id: hardikar_xci_tissue_distribution
        prompt: In which affected organs does X-inactivation skewing favour the intact MED12 allele, and
          does the direction of skewing explain why some individuals present with liver disease alone?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Extremely Skewed X-Chromosome Inactivation
        rationale: 'Skewed X-inactivation was found in every informatively tested individual, so it is
          a real and consistent feature rather than an incidental one. What it cannot do, measured in
          blood, is say which allele is active in liver, retina, palate or aorta. This matters for a specific
          clinical observation: at least one reported infant presented with severe hepatobiliary disease
          and few other anomalies, which organ-specific skewing is an obvious candidate to explain and
          which nothing currently tests. Settling it needs allele-specific expression in affected tissue,
          which for most of these organs means post-mortem or explant material.'
      selected_evidence:
        snippet: Unlike most previously reported cases, the predominant and early manifestation in our
          case was severe hepatobiliary disease with limited additional anomalies, suggesting possible
          phenotypic variability within the MED12-related Hardikar syndrome spectrum.
        supports: SUPPORT
        directness: INDIRECT
