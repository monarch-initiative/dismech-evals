        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        inheritance:
        - name: X-linked Dominant
        notes: 'MED12 encodes the scaffold subunit of the Mediator kinase module and sits at Xq13.1. The
          allele class is what assigns a MED12 variant to this disorder rather than to the rest of the
          series: truncating variants in females cause Hardikar syndrome, constitutive missense variants
          cause the male intellectual disability syndromes, and somatic missense variants drive uterine
          leiomyoma. A missense variant should not be classified as Hardikar syndrome on phenotype alone.

          No ClinGen gene-disease validity assertion is recorded here. ClinGen''s Definitive assertion
          for MED12 (CGGV, 2025-10-15) is against MONDO:0100000 MED12-related intellectual disability
          syndrome, which is not this entry''s disease term and is not an exactMatch mapping of it, so
          copying that tier onto this record would attribute a classification to a pair ClinGen did not
          classify.'
        variants:
        - name: MED12 c.3868-5C>G
          description: De novo intronic variant reported in an infant with a predominantly hepatobiliary
            presentation. Its predicted splice-acceptor effect was not tested at the RNA or protein level
            and its own authors retained a variant-of-uncertain-significance classification, so it is
            recorded here as a candidate allele and not as evidence that splice disruption is an established
            mechanism.
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          gene:
            preferred_term: MED12
            term:
              id: hgnc:11957
              label: MED12
      selected_evidence:
        snippet: We propose a fifth, female-specific phenotype for MED12, and suggest that nonsense and
          frameshift loss-of-function MED12 variants in females cause HS.
