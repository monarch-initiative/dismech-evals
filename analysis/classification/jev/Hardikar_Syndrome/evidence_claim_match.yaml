      assertion_type: Pathophysiology
      assertion:
        name: MED12 Truncating Loss of Function
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'De novo heterozygous nonsense, frameshift or splice-site variants in MED12 remove
          functional protein from one X-linked allele. This allele class is what distinguishes Hardikar
          syndrome from the rest of the MED12 series: the hemizygous male syndromes arise from recurrent
          missense alleles, and somatic missense variants in the same gene drive uterine leiomyoma.'
        genetic_context:
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Nonsense and frameshift alleles predicted to trigger nonsense-mediated decay, plus
            splice-site alleles added by the 2024 cohort.
        genes:
        - preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
      selected_evidence:
        snippet: We propose a fifth, female-specific phenotype for MED12, and suggest that nonsense and
          frameshift loss-of-function MED12 variants in females cause HS.
        supports: SUPPORT
        directness: DIRECT
