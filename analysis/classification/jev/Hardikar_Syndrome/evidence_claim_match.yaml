  faa599522f2100a9d328dac73fee3747e64b859af79e583f40b6cf0d5325e9ab:
    claim:
      about:
        disease:
          name: Hardikar Syndrome
          disease_term:
            preferred_term: Hardikar syndrome
            term:
              id: MONDO:0012997
              label: cholestasis-pigmentary retinopathy-cleft palate syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Primary Ciliogenesis
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: MED12 expression rises about two-fold in cells induced to form primary cilia and
          falls by about half during ciliary disassembly, and its knockdown reduces the ciliated fraction
          without shortening cilia. The reduction is not explained by cells cycling faster, since knockdown
          also halves proliferation. This places Hardikar syndrome partly within ciliopathy-spectrum biology,
          which is where its retinopathy, biliary dysgenesis and fibrotic liver disease overlap clinically.
        biological_processes:
        - preferred_term: non-motile cilium assembly
          term:
            id: GO:1905515
            label: non-motile cilium assembly
          modifier: DECREASED
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        notes: Bound to GO:1905515 non-motile cilium assembly rather than the broader GO:0060271 cilium
          assembly, because the experiments are in serum-starved retinal pigment epithelial cells assaying
          the primary cilium, and the source states that a transcriptional program for primary ciliogenesis
          specifically had not previously been described. Cell type is recorded as the RPE line the measurements
          were made in; no patient-cell atlas establishes which cell types lose cilia in affected organs.
      selected_evidence:
        snippet: Serum-starved RPE cells undergoing ciliogenesis had a 2-fold increase in MED12 expression
          compared to cells treated with complete medium
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39045790
