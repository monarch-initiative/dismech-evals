            biological_scale: MOLECULAR
            mechanism_confidence: ESTABLISHED
            description: MED12 is the scaffold subunit of the four-part Mediator kinase module (MED12,
              MED13, CCNC, CDK8), a dissociable regulatory cap on core Mediator. Reduced MED12 lowers
              the module's contribution to transcriptional regulation, including MED12's own interactions
              with chromatin and transcription factors.
            genes:
            - preferred_term: MED12
              term:
                id: hgnc:11957
                label: MED12
            molecular_functions:
            - preferred_term: transcription coregulator activity
              term:
                id: GO:0003712
                label: transcription coregulator activity
              modifier: DECREASED
            biological_processes:
            - preferred_term: transcription by RNA polymerase II
              term:
                id: GO:0006366
                label: transcription by RNA polymerase II
              modifier: DYSREGULATED
            notes: Bound to GO:0003712 transcription coregulator activity rather than its child GO:0003713
              transcription coactivator activity. Both are live and both are already used elsewhere in
              the KB, but the CDK8 kinase module has activating and repressive roles in transcription,
              so coactivator would assert a direction the module does not uniformly have. MED12 itself
              is the module's scaffold and carries no catalytic activity, so the coregulator term is the
              protein-level function that reduced MED12 dosage lowers; the RNA polymerase II process term
              below is the cell-level consequence.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired Primary Ciliogenesis
        causal_link_type: DIRECT
        description: MED12 is required to sustain primary ciliation; its loss reduces the proportion of
          ciliated cells.
      selected_evidence:
        snippet: siRNA-mediated MED12 knockdown in RPE cells reduced percent ciliated cells by 15% without
          affecting ciliary length
        supports: SUPPORT
        directness: DIRECT
