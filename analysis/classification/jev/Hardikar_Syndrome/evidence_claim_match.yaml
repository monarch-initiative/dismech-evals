        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hardikar_organ_specific_lesion
        prompt: Which cell types lose primary cilia, Hedgehog output or YAP/TEAD output in each affected
          organ, and when during development?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Developmental Organogenesis
        rationale: 'Every molecular measurement behind this entry''s mechanism was made in a retinal pigment
          epithelial cell line by siRNA knockdown. That establishes that MED12 loss reduces ciliation
          and Hedgehog and YAP output in a cell, and it does not establish which of the malformed organs
          each defect accounts for, nor whether the relevant window is the same for the biliary tree,
          the palate, the retina and the aorta. There is no patient-cell atlas for this syndrome, and
          no patient-derived line has been profiled. The authors themselves name the experiment that would
          close this: interrogation of ciliogenesis and YAP signaling, with unbiased transcriptomics and
          proteomics, in fibroblast lines from unaffected relatives, individuals with Hardikar syndrome,
          and individuals with MED12-related intellectual disability.'
      selected_evidence:
        snippet: To evaluate a role for MED12 in ciliogenesis, retinal pigment epithelial (RPE) cells,
          an established cell model for the study of ciliopathy-spectrum disease, were serum starved for
          24 hours to promote ciliogenesis or were grown in complete medium (control) and MED12 expression
          was evaluated by quantitative PCR (qPCR).
        supports: SUPPORT
        directness: DIRECT
