      assertion_type: Pathophysiology
      assertion:
        name: Impaired YAP-TEAD Transcriptional Output
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'MED12 knockdown lowers expression of the YAP target genes CTGF and CYR61 and reduces
          TEAD-responsive reporter activity. The effect is not explained by less YAP protein: YAP mRNA
          rises and phosphorylated YAP falls, which the authors read as attempted compensation. Their
          model is that MED12 directly enhances YAP/TEAD-mediated transcription.'
        biological_processes:
        - preferred_term: YAP/TEAD-mediated gene transcription
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
        cellular_components:
        - preferred_term: TEAD-YAP complex
          term:
            id: GO:0140552
            label: TEAD-YAP complex
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        notes: 'Deliberately not bound to GO:0035329 hippo signaling. That term denotes the Hippo kinase
          cascade, which *inhibits* YAP, so attaching it with a DECREASED modifier would assert the opposite
          of the source: here YAP/TEAD transcriptional output falls while phosphorylated YAP, the product
          of that cascade, also falls. Searched `runoak -i ols:go search ''l~Hippo''` (returns GO:0035329
          and its regulation children), `l~TEAD` (returns only the component GO:0140552) and `l~transcription
          coactivator activity` (no hits). GO has no biological-process term for YAP/TEAD-driven transcription,
          so the process slot carries the broader RNA polymerase II regulation term with the specific
          claim in `preferred_term`, and the YAP/TEAD identity is kept queryable through the GO:0140552
          cellular component.'
      selected_evidence:
        snippet: These data are most consistent with a model in which MED12 directly enhances YAP/TEAD-mediated
          gene transcription.
        supports: SUPPORT
        directness: DIRECT
