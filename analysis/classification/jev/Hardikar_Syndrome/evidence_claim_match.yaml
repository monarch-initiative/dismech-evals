            term:
              id: MONDO:0012997
              label: cholestasis-pigmentary retinopathy-cleft palate syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hardikar_med12_hedgehog_direction
        prompt: Does MED12 promote or inhibit Hedgehog signaling, and does the answer depend on whether
          the cell is ciliated?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Hedgehog Pathway Activation
        rationale: 'The 2024 Hardikar cohort found that MED12 knockdown abolishes agonist-induced GLI1
          induction, which makes MED12 a positive regulator of Hedgehog signaling. Earlier work reported
          the opposite, that MED12 inhibits Hedgehog, and the authors flag the contradiction themselves
          rather than leaving it implicit. Their proposed explanations are that their experiments were
          performed in serum-free conditions in which cells are ciliated, and that MED12 may have a cilium-independent
          effect on Hedgehog that the earlier studies measured and theirs did not.

          This is not only an external disagreement. dismech already encodes the inhibitory direction
          for a different MED12 allele: the FG syndrome entry carries a pathophysiology node for derepression
          of GLI3-dependent Sonic Hedgehog target transcription, which asserts that MED12 normally restrains
          Hedgehog output. Both entries may be right, because the alleles differ - FG syndrome is the
          recurrent p.R961W missense that impairs MED12-CDK8 association, while this entry''s alleles
          are truncating - but the two directions should not be asserted side by side in the knowledge
          base without the tension being recorded. Resolving it bears on whether the two arms of the MED12
          series share a mechanism or merely a gene.'
      selected_evidence:
        snippet: This contrasts with our data, which suggests that MED12 promotes hedgehog signaling.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
