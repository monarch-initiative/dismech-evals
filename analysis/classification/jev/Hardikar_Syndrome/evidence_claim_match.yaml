      assertion_type: Prevalence
      assertion:
        population: Reported cases worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'Literature-ascertained case count, not a measured prevalence. Seven molecularly characterized
          females in the 2021 gene-discovery series, eleven further individuals in the 2024 cohort, and
          34 cases counted as previously reported by a 2026 review. Incidence, prevalence, penetrance
          and carrier frequency are all unknown.

          This is a statement about population occurrence only. It is not a claim that no phenotype denominator
          exists: Table 1 of PMID:39045790 is a per-individual phenotype table over 22 molecularly confirmed
          females and carries a fraction on every row, and the phenotype `frequency` bands in this entry
          are derived from it.'
      selected_evidence:
        snippet: Only 34 cases have been reported to date, and most exhibit multiple congenital anomalies.
        supports: SUPPORT
        directness: DIRECT
