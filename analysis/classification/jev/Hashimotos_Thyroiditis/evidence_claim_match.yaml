  8a7f6f62891e9fcc15e920647ac31c162bad157eb9741a38eb381a9fff20fafa:
    claim:
      about:
        disease:
          name: Hashimoto's Thyroiditis
          disease_term:
            preferred_term: Hashimoto thyroiditis
            term:
              id: MONDO:0007699
              label: Hashimoto thyroiditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hepatitis C Virus-Associated Thyroid Immune Activation
        description: The specific virus with human evidence here is hepatitis C virus (HCV; chronic HCV
          infection, MONDO:0005354), which is associated with thyroid autoimmunity and hypothyroidism.
          Molecular mimicry between viral and thyroid antigens and bystander activation of autoreactive
          lymphocytes are the usual mechanistic proposals, but the cited evidence is an epidemiological
          association, and interferon-based antiviral therapy for HCV is itself thyrotoxic, which confounds
          it. This HCV-associated immune-activation state is the intermediate node between the HCV-infection
          exposure and the loss of tolerance.
        role: trigger
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: Defense response to virus
          term:
            id: GO:0051607
            label: defense response to virus
        notes: The evidence here is specific to hepatitis C virus. Other viruses (EBV, HTLV-1, parvovirus
          B19, enteroviruses, and SARS-CoV-2) have been proposed as thyroid-autoimmunity triggers but
          are not substantiated in the cited source and so are not asserted as nodes. IFN-alpha therapy
          for chronic HCV is itself associated with thyroid dysfunction, confounding the HCV-autoimmunity
          association.
      selected_evidence:
        snippet: Many studies showed that HCV is associated with thyroid autoimmunity and hypothyroidism,
          in patients with chronic HCV hepatitis (CHC); a significant link has been shown also between
          HCV-related mixed cryoglobulinemia and risk for GD.
        supports: SUPPORT
