    evidence_metadata:
      reference: PMID:41748903
      reference_title: Genome-wide association analyses of autoimmune hypothyroidism reveal autoimmune
        and thyroid-specific contributions and an inverse relationship with cancer risk.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Substantiates refinement (3) in the notes above, which until now was asserted only
        in prose. The susceptibility architecture behind this hypothesis is far more polygenic than the
        HLA-DR3/DR5, CTLA4 and PTPN22 loci the description names: 418 independent genome-wide significant
        signals in 81,718 cases. The same study reports coding variants in LAG3, ZAP70 and TG among the
        lead signals, which converges with the LAG3 variant already curated in this entry from an independent
        source.'
