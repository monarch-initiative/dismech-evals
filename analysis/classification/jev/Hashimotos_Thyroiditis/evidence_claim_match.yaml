      assertion_type: Pathophysiology
      assertion:
        name: Thyroglobulin Hyperiodination and Neoantigen Formation
        description: Excess iodide drives heavier iodination of thyroglobulin during hormone synthesis,
          and the more heavily iodinated protein carries altered epitopes that are more immunogenic than
          lightly iodinated Tg. This iodine-dependent neoantigen state is the proximate biochemical step
          through which chronic iodine excess presents modified self-antigen to the immune system, and
          is the intermediate node inserted between the iodine-excess exposure and the loss of tolerance.
        role: trigger
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: Thyroid Follicular Cell
          term:
            id: CL:0002258
            label: thyroid follicular cell
        biological_processes:
        - preferred_term: Thyroglobulin iodination
          term:
            id: GO:0006590
            label: thyroid hormone generation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Chronic exposure to excess iodine intake induces autoimmune thyroiditis, partly because
          highly iodinated thyroglobulin (Tg) is more immunogenic.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
