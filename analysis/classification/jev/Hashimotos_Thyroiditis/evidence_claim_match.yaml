      assertion_type: Phenotype
      assertion:
        name: Vitamin D Deficiency
        category: Nutritional
        description: Decreased circulating vitamin D (HP:0100512) modeled here as an upstream, modifiable
          risk state rather than a manifestation of the thyroid disease. As a deficiency state it is a
          convergence point reachable by several routes - reduced dietary intake, reduced cutaneous (UVB)
          synthesis, or impaired intestinal absorption (relevant in HT given its comorbidity with autoimmune
          gastritis and celiac disease). Only the intake/synthesis route is currently wired in as an evidenced
          edge. It is consistently observed at lower levels in HT patients; the causal direction is uncertain
          (see notes).
        phenotype_term:
          preferred_term: Vitamin D deficiency
          term:
            id: HP:0100512
            label: Decreased circulating vitamin D concentration
        notes: 'HP:0100512 is bound here as an upstream risk state, not a manifestation: because this
          phenotype has a sequelae edge into a pathophysiology node, the KGX/HPOA exporters export it
          as a direction-neutral `MONDO:0007699 biolink:associated_with HP:0100512` rather than `has_phenotype`.
          (This supersedes the earlier workaround of binding MONDO:0100471 to dodge the has_phenotype
          inversion; the direction-aware exporter makes the HP binding correct.) The association is cross-sectional
          and may be bidirectional; part of the nutritional-risk literature (PMID:28290237) attributes
          low vitamin D to the autoimmune process itself, including vitamin D receptor dysfunction.'
      selected_evidence:
        snippet: There is extensive literature confirming that vitamin D levels are significantly lower
          in HT patients compared to healthy people.
        supports: SUPPORT
