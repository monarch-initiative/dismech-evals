        notes: 'On the immune-checkpoint-inhibitor parallel: the 2026 openscientist hypothesis-search
          report presents it as validation of this node "via the exact pathways described in the canonical
          model". The transcriptomic study it cites (PMID:37445704) does not support that reading. Apoptosis
          pathways were similarly activated relative to interleukin 1 beta and interferon gamma treated
          human thyroid cells, but the authors'' own conclusion is that checkpoint-inhibitor thyroid disease
          represents a novel form of immune thyroid disease with distinct underlying pathways and upstream
          regulators. The parallel is real but partial, and it is drawn from a murine model. The clinical
          arm is stronger and is separately reported: in a prospective series, 92.9% of PD-1-inhibitor
          destructive thyroiditis cases were TPOAb or TgAb positive (PMID:39216687).'
