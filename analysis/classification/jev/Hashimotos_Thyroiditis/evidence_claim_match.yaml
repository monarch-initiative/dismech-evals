      assertion:
        name: Thyroidal Oxidative Stress from Selenoprotein Insufficiency
        description: Thyroid hormone synthesis generates hydrogen peroxide at the apical thyrocyte surface,
          which selenoprotein glutathione peroxidases normally detoxify. When selenium supply is low these
          selenoenzymes are limiting, so peroxide accumulates and oxidatively injures thyroid follicular
          cells. This oxidative thyrocyte injury and antigen release is the mechanism node downstream
          of the "Selenium Deficiency" state and upstream of the loss of tolerance.
        role: trigger
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Thyroid Follicular Cell
          term:
            id: CL:0002258
            label: thyroid follicular cell
        biological_processes:
        - preferred_term: Peroxide detoxification by glutathione peroxidase
          term:
            id: GO:0042744
            label: hydrogen peroxide catabolic process
          modifier: DECREASED
        - preferred_term: Response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
        chemical_entities:
        - preferred_term: hydrogen peroxide
          term:
            id: CHEBI:16240
            label: hydrogen peroxide
          modifier: INCREASED
      selected_evidence:
        snippet: The data indicate an increased incidence of TPO-Ab seroconversion with low Se supply
          and support the hypothesis that Se deficiency contributes to HT as a modifiable risk factor.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
