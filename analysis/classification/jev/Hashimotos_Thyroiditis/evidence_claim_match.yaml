        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ht_seronegative_effector_mechanism
        prompt: By what effector mechanism is the thyroid destroyed in patients who have the ultrasound
          and functional picture of Hashimoto's thyroiditis but no detectable anti-TPO or anti-thyroglobulin
          antibodies?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Autoimmune Thyroid Destruction
        - biochemical#Anti-TPO Antibodies
        rationale: 'Seronegative disease is a real and reproducible phenotype in both children and adults,
          and it is consistently milder. It qualifies the entry''s autoantibody-centred serology without
          refuting it, because the antibodies plausibly amplify severity rather than being required for
          destruction. What is missing is any positive account of the effector mechanism in these patients:
          whether they carry sub-threshold or intrathyroidal-only antibody, whether the infiltrate is
          T-cell dominant without germinal-centre B-cell help, or whether some of them are not autoimmune
          at all. The paediatric series raises the last possibility directly, noting its seronegative
          group is clinically superimposable on overweight children with the same ultrasound changes and
          no antibodies, a reversible condition. Deep immune profiling of seronegative thyroid tissue
          against seropositive and healthy controls, with B-cell and T-cell receptor repertoire sequencing,
          would separate these.'
      selected_evidence:
        snippet: Prevalence of seronegative Hashimoto's thyroiditis in this cohort was 12.3% (19/154).
        supports: SUPPORT
