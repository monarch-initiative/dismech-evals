        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ht_no_disease_modifying_therapy
        prompt: Can any intervention halt or reverse the autoimmune process in Hashimoto's thyroiditis,
          as opposed to replacing the hormone the destroyed gland no longer makes or lowering an antibody
          titre?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        rationale: Every treatment curated in this entry is either replacement, which bypasses the lesion,
          or a biomarker-level modulator. Selenium lowers thyroid peroxidase antibody but a 412-patient
          double-blind trial already recorded here found no quality-of-life benefit over placebo, and
          a GRADE overview rates the antibody effect itself as low certainty, so the biomarker-outcome
          dissociation is documented rather than hypothetical. The one report of genuine disease modification
          is a single patient whose antibodies normalised and who came off levothyroxine while taking
          a JAK inhibitor for an unrelated indication. That is a lead, not a therapy. Resolution needs
          a randomised trial in early seropositive disease with preservation of thyroid function as the
          primary endpoint, not antibody titre.
      selected_evidence:
        snippet: Although selenium supplementation might reduce TPO-Ab levels at 3 and 6 months and Tg-Ab
          levels at 3 and 6 months in the non-LT4-treated population, this was based on a low certainty
          of evidence.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37513612
      reference_title: 'The Effects of Selenium Supplementation in the Treatment of Autoimmune Thyroiditis:
        An Overview of Systematic Reviews.'
      evidence_source: HUMAN_CLINICAL
      explanation: An overview of six systematic reviews covering 75 randomised trials rates the certainty
        of even the antibody-lowering effect as low, which is why selenium cannot be counted as disease-modifying
        therapy.
