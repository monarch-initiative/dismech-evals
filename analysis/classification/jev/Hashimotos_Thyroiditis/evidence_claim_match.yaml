      assertion:
        discussion_id: question_ht_igg4_thyroiditis_entity_status
        prompt: Is IgG4 thyroiditis a histopathological variant of Hashimoto's thyroiditis or a thyroid
          manifestation of systemic IgG4-related disease that should be modelled separately?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - disease#Hashimoto's Thyroiditis
        rationale: A surgical series separating 105 Hashimoto cases by IgG4 immunostaining found the IgG4
          group differs on age, sex ratio, rate of progression, autoantibody level, and histology, with
          a fibrosis-dominant picture that the T-cell and autoantibody destruction model curated in this
          entry does not explain well. The same study rules out the simplest reconciliation, that IgG4
          thyroiditis is just the fibrous variant, since the two groups only partially overlap. This entry
          currently has no has_subtypes block and treats Hashimoto's thyroiditis as a single phenotype,
          so the question is recorded here rather than resolved by inventing a subtype. Deciding it needs
          comparative multi-omics of IgG4 thyroiditis against classical Hashimoto and against systemic
          IgG4-related disease. Note the reported proportion is a fraction of a thyroidectomy series,
          so it cannot be carried over as a prevalence in the general Hashimoto population.
      selected_evidence:
        snippet: IgG4 thyroiditis was associated with a patient population of a younger age, a lower female-to-male
          ratio, rapid progression, higher levels of thyroid autoantibodies, subclinical hypothyroidism,
          and diffuse sonographic echogenicity.
        supports: SUPPORT
