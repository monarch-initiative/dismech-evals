  84c7dd05eaec77366f527f4fd2d344ea5fb3b1bd6e6f8d5108c1db28c9b7002b:
    claim:
      about:
        disease:
          name: Hashimoto's Thyroiditis
          disease_term:
            preferred_term: Hashimoto thyroiditis
            term:
              id: MONDO:0007699
              label: Hashimoto thyroiditis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ht_exosome_release_inhibition_translation
        prompt: Does blocking exosome release, or supplying engineered mesenchymal stem cell-derived exosomes,
          restore immune homeostasis in human Hashimoto's thyroiditis, or is the effect confined to the
          cell and animal systems it has been shown in?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Immune Tolerance to Thyroid Antigens
        - pathophysiology#Th17/Treg Imbalance
        - pathophysiology#NF-κB-IL-6 Signaling Pathway Activation
        - treatments#
        rationale: 'The entry now curates three exosome-dependent mechanisms upstream of thyrocyte destruction,
          and none of the four treatments it lists acts on any of them: levothyroxine replaces the missing
          hormone, and selenium and vitamin D are supplements with weak or absent disease-modifying effect.
          That makes exosome release a stated therapeutic direction for a disease whose curated therapy
          is entirely downstream of the lesion, which is why the gap is worth recording rather than leaving
          implicit. What is missing is any human evidence. GW4869 is a neutral sphingomyelinase inhibitor
          used as a laboratory tool for blocking exosome secretion; it has no approved clinical indication,
          no trial in thyroid autoimmunity, and no NCIT clinical-intervention identity in this disease,
          so it is deliberately not curated as a treatment here. Engineered MSC-derived exosomes are at
          the same stage. Resolving this needs, at minimum, a demonstration that exosome blockade changes
          thyroid autoimmunity in an immunocompetent in vivo model of HT rather than in cell co-culture,
          followed by a safety-and-target-engagement study in humans — exosome secretion is constitutive
          and not thyroid-specific, so the plausible off-target cost of inhibiting it systemically is
          itself unquantified.'
        notes: 'Also the home of a deferred design question raised in review of PR #12110: whether exosome-mediated
          intercellular signalling should become a pathophysiology node in its own right, with downstream
          edges into the three nodes listed in attaches_to. It would make the mechanism queryable and
          would give this therapeutic direction a target_mechanisms anchor, which it currently lacks.
          Deferred rather than done here because the cited review is a single secondary source: it establishes
          that exosomes carry these three cargoes, but a node asserting exosome signalling as a discrete
          causal step should rest on the primary studies, and building it would also mean deciding whether
          one node covers all three cargoes or each cargo is its own. Recorded so the option is not lost.'
      selected_evidence:
        snippet: Therapeutically, inhibition of exosome release (e.g., GW4869) and the use of engineered
          mesenchymal stem cell-derived exosomes demonstrate promising potential for restoring immune
          homeostasis.
        supports: SUPPORT
    origin:
