              label: Hashimoto thyroiditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Immune Tolerance to Thyroid Antigens
        description: 'Susceptibility variants in T-cell regulatory and immune-checkpoint genes (HLA class
          II, CTLA4, PTPN22, LAG3) act together with environmental triggers (iodine excess, selenium/vitamin
          D status, viral infection) to break self-tolerance to thyroid peroxidase and thyroglobulin,
          the initiating lesion that licenses autoreactive T- and B-cell responses against the thyroid.
          A rare LAG3 start-codon variant that lowers the inhibitory checkpoint LAG-3 exemplifies how
          impaired T-cell down-regulation predisposes to autoimmune thyroid disease.

          '
        role: trigger
        genes:
        - preferred_term: CTLA4
          term:
            id: hgnc:2505
            label: CTLA4
        - preferred_term: PTPN22
          term:
            id: hgnc:9652
            label: PTPN22
        - preferred_term: LAG3
          term:
            id: hgnc:6476
            label: LAG3
      selected_evidence:
        snippet: Multiomics analysis yields 235 candidate genes outside the MHC-region and the findings
          highlight the importance of genes involved in T-cell regulation.
        supports: SUPPORT
