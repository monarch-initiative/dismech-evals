      reference_title: 'Increased Incidence of Hashimoto Thyroiditis in Selenium Deficiency: A Prospective
        6-Year Cohort Study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Prospective cohort evidence that low selenium status raises the incidence of thyroid
