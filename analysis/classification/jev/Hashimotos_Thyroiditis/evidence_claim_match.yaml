      assertion:
        discussion_id: emerging_ht_sex_biased_plasma_b_cell_homing
        prompt: Does constitutive CXCL13-CXCR5-driven plasma B cell homing to the female thyroid explain
          the marked female predominance of Hashimoto's thyroiditis?
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        attaches_to:
        - pathophysiology#Lymphocytic Infiltration
        rationale: The entry records a female-predominant autoimmune disease without offering any mechanism
          for the sex bias. A 2024 study of thyroids deliberately screened to exclude clinical autoimmune
          disease found sex differences in plasma-B-cell gene programmes and localised the recruitment
          to the CXCL13-CXCR5 axis by single-cell and spatial transcriptomics. If a B-cell-permissive
          niche is already present in the healthy female thyroid, then the sex bias would sit upstream
          of everything curated here, in the baseline tissue state rather than in the disease process.
          Recorded as an emerging hypothesis rather than wired as a causal edge, because the study is
          in non-diseased tissue and the link to disease incidence is the authors' own inference, framed
          as a possible contribution.
      selected_evidence:
        snippet: Single-cell RNA-seq and spatial transcriptomic analyses further revealed that the CXCL13-CXCR5
          signaling axis plays a pivotal role in recruiting and organizing plasma B cells within the thyroid
          tissue.
        supports: SUPPORT
