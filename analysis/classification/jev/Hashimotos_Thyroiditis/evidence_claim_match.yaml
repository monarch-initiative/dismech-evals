      - /disease_term
    evidence_metadata:
      reference: PMID:28290237
      reference_title: Multiple Nutritional Factors and the Risk of Hashimoto's Thyroiditis.
      evidence_source: HUMAN_CLINICAL
      explanation: Names highly iodinated thyroglobulin as the more immunogenic species, identifying the
        intermediate biochemical state linking iodine excess to the autoimmune response.
