      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Hepatitis C Virus-Associated Thyroid Immune Activation
        environmental_effect: PREDISPOSES
        causal_link_type: DIRECT
        description: Chronic hepatitis C virus (HCV) infection directly drives the antiviral immune activation
          captured by the intermediate node. Molecular mimicry and bystander activation are the usual
          proposals for how that then breaks tolerance, but the cited evidence is an association with
          chronic hepatitis C rather than a demonstration of either, and interferon treatment of that
          infection is itself thyrotoxic, which confounds the association.
      selected_evidence:
        snippet: Many studies showed that HCV is associated with thyroid autoimmunity and hypothyroidism,
