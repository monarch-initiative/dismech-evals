      assertion_type: Pathophysiology
      assertion:
        name: Impaired Vitamin D-Dependent Immune Tolerance
        description: 'Vitamin D signaling supports tolerogenic dendritic cells and regulatory T-cell function,
          an immunomodulatory brake that favors self-tolerance. Low vitamin D status weakens this brake
          and is proposed to permit escape from immune regulation. The direction of this association is
          unsettled: the cited cross-sectional finding is that levels are lower in people who already
          have the disease, and part of the same nutritional-risk literature attributes the low levels
          to the autoimmune process itself (including vitamin D receptor dysfunction) rather than the
          reverse.'
        role: trigger
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: Immune tolerance induction
          term:
            id: GO:0002507
            label: tolerance induction
          modifier: DECREASED
        - preferred_term: Regulation of immune response
          term:
            id: GO:0050776
            label: regulation of immune response
          modifier: DECREASED
        notes: 'Direction of effect is uncertain (reverse causation): low vitamin D in HT patients is
          cross-sectional, and part of the nutritional-risk literature (PMID:28290237) argues low vitamin
          D is more likely a result of the autoimmune process, including vitamin D receptor dysfunction.'
      selected_evidence:
        snippet: Vitamin D carries out an immunomodulatory role that appears to promote immune tolerance.
        supports: SUPPORT
    origin:
