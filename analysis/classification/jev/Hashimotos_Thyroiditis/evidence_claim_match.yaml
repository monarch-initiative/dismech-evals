  6d5d4db1e04c4b8f11996ce061b22977e8b48fb68b7af21389cf0c450b6b08aa:
    claim:
      about:
        disease:
          name: Hashimoto's Thyroiditis
          disease_term:
            preferred_term: Hashimoto thyroiditis
            term:
              id: MONDO:0007699
              label: Hashimoto thyroiditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cytokine-Sensitized Fas-Mediated Thyrocyte Apoptosis
        description: 'Normal thyroid follicular cells express Fas but resist Fas-mediated apoptosis: signalling
          is blocked downstream of the proximal caspases. Interferon gamma together with interleukin 1
          beta lifts that block by raising surface Fas, procaspases 7, 8 and 10, and the proapoptotic
          BH3 protein Bid, so that Fas ligation then cleaves caspases 7 and 3, engages mitochondria, and
          kills the cell. This cytokine gate is the reason destruction is confined to the inflamed gland.
          The killing is executed by the intrathyroidal lymphocytes rather than by the thyrocytes themselves,
          and it proceeds without perforin. It is not exclusively a Fas/FasL process: ex vivo killing
          is only partially blocked by disrupting Fas/FasL and a caspase-independent route appears to
          coexist.'
        role: effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Thyroid Follicular Cell
          term:
            id: CL:0002258
            label: thyroid follicular cell
        biological_processes:
        - preferred_term: Fas death-receptor apoptotic signalling in thyrocytes
          term:
            id: GO:0008625
            label: extrinsic apoptotic signaling pathway via death domain receptors
          modifier: INCREASED
        notes: Added from the 2026 openscientist hypothesis-search report, which describes Fas/FasL apoptosis
          as the confirmed dominant killing pathway. Perforin independence is supported; dominance is
          not. The report's supporting citations are a 1997 one-paragraph commentary hedged to "may determine"
          (PMID:9274519) and PMID:11716038, which actually reports only partial Fas/FasL dependence alongside
          a probable caspase-independent mechanism. The node is therefore curated as a well-evidenced,
          cytokine-gated, perforin-independent killing route, not as the exclusive one.
      selected_evidence:
        snippet: Normal thyroid cells are resistant to Fas-mediated apoptosis in vitro but can be sensitized
          by the unique combination of interferon-gamma and IL-1beta cytokines.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15563545
      reference_title: Induction and regulation of Fas-mediated apoptosis in human thyroid epithelial
        cells.
      evidence_source: IN_VITRO
      explanation: 'Establishes the cytokine gate that defines this node in primary human thyroid cells:
        resistance at baseline, sensitivity only after interferon gamma plus interleukin 1 beta.'
