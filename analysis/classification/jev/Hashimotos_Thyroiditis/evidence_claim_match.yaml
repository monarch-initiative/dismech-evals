  87c36bfc682831206b05eda8cfce63dc9fe78b9a0efe68a9f22f10c24f9ab124:
    claim:
      about:
        disease:
          name: Hashimoto's Thyroiditis
          disease_term:
            preferred_term: Hashimoto thyroiditis
            term:
              id: MONDO:0007699
              label: Hashimoto thyroiditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Th17/Treg Imbalance
        description: 'The CD4 T helper compartment in Hashimoto''s thyroiditis is shifted away from Foxp3
          regulatory commitment and toward the RORgt-driven, IL-17-producing Th17 program. Regulatory
          T cell frequency, Foxp3 transcript, and the Treg/Th17 ratio are all lower in patients, IL-17A
          is higher, and the ratio tracks inversely with thyroid autoantibody titres and TSH. IL-17 signalling
          in turn raises IL-6, CXCL10 and ICAM-1, feeding the intrathyroidal infiltrate. Whether this
          imbalance is an upstream initiator or a parallel feature of established disease is not settled:
          the human data are cross-sectional, and the claim that Th17 predominance precedes Th1-mediated
          destruction is a review-level synthesis with no longitudinal human series behind it (see notes).'
        role: amplifier
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        - preferred_term: Regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        biological_processes:
        - preferred_term: T-helper 17 cell differentiation
          term:
            id: GO:0072539
            label: T-helper 17 cell differentiation
          modifier: INCREASED
        - preferred_term: Regulatory T cell differentiation
          term:
            id: GO:0045066
            label: regulatory T cell differentiation
          modifier: DECREASED
        notes: 'Added from the 2026 openscientist hypothesis-search report, whose executive judgment calls
          the Th17/Treg axis an established upstream initiator. That strength is not supported: the human
          evidence is cross-sectional and the precedence claim rests on one 2025 review, while the report''s
          own knowledge gaps concede that the transition from Th17/Treg imbalance to Th1-mediated destruction
          lacks longitudinal human evidence. The node is therefore curated as an amplifier with a review-level
          precedence claim, not as the initiating lesion.'
      selected_evidence:
        snippet: T‑cell-derived exosomes enriched in miR‑142‑3p impair regulatory T‑cell function and
          exacerbate thyrocyte destruction by suppressing RAC1 and inhibiting ERK1/2 signaling
        supports: SUPPORT
    origin:
