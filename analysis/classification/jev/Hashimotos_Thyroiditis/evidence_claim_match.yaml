      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_autoimmune_thyrocyte_destruction_model
        hypothesis_label: Canonical Autoimmune Thyrocyte Destruction Model
        status: CANONICAL
        description: Hashimoto's thyroiditis is a chronic autoimmune disease in which loss of immune tolerance
          to thyroid antigens — primarily thyroid peroxidase (TPO) and thyroglobulin (Tg) — drives lymphocytic
          infiltration of the thyroid gland, formation of intrathyroidal tertiary lymphoid structures,
          and progressive thyrocyte destruction. CD4 Th1 and Th17 cells, CD8 cytotoxic T cells, and autoantibody-mediated
          effects (anti-TPO, anti-Tg) act together to deplete follicular cells, producing primary hypothyroidism.
          Susceptibility is conferred by HLA-DR3/DR5, CTLA4, PTPN22, and other immune-regulation loci,
          with environmental triggers including iodine excess, viral infection, and selenium deficiency.
          Levothyroxine replacement reverses the hypothyroid syndrome by bypassing the destroyed gland,
          supporting glandular failure as the proximate clinical lesion in this canonical model.
        notes: 'Retained as CANONICAL. The 2026 openscientist hypothesis-search report (kb/hypotheses/Hashimotos_Thyroiditis/canonical_autoimmune_thyrocyte_destruction_model)
          confirms 12 of 13 mechanistic claims as established. Core effector mechanisms — Fas/FasL-mediated
          thyrocyte apoptosis (sensitized by IFN-γ + IL-1β, independent of perforin/granzyme), intrathyroidal
          tertiary lymphoid structures functioning as germinal centers with RAG1/RAG2 in situ receptor
          revision, and coordinated CD4 Th1/Th17 + CD8 + autoantibody (anti-TPO in >90%) responses — are
          validated by histopathology, single-cell transcriptomics, and immune-checkpoint-inhibitor-induced
          thyroiditis as a natural experiment. JAK inhibition has provided proof-of-concept reversal.
          Six refinements: (1) Th17/Treg imbalance is now established as an upstream initiator preceding
          Th1-mediated destruction, not captured by the seed description; (2) IgG4-related thyroiditis
          (~27%) and seronegative HT (~12%) are clinically significant subtypes the model does not address;
          (3) GWAS identifies 418 independent signals (vs ~5 canonical loci) explaining only ~5.4% of
          variance, indicating extensive polygenicity; (4) the gut-thyroid axis (molecular mimicry, SCFA
          depletion) provides a mechanistic bridge from environmental triggers to immune dysregulation;
          (5) thyrocyte HLA class II expression (Bottazzo hypothesis) and NETosis are increasingly implicated;
          (6) sex-specific intrathyroidal B-cell homing via CXCL13-CXCR5 helps explain the female predominance.
          The initial tolerance-breaking event remains unknown and no disease-modifying RCT has yet been
          completed.'
      selected_evidence:
        snippet: Hashimoto's thyroiditis (HT) is generally characterized by the presence of thyroid peroxidase
          and thyroglobulin antibodies, with a concomitant infiltration of lymphocytes in the thyroid.
        supports: SUPPORT
