      reference: PMID:29931474
      reference_title: How much of the predisposition to Hashimoto's thyroiditis can be explained based
        on previously reported associations?
      evidence_source: HUMAN_CLINICAL
      explanation: 'Quantifies how little of the predisposition the named canonical loci account for,
        supporting the same polygenicity refinement. Note the scope: this is a seven-variable model over
        candidate SNPs plus HLA-DRB1 sequencing in 147 cases and 147 controls in a single Polish cohort.
        It is not a variance-explained figure for the 418 GWAS signals above, and the openscientist report''s
        juxtaposition of the two numbers should not be read that way.'
