  180357e5b2a5bda1498f7b61fa313da89b46000784f9b5956fcd1cb9c6e2286a:
    claim:
      about:
        disease:
          name: Hatipoglu Immunodeficiency Syndrome
          disease_term:
            preferred_term: hatipoglu immunodeficiency syndrome
            term:
              id: MONDO:0957229
              label: hatipoglu immunodeficiency syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of DPP9 Restraint on FIIND Inflammasome Sensors
        description: DPP9 normally sits in a ternary complex with full-length NLRP1 and the autoproteolytically
          released NLRP1 C-terminal UPA-CARD fragment, sequestering that fragment so it cannot oligomerise.
          CARD8 is held by an analogous, though not identical, DPP9 complex - the CARD8 C-terminus does
          not engage the DPP9 active site the way NLRP1's does, and DPP9's catalytic activity rather than
          its binding is what restrains CARD8. Losing DPP9 removes both restraints at once, which is why
          one enzyme deficiency produces two tissue-specific arms of disease.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: DPP9 restraint of FIIND sensor inflammasome signalling
          modifier: DECREASED
          term:
            id: GO:0141086
            label: negative regulation of inflammasome-mediated signaling pathway
      selected_evidence:
        snippet: The structures reveal a ternary complex that comprises DPP9, full-length NLRP1 and the
          NLRPT CT.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33731932
      reference_title: DPP9 sequesters the C terminus of NLRP1 to repress inflammasome activation.
      evidence_source: IN_VITRO
      explanation: 'The structural basis of the repression this node loses. Note the source''s own typography:
        it prints "NLRPT CT" where it means the NLRP1 C-terminal fragment, and the quote is reproduced
        as printed.'
