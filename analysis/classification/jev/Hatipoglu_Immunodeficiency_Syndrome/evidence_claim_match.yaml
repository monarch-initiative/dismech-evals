          pair in the third. Parents and unaffected siblings were heterozygous or non-carriers. The twins
          of the 2025 case report were born to a non-consanguineous couple, so consanguinity enriches
          for the disease without being required for it.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Hatipoglu immunodeficiency syndrome (HATIS) is an autosomal recessive immunologic disorder,
          characterized by cytopenias, recurrent infections, and failure to thrive associated with biallelic
          mutation in DPP9 gene.
        supports: SUPPORT
