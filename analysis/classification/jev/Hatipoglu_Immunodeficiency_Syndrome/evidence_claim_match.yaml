  c21719ab1aaa2258e248ce031a0a845438cfbfcf5df457797a96d2dfa1ee13ac:
    claim:
      about:
        disease:
          name: Hatipoglu Immunodeficiency Syndrome
          disease_term:
            preferred_term: hatipoglu immunodeficiency syndrome
            term:
              id: MONDO:0957229
              label: hatipoglu immunodeficiency syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: DPP9
        gene_term:
          preferred_term: DPP9
          term:
            id: hgnc:18648
            label: DPP9
        relationship_type: CAUSATIVE
        notes: The only gene implicated in this disease. DPP9 encodes a cytosolic dipeptidyl peptidase;
          the reported disease alleles are private to each family, so there is no recurrent variant to
          test for and diagnosis has been by exome sequencing in every published case. DPP9 is constrained
          against loss of function in population data, which is consistent with a recessive disease in
          which no homozygous damaging variant had previously been observed. The gene reaches the pathograph
          through the genes descriptor on the Biallelic DPP9 Loss-of-Function Variants node.
        variants:
        - name: c.331C>T (p.R111*)
          description: Homozygous in both affected cousins of the consanguineous Bedouin family.
        - name: c.641C>G (p.S214*)
          description: Maternally inherited nonsense allele in the compound heterozygous proband.
        - name: c.449G>A (p.G167S)
          description: Paternally inherited missense allele in the same proband, affecting a residue in
            a flexible loop at the periphery of the DPP9 substrate binding site and predicted to diminish
            substrate binding or catalytic efficiency.
        - name: c.2551C>T (p.Q851*)
          description: Homozygous in the Turkish proband; no endogenous DPP9 protein was detectable in
            that patient's cells.
      selected_evidence:
        snippet: Here, we identified three unrelated families with Hatipoğlu syndrome, an autosomal recessive
          DPP9 deficiency, which is characterized by immune-associated defects and dermatological anomalies.
        supports: SUPPORT
