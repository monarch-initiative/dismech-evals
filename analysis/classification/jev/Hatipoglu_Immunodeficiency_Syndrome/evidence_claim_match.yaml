      assertion_type: Treatment
      assertion:
        name: IL-1 pathway blockade (proposed)
        description: 'Proposed, not established. The animal genetics are the argument: removing a single
          copy of Il-1r was enough to produce an almost normal adult mutant mouse, and the authors raise
          IL-1 receptor antagonism as a way to get part of that effect pharmacologically. No patient outcome
          on anakinra is reported in the sources cited in this entry. The 2026 humanized-mouse work also
          bounds what this could be expected to do: the haematopoietic arm runs through CARD8 and caspase-1
          and was not rescued by removing NLRP1, so IL-1 blockade is a rationale for the inflammatory
          arm rather than for the marrow failure.'
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: interleukin-1 receptor antagonist therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: anakinra
            term:
              id: NCIT:C38717
              label: Anakinra
      selected_evidence:
        snippet: it raises the possibility that even partial inhibition of the NLRP1-inflammasome pathway,
          with IL-1Ra (anakinra) for example, would provide some therapeutic benefit for DPP9 deficient
          patients
        supports: SUPPORT
