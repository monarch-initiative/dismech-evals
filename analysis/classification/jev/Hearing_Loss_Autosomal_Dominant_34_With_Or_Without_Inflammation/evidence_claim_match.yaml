          its consequence. It is also prognostic here: baseline enhancement is among the features associated
          with anakinra response, so it informs treatment and not only diagnosis. Note the enhancement
          in DFNA34 is milder than in NOMID or Muckle-Wells, so its absence does not exclude the diagnosis.'
