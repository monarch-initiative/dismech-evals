      assertion_type: Pathophysiology
      assertion:
        name: Blood-Labyrinth Barrier Disruption and Macrophage Infiltration
        biological_scale: TISSUE
        description: IL-1 beta and downstream mediators increase permeability of the blood-labyrinth barrier,
          admitting circulating macrophages into cochlear tissue. In DFNA34 patients this is seen indirectly
          as pathologic enhancement of the cochlea on post-contrast MRI-FLAIR; in NLRP3-mutant mice it
          is measured directly, and both resident and infiltrating macrophages contribute to the resulting
          hearing loss.
        cell_types:
        - preferred_term: infiltrating macrophage
          term:
            id: CL:0000235
            label: macrophage
        locations:
        - preferred_term: Membranous labyrinth
          term:
            id: UBERON:0001849
            label: membranous labyrinth
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Interestingly, both cochlea-infiltrating and -resident macrophages contribute to peripheral
          inflammation-mediated hearing loss of CAPS mice.
        supports: SUPPORT
    origin:
