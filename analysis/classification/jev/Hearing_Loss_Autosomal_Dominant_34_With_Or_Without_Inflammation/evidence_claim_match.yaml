          the cochlear microenvironment. The human evidence that the variant is functionally activating
          is peripheral rather than cochlear: monocytes from affected individuals secrete IL-1 beta on
          priming alone, where control monocytes secrete none and require a second signal. The cochlear
          compartment of the same step is shown only in mouse, so the inference this node makes is that
          the cell-autonomous defect measured in blood monocytes is the same one operating in cochlea-resident
          macrophages.'
        cell_types:
