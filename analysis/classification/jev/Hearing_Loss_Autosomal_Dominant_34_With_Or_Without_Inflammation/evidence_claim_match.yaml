          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Progressive Cochlear Sensory Injury
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: TISSUE
        description: Gives severe to profound hearing loss with a disorganized organ of Corti, confirming
          that Nlrp3 alteration alone can damage the cochlea.
        limitations: 'The course is wrong in every temporal respect: severe loss by postnatal day 20 against
          adult onset in humans, limited life expectancy, and a cochlear abnormality that resolves by
          P15 and so reads as a developmental lag rather than the progressive inflammatory injury of human
          DFNA34. The allele is again D301N rather than p.Arg918Gln.'
        divergences:
        - divergence_type: TEMPORAL_SCOPE
          materiality: QUALIFYING
          description: The human disease is slowly progressive over decades from an adult onset. This
            model shows severe to profound loss by P20 with a transient cochlear disorganization that
            normalizes by P15, so the window it observes is early development rather than the chronic
            course the node describes.
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: The mutant allele expressed is Nlrp3 D301N, the mouse counterpart of a NOMID-associated
            human variant, not the p.Arg918Gln allele that causes DFNA34. Severity across NLRP3 alleles
            is not interchangeable.
        readouts:
        - name: Auditory brainstem response thresholds at P20
          target: Progressive Cochlear Sensory Injury
          direction: DECREASED
          interpretation: Severe to profound hearing loss, establishing that the cochlear lesion is functionally
            significant.
      selected_evidence:
        snippet: This morphologic feature gradually returned to normal by P15.
        supports: SUPPORT
