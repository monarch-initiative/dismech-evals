        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SLC44A4 p.Met156Val Heterozygous Variant
        description: 'A single missense allele, c.466A>G (p.Met156Val), in a family of Chinese ancestry.
          It is the only SLC44A4 variant ever curated in relation to hearing loss. ClinVar records it
          against the DFNA72 concept without a classification from unflagged submissions, and no other
          SLC44A4 variant carries a pathogenic or likely pathogenic classification for this disease, so
          the allelic spectrum of DFNA72 is a single change in a single kindred.

          The reporting authors did not assay the mutant protein''s stability, localisation or oligomerisation,
          so how a heterozygous missense change produces a dominant phenotype is unaddressed. The expert
          panel records the reported mechanism as loss of function, which for a dominant disease implies
          haploinsufficiency, but no truncating allele, deletion or dosage evidence exists to support
          that reading.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SLC44A4
          term:
            id: hgnc:13941
            label: SLC44A4
      selected_evidence:
        snippet: 'One variant (c.466A>G p.M156V) has been reported in one proband in one publication (PMID:
          28013291) and is included in this curation.'
        supports: SUPPORT
