      assertion:
        name: SLC44A4 on hearing loss gene panels, read against a Limited gene-disease classification
        description: 'DFNA72 is reached, if at all, by a comprehensive hearing loss panel or exome sequencing
          that includes SLC44A4, with segregation testing across the pedigree. The specific caution is
          what to do with a hit: because ClinGen classifies the gene-disease relationship as Limited,
          an SLC44A4 variant in a hearing-impaired person is not on its own a diagnosis, and ACMG/AMP
          variant interpretation for genes at Limited validity should not be treated as it would be for
          a Definitive gene. A mid-frequency audiogram in a dominant pedigree is the phenotype that makes
          the finding worth pursuing rather than filing as incidental.'
      selected_evidence:
        snippet: Although more evidence is needed to support a causal role, no convincing evidence has
          emerged that contradicts the gene-disease relationship.
