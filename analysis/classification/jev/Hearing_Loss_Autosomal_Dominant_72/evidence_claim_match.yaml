              label: hearing loss, autosomal dominant 72
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cholinergic_efferent_model
        hypothesis_label: Reduced cholinergic supply to the olivocochlear efferent synapse on outer hair
          cells
        status: EMERGING
        description: 'The mechanism proposed by the reporting authors, and the only one anyone has proposed.
          Its three links were each measured in a different system and never in the same one.

          The first link is cellular and is the strongest: SH-SY5Y neuroblastoma cells transfected with
          wild-type SLC44A4 took up more choline and released more acetylcholine than cells transfected
          with the mutant construct, so the variant reduces the output of the choline-acetylcholine pathway
          in a cell that can be made to run it.

          The second link is anatomical and is imported: the medial olivocochlear bundle synapses cholinergically
          onto outer hair cells, and in mice that synapse is protective - overexpressing the alpha9 nicotinic
          receptor subunit in outer hair cells reduces acoustic injury. That establishes the pathway matters
          for cochlear survival; it says nothing about SLC44A4.

          The third link is the one with no data at all. Nobody has shown that SLC44A4 is expressed in
          olivocochlear efferent neurons, or that acetylcholine release at that particular synapse depends
          on it, or that a heterozygous p.Met156Val allele changes anything in a cochlea. The zebrafish
          experiment that is sometimes read as filling this gap is a morpholino knockdown showing gross
          inner-ear and neuromast malformation, which is a developmental phenotype in a fish that has
          no cochlea and no mid-frequency place code.

          EMERGING is therefore the honest status, and the authors'' own verb - "may cause" - is the reason.'
      selected_evidence:
        snippet: SH-SY5Y cells transfected with SLC44A4 showed higher choline uptake and acetylcholine
          release than that of cells transfected with mutant SLC44A4.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
