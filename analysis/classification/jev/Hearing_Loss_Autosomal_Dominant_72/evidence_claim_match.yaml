  324c99b0449dc6bf341c96e5ce727d40f031a47a9c4c352d9717ba5de467a726:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 72
          disease_term:
            preferred_term: hearing loss, autosomal dominant 72
            term:
              id: MONDO:0033259
              label: hearing loss, autosomal dominant 72
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna72_substrate_identity_of_slc44a4
        kind: KNOWLEDGE_GAP
        prompt: Does SLC44A4 transport choline or thiamine pyrophosphate, and does the DFNA72 mechanism
          survive if the answer is thiamine pyrophosphate?
        attaches_to:
        - pathophysiology#Reduced Choline Uptake
        - pathophysiology#Reduced Acetylcholine Release
        - mechanistic_hypotheses#thiamine_pyrophosphate_transport_model
        - mechanistic_hypotheses#cholinergic_efferent_model
        rationale: 'The first step of the published DFNA72 mechanism is choline uptake, and the only direct
          characterisation of human SLC44A4 says the protein carries thiamine pyrophosphate with high
          affinity and is not affected by choline at all. The two results come from different cell backgrounds
          - SH-SY5Y neuroblastoma against ARPE19 - and neither from inner-ear tissue, so they are not
          a clean contradiction, but they cannot both be the whole story.

          The family name is part of how this happened. SLC44A4 belongs to the "choline transporter-like"
          family, which is a homology label, and the hearing-loss report states the choline function as
          an established premise rather than measuring it. The uptake difference that report measured
          is real; what it measured uptake *of* rests on that premise.

          The stakes are not merely nomenclatural. On the thiamine pyrophosphate reading the acetylcholine-release
          result needs another explanation, the olivocochlear efferent framing loses its rationale, and
          a cochlear mechanism would have to be built around a cofactor for pyruvate dehydrogenase and
          transketolase instead. No one has attempted that, and this entry does not, because nothing has
          been published to build it from.

          The resolving experiment is a side-by-side choline and thiamine pyrophosphate uptake comparison
          in one system, with and without the p.Met156Val allele.'
      selected_evidence:
        snippet: Whole-exome sequencing revealed SLC44A4, which encodes the choline transport protein,
          as the pathogenic gene in this family.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
