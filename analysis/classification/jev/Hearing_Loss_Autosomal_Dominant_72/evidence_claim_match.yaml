              label: hearing loss, autosomal dominant 72
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna72_gene_disease_validity_is_limited
        kind: KNOWLEDGE_GAP
        prompt: Is SLC44A4 a hearing loss gene? Nine years after the founding report there is still one
          proband, one publication and one variant, and ClinGen has twice classified the relationship
          Limited. What would a second family change, and what should a laboratory do with an SLC44A4
          hit in the meantime?
        attaches_to:
        - genetic#SLC44A4
        - pathophysiology#SLC44A4 p.Met156Val Heterozygous Variant
        - diagnosis#SLC44A4 on hearing loss gene panels, read against a Limited gene-disease classification
        rationale: 'This is the gap that governs how everything else in the entry should be read. The
          Hearing Loss Gene Curation Expert Panel first assessed SLC44A4 in April 2018, re-assessed it
          in November 2022, and the classification did not move: Limited, on one variant in one proband
          with a segregation LOD of 2.1, plus a morpholino model and expression data from the same paper.
          Nothing in the published record has been added since.

          The asymmetry worth stating is that Limited is not Disputed and not Refuted. The panel notes
          explicitly that no convincing contradictory evidence has emerged. So the honest position is
          neither that DFNA72 is established nor that it has been retired - it is that a single kindred
          has never been replicated, and that the sequencing volume of the last decade means the absence
          of a second family is beginning to be informative in itself.

          What would resolve it is ordinary: a second unrelated pedigree with a segregating SLC44A4 variant
          and a mid-frequency audiogram. Failing that, a mechanistic result that connects the gene to
          cochlear physiology - inner-ear expression, an efferent function measurement in a carrier, or
          a knock-in animal carrying p.Met156Val - would move it more than another association would.'
      selected_evidence:
        snippet: This gene-disease pair was originally evaluated by the Hearing Loss GCEP on 04/24/2018.
          It was reevaluated on 11/16/2022. As a result of this reevaluation, the classification did not
          change from limited (SOP Version 9).
        supports: SUPPORT
