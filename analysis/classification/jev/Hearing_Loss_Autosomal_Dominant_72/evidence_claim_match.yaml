            term:
              id: MONDO:0033259
              label: hearing loss, autosomal dominant 72
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna72_morphant_versus_human_heterozygous_missense
        kind: HUMAN_MODEL_MISMATCH
        prompt: The only in vivo evidence for DFNA72 is a transient morpholino knockdown in a fish without
          a cochlea, standing in for a heterozygous human missense allele causing postlingual mid-frequency
          loss. How much of that model transfers?
        attaches_to:
        - animal_models#slc44a4 morpholino knockdown zebrafish
        - pathophysiology#Loss of Efferent Protection of Outer Hair Cells
        - mechanistic_hypotheses#cholinergic_efferent_model
        rationale: 'The model and the disease differ on every axis that usually matters. Dose: the morphant
          approximates loss of the gene product, the patients carry one missense allele alongside a normal
          one. Timing: morpholino knockdown acts through early development and produces gross malformation
          of the ear and neuromasts, while the human loss is postlingual in an ear that formed normally.
          Anatomy: the distinguishing clinical feature of DFNA72 is a mid-frequency audiogram, and a fish
          has neither a cochlea nor a tonotopic place code in which "mid-frequency" means anything.

          There is also a methodological point that is specific rather than generic. Morpholino phenotypes
          in the zebrafish inner ear are a well-known site of off-target effect, and the usual remedy
          is a stable mutant line; none exists for slc44a4. The knockdown was rescued, which the expert
          panel counted, and rescue does control for some off-target effects - but it controls for the
          knockdown''s specificity, not for the relevance of a null phenotype to a heterozygous missense
          disease.

          The consequence for this entry is concrete. The fish supports "this gene is needed for a normal
          ear" and does not support any step of the cholinergic efferent chain, which is why the model''s
          modeled_mechanisms link points at the phenotype rather than at an internal node, and why the
          efferent nodes carry no model evidence at all.'
      selected_evidence:
        snippet: In the zebrafish model, downregulation of slc44a4 using morpholinos led to significant
          abnormalities in the zebrafish inner ear and lateral line neuromasts and contributed, to some
          extent, to disabilities in hearing and balance.
        supports: SUPPORT
