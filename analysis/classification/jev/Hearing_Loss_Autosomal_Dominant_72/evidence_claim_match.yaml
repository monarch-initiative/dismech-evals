              label: hearing loss, autosomal dominant 72
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: thiamine_pyrophosphate_transport_model
        hypothesis_label: SLC44A4 is a thiamine pyrophosphate transporter and the choline step is misassigned
        status: ALTERNATIVE
        description: 'SLC44A4 sits in the SLC44 "choline transporter-like" family, and the family name
          is where the choline attribution comes from. The one study that characterised the human protein
          directly reaches a different answer: expressed in ARPE19 cells it drives high-affinity, saturable
          uptake of thiamine pyrophosphate with an apparent Km of 0.17 micromolar, and that uptake is
          unaffected by free thiamine, thiamine monophosphate, or choline. Its tissue distribution is
          colonic, at the apical membrane of polarised epithelium.

          If that is the protein''s actual transport activity, the DFNA72 mechanism as published loses
          its first step, and the disease would need a different account - perhaps a thiamine-pyrophosphate-dependent
          one, since thiamine pyrophosphate is the cofactor of pyruvate dehydrogenase and transketolase
          and the cochlea is metabolically demanding, but nothing at all has been published along those
          lines.

          Recorded as ALTERNATIVE rather than as a refutation because the two are not strictly exclusive.
          A transporter can have more than one substrate, the assays were done in different cell backgrounds,
          and neither was done in inner-ear tissue. What would settle it is a choline and thiamine pyrophosphate
          uptake comparison in the same system, with and without the p.Met156Val allele. It has not been
          done.'
      selected_evidence:
        snippet: Here we report on the molecular identification of the colonic TPP uptake system as the
          product of the SLC44A4 gene.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
