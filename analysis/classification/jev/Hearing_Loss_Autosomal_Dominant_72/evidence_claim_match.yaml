        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Efferent Protection of Outer Hair Cells
        description: 'Outer hair cells that receive weakened cholinergic efferent input. What is established
          - in mice, not in this disease - is that the alpha9 nicotinic receptor at that synapse is protective:
          overexpressing it in outer hair cells reduces acoustic injury from exposures that otherwise
          cause temporary or permanent damage, without changing baseline sensitivity. The inference DFNA72
          needs is the mirror image, that weakening the same input leaves outer hair cells vulnerable
          over years of ordinary sound exposure.

          That inference is consistent with a postlingual, later-onset loss rather than a congenital one,
          and it is the only part of the model with a natural explanation for the onset. It has not been
          tested in a carrier.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
      selected_evidence:
        snippet: These data demonstrate that efferent protection is mediated via the alpha9 nAChR in the
          outer hair cells and provide direct evidence for a protective role, in vivo, of a member of
          the nAChR family.
        supports: SUPPORT
        directness: INDIRECT
