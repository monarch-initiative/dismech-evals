  013200db0e6127e4da31b686ee81a5f0b2dd318f6aaa05051ac4753200b12f9c:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 75
          disease_term:
            preferred_term: hearing loss, autosomal dominant 75
            term:
              id: MONDO:0032911
              label: hearing loss, autosomal dominant 75
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: 'Heterozygous TRRAP missense and frameshift alleles segregating with hearing loss
          in two reported families. In the Chinese pedigree the variant co-segregated across three generations;
          in the Hungarian family it was present in the affected mother and daughter and in none of the
          three unaffected relatives tested. No homozygote and no biallelic case has been reported.

          For counselling, an affected parent has a 50 percent chance of transmitting the variant to each
          child. That figure is the arithmetic of autosomal dominant transmission rather than an observation
          about DFNA75, and is stated here without an evidence item for that reason: neither reported
          paper gives a recurrence risk, and the GeneReviews hearing loss overview cached for this entry
          carries only a statement of the chapter''s purpose. What is genuinely unknown for this disorder
          is penetrance, which two pedigrees cannot establish and which would modify that 50 percent in
          practice.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Whole-exome sequencing, bioinformatic analysis, and Sanger sequencing were used to verify
          the co-segregation of a novel pathogenic variant
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31231791
      reference_title: Novel TRRAP mutation causes autosomal dominant non-syndromic hearing loss.
      evidence_source: HUMAN_CLINICAL
      explanation: The co-segregation analysis in the founding pedigree, which is what establishes the
        dominant mode of inheritance for this phenotype.
