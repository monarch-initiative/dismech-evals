  cc4f24fbcd5d9f885e36ced5218981d3030a3a199d5cef8825a5d88a2c08b35e:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 75
          disease_term:
            preferred_term: hearing loss, autosomal dominant 75
            term:
              id: MONDO:0032911
              label: hearing loss, autosomal dominant 75
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous TRRAP Missense Variants in the Tra1 HEAT Repeat Domains
        description: 'Five DFNA75 alleles are reported: p.Arg171Cys, p.Asp394Asn and p.Pro509fs, all in
          the Tra1 HEAT repeat central region spanning residues 18-531; p.Glu2750Asp, which lies in no
          annotated domain; and p.Lys1787Arg in the Tra1 HEAT repeat ring region spanning residues 541-2011.
          The clustering in HEAT repeat regions is the main structural argument for the mechanism proposed
          below, and it is an argument from position rather than from a functional assay.

          The allelic spectrum is not uniform in consequence: p.Pro509fs is a frameshift while the rest
          are missense, and no study has established whether any DFNA75 allele acts by loss of function,
          dominant negative effect, or something else. This entry therefore records no functional impact
          category for them.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TRRAP
          term:
            id: hgnc:12347
            label: TRRAP
      selected_evidence:
        snippet: Nearly all previously reported variants affect the same functional domain of the TRRAP
          protein, including the p.Arg171Cys, p.Asp394Asn, and p.Pro509fs variants, which all affect the
          Tra1 HEAT repeat central region domain (position from 18 to 531 amino acids), whereas the p.Glu2750Asp
          variant does not affect any known functional domains of the protein
        supports: SUPPORT
