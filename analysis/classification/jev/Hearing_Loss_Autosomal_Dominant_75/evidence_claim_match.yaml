      assertion_type: Phenotype
      assertion:
        name: Absence of vestibular and neurological involvement
        category: Auditory
        frequency: EXCLUDED
        description: Neither reported family had vestibular dysfunction or neurological abnormality on
          examination. This is what makes DFNA75 nonsyndromic, and it is also the observation that separates
          it clinically from the TRRAP neurodevelopmental phenotype. It is a negative finding from clinical
          examination in two families, not from systematic phenotyping.
        notes: 'The absence is carried by `frequency: EXCLUDED`, which is what the HPOA exporter reads
          to emit a NOT-qualified row; `modifier: ABSENT` alone is not consulted by the export layer and
          documents intent only. The evidence is graded `SUPPORT` because the quoted observation supports
          the claim this node makes, which is that vestibular involvement is absent. Grading it `REFUTE`
          and relying on that to carry the negation would leave the export one added `SUPPORT` item away
          from silently asserting that DFNA75 features vestibular dysfunction, cited to a paper saying
          the opposite. See `Adult-Onset_Autosomal_Dominant_Demyelinating_Leukodystrophy.yaml` for the
          entry where that regression actually happened.

          The binding is `HP:0001751 Abnormal vestibular function` rather than `HP:0002321 Vertigo`, because
          what was examined and found absent was vestibular dysfunction rather than the single symptom
          of vertigo.'
        phenotype_term:
          preferred_term: Abnormal vestibular function
          term:
            id: HP:0001751
            label: Abnormal vestibular function
          modifier: ABSENT
      selected_evidence:
        snippet: On examination, vestibular dysfunction and neurological abnormalities were not observed
          in the patients.
        supports: SUPPORT
