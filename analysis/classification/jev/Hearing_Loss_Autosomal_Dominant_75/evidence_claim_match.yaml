        context: []
      assertion_type: Phenotype
      assertion:
        name: Absent otoacoustic emissions
        category: Auditory
        description: 'Distortion product otoacoustic emissions were absent in the affected mother and
          nearly absent in the daughter, and the acoustic reflex threshold was absent at the tested frequencies
          in the mother. Loss of otoacoustic emissions indicates outer hair cell dysfunction, and it is
          the single measurement that places the DFNA75 lesion in the cochlea rather than in the auditory
          nerve.

          That makes it load-bearing for this entry''s cochlear-versus-retrocochlear knowledge gap, which
          is why it is bound to the specific term rather than folded into a general abnormal-evoked-potential
          claim. Note this is the opposite finding to DFNA83, the other recently defined dominant deafness
          locus in this knowledge base''s neighbourhood, where preserved emissions point at spiral ganglion
          neurons instead.'
        phenotype_term:
          preferred_term: Absent otoacoustic emissions
          term:
            id: HP:6000182
            label: Absent otoacoustic emissions
      selected_evidence:
        snippet: at 70/60 dB SPL stimulus intensity, the DP-grams showed absent otoacoustic emissions
          in both ears
        supports: SUPPORT
