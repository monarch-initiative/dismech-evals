        kind: KNOWLEDGE_GAP
        prompt: TRRAP causes both DFNA75 and a syndromic neurodevelopmental disorder with autism and intellectual
          disability. No DFNA75 family has been reported with the neurodevelopmental phenotype and no
          neurodevelopmental cohort has been reported with the DFNA75 audiogram. What distinguishes an
          allele that gives isolated deafness from one that gives a multi-system developmental syndrome?
        attaches_to:
        - pathophysiology#Heterozygous TRRAP Missense Variants in the Tra1 HEAT Repeat Domains
        - genetic#TRRAP
        rationale: 'The neurodevelopmental series is much better powered: 17 distinct de novo variants
          in 24 individuals from an international collaboration, with an internal genotype-phenotype correlation
          splitting those 24 into two clinical spectra by variant position. The deafness series is five
          variants from two families plus a sporadic screen. So the asymmetry in what has been reported
          may simply reflect the asymmetry in how hard anyone has looked, and the honest reading is that
          the two phenotypes have never been systematically sought in each other''s cohorts.

          Two things would settle it cheaply and neither has been done. Audiometry in the published TRRAP
          neurodevelopmental cohort would say whether the deafness allele series is genuinely distinct
          or whether high-frequency loss is simply unmeasured in patients ascertained for developmental
          delay. Developmental assessment in the deafness families would say the converse. Until then,
          the domain-clustering argument, that DFNA75 alleles sit in the Tra1 HEAT repeat regions, is
          the only thing separating the two, and one of the five DFNA75 alleles does not sit in any annotated
          domain at all.

          This matters for counselling, not just for the model. A family told that their TRRAP variant
          causes isolated deafness is being given a prognosis that rests on two published pedigrees.'
      selected_evidence:
        snippet: Strong genotype-phenotype correlation has been observed in DEDDFA, where missense variants
          located in the clustering between residues 1031-1159 result in more pronounced facial anomalies
          associated with a variable degree of intellectual disability.
        supports: SUPPORT
