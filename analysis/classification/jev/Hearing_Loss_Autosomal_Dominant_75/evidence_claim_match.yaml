    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 75
          disease_term:
            preferred_term: hearing loss, autosomal dominant 75
            term:
              id: MONDO:0032911
              label: hearing loss, autosomal dominant 75
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Transcriptional Program in the Developing Inner Ear
        mechanism_confidence: HYPOTHETICAL
        description: 'The step at which a general chromatin defect becomes an ear-specific one. It is
          the weakest link in the chain and is labelled as such: no cochlear or otic transcriptomic data
          exist for any DFNA75 allele, in any species. What supports placing the lesion in the ear at
          all is the zebrafish result below, where depleting trrap produces a quantifiable sensory-epithelial
          deficit, and the human audiometric pattern, which is cochlear rather than middle-ear.

          Why a ubiquitously expressed chromatin scaffold should give isolated deafness for one allele
          series and a multi-system neurodevelopmental syndrome for another is not explained by anything
          in this node, and is recorded as a knowledge gap.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: inner ear development
          term:
            id: GO:0048839
            label: inner ear development
          modifier: DECREASED
      selected_evidence:
        snippet: Knockdown or knockout of TRRAP resulted in significant defects in the inner ear of zebrafish,
          indicating that TRRAP plays an important role in inner ear development.
        supports: SUPPORT
