  1c40237dc06df33bd5e412266092d67d92f8b7c881f8d4add14c2551f5aef440:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 75
          disease_term:
            preferred_term: hearing loss, autosomal dominant 75
            term:
              id: MONDO:0032911
              label: hearing loss, autosomal dominant 75
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hat_complex_recruitment_model
        hypothesis_label: Impaired HAT complex recruitment as the DFNA75 mechanism
        status: EMERGING
        description: 'The proposed mechanism is that DFNA75 missense alleles degrade TRRAP''s function
          as the scaffold that recruits SAGA and NuA4/TIP60 histone acetyltransferase complexes to chromatin,
          and that the cochlea is unusually sensitive to the resulting transcriptional change. The model
          is coherent and is what both reporting groups propose, but no step of it has been measured for
          a DFNA75 allele: nobody has shown reduced complex recruitment, reduced histone acetylation,
          or an altered cochlear transcriptional program for any of the five variants. The supporting
          observations are TRRAP''s established biochemical role and the localisation of most DFNA75 alleles
          to the Tra1 HEAT repeat domains that mediate those interactions.'
      selected_evidence:
        snippet: We assume that similarly to this, the novel variant may also affect this function. Further
          studies are needed to examine this putative mechanism and other unidentified mechanism(s), which
          may also explain how the ADNSHL-causing variants of the TRRAP gene contribute to disease development.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
