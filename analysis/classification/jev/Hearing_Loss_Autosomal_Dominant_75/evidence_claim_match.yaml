        description: 'DFNA75 has no feature outside the ear and no audiometric finding that distinguishes
          it from the other forty-odd dominant nonsyndromic deafness genes, so it is not diagnosable without
          sequencing. Both reported families were solved by whole exome sequencing with Sanger confirmation
          and segregation testing in relatives; TRRAP is recent enough that an older targeted deafness
          panel may not include it.

          Two adjuncts are worth noting from the reported workups. Normal tympanometry excludes a conductive
          component, and inner ear MRI was normal in the Hungarian family, which does not diagnose anything
          but does rule out a structural malformation and was used there to approach the cochlear versus
          retrocochlear question.'
      selected_evidence:
        snippet: From the perspective of the clinical geneticist, we conclude that WES is an effective
          approach for establishing the genetic background of ADNSHL.
        supports: SUPPORT
