    evidence_metadata:
      reference: PMID:41952423
      reference_title: 'Long-Term Follow Up of Two Patients With Variants in the Cluster 1031-1159 of
        TRRAP Gene: Expanding the Phenotype of Developmental Delay With or Without Dysmorphic Facies and
        Autism.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Names the residue window that drives the severe neurodevelopmental phenotype. This
        sharpens rather than closes the gap: no DFNA75 allele falls in 1031-1159, which is consistent
        with a positional split, but four of the five DFNA75 alleles lie in the Tra1 HEAT repeat central
        region and one lies in no annotated domain at all, so position does not yet predict which phenotype
        a novel TRRAP missense allele will give.'
