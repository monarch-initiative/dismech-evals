              label: hearing loss, autosomal dominant 75
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna75_gene_disease_validity
        kind: KNOWLEDGE_GAP
        prompt: How strong is the TRRAP-DFNA75 gene-disease relationship? Two families, five alleles,
          one zebrafish depletion experiment, and the second reporting group classified its own variant
          as a variant of uncertain significance.
        attaches_to:
        - genetic#TRRAP
        - mechanistic_hypotheses#hat_complex_recruitment_model
        rationale: 'Every claim in this entry inherits the strength of this relationship, so it is recorded
          explicitly rather than left for a reader to reconstruct from the citation count.

          What supports it: co-segregation across three generations in the founding pedigree, an independent
          second family in a different population with segregation in the affected pair and absence in
          three unaffected relatives, and a functional experiment showing the gene is required for hair
          cell development.

          What weakens it: the Hungarian variant is formally a VUS under ACMG rules, and its in silico
          predictions are split, with SIFT, MutationTaster and CADD suggesting a damaging effect while
          PolyPhen-2, EVE, REVEL and AlphaMissense suggest benign. The three additional alleles from the
          founding report came from a screen of 66 sporadic cases with no segregation data. No functional
          assay has been run on any DFNA75 allele. And the zebrafish experiment tests gene requirement,
          not allele effect.

          There is a structural reason the obvious next experiment has not been done, and it is worth
          recording because it changes what "no mouse model" means here. Germline deletion of Trrap is
          embryonically lethal in the mouse, so a straightforward knockout cannot be audiometrically phenotyped
          at all; the mouse work that exists on this gene is conditional, in B cells and in adult neural
          stem cells, neither of which reports on hearing. A DFNA75 mouse would have to be a cochlea-conditional
          knock-in of a specific human allele. That is a real experiment rather than an unasked question,
          and its absence is not evidence against the gene.

          There is no ClinGen Gene-Disease Validity assertion for TRRAP and hearing loss to cite, which
          is why this is recorded as prose here rather than as a CGGV evidence item. A ClinGen curation
          would be the single most useful external addition to this entry.'
      selected_evidence:
        snippet: Based on the ACMG variant classification guideline, this variant is classified as a VUS.
        supports: SUPPORT
