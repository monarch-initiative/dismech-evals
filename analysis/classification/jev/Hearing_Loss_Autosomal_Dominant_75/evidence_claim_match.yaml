        description: 'TRRAP is a pseudokinase member of the phosphoinositide 3-kinase-related kinase family
          and the scaffolding subunit shared by the SAGA and NuA4/TIP60 histone acetyltransferase complexes;
          its HEAT repeat solenoids are the surfaces through which those complexes are assembled and delivered
