        description: The model establishes that trrap is required for hair cell development and stereocilia
          integrity, which is the only experimental support anywhere for placing the DFNA75 lesion in
          the sensory epithelium.
        limitations: 'Three separate gaps between this model and the human disease. First, allele: the
          model is a knockdown and a knockout, whereas every human DFNA75 allele except one frameshift
          is a heterozygous missense change of unestablished functional consequence, so the experiment
          tests gene requirement rather than variant effect. Second, organ: the readout is the lateral
          line neuromast, a mechanosensory organ zebrafish have and humans do not, rather than the cochlea.
          Third, timing: the fish phenotype is developmental, whereas the human phenotype is post-lingual
          or mid-childhood onset and progressive, so a developmental deficit is being used to explain
          a progressive degeneration.'
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: The quantified structure is the zebrafish lateral line neuromast. Humans have no
            lateral line, and the cochlear organ of Corti that DFNA75 affects has a different cellular
            architecture, tonotopy and regenerative capacity from a neuromast.
        - divergence_type: PROXY_QUANTITY
          materiality: INVALIDATING
          description: The model's manipulated quantity is trrap gene dosage, reduced to near zero. The
            disease's quantity is the activity of a heterozygous missense TRRAP protein whose functional
            consequence has never been measured. Complete depletion is not a proxy for a missense allele
            unless loss of function has been demonstrated, and it has not.
        readouts:
        - name: Hair cells per lateral line neuromast
          target: Cochlear Hair Cell Deficit and Stereocilia Abnormality
          direction: DECREASED
          interpretation: The quantitative sensory-cell deficit on which the developmental interpretation
            rests.
