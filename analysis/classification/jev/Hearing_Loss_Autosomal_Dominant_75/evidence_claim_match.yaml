      assertion_type: Discussion
      assertion:
        discussion_id: dfna75_cochlear_versus_retrocochlear_localisation
        kind: KNOWLEDGE_GAP
        prompt: Is the DFNA75 lesion in the cochlear hair cells, in the spiral ganglion, or both? The
          otoacoustic emission data say outer hair cell, but that is one family and the reporting authors
          declined to exclude a retrocochlear component.
        attaches_to:
        - pathophysiology#Progressive High-Frequency Cochlear Hearing Loss
        - pathophysiology#Cochlear Hair Cell Deficit and Stereocilia Abnormality
        rationale: 'The question is not academic for this gene. TRRAP is a general chromatin scaffold
          expressed everywhere, so nothing about the gene predicts which cochlear cell type it acts in,
          and the zebrafish evidence points at hair cells only because hair cells are what the lateral
          line assay measures. If the spiral ganglion were also involved, the fish experiment would not
          have detected it.

          The single relevant human measurement is the absent DPOAE in the Hungarian mother and nearly
          absent DPOAE in the daughter, which does indicate outer hair cell dysfunction. Against that,
          the authors note that distinguishing cochlear from retrocochlear origin at this severity requires
          more than audiometry, and their MRI was normal without resolving the question. Auditory brainstem
          response morphology in more affected individuals, or electrocochleography, would separate the
          possibilities.'
      selected_evidence:
        snippet: Due to the severe grade of high-frequency sensorineural hearing impairment in the 2-4
          kHz range, a differential diagnosis between the cochlear vs. retrocochlear origin requires more
          complex diagnostic procedures, such as MRI.
        supports: SUPPORT
