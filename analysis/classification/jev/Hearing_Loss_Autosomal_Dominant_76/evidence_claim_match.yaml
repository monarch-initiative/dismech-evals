          name: Hearing Loss Autosomal Dominant 76
          disease_term:
            preferred_term: hearing loss, autosomal dominant 76
            term:
              id: MONDO:0032917
              label: hearing loss, autosomal dominant 76
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: haploinsufficiency_model
        hypothesis_label: Reduced plastin 1 dosage from an unstable mutant protein
        status: ALTERNATIVE
        description: 'The simpler reading, and one the same study supports in part. The exon-8-skipping
          protein has a markedly shorter half-life than wild type, is more heavily ubiquitinated, and
          is degraded within twelve hours where the wild-type protein is stable, so cells carrying it
          hold less plastin 1 overall. On this model the disease is a dosage problem and the mouse null
          - moderate, progressive, late-onset loss - is the right model after all.

          There is a mouse observation that bears on this model and that the dominant-negative framing
          must not be allowed to obscure - but it is weaker than it first looks, and the same paper contains
          its counterweight.

          What is tested and positive: heterozygous nulls shift with age against *themselves*. Wild-type
          animals show no threshold shift between the youngest and oldest cohorts, and heterozygotes show
          a significant one. What is *not* established: a deficit against wild-type controls. On click
          ABR in animals older than six months there was no significant difference between heterozygotes
          and wild type, and the tone-pip elevation described at seven to nine months carries no statistic
          - the figure legend marks significance for knockout versus wild type only. The paper also uses
          heterozygotes as a control genotype throughout its stereocilia morphology, hair cell electrophysiology
          and transduction measurements, where they behave normally.

          So the honest reading is that heterozygous nulls plausibly develop a late, mild deterioration,
          and that halving plastin 1 has never been shown to produce a deficit a properly powered comparison
          would detect. That is suggestive for dosage sufficiency and it is not settled.

          Recorded as ALTERNATIVE rather than dismissed because the two are not exclusive and the authors
          present them side by side: reduced stability accounts for the loss-of-function component, and
          the divergent transduction phenotype accounts for the rest. What would separate them is a truncating
          PLS1 allele or a whole-gene deletion in a hearing-impaired person; none has been reported.'
      selected_evidence:
        snippet: CHX-chase experiments revealed rapid degradation of ΔExon8-PLS1 within 12 h, whereas
          WT-PLS1 remained stable, indicating that the mutation substantially reduced protein stability.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41922548
      reference_title: Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation
        in a zebrafish model.
      evidence_source: IN_VITRO
      explanation: The measured instability that gives the dosage model its footing, from a cycloheximide-chase
