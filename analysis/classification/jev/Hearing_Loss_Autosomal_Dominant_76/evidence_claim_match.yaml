        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Actin Cross-Linking by Plastin 1
        description: Plastin 1 has two tandem actin-binding domains built from paired calponin-homology
          folds. The second has the higher affinity for actin and the first holds it under autoinhibitory
          restraint, releasing it only once the first domain has engaged a bundle. Removing the segment
          encoded at the c.981 donor exon breaks the intramolecular contact between the two domains, and
          the mutant protein then binds actin bundles in an abnormal pattern and disturbs cytoskeletal
          organisation rather than simply binding less. The four missense alleles are predicted, by modelling,
          to destabilise the first domain and weaken F-actin binding; none has been assayed biochemically.
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        molecular_functions:
        - preferred_term: actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: actin crosslink formation
          term:
            id: GO:0051764
            label: actin crosslink formation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Altering the actin cross-linker composition, even as the actin filaments exhibit little
          to no turnover, provides a mechanism for ongoing remodeling and repair important for stereocilia
          homeostasis.
        supports: SUPPORT
        directness: INDIRECT
