  e64b2e8828598730378594d8da11f8dcfa12d47b83bb63102bbda1058a724a6d:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 76
          disease_term:
            preferred_term: hearing loss, autosomal dominant 76
            term:
              id: MONDO:0032917
              label: hearing loss, autosomal dominant 76
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pls1_null_mouse_versus_dominant_human_allele
        kind: HUMAN_MODEL_MISMATCH
        prompt: The main in vivo model of DFNA76 is a homozygous Pls1-null mouse, and the disease is dominant
          in people carrying one missense or in-frame-deletion allele. Zebrafish data say the null and
          the human-type mutant perturb mechanotransduction in opposite directions. How much of the mouse
          phenotype should be read as DFNA76?
        attaches_to:
        - animal_models#Pls1 knockout mouse
        - pathophysiology#Impaired Mechanoelectrical Transduction
        - mechanistic_hypotheses#dominant_negative_actin_crosslinking_model
        rationale: 'The Pls1-null mouse has earned its place. It predicted, before any patient was found,
          that human PLS1 mutations would cause relatively mild progressive hearing loss; it is where
          the maintenance role of plastin 1 was established; and it is the material in which the actin-packing
          result was obtained. Every structural claim in this entry''s pathophysiology depends on it.

          But it is a null, and DFNA76 is not a null disease. Six alleles have been reported and not one
          is truncating: four missense changes in or beside the actin-binding domains, and two splice
          variants at a single donor site that remove an internal segment in frame. A protein is made
          in every reported patient. When the two situations were compared directly - the only time they
          have been - they came apart on the measurement that matters most for a mechanosensory cell:
          dye uptake through the transduction channel fell with the human mutant and rose in the knockout,
          and wild-type protein re-expressed in the knockout did not reproduce the mutant''s defect.

          So the mouse is a good model of losing plastin 1 and an unknown model of having a defective
          one. That distinction is not academic. If the dominant-negative reading is right, gene addition
          - the modality being developed for recessive deafness genes - would add wild-type protein alongside
          a mutant that is actively interfering, and the therapeutic strategy would have to be allele-specific
          silencing instead. If the dosage reading is right, augmentation is exactly right. Nothing published
          distinguishes them, and the experiment that would is not hard: no mouse carrying a human PLS1
          missense or exon-skipping allele has been made.

          A second, quieter mismatch sits underneath. The zebrafish knockout phenotype is modest, and
          the authors attribute that to espin and fascin partially compensating for absent plastin 1 -
          so the null arm of the comparison may understate the consequence of losing the protein, which
          would narrow rather than widen the gap between the two. That possibility has not been tested
          either.'
        proposed_experiments:
        - experiment_id: exp_dfna76_knockin_mouse_allele_series
          name: Knock-in mouse allele series for a DFNA76 missense and the exon-skipping allele
          description: 'Generate mice carrying the recurrent p.Glu269Lys missense allele and the exon-skipping
            allele in the endogenous Pls1 locus, and phenotype heterozygotes against wild-type, Pls1 heterozygous
            nulls and Pls1 homozygous nulls with auditory brainstem response and distortion product otoacoustic
            emissions across ages, scanning electron microscopy of bundle morphology, stereocilium width
            morphometry, and single-cell transducer current and adaptation recordings. The heterozygous-null
            arm is the critical comparison and it is the arm that is currently underpowered: existing
            data show heterozygotes shifting against themselves with age but never reaching a significant
            deficit against wild type, so this experiment has to settle both questions at once - whether
            heterozygous nulls are affected at all on an adequately powered comparison, and, if they are,
            whether knock-in heterozygotes are affected earlier, more severely, or with a transduction
            phenotype of the opposite sign.'
          would_support:
          - mechanistic_hypotheses#dominant_negative_actin_crosslinking_model
          supporting_outcome:
          - Knock-in heterozygotes lose hearing while heterozygous nulls do not, or lose it earlier and
            more severely than nulls of the same age, and their transducer phenotype differs in direction
            from the null's - either result would establish the dominant-negative mechanism in the heterozygous
            configuration patients are in and make allele-specific silencing the rational therapeutic
            target.
          would_refute:
          - mechanistic_hypotheses#dominant_negative_actin_crosslinking_model
          refuting_outcome:
          - Knock-in heterozygotes and Pls1 heterozygous nulls are indistinguishable in onset, severity
            and transduction phenotype - both late, mild and progressive - which would make DFNA76 a haploinsufficiency
            disease, would retire the dominant-negative hypothesis, and would make gene augmentation the
            appropriate modality.
      selected_evidence:
        snippet: Notably, neither PLS1 deficiency nor re-expression of human wild-type PLS1 in knockout
          zebrafish reproduces this MET defect. Thus, the mutation not only reduces native PLS1 function
          but also interferes with normal MET channel activity.
        supports: SUPPORT
