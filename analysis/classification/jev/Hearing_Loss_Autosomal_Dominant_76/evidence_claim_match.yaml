        description: 'The structural consequence. Plastin 1 is the most abundant cross-linker in vestibular
          stereocilia by targeted mass spectrometry, and what it does to the actin core is counterintuitive:
          it makes the packing less ordered, not more. Wild-type stereocilia have randomly arranged, liquid-packed
          actin filaments; stereocilia lacking plastin 1 have orderly hexagonal packing and are shorter
          and thinner. Liquid packing is what permits a stereocilium to reach full diameter, so the cross-linker
          widens the rod by disordering it.

          In the mouse this is a maintenance failure. Bundles develop normally and the defect appears
          in young adults, with inner hair cells affected first and outer hair cells degenerating later.'
