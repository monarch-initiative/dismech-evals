      reference_title: Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation
        in a zebrafish model.
      evidence_source: HUMAN_CLINICAL
      explanation: A childhood-onset progressive course in a family carrying a splice allele at the same
