            term:
              id: MONDO:0032917
              label: hearing loss, autosomal dominant 76
        context: []
      assertion_type: Genetic
      assertion:
        name: PLS1
        notes: 'PLS1 encodes plastin 1, also called fimbrin or I-plastin, one of three plastin isoforms
          in humans. The protein has two N-terminal EF-hand calcium-binding motifs and two tandem actin-binding
          domains, each built from a pair of calponin-homology folds. The second domain binds actin with
          higher affinity and is held under autoinhibitory restraint by the first, so cross-linking is
          a two-step process rather than a simple bivalent grip. Outside the ear, plastin 1 is predominantly
          an intestinal epithelial microvillar protein.

          Every reported DFNA76 allele leaves a protein behind - four missense changes clustered in or
          beside the actin-binding regions and two splice variants at one donor site producing an in-frame
          internal deletion. No truncating allele and no whole-gene deletion has been reported in a hearing-impaired
          person, which is why the haploinsufficiency model in the hypotheses section remains untested
          rather than excluded.

          A separate line of work bears on how the mutant behaves in a cell. The exon-skipping protein
          has a ubiquitination site six residues downstream of the deleted region, is more heavily ubiquitinated
          than wild type, and is degraded within twelve hours, so the mutant allele contributes both an
          abnormal protein and less total protein.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: PLS1
          term:
            id: hgnc:9090
            label: PLS1
      selected_evidence:
        snippet: PLS1 is predominantly expressed in intestinal epithelial microvilli and stereocilia of
          cochlear and vestibular hair cells
        supports: SUPPORT
