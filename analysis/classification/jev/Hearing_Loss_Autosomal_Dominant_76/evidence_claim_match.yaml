        - mechanistic_hypotheses#dominant_negative_actin_crosslinking_model
        rationale: 'The Pls1-null mouse has earned its place. It predicted, before any patient was found,
          that human PLS1 mutations would cause relatively mild progressive hearing loss; it is where
          the maintenance role of plastin 1 was established; and it is the material in which the actin-packing
          result was obtained. Every structural claim in this entry''s pathophysiology depends on it.

