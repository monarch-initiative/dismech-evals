            name: pls1 knockout and human mutant-expressing zebrafish
            species: Zebrafish
            genotype: pls1 -/- knockout, and larvae expressing human PLS1 wild-type or the exon-skipping
              mutant
            publication: PMID:41922548
            description: A four-arm comparison - uninjected control, plastin-1 knockout, knockout plus
              human wild-type protein, knockout plus the human exon-skipping mutant - that is the only
              published experiment putting the human allele and simple gene loss side by side in an animal.
              Knockouts have enlarged otic vesicles and altered otolith diameters, both rescued by wild-type
              protein; the mutant fails to rescue them. Both knockout and mutant larvae show reduced sound-evoked
              swimming, but only the mutant reduces FM1-43 uptake through the transduction channel, which
              is increased in the knockout.
            genes:
            - preferred_term: PLS1
              term:
                id: hgnc:9090
                label: PLS1
          role: ancestor
        - path: /animal_models/1/modeled_mechanisms/0
          value:
            target: Impaired Mechanoelectrical Transduction
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: 'The experiment that establishes the transduction defect as a property of the
              mutant protein rather than of plastin 1 deficiency. Its design is what gives it force: the
              wild-type rescue arm rules out the injection and the knockout background as explanations.'
            limitations: Zebrafish lateral-line neuromast hair cells are not cochlear hair cells, and
              FM1-43 uptake is an indirect proxy for channel function that the authors decline to interpret
              mechanistically. The human protein is expressed on a zebrafish null background rather than
              beside an endogenous wild-type allele, so the configuration is not the heterozygous one
              patients are in. Espin and fascin partially compensate for absent plastin 1 in zebrafish
              stereocilia, which the authors offer as the reason the knockout phenotype is modest - so
              the null arm may understate what losing plastin 1 does.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: FM1-43 uptake through the transduction channel in lateral-line neuromasts
        target: Impaired Mechanoelectrical Transduction
        direction: DECREASED
        interpretation: Dye entry falls in larvae expressing the human mutant, indicating channels that
