              id: MONDO:0032917
              label: hearing loss, autosomal dominant 76
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mechanoelectrical Transduction
        description: 'Transduction is affected, but the mouse null and the human-type mutant are not affected
          in the same direction and the difference is the most informative measurement in the disease.
          In Pls1 knockout mice the size of the mechanoelectrical transducer current is unchanged and
          bundle stiffness is unaffected; only the adaptation properties differ. In zebrafish, FM1-43
          uptake through the transduction channel is modestly increased in plastin-1 knockouts - consistent
          with channels sitting abnormally open - and significantly reduced in larvae expressing the human
          exon-skipping mutant, consistent with channels that do not open properly.

          Whether that reflects bundle mechanics, tip-link tension or channel gating has not been determined,
          which the authors say explicitly. This node therefore records a transduction abnormality whose
          sign depends on the allele class, and does not assert a mechanism for it.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: sensory hair cell
          term:
            id: CL:0000855
            label: sensory hair cell
        biological_processes:
        - preferred_term: detection of mechanical stimulus involved in sensory perception of sound
          term:
            id: GO:0050910
            label: detection of mechanical stimulus involved in sensory perception of sound
          modifier: ABNORMAL
      selected_evidence:
        snippet: This pattern suggests that the MET channels in Pls1-KO fish tend to remain abnormally
          open, whereas the mutant protein impairs the normal opening of the MET channels, resulting in
          decreased permeability.
        supports: SUPPORT
