      assertion:
        name: Genetic Counselling
        description: 'Counselling for a dominant condition with a 50 percent transmission risk. The disease-specific
          content is what the PLS1 result does not predict: onset spans congenital to adult across reported
          families, so a normal audiogram in a young carrier does not establish non-penetrance and a family
          cannot be told when to expect the loss. Formal penetrance has not been estimated in any pedigree.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'No target_mechanisms link is recorded on this treatment. Counselling does not act on a
          pathograph node, and no TreatmentEffectEnum value describes it - INHIBITS, ACTIVATES, MODULATES,
          BYPASSES and RESTORES are all claims about changing a mechanism. The two device treatments above
          carry the section''s join points into the graph instead.

          No PLS1-directed drug, antisense oligonucleotide, gene replacement or gene editing has been
          reported, and no DFNA76-specific clinical trial was identified. The dominant-negative hypothesis,
          if confirmed, would make simple gene addition the wrong modality here - allele-specific silencing
          rather than augmentation - which is the practical reason the mechanism question in the discussions
          section matters.'
      selected_evidence:
        snippet: By contrast, both affected individuals in the present family exhibited prelingual deafness,
          consistent with other reported NSHL cases caused by PLS1 mutations
        supports: SUPPORT
