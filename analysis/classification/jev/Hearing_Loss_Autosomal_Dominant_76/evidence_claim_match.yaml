  c86d1bf25ffec5b3c99b54f0e4eb7414541aac60a295c082e04e0ef38d94de07:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 76
          disease_term:
            preferred_term: hearing loss, autosomal dominant 76
            term:
              id: MONDO:0032917
              label: hearing loss, autosomal dominant 76
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Pls1 knockout mouse
        species: Mouse
        genotype: Pls1 -/- (plastin 1 null)
        publication: PMID:25124451
        description: The principal in vivo model, and a homozygous null standing in for a heterozygous
          missense or in-frame-deletion disease. Knockouts have moderate progressive hearing loss across
          all frequencies. Hair cells develop normally; inner hair cell stereocilia narrow and shorten
          in young adults, outer hair cell stereocilia are less affected initially and degenerate with
          age. Bundle stiffness and the acquisition of hair cell electrophysiology are normal, and transducer
          current size is unchanged, with only adaptation altered. A later cryo-electron-tomography study
          used the same line to show that the actin filaments of plastin-1-deficient stereocilia adopt
          orderly hexagonal packing where wild-type filaments are liquid-packed.
        genes:
        - preferred_term: PLS1
          term:
            id: hgnc:9090
            label: PLS1
        modeled_mechanisms:
        - target: Altered Stereocilia Actin Core Packing and Width
          relationship: RECAPITULATES
          fidelity: HIGH
          description: This is where the structural claim comes from. Actin filament packing inside a
            stereocilium cannot be measured in a patient, so the mouse is not corroborating a human observation
            - it is the experiment in which plastin 1's contribution to bundle width was defined, and
            the direction of the effect (loosening the lattice to allow widening) was not the expected
            one.
          limitations: The packing and width measurements were made in vestibular stereocilia of a homozygous
            null, and the human disease is heterozygous, cochlear and caused by alleles that produce protein.
            Nothing here shows that a human missense or in-frame-deletion allele changes actin packing
            at all.
          readouts:
          - name: Actin filament packing order in stereocilia
            target: Altered Stereocilia Actin Core Packing and Width
            direction: ALTERED
            interpretation: Packing shifts from liquid to hexagonal without plastin 1, which is the structural
              change that limits how wide a stereocilium can grow.
          - name: Stereocilium width and length
            target: Altered Stereocilia Actin Core Packing and Width
            direction: DECREASED
            interpretation: Inner hair cell stereocilia become narrower and shorter in young adults, after
              developing normally.
        - target: Impaired Mechanoelectrical Transduction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: The null does affect transduction, but narrowly and in the wrong direction to model
            the human allele. Only adaptation changes; current size and bundle stiffness do not. In zebrafish
            the equivalent comparison shows the null and the human-type mutant moving transduction-channel
            dye uptake in opposite directions.
          limitations: Fidelity is LOW because the discrepancy is directional, not merely quantitative.
            The null's transduction phenotype cannot stand in for the mutant's, and the study that established
            this was done in zebrafish rather than in the mouse line, so no mouse carrying a human PLS1
            allele has been tested. Curating this link at higher fidelity would let a reader infer that
            anything measured in Pls1 knockout mice applies to DFNA76 patients, which is the specific
            error this entry exists to avoid.
          readouts:
          - name: Mechanoelectrical transducer current and adaptation
            target: Impaired Mechanoelectrical Transduction
            direction: ALTERED
            interpretation: Adaptation properties change while transducer current amplitude does not,
              so the null perturbs how the channel responds over time rather than how many channels there
              are or how well they open.
      selected_evidence:
        snippet: Here, we found that plastin 1 knock-out (Pls1 KO) mice have a moderate and progressive
          form of hearing loss across all frequencies.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25124451
      reference_title: Absence of plastin 1 causes abnormal maintenance of hair cell stereocilia and a
        moderate form of hearing loss in mice.
      evidence_source: MODEL_ORGANISM
      explanation: The auditory phenotype that makes the line informative, and the qualifier - moderate,
        progressive - that the founding human paper cited as its prior.
