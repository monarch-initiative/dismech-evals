          is truncating: four missense changes in or beside the actin-binding domains, and two splice
          variants at a single donor site that remove an internal segment in frame. A protein is made
          in every reported patient. When the two situations were compared directly - the only time they
          have been - they came apart on the measurement that matters most for a mechanosensory cell:
          dye uptake through the transduction channel fell with the human mutant and rose in the knockout,
          and wild-type protein re-expressed in the knockout did not reproduce the mutant''s defect.

