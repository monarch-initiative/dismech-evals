      assertion:
        name: PLS1 Heterozygous Variant
        description: 'A single altered PLS1 allele. The reported spectrum falls into two classes and contains
          no truncation. Four missense changes sit in or adjacent to the actin-binding regions - p.Phe128Ser,
          p.Leu238Arg and the recurrent p.Glu269Lys in European and Turkish families, and p.Leu363Phe
          in the calponin-homology 2 domain in a Hungarian Roma family. Two splice variants at the same
          donor site, c.981+1G>A and c.981+5G>A, produce an in-frame internal deletion of the region encoded
          by that exon; the two reports number the skipped exon differently, so this entry names the donor
          site rather than an exon number.

          The absence of truncating alleles is a real feature of the spectrum, not a gap in ascertainment
          yet: every published family carries a variant that leaves a protein behind.

          One allele recurs. p.Glu269Lys was reported independently in a European family and a Turkish
          family within months of each other in 2019, each report presenting it as novel. Neither addresses
          whether that is recurrent mutation at a hypermutable site or a shared haplotype, and no haplotype
          analysis has been published, so the entry records the recurrence without asserting a founder
          effect. The same is true of the two splice variants: c.981+1G>A and c.981+5G>A are different
          changes at one donor site in two unrelated Chinese families, which is convergence on a splice
          junction rather than a shared allele.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: PLS1
          term:
            id: hgnc:9090
            label: PLS1
      selected_evidence:
        snippet: In silico protein modeling suggests that all variants destabilize the structure of the
          actin-binding domain 1, likely reducing the protein's ability to bind F actin.
        supports: SUPPORT
