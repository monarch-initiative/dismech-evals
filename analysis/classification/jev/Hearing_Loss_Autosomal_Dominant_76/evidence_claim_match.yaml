        snippet: FM1-43 uptake was slightly increased in Pls1-knockout larvae but reduced in the ΔExon8-PLS1
          group. These contrasting patterns suggest that PLS1 deficiency and ΔExon8-PLS1 expression may
          perturb MET channel function through different mechanisms.
        supports: SUPPORT
        directness: INDIRECT
