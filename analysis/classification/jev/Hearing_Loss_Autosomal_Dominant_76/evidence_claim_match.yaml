      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dominant_negative_actin_crosslinking_model
        hypothesis_label: Dominant-negative mutant plastin 1 with partial loss of function
        status: EMERGING
        description: 'The mutant protein does something, rather than simply failing to do something. Direct
          comparison in zebrafish separates the two: the exon-8-skipping mutant reduces FM1-43 dye uptake
          through the mechanotransduction channel, while knocking plastin 1 out increases it, and neither
          the knockout nor re-expressed wild-type protein reproduces the mutant''s reduction. Biochemically
          the mutant retains actin binding but binds abnormally, disrupting the intramolecular ABD1-ABD2
          interaction that normally restrains the high-affinity domain, and it co-precipitates more ACTG1
          than wild-type protein does.

          This is EMERGING rather than CANONICAL for a reason the authors state themselves: they did not
          co-express wild-type and mutant plastin 1, which is the experiment a dominant-negative claim
          requires, so the conclusion is inferred from the functional divergence between knockout and
          mutant rather than demonstrated in the heterozygous configuration the patients are actually
          in. It is also based on one allele. The four reported missense alleles have not been through
          the same analysis, and the modelling that predicted them to destabilise the first actin-binding
          domain is in silico.'
      selected_evidence:
        snippet: Notably, neither PLS1 deficiency nor re-expression of human wild-type PLS1 in knockout
          zebrafish reproduces this MET defect. Thus, the mutation not only reduces native PLS1 function
          but also interferes with normal MET channel activity.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41922548
      reference_title: Pathogenic mechanism of the PLS1 gene variant in hearing loss and functional validation
        in a zebrafish model.
      evidence_source: MODEL_ORGANISM
      explanation: 'The observation the whole hypothesis rests on: an effect present with the mutant and
        absent both from the null and from wild-type rescue, which is what "not simple loss of function"
        means operationally.'
