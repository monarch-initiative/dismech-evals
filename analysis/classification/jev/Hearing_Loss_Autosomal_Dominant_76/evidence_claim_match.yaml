  b6f59d0fbc55ee3a32c773819423a88c95c9984596afd3de0276f1d606843e7f:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 76
          disease_term:
            preferred_term: hearing loss, autosomal dominant 76
            term:
              id: MONDO:0032917
              label: hearing loss, autosomal dominant 76
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pls1_onset_heterogeneity
        kind: KNOWLEDGE_GAP
        prompt: DFNA76 onset spans congenital to adult across a handful of families. Is that allele-driven,
          and can a family carrying a PLS1 variant be told when to expect the loss?
        attaches_to:
        - phenotypes#Congenital Onset in Some Families
        - phenotypes#Progressive Sensorineural Hearing Impairment
        - progression#Onset
        rationale: 'The reported families do not agree about when this disease starts. One Chinese family
          failed newborn screening in two generations. The other Chinese family''s loss begins in childhood
          and progresses. The Turkish p.Glu269Lys family was diagnosed postlingually. That is a wider
          onset range than most dominant nonsyndromic hearing loss genes show, and it is currently unexplained.

          Two readings are available and neither has been tested. The alleles may differ in consequence
          - the splice variants remove an internal segment while the missense changes substitute a single
          residue, and it would not be surprising if those produced different ages of onset. Or onset
          may vary within an allele, as it demonstrably does for the unrelated TPRN null in DFNB79, in
          which case a modifier or an environmental contribution is at work and genotype will never answer
          the question.

          Distinguishing them needs no new technology, only aggregation: the published families are individually
          too small, but pooling their audiograms by allele would show immediately whether the two splice
          families cluster apart from the missense families. Nobody has done it, and the reason is prosaic
          - the reports are scattered across four journals in three countries and no DFNA76 registry exists.

          The counselling stake is concrete. A couple whose child carries a PLS1 variant currently cannot
          be told whether to expect a failed newborn screen, a school-age diagnosis, or nothing until
          adulthood, which changes what surveillance to arrange and when.'
      selected_evidence:
        snippet: Affected individuals exhibit progressive, unilateral or bilateral, moderate-to-severe,
          high-frequency hearing loss that begins in childhood and worsens with age.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
