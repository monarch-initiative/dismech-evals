  7b13aab4f062c0fe5b92f9316a24a3c0dbc8aeefb134e258efe44622afe18861:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 78
          disease_term:
            preferred_term: hearing loss, autosomal dominant 78
            term:
              id: MONDO:0033665
              label: hearing loss, autosomal dominant 78
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the Inner-Ear-Restricted NKCC1 Exon 21 Isoform
        biological_scale: MOLECULAR
        description: SLC12A2 produces several isoforms, only one of which contains exon 21. That isoform
          is almost exclusively expressed in the inner ear and is the one required for endolymph homeostasis.
          An exon-21 lesion therefore removes or corrupts a cochlea-specific form of the transporter while
          leaving the widely expressed forms intact - the structural reason a gene active in neurons,
          glia, trachea, salivary glands, intestine and sweat glands yields a hearing-only phenotype.
        molecular_functions:
        - preferred_term: NKCC1 sodium-potassium-chloride cotransport
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0008511
            label: sodium:potassium:chloride symporter activity
        notes: The molecular function is bound to sodium:potassium:chloride symporter activity, which
          is NKCC1's exact activity. What the ontology cannot express is that the lesion removes one isoform
          rather than the activity as a whole; that restriction is carried in the node description and
          in genetic_context.
      selected_evidence:
        snippet: Our case adds to the evidence that loss of exon 21 of SLC12A2 leads to a cochlear restricted
          phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40503591
      reference_title: De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The clinical counterpart of the expression argument: exon-21 loss confines the disease
        to the cochlea.'
