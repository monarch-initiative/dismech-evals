        description: 'The stria itself is smaller in the exon-21-skip mouse, and the authors read that
          as a consequence of the osmotic change rather than as primary degeneration - a rebalancing of
          osmotic pressure, with RNA-seq showing upregulation of Cldn9 interpreted as tissue repair of
          the gaps left by reduced cell size. Curated as its own node because that ordering is a substantive
          claim: it makes strial shrinkage downstream of the secretory defect rather than an independent
          lesion.'
        locations:
        - preferred_term: stria vascularis of cochlear duct
          term:
            id: UBERON:0002282
            label: stria vascularis of cochlear duct
        notes: This node has no downstream edge. The strial change is a readout of the secretory failure
          rather than a further step toward the phenotype, and the hearing loss is drawn from the upstream
          node accordingly.
      selected_evidence:
        snippet: Reduced StV size was considered to be due to rebalance osmotic pressure, and upregulation
          of Cldn9 revealed by RNA-seq was considered as tissue response to repair the gaps from reduced
