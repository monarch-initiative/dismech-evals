        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna78_mouse_dose_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why is the heterozygous exon-21-skip mouse near-normal when the heterozygous human is
          severely to profoundly deaf?
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#Reduced Endolymph Production
        rationale: The mouse reproduces the mechanism convincingly in the homozygous state - reduced endolymph,
          smaller stria, no ABR - and that is why the model is used here. But the dominance does not carry
          across. Heterozygous mice show only mild ABR threshold elevation, in females, at some frequencies,
          whereas heterozygous humans are deaf. The paper itself supplies one candidate explanation, which
          is that human and mouse differ by a single nucleotide at the 5' end of exon 21 and that this
          difference affects exon 21 splicing, so the mouse allele may not produce the same transcript
          mix. A second possibility is that the engineered skip is a null for the isoform while the human
          missense alleles make an interfering product - which would also resolve discussions#dfna78_dominant_mechanism.
          Until that is tested, homozygous-mouse results should not be read as evidence about the human
          heterozygous mechanism.
      selected_evidence:
        snippet: Female Slc12a2Em2/+ mice also exhibited mild elevation of ABR thresholds in several sound
          frequencies.
        supports: SUPPORT
