  6df8e60cd8ab3454be431f2284aeccba4cf4847803976c846d396e5c657dc5e1:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 78
          disease_term:
            preferred_term: hearing loss, autosomal dominant 78
            term:
              id: MONDO:0033665
              label: hearing loss, autosomal dominant 78
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SLC12A2 Exon 21 Variant
        biological_scale: MOLECULAR
        description: A heterozygous variant confined to exon 21 of SLC12A2 - either a missense substitution
          within the exon or a splice-site change that removes it. The reported splice alleles lie on
          both sides of the exon (a 3' splice-site change and a splice-donor deletion), and the consequence
          established by cDNA analysis is an in-frame skip rather than a frameshift, so the product is
          a shortened cotransporter rather than an absent one.
        genes:
        - preferred_term: SLC12A2
          term:
            id: hgnc:10911
            label: SLC12A2
        genetic_context:
          allele_type: missense within exon 21, or splice-site variant causing in-frame skipping of exon
            21
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'LOSS_OF_FUNCTION records what was measured: chloride influx was significantly
            decreased for every DFNA78 variant tested in oocytes, and an independent cohort reproduced
            reduced cotransporter function for all its tested alleles. It deliberately does not record
            DOMINANT_NEGATIVE, even though the disease is dominant and NKCC1 is a dimer. The two allele
            classes may not share a route to dominance - the splice allele was shown to make an exon-21-skipped
            transcript present at much lower levels than the exon-21-included one in cochlea, which reads
            as isoform dose rather than as a poisoned dimer, while a missense subunit could act either
            way. That question is carried in discussions#dfna78_dominant_mechanism rather than settled
            by this tag.'
      selected_evidence:
        snippet: To date, the published pathogenic variants causing DFNA78 are missense mutations located
          within exon 21 or in the 3' splice site of exon 21.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40503591
      reference_title: De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia.
      evidence_source: HUMAN_CLINICAL
      explanation: Independent statement of the same restriction, and the source for the two allele classes
