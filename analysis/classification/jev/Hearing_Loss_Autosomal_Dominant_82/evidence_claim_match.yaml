  f858fcaf03f2a43eb2b0f7536f0ce841f858152802411df309ae360e37178493:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 82
          disease_term:
            preferred_term: hearing loss, autosomal dominant 82
            term:
              id: MONDO:0030719
              label: hearing loss, autosomal dominant 82
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cdh23_modifier_interaction
        hypothesis_label: ATP2B2 as a modifier of hearing loss caused by other genes
        status: ALTERNATIVE
        description: 'A separate and genuine role for ATP2B2 that this entry deliberately does not curate
          as DFNA82. A hypofunctional missense variant, p.Val586Met, was associated with worse hearing
          in three of five siblings homozygous for a CDH23 mutation, and with increased loss in two unrelated
          people whose deafness came from a MYO6 mutation and from noise. The mouse counterpart is well
          characterised: extracellular calcium is needed for the rigidity of cadherin 23 in the tip link,
          and Atp2b2 and Cdh23 alleles interact in a dose- and frequency-dependent way.

          It is recorded here as ALTERNATIVE not because it is doubtful - it is well supported - but because
          it is a claim about a different genotype. The modifier evidence is missense and hypofunctional,
          the DFNA82 evidence is truncating and de novo, and treating a citation about one as evidence
          for the other is the specific error this entry is written to prevent.

          One thing the founding study is careful about and this entry should be too: rare CDH23 variants
          co-occurred with the ATP2B2 allele in all five index cases. The authors argue each of them down
          - intronic and predicted not to affect splicing, synonymous, benign or common in population
          data, failing to co-segregate - and conclude monogenic causation. But they also state that a
          modifying effect of those CDH23 variants cannot be excluded. Monogenic causation and a superimposed
          modifier are not mutually exclusive claims, and this entry asserts the first without denying
          the second.'
      selected_evidence:
        snippet: Genetic evaluation revealed that a homozygous mutation in CDH23 (which encodes cadherin
          23) caused the hearing loss in all five siblings and that a heterozygous, hypofunctional variant
          (V586M) in plasma-membrane calcium pump PMCA2, which is encoded by ATP2B2, was associated with
          increased loss in the three severely affected siblings.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15829536
      reference_title: Modification of human hearing loss by plasma-membrane calcium pump PMCA2.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The founding modifier observation. Note what causes the deafness in these siblings:
        CDH23, in all five. The ATP2B2 variant changes severity, and the sentence says so.'
