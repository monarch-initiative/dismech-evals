          downsloping high-frequency loss diagnosed in the preschool years, rapid progression, and normal
          balance.

          Interpretation has a step most genes do not need. Because ATP2B2 also acts as a severity modifier,
          finding a variant is not the end of the analysis: the founding study sequenced CDH23 in every
          index case and evaluated all rare variants in it before concluding the ATP2B2 allele was the
          monogenic cause. A heterozygous ATP2B2 missense variant found alongside CDH23 variants is a
          different situation from a heterozygous ATP2B2 truncating variant found alone, and the report
          should say which one it is.'
