        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: monogenic_pmca2_haploinsufficiency
        hypothesis_label: Monogenic haploinsufficiency for PMCA2 in outer hair cells
        status: CANONICAL
        description: One truncating or splice-disrupting ATP2B2 allele leaves too little functional PMCA2
          to clear calcium from the stereocilia of outer hair cells, and hearing fails from the high frequencies
          down. This is the model the disease entity is defined by. It is supported in humans by two de
          novo truncating alleles and by segregation of three more, with CDH23 sequenced and excluded
          in the index cases; and in mice by several independent heterozygous lines, each showing progressive
          high-frequency-first loss.
      selected_evidence:
        snippet: Although a digenic inheritance pattern of hearing impairment has been reported for heterozygous
          missense variants of ATP2B2 and CDH23, our findings indicate a monogenic cause of hearing impairment
          in cases with loss-of-function variants of ATP2B2.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
