  316cccf10cfe0bc8c0ccd1d33eacd868f8c51cda7724464c989101d6afd74c29:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 82
          disease_term:
            preferred_term: hearing loss, autosomal dominant 82
            term:
              id: MONDO:0030719
              label: hearing loss, autosomal dominant 82
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: atp2b2_allele_class_determines_disease
        kind: KNOWLEDGE_GAP
        prompt: ATP2B2 carries three human phenotypes - a monogenic dominant deafness, a severity modifier
          for deafness caused by other genes, and a neurodevelopmental movement disorder. Does allele
          class fully determine which one a person gets?
        attaches_to:
        - genetic#ATP2B2
        - mechanistic_hypotheses#monogenic_pmca2_haploinsufficiency
        - mechanistic_hypotheses#cdh23_modifier_interaction
        rationale: 'The current mapping is clean enough to write down and not clean enough to rely on.
          Truncating and splice-site heterozygotes get DFNA82. The hypofunctional missense p.Val586Met
          acts as a modifier. De novo missense changes, and frameshifts in the penultimate exon, cause
          the neurodevelopmental disorder. Three allele classes, three phenotypes.

          Two things spoil the tidiness. The neurodevelopmental series includes frameshift alleles - in
          the penultimate exon, where escape from nonsense-mediated decay would leave a truncated protein
          behind rather than removing it - so "frameshift" alone does not predict the phenotype, and position
          within the gene is doing work that nobody has characterised. And some of those individuals have
          hearing loss as well as the movement and cognitive features, so the phenotypes are not disjoint.
          Meanwhile the cell assays on the neurodevelopmental alleles found both loss- and gain-of-function
          effects on calcium handling, which is a different molecular behaviour from the simple dosage
          reduction DFNA82 is assumed to involve - and that assumption has never been tested, because
          no DFNA82 allele has been assayed for pump function at all.

          The question matters for reporting rather than for biology alone. A laboratory finding a novel
          heterozygous ATP2B2 variant in a child with isolated hearing loss has to decide which of three
          literatures applies, and the deciding features - truncating versus missense, de novo versus
          inherited, position relative to the last exon - are currently a pattern observed across two
          small series rather than a rule anyone has validated.'
        proposed_experiments:
        - experiment_id: exp_dfna82_pump_function_by_allele_class
          name: Calcium-handling assay across all reported ATP2B2 disease alleles
          description: Express each reported human ATP2B2 allele - the five DFNA82 truncating and splice
            alleles, the p.Val586Met modifier, and the neurodevelopmental missense and penultimate-exon
            frameshift alleles - in a common cell background, and measure protein level, plasma-membrane
            targeting, basal and stimulated calcium export, and resting cytosolic calcium, with wild-type
            and empty vector controls. Include a transcript-level assay of nonsense-mediated decay for
            every truncating allele, since whether a truncated protein persists is the variable that distinguishes
            the two frameshift classes.
          would_support:
          - mechanistic_hypotheses#monogenic_pmca2_haploinsufficiency
          supporting_outcome:
          - DFNA82 alleles produce no detectable protein and no export activity while the neurodevelopmental
            alleles produce mistargeted or mixed-function protein, which would make simple dosage the
            DFNA82 mechanism and give laboratories a functional criterion to sort a novel variant by.
          would_refute:
          - mechanistic_hypotheses#monogenic_pmca2_haploinsufficiency
          refuting_outcome:
          - One or more DFNA82 alleles escape nonsense-mediated decay and produce a protein with altered
            rather than absent activity, which would mean DFNA82 is not haploinsufficiency either, would
            place it on the same spectrum as the neurodevelopmental alleles, and would make allele-specific
            silencing rather than gene addition the rational therapy.
      selected_evidence:
        snippet: In cell-based studies, all variants caused significant alterations in cytosolic calcium
          handling with both loss- and gain-of-function effects.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37675773
      reference_title: ATP2B2 de novo variants as a cause of variable neurodevelopmental disorders that
        feature dystonia, ataxia, intellectual disability, behavioral symptoms, and seizures.
      evidence_source: IN_VITRO
      explanation: The molecular contrast with the dosage model assumed for DFNA82, and the reason the
        two cannot be treated as the same lesion at different severities.
