        name: Impaired Calcium Extrusion from Stereocilia
        description: 'PMCA2 is the pump that gets calcium out of a hair cell stereocilium. It sits in
          the stereocilia membrane of inner and outer hair cells and in the basolateral wall, it is the
          primary route for clearing the calcium that enters through the transduction channel, and it
          also supplies calcium to the endolymph on the other side of the membrane - so one pump maintains
          both the low intracellular concentration and part of the extracellular one. Losing it therefore
          has two consequences pointing in opposite directions across the same membrane, and the mouse
          data show both: intracellular dysregulation inside the bundle, and measurably reduced endolymph
          calcium.

          Human DFNA82 alleles are heterozygous, so what is lost is roughly half the pump rather than
          all of it. No measurement of PMCA2 activity or of endolymph composition has been made in a patient,
          and none can be; this node''s mechanism is mouse throughout.'
