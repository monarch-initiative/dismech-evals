              term:
                id: hgnc:815
                label: ATP2B2
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Outer Hair Cell Dysfunction and Degeneration
        relationship: RESCUES
        fidelity: MODERATE
        description: 'The forward test: disable the mutant allele and the cells survive and work. That
          is a stronger argument for outer hair cell PMCA2 dysfunction being the operative lesion than
          the correlation between the allele and the phenotype.'
        limitations: The strategy is allele-specific disruption, which suits a mouse missense allele that
          makes a bad pump. Four of the five human DFNA82 alleles already truncate the protein and the
          fifth destroys a splice donor, so there is nothing dominant left to cut out - destroying a null
          allele achieves nothing, and if the human disease is haploinsufficiency the correct strategy
          is the opposite one, adding a functional copy. Nothing in this study addresses that, and no
          human ATP2B2 allele has been edited. The digenic arm is a mouse carrying two engineered dominant
          mutations, not a model of ATP2B2-CDH23 modification in patients.
        readouts:
        - name: Outer hair cell survival and function after editing
          target: Outer Hair Cell Dysfunction and Degeneration
          direction: RESTORED
          interpretation: Cells that would have degenerated survive and function, and hearing recovers,
            tying the auditory outcome to the outer hair cell population.
      selected_evidence:
        snippet: Using a mouse model Atp2b2Obl/+, with a dominant hearing loss mutation (Oblivion), we
          show that liposome-mediated in vivo delivery of CRISPR-Cas9 ribonucleoprotein complexes leads
          to specific editing of the Obl allele.
        supports: SUPPORT
