  4cd8253b29929c0682b54a544047bf3aee7f85cb61966b253ecc91768f75c98e:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 82
          disease_term:
            preferred_term: hearing loss, autosomal dominant 82
            term:
              id: MONDO:0030719
              label: hearing loss, autosomal dominant 82
        context: []
      assertion_type: Genetic
      assertion:
        name: ATP2B2
        notes: 'ATP2B2 on 3p25.3 encodes PMCA2, one of four plasma-membrane calcium ATPases. In the ear
          it is the resident calcium pump of hair cell stereocilia; it is also expressed in cerebellar
          Purkinje cells and in lactating mammary epithelium, and the gene uses tissue-specific first
          exons, with cochlear hair cell expression carried by the alpha transcript.

          Three distinct human phenotypes are attributed to this gene and they correspond to three allele
          classes, which is the single most important thing to keep straight about it:

          Heterozygous truncating and splice-site alleles cause DFNA82, the isolated rapidly progressive
          high-frequency hearing loss this entry curates. A heterozygous hypofunctional missense allele,
          p.Val586Met, acts as a modifier that worsens hearing loss caused by something else - CDH23,
          MYO6, or noise. And de novo missense changes, plus frameshifts in the penultimate exon, cause
          a neurodevelopmental and movement disorder with dystonia, ataxia, intellectual disability, autistic
          features and seizures; in cell assays those alleles alter cytosolic calcium handling with both
          loss- and gain-of-function effects, which is a different molecular behaviour from simple haploinsufficiency.

          The neurodevelopmental series includes individuals with hearing loss alongside the movement
          and cognitive features, so the two are not cleanly separable by phenotype in every case; they
          are separable by allele class and by whether the presentation is isolated.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: ATP2B2
          term:
            id: hgnc:815
            label: ATP2B2
      selected_evidence:
        snippet: Although a digenic inheritance pattern of hearing impairment has been reported for heterozygous
          missense variants of ATP2B2 and CDH23, our findings indicate a monogenic cause of hearing impairment
          in cases with loss-of-function variants of ATP2B2.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
