            publication: PMID:18974863
            description: 'The best model of the human dominant phenotype, because the informative animal
              here is the heterozygote. Obl/+ mice show increasing hearing impairment from postnatal day
              20 to 90, with hair cell degeneration progressing from cochlear base to apex behind the
              functional loss. Obl/Obl mice are small, severely vestibular by two weeks and deaf from
              birth.

              The allele also carries a lesson about inferring mechanism from position. It sits in a transmembrane
              domain, where such mutations were generally believed to prevent the pump reaching the plasma
              membrane; the protein was in fact correctly targeted and had simply lost much of its non-stimulated
              calcium-exporting ability.'
            genes:
            - preferred_term: ATP2B2
              term:
                id: hgnc:815
                label: ATP2B2
          role: ancestor
