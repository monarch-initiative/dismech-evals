      assertion:
        name: Genetic Counselling with Serial Audiometry from Infancy
        description: 'Counselling for a dominant condition with a 50 percent transmission risk, and scheduled
          audiometry starting well before school age. The surveillance recommendation is forced by the
          natural history rather than being generic: newborn screening is passed, diagnosis currently
          happens at three to six years, and the loss is rapidly progressive once it begins, so a child
          known to carry a familial ATP2B2 truncating allele needs testing on a schedule rather than on
          parental concern. Two of the five index cases arose de novo, which means unaffected parents
          do not exclude the diagnosis in a child.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'No ATP2B2-specific pharmacological treatment has been reported, and no DFNA82-specific
          clinical trial was identified. Hearing amplification and cochlear implantation are standard
          in progressive severe sensorineural hearing loss but no DFNA82-specific outcome data exist,
          so neither is curated here as a treatment - a scoping decision, not a judgement that they are
          inappropriate. Allele-specific gene editing is not curated as a treatment either: the work is
          preclinical, in a mouse missense allele rather than a human truncating one, and is recorded
          under animal_models with its limitations.'
      selected_evidence:
        snippet: Two variants, c.1963G>T (p.Glu655*) and c.955delG (p.Ala319fs), occurred de novo.
