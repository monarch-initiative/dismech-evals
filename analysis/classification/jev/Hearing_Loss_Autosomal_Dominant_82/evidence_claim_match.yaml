              id: MONDO:0030719
              label: hearing loss, autosomal dominant 82
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Rapid progression
        age_range: about 3 to 6 years onwards
        notes: 'Diagnosis falls in the preschool and early school years and the loss then progresses,
          steeply downsloping across the audiogram, reaching profound in the worst-affected subjects.
          The rate has been measured: an age-related typical audiogram over ages 10 to 70 gives an average
          annual threshold deterioration of 0.5 dB/year at low frequencies, 1.1 dB/year at middle frequencies
          and 0.7 dB/year at high frequencies.

          Note what that does and does not say. The deterioration is fastest in the *middle* frequencies,
          not the high ones, even though the loss starts high-frequency-weighted and the audiogram is
          downsloping. Onset configuration and rate of decline are different quantities here, and this
          entry should not be read as claiming the high frequencies also decline fastest. Audiograms below
          age 10 were excluded from the calculation as unreliable, so the rate describes the established
          disease rather than its first years.'
      selected_evidence:
        snippet: mice heterozygous for loss-of-function defects display a rapidly progressive high-frequency
          hearing impairment
        supports: SUPPORT
        directness: INDIRECT
