        target: Outer Hair Cell Dysfunction and Degeneration
        relationship: RECAPITULATES
        fidelity: HIGH
        description: A heterozygous mouse with progressive, high-frequency-first hearing loss and a base-to-apex
          gradient of hair cell degeneration - the same dose, the same direction and the same spatial
          pattern as the human disease. That combination is rare among deafness models, most of which
          are recessive nulls standing in for dominant human conditions.
        limitations: A missense allele that produces a badly working pump, against human alleles that
          truncate the protein or destroy a splice site; whether a hypomorphic pump and a missing one
          fail the same way has not been tested. Homozygotes have a severe vestibular phenotype absent
          from patients, so the model must be read at the heterozygous dose only. The human course runs
          over years and the mouse over about ten weeks.
        readouts:
        - name: Auditory threshold in heterozygotes from P20 to P90
          target: Outer Hair Cell Dysfunction and Degeneration
          direction: INCREASED
          interpretation: Thresholds rise progressively across the period - hearing worsens, so the threshold
            value goes up.
        - name: Non-stimulated calcium export by the mutant pump
          target: Outer Hair Cell Dysfunction and Degeneration
          direction: DECREASED
          interpretation: The pump reaches the membrane but exports less calcium, so the lesion is catalytic
            rather than a trafficking failure.
      selected_evidence:
        snippet: We have characterised a new ENU-induced mouse mutant, Oblivion (allele symbol Obl), showing
          semi-dominant inheritance of hearing impairment.
        supports: SUPPORT
