  f0cc1f2a5e76ebff25c22db1e0cfd770099ad5b4082344d703208c6bfc39e442:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 82
          disease_term:
            preferred_term: hearing loss, autosomal dominant 82
            term:
              id: MONDO:0030719
              label: hearing loss, autosomal dominant 82
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: atp2b2_editing_strategy_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Allele-specific CRISPR editing restores hearing in Oblivion mice, whose mutation makes
          a defective pump. Four of five human DFNA82 alleles already truncate PMCA2. What would editing
          accomplish in a patient?
        attaches_to:
        - animal_models#Atp2b2 Oblivion mouse treated with CRISPR-Cas9 ribonucleoprotein
        - pathophysiology#ATP2B2 Heterozygous Loss of Function
        rationale: 'The Oblivion rescue is a real technical achievement and it is aimed at the wrong lesion
          for this disease. Allele-specific disruption works when the mutant allele is actively harmful
          - a dominant-negative or gain-of-function protein whose removal helps. Oblivion fits: the pump
          is trafficked normally and pumps badly, so a mutant PMCA2 is sitting in the membrane doing a
          poor job, and cutting it out is a coherent intervention.

          DFNA82 alleles are nonsense, frameshift and splice-donor changes. If they behave as the authors
          predict, the mutant allele contributes nothing and there is nothing to disable. Editing it would
          move the patient from one functional copy to one functional copy. The intervention that follows
          from haploinsufficiency is the opposite one - supply a working copy - and that has not been
          attempted for ATP2B2 in any system.

          So the model and the disease agree on the phenotype and disagree on the therapeutic logic, which
          is a more specific mismatch than the usual species caveat and one that could send a translational
          programme in the wrong direction. Resolving it needs the functional assay proposed in the allele-class
          gap above, plus a mouse carrying a human truncating allele rather than Oblivion.

          A smaller mismatch sits alongside. The study''s digenic arm is a mouse engineered to carry two
          dominant deafness mutations, Tmc1 Beethoven and Atp2b2 Oblivion. That is a demonstration that
          two alleles can be edited at once; it is not a model of the ATP2B2-CDH23 modifier interaction
          seen in patients, where the ATP2B2 contribution is a hypofunctional missense variant modifying
          a recessive CDH23 deafness. The word digenic covers both situations and they are not the same
          thing.'
      selected_evidence:
        snippet: Large deletions encompassing the Obl locus and indels were identified as the result of
          editing.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
