  2346cadd777538a0378486a80b91dd0e8e5e0f3c7ffec191d6cf80061cf5a63a:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 82
          disease_term:
            preferred_term: hearing loss, autosomal dominant 82
            term:
              id: MONDO:0030719
              label: hearing loss, autosomal dominant 82
        context: []
      assertion_type: Phenotype
      assertion:
        name: Normal Vestibular Function
        category: Vestibular
        frequency: EXCLUDED
        description: 'There is no vestibular syndrome in DFNA82, and the negative is an examined one -
          but the paper''s abstract states it more strongly than its own results section does, and this
          record follows the results section.

          What was actually found: vestibular history from all subjects and extensive testing of at least
          one affected subject in every family but one revealed only minor vestibular abnormalities. Two
          subjects did report vestibular complaints, and in both the cause was identifiable and unrelated
          to the genotype - benign paroxysmal positional vertigo in one, perilymph leakage after cholesteatoma
          surgery in the other. Testing was incomplete in places: saccular function could not be measured
          in three ears and utricular function in one, and one family was not tested at all.

          Recorded here because the mouse diverges sharply - homozygous Oblivion mice have severe vestibular
          dysfunction by two weeks, and deafwaddler is named for its gait - so an entry that imported
          the animal phenotype wholesale would predict a balance disorder these patients do not have.
          The resolution is allele dose: the human alleles are heterozygous and the florid mouse vestibular
          phenotype belongs to homozygotes.

          `frequency: EXCLUDED` carries the absence, because that is what the HPOA exporter reads to emit
          a NOT-qualified row; `modifier: ABSENT` alone documents intent and is not consulted. Neither
          slot asserts a rate. EXCLUDED remains the right call - minor abnormalities with attributable
          causes are not a vestibular phenotype - but it is a judgement on incomplete testing rather than
          a clean negative, which is why the detail is written out here.'
        phenotype_term:
          preferred_term: Normal vestibular function
          term:
            id: HP:0001751
            label: Abnormal vestibular function
          modifier: ABSENT
      selected_evidence:
        snippet: Two subjects reported vestibular complaints
        supports: SUPPORT
    origin:
