        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Endolymph Calcium
        description: 'The extracellular consequence, measured directly in deafwaddler mice with an aspirating
          microelectrode and a calcium-sensitive dye: endolymph calcium is significantly lower than in
          controls. This matters beyond ionic housekeeping because extracellular calcium is required for
          the rigidity of cadherin 23 in the stereocilia tip link, which is the mechanistic bridge to
          the ATP2B2-CDH23 interaction and the reason a pump defect and an adhesion-molecule defect converge
          on the same structure.

          Whether this arm contributes to human DFNA82 is not known. Endolymph cannot be sampled in a
          patient, and the measurement was made in homozygous mutants, not heterozygotes.'
        biological_scale: TISSUE
        locations:
        - preferred_term: endolymph
          term:
            id: UBERON:0001852
            label: endolymph
        biological_processes:
        - preferred_term: calcium ion transport
          term:
            id: GO:0006816
            label: calcium ion transport
          modifier: DECREASED
      selected_evidence:
        snippet: However, extracellular Ca2+ ions surrounding the stereocilia are also required for rigidity
          of cadherin 23, a component of the stereocilia tip-link encoded by the Cdh23 gene.
        supports: SUPPORT
