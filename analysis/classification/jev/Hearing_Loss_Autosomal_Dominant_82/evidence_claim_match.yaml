            description: Allele-specific gene editing in a dominant deafness model. Liposome-mediated
              in vivo delivery of Cas9 ribonucleoprotein specifically edits the Oblivion allele, producing
              large deletions across the locus and indels; outer hair cell survival and function improve
              and hearing recovers. The same study extends the approach to a double-dominant mouse carrying
              both the Tmc1 Beethoven and the Atp2b2 Oblivion mutations, where targeting both yields partial
              recovery.
            genes:
