  69c5fc98deeec7c93512e8ed2ef73b07c2ea53d74af8f5b9049ec6bf263a51a5:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 83
          disease_term:
            preferred_term: hearing loss, autosomal dominant 83
            term:
              id: MONDO:0030723
              label: hearing loss, autosomal dominant 83
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived iPSC otic sensory neuron-like cells with isogenic CRISPR correction
        experimental_model_type: IPSC_DERIVED_MODEL
        description: 'Induced pluripotent stem cells were reprogrammed from peripheral blood mononuclear
          cells of the affected proband and of a married-in hearing-normal family member, then differentiated
          stepwise into otic sensory neuron-like cells. A third line was made by correcting the p.Ser1400Gly
          allele in the patient line with CRISPR/Cas9, giving an isogenic control that differs from the
          mutant line at one base.

          The three-line design is what raises this above a patient-cell description: mutant, unrelated
          control, and corrected isogenic sibling. Every defect measured moved back toward control in
          the corrected line.'
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        modeled_mechanisms:
        - target: Altered Spiral Ganglion Neuron Excitability
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Correcting the allele restored spike amplitude, width, latency, threshold and potassium
            current to values comparable with the unrelated control line. Because the corrected line is
            isogenic, this is a causality argument about the variant rather than an association between
            genotype and phenotype across lines.
          limitations: Otic sensory neuron-like cells are a directed differentiation product, not spiral
            ganglion neurons; the paper is careful to call them neuron-like. They are also immature, dissociated
            and outside a cochlea, so the tonotopy and the progressive adult-onset course that define
            the human disease cannot be modelled here at all. Only one of the three DFNA83 alleles was
            tested.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: The cochlear environment is outside the model. Hair cell input, ribbon synapses,
              the tonotopic gradient and the endocochlear potential are all absent, so the model cannot
              report on how a neuronal excitability deficit becomes a frequency-specific threshold shift.
          - divergence_type: POPULATION_MISMATCH
            materiality: QUALIFYING
            description: Every line derives from one family and one allele, p.Ser1400Gly. The two other
              reported DFNA83 alleles, p.Ile923Thr and p.Phe1838Leu, are untested in any system.
          readouts:
          - name: Action potential amplitude, width, latency and activation threshold
            target: Altered Spiral Ganglion Neuron Excitability
            direction: RESTORED
            interpretation: In the mutant line spike amplitude fell to 42 percent of control, width rose
              to 196 percent, latency to 145 percent and threshold to 139 percent; the corrected line
              was comparable with control on all four.
        - target: Impaired Neurite Extension in Spiral Ganglion Neurons
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Mutant neurites averaged 140 micrometres against 198 in control, a 30 percent reduction,
            with the corrected line at 187.
          limitations: Neurite length in a dish is a proxy for peripheral process integrity in the cochlea,
            which was not measured in humans and cannot be.
          readouts:
          - name: Neurite length in differentiated otic sensory neuron-like cells
            target: Impaired Neurite Extension in Spiral Ganglion Neurons
            direction: DECREASED
            interpretation: A 30 percent shortening, reversed by correction of the allele.
      selected_evidence:
        snippet: Using otic sensory neuron-like cells, generated by pluripotent stem cells from patients
          carrying the MAP1B mutation and control subject, we demonstrated that the p.1400S>G mutation
          caused the reduced levels and deficient phosphorylation of MAP1B
        supports: SUPPORT
