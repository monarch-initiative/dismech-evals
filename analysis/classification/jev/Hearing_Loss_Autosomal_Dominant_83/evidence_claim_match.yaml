          controls. The other two alleles were absent from asymptomatic relatives and from the same 206
          controls.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Three novel heterozygous MAP1B mutations (c.4198A>G, p.1400S>G; c.2768T>C, p.923I>T;
          c.5512T>C, p.1838F>L) were cosegregated with autosomal dominant inheritance of nonsyndromic
          sensorineural hearing loss in 3 unrelated Chinese families.
        supports: SUPPORT
