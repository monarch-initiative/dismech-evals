  aa0626189b9a4b677aa49a692bb8df5fe5b7edd003bc616c439bb42c7cbaa1c5:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 83
          disease_term:
            preferred_term: hearing loss, autosomal dominant 83
            term:
              id: MONDO:0030723
              label: hearing loss, autosomal dominant 83
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna83_null_mouse_versus_missense_human
        kind: HUMAN_MODEL_MISMATCH
        prompt: The mouse is a heterozygous null and the patients carry missense alleles. Is DFNA83 haploinsufficiency,
          or does the missense protein do something a null cannot?
        attaches_to:
        - animal_models#Map1b heterozygous knockout mouse
        - pathophysiology#Reduced MAP1B Level and Deficient Type I Phosphorylation
        rationale: 'The mouse result is the strongest in vivo evidence in this entry, and its allele does
          not match the disease. The authors bridge that gap with biochemistry rather than genetics: heterozygous
          mouse brain has 69 percent of wild-type type I phosphorylation and patient-derived cells have
          69 percent, so the two systems arrive at the same functional deficit by different routes. That
          is a reasonable argument and it is not the same as demonstrating that the human allele is a
          loss of function.

          Where it matters is the mutant protein itself. Patient cells retain 63 percent of normal MAP1B,
          so there is a substantial amount of Ser1400Gly protein present, binding microtubules while unable
          to be phosphorylated at that site. A null mouse has no such protein. If the human phenotype
          has any dominant negative component, from mutant MAP1B occupying microtubules it can no longer
          regulate, the mouse cannot show it and would understate the disease. The hyperstabilisation
          result is at least consistent with that reading, since removing a protein and jamming it in
          place are different ways to lose dynamism.

          There is now a much sharper reason to doubt the null mouse, and it postdates the founding paper.
          Human MAP1B loss-of-function alleles have their own phenotype, and it is not deafness: heterozygous
          truncating variants cause periventricular nodular heterotopia 9, a neuronal migration disorder.
          A 2025 review of the MAP1B genotype-phenotype literature concluded that loss-of-function variants
          mainly give PVNH-related neurological disease while missense variants may present with deafness
          alone. So the mouse used to prove DFNA83 in vivo carries the allele class that in humans causes
          a brain malformation instead. Either mouse and human differ in which tissue is dosage-limiting
          for MAP1B, or the human missense alleles are not acting by simple loss of function, and the
          two possibilities have opposite consequences for how much weight the mouse can bear.

          That does not make the mouse uninformative. Its dissociation of raised ABR thresholds from preserved
          otoacoustic emissions is a clean result and is the strongest evidence anywhere that the DFNA83
          lesion is neural. But it means the mouse establishes what reduced MAP1B does to spiral ganglion
          neurons, not that the human alleles reduce MAP1B in the way the mouse does.

          A knock-in mouse carrying Ser1400Gly would settle it. None exists.'
      selected_evidence:
        snippet: Involvement of MAP1B in hearing was confirmed by audiometric evaluation of Map1b heterozygous
          KO mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
