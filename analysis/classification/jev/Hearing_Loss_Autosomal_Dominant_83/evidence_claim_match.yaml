            term:
              id: MONDO:0030723
              label: hearing loss, autosomal dominant 83
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna83_auditory_neuropathy_management
        kind: KNOWLEDGE_GAP
        prompt: If DFNA83 is a spiral ganglion disorder with working outer hair cells, does hearing amplification
          help, and is a cochlear implant the better option? Nothing has been reported either way.
        attaches_to:
        - pathophysiology#Failure of Auditory Nerve Signal Transmission
        - phenotypes#Abnormal auditory brainstem response with preserved otoacoustic emissions
        - treatments#
        rationale: 'This is the clinically consequential gap in the entry, and it follows directly from
          the mechanism rather than being a generic call for more research. A hearing aid amplifies sound
          so that a cochlea can transduce it. In DFNA83 the cochlea already transduces it, which is what
          the preserved otoacoustic emissions show; what fails is the neuron carrying the result to the
          brainstem. In other auditory neuropathies that configuration predicts poor benefit from amplification
          and better outcomes from cochlear implantation, which bypasses the hair cell and stimulates
          the ganglion directly. Whether that generalises to DFNA83 is unknown, and there is a specific
          reason to hesitate: implant performance depends on the health of the spiral ganglion neurons
          being stimulated, and those are precisely the cells this disease affects. The mouse offers a
          small piece of reassurance, since spiral ganglion neuron density was normal, so the target population
          may be present even if it fires poorly.

          The entry therefore carries no treatments section at all. That is a deliberate absence: the
          three published families were reported for gene discovery and no management outcome was recorded
          for any of them.'
      selected_evidence:
        snippet: there were no significant difference of distortion product otoacoustic emissions (DPOAE)
          measurements between affected subjects and hearing-normal controls
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
