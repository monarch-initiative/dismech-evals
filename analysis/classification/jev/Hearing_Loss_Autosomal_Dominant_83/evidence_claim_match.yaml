          69 percent. Both were restored in the CRISPR-corrected isogenic line, to 90 and 96 percent.
          The same phosphorylation deficit was reproduced in the brain of heterozygous Map1b knockout
          mice, at 69 percent of wild-type littermates, which is the observation the authors use to argue
          the mouse recapitulates the patient biochemistry rather than merely sharing a gene.
