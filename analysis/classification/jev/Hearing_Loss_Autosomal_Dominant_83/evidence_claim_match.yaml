  dfd8dd1df305e82458a02e4414fbcbb7f2851b00b541dc55222de6caec80dc30:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Dominant 83
          disease_term:
            preferred_term: hearing loss, autosomal dominant 83
            term:
              id: MONDO:0030723
              label: hearing loss, autosomal dominant 83
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna83_two_untested_alleles
        kind: KNOWLEDGE_GAP
        prompt: Two of the three reported DFNA83 alleles, p.Ile923Thr and p.Phe1838Leu, have never been
          tested in any experimental system. Do they act by the mechanism curated here?
        attaches_to:
        - pathophysiology#Heterozygous MAP1B Missense Variants at Conserved Residues
        - genetic#MAP1B
        rationale: 'Everything in the pathophysiology section derives from p.Ser1400Gly, and there is
          a structural reason the other two might behave differently. Ser1400 was chosen for functional
          work precisely because it is a known phosphorylation site in the microtubule-assembly domain,
          so the phosphorylation deficit that drives the whole chain is a property of that residue''s
          identity. Ile923 and Phe1838 are conserved but are not phosphosites, and a missense change at
          either could plausibly act through protein stability, microtubule binding affinity or something
          else entirely without ever reproducing the SMI-31 deficit.

          The reporting group said as much, classifying only p.Ser1400Gly as very likely deleterious and
          leaving the others as needing further exploration. Until somebody tests them, this entry describes
          the mechanism of one allele and asserts a shared gene for three.'
      selected_evidence:
        snippet: Based on in silico predictions and the incidences of their variants in the general population,
          the p.1400S>G variant is very likely deleterious, while the p.923I>T and p.1838F>L variants
          need to be further explored.
        supports: SUPPORT
