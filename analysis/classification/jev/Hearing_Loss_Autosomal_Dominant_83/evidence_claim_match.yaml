        context: []
      assertion_type: Genetic
      assertion:
        name: MAP1B
        notes: 'The only gene reported for DFNA83. Expression is the reason it acts in the ear the way
          it does: MAP1B is abundant in spiral ganglion neurons and weak in hair cells, so a dosage-sensitive
          MAP1B lesion is predicted to hit the neuron and spare the sensory epithelium, which is what
          the mouse shows.'
        gene_term:
          preferred_term: MAP1B
          term:
            id: hgnc:6836
            label: MAP1B
        relationship_type: CAUSATIVE
        variants:
        - name: NM_005909.4:c.4198A>G (p.Ser1400Gly)
          type: missense
          clinical_significance: LIKELY_PATHOGENIC
          description: 'The founding allele, in the microtubule-assembly domain at a conserved phosphorylation
            site required for embryonic cortical neuron function. Present in all seven affected and none
            of thirteen unaffected members of the index pedigree, and absent from 863 unrelated hearing-impaired
            probands and 206 hearing-normal controls. This is the only DFNA83 allele with functional data:
            it reduces MAP1B protein to 63 percent of control and type I phosphorylation to 69 percent,
            and correcting it by CRISPR restores both. Recorded as LIKELY_PATHOGENIC because that is the
            reporting group''s own assessment, which called it very likely deleterious rather than definitively
            so.'
        - name: NM_005909.4:c.2768T>C (p.Ile923Thr)
          type: missense
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          description: Found in the SD061 pedigree, present in affected and absent from asymptomatic members
            and from 206 hearing-normal controls. At a conserved residue but not a phosphosite, and untested
            in any experimental system. The reporting group said it needed further exploration, which
            is why it is recorded as uncertain here rather than inheriting the founding allele's classification.
        - name: NM_005909.4:c.5512T>C (p.Phe1838Leu)
          type: missense
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          description: Found in the SD234 pedigree, with the same segregation and control data and the
            same absence of functional testing as p.Ile923Thr.
      selected_evidence:
        snippet: Strikingly, Map1b is abundantly expressed in the spiral ganglions but is weak in hair
          cells.
        supports: SUPPORT
