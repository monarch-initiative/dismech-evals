            term:
              id: MONDO:0030723
              label: hearing loss, autosomal dominant 83
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Gene panel or exome sequencing, prompted by a neural audioprofile
        description: 'DFNA83 has no distinguishing clinical feature outside the ear and cannot be diagnosed
          without sequencing. In the founding families a targeted panel of 89 known deafness-associated
          genes returned nothing, and the gene was found only on whole exome sequencing, so an older or
          narrower panel will not contain MAP1B.

          What can be done before sequencing is to narrow the differential. The audiological signature
          of DFNA83 is a dissociation: raised auditory brainstem response thresholds with distortion product
          otoacoustic emissions indistinguishable from hearing-normal controls. That pattern is the pattern
          of auditory neuropathy rather than of the hair cell disorders that account for most dominant
          deafness, and it is what led the founding group to look at spiral ganglion biology in the first
          place. A patient with dominant progressive sensorineural loss and preserved emissions is a reason
          to sequence broadly rather than to re-run a hair cell panel.'
      selected_evidence:
        snippet: Initial targeting exome sequencing analyses of 89 reported deafness-associated genes
          failed to identify any mutations
        supports: SUPPORT
