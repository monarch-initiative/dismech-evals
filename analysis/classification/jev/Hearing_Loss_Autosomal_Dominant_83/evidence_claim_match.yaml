          name: Hearing Loss Autosomal Dominant 83
          disease_term:
            preferred_term: hearing loss, autosomal dominant 83
            term:
              id: MONDO:0030723
              label: hearing loss, autosomal dominant 83
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Microtubule Hyperstabilisation in the Growth Cone
        description: 'The counterintuitive step. Losing a microtubule-associated protein makes the cytoskeleton
          more stable, not less: acetylated alpha-tubulin, a marker of stabilised microtubules, rose to
          168 percent of control in mutant cells and was elevated specifically in the growth cones of
          developing axons, and mutant cells resisted depolymerisation by vinblastine. Phosphorylated
          MAP1B maintains the pool of dynamic microtubules, so losing that phosphorylation removes dynamism
          rather than structure. The corrected line returned to 75 percent of control.

          Growth cone steering and axon extension require microtubules that can depolymerise as well as
          polymerise, which is the mechanistic reason a stabilised cytoskeleton is a defect here.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: spiral ganglion neuron
          term:
            id: CL:0011113
            label: spiral ganglion neuron
        biological_processes:
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: marked increases in acetylation of α-tubulin were observed in the growth cones of developing
          axons carrying the p.1400S>G mutation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33268592
      reference_title: Mutations of MAP1B encoding a microtubule-associated phosphoprotein cause sensorineural
        hearing loss.
      evidence_source: IN_VITRO
      explanation: Localises the cytoskeletal change to the growth cone, which is what connects it to
        the neurite extension defect below.
