            label: action potential
          modifier: ABNORMAL
        - preferred_term: potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: Peak outward K+ current densities at all test potentials are significantly (P < 0.001)
          lower in Map1b+/– SGNs than those in WT SGNs
        supports: SUPPORT
