            term:
              id: MONDO:0030723
              label: hearing loss, autosomal dominant 83
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous MAP1B Missense Variants at Conserved Residues
        description: 'Three alleles are reported: p.Ser1400Gly, p.Ile923Thr and p.Phe1838Leu, all at residues
          conserved across human, chimpanzee, macaque, dog, mouse and rat. Ser1400 sits in the microtubule-assembly
          domain at a phosphorylation site already known to be required for embryonic cortical neuron
          function, which is why it was the allele taken forward for functional work.

          The three alleles are not equally supported, and the entry does not pretend otherwise. The reporting
          group''s own ACMG assessment called p.Ser1400Gly very likely deleterious and said the other
          two needed further exploration. Every functional result below is from p.Ser1400Gly.

          Allele class matters more here than it does for most deafness genes, because MAP1B has a second,
          non-auditory phenotype that separates by allele type rather than by position. Heterozygous loss-of-function
          alleles cause periventricular nodular heterotopia 9, a neuronal migration disorder, and a 2025
          review of the MAP1B literature found that missense alleles are the ones that present with deafness
          alone. DFNA83 is therefore not simply the mild end of a MAP1B dosage spectrum, and treating
          it as haploinsufficiency would predict the wrong disease.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MAP1B
          term:
            id: hgnc:6836
            label: MAP1B
      selected_evidence:
        snippet: Based on in silico predictions and the incidences of their variants in the general population,
          the p.1400S>G variant is very likely deleterious, while the p.923I>T and p.1838F>L variants
          need to be further explored.
        supports: SUPPORT
    origin:
