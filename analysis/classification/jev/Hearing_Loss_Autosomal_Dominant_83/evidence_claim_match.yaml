          value:
            name: Map1b heterozygous knockout mouse
            species: Mouse
            genotype: Map1b+/-, CRISPR/Cas9 frameshift producing p.Leu139*
            publication: PMID:33268592
            description: A CRISPR-generated frameshift null. Heterozygotes are viable; homozygotes survive
              only about ten days after birth, so all auditory work is in the heterozygote. Heterozygous
              brain has 40 percent less MAP1B protein and 69 percent of wild-type type I phosphorylation,
              matching the biochemical deficit measured in patient-derived cells.
            genes:
            - preferred_term: MAP1B
              term:
                id: hgnc:6836
                label: MAP1B
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Failure of Auditory Nerve Signal Transmission
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: The mouse is where the dissociation between neural and cochlear function is established.
          ABR thresholds are raised at every frequency and age tested from 4 to 32 weeks, DPOAEs are unimpaired
          throughout, and cochlear histology shows neither hair cell loss nor reduced spiral ganglion
          neuron density. That is not merely consistent with a neuronal lesion, it excludes the cochlear
          alternative in this species.
        limitations: 'Allele mismatch is the main gap: the mouse is a heterozygous null, whereas the human
          alleles are missense changes at conserved residues whose mode of action, whether haploinsufficiency
          or something else, has not been established. The paper''s own argument for equivalence is the
          shared phosphorylation deficit rather than a matched allele. Mouse onset is also earlier relative
          to lifespan, with thresholds already raised at 4 weeks, against late onset in the human families.'
        divergences:
        - divergence_type: PROXY_QUANTITY
          materiality: QUALIFYING
          description: The manipulated quantity is Map1b gene dosage, halved by a null allele. The human
            quantity is the activity of a missense MAP1B protein present at 63 percent of normal with
            disproportionately reduced phosphorylation. These are similar in direction but not the same
            lesion, and a missense protein can retain or distort functions a null cannot.
        readouts:
        - name: Auditory brainstem response threshold
          target: Failure of Auditory Nerve Signal Transmission
          direction: INCREASED
          interpretation: Raised at click and at 8, 12, 24 and 32 kHz in heterozygotes at every age tested,
            with slow progression from 4 to 32 weeks.
        - name: Distortion product otoacoustic emission threshold
          target: Failure of Auditory Nerve Signal Transmission
          direction: UNCHANGED
          interpretation: A real negative result, and the one that makes the lesion neural. Outer hair
            cell function is preserved at every age at which ABR thresholds are already raised.
        - name: Cochlear hair cell morphology and spiral ganglion neuron density
          target: Failure of Auditory Nerve Signal Transmission
          direction: UNCHANGED
          interpretation: Phalloidin staining of the organ of Corti showed no hair cell loss or bundle
            abnormality, and spiral ganglion neuron density was unchanged. The deficit is functional,
            not degenerative, at least at the ages examined.
      selected_evidence:
        snippet: Map1b deficiency yielded defects in the morphology and electrophysiology of spiral ganglion
          neurons, but it did not affect the morphologies of cochlea in mice.
        supports: SUPPORT
