        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Spiral Ganglion Neuron Excitability
        description: 'Whole-cell patch clamp in both systems found the same pattern: reduced spike amplitude,
          prolonged spike width, longer latency, a raised action potential threshold, and reduced outward
          potassium current. In mouse spiral ganglion neurons the peak potassium current density at 60
          millivolts was 48 percent of wild type. In patient-derived neurons every one of these parameters
          was restored by CRISPR correction of the allele.

          This is the node that most directly explains the audiogram, because a spiral ganglion neuron
          that fires late, small and blunt will degrade the auditory brainstem response while leaving
          cochlear amplification untouched.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: spiral ganglion neuron
          term:
            id: CL:0011113
            label: spiral ganglion neuron
        biological_processes:
