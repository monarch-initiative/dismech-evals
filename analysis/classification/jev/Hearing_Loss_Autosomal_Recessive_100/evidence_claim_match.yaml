        context: []
      assertion_type: AnimalModel
      assertion:
        name: Ppip5k2 gene-trap mouse (Ppip5k2K^)
        species: Mouse
        genotype: B6N(Cg)-Ppip5k2tm1a(EUCOMM)Wtsi/J gene trap between exons 13 and 14; homozygous and
          heterozygous
        background: C57BL/6N
        publication: PMID:29590114
        description: A KOMP gene-trap allele that truncates the phosphatase domain to 84 residues while
          leaving the kinase domain intact. The equivalent truncated human protein converts 5-InsP7 to
          InsP8 at 23-fold the rate of full-length enzyme, so the allele models elevated kinase output
          rather than loss of the protein. Homozygotes develop late-onset, progressive, high-frequency
          threshold elevation with basal-turn outer hair cell loss; heterozygotes show a milder version
          of the same.
        modeled_mechanisms:
        - target: Outer Hair Cell Dysfunction and Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Reproduces selective outer hair cell degeneration with inner hair cells spared,
            the cellular lesion inferred in humans from absent otoacoustic emissions.
          limitations: The allele is a phosphatase-domain truncation, not the human p.Arg837His missense
            substitution, and it produces a far larger kinase gain (23-fold in the equivalent human construct)
            than the missense allele does (60% more IP8). Degeneration is confined to the basal turn at
            P150 and is late-onset and progressive, whereas the human phenotype is prelingual and profound
            across the audiometric range. The C57BL/6 background is itself susceptible to age-related
            hearing loss, and wild-type controls also showed elevated 32 kHz thresholds at P120 and P150.
            Ppip5k1 message is upregulated nearly 3-fold in the mutant inner ear, a compensatory change
            with no human counterpart described.
          readouts:
          - name: Outer hair cell count in the basal cochlear turn at P150
            target: Outer Hair Cell Dysfunction and Degeneration
            direction: DECREASED
            interpretation: Histological quantification of the cellular lesion, with inner hair cell counts
              as an internal negative control.
        - target: Prelingual bilateral severe-to-profound sensorineural hearing loss
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: The mouse does not reproduce the human audiometric phenotype. Its hearing is normal
            at P60 and deteriorates from high frequencies with age; the human phenotype is severe-to-profound
            from birth across the range.
          limitations: Recorded as a failure rather than a partial recapitulation because the two phenotypes
            differ in onset, severity and audiometric shape, and the authors say so themselves. They suggest
            greater functional redundancy of PPIP5K2 in mouse, or genetic and environmental modifiers,
            as possible reasons; none has been tested. The allele difference (truncation versus missense)
            is a further confound, so the mismatch cannot be attributed to species alone.
      selected_evidence:
        snippet: Based on these findings, we conclude that the Ppip5k2 mutant mice likely expresses a
          “hyper kinase” activity.
        supports: SUPPORT
