      assertion:
        name: Loss of Cochlear Amplification
        role: consequence
        biological_scale: TISSUE
        description: Without functioning outer hair cells the cochlea loses its active amplifier, and
          the sensitivity and frequency selectivity it provides. In humans the endpoint is prelingual
          severe-to-profound loss across the audiometric range; in the mouse it is a late-onset, progressive,
          high-frequency threshold elevation with reduced ABR wave I amplitude. The two do not match,
          and the human phenotype is the more severe.
      selected_evidence:
        snippet: However, these affected individuals (V:2, V:3, V:5) failed a transient evoked otoacoustic
          emission test, which is indicative of defective outer hair cell function.
        supports: SUPPORT
