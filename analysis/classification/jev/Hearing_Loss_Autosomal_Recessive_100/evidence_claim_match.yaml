        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb100_insp8_to_hair_cell_death_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does an increased InsP8 signal kill outer hair cells, and why are outer
          hair cells selectively vulnerable when PPIP5K2 is expressed throughout the cochlear duct?
        attaches_to:
        - pathophysiology#Increased Metabolic Flux from 5-InsP7 to InsP8
        - pathophysiology#Outer Hair Cell Dysfunction and Degeneration
        rationale: 'The step from raised InsP8 to hair cell injury is unmeasured. The founding report
          offers two untested possibilities - that PP-IP synthesis is pro-apoptotic, and that outer hair
          cell loss follows bioenergetic imbalance - and neither apoptosis nor cochlear bioenergetics
          was assayed in this disease. Nor is the selectivity explained: PPIP5K2 protein is present in
          inner as well as outer hair cells, supporting cells, spiral ganglion neurons and all three layers
          of the stria vascularis, yet only outer hair cells degenerate, with stria and ganglion histologically
          normal at P150. This is the reason the entry does not conform to the module''s oxidative-stress
          or apoptotic effector nodes.'
      selected_evidence:
        snippet: No obvious indications of stria vascularis atrophy or spiral ganglion neuron degeneration
          were found in Ppip5k2K^/ K^ mice at P150 (S6 Fig).
        supports: SUPPORT
