        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PPIP5K2 Arg837His Catalytic Imbalance
        role: trigger
        biological_scale: MOLECULAR
        description: The Arg837His substitution lies in the histidine acid phosphatase domain of PPIP5K2,
          whose kinase and phosphatase activities compete to set the 5-InsP7/InsP8 balance. Purified recombinant
          PPIP5K2-R837H has 21% lower IP8 phosphatase activity than wild type and, rather than being self-correcting,
          accumulates 60% more IP8 in the kinase assay. The two arms therefore act in the same direction,
          and the authors attribute the disproportionate kinase effect to altered conformational coupling
          between the domains.
        molecular_functions:
        - preferred_term: PPIP5K2 IP8 phosphatase activity
          term:
            id: GO:0008486
            label: diphosphoinositol-polyphosphate diphosphatase activity
          modifier: DECREASED
        - preferred_term: PPIP5K2 5-InsP7 kinase activity
          term:
            id: GO:0000829
            label: diphosphoinositol pentakisphosphate kinase activity
          modifier: INCREASED
        genetic_context:
          gene:
            preferred_term: PPIP5K2
            term:
              id: hgnc:29035
              label: PPIP5K2
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: HYPERMORPHIC
          description: 'Recorded as HYPERMORPHIC on the net enzymatic output, because the allele raises
            production of the InsP8 signal. This is a judgement over a bifunctional enzyme and is worth
            stating explicitly: the phosphatase arm is partially lost while the kinase arm is gained,
            so neither PARTIAL_LOSS_OF_FUNCTION nor a plain GAIN_OF_FUNCTION describes the allele on its
            own, and the single-valued slot forces a choice. The paper''s own framing is the increase
            - it calls the equivalent mouse allele a hyper kinase.'
      selected_evidence:
        snippet: To the best of our knowledge, this is the first study demonstrating the necessity of
          PP-IP metabolism for inner ear development and hearing function.
        supports: SUPPORT
