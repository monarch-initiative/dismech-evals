              label: hearing loss, autosomal recessive 100
        context: []
      assertion_type: Genetic
      assertion:
        name: PPIP5K2
        gene_term:
          preferred_term: PPIP5K2
          term:
            id: hgnc:29035
            label: PPIP5K2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: PPIP5K2 (diphosphoinositol pentakisphosphate kinase 2, 5q21.1) encodes a large bifunctional
          enzyme with an N-terminal kinase domain, a histidine acid phosphatase domain, and an intrinsically
          disordered region. Despite the phosphatase-family fold it is the kinase activity that defines
          the protein's role, synthesising InsP8 from 5-InsP7. Humans carry a paralogue, PPIP5K1, but
          in mouse inner ear Ppip5k1 transcript levels in hair cells, supporting cells and ganglion neurons
          are up to 100-fold below Ppip5k2, which is why loss of PPIP5K2 function is not buffered in the
          cochlea. The gene also carries the aliases HISPPD1, VIP2, IP7K2 and CFAP160; the last is a cilia-and-flagella
          designation and is not the basis of the hearing phenotype described here.
        variants:
        - name: PPIP5K2 c.2510G>A p.(Arg837His)
          description: The only PPIP5K2 allele so far associated with human disease. It substitutes an
            arginine conserved from Drosophila to human, nine residues C-terminal to the histidine that
            is catalytically essential for IP8 phosphatase activity in the yeast orthologue, and it is
            present in all eleven annotated PPIP5K2 splice isoforms. It was absent from 180 ethnically
            matched Pakistani controls and sits at 0.000146 in ExAC. A shared flanking haplotype in the
            two families indicates a founder allele rather than two independent mutational events.
          gene:
            preferred_term: PPIP5K2
            term:
              id: hgnc:29035
              label: PPIP5K2
      selected_evidence:
        snippet: Here, we report a severe-to-profound sensorineural hearing loss locus, DFNB100 on chromosome
          5q13.2-q23.2.
        supports: SUPPORT
