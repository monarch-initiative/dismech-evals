      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        description: 'Both reported families are consanguineous Pakistani kindreds in which affected individuals
          are homozygous for PPIP5K2 c.2510G>A and unaffected relatives are not. Penetrance and expressivity
          are recorded as UNKNOWN rather than COMPLETE and CONSISTENT: only two families and a single
          allele have been described, which is too little to support a quantitative statement either way.
          Worth noting for counselling is that human heterozygotes are unaffected, whereas heterozygous
          Ppip5k2 gene-trap mice show a measurable high-frequency threshold shift and basal-turn outer
          hair cell loss - so the mouse allele behaves semi-dominantly while the human allele does not.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: UNKNOWN
        expressivity: UNKNOWN
      selected_evidence:
        snippet: Exome enrichment followed by massive parallel sequencing revealed a c.2510G>A transition
          variant in PPIP5K2 that segregated with DFNB100-associated hearing loss in two large apparently
          unrelated Pakistani families.
        supports: SUPPORT
