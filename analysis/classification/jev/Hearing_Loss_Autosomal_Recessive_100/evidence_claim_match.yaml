  b9d573d94e653842e147666e81e9e40820880a8ab566594de633f4649ca5bd3e:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 100
          disease_term:
            preferred_term: hearing loss, autosomal recessive 100
            term:
              id: MONDO:0032740
              label: hearing loss, autosomal recessive 100
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb100_mouse_human_severity_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why is the Ppip5k2 mouse phenotype late-onset, high-frequency and mild when the human
          p.(Arg837His) phenotype is prelingual and profound, and does the mouse therefore support the
          human causal chain at all?
        attaches_to:
        - pathophysiology#Loss of Cochlear Amplification
        - animal_models#Mouse
        rationale: 'The mouse is the only in vivo evidence that PPIP5K2 dysfunction causes hearing loss,
          and it disagrees with the human disease on every clinical axis: onset (P60 normal versus deaf
          from birth), severity (threshold shift versus profound loss), audiometric shape (basal/high-frequency
          first versus flat profound), and course (progressive versus prelingual and static). It also
          differs in allele - a phosphatase-domain truncation with a 23-fold kinase gain versus a missense
          substitution with a 60% gain - so species and allele are confounded. Two further features have
          no human counterpart: heterozygous mice are measurably affected, and mutant inner ear upregulates
          Ppip5k1 nearly 3-fold. Resolving this matters because the strength of the whole causal chain
          below the enzymology rests on this model.'
      selected_evidence:
        snippet: Also, Ppip5k2+/K^ mice exhibited elevated hearing thresholds loss at higher frequencies
          [24 kHz (*p<0.05) and 32 kHz].
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
