              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CLDN9 Truncating Loss of Function
        description: The founding allele, homozygous c.86delT (p.Leu29ArgfsTer4), truncates claudin-9
          at the start of the first extracellular loop. Because CLDN9 has a single coding exon, a premature
          stop is unlikely to trigger nonsense-mediated decay, so the truncated protein may be made and
          simply fail to work. GFP-tagged mutant protein expressed in HEK293 cells stays in the cytosol
          instead of reaching the plasma membrane, so no functional claudin-9 is delivered to the junction.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CLDN9
          term:
            id: hgnc:2051
            label: CLDN9
        genetic_context:
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          allele_type: single-base deletion causing a frameshift and premature termination
          functional_impact_category: LOSS_OF_FUNCTION
          description: CLDN9 NM_020982.3:c.86delT, p.Leu29ArgfsTer4, homozygous in three affected members
            of a consanguineous Turkish family.
      selected_evidence:
        snippet: This suggests that the variant disrupts the migration of CLDN9 to the plasma membrane.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
