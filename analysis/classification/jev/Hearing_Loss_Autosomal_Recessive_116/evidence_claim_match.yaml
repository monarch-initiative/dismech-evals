              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cldn9_cys25trp_allele_uncertain
        kind: KNOWLEDGE_GAP
        prompt: Is the CLDN9 c.75C>G p.(Cys25Trp) allele reported in a child with fluctuating hearing
          loss actually pathogenic, and does fluctuating hearing loss belong in the DFNB116 phenotype?
        attaches_to:
        - genetic#CLDN9
        - phenotypes#Bilateral Sensorineural Hearing Impairment
        rationale: 'A fourth individual has been reported with a CLDN9 missense allele at a highly conserved
          cysteine and a steeply sloping, fluctuating audiogram. It is deliberately excluded from this
          entry''s phenotype and prevalence counts. The reasons are specific rather than generic caution:
          the same individual carried variants in FLNA and ANKRD11 and had unrelated upper airway findings,
          no functional work was done on the allele, and the subsequent authors said in print that more
          evidence would be needed.

          Fluctuation is the part worth resolving, because it is not merely an extra severity tier - it
          would be a different mechanism. Nothing in the potassium-leak model predicts a hearing threshold
          that recovers, since hair cell death does not reverse. A genuinely fluctuating CLDN9 phenotype
          would imply a reversible functional disturbance of the barrier rather than progressive cell
          loss, and that would change how the whole entry reads. Establishing it needs functional characterisation
          of p.(Cys25Trp) and at least one more family.'
      selected_evidence:
        snippet: Recently, a c.75C>G;p.(Cys25Trp) CLDN9 variant was suggested to cause fluctuating hearing
          loss with a steeply sloping audiogram in one individual
        supports: SUPPORT
