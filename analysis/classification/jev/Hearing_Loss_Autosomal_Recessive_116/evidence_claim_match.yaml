  ed748a0f22e797c1c03a9f4989f7c8efc415e8b74195cd814719cbfa0f7c6716:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 116
          disease_term:
            preferred_term: hearing loss, autosomal recessive 116
            term:
              id: MONDO:0033670
              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Cldn9 tet-OFF conditional knockdown mouse
        species: Mouse
        genotype: Cldn9+/T tet-OFF transgenic on doxycycline, approximately 8-fold reduced claudin-9 protein
        publication: PMID:37873357
        description: 'A dosage model rather than a disease model, and it is included here because of what
          it fails to show. Doxycycline-controlled tet-OFF transgenic mice with roughly eightfold reduced
          cochlear claudin-9 protein are not deaf: their ABR thresholds are elevated by only about 5-15
          dB, stay constant over months of monitoring, and their outer hair cell counts are indistinguishable
          from wild type at P14 and at fifteen months. Instead they develop an extra row of functional,
          mechanotransducing, long-surviving ectopic inner hair cells, apparently because claudin-9 levels
          participate in lateral inhibition of hair cell fate during a postnatal window that has closed
          by P14.

          The bearing on DFNB116 is that reducing how much claudin-9 there is does not reproduce what
          abolishing its barrier function does. That is a substantive constraint on reading the human
          hypomorphic alleles, and it makes claudin-9 dosage a second, developmental axis distinct from
          the barrier axis this entry''s pathophysiology chain describes.'
        genes:
        - preferred_term: CLDN9
          term:
            id: hgnc:2051
            label: CLDN9
        modeled_mechanisms:
        - target: Basal-Predominant Outer Hair Cell Degeneration
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: TISSUE
          description: Substantial reduction of claudin-9 protein does not produce the outer hair cell
            loss or the deafness seen with the barrier-abolishing nmf329 allele.
          limitations: 'This is knockdown, not a disease allele: the residual protein is presumably normal
            and still forms functional junctions, whereas F35L and the human variants deliver a protein
            that is dysfunctional or absent from the membrane. So the negative result constrains how claudin-9
            quantity relates to the phenotype and says nothing directly about a mistrafficked or barrier-dead
            protein. The transgene is also on a CBA-CaJ background chosen to avoid age-related hearing
            loss, and the mild threshold elevation that is present is not mechanistically attributed.'
          readouts:
          - name: Outer hair cell counts by cochlear turn
            target: Basal-Predominant Outer Hair Cell Degeneration
            direction: UNCHANGED
            interpretation: No outer hair cell loss at any cochlear location, in contrast to the widespread
              basal loss in the barrier-defective nmf329 mouse.
          - name: Auditory brainstem response threshold
            target: Basal-Predominant Outer Hair Cell Degeneration
            direction: UNCHANGED
            interpretation: A small, non-progressive threshold elevation instead of the roughly 60 dB
              deficit of the barrier-defective mouse.
      selected_evidence:
        snippet: the pharmacogenetic downregulation of Cldn9, a tight junction protein, generates robust
          supernumerary inner HCs (IHCs) in mice
        supports: SUPPORT
