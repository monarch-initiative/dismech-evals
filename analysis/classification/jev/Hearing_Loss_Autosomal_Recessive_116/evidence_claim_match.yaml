  41514a5216feea9922929616a175fd9d6e9934f4a47241e3efc9e681a662ed86:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 116
          disease_term:
            preferred_term: hearing loss, autosomal recessive 116
            term:
              id: MONDO:0033670
              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cldn9_dosage_versus_barrier_function
        kind: KNOWLEDGE_GAP
        prompt: Is DFNB116 caused by having too little claudin-9, or by having claudin-9 that cannot seal
          - and do the hypomorphic human alleles act on the same axis as the mouse barrier-dead allele?
        attaches_to:
        - pathophysiology#CLDN9 Hypomorphic Missense and In-Frame Alleles
        - pathophysiology#Failure of the Claudin-9 Paracellular Ion Barrier
        - animal_models#nmf329 Cldn9 F35L mouse
        - animal_models#Cldn9 tet-OFF conditional knockdown mouse
        rationale: 'Two mouse manipulations of the same gene give opposite results. The nmf329 allele
          leaves normal amounts of claudin-9 in the membrane but abolishes its ion barrier function, and
          those mice lose their hair cells and go deaf within days of hearing onset. Reducing claudin-9
          protein roughly eightfold with a tet-OFF transgene leaves outer hair cell counts normal at fifteen
          months and shifts ABR thresholds by only 5-15 dB; what it does instead is generate an extra
          row of functional inner hair cells, implicating claudin-9 levels in lateral inhibition of hair
          cell fate during a window that closes by P14.

          So quantity and barrier competence are separable axes, and DFNB116 has been explained entirely
          on the barrier axis. That is very likely right for the truncating allele, which delivers no
          functional protein to the junction at all. It is less obviously right for p.(Glu159Lys), which
          reaches the membrane normally and is predicted to perturb a cis-interaction - a lesion that
          could plausibly reduce effective claudin-9 in strands rather than open a leak, which the knockdown
          data suggest would be relatively well tolerated. Nobody has measured paracellular permeability
          for any human CLDN9 allele.

          Two things would resolve it: Ussing-chamber permeability measurements on monolayers expressing
          each human variant, the assay that established the mouse F35L allele as barrier-dead; and attention
          to whether hypomorphic-allele carriers have any of the developmental signature - supernumerary
          inner hair cells are not visible on an audiogram, but the reduced afferent synapse counts that
          accompanied them in the mouse would show up as a wave I amplitude deficit disproportionate to
          threshold.'
      selected_evidence:
        snippet: The findings suggest that Cldn9 levels coordinate embryonic and postnatal HC differentiation,
          making it a viable target for altering IHC development pre- and post-terminal differentiation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37873357
      reference_title: Genetic and pharmacologic alterations of claudin9 levels suffice to induce functional
        and mature inner hair cells.
      evidence_source: MODEL_ORGANISM
      explanation: The dosage axis stated by its own authors - claudin-9 level as a developmental variable,
        separate from the barrier role that explains the disease.
