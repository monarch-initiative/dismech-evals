  2d250c9376370baf7838a24b5c0ff1e19ac084d764cef072cde38997efb9dccf:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 116
          disease_term:
            preferred_term: hearing loss, autosomal recessive 116
            term:
              id: MONDO:0033670
              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cldn9_mouse_human_audiometric_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why is the Cldn9 mouse uniformly and severely deaf across all frequencies from the onset
          of hearing, when humans with biallelic CLDN9 variants have normal low-frequency thresholds and
          a loss that can be as mild as moderate and may not progress at all?
        attaches_to:
        - pathophysiology#Basal-Predominant Outer Hair Cell Degeneration
        - phenotypes#High-Frequency Sensorineural Hearing Impairment
        - animal_models#nmf329 Cldn9 F35L mouse
        rationale: 'The mismatch is not subtle. ABR thresholds in the nmf329 mouse are uniformly elevated
          at 8, 16 and 32 kHz and are already severe at P16, days after hearing normally begins. The human
          phenotype is the opposite shape - normal at 500 Hz, steeply sloping above 1 kHz - and spans
          mild to profound with recognition ranging from prelingual to age 17.

          Two explanations are separable and neither has been tested. The first is allele strength: the
          mouse F35L completely eliminates barrier function in the Ussing chamber assay, while two of
          three human alleles are explicitly described as hypomorphic, so the human cochlea may retain
          enough barrier to protect the apex. The second is that the mouse histology itself is not uniform
          - degeneration begins basally and reaches the apex only with age - so a uniformly flat ABR deficit
          in an animal with a basal-predominant lesion suggests the mouse cochlea is more vulnerable overall,
          or that the ABR at P28 is already reporting a later stage of the same gradient the human audiogram
          catches early.

          This matters for more than tidiness. If the human low-frequency sparing reflects residual barrier
          function rather than a slower version of the same total loss, then the apical cochlea in a DFNB116
          patient contains living hair cells for decades, and the therapeutic question is preservation
          rather than restoration. A knock-in of a human hypomorphic allele with frequency-resolved ABR
          and turn-by-turn hair cell counts would separate the two accounts.'
        proposed_experiments:
        - experiment_id: cldn9_human_allele_knockin_frequency_abr
          name: Frequency-resolved audiometry and cochlear histology in a human-allele knock-in mouse
          description: Generate mice carrying the human p.(Glu159Lys) or p.(Ile124dup) allele, measure
            ABR thresholds by frequency across the lifespan, and count hair cells turn by turn. A hypomorphic
            knock-in that reproduces apical sparing would attribute the human audiogram shape to residual
            barrier function; one that is uniformly deaf like nmf329 would locate the difference in species
            biology instead.
          would_support:
          - pathophysiology#CLDN9 Hypomorphic Missense and In-Frame Alleles
          supporting_outcome:
          - Knock-in mice carrying a human hypomorphic allele show elevated high-frequency ABR thresholds
            with preserved low-frequency thresholds, and hair cell counts that are reduced at the base
            and preserved at the apex.
          would_refute:
          - pathophysiology#CLDN9 Hypomorphic Missense and In-Frame Alleles
          refuting_outcome:
          - Knock-in mice are uniformly deaf across frequencies with pan-cochlear hair cell loss, indistinguishable
            from nmf329, indicating that allele strength does not explain the human audiogram shape.
      selected_evidence:
        snippet: The hearing loss of nmf329/nmf329 mice was equally severe at high- and low-frequency,
          as indicated by the uniformly high ABR thresholds at 8, 16, and 32 kHz
        supports: SUPPORT
