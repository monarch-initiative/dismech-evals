  6fd46a6ff563230bce6df9d3112b2cd9ad8a7af8d5afdbd73b3121f010150e44:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 116
          disease_term:
            preferred_term: hearing loss, autosomal recessive 116
            term:
              id: MONDO:0033670
              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CLDN9 Hypomorphic Missense and In-Frame Alleles
        description: 'The two subsequently reported alleles retain partial function and fail in different
          ways. p.(Glu159Lys) reaches the membrane normally in MDCK-II cells; structural modelling predicts
          it perturbs one of the two cis-interactions by which adjacent claudin protomers oligomerise
          within the same membrane, so the protein is present but the strand it should build is compromised.
          p.(Ile124dup), an in-frame single-residue duplication, is predicted to misfold locally and does
          not reach the HeLa cell membrane. The authors classify both as hypomorphic.

          Whether that residual function explains the milder end of the clinical spectrum is not settled
          by the data: the family carrying p.(Glu159Lys) had moderate-to-profound loss that was stable
          over ten years, while the family carrying the truncating allele included a profoundly deaf 46-year-old.
          Severity and progression do not sort cleanly by allele class across three families.'
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        genes:
        - preferred_term: CLDN9
          term:
            id: hgnc:2051
            label: CLDN9
        genetic_context:
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          allele_type: missense and in-frame single-codon duplication
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: CLDN9 NM_020982.4:c.475G>A p.(Glu159Lys), homozygous in a Pakistani family, and
            c.370_372dupATC p.(Ile124dup), homozygous in a Moroccan family.
      selected_evidence:
        snippet: Computational structural modeling predicts that substitution of a lysine for glutamic
          acid p.(Glu159Lys) alters one of two cis-interactions between CLDN9 protomers.
        supports: SUPPORT
