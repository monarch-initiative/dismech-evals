  d5061b5beea942077c6482e31415915293d60f1c98151aaecaf84583332ba9cc:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 116
          disease_term:
            preferred_term: hearing loss, autosomal recessive 116
            term:
              id: MONDO:0033670
              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of the Claudin-9 Paracellular Ion Barrier
        description: 'Claudin-9 is present in the bicellular tight junctions of every sensory and non-sensory
          epithelial cell facing the endolymph of the scala media, and within the hair cell junctional
          complex it occupies a specific subapical subdomain, sitting beneath the more apical strands
          formed by other claudins. Heterologously expressed wild-type claudin-9 lowers paracellular permeability
          to sodium and potassium; the deafness-causing mouse F35L substitution abolishes that barrier
          function while leaving the protein correctly located in the plasma membrane, which separates
          the barrier defect from a trafficking defect.

          What this node is not: a loss of the epithelial seal that maintains the endocochlear potential.
          The stria vascularis is unaffected in the mutant mouse. The claim is specifically that a deeper
          strand of the junction leaks.'
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        conforms_to: sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        cellular_components:
        - preferred_term: bicellular tight junction
          term:
            id: GO:0005923
            label: bicellular tight junction
        biological_processes:
        - preferred_term: paracellular transport of potassium and sodium
          modifier: INCREASED
          term:
            id: GO:0160184
            label: paracellular transport
        locations:
        - preferred_term: spiral organ of cochlea
          term:
            id: UBERON:0002227
            label: spiral organ of cochlea
      selected_evidence:
        snippet: In an epithelial cell line, heterologous expression of wild-type claudin-9 reduced the
          paracellular permeability to Na+ and K+, and the nmf329 mutation eliminated this ion barrier
          function without affecting the plasma membrane localization of claudin-9.
        supports: SUPPORT
