          the cochlear base and extending apically with age. At P28 the basal-turn organ of Corti is collapsed
          and lacks paracellular spaces and one of the three outer hair cell rows, while the apical turn
          is still intact; by P80 only a few basal outer hair cells remain, so the rapid early degeneration
          slows rather than continuing at the same rate. Human cochlear histology is not available, so
          the basal-to-apical gradient is an inference from the mouse - though it is the natural explanation
          for the human audiogram, in which the high-frequency, basally encoded region is affected and
          the low-frequency apex is spared.
