  c1a0e6e7345e20ff26962f523e2bf6a1a6459b5de567f80c904d036eea11b990:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 116
          disease_term:
            preferred_term: hearing loss, autosomal recessive 116
            term:
              id: MONDO:0033670
              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cldn9_barrier_mechanism_unmeasured_in_humans
        kind: KNOWLEDGE_GAP
        prompt: Does the cochlear paracellular potassium leak demonstrated in the Cldn9 mouse actually
          occur in humans with biallelic CLDN9 variants, and is it what deafens them?
        attaches_to:
        - pathophysiology#Failure of the Claudin-9 Paracellular Ion Barrier
        - pathophysiology#Basolateral Potassium Exposure of Cochlear Hair Cells
        rationale: 'The barrier mechanism is well demonstrated - in mice and in transfected epithelial
          monolayers. In humans it is entirely inferential. What has been shown in affected people is
          that a CLDN9 allele segregates with hearing loss and that the encoded protein behaves abnormally
          when overexpressed in HEK293, HeLa or MDCK cells. Nobody has measured a human perilymphatic
          potassium concentration, a human endocochlear potential, or the state of a human cochlear tight
          junction, and the tissue required is not obtainable during life.

          That gap is easy to overlook because the intermediate steps are individually plausible: claudin-9
          is a tight junction protein, it is expressed in the cochlear epithelia, and the mouse phenotype
          matches. But the entry marks each downstream node PROVISIONAL rather than ESTABLISHED, because
          two of the three human alleles fail in a way the mouse allele does not - they never reach the
          membrane, whereas F35L sits in the membrane and simply stops sealing. A mistrafficked claudin
          could in principle disturb junction assembly more broadly than a barrier-dead one that is correctly
          incorporated.

          The tractable route is not a human measurement. It is a knock-in mouse carrying a human allele
          - which is exactly what the second report proposes - with the same electrode measurements repeated.
          If a p.(Glu159Lys) or p.(Ile124dup) knock-in shows the same isolated perilymphatic potassium
          rise with a preserved endocochlear potential, the inference to humans becomes much stronger;
          if it does not, the human alleles are doing something else.'
      selected_evidence:
        snippet: Since CLDN9 is involved in paracellular permeability, this deformity is likely to impair
          functionality.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31175426
      reference_title: A truncating CLDN9 variant is associated with autosomal recessive nonsyndromic
        hearing loss.
      evidence_source: MODEL_ORGANISM
      explanation: Included as an example of the inferential step itself. The founding paper reasons from
        claudin-9's known role to the significance of a murine morphological finding; marked INDIRECT
        because that is a plausibility argument rather than a measurement.
