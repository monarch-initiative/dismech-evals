  50cf66bee4b6c96812383ae65b6b70434d798671e173e1f2f171b5ee82fae159:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 116
          disease_term:
            preferred_term: hearing loss, autosomal recessive 116
            term:
              id: MONDO:0033670
              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: AnimalModel
      assertion:
        name: nmf329 Cldn9 F35L mouse
        species: Mouse
        genotype: Cldn9 nmf329 (p.Phe35Leu) homozygous, ENU-induced
        publication: PMID:19696885
        description: 'An ENU-mutagenesis mouse recovered on a deafness screen and mapped by positional
          cloning to a missense substitution in Cldn9. It is the system in which the entire mechanism
          of this entry was established, and it preceded the human gene discovery by a decade. The allele
          is instructive in its own right: F35L abolishes claudin-9''s paracellular ion barrier function
          in transfected epithelial monolayers while leaving the protein correctly inserted in the plasma
          membrane, so the mouse isolates loss of barrier function from loss of the protein - which is
          not what two of the three human alleles do, since those mistraffic.'
        genes:
        - preferred_term: CLDN9
          term:
            id: hgnc:2051
            label: CLDN9
        modeled_mechanisms:
        - target: Basolateral Potassium Exposure of Cochlear Hair Cells
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: TISSUE
          description: The only system in which the ionic disturbance has been measured at all. Endolymphatic
            and perilymphatic potassium and the endocochlear potential were measured directly by double-barrelled
            microelectrode in vivo, and the causal role of potassium was then tested by two independent
            rescues.
          limitations: The measurements are murine and have no human counterpart - cochlear fluids are
            not accessible in living patients - so the claim that this ionic disturbance occurs in affected
            humans is inference from a shared gene, not observation. The mouse allele is also a missense
            that preserves membrane targeting, whereas the human truncating and in-frame-duplication alleles
            fail to reach the membrane; the endpoint is likely the same but the molecular route differs.
          readouts:
          - name: Perilymphatic potassium concentration
            target: Basolateral Potassium Exposure of Cochlear Hair Cells
            direction: INCREASED
            interpretation: Raised perilymphatic potassium with normal endolymphatic potassium and normal
              endocochlear potential, localising the leak to the junction rather than the stria.
          - name: Endocochlear potential
            target: Basolateral Potassium Exposure of Cochlear Hair Cells
            direction: UNCHANGED
            interpretation: A real negative result. The endocochlear battery is intact, so this is not
              a strial or endolymph-generation defect.
        - target: Basal-Predominant Outer Hair Cell Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Reproduces the cellular lesion and its base-to-apex gradient with histology that
            human material cannot supply.
          limitations: 'Fidelity is graded MODERATE rather than HIGH because the audiometric consequence
            diverges: the mouse is uniformly deaf across 8, 16 and 32 kHz and severely so within days
            of hearing onset, whereas affected humans have normal low-frequency thresholds and a range
            from mild to profound with onset from prelingual to adolescence. The cellular lesion is shared;
            its severity and frequency distribution are not.'
          readouts:
          - name: Outer hair cell survival by cochlear turn
            target: Basal-Predominant Outer Hair Cell Degeneration
            direction: DECREASED
            interpretation: Loss of outer hair cells beginning at the base after the second postnatal
              week and extending apically with age.
          - name: Auditory brainstem response threshold
            target: Basal-Predominant Outer Hair Cell Degeneration
            direction: DECREASED
            interpretation: Severe threshold elevation already present at P16, three to four days after
              the normal onset of hearing, and equally severe at every frequency tested.
      selected_evidence:
        snippet: Positional cloning revealed that the nmf329 strain carries a missense mutation in the
          claudin-9 gene, which encodes a tight junction protein with unknown biological function.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19696885
      reference_title: A claudin-9-based ion permeability barrier is essential for hearing.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that the deafness phenotype maps to Cldn9, which is what makes this a model
        of DFNB116.
