  b4455fded4857187c4e934f6c1fb556d41d6b2439cdc48658add26685185a878:
    claim:
      about:
        disease:
          name: Hearing Loss Autosomal Recessive 116
          disease_term:
            preferred_term: hearing loss, autosomal recessive 116
            term:
              id: MONDO:0033670
              label: hearing loss, autosomal recessive 116
        context: []
      assertion_type: Genetic
      assertion:
        name: CLDN9
        notes: 'CLDN9 (16p13.3) is a single-coding-exon gene encoding claudin-9, a tetraspan integral
          membrane protein of bicellular tight junctions with two extracellular loops. EL1 carries the
          charged residues that set paracellular ionic selectivity and mediates trans-interaction with
          the claudin on the opposing membrane; EL2 mediates cis-interaction between claudins within the
          same membrane. Three disease alleles have functional support: the truncating c.86delT (p.Leu29ArgfsTer4),
          which falls at the start of EL1 and is a probable functional null - notable because a premature
          stop in a single-exon gene is unlikely to trigger nonsense-mediated decay, so the truncated
          protein may persist without functioning; and two hypomorphs, p.(Glu159Lys), which is predicted
          to disturb one of the two cis-interactions while leaving membrane targeting intact, and p.(Ile124dup),
          which locally misfolds the protein and fails to reach the membrane.

          Do not read across from the other claudins. CLDN14 (hgnc:2035) causes DFNB29 and is a separate
          nonsyndromic deafness entity; CLDN1 causes NISCH syndrome and CLDN19 hypomagnesemia 5. CLDN9
          is also similar in sequence to CLDN6, which matters practically: the 2021 study had to show
          its Cldn9 in situ probe was not detecting Cldn6.'
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: CLDN9
          term:
            id: hgnc:2051
            label: CLDN9
      selected_evidence:
        snippet: Through whole-genome sequencing, we identified a one base pair deletion (c.86delT) in
          CLDN9 in a consanguineous family from Turkey with autosomal recessive nonsyndromic hearing loss.
        supports: SUPPORT
