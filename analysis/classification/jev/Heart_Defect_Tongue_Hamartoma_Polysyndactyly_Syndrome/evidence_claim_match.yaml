        context: []
      assertion_type: Pathophysiology
      assertion:
        name: WDPCP/Fritz Transition Zone Recruitment and Ciliogenesis Defect
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        description: WDPCP (Fritz) is a planar cell polarity effector that localizes to the ciliary transition
          zone, where it is required to recruit septins (Sept2) and other transition-zone proteins (Nphp1,
          Mks1) needed for cilium assembly. Loss of WDPCP function therefore disrupts ciliogenesis at
          the level of the transition-zone gate, the upstream molecular lesion of this ciliopathy.
        cell_types:
        - preferred_term: ciliated cell
          term:
            id: CL:0000064
            label: ciliated cell
        biological_processes:
        - preferred_term: cilium assembly
          term:
            id: GO:0060271
            label: cilium assembly
          modifier: ABNORMAL
        - preferred_term: protein localization to cilium
          term:
            id: GO:0061512
            label: protein localization to cilium
          modifier: ABNORMAL
      selected_evidence:
        snippet: We observed Wdpcp is localized to the transition zone, and in Wdpcp-deficient cells,
          Sept2, Nphp1, and Mks1 were lost from the transition zone, indicating Wdpcp is required for
          recruitment of proteins essential for ciliogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24302887
      reference_title: Wdpcp, a PCP protein required for ciliogenesis, regulates directional cell migration
        and cell polarity by direct modulation of the actin cytoskeleton.
      evidence_source: IN_VITRO
      explanation: Localizes WDPCP to the ciliary transition zone and shows it is required to recruit
        Sept2/Nphp1/Mks1 there, defining the transition-zone ciliogenesis defect. Evidence source is IN_VITRO
        (cultured Wdpcp-deficient cells).
