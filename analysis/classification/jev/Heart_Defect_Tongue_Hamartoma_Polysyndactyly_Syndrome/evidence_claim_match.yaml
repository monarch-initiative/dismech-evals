          modulates the actin cytoskeleton to establish cell polarity and directional (collective) cell
          migration during convergent-extension morphogenesis. WDPCP deficiency disrupts non-canonical
          Wnt/PCP signaling and actin organization, and notably the PCP defects are not solely a consequence
          of lost cilia but reflect direct disruption of the actin cytoskeleton.
