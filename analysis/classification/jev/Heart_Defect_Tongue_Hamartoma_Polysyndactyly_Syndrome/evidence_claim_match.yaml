        association: Causative
        gene_term:
          preferred_term: WDPCP
          term:
            id: hgnc:28027
            label: WDPCP
        notes: Biallelic loss-of-function variants in WDPCP (2p15; the human homolog of Fritz, also designated
          the Bardet-Biedl syndrome 15 / BBS15 gene) cause this syndrome. WDPCP encodes a planar cell
          polarity effector required for ciliogenesis and actin-cytoskeleton-dependent directional cell
          migration. The index case was a compound heterozygote for a frameshift mutation and a likely
          pathogenic sequence variant; loss of WDPCP/Fritz has also been linked to the Bardet-Biedl and
          Meckel-Gruber ciliopathy spectra.
      selected_evidence:
        snippet: We also linked mutations in human Fritz to Bardet-Biedl and Meckel-Gruber syndromes,
          a notable link given that other genes mutated in these syndromes also influence collective cell
          movement and ciliogenesis.
        supports: SUPPORT
