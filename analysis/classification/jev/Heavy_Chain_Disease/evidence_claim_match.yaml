          gut is therefore the closest neighbour rather than a distant mimic.
        distinguishing_features:
        - Only alpha-HCD secretes a truncated, light-chain-free alpha heavy chain; conventional MALT lymphoma
          expresses a complete, light-chain-restricted immunoglobulin.
        - Alpha-HCD is centred on the proximal small bowel with diffuse plasmacytic lamina propria infiltration
          and villous atrophy, whereas the stomach is the commonest conventional MALT lymphoma site.
        - Conventional MALT lymphoma carries recurrent NF-kB-activating translocations such as t(11;18)/BIRC3::MALT1
          that are not features of alpha-HCD.
      selected_evidence:
        snippet: IPSID lymphoma shares clinical, morphologic, and molecular features with MALT lymphoma,
          lymphoplasmacytic lymphoma, and plasma cell neoplasms.
        supports: SUPPORT
