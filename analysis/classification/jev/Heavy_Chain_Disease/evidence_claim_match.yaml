            description: The commonest heavy chain disease, secreting a truncated IgA (alpha) heavy chain.
              It presents as immunoproliferative small intestinal disease (IPSID), an extranodal marginal
              zone (MALT-type) lymphoma of the proximal small bowel causing chronic diarrhoea, malabsorption,
              and weight loss in young adults of Mediterranean, North African, and Middle Eastern origin.
              Chronic enteric infection - Campylobacter jejuni most convincingly - drives the antigen-dependent
              early phase, which is antibiotic responsive; untreated disease progresses to lymphoplasmacytic
              and immunoblastic lymphoma invading the bowel wall and mesenteric nodes.
            geography:
            - Mediterranean basin
            - North Africa
            - Middle East
          role: subtype
      assertion_type: HistopathologyFinding
      assertion:
        name: Lamina Propria Lymphoplasmacytic Infiltrate
        subtype: Alpha-HCD
        diagnostic: true
        description: A dense plasma-cell-rich lymphoplasmacytic infiltrate expands the lamina propria
          of the duodenum and jejunum, admixed with small lymphocytes resembling marginal zone B cells,
          with lymphoepithelial lesions in some cases. The infiltrating plasma cells and marginal zone
          cells express monoclonal cytoplasmic alpha chain without light chains, which is the immunohistochemical
          confirmation of the diagnosis.
      selected_evidence:
        snippet: A lymphoplasmacytic infiltrate rich in plasma cells can be detected in the lamina propria
          of the bowel, and lymphoepithelial lesions may also be present.
