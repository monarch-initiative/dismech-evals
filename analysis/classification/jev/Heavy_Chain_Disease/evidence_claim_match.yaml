            term:
              id: MONDO:0019464
              label: heavy chain disease
        context: []
      assertion_type: Subtype
      assertion:
        name: Gamma-HCD
        display_name: Gamma Heavy Chain Disease (Franklin Disease)
        subtype_term:
          preferred_term: gamma-heavy chain disease
          term:
            id: MONDO:0015046
            label: gamma-heavy chain disease
        description: Franklin disease, secreting a truncated IgG (gamma) heavy chain. It is diagnosed
          at a median age in the seventh decade with a female predominance and is nearly always accompanied
          by an underlying lymphoplasmacytic neoplasm. Roughly a quarter of patients have a coexisting
          autoimmune disease - most often rheumatoid arthritis, less often Sjogren syndrome, systemic
          lupus erythematosus, vasculitis, myasthenia gravis, or autoimmune cytopenias - whose manifestations
          frequently precede the HCD diagnosis by years. Clinical patterns range from disseminated lymphoma
          with constitutional symptoms, generalised lymphadenopathy, splenomegaly, and hepatomegaly, to
          localised medullary or extramedullary (commonly cutaneous) disease. Palatal oedema from involvement
          of the Waldeyer's ring lymphoid tissue is a classically reported sign.
      selected_evidence:
        snippet: Gamma heavy-chain disease (gHCD) is defined as a lymphoplasmacytic neoplasm that produces
          an abnormally truncated immunoglobulin gamma heavy-chain protein that lacks associated light
          chains.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/1
