          value:
            name: Gamma-HCD
            display_name: Gamma Heavy Chain Disease (Franklin Disease)
            subtype_term:
              preferred_term: gamma-heavy chain disease
              term:
                id: MONDO:0015046
                label: gamma-heavy chain disease
            description: Franklin disease, secreting a truncated IgG (gamma) heavy chain. It is diagnosed
              at a median age in the seventh decade with a female predominance and is nearly always accompanied
              by an underlying lymphoplasmacytic neoplasm. Roughly a quarter of patients have a coexisting
              autoimmune disease - most often rheumatoid arthritis, less often Sjogren syndrome, systemic
              lupus erythematosus, vasculitis, myasthenia gravis, or autoimmune cytopenias - whose manifestations
              frequently precede the HCD diagnosis by years. Clinical patterns range from disseminated
              lymphoma with constitutional symptoms, generalised lymphadenopathy, splenomegaly, and hepatomegaly,
              to localised medullary or extramedullary (commonly cutaneous) disease. Palatal oedema from
              involvement of the Waldeyer's ring lymphoid tissue is a classically reported sign.
          role: subtype
      assertion_type: ProgressionInfo
      assertion:
        phase: Heterogeneous gamma-HCD course
        subtype: Gamma-HCD
        notes: Prognosis is highly variable and depends on the associated neoplasm. Occasional spontaneous
          remissions occur in patients with no overt lymphoma, who may survive for long periods untreated;
          treated localised lymphoma usually achieves sustained complete clinical and immunologic remission;
          gamma-HCD with systemic lymphoma may be either aggressive and rapidly progressive or indolent.
          Median survival in the Mayo series was 7.4 years.
      selected_evidence:
        snippet: Occasional spontaneous remissions have been reported in patients with no overt lymphoma,
          who are nonetheless expec ted to undergo a prolonged survival without treatment.
        supports: SUPPORT
