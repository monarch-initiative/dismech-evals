        display_name: Alpha Heavy Chain Disease (IPSID / Mediterranean Lymphoma)
        subtype_term:
          preferred_term: alpha-heavy chain disease
          term:
            id: MONDO:0015045
            label: alpha-heavy chain disease
        description: The commonest heavy chain disease, secreting a truncated IgA (alpha) heavy chain.
          It presents as immunoproliferative small intestinal disease (IPSID), an extranodal marginal
          zone (MALT-type) lymphoma of the proximal small bowel causing chronic diarrhoea, malabsorption,
          and weight loss in young adults of Mediterranean, North African, and Middle Eastern origin.
          Chronic enteric infection - Campylobacter jejuni most convincingly - drives the antigen-dependent
          early phase, which is antibiotic responsive; untreated disease progresses to lymphoplasmacytic
          and immunoblastic lymphoma invading the bowel wall and mesenteric nodes.
        geography:
        - Mediterranean basin
        - North Africa
        - Middle East
      selected_evidence:
        snippet: Alpha-HCD is the most common and usually occurs as intestinal malabsorption in a young
          adult from a country of the Mediterranean area.
        supports: SUPPORT
