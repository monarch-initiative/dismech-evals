              label: heavy chain disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Escape from BiP-Dependent ER Quality Control
        role: mediator
        biological_scale: CELLULAR
        description: 'Normally, an unpaired heavy chain is trapped in the endoplasmic reticulum: the unfolded
          CH1 domain permanently exposes chaperone-binding sites, the Hsp70 chaperone BiP/GRP78 binds
          it stably (its ATPase cycle stalled until light chain arrives), and the retained chain is routed
          to proteasomal degradation, which is why free heavy chains are never found in normal serum or
          urine. A CH1-deleted chain presents no such binding surface. It binds neither light chain nor
          BiP, bypasses ER retention and degradation, and enters the secretory pathway. This is the mechanistic
          core of every heavy chain disease.'
        cellular_components:
        - preferred_term: endoplasmic reticulum lumen
          term:
            id: GO:0005788
            label: endoplasmic reticulum lumen
        molecular_functions:
        - preferred_term: BiP chaperone binding by the unpaired heavy chain
          modifier: DECREASED
          term:
            id: GO:0051087
            label: protein-folding chaperone binding
        biological_processes:
        - preferred_term: protein folding in endoplasmic reticulum
          modifier: ABNORMAL
          term:
            id: GO:0034975
            label: protein folding in endoplasmic reticulum
        - preferred_term: ERAD pathway
          modifier: DECREASED
          term:
            id: GO:0036503
            label: ERAD pathway
      selected_evidence:
        snippet: Unassembled immunoglobulin heavy chains are retained intracellularly by delayed folding
          of the C(H)1 domain and irreversible interaction of BiP with this domain.
        supports: SUPPORT
    origin:
