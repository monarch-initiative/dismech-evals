              label: heavy chain disease
        context: []
      assertion_type: Subtype
      assertion:
        name: Mu-HCD
        display_name: Mu Heavy Chain Disease
        subtype_term:
          preferred_term: mu-heavy chain disease
          term:
            id: MONDO:0015044
            label: mu-heavy chain disease
        description: The rarest heavy chain disease, with only 30-40 reported cases, secreting a truncated
          IgM (mu) heavy chain. It occurs predominantly in older men and almost always arises in a marrow
          lymphoid neoplasm resembling chronic lymphocytic leukaemia / small lymphocytic lymphoma; MYD88
          L265P has been reported in individual cases, which has been argued to place at least some of
          them closer to lymphoplasmacytic lymphoma / Waldenstrom macroglobulinaemia than to CLL. Vacuolated
          bone marrow plasma cells admixed with small round lymphocytes are the characteristic morphology.
          Unlike the other subtypes, Bence Jones proteinuria is frequent, because the clone continues
          to make monoclonal (usually kappa) light chains that cannot assemble with the CH1-deleted heavy
          chain.
      selected_evidence:
        snippet: The disease occurs predominantly in Caucasian males, with a median age of 58 years at
          diagnosis.
        supports: SUPPORT
    origin:
