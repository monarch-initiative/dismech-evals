      assertion:
        name: Celiac Disease
        disease_term:
          preferred_term: celiac disease
          term:
            id: MONDO:0005130
            label: celiac disease
        description: The principal non-neoplastic differential for the alpha-HCD malabsorption presentation.
          Both cause chronic diarrhoea, malabsorption, weight loss, and small-bowel villous atrophy with
          a lamina propria lymphoid infiltrate, and both involve chronic mucosal antigenic stimulation
          with an increased risk of lymphoid malignancy; celiac disease predominates in Northwestern Europe
          and North America where IPSID is rare, and vice versa.
        distinguishing_features:
        - Celiac disease responds to gluten withdrawal, whereas alpha-HCD does not respond to a gluten-free
          diet.
        - Celiac disease shows serological markers (anti-tissue transglutaminase, anti-endomysial antibodies)
          and HLA-DQ2/DQ8, with a polyclonal plasma-cell population and intraepithelial lymphocytosis.
        - Alpha-HCD shows a monoclonal alpha-chain-positive, light-chain-negative plasma-cell population
          on immunohistochemistry and is confirmed by anti-IgA immunofixation.
      selected_evidence:
        snippet: In Middle-Eastern and Mediterranean countries immunoproliferative small intestinal disease
          is endemic, whereas in other parts of the world (including Northwestern Europe and North America)
          celiac sprue, and other sprue-like syndromes refractory to dietary gluten withdrawal, predominate.
        supports: SUPPORT
