          a dense plasma-cell-rich lymphoplasmacytic infiltrate fills the lamina propria of the duodenum
          and jejunum, admixed with marginal-zone-like small lymphocytes and sometimes lymphoepithelial
          lesions; the infiltrate causes villous atrophy and hence malabsorption. In gamma-HCD the infiltrate
          involves bone marrow, spleen, lymph nodes, and extranodal sites including skin and the Waldeyer's
