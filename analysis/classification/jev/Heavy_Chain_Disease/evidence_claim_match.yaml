            term:
              id: MONDO:0019464
              label: heavy chain disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the CH1 Domain and Failure of Light Chain Pairing
        role: central_effector
        biological_scale: MOLECULAR
        description: 'CH1 is the heavy-chain constant domain that pairs with the light-chain constant
          (CL) domain, and the two are covalently joined by an interchain disulfide bond. CH1 is unusual
          among immunoglobulin domains in being intrinsically unfolded in isolation: it acquires structure
          only on association with a folded CL domain, in a reaction rate-limited by isomerisation of
          a conserved proline. A heavy chain that has lost CH1 has therefore lost the only interface through
          which it can engage light chain, and the resulting molecule is a light-chain-free heavy chain
          - the defining lesion shared by all three HCD subtypes.'
        cellular_components:
        - preferred_term: endoplasmic reticulum lumen
          term:
            id: GO:0005788
            label: endoplasmic reticulum lumen
      selected_evidence:
        snippet: These structural abnormalities typically result in loss of a large portion of the constant
          -1 (CH1) domain of the Ig heavy chain molecule responsible for LC binding
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
