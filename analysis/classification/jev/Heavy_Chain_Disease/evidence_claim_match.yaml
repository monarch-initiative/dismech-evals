    claim:
      about:
        disease:
          name: Heavy Chain Disease
          disease_term:
            preferred_term: heavy chain disease
            term:
              id: MONDO:0019464
              label: heavy chain disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hcd_population_incidence_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the true population incidence of each heavy chain disease subtype, and how much
          of the reported geographic and sex skew is ascertainment bias?
        attaches_to:
        - pathophysiology#Clonal Lymphoplasmacytic B-Cell Expansion
        rationale: Every published figure is a cumulative literature case count (more than 400 alpha,
          about 130 gamma, 30-40 mu), not a rate. Mu-HCD is explicitly suspected to be under-ascertained
          because the truncated chain is missed on serum protein electrophoresis, so its reported median
          survival of about two years is probably an underestimate. Without denominators, neither prognosis
          nor treatment effect can be estimated reliably.
        proposed_experiments:
        - experiment_id: hcd_international_registry
          name: International HCD registry with centralised confirmation
          description: Establish a multinational registry with centralised mass-spectrometric and immunofixation
            confirmation of every submitted case and contemporary outcome capture.
          decision_criterion: Denominator-based incidence estimates and outcome curves that are stable
            across contributing regions.
        - experiment_id: hcd_reflex_immunoselection_ascertainment
          name: Reflex immunoselection in discordant monoclonal gammopathies
          description: Apply systematic reflex immunoselection in laboratories reporting monoclonal gammopathies
            with discordant heavy-chain and light-chain quantitation, to estimate how many HCD cases current
            practice misses.
          decision_criterion: A measurable yield of previously unrecognised free heavy chains would quantify
            the ascertainment shortfall.
      selected_evidence:
        snippet: It is the most common of the three HCDs, with more than 400 cases described in the literature
          since its initial description in 1968.
        supports: SUPPORT
