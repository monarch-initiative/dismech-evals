            label: Waldenstrom macroglobulinemia
        description: 'Mu-HCD overlaps Waldenstrom macroglobulinaemia closely: both are IgM-secreting marrow
          lymphoplasmacytic neoplasms, both may carry MYD88 L265P, and mu-HCD has been reported as an
          atypical presentation of Waldenstrom macroglobulinaemia. Gamma-HCD may likewise arise during
          the course of Waldenstrom macroglobulinaemia.'
        distinguishing_features:
        - Waldenstrom macroglobulinaemia secretes an intact monoclonal IgM with an assembled light chain;
          mu-HCD secretes a free truncated mu chain demonstrable only by immunoselection.
        - Vacuolated marrow plasma cells and the dissociation between very high serum free light chains
          and an absent or trivial SPEP peak favour mu-HCD.
        - Hyperviscosity, cryoglobulinaemia, and anti-MAG neuropathy favour Waldenstrom macroglobulinaemia.
      selected_evidence:
        snippet: Waldenström macroglobulinemia (WM) is a lymphoplasmacytic lymphoma secreting monoclonal
          IgM, mainly κ, which is strongly associated with the MYD88 L265P somatic mutation.
