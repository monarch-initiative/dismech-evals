        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hcd_ch1_membrane_form_oncogenic_driver
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the CH1-deleted heavy chain merely a secretory-escape by-product, or is its membrane
          form an oncogenic driver that sustains the clone through antigen-independent B-cell receptor
          signalling?
        attaches_to:
        - pathophysiology#Antigen-Independent B-Cell Receptor Aggregation
        rationale: The distinction determines whether the CH1 lesion is a diagnostic marker or a therapeutic
          target, and whether antimicrobial therapy alone can be curative once the lesion is established.
          It would also explain why a subset of alpha-HCD progresses despite eradication of the driving
          organism. The proposal currently rests on suggestion in a review rather than direct demonstration
          in human HCD tissue.
        proposed_experiments:
        - experiment_id: hcd_single_cell_bcr_tonic_signalling
          name: Single-cell BCR and transcriptomic profiling of HCD clones
          description: Profile HCD clones at single-cell resolution alongside matched lymphoplasmacytic
            and MALT lymphoma controls, testing whether the HCD clone shows tonic, ligand-independent
            BCR pathway activation.
          decision_criterion: Selective enrichment of BCR-pathway activation signatures in HCD clones
            relative to light-chain-competent controls would support the driver model.
        - experiment_id: hcd_ch1_deleted_construct_aggregation
          name: Engineered CH1-deleted heavy chain constructs in B-cell lines
          description: Express CH1-deleted heavy chain constructs in B-cell lines and assay directly for
            antigen-independent receptor aggregation and downstream signalling.
          decision_criterion: Demonstration of spontaneous receptor clustering and downstream signalling
            in the absence of antigen would establish the mechanism in a controlled system.
      selected_evidence:
        snippet: down-stream signaling by the receptor, thereby conferring a growth advantage to neoplastic
          cells.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
