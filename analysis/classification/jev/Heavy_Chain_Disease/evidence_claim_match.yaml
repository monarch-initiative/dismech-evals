      assertion_type: Pathophysiology
      assertion:
        name: Somatic Immunoglobulin Heavy Chain Gene Deletion
        role: central_effector
        biological_scale: MOLECULAR
        description: 'Deletions, insertions, and point mutations acquired somatically during somatic hypermutation
          of the rearranged IGH locus (14q32.33) remove a large portion of the sequence encoding the first
          constant (CH1) domain, and in alpha-HCD frequently the variable (VH) region as well. These are
          clone-specific somatic structural lesions of the rearranged immunoglobulin genes, not constitutional
          pathogenic variants; no germline predisposing variant is established for HCD. Terminology caveat:
          GO:0016446 is defined for hypermutation of the rearranged V regions, whereas the HCD lesion
          falls in the CH1 constant domain. The term is used here for the somatic hypermutation machinery
          that the source identifies as the origin of the lesion, not to assert that the mutations lie
          in V.'
        genes:
        - preferred_term: IGHA1
          term:
            id: hgnc:5478
            label: IGHA1
        - preferred_term: IGHG1
          term:
            id: hgnc:5525
            label: IGHG1
        - preferred_term: IGHM
          term:
            id: hgnc:5541
            label: IGHM
        biological_processes:
        - preferred_term: somatic hypermutation of immunoglobulin genes
          modifier: ABNORMAL
          term:
            id: GO:0016446
            label: somatic hypermutation of immunoglobulin genes
      selected_evidence:
        snippet: The altered heavy chains contain deletions, insertions, and point mutations that are
          acquired during somatic hypermutation.
        supports: SUPPORT
