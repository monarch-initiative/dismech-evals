            description: Franklin disease, secreting a truncated IgG (gamma) heavy chain. It is diagnosed
              at a median age in the seventh decade with a female predominance and is nearly always accompanied
              by an underlying lymphoplasmacytic neoplasm. Roughly a quarter of patients have a coexisting
              autoimmune disease - most often rheumatoid arthritis, less often Sjogren syndrome, systemic
              lupus erythematosus, vasculitis, myasthenia gravis, or autoimmune cytopenias - whose manifestations
              frequently precede the HCD diagnosis by years. Clinical patterns range from disseminated
              lymphoma with constitutional symptoms, generalised lymphadenopathy, splenomegaly, and hepatomegaly,
              to localised medullary or extramedullary (commonly cutaneous) disease. Palatal oedema from
              involvement of the Waldeyer's ring lymphoid tissue is a classically reported sign.
          role: subtype
      assertion_type: Phenotype
      assertion:
        category: Hematologic
        name: Thrombocytopenia
        subtype: Gamma-HCD
        description: Thrombocytopenia occurs alongside normochromic normocytic anaemia and Coombs-positive
          autoimmune haemolytic anaemia as laboratory evidence of autoimmune disease or marrow infiltration
          in gamma-HCD. No frequency band is asserted because the source lists these cytopenias without
          quantifying them.
        phenotype_term:
