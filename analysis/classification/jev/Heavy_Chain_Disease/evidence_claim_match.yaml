      assertion_type: Pathophysiology
      assertion:
        name: Transformation to Aggressive Lymphoma
        role: outcome
        biological_scale: ORGANISM
        description: IPSID is generally regarded as a pre-lymphomatous condition. Untreated or antibiotic-refractory
          alpha-HCD progresses from an antigen-dependent mucosal lesion to lymphoplasmacytic and immunoblastic
          lymphoma invading the bowel wall and mesenteric nodes, with distant spread; the same transformation
          accounts for constitutional symptoms and for death from obstruction, perforation, cachexia,
          and infection. Gamma-HCD shows an analogous spectrum, with disseminated lymphoma and constitutional
          symptoms in roughly two-thirds of patients. Recent reports of longstanding non-progressive IPSID
          show the transformation is not obligate.
      selected_evidence:
        snippet: Most untreated IPSID patients progress to lymphoplasmacytic and immunoblastic lymphoma
          invading the intestinal wall and mesenteric lymph nodes, and may metastasize to a distant organ.
        supports: SUPPORT
