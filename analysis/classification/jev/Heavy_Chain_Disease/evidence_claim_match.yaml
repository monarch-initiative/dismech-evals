        notes: 'The diagnosis-defining laboratory finding across all three subtypes: an isotype-specific
          monoclonal heavy chain (anti-IgA, anti-IgG, or anti-mu reactive) with no corresponding kappa
          or lambda reactivity, demonstrated in serum or urine. Immunoselection - electrophoresis through
          agar containing anti-kappa and anti-lambda antibodies to trap free light chains and intact immunoglobulin
          - is required, because serum protein electrophoresis alone can be entirely normal and therefore
          cannot exclude HCD. Two-dimensional immunoelectrophoresis is a useful tool for all three types.'
        specificity: Pathognomonic for heavy chain disease
