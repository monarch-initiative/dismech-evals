      assertion_type: Discussion
      assertion:
        discussion_id: hcd_campylobacter_causality
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is Campylobacter jejuni causal in alpha-HCD/IPSID, or a marker of the poor sanitation
          and polymicrobial enteric colonisation that constitute the real antigenic drive?
        attaches_to:
        - pathophysiology#Chronic Enteric Antigenic Stimulation
        rationale: The C. jejuni association is well documented and antibiotic responsiveness is consistent
          with an antigen-driven mechanism, but reviewers explicitly note controversy about the organism's
          pathogenetic role, and contemporary cases have found several concomitant enteric pathogens rather
          than C. jejuni alone. Resolving this determines whether targeted eradication or broad decolonisation
          is the rational therapy.
        proposed_experiments:
        - experiment_id: hcd_ipsid_metagenomics
          name: Metagenomic sequencing of IPSID small-bowel biopsies
          description: Sequence the small-bowel microbiome of IPSID patients and geographically matched
            controls to test whether C. jejuni is specifically enriched relative to overall enteric microbial
            burden.
          decision_criterion: Specific enrichment of C. jejuni beyond the general increase in enteric
            burden would support a causal role.
        - experiment_id: hcd_targeted_eradication_cohort
          name: Organism-specific eradication versus histological remission
          description: Prospectively correlate documented organism-specific eradication with histological
            remission versus persistence in a multicentre IPSID cohort.
          decision_criterion: Remission tracking C. jejuni clearance specifically, rather than broad antimicrobial
            exposure, would support causality.
      selected_evidence:
        snippet: A link between Campylobacter jejuni infection and IPSID has been established, but there
          is controversy as to the role played by this organism in disease pathogenesis.
        supports: SUPPORT
