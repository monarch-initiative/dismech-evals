          term:
            id: MONDO:0019728
            label: heavy chain deposition disease
        description: The most commonly confused entity, and a genuinely distinct one. Heavy chain deposition
          disease shares the CH1-deleted truncated heavy chain but the abnormal chain deposits in tissue
          - typically producing nodular glomerulosclerosis - rather than circulating as a detectable serum
          or urine paraprotein.
        distinguishing_features:
        - In heavy chain disease the truncated chain is demonstrable in serum or urine; in heavy chain
          deposition disease and heavy chain amyloidosis it is demonstrable in tissue.
        - The clinical picture of heavy chain deposition disease is a monoclonal immunoglobulin deposition
          nephropathy rather than a lymphoproliferative syndrome.
      selected_evidence:
        snippet: These disorders share the pathognomonic finding of a truncated immunoglobulin heavy chain
          without an associated light chain in the serum or urine in the case of heavy chain disease or
          in the tissues in the case of heavy chain deposition disease and heavy chain amyloidosis but
          are clinically distinct entities.
        supports: SUPPORT
