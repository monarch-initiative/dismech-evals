      assertion_type: Diagnosis
      assertion:
        name: Immunofixation with immunoselection of serum and urine
        description: The diagnostic cornerstone. Serum protein electrophoresis is performed first but
          can be entirely normal, hypogammaglobulinaemic, or show only a broad band in the alpha-2/beta
          region, and therefore cannot exclude HCD. The diagnosis requires demonstrating isotype-specific
          heavy chain reactivity (anti-IgA, anti-IgG, or anti-mu) with no corresponding kappa or lambda
          reactivity in serum or urine, using immunoselection or two-dimensional immunoelectrophoresis.
          Mass spectrometry of serum is a modern alternative for identifying the truncated chain.
      selected_evidence:
        snippet: Diagnosis of HCD requires documentation of a deleted immunoglobulin heavy chain without
          a bound light chain in the serum or urine.
        supports: SUPPORT
