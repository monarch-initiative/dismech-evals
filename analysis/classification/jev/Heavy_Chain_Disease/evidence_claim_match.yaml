      assertion:
        hypothesis_group_id: antigen_independent_bcr_signaling
        hypothesis_label: Antigen-independent BCR signalling by the truncated heavy chain
        status: EMERGING
        description: The hypothesis that the membrane form of the CH1-deleted heavy chain, as part of
          the B-cell receptor, aggregates and signals in the absence of antigen, giving the clone a ligand-independent
          survival advantage. If true, the CH1 lesion is an oncogenic driver rather than only a secretory-escape
          event, and it would explain progression that continues after eradication of the initiating antigen.
          Not demonstrated in human HCD tissue.
      selected_evidence:
        snippet: down-stream signaling by the receptor, thereby conferring a growth advantage to neoplastic
          cells.
        supports: SUPPORT
