        - path: /has_subtypes/2
          value:
            name: Mu-HCD
            display_name: Mu Heavy Chain Disease
            subtype_term:
              preferred_term: mu-heavy chain disease
              term:
                id: MONDO:0015044
                label: mu-heavy chain disease
            description: The rarest heavy chain disease, with only 30-40 reported cases, secreting a truncated
              IgM (mu) heavy chain. It occurs predominantly in older men and almost always arises in a
              marrow lymphoid neoplasm resembling chronic lymphocytic leukaemia / small lymphocytic lymphoma;
              MYD88 L265P has been reported in individual cases, which has been argued to place at least
              some of them closer to lymphoplasmacytic lymphoma / Waldenstrom macroglobulinaemia than
              to CLL. Vacuolated bone marrow plasma cells admixed with small round lymphocytes are the
              characteristic morphology. Unlike the other subtypes, Bence Jones proteinuria is frequent,
              because the clone continues to make monoclonal (usually kappa) light chains that cannot
              assemble with the CH1-deleted heavy chain.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Unassembled Free Light Chain Excess
        role: consequence
        biological_scale: MOLECULAR
        subtypes:
        - Mu-HCD
        description: A mu-HCD-specific and superficially paradoxical consequence of the same lesion. The
          clone continues to synthesise monoclonal light chains, usually kappa, but the CH1-deleted mu
          chain cannot assemble with them. The unassembled light chains are secreted freely, filtered
          at the glomerulus, and appear in the urine as Bence Jones protein - so a disease defined by
          a heavy-chain defect commonly presents with light-chain proteinuria, sometimes with cast nephropathy
          or amyloidosis. This does not occur in alpha-HCD, where Bence Jones proteinuria has never been
          reported.
      selected_evidence:
        snippet: the neoplastic cells also produce monoclonal LCs, usually of kappa type, that fail to
          assemble with the truncated heavy chain
        supports: SUPPORT
