      assertion_type: Diagnosis
      assertion:
        name: HMOX1 molecular confirmation
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: 'Establish biallelic pathogenic HMOX1 variants. Sequencing alone is not sufficient
          here, and the reported genotypes show why: the index case is a compound heterozygote carrying
          a whole-exon-2 deletion on the maternal allele against a small deletion on the paternal allele,
          so a copy-number method (deletion/duplication analysis, array-CGH, or a targeted dosage assay)
          is required or the maternal allele is missed and the patient is reported as a heterozygous carrier.
          A second patient carries an intronic splice-donor variant, which is only interpretable with
          splice-level analysis or a transcript study. Exome sequencing has been the practical route in
          the more recent cases, including one in which the disease was not suspected beforehand. Where
          a variant''s consequence is uncertain, the HO-1 induction assay above supplies the functional
          evidence. Note that the promoter (GT)n microsatellite literature concerns a separate, non-Mendelian
          modifier and has no role in diagnosing this disease.'
        results: Two pathogenic HMOX1 alleles confirm the diagnosis. A single detected variant in a consistent
          clinical and laboratory picture should prompt copy-number and splice analysis before the diagnosis
          is discarded.
      selected_evidence:
        snippet: Sequence analysis of the patient's HO-1 gene revealed complete loss of exon-2 of the
          maternal allele and a two-nucleotide deletion within exon3 of the paternal allele.
        supports: SUPPORT
