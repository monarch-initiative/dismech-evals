          edge, not rejected merely because intermediates are unknown. No comparably specific triglyceride
          mechanism is established. High serum haptoglobin and urinary Hb-Hp complexes document abnormal
          handling, but the relative roles of altered production and clearance in the high serum concentration
          have not been resolved.
      selected_evidence:
        snippet: 'The mechanism of hyperlipidemia, with high choles-

          terol and triglyceride levels, is not clear. Prolonged cor-

          ticosteroid therapy alone may explain the levels seen in

          this patient. Bilirubin is a known antioxidant (20), and

          it also acts as a scavenger for degraded LDL cholesterol

          (21–24). Impaired bilirubin production in this patient

          might also be responsible for the abnormally elevated

          serum cholesterol.'
