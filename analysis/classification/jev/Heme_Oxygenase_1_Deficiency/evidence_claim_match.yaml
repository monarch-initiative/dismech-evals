          paradox: a patient with brisk intravascular haemolysis has LOW serum bilirubin and no jaundice,
          because the bilirubin normally produced from the liberated heme is inadequately generated. Persistently
          elevated LDH alongside low bilirubin is the combination that prompted the diagnosis in at least
          one reported case.

          '
