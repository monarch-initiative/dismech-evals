        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: BELOW_1_IN_1000000
        notes: 'Roughly a dozen genetically confirmed patients have been reported since the index case
          in 1999. Five of the early cases came from India and shared an identical p.R44X allele, indicating
          a founder effect rather than independent recurrence, so the count of reported cases overstates
          the number of independent mutational events. Ascertainment is very likely incomplete in a specific
          direction: HO-1 may be required for normal fetal development, so an unknown fraction of affected
          conceptuses may die in utero or shortly after birth undiagnosed. Reported prevalence should
          therefore be read as a floor on the true birth incidence, not an estimate of it.'
      selected_evidence:
        snippet: To the best of our knowledge, our patient is the eleventh HMOX-1 deficiency case in the
          literature.
        supports: SUPPORT
