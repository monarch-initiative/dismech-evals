      assertion_type: Genetic
      assertion:
        name: HMOX1
        notes: HMOX1 encodes heme oxygenase 1, the stress-inducible isozyme. Reported pathogenic genotypes
          include compound heterozygosity for maternal exon-2 loss plus a paternal two-nucleotide exon-3
          deletion (index case), homozygous nonsense p.R44X (a founder allele accounting for the five
          early Indian cases), homozygous nonsense p.K204X, homozygous missense p.G139V, and compound
          heterozygous frameshift plus splice-donor alleles. The p.G139V missense allele retained constitutive
          HO-1 expression but lacked further hemin induction in cultured patient PBMC. A separate cellular
          assay demonstrated impaired heme-induced bilirubin synthesis. Abnormal peroxidase activity was
          inferred from urinary oxidation products and biochemical studies of other Gly139 substitutions,
          rather than directly measured for recombinant G139V. The original patient also carried homozygous
          SPON2 and IBTK variants considered possible modifiers, so variant-specific inflammatory features
          cannot be assigned exclusively to HMOX1.
        gene_term:
          preferred_term: HMOX1
          term:
            id: hgnc:5013
            label: HMOX1
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: All cases from India (Cases 2-6) displayed an identical homozygous mutation (p.R44X),
          indicating a founder effect of this particular mutation in that country.
        supports: SUPPORT
