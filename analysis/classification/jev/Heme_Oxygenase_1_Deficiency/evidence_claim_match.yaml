      assertion:
        name: Recognition of haemolysis without hyperbilirubinaemia
        diagnosis_term:
          preferred_term: blood chemistry measurement
          term:
            id: NCIT:C47868
            label: Blood Chemistry Measurement
        description: 'The entry point to the diagnosis is a routine laboratory pattern, not a specialised
          test: active haemolysis (raised LDH, fragmented erythrocytes, anaemia) with a bilirubin that
          is low or normal instead of raised, and no jaundice. The direction of the bilirubin is what
          matters — every other cause of brisk haemolysis raises it, so a normal value in this setting
          is already abnormal. A direct antiglobulin test is negative, which excludes the immune haemolytic
          anaemias that the picture otherwise resembles. Historically this pattern is what prompted HMOX1
          analysis in both the index case and the p.G139V patient, and it is available from a standard
          panel long before the disease is suspected. See the biochemical section for the quantitative
          markers (bilirubin, free heme, ferritin, haptoglobin, hemopexin) and their reported values.'
        results: Haemolysis with a low or normal bilirubin and a negative direct antiglobulin test should
          prompt HMOX1 testing rather than further immunohaematological workup.
      selected_evidence:
        snippet: HMOX1-deficiency is a rare autosomal recessive disorder with hallmark features of direct
          antibody negative hemolytic anemia with normal bilirubin, hyperinflammation and features similar
          to macrophage activation syndrome.
        supports: SUPPORT
