        context: []
      assertion_type: Phenotype
      assertion:
        category: Biochemical
        name: Hypobilirubinaemia Despite Haemolysis
        description: 'The single most discriminating feature. Bilirubin fails to rise despite brisk ongoing
          haemolysis that would normally produce marked unconjugated hyperbilirubinaemia, and jaundice
          is absent. This is the direct laboratory signature of the enzymatic block, since bilirubin is
          generated from heme via HO-1.

          NOTE on the frequency band, deliberately omitted: the source reports bilirubin as "low or within
          normal ranges in all cases", which establishes universal failure-to-rise but NOT that frank
          hypobilirubinaemia (the HP term bound here) occurs in 80% or more of patients. The index case
          was frankly low at 0.1 to 0.3 mg/dL, but a normal-range value in another patient does not instantiate
          HP:0033480. Rather than assert a band the evidence does not carry, no `frequency` is given.

          '
        phenotype_term:
          preferred_term: Hypobilirubinemia
          term:
            id: HP:0033480
            label: Hypobilirubinemia
      selected_evidence:
        snippet: More importantly, bilirubin remained low or within normal ranges in all cases, despite
          the presence of active hemolytic anemia. Paradoxical normo- or hypobilirubinemia in the presence
          of active hemolytic anemia is certainly the first denominator of HO-1 deficiency.
        supports: SUPPORT
