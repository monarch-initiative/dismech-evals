        context: []
      assertion_type: AnimalModel
      assertion:
        name: Hmox1-null mouse (Poss and Tonegawa, C57BL/6)
        species: Mouse
        genotype: Hmox1 -/- (targeted null)
        publication: PMID:9380735
        description: 'The founding genetic model, reported two years before the first human case and directly
          cited by Yachie et al. as corroborating their patient. Adult nulls develop anaemia with abnormally
          low serum iron yet accumulate hepatic and renal iron causing oxidative damage and chronic inflammation;
          embryonic fibroblasts are hypersensitive to hemin and peroxide, and adults die when challenged
          with endotoxin.

          '
        modeled_mechanisms:
        - target: Impaired Heme-Iron Recycling and Tissue Iron Deposition
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the counter-intuitive combination of low serum iron with hepatic and
            renal iron accumulation that defines this node, and was the experiment that established the
            recycling mechanism.
          limitations: Mouse nulls develop marked splenomegaly, whereas human patients characteristically
            have asplenia or functional hyposplenism, so the splenic phenotype does not transfer.
          readouts:
          - name: Hepatic and renal tissue iron content
            target: Impaired Heme-Iron Recycling and Tissue Iron Deposition
            direction: INCREASED
            interpretation: Tissue iron accumulation is the structural correlate of failed iron release
              from hepatic and renal cells.
        - target: Failure of Stress-Inducible Heme Catabolism
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Cells and animals lacking Hmox1 lose the adaptive protection normally conferred
            by its stress induction, which is the defining property of this node.
          limitations: Demonstrated with pharmacological and chemical stressors (hemin, peroxide, paraquat,
            cadmium, endotoxin) rather than with the spontaneous haemolytic load that drives the human
            disease.
          readouts:
          - name: Survival and hepatic necrosis after endotoxin challenge
            target: Failure of Stress-Inducible Heme Catabolism
            direction: DECREASED
            interpretation: Mortality on endotoxin challenge quantifies the loss of the inducible stress-protective
              response.
      selected_evidence:
        snippet: Here, we generated mice lacking functional heme oxygenase 1 (Hmox1; EC 1.14.99.3), which
          catabolizes heme to biliverdin, carbon monoxide, and free iron, to assess its participation
          in iron homeostasis.
        supports: SUPPORT
