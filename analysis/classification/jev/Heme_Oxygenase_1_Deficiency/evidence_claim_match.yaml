          forgiving way available: red cell lifespan is PROLONGED in Hmox1-null mice, whereas human patients
          have shortened red cell survival with fragmentation and intravascular haemolysis. The mouse
          anaemia is microcytic and attributed to defective erythroblastic-island formation, a different
