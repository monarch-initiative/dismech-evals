      assertion_type: Discussion
      assertion:
        discussion_id: hmox1_onset_variability_gap
        prompt: Why do patients with complete loss of an enzyme described as essential remain asymptomatic
          for years, and what compensates until the first flare?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of Stress-Inducible Heme Catabolism
        - pathophysiology#Systemic Inflammatory Response and Progressive Organ Injury
        rationale: 'Age at first recognisable symptom in reported patients ranges from 6 months to 15
          years, and several patients carrying the identical homozygous p.R44X allele grew and developed
          normally for over a decade before deteriorating rapidly and dying within months. Identical genotype
          with a decade of phenotypic variability implies compensatory mechanisms whose identity, capacity
          and mode of failure are entirely unknown. This matters practically: it means the disease has
          a long presymptomatic window in which a diagnosis could in principle be made on the low-bilirubin-with-high-LDH
          signature, and it means the trigger that exhausts compensation is a candidate intervention point.'
        proposed_experiments:
        - experiment_id: exp_hmox1_presymptomatic_sibling_profiling
          name: Longitudinal profiling of presymptomatic HMOX1-null siblings
          description: In consanguineous families with a known HMOX1 allele, genotype and longitudinally
            profile presymptomatic siblings for haemolysis markers, free heme, hemopexin, haptoglobin
            and inflammatory cytokines, to identify which parameter decompensates first and whether a
            compensatory heme-handling pathway is measurably active before the first flare.
          experiment_type:
            preferred_term: longitudinal cohort profiling experiment
      selected_evidence:
        snippet: The variability of age of onset and the rapidly progressive clinical course suggests
          the presence of certain compensatory mechanisms to overcome the absence of HO-1 function.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
