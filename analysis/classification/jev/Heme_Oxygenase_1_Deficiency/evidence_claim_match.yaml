      assertion_type: Treatment
      assertion:
        name: HO-1 Induction and CO-Releasing Molecules
        description: 'Investigational and mechanism-directed rather than established. Because the disease
          is loss of a cytoprotective response, the rational strategy is to restore its products: pharmacological
          induction of HO-1, CO-releasing molecules, or enhancement of haptoglobin-haemoglobin receptor
          expression. No clinical efficacy has been demonstrated in HO-1-deficient patients, and pharmacological
          HO-1 induction is conceptually futile in null genotypes where there is no enzyme to induce.
          This is recorded as a proposed direction, not a therapy.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: The prime target of such therapy is HO-1. Pharmacological induction of cellular HO-1
          production, use of CO-releasing molecules, or enhancement of Hb-Hp receptor expression by steroid
          are examples of these approaches.
        supports: SUPPORT
