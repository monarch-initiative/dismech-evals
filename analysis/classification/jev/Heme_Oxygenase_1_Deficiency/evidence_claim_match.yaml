              label: heme oxygenase 1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Stress-Inducible Heme Catabolism
        biological_scale: MOLECULAR
        description: 'HO-1 is the stress-inducible heme oxygenase isozyme, and the only one rapidly induced
          by oxidative stress. Its loss therefore does not merely slow basal heme turnover; it removes
          the surge capacity that normally meets an oxidative or haemolytic insult. Constitutive HMOX2
          cannot substitute because it is not inducible.

          (Sources differ on how many isozymes to count: the cited review says three, while the cited
          2020 case report says two. The discrepancy is the status of HO-3, now generally regarded as
          a pseudogene rather than a functional enzyme. Nothing in this entry depends on the count, so
          no number is asserted here; the quoted evidence below preserves each source''s own wording.)

          The consequence is a single enzymatic block that simultaneously fails to generate biliverdin
          and bilirubin, fails to generate carbon monoxide, fails to liberate iron for recycling, and
          leaves the heme substrate itself uncleared. Each of the four downstream arms below is a distinct
          consequence of this one block.

          '
        biological_processes:
        - preferred_term: heme catabolic process
          term:
            id: GO:0042167
            label: heme catabolic process
          modifier: DECREASED
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
          modifier: DECREASED
        cell_types:
        - preferred_term: Kupffer cell
          term:
            id: CL:0000091
            label: Kupffer cell
        - preferred_term: vascular endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
      selected_evidence:
        snippet: Heme oxygenase (HO)-1 constitutes one of the three isozymes of HO, and catalyzes the
          degradation of heme into biliverdin, carbon monoxide (CO), and free iron, each of which somehow
          exert potent anti-oxidative stress and anti-inflammatory functions
        supports: SUPPORT
