              id: MONDO:0013536
              label: heme oxygenase 1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HMOX1 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function variants in HMOX1 abolish or impair heme oxygenase 1
          function. Reported alleles span whole-exon deletion, frameshift, nonsense and missense classes.
          The p.G139V allele shows that loss of protein abundance is not required: patient cells retained
          constitutive HO-1 expression but lacked further hemin induction and showed impaired heme-induced
          bilirubin synthesis. Acquired abnormal peroxidase activity was inferred from human urinary oxidation
          products and biochemical studies of other Gly139 substitutions. Loss of inducibility alone does
          not establish these distinct functional defects.'
        genes:
        - preferred_term: HMOX1
          term:
            id: hgnc:5013
            label: HMOX1
        molecular_functions:
        - preferred_term: heme oxygenase (decyclizing) activity
          term:
            id: GO:0004392
            label: heme oxygenase (decyclizing) activity
          modifier: DECREASED
      selected_evidence:
        snippet: The strong constitutive expression of HO-1 G139V with defective normal but gained abnormal
          peroxidase function was paralleled by increased excretion of peroxidation products in the urine
          of the patient and, to some degree, in his heterozygous parents and heterozygous brother (Table
          2).
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/4
