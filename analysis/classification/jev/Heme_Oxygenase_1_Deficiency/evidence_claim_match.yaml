  c39a192fb2e2f74f9a49367060279b47078d7e75659e8549c98db4b8443aae9a:
    claim:
      about:
        disease:
          name: Heme Oxygenase 1 Deficiency
          disease_term:
            preferred_term: Heme oxygenase 1 deficiency
            term:
              id: MONDO:0013536
              label: heme oxygenase 1 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hmox1_rodent_human_divergence
        prompt: Which features of HMOX1 deficiency can legitimately be studied in Hmox1-null rodents,
          given that the mouse and rat models diverge from human patients on the splenic and tissue-iron
          phenotypes that are cardinal in humans?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Heme-Iron Recycling and Tissue Iron Deposition
        - pathophysiology#Macrophage and Monocyte Dysfunction
        rationale: 'Only about a dozen human patients have ever been reported, so a large share of the
          mechanism in this entry rests on rodent data, and the rodents disagree with the humans, and
          with each other, on exactly the features that define the disease clinically. Three divergences
          are documented, and they differ in kind. (i) ORGAN-SYSTEM EMPHASIS AND SURVIVAL: the first human
          autopsy states the contrast itself, finding endothelial and reticuloendothelial involvement
          with intravascular haemolysis, DIC and amyloidosis and short survival, against a predominantly
          iron-metabolic, long-surviving mouse. (ii) ERYTHROCYTE LIFESPAN RUNS THE WRONG WAY: red cell
          lifespan is *prolonged* in Hmox1-null mice, while human patients have shortened red cell survival
          with fragmentation — an opposite-direction finding, not a difference of degree, and the reason
          no conformance to a haemolysis module should be asserted on mouse evidence. (iii) TISSUE IRON:
          the Hmox1-null rat does not deposit iron in tubular epithelium or hepatic parenchyma at all.
          Human patients characteristically have asplenia or functional hyposplenism; the original C57BL/6
          Hmox1-null mouse instead develops marked splenomegaly, while a mixed-background null strain
          shows early splenomegaly evolving into fibrotic atrophy and functional hyposplenism, so the
          apparent mouse-human agreement depends on strain background rather than on Hmox1 genotype alone.
          The Hmox1-deficient rat diverges more sharply still: it does not develop the hepatic or renal
          iron deposition that is cardinal in both human patients and mice. That is not merely a missing
          measurement but a directly contradictory positive finding in a model that otherwise reproduces
          haemolysis and renal disease, so the iron arm and the haemolysis and renal arms of the rodent
          literature have different translational standing and should not be inherited wholesale. Conversely,
          the arms where rodents and humans do converge (failed iron recycling with low serum iron, hypersensitivity
          of null cells to heme and oxidant stress, and macrophage death during erythrophagocytosis) are
          the arms where model evidence can reasonably substitute for the human data that will never exist
          in quantity.'
        proposed_experiments:
        - experiment_id: exp_hmox1_cross_species_iron_handling
          name: Cross-species comparison of splenic and hepatic iron handling
          description: Systematically compare erythrophagocytosing macrophage iron handling, CD163 expression
            and splenic red-pulp architecture across Hmox1-null mouse strains, the Hmox1-null rat, and
            archived human HO-1-deficient tissue, with age-matched timepoints extending beyond 24 weeks
            in the rat, to determine whether the rat iron phenotype is genuinely absent or merely later-onset.
          experiment_type:
            preferred_term: cross-species model comparison experiment
        - experiment_id: exp_hmox1_patient_derived_cell_models
          name: Patient-derived macrophage and endothelial models
          description: Derive iPSC macrophages and endothelial cells from HMOX1-deficient patients, or
            generate isogenic HMOX1-null human lines carrying the reported p.R44X and p.G139V alleles,
            and test heme handling, CD163 expression, and tissue-factor and PAI-1 induction, to obtain
            human-cell evidence for the arms currently supported only by rodents.
          experiment_type:
            preferred_term: patient-derived cell model experiment
      selected_evidence:
        snippet: Compared with HO-1--targeted mice, the present case seems to more severely involve endothelial
          cells and the reticuloendothelial system, resulting in intravascular hemolysis, disseminated
          intravascular coagulation, and amyloidosis with a short survival. This contrasts to the predominant
          iron metabolic disorders of HO-1--targeted mice with a long survival.
        supports: SUPPORT
