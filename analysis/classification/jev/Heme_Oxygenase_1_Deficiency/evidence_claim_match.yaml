  7c44bfbc9377a6983e782fc097a7596fcb1e2df8ab21433b1da71aa3c60e27e6:
    claim:
      about:
        disease:
          name: Heme Oxygenase 1 Deficiency
          disease_term:
            preferred_term: Heme oxygenase 1 deficiency
            term:
              id: MONDO:0013536
              label: heme oxygenase 1 deficiency
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Hmox1-null mouse (mixed C57BL/6-FVB background)
        species: Mouse
        genotype: Hmox1 -/- (targeted null, mixed background)
        publication: PMID:33546372
        description: 'A second null strain on a mixed background whose splenic phenotype evolves from
          early splenomegaly to progressive red-pulp fibrosis, atrophy and functional hyposplenism with
          Howell-Jolly bodies. This strain is the one that reconciles the mouse splenic phenotype with
          human asplenia, and it also shows macrophage death during erythrophagocytosis and reduced CD163.

          '
        modeled_mechanisms:
        - target: Macrophage and Monocyte Dysfunction
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Demonstrates the specific cellular mechanism of this node, macrophages dying as
            they phagocytose erythrocytes and release heme they cannot catabolise, together with loss
            of the CD163 scavenger receptor.
          limitations: 'Background-dependent: the splenic trajectory differs from the C57BL/6 null strain,
            so the phenotype is not a stable property of Hmox1 loss alone. Reported here via a review
            rather than from the primary strain paper.'
          readouts:
          - name: Macrophage survival during erythrophagocytosis
            target: Macrophage and Monocyte Dysfunction
            direction: DECREASED
            interpretation: Progressive macrophage death during erythrophagocytosis is the measured correlate
              of the macrophage-failure node.
        - target: Intravascular Haemolysis with Erythrocyte Fragmentation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: 'The mouse does not reproduce the human haemolytic phenotype, and fails in the
            least forgiving way available: red cell lifespan is PROLONGED in Hmox1-null mice, whereas
            human patients have shortened red cell survival with fragmentation and intravascular haemolysis.
            The mouse anaemia is microcytic and attributed to defective erythroblastic-island formation,
            a different mechanism from the human one.'
          limitations: Because the direction is reversed rather than merely attenuated, no conformance
            to a haemolysis mechanism module may be asserted on the strength of mouse data for this disease;
            human evidence is required. The authors note the prolonged lifespan may actually ameliorate
            the murine anaemia, which is the opposite of its role in patients.
          readouts:
          - name: Circulating red blood cell lifespan
            target: Intravascular Haemolysis with Erythrocyte Fragmentation
            direction: INCREASED
            interpretation: Increased rather than decreased red cell lifespan is the measurement that
              inverts the human phenotype.
        - target: Macrophage and Monocyte Dysfunction
          relationship: RESCUES
          fidelity: MODERATE
          description: Subablative bone marrow transplantation repopulates the tissues with wild-type
            macrophages and reverses the Hmox1-null phenotype, which is the strongest available evidence
            that macrophage failure is causally sufficient for the downstream disease rather than merely
            correlated with it. Donor-derived Kupffer cells expressing Hmox1 persisted in the liver and
            restored heme-recycling capacity even after engraftment became transient.
          limitations: This particular rescue experiment is mouse-only. Engraftment was transient, and
            the durable benefit depended on long-lived donor-derived liver macrophages, so the result
            may not generalise to organs whose macrophages turn over differently. It also does not address
            the endothelial arm directly.
          readouts:
          - name: Anaemia, blood chemistry, iron parameters and renal damage after BMT
            target: Macrophage and Monocyte Dysfunction
            direction: RESTORED
            interpretation: Reversal of the haematological, biochemical and renal phenotype on macrophage
              replacement is the rescue readout for this node.
      selected_evidence:
        snippet: Kovtunovych et al. published a detailed study on the iron distribution and pathology
          of another strain of HO-1-knockout mice using a mixed C57BL/6-FVB background
        supports: SUPPORT
