  155af7e18d4f90f6f598cc648167eb832aad93ceda1249efc94c9b6754ec35f3:
    claim:
      about:
        disease:
          name: Heme Oxygenase 1 Deficiency
          disease_term:
            preferred_term: Heme oxygenase 1 deficiency
            term:
              id: MONDO:0013536
              label: heme oxygenase 1 deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Ascorbate Supplementation
        description: 'A genuine mechanism-directed therapeutic lead, and PRECLINICAL/IN VITRO only. HMOX1-deficient
          patient-derived lymphoblastoid cells and HEK293T HMOX1-null cells both show substantially reduced
          intracellular ascorbate (despite compensatory SVCT2 upregulation), abnormal mitochondrial morphology
          and raised baseline hydrogen peroxide. 2-phospho-L-ascorbic acid restored viability under hemin
          stress in both models, dependent on functional SVCT2-mediated uptake, and lowered H2O2 without
          shifting the GSH/GSSG ratio.

          Curated as PROPOSED-grade: no patient has been treated, no clinical outcome is reported, and
          the effect is demonstrated in cell models only. It is listed because it is the one lead in this
          literature that targets a measured metabolic deficit in patient cells rather than restoring
          an enzyme that is absent.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ascorbate
            term:
              id: CHEBI:38290
              label: L-ascorbate
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: These findings illuminate ascorbic acid metabolism as a critical node in HO-1 deficiency
          pathophysiology and suggest ascorbic acid supplementation as a potential therapeutic strategy
          for this rare disorder.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40945734
      reference_title: Ascorbate mitigates oxidative stress and hemin cytotoxicity in heme oxygenase-1
