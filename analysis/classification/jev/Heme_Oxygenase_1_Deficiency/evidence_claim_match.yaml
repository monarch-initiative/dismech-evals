      assertion:
        discussion_id: hmox1_splenic_outcome_attribution
        prompt: What determines congenital absence, acquired splenic loss, or enlargement in human HMOX1
          deficiency?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Asplenia
        - phenotypes#Splenic Hypoplasia
        - phenotypes#Splenomegaly
        rationale: Human patients show distinct splenic courses. The US imaging suggests infarction, whereas
          a mixed-background mouse model develops macrophage loss, red-pulp fibrosis and later atrophy.
          These observations do not establish that the same process causes congenital human asplenia or
          human splenomegaly. This is uncertainty in developmental versus acquired causal attribution
          and model translation, not a claim that splenic injury has no mechanism. The documented hyposplenia-to-thrombocytosis
          consequence is modeled.
      selected_evidence:
        snippet: Further imaging with CTA abdomen demonstrated absent splenic veins and multiple collaterals
          to a small left kidney, implying that patient’s spleen had infarcted.
        supports: SUPPORT
