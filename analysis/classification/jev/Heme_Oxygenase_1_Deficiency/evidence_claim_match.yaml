        description: 'The functional confirmation, and the test that distinguishes this disease from a
          merely low HMOX1 transcript level. HO-1 is normally absent at rest and produced only on stress
          induction, so the assay deliberately provokes it: patient monocytes or an Epstein-Barr-virus-transformed
          lymphoblastoid cell line are stimulated with an oxidative stressor (cadmium chloride or sodium
          arsenite) and HO-1 protein is then sought by immunoblot. In an affected patient no protein appears
          after stimulation. An unstimulated sample is uninformative because a healthy control is also
          negative at baseline, which is why this is an induction assay rather than a simple expression
          measurement. It has been applied in the index case and independently in at least two later patients,
          including one whose variants were novel, and it is the practical route to demonstrating that
          a variant of uncertain significance abolishes protein production. A paired hemin-sensitivity
          assay on the same cells provides a second functional readout.'
        results: Absence of HO-1 protein on immunoblot after oxidative stimulation confirms loss of function;
          hemin exposure of the same cells shows reduced viability.
