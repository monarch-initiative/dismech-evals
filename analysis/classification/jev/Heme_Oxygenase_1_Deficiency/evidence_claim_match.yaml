        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Carbon Monoxide Cytoprotective Signalling
        biological_scale: MOLECULAR
        description: 'CO produced by heme ring opening acts as a gaseous mediator that restrains inflammatory
          signalling and regulates the microcirculation and the coagulation and fibrinolysis balance.
          Loss of endogenous CO is the arm most often invoked to explain the disproportionate endothelial
          and coagulation abnormalities of this disease, but this attribution is a hypothesis rather than
          a demonstrated mechanism in patients: the supporting experiment is an add-back, in which exogenous
          CO-releasing molecules suppress TNF-alpha-driven upregulation of tissue factor and plasminogen
          activator inhibitor type 1 in cultured human endothelial cells and suppress LPS-induced TNF-alpha
          production by mononuclear cells. Endogenous CO deficiency has not been measured in a patient,
          so both downstream edges are marked indirect.

          '
        biological_processes:
        - preferred_term: cellular response to carbon monoxide
          term:
            id: GO:0071245
            label: cellular response to carbon monoxide
          modifier: DECREASED
      selected_evidence:
        snippet: We recently demonstrated in in vitro cultures that a CO-releasing molecule, tricarbonyldichlororuthenium
          (II) dimer suppressed TNF-α-induced up-regulation of tissue factor and plasminogen activator
          inhibitor type 1 by human umbilical vein endothelial cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
