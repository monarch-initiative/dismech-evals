            term:
              id: MONDO:0013536
              label: heme oxygenase 1 deficiency
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: innate immunity defect
        notes: 'IUIS 2022 phenotypic classification Table 6 (defects in intrinsic and innate immunity),
          section 8 (Other Inborn Errors of Immunity Related to Non-Hematopoietic Tissues): the row printed
          as "HMOX" (AR, OMIM column 141250 - the HMOX1 gene record). The placement is initially surprising
          - this entry reads primarily as a haemolytic and autoinflammatory disorder, not an infection-susceptibility
          syndrome - but the IUIS rationale is macrophage-intrinsic: the table''s affected-cells column
          is macrophages, and its affected-function column is HO-1''s role in iron recycling, with heme-dependent
          damage when it fails. The IUIS committee thus carries HO-1 deficiency as an inborn error of
          an innate (macrophage) housekeeping program whose failure produces haemolysis, nephritis and
          systemic inflammation, and files it in Table 6''s residual non-hematopoietic-tissue section
          rather than under immune dysregulation or autoinflammation. The single-valued IUIS assignment
          here transcribes that committee placement.'
      selected_evidence:
        snippet: HMOX AR 141250 Macrophages HO-1 regulates iron recycling and heme-dependent damage occurs
          Hemolysis, nephritis, inflammation
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
