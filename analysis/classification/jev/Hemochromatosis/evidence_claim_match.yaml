      assertion:
        name: Impaired Ferritin H-Subunit Ferroxidase Activity from FTH1 IRE Variant
        description: The A49U point mutation in the iron-responsive element of ferritin H-subunit mRNA
          increases the binding affinity of iron regulatory protein for that element, so translational
          repression of the H subunit is not relieved when iron is plentiful. H-subunit synthesis and
          iron uptake into ferritin fall, and the reported family's tissue iron deposition is attributed
          to loss of the ferroxidase activity the H subunit supplies. This is the mechanism of the type
          5 subtype.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: FTH1
          term:
            id: hgnc:3976
            label: FTH1
        molecular_functions:
        - preferred_term: ferroxidase activity
          term:
            id: GO:0004322
            label: ferroxidase activity
          modifier: DECREASED
      selected_evidence:
        snippet: a mutated IRE probe had a higher binding affinity to IRP than did the wild-type probe
        supports: SUPPORT
