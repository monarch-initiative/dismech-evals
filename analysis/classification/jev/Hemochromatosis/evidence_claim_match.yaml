  455ff10916ae55869011742eae57a83e4ca3a8372f1986d3477cea03bb53e054:
    claim:
      about:
        disease:
          name: Hemochromatosis
          disease_term:
            preferred_term: hereditary hemochromatosis
            term:
              id: MONDO:0006507
              label: hereditary hemochromatosis
        context: []
      assertion_type: Subtype
      assertion:
        name: Type 4
        display_name: SLC40A1-related hemochromatosis and ferroportin disease
        description: Iron overload from heterozygous SLC40A1 variants, dominantly inherited unlike the
          HFE, HJV, HAMP and TFR2 types. The gene carries two distinct allelic classes. Gain-of-function
          variants make ferroportin resistant to hepcidin, so iron export continues unregulated and the
          picture is indistinguishable from the hepcidin-deficient types; this is the entity MONDO's definition
          of hemochromatosis type 4 describes, formerly called type 4B. Loss-of-function variants instead
          reduce ferroportin expression or its export capacity, retaining iron in macrophages, and give
          normal to low transferrin saturation with a tendency to anemia; that entity is ferroportin disease,
          formerly type 4A, which the same MONDO class carries as an exact synonym although the literature
          treats it as a separate condition.
        subtype_term:
          preferred_term: hemochromatosis type 4
          term:
            id: MONDO:0011631
            label: hemochromatosis type 4
        genes:
        - preferred_term: SLC40A1
          term:
            id: hgnc:10909
            label: SLC40A1
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: or a gain-of-function mutation in the gene encoding hepcidin receptor ferroportin (FPN1/SLC40A1)
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/4
      evidence_path: /has_subtypes/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41882292
      reference_title: Comparing the types of haemochromatosis- from genetics to clinics.
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      explanation: Places SLC40A1 gain-of-function variants among the causes of haemochromatosis, the
        basis for this subtype row.
