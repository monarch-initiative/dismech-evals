          term:
            id: hgnc:3976
            label: FTH1
        relationship_type: CAUSATIVE
        subtype: Type 5
        notes: FTH1 encodes the ferritin heavy chain, whose ferroxidase activity loads iron into ferritin.
          The reported disease variant is not in the coding sequence but in the iron-responsive element
          of the 5' untranslated region, so it acts by keeping translation repressed rather than by altering
          the protein. Evidence rests on one family, and ClinGen grades the relationship to hemochromatosis
