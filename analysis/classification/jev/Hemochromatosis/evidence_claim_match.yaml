      selected_evidence:
        snippet: Because secondary hemochromatosis is due to hereditary or acquired anemia, phlebotomy
          is not a suitable means of removing excess iron in this situation. Rather, the treatment is
          based on the targeted elimination of iron by means of iron chelators.
        supports: SUPPORT
