        description: Gain-of-function SLC40A1 variants sit at the hepcidin binding site on ferroportin,
          so the exporter is no longer internalized and degraded when hepcidin rises. Iron export from
          enterocytes and macrophages therefore continues unregulated, and the resulting overload looks
          like the hepcidin-deficient types even though hepcidin itself is not deficient. This is the
          mechanism of the type 4 subtype's gain-of-function allelic class.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SLC40A1
