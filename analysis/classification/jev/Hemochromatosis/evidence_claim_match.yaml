            term:
              id: MONDO:0006507
              label: hereditary hemochromatosis
        context:
        - path: /has_subtypes/4
          value:
            name: Type 4
            display_name: SLC40A1-related hemochromatosis and ferroportin disease
            description: Iron overload from heterozygous SLC40A1 variants, dominantly inherited unlike
              the HFE, HJV, HAMP and TFR2 types. The gene carries two distinct allelic classes. Gain-of-function
              variants make ferroportin resistant to hepcidin, so iron export continues unregulated and
              the picture is indistinguishable from the hepcidin-deficient types; this is the entity MONDO's
              definition of hemochromatosis type 4 describes, formerly called type 4B. Loss-of-function
              variants instead reduce ferroportin expression or its export capacity, retaining iron in
              macrophages, and give normal to low transferrin saturation with a tendency to anemia; that
              entity is ferroportin disease, formerly type 4A, which the same MONDO class carries as an
              exact synonym although the literature treats it as a separate condition.
            subtype_term:
              preferred_term: hemochromatosis type 4
              term:
                id: MONDO:0011631
                label: hemochromatosis type 4
            genes:
            - preferred_term: SLC40A1
              term:
                id: hgnc:10909
                label: SLC40A1
          role: subtype
      assertion_type: Biochemical
      assertion:
        name: Normal to Low Transferrin Saturation in Ferroportin Disease
        presence: normal
        subtype: Type 4
        biomarker_term:
          preferred_term: transferrin saturation measurement
          term:
            id: NCIT:C98792
            label: Transferrin Saturation Measurement
        notes: 'The loss-of-function allelic class of SLC40A1, ferroportin disease, inverts the biochemical
          hallmark of the other hemochromatosis types: iron is retained inside macrophages instead of
          being exported, so transferrin saturation is normal or low while ferritin is high. It does not
          apply to the gain-of-function class of the same subtype, where transferrin saturation is elevated
          as in the hepcidin-deficient types.'
      selected_evidence:
        snippet: However, ferroportin disease differs from these aforementioned types as here, TSAT levels
          are normal to low, and anaemia may be present
        supports: SUPPORT
    origin:
