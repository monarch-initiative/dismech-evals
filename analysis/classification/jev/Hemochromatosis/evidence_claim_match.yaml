  53aab9575ca8a41e6dc363abe0d7b61ce6a4adbc6512e22e3a2a872acff8b526:
    claim:
      about:
        disease:
          name: Hemochromatosis
          disease_term:
            preferred_term: hereditary hemochromatosis
            term:
              id: MONDO:0006507
              label: hereditary hemochromatosis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ferroportin Disease (SLC40A1-Related Hemochromatosis)
        description: 'Ferroportin disease is the loss-of-function allelic class of SLC40A1. Reduced ferroportin
          expression or export capacity retains iron in macrophages, giving hyperferritinemia with normal
          to low transferrin saturation and a tendency to anemia. It is dominantly inherited and presents
          with high ferritin, so it has to be distinguished from HFE hemochromatosis, but the biochemical
          and cellular pattern is the inverse and the literature does not count it as a hemochromatosis
          type. The gain-of-function class of the same gene is a hemochromatosis type and is curated as
          the Type 4 subtype of this entry; MONDO carries both classes under MONDO:0011631.

          '
        distinguishing_features:
        - Often autosomal dominant inheritance pattern
        - Hyperferritinemia with normal to low transferrin saturation, unlike the other hemochromatosis
          types
        - Iron retained in macrophages and spleen rather than exported to parenchymal cells
        - Genetic testing reveals loss-of-function SLC40A1 variants affecting ferroportin
      selected_evidence:
        snippet: SLC40A1-related haemochromatosis is associated with gain-of-function mutations in the
          SLC40A1 gene, which encodes ferroportin.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
