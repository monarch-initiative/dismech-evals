              id: MONDO:0006507
              label: hereditary hemochromatosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_hfe_hepcidin_iron_overload_model
        hypothesis_label: Canonical HFE / Hepcidin / Systemic Iron Overload Model
        status: CANONICAL
        description: Hereditary hemochromatosis (HH), most commonly HFE-related (C282Y homozygotes), arises
          from inappropriately low hepatic hepcidin expression relative to body iron stores. Hepcidin
          is the master regulator of systemic iron homeostasis, binding ferroportin on enterocytes and
          macrophages and causing its internalization and degradation, thereby restricting duodenal iron
          absorption and reticuloendothelial iron release. Loss-of-function variants in HFE, HJV, TfR2,
          and HAMP all converge on a final common pathway of relative hepcidin deficiency, leading to
          chronic increased duodenal iron absorption, transferrin saturation, and progressive non-transferrin-bound
          iron accumulation in hepatocytes, cardiomyocytes, pancreatic β-cells, and endocrine tissues.
          Tissue iron toxicity produces cirrhosis, hepatocellular carcinoma, cardiomyopathy, diabetes,
          hypogonadism, and arthropathy. Therapeutic phlebotomy and investigational hepcidin agonists
          / ferroportin inhibitors all corroborate the hepcidin-deficient-iron-overload axis as the canonical
          pathogenic mechanism.
        notes: 'Retained as CANONICAL with important scope limits. The 2026 falcon hypothesis-search report
          (kb/hypotheses/Hemochromatosis/canonical_hfe_hepcidin_iron_overload_model; openscientist timed
          out at 3600s) confirms a final common pathway in which genetic hepcidin insufficiency or ineffective
          hepcidin signaling fails to restrain ferroportin-mediated iron export, producing intestinal
          iron hyperabsorption → high transferrin saturation (TSAT) → non-transferrin-bound iron (NTBI)
          → parenchymal iron loading of liver, heart, endocrine tissues, and joints. Validated by human
          genetics, guideline consensus, and direct pharmacologic/structural evidence showing hepcidin
          restoration or ferroportin inhibition lowers circulating iron indices. Four important caveats:
          (1) HFE C282Y homozygosity shows VARIABLE PENETRANCE — many homozygotes never develop clinically
          significant iron overload, requiring environmental or genetic modifiers; (2) modifier effects
          include alcohol, dysmetabolic liver disease / NAFLD, diabetes, and fibrosis modifier genes;
          (3) genotype-dependent phenotypic divergence — e.g., ferroportin disease (autosomal-dominant
          SLC40A1) shows macrophage-predominant iron loading distinct from the hepatocyte-dominant HFE/HJV/HAMP/TfR2
          pattern; (4) downstream tissue injury (arthropathy, fibrosis) is incompletely explained by the
          canonical model — mouse models with extreme TSAT show limited spontaneous fibrosis, indicating
          additional modulators of parenchymal injury beyond iron load alone.'
      selected_evidence:
        snippet: Hereditary hemochromatosis is an inherited iron overload disorder caused by inappropriately
          low hepcidin secretion leading to increased duodenal absorption of dietary iron
        supports: SUPPORT
