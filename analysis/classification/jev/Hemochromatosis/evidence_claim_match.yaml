        - path: /has_subtypes/4
          value:
            name: Type 4
            display_name: SLC40A1-related hemochromatosis and ferroportin disease
            description: Iron overload from heterozygous SLC40A1 variants, dominantly inherited unlike
              the HFE, HJV, HAMP and TFR2 types. The gene carries two distinct allelic classes. Gain-of-function
              variants make ferroportin resistant to hepcidin, so iron export continues unregulated and
              the picture is indistinguishable from the hepcidin-deficient types; this is the entity MONDO's
              definition of hemochromatosis type 4 describes, formerly called type 4B. Loss-of-function
              variants instead reduce ferroportin expression or its export capacity, retaining iron in
              macrophages, and give normal to low transferrin saturation with a tendency to anemia; that
              entity is ferroportin disease, formerly type 4A, which the same MONDO class carries as an
              exact synonym although the literature treats it as a separate condition.
            subtype_term:
              preferred_term: hemochromatosis type 4
              term:
                id: MONDO:0011631
                label: hemochromatosis type 4
            genes:
            - preferred_term: SLC40A1
              term:
                id: hgnc:10909
                label: SLC40A1
          role: subtype
      assertion_type: Genetic
      assertion:
        name: SLC40A1 Mutations
        association: Causative
        gene_term:
          preferred_term: SLC40A1
          term:
            id: hgnc:10909
            label: SLC40A1
        relationship_type: CAUSATIVE
        subtype: Type 4
        notes: 'SLC40A1 encodes ferroportin, the cellular iron exporter and the receptor hepcidin acts
          on. Heterozygous variants act in two opposite directions: gain-of-function variants give hepcidin-resistant
          export and the hemochromatosis picture, while loss-of-function variants give ferroportin disease
          with macrophage iron retention and normal to low transferrin saturation. SLC40A1 carries no
          ClinGen gene-disease validity assertion, so no classification is quoted for it here.'
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: SLC40A1-related haemochromatosis is associated with gain-of-function mutations in the
          SLC40A1 gene, which encodes ferroportin.
        supports: SUPPORT
