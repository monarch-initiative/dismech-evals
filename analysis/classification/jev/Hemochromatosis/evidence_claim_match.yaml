          term:
            id: CL:0000584
            label: enterocyte
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
      selected_evidence:
        snippet: In gain-of-function SLC40A1 mutations, ferroportin is resistant to hepcidin activity.
          This leads to unregulated iron export from enterocytes and macrophages and thus, systemic iron
          overload.
        supports: SUPPORT
