          point mutation in the iron-responsive element of ferritin H-subunit mRNA. The mutated element
          binds iron regulatory protein more tightly than wild type, so H-subunit translation stays repressed,
          and the authors attribute the tissue iron deposition to loss of the ferroxidase activity that
          the H subunit provides. ClinGen grades the FTH1 relationship to this disease Limited.
