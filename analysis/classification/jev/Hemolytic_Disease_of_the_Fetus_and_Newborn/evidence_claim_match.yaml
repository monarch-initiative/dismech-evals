        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hdfn_no_prophylaxis_for_non_d_antibodies
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Can alloimmunisation to non-D red-cell antigens — anti-K above all, which causes the most
          severe disease per unit titre — be prevented, given that immunoprophylaxis exists only for D?
        rationale: 'Anti-D prophylaxis has been so effective that the residual disease burden is increasingly
          composed of specificities against which nothing preventive exists. Anti-K is the clearest case:
          it produces severe anemia by a different mechanism, its titre does not track severity, and most
          maternal K sensitisation is transfusion-acquired rather than pregnancy-acquired, which makes
          it addressable by K-matched transfusion policy for people of reproductive potential rather than
          by a new immunoglobulin. Whether such a policy actually reduces HDFN incidence has not been
          demonstrated.'
        attaches_to:
        - pathophysiology#Anti-Kell Suppression of Fetal Erythroid Progenitors
        - pathophysiology#Maternal Alloimmunization and IgG Alloantibody Production
      selected_evidence:
        snippet: Although several other antibodies may also destroy red blood cells of the fetus and newborn,
          preventive measures with anti-D immunoglobulin are only available for D antigen.
        supports: SUPPORT
