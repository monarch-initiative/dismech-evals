      assertion:
        name: Anti-D Immunoglobulin Prophylaxis
        description: 'Passive anti-D IgG given to non-sensitised D-negative pregnant people at around
          28 weeks and after delivery of a D-positive infant, plus additional doses after sensitising
          events. This is prophylaxis against the disease ever starting, not treatment of an established
          case: it prevents the primary alloimmune response to fetal D-positive cells, and is useless
          once alloimmunisation has occurred.

          '
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: anti-D immunoglobulin prophylaxis
          term:
            id: NCIT:C62710
            label: Immunoglobulin Therapy
          therapeutic_agent:
          - preferred_term: human Rho(D) immune globulin
            term:
              id: NCIT:C80832
              label: Human Rho(D) Immune Globulin
        notes: 'The mechanism by which passive IgG suppresses an active alloimmune response is still not
          settled; epitope masking, immune deviation and antigen modulation are all candidates, and the
          discriminating experiments are in mice. See the HUMAN_MODEL_MISMATCH discussion on this entry.

          '
      selected_evidence:
        snippet: Although several other antibodies may also destroy red blood cells of the fetus and newborn,
          preventive measures with anti-D immunoglobulin are only available for D antigen.
        supports: SUPPORT
