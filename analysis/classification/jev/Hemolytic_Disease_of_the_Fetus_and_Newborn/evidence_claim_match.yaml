      assertion_type: Pathophysiology
      assertion:
        name: Hydrops Fetalis and Fetal Death
        biological_scale: ORGANISM
        description: 'Severe anemia produces high-output cardiac failure and abnormal fluid accumulation
          in two or more fetal compartments — ascites, pleural and pericardial effusions, skin oedema,
          often with placentomegaly and polyhydramnios. Hydrops is the pre-terminal state of untreated
          HDFN, and it is also the strongest antenatal predictor of long-term neurological outcome among
          fetuses who are rescued: in the largest follow-up cohort, severe hydrops carried an eleven-fold
          odds of neurodevelopmental impairment. Preventing hydrops, rather than merely surviving it,
          is therefore the treatment target.

          '
      selected_evidence:
        snippet: Prevention of fetal hydrops, the strongest preoperative predictor for impaired neurodevelopment,
          by timely detection, referral and treatment may improve long-term outcome.
        supports: SUPPORT
