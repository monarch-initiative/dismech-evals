          units rather than on mature circulating red cells, arresting erythropoiesis at the progenitor
          stage. The clinical signature is diagnostic of the mechanism: severe anemia with disproportionately
          little hemolysis, and reticulocyte and normoblast counts that are inappropriately low for the
          degree of anemia — the opposite of what Rh disease produces. Practically this means anti-K titres
          and amniotic-fluid bilirubin underestimate risk, and Kell-alloimmunised pregnancies must be
          monitored by direct anemia assessment instead.

          '
