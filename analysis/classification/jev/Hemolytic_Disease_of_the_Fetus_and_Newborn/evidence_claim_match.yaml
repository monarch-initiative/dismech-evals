        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does FcRn blockade actually reduce intrauterine transfusion, hydrops and perinatal death
          in severe HDFN when tested against a concurrent randomised control rather than against a 0%
          historical benchmark?
        rationale: The phase 2 efficacy signal is genuinely striking, but it comes from 13 open-label
          pregnancies compared with an assumed historical rate of zero. Historical benchmarks in a disease
          whose management has changed substantially over the same period are the weakest available comparator,
          and the enrolled population was selected on prior obstetric history, which selects for recurrence
          risk in a way a contemporaneous cohort would not. The confirmatory randomised trial exists and
          is enrolling; until it reports, this entry deliberately marks the efficacy claim as PARTIAL
          rather than SUPPORT.
        attaches_to:
        - pathophysiology#FcRn-Mediated Transplacental IgG Transfer
        proposed_experiments:
        - experiment_id: exp_hdfn_azalea_randomised_readout
          name: AZALEA randomised placebo-controlled phase 3 readout
          description: 'Report the AZALEA randomised placebo-controlled phase 3 result on the composite
            of intrauterine transfusion, hydrops fetalis and fetal loss/neonatal death, with the HDFN
            severity index and FcRn receptor occupancy as supporting pharmacodynamic evidence.

            '
      selected_evidence:
        snippet: The primary end point was live birth at 32 weeks' gestation or later without intrauterine
          transfusions as assessed against a historical benchmark (0%; clinically meaningful difference,
          10%).
        supports: SUPPORT
