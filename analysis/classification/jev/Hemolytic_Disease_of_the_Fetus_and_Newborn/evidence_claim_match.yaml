      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: erythroid_progenitor_suppression
        hypothesis_label: Alloantibody suppression of erythroid progenitors (Kell arm)
        status: ALTERNATIVE
        description: 'A mechanistically distinct, antibody-specificity-dependent route in which the alloantibody
          inhibits Kell-positive erythroid progenitors rather than destroying mature red cells. This is
          not a competing explanation of the same observations but a competing explanation for a different
          subset of pregnancies: it predicts anemia with low reticulocytes, little hemolysis, and less
          hyperbilirubinemia, and it is the reason antibody titre and amniotic-fluid spectrophotometry
          are unreliable in Kell alloimmunisation. Both arms converge on the same fetal-anemia node.

          '
      selected_evidence:
        snippet: Anti-Kell antibodies specifically inhibit the growth of Kell-positive erythroid burst-forming
          units and colony-forming units, a finding that supports the hypothesis that these antibodies
          cause fetal anemia by suppressing erythropoiesis at the progenitor-cell level.
        supports: SUPPORT
