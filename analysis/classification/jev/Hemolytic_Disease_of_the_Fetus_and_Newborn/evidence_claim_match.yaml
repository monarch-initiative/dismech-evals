          is subclass-selective — IgG1 is carried most efficiently — and rises steeply through the second
          and third trimesters, which sets the gestational window of disease. This node is the disease''s
          single most druggable step: it is the only point at which the maternal and fetal compartments
          are coupled, and a competitive FcRn blocker both interrupts the transfer and accelerates catabolism
          of maternal IgG.

          '
