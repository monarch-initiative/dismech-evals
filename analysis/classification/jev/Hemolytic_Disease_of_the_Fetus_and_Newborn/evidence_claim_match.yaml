  2008ecb19c58b1433cf7294cc9617546b80ca14758e8c12d0b629bf1ad829005:
    claim:
      about:
        disease:
          name: Hemolytic Disease of the Fetus and Newborn
          disease_term:
            preferred_term: hemolytic disease of the fetus and newborn
            term:
              id: MONDO:0006760
              label: fetal erythroblastosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Fetomaternal Hemorrhage and Exposure to Paternally Inherited Red Cell Antigens
        role: trigger
        biological_scale: TISSUE
        description: 'Fetal erythrocytes carrying a paternally inherited antigen the pregnant person lacks
          cross into the maternal circulation. This happens physiologically at delivery and is amplified
          by sensitising events — abdominal trauma, antepartum bleeding, amniocentesis, miscarriage, termination,
          external cephalic version. Because most sensitising exposure occurs at or near the end of a
          pregnancy, the index pregnancy is usually spared and the disease manifests in a subsequent antigen-positive
          pregnancy. This latency is the reason a prophylaxis programme timed to delivery and to sensitising
          events can work at all.

          '
        genes:
        - preferred_term: RHD
          term:
            id: hgnc:10009
            label: RHD
        - preferred_term: RHCE
          term:
            id: hgnc:10008
            label: RHCE
        - preferred_term: KEL
          term:
            id: hgnc:6308
            label: KEL
        cell_types:
        - preferred_term: fetal erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: Potentially sensitizing events like trauma to the pregnant abdomen, vaginal bleeding,
          and amniocentesis may lead to fetomaternal hemorrhage and necessitate additional doses.
        supports: SUPPORT
    origin:
