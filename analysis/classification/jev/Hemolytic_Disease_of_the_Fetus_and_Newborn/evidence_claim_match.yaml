          disease_term:
            preferred_term: hemolytic disease of the fetus and newborn
            term:
              id: MONDO:0006760
              label: fetal erythroblastosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hdfn_rhig_mechanism_unresolved
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does anti-D immunoglobulin prevent alloimmunisation in humans by epitope masking, immune
          deviation, or antigen modulation — and can the murine models in which these mechanisms are dissected
          be trusted to represent the human process?
        rationale: 'This is not a peripheral question. Anti-D prophylaxis is the single most effective
          intervention in the disease and has been in routine use since the late 1960s, yet its mechanism
          of action is still contested, and the experiments that discriminate between the candidate mechanisms
          are done in mice engineered to carry human erythrocyte antigens. The translational risk is concrete
          rather than theoretical: rational design of a recombinant monoclonal replacement for plasma-derived
          anti-D — which is what would close the availability gap in low- and middle-income countries
          — depends on knowing which mechanism to optimise for. That blends of monoclonals against non-overlapping
          epitopes approach polyclonal efficacy is itself a model-derived finding awaiting human confirmation.'
        attaches_to:
        - pathophysiology#Maternal Alloimmunization and IgG Alloantibody Production
        proposed_experiments:
        - experiment_id: exp_hdfn_rhig_mechanism_human_challenge
          name: Human comparison of recombinant anti-D monoclonal blends against polyclonal RhIG
          description: 'Test whether recombinant anti-D monoclonal blends against non-overlapping D epitopes
            suppress primary alloimmunisation in D-negative human volunteers as effectively as plasma-derived
            polyclonal anti-D, with mechanistic readouts (D-antigen site occupancy, antigen modulation
            on the transfused cells, Th1/Th2 deviation) sampled in parallel.

            '
      selected_evidence:
        snippet: A better understanding of the underlying mechanisms leading to hemolytic disease of the
          fetus and newborn is required to develop the most effective prevention strategies for future
          patients.
        supports: SUPPORT
