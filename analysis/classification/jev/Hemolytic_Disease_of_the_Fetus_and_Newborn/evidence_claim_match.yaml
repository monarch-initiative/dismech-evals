            label: RHD
        notes: 'RHD encodes the RhD antigen. Two genotypes matter: the fetus''s, which decides whether
          it carries the antigen, and the pregnant person''s, which decides whether that antigen is foreign.
          Typed SUSCEPTIBILITY for the reason set out under "Blood-group loci in `genetic:`" in this entry''s
          top-level notes - the fetal genotype is inherited and does sit in the affected individual, but
          it is a common blood-group polymorphism that confers risk only in combination with a discordant
          maternal genotype and maternal alloimmunisation, which is not what CAUSATIVE asserts. Fetal
          RHD status is determinable from cell-free fetal DNA in maternal plasma.'
