        hypothesis_label: Alloantibody-mediated extravascular destruction of mature fetal erythrocytes
        status: CANONICAL
        description: 'The default model, and the one that fits Rh(D) disease: transferred maternal IgG
          opsonises antigen-positive circulating fetal red cells, which are then removed by Fc-gamma-receptor-bearing
          splenic macrophages. Anemia is a destruction problem, so the fetus mounts a brisk compensatory
          erythroid response — reticulocytosis, circulating erythroblasts, hepatosplenomegaly — and the
          bilirubin load is correspondingly high.

          '
      selected_evidence:
        snippet: fetal and neonatal red blood cells (RBC) are hemolyzed by maternal alloantibodies directed
          against RBC antigens potentially leading to severe disease
        supports: SUPPORT
