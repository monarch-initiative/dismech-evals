          RhIG is available and affordable, and anti-D nevertheless remains the commonest cause of severe
          HDFN globally. Where intrauterine transfusion is available the surviving cohort does well neurologically,
          with under 5% neurodevelopmental impairment.

          '
      selected_evidence:
        snippet: Hemolytic disease of fetus and newborn (HDFN) is a life-threatening disease mediated
          by maternal alloimmunization to red blood cell (RBC) antigens.
        supports: SUPPORT
