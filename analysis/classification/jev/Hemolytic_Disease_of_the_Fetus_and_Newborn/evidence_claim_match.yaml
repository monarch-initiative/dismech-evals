        context: []
      assertion_type: Treatment
      assertion:
        name: Nipocalimab
        description: 'An FcRn-blocking monoclonal antibody given weekly to the pregnant person from the
          early second trimester. It is the first therapy in HDFN directed at the transmission step itself:
          by competing with IgG for FcRn it both blocks transplacental transfer and shortens maternal
          IgG half-life, lowering alloantibody in both compartments. In the open-label phase 2 UNITY study
          7 of 13 high-risk pregnancies reached live birth at 32 weeks or later with no intrauterine transfusion,
          against a historical benchmark of 0%, and no hydrops occurred. The randomised phase 3 AZALEA
          trial is the confirmatory study; until it reports, the efficacy claim rests on a small single-arm
          comparison against a historical control.

          '
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: nipocalimab
            term:
              id: NCIT:C170891
              label: Nipocalimab
      selected_evidence:
        snippet: Live birth at 32 weeks' gestation or later without intrauterine transfusions occurred
          in 7 of 13 pregnancies (54%; 95% confidence interval, 25 to 81) in the study.
        supports: SUPPORT
    origin:
