      assertion:
        name: Bilirubin Neurotoxicity and Kernicterus
        biological_scale: TISSUE
        description: 'Unconjugated bilirubin not bound to albumin crosses the blood-brain barrier and
          stains discrete brain regions — the basal ganglia, brain stem and cerebellum — producing acute
          bilirubin encephalopathy and, if not interrupted, permanent sequelae spanning neuromotor, muscle-tone,
          auditory and visuomotor domains. A curation-relevant caveat is that total serum bilirubin, the
          number treatment thresholds are written against, is an imperfect proxy for the neurotoxic exposure,
          and a subthreshold spectrum of bilirubin-induced neurologic dysfunction is recognised in the
          absence of classical kernicterus.

          '
      selected_evidence:
        snippet: The term kernicterus, or bilirubin encephalopathy, is used to describe pathological bilirubin
          staining of the basal ganglia, brain stem, and cerebellum, and is associated with hyperbilirubinemia.
        supports: SUPPORT
