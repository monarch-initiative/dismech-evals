        conforms_to: hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction
        description: 'IgG-coated antigen-positive fetal erythrocytes are recognised by Fc-gamma receptors
          on macrophages of the fetal spleen and removed by extravascular phagocytosis. This is predominantly
          extravascular and complement-independent for IgG alloantibodies of the Rh system, which is why
          hemoglobinuria is not a feature and why the spleen enlarges. The rate of destruction, not the
          antibody titre alone, is what the fetus must compensate for.

          '
        cell_types:
        - preferred_term: splenic red pulp macrophage
          term:
            id: CL:0000874
            label: splenic red pulp macrophage
        - preferred_term: fetal erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: Fc-gamma receptor signaling pathway involved in phagocytosis
          term:
            id: GO:0038096
            label: Fc-gamma receptor signaling pathway involved in phagocytosis
          modifier: INCREASED
      selected_evidence:
        snippet: Hemolytic Disease of the Fetus and Newborn (HDFN) results from maternal alloantibodies
          attacking fetal red blood cells, leading to fetal anemia and potentially severe complications
          such as hydrops fetalis.
        supports: SUPPORT
