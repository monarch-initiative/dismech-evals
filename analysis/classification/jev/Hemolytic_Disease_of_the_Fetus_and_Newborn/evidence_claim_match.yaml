        biological_scale: CELLULAR
        description: 'A class-switched, IgG-secreting plasma-cell response develops against the foreign
          red-cell antigen. Anti-D is the archetype and remains the most frequent cause of severe disease,
          but anti-K (Kell) and anti-c are also clinically major, and the antibody specificity — not merely
          its titre — determines the mechanism of fetal anemia downstream. Only IgG matters for fetal
          disease, because IgM cannot be transported across the placenta.

          '
        genes:
