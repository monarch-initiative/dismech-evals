        name: Neonatal Unconjugated Hyperbilirubinemia
        biological_scale: ORGANISM
        description: 'Hemoglobin released by ongoing hemolysis is catabolised to unconjugated bilirubin.
          Before birth this is cleared across the placenta by the maternal liver, so the fetus is anemic
          but not jaundiced; delivery severs that route while the maternal alloantibody, with an IgG half-life
          of weeks, continues to circulate in the neonate. The immature neonatal glucuronidation capacity
          is then the only clearance path, and bilirubin rises sharply in the first days of life. Anemia
          recurs later — hyporegenerative late anemia at two to six weeks — which is why postnatal surveillance
          has two distinct phases.

          '
        biological_processes:
        - preferred_term: heme catabolic process
          term:
            id: GO:0042167
            label: heme catabolic process
          modifier: INCREASED
