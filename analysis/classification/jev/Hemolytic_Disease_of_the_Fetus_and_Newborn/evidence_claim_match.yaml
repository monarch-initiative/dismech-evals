        discussion_id: gap_hdfn_cffdna_outcome_evidence
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does targeting antenatal anti-D prophylaxis by cell-free-DNA fetal RHD genotyping improve
          patient-relevant outcomes, or is the evidence base entirely diagnostic-accuracy evidence?
        rationale: 'The accuracy data are excellent and the policy case — avoiding a plasma-derived blood
          product in the substantial minority of D-negative pregnancies where the fetus is D-negative
          — is strong on those grounds alone. But a systematic review found neither direct randomised
          evidence nor sufficient data for a linked-evidence chain to morbidity outcomes. This matters
          because withholding prophylaxis on the basis of a test is an asymmetric decision: a false-negative
          genotype result leads to an unprotected at-risk pregnancy.'
        attaches_to:
        - pathophysiology#Fetomaternal Hemorrhage and Exposure to Paternally Inherited Red Cell Antigens
      selected_evidence:
        snippet: Studies investigating patient-relevant outcomes are still lacking.
        supports: SUPPORT
