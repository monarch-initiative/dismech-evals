          term:
            id: CL:0000623
            label: natural killer cell
      selected_evidence:
        snippet: Analysis of the CHS polypeptide demonstrates that its modular architecture is similar
          to the yeast vacuolar sorting protein, VPS15.
        supports: SUPPORT
