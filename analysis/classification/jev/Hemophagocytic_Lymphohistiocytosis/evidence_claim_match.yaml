        description: The HLH-2004 guidelines diagnose HLH when five of eight criteria are met - the five
          HLH-94 criteria (fever, splenomegaly, bicytopenia, hypertriglyceridemia and/or hypofibrinogenemia,
          and hemophagocytosis) plus three criteria added in HLH-2004 (low/absent NK-cell activity, hyperferritinemia,
          and high soluble interleukin-2-receptor levels) - unless family history or molecular diagnosis
          is already consistent with HLH.
      selected_evidence:
        snippet: Altogether five of these eight criteria must be fulfilled, unless family history or molecular
          diagnosis is consistent with HLH.
