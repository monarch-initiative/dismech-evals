        name: Lysosome-Related Organelle Biogenesis Failure
        description: 'Loss of LYST, which regulates membrane dynamics and intracellular trafficking of
          lysosomes and lysosome-related organelles, leaves those organelles unresolved as giant inclusion
          bodies with cargo mis-sorted into them. The same machinery failure gives defective granule exocytosis
          and defective cytotoxicity, which is how Chediak-Higashi syndrome reaches the cytotoxicity lesion
          the familial HLH genes reach by a different route.

          '
        genes:
