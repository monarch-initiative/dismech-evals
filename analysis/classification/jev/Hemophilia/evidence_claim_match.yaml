              This class belongs at the root rather than on either member, and the reason is the same
              lumping logic that justifies this entry. Emicizumab is correctly curated on `Hemophilia_A.yaml`
              because it is a bispecific FVIIIa *mimetic* — it substitutes for the missing cofactor and
              therefore cannot help a patient missing the protease instead. Rebalancing agents act downstream
              of the intrinsic tenase step entirely, on the anticoagulant side of the hemostatic balance,
              so they are indifferent to which subunit is absent. Their pivotal trials enrolled hemophilia
              A and hemophilia B together, and separately enrolled patients with and without inhibitors,
              which is an experimental design only a genuinely factor-agnostic mechanism permits.

              Because they do not present the deficient factor to the immune system, they also remain
              effective once an inhibitor has made replacement therapy fail — which is what gives this
              entry''s `Refractoriness to Factor Replacement` node a therapy at all. The class is not
              free of risk: rebalancing narrows the margin in the prothrombotic direction, and thromboembolic
              events have been reported in both programmes.

              '
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: fitusiran
                term:
