  220e04d86d0b9358f58e361e2c0fcd6188010a82626bbf106efb2dc536a7523b:
    claim:
      about:
        disease:
          name: Hemophilia
          disease_term:
            preferred_term: hemophilia
            term:
              id: MONDO:0018660
              label: hemophilia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Residual Factor Activity-Graded Hemostatic Reserve
        biological_scale: ORGANISM
        description: 'Hemophilia is graded, not binary. The same activity thresholds are applied to factor
          VIII and to factor IX — under 1% severe, 1-5% moderate, 5-40% mild — and they predict phenotype
          well enough to be the basis of classification and of treatment decisions in both members. This
          is what makes severity a family-level axis rather than a per-gene one, and it is the reason
          non-factor therapies and gene therapy are evaluated against a target activity level rather than
          against restoration of the specific missing protein. Hemophilia B Leyden is the instructive
          exception that proves the rule: the same patient moves up the severity scale with age as promoter
          activity rises.

          '
      selected_evidence:
        snippet: Specific factor assays confirm diagnosis and classify hemophilia according to residual
          factor activity (mild 5-40%, moderate 1-5%, severe <1%).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
