      assertion_type: Subtype
      assertion:
        name: Hemophilia B Leyden
        display_name: Hemophilia B Leyden (Androgen-Responsive F9 Promoter Variant)
        classification: deficient coagulation factor
        description: A cis-regulatory form of hemophilia B in which the lesion lies in the F9 promoter
          rather than the coding sequence, so the defect is one of transcription rather than of protein
          structure. Factor IX activity is severely reduced in childhood and then rises around puberty,
          leaving a phenotype that attenuates with age — the clearest demonstration in this family that
          the severity axis is a property of residual activity and not a fixed property of the genotype.
          Has no dismech entry of its own; represented here as a subtype only.
        subtype_term:
          preferred_term: hemophilia B leyden
          term:
            id: MONDO:0850054
            label: hemophilia B leyden
        genes:
        - preferred_term: F9
          term:
            id: hgnc:3551
            label: F9
      selected_evidence:
        snippet: Hemophilia B Leyden is a unique subtype of hemophilia B, characterized by increasing
          factor IX activity (FIX:C) after puberty and a lower normal range of FIX:C throughout adulthood.
        supports: SUPPORT
