              label: hemophilia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Alloimmune Inhibitor Response to Replacement Factor
        biological_scale: ORGANISM
        description: 'Infused factor concentrate is a foreign protein to a patient whose own gene makes
          little or none of it, and in a substantial minority it provokes neutralizing IgG that inactivates
          the infused factor. This is the shared iatrogenic complication of the family and the principal
          reason replacement therapy fails, but it is also the sharpest point of divergence between the
          two members: inhibitors arise in roughly a third of severe hemophilia A, and in only a small
          percentage of hemophilia B, where they instead carry a characteristic risk of anaphylaxis and
          of nephrotic syndrome during immune tolerance induction. The asymmetry is why this node is curated
          at the root as a shared *kind* of complication while its frequency and management remain member-specific.

          '
        biological_processes:
        - preferred_term: neutralizing anti-factor IgG alloantibody response
          term:
            id: GO:0002455
            label: humoral immune response mediated by circulating immunoglobulin
          modifier: INCREASED
      selected_evidence:
        snippet: the most important complication in the treatment of hemophilia A is the development of
          neutralizing antibodies (inhibitors) against exogenous administered factor VIII (FVIII), which
          occurs in approximately 30% of all patients with severe hemophilia A
        supports: SUPPORT
