        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - failure to stabilize hemostasis in the synovial vasculature under joint loading
      selected_evidence:
        snippet: Spontaneous bleeding shows a predilection for joints, and repeated hemarthroses lead
          to a disabling condition called hemophilic arthropathy.
        supports: SUPPORT
