                  label: Fitusiran
              - preferred_term: concizumab
                term:
                  id: NCIT:C166914
                  label: Concizumab
              - preferred_term: marstacimab
                term:
                  id: NCIT:C166436
                  label: Marstacimab
            therapeutic_modality: SIRNA
            notes: '`therapeutic_modality` is single-valued and is set to SIRNA for the fitusiran arm;
              concizumab and marstacimab are MONOCLONAL_ANTIBODY. They are curated as one treatment because
              the mechanistic claim this root makes is about the shared rebalancing strategy rather than
              about either molecule, and splitting them would duplicate the family-level rationale twice.
              Split into two treatments if a curator later needs modality-precise querying. No `oligonucleotide_details`
              block is present because fitusiran is an siRNA, not an antisense oligonucleotide.'
          role: ancestor
