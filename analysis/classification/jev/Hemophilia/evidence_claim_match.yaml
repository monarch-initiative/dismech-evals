        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intrinsic Tenase Complex Failure
        biological_scale: MOLECULAR
        description: 'Without a functional factor VIIIa-factor IXa complex, factor X activation on the
          activated platelet surface proceeds at a small fraction of its normal rate. The node is reached
          symmetrically: hemophilia A removes the cofactor that accelerates the reaction, hemophilia B
          removes the protease that performs it. Because the initiation phase of coagulation is driven
          by tissue factor and is intact, the defect is specifically one of amplification rather than
          of starting a clot at all.

          '
        biological_processes:
        - preferred_term: assembly of the factor VIIIa-factor IXa intrinsic tenase complex
          term:
            id: GO:0007597
            label: blood coagulation, intrinsic pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Factor IX serves as a critical component of the intrinsic coagulation pathway, and its
          deficiency disrupts normal fibrin clot formation, predisposing affected individuals to prolonged
          or spontaneous bleeding.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
