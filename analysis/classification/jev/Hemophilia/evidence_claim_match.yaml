  b06a2111d9ec148f92f38e042b3a1d9e932c4eeba89450fe2ebb07c3fee41d81:
    claim:
      about:
        disease:
          name: Hemophilia
          disease_term:
            preferred_term: hemophilia
            term:
              id: MONDO:0018660
              label: hemophilia
        context: []
      assertion_type: Treatment
      assertion:
        name: Hemostatic Rebalancing Prophylaxis
        description: 'Subcutaneous prophylaxis that restores thrombin generation by lowering a natural
          anticoagulant rather than by supplying the missing factor: fitusiran, a small interfering RNA
          that knocks down antithrombin, and concizumab and marstacimab, monoclonal antibodies against
          tissue factor pathway inhibitor.

          This class belongs at the root rather than on either member, and the reason is the same lumping
          logic that justifies this entry. Emicizumab is correctly curated on `Hemophilia_A.yaml` because
          it is a bispecific FVIIIa *mimetic* — it substitutes for the missing cofactor and therefore
          cannot help a patient missing the protease instead. Rebalancing agents act downstream of the
          intrinsic tenase step entirely, on the anticoagulant side of the hemostatic balance, so they
          are indifferent to which subunit is absent. Their pivotal trials enrolled hemophilia A and hemophilia
          B together, and separately enrolled patients with and without inhibitors, which is an experimental
          design only a genuinely factor-agnostic mechanism permits.

          Because they do not present the deficient factor to the immune system, they also remain effective
          once an inhibitor has made replacement therapy fail — which is what gives this entry''s `Refractoriness
          to Factor Replacement` node a therapy at all. The class is not free of risk: rebalancing narrows
          the margin in the prothrombotic direction, and thromboembolic events have been reported in both
          programmes.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: fitusiran
            term:
              id: NCIT:C169984
              label: Fitusiran
          - preferred_term: concizumab
            term:
              id: NCIT:C166914
              label: Concizumab
          - preferred_term: marstacimab
            term:
              id: NCIT:C166436
              label: Marstacimab
        therapeutic_modality: SIRNA
        notes: '`therapeutic_modality` is single-valued and is set to SIRNA for the fitusiran arm; concizumab
          and marstacimab are MONOCLONAL_ANTIBODY. They are curated as one treatment because the mechanistic
          claim this root makes is about the shared rebalancing strategy rather than about either molecule,
          and splitting them would duplicate the family-level rationale twice. Split into two treatments
          if a curator later needs modality-precise querying. No `oligonucleotide_details` block is present
          because fitusiran is an siRNA, not an antisense oligonucleotide.'
      selected_evidence:
        snippet: Fitusiran, a subcutaneous investigational small interfering RNA therapeutic, targets
          antithrombin to rebalance haemostasis in people with haemophilia A or haemophilia B, irrespective
          of inhibitor status.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
