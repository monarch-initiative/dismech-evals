        description: Because no exogenous factor VIII or factor IX is administered, a neutralizing inhibitor
          has nothing to neutralize, so hemostatic benefit survives the state that abolishes the benefit
          of replacement therapy.
      selected_evidence:
        snippet: Subcutaneous fitusiran prophylaxis resulted in statistically significant reductions in
          annualised bleeding rate in participants with haemophilia A or haemophilia B with inhibitors,
          with two-thirds of participants having zero bleeds.
