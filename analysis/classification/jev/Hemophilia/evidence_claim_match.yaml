          value:
            name: Loss of the Propagation-Phase Thrombin Burst
            biological_scale: MOLECULAR
            description: 'Reduced factor Xa output starves the prothrombinase complex and abolishes the
              large, rapid second wave of thrombin generation that normally follows initiation. The consequence
              is a clot that forms but does not hold: too little thrombin to build a dense, mechanically
              stiff and lysis-resistant fibrin network, hence bleeding that is characteristically delayed
              or recurrent rather than immediate. That this step is shared, rather than inferred from
              one member, is shown by whole blood studies in which hemophilia A and hemophilia B behave
              alike.

              '
            biological_processes:
            - preferred_term: propagation-phase thrombin generation by the prothrombinase complex
              term:
                id: GO:0072377
                label: blood coagulation, common pathway
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
