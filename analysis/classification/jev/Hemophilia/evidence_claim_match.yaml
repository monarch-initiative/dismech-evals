        description: 'A pathogenic variant in F8 or in F9 reduces or abolishes functional factor VIII
          or factor IX. The two proteins are not redundant partners in separate pathways: they are the
          cofactor and the protease of one complex, so a lesion in either gene removes one subunit of
          the same enzyme. This is the point at which hemophilia A and hemophilia B are distinct diseases,
          and it is the last point at which they are distinct — everything downstream of this node is
          shared.

          '
