  eb7b7e4347c081852a0f654c933244d21197d70ca54445fe30318d98103fdbca:
    claim:
      about:
        disease:
          name: Hemophilia A
          disease_term:
            preferred_term: hemophilia A
            term:
              id: MONDO:0010602
              label: hemophilia A
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_f8_deficiency_intrinsic_coagulation_model
        hypothesis_label: Canonical F8 Deficiency / Intrinsic Coagulation Failure Model
        status: CANONICAL
        description: Hemophilia A is caused by loss-of-function variants in F8 on Xq28 encoding coagulation
          factor VIII (FVIII). FVIII normally acts as the cofactor for activated factor IXa (FIXa) in
          the intrinsic tenase complex on activated platelet membranes, accelerating activation of factor
          X by several orders of magnitude. Absence or dysfunction of FVIII therefore disables propagation
          of the intrinsic coagulation cascade, abolishes the thrombin-burst phase of hemostasis, and
          produces the spontaneous joint, soft-tissue, and intracranial bleeding that defines the disease.
          Replacement therapy with recombinant or plasma-derived FVIII, non-factor mimetics (emicizumab),
          and AAV-mediated F8 gene therapy (valoctocogene roxaparvovec) all corroborate the F8-deficiency-as-rate-limiting-lesion
          model by restoring hemostasis.
        notes: 'Retained as CANONICAL. The 2026 openscientist hypothesis-search report (kb/hypotheses/Hemophilia_A/canonical_f8_deficiency_intrinsic_coagulation_model)
          confirms F8 loss-of-function → abolished FVIII cofactor activity in the intrinsic tenase complex
          as the core mechanism, supported by HAVEN randomized trials (emicizumab; 87–97% bleed reduction),
          AAV-FVIII gene therapy (valoctocogene roxaparvovec), and CRISPR/base-editing correction of F8
          mutations. Four refinements: (1) bleeding severity does not map perfectly onto FVIII level —
          >10% of severe hemophilia A patients (FVIII <1 IU/dL) are paradoxically mild bleeders due to
          co-inherited prothrombotic modifiers (FV Leiden, protein C deficiency, etc.); (2) joint bleeding
          involves a dual lesion — insufficient fibrin formation AND premature fibrinolysis from defective
          TAFI activation — not coagulation deficit alone; (3) "rebalancing" therapies (fitusiran/anti-AT,
          concizumab/anti-TFPI) restore hemostasis without replacing FVIII, demonstrating that coagulation
          imbalance — not FVIII absence per se — is the proximal cause of bleeding; (4) hemophilic arthropathy
          and 4.56-fold increased fracture risk reflect iron-mediated oxidative damage and disturbed bone
          metabolism that extend beyond the coagulation-centric framework. These refine rather than refute
          the canonical model.'
      selected_evidence:
        snippet: In comparison with healthy men, PWH demonstrated increased fracture risk (RR 4.56, 95%
          CI 1.28-16.25, p = 0.019, I2 90.74%).
        supports: SUPPORT
