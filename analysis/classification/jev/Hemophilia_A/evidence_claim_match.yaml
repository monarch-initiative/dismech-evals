      assertion_type: Biochemical
      assertion:
        name: Factor VIII Activity
        presence: Decreased
        context: Severe less than 1%, moderate 1-5%, mild 5-40%
        notes: These severity bands are not assay-independent. In non-severe disease the one-stage clotting
          assay and the two-stage chromogenic assay frequently disagree, and which one is used can move
          a patient between the mild and moderate categories. Neither assay has been shown to predict
          clinical bleeding better than the other, so the discrepancy is a classification problem rather
          than a resolved measurement question, and reporting both is the safer practice in mild and moderate
          hemophilia A.
      selected_evidence:
        snippet: Up to 40% of patients with mild haemophilia A have a discrepancy whereby factor VIII
          (FVIII) measurements by a two-stage chromogenic assay (FVIII:C(CH)) are disproportionately reduced
          compared with the FVIII one-stage clotting value (FVIII:C).
        supports: SUPPORT
