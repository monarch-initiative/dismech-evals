      reference_title: Thrombin generation in haemophilia A patients with mutations causing factor VIII
        assay discrepancy.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes how common the one-stage versus chromogenic disagreement is in mild hemophilia
