  d506568bfd233f6f9faa274b05a7000162ee247f9092c74f59f144443d1d42b2:
    claim:
      about:
        disease:
          name: Hemophilia A
          disease_term:
            preferred_term: hemophilia A
            term:
              id: MONDO:0010602
              label: hemophilia A
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hemophilia_a_severity_discordance_predictors
        prompt: What determines why more than one in ten people with severe hemophilia A bleed mildly
          despite factor VIII below 1 IU/dL, and can that be predicted before the bleeding phenotype declares
          itself?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#canonical_f8_deficiency_intrinsic_coagulation_model
        - pathophysiology#Impaired Thrombin Generation
        rationale: 'The canonical model treats factor VIII activity as the rate-limiting quantity, yet
          a substantial minority of patients at the bottom of the range do not bleed as the model predicts.
          Individual candidate explanations exist and each has some support: co-inherited prothrombotic
          variants such as the PROC allele curated on the hypothesis above, factor V Leiden, the state
          of the TAFI pathway, and global thrombin generation parameters. None has been combined into
          a validated predictor, and no prospective cohort has tested whether such a score changes prophylaxis
          intensity safely. This matters clinically because the alternative is treating every severe patient
          at the intensity the worst bleeders need.'
        proposed_experiments:
        - experiment_id: exp_hemophilia_a_bleeding_modifier_gwas
          name: Genome-wide modifier study of bleeding phenotype in severe hemophilia A
          description: Recruit severe hemophilia A patients with factor VIII below 1 IU/dL from international
            registries, phenotype them by treatment-adjusted annualized bleeding rate, and test genome-wide
            association against the extremes of the bleeding distribution, with thrombophilia panel status
            and thrombin generation parameters carried as covariates.
          would_support:
          - mechanistic_hypotheses#canonical_f8_deficiency_intrinsic_coagulation_model
          supporting_outcome:
          - Reproducible modifier loci in anticoagulant or fibrinolytic pathway genes would confirm that
            residual hemostatic balance, rather than factor VIII level alone, sets clinical severity.
          refuting_outcome:
          - Absence of any replicable modifier signal at adequate power would leave unmeasured factor
            VIII activity, treatment adherence, or joint status as the more likely explanations for the
            discordance.
      selected_evidence:
        snippet: Quantitation of FVIII levels <1 IU/dl is a challenge due to the detection limits of traditional
          one-stage activated partial thromboplastin time, two-stage chromogenic assay, and tissue factor-initiated
          thrombin generation assay (TF-TGA), impeding a precise characterization of the bleeding phenotype
          in severe hemophilia patients.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41846404
      reference_title: FIXa-triggered thrombin generation correlates with FVIII levels less than 1% in
        reconstituted plasma mimicking samples obtained from patients with severe hemophilia A.
      evidence_source: OTHER
      explanation: 'States the measurement obstacle that keeps the gap open: the routine assays cannot
        resolve factor VIII below 1 IU/dL, so the very range in which the discordance sits is the range
        that is hardest to quantify.'
