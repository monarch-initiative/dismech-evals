      reference: PMID:16684006
      reference_title: Pathogenesis of haemophilic arthropathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Supplies the mechanism by which repeated joint bleeding destroys the joint, which
        the entry otherwise records only as an outcome. Two processes run in parallel from the same intra-articular
        blood: iron-catalyzed oxidative injury killing chondrocytes, and hemosiderin-driven synovial inflammation.
        This is why the joint damage is not simply a consequence of the number of bleeds and does not
        resolve when bleeding is controlled late.'
