      evidence_source: HUMAN_CLINICAL
      explanation: 'Worked example of the co-inherited prothrombotic modifier named in refinement (1):
        a patient with severe hemophilia A carrying heterozygous PROC p.Trp414Arg (protein C activity
        53-58%) bled discordantly mildly, and protein C depletion raised endogenous thrombin potential
        in FVIII-deficient plasma. A single case, so the modifier effect is inferred rather than established.'
