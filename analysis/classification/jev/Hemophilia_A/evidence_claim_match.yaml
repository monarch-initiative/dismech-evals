      assertion_type: Pathophysiology
      assertion:
        name: Defective TAFI Activation and Premature Fibrinolysis
        description: 'The thrombin deficit of hemophilia A has a second consequence beyond insufficient
          fibrin formation. Activation of thrombin activatable fibrinolysis inhibitor (TAFI) requires
          thrombin, so TAFIa generation fails and formed clots are dissolved prematurely by plasmin. In
          the joint this arm is decisive: urokinase-driven fibrinolysis goes unopposed, which is why hemarthrosis
          dominates congenital hemophilia A yet is uncommon in acquired hemophilia A, where TAFI activation
          is preserved despite comparably low factor VIII.'
        biological_processes:
        - preferred_term: fibrinolysis
          term:
            id: GO:0042730
            label: fibrinolysis
          modifier: INCREASED
      selected_evidence:
        snippet: Patients with markedly impaired TAFIa generation or TAFIa response (below median) displayed
          3-fold to 4-fold higher bleeding rate and factor consumption than patients whose TAFI-related
          values approached the control ones.
        supports: SUPPORT
