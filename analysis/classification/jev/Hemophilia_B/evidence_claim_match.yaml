              label: hemophilia B
        context: []
      assertion_type: Treatment
      assertion:
        name: Marstacimab
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: Weekly anti-TFPI prophylaxis is FDA-approved for adults and children aged six years
          and older with hemophilia A or B, with or without inhibitors, under the June 2026 label. In
          the BASIS without-inhibitor cohort, 116 treated participants were compared with their preceding
          six-month on-demand or prophylaxis period; pooled HA/HB ABR fell from 39.86 to 3.20 in the on-demand
          group and 7.90 to 5.09 in the prophylaxis group. A separate inhibitor cohort treated 51 participants;
          among 48 previously receiving on-demand bypassing agents, pooled ABR fell from 19.78 to 1.39.
          Only eight participants in that efficacy comparison had HB, so the subgroup estimate remains
          imprecise. These within-participant comparisons were not randomized. Thrombotic risk and breakthrough-bleed
          treatment still need a specialist plan.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: Marstacimab
            term:
              id: NCIT:C166436
              label: Marstacimab
      selected_evidence:
        snippet: hemophilia B (congenital factor IX deficiency) with or without factor IX inhibitors.
        supports: SUPPORT
