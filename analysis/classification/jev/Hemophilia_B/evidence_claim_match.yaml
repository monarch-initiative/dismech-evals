        name: Inhibitor-Directed Hemostatic Management
        therapeutic_modality: OTHER
        description: Clinically significant FIX inhibitors require specialized hemostatic treatment. Recombinant
          activated FVII bypasses FIX-dependent tenase and is an option for acute bleeding, especially
          when allergic reactions make FIX-containing products problematic. Non-factor prophylaxis offers
          additional options; doses and combinations depend on the specific concomitant therapy.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: Eptacog Alfa
            term:
              id: NCIT:C81125
              label: Eptacog Alfa
        notes: OTHER reflects a management strategy spanning recombinant-protein bypass and non-factor
          prophylaxis; Eptacog Alfa identifies the recombinant FVIIa option.
      selected_evidence:
        snippet: patient received recombinant factor VIIa and corticosteroid treatment. Bleeding symptoms
          had completely disappeared and coagulation tests become normal.
        supports: SUPPORT
