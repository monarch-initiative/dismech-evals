      assertion_type: Treatment
      assertion:
        name: Bleeding-Risk Precautions
        therapeutic_modality: BEHAVIORAL
        description: Avoid unnecessary high-trauma activities and coordinate invasive procedures with
          hemostatic cover. Do not circumcise an at-risk newborn until hemophilia is excluded or covered.
          Use caution with aspirin and other platelet-active medicines; intramuscular injections require
          pressure, ice, and treatment planning. Modern factor products have improved infection safety,
          while older recipients may need evaluation for historical transfusion-related infection.
        treatment_term:
          preferred_term: Bleeding-risk prevention and education
        notes: An informational prevention activity. The specific NCIT Patient Education term is outside
          the current TreatmentActionTerm enum; no inaccurate therapeutic-procedure binding is substituted.
      selected_evidence:
        snippet: Circumcision of at-risk males until hemophilia B is either excluded or treated with factor
          IX concentrate regardless of severity; activities with a high risk of trauma, particularly head
          injury.
        supports: SUPPORT
