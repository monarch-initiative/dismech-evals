      assertion:
        discussion_id: skeletal-pathway
        kind: KNOWLEDGE_GAP
        prompt: Which downstream coagulation signals connect FIX deficiency to low bone mass?
        attaches_to:
        - pathophysiology#Factor IX Deficiency
        - phenotypes#Reduced Bone Mineral Density
        rationale: Mouse F9 loss produces a skeletal phenotype without spontaneous joint bleeding, but
          the study did not demonstrate direct FIX binding/signaling in osteoblasts. Similar FVIII-null
          findings favor testing shared downstream thrombin/PAR or matrix effects. Human low-BMD studies
          mix HA/HB and cannot separate bleeding, mobility, or comorbidity.
        proposed_experiments:
        - experiment_id: systemic-fix-bone
          description: First establish F9 expression and source contribution before proposing osteoblast-specific
            deletion; compare systemic FIX rescue with controlled thrombin-pathway perturbation.
          name: Distinguish systemic FIX from direct skeletal signaling
        - experiment_id: prospective-bone-clinical
          description: Prospectively measure bone endpoints, activity, joint bleeding, and comorbidity
            in HB cohorts; improved DXA alone would not identify the molecular mediator.
          name: Prospective HB-specific bone outcomes
      selected_evidence:
        snippet: Further studies are needed to explore the underlying mechanism by which a defective coagulation
          cascade and the resulting thrombin deficiency alters normal skeletogenesis.
        supports: SUPPORT
