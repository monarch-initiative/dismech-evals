        association: Pathogenic Variants
        notes: 'F9 coding, splice, copy-number, and proximal promoter variants can cause disease. Activity
          rather than antigen concentration defines severity: some dysfunctional proteins retain cross-reacting
          antigen. Null alleles confer greater inhibitor risk than missense alleles. A single heterozygous
          pathogenic variant can cause disease in females; low factor levels can reflect skewed X inactivation,
          but blood-cell X-inactivation measurements do not directly establish hepatocyte mosaicism. The
          therapeutic FIX-Padua mature-protein R338L (precursor p.Arg384Leu) is a gain-of-function transgene,
          not a hemophilia-causing loss-of-function variant.'
      selected_evidence:
        snippet: F9 | HGNC:3551 | hemophilia B | MONDO:0010604 | XL | Definitive
        supports: SUPPORT
