        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_f9_deficiency_intrinsic_coagulation_model
        hypothesis_label: Canonical F9 Deficiency / Intrinsic Coagulation Failure Model
        status: CANONICAL
        description: Pathogenic F9 variants reduce FIX production or activity. FIX activated by FXIa or
          the tissue-factor/FVIIa complex normally combines with FVIIIa on activated platelet surfaces
          to activate factor X and support propagation of thrombin generation. Functional FIX deficiency
          impairs this amplification and fibrin hemostasis to a degree related to residual activity. Replacement,
          gene addition, and experimental gene correction support the causal role of F9; pharmacologic
          inhibition of anticoagulant pathways can bypass the defect.
        notes: The full OpenScientist report was reviewed against its cited sources, additional primary
          literature, and GeneReviews. Retain CANONICAL, but replace universal abolition of thrombin with
          severity-dependent impairment. Both HOPE-B and BENEGENE-2 use FIX-Padua; their lead-in comparisons
          and distinct follow-up cohorts must not be pooled. A separate ten-person wild-type F9 AAV cohort
          has median 13-year follow-up. The report overlooked direct experimental evidence for collagen-IV-bound
          extravascular FIX and existing definitive ClinGen curation. Leyden regulation and inhibitor
          risk are valid refinements. Modifier associations do not explain a measured 10–15% of HB variance;
          mixed HA/HB platelet and bone observations do not establish a primary platelet lesion or direct
          FIX-to-osteoblast pathway. Mouse synovitis and bone results remain species-qualified. See the
          accompanying openscientist-assessment-by-codex.yaml for claim-level adjudication and unperformed
          analyses.
      selected_evidence:
        snippet: Hemophilia B, also known as Christmas disease, represents the second most common form
          of hemophilia and results from pathogenic variants in the F9 gene that impair the production
          or function of coagulation factor IX.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
