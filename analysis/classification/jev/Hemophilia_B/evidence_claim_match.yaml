          where possible, and discuss prenatal or preimplantation testing. Maternal FIX does not normally
          increase substantially in pregnancy; coordinate delivery and postpartum hemostasis and monitor
          delayed bleeding. Delivery planning should minimize traumatic fetal instrumentation without
          assuming all pregnancies require cesarean delivery.
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: It is recommended that the genetic status of at-risk females be established prior to
          pregnancy or as early in a pregnancy as possible.
