  bec02ef4982683776b01952c98bd90c6ac32aad6d5812242d1713c160989cd21:
    claim:
      about:
        disease:
          name: Hemophilia B
          disease_term:
            preferred_term: hemophilia B
            term:
              id: MONDO:0010604
              label: hemophilia B
        context: []
      assertion_type: Treatment
      assertion:
        name: Etranacogene Dezaparvovec Gene Therapy
        therapeutic_modality: GENE_THERAPY
        description: 'Liver-directed AAV5 gene addition supplies the hyperactive FIX-Padua transgene for
          selected adults. HOPE-B enrolled 54 men with baseline FIX ≤2 IU/dL: five-year mean activity
          was 36.1 IU/dL and ABR fell 63% against each participant''s prophylaxis lead-in. Eligibility,
          liver health, product-specific AAV antibody interpretation, corticosteroid management, and long-term
          follow-up matter. It is not assured permanent cure or an established repeat-dose treatment.'
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
          therapeutic_agent:
          - preferred_term: Etranacogene Dezaparvovec
            term:
              id: NCIT:C171798
              label: Etranacogene Dezaparvovec
      selected_evidence:
        snippet: In the full analysis population (54 participants), the adjusted annualized bleeding rate
          for all bleeding events was 4.16 during the lead-in period and 1.52 during months 7 through
          60 after gene therapy, a reduction of 63% (95% confidence interval, 24 to 82).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/0
      context_paths:
