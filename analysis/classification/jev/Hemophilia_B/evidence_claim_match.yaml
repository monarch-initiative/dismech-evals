      assertion_type: Discussion
      assertion:
        discussion_id: severity-modifiers
        kind: KNOWLEDGE_GAP
        prompt: Which modifiers improve HB-specific prediction beyond FIX activity and treatment history?
        attaches_to:
        - pathophysiology#Deficient thrombin propagation
        rationale: FVII, thrombophilia, platelet, and endothelial reports are heterogeneous and often
          mix HA and HB. They do not quantify how much HB severity variance is explained. The small TGA
          cohort supports prospective validation, not replacement of factor assays. Matched HA/HB comparisons
          need genotype, prophylaxis, age, and joint-damage adjustment.
      selected_evidence:
        snippet: 'Of the polymorphisms studied, the FVII353Q (RR = 3.5, 95% CI: 1.04-12.05, P = 0.044)
          allele was associated with a severe phenotype.'
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19686262
      reference_title: Polymorphism in factor VII gene modifies phenotype of severe haemophilia.
      evidence_source: HUMAN_CLINICAL
      explanation: This is the FVII report behind the rationale's first clause, and it shows why the clause
        is a gap rather than a modifier to curate. The association is a single nominal result (interval
        barely excluding 1) selected from 53 parameters tested in 114 patients whose comparability analysis
        is reported as F8:c activity, so it yields no HB-specific estimate of severity variance explained.
        Its direction is also toward more severe disease, opposite to the milder-than-expected subgroup
        the 10-15% framing invokes.
