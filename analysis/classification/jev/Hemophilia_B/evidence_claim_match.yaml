      assertion_type: Discussion
      assertion:
        discussion_id: durability-and-retreatment
        kind: KNOWLEDGE_GAP
        prompt: What predicts lifetime gene-therapy durability and feasible retreatment across vector
          platforms?
        attaches_to:
        - pathophysiology#Factor IX Deficiency
        rationale: Median 13-year follow-up exists in ten men given a wild-type F9 AAV8 vector; current
          Padua product cohorts have shorter follow-up. One liver biopsy does not resolve all vector-integration,
          clonal, or cancer risks. Persistently high anti-AAV antibodies limit redosing, and children
          have different liver-growth considerations.
      selected_evidence:
        snippet: Levels of neutralizing antibodies to AAV8 remained high throughout follow-up, thus indicating
          potential barriers to readministration of the vector.
        supports: SUPPORT
