        discussion_id: gap_ccbe1_domain_genotype_phenotype
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the domain in which a CCBE1 variant falls predict clinical severity in HKLLS1?
        attaches_to:
        - genetic#CCBE1
        - pathophysiology#CCBE1 loss of function
        rationale: The domain-deletion knock-in series shows a clear functional hierarchy - collagen-repeat
          loss phenocopies the null while EGF-domain loss still permits rudimentary lymphatics - and the
          same ordering held for two Hennekam patient mutations, one per domain. Two alleles is a demonstration,
          not a predictor. With roughly a dozen reported CCBE1 variants across about seventeen probands
          and no systematic functional assay applied across them, it is not established whether domain
          position explains the wide clinical variability, which ranges from recurrent prenatal hydrops
          to a child with imaging-detected lymphangiectasia and no measurable protein loss.
      selected_evidence:
        snippet: Furthermore, a Hennekam syndrome mutation within the collagen domain has a stronger effect
          than a Hennekam syndrome mutation within the EGF domain.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
