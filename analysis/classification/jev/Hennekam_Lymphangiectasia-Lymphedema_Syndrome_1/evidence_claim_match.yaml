          after CCBE1, FAT4 and ADAMTS3 testing, and how many further genes account for it?
        attaches_to:
        - genetic#CCBE1
        - prevalence#Worldwide
        rationale: 'CCBE1 explains only about a quarter of clinically diagnosed Hennekam syndrome. FAT4
          and ADAMTS3 account for further subsets, but a substantial residue has no molecular diagnosis,
          and additional candidate genes have been proposed on single families. This directly limits the
          epidemiology of HKLLS1: published case counts are for the clinical syndrome rather than for
          molecularly confirmed CCBE1 disease, so no prevalence figure specific to HKLLS1 can be derived
          from them.'
      selected_evidence:
        snippet: They account for about one third of all primary lymphedema cases, underscoring the existence
          of additional genetic factors.
        supports: SUPPORT
