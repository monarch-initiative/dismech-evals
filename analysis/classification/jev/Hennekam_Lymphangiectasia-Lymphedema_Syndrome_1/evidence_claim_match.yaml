              generalized lymphatic dysplasia, and is consistent with the recurrent hydrops fetalis seen
              in some HKLLS1 pregnancies.
            limitations: Ccbe1-null mice die prenatally, so the model cannot express the postnatal arms
              of the human disease - chronic limb, genital and facial lymphedema, intestinal lymphangiectasia
              with protein-losing enteropathy, or the craniofacial and cognitive features. Human patients
              carry hypomorphic as well as null alleles and survive, so the null mouse is more severe
              than the usual human phenotype.
