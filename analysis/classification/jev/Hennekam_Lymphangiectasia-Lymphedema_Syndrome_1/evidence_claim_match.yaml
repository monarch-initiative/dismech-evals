        discussion_id: gap_ccbe1_subtype_phenotype_attribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which historical Hennekam findings are established specifically in CCBE1 disease?
        attaches_to:
        - genetic#CCBE1
        rationale: The original 1989 family was later shown to have FAT4 disease. Its narrow mouth, dental
          and ear findings cannot alone establish those phenotypes in HKLLS1, and a general statement
          that ADAMTS3 cases have similar faces does not supply CCBE1-specific observations. The Lee rehabilitation
          patient with pulmonary lymphangiectasia had no genetic testing. These findings are omitted pending
          direct subtype support. Total lymphopenia is a recognized consequence of intestinal lymph loss
          generally, but the reviewed CCBE1 reports document normal total lymphocyte counts or selected
          lymphocyte subsets rather than a confirmed low total count. This remains a possible complication
          rather than an observed subtype phenotype. Seizures were absent in the 13 CCBE1-positive cohort;
          this does not establish absolute exclusion.
      selected_evidence:
        snippet: Seizures did not occur in the group of molecularly confirmed HS patients, but were found
          in 6 of the HS cases without molecular confirmation.
        supports: SUPPORT
        directness: DIRECT
