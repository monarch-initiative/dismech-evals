            term:
              id: MONDO:0009337
              label: Hennekam lymphangiectasia-lymphedema syndrome 1
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Ccbe1-null mouse
        species: Mus musculus
        genotype: Ccbe1 constitutive null (Ccbe1 mutant embryos)
        category: KNOCKOUT
        publication: PMID:21778431
        genes:
        - preferred_term: CCBE1
          term:
            id: hgnc:29426
            label: CCBE1
        description: The first mammalian model of CCBE1 deficiency. Ccbe1 mutant embryos specify PROX1-positive
          lymphatic endothelial cells within the cardinal vein but fail to bud and migrate from it, so
          no definitive lymphatic structures form, and the embryos die prenatally. Recombinant CCBE1 has
          little lymphangiogenic activity alone yet strongly potentiates VEGF-C in a corneal micropocket
          assay, which is what established CCBE1 as necessary but not sufficient for lymphangiogenesis.
        modeled_mechanisms:
        - target: Failed lymphangiogenesis
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Loss of Ccbe1 in the mouse blocks budding and migration of Prox1-positive lymphatic
            endothelial cells from the cardinal vein, which is exactly the cellular step this node names.
          limitations: 'The model speaks to the cellular step, not to the upstream activation node: VEGFR-3
            activation appeared unaltered in the mutants by proximity ligation assay, so this animal does
            not itself demonstrate reduced receptor signalling and is not linked to the proteolytic-activation
            node. Being a constitutive null, it also models complete loss rather than the hypomorphic
            alleles many patients carry.'
          readouts:
          - name: Definitive lymphatic structures in the embryo
            target: Failed lymphangiogenesis
            description: Phenotypic analysis of Ccbe1 mutant embryos for formation of lymphatic vessels,
              scored against Prox1-positive progenitor specification.
            direction: ABOLISHED
            interpretation: Lymphatic progenitors are specified but no lymphatic vasculature forms, placing
              the block at the budding/migration step rather than at lymphatic fate specification.
        - target: Generalized lymphatic dysplasia
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Complete absence of definitive lymphatics models the severe end of the human generalized
            lymphatic dysplasia, and is consistent with the recurrent hydrops fetalis seen in some HKLLS1
            pregnancies.
          limitations: Ccbe1-null mice die prenatally, so the model cannot express the postnatal arms
            of the human disease - chronic limb, genital and facial lymphedema, intestinal lymphangiectasia
            with protein-losing enteropathy, or the craniofacial and cognitive features. Human patients
            carry hypomorphic as well as null alleles and survive, so the null mouse is more severe than
            the usual human phenotype.
          readouts:
          - name: Definitive lymphatic structures at the whole-embryo level
            target: Generalized lymphatic dysplasia
            description: Whole-embryo phenotypic analysis of Ccbe1 mutants for the presence of any definitive
              lymphatic vasculature.
            direction: ABOLISHED
            interpretation: Total absence of lymphatic structures throughout the embryo is the animal
              counterpart of generalized - rather than segmental - lymphatic dysplasia, and models the
              severe end of the human phenotype.
      selected_evidence:
        snippet: Collagen- and calcium-binding EGF domains 1 (CCBE1) has been associated with Hennekam
          syndrome, in which patients have lymphedema, lymphangiectasias, and other cardiovascular anomalies.
        supports: SUPPORT
