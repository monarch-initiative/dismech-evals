  bd3cd33a2632326842a546624981c8e1975be5cc17894e3cac88071055d5000d:
    claim:
      about:
        disease:
          name: Hennekam lymphangiectasia-lymphedema syndrome 1
          disease_term:
            preferred_term: Hennekam lymphangiectasia-lymphedema syndrome 1
            term:
              id: MONDO:0009337
              label: Hennekam lymphangiectasia-lymphedema syndrome 1
        context: []
      assertion_type: AnimalModel
      assertion:
        name: CCBE1 domain-deletion knock-in mice
        species: Mus musculus
        genotype: CCBE1 delta-Collagen and CCBE1 delta-EGF knock-in alleles
        category: KNOCK_IN
        publication: PMID:25814692
        genes:
        - preferred_term: CCBE1
          term:
            id: hgnc:29426
            label: CCBE1
        description: Knock-in mice expressing CCBE1 lacking either the collagen repeats or the EGF domains,
          read out alongside zebrafish rescue and in vitro VEGF-C processing. Collagen-domain deletion
          fully phenocopies the null, whereas EGF-domain deletion still permits rudimentary lymphatics.
          The same asymmetry holds for two Hennekam syndrome patient mutations, one in each domain, which
          is what makes this an allele-specific model of the human disorder rather than a generic knockout.
        modeled_mechanisms:
        - target: CCBE1 loss of function
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Maps loss of CCBE1 function onto specific protein domains, and shows that a Hennekam
            syndrome mutation in the collagen repeats is more damaging than one in an EGF domain - a structural
            account of why HKLLS1 alleles differ in severity.
          limitations: The severity ordering was established for two patient mutations, so it supports
            a domain-level rule rather than a validated genotype-phenotype predictor for individual HKLLS1
            alleles. The knock-ins delete whole domains, which is a more drastic lesion than most patient
            missense variants.
          readouts:
          - name: Lymphatic vessel formation in domain-deletion embryos
            target: CCBE1 loss of function
            description: Comparison of lymphatic development in CCBE1 delta-Collagen versus CCBE1 delta-EGF
              knock-in embryos, each against CCBE1 knockout mice.
            direction: DECREASED
            interpretation: Collagen-domain loss is equivalent to whole-protein loss while EGF-domain
              loss is partial, so the collagen repeats carry most of the VEGF-C-activating function whose
              loss causes HKLLS1.
        - target: Impaired pro-VEGF-C proteolytic activation
          relationship: MEASURES
          fidelity: MODERATE
          description: The same allelic series was read out directly on VEGF-C processing, so it assays
            the proteolytic activation step itself rather than only its downstream consequence. Collagen-domain
            deletion abolishes processing while EGF-domain deletion does not, which assigns the cleavage-supporting
            function of CCBE1 to the collagen repeats.
          limitations: The processing readout is an in vitro assay on deletion constructs, not a measurement
            of endogenous VEGF-C maturation in a patient or in the knock-in animal. It establishes which
            domain carries the activity rather than quantifying how much activation a given patient allele
            retains.
          readouts:
          - name: VEGF-C proteolytic processing in vitro
            target: Impaired pro-VEGF-C proteolytic activation
            description: Ability of each CCBE1 deletion construct to induce cleavage of pro-VEGF-C, compared
              against full-length CCBE1.
            direction: ABOLISHED
            interpretation: Loss of the collagen repeats abolishes VEGF-C processing while loss of the
              EGF domains does not, placing the activating function of CCBE1 at this node in the collagen
              repeats.
      selected_evidence:
        snippet: We analyzed the functionality of several CCBE1 deletion mutants by generating knock-in
          mice expressing these mutants, by analyzing their ability to enhance Vegfc signaling in vivo
          in zebrafish, and by testing their ability to induce VEGFC processing in vitro.
        supports: SUPPORT
