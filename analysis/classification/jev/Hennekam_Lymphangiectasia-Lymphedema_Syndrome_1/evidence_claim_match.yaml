      evidence_source: IN_VITRO
      explanation: 'Qualifies what "loss of function" means at this node for one recurrent patient allele:
        C174Y is not loss-of-function by failure to make the protein, since transfected cells show increased
        expression and secretion. That is an in vitro result and does not describe patient tissue, where
        the same paper finds CCBE1 scarce in affected intestinal lymphatics. The paper offers two unresolved
        explanations, quoted in the items below, so the node should be read as loss of CCBE1 activity
        without a settled account of whether the protein is absent, misfolded, or degraded in vivo.'
