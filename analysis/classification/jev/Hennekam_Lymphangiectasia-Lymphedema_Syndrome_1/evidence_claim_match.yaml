            consanguineous parents and previously in a Dutch kindred. It is one of a cluster of alleles
            hitting cysteine residues in the EGF domain, whose disulfide linkages make them likely to
            disrupt the domain''s tertiary structure. Functionally it is notable for a split result: in
            transfected cells the mutant protein shows increased intracellular expression and increased
            secretion, yet CCBE1 is scarce in the patients'' own intestinal tissue by immunohistochemistry.
            The authors leave the reconciliation open between a secreted-but-misfolded protein and one
            that is rapidly degraded in vivo, so this allele is not loss-of-expression at the synthesis
            level without being a protein that is present where it is needed.'
        - name: p.Cys98Trp (p.C98W)
          description: Homozygous missense CCBE1 allele identified in a consanguineous family. Notable
            because the child had lymphatic dysplasia with protein-losing enteropathy but no intellectual
            disability and no dysmorphism, marking the mild end of the HKLLS1 spectrum.
        - name: p.Asp104Asn (c.310G>A)
          description: Paternally inherited missense CCBE1 allele in two affected brothers with primary
            lymphedema, in trans with p.Leu27Pro. It sits adjacent to other known pathogenic CCBE1 mutations,
            and zebrafish assay showed loss of function.
        - name: p.Leu27Pro (c.80T>C)
          description: Maternally inherited missense CCBE1 allele in the CCBE1 signal peptide, in trans
            with p.Asp104Asn. The signal peptide had not previously been implicated in disease, so this
            allele extends the mutable region of the protein beyond the collagen and EGF domains.
        - name: p.Thr112Ile (c.335C>T)
          description: Paternally inherited likely-pathogenic missense CCBE1 variant, in trans with the
            frameshift allele (compound heterozygosity).
