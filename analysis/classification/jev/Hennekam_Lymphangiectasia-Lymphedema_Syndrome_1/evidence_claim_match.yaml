      assertion:
        name: Stool alpha-1-antitrypsin measurement
        diagnosis_term:
          preferred_term: alpha-1 antitrypsin measurement
          term:
            id: NCIT:C80167
            label: Alpha-1 Antitrypsin Measurement
        description: Faecal alpha-1-antitrypsin is the standard confirmation of enteric protein loss,
          since the protein is not actively secreted or absorbed by the gut and resists intestinal degradation.
          It is the test that establishes protein-losing enteropathy independently of where the lesion
          sits.
        results: Raised stool alpha-1-antitrypsin with low serum albumin confirms protein-losing enteropathy.
        notes: Endoscopic biopsy is not a reliable substitute here. In a molecularly confirmed HKLLS1
          patient with raised stool alpha-1-antitrypsin, endoscopic biopsies were reported as normal,
          because the lymphangiectasia can be segmental and patchy and so missed by sampling.
      selected_evidence:
        snippet: During the disease course, laboratory tests showed decreased blood albumin and increased
          stool α1-antitrypsin, while endoscopy biopsies were normal.
        supports: SUPPORT
