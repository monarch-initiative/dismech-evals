          died in childhood or early adulthood from respiratory problems. These observations establish
          severe respiratory morbidity without a population mortality estimate or a specific pulmonary
          mechanism. Surviving patients may require recurrent paracentesis, nutritional therapy and immunoglobulin
          replacement, with missed school and work. Severity and treatment requirements vary; peripheral
          edema and protein loss can improve with dietary management.
