            term:
              id: MONDO:0009337
              label: Hennekam lymphangiectasia-lymphedema syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired pro-VEGF-C proteolytic activation
        biological_scale: MOLECULAR
        description: 'CCBE1 and the protease ADAMTS3 form a complex that cleaves the poorly active 29/31-kDa
          form of pro-VEGF-C into the mature 21/23-kDa ligand. Loss of CCBE1 removes the cofactor, so
          this proteolytic maturation step fails and little active VEGF-C is produced. CCBE1''s two domains
          contribute differently: the C-terminal collagen-like domain drives the cleavage activity, while
          the N-terminal EGF-like domain colocalizes pro-VEGF-C with its protease at the lymphatic endothelial
          cell surface.'
        notes: This node is about the proteolytic maturation of pro-VEGF-C, not about how much VEGF-C
          is present. Serum VEGF-C was no different from healthy controls in two genotype-confirmed CCBE1
          patients (PMID:26686525), so a normal total VEGF-C level does not argue against this node and
          should not be read as evidence for or against it.
        molecular_functions:
        - preferred_term: metalloendopeptidase activity of the ADAMTS3-CCBE1 complex
          modifier: DECREASED
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
      selected_evidence:
        snippet: an ADAMTS3-CCBE1 complex can form independently of VEGFR3 and is required to convert
          VEGFC, but not VEGFD, into an active ligand
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27159393
      reference_title: Proteolytic activation defines distinct lymphangiogenic mechanisms for VEGFC and
        VEGFD.
      evidence_source: IN_VITRO
      explanation: Establishes that CCBE1 and ADAMTS3 act as a complex and that the complex is required
        for VEGF-C activation specifically, which is why loss of CCBE1 is not compensated by VEGF-D.
    first_seen_at: '2026-10-03T21:41:37.452820+00:00'
