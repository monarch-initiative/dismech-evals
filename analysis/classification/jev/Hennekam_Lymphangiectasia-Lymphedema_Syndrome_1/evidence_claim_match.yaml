        context:
        - path: /pathophysiology/1
          value:
            name: Impaired pro-VEGF-C proteolytic activation
            biological_scale: MOLECULAR
            description: 'CCBE1 and the protease ADAMTS3 form a complex that cleaves the poorly active
              29/31-kDa form of pro-VEGF-C into the mature 21/23-kDa ligand. Loss of CCBE1 removes the
              cofactor, so this proteolytic maturation step fails and little active VEGF-C is produced.
              CCBE1''s two domains contribute differently: the C-terminal collagen-like domain drives
              the cleavage activity, while the N-terminal EGF-like domain colocalizes pro-VEGF-C with
              its protease at the lymphatic endothelial cell surface.'
            notes: This node is about the proteolytic maturation of pro-VEGF-C, not about how much VEGF-C
              is present. Serum VEGF-C was no different from healthy controls in two genotype-confirmed
              CCBE1 patients (PMID:26686525), so a normal total VEGF-C level does not argue against this
              node and should not be read as evidence for or against it.
            molecular_functions:
            - preferred_term: metalloendopeptidase activity of the ADAMTS3-CCBE1 complex
              modifier: DECREASED
              term:
                id: GO:0004222
                label: metalloendopeptidase activity
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failed lymphangiogenesis
        description: Without mature VEGF-C, VEGFR-3 signaling in lymphatic endothelial cells is not driven
          and lymphatic vessels fail to form.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Vegfc- and Vegfr3-dependent Erk signaling is impaired in the absence of Ccbe1.
        supports: SUPPORT
