        description: The second arm of FAT4 loss, independent of the lymphatic arm above. FAT4 and its
          ligand DCHS1 act upstream of the Hippo effector YAP in the embryonic neuroepithelium. Losing
          that restraint expands the neural progenitor pool at the expense of neuronal differentiation.
          The YAP dependence is established by epistasis - concurrent Yap knockdown rescues the phenotype
          - rather than by direct measurement of Hippo pathway flux, which is why the pathway modifier
          here should be read as loss of FAT4-mediated restraint on YAP.
