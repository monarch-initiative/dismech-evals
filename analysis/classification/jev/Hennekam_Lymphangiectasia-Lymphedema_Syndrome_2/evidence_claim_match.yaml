        - preferred_term: neural precursor cell proliferation
          modifier: INCREASED
          term:
            id: GO:0061351
            label: neural precursor cell proliferation
        - preferred_term: neuron differentiation
          modifier: DECREASED
          term:
            id: GO:0030182
            label: neuron differentiation
      selected_evidence:
        snippet: Reducing the expression of Dchs1 or Fat4 within mouse embryonic neuroepithelium increased
          progenitor cell numbers and reduced their differentiation into neurons
        supports: SUPPORT
