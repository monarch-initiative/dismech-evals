          so prevents the rupture through which lymph is lost, while medium-chain triglycerides are absorbed
          directly into the portal circulation and bypass the lacteals altogether. Dietary control generally
          needs to be permanent, because clinical and biochemical abnormalities return when the low-fat
          diet is withdrawn.'
