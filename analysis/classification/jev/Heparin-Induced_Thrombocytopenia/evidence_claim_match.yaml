        context:
        - path: /treatments/3
          value:
            name: Deferral of Vitamin K Antagonist Until Platelet Recovery
            description: 'Withholding warfarin during the acute phase, and overlapping it with a non-heparin
              anticoagulant once the platelet count has recovered, is an intervention in its own right
              rather than an omission. Its target is the iatrogenic node: warfarin depletes protein C
              faster than the procoagulant factors, and in a patient with unrestrained thrombin generation
              that imbalance can produce venous limb gangrene. Deferral removes that precipitant.'
            therapeutic_modality: OTHER
            treatment_term:
              preferred_term: anticoagulation therapy
              term:
                id: NCIT:C63341
                label: Anticoagulation Therapy
              therapeutic_agent:
              - preferred_term: warfarin
                term:
                  id: NCIT:C1658
                  label: Warfarin Sodium
            notes: Modeled as a treatment rather than left as a contraindication note because the deferral
              is an active decision with a specific mechanistic target. The schema has no slot for a contraindication,
              and recording this only as prose would leave the entry's most counterintuitive clinical
              rule unattached to the node that explains it.
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Warfarin-Induced Protein C Depletion and Microvascular Thrombosis
        treatment_effect: INHIBITS
        description: Not giving warfarin while thrombin generation is unrestrained prevents the acquired
          protein C deficiency that causes venous limb gangrene.
      selected_evidence:
        snippet: This syndrome occurs when acquired protein C deficiency during warfarin treatment of
          HIT and deep venous thrombosis leads to the inability to regulate thrombin generation in the
          microvasculature.
        supports: SUPPORT
