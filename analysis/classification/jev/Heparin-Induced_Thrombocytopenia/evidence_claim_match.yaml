  f66207fa83c41e0508c3bd437f0cc735a9d490514fba966bf328422b61472139:
    claim:
      about:
        disease:
          name: Heparin-Induced Thrombocytopenia
          disease_term:
            preferred_term: heparin-induced thrombocytopenia
            term:
              id: MONDO:0018048
              label: heparin-induced thrombocytopenia
        context: []
      assertion_type: Treatment
      assertion:
        name: High-Dose Intravenous Immunoglobulin
        description: 'High-dose IVIG saturates and competitively blocks FcgammaRIIA, interrupting antibody-induced
          platelet activation at the receptor rather than downstream at thrombin. It is reserved for autoimmune
          HIT, and the reason is mechanistic: in aHIT the antibodies activate platelets without heparin,
          so stopping heparin does not de-escalate the process and something must act on the effector
          step itself. Therapeutic plasma exchange is the fallback when IVIG fails.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: intravenous immunoglobulin therapy
          term:
            id: NCIT:C121331
            label: Intravenous Immunoglobulin Therapy
        notes: 'The same source records a caveat that cuts against the standard direct-thrombin-inhibitor
          approach in this subset: aHIT patients are at risk of DTI treatment failure, both through APTT
          confounding by concurrent DIC and because DTIs inhibit thrombin-induced protein C activation.
          That is a genuine mechanistic tension between two curated treatments and is recorded as a discussion
          rather than resolved here.'
      selected_evidence:
        snippet: unlike classic HIT, heparin cessation does not result in de-escalation of antibody-induced
          hemostasis activation
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
