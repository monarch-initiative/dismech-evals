      assertion:
        name: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
        description: Multivalent IgG immune complexes assembled on the platelet surface cross-link FcgammaRIIA
          (CD32a), the only Fc receptor human platelets carry, and trigger full platelet activation. This
          is the central effector step and the point at which an immune event becomes a coagulation event.
          Activation causes alpha-granule release, which liberates yet more PF4 into the local environment
          and feeds the antigen supply - a self-amplifying loop that helps explain why the syndrome escalates
          rather than self-limiting while heparin continues.
        biological_scale: CELLULAR
        role: central_effector
        conforms_to: thrombogenesis#Platelet Adhesion, Activation, and Aggregation
