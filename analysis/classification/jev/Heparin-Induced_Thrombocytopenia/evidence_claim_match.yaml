  ce36b38aa694742463961364c85764d661f14a9deea7fc1f610233cc1f8ee7a1:
    claim:
      about:
        disease:
          name: Heparin-Induced Thrombocytopenia
          disease_term:
            preferred_term: heparin-induced thrombocytopenia
            term:
              id: MONDO:0018048
              label: heparin-induced thrombocytopenia
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Typical onset, thrombotic window, and antibody waning
        notes: 'The platelet fall characteristically begins five to ten days after heparin exposure, earlier
          on re-exposure within about a hundred days because circulating antibody may persist. The thrombotic
          hazard does not end when heparin stops; it continues while pathogenic antibody remains, which
          is why alternative anticoagulation is continued rather than the drug simply withdrawn. Antibodies
          are transient over weeks to months, so a patient with a remote history is not permanently heparin-ineligible.
          The autoimmune variant breaks this timetable in both directions - beginning after withdrawal,
          or persisting for weeks.


          Outcome is poor when the disease is not recognized. In the untreated historical control arm
          of the argatroban study the composite of death, amputation, and new thrombosis reached 38.8%
          in HIT and 56.5% in HIT with thrombosis at 37 days, and the entry''s treatment section is built
          around reducing exactly that composite.'
      selected_evidence:
        snippet: In the HITTS arm, the composite end point occurred in 41.5% of argatroban-treated patients
          vs 56.5% of controls (P =.07).
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/1
