              label: heparin-induced thrombocytopenia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hit_no_validated_genetic_determinant
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Anti-PF4/Heparin IgG Antibody Response
        - pathophysiology#FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
        prompt: Why do only a minority of heparin-exposed patients mount a pathogenic anti-PF4/heparin
          response, and is any of that susceptibility inherited?
        rationale: 'This entry carries no `genetic:` section, and the omission is deliberate rather than
          an oversight. Candidate loci exist and are biologically plausible - FCGR2A, which encodes the
          very receptor the central effector node turns on, plus TDAG8, HLA-DR, and a replicated chromosome
          5 signal from a genome-wide association study - but genetic studies have not consistently identified
          risk alleles for HIT, for antibody production, or for its thromboembolic complications. Curating
          any of these as a risk gene would assert more than the evidence supports; the honest curation
          is that the absence of a validated determinant is itself the finding. The obstacles are structural
          rather than merely a matter of sample size: true HIT is scarce, misclassification is easy because
          the immunoassay is poorly specific, and the environmental exposure varies in type, dose, and
          duration. The consequence is that no pre-exposure test can currently identify who will develop
          HIT, which is the practical liability that accompanies every heparin prescription. Note also
          that the animal model curated in this entry cannot address the question at all: it bypasses
          the immune arm by injecting a monoclonal antibody rather than raising one.'
        proposed_experiments:
        - experiment_id: hit_powered_multiethnic_genetic_study
          name: Adequately powered multiethnic genetic study with laboratory-confirmed HIT
          description: Assemble a multiethnic cohort with functional-assay-confirmed HIT rather than immunoassay-positive
            suspicion, capture heparin type, dose, and duration per patient, and analyse serologic and
            thromboembolic outcomes separately, since the same allele need not govern antibody formation
            and thrombosis.
          readouts:
          - name: Replicated association between a host variant and functionally confirmed HIT
            target: pathophysiology#Anti-PF4/Heparin IgG Antibody Response
            direction: INCREASED
            interpretation: A determinant that survives laboratory confirmation and replication would
              convert an unpredictable adverse drug reaction into a screenable one.
      selected_evidence:
        snippet: Genetic studies have not consistently identified risk alleles for HIT, the production
          of platelet factor 4/heparin antibodies or the thromboembolic complications of HIT.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
