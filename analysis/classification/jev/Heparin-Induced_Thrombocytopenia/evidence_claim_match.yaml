      assertion_type: Pathophysiology
      assertion:
        name: Heparin Exposure and PF4-Heparin Neoepitope Formation
        description: Heparin is a polyanion; platelet factor 4 (PF4, CXCL4) is a small positively charged
          tetramer stored in platelet alpha-granules. When the two meet at the right stoichiometric ratio
          they assemble into ultralarge multimolecular complexes, and the conformational change this imposes
          on PF4 exposes epitopes that the immune system has never seen. The antigen is therefore neither
          the drug nor a self protein but a complex of the two - which is why the disease is an adverse
          drug reaction with the mechanics of autoimmunity.
        biological_scale: MOLECULAR
        role: trigger
        genes:
        - preferred_term: PF4
          term:
            id: hgnc:8861
            label: PF4
      selected_evidence:
        snippet: Heparin-induced thrombocytopenia (HIT) is an adverse drug reaction mediated by platelet-activating
          antibodies that target complexes of platelet factor 4 and heparin.
        supports: SUPPORT
