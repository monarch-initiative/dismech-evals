      assertion_type: Treatment
      assertion:
        name: Argatroban
        description: A direct thrombin inhibitor given intravenously, and the treatment whose evidence
          base in HIT is strongest. It acts at the node that actually causes the harm - thrombin generation
          - rather than at the platelet count. In a prospective multicentre study against historical controls
          it reduced the composite of death, amputation, and new thrombosis, with the benefit concentrated
          in new thrombosis and thrombotic death, and without an excess of bleeding. Hepatically cleared,
          so it is the practical choice in renal impairment.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
