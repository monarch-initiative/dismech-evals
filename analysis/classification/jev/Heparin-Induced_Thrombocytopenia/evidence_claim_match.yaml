          from current practice, and creates a specific ascertainment trap: the patients most likely to
          be missed are those whose disease begins or persists after heparin has been stopped, which is
          exactly the group in whom the diagnosis is least likely to be entertained. The under-recognition
          is therefore not random with respect to severity, and any incidence figure for aHIT drawn from
