          or worsen after heparin has already been stopped (delayed-onset HIT), persist for weeks, or
          arise with no heparin exposure at all (spontaneous HIT syndrome). The laboratory signature is
          characteristic rather than absent - these sera still show the classic inhibition of platelet
          activation at high heparin concentrations, and on serial dilution usually reveal heparin-dependent
          activation, so the antibodies are a variant of the same species rather than a different one.'
