        context: []
      assertion_type: Diagnosis
      assertion:
        name: IgG-specific anti-PF4/heparin immunoassay
        description: 'An enzyme immunoassay for antibodies against PF4-heparin complexes. The assay''s
          central limitation is mechanistic: it detects binding, while the disease requires platelet activation,
          and most binding antibodies are not pathogenic. Restricting detection to IgG - the isotype that
          engages FcgammaRIIA - improves specificity for exactly that reason, which is why IgG-specific
          assays outperform polyspecific ones that also capture IgA and IgM.'
        measurements:
        - preferred_term: PF4/heparin IgG antibody
          term:
            id: LOINC:73819-5
            label: Heparin induced platelet IgG Ab [Presence] in Serum or Plasma by Immunoassay
        notes: No method-less IgG-specific code exists in the Monarch KG (only "by Immunoassay" variants);
          this is the narrowest available code for the IgG-restricted assay this row describes, distinct
          from the broader, polyspecific LOINC:34701-3 "Heparin induced platelet Ab [Presence] in Serum"
          code.
      selected_evidence:
        snippet: IgG-specific assays confer superior diagnostic accuracy compared with polyspecific assays.
          These results further support recommendations in favor of IgG-specific testing.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28374939
      reference_title: 'Diagnostic accuracy of IgG-specific versus polyspecific enzyme-linked immunoassays
        in heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Meta-analytic support for IgG-specific over polyspecific immunoassay, which is the
        mechanistically expected result given that IgG is the isotype that cross-links FcgammaRIIA.
