      assertion_type: Diagnosis
      assertion:
        name: Functional platelet activation assay
        description: A functional test - serotonin release assay or heparin-induced platelet activation
          test - that measures whether the patient's serum actually activates platelets, and does so in
          the heparin-dependent pattern. It is the reference standard precisely because it interrogates
          the pathogenic property rather than mere binding, and it is what distinguishes autoimmune HIT,
          where activation persists without heparin but is still inhibited at high heparin concentrations.
        measurements:
        - preferred_term: Serotonin release assay
          term:
            id: LOINC:50736-8
            label: Serotonin release.heparin.unfractionated panel - Serum
        - preferred_term: Heparin-induced platelet activation (platelet aggregation) test
          term:
            id: LOINC:40723-9
            label: Heparin Ab [Presence] in Platelet poor plasma by Platelet aggregation
        notes: This row names two distinct functional assay modalities; both carry their own measurements
          entries rather than one caveated code. The serotonin release assay code is specific to the unfractionated-heparin
          reagent protocol; LOINC also carries porcine- and low-molecular-weight-heparin panel variants,
          not bound here since the row does not specify a formulation.
      selected_evidence:
        snippet: Autoimmune HIT was confirmed by functional heparin-induced platelet (PLT) activation
          test.
        supports: SUPPORT
