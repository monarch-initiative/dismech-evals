      assertion_type: DifferentialDiagnosis
      assertion:
        name: Non-Immune Heparin-Associated Thrombocytopenia
        description: 'The entity historically called HIT type 1: a mild, early, transient fall in platelet
          count caused by direct heparin-platelet interaction, without antibodies and without thrombotic
          risk. It recovers while heparin continues and requires no change in management. Confusing the
          two leads to the opposite error in each direction - unnecessary anticoagulant switching, or
          a missed prothrombotic emergency.'
        distinguishing_features:
        - No anti-PF4/heparin antibodies and a negative functional assay
        - Early onset, mild fall, and spontaneous recovery despite continued heparin
        - No associated thrombotic risk
      selected_evidence:
        snippet: Heparin-induced thrombocytopenia (HIT) is an adverse drug reaction mediated by platelet-activating
          antibodies that target complexes of platelet factor 4 and heparin.
        supports: SUPPORT
