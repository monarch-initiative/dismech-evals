              id: MONDO:0018048
              label: heparin-induced thrombocytopenia
        context: []
      assertion_type: AnimalModel
      assertion:
        name: FcgammaRIIA/hPF4 double-transgenic mouse challenged with KKO and heparin
        description: 'Mice engineered to express both human platelet FcgammaRIIA and human PF4, then injected
          with KKO - a monoclonal antibody specific for hPF4/heparin complexes - followed by heparin.
          The design is a direct test of the entry''s central causal claim, because the two transgenes
          are precisely the two human components the pathograph asserts are required. Single-transgene
          controls receiving the same challenge do not develop the disease, so the model establishes not
          merely that the pathway is sufficient but that both components are necessary. Wild-type mice
          cannot develop HIT at all: mouse platelets lack FcgammaRIIA, which is itself an argument that
          the human receptor is the effector.'
        species: Mouse
        genotype: Transgenic for human FcgammaRIIA and human PF4
        publication: PMID:11588041
        modeled_mechanisms:
        - target: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Disease requires the human FcgammaRIIA transgene: animals transgenic for hPF4
            alone do not develop it despite receiving the same antibody and heparin challenge. This is
            the in vivo demonstration that the receptor step is causal rather than correlative.'
          limitations: A humanised construct rather than a native disease. Both key components are transgenes
            on a mouse background, expression levels need not match human platelets, and the immune arm
            is bypassed entirely - a monoclonal antibody is injected rather than raised, so the model
            tests the effector limb and says nothing about why only some patients mount a pathogenic antibody
            response. That question is the subject of a curated knowledge gap in this entry.
          readouts:
          - name: Requirement for the FcgammaRIIA transgene to reproduce disease
            target: FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
            direction: ABOLISHED
            interpretation: Absence of disease in single-transgene controls isolates the receptor as a
              necessary component.
        - target: Accelerated Platelet Consumption and Thrombocytopenia
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Double-transgenic animals given KKO and heparin develop a profound platelet fall
            that single-transgene controls do not.
          limitations: The platelet nadir is deeper than typical human HIT, where the fall is usually
            moderate; the model is driven by a bolus of a high-avidity monoclonal antibody rather than
            by a polyclonal response of mixed pathogenicity, which is the very heterogeneity that makes
            the human disease hard to diagnose.
          readouts:
          - name: Nadir platelet count relative to baseline
            target: Accelerated Platelet Consumption and Thrombocytopenia
            direction: DECREASED
            interpretation: The magnitude and control-dependence of the platelet fall are the model's
              primary quantitative readout.
        - target: Venous and Arterial Thrombosis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: At higher heparin doses the animals develop shock and fibrin-rich thrombi in multiple
            organs, reproducing the thrombotic arm of the disease.
          limitations: Recorded as PARTIALLY_RECAPITULATES because the reported thrombosis is disseminated
            and multi-organ, closer to a shock syndrome than to the discrete deep venous, pulmonary, and
            limb-artery events that dominate human HIT, and it required a heparin dose two and a half
            times that used for the thrombocytopenia readout.
          readouts:
          - name: Fibrin-rich thrombi in multiple organs
            target: Venous and Arterial Thrombosis
            direction: INCREASED
            interpretation: Histological thrombus formation is the model's structural correlate of the
              thrombotic node.
      selected_evidence:
        snippet: This is the first mouse model of HIT to recapitulate the salient features of the human
          disease and demonstrates that FcgammaRIIA and hPF4 are both necessary and sufficient to replicate
          HIT/HITT in an animal model.
        supports: SUPPORT
