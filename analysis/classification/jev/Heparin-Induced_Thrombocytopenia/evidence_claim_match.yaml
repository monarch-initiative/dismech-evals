  cbc7e33439b264920bd671514250607ba46985b7ebe4bb808c3c96694a2583b1:
    claim:
      about:
        disease:
          name: Heparin-Induced Thrombocytopenia
          disease_term:
            preferred_term: heparin-induced thrombocytopenia
            term:
              id: MONDO:0018048
              label: heparin-induced thrombocytopenia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hit_dti_failure_in_autoimmune_subset
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Explosive Thrombin Generation
        - pathophysiology#Heparin-Independent Platelet Activation in Autoimmune HIT
        prompt: Are APTT-adjusted direct thrombin inhibitors the right treatment for autoimmune HIT, given
          that the same mechanism makes them both harder to dose and potentially counterproductive in
          that subset?
        rationale: Two curated treatments in this entry pull against each other in the autoimmune subset,
          and the tension is mechanistic rather than merely practical. Direct thrombin inhibitors are
          the standard answer to HIT because thrombin generation is the effector node. But in aHIT two
          problems arise from the same biology. First, aHIT frequently comes with overt DIC, and DIC prolongs
          the APTT; because argatroban and bivalirudin are dosed to APTT, the prolongation causes systematic
          underdosing or interruption of the very drug the patient needs. Second, thrombin activates protein
          C, so inhibiting thrombin also suppresses the endogenous anticoagulant arm - the same protein
          C axis whose depletion causes venous limb gangrene when warfarin is given. The consequence is
          that the strongest evidence base in HIT (argatroban, from a prospective study against historical
          controls) was not generated in the subset where it is most likely to fail, and it is not settled
          what should replace it. IVIG addresses the receptor rather than thrombin, but it can fail too.
      selected_evidence:
        snippet: aHIT patients are at risk for treatment failure with (activated partial thromboplastin
          time [APTT]-adjusted) direct thrombin inhibitor (DTI) therapy (argatroban, bivalirudin), either
