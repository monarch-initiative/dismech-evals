          value:
            name: Cessation of All Heparin Exposure
            description: 'Withdrawal of every source of heparin, including flushes and coated catheters,
              removes the antigen and stops further immune complex formation. It is necessary and it is
              not sufficient: the antibodies already present continue to activate platelets and generate
              thrombin, so a patient managed by withdrawal alone remains at high thrombotic risk. This
              is the single most common management error the mechanism predicts, and the reason substitution
              rather than simple cessation is the standard.'
            therapeutic_modality: OTHER
            treatment_term:
              preferred_term: anticoagulation therapy
              term:
                id: NCIT:C63341
                label: Anticoagulation Therapy
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Heparin Exposure and PF4-Heparin Neoepitope Formation
        treatment_effect: INHIBITS
        description: Removing heparin removes one half of the antigenic complex, preventing further neoepitope
          formation.
      selected_evidence:
        snippet: Heparin-induced thrombocytopenia (HIT) is an intensely prothrombotic syndrome managed
          by discontinuation of heparin therapy and substitution of an alternative inhibitor of thrombin.
        supports: SUPPORT
