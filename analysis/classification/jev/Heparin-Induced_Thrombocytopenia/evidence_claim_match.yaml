        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hit_immunoassay_activation_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Anti-PF4/Heparin IgG Antibody Response
        - pathophysiology#FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
        prompt: What distinguishes an anti-PF4/heparin IgG antibody that activates platelets from one
          that binds the same antigen and does nothing?
        rationale: 'This is the gap that makes HIT hard to diagnose, and it sits precisely between two
          curated nodes. Antibodies against PF4-heparin complexes are common after heparin exposure; disease
          is not. The immunoassay detects binding and is therefore poorly specific, while the functional
          assay detects activation and is the reference standard but is technically demanding and not
          widely available. Restricting the immunoassay to IgG helps, which is consistent with FcgammaRIIA
          being the effector receptor, but it does not close the gap - most IgG-positive patients still
          do not have the disease. What is missing is a molecular account of the pathogenic property itself:
          which epitopes, what avidity or stoichiometry, what degree of complex clustering is required
          to cross-link FcgammaRIIA productively. Without it, no binding assay can be made specific, and
          the field is left with a reference standard that most laboratories cannot run.'
        proposed_experiments:
        - experiment_id: hit_pathogenic_epitope_determinants
          name: Structural and functional dissection of platelet-activating versus non-activating anti-PF4
            antibodies
          description: Isolate paired activating and non-activating monoclonal antibodies from patients
            with and without clinical HIT, map their epitopes on the PF4-polyanion complex, and relate
            epitope location, avidity, and complex stoichiometry to FcgammaRIIA cross-linking efficiency
            in a functional platelet activation readout.
          readouts:
          - name: Platelet activation by epitope-defined monoclonal anti-PF4 antibodies
            target: pathophysiology#FcgammaRIIA-Mediated Platelet Activation by Immune Complexes
            direction: INCREASED
            interpretation: A structural correlate that separates activating from non-activating antibodies
              would allow a binding assay to be engineered for the pathogenic property rather than for
              the antigen.
      selected_evidence:
        snippet: There are conflicting data on whether the IgG-specific or polyspecific antiplatelet factor
          4/heparin (PF4/H) enzyme-linked immunosorbent assay (ELISA) is preferred for the laboratory
          diagnosis of heparin-induced thrombocytopenia (HIT).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28374939
      reference_title: 'Diagnostic accuracy of IgG-specific versus polyspecific enzyme-linked immunoassays
        in heparin-induced thrombocytopenia: a systematic review and meta-analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Documents unresolved disagreement about how best to detect the antibodies, a symptom
        of the underlying gap in knowing which ones matter.
