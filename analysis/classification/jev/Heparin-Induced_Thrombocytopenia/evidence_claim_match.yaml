        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Warfarin-Induced Protein C Depletion and Microvascular Thrombosis
        description: 'Warfarin lowers protein C, a short-half-life vitamin-K-dependent natural anticoagulant,
          faster than it lowers the procoagulant factors it is given to suppress. In an ordinary patient
          this transient imbalance is tolerated. In a patient with active HIT, whose thrombin generation
          is already unrestrained, the loss of protein C removes the last brake on microvascular thrombin
          and can produce venous limb gangrene - progressive necrosis of a limb whose large veins are
          thrombosed but whose arteries remain patent. This is an iatrogenic node: the pathology is created
          by the treatment, and it is the mechanistic reason warfarin is contraindicated until platelet
          recovery and adequate alternative anticoagulation.'
        biological_scale: ORGANISM
        role: outcome
        genes:
        - preferred_term: PROC
          term:
            id: hgnc:9451
            label: PROC
      selected_evidence:
        snippet: including the newly recognized syndrome of warfarin-induced venous limb gangrene
        supports: SUPPORT
