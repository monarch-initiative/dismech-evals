      assertion_type: Diagnosis
      assertion:
        name: 4Ts pretest probability score
        description: 'A four-domain clinical score - degree of thrombocytopenia, timing of the platelet
          fall, thrombosis or other sequelae, and absence of other causes - used before laboratory testing.
          Its value is overwhelmingly in exclusion: a low score essentially rules the disease out, while
          intermediate and high scores are far less informative and demand laboratory confirmation. Guidance
          is to use the score rather than clinical gestalt, and to withhold both testing and empiric treatment
          when the score is low.'
      selected_evidence:
        snippet: The negative predictive value of a low probability 4Ts score was 0.998 (95% CI, 0.970-1.000)
          and remained high irrespective of the party responsible for scoring, the prevalence of HIT,
          or the composition of the study population.
        supports: SUPPORT
