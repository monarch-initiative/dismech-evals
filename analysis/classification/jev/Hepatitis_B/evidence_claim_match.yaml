        in one center enrolling through December 2024, so it bounds the observed cohort rather than establishing
        a population-level suppression rate. This source is a preprint (Research Square) and has not been
        peer reviewed; it corroborates the peer-reviewed references above rather than carrying the claim
        on its own.
