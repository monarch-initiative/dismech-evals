              trajectories agreed to a maximum relative difference below 1.03e-7 under matched LSODA settings
              and reproduced the archived Figure 12(a) result. The standardized workflow is incomplete:
              every SED-ML file references PVR.xml without model changes, so the named Breakthrough, NullResponse,
              and Triphasic SED-ML files do not encode their corresponding CPS parameterizations; Breakthrough.sedml
              and NullResponse.sedml are byte-identical. The stored Triphasic CPS time-course settings
              are internally inconsistent (19 steps of 3.333333333 days with a declared duration of 60
              days), and current COPASI runs to 63.333 days unless the step size is forced to 60/19. BioSimulators
              archive validation completes with unit/modeling warnings, but the standardized COPASI archive
              runner hung after task start in the curator environment while direct COPASI execution succeeded.
