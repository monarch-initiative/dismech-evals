  def0ff927f7f9116e917d50b697c3eda466950b7eca82d1bb14b008ca5bb7f97:
    claim:
      about:
        disease:
          name: Hepatitis C
          disease_term:
            preferred_term: hepatitis C virus infection
            term:
              id: MONDO:0005231
              label: hepatitis C virus infection
        context: []
      assertion_type: ComputationalModel
      assertion:
        name: Aston2018 HCV Within-Host Viral-Dynamics Model
        description: Deterministic three-state ordinary differential-equation model of healthy hepatocytes,
          infected hepatocytes, and circulating HCV viral load in a well-mixed liver compartment. It represents
          hepatocyte regeneration and death, infection, virion production and clearance, and treatment-adjusted
          infection and virion-production rates.
        model_type: KINETIC
        repository_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000713
        model_id: BIOMD0000000713
        model_software: MATLAB for publication fitting; COPASI for the BioModels model and fitted variants
        model_format: SBML Level 2 Version 4 (main PVR parameterization); COPASI CPS scenario variants;
          SED-ML Level 1 Version 4 / COMBINE OMEX
        publication: PMID:29652855
        variables:
        - name: Healthy hepatocyte concentration
          dataset_identifier: T
          description: Latent model-scaled concentration of uninfected hepatocytes; it was not observed
            in the fitted clinical viral-load datasets.
          unit: IU/mL
        - name: Infected hepatocyte concentration
          dataset_identifier: I
          description: Latent model-scaled concentration of infected hepatocytes inferred from viral-load
            fitting rather than measured in the clinical datasets.
          unit: IU/mL
        - name: HCV viral load
          dataset_identifier: V
          description: Observable model state fitted to treatment-period HCV RNA measurements.
          unit: IU/mL
        - name: Stem-cell hepatocyte generation rate
          dataset_identifier: s
          description: Rate parameter for generation of healthy hepatocytes in proportion to infected
            hepatocytes.
          unit: 1/day
        - name: Treatment-adjusted infection rate
          dataset_identifier: beta
          description: SBML parameter for the treatment-adjusted rate at which virions infect healthy
            hepatocytes.
          unit: mL/IU/day
        - name: Treatment-adjusted virion-production rate
          dataset_identifier: pstar
          description: Rate of virion production by infected hepatocytes after the modeled treatment effect.
          unit: 1/day
        modeled_mechanisms:
        - target: HCV genome replication and early viremia
          relationship: PARTIALLY_RECAPITULATES
          description: The model explicitly couples healthy-hepatocyte infection, infected-cell loss,
            virion production, and viral clearance, and fits the viral-load state to human treatment-response
            profiles.
          fidelity: MODERATE
          limitations: The model is deterministic and well mixed, with only healthy hepatocytes, infected
            hepatocytes, and virions. Hepatocyte states are latent and were not measured in the fitted
            datasets; aggregate death-rate terms replace immune-mediated injury. Viral genotype and evolution,
            interferon signaling, immune-cell responses, inflammation, fibrosis, and cancer are absent.
            Four treatment profiles were fitted in-sample without held-out or prospective validation,
            and substantially different parameter sets can produce similar fits.
          readouts:
          - name: HCV viral-load trajectory
            target: HCV genome replication and early viremia
            description: Time course of state V, fitted on the logarithmic scale to viral-load measurements
              obtained during treatment.
            interpretation: Captures partial-response, breakthrough, null-response, and triphasic profile
              shapes but is not a prospectively validated individual treatment prediction.
        findings:
        - statement: The same three-state ODE structure was fitted to partial virologic response, breakthrough,
            null-response, and triphasic treatment-period viral-load profiles.
        - statement: With stem-cell hepatocyte generation set to zero, the model has uninfected, infected,
            and pure-infection steady-state branches; adding stem-cell generation unfolds the pure-infection
            bifurcation into one valid infected branch with a limit point.
        notes: 'BioModels entry BIOMD0000000713 (internal submission MODEL1808280002) is manually curated;
          this record pins public revision 9 at https://www.biomodels.org/services/download/get-files/MODEL1808280002/9/MODEL1808280002.9.omex.
          The revision-9 COMBINE archive retrieved for curator testing was 83,278 bytes with SHA-256 5ca8ec25248d053f4dc52374658df7fc403ea1c4fa4a9141ca93bd0b600712c8,
          and its main PVR.xml file has SHA-256 b8d62ff28623b18ba31fd59a39a3f5bbd799a0fef9601a5a0f435d5c722cf3b3.
          BioModels distributes the model under CC0; the archive itself contains no separate license file.
          PVR.cps, Breakthrough.cps, NullResponse.cps, and Triphasic.cps are distinct parameter and initial-condition
          variants of the same three-species, nine-reaction structure. Under Python 3.13.9 with COPASI
          4.46.300 and basiCO 0.86, all four CPS files loaded and simulated; the PVR SBML and CPS trajectories
          agreed to a maximum relative difference below 1.03e-7 under matched LSODA settings and reproduced
          the archived Figure 12(a) result. The standardized workflow is incomplete: every SED-ML file
          references PVR.xml without model changes, so the named Breakthrough, NullResponse, and Triphasic
          SED-ML files do not encode their corresponding CPS parameterizations; Breakthrough.sedml and
          NullResponse.sedml are byte-identical. The stored Triphasic CPS time-course settings are internally
          inconsistent (19 steps of 3.333333333 days with a declared duration of 60 days), and current
          COPASI runs to 63.333 days unless the step size is forced to 60/19. BioSimulators archive validation
          completes with unit/modeling warnings, but the standardized COPASI archive runner hung after
          task start in the curator environment while direct COPASI execution succeeded. libSBML reports
          no parse errors, with 17 unit/modeling-practice warnings including eight parameters without
          declared units. The archive hash is a retrieval snapshot because BioModels can regenerate container
          packaging; the revision and main-file hash are the stronger content pins. The original MATLAB
