              Fibrosis, Immune Evasion, or Hepatocellular Carcinoma Development.'
          role: ancestor
      assertion_type: Finding
      assertion:
        statement: With stem-cell hepatocyte generation set to zero, the model has uninfected, infected,
          and pure-infection steady-state branches; adding stem-cell generation unfolds the pure-infection
          bifurcation into one valid infected branch with a limit point.
      selected_evidence:
        snippet: In the case S=0 (no generation of hepatocytes from stem cells), we showed that there
          is a pure infection branch of solutions, and an infected steady state branch was found analytically
          that connects the uninfected and pure infection branches. When S>0, the bifurcation between
          the pure infected and infected branches unfolds, generating a single valid branch of infected
          solutions on which there is a limit point (see Figure 7).
        supports: SUPPORT
