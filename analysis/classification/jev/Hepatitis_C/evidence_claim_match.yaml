        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Acute infection
        duration: Up to six months from acquisition, before persistent viremia is classified as chronic
        duration_days: '180'
        notes: Acute infection begins with recent HCV acquisition and detectable viremia. The six-month
          boundary is a clinical definition of chronicity rather than a claim that every untreated infection
          remains biologically unchanged until that time. The phase is predominantly asymptomatic and
          so is rarely diagnosed while it lasts; a minority present with clinically apparent hepatitis,
          which may include jaundice, nausea, fatigue, anorexia, and elevated transaminases. Diagnosis
          requires evidence that acquisition was recent, because anti-HCV and HCV RNA at a single time
          point do not separate this phase from chronic infection.
      selected_evidence:
        snippet: approximately 50-70% of individuals with recently acquired hepatitis C will develop a
          chronic infection, defined as the persistence of viremia for a period exceeding six months.
        supports: SUPPORT
