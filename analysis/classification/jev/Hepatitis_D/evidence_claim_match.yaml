        context: []
      assertion_type: Treatment
      assertion:
        name: Hepatitis B Vaccination
        description: 'Because HDV cannot infect a hepatocyte or assemble a virion without HBV-supplied
          HBsAg, preventing hepatitis B prevents hepatitis D outright. HBV vaccination is therefore fully
          protective against HDV in anyone not already infected with HBV, and is the mainstay of HDV prevention.
          Its one limitation defines the residual burden: it does nothing for the established chronic
          HBV carrier, who remains at lifelong risk of superinfection - the route that actually produces
          chronic hepatitis delta.'
        therapeutic_modality: VACCINE
        treatment_term:
          preferred_term: Vaccination
          term:
            id: NCIT:C15346
            label: Vaccination
      selected_evidence:
        snippet: As a consequence, every HBV carrier is potentially at risk for HDV superinfection.
        supports: SUPPORT
