          inhibitors: virological response was only 20-30%, side effects were substantial, and advanced
          liver disease - exactly the population most in need - is effectively a contraindication.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Antiviral Therapy
          term:
