              label: hepatitis D virus infection
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Host-Polymerase-Mediated HDV Replication
        description: 'The HDV genome is replicated by host RNA polymerases; the virus encodes no polymerase
          of its own. This has a direct therapeutic consequence that separates hepatitis D from hepatitis
          B and C: there is no viral replication enzyme to inhibit, so the nucleos(t)ide analogues that
          suppress HBV and the direct-acting antivirals that cure HCV are useless against HDV. Every drug
          developed for hepatitis D therefore targets an HBV-supplied step of the cycle instead.'
        role: central_effector
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: its replication is mediated by the host RNA polymerases
        supports: SUPPORT
    origin:
