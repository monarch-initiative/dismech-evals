      assertion_type: Pathophysiology
      assertion:
        name: L-HDAg Farnesylation and HBsAg-Dependent Virion Assembly
        description: HDV ribonucleoproteins consist of the RNA genome packaged with small and large delta
          antigen. Farnesylation of the large delta antigen is the rate-limiting step for anchoring the
          ribonucleoprotein to HBsAg, and so for assembling, secreting, and propagating virions. This
          is the second HBV-dependent bottleneck in the life cycle and the target of the prenylation inhibitor
          lonafarnib.
        role: effector
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Farnesylation of the L-HDAg is the limiting step for anchoring this RNP to HBsAg, and
          thus for assembling, secreting and propagating virion particles.
        supports: SUPPORT
