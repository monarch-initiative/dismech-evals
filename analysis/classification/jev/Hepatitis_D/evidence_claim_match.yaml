                  label: Bulevirtide
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: HBsAg-Dependent Hepatocyte Entry via NTCP
        treatment_effect: INHIBITS
        description: Bulevirtide occupies NTCP and blocks receptor-mediated entry of HBsAg-enveloped HDV
          virions into hepatocytes, cutting the life cycle at its first step.
      selected_evidence:
        snippet: Administration of BLV monotherapy for 24 or 48 weeks resulted in 50%-83% virological
          response (HDV RNA ≥ 2 Log decline) rates and 45%-78% ALT normalization.
