          therapeutic_agent:
          - preferred_term: recombinant interferon alfa
            term:
              id: NCIT:C225
              label: Recombinant Interferon Alfa
      selected_evidence:
        snippet: 'In the last 30 years, the only treatment option for CHD has been represented by the
          off-label administration of Interferon (or Pegylated Interferon)-alpha: antiviral treatment,
          however, resulted in suboptimal (20-30%) virological response and was burdened by several side
          effects, de facto contraindicating Interferon (IFN) administration in patients with more advanced
          liver disease.'
        supports: SUPPORT
