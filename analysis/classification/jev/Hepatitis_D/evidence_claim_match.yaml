            preferred_term: hepatitis D virus infection
            term:
              id: MONDO:0005789
              label: hepatitis D virus infection
        context: []
      assertion_type: Treatment
      assertion:
        name: Bulevirtide
        description: 'A first-in-class HBV-HDV entry inhibitor: a lipopeptide derived from the HBV pre-S1
          domain that blocks NTCP and so prevents virions from entering hepatocytes. It received conditional
          EMA approval in July 2020 for compensated chronic hepatitis delta at 2 mg/day subcutaneously.
          Monotherapy for 24 or 48 weeks produced virological response in 50-83% and ALT normalisation
          in 45-78%, with synergistic effects when combined with pegylated interferon, and the results
          held in patients with advanced cirrhosis and clinically significant portal hypertension. Its
          characteristic on-target effect follows directly from what NTCP normally does: blocking a bile
          acid transporter raises serum bile acids, though asymptomatically.'
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Antiviral Therapy
          term:
            id: NCIT:C16119
            label: Antiviral Therapy
          therapeutic_agent:
          - preferred_term: bulevirtide
            term:
              id: NCIT:C169819
              label: Bulevirtide
      selected_evidence:
        snippet: Recently, Bulevirtide (BLV), a first-in-class HBV-HDV entry inhibitor blocking Na+ -taurocholate
          co-transporting polypeptide (NTCP), has provided very promising efficacy data in Phase II and
          Phase III (interim analysis) trials as well as in preliminary real-life reports.
        supports: SUPPORT
