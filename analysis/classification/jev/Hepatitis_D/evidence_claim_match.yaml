            term:
              id: MONDO:0005789
              label: hepatitis D virus infection
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acquisition Route - Coinfection versus Superinfection
        description: HDV is transmitted by the same routes as HBV, and because it cannot propagate without
          HBsAg it can be acquired in only two ways. In coinfection the two viruses are transmitted simultaneously,
          so the delta agent's persistence depends on whether the acute HBV infection resolves - and it
          usually does, with more than 95% of coinfected patients clearing both viruses within six months.
          In superinfection HDV is acquired by someone already chronically infected with HBV, so an abundant
          helper is present from the outset and more than 80% develop chronic HDV infection. The two routes
          therefore have opposite natural histories, and it is superinfection, not HDV as such, that feeds
          the accelerated cirrhotic course modelled downstream.
        role: trigger
        biological_scale: ORGANISM
      selected_evidence:
        snippet: More than 95% of patients co-infected with HBV and HDV completely clear both viruses
          within six months
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37338616
      reference_title: Diagnosis and Management of Hepatitis Delta Virus Infection.
      evidence_source: OTHER
      explanation: Quantifies the coinfection outcome, establishing that this route usually does not chronify.
        Evidence source is OTHER because this is an expert panel guideline synthesising the literature.
