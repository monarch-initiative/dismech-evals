          value:
            name: Superinfection
            display_name: HDV superinfection of established chronic HBV
            description: 'Acquisition of hepatitis D by someone already chronically infected with hepatitis
              B. Because HBsAg is already abundant, the delta agent has an established helper from the
              outset, and more than 80% of these patients develop chronic HDV infection. This is the route
              responsible for the accelerated course: among patients with chronic HDV superinfection,
              cirrhosis and liver failure occur in 70-80% within 5-10 years. Every chronic HBV carrier
              is at risk, which is why the accelerated progression this entry models should be attributed
              to superinfection rather than to HDV generically.'
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Accelerated Progression to Cirrhosis and Hepatocellular Carcinoma
        description: 'Chronic hepatitis delta is the most severe form of chronic viral hepatitis, with
          high rates of progression to cirrhosis and its complications - end-stage liver disease and hepatocellular
          carcinoma. This accelerated course, on top of an HBV infection that would itself progress more
          slowly, is what makes HDV coinfection clinically decisive. The fibrotic and portal-hypertensive
          endpoints are those of the corresponding mechanism modules rather than HDV-specific processes.
          This node is reached predominantly by the SUPERINFECTION route: among patients with chronic
          HDV superinfection, cirrhosis and liver failure occur in 70-80% within 5-10 years. Simultaneous
          coinfection usually resolves and does not reach this node, so a conforming or citing entry should
          not attribute the accelerated course to HDV generically.'
        role: consequence
        biological_scale: ORGANISM
        subtypes:
        - Superinfection
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
      selected_evidence:
        snippet: Chronic hepatitis delta (CHD) affects approximately 10-20 million people worldwide and
          represents the most severe form of chronic viral hepatitis, as it is characterized by high rates
          of progression to cirrhosis and its complications (end-stage liver disease, hepatocellular carcinoma).
        supports: SUPPORT
