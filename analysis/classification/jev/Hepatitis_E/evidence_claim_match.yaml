        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Host Immune Response Determining Infection Outcome
        description: 'The decisive node of hepatitis E. In immunocompetent individuals the majority of
          infections remain asymptomatic and lead to spontaneous clearance, with only 5-16% developing
          symptomatic acute hepatitis. A growing body of evidence indicates that the host immune response
          to different HEV genotypes is the critical determinant of the distinct outcomes. Two host states
          break the usual outcome in opposite directions: immunosuppression permits persistence, and pregnancy
          converts a self-limited illness into one with up to 30% mortality.'
        role: central_effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: adaptive immune response
          term:
            id: GO:0002250
            label: adaptive immune response
        - preferred_term: response to virus
          term:
            id: GO:0009615
            label: response to virus
      selected_evidence:
        snippet: A growing body of evidence suggests that the host immune response to infection with different
          HEV genotypes is a critical determinant of distinct HEV infection outcomes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
