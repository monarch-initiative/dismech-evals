          in a randomized trial, but it achieves sustained virological response in a large share of treated
          patients and is the accepted standard of care. Treatment failure is associated with point mutations
          in the viral polymerase (notably G1634R), and pegylated interferon-alpha is the salvage option
          after ribavirin failure.
