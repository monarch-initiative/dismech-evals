      assertion_type: Treatment
      assertion:
        name: Reduction of Immunosuppressive Therapy
        description: In chronic hepatitis E the persistence of the virus is a consequence of an inadequate
          host T cell response, so the first therapeutic move is to restore that response by lowering
          immunosuppression where the underlying transplant or disease indication permits. This acts on
          the host side of the module's central effector rather than on the virus, and it clears a substantial
          fraction of cases without any antiviral. It is attempted before ribavirin.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Therapeutic Procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: A growing body of evidence suggests that the host immune response to infection with different
          HEV genotypes is a critical determinant of distinct HEV infection outcomes.
        supports: SUPPORT
