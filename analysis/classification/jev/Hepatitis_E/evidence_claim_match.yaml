      assertion_type: InfectiousAgent
      assertion:
        name: Hepatitis E virus (HEV)
        description: 'A positive-strand RNA virus of the family Hepeviridae. Four main genotypes infect
          humans and divide sharply by ecology: genotypes 1 and 2 are human-restricted and waterborne,
          genotypes 3 and 4 are zoonotic and foodborne. The genotype largely determines the clinical entity,
          so it is curated here as a property of the agent rather than as disease severity.'
        infectious_agent_term:
          preferred_term: Paslahepevirus balayani
          term:
            id: NCBITaxon:1678143
            label: Paslahepevirus balayani
      selected_evidence:
        snippet: There are four main genotypes of HEV. Genotype 1 and genotype 2 are common in developing
          countries and are transmitted by contaminated water from a fecal-oral route. Genotype 3 and
          genotype 4 are common in developed countries and can lead to occasional transmission to humans
          via undercooked meat.
        supports: SUPPORT
    origin:
