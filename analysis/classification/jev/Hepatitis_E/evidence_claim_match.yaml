      assertion:
        name: Zoonotic Foodborne Transmission (Genotypes 3 and 4)
        description: Genotypes 3 and 4 are zoonotic, maintained in animal reservoirs and transmitted to
          humans through undercooked meat. This is the dominant route in developed countries and explains
          why hepatitis E is now recognised as an endemic rather than imported infection there.
      selected_evidence:
        snippet: Genotype 3 and genotype 4 are common in developed countries and can lead to occasional
          transmission to humans via undercooked meat.
        supports: SUPPORT
