  c1a91e608dad6f22027efe1a4c76751353133487721d49816cdd1c57de452e9b:
    claim:
      about:
        disease:
          name: Hepatocellular Carcinoma
          disease_term:
            preferred_term: hepatocellular carcinoma
            term:
              id: MONDO:0007256
              label: hepatocellular carcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_phthalate_class_hepatocarcinogenesis_scope
        prompt: Does the phthalate class act on hepatocellular carcinoma through a shared mechanism that
          this entry should represent as one environmental pathway, or is monomethyl phthalate's MMP9
          route compound-specific and not generalizable to the other plasticizers people are exposed to
          alongside it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - environmental#Monomethyl phthalate exposure
        - pathophysiology#MMP9 Upregulation
        rationale: 'The monomethyl phthalate arm curated here rests on one publication, and the obvious
          next move - generalizing it to a phthalate or endocrine-disruptor exposure pathway - is exactly
          what the rest of the literature does not yet license. The three phthalates with recent hepatocellular
          carcinoma work nominate three different targets: monomethyl phthalate is reported to act through
          MMP9, di(2-ethylhexyl) phthalate and its metabolite through PPARG and a lipid-storage program,
          and diisononyl phthalate produces liver tumours in rodents through PPAR-alpha. So there is no
          shared node to factor out, and a single environmental-chemical node would assert a convergence
          nobody has shown. The diisononyl assessment cuts the other way as well, and is the reason this
          is recorded as open rather than as pending work: a systematic integration of human, animal and
          mechanistic evidence concludes that compound is unlikely to be a human carcinogen, with its
          rodent liver tumours attributed to a mode of action held not to translate. Class membership
          therefore does not carry hepatocarcinogenic risk by itself, and the human evidence for the monomethyl
          route is a Mendelian randomization estimate the authors themselves call preliminary. What would
          settle it is whether the MMP9 response is reproduced for other phthalate metabolites in human
          hepatocyte systems, and whether any exposure cohort measuring phthalate metabolites reports
          hepatocellular carcinoma incidence directly rather than through genetic instruments.'
      selected_evidence:
        snippet: Evidence from epidemiological studies is limited, but does not indicate an association
          between DINP exposure and cancer
        supports: SUPPORT
        directness: INDIRECT
    origin:
