      assertion:
        name: Aerobic Glycolysis and Metabolic Reprogramming
        conforms_to: deregulated_cellular_energetics#Aerobic Glycolysis (Warburg Effect)
        biological_scale: CELLULAR
        description: HCC cells reprogram metabolism from oxidative phosphorylation to aerobic glycolysis
          (Warburg effect), enabling rapid ATP regeneration and providing carbon intermediates for biosynthesis.
          This metabolic shift is driven by oncogenic signaling (PI3K/AKT, MYC) and supports the high
          proliferative rate of hepatocellular carcinomas. The mechanism linking mitochondrial acetyl-CoA
          homeostasis to pyruvate transport and glycolytic switching remains incompletely characterized.
        biological_processes:
        - preferred_term: Glycolytic Process
          modifier: INCREASED
          term:
            id: GO:0006096
            label: glycolytic process
      selected_evidence:
        snippet: most cancer cells produce large amounts of lactate regardless of the availability of
          oxygen
        supports: SUPPORT
