  581cb29f9d930bc546b617e4b635297b037a92dccb85d557f65abc029ad1f57c:
    claim:
      about:
        disease:
          name: Hepatocellular Carcinoma
          disease_term:
            preferred_term: hepatocellular carcinoma
            term:
              id: MONDO:0007256
              label: hepatocellular carcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_rpp40_trna_processing_mtor_myc_causality
        prompt: Does RPP40 sustain mTOR/MYC signaling in hepatocellular carcinoma specifically through
          RNase P-mediated 5-prime pre-tRNA maturation, or are the reported effects better explained by
          RNase MRP/pre-rRNA and ribosome biogenesis, an RPP40-specific noncanonical activity, or expression
          downstream of proliferative state?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#rpp40_rnase_p_pretrna_mtor_myc_bridge
        - pathophysiology#PI3K/AKT/mTOR Pathway Activation
        - pathophysiology#Enhanced Hepatocyte Proliferation
        rationale: 'RNase P and RNase MRP are distinct ribonucleoprotein complexes that share RPP40: RNase
          P removes 5-prime leaders from pre-tRNAs, whereas RNase MRP processes pre-rRNA in ribosome biogenesis.
          PMID:42424930 reports RPP40 perturbation phenotypes and nominates mTOR/MYC, but it does not
          measure either RNA-processing branch or establish temporal ordering. PMID:40517827 independently
          links RPP40 to ribosomal-RNA and ribosomal-gene transcription in HCC cells, making an rRNA/ribosome-biogenesis
          route a concrete competing explanation without proving RNase MRP catalytic mediation. Pan-cancer
          profiling further classifies RPP40 as a broadly essential, cell-cycle-coupled dependency, raising
          a generic biosynthetic-demand alternative without proving that RPP40 elevation is merely downstream
          in HCC. Independent HCC evidence also places mTORC1 upstream of a ribosome-biogenesis effector,
          so reverse directionality remains plausible. The current evidence therefore does not justify
          a causal RPP40-to-mTOR/MYC graph edge.'
        proposed_experiments:
        - experiment_id: exp_rpp40_processing_dependence_and_epistasis
          experiment_design: TARGETED_PERTURBATION
          name: Acute complex-specific RPP40-RNase P/RNase MRP branch test
          description: First compare acute depletion of shared-subunit RPP40 with an RNase-P-specific
            perturbation and an RNase-MRP-specific perturbation in two authenticated HCC-derived lines.
            Collect targeted RNA-processing, signaling, and proliferation measurements before loss of
            viability. Only after this primary branch-selection stage should branch-specific rescue, mTOR/MYC
            epistasis, global omics, or organoid validation be added.
          experiment_type:
            preferred_term: time-resolved complex-specific perturbation study
          model_systems:
          - name: Authenticated HCC-derived cell-line pair
            description: Use Huh-7 plus an independently authenticated HCC-derived line such as Hep3B,
              with short time courses and matched perturbation efficiency.
          - name: HepG2 seed-study replication model
            description: Retain HepG2 only as a secondary replication context because it was used in the
              cited study; label it correctly as hepatoblastoma-derived rather than as an HCC-derived
              line.
          perturbations:
          - name: Acute RPP40 depletion
            target: gene#RPP40
            description: Use inducible degradation or CRISPR interference with multiple reagents and sample
              before secondary cell-cycle arrest or loss of viability.
            gene:
              preferred_term: RPP40
              term:
                id: hgnc:20992
                label: RPP40
          - name: RNase-P-specific perturbation
            target: gene#RPP21
            description: Acutely deplete RPP21, an RNase-P-specific protein subunit, with an orthogonal
              RPPH1 perturbation reserved for confirmation.
            gene:
              preferred_term: RPP21
              term:
                id: hgnc:21300
                label: RPP21
          - name: RNase-MRP-specific perturbation
            target: gene#C18orf21
            description: Acutely deplete the RNase-MRP-specific subunit C18orf21 (RMP24), with an orthogonal
              RMRP perturbation reserved for confirmation.
            gene:
              preferred_term: C18orf21
              term:
                id: hgnc:28802
                label: C18orf21
          - name: Combined RNase-P-specific and RNase-MRP-specific perturbation
            target: gene#RPP21
            description: Acutely co-deplete RPP21 and C18orf21, with simultaneous RPPH1 and RMRP perturbation
              as an orthogonal confirmation, to reproduce the dual RNase-P and RNase-MRP loss caused by
              shared-subunit RPP40 depletion. This arm is required before an RPP40-only phenotype is interpreted
              as noncanonical rather than as synergy between the two processing defects.
            genes:
            - preferred_term: RPP21
              term:
                id: hgnc:21300
                label: RPP21
            - preferred_term: C18orf21
              term:
                id: hgnc:28802
                label: C18orf21
          - name: Conditional downstream mTOR/MYC epistasis
            target: pathophysiology#PI3K/AKT/mTOR Pathway Activation
            description: After a processing branch is selected, test whether independent mTORC1 or MYC
              activation rescues the branch-specific signaling and proliferation phenotype. This orders
              downstream signaling but cannot by itself identify the upstream RNA-processing branch.
            genes:
            - preferred_term: MTOR
              term:
                id: hgnc:3942
                label: MTOR
            - preferred_term: MYC
              term:
                id: hgnc:7553
                label: MYC
          - name: Reciprocal mTOR/MYC and proliferation-state perturbation
            target: pathophysiology#PI3K/AKT/mTOR Pathway Activation
            description: After the branch-selection stage, acutely inhibit mTORC1 or MYC and independently
              impose a matched proliferation arrest without depleting RPP40. Measure early RPP40 transcript
              and protein abundance and both RNA-processing outputs to test the competing possibility
              that RPP40 elevation is downstream of oncogenic signaling or proliferative state.
            genes:
            - preferred_term: MTOR
              term:
                id: hgnc:3942
                label: MTOR
            - preferred_term: MYC
              term:
                id: hgnc:7553
                label: MYC
          readouts:
          - name: RNase P pre-tRNA maturation
            target: biological_process#tRNA processing
            description: Quantify 5-prime-leader-containing pre-tRNAs and precursor-to-mature-tRNA ratios
              at early time points.
            biological_processes:
            - preferred_term: tRNA processing
              term:
                id: GO:0008033
                label: tRNA processing
            assays:
            - preferred_term: precursor-specific RT-qPCR
            - preferred_term: northern blot
          - name: RNase MRP pre-rRNA and 40S maturation
            target: biological_process#rRNA processing
            description: Quantify uncleaved ITS1-containing pre-rRNA, mature 18S-rRNA production, and
              the 40S-to-60S ribosomal-subunit ratio at matched early time points.
            biological_processes:
            - preferred_term: rRNA processing
              term:
                id: GO:0006364
                label: rRNA processing
            assays:
            - preferred_term: ITS1-specific RT-qPCR and northern blot
            - preferred_term: sucrose-gradient polysome profiling
          - name: mTOR/MYC temporal response
            target: pathophysiology#PI3K/AKT/mTOR Pathway Activation
            description: Measure phospho-S6K, phospho-4E-BP1, and MYC protein alongside nascent translation
              before proliferation or viability diverges.
            assays:
            - preferred_term: immunoblot time course
            - preferred_term: nascent-protein-synthesis assay
          - name: Proliferation and viability
            target: pathophysiology#Enhanced Hepatocyte Proliferation
            description: Measure EdU incorporation, cell-cycle state, and viability so early pathway effects
              can be separated from later generic ribosome-loss toxicity.
            assays:
            - preferred_term: EdU incorporation assay
            - preferred_term: live-cell viability assay
          controls:
          - name: Perturbation controls
            description: Use non-targeting and multiple independent guides, mock-degron controls, matched
              perturbation efficiencies, and prespecified early sampling windows.
          - name: Complex-specific activity controls
            description: Require RPP21 loss to produce its expected pre-tRNA defect and C18orf21 loss
              to produce its expected pre-rRNA defect before interpreting a negative signaling result.
          - name: Matched dual-complex activity control
            description: Require the combined RPP21-plus-C18orf21 or RPPH1-plus-RMRP arm to match the
              early pre-tRNA and pre-rRNA defects produced by RPP40 loss before using a discordant signaling
              phenotype to infer an RPP40-specific noncanonical activity.
          decision_criterion: The RNase-P/pre-tRNA bridge is supported only if RPP40 loss and RNase-P-specific
            loss share an early pre-tRNA defect followed by the same mTOR/MYC decline, while a validated
            RNase-MRP-specific perturbation causes its expected pre-rRNA defect without that early signaling
            signature. An RNase MRP alternative is favored, and the narrow RNase P hypothesis is refuted
            in that model, if RPP40 and C18orf21/RMRP perturbations instead share an ordered pre-rRNA/40S
            defect and mTOR/MYC decline while RPP21/RPPH1 loss impairs pre-tRNA maturation without the
            signaling effect. A signaling change unique to RPP40 favors a noncanonical role only if a
            combined RNase-P-specific plus RNase-MRP-specific perturbation matches both early processing
            defects without reproducing that signaling change; discordance from either single perturbation
            alone may instead reflect dual-loss synergy. Signaling changes that appear only after generalized
            translation failure, cell-cycle arrest, or loss of viability do not establish either branch.
            Reciprocal mTOR/MYC inhibition and matched proliferation arrest support the downstream-state
            alternative if they reduce RPP40 before either processing output changes. Branch-specific
            rescue and bidirectional mTOR/MYC epistasis should be attempted only after this primary discriminator
            is met.
          would_support:
          - mechanistic_hypotheses#rpp40_rnase_p_pretrna_mtor_myc_bridge
          would_refute:
          - mechanistic_hypotheses#rpp40_rnase_p_pretrna_mtor_myc_bridge
      selected_evidence:
        snippet: While the ribonucleoprotein complex subunit RPP40 plays a critical role in precursor
          tRNA processing and has demonstrated prognostic value in several cancer types, its specific
          function and underlying mechanisms in HCC pathogenesis remain poorly understood.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42424930
      reference_title: RPP40, a subunit of Ribonuclease P, facilitates hepatocellular carcinoma proliferation
        by activating the mTOR/MYC signaling.
      evidence_source: OTHER
      explanation: The seed paper explicitly identifies the unresolved HCC mechanism while separating
        RPP40's known canonical role from the HCC-specific question.
