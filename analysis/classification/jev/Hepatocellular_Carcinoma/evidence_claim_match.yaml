              label: hepatocellular carcinoma
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: rpp40_rnase_p_pretrna_mtor_myc_bridge
        hypothesis_label: RNase P Pre-tRNA Processing as the RPP40-mTOR/MYC Bridge
        status: EMERGING
        description: Elevated RPP40 may sustain mTOR/MYC output in established hepatocellular carcinoma
          specifically because its contribution to RNase P preserves 5-prime pre-tRNA maturation and translational
          capacity. This narrow model predicts that an RNase P/pre-tRNA defect after acute RPP40 loss
          precedes signaling decline and is phenocopied by an RNase-P-specific perturbation. RPP40 is
          also shared with RNase MRP, however, and independent HCC evidence linking RPP40 to ribosomal-RNA
          and ribosomal-gene expression makes an RNase MRP/pre-rRNA or broader ribosome-biogenesis route
          a direct competitor. Neither published HCC study establishes the proposed RNase P ordering.
        notes: This hypothesis is intentionally not wired as a causal pathograph edge. Evidence supports
          the flanking RPP40 and mTOR/MYC observations, not the proposed RNase-P/pre-tRNA bridge.
      selected_evidence:
        snippet: Analysis showed that RPP40 expression was markedly upregulated in HCC tissues compared
          to adjacent normal tissues. High RPP40 expression correlated with poorer clinical outcomes,
          even among patients with matched histological grade or pathological stage.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42424930
      reference_title: RPP40, a subunit of Ribonuclease P, facilitates hepatocellular carcinoma proliferation
        by activating the mTOR/MYC signaling.
      evidence_source: HUMAN_CLINICAL
      explanation: Multi-dataset human-tumor associations support expression and prognostic correlation,
        but they do not establish whether RPP40 is a driver, dependency, or consequence of proliferative
        state.
