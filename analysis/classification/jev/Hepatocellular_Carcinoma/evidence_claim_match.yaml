    evidence_metadata:
      reference: PMID:16723659
      reference_title: Differential association of protein subunits with the human RNase MRP and RNase
        P complexes.
      evidence_source: IN_VITRO
      explanation: 'Human complex-partitioning biochemistry substantiates the shared-subunit premise of
        this gap: RPP40 partitions with essentially all RNase MRP particles as well as RNase P, so an
        RPP40 gain-of-function or loss-of-function experiment perturbs both complexes and cannot by itself
        assign an HCC phenotype to the RNase P branch. It reports complex composition only, and tests
        neither HCC nor mTOR/MYC signaling.'
