              distinct immune microenvironment features affecting immunotherapy response.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Necroptosis-Independent MLKL Function
        description: 'The headline finding of this arm, and what separates it from the necroptotic cell-death
          route MLKL is normally invoked for: the diet-induced MLKL accumulation proceeds without detectable
          necroptosis activation, and removing hepatocyte MLKL leaves Western-diet inflammation, fibrosis
          and liver injury unchanged - the readouts a necroptosis-driven mechanism would be expected to
          move. MLKL instead localises to nuclear and mitochondrial compartments, consistent with the
          organelle-intrinsic function modelled downstream.'
        biological_scale: MOLECULAR
        subtypes:
        - MASLD-Associated HCC
        biological_processes:
        - preferred_term: necroptotic process
          modifier: ABSENT
          term:
            id: GO:0070266
