      assertion_type: Pathophysiology
      assertion:
        name: MMP9 Upregulation
        description: 'Matrix metalloproteinase 9 is a secreted zinc endopeptidase that degrades basement-membrane
          and interstitial collagen, and it is the effector through which monomethyl phthalate exposure
          reaches hepatocellular carcinoma behaviour in the only study that has tested that link. The
          node records the abundance and activity change alone. Its standing rests on three separate observations:
          MMP9 is high in human hepatocellular carcinoma tissue and tracks with worse survival, monomethyl
          phthalate raises it in hepatocellular carcinoma cells, and blocking it removes the growth and
          migration the exposure produces in HuH-7. That last arm is what makes the upregulation the exposure''s
          point of entry rather than a correlate of it. The invasion the enzyme enables is the node downstream,
          not this one.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MMP9
          term:
            id: hgnc:7176
            label: MMP9
        molecular_functions:
        - preferred_term: metalloendopeptidase activity
          modifier: INCREASED
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
      selected_evidence:
        snippet: Inhibition of MMP9 significantly reversed the MMP-induced pro-carcinogenic effects, indicating
          that MMP promotes HCC by upregulating MMP9 expression.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/15
      evidence_path: /pathophysiology/15/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42435151
      reference_title: Monomethyl phthalate promotes hepatocellular carcinoma progression through MMP9
        upregulation.
      evidence_source: IN_VITRO
      explanation: 'Loss-of-function arm in the paper''s cell model: removing MMP9 activity abolishes
        what the exposure does. The abstract names HuH-7 for the dose-response arm and does not say which
        line carried the inhibition experiment, so the line is left unnamed here. It reaches this node''s
        abundance claim through the consequence of blocking the enzyme rather than by measuring the enzyme,
        so it supports the node by inference.'
