          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Aerobic Glycolytic Shift in MASLD-Associated HCC
        conforms_to: deregulated_cellular_energetics#Aerobic Glycolysis (Warburg Effect)
        description: The MFN2-dependent respiratory deficit accompanies increased glycolytic flux, the
          Warburg phenotype of this arm. MLKL deletion in HCC cells decreases glycolysis and reduces proliferation,
          and MFN2 deletion reverses both, placing the glycolytic shift downstream of the MLKL-MFN2 axis
          rather than beside it.
        biological_scale: CELLULAR
        subtypes:
        - MASLD-Associated HCC
        notes: 'Kept separate from this entry''s other Warburg node, Aerobic Glycolysis and Metabolic
          Reprogramming, which carries the same conforms_to anchor and the same GO:0006096 term. They
          are two upstream routes to one phenotype, not a duplicate: that node is driven by oncogenic
          PI3K/AKT and MYC signalling and is written for HCC generally, while this one is MASLD-specific
          and its glycolytic shift is MFN2-dependent, which is the claim the MFN2-deletion rescue supports.
          Both converge on Enhanced Hepatocyte Proliferation. Folding them together would mean dropping
          either the subtype scope or the MFN2 dependence.'
        biological_processes:
        - preferred_term: glycolytic process
          modifier: INCREASED
          term:
            id: GO:0006096
            label: glycolytic process
      selected_evidence:
        snippet: In HCC cells, MLKL deletion reduced proliferation, improved mitochondrial respiration,
          and decreased glycolysis; these effects were reversed by MFN2 deletion.
        supports: SUPPORT
    origin:
