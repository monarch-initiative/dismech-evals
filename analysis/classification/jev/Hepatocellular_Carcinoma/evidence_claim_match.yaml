      assertion:
        name: Monomethyl phthalate exposure
        exposure_term:
          preferred_term: exposure to monomethyl phthalate
          modifier: INCREASED
          term:
            id: ECTO:9000906
            label: exposure to phthalate ester
        notes: 'ECTO has no monomethyl phthalate class. Searching the ECTO build with l~phthalate returns
          eleven exposure classes: ECTO:0900272, ECTO:9000522, ECTO:9000637, ECTO:9000906, ECTO:9001090,
          ECTO:9001433, ECTO:9001525, ECTO:9002263, ECTO:9002271, ECTO:9002559 and ECTO:9002632. Nine
          of them name a specific compound or polymer that is not this one, leaving two class-level candidates:
          ECTO:9000522 exposure to phthalate and ECTO:9000906 exposure to phthalate ester. l~monomethyl
          returns nothing at all; l~monoester returns only CHEBI rows and no ECTO class; l~plasticiser
          returns two rows, the chemical CHEBI:79056 and the exposure class ECTO:9002071, which is broader
          than either candidate. The ester class is the correct parent rather than the shorter-named ECTO:9000522:
          monomethyl phthalate is CHEBI:89749, a phthalic acid monoester (CHEBI:132610) and so a descendant
          of CHEBI:35484 phthalate ester, whereas the stimulus of ECTO:9000522 is CHEBI:26092 phthalate,
          which CHEBI places under carboxylic acid anion and which is therefore not an ancestor of the
          monoester. ECTO:9001090 exposure to Dimethyl phthalate was rejected on positive grounds although
          monomethyl phthalate is that compound''s primary hepatic metabolite: the study measures and
          administers the metabolite, so binding the parent diester would assert an exposure route it
          never measured.'
      selected_evidence:
        snippet: MR analysis provided preliminary genetic evidence for a positive association between
          MMP exposure and elevated HCC risk, with no significant heterogeneity or horizontal pleiotropy
          detected.
        supports: SUPPORT
        directness: DIRECT
