            term:
              id: MONDO:0007256
              label: hepatocellular carcinoma
        context: []
      assertion_type: Treatment
      assertion:
        name: Atezolizumab plus Bevacizumab
        description: First-line standard of care for unresectable HCC based on IMbrave150 trial. Anti-PD-L1
          (atezolizumab) combined with anti-VEGF (bevacizumab) demonstrated superior overall survival
          compared to sorafenib. Requires adequate liver function (Child-Pugh A) and no high-risk varices.
          Immunotherapy trials in HCC require careful interpretation due to delayed treatment effects
          and potential violations of proportional hazard assumptions, which may affect the apparent magnitude
          of benefit from surrogate endpoints like PFS.
        notes: 'HCC trial interpretation requires careful consideration of endpoint selection and validity
          of surrogates. Overall survival remains the most robust endpoint, though progression-free survival,
          time-to-progression, and objective response rate are frequently used to accelerate drug development.
          The validity of surrogate endpoints in HCC is debated due to tumor heterogeneity, competing
          risks related to liver disease (e.g., hepatic decompensation, hepatic encephalopathy), and the
          influence of post-progression therapies. Immunotherapy trials like IMbrave150 present additional
          challenges: delayed treatment effects that violate traditional proportional hazards assumptions
          and complex patterns of response not fully captured by conventional endpoint definitions. These
          methodological nuances should be considered when interpreting efficacy data and comparing trials
          with different endpoints and follow-up durations.'
        treatment_term:
          preferred_term: immunotherapy
          term:
            id: NCIT:C15262
            label: Immunotherapy
          therapeutic_agent:
          - preferred_term: atezolizumab
            term:
              id: NCIT:C106250
              label: Atezolizumab
          - preferred_term: bevacizumab
            term:
              id: NCIT:C2039
              label: Bevacizumab
      selected_evidence:
        snippet: Atezolizumab plus bevacizumab significantly improved overall survival (OS) and progression-free
          survival (PFS) versus sorafenib
        supports: SUPPORT
