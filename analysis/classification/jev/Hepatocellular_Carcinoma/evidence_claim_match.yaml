      assertion_type: Stage
      assertion:
        name: Advanced/Metastatic
        description: Advanced HCC with vascular invasion, portal vein tumor thrombus, or extrahepatic
          spread most often to lung, bone, adrenal gland, or lymph node. The metastatic phenotype develops
          on a background of chronic liver disease, viral hepatitis, cirrhosis, and frequent activation
          of Wnt/beta-catenin and angiogenic signaling pathways.
        notes: Folded in from the former Metastatic_HCC entry (cancer granularity ladder, design decisions
          §3a). Portal vein invasion and extrahepatic spread define the transition from locally advanced
          to metastatic biology; alpha-fetoprotein (AFP) is an important biomarker in advanced HCC when
          interpreted alongside imaging and underlying liver function. Clinically detected extrahepatic
          metastasis develops in roughly 13% of treated HCC patients by 5 years (PMID:18710423).
      selected_evidence:
        snippet: The incidence rate of extrahepatic metastasis, as detected during the lifetime after
          medical treatment of HCC, was approximately 13% at 5 years.
        supports: SUPPORT
