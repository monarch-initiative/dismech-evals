          value:
            name: MASLD-Associated HCC
            description: HCC arising in metabolic dysfunction-associated steatotic liver disease (formerly
              NAFLD/NASH). Increasingly common subtype that can occur even without cirrhosis. May have
              distinct immune microenvironment features affecting immunotherapy response.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Hepatocyte MLKL Upregulation
        description: 'In MASLD-associated HCC, long-term Western diet raises hepatocyte MLKL protein.
          This is an abundance change, not a change in catalytic activity: MLKL is a catalytically dead
          pseudokinase whose established role is as the terminal executioner of necroptosis, and the observation
          here is that it accumulates. Hepatocyte-specific MLKL knockout mice on the same diet develop
          fewer and smaller tumours, so the accumulation is the entry point of this arm rather than a
          bystander finding. Elevated MLKL also marks worse outcome in human HCC, and pharmacological
          MLKL inhibition suppresses xenograft growth.'
        biological_scale: MOLECULAR
        subtypes:
        - MASLD-Associated HCC
        genes:
        - preferred_term: MLKL
          term:
            id: hgnc:26617
            label: MLKL
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: WD increased hepatocyte MLKL protein expression without detectable necroptosis activation,
          indicating a necroptosis-independent role.
        supports: SUPPORT
