        surrogate endpoints (PFS, TTP, ORR) in HCC are complicated by tumor heterogeneity, competing risks
        from underlying cirrhosis, and post-progression therapy confounding, highlighting why OS improvement
        is particularly meaningful for durvalumab + tremelimumab.'
