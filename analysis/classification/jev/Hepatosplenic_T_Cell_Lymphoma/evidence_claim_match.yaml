            term:
              id: MONDO:0019474
              label: hepatosplenic T-cell lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Isochromosome 7q Formation
        biological_scale: MOLECULAR
        description: Isochromosome 7q, with loss of 7p and gain of 7q material, is the characteristic
          cytogenetic lesion of HSTCL and is present in the majority of karyotyped cases, frequently alongside
          trisomy 8. It is treated here as the transforming somatic event in the gamma/delta T-cell compartment.
        mechanism_confidence: PROVISIONAL
        notes: Marked PROVISIONAL because the cited sources establish that isochromosome 7q is the most
          frequent cytogenetic abnormality in HSTCL, not that it precedes the STAT5B and chromatin-modifier
          lesions. Treating it as the transforming event is the conventional reading and is what makes
          this the derived cell-of-origin node, but the ordering itself is not evidenced here.
        genetic_context:
          variant_origin: SOMATIC
        cell_types:
        - preferred_term: cytotoxic gamma-delta T cell
          term:
            id: CL:0000798
            label: gamma-delta T cell
      selected_evidence:
        snippet: Cytogenetic abnormalities included isochromosome 7q (i7q) in 8 (62%) of 13 and trisomy
          8 in 4 (44%) of 9.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33160933
      reference_title: 'Outcomes of Hepatosplenic T-Cell Lymphoma: The Mayo Clinic Experience.'
