      evidence_source: HUMAN_CLINICAL
      explanation: Contrary evidence, recorded rather than omitted. Seven of ten patients in this cohort
        had lymph node enlargement, against the characteristic absence of lymphadenopathy that this entry
        relies on in its description, its infiltration node and its lump/split argument. Graded INDIRECT
        because the same paper writes that "Lymph node involvement is less common", so the series qualifies
        the WHO characterisation rather than overturning it - and because radiological node enlargement
        in a systemically inflamed patient is not the same claim as nodal lymphomatous involvement.
