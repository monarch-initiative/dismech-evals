        name: Homologous Recombination Deficiency
        conforms_to: dna_repair_synthetic_lethality#HRR or FA/BRCA Repair Deficiency
        description: BRCA1 and BRCA2 are essential components of the homologous recombination (HR) pathway
          for error-free repair of DNA double-strand breaks. Loss of BRCA function forces cells to rely
          on error-prone repair pathways such as non-homologous end joining, leading to genomic instability.
        biological_processes:
        - preferred_term: homologous recombination
          modifier: DECREASED
          term:
            id: GO:0035825
            label: homologous recombination
      selected_evidence:
        snippet: "BRCA1 is a pleiotropic DDR protein that functions in both checkpoint \nactivation and\
          \ DNA repair, whereas BRCA2 is a mediator of the core mechanism of \nhomologous recombination."
        supports: SUPPORT
