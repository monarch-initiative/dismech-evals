      assertion_type: Pathophysiology
      assertion:
        name: BRCA1/2 Tumor Suppressor Loss
        conforms_to: germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in
          a Susceptible Cell
        description: Germline heterozygous BRCA1 or BRCA2 mutations result in one functional allele. Somatic
          loss or mutation of the remaining wild-type allele (second hit) eliminates BRCA function, initiating
          tumorigenesis. This follows Knudson's two-hit hypothesis for tumor suppressor gene inactivation.
        biological_processes:
        - preferred_term: DNA repair
          modifier: DECREASED
          term:
            id: GO:0006281
            label: DNA repair
      selected_evidence:
        snippet: The 659 predisposition variants and 18 additional large deletions in tumor suppressors,
          including ATM, BRCA1, and NF1, showed low gene expression and frequent (43%) loss of heterozygosity
          or biallelic two-hit events.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29625052
      reference_title: Pathogenic Germline Variants in 10,389 Adult Cancers.
      evidence_source: HUMAN_CLINICAL
      explanation: Pan-cancer germline-plus-tumor evidence, naming BRCA1 explicitly, that carriers reach
        a biallelic state in their tumors with measurable loss of expression. This node previously carried
        no evidence at all while asserting the two-hit mechanism in its description.
