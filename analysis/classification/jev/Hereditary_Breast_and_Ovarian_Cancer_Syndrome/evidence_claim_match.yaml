        conforms_to: germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation
        description: Progressive accumulation of genomic alterations in BRCA-deficient cells leads to
          transformation and tumor development. The tissue specificity (breast, ovary) may relate to estrogen
          exposure and proliferative demands on these tissues, though the precise mechanisms remain incompletely
          understood. Emerging evidence identifies serous tubal intraepithelial carcinoma (STIC) in the
          fallopian tube as a precursor for BRCA-associated high-grade serous ovarian cancer.
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
