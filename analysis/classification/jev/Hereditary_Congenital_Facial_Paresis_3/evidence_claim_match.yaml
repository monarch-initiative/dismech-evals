        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure to Maintain Rhombomere 4 Identity
        biological_scale: TISSUE
        description: 'Rhombomere 4 patterning is initiated normally but is not maintained without HOXB1.
          The segment is therefore specified and then loses its identity, which is why the downstream
          deficits are of specification and migration rather than of initial hindbrain segmentation.

          The reason initiation and maintenance come apart is that they are driven by different things.
          Initiation is extrinsic: a retinoic acid gradient made by Raldh2 in paraxial mesoderm, bounded
          by the RA-degrading Cyp26 enzymes, restricts Hoxb1 expression to presumptive r4. Maintenance
          is autoregulatory: HOXB1 sustains its own r4 expression through the b1 autoregulatory element,
          which is activated by HOXB1 and PBX1 binding together. That loop is exactly what the recurrent
          homeodomain Arg207 substitution destabilizes, which is how a DNA-contact mutation produces a
          maintenance failure rather than a failure to specify the segment at all.'
        locations:
        - preferred_term: rhombomere 4
          term:
            id: UBERON:0005511
            label: rhombomere 4
        biological_processes:
        - preferred_term: rhombomere development
          modifier: ABNORMAL
