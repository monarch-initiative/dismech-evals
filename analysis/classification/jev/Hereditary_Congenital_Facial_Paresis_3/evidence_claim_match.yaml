            term:
              id: MONDO:0013880
              label: facial paresis, hereditary congenital, 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hcfp3_unconnected_ear_and_speech_findings
        kind: KNOWLEDGE_GAP
        prompt: By what route does an r4 transcription-factor lesion produce external-ear malformation
          and hypernasal speech, if it produces them at all?
        attaches_to:
        - phenotypes#Abnormal Pinna Morphology
        - phenotypes#Hypernasal Speech
        rationale: 'Both findings are well attested clinically. Ear malformation was present in all four
          affected members of the consanguineous family and is described as a common accompaniment across
          the series; nasal voice was recorded on examination. Neither is connected in the pathograph,
          and that is deliberate rather than an omission.

          For the ear, the r4-derived neural crest does populate the second pharyngeal arch, which is
          the usual embryological argument, but no source cited in this entry makes that link for HCFP3,
          so drawing the edge would be reasoning from developmental biology rather than from the evidence
          to hand. For the speech finding, hypernasality is ordinarily velopharyngeal, and the soft palate
          is not an r4 derivative, so the obvious edge from facial weakness is probably the wrong one.
          Both are recorded here as open rather than resolved by a plausible-looking arrow.'
      selected_evidence:
        snippet: individuals with HCFP3 commonly exhibit ear malformations and some degree of esodeviation
        supports: SUPPORT
