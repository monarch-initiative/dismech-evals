        modeled_mechanisms:
        - target: Mis-specification and Failed Migration of Facial Branchiomotor Neurons
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: DiI lineage tracing in the null embryo shows the r4-derived facial branchiomotor
            and contralateral vestibuloacoustic neurons differentiating but failing to migrate, which
            is the mechanism this node asserts.
          limitations: The model is a constitutive null, whereas most human alleles are missense substitutions
            in the homeodomain with residual, allele-specific DNA binding. Mouse facial branchiomotor
            migration from r4 into r5 is also a developmental event that cannot be observed in patients,
            so the human counterpart is inferred from the shared clinical endpoint.
          readouts:
          - name: DiI-traced position of r4-derived FBM and CVA neurons
            target: Mis-specification and Failed Migration of Facial Branchiomotor Neurons
            direction: ALTERED
            interpretation: Neurons are present but mislocated, distinguishing a migration defect from
              a neurogenesis defect.
      selected_evidence:
        snippet: The resulting phenotype includes bilateral facial palsy, hearing loss, and strabismus
          and correlates extensively with the previously reported Hoxb1(-/-) mouse phenotype.
        supports: SUPPORT
