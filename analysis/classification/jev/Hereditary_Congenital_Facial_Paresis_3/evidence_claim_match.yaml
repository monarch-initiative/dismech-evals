        biological_scale: MOLECULAR
        description: Biallelic HOXB1 variants abolish or degrade the transcriptional activity of the HOXB1
          homeodomain. Reported missense alleles all replace an arginine in the homeodomain, and the recurrent
          Arg207 corresponds to homeodomain Arg5, which contacts thymine in the DNA minor groove within
          the HOXB1:PBX1:DNA ternary complex. A homozygous nonsense allele produces the same disease,
          which is what identifies the mechanism as loss of function.
        gene:
          preferred_term: HOXB1
          modifier: LOSS_OF_FUNCTION
          term:
            id: hgnc:5111
            label: HOXB1
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: DECREASED
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
      selected_evidence:
        snippet: Molecular modeling and an in vitro DNA-protein binding assay predict that the mutation
          would disrupt these interactions, destabilize the HOXB1:PBX1:DNA complex, and alter HOXB1 transcriptional
          activity.
        supports: SUPPORT
