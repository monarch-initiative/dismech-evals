            label: rhombomere development
        - preferred_term: anterior/posterior pattern specification
          modifier: ABNORMAL
          term:
            id: GO:0009952
            label: anterior/posterior pattern specification
      selected_evidence:
        snippet: Retinoic acid (RA) generated by Raldh2 in paraxial mesoderm is required for specification
          of the posterior hindbrain, including restriction of Hoxb1 expression to presumptive rhombomere
          4 (r4).
        supports: SUPPORT
        directness: INDIRECT
