        kind: KNOWLEDGE_GAP
        prompt: Why does esodeviation occur in HCFP3 when HOXB1 acts in rhombomere 4 and the ocular motor
          nuclei do not derive from it?
        attaches_to:
        - phenotypes#Esotropia
        rationale: Esodeviation is reported in 44% of published cases, which is too frequent to dismiss,
          yet the r4 lineage does not supply the abducens or oculomotor nuclei. Either mutant HOXB1 isoforms
          act outside r4, or the deviation is a secondary consequence of the facial and orbital phenotype.
          The published suggestion is the former, and it is explicitly speculative.
      selected_evidence:
        snippet: This prompts speculation that certain mutant isoforms of HOXB1 may influence other cranial
          nerves.
        supports: SUPPORT
