        description: 'An emerging, preclinical microglia-replacement strategy. Transplantation of human
          iPSC-derived microglial (iMG) progenitors into a microglia-deficient (Csf1r FIRE-enhancer-deleted)
          ALSP mouse model restores a homeostatic microglial signature and prevents axonal spheroids,
          white-matter abnormalities, reactive astrocytosis, and brain calcifications. CRISPR-corrected
          ALSP-patient-derived iMG can reverse pre-existing pathology, supporting iMG transplantation
          as a candidate disease-modifying therapy. Not yet in human use.

          '
