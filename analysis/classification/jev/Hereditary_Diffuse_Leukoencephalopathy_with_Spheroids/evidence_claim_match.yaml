      assertion_type: Pathophysiology
      assertion:
        name: White Matter Degeneration with Axonal Spheroids
        description: 'As a primary microgliopathy, microglial dysfunction from impaired CSF1R signaling
          drives white-matter neurodegeneration. Pathology shows primary axonopathy followed by demyelination,
          with characteristic axonal spheroids and pigmented glia in affected cerebral white matter. In
          the Csf1r+/- mouse model, microgliosis and microglial transcriptomic alterations indicative
          of oxidative stress and demyelination are central, with elevated cerebral CSF-2 (GM-CSF) signaling
          implicated; monoallelic CSF2 deletion rescues most deficits, and elevated CSF2 is confirmed
          in human ALSP brains.

          '
        cell_types:
        - preferred_term: microglial cell
