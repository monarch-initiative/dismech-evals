          and white matter demyelination.

          '
        distinguishing_features:
        - Autosomal recessive inheritance due to biallelic AARS2 variants rather than autosomal dominant
          CSF1R variants
        - Earlier age at onset (typically third decade of life) and association with premature ovarian
          failure in affected females
        - More prominent brainstem and deep gray matter tract involvement on brain MRI
      selected_evidence:
        snippet: 'While the histological hallmark of neuraxial degeneration with spheroids is common to
          the three disorders: AARS2 leukoencephalopathy, CSF1R related HDLS/ALSP, and HDLS-S (with the
          latter two expected to be most closely related), some differences have been observed, including
          an earlier age of onset of leukodystrophy (third decade of life) in addition to ovarian failure
          associated to AARS2 mutations'
        supports: SUPPORT
