      assertion:
        name: Impaired Microglial CSF1R Signaling
        description: 'CSF1R encodes the colony-stimulating factor 1 receptor, a receptor tyrosine kinase
          expressed predominantly on microglia. Disease-causing variants cluster in the intracellular
          tyrosine kinase domain and abolish CSF-1-stimulated receptor autophosphorylation, producing
          loss of kinase activity via haploinsufficiency or dominant-negative inhibition of wild-type
          receptor dimers. Because CSF1R is the primary regulator of microglial proliferation, survival,
          and differentiation, impaired CSF1R signaling initiates a primary microgliopathy.

          '
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
