            term:
              id: MONDO:0800027
              label: leukoencephalopathy, diffuse hereditary, with spheroids 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Microglial CSF1R Signaling
        description: 'CSF1R encodes the colony-stimulating factor 1 receptor, a receptor tyrosine kinase
          expressed predominantly on microglia. Disease-causing variants cluster in the tyrosine kinase
          domain and impair CSF-1-stimulated receptor autophosphorylation, producing partial loss of CSF1R
          function (haploinsufficiency). Because CSF1R is a crucial mediator of microglial proliferation,
          survival, and differentiation, impaired signaling causes microglial dysfunction that initiates
          the disease.

          '
        cell_types:
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: macrophage colony-stimulating factor signaling pathway
          term:
            id: GO:0038145
            label: macrophage colony-stimulating factor signaling pathway
          modifier: DECREASED
        molecular_functions:
        - preferred_term: macrophage colony-stimulating factor receptor activity
          term:
            id: GO:0005011
            label: macrophage colony-stimulating factor receptor activity
          modifier: DECREASED
      selected_evidence:
        snippet: In vitro, CSF-1 stimulation resulted in rapid autophosphorylation of selected tyrosine
          residues in the kinase domain of wild-type but not mutant CSF1R, suggesting that HDLS may result
          from partial loss of CSF1R function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
