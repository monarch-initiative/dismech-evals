      assertion_type: Pathophysiology
      assertion:
        name: SAO Band 3 Over-Association and Increased Membrane Rigidity
        description: The Southeast Asian ovalocytosis arm of this entry does not run through the horizontal
          membrane-skeleton chain above. The SAO allele of SLC4A1 deletes nine residues at the junction
          of the cytoplasmic and transmembrane domains of band 3; the mutant protein forms higher-order
          oligomers and binds the underlying skeleton more tightly than wild-type band 3. The mechanical
          consequence is an over-stiffened membrane, which is the opposite direction of change from the
          weakened spectrin and protein 4.1R linkages that produce the other subtypes, even though both
          routes reduce deformability and both end in an abnormally shaped red cell.
        genes:
        - preferred_term: SLC4A1
          term:
            id: hgnc:11027
            label: SLC4A1
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: band 3 homooligomerization
          modifier: INCREASED
          term:
            id: GO:0051260
            label: protein homooligomerization
        molecular_functions:
        - preferred_term: structural constituent of cytoskeleton
          modifier: ABNORMAL
          term:
            id: GO:0005200
            label: structural constituent of cytoskeleton
      selected_evidence:
        snippet: SAO band 3 is believed to form higher oligomers and associate with the underlying erythrocyte
          cytoskeleton more readily than wild type band 3, offering an explanation for the observed increase
          in membrane rigidity in these cells
        supports: SUPPORT
