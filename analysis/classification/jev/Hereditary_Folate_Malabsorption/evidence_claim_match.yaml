      assertion_type: DifferentialDiagnosis
      assertion:
        name: Severe combined immunodeficiency
        description: Infants with HFM can present with Pneumocystis pneumonia, hypogammaglobulinemia and
          absent lymphocyte proliferation and be mistaken for SCID. Normal lymphocyte subsets and recent
          thymic emigrants, undetectable serum and CSF folate, and megaloblastic anemia point to HFM,
          whose immune defect reverses with folinic acid.
      selected_evidence:
        snippet: the absolute number and distribution of lymphocyte subsets, including naïve T cells and
          recent thymic emigrants, were normal, arguing against primary SCID
        supports: SUPPORT
