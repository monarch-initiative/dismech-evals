  b7f83cbe8665f1d8631f05e0e176543c38c4381a3bea50d37c6ad525aa0783e6:
    claim:
      about:
        disease:
          name: Hereditary Folate Malabsorption
          disease_term:
            preferred_term: hereditary folate malabsorption
            term:
              id: MONDO:0009238
              label: hereditary folate malabsorption
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC46A1
        gene_term:
          preferred_term: SLC46A1
          term:
            id: hgnc:30521
            label: SLC46A1
        association: Disease-causing
        relationship_type: CAUSATIVE
        notes: Biallelic loss-of-function variants in SLC46A1 (PCFT, formerly reported as heme carrier
          protein HCP1). The GC-rich first extracellular loop (c.194-c.204, p.65-68) is a recurrent mutational
          site. Founder or recurrent alleles include the Puerto Rican intron 2 splice-acceptor variant
          and a deep-intronic Japanese variant.
        variants:
        - name: c.1082-1G>A (p.Tyr362_Gly389del), Puerto Rican founder variant
          description: Splice-acceptor variant at the intron 2/exon 3 boundary causing exon 3 skipping;
            the skipped transcript does not traffic to the cell membrane. Homozygous in all Puerto Rican
            patients tested.
        - name: c.194dupG (p.Cys66LeufsX99)
          description: Frameshift duplication at a mononucleotide repeat in exon 1, within the GC-rich
            first extracellular loop that is a recurrent mutational site (reported as c.194-195insG in
            Chinese patients). First described homozygous in a consanguineous Pakistani family.
        - name: c.1166-285T>G, deep intronic Japanese variant
          description: Deep intronic variant creating a cryptic splice donor and a 168-bp pseudo-exon
            insertion with premature termination; shared by four unrelated Japanese patients and hard
            to detect with standard testing.
      selected_evidence:
        snippet: We demonstrate that a loss-of-function mutation in this gene is the molecular basis for
          hereditary folate malabsorption in a family with this disease.
        supports: SUPPORT
    origin:
