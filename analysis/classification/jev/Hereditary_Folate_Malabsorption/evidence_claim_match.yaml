  ec104733937e508dcbc74f0a76bd65f3354778d87d5957b8484d40fbc7181c99:
    claim:
      about:
        disease:
          name: Hereditary Folate Malabsorption
          disease_term:
            preferred_term: hereditary folate malabsorption
            term:
              id: MONDO:0009238
              label: hereditary folate malabsorption
        context: []
      assertion_type: Treatment
      assertion:
        name: Parenteral high-dose folinic acid (leucovorin)
        description: 'Disease-specific therapy is high-dose 5-formyltetrahydrofolate (folinic acid, leucovorin),
          preferably intramuscular and ideally the active isomer (levoleucovorin, levofolinic acid), started
          as early as possible and titrated to bring CSF folate trough concentrations as close as possible
          to the age-specific normal range. Small doses correct the anemia, immune defect and gastrointestinal
          signs; much higher doses are needed for adequate CSF folate, and in a direct comparison only
          intramuscular (not oral) dosing normalized it. Folic acid should be avoided, because it binds
          folate receptor alpha very tightly and may impair physiological folate transport across the
          choroid plexus. Early treatment can allow normal development: one woman treated from two months
          of age was normal into adulthood and completed higher education. Affected women should be on
          their full folinic acid regimen well before conception; infants of mothers with HFM have not
          shown an increased risk of neural tube defects.'
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: folinic acid
            term:
              id: CHEBI:15640
              label: 5-formyltetrahydrofolic acid
        target_phenotypes:
        - preferred_term: Megaloblastic anemia
          term:
            id: HP:0001889
            label: Megaloblastic anemia
        - preferred_term: Combined immunodeficiency
          term:
            id: HP:0005387
            label: Combined immunodeficiency
        - preferred_term: Seizure
          term:
            id: HP:0001250
            label: Seizure
      selected_evidence:
        snippet: Early treatment with high-dose intramuscular or, if that is not possible, oral 5-formyltetrahydrofolate
          (5-formylTHF; also known as folinic acid or leucovorin) or, preferably, the active isomer of
          5-formylTHF (levoleucovorin) readily corrects the systemic folate deficiency
        supports: SUPPORT
    origin:
