      assertion:
        name: Megaloblastic Ineffective Hematopoiesis
        description: Folate-starved marrow precursors cannot complete DNA synthesis. Erythroid precursors
          fail to differentiate and undergo apoptosis, producing a megaloblastic marrow and macrocytic
          (sometimes normocytic) anemia, and the same defect in the myeloid and megakaryocytic lineages
          produces leukopenia and thrombocytopenia.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
        biological_processes:
        - preferred_term: erythrocyte differentiation
          modifier: DECREASED
          term:
            id: GO:0030218
            label: erythrocyte differentiation
      selected_evidence:
        snippet: Immature erythroblasts accumulated in the bone marrow and spleen of PCFT(-/-) mice and
          failed to differentiate further, showing an increased rate of apoptosis in intermediate erythroblasts
          and reduced release of reticulocytes.
        supports: SUPPORT
