        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Folate Transport Across the Choroid Plexus
        description: The choroid plexus normally transports folate uphill into the CSF, keeping CSF folate
          two to three times higher than blood. PCFT is required for this transport together with folate
          receptor alpha; in cell models PCFT exports folate from acidified endosomes after FRalpha-mediated
          endocytosis, which would explain why loss of either protein blocks the pathway at the neutral
          pH of the choroid plexus. In HFM CSF folate stays extremely low even after blood folate is normalized
          with parenteral folate.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: choroid plexus epithelial cell
          term:
            id: CL:0000706
            label: choroid plexus epithelial cell
        locations:
        - preferred_term: choroid plexus
          term:
            id: UBERON:0001886
            label: choroid plexus
        biological_processes:
        - preferred_term: folate transmembrane transport
          modifier: DECREASED
          term:
            id: GO:0098838
            label: folate transmembrane transport
      selected_evidence:
        snippet: However, even when the blood folate level is corrected in this way, the CSF folate level
          remains very low and the normal, at least 2–3 fold CSF:blood folate concentration ratio, cannot
          be achieved.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
