        description: 'miR-335-3p is downregulated in HGF gingival fibroblasts and in TGF-beta-stimulated
          normal gingival fibroblasts. This microRNA directly targets and represses several core profibrotic
          hubs - SOS1 (the HGF1/RAS-MAPK driver), SMAD2/3 (TGF-beta signaling), and CTNNB1 (Wnt/beta-catenin)
          - so its loss derepresses the convergent profibrotic program. Restoring miR-335-3p attenuates,
          and knocking it down promotes, the fibrogenic activity of human gingival fibroblasts, nominating
          it as a candidate antifibrotic target.

          '
