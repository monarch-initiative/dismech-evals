  5305c3e46fce0ea1a04d00f0c463338220c877959989c32d4cdcc1bb0978491d:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia
          disease_term:
            preferred_term: Hereditary Hemorrhagic Telangiectasia
            term:
              id: MONDO:0019180
              label: hereditary hemorrhagic telangiectasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht_genetically_unexplained_suspected_disease
        prompt: What accounts for clinically suspected HHT in which no pathogenic variant is found in
          ENG, ACVRL1, SMAD4, or GDF2, and how should such patients be modeled relative to genotype-confirmed
          HHT?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired BMP/TGF-beta Signaling in Vascular Endothelium
        - pathophysiology#Vascular Shunting Through Visceral AVMs
        rationale: 'Molecular confirmation exceeds 90% among patients meeting three or more Curaçao criteria,
          but roughly 4-10% of clinically definite cases and up to 15% of the broader tested population
          have no identifiable variant. Two non-exclusive explanations are on the table: lower pretest
          probability in patients who do not meet full clinical criteria, so that some negatives are true
          negatives; and pathogenic variants in as-yet-unidentified genes acting in the same BMP/TGF-beta
          pathway. The KB currently models HHT entirely through the four known genes, so a genotype-negative
          but phenotype-typical patient has no representation. Note that the HHT4 locus at 7p14, curated
          in the separate Hereditary_Hemorrhagic_Telangiectasia_4 entry, is a worked example of exactly
          such an unidentified-gene entity.'
        proposed_experiments:
        - experiment_id: exp_hht_genotype_negative_cohort_sequencing
          name: Genome sequencing of a genotype-negative suspected-HHT cohort
          description: Recruit patients meeting two or more Curaçao criteria whose ENG, ACVRL1, SMAD4,
            and GDF2 panel is negative, and apply exome or genome sequencing with structural-variant and
