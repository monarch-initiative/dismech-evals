      assertion_type: Pathophysiology
      assertion:
        name: Somatic Second-Hit Mutation and AVM Formation
        description: 'While germline haploinsufficiency underlies HHT, focal lesion formation follows
          a two-hit model analogous to tumor suppressor genes. Somatic second-hit loss-of-function mutations
          in ENG or ACVRL1 have been identified in telangiectasias and solid organ AVMs, leading to biallelic
          loss. This explains the focal nature of vascular lesions despite systemic haploinsufficiency
          and why only specific vascular beds develop AVMs.

          '
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: This is the first report that nasal telangiectasias and solid organ AVMs in HHT are caused
          by very-low-level somatic biallelic second-hit mutations.
        supports: SUPPORT
