        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hepatic Vascular Steal and Biliary Ischemia
        biological_scale: TISSUE
        description: 'Hepatic artery-to-hepatic vein and hepatic artery-to-portal vein shunting through
          liver vascular malformations diverts arterial inflow away from the peribiliary arterial plexus.
          Because the intrahepatic bile ducts are supplied exclusively by the hepatic artery, this vascular
          steal produces biliary ischemia, and can progress to biliary necrosis, biloma formation, and
          secondary sclerosing cholangitis. The resulting cholangiopathy is vascular rather than fibrotic
          in origin, so hepatic parenchymal stiffness and synthetic function may remain normal until advanced
          secondary biliary cirrhosis supervenes.

          '
        cell_types:
        - preferred_term: cholangiocyte
          term:
            id: CL:1000488
            label: cholangiocyte
        locations:
        - preferred_term: intrahepatic bile duct
          term:
            id: UBERON:0003704
            label: intrahepatic bile duct
        notes: 'Evidence for this node currently rests on a single case report that summarizes the vascular-steal
          mechanism from the hepatology literature it cites. The mechanism itself is well described for
          HHT liver vascular malformations, but the supporting citation here is low-tier; a primary hepatology
          series should be substituted when one is curated.

          '
      selected_evidence:
        snippet: This can lead to biliary necrosis, biloma formation (which may become infected), and
          secondary sclerosing cholangitis
        supports: SUPPORT
