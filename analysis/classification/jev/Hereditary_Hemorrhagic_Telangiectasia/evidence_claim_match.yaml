      assertion_type: Discussion
      assertion:
        discussion_id: hht_large_artery_involvement_spectrum
        prompt: Do large-artery lesions such as aortic dissection and mesenteric arterial occlusion belong
          to the HHT phenotypic spectrum, or do they indicate a separate vasculopathy co-occurring with,
          or mimicking, HHT?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Vascular Shunting Through Visceral AVMs
        - phenotypes#Hepatic Arteriovenous Malformation
        rationale: HHT is modeled here as a disease of telangiectases and arteriovenous malformations,
          not of large conduit arteries. A reported patient with pulmonary and intrahepatic AVMs also
          had a chronic type B aortic dissection and occlusion of two proximal superior mesenteric artery
          branches, with negative HHT and connective-tissue-disorder panels including vascular Ehlers-Danlos
          syndrome. Whether such large-artery disease reflects an unrecognized arm of BMP/TGF-beta vascular
          dysplasia or an independent process is unresolved, and the KB deliberately does not curate aortic
          dissection or mesenteric arterial occlusion as HHT phenotypes on this evidence.
        notes: 'Single-case evidence. This is recorded as an open question, not as a phenotype extension;
          one case cannot establish a disease-phenotype association, and the same patient had no molecular
          confirmation of HHT.

          '
      selected_evidence:
        snippet: This case is notable for the coexistence of extensive arterial anomalies, including chronic
          type B aortic dissection and large mesenteric arterial occlusions, features not typically associated
          with HHT
        supports: SUPPORT
