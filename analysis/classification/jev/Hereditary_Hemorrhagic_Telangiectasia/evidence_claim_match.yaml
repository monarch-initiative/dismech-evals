              label: hereditary hemorrhagic telangiectasia
        context: []
      assertion_type: Definition
      assertion:
        name: Curaçao clinical diagnostic criteria framework
        definition_type: DIAGNOSTIC_CRITERIA
        description: 'Clinical diagnosis uses the Curaçao criteria: recurrent spontaneous epistaxis, characteristic
          mucocutaneous telangiectases, visceral AVMs, and an affected first-degree relative. Three criteria
          establish definite HHT and two support possible HHT.

          '
        scope: Clinical diagnosis of suspected hereditary hemorrhagic telangiectasia
        notes: 'The Curaçao framework classifies a patient meeting only one criterion as unlikely to have
          HHT. That threshold is calibrated on the classic mucocutaneous-plus-visceral presentation, and
          a patient whose only qualifying feature is visceral AVM disease can be scored as unlikely while
          still being clinically suspected; see the discussions block for the open question this raises.

          '
      selected_evidence:
        snippet: Diagnosing HHT can be done through genetic testing or by the use of the clinical Curaçao
          Criteria framework.
        supports: SUPPORT
