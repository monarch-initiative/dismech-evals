  1a6dee796cc2f396e7150099b4716b510505ec67503b2ad6b53ea921a1fc7939:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 4
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 4
            term:
              id: MONDO:0012532
              label: hereditary hemorrhagic telangiectasia type 4
        context: []
      assertion_type: Genetic
      assertion:
        name: HHT4 linkage locus (7p14)
        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'HHT4 is defined by a linkage interval, not by a gene. Whole-genome linkage analysis and
          fine mapping in the index family placed the disease interval in a 7 Mb region of 7p14 between
          markers D7S2252 and D7S510, with a maximum two-point LOD score of 3.60 at D7S817. No causal
          gene or variant within this interval has been reported. This block is deliberately curated WITHOUT
          a gene_term. Do not populate a gene here unless a causal gene inside 7p14 is established for
          THIS entity in primary literature and reconciled with the MONDO/OMIM record. In particular:
          ENG (9q34, HHT1), ACVRL1 (12q13, HHT2), SMAD4 (18q21, juvenile polyposis/HHT overlap) and GDF2
          (10q11, HHT5) are genes of OTHER HHT entities and were excluded by linkage or are outside the
          mapped interval; and the HHT3 locus is on chromosome 5, not chromosome 7 - see the hht4_not_hht3_chromosome_confusion
          discussion.'
      selected_evidence:
        snippet: Whole genome linkage analysis and fine mapping results suggested a 7 Mb region on the
          short arm of chromosome 7 (7p14) between STR markers D7S2252 and D7S510.
        supports: SUPPORT
    origin:
