        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Unidentified 7p14 Disease Allele
        - genetic#HHT4 linkage locus (7p14)
        rationale: 'HHT4 is one of two members of the HHT numbered series (with HHT3) that remain defined
          by a chromosomal region rather than a gene. The MONDO record for MONDO:0012532 carries no definition
          text and no RO:0004003 causal-gene relationship, and the anchoring linkage study explicitly
          leaves gene identification to future work. No subsequent publication has reported a gene for
          this entity as of a dated PubMed sweep on 2026-08-18; the most recent corroboration is a 2019
          national series (PMID:31455059) that names HHT4 testing as an unmet need rather than an available
          assay. Until a gene is established, every downstream node in this entry is an observation about
          a phenotype rather than a molecular pathway, and the endothelial BMP/TGF-beta account that explains
          ENG- and ACVRL1-related HHT cannot be transferred here: it is exactly the mechanism the linkage
