        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Multisystem Vascular Dysplasia
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'The family mapping to 7p14 expresses the classic HHT lesion set - a hereditary,
          multisystem vascular dysplasia comprising mucocutaneous telangiectases and larger arteriovenous
          malformations. This node is curated at the level of the observed lesion class. Whether the abnormal
          vessels arise through the endothelial BMP/TGF-beta route established for ENG- and ACVRL1-related
          HHT is unknown and is deliberately not asserted here: no molecular study of this family or of
          the 7p14 interval exists, and the linkage data exclude the two genes for which that mechanism
          was worked out.'
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: The features in this family that strongly suggest the presence of a hereditary, multisystem
          vascular dysplasia would be easily missed during the typical evaluation and management of a
          patient with an AVM.
        supports: SUPPORT
