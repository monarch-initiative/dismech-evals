          vessels arise through the endothelial BMP/TGF-beta route established for ENG- and ACVRL1-related
          HHT is unknown and is deliberately not asserted here: no molecular study of this family or of
          the 7p14 interval exists, and the linkage data exclude the two genes for which that mechanism
          was worked out.'
