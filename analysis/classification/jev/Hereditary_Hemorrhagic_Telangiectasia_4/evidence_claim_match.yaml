        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unidentified 7p14 Disease Allele
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: The proximal lesion is a germline variant segregating with disease within a 7 Mb
          interval on the short arm of chromosome 7 (7p14), between D7S2252 and D7S510. Neither the gene
          nor the variant class (coding, regulatory, structural) has been identified, so no molecular
          function, protein complex, or biological process can be assigned to this node. It is modelled
          explicitly as an unresolved trigger so that the downstream vascular phenotype is not attributed
          to a fabricated molecular cause - in particular, not to the BMP/TGF-beta co-receptor biology
          established for ENG and ACVRL1, which was excluded by linkage in this family.
      selected_evidence:
        snippet: Further studies of the candidate region and the identification of the gene responsible
          for the vascular anomalies in this family will add to our understanding of vascular morphogenesis
          and related disorders.
        supports: SUPPORT
