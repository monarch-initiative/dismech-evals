            term:
              id: MONDO:0012532
              label: hereditary hemorrhagic telangiectasia type 4
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical diagnosis by the Curacao criteria
        diagnosis_term:
          preferred_term: Diagnostic Procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        description: 'Because HHT4 has no gene, clinical criteria are not one route to diagnosis but the
          only route. A proband is diagnosed on the Curacao criteria - recurrent epistaxis, mucocutaneous
          telangiectases in characteristic sites, visceral AVMs, and an affected first-degree relative
          - and assigned to HHT4 only by exclusion, in a family in which the known HHT genes have been
          ruled out and linkage points to 7p14. The attenuated phenotype of the index family makes this
          harder than in typical HHT: nosebleeds were mild and infrequent and telangiectases subtle, so
          a criterion-counting evaluation that does not actively solicit them can fall short of a definite
          diagnosis.'
        results: At least three Curacao criteria establish a definite clinical diagnosis of HHT. Assignment
          to HHT4 specifically requires a family in which ENG, ACVRL1 and SMAD4 have been excluded; there
          is no confirmatory molecular test.
        notes: The Curacao criteria themselves are parent-disease generic; nothing in them is HHT4-specific.
          What is HHT4-specific is that they cannot be supplemented by a molecular test.
      selected_evidence:
        snippet: 'The clinical diagnosis of HHT can be established in a proband with at least three of
          the following diagnostic criteria: recurrent epistaxis; mucocutaneous telangiectases in characteristic
          locations; visceral AVMs; a first-degree relative diagnosed with HHT on the basis of the preceding
          criteria.'
        supports: SUPPORT
