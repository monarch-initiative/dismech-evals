      assertion_type: Prevalence
      assertion:
        population: Worldwide published cases
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No population prevalence estimate exists for HHT4. The published evidence base is a single
          family reported in 2006; a dated PubMed sweep on 2026-08-18 (see the Deep research paragraph
          in `notes`) found no second family mapped to 7p14 since, and because no gene has been identified
          there is no molecular test by which unrelated HHT patients could be assigned to this locus.
          The approximately 1 in 5,000 prevalence quoted for HHT as a whole belongs to the parent disease
          and must not be transferred to this entity.
      selected_evidence:
        snippet: Here we report on linkage results on a family with classic features of HHT, albeit a
          less severe phenotype with regards to epistaxis and telangiectases, in which linkage to HHT1,
          HHT2, and HHT3 is ruled out.
        supports: SUPPORT
