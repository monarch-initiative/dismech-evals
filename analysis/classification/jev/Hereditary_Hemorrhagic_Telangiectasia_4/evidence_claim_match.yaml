        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht4_entity_rests_on_a_single_family
        prompt: Is HHT4 a replicable disease entity, or a single-family linkage result that has not been
          independently confirmed?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Unidentified 7p14 Disease Allele
        rationale: The entire evidence base for HHT4 is one family reported in 2006 with a maximum two-point
          LOD score of 3.60. No second family mapped to 7p14, no gene, and no genotype-phenotype series
          have been published since. A two-point LOD of 3.60 clears the classical significance threshold,
          and the interval was corroborated by haplotype analysis, so the result is not weak on its own
          terms - but a single pedigree cannot distinguish a true novel locus from a chance linkage peak,
          and the absence of replication over nearly two decades is itself informative. Curators should
          treat this entry as a faithful record of one linkage study rather than as an established disease
          mechanism, and should not report HHT4 prevalence, penetrance, or genotype-phenotype correlation.
      selected_evidence:
        snippet: We obtained a maximum two point LOD score of 3.60 with the STR marker D7S817.
        supports: SUPPORT
