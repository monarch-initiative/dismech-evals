              label: hereditary hemorrhagic telangiectasia type 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht4_not_hht3_chromosome_confusion
        prompt: Should chromosome 5q31.3-q32 content be curated against HHT4?
        kind: INTERPRETATION
        status: RESOLVED
        attaches_to:
        - genetic#HHT4 linkage locus (7p14)
        rationale: No. The 5q31.3-q32 region is the HHT3 locus (OMIM:601101, MONDO:0011186), mapped by
          Cole and colleagues in 2005; HHT4 (OMIM:610655, MONDO:0012532) is on chromosome 7p14. The two
          are adjacent members of a numbered series, both are locus-defined with no causal gene, and both
          are usually mentioned in the same sentence of a review, which makes them an easy pair to transpose
          - and a transposition is undetectable by the usual anti-hallucination checks, because the citations
          and quotes for the wrong locus are perfectly real. The index HHT4 family was explicitly tested
          for and excluded from HHT3 linkage, so 5q content is not merely off-topic here, it is contradicted.
          This discussion is recorded as RESOLVED because the primary literature settles it unambiguously;
          it is kept rather than dropped so the confusion is documented and rejected instead of being
          silently re-introduced.
        resolution_note: HHT3 = chromosome 5 (PMID:15994879); HHT4 = chromosome 7p14 (PMID:16969873);
          linkage to HHT3 was ruled out in the HHT4 family. Curate only 7p14 content against this entry.
      selected_evidence:
        snippet: Two point LOD scores and recombination mapping identified a 5.4 cM HHT3 disease gene
          interval on chromosome 5 in which a single haplotype was inherited by all affected members of
          the pedigree.
        supports: SUPPORT
