  8bf1cb48f90a3b63aa6399648f37ae9ae21cca198e1f5ea249bd5df75cc28a22:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 5
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 5
            term:
              id: MONDO:0014217
              label: telangiectasia, hereditary hemorrhagic, type 5
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht5_is_it_hht
        prompt: Is GDF2-related disease a type of hereditary hemorrhagic telangiectasia, or a distinct
          HHT-like vascular anomaly syndrome that the numbered series has absorbed by analogy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - disease#Hereditary Hemorrhagic Telangiectasia Type 5
        - pathophysiology#Arteriovenous Malformation and Telangiectasia Formation
        - phenotypes#Cutaneous Telangiectasia
        rationale: 'OMIM and MONDO both carry this entity as HHT type 5, and it sits in this knowledge
          base as a member of the HHT series. The primary literature is much less settled. The founding
          report named it a vascular-anomaly syndrome with phenotypic overlap with HHT and observed that
          the dermal lesions looked like those of RASA1-related capillary malformation-AVM syndrome rather
          than HHT telangiectases. The largest phenotyping study concluded that no reported patient met
          the Curacao criteria and that the entity seems distinct from HHT in the location and appearance
          of the telangiectases and in a tendency to tiny diffuse pulmonary AVMs. Against that, one family
          with a heterozygous GDF2 variant had nosebleeds, telangiectasia its authors called typical of
          HHT, and severe pulmonary AVMs, and its authors proposed GDF2 as a rare cause of HHT. The GeneReviews
          HHT chapter, updated in 2026, still restricts molecular diagnosis of HHT to ACVRL1, ENG and
          SMAD4. The question is not cosmetic: it determines whether HHT screening and surveillance protocols
          - brain MRI, hepatic imaging, five-yearly pulmonary shunt screening - should be applied to GDF2
          carriers, and the diffuse untreatable pulmonary lesions reported here suggest the pulmonary
          protocol at least does not transfer cleanly.

          A 2026 founder cohort sharpens the question from the other end: 13 GDF2 patients in whom absence
          of HHT manifestations was a consistent feature. They are evidence that a GDF2 genotype can produce
          disease with no HHT phenotype at all, which argues for treating GDF2 disease as a spectrum whose
          HHT end is one presentation among several rather than as a subtype of HHT that some patients
          express incompletely.'
        proposed_experiments:
        - experiment_id: hht5_systematic_phenotyping_cohort
          name: Protocol-driven HHT phenotyping of an assembled GDF2 variant cohort
          description: 'Assemble the reported GDF2 families and any newly ascertained ones and apply the
            full HHT diagnostic and screening protocol uniformly: Curacao criterion scoring by an HHT
            centre, contrast echocardiography and chest CT for pulmonary shunting, brain MRI, hepatic
            Doppler, and standardised photographic documentation of telangiectasis site and morphology.
            Ascertainment so far has been by case report, so the apparent distinctiveness of the lesion
            distribution may be an artefact of who was looked at and how.'
          decision_criterion: A cohort in which a substantial fraction meet the Curacao criteria and show
            the HHT organ-lesion distribution would support keeping GDF2 inside HHT; one that reproduces
            the atypical cutaneous distribution and the absence of hepatic and cerebral AVMs would support
            a separate entity.
          would_support:
          - phenotypes#Cutaneous Telangiectasia
          supporting_outcome:
          - A majority of GDF2 carriers score three or more Curacao criteria, with lip, oral and fingerpad
            telangiectases and visceral AVMs in the HHT distribution.
          refuting_outcome:
          - GDF2 carriers consistently show cheek and chin spider-like lesions, sparing lips and oral
            cavity, with pulmonary lesions but no hepatic or cerebral AVMs.
      selected_evidence:
        snippet: In summary, none of the patients previously reported with GDF2 variants met Curaçao criteria
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
