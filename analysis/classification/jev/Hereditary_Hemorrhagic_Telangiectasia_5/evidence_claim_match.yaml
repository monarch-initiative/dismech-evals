        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide published cases
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No population prevalence estimate exists for HHT5, and none should be inferred from the
          parent disease. The published base is a handful of families: three unrelated heterozygous probands
          identified out of 191 gene-negative individuals clinically suspected of HHT, one further heterozygous
          family, and a small number of homozygous children. In the largest systematic search, whole-genome
          sequencing of 160 HHT participants from 126 families in the 100,000 Genomes Project identified
          GDF2 variants in exactly one family, which places an upper bound on how much of the gene-negative
          HHT population this entity can explain.

          A 2026 founder cohort reports 13 further GDF2 patients, which is larger than the entire prior
          HHT5 literature - but they are counted separately here and not added to the HHT5 proband total,
          because absence of HHT manifestations was a consistent feature in that cohort and they were
          characterised as non-syndromic pulmonary arterial hypertension. They enlarge the GDF2 disease
          case base substantially while leaving the count of published HHT5 probands where it was. Which
          of the two counts is the right denominator depends on the unresolved question in the hht5_is_it_hht
          discussion.'
      selected_evidence:
        snippet: However, lack of HHT manifestations was a consistent clinical feature.
        supports: SUPPORT
