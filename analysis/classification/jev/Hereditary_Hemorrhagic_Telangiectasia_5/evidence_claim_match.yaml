        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht5_zebrafish_morphant_mutant
        prompt: Does loss of BMP9 alone cause a vascular phenotype in zebrafish, given that morpholino
          knockdown and germline mutation of bmp9 gave opposite answers?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Zebrafish
        - pathophysiology#Loss of Endothelial Quiescence and Enhanced Angiogenic Response
        rationale: 'The founding HHT5 paper supported its mechanism with a bmp9-deficient zebrafish showing
          that BMP9 is involved in angiogenesis; that was a morpholino knockdown. A later study generating
          germline bmp9 mutants found they survive to adulthood with no overt phenotype, and that the
          vascular phenotype requires losing the duplicate BMP10 paralogs instead. The two results are
          not reconcilable as stated, and the direction of the discrepancy matters: the morphant is the
          one that supports the human mechanism, and it is the less reliable of the two designs. This
          is recorded as a HUMAN_MODEL_MISMATCH rather than a knowledge gap because the evidence exists
          in the model and it is the translational reading that is in doubt - and because the redundancy
          the mutant reveals may be the correct answer for humans too, explaining why heterozygous GDF2
          carriers are so often unaffected while biallelic carriers, who lose circulating BMP10 as well,
          are the ones who present.'
        proposed_experiments:
        - experiment_id: hht5_bmp10_reserve_in_carriers
          name: Residual BMP10 as a penetrance modifier in human GDF2 carriers
          description: Measure circulating BMP10 alongside BMP9 and serum endothelial BMP activity in
            clinically affected and clinically unaffected human GDF2 carriers, and test whether BMP10
            reserve separates them. The zebrafish redundancy model predicts that it should.
          decision_criterion: If unaffected heterozygous carriers have preserved circulating BMP10 while
            affected carriers do not, the redundancy explanation transfers to humans and the mutant, not
            the morphant, is the informative model.
          would_support:
          - pathophysiology#Loss of Circulating BMP9 and BMP10
          supporting_outcome:
          - Circulating BMP10 is preserved in clinically unaffected GDF2 carriers and reduced in affected
            ones, independent of BMP9 level.
          refuting_outcome:
          - Circulating BMP10 does not differ between affected and unaffected GDF2 carriers.
      selected_evidence:
        snippet: bmp9 mutants survive to adulthood with no overt phenotype. In contrast, combined loss
          of bmp10 and bmp10-like results in embryonic lethal cranial AVMs indistinguishable from acvrl1
          mutants.
        supports: SUPPORT
