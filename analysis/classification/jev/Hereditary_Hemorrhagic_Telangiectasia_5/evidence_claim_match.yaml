          name: Hereditary Hemorrhagic Telangiectasia Type 5
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 5
            term:
              id: MONDO:0014217
              label: telangiectasia, hereditary hemorrhagic, type 5
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pulmonary Arterial Vascular Remodeling
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'A branch of the same ligand deficiency, reached by a different vascular response.
          Rather than shunting, the pulmonary arterioles narrow and occlude, raising pulmonary vascular
          resistance and loading the right ventricle. Two of the reported homozygous GDF2 children took
          this route: one presented at age 3 with severe pulmonary arterial hypertension and a dilated
          right ventricle and no evidence of a pulmonary shunt. Why the same lesion produces shunting
          AVMs in one child and obliterative arteriopathy in another is unexplained and is recorded as
          a knowledge gap.'
        cell_types:
        - preferred_term: vascular endothelial cell
          term:
            id: CL:0002139
            label: endothelial cell of vascular tree
      selected_evidence:
        snippet: Genetic screening revealed a novel homozygous nonsense mutation in the BMP9 gene (c.76C
          > T; p.Gln26Ter). The child had no telangiectasias or arteriovenous malformations; family history
          also was negative.
        supports: SUPPORT
    origin:
