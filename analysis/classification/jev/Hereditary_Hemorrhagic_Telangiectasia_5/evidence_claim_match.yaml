      assertion_type: Pathophysiology
      assertion:
        name: GDF2 Variant Blocks BMP9 Proprotein Cleavage and Secretion
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'BMP9 is synthesised as a precursor consisting of a prodomain and a C-terminal growth-factor
          domain, cleaved by furin-type proprotein convertases so that the prodomain remains non-covalently
          bound to the mature dimer. The two functionally characterised HHT5 missense alleles do not abolish
          expression of the precursor; they block this maturation step. Cells transfected with the p.Cys428Arg
          construct expressed the proprotein but secreted no mature BMP9 dimer, and conditioned medium
          from the mutant failed to induce the BMP target genes ID1 and pre-miR-21 in endothelial cells.
          The truncating alleles act earlier and more completely: p.Gln26Ter protein could be translated
          from an internal methionine but was neither processed nor secreted.'
        genetic_context:
          gene:
            preferred_term: GDF2
            term:
              id: hgnc:4217
              label: GDF2
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Germline GDF2 missense and truncating alleles; the characterised missense alleles
            impair proprotein processing rather than transcription.
        molecular_functions:
        - preferred_term: BMP receptor binding (mature BMP9 growth-factor domain)
          term:
            id: GO:0070700
            label: BMP receptor binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: BMP9 proprotein processing
          term:
            id: GO:0016485
            label: protein processing
          modifier: DECREASED
        cell_types:
        - preferred_term: hepatocyte (principal site of BMP9 synthesis)
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Analyses of the variant proteins suggested that mutations negatively affect protein processing
          and/or function
        supports: SUPPORT
