          type: nonsense
          clinical_significance: PATHOGENIC
          description: Homozygous nonsense allele in a consanguineous family; the child had multiple tiny
            pulmonary AVMs, facial telangiectases and hypoxaemia, with undetectable plasma BMP9 and pBMP10.
            Both parents were heterozygous and clinically unaffected.
