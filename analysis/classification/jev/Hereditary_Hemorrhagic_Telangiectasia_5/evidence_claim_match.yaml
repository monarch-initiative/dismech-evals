              label: telangiectasia, hereditary hemorrhagic, type 5
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht5_avm_versus_pah_branch
        prompt: Why does the same loss of circulating BMP9 produce shunting pulmonary arteriovenous malformations
          in some children and obliterative pulmonary arterial hypertension in others?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Pulmonary Arterial Vascular Remodeling
        - pathophysiology#Arteriovenous Malformation and Telangiectasia Formation
        - phenotypes#Pulmonary Arterial Hypertension
        rationale: 'The two pulmonary outcomes are opposite vascular behaviours - abnormal dilated low-resistance
          connections in one, narrowing and occlusion with raised resistance in the other - and both follow
          biallelic GDF2 nonsense alleles. They are not sequential: the index PAH child had no AVMs and
          a negative bubble study, and the child with multiple small PAVMs had a mean pulmonary artery
          pressure of 10 mmHg. Nor is the split explained by allele position, since both are nonsense
          alleles in the same gene producing the same undetectable circulating BMP9. Candidate explanations
          include modifier genotype, differences in residual BMP10 signalling, and a second-hit or flow-dependent
          local trigger, but none has been tested in GDF2 disease. This is the entity''s sharpest mechanistic
          question because it is the one point where an identical molecular lesion demonstrably produces
          divergent pathology.'
        proposed_experiments:
        - experiment_id: hht5_genotype_modifier_search
          name: Modifier and residual-signalling analysis across the GDF2 branch split
          description: In an assembled GDF2 cohort split by pulmonary outcome, compare residual circulating
            BMP10 and serum endothelial BMP activity, and sequence the wider ALK1/endoglin/BMPR2 pathway
            for co-occurring variants, testing whether the AVM and PAH branches separate on any of these.
          decision_criterion: A systematic difference in residual BMP10 or in pathway co-variants between
            the two branches would identify the modifier axis; no difference would point instead to stochastic
            or local flow-dependent determination.
          would_support:
          - pathophysiology#Pulmonary Arterial Vascular Remodeling
          supporting_outcome:
          - PAH-branch patients show lower residual BMP10 or carry additional BMPR2-pathway variants relative
            to AVM-branch patients.
          refuting_outcome:
          - Residual BMP10 and pathway co-variant burden are indistinguishable between the two branches.
      selected_evidence:
        snippet: Identification of homozygous GDF2 pLOF variants in three children with severe PAH raises
          the possibility of semi-dominant inheritance
        supports: SUPPORT
