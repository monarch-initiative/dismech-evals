      assertion_type: Diagnosis
      assertion:
        name: Plasma BMP9 measurement
        diagnosis_term:
          preferred_term: Laboratory Procedure
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        description: 'An entity-specific functional assay with no counterpart in HHT1 or HHT2: because
          the lesion is loss of a circulating ligand, it can be measured directly in plasma by ELISA.
          Biallelic carriers have undetectable BMP9 and reduced BMP10; the heterozygous processing-defective
          family had significantly reduced but detectable levels. Serum-derived endothelial BMP activity,
          assayed on a BMP-responsive endothelial reporter line, tracks the same lesion functionally.
          Treat this as a research assay: it is not standardised, not a clinical test, and heterozygous
          carriers can have normal serum activity despite reduced ligand levels.'
        results: Undetectable plasma BMP9 and low pBMP10 in homozygotes, with low serum-derived endothelial
          BMP activity; significantly reduced plasma BMP9 in the heterozygous family; reduced levels but
          normal serum activity in asymptomatic heterozygous parents.
      selected_evidence:
        snippet: Plasma samples were assayed for BMP9 and BMP10 by ELISA. In parallel, serum BMP activity
          was assayed using an endothelial BRE-luciferase reporter cell line (HMEC1-BRE).
        supports: SUPPORT
