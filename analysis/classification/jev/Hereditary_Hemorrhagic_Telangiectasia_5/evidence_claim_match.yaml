        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht5_bmp9_replacement
        prompt: Would BMP9 or BMP9/BMP10 ligand replacement correct the vascular phenotype in GDF2-deficient
          patients, as the ligand-deficiency mechanism predicts?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Circulating BMP9 and BMP10
        - treatments#
        rationale: 'HHT5 is the only member of the HHT series in which the missing molecule is a circulating
          ligand rather than a cell-surface receptor or an intracellular effector. That makes it the one
          member for which straightforward replacement is even conceptually available, and the plasma
          assay gives a direct pharmacodynamic readout. Nothing of the kind has been attempted: the treatments
          recorded in this entry are an mTOR inhibitor in one child and conventional PAH vasodilators,
          neither of which addresses the ligand deficiency. The gap is worth recording precisely because
          the mechanism is so unusually tractable relative to the rest of the series.'
        proposed_experiments:
        - experiment_id: hht5_ligand_replacement_preclinical
          name: Ligand replacement in a BMP9-deficient model with plasma pharmacodynamics
          description: In a Gdf2-null model, administer recombinant BMP9 or BMP9/BMP10 and follow both
            the vascular phenotype and the serum endothelial BMP activity readout used in patients, establishing
            whether restoring circulating ligand reverses or prevents the vascular lesion and what plasma
            level is needed.
          decision_criterion: Reversal or prevention of the vascular phenotype at achievable plasma levels
            would justify a first-in-human study in biallelic GDF2 patients, who have no circulating ligand
            at all and are therefore the cleanest possible test population.
          would_support:
          - pathophysiology#Loss of Circulating BMP9 and BMP10
          supporting_outcome:
          - Vascular lesions regress or fail to form, with serum endothelial BMP activity restored toward
            the control range.
          refuting_outcome:
          - Restored circulating ligand normalises the serum activity readout without changing the vascular
            phenotype.
      selected_evidence:
        snippet: This review will focus on the emerging role played by BMP9 and BMP10 in the development
          of this disease and the therapeutic approaches that this opens.
        supports: SUPPORT
