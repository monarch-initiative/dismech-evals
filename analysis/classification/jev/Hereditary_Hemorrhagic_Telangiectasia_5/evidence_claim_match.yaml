            species: Mouse
            genotype: Wild-type neonate, lactationally exposed to anti-BMP9/BMP10 blocking antibodies
            publication: PMID:27874028
            description: 'A ligand-depletion rather than a genotype model: blocking antibodies against
              BMP9 and BMP10 are injected into lactating dams and reach the pups through milk, depleting
              circulating ligand during postnatal retinal angiogenesis. This is the closest available
              experimental analogue of the HHT5 lesion, because HHT5 is itself a circulating-ligand deficiency,
              and it is the only model in this entry that positively reproduces the human vascular lesion
              - the two zebrafish entries are a negative result and a transient knockdown.'
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: Arteriovenous Malformation and Telangiectasia Formation
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: Ligand blockade produces hypervascularization, failure of arteriovenous specification,
              and multiple large arteriovenous malformations in the neonatal retina.
            limitations: 'Acute antibody-mediated depletion of both BMP9 and BMP10 in a neonate is not
              a germline GDF2 variant: it removes both ligands rather than one, acts over days rather
              than a lifetime, and is read out in the retina, which is not a site of human HHT5 disease.
              It therefore models the consequence of losing circulating ligand, not the natural history
              of the human disease. Note that the biallelic human cases lose circulating BMP10 as well
              as BMP9, which is the state this dual blockade most closely resembles.'
          role: ancestor
