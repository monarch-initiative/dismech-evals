        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Circulating BMP9 and BMP10
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        description: BMP9 is secreted principally by the liver and circulates in plasma; BMP10 levels
          track it closely, partly through circulating BMP9/BMP10 heterodimers. In children homozygous
          for GDF2 nonsense alleles, plasma BMP9 and BMP10 were both undetectable and serum-derived endothelial
          BMP activity was correspondingly low. In the heterozygous classic-HHT family, circulating BMP9
          was significantly reduced rather than absent. This node is the systemic step that makes HHT5
          a ligand-deficiency disease, in contrast to the receptor and co-receptor haploinsufficiencies
          of HHT2 and HHT1, and it is the reason plasma BMP9 is a candidate biomarker for this entity
          specifically.
        biological_processes:
        - preferred_term: BMP signaling pathway (ligand availability)
          term:
            id: GO:0030509
            label: BMP signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: As expected, there was no detectable circulating BMP9 in the homozygotes, while the heterozygotes
          had circulating levels below those of healthy controls, suggesting haplosufficiency.
        supports: SUPPORT
