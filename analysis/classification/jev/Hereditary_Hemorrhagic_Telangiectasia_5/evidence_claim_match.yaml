        target: Arteriovenous Malformation and Telangiectasia Formation
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Complete germline loss of bmp9 does not produce arteriovenous malformations in this
          organism.
        limitations: Zebrafish carry duplicate BMP10 paralogs (bmp10 and bmp10-like) that cover for bmp9
          loss, so the negative result is a statement about ligand redundancy in this species rather than
          evidence that BMP9 is dispensable in humans. Human biallelic GDF2 patients lose circulating
          BMP10 as well as BMP9, a state this single-gene mutant does not model. Note also that this mutant
          result contradicts the earlier bmp9 morpholino knockdown reported in the founding HHT5 paper
          - see the hht5_zebrafish_morphant_mutant discussion.
      selected_evidence:
        snippet: bmp9 mutants survive to adulthood with no overt phenotype. In contrast, combined loss
