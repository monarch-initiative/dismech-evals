            label: TOR signaling
          modifier: INCREASED
        - preferred_term: vascular endothelial growth factor receptor signaling pathway
          term:
            id: GO:0048010
            label: vascular endothelial growth factor receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: these results suggest that BMP-9 is a physiological ALK1 ligand that plays an important
          role in the regulation of angiogenesis
        supports: SUPPORT
