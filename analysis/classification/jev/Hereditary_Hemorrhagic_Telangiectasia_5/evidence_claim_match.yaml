      assertion_type: Phenotype
      assertion:
        category: Vascular
        name: Facial Telangiectasia
        description: 'The characteristic HHT5 cutaneous distribution, and the point on which the entity
          most clearly departs from HHT: spider-like and linear lesions on the cheeks and chin, sparing
          the lips and oral cavity that the Curacao criteria name.'
        phenotype_term:
          preferred_term: Facial telangiectasia
          term:
            id: HP:0007380
            label: Facial telangiectasia
        frequency: FREQUENT
        notes: This phenotype is a subset of Cutaneous Telangiectasia, which is why its frequency band
          is the lower of the two. Cutaneous telangiectasia of some distribution is reported in essentially
          every GDF2 patient described; the specific cheek-and-chin facial pattern is reported in the
          homozygous cases and is one of at least three distributions in the literature, alongside the
          HHT-typical lip and face pattern of the heterozygous classic-HHT family and the upper-forelimb,
          trunk and head pattern of the four-proband cohort. The two entries are kept separate because
          that distribution is the feature on which the entity most clearly departs from HHT, and collapsing
          it into the generic term would lose it.
      selected_evidence:
        snippet: Multiple spider‐like and linear telangiectases were noted on the cheeks and chin, but
          not the lips or oral cavity.
        supports: SUPPORT
