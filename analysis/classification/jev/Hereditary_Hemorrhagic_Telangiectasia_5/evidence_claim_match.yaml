        variant_origin: GERMLINE
        gene_term:
          preferred_term: GDF2
          term:
            id: hgnc:4217
            label: GDF2
        variants:
        - name: GDF2 p.Arg333Trp
          type: missense
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          description: One of the three heterozygous missense substitutions in the founding report. Population-scale
            sequencing later found it at 0.1% of control chromosomes, which is far too common for a cause
            of an ultra-rare disorder, and its pathogenicity is now uncertain. Do not cite it as an established
            pathogenic HHT5 allele.
