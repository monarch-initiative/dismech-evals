        snippet: Dominant variants in GDF2 are known to cause hereditary hemorrhagic telangiectasia type
          5 (HHT5), a condition characterized by telangiectases and arteriovenous malformations (AVMs).
          More recently, recessive variants in GDF2 have been reported to cause pulmonary arterial hypertension
          (PAH) with or without features of HHT5.
        supports: SUPPORT
