          therefore converges on exactly the pathway that ACVRL1 (ALK1, HHT2), ENG (endoglin, HHT1) and
          SMAD4 variants disrupt at the receptor, co-receptor and effector levels - which is the mechanistic
          reason a ligand disease sits inside the HHT series at all.
