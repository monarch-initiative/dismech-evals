      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing of GDF2
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: 'HHT5 is a molecularly defined entity, so molecular testing is not a confirmation
          of a clinical diagnosis but the diagnosis itself. In every published case the route was the
          same: a patient with an HHT-like or unexplained pulmonary vascular phenotype, negative for ACVRL1,
          ENG and SMAD4, in whom exome or whole-genome sequencing found a GDF2 variant. This ordering
          matters because most reported patients would not be diagnosed clinically - they do not meet
          the Curacao criteria, and GDF2 is absent from the gene list on which the GeneReviews HHT chapter
          bases molecular diagnosis of HHT.'
        results: 'A pathogenic heterozygous or biallelic GDF2 variant in a patient with telangiectases,
          pulmonary AVMs or unexplained paediatric pulmonary arterial hypertension. Interpretation requires
          care: one founding allele (p.Arg333Trp) reaches 0.1% in controls and is no longer confidently
          pathogenic.'
      selected_evidence:
        snippet: The molecular diagnosis is established by identification of a heterozygous pathogenic
          variant in ACVRL1, ENG, or SMAD4 by molecular genetic testing.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
