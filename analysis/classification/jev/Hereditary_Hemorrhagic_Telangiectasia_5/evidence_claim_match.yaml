        - inheritance#Autosomal recessive inheritance
        rationale: 'OMIM catalogues HHT5 as dominant, on the strength of the founding heterozygous probands
          and one segregating family. But the biallelic case base is now at least as large, and its heterozygous
          parents were repeatedly examined and found unaffected. The functional data cut the same way:
          in the p.Glu279Ter family, heterozygotes had reduced circulating BMP9 and BMP10 yet normal serum
          endothelial BMP activity, which the authors read as haplosufficiency. A coherent reading is
          that truncating alleles are recessive because one wild-type allele supplies enough ligand, while
          processing-defective missense alleles such as p.Cys428Arg may act dominantly, and the retraction
          in confidence for p.Arg333Trp removes one of the three original dominant data points.

          That reading now has partial support, and it splits the phenotype rather than only the inheritance
          mode. A 2026 founder-cohort paper states the division explicitly - dominant GDF2 variants cause
          HHT5, recessive variants cause pulmonary arterial hypertension with or without HHT5 features
          - and reports 13 patients with a semi-dominant founder allele in whom absence of HHT manifestations
          was consistent. The allele-class hypothesis is therefore no longer untested: the field has begun
          to formalise it, and the direction it points is that allele dose selects between two phenotypes,
          not merely between two penetrances. What remains untested is the specific functional prediction
          below - that heterozygous truncating carriers retain normal endothelial BMP activity while heterozygous
          missense carriers do not - and whether the split survives outside a single founder haplotype.
          Getting this wrong has direct consequences for recurrence-risk counselling.'
        proposed_experiments:
        - experiment_id: hht5_allele_class_dose_response
          name: Allele-class-stratified BMP9 dose-response in carriers
          description: Measure plasma BMP9, plasma pBMP10 and serum-derived endothelial BMP activity in
            heterozygous carriers stratified by allele class (truncating versus processing-defective missense),
            alongside biallelic carriers and matched controls, and relate each to protocol-based clinical
            phenotyping.
          decision_criterion: If heterozygous missense carriers show reduced serum endothelial BMP activity
            while heterozygous truncating carriers do not, the allele-class model is supported and the
            two inheritance blocks in this entry describe genuinely different genetic mechanisms rather
            than a single unresolved one.
          would_support:
          - inheritance#Autosomal recessive inheritance
          supporting_outcome:
          - Serum endothelial BMP activity is normal in heterozygous truncating carriers and reduced in
            heterozygous missense carriers, tracking their clinical status.
          refuting_outcome:
          - Serum BMP activity is normal in both heterozygous groups, or reduced in both, with no relationship
            to clinical phenotype.
