  b5df8ac638217669a5f853d5e5e87d31b38737b75ff393db54f8842d902a8ce3:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 5
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 5
            term:
              id: MONDO:0014217
              label: telangiectasia, hereditary hemorrhagic, type 5
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: A separate and larger part of the GDF2 case base is biallelic. Children homozygous
          for GDF2 nonsense or frameshift alleles - p.Gln26Ter, p.Glu279Ter, p.Tyr354ArgfsTer15 - have
          presented with pulmonary AVMs and facial telangiectases or with paediatric pulmonary arterial
          hypertension, while their obligate heterozygous parents were clinically unaffected on directed
          examination. Functionally, the homozygotes have undetectable circulating BMP9 whereas heterozygotes
          retain normal serum endothelial BMP activity despite reduced levels, which is a haplosufficiency
          argument against simple dominance for these alleles. Whether HHT5 is best described as dominant,
          recessive, or semi-dominant with allele-dependent behaviour is the entity's central unresolved
          genetic question.
        penetrance: INCOMPLETE
        expressivity: VARIABLE
      selected_evidence:
        snippet: Collectively, these data show that homozygous GDF2 mutations, leading to a loss of circulating
          BMP9 and BMP10, can cause either pediatric PAH and/or "HHT-like" telangiectases and PAVMs.
        supports: SUPPORT
    origin:
