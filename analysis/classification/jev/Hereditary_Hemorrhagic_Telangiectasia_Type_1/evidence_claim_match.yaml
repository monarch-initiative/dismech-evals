        notes: 'Derived, not directly measured. No population survey reports a prevalence for ENG-related
          HHT1 as such, so this record combines two separately cited facts: the occurrence of HHT as a
          whole, and the ENG share of molecularly solved cases, which is roughly half. The arithmetic
          joining them is this entry''s.

