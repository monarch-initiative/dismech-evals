          quoted figure of 1 in 5,000 (20 per 100,000) halves to 10 per 100,000. A Swedish national-register
          study instead measured HHT at 9.3 per 100,000, which halves to about 4.7; those authors attribute
          the shortfall to underdiagnosis of milder cases. The honest answer is the interval between the
          two rather than either endpoint, so the estimate is bounded by ascertainment rather than precise.'
      selected_evidence:
        snippet: Hereditary Hemorrhagic Telangiectasia (HHT) is an autosomal dominant inherited vascular
          malformation disorder that occurs in 1 in 5000 individuals
