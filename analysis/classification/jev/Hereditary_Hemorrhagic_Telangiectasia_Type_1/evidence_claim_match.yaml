        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht1_modifier_genes
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which modifier genes account for the variable expressivity of HHT1 among relatives who
          carry the same ENG variant?
        attaches_to:
        - pathophysiology#Endoglin Haploinsufficiency in Vascular Endothelium
        - genetic#ENG
        rationale: Severity of epistaxis and the number and location of lesions vary markedly even within
          a family sharing one ENG variant, and the Eng+/- mouse shows the same effect as a strain-background
          dependence, which is direct evidence that modifiers exist. The mouse work names 129/Ola as a
          permissive background but does not identify the responsible loci, and no human modifier has
          been established. Resolving this would matter clinically because it is the variability, not
          the genotype, that currently limits prediction of who will develop a pulmonary or cerebral AVM.
      selected_evidence:
        snippet: In this murine model of HHT, it appears that epigenetic factors and modifier genes, some
          of which are present in 129/Ola, contribute to disease heterogeneity.
        supports: SUPPORT
