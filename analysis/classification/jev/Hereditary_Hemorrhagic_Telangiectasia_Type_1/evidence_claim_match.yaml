        description: The defining lesion of HHT is an arteriovenous malformation that lacks intervening
          capillaries, so an artery drains directly into a vein. Small lesions of this kind are the mucocutaneous
          telangiectases; large ones are the visceral AVMs. Both the fragility that causes bleeding and
          the shunt physiology that causes the neurological complications follow from this single architectural
          change.
