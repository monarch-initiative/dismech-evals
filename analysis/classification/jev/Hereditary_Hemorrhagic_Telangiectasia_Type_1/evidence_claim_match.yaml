  820fa9616d9ffc4a1ed6b904662d9a9d2b1a80eb15d8053bd89f884999173347:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 1
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 1
            term:
              id: MONDO:0008535
              label: telangiectasia, hereditary hemorrhagic, type 1
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'HHT shortens life. A Swedish national-register cohort put life expectancy after age
          30 at 73.0 years against 80.5 in matched controls, and a questionnaire study of deceased patients
          found an average loss of 19 years of potential life. Which manifestations carry that mortality
          is not what the HHT1 lesion profile would predict: in a 1,286-patient prospective cohort the
          predictors were anemia, gastrointestinal bleeding and symptomatic liver vascular malformations,
          while brain vascular malformations and pulmonary AVMs - the two lesions that most distinguish
          HHT1 - were NOT associated with mortality. The authors attribute that to those two being routinely
          screened and treated preventatively at HHT centres, which is the argument for the surveillance
          records above rather than evidence that the lesions are benign.'
