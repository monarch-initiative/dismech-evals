        attaches_to:
        - treatments#Pomalidomide
        - treatments#Bevacizumab
        rationale: Every systemic therapy curated here was trialled in HHT patients selected by clinical
          diagnosis rather than by genotype. PATH-HHT enrolled on epistaxis severity and transfusion dependence
          and reports no ENG-versus-ACVRL1 subgroup. Since the two genotypes differ substantially in which
          organs are affected, a genotype-stratified analysis is a reasonable expectation that the literature
          does not yet supply, and treatment records in this entry should not be read as HHT1-specific
          efficacy claims.
      selected_evidence:
        snippet: A total of 159 patients will be randomized 2:1 to treatment with oral pomalidomide or
          matching placebo for 24 weeks.
