            term:
              id: MONDO:0008535
              label: telangiectasia, hereditary hemorrhagic, type 1
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mouse
        genotype: Eng heterozygous null (Eng+/-)
        background: Inbred 129/Ola and mixed C57BL/6-129/Ola
        description: 'Mice carrying one inactivated endoglin allele reproduce the haploinsufficient state
          of HHT1. Some heterozygotes develop telangiectases or recurrent nosebleeds, and the fact that
          only some do - and that this depends on strain background - is the model''s principal contribution:
          it demonstrates that modifier genes and epigenetic factors, not the ENG lesion alone, govern
          expressivity. Homozygous null embryos die at gestational day 10.0-10.5 with failed vascular
          plexus maturation and arrested heart development, defining the null phenotype against which
          haploinsufficiency is read.'
        publication: PMID:10562296
        genes:
        - preferred_term: ENG
          term:
            id: hgnc:3349
            label: ENG
        modeled_mechanisms:
        - target: Endoglin Haploinsufficiency in Vascular Endothelium
          relationship: RECAPITULATES
          fidelity: HIGH
          description: The model reproduces the exact molecular lesion of HHT1, a single inactivated endoglin
            allele.
        - target: Mucocutaneous Telangiectasia Formation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Telangiectases and recurrent nosebleeds appear in some heterozygotes, but not in
            all, and only on permissive genetic backgrounds.
          limitations: Penetrance is partial and strain-dependent, so the model cannot be used to estimate
            lesion frequency in human HHT1; and the paper reports telangiectases and nosebleeds without
            reporting the pulmonary and cerebral AVMs that most distinguish human HHT1.
        - target: Dysregulated Endothelial Angiogenic Response
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: 'The endoglin-null embryo shows the developmental extreme of the angiogenic defect:
            the primitive plexus fails to mature and the resulting channels dilate and rupture.'
          limitations: This readout comes from the homozygous null embryo, not from the heterozygote that
            models human HHT1, so it demonstrates endoglin's requirement in vessel maturation rather than
            the consequence of haploinsufficiency.
      selected_evidence:
        snippet: In this murine model of HHT, it appears that epigenetic factors and modifier genes, some
          of which are present in 129/Ola, contribute to disease heterogeneity.
        supports: SUPPORT
