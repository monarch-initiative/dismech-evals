        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht1_second_hit_organ_specificity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do somatic second hits in ENG produce pulmonary and cerebral AVMs preferentially in
          HHT1, when the germline lesion and the second-hit mechanism are present throughout the vasculature?
        attaches_to:
        - pathophysiology#Somatic Second-Hit Biallelic ENG Inactivation
        - pathophysiology#Pulmonary Arteriovenous Malformation Formation
        rationale: The second-hit model explains why lesions are focal, but not why HHT1 lesions favour
          lung and brain while ACVRL1-related HHT2 lesions favour liver. Both genes act in the same BMP9/ALK1/SMAD
          pathway, and second hits have now been demonstrated in both. The organ preference is therefore
          unexplained by the pathway model and by the second-hit model taken together, and no tissue-level
          determinant - flow environment, endothelial subtype, local BMP9 availability - has been established
          as the discriminating factor.
      selected_evidence:
        snippet: Patients with HHT harbor these heterozygous germline mutations in every cell of the body,
          yet vascular malformations occur in only a small minority of vessels, with predilection for
          specific anatomic locations.
        supports: SUPPORT
