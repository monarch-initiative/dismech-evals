        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic Second-Hit Biallelic ENG Inactivation
        biological_scale: MOLECULAR
        description: The germline variant is present in every cell, yet malformations form in only a small
          minority of vessels. A very-low-level somatic loss-of-function mutation on the second ENG allele
          within the lesional endothelium supplies the focal trigger. Loss of heterozygosity at ENG has
          been demonstrated in a brain AVM in which the germline and somatic loss-of-function mutations
          lay on different alleles. This node explains the focality and the intrafamilial variability
          that haploinsufficiency alone does not.
      selected_evidence:
        snippet: Here, we show that another mechanism for the second hit is loss of heterozygosity across
          the chromosome bearing the germline mutation.
        supports: SUPPORT
        directness: INDIRECT
