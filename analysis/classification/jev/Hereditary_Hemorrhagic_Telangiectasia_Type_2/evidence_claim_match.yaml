      assertion_type: Diagnosis
      assertion:
        name: Curacao clinical criteria
        description: 'Clinical diagnosis rests on four criteria - recurrent spontaneous epistaxis, mucocutaneous
          telangiectases in characteristic sites, visceral AVMs, and an affected first-degree relative
          - with three of four establishing a definite diagnosis. These criteria are genotype-blind, and
          they under-perform specifically in HHT2: because epistaxis and telangiectases appear later in
          ACVRL1 disease and epistaxis is incompletely penetrant, a young ACVRL1 carrier may not meet
          three criteria while carrying the variant.'
        presence: PRESENT
      selected_evidence:
        snippet: Epistaxis occurred later in HHT2, with incomplete penetrance (P<0.0001).
        supports: SUPPORT
