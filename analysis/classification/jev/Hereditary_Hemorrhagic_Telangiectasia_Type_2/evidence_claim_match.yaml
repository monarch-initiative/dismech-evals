      reference_title: Clinical and molecular genetic features of pulmonary hypertension in patients with
        hereditary hemorrhagic telangiectasia.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents that the same ACVRL1 mutations produce both a dilating and an occluding vascular
        lesion, which is what creates the ambiguity this discussion records.
