  cfe13416d1e761b5cda1e7a352e5f160f292833007d2e801b3fe97f486bd326a:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 2
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 2
            term:
              id: MONDO:0010880
              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht2_pulmonary_hypertension_two_mechanisms
        prompt: In an HHT2 patient with pulmonary hypertension, is the lesion the ACVRL1 pulmonary arteriopathy
          or the post-capillary consequence of a high-output hepatic shunt?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Occlusive Remodeling of Small Pulmonary Arteries
        - pathophysiology#Hyperdynamic Circulation with Elevated Cardiac Index
        - phenotypes#Pulmonary Arterial Hypertension
        rationale: 'ACVRL1 is the one HHT gene in which pulmonary hypertension has two mechanistically
          opposite routes. One is a pre-capillary arteriopathy in which small pulmonary arteries occlude,
          histologically indistinguishable from idiopathic pulmonary arterial hypertension - the mirror
          image of the vascular dilatation that defines HHT everywhere else in the body. The other is
          the elevated pulmonary pressure that follows the volume load of hepatic left-to-right shunting,
          which is the HHT2-predominant complication. The two coexist in the same genotype and are separated
          by right heart catheterisation rather than by genetics, and they diverge in management: the
          hepatic route responds to reducing the shunt burden, the arteriopathy does not. This entry models
          them as separate nodes deliberately so that the distinction is not collapsed into a single "pulmonary
          hypertension in HHT2" claim.'
      selected_evidence:
        snippet: These mutations are associated with diverse effects, including the vascular dilatation
          characteristic of hereditary hemorrhagic telangiectasia and the occlusion of small pulmonary
          arteries that is typical of primary pulmonary hypertension.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
