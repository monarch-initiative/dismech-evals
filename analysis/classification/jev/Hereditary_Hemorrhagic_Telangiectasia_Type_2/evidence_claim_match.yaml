  13e504281160f5ce65786b3b1204968f7bd44178bc5eb6032538184307a2eb06:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 2
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 2
            term:
              id: MONDO:0010880
              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Environmental
      assertion:
        name: Pregnancy
        description: Pregnancy is not a cause of HHT2 but is its best-characterised physiological trigger.
          The peripheral vasodilation and rise in cardiac output of pregnancy load an already-shunting
          circulation, and adverse events reported in HHT pregnancies include heart failure, pulmonary
          and intracranial haemorrhage, and stroke. This is why the guidelines screen and treat pulmonary
          and cerebral AVMs before or during pregnancy, and why sizable pulmonary AVMs found in pregnancy
          are treated in the second trimester. Complications cluster in the second and third trimesters,
          when the maternal haemodynamic changes are maximal.
        presence: PRESENT
        effect: Increases the risk of haemorrhagic and cardiovascular complications
      selected_evidence:
        snippet: Women with HHT considering pregnancy are screened and treated for pulmonary and cerebral
          AVMs; sizable pulmonary AVMs discovered during pregnancy are treated during the second trimester.
        supports: SUPPORT
