            term:
              id: MONDO:0010880
              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hepatic_alk1_dependence
        hypothesis_label: Hepatic endothelium is disproportionately ALK1-dependent because BMP9 is made
          in the liver
        status: EMERGING
        description: 'Why HHT2 is the hepatic form of HHT is not settled. Endoglin facilitates but is
          not strictly required for BMP9/BMP10 signalling through ALK1, so if the two proteins acted purely
          in series HHT1 and HHT2 should look alike, and they do not. One proposed explanation is regional
          ligand availability: BMP9 is produced in the liver, so hepatic endothelial cells sit in a high-ligand
          environment in which the ligand-capturing contribution of endoglin matters less and the signalling
          contribution of ALK1 matters more. Losing one ACVRL1 allele would then bite harder in the liver
          than losing one ENG allele does. An alternative, not mutually exclusive, account is that ENG
          and ALK1 recruit different partner proteins in different vascular beds. Both are hypotheses
          about the ligand/receptor economy of specific vascular beds; neither has been demonstrated in
          human hepatic tissue.'
      selected_evidence:
        snippet: In this latter context, high local BMP9 concentrations (BMP9 is made in the liver) could
          make hepatic ECs less dependent on ENG and more dependent on ALK1 activity.
        supports: SUPPORT
    origin:
