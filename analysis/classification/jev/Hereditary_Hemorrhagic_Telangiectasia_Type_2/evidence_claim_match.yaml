  a7afd4a68f83b3f49f220883d2bf16ad1523726a48ec6cfa241ca2f4ee201a4d:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 2
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 2
            term:
              id: MONDO:0010880
              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht2_treatment_evidence_not_genotype_stratified
        prompt: Do the HHT therapeutic trials support genotype-specific recommendations for HHT2, or only
          genotype-blind ones?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Pomalidomide
        - treatments#Systemic Bevacizumab
        - clinical_trials#NCT03910244
        rationale: 'The therapeutic evidence base for HHT is enrolled on phenotype, not genotype. The
          pomalidomide trial randomised on epistaxis severity and anaemia; the guideline recommendations
          are written for HHT as a whole. The one partial exception runs the other way and favours this
          entity: the bevacizumab trial selected patients with severe hepatic vascular malformations and
          high cardiac output, which is the HHT2-predominant presentation, without stating genotype. So
          the treatments recorded in this entry are ones with established efficacy in HHT that are applied
          to HHT2 patients. Reading any of them as an ACVRL1-specific recommendation would overstate what
          the trials tested. One signal does exist and it runs against this entity: a post-hoc analysis
          of PATH-HHT found ACVRL1 germline mutation among the characteristics associated with a less
          robust pomalidomide response, at P=0.06. A trend in a post-hoc analysis of a trial that did
          not randomise on genotype is not a basis for withholding an effective drug from HHT2 patients,
          and the entry does not treat it as one. It is recorded because it is the only genotype signal
          in HHT therapeutics and because the study that would settle it - a prospective genotype-stratified
          trial - has not been done.'
      selected_evidence:
        snippet: 'The recommendations highlight new evidence in existing topics from the first International
          HHT Guidelines and provide guidance in 3 new areas: anemia, pediatrics, and pregnancy and delivery.'
        supports: SUPPORT
        directness: INDIRECT
