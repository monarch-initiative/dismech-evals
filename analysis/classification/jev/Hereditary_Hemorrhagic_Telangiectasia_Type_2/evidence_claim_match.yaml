        context:
        - path: /environmental/0
          value:
            name: Pregnancy
            description: Pregnancy is not a cause of HHT2 but is its best-characterised physiological
              trigger. The peripheral vasodilation and rise in cardiac output of pregnancy load an already-shunting
              circulation, and adverse events reported in HHT pregnancies include heart failure, pulmonary
              and intracranial haemorrhage, and stroke. This is why the guidelines screen and treat pulmonary
              and cerebral AVMs before or during pregnancy, and why sizable pulmonary AVMs found in pregnancy
              are treated in the second trimester. Complications cluster in the second and third trimesters,
              when the maternal haemodynamic changes are maximal.
            presence: PRESENT
            effect: Increases the risk of haemorrhagic and cardiovascular complications
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Hyperdynamic Circulation with Elevated Cardiac Index
        environmental_effect: EXACERBATES
        causal_link_type: DIRECT
        description: The physiological rise in cardiac output and fall in systemic vascular resistance
          add to the volume load already imposed by hepatic shunting.
      selected_evidence:
        snippet: Such complications occur most often in the second and third trimesters when maternal
          changes such as peripheral vasodilation and increased cardiac output are at their maximum.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0/influences_mechanisms/0
