              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Prevalence
      assertion:
        population: gnomAD, All of Us and Regeneron Million Exome (ENG and ACVRL1 combined)
        measure_type: UNKNOWN
        prevalence_class: BAND_1_5_PER_10000
        rate_per_100000: 43.1
        notes: Genetic rather than clinical prevalence, and again for ENG plus ACVRL1 combined rather
          than for ACVRL1 alone. Population-database analysis puts pathogenic and likely-pathogenic carriage
          at 1.753-2.555 per 5,000 (35.1-51.1 per 100,000; the midpoint 43.1 is recorded here), rising
          to 2.874-4.327 per 5,000 if potentially pathogenic variants are included - so roughly twice
          the 1 in 5,000 clinical figure, which the authors read as underdiagnosis. `measure_type` is
          UNKNOWN because carriage of a pathogenic variant is neither a point prevalence of disease nor
          an incidence; it is a genotype frequency, and the schema has no measure for that.
        rate_low: 35.1
        rate_high: 51.1
      selected_evidence:
        snippet: The genetic prevalence of HHT ranged from 1.753 to 2.555 in 5000 individuals, when considering
          only pathogenic and likely pathogenic variants, and from 2.874 to 4.327 in 5000 individuals,
          when also potentially pathogenic variants were considered.
        supports: SUPPORT
