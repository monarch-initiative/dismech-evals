              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mucocutaneous Telangiectasis Formation
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: Small superficial arteriovenous connections in the nasal, oral, gastrointestinal
          and skin surfaces present as telangiectases. Because they deliver arterial pressure into thin-walled
          superficial vessels, mucosal telangiectases rupture readily; this, not the large AVMs, is the
