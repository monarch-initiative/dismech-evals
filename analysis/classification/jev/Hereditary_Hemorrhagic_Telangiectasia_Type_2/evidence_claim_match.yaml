            term:
              id: MONDO:0010880
              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Genetic
      assertion:
        name: ACVRL1
        gene_term:
          preferred_term: ACVRL1
          term:
            id: hgnc:175
            label: ACVRL1
        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        frequency: ACVRL1 and ENG together account for up to 90% of disease-causal variants in HHT; the
          ACVRL1 share of molecularly solved cases varies by cohort from roughly 45% to 68%.
        notes: ACVRL1 (12q13) encodes activin receptor-like kinase 1 (ALK1), a transmembrane serine/threonine
          kinase type I receptor expressed in vascular endothelium. Germline variants are heterozygous
          and loss-of-function; both truncating and missense classes occur, and reported variants cluster
          in the kinase-domain exons. Do not import ENG (9q34, HHT1), SMAD4 (18q21, juvenile polyposis/HHT
          overlap) or GDF2 (10q11) into this block - those genes define other HHT entities.
        case_fractions:
        - population: Spanish RiHHTa registry, patients with a genetic test
          case_fraction_percent: 68.1
          cohort_size: 113
          notes: ACVRL1 was the more common HHT genotype in this Spanish cohort, which is the reverse
            of the ENG-predominant series reported elsewhere.
        - population: US HHT families with a detected mutation (34 kindreds screened)
          case_fraction_percent: 46.0
          cohort_size: 26
          notes: Reported per kindred rather than per proband; 26 of 34 kindreds had a detected mutation,
            of which 46% were in ACVRL1.
        variants:
        - name: Truncating ACVRL1 variants
          clinical_significance: PATHOGENIC
          description: Nonsense and frameshift variants predicted to abolish receptor function. Within
            HHT2 they are associated with a higher frequency of epistaxis and telangiectasis than non-truncating
            variants.
        - name: Germline deletion of the entire ACVRL1 gene
          clinical_significance: PATHOGENIC
          description: Whole-gene deletion is a documented germline lesion in HHT2 and was the background
            in which lesion-specific somatic second hits were demonstrated.
      selected_evidence:
        snippet: It includes the activin receptor like kinase 1 gene (ACVRLK1 or ALK1), a member of the
          serine-threonine kinase receptor family expressed in endothelium.
        supports: SUPPORT
