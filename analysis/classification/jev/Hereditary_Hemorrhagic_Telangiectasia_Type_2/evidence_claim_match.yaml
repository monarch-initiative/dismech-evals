      assertion_type: Pathophysiology
      assertion:
        name: Failure of Arteriovenous Network Patterning
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: A direct connection forms between an artery and a vein with no intervening capillary
          bed. Blood preferentially takes this low-resistance channel, so the feeding artery and draining
          vein enlarge under haemodynamic load while the bypassed capillary plexus regresses. The vein
          receives blood at abnormally high pressure, which is why these lesions bleed. The same lesion
          at different calibre gives either a mucocutaneous telangiectasis or a visceral AVM.
        cell_types:
        - preferred_term: vascular endothelial cell
          term:
            id: CL:0000071
            label: blood vessel endothelial cell
        biological_processes:
        - preferred_term: blood vessel remodeling
          modifier: ABNORMAL
          term:
            id: GO:0001974
            label: blood vessel remodeling
        - preferred_term: artery morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0048844
            label: artery morphogenesis
      selected_evidence:
        snippet: Loss of the ENG (HHT1) or ALK1 (HHT2) gene in ECs leads to aberrant arteriovenous connections
          or malformations (AVMs) in developing blood vessels.
        supports: SUPPORT
