  d3aa8948802c398e1aaaa096f7e75412bccab6cf4e42e5f37853de240f5ae48f:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 2
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 2
            term:
              id: MONDO:0010880
              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Treatment
      assertion:
        name: Pomalidomide
        description: Oral immunomodulatory agent for refractory epistaxis and gastrointestinal bleeding.
          In a randomised placebo-controlled trial it reduced the Epistaxis Severity Score by 0.94 points
          more than placebo - above the 0.71-point threshold considered clinically significant - with
          neutropenia, constipation and rash as the excess adverse events. The trial was stopped early
          at a planned interim analysis for efficacy. It was not stratified by genotype, but a post-hoc
          response analysis found ACVRL1 germline mutation among the characteristics associated with a
          *less* robust response (+0.62 ESS points versus ENG, SMAD4 or unknown genotype). That is a trend
          at P=0.06, not a result - but it is the first genotype signal for treatment stratification in
          HHT, and it points the wrong way for this entity, so it is recorded here rather than left in
          the trial literature. An open-label extension followed 62 patients for up to 4.4 years and found
          the epistaxis benefit durable, while noting that pomalidomide was less effective for gastrointestinal
          bleeding - the bleeding compartment that is disproportionately HHT2's.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: pomalidomide
            term:
              id: CHEBI:72690
              label: pomalidomide
        target_phenotypes:
        - preferred_term: Recurrent epistaxis
          term:
            id: HP:0000421
            label: Epistaxis
      selected_evidence:
        snippet: At 24 weeks, the mean difference between the pomalidomide group and the placebo group
          in the change from baseline in the Epistaxis Severity Score was -0.94 points (95% confidence
          interval [CI], -1.57 to -0.31; P = 0.004).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
      context_paths:
      - /name
      - /disease_term
