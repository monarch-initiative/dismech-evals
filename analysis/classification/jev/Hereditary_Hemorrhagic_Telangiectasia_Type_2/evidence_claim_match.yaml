              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Endothelial Quiescence and Excess Angiogenic Drive
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: Two endothelial-cell-autonomous defects follow. First, endothelial cells normally
          polarise against the direction of blood flow and migrate upstream; without ALK1 signalling that
          shear-directed migration is lost and the cells stall. Second, the stalled cells keep proliferating
          - in part because BMP9/10 signalling normally restrains PI3K/AKT, so its loss increases endothelial
          proliferation and survival. The pathway also normally damps endothelial responses to VEGF, which
          is why anti-VEGF therapy is effective downstream. In adult vessels this only becomes visible
          when an angiogenic trigger is present. Two mechanisms have been resolved for how the brake is
          applied. ALK1-driven SMAD signalling cooperates with Notch in stalk cells to induce HEY1 and
          HEY2, which repress VEGF signalling, tip-cell formation and sprouting - so blocking Alk1 gives
          retinal hypervascularisation and AVMs, and activating it with BMP9 rescues hypersprouting caused
          by Notch inhibition. Separately, the pathway sets the fluid-shear-stress set point at which
          endothelium is stable; losing the downstream node SMAD4 lowers that set point and disinhibits
          flow-driven KLF4-TIE2-PI3K/Akt signalling, so cells proliferate and lose arterial identity under
          flow that would otherwise be quiescent.
        cell_types:
        - preferred_term: vascular endothelial cell
          term:
            id: CL:0000071
            label: blood vessel endothelial cell
        biological_processes:
        - preferred_term: endothelial cell proliferation
          modifier: INCREASED
          term:
            id: GO:0001935
            label: endothelial cell proliferation
        - preferred_term: shear-directed endothelial cell migration
          modifier: DYSREGULATED
          term:
            id: GO:0043534
            label: blood vessel endothelial cell migration
        - preferred_term: VEGF receptor signaling
          modifier: INCREASED
          term:
            id: GO:0048010
            label: vascular endothelial growth factor receptor signaling pathway
      selected_evidence:
        snippet: Thus in the absence of BMP9/10 signalling there is increased PI3K activity leading to
          increased EC proliferation and survival.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
