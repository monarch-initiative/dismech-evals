        description: 'CRISPR/Cas9-edited human induced pluripotent stem cell line heterozygous for a patient-derived
          ACVRL1 missense variant, on an isogenic background. It is the human counterpart of the mouse
          deletion models: heterozygous rather than biallelic, and carrying a specific disease allele
          rather than a null, so it matches the human germline state that the mouse models do not. The
          line is characterised for karyotype, pluripotency and trilineage differentiation but no vascular
          phenotype has been reported for it yet, so no modeled_mechanisms link is asserted - doing so
          would claim a result the report does not contain.'
      selected_evidence:
