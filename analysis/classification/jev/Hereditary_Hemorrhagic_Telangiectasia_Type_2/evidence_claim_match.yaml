  16617a63bee89ad27e753deaa8a660b196ab714adddfdcf3003fb9da09e51889:
    claim:
      about:
        disease:
          name: Hereditary Hemorrhagic Telangiectasia Type 2
          disease_term:
            preferred_term: hereditary hemorrhagic telangiectasia type 2
            term:
              id: MONDO:0010880
              label: telangiectasia, hereditary hemorrhagic, type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hht2_hepatic_tropism_unexplained
        prompt: Why does losing one ACVRL1 allele produce hepatic vascular malformations, while losing
          one ENG allele - in the same ligand-receptor complex - preferentially produces pulmonary and
          cerebral ones?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hepatic Arteriovenous Shunting
        - pathophysiology#Reduced Endothelial ALK1 Receptor Signaling
        - mechanistic_hypotheses#hepatic_alk1_dependence
        rationale: Endoglin and ALK1 act in the same BMP9/10 receptor complex, with endoglin facilitating
          rather than being strictly required for ALK1 signalling. On a simple series model HHT1 and HHT2
          should therefore differ in severity, not in organ distribution - and yet the organ distribution
          is exactly what separates them, reproducibly, across independent French-Italian, US and Spanish
          cohorts. The candidate explanations on offer are hypotheses about vascular-bed-specific ligand
          economy (BMP9 is made in the liver, so hepatic endothelium may lean on ALK1 rather than on endoglin
          for ligand capture) and about bed-specific interaction partners. Neither has been tested in
          human hepatic tissue, and neither predicts the reciprocal pulmonary and cerebral bias of HHT1.
          Until one is established, the genotype-phenotype correlation that drives HHT2 surveillance is
          an empirical regularity rather than a mechanism.
        proposed_experiments:
        - experiment_id: hht2_bed_specific_ligand_dependence
          name: Vascular-bed-resolved measurement of BMP9/BMP10 availability and ALK1 dependence
          description: In a conditional Acvrl1 or Eng endothelial-knockout model, quantify local BMP9
            and BMP10 concentration and phospho-SMAD1/5 output separately in hepatic, pulmonary and cerebral
            endothelium, and test whether AVM susceptibility per bed tracks the predicted ligand-availability
            gradient rather than tracking gene identity alone.
          decision_criterion: A hepatic bed in which Acvrl1 loss reduces phospho-SMAD1/5 markedly more
            than Eng loss does, matched to high local BMP9, would support the ligand-economy hypothesis;
            equal reduction in both genotypes would refute it and shift weight onto bed-specific interaction
            partners.
          would_support:
          - mechanistic_hypotheses#hepatic_alk1_dependence
          supporting_outcome:
          - Hepatic endothelium shows a selective loss of phospho-SMAD1/5 on Acvrl1 deletion relative
            to Eng deletion, in proportion to local BMP9.
          refuting_outcome:
          - Hepatic phospho-SMAD1/5 falls equally on Acvrl1 and Eng deletion, leaving the hepatic tropism
            of HHT2 unexplained by ligand availability.
      selected_evidence:
        snippet: However, this is not the case and there are clear genotype/phenotype correlations in
          HHT that are not understood.
        supports: SUPPORT
