        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance with age-related penetrance
        inheritance_term:
          preferred_term: autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'Penetrance is age-related and manifestation-specific: it is high for the syndrome
          as a whole by middle age, but individual features appear at different ages, and in HHT2 specifically
          even epistaxis - the earliest and most penetrant feature of HHT1 - is later in onset and incompletely
          penetrant. That makes clinical (Curacao) diagnosis unreliable in young ACVRL1 carriers and is
          the practical argument for molecular testing of at-risk relatives. Expressivity is highly variable
          both between and within families, with the organ distribution of lesions differing between relatives
          carrying the same ACVRL1 variant. Each child of an affected individual has a 50% chance of inheriting
          the pathogenic ACVRL1 variant. Homozygous or compound heterozygous germline loss of ACVRL1 is
          not observed as a viable human genotype; the germline state in HHT2 is heterozygous, with biallelic
          loss arising somatically within lesions.'
      selected_evidence:
        snippet: HHT is inherited in an autosomal dominant manner with considerable intrafamilial variability
          and age-related penetrance of individual manifestations.
        supports: SUPPORT
