            label: High-output congestive heart failure
        - preferred_term: Recurrent epistaxis
          term:
            id: HP:0000421
            label: Epistaxis
      selected_evidence:
        snippet: The most severe adverse events were 2 cases of grade 3 systemic hypertension, which were
