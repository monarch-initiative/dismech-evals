          a normal transferrin saturation and a normal total iron-binding capacity, in a patient with
          no inflammation, no liver disease, no malignancy and no heavy alcohol intake, is the laboratory
          signature. Recognising it is what makes liver biopsy unnecessary.
        presence: Present
