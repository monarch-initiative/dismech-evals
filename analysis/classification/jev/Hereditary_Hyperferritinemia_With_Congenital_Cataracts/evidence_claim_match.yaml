              label: hereditary hyperferritinemia with congenital cataracts
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Iatrogenic Iron Depletion from Misdirected Venesection and Chelation
        description: 'The commonest complication of HHCS is not caused by the disease. Because the ferritin
          elevation is generated by translation and not by stored iron, removing iron cannot correct it;
          what venesection does instead is strip a normal iron store from a patient who had one, producing
          iron deficiency and microcytic anaemia while the ferritin stays high. Iron chelation carries
          its own hazard: one 8.5-year-old treated with deferasirox on a mistaken diagnosis of iron overload
          developed life-threatening acute hyperammonaemia. Repeated liver biopsy for the same misdiagnosis
          is a further avoidable harm. This node is included in the pathograph because the harm is mechanistically
          predictable from the upstream biology, not because it is a property of the genotype.'
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: When unnecessary phlebotomies are performed, they rapidly develop iron-deficient anemia,
          with persistently elevated levels of serum ferritin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
      - /name
      - /disease_term
