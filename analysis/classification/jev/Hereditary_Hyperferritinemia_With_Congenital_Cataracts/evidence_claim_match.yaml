        snippet: Laboratory test showing hyperferritinaemia, normal serum iron and normal transferrin
          saturation are indicative for HHCS after exclusion of other causes of increased ferritin levels
          (inflammation, malignancy, alcoholic liver disease) and should prompt an ophthalmological consultation
          for diagnostic confirmation.
        supports: SUPPORT
