              id: MONDO:0010952
              label: hereditary hyperferritinemia with congenital cataracts
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hhcs_lens_tissue_selectivity
        kind: KNOWLEDGE_GAP
        prompt: Why is the lens the only tissue damaged by an L-ferritin excess that is present in every
          cell of the body?
        attaches_to:
        - pathophysiology#Lens Fibre Cell L-Ferritin Accumulation
        - pathophysiology#Crystalline L-Ferritin Deposition and Lens Light Scattering
        rationale: The derepression is constitutive and ubiquitous - lymphoblastoid cells from patients
          carry up to twenty-fold excess L-ferritin - yet the only organ that is injured is the lens.
          Three partial explanations are on the table and none has been tested against the others. FTL
          transcription is measurably higher in the lens than in neighbouring ocular tissue, so the same
          fractional derepression yields a larger absolute burden there. Lens fibre cells are post-mitotic,
          organelle-free and cannot dilute or degrade an accumulating protein, so a small chronic surplus
          integrates over decades. And Levi and colleagues proposed that L-ferritin specifically perturbs
          the solubility equilibrium of the crystallins or the lens antioxidant defences, which would
          make the injury a property of the lens proteome rather than of dose or kinetics. Distinguishing
          these matters practically, because only the third predicts that the crystallins are involved,
          and the entry's conformance to `cataract_lens_opacification` is deliberately declared around,
          not through, that module's crystallin-aggregation node for exactly this reason.
      selected_evidence:
        snippet: Although ferritin accumulates in all cell types of HHCS patients, it turns out to be
          toxic only in the crystallin-containing lens fiber cells.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29269865
      reference_title: Functional characterization of a novel non-coding mutation "Ghent +49A > G" in
