        name: Persistent Hyperferritinemia
        description: Lifelong elevation of serum ferritin, present from early life and usually found incidentally.
          Reported values in affected adults commonly run from a few hundred to well over 2,000 microgram/L;
          the original Verona family ranged from 950 to 2,259 microgram/L, and the seven British kindreds
          had a median of 1,420 microgram/L against a laboratory range of 15-360. Levels vary between
          and within families sharing an allele, and are not a reliable index of cataract severity in
          an individual.
        frequency: OBLIGATE
        diagnostic: true
