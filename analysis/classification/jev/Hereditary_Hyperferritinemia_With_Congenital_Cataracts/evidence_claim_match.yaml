        description: 'Lens fibre cells accumulate L-ferritin far in excess of any other tissue examined.
          Measured lens L-ferritin content in HHCS ranges from about ten-fold the control value in one
          extracted nucleus to roughly 1500-fold in two others, the spread reflecting different assays,
          cataract morphologies and ages at surgery. Two features of the lens plausibly explain why this
          is the one tissue that suffers: FTL transcription is unusually high there, and lens fibre cells
          are post-mitotic, organelle-free and protein-packed, with no way to dilute or turn over an accumulating
          protein. The tissue selectivity is nonetheless not formally resolved - see the knowledge gap
          recorded in `discussions`.'
