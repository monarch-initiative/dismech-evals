              label: hereditary hyperferritinemia with congenital cataracts
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hereditary haemochromatosis
        description: 'The diagnosis HHCS is most often mistaken for, and the reason the mistake matters:
          haemochromatosis is treated by venesection, which in HHCS is futile and harmful. The discriminator
          is transferrin saturation, which is raised in haemochromatosis and normal in HHCS, together
          with the absence of parenchymal iron on imaging. Note that an incidental HFE H63D heterozygote
          is common in European populations and has been found alongside a confirmed FTL IRE variant without
          affecting the ferritin or hepcidin, so an HFE result does not settle the question either way.'
        distinguishing_features:
        - Transferrin saturation is raised in hereditary haemochromatosis and normal in HHCS.
        - Parenchymal iron is increased in haemochromatosis and absent on liver MRI or biopsy in HHCS.
        - Venesection lowers ferritin in haemochromatosis; in HHCS it produces iron deficiency while the
          ferritin stays high.
        - Early bilateral cataract, and a family history of it, belong to HHCS and are not features of
          haemochromatosis.
      selected_evidence:
        snippet: Additional screening for common HFE variants revealed heterozygous H63D in several family
          members, with no impact on ferritin or hepcidin levels.
        supports: SUPPORT
