              label: hereditary hyperferritinemia with congenital cataracts
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Crystalline L-Ferritin Deposition and Lens Light Scattering
        description: The excess L-ferritin comes out of solution as discrete crystalline inclusions within
          the lens substance. Immunohistochemistry on an extracted HHCS lens stains these inclusions for
          L-ferritin and not for H-ferritin, so they are made of the overproduced subunit itself. Refractive-index
          discontinuities at the inclusions scatter incident light and degrade the image reaching the
          retina. Levi and colleagues additionally proposed that the L-chain excess perturbs the solubility
          equilibrium among the crystallins, or the lens antioxidant balance, as a contributing mechanism;
          that proposal has not been tested directly and is recorded here as a hypothesis rather than
          as the established route.
        biological_scale: TISSUE
        conforms_to: cataract_lens_opacification#Loss of Lens Refractive Transparency and Light Scattering
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: lens fibre cell
          term:
            id: CL:0011004
            label: lens fiber cell
        notes: 'Conformance caveat. The `cataract_lens_opacification` module routes its initiating insult
          through two crystallin-centred nodes - loss of crystallin solubility, then high-molecular-weight
          crystallin aggregate deposition - before reaching the light-scattering node this entry conforms
          to. HHCS largely bypasses that pair: the deposits are crystals of an overproduced non-crystallin
          protein, not aggregates of the crystallins themselves. The conformance is therefore declared
          at the two ends of the module chain, the lens insult and the optical consequence, and deliberately
          not at the crystallin-aggregation intermediate. Whether the crystallins are involved at all
          is exactly the untested part of the Levi hypothesis noted in this node''s description.'
      selected_evidence:
        snippet: The cataract comprised discrete crystalline inclusions with positive staining with anti-L-ferritin
          but not anti-H-ferritin.
        supports: SUPPORT
