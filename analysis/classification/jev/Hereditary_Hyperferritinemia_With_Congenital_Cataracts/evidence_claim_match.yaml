      assertion:
        category: Ophthalmologic
        name: Pulverulent Lens Opacities
        description: The slit-lamp appearance is distinctive enough that experienced examiners have argued
          it should raise the diagnosis on its own. The opacities are fine, dust-like (pulverulent) or
          breadcrumb-like punctate flecks and small crystalline aggregates distributed axially and peripherally;
          larger series also describe a radial, sunflower-like arrangement in older lenses.
        frequency: FREQUENT
        diagnostic: true
        phenotype_term:
          preferred_term: Pulverulent, breadcrumb-like punctate lens opacities
          term:
            id: HP:0010693
            label: Pulverulent cataract
        notes: 'Lachlan and colleagues describe the morphology in their seven British kindreds as "sunflower"
          cataract, and HPO has a Sunflower cataract term (HP:6000642). It is deliberately not bound here:
          HPO defines that term as an anterior subcapsular copper deposit "almost only seen in Wilson
          disease", which is a different lesion in a different lens layer that merely shares a floral
          metaphor. Binding it would assert a Wilson-disease finding in an iron disorder. Pulverulent
          cataract, defined in HPO as punctate dust-like opacities of the fetal nucleus, matches the described
          lesion.'
      selected_evidence:
        snippet: The primary characteristics are the appearance of axial and peripheral white flecks and
          small crystalline aggregates.
        supports: SUPPORT
