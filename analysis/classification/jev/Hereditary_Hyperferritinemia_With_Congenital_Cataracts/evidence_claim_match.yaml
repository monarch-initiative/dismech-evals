            term:
              id: MONDO:0010952
              label: hereditary hyperferritinemia with congenital cataracts
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of Venesection, Iron Chelation and Liver Biopsy
        description: Withholding iron-depletion therapy is a genuine intervention here rather than the
          absence of one, because the default management of a high ferritin is to remove iron and that
          default is harmful in HHCS. Phlebotomy cannot lower a translationally driven ferritin and instead
          induces iron deficiency; chelation is worse, having caused life-threatening hyperammonaemia
          in a child treated with deferasirox on a mistaken diagnosis; and liver biopsy, once routine
          in this work-up, is not indicated once the iron indices are normal. The correct action after
          diagnosis is to explain to the patient, and to record for future clinicians, that the ferritin
          is genetically driven and is not evidence of iron overload. Iron deficiency arising independently
          must still be treated on its own evidence, since the ferritin will not report it.
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: Withholding of iron-depletion therapy
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: Ferritin overproduction in HHCS is independent of iron availability; therefore, iron
          removal does not correct hyperferritinemia and may instead induce iron deficiency anemia and
          related clinical symptoms.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
