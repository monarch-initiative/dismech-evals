              by translation, not by iron, so it does not respond to iron removal and cannot be used to
              titrate any therapy. In HHCS it has also lost its ordinary meaning in the other direction,
              and will not fall to signal a genuine iron deficiency.
            biomarker_term:
              preferred_term: serum L-ferritin
              term:
                id: NCIT:C224202
                label: Serum Ferritin
          role: ancestor
      assertion_type: ReferenceRange
      assertion:
        loinc_term:
          id: LOINC:2276-4
          label: Ferritin [Mass/volume] in Serum or Plasma
        lower_bound: 12.0
        upper_bound: 300.0
        unit: ug/L
        population: adult males
        notes: Serum ferritin reference intervals are strongly assay- and laboratory-dependent; a British
          series using a different assay quotes 15-360 microgram/L. Treat any single interval as indicative.
      selected_evidence:
        snippet: Normal serum ferritin levels are ranging from 12 to 300 µg/L for males and from 12 to
          150 µg/L for females
        supports: SUPPORT
