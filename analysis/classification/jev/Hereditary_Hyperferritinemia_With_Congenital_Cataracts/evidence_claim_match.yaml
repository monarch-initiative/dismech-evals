        discussion_id: hhcs_genotype_severity_relationship
        kind: KNOWLEDGE_GAP
        prompt: Does IRE position predict phenotype severity well enough to be clinically useful, given
          how much variation there is between people carrying the same allele?
        attaches_to:
        - pathophysiology#Loss of Iron-Regulatory Protein Binding to the FTL IRE
        rationale: 'Two well-supported statements sit uneasily together. At the level of the allele, position
          in the IRE tracks severity: variants in the conserved apical hexanucleotide or the cytosine
          bulge give the highest ferritin values and the earliest, densest cataracts, while lower-stem
          variants can be nearly asymptomatic, and thermodynamic analysis correlates clinical severity
          with the extent of IRE-IRP disturbance. At the level of the patient, that signal largely disappears:
          the age at cataract diagnosis among sixteen carriers of a single allele spanned 6 to 40 years,
          ferritin values within one allele spanned 700 to 2,412 microgram/L, and the largest clinical
          series found no clear relationship between genotype and clinical severity at all. Whether the
          residual variance is modifier genes, environmental exposure of the lens, or simply measurement
          noise in a small and heavily ascertained corpus is not known, and until it is, an IRE position
          cannot be used to counsel an individual family about when their child will need surgery.'
      selected_evidence:
        snippet: 'Similarly, serum ferritin levels varied substantially also within subjects sharing the
          same mutation (i.e. range for the A40G: 700-2412 microg/l).'
        supports: SUPPORT
