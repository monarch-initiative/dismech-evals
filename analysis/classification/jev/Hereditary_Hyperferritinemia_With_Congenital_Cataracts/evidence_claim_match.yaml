  07b0a56a22f6c047a332a50f5f25900669267049d3c57554a5da50610ab8e59f:
    claim:
      about:
        disease:
          name: Hereditary Hyperferritinemia with Congenital Cataracts
          disease_term:
            preferred_term: hereditary hyperferritinemia with congenital cataracts
            term:
              id: MONDO:0010952
              label: hereditary hyperferritinemia with congenital cataracts
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FTL Iron-Responsive Element Disruption
        description: 'The initiating lesion is a heterozygous single-nucleotide substitution or short
          deletion inside the ~30-nucleotide IRE hairpin encoded in the FTL 5'' untranslated region. The
          IRE has four structural parts that matter: a conserved CAGUGN apical hexanucleotide loop, an
          upper stem, an unpaired cytosine bulge separating the stems, and a lower stem. Pathogenic changes
          cluster in the loop, the bulge and the upper stem, and act by distorting or destabilising the
          hairpin so that it no longer presents the surface that iron-regulatory proteins recognise. The
          FTL coding sequence is untouched, so the L-ferritin protein produced is structurally normal
          - which is what separates this disorder from the coding-region FTL diseases.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: FTL
          term:
            id: hgnc:3999
            label: FTL
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: 'Constitutional non-coding variant in the FTL 5'' UTR. Almost all reported patients
            are heterozygous; a handful of homozygous individuals have been described in consanguineous
            families. Deliberately no functional_impact_category is asserted here: the enum describes
            the activity of a gene product, and this variant does not change the product at all, only
            the amount of it that is made. The variant-level claim is carried instead by `regulatory_category`
            on the entries in `genetic`.'
      selected_evidence:
        snippet: Twenty-seven of these mutations are single nucleotide transitions and four are deletions
          of 2-29 base pairs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20511138
      reference_title: 'Hyperferritinaemia-cataract syndrome: worldwide mutations and phenotype of an
        increasingly diagnosed genetic disorder.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the allelic spectrum is substitutions plus short deletions, not coding
        changes.
