              label: hereditary hyperferritinemia with congenital cataracts
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: L-Ferritin Overproduction and Intracellular Accumulation
        description: 'Cells accumulate five- to twenty-fold excess L-ferritin. Because the excess is of
          one subunit only, the assembled product is abnormal in composition rather than in structure:
          roughly half of the surplus L-chain assembles into L-chain-only 24-mer homopolymers, which lack
          the H-subunit ferroxidase centre and therefore do not take up iron at all, and the remainder
          shifts the normal heteropolymer population towards L-rich isoferritins. This is the reason the
          disorder does not cause iron overload despite an enormous ferritin burden - the extra shells
          are essentially empty.'
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        cellular_components:
        - preferred_term: L-chain-rich and L-chain-only ferritin shells
          term:
            id: GO:0070288
            label: ferritin complex
          modifier: INCREASED
      selected_evidence:
        snippet: in HHCS cells a large proportion of L-ferritin accumulates as nonfunctional L-chain 24
          homopolymers
        supports: SUPPORT
