  2a994ae7ec45c171915576bc0e06c2ff6d624cbbd6125646144a9a2903d44ffd:
    claim:
      about:
        disease:
          name: Hereditary Hyperferritinemia with Congenital Cataracts
          disease_term:
            preferred_term: hereditary hyperferritinemia with congenital cataracts
            term:
              id: MONDO:0010952
              label: hereditary hyperferritinemia with congenital cataracts
        context: []
      assertion_type: Genetic
      assertion:
        name: FTL
        gene_term:
          preferred_term: FTL
          term:
            id: hgnc:3999
            label: FTL
        relationship_type: CAUSATIVE
        presence: Present
        frequency: The only gene in which variants are known to cause HHCS
        notes: 'Pathogenic HHCS variants lie exclusively in the FTL 5'' UTR IRE and are therefore invisible
          to a coding-only panel or to a conventional exome filtering strategy - a recurring reason for
          diagnostic delay. Two numbering conventions coexist in the literature: a historical one counting
          from the transcription start site and naming the allele after the city of first report (Paris-1
          +40A>G, Verona-1 +41G>C), and HGVS c.- numbering from the ATG. FTL is allelic for four other
          phenotypes, including neuroferritinopathy; see `differential_diagnoses` and `kb/disorders/neuroferritinopathy.yaml`.'
        variants:
        - name: FTL c.-168G>C
          description: A recurrent allele affecting the conserved three-nucleotide bulge of the FTL IRE,
            reported in Czech and Italian families among others.
          gene:
            preferred_term: FTL
            term:
              id: hgnc:3999
              label: FTL
          clinical_significance: PATHOGENIC
          regulatory_category: GOE
        - name: FTL c.-167C>T
          description: Documented arising de novo, with paternity confirmed - the allele that shows a
            negative family history cannot exclude the diagnosis.
          gene:
            preferred_term: FTL
            term:
              id: hgnc:3999
              label: FTL
          clinical_significance: PATHOGENIC
          regulatory_category: GOE
        - name: FTL c.-151A>G (Ghent +49A>G)
          description: 'An upper-stem allele just above the cytosine bulge. Predicted to disrupt base
            pairing at the base of the upper stem and, through that, the apical loop and the bulge. Notable
            as the best-quantified example of a partial lesion: it reduces IRP1 affinity more than five-fold
            without abolishing binding, and still causes disease. Reported homozygous in a consanguineous
            family, where the homozygote was the most severely affected member.'
          gene:
            preferred_term: FTL
            term:
              id: hgnc:3999
              label: FTL
          clinical_significance: PATHOGENIC
          regulatory_category: GOE
        - name: FTL IRE six-nucleotide deletion (Italian family)
          description: An example of the deletion class of HHCS alleles, in a repeat-containing stretch
            such that the deletion can be written four equivalent ways. Cited here to make the point that
            the allelic spectrum is not confined to substitutions.
          gene:
            preferred_term: FTL
            term:
              id: hgnc:3999
              label: FTL
          clinical_significance: PATHOGENIC
          regulatory_category: GOE
      selected_evidence:
        snippet: At least 47 mutations have been described in FTL gene as causative of HHCS, including
          36 single mutations, 9 deletions, and 2 insertion-deletions
        supports: SUPPORT
