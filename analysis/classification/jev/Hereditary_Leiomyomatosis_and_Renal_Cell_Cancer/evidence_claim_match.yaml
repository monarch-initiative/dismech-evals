      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hif_pseudohypoxia_driver
        hypothesis_label: Pseudohypoxic HIF Activation Drives FH-Deficient Tumorigenesis
        status: CANONICAL
        description: 'The long-standing reading of HLRCC: competitive inhibition of the HIF prolyl hydroxylases
          by accumulated fumarate stabilizes HIF in normoxia, and the resulting constitutive hypoxia programme
          is what transforms the FH-null cell. The human evidence for this arm is observational — HIF
          overexpression correlates with biallelic FH loss in HLRCC-associated renal cancer.'
      selected_evidence:
        snippet: We demonstrate that FH inhibition, together with elevated intracellular fumarate, coincides
          with HIF upregulation.
        supports: SUPPORT
