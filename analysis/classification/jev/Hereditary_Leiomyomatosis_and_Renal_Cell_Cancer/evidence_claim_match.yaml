            term:
              id: MONDO:0007888
              label: hereditary leiomyomatosis and renal cell cancer
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KEAP1 Succination and NRF2 Activation
        conforms_to: oncometabolite_dioxygenase_inhibition#KEAP1 Succination and NRF2 Antioxidant Pathway
          Activation
        description: 'Fumarate covalently modifies cysteine residues on KEAP1 to form S-(2-succinyl)cysteine,
          abrogating KEAP1''s ability to repress NRF2 and leaving the antioxidant transcriptional programme
          constitutively active. Mouse genetics places this branch outside the HIF axis: Fh1-associated
          renal cyst formation is HIF-independent, and deleting Hif-1alpha exacerbated rather than prevented
          cysts. This is a model-derived claim and is marked as such.'
        role: adaptive_escape
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: Mechanistic analysis revealed that fumarate modifies cysteine residues within the Kelch-like
          ECH-associated protein 1 (KEAP1), abrogating its ability to repress the Nuclear factor (erythroid-derived
          2)-like 2 (Nrf2)-mediated antioxidant response pathway, suggesting a role for Nrf2 dysregulation
          in FH-associated cysts and tumors.
        supports: SUPPORT
