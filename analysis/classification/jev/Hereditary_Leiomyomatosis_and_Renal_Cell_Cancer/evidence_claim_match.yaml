      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: nrf2_succination_driver
        hypothesis_label: KEAP1 Succination and NRF2 Dysregulation Drives FH-Deficient Tumorigenesis
        status: ALTERNATIVE
        description: 'The competing reading, specific to the fumarate lesion: the transforming event is
          covalent succination of KEAP1 and consequent constitutive NRF2 antioxidant signalling, not HIF
          stabilization. Mouse genetics is the strongest evidence and it removes HIF from the causal path
          — Fh1-associated renal cyst formation proceeds without HIF, and deleting Hif-1alpha made cysts
          worse rather than better. This entry does not adjudicate between the two readings; see the HUMAN_MODEL_MISMATCH
          discussion below.'
      selected_evidence:
        snippet: Using a mouse model, we provide genetic evidence that Fh1-associated cyst formation is
          Hif independent, as is striking upregulation of antioxidant signaling pathways revealed by gene
          expression profiling.
        supports: SUPPORT
