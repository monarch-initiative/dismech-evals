      assertion_type: DifferentialDiagnosis
      assertion:
        name: Drug-induced methemoglobinemia
        disease_term:
          preferred_term: drug-induced methemoglobinemia
          term:
            id: MONDO:0018740
            label: drug-induced methemoglobinemia
        description: 'Acquired methemoglobinemia is the clinical phenocopy of hereditary enzymopenic methemoglobinemia,
          arising when oxidizing medications (such as dapsone or benzocaine) or occupational aromatic
          amino/nitro chemicals accelerate ferrous heme oxidation past the recovery capacity of an intact
          NADH-cytochrome b5 reductase system. Both conditions present with central cyanosis unresponsive
          to supplemental oxygen, chocolate-brown blood, and a pulse-oximetry saturation gap alongside
          a normal arterial oxygen tension.

          '
        distinguishing_features:
        - History of exposure to oxidant medications (such as dapsone or benzocaine) or occupational chemicals,
          with resolution after removal of the offending agent
        - Acute or subacute onset after exposure rather than congenital or infantile lifelong cyanosis
        - Normal baseline erythrocyte NADH-cytochrome b5 reductase activity and absence of biallelic CYB5R3
          pathogenic variants
      selected_evidence:
        snippet: However, should methemoglobin formation be increased--e.g., due to the presence of oxidant
          drugs, or an abnormal methemoglobin not amenable to reduction (hemoglobin M), or a deficiency
          in red cell cytochrome b5 reductase--methemoglobinemia will result.
        supports: SUPPORT
