              label: hereditary methemoglobinemia
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cyanotic congenital heart disease
        disease_term:
          preferred_term: cyanotic congenital heart disease
          term:
            id: MONDO:0005453
            label: congenital heart disease
        description: 'Structural cyanotic heart disease and cardiopulmonary causes of hypoxemia are the
          primary conditions initially suspected in neonates or children presenting with persistent central
          cyanosis.

          '
        notes: 'Bound to MONDO:0005453 (congenital heart disease) as the closest available MONDO ancestor
          because a MONDO search for "cyanotic congenital heart disease" returned no narrower term.

          '
        distinguishing_features:
        - Patients with type I congenital enzymopenic methemoglobinemia are typically asymptomatic or
          appear well despite intense cyanosis, whereas cardiopulmonary cyanosis of similar severity is
          accompanied by respiratory distress and systemic illness
        - Cyanosis in methemoglobinemia does not improve with supplemental oxygen administration
        - Arterial blood gas analysis in methemoglobinemia shows a normal partial pressure of dissolved
          oxygen (PaO2) with a pulse-oximetry saturation gap and chocolate-brown blood, rather than true
          arterial hypoxemia
        - Normal echocardiography and chest imaging exclude structural cardiac or pulmonary pathology
      selected_evidence:
        snippet: The majority of patients with congenital enzymopenic methaemoglobinaemia are asymptomatic
          despite the intense cyanosis. This is a very important differentiating point from the cyanosis
          of cardiopulmonary causes.
        supports: SUPPORT
