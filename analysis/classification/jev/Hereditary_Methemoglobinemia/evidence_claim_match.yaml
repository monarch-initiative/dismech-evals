          disease_term:
            preferred_term: hereditary methemoglobinemia
            term:
              id: MONDO:0018963
              label: hereditary methemoglobinemia
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Transient neonatal cyanosis (hemoglobinopathy Toms River)
        disease_term:
          preferred_term: cyanosis, transient neonatal
          term:
            id: MONDO:0013511
            label: cyanosis, transient neonatal
        description: 'Autosomal dominant fetal gamma-globin variants in HBG2—including the low-oxygen-affinity
          Hb F-Toms River (HBG2 V67M)—present in newborns as a "happy blue baby" with persistent neonatal
          central cyanosis and low pulse-oximetry oxygen saturation despite normal arterial PaO2 and normal
          cardiac and pulmonary evaluation, closely mimicking neonatal congenital methemoglobinemia.

          '
        distinguishing_features:
        - Normal blood methemoglobin level on co-oximetry (cyanosis is caused by sterically impaired oxygen
          binding to mutant fetal hemoglobin rather than ferric methemoglobin accumulation)
        - Moderate neonatal hemolytic anemia and reticulocytosis from post-translational conversion of
          the mutant gamma-globin E11 methionine to aspartic acid
        - Heterozygous HBG2 V67M missense variant with spontaneous resolution of cyanosis within 1 to
          2 months as gamma-globin expression switches to beta-globin
      selected_evidence:
        snippet: Laboratory data (Table 1) were notable for moderate anemia with reticulocytosis. The
          methemoglobin level was normal, and the erythrocyte morphologic features were unremarkable.
        supports: SUPPORT
