    claim:
      about:
        disease:
          name: Hereditary methemoglobinemia
          disease_term:
            preferred_term: hereditary methemoglobinemia
            term:
              id: MONDO:0018963
              label: hereditary methemoglobinemia
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hemoglobin M disease
        disease_term:
          preferred_term: hemoglobin M disease
          term:
            id: MONDO:0018023
            label: hemoglobin M disease
        description: 'Congenital methemoglobinemia caused by autosomal dominant globin-chain variants
          (such as Hb F-M-Fort Ripley) in which an amino acid substitution in the heme pocket stabilizes
          iron in the ferric state, making the abnormal methemoglobin not amenable to reduction despite
          normal cytochrome b5 reductase activity.

          '
        distinguishing_features:
        - Normal erythrocyte cytochrome b5 reductase enzyme levels and activity
        - Autosomal dominant inheritance (or de novo globin mutation) rather than autosomal recessive
          CYB5R3 inheritance
        - Structural alpha-, beta-, or gamma-globin gene mutation identified by globin sequencing or electrophoresis
          rather than biallelic CYB5R3 variants
        - Transient neonatal cyanosis lasting one to three months in fetal gamma-globin M variants (such
          as Hb F-M-Fort Ripley), with resolution in early infancy
        - Structurally abnormal methemoglobin that is not amenable to reduction, rather than an enzymatic
          deficiency in the cytochrome b5 reductase pathway
      selected_evidence:
        snippet: Cytochrome b5 reductase levels were normal and a newborn screen was unable to pick up
          any abnormal variants of fetal haemoglobin. Genetic testing showed a γ globin gene mutation
          resulting in the M haemoglobin, called Hb F-M-Fort Ripley.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26969357
      reference_title: Congenital methemoglobinaemia due to Hb F-M-Fort Ripley in a preterm newborn.
