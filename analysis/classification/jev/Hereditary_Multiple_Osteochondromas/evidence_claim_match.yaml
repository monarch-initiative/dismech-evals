  8e6267db8d479293c1e936c316bd2f6ccf7211a4d51f604fba331f9c02b0006b:
    claim:
      about:
        disease:
          name: Hereditary Multiple Osteochondromas
          disease_term:
            preferred_term: Hereditary Multiple Osteochondromas
            term:
              id: MONDO:0005508
              label: hereditary multiple osteochondromas
        context: []
      assertion_type: Biochemical
      assertion:
        name: Blood heparan sulfate to chondroitin sulfate ratio
        presence: DECREASED
        context: A research biomarker, not a clinical test. In a single prospective series the amount
          of heparan sulfate in both plasma and the cellular fraction of blood was reduced and the heparan
          sulfate to chondroitin sulfate (HS/CS) ratio was about half that of healthy controls, with heparan
          sulfate chain structure preserved. The authors proposed the ratio as a diagnostic biomarker;
          it has not been validated against molecular testing in an independent cohort and is not part
          of any diagnostic pathway. The ratio is a value computed over two measurements, so the bound
          term is the analyte that falls (heparan sulfate) and the ratio identity is carried in the name,
          per the design-decision entry on composite indices.
        biomarker_term:
          preferred_term: heparan sulfate (as HS/CS ratio in blood)
          term:
            id: NCIT:C540
            label: Heparan Sulfate
        readouts:
        - target: Systemic Heparan Sulfate Insufficiency
          relationship: READOUT_OF
          direction: NEGATIVE
          endpoint_context: DIAGNOSTIC
          interpretation: A lower blood HS/CS ratio reports a greater systemic shortfall in heparan sulfate
            synthesis from the heterozygous EXT1/EXT2 defect; the ratio is halved in patients, in line
            with a dosage effect.
      selected_evidence:
        snippet: The results suggest that HME patients' blood exhibited reduced HS amounts and HS/CS ratios,
          which could be used as a diagnostic biomarker for HME.
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23514715
      reference_title: 'Glycosaminoglycans in the blood of hereditary multiple exostoses patients: Half
