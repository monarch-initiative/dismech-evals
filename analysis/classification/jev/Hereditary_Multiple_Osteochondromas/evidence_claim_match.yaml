  1d3ffa441941f6a6b98493af2e2711c720e67168523f6a20ba4ce593239aae51:
    claim:
      about:
        disease:
          name: Hereditary Multiple Osteochondromas
          disease_term:
            preferred_term: Hereditary Multiple Osteochondromas
            term:
              id: MONDO:0005508
              label: hereditary multiple osteochondromas
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Evaluation of suspected malignant transformation (cartilage-cap thickness)
        description: The red flags for secondary peripheral chondrosarcoma are growth of a lesion after
          skeletal maturity, new or increasing pain in an adult, and a thick cartilage cap on MRI. Thresholds
          in the literature range from over 1 cm (Bovée 2008 abstract) through 1.5-2 cm to the WHO 2020
          histological criterion of more than 2 cm; a cap thicker than about 2 cm in an adult is the commonly
          used trigger. The Falcon deep-research report gives a higher threshold of about 3 cm for children,
          which is not quoted from a cached source. Imaging alone may not separate an osteochondroma from
          a low-grade chondrosarcoma, so a suspicious lesion goes to a sarcoma team for expert radiology
          and pathology.
        diagnosis_term:
          preferred_term: MRI measurement of cartilage-cap thickness in a growing or painful lesion
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        results: Cartilage cap thicker than about 2 cm in an adult, growth after skeletal maturity, a
          lobulated surface, soft-tissue nodules or invasion of the stalk raise suspicion of secondary
          peripheral chondrosarcoma.
      selected_evidence:
        snippet: The most important feature was the thickness of the cartilaginous cap > 2 cm; a lobular
          pattern with nodules in the surrounding soft tissue, separated by the mail mass, and the invasion
          of the stalk of the osteochondroma were also in favor of malignancy.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38351015
      reference_title: 'Secondary peripheral chondrosarcoma in multiple osteochondromas: a retrospective
        single-institution case series.'
      evidence_source: HUMAN_CLINICAL
      explanation: The 2 cm cap criterion and the ancillary features used for grade 1 peripheral chondrosarcoma
        under the WHO 2020 classification; quoted verbatim including the source's spelling.
