        description: 'Heparan sulfate is the matrix that governs where growth-plate morphogens act. With
          less of it, Indian hedgehog spreads further from the prehypertrophic chondrocytes that make
          it, so the range of Ihh signalling and the PTHrP feedback it drives are expanded; bone morphogenetic
          proteins are no longer held in the matrix and cells become more responsive to them; and fibroblast
          growth factors, which need heparan sulfate as a co-receptor and normally restrain chondrogenesis,
          signal less. The net direction is pro-chondrogenic. Note the distinction from constitutive hedgehog
          activation: the ligand and receptor are normal here, and what changes is the diffusion field.
          The Ext2-heterozygous mouse in fact showed cartilage disorganisation that was not attributable
          to a hedgehog defect, so the BMP and FGF arms are not secondary to the hedgehog one.'
        biological_processes:
        - preferred_term: Indian hedgehog signaling range in the growth plate
          modifier: INCREASED
          term:
            id: GO:0007224
            label: smoothened signaling pathway
        - preferred_term: BMP signaling in perichondrial and growth-plate cells
          modifier: INCREASED
          term:
            id: GO:0030509
            label: BMP signaling pathway
        - preferred_term: FGF receptor signaling in chondrocytes
          modifier: DECREASED
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
        locations:
        - preferred_term: epiphyseal growth plate
          term:
            id: UBERON:0002516
            label: epiphyseal plate
      selected_evidence:
        snippet: These changes were not attributable to a defect in hedgehog signaling, suggesting that
          they arise from deficiencies in other heparan sulfate-dependent pathways.
        supports: SUPPORT
