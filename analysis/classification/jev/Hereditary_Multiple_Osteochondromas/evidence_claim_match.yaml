              label: hereditary multiple osteochondromas
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Solitary osteochondroma
        description: A single osteochondroma is the common, non-hereditary lesion (about 85% of all osteochondromas);
          it arises from somatic biallelic EXT1 loss confined to the cartilage cap and carries no germline
          variant. A second lesion, a positive family history or a germline EXT1/EXT2 variant moves the
          diagnosis to the hereditary disorder.
        distinguishing_features:
        - One lesion only, no family history
        - No germline EXT1 or EXT2 variant; somatic homozygous EXT1 deletion restricted to the cartilage
          cap
      selected_evidence:
        snippet: However, 85% of all osteochondromas present as solitary (nonhereditary) lesions in which
          somatic mutations in EXT1 are extremely rare, but loss of heterozygosity and clonal rearrangement
          of 8q24 (the chromosomal locus of EXT1) are common.
        supports: SUPPORT
