      assertion_type: Discussion
      assertion:
        discussion_id: hmo_palovarotene_translation
        prompt: Why did a drug that prevents 91% of osteochondromas in Ext1-deficient mice show no efficacy
          signal in children, and is the question closed?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Perichondrial Border Function and Ectopic Chondrogenesis
        - treatments#Palovarotene (investigational; MO-Ped trial terminated)
        rationale: 'Palovarotene is the only mechanism-directed drug to reach a randomised trial in HMO,
          and the trial was negative on the truncated data. The mouse result is robust and mechanistically
          coherent, so the discrepancy is informative: possibilities include that the mouse model''s stochastic
          Cre-driven lesions are more retinoid-sensitive than second-hit human lesions, that the human
          dose was limited by physeal toxicity to below the effective range, and that twelve months in
          30 children is simply too little to see an effect on annualised lesion rate. The trial''s own
          authors say interpretation was limited by reduced treatment duration and a smaller than expected
          cohort, so the question is not closed, but any successor must first solve the growth-plate safety
          problem that stopped this one.'
      selected_evidence:
        snippet: No significant differences in the annualized rate of new OCs, or change from baseline
          in volume of OCs or OC cartilage, were observed between treatment groups.
        supports: SUPPORT
