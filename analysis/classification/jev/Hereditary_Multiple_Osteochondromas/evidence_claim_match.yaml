        distinguishing_features:
        - Enchondromas present; osteochondromas mainly in hands and feet, pointing toward the growth plate
        - Lesions do not shorten or deform bones and may regress spontaneously
        - PTPN11 loss-of-function variant rather than EXT1/EXT2
      selected_evidence:
        snippet: point toward the adjacent growth plate, while in MO the osteochondromas are mainly located
          in the long or other tubular bones and point away from the epiphysis
