  d6f9351f2674a7abdc9d4b30e8a5baeb127e6e67da2dbc6f5d9a7c2d077ac4e4:
    claim:
      about:
        disease:
          name: Hereditary Multiple Osteochondromas
          disease_term:
            preferred_term: Hereditary Multiple Osteochondromas
            term:
              id: MONDO:0005508
              label: hereditary multiple osteochondromas
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cross-sectional imaging for complex anatomy and cartilage-cap assessment
        description: Plain radiography is first line. CT is used for lesions in complex anatomy (pelvis,
          scapula, ribs, spine) where radiographs cannot define the base and extent. MRI is the modality
          for the hyaline cartilage cap (T2-weighted sequences), the marrow, adjacent soft tissue and
          neurovascular structures, and for suspected spinal or malignant complications; ultrasound can
          measure the cap of a superficial lesion. The imaging ladder (radiography, then CT for complex
          sites, MRI for the cap, ultrasound for superficial caps) follows the Falcon deep-research report's
          synthesis of the radiology reviews; the cited sources quote the MRI role directly. Whether children
          should have a screening spine MRI is unsettled.
        diagnosis_term:
          preferred_term: magnetic resonance imaging of the cartilage cap (with CT and ultrasound as adjuncts)
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        results: Defines lesion base and extent at complex sites (CT), and measures cartilage-cap thickness
          and shows marrow, soft-tissue and neurovascular relationships (MRI); a spine MRI may show asymptomatic
          canal lesions.
      selected_evidence:
        snippet: The diagnosis of MO typically involves identifying multiple benign bone tumors known
          as osteochondromas (OCs) through imaging studies and physical examinations.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/2
