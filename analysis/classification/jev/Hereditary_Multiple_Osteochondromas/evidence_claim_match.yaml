        expressivity: VARIABLE
        de_novo_rate: '10'
        description: 'Autosomal dominant with near-complete penetrance and wide, including intrafamilial,
          variability in expression. About one in ten affected people has no affected parent. Penetrance
          was 96% in the Washington kindred study (one unaffected obligate heterozygote among 26) and
          100% in the Wicklund natural-history series, so the value is recorded as COMPLETE with the measured
          percentage beside it. Older claims of reduced penetrance in females were not borne out: the
          male excess in affected populations reflects more severe and more frequent complications in
          males, not transmission.'
      selected_evidence:
        snippet: Approximately 90% of individuals diagnosed with HMO have an affected parent; approximately
          10% of individuals have the disorder as the result of a de novo pathogenic variant.
        supports: SUPPORT
