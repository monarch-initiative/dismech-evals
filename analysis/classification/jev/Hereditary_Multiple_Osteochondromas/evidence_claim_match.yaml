        variant_origin: GERMLINE
        notes: Exostosin-2, 11p11-p12, sixteen exons; identified in 1996 by its homology to EXT1. Accounts
          for about 35% of mutation-positive cases, with the same truncating-dominated spectrum as EXT1.
          EXT2 has no significant glycosyltransferase activity on its own and acts within the EXT1-EXT2
          complex, which is why its loss produces the same disease. On average the milder genotype. Functional
          impact is loss of function, as for EXT1.
      selected_evidence:
        snippet: Here, we report the isolation and characterization of the EXT2 gene. This gene shows
          striking sequence similarity to the EXT1 gene, and we have identified a four base deletion segregating
          with the phenotype.
