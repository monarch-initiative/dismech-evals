  8f92124af43db6b6e6d9fbbb6e42ef84951fba7f3f9f98b6d553e8fcb53946c4:
    claim:
      about:
        disease:
          name: Hereditary Multiple Osteochondromas
          disease_term:
            preferred_term: Hereditary Multiple Osteochondromas
            term:
              id: MONDO:0005508
              label: hereditary multiple osteochondromas
        context: []
      assertion_type: Diagnosis
      assertion:
        name: EXT1 and EXT2 sequencing followed by deletion/duplication analysis
        description: Molecular confirmation identifies a heterozygous pathogenic variant in EXT1 or EXT2.
          Sequence analysis of all coding exons and flanking splice regions of both genes is performed
          first; if negative, exon-level deletion/duplication analysis (typically MLPA) follows, since
          gross deletions account for a meaningful share of pathogenic alleles. Together these find a
          variant in about 90% of clinically diagnosed patients. In a sequencing-negative proband, or
          one with enchondromas or hand and foot lesions, PTPN11 should be added, because loss-of-function
          PTPN11 variants (the metachondromatosis gene) were found in about 4% of a large cohort referred
          with a diagnosis of multiple osteochondromas. Testing of relatives, and prenatal or preimplantation
          testing, become possible once the familial variant is known.
        diagnosis_term:
          preferred_term: EXT1 and EXT2 sequence analysis with deletion/duplication (MLPA) testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: A heterozygous pathogenic or likely pathogenic EXT1 or EXT2 variant (nonsense, frameshift,
          splice-site, missense or exon-level deletion) confirms the diagnosis; a PTPN11 loss-of-function
          variant points to metachondromatosis or the overlap spectrum.
      selected_evidence:
        snippet: The diagnosis of HMO is established in a proband with characteristic radiographic findings
          of multiple osteochondromas and/or a heterozygous pathogenic variant in EXT1 or EXT2 identified
          on molecular genetic testing.
        supports: SUPPORT
