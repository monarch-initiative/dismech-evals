        - genetic#
        rationale: 'A 2024 cohort of 244 unrelated probands found PTPN11 loss-of-function variants in
          five probands with osteochondromas and no enchondromas, and EXT1/EXT2 variants in two with enchondromas,
          and proposed a phenotypic and genetic overlap between HMO and metachondromatosis. This entry
          does not add PTPN11 as a causal gene: enchondromas can be missed on conventional imaging, metachondromatosis
          lesions regress and point toward joints, and five cases do not establish a locus. The finding
          does mean that an EXT-negative patient should have PTPN11 sequenced, and it is recorded here
          so that it is not re-nominated as new.'
      selected_evidence:
        snippet: It is essential to determine whether MO and MC represent distinct diseases or if they
          encompass a broader clinical spectrum.
        supports: SUPPORT
