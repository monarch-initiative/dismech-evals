      assertion:
        name: Osteochondroma Formation by Ectopic Endochondral Ossification
        biological_scale: TISSUE
        description: The lesion. Ectopic cartilage at the metaphyseal margin ossifies by endochondral
          ossification, so the osteochondroma has a cortex and a marrow cavity continuous with the parent
          bone and a hyaline cartilage cap that acts as its own growth plate. Lesions arise wherever bone
          forms from cartilage, most often at the metaphyses of long bones and around the knee, with the
          cranial base recently shown to be affected too; membranous bones of the face are spared. They
          enlarge and multiply during childhood and stop when the physes close, which is why growth or
          new pain in an adult is a warning sign rather than the expected course.
        biological_processes:
        - preferred_term: ectopic endochondral ossification
          modifier: ABNORMAL
