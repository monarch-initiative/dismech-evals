        category: Neoplastic
        description: Malignant transformation of an osteochondroma cartilage cap, usually to a low-grade
          chondrosarcoma, most often in the pelvis and around the hip and shoulder, typically in the third
          and fourth decades but from adolescence. Estimates of lifetime risk range from about 1% to 5%
          in population-based or large-cohort series (2.8% in Wicklund, 5% in Pedrini, 0.5-5% pooled)
          and up to 10% in older referral-centre figures; no single band is assigned because the estimates
          straddle the VERY_RARE/OCCASIONAL boundary. Warning signs are growth after skeletal maturity,
          new pain, and a cap thicker than about 2 cm in an adult. The tumour itself is curated in the
          Chondrosarcoma entry.
        phenotype_term:
          preferred_term: Secondary peripheral chondrosarcoma
          term:
            id: HP:0006765
            label: Chondrosarcoma
      selected_evidence:
        snippet: The risk for malignant transformation to osteochondrosarcoma increases with age, although
          the lifetime risk for malignant transformation is low (~2%-10%).
