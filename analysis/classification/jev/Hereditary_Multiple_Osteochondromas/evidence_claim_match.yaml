      assertion_type: Treatment
      assertion:
        name: Palovarotene (investigational; MO-Ped trial terminated)
        description: A selective retinoic acid receptor gamma agonist that, in Ext1-deficient mice, cut
          osteochondroma formation by up to 91%, attenuated BMP signalling, and restored the chondrogenic
          fate decision of perichondrial progenitors; a later mouse study showed it also arrests growth
          of pre-existing lesions via Stat3. The phase 2 MO-Ped trial (NCT03442985) randomised 193 children
          to placebo or two doses, was placed on partial clinical hold over concern about premature physeal
          closure and then terminated. In the 30 patients with 12-month imaging there was no difference
          in the annualised rate of new osteochondromas or in lesion volume, and the sponsor concluded
          the benefit-risk profile was not favourable. Recorded as an experimental treatment with a negative
          human result, not as a therapy; there is no approved disease-modifying drug for HMO.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
