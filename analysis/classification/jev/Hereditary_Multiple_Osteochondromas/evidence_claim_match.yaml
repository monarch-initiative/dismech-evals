        context: []
      assertion_type: Genetic
      assertion:
        name: EXT1
        gene_term:
          preferred_term: EXT1
          term:
            id: hgnc:3512
            label: EXT1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Exostosin-1, 8q24.11, eleven exons. Cloned in 1995 from the Langer-Giedion region by walking
          to two patients' translocation breakpoints. Accounts for about 65% of mutation-positive cases;
          the spectrum is dominated by nonsense, frameshift and splice-site alleles, with whole-exon and
          whole-gene deletions detectable by MLPA and a minority of functionally validated missense alleles.
          Several reported missense variants retain heparan sulfate synthesis in functional assays and
          are probably not pathogenic. Functional impact is loss of function (haploinsufficiency at the
          germline level, biallelic loss in lesion chondrocytes), recorded structurally in the initiating
          pathophysiology node's genetic_context. The contiguous 8q24 deletion that removes EXT1 together
          with TRPS1 causes Langer-Giedion syndrome and is out of scope here.
      selected_evidence:
        snippet: In a majority of families, the genetic defect (EXT1) is linked to the Langer-Giedion
          syndrome chromosomal region in 8q24.1. From this region we have cloned and characterized a cDNA
          which spans chromosomal breakpoints previously identified in two multiple exostoses patients.
        supports: SUPPORT
