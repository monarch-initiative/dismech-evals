  b7df99b419c63fa861f3398573cd9e15a8577dc18f8df9695a7784c897761f5a:
    claim:
      about:
        disease:
          name: Hereditary Multiple Osteochondromas
          disease_term:
            preferred_term: Hereditary Multiple Osteochondromas
            term:
              id: MONDO:0005508
              label: hereditary multiple osteochondromas
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Perichondrial Border Function and Ectopic Chondrogenesis
        biological_scale: TISSUE
        description: 'The perichondrium normally walls the growth plate laterally and keeps chondrogenesis
          inside it; the groove of Ranvier at the physeal margin is rich in progenitors. When heparan
          sulfate is lost in perichondrium and the lateral chondrocytes flanking the epiphysis, that border
          fails: ectopic cartilage forms, cells at the chondro-perichondrial boundary change phenotype,
          and cartilage nodules lose their peripheral definition and fuse. Chondrocytes and progenitors
          escape sideways from the physis and proliferate ectopically at the metaphyseal periphery. This
          is the node a RAR-gamma agonist acts on: palovarotene restores the chondrogenic fate decision
          of Ext1-deficient perichondrial progenitors in mice.'
        cell_types:
        - preferred_term: perichondrial progenitor cell
          term:
            id: CL:4033025
            label: perichondrial fibroblast
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: ectopic chondrocyte differentiation
          modifier: INCREASED
          term:
            id: GO:0002062
            label: chondrocyte differentiation
        locations:
        - preferred_term: perichondrium
          term:
            id: UBERON:0002222
            label: perichondrium
      selected_evidence:
        snippet: Indeed, conditional Ext1 ablation in perichondrium and lateral chondrocytes flanking
          the epiphyseal region of mouse embryo long bone anlagen - a region encompassing the groove of
          Ranvier - caused ectopic cartilage formation.
        supports: SUPPORT
