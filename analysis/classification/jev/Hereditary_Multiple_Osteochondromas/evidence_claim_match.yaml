          plate rather than away from it, do not cause the shortening and deformity seen here, and may
          regress spontaneously. The boundary is not sharp: PTPN11 loss-of-function variants were found
          in about 4% of probands referred with a diagnosis of multiple osteochondromas, several without
          enchondromas, so the two may form a spectrum.'
        disease_term:
