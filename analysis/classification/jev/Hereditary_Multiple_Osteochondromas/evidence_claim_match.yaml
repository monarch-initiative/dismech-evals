          so the multiple exostoses of this disorder occur alongside the trichorhinophalangeal features
          (sparse hair, bulbous nose, cone-shaped epiphyses), ectodermal anomalies and, in some, intellectual
          disability. A child with osteochondromas plus dysmorphic features or developmental delay should
          have chromosomal microarray rather than EXT1/EXT2 sequencing alone.
        disease_term:
          preferred_term: Langer-Giedion syndrome
          term:
            id: MONDO:0007874
            label: trichorhinophalangeal syndrome type II
        distinguishing_features:
        - Facial dysmorphism, sparse hair, cone-shaped epiphyses and possible intellectual disability
          in addition to exostoses
        - Contiguous 8q23q24 deletion including TRPS1 and EXT1 on microarray, not an intragenic EXT1/EXT2
          variant
      selected_evidence:
        snippet: Langer-Giedion syndrome (LGS) is caused by a contiguous deletion at 8q23q24, characterized
          by exostoses, facial, ectodermal, and skeletal anomalies, and, occasionally, intellectual disability.
        supports: SUPPORT
