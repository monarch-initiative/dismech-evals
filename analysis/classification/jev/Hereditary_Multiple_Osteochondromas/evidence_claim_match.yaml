        relationship: RECAPITULATES
        fidelity: HIGH
        model_scale: CELLULAR
        description: Engineered biallelic Ext1 loss in a clone of physeal chondrocytes on a wild-type-competent
          background.
        limitations: The second hit is induced by Cre at a chosen time and in a chosen cell type rather
          than arising stochastically on a germline heterozygous background, so the model shows sufficiency
          of clonal loss but not the natural rate or timing of second hits in patients.
      selected_evidence:
        snippet: We also confirm homozygous disruption of Ext1 in osteochondroma chondrocytes and their
          origin in proliferating physeal chondrocytes. These results explain prior modeling failures
          with the necessity for somatic LOH in a developmentally regulated cell type.
        supports: SUPPORT
