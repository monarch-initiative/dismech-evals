      assertion_type: Pathophysiology
      assertion:
        name: Somatic Second Hit in Growth-Plate Chondrocytes
        biological_scale: CELLULAR
        description: 'In a subset of growth-plate chondrocytes the remaining wild-type EXT allele is lost
          somatically, producing a clone with essentially no heparan sulfate. Human osteochondroma tissue
