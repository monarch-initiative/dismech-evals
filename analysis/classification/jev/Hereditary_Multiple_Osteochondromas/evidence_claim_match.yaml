  ec781ba66eef46a36eaf7e75745737ee7c1704c6522e3173065ff5f12ddb87ef:
    claim:
      about:
        disease:
          name: Hereditary Multiple Osteochondromas
          disease_term:
            preferred_term: Hereditary Multiple Osteochondromas
            term:
              id: MONDO:0005508
              label: hereditary multiple osteochondromas
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Growth-Plate Tethering and Disturbed Longitudinal Bone Growth
        biological_scale: TISSUE
        description: Lesions sitting at the physis tether the bone, divert growth into the outgrowth,
          and shorten and angulate the segment; where two bones grow in parallel, as in the forearm and
          the leg, the shorter one bows the other and dislocates the joint between them. The heparan sulfate
          deficit also disorganises the growth plate directly, so the growth disturbance is not purely
          mechanical. The result is short stature, the characteristic forearm deformity, limb-length inequality
          and valgus at the knee and ankle, all progressive during growth and fixed after it. Deformity
          is a strong discriminator of severity and is worse with EXT1.
        biological_processes:
        - preferred_term: longitudinal endochondral bone growth
          modifier: DECREASED
          term:
            id: GO:0003416
            label: endochondral bone growth
        locations:
        - preferred_term: epiphyseal growth plate
          term:
            id: UBERON:0002516
            label: epiphyseal plate
      selected_evidence:
        snippet: Throughout follow-up, 80.4% of patients developed new osteochondromas, 57.6% developed
          new deformities, 23.4% developed new functional limitation(s).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
