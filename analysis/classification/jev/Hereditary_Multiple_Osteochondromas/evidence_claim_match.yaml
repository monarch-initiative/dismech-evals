        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical and radiographic diagnosis (two or more osteochondromas)
        description: The diagnosis is clinical and radiographic. It is established in a proband by characteristic
          radiographic findings of multiple osteochondromas (and/or by a heterozygous EXT1 or EXT2 pathogenic
          variant, below). The working criterion is two or more cartilage-capped bony outgrowths whose
          cortex and medulla are continuous with the parent bone, on physical examination, family history
          and plain radiographs; where an affected relative is already established, the diagnosis can
          be made clinically without molecular testing. Histology of an excised lesion supplements but
          is not required.
        diagnosis_term:
          preferred_term: plain radiography of the skeleton with physical examination
          term:
            id: NCIT:C137876
            label: Bone Radiography
        results: Two or more osteochondromas, pedunculated or sessile, at the metaphyses of long bones
          or on flat bones, with cortical and medullary continuity with the underlying bone.
      selected_evidence:
        snippet: The diagnosis of HMO is established in a proband with characteristic radiographic findings
          of multiple osteochondromas and/or a heterozygous pathogenic variant in EXT1 or EXT2 identified
          on molecular genetic testing.
        supports: SUPPORT
