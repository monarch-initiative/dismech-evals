            term:
              id: MONDO:0005508
              label: hereditary multiple osteochondromas
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Systemic Heparan Sulfate Insufficiency
        biological_scale: MOLECULAR
        description: 'Heterozygosity is enough to be measurable. The heparan sulfate to chondroitin sulfate
          ratio in patients'' blood is about half that of controls, with the chain structure itself largely
          preserved: it is the amount, not the sulfation pattern, that is short. Compound Ext1/Ext2-heterozygous
          mice show the same thing in chondrocytes, endothelial cells and fibroblasts, which make shortened
          heparan sulfate chains and respond less to heparan-sulfate-dependent factors such as FGF-18.
          This node is the dosage arm of the mechanism: it operates in every cell, it is what the compound-heterozygous
          mouse shows to be sufficient for exostoses, and it sets the threshold that a somatic second
          hit pushes a clone over.'
        biological_processes:
        - preferred_term: heparan sulfate proteoglycan biosynthesis
          modifier: DECREASED
          term:
            id: GO:0015012
            label: heparan sulfate proteoglycan biosynthetic process
      selected_evidence:
        snippet: However, interestingly, although both the amounts of HS and chondroitin sulfate (CS)
          varied depending on the different individuals, the amounts of HS in both the plasma and cellular
          fractions of HME patient samples were decreased and the ratios of HS to CS (HS/CS) of HME patient
          samples were almost half those of healthy individuals.
        supports: SUPPORT
