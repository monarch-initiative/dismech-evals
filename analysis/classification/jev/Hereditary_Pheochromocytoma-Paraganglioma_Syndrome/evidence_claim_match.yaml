      selected_evidence:
        snippet: 'Here we describe a mitochondrion-to-cytosol signaling pathway that links mitochondrial
          dysfunction to oncogenic events: succinate, which accumulates as a result of SDH inhibition,
          inhibits HIF-alpha prolyl hydroxylases in the cytosol, leading to stabilization and activation
          of HIF-1alpha.'
        supports: SUPPORT
