        hypothesis_label: Hypermethylator Phenotype and Differentiation Block Drives SDHx-Deficient Tumorigenesis
        status: ALTERNATIVE
        description: 'The competing reading: the transforming event is inhibition of the TET and Jumonji
          demethylases, producing a hypermethylator phenotype that silences neuroendocrine differentiation
          genes. Its strongest support is that the severity of silencing, not the degree of HIF activation,
          tracks the clinical severity gradient across SDHx genotypes — epigenetic silencing is most severe
          in SDHB-mutated tumors, which are also the most likely to metastasize.'
      selected_evidence:
        snippet: Epigenetic silencing was particularly severe in SDHB-mutated tumors, potentially explaining
          their malignancy.
        supports: SUPPORT
