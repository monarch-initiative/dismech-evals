        context: []
      assertion_type: Diagnosis
      assertion:
        name: SDHB Immunohistochemistry as a Triage Test for Germline SDHx Testing
        description: SDHB protein is destabilized when any complex II subunit is lost, so loss of SDHB
          staining reports the whole SDHx arm rather than SDHB alone. Because the second hit removes the
          wild-type allele in tumor tissue, the tumor itself reports the germline state, and a negative
          or weak-diffuse stain triages which patients need panel sequencing. It does not replace germline
          testing.
        diagnosis_term:
          preferred_term: Immunohistochemistry Staining Method
          term:
            id: NCIT:C23020
            label: Immunohistochemistry Staining Method
        results: Absent or weak-diffuse cytoplasmic SDHB staining, read against an internal positive control,
          selects tumors for germline SDHx sequencing; granular cytoplasmic positivity argues against
          an SDHx cause.
      selected_evidence:
        snippet: All 12 SDH mutated tumors (6 SDHB, 5 SDHD, and 1 SDHC) showed weak diffuse or negative
          staining.
        supports: SUPPORT
