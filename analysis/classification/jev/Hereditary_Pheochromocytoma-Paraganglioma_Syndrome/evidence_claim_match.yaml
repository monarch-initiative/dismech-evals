      assertion_type: Treatment
      assertion:
        name: Lifelong Biochemical and Imaging Surveillance
        notes: 'Curated under `treatments:` as a management intervention, not as a claim that imaging
          or biochemistry is itself therapeutic. In a two-hit predisposition syndrome the second hit cannot
          be prevented, so the only available lever is stage at detection: surveillance is the intervention
          that converts an unavoidable tumor into a resectable one. Where a `target_mechanisms` link is
          present it points at the clinical-outcome node for that reason, and never at an upstream mechanistic
          node.'
        description: Because independent second hits keep occurring across paraganglial tissue, surveillance
          is lifelong and combines biochemistry with whole-body imaging. The starting age is gene-dependent,
          which is why cascade testing precedes surveillance planning.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Magnetic Resonance Imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
      selected_evidence:
        snippet: Individuals at risk for hereditary PGL/PCC syndromes should have annual clinical assessment
          for manifestations of PGL/PCCs and GISTs, plasma-free fractionated metanephrines or 24-hour
          urine fractionated metanephrines every two years in childhood and then annually in adults, and
          whole-body MRI every two to three years.
        supports: SUPPORT
