        description: Succinate builds up as a direct result of succinate dehydrogenase inhibition and
          moves from the mitochondrion to the cytosol, where it is available to act on 2-oxoglutarate-dependent
          enzymes. This mitochondrion-to-cytosol step is what converts a metabolic lesion into a signalling
          lesion.
        role: amplifier
        biological_scale: MOLECULAR
