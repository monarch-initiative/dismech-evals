          term:
            id: MONDO:0014206
            label: severe early-onset pulmonary alveolar proteinosis due to MARS deficiency
        description: 'Biallelic MARS1 missense variants attenuate methionyl-tRNA synthetase activity,
          a general protein-biosynthesis defect rather than a GM-CSF signalling or surfactant-clearance
          defect. A founder allele makes the disease prevalent on Réunion Island, and in the yeast assay
          the attenuated enzyme activity was restored by methionine supplementation, which the authors
          describe as possibly opening new treatment opportunities. MONDO''s synonyms for this disease
          include interstitial lung and liver disease and hereditary pulmonary alveolar proteinosis with
          hepatic involvement. Recorded here as a differential rather than a subtype. MONDO''s label uses
          the previous gene symbol MARS; the approved symbol is MARS1.

          '
        distinguishing_features:
        - Attenuated methionyl-tRNA synthetase activity, not impaired GM-CSF signalling
        - Founder allele concentrated on Réunion Island and nearby islands
        - MONDO's synonyms for the disease name hepatic as well as pulmonary involvement
      selected_evidence:
        snippet: Enzyme activity was attenuated in a liquid medium without methionine but could be restored
          by methionine supplementation.
        supports: SUPPORT
