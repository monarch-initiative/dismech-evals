  639cafa81af463b41d3da9d8b42d513587408fb82fdec3953ac5de19cf05dcb0:
    claim:
      about:
        disease:
          name: Hereditary Pulmonary Alveolar Proteinosis
          disease_term:
            preferred_term: hereditary pulmonary alveolar proteinosis
            term:
              id: MONDO:0012580
              label: hereditary pulmonary alveolar proteinosis
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 4 (Other Non-Lymphoid Defects). This entry
          covers BOTH pulmonary alveolar proteinosis rows of that section, one per receptor subunit: CSF2RA
          (XL, biallelic mutations in a pseudoautosomal gene, MIM 300770) and CSF2RB (AR, MIM 614370).
          Affected cells are alveolar macrophages and the affected function is GM-CSF signaling — the
          phagocyte here is the tissue macrophage rather than the neutrophil, which is why a lung disease
          sits in the phagocyte table.

          The published table prints the second gene as "CSFR2B". That is a typo in the source: the gene
          is CSF2RB (hgnc:2436), which is what this entry binds. The transposition is preserved inside
          the quoted snippet because the quote belongs to the source, and must not be propagated into
          any gene_term or prose.

          Not to be confused with the autoimmune disease of the same name. Autoimmune pulmonary alveolar
          proteinosis, caused by neutralizing anti-GM-CSF autoantibody, is a Table 10 phenocopy of an
          inborn error of immunity and is curated separately; splitting the two on mechanism rather than
          on gene matters here because both entries bind CSF2RA and CSF2RB.'
      selected_evidence:
        snippet: CSF2RA XL (Biallelic mutations in pseudo-autosomal gene) 300770
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
      evidence_path: /classifications/iuis_category/evidence/0
      context_paths:
