            label: Autoimmune antibody positivity
        notes: 'No incoming causal edge, deliberately. Orphanet reports general autoimmune antibody positivity
          as occasional here, which is what the evidence supports, but no node in this entry describes
          a mechanism that would produce autoantibodies — the chain runs from receptor dysfunction through
          failed surfactant clearance to alveolar filling, and none of those steps reaches B-cell tolerance
          by any cited route.

          Worth keeping distinct from the differential point the description makes: the anti-GM-CSF autoantibodies
          that DEFINE autoimmune PAP are absent in the hereditary form. General autoantibody positivity
          being occasionally present and the specific pathogenic autoantibody being absent are two different
          claims, and the entry carries both.'
