            term:
              id: MONDO:0014310
              label: hereditary sclerosing poikiloderma with tendon and pulmonary involvement
        context: []
      assertion_type: Genetic
      assertion:
        name: FAM111B
        gene_term:
          preferred_term: FAM111B
          term:
            id: hgnc:24200
            label: FAM111B
        relationship_type: CAUSATIVE
        notes: Heterozygous germline variants, inherited in about half of affected individuals and de
          novo in the other half. Most are missense variants clustered at codons 621 to 629 near the C-terminal
          trypsin-like peptidase domain; a second group lies around codons 416 to 430 (p.Phe416Ser, p.Lys421del,
          p.Gln430Pro). The original variants were absent from public databases and from 388 ethnically
          matched controls. In the main series, variants at codons 625, 627 and 628 were associated with
          earlier onset and more severe disease than those at codons 430 and 621, a preliminary observation
          from a small number of patients. No deletion or duplication has been reported.
        variants:
        - name: c.1879A>G p.(Arg627Gly)
          description: Recurrent missense variant, de novo in the first French patient and found in further
            unrelated families; the two Italian patients with lymphocyte chromosomal instability carry
            it.
          clinical_significance: PATHOGENIC
        - name: c.1883G>A p.(Ser628Asn)
          description: Recurrent missense variant; the recombinant mutant protein has markedly elevated
            autoproteolytic activity.
          clinical_significance: PATHOGENIC
        - name: c.1261_1263delAAG p.(Lys421del)
          description: In-frame deletion outside the protease-domain hotspot, segregating in a family
            whose leading feature was exocrine pancreatic dysfunction; GeneReviews notes that variants
            in this region may be associated with a less severe extracutaneous phenotype.
          clinical_significance: PATHOGENIC
        - name: c.1886T>G p.(Phe629Cys)
          description: De novo missense variant in an adult with cirrhosis and steroid-responsive interstitial
            pneumonia.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: The mutation segregated with the disease in one large pedigree, and mutations were de
          novo in two other pedigrees.
        supports: SUPPORT
    origin:
