              term:
                id: hgnc:24200
                label: FAM111B
            relationship_type: CAUSATIVE
            notes: Heterozygous germline variants, inherited in about half of affected individuals and
              de novo in the other half. Most are missense variants clustered at codons 621 to 629 near
              the C-terminal trypsin-like peptidase domain; a second group lies around codons 416 to 430
              (p.Phe416Ser, p.Lys421del, p.Gln430Pro). The original variants were absent from public databases
              and from 388 ethnically matched controls. In the main series, variants at codons 625, 627
              and 628 were associated with earlier onset and more severe disease than those at codons
              430 and 621, a preliminary observation from a small number of patients. No deletion or duplication
              has been reported.
          role: ancestor
      assertion_type: Variant
      assertion:
