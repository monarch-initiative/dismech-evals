        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: ATL3-related hereditary sensory neuropathy (HSN1F)
        description: ATL3 encodes atlastin-3, a paralogue of ATL1 and, like it, an ER-shaping GTPase.
          Dominant ATL3 mutations cause a clinically near-identical autosomal dominant sensory neuropathy
          with loss of pain perception and destruction of the pedal skeleton (HSN1F). Because the two
          atlastin genes produce overlapping ulcero-mutilating sensory phenotypes, distinguishing HSN1D
          (ATL1) from HSN1F (ATL3) requires molecular testing — this is the principal named-entity confusion
          hazard for this entry.
