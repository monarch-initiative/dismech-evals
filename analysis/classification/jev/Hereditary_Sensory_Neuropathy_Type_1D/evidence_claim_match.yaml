              id: MONDO:0013381
              label: neuropathy, hereditary sensory, type 1D
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hsn1d_spg3a_selective_vulnerability
        prompt: Why do heterozygous loss-of-GTPase-activity ATL1 variants cause a length-dependent sensory
          neuropathy of long peripheral sensory axons in HSN1D, while other ATL1 variants (and sometimes
          the same N355K allele within one family) cause a corticospinal motor axonopathy in SPG3A?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Tubular ER Network
        - pathophysiology#Distal Degeneration of Long Sensory Axons
        rationale: HSN1D and SPG3A are allelic (both from ATL1 / atlastin-1 dysfunction) and share the
          same cellular lesion — a disrupted tubular ER network from impaired homotypic ER fusion — yet
          they target different long-axon populations (peripheral sensory versus corticospinal motor).
          The N355K family even shows both sensory neuropathy and pyramidal-tract features, blurring the
          boundary. What determines whether sensory or motor long axons degenerate is not established,
          so treating a shared ER-shaping defect as fully explaining the phenotype would overstate current
          knowledge.
      selected_evidence:
        snippet: This study highlights an unexpected major role for atlastin-1 in the function of sensory
          neurons and identifies HSN I and SPG3A as allelic disorders.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
