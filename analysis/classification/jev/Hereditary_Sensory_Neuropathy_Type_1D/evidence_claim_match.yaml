      assertion_type: Genetic
      assertion:
        name: ATL1
        gene_term:
          preferred_term: ATL1 (atlastin-1)
          term:
            id: hgnc:11231
            label: ATL1
        association: Causal
        notes: Heterozygous dominant ATL1 variants cause HSN1D. Reported alleles include p.Asn355Lys (c.1065C>A),
          p.Glu66Gln (c.196G>C), and the frameshift p.Val326TrpfsX8 (c.976delG). ATL1 is allelic with
          SPG3A hereditary spastic paraplegia (both ATL1-encoded atlastin-1 disorders). Across the wider
          ATL1 mutational spectrum, most mutations are missense, exons 4, 7, 8 and 12 are mutation hotspots,
          and there is no clear genotype-phenotype correlation — the same allele can give sensory-predominant
          (HSN1D) or motor-predominant (SPG3A) disease.
      selected_evidence:
        snippet: We also find that exons 4, 7, 8 and 12 are mutation hotspots in ATL1 gene.
        supports: SUPPORT
