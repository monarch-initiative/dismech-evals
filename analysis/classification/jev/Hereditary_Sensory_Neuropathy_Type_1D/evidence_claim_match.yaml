      assertion_type: Discussion
      assertion:
        discussion_id: hsn1d_cos7_model_fidelity
        prompt: Do the ER-morphology defects seen when HSN1D atlastin-1 mutants are expressed in COS-7
          (a non-neuronal African green monkey kidney line) faithfully represent the pathology of long
          human peripheral sensory axons?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Tubular ER Network
        - experimental_models#COS-7 heterologous expression of mutant atlastin-1
        rationale: The evidence that HSN1D atlastin-1 disrupts the tubular ER network comes from heterologous
          overexpression in COS-7 cells, not from human dorsal root ganglion neurons. The COS-7 readout
          establishes that the mutant protein is functionally defective for ER shaping, but the disease-relevant
          question — why long peripheral sensory axons specifically degenerate — cannot be answered in
          a non-neuronal line that lacks the length-dependent axonal architecture. Evidence exists in
          the model; its translational validity for long sensory axons is the open question.
      selected_evidence:
        snippet: The mutant protein exhibited reduced GTPase activity and prominently disrupted ER network
          morphology when expressed in COS7 cells, strongly supporting pathogenicity.
        supports: SUPPORT
