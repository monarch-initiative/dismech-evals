              label: neuropathy, hereditary sensory, type 1D
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous ATL1 Variant with Reduced Atlastin-1 GTPase Activity
        biological_scale: MOLECULAR
        description: HSN1D is caused by heterozygous dominant ATL1 variants (e.g. the missense p.Asn355Lys
          and p.Glu66Gln alleles and the p.Val326TrpfsX8 frameshift) that reduce the GTPase activity of
          atlastin-1, a large dynamin-related GTPase. Reduced GTPase activity is the shared molecular
          defect, and because the disease is dominant with truncating alleles among the mutations, both
          dominant-negative and haploinsufficiency effects have been proposed; the primary study demonstrated
          reduced GTPase activity and disrupted ER morphology for the mutant protein.
        genes:
        - preferred_term: ATL1 (atlastin-1)
          term:
            id: hgnc:11231
            label: ATL1
        molecular_functions:
        - preferred_term: atlastin-1 GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          modifier: DECREASED
      selected_evidence:
        snippet: We detected a missense mutation (c.1065C>A, p.Asn355Lys) in atlastin-1 (ATL1), a gene
          that is known to be mutated in early-onset hereditary spastic paraplegia SPG3A and that encodes
          the large dynamin-related GTPase atlastin-1. The mutant protein exhibited reduced GTPase activity
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
