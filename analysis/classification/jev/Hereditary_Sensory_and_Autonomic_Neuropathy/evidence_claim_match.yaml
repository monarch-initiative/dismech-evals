              label: hereditary sensory and autonomic neuropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neurotoxic Deoxysphingolipid Formation
        description: Gain-of-function mutations in SPTLC1 (HSAN1), the LCB1 subunit of serine palmitoyltransferase,
          shift the enzyme's substrate specificity so that it condenses alanine (instead of serine) with
          palmitoyl-CoA, generating atypical 1-deoxysphingolipids that are neurotoxic to sensory neurons
          and accumulate in patient serum.
        cell_types:
        - preferred_term: Sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        biological_processes:
        - preferred_term: Sphingolipid biosynthetic process
          term:
            id: GO:0030148
            label: sphingolipid biosynthetic process
          modifier: ABNORMAL
        genes:
        - preferred_term: SPTLC1
          term:
            id: hgnc:11277
            label: SPTLC1
      selected_evidence:
        snippet: Serum from patients and transgenic mice expressing a disease-causing mutation (C133W)
          contain elevated levels of 1-deoxysphinganine (1-deoxySa), which presumably arise from inappropriate
          condensation of alanine with palmitoyl-CoA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20504773
      reference_title: A disease-causing mutation in the active site of serine palmitoyltransferase causes
        catalytic promiscuity.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates accumulation of neurotoxic 1-deoxysphinganine from the SPTLC1 mutation,
        the HSAN1 mechanism.
