      assertion:
        name: Sensory and Autonomic Neuron Degeneration
        description: 'The shared terminal node of HSAN. The diverse upstream lesions (deoxysphingolipid
          toxicity, NGF-TrkA neurotrophic failure, Elongator deficiency, HSN2/WNK1 maintenance loss) converge
          on reduction, loss, or developmental failure of peripheral sensory (dorsal root ganglion) and
          autonomic neurons — with prominent small-fiber involvement. The resulting deficit is sensory-
          and autonomic-predominant: impaired pain, temperature, and touch sensation (frequently with
          painless injuries and acral mutilation) and autonomic dysfunction, in contrast to the motor-predominant
          CMT compartments.'
