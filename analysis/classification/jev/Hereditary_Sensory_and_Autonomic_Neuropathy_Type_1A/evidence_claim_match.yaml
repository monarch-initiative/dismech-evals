            term:
              id: CHEBI:17115
              label: L-serine
      selected_evidence:
        snippet: 'CONCLUSION: High-dose oral l-serine supplementation appears safe in patients with HSAN1
          and is potentially effective at slowing disease progression.'
        supports: SUPPORT
