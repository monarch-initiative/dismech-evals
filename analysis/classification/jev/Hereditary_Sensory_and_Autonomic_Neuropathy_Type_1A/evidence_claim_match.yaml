  6aa6a7d3f808027c95b7312cf44adb76a98a72a0badf3869534f2d5ef13c914d:
    claim:
      about:
        disease:
          name: Hereditary Sensory and Autonomic Neuropathy Type 1A
          disease_term:
            preferred_term: neuropathy, hereditary sensory and autonomic, type 1A
            term:
              id: MONDO:0008086
              label: neuropathy, hereditary sensory and autonomic, type 1A
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SPTLC1 Variant Shifts Serine Palmitoyltransferase Substrate Preference
        biological_scale: MOLECULAR
        description: Serine palmitoyltransferase catalyses the condensation of palmitoyl-CoA with L-serine,
          the first and rate-limiting step of de novo sphingolipid synthesis. HSAN1A variants in the SPTLC1
          subunit enhance the enzyme's activation of L-alanine and of glycine as alternative substrates,
          so the mutant enzyme makes products the wild-type enzyme makes only in trace amounts. Kinetic
          work on C133W found wild-type and mutant enzymes to have similar affinities for both serine
          and alanine, locating the defect in activation of alanine rather than in substrate binding,
          which is why the variant is curated as neomorphic rather than as a loss of function.
        molecular_functions:
        - preferred_term: serine C-palmitoyltransferase activity
          term:
            id: GO:0004758
            label: serine C-palmitoyltransferase activity
          modifier: DYSREGULATED
        genetic_context:
          gene:
            preferred_term: SPTLC1
            term:
              id: hgnc:11277
              label: SPTLC1
          functional_impact_category: NEOMORPHIC
      selected_evidence:
        snippet: Here we show that the HSAN1 mutations induce a shift in the substrate specificity of
          SPT, which leads to the formation of the two atypical deoxy-sphingoid bases (DSBs) 1-deoxy-sphinganine
          and 1-deoxymethyl-sphinganine.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
