            biological_scale: MOLECULAR
            description: 1-deoxysphinganine and 1-deoxymethylsphinganine lack the C1 hydroxyl group of
              a canonical sphingoid base. That hydroxyl is required both for conversion into complex sphingolipids
              and for entry into the normal degradation route, so these metabolites accumulate rather
              than turning over. They are elevated in the plasma of patients carrying several different
              SPTLC1 alleles, which makes this node the disease's accessible biomarker as well as its
              mechanism.
            biological_processes:
            - preferred_term: sphingolipid biosynthetic process
              term:
