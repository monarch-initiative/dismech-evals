      assertion_type: Pathophysiology
      assertion:
        name: Retinal Deoxysphingolipid Toxicity
        biological_scale: TISSUE
        description: Deoxysphingolipids also affect the macula. Lowering serine in mice raised retinal
          deoxysphingolipid levels and compromised visual function, and the metabolites killed photoreceptors
          in human retinal organoids. Most HSAN1 patients examined ophthalmologically have macular telangiectasia
          type 2, which is otherwise an orphan disease, so the ocular phenotype is part of the SPT substrate-shift
          syndrome rather than a coincidence.
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        locations:
        - preferred_term: macula lutea
          term:
            id: UBERON:0000053
            label: macula lutea
      selected_evidence:
        snippet: Elevated levels of atypical deoxysphingolipids, caused by variant SPTLC1 or SPTLC2 or
          by low serine levels, were risk factors for macular telangiectasia type 2, as well as for peripheral
          neuropathy.
        supports: SUPPORT
