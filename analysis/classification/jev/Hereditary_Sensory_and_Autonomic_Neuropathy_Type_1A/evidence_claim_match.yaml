              label: neuropathy, hereditary sensory and autonomic, type 1A
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Sptlc1 p.S331F knock-in mouse
        species: Mouse
        genotype: heterozygous Sptlc1 c.992C>T (p.S331F) knock-in, C57BL/6NTac-Sptlc1em1H
        publication: PMID:41124364
        description: 'A CRISPR-generated knock-in carrying the mutation at the endogenous locus, rather
          than a transgene, and therefore at the human gene dose. It reproduces the biochemistry faithfully:
          plasma 1-deoxysphingolipids are raised at every age measured, highest at postnatal day 7 and
          falling with age, and they drop on allele-specific silencing. It does not reproduce the neuropathy
          at the ages studied, which is why it is curated with both a RECAPITULATES and a FAILS_TO_RECAPITULATE
          link. Transcriptomics in its dorsal root ganglia implicates mitochondrial pathways, consistent
          with the calcium and mitochondrial findings in cultured neurons.'
        modeled_mechanisms:
        - target: 1-Deoxysphingolipid Accumulation
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: The knock-in raises the disease metabolite in plasma at the endogenous gene dose,
            and the elevation is reversible by silencing the mutant allele.
          readouts:
          - name: Plasma 1-deoxysphingolipid level across postnatal ages
            target: 1-Deoxysphingolipid Accumulation
            direction: INCREASED
            interpretation: The metabolite is raised against age-matched wild-type controls at every time
              point measured, which is the biochemical claim of this link.
          - name: Plasma 1-deoxysphingolipid level after allele-specific silencing
            target: 1-Deoxysphingolipid Accumulation
            direction: DECREASED
            interpretation: Silencing the mutant transcript lowers the metabolite, which ties the elevation
              to the mutant allele rather than to the strain.
        - target: Sensory and Motor Neuron Toxicity
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: At the ages studied the mouse shows no prominent neurophysiological or pathological
            abnormality, although the human S331F phenotype is severe and early in onset.
          limitations: 'The mismatch is at least partly one of timing: the authors compare it with the
            C133W transgenic, where no distinct neuropathy appeared until adulthood, and their experiments
            were designed around young adults. But as studied, this model supports the biochemical arm
            of the mechanism and not the degeneration it is supposed to cause, so an efficacy claim resting
            on the metabolite alone in this model is a surrogate one.'
      selected_evidence:
        snippet: we validated an allele-specific ASO therapy to selectively silence mutant SPTLC1 (p.S331F)
          in a disease mouse model carrying a heterozygous p.S331F mutation (S331F mice)
        supports: SUPPORT
