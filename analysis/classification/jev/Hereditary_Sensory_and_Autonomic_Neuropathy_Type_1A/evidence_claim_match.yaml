        context: []
      assertion_type: Environmental
      assertion:
        name: Dietary L-alanine and L-serine availability
        description: 'The mutant enzyme''s output depends on which amino acid is available to it, so the
          balance between L-alanine and L-serine in the diet sets how much of the toxic metabolite is
          made. This is the basis of the L-serine treatment and, in the opposite direction, of the alanine-enriched
          diet that worsened the mouse phenotype. It is recorded here as a modifier of an inherited disease,
          not as a cause: the evidence is a mouse feeding experiment and a cell-culture titration, and
          no dietary exposure has been shown to cause or worsen the human disease.'
        exposure_term:
          preferred_term: dietary L-alanine intake
          term:
            id: ECTO:9002707
            label: exposure to L-alanine
      selected_evidence:
        snippet: In vivo synthesis of 1-deoxySa by the mutant enzyme was proportional to the ratio of
          alanine to serine in the growth media, suggesting that this ratio can be used to modulate the
          relative synthesis of sphinganine and 1-deoxySa.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
