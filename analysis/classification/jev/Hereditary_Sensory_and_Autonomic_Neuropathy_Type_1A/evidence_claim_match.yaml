              label: neuropathy, hereditary sensory and autonomic, type 1A
        context: []
      assertion_type: Treatment
      assertion:
        name: Allele-Specific Antisense Oligonucleotide Silencing of Mutant SPTLC1
        description: Preclinical only. Because the disease is caused by a product the mutant allele makes
          rather than by loss of the normal one, silencing the mutant transcript and leaving the wild-type
          allele intact is mechanistically the right target. GalNAc-conjugated locked-nucleic-acid gapmer
          antisense oligonucleotides against the p.S331F allele achieved over 90% mutant transcript silencing
          in liver and dorsal root ganglia of S331F mice, lowered blood 1-deoxysphingoid bases and reversed
          the aberrant dorsal-root-ganglion gene expression. No human study has been performed, and the
          construct is allele specific, so it would have to be remade for each variant.
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        oligonucleotide_details:
          oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
          target_gene:
            preferred_term: SPTLC1
            term:
              id: hgnc:11277
              label: SPTLC1
          target_transcript: mutant SPTLC1 p.S331F transcript
          oligonucleotide_chemistry: LOCKED_NUCLEIC_ACID
        delivery_system:
          delivery_platform: CONJUGATE
          targeting_ligand: GALNAC
        treatment_term:
          preferred_term: allele-specific antisense oligonucleotide therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: antisense oligonucleotide
            term:
              id: NCIT:C1291
              label: Antisense Oligonucleotides
      selected_evidence:
        snippet: Single subcutaneous injection of ASOs into neonatal or adult S331F mice achieved over
          90% mutant transcript silencing in liver and dorsal root ganglia (DRG).
        supports: SUPPORT
