      assertion_type: ExperimentalModel
      assertion:
        name: HSN1 patient iPSC-derived sensory neurons
        experimental_model_type: IPSC_DERIVED_MODEL
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        publication: PMID:34337561
        description: Sensory neurons differentiated from patient induced pluripotent stem cells, used
          alone and in myelinating coculture. Unlike the neurotoxicity experiments that add deoxysphingoid
          bases to normal neurons, these cells make the metabolites themselves, so they test whether endogenous
          production at patient gene dose is enough to damage a human neuron. It is, and most of the changes
          are prevented by L-serine.
        modeled_mechanisms:
        - target: Sensory and Motor Neuron Toxicity
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Human sensory neurons carrying the patient genotype show reduced neurite outgrowth,
            disrupted nodal complexes in myelinating coculture and, by six months, myelin breakdown.
          limitations: 'A culture system: it has no length-dependence, no vasculature and no immune compartment,
            so it cannot show why the longest axons fail first, which is the defining feature of the clinical
            picture.'
          readouts:
          - name: Nodal complex integrity in myelinating coculture
            target: Sensory and Motor Neuron Toxicity
            direction: DECREASED
            interpretation: Progressive disruption of the axoglial junction, ending in myelin loss.
          - name: Deficits after L-serine supplementation
            target: Sensory and Motor Neuron Toxicity
            direction: RESTORED
            interpretation: Most of the cellular phenotype is preventable by supplying the canonical substrate,
              which is the model's support for the treatment principle.
      selected_evidence:
        snippet: We used induced pluripotent stem cells (iPSCs) from patients with HSN1 to determine whether
          endogenous DSBs are neurotoxic, patho-mechanisms of toxicity and response to therapy.
        supports: SUPPORT
