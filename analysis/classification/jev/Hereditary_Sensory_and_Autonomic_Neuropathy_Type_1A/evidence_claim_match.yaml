      assertion_type: Treatment
      assertion:
        name: Oral L-Serine Supplementation
        description: 'Substrate competition rather than enzyme replacement: supplying the canonical substrate
          in excess pushes the mutant enzyme back towards serine and away from alanine and glycine, lowering
          production of the neurotoxic deoxysphingolipids. It is the only disease-modifying treatment
          tested in a randomised trial in this disease. At 400 mg/kg/day for a year the treated group
          improved on the Charcot-Marie-Tooth Neuropathy Score relative to placebo while deoxysphinganine
          fell, with no serious treatment-related adverse effects.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: oral L-serine supplementation
          term:
