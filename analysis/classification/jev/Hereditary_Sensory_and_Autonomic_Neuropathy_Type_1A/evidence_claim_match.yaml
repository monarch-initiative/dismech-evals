        description: Deoxysphingoid bases are toxic to primary sensory and motor neurons in a dose- and
          time-dependent way, with disturbed endoplasmic-reticulum and mitochondrial calcium handling
          and early loss of mitochondrial membrane potential as proximate cellular effects, and with disturbed
          neurofilament structure in neurites. Degeneration is length-dependent, so the longest axons
          in the lower limbs fail first, which is why the clinical picture begins in the feet and why
          epidermal innervation is lost at the distal leg before the thigh.
        cell_types:
