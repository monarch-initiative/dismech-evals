        biological_scale: MOLECULAR
        description: Serine palmitoyltransferase catalyses the condensation of palmitoyl-CoA with L-serine,
          the first and rate-limiting step of de novo sphingolipid synthesis. HSAN1A variants in the SPTLC1
          subunit enhance the enzyme's activation of L-alanine and of glycine as alternative substrates,
          so the mutant enzyme makes products the wild-type enzyme makes only in trace amounts. Kinetic
          work on C133W found wild-type and mutant enzymes to have similar affinities for both serine
          and alanine, locating the defect in activation of alanine rather than in substrate binding,
          which is why the variant is curated as neomorphic rather than as a loss of function.
        molecular_functions:
