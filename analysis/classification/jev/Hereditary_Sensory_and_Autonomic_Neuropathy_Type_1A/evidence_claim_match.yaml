              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Retinal Deoxysphingolipid Toxicity
        description: The same metabolites reach the retina, where they cause photoreceptor death in human
          retinal organoids.
