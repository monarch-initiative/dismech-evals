              label: neuropathy, hereditary sensory and autonomic, type 1C
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SPTLC2 Missense Variant Alters Serine Palmitoyltransferase Substrate Preference
        biological_scale: MOLECULAR
        description: Serine palmitoyltransferase condenses palmitoyl-CoA with L-serine in the first and
          rate-limiting step of de novo sphingolipid synthesis. HSAN1 missense variants in the SPTLC1
          and SPTLC2 subunits impose a permanent shift in substrate preference from L-serine towards L-alanine.
          The variant enzyme therefore acquires an activity the wild-type enzyme does not have, which
          is why the genetic context is recorded as NEOMORPHIC rather than as a loss of function.
        molecular_functions:
        - preferred_term: serine C-palmitoyltransferase activity
          term:
            id: GO:0004758
            label: serine C-palmitoyltransferase activity
          modifier: DYSREGULATED
        genetic_context:
          gene:
            preferred_term: SPTLC2
            term:
              id: hgnc:11278
              label: SPTLC2
          functional_impact_category: NEOMORPHIC
      selected_evidence:
        snippet: We demonstrate that these mutations result in a partial to complete loss of SPT activity
          in vitro and in vivo.
        supports: REFUTE
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
