            term:
              id: MONDO:0019941
              label: hereditary sensory and autonomic neuropathy type 2
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Congenital Insensitivity to Pain
        description: HSAN4/5 (NTRK1, NGF) and the SCN9A-related pain insensitivities also present with
          painless mutilation, but the sensory loss there is selective for pain (and, in HSAN4, accompanied
          by anhidrosis and intellectual disability) with preserved touch and vibration. HSAN2 involves
          all sensory modalities including large-fibre function.
      selected_evidence:
        snippet: Children with the very rare HSAN type V respond normally to tactile, vibratory or thermal
          stimuli, but have a selective loss of pain perception with otherwise normal neurological examination.
        supports: SUPPORT
