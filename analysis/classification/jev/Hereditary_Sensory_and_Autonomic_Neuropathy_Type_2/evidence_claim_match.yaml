  da818cd1c8390c6d13415ea24a7bbcd1c556f68162015891efb367d3b593d7a8:
    claim:
      about:
        disease:
          name: Hereditary Sensory and Autonomic Neuropathy Type 2
          disease_term:
            preferred_term: hereditary sensory and autonomic neuropathy type 2
            term:
              id: MONDO:0019941
              label: hereditary sensory and autonomic neuropathy type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Axonal Transport and Golgi Homeostasis in Sensory Neurons
        description: 'The three HSAN2 gene products converge on the intracellular logistics of the sensory
          neuron. KIF1A transports synaptic vesicle precursors down the axon and physically interacts
          with the domain encoded by the HSN2 exon of WNK1; RETREG1/FAM134B maintains cis-Golgi structure.
          The convergence, rather than any one gene''s individual function, is the argument that HSAN2
          is one mechanistic entity: the sensory neuron has an exceptionally long axon and is correspondingly
          intolerant of defects in cargo transport and secretory-pathway organization.'
        role: amplifier
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        biological_processes:
        - preferred_term: axonal transport
          term:
            id: GO:0098930
            label: axonal transport
          modifier: DECREASED
        cellular_components:
        - preferred_term: cis-Golgi network
          term:
            id: GO:0005801
            label: cis-Golgi network
          modifier: ABNORMAL
      selected_evidence:
        snippet: Using a yeast two-hybrid screen, we found that KIF1A, an axonal transporter of synaptic
          vesicles, interacts with the domain encoded by the HSN2 exon.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21820098
      reference_title: KIF1A, an axonal transporter of synaptic vesicles, is mutated in hereditary sensory
        and autonomic neuropathy type 2.
      evidence_source: IN_VITRO
      explanation: Establishes a direct physical link between two of the three HSAN2 gene products, supporting
