      assertion_type: Pathophysiology
      assertion:
        name: Autonomic Dysfunction
        description: 'Autonomic involvement that is real but milder and more variable than in familial
          dysautonomia: acral anhidrosis, tonic pupils, eating and swallowing difficulty, constipation,
          episodic fever, hypotonia and episodes of apnoea. The autonomic ganglion neurons are lost by
          the same mechanism as the sensory ones, which is why the autonomic features track the sensory
          ones rather than forming a separate disease axis.'
        role: effector
        biological_scale: ORGANISM
        cell_types:
        - preferred_term: autonomic neuron
          term:
            id: CL:0000107
            label: autonomic neuron
      selected_evidence:
        snippet: There are acral anhidrosis and various autonomic dysfunctions such as tonic pupils, eating
          and swallowing difficulties, constipation, episodic fever, profound hypotonia and episodes of
          apnea.
        supports: SUPPORT
