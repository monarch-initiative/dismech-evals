  059bf53ab8cb1dcf299b88d76a158ef0c4a357636eeaf073026195c7ebc11d94:
    claim:
      about:
        disease:
          name: Hereditary Sensory and Autonomic Neuropathy Type 2
          disease_term:
            preferred_term: hereditary sensory and autonomic neuropathy type 2
            term:
              id: MONDO:0019941
              label: hereditary sensory and autonomic neuropathy type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Peripheral Sensory Neurons
        description: 'The rate-limiting lesion of the disorder: reduction or absence of peripheral sensory
          neurons. The primary lesion is at the cell body: dorsal root ganglion neurons are reduced or
          absent, rather than surviving while their distal axons die back. That is what makes the deficit
          multimodal, affecting large and small fibres alike rather than being pain-selective.

          It does NOT make the deficit anatomically uniform. GeneReviews reports the sensory deficit as
          predominantly distal with the lower limbs more severely affected, so cell-body loss and a distal
          clinical gradient coexist here. An earlier revision of this entry claimed the deficit was "universal
          rather than distally graded" and used that to justify declining module conformance; the distribution
          claim was wrong, and the conformance decision is re-argued in `notes` on the correct basis.'
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        - preferred_term: nociceptor
          term:
            id: CL:0000198
            label: pain receptor cell
        locations:
        - preferred_term: dorsal root ganglion
          term:
            id: UBERON:0000044
            label: dorsal root ganglion
      selected_evidence:
        snippet: impairment of pain, temperature, and touch sensation owing to reduction or absence of
          peripheral sensory neurons
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
