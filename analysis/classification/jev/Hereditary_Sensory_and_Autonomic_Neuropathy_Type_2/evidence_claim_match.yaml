      assertion:
        name: Hereditary Sensory and Autonomic Neuropathy
        description: HSAN1 (autosomal dominant, SPTLC1) presents between the second and fourth decades
          with ulcers and mutilation of the lower limbs, and HSAN3 (familial dysautonomia) with pronounced
          sympathetic dysregulation in children of Ashkenazi Jewish ancestry. HSAN2 is distinguished from
          both by its infantile onset, recessive inheritance, and universal rather than distally graded
          sensory loss.
      selected_evidence:
        snippet: The slowly progressive, symmetrical HSAN type I manifests between the second and fourth
          decade with ulcers or mutilations of the lower extremities
        supports: SUPPORT
