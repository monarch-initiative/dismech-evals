      assertion:
        name: Loss-of-Function Variant in a Sensory Neuron Maintenance Gene
        description: 'A biallelic truncating or loss-of-function variant in one of three genes required
          for the long-term maintenance of dorsal root ganglion sensory neurons: the nervous-system-specific
          HSN2 exon of WNK1, RETREG1/FAM134B, or KIF1A. Two of the three are restricted to alternatively
          spliced, nervous-system-specific exons, which is what makes the resulting disease a pure sensory
          neuronopathy rather than part of the multisystem phenotype those genes'' other isoforms produce.'
        genes:
        - preferred_term: WNK1
