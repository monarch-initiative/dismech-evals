          term:
            id: GO:0071786
            label: endoplasmic reticulum tubular network organization
          modifier: DECREASED
      selected_evidence:
        snippet: Mutations in 3 genes encoding proteins that work together to shape the ER into sheets
          and tubules - receptor accessory protein 1 (REEP1), atlastin-1 (ATL1), and spastin (SPAST) -
          have been found to underlie many cases of HSP in Northern Europe and North America.
