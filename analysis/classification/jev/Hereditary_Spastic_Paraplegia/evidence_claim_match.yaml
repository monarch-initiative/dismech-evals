      assertion:
        name: Spastin Microtubule-Severing Defect (SPG4)
        genes:
        - preferred_term: SPAST
          term:
            id: hgnc:11233
            label: SPAST
        conforms_to: corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect
        description: 'Spastin, encoded by SPAST (SPG4), is a microtubule-severing AAA ATPase that assembles
          into a hexameric ring and remodels neuronal microtubule arrays by pulling the C-terminal tail
          of tubulin through its central pore to generate a mechanical force that destabilizes the microtubule
          lattice. Pathogenic SPAST variants impair this severing activity, disrupting the dynamic microtubule
          cytoskeleton required for axonal transport and organelle distribution in long corticospinal-tract
          axons. Spastin loss-of-function also disrupts cytoarchitectural integrity and organellar stability
          (mitochondrial and ER) in corticospinal motor neurons, contributing to selective UMN vulnerability.

          '
        cell_types:
        - preferred_term: Upper motor neuron (corticospinal tract)
          term:
            id: CL:0008048
            label: upper motor neuron
        biological_processes:
        - preferred_term: Microtubule severing
          term:
            id: GO:0051013
            label: microtubule severing
          modifier: DECREASED
        - preferred_term: Axonal transport
          term:
            id: GO:0098930
            label: axonal transport
          modifier: DECREASED
        - preferred_term: Mitochondrion organization
          term:
            id: GO:0007005
            label: mitochondrion organization
          modifier: DECREASED
        - preferred_term: Endoplasmic reticulum organization
          term:
            id: GO:0007029
            label: endoplasmic reticulum organization
          modifier: DECREASED
      selected_evidence:
        snippet: "Spastin, the most common locus for mutations in hereditary spastic paraplegias, \nand\
          \ katanin are related microtubule-severing AAA ATPases"
        supports: SUPPORT
