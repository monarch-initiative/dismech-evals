          insidiously progressive bilateral lower-limb spasticity and weakness with hyperreflexia, crossed
          adductor signs, and extensor plantar (Babinski) responses. Spasticity is greatest in hamstring,
          quadriceps, adductor, and gastrocnemius-soleus muscles; weakness is most prominent in iliopsoas,
          hamstring, and tibialis anterior. This is the shared functional consequence of all genetic forms
          of HSP.

