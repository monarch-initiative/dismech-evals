          by reticulon 2 (SPG12) and REEP2 (SPG72), which also belongs to that ER-shaping family and whose
          original report found altered ER in fibroblasts from an affected subject. Reticulon 2 interacts
          with spastin through a hydrophobic region of spastin involved in ER localisation, placing these
          proteins in one interaction network, and the reticulon-2 work supports abnormal ER morphogenesis
          as a pathogenic mechanism in HSP. In SPG31 the molecular genetic mechanism is haploinsufficiency
          of REEP1.

          '
