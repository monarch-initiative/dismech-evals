          to mitochondria. In the series of 25 families that established the gene, phenotypes ranged from
          juvenile-onset pure hereditary spastic paraplegia to infantile-onset spasticity with global
          developmental delay, so one gene accounts for both pure and complex presentations; the juvenile-onset
          pure presentation is the reason this subtype is recorded here. A later patient-registry study
          separates the spectrum into severe, intermediate and mild classes with onset in early infancy,
          childhood and adolescence respectively, and correlates biallelic truncating genotypes with the
          severe end.

          '
