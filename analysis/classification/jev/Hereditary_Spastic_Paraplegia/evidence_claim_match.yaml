        display_name: Pure (Uncomplicated) Hereditary Spastic Paraplegia
        description: 'Clinical classification in which lower-extremity spasticity and weakness, with subtle
          lower-extremity dorsal-column (vibration sense) impairment and urinary urgency, are the predominant
          or only manifestations. Affected individuals typically have normal life expectancy and do not
          develop significant upper-extremity, bulbar, or cognitive involvement. SPG4 (SPAST) is the prototypical
          and single most common cause of pure autosomal dominant HSP.

          '
      selected_evidence:
        snippet: “uncomplicated” (characterized by lower extremity spasticity and weakness and subtle
          lower extremity dorsal column impairment)
