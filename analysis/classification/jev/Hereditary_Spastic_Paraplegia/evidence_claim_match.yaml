          protein quality by degrading damaged or unassembled respiratory-chain subunits. Loss of paraplegin
          function impairs oxidative phosphorylation; SPG7 patient cells show fragmented mitochondria,
          reduced mitochondrial mass and membrane potential, impaired oxidative phosphorylation with reduced
          ATP, and increased mitochondrial oxidative stress, providing a bioenergetic mechanism for corticospinal-tract
          neurodegeneration.

          '
