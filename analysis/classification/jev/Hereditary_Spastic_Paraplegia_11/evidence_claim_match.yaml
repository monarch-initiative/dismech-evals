            term:
              id: MONDO:0011445
              label: hereditary spastic paraplegia 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Accumulation of Undegraded Autolysosomal Material in Vulnerable Neurons
        biological_scale: CELLULAR
        description: Impaired autolysosomal clearance leaves undegraded material inside neurons. In spatacsin-knockout
          mice the degenerating neurons accumulate autofluorescent material that stains for the lysosomal
          protein Lamp1 and for p62, the marker of substrate destined for autophagic degradation, and
          lipidated LC3 is raised - a generalized autophagy defect rather than a lysosome-specific one.
          The burden falls on particularly sensitive neurons, and the two populations that degenerate
          in the mouse are cortical motor neurons and cerebellar Purkinje cells, which correspond to the
          corticospinal and cerebellar features of the human disease.
        cell_types:
        - preferred_term: cortical motor neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: macroautophagy
          term:
            id: GO:0016236
            label: macroautophagy
          modifier: DECREASED
      selected_evidence:
        snippet: Degenerating neurons accumulate autofluorescent material, which stains for the lysosomal
          protein Lamp1 and for p62, a marker of substrate destined to be degraded by autophagy, and hence
          appears to be related to autolysosomes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
