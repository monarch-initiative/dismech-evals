            term:
              id: MONDO:0011445
              label: hereditary spastic paraplegia 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Spatacsin Loss of Function
        conforms_to: corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect
        biological_scale: MOLECULAR
        description: Biallelic loss-of-function variants in SPG11 abolish spatacsin. Spatacsin is an essential
          component of autophagic lysosome reformation, the pathway that regenerates free lysosomes out
          of autolysosomes once autophagic degradation is complete, and it acts in the same step as spastizin,
          the product of the other common autosomal recessive HSP gene SPG15. Both proteins are required
          for the initiation of the lysosomal tubulation that pinches off new lysosomes. This places SPG11
          in the endolysosomal and membrane-traffic category of HSP genes, alongside the AP-4 and AP-5
          complex disorders.
        gene:
          preferred_term: SPG11
          term:
            id: hgnc:11226
            label: SPG11
        biological_processes:
        - preferred_term: lysosome organization
          term:
            id: GO:0007040
            label: lysosome organization
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Here, we have demonstrated that the two most common autosomal recessive hereditary spastic
          paraplegia gene products, the SPG15 protein spastizin and the SPG11 protein spatacsin, are pivotal
          for autophagic lysosome reformation (ALR), a pathway that generates new lysosomes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25365221
      reference_title: Spastic paraplegia proteins spastizin and spatacsin mediate autophagic lysosome
        reformation.
      evidence_source: IN_VITRO
      explanation: Identifies the molecular function lost in this node and places spatacsin in the same
        pathway step as the SPG15 protein. Evidence source is IN_VITRO because the pathway assignment
        rests on cell-based loss-of-function experiments.
