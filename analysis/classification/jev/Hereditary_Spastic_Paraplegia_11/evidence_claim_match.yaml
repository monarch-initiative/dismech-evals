            term:
              id: MONDO:0011445
              label: hereditary spastic paraplegia 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Autophagic Lysosome Reformation and Lysosome Depletion
        biological_scale: CELLULAR
        description: 'Loss of spatacsin depletes the pool of free lysosomes that are competent to fuse
          with incoming autophagosomes, while autolysosomes accumulate - the signature of a blocked reformation
          step rather than a blocked degradation step. Lysosomal function per se is largely preserved:
          cathepsin D processing and lysosomal pH are normal in spatacsin-null cells, and what is reduced
          is the number of lysosomes, not their competence. The distinction matters, because it makes
          SPG11 a disorder of lysosome supply rather than a classical lysosomal storage disease.'
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: DECREASED
        - preferred_term: lysosome organization
          term:
            id: GO:0007040
            label: lysosome organization
          modifier: DECREASED
      selected_evidence:
        snippet: Loss of spastizin or spatacsin resulted in depletion of free lysosomes, which are competent
          to fuse with autophagosomes, and an accumulation of autolysosomes, reflecting a failure in ALR.
        supports: SUPPORT
