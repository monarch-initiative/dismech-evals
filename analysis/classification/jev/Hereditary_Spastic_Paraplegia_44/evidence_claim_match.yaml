            term:
              id: MONDO:0013179
              label: hereditary spastic paraplegia 44
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
        description: 'Cx47 is the oligodendrocyte partner in the panglial network: Cx47/Cx43 channels
          join oligodendrocytes to astrocytes, and Cx47 also contributes to oligodendrocyte-oligodendrocyte
          coupling. The SPG44 allele does form overlapping plaques and channels with Cx43, but those channels
          open only when a large voltage difference is applied across the paired cells - a condition the
          founding authors judge unlikely to be met physiologically. The functional result is therefore
          the same disruption of astrocyte-oligodendrocyte coupling that the ER-retained PMLD1 mutants
          cause, reached by a different molecular route.

          That this coupling is what matters, rather than Cx47 protein presence, is what the mouse genetics
          show: removing Cx47 alone leaves the animal essentially well, while removing Cx47 together with
          the astrocytic or the second oligodendrocytic connexin abolishes oligodendrocyte-to-astrocyte
          coupling and produces overt myelin disease.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        molecular_functions:
        - preferred_term: heterotypic Cx47/Cx43 gap junction channel activity
          modifier: DECREASED
          term:
            id: GO:0005243
            label: gap junction channel activity
      selected_evidence:
        snippet: These channels probably do not function under physiological conditions, suggesting that
          Cx47/Cx43 channels between astrocytes and oligodendrocytes are disrupted, similar to the loss-of-function
          endoplasmic reticulum-retained Cx47 mutants that cause PMLD.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
