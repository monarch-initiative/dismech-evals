              label: hereditary spastic paraplegia 44
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Brainstem Auditory Evoked Potentials to Separate GJC2 from PLP1 Disease
        description: 'GJC2 disease and PLP1-related Pelizaeus-Merzbacher disease are described as almost
          indistinguishable clinically and radiologically, and both can present as a hypomyelinating leukoencephalopathy
          with spasticity. Brainstem auditory evoked potentials separate them: waves III-V were absent
          in every PLP1 patient studied and clearly recordable in most GJC2 patients. In a patient whose
          pedigree is compatible with either, this is a cheap test that points at the right gene first.

          The same series found nerve conduction studies normal in all PLP1 patients and indicating mild
          peripheral neuropathy in 2 of 10 GJC2 patients - worth knowing when interpreting a mildly abnormal
          NCS, though those patients carried the severe PMLD alleles rather than the SPG44 ones and no
          peripheral neuropathy is reported in either published SPG44 family.'
      selected_evidence:
        snippet: In brainstem auditory EP, waves III-V were absent in all patients with PMD, but clearly
          recordable in 11 of 13 investigations in 8 patients with PMLD.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
