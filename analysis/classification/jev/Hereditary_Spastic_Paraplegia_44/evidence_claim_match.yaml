        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Connexin-47 Channel Loss of Function
        description: 'Biallelic hypomorphic GJC2 missense variants leave connexin-47 protein present and
          correctly delivered but unable to conduct. In transfected cells the p.I33M protein forms gap
          junction plaques at cell borders indistinguishable from wild-type Cx47, yet fails to form functional
          homotypic channels in both scrape-loading and dual whole-cell patch-clamp assays.

          This is the node that separates SPG44 from PMLD1 and it is worth being precise about why. The
          severe PMLD1 alleles are ER-retained and, in primary oligodendrocytes, switch on the unfolded
          protein response and apoptosis - loss of channel plus a proteotoxic gain of function. The SPG44
          allele shows wild-type-like distribution and no UPR or apoptotic activation. The lesion here
          is confined to conductance.'
        conforms_to: cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult
        biological_scale: MOLECULAR
        genes:
        - preferred_term: GJC2
          term:
            id: hgnc:17494
            label: GJC2
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          allele_type: VARIANT
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
        molecular_functions:
        - preferred_term: connexin-47 gap junction channel activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005243
            label: gap junction channel activity
        cellular_components:
        - preferred_term: gap junction plaque at the oligodendrocyte membrane
          term:
            id: GO:0005921
            label: gap junction
      selected_evidence:
        snippet: The mutant protein forms gap junction plaques at cell borders similar to wild-type (WT)
          Cx47 in transfected cells, but fails to form functional homotypic channels in scrape-loading
          and dual whole-cell patch clamp assays.
        supports: SUPPORT
