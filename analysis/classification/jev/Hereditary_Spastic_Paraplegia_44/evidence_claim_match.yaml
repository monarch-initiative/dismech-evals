              expression of human Cx32 rescued the severe demyelinating phenotype and prevented early
              mortality; an AAV vector delivering Cx47 under the myelin basic protein promoter, injected
              once at postnatal day 10, improved motor performance and survival and re-established dye
              transfer between oligodendrocytes.
            limitations: Both rescues are in the double knockout, which is a model of severe PMLD1 rather
              than of SPG44, and both intervene at postnatal day 10 or earlier - before the human disease
              would be diagnosed. What they establish for SPG44 is that the coupling defect is correctable
              in principle and that the target is the coupling rather than Cx47 protein identity; they
              do not establish a therapeutic window for a late-onset human disease.
