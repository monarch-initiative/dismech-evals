        prompt: One homozygous GJC2 variant produced complicated hereditary spastic paraplegia in a proband
          and full hypomyelinating leukodystrophy 2 in both of his sisters. If allele class does not determine
          which GJC2 disease a patient gets, what does?
        attaches_to:
        - genetic#GJC2
