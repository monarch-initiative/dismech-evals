        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: spg44_same_genotype_two_diagnoses
        kind: OPEN_QUESTION
        status: OPEN
        prompt: One homozygous GJC2 variant produced complicated hereditary spastic paraplegia in a proband
          and full hypomyelinating leukodystrophy 2 in both of his sisters. If allele class does not determine
          which GJC2 disease a patient gets, what does?
        attaches_to:
        - genetic#GJC2
        - pathophysiology#Connexin-47 Channel Loss of Function
        - disease#Hereditary Spastic Paraplegia 44
        rationale: 'The tidy account of GJC2 disease is a severity ladder set by allele class: ER-retained,
          UPR-activating alleles give infantile PMLD1/HLD2; a trafficking-competent but channel-dead allele
          gives late-onset SPG44. The functional work supports that ladder well - p.I33M shows wild-type-like
          distribution and no UPR or apoptotic activation, where p.P87S, p.Y269D and p.M283T show ER retention
          and both.

          The second SPG44 family breaks it. All three affected siblings are homozygous for the same novel
          c.14G>T (p.S5I) variant, and the proband has complicated HSP while both sisters have HLD2. Within
          one sibship, one genotype, two diagnoses. Their own authors read this as evidence for a shared
          pathophysiology across the GJC2 spectrum rather than as a challenge to the ladder, and both
          readings are available from the same observation.

          This is filed as an OPEN_QUESTION rather than a KNOWLEDGE_GAP because the relevant measurement
          has not merely been omitted - it is not clear what the measurement would be. Modifier alleles,
          differences in the astrocytic connexin partners, and stochastic developmental factors are all
          live candidates, and no source cited here distinguishes them.

          A practical consequence follows, and it is recorded in the counselling treatment entry: a recurrence
          in a family with a known "mild" GJC2 allele cannot be counselled as mild.'
      selected_evidence:
        snippet: Clinical evaluation of all patients showed two distinct GJC2-related phenotypes in this
          family; the proband presented a complicated form of HSP, whereas both his affected sisters presented
          a HLD2 phenotype.
        supports: SUPPORT
    origin:
