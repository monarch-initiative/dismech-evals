  b0f6d68b6e0985d95820787bfa1de306cb660e31b86a20810629e6225b3913dc:
    claim:
      about:
        disease:
          name: Hereditary Spastic Paraplegia 44
          disease_term:
            preferred_term: hereditary spastic paraplegia 44
            term:
              id: MONDO:0013179
              label: hereditary spastic paraplegia 44
        context: []
      assertion_type: Treatment
      assertion:
        name: Oligodendrocyte-Targeted AAV-GJC2 Gene Therapy (preclinical only)
        description: 'NOT A TREATMENT FOR PATIENTS. A single intracerebral injection of AAV.MBP.Cx47myc
          - the GJC2 coding sequence under the myelin basic protein promoter, so expression is restricted
          to oligodendrocytes - at postnatal day 10 improved motor performance and coordination and prolonged
          survival in Cx32/Cx47 double-knockout mice, with improvement in demyelination, oligodendrocyte
          apoptosis, inflammation and astrogliosis, and re-established gap-junctional dye transfer between
          oligodendrocytes.

          The mechanistic rationale is unusually direct for SPG44 in particular. The disease node this
          acts on is loss of channel function, and the SPG44 allele has been shown not to carry the ER-retention
          and proteotoxic arm that the severe alleles do - so there is no misfolded species to clear before
          a replacement connexin can work. A replacement strategy is matched to a clean loss of function
          in a way it would not be to a toxic gain of function.

          Two things keep this firmly preclinical. No human has been treated and no trial exists. And
          the model treated is the Cx32/Cx47 double knockout, which corresponds to severe PMLD1, not to
          the mild SPG44 course - so the rescue is demonstrated against a disease severity that SPG44
          patients do not have.'
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: Application of this oligodendrocyte-targeted somatic gene therapy at postnatal Day 10
          in groups of double knockout mice, a well characterized model of hypomyelinating leukodystrophy-2,
          resulted in significant improvement in motor performance and coordination at 1 month of age
          in treated compared to mock-treated mice, as well as prolonged survival.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
