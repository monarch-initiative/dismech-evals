        prompt: Cx47-null mice have vacuolated myelin but no overt phenotype, while humans homozygous
          for a channel-dead GJC2 allele develop progressive spastic paraplegia. Is the difference mouse
          connexin redundancy, or does the human allele do something a null does not?
        attaches_to:
        - animal_models#Cx47-null mouse (Gjc2 single knockout)
        - pathophysiology#Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
        - pathophysiology#Corticospinal Tract Dysfunction and Progressive Spastic Paraparesis
        rationale: 'Evidence exists in the model; what is uncertain is whether it transfers.

          Established in mouse: deleting Cx47 alone leaves animals fertile and behaviourally normal with
          a purely ultrastructural myelin lesion. Deleting Cx47 together with the second oligodendrocytic
          connexin Cx32 gives action tremor and death at around 51 days. Deleting it together with the
          astrocytic Cx30 abolishes oligodendrocyte-to-astrocyte coupling, causes severe vacuolation in
          all white-matter tracts, and kills about 40% of animals within 42-90 days. The mouse therefore
          needs two connexins removed to become ill.

          Established in human: two families homozygous for GJC2 missense alleles develop hypomyelinating
          leukoencephalopathy with progressive spastic paraplegia, from a single connexin lesion.

          Two readings are open and this entry does not choose. Either mouse oligodendrocytes are protected
          by a Cx32 redundancy that human oligodendrocytes do not have to the same degree - in which case
          the single-knockout null result says nothing about the human disease - or the human missense
          alleles are not simple nulls and exert an effect a null cannot. The second reading is specifically
          not excluded for SPG44 by the UPR work, which ruled out the ER-retention and apoptosis arm but
          not every possible non-channel function: the founding report ends by saying it is not known
          whether I33M retains a Cx47 function unrelated to forming functional channels.

          Filed as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the model data exist and are
          good; the open question is their translational validity.'
        proposed_experiments:
        - experiment_id: exp_spg44_knockin_vs_null_mouse
          name: Knock-in of the human SPG44 allele versus Cx47 null, on a matched background
          description: Generate a Gjc2 p.I33M knock-in mouse and compare it directly with the existing
            Cx47 null for oligodendrocyte-astrocyte biocytin coupling, myelin ultrastructure, and motor
            behaviour. A knock-in that is worse than the null would show the human allele is not a simple
            loss of function; a knock-in indistinguishable from the null would leave species redundancy
            as the explanation for the mouse-human gap.
          would_support:
          - pathophysiology#Connexin-47 Channel Loss of Function
          supporting_outcome:
          - The p.I33M knock-in phenocopies the null, with coupling loss and subclinical myelin vacuolation
            only, supporting a pure loss-of-conductance mechanism whose mildness in mouse reflects Cx32
            redundancy.
          refuting_outcome:
          - The p.I33M knock-in is more severely affected than the null, indicating the missense protein
            exerts an effect beyond loss of channel function and that the mechanism curated here is incomplete.
      selected_evidence:
        snippet: Homozygous mutant mice were fertile and showed no obvious morphological or behavioral
          abnormalities.
        supports: SUPPORT
