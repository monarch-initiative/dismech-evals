      assertion:
        name: GBA2
        gene_term:
          preferred_term: GBA2
          term:
            id: hgnc:18986
            label: GBA2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Biallelic loss-of-function GBA2 variants cause SPG46. Reported alleles include nonsense
          variants (p.Tyr121*, p.Arg340*), frameshift variants (p.Met510Valfs*17), splice-site variants
          (c.452-1G>C), and missense substitutions in the six-hairpin glycosidase-like catalytic domain
          (p.Arg873His, p.Asp594His). Enzyme assays in patient blood cells show absent or drastically
          reduced GBA2 glucosylceramidase activity.

          '
      selected_evidence:
        snippet: We were able to identify mutations responsible for autosomal-recessive ataxia in these
          families within the gene encoding β-glucosidase 2, GBA2.
        supports: SUPPORT
