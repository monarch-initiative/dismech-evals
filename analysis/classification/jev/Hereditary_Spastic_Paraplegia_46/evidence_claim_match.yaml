          value:
            name: Glucosylceramide Accumulation and Glycosphingolipid Dyshomeostasis
            biological_scale: MOLECULAR
            description: 'With GBA2 activity lost, glucosylceramide accumulates at the cytosolic face
              of the ER and Golgi and outside the lysosome, and the broader glycosphingolipid profile
              is perturbed. In GBA2-deficient mice, glucosylceramide accumulates in brain, testis, and
              liver; in patients, reduced GBA2 activity raises glucosylceramide to levels comparable with
              Gaucher disease, defining a non-lysosomal glucosylceramide storage state.

              '
            biological_processes:
            - preferred_term: glycosphingolipid metabolic process
              term:
                id: GO:0006687
                label: glycosphingolipid metabolic process
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired Neuronal Membrane and Cytoskeletal Dynamics
        causal_link_type: DIRECT
        description: Altered sphingolipid composition perturbs membrane microdomains and cytoskeletal
          organization in neurons.
      selected_evidence:
        snippet: Our studies show that a reduced activity of GBA2 is sufficient to elevate the levels
          of glucosylceramide to similar levels as seen in Gaucher disease.
        supports: SUPPORT
