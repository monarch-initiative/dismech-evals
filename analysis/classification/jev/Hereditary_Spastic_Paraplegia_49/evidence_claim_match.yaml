            label: Genetic Counseling
      selected_evidence:
        snippet: If both parents are known to be heterozygous for a TECPR2 pathogenic variant, each sib
          of an affected individual has at conception a 25% chance of being affected, a 50% chance of
          being an asymptomatic carrier, and a 25% chance of inheriting neither of the familial pathogenic
          variants.
        supports: SUPPORT
