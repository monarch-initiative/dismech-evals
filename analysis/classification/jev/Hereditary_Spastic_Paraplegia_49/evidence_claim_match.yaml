            term:
              id: MONDO:0014016
              label: hereditary spastic paraplegia 49
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Tecpr2 L1152Yfs knock-in mouse
        species: Mouse
        genotype: Tecpr2 L1152Yfs homozygous knock-in (models human TECPR2 p.Leu1139Argfs*75)
        publication: PMID:41173829
        description: 'A second, allele-specific mouse, generated to address a stated limitation of the
          knockout: a null cannot test whether a truncated mutant TECPR2 protein is itself toxic. The
          knock-in carries an HSAN9-associated nonsense allele rather than a deletion. It reproduces gait
          ataxia and the medullary axonal dystrophy seen in the knockout, and it is the source of the
          endolysosomal and microglial arm of this pathograph: proteomics and imaging of the affected
          medulla, damage-associated microglia with reduced clearance capacity, and a HOPS interaction
          mapped in TECPR2 knockout cells.'
        genes:
        - preferred_term: TECPR2
          term:
            id: hgnc:19957
            label: TECPR2
        modeled_mechanisms:
        - target: Endolysosomal Dysfunction and Impaired Microglial Clearance
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The model that establishes this node. Neuronal and microglial readouts converge
            on a dysfunctional endolysosomal system, and the HOPS interaction supplies the molecular basis.
          limitations: 'Two limits bound what this model shows. The corresponding human lesion has been
            demonstrated only in patient fibroblasts and engineered knockout cells, not in patient nervous
            tissue, so the endolysosomal claim rests on a mouse plus human cell lines rather than on human
            neuropathology. And the design intent was only partly met: the knock-in was made so a truncated
            mutant protein could be tested for toxic gain-of-function, but TECPR2 was undetectable at
            the protein level, so functionally this remains a loss-of-expression model like the knockout.'
          readouts:
          - name: Medullary axonal swelling with regional neuronal loss
            target: Endolysosomal Dysfunction and Impaired Microglial Clearance
            direction: INCREASED
            interpretation: The anatomical lesion, restricted to the medulla, in which the altered organelle
              and protein homeostasis was measured.
          - name: Disease-associated microglia state with reduced endocytic capacity
            target: Endolysosomal Dysfunction and Impaired Microglial Clearance
            direction: ALTERED
            interpretation: Microglia respond to the neuronal damage but shift to a state with increased
              lysosomal protein content and decreased endocytosis - the reason this node treats clearance
              failure as part of the mechanism rather than as a reaction to it.
        - target: Sensory and Autonomic Neuron Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Gait ataxia and medullary degeneration match the sensory and brainstem limb of
            the human disorder, in an allele of the type patients actually carry.
          limitations: 'The same gap as in the knockout: the medulla is the anatomically right place for
            the fatal respiratory phenotype, but no respiratory or autonomic function was measured, so
            the correspondence to central hypoventilation and apnea is inferred from location. The pathology
            is also strikingly region-restricted, and why a ubiquitously expressed protein produces a
            lesion confined to one region is unexplained by this model.'
          readouts:
          - name: Gait ataxia
            target: Sensory and Autonomic Neuron Degeneration
            direction: ALTERED
            interpretation: The behavioural phenotype the authors match to the human presentation.
      selected_evidence:
        snippet: Here, we report a novel mouse model which harbors a HSAN9-associated nonsense mutation
          that causes loss of TECPR2 expression.
        supports: SUPPORT
