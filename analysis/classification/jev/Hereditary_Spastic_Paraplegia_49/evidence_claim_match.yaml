      assertion:
        population: General population
        measure_type: CARRIER_FREQUENCY
        prevalence_class: BAND_1_5_PER_10000
        rate_per_100000: 81.9
        notes: 'Estimated pathogenic-variant carrier frequency of 1 in 1221 in the general population.
          Banded BAND_1_5_PER_10000, not ABOVE_1_IN_1000: 1 in 1221 is below 1 in 1000. Note the band
          name understates its range - PrevalenceClassEnum defines BAND_1_5_PER_10000 as 10-99 per 100,000,
          deliberately combining the Orphanet 1-5 and 6-9 classes so there is no gap between it and ABOVE_1_IN_1000,
          and _band_from_rate() buckets any rate at or above 10 into it. Read the enum description rather
          than the class name before concluding a rate falls between bands.

          A real question remains, and it is not specific to this entry: the Orphanet classes band disease
          occurrence, and a carrier frequency is not disease occurrence, so a reader filtering on the
          band will compare carrier rates against patient rates. That is a KB-wide convention question
          - 34 of 37 CARRIER_FREQUENCY records set a band - and it is not for one entry to answer by diverging.
          The band is set to the schema-correct value and the concern is recorded here.'
      selected_evidence:
        snippet: We estimate a pathogenic variant carrier frequency of 1/1221 in the general and 1/155
          in the Jewish Ashkenazi populations.
        supports: SUPPORT
