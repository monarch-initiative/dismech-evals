  5f5c93cd1ff20fa9553e7041d5be231cf71f867cd9b3d0ef716908273821c114:
    claim:
      about:
        disease:
          name: Hereditary Spastic Paraplegia 49
          disease_term:
            preferred_term: hereditary spastic paraplegia 49
            term:
              id: MONDO:0014016
              label: hereditary spastic paraplegia 49
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Spanish Water Dog TECPR2 neuroaxonal dystrophy
        species: Dog
        genotype: TECPR2 c.4009C>T (p.R1337W) homozygous
        publication: PMID:26555167
        description: A naturally occurring, not engineered, juvenile-onset neuroaxonal dystrophy in Spanish
          Water Dogs, mapped to a homozygous TECPR2 missense variant at a highly conserved residue with
          autosomal recessive segregation. Histopathology shows spheroid formation in cerebral, cerebellar
          and brainstem grey matter and in the sensory pathways of the spinal cord, without iron accumulation,
          and the spheroids contain packed double-membraned vesicles identified as autophagosomes.
        genes:
        - preferred_term: TECPR2
          term:
            id: hgnc:19957
            label: TECPR2
        modeled_mechanisms:
        - target: Impaired Autophagosome Formation and Cargo Delivery
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: 'Provides the tissue-level correlate that human patient fibroblast studies cannot:
            autophagosome accumulation within axonal spheroids in an intact nervous system.'
          limitations: A missense allele, not a null, so residual TECPR2 function is likely and the severity
            is not calibrated against human genotypes. The autophagosome identification is immunohistochemical
            and ultrastructural rather than a flux measurement, so it shows accumulation without establishing
            where in the pathway the block sits.
          readouts:
          - name: Autophagosome content of axonal spheroids
            target: Impaired Autophagosome Formation and Cargo Delivery
            direction: INCREASED
            interpretation: Accumulated double-membraned vesicles within spheroids, consistent with disturbed
              autophagic turnover in vivo.
        - target: Sensory and Autonomic Neuron Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The canine lesions involve the sensory pathways of the spinal cord, matching the
            sensory limb of the human disorder.
          limitations: The published comparison notes the canine lesions spare the motor pathways that
            most human HSPs involve, and no autonomic phenotype - hypoventilation, apnea, GI dysmotility
            - is reported for the dogs. So the model covers the sensory limb of the human disease but
            not the autonomic one, which is the limb that drives human mortality.
        - target: Corticospinal Axonopathy
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The canine disease does not reproduce the corticospinal motor involvement that
            the HSP classification of the human disorder asserts.
          limitations: 'The authors state directly that the canine lesions differ from most human HSPs
            in sparing the motor pathways. Note this cuts both ways as evidence: read as a model limitation
            it is a species difference, but read alongside the human cohort data showing spasticity is
            not a core manifestation, it is a point of agreement that the corticospinal component of this
            disorder is weaker than its SPG49 name implies.'
      selected_evidence:
        snippet: a perfectly associated, single, non-synonymous coding variant in the canine tectonin
          beta-propeller repeat-containing protein 2 (TECPR2) gene affecting a highly conserved region
          was detected (c.4009C>T or p.R1337W)
        supports: SUPPORT
