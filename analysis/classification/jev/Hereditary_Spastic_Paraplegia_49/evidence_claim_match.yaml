      assertion_type: Pathophysiology
      assertion:
        name: Endolysosomal Dysfunction and Impaired Microglial Clearance
        description: 'A 2025 knock-in mouse carrying a disease-associated nonsense mutation identifies
          a second TECPR2 function: it interacts with the HOPS tethering complex, and its loss gives endolysosomal
          dysfunction in neurons. This node is curated as a sibling of the autophagosome-formation node
          rather than downstream of it, and the topology is the claim. The paper establishes a distinct
          HOPS-dependent role in endolysosome maintenance; it does not show that this lesion is a consequence
          of failed autophagosome formation. Drawing the serial edge would assert a sequence the source
          does not support. If a study later shows the endolysosomal defect follows from the formation
          defect, the edge is the change to make. The same model adds a second cell type to the mechanism.
          Damage-associated microglia respond to the dying neurons but their capacity to clear the debris
          is itself attenuated, so the disease is not purely neuron-autonomous - a failure to remove degenerating
          material sits alongside the failure that produces it.

          The pathology is strikingly region-specific, concentrated in the medulla, which is where the
          fatal autonomic and respiratory phenotypes would be expected to originate. That regional restriction
          is curated as an observation rather than as an explanation; why a ubiquitously expressed protein
          produces a lesion confined to one brain region is the model''s central unanswered question.'
        biological_scale: CELLULAR
