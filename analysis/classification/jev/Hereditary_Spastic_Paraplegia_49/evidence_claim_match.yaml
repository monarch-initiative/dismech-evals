              id: MONDO:0014016
              label: hereditary spastic paraplegia 49
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilised COPII Coat and ER Exit Site Failure
        description: TECPR2 binds trafficking components including the COPII coat protein SEC24D and is
          required to stabilise SEC24D protein levels and maintain functional endoplasmic reticulum exit
          sites. This is not an inference from cell lines alone - TECPR2-deficient patient cells show
          altered SEC24D abundance and reduced ER export efficiency. The dependence runs through lipidated
          LC3C, which is what makes TECPR2 a scaffold joining the early secretory pathway to autophagy
          rather than a component of either alone.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
          modifier: DECREASED
          term:
            id: GO:0006888
            label: endoplasmic reticulum to Golgi vesicle-mediated transport
        - preferred_term: COPII-coated vesicle budding
          modifier: DECREASED
          term:
            id: GO:0090114
            label: COPII-coated vesicle budding
        cellular_components:
        - preferred_term: endoplasmic reticulum exit site
          term:
            id: GO:0070971
            label: endoplasmic reticulum exit site
      selected_evidence:
        snippet: TECPR2-deficient HSP patient cells display alterations in SEC24D abundance and ER export
          efficiency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26431026
      reference_title: TECPR2 Cooperates with LC3C to Regulate COPII-Dependent ER Export.
      evidence_source: IN_VITRO
      explanation: Confirms the defect in patient-derived cells, not only in knockdown models.
