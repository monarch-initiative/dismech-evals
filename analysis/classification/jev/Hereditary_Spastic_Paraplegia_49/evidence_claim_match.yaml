      assertion:
        name: TECPR2
        notes: TECPR2 encodes a tectonin beta-propeller repeat-containing ATG8-binding protein. Missense
          variants make up nearly half of the disease-associated alleles and cluster in the N- and C-terminal
          beta-propeller regions, and classifying them by ACMG criteria is explicitly noted as difficult
          - several previously published candidate missense variants have since been reclassified as of
          uncertain significance.
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: TECPR2
          term:
            id: hgnc:19957
            label: TECPR2
        variants:
        - name: c.3416delT
          description: The founder frameshift allele identified homozygously in Jewish Bukharian families
            in the original 2012 description.
      selected_evidence:
        snippet: Despite constituting nearly half of disease-associated TECPR2 variants, classifying missense
          variants as (likely) pathogenic according to ACMG criteria remains challenging.
        supports: SUPPORT
