  7fb5163cedbc8e1e3ff68cec861c3a22a447f6471036048353c5e0757629504d:
    claim:
      about:
        disease:
          name: Hereditary Spastic Paraplegia 49
          disease_term:
            preferred_term: hereditary spastic paraplegia 49
            term:
              id: MONDO:0014016
              label: hereditary spastic paraplegia 49
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Tecpr2 CRISPR-Cas9 knockout mouse
        species: Mouse
        genotype: tecpr2-/- CRISPR-Cas9 knockout
        publication: PMID:33218264
        description: An engineered null model, complementing the naturally occurring canine missense model.
          It develops age-dependent neuroaxonal dystrophy concentrated in the gracile and cuneate nuclei
          of the medulla oblongata and the dorsal white matter column of the spinal cord, with autophagosome
          accumulation tracking the neurodegeneration.
        genes:
        - preferred_term: TECPR2
          term:
            id: hgnc:19957
            label: TECPR2
        modeled_mechanisms:
        - target: Impaired Autophagosome Formation and Cargo Delivery
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Autophagosome accumulation in affected CNS regions, interpreted by the authors
            as compromised targeting of autophagosomes to the lysosome.
          limitations: The direction of the autophagy defect differs from the original patient-fibroblast
            report, which found decreased LC3-II and p62 rather than accumulation. Accumulation points
            to a downstream delivery or fusion block; depletion points to a defect at formation. The mouse
            cannot by itself settle which applies in human disease, and the two readings are not reconcilable
            as stated.
          readouts:
          - name: Autophagosome accumulation in medulla oblongata and dorsal spinal tracts
            target: Impaired Autophagosome Formation and Cargo Delivery
            direction: INCREASED
            interpretation: Regional autophagosome accumulation co-localizing with neuroaxonal dystrophy.
        - target: Sensory and Autonomic Neuron Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Degeneration is concentrated in the gracile and cuneate nuclei and dorsal columns
            - the sensory relay pathways - matching the sensory limb of the human disorder, and in the
            medulla, the site relevant to respiratory control.
          limitations: The report describes behavioural pathologies and regional neurodegeneration but
            does not demonstrate the central hypoventilation or apnea that kill human patients. That medullary
            involvement is anatomically suggestive of a respiratory phenotype is an inference, not a measurement
            made here.
      selected_evidence:
        snippet: we report the generation of a novel CRISPR-Cas9 tecpr2 knockout (tecpr2-/-) mouse that
          exhibits behavioral pathologies observed in SPG49 patients
        supports: SUPPORT
    origin:
