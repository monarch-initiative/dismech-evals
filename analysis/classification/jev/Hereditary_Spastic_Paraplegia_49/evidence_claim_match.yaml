            term:
              id: MONDO:0014016
              label: hereditary spastic paraplegia 49
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tecpr2_disease_name_mismatch
        kind: KNOWLEDGE_GAP
        prompt: Should MONDO:0014016 continue to be labelled a hereditary spastic paraplegia when the
          accumulated phenotype data identify sensory-autonomic neuropathy with intellectual disability
          as the dominant burden and do not list spasticity among core manifestations?
        attaches_to:
        - pathophysiology#Corticospinal Axonopathy
        - phenotypes#Spastic Paraplegia
        rationale: 'This is a nomenclature problem with clinical consequences, not a filing dispute. The
          SPG49 name came from a single five-patient founder family in 2012. Three independent lines of
          evidence since then point the other way: the authors of the second patient series proposed reclassification
          as a hereditary sensory-autonomic neuropathy; the largest phenotyping cohort''s core manifestation
          list omits spasticity; and the canine TECPR2 model''s spinal lesions spare the motor pathways.
          A clinician searching under a spastic paraplegia label may not think to monitor for central
          hypoventilation, and apnea is a leading cause of death here. What is genuinely unresolved is
          whether the corticospinal involvement is a real but minor component or an artefact of the founder
          cohort''s particular presentation - answering that needs prospective natural history data with
          systematic pyramidal examination, which the largest cohort explicitly sets up but does not yet
          provide.'
      selected_evidence:
        snippet: We suggest that the disease should therefore be classified as a new subtype of hereditary
          sensory-autonomic neuropathy.
        supports: SUPPORT
    origin:
