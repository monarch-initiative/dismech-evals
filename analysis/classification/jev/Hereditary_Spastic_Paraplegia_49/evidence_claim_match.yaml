  c5866a0489dbda59da2c4da8d1b7b9c4d4b69a5404777840fb4814d9dd28a826:
    claim:
      about:
        disease:
          name: Hereditary Spastic Paraplegia 49
          disease_term:
            preferred_term: hereditary spastic paraplegia 49
            term:
              id: MONDO:0014016
              label: hereditary spastic paraplegia 49
        context: []
      assertion_type: Treatment
      assertion:
        name: TECPR2 Exon 8 Skipping Antisense Oligonucleotide (investigational)
        description: 'A preclinical, genotype-specific splice-modulation strategy - not an approved therapy.
          The c.1319delT (p.Leu440Argfs*19) frameshift creates a premature stop codon in exon 8. Because
          exon 8 encodes an unstructured 111-amino-acid region and is 333 nucleotides long, skipping it
          restores an in-frame TECPR2 retaining 1,300 of 1,411 residues. The lead candidate ASO-005-02
          reached ~27 nM potency in patient fibroblasts, and the rescued protein kept the punctate neuronal
          distribution of full-length TECPR2 in iPSC-derived neurons - a surrogate for function, not a
          functional assay. A single 20 mg intrathecal dose in cynomolgus monkeys was tolerated with broad
          CNS distribution and detectable exon-8 skipping.

          Two limits are worth stating plainly. First, eligibility is narrow: the strategy only helps
          patients carrying an exon 8 mutation, which the authors estimate at up to a few hundred patients
          worldwide. Second, the chemistry recorded here (2''-O-methyl bases, phosphorothioate linkages)
          is what the source states for the initial 25-mer screening set; the optimized lead''s final
          chemistry is not specified in the abstract or the quoted text, so treat the chemistry annotation
          as provisional.'
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        oligonucleotide_details:
          oligonucleotide_mechanism: SPLICE_MODULATION_EXON_SKIPPING
          target_gene:
            preferred_term: TECPR2
            term:
              id: hgnc:19957
              label: TECPR2
          target_transcript: TECPR2 mRNA
          target_exon: exon 8
          conjugation: UNCONJUGATED
          delivery_platform: UNFORMULATED
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Optimization of ASO sequences generated a lead candidate (ASO-005-02) with ∼27 nM potency
          in patient-derived fibroblasts.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/0
