  6101301aeb57bb304cdcdcc88803b20903e8405c4e0c5ff05dd85bb75eb42eae:
    claim:
      about:
        disease:
          name: Hereditary Spastic Paraplegia 49
          disease_term:
            preferred_term: hereditary spastic paraplegia 49
            term:
              id: MONDO:0014016
              label: hereditary spastic paraplegia 49
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tecpr2_autophagy_direction_conflict
        kind: KNOWLEDGE_GAP
        prompt: Does TECPR2 loss block autophagosome formation or autophagosome clearance? The published
          readouts point in opposite directions, and the answer determines what a therapeutic readout
          should even measure.
        attaches_to:
        - pathophysiology#Impaired Autophagosome Formation and Cargo Delivery
        - pathophysiology#Endolysosomal Dysfunction and Impaired Microglial Clearance
        rationale: 'The original patient-fibroblast study found reduced LC3-II and reduced SQSTM1/p62
          with attenuated delivery of both to the lysosome - a pattern consistent with a defect at autophagosome
          formation, since a pure clearance block would make p62 accumulate. Every in vivo model reports
          the opposite: autophagosomes pile up in axonal spheroids in the Spanish Water Dog and in the
          medulla and dorsal columns of the Tecpr2 knockout mouse, and the mouse authors read this as
          compromised targeting to the lysosome. The mechanistic work adds a third strand, placing TECPR2
          at ER exit sites where it would act upstream at formation. These are not obviously reconcilable.
          Possible explanations include a cell-type difference between fibroblasts and neurons, a difference
          between an early formation defect and a late accumulation of stalled structures over years of
          neuronal life, or an artefact of measuring steady-state levels rather than flux.

          A fourth possibility has since appeared and is the most economical of the set: that neither
          reading is the whole story because TECPR2 also has a HOPS-dependent role in endolysosome maintenance,
          curated here as its own node. A protein required both at ER exit sites and at endolysosomal
          tethering would produce formation-like readouts in one assay and clearance-like readouts in
          another without either being an artefact. This does not resolve the conflict - nobody has measured
          flux in a system where both functions are separable - but it reframes it, and it is the explanation
          a new experiment should be designed against.

          The practical consequence is unchanged and concrete: an ASO or other therapy would need a validated
          autophagy readout, and it is currently unclear whether increased or decreased LC3-II should
          count as rescue.'
      selected_evidence:
        snippet: found that both protein levels were decreased and that there was a more pronounced decrease
          in the lipidated form of LC3 (LC3II)
        supports: SUPPORT
    origin:
