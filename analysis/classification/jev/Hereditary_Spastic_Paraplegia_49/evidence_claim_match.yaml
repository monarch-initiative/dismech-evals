  f3b7dfb864e84376eac4d055ddca9e3753ad0dec3cb510f6d14ed976b171c24c:
    claim:
      about:
        disease:
          name: Hereditary Spastic Paraplegia 49
          disease_term:
            preferred_term: hereditary spastic paraplegia 49
            term:
              id: MONDO:0014016
              label: hereditary spastic paraplegia 49
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Autophagosome Formation and Cargo Delivery
        description: 'TECPR2 is an ATG8-binding positive regulator of autophagy. Patient fibroblasts show
          reduced SQSTM1/p62 and MAP1LC3B, with a more pronounced fall in the lipidated LC3-II form, and
          attenuated delivery of both LC3B and p62 to the lysosome where they are normally degraded. siRNA
          knockdown reproduces the same changes. Note the direction: p62 falls rather than accumulating,
          which is not the pattern of a simple block in autophagosome-lysosome fusion and is consistent
          instead with a defect upstream, at autophagosome formation.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: macroautophagy
          modifier: DECREASED
          term:
            id: GO:0016236
            label: macroautophagy
        - preferred_term: autophagosome assembly
          modifier: DECREASED
          term:
            id: GO:0000045
            label: autophagosome assembly
        cellular_components:
        - preferred_term: autophagosome
          term:
            id: GO:0005776
            label: autophagosome
      selected_evidence:
        snippet: found that both protein levels were decreased and that there was a more pronounced decrease
          in the lipidated form of LC3 (LC3II)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
