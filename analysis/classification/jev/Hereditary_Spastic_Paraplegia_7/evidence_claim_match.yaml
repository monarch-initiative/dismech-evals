      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Dysfunction and OXPHOS Impairment
        biological_scale: CELLULAR
        description: 'Loss of the m-AAA protease leaves oxidatively damaged and misfolded mitochondrial
          proteins uncleared, and oxidative phosphorylation fails. This was demonstrable in human tissue
          from the outset: muscle biopsies from two of the original paraplegin-mutant patients showed
          typical signs of mitochondrial OXPHOS defects. The Drosophila SPG7 null recapitulates the mitochondrial
          phenotype in detail, with reduced respiratory chain complex I and II activities, electron-dense
          matrix accumulation, and severely swollen and dysmorphic mitochondria.'
        biological_processes:
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
        - preferred_term: mitochondrion organization
          term:
            id: GO:0007005
            label: mitochondrion organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Analysis of muscle biopsies from two patients carrying Paraplegin mutations showed typical
          signs of mitochondrial OXPHOS defects, thus suggesting a mechanism for neurodegeneration in
          HSP-type disorders.
        supports: SUPPORT
