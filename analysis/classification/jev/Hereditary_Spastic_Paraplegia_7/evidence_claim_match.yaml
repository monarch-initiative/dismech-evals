              label: hereditary spastic paraplegia 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Paraplegin Loss and m-AAA Protease Deficiency
        conforms_to: corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect
        biological_scale: MOLECULAR
        description: Biallelic SPG7 variants abolish paraplegin, a nuclear-encoded mitochondrial metalloprotease
          that localizes to mitochondria and is highly homologous to the yeast inner-membrane ATPases
          AFG3, RCA1, and YME1, which carry both proteolytic and chaperone-like activities. In its metazoan
          role, paraplegin is a subunit of the m-AAA protease family responsible for degrading oxidatively
          damaged and misfolded mitochondrial proteins. Loss of this quality-control protease is the entry
          point of the disorder, and it places SPG7 in the mitochondrial-function category of HSP genes
          alongside SPG13/HSPD1.
        gene:
          preferred_term: SPG7
          term:
            id: hgnc:11237
            label: SPG7
        molecular_functions:
        - preferred_term: metalloendopeptidase activity
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: mitochondrial protein quality control
          term:
            id: GO:0141164
            label: mitochondrial protein quality control
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Paraplegin is highly homologous to the yeast mitochondrial ATPases, AFG3, RCA1, and YME1,
          which have both proteolytic and chaperon-like activities at the inner mitochondrial membrane.
          Immunofluorescence analysis and import experiments showed that Paraplegin localizes to mitochondria.
        supports: SUPPORT
