        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Axonal Mitochondrial Transport and Distal Synaptic Failure
        conforms_to: corticospinal_tract_axonopathy#Impaired Axonal Transport and Organelle Distribution
        biological_scale: CELLULAR
        description: Beyond the bioenergetic deficit itself, mitochondrial transport along the axon is
          disturbed, so the distal axon and its terminal are the compartment least well supplied with
          functional mitochondria. Ultrastructural examination of Drosophila SPG7-null photoreceptors
          localizes the start of the neurodegenerative process to the synaptic terminal rather than the
          cell body, which is the model-level correlate of the dying-back pattern seen clinically. This
          is a model-organism claim about where degeneration begins; the human evidence for SPG7 establishes
          the OXPHOS lesion and the tract degeneration but not the subcellular sequence.
        biological_processes:
        - preferred_term: axonal transport of mitochondrion
          term:
            id: GO:0019896
            label: axonal transport of mitochondrion
          modifier: ABNORMAL
      selected_evidence:
        snippet: Ultrastructural examination of photoreceptor neurons indicated that the neurodegenerative
          phenotype of SPG7 mutants initiates at the synaptic terminal.
        supports: SUPPORT
