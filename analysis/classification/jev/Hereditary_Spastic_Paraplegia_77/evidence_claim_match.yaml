        description: 'The allelic infantile-onset FARS2 phenotype: early epileptic encephalopathy with
          refractory seizures, lactic acidosis and often death in early childhood, with Alpers-like neuropathology.
          It is kept as a separate entry because MONDO and OMIM treat it as a distinct disease, and it
          is in the curation queue as stubs/Combined_Oxidative_Phosphorylation_Defect_Type_14.yaml. Intermediate
          patients exist (early seizures that resolve, followed by spastic paraplegia).'
        distinguishing_features:
        - Onset in infancy with intractable seizures rather than childhood-onset gait disorder
        - Lactic acidosis and early lethality
        - Associated FARS2 alleles (for example p.Gly309Ser and p.Asp325Tyr) impair enzyme stability more
          severely
      selected_evidence:
        snippet: Clinical features, including postnatal onset, catastrophic epilepsy, lactic acidemia,
          early lethality and neuroimaging findings of the patients with FARS2 variants, resembled each
          other closely, and neuropathology was consistent with Alpers syndrome.
        supports: SUPPORT
