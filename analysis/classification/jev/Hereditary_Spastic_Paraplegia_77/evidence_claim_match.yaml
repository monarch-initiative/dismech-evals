      assertion_type: Genetic
      assertion:
        name: FARS2
        gene_term:
          preferred_term: FARS2
          term:
            id: hgnc:21062
            label: FARS2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Reported SPG77 genotypes include homozygous p.Asp142Tyr; compound heterozygous p.Pro136His
          with p.Gln216*; p.Pro361Leu with a deletion of exons 1-2 or of exons 2-4; p.Gly141Glu with an
          exon 6 deletion; p.Arg419Cys with an interstitial 6p25.1 deletion including exon 6 (a sibling
          pair classified as complicated SPG77 in later literature reviews, although the original report
          describes developmental delay, dysarthria and tremor without naming spastic paraplegia); and
          a missense variant at codon 338 with an Alu-mediated exon 5 deletion. Across the FARS2 spectrum
          nearly all non-deletion alleles are missense, and deletions are always in trans with a missense
          allele. p.Pro361Leu occurs in both pure and complicated presentations.
      selected_evidence:
        snippet: All large deletions and the single splice-site variant are in trans with a missense variant.
          This suggests that complete loss of function may be incompatible with life.
        supports: SUPPORT
