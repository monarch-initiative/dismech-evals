      assertion_type: AnimalModel
      assertion:
        name: RENF mouse (Xdh nonsense mutation)
        species: Mouse
        genotype: Xdh nonsense mutation at codon 26, homozygous (ENU-induced, designated RENF)
        publication: PMID:23024809
        description: An ENU mutagenesis screen for hereditary renal failure that recovered an Xdh nonsense
          allele. The authors present it as a model for xanthinuria in man.
        modeled_mechanisms:
        - target: Obstructive and Crystal-Induced Kidney Injury
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Reproduces the tubulointerstitial injury and the loss of renal function, and it
            carries the human biochemistry, since the mice have plasma uric acid below the limit of detection.
          limitations: The severity and timing do not match the human disease. RENF mice are in renal
            failure by four weeks with small, irregular kidneys, whereas human hereditary xanthinuria
            is usually benign and most affected people never reach renal failure at all. The cited abstract
            does not report xanthine calculi in these mice, so the stone-formation step that produces
            the human injury is not demonstrated in the model, and the mouse Xdh loss also removes renal
            COX-2 expression, which has no established counterpart in the human disease. This link is
            therefore evidence that losing XDH damages the kidney, not that it damages it by the route
            curated here.
          readouts:
          - name: Renal histology
            target: Obstructive and Crystal-Induced Kidney Injury
            direction: ALTERED
            interpretation: Structural correlate of the tubulointerstitial limb of this node.
          - name: Tubular apoptosis by TUNEL
            target: Obstructive and Crystal-Induced Kidney Injury
            direction: INCREASED
            interpretation: Locates the cell death in the tubules rather than the glomeruli.
      selected_evidence:
        snippet: DNA sequencing of the xanthine dehydrogenase (Xdh) gene revealed a nonsense mutation
          at codon 26 that co-segregated with affected RENF mice.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
