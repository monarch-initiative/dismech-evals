              preferred_term: MOCOS
              term:
                id: hgnc:18234
                label: MOCOS
            subtype: Type II
            relationship_type: CAUSATIVE
            notes: Biallelic MOCOS variants cause type II. Because the sulfurase activates the molybdenum
              cofactor for both xanthine oxidoreductase and aldehyde oxidase, the loss is of two enzymes
              rather than one. c.1046C>T is a Yemenite-Jewish founder variant.
          role: ancestor
        - path: /has_subtypes/1
          value:
            name: Type II
            display_name: Type II (MOCOS deficiency)
            subtype_term:
              preferred_term: xanthinuria type II
              term:
                id: MONDO:0011346
                label: xanthinuria type II
            description: Combined loss of xanthine oxidoreductase and aldehyde oxidase, because the molybdenum
              cofactor sulfurase that both enzymes depend on is defective. The renal disease is the same.
              What differs is drug handling, since aldehyde oxidase metabolises several xenobiotics. OMIM
              603592.
            genes:
            - preferred_term: MOCOS
              term:
                id: hgnc:18234
                label: MOCOS
          role: subtype
      assertion_type: Variant
      assertion:
        name: MOCOS c.1046C>T p.(Thr349Ileu)
        description: Missense variant in the NifS-like domain. Expression studies show it destabilises
          the protein and reduces cysteine desulfurase activity. Yemenite-Jewish founder allele.
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Heterologous protein expression studies revealed that the p.Cys150Phe variant within
          the Fe/S-I cluster-binding site impairs XDH biogenesis, the p.Thr349Ileu variant in the NifS-like
          domain of MOCOS affects protein stability and cysteine desulfurase activity, while the p.Pro591Ser
          and a previously described p.Arg776Cys variant in the C-terminal domain affect Molybdenum cofactor
          binding.
        supports: SUPPORT
