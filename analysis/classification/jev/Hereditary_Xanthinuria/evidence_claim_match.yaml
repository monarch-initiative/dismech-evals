              preferred_term: xanthinuria type I
              term:
                id: MONDO:0010209
                label: xanthinuria type I
            description: Isolated loss of xanthine oxidoreductase from biallelic XDH variants. Aldehyde
              oxidase is intact. OMIM 278300.
            genes:
            - preferred_term: XDH
              term:
                id: hgnc:12805
                label: XDH
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Loss of Xanthine Oxidoreductase Function
        biological_scale: MOLECULAR
        subtypes:
        - Type I
        description: 'Frameshift, nonsense and missense variants in XDH abolish the enzyme. The functional
          work is unusually direct: p.Cys150Phe sits in the Fe/S-I cluster-binding site and stops the
          protein being built at all. The homodimer needs a molybdenum centre, an FAD and two iron-sulfur
          clusters, and a lesion in any of them ends catalysis.'
        genes:
        - preferred_term: XDH
          term:
            id: hgnc:12805
            label: XDH
        molecular_functions:
        - preferred_term: xanthine dehydrogenase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004854
            label: xanthine dehydrogenase activity
      selected_evidence:
        snippet: Heterologous protein expression studies revealed that the p.Cys150Phe variant within
          the Fe/S-I cluster-binding site impairs XDH biogenesis, the p.Thr349Ileu variant in the NifS-like
          domain of MOCOS affects protein stability and cysteine desulfurase activity, while the p.Pro591Ser
          and a previously described p.Arg776Cys variant in the C-terminal domain affect Molybdenum cofactor
          binding.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
