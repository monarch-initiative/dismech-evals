        description: Defect in von Willebrand factor binding to factor VIII. Because factor VIII is cleared
          rapidly when it is not bound to von Willebrand factor, factor VIII activity is low while von
          Willebrand factor antigen is disproportionately higher, and the presentation resembles mild
          to moderate hemophilia A.
        genes:
        - preferred_term: VWF
          term:
            id: hgnc:12726
            label: VWF
