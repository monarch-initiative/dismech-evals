          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
          description: Type 2N requires biallelic VWF variants; heterozygous relatives are often asymptomatic.
      selected_evidence:
        snippet: Type 2N VWD is an uncommon recessive disorder that results from gene mutations located
          in the region coding for the binding site of VWF for factor VIII (FVIII).
        supports: SUPPORT
