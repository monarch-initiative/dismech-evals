  8de9318b064248441f320b2c7bfd803820887679fccea4c064ee3ac1cee3f2c9:
    claim:
      about:
        disease:
          name: Heritable Pulmonary Arterial Hypertension
          disease_term:
            preferred_term: heritable pulmonary arterial hypertension
            term:
              id: MONDO:0017148
              label: heritable pulmonary arterial hypertension
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hpah_genotype_specific_bmp_restoration_response
        prompt: Which HPAH genotypes and pathway states predict differential response to sotatercept or
          other BMP-restoring therapies, and can treatment be individualized by causal gene rather than
          applied uniformly across PAH?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Sotatercept
        - clinical_trials#NCT04576988
        - pathophysiology#Impaired BMP/TGF-beta vascular signaling
        - genetic#BMPR2
        - genetic#GDF2
        rationale: The page now models both genotype-resolved inherited disease biology and a pathway-directed
          therapy, but current treatment practice remains largely gene-agnostic. Resolving whether causal-gene
          subgroup or BMP-pathway state predicts therapeutic response would move HPAH management from
          broad PAH algorithms toward mechanism-guided precision therapy.
        proposed_experiments:
        - experiment_id: exp_hpah_genotype_stratified_sotatercept_response
          name: Genotype-stratified sotatercept response study in variant-positive PAH
          description: Analyze sotatercept-treated patients with known HPAH risk variants by causal-gene
            subgroup to test whether biomarker, hemodynamic, and exercise-capacity responses differ by
            genotype or pathway context.
          experiment_type:
            preferred_term: genotype-stratified therapeutic response study
          model_systems:
          - name: Multi-center variant-annotated sotatercept treatment cohort
            description: Patients with heritable or variant-positive PAH receiving sotatercept on background
              therapy, grouped by causal gene and baseline disease severity for comparative response analysis.
            experimental_model_type: OTHER
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            conditions:
            - heritable pulmonary arterial hypertension
          perturbations:
          - name: Sotatercept exposure on background therapy
            target: treatments#Sotatercept
            description: Compare standardized sotatercept treatment response across genotype groups defined
              by causal HPAH gene.
          readouts:
          - name: NT-proBNP response by genotype
            target: biochemical#N-terminal pro-B-type natriuretic peptide (NT-proBNP)
            description: Change in NT-proBNP after sotatercept initiation, stratified by causal gene subgroup.
            assays:
            - preferred_term: biomarker analysis
            direction: NEGATIVE
            interpretation: Larger genotype-specific declines would support biologically distinct pathway
              responsiveness across HPAH subgroups.
          - name: Functional and hemodynamic improvement by genotype
            target: phenotypes#Exercise intolerance
            description: Compare 6-minute walk distance, WHO functional class, and invasive or noninvasive
              hemodynamic response across genotype-defined groups.
            assays:
            - preferred_term: 6-minute walk test
            - preferred_term: hemodynamic assessment
            direction: NEGATIVE
            interpretation: Reproducible subgroup differences would support genotype-informed treatment
              stratification rather than a fully gene-agnostic PAH model.
          controls:
          - name: Non-BMPR2/non-GDF2 variant subgroup
            description: Comparator subgroup used to test whether response patterns are specific to BMP-pathway
              genotypes.
          decision_criterion: Response distributions differ reproducibly by causal gene or pathway subgroup
            after adjustment for baseline severity and background therapy.
          would_support:
          - treatments#Sotatercept
          - pathophysiology#Impaired BMP/TGF-beta vascular signaling
          would_refute:
          - treatments#Combination PAH pharmacotherapy
      selected_evidence:
        snippet: The BMPR2 and GDF2 variant subgroups had worse hemodynamics.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
