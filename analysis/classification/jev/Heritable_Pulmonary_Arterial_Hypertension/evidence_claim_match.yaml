            term:
              id: MONDO:0017148
              label: heritable pulmonary arterial hypertension
        context: []
      assertion_type: Subtype
      assertion:
        name: CAPNS1-related HPAH
        display_name: Recessive CAPNS1-related pulmonary arterial hypertension
        subtype_term:
          preferred_term: pulmonary hypertension, primary, 6
          term:
            id: MONDO:0958334
            label: pulmonary hypertension, primary, 6
        description: An autosomal recessive form of pulmonary arterial hypertension caused by biallelic
          loss-of-function variants in CAPNS1, which encodes the regulatory subunit of calpain. Both reported
          variants act through aberrant splicing and abolish the CAPNS1 protein entirely, so the lesion
          is complete loss of the calpain small subunit rather than the heterozygous haploinsufficiency
          that characterises the BMPR2-centred arm of this entry. Reported in two unrelated consanguineous
          families; no further loss-of-function allele was found in over 1000 additional unresolved pulmonary
          arterial hypertension genomes, so the subtype is currently ultra-rare and unreplicated beyond
          that report.
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
          description: Both described families were consanguineous and the affected individuals carried
            biallelic CAPNS1 variants that cosegregated with disease.
        genes:
        - preferred_term: CAPNS1
          term:
            id: hgnc:1481
            label: CAPNS1
      selected_evidence:
        snippet: No other LoF CAPNS1 variant was identified in the genome data of more than 1000 patients
          with unresolved PAH.
        supports: SUPPORT
    origin:
