        rationale: The current entry captures incomplete penetrance, sex bias, and the need for surveillance
          of at-risk relatives, but it does not yet explain which upstream modifiers distinguish non-penetrant
          carriers from those who later develop pulmonary vascular disease. Resolving this gap would sharpen
          screening intervals, counseling, and early-intervention strategies for unaffected relatives.
        proposed_experiments:
        - experiment_id: exp_hpah_prospective_carrier_modifier_cohort
          name: Prospective deep-phenotyped HPAH carrier modifier cohort
