      assertion_type: Discussion
      assertion:
        discussion_id: gap_hs_follicular_immune_microbiome_ordering
        prompt: What is the causal ordering among follicular hyperkeratosis/rupture, epithelial-intrinsic
          inflammatory reprogramming, IL-1/TNF/IL-17/IFN-gamma cytokine circuits, B-cell/TLS formation,
          and microbiome/biofilm change in chronic HS?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Follicular Hyperkeratosis
        - pathophysiology#Epigenetic Reprogramming of Keratinocytes
        - pathophysiology#Innate Immune Hyperactivation
        - pathophysiology#Th17-Driven Adaptive Inflammation
        - pathophysiology#Tertiary Lymphoid Structure Formation
        - pathophysiology#Microbiome Dysbiosis and Biofilm Formation
        rationale: The canonical model starts with follicular occlusion and rupture, whereas recent epithelial
          and immune studies support earlier keratinocyte inflammatory reprogramming and structured T-cell/B-cell
          niches. Microbiome and biofilm studies show anaerobic dysbiosis in lesions and tunnels, but
          abstract-level evidence still leaves unresolved whether microbial change is an initiating trigger,
          an amplifier after rupture, or mainly a consequence of tunnel anatomy.
        proposed_experiments:
        - experiment_id: exp_hs_longitudinal_microbiome_immune_ordering
          name: Longitudinal HS microbiome-immune ordering study
          description: Within HS patients, sample clinically uninvolved, prelesional, early nodule, ruptured
            follicle, abscess, and tunnel sites over time; pair 16S or shotgun metagenomics with spatial
            transcriptomics, histology, and cytokine or immune-cell profiling to test whether anaerobic
            dysbiosis and biofilm signal precede, coincide with, or follow epithelial rupture and IL-1/TNF/IL-17
            pathway activation.
          decision_criterion: A microbiome-trigger model is supported if dysbiosis or biofilm signal reproducibly
            precedes follicular rupture and innate cytokine induction; a consequence or amplifier model
            is favored if microbial signal appears only after rupture, abscess formation, or tunnel anatomy
            is established.
          would_support:
          - pathophysiology#Microbiome Dysbiosis and Biofilm Formation
          - pathophysiology#Innate Immune Hyperactivation
      selected_evidence:
        snippet: Although the mechanism of HS has not been entirely elucidated, lesion formation is believed
          to center around follicular hyperkeratosis within the pilosebaceous-apocrine unit.
        supports: SUPPORT
