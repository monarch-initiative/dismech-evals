        description: 'In the familial, gene-defined forms of the disease, heterozygous loss-of-function
          variants in the gamma-secretase subunit genes NCSTN, PSENEN and PSEN1 reduce the activity of
          the gamma-secretase complex in keratinocytes. Notch receptors are among the complex''s substrates,
          so the immediate consequence is attenuated Notch signaling, which shifts the balance between
          keratinocyte proliferation and differentiation. This node is the entry point for the three gene-defined
          familial subtypes and is scoped to them; it is not a claim about the sporadic disease, which
          the rest of the pathograph models.

