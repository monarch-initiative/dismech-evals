              label: hidradenitis suppurativa
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tertiary Lymphoid Structure Formation
        description: 'In chronic HS lesions, organized tertiary lymphoid structures (TLSs) form near epithelialized
          tunnels. These TLSs contain proliferative T cells (including Tfh, Treg, and IL-17A+/IFNG+ pathogenic
          T cells) and clonally expanded plasma cells producing anti-keratinocyte autoantibodies. HS fibroblasts
          expressing CXCL13 or CCL19 orchestrate lymphocyte aggregation via TNF-alpha feedback loops.

          '
        cell_types:
        - preferred_term: Plasma Cell
          term:
            id: CL:0000786
            label: plasma cell
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: IL17A+ pathogenic T cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        - preferred_term: IFNG+ pathogenic effector T cell
          term:
            id: CL:0000911
            label: effector T cell
        biological_processes:
        - preferred_term: Adaptive Immune Response
          modifier: DYSREGULATED
          term:
            id: GO:0002250
            label: adaptive immune response
        - preferred_term: Type II Interferon Production
          modifier: INCREASED
          term:
            id: GO:0032609
            label: type II interferon production
      selected_evidence:
        snippet: HS fibroblasts express CXCL13 or CCL19 in response to immune cytokines. Using a microfluidic
          system to mimic TLS on a chip, we found that HS fibroblasts critically orchestrated lymphocyte
          aggregation via tumor necrosis factor alpha (TNF-α)-CXCL13 and TNF-α-CCL19 feedback loops with
          B and T cells, respectively; early TNF-α blockade suppressed aggregate initiation.
        supports: SUPPORT
