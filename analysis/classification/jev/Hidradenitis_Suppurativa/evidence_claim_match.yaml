  227cdfae57f2b8463921ae9ad6590a76ccf124912123cc49488159eca35d8cdd:
    claim:
      about:
        disease:
          name: Hidradenitis Suppurativa
          disease_term:
            preferred_term: hidradenitis suppurativa
            term:
              id: MONDO:0006559
              label: hidradenitis suppurativa
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hs_psen1_notch_signal_direction
        prompt: Does the PSEN1 acne inversa allele lower Notch signaling in human follicular keratinocytes,
          as the gamma-secretase loss-of-function model predicts, when a zebrafish assay of the same truncation
          reports the opposite direction?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Gamma-Secretase Loss of Function
        - genetic#PSEN1
        - has_subtypes#AI3
        rationale: 'The Gamma-Secretase Loss of Function node carries a DECREASED modifier on the Notch
          signaling pathway, and the measurements behind it come from NCSTN knockdown in keratinocytes.
          For PSEN1, a zebrafish expression assay of the P242LfsX11 acne inversa truncation reports enhanced
          rather than reduced Notch signaling. The mismatch is mechanistically material because the direction
          of the Notch change is what the node asserts, and because a gain of Notch activity would make
          the PSEN1 form a different mechanism from the other two subunit genes rather than a third instance
          of the same one. Whether the zebrafish result transfers to human follicular keratinocytes is
          the open question: the assay expressed truncated proteins in a non-mammalian model and measured
          Notch signaling in that system rather than keratinization of the hair follicle.'
        proposed_experiments:
        - experiment_id: exp_hs_psen1_notch_in_human_keratinocytes
          name: Notch output of the PSEN1 acne inversa truncation in human keratinocytes
          description: Introduce the acne inversa PSEN1 frameshift allele heterozygously into human keratinocytes
            at endogenous expression levels, alongside NCSTN and PSENEN loss-of-function alleles as comparators,
            and measure cleaved Notch, canonical Notch target transcripts, and differentiation markers
            in the same assay.
          decision_criterion: The shared loss-of-function model holds if the PSEN1 allele lowers Notch
            output in the same direction as the NCSTN and PSENEN alleles; the zebrafish finding generalizes,
            and the node needs splitting by gene, if the PSEN1 allele raises Notch output in human keratinocytes
            as well.
          would_support:
          - pathophysiology#Gamma-Secretase Loss of Function
          would_refute:
          - pathophysiology#Gamma-Secretase Loss of Function
          supporting_outcome:
          - Cleaved Notch and canonical Notch target transcripts fall in PSEN1 mutant keratinocytes, as
            they do in the NCSTN and PSENEN comparators.
          refuting_outcome:
          - Notch output rises in PSEN1 mutant keratinocytes while falling in the NCSTN and PSENEN comparators.
      selected_evidence:
        snippet: In contrast, the truncated protein potentially produced by the P242LfsX11 acne inversa
          mutation has no effect on Appa cleavage but, unexpectedly, enhances Notch signalling.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24101600
      reference_title: Differential, dominant activation and inhibition of Notch signalling and APP cleavage
        by truncations of PSEN1 in human disease.
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      explanation: 'The zebrafish result that creates the mismatch: the acne inversa PSEN1 truncation
        raises Notch signaling rather than lowering it.'
