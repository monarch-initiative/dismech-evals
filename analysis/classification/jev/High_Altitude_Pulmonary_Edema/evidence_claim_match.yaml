      - /disease_term
    evidence_metadata:
      reference: PMID:38682380
      reference_title: Evaluation and Management of the Individual with Recurrent High Altitude Pulmonary
        Edema.
      evidence_source: OTHER
      explanation: That modifying rate of ascent, exertion, and acclimatization reduces recurrence risk
