              term:
                id: UBERON:0002299
                label: alveolus of lung
            conditions:
            - hypoxia (3% oxygen, 24 h)
            - perfluorocarbon co-culture (10%)
            culture_system: Microfluidic lung-on-chip under hypoxic gas control
            publication: PMID:41786071
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Capillary Stress Failure of the Blood-Gas Barrier
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Reproduces hypoxia-driven loss of blood-gas barrier proteins and its pharmacological
          reversal.
        limitations: The chip applies hypoxia directly to the barrier and has no pulmonary circulation,
          so it cannot reproduce the exaggerated, spatially uneven hypoxic vasoconstriction and capillary
          overperfusion that are the actual initiating lesion in HAPE. It therefore models the downstream
          barrier consequence of hypoxia, not the hemodynamic cause.
        readouts:
        - name: Blood-gas barrier-related protein expression
          target: Capillary Stress Failure of the Blood-Gas Barrier
          direction: DECREASED
          interpretation: Loss of barrier proteins under hypoxia is the molecular correlate of the barrier-failure
            node.
