        context:
        - path: /experimental_models/0
          value:
            name: Hypoxia-exposed lung-on-chip model of blood-gas barrier dysfunction
            description: A microfluidic lung-on-chip exposed to 3% oxygen for 24 hours to recapitulate
              hypoxic lung injury at the organ level, used alongside a canine HAPE model to test perfluorocarbon
              and to localize its effect to the HIF-1-alpha/HO-1 pathway. The chip isolates the direct
              effect of hypoxia on the barrier from the hemodynamic overperfusion that drives HAPE in
              vivo, which is both what makes it informative and what bounds it.
            experimental_model_type: ORGAN_ON_CHIP
            namo_type: namo:OrganOnChip
            organism:
              preferred_term: human
