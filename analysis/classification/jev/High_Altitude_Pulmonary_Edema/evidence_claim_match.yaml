  6dfc122ccaf63a3809949449b4e033174172c51b5eaa648c7b596b9ddd472f0f:
    claim:
      about:
        disease:
          name: High Altitude Pulmonary Edema
          disease_term:
            preferred_term: high altitude pulmonary edema
            term:
              id: MONDO:0031257
              label: high altitude pulmonary edema
        context:
        - path: /pathophysiology/2
          value:
            name: Pulmonary Capillary Hypertension and Regional Overperfusion
            description: 'Pulmonary capillary pressure rises well above normal. In the Capanna Regina
              Margherita study, every susceptible subject who went on to develop HAPE had a measured capillary
              pressure above 19 mmHg while every susceptible subject who did not remained below it — a
              separation clean enough to make capillary pressure the proximate determinant rather than
              a correlate. This is a precapillary, not a postcapillary, hypertension: left atrial pressure
              is normal, which is what makes the resulting edema non-cardiogenic.'
            role: mediator
            biological_scale: TISSUE
            locations:
            - preferred_term: Lung
              term:
                id: UBERON:0002048
                label: lung
            cell_types:
            - preferred_term: Pulmonary capillary endothelial cell
              term:
                id: CL:4028001
                label: pulmonary capillary endothelial cell
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Capillary Stress Failure of the Blood-Gas Barrier
        causal_link_type: DIRECT
        description: Transmural pressure in the overperfused capillary segments exceeds the mechanical
          tolerance of the thin portion of the blood-gas barrier.
      selected_evidence:
        snippet: All of them had a pulmonary capillary pressure >19 mm Hg (range 20 to 26 mmHg), whereas
          all 7 susceptible subjects without HAPE had a pulmonary capillary pressure < 19 mm Hg (range
          14 to 18 mm Hg).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2/downstream/0
      evidence_path: /pathophysiology/2/downstream/0/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /pathophysiology/2
    evidence_metadata:
      reference: PMID:11319198
      reference_title: High-altitude pulmonary edema is initially caused by an increase in capillary pressure.
      evidence_source: HUMAN_CLINICAL
      explanation: The complete separation of HAPE and non-HAPE susceptible subjects by capillary pressure
        supports pressure as the proximate cause of the subsequent barrier lesion.
