          term:
            id: GO:0007585
            label: respiratory gaseous exchange by respiratory system
          modifier: DECREASED
      selected_evidence:
        snippet: A model is also presented to characterize HAPE nonsusceptible versus susceptible individuals
          based on the efficiency of alveolar-capillary oxygen uptake and estimated morphology of the
          air-blood barrier.
