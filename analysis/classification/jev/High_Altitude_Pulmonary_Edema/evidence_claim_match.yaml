  f08b22fb42ecd850d7632d7866fdf3acc08c9662e960401f2c53401bc4c25e39:
    claim:
      about:
        disease:
          name: High Altitude Pulmonary Edema
          disease_term:
            preferred_term: high altitude pulmonary edema
            term:
              id: MONDO:0031257
              label: high altitude pulmonary edema
        context:
        - path: /pathophysiology/1
          value:
            name: Exaggerated and Uneven Hypoxic Pulmonary Vasoconstriction
            description: 'Hypoxic pulmonary vasoconstriction is normally a matching reflex that diverts
              perfusion away from poorly ventilated lung. In HAPE-susceptible individuals the response
              is both excessive in magnitude and regionally heterogeneous. Reduced nitric oxide bioavailability
              and increased endothelin-1 shift the vasomotor balance toward constriction. The heterogeneity
              is the pathogenically important feature: it is what converts a global rise in pulmonary
              vascular resistance into focal capillary overperfusion rather than an evenly shared pressure
              load.'
            role: mediator
            biological_scale: TISSUE
            locations:
            - preferred_term: Lung
              term:
                id: UBERON:0002048
                label: lung
            cell_types:
            - preferred_term: Smooth muscle cell of the pulmonary artery
              term:
                id: CL:0002591
                label: smooth muscle cell of the pulmonary artery
            - preferred_term: Pulmonary artery endothelial cell
              term:
                id: CL:1001568
                label: pulmonary artery endothelial cell
            biological_processes:
            - preferred_term: Nitric oxide biosynthetic process
              term:
                id: GO:0006809
                label: nitric oxide biosynthetic process
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Pulmonary Capillary Hypertension and Regional Overperfusion
        causal_link_type: DIRECT
        description: Uneven precapillary constriction concentrates the cardiac output in the unconstricted
          capillary segments, raising pressure there rather than distributing it.
      selected_evidence:
        snippet: The HAPE-susceptible subjects, compared with the control subjects, had an enhanced pulmonary
          vasoreactivity to inspiratory hypoxia at low altitude and higher mean pulmonary artery pressures
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1/downstream/0
      evidence_path: /pathophysiology/1/downstream/0/evidence/0
      context_paths:
