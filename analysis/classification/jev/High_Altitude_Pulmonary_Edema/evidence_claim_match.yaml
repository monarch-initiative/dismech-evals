      assertion_type: ExperimentalModel
      assertion:
        name: Hypoxia-exposed lung-on-chip model of blood-gas barrier dysfunction
        description: A microfluidic lung-on-chip exposed to 3% oxygen for 24 hours to recapitulate hypoxic
          lung injury at the organ level, used alongside a canine HAPE model to test perfluorocarbon and
          to localize its effect to the HIF-1-alpha/HO-1 pathway. The chip isolates the direct effect
          of hypoxia on the barrier from the hemodynamic overperfusion that drives HAPE in vivo, which
          is both what makes it informative and what bounds it.
        experimental_model_type: ORGAN_ON_CHIP
        namo_type: namo:OrganOnChip
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        tissue_term:
          preferred_term: alveolus of lung
          term:
            id: UBERON:0002299
            label: alveolus of lung
        conditions:
        - hypoxia (3% oxygen, 24 h)
        - perfluorocarbon co-culture (10%)
        culture_system: Microfluidic lung-on-chip under hypoxic gas control
        publication: PMID:41786071
        modeled_mechanisms:
        - target: Capillary Stress Failure of the Blood-Gas Barrier
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces hypoxia-driven loss of blood-gas barrier proteins and its pharmacological
            reversal.
          limitations: The chip applies hypoxia directly to the barrier and has no pulmonary circulation,
            so it cannot reproduce the exaggerated, spatially uneven hypoxic vasoconstriction and capillary
            overperfusion that are the actual initiating lesion in HAPE. It therefore models the downstream
            barrier consequence of hypoxia, not the hemodynamic cause.
          readouts:
          - name: Blood-gas barrier-related protein expression
            target: Capillary Stress Failure of the Blood-Gas Barrier
            direction: DECREASED
            interpretation: Loss of barrier proteins under hypoxia is the molecular correlate of the barrier-failure
              node.
      selected_evidence:
        snippet: In addition, we found that PFC blocked activation of the hypoxia-inducible factor-1α
          (HIF-1α)/heme oxygenase-1 (HO-1) signaling pathway.
        supports: SUPPORT
