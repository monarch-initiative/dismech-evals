        name: High-Permeability Alveolar Flooding and Hypoxemia
        description: Protein-rich, often erythrocyte-containing fluid fills the interstitium and alveoli
          in a characteristically patchy distribution that mirrors the uneven perfusion that produced
          it. Flooded alveoli are perfused but not ventilated, creating shunt, and the resulting hypoxemia
          deepens alveolar hypoxia and so intensifies hypoxic vasoconstriction — a positive feedback loop
          that accounts for the rapid clinical deterioration and for why descent or oxygen, which break
          the loop at its origin, are so effective.
        role: consequence
        biological_scale: ORGANISM
        conforms_to: alveolar_capillary_barrier_failure#Protein-Rich Alveolar Flooding and Gas-Exchange
          Failure
        locations:
