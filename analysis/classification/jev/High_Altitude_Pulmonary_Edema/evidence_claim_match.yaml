            name: Capillary Stress Failure of the Blood-Gas Barrier
            description: Mechanical overload of the alveolar-capillary membrane disrupts the endothelial
              and epithelial layers and their shared basement membrane — stress failure in West's sense,
              a physical rupture rather than a signalled junctional opening, although junctional loss
              accompanies it. The barrier stops excluding protein and erythrocytes, which is why HAPE
              lavage fluid is high-protein and often blood-tinged. This is the node at which HAPE joins
              the shared blood-gas barrier pathway, and where a hypoxia-driven disease and a toxicant-
              or pathogen-driven one become mechanistically the same lesion.
            role: mediator
