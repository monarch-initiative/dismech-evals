      assertion_type: Diagnosis
      assertion:
        name: Clinical diagnosis of HAPE
        description: HAPE is a clinical diagnosis; there is no gold-standard test. It requires recent
          rapid ascent above roughly 2,500-3,000 m within one to five days, a qualifying combination of
          symptoms and physical signs, radiographic non-cardiogenic pulmonary oedema, exclusion of ARDS,
          cardiogenic oedema and severe pneumonia, and improvement on descent or oxygen. The symptom-plus-sign
          threshold is what separates it from ordinary altitude breathlessness.
        presence: PRESENT
        notes: The five-point criteria used by the 411-patient Qinghai inpatient cohort (PMID:41316096)
          add the recent-ascent window, chest CT or radiograph findings, exclusion of ARDS, cardiogenic
          pulmonary oedema and severe pneumonia, and symptom remission on transfer to low altitude.
      selected_evidence:
        snippet: A clinical diagnosis of HAPE requires the presence of a minimum of two symptoms, such
          as dyspnea at rest, cough, weakness, reduced exertional tolerance, or chest tightness, concurrent
          with at least two physical signs, including inspiratory crackles, central cyanosis, tachypnea,
          or tachycardia
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
