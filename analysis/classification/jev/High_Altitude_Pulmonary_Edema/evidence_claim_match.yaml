  ce12447c336e8c53ec72d5b11dd7a4177aa0f3b762c0481755f8f6b2ce755639:
    claim:
      about:
        disease:
          name: High Altitude Pulmonary Edema
          disease_term:
            preferred_term: high altitude pulmonary edema
            term:
              id: MONDO:0031257
              label: high altitude pulmonary edema
        context: []
      assertion_type: Environmental
      assertion:
        name: Rapid Ascent to High Altitude
        description: Ascent above roughly 2,500-3,000 m, particularly when rapid and combined with exertion,
          is the necessary environmental exposure - necessary but not sufficient, since HAPE strikes only
          a susceptible minority of those who ascend, which is what the susceptibility loci and the vasoreactivity
          knowledge gap are about. Rate of ascent, absolute altitude attained, sleeping altitude, and
          exertion during ascent are each independent determinants of risk, which is why staged ascent
          and preacclimatization are effective prevention.
        exposure_term:
          preferred_term: exposure to hypobaric hypoxia during ascent to high altitude
        presence: PRESENT
        effect: HARMFUL
        notes: Deliberately left unbound. ECTO and XCO were both searched (2026-08) for a high-altitude
          or hypobaric-hypoxia exposure class and neither has one. The closest XCO candidates are experimental
          apparatus and condition terms (XCO:0001406 hypobaric chamber, XCO:0000010 controlled air oxygen
          content) that describe a laboratory manipulation rather than the natural environmental exposure
          a traveller undergoes, so binding one would misdescribe the exposure. Revisit if ECTO adds an
          altitude exposure class.
      selected_evidence:
        snippet: a multipronged approach including pharmacologic prophylaxis, careful planning about the
          rate of ascent, and the degree of physical effort and other strategies, such as preacclimatization,
          staged ascent, and use of hypoxic tents, can be employed to reduce the risk of recurrence with
          future travel
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
