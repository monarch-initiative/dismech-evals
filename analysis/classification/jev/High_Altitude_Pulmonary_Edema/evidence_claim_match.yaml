          population is the inverse of the classic form - people acclimatised by residence who have lost
          that acclimatisation - which is what makes it worth separating, since it changes who should
          be counselled about prophylaxis. The mechanism is regarded as the same, so this is a variant
          of population and presentation rather than of pathophysiology.
