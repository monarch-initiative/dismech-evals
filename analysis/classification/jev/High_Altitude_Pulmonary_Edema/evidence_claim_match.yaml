        name: Sustained Alveolar Hypoxia at Altitude
        description: Rapid ascent lowers barometric pressure and therefore inspired oxygen tension, producing
          sustained alveolar hypoxia. Exercise during ascent aggravates it by raising cardiac output and
          pulmonary blood flow through an already hypoxic vascular bed. This is the environmental trigger;
          no host lesion is required.
        role: trigger
        biological_scale: ORGANISM
        conforms_to: alveolar_capillary_barrier_failure#Alveolar-Capillary Interface Insult
        locations:
        - preferred_term: Lung
          term:
            id: UBERON:0002048
            label: lung
        biological_processes:
        - preferred_term: Response to hypoxia
          term:
            id: GO:0001666
            label: response to hypoxia
          modifier: INCREASED
        - preferred_term: Cellular response to hypoxia
          term:
            id: GO:0071456
            label: cellular response to hypoxia
          modifier: INCREASED
      selected_evidence:
        snippet: Exposure to hypobaric hypoxia, especially when associated with exercise, is a condition
          potentially leading to the development of the so-called high-altitude pulmonary edema (HAPE).
        supports: SUPPORT
