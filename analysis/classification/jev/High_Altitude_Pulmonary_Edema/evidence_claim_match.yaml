      assertion:
        name: Impaired Alveolar Fluid Clearance
        description: 'Hypoxia downregulates the amiloride-sensitive epithelial sodium channel and Na+/K+-ATPase-driven
          transepithelial sodium transport that normally drives water out of the airspace. Reduced clearance
          does not by itself cause HAPE but determines how much fluid accumulates once the barrier has
          failed, and it is the rationale for beta-agonist prophylaxis. Its contribution is secondary
          to the hemodynamic lesion: in the tadalafil and dexamethasone prophylaxis trial, both drugs
          prevented HAPE while producing no measurable change in nasal potential difference, the surrogate
          for alveolar sodium transport.'
        role: modifier
        biological_scale: TISSUE
