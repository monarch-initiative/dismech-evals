      assertion_type: Definition
      assertion:
        name: Pathologic definition of Hodgkin lymphoma
        definition_type: CASE_DEFINITION
        description: Hodgkin lymphoma is a germinal-center-B-cell-derived lymphoma in which sparse neoplastic
          cells (Hodgkin/Reed-Sternberg cells in classic Hodgkin lymphoma; lymphocyte-predominant cells
          in NLPHL) sit within an extensive, functionally ineffective inflammatory/immune infiltrate.
        scope: General pathologic and molecular definition spanning classic Hodgkin lymphoma and nodular
          lymphocyte-predominant Hodgkin lymphoma.
      selected_evidence:
        snippet: The hallmark of this disease is the neoplastic Hodgkin/Reed-Sternberg (HRS) cell, which
          is favored to be derived from germinal center B-cells but has lost many of the B-cell markers.
        supports: SUPPORT
