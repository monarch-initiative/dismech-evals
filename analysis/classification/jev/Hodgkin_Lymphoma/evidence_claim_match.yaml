        subtype_term:
          preferred_term: classic Hodgkin lymphoma
          term:
            id: MONDO:0009348
            label: classic Hodgkin lymphoma
        subtype_frequency: ~95%
        description: 'The great majority of Hodgkin lymphoma. Defined by Hodgkin/Reed-Sternberg cells
          with a characteristic CD30+ CD15+ PAX5(weak) CD45- immunophenotype in a dense inflammatory background,
          constitutive NF-kappaB and JAK/STAT signaling, near-universal 9p24.1 copy gain driving PD-1
          ligand expression, and an Epstein-Barr-virus-associated subset. WHO recognizes four histologic
          variants: nodular sclerosis, mixed cellularity, lymphocyte-rich, and lymphocyte-depleted. Fully
          curated as a distinct dismech entry (kb/disorders/Classic_Hodgkin_Lymphoma.yaml), where it conforms
          to the tumor_promoting_inflammation, viral_oncogenesis (EBV LMP1), and immune_checkpoint_blockade
          modules.'
        genes:
        - preferred_term: JAK2
          term:
            id: hgnc:6192
            label: JAK2
        - preferred_term: STAT6
          term:
            id: hgnc:11368
            label: STAT6
        - preferred_term: TNFAIP3
          term:
            id: hgnc:11896
            label: TNFAIP3
        - preferred_term: NFKBIA
          term:
            id: hgnc:7797
            label: NFKBIA
        - preferred_term: B2M
          term:
            id: hgnc:914
            label: B2M
        - preferred_term: CIITA
          term:
            id: hgnc:7067
            label: CIITA
      selected_evidence:
        snippet: Classic Hodgkin lymphoma (CHL) accounts for 15-25% of all lymphomas in the Western world.
        supports: SUPPORT
