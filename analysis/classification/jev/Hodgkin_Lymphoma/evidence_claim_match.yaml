      assertion:
        name: NLPHL
        display_name: Nodular lymphocyte-predominant Hodgkin lymphoma (NLPHL)
        subtype_term:
          preferred_term: nodular lymphocyte predominant Hodgkin lymphoma
          term:
            id: MONDO:0044778
            label: nodular lymphocyte predominant Hodgkin lymphoma
        subtype_frequency: ~5%
        description: A biologically distinct, uncommon form of Hodgkin lymphoma driven by lymphocyte-predominant
          (LP; "popcorn") cells that retain a functional B-cell program (CD20+, CD45+, BCL6+; CD15- and
          CD30-, i.e. the near-inverse of the classic HRS immunophenotype) set within nodular meshworks
          of follicular dendritic cells and a lymphocyte/histiocyte-rich background. It typically affects
          children and young adults, is usually indolent with a favorable prognosis, is generally EBV-negative,
          and can progress to T-cell/histiocyte-rich large B-cell lymphoma or diffuse large B-cell lymphoma.
      selected_evidence:
        snippet: Nodular lymphocyte predominant Hodgkin lymphoma (NLPHL) represents approximately 5% of
          Hodgkin lymphoma and typically affects children and young adults.
        supports: SUPPORT
