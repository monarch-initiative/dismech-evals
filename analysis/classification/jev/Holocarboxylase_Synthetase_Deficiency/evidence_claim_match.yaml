  8e57d69e10b419c73f273b60637c0828823c33070488da4c615145cf5e224370:
    claim:
      about:
        disease:
          name: Holocarboxylase Synthetase Deficiency
          disease_term:
            preferred_term: holocarboxylase synthetase deficiency
            term:
              id: MONDO:0009666
              label: holocarboxylase synthetase deficiency
        context: []
      assertion_type: ProgressionInfo
      assertion:
        notes: 'HLCS deficiency follows a progression from genetic defect through multi-enzyme deficiency
          to metabolic crisis. (1) Biallelic HLCS variants reduce holocarboxylase synthetase activity.
          (2) Impaired biotinylation of PC, PCC, MCC, and ACC produces multiple carboxylase deficiency.
          (3) Accumulation of organic acids and acylcarnitines causes metabolic acidosis, lactic acidosis,
          ketosis, and hyperammonemia. (4) Systemic decompensation produces neurologic injury (seizures,
          encephalopathy), dermatologic features (rash, alopecia), and respiratory distress. (5) Without
          treatment, progression to coma and death can occur. With prompt biotin therapy, clinical outcomes
          are excellent: early diagnosis via newborn screening coupled with biotin supplementation achieves
          biochemical normalization and clinical symptom resolution in over 85 percent of patients and
          reduces neurological sequelae risk. In a 28-patient Chinese cohort, 82 percent of patients who
          received prompt biotin therapy developed normally on follow-up. Onset is typically neonatal
          but very late-onset forms (11 years symptomatic, 23 years diagnosed) demonstrate phenotypic
          heterogeneity. Variable biotin responsiveness correlates with genotype and residual enzyme activity
          in a multidimensional framework integrating gene-enzyme activity-metabolic phenotype-treatment
          response.

          '
