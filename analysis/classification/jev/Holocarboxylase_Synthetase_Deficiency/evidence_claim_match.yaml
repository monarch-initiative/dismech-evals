              label: holocarboxylase synthetase deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Molecular genetic testing
        description: 'Next-generation sequencing panels or targeted HLCS gene analysis enables rapid diagnosis
          in acutely ill neonates and can guide early initiation of biotin therapy before confirmatory
          biochemical testing is complete.

          '
        treatment_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: 'Molecular testing is used for both diagnostic confirmation and to guide genotype-specific
          biotin dosing. Rapid turnaround is critical in the acute neonatal setting. Genotype correlates
          with biotin responsiveness: variants in the C-terminal biotin-binding domain (amino acids 448-701)
          are generally biotin-responsive, while variants in the N-terminal extension/substrate-binding
          region (amino acids 159-314) may be less responsive or biotin-unresponsive. Residual HLCS enzyme
          activity closely correlates with disease severity and age of symptom onset, with later onsets
          associated with splice variants and earlier onsets (< 1 month) linked to missense variants such
          as p.(Leu237Pro). Population-specific HLCS mutation hotspots exist, including geographic variation
          in allele frequencies (e.g., c.1522C>T (p.R508W) comprises 41.1% of alleles in Chinese cohorts).

          '
      selected_evidence:
        snippet: Our case highlights the significance of early genetic testing in neonates with unexplained
          metabolic disorders to enable timely diagnosis and therapy initiation.
        supports: SUPPORT
