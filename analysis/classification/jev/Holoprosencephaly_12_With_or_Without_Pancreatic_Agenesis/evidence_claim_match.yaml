      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Prosencephalic Midline Patterning
        description: 'Cnot1 is expressed in the prosencephalic neural folds at the gestational stage at
          which the forebrain must divide into paired hemispheres. The p.Arg535Cys variant disrupts this
          patterning step, producing incomplete cleavage of the prosencephalon. The proposed molecular
          link is the same loss of SHH regulation seen in the pancreas, although the required direction
          of the SHH change differs between the two organs and has not been resolved: ectopic SHH expression
          is known to impair midline development, whereas SHH loss of function is the classic cause of
          holoprosencephaly.'
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: forebrain development
          term:
            id: GO:0030900
            label: forebrain development
          modifier: ABNORMAL
        - preferred_term: brain development
          term:
            id: GO:0007420
            label: brain development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Combining human and mouse data, we show that CNOT1 is associated with incomplete forebrain
          division.
        supports: SUPPORT
