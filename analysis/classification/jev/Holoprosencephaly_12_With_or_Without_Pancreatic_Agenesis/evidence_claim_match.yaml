      assertion:
        name: Pancreatic Agenesis or Hypoplasia
        description: The end state of failed pancreatic development in HPE12 spans complete agenesis (no
          pancreas at autopsy or imaging, with both endocrine and exocrine failure from birth), through
          functional insufficiency, to a pancreas that appears structurally normal at birth but has insufficient
          beta-cell reserve so that diabetes emerges only later in childhood or adolescence. This variable
          expressivity is why the disorder is named "with or without pancreatic agenesis". Gallbladder
          agenesis frequently co-occurs, reflecting the shared foregut-endoderm origin of the pancreatic
          and biliary buds.
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: The same variant was previously reported in 5 unrelated children. All individuals had
          HPE, and 4 out of 5 presented endo- and exocrine pancreatic insufficiency or total pancreas
          agenesis.
        supports: SUPPORT
