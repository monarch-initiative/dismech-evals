  51b73684b4205652dc2337ebd7d7d1a6039add32484d3c7b6d90c5f0ea9ae8fa:
    claim:
      about:
        disease:
          name: Holoprosencephaly 12 With or Without Pancreatic Agenesis
          disease_term:
            preferred_term: holoprosencephaly 12 with or without pancreatic agenesis
            term:
              id: MONDO:0032787
              label: holoprosencephaly 12 with or without pancreatic agenesis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hpe12_mouse_dosage_mismatch
        prompt: Why do mice require homozygosity for Cnot1 p.Arg535Cys to show pancreatic and forebrain
          defects while human heterozygotes are fully affected, and can the mouse be used to test candidate
          mechanisms for the human disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Pancreatic Progenitor Specification
        - pathophysiology#Disrupted Prosencephalic Midline Patterning
        rationale: 'The Cnot1 p.Arg535Cys knock-in mouse reproduces the human organ phenotypes only in
          homozygotes; heterozygotes are grossly normal. The authors note the same dosage discrepancy
          for HNF1B and conclude that early pancreatic development differs between mouse and human. Any
          mechanistic inference from the mouse, including the SHH-de-repression model that rests entirely
          on homozygous-embryo expression data, therefore carries an unquantified translational discount,
          and human iPSC-derived pancreatic and neural models are needed to test it at the human heterozygous
          dosage. The mouse phenotype is also not a precise phenocopy: homozygotes show exencephaly, spina
          bifida, and coloboma rather than holoprosencephaly.'
        proposed_experiments:
        - experiment_id: exp_hpe12_ipsc_pancreatic_endoderm_shh
          name: SHH-de-repression signature in heterozygous CNOT1 p.Arg535Cys human pancreatic endoderm
          description: Differentiate isogenic CNOT1 p.Arg535Cys heterozygous human iPSC lines toward pancreatic
            endoderm and measure SHH, PDX1, PTF1A, HNF1B, and GATA4/GATA6 expression against wild type,
            to test whether the SHH-de-repression signature observed in homozygous mouse embryos reproduces
            at human heterozygous dosage.
          experiment_type:
            preferred_term: directed differentiation and gene-expression profiling experiment
        - experiment_id: exp_hpe12_ccr4not_deadenylation_assay
          name: CCR4-NOT composition and mRNA-decay profiling in p.Arg535Cys heterozygous cells
          description: Profile CCR4-NOT complex composition, transcriptome-wide poly(A) tail lengths,
            and mRNA decay rates in p.Arg535Cys heterozygous cells versus CNOT1-depleted and wild-type
            controls, to determine whether the variant acts by gain of repressive function rather than
            loss of deadenylase activity.
          experiment_type:
            preferred_term: transcriptome-wide mRNA stability profiling experiment
      selected_evidence:
        snippet: Mice required a homozygous mutation in Cnot1 to display a pancreatic and brain phenotype
          while a heterozygous CNOT1 mutation resulted in the phenotype in three individuals in our cohort.
        supports: SUPPORT
