            term:
              id: MONDO:0032787
              label: holoprosencephaly 12 with or without pancreatic agenesis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: shh_derepression
        hypothesis_label: CNOT1 p.Arg535Cys causes HPE12 by failing to repress SHH in the developing foregut
          endoderm and forebrain
        status: EMERGING
        description: 'The proposed model is that p.Arg535Cys preserves (or enhances) CNOT1''s repressive
          activity on early differentiation factors such as the GATA transcription factors, so SHH is
          not switched off when it should be. The supporting data are the increased Shh with decreased
          Pdx1/Ptf1a/Hnf1b/Ins in the mutant mouse pancreas and the established requirement for dorsal
          foregut SHH repression. The model is incomplete: SHH would need to be de-repressed in the pancreas
          but reduced (or ectopically located) in the forebrain to account for both arms, since classic
          holoprosencephaly follows SHH loss of function. The authors explicitly flag this as unresolved.'
      selected_evidence:
        snippet: It is therefore possible that the p.Arg535Cys variant results in CNOT1 maintaining its
          inhibition activity on the GATA and other early differentiation factors and, as a consequence,
          SHH expression is not repressed
        supports: SUPPORT
    origin:
