        - pathophysiology#Disrupted Prosencephalic Midline Patterning
        rationale: Holoprosencephaly classically follows reduced SHH signalling, whereas the mouse pancreatic
          data show increased Shh. The original authors raise two non-exclusive resolutions, namely ectopic
          (mislocalised rather than merely elevated) SHH expression impairing midline development, or
          an organ-dependent direction of effect, but neither has been tested. This is the central unresolved
          point in the HPE12 mechanism model.
      selected_evidence:
        snippet: Another possibility is that the effect of the CNOT1 mutation on SHH signaling differs
          between the brain and the pancreas, resulting in a reduced expression in the developing brain
          and increased expression during pancreatic development.
        supports: SUPPORT
