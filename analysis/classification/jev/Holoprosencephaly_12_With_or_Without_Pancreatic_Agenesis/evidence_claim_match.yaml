        description: CNOT1 is the central scaffold of the CCR4-NOT complex, which catalyses poly(A) tail
          shortening (deadenylation) and thereby represses translation and triggers mRNA decay; it also
          mediates transcriptional repression independently of the complex. CNOT1 is expressed extremely
          early in embryogenesis, and its depletion in human cells alters the abundance of thousands of
          transcripts with a global decrease in mRNA decay. A variant-altered scaffold is therefore positioned
          to mis-set the timing of the early developmental gene-expression programme rather than simply
          reduce complex dosage.
        biological_scale: MOLECULAR
