      assertion_type: Pathophysiology
      assertion:
        name: CNOT1 p.Arg535Cys Variant
        description: The recurrent heterozygous de novo missense variant c.1603C>T (p.Arg535Cys) in CNOT1
          is the sole reported cause of HPE12. The affected arginine is highly conserved (to C. elegans),
          the variant is absent from population databases, and all in silico predictors call it deleterious.
          Critically, other de novo CNOT1 variants (missense, splice-site, and truncating) cause Vissers-Bodmer
          syndrome without holoprosencephaly or pancreatic agenesis, so HPE12 is attributed to a variant-specific,
          non-loss-of-function mechanism rather than to CNOT1 haploinsufficiency.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        gene:
          preferred_term: CNOT1
          description: CCR4-NOT transcription complex subunit 1; the scaffold subunit of the CCR4-NOT
            complex.
          term:
            id: hgnc:7877
            label: CNOT1
      selected_evidence:
        snippet: is predicted to be deleterious and is not present in public databases.
        supports: SUPPORT
