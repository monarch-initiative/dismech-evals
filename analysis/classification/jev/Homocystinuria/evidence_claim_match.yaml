      assertion_type: Prevalence
      assertion:
        population: United States claims-based cohort (strict case definition)
        measure_type: POINT_PREVALENCE
        prevalence_class: BAND_1_9_PER_100000
        rate_per_100000: 1.04
        percentage: 1.04 per 100,000
        notes: A recent US claims analysis produced a similar but slightly higher standardized prevalence
          estimate under a strict identification algorithm, again suggesting underdiagnosis in routine
          clinical practice.
      selected_evidence:
        snippet: Prevalence estimates for classical homocystinuria (HCU) are variable and likely underestimated
          due to underdiagnosis. Claims data represent a strong but seldom used resource to analyze prevalence
          of HCU. The aim of this study was to estimate a prevalence range of HCU in the US utilizing
          a combination of diagnosis codes, total homocysteine levels, and clinical presentations indicative
          of HCU. ... This was a non-interventional retrospective cohort study, using Optum's de-identified
          Market Clarity Data, with a patient identification period from January 01, 2016, through September
          30, 2021. An algorithm was developed to identify 2 cohorts of patients using broad and strict
          definitions of HCU. ... The average annual standardized prevalence across 2016-2020 was 5.29
          and 1.04 per 100,000 people for the broad and strict cohorts, respectively. ... Many patients
          with clinical presentations suggesting a diagnosis of HCU did not have an associated diagnosis,
          potentially indicating underdiagnosis or underreporting.
        supports: SUPPORT
