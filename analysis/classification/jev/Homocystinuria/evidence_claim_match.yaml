  2f9f06ef7c2a45d7e75131b69485368e7d309a65aa9096e8b45004eee5d7599e:
    claim:
      about:
        disease:
          name: Homocystinuria
          disease_term:
            preferred_term: homocystinuria
            term:
              id: MONDO:0004737
              label: homocystinuria
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Newborn screening (dried blood spot)
        description: 'Tandem mass spectrometry on the heel-prick dried blood spot quantifies methionine
          as the primary marker, in many programmes with the methionine/phenylalanine ratio, and total
          homocysteine on the same spot as a second-tier test. Methionine is a poor screening target:
          it is often still normal in the first days of life, particularly in pyridoxine-responsive disease,
          so sensitivity depends on the cut-off and the age at sampling.'
        diagnosis_term:
          preferred_term: newborn screening
          term:
            id: NCIT:C81178
            label: Newborn Screening
        measurements:
        - preferred_term: methionine, DBS
          term:
            id: LOINC:47700-0
            label: Methionine [Moles/volume] in DBS
        - preferred_term: methionine/phenylalanine molar ratio, DBS
          term:
            id: LOINC:53156-6
            label: Methionine/Phenylalanine [Molar ratio] in DBS
        - preferred_term: total homocysteine, DBS (second tier)
          term:
            id: LOINC:54301-7
            label: Homocysteine [Moles/volume] in DBS
        reference_ranges:
        - loinc_term:
            id: LOINC:47700-0
            label: Methionine [Moles/volume] in DBS
          unit: umol/L
          population: newborn screening, Kentucky (USA) programme, 2005-2020
          notes: 'Verbatim: "elevated methionine (cutoff is >60 µmol/L) and/or Met/Phe ratio (cutoff is
            >1.0)". Either criterion refers the spot for second-tier total homocysteine. The source states
            ">60", so exactly 60 is negative there; the half-open band places exactly 60 in the positive
            band.'
          interpretation_bands:
          - name: Screen negative
            upper_bound: 60.0
            unit: umol/L
            abnormal_flag: NORMAL
            interpretation: A negative methionine screen does not exclude CBS deficiency; the cited report
              describes a confirmed case with normal methionine on the initial screen.
          - name: Screen positive
            lower_bound: 60.0
            unit: umol/L
            abnormal_flag: HIGH
            interpretation: Triggers second-tier total homocysteine on the same dried blood spot.
        - loinc_term:
            id: LOINC:47700-0
            label: Methionine [Moles/volume] in DBS
          unit: umol/L
          population: newborn screening, New England (USA) programme from 1990 (bacterial inhibition assay)
          notes: 'Verbatim: "In 1990, the cutoff value was reduced to 1 mg per deciliter (67 micromol
            per liter)", from 2 mg/dL (134 µmol/L) used over the preceding 23.5 years. Recall was triggered
            when methionine was "at or above the established cutoff level", so the half-open band matches
            the source exactly. The lower cut-off raised the false-positive rate from 0.006% to 0.03%;
            detection rose from 8 cases in 2.2 million screened (1:275,000) to 7 in 1.1 million (1:157,000).'
          interpretation_bands:
          - name: Screen negative
            upper_bound: 67.0
            unit: umol/L
            abnormal_flag: NORMAL
          - name: Screen positive
            lower_bound: 67.0
            unit: umol/L
            abnormal_flag: HIGH
            interpretation: Repeat specimen requested; confirmation by quantitative plasma amino acid
              analysis.
        - loinc_term:
            id: LOINC:53156-6
            label: Methionine/Phenylalanine [Molar ratio] in DBS
          unit: '{ratio}'
          population: newborn screening, Kentucky (USA) programme, 2005-2020
          notes: Applied alongside the methionine cut-off ("and/or"). The source states ">1.0", so exactly
            1.0 is negative there; the half-open band places exactly 1.0 in the positive band.
          interpretation_bands:
          - name: Screen negative
            upper_bound: 1.0
            unit: '{ratio}'
            abnormal_flag: NORMAL
          - name: Screen positive
            lower_bound: 1.0
            unit: '{ratio}'
            abnormal_flag: HIGH
            interpretation: Triggers second-tier total homocysteine on the same dried blood spot.
        notes: Measurements bind the method-less quantitative DBS codes. No cut-off is recorded for second-tier
          total homocysteine because neither cited source states one for the dried blood spot; the Kentucky
          report says only that all 23 referred spots had elevated total homocysteine.
      selected_evidence:
        snippet: Methionine is the primary target in newborn screening for homocystinuria and total homocysteine
          is a secondary target.
        supports: SUPPORT
