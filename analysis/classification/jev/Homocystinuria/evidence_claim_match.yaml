  d7b7cd627467753a445d973285662781b67bd605bc2bd942d5a1641902dc8e40:
    claim:
      about:
        disease:
          name: Homocystinuria
          disease_term:
            preferred_term: homocystinuria
            term:
              id: MONDO:0004737
              label: homocystinuria
        context: []
      assertion_type: Genetic
      assertion:
        name: CBS (cystathionine beta-synthase) deficiency
        gene_term:
          preferred_term: CBS
          term:
            id: hgnc:1550
            label: CBS
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: I278T
          description: 'One of the most common CBS pathogenic variants worldwide. Shows reduced protein
            half-life (approximately 5.9 hours vs 16.6 hours for wild-type) and impaired folding. May
            respond partially to pyridoxine supplementation.

            '
        - name: T191M
          description: 'A common CBS pathogenic variant showing reduced protein half-life (approximately
            7.7 hours) and responsiveness to proteasome inhibition.

            '
        - name: R125Q
          description: 'A permissive CBS variant that responds to pharmacological proteostasis modulation
            and chaperone co-expression, showing partial functional rescue.

            '
        - name: R336C
          description: 'The p.Arg336Cys (R336C) pathogenic variant is the founder allele underlying the
            extremely high prevalence of CBS-deficient homocystinuria in Qatar, where it accounts for
            about 97% of disease alleles. Homozygotes are typically pyridoxine non-responsive with a severe
            multisystem phenotype.

            '
        features: 'CBS-deficient homocystinuria is caused by biallelic pathogenic variants in the CBS
          gene. The CBS enzyme uses pyridoxal-5-phosphate (vitamin B6) as a cofactor and is allosterically
          activated by S-adenosylmethionine. Over 200 pathogenic variants have been described. Many missense
          variants cause protein misfolding and instability rather than active-site disruption, making
          CBS deficiency a conformational disorder. Pyridoxine responsiveness is a major clinical modifier:
          non-responders present earlier with broader multi-organ disease, while extreme responders may
          present in adulthood with predominantly thromboembolic disease. E-HOD registry data on 328 patients
          classifies patients into four groups of pyridoxine responsiveness (NR, PR, FR, ER) that correlate
          with clinical severity.

          '
      selected_evidence:
        snippet: CBS | cystathionine beta-synthase | hgnc:1550 | Disease-causing germline mutation(s)
          in
        supports: SUPPORT
