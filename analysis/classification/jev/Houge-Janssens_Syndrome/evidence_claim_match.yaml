        description: 'RASopathies including Noonan syndrome share overlapping clinical features with HJS
          due to convergence on the RAS/MAPK signaling pathway, which PP2A normally opposes. Shared features
          include developmental delay, macrocephaly, seizures, hypotonia, and dysmorphic facial features.

          '
        distinguishing_features:
        - Congenital heart defects (especially pulmonary valve stenosis) are hallmark features of Noonan
          syndrome but not typical of HJS
        - Short stature is common in Noonan syndrome but not a core feature of HJS
        - Noonan syndrome is caused by variants in RAS/MAPK pathway genes (PTPN11, SOS1, RAF1, KRAS, BRAF)
          rather than PP2A subunit genes
        - HJS typically presents with more severe language delay relative to overall cognitive level
      selected_evidence:
        snippet: The frequently seen neurological defects are developmental delay, macrocephaly, seizures,
          neurocognitive deficits, and structural malformations.
        supports: SUPPORT
