        name: PP2A B56 Regulatory Subunit Variants
        biological_scale: MOLECULAR
        role: trigger
        description: 'Heterozygous missense variants - typically but not invariably de novo - in the two
          B56-family regulatory subunit genes of PP2A: PPP2R5D, encoding B56delta (HJS type 1), and PPP2R5C,
          encoding B56gamma (HJS type 4). For both, the reported mechanism is dominant-negative interference
          with substrate dephosphorylation rather than loss of function - PPP2R5D-null neurons do not
          reproduce the patient overgrowth phenotype, and PPP2R5C total loss-of-function alleles can be
          inherited from an unaffected parent. Recurrent PPP2R5D variants include E198K and E420K.

          '
