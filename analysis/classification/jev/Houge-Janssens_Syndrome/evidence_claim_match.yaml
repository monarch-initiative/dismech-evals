        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
      selected_evidence:
        snippet: We observed ribosomal protein S6 (RPS6) hyperphosphorylation as a shared signaling alteration,
          indicative of increased ribosomal protein S6-kinase activity.
        supports: SUPPORT
