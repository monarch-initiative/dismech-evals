      assertion:
        name: Overactivation of growth-promoting kinase pathways
        description: 'PP2A normally opposes the activity of serine/threonine protein kinases of the PIK3CA/AKT/mTOR
          and RAS/MAPK pathways. Decreased PP2A activity leads to sustained activation of these growth-promoting
          pathways, converging on mTORC1/p70S6K/RPS6 signaling. Phosphoproteomic analysis of PPP2R5D variant
          cells shows RPS6 hyperphosphorylation as a shared signaling alteration, with ERK-dependent mTORC1
          activation in both E198K and E420K variants, and additional AKT-mediated mTORC1 activation in
          the E420K variant.

          '
        biological_processes:
