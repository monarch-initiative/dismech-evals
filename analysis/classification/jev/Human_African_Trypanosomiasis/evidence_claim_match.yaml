  2fd11c85e5348534e638abca31c401e7265eef1a755ef022c1ecec5bf041934d:
    claim:
      about:
        disease:
          name: Human African trypanosomiasis
          disease_term:
            term:
              id: MONDO:0005459
              label: human African trypanosomiasis
            preferred_term: Human African trypanosomiasis
        context: []
      assertion_type: Treatment
      assertion:
        name: Acoziborole therapy
        description: Acoziborole is an oral benzoxaborole given as a single 960 mg dose, developed to
          remove the hospital admission, lumbar-puncture staging, and multi-day dosing that NECT and fexinidazole
          require. In a multicentre, open-label, single-arm phase 2/3 trial it reached 95.2% treatment
          success at 18 months in late-stage gambiense HAT and 100% in the early-stage and intermediate-stage
          cohort, with drug-related adverse events in 14% of participants, all mild or moderate. Because
          the trial had no comparator arm, the comparison against NECT rests on a post-hoc analysis against
          historical data rather than randomised comparison. It is not yet in WHO guidelines; a randomised
          placebo-controlled trial (NCT05256017) is ongoing.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: acoziborole pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
