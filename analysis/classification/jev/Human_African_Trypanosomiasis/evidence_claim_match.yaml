        context: []
      assertion_type: Pathophysiology
      assertion:
        name: VSG Antigenic Variation and Immune Evasion
        biological_scale: MOLECULAR
        description: Trypanosoma brucei expresses a single Variant Surface Glycoprotein (VSG) at a time
          from a large genomic repertoire, forming a dense protective surface coat. Periodic switching
          to an antigenically distinct VSG allows each new parasite subpopulation to escape the antibody
          response raised against the previous coat, so a relapsing wave of parasites survives each round
          of antibody-mediated clearance. This sustains chronic bloodstream infection long enough for
          the parasite to progress from the hemolymphatic stage to CNS invasion.
        biological_processes:
        - preferred_term: antigenic variation
          term:
            id: GO:0020033
            label: antigenic variation
      selected_evidence:
        snippet: Variant Surface Glycoproteins (VSGs) are developmentally regulated genes that mediate
          immune evasion.
        supports: SUPPORT
    origin:
