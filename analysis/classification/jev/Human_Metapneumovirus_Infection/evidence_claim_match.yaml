      assertion:
        name: Human metapneumovirus
        infectious_agent_term:
          preferred_term: Human metapneumovirus
          term:
            id: NCBITaxon:162145
            label: human metapneumovirus
        description: An enveloped, negative-sense single-stranded RNA virus of the family Pneumoviridae,
          first isolated in 2001 from young children with respiratory tract disease. It is the sole agent
          of this entry and is closely related to respiratory syncytial virus, which it resembles clinically.
      selected_evidence:
        snippet: From 28 young children in the Netherlands, we isolated a paramyxovirus that was identified
          as a tentative new member of the Metapneumovirus genus based on virological data, sequence homology
          and gene constellation.
        supports: SUPPORT
