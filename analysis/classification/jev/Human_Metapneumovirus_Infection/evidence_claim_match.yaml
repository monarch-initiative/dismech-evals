        description: hMPV spreads from person to person in respiratory droplets and aerosols generated
          by an infected person, entering through the nasopharyngeal mucosa.
      selected_evidence:
        snippet: Mostly transmitted through droplet or aerosol contamination, this viral infection may
          manifest clinical characteristics indicative of both upper and lower respiratory tract infections
          like fever, cough, rhinorrhea, pneumonia, bronchiolitis, and croup.
        supports: SUPPORT
