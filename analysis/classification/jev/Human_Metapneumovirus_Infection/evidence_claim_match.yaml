      assertion_type: Transmission
      assertion:
        name: Nosocomial person-to-person transmission
        description: hMPV is transmitted between patients in hospital, and immunocompromised inpatients
          are a group in whom introduced virus spreads and causes severe disease.
      selected_evidence:
        snippet: Among these, eight HMPV genomes formed a cluster (differing by ≤3 SNPs), likely to reflect
          nosocomial transmission, while two others were more distantly related and may represent independent
          introductions to the haematology unit.
        supports: SUPPORT
    origin:
      assertion_path: /transmission/2
      evidence_path: /transmission/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:32092386
      reference_title: Nanopore metagenomic sequencing to investigate nosocomial transmission of human
        metapneumovirus from a unique genetic group among haematology patients in the United Kingdom.
      evidence_source: HUMAN_CLINICAL
      explanation: Whole-genome sequencing of a haematology-unit cluster provides molecular evidence of
        patient-to-patient hMPV transmission within the hospital.
