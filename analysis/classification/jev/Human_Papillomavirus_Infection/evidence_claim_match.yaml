        context: []
      assertion_type: InfectiousAgent
      assertion:
        name: Human papillomavirus (HPV)
        infectious_agent_term:
          preferred_term: Human papillomavirus
          term:
            id: NCBITaxon:10566
            label: Human papillomavirus
        description: A small (~55 nm), non-enveloped virus with a circular ~8 kb double-stranded DNA genome
          encoding early (E1, E2, E4, E5, E6, E7) and late (L1, L2) proteins. The L1 major capsid protein
          self-assembles into virus-like particles, the basis of prophylactic vaccines. High-risk types
          encode E6 and E7 oncoproteins that inactivate p53 and pRB.
      selected_evidence:
        snippet: The E6 protein causes degradation of p53 leading to impaired cellular stress response.
          In contrast, the E7 protein impairs the activity of retinoblastoma protein (pRb) resulting in
          continuous cell cycle propagation.
        supports: SUPPORT
    origin:
