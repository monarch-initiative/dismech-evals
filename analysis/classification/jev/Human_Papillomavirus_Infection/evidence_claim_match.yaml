      assertion_type: Treatment
      assertion:
        name: Therapeutic HPV Vaccination (E6/E7-directed)
        description: Investigational therapeutic vaccines that, unlike prophylactic L1 VLP vaccines, are
          designed to act ON established infection. They present the HPV E6 and E7 oncoproteins — which
          ARE expressed by infected/transformed keratinocytes — via DNA, synthetic long-peptide, viral-vector,
          or mRNA platforms to prime E6/E7-specific cytotoxic T lymphocytes that recognize and kill already-infected
          cells. The furthest-advanced example, the HPV-16/18 E6/E7 DNA vaccine VGX-3100, produced histologic
          regression of CIN2/3 in a randomized phase 2b trial; synthetic long-peptide (ISA101), viral-vector,
          and mRNA candidates are in trials, often combined with immune-checkpoint blockade in HPV-driven
          cancers. Still investigational and not yet standard of care.
        therapeutic_modality: VACCINE
        treatment_term:
          preferred_term: vaccination
          term:
            id: NCIT:C15346
            label: Vaccination
        target_phenotypes:
        - preferred_term: Cervical intraepithelial neoplasia
          term:
            id: HP:0032242
            label: Cervical intraepithelial neoplasia
      selected_evidence:
        snippet: VGX-3100 is the first therapeutic vaccine to show efficacy against CIN2/3 associated
          with HPV-16 and HPV-18.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
