  dd145427a0455d1c9f8d5e2be6ca034855227192b439244f0ac4e43f28d715d7:
    claim:
      about:
        disease:
          name: Human Papillomavirus Infection
          disease_term:
            preferred_term: human papillomavirus infection
            term:
              id: MONDO:0005161
              label: human papilloma virus infection
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Productive Life Cycle Coupled to Keratinocyte Differentiation
        description: The HPV productive life cycle is tightly linked to the epithelial differentiation
          program. As infected keratinocytes migrate suprabasally and differentiate, viral late promoters
          activate, E1/E2-driven genome amplification occurs, and L1/L2 capsid proteins are expressed
          in the most superficial layers, where progeny virions assemble and are shed. E4 disrupts the
          keratin cytoskeleton to facilitate egress. Low-risk-type productive infection produces the benign
          hyperplastic warty lesion.
        cell_types:
        - preferred_term: Differentiating keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: Keratinocyte differentiation
          term:
            id: GO:0030216
            label: keratinocyte differentiation
          modifier: ABNORMAL
        - preferred_term: Viral genome replication
          term:
            id: GO:0019079
            label: viral genome replication
          modifier: INCREASED
        - preferred_term: Viral release from host cell
          term:
            id: GO:0019076
            label: viral release from host cell
          modifier: INCREASED
      selected_evidence:
        snippet: HPV gene expression confers an elevated proliferative potential, a delayed commitment
          to differentiation, and preferential persistence of the infected cell in the epithelial basal
          layer
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35215808
      reference_title: The Reservoir of Persistent Human Papillomavirus Infection; Strategies for Elimination
