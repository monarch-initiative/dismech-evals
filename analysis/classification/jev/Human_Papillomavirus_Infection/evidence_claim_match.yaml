      assertion_type: Pathophysiology
      assertion:
        name: Basal Keratinocyte Infection and Genome Establishment
        description: HPV virions gain access to basal keratinocytes of stratified squamous epithelium
          through microabrasions, binding heparan sulfate proteoglycans and entering by receptor-mediated
          endocytosis. The viral genome is established as a low-copy nuclear episome in the proliferating
          basal/parabasal compartment, where E1 and E2 support replication and partitioning.
        cell_types:
        - preferred_term: Basal keratinocyte
          term:
            id: CL:0002187
            label: basal cell of epidermis
        biological_processes:
        - preferred_term: Receptor-mediated endocytosis of HPV
          term:
            id: GO:0019065
            label: receptor-mediated endocytosis of virus by host cell
          modifier: INCREASED
      selected_evidence:
        snippet: In the infected epithelial basal layer, HPV genomes are maintained at a very low copy
          number, with only limited viral gene expression
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
