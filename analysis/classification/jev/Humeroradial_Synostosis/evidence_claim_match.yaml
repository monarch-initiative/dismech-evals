              id: MONDO:0007737
              label: humeroradial synostosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Joint Cavitation
        description: 'After interzone specification, the interzone cavitates — through matrix remodeling
          and local cell-fate control rather than obligate extensive cell death — to create the synovial
          joint cavity that separates the apposed cartilage elements. Failure of this cavitation step
          leaves the humeral and radial cartilage in continuity. Tight regulation of BMP and TGF-beta
          signaling within the interzone normally prevents the hypertrophic maturation of joint chondrocytes;
          dysregulation favors chondrogenic continuity rather than cavity formation.

          '
        cell_types:
        - preferred_term: Mesenchymal joint progenitor (interzone) cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        biological_processes:
        - preferred_term: embryonic skeletal joint development
          term:
            id: GO:0072498
            label: embryonic skeletal joint development
          modifier: DECREASED
      selected_evidence:
        snippet: Within the interzone, tight regulation of BMP and TGFβ signaling prevents the hypertrophic
          maturation of joint chondrocytes, in part through downstream transcriptional repressors and
          epigenetic modulators.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27581688
      reference_title: Building and maintaining joints by exquisite local control of cell fate.
      evidence_source: OTHER
      explanation: Tight BMP/TGF-beta control within the interzone is required to keep joint cells from
        chondrocyte maturation; disruption favors continuity and fusion rather than a cavitated joint.
