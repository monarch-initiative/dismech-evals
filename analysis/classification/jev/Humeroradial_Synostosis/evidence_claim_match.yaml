      assertion_type: Pathophysiology
      assertion:
        name: Defective Joint Interzone Specification
        description: 'Synovial joints form when chondrogenesis is locally suppressed within a skeletal
          condensation to establish an interzone of joint progenitor cells. The suppression of the chondrogenic
          program in the interzone is the first morphological sign of joint formation, achieved through
          the interplay of activators and inhibitors of developmental signaling (notably BMP/TGF-beta).
          Failure to specify and maintain the humeroradial interzone leaves the humeral and radial cartilage
          anlagen continuous.

          '
        cell_types:
        - preferred_term: Mesenchymal joint progenitor (interzone) cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: embryonic skeletal joint development
          term:
            id: GO:0072498
            label: embryonic skeletal joint development
          modifier: DECREASED
        - preferred_term: limb morphogenesis
          term:
            id: GO:0035108
            label: limb morphogenesis
          modifier: ABNORMAL
        - preferred_term: BMP signaling pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Positioning the prospective joint region involves establishment of an "interzone" region
          of joint progenitor cells within a nascent cartilage condensation, which is achieved through
          the interplay of activators and inhibitors of multiple developmental signaling pathways.
        supports: SUPPORT
