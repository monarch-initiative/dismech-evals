            description: 'In the autosomal recessive CYP26B1-related form of HRS, biallelic loss-of-function
              variants in CYP26B1 — the cytochrome P450 enzyme that catabolizes retinoic acid (RA) in
              a temporally and spatially restricted fashion during embryogenesis — impair RA degradation.
              The resulting failure to clear RA perturbs the proximodistal RA gradient that defines boundaries
              for cartilaginous growth and joint-space formation, predisposing to radiohumeral synostosis
