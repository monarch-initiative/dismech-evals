              id: MONDO:0007737
              label: humeroradial synostosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinoic Acid Gradient Disruption
        description: 'In the autosomal recessive CYP26B1-related form of HRS, biallelic loss-of-function
          variants in CYP26B1 — the cytochrome P450 enzyme that catabolizes retinoic acid (RA) in a temporally
          and spatially restricted fashion during embryogenesis — impair RA degradation. The resulting
          failure to clear RA perturbs the proximodistal RA gradient that defines boundaries for cartilaginous
          growth and joint-space formation, predisposing to radiohumeral synostosis and craniosynostosis.
          The same skeletal teratogenesis is produced by exogenous retinoic-acid exposure, underscoring
          that excess RA signaling, however caused, disrupts joint-interzone patterning.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: Mesenchymal joint progenitor (interzone) cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        biological_processes:
        - preferred_term: retinoic acid metabolic process
          term:
            id: GO:0042573
            label: retinoic acid metabolic process
          modifier: DECREASED
        - preferred_term: limb morphogenesis
          term:
            id: GO:0035108
            label: limb morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: The disorder is caused by biallelic missense mutations in CYP26B1, which encodes for
          a cytochrome P450 enzyme responsible for the catabolism of retinoic acid in a temporally and
          spatially restricted fashion during embryonic development.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27410456
      reference_title: 'Biallelic mutations in CYP26B1: A differential diagnosis for Pfeiffer and Antley-Bixler
        syndromes.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that impaired CYP26B1-mediated retinoic-acid catabolism is the upstream
        defect, perturbing the developmental RA gradient.
