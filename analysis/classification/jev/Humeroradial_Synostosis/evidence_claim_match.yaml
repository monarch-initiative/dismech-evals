      assertion_type: Pathophysiology
      assertion:
        name: Retinoic Acid Gradient Disruption
        description: 'In the autosomal recessive CYP26B1-related form of HRS, biallelic loss-of-function
          variants in CYP26B1 — the cytochrome P450 enzyme that catabolizes retinoic acid (RA) in a temporally
          and spatially restricted fashion during embryogenesis — impair RA degradation. The resulting
          failure to clear RA perturbs the proximodistal RA gradient that defines boundaries for cartilaginous
          growth and joint-space formation, predisposing to radiohumeral synostosis and craniosynostosis.
          The same skeletal teratogenesis is produced by exogenous retinoic-acid exposure, underscoring
          that excess RA signaling, however caused, disrupts joint-interzone patterning.

          '
        genes:
        - preferred_term: CYP26B1
          term:
            id: hgnc:20581
            label: CYP26B1
        molecular_functions:
        - preferred_term: monooxygenase activity
          term:
