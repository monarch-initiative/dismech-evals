      assertion_type: Subtype
      assertion:
        name: Non-neuronopathic
        display_name: Attenuated (non-neuronopathic) MPS II
        subtype_term:
          preferred_term: Attenuated (non-neuronopathic) Hunter syndrome
          term:
            id: MONDO:0016316
            label: mucopolysaccharidosis type 2, attenuated form
        description: 'About one third of MPS II. Cognition is preserved and onset is later, but the somatic
          disease is not benign: progressive joint contracture, airway obstruction, cardiac valve disease,
          hepatosplenomegaly, and skeletal involvement still accumulate over decades and determine morbidity
          and lifespan. Cerebrospinal fluid glycosaminoglycan levels are lower than in the neuronopathic
          form. This is the subtype for which idursulfase enzyme replacement therapy is best matched,
          since its inability to cross the blood-brain barrier costs nothing where there is no CNS disease
          - the same logic that makes enzyme replacement first-line in attenuated MPS I.'
      selected_evidence:
        snippet: While both phenotypes display accumulation of GAGs relative to a control pediatric population,
          nMPS II patients have higher levels of GAGs in the cerebrospinal fluid (CSF) than non-neuronopathic
          patients
        supports: SUPPORT
