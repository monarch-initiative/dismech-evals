              label: mucopolysaccharidosis type 2
        context: []
      assertion_type: Treatment
      assertion:
        name: Idursulfase enzyme replacement therapy
        description: Intravenous recombinant iduronate-2-sulfatase is the standard disease-modifying therapy
          for peripheral somatic disease. It lowers urinary glycosaminoglycans, reduces organomegaly,
          and can improve endurance, but treatment effects are incomplete and CNS disease is not corrected.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: idursulfase
            term:
              id: NCIT:C65883
              label: Idursulfase
      selected_evidence:
        snippet: Urinary glycosaminoglycans were reduced within 2 weeks of initiating idursulfase and
          were decreased 49% after 48 weeks of treatment (P<0.0001). Both liver and spleen volume were
          decreased at 24 weeks (P<0.01) and 48 weeks (P<0.001). The 6-minute walk test distance increased
          an average of 48 meters after 48 weeks (P=0.013).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
