      assertion_type: Discussion
      assertion:
        discussion_id: gap_hurler_residual_disease_after_enzyme_restoration
        prompt: Why does considerable residual disease burden persist in every successfully transplanted
          Hurler patient, and does it reflect secondary cascades that have become independent of ongoing
          glycosaminoglycan storage?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Hematopoietic stem cell transplantation
        - pathophysiology#Dermatan sulfate and heparan sulfate accumulation
        rationale: Transplantation restores donor-derived alpha-L-iduronidase, and a normal post-transplant
          enzyme level predicts superior long-term outcomes across organ systems. Yet residual burden
          requiring corrective surgery is observed in all patients at every decade of follow-up, and restrictive
          lung disease is present in every treated patient able to complete testing. Two explanations
          fit these data and have not been separated. Damage may accrue irreversibly before transplantation,
          which is typically performed near two years of age, and circulating enzyme may reach avascular
          cartilage, bone, heart valve and cornea poorly, which is what the enzyme replacement literature
          already reports. Alternatively, secondary cascades downstream of storage may become self-sustaining
          and stop responding to substrate clearance. Which is right determines whether the remedy is
          earlier or better enzyme delivery, or a second agent aimed at a downstream cascade. Serial multi-omic
          sampling from before transplantation through several years afterwards, and conditional restoration
          of Idua at different disease stages in animals, would separate them.
      selected_evidence:
        snippet: Despite HSCT, considerable residual disease burden and ensuing corrective surgical interventions
          were observed in all, and at every decade of follow-up post HSCT.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
