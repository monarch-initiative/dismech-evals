      reference_title: Corneal endothelium in mucopolysaccharide storage disorders. Morphologic studies
        in animal models.
      evidence_source: MODEL_ORGANISM
      explanation: Morphologic study of MPS I cat, MPS VI cat, and MPS VII dog corneas locates the lesion
        in stromal keratocytes. MPS I endothelium carried abundant lysosomal inclusions yet still maintained
        corneal dehydration normally, so the clouding is a stromal storage lesion rather than endothelial
        decompensation. This grounds the cellular substrate of the phenotype; it is animal morphology
        and does not by itself speak to the human frequency or course.
