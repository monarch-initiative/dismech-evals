    evidence_metadata:
      reference: PMID:33517895
      reference_title: 'Long term disease burden post-transplantation: three decades of observations in
        25 Hurler patients successfully treated with hematopoietic stem cell transplantation (HSCT).'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Three decades of follow-up in 25 successfully transplanted Hurler patients establish
        the observation this gap is about: enzyme restoration that is sufficient to change the natural
        history does not stop somatic disease accruing.'
