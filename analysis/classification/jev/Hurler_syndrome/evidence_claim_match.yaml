  451f6b7a7bde510b8bc11d068be8ac20ae7b6a1d41cfa511bef51b3711e9e2e1:
    claim:
      about:
        disease:
          name: Hurler syndrome
          disease_term:
            preferred_term: Hurler syndrome
            term:
              id: MONDO:0011758
              label: Hurler syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Newborn screening for low alpha-L-iduronidase activity
        description: 'Alpha-L-iduronidase (IDUA) activity is measured on the dried blood spot by tandem
          mass spectrometry, digital microfluidic fluorometry or a fluorometric plate assay; a low activity
          is the first-tier screening signal for MPS I in all its severities and does not by itself separate
          Hurler from the attenuated forms. Pseudodeficiency alleles are the dominant cause of a low screening
          activity, so programmes add a second tier on the same spot: IDUA sequencing, or quantification
          of the stored glycosaminoglycans dermatan sulfate and heparan sulfate, which stay normal in
          carriers and pseudodeficiency.'
        diagnosis_term:
          preferred_term: newborn screening
          term:
            id: NCIT:C81178
            label: Newborn Screening
        measurements:
        - preferred_term: alpha-L-iduronidase (IDUA) activity, DBS
          term:
            id: LOINC:55909-6
            label: Alpha-L-iduronidase [Enzymatic activity/volume] in DBS
        - preferred_term: dermatan sulfate, DBS (second tier)
          term:
            id: LOINC:90233-8
            label: Dermatan sulfate [Moles/volume] in DBS
        - preferred_term: heparan sulfate, DBS (second tier)
          term:
            id: LOINC:90235-3
            label: Heparan sulfate [Moles/volume] in DBS
        reference_ranges:
        - loinc_term:
            id: LOINC:55909-6
            label: Alpha-L-iduronidase [Enzymatic activity/volume] in DBS
          unit: umol/L/h
          population: pilot newborn-screening study establishing cut-offs from 3000 dried blood spots
            for six lysosomal disorders by tandem mass spectrometry; not an operating programme's cut-off
          notes: 'A pilot study''s cut-off, derived from 3000 dried blood spots and stated as the value
            above which a sample is negative ("IDUA, > 1.33 μmol/L·h"), so exactly 1.33 is positive in
            the source; the half-open band places exactly 1.33 in the negative band, a one-point discrepancy
            left as the convention requires rather than shifting the boundary. The source writes the unit
            as μmol/L·h, carried here as UCUM umol/L/h. An operating programme''s absolute IDUA cut-off
            could not be found stated in a PubMed abstract: the search iduronidase[tiab] AND newborn[tiab]
            AND dried blood[tiab] AND (umol/L/h[tiab] OR μmol/L/h[tiab] OR micromol[tiab] OR µmol/L/h[tiab]
            OR mol/L/h[tiab]) returned only this study and a 2007 methods paper, and the North Carolina
            programme report states its rule as a percentage of the daily mean activity.'
          interpretation_bands:
          - name: Screen positive
            upper_bound: 1.33
            unit: umol/L/h
            abnormal_flag: LOW
            interpretation: In the source a low IDUA activity is repeated and, if still low, recalled
              for a second spot; a low activity alone is not a diagnosis, and pseudodeficiency alleles
              are the commonest reason for one.
          - name: Screen negative
            lower_bound: 1.33
            unit: umol/L/h
            abnormal_flag: NORMAL
        notes: 'Measurements bind the method-less quantitative DBS codes; the specimen is intrinsic to
          a newborn screen, so the DBS code is the test''s identity here rather than a method-specific
          variant. The dermatan sulfate and heparan sulfate DBS codes are bound because glycosaminoglycan
          quantification on the screening spot is an evaluated second tier for MPS I; they carry no band,
          because the cited second-tier study states its rule as the 95th percentile of its own reference
          cohort rather than as a concentration. Operating programmes state their first-tier rule in different
          terms: North Carolina used 15% of the daily mean IDUA activity, a rule that cannot be carried
          as a band on an activity-per-volume code and is quoted as evidence instead.'
      selected_evidence:
        snippet: The screening algorithm included a flow injection analysis-tandem mass spectrometry assay
          as a first-tier screening method to measure α-L-iduronidase (IDUA) enzyme activity and Sanger
          sequencing of the IDUA gene on dried blood spots as a second-tier assay.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31133280
      reference_title: The North Carolina Experience with Mucopolysaccharidosis Type I Newborn Screening.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the dried-blood-spot IDUA activity measurement, with a genetic second tier,
        as the newborn-screening route to the diagnosis.
