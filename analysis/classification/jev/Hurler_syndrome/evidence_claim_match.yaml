      evidence_source: HUMAN_CLINICAL
      explanation: In 538 registry patients with both IDUA alleles identified, the severe (Hurler) end
        of the spectrum is dominated by genotypes in which neither allele can produce functional enzyme,
        while attenuated disease almost always retains a missense or intronic allele. This is the genotype-level
        support for biallelic severe loss of function as the basis of Hurler syndrome specifically.
