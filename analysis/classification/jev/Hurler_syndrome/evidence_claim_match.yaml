      evidence_source: HUMAN_CLINICAL
      explanation: Adults homozygous for IDUA pseudodeficiency alleles, which lower in vitro enzyme activity
        without abolishing it, show no excess of MPS I features against matched controls. This supports
        severe loss of alpha-L-iduronidase activity, rather than any reduction, as the requirement for
        disease. Ascertainment is by electronic medical record within a hospital biorepository, and the
        study reports no enzyme activity values.
