      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_idua_deficiency_gag_lysosomal_storage_model
        hypothesis_label: Canonical IDUA Deficiency / Glycosaminoglycan Lysosomal Storage Model
        status: CANONICAL
        description: Mucopolysaccharidosis type I — Hurler syndrome (severe), Hurler-Scheie (intermediate),
          and Scheie (attenuated) — is an autosomal recessive lysosomal storage disorder caused by loss-of-function
          variants in IDUA encoding α-L-iduronidase. Loss of α-L-iduronidase activity prevents lysosomal
          degradation of heparan sulfate and dermatan sulfate, producing pathological GAG accumulation
          in lysosomes of multiple cell types. Substrate storage drives progressive coarsening, dysostosis
          multiplex, hepatosplenomegaly, cardiac valvular and myocardial disease, corneal clouding, recurrent
          airway obstruction, and (in severe Hurler) progressive neurodevelopmental regression. Hematopoietic
          stem cell transplantation (the standard of care for severe Hurler before age 2), enzyme replacement
          therapy (laronidase), and emerging gene therapy approaches corroborate the IDUA-deficiency /
          GAG-accumulation axis as the canonical pathogenic mechanism.
        notes: 'Retained as CANONICAL with an expansion to include secondary cascades. The 2026 openscientist
          hypothesis-search report (kb/hypotheses/Hurler_syndrome/canonical_idua_deficiency_gag_lysosomal_storage_model)
          finds the model strongly supported; see the assessment sidecar assessments/openscientist-assessment-by-claude-opus-5.yaml
          for the claim-by-claim disposition. IDUA deficiency is the necessary upstream cause: residual
          enzyme activity maps quantitatively to clinical severity (Hurler 0.18%, Hurler-Scheie 0.27%,
          Scheie 0.79% of normal in patient fibroblasts); laronidase reduces urinary GAGs by about 65%
          over 26 weeks; normal post-HCT enzyme levels predict superior long-term outcomes across organ
          systems (n=217 multicenter); and homozygous IDUA pseudodeficiency alleles produce no clinically
          relevant excess of MPS I features in 1,803 adults. Critical refinement: GAG accumulation alone
          is necessary but NOT sufficient for the full clinical phenotype. Secondary cascades appear integral
          to pathogenesis: (1) an immune contribution to cardiovascular disease, shown in mice as inflammasome
          upregulation with medial macrophage and adventitial T-cell infiltration of the ascending aorta
          in immunocompetent but not immunodeficient MPS I animals, with the human counterpart untested
          (see the HUMAN_MODEL_MISMATCH discussion); (2) neuroinflammation with microglial activation
          and cytokine release; (3) cathepsin B leakage from destabilized lysosomes; (4) secondary ganglioside
          accumulation; (5) oxidative stress and mitochondrial dysfunction; and (6) disrupted signaling
          by extracellular glycosaminoglycan (FGF and Wnt pathway interactions). Residual disease burden
          persists after successful enzyme correction, but whether that reflects self-sustaining secondary
          cascades or irreversible pre-treatment damage plus poor enzyme delivery to avascular tissue
          is unresolved (see the KNOWLEDGE_GAP discussion). HCT (severe Hurler), ERT (laronidase, all
          subtypes), and investigational AAV-IDUA gene therapy validate the canonical upstream axis. Three
          numbers or attributions that appeared in an earlier version of this note were provider inference
          rather than source content and have been removed: a ">1.8% residual activity" pseudodeficiency
          cut-off, mast-cell activation as the immune mechanism in valves and myocardium, and IGF and
          BMP as the disrupted growth-factor pathways.'
      selected_evidence:
        snippet: Mucopolysaccharidosis type I (MPS I) is a rare autosomal recessive disorder, caused by
          deficiency of α-L-iduronidase, and consequent accumulation of dermatan and heparan sulfates.
        supports: SUPPORT
