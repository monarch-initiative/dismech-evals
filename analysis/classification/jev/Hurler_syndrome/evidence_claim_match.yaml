      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_hurler_immune_requirement_for_aortic_disease
        prompt: Does the immune activation that is required for aortic dilation in immunocompetent MPS
          I mice also mediate aortic and valvular disease in human Hurler syndrome?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive skeletal and multisystem organ injury
        - phenotypes#Abnormal heart valve morphology
        rationale: Immunocompetent C57BL/6 MPS I mice develop ascending aortic dilation, aortic insufficiency
          and reduced left ventricular function, while immunodeficient NSG MPS I mice with the same degree
          of urinary glycosaminoglycan elevation do not. The immunocompetent aortas upregulated all eleven
          components of the inflammasome pathway and carried medial macrophage and adventitial T-cell
          infiltrates that the immunodeficient aortas lacked. If that dependency holds in people, glycosaminoglycan
          storage is not by itself sufficient for the cardiac phenotype, and anti-inflammatory adjunctive
          therapy becomes a plausible addition to enzyme restoration. Three things keep this out of the
          causal graph. The study is small, with 12 immunocompetent and 8 immunodeficient mutant male
          mice, and its authors describe it as a preliminary study. Tissue glycosaminoglycan was never
          quantified, only urinary excretion, so equivalent storage in the aortic wall is assumed rather
          than shown. The two strains differ in genetic background as well as in immune competence. No
          human study has tested immune suppression or inflammasome blockade for MPS I cardiovascular
          disease.
        proposed_experiments:
        - experiment_id: mps1_valve_inflammasome_immunoprofiling
          name: Immune profiling of explanted MPS I cardiac valve and aortic tissue
          description: Immunohistochemical and transcriptional profiling of valve and aortic tissue removed
            at surgery from MPS I patients against age-matched non-MPS surgical controls, scoring macrophage
            and T-cell infiltration and inflammasome component expression alongside a quantitative measure
            of tissue glycosaminoglycan storage rather than staining intensity alone.
          would_support:
          - pathophysiology#Progressive skeletal and multisystem organ injury
          - phenotypes#Abnormal heart valve morphology
          supporting_outcome:
          - Macrophage and T-cell infiltration with inflammasome component upregulation in MPS I valve
            and aortic tissue, scaling with lesion severity rather than with storage burden alone.
          refuting_outcome:
          - Storage-laden MPS I valve tissue showing no more immune infiltration or inflammasome expression
            than controls, which would confine the mouse finding to the model.
      selected_evidence:
        snippet: Ascending aortic diameters were significantly greater, left ventricular function significantly
          decreased, and AI significantly more frequent in B6 MPSI mice compared to NSG MPSI mice (p <
          0.0001, p = 0.008 and p = 0.02, respectively); NSG and B6 WT mice showed no changes.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35165009
      reference_title: Contribution of the innate and adaptive immune systems to aortic dilation in murine
        mucopolysaccharidosis type I.
      evidence_source: MODEL_ORGANISM
      explanation: The cardiac phenotype separates immunocompetent from immunodeficient MPS I mice, which
        is the observation that makes translation to human disease the open question recorded here.
