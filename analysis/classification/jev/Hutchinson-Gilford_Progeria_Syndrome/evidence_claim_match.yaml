              label: Hutchinson-Gilford progeria syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: LMNA cryptic splice activation and progerin accumulation
        description: A recurrent de novo LMNA point mutation activates a cryptic splice donor site in
          exon 11, producing progerin, a permanently farnesylated, internally-truncated lamin A. Progerin
          accumulates at the nuclear lamina and adversely affects the integrity of the nuclear scaffold,
          the primary molecular lesion from which the downstream aging hallmarks emanate.
        gene:
          preferred_term: LMNA
          description: Lamin A/C, a core intermediate-filament protein of the nuclear lamina.
          term:
            id: hgnc:6636
            label: LMNA
        role: trigger
      selected_evidence:
        snippet: Hutchinson-Gilford progeria syndrome (HGPS) is an extremely rare, fatal, segmental premature
          aging syndrome caused by a mutation in LMNA that produces the farnesylated aberrant lamin A
          protein, progerin.
        supports: SUPPORT
    origin:
