              label: Hutchinson-Gilford progeria syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant, sporadic de novo
        description: Classic HGPS arises from a heterozygous LMNA c.1824C>T (p.Gly608Gly) substitution
          whose progerin product acts dominant-negatively, so the mode of action is autosomal dominant.
          In practice essentially every case is a new mutation and affected children have unaffected parents,
          which is why the clinical literature describes the syndrome as sporadic and autosomal dominant
          in the same breath.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Hutchinson-Gilford progeria syndrome is a rare, sporadic, autosomal dominant syndrome
          that involves premature aging, generally leading to death at approximately 13 years of age due
          to myocardial infarction or stroke.
        supports: SUPPORT
