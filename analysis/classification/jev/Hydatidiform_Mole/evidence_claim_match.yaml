      assertion:
        name: Familial Biparental Mole
        display_name: Familial Biparental (Recurrent) Hydatidiform Mole
        classification: molecular
        children:
        - HYDM1
        - HYDM2
        description: Familial recurrent hydatidiform mole is a rare autosomal recessive, maternal-effect
          condition in which affected women have recurrent complete moles despite a normal biparental
          (diploid) genome. It is caused by biallelic variants in NLRP7 or KHDC3L, which disrupt establishment
          of maternal genomic imprinting in the oocyte so that the conceptus behaves epigenetically like
          an androgenetic mole.
      selected_evidence:
        snippet: "The risk of recurrence \nis seen to be associated with biallelic maternal mutations\
          \ in NLRP7, KHDC3 L and \nPAD16 genes."
        supports: SUPPORT
