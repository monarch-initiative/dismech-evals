  edc57ef362e19e00c50517e9ddd7ea47877caa6a2334b11d68abfd6aea874f8f:
    claim:
      about:
        disease:
          name: Hydatidiform Mole
          disease_term:
            preferred_term: Hydatidiform Mole
            term:
              id: MONDO:0006248
              label: hydatidiform mole
        context: []
      assertion_type: Genetic
      assertion:
        name: PADI6
        notes: 'PADI6 is a further subcortical maternal complex component, and this is the thinnest of
          the six gene records here. Its established disease is oocyte and early-embryo maturation arrest.
          The mole association rests on a single family whose proband had a clinical history of four molar
          pregnancies: on pathology re-review of the four available products of conception only one met
          morphological criteria for a hydatidiform mole, and it showed patchy rather than complete loss
          of p57 nuclear staining, while the one conception genotyped - a non-molar loss - was diploid
          biparental. Two reviews cited elsewhere in this entry list PADI6 alongside NLRP7 and KHDC3L
          as a cause of recurrent mole, but those sentences cover the set rather than the member, so the
          CAUSATIVE typing here rests on that family plus the demonstration that PADI6 sits in the same
          oocyte complex as NLRP7. No methylation defect has been reported for a PADI6 mole. MONDO records
          no numbered recurrent-mole class for PADI6: `runoak -i ols:mondo search "PADI6"` returns only
          MONDO:1010200 oocyte/zygote/embryo maturation arrest 16.'
        gene_term:
          preferred_term: PADI6
          term:
            id: hgnc:20449
            label: PADI6
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: We found biallelic missense variants that affect conserved amino acids in PADI6 and segregate
          with the disease phenotype in the family.
        supports: SUPPORT
