        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Genomic Imprinting and p57 Silencing
        description: The androgenetic/diandric genome imbalance dysregulates parent-of-origin imprinted
          genes. The maternally expressed, paternally imprinted gene CDKN1C (encoding the cyclin-dependent
          kinase inhibitor p57KIP2) is silenced when the maternal allele is absent (complete mole) or
          epigenetically disrupted (familial biparental mole), removing a brake on trophoblast proliferation.
          Negative p57 immunostaining of villous cytotrophoblast and stroma is the diagnostic hallmark
          of complete mole.
        cell_types:
        - preferred_term: mononuclear cytotrophoblast cell
          term:
            id: CL:0000523
            label: mononuclear cytotrophoblast cell
        biological_processes:
        - preferred_term: genomic imprinting
          modifier: ABNORMAL
          term:
            id: GO:0071514
            label: genomic imprinting
        genes:
        - preferred_term: NLRP7
          term:
            id: hgnc:22947
            label: NLRP7
        - preferred_term: KHDC3L
          term:
            id: hgnc:33699
            label: KHDC3L
        - preferred_term: PADI6
          term:
            id: hgnc:20449
            label: PADI6
      selected_evidence:
        snippet: "Of 564 \nsuccessfully immunostained CHMs, 563 (99.8%) were p57-negative"
        supports: SUPPORT
