          term:
            id: hgnc:22947
            label: NLRP7
        - preferred_term: KHDC3L
          term:
            id: hgnc:33699
            label: KHDC3L
        - preferred_term: PADI6
          term:
            id: hgnc:20449
            label: PADI6
      selected_evidence:
        snippet: The methylation defects observed in five RHM biopsies from NLRP7 defective patients are
