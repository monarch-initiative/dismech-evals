          body, so fertilization of the remaining cytoplast yields an androgenetic conceptus. The route
          is therefore maternal-effect like NLRP7 and KHDC3L but reaches the molar phenotype through a
          different genotype: androgenetic monospermic rather than diploid biparental.'
        gene_term:
