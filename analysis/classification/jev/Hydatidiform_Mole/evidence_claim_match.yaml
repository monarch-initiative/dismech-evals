            label: complete hydatidiform mole
        description: Complete hydatidiform mole is typically diploid and androgenetic, with the entire
          genome paternally derived. There is no identifiable fetal or embryonic tissue, and the chorionic
          villi show diffuse hydropic swelling with circumferential trophoblastic hyperplasia. p57 immunostaining
          is negative in villous cytotrophoblast and stroma because the maternally expressed CDKN1C allele
          is absent. It carries the highest risk of progression to gestational trophoblastic neoplasia.
      selected_evidence:
        snippet: "Of 153 genotyped \nCHMs, 148 (96.7%) were androgenetic"
        supports: SUPPORT
