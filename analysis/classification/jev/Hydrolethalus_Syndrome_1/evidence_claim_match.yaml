          allowing axoneme nucleation and assembly of the NPHP module. Without it, beta-arrestin cannot
          leave the cilium, GPR161 is not removed, and Hedgehog signaling cannot be activated. HYLS1 D211G
          still supports ciliogenesis in these cells but not Hedgehog activation.
        biological_scale: CELLULAR
        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
        biological_processes:
        - preferred_term: smoothened signaling pathway
          modifier: DECREASED
          term:
            id: GO:0007224
            label: smoothened signaling pathway
      selected_evidence:
        snippet: HYLS1 deficiency interrupts the assembly of ciliary NPHP module and agonist-induced ciliary
          exit of β-arrestin, which, in turn, disturbs the removal of ciliary Gpr161 and activation of
          hedgehog (Hh) signaling.
        supports: SUPPORT
