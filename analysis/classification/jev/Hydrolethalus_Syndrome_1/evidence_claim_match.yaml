      assertion_type: Pathophysiology
      assertion:
        name: Embryonic Midline Brain, Craniofacial and Limb Malformation
        description: Ciliary signaling failure during organogenesis is thought to derail patterning of
          the forebrain midline, skull base, face, limbs and lungs, producing the fixed malformation pattern
          of the syndrome. The link from the cellular defects to each malformation is inferred from ciliopathy
          biology and the knock-in mouse; it has not been traced organ by organ in patients. Fetal tissue
          also shows an immature, disorganized cortex with abnormal radial glia, and neuronal progenitors
          from patients cycle faster and undergo less apoptosis.
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        conforms_to: ciliopathy_dysfunction#Cerebellar and CNS Malformation
        cell_types:
