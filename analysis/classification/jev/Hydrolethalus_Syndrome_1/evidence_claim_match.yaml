          term:
            id: CL:0000681
            label: radial glial cell
      selected_evidence:
        snippet: These changes were supported by findings in functional cell biology studies, which revealed
          an increased cell cycle rate and a decreased amount of apoptosis in HLS neuronal progenitor
          cells.
        supports: SUPPORT
