              label: hydrops-lactic acidosis-sideroblastic anemia-multisystemic failure syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic LARS2 Variants
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The index proband carries c.1289C>T, p.Ala430Val in trans with c.1565C>A, p.Thr522Asn.
          The second allele is the same one reported homozygously in Perrault syndrome, which is the single
          most informative fact about this entity: the severe and the mild phenotype share an allele,
          so severity is a property of the allele combination rather than of the variant.

          The two residues sit in different parts of the enzyme. Thr522 is in the catalytic domain where
          the 3-prime end of the tRNA binds, and Ala430 is in the CP1 connective-peptide domain, which
          in cytosolic synthetases is an editing domain. LARS2''s editing domain is present but not functional,
          and the authors tested that directly — no mischarging with isoleucine was detectable for wild-type
          or variant enzyme. So the Ala430Val effect is on aminoacylation rather than on proofreading,
          which is worth recording because the domain''s name invites the opposite inference.'
        genes:
        - preferred_term: LARS2
          term:
            id: hgnc:17095
            label: LARS2
        genetic_context:
          genes:
          - preferred_term: LARS2
            term:
              id: hgnc:17095
              label: LARS2
          allele_type: two missense variants in trans, one of which also occurs in Perrault syndrome
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Compound heterozygosity is the reported configuration in every HLASA family, index
            case and 2020 series alike.
          notes: 'PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION is the measured position: recombinant
            p.Ala430Val retains about a eighteenth of wild-type catalytic efficiency and p.Thr522Asn about
            a ninth, so neither allele is a null. A complete loss of mitochondrial leucyl-tRNA synthetase
            is presumed incompatible with life, and the residual activity is what the genotype-phenotype
            relationship in this gene is built on.'
      selected_evidence:
        snippet: The c.1565C>A (p.Thr522Asn) LARS2 variant has previously been associated with Perrault
          syndrome and both identified variants are predicted to be damaging (SIFT, PolyPhen).
        supports: SUPPORT
        directness: DIRECT
