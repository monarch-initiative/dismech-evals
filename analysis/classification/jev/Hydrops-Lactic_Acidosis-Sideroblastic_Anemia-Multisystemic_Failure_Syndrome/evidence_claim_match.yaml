        context:
        - path: /experimental_models/0
          value:
            name: Recombinant LARS2 aminoacylation assay
            experimental_model_type: OTHER
            description: 'Purified recombinant human LARS2, wild-type and each patient variant, assayed
              for leucylation of an E. coli tRNA-Leu transcript with carbon-14 leucine, with kinetic parameters
              from Lineweaver-Burk plots. Deacylation and misacylation controls were run in the same system.

              This is the only functional model of the disease that exists, and it is a purified-enzyme
              assay rather than a cell or animal model.'
            notes: 'The editing controls matter for interpreting the Ala430Val allele. Ala430 sits in
              the CP1 connective-peptide domain, which in cytosolic synthetases edits mischarged tRNA,
              so a reader might expect an editing defect. The authors tested it: no isoleucine-charged
              tRNA-Leu was detectable with wild-type or variant enzyme, and all three enzymes were inactive
              in deacylation. LARS2''s editing domain is present but not functional, so the allele''s
              effect is on aminoacylation.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced Leucyl-tRNA Aminoacylation
        relationship: MEASURES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: 'Quantifies the catalytic consequence of each allele: 18-fold and 9-fold losses of
          efficiency, driven by k-cat rather than K-m.'
        limitations: The tRNA substrate is bacterial, not human mitochondrial tRNA-Leu, and the authors
          note that their wild-type kinetic values differ from previously published ones for exactly this
          reason — a different tRNA substrate was used. So the fold-changes are internally comparable
          and the absolute constants are not transferable. The assay also tests each variant enzyme alone,
          where the patient is compound heterozygous and carries both.
        divergences:
        - divergence_type: PROXY_QUANTITY
          materiality: QUALIFYING
          description: The measured quantity is leucylation of an E. coli tRNA-Leu transcript. The quantity
            that matters in the patient is leucylation of human mitochondrial tRNA-Leu, which has two
            isoacceptors and a different structure.
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: The mitochondrial matrix, the import machinery that delivers LARS2 there, and the
            mitoribosome that consumes the charged tRNA are all outside the assay. The model reports catalysis
            and nothing about supply.
        readouts:
        - name: Catalytic efficiency of leucylation
          target: Reduced Leucyl-tRNA Aminoacylation
          direction: DECREASED
          interpretation: Both patient alleles retain measurable activity, which is the observation that
            makes this a hypomorphic rather than a null genotype.
      selected_evidence:
        snippet: Kinetic parameters were determined from Lineweaver–Burk plots in the presence of 3–30
          nM WT or variant LARS2 and concentrations of E. coli tRNALeu transcript ranging from 0.3 to
          5.6 μM.
        supports: SUPPORT
        directness: DIRECT
