        therapeutic_modality: OTHER
        description: 'What was given to the index proband: ventilation from birth, sodium bicarbonate
          for the acidosis, fresh-frozen plasma and cryoprecipitate for the coagulopathy, albumin for
          the low albumin, and multiple anticonvulsants for the seizures. None of it altered the lactate,
          which stayed at 13 mmol/L through bicarbonate infusion.

          Two of the three 2020 patients survived the neonatal period on comparable support, so supportive
          care is not futile in this entity even though it is not disease-modifying. What decides the
          outcome is not known.'
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: 'No disease-modifying therapy exists and none has been trialled. The deep-research report
          committed alongside this entry discusses a metabolic rescue combination — glucose, nicotinic
          acid and N-acetylcysteine — from a C. elegans and zebrafish complex I screen. That work is not
          about LARS2, was not done in this disease, and has never been given to a patient with it, so
          it is deliberately not curated here as a treatment. It is recorded in the discussions section
          as what it is: a lead.'
      selected_evidence:
        snippet: The acidosis continued with lactate of 13 mmol/L, despite management with sodium bicarbonate
          infusions
        supports: REFUTE
