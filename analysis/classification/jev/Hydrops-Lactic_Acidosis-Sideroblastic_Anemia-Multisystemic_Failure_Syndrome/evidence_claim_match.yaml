            term:
              id: MONDO:0014869
              label: hydrops-lactic acidosis-sideroblastic anemia-multisystemic failure syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        name: Male Genital Anomalies
        category: Genitourinary
        description: 'All three 2020 HLASA patients were male with genital anomalies. The founding female
          proband had none reported. Undervirilization is separately documented in LARS2-related Perrault
          syndrome — two 46,XY brothers with bilateral undescended testes and, in one, hypospadias with
          chordee — and those authors argue it is an underrecognised component of LARS2 disease rather
          than a coincidence, pointing to ovarian dysgenesis in 46,XX individuals and complete failure
          of germ-cell production in the C. elegans orthologue as evidence that the gene acts in gonadal
          development.

          That makes this the one feature of HLASA with an independent mechanistic argument behind it,
          and the one most likely to be missed, since a neonate in multi-organ failure is not examined
          for undervirilization.'
        frequency: VERY_FREQUENT
        phenotype_term:
          preferred_term: Genital anomalies with undervirilization in 46,XY individuals
          term:
            id: HP:0000078
            label: Abnormality of the genital system
          coarse_binding_basis: VARIABLE_SPECTRUM
        notes: '3 of 3 male HLASA patients in the 2020 series. Bound to the organ-system root deliberately:
          the 2020 abstract says "genital anomalies" without naming them, and the specific anomalies that
          are named — cryptorchidism and hypospadias — come from Perrault-syndrome siblings rather than
          from HLASA patients. Binding HP:0000028 or HP:0000047 here would import a specific anomaly from
          a different phenotype in the same gene.'
      selected_evidence:
        snippet: Three HLASA cases from two unrelated families were identified. All were males with genital
          anomalies.
        supports: SUPPORT
        directness: DIRECT
