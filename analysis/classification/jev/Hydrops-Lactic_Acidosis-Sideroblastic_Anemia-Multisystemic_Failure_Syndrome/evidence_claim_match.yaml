              label: hydrops-lactic acidosis-sideroblastic anemia-multisystemic failure syndrome
        context:
        - path: /pathophysiology/3
          value:
            name: Reduced Respiratory Chain Complex I in Liver and Muscle
            biological_scale: CELLULAR
            mechanism_confidence: ESTABLISHED
            description: 'Complex I protein was about 57 percent of a gestational-age-matched fetal control
              in muscle and about 25 percent of control in liver, with LARS2 itself at about 50 percent
              in liver. Complex I is the complex with the most mtDNA-encoded subunits, which is why a
              general translation restriction shows up there first.

              The enzymology tells a different story from the immunoblot and the difference is the diagnostic
              point of this entry. Measured activities for complexes I and IV were low in muscle and complex
              IV low in liver, but in each case the authors judged them not low enough to be diagnostic
              of a respiratory-chain disorder, and consistent with what premature infants show anyway.
              Citrate synthase was raised in both tissues. A service laboratory reporting that panel would
              not call it a mitochondrial disease.'
            cellular_components:
            - preferred_term: mitochondrial respiratory chain complex I
              term:
                id: GO:0045271
                label: respiratory chain complex I
              modifier: DECREASED
            biological_processes:
            - preferred_term: oxidative phosphorylation
              term:
                id: GO:0006119
                label: oxidative phosphorylation
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Erythroblast Mitochondrial Iron Accumulation
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Ring sideroblasts are the shared endpoint of the congenital sideroblastic anaemias,
          which are caused by defects in heme biosynthesis, iron-sulfur cluster biosynthesis and mitochondrial
          protein synthesis alike. LARS2 sits in the third of those groups, so the edge is drawn by class
          membership. No measurement of erythroblast iron, heme synthesis or iron-sulfur cluster assembly
          exists in any LARS2 patient.
