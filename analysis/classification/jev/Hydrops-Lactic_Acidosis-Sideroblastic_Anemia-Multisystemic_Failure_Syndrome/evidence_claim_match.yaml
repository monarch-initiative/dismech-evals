              from Lineweaver-Burk plots. Deacylation and misacylation controls were run in the same system.

              This is the only functional model of the disease that exists, and it is a purified-enzyme
              assay rather than a cell or animal model.'
            notes: 'The editing controls matter for interpreting the Ala430Val allele. Ala430 sits in
              the CP1 connective-peptide domain, which in cytosolic synthetases edits mischarged tRNA,
              so a reader might expect an editing defect. The authors tested it: no isoleucine-charged
              tRNA-Leu was detectable with wild-type or variant enzyme, and all three enzymes were inactive
              in deacylation. LARS2''s editing domain is present but not functional, so the allele''s
              effect is on aminoacylation.'
          role: ancestor
        - path: /experimental_models/0/modeled_mechanisms/0
          value:
            target: Reduced Leucyl-tRNA Aminoacylation
            relationship: MEASURES
            fidelity: MODERATE
            model_scale: MOLECULAR
            description: 'Quantifies the catalytic consequence of each allele: 18-fold and 9-fold losses
              of efficiency, driven by k-cat rather than K-m.'
            limitations: The tRNA substrate is bacterial, not human mitochondrial tRNA-Leu, and the authors
              note that their wild-type kinetic values differ from previously published ones for exactly
              this reason — a different tRNA substrate was used. So the fold-changes are internally comparable
              and the absolute constants are not transferable. The assay also tests each variant enzyme
              alone, where the patient is compound heterozygous and carries both.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
