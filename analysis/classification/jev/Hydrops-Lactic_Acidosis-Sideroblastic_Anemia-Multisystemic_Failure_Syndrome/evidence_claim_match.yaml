          term:
            id: GO:0006429
            label: leucyl-tRNA aminoacylation
          modifier: DECREASED
      selected_evidence:
        snippet: Analysis of recombinant LARS2 variant proteins showed they had reduced aminoacylation
          efficiency, with HLASA-associated variants having the most severe effect.
        supports: SUPPORT
        directness: DIRECT
