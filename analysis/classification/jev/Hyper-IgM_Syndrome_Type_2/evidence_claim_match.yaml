              label: hyper-IgM syndrome type 2
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: predominantly antibody deficiency
        notes: 'IUIS 2022 phenotypic classification Table 3 (predominantly antibody deficiencies), section
          3 "Severe Reduction in Serum IgG and IgA with Normal/Elevated IgM and Normal Numbers of B cells,
          Hyper IgM". Both the autosomal recessive and the autosomal dominant AICDA rows sit in this section.
          NOTE THE CONTRAST: the CD40LG and CD40 hyper-IgM syndromes are NOT in Table 3 — IUIS 2022 places
          them in Table 1 (combined immunodeficiencies), because the CD40 pathway defect impairs T-cell
          and macrophage activation as well as B-cell class switching. Curating "hyper-IgM syndrome" as
          a single disease would therefore straddle two IUIS tables. The AICDA recessive row in the source
          PDF is corrupted by text extraction — its disease label was lifted onto a later line and its
          OMIM is misprinted as a 7-digit "6055258" (the correct identifier is OMIM:605258, confirmed
          against MONDO:0011528) — so the section heading and the label line are quoted here instead of
          the recessive row itself.'
      selected_evidence:
        snippet: 3. Severe Reduction in Serum IgG and IgA with Normal/Elevated IgM and Normal Numbers
          of B cells, Hyper IgM
        supports: SUPPORT
    origin:
