      assertion_type: Treatment
      assertion:
        name: Hematopoietic Cell Transplantation (rarely indicated)
        description: 'Unlike the CD40L and CD40 hyper-IgM syndromes — where the combined immunodeficiency
          and its opportunistic infections make transplantation a standard consideration — HIGM2 is a
          B-cell-intrinsic antibody deficiency that is generally well controlled by immunoglobulin replacement,
          and transplantation is not a routine indication. This entry records the contrast rather than
          asserting a HIGM2 transplantation indication: in the Latin American registry the transplanted
          patients were CD40L-deficient, and all AID-deficient patients were alive on conventional management.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: Four CD40L-deficient patients underwent successful bone marrow transplantation.
        supports: SUPPORT
