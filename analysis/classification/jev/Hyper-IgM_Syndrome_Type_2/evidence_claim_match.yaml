      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hyper-IgM syndrome type 1 (CD40 ligand deficiency)
        description: 'The X-linked CD40LG defect produces the same serum immunoglobulin pattern, and separating
          the two is the defining diagnostic act in a boy with hyper-IgM. The discriminator is opportunistic
          infection: CD40L deficiency additionally loses T-cell licensing of macrophages and dendritic
          cells, so Pneumocystis, Cryptosporidium, and the fungal and opportunistic infections of the
          registry cohort belong to it, not to AID deficiency, whose defect is B-cell intrinsic. Massive
          lymphoid hyperplasia points the other way.'
        disease_term:
          preferred_term: hyper-IgM syndrome type 1
          term:
            id: MONDO:0010626
            label: hyper-IgM syndrome type 1
        distinguishing_features:
        - Opportunistic and fungal infections, neutropenia, and sclerosing cholangitis occur in CD40L
          deficiency but not in AID deficiency.
        - Germinal-center hyperplasia with marked lymphadenopathy and preserved cell-mediated immunity
          characterize AID deficiency.
        - Inheritance differs — X-linked for CD40L deficiency, autosomal recessive for AID deficiency.
      selected_evidence:
        snippet: Previously undescribed fungal and opportunistic infections were observed in CD40L-deficient
          patients but not in the two patients with AID deficiency.
        supports: SUPPORT
    origin:
