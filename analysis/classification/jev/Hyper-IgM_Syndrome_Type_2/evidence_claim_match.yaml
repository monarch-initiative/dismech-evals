              The C-terminus is dispensable for the deaminase activity that drives somatic hypermutation
              but required for the DNA-repair steps specific to class-switch recombination, so these patients
              have a CSR-only defect with preserved SHM. Switch-region double-strand breaks are still
              generated, placing the block downstream of the breaks rather than at their creation. This
              is curated as a distinct genetic context of the same disease rather than a separate entry.
