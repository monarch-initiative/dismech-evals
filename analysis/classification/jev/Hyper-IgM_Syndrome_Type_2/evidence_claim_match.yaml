        context: []
      assertion_type: Pathophysiology
      assertion:
        name: AID Enzymatic Loss of Function
        conforms_to: germinal_center_reaction#Germinal Center Reaction
        biological_scale: MOLECULAR
        description: 'Activation-induced cytidine deaminase is a member of the cytidine deaminase family
          whose expression is restricted to germinal center B cells. It initiates antibody diversification
          by deaminating cytosine to uracil in single-stranded DNA at the immunoglobulin switch and variable
          regions, creating the U:G mismatches that downstream repair pathways convert into either switch-region
          double-strand breaks or point mutations. Biallelic loss-of-function AICDA variants abolish this
          enzymatic activity, removing the single upstream trigger for both antibody-diversification programs.
          Anchors the module''s conformance here rather than on either downstream node (Failed Immunoglobulin
          Class-Switch Recombination, Failed Somatic Hypermutation) because this is the molecular lesion
          that causes both of them: neither downstream node alone covers the module''s bundled "Germinal
          Center Reaction" claim, but this one node, read alongside its two direct downstream edges, does.'
        cell_types:
        - preferred_term: Germinal center B cell
          term:
            id: CL:0000844
            label: germinal center B cell
        molecular_functions:
        - preferred_term: cytidine deaminase activity
          term:
            id: GO:0004126
            label: cytidine deaminase activity
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: Somatic Hypermutation of Immunoglobulin Genes
          term:
            id: GO:0016446
            label: somatic hypermutation of immunoglobulin genes
          modifier: ABSENT
        - preferred_term: Class Switch Recombination
          term:
            id: GO:0045190
            label: isotype switching
          modifier: ABSENT
      selected_evidence:
        snippet: The activation-induced cytidine deaminase (AID) gene, specifically expressed in germinal
          center B cells in mice, is a member of the cytidine deaminase family.
        supports: SUPPORT
