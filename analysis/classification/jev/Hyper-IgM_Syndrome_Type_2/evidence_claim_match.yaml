      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No population-based prevalence estimate for HIGM2 has been published. The disease is known
          from small international case series: the largest dedicated cohort assembled 29 patients from
          22 families across multiple European and Middle Eastern referral centres. Registry data give
          a sense of its rarity relative to the CD40L form — in the Latin American HIGM registry only
          2 of 37 molecularly defined hyper-IgM patients had AID deficiency, against 35 with CD40L deficiency.
          Both figures are referral-based counts, not denominators, so no rate per 100,000 is asserted
          here.'
      selected_evidence:
        snippet: We retrospectively analyzed clinical, immunologic and genetic characteristics of 29 patients
          from 22 families with AID deficiency.
        supports: SUPPORT
