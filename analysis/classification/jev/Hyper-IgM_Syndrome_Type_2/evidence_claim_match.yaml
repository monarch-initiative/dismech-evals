  fa6f0d17b5a93826104894c00018bc1b083f8119a88c35425c437254942d3a01:
    claim:
      about:
        disease:
          name: Hyper-IgM Syndrome Type 2
          disease_term:
            preferred_term: Hyper-IgM Syndrome Type 2
            term:
              id: MONDO:0011528
              label: hyper-IgM syndrome type 2
        context: []
      assertion_type: Genetic
      assertion:
        name: AICDA C-terminal heterozygous variants (autosomal dominant HIGM2)
        notes: Heterozygous nonsense variants affecting the C-terminal region of AID — classically R190X,
          which disrupts the nuclear export signal — cause a dominantly inherited form of HIGM2. The C-terminus
          is dispensable for the deaminase activity that drives somatic hypermutation but required for
          the DNA-repair steps specific to class-switch recombination, so these patients have a CSR-only
          defect with preserved SHM. Switch-region double-strand breaks are still generated, placing the
          block downstream of the breaks rather than at their creation. This is curated as a distinct
          genetic context of the same disease rather than a separate entry.
        gene_term:
          preferred_term: AICDA
          term:
            id: hgnc:13203
            label: AICDA
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: AICDA R190X
          type: nonsense
          description: Heterozygous C-terminal nonsense variant removing the AID nuclear export signal.
            Causes a class-switch-recombination defect with preserved somatic hypermutation, inherited
            as an autosomal dominant trait.
          gene:
            preferred_term: AICDA
            term:
              id: hgnc:13203
              label: AICDA
      selected_evidence:
        snippet: We herein report the immunological phenotype of seven patients carrying a single heterozygous
          R190X mutation in AICDA.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/1
      evidence_path: /genetic/1/evidence/0
