  9df15497625dfe077793f35b08ba9dd46d54f361cbfa43b2ae6d1827b4e0618b:
    claim:
      about:
        disease:
          name: Hyper-IgM Syndrome Type 2
          disease_term:
            preferred_term: Hyper-IgM Syndrome Type 2
            term:
              id: MONDO:0011528
              label: hyper-IgM syndrome type 2
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: A rarer autosomal dominant form (AD-HIGM2) is caused by heterozygous variants affecting
          the C-terminal region of AID, classically the R190X nonsense variant. The C-terminus is required
          for the DNA-repair steps specific to class-switch recombination but not for somatic hypermutation,
          so these patients have a variable CSR defect with preserved SHM. IUIS 2022 Table 3 lists this
          dominant AICDA form as its own row (OMIM 605257) alongside the recessive row, and records that
          the causal variants localise uniquely to the nuclear export signal; those row fragments are
          too short and too corrupted by PDF text extraction to quote as standalone evidence, so the published
          patient series are cited instead.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Variable defect in in vivo CSR inherited as an autosomal dominant (AD) trait strongly
          suggests that this heterozygous AICDA mutation causes HIGM (AD-HIGM2).
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/0
