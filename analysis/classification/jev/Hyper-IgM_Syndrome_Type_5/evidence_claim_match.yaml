  5cc50e64a14ae01399c477aace4aa36053a4f6085ccca89dd7201e85c38ed7a3:
    claim:
      about:
        disease:
          name: Hyper-IgM Syndrome Type 5
          disease_term:
            preferred_term: hyper-IgM syndrome type 5
            term:
              id: MONDO:0011971
              label: hyper-IgM syndrome type 5
        context: []
      assertion_type: Genetic
      assertion:
        name: UNG
        notes: UNG (12q24.11) encodes uracil-DNA glycosylase, produced as a mitochondrial isoform (UNG1)
          and a nuclear isoform (UNG2); UNG2 is the species required in activated B cells. Biallelic loss-of-function
          variants cause HIGM5. Reported alleles include truncating frameshift and nonsense variants yielding
          catalytically dead or absent protein, and the F251S missense allele, whose protein is enzymatically
          competent in bacteria but mistargeted to mitochondria and degraded in mammalian B cells, leaving
          only trace nuclear activity. No dominant-negative or gain-of-function mechanism is established.
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: UNG
