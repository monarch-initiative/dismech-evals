      assertion:
        name: Hyper-IgM syndrome type 2 (AID deficiency)
        description: AID (AICDA) deficiency is the closest phenocopy — the same B-cell-intrinsic CSR block,
          the same lymphoid hyperplasia, and the same bacterial susceptibility — because UNG acts immediately
          downstream of AID in the same pathway. Somatic hypermutation is generally more severely reduced
          or absent in AID deficiency, whereas UNG deficiency distorts the SHM spectrum rather than abolishing
          it. The two are separated by the causal gene.
        disease_term:
          preferred_term: hyper-IgM syndrome type 2
          term:
            id: MONDO:0011528
            label: hyper-IgM syndrome type 2
        distinguishing_features:
        - Biallelic AICDA versus biallelic UNG variants.
        - SHM typically absent/severely reduced in AID deficiency, distorted (spectrum shift) in UNG deficiency.
      selected_evidence:
        snippet: the observation that uracil-DNA-glycosylase deficiency leads to a severe hyper-IgM syndrome
          strongly argues in favor of a DNA-editing activity of AID
        supports: SUPPORT
    origin:
