        context: []
      assertion_type: Pathophysiology
      assertion:
        name: UNG Loss of Function
        biological_scale: MOLECULAR
        description: 'Uracil-DNA glycosylase is encoded by UNG, which produces a mitochondrial isoform
          (UNG1) and a nuclear isoform (UNG2); UNG2 is induced in activated germinal-center B cells. It
          hydrolyses the N-glycosidic bond of uracil in DNA, initiating base-excision repair by creating
          an abasic (AP) site. Biallelic UNG variants abolish or severely reduce this nuclear activity:
          truncating alleles yield catalytically dead protein, and the F251S missense allele produces
          an enzyme that is active in vitro but mistargeted to mitochondria and degraded in B cells, leaving
          only trace residual activity. This molecular lesion is the single upstream cause of the downstream
          class-switch and hypermutation defects.'
        cell_types:
        - preferred_term: Germinal center B cell
          term:
            id: CL:0000844
            label: germinal center B cell
        genes:
        - preferred_term: UNG
          term:
            id: hgnc:12572
            label: UNG
        molecular_functions:
        - preferred_term: uracil DNA N-glycosylase activity
          term:
            id: GO:0004844
            label: uracil DNA N-glycosylase activity
          modifier: DECREASED
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: the UNG mutations lead to increased accumulation of genomic uracil
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15967827
      reference_title: B cells from hyper-IgM patients carrying UNG mutations lack ability to remove uracil
        from ssDNA and have elevated genomic uracil.
      evidence_source: IN_VITRO
      explanation: Biochemical study of patient B-cell lines (shared with the discovery series) confirms
        functional loss of UNG with accumulation of genomic uracil.
