      assertion_type: Pathophysiology
      assertion:
        name: Failure of Switch-Region Uracil Excision
        biological_scale: MOLECULAR
        description: AID converts cytosine to uracil in single-stranded DNA at transcribed switch and
          variable regions. Without UNG, that uracil is not efficiently removed. The AID-directed step
          depends specifically on UNG being recruited to RPA-coated single-stranded DNA, a function separable
          from canonical repair of uracil in double-stranded genomic DNA. The unexcised U:G lesions propagate
          into the two downstream antibody-diversification failures.
        biological_processes:
        - preferred_term: base-excision repair, AP site formation via deaminated base removal
          term:
            id: GO:0097510
            label: base-excision repair, AP site formation via deaminated base removal
          modifier: DECREASED
      selected_evidence:
        snippet: We show that the UNG:RPA interaction plays a crucial role in both CSR and repair of AID-induced
          uracil at the Ig loci.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38000394
