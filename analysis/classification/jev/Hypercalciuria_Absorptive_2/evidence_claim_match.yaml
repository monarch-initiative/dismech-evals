        relationship_type: RISK_FACTOR
        notes: ADCY10 encodes soluble adenylyl cyclase (sAC), a bicarbonate- and calcium-regulated cyclase.
          The locus for an inherited form of absorptive hypercalciuria was mapped to chromosome 1q23.3-q24,
          and base substitutions in this soluble adenylate cyclase gene were associated with the phenotype
          and with low spinal bone density. Across 61 reported absorptive hypercalciuria patients, 16
          ADCY10 variants have been described - seven missense, five splicing, two frameshift and two
          nonsense - and all but two cases (a homozygous c.1205_1206del) carry heterozygous variants,
          consistent with the dominant inheritance.
      selected_evidence:
        snippet: This is the first description of a specific gene defect associated with AH.
        supports: SUPPORT
