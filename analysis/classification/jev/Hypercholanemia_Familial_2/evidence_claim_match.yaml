      assertion_type: Prevalence
      assertion:
        population: Paediatric patients diagnosed in a single Chinese case-control study
        measure_type: CASES_IN_LITERATURE
        prevalence_class: RARE
        notes: 113 paediatric patients were diagnosed in one case-control study, which is by a wide margin
          the largest series and is the reason this disorder is better characterised than its rarity would
          suggest. No population prevalence has been published in any located source. The p.S267F allele
          is common in some East Asian populations, so the geographic distribution of reported patients
          reflects allele frequency and screening practice as much as anything else.
      selected_evidence:
        snippet: A total of 113 paediatric NTCPD patients were diagnosed while c.374dupG and c.682_683delCT
          were detected as two novel pathogenic mutations.
        supports: SUPPORT
