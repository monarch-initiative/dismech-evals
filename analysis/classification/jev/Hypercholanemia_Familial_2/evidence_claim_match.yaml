      assertion:
        discussion_id: ntcp_hbv_resistance
        kind: KNOWLEDGE_GAP
        prompt: Do NTCP-deficient individuals resist hepatitis B and hepatitis D infection?
        attaches_to:
        - genetic#SLC10A1
        rationale: NTCP is the hepatocyte entry receptor for HBV and HDV, and the dismech Hepatitis_D
          entry already carries SLC10A1 in that role. A person with no functional NTCP is the natural
          experiment for whether receptor loss confers resistance, and the answer would bear directly
          on entry-inhibitor therapy. No source located for this entry reports HBV or HDV status in a
          genetically confirmed NTCP-deficient cohort. The question is recorded rather than answered because
          the inference is obvious and the evidence is absent, which is exactly the combination that invites
          an entry to overstate.
      selected_evidence:
        snippet: Bulevirtide (BLV) is an entry inhibitor blocking entry of HBsAg into hepatocytes by interfering
          with the bile acid transporter Na+-taurocholate co-transporting polypeptide.
        supports: SUPPORT
