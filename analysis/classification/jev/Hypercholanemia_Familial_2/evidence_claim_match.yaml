      assertion_type: Pathophysiology
      assertion:
        name: Residual Enterohepatic Cycling via Auxiliary Transporters
        biological_scale: ORGANISM
        description: Secondary bile salts require intestinal bacterial modification and then return to
          the liver, so their presence in the circulation of an NTCP-deficient patient demonstrates that
          the enterohepatic cycle is still turning. Sodium-independent uptake by the organic anion transporting
          polypeptides is the presumed route. This node is why the disease has a laboratory signature
          out of all proportion to its clinical consequences, and it is the compensation that has to be
          invoked to explain the absence of cholestatic liver injury.
        genes:
        - preferred_term: SLCO1B1
          term:
            id: hgnc:10959
            label: SLCO1B1
        - preferred_term: SLCO1B3
          term:
            id: hgnc:10961
            label: SLCO1B3
      selected_evidence:
        snippet: The identification of NTCP deficiency confirms that this transporter is the main import
          system for conjugated bile salts into the liver but also indicates that auxiliary transporters
          are able to sustain the enterohepatic cycle in its absence.
        supports: SUPPORT
