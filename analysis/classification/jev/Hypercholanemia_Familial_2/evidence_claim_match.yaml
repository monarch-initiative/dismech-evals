  4e6d2451d4e4dfa7c1c3e15a9629e8a75e2e1d89ba750adeb5adf82f251ff29d:
    claim:
      about:
        disease:
          name: Hypercholanemia Familial 2
          disease_term:
            preferred_term: hypercholanemia, familial, 2
            term:
              id: MONDO:0031003
              label: hypercholanemia, familial, 2
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC10A1
        gene_term:
          preferred_term: SLC10A1
          term:
            id: hgnc:10905
            label: SLC10A1
        relationship_type: CAUSATIVE
        notes: 'Solute carrier family 10 member 1, encoding NTCP, expressed in the basolateral membrane
          of the hepatocyte. Biallelic variants cause this disorder.

          NTCP has a second identity that matters here: it is the cell-entry receptor for hepatitis B
          and hepatitis D virus, and the dismech Hepatitis_D entry already carries SLC10A1 in that role.
          The same loss of function that produces the hypercholanemia would be expected to affect susceptibility
          to viral entry, but no source located for this entry tests that in NTCP-deficient patients,
          so it is recorded as a knowledge gap rather than asserted.'
        variants:
        - name: c.800C>T (p.S267F)
          description: The prevalent variant, common enough in some East Asian populations to be screened
            for directly; homozygous in most reported patients including the ten-adult follow-up cohort.
            A characterised loss-of-function allele.
        - name: c.755G>A (p.R252H)
          description: Homozygous in the first reported patient. Functional studies showed markedly reduced
            taurocholic acid uptake, and the mutant protein was virtually absent from the plasma membrane.
        - name: c.263T>C (p.I88T)
          description: Novel at the time of report, found in trans with p.S267F in a neonate, with an
            allele frequency of 0.67% (1/150) in healthy controls.
        - name: c.374dupG and c.682_683delCT
          description: Two further pathogenic variants detected in the 113-patient paediatric series.
      selected_evidence:
        snippet: Sodium taurocholate cotransporting polypeptide (NTCP) is encoded by the gene SLC10A1
          and expressed in the basolateral membrane of the hepatocyte, functioning to uptake bile acids
          from plasma.
        supports: SUPPORT
