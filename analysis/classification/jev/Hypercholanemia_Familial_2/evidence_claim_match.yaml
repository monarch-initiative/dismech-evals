      assertion_type: Diagnosis
      assertion:
        name: SLC10A1 genotyping
        description: Molecular confirmation, and the only test that makes the diagnosis. In the largest
          series one variant, c.800C>T (p.Ser267Phe), carried 94.5% of mutated alleles, so a targeted
          assay for it resolves most cases in the population that series drew on; Sanger sequencing of
          the rest of the gene is reserved for the patients in whom it accounts for one allele or neither.
          A screen-then-sequence order is therefore a statement about allele frequency in a particular
          population, not a general protocol.
      selected_evidence:
        snippet: In cases with single or no mutated SLC10A1 allele detected, Sanger sequencing was performed
          to explore the hidden causative variant.
        supports: SUPPORT
