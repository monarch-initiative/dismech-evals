    evidence_metadata:
      reference: PMID:36924318
      reference_title: Bile acid increase during bulevirtide treatment of hepatitis D is not associated
        with a decline in HDV RNA.
      evidence_source: HUMAN_CLINICAL
      explanation: Refutes the coupling the question assumes rather than the question itself. In 20 treated
        patients the rise in bile salts, the readout of blocked bile acid transport, did not track the
        fall in HDV RNA, so the authors conclude the transport-blocking and entry-blocking effects on
        NTCP are separable. Losing bile acid uptake therefore does not license the inference that viral
        entry is lost with it, which is why this entry records the resistance question as open instead
        of answering it from the receptor's identity.
