      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Biallelic SLC10A1 variants are required. The first patient was homozygous for p.R252H;
          the prevalent East Asian allele is p.S267F, found homozygous in most reported patients and in
          compound heterozygosity with others. Because p.S267F is common enough in some populations to
          be screened for directly, ascertainment in the large paediatric series is genotype-led, which
          matters when reading its phenotype frequencies.
      selected_evidence:
        snippet: Sequencing of the SLC10A1 gene revealed a single homozygous nonsynonymous point mutation
          in the coding sequence of the gene, resulting in an arginine to histidine substitution at position
          252.
        supports: SUPPORT
