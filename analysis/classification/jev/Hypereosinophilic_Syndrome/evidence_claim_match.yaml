          thromboinflammatory branch is clinically important because thrombosis is a frequent complication
          and can dominate long-term morbidity.
        cell_types:
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        biological_processes:
        - preferred_term: blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
      selected_evidence:
        snippet: The proteolytic actions induced by eosinophil granules may activate the kallikrein system
          and so the clotting cascade by factor XII activation; the factor XII activation, increasing
          the activation of other proteases of clotting system, induces hypercoagulable state.
        supports: SUPPORT
