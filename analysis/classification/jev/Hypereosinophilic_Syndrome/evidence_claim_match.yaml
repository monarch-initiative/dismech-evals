  018d8c13c89fc6ec71e2a4449eceaa23c611927d7417c9497abb1df549e5f5b3:
    claim:
      about:
        disease:
          name: Hypereosinophilic syndrome
          disease_term:
            preferred_term: hypereosinophilic syndrome
            term:
              id: MONDO:0015691
              label: hypereosinophilic syndrome
        context: []
      assertion_type: Biochemical
      assertion:
        name: Absolute eosinophil count
        presence: INCREASED
        context: The measurement the syndrome is defined by. A blood eosinophil count at or above 1,500
          cells/uL, persisting and unexplained by a secondary cause, is what separates this syndrome from
          the far commoner reactive eosinophilias, and the same count is what treatment is titrated against.
        notes: The cited sources state these boundaries as 0.05, 0.5 and 1.5 x 10^9/L. This record converts
          them to cells/uL, multiplying by 1,000, so the values sit on the same scale as the other blood
          eosinophil records in this knowledge base; each snippet keeps its source's own form. The Idiopathic_Hypereosinophilic_Syndrome
          entry carries the same measurement for the idiopathic subtype, where the count must also survive
          an exclusion workup before the label applies.
        biomarker_term:
          preferred_term: absolute blood eosinophil count
          term:
            id: NCIT:C188680
            label: Absolute Eosinophil Count
        readouts:
        - target: Persistent eosinophil expansion in blood and tissues
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: The blood count is the accessible half of this node. It measures the circulating
            compartment; the tissue burden the node also names is not visible to it, so a count inside
            the reference interval does not exclude tissue hypereosinophilia.
        reference_ranges:
        - loinc_term:
            id: LOINC:26449-9
            label: Eosinophils [#/volume] in Blood
          lower_bound: 50
          upper_bound: 500
          unit: cells/uL
          population: adults
          notes: 'A genuine laboratory reference interval, and worth distinguishing from the therapy-stratification
            bands on the Asthma blood eosinophil record, which asserts no interval at all: here a source
            states the normal range directly. The bands below are the diagnostic tiers of the eosinophilic-disorder
            classification, not severity grades. Because the sources define eosinophilia as at or above
            0.5 x 10^9/L, a result of exactly 500 cells/uL falls in the eosinophilia band rather than
            inside this interval.'
          interpretation_bands:
          - name: Below 500 cells/uL
            upper_bound: 500
            unit: cells/uL
            abnormal_flag: NORMAL
            interpretation: 'At or below the reference interval''s upper limit. Results below the interval''s
              50 cells/uL floor fall here too, and are deliberately not graded LOW: no cited source addresses
              eosinopenia, and in treated disease a near-zero count is the therapeutic goal rather than
              an abnormality. On treatment this band is also the target: hematologic remission is defined
              as a count below 0.5 x 10^9/L, so a result here in a treated patient reports response rather
              than absence of disease.'
          - name: 500 to 1499 cells/uL
            lower_bound: 500
            upper_bound: 1500
            unit: cells/uL
            abnormal_flag: HIGH
            phenotype_term:
              preferred_term: Increased total eosinophil count
              term:
                id: HP:0001880
                label: Increased total eosinophil count
            interpretation: Eosinophilia by the ICOG-EO classification, but below the hypereosinophilia
              threshold this syndrome is defined by. A count in this band is common and mostly reactive;
              on its own it does not support the diagnosis.
          - name: 1500 cells/uL or greater
            lower_bound: 1500
            unit: cells/uL
            abnormal_flag: HIGH
            phenotype_term:
              preferred_term: Severely increased total eosinophil count
              term:
                id: HP:0032061
                label: Severely increased total eosinophil count
            interpretation: 'Hypereosinophilia. This is the diagnostic threshold, not a severity grade:
              a single count here is not sufficient, since the definition requires persistence and the
              exclusion of a secondary cause before the syndrome is diagnosed.'
      selected_evidence:
        snippet: According to the classification of eosinophilic disorders proposed in 2011 by the International
          Cooperative Working Group on Eosinophil Disorders (ICOG-EO) and revised in 2022, blood eosinophilia
          is defined by an AEC above 0.5 × 109/L, while hypereosinophilia (HE) necessitates an AEC of
          ≥1.5 × 109/L [1,6].
        supports: SUPPORT
