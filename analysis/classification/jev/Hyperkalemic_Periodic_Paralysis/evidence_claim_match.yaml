            species: Horse
            genotype: Naturally occurring heterozygous SCN4A DIIIS3 phenylalanine-to-leucine substitution,
              traceable to a single founder sire
            publication: PMID:25880512
            description: A naturally occurring equine disease in American quarter horses caused by a single
              SCN4A founder mutation. It is the one HyperPP model with spontaneous attacks in an outbred
              whole organism, and it is informative precisely because the phenotype is variable on a near-uniform
              genetic background.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Sustained Sarcolemmal Depolarization
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: Intercostal muscle fibres from affected horses are depolarized at rest and repolarize
          to normal values on exposure to tetrodotoxin, which localizes the depolarizing current to sodium
          channels.
        limitations: The equine mutation is not one of the human HyperPP alleles, and the measurements
          are made on excised intercostal fibres rather than in vivo.
        readouts:
        - name: Resting membrane depolarization of intercostal muscle fibres
          target: Sustained Sarcolemmal Depolarization
          direction: INCREASED
          interpretation: Affected fibres rest at a less negative potential than normal, so the depolarization
            is increased while the membrane potential itself falls in absolute terms; the readout is named
            for the depolarization so that the direction is unambiguous. Tetrodotoxin reverses it, which
            is what makes this the direct readout of a sodium-dependent depolarization.
      selected_evidence:
        snippet: Hyperkalemic periodic paralysis (HyperKPP) is a rare hereditary disease seen in human
          subjects and horses.
        supports: SUPPORT
