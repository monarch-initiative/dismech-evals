          exploits the mechanism.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: mild voluntary exercise at attack onset
          term:
            id: NCIT:C62739
            label: Exercise Intervention
        target_phenotypes:
        - preferred_term: Episodic flaccid weakness
          term:
            id: HP:0003752
            label: Episodic flaccid weakness
        notes: Bound to Exercise Intervention, which NCIT defines as "A program of managed physical activity
          to improve an individual's health and wellbeing" and which is reachable from NCIT:C25218 through
          NCIT:C63474 Behavioral, Psychological or Informational Intervention. NCIT:C15302 Physical Therapy,
          bound here earlier, names a professionally delivered rehabilitation service, which self-directed
          abortive exercise is not. `runoak -i ols:ncit search "l~exercise"` returns NCIT:C16567 Exercise
          and NCIT:C39777 Very Light Exercise, whose only is_a ancestors are NCIT:C17708 Physical Activity
          and NCIT:C43431 Activity, so neither reaches the TreatmentTerm root NCIT:C25218 and neither
          is admissible in this slot. The query cited here earlier, `"l~exercise test"`, returns cardiac
          and cardiopulmonary stress tests and was the wrong search for an intervention term.
      selected_evidence:
        snippet: At the onset of weakness, attacks may be prevented or aborted with mild exercise and/or
          oral ingestion of carbohydrates, intravenously injected glucocorticoids, inhalation of salbutamol,
          or intravenous calcium gluconate.
        supports: SUPPORT
