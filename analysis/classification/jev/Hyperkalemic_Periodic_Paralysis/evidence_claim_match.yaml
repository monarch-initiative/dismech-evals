          disease_term:
            preferred_term: hyperkalemic periodic paralysis
            term:
              id: MONDO:0008224
              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Scn4a M1592V knock-in mouse
        species: Mouse
        genotype: Scn4a M1592V heterozygous knock-in
        background: FVB.129S4(B6)-Scn4atm1.1Ljh/J
        publication: PMID:21708955
        genes:
        - preferred_term: SCN4A
          term:
            id: hgnc:10591
            label: SCN4A
        description: A knock-in mouse carrying the substitution corresponding to human M1592V, one of
          the two commonest HyperPP alleles. It reproduces the resting depolarization, the sodium overload,
          the myotonia, and the potassium sensitivity, but not spontaneous paralytic attacks.
        modeled_mechanisms:
        - target: Resting Intracellular Sodium Overload
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Resting mutant muscle shows greatly increased tetrodotoxin-suppressible sodium
            influx, a raised intracellular sodium concentration, and a resting membrane potential depolarized
            by 16 mV that tetrodotoxin repolarizes.
          limitations: Measurements are made in isolated soleus and extensor digitorum longus at 30 degrees
            Celsius, so absolute influx rates are not directly transferable to intact human muscle.
          readouts:
          - name: Na+,K+-pump-mediated 86Rb uptake in resting soleus
            target: Resting Intracellular Sodium Overload
            direction: INCREASED
            interpretation: Raised pump-mediated potassium uptake is the compensatory response to the
              resting sodium load and is the quantitative signature of that load.
        - target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Mutant muscle is markedly less excitable than wild type, requiring stronger and
            longer stimuli to reach maximal force, and loses force dramatically when challenged with 10
            mM extracellular potassium.
          limitations: The mouse does not have spontaneous attacks of weakness; the loss of force has
            to be provoked by an in vitro potassium challenge, so the model reproduces the susceptibility
            rather than the episodic disease.
          readouts:
          - name: Tetanic force during 10 mM potassium challenge
            target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
            direction: DECREASED
            interpretation: Accelerated loss of tetanic force under a potassium challenge is the functional
              readout of potassium-provoked inexcitability.
          - name: Tetanic force after salbutamol
            target: Depolarization-Induced Sodium Channel Inactivation and Fibre Inexcitability
            direction: RESTORED
            interpretation: Restoration of force by a beta-agonist links the model's inexcitability to
              the therapy used in patients.
        notes: Acetazolamide protects the mutant muscle against potassium-induced loss of force in this
          model, which is the closest thing to a mechanistic rationale for carbonic anhydrase inhibition
          in HyperPP.
      selected_evidence:
        snippet: Spontaneous attacks of weakness have not been observed, but in vitro challenge with 10
          mM K+ triggered a severe reduction of muscle force.
        supports: SUPPORT
