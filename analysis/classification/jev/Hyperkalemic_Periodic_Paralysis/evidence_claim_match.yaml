        context: []
      assertion_type: Environmental
      assertion:
        name: Rest after strenuous exercise
        description: Weakness characteristically appears within minutes of stopping vigorous exercise,
          while the working muscle is spared. Mild activity at the onset of an attack is protective, which
          is why the exposure is the rest and not the exercise.
        exposure_term:
          preferred_term: exposure to strenuous exercise
          term:
            id: ECTO:6000031
            label: exposure to strenuous exercise
        notes: The mechanism link below points at the potassium node rather than directly at Sustained
          Sarcolemmal Depolarization. Both are defensible, and the potassium node is kept because it is
          the compartment the exposure acts on, the one the cited transverse-tubular physiology is about,
          and because its own downstream edge already reaches the depolarization node, so the chain is
          not shortened by the choice. Retargeting would assert that stopping exercise depolarizes the
          fibre without passing through potassium, which no cited source states.
      selected_evidence:
        snippet: 'other triggers include: cold environment; rest after exercise, stress, or fatigue; alcohol;
          hunger; and changes in activity level.'
        supports: SUPPORT
