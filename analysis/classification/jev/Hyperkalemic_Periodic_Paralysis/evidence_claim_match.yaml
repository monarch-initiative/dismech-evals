          disease_term:
            preferred_term: hyperkalemic periodic paralysis
            term:
              id: MONDO:0008224
              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Long Exercise Compound Muscle Action Potential Test
        description: 'A focal attack is provoked by five minutes of repeated isometric contraction and
          the compound muscle action potential is followed for up to an hour. A decrement of 40% or more
          is abnormal. The pattern discriminates: an early increase followed by a late decrease is characteristic
          of HyperPP.'
        diagnosis_term:
          preferred_term: long exercise compound muscle action potential test
        results: A CMAP amplitude decrement of at least 40% supports susceptibility to periodic paralysis;
          an early increase followed by a late decrease favours HyperPP.
        notes: 'No NCIT clinical-action term is bound because none exists for this test. Searching the
          configured OLS adapter with `runoak -i ols:ncit search "l~compound muscle action potential"`
          and `runoak -i ols:ncit search "l~muscle action potential"` returns nothing, and `runoak -i
          ols:ncit search "l~exercise test"` returns only cardiac and cardiopulmonary stress-testing terms.
          NCIT:C88502 Nerve Conduction Velocity Test was rejected on positive grounds: this test measures
          CMAP amplitude decrement after exercise, not conduction velocity.'
      selected_evidence:
        snippet: A reduction in CMAP amplitude of 40% or more from the maximal during exercise or post
          exercise is considered abnormal and is typically seen in >70% of patients.
        supports: SUPPORT
