          name: Hyperkalemic Periodic Paralysis
          disease_term:
            preferred_term: hyperkalemic periodic paralysis
            term:
              id: MONDO:0008224
              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Potassium Efflux and Extracellular Potassium Accumulation
        biological_scale: TISSUE
        description: 'Potassium leaves the depolarized and repetitively firing fibre and accumulates both
          locally in the transverse tubules and systemically as a rise in serum potassium during the attack.
          This node closes a feed-forward loop: the potassium it raises is the very stimulus that reveals
          the inactivation defect and deepens the depolarization that produced it. It is also the reason
          an exogenous potassium load can start the cycle from outside.'
        cell_types:
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: INCREASED
        notes: 'Tagged TISSUE rather than ORGANISM because the mechanistically operative compartment is
          the interstitial and transverse-tubular space of muscle tissue, which is also what the node''s
          cell type and its cited evidence are about. The systemic arm is not lost by that choice: it
          is represented separately by the Hyperkalemia During Attacks laboratory phenotype, which this
          node''s own downstream edge points at, and which carries the ictal serum measurement. The node
          is therefore left whole rather than split, since splitting would duplicate that phenotype and
          rewire five incoming or outgoing edges plus two treatment target_mechanisms for no gain in what
          is asserted.'
      selected_evidence:
        snippet: an increase of serum potassium concentration of at least 1.5 mmol/L during an attack
          of weakness
        supports: SUPPORT
