              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Resting Intracellular Sodium Overload
        biological_scale: CELLULAR
        description: The persistent inward current loads the resting fibre with sodium even between attacks,
          which increases the demand on the Na+,K+-ATPase and is detectable by sodium magnetic resonance
          spectroscopy in patients. It is the plausible link between a purely electrical defect and the
          structural myopathy that develops over decades.
        cell_types:
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: sodium ion transmembrane transport
          term:
            id: GO:0035725
            label: sodium ion transmembrane transport
          modifier: INCREASED
        notes: The step from resting sodium overload to the chronic myopathy is the weakest link in this
          chain. It is recorded as INDIRECT_UNKNOWN_INTERMEDIATES because no cited source traces the intervening
          steps, and the fact that permanent weakness can develop in patients without frequent attacks
          argues against simple cumulative injury from attacks alone.
      selected_evidence:
        snippet: The results confirm that the functional disorders of skeletal muscles in HyperKPP are
          secondary to increased Na(+) influx and show that contractility can be restored by acute stimulation
          of the Na(+),K(+) pumps.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21708955
      reference_title: Na+,K+-pump stimulation improves contractility in isolated muscles of mice with
        hyperkalemic periodic paralysis.
      evidence_source: MODEL_ORGANISM
      explanation: The M1592V knock-in mouse study concludes that the contractile deficit is secondary
        to increased sodium influx, which is the claim this node makes.
