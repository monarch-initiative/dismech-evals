        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'Vigorous contraction loads the interstitial and transverse-tubular spaces with potassium,
          and weakness begins once the working muscle stops. What happens between stopping and the ictal
          potassium shift is not traced by any source cited here: the review that supplies both the trigger
          and the transverse-tubular potassium physiology lists the trigger mechanism during rest after
          exercise among the questions that remain open, so the link is recorded with unknown intermediates.'
