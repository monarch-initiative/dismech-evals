          weakness of respiratory muscles, and HP:0004889. HP:0002747 asserts insufficiency too and loses
          the episodic qualifier; HP:0030196 is a myasthenic concept. So HP:0004889 is the closest available
          term, and the residual gap is that the cited GeneReviews quote reports weakness of the breathing
