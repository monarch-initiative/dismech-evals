              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: paramyotonia congenita of Von Eulenburg
        disease_term:
          preferred_term: paramyotonia congenita of Von Eulenburg
          term:
            id: MONDO:0008195
            label: paramyotonia congenita of Von Eulenburg
        description: 'Allelic with HyperPP at SCN4A and caused by the same class of gain-of-function inactivation
          defect, so this is not a differential in the usual sense but a neighbouring point on one continuum.
          The same variant, and even the same family, can produce either presentation. What separates
          them is which arm of the phenotype dominates: myotonic stiffness with infrequent weakness in
          paramyotonia congenita, recurrent weakness with accompanying myotonia in HyperPP.'
        distinguishing_features:
        - 'Predominant symptom, not gene or variant: myotonic stiffness dominates in paramyotonia congenita,
          episodic weakness in HyperPP.'
        - Stiffness that paradoxically worsens over the first few contractions, rather than easing with
          repetition, favours paramyotonia congenita.
        - Cold-selective distal and facial stiffness in winter favours paramyotonia congenita, although
          cold triggers attacks in HyperPP too.
        - On long exercise testing, a rapid-onset decrement persisting for minutes (pattern I) favours
          paramyotonia congenita; an early increase followed by a late decrease (pattern IV) favours HyperPP.
        notes: Paramyotonia congenita has no dismech entry yet, so this differential points at the MONDO
          concept rather than at a sibling entry. Because the two are allelic and on one continuum, a
          future paramyotonia congenita entry would duplicate most of this entry's pathophysiology, and
          the lump-or-split decision should be made deliberately rather than by default.
      selected_evidence:
        snippet: Paramyotonia congenita (PMC) and hyperkalemic periodic paralysis (HyperPP) have extensive
          overlap of clinical features (Figure 1, center) and are caused by similar gain-of-function defects
          arising from missense mutations of NaV1.4
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
