            term:
              id: MONDO:0008224
              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: Treatment
      assertion:
        name: Dichlorphenamide Preventive Pharmacotherapy
        description: 'A carbonic anhydrase inhibitor, and the only drug approved for primary periodic
          paralysis. The evidence in HyperPP specifically is weaker than the approval suggests: in the
          pivotal randomized trial the hyperkalemic substudy showed a lower median attack rate on dichlorphenamide
          that did not reach statistical significance, and the trialists concluded the substudy lacked
          the precision to decide the question either way.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: dichlorphenamide
            term:
              id: CHEBI:101085
              label: diclofenamide
        target_phenotypes:
        - preferred_term: Episodic flaccid weakness
          term:
            id: HP:0003752
            label: Episodic flaccid weakness
        notes: The one-year open-label extension reported sustained reductions in attack rate, but it
          pooled the hyperkalemic and hypokalemic substudies, so it does not resolve the HyperPP-specific
          question either.
      selected_evidence:
        snippet: The oral carbonic anhydrase inhibitor dichlorphenamide (DCP) is approved for treatment
          of hyperkalemic and hypokalemic periodic paralyses and related variants.
        supports: SUPPORT
