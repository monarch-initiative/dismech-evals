  eb4526545884b4bcfab8b58e935d9e07e39274c2e13e0f8845424527a5335031:
    claim:
      about:
        disease:
          name: Hyperkalemic Periodic Paralysis
          disease_term:
            preferred_term: hyperkalemic periodic paralysis
            term:
              id: MONDO:0008224
              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SCN4A Gain-of-Function Missense Variant
        biological_scale: MOLECULAR
        description: A heterozygous missense variant in SCN4A, encoding the pore-forming alpha subunit
          of the skeletal-muscle voltage-gated sodium channel Nav1.4, is the sole established genetic
          lesion. T704M and M1592V are the two most common alleles. The variants act by gain of function
          rather than by loss of channel, which is why null alleles of SCN4A do not cause periodic paralysis.
        genes:
        - preferred_term: SCN4A
          term:
            id: hgnc:10591
            label: SCN4A
        genetic_context:
          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Heterozygous germline missense substitutions in SCN4A whose functional consequence,
            measured by heterologous expression, is a gain of function for Nav1.4 gating.
        cell_types:
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        molecular_functions:
        - preferred_term: Nav1.4 voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: GAIN_OF_FUNCTION
        locations:
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
      selected_evidence:
        snippet: Across the narrow clinical spectrum from PMC to HyperPP, and everything in between, the
          gene defects are missense mutations of SCN4A. No other causative gene has been implicated for
          HyperPP/PMC.
        supports: SUPPORT
