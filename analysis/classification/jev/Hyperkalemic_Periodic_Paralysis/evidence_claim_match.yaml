  accbcfb404a6980b32073fecfb107547a7a1cc2343e940bc7f3808497ff4a183:
    claim:
      about:
        disease:
          name: Hyperkalemic Periodic Paralysis
          disease_term:
            preferred_term: hyperkalemic periodic paralysis
            term:
              id: MONDO:0008224
              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Andersen-Tawil syndrome
        disease_term:
          preferred_term: Andersen-Tawil syndrome
          term:
            id: MONDO:0008222
            label: Andersen-Tawil syndrome
        description: The third primary periodic paralysis, caused by loss of function of the inward-rectifier
          potassium channel Kir2.1 rather than gain of function of Nav1.4. It also reaches depolarization-induced
          inexcitability, by removing the resting outward potassium current instead of adding an inward
          sodium current. Attacks can be associated with high, low, or normal potassium, so potassium
          alone does not separate it from HyperPP.
        distinguishing_features:
        - Ventricular arrhythmia, prolonged QT and prominent U waves, and the characteristic facial and
          skeletal features, are absent in HyperPP.
        - KCNJ2 is expressed in heart and bone as well as muscle, which is why Andersen-Tawil syndrome
          is multisystem while SCN4A disease is confined to skeletal muscle.
        - Myotonia argues against Andersen-Tawil syndrome and for HyperPP.
      selected_evidence:
        snippet: Unlike the skeletal muscle-specific expression for CLCN1, SCN4A, and CACNA1S; KCNJ2 is
          expressed in multiple tissues including skeletal muscle, heart, and bone.
        supports: SUPPORT
