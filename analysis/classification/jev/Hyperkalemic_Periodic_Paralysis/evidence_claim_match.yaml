      assertion_type: Definition
      assertion:
        name: GeneReviews clinical diagnostic definition of hyperPP
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'The clinical definition GeneReviews uses. Its potassium criterion is a three-limb
          disjunction, and the third limb is a provocation criterion rather than a measurement: an attack
          provoked or worsened by oral potassium satisfies it even when no ictal potassium value was captured.
          That limb carries most of the weight in practice, because ictal potassium is often normal. It
          is also the only part of the definition that is an exposure rather than a finding, which is
          why this entry carries potassium provocation as an ECTO-bound environmental exposure linked
          into the pathograph as well as here. Molecular confirmation is a heterozygous pathogenic SCN4A
          variant, curated under diagnosis.'
        inclusion_criteria:
        - preferred_term: Attacks of flaccid limb weakness
          description: May also include weakness of the muscles of the eyes, throat, breathing muscles,
            and trunk.
        - preferred_term: Hyperkalemia above 5 mmol/L, or a rise in serum potassium of at least 1.5 mmol/L
            during an attack, or provoking or worsening of an attack by oral potassium intake
          description: Any one of the three limbs satisfies the criterion. The provocation limb stands
            in for a measurement when none was made.
        - preferred_term: Normal serum potassium between attacks
        - preferred_term: Onset before age 20 years
        notes: HPO codes potassium provocation as a clinical modifier, HP:0031167 "Triggered by ingestion
          of potassium-rich food", which sits under HP:0012823 Clinical modifier and therefore outside
          the PhenotypeTerm enum root HP:0000118. It cannot be bound as a phenotype term in this schema,
          which is why the criterion is recorded here and as an environmental exposure rather than as
          a phenotype of its own.
      selected_evidence:
        snippet: hyperkalemia (serum potassium concentration >5 mmol/L) or an increase of serum potassium
          concentration of at least 1.5 mmol/L during an attack of weakness and/or provoking/worsening
          of an attack by oral potassium intake, normal serum potassium between attacks, and onset before
          age 20 years
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
