  e27d6512b0b3f92aea6ed64495d618120479cfbdb24e2fbd67524d737ba62e60:
    claim:
      about:
        disease:
          name: Hyperkalemic Periodic Paralysis
          disease_term:
            preferred_term: hyperkalemic periodic paralysis
            term:
              id: MONDO:0008224
              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: Phenotype
      assertion:
        name: Paramyotonia
        category: Musculoskeletal
        description: Muscle stiffness that is aggravated by cold and by exercise, rather than relieved
          by repeated contraction as in the warm-up myotonias. It occurs in close to half of patients
          and is the clinical feature that places HyperPP on a continuum with paramyotonia congenita.
        phenotype_term:
          preferred_term: Paramyotonia (cold- and exercise-aggravated muscle stiffness)
          term:
            id: HP:0011809
            label: Paradoxical myotonia
        notes: 'HPO does have a term for paramyotonia, under a label that does not contain the word: HP:0011809
          Paradoxical myotonia, whose definition reads "In classic myotonia the myotonia improves as muscles
          warm up, whereas in paradoxical myotonia (paramyotonia) it worsens with repeated muscle contractions."
          Because the string appears only inside that definition, `runoak -i ols:hp search "l~paramyotonia"`
          and `runoak -i ols:hp search "t~paramyotonia"` both return nothing, while `runoak -i ols:hp
          search "l~paradoxical myotonia"` returns HP:0011809; the positive control `runoak -i ols:hp
          search "l~myotonia"` returns ten terms including HP:0011809, so the two empty results are a
          property of the label index and not of an unreachable adapter. HP:0012904 Cold-sensitive myotonia
          is a sibling rather than a parent and covers only the thermal half of the concept, so cold aggravation
          stays in preferred_term and in the cited quotes.'
      selected_evidence:
        snippet: some affected individuals have paradoxical worsening of myotonic stiffness with repeated
          effort, or paramyotonia, which is also characteristically aggravated by muscle cooling
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/3
      evidence_path: /phenotypes/3/evidence/1
