      assertion_type: DifferentialDiagnosis
      assertion:
        name: Thomsen and Becker disease
        disease_term:
          preferred_term: Thomsen and Becker disease
          term:
            id: MONDO:0009710
            label: Thomsen and Becker disease
        description: CLCN1-related myotonia congenita. Both diseases cause myotonia through sarcolemmal
          instability, but the lesion is a reduced chloride conductance rather than a persistent sodium
          current, and there are no potassium-associated paralytic attacks. Transient weakness after rest
          does occur in Becker disease, which is the point of genuine clinical confusion.
        distinguishing_features:
        - Recurrent paralytic attacks with a documented ictal rise in serum potassium favour HyperPP;
          myotonia congenita has stiffness without dyskalemic attacks.
        - Stiffness relieved by repeated contraction (warm-up) favours myotonia congenita; stiffness worsened
          by the first contractions or by cold favours the sodium-channel disorders.
        - CLCN1 rather than SCN4A on sequencing, and recessive inheritance in the case of Becker disease.
        - Marked muscle hypertrophy is usual in myotonia congenita and is not a feature of HyperPP.
      selected_evidence:
        snippet: Reduction of the chloride conductance, as occurs in myotonia congenita, impairs this
          stability and results in bursts of after-discharges and delayed relaxation of force in myotonia
        supports: SUPPORT
