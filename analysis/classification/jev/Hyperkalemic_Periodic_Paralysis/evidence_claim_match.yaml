  4bc0bebe2733a9b82fde1b62addbc7849a20090f30d9a89e0ca8d494749286d2:
    claim:
      about:
        disease:
          name: Hyperkalemic Periodic Paralysis
          disease_term:
            preferred_term: hyperkalemic periodic paralysis
            term:
              id: MONDO:0008224
              label: hyperkalemic periodic paralysis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: hypokalemic periodic paralysis
        disease_term:
          preferred_term: hypokalemic periodic paralysis
          term:
            id: MONDO:0008223
            label: hypokalemic periodic paralysis
        description: The mechanistically opposite periodic paralysis, and the most important differential
          because the treatments are contradictory. Both end in depolarization-induced inexcitability,
          but HypoPP gets there through an anomalous gating-pore leak current that depolarizes the fibre
          when extracellular potassium is low, whereas HyperPP gets there through impaired channel inactivation
          unmasked when potassium is high. Giving potassium helps one and precipitates the other.
        distinguishing_features:
        - 'Ictal serum potassium: low (below 3.5 mmol/L) in HypoPP, high (above 4.5 mmol/L) in HyperPP.
          This is the defining separation, though it can be hard to document.'
        - Myotonia is an exclusionary criterion for HypoPP and is present in most HyperPP patients.
        - 'Triggers diverge: carbohydrate-rich meals and high salt in HypoPP, potassium-rich food and
          fasting in HyperPP.'
        - 'Treatment is opposite in direction: potassium supplements and potassium-sparing diuretics in
          HypoPP, potassium-wasting diuretics in HyperPP.'
        - 'Genetics: HypoPP is usually CACNA1S, and its SCN4A variants are arginine substitutions in S4
          voltage sensors, which HyperPP variants are not.'
        - HypoPP attacks tend to be more severe and prolonged; HyperPP attacks are more frequent and shorter.
      selected_evidence:
        snippet: Episodic weakness in HypoPP is caused by "leaky" Ca2+ or Na+ channels, with an anomalous
          gating pore current that is conducted through the voltage-sensor domain of the channel.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
