              rather than with familial chylomicronemia syndrome, which is curated separately, because
              the expression of the rare APOA5 alleles depends on a second triglyceride-raising allele
              or a coinherited LPL variant, which is the multifactorial architecture this entry models,
              and because the cited study distinguishes the type 5 phenotype from the type 1 phenotype
              of lipoprotein lipase and apoC-II deficiency.
          role: ancestor
      assertion_type: Inheritance
      assertion:
        name: Multifactorial, rare allele plus a second triglyceride-raising allele
        description: 'Not simple Mendelian: the reported carriers expressed severe hypertriglyceridemia
          only when a second triglyceride-raising allele was present in trans, or when the rare allele
          was homozygous or accompanied by an LPL variant.'
      selected_evidence:
        snippet: Their occurrence in the homozygous state, coinheritance of LPL variants or common APOA5
          TG-raising variant in trans, appears to be essential for their phenotypic expression.
        supports: SUPPORT
