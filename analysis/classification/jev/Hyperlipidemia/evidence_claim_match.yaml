  b3bcebf06e52aad0932a8f4c41a36ea0b1519fafa175846332827db6255e3068:
    claim:
      about:
        disease:
          name: Hyperlipidemia
          disease_term:
            preferred_term: hyperlipidemia
            term:
              id: MONDO:0021187
              label: hyperlipidemia
        context: []
      assertion_type: Subtype
      assertion:
        name: Hyperlipoproteinemia Type V
        display_name: Hyperlipoproteinemia type V (APOA5)
        subtype_term:
          preferred_term: hyperlipoproteinemia type V
          term:
            id: MONDO:0007762
            label: hyperlipoproteinemia type V
        genes:
        - preferred_term: APOA5
          description: Encodes apolipoprotein A-V, an activator of lipoprotein-lipase-mediated lipolysis.
            Rare loss-of-function variants reduce LPL activity and mass, and the severe phenotype was
            seen only when a second triglyceride-raising allele was present on the other chromosome.
          term:
            id: hgnc:17288
            label: APOA5
        description: Severe hypertriglyceridemia with both chylomicrons and the triglyceride carried on
          very-low-density lipoproteins elevated, which is the type V pattern. This is not the same lipid
          phenotype as the Mixed Hyperlipidemia row above, where the raised cholesterol is the other half
          of the picture; MONDO:0007762 carries "mixed hyperlipemia" among its synonyms, which is the
          older name for type V and not a link to that row. The row belongs on this umbrella rather than
          with familial chylomicronemia syndrome, which is curated separately, because the expression
          of the rare APOA5 alleles depends on a second triglyceride-raising allele or a coinherited LPL
          variant, which is the multifactorial architecture this entry models, and because the cited study
          distinguishes the type 5 phenotype from the type 1 phenotype of lipoprotein lipase and apoC-II
          deficiency.
        inheritance:
        - name: Multifactorial, rare allele plus a second triglyceride-raising allele
          description: 'Not simple Mendelian: the reported carriers expressed severe hypertriglyceridemia
            only when a second triglyceride-raising allele was present in trans, or when the rare allele
            was homozygous or accompanied by an LPL variant.'
      selected_evidence:
        snippet: While type 1 hyperlipidemia is associated with lipoprotein lipase or apoCII deficiencies,
          the etiology of type 5 hyperlipidemia remains largely unknown.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/4
      evidence_path: /has_subtypes/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16200213
      reference_title: Apoa5 Q139X truncation predisposes to late-onset hyperchylomicronemia due to lipoprotein
        lipase impairment.
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: Frames the study as an investigation of type 5 hyperlipidemia specifically, and separates
        it from the type 1 phenotype caused by LPL or apoC-II deficiency.
