              label: hypermetabolism due to uncoupled mitochondrial oxidative phosphorylation 2
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: coupling_versus_catalysis_allelic_split
        hypothesis_label: ATP5F1B variants split into a coupling-defect arm causing hypermetabolism and
          a catalytic-defect arm causing dystonia
        status: EMERGING
        description: 'Heterozygous ATP5F1B missense variants produce two clinically disjoint phenotypes,
          and both missense arms are reported as dominant-negative, so the dominance mode does not separate
          them. The hypothesis is that what differs is which function of the beta subunit the mutant protein
          spoils. In the hypermetabolic arm, p.Leu335Pro leaves proton translocation and complex V assembly
          intact but loosens the coupling between stalk rotation and ATP synthesis, so energy leaves as
          heat and respiration rises. In the movement-disorder arm, p.Thr334Pro and p.Val482Ala leave
          beta subunit abundance intact but reduce complex V activity, with insufficient ATP as the proposed
          consequence. The dominance premise is scoped to the missense alleles deliberately: the ATP5F1B
          splice allele c.1074+1G>T lowers transcript level, and its authors model ATP5F1A/ATP5F1B dominant
          disease as insufficient protein production for loss-of-function alleles alongside dominant negativity
          for missense alleles, so it is a reduction-of-output allele rather than a third dominant-negative
          one.

          The discriminating measurement is respiratory flux, and it already favours the split: the dystonia
          patients'' fibroblasts showed no alteration in oxygen consumption despite defective complex
          V and a low membrane potential, where the hypermetabolic arm''s cells consume more oxygen. Both
          arms report a low membrane potential, so membrane potential alone does not discriminate.

          Three things keep this at EMERGING rather than settled. First, a cited source contests the split''s
          premise: the dystonia report proposes the same beta-to-gamma contact lesion for p.Thr334Pro
          and p.Leu335Pro, and raises less-efficient coupling between proton flow and rotary catalysis
          as a possible mechanism for its own variants too, explicitly noting that this is the mechanism
          already suggested for p.Leu335Pro. Second, the two arms'' functional data are not uniform within
          themselves: complex V activity was severely reduced for p.Thr334Pro but normal in one p.Val482Ala
          carrier and only mildly reduced in the other, where the defect appeared instead as reduced substrate
          affinity. Third, the clinical architecture differs on a second and better-evidenced axis than
          mechanism: this entry''s allele is de novo, fully penetrant in both carriers and ACMG pathogenic,
          while the dystonia alleles are transmitted with incomplete penetrance, were classified as variants
          of uncertain significance, and the splice allele''s own report says the gene-disease relationship
          awaits further confirmation. What no study has done is measure respiration and complex V activity
          across variants from both arms in one isogenic background.'
      selected_evidence:
        snippet: these results suggest the increased oxygen consumption rate is caused by dissipation
          of the proton motive force, without a corresponding increase in ATP synthesis
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
