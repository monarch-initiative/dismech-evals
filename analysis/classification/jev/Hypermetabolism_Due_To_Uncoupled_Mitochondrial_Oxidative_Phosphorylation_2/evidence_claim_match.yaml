          position is proposed to loosen the contact between the beta subunit and the gamma stalk. The
          mutant protein is expressed at somewhat lower levels than wild type but still assembles into
          macromolecular complex V, so the lesion is a functional one at an intersubunit interface rather
          than a failure of assembly.
