      assertion_type: Pathophysiology
      assertion:
        name: Chemiosmotic Uncoupling Within Complex V
        description: Protons continue to pass through the FO pore and drive stalk rotation, but the mechanical
          energy is no longer efficiently captured as ATP. The proton motive force is therefore dissipated
          without a matching rise in ATP synthesis, and the lost energy appears as heat. Pharmacological
          silencing of complex V with oligomycin abolishes the excess leak, and maximal stimulation with
          saturating ADP also removes the difference from control, which localises the defect to complex
          V itself rather than to a leaky inner membrane.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: proton motive force-driven mitochondrial ATP synthesis
          modifier: DECREASED
          term:
            id: GO:0042776
            label: proton motive force-driven mitochondrial ATP synthesis
        - preferred_term: proton transmembrane transport
          modifier: INCREASED
          term:
            id: GO:1902600
            label: proton transmembrane transport
      selected_evidence:
        snippet: demonstrating that uncoupling arises from a defect intrinsic to CV
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      evidence_source: IN_VITRO
      explanation: The oligomycin and saturating-ADP controls establish that the uncoupling originates
        in complex V rather than in a generally leaky membrane.
