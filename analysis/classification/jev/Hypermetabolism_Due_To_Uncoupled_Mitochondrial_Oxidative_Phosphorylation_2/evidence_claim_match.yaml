          would group this entry with autoinflammatory disease. HP:0002047 Malignant hyperthermia was
          also rejected: the report gives no anesthetic trigger for the intraoperative temperature of
          40 degrees, describing it as unexplained. No modifier is applied, since what is elevated is
          the temperature rather than its regulation.'
