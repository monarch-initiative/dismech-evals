          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Leu335Pro
        variant_type: single nucleotide variant
        clinical_significance: PATHOGENIC
        description: NM_001686.3:c.1004T>C, p.(Leu335Pro). De novo and heterozygous in both twins. Leu335
          sits near the hydrophobic sleeve of the alpha3beta3 hexamer that holds the gamma stalk tip,
          and is close to several yeast mgi residues whose mutation uncouples respiration from ATP synthesis.
          The authors propose it is the human equivalent of a yeast group 1 mgi mutation, impairing engagement
          of the gamma subunit by the hexamer. The functional consequence is dominant-negative on coupling
          rather than a loss of catalytic activity.
      selected_evidence:
        snippet: Leu335 lies close to the hydrophobic sleeve in the α3β3 assembly that holds the tip of
          the γ subunit of the central stalk
        supports: SUPPORT
