  c410fb215db473be1e42837ea8a0164edf2c3a66c92c436ffce497293120d05e:
    claim:
      about:
        disease:
          name: Hypermetabolism Due To Uncoupled Mitochondrial Oxidative Phosphorylation 2
          disease_term:
            preferred_term: Hypermetabolism due to uncoupled mitochondrial oxidative phosphorylation 2
            term:
              id: MONDO:0859302
              label: hypermetabolism due to uncoupled mitochondrial oxidative phosphorylation 2
        context:
        - path: /experimental_models/2
          value:
            name: HeLa lentiviral heterologous expression of ATP5B-Leu335Pro-FLAG
            experimental_model_type: CELL_LINE
            culture_system: Lentiviral transduction of epitope-tagged wild-type or mutant construct
            cell_source: HeLa cell line
            publication: PMID:36239646
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            description: 'The test that distinguishes dominant negativity from haploinsufficiency: expressing
              the mutant subunit on an unmodified wild-type background. It reproduced the raised respiration
              and lowered potential, which is the basis for calling the variant dominant-negative on coupling.
              The same system shows the mutant subunit assembles into macromolecular complex V.'
            notes: 'The lower construct expression is worth keeping in view in both directions. It weakens
              any quantitative reading, and it strengthens the qualitative one: a mutant subunit present
              at below wild-type levels still lowered membrane potential and raised respiration.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Chemiosmotic Uncoupling Within Complex V
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: Mutant subunit expressed alongside wild type is sufficient to lower membrane potential
          and raise respiration, so the mutant protein spoils the function of an enzyme population that
          includes wild-type subunits.
        divergences:
        - divergence_type: PROXY_QUANTITY
          materiality: QUALIFYING
          description: The quantity under experimental control is transduced construct level on top of
            unmodified endogenous expression. The patients' quantity is a one-to-one allelic ratio at
            the native locus. The report notes mutant construct expression ran consistently lower than
            wild-type, so the mutant-to-wild-type subunit ratio in this system is neither the patients'
            ratio nor a measured one, and the result licenses the direction of the dominant-negative effect
            rather than its size.
        - divergence_type: POPULATION_MISMATCH
          materiality: QUALIFYING
          description: HeLa is a cervical adenocarcinoma line standing in for the patients' tissue, with
            the same transformed-metabolism caveat as the A375 arm.
        readouts:
        - name: Basal oxygen consumption on a wild-type background
          target: Chemiosmotic Uncoupling Within Complex V
          direction: INCREASED
          interpretation: Respiration rose despite lower-than-wild-type construct expression, which, with
            the fall in potential, is what makes the dominant-negative reading rather than haploinsufficiency.
        - name: Basal mitochondrial membrane potential on a wild-type background
          target: Chemiosmotic Uncoupling Within Complex V
          direction: DECREASED
          interpretation: Potential fell despite lower-than-wild-type construct expression, the depolarization
            half of the uncoupling signature.
      selected_evidence:
        snippet: HeLa cells were engineered to heterologously express either ATP5B-FLAG or ATP5B-Leu335Pro-FLAG
          using lentiviral expression
        supports: SUPPORT
