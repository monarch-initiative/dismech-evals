        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_heds_sex_ratio
        prompt: Why is hEDS diagnosed in women several times more often than in men despite apparently
          autosomal dominant transmission?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - inheritance#Autosomal dominant inheritance pattern
        rationale: 'Clinic series report female-to-male ratios of roughly 7:1 for hEDS and higher still
          for HSD, which is irreconcilable with autosomal dominant inheritance unless sex modifies penetrance,
          expressivity, or ascertainment. The competing explanations (hormonal modulation of connective
          tissue, sex differences in pain reporting, referral and diagnostic bias) have different consequences:
          one is disease biology that belongs in the pathograph, the others are study design artifacts
          that would bias every hEDS cohort assembled to date.'
        proposed_experiments:
        - experiment_id: exp_heds_sex_ratio_ascertainment_decomposition
          experiment_design: HUMAN_OBSERVATIONAL
          name: Ascertainment-controlled sex ratio decomposition
          description: Compare the hEDS sex ratio between referral-based clinic cohorts and population-based
            sampling frames such as biobank or national registry cohorts ascertained on diagnosis codes
            rather than specialist referral. Within families, compare penetrance in male versus female
            first-degree relatives of affected probands, which holds genotype risk approximately constant
            across sexes.
          experiment_type:
            preferred_term: ascertainment bias decomposition
          decision_criterion: Whether the sex ratio persists in population-based and within-family sampling
            after removing referral-based ascertainment. Persistence within families indicates sex-modified
            penetrance as real disease biology, which would qualify the plain autosomal dominant model
            recorded here; a ratio collapsing toward 1:1 under population sampling indicates a purely
            ascertainment-driven explanation and leaves the inheritance model intact.
          would_support:
          - inheritance#Autosomal dominant inheritance pattern
          would_refute:
          - inheritance#Autosomal dominant inheritance pattern
      selected_evidence:
        snippet: Although hEDS and HSD are autosomal-dominant conditions and would be expected to display
          a 1:1 sex ratio, studies report higher prevalence in women.
        supports: SUPPORT
