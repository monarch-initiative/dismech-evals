  1b4cdd3335fcebbf1cab4b768c89ad08076cdddbb458a99ccd4adf493b788d5f:
    claim:
      about:
        disease:
          name: Hypermobile Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: Ehlers-Danlos syndrome, hypermobility type
            term:
              id: MONDO:0007523
              label: Ehlers-Danlos syndrome, hypermobility type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_heds_causal_architecture
        prompt: Is hEDS a locus-heterogeneous Mendelian disorder, a common-variant complex trait, or a
          composite of both?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Candidate extracellular matrix remodeling abnormalities
        - inheritance#Autosomal dominant inheritance pattern
        rationale: The entry records autosomal dominant transmission, but no causal gene has been validated.
          Exome sequencing of diagnostically unresolved EDS found candidate loci without genome-wide significance,
          a GWAS meta-analysis found common-variant contributions, and a KLK15 missense variant segregated
          in two families with a supporting knock-in mouse. These three results are compatible with very
          different disease architectures, and the choice between them determines whether diagnostic sequencing
          is even the right instrument.
        proposed_experiments:
        - experiment_id: exp_heds_joint_architecture_partition
          name: Joint rare-variant and common-variant architecture partition
          description: Partition hEDS liability across rare and common variation in a single analysis
            rather than in separate studies. Combine the HEDGE whole-genome cohort with published GWAS
            summary statistics to estimate SNP-based heritability, gene-level rare-variant burden, and
            the fraction of familial recurrence each explains. Include an explicit replication arm for
            KLK15 and the wider kallikrein family in unrelated probands.
          experiment_type:
            preferred_term: statistical genetics architecture partition
          decision_criterion: Whether rare-variant burden or common-variant polygenic score explains the
            larger share of liability, and whether kallikrein-family burden replicates outside the discovery
            cohort. A monogenic or oligogenic architecture is indicated if replicated rare-variant burden
            dominates and segregates in families; a complex-trait architecture if SNP-based heritability
            dominates and no gene reaches exome-wide significance, which would also remove the expectation
            that a single validated causal gene is the endpoint of hEDS genetics.
          would_support:
          - inheritance#Autosomal dominant inheritance pattern
          would_refute:
          - inheritance#Autosomal dominant inheritance pattern
      selected_evidence:
        snippet: Genetic burden analysis revealed a number of novel loci, although none reached the threshold
          for genome-wide significance.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37813462
      reference_title: Genetic complexity of diagnostically unresolved Ehlers-Danlos syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Exome sequencing of unresolved EDS patients failed to identify a significant locus,
        which is the primary evidence that hEDS is not a simple monogenic disorder.
