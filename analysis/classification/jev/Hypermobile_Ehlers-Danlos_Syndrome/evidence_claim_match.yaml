          value:
            name: Candidate extracellular matrix remodeling abnormalities
            description: Cultured hEDS/HSD dermal fibroblasts show collagen/fibronectin matrix disorganization
              and altered matrix-receptor organization. Excessive matrix remodeling is a candidate cellular
              mechanism. The upstream etiology and causal contribution of these culture findings to joint
              instability or other clinical manifestations remain unresolved.
            cell_types:
            - preferred_term: fibroblast
              term:
                id: CL:0000057
                label: fibroblast
            biological_processes:
            - preferred_term: extracellular matrix organization
              modifier: ABNORMAL
              term:
                id: GO:0030198
                label: extracellular matrix organization
            mechanism_confidence: HYPOTHETICAL
            biological_scale: CELLULAR
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Myofibroblast-like fibroblast transition
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: In cultured hEDS/HSD dermal fibroblasts, fibronectin-matrix disassembly and altered
          integrin recruitment promote the αvβ3–ILK–Snail1 transition pathway. The initiating extracellular
          ligands and some intracellular intermediates remain unresolved; this model-level relation does
          not establish a route to clinical joint instability.
      selected_evidence:
        snippet: control fibroblasts, grown in the presence of the hEDS- and HSD-conditioned media, disassemble
          the FN–ECM and are induced to cluster at membrane level the αvβ3 integrin, which transduces
          through ILK to the nuclear Snail1 for the α-SMA fibers’ organization
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/0
      evidence_path: /pathophysiology/0/downstream/0/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /pathophysiology/0
    evidence_metadata:
      reference: PMID:29587413
      reference_title: Multifaced Roles of the αvβ3 Integrin in Ehlers-Danlos and Arterial Tortuosity
        Syndromes' Dermal Fibroblasts.
      evidence_source: IN_VITRO
      explanation: The conditioned-medium experiment supports a matrix/signaling-to-transition relation
        within cultured fibroblasts. The review leaves the responsible extracellular factors unidentified,
        so the edge retains unknown intermediates and the source node's hypothetical confidence. It does
        not transfer the cEDS/vEDS survival pathway to hEDS or assert clinical causation.
