  82795d46b054558670c9011ce6165b40590e827c048af1168389179a5d449cf5:
    claim:
      about:
        disease:
          name: Hypermobile Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: Ehlers-Danlos syndrome, hypermobility type
            term:
              id: MONDO:0007523
              label: Ehlers-Danlos syndrome, hypermobility type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_heds_myofibroblast_causal_dependency
        prompt: Is the alpha-v-beta-3/ILK/Snail1 myofibroblast transition a causal driver of extracellular
          matrix failure in hEDS, a passenger of the disease state, or a mechanotransduction artifact
          of culture on rigid plastic?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Myofibroblast-like fibroblast transition
        - pathophysiology#Candidate extracellular matrix remodeling abnormalities
        rationale: 'The myofibroblast-like transition is the most mechanistically detailed node in this
          entry, but every observation supporting it comes from patient fibroblasts grown on tissue-culture
          plastic, and the node''s own description already concedes it is model evidence rather than a
          validated biomarker. Substrate rigidity is an independent and sufficient inducer of myofibroblast
          differentiation in disease fibroblasts, so the reported hEDS phenotype is confounded by the
          culture format at the point of measurement. Three outcomes are live: the transition is a causal
          dependency of ECM failure, a passenger that tracks disease without driving it, or a stiffness
          artifact that a soft substrate abolishes in patient and control cells alike. The node currently
          carries no downstream causal edges, which is the honest reflection of that uncertainty; only
          the first outcome would justify drawing one, and only the first makes the axis a therapeutic
          target.'
        proposed_experiments:
        - experiment_id: exp_heds_myofibroblast_stiffness_controlled_perturbation
          experiment_design: TARGETED_PERTURBATION
          name: Stiffness-controlled perturbation screen of the myofibroblast transition
          description: Culture a panel of hEDS, HSD, and control dermal fibroblasts across a substrate-stiffness
            series spanning soft matrix and rigid tissue-culture plastic, crossed with a bounded perturbation
            set targeting the proposed axis (alpha-v-beta-3 integrin blockade, ILK inhibition, SNAI1 knockdown,
            TGF-beta pathway modulation, MMP9 inhibition). Score alpha-smooth muscle actin stress-fiber
            organization, fibronectin matrix assembly, MMP9 secretion, and migration by high-content imaging,
            with the perturbation set chosen from the differentially expressed genes in GSE218012. The
            stiffness arm is the control the existing literature lacks, and the plate-based readouts make
            this the one gap in this entry with a protocol an autonomous laboratory could compile and
            run.
          experiment_type:
            preferred_term: high-content perturbation screen
          model_systems:
          - name: Patient-derived dermal fibroblast panel on defined-stiffness substrates
            description: Primary hEDS, HSD, and control dermal fibroblasts cultured on hydrogels of controlled
              elastic modulus alongside conventional rigid plastic.
            experimental_model_type: PRIMARY_CELL_CULTURE
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
          decision_criterion: Whether the hEDS-versus-control difference in myofibroblast conversion and
            matrix assembly survives on soft substrate, and whether perturbing the alpha-v-beta-3/ILK/Snail1
            axis rescues matrix assembly rather than only reducing the alpha-smooth muscle actin marker.
            A causal dependency is indicated if axis perturbation restores matrix assembly and the patient-control
            difference persists on soft substrate; a passenger role if perturbation removes the marker
            without restoring matrix assembly; and a rigid-culture mechanotransduction artifact rather
            than hEDS biology if the patient-control difference disappears on soft substrate.
          would_support:
          - pathophysiology#Myofibroblast-like fibroblast transition
          would_refute:
          - pathophysiology#Myofibroblast-like fibroblast transition
      selected_evidence:
        snippet: In hEDS and HSD cells, the αvβ3 integrin was shown to be involved in the fibroblast-to-myofibroblast
          transition
        supports: SUPPORT
    origin:
      assertion_path: /discussions/6
