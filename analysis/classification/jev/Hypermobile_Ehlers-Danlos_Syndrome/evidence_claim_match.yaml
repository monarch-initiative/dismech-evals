        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_heds_dysautonomia_mechanism
        prompt: What mechanisms connect hEDS to peripheral neuropathy, orthostatic tachycardia, and gastrointestinal
          dysmotility, and do they differ between clinical subgroups?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Candidate extracellular matrix remodeling abnormalities
        - phenotypes#Orthostatic tachycardia
        - phenotypes#Peripheral neuropathy
        - phenotypes#Gastrointestinal dysmotility
        rationale: The referred autonomic-testing cohort documents substantial neurologic and autonomic
          morbidity, but it is not an unselected hEDS population and POTS was present in 33%, not most
          patients. Gastroenterology guidance describes biological links as limited and evolving. No causal
          edge from the cultured ECM or myofibroblast nodes to these clinical features is established
          by those association data.
        proposed_experiments:
        - experiment_id: exp_heds_neuroimmune_locus_to_nerve_bridge
          name: Genotype-anchored small-fiber neuropathy stratification
          description: Stratify a deeply phenotyped hEDS cohort with skin biopsy intraepidermal nerve
            fiber density, autonomic function testing, and transcranial Doppler cerebral blood flow by
            genotype at the GWAS-implicated regulatory locus, using GTEx tibial nerve as the eQTL reference
            tissue. Test whether risk allele carriers show greater fiber loss or cerebral hypoperfusion
            than non-carriers with equivalent joint phenotypes.
          experiment_type:
            preferred_term: genotype-stratified deep phenotyping study
          decision_criterion: Whether neuropathic and cerebrovascular measures differ by genotype after
            adjustment for joint-phenotype severity. A replicated genotype effect would motivate testing
            a neuroimmune mechanism. A null result would not establish a purely mechanical explanation
            or exclude other mechanisms.
          would_support:
          - phenotypes#Orthostatic tachycardia
          - phenotypes#Peripheral neuropathy
          would_refute:
          - pathophysiology#Candidate extracellular matrix remodeling abnormalities
      selected_evidence:
        snippet: while theoretical explanations exist, experimental evidence of the biological mechanisms
          that explain relationships is limited and evolving
        supports: SUPPORT
