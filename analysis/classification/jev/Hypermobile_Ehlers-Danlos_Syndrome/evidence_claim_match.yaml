  904840954dfa690db36234c48aa3e3e2832ff1893b5c5c186d0fdda00029af60:
    claim:
      about:
        disease:
          name: Hypermobile Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: Ehlers-Danlos syndrome, hypermobility type
            term:
              id: MONDO:0007523
              label: Ehlers-Danlos syndrome, hypermobility type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_heds_hsd_boundary
        prompt: Is the 2017 criteria-based split between hEDS and hypermobility spectrum disorder biologically
          real, or an artifact of a threshold-based checklist?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Candidate extracellular matrix remodeling abnormalities
        - pathophysiology#Myofibroblast-like fibroblast transition
        rationale: 'Two independent molecular datasets from the same group point the same way: dermal
          fibroblast RNA-seq across 20 hEDS and 20 HSD patients found a shared cellular phenotype, and
          plasma ECM-fragmentation profiling found a shared fibronectin and collagen-I signature. If no
          molecular boundary exists, the dismech decision to keep separate hEDS and HSD framing needs
          an explicit justification, and cohort assembly for every other hEDS question is affected.'
        proposed_experiments:
        - experiment_id: exp_heds_hsd_blinded_molecular_classifier
          name: Blinded molecular classifier for the hEDS/HSD boundary
          description: Train a classifier on GSE218012 dermal fibroblast RNA-seq to separate hEDS from
            HSD, with healthy donors as a positive-control contrast, using nested cross-validation and
            label permutation to establish the null. Repeat on plasma ECM-fragment profiles from an independent
            cohort.
          experiment_type:
            preferred_term: supervised classification of transcriptomic profiles
          decision_criterion: Whether hEDS-versus-HSD classification accuracy exceeds the permuted null,
            given that the same pipeline separates patients from healthy donors. A real biological boundary
            is indicated if hEDS and HSD separate above the null; a single-entity model if the two are
            inseparable while both separate from controls, which would mean the 2017 criteria threshold
            does not track a molecular distinction and that these nodes describe one shared substrate
            rather than an hEDS-specific one.
          would_support:
          - pathophysiology#Candidate extracellular matrix remodeling abnormalities
          - pathophysiology#Myofibroblast-like fibroblast transition
          would_refute:
          - pathophysiology#Candidate extracellular matrix remodeling abnormalities
          - pathophysiology#Myofibroblast-like fibroblast transition
      selected_evidence:
        snippet: We demonstrated that both cell types show a common cellular trait, i.e., generalized
          extracellular matrix (ECM) disarray, myofibroblast differentiation, and dysregulated gene expression.
        supports: SUPPORT
    origin:
