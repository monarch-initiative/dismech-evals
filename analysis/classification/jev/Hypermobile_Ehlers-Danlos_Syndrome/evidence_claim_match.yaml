        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_heds_fascia_versus_dermis_substrate
        prompt: Is fascia, rather than dermis, the primary affected tissue in hEDS, and is the dermal
          fibroblast phenotype a proxy for it?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Myofibroblast-like fibroblast transition
        - pathophysiology#Joint instability and recurrent soft-tissue injury
        rationale: Every molecular dataset in this entry is derived from dermal fibroblasts, because skin
          is what is easy to biopsy. A fascia-centered model proposes that the clinically relevant substrate
          is deep fascia, where thickness, interfascial gliding, and stiffness abnormalities have been
          reported. If correct, the dermal fibroblast phenotype the pathophysiology nodes rest on is an
          accessible surrogate rather than the affected tissue, and no public fascia-specific omics dataset
          exists to test this.
        proposed_experiments:
        - experiment_id: exp_heds_paired_fascia_dermis_transcriptome
          name: Paired fascia and dermis transcriptomic comparison
          description: Collect paired deep fascia and dermis biopsies from the same hEDS patients and
            matched controls, with ultrasound measurement of fascial thickness and interfascial gliding
            at the biopsy site. Compare the ECM-remodeling and myofibroblast signatures between tissues
            within each patient, so that tissue effect is estimated independently of between-patient variation.
          experiment_type:
            preferred_term: paired-tissue transcriptomic comparison
          decision_criterion: Whether the disease signature is stronger in fascia than in paired dermis
            from the same individual, and whether it tracks the imaging measures. Concordance between
            the two tissues validates dermal fibroblasts as a surrogate and leaves these nodes standing;
            a signature confined to or much stronger in fascia indicates a fascia-primary model, and would
            mean the dermal fibroblast findings cannot be read directly as the tissue-level mechanism
            of joint instability.
          would_support:
          - pathophysiology#Myofibroblast-like fibroblast transition
          - pathophysiology#Joint instability and recurrent soft-tissue injury
          would_refute:
          - pathophysiology#Myofibroblast-like fibroblast transition
      selected_evidence:
        snippet: It underscores the urgent need for multidisciplinary research to define diagnostic biomarkers,
          clarify therapeutic targets
        supports: SUPPORT
