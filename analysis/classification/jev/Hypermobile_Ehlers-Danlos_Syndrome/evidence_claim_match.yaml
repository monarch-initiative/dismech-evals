            term:
              id: MONDO:0007523
              label: Ehlers-Danlos syndrome, hypermobility type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_heds_criterion3_exclusion_boundary
        prompt: What is the minimum sufficient genetic workup before criterion 3 of the 2017 criteria
          (exclusion of alternative diagnoses) can be considered satisfied?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Candidate extracellular matrix remodeling abnormalities
        rationale: hEDS is a diagnosis of exclusion, but the exclusion set is undefined. In a single-center
          series, a quarter of patients who already met all three 2017 criteria were found on genetic
          testing to have an alternative or additional diagnosis with different management. Without a
          specified panel, criterion 3 is unfalsifiable and cohort purity varies by center, which contaminates
          every downstream hEDS study including the genetic ones.
        proposed_experiments:
        - experiment_id: exp_heds_exclusion_panel_yield_curve
          name: Diagnostic-yield curve for a defined hEDS exclusion panel
          description: Assemble a candidate exclusion gene set from the EDS, Loeys-Dietz, heritable thoracic
            aortic disease, and EDS-mimicking Mendelian disorder panels, annotated with ClinGen gene-disease
            validity and dosage sensitivity. Apply it retrospectively to consecutive criteria-positive
            hEDS cohorts and plot reclassification yield against panel size to find where the curve flattens.
          experiment_type:
            preferred_term: retrospective diagnostic yield analysis
          decision_criterion: The panel size at which incremental reclassification yield falls below a
            pre-specified threshold. A bounded minimum panel that makes criterion 3 operational is indicated
            if the curve flattens; a high sustained reclassification yield would instead mean criteria-positive
            cohorts are substantially contaminated by alternative diagnoses, undermining the cohort basis
            on which this node's mechanism evidence rests.
          would_support:
          - pathophysiology#Candidate extracellular matrix remodeling abnormalities
          would_refute:
          - pathophysiology#Candidate extracellular matrix remodeling abnormalities
      selected_evidence:
        snippet: Genetic testing identified an alternative or additional diagnosis in 47 of these individuals
          (26.4%), with clinical implications requiring distinct management strategies.
        supports: SUPPORT
