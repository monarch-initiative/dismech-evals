  07f02e2eb6c40d568585c31b8d8db49af92ec8478b18779a784c99ca3fce66fd:
    claim:
      about:
        disease:
          name: Hyperostosis Cranialis Interna
          disease_term:
            preferred_term: hyperostosis cranialis interna
            term:
              id: MONDO:0007765
              label: hyperostosis cranialis interna
        context: []
      assertion_type: Diagnosis
      assertion:
        name: 18F-Fluoride PET/CT
        description: 'The only test here that quantifies disease activity rather than describing structure,
          which is why it is not redundant with computed tomography. Uptake is significantly higher in
          the sphenoid bone and clivus of affected family members, and visual assessment of the scans
          distinguishes disease severity and shows how the disturbance of bone metabolism evolves over
          life. That makes it the natural instrument for the surveillance this entry''s management argument
          depends on, since the decision to decompress turns on whether the process is still advancing.

          The study was done in this kindred: nine affected family members, seven unaffected relatives
          and nine unrelated controls.'
        diagnosis_term:
          preferred_term: 18F-fluoride positron emission tomography and computed tomography
          term:
            id: NCIT:C103512
            label: Positron Emission Tomography and Computed Tomography Scan
        results: Significantly higher 18F-fluoride uptake in the sphenoid bone and clivus of affected
          individuals, with standardised uptake values measured at frontal bone, sphenoid bone, petrous
          bone and clivus.
        notes: The NCIT binding names the modality pairing rather than the tracer. NCIT has no 18F-fluoride
          term, so preferred_term carries the tracer, which is the part that makes this a bone-metabolism
          measurement rather than a structural scan.
      selected_evidence:
        snippet: (18)F-Fluoride uptake is statistically significantly higher in the sphenoid bone and
          clivus regions of affected family members.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /diagnosis/4
