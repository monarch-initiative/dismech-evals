  71ae8224902bc82bbbee0060ca3fbc5fffd136876c91ad857ef1bb20df5db0fb:
    claim:
      about:
        disease:
          name: Hyperostosis Cranialis Interna
          disease_term:
            preferred_term: hyperostosis cranialis interna
            term:
              id: MONDO:0007765
              label: hyperostosis cranialis interna
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Vestibular Testing and Visual Evoked Potentials
        description: Electronystagmography covers the vestibular half of eighth-nerve function, with abnormalities
          in about half of patients. Visual evoked potentials monitor the optic nerve and are recommended
          in combination with radiological and ophthalmological examination rather than alone.
        diagnosis_term:
          preferred_term: electronystagmography and visual evoked potentials
          term:
            id: NCIT:C215111
            label: Neuroelectrophysiology Test
        results: Vestibular abnormalities in about half of patients.
        notes: 'Bound to NCIT:C215111 Neuroelectrophysiology Test, defined as a diagnostic tool measuring
          electrical signals produced by nerves and muscles. NCIT has no term for electronystagmography,
          for vestibular function testing, or for visual evoked potentials in general, so this is the
          accurate broader term with preferred_term carrying the specificity. An earlier version bound
          NCIT:C85857 Evoked Response Audiometry, which is an auditory term and is correctly used on the
          brainstem-response entry above; using it here made one identifier stand for two different tests.

          Splitting electronystagmography and visual evoked potentials into separate entries would be
          better still, since they monitor different nerves and carry different statistics.

          Blink and masseter reflexes are explicitly not advised for routine use: the symmetrical bilateral
          nature of the disease reduces sensitivity across the single-registration tests to 25 to 37.5
          percent, a range that includes visual evoked potentials, which are nonetheless still recommended
          because they cover a nerve nothing else in the panel reaches.'
      selected_evidence:
        snippet: VEPs are important to monitor optic nerve function in combination with radiological and
          ophthalmologic examination. We do not advise the routine use of blink and masseter reflex.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /diagnosis/3
