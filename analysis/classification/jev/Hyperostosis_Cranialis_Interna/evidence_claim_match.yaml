            term:
              id: MONDO:0007765
              label: hyperostosis cranialis interna
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Enhanced Endosteal Bone Formation
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: Osteoblasts lay down excess bone on the inner surface. Histology in patients shows
          increased bone formation with normal tissue architecture, so this is a quantitative excess of
          ordinary bone rather than dysplastic tissue, and biochemical markers are normal. The mouse counterpart,
          osteoblast-restricted overexpression of the equivalent allele, produces a drastic increase in
          cortical thickness by the same endosteal route.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: calvarial osteoblast
          description: 'Retained as the cell type the human disease acts on, but not as the only one:
            the mouse driver is lineage-wide rather than calvaria-restricted, and calvarial osteoblasts
            from those animals showed no marker differences.'
          term:
            id: CL:2000058
            label: calvarial osteoblast
        biological_processes:
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: INCREASED
        - preferred_term: osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
      selected_evidence:
        snippet: Conditional knock-in mice overexpressing L438R Zip14 in osteoblasts have a severe skeletal
          phenotype marked by a drastic increase in cortical thickness due to an enhanced endosteal bone
          formation, resembling the underlying pathology in HCI patients.
        supports: SUPPORT
