          the progression of cranial nerves from formation to mature structure, which is a developmental
          process. In this disease the nerves develop normally and are mechanically compressed in the
          second decade, so annotating development would assert a neurodevelopmental disorder that this
          is not. The node is anchored by its HP-bound phenotypes and by the cranium location on its parent
          node instead.'
      selected_evidence:
