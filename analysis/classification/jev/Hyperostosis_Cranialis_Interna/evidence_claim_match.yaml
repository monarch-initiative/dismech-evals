      assertion_type: Genetic
      assertion:
        name: SLC39A14
        gene_term:
          preferred_term: SLC39A14
          term:
            id: hgnc:20858
            label: SLC39A14
        association: CAUSATIVE
        variant_origin: GERMLINE
        features: 'A dominant L441R missense substitution, found by whole-exome sequencing. The gene lies
          within the 8p21 interval to which the disease had earlier been mapped by linkage, and the three
          candidate genes examined at that time, BMP1, LOXL2 and ADAM28, were excluded by sequencing.
          That earlier work correctly predicted the answer would be a gene not previously implicated in
          sclerosing bone dysplasia.

          The variant is reported as NM_001128431.4:c.1322T>G, p.Leu441Arg, in exon 8, and appears in
          ClinVar as VCV000523143 classified Pathogenic. That record''s review status is no assertion
          criteria provided, which is the honest weak point in an otherwise strong gene-disease case and
          is recorded here rather than left for a reader to discover.'
      selected_evidence:
        snippet: Here we identified by whole-exome sequencing a dominant mutation (L441R) in SLC39A14
          (ZIP14).
        supports: SUPPORT
