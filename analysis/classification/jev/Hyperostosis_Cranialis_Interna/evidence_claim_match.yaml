          this is how the disease presents. Symptoms typically begin in the second decade and progress,
          with facial and vestibulocochlear dysfunction reported most often. Because the compression is
          mechanical and progressive, the therapeutic logic is decompression before the nerve is lost
          rather than treatment of the bone.
