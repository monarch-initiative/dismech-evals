        description: A dominant missense substitution, L441R, in SLC39A14, identified by whole-exome sequencing.
          The gene encodes ZIP14, a zinc transporter that normally sits in the plasma membrane. The lesion
          is not loss of the transporter as such but loss of its correct location.
        gene:
          preferred_term: SLC39A14
          description: Encodes the ZIP14 zinc transporter; a dominant L441R substitution causes hyperostosis
            cranialis interna.
          term:
            id: hgnc:20858
            label: SLC39A14
        genetic_context:
          gene:
            preferred_term: SLC39A14
