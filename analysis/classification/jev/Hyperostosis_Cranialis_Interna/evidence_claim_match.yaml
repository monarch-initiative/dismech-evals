        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which features of the described phenotype belong to the disease and which belong to the
          kindred it was described in?
        attaches_to:
        - phenotypes#
        - prevalence#Three related Dutch families
        rationale: Essentially the whole clinical description rests on three related Dutch families with
          common progenitors. Everything an entry can say about which nerves are affected, in what order,
          at what age and how severely is therefore conditioned on one genetic background and one allele.
          No frequency band is asserted anywhere in this entry for that reason. Independent kindreds with
          different SLC39A14 alleles would be needed to separate disease from family, and until then the
          natural history recorded here should be read as the history of that pedigree.
      selected_evidence:
        snippet: Until today the disease has been described in only three related Dutch families with
          common progenitors
        supports: SUPPORT
