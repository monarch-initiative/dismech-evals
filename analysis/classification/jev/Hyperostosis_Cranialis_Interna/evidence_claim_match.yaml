        name: Molecular Confirmation of SLC39A14
        description: Identifying the SLC39A14 variant confirms the diagnosis and, more usefully, identifies
          at-risk relatives before symptoms appear. That matters here more than in most sclerosing dysplasias,
          because the management recommendation is to decompress accessible nerves in the presymptomatic
          period in high-risk individuals, which requires knowing who they are.
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: Biochemical testing does not contribute. Bone turnover parameters are normal in patients,
          so there is no laboratory signature to screen on and the diagnosis rests on imaging plus genotype.
      selected_evidence:
        snippet: Here we identified by whole-exome sequencing a dominant mutation (L441R) in SLC39A14
          (ZIP14).
