  c75dc1cdeca22fbc305318c3eba3e3802ef207c36ee3847fd3771a35fb4e8d82:
    claim:
      about:
        disease:
          name: Hyperostosis Cranialis Interna
          disease_term:
            preferred_term: hyperostosis cranialis interna
            term:
              id: MONDO:0007765
              label: hyperostosis cranialis interna
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hci_murine_calvarial_sparing
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why are murine calvariae spared by a lesion that produces calvarial hyperostosis in patients?
        attaches_to:
        - pathophysiology#Calvarial and Skull Base Hyperostosis
        - animal_models#Osteoblast-conditional L438R Zip14 knock-in mouse
        rationale: 'Cranial confinement is the defining feature of this disease and the one thing that
          separates it from every other sclerosing bone dysplasia. The mouse reproduces the cellular mechanism
          convincingly, cortical thickening by enhanced endosteal formation in osteoblasts, but it does
          so in the long bones and not in the skull. The mice develop no calvarial phenotype at all, with
          calvarial thickness and porosity indistinguishable from controls, while the long bones carry
          the thickened cortex and an osteoporotic trabecular compartment. The same sparing appears in
          the plain null, so the question is not why the human disease is confined to the skull but why
          murine calvariae appear protected from a zinc-handling lesion affecting every other bone in
          the same animal. The authors pose exactly that and leave it open.

          So the model explains how the bone forms and not where. Candidate explanations are untested:
          regional differences in ZIP14 expression or zinc handling between neural-crest-derived cranial
          osteoblasts and mesoderm-derived axial ones; a species-specific calvarial protective mechanism;
          or an artefact of overexpression, since the construct is not at endogenous dose. Distinguishing
          them would need an endogenous-dose knock-in and comparison of cranial against long-bone osteoblasts
          from the same animal.'
      selected_evidence:
        snippet: Remarkably, L438R Zip14 also generates an osteoporotic trabecular bone phenotype.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
