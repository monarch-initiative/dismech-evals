          gene symbol could carry the chelation therapy across the boundary. It does not transfer: that
          treatment addresses manganese overload from a recessive transport failure, whereas the lesion
          here is a dominant mistrafficking allele causing intracellular zinc accumulation, and no chelation
          evidence exists for it.'
      selected_evidence:
