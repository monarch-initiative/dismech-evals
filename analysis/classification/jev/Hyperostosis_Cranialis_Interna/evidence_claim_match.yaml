  fa032a32147cea2a98af1a28d8d01a1417a359186fef80ef4588fef515d7fc55:
    claim:
      about:
        disease:
          name: Hyperostosis Cranialis Interna
          disease_term:
            preferred_term: hyperostosis cranialis interna
            term:
              id: MONDO:0007765
              label: hyperostosis cranialis interna
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cranial Computed Tomography
        description: 'The diagnostic test. Computed tomography shows thickening concentrated in the inner
          table across frontal, parietal, temporal and occipital regions, and measures the neuroforamina
          whose narrowing produces the symptoms. It also shows the feature that distinguishes this bone
          from ordinary hyperostosis: the deposited tissue is less attenuated than normal cortical bone.
          Because the disease is progressive and decompression is advised before deficits are established,
          imaging has a surveillance role in at-risk relatives and not only a diagnostic one.'
        diagnosis_term:
          preferred_term: Computed Tomography
          term:
            id: NCIT:C17204
            label: Computed Tomography
        results: Thickening of the inner table of the calvaria and skull base with reduced attenuation
          relative to normal cortical bone, and narrowing of the neuroforamina, in a skeleton that is
          otherwise normal.
        notes: 'Skeletal survey is worth stating as a negative: the rest of the skeleton is normal, and
          that normality is what separates this disease from van Buchem disease, sclerosteosis, craniometaphyseal
          dysplasia and Camurati-Engelmann disease, all of which involve the long bones.'
      selected_evidence:
        snippet: Linear measurements were performed of the inner table, the medulla, and the outer table
          of different skull locations, and attenuation (density) measurements of the same regions were
          recorded. Neuroforamina widths were recorded as well.
        supports: SUPPORT
