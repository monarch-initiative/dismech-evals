              label: SLC39A14
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
          description: 'Heterozygous missense substitution acting dominantly. The functional category
            is left UNKNOWN deliberately: the allele causes mistrafficking and intracellular zinc accumulation
            with downstream signalling hyperactivation, which is neither simple loss of transporter function
            nor a clean gain, and no source classifies it.'
      selected_evidence:
        snippet: Here we identified by whole-exome sequencing a dominant mutation (L441R) in SLC39A14
          (ZIP14).
        supports: SUPPORT
