              term:
                id: MONDO:0100252
                label: tumoral calcinosis, hyperphosphatemic, familial, 1
            description: The most frequently reported molecular subtype. Biallelic GALNT3 variants abolish
              GalNAc-T3-dependent O-glycosylation of FGF23, so the intact hormone is cleaved and inactivated.
              Serum intact FGF23 is low with markedly elevated C-terminal fragments. Both the tumoral-calcinosis
              and the hyperostosis-hyperphosphatemia presentations arise from this subtype, including
              from the same allele.
            genes:
            - preferred_term: GALNT3
              term:
                id: hgnc:4125
                label: GALNT3
          role: subtype
      assertion_type: Genetic
      assertion:
        name: Biallelic GALNT3 Pathogenic Variants
        subtype: HFTC1
        gene_term:
          preferred_term: GALNT3
          term:
            id: hgnc:4125
            label: GALNT3
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Reported alleles include splice-site, nonsense, frameshift and missense variants; the
          c.1524+1G>A splice allele is a Middle Eastern founder mutation shared by HFTC and HHS families
          on a common haplotype. Heterozygous parents are unaffected. Genotype does not predict clinical
          severity: four novel homozygous GALNT3 alleles all produced hyperphosphatemia with low intact
          FGF23, but massive calcification, cortical hyperostosis and dental anomalies were each present
          in only some patients.'
      selected_evidence:
        snippet: Sequence analysis of GALNT3 identified biallelic deleterious mutations in all individuals
          with FTC, suggesting that defective post-translational modification underlies the disease.
        supports: SUPPORT
