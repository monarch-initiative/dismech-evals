        description: The calcific deposits sit in a background of chronic inflammation with numerous foamy
          macrophages; earlier reports also describe multinucleated giant cells. The macrophage-rich reaction
          is the histological basis for treating perilesional inflammation as part of the mechanism and
          for the IL-1 antagonist response seen in two subjects.
        finding_term:
          preferred_term: chronic inflammatory infiltrate with foamy macrophages
          term:
            id: NCIT:C35980
            label: Chronic Inflammatory Infiltrate
        frequency: VERY_FREQUENT
        diagnostic: false
        context: Resection or biopsy specimens of tumoral calcinosis lesions.
        notes: 'NCIT:C182619 Foamy Cell Proliferation (defined as the presence of xanthomatous cells)
          was considered and not bound: the source describes the cells as foamy macrophages within a chronic
          inflammatory background rather than as a xanthomatous proliferation, so the inflammatory-infiltrate
          term is the accurate binding and the macrophage detail is carried in preferred_term. NCIT:C3044
          Fibrosis was not bound either: the deep-research report asserts surrounding fibrosis, but no
          cached source describes fibrosis around the calcific deposits (the only fibroblastic stroma
          reported is in the hyperostotic bone lesion, recorded separately below).'
      selected_evidence:
        snippet: Histologic analyses showed ectopic calcification in a background of chronic inflammation
          with multiple foamy macrophages.
        supports: SUPPORT
