      assertion:
        name: Dietary Phosphate Restriction
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        description: A low-phosphate diet is the first and least invasive way to lower the substrate for
          ectopic mineralization. The NIH cohort targeted 400-900 mg of phosphorus per day according to
          age, with nutritional counselling for every subject, because a restriction severe enough to
          move serum phosphate is also severe enough to compromise nutrition in a growing child. Calcium
          salts should not be used as binders and excessive dietary calcium and vitamin D should be avoided,
          since both add to the calcium-phosphate product the treatment is trying to lower.
        treatment_term:
          preferred_term: Dietary Intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
      selected_evidence:
