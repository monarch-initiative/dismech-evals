  4ef41ab66e8ad05e53d831dc7a5760a96faf3f93cea7ed9cce9ae3778ba31d8b:
    claim:
      about:
        disease:
          name: Hyperphosphatemic Familial Tumoral Calcinosis
          disease_term:
            preferred_term: Hyperphosphatemic Familial Tumoral Calcinosis
            term:
              id: MONDO:0100251
              label: familial hyperphosphatemic tumoral calcinosis/hyperphosphatemic hyperostosis syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Intact and C-Terminal FGF23 Assays
        description: Both FGF23 assays are needed, because the pattern, not a single value, identifies
          the subtype. In GALNT3- and FGF23-related disease the intact hormone is low or inappropriately
          normal while C-terminal fragments are markedly elevated, the signature of a hormone that is
          made but cleaved. In KL-related disease intact and C-terminal FGF23 are both very high, because
          the hormone is intact but the kidney cannot respond to it.
        diagnosis_term:
          preferred_term: intact and C-terminal FGF23 measurement
          term:
            id: NCIT:C96650
            label: Fibroblast Growth Factor 23 Measurement
        markers: intact FGF23 (iFGF23); C-terminal FGF23 (cFGF23)
        results: GALNT3/FGF23 disease - low or inappropriately normal iFGF23 with markedly elevated cFGF23;
          KL disease - both iFGF23 and cFGF23 markedly elevated.
        notes: NCIT has child terms for each assay, NCIT:C135420 Intact Fibroblast Growth Factor 23 Measurement
          and NCIT:C135419 C-Terminal Fibroblast Growth Factor 23 Measurement (both reachable from NCIT:C25218;
          found with `runoak -i ols:ncit search "fibroblast growth factor 23 measurement"`). The parent
          term is bound because the diagnostic reading is the paired result, and markers names both assays.
      selected_evidence:
        snippet: our patient had appropriately elevated intact (functional) and C-terminal FGF23 levels
        supports: SUPPORT
