        discussion_id: gap_hftc_autoantibody_phenocopy
        prompt: When a patient has the full biochemical picture of HFTC but no biallelic GALNT3, FGF23
          or KL genotype, how should the entry be scoped?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
        - disease#Hyperphosphatemic Familial Tumoral Calcinosis
        rationale: 'One of eight NIH-cohort subjects had no causative mutation found, and an acquired
          anti-FGF23 autoantibody phenocopy is recognised. That phenocopy is not modelled in this entry:
          it reaches the same endocrine node by an autoimmune route, so it is mechanistically a different
          disease that happens to share a downstream chain from the FGF23-deficiency node onward. Whether
          dismech should carry it as a separate acquired entry conforming to the same downstream nodes,
          or as a differential note only, is unresolved here.'
      selected_evidence:
        snippet: GALNT3 mutations were identified in seven subjects; no causative mutation was found in
          the eighth.
        supports: SUPPORT
