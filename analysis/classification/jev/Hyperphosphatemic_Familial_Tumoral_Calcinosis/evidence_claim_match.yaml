      assertion:
        discussion_id: gap_hftc_hyperostosis_mechanism
        prompt: What links the hyperphosphatemic state to diaphyseal cortical hyperostosis and its episodic
          inflammatory attacks?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Diaphyseal Cortical Hyperostosis
        - phenotypes#Painful Diaphyseal Hyperostosis
        rationale: Allelic identity with the calcinosis presentation establishes that hyperostosis belongs
          to the same disease and follows the same phosphate excess, but the step from systemic phosphate
          to periosteal apposition in a particular long bone, at a particular time, is unaccounted for.
          The attacks are episodic while the biochemistry is constant, so something other than the phosphate
          level is timing them. This is the reason the lesion is repeatedly treated as osteomyelitis.
      selected_evidence:
        snippet: tumoral calcinosis and hyperostosis-hyperphosphatemia syndrome represent a continuous
          spectrum of the same disease caused by increased phosphate levels, rather than two distinct
          disorders
        supports: SUPPORT
