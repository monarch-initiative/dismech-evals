        context: []
      assertion_type: AnimalModel
      assertion:
        name: Fgf23-null mouse
        species: Mus musculus
        genotype: Fgf23 knockout (homozygous null)
        background: Mouse
        category: Genetically engineered
        publication: PMID:14966565
        description: 'Total ablation of the hormone rather than of its protection. The Fgf23-null mouse
          is the cleanest demonstration that the human renal phenotype follows from absent FGF23 action:
          high serum phosphate with increased renal reabsorption, and elevated 1,25-dihydroxyvitamin D
          driven by enhanced renal 1-alpha-hydroxylase expression. It is a more severe systemic state
          than human HFTC, with severe growth retardation and a markedly short lifespan.'
        modeled_mechanisms:
        - target: Increased Proximal Tubular Sodium-Phosphate Cotransport
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: Complete loss of FGF23 produces exactly the renal phosphate-conserving state the
            node asserts.
          limitations: Complete hormone absence is more extreme than the partial deficiency of human GALNT3-
            or FGF23-related disease, so the model overstates the degree of signalling loss.
          readouts:
          - name: Serum phosphate and renal phosphate reabsorption
            target: Increased Proximal Tubular Sodium-Phosphate Cotransport
            direction: INCREASED
            interpretation: The physiological readout of unopposed tubular phosphate reclamation.
        - target: Unsuppressed Renal Calcitriol Production
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: 'The knockout supplies the mechanistic step the human data can only infer: the
            calcitriol elevation is attributable to increased renal 1-alpha-hydroxylase expression.'
          limitations: In humans calcitriol is often only inappropriately normal rather than frankly elevated,
            so the model shows a stronger version of the human abnormality.
          readouts:
          - name: Renal 25-hydroxyvitamin D-1alpha-hydroxylase expression
            target: Unsuppressed Renal Calcitriol Production
            direction: INCREASED
            interpretation: The enzymatic cause of the calcitriol elevation, measured directly.
        notes: 'The same knockout is also the reference model for the opposite disease: FGF23 excess causes
          X-linked hypophosphatemia, and the null mouse''s hyperphosphatemic, hypercalcitriolemic state
          is what establishes the direction of the axis in both.'
      selected_evidence:
        snippet: Disruption of the Fgf23 gene did not result in embryonic lethality, although homozygous
          mice showed severe growth retardation with abnormal bone phenotype and markedly short life span.
        supports: SUPPORT
    origin:
