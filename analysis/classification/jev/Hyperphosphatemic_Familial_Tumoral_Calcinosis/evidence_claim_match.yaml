      assertion_type: Discussion
      assertion:
        discussion_id: gap_hftc_site_selection
        prompt: Why does mineral deposit at specific periarticular sites and in specific organs when the
          driving abnormality - an elevated calcium-phosphate product - is systemic?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hyperphosphatemia with Elevated Calcium-Phosphate Product
        - pathophysiology#Ectopic Calcium-Phosphate Deposition in Periarticular Soft Tissue
        rationale: 'Repetitive trauma and pressure are cited as the site determinant, but that is a clinical
          observation rather than a demonstrated mechanism, and it does not explain the dental pulp, the
          testis or the retina. Nor does it explain why some patients with the same genotype and the same
          phosphate level never form a mass. Identifying a local permissive factor would matter clinically:
          it is the difference between "lower the phosphate and hope" and a target that acts where the
          deposits form.'
      selected_evidence:
        snippet: Ectopic calcifications (tumoral calcinosis) typically found in periarticular soft tissues
          exposed to repetitive trauma or prolonged pressure
        supports: SUPPORT
