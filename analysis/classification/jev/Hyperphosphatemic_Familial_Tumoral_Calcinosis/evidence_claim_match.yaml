        prompt: Would restoring intact FGF23 signalling correct the disease, and can early phosphate control
          prevent lesions from ever forming?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of FGF23-Klotho-FGFR1c Signaling in the Renal Proximal Tubule
        - treatments#Dietary Phosphate Restriction
        - treatments#Phosphaturic Therapy with Acetazolamide or Probenecid
        rationale: 'Every available treatment acts downstream of the lesion, on the phosphate load rather
          than on the missing signal, and none has been tested in a randomised trial. The two questions
          are linked: because no therapy restores the hormone, the only preventive strategy is phosphate
          control in the presymptomatic biochemical phase, and nobody has shown prospectively that it
          stops lesions forming. The acetazolamide case in which tumour formation ceased with no change
          in serum phosphate or TRP is a direct warning that the assumed mechanism of current therapy
          may not be the operative one.'
