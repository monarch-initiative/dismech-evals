          term:
            id: MONDO:0060715
            label: tumoral calcinosis, hyperphosphatemic, familial, 3
        description: The rarest subtype, established by a single homozygous KL missense variant (p.His193Arg)
          that destabilises the KL1 glycosidase domain and reduces expression and secretion of alpha-Klotho.
          Because the defect is in the co-receptor rather than the hormone, intact FGF23 is high rather
          than low, and the kidney is resistant to it; this is the one subtype in which the diagnostic
          intact-versus-C-terminal FGF23 pattern is inverted.
        genes:
        - preferred_term: KL
          term:
            id: hgnc:6344
            label: KL
      selected_evidence:
        snippet: Herein we report a homozygous missense mutation (H193R) in the KLOTHO (KL) gene of a
          13-year-old girl who presented with severe tumoral calcinosis with dural and carotid artery
          calcifications.
        supports: SUPPORT
