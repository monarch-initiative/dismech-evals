      assertion:
        phase: Biochemical disease before clinical lesions
        notes: Hyperphosphatemia with increased tubular reabsorption is present before calcific masses
          appear and can be the only abnormality for years. Two siblings in the NIH cohort had the full
          biochemical phenotype without physical calcinosis at enrolment. This is the window in which
          phosphate control is most plausibly preventive, though that has never been tested prospectively.
      selected_evidence:
        snippet: Clinical manifestations varied, even within families, ranging from asymptomatic to large,
          disabling calcifications.
        supports: SUPPORT
