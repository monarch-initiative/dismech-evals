          preferred_term: FGF23
          term:
            id: hgnc:3680
            label: FGF23
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Disease alleles are missense variants that prevent secretion of the intact hormone, including
          p.Ser71Gly (Golgi retention with selective secretion of the C-terminal fragment) and p.Gly123Trp.
          The same gene causes autosomal dominant hypophosphatemic rickets through gain-of-function alleles
          that resist cleavage, so the direction of the variant's effect - not the gene - determines which
          phosphate phenotype appears.
      selected_evidence:
        snippet: We investigated an individual with FTC who was negative for GALNT3 mutations. Sequencing
          revealed a homozygous missense mutation in the FGF23 gene (p.S71G)
