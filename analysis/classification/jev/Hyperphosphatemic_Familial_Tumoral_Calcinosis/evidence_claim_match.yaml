        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_hftc_galnt3_mouse_no_calcinosis
        prompt: Why does the Galnt3-null mouse reproduce the human biochemistry but form no calcific masses,
          and what does the missing step mean for testing therapies whose endpoint is lesion burden?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Ectopic Calcium-Phosphate Deposition in Periarticular Soft Tissue
        - animal_models#Mus musculus
        rationale: The model at issue is specifically the Galnt3-null mouse (the entry's "Galnt3-null
          mouse" animal model); the Fgf23-null and Klotho-deficient mice listed beside it are not the
          subject of this mismatch. The mismatch is informative rather than merely inconvenient. The Galnt3-null
          mouse has the hormone deficiency, the transporter change, the hyperphosphatemia and the inappropriate
          calcitriol, and still does not calcify - so those four things are not jointly sufficient for
          the lesion, and something present in humans and absent in this mouse is required. Practically,
          it means no current genetic model supports a preclinical efficacy endpoint of lesion regression,
          which is the outcome patients care about most.
      selected_evidence:
        snippet: In this study we generated mice lacking the Galnt3 gene, which developed hyperphosphatemia
          without apparent calcifications.
        supports: SUPPORT
