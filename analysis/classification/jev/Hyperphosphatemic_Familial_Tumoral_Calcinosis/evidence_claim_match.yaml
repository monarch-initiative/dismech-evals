            description: Biallelic FGF23 missense variants (reported alleles include p.Ser71Gly, p.Met96Thr,
              p.Gly123Trp and p.Ser129Phe) destabilise the intact hormone or trap it intracellularly,
              so only C-terminal fragments reach the circulation. The biochemical signature is the same
              as HFTC1 - low intact FGF23 with high C-terminal FGF23 - because both subtypes converge
              on failure to deliver intact hormone.
            genes:
            - preferred_term: FGF23
              term:
                id: hgnc:3680
                label: FGF23
          role: subtype
      assertion_type: Genetic
      assertion:
        name: Biallelic FGF23 Pathogenic Variants
        subtype: HFTC2
