        publication: PMID:9363890
        description: The mouse that named the gene behind HFTC3. Defective klotho expression produces
          a systemic syndrome resembling premature ageing - short lifespan, infertility, arteriosclerosis,
          skin atrophy, osteoporosis and emphysema - and identified klotho as a membrane protein with
          beta-glucosidase homology. It carries the molecular lesion of the human resistance subtype,
          but the original description characterises an ageing phenotype rather than an FGF23-resistance
          phenotype, so its use for this disease rests on later work not cited here.
        modeled_mechanisms:
        - target: Biallelic KL Loss of Function and Renal FGF23 Resistance
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: The model carries the same genetic lesion as HFTC3 - loss of functional alpha-Klotho
            - and so reproduces the upstream cause of FGF23 resistance.
          limitations: The cited description reports a multi-system premature-ageing syndrome, not the
            mineral phenotype, so the mineral-handling correspondence to human HFTC3 is not established
            by this source. The human disease is caused by a missense allele with reduced but not absent
            alpha-Klotho, and human patients do not have a progeroid syndrome; arteriosclerosis in the
            mouse is not the same lesion as periarticular tumoral calcinosis. The model should not be
            used to argue that HFTC3 patients are at risk of accelerated ageing.
      selected_evidence:
        snippet: The gene encodes a membrane protein that shares sequence similarity with the beta-glucosidase
          enzymes.
        supports: SUPPORT
