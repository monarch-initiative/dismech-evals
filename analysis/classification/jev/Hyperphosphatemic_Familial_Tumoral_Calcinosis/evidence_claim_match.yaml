        prevalence_class: ULTRA_RARE
        notes: 'No population prevalence, incidence or carrier frequency has been estimated for HFTC.
          The available denominator is the published case literature: a 2024 systematic review that applied
          strict inclusion criteria (baseline phosphate measured, treatment recorded, follow-up available)
          found 43 eligible studies describing 63 individuals. That is a lower bound on reported cases,
          not a population rate, because it excludes reports lacking treatment or follow-up data. The
          disease is reported worldwide but is enriched in consanguineous Middle Eastern and African families,
          consistent with the documented Middle Eastern GALNT3 founder allele.'
