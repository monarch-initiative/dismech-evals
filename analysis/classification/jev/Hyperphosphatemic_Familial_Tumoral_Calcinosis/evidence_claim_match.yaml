              label: familial hyperphosphatemic tumoral calcinosis/hyperphosphatemic hyperostosis syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: HFTC2
        display_name: HFTC2 (FGF23-related)
        subtype_term:
          preferred_term: tumoral calcinosis, hyperphosphatemic, familial, 2
          term:
            id: MONDO:0060714
            label: tumoral calcinosis, hyperphosphatemic, familial, 2
        description: Biallelic FGF23 missense variants (reported alleles include p.Ser71Gly, p.Met96Thr,
          p.Gly123Trp and p.Ser129Phe) destabilise the intact hormone or trap it intracellularly, so only
          C-terminal fragments reach the circulation. The biochemical signature is the same as HFTC1 -
          low intact FGF23 with high C-terminal FGF23 - because both subtypes converge on failure to deliver
          intact hormone.
        genes:
        - preferred_term: FGF23
          term:
            id: hgnc:3680
            label: FGF23
      selected_evidence:
        snippet: Sequencing revealed a homozygous missense mutation in the FGF23 gene (p.S71G) at an amino
          acid position which is conserved from fish to man.
        supports: SUPPORT
