            term:
              id: MONDO:0100251
              label: familial hyperphosphatemic tumoral calcinosis/hyperphosphatemic hyperostosis syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Renal Tubular Phosphate Reabsorption
        description: Paired serum and urine phosphate and creatinine give the tubular reabsorption of
          phosphate (TRP), or its derived index TmP/GFR. In HFTC the kidney conserves phosphate despite
          hyperphosphatemia and normal renal function, so TRP is inappropriately high rather than suppressed.
          This is the finding that separates FGF23 deficiency or resistance from a phosphate load or renal
          failure.
        diagnosis_term:
          preferred_term: tubular reabsorption of phosphate (TRP)
          term:
            id: NCIT:C64857
            label: Phosphate Measurement
        presence: Inappropriately elevated
        results: TRP above the normal range (96 % in one reported patient) despite hyperphosphatemia.
        notes: 'NCIT has no term for the tubular reabsorption of phosphate or TmP/GFR. Queries run: `runoak
          -i ols:ncit search "tubular reabsorption of phosphate"`, `runoak -i ols:ncit search "phosphate
          reabsorption"` and `runoak -i ols:ncit search "urine phosphate measurement"` each returned nothing
          relevant (`search "tubular"` returned only histology terms such as NCIT:C14169). The index is
          therefore bound to the phosphate measurement it is computed from, with the index carried in
          preferred_term. TmP/GFR is named in the description because it is the standard derived form;
          no cached source reports a TmP/GFR value for this disease.'
      selected_evidence:
        snippet: hyperphosphatemia in the setting of inappropriately increased renal tubular reabsorption
          of phosphorus (TRP)
        supports: SUPPORT
