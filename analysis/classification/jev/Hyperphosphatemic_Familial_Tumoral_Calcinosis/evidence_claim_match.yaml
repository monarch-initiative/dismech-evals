      assertion:
        name: Biallelic KL Loss of Function and Renal FGF23 Resistance
        biological_scale: MOLECULAR
        description: In HFTC3 the hormone is intact but its obligate co-receptor is not. The p.His193Arg
          substitution sits at the base of the KL1 catalytic cleft and destabilises the domain, so expression
          and secretion of alpha-Klotho are markedly reduced and FGF23 cannot signal through its cognate
          receptors. Intact FGF23 therefore rises rather than falls, and this node bypasses the hormone-deficiency
          node to reach the same signalling failure.
        genetic_context:
          gene:
            preferred_term: KL
            term:
              id: hgnc:6344
              label: KL
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: A homozygous KL missense allele reducing alpha-Klotho co-receptor availability.
        genes:
        - preferred_term: KL
          term:
            id: hgnc:6344
            label: KL
      selected_evidence:
        snippet: our findings provide what we believe to be the first evidence that loss-of-function mutations
          in human KL impair FGF23 bioactivity, underscoring the essential role of KL in FGF23-mediated
          phosphate and vitamin D homeostasis in humans
        supports: SUPPORT
