          to all but one subject in the NIH cohort. Calcium-containing binders are avoided because they
          supply the other half of the precipitating product. Aluminium hydroxide is an effective second
          binder and was added in two subjects whose phosphate did not move on sevelamer plus phosphaturic
          agents, but it carries aluminium-toxicity risk and is not a long-term default. In one reported
          family, sevelamer combined with acetazolamide lowered serum phosphate and shrank an ulcerating
          elbow mass.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
