          D
        results: Normal calcium, creatinine, alkaline phosphatase and PTH; elevated or inappropriately
          normal 1,25-dihydroxyvitamin D.
        notes: 'Bound as one Laboratory Procedure because the sources order these analytes together as
          a single evaluation. NCIT carries per-analyte terms that are each reachable from NCIT:C25218
          and could replace this binding if the panel is ever split: NCIT:C61020 Serum Calcium Measurement,
          NCIT:C64547 Creatinine Measurement, NCIT:C64432 Alkaline Phosphatase Measurement, NCIT:C74789
          Intact Parathyroid Hormone Measurement and NCIT:C84818 Vitamin D Measurement (all verified with
          `runoak -i ols:ncit info`).'
      selected_evidence:
        snippet: Other biochemical evaluation included normal serum and urine calcium, alkaline phosphatase,
