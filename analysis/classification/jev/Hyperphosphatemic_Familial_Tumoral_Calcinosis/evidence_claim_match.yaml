        name: Heterotopic Ossification with Mature Lamellar Bone
        description: In one of four biopsied NIH-cohort subjects, mature heterotopic bone with lamellar
          remodelling and reversal lines was present within a tumoral calcinosis lesion, adjacent to the
          inflamed deposit. Older literature describes woven bone in these lesions, but remodelled lamellar
          bone had not been reported before.
        finding_term:
          preferred_term: heterotopic ossification with lamellar remodelling and reversal lines
          term:
            id: NCIT:C35988
            label: Metaplastic Bone Formation
        frequency: VERY_RARE
        diagnostic: false
        context: Resected tumoral calcinosis lesion from one NIH-cohort subject (FTC4).
        notes: NCIT:C35988 is defined as the presence of newly formed heterotopic bone, which matches
          the source. NCIT:C35859 Osseous Metaplasia (heterotopic formation of normal bone within soft
          tissue) and NCIT:C53954 New Bone Formation are sibling candidates in the same Morphologic Finding
          branch; the first was not chosen because it asserts normal bone, and the second is used below
          for the reactive woven bone of hyperostosis.
      selected_evidence:
        snippet: In addition to the calcification, heterotopic ossification was evident
        supports: SUPPORT
