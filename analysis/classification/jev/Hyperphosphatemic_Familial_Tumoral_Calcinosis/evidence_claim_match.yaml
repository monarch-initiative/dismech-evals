  91f60de069962ddb91a10d6bedc2a49b913a3bfcb4335e5090b244ba456f828a:
    claim:
      about:
        disease:
          name: Hyperphosphatemic Familial Tumoral Calcinosis
          disease_term:
            preferred_term: Hyperphosphatemic Familial Tumoral Calcinosis
            term:
              id: MONDO:0100251
              label: familial hyperphosphatemic tumoral calcinosis/hyperphosphatemic hyperostosis syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Phosphaturic Therapy with Acetazolamide or Probenecid
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: 'The complementary strategy to binding: increase renal phosphate excretion. Acetazolamide,
          a carbonic anhydrase inhibitor, induces bicarbonaturia and mild metabolic acidosis; probenecid
          promotes phosphaturia but interacts with several antibiotics. Responses are inconsistent, and
          in one well-documented boy acetazolamide stopped new tumour formation and abolished bone pain
          with no measurable change in serum phosphate or TRP at all - which suggests the benefit ran
          through mineral solubility rather than through phosphate lowering. Nicotinamide was tried in
          two NIH subjects for its phosphaturic effect and did not add benefit.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: acetazolamide
            term:
              id: NCIT:C28809
              label: Acetazolamide
          - preferred_term: probenecid
            term:
              id: NCIT:C772
              label: Probenecid
          - preferred_term: nicotinamide
            term:
              id: NCIT:C2327
              label: Niacinamide
      selected_evidence:
        snippet: We conclude that acetazolamide can control severe HFTC by inducing mild metabolic acidosis
          despite no change in serum phosphate or TRP.
