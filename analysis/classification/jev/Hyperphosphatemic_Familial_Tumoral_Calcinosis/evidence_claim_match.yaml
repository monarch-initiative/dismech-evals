        context: []
      assertion_type: AnimalModel
      assertion:
        name: Galnt3-null mouse
        species: Mus musculus
        genotype: Galnt3 knockout (homozygous null)
        background: Mouse
        category: Genetically engineered
        publication: PMID:19213845
        description: 'The genetic model of the commonest human subtype. Galnt3-deficient mice reproduce
          the defining endocrine lesion faithfully - circulating intact Fgf23 is about half that of littermates
          with increased C-terminal fragments, despite increased Fgf23 expression in bone - and reproduce
          the renal consequences, with elevated sodium-phosphate cotransporter expression, hyperphosphatemia
          and an inappropriately normal 1,25-dihydroxyvitamin D. What they do not reproduce is the lesion
          the human disease is named for: they develop no apparent calcifications.'
        modeled_mechanisms:
        - target: Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: 'The model reproduces the exact dissociation seen in patients: low intact hormone
            with excess C-terminal fragments on a background of increased Fgf23 transcription.'
          limitations: Circulating intact Fgf23 was roughly halved rather than abolished, so the model
            is a partial-deficiency state; C-terminal fragments were measured in bone rather than only
            in circulation.
          readouts:
          - name: Circulating intact Fgf23
            target: Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
            direction: DECREASED
            interpretation: Direct measurement of the hormone deficiency this node describes.
        - target: Increased Proximal Tubular Sodium-Phosphate Cotransport
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Renal sodium-phosphate cotransporter expression is elevated in the knockout, the
            transporter-level change the human node asserts.
          limitations: The finding is transporter expression rather than a measured tubular phosphate
            threshold, so the correspondence to human TmP/GFR is inferred. Renal Kl expression was also
            elevated, a compensatory change with no established human counterpart.
          readouts:
          - name: Renal sodium-phosphate cotransporter expression
            target: Increased Proximal Tubular Sodium-Phosphate Cotransport
            direction: INCREASED
            interpretation: Molecular correlate of the unopposed tubular reabsorption node.
        - target: Ectopic Calcium-Phosphate Deposition in Periarticular Soft Tissue
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: 'The knockout is biochemically a tumoral-calcinosis model but not anatomically
            one: hyperphosphatemia develops without apparent calcifications.'
          limitations: No ectopic calcific masses form, so the model cannot be used to study lesion formation,
            lesion regression, or any therapy whose endpoint is lesion burden. Sex-specific confounds
            (growth retardation, infertility and increased bone mineral density in males only) further
            limit it as a skeletal-phenotype model.
      selected_evidence:
        snippet: Our findings indicate that Galnt3-deficient mice have a biochemical phenotype of tumoral
          calcinosis
        supports: SUPPORT
