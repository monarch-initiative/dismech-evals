        name: Plasma proline with urinary P5C assessment
        description: 'Persistent elevation of plasma proline establishes hyperprolinemia. Urinary P5C
          measurement helps separate HPI from HPII: the downstream ALDH4A1 block in HPII permits P5C accumulation,
          whereas the upstream PRODH block in HPI limits P5C formation. Molecular analysis of PRODH establishes
          the genetic diagnosis and distinguishes isolated HPI from syndromic 22q11.2 deletion.'
        diagnosis_term:
          preferred_term: biochemical diagnostic testing
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        markers: plasma L-proline; urinary 1-pyrroline-5-carboxylate (P5C)
        results: Persistent hyperprolinemia with absent or non-elevated urinary P5C supports HPI; biallelic
          pathogenic PRODH variants provide molecular confirmation.
      selected_evidence:
        snippet: The current study presents diagnostic criteria for HPI and HPII, based on plasma proline
          level, with or without measurements of urinary P5C.
        supports: SUPPORT
