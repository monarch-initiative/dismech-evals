  3563ef48d97b21c62b5f91ec28f99c47d1c765044ea6fe3b2504ccb43f52960b:
    claim:
      about:
        disease:
          name: Hyperprolinemia Type 1
          disease_term:
            preferred_term: hyperprolinemia type 1
            term:
              id: MONDO:0009400
              label: hyperprolinemia type 1
        context: []
      assertion_type: Genetic
      assertion:
        name: PRODH
        gene_term:
          preferred_term: PRODH
          term:
            id: hgnc:9453
            label: PRODH
        relationship_type: CAUSATIVE
        notes: Biallelic pathogenic or functionally severe hypomorphic PRODH variants cause HPI. Missense
          alleles span increased, mild, moderate, and severe effects on enzyme activity, so variant interpretation
          must not infer pathogenicity from gene membership alone.
        variants:
        - name: PRODH p.Thr466Met (T466M)
          description: Homozygous p.Thr466Met has been reported in molecularly confirmed HPI and is the
            allele in the single riboflavin-response report. Functional testing classified T466M among
            alleles with severe loss of POX activity and found responsiveness to high FAD concentrations
            in vitro. Its clinical effect is not treated as uniform because the broader HPI phenotype
            is incompletely penetrant and the 2021 report noted conflicting variant interpretations.
          gene:
            preferred_term: PRODH
            term:
              id: hgnc:9453
              label: PRODH
          type: missense
          functional_effects:
          - function: proline oxidase activity
            description: Severe reduction of POX activity in a functional assay, with variant-specific
              responsiveness to high FAD concentrations in vitro.
            type: reduced function
        - name: PRODH p.Leu441Pro (L441P)
          description: 'p.Leu441Pro is a functionally severe PRODH missense allele reported in HPI and
            schizophrenia cohorts. Assay estimates differ: the 2005 panel placed L441P among alleles with
            greater than 70% activity reduction, whereas a later U87 expression study measured approximately
            half of wild-type specific activity and also found reduced stability. It is therefore retained
            as an assay-dependent reduced-function allele, not a predictor of a specific psychiatric outcome.'
          gene:
            preferred_term: PRODH
            term:
              id: hgnc:9453
              label: PRODH
          type: missense
          functional_effects:
          - function: proline oxidase activity and stability
            description: Reduced catalytic activity with an additional effect on enzyme stability; the
              magnitude varies by experimental system.
            type: reduced function
      selected_evidence:
        snippet: Here, we report the effects of these mutations on POX activity.
        supports: SUPPORT
