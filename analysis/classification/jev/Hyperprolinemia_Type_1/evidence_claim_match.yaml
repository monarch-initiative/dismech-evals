              label: hyperprolinemia type 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hpi_biochemical_trait_clinical_syndrome
        prompt: Does isolated biallelic PRODH deficiency cause a coherent clinical syndrome, or is HPI
          primarily a highly penetrant biochemical trait whose developmental, neurologic, and psychiatric
          manifestations require additional genetic or environmental factors?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: The enzyme defect and hyperprolinemia are well supported, but clinical ascertainment
          is contradictory. Severe biallelic case series report early developmental delay, cognitive impairment,
          autism, and epilepsy, while the clinical review also records a benign phenotype without neurologic
          problems. The systematic review pooled PRODH-HPI, ALDH4A1-HPII, and 22q11.2 deletion cohorts
          and found neither a proline-level/phenotype correlation nor evidence that hyperprolinemia is
          the primary cause of psychiatric disease. Frequency bands are therefore omitted and the neural
          branch is marked HYPOTHETICAL.
        attaches_to:
        - pathophysiology#Systemic Proline Accumulation
        - pathophysiology#Putative Proline-Linked Neural Dysfunction
        - phenotypes#Global developmental delay
        - phenotypes#Intellectual disability
        - phenotypes#Autistic behavior
        - phenotypes#Seizure
        - phenotypes#Atypical behavior
        proposed_experiments:
        - experiment_id: exp_hpi_isolated_genotype_longitudinal_cohort
          name: Genotype-stratified longitudinal study of isolated HPI
          description: Follow individuals with molecularly confirmed biallelic PRODH deficiency separately
            from 22q11.2 deletion and ALDH4A1-related cohorts, with repeated plasma proline measurements
            and standardized developmental, neurologic, and psychiatric assessments. This would test penetrance
            and whether clinical outcomes track genotype, residual enzyme activity, or metabolite level
            in isolated HPI.
      selected_evidence:
        snippet: No evidence for a biochemical phenotype-clinical phenotype correlation was found; that
          is, no association between higher proline levels and specific psychiatric phenotypes was observed.
        supports: SUPPORT
