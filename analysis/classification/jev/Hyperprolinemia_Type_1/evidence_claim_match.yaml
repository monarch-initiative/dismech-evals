      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_hpi_experimental_neural_models
        prompt: Which neural consequences observed in Prodh-mutant mice and PRODH-manipulated U87 cells
          reproduce the biology of isolated human HPI, and which are specific to the model, transformed-cell
          context, or 22q11.2 deletion background?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        rationale: The mouse model demonstrates sensorimotor-gating and regional neurochemical changes,
          while the U87 overexpression system couples proline to glutamate and glutamine. Neither model
          recapitulates the variable human penetrance, and U87 is a transformed glioblastoma line rather
          than a patient neuron. Human psychiatric studies frequently include 22q11.2 deletions and ALDH4A1-HPII,
          so they cannot resolve this translation gap.
        attaches_to:
        - pathophysiology#Putative Proline-Linked Neural Dysfunction
        - experimental_models#Pro/Re Prodh-mutant hyperprolinemic mouse
        - experimental_models#U87 wild-type and L441P PRODH expression system
        proposed_experiments:
        - experiment_id: exp_hpi_cross_model_neural_comparison
          name: Cross-model comparison of PRODH-deficient neural phenotypes
          description: Compare molecularly matched human neuronal models, the Prodh-mutant mouse, and
            the existing transformed-cell observations using shared proline, glutamate, glutamine, and
            neural-function readouts. Include allele-corrected comparators and benchmark each model against
            observations from isolated HPI cohorts to identify which signals translate to human disease.
      selected_evidence:
        snippet: We also isolated the mouse homologue of slgA (Prodh), identified a mutation in this gene
          in the Pro/Re hyperprolinaemic mouse strain and found that these mice have a deficit in sensorimotor
          gating accompanied by regional neurochemical alterations in the brain.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
