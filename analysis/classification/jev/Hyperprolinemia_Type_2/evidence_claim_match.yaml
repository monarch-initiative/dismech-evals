                label: pyridoxal 5'-phosphate
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Seizures and Metabolic Encephalopathy
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Functional vitamin B6 depletion lowers the seizure threshold; the intervening PLP-dependent
          neurotransmitter steps are inferred from general B6 biochemistry rather than measured in HPII
          patients.
      selected_evidence:
        snippet: Vitamin B6 de-activation may contribute to seizures in hyperprolinemia type II, which
