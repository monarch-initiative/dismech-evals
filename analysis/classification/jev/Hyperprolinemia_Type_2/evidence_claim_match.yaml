      - /disease_term
    evidence_metadata:
      reference: PMID:34302426
      reference_title: 'Psychiatric phenotypes associated with hyperprolinemia: A systematic review.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes that no biochemical-clinical phenotype correlation has been demonstrated,
        and specifies what that means: higher proline levels are not associated with specific phenotypes,
        so metabolite burden does not explain the variable presentation. The gap is genuinely open.'
