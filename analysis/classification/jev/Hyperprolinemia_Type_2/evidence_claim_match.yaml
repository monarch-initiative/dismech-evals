      assertion_type: Genetic
      assertion:
        name: ALDH4A1
        gene_term:
          preferred_term: ALDH4A1
          term:
            id: hgnc:406
            label: ALDH4A1
        relationship_type: CAUSATIVE
        notes: Biallelic ALDH4A1 loss-of-function variants cause HPII. The founding survey identified
          two frameshift alleles [A7fs(-1) and G521fs(+1)] and the S352L missense allele as functionally
          null in a yeast complementation assay, while P16L proved to be a benign polymorphism in the
          Spanish population — a useful caution against over-calling ALDH4A1 missense variants. The G521fs(+1)
          allele segregates in the Irish Traveller pedigree that defined the HPII phenotype. Relatively
          few pathogenic variants were known as of 2019, and a nonsense variant in the last exon (predicted
          to escape nonsense-mediated decay) has been proposed as a candidate target for readthrough therapy.
      selected_evidence:
        snippet: We found four mutant alleles, two with frameshift mutations ... and two with missense
          mutations (S352L and P16L).
        supports: SUPPORT
