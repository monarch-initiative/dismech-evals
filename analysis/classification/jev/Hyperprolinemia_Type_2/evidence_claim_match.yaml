        name: Secondary Vitamin B6 Deficiency
        biological_scale: ORGANISM
        description: Ongoing P5C-driven consumption of pyridoxal 5'-phosphate produces a secondary, acquired
          vitamin B6 deficiency that is not explained by diet or medication. Measured serum vitamin B6
          is low in affected patients. Because PLP is the coenzyme for many decarboxylases and transaminases,
          including those of neurotransmitter metabolism, this deficiency is the proposed proximate cause
          of the seizure phenotype; the specific PLP-dependent enzymes limiting in vivo have not been
          established in HPII patients.
        role: amplifier
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        chemical_entities:
        - preferred_term: pyridoxal 5'-phosphate
          term:
            id: CHEBI:18405
            label: pyridoxal 5'-phosphate
          modifier: DECREASED
      selected_evidence:
        snippet: We hypothesized that pyridoxal phosphate (vitamin B6 coenzyme) was de-activated by L-Delta(1)-pyrroline-5-carboxylic
          acid, the major intermediate that accumulates endogenously in hyperprolinemia type II.
        supports: SUPPORT
