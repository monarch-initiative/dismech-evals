              id: MONDO:0009401
              label: hyperprolinemia type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hpii_penetrance_and_phenotype
        prompt: Why do only some individuals with biallelic ALDH4A1 loss-of-function variants develop
          seizures or neurodevelopmental impairment while others remain asymptomatic, and does HPII act
          principally as a threshold-lowering susceptibility factor unmasked by febrile intercurrent illness
          rather than as a fully penetrant epilepsy syndrome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: The clinical spectrum of HPII is described in the literature as unclear, with ascertainment
          dominated by small case reports. The one Japanese case was ascertained during influenza-associated
          encephalopathy, and the reported infantile case decompensated after an upper respiratory infection,
          suggesting a stress-unmasked susceptibility model that has never been tested systematically.
          A systematic review of 35 studies found no correlation between biochemical and clinical phenotype,
          so severity is not predicted by proline level and the modifiers of penetrance remain entirely
          unidentified.
        attaches_to:
        - pathophysiology#Seizures and Metabolic Encephalopathy
        - pathophysiology#Neurodevelopmental and Behavioral Impairment
      selected_evidence:
        snippet: No evidence for a biochemical phenotype-clinical phenotype correlation was found; that
          is, no association between higher proline levels and specific psychiatric phenotypes was observed.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
