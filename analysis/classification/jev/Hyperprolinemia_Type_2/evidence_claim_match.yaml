      - /disease_term
    evidence_metadata:
      reference: PMID:24173411
      reference_title: Long-term clinical outcome, therapy and mild mitochondrial dysfunction in hyperprolinemia.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Partially addresses this gap: clinical course was independent of B6 concentration
        and B6 therapy in the only HPII cohort, arguing against a simple B6-depletion-drives-seizures
        model.'
