      assertion_type: Treatment
      assertion:
        name: High-Dose Pyridoxine (Vitamin B6) Supplementation
        description: Because the proposed pathomechanism is consumption of pyridoxal 5'-phosphate by accumulating
          P5C, replacing the depleted cofactor is the mechanistically targeted intervention. High-dose
          vitamin B6 abolished further seizures in the reported late-onset case, and long-term supplementation
          was proposed as preventive when the P5C-PLP condensation was first characterized. Evidence is
          limited to case-level observation; no controlled trial exists.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: nutritional supplementation
          term:
            id: NCIT:C15433
            label: Nutritional Support
          therapeutic_agent:
          - preferred_term: pyridoxine
            term:
              id: CHEBI:16709
              label: pyridoxine
        notes: 'The evidence for this treatment is genuinely conflicting and is curated as such: one case
          report describes seizures stopping under high-dose vitamin B6, while the only cohort study reports
          a course independent of B6 therapy. No controlled trial exists. The conflict is a live question
          rather than a settled contraindication, and is tracked in gap_hpii_plp_seizure_causality.'
      selected_evidence:
        snippet: Vitamin B6 de-activation may contribute to seizures in hyperprolinemia type II, which
          are so far unexplained, but they may be preventable with long term vitamin B6 supplementation.
        supports: SUPPORT
    origin:
