        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pyrroline-5-Carboxylate and Proline Accumulation
        biological_scale: MOLECULAR
        description: The metabolic block causes accumulation of delta-1-pyrroline-5-carboxylate (P5C),
          the reactive intermediate of proline catabolism, together with markedly elevated proline in
          plasma, urine, and cerebrospinal fluid. The presence of accumulating P5C is the biochemical
          feature that separates HPII from hyperprolinemia type 1, in which the earlier proline-oxidase
          block prevents P5C formation.
        role: amplifier
        chemical_entities:
        - preferred_term: 1-pyrroline-5-carboxylate
          term:
            id: CHEBI:15893
            label: 1-pyrroline-5-carboxylate
          modifier: INCREASED
        - preferred_term: L-proline
          term:
            id: CHEBI:17203
            label: L-proline
          modifier: INCREASED
      selected_evidence:
        snippet: A diagnostic work-up revealed up to 400-times increased prolin-level in urine CSF and
          blood.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
