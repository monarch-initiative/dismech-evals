      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Dysfunction
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: A mild mitochondrial arm accompanies HPII. In the only cohort to look for it, three
          of four metabolically confirmed patients had biochemical markers suggesting mitochondrial dysfunction,
          and the finding was confirmed on muscle biopsy in one; mitochondrial enzyme complex activity
          and fibroblast oxygen consumption were measured because ALDH4A1 is itself a mitochondrial matrix
          enzyme. The arm is modeled as provisional because no mechanistic route from the enzyme deficiency
          to impaired oxidative phosphorylation has been demonstrated. It is retained because it is the
          only candidate explanation on offer for the severe lactic acidosis reported during HPII crisis,
          which otherwise has no mechanistic anchor in this pathograph.
        role: amplifier
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        biological_processes:
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
        notes: 'Scope caution: the source cohort studied hyperprolinemia broadly and evaluated mitochondrial
          function because both ALDH4A1 (HPII) and PRODH (HPI) are mitochondrial. The three affected patients
          are explicitly HPII patients, so the finding is HPII-specific, but n=4 and the mechanism is
          unresolved.'
      selected_evidence:
        snippet: All children with hyperprolinemia type II had low normal B6 concentration, and three
          of the patients had biochemical markers suggesting mitochondrial dysfunction.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
