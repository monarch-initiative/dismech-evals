      assertion_type: Pathophysiology
      assertion:
        name: Acute blood-retinal barrier breakdown in accelerated hypertension
        description: In severe or rapidly rising blood pressure that exceeds retinal autoregulatory capacity,
          retinal vascular autoregulation fails; humoral vasoconstrictors and endothelial injury drive
          breakdown of the blood-retinal barrier. This produces exudation of plasma and blood into the
          retina (flame-shaped hemorrhages, hard exudates), microinfarction of the retinal nerve fiber
          layer (cotton-wool spots), and, in malignant hypertension, bilateral optic disc swelling (papilledema).
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        cell_types:
        - preferred_term: retinal blood vessel endothelial cell
          term:
            id: CL:0002585
            label: retinal blood vessel endothelial cell
        biological_processes:
        - preferred_term: vascular permeability
          modifier: INCREASED
          term:
            id: GO:0043114
            label: regulation of vascular permeability
      selected_evidence:
        snippet: Bilateral grade 3 i.e., retinal haemorrhage, hard exudates, cotton wool spots and grade
          4 i.e., optic disc swelling retinal changes essentially depict pathophysiology of severe retinal
          vascular permeability and are associated with poor prognosis.
        supports: SUPPORT
    origin:
