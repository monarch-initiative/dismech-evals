      assertion_type: Treatment
      assertion:
        name: Systemic blood pressure control
        description: Management is directed at controlling the underlying systemic hypertension rather
          than treating the retina directly; in uncomplicated malignant hypertension (grade 3-4 retinopathy
          with eye changes only), blood pressure should be lowered gradually over days to weeks rather
          than hours, to avoid ischemic complications from disrupted retinal/cerebral autoregulation.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: amlodipine
            term:
              id: CHEBI:2668
              label: amlodipine
          - preferred_term: atenolol
            term:
              id: CHEBI:2904
              label: atenolol
      selected_evidence:
        snippet: 'In uncomplicated MHT (eye changes alone) BP is to be lowered within days, aiming for
          gradual reduction to reach target BP within weeks. For example: within 24 h lower to <200/120
          mmHg, within a week <160/100 mmHg, then to <140/90 mmHg within 6-12 weeks.'
        supports: SUPPORT
