        context: []
      assertion_type: Genetic
      assertion:
        name: PLN
        gene_term:
          preferred_term: PLN
          term:
            id: hgnc:9080
            label: PLN
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Pathogenic Variants
        notes: 'PLN encodes phospholamban, one of the calcium-handling proteins implicated in hypertrophic
          cardiomyopathy (see the evidence on the Altered Calcium Handling pathophysiology node), and
          is the gene of hypertrophic cardiomyopathy 18 (MONDO:0013475, OMIM 613874). PLN-related hypertrophic
          cardiomyopathy is rare: a 1,064-proband cohort found a single cosegregating L39X nonsense variant.
          ClinGen''s Hypertrophic Cardiomyopathy Gene Curation Expert Panel curated PLN against the broader
          concept intrinsic cardiomyopathy (MONDO:0000591, autosomal dominant, SOP8) as Definitive, in
          assertion CGGV:assertion_f49f65fb-a2df-4e86-9a89-da2325b207c8-2021-02-12T170000.000Z classified
          2021-02-12, and the ClinGen CSV snapshot committed here (file creation date 2026-01-24) carries
          no PLN assertion against hypertrophic cardiomyopathy itself; the same snapshot records a separate
          Moderate assertion against arrhythmogenic right ventricular cardiomyopathy. Read the causative
          typing here as applying to the rare hypertrophic presentation rather than as a claim that PLN
          is a common hypertrophic cardiomyopathy gene.

          '
      selected_evidence:
        snippet: one L39X nonsense mutation was identified in 1 of 1,064 HCM proband cases with a family
          history of HCM, previously found to be negative for the current HCM genetic test panel. This
          mutation cosegregated with incidence of HCM in a multigenerational family.
        supports: SUPPORT
    origin:
