  e15baeff43bf9b7e70b8ef15d094e663edaa7a5949864ba1448b6660d9259be0:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: hypertrophic cardiomyopathy
            term:
              id: MONDO:0005045
              label: hypertrophic cardiomyopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: q_hcm_variant_reclassification_burden
        prompt: How much of the reported HCM genotype is stable? Registry re-review reclassified a clinically
          meaningful fraction of variants and found most variants of uncertain significance unlikely to
          be causal — so which curated gene-disease and genotype-phenotype claims in this entry rest on
          classifications that would not survive re-adjudication today?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - genetic#MYH7
        - genetic#MYBPC3
        rationale: 'Variant pathogenicity is an evidence-weighted judgement that moves as criteria and
          case data accumulate, not a fixed property of the allele. In the SHaRe registry re-review, 10%
          of variants in HCM probands changed classification in a clinically meaningful way, downgrades
          outnumbered upgrades roughly three to one, and a further 1,031 variants sat in genes with no
          established HCM gene-disease association at all. This matters mechanistically as well as clinically:
          a downgraded variant weakens any genotype-phenotype claim built on it, and the direction of
          change is gene-specific — tied to whether the gene''s disease mechanism (loss of function for
          MYBPC3, missense in the motor domain for MYH7) is settled enough to support the strongest ACMG/AMP
          criteria. Resolving this needs a pass over the entry''s genotype-linked claims against current
          ClinGen expert-panel specifications, not new experimental work.'
        notes: Sourced from a medRxiv preprint that has not been peer reviewed; it is cited here as a
          scoping observation about classification stability, and the underlying gene-disease associations
          in this entry are independently supported by ClinGen assertions and peer-reviewed studies.
      selected_evidence:
        snippet: Sub-classification of VUS resulted in less uncertainty, with 369 (40.6%) variants reclassified
          as VUS-Low or B/LB, indicating a very strong probability of not being HCM associated.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
