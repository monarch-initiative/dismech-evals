        relationship_type: DISPUTED
        association: Disputed gene-disease relationship
        notes: 'MYOZ2 encodes the Z-disc protein calsarcin-1 and is the gene of hypertrophic cardiomyopathy
          16 (MONDO:0013455, OMIM 613838). The claim rests on one linkage family plus a second missense
          variant found in a 516-proband screen; a subsequent 438-patient European cohort found no disease-causing
          MYOZ2 variant. ClinGen''s Hereditary Cardiovascular Disease Gene Curation Expert Panel classifies
          MYOZ2 against hypertrophic cardiomyopathy (MONDO:0005045, autosomal dominant, SOP9) as Disputed,
          in assertion CGGV:assertion_d74395ba-66ee-43c6-8d3c-c353bd8e5e82-2022-10-27T160000.000Z classified
          2022-10-27, read from the ClinGen Gene-Disease Validity CSV snapshot committed in this repository
          (file creation date 2026-01-24). The gene is therefore recorded here as disputed and is deliberately
          not bound to a pathophysiology node.

          '
      selected_evidence:
        snippet: Although a large cohort of more than 400 patients with familial HCM was screened, a disease-associated
          mutation in MYOZ2 was not identified.
        supports: REFUTE
