      reference_title: Reclassification of Genetic Variants in Patients with Hypertrophic Cardiomyopathy
        from the Sarcomeric Human Cardiomyopathy Registry (SHaRe)
      evidence_source: HUMAN_CLINICAL
      explanation: Shows most uncertain variants are unlikely to be causal once sub-classified, which
        bounds how much of the reported genotype should be treated as mechanistically informative.
