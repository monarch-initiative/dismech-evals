        context: []
      assertion_type: Biochemical
      assertion:
        name: Circulating miR-499a-5p
        presence: Elevated
        context: Plasma, in carriers of pathogenic/likely pathogenic MYH7 variants
        notes: 'The one biochemical readout in this entry that is specific to the MYH7 genotype rather
          than to hypertrophic cardiomyopathy in general. Plasma miR-499a-5p is a cardiac-enriched microRNA
          whose circulating level separates MYH7 variant carriers from MYBPC3 carriers, from other HCM
          patients, and from controls.

          Curated as a research biomarker, not a validated clinical assay. The cohort is small (7 MYH7
          carriers against 8 MYBPC3 carriers) and the qRT-PCR replication did not reproduce the direction
          of the original RNA-seq comparison between HCM patients and controls; the genotype-stratified
          difference is the finding that held.'
      selected_evidence:
        snippet: Further investigation on enlarged groups of individuals showed that its level was higher
          in carriers of pathogenic/likely pathogenic (P/LP) variants in MYH7 gene compared to controls
          (fold change, FC = 8.9; p < 0.0001).
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/0
