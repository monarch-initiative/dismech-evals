        snippet: Penetrance varied from ≈32% for MYL3 (myosin light chain 3) to ≈55% for MYBPC3 (myosin-binding
          protein C3), ≈60% for TNNT2 (troponin T2) and TNNI3 (troponin I3), and ≈65% for MYH7 (myosin
          heavy chain 7).
