      assertion:
        name: Oral Anticoagulation for Atrial Fibrillation
        description: Atrial fibrillation in hypertrophic cardiomyopathy carries a thromboembolic risk
          high enough that anticoagulation is recommended on the arrhythmia alone rather than gated on
          a general-population risk score. Roughly a fifth of patients develop atrial fibrillation and
          about a quarter of those experience thromboembolism.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: anticoagulant
            term:
              id: NCIT:C263
              label: Anticoagulant Agent
        notes: The same review records that there were no randomised controlled trials of therapy, and
          that data on interventions other than anticoagulation were limited and contradictory. The recommendation
          is therefore curated as consensus resting on observational association, not on trial evidence.
      selected_evidence:
        snippet: AF is common in HCM and associated with high thromboembolic risk. LA dimension and age
          are independently associated with AF but the literature is insufficient to create robust clinical
          tools to predict AF or thromboembolism. Most data suggest that AF patients should be anticoagulated.
        supports: SUPPORT
        directness: INDIRECT
