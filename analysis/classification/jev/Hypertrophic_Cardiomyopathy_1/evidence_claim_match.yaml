      assertion_type: Treatment
      assertion:
        name: MYH7 Allele-Directed Gene Editing (Preclinical)
        description: Two preclinical strategies target the MYH7 allele itself rather than its downstream
          consequences. Adenine base editing corrects the pathogenic base in patient-derived cardiomyocytes
          and in humanized mice; high-precision Cas13d instead degrades the mutant transcript while sparing
          the wild-type allele, which suits the dominant-negative biology of missense MYH7 disease. Neither
          is an approved therapy, and both face delivery, durability and off-target questions. They are
          curated here because they are the only interventions in this entry that act on the trigger node.
        therapeutic_modality: GENE_EDITING
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        notes: Preclinical only. No gene, RNA or cell therapy is approved for CMH1, and the named clinical
          gene-replacement program in hypertrophic cardiomyopathy (TN-201) targets MYBPC3, not MYH7, so
          it is deliberately not recorded here.
      selected_evidence:
        snippet: In this study we identify an adenine base editor and single-guide RNA system that can
          efficiently correct this human PV with minimal bystander editing and off-target editing at selected
          sites.
        supports: SUPPORT
