  2d9cc093ae76260f1bcb32767266c55eddc2fda7e67e611af3d060d1f255a808:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 1
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 1
            term:
              id: MONDO:0008647
              label: hypertrophic cardiomyopathy 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiomyocyte-to-Fibroblast EGFR Paracrine Signaling
        biological_scale: CELLULAR
        role: amplifier
        description: Interstitial fibrosis in CMH1 is not solely a passive response to wall stress. In
          engineered cardiac microtissues built from MYH7 R403Q hiPSC-derived cardiomyocytes co-cultured
          with wild-type ventricular cardiac fibroblasts, the mutant cardiomyocytes release paracrine
          factors that drive fibroblast proliferation and collagen deposition. Collagen I content rose
          40% over isogenic wild-type microtissues and the tissue stiffened, and the effect depended on
          fibroblast proliferation rather than on cardiomyocyte matrix output. Epidermal growth factor
          alone was sufficient to stimulate the stromal cells, and inhibiting EGFR tyrosine kinase with
          erlotinib attenuated the activation — identifying EGFR signalling as the transducing arm and,
          in principle, a druggable one. The same microtissue system shows that the tissue-level consequence
          is hypocontractility even while the individual mutant cardiomyocytes are hypercontractile, which
          is how a cell-autonomous gain of contractile function ends up producing a stiff, poorly contracting
          ventricle.
        cell_types:
        - preferred_term: Ventricular cardiac fibroblast
          term:
            id: CL:2000066
            label: cardiac ventricle fibroblast
        - preferred_term: Ventricular cardiomyocyte
          term:
            id: CL:0002131
            label: regular ventricular cardiac myocyte
        biological_processes:
        - preferred_term: EGFR Signaling
          term:
            id: GO:0007173
            label: epidermal growth factor receptor signaling pathway
          modifier: INCREASED
        - preferred_term: Fibroblast Proliferation
          term:
            id: GO:0048144
            label: fibroblast proliferation
          modifier: INCREASED
        - preferred_term: Extracellular Matrix Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
        notes: 'Curated as a distinct arm rather than folded into the remodeling node because it is a
          different kind of claim: the remodeling node describes what the myocardium becomes, this node
          names the cell-to-cell signal that produces the fibrotic part of it and the receptor that carries
          it. The same study found stromal activation in MYBPC3-truncation microtissues too, with distinct
          characteristics, so the arm is shared across sarcomeric HCM rather than being MYH7-exclusive.'
      selected_evidence:
        snippet: Using engineered cardiac microtissues (CMTs) composed of HCM-causing MYH7-variant hiPSC-CMs
          and wild-type fibroblasts, we observed cell-cell cross-talk leading to increased collagen deposition,
          tissue stiffening, and decreased contractility dependent on fibroblast proliferation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
