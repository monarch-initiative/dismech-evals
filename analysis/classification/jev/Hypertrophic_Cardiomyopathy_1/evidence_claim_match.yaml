  11469cbe9d62686a81cb6c59e60100a87261c7fdbe17fb90952b5bf247ec083d:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 1
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 1
            term:
              id: MONDO:0008647
              label: hypertrophic cardiomyopathy 1
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Storage and Infiltrative Phenocopies of Left Ventricular Hypertrophy
        description: Unexplained left ventricular hypertrophy is not specific to sarcomeric disease. Glycogen
          storage and lysosomal disorders (Danon disease, PRKAG2 glycogenosis, Pompe disease, Fabry disease),
          extracellular deposition (transthyretin and AL amyloidosis) and mitochondrial disease all thicken
          the myocardium. Distinguishing them from CMH1 matters clinically because several have disease-specific
          therapy that sarcomeric HCM does not, and because a wrong call misdirects family screening.
          Low ECG voltage despite marked hypertrophy is the classic pointer away from a sarcomeric cause.
        notes: Diastolic dysfunction does not discriminate here. The same source reports that diastolic
          dysfunction is a key feature of HCM and its phenocopies alike and that its value in differential
          diagnosis is limited, so it is curated as a shared phenotype rather than a distinguishing feature.
      selected_evidence:
        snippet: as there are specific therapies for some forms of HCM including enzyme substitution and
          chaperone therapies and specific treatments for TTR amyloidosis, a differential diagnosis should
          be sought in all patients with unexplained left ventricular hypertrophy.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29506729
      reference_title: 'Common presentation of rare diseases: Left ventricular hypertrophy and diastolic
