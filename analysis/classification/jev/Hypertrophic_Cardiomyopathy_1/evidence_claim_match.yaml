  39d38f4be03bc47803f1e27f337ec34ce95fd078a72f85d88d7e1465217b9960:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 1
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 1
            term:
              id: MONDO:0008647
              label: hypertrophic cardiomyopathy 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Beta-Adrenergic Blockade
        description: 'A non-vasodilating beta-blocker is the conventional first-line drug for symptomatic
          obstructive hypertrophic cardiomyopathy, reducing the dynamic outflow gradient through negative
          inotropy and chronotropy and lengthening diastolic filling time. The evidence base is weaker
          than its first-line position suggests: in the only randomized placebo-controlled crossover trial
          in mildly to moderately symptomatic patients, nadolol did not improve maximal oxygen consumption
          and reduced peak exercise work load in most patients, though a majority still preferred active
          drug to placebo.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: beta-adrenergic antagonist
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
          - preferred_term: nadolol
            term:
              id: CHEBI:7444
              label: nadolol
        notes: Curated with an honest negative alongside the positive. The first-line position of beta-blockade
          in hypertrophic cardiomyopathy rests on guideline consensus and physiological reasoning, not
          on a trial showing improved exercise capacity; the one randomized placebo-controlled trial found
          the opposite. Both evidence items quote the same study, split so each carries a single direction,
          as the evidence policy requires.
      selected_evidence:
        snippet: In patients with mild or moderately symptomatic hypertrophic cardiomyopathy, exercise
          capacity was not improved by nadolol or verapamil, and individuals were more often impaired
          by nadolol than with verapamil.
        supports: REFUTE
        directness: INDIRECT
    origin:
      assertion_path: /treatments/7
      evidence_path: /treatments/7/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8496536
      reference_title: A double-blind, placebo-controlled crossover trial of nadolol and verapamil in
        mild and moderately symptomatic hypertrophic cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Recorded as REFUTE against the claim that beta-blockade improves functional capacity:
        in this randomized crossover trial it did not, and nadolol impaired peak work load more often
        than verapamil did. Directness is INDIRECT because the trial enrolled broad HCM rather than genotyped
        MYH7 carriers, and because it was restricted to mildly and moderately symptomatic patients.'
