        name: Hypertrophic Cardiomyopathy due to other sarcomere genes
        description: MYBPC3, TNNT2, TNNI3, TPM1, ACTC1, MYL2 and MYL3 also carry definitive gene-disease
          validity for hypertrophic cardiomyopathy, and MYH7 and MYBPC3 together account for roughly half
          of HCM families. The phenotypes overlap substantially, so only genetic testing separates CMH1
          from its sarcomeric siblings. The mechanistic contrast is with MYBPC3 disease, which is predominantly
          truncating and acts by haploinsufficiency, where MYH7 disease is predominantly missense and
          acts through a stably expressed mutant motor.
