              id: CHEBI:756998
              label: mavacamten
      selected_evidence:
        snippet: Cardiac muscle hypercontractility is a key pathophysiological abnormality in hypertrophic
          cardiomyopathy, and a major determinant of dynamic left ventricular outflow tract (LVOT) obstruction.
