      assertion_type: Treatment
      assertion:
        name: Mavacamten (Cardiac Myosin Inhibitor)
        description: Mavacamten is a small-molecule allosteric inhibitor of cardiac myosin ATPase that
          reduces the number of force-generating actin-myosin cross-bridges, stabilizing myosin in the
          energy-sparing super-relaxed state. It directly counteracts the hypercontractility that is the
          central abnormality of HCM, and is approved for symptomatic obstructive hypertrophic cardiomyopathy;
          because beta-cardiac myosin is the MYH7 gene product, the drug acts on the same motor that carries
          the CMH1 lesion.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
