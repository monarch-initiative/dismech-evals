        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MYH7 Missense Variant in Beta-Cardiac Myosin Heavy Chain
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: The initiating lesion in CMH1 is a heterozygous missense variant in MYH7, the gene
          encoding the beta-cardiac myosin heavy chain — the ATP-hydrolysing motor of the sarcomeric thick
          filament. The founding example, and still the archetype, is Arg403Gln (R403Q), the first mutation
          ever linked to familial hypertrophic cardiomyopathy; R403Q sits in the globular myosin head
          (S1), the region responsible for actin interaction and motor function. In contrast to the truncating,
          haploinsufficiency mechanism of MYBPC3 disease, most MYH7 alleles are missense changes that
          are stably expressed and incorporated into the sarcomere as a mutant motor, so the mutant protein
          perturbs contraction directly rather than by its absence.
        genes:
        - preferred_term: MYH7
          term:
            id: hgnc:7577
            label: MYH7
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Sarcomere Organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Myosin thick filament
          term:
            id: GO:0032982
            label: myosin filament
      selected_evidence:
        snippet: HCM is caused by mutations in the genes encoding the fundamental force-generating machinery
          of the cardiac muscle, including β-cardiac myosin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23798412
      reference_title: Molecular consequences of the R453C hypertrophic cardiomyopathy mutation on human
        β-cardiac myosin motor function.
      evidence_source: IN_VITRO
      explanation: Places the MYH7 lesion in the force-generating machinery of the sarcomere, the trigger
