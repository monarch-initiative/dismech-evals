            term:
              id: MONDO:0008647
              label: hypertrophic cardiomyopathy 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilization of the Autoinhibited Super-Relaxed State
        biological_scale: MOLECULAR
        role: amplifier
        description: In the resting sarcomere a large fraction of myosin heads occupy the super-relaxed
          (SRX) state — folded back against the thick-filament backbone in the interacting-heads motif
          (IHM), with very low ATPase activity, forming an energy-conserving reserve of motors withheld
          from force generation. Many MYH7 HCM mutations map to the interfaces that stabilize this folded-back
          state (the myosin mesa, the head-head and head-tail contacts), and they weaken those intramolecular
          interactions. The result is release of sequestered heads from the SRX/IHM into the disordered-relaxed
          state, so more heads become functionally accessible to actin — the molecular origin of hypercontractility
          shared across a large subset of MYH7 alleles.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: ATP Hydrolysis by Myosin
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: INCREASED
        cellular_components:
        - preferred_term: Myosin thick filament
          term:
            id: GO:0032982
            label: myosin filament
      selected_evidence:
        snippet: folded-back sequestered state referred to as the interacting heads motif (IHM) lead to
          a significant increase in the number of heads functionally accessible for interaction with actin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
