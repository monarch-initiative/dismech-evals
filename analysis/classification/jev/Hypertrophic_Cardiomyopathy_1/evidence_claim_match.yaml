            description: The founding animal model of the field, introducing the R403Q substitution into
              the mouse alpha-cardiac myosin heavy chain gene. Heterozygotes develop the histopathology
              of human familial hypertrophic cardiomyopathy with age; homozygotes die within a week of
              birth. Cardiac dysfunction preceded the histological changes, which is the model's principal
              contribution to the causal ordering curated in this entry's pathophysiology.
            publication: PMID:8614836
            notes: Retained despite its LOW fidelity because it is the model that established that a single
