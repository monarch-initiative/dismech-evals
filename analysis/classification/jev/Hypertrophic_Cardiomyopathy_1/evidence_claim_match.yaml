        target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: TISSUE
        description: Myocyte disarray, hypertrophy and fibrosis develop and increase with age, reproducing
          the tissue-level remodeling node.
        limitations: The substitution is in Myh6 (alpha-cardiac myosin), not the Myh7 orthologue of the
          human disease gene, because the adult mouse ventricle expresses alpha- rather than beta-myosin.
          So the model reproduces the pathology of a 403 substitution in the myosin that mouse hearts
