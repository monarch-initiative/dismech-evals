      assertion_type: Treatment
      assertion:
        name: Alcohol Septal Ablation
        description: Catheter-based infarction of the basal septum through a septal perforator branch,
          an alternative to surgical myectomy for drug-refractory obstruction in patients who are poor
          surgical candidates. It does not address concomitant mitral or subvalvular abnormalities, which
          is where myectomy is preferred.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: alcohol septal ablation
          term:
            id: NCIT:C80439
            label: Septal Ablation
        notes: 'The registry reports that residual post-procedural obstruction was associated with both
          worse functional status and worse prognosis, so the entry records ablation as gradient-directed
          therapy whose benefit tracks how completely the gradient is eliminated. No claim is made here
          about ablation versus myectomy: the comparative literature was not screened this round, and
          the preference for myectomy stated in this treatment''s description is a statement of when the
          concomitant mitral and subvalvular pathology needs surgical correction, not a comparative-efficacy
          claim.

          therapeutic_modality is SURGERY because that is the coarse procedural bucket the enum offers.
          The procedure is catheter-based, and NCIT:C80439 sits under cardiac ablation rather than under
          surgery; there is no DEVICE-free interventional value in ModalityEnum to distinguish the two.'
      selected_evidence:
        snippet: The Euro-ASA registry demonstrated low peri-procedural and long-term mortality after
          ASA. This intervention provided durable relief of symptoms and a reduction of LV outflow tract
          obstruction in selected and highly symptomatic patients with obstructive HCM.
        supports: SUPPORT
        directness: INDIRECT
