              phenotype, the adult mouse ventricle running on alpha-myosin; a pig ventricle, like a human
              one, is predominantly beta-myosin. That is the same reasoning behind the rabbit model above.

              Spontaneous feline hypertrophic cardiomyopathy (PMID:36928240) was screened as a fourth
              model and deliberately not curated. It is a genuine spontaneous large-animal disease and
              the transcriptomic overlap with human HCM is real, but the established breed-associated
              variants are MYBPC3 (A31P in Maine Coon, R820W in Ragdoll) rather than MYH7, and most feline
              cases are genetically unresolved. It would belong in the parent Hypertrophic Cardiomyopathy
              entry, not in the MYH7 entity.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Ventricular Hypertrophy, Myocyte Disarray and Fibrosis
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: TISSUE
        description: Neonatal animals showed mild myocyte disarray and malformed nuclei, establishing
          that the histological lesion can arise before birth from a knock-in MYH7 allele.
        limitations: The animals died within 24 hours post partem, so the model captures a perinatal phenotype
          far more severe than the adult-onset human disease and cannot report on natural history, hypertrophy
          development, or fibrosis at all. Only disarray and nuclear morphology were observed; hypertrophy
          and interstitial fibrosis, the node's other components, were not.
        divergences:
        - divergence_type: TEMPORAL_SCOPE
          materiality: INVALIDATING
          description: Perinatal lethality truncates the model at 24 hours of age, before the adult-onset
            remodeling this node describes could develop, so the node's hypertrophy and fibrosis components
            have no counterpart in the animal.
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: 'The node''s hypertrophy component is not merely unobserved: the paper reports
            the hearts showed no obvious hypertrophy. Interstitial fibrosis is not reported either way.
            So of the node''s three components the model shows one (disarray), contradicts one (hypertrophy),
            and is silent on the third.'
      selected_evidence:
        snippet: Surprisingly, the animals died within 24 h post partem, probably due to heart failure
          as indicated by a shift in the a/ß-MyHC ratio in the left ventricle.
        supports: SUPPORT
