      assertion_type: Diagnosis
      assertion:
        name: Echocardiographic Wall-Thickness Criterion
        description: 'The clinical diagnosis rests on a cardiac imaging measurement, not on genotype:
          an end-diastolic wall thickness of 15 mm or more anywhere in the left ventricle, not explained
          by loading conditions and with other causes of hypertrophy ruled out. A 13-14 mm threshold applies
          when there is a positive family history or a positive genetic test, which is the situation of
          a CMH1 cascade-screened relative. Paediatric diagnosis uses body-size-adjusted z-scores instead
          of an absolute thickness.'
        diagnosis_term:
          preferred_term: transthoracic echocardiography
          term:
            id: NCIT:C16525
            label: Echocardiography Test
        notes: 'The lowered 13-14 mm threshold is what makes genetic testing consequential for relatives
          rather than merely informative: a confirmed familial variant changes the wall thickness at which
          a relative is called affected.'
      selected_evidence:
        snippet: The clinical diagnosis of HCM in adult patients is typically established using any cardiac
          imaging technique that shows an end-diastolic wall thickness of ≥15 mm anywhere in the left
          ventricle, which cannot be explained solely by pressure overload states, and after ruling out
          any other conditions that may cause LV hypertrophy. A cutoff of 13-14 mm can be diagnostic with
          a positive family history or a positive genetic test
        supports: SUPPORT
        directness: INDIRECT
