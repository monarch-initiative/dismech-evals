        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#alpha-MHC 403/+ knock-in mouse
        prompt: Does a 403 substitution in mouse alpha-cardiac myosin model a human MYH7 beta-myosin disease?
        rationale: The founding animal model of this disease carries R403Q in Myh6, not Myh7, because
          the adult mouse ventricle expresses alpha- rather than beta-myosin. Evidence therefore exists
          in the model but its translational validity is the open question, which is what distinguishes
          this from an ordinary knowledge gap. The pig study makes the mismatch explicit, stating that
          orthologous beta-MyHC mutations in mice do not produce the phenotype found in patients — and
          that is the stated reason large-animal models were built. Any claim in this entry that rests
          on mouse data inherits this caveat.
      selected_evidence:
        snippet: Mice express the fast alpha-myosin in the heart, and orthologous ß-MyHC mutations do
          not lead to the phenotype typically found in HCM patients
        supports: SUPPORT
