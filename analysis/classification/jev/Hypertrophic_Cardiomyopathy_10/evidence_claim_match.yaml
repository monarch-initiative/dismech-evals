      assertion_type: Treatment
      assertion:
        name: Cardiac Myosin Inhibition (Mavacamten)
        description: 'Mavacamten reduces post-exercise outflow gradient and improves exercise capacity
          and symptoms in symptomatic obstructive hypertrophic cardiomyopathy, and is the first disease-directed
          drug class for the condition. It is listed here as the class a symptomatic obstructive MYL2
          patient would be considered for, not as a MYL2-validated therapy — the pivotal trials enrolled
          by phenotype and reported no genotype subgroup. There is also a specific mechanistic reservation
          for the R58Q allele, recorded in the discussions block: myosin inhibitors work by increasing
          occupancy of the super-relaxed state, and R58Q already stabilises it.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mavacamten
        notes: 'Not MYL2-stratified. Recorded as disease-class therapy, not as evidence of benefit in
          MYL2 carriers.

          Mavacamten is deliberately left without an ontology term, for the reason already recorded in
          Hypertrophic_Cardiomyopathy_8: NCIT:C174901 Mavacamten exists but sits under Inotropic Support
          rather than Pharmacologic Substance, so it is not reachable from the ChemicalEntityTerm enum
          roots and fails term validation, and CHEBI has no mavacamten term. Do not substitute another
          NCIT code to fill the slot: NCIT:C158384 was tried during this curation and is SIGLEC15 Gene.'
      selected_evidence:
        snippet: Patients on mavacamten had greater reductions than those on placebo in post-exercise
          LVOT gradient
        supports: SUPPORT
        directness: INDIRECT
