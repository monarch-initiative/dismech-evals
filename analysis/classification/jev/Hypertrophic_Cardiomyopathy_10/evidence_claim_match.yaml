  356219b1060a3de0be4612928a08cb303983a4bdf44c650cf20fabfb41e0ea7e:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 10
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 10
            term:
              id: MONDO:0012112
              label: hypertrophic cardiomyopathy 10
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myl2_no_genotype_stratified_outcome_or_omics_data
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What are the penetrance, natural history, and sudden-death risk of MYL2-related hypertrophic
          cardiomyopathy, and is there any MYL2-stratified molecular dataset?
        attaches_to:
        - phenotypes#Sudden Cardiac Death
        - prevalence#Worldwide (MYL2 share of HCM)
        - treatments#Cardiac Myosin Inhibition (Mavacamten)
        rationale: 'Every quantitative clinical statement in this entry is either a single-family figure
          or a disease-class figure borrowed from unstratified hypertrophic cardiomyopathy cohorts. Sudden
          death in R58Q is documented as an association across two pedigrees with no denominator behind
          it; the only screened case fraction available is for the light chain genes as a class in a 186-patient
          cohort from 2002; and the guideline and trial evidence supporting the treatments block enrolled
          by phenotype with no MYL2 subgroup reported.

          The gap extends to molecular data. A GEO search for MYL2-specific cardiomyopathy datasets returns
          nothing: the accessions that surface for MYL2 are studies in which it appears as a cardiomyocyte
          marker gene, and the accessions that surface for hypertrophic cardiomyopathy are unstratified
          or concern other genes. That is why this entry carries no datasets block. Adding a generic hypertrophic
          cardiomyopathy dataset here would be the named-entity substitution the repository''s dataset
          guidance warns about — relaxing the entry name to its parent disease — and the absence is the
          accurate record.

          What would close it: a MYL2-stratified outcome cohort with a denominator, an allele-resolved
          penetrance estimate for R58Q comparable to the E22K founder work, and an isogenic-pair transcriptomic
          or proteomic profile of an MYL2-mutant human cardiomyocyte model.'
      selected_evidence:
        snippet: myosin light chain mutations are a very rare cause of HCM responsible for about 1% of
          cases
        supports: SUPPORT
