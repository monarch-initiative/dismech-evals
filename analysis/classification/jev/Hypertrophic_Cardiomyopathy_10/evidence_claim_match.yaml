        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Slow-Twitch Skeletal Muscle Contractile Deficit
        biological_scale: TISSUE
        role: consequence
        description: 'MYL2 encodes the regulatory light chain of heart ventricle and slow-twitch skeletal
          muscle simultaneously, and human pedigrees of light chain disease report cardiac hypertrophy
          together with abnormal skeletal muscle. Whether the skeletal deficit is a parallel local action
          of the allele or a systemic consequence of the cardiac disease is not settled, and the leading
          model argues against the simple parallel reading: in R58Q transgenic mice the soleus shows the
          same contractile deficit as ventricular papillary muscle and the fast-twitch extensor digitorum
          longus does not, but the transgene is cardiac-restricted, so the mutant light chain is not present
          in soleus at all. The authors present this as their surprising result rather than as evidence
          of local action. The human expression fact makes skeletal muscle a candidate direct target;
          the mouse experiment does not test it.'
        cell_types:
        - preferred_term: Slow-twitch (type I) skeletal muscle fiber
          term:
            id: CL:0002211
            label: type I muscle cell
        biological_processes:
        - preferred_term: Slow-twitch skeletal muscle fiber contraction
          term:
            id: GO:0031444
            label: slow-twitch skeletal muscle fiber contraction
          modifier: DECREASED
      selected_evidence:
        snippet: Skinned SOL muscles and ventricular PMs of R58Q animals exhibited lower contractile force
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
