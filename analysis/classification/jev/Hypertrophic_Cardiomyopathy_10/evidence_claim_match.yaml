              label: hypertrophic cardiomyopathy 10
        context: []
      assertion_type: Environmental
      assertion:
        name: Hypertension as a penetrance-determining co-factor
        description: 'In the MYL2 E22K founder cohort, hypertension was the single most common additional
          hypertrophy driver among carriers who went on to develop clinical disease. This is not the usual
          "environmental risk factor" relationship, in which an exposure raises risk at the margin: here
          the genotype on its own largely failed to produce disease, and the co-factor supplied the rest.
          The authors'' practical conclusion follows from that — screen carriers for hypertension early
          and treat it, and do not exclude hypertensive individuals from genetic studies of hypertrophic
          cardiomyopathy on the grounds that their hypertrophy is explained.'
        effect: Converts a low-penetrance MYL2 genotype into clinical hypertrophic cardiomyopathy
        notes: Left without an exposure_term. ECTO's only hypertension-related term is ECTO:2000001 exposure
          to medication for hypertension, which names the treatment rather than the condition and would
          assert something this entry does not claim.
      selected_evidence:
        snippet: The most prominent risk factor was hypertension, observed in 71% of mutation carriers
          with HCM and an additional risk factor.
        supports: SUPPORT
