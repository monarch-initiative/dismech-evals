          thing for every allele. This entry curates the functional signature that has been worked out
          for R58Q — the phosphorylation deficit, the SRX shift, the reduced force with raised ATPase,
          the calcium sensitisation — but the same-cohort comparison that made R58Q malignant made E22K
          benign, and the transgenic comparisons that isolate the phosphorylation deficit to R58Q show
