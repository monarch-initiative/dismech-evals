  475016d1380f0d2890e990fb44f6a794b593ca27ac6bcd0cd589fe6a5f558640:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 10
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 10
            term:
              id: MONDO:0012112
              label: hypertrophic cardiomyopathy 10
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myl2_penetrance_is_conditional_on_a_second_driver
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        prompt: Is conditional penetrance — a MYL2 allele that needs a second hypertrophy driver to become
          clinical disease — a property of the E22K founder allele, or the general model for low-penetrance
          sarcomeric variants?
        attaches_to:
        - environmental#Hypertension as a penetrance-determining co-factor
        - variants#MYL2 c.64G>A p.(Glu22Lys) — Dutch founder allele
        - progression#Penetrance conditional on an additional hypertrophy driver
        rationale: 'The founder cohort is unusually clean evidence for a model that is usually only asserted.
          Thirty-eight carriers of one allele on one haplotype: the allele alone was largely benign, and
          with hypertension, obesity, or a second sarcomeric variant, 89% of carriers had hypertrophic
          cardiomyopathy. The authors drew two conclusions that both follow from it — screen carriers
          for treatable hypertrophy drivers, and stop excluding hypertensive patients from genetic studies
          on the grounds that their hypertrophy is already explained.

          Whether the model generalises is open, and the founder design cuts both ways: one haplotype
          in one population controls for genetic background beautifully and also means the result could
          be specific to that background. The disease-class penetrance literature is consistent with conditional
          penetrance without demonstrating it — incidentally identified population carriers of sarcomeric
          variants have much lower penetrance than clinically ascertained ones, which is what a model
          requiring a second driver predicts, but is also what ascertainment bias alone predicts.'
      selected_evidence:
        snippet: The co-presence of additional risk factors for hypertrophy such as hypertension, obesity,
          or other sarcomeric gene mutation increased disease penetrance substantially and caused HCM
          in 89% of MYL2 mutation carriers
        supports: SUPPORT
