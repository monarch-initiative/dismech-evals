      assertion_type: Variant
      assertion:
        name: MYL2 p.(Arg58Gln) — malignant missense allele
        gene:
          preferred_term: MYL2
          term:
            id: hgnc:7583
            label: MYL2
        description: 'The archetypal MYL2 allele and the one behind almost all of the functional work
          in this entry. Unlike E22K it is malignant: early onset, premature sudden death, and co-segregation
          across a four-generation pedigree. Its functional signature is unusually well resolved — reduced
          RLC Ser15 phosphorylation, stabilisation of the super-relaxed myosin state, lower maximal force
          with higher ATPase, increased calcium sensitivity with reduced cooperativity, and slower cross-bridge
          kinetics — and a Ser15 phosphomimetic reverses several of these in vitro. The two unaffected
          juvenile carriers in the four-generation pedigree are the age-related penetrance recorded in
          this entry''s inheritance block seen within one family, not evidence against the allele.'
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: The mutation Arg58Gln showed also moderate septal hypertrophy, but, in contrast, it was
          associated with an early onset of clinical manifestation and premature sudden cardiac death.
        supports: SUPPORT
