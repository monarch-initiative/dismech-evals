        name: Non-Septal Hypertrophy Distribution (Mid-Ventricular and Apical)
        category: Cardiovascular
        description: The hypertrophy of MYL2 disease is not confined to the septum. The original description
          called the light chain form a rare variant of cardiac hypertrophy and located its lesion at
          the cardiac papillary muscles, without characterising an obstruction; mid-ventricular obstruction
          is attached specifically to the A13T allele in the later literature, and an apical distribution
          has been characterised for R58Q. Recording the distribution matters clinically, because a mid-cavity
          or apical pattern is what makes the diagnosis easy to miss on a study reported as normal septal
          thickness.
        subtype: AD missense
