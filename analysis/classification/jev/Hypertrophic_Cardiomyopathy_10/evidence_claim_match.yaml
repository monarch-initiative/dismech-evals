        description: Surgical myectomy or alcohol septal ablation relieves the outflow gradient in obstruction
          refractory to medical therapy. It is the procedure VALOR-HCM, curated in this entry's clinical
          trials, was designed to avert, so modelling the trial without modelling the procedure would
          leave the decision it addresses unrepresented. Note it targets anatomy rather than the sarcomeric
          lesion, so it acts on the obstruction phenotype while leaving every sarcomeric node upstream
          of it untouched.
        therapeutic_modality: SURGERY
        treatment_term:
