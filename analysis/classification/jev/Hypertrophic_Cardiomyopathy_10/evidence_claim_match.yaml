  77a4a58cd948e74ae3086d39a95fe89f5e16e7e8fff07624aa40e87a473ffde6:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 10
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 10
            term:
              id: MONDO:0012112
              label: hypertrophic cardiomyopathy 10
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myl2_srx_stabilization_vs_myosin_inhibitors
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Cardiac myosin inhibitors treat hypertrophic cardiomyopathy by increasing occupancy of
          the myosin super-relaxed state. R58Q already stabilises that state. Is this drug class the right
          one for R58Q carriers, and does the answer differ by MYL2 allele?
        attaches_to:
        - pathophysiology#Stabilization of the Myosin Super-Relaxed State
        - treatments#Cardiac Myosin Inhibition (Mavacamten)
        rationale: 'The two facts are individually well supported and point in opposite directions. R58Q
          was shown to promote the myosin OFF state and stabilise SRX in reconstituted porcine fibres
          and in transgenic mouse papillary muscle, and the experimental intervention that improved the
          R58Q phenotype in that same work was a Ser15 phosphomimetic, which shifts myosin the other way,
          toward the disordered-relaxed state. Mavacamten shifts it toward SRX. If the R58Q lesion is
          an excess of SRX, the drug class licensed for this disease pushes in the direction of the lesion
          rather than against it.

          Three things stop this being an argument against prescribing. Obstruction is a haemodynamic
          problem and a gradient can fall for reasons unrelated to whether the drug corrects the primary
          lesion. The SRX findings are ex vivo and in mouse tissue, not in an R58Q patient''s myocardium.
          And no genotype-stratified data exist either way: EXPLORER-HCM and VALOR-HCM enrolled by phenotype
          and reported no MYL2 subgroup, so there is no reported failure of mavacamten in an RLC carrier
          to point at. What is recorded here is a mechanistic reason to expect the answer might be allele-dependent,
          and an experiment worth doing, not a treatment recommendation.

          The corollary is that MYL2 is not mechanistically uniform. Sibling entries in this series carry
          the opposite lesion — the MYL3 A57G work describes inhibition of the super-relaxed state — so
          "sarcomeric HCM is hypercontractile" does not license assuming the direction of the SRX shift
          for a given light chain allele.'
      selected_evidence:
        snippet: R58Q promotes the OFF state of myosin, both in reconstituted porcine fibers and in Tg
