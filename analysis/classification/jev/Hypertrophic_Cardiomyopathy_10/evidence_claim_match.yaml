        context: []
      assertion_type: Subtype
      assertion:
        name: AR biallelic LOF
        display_name: Autosomal recessive biallelic loss-of-function light chain myopathy
        description: 'A distinct severe entity rather than an early presentation of the dominant form:
          biallelic loss-of-function MYL2 alleles affecting the last exon, disrupting the second EF-hand
          domain, presenting as a fatal infantile cardioskeletal myopathy with type I fibre hypotrophy.
          The obligate heterozygous parents are unaffected, so this arm and the dominant one differ in
          mechanism and not only in dose. Its discoverers proposed the name "light chain myopathy". It
          is curated as a subtype rather than a separate entry because it is the same gene and the same
          MONDO concept, but note the original pedigrees reported dilated rather than hypertrophic cardiomyopathy;
          if a distinct MONDO term is minted for light chain myopathy, this should be revisited as a split.'
      selected_evidence:
        snippet: the mutations in the last exon of MYL2 are responsible for a novel autosomal recessive
          lethal myosinopathy
        supports: SUPPORT
