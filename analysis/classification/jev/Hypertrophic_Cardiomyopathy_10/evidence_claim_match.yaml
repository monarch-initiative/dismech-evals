        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Stabilization of the Myosin Super-Relaxed State
        biological_scale: MOLECULAR
        role: effector
        description: 'Striated-muscle myosin partitions between an active force-producing state, a disordered-relaxed
          state whose heads can reach actin, and a super-relaxed (SRX) state with an ordered arrangement
          along the thick filament and a very low ATP turnover rate. R58Q shifts the equilibrium toward
          SRX in both reconstituted fibres and transgenic papillary muscle, leaving fewer heads recruitable.
          This direction matters clinically: the licensed cardiac myosin inhibitors for hypertrophic cardiomyopathy
          act by *increasing* SRX occupancy, so an allele that already stabilises SRX is not obviously
          the one that class was designed for. That reservation is a mechanistic inference, not a reported
          treatment failure, and is recorded as an open question rather than as guidance.

          The ATP-turnover annotation on this node refers to the low turnover rate that defines the super-relaxed
          state itself. It is not in conflict with the raised actin-activated fibre ATPase reported for
          R58Q elsewhere in this entry: those are different measurements — the turnover of heads parked
          in the OFF state, and the enzymatic rate of the heads that are cycling.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: Myosin ATP turnover
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: Myosin thick filament
          term:
            id: GO:0032982
            label: myosin filament
      selected_evidence:
        snippet: R58Q promotes the OFF state of myosin, both in reconstituted porcine fibers and in Tg
          mouse papillary muscles, thereby stabilizing the super-relaxed state (SRX) of myosin, characterized
          by a very low ATP turnover rate
        supports: SUPPORT
