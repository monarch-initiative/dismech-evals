          only; alcohol septal ablation is the catheter alternative and has no reachable clinical-action
          term, so it is carried in preferred_term and description rather than bound.
      selected_evidence:
        snippet: Guidelines recommend optimization of medical treatment in obstructive HCM patients before
          proceeding to more invasive options such as septal reduction therapy (SRT)
