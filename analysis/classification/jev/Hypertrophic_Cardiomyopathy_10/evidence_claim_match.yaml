            label: Apical hypertrophic cardiomyopathy
        notes: The binding is HP:0031992 Apical hypertrophic cardiomyopathy, which is narrower than this
          phenotype as described — HPO has no term for a mid-ventricular or mid-cavity distribution, and
          HP:0031992 is the only non-septal distribution term available. The apical half of the claim
          rests on the characterisation of the R58Q patient in PMID:30796699, whose indexed PubMed record
          is abstract-only and states the apical distribution in its title alone, so it carries no quotable
          snippet here and is not cited as one.
      selected_evidence:
        snippet: associated with a rare FHC variant defined by mid-ventricular obstruction and septal
          hypertrophy
        supports: SUPPORT
        directness: INDIRECT
