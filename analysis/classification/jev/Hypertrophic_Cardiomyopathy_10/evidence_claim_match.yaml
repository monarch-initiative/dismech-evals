      assertion:
        name: Reduced RLC Ser15 Phosphorylation
        biological_scale: MOLECULAR
        role: effector
        description: 'The regulatory light chain carries a conserved Ser15 phosphorylation site through
          which cardiac myosin light-chain kinase tunes force production. The R58Q allele lowers RLC phosphorylation
          in vivo, and this is allele-selective rather than a general property of HCM-associated RLC variants
          — the N47K allele, studied in the same transgenic series, did not reduce it. The deficit is
          mechanistically load-bearing rather than incidental: substituting an aspartate at the phosphorylation
          site to mimic the phosphorylated state restores force in R58Q-reconstituted fibres.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
