          term:
            id: hgnc:7583
            label: MYL2
        relationship_type: CAUSATIVE
        frequency: Definitive but numerically minor cause of hypertrophic cardiomyopathy; the only screened-cohort
          figure available is for the myosin light chain genes as a class, recorded in case_fractions
          below.
        case_fractions:
        - population: 186 unrelated HCM index patients systematically screened for MYL2 and MYL3
          case_fraction_percent: 1.0
          cohort_size: 186
          notes: The 1% figure the authors state is for the myosin light chain genes as a class (MYL2
            plus MYL3), not for MYL2 alone. In this particular cohort every light chain finding was in
            MYL2 and none in MYL3, so 1% is an upper bound on the MYL2 share here rather than a MYL2-specific
            estimate. Recorded because it is the only systematically screened denominator available.
        - population: 382 unrelated Finnish patients with hypertrophic cardiomyopathy, 59-gene panel
          notes: No MYL2-specific percentage is reported. MYL2 is named as one of four sarcomere genes
            carrying most of the pathogenic findings among the 38.2% of patients with a molecular diagnosis,
            which corroborates that MYL2 is a recurrent but minor contributor rather than quantifying
            its share.
        notes: Both the dominant heterozygous missense arm and the recessive biallelic loss-of-function
          arm are curated on this one gene record, because the gene-disease relationship is single and
          it is the allele class and dose that differ.
      selected_evidence:
        snippet: MYL2 | HGNC:7583 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive
        supports: SUPPORT
