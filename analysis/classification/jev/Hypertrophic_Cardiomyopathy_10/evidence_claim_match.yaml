          value:
            name: AR biallelic LOF
            display_name: Autosomal recessive biallelic loss-of-function light chain myopathy
            description: 'A distinct severe entity rather than an early presentation of the dominant form:
              biallelic loss-of-function MYL2 alleles affecting the last exon, disrupting the second EF-hand
              domain, presenting as a fatal infantile cardioskeletal myopathy with type I fibre hypotrophy.
              The obligate heterozygous parents are unaffected, so this arm and the dominant one differ
              in mechanism and not only in dose. Its discoverers proposed the name "light chain myopathy".
              It is curated as a subtype rather than a separate entry because it is the same gene and
              the same MONDO concept, but note the original pedigrees reported dilated rather than hypertrophic
              cardiomyopathy; if a distinct MONDO term is minted for light chain myopathy, this should
              be revisited as a split.'
          role: subtype
      assertion_type: Phenotype
      assertion:
        name: Cardioskeletal Myopathy with Type I Fibre Disease
        category: Musculoskeletal
        description: Because MYL2 is the regulatory light chain of slow-twitch skeletal muscle as well
          as ventricle, skeletal muscle is a target of the same allele rather than a bystander. The involvement
          was recognised in the original description of light chain disease and is the defining feature
          of the biallelic infantile form, where type I fibres are hypotrophic and myofibrils disorganised.
        subtype: AR biallelic LOF
        phenotype_term:
          preferred_term: Type I muscle fibre hypotrophy with myofibrillar disorganization
          term:
            id: HP:0004303
            label: Abnormal muscle fiber morphology
        notes: The binding is the generic HP:0004303 Abnormal muscle fiber morphology. HPO has no term
          for type I fibre *hypotrophy*; HP:0011807 Type 1 muscle fiber atrophy is the near miss and was
          rejected, because atrophy names shrinkage of a fibre that grew normally and hypotrophy names
          a failure to reach normal size — which is the claim the infantile pedigrees actually make. The
          specific concept is carried in preferred_term instead.
      selected_evidence:
        snippet: A cardioskeletal myopathy with onset and death in infancy, morphological features of
          muscle type I hypotrophy with myofibrillar disorganization and dilated cardiomyopathy was previously
          reported in three Dutch families.
        supports: SUPPORT
