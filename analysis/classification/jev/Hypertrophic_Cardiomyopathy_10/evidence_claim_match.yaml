        - genetic#MYL2
        rationale: 'The recessive pedigrees settle a question the dominant literature cannot: the parents
          of children with biallelic loss-of-function MYL2 disease are obligate heterozygotes for a null-like
          allele, and they had no cardiomyopathy. So losing half the normal gene product does not cause
          hypertrophic cardiomyopathy, and the dominant missense alleles cannot be acting by simple haploinsufficiency.
