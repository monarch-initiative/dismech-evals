      assertion_type: Treatment
      assertion:
        name: Beta Blockade
        description: Beta blockers are the first-line drug for symptomatic obstructive disease, reducing
          heart rate and contractility and lengthening diastolic filling. Non-dihydropyridine calcium
          channel blockers (verapamil, diltiazem) are the second-line alternative when beta blockade is
          ineffective or contraindicated, and disopyramide is added for refractory obstruction, though
          its side effects mean many centres use it as a bridge to septal reduction rather than as durable
          therapy. None of this is MYL2-specific; it is the disease-class therapy a symptomatic carrier
          receives.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: beta-adrenergic antagonist
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
        notes: Not MYL2-stratified. No genotype-directed dosing or agent selection exists for this entity.
      selected_evidence:
        snippet: Beta-blockers, including atenolol and nadolol, are considered the first-line treatment
          due to their ability to reduce heart rate and myocardial contractility and enhance diastolic
          filling.
        supports: SUPPORT
