      - /disease_term
    evidence_metadata:
      reference: PMID:30365366
      reference_title: Slow-twitch skeletal muscle defects accompany cardiac dysfunction in transgenic
        mice with a mutation in the myosin regulatory light chain.
      evidence_source: MODEL_ORGANISM
      explanation: Measures the deficit in soleus and in ventricular papillary muscle of the same animals,
