          responsiveness of contraction. MYL2 disease variants reduce maximal contractile force while
          increasing myofilament calcium sensitivity — the two functional signatures repeatedly observed
          for HCM-associated MYL2 mutations. In transgenic RLC-mutant hearts and slow-twitch muscle, contractile
          force is lower than wild type, consistent with defective force transmission by the mutant lever
          arm.
