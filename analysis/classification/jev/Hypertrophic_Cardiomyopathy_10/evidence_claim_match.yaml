      assertion_type: Pathophysiology
      assertion:
        name: MYL2 Variant in Ventricular Regulatory Myosin Light Chain
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: The initiating lesion in CMH10 is a variant in MYL2, encoding the ventricular regulatory
          myosin light chain (RLC) that binds the lever-arm region of beta-cardiac myosin. In the common
          dominant form the variant is a missense change (archetype R58Q) incorporated into the sarcomere;
          in the rare severe recessive form biallelic loss-of-function abolishes normal RLC. Either way
          the lesion perturbs how the myosin lever arm transmits force and how the myofilament responds
          to calcium.
        genes:
        - preferred_term: MYL2
          term:
            id: hgnc:7583
            label: MYL2
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Sarcomere Organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Myosin thick filament
          term:
            id: GO:0032982
            label: myosin filament
      selected_evidence:
        snippet: MYL2 mutated models of hypertrophic cardiomyopathy may be useful research tools to study
          the molecular, structural, and energetic mechanisms of cardioskeletal myopathy associated with
          myosin RLC
        supports: SUPPORT
    origin:
