        context:
        - path: /treatments/2
          value:
            name: Beta Blockade
            description: Beta blockers are the first-line drug for symptomatic obstructive disease, reducing
              heart rate and contractility and lengthening diastolic filling. Non-dihydropyridine calcium
              channel blockers (verapamil, diltiazem) are the second-line alternative when beta blockade
              is ineffective or contraindicated, and disopyramide is added for refractory obstruction,
              though its side effects mean many centres use it as a bridge to septal reduction rather
              than as durable therapy. None of this is MYL2-specific; it is the disease-class therapy
              a symptomatic carrier receives.
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: beta-adrenergic antagonist
                term:
                  id: NCIT:C29576
                  label: Beta-Adrenergic Antagonist
            notes: Not MYL2-stratified. No genotype-directed dosing or agent selection exists for this
              entity.
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Left Ventricular Diastolic Dysfunction
        treatment_effect: INHIBITS
        description: Slowing the heart lengthens diastole, which is the mechanism by which beta blockade
          acts against impaired filling. The effect is INHIBITS because the node is the dysfunction, and
          the drug counteracts it; it does so by allowing more filling time rather than by improving intrinsic
          myocardial relaxation, which the sarcomeric lesion still governs.
      selected_evidence:
        snippet: Beta-blockers, including atenolol and nadolol, are considered the first-line treatment
          due to their ability to reduce heart rate and myocardial contractility and enhance diastolic
          filling.
        supports: SUPPORT
