      assertion_type: Diagnosis
      assertion:
        name: Genetic Testing Establishing the MYL2 Genotype and Its Allele
        description: 'Molecular testing is what distinguishes CMH10 from any other cause of unexplained
          left ventricular hypertrophy, and in this gene the allele matters as much as the gene: the two
          variants characterised side by side in a systematic light chain screen differed in onset age
          and in sudden-death risk while looking the same on echocardiography. Zygosity must also be established,
          because the biallelic loss-of-function genotype is a different disease with a different prognosis
          and different reproductive counselling.'
      selected_evidence:
        snippet: The mutation Arg58Gln showed also moderate septal hypertrophy, but, in contrast, it was
          associated with an early onset of clinical manifestation and premature sudden cardiac death.
        supports: SUPPORT
