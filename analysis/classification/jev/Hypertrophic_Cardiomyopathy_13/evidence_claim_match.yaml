      assertion_type: Pathophysiology
      assertion:
        name: TNNC1 Missense Variant in Cardiac Troponin C
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: The initiating lesion in CMH13 is a heterozygous missense variant in TNNC1, the gene
          encoding cardiac troponin C (cTnC) — the calcium-sensing subunit of the thin-filament troponin
          complex whose regulatory N-domain binds calcium to initiate contraction. The founding HCM allele
          was L29Q, detected in a patient with hypertrophic cardiomyopathy; the mutant cTnC is incorporated
          into the troponin complex and alters the calcium switch rather than being lost.
        genes:
        - preferred_term: TNNC1
          term:
            id: hgnc:11943
            label: TNNC1
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Sarcomere Organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Troponin complex
          term:
            id: GO:0005861
            label: troponin complex
      selected_evidence:
        snippet: the first mutation in TNNC1, coding for the calcium-binding subunit (cTnC) of cardiac
          troponin, which was detected in a patient with hypertrophic cardiomyopathy
        supports: SUPPORT
