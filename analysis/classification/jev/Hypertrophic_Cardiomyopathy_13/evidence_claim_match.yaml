      reference_title: A mutation in TNNC1-encoded cardiac troponin C, TNNC1-A31S, predisposes to hypertrophic
        cardiomyopathy and ventricular fibrillation.
      evidence_source: IN_VITRO
      explanation: Quantifies the defining functional consequence of an HCM TNNC1 variant — increased
        myofilament calcium sensitivity without a change in maximal force.
