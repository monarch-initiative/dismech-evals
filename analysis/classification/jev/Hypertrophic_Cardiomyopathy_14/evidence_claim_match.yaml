          limitations: 'The species substitution that makes this model good for human MYH7 disease is
            exactly what makes it inapplicable to human MYH6: mouse ventricular myosin is alpha-MHC, human
            ventricular myosin is beta-MHC, so putting a beta-MHC allele into mouse alpha-MHC preserves
