  ea7428300e6d93135fe8fc24a75650f28379768501ae9eaed8a7d2821fa794da:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 14
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 14
            term:
              id: MONDO:0013197
              label: hypertrophic cardiomyopathy 14
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Targeted hypertrophic cardiomyopathy gene panel
        description: 'Molecular diagnosis in HCM uses a targeted gene panel on the proband. The consequence
          of the ClinGen reappraisal for this entity is negative rather than positive: because MYH6 is
          classified Disputed for HCM, a MYH6 variant returned by a panel that still carries the gene
          should not be reported as causative and should not be used for cascade testing in relatives.
          There is consequently no molecular test that establishes CMH14 in a proband — which is a statement
          about the entity, not about the patient, whose hypertrophy is real and is investigated and managed
          as hypertrophic cardiomyopathy either way.'
        notes: The same conclusion was reached empirically, and years before the ClinGen reappraisal,
          by the Italian NGS cohort study, which argued from its own yield data for a narrow rather than
          a broad HCM panel.
      selected_evidence:
        snippet: Our findings support the choice of a limited, well-selected panel of HCM genes as the
          best tool for diagnostic purposes.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
