        measure_type: UNKNOWN
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No population prevalence exists for the MYH6-attributed form of hypertrophic cardiomyopathy,
          and none can responsibly be derived while the gene-disease relationship is Disputed. The only
          quantitative anchors are yields within referral HCM cohorts: MYH6 accounted for 3 of 41 clinically
          selected variants (7.5%) in a 70-patient Italian NGS series, and a MYH6 allele was found in
          1 of 21 HCM probands in an earlier candidate-gene screen. ClinGen judged the variant behind
          that second figure to be common in the population, so even these cohort yields overstate the
          disease-attributable fraction.'
      selected_evidence:
        snippet: TNNT2, CAV3 and MYH6 (3/41 = 7.5% each)
