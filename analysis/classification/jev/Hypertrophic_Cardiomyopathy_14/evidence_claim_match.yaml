        context: []
      assertion_type: Phenotype
      assertion:
        category: Cardiac
        name: Late-Onset Presentation
        description: 'The most reproducible feature of MYH6-attributed HCM is when it is found rather
          than what it looks like. Two independent cohorts converge: the founding variant came from a
          series selected for elderly onset, in which initial symptoms occurred at a mean of 59 years
          and diagnosis at 63 years with no family history of cardiomyopathy; and in a later Italian series
          MYH6 variants appeared only in the late-onset arm, while TNNT2 variants appeared only in the
          early-onset arm. Whether this reflects a genuinely weak-effect allele or the lower genetic yield
          and higher phenocopy rate of elderly HCM cohorts is not resolved, and is the reason a Disputed
          relationship can still show a consistent phenotypic skew.'
        notes: Deliberately carries no phenotype_term. The observation is an age-of-onset statement, and
          HPO encodes onset under HP:0003674 rather than as a phenotypic abnormality, so no term in the
          PhenotypeTerm enum names it. The structured onset data is recorded instead on the Left Ventricular
          Hypertrophy phenotype_term as an OnsetDescriptor (LATE, mean 62.8 years). This node is retained
          because the late-onset skew is the most reproducible observation about the entity and is the
          anchor for a knowledge gap.
        frequency: VERY_FREQUENT
      selected_evidence:
        snippet: Initial symptoms occurred at 59.3 (+/-12.3) years, and diagnosis was made at 62.8 (+/-10.8)
          years.
        supports: SUPPORT
