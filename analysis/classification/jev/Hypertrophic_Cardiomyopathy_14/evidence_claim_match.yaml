        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myh6_late_onset_skew_allele_or_ascertainment
        kind: KNOWLEDGE_GAP
        prompt: Is the late-onset skew of MYH6-attributed hypertrophic cardiomyopathy a property of the
          allele, or an artefact of how elderly-onset HCM cohorts are ascertained?
        attaches_to:
        - phenotypes#Late-Onset Presentation
        rationale: 'The late-onset association is the most reproducible observation about this entity
          — it appears in the founding elderly-onset series and independently in a later cohort designed
          to contrast extreme ages at diagnosis. But the same cohorts show that elderly-onset HCM has
          a far lower genetic yield overall (23% versus 86% in the early-onset arm of the Italian series),
          which is the signature of a group enriched for phenocopies and for variants of small or absent
          effect. A weak-effect allele producing genuinely late disease and a benign variant surfacing
          in a low-yield cohort predict the same observation. Distinguishing them requires case-control
          allele-frequency comparison in age-stratified cohorts rather than more case series, and the
          answer bears directly on whether the Disputed classification should move in either direction.

          The nearest existing approach to that comparison is the ExAC-referenced burden analysis of 7,855
          cardiomyopathy cases, which found MYH6 rare variation indistinguishable from background. It
          does not settle the question here, for a reason worth stating so it is not misread later: MYH6
          appears only in that study''s dilated cardiomyopathy panel and not in its hypertrophic panel,
          and the analysis was not age-stratified. So it constrains the gene''s general credibility rather
          than answering the age question, which remains open.'
      selected_evidence:
        snippet: The mutation detection rate was 85.7% (30/35) in the EO group and 22.9% (8/35) in the
          LO group.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
