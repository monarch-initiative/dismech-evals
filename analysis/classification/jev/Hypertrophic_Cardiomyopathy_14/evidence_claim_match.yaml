        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: myh6_minor_ventricular_isoform_hcm
        hypothesis_label: Minor-ventricular-isoform sarcomere model of MYH6 hypertrophic cardiomyopathy
        status: EMERGING
        description: The proposed model is that a heterozygous missense allele in alpha-MHC alters the
          motor function of the minor myosin isoform of the human ventricle, and that this is sufficient
          to seed the same maladaptive hypertrophic remodeling that beta-MHC (MYH7) alleles produce. The
          model has never been tested directly. No functional study of any HCM-attributed human MYH6 allele
          has been published, ClinGen states outright that the disease mechanism is unknown, and the model
          has to explain why a lesion in the ventricle's minor isoform would produce a ventricular phenotype
          at all. The observed late-onset skew is consistent with a weak-effect allele requiring decades
          of accumulated remodeling, but that is a post-hoc reading, not a tested prediction. This hypothesis
          group is what every pathophysiology edge in this entry belongs to; the entry asserts no established
          MYH6 mechanism.
      selected_evidence:
        snippet: The mechanism for disease remains unknown.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: CGGV:assertion_ee5380a4-0dee-49aa-b911-141502648144-2023-07-12T020000.000Z
      reference_title: MYH6 / hypertrophic cardiomyopathy (Disputed)
      evidence_source: OTHER
      explanation: ClinGen's expert-panel judgement that no disease mechanism is established is the reason
