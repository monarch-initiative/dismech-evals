    evidence_metadata:
      reference: PMID:27532257
      reference_title: Reassessment of Mendelian gene pathogenicity using 7,855 cardiomyopathy cases and
        60,706 reference samples.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Case-excess burden testing against 60,706 ExAC reference samples puts MYH6 rare variation
        at essentially background level, with an odds ratio of 1.06 whose confidence interval spans 1
        and an etiological fraction of 0.06. Scope note, because it is easy to overstate: this row sits
        in the paper''s *dilated* cardiomyopathy panel, and MYH6 does not appear in its hypertrophic cardiomyopathy
        panel at all. It is therefore graded INDIRECT — it shows that MYH6 rare variation is not distinguishable
        from background in a large cardiomyopathy case series, which undermines the gene''s general credibility
        as a cardiomyopathy gene without being a direct measurement of HCM burden.'
