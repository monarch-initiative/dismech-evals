  e9d3233c8f30b456ed6f21d3d62215dd8175d45d1a03c27f53f24ddf6975f3fb:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 14
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 14
            term:
              id: MONDO:0013197
              label: hypertrophic cardiomyopathy 14
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myh6_hcm_allele_functional_effect_unknown
        kind: KNOWLEDGE_GAP
        prompt: Does any HCM-attributed human MYH6 missense allele alter alpha-myosin motor function,
          and if so is the effect large enough to matter in a ventricle where alpha-MHC is the minor isoform?
        attaches_to:
        - pathophysiology#Altered Sarcomere Motor Function
        - mechanistic_hypotheses#myh6_minor_ventricular_isoform_hcm
        rationale: This is the gap that keeps the gene-disease relationship Disputed rather than Limited
          or Moderate. ClinGen states that the mechanism for disease remains unknown, and the reason is
          that no functional characterisation of any HCM-attributed MYH6 allele has been published — the
          supporting functional literature it could find was about alpha-MHC's normal biochemistry, not
          about any patient allele. Because alpha-MHC is a minor ventricular isoform, a demonstrated functional
          effect would also need a dosage argument to explain a ventricular phenotype, so an assay showing
          a change is necessary but not sufficient. A patient-derived iPSC line carrying an MYH6 HCM allele
          already exists and has never been phenotyped as cardiomyocytes, which makes this an unusually
          tractable gap.
        proposed_experiments:
        - experiment_id: exp_myh6_ipsc_cardiomyocyte_phenotyping
          name: Cardiomyocyte phenotyping of the MYH6 G3755A patient iPSC line
          description: 'Differentiate the existing patient-derived iPSC line and an isogenic variant-corrected
            control to ventricular cardiomyocytes and compare contractile and sarcomeric readouts. An
            isogenic control is essential: the line is from a single patient, so any uncorrected comparison
            confounds the allele with genetic background.'
          would_support:
          - pathophysiology#Altered Sarcomere Motor Function
          would_refute:
          - pathophysiology#Altered Sarcomere Motor Function
          supporting_outcome:
          - Variant cardiomyocytes show altered contractile kinetics or sarcomere disorganisation relative
            to the isogenic control, with the effect abolished by correction of the allele.
          refuting_outcome:
          - Variant and isogenic-corrected cardiomyocytes are indistinguishable across contractile and
            sarcomeric readouts, indicating the allele has no measurable effect in a human ventricular-like
            cell.
          perturbations:
          - name: Isogenic correction of the MYH6 G3755A allele
            target: pathophysiology#MYH6 Missense Variant in Alpha-Myosin Heavy Chain
            effect: DECREASED
            gene:
              preferred_term: MYH6
              term:
                id: hgnc:7576
                label: MYH6
            description: CRISPR correction of the patient allele to wild type in the derived iPSC line,
              giving an isogenic control that differs only at the variant site.
          readouts:
          - name: Sarcomere organisation in differentiated cardiomyocytes
            target: pathophysiology#Altered Sarcomere Motor Function
            interpretation: Disorganisation in the variant line relative to its isogenic control would
              be the first functional evidence for any HCM-attributed MYH6 allele.
      selected_evidence:
        snippet: The mechanism for disease remains unknown.
        supports: SUPPORT
    origin:
