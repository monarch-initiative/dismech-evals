  76f76e54a575c1669a66010d6fa2c24ffe4be38b0c82cd7f58e0025bed4e50d5:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 14
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 14
            term:
              id: MONDO:0013197
              label: hypertrophic cardiomyopathy 14
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myh6_mouse_myh6_r403q_is_myh7_disease
        kind: HUMAN_MODEL_MISMATCH
        prompt: The reference mouse models of hypertrophic cardiomyopathy carry their mutations in Myh6.
          Does that make them models of human MYH6 disease?
        attaches_to:
        - pathophysiology#MYH6 Missense Variant in Alpha-Myosin Heavy Chain
        - animal_models#alpha-MHC 403/+ mouse (Myh6 R403Q knock-in)
        rationale: 'No, and the mismatch is a species-level isoform switch that is easy to miss because
          the gene symbol matches. The human ventricle runs predominantly on beta-MHC (MYH7) with alpha-MHC
          as a minor component; the mouse ventricle runs on alpha-MHC. To model a human MYH7 ventricular
          allele faithfully in a mouse, the field therefore put the human MYH7-derived R403Q substitution
          into mouse Myh6 — preserving the ventricular context by changing the gene. The resulting alpha-MHC
          403/+ mouse and its descendants, including allele-specific silencing work targeting mutant Myh6
          transcripts, form a large and influential literature indexed under Myh6 and hypertrophic cardiomyopathy
          that is substantively about MYH7 biology.

          This matters concretely for curation. A text- or database-driven search for MYH6 model evidence
          returns these mice first, and they look like strong support: the phenotype is convincing, the
          gene symbol is right, and the disease term is right. ClinGen reviewed them and declined to score
          them for exactly this reason. Any future strengthening of the MYH6-HCM relationship has to come
          from human alleles or from a model built on a human MYH6 allele, not from this body of work.'
      selected_evidence:
        snippet: heavy chain beta was found to be a major component of ventricular myosin and a minor
          component of atrial myosin
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
