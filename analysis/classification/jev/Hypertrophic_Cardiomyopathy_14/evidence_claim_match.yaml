          substitution intended to model human MYH7 disease faithfully, not to model human MYH6 disease
          at all. ClinGen reviewed these mice and explicitly declined to score them as MYH6 evidence.
          Because a naive text search for "Myh6" plus "hypertrophic cardiomyopathy" retrieves this large
          and influential literature first, leaving it unrecorded would invite exactly the misattribution
          it represents.'
