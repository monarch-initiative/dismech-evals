        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myh6_cooccurring_established_gene_variants
        kind: KNOWLEDGE_GAP
        prompt: How much of the reported MYH6 hypertrophic cardiomyopathy signal survives once probands
          carrying a variant in an established HCM gene are excluded?
        attaches_to:
        - pathophysiology#MYH6 Missense Variant in Alpha-Myosin Heavy Chain
        - phenotypes#Sudden Cardiac Death
        rationale: Co-occurrence is the dominant confounder in this literature rather than an occasional
          complication. ClinGen excluded reported MYH6 variants from scoring on the grounds that the proband
          also carried a variant in another HCM gene, in three separate publications — a Japanese family
          with a MYH6 frameshift alongside an MYH7 missense variant, a multi-omics pedigree study in which
          the MYH6 carrier also carried a TNNT2 variant, and part of the Italian NGS series. In each case
          the severe phenotype is at least as attributable to the established gene. What remains after
          those exclusions is three probands, and that residue is the whole quantitative basis of the
          entity.
      selected_evidence:
        snippet: The proband of Family 1 and his father carried TNNT2-rs397516484 and MYH6-rs372446459
          missense mutations
        supports: SUPPORT
        directness: INDIRECT
