  86fac52a7bbe1d05a900cac4065e1f556fe6ad42b19343a415bc627a3438a66a:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 14
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 14
            term:
              id: MONDO:0013197
              label: hypertrophic cardiomyopathy 14
        context: []
      assertion_type: Genetic
      assertion:
        name: MYH6
        gene_term:
          preferred_term: MYH6
          term:
            id: hgnc:7576
            label: MYH6
        relationship_type: DISPUTED
        notes: 'MYH6 encodes the alpha-cardiac myosin heavy chain, the actin-based sarcomeric motor that
          is the dominant myosin of the human atrium and a minor component of the human ventricle. It
          lies in a tandem pair with MYH7 on chromosome 14q11.2. Its attribution as a cause of hypertrophic
          cardiomyopathy is ClinGen Disputed; its attribution to congenital heart defects is ClinGen Definitive,
          and to dilated cardiomyopathy Limited. The reported HCM alleles are heterozygous missense changes,
          with one frameshift reported in a family that also carried an MYH7 missense variant.

          Variant-level record, which for a disputed entity is the argument rather than a detail. The
          alleles attributed to HCM are p.Gln1065His (Carniel 2005, excluded from ClinGen scoring as too
          common in the population), the alpha-cardiac myosin heavy chain missense variant reported in
          the elderly-onset series (Niimura 2002), c.G3755A (Wang 2020, the iPSC line donor), rs372446459
          (Liu 2021, co-occurring with a TNNT2 variant), and p.Lys364fs (Suzuki 2022, co-occurring with
          an MYH7 missense variant). Set against these, the best-supported human MYH6 variant of any kind
          is p.Arg721Trp, and its phenotype is sick sinus syndrome rather than hypertrophy.'
      selected_evidence:
        snippet: MYH6 gene encodes alpha heavy chain subunit of cardiac myosin (MHC-α), which are actin-based
          molecular motors that convert chemical energy released from the hydrolysis of ATP.
        supports: SUPPORT
