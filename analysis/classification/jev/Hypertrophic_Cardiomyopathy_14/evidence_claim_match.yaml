            it became the reference HCM model.
          limitations: Faithful to sarcomeric HCM in general, not to MYH6 attribution in particular. The
            allele is MYH7-derived and the gene is the mouse's orthologous ventricular isoform, so the
            model speaks to the downstream remodeling node only.
