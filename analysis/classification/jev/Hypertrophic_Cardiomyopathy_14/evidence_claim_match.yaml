            name: Cardiac Myosin Inhibition
            description: 'Mavacamten and aficamten are allosteric cardiac myosin inhibitors that reduce
              actin-myosin cross-bridge formation and relieve dynamic outflow obstruction, each with a
              positive phase III trial in symptomatic obstructive HCM.

              Worth stating plainly for this entity: these drugs act on beta-cardiac myosin, the MYH7
              product that dominates the human ventricle. They are not targeted at the alpha-myosin this
              entry is named for. That is not a reason to withhold them from a patient with obstructive
              HCM — the indication is physiological, not genotypic — but it does mean the one mechanistically
              targeted therapy in HCM targets the other myosin, which is the same isoform asymmetry that
              makes the MYH6 attribution doubtful in the first place.'
            therapeutic_modality: SMALL_MOLECULE
