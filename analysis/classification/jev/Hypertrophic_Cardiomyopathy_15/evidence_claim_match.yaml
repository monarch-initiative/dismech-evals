      - /disease_term
    evidence_metadata:
      reference: PMID:30681346
      reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
      evidence_source: HUMAN_CLINICAL
      explanation: Sets the general problem this entry is an instance of. INDIRECT because the abstract
