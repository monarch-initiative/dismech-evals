            term:
              id: MONDO:0013200
              label: hypertrophic cardiomyopathy 15
        context: []
      assertion_type: Genetic
      assertion:
        name: VCL
        presence: PRESENT
        relationship_type: DISPUTED
        variant_origin: GERMLINE
        gene_term:
          preferred_term: VCL
          term:
            id: hgnc:12665
            label: VCL
        notes: 'VCL encodes vinculin and, through inclusion of the alternatively spliced exon 19, the
          muscle-restricted isoform metavinculin. Two classes of variant have been attributed to hypertrophic
          cardiomyopathy, in different parts of the protein: p.Leu277Met in a region shared by both isoforms,
          and exon-19 substitutions (p.Ala934Val, p.Pro943Ala, p.Arg975Trp) falling inside the 68-residue
          metavinculin-specific insert. p.Arg975Trp is the best characterized and had already been reported
          in dilated cardiomyopathy, so one substitution has been assigned to both remodelling directions.

          relationship_type is DISPUTED, the enum value corresponding to ClinGen "Disputed" or "Refuted".
          CAUSATIVE would be wrong: it is defined as ClinGen Definitive or Strong, and a prose caveat
          under a CAUSATIVE value would not survive export, query, or any consumer that reads the structured
          field rather than this note. MONDO and OMIM do assert the entity; that assertion is carried
          by the entry existing and by disease_term, not by overstating this slot. ClinGen classifies
          VCL-hypertrophic cardiomyopathy as Disputed (Hereditary Cardiovascular Disease GCEP, 2023-05-10,
          changed from Limited) while rating VCL-dilated cardiomyopathy Strong (Dilated Cardiomyopathy
          GCEP, 2024-08-09). A VCL variant found in a cardiomyopathy proband is therefore interpretable
          for dilated cardiomyopathy and not for hypertrophic cardiomyopathy. See the REFUTE evidence
          below and the discussions section; do not cite this block as support for clinical reporting
          of a VCL variant in a hypertrophic cardiomyopathy case.'
      selected_evidence:
        snippet: In summary, the evidence supporting the relationship between VCL and autosomal dominant
          hypertrophic cardiomyopathy has been disputed and no valid evidence remains to support the claim.
        supports: REFUTE
