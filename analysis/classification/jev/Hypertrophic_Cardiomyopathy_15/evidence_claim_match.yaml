        context: []
      assertion_type: Diagnosis
      assertion:
        name: Genetic testing, and why VCL should not be reported for hypertrophic cardiomyopathy
        diagnosis_term:
          preferred_term: Genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: This is the practically important entry on the whole record. VCL appears on many
          commercial cardiomyopathy panels, so a rare VCL missense variant will be found in hypertrophic
          cardiomyopathy probands and can be reported against OMIM's CMH15 entry. ClinGen's expert panel
          has classified that relationship as Disputed, having found that the two originally reported
          variants exceed the panel's gnomAD frequency ceiling for pathogenicity and that no new evidence
          has emerged since ClinGen's initial curation. A VCL variant is therefore not a molecular diagnosis
          of hypertrophic cardiomyopathy, must not be used for predictive testing or cascade screening
          in a hypertrophic family, and should not end the diagnostic search. The same variant found in
          a dilated presentation is a different matter, since ClinGen rates VCL-dilated cardiomyopathy
          Strong.
        results: A VCL variant in a hypertrophic cardiomyopathy proband is uninformative and should be
          treated as such; the finding does not establish a molecular diagnosis or support cascade testing.
      selected_evidence:
        snippet: The majority of genes previously reported as causative of HCM and commonly included in
          diagnostic tests have limited or no evidence of disease association.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/1
      context_paths:
