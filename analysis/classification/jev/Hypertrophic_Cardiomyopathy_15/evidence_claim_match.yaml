            term:
              id: MONDO:0013200
              label: hypertrophic cardiomyopathy 15
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: VCL Missense Variant in Vinculin or the Metavinculin Insert
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: The proposed initiating lesion is a heterozygous germline missense substitution in
          VCL. Two locations have been implicated and they are not equivalent. p.Leu277Met lies in a region
          present in both vinculin and metavinculin, so it would perturb the ubiquitous protein as well
          as the cardiac isoform. p.Ala934Val, p.Pro943Ala and p.Arg975Trp lie inside the 68-residue insert
          encoded by exon 19, which is present only in metavinculin, so their effect is restricted to
          cardiac and smooth muscle. Whether either class is pathogenic in hypertrophic cardiomyopathy
          is disputed, which is why this node and everything downstream of it are marked HYPOTHETICAL.
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          allele_type: MISSENSE
          functional_impact_category: GAIN_OF_FUNCTION
          notes: 'GAIN_OF_FUNCTION follows ClinGen''s reading of the biochemical data: the mutant metavinculin
            tails do not simply lose their inhibitory function, they acquire the ability to drive formation
            of large disordered actin assemblies that neither wild-type isoform produces. Note that this
            is the mechanism proposed for the exon-19 insert variants; no functional characterization
            of p.Leu277Met has been published, so the category is extrapolated to that allele rather than
            measured for it.'
        genes:
        - preferred_term: VCL
          term:
            id: hgnc:12665
            label: VCL
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: 'The mechanism for disease is believed to be gain-of-function, with mutants both failing
          to induce F-actin binding and promoting formation of large actin assemblies with linear bundles
          (PMID: 30844403).'
        supports: SUPPORT
