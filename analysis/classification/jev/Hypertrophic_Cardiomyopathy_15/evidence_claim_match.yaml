          is not: the same pattern was subsequently found in obstructive hypertrophic cardiomyopathy without
          a VCL variant and in aortic stenosis, and was absent in dilated, hypertensive and pulmonary-hypertensive
          hearts, so it segregates with outflow obstruction and not with genotype.'
