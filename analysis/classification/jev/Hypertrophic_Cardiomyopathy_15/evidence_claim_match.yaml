      assertion:
        name: Sarcomeric (myofilament) hypertrophic cardiomyopathy
        disease_term:
          preferred_term: hypertrophic cardiomyopathy
          term:
            id: MONDO:0005045
            label: hypertrophic cardiomyopathy
        description: The overwhelmingly more likely explanation for hypertrophic cardiomyopathy in any
          given proband, and the diagnosis that should be pursued before a VCL variant is entertained.
          Only eight genes have definitive evidence for hypertrophic cardiomyopathy, all encoding sarcomeric
          proteins. Both CMH15 probands were drawn from cohorts already screened negative for these, which
          is the only reason a VCL variant was looked for at all.
        distinguishing_features:
        - A pathogenic variant in MYBPC3, MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2 or MYL3
        - Reverse-curvature septal morphology rather than the sigmoidal contour reported for the Z-disc
          class
        - Myocyte disarray on histology
      selected_evidence:
        snippet: Of 33 HCM genes, only 8 (24%) were categorized as definitive ( MYBPC3, MYH7, TNNT2, TNNI3,
          TPM1, ACTC1, MYL2, and MYL3); 3 had moderate evidence ( CSRP3, TNNC1, and JPH2; 33%); and 22
          (66%) had limited (n=16) or no evidence (n=6).
        supports: SUPPORT
