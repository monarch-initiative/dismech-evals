      reference_title: Obstructive hypertrophic cardiomyopathy is associated with reduced expression of
        vinculin in the intercalated disc.
      evidence_source: HUMAN_CLINICAL
      explanation: Refutes the inference that intercalated-disc vinculin depletion is caused by the VCL
        variant. The same pattern occurs in obstructive hypertrophic cardiomyopathy without a VCL variant
        and in aortic stenosis, so it tracks outflow obstruction and cannot corroborate a VCL-specific
        lesion.
