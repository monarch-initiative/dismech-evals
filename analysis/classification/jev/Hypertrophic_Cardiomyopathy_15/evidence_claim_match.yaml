        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmh15_model_allele_class_mismatch
        prompt: Can vinculin-deficiency models say anything about a disease proposed to act by gain of
          function?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Cardiomyocyte Force Transmission
        - animal_models#Cardiomyocyte-specific vinculin knockout mouse (cVclKO)
        - animal_models#Heterozygous vinculin knockout mouse (Vin+/-)
        rationale: 'Every in vivo vinculin model in existence removes protein: a cardiomyocyte null, a
          heterozygous null. They agree with each other and with human loss-of-function VCL variants in
          producing dilation, arrhythmia and sudden death rather than hypertrophy. The mechanism proposed
          for CMH15 is the opposite in kind - mutant metavinculin that fails to restrain vinculin and
          actively drives disordered actin assembly, which ClinGen reads as gain of function. So the models
          are informative about what vinculin does and uninformative about what a CMH15 allele does, and
          their failure to produce hypertrophy is weak evidence against the hypothesis rather than strong
          evidence against it. There is a second, smaller mismatch stacked on the first: metavinculin
          makes up a much larger share of the combined vinculin pool in human than in mouse heart, so
          any insert-specific effect is attenuated in mouse regardless of allele.'
      selected_evidence:
        snippet: we developed a mouse model with cardiac-myocyte-specific inactivation of the vinculin
          (Vcl) gene by using Cre-loxP technology
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17785437
      reference_title: Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions,
        causing sudden death or dilated cardiomyopathy.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the allele class of the principal in vivo model as an inactivation, which
