              label: hypertrophic cardiomyopathy 15
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide published cases
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No population prevalence estimate exists, and none can be derived, because the gene-disease
          relationship is disputed. The entire published case base is two unrelated probands, both reported
          by one group in 2006 from Mayo Clinic hypertrophic cardiomyopathy cohorts that had already been
          screened negative for the common myofilament genes. The denominators are informative even though
          the numerator is not: one novel VCL missense variant in 228 genotype-negative probands, and
          three non-synonymous exon-19 variants across four patients among 389 clinically diagnosed probands,
          of which one (R975W) was carried forward as causal. A separate Z-disc series from the same centre
          found VCL variants in 2 of 239 myofilament-negative probands; whether those are the same two
          probands is not stated, and the cohorts overlap.'
      selected_evidence:
        snippet: Although variants in this gene have been reported in only two probands with hypertrophic
          cardiomyopathy, an association with dilated cardiomyopathy (DCM) has been assessed separately
          with a higher number or reported probands.
        supports: SUPPORT
    origin:
