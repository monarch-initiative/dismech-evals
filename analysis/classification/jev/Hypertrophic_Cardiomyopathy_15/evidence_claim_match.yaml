      assertion:
        name: VCL-related dilated cardiomyopathy
        disease_term:
          preferred_term: dilated cardiomyopathy
          term:
            id: MONDO:0005021
            label: dilated cardiomyopathy
        description: The same gene, and in the case of p.Arg975Trp the same substitution, with the opposite
          remodelling direction and a far stronger evidence base. Loss-of-function VCL variants are the
          well-supported class here, presenting in infancy with severe systolic dysfunction and dilation.
          This is the first alternative to consider when a VCL variant is found, because it is the interpretation
          the evidence supports.
        distinguishing_features:
        - Dilated, thin-walled left ventricle with reduced ejection fraction rather than hypertrophy with
          outflow obstruction
        - Typically truncating or frameshift VCL alleles rather than missense
        - Frequently infantile onset, with recovery of ventricular function by early childhood in most
          of a paediatric series - no counterpart in hypertrophic disease
        - ClinGen rates the gene-disease relationship Strong rather than Disputed
      selected_evidence:
        snippet: This case series identified a unique phenotype of HF with reduced ejection fraction at
          presentation that evolved to HF with recovered EF in over 80% of infant DCM cases with LOF VCL
          variants.
        supports: SUPPORT
