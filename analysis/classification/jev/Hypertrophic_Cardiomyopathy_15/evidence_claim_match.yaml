            term:
              id: MONDO:0013200
              label: hypertrophic cardiomyopathy 15
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Cardiomyocyte Force Transmission
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'Consequence of a mis-built actin-membrane anchor: contractile force generated by
          the sarcomere is transmitted less efficiently to neighbouring myocytes and to the extracellular
          matrix. That vinculin loss impairs myocyte mechanics is measured rather than assumed - vinculin-deficient
          mouse myocytes have reduced membrane cortical stiffness, wider myofilament lattice spacing and
          reduced systolic transverse strain in vivo, all before global ventricular dysfunction appears.
          What is not measured is the same for a CMH15 allele: those experiments use vinculin deletion,
          whereas the human variants proposed here are missense changes acting by gain of function, so
          the mechanical consequence is transferred across allele classes. The node is marked HYPOTHETICAL
          for that reason rather than for lack of any evidence.'
        biological_processes:
        - preferred_term: cardiac muscle contraction
          term:
            id: GO:0060048
            label: cardiac muscle contraction
          modifier: ABNORMAL
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: MRI revealed significantly decreased systolic strains transverse to the myofiber axis
          in vivo, but no changes along the muscle fibers or in fiber tension in papillary muscles from
          heterozygous global Vcl null mice.
        supports: SUPPORT
        directness: INDIRECT
    origin:
