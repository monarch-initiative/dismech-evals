  fe79ceb3963b38483a2416dc3eec92dfcc19d581633dc67a14c7984360d59420:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 15
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 15
            term:
              id: MONDO:0013200
              label: hypertrophic cardiomyopathy 15
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmh15_gene_disease_validity_disputed
        prompt: Does VCL cause hypertrophic cardiomyopathy at all, or is CMH15 an entity built on two
          2006 case reports that later evidence has undercut?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#VCL
        - pathophysiology#VCL Missense Variant in Vinculin or the Metavinculin Insert
        - disease#Hypertrophic Cardiomyopathy 15
        rationale: 'This is the entity''s central open question and the reason every node upstream of
          the hypertrophy is marked HYPOTHETICAL or PROVISIONAL. The supporting case is two probands,
          both from one centre in 2006, both ascertained by sequencing a candidate gene in a myofilament-negative
          cohort, neither with segregation data. Three things have since worked against it. The two implicated
          variants are commoner in gnomAD than a rare dominant cardiomyopathy allele can be. The corroborating
          histology - vinculin depleted at the intercalated disc - was shown by the same group to occur
          in obstructive hypertrophic cardiomyopathy without a VCL variant and in aortic stenosis, so
          it marks obstruction rather than genotype. And the one variant carried forward as causal, p.Arg975Trp,
          had already been reported in dilated cardiomyopathy, which is the phenotype VCL is actually
          well supported for. ClinGen moved the classification from Limited to Disputed in 2023 and recorded
          that no new evidence had emerged since its own initial curation. Note that "initial curation"
          there is a ClinGen curation event, not the 2006 publications - the panel records an intervening
          HCM GCEP recuration on 04/06/21.

          Note what is not in dispute: metavinculin biochemistry. That the insert variants destabilize
          the inhibitory sub-domain and produce disordered actin assemblies is measured, reproducible,
          and structurally rationalized. The gap is between that biochemistry and the human hypertrophic
          phenotype, not within it. A mechanism can be real and still not be this disease''s mechanism.'
        proposed_experiments:
        - experiment_id: cmh15_knockin_mouse
          name: Metavinculin insert knock-in mouse carrying a CMH15 allele
          description: Generate a knock-in mouse carrying p.Arg975Trp or an equivalent exon-19 insert
            substitution at the endogenous Vcl locus, and phenotype it for wall thickness, outflow gradient,
            chamber dimensions and intercalated-disc ultrastructure, unstressed and after pressure loading.
            Every existing mouse model deletes vinculin, so none of them can test a gain-of-function missense
            hypothesis, and the two that exist both produce dilation rather than hypertrophy. Mouse hearts
            express proportionally less metavinculin than human hearts, so a negative result would need
            that caveat attached.
          decision_criterion: Hypertrophy with outflow obstruction in the knock-in would supply the in
            vivo support the relationship has never had. A dilated or absent cardiac phenotype would align
            the allele with the loss-of-function models and further weaken the hypertrophic attribution.
          would_support:
          - pathophysiology#VCL Missense Variant in Vinculin or the Metavinculin Insert
          would_refute:
          - pathophysiology#VCL Missense Variant in Vinculin or the Metavinculin Insert
        - experiment_id: cmh15_case_control_burden
          name: Rare-variant burden of VCL exon 19 in large hypertrophic cardiomyopathy cohorts
          description: Test whether rare metavinculin-insert variants are enriched in sarcomere-negative
            hypertrophic cardiomyopathy probands relative to ancestry-matched population controls, in
            the large sequenced cohorts that did not exist in 2006. This is the direct answer to ClinGen's
            stated objection, which is a frequency argument, and burden analysis is the design that distinguishes
            a genuinely rare pathogenic allele class from a gene that is merely long and polymorphic.
          decision_criterion: Significant case excess of rare exon-19 variants would move the relationship
            off Disputed. No excess would settle it as a non-cause.
          would_refute:
          - genetic#VCL
      selected_evidence:
        snippet: More evidence is needed to either support or entirely refute the role VCL plays in this
          disease.
        supports: SUPPORT
