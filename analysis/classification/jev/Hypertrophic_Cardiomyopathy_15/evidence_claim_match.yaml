  b0eff658fdb580a7b1ec29d627c5c9e5c3fe119dc66e983f5e103043f311ac7a:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 15
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 15
            term:
              id: MONDO:0013200
              label: hypertrophic cardiomyopathy 15
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Obstructive hypertrophy of other cause, including aortic stenosis
        description: 'Included because of the specific trap this entity sets. Intercalated-disc depletion
          of vinculin and metavinculin was the histological finding used to corroborate the VCL attribution
          in both probands, and it turns out to be a feature of outflow obstruction rather than of VCL
          genotype: the same pattern appears in obstructive hypertrophic cardiomyopathy generally and
          in aortic stenosis, and is absent in dilated, hypertensive and pulmonary-hypertensive hearts.
          The finding therefore cannot be used to distinguish CMH15 from any other obstructive lesion,
          and should not be treated as a diagnostic marker.'
        distinguishing_features:
        - None histologically - the intercalated-disc vinculin pattern is shared, which is the point of
          this entry
        - Aortic stenosis is distinguished by valve morphology and the level of the gradient on imaging,
          not by vinculin staining
      selected_evidence:
        snippet: Tissue specimens derived from patients with obstructive HCM and aortic stenosis (AS)
          showed a universal defect of vinculin/metavinculin expression in the intercalated disc but preserved
          expression in the cardiac Z-disc
        supports: SUPPORT
