      assertion_type: AnimalModel
      assertion:
        name: Cardiomyocyte-specific vinculin knockout mouse (cVclKO)
        species: Mouse
        genotype: Vcl conditional null, cardiomyocyte-restricted Cre-loxP excision
        publication: PMID:17785437
        description: Cre-loxP deletion of Vcl in cardiomyocytes. Half the animals died suddenly before
          three months from ventricular tachycardia with preserved contractile function; survivors developed
          dilated cardiomyopathy and died before six months. Ultrastructure before dysfunction showed
          dissolution of the intercalated disc, reduced cadherin and beta-1D integrin, and connexin-43
          mislocalized to the lateral border.
        modeled_mechanisms:
        - target: Disrupted Intercalated Disc and Costamere Anchorage
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Establishes in vivo that removing cardiomyocyte vinculin dismantles exactly the
            junctions this node names, and that it does so before any contractile phenotype appears.
          limitations: 'A complete tissue-specific null, not a missense allele: it models absence of vinculin,
            whereas the CMH15 variants are proposed to act by gain of function through mutant metavinculin.
            Mouse hearts also express less metavinculin relative to vinculin than human hearts do, so
            an insert-specific effect is under-represented in this system.'
        - target: Maladaptive Left Ventricular Hypertrophy
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: The most informative negative result for this entity. Losing cardiomyocyte vinculin
            in vivo produces arrhythmic sudden death and then a dilated ventricle. It does not produce
            hypertrophy.
          limitations: 'The failure is not decisive against a hypertrophic mechanism, because the allele
            is wrong for the question: a null cannot test a gain-of-function missense hypothesis, and
            the opposite remodelling direction is what loss-of-function VCL alleles produce in humans
            too. The result constrains what can be inferred from vinculin-deficiency models about hypertrophy,
            and no CMH15 knock-in mouse exists to answer the question properly.'
      selected_evidence:
        snippet: This is the first report of tissue-specific inactivation of the Vcl gene and shows that
          it is required for preservation of normal cell-cell and cell-matrix adhesive structures.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
