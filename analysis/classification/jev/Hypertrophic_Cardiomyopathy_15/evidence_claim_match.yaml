      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Intercalated Disc and Costamere Anchorage
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'Vinculin and metavinculin are structural components of the junctions where cardiomyocyte
          actin is anchored: the intercalated disc, which couples adjacent myocytes end to end, and the
          costamere, which couples the myofibril laterally to the sarcolemma and extracellular matrix.
          Myectomy tissue from both reported probands showed vinculin and metavinculin markedly reduced
          at the intercalated disc with normal Z-disc staining, and the earlier metavinculin work had
          shown altered intercalated-disc organization in vivo. The specificity of that finding is the
          weak point of the chain rather than its existence; see the REFUTE evidence on this node.'
        biological_processes:
        - preferred_term: adherens junction organization
          term:
            id: GO:0034332
            label: adherens junction organization
          modifier: ABNORMAL
        - preferred_term: cell-matrix adhesion
          term:
            id: GO:0007160
            label: cell-matrix adhesion
          modifier: ABNORMAL
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Tissue specimens derived from patients with obstructive HCM and aortic stenosis (AS)
          showed a universal defect of vinculin/metavinculin expression in the intercalated disc but preserved
          expression in the cardiac Z-disc
        supports: REFUTE
