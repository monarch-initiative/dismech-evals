        target: Arrhythmia
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Disordered calcium release is the substrate for the arrhythmic vulnerability and
          conduction disease seen in carriers, and the steps between the two are identified rather than
          assumed. Spontaneous sarcoplasmic reticulum calcium release appears as cell-wide calcium waves;
          these activate the sodium-calcium exchanger, which generates delayed afterdepolarizations, and
          the resulting triggered activity is the arrhythmia. This was worked out for the E169K allele,
          found in hypertrophic cardiomyopathy patients with juvenile-onset paroxysmal atrial fibrillation
          and modelled in pseudoknock-in mice.
