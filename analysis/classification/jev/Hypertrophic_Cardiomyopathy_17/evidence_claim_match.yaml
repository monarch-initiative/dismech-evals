      assertion_type: Pathophysiology
      assertion:
        name: Dyad Disruption and Uncoupling of the L-Type Channel from the Ryanodine Receptor
        description: The cardiac dyad exists so that calcium entering through the L-type channel reaches
          the ryanodine receptor at a high enough local concentration to trigger sarcoplasmic reticulum
          calcium release. Widening or disorganizing that junction breaks the trigger. In JPH2-silenced
          myocytes the calcium transient loses its dependence on L-type channel activation, which is the
          signature of a broken structural coupling rather than of a channel that has itself stopped working.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Release of sequestered calcium into cytosol by sarcoplasmic reticulum
          term:
            id: GO:0014808
            label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
          modifier: DECREASED
      selected_evidence:
        snippet: the mutant cardiac myocytes exhibit impaired formation of peripheral couplings and arrhythmic
          Ca2+ signaling caused by functional uncoupling between dihydropyridine and ryanodine receptor
          channels
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
