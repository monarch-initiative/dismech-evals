              label: hypertrophic cardiomyopathy 17
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Junctophilin-2 Structural Deficit
        description: 'Junctophilin-2 spans the narrow gap of the cardiac dyad, anchoring in the sarcoplasmic
          reticulum membrane and binding the plasma membrane, so that the junctional membrane complex
          is physically held together. Both routes documented in human disease reduce the amount of functional
          protein at that junction: missense variants at key functional domains reorganize the protein,
          and JPH2 expression is itself reduced in myocardium from patients with hypertrophic cardiomyopathy.
          The lesion is architectural rather than contractile - nothing about the sarcomere''s force-generating
          machinery is directly altered.'
        biological_scale: MOLECULAR
        cellular_components:
        - preferred_term: Junctional sarcoplasmic reticulum membrane
          term:
            id: GO:0014701
            label: junctional sarcoplasmic reticulum membrane
      selected_evidence:
        snippet: each human mutation caused (i) protein reorganization of junctophilin-2
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17509612
      reference_title: Mutations in JPH2-encoded junctophilin-2 associated with hypertrophic cardiomyopathy
