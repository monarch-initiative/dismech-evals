      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dyad_architecture_not_sarcomere
        hypothesis_label: CMH17 arises from dyad architectural failure rather than altered sarcomeric
          cross-bridge kinetics
        status: CANONICAL
        description: The eight definitive HCM genes encode sarcomeric proteins, and the dominant model
          of HCM is altered actin-myosin cross-bridge kinetics with increased myofilament calcium sensitivity.
          JPH2 encodes no part of the sarcomere. The proposed mechanism for CMH17 is instead that loss
          of the junctophilin-2 bridge widens or disorganizes the dyad, uncouples the L-type channel from
          the ryanodine receptor, and drives hypertrophy through disordered calcium signalling. The chain
          is supported by a knockout model, by siRNA silencing sufficient to produce hypertrophy in isolation,
          and by functional characterisation of the three original human variants. What it does not yet
          have is direct demonstration of dyad ultrastructural disruption in myocardium from a genotyped
          human CMH17 patient, so the human step of the argument rests on reduced JPH2 protein in HCM
          tissue rather than on imaging the junction itself.
      selected_evidence:
        snippet: The molecular and functional evidence implicates defective junctophilin-2 and disrupted
          calcium signaling as a novel pathogenic mechanism for HCM
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
