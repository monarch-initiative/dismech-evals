  24129ca857e1a97e2d59861e8af1381d03e019164fab54b5389e4a5080ed6590:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 17
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 17
            term:
              id: MONDO:0013474
              label: hypertrophic cardiomyopathy 17
        context: []
      assertion_type: Genetic
      assertion:
        name: JPH2
        association: Causal
        gene_term:
          preferred_term: JPH2
          term:
            id: hgnc:14202
            label: JPH2
        notes: 'Heterozygous JPH2 missense variants are reported in HCM: S101R, Y141H and S165F in three
          of 388 unrelated probands (Landstrom et al), G505S with a statistically significant case-control
          excess in a Japanese cohort (Matsushita et al), and the Finnish founder allele c.482C>A p.(Thr161Lys)
          segregating across nine families (Vanninen et al). ClinGen''s Hereditary Cardiovascular Disease
          Gene Curation Expert Panel grades JPH2 for autosomal dominant HCM as Moderate. Separately, JPH2
          is graded Strong for autosomal recessive dilated cardiomyopathy and Limited for autosomal dominant
          DCM by the Dilated Cardiomyopathy GCEP, so allele and inheritance pattern both matter to interpretation.
          The 2024 HCM reappraisal left JPH2 at Moderate rather than downgrading it, so that grade is
          current.

          Allele matters to phenotype as well as to validity. E169K was found in 2 of 203 unrelated HCM
          probands screened by Beavers et al, both with juvenile-onset paroxysmal atrial fibrillation
          - an index case whose fibrillation began at 22, before significant atrial remodeling, and his
          father, who had supraventricular tachycardia. A405S, identified in the same cohort, was not
          associated with atrial arrhythmia, and neither were the previously reported HCM alleles. The
          arrhythmic phenotype of this entry is therefore an E169K observation rather than a general property
          of JPH2-associated HCM.'
      selected_evidence:
        snippet: Screening 203 unrelated hypertrophic cardiomyopathy patients uncovered a novel JPH2 missense
          mutation (E169K) in 2 patients with juvenile-onset paroxysmal AF (pAF).
        supports: SUPPORT
