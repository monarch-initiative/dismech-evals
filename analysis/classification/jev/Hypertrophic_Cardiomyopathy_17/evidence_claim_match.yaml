      assertion_type: Pathophysiology
      assertion:
        name: Disordered Intracellular Calcium Handling
        description: 'Calcium transients are reduced in amplitude and sarcoplasmic reticulum stores are
          depleted. Because intracellular calcium is simultaneously the contractile trigger and the input
          to hypertrophic signalling, this node is modelled as the shared origin of both clinical arms
          - the hypertrophic remodelling and the arrhythmic vulnerability.

          That shared origin is the canonical reading, not a settled one. Beavers et al argue the opposite
          for E169K specifically: they attribute its arrhythmogenicity to reduced JPH2-RyR2 binding while
          stating that HCM development in JPH2 disease likely involves other cellular mechanisms still
          to be explored. Their E169K mice were AF-susceptible with no structural cardiomyopathy at two
          months, which is the observation that separates the arms.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: Intracellular calcium ion homeostasis
          term:
            id: GO:0006874
            label: intracellular calcium ion homeostasis
          modifier: DECREASED
        - preferred_term: Regulation of cardiac muscle contraction by calcium ion signaling
          term:
            id: GO:0010882
            label: regulation of cardiac muscle contraction by calcium ion signaling
          modifier: DECREASED
      selected_evidence:
        snippet: each human mutation caused (i) protein reorganization of junctophilin-2, (ii) perturbations
          in intracellular calcium signaling, and (iii) marked cardiomyocyte hyperplasia
        supports: SUPPORT
