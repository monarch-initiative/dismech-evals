            term:
              id: MONDO:0013475
              label: hypertrophic cardiomyopathy 18
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PLN L39X Truncating Variant
        description: The best-characterised CMH18 lesion is the heterozygous nonsense allele c.116T>G,
          p.Leu39Ter (L39X, L39stop), which truncates phospholamban within its second transmembrane segment.
          Expressed in cells, the truncated protein is barely detectable, does not inhibit SERCA2a, and
          is misrouted away from the sarcoplasmic reticulum when it is made; co-expression with wild-type
          phospholamban shows no dominant-negative effect. A heterozygote therefore carries roughly half
          the normal amount of functional phospholamban.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genetic_context:
          gene:
            preferred_term: PLN
            term:
              id: hgnc:9080
              label: PLN
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Nonsense allele c.116T>G, p.Leu39Ter. Loss of function is shown biochemically and
            by absent protein in a homozygous explanted heart; haploinsufficiency in heterozygotes is
            inferred from the absence of a dominant-negative effect.
        genes:
        - preferred_term: PLN
          term:
            id: hgnc:9080
            label: PLN
        molecular_functions:
        - preferred_term: phospholamban inhibition of the SERCA2a calcium pump
          term:
            id: GO:0042030
            label: ATPase inhibitor activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: sarcoplasmic reticulum membrane
          term:
            id: GO:0033017
            label: sarcoplasmic reticulum membrane
      selected_evidence:
        snippet: one L39X nonsense mutation was identified in 1 of 1,064 HCM proband cases with a family
          history of HCM, previously found to be negative for the current HCM genetic test panel. This
          mutation cosegregated with incidence of HCM in a multigenerational family.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21167350
      reference_title: 'PLN-encoded phospholamban mutation in a large cohort of hypertrophic cardiomyopathy
        cases: summary of the literature and implications for genetic testing.'
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the L39X allele in a sarcomere-gene-negative HCM proband and shows it cosegregating
