        name: Loss of Phospholamban Brake on SERCA2a
        description: Dephosphorylated phospholamban lowers the calcium affinity of SERCA2a, and its phosphorylation
          by protein kinase A or CaMKII during beta-adrenergic stimulation lifts that brake. With less
          functional phospholamban the pump is partly disinhibited at rest and the beta-adrenergic release
          mechanism has less to act on. ClinGen frames the shared mechanism of all PLN-related cardiomyopathy
          as dysregulated SERCA2 function and calcium handling.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: negative regulation of calcium ion import into sarcoplasmic reticulum
          term:
            id: GO:1902081
