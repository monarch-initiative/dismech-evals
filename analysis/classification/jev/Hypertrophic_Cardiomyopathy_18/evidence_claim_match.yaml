        attaches_to:
        - phenotypes#Atrial fibrillation
        rationale: All four PLN-HCM probands reported by 2011 had atrial fibrillation, against 21% in
          the general Mayo HCM cohort, but four late-diagnosed cases are too few to separate a gene effect
          from age, left atrial enlargement or ascertainment. No study has examined atrial calcium handling
          in PLN variant carriers, so the phenotype is left unconnected to the mechanism chain.
