      assertion_type: Discussion
      assertion:
        discussion_id: pln_dosage_direction_in_hcm
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do HCM-associated PLN alleles that should lower phospholamban (L39X, -42C>G) and one that
          should raise it (-77A>G) really converge on hypertrophy, and if so through what common step?
        attaches_to:
        - pathophysiology#PLN L39X Truncating Variant
        - pathophysiology#PLN Promoter Variant Altering Phospholamban Expression
        rationale: The truncating allele and the -42C>G promoter variant reduce functional phospholamban,
          whereas the -77A>G promoter variant increases promoter activity, which would strengthen SERCA2a
          inhibition. Each promoter variant rests on one proband or family and reporter assays in non-human
          or non-cardiac cells, and none has been shown to change phospholamban protein in human heart.
          ClinGen states that the specific genetic mechanism of PLN cardiomyopathy is unclear. Either
          the promoter variants are not causal, or PLN-related hypertrophy is a response to disturbed
          calcium regulation in either direction; current data cannot separate these.
      selected_evidence:
        snippet: This mutation decreased phospholamban promoter activity by 43% and 47%, in C6 and C2C12
          cell lines respectively.
        supports: SUPPORT
