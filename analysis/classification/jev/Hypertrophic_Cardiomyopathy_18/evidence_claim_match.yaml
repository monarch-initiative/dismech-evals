            association: Pathogenic Variants
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            notes: 'PLN (6q22.31) has a single coding exon encoding the 52-amino-acid phospholamban. relationship_type
              is CAUSATIVE on HCM-specific evidence: a heterozygous truncating allele cosegregates with
              HCM in a multigenerational family and was found independently in a second familial HCM cohort;
              heterozygotes in the original L39stop kindreds were hypertrophic; and in a large HCM case-series
              burden analysis PLN rare variation showed a Bonferroni-significant excess over ExAC reference
              samples. The attributable share is small (about 0.65% of probands). ClinGen has no PLN record
              filed against hypertrophic cardiomyopathy or against MONDO:0013475. Its Hypertrophic Cardiomyopathy
              Gene Curation Expert Panel lumped CMH18 (MIM 613874) with dilated cardiomyopathy 1P (MIM
              609909) and classified PLN as Definitive (autosomal dominant) for intrinsic cardiomyopathy,
              MONDO:0000591. That is a broader disease concept than this entry, so it is cited as evidence
              and deliberately not recorded in gene_disease_validity. ClinGen''s summary scores hypertrophic,
              dilated and arrhythmogenic PLN presentations together and does not grade the hypertrophic
              L39X and promoter alleles separately from p.Arg14del and p.Arg9Cys, whose mechanisms differ.
              Separately, ClinGen rates PLN Moderate for arrhythmogenic right ventricular cardiomyopathy,
              a different disease.'
          role: ancestor
      assertion_type: GeneCaseFraction
      assertion:
        population: Pooled hypertrophic cardiomyopathy proband cohorts (six cohorts, North American, Australian,
          Japanese, Spanish, Greek and European)
        case_fraction_percent: 0.65
