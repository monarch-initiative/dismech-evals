          term:
            id: GO:0033017
            label: sarcoplasmic reticulum membrane
      selected_evidence:
        snippet: PLN-encoded phospholamban (PLN, also known as PLB) is a small, 52 amino acid protein
          which negatively-regulates the Ca2+ uptake action of SERCA2.
        supports: SUPPORT
