      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pln_hypercontractility_to_hypertrophy
        hypothesis_label: Chronic hypercontractility from phospholamban loss drives ventricular hypertrophy
        status: EMERGING
        description: Haghighi and colleagues proposed that partial loss of phospholamban imposes years
          of increased cardiac work, as in chronic catecholamine excess, and that this produces the hypertrophy
          seen in heterozygotes and the failure seen in homozygotes. It explains the L39X allele but not
          the -77A>G promoter variant, which should increase phospholamban, and it conflicts with the
          null mouse, which stays hypercontractile into old age without heart failure. No experiment has
          tested it in human cells or a heterozygous model.
      selected_evidence:
        snippet: Increased cardiac work over a period of years could conceivably lead to ventricular hypertrophy,
          as seen in some of the heterozygous PLN-L39stop individuals, which may then progress to ventricular
          failure as observed in the homozygous mutants.
        supports: SUPPORT
        directness: INDIRECT
    origin:
