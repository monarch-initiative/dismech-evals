  0cfc2d182417866b7eb3e551a64de4b988994040d54ae9318450d4a314d21fb9:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 18
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 18
            term:
              id: MONDO:0013475
              label: hypertrophic cardiomyopathy 18
        context: []
      assertion_type: Genetic
      assertion:
        name: PLN
        gene_term:
          preferred_term: PLN
          term:
            id: hgnc:9080
            label: PLN
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'PLN (6q22.31) has a single coding exon encoding the 52-amino-acid phospholamban. relationship_type
          is CAUSATIVE on HCM-specific evidence: a heterozygous truncating allele cosegregates with HCM
          in a multigenerational family and was found independently in a second familial HCM cohort; heterozygotes
          in the original L39stop kindreds were hypertrophic; and in a large HCM case-series burden analysis
          PLN rare variation showed a Bonferroni-significant excess over ExAC reference samples. The attributable
          share is small (about 0.65% of probands). ClinGen has no PLN record filed against hypertrophic
          cardiomyopathy or against MONDO:0013475. Its Hypertrophic Cardiomyopathy Gene Curation Expert
          Panel lumped CMH18 (MIM 613874) with dilated cardiomyopathy 1P (MIM 609909) and classified PLN
          as Definitive (autosomal dominant) for intrinsic cardiomyopathy, MONDO:0000591. That is a broader
          disease concept than this entry, so it is cited as evidence and deliberately not recorded in
          gene_disease_validity. ClinGen''s summary scores hypertrophic, dilated and arrhythmogenic PLN
          presentations together and does not grade the hypertrophic L39X and promoter alleles separately
          from p.Arg14del and p.Arg9Cys, whose mechanisms differ. Separately, ClinGen rates PLN Moderate
          for arrhythmogenic right ventricular cardiomyopathy, a different disease.'
        variants:
        - name: PLN p.Leu39Ter
          description: c.116T>G (T116G), p.Leu39Ter, also written L39X or L39stop. Nonsense allele truncating
            phospholamban in transmembrane domain II; a functional null with no dominant-negative effect.
            Reported heterozygous in HCM probands from North America (Mayo Clinic) and Australia and in
            two kindreds studied in Athens, where heterozygotes were hypertrophic or, in one kindred,
            dilated, and homozygotes had lethal dilated cardiomyopathy. Absent from 600 reference alleles
            in the Mayo study. Landstrom et al. describe position 39 as a possible relative mutational
            hot spot.
          clinical_significance: PATHOGENIC
          type: nonsense
        - name: PLN promoter -77A>G
          description: Heterozygous A-to-G change 77 bp upstream of the transcription start site, in one
            Japanese woman with familial HCM diagnosed at 56 with paroxysmal atrial fibrillation; absent
            from 296 controls and raised promoter activity in neonatal rat cardiomyocytes. Pathogenicity
            is not established.
          type: promoter
        - name: PLN promoter -42C>G
          description: Promoter variant in one Spanish family with late-onset benign apical HCM, including
            a healthy adult carrier; lowered promoter activity in reporter assays. Pathogenicity is not
            established.
          type: promoter
        case_fractions:
        - population: Pooled hypertrophic cardiomyopathy proband cohorts (six cohorts, North American,
            Australian, Japanese, Spanish, Greek and European)
          case_fraction_percent: 0.65
          notes: Sum of coding-region L39X yield (2 of 1,595-1,605 probands, 0.13%) and control-absent
            promoter variants (7 of 1,343, 0.52%); the two denominators differ, and the promoter variants
            are not proven pathogenic, so this is an upper bound on the attributable share.
        - population: Unrelated hypertrophic cardiomyopathy index cases, Mayo Clinic
          case_fraction_percent: 0.094
          cohort_size: 1064
          notes: Coding-region (L39X) carriers only.
      selected_evidence:
        snippet: For each of these genes there is a significant (P < 0.05 after Bonferroni correction)
          excess of variation in cases as compared with ExAC, thus confirming their association with disease
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27532257
      reference_title: Reassessment of Mendelian gene pathogenicity using 7,855 cardiomyopathy cases and
        60,706 reference samples.
      evidence_source: HUMAN_CLINICAL
      explanation: 'HCM-specific case-excess evidence: PLN rare variation is significantly enriched in
        HCM cases over population reference samples.'
