      assertion_type: Discussion
      assertion:
        discussion_id: pln_null_mouse_human_hypertrophy
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does partial or complete loss of phospholamban produce hypertrophy and later dilatation
          in humans when total loss in the mouse produces a lifelong hypercontractile heart without heart
          failure?
        attaches_to:
        - pathophysiology#Enhanced Sarcoplasmic Reticulum Calcium Uptake and Contractility
        - pathophysiology#Cardiomyocyte Hypertrophic Remodeling
        - animal_models#Mouse
        rationale: 'The mouse evidence is abundant and points the other way: Pln-null mice are hypercontractile,
          tolerate it into old age, and were once taken as a model for phospholamban suppression as heart-failure
          therapy. The human L39X carriers instead develop hypertrophy (heterozygotes) or lethal dilated
          cardiomyopathy (homozygotes). The causal chain in this entry therefore passes through a hypercontractility
          node shown only in the mouse and a hypertrophy step shown only in humans. No heterozygous Pln
          model and no patient-derived or isogenic L39X iPSC cardiomyocyte has been studied for hypertrophic
          signalling.'
      selected_evidence:
        snippet: The phospholamban-deficient mice showed no gross developmental abnormalities but exhibited
          enhanced myocardial performance without changes in heart rate.
        supports: SUPPORT
