              label: hypertrophic cardiomyopathy 20
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NEXN Missense Variants Impair Nexilin F-Actin Binding
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: 'Nexilin (NEXN) is an F-actin-binding protein of the cardiac Z-disc, not a component
          of the thick or thin filament. The two HCM-reported missense variants lie in or adjacent to
          the actin-binding domain: in transfected C2C12 cells they caused abnormal local accumulation
          of nexilin, and the actin-binding-domain fragment carrying p.Q131E lost F-actin binding entirely,
          with coimmunoprecipitation showing reduced binding of full-length NEXN to alpha-actin. The proposed
          proximal lesion is therefore failure of the nexilin-actin anchorage that couples thin filaments
          to the Z-disc, rather than an alteration of cross-bridge cycling. Confidence is PROVISIONAL:
          the functional data are robust in vitro but derive from the same single report that proposed
          the gene-disease association, which has since been classified Limited by ClinGen.'
        genes:
        - preferred_term: NEXN
          term:
            id: hgnc:29557
            label: NEXN
        molecular_functions:
        - preferred_term: actin binding
          term:
            id: GO:0003779
            label: actin binding
          modifier: DECREASED
        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
        cell_types:
        - preferred_term: Cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Cellular transfection studies showed that the two mutations resulted in local accumulations
          of nexilin and that the expressed fragment of actin-binding domain containing p.Q131E completely
          lost the ability to bind F-actin in C2C12 cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
