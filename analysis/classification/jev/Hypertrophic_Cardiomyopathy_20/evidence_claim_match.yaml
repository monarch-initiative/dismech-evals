        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nexn-hcm-phenotype-detail-gap
        prompt: What is the actual clinical phenotype of NEXN-associated HCM — age of onset, hypertrophy
          pattern and severity, outflow obstruction, arrhythmia burden, and sudden-death risk?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Hypertrophic Cardiomyopathy
        - phenotypes#Myocardial Sarcomeric Disarray
        - phenotypes#Myocardial Fibrosis
        rationale: The published clinical description of CMH20 amounts to two families in the 2010 report
          plus three probands in a French series whose causality was explicitly not established. No cohort
          has reported age at onset, hypertrophy distribution, late gadolinium enhancement, outflow gradients,
          or arrhythmic outcomes specific to NEXN HCM carriers. Consequently no phenotype in this entry
          carries a `frequency:` band, and the disarray/fibrosis phenotypes are inferred from the HCM
          disease definition rather than observed in carriers.
        proposed_experiments:
        - experiment_id: nexn-hcm-deep-phenotyping-registry
          name: International NEXN HCM Deep-Phenotyping Registry
          description: Assemble an international registry of HCM probands carrying rare NEXN variants
            with standardized deep phenotyping (echocardiography, cardiac MRI with late gadolinium enhancement,
            ambulatory ECG, family segregation) to determine whether a distinguishable NEXN HCM phenotype
            exists at all.
      selected_evidence:
        snippet: Few clinical data are available on NEXN mutation carriers, and the gene's involvement
          in cardiomyopathies or sudden death has not been fully established.
        supports: SUPPORT
