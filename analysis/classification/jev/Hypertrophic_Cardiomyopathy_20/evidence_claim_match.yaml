        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Z-Disc Destabilization Under Mechanical Load
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: 'The Z-disc is the mechanical integration site that anchors myofilaments and transmits
          contractile force between adjacent sarcomeres. Nexilin was identified as a Z-disc protein whose
          specific role is to protect the Z-disc from the forces generated within the sarcomere; loss-of-function
          models show that Z-disc damage in nexilin-deficient muscle is aggravated by increasing mechanical
          strain. The inferred consequence of impaired nexilin-actin anchorage is therefore progressive
          Z-disc destabilization under contractile load. IMPORTANT CAVEAT: the direct experimental evidence
          for this step comes from nexilin-deficient zebrafish and from human DILATED cardiomyopathy carriers,
          not from the HCM families — in those models Z-disc failure produced a dilated, not hypertrophic,
          phenotype. The step is retained as HYPOTHETICAL for CMH20 because no HCM-specific model system
          has been reported.'
        cell_types:
        - preferred_term: Cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
        locations:
        - preferred_term: Myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        biological_processes:
        - preferred_term: Sarcomere organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
        - preferred_term: Muscle contraction
          term:
            id: GO:0006936
            label: muscle contraction
          modifier: ABNORMAL
      selected_evidence:
        snippet: Increasing mechanical strain aggravated Z-disk damage in nexilin-deficient skeletal muscle,
          implying a unique role of nexilin in protecting Z-disks from mechanical trauma.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19881492
      reference_title: Nexilin mutations destabilize cardiac Z-disks and lead to dilated cardiomyopathy.
      evidence_source: MODEL_ORGANISM
      explanation: Supports load-dependent Z-disc failure as the consequence of nexilin loss, but only
        PARTIAL for CMH20 — this study characterizes nexilin loss in zebrafish and in human DILATED cardiomyopathy,
        and the resulting phenotype was dilated rather than hypertrophic.
