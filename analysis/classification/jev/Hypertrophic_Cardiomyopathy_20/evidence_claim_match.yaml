      reference_title: Nexilin mutations destabilize cardiac Z-disks and lead to dilated cardiomyopathy.
      evidence_source: MODEL_ORGANISM
      explanation: The canonical nexilin model system produces heart failure in a dilated context, not
        hypertrophy — the mismatch this discussion records.
