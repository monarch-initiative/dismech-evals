              label: hypertrophic cardiomyopathy 20
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiomyopathy gene panel, with NEXN not appropriate for diagnostic reporting
        diagnosis_term:
          preferred_term: Cardiomyopathy gene panel testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: The clinically consequential fact about NEXN is a reporting rule, not a testing indication.
          ClinGen classifies NEXN-hypertrophic cardiomyopathy as Limited, and its Hereditary Cardiovascular
          Disease Gene Curation Expert Panel places limited, no-evidence and disputed genes together in
          the "uncertain significance" tier, stating that genes with disputed evidence are not appropriate
          for diagnostic reporting - including their variants of uncertain significance. A NEXN variant
          found on a cardiomyopathy panel therefore should not be reported as the cause of a patient's
          hypertrophic cardiomyopathy, should not be used to direct predictive cascade testing in relatives,
          and does not discharge the family from clinical surveillance. Panel testing itself remains indicated
          - to find a variant in a gene that does carry adequate validity.
        results: A NEXN variant is an uncertain-significance finding at gene level, not a molecular diagnosis.
          Interpret the panel as though NEXN had not been on it.
        notes: The reporting caveat previously lived only in the genetic counseling treatment, inferred
          from a generic Ingles-2019 quote. It is stated here instead, in the section that governs test
          interpretation, and sourced directly from the ClinGen expert-panel reappraisal that classifies
          NEXN.
      selected_evidence:
        snippet: Nine (29%) genes were downgraded to disputed, further discouraging clinical reporting
          of variants in these genes.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
