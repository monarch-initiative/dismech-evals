  cc2bc11cedaab945739af02dd0e923926ba534dcd525bb03503e741109997454:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 20
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 20
            term:
              id: MONDO:0013477
              label: hypertrophic cardiomyopathy 20
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nexn-hcm-no-model-system
        prompt: Why does nexilin loss of function produce a dilated phenotype in every reported model
          system, while the two human CMH20 missense variants were reported with a hypertrophic phenotype?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cardiac Z-Disc Destabilization Under Mechanical Load
        - pathophysiology#Cardiomyocyte Hypertrophy, Sarcomeric Disarray, and Myocardial Fibrosis
        rationale: Every published nexilin model — zebrafish knockdown, mouse knockout — yields dilated
          cardiomyopathy with endomyocardial/endocardial fibroelastosis, and human NEXN truncating variants
          segregate with DCM/NDLVC. No animal or iPSC-cardiomyocyte model recapitulating a NEXN-driven
          hypertrophic phenotype has been reported. The mechanistic chain from Z-disc destabilization
          to hypertrophic (rather than dilated) remodeling is therefore entirely unmodelled, which is
          why the downstream nodes in this entry carry mechanism_confidence HYPOTHETICAL and an INDIRECT_UNKNOWN_INTERMEDIATES
          causal edge.
        proposed_experiments:
        - experiment_id: nexn-q131e-knockin-phenotyping
          name: NEXN Missense Knock-In iPSC-Cardiomyocyte Phenotyping
          description: Generate NEXN p.Q131E and p.R279C knock-in human iPSC-derived cardiomyocytes and
            engineered heart tissue, and assay sarcomere organization, Z-disc integrity, contractile force,
            and hypertrophic gene program induction under mechanical load, to test whether these specific
            missense alleles produce a hypertrophic rather than dilated cellular phenotype.
      selected_evidence:
        snippet: Loss of nexilin in zebrafish led to perturbed Z-disk stability and heart failure.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
