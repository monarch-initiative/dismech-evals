              label: hypertrophic cardiomyopathy 20
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nexn-hcm-gene-disease-validity
        prompt: Is NEXN a genuine hypertrophic cardiomyopathy gene at all, or is CMH20 an artifact of
          a single underpowered 2010 candidate-gene study?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#NEXN Missense Variants Impair Nexilin F-Actin Binding
        - genetic#NEXN Missense Variants (Limited Gene-Disease Validity for HCM)
        rationale: MONDO:0013477 / OMIM 613876 exist as a numbered HCM series entry, but the evidence
          base has moved against them. ClinGen classifies NEXN-HCM as Limited (2023), and the 2025 multicentre
          burden study of 60 NEXN carriers found no HCM association while confirming enrichment in DCM/NDLVC.
          If the association is spurious, this entry should eventually be marked disputed rather than
          fleshed out with borrowed sarcomeric-HCM mechanism, and NEXN variants should not be reported
          as causal in HCM diagnostic testing.
        proposed_experiments:
        - experiment_id: nexn-hcm-reclassification
          name: ClinGen NEXN-HCM Gene-Disease Validity Re-Curation
          description: Re-run a ClinGen gene-disease validity curation for NEXN-HCM incorporating post-2023
            evidence (notably the 2025 multicentre burden analysis) to determine whether the classification
            should move from Limited to Disputed or Refuted, and propose a corresponding MONDO/OMIM status
            annotation.
        - experiment_id: nexn-hcm-case-level-reassessment
          name: Reassessment of the Original CMH20 Variants
          description: Reassess the two original CMH20 variants (p.Q131E, p.R279C) against current population
            databases (gnomAD v4) and ClinVar, and attempt independent replication of segregation in additional
            sarcomere-negative HCM families.
      selected_evidence:
        snippet: NEXN | HGNC:29557 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Limited
        supports: SUPPORT
