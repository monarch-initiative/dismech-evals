      assertion:
        name: Phenocopy exclusion testing
        diagnosis_term:
          preferred_term: Phenocopy exclusion testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: For a family that is sarcomere-negative and disarray-negative, the non-sarcomeric
          causes of unexplained left ventricular hypertrophy become the highest-yield remaining workup
          - several are treatable, which is what makes the distinction actionable rather than academic.
          The relevant set is Fabry disease (alpha-galactosidase A activity and GLA sequencing), cardiac
          amyloidosis (serum free light chains with immunofixation, and bone scintigraphy), Danon disease
          (LAMP2), and PRKAG2 glycogen storage cardiomyopathy, which is suggested by pre-excitation on
          the ECG.
        results: A positive result reclassifies the family out of CMH21 entirely and into a disease with
          its own management; a negative result strengthens, without confirming, the locus-defined diagnosis.
        notes: No CMH21-specific diagnostic-yield data exist for any of these tests; the panel composition
          is standard practice for unexplained left ventricular hypertrophy and is guideline-derived rather
          than entity-derived.
      selected_evidence:
        snippet: Of note, histopathology from 2 family members did not demonstrate myocyte disarray and
          fibrosis, indicating that this phenotype is not typical sarcomere mutation HCM.
