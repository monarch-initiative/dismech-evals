      assertion_type: Diagnosis
      assertion:
        name: Transthoracic echocardiography for diagnosis and lifelong family surveillance
        diagnosis_term:
          preferred_term: Echocardiography
          term:
            id: NCIT:C16525
            label: Echocardiography Test
        description: 'Echocardiography carries more weight in this entity than in gene-solved cardiomyopathies,
          because it is not one arm of surveillance but the whole of it. In a family with an identified
          pathogenic variant, a relative who tests negative can be discharged. No such test exists for
          CMH21: the disease allele has never been found anywhere in the 27.2 Mb interval, so no relative
          can be genetically excluded, and serial clinical imaging must therefore continue indefinitely
          in every first-degree relative rather than stopping at a single normal study or a negative genetic
          result. The kindred''s own phenotype dictates what to look for - predominant left ventricular
          hypertrophy, but also ventricular dilation and falling systolic function, since affected members
          progressed to end-stage heart failure.'
        results: Left ventricular hypertrophy; in later disease, ventricular dilation and systolic impairment.
          A normal study in a relative excludes nothing permanently and does not end surveillance.
        notes: The imaging modality and the finding are evidenced; the surveillance interval is not. Screening
          cadence is guideline-generic (2024 AHA/ACC, PMID:38718139; 2023 ESC, PMID:37622657, both carried
          in the top-level references) and no CMH21-specific screening study exists. Neither guideline
          record carries quotable recommendation text in its cached PubMed abstract, so no snippet is
          claimed for the cadence.
      selected_evidence:
        snippet: one kindred (4 generations, 32 individuals) with predominant clinical features of left
          ventricular hypertrophy
        supports: SUPPORT
