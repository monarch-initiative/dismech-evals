  8e71c7764d14c0c0eefc9525a012a751429605a3d315338c0c353396c139d92d:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 21
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 21
            term:
              id: MONDO:0013852
              label: hypertrophic cardiomyopathy 21
        context: []
      assertion_type: Genetic
      assertion:
        name: CMH21 linkage locus (7p12.1-q21)
        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: CMH21 is defined by a linkage interval, not by a gene. Two-point linkage in the index kindred
          reached a maximum LOD score of 4.11 on chromosome 7, and recombinants narrowed the disease interval
          to the 27.2 Mb between markers D7S506 and D7S3314 (7p12.1-7q21). No causal gene or variant within
          this interval has been reported. Sarcomere genes known to cause hypertrophic and dilated cardiomyopathy
          were sequenced in this family and were negative. This block is deliberately curated WITHOUT
          a gene_term. Do not populate a gene here unless a causal gene inside 7p12.1-q21 is established
          for this entity in primary literature and reconciled with the MONDO/OMIM record. GATAD1 (7q21.2)
          is a gene for a DIFFERENT entity (autosomal recessive dilated cardiomyopathy, PMID:21965549)
          and must not be assigned to CMH21 on the basis of regional overlap alone.
      selected_evidence:
        snippet: Linkage was then established to a novel locus on chromosome 7 (7p12.1-7q21). A maximum
          2-point logarithm of odds score of 4.11 was obtained. Recombination events refine the disease
          interval between D7S506 and D7S3314, corresponding to a distance of 27.2 megabases.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
