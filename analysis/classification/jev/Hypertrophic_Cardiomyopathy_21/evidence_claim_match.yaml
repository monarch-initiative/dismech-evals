          itself: the established sudden-death risk models for hypertrophic cardiomyopathy are built on
          sarcomeric cohorts, and this entity has one published family, no event rates, and a histology
          that the authors said is not typical sarcomeric HCM - so it is not clear those models transfer.
          Decisions are therefore made on generic criteria and family history, and the gap is recorded
          rather than papered over.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Implantable cardioverter-defibrillator placement
          term:
            id: NCIT:C80435
            label: Implantable Cardioverter-Defibrillator Placement
        target_phenotypes:
        - preferred_term: Sudden cardiac death
          term:
            id: HP:0001645
            label: Sudden cardiac death
        notes: No CMH21-specific risk calculator, event rate, or ICD outcome data exist. Practice is guideline-generic
          (2024 AHA/ACC, PMID:38718139; 2023 ESC, PMID:37622657), and neither guideline's cached abstract
          carries quotable recommendation text, so no snippet is claimed for the indication threshold.
      selected_evidence:
        snippet: left ventricular hypertrophy in addition to cardiac dilation, end-stage heart failure,
