      assertion_type: Discussion
      assertion:
        discussion_id: cmh21_causal_gene_unidentified
        prompt: Which gene within the 27.2 Mb 7p12.1-q21 interval carries the CMH21 disease allele?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Unidentified 7p12.1-q21 Disease Allele
        - genetic#CMH21 linkage locus (7p12.1-q21)
        rationale: CMH21 is one of the few members of the CMH numbered series that remains defined by
          a chromosomal region rather than a gene. The MONDO definition ("material basis in region 7p12.1-q21
          variation") and the OMIM entry both stop at the interval. The anchoring linkage study identified
          the interval but explicitly left the causal mutation for future work, and no subsequent publication
          has reported a gene for this entity. Until a gene is established, every downstream mechanistic
          node in this entry is an observation about a phenotype, not a molecular pathway. Assigning a
          plausible-looking gene from the interval (for example on the basis of cardiac expression or
          of a neighbouring cardiomyopathy locus) would be an unsupported inference.
        proposed_experiments:
        - experiment_id: cmh21_wgs_reanalysis
          name: Whole-genome sequencing and re-analysis of the index kindred
          description: Perform whole-genome (not exome-only) sequencing on the surviving affected and
            unaffected members of the original 4-generation kindred and filter for variants segregating
            with disease within the D7S506-D7S3314 interval. Genome-wide coverage is required because
            the 2006 study excluded only coding sarcomere genes, leaving non-coding, regulatory, and structural
            variation within the interval untested.
          decision_criterion: A rare variant segregating with the phenotype inside the D7S506-D7S3314
            interval and absent from population databases would nominate the causal gene; finding none
            on whole-genome coverage would raise the possibility that the original single-family linkage
            signal was a false positive.
          would_support:
          - pathophysiology#Unidentified 7p12.1-q21 Disease Allele
      selected_evidence:
        snippet: Identification of the causal gene mutation and additional genotype-phenotype correlation
          studies will provide fundamental insight into mechanisms of cardiac remodeling.
        supports: SUPPORT
