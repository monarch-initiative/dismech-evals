        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmh21_entity_rests_on_a_single_kindred
        prompt: Is CMH21 a replicable disease entity, or a single-family linkage result that has not been
          independently confirmed?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Unidentified 7p12.1-q21 Disease Allele
        rationale: The entire evidence base for CMH21 is one kindred reported in 2006 with a two-point
          LOD of 4.11. No second family, no gene, and no genotype-phenotype series have been published
          since. The clinical description (hypertrophy plus dilation plus end-stage heart failure, without
          myocyte disarray) also does not match the typical sarcomeric HCM phenotype that the CMH series
          name implies, so the entity's placement under hypertrophic cardiomyopathy in MONDO is itself
          a nosological question. Curators should treat this entry as a faithful record of a single well-conducted
          linkage study rather than as an established disease mechanism.
      selected_evidence:
        snippet: genome-wide linkage analysis was used to study one kindred (4 generations, 32 individuals)
        supports: SUPPORT
