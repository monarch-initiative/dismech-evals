        prompt: Should GATAD1 (7q21.2), the gene for an autosomal recessive dilated cardiomyopathy that
          maps inside the CMH21 interval, be treated as a candidate gene for CMH21?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - genetic#CMH21 linkage locus (7p12.1-q21)
        rationale: A curator or automated tool searching the 7p12.1-q21 interval for cardiomyopathy genes
          will find GATAD1, whose autosomal recessive DCM locus at 7q21 overlaps the distal end of the
          CMH21 interval. Regional overlap is not evidence of shared causation. The GATAD1 entity is recessive,
          was ascertained in descendants of first cousins, presents as dilated cardiomyopathy, and has
          unaffected heterozygous carriers — none of which matches the dominant, hypertrophy-predominant,
          four-generation CMH21 kindred. No study has tested GATAD1 in the CMH21 family or otherwise linked
          the two. This discussion is recorded so the coincidence is documented and explicitly rejected
          rather than silently re-discovered and mis-asserted.
      selected_evidence:
        snippet: Thirteen relatives were heterozygous mutation carriers with no evidence of myocardial
          disease, even at advanced ages.
        supports: SUPPORT
