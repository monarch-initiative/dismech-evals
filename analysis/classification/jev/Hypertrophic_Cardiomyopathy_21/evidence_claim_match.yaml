        description: The highest-value intervention in this entity, and the one most shaped by its gene-less
          status. Three things must be conveyed and are easy to get wrong. First, inheritance is autosomal
          dominant across four generations, so first-degree relatives carry a 50% prior risk and all require
          evaluation. Second, a negative cardiomyopathy panel does not exclude a relative - because no
          CMH21 allele has ever been identified, there is nothing to test for, and cascade *genetic* testing
          is simply unavailable; surveillance is therefore clinical, and lifelong. Third, and following
          from the same fact, preimplantation genetic testing and prenatal diagnosis are not options for
          this family, which is a material difference from every gene-solved cardiomyopathy and should
          be stated plainly rather than discovered later.
