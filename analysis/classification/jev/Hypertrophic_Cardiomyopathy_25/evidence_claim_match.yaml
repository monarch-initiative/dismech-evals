          one reported case - documents cardiomyocyte hypertrophy and focal fibrosis and says nothing
          about sarcomere or Z-disc architecture, and no other cached source for this entity reports disarray
          or myofibrillar disorganization either. The node was therefore narrowed to the claim the evidence
          supports, and the GO:0045214 annotation dropped, rather than split into a second node that would
          have had no evidence to stand on. Z-disc disorganization is a plausible expectation for a Z-disc
          protein, but plausibility is exactly what this DISPUTED entity must not encode as observation.
          If a TCAP biopsy or model reporting myofibrillar architecture appears, a separate sourced node
          is the right way to add it.
