  b30efa88b3e002da7f2591d648b786b15e06ffa7691c1e8a87e0c70062461e56:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 25
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 25
            term:
