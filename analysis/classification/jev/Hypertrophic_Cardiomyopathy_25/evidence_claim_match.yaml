      assertion_type: DifferentialDiagnosis
      assertion:
        name: Myofilament (sarcomeric) hypertrophic cardiomyopathy
        description: The definitive HCM genes — MYBPC3, MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2, MYL3 —
          account for the overwhelming majority of genotyped HCM and are clinically indistinguishable
          from the reported TCAP cases. This is the primary differential and, given the Disputed status
          of TCAP, the more likely explanation whenever both are on the table.
        distinguishing_features:
        - Only genotype separates them; MLP/TCAP-associated HCM clinically mimics myofilament HCM.
        - Septal contour differs at the class level (Z-disc HCM sigmoidal, myofilament HCM more often
          reverse-curvature), but this is a group tendency, not a patient-level discriminator.
        - A definitive-gene variant in the same patient should be regarded as the diagnosis; TCAP co-occurrence
          with a pathogenic TNNI3 variant is documented.
        disease_term:
          preferred_term: familial hypertrophic cardiomyopathy
          term:
            id: MONDO:0024573
            label: familial hypertrophic cardiomyopathy
