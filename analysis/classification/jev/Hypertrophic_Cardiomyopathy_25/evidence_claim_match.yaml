  0b8000f9f2bdc9679633f211dedb7ce43092a816285905b64e3cc5c6b7c76568:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 25
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 25
            term:
              id: MONDO:0011843
              label: hypertrophic cardiomyopathy 25
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiomyopathy Multigene Panel or Exome Sequencing
        description: 'Molecular testing is what defines this entity, because the clinical phenotype mirrors
          myofilament HCM. TCAP appears on legacy sarcomere/Z-disc panels and every reported cardiac allele
          was found by sequencing after the established genes were excluded. Critically, a TCAP variant
          returned by such a panel should NOT by itself be reported as a molecular diagnosis of HCM: ClinGen
          classifies the gene-disease relationship as Disputed, and the published variants lack functional
          support. Look actively for a second, better-supported variant — co-occurrence with a pathogenic
          TNNI3 variant and with a MYBPC3 VUS is documented in the TCAP HCM literature.'
        diagnosis_term:
          preferred_term: cardiomyopathy multigene panel or exome sequencing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Index patients were screened for mutations in all coding regions of 10 sarcomere genes
          (MYH7, MYL3, MYBPC3, TNNI3, TNNT2, TPM1, ACTC, CSRP3, TCAP, and TNNC1) and five exons of TTN.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/3
      evidence_path: /diagnosis/3/evidence/0
      context_paths:
