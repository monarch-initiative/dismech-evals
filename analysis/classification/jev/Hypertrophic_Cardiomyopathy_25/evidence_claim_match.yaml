  c1b490ed7a010a77f853c912b35997edbd6a36d8bcb8dddc1a6d919710697000:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 25
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 25
            term:
              id: MONDO:0011843
              label: hypertrophic cardiomyopathy 25
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tcap_hcm_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Z-Disc Signalosome Output
        prompt: What, mechanistically, does an HCM-associated TCAP allele do to the cardiomyocyte downstream
          of the Z-disc?
        rationale: 'The only mechanistic data are qualitative yeast two-hybrid and GST pull-down results
          from 2004 showing augmented telethonin binding to titin and calsarcin-1. Nothing downstream
          has been measured: no calcineurin activity, no NFAT nuclear translocation, no hypertrophic gene
          program, no sarcomere-organisation phenotype, no contractile or relaxation measurement in any
          TCAP-HCM cell, tissue, or animal model. ClinGen states plainly that the mechanism is unknown.
          The Z-disc signalosome node in this entry is therefore a placeholder that names the proposed
          route rather than a curated mechanism.'
        proposed_experiments:
        - experiment_id: exp_tcap_quantitative_zdisc_binding
          name: Quantitative binding measurement of mutant telethonin with its Z-disc partners
          description: Replace the original qualitative yeast two-hybrid and pull-down assays with quantitative
            affinity measurements (isothermal titration calorimetry or surface plasmon resonance) of mutant
            versus wild-type telethonin against titin Z1Z2, muscle LIM protein, and calsarcin-1.
          supporting_outcome:
          - Reproducible, direction-consistent affinity changes would substantiate the gain-of-interaction
            model.
          refuting_outcome:
          - Affinities indistinguishable from wild type would remove the only mechanistic support for
            the model.
        - experiment_id: exp_tcap_calcineurin_nfat_readout
          name: Calcineurin-NFAT signalling readout in TCAP knock-in cardiomyocytes
          description: Measure calcineurin activity, NFAT nuclear translocation, and hypertrophic marker
            gene expression in cardiomyocytes carrying knock-in TCAP HCM alleles, closing the untested
            step between altered calsarcin binding and hypertrophic growth.
          supporting_outcome:
          - Allele-dependent calcineurin-NFAT activation would convert the placeholder signalosome node
            into a curated mechanism.
        - experiment_id: exp_tcap_sarcomere_and_relaxation_phenotyping
          name: Sarcomere ultrastructure and relaxation phenotyping in TCAP engineered heart tissue
          description: Characterise Z-disc ultrastructure by electron microscopy and measure active and
            passive mechanics in engineered heart tissue carrying each reported allele, to test whether
            the human diastolic phenotype is reproduced in vitro.
      selected_evidence:
        snippet: The mechanism for disease is unknown.
        supports: SUPPORT
    origin:
