        description: 'Where a mode of inheritance has been recorded for TCAP cardiomyopathy it is autosomal
          dominant heterozygous transmission of a missense (or, in one report, frameshift) allele. Segregation
          data are thin: a single small Portuguese family demonstrated co-segregation of the p.C57W allele,
          and the 2025 frameshift report identified the variant in the proband''s family. Contrast with
          the TCAP skeletal-muscle disease (LGMD R7/2G), which is autosomal recessive and biallelic loss
          of function.'
