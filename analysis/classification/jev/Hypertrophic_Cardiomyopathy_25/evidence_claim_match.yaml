      assertion_type: DifferentialDiagnosis
      assertion:
        name: TCAP-related dilated cardiomyopathy
        description: The same gene has been reported in dilated cardiomyopathy, with ClinGen classifying
          that relationship as Limited. The founding study proposed that the direction of the binding
          change distinguishes the two cardiac phenotypes, so the DCM literature is mechanistically adjacent
          but is a different entity and must not be used as evidence for the hypertrophic phenotype.
        distinguishing_features:
        - Left ventricular dilation with reduced ejection fraction, versus hypertrophy with preserved
          ejection fraction.
        - The reported DCM allele (E132Q) impaired telethonin binding to MLP, titin, and calsarcin-1;
          the HCM alleles augmented binding to titin and calsarcin-1.
        - ClinGen validity is Limited for dilated cardiomyopathy versus Disputed for hypertrophic cardiomyopathy
          — both weak, but curated separately.
        disease_term:
          preferred_term: dilated cardiomyopathy
          term:
            id: MONDO:0005021
            label: dilated cardiomyopathy
      selected_evidence:
        snippet: TCAP | HGNC:11610 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited
        supports: SUPPORT
