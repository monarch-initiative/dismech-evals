              id: MONDO:0011843
              label: hypertrophic cardiomyopathy 25
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tcap_zdisc_stretch_sensor_gain_of_interaction
        hypothesis_label: Z-disc stretch-sensor gain-of-interaction model
        status: EMERGING
        description: 'The only mechanistic model proposed for TCAP-HCM holds that the hypertrophic and
          dilated phenotypes are separated by the *direction* of the binding change within the titin/telethonin/MLP
          Z-disc stretch sensor: the two HCM-associated missense alleles (T137I, R153H) augmented telethonin''s
          interaction with titin and calsarcin-1 in yeast two-hybrid and GST pull-down assays, whereas
          the DCM-associated alleles impaired binding to MLP, titin, and calsarcin-1. Because calsarcin
          tethers calcineurin — a canonical pro-hypertrophic phosphatase — to the Z-disc, a gain of telethonin-calsarcin
          interaction is the proposed route from a Z-disc scaffolding change to hypertrophic growth. This
          remains EMERGING and contested: the assays were qualitative, no downstream calcineurin readout
          was measured in the original work, no independent group has replicated the binding result, and
          ClinGen states outright that the disease mechanism is unknown.'
      selected_evidence:
        snippet: It was demonstrated by the qualitative assays that the HCM-associated mutations augment
          the ability of Tcap to interact with titin and calsarcin-1, whereas the DCM-associated mutations
          impair the interaction of Tcap with MLP, titin, and calsarcin-1.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15582318
      reference_title: Tcap gene mutations in hypertrophic cardiomyopathy and dilated cardiomyopathy.
      evidence_source: IN_VITRO
      explanation: The primary in vitro basis for the gain-of-interaction model and for the HCM-versus-DCM
        directional split. Evidence source is IN_VITRO because the result comes from yeast two-hybrid
        and GST pull-down competition assays.
