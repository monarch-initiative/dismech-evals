      assertion_type: Pathophysiology
      assertion:
        name: Telethonin Z-Disc Titin-Capping and Stretch-Sensor Perturbation
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: HYPOTHETICAL
        description: 'TCAP encodes telethonin, a small Z-disc protein that assembles with the N-terminal
          immunoglobulin domains of two antiparallel titin molecules, capping the Z-disc end of titin
          and nucleating a signalosome that also contains muscle LIM protein (MLP/CSRP3), the calsarcins,
          and — as more recently shown — nesprin-2 and FHL-2. This complex, not the contractile filaments,
          is the proposed proximal lesion: the HCM-associated alleles reported to date (T137I, R153H,
          C57W, and one p.Glu12fs frameshift) change how telethonin engages its Z-disc partners rather
          than removing the protein from the sarcomere. The trigger is deliberately tagged HYPOTHETICAL:
          no functional assay has established pathogenicity for any of these alleles.'
        genes:
        - preferred_term: TCAP
          term:
            id: hgnc:11610
            label: TCAP
        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
        molecular_functions:
        - preferred_term: titin binding
          term:
            id: GO:0031432
            label: titin binding
          modifier: ABNORMAL
        - preferred_term: structural constituent of muscle
          term:
            id: GO:0008307
            label: structural constituent of muscle
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: Myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        biological_processes:
        - preferred_term: Detection of muscle stretch
          term:
            id: GO:0035995
            label: detection of muscle stretch
          modifier: ABNORMAL
      selected_evidence:
        snippet: TTN-encoded titin, CSRP3-encoded muscle LIM protein, and TCAP-encoded telethonin are
          Z-disc proteins essential for the structural organization of the cardiac sarcomere and the cardiomyocyte's
          stretch sensor.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
