              label: hypertrophic cardiomyopathy 25
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tcap_hcm_gene_disease_validity_disputed
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Telethonin Z-Disc Titin-Capping and Stretch-Sensor Perturbation
        prompt: Is TCAP a genuine hypertrophic cardiomyopathy gene at all, or is CMH25 an artefact of
          pre-genomic candidate-gene sequencing?
        rationale: ClinGen's Hereditary Cardiovascular Disease GCEP downgraded TCAP-HCM from Limited to
          Disputed in September 2022. The case-level base is roughly eight probands over four publications;
          no reported variant has functional support; one variant (2 probands) is common in the population;
          two probands carried a second variant (a pathogenic TNNI3 variant, and a MYBPC3 VUS). A dedicated
          2023 TCAP screen of 40 Iranian cardiomyopathy patients found no pathogenic allele. Dismech curates
          the entity because MONDO:0011843 exists and clinical panels still return TCAP variants, but
          the whole pathograph in this entry is conditional on the association being real, and every node
          is tagged HYPOTHETICAL or PROVISIONAL accordingly.
        proposed_experiments:
        - experiment_id: exp_tcap_hcm_case_control_burden
          name: Case-control rare-variant burden test for TCAP in hypertrophic cardiomyopathy
          description: Compare the burden of rare TCAP variation in large sequenced hypertrophic cardiomyopathy
            cohorts against ancestry-matched population reference data (gnomAD), with the definitive-gene
            carriers excluded so a residual TCAP signal is not confounded by a co-occurring sarcomere
            variant.
          supporting_outcome:
          - A significant excess of rare TCAP variation in cases would move the gene-disease relationship
            above Disputed.
          refuting_outcome:
          - Absence of excess burden at adequate power would support refuting the association outright.
        - experiment_id: exp_tcap_hcm_isogenic_allele_series
          name: Isogenic human cardiomyocyte allele series for the reported TCAP HCM variants
          description: Knock the reported alleles (T137I, R153H, C57W, p.Glu12fs) into a common hiPSC
            background and phenotype the derived cardiomyocytes and engineered heart tissues for hypertrophy,
            sarcomere organisation, and relaxation.
          supporting_outcome:
          - A reproducible hypertrophic or diastolic phenotype attributable to the allele would supply
            the missing functional evidence.
          refuting_outcome:
          - Indistinguishable phenotype from isogenic wild type would argue the alleles are benign.
        - experiment_id: exp_tcap_hcm_rephenotyping_published_probands
          name: Contemporary re-sequencing of the published TCAP HCM probands
          description: Re-analyse the originally reported probands with current cardiomyopathy panels
            or genome sequencing to establish whether a better-supported variant in another gene explains
            each case.
          refuting_outcome:
          - Recovery of a definitive-gene variant in most probands would collapse the residual case-level
            evidence for TCAP.
      selected_evidence:
        snippet: As a result of this reevaluation, the classification changed from LIMITED to DISPUTED.
        supports: SUPPORT
    origin:
