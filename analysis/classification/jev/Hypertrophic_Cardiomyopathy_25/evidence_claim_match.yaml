  704231627f466023c0ca5ea5489d2f9f9430faeff7723dfb425fbbed35524bcb:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 25
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 25
            term:
              id: MONDO:0011843
              label: hypertrophic cardiomyopathy 25
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tcap_hcm_prevalence_and_penetrance_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the prevalence and penetrance of TCAP-attributed hypertrophic cardiomyopathy?
        rationale: Neither is known, and neither can be estimated while the association is Disputed. The
          only figures available are clinic-cohort yields (4 of 389, and 1 of 239 myofilament-negative
          probands), which ClinGen has shown are inflated by at least one common population variant. No
          population-based carrier frequency, no penetrance estimate, and no natural-history series exist
          for CMH25.
        proposed_experiments:
        - experiment_id: exp_tcap_biobank_carrier_penetrance
          name: Population-biobank carrier frequency and imaging penetrance for TCAP alleles
          description: Identify carriers of the reported TCAP hypertrophic-cardiomyopathy alleles in a
            population biobank with cardiac magnetic resonance imaging and quantify how many show left
            ventricular hypertrophy, giving an ascertainment-free penetrance estimate.
          refuting_outcome:
          - A high carrier frequency with no imaging phenotype would argue the alleles are benign population
            variation.
        - experiment_id: exp_tcap_registry_natural_history
          name: Multi-registry aggregation of TCAP variant carriers with hypertrophic cardiomyopathy
          description: Pool TCAP variant carriers across international hypertrophic cardiomyopathy registries
            with standardised phenotyping and follow-up to assemble a natural-history series large enough
            to describe onset, outcome, and arrhythmic risk.
      selected_evidence:
        snippet: Furthermore, 1 variant (2 probands) is common in the population (Bos et al, 2006, PMID
          16352453), and 2 co-occurred with other variants
        supports: SUPPORT
