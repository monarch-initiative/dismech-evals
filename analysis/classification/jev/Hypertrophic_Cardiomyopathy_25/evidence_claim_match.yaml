        description: 'The best-characterised in vivo consequence of losing telethonin is not a structural
          Z-disc collapse but a failure of stress adaptation. Telethonin knockout mice have normal hearts
          at baseline — other titin anchorage routes compensate — yet decompensate into heart failure
          after biomechanical stress, at least partly through cardiomyocyte apoptosis driven by telethonin''s
          nuclear role in p53 turnover ("mechanoptosis"). Loss of telethonin mRNA with nuclear accumulation
          of the protein is also seen in human failing hearts. An independent Tcap-null line shows the
          same load-gated pattern in the excitation-contraction machinery: isolated t-tubule defects and
          desynchronised calcium transients at three months, progressive t-tubule loss by eight months,
          and accelerated t-tubule disruption specifically after aortic banding. This node is retained
          because it is the only in vivo mechanistic account of telethonin in the heart, but its direction
          of effect (loss of function) differs from the human HCM alleles (missense, gain of interaction),
          and the mouse phenotype is heart failure rather than hypertrophic cardiomyopathy.'
        cell_types:
