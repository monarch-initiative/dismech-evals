  1207853f7f06afc67a3eecdae0098eea4101597378349f8cab80e49b400fdbfb:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 25
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 25
            term:
              id: MONDO:0011843
              label: hypertrophic cardiomyopathy 25
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tcap_mouse_knockout_versus_human_hcm
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Myocardial Adaptation to Biomechanical Stress
        prompt: Does the telethonin-knockout mouse model the human TCAP hypertrophic phenotype, given
          that it is a loss-of-function model that produces stress-induced heart failure rather than hypertrophic
          cardiomyopathy?
        rationale: 'The Tcap-null mouse is the only in vivo cardiac model, and it points the opposite
          way from the human cardiac claim on three counts. First, direction of effect: the mouse lacks
          telethonin entirely, whereas the human HCM alleles are heterozygous missense changes reported
          to *augment* Z-disc binding. Second, phenotype: the mouse has a structurally and functionally
          normal heart at baseline and decompensates into heart failure with cardiomyocyte apoptosis only
          after biomechanical stress — it does not develop hypertrophic cardiomyopathy. Third, the same
          study explicitly refutes the structural premise that telethonin is indispensable for titin anchorage.
          Any inference from this model to CMH25 pathogenesis therefore requires an unstated and unverified
          assumption that loss and gain of Z-disc interaction converge on the same disease.'
        proposed_experiments:
        - experiment_id: exp_tcap_missense_knockin_mouse
          name: Missense knock-in rather than null mouse model of TCAP cardiomyopathy
          description: Generate mice carrying the human T137I, R153H, or C57W allele in place of a null
            allele and phenotype for left ventricular hypertrophy, septal geometry, and diastolic function.
          supporting_outcome:
          - A hypertrophic phenotype in a missense knock-in would establish allele-appropriate in vivo
            modelling of CMH25.
          refuting_outcome:
          - A normal heart in the knock-in, in contrast to the stressed null, would show the null mouse
            does not model the human allele.
        - experiment_id: exp_tcap_null_versus_knockin_stress_comparison
          name: Head-to-head stress phenotyping of null versus missense knock-in genotypes
          description: Subject Tcap-null and missense knock-in animals to identical biomechanical stress
            protocols and compare hypertrophy, apoptosis, and heart-failure endpoints, to test whether
            loss and altered interaction converge.
        - experiment_id: exp_tcap_human_myocardium_p53_apoptosis
          name: p53-dependent apoptosis assessment in human TCAP-variant myocardium
          description: Examine explanted or biopsy myocardium from a TCAP variant carrier for nuclear
            telethonin accumulation, p53 stabilisation, and cardiomyocyte apoptosis, to test whether the
            murine mechanoptosis route operates in the human disease.
      selected_evidence:
        snippet: Telethonin knockout mice do not reveal defective heart development or heart function
          under basal conditions, but develop heart failure following biomechanical stress
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
