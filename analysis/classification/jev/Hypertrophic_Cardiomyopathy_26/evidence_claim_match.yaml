  5cc5d1074ff9298827c52019bcd247c08a58e737969a3c08c25f030345cd1340:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 26
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 26
            term:
              id: MONDO:0014883
              label: hypertrophic cardiomyopathy 26
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: flnc_missense_hcm_pathogenicity_contested
        prompt: Is FLNC a genuine hypertrophic cardiomyopathy gene, or is the reported FLNC-HCM association
          largely an artefact of rare missense variation being common in the general population?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Filamin C Z-Disc Cross-Linking Defect
        - genetic#FLNC Non-Truncating Pathogenic Variants
        rationale: 'The evidence is genuinely split. In favour: FLNC missense variants segregate with
          HCM in multiple families, produce filamin C aggregates in patient myocardium and in cells, and
          in a 3,289-case sarcomere-negative HCM cohort the etiologic fraction reaches 0.98 within the
          ECG-defined subgroup. Against: a 540-patient HCM cohort found FLNC variants at a rate statistically
          indistinguishable from controls with poor pedigree segregation and no excess mortality; even
          the supportive 448-patient screen downgraded 14 of 20 candidate variants to uncertain or likely
          benign; and the burden analysis puts the etiologic fraction across all HCM cases at only 0.45.
          Decisively, the ClinGen Hereditary Cardiovascular Disease GCEP did not simply fail to curate
          FLNC-HCM: it re-curated FLNC as one of three genes selected for HCM-like phenotypes presenting
          as isolated left ventricular hypertrophy, restricted the curation to non-loss-of-function variants
          (explicitly separating them from the loss-of-function arrhythmogenic entity), retained a Definitive
          classification (8.1 genetic + 6 experimental = 14.1 points) — but assigned it to the disease
          entity myofibrillar myopathy, with left ventricular hypertrophy and restrictive cardiomyopathy
          listed as associated features rather than as a standalone hypertrophic entity. So the expert-panel
          position is that the non-truncating FLNC cardiac phenotype is the cardiac expression of filaminopathy/MFM,
          not a separate CMH. The emerging resolution is that FLNC-related hypertrophic disease is real
          but narrower than the raw carrier rates imply, is best identified phenotype-first (restrictive
          features plus the characteristic repolarization ECG) rather than genotype-first, and is arguably
          better nosologically placed on the filaminopathy spectrum than in the CMH numbered series.'
        proposed_experiments:
        - experiment_id: exp_cmh26_rod2_segregation_functional
          name: Prospective ROD2-restricted segregation and functional study
          description: Recruit families carrying ROD2-domain FLNC missense variants — the subset with
            the strongest clustering signal — and collect prospective cascade segregation data alongside
            a standardized functional battery (aggregation assay, filamin C distribution, lysosomal/autophagic
            readouts) in patient-derived cardiomyocytes. Powering segregation and function together on
            one variant class is the most direct route to converting the current variants of uncertain
            significance into interpretable calls.
        - experiment_id: exp_cmh26_clingen_hcm_validity_curation
          name: ClinGen gene-disease validity curation of FLNC for the hypertrophic phenotype
          description: Formal ClinGen Hereditary Cardiovascular Disease GCEP curation of the FLNC-hypertrophic
            cardiomyopathy relationship, matching the existing Definitive assertions for FLNC-myofibrillar
            myopathy and FLNC-dilated cardiomyopathy. An expert-panel classification, restricted to non-truncating
            alleles, would settle whether CMH26 should be reported clinically and would give this entry
            a citable validity anchor.
      selected_evidence:
        snippet: FLNC mutations were common in both HCM patients and healthy population. The pathogenicity
          of FLNC mutations detected in HCM patients and its association with the clinical outcomes should
          be cautiously interpreted.
        supports: SUPPORT
