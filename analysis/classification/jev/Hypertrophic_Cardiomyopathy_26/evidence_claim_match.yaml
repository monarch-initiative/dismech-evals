        description: 'There is no FLNC-specific disease-modifying therapy, so pharmacological management
          is the generic hypertrophic-cardiomyopathy regimen: beta-blockers (or non-dihydropyridine calcium
          channel blockers when beta-blockade is not tolerated) to slow the heart rate, lengthen diastolic
          filling time and relieve angina and dyspnoea, with diuresis added cautiously once restrictive
          physiology and congestion dominate. Because the FLNC ventricle is small and stiff with impaired
          filling rather than obstructed by hypercontractility, the therapeutic goal here is filling time
          and congestion control rather than relief of outflow obstruction.'
