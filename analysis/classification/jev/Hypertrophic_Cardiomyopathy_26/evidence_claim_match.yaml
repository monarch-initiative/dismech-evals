  3bfa3c4b66e4e5f05d6fb1c780f3cd209ad1506242de2e8cc0123a341b85e3be:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 26
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 26
            term:
              id: MONDO:0014883
              label: hypertrophic cardiomyopathy 26
        context: []
      assertion_type: Genetic
      assertion:
        name: FLNC Non-Truncating Pathogenic Variants
        association: Non-truncating (predominantly missense) pathogenic variants
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: FLNC
          term:
            id: hgnc:3756
            label: FLNC
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        features: 'The variant class is the single most important genotype-phenotype fact about FLNC.
          Non-truncating variants — almost all missense, and clustered in the ROD2 region — are the ones
          enriched in hypertrophic and restrictive cardiomyopathy, and they act by producing a misfolded,
          aggregation-prone filamin C protein. Truncating (protein-losing) FLNC variants are enriched
          instead in dilated and left-dominant arrhythmogenic cardiomyopathy, act through haploinsufficiency,
          do not produce myocardial filamin C aggregates, and were completely absent from a screen of
          1,078 hypertrophic cardiomyopathy patients. A CMH26 diagnosis therefore requires a non-truncating
          allele; a truncating FLNC allele in a patient with apparent hypertrophy should prompt re-examination
          of the phenotype rather than assignment to this entity. Pathogenicity of individual FLNC missense
          variants remains contested: in the largest dedicated HCM screen only 6 of 20 candidate variants
          reached likely-pathogenic, 10 were variants of uncertain significance, and a separate 540-patient
          cohort found FLNC variants at similar frequency in patients and controls with poor pedigree
          segregation.'
        case_fractions:
        - population: 448 consecutive hypertrophic cardiomyopathy patients sequenced for FLNC plus the
            main sarcomere genes (Asturias, Spain), 450 population controls.
          case_fraction_percent: 4.9
          cohort_size: 448
          notes: 20 FLNC candidate variants in 22 of 448 patients (4.9%); after segregation and functional
            review only 6 variants in 7 patients (1.6%) were classified likely pathogenic, so the pathogenic-variant
            yield is lower than the candidate-variant yield.
        - population: 540 hypertrophic cardiomyopathy patients and 307 healthy controls (Fuwai Hospital,
            China).
          case_fraction_percent: 7.2
          cohort_size: 540
          notes: 39 of 540 HCM patients (7.2%) carried an FLNC variant, but so did 4.2% of controls (p
            = 0.101), and pedigrees did not segregate — this cohort argues that the raw carrier rate substantially
            overstates the causal fraction.
        variants:
        - name: FLNC p.A1539T
          description: The founding CMH26 missense variant, identified by whole-exome sequencing and segregating
            with familial hypertrophic cardiomyopathy in the index family reported by Valdes-Mas and colleagues.
          gene:
            preferred_term: FLNC
            term:
              id: hgnc:3756
              label: FLNC
        - name: FLNC p.S1624L
          description: ROD-region missense variant segregating with autosomal dominant restrictive cardiomyopathy;
            myocardial immunohistochemistry showed filamin C-specific cytoplasmic inclusions, and the
            same variant produced cytoplasmic aggregates in transfected myoblasts.
          gene:
            preferred_term: FLNC
            term:
              id: hgnc:3756
              label: FLNC
        - name: FLNC p.I2160F
          description: Second missense variant reported with autosomal dominant restrictive cardiomyopathy
            in the same study, in a family whose myocardium likewise showed cytoplasmic protein inclusions.
          gene:
            preferred_term: FLNC
            term:
              id: hgnc:3756
              label: FLNC
        - name: FLNC ROD2-domain missense variants
          description: 'A class rather than a single allele: rare missense variants clustered in the ROD2
            domain, recruited across 21 families, that produce an HCM-RCM overlap with saw-tooth hypertrabeculation,
            severe diastolic dysfunction, and no demonstrable cytoplasmic aggregation in cell models.'
          gene:
            preferred_term: FLNC
            term:
              id: hgnc:3756
              label: FLNC
      selected_evidence:
        snippet: Truncating FLNC mutations were absent in patients with other phenotypes, including 1,078
          patients with hypertrophic cardiomyopathy.
        supports: SUPPORT
