        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: flnc_nontruncating_aggregation_model
        hypothesis_label: Non-truncating filamin C aggregation / Z-disc proteotoxicity model
        status: CANONICAL
        description: The default model for the hypertrophic pole of FLNC disease holds that missense and
          other non-truncating variants yield a filamin C protein that is still expressed but misfolds,
          accumulates as large cytoplasmic aggregates, and destabilizes the Z-disc. Sarcomeric organization
          degrades, the myocardium becomes stiff and hypertrophies, and the patient develops a hypertrophic-restrictive
          phenotype. This is explicitly the opposite arm of the FLNC mechanism dichotomy from the haploinsufficiency
          that follows truncation.
      selected_evidence:
        snippet: 'Two major pathomechanisms in FLNC-related cardiomyopathy have been described: protein
          aggregation resulting from non-truncating mutations and haploinsufficiency triggered by filamin
          C truncation.'
        supports: SUPPORT
