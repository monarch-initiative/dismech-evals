        context: []
      assertion_type: Treatment
      assertion:
        name: Cardiac Myosin Inhibition (mechanistically questionable in this entity)
        description: 'Cardiac myosin inhibitors such as mavacamten are a mechanism-directed therapy for
          hypertrophic cardiomyopathy — they reduce actin-myosin cross-bridge formation and so relieve
          the hypercontractility and outflow obstruction of sarcomeric HCM. That rationale does not transfer
          cleanly to CMH26. The FLNC-related hypertrophic/restrictive phenotype is explicitly described
          as occurring without hypercontractility, with lower contractility and a small cavity, so reducing
          contractility further is mechanistically questionable here. This entry records the treatment
          specifically to mark the caveat: no trial of a myosin inhibitor in genotyped FLNC carriers has
          been reported, and the phenotype argues against extrapolating the sarcomeric-HCM indication.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mavacamten (cardiac myosin inhibitor)
      selected_evidence:
        snippet: Pathogenic FLNC variants in patients with HCM/RCM are nontruncating and cause a discrete
          phenotype comprising a characteristic ECG, hypertrophic and restrictive features without hypercontractility,
          and extracardiac abnormalities.
        supports: REFUTE
