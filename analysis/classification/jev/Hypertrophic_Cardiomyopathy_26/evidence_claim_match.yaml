        hypothesis_group_id: flnc_rod2_nonaggregating_signaling_model
        hypothesis_label: ROD2-domain signaling / matrix-remodeling arm without demonstrable aggregation
        status: EMERGING
        description: A competing or superimposed arm proposes that at least some non-truncating FLNC variants
          — specifically those clustered in the ROD2 domain, a protein-interaction and signaling region
          — produce the hypertrophic-restrictive phenotype without forming detectable cytoplasmic aggregates,
          acting instead through altered filamin C distribution among cardiomyocytes and differential
          extracellular matrix remodeling. In the largest ROD2-specific series the transfected cell models
          failed to show aggregation, which is difficult to reconcile with a purely proteotoxic model
          and leaves the proximal mechanism for this variant subset unresolved.
      selected_evidence:
