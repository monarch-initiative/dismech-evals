      assertion:
        name: Filamin C Z-Disc Cross-Linking Defect
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        description: FLNC encodes filamin C, the striated-muscle filamin. It is an actin-cross-linking
          dimer built from an N-terminal actin-binding domain plus 24 immunoglobulin-like repeats, with
          calpain-sensitive hinges, dimerization through repeat 24, and Z-disc targeting via a unique
          82-residue insertion in repeat 20; at the Z-disc it cross-links thin filaments from adjacent
          sarcomeres and links the sarcomere to the sarcolemma. The primary lesion in CMH26 is a qualitative
          perturbation of this cross-linking protein by a non-truncating (usually missense) variant —
          not a thick- or thin-filament contractile lesion, and not simple loss of one allele. Reported
          HCM-associated variants are predominantly missense and cluster in the ROD2 region.
