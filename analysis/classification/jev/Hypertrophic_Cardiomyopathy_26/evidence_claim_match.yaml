  7568082f1cde4cfe9a5f538ac1d2ac5330d0858afeb6734a0941961f448974ed:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 26
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 26
            term:
              id: MONDO:0014883
              label: hypertrophic cardiomyopathy 26
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: flnc_animal_models_do_not_model_the_hypertrophic_arm
        prompt: Do the available Flnc animal models say anything about CMH26, given that every published
          mouse model is a loss-of-function model and therefore reproduces the truncating dilated arm
          rather than the non-truncating hypertrophic one?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Mutant Filamin C Aggregation and Proteostatic Burden
        - pathophysiology#Filamin C Z-Disc Cross-Linking Defect
        rationale: Mouse Flnc genetics has been done exclusively by deletion. Global and cardiomyocyte-specific
          Flnc knockouts die in utero from ruptured ventricular myocardium, and an inducible adult cardiac-specific
          knockout produces rapid onset dilated cardiomyopathy with reduced systolic force and Z-disk
          misalignment. Both are loss-of-function, i.e. the haploinsufficiency mechanism that in humans
          causes the dilated and arrhythmogenic phenotypes, and neither reproduces hypertrophy, restrictive
          physiology, or filamin C aggregation. No knock-in of a human CMH26 missense allele has been
          reported. The consequence is that the aggregation and proteostasis nodes of this entry rest
          on human myocardium, human iPSC-cardiomyocytes and transfected cell lines, with no in vivo corroboration
          at all — and that mouse Flnc data must not be imported into this entry as if it modelled the
          hypertrophic arm.
        proposed_experiments:
        - experiment_id: exp_cmh26_missense_knockin_mouse
          name: Knock-in mouse carrying a human CMH26 ROD2 missense allele
          description: Generate a knock-in mouse bearing a segregating human ROD2-domain FLNC missense
            allele (rather than a null allele) and phenotype it for wall thickness, diastolic function,
            trabeculation, filamin C aggregation, and lysosomal/autophagic markers. This is the missing
            in vivo test of whether the non-truncating allele class is sufficient to produce the hypertrophic
            and restrictive phenotype in a mammal.
        - experiment_id: exp_cmh26_engineered_heart_tissue_diastolic
          name: Engineered heart tissue from CMH26 patient iPSC-cardiomyocytes
          description: Build three-dimensional engineered heart tissue from patient-derived CMH26 iPSC-cardiomyocytes
            and measure passive tension and relaxation kinetics alongside aggregate and lysosomal readouts,
            to test whether aggregation is sufficient to produce the stiffness that defines the clinical
            phenotype without invoking an animal model.
      selected_evidence:
        snippet: To determine how FLNC regulates systolic force transmission and DCM remodeling, we used
          an inducible, cardiac-specific FLNC-knockout (icKO) model to produce a rapid onset of DCM in
          adult mice.
        supports: SUPPORT
