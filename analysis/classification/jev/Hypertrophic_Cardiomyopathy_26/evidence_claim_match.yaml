        - Left ventricular dilation with systolic dysfunction, not a small stiff hypertrophied cavity.
        - Myocardial immunohistochemistry shows no abnormal filamin C aggregates.
        - Inferolateral negative T waves and low QRS voltages, with early prophylactic defibrillator implantation
          recommended.
        disease_term:
          preferred_term: dilated cardiomyopathy
