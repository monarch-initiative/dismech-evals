              label: hypertrophic cardiomyopathy 26
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Genetic Testing
        description: 'Multi-gene cardiomyopathy panel or exome sequencing including FLNC. Three interpretive
          rules are specific to this gene: the variant class must be recorded (non-truncating for CMH26,
          truncating for the dilated/arrhythmogenic entity); missense variants require segregation or
          functional support before being called pathogenic, since FLNC missense variation is common in
          unaffected populations; and calls in exons 46-48 must be checked against the highly homologous
          downstream FLNC pseudogene, which is a short-read mis-mapping hazard in exactly the ROD2-adjacent
          region where this entity''s variants cluster.'
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
