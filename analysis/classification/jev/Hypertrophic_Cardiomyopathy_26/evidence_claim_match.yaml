      assertion_type: Discussion
      assertion:
        discussion_id: cmh26_hypertrophic_vs_restrictive_boundary
        prompt: Should CMH26 be modelled as a hypertrophic cardiomyopathy, given that MONDO lists restrictive
          cardiomyopathy 5 among its exact synonyms and every large series describes a hypertrophic-restrictive
          overlap rather than pure hypertrophy?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Diastolic Relaxation and Myocardial Stiffening
        rationale: 'MONDO:0014883 is asserted as a subtype of familial hypertrophic cardiomyopathy and
          carries CMH26 and cardiomyopathy, familial restrictive 5 as exact synonyms of the same node,
          reflecting the OMIM 617047 entry. The literature supports the merge: the ROD2 series describes
          an HCM-RCM overlap, the 2026 family study describes hypertrophic and restrictive features together,
          and the original FLNC restrictive families carry the same class of non-truncating allele. This
          entry follows MONDO in treating the hypertrophic node as primary while curating restrictive
          physiology as a first-class phenotype rather than splitting a second entity. If MONDO later
          separates the restrictive node, this entry should be re-scoped rather than duplicated.'
      selected_evidence:
        snippet: FLNC-mRod2 variants show a high prevalence of an overlapped phenotype comprising RCM,
          HCM and deep hypertrabeculation with saw-tooth appearance and distinctive cardiac histopathological
          remodeling.
        supports: SUPPORT
