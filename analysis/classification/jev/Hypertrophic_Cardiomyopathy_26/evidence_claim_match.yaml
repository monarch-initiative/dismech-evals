  197c535e15a074124e25f4e9b8ef08d6f13e6853d8751bf7c3951230f4fcfe0a:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 26
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 26
            term:
              id: MONDO:0014883
              label: hypertrophic cardiomyopathy 26
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: flnc_convergent_proteotoxicity
        hypothesis_label: Convergent proteotoxic / lysosomal-autophagic mechanism across FLNC variant
          classes
        status: ALTERNATIVE
        description: An isogenic CRISPR hiPSC-cardiomyocyte series complicates the clean dichotomy. An
          in-frame deletion that preserves filamin C expression but causes aggregation — the engineered
          analogue of the hypertrophic variant class — and a haploinsufficient line modelling the dilated
          class both converged on increased lysosome content, enhanced autophagic flux, and accumulation
          of filamin C binding partners and Z-disc proteins, while sarcomere formation and contractile
          function were preserved in both heterozygous states. This argues that the proximal cardiomyocyte
          lesion in the hypertrophic arm is proteostatic rather than contractile, and that the two variant
          classes may share a downstream degradative bottleneck even though their clinical phenotypes
          diverge.
      selected_evidence:
        snippet: these heterozygous variants caused increases in lysosome content, enhancement of autophagic
          flux, and accumulation of FLNC-binding partners and Z-disc proteins.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1161/CIRCRESAHA.120.317076
      reference_title: Filamin C Cardiomyopathy Variants Cause Protein and Lysosome Accumulation
      evidence_source: IN_VITRO
      explanation: The shared lysosomal/autophagic response of the aggregate-forming and the haploinsufficient
        heterozygous lines is the basis for this convergence hypothesis.
