      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: UNKNOWN
        prevalence_class: NOT_YET_DOCUMENTED
        notes: No population-based prevalence estimate exists for the FLNC-specific form of hypertrophic
          cardiomyopathy. Occurrence is reported only as the yield of FLNC variants within sequenced HCM
          cohorts, and even that yield is disputed (see the case_fractions on the genetic entry and the
          discussion on contested missense pathogenicity). Rare-variant burden analysis in a large sarcomere-negative
          HCM cohort put the etiologic fraction of rare FLNC missense variants across all HCM cases at
          only 0.45, rising to 0.98 in the subgroup with the characteristic repolarization ECG.
      selected_evidence:
        snippet: Rare FLNC missense variant burden indicated a low case excess among all HCM cases (etiologic
          fraction, 0.45; 95% confidence interval, 0.36-0.54), but in "ECG-positive" cases the etiologic
          fraction was substantially higher (0.98; 95% confidence interval, 0.97-0.99).
        supports: SUPPORT
