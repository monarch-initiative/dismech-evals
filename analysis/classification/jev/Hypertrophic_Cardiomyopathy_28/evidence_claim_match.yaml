        kind: CONTROVERSY
        status: OPEN
        prompt: Is FHOD3 expression increased or decreased in diseased human myocardium, and does mislocalised
          FHOD3 contribute to hypertrophy?
        attaches_to:
        - pathophysiology#Perturbed FHOD3-Directed Actin Assembly in the Cardiac Sarcomere
        rationale: One group found FHOD3 expression increased in HCM myectomy tissue; another found reduced
          FHOD3 with an isoform switch in murine and human cardiomyopathy. In cMyBP-C-null mice, where
          FHOD3 is mislocalised, overexpressing FHOD3 worsened and reducing it partially relieved the
          cardiomyopathy, which suggests mislocalised FHOD3 can be harmful rather than merely insufficient.
          These observations come from different disease contexts (not FHOD3-variant hearts) and are not
          reconciled, which is why the pathway does not commit to a single direction of FHOD3 dysfunction.
      selected_evidence:
        snippet: FHOD3 expression is increased in the setting of HCM, and both alleles of FHOD3-V1151I
          were detected in HCM myectomy tissue.
        supports: SUPPORT
