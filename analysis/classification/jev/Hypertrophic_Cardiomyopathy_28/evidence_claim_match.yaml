        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fhod3_patient_allele_mechanism
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: What do heterozygous non-truncating FHOD3 patient alleles actually do to FHOD3 activity
          and localisation in adult cardiomyocytes?
        attaches_to:
        - pathophysiology#Heterozygous FHOD3 Non-Truncating Variant
        - pathophysiology#Perturbed FHOD3-Directed Actin Assembly in the Cardiac Sarcomere
        - animal_models#Fhod3 constitutive knockout mouse
        rationale: Every functional system used so far removes FHOD3 (knockdown, knockout, conditional
          deletion) or overexpresses an engineered mutant, whereas patients are heterozygous for mostly
          non-truncating alleles clustered in the coiled-coil/DID region and exon 12. Null mice die as
          embryos and heterozygous nulls are normal, so neither reproduces adult-onset HCM, and ClinGen
          explicitly notes that no study has demonstrated a clear HCM phenotype in a model. The mechanism
          chain in this entry is therefore built from loss-of-function systems, and the allele-to-protein
          step is UNKNOWN. A patient-allele knock-in (for example a coiled-coil missense, p.Arg637Gln,
          or the exon 15-16 deletion) in mice or isogenic iPSC-derived cardiomyocytes would test whether
          these alleles reduce actin assembly, mislocalise FHOD3 away from the C-zone, or interfere with
          the wild-type protein.
      selected_evidence:
        snippet: However, it should be noted that while experimental studies have shown an important role
          for FHOD3 in heart and sarcomeric development, no studies have demonstrated a clear HCM phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
