      assertion:
        name: Cardiac Myosin Inhibitor Therapy
        description: Mavacamten improves exercise capacity and outflow obstruction in symptomatic obstructive
          HCM. The pivotal trial was not genotype stratified, no FHOD3 carriers are reported separately,
          and FHOD3 knockout cardiomyocytes are hypocontractile, so whether myosin inhibition suits FHOD3
          disease is untested; it is listed as general obstructive-HCM therapy, not as an FHOD3-directed
          one. Outflow obstruction, the indication, was not observed among the Balkan founder carriers,
          so it may be relevant to a minority of FHOD3 patients only.
        therapeutic_modality: SMALL_MOLECULE
