      assertion_type: Genetic
      assertion:
        name: FHOD3 p.Arg637Gln
        gene_term:
          preferred_term: FHOD3
          term:
            id: hgnc:26178
            label: FHOD3
        association: Intermediate-effect risk allele
        relationship_type: RISK_FACTOR
        variant_origin: GERMLINE
        notes: A recurrent coiled-coil missense allele, enriched about five-fold in an Iberian HCM cohort
          but with an estimated heterozygous penetrance of only about 1%, so on its own it is a predisposing
          intermediate-effect variant rather than a Mendelian cause. Six of seven homozygotes had early,
          severe HCM, which is a dosage effect of this allele and is not recorded as autosomal recessive
          inheritance. In a larger multi-gene analysis, intermediate-effect variants (p.Arg637Gln accounting
          for about half of carriers) worsened outcomes when combined with a monogenic variant.
        case_fractions:
        - population: Unrelated hypertrophic cardiomyopathy probands, Spain (single-centre NGS series)
          case_fraction_percent: 2.94
          cohort_size: 9668
          notes: Heterozygous p.Arg637Gln carriers; 0.58% of gnomAD controls carried the allele.
      selected_evidence:
        snippet: The variant affects a highly conserved residue localised in a supercoiled alpha helix
          considered a clustering site for HCM variants, and in heterozygosis can act as a predisposing
          factor (intermediate-effect variant) for HCM, with an estimated penetrance of around 1%.
        supports: SUPPORT
