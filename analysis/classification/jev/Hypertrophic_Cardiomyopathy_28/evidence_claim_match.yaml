              id: MONDO:0030317
              label: cardiomyopathy, familial hypertrophic, 28
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: fhod3_allele_mechanism
        hypothesis_label: Non-truncating FHOD3 alleles act through an altered (interfering) protein rather
          than haploinsufficiency
        status: EMERGING
        description: 'Three observations point away from simple haploinsufficiency: the disease alleles
          are overwhelmingly non-truncating and clustered in regulatory and sarcomere-targeting regions;
          all known splice alleles are predicted to skip in-frame cardiac exons; and Fhod3 heterozygous
          mice are normal. An overexpressed actin-assembly-dead FHOD3 causes cardiomyopathic changes in
          mice despite a wild-type allele, which shows that a defective FHOD3 can interfere in vivo. None
          of this tests a patient allele, so the hypothesis remains open; it is not encoded as DOMINANT_NEGATIVE
          on the pathway.'
      selected_evidence:
        snippet: Along with the predominance of missense variants in previous FHOD3 studies, this allows
          us to speculate that the mechanism of FHOD3 malfunctioning is dominant-negative rather than
          haploinsufficiency, although there are still not enough data to make that assertion with confidence.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
