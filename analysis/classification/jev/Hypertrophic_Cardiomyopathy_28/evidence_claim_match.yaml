        description: Germline Fhod3 nulls die by E11.5 because premyofibrils fail to mature and chamber
          formation and trabeculation abort. Heterozygotes, the genotype closest to the human dosage,
          are phenotypically normal. Transgenic cardiac re-expression of wild-type Fhod3 rescues the embryos.
        modeled_mechanisms:
        - target: Impaired Ventricular Trabecular Compaction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Trabecular myocardial development aborts in null embryos.
          limitations: A complete embryonic-lethal null; patients are heterozygous for mostly non-truncating
            alleles and present with adult hypertrabeculation, and heterozygous mice are normal.
          readouts:
          - name: Embryonic trabecular development
            target: Impaired Ventricular Trabecular Compaction
            direction: DECREASED
            interpretation: Trabeculation fails in the absence of FHOD3.
        - target: Heterozygous FHOD3 Non-Truncating Variant
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: Halving Fhod3 dosage produces no overt phenotype.
          limitations: A null allele, not a patient non-truncating allele, and mouse lifespan and haemodynamics
            differ; it rules out haploinsufficiency only for the mouse.
      selected_evidence:
        snippet: However, these premyofibrils fail to mature and myocardial development does not continue,
          leading to embryonic lethality by E11.5.
        supports: SUPPORT
