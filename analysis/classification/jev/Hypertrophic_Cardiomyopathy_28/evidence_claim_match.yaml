  113d62dbd835abf7868e8b011244e7fd32936f3a5d3042250f20f500c418b7bc:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 28
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 28
            term:
              id: MONDO:0030317
              label: cardiomyopathy, familial hypertrophic, 28
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous FHOD3 Non-Truncating Variant
        description: The initiating lesion is a heterozygous germline FHOD3 variant. Most reported disease
          alleles are non-truncating - missense, in-frame indels, canonical splice-site variants predicted
          to skip in-frame cardiac exons, and in-frame deletions of exons 15-16 - and they cluster in
          a conserved coiled-coil segment (amino acids 622-655), the diaphanous inhibitory domain and
          the cardiac-specific exon 12. The genetic association itself is established; what the alleles
          do to the protein is not. The clustering and the absence of a phenotype in Fhod3 heterozygous
          mice argue against simple haploinsufficiency, but no patient allele has been tested biochemically,
          so the functional impact is recorded as UNKNOWN rather than as dominant negative.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genetic_context:
          gene:
            preferred_term: FHOD3
            term:
              id: hgnc:26178
              label: FHOD3
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
          description: Predominantly missense, in-frame indel, splice-site and in-frame exon 15-16 deletion
            alleles. Recorded as UNKNOWN because the consequence for FHOD3 activity has not been measured
            for any patient allele; the dominant-negative reading is an inference from variant class and
            clustering (see discussions).
        genes:
        - preferred_term: FHOD3
          term:
            id: hgnc:26178
            label: FHOD3
      selected_evidence:
        snippet: Most pathogenic FHOD3 variants associated with HCM so far seem to be restricted to non-truncating
          variants (missense, splice-site, and in-frame deletions/insertions variants) and cluster to
          two DID regions, to exon 12 and to the coiled-coil domain encoded by exons 15 and 16
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38051749
      reference_title: A novel splice-site FHOD3 founder variant is a common cause of hypertrophic cardiomyopathy
        in the population of the Balkans-A cohort study.
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: Summarises the non-truncating, clustered allele spectrum across prior FHOD3 HCM studies.
