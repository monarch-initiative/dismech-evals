  29575756a3b4c08218e337d36b46570646ea891dd7ba6f4b270485457775c897:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 28
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 28
            term:
              id: MONDO:0030317
              label: cardiomyopathy, familial hypertrophic, 28
        context: []
      assertion_type: Genetic
      assertion:
        name: FHOD3
        gene_term:
          preferred_term: FHOD3
          term:
            id: hgnc:26178
            label: FHOD3
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: gene_disease_validity is deliberately left empty. ClinGen's Hereditary Cardiovascular Disease
          GCEP classifies FHOD3 as Definitive (AD), but that assertion is filed against generic hypertrophic
          cardiomyopathy (MONDO:0005045), not against MONDO:0030317, so under the repository rule it is
          a different disease pair (other_disease); it is cited as ordinary evidence below. CAUSATIVE
          is consistent with that Definitive tier. ClinGen also notes that experimental studies show FHOD3's
          role in sarcomere development but that no model has yet shown a clear HCM phenotype. A Chinese
          whole-exome cohort found that carriers of FHOD3 candidate variants (a set that includes variants
          of uncertain significance) had a higher adjusted risk of cardiovascular and all-cause death;
          this conflicts with the founding cohort's conclusion that event rates resemble unselected HCM
          and with the absence of adverse events among Balkan founder carriers.
        case_fractions:
        - population: Unrelated hypertrophic cardiomyopathy probands, Spain and UK (founding cohort)
          case_fraction_low: 1.0
          case_fraction_high: 2.0
          cohort_size: 3189
          notes: Authors' summary estimate of the FHOD3-attributable share. Candidate protein-altering
            variants were present in 2.32% of probands versus 0.65% of disease controls, so the raw candidate-variant
            rate overstates the attributable share.
        - population: Chinese hypertrophic cardiomyopathy patients (whole-exome cohort)
          case_fraction_percent: 3.3
          cohort_size: 1000
          notes: Candidate variants, not curated pathogenic variants; 1.6% of controls also carried candidates,
            so this is an upper bound on the attributable share.
        - population: Genetically solved hypertrophic cardiomyopathy probands, Balkans (Slovenia and neighbouring
            populations)
          case_fraction_percent: 16
          notes: A single founder allele (c.1646+2T>C) in 8 of 134 exome-sequenced probands; the 16% denominator
            is probands with a known genetic cause, not all HCM probands.
      selected_evidence:
        snippet: The variants' frequencies were significantly higher in patients with hypertrophic cardiomyopathy
          (74 of 3,189 [2.32%]) than in disease control subjects (18 of 2,777 [0.65%]; p < 0.001) or in
          the gnomAD database (1,049 of 138,606 [0.76%]; p < 0.001).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
