            calibration of the established risk models - observed versus predicted event rates, stratified
            by thin-filament versus thick-filament genotype. The cohorts required already exist and are
            genotyped; what is missing is the stratified calibration analysis. A systematic under-prediction
            in thin-filament carriers would justify a genotype term in risk assessment, and a correct
