        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tpm1_calcium_buffering_signaling
        hypothesis_label: Myofilament calcium buffering as the initiator of hypertrophic signaling
        status: ALTERNATIVE
        description: 'A complementary account places the primary lesion one step downstream of the regulatory
          defect: because mutant thin filaments bind calcium more avidly, myofilament calcium buffering
          rises, diastolic calcium increases, reuptake slows, and calcium-dependent signaling through
          CaMKII, calcineurin/NFAT, and ERK is chronically engaged - providing the transcriptional drive
          for hypertrophy independent of the mechanical effect. The two accounts are not exclusive; they
          differ in what they nominate as the rate-limiting step and therefore in what a therapy should
          target.'
      selected_evidence:
        snippet: Altered myofilament Ca2+ buffering is the primary initiator of signaling cascades, indicating
          that directly targeting myofilament Ca2+ sensitivity provides an attractive therapeutic approach
          in HCM.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
