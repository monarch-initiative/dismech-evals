        role: effector
        description: The stiffened, hypertrophied, fibrotic ventricle fills poorly, and when hypertrophy
          is asymmetric and septal it can also obstruct the left ventricular outflow tract dynamically.
          The clinical result is exertional dyspnoea, chest pain, and reduced exercise capacity with preserved
          or supranormal ejection fraction. Thin-filament HCM as a class tends to produce relatively less
          hypertrophy and less outflow obstruction than thick-filament HCM while carrying more heart-failure
          morbidity, so the obstructive presentation should not be assumed in a TPM1 carrier.
        biological_processes:
        - preferred_term: Relaxation of cardiac muscle
          term:
            id: GO:0055119
            label: relaxation of cardiac muscle
          modifier: DECREASED
        - preferred_term: Heart contraction
          term:
            id: GO:0060047
            label: heart contraction
          modifier: ABNORMAL
        locations:
        - preferred_term: left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
      selected_evidence:
        snippet: 'A number of distinct clinical findings appear to be correlated with thin-filament mutations:
          greater degrees of restrictive cardiomyopathy and relatively less left ventricular (LV) hypertrophy
          and LV outflow tract obstruction than that seen with thick filament mutations, increased morbidity
          associated with heart failure, increased arrhythmia burden and potentially higher mortality.'
        supports: SUPPORT
