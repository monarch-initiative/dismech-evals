  e45c43d5a4707c8b2a3a68bcd851eeef1b43e83647c1109c2e598479330f5527:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 3
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 3
            term:
              id: MONDO:0007267
              label: hypertrophic cardiomyopathy 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Crossbridge Inhibition and Increased Myofilament Calcium Sensitivity
        biological_scale: MOLECULAR
        role: amplifier
        description: Mutant alpha-tropomyosin is more flexible and sits less stably in the inhibitory
          (blocked/closed) position on actin, so the thin filament fails to keep myosin switched off.
          The measurable consequences are a left-shift in the calcium dependence of filament sliding,
          residual actomyosin activity at low calcium, and loss of the normal inhibition of sliding in
          relaxing conditions. Different alleles reach this end state by different routes - S215L and
          D219V principally by destabilizing the blocked state, E192K by permitting residual crossbridge
          activity even while overall calcium sensitivity falls - which is why calcium sensitivity alone
          is an incomplete description of the lesion.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        cellular_components:
        - preferred_term: striated muscle thin filament
          term:
            id: GO:0005865
            label: striated muscle thin filament
        biological_processes:
        - preferred_term: Regulation of muscle filament sliding
          term:
            id: GO:0032971
            label: regulation of muscle filament sliding
          modifier: ABNORMAL
        - preferred_term: Muscle filament sliding
          term:
            id: GO:0030049
            label: muscle filament sliding
          modifier: INCREASED
      selected_evidence:
        snippet: Molecular dynamic simulations of tropomyosin on actin suggest that the S215L significantly
          destabilizes the blocked regulatory state while increasing flexibility of the tropomyosin chain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
