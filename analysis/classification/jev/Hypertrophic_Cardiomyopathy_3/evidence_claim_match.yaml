      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tpm1_loss_of_crossbridge_inhibition
        hypothesis_label: Loss of tropomyosin-mediated crossbridge inhibition
        status: CANONICAL
        description: The canonical model of CMH3 is that HCM-associated TPM1 variants degrade tropomyosin's
          inhibitory function on the thin filament. Molecular-dynamics simulations show mutant tropomyosin
          is more flexible and its blocked/closed positioning on actin is destabilized; in vitro motility
          assays show higher calcium sensitivity of filament sliding and failure to inhibit sliding at
          low calcium; engineered heart tissues built from the same variants are hypercontractile with
          impaired relaxation and induce hypertrophic gene markers. Under this model the proximate lesion
          is excess residual actomyosin interaction rather than a loss of force-generating capacity.
      selected_evidence:
        snippet: These simulations and experiments support the classification of S215L as a pathogenic
          mutation and support the hypothesis that an inability to adequately inhibit actomyosin interactions
          is the mechanism whereby thin-filament mutations cause HCM.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36896133
      reference_title: Mechanisms of pathogenicity in the hypertrophic cardiomyopathy-associated TPM1
        variant S215L.
      evidence_source: IN_VITRO
      explanation: States the loss-of-inhibition hypothesis explicitly as the conclusion of a combined
        simulation, motility-assay, and engineered-heart-tissue study of a TPM1 HCM variant.
