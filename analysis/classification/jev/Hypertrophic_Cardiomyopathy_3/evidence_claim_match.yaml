      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tpm1_variant_specific_phenotype_divergence
        hypothesis_label: Variant-specific molecular divergence between hypertrophic and dilated TPM1
          phenotypes
        status: EMERGING
        description: TPM1 variants cause hypertrophic, dilated, restrictive, and noncompaction cardiomyopathy,
          and an emerging body of work proposes that the divergence is set by which physical property
          of tropomyosin the substitution perturbs. Paired analysis of E62Q (HCM) and E54K (DCM) attributes
          the hypertrophic phenotype to reduced molecular stiffness with a shift toward the closed regulatory
          state, and the dilated phenotype to a long-range allosteric change in troponin I mobile-domain
          binding. Whether this generalizes across the TPM1 allelic series, and how it interacts with
          modifier genotype and sex, is not settled.
      selected_evidence:
        snippet: Our objective was to develop a mechanistic explanation of diverging phenotypes in two
          TPM1 mutations, E62Q (HCM) and E54K (DCM).
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39436707
      reference_title: Distinct mechanisms drive divergent phenotypes in hypertrophic and dilated cardiomyopathy-associated
        TPM1 variants.
      evidence_source: COMPUTATIONAL
      explanation: Frames the hypothesis. Evidence source is COMPUTATIONAL because the mechanistic explanation
