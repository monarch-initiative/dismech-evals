      assertion:
        name: Thick-Filament Sarcomeric HCM (MYH7, MYBPC3)
        description: The other, far commoner sarcomeric causes of hypertrophic cardiomyopathy. Clinically
          and histologically overlapping with CMH3 - the histopathology is explicitly indistinguishable
          - so the distinction is molecular. Thick-filament disease tends to produce more hypertrophy
          and more outflow obstruction and less restrictive physiology than thin-filament disease.
        distinguishing_features:
        - Distinguished by the causal gene on sequencing, not by histology
        - Greater degrees of LV hypertrophy and outflow obstruction than thin-filament HCM
        - Distinct hypertrophy distributions on echocardiography (mid-septal for MYBPC3, higher septum-to-posterior-wall
          ratio for MYH7)
      selected_evidence:
        snippet: On cardiac histopathologic study, defects in this sarcomere thin filament component are
          indistinguishable from other genetic etiologies of hypertrophic cardiomyopathy.
        supports: SUPPORT
