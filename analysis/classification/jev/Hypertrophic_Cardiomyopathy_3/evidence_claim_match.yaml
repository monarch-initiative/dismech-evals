        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Divergent Non-Hypertrophic Remodeling Phenotypes
        biological_scale: TISSUE
        role: modifier
        description: Not every TPM1 variant produces hypertrophy. The same gene causes dilated, restrictive,
          and left ventricular noncompaction cardiomyopathy, and compound-heterozygous TPM1 genotypes
          have produced restrictive disease in a child whose singly heterozygous relatives had diastolic
          dysfunction and HCM. Paired mechanistic study of E62Q (hypertrophic) and E54K (dilated) attributes
          the divergence to which physical property of tropomyosin the substitution perturbs. This node
          is included because it constrains how a TPM1 finding may be interpreted clinically, not because
          it is part of the CMH3 causal chain.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: By contrast, the E54K mutation appeared to act via long-range allosteric interactions
          to increase the association rate of the C-terminal troponin I mobile domain to tropomyosin/actin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/1
