      assertion_type: Phenotype
      assertion:
        category: Cardiovascular
        name: Abnormal Electrocardiogram
        description: The earliest detectable abnormality, and the reason cascade surveillance of genotype-positive
          relatives is worth doing at all. In a prospective cohort of sarcomere-variant carriers followed
          to diagnosis, 72.3% had an abnormal ECG at the time of HCM diagnosis and 54.2% had one BEFORE
          they met diagnostic criteria - a median 4.4 years before. An abnormal ECG in a genotype-positive
          relative is therefore not an incidental finding but the strongest available predictor of subsequent
          conversion to overt disease.
        phenotype_term:
          preferred_term: Abnormal EKG
          term:
            id: HP:0003115
            label: Abnormal EKG
        notes: The cohort is sarcomere-variant carriers across genes, of whom TPM1 carriers were 3.2%
          (9 individuals), so this is class-level rather than TPM1-specific evidence. It is curated at
          SUPPORT rather than PARTIAL because the claim being made - that ECG change precedes diagnosis
          in sarcomeric HCM - is exactly what the cohort measured.
      selected_evidence:
        snippet: Of these, 45 (54.2%) of 83 had an abnormal ECG before fulfilling the diagnostic criteria
          and this was first documented a median 4.4 years
        supports: SUPPORT
