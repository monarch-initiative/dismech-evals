  ce092c72fd418c5eccfe5d0f28f63f7af7b50bebad2d8d6ad7154b40eb48af8b:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 3
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 3
            term:
              id: MONDO:0007267
              label: hypertrophic cardiomyopathy 3
        context: []
      assertion_type: Genetic
      assertion:
        name: MYH7 (digenic modifier)
        gene_term:
          preferred_term: MYH7
          term:
            id: hgnc:7577
            label: MYH7
        relationship_type: COOPERATING
        notes: 'Coexistence of a thin-filament TPM1 variant with thick-filament MYH7 variants has been
          reported to produce more severe hypertrophy than the TPM1 variant alone, and 18% of carriers
          in the p.Arg21Leu founder series carried an additional sarcomere-gene variant. Multi-variant
          genotype is therefore a relevant modifier when interpreting a TPM1 finding.

          This entry deliberately does NOT bind a digenic inheritance term (HP:0010984) and is not a member
          of the Digenic and Oligogenic Disorders grouping. A TPM1 variant alone causes CMH3; the MYH7
          second hit changes severity, not whether disease occurs. Digenic inheritance in the sense the
          grouping uses requires both loci for the phenotype, which is not what the cited South Indian
          family shows. Recorded here so the call is not re-litigated from the paper''s title, which does
          say "digenic".'
      selected_evidence:
        snippet: Thus, we strongly suggest that the coexistence of these digenic mutations is rare, but
          leads to severe hypertrophy in a South Indian familial hypertrophic cardiomyopathy (FHCM).
        supports: SUPPORT
    origin:
