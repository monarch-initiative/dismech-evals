          roughly five times faster. A model driven by wall thickness may therefore systematically under-call
          risk in a genotype whose danger is weighted toward heart failure rather than toward hypertrophy,
          or may correctly identify a genuinely lower arrhythmic risk. Nothing in the current evidence
          distinguishes those. TPM1 specifically cannot settle it: it accounted for 9 of 285 carriers
          in the largest penetrance cohort and a minority of the 15 thin-filament patients in the outcome
          cohort.'
        proposed_experiments:
        - experiment_id: tpm1_thin_filament_risk_scd_calibration
          name: External validation of HCM sudden-death risk models in thin-filament genotypes
          description: Pool thin-filament HCM patients across the existing genotyped registries and assess
            calibration of the established risk models - observed versus predicted event rates, stratified
