          or may correctly identify a genuinely lower arrhythmic risk. Nothing in the current evidence
          distinguishes those. TPM1 specifically cannot settle it: it accounted for 9 of 285 carriers
          in the largest penetrance cohort and a minority of the 15 thin-filament patients in the outcome
          cohort.'
