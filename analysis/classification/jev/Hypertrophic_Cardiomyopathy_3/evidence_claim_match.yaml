  15fd7d3c630c1d80e1a34c7af5017bc47a8c085794a0a6bb61714b2e4642272c:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 3
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 3
            term:
              id: MONDO:0007267
              label: hypertrophic cardiomyopathy 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tpm1_arrhythmic_risk_and_risk_scd_calibration
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the true arrhythmic risk in TPM1 hypertrophic cardiomyopathy, and do the established
          HCM sudden-death risk models calibrate correctly in thin-filament disease?
        attaches_to:
        - phenotypes#Sudden Cardiac Death
        - phenotypes#Non-Sustained Ventricular Tachycardia
        rationale: 'The literature points in two directions at once, and the disagreement is not resolvable
          from the published evidence. Narrative reviews of thin-filament cardiomyopathy describe a high
          sudden-death risk marked by family history, non-sustained ventricular arrhythmia and abnormal
          exercise blood-pressure response. The one prospective thin-filament cohort with nearly five
          years of follow-up reports the opposite: no malignant arrhythmic event occurred in any thin-filament
          patient, and its authors state directly that the higher-risk claim is controversial between
          studies and depends on age of onset and genotype within individual families. Both readings cannot
          be right for the same population. The practical consequence is a calibration question rather
          than an academic one. The conventional sudden-death risk models were derived on cohorts dominated
          by thick-filament genotypes, and the same cohort study found thin-filament patients had milder
          hypertrophy - the dominant input to those models - while progressing to advanced heart failure
          roughly five times faster. A model driven by wall thickness may therefore systematically under-call
