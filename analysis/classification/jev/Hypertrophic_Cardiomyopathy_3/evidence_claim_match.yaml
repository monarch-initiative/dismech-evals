        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tpm1_hcm_human_model_fidelity
        prompt: Do engineered heart tissues and hiPSC-cardiomyocytes carrying TPM1 variants faithfully
          model adult human CMH3, given that they are immature, lack the fibrotic and neurohormonal context,
          and in several studies overexpress the variant rather than carry it at endogenous dose?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cardiomyocyte Hypercontractility and Impaired Relaxation
        rationale: 'Almost all of the mechanistic evidence for CMH3 curated here comes from engineered
          tissue, hiPSC-cardiomyocytes, reconstituted filaments, or simulation - the human clinical literature
          supplies genotype-phenotype correlation but essentially no mechanism. These systems reproduce
          hypercontractility and diastolic dysfunction convincingly, but they cannot reproduce the fibrosis,
          disarray, and neurohormonal remodeling that dominate the clinical disease, and overexpression
          studies replaced a substantial fraction of endogenous protein. The direction of a reported effect
          can even invert between systems: one variant panel reported reduced calcium-transient amplitude
          in overexpressing cardiomyocytes, whereas the buffering study reported increased diastolic calcium.
          This is an open question of translational validity rather than an absence of evidence.'
      selected_evidence:
        snippet: To define toxic threshold levels, we performed dose-dependent transfection of TPM1 variants.
        supports: SUPPORT
