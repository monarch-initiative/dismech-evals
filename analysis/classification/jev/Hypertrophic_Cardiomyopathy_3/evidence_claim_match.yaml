        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiac Magnetic Resonance with Late Gadolinium Enhancement
        diagnosis_term:
          preferred_term: Cardiac magnetic resonance imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        description: CMR does two things in this genotype that echocardiography does not. It measures
          wall thickness more reliably in the segments where thin-filament disease is mildest - the one
          prospective thin-filament cohort found the difference from thick-filament disease significant
          by both echo and CMR, with the CMR comparison the stronger of the two - and late gadolinium
          enhancement quantifies the fibrotic substrate that this entry curates as a phenotype and as
          an arrhythmic mechanism. The second matters disproportionately here because the hypertrophy
          in thin-filament disease is milder than in thick-filament disease, so wall thickness alone understates
          disease burden in exactly this population.
        results: Maximum wall thickness, typically lower than in thick-filament HCM, and late gadolinium
          enhancement marking replacement fibrosis.
        notes: The late-gadolinium-enhancement prevalence figure that circulates for thin-filament HCM
          is not quotable from any abstract cached for this entry - it comes from the full text of the
          cohort study. The role of LGE is stated here on the strength of the fibrosis phenotype this
          entry already curates rather than on an unverified percentage.
      selected_evidence:
        snippet: individuals with thin-filament mutations exhibited significantly lower maximum left ventricular
          wall thickness, as measured by both echocardiography (p = 0.024) and cardiac magnetic resonance
          (p = 0.006)
        supports: SUPPORT
