        prompt: What determines whether a given TPM1 substitution produces hypertrophic, dilated, restrictive,
          or noncompaction cardiomyopathy, and can that mapping be predicted from the residue's structural
          role well enough to guide variant interpretation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Divergent Non-Hypertrophic Remodeling Phenotypes
        rationale: TPM1 is a single small gene with at least four distinct cardiomyopathy outputs, and
          within a single family the same variant can produce diastolic dysfunction in one relative and
          overt HCM in another, while compound heterozygosity produced restrictive disease in a child.
          One paired study offers a molecular explanation for the hypertrophic-versus-dilated split, but
          it covers two variants. Without a systematic allele-to-mechanism-to-phenotype map, a novel TPM1
          missense finding cannot be assigned to CMH3 rather than to its allelic siblings on mechanistic
          grounds, and the therapeutic direction (myosin inhibition versus activation) is not determinable
          from the genotype.
      selected_evidence:
        snippet: Several mutation-mediated disease mechanisms have been identified, with proof for gene-
          and mutation-specific cellular perturbations.
        supports: SUPPORT
