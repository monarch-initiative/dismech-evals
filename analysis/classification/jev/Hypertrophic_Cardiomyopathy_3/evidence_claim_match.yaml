            term:
              id: MONDO:0007267
              label: hypertrophic cardiomyopathy 3
        context: []
      assertion_type: Treatment
      assertion:
        name: Cardiac Myosin Inhibition (Mavacamten)
        description: 'Mavacamten is a first-in-class allosteric cardiac myosin inhibitor that reduces
          the number of force-generating crossbridges. It is mechanistically well matched to CMH3, whose
          lesion is failure to keep crossbridges inhibited: in patient-derived engineered heart tissue
          carrying TPM1 E192K, chronic mavacamten abolished the contractile difference from control and
          reversed cardiomyocyte hypertrophy. In symptomatic obstructive HCM generally, the phase 3 EXPLORER-HCM
          trial showed improvement in exercise capacity, outflow gradient, NYHA class, and health status.
          The gene-specific evidence is preclinical; the clinical trial evidence is genotype-agnostic.'
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mavacamten
        target_phenotypes:
        - preferred_term: Left ventricular outflow tract obstruction
          term:
            id: HP:0032092
            label: Left ventricular outflow tract obstruction
        - preferred_term: Exercise intolerance
          term:
            id: HP:0003546
            label: Exercise intolerance
        notes: 'The `therapeutic_agent` term binding is intentionally omitted: NCIT does have a Mavacamten
          concept (NCIT:C174901) but it is classified under NCIT:C168966 Inotropic Support rather than
          under NCIT:C1909 Pharmacologic Substance, so it is not reachable from the ChemicalEntityTerm
          roots and fails term validation; CHEBI has no mavacamten term. Per the CLAUDE.md convention,
          the agent is carried as free text rather than bound to an unreachable or incorrect identifier.
          This is an upstream NCIT classification gap.

          Direction of therapy is variant-dependent. Myosin inhibition is the correct direction for the
          hypercontractile hypertrophic alleles; the dilated TPM1 alleles studied alongside them required
          the opposite modulation, so mavacamten should not be extrapolated to a TPM1 carrier with a dilated
          phenotype.'
      selected_evidence:
        snippet: Chronic mavacamten treatment abolished contractile differences between control and TPM1
          E192K engineered heart tissues and reversed hypertrophy in cardiomyocytes.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
