              label: hypertrophic cardiomyopathy 3
        context: []
      assertion_type: Genetic
      assertion:
        name: TPM1
        gene_term:
          preferred_term: TPM1
          term:
            id: hgnc:12010
            label: TPM1
        relationship_type: CAUSATIVE
        frequency: Minority cause of hypertrophic cardiomyopathy - about 3% of familial cases in the founding
          referral-centre survey, under 1% in more recent series.
        case_fractions:
        - population: Familial HCM referral-centre cohort (Watkins et al.)
          case_fraction_percent: 3.0
          notes: Historical estimate from the first systematic screen of alpha-tropomyosin in HCM probands.
        - population: Iberian inherited-cardiac-disease cohort, p.Arg21Leu variant only
          case_fraction_percent: 0.61
          cohort_size: 4099
          notes: Single-variant fraction (p.Arg21Leu) among HCM cases in a 10,561-proband inherited-heart-disease
            series; reflects a regional founder effect in Galicia, Extremadura, and northern Portugal
            rather than a general TPM1 rate.
        notes: 'The Glu62Gln allele is a useful anchor because it has both a human clinical pedigree (PMID:12651045,
          twelve affected members, five young deaths) and a full engineered-heart-tissue mechanistic characterization
          (PMID:39436707) - a rare combination in this gene.

          Reported CMH3 alleles are missense and distributed across the molecule rather than confined
          to a single hotspot, although codon 175/180 (period 4/5) and codon 21 (N-terminal) recur. Alleles
          cited in this entry with human genotype-phenotype data: Asp175Asn, Glu180Gly, Arg21Leu, Ser215Leu,
          Gln68Arg, Asp254Gly, Gly3Arg (homozygous), and Glu62Gln; alleles characterized principally in
          vitro or in silico: Glu192Lys, Asp219Val.'
      selected_evidence:
        snippet: 'At 15 years follow-up, estimated HCM penetrance by causal gene was as follows: MYBPC3
          43% (95% CI: 32% to 57%), MYH7 66% (95% CI: 47% to 83%), TNNI3 17% (95% CI: 7% to 39%), TNNT2
          50% (95% CI: 30% to 74%), TPM1 42% (95% CI: 11% to 92%)'
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32731933
      reference_title: Penetrance of Hypertrophic Cardiomyopathy in Sarcomere Protein Mutation Carriers.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The only gene-specific penetrance estimate available for TPM1: 42% at 15 years. It
        is quoted with its full confidence interval and alongside the other genes deliberately, because
        the interval - 11% to 92% - overlaps every other gene in the table and the estimate rests on 9
        carriers across 3 families. PARTIAL for that reason: the point estimate is not distinguishable
        from the other sarcomere genes and must not be counselled as though it were a TPM1-specific figure.
        Quoting the bare 42% without the interval would be worse than omitting it.'
