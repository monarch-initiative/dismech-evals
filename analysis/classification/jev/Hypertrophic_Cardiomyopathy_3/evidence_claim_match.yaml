      assertion:
        name: Cardiomyocyte Hypercontractility and Impaired Relaxation
        biological_scale: CELLULAR
        role: amplifier
        description: 'At the level of the working myocyte the regulatory defect presents as hypercontractility
          with a relaxation deficit: three-dimensional engineered heart tissues carrying TPM1 HCM variants
          generate excess force, relax slowly, and show diastolic dysfunction, together with induction
          of hypertrophic gene markers and cellular hypertrophy. Patient-derived hiPSC-cardiomyocytes
          carrying the classic Asp175Asn allele reproduce the cellular phenotype with increased cell size
          and altered calcium handling and electrophysiology. Hypercontractility is the pathophysiological
          abnormality that myosin-inhibitor therapy is designed to reverse.'
