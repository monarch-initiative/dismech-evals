        context: []
      assertion_type: AnimalModel
      assertion:
        name: Constitutive Corin knockout mouse
        species: Mouse
        genotype: Corin-/- (constitutive whole-body knockout)
        publication: PMID:15637153
        description: 'The workhorse model for the corin/ANP axis. Corin-null mice develop normally, have
          elevated pro-ANP with no detectable mature ANP, and show spontaneous, salt-sensitive hypertension
          by radiotelemetry, plus cardiac hypertrophy and a late decline in cardiac function. A later
          study extended the phenotype: progressive cardiac dysfunction with hypertrophy and fibrosis
          after 9 months, faster deterioration than wild type after transverse aortic constriction, and
          amelioration of dysfunction, hypertrophy, and fibrosis by recombinant corin protein, which also
          raised plasma cGMP and lowered angiotensin II and aldosterone.'
        modeled_mechanisms:
        - target: Failure of Pro-ANP Processing
          relationship: RECAPITULATES
          fidelity: HIGH
          description: The processing block is complete and directly measured in this model, matching
            the human protein-null biochemistry.
          limitations: Murine plasma reports accumulating pro-ANP precursor whereas the human sibling
            was assayed for the N-terminal fragment, so the two measurements are not the same analyte
            even though both indicate an abolished conversion step.
          readouts:
          - name: Plasma pro-ANP and mature ANP
            target: Failure of Pro-ANP Processing
            direction: ABOLISHED
            interpretation: Mature ANP is abolished with precursor accumulation - the defining readout
              of the lost convertase step.
          - name: Restoration of pro-ANP conversion by recombinant soluble corin
            target: Failure of Pro-ANP Processing
            direction: RESTORED
            interpretation: Supplying the missing enzyme restores conversion, closing the causal loop
              on this node.
        - target: Sodium and Volume Retention with Hypertension
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Spontaneous, salt-sensitive hypertension matching the hypertension seen in the
            affected siblings.
          limitations: Murine blood-pressure regulation is measured under controlled dietary salt that
            has no counterpart in the human report, so the salt-sensitivity dimension is untested in patients.
          readouts:
          - name: Radiotelemetric arterial blood pressure
            target: Sodium and Volume Retention with Hypertension
            direction: INCREASED
            interpretation: Direct demonstration that corin loss raises blood pressure, worsened by salt
              loading.
        - target: Left Atrial Myocardial Hypertrophy and Enlargement
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Corin-null mice develop cardiac hypertrophy, but it is generalised rather than
            atrium-selective and is attributed by the authors to chronic hypertension.
          limitations: The defining feature of the human disease is that the hypertrophy is LEFT ATRIAL.
            The mouse does not reproduce that chamber selectivity, so it cannot be used as evidence for
            the atrial localisation of the phenotype - only for the existence of a hypertrophic response
            to corin loss. The transverse-aortic-constriction variant of the model imposes ventricular
            afterload surgically, which is further removed still from spontaneous human atrial disease.
          readouts:
          - name: Cardiac hypertrophy on histology
            target: Left Atrial Myocardial Hypertrophy and Enlargement
            direction: INCREASED
            interpretation: Establishes a hypertrophic response to corin loss without establishing its
              chamber distribution.
        - target: Left Atrial Fibrosis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Cardiac fibrosis develops in aged corin-null mice and after pressure overload,
            and - the key point - is reversed by giving back recombinant corin protein, which establishes
            the fibrosis as a consequence of corin deficiency.
          limitations: As with hypertrophy, the murine fibrosis is not localised to the left atrium, and
            the pressure-overload variant of the model applies a ventricular afterload stimulus rather
            than reproducing the spontaneous atrial disease.
          readouts:
          - name: Cardiac fibrosis on Sirius red / Masson trichrome staining after recombinant corin
            target: Left Atrial Fibrosis
            direction: RESTORED
            interpretation: Pharmacological replacement of the missing enzyme reverses the fibrotic remodelling,
              supporting a causal rather than incidental relationship.
        - target: Atrial Arrhythmogenic Substrate
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: No atrial arrhythmia phenotype has been reported in corin-knockout mice. The published
            characterisation is of blood pressure, chamber hypertrophy, fibrosis, contractile function,
            and lung oedema; rhythm is not among the reported endpoints, and the arrhythmia that dominates
            the human phenotype is therefore unmodelled.
          limitations: 'This is a negative claim about model coverage, and it should be read as such:
            the absence of a reported arrhythmia phenotype reflects endpoints that were not assessed as
            much as any demonstrated absence of arrhythmia. Either way the model cannot currently substantiate
            the arrhythmic arm of the human disease, which is the arm carrying the stroke and quality-of-life
            burden.'
      selected_evidence:
        snippet: Thus, our data establish corin as the physiological pro-ANP convertase and indicate that
          corin deficiency may contribute to hypertensive heart disease.
        supports: SUPPORT
