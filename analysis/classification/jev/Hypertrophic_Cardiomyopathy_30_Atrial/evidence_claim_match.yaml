        biological_scale: MOLECULAR
        role: effector
        description: 'ANP is synthesised in cardiac myocytes as the precursor pro-ANP, which must be cleaved
          to release the bioactive C-terminal peptide. Corin is that convertase, and its cleavage of pro-ANP
          is highly sequence specific. In the absence of corin the precursor is not processed: corin-knockout
          mice have elevated pro-ANP with no detectable ANP, and the affected human sibling had no detectable
          N-terminal pro-ANP alongside no detectable corin.'
        cell_types:
        - preferred_term: regular atrial cardiac myocyte
          term:
            id: CL:0002129
            label: regular atrial cardiac myocyte
        biological_processes:
        - preferred_term: peptide hormone processing
          term:
            id: GO:0016486
            label: peptide hormone processing
          modifier: DECREASED
      selected_evidence:
        snippet: Our results show that recombinant human corin converts pro-ANP to ANP and that the cleavage
          in pro-ANP by corin is highly sequence specific.
        supports: SUPPORT
