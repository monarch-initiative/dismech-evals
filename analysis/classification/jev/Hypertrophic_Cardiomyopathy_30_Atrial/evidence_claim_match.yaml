          this was reported as fibrosis of the left atrium, with one of two circulating fibrosis protein
          markers elevated. In corin-knockout mice, cardiac fibrosis develops with age and is reversed
          by recombinant corin protein, which also lowers the transcript signature associated with fibrosis
          - a rescue experiment that places the matrix accumulation causally downstream of corin loss
          rather than merely alongside it.
