        biological_scale: CELLULAR
        role: central_effector
        description: 'Mature ANP acts through the natriuretic peptide receptor A guanylyl cyclase to raise
          cGMP in vascular, renal, and cardiac target cells, producing natriuresis, vasodilation, and
          restraint of the renin-angiotensin-aldosterone system. With no mature ANP, this cGMP tone is
          absent. The pharmacological converse is directly demonstrated: giving recombinant corin protein
