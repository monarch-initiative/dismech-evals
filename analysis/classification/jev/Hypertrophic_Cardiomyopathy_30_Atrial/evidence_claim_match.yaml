  c1c1f90dbb418151b998338d47adc4b64795883733b2553d12b048965a9ae27d:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 30, Atrial
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 30, atrial
            term:
              id: MONDO:0958241
              label: cardiomyopathy, familial hypertrophic, 30, atrial
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deficient ANP-NPR-A-cGMP Signalling
        biological_scale: CELLULAR
        role: central_effector
        description: 'Mature ANP acts through the natriuretic peptide receptor A guanylyl cyclase to raise
          cGMP in vascular, renal, and cardiac target cells, producing natriuresis, vasodilation, and
          restraint of the renin-angiotensin-aldosterone system. With no mature ANP, this cGMP tone is
          absent. The pharmacological converse is directly demonstrated: giving recombinant corin protein
          back to corin-knockout mice raised plasma cGMP and lowered angiotensin II and aldosterone. This
          is the rate-limiting node of the disease - everything distal to it is a consequence of missing
          cGMP signalling rather than of any structural cardiac protein defect.'
        biological_processes:
        - preferred_term: regulation of systemic arterial blood pressure by atrial natriuretic peptide
          term:
            id: GO:0003050
            label: regulation of systemic arterial blood pressure by atrial natriuretic peptide
          modifier: DECREASED
        - preferred_term: renal sodium excretion
          term:
            id: GO:0035812
            label: renal sodium excretion
          modifier: DECREASED
        molecular_functions:
        - preferred_term: natriuretic peptide receptor activity
          term:
            id: GO:0016941
            label: natriuretic peptide receptor activity
          modifier: DECREASED
      selected_evidence:
        snippet: The corin treatment also decreased the gene expression associated with cardiac hypertrophy
          and fibrosis, increased plasma cGMP levels, lowered plasma levels of N-terminal pro-atrial natriuretic
          peptide, angiotensin II, and aldosterone, and lessened lung edema in the Corin KO mice subjected
          to TAC.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37636304
