      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Fibroblast Activation
        biological_scale: CELLULAR
        role: effector
        conforms_to: fibrotic_response#Mesenchymal Cell Activation
        description: 'Cardiac fibroblasts adopt a myofibroblast-like, matrix-producing phenotype. Natriuretic-peptide/cGMP
          signalling normally opposes this: in neonatal rat cardiac fibroblasts, CORIN overexpression
          blunted TGF-beta1-induced expression of col1a1 and alpha-smooth muscle actin, the two canonical
          fibroblast-activation readouts. In human cardiomyopathy transcriptomes the same axis appears
          as a molecular cluster combining low CORIN expression with a high degree of fibroblast activation.
          Conformance to `fibrotic_response#Mesenchymal Cell Activation` is asserted on that CORIN-dependent
          activation evidence; the substituted organ-specific cell type is the cardiac fibroblast.'
        cell_types:
        - preferred_term: cardiac fibroblast
          term:
            id: CL:0002548
            label: fibroblast of cardiac tissue
        biological_processes:
        - preferred_term: myofibroblast differentiation
          term:
            id: GO:0036446
            label: myofibroblast differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: Particularly, a profibrotic, heart failure with reduced ejection fraction (HFrEF)-resembling
          Cluster 1 emerged, characterized by diminished expression of CORIN and a high degree of fibroblast
          activation.
        supports: SUPPORT
