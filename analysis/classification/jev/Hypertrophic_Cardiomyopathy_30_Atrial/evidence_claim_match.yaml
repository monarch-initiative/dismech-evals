      assertion:
        name: Incomplete BNP Compensation
        biological_scale: ORGANISM
        role: modifier
        description: 'Corin also participates in processing of the B-type natriuretic peptide precursor,
          but in the affected sibling BNP was elevated rather than absent, so the BNP arm remained operational
          while the ANP arm was dead. That dissociation is the pivot of the primary report''s argument:
          a raised BNP did not prevent the atrial cardiomyopathy, hypertension, arrhythmia, or fibrosis
          from developing, so BNP does not substitute for ANP at the atrium. Curators should not read
          the elevated BNP as evidence of preserved natriuretic signalling - it is evidence of a failed
          rescue.'
        biological_processes:
        - preferred_term: sodium ion homeostasis
          term:
            id: GO:0055078
