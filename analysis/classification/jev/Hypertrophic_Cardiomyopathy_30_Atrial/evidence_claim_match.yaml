        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: corin_cmh30_evidence_base
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What are the penetrance, natural history, arrhythmic burden, stroke rate, and prognosis
          of biallelic CORIN loss of function?
        attaches_to:
        - pathophysiology#Biallelic CORIN Null Variant
        - phenotypes#Atrial Cardiomyopathy
        rationale: Every quantitative dimension of this entity is unmeasured because the human evidence
          base is a single sibship of two. There is no second family, no cohort, no prevalence estimate,
          no age-of-onset distribution, no penetrance figure for biallelic carriers, no arrhythmia incidence,
          no stroke rate, and no survival data. Nothing in this entry's treatment section rests on CORIN-specific
          outcome evidence; all of it is extrapolated from general hypertension, atrial-fibrillation,
          and cardiomyopathy management. Curators should resist the temptation to borrow numbers from
          the sarcomeric hypertrophic cardiomyopathy series that shares the CMH naming - those figures
          describe a mechanistically unrelated ventricular disease. A second reported family with an independent
          CORIN null genotype would be the single most valuable addition to this entry.
      selected_evidence:
        snippet: Two siblings presented with cardiomyopathy, hypertension, arrhythmia, and fibrosis of
          the left atrium.
        supports: SUPPORT
