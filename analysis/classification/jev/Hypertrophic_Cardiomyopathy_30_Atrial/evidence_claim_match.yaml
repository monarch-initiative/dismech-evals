        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: corin_hypomorphic_allele_boundary
        kind: INTERPRETATION
        status: RESOLVED
        prompt: Should the common CORIN I555(P568) hypomorphic allele, and the CORIN-low fibrotic cardiomyopathy
          transcriptomic cluster, be curated as part of this disease entry?
        attaches_to:
        - genetic#CORIN
        - pathophysiology#Cardiac Fibroblast Activation
        rationale: 'Resolved as NO for the phenotype and prevalence sections, YES as mechanistic corroboration
          only. The I555(P568) allele (T555I + Q568P) is common in people of African ancestry, reduces
          rather than abolishes natriuretic peptide processing, and is associated with hypertension, an
          enhanced hypertrophic response to afterload, and impaired BNP processing in heart failure. Those
          are common complex traits attributable to a hypomorph in the heterozygous state, not the recessive
          null disease described here, and importing their frequencies or outcomes would inflate this
          entry with numbers that do not describe it. The same boundary applies to the transcriptomic
          finding that a low-CORIN, fibroblast-activated cluster of sporadic cardiomyopathy has worse
          ejection fraction and prognosis: that cohort is not CORIN-null. Both bodies of work are retained
          where they speak to MECHANISM - that reduced corin activity is sufficient to raise blood pressure
          and to dis-inhibit cardiac fibroblast activation - and the corresponding evidence items record
          exactly that distinction in their explanations.'
      selected_evidence:
        snippet: The corin I555 (P568) allele is common in blacks and is associated with higher blood
          pressure and an increased risk for prevalent hypertension.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16216958
      reference_title: Corin gene minor allele defined by 2 missense mutations is common in blacks and
        associated with high blood pressure and hypertension.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Defines the hypomorphic-allele literature this boundary excludes from the phenotype
