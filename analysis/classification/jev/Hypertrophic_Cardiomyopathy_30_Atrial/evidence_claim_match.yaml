  2e36806d91d2d7bf07d04998775faae6f86a9df20f1a37273b263927aa096ff9:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 30, Atrial
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 30, atrial
            term:
              id: MONDO:0958241
              label: cardiomyopathy, familial hypertrophic, 30, atrial
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: corin_null_mouse_atrial_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the constitutive corin-knockout mouse model the human CMH30 phenotype, given that
          it reproduces the endocrine and blood-pressure arms faithfully but neither the atrial selectivity
          nor the atrial arrhythmia that define the human disease?
        attaches_to:
        - pathophysiology#Left Atrial Myocardial Hypertrophy and Enlargement
        - pathophysiology#Atrial Arrhythmogenic Substrate
        rationale: Evidence in the model exists and is strong - abolished pro-ANP processing, salt-sensitive
          spontaneous hypertension, age-dependent hypertrophy and fibrosis, and rescue by recombinant
          corin - so this is a translational validity question rather than an absence of evidence. Two
          specific mismatches limit what may be inferred. First, the murine hypertrophy and fibrosis are
          not chamber-selective and are attributed by the authors to chronic hypertension, so the model
          cannot substantiate the left atrial localisation that names the human disease. Second, and more
          consequentially, the reported assessment battery is echocardiography and tissue histology with
          no rhythm monitoring, so the atrial flutter and fibrillation that carry the human stroke and
          symptom burden have no counterpart endpoint at all - the model is silent on them rather than
          negative. The transverse-aortic-constriction variant compounds this by imposing surgical VENTRICULAR
          afterload, a stimulus with no equivalent in the spontaneous human disease. Consequently the
          mouse should be cited for the corin/ANP/blood-pressure axis and for the corin-replacement rescue,
          and NOT as support for the atrial phenotype.
        proposed_experiments:
        - experiment_id: atrial_ep_aged_corin_null
          name: Atrial electrophysiology in aged corin-null mice
          description: Implanted telemetry or programmed atrial stimulation in aged corin-null mice to
            determine whether atrial arrhythmia occurs at all in the model, converting a silent endpoint
            into a positive or negative result.
        - experiment_id: atrium_restricted_corin_deletion
          name: Atrium-restricted conditional Corin deletion
          description: Delete Corin selectively in atrial cardiomyocytes to test whether atrial disease
            can be produced without systemic hypertension - the cleanest discriminator between the autocrine
            and mechanical accounts of atrial selectivity.
        - experiment_id: ipsc_atrial_cardiomyocytes
          experiment_design: TARGETED_PERTURBATION
          name: Patient-derived iPSC atrial cardiomyocytes and engineered atrial tissue
          description: Isogenic CRISPR-corrected patient lines differentiated to atrial cardiomyocytes,
            with pro-ANP cleavage, cGMP, conduction, and matrix production as readouts, to establish the
            human atrial cell-autonomous consequence of the null genotype.
      selected_evidence:
        snippet: Cardiac function was assessed by echocardiography and tissue analysis in Corin KO mice
          at different ages or subjected to transverse aortic constriction (TAC), which increased pressure
          overload.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
