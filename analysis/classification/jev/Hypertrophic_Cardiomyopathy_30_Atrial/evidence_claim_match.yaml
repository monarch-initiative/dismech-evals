            term:
              id: MONDO:0958241
              label: cardiomyopathy, familial hypertrophic, 30, atrial
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Recessive
        description: Both affected siblings carried the CORIN null variant in the homozygous state, and
          the associated ClinVar record (VCV002504113, OMIM allelic variant 605236.0004, NM_006587.4(CORIN):c.684dup
          p.Met229fs, a 1-bp duplication at 4p12) is classified pathogenic. Heterozygous relatives were
          not reported as having the atrial cardiomyopathy phenotype. Note that this is a different dose-response
          regime from the common hypomorphic CORIN I555(P568) allele, which is a heterozygous-state susceptibility
          factor for hypertension and hypertrophy rather than a cause of CMH30.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Each had a homozygous null variant in CORIN, the gene encoding atrial natriuretic peptide
          (ANP)-converting enzyme.
        supports: SUPPORT
