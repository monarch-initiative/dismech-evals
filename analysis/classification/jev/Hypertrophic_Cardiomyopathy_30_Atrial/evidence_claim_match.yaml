  60a0d1af9ae13a31850ee9890818033459294c6e7fcf8d63b6b4d80a12692a75:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 30, Atrial
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 30, atrial
            term:
              id: MONDO:0958241
              label: cardiomyopathy, familial hypertrophic, 30, atrial
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: corin_atrial_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why is the cardiomyopathy of biallelic CORIN loss selectively LEFT ATRIAL in humans, when
          corin loss removes a systemic endocrine signal and the corin-knockout mouse shows generalised,
          hypertension-attributed cardiac hypertrophy and fibrosis?
        attaches_to:
        - pathophysiology#Left Atrial Myocardial Hypertrophy and Enlargement
        - pathophysiology#Left Atrial Fibrosis
        rationale: 'The atrial localisation is what makes this a distinct disease entity rather than "hypertensive
          heart disease due to an endocrine defect", and it is exactly the part with no mechanistic explanation.
          Three candidate accounts are on the table and no data currently separate them: (1) an autocrine
          or paracrine account, in which the left atrium suffers most because it is the tissue that synthesises
          pro-ANP, so the local concentration of mature ANP falls furthest there; (2) a mechanical account,
          in which the thin-walled atrium is simply the chamber least able to tolerate the chronic pressure
          and volume load created by systemic hypertension, making the atrial predominance a consequence
          of hypertension rather than of local signalling; and (3) an ascertainment account, in which
          the atrial phenotype is what brought a single sibship to attention and a larger cohort would
          show ventricular disease too - the OMIM/MedGen synopsis does already record reduced left ventricular
          ejection fraction. Distinguishing these matters clinically, because account (2) implies that
          aggressive blood-pressure control should largely prevent the atrial disease, while account (1)
          implies it should not.'
        proposed_experiments:
        - experiment_id: chamber_resolved_anp_cgmp
          name: Chamber-resolved ANP and cGMP measurement in corin-null myocardium
          description: Measure mature ANP and cGMP separately in atrial and ventricular myocardium of
            corin-null models, with and without blood-pressure normalisation, to test whether the atrium
            sustains a distinct local signalling deficit beyond the systemic one.
        - experiment_id: bp_controlled_corin_null_cohort
          name: Blood-pressure-controlled corin-null cohort
          description: Follow atrial size and fibrosis in corin-deficient animals maintained normotensive
            by antihypertensive therapy from a young age. Persistent atrial remodelling under normal blood
            pressure would favour the autocrine account; its absence would favour the mechanical one.
      selected_evidence:
        snippet: These and other findings support the hypothesis that BNP cannot fully compensate for
          a lack of activation of the ANP pathway and that corin is critical to normal ANP activity, left
          atrial function, and cardiovascular homeostasis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37913506
      reference_title: Corin and Left Atrial Cardiomyopathy, Hypertension, Arrhythmia, and Fibrosis.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors themselves frame corin's criticality as being to LEFT ATRIAL function specifically,
        which is the observation this gap asks the mechanism for.
