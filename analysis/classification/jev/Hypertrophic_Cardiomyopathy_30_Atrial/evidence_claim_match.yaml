        diagnosis_term:
          preferred_term: Atrial Natriuretic Peptide Measurement
          term:
            id: NCIT:C74886
            label: Atrial Natriuretic Peptide Measurement
        description: 'Mechanistically the most discriminating biochemistry available: the corin-null state
          produces undetectable circulating corin and undetectable N-terminal pro-ANP with an elevated
          BNP. That pattern - a dead ANP arm beside a live BNP arm - is not produced by ordinary heart
          failure, in which both rise together. It is nonetheless NOT a validated diagnostic assay for
          this disease, and NT-pro-ANP is not a routine clinical test; treat it as a mechanistic confirmation
          once CORIN is implicated, not as a screening test.'
        results: Undetectable corin and N-terminal pro-ANP with elevated B-type natriuretic peptide.
      selected_evidence:
        snippet: A plasma sample obtained from one of the siblings had no detectable levels of corin or
          N-terminal pro-ANP but had elevated levels of B-type natriuretic peptide (BNP) and one of the
          two protein markers of fibrosis that we tested.
        supports: SUPPORT
