      assertion:
        name: Genetic Testing for MYBPC3 Variants
        description: Molecular confirmation is what distinguishes CMH4 from other causes of unexplained
          left ventricular hypertrophy, and - critically for this entity - determines allelic dose. Trio
          or family-based testing is required to establish whether two variants are in trans, since the
          biallelic genotype carries an entirely different prognosis and reproductive-counselling implication
          than the heterozygous state.
      selected_evidence:
        snippet: Crucially, the diagnosis guided the clinical management of the asymptomatic carrier parents,
          prompting long-term cardiac surveillance and enabling preimplantation genetic testing (PGT)
          for future family planning.
        supports: SUPPORT
