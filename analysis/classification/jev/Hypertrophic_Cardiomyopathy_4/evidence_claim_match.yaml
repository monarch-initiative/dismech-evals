  0c7bd20fb9010b8f9dea99a5f1a1c9f94c01ce576fd0808285fad9b46355056d:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 4
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 4
            term:
              id: MONDO:0007268
              label: hypertrophic cardiomyopathy 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: cMyBP-C Depletion by Nonsense-Mediated Decay and Proteasomal Degradation
        biological_scale: MOLECULAR
        role: amplifier
        description: Because the truncated peptide is not stably expressed, the operative consequence
          of a MYBPC3 truncating allele is a reduction in the amount of functional cMyBP-C in the sarcomere.
          Nonsense-mediated mRNA decay removes the PTC-containing transcript - measurably starting at
          the mRNA level in patient myocardium despite hypertrophy-driven upregulation of transcription
          - and the ubiquitin-proteasome system clears residual mutant protein. UPF3B, an NMD regulator
          upregulated specifically in MYBPC3-truncating hearts and localised to the sarcomeric Z-disc,
          has been implicated in establishing this haploinsufficiency during the first round of sarcomeric
          protein translation. The severity of the resulting phenotype scales with the residual cMyBP-C
          dose, which is what makes CMH4 a gene-dosage disease.
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Nonsense-Mediated mRNA Decay
          term:
            id: GO:0000184
            label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
          modifier: INCREASED
        - preferred_term: Proteasomal Degradation of Mutant cMyBP-C
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: INCREASED
      selected_evidence:
        snippet: Instead of expression of a poison peptide we consistently observe haploinsufficiency
          of MyBP-C in MYBPC3 mutant human heart muscle.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
