          absent and the phenotype is a severe, usually lethal neonatal cardiomyopathy. The heterozygous
          parents are asymptomatic or mildly affected, so the dose effect behaves recessively at the neonatal-severity
          threshold even though the heterozygous state is itself a dominant disease allele.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: All patients with biallelic truncating pathogenic mutations in MYBPC3 reported so far
          (n=21) were diagnosed with severe cardiomyopathy and/or died within the first few months of
          life.
        supports: SUPPORT
