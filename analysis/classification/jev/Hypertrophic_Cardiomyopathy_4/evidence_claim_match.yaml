        context: []
      assertion_type: Treatment
      assertion:
        name: AAV9-Mediated MYBPC3 Gene Replacement (Investigational)
        description: Because CMH4 is a protein-dose disease, restoring wild-type cMyBP-C is a causally
          targeted strategy rather than symptom control. An AAV9 vector carrying an optimised MYBPC3 expression
          cassette (TN-201) reversed hypertrophy and systolic dysfunction, improved diastolic function
          and prolonged survival in a symptomatic MYBPC3-deficient mouse model. This is preclinical/early
          clinical and is not established therapy.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: Rather than simply preventing cardiac dysfunction preclinically, we demonstrate in a
          symptomatic MYBPC3-deficient murine model the ability of AAV gene therapy to reverse cardiac
          hypertrophy and systolic dysfunction, improve diastolic dysfunction, and prolong survival.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/9
      evidence_path: /treatments/9/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40038304
      reference_title: AAV9-mediated MYBPC3 gene therapy with optimized expression cassette enhances cardiac
        function and survival in MYBPC3 cardiomyopathy models.
      evidence_source: MODEL_ORGANISM
      explanation: Preclinical demonstration that restoring MYBPC3 dose reverses the established phenotype,
        the therapeutic corollary of the haploinsufficiency mechanism.
