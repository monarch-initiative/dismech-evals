  de7525378d9d39f12f70f438d54e2b2e029b3aee0b52bc3c4a8b16b942ae03c7:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 4
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 4
            term:
              id: MONDO:0007268
              label: hypertrophic cardiomyopathy 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Myosin Shift from the Super-Relaxed to the Disordered-Relaxed State
        biological_scale: MOLECULAR
        role: effector
        description: 'In the resting sarcomere a substantial fraction of myosin heads sit in the super-relaxed
          (SRX) state - folded back against the thick filament core with a very low ATPase rate - forming
          an energy-conserving reserve of motors that are unavailable for force generation. cMyBP-C is
          what holds them there. Losing cMyBP-C untethers those heads and shifts the population toward
          the disordered-relaxed (DRX) state, which can hydrolyse ATP and engage the thin filament. This
          is the step that converts a protein-dose deficit into hypercontractility with raised energetic
          cost, and it is the step the approved cardiac myosin inhibitors act on: the same work that defines
          the SRX loss shows that MYK-461 (mavacamten) rescues the relaxation defect and restores normal
          contractility in MYBPC3-mutant cardiomyocytes. The shift is demonstrated in three independent
          systems - homozygous cMyBP-C knockout mouse cardiomyocytes, human MYBPC3-mutant myectomy tissue,
          and stepwise cMyBP-C depletion in vitro - and, importantly for the dose model, the human myectomy
          data show a positive correlation between residual cMyBP-C expression and the proportion of heads
          remaining in SRX.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: ATP Hydrolysis by Myosin
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: INCREASED
        cellular_components:
        - preferred_term: Myosin thick filament
          term:
            id: GO:0032982
            label: myosin filament
      selected_evidence:
        snippet: Compared to donors, only MYBPC3mut samples display a significantly diminished SRX, characterised
          by a decrease in both the number of myosin heads in the SRX and the lifetime of ATP turnover.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28658286
      reference_title: MYBPC3 mutations are associated with a reduced super-relaxed state in patients
        with hypertrophic cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates SRX loss in human myectomy tissue and, critically, shows it is specific
        to MYBPC3-mutation-positive hearts rather than a generic consequence of hypertrophy - sarcomere-mutation-negative
        HCM samples did not show it.
