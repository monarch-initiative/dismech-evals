              and higher in males; hypertrophy is typically discrete, ejection fraction is usually preserved,
              and the annual event rate is low.
          role: subtype
      assertion_type: Phenotype
      assertion:
        name: Atrial Fibrillation
        category: Cardiovascular
        description: Atrial fibrillation is a major morbidity of this disease and the route to its leading
          non-sudden complication, cardioembolic stroke. It matters disproportionately here because its
          presence mandates anticoagulation irrespective of conventional risk scoring, so it changes management
          rather than merely describing severity. In the MYBPC3-specific registry analysis it is counted
          as a component of the adverse composite outcome alongside sudden death, class III/IV heart failure
          and transplant.
        phenotype_term:
          preferred_term: Atrial fibrillation
          term:
            id: HP:0005110
            label: Atrial fibrillation
        subtype: Monoallelic CMH4
        notes: Frequency band deliberately omitted. The commonly cited HCM figures (about 20% overall,
          rising with age) come from the GeneReviews overview, whose PubMed record is a purpose statement
          with no quotable clinical text, and no MYBPC3-specific denominator for atrial fibrillation appears
          in any cached source. The association is evidenced here; the rate is not.
      selected_evidence:
        snippet: time-event analysis was performed (composite clinical outcome of sudden death, class
          III/IV heart failure, left ventricular assist device/transplant, atrial fibrillation)
        supports: SUPPORT
