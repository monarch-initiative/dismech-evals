        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Myocyte Disarray
        description: Myofibre disarray - the loss of the normal parallel alignment of cardiomyocytes,
          with hypertrophied fibres running obliquely and in whorls amid disordered connective tissue
          - is the pathognomonic histological lesion of hypertrophic cardiomyopathy and the tissue-level
          substrate for both the arrhythmic risk and the diastolic dysfunction modeled in this entry.
          It is documented directly in MYBPC3 disease in septal myocardium from an adult homozygous for
          the Indian 25-bp deletion, described as swirling of hypertrophied myofibres amid connective
          tissue disarray, and in the same family's series as hypertrophied myofibres separated by increased
          connective tissue.
        finding_term:
          preferred_term: myofibre disarray
          term:
            id: NCIT:C35867
            label: Morphologic Finding
        notes: 'The finding_term is bound only to the generic NCIT Morphologic Finding parent. NCIT has
          no myofibre-disarray term, and HP:0031318 Myofiber disarray - the precise term - is not reachable
          from the HistopathologyFindingTerm enum roots, since its ancestors run through HP:0001637 Abnormal
          myocardium morphology rather than HP:0025461 Abnormal cell morphology. The specific meaning
          is therefore carried by preferred_term. This is a genuine ontology gap and a candidate NTR rather
          than a curation shortcut. See also the model-mismatch discussion: this lesion is documented
          in humans but is not reported in the mouse models this entry curates.'
      selected_evidence:
        snippet: Histopathological section of the septal myocardium of the same individual showing 'swirling'
          of hypertrophied myofibers amid connective tissue disarray
        supports: SUPPORT
