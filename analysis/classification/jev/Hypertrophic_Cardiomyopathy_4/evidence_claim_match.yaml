  80cea5f983c987b6bfdd3563d49b0570b094e342b32b8864b5a3edf9ef193a73:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 4
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 4
            term:
              id: MONDO:0007268
              label: hypertrophic cardiomyopathy 4
        context: []
      assertion_type: Treatment
      assertion:
        name: Heart Transplantation
        description: 'Transplantation is the treatment that matters most at the biallelic pole this entry
          models. Biallelic truncating disease is a lethal neonatal cardiomyopathy - the reported infants
          died of cardiac failure before 13 weeks - and no pharmacological therapy alters that course:
          myosin inhibition presupposes hypercontractility to inhibit, and gene replacement remains investigational
          and adult-only. Transplantation is also the endpoint for the minority of heterozygous carriers
          who progress to end-stage disease, where it is counted among the adverse composite outcomes
          in MYBPC3 cohort studies.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Heart Transplantation
          term:
            id: NCIT:C15246
            label: Heart Transplantation
        notes: Applies chiefly to the Biallelic CMH4 subtype, and to the minority of monoallelic carriers
          reaching end-stage disease. No published series reports transplantation outcomes in biallelic
