  b2d5ab7b41db805191f7ef78f9956a499440b942da1dd7b555c03a8faed0403e:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 4
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 4
            term:
              id: MONDO:0007268
              label: hypertrophic cardiomyopathy 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mybpc3_heterozygous_mouse_phenotype_negative
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Heterozygous Mybpc3 mice remain phenotype-negative while human heterozygotes develop disease
          at substantial rates - which human population, if any, does the heterozygous mouse actually
          model?
        attaches_to:
        - pathophysiology#Gene-Dosage-Dependent Severity Gradient
        - pathophysiology#Myosin Shift from the Super-Relaxed to the Disordered-Relaxed State
        rationale: 'This entry curates a mouse allelic series as experimental confirmation of the dose
          gradient, and for the homozygous pole that is exactly what it provides. The heterozygous pole
          is where model and disease part company: knock-in heterozygotes for the Dutch founder variant
          did not develop HCM at the ages studied, and the same negative result appears independently
          in the super-relaxed-state measurements, where heterozygous cMyBP-C knockout mice were indistinguishable
          from wild type while homozygotes showed a clear deficit. Human heterozygotes are the common
          form of this disease. The divergence is mechanistically informative rather than merely technical
          - it is consistent with the compensation capacity documented in heterozygous human iPSC cardiomyocytes,
          and it suggests murine heterozygotes may model the genotype-positive, phenotype-negative carrier
          rather than the patient. It also constrains what the models can be used for: a heterozygous
          mouse cannot demonstrate that a therapy prevents phenotype conversion if it never converts.'
        proposed_experiments:
        - experiment_id: exp_mybpc3_heterozygous_mouse_stress_challenge
          experiment_design: TARGETED_PERTURBATION
          name: Stress-challenge and aged-cohort phenotyping of heterozygous Mybpc3 knock-in mice
          description: Test whether the heterozygous mouse is truly phenotype-negative or merely unstressed
            and studied too young, by phenotyping aged cohorts and cohorts challenged with pressure overload,
            exercise, or dietary stress. A heterozygote that converts under challenge would model the
            human carrier whose penetrance rises after age 40; one that never converts marks a genuine
            species difference in compensation capacity, and would mean preventive-therapy trials cannot
            use this model as their test bed.
      selected_evidence:
        snippet: Expectedly, knock-in of Mybpc3c.2373InsG resulted in the absence of cMyBP-C and our 18-28
          week old homozygous Mybpc3c.2373InsG model developed cardiac hypertrophy and severe left ventricular
          systolic and diastolic dysfunction, whereas HCM was not evident in Mybpc3+/InsG mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37844837
      reference_title: Characterization of heterozygous and homozygous mouse models with the most common
        hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands.
      evidence_source: MODEL_ORGANISM
      explanation: Documents the phenotype-negative heterozygote alongside the severely affected homozygote
        in the same allelic series.
