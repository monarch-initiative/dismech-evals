      assertion_type: Discussion
      assertion:
        discussion_id: mybpc3_haploinsufficiency_sufficiency
        kind: CONTROVERSY
        status: OPEN
        prompt: Is reduced cMyBP-C protein level sufficient to explain the disease caused by MYBPC3 truncating
          alleles, or do parallel mechanisms contribute before, or independently of, any measurable fall
          in protein?
        attaches_to:
        - pathophysiology#cMyBP-C Depletion by Nonsense-Mediated Decay and Proteasomal Degradation
        - genetic#MYBPC3
        rationale: 'This entry curates haploinsufficiency as the operative mechanism, and the human evidence
          for it is strong: myectomy tissue shows reduced full-length cMyBP-C with no detectable truncated
          peptide, a promoter deletion that can produce no peptide at all still causes the disease, and
          outcome is independent of where in the gene the truncation falls. The challenge is not to that
          evidence but to its sufficiency. Heterozygous MYBPC3-null iPSC cardiomyocytes maintain normal
          cMyBP-C protein despite allelic loss of function - compensating through reduced degradation
          - yet still show contractile and calcium-handling defects; haploinsufficiency becomes measurable
          only when protein demand rises, as in three-dimensional engineered tissue or under hypertrophic
          stress. If dysfunction can precede the protein deficit, protein level is not the whole mechanism.
          This matters therapeutically: the gene-replacement strategy curated in this entry is predicated
          on dose restoration being sufficient to reverse disease.'
        proposed_experiments:
        - experiment_id: exp_mybpc3_preclinical_carrier_myofibrillar_protein
          name: Quantify myofibrillar cMyBP-C in genotype-positive, phenotype-negative human myocardium
          description: The decisive missing measurement is whether cMyBP-C is already reduced in carriers
            before hypertrophy appears. Myectomy tissue comes only from symptomatic patients, so protein
            content in asymptomatic carriers is essentially unmeasured. An explant-bank or imaging-guided
            biopsy study stratified by phenotype status would establish whether the deficit precedes or
            follows remodeling, and therefore whether dose restoration alone is a sufficient therapeutic
            target.
      selected_evidence:
        snippet: While haploinsufficiency of cMyBP-C has been previously demonstrated (Helms et al., 2014;
          Barefield et al., 2015; Glazier et al., 2019), the necessity and sufficiency of simply reducing
          protein levels to cause all the observed phenotypic changes remains unclear.
        supports: SUPPORT
