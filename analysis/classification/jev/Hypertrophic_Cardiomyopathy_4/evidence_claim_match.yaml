        context: []
      assertion_type: Subtype
      assertion:
        name: Biallelic CMH4
        display_name: Biallelic (homozygous/compound heterozygous) MYBPC3 neonatal cardiomyopathy
        description: The severe neonatal form named in the MONDO definition of hypertrophic cardiomyopathy
          4. Two truncating MYBPC3 alleles abolish cMyBP-C, producing severe cardiomyopathy presenting
          in the first days to weeks of life, commonly with left ventricular noncompaction features and
          septal defects, and death from cardiac failure within the first months. Parents, as obligate
          heterozygotes, are typically asymptomatic or have mild adult-onset disease.
      selected_evidence:
        snippet: In contrast to heterozygous pathogenic mutations, homozygous or compound heterozygous
          truncating pathogenic MYBPC3 mutations cause severe neonatal cardiomyopathy with features of
          left ventricular noncompaction and septal defects in approximately 60% of patients.
        supports: SUPPORT
