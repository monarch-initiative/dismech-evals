      - /disease_term
    evidence_metadata:
      reference: PMID:36357371
      reference_title: MYBPC3 deficiency in cardiac fibroblasts drives their activation and contributes
        to fibrosis.
      evidence_source: MODEL_ORGANISM
      explanation: Overturns the premise that MYBPC3 expression is confined to cardiomyocytes, which is
        what makes a fibroblast-autonomous arm possible at all.
