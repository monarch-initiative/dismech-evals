      assertion_type: Biochemical
      assertion:
        name: NT-proBNP
        presence: Elevated
        context: Heart-failure severity marker, and the pharmacodynamic readout of cardiac myosin inhibition.
          N-terminal pro-B-type natriuretic peptide tracks heart-failure severity and falls steeply under
          cardiac myosin inhibition - in SEQUOIA-HCM the geometric mean proportional change to week 24
          was 0.20 on aficamten against 1.00 on placebo, an approximately fivefold reduction against no
          change. That makes it the practical objective marker of response to the drug class this entry
          wires to the super-relaxed-state node.
        biomarker_term:
          preferred_term: N-terminal pro-B-type natriuretic peptide
          term:
            id: HP:0031185
            label: Elevated circulating NT-proBNP concentration
        notes: Deliberately scoped to the treatment-response and heart-failure-severity role, which is
          what the cited trial evidence supports. This entry does NOT claim that NT-proBNP or high-sensitivity
          troponin are elevated in genotype-positive, phenotype-negative MYBPC3 carriers. That claim was
          proposed during review citing PMID:31877118, but that paper is an iPSC cardiomyocyte study of
          protein-level compensation and reports no patient biomarker data at all - it is cited in this
          entry where it does belong, in the haploinsufficiency-sufficiency discussion. A preclinical-biomarker
          claim would need a carrier cohort with measured analytes, which no cached source here provides.
      selected_evidence:
        snippet: the geometric mean proportional change from baseline to week 24 in the serum NT-proBNP
          level
        supports: SUPPORT
