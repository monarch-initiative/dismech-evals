        context: []
      assertion_type: Subtype
      assertion:
        name: Monoallelic CMH4
        display_name: Monoallelic (heterozygous) MYBPC3 hypertrophic cardiomyopathy
        description: The classic autosomal dominant form. A single truncating (or, less often, missense)
          MYBPC3 allele produces cMyBP-C haploinsufficiency. Penetrance is incomplete, age-related and
          higher in males; hypertrophy is typically discrete, ejection fraction is usually preserved,
          and the annual event rate is low.
      selected_evidence:
        snippet: Disease penetrance was, therefore, incomplete (56.9% in all mutation carriers, 34.5%
          in relatives), related to age (38.4% <40 versus 68.6% ≥40 years, P<0.001), and was greater in
          males than females (65.1% versus 48.1%, P=0.03).
        supports: SUPPORT
    origin:
