            term:
              id: MONDO:0007268
              label: hypertrophic cardiomyopathy 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cell-Autonomous Cardiac Fibroblast Activation by MYBPC3 Deficiency
        biological_scale: CELLULAR
        role: amplifier
        mechanism_confidence: PROVISIONAL
        description: A parallel, non-cardiomyocyte route to the fibrosis in this disease. MYBPC3 has been
          treated as cardiomyocyte-specific, and fibrosis in HCM as a secondary response to myocyte stress.
          Work in a base-edited R495Q pig model found early-onset myocardial fibrosis shortly after birth
          and, unexpectedly, that MYBPC3 is transcribed and translated in cardiac fibroblasts themselves;
          disrupting Mybpc3 in fibroblasts activated NF-kB signalling, raised TGF-beta1 and pro-inflammatory
          gene expression, and drove a HIF-1-alpha glycolytic shift that accelerated fibroblast activation.
          If this holds in human disease, part of the fibrotic burden is cell-autonomous to the fibroblast
          rather than a downstream reaction to myocyte dysfunction - which would make it a separate therapeutic
          target from myosin inhibition.
        cell_types:
        - preferred_term: Cardiac Fibroblast
          term:
            id: CL:0002548
            label: fibroblast of cardiac tissue
        biological_processes:
        - preferred_term: Transforming Growth Factor Beta Receptor Signaling
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
        notes: Mechanism confidence is PROVISIONAL and deliberately so. The evidence is a base-edited
          pig missense (R495Q) model plus an immortalised murine fibroblast line; there is no human tissue
          confirmation that fibroblast MYBPC3 loss contributes to fibrosis in patients, and human disease
          is predominantly truncating rather than missense. Curated as a parallel arm rather than folded
          into the main chain because, if confirmed, it is a distinct therapeutic target - and if it fails
          to replicate, it can be removed without disturbing the cardiomyocyte chain.
      selected_evidence:
        snippet: Unexpectedly, we found that the "cardiac-specific" MYBPC3 gene was actually expressed
          in cardiac fibroblasts from different species as well as NIH3T3 fibroblasts at the transcription
          and protein levels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
