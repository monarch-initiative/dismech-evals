  6a3e79097f1cf9a02296cae2edbd67a70707e34a7c8195d5b2b5883a0ce06ea7:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 4
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 4
            term:
              id: MONDO:0007268
              label: hypertrophic cardiomyopathy 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mybpc3_penetrance_ascertainment_discrepancy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why is MYBPC3 penetrance far lower in unselected population cohorts than in clinically
          ascertained families, and how much of the gap is ascertainment bias versus genuine modifier
          burden or environmental exposure?
        attaches_to:
        - pathophysiology#Gene-Dosage-Dependent Severity Gradient
        rationale: The penetrance figure quoted to a family decides whether a genotype-positive relative
          is told they have a substantial chance of developing disease or a small one, so this discrepancy
          is not academic. Family cohorts give incomplete but substantial penetrance that roughly doubles
          after age 40, whereas unselected population cohorts give far lower estimates. The two populations
          differ in ascertainment - families are ascertained through an affected proband and are therefore
          enriched for whatever made that proband affected - but they may also differ in modifier burden,
          comorbidity and physical-activity exposure. Until those sources are separated, neither number
          is straightforwardly the right one to counsel with, which is why this entry records the family-cohort
          figures with their ascertainment context rather than presenting a single penetrance value.
      selected_evidence:
        snippet: Disease penetrance was, therefore, incomplete (56.9% in all mutation carriers, 34.5%
          in relatives), related to age (38.4% <40 versus 68.6% ≥40 years, P<0.001)
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22267749
      reference_title: 'Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy:
        disease expression in relation to age, gender, and long term outcome.'
      evidence_source: HUMAN_CLINICAL
      explanation: The clinical-family pole of the discrepancy. Note that penetrance already differs substantially
        between probands and relatives within this single study - an ascertainment gradient visible inside
        one cohort.
