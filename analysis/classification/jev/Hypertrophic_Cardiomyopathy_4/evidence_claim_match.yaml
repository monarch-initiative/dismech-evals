          is the step that converts a protein-dose deficit into hypercontractility with raised energetic
          cost, and it is the step the approved cardiac myosin inhibitors act on: the same work that defines
          the SRX loss shows that MYK-461 (mavacamten) rescues the relaxation defect and restores normal
          contractility in MYBPC3-mutant cardiomyocytes. The shift is demonstrated in three independent
          systems - homozygous cMyBP-C knockout mouse cardiomyocytes, human MYBPC3-mutant myectomy tissue,
          and stepwise cMyBP-C depletion in vitro - and, importantly for the dose model, the human myectomy
          data show a positive correlation between residual cMyBP-C expression and the proportion of heads
          remaining in SRX.'
