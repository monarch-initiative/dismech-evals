      assertion_type: Treatment
      assertion:
        name: Mavacamten (Cardiac Myosin Inhibitor)
        description: Mavacamten is a first-in-class allosteric cardiac myosin inhibitor that reduces the
          number of force-generating actin-myosin cross-bridges. Because CMH4 is mechanistically a loss
          of the cMyBP-C brake on cross-bridge cycling, pharmacological myosin inhibition is a direct
          mechanistic counterweight. In EXPLORER-HCM it improved exercise capacity, symptoms and outflow
          gradient in symptomatic obstructive HCM. Note the trial enrolled obstructive HCM broadly, not
          a genotyped MYBPC3 cohort.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mavacamten
        notes: mavacamten deliberately carries no ontology term. NCIT:C174901 Mavacamten exists, but its
          ancestors run through Inotropic Support / Agent / Conceptual Entity - it is not reachable from
          NCIT:C1909 Pharmacologic Substance, so it fails the ChemicalEntityTerm enum - and CHEBI has
          no mavacamten term. This was re-checked with OAK during review rather than assumed; aficamten,
          by contrast, is reachable and now carries CHEBI:747213. Do not "fix" this by substituting a
          poorly fitting term.
        target_phenotypes:
        - preferred_term: Left ventricular outflow tract obstruction
          term:
            id: HP:0032092
            label: Left ventricular outflow tract obstruction
      selected_evidence:
        snippet: Patients on mavacamten had greater reductions than those on placebo in post-exercise
          LVOT gradient (-36 mm Hg, 95% CI -43·2 to -28·1; p<0·0001)
        supports: SUPPORT
    origin:
