            term:
              id: MONDO:0013369
              label: hypertrophic cardiomyopathy 7
        context: []
      assertion_type: Treatment
      assertion:
        name: Cardiac Myosin Inhibition
        description: Mavacamten is a first-in-class cardiac myosin inhibitor that reduces actin-myosin
          cross-bridge formation and directly targets the hypercontractility that is the physiological
          consequence of the sarcomere lesion. In the phase 3 EXPLORER-HCM trial it improved exercise
          capacity, outflow gradient, NYHA class, and health status in symptomatic obstructive hypertrophic
          cardiomyopathy. The trial enrolled obstructive hypertrophic cardiomyopathy irrespective of genotype,
          so its applicability to CMH7 is by inclusion in that clinical phenotype rather than by TNNI3-specific
          evidence.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: cardiac myosin inhibitor therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mavacamten (cardiac myosin inhibitor)
          - preferred_term: aficamten
            term:
              id: CHEBI:747213
              label: aficamten
        notes: 'Aficamten is folded into this treatment rather than given its own entry because it is
          the same mechanistic class acting on the same pathograph node; splitting would duplicate the
          target_mechanisms edge without adding a distinct mechanistic claim. Neither trial was genotype-stratified
          - both enrolled obstructive hypertrophic cardiomyopathy by phenotype - so neither supports a
          TNNI3-specific effect, and the applicability argument for CMH7 is mechanistic rather than empirical.
          mavacamten deliberately carries no ontology term: NCIT:C174901 exists but sits under Inotropic
          Support rather than Pharmacologic Substance, so it is not reachable from the ChemicalEntityTerm
          enum roots, and CHEBI has no mavacamten term; aficamten is reachable and carries CHEBI:747213.'
      selected_evidence:
        snippet: Treatment with mavacamten improved exercise capacity, LVOT obstruction, NYHA functional
          class, and health status in patients with obstructive hypertrophic cardiomyopathy.
        supports: SUPPORT
