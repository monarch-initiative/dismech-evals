      assertion:
        name: Myofilament Calcium Hypersensitization and Impaired Relaxation
        biological_scale: MOLECULAR
        role: amplifier
        description: 'Loss of troponin I inhibition shifts the force-calcium relationship leftward: the
          thin filament activates at lower calcium concentrations, cross-bridges are recruited inappropriately
          during diastole, and relaxation is slowed. In human hypertrophic cardiomyopathy myocardium this
          hypersensitivity is accompanied by hypophosphorylation of protein kinase A targets and by blunted
          length-dependent activation — the myofilament basis of the Frank-Starling response — and in
          TNNI3-mutant samples replacing the mutant troponin with wild-type protein restores length-dependent
          activation, establishing the troponin lesion as causal rather than secondary. The energy cost
          of contraction rises and diastolic filling is impaired, the proximate driver of the hypertrophic
          response.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
