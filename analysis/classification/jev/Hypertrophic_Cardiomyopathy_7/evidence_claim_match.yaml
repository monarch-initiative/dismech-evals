      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Troponin I Inhibitory Dysfunction
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        biological_scale: MOLECULAR
        role: trigger
        description: 'TNNI3 encodes cardiac troponin I, the inhibitory subunit of the cardiac troponin
          complex on the thin filament. In diastole it anchors actin-tropomyosin in the blocked state;
          on systolic calcium binding to troponin C the inhibitory and switch peptides release actin,
          permitting cross-bridge cycling. CMH7-associated variants are predominantly heterozygous missense
          changes distributed across the N-terminal PKA-phosphorylation extension, the troponin T/troponin
          C binding region, the inhibitory peptide, and the C-terminal actin-binding region. They do not
          abolish the protein; they degrade its inhibitory capacity and its interactions with troponin
          C and troponin T, which is the primary lesion of this disorder. The distribution is not uniform
          across the gene: approximately 80% of reported pathogenic TNNI3 variants fall in exons 7 and
          8, which encode the actin- and troponin-C-interacting domains - so the mutational hotspot coincides
          with the functional interfaces this node describes, which is why variant position carries interpretive
          weight in this gene.'
        genes:
        - preferred_term: TNNI3
          term:
            id: hgnc:11947
            label: TNNI3
        molecular_functions:
