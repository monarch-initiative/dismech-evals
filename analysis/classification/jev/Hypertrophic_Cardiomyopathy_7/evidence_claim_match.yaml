        biological_scale: ORGANISM
        role: effector
        description: The organ-level result is a thickened, stiff, hypercontractile left ventricle with
          a small cavity and impaired filling. Diastolic dysfunction rather than reduced ejection fraction
          dominates the physiology, and dynamic left ventricular outflow tract obstruction develops when
          a hypertrophied septum and systolic anterior motion of the mitral valve narrow the outflow tract
          during systole. In thin-filament genotypes such as TNNI3 the maximal wall thickness is on average
          lower than in thick-filament disease, so the diagnosis can be missed if wall thickness alone
          is used, while progression to advanced heart failure may be faster.
        locations:
        - preferred_term: Left ventricle
          term:
