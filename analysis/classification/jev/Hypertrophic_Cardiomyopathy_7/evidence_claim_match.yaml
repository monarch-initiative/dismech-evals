      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnni3_secondary_metabolic_signaling_stress
        hypothesis_label: Secondary hypertrophic signaling and mitochondrial-metabolic stress
        status: EMERGING
        description: An additional arm proposes that TNNI3 variants engage hypertrophic signal transduction
          and metabolic derangement beyond the mechanical defect — activation of the ERK cascade with
          induction of the fetal gene programme (ANP, BNP, MYH7), mitochondrial dysfunction, and increased
          autophagy and apoptosis. The supporting data come from a single-variant cell-line study and
          from metabolomic profiling of small patient cohorts, so whether this arm is variant-specific,
          secondary to the mechanical lesion, or a generic hypertrophy response is unresolved.
      selected_evidence:
        snippet: This mutation led to the upregulation of hypertrophy-associated genes ANP, BNP, and MYH7,
          increased cardiomyocyte size, and activation of the ERK signaling pathway.
        supports: SUPPORT
