            label: regulation of cardiac muscle contraction
          modifier: ABNORMAL
        - preferred_term: Sarcomere organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Approximately 80% of reported pathological variants of TNNI3 are located in exons 7 and
          8, which encode the domains that interact with myocardial actin and cardiac troponin C, which
          are sarcomere components
        supports: SUPPORT
