        prompt: TNNI3 causes hypertrophic (CMH7), restrictive (RCM1), and dilated (CMD1FF) cardiomyopathy.
          Should dismech keep these as separate gene-specific entries, and how should evidence be partitioned
          between them?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Cardiac Troponin I Inhibitory Dysfunction
        rationale: 'MONDO models the three TNNI3 cardiomyopathies as distinct entities (MONDO:0013369
          hypertrophic, MONDO:0011400 restrictive, and the dilated node), and dismech follows MONDO for
          disease_term. The shared molecular lesion — impaired troponin I inhibition of the thin filament
          — is common to all three, but the direction of the myofilament perturbation and the resulting
          ventricular geometry differ, and the clinical management differs substantially. This entry is
          scoped strictly to the hypertrophic node: every evidence item was checked to be about a hypertrophic-phenotype
          cohort, variant, or model, and no restrictive- or dilated-phenotype literature was used. Whether
          a future lumped "TNNI3-related cardiomyopathy" entity would better reflect the biology is left
          open; if the field converges there, this entry should be revisited rather than duplicated.'
      selected_evidence:
        snippet: The link between TNNI3 variants and phenotypes remains largely unexplored.
        supports: SUPPORT
