              label: hypertrophic cardiomyopathy 7
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tnni3_myofilament_calcium_hypersensitization
        hypothesis_label: Loss of troponin I inhibition and myofilament calcium hypersensitization
        status: CANONICAL
        description: The canonical model holds that CMH7 variants degrade the inhibitory function of cardiac
          troponin I. Mutant troponin I fails to hold actin-tropomyosin in the blocked state during diastole
          and its interactions with troponin C and troponin T are altered, so the thin filament activates
          at lower calcium concentrations. The resulting myofilament calcium hypersensitivity, together
          with blunted length-dependent activation and impaired protein kinase A responsiveness, produces
          hypercontractility with impaired relaxation, which is the proximate stimulus for hypertrophic
          remodeling.
      selected_evidence:
        snippet: High-myofilament Ca(2+) sensitivity is a common characteristic of human HCM and partly
          reflects hypophosphorylation of PKA targets compared with donors.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23508784
      reference_title: Perturbed length-dependent activation in human hypertrophic cardiomyopathy with
        missense sarcomeric gene mutations.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes high myofilament calcium sensitivity as a shared feature of human hypertrophic
        cardiomyopathy myocardium, including samples carrying TNNI3 mutations, which is the core of this
        hypothesis group.
