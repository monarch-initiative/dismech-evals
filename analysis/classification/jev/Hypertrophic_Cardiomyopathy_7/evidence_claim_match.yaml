  e17df46b61efa3afae692684d8e2a530675ec2f36499a15029490f3a4453b33f:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 7
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 7
            term:
              id: MONDO:0013369
              label: hypertrophic cardiomyopathy 7
        context: []
      assertion_type: Genetic
      assertion:
        name: TNNI3 Pathogenic Variants
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: TNNI3
          term:
            id: hgnc:11947
            label: TNNI3
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        features: CMH7-associated TNNI3 variants are overwhelmingly heterozygous missense changes. They
          cluster in functionally critical regions — the N-terminal extension containing the protein kinase
          A phosphorylation serines (p.Arg21Cys), the inhibitory peptide and switch region (Arg145), and
          the C-terminal actin/troponin C interaction region (Lys206) — and act by degrading rather than
          abolishing troponin I function, consistent with a dominant-negative (poison-peptide) mechanism
          incorporated into the sarcomere. Severity, penetrance, and rate of progression vary substantially
          between variants, so genotype-level rather than gene-level interpretation is required. TNNI3
          is also the causal gene for distinct restrictive and dilated cardiomyopathy entities; variant
          interpretation must be anchored to the phenotype actually observed in the family.
        case_fractions:
        - population: Hypertrophic cardiomyopathy patients (unselected)
          case_fraction_percent: 3.0
          notes: TNNI3 accounts for approximately 3% of hypertrophic cardiomyopathy.
        - population: Genotyped familial hypertrophic cardiomyopathy kindreds
          case_fraction_percent: 5.0
          notes: Reported as "up to 5%" of genotyped familial hypertrophic cardiomyopathy families; recorded
            as the upper bound of the cited range.
        variants:
        - name: TNNI3 Arg145Gly
          description: Missense variant in the inhibitory region reported in the original CMH7 series
            and shown by family study to be linked to hypertrophic cardiomyopathy. One of the two founding
            CMH7 alleles.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
        - name: TNNI3 Lys206Gln
          description: C-terminal missense variant identified as a de novo event in the original CMH7
            series, providing independent support for causality. The neighbouring K206I substitution has
            been characterized functionally and impairs troponin I inhibition of actomyosin ATPase with
            increased myofilament calcium sensitivity.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
        - name: TNNI3 p.Arg21Cys
          description: N-terminal missense variant with a founder effect in South Lebanon; the only reported
            variant in the N terminus of the protein. It impairs protein kinase A phosphorylation, increases
            calcium sensitivity, and causes diastolic dysfunction in model organisms, and produces a malignant
            clinical course with sudden cardiac death at a median age of 22.5 years, including in carriers
            without left ventricular hypertrophy.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
        - name: TNNI3 p.Ile195Phe
          description: Novel de novo heterozygous missense variant (NM_000363.5:c.583A>T) in a 14-year-old
            girl with nonobstructive hypertrophic cardiomyopathy who presented with cardiopulmonary arrest
            from ventricular fibrillation and showed progressive myocardial fibrosis and left ventricular
            remodeling. Illustrates paediatric-onset CMH7 arising de novo.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
        - name: TNNI3 Gly203Ser
          description: Human disease-causing variant modelled in the cTnI-G203S transgenic mouse, which
            reproduces the full hypertrophic cardiomyopathy phenotype including left ventricular hypertrophy,
            myocyte disarray, interstitial fibrosis, and abnormal calcium cycling, together with an atrial
            substrate for atrial fibrillation.
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
        - name: TNNI3 c.235C>T (p.Arg79Cys)
          description: 'A missense allele that this entry previously cited for generic allelic heterogeneity
            without curating as a variant. It is the subject of a dedicated 2024 study that identified
            it as the disease-causing variant in an HCM family and characterised its cellular consequences:
            upregulation of the hypertrophy markers ANP, BNP and MYH7, increased cardiomyocyte size, ERK
            pathway activation, and impaired mitochondrial function with increased autophagy and apoptosis
            in transfected human AC16 cardiomyocytes. Two caveats are stated rather than buried. First,
            unlike Arg145Gly and Lys206Gln, causality here rests on one family plus a transfection model,
            not on linkage or a documented de novo event. Second, the supporting study''s own conclusion
            is hedged - the variant "may be a pathogenic factor" - so this allele should not be treated
            as equivalent in evidential weight to the founding CMH7 alleles.'
          gene:
            preferred_term: TNNI3
            term:
              id: hgnc:11947
              label: TNNI3
      selected_evidence:
        snippet: Of 33 HCM genes, only 8 (24%) were categorized as definitive ( MYBPC3, MYH7, TNNT2, TNNI3,
          TPM1, ACTC1, MYL2, and MYL3)
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30681346
      reference_title: Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes.
