      assertion_type: DifferentialDiagnosis
      assertion:
        name: Secondary left ventricular hypertrophy from loading conditions
        description: Hypertension, aortic stenosis, and athletic remodeling all thicken the left ventricular
          wall. Hypertrophic cardiomyopathy is defined by wall thickening that is not explained by such
          loading conditions.
        distinguishing_features:
        - A sufficient hemodynamic explanation (uncontrolled hypertension, valvular obstruction) or regression
          with deconditioning argues against hypertrophic cardiomyopathy.
        - Wall thickness of 15 mm or more without an adequate loading explanation, with disarray-type
          features on imaging or a pathogenic sarcomere variant, favors hypertrophic cardiomyopathy.
      selected_evidence:
        snippet: They are defined by a left ventricular wall thickness ≥15 mm in the absence of other
          causes such as loading conditions, ischemia, or valvular disease.
        supports: SUPPORT
