        name: Arrhythmogenic Substrate
        biological_scale: TISSUE
        role: effector
        description: Disarrayed, fibrotic myocardium conducts heterogeneously and supports re-entry. Atrial
          remodeling — shortened action potential duration, increased conduction heterogeneity, myocyte
          enlargement, and interstitial fibrosis — develops in the troponin I mutant heart and underlies
          the atrial fibrillation that is the commonest arrhythmia in hypertrophic cardiomyopathy; ventricular
          arrhythmia arising in the same substrate is the mechanism of sudden cardiac death. In TNNI3
          carriers this substrate can be lethal before overt hypertrophy is present.
        cell_types:
