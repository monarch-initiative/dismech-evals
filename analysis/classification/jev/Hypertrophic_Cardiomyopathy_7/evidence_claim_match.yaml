        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: TNNI3-related restrictive and dilated cardiomyopathy
        description: TNNI3 variants also cause restrictive cardiomyopathy (RCM1, MONDO:0011400) and dilated
          cardiomyopathy (CMD1FF), which are separate MONDO entities with different ventricular geometry
          and physiology. Within a single TNNI3 kindred the expressed phenotype must be determined clinically
          rather than assumed from the gene.
        distinguishing_features:
        - Non-dilated, non-hypertrophied ventricles with severe biatrial enlargement and restrictive filling
          indicate the restrictive entity.
        - Ventricular dilation with reduced ejection fraction indicates the dilated entity.
        - Unexplained left ventricular wall thickening with preserved or supranormal ejection fraction
          indicates the hypertrophic entity curated here.
      selected_evidence:
        snippet: Despite numerous identified TNNI3 mutations associated with HCM, their severity, prevalence,
          and disease progression vary.
        supports: SUPPORT
