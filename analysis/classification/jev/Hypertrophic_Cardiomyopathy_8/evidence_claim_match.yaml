        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myl3_mouse_to_human_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the transgenic MYL3 mouse models faithfully reproduce human MYL3 hypertrophic cardiomyopathy,
          given that Tg-A57G mice develop eccentric hypertrophy with enhanced left ventricular cavity
          dimension rather than the concentric hypertrophy that defines the human disease?
        attaches_to:
        - pathophysiology#Cardiomyocyte Hypertrophy, Myocardial Stiffness and Fibrosis
        - phenotypes#Myocardial Fibrosis
        rationale: Most of the mechanistic content in this entry — super-relaxed state inhibition, calcium
          sensitisation, fibrosis, progressive remodeling — comes from transgenic mice expressing human
          MYL3 A57G or E143K. Echocardiography in Tg-A57G mice showed a phenotype of eccentric hypertrophy
          with enhanced left ventricular cavity dimension and no change in wall thickness, which is not
          the human hypertrophic cardiomyopathy morphology; and E143K, a recessive allele in humans, is
          modeled as a dominantly expressed transgene producing restrictive cardiomyopathy. The translational
          validity of these models for human CMH8 therefore remains an open question rather than an absence
          of evidence.
      selected_evidence:
        snippet: Echocardiography examination showed a phenotype of eccentric hypertrophy in Tg-A57G mice,
          enhanced left ventricular (LV) cavity dimension without changes in LV posterior/anterior wall
          thickness.
        supports: SUPPORT
