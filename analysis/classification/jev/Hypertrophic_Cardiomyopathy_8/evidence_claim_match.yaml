        biological_scale: MOLECULAR
        description: MYL3 encodes the ventricular/slow-skeletal myosin essential light chain (ELC), one
          of the two light-chain pairs of the hexameric muscle myosin. The light chains stabilize the
          long alpha-helical neck of the myosin head, and the cardiac-specific N-terminal extension of
          the ELC contacts actin and prepositions the cross-bridge for force production. Missense variants
          (e.g. Met149Val, Ala57Gly, Glu56Gly, Glu177Gly, Val79Ile, Glu143Lys) substitute residues in
          the ELC that lie at contact surfaces between the light chain and the myosin lever arm, altering
          cross-bridge mechanics rather than abolishing the protein. Subtle changes in ELC sequence are
          sufficient to alter cross-bridge properties and produce a pathological phenotype.
