  56087faf78af03f3bf0caccf9ca9522cb992e1c57dcdd64263d6f7c06e80e3df:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 8
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 8
            term:
              id: MONDO:0012111
              label: hypertrophic cardiomyopathy 8
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: 'Most reported MYL3 hypertrophic cardiomyopathy families segregate a heterozygous
          missense variant in an autosomal dominant pattern, with incomplete penetrance and late onset
          described for at least one variant. ClinGen''s Hypertrophic Cardiomyopathy Gene Curation Expert
          Panel classifies the MYL3-hypertrophic cardiomyopathy relationship as Definitive with autosomal
          dominant inheritance. Penetrance is incomplete, age-dependent, and allele-dependent: a meta-analysis
          of relatives ascertained by cascade screening puts MYL3 at about 32%, the lowest of the definitive
          sarcomere genes, while allele-specific pedigree estimates span 40% for p.V79I to 88% for p.R94H.
          Those three figures are not interchangeable and should not be averaged — the ~32% value is a
          pooled cross-study estimate for nonproband relatives found by cascade screening, whereas 40%
          and 88% are single-pedigree, allele-specific values whose spread is itself the finding. Both
          pedigree estimates are additionally age-confounded: in the p.V79I family the mean age of nonpenetrant
          carriers was 15 against 47 for penetrant carriers.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        penetrance_percentage: 32-88
        expressivity: VARIABLE
      selected_evidence:
        snippet: Penetrance varied from ≈32% for MYL3 (myosin light chain 3) to ≈55% for MYBPC3 (myosin-binding
          protein C3), ≈60% for TNNT2 (troponin T2) and TNNI3 (troponin I3), and ≈65% for MYH7 (myosin
          heavy chain 7).
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37929589
      reference_title: Meta-Analysis of Penetrance and Systematic Review on Transition to Disease in Genetic
        Hypertrophic Cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Places MYL3 penetrance at the bottom of the definitive sarcomere genes in a pooled
        meta-analysis of cascade-screened relatives, moving the estimate beyond the single-pedigree figure
        previously available.
