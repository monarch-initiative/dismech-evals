        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Thick Filament Interface Disruption and Loss of Super-Relaxed State
        biological_scale: MOLECULAR
        description: Pathogenic MYL3 variants map onto molecular interfaces of the cardiac thick filament,
          including interfaces of the myosin interacting-heads motif (IHM) that hold myosin heads in the
          energy-conserving super-relaxed (SRX) state. Destabilizing these interfaces shifts myosin from
          SRX toward the disordered relaxed (DRX) state, increasing the number of heads available to interact
          with actin and raising ATPase activity. In transgenic mice carrying the HCM-associated A57G
          ELC mutation, the SRX state is inhibited and cross-bridges become hypercontractile; the contrasting
          RCM-associated E143K ELC mutation instead stabilizes SRX, indicating that MYL3 variants can
          move the SRX/DRX equilibrium in opposite directions.
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: INCREASED
        cellular_components:
        - preferred_term: myosin filament
          term:
            id: GO:0032982
            label: myosin filament
      selected_evidence:
        snippet: We identified HCM variants residing in 30 molecular interfaces of the complex thick filament
          interactome, including the two main interfaces of the myosin interacting-heads motif (IHM),
          and interfaces involving the MHC, essential and regulatory light chains, and cMyBP-C.
        supports: SUPPORT
