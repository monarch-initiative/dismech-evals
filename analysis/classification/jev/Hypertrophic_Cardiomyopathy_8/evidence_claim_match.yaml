              label: hypertrophic cardiomyopathy 8
        context: []
      assertion_type: Treatment
      assertion:
        name: Extended Mid-Ventricular Septal Myectomy
        description: 'Surgical septal reduction for drug-refractory obstruction. This is the treatment
          where MYL3 morphology changes the operation rather than merely the indication: because the obstruction
          in this genotype is mid-cavitary rather than subaortic, relief requires an extended mid-ventricular
          myectomy, with papillary muscle reorientation where the papillary muscles contribute to the
          obstruction — not a standard subaortic myectomy. Alcohol septal ablation, the usual catheter-based
          alternative, is generally unsuitable here, since the septal perforator territory it targets
          does not supply the mid-ventricular hypertrophy.'
        therapeutic_modality: SURGERY
