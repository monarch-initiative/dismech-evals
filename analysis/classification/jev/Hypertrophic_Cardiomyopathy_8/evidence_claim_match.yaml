          evidence attests the mid-cavitary anatomy; the procedural inference from that anatomy is guideline-level
          hypertrophic cardiomyopathy practice, not a MYL3 finding. The contrast with alcohol septal ablation
          is stated for the same reason and carries no MYL3-specific evidence.'
      selected_evidence:
        snippet: characterized by mid-cavitary hypertrophy and restrictive physiology
