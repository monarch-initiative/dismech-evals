              label: hypertrophic cardiomyopathy 8
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Multigene hypertrophic cardiomyopathy panel testing
        diagnosis_term:
          preferred_term: Multigene hypertrophic cardiomyopathy panel testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: MYL3 is one of only eight genes with definitive evidence for hypertrophic cardiomyopathy
          and is on essentially all clinical panels, so a standard multigene panel — not single-gene MYL3
          testing — is the appropriate first genetic test. Single-gene MYL3 testing is appropriate only
          for site-specific cascade testing of relatives once a familial variant is known. In consanguineous
          families the panel must be interpreted with recessive inheritance in mind, or a homozygous MYL3
          genotype will be misread as uninformative heterozygosity.
        results: Identification of a pathogenic MYL3 variant establishes the molecular diagnosis and enables
          cascade testing; a homozygous or compound genotype changes both the prognosis and the recurrence
          risk given to the family.
        notes: 'Deliberately omitted from this section: chromosomal microarray, karyotype, FISH, mitochondrial
          DNA and repeat-expansion testing. There is no copy-number or repeat mechanism in MYL3 disease
          (ClinGen dosage score 0), so those tests belong to the differential-diagnosis workup of syndromic
          or mitochondrial left ventricular hypertrophy, not to a MYL3 diagnosis.'
      selected_evidence:
        snippet: and a presumable homozygous essential splice acceptor variant (c.482-1G>A, predicted
          to result in skipping of exon 5).
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/3
      evidence_path: /diagnosis/3/evidence/1
