      assertion_type: Genetic
      assertion:
        name: MYL3 Biallelic Loss-of-Function Variants
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MYL3
          term:
            id: hgnc:7584
            label: MYL3
        features: 'Exome sequencing of three consanguineous Iranian families identified homozygous MYL3
          variants that go beyond missense: a nonsense allele (c.106G>T, p.Glu36Ter), an essential splice-acceptor
          allele (c.482-1G>A predicted to skip exon 5 and disrupt the EF-hand calcium-binding domains),
          and a missense allele (c.170C>A, p.Ala57Asp). Phenotypes ranged from infantile- to early-adulthood-onset
          hypertrophic or dilated cardiomyopathy with sudden cardiac death. Morpholino knockdown of the
          zebrafish MYL3 orthologue cmlc1 impaired cardiac function and was not rescued by the mutant
          alleles, providing functional support for a true loss-of-function mechanism in the recessive
          form.'
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Morpholino knockdown of the MYL3 orthologue in zebrafish, cmlc1, resulted in compromised
          cardiac function, which could not be rescued by reintroduction of MYL3 carrying either the nonsense
          c.106G>T or the missense c.170C>A variants.
        supports: SUPPORT
