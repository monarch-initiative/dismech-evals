        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myl3_loss_of_function_vs_hypercontractility
        kind: CONTROVERSY
        status: OPEN
        prompt: Does MYL3 Glu143Lys act through loss of function, as originally proposed from the human
          recessive pedigree, or through myosin hypercontractility, as characterised in transgenic mice?
        attaches_to:
        - pathophysiology#Thick Filament Interface Disruption and Loss of Super-Relaxed State
        - genetic#MYL3 Glu143Lys (Recessive Allele)
        rationale: The human recessive pedigree inferred a loss-of-function mechanism from the requirement
          for two mutant alleles and the normal phenotype of heterozygotes, and a later study of three
          consanguineous families found biallelic nonsense and splice-acceptor MYL3 alleles with failure
          of zebrafish rescue — strong independent support for genuine loss of function in the recessive
          form. Transgenic E143K mice, by contrast, show increased duty ratio, increased actin affinity,
          increased actin-activated ATPase and stabilisation of the super-relaxed state — a hypercontractile,
          not hypomorphic, molecular phenotype. The most likely reconciliation is that MYL3 disease is
          mechanistically split (dominant missense alleles acting by altered cross-bridge mechanics; recessive
          null alleles acting by ELC insufficiency), but this has not been shown directly, and it matters
          because myosin-inhibitor therapy is rational only under the hypercontractility model and could
          be harmful under the deficiency model.
      selected_evidence:
        snippet: There are, however, no reports of DCM associated with MYL3 variants or cardiomyopathy
          associated with likely ELC deficiency due to nonsense or essential splice acceptor variants
          in MYL3.
        supports: SUPPORT
