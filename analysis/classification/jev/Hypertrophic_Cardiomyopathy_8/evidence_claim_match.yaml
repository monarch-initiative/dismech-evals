        rate_low: 1.0
        rate_high: 2.0
        notes: 'DERIVED, NOT PUBLISHED. No prevalence estimate specific to MYL3-related hypertrophic cardiomyopathy
          exists. This record is an explicit order-of-magnitude derivation from two published quantities:
          hypertrophic cardiomyopathy point prevalence of about 1 in 500 (200 per 100,000), and the myosin
          light chain genes (MYL2 and MYL3 together) accounting for about 1% of hypertrophic cardiomyopathy.
          Attributing roughly half of that 1% to MYL3 gives 1-2 per 100,000. The two supporting citations
          below each attest one input to the derivation; neither states a MYL3 prevalence, so both are
          PARTIAL. Treat the class band as the usable signal and the numeric rate as an approximation.'
      selected_evidence:
        snippet: For the past 20 years, most data have supported the occurrence of HCM at about 1 in 500.
        supports: SUPPORT
