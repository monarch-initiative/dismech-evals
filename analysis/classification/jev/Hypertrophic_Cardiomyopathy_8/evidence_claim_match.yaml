      assertion_type: Genetic
      assertion:
        name: MYL3 Missense Variants
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MYL3
          term:
            id: hgnc:7584
            label: MYL3
        features: 'Pathogenic MYL3 variants are missense substitutions affecting conserved residues of
          the ventricular essential light chain, including those at the light chain-lever arm contact
          surface (V79I), in the N-terminal region (A57G, E56G), and at M149 and E177. Most act dominantly
          with incomplete, age-dependent penetrance and low expressivity; the E143K allele is recessive.
          MYL3 is one of only eight genes with definitive evidence of causing hypertrophic cardiomyopathy.
          Penetrance is an allele property here, not a gene constant: p.V79I reached only 40% counting
          borderline disease in its pedigree, whereas p.R94H reached 88% in a Japanese registry family,
          and the pooled cross-study estimate for MYL3 as a whole is about 32% — the lowest of the definitive
          sarcomere genes. The p.R94H carriers were also morphologically atypical for this entry''s mid-cavity
          theme, showing asymmetric septal hypertrophy without obstruction, which is a further reminder
          that MYL3 morphology is allele-dependent.'
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          penetrance: INCOMPLETE
          penetrance_percentage: 40-88
          expressivity: VARIABLE
      selected_evidence:
        snippet: MYL3 | HGNC:7584 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive
        supports: SUPPORT
