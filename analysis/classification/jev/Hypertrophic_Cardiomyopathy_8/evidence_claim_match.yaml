            term:
              id: MONDO:0012111
              label: hypertrophic cardiomyopathy 8
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Atrial Remodeling and Intracavitary Stasis
        biological_scale: ORGANISM
        description: Two stasis-generating substrates converge on cardioembolism in this genotype. Diastolic
          impairment dilates the left atrium and predisposes to atrial fibrillation, which in the reported
          MYL3 mid-cavity case proved refractory to both pharmacological and direct-current cardioversion.
          Independently, the mid-ventricular obstruction characteristic of MYL3 disease can progress to
          a left ventricular apical aneurysm — a blind, akinetic pouch that is separately recognised as
          predisposing to thromboembolisation. Both routes generate cardioembolic risk, which is why anticoagulation
          rather than rhythm control alone is the operative management decision. In the index case the
          cerebrovascular events were judged cardioembolic and long-term anticoagulation was started,
          at the cost of a subsequent extra-axial haemorrhage.
        locations:
        - preferred_term: Heart left atrium
          term:
            id: UBERON:0002079
            label: left cardiac atrium
        mechanism_confidence: PROVISIONAL
        notes: 'Mechanism confidence is PROVISIONAL: the whole arm rests on a single genotyped MYL3 case
          report plus the general hypertrophic cardiomyopathy apical-aneurysm literature. No MYL3 series
          reports atrial fibrillation incidence or stroke rates, so no frequency is asserted anywhere
          in this arm.'
      selected_evidence:
        snippet: The development of LV apical aneurysm may predispose patients to complications involving
          ventricular tachyarrhythmias, thromboembolisations and ventricular rupture in the context of
          immature aneurysms.
        supports: SUPPORT
