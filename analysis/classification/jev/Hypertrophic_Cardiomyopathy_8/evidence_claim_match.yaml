  5b1b5df9ed972cd041f125c93d68553ef6fec96422014752f96c1e89963793cb:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 8
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 8
            term:
              id: MONDO:0012111
              label: hypertrophic cardiomyopathy 8
        context: []
      assertion_type: Treatment
      assertion:
        name: Cardiac Myosin Inhibition
        description: Cardiac myosin inhibitors (mavacamten) reduce the fraction of myosin heads in the
          disordered relaxed state and restore the super-relaxed state. This is the direct pharmacological
          counterpart of the MYL3 A57G lesion, which inhibits the super-relaxed state and increases the
          number of myosin heads available for actin interaction; the mouse work explicitly proposes normalizing
          myosin motor function with myosin-specific therapeutics to avert the hypercontractile state.
          Whether this benefit is realised in MYL3 carriers has not been tested clinically.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mavacamten
          - preferred_term: aficamten
            term:
              id: CHEBI:747213
              label: aficamten
        notes: 'Mavacamten and aficamten are both approved/late-phase for symptomatic obstructive hypertrophic
          cardiomyopathy generally. No MYL3-genotype-stratified efficacy data exist for either agent;
          the genotype-specific argument here is mechanistic (the SRX/DRX equilibrium these drugs act
          on is the one MYL3 variants perturb), not clinical. Mavacamten is deliberately left without
          an ontology term: NCIT:C174901 Mavacamten exists but sits under Inotropic Support rather than
          Pharmacologic Substance, so it is not reachable from the ChemicalEntityTerm enum roots and would
          fail term validation, and CHEBI has no mavacamten term. Aficamten carries CHEBI:747213. Do not
          "fix" the missing mavacamten term by substituting a poorly fitting one. A caution that follows
          from the two-mechanism controversy recorded in the discussions block: myosin inhibition is rational
          under the hypercontractility model but would be expected to worsen disease under the ELC-deficiency
          model that applies to the recessive loss-of-function alleles.'
      selected_evidence:
        snippet: 45 (37%) of 123 patients on mavacamten versus 22 (17%) of 128 on placebo met the primary
          endpoint
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32871100
      reference_title: 'Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy
        (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: Randomised phase 3 evidence that cardiac myosin inhibition improves exercise capacity
        and symptoms in obstructive hypertrophic cardiomyopathy. Enrolment was not stratified by genotype,
        so this establishes the drug class, not a MYL3-specific effect.
