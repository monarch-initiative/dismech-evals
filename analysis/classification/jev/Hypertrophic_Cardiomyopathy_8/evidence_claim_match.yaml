              label: hypertrophic cardiomyopathy 8
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Sarcomeric ultrastructural disruption with interstitial and replacement fibrosis
        diagnostic: false
        description: Myocardial fibrosis progressing with age, together with sarcomeric ultrastructural
          defects, is the tissue-level correlate of MYL3 disease. The direct observations are from transgenic
          mouse models of the MYL3 A57G and E143K essential light chain mutations; in humans, histopathology
          contributed to the diagnosis in the infantile MYL3 case, but no published MYL3 series describes
          the human histological pattern in detail.
        finding_term:
          preferred_term: interstitial and replacement myocardial fibrosis
          term:
            id: NCIT:C3044
            label: Fibrosis
        notes: 'Myofiber disarray (HP:0031318) is the classic hypertrophic cardiomyopathy histological
          finding and is very likely present in MYL3 disease, but it is deliberately NOT curated here:
          no cached MYL3 source describes it, and asserting it would mean either an unsourced claim or
          a snippet quoted from a non-MYL3 paper. This absence is a gap in the MYL3 literature, not an
          oversight in this entry.'
      selected_evidence:
        snippet: The hearts of mutant-mice demonstrated ultrastructural defects and fibrosis that progressively
          worsened in senescent animals
        supports: SUPPORT
