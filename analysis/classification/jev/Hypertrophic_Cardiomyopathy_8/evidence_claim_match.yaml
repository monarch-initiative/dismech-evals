        biological_scale: CELLULAR
        description: MYL3 variants change how the cross-bridge cycles. Recombinant myosin subfragment-1
          carrying the cardiomyopathic ELC substitutions E56G, M149V and E177G all significantly increase
          the calcium sensitivity of thin filament sliding, and M149V additionally upregulates actin-activated
          ATPase — although the specific effect on actin-myosin interaction differs between variants.
          In transgenic A57G mice, calcium sensitivity of force is increased with a reduction in maximal
          force per cross section, alongside a mutation-induced increase in myocardial stiffness. Downstream
          of the myofilament change, contractility and energetics are dysregulated.
