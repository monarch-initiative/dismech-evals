    evidence_metadata:
      reference: PMID:39895828
      reference_title: A Case Study Identified a New Mutation in the TTN Gene for Inherited Hypertrophic
        Cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The only published segregation evidence for any TTN allele in hypertrophic cardiomyopathy:
        a fourth allele, p.Arg6745Cys, tracking with disease across a three-generation Chinese Han family.
        Curated PARTIAL, and it does not overturn the Limited classification - it is one small family,
        ACMG PP1 counts only at supporting strength, there is no functional work, and the authors themselves
        note the Ig49 domain has no known protein binding site nearby. One unaffected 3-year-old carrier
        is uninformative given age-dependent penetrance rather than evidence against segregation. This
        allele is recorded because omitting it would leave the entry asserting an absence a reader could
        falsify in one search, and because the ClinGen assertion post-dates it (2025-10-28 versus February
        2025), which makes the Limited classification more persuasive rather than less.'
