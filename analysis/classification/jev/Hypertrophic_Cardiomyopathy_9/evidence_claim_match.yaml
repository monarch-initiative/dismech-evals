        relationship_type: DISPUTED
        association: Disputed causal gene. ClinGen classifies TTN-hypertrophic cardiomyopathy as Limited.
          The claimed causal alleles are rare missense substitutions (Arg740Leu in the Z-repeat region;
          two Ig-domain variants near the M-line), each reported once in sarcomere-negative HCM cohorts.
          Titin-truncating variants — the mechanism that makes TTN the commonest dilated cardiomyopathy
          gene — are NOT enriched in HCM relative to controls, and a separate line of evidence instead
          suggests TTNtv may act as an outcome modifier in established HCM rather than as a cause of it.
        notes: 'Practical consequence for variant interpretation: a rare TTN variant found on a multigene
          HCM panel should not be reported as an established cause of the patient''s hypertrophy.'
      selected_evidence:
        snippet: WES combined with Sanger sequencing results showed that the other two HCM patients in
          this family carried this TTN mutation, while none of the healthy family members carried the
          mutation except for a 3 years old girl.
        supports: SUPPORT
