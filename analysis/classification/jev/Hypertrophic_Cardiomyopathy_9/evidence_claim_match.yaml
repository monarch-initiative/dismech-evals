        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ttn_zdisc_actinin_binding
        hypothesis_label: Altered titin Z-disc binding to alpha-actinin
        status: EMERGING
        description: 'The original CMH9 proposal: a missense substitution in the titin Z-repeat region
          increases the binding affinity of titin for alpha-actinin, perturbing Z-disc assembly or Z-disc
          mechanical signalling and thereby producing hypertrophic remodelling. The supporting data are
          one proband plus a yeast two-hybrid binding assay; no animal model, no segregation data, and
          no replication in an independent HCM cohort have been reported for the Arg740Leu variant specifically.
          (Segregation has since been reported for a different TTN allele, p.Arg6745Cys, in one family
          - see the genetic section - but that does not replicate this variant or this mechanism.)'
        notes: Status is EMERGING rather than CANONICAL or ALTERNATIVE because no independent replication
          has been published in the 25+ years since the original report.
      selected_evidence:
        snippet: This mutation was not found in more than 500 normal chromosomes and increased the binding
          affinity of titin to alpha-actitin in the yeast two-hybrid assay.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10462489
      reference_title: 'Structural analysis of the titin gene in hypertrophic cardiomyopathy: identification
        of a novel disease gene.'
      evidence_source: IN_VITRO
      explanation: Provides the in vitro binding result on which the hypothesis rests. It is an interaction
        assay in yeast, not a demonstration of cardiac pathogenesis, so it supports the hypothesis only
