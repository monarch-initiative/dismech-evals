      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ttn_murf1_degradation
        hypothesis_label: Perturbed titin/MURF1 interaction with enhanced titin ubiquitination
        status: EMERGING
        description: A later proposal derived from a medaka fish mutant (non-spring heart) with hypertrophic
          myocardium and diastolic dysfunction caused by a missense change in a titin immunoglobulin domain
          at the M-line/A-band transition. Screening 96 familial HCM patients without known sarcomeric
          mutations identified two further M-line-proximal Ig domain variants; in vitro, both the fish
          and human variants increased titin binding to MURF1 and enhanced ubiquitin-mediated titin degradation.
          This remains a model-organism plus in vitro hypothesis and has not established clinical validity
          for TTN as an HCM gene.
        notes: 'Deliberately not merged with the Z-disc/alpha-actinin hypothesis: the two implicate different
          titin regions (Z-repeat versus M-line-proximal Ig domains) and different partner proteins.'
      selected_evidence:
        snippet: These findings implicate an impaired interaction between titin and MURF1 as a novel mechanism
          underlying the pathogenesis of HCM.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31628103
      reference_title: Perturbation of the titin/MURF1 signaling complex is associated with hypertrophic
