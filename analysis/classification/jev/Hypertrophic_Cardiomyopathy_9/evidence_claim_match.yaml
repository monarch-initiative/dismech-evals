  0ffd9726a636cd72a2e5d5d43947b086db9bd092b161200e6a09fadc70130ad1:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 9
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 9
            term:
              id: MONDO:0013412
              label: hypertrophic cardiomyopathy 9
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ttn_hcm_gene_disease_validity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is TTN a genuine hypertrophic cardiomyopathy gene at all, or is CMH9 a historical entity
          that should be retired?
        rationale: 'ClinGen classifies TTN-HCM as Limited. The entity rests on one 1999 proband plus two
          variants in a later 96-patient screen, with segregation reported in only one small three-generation
          family (PMID:39895828, p.Arg6745Cys, with one unaffected 3-year-old carrier), no independent
          replication of the index variant, a targeted 389-patient study that was negative across the
          four exons it examined, and TTNtv frequencies in HCM that match controls. Note that the ClinGen
          assertion is dated 2025-10-28 and that segregation report is from February 2025, so the expert
          panel plausibly had it available and still classified the relationship as Limited - which is
          a stronger argument for the classification than an absence of segregation would have been. What
          is missing is precisely the evidence class that would settle it: large-cohort case-control burden
          testing of rare TTN MISSENSE variation (not truncating variation) in HCM against gnomAD-scale
          controls, plus segregation in multiplex families. Until that exists, dismech records CMH9 as
          a disputed entity and declines to assert a mechanism.'
        proposed_experiments:
        - experiment_id: ttn_hcm_rare_missense_burden
          name: Region-stratified rare TTN missense burden test in HCM
          description: Case-control burden analysis of rare TTN missense variation in a large sarcomere-negative
            HCM cohort against population reference data, stratified by Z-disc, I-band, A-band, and M-line
            domains. Truncating variation is explicitly not the variable of interest here, since it has
