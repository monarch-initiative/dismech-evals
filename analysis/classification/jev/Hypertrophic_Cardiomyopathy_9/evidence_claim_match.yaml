      evidence_source: HUMAN_CLINICAL
      explanation: 'A targeted resequencing study in 389 unrelated HCM patients found no TTN mutations,
        weakening the claim that TTN is a recurrent HCM disease gene. Not "no mutations at all": only
        exons 2, 3, 4 and 14 were sequenced - the regions previously implicated in HCM or DCM - so this
        is a negative result over four of TTN''s 364 exons and refutes recurrence at the known sites rather
        than excluding TTN involvement across the gene. The same caveat is stated on this study''s other
        use in the genetic section, so the two explanations agree.'
