  298bea722b38f33655f44f881ab4c14a2b01aed28a6b8ea31df5cf41d314632a:
    claim:
      about:
        disease:
          name: Hypertrophic Cardiomyopathy 9
          disease_term:
            preferred_term: hypertrophic cardiomyopathy 9
            term:
              id: MONDO:0013412
              label: hypertrophic cardiomyopathy 9
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ttn_hcm_cause_versus_modifier
        kind: CONTROVERSY
        status: OPEN
        prompt: If TTN variants are not a cause of hypertrophic cardiomyopathy, are titin-truncating variants
          nonetheless a prognostic modifier within established HCM?
        rationale: These are separable claims and the evidence points in opposite directions for each.
          TTNtv prevalence in HCM equals that in controls (arguing against causation), yet in the same
          cohort TTNtv carriers had a markedly higher rate of cardiovascular death during follow-up (adjusted
          hazard ratio 6.88). A modifier effect would not make TTN an HCM gene, but would make TTN genotype
          clinically meaningful in HCM. The finding is single-cohort, rests on 3 deaths among 13 carriers,
          and has not been replicated.
        attaches_to:
        - genetic#TTN
        proposed_experiments:
        - experiment_id: ttntv_hcm_mortality_replication
          name: Independent replication of the TTNtv-cardiovascular-mortality signal in HCM
          description: Prospective or retrospective replication of the association between titin-truncating
            variant carrier status and cardiovascular death within an independent, ancestrally distinct
            HCM cohort powered for an adequate number of events.
          supporting_outcome:
          - Replication would establish TTN genotype as a prognostic modifier in HCM even though TTN is
            not an HCM disease gene.
          refuting_outcome:
          - Failure to replicate would leave the single-cohort finding as an unconfirmed signal likely
            inflated by the small number of events.
      selected_evidence:
        snippet: Our study suggests that TTNtv might be a genetic modifier of HCM and confer an increased
          risk for cardiovascular death.
        supports: SUPPORT
