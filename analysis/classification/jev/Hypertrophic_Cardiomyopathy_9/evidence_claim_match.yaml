      assertion_type: Pathophysiology
      assertion:
        name: Rare TTN Variants in Sarcomere-Negative Hypertrophic Cardiomyopathy
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'The proximal node of the claimed CMH9 mechanism: a rare heterozygous TTN variant
          in a patient with hypertrophic cardiomyopathy who has no variant in an established sarcomere
          gene. Both reported series ascertained patients this way — by residual, gene-elusive HCM — which
          is a candidate-gene design that cannot by itself establish causality. Titin is the largest human
          protein and carries a high background burden of rare variation, so rare TTN variants are expected
          in any sufficiently large cohort. This node is tagged HYPOTHETICAL because its causal link to
          the downstream hypertrophic phenotype is exactly what remains unproven.'
        genes:
        - preferred_term: TTN
          term:
            id: hgnc:12403
            label: TTN
        molecular_functions:
