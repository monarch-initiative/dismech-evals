        hypothesis_label: Chronic BCAA excess without ketoacid accumulation injures cerebral white matter
          and contributes to neurodevelopmental features
        status: EMERGING
        description: Cerebral white matter signal abnormalities have been found in every imaged patient
          and improved in the index case as BCAAs fell on pyridoxine, which suggests that sustained BCAA
          elevation acts on white matter. Whether the developmental delay, intellectual disability, autistic
          features and headaches reported in some patients follow from the same process, or are coincidental
          findings in a small, ascertainment-biased series, has not been established; several affected
          individuals are asymptomatic.
      selected_evidence:
        snippet: BCAT2 gene mutations can cause hypervalinemia and hyperleucine-isoleucinemia, which are
          associated with brain white matter lesions.
        supports: SUPPORT
