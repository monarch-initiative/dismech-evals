        kind: CONTROVERSY
        prompt: Does heterozygous ABCA1 loss of function raise coronary artery disease risk, and if so,
          through low HDL cholesterol or through reduced cellular efflux and inflammation?
        attaches_to:
        - phenotypes#Premature coronary artery atherosclerosis
        - pathophysiology#Arterial Wall Inflammation
        rationale: Family-ascertained cohorts report more and earlier coronary disease, and risk concentrated
          in carriers with the lowest efflux or HDL cholesterol, while a Danish general-population study
          found no excess ischemic heart disease in carriers of four loss-of-function variants. Family
          cohorts may be enriched for carriers with premature disease and additional risk alleles, and
          the population study's variants may be milder.
      selected_evidence:
        snippet: there may be a selection bias in genotyping towards carriers of ABCA1 mutations who have
          pCAD possibly related to a combination of genetic and environmental cardiovascular risk factors
        supports: SUPPORT
