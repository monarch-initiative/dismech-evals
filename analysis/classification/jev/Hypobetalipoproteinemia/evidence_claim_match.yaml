            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Of the 3363 black subjects examined, 2.6 percent had nonsense mutations in PCSK9; these
          mutations were associated with a 28 percent reduction in mean LDL cholesterol
        supports: SUPPORT
