  60beca54618f19ff3d8aa6463cde1f64e5d79b6051cb4893d26f77e91fd2c1db:
    claim:
      about:
        disease:
          name: Hypobetalipoproteinemia
          disease_term:
            preferred_term: hypobetalipoproteinemia
            term:
              id: MONDO:0017774
              label: hypobetalipoproteinemia
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Abetalipoproteinemia
        description: 'The closest phenotypic mimic of severe (biallelic) FHBL1: MTTP-related abetalipoproteinemia
          produces a very similar clinical and biochemical picture (fat malabsorption, hepatic steatosis,
          fat-soluble-vitamin deficiency, acanthocytosis) but arises from a distinct mechanism - impaired
          apoB-particle *lipidation* by microsomal triglyceride transfer protein acting on structurally
          normal apoB alleles, rather than a defect in apoB dosage or clearance.'
        disease_term:
          preferred_term: abetalipoproteinemia
          term:
            id: MONDO:0008692
            label: abetalipoproteinemia
        distinguishing_features:
        - Biallelic pathogenic APOB variants establish severe FHBL1; biallelic pathogenic MTTP variants
          establish abetalipoproteinemia.
        - Obligate heterozygous parents of a severe FHBL1 proband have approximately half-normal apoB-containing
          lipoproteins, whereas obligate heterozygous parents of an abetalipoproteinemia proband usually
          have normal lipids - the key family-lipid discriminator.
      selected_evidence:
        snippet: Obligate heterozygote parents of ABL patients usually have normal lipids
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
