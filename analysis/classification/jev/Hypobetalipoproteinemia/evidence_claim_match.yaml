        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_fhbl_non_apob_locus
        prompt: Beyond APOB, PCSK9, and ANGPTL3, what is the causal gene for the hypobetalipoproteinemia
          families linked to a chromosome 3p21 susceptibility locus, and for the additional families linked
          to neither APOB nor 3p21?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Circulating ApoB-Containing Lipoprotein Concentration
        rationale: This entry curates three molecularly resolved causal genes, but the literature independently
          documents at least one additional linked locus (chromosome 3p21) and further families with hypobetalipoproteinemia
          linked to neither APOB nor that locus, whose causal gene(s) remain unidentified. Unlike heterozygous
          APOB-FHBL1, the chromosome 3p21-linked form does not have increased liver fat, so it is not
          simply a phenocopy of the production-limited APOB route and may represent a fourth distinct
          mechanism.
        proposed_experiments:
        - experiment_id: fhbl_3p21_positional_cloning
          name: Positional cloning / whole-genome sequencing of chromosome 3p21-linked FHBL families
          description: Apply whole-genome or long-read sequencing to pedigrees with linkage to chromosome
            3p21 (and to families linked to neither APOB nor 3p21) to identify the causal gene(s) and
            determine whether they act by a production-limiting, clearance-enhancing, or novel mechanism.
      selected_evidence:
        snippet: Liver fat in the chromosome 3p21-linked FHBL is normal.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
