            name: ANGPTL3 Deficiency
            display_name: ANGPTL3-Related Familial Combined Hypolipidemia (FHBL2)
            subtype_term:
              preferred_term: familial hypobetalipoproteinemia 2
              term:
                id: MONDO:0011505
                label: familial hypobetalipoproteinemia 2
            description: Biallelic ANGPTL3 loss-of-function variants abolish ANGPTL3-mediated inhibition
              of lipoprotein lipase and endothelial lipase, increasing catabolism of triglyceride-rich
              lipoproteins. Because ANGPTL3 normally restrains clearance of VLDL, LDL, and HDL alike,
              its complete loss produces a combined hypolipidemia affecting all three lipoprotein classes
              rather than a selective LDL/apoB defect, distinguishing it from FHBL1 and PCSK9 loss of
              function. GeneReviews reports the syndrome as clinically silent - "not associated with any
              pathologic signs or symptoms" - and, like PCSK9 loss of function, it is not associated with
              hepatic steatosis. It is the mechanistic basis for ANGPTL3-inhibitor (evinacumab) therapy.
            genes:
