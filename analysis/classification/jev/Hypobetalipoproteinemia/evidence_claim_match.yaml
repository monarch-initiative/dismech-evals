        description: Fasting lipid profile and apoB establish the biochemical phenotype (apoB and LDL
          cholesterol below the 5th percentile) and should prompt molecular testing. For homozygous/compound
          heterozygous (severe) FHBL1, a proposed severe threshold of LDL-C and/or apoB below 15 mg/dL
          (typically apoB below 5 mg/dL) has been used to define eligibility for homozygous-disease-specific
          management, with rare exceptions of a milder biochemical phenotype.
