      assertion_type: Pathophysiology
      assertion:
        name: Reduced PCSK9-Mediated LDL Receptor Degradation
        description: PCSK9 normally binds the hepatic LDL receptor and directs it toward lysosomal degradation
          after endocytosis rather than recycling it to the cell surface. Loss-of-function PCSK9 variants
          remove this restraint, so more LDL receptor recycles back to the hepatocyte surface. This is
          the exact mechanistic node that PCSK9-inhibitor biologics (evolocumab, alirocumab) pharmacologically
          reproduce to lower LDL cholesterol in hypercholesterolemia.
        role: mediator
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: low-density lipoprotein particle receptor catabolic process
          term:
            id: GO:0032802
            label: low-density lipoprotein particle receptor catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: PCSK9 is a secreted serine protease that enhances the degradation of the LDL-receptor.
          Loss of function mutations in the PCSK9 gene prevent the PCSK9-mediated degradation of the LDL
          receptor and thus increase uptake of LDL by the liver, a process leading to a 30 to 70% reduction
          in plasma LDL-C levels
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
