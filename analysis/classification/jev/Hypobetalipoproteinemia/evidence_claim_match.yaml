          value:
            name: PCSK9 Loss of Function
            display_name: PCSK9 Loss-of-Function Hypobetalipoproteinemia
            description: Heterozygous PCSK9 nonsense or loss-of-function missense variants reduce or abolish
              PCSK9-mediated degradation of the hepatic LDL receptor, increasing receptor recycling and
              hepatic LDL clearance. Unlike FHBL1, this is a clearance-enhancement rather than a production-limiting
              mechanism, is not associated with hepatic steatosis or fat malabsorption, and is clinically
              benign and cardioprotective; it is the human-genetics basis for PCSK9-inhibitor therapy.
            genes:
