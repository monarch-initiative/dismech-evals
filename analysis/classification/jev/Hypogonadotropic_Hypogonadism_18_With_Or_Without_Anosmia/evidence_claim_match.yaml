      assertion_type: Diagnosis
      assertion:
        name: Formal olfactory testing
        description: Smell is what separates Kallmann syndrome from normosmic CHH, and it has to be tested
          rather than asked about - patients who have never smelled normally do not report a deficit.
          IL17RD carriers are overwhelmingly on the anosmic side, so a positive smell test moves the diagnosis
          toward this gene rather than away from it.
        diagnosis_term:
          preferred_term: olfactory testing
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        results: Anosmia or hyposmia on formal testing.
      selected_evidence:
        snippet: During the olfactory test (water, 75% alcohol, vinegar, and perfume), the patient demonstrated
          an inability to discern smells.
        supports: SUPPORT
