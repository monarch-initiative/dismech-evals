      assertion_type: Discussion
      assertion:
        discussion_id: hh18_hearing_loss_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Why is hearing loss the characteristic non-reproductive feature of IL17RD-related CHH?
        attaches_to:
        - phenotypes#Sensorineural Hearing Impairment
        rationale: 'The association is one of the most reproducible things about this entity - 6 of 8
          in the founding cohort, 7 of 18 across the published carriers, and the most common accompanying
          symptom in both - and the human mechanism is still unaccounted for. An animal auditory phenotype
          does exist and is cited below: adult Sef-null mice have defective brainstem responsiveness to
          auditory stimuli, with Sef expressed in cochlear-nucleus astrocytes where it regulates FGF signalling
          from the rhombic lip. That result narrows the gap rather than closing it, in two ways. It localises
          the mouse defect centrally, to the cochlear nucleus, whereas the human phenotype in these carriers
          is reported as sensorineural hearing impairment; and no cited source connects the mouse finding
          to the hearing loss seen in IL17RD-related CHH, or proposes a role for Sef in cochlear or auditory-nerve
          development in humans. The open question is therefore whether the human deficit shares the central
          mechanism the mouse shows.'
      selected_evidence:
        snippet: mice exhibited defects in the responsiveness of the brainstem to auditory stimuli.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1186/s12964-020-00695-7
      reference_title: Interleukin-17 receptor D (Sef) is a multi-functional regulator of cell signaling
      evidence_source: MODEL_ORGANISM
      explanation: Records the mouse auditory phenotype, which is why this gap is worded as an unexplained
        human mechanism rather than a total absence of animal data.
