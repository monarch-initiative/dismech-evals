  c09bcc2c7ae02d538d37db4886417cba0c6039113052e53c51b0aa8abbf2491c:
    claim:
      about:
        disease:
          name: Hypogonadotropic Hypogonadism 18 With or Without Anosmia
          disease_term:
            preferred_term: hypogonadotropic hypogonadism 18 with or without anosmia
            term:
              id: MONDO:0014103
              label: hypogonadotropic hypogonadism 18 with or without anosmia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated FGF8-FGFR1 Signaling in the Developing Olfactory-GnRH System
        description: 'FGF8-FGFR1 signalling is required for the embryonic programme in which GnRH neurons
          and olfactory axons migrate together from the olfactory placode toward the forebrain, and impairment
          of this signalling is one of the principal causes of CHH. IL17RD joins that pathway from the
          regulatory side: DUSP6, IL17RD, SPRY2 and SPRY4 are all negative modulators of FGF8-FGFR1 signalling
          that have been implicated in the disease.

          The step from "the pathway is dysregulated" to a specific direction of change is not taken here.
          Loss of a feedback antagonist would be expected to increase signalling, which is not the direction
          that FGFR1 loss-of-function CHH implies, and no source read here resolves that tension for IL17RD.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: FGF8-FGFR1 signalling in the olfactory-GnRH axis
          modifier: DYSREGULATED
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
