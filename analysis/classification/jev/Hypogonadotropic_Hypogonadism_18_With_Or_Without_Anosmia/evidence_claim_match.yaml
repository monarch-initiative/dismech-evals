      assertion_type: Pathophysiology
      assertion:
        name: Oligogenic Requirement for Additional CHH Loci
        description: 'An IL17RD variant on its own is usually not enough. In the IL17RD-focused Chinese
          cohort, every informative proband inherited the variant from an unaffected parent, and more
          than half carried variants in additional CHH genes; the published case reports repeat the pattern,
          with IL17RD paired with PROKR2, with FGFR1 plus RUVBL2, and with CPEB4. Whatever the IL17RD
          change does to FGF signalling, the disease appears where it is combined with a second hit.

          This node exists so the requirement is a step in the causal chain rather than a caveat attached
          to one. It is also the reason recurrence-risk counselling in HH18 cannot be run off a dominant
          model.'
        role: modifier
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Segregation analysis indicated that 100% (5/5) of probands inherited the IL17RD variants
          from their unaffected parents, and oligogenicity was found in 4/7 patients.
        supports: SUPPORT
