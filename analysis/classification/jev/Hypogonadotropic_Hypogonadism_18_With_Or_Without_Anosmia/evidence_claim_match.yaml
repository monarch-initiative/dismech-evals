  fde5cc2003425358f8bbed72948ef4ccdfff79b26faca10ac9e2487be72d6e38:
    claim:
      about:
        disease:
          name: Hypogonadotropic Hypogonadism 18 With or Without Anosmia
          disease_term:
            preferred_term: hypogonadotropic hypogonadism 18 with or without anosmia
            term:
              id: MONDO:0014103
              label: hypogonadotropic hypogonadism 18 with or without anosmia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IL17RD Variant Altering Sef Function
        description: 'IL17RD encodes Sef, a transmembrane protein of the fgf8 synexpression group that
          acts as a feedback-induced antagonist of FGF signalling. In zebrafish it antagonises the Ras/Raf/MEK/MAPK
          arm downstream of FGF; in mammalian cells its extracellular and transmembrane domains associate
          with FGFR1 and inhibit receptor tyrosine phosphorylation and the ensuing Raf/MEK/ERK cascade.

          The CHH-associated variants are missense changes distributed across the protein, and most of
          those tested altered protein function in vitro. What that alteration does to signalling in a
          GnRH neuron is not established: the assays are heterologous, the variants are heterozygous,
          and no source read here measures FGF signalling output in patient-derived tissue.'
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: IL17RD
          term:
            id: hgnc:17616
            label: IL17RD
        biological_processes:
        - preferred_term: Sef-mediated negative feedback on FGF receptor signalling
          modifier: ABNORMAL
          term:
            id: GO:0040037
            label: negative regulation of fibroblast growth factor receptor signaling pathway
        genetic_context:
          functional_impact_category: UNKNOWN
          zygosity: HETEROZYGOUS
          description: Reported IL17RD variants in CHH are heterozygous missense changes. Most altered
            protein function in the founding study's in-vitro assays, but the direction of that alteration
            in the developing olfactory-GnRH system is not established, so the impact category is left
            UNKNOWN rather than being recorded as loss of function.
      selected_evidence:
        snippet: We also showed that SefECTM associated with FGFR1, and inhibited FGF-induced ERK activation
          in HEK293T cells.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16603339
      reference_title: A role for extracellular and transmembrane domains of Sef in Sef-mediated inhibition
        of FGF signaling.
      evidence_source: IN_VITRO
      explanation: Places Sef physically on FGFR1 in a mammalian cell system, which is the specific pathway
        connection that makes IL17RD a candidate CHH gene at all.
