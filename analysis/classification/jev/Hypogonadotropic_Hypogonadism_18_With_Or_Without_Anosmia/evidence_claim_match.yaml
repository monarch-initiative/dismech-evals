  6f43774c4df4faa742b5e053824c64edf21083103a6aa51ff1585c918f3432be:
    claim:
      about:
        disease:
          name: Hypogonadotropic Hypogonadism 18 With or Without Anosmia
          disease_term:
            preferred_term: hypogonadotropic hypogonadism 18 with or without anosmia
            term:
              id: MONDO:0014103
              label: hypogonadotropic hypogonadism 18 with or without anosmia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Broad genomic testing, not single-gene testing
        description: Single-gene testing is the wrong instrument for this disease, and the reason is the
          oligogenic architecture rather than a mere breadth-of-differential argument. Finding the IL17RD
          variant and stopping would miss the second locus that most carriers have, and it is the combination
          that is being counselled on. In the reported case, exome sequencing plus copy-number analysis
          found a maternally inherited IL17RD variant and a de novo CPEB4 variant; either alone would
          have told a different and wrong story.
        diagnosis_term:
          preferred_term: molecular analysis
          term:
            id: NCIT:C19770
            label: Molecular Analysis
        results: A heterozygous IL17RD variant, usually with a variant in at least one other CHH-associated
          gene; parental testing is informative.
      selected_evidence:
        snippet: Whole-exome sequencing confirmed that the child carried both the IL17RD variant (c.2101G>A,
          p.Gly701Ser) inherited from the mother and the new CPEB4 variant (c.1414C>T, p.Arg472*).
        supports: SUPPORT
