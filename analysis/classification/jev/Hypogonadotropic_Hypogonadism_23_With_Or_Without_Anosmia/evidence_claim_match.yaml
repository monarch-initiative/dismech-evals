              label: hypogonadotropic hypogonadism 23 with or without anosmia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic LHB Inactivating Variants
        description: 'LHB encodes the beta subunit that gives LH its receptor specificity. Pathogenic
          variants are biallelic and of several classes: missense changes in the cystine knot (p.Gly36Asp,
          p.Cys46Arg), in-frame deletions (p.Lys40del, a four-leucine deletion in the signal peptide),
          splice-site variants in intron 2 (IVS2+1G>C, IVS2+1G>T), a nonsense variant (p.Trp28*) and a
          frameshift. All abolish production of bioactive LH, which is why the impact is recorded as loss
          of function regardless of the step affected.'
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: LHB
          term:
            id: hgnc:6584
            label: LHB
        molecular_functions:
        - preferred_term: luteinizing hormone activity
          modifier: DECREASED
          term:
            id: GO:0005179
            label: hormone activity
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Homozygous in most reported families, compound heterozygous in others (IVS2+1G>T
            with a 12-bp signal-peptide deletion in an Italian sibship; p.Phe84Leu with p.Gly122Ser in
            a Chinese woman).
      selected_evidence:
        snippet: The patient had a homozygous missense mutation in the gene that encodes the beta subunit
          of luteinizing hormone (Gly36Asp), a mutation that disrupted a vital cystine knot motif and
          abrogated the heterodimerization and secretion of luteinizing hormone.
        supports: SUPPORT
