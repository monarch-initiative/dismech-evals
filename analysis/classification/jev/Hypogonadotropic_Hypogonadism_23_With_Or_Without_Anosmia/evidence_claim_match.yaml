          fidelity: MODERATE
          description: Female knockouts lack corpora lutea, as expected from absent ovulation.
          limitations: Female knockout mice have decreased estradiol, whereas affected women reach early
            to mid-follicular estradiol levels and go through spontaneous puberty.
      selected_evidence:
        snippet: Thus, LHbeta null mice provide a useful model to study the consequences of an isolated
          deficiency of LH ligand in reproduction, while retaining normal LH-responsiveness in target
          cells.
