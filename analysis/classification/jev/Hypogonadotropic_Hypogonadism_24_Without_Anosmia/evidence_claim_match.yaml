      assertion_type: Discussion
      assertion:
        discussion_id: hh24_male_spermatogenesis_species_divergence
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Impaired Spermatogenesis
        prompt: Why does loss of FSH cause azoospermia in men but leave Fshb-null male mice fertile?
        rationale: 'The ovarian defect is reproduced closely in the knockout mouse, but the testicular
          defect is not: knockout males have smaller testes and fewer, less motile sperm and still sire
          litters, while the cited review states that FSHB mutations in men result in azoospermia. Human
          FSHR loss also impairs testicular function without absolute infertility. The mouse therefore
          cannot be used to estimate how much spermatogenesis FSH replacement can restore in men, and
          the human male case series is too small to settle it.'
      selected_evidence:
        snippet: while FSHR mutations in humans and knockouts of both the ligand and the receptor in mice
          affect testicular function but do not result in absolute infertility.
        supports: SUPPORT
