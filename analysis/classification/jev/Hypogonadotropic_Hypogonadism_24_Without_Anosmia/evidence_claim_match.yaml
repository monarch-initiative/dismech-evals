              label: hypogonadotropic hypogonadism 24 without anosmia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic FSHB Loss-of-Function Variants
        description: FSHB encodes the beta subunit that gives FSH its receptor specificity. Reported alleles
          are a two-nucleotide frameshift deletion (historically Val61X), a one-nucleotide frameshift
          (c.289delG), nonsense variants (Tyr76X, Arg97X, p.Arg115Ter, p.Cys122Ter) and missense substitutions
          of conserved cystine-knot cysteines (Cys51Gly, Cys82Arg). Truncations remove the regions needed
          for association with the alpha subunit and for receptor binding; the cysteine substitutions
          prevent formation of disulphide bonds needed for correct folding.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: FSHB
          term:
            id: hgnc:3964
            label: FSHB
        molecular_functions:
        - preferred_term: follicle-stimulating hormone activity
          modifier: DECREASED
          term:
            id: GO:0016913
            label: follicle-stimulating hormone activity
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Homozygous in most reported families, several of them consanguineous; compound
            heterozygous (Cys51Gly with Val61X) in one woman.
      selected_evidence:
        snippet: The predicted truncated beta-subunit peptide lacks regions which are important for association
          with the alpha subunit and for binding to and activation of the FSH receptor.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
