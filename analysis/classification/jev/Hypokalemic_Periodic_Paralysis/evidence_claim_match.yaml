      assertion:
        name: Gating-Pore Leak Current
        description: CACNA1S or SCN4A variants in skeletal-muscle ion channels can generate an anomalous
          leakage current that is active at resting potential, making muscle fibers susceptible to paradoxical
          depolarization in low extracellular potassium.
        genes:
        - preferred_term: CACNA1S
          term:
            id: hgnc:1397
            label: CACNA1S
        - preferred_term: SCN4A
          term:
            id: hgnc:10591
            label: SCN4A
        cell_types:
        - preferred_term: skeletal muscle cell
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        biological_processes:
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: DYSREGULATED
        - preferred_term: sodium ion transmembrane transport
          term:
            id: GO:0035725
            label: sodium ion transmembrane transport
          modifier: ABNORMAL
        - preferred_term: potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: ABNORMAL
        locations:
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
      selected_evidence:
        snippet: homologous gene defects of either channel cause an anomalous leakage current, which is
          active at the resting potential and produces susceptibility to paradoxical depolarization of
          the fiber and inexcitability in the setting of low extracellular K+ (2.5 to 3.5 Meq/L).
        supports: SUPPORT
