        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Basolateral Potassium Recycling
        biological_scale: CELLULAR
        description: Kir4.1/Kir5.1 and Kir4.2/Kir5.1 heteromers make the major basolateral potassium conductance
          of the distal and proximal tubule respectively. That conductance recycles potassium across the
          basolateral membrane so the Na+/K+-ATPase can keep running, and it is highly pH-sensitive, which
          is how the channel couples acid-base status to sodium handling. Losing it therefore disables
          the driving force for transepithelial transport in both segments at once.
        cell_types:
        - preferred_term: kidney distal convoluted tubule epithelial cell
          term:
            id: CL:1000849
            label: kidney distal convoluted tubule epithelial cell
        - preferred_term: epithelial cell of proximal tubule
          term:
            id: CL:0002306
            label: epithelial cell of proximal tubule
        locations:
        - preferred_term: distal convoluted tubule
          term:
            id: UBERON:0001292
            label: distal convoluted tubule
        - preferred_term: proximal tubule
          term:
            id: UBERON:0004134
            label: proximal tubule
        biological_processes:
        - preferred_term: potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: We identified mutations in the KCNJ16 gene encoding KCNJ16, which along with KCNJ15 and
          KCNJ10, constitutes the major basolateral potassium channel of the proximal and distal tubules,
          respectively.
        supports: SUPPORT
