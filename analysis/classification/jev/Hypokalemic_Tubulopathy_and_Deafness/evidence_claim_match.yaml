        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Kir5.1 Loss of Function
        biological_scale: MOLECULAR
        description: KCNJ16 encodes Kir5.1. Unlike most channel subunits, Kir5.1 is an obligate partner
          rather than a channel in its own right, so its variants act by crippling the heteromers it forms.
          Coexpressing mutant KCNJ16 with either KCNJ15 or KCNJ10 in Xenopus oocytes significantly reduces
          currents, and disease-associated variants scattered across different functional domains all
          strongly affect heteromers with Kir4.1 or Kir4.2. This is why one gene produces a tubulopathy
          spanning two nephron segments that use different partner subunits.
        gene:
          preferred_term: KCNJ16
          term:
            id: hgnc:6262
            label: KCNJ16
        molecular_functions:
        - preferred_term: inward rectifier potassium channel activity
          term:
            id: GO:0005242
            label: inward rectifier potassium channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: Unlike Kir4.1, Kir5.1 does not appear to form homomeric channels, but forms heteromeric
          channels primarily with Kir4.1 and Kir4.2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35370765
      reference_title: 'EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated
        Channelopathies.'
      evidence_source: IN_VITRO
      explanation: Establishes that Kir5.1 acts only as a heteromeric partner, which is why its loss is
        expressed through the channels it would otherwise complete.
