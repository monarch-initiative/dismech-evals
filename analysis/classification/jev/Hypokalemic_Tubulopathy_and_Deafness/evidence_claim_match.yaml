            species: Mouse
            genotype: Kcnj16 -/-
            publication: PMID:21633011
            description: 'Targeted disruption of Kcnj16 produces hypokalemic, hyperchloremic metabolic
              acidosis with hypercalciuria, and exaggerated short-term responses to hydrochlorothiazide
              indicating excessive distal convoluted tubule sodium absorption. Chronic hydrochlorothiazide
              normalised urinary sodium and calcium and abolished the acidosis. Electrophysiology of the
              DCT basolateral membrane showed increased potassium conductance despite the absence of Kir5.1,
              because the remaining homomeric Kir4.1 channels lose their pH sensitivity — a compensation,
              not a preserved normal state.

              Important context: this study was published in 2011, a decade before the human KCNJ16 disease
              was delineated in 2021. Its authors could only compare their mice against EAST/SeSAME, and
              on that comparison described the renal phenotype as the opposite of it. Read against the
              human entity now known, the acidotic mouse anticipates rather than contradicts the human
              phenotype.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Disturbed Proximal Bicarbonate Handling
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: The knockout reproduces the hypokalemia and the acidotic direction of the acid-base
          disturbance that distinguishes this disease from Kir4.1 disease.
        limitations: The paper predates the human disease and frames its findings against EAST/SeSAME
          rather than against KCNJ16 patients, so the correspondence is one drawn here rather than claimed
          by the authors. The murine acidosis is specifically hyperchloremic with hypercalciuria, which
          is a more precisely specified picture than the "variable severity" acidosis reported in patients,
          so the match should not be over-read. Deafness is not addressed by this study.
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: In the knockout mouse, remaining homomeric Kir4.1 channels lose pH sensitivity
            and basolateral potassium conductance actually rises. Whether the same compensation occurs
            in human patients is not established, so the residual-conductance state of the murine tubule
            may not represent the human one.
        - divergence_type: TEMPORAL_SCOPE
          materiality: QUALIFYING
          description: The characterisation is of an adult constitutive knockout under acute and chronic
            thiazide challenge, not of the developmental course or natural history of the human disease.
      selected_evidence:
        snippet: there is an increased K(+) conductance caused by the decreased pH sensitivity of the
          remaining homomeric Kir4.1 channels
        supports: SUPPORT
