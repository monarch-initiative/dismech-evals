        context: []
      assertion_type: Genetic
      assertion:
        name: KCNJ16 loss of function
        gene_term:
          preferred_term: KCNJ16
          term:
            id: hgnc:6262
            label: KCNJ16
        relationship_type: CAUSATIVE
        notes: 'Biallelic KCNJ16 variants, first delineated in 2021 in eight patients by a candidate gene
          approach plus whole-exome sequencing. Disease-associated variants are scattered across different
          functional domains of Kir5.1 and all strongly impair heteromers with Kir4.1 or Kir4.2, which
          is consistent with Kir5.1 acting only as an obligate partner subunit. The absence of CNS involvement
          in patients is itself informative: it argues against Kir5.1 forming functionally important channels
          with other partners in the brain. Functional consequences were generally more severe when Kir5.1
          mutants were coexpressed with Kir4.2 than with Kir4.1, consistent with the prominence of the
          proximal tubular arm, since Kir4.2 is the proximal partner.'
      selected_evidence:
        snippet: A candidate gene approach and whole-exome sequencing determined the underlying genetic
          defect in eight patients
        supports: SUPPORT
