      assertion_type: Discussion
      assertion:
        discussion_id: kcnj16_murine_hearing_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why does loss of Kir5.1 cause sensorineural hearing loss in humans but leave hearing unaffected
          in the Kcnj16 knockout mouse?
        attaches_to:
        - pathophysiology#Cochlear Potassium Homeostasis Failure
        - phenotypes#Sensorineural Hearing Loss
        rationale: 'Evidence exists on both sides and they disagree, which is the defining shape of a
          model-fidelity gap rather than an absence of evidence. Human patients with biallelic KCNJ16
          variants have sensorineural hearing loss consistently enough for it to be part of the disease
          definition, yet a Kcnj16 knockout mouse hears normally. The review proposes murine compensation,
          but that is a hypothesis rather than a demonstrated mechanism, and it is unresolved which compensating
          conductance is responsible.

          This matters beyond bookkeeping: it means the cochlear arm of this disease currently has no
          validated animal model, so the Kir5.1 role in the spiral ligament rests on human genetics plus
          expression data rather than on reproduction in a model system.'
      selected_evidence:
        snippet: This may indicate efficient compensatory mechanisms in this strain of Kir5.1 knockout
          mice that are not present to the same extent in humans with biallelic Kir5.1 mutations.
        supports: SUPPORT
