  0e7df5fd4db4e5981712dcf06ada74cf5f628737c36f7ab18057e00b12e6366a:
    claim:
      about:
        disease:
          name: Hypokalemic Tubulopathy and Deafness
          disease_term:
            preferred_term: hypokalemic tubulopathy and deafness
            term:
              id: MONDO:0859167
              label: hypokalemic tubulopathy and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cochlear Potassium Homeostasis Failure
        biological_scale: TISSUE
        description: 'Kir4.1 and Kir5.1 are both expressed in the inner ear, but not in the same compartment,
          and the distinction matters here. Kir4.1 sits in the intermediate cells of the stria vascularis
          and is what generates the endocochlear potential; Kir5.1 is expressed mainly in the root and
          spindle cells of the spiral ligament, where it is proposed to participate in potassium cycling
          and may contribute to establishing that potential. The Kir5.1 role is therefore proposed rather
          than established, and this node is worded to reflect that: loss of the Kir5.1-containing conductance
          in the spiral ligament is the best-supported route to the sensorineural deafness, which is the
          one major extrarenal feature of this disease and the feature it shares with EAST/SeSAME.

          An earlier revision of this entry bound the stria vascularis here. That was wrong in exactly
          the way this entry''s notes warn about -- it assigned Kir5.1 the compartment the cited review
          assigns to Kir4.1.'
        locations:
        - preferred_term: root and spindle cells of the spiral ligament
          term:
            id: UBERON:0006725
            label: spiral ligament
        biological_processes:
        - preferred_term: potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: Kir5.1 is expressed mainly in the root cells and spindle cells of the spiral ligament
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35370765
      reference_title: 'EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated
        Channelopathies.'
      evidence_source: MODEL_ORGANISM
      explanation: Localises Kir5.1 to the spiral ligament rather than the stria vascularis, which is
