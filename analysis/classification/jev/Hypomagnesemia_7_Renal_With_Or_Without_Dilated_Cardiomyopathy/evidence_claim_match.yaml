  bf0d6de2572d0c7f6019d90d368070606d35d2b4e3a285954de04c4bc0e7429e:
    claim:
      about:
        disease:
          name: Hypomagnesemia 7 Renal With Or Without Dilated Cardiomyopathy
          disease_term:
            preferred_term: hypomagnesemia 7, renal, with or without dilated cardiomyopathy
            term:
              id: MONDO:0859328
              label: hypomagnesemia 7, renal, with or without dilated cardiomyopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nutrient-Insensitive mTORC1 Signaling
        biological_scale: MOLECULAR
        description: In cells expressing mutant RagD, mTORC1 continues to phosphorylate its targets during
          amino acid starvation. The effect is consistent on the non-canonical substrate TFEB; effects
          on the canonical substrates S6K and 4E-BP1 differ between studies and variants (increased in
          the discovery study and for p.Ser76Leu in T-REx HeLa cells, unchanged in the MiT/TFE study and
          for p.Ser77Phe and p.Ile100Arg). p.Thr91Ile, which causes the full kidney phenotype, did not
          change mTORC1 readouts in HeLa cells, so the degree of in vitro activation does not track clinical
          severity.
        genes:
        - preferred_term: RRAGD
          term:
            id: hgnc:19903
            label: RRAGD
        biological_processes:
        - preferred_term: TORC1 signaling
          term:
            id: GO:0038202
            label: TORC1 signaling
          modifier: INCREASED
        - preferred_term: cellular response to amino acid starvation
          term:
            id: GO:0034198
            label: cellular response to amino acid starvation
          modifier: DECREASED
      selected_evidence:
        snippet: Our data indicate that the RRAGD p.(Ser76Leu) variant maintains the phosphorylation of
          mTORC1 targets (i.e., S6K, 4E-BP1, and TFEB) during amino acid starvation, in contrast to RRAGD
          WT in T-REx HeLa cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42329298
      reference_title: RRAGD p.(Ser76Leu) Variant Causes Dysregulated Expression of Muscle Development
        and Cytoskeleton Genes in Cardiomyocytes.
      evidence_source: IN_VITRO
      explanation: The recurrent p.Ser76Leu variant makes mTORC1 insensitive to amino acid withdrawal.
