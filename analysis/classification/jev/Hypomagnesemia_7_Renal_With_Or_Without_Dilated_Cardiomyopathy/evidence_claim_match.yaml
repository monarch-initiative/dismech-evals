          de novo; p.Thr97Pro (one family of 8) has not been linked to cardiac disease; p.Pro88Leu (one
          family of 8) causes adult-onset DCM. Other alleles are p.Ser76Trp, p.Ser77Phe, p.Thr91Ile, p.Ile100Arg,
          p.Pro119Leu, p.Pro119Arg and p.Ile221Lys. No ClinGen gene-disease validity record for this pair
          was found in the local cache.
