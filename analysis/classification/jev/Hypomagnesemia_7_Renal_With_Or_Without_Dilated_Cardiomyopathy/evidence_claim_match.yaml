            association: Causative
            relationship_type: CAUSATIVE
            notes: All reported disease alleles are heterozygous missense variants; the three added in
              2025 were absent from gnomAD, and no truncating or copy-number alleles have been described.
              Across 37 patients in 18 families, p.Ser76Leu (c.227C>T) accounts for 9 patients in 7 families,
              often de novo; p.Thr97Pro (one family of 8) has not been linked to cardiac disease; p.Pro88Leu
              (one family of 8) causes adult-onset DCM. Other alleles are p.Ser76Trp, p.Ser77Phe, p.Thr91Ile,
              p.Ile100Arg, p.Pro119Leu, p.Pro119Arg and p.Ile221Lys. No ClinGen gene-disease validity
              record for this pair was found in the local cache.
