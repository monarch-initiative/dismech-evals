        - name: p.(Ser76Leu) (c.227C>T)
          description: Most frequently reported allele, recurrent and often de novo; carriers include
            children with DCM requiring transplantation.
          type: missense_variant
        - name: p.(Thr97Pro)
          description: Kidney-only phenotype in one large family; no cardiac involvement reported.
          type: missense_variant
        - name: p.(Pro88Leu)
          description: One large family with hypomagnesemia, medullary nephrocalcinosis and adult-onset
            heart disease.
          type: missense_variant
      selected_evidence:
        snippet: In the present case series, 13 new patients and 3 novel RRAGD variants, that is, p.(Ser77Phe),
