        description: The distal convoluted tubule performs the final, transcellular step of renal magnesium
          reabsorption. CNNM2 is expressed at the basolateral membrane of these cells and of the cortical
          thick ascending limb. With CNNM2 lost, fractional magnesium excretion stays in the normal range
