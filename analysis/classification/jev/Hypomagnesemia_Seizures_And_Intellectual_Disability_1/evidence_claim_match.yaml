      assertion:
        name: Disrupted Mg-ATP Binding by the CBS Module
        biological_scale: MOLECULAR
        description: The intracellular Bateman module of CNNM2 (residues 429 to 584, two CBS domains)
          binds ATP in a Mg2+-dependent way, and nucleotide binding switches the CBS module dimer from
          a twisted to a flat disc-like form that alters the elements linking it to the transmembrane
          region. The dominant p.Thr568Ile variant, reported in one of the first CNNM2 families, mimics
          the nucleotide-bound structure and is proposed to lock the module in its flat form. CBS-deleted
          CNNM2 cannot promote Mg2+ efflux.
        molecular_functions:
        - preferred_term: Mg-ATP binding by the CBS module
          term:
            id: GO:0005524
            label: ATP binding
          modifier: DECREASED
      selected_evidence:
        snippet: The results of the present study suggest that the T568I mutation exerts its pathogenic
          effect in humans by constraining the conformational equilibrium of the CBS module of CNNM2,
          which becomes 'locked' in its flat form.
        supports: SUPPORT
