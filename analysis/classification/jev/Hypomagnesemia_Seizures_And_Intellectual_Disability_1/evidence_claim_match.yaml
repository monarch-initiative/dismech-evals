          days of life and are refractory, with severe global developmental delay, severe intellectual
          disability without verbal speech, microcephaly, and structural brain abnormalities (wide outer
          cerebrospinal fluid spaces, failure of opercularization, reduced white matter myelination).
          The degree of hypomagnesemia is similar to the monoallelic form, so it does not explain the
          greater severity.
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: The disease manifestation in the neonatal period, the extent of seizures, the severe
          degree of intellectual disability, and the presence of structural brain abnormalities clearly
          render recessive CNNM2 disease a distinct clinical entity.
        supports: SUPPORT
