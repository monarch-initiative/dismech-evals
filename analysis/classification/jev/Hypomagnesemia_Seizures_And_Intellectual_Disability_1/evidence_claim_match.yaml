        context:
        - path: /genetic/0
          value:
            name: CNNM2
            gene_term:
              preferred_term: CNNM2
              term:
                id: hgnc:103
                label: CNNM2
            relationship_type: CAUSATIVE
            features: CNNM2 (10q24.32) encodes cyclin M2 (CBS domain divalent metal cation transport mediator
              2), a membrane protein with an extracellular N terminus, a DUF21 transmembrane domain and
              intracellular CBS-pair and cyclic nucleotide-binding homology domains. Reported disease
              variants include missense, nonsense, frameshift and in-frame changes and multi-exon deletions.
            notes: 'The molecular function of CNNM2 is debated: it has been described as a Na+/Mg2+ exchanger
