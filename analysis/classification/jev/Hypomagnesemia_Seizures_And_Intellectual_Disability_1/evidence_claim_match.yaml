      assertion:
        discussion_id: homgsmr1_cnnm2_molecular_function
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Loss of CNNM2-Dependent Magnesium Transport
        prompt: Is CNNM2 a magnesium transporter, a Na+/Mg2+ exchanger that extrudes magnesium, or a regulator
          of other magnesium transport proteins?
        rationale: Patient variants consistently reduce CNNM2 activity, but the assays disagree on what
          that activity is. Overexpressed CNNM2 increases magnesium uptake in HEK293 cells through TRPM7,
          another study finds that CNNM2 isoforms do not transport magnesium, and an efflux assay in mouse
          distal convoluted tubule cells shows reduced magnesium extrusion by a patient variant. Which
          of these underlies basolateral magnesium reabsorption decides how the renal step should be described.
      selected_evidence:
        snippet: Iso1 and Iso2 are not Mg(2+) transporters per se.
        supports: SUPPORT
