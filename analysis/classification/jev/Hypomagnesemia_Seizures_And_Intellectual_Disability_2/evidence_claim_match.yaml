  f82b98e8e4a5dbd4a9b2c043f77963f3d9e535605afdacf2a919d178735a9f71:
    claim:
      about:
        disease:
          name: Hypomagnesemia, Seizures, and Intellectual Disability 2
          disease_term:
            preferred_term: hypomagnesemia, seizures, and intellectual disability 2
            term:
              id: MONDO:0020788
              label: hypomagnesemia, seizures, and intellectual disability 2
        context: []
      assertion_type: Genetic
      assertion:
        name: ATP1A1
        gene_term:
          preferred_term: ATP1A1
          term:
            id: hgnc:799
            label: ATP1A1
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        features: ATP1A1 (1p13.1) encodes the alpha-1 catalytic subunit of the Na+,K+-ATPase, the predominant
          isoform in the kidney and abundant in the central nervous system. All HOMGSMR2 variants are
          heterozygous missense changes that put an arginine into transmembrane segment M3, M7 or M8.
        notes: 'Heterozygous Atp1a1 knockout mice are phenotypically normal, and a healthy adult carrying
          a protein-null truncating variant (p.Tyr148Ter) has no feature of an ATP1A1-related disease,
          so loss of one allele does not explain the disease. The variants act through a malfunctioning
          protein: reduced pumping together with an abnormal leak current. CNNM2 and TRPM6 mutations were
          excluded in the index cohort before ATP1A1 was found.'
        variants:
        - name: NM_000701:c.905T>C (p.Leu302Arg)
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: De novo in an infant girl presenting at 6 months with generalized seizures, hyperactive
            behavior and hypomagnesemia, with repeated status epilepticus. Located in transmembrane segment
            M3. Reduces pump function and carries an ouabain-insensitive leak current in oocytes.
        - name: NM_000701:c.907G>C (p.Gly303Arg)
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: De novo in an infant girl presenting at 2 months with generalized seizures and
            hypomagnesemia, later with features of autism spectrum disorder. Located in transmembrane
            segment M3. Na+ and Cl- permeate the mutant protein.
        - name: NM_000701:c.2576T>G (p.Met859Arg)
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: De novo in a boy presenting at 6 days of age with generalized seizures and hypomagnesemia,
            with repeated status epilepticus, severe autism and self-biting. Located in transmembrane
            segment M7. Retains a small K+-activated, ouabain-inhibitable pump current alongside the leak.
        - name: NM_000701.7:c.2791T>C (p.Trp931Arg)
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: De novo in an infant girl with therapy-resistant epilepsy from 3 months, renal
            magnesium wasting and death at 10 months. Located in transmembrane segment M8. The cryo-EM
            structure of this variant shows a distorted M9 segment.
      selected_evidence:
        snippet: Whole-exome sequencing and conventional Sanger sequencing identified heterozygous de
          novo mutations in the catalytic Na+, K+-ATPase α1 subunit (ATP1A1).
        supports: SUPPORT
    origin:
