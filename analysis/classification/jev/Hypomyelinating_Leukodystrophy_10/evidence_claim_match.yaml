      assertion_type: Discussion
      assertion:
        discussion_id: hld10_mechanism_beyond_proline
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Preserved Bulk Proline Supply by Paralogue Redundancy
        status: OPEN
        prompt: If proline is not depleted, what exactly does the cell lose when PYCR2 is absent, and
          why is the deficit restricted to the CNS?
        rationale: 'Every measurement to date - patient plasma and CSF, patient plasma metabolomics, mouse
          serum and fibroblast lysates - finds proline normal, and the paralogues are largely redundant
          for bulk proline supply. Yet PYCR2 loss produces a severe, CNS-restricted disease. Three non-exclusive
          candidate answers are on the table: a local proline or P5C pool in a compartment or cell type
          that bulk measurement cannot resolve; a redox role, since PYCR2 also cycles NAD(P)H/NAD(P)+;
          and the SHMT2/glycine diversion, which is the only one with a rescue experiment behind it. Distinguishing
          them matters therapeutically, because proline supplementation, redox support and glycine lowering
          are entirely different interventions - and the mouse dietary experiment already shows proline
          availability modulates severity even though proline is not depleted.'
      selected_evidence:
        snippet: Our findings and all the previous reports suggest that proline auxotrophy is not the
          central disease mechanism.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
