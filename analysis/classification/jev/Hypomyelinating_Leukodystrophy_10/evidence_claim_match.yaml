      assertion_type: DifferentialDiagnosis
      assertion:
        name: Pelizaeus-Merzbacher disease
        description: The prototypic hypomyelinating leukodystrophy (HLD1, PLP1). Shares CNS hypomyelination
          but is X-linked, typically presents with nystagmus and cerebellar signs without severe progressive
          microcephaly, failure to thrive or the HLD10 craniofacial gestalt. Curated separately in dismech
          as `Pelizaeus_Merzbacher_Disease`.
        disease_term:
          preferred_term: Pelizaeus-Merzbacher disease
          term:
            id: MONDO:0010714
            label: Pelizaeus-Merzbacher spectrum disorder
        distinguishing_features:
        - X-linked PLP1 inheritance rather than autosomal recessive PYCR2
        - Prominent nystagmus and cerebellar ataxia
        - No progressive postnatal microcephaly
        - No severe diffuse cerebral atrophy
      selected_evidence:
        snippet: PMD is now known as the prototypic disorder of hypomyelinating leukodystrophies (HLDs)
        supports: SUPPORT
