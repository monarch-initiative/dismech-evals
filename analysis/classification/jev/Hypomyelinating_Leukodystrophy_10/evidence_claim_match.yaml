      assertion_type: Biochemical
      assertion:
        name: Elevated Plasma and CSF Purine Metabolites
        context: Untargeted metabolomics of plasma and CSF in three related patients showed marked increases
          of inosine and xanthine, together with mild increases of glutamate, alpha-ketoglutarate and
          L-glutamate semialdehyde. This points to a purine/pyrimidine-pathway perturbation in addition
          to the mild proline-pathway changes, and is a candidate biochemical signature - not an established
          diagnostic marker.
        presence: PRESENT
        notes: Based on three genetically related patients from a single family (PMID:38709052); has not
          been replicated in an independent cohort.
      selected_evidence:
        snippet: While plasma and CSF proline levels were found to be totally normal, untargeted metabolomic
          profiling revealed mild increases of glutamate, alpha-ketoglutarate, and l-glutamate semialdehyde
          and marked increases of inosine and xanthine.
        supports: SUPPORT
