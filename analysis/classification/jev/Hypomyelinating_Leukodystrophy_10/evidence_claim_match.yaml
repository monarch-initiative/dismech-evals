      assertion:
        name: Autosomal recessive cutis laxa type 2B (PYCR1)
        description: The paralogue disorder and the single most important differential. PYCR1 deficiency
          acts at the same step of proline biosynthesis but produces cutis laxa with progeroid features.
          Lax, wrinkly skin is characteristically ABSENT in HLD10, and hypomyelination is not a feature
          of PYCR1 disease.
        disease_term:
          preferred_term: Autosomal recessive cutis laxa type 2B (PYCR1)
          term:
            id: MONDO:0013051
            label: autosomal recessive cutis laxa type 2B
        distinguishing_features:
        - Cutis laxa and wrinkly skin, absent in HLD10
        - Progeroid facial appearance, absent in HLD10
        - CNS hypomyelination, absent in PYCR1 disease
        - Postnatal progressive microcephaly with death in the first decade, absent in PYCR1 disease
      selected_evidence:
        snippet: Hypomyelination and the absence of lax, wrinkly skin distinguishes this condition from
          that caused by previously reported mutations in the gene encoding PYCR2's isozyme, PYCR1, suggesting
          a unique and indispensable role for PYCR2 in the human CNS during development.
        supports: SUPPORT
