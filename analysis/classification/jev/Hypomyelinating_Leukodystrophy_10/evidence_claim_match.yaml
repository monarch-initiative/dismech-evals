              id: MONDO:0014632
              label: leukodystrophy, hypomyelinating, 10
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hld10_mouse_hypomyelination_mismatch
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Impaired Oligodendroglial Differentiation and CNS Hypomyelination
        status: OPEN
        prompt: Do Pycr2-null mice actually reproduce the CNS hypomyelination and progressive microcephaly
          that define HLD10 in humans?
        rationale: The two published Pycr2 mouse lines are described very differently. One is reported
          to phenocopy the human disorder and is the source of the cerebral glycine finding; the other,
          characterised in detail, reports a neurological and neuromuscular syndrome of kyphosis, hind-limb
          clasping and weight loss, with only mild peripheral axonal atrophy and no reported assessment
          of myelination or head size. Since hypomyelination and postnatal progressive microcephaly are
          precisely the features that define the human disease, the hypomyelination arm of the mechanism
          currently rests on a heterologous oligodendroglial cell line rather than on any in vivo model.
          Until a mouse is shown to be hypomyelinated, mouse rescue experiments cannot be read as evidence
          about the human white-matter phenotype.
        proposed_experiments:
        - experiment_id: hld10_mouse_myelin_quantification
          name: Myelin quantification in Pycr2-null mouse CNS
          description: Quantify myelin content and oligodendrocyte maturation in Pycr2-null mouse brain
            across postnatal development - MBP and CNPase immunoblotting and immunohistochemistry, electron-microscopic
            g-ratio measurement of corpus callosum axons, and serial head or brain-volume measurement
            - to establish whether the model is hypomyelinated and microcephalic or only neurologically
            impaired.
      selected_evidence:
        snippet: Mice with recessive loss-of-function mutations in Pycr2 showed phenotypes consistent
          with neurological and neuromuscular disorders, including weight loss, kyphosis, and hind-limb
          clasping.
        supports: SUPPORT
    origin:
