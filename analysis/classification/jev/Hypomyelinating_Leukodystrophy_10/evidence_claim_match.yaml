              id: MONDO:0014632
              label: leukodystrophy, hypomyelinating, 10
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SHMT2 Upregulation and Cerebral Glycine Accumulation
        biological_scale: MOLECULAR
        description: 'Loss of PYCR2 upregulates serine hydroxymethyltransferase 2 (SHMT2), the mitochondrial
          one-carbon enzyme responsible for glycine synthesis, and cerebral glycine rises in both Pycr2-null
          mice and patients. The excess glycine is not a bystander: knocking down SHMT2 partially reverses
          it and rescues the axonal beading and shortened neurites of cultured Pycr2-knockout neurons,
          identifying the glycine pathway as the leading candidate intervention point. Elevated brain
          glycine is detectable non-invasively as an MR-spectroscopy glycine peak, including in the mild
          spastic-paraplegia-only phenotype where white matter is normally myelinated.'
        biological_processes:
        - preferred_term: glycine biosynthetic process
          modifier: INCREASED
          term:
            id: GO:0006545
            label: glycine biosynthetic process
        - preferred_term: glycine metabolic process
          modifier: DYSREGULATED
          term:
            id: GO:0006544
            label: glycine metabolic process
        molecular_functions:
        - preferred_term: glycine hydroxymethyltransferase activity
          modifier: INCREASED
          term:
            id: GO:0004372
            label: glycine hydroxymethyltransferase activity
        chemical_entities:
        - preferred_term: glycine
          modifier: INCREASED
          term:
            id: CHEBI:15428
            label: glycine
      selected_evidence:
        snippet: In situ quantification of neurotransmitters in the brains of PYCR2 mutant mice and patients
          revealed a signature of encephalopathy driven by excessive cerebral glycine.
        supports: SUPPORT
