        description: 'Aspartate-glutamate carrier 1 deficiency, an ultra-rare recessive disorder of the
          malate-aspartate shuttle. Included because it is the closest mechanistic analogue of the open
          question this entry curates: like HLD10 it presents with neurodevelopmental delay, epilepsy,
          hypotonia, cerebral atrophy and hypomyelination, and the literature debates in the same terms
          whether its hypomyelination is primary or secondary to a neuronal defect. Serial imaging in
          AGC1 deficiency shows early hypomyelination followed by later progression of myelination, which
          is the discriminator - HLD10 myelination does not catch up.'
        disease_term:
          preferred_term: AGC1 deficiency
