      assertion_type: Pathophysiology
      assertion:
        name: Progressive Neuronal Loss and Brain Atrophy
        biological_scale: TISSUE
        description: Alongside the white-matter defect there is a primary neuronal process. Patients are
          born with normal or only mildly reduced head circumference and then acquire microcephaly postnatally,
          with progressive global brain atrophy, ventriculomegaly and a thinning corpus callosum, while
          cerebellum and brainstem are relatively spared. The combination of early-onset intellectual
          disability, epilepsy and atrophy has been read by the original cohort authors as primary neuronal
          dysfunction with secondary hypomyelination - which is why HLD10 is sometimes placed among the
          genetic leukoencephalopathies rather than the classical hypomyelinating leukodystrophies.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: neuron apoptotic process
          modifier: INCREASED
