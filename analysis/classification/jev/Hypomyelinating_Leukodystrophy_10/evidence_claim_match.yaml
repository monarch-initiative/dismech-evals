      assertion_type: Discussion
      assertion:
        discussion_id: hld10_leukodystrophy_vs_leukoencephalopathy
        kind: CONTROVERSY
        attaches_to:
        - pathophysiology#Progressive Neuronal Loss and Brain Atrophy
        status: OPEN
        prompt: Is HLD10 a true hypomyelinating leukodystrophy, or a primary neuronal disorder with secondary
          hypomyelination that is misplaced in the HLD series?
        rationale: 'The name says leukodystrophy, but the largest cohort argued the opposite. Its authors
          noted that imaging ranged from subtle white-matter T2 hyperintensity to progressive brain atrophy,
          and that the clinical picture of early-onset intellectual disability, microcephaly, epilepsy
          and atrophy points to primary neuronal dysfunction with a secondary myelination deficit - which
          is the definition of a genetic leukoencephalopathy rather than a classical HLD. This is not
          merely nosological: it determines whether oligodendrocyte-directed or neuron-directed interventions
          are the rational target. The cell-biology evidence has since given the oligodendrocyte arm independent
          support, so the honest current position is that both processes are real and their relative primacy
          is unsettled.'
      selected_evidence:
        snippet: The clinical features of early onset intellectual disability, microcephaly, epilepsy,
          and brain atrophy suggest primary neuronal dysfunction with secondary deficit in myelination
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
