        name: Molecular Genetic Testing of PYCR2
        description: Diagnosis rests on identifying biallelic PYCR2 variants. Because routine biochemistry
          is normal, molecular testing - clinical exome or genome sequencing, a leukodystrophy or microcephaly
          gene panel, or targeted PYCR2 sequencing once a familial variant is known - is required. Homozygosity
          mapping is informative in consanguineous families.
      selected_evidence:
        snippet: Further genetic testing in the form of clinical exome sequencing revealed compound heterozygous
          mutation of the PYCR2 gene and matching the clinical phenotype with the genotype.
        supports: SUPPORT
