      assertion_type: AnimalModel
      assertion:
        name: Pycr2 loss-of-function mouse (chemically induced p.Met1Thr)
        species: Mouse
        genotype: Pycr2 c.2T>C (p.Met1Thr) homozygous, chemically induced null
        publication: PMID:33734376
        description: A chemically induced start-codon mutation abolishing the 34 kDa PYCR2 protein in
          brain, spinal cord and muscle while leaving Pycr2 mRNA intact. Mutant mice show weight loss,
          progressive kyphosis, hind-limb clasping, reduced grip strength, severe subcutaneous fat loss,
          mild peripheral axonal atrophy, reduced white blood cell counts and altered lipid metabolism.
        modeled_mechanisms:
        - target: Preserved Bulk Proline Supply by Paralogue Redundancy
          relationship: RECAPITULATES
          fidelity: HIGH
          description: The mouse reproduces the defining negative finding of the human disease - an enzymatic
            block without proline depletion - and adds the dietary manipulation that shows proline is
            semi-essential rather than irrelevant.
          limitations: Serum and fibroblast measurements only; brain proline was not the reported readout,
            so tissue-specific depletion in the CNS is not excluded.
        - target: Severe Neurodevelopmental Impairment and Early Mortality
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The mouse develops a neurological and neuromuscular syndrome - kyphosis, hind-limb
            clasping, weight loss, reduced grip strength - consistent with the human neurological impairment.
          limitations: The reported characterisation does not establish frank microcephaly or CNS hypomyelination,
            the two defining human features, so the correspondence is to the neurological syndrome in
            general rather than to leukodystrophy. See the HUMAN_MODEL_MISMATCH discussion.
      selected_evidence:
        snippet: A severe loss of subcutaneous fat in Pycr2 mutant mice is reminiscent of a CL-like phenotype,
          but primary features such as elastin abnormalities were not observed.
        supports: SUPPORT
