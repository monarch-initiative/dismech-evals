            id: GO:0051402
            label: neuron apoptotic process
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Patients lacking PYCR2, a mitochondrial enzyme that synthesizes proline, display postnatal
          degenerative microcephaly with hypomyelination.
        supports: SUPPORT
