        name: Biallelic PYCR2 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic PYCR2 variants - nonsense, splice-site and missense - reduce the amount
          or the catalytic competence of pyrroline-5-carboxylate reductase 2. Missense alleles act by
          two demonstrated routes. Some (p.Arg119Cys, p.Arg251Cys) leave mitochondrial targeting intact
          but lower steady-state protein levels and severely reduce catalytic efficiency, and p.Arg251Cys
          in addition carries a pronounced folding defect. Others cluster in the dimerisation domain and
          impair multimerisation of the obligate-oligomeric enzyme; the p.Gly249Val allele lies directly
          at the dimer interface.
        genetic_context:
          gene:
            preferred_term: PYCR2
