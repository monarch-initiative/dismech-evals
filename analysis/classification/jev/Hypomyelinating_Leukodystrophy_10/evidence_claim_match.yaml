              id: MONDO:0014632
              label: leukodystrophy, hypomyelinating, 10
        context: []
      assertion_type: Genetic
      assertion:
        name: PYCR2
        notes: PYCR2 (1q42.12) encodes pyrroline-5-carboxylate reductase 2, a mitochondrial NAD(P)H-dependent
          oxidoreductase that catalyses the terminal step of L-proline biosynthesis. Biallelic variants
          cause HLD10. Reported pathogenic alleles include the founding missense pair p.Arg119Cys and
          p.Arg251Cys; the recurrent nonsense allele p.Arg266Ter (shared by five of eleven families in
          the largest cohort); missense alleles p.Cys232Gly, p.Arg199Trp, p.Val184Ala, p.Gly159Arg, p.Val193Met,
          p.Gly249Val, p.Val86Gly, p.Val134Met and the mild-phenotype allele p.Val128Ala; the additional
          nonsense allele p.Glu10Ter; and a 3-prime splice-site variant of intron 2. The Thai c.400G>A
          (p.Val134Met) allele is a founder variant on a shared 2.3 Mb haplotype estimated at about 1450
          years old.
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: PYCR2
          term:
            id: hgnc:30262
            label: PYCR2
      selected_evidence:
        snippet: we report mutations in PYCR2, which encodes an enzyme in the proline biosynthesis pathway,
          as the cause of a unique syndrome characterized by postnatal microcephaly, hypomyelination,
          and reduced cerebral white-matter volume
        supports: SUPPORT
