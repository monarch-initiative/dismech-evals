            term:
              id: MONDO:0014732
              label: leukodystrophy, hypomyelinating, 12
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic VPS11 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic VPS11 variants reduce the amount or functional competence of vacuolar protein
          sorting-associated protein 11. The Ashkenazi founder allele p.Cys846Gly lies in the C-terminal
          cysteine-rich RING-H2 domain; circular dichroism shows it does not misfold the domain, but the
          mutant protein is aberrantly ubiquitinated and turned over roughly five times faster than wild-type,
          lowering steady-state VPS11 and weakening its assembly with VPS18 into the shared Class C Vps
          core. The in-frame deletion p.Leu387_Gly395del reduces protein by a distinct route. Because
          VPS11 is a common subunit of both HOPS and CORVET, the net effect is a loss of function of both
          tethering complexes.
        genetic_context:
          gene:
            preferred_term: VPS11
            term:
              id: hgnc:14583
              label: VPS11
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
      selected_evidence:
        snippet: Our data shows that the C846G mutation causes aberrant ubiquitination and accelerated
          turnover of VPS11 protein as well as compromised VPS11-VPS18 complex assembly, suggesting a
          loss of function in the mutant protein.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
