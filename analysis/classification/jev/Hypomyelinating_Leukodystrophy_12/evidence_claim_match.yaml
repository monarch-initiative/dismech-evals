      selected_evidence:
        snippet: Homozygosity for a missense mutation, p.Cys846Gly, in one of the endosomal biogenesis
          core proteins, VPS11, was identified in all the patients. This was shown to be a founder mutation
          with a carrier frequency of 0.6% in the AJ population.
        supports: SUPPORT
