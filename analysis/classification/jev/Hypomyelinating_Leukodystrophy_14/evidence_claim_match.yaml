            term:
              id: MONDO:0033486
              label: leukodystrophy, hypomyelinating, 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic UFM1 Variants
        biological_scale: MOLECULAR
        description: 'Biallelic hypomorphic UFM1 variants. The predominant allele is a Roma founder 3-bp
          promoter deletion that lowers transcription; a rarer homozygous missense variant, p.Arg81Cys,
          alters the UFM1 C-terminal tail that binds UBA5. Complete loss is not observed: biallelic null
          alleles in UFMylation genes are depleted from human population databases, and knockout of the
          pathway is embryonic lethal in mice.'
        genetic_context:
          gene:
            preferred_term: UFM1
            term:
              id: hgnc:20597
              label: UFM1
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: the conspicuous depletion of biallelic null mutations in the components of this pathway
          in human genome databases suggest that it is necessary for embryonic survival, which is consistent
          with the embryonic lethal nature of knockout models for the orthologous genes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29868776
      reference_title: Biallelic UFM1 and UFC1 mutations expand the essential role of ufmylation in brain
        development.
      evidence_source: OTHER
      explanation: Population-database depletion of null alleles and embryonic lethality of knockout models
        support describing disease alleles as hypomorphic rather than null.
