          and hypomyelination in a child of Roma descent, should prompt targeted testing for the UFM1
          promoter deletion. Because the variant lies in the promoter, analysis must include that region;
          exome capture that covers only coding exons can miss it.
      selected_evidence:
        snippet: Roma patients with severe encephalopathy in early infancy with stridor, opisthotonus,
          bradypnea, severe hearing and visual impairment should be tested for the Roma founder mutation
          of H-ABC in UFM1.
