      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: reduced_translation_capacity
        hypothesis_label: Shared reduced-translation-capacity mechanism across aaRS leukodystrophies
        status: EMERGING
        description: The unifying proposal that cytoplasmic aminoacyl-tRNA synthetase leukodystrophies,
          HLD15 among them, share a final common path of reduced translation capacity in the developing
          brain, whatever the proximate defect in the individual enzyme.
      selected_evidence:
        snippet: We therefore hypothesized that leukodystrophies caused by mutations in genes encoding
          cytoplasmic aminoacyl-tRNA synthetases share a common underlying mechanism, such as reduced
          protein availability, abnormal assembly of the multisynthetase complex, and/or abnormal aminoacylation,
          all resulting in reduced translation capacity and insufficient myelin deposition in the developing
          brain.
        supports: SUPPORT
