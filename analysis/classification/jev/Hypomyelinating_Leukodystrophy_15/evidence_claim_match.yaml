      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: m6a_accessibility_defect
        hypothesis_label: Variant-distal m6A site masking reduces EPRS1 expression
        status: EMERGING
        description: 'For the p.Pro1482Thr variant, reduced EPRS1 protein arises not from altered catalysis
          but from an RNA-level defect: the variant masks the accessibility of variant-distal m6A sites,
          impairing METTL3-mediated methylation and therefore nuclear export and translation of the EPRS1
          mRNA.'
      selected_evidence:
        snippet: In contrast to current models, the variant does not alter the sequence of m6A target
          sites, but instead reduces their accessibility for modification.
        supports: SUPPORT
    origin:
