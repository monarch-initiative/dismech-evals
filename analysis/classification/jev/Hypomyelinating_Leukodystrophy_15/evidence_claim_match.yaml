              label: leukodystrophy, hypomyelinating, 15
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: domain_dependent_phenotype
        hypothesis_label: Affected EPRS1 domain shapes the clinical phenotype
        status: EMERGING
        description: 'EPRS1 is bifunctional, carrying separate glutamyl-tRNA synthetase (GluRS) and prolyl-tRNA
          synthetase (ProRS) domains. The published series suggests the two are not clinically equivalent:
          ProRS-domain variants track with the typical hypomyelinating imaging pattern, while GluRS-domain
          variants track with seizures, deafness and less obvious hypomyelination. This is an axis of
          variant non-interchangeability independent of the molecular routes above — those distinguish
          how a variant lowers EPRS1 function, this distinguishes which of the enzyme''s two functions
          is lost.'
      selected_evidence:
        snippet: ProRS-domain variants often show the typical HLD15 imaging pattern, whereas GluRS-domain
          variants may be associated with seizures, deafness, and less obvious hypomyelination, though
          the number of reported cases is limited.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/3
      evidence_path: /mechanistic_hypotheses/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41721156
      reference_title: Compound heterozygosity of a novel missense variant and exonic deletion in hypomyelinating
        leukodystrophy 15.
      evidence_source: OTHER
      explanation: 'Graded PARTIAL and OTHER: the authors hedge explicitly ("may be associated", "though
        the number of reported cases is limited") and are summarizing eight published patients rather
        than testing the association. It is a pattern worth recording, not an established genotype-phenotype
        rule.'
