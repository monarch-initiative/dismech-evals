            term:
              id: MONDO:0054817
              label: leukodystrophy, hypomyelinating, 17
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hld17_canonical_or_noncanonical_aimp2
        kind: KNOWLEDGE_GAP
        attaches_to:
        - mechanistic_hypotheses#msc_loss_reduced_translation
        - pathophysiology#Increased Neural Cell Death
        prompt: Is the brain cell death in AIMP2 deficiency caused by loss of the multi-tRNA synthetase
          complex, or by loss of AIMP2's functions outside it?
        rationale: 'Outside the MSC, AIMP2 promotes apoptosis: it stabilises p53 after DNA damage, and
          its depletion makes cells more resistant to DNA damage-induced apoptosis. Loss of that function
          would predict less cell death, not the increased brain cell death seen in aimp2-disrupted zebrafish,
          which points towards the MSC and translation route. But no study has separated the two in neural
          cells, and the TNF and TGF-beta roles of AIMP2 have not been looked at in this disease at all.'
      selected_evidence:
        snippet: Depletion of AIMP2 increased resistance to DNA damage-induced apoptosis, and introduction
          of AIMP2 into AIMP2-deficient cells restored the susceptibility to apoptosis.
        supports: SUPPORT
