        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: msc_loss_reduced_translation
        hypothesis_label: Loss of the AIMP2 scaffold destabilises the multi-tRNA synthetase complex and
          reduces protein synthesis
        status: EMERGING
        description: Loss of AIMP2 protein disassembles or dysregulates the multi-tRNA synthetase complex,
          reducing protein synthesis capacity, and the developing brain responds with cell death and atrophy.
          Supported in patient fibroblasts and zebrafish; not yet measured in human brain or oligodendrocytes.
          It matches the reduced-translation-capacity proposal made for the cytoplasmic aminoacyl-tRNA
          synthetase leukodystrophies as a group.
      selected_evidence:
        snippet: We show patient-derived fibroblast AIMP2 mutations cause decreased protein expression,
          attenuation of protein synthesis, and dysregulation of the MSC component, methionyl-tRNA synthetase
          (MARS1).
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
