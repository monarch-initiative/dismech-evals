        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mutant_aimp2_golgi_stress
        hypothesis_label: Truncated AIMP2 aggregates in the Golgi and triggers caspase-2 Golgi stress
          that blocks oligodendrocyte differentiation
        status: EMERGING
        description: Overexpressed p.Tyr35Ter AIMP2 aggregates in the Golgi of a mouse oligodendroglial
          cell line, activates Golgi-stress caspase-2 signalling and prevents morphological differentiation,
          which caspase-2 knockdown reverses. This is a toxic-product model. ClinGen gives loss of function
          as the disease mechanism, and the model has not been tested in patient cells or with endogenous
          expression levels.
      selected_evidence:
        snippet: These results suggest that HLD17-associated AIMP2 mutant proteins are localized in the
          Golgi bodies where their proteins stimulate Golgi stress-responsive CASP2 to inhibit differentiation;
          this effect is ameliorated by knockdown of CASP2.
        supports: SUPPORT
    origin:
