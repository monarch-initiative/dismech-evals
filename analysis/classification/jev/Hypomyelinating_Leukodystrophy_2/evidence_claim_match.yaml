          modifier: DECREASED
          term:
            id: GO:0005243
            label: gap junction channel activity
        cellular_components:
        - preferred_term: oligodendrocyte-astrocyte gap junction
          term:
            id: GO:0005921
            label: gap junction
      selected_evidence:
        snippet: Finally, Cx47 mutants that cause Pelizaeus-Merzbacher-like disease do not efficiently
          form functional channels with Cx43, indicating that disrupted Cx47/Cx43 channels cause this
          disease.
        supports: SUPPORT
