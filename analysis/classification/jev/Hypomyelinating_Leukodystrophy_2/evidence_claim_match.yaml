        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_9bb53a46-83ae-4585-9b6b-c8f1aad1c4ab-2025-03-12T160000.000Z
        notes: Encodes connexin-47. Written GJA12 in older literature. Coding variants of all classes
          and a recurrent promoter variant are reported. Biallelic GJC2 variants also cause spastic paraplegia
          44, and heterozygous variants are reported in hereditary lymphedema; neither is part of this
          entry.
        variants:
        - name: c.-167A>G (promoter)
          description: Homozygous variant in the noncoding exon 1 promoter at a SOX10 binding site. A
            founder variant in families of Pakistani origin, estimated to account for about 29% of reported
            GJC2-PMLD patients. It is missed by sequencing that covers only the coding exon.
        - name: p.M283T
          description: ER-retained missense allele that forms no functional channels and activates the
            UPR in primary oligodendrocytes; its mouse orthologue (M282T) is the knock-in model.
      selected_evidence:
        snippet: The diagnosis of PMLD1 is established in a proband with suggestive clinical and neuroimaging
          findings and identification of biallelic pathogenic variants in GJC2 on molecular genetic testing.
        supports: SUPPORT
