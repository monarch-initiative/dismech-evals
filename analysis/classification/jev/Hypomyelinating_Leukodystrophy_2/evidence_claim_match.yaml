          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: Application of this oligodendrocyte-targeted somatic gene therapy at postnatal Day 10
          in groups of double knockout mice, a well characterized model of hypomyelinating leukodystrophy-2,
          resulted in significant improvement in motor performance and coordination at 1 month of age
          in treated compared to mock-treated mice, as well as prolonged survival.
