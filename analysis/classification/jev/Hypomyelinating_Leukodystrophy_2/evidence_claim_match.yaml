      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
        description: Oligodendrocytes couple to astrocytes through heterotypic Cx47/Cx43 and Cx32/Cx30
          channels. PMLD1 mutants fail to form functional channels with astrocytic Cx43, and a knock-in
          mouse carrying the orthologue of human M283T loses most glial network coupling in the corpus
          callosum, as Cx47-null mice do. Loss of this panglial network, rather than of Cx47 protein as
          such, is the proposed core of the disease.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        - preferred_term: astrocyte
          term:
