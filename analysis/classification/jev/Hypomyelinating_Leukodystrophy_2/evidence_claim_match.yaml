      assertion:
        name: Biallelic GJC2 Loss of Function
        description: Biallelic GJC2 variants remove connexin-47 channel function from oligodendrocytes.
          Missense, nonsense and frameshift alleles were found in the founding families. Expressed in
          cell lines, the missense alleles P87S, Y269D and M283T form no functional channels. The recurrent
          promoter variant c.-167A>G acts upstream of the protein, abolishing a SOX10 binding site and
          lowering promoter activity.
        conforms_to: cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult
        biological_scale: MOLECULAR
