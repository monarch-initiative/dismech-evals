        description: Oligodendrocyte connexins take part, with the astrocytic K+ channel Kir4.1, in clearing
          the K+ released by active axons. Without them, myelin develops vacuoles whose size and number
          track axonal activity. Shown in mice lacking both oligodendrocyte connexins; how much this contributes
          in human HLD2 is not established.
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: potassium ion homeostasis
          modifier: DECREASED
          term:
            id: GO:0055075
            label: potassium ion homeostasis
      selected_evidence:
        snippet: The size and number of myelin vacuoles was dramatically increased when axonal activity
          was increased, by either a natural stimulus (eye opening) or pharmacological treatment.
        supports: SUPPORT
        directness: INDIRECT
