      assertion_type: Pathophysiology
      assertion:
        name: Connexin-47 ER Retention and Unfolded Protein Response
        description: Several PMLD1 missense proteins are retained in the endoplasmic reticulum instead
          of reaching the plasma membrane. In primary oligodendrocytes, three such mutants activate the
          unfolded protein response and apoptotic pathways, a toxic gain of function on top of channel
          loss. The milder SPG44 allele p.I33M traffics normally and activates neither, which is one measured
          difference between the severe and mild ends of the GJC2 spectrum.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: unfolded protein response
          modifier: INCREASED
          term:
            id: GO:0030968
            label: endoplasmic reticulum unfolded protein response
      selected_evidence:
        snippet: Here we show that when expressed in primary OLs, three PMLD1 associated mutants (p.P87S,
          p.Y269D and p.M283T) show ER retention of Cx47 and evidence of activation of the cellular stress
          (unfolded protein response, UPR) and apoptotic pathways.
        supports: SUPPORT
