          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005243
            label: gap junction channel activity
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
      selected_evidence:
        snippet: Dual whole-cell patch clamping of transfected Neuro2A cells demonstrated that none of
          the mutants formed functional channels, in contrast to wild type Cx47.
        supports: SUPPORT
