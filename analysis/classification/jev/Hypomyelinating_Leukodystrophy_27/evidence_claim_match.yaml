            term:
              id: MONDO:0958018
              label: leukodystrophy, hypomyelinating, 27
        context: []
      assertion_type: Genetic
      assertion:
        name: POLR1A
        association: Causal biallelic variant
        gene_term:
          preferred_term: POLR1A
          term:
            id: hgnc:17264
            label: POLR1A
        frequency: The only gene associated with HLD27.
        notes: 'Three homozygous missense alleles are reported: p.(Ser934Leu), p.(Thr642Asn) and p.(Thr786Ile).
          All lie in the catalytic core of RPA194.

          The allelic relationship with acrofacial dysostosis, Cincinnati type is the thing to understand
          about this gene. That disorder is dominant, craniofacial, and carries no leukodystrophy; this
          one is recessive, neurological, and carries no mandibulofacial dysostosis. The founding HLD27
          report states outright that the mandibulofacial syndrome was absent in their family. A POLR1A
          variant therefore cannot be interpreted without its zygosity and its position, and a laboratory
          reporting "POLR1A pathogenic" against a ClinVar record dominated by the dominant phenotype is
          not answering the question a leukodystrophy referral asks.'
      selected_evidence:
        snippet: Although in silico analysis, histopathologic evidence and functional verification indicated
          that both variants were deleterious, segregation with the patient phenotype established that
          the POLR1A defect underlies the disease, as a clinically unaffected sister also was homozygous
          for the OSBPL11 variant.
        supports: SUPPORT
    origin:
