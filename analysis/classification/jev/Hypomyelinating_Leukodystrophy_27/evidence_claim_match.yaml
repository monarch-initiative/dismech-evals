              label: leukodystrophy, hypomyelinating, 27
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: POLR-related leukodystrophy (POLR3-associated)
        description: The disorder HLD27 is most likely to be filed under by mistake, because MONDO groups
          both beneath a "POLR-related leukodystrophy" parent and the names are nearly identical. The
          enzymes are not. POLR3A and POLR3B are subunits of RNA polymerase III, which transcribes tRNAs
          and 5S rRNA; POLR1A is polymerase I, which transcribes the rDNA repeat into 47S pre-rRNA. The
          founding HLD27 report places the two side by side and notes the POLR3 disorders begin later.
          Note that dismech's entry under this MONDO term is the POLR3 one (POLR3A, POLR3B); the term
          itself is a parent that nominally spans both polymerases, which is the source of the confusion
          this differential exists to head off.
        disease_term:
          preferred_term: POLR-related leukodystrophy
          term:
            id: MONDO:0100605
            label: POLR-related leukodystrophy
        distinguishing_features:
        - RNA polymerase III rather than polymerase I
        - Later onset than the POLR1A disease
        - Hypodontia and hypogonadotropic hypogonadism in the classic 4H phenotype
      selected_evidence:
        snippet: Variants in three other RNA polymerase subunits, POLR1C, POLR3A and POLR3B, are known
          to cause recessive leukodystrophy similar to the disease afflicting the present family but with
          a later onset.
        supports: SUPPORT
