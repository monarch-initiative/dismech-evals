  4c627002c3da657014b74e6d4ebaa2d10cf32c73be51b66009318fdd535dcb06:
    claim:
      about:
        disease:
          name: Hypomyelinating Leukodystrophy 27
          disease_term:
            preferred_term: leukodystrophy, hypomyelinating, 27
            term:
              id: MONDO:0958018
              label: leukodystrophy, hypomyelinating, 27
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nucleolar Stress and Disturbed Nucleolar Structure
        biological_scale: CELLULAR
        description: 'Loss of rRNA transcription removes what holds the nucleolus together as a phase-separated
          compartment. Ribosomal proteins no longer consumed in assembly become free to bind MDM2, which
          stops MDM2 degrading p53, so p53 accumulates. This is the classic nucleolar-stress checkpoint.

          It is also the weakest-evidenced step in this entry. Abnormal nucleolar homeostasis is documented
          in patient fibroblasts; the phase-separation and p53 mechanism is transferred from Pol I knockouts,
          from POLR1A silencing in cancer cell lines, and from the craniofacial ribosomopathy literature.
          No p53 measurement has been reported in an HLD27 patient sample.'
      selected_evidence:
        snippet: p53 stabilisation was due to the inactivation of the MDM2-mediated p53 degradation by
          the binding of ribosomal proteins no longer used for ribosome building.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21399665
      reference_title: The balance between rRNA and ribosomal protein synthesis up- and downregulates
