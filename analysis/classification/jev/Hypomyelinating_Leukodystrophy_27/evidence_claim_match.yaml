          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Apoptosis of Translation-Dependent Progenitors
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: Deficient 47S rRNA transcription leads to Tp53-dependent neuroepithelial apoptosis,
          and genetic tp53 inhibition partially reverses the phenotype.
        limitations: A homozygous null modelling a dominant craniofacial disorder, used here to support
          a step in a recessive hypomorphic leukodystrophy. The cells that die are neuroepithelium and
          neural crest, not oligodendrocyte lineage, and the animal has no white-matter phenotype. The
          rescue is also only partial, so p53 is not the whole mechanism even in the model.
        readouts:
        - name: Neuroepithelial apoptosis
          target: Apoptosis of Translation-Dependent Progenitors
          direction: INCREASED
          interpretation: Apoptosis of translation-dependent progenitors as the cellular readout of nucleolar
            stress.
        - name: Apoptosis after genetic tp53 inhibition
          target: Apoptosis of Translation-Dependent Progenitors
          direction: RESTORED
          interpretation: The rescue arm. Removing tp53 suppresses the apoptosis, which is what makes
            the p53 step causal in this model rather than correlated.
      selected_evidence:
        snippet: This indicates that POLR1A is critical for rRNA transcription, which is considered a
          rate limiting step in ribosome biogenesis, underpinning its requirement for neuroepithelial
          cell and neural crest cell proliferation and survival.
        supports: SUPPORT
