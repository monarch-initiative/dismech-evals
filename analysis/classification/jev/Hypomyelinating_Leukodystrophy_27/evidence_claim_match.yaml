          phenotype is reported, and a homozygous null is in any case the wrong lesion for a hypomorphic
          recessive disorder - Pol I nulls are preimplantation-lethal in mouse, so the surviving human
          patients cannot be modelled by one.
      selected_evidence:
        snippet: Here we show that homozygous null mutations in Pol I subunits required for rRNA transcription
          and ribosome biogenesis lead to preimplantation lethality.
        supports: SUPPORT
