        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hld4_fever_temperature_sensitive_hsp60
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does fever push the temperature-sensitive D29G HSP60 below a functional threshold and
          cause the acute decompensations of HLD4, and would fever control change the course?
        attaches_to:
        - pathophysiology#HSPD1 Pathogenic Missense Variant
        - phenotypes#Apnea
        - phenotypes#Increased circulating lactate concentration
        - phenotypes#Ethylmalonic aciduria
        - treatments#Supportive and symptomatic care
        rationale: The D29G chaperonin is markedly worse at 37-38.5 degrees C than at 30 degrees C in
          bacterial complementation, and the most severely affected infants had apneic spells and died
          during acute febrile illnesses, with mild lactate rises during encephalopathic exacerbations.
          The two observations fit a temperature-threshold model, but nobody has measured HSP60 function
          or the matrix proteome in patient cells at febrile temperature, and no clinical series has examined
          whether aggressive antipyresis alters outcome.
        proposed_experiments:
        - experiment_id: exp_hld4_patient_fibroblast_febrile_shift
          name: Febrile-temperature shift of D29G patient fibroblasts
          description: Culture homozygous D29G patient fibroblasts and controls at 37 and 39-40 degrees
            C and measure HSP60 oligomer state, matrix proteome, membrane potential and lactate production.
          would_support:
          - pathophysiology#Impaired Mitochondrial Matrix Protein Folding
          supporting_outcome:
          - Patient but not control cells lose oligomeric HSP60 and matrix proteins at febrile temperature.
          refuting_outcome:
          - No temperature-dependent difference between patient and control cells.
      selected_evidence:
        snippet: bacteria expressing the D29G variant grow considerably more slowly than WT cells under
          most conditions tested, and especially at elevated temperatures
        supports: SUPPORT
    origin:
