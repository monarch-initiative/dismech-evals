              label: leukodystrophy, hypomyelinating, 4
        context: []
      assertion_type: Subtype
      assertion:
        name: De novo heterozygous HSPD1 HLD
        display_name: Hypomyelinating leukodystrophy due to heterozygous de novo HSPD1 variants
        description: A sporadic hypomyelinating leukodystrophy caused by heterozygous de novo HSPD1 missense
          variants (recurrent p.Leu47Val; p.Ala536Val and p.Ala536Pro), with early-onset nystagmus, tremor
          and hypotonia evolving into spasticity and ataxia, usually without the lethality of the recessive
          form. The variants cluster spatially in HSP60 and impair chaperonin complex assembly, consistent
          with a dominant-negative mechanism. Some authors label it HLD4 and others call it an additional
          HSPD1 phenotype; it has no separate MONDO or OMIM disease identifier.
        inheritance:
        - name: Autosomal dominant inheritance (de novo)
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Trio whole-exome sequencing revealed a de novo heterozygous variant (c.139T > G, p.Leu47Val)
          in the HSPD1 gene.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/1
