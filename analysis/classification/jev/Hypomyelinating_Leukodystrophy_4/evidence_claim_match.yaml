          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial matrix
          term:
            id: GO:0005759
            label: mitochondrial matrix
      selected_evidence:
        snippet: indicating that the D29G variant is significantly compromised in its chaperone function
        supports: SUPPORT
