          that sits in the equatorial domain facing the chaperonin cavity. The variant protein is expressed
          at normal levels but supports chaperonin function poorly, especially at higher temperature.
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
