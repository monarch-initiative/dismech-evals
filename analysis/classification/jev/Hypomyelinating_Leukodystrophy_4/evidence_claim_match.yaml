              label: leukodystrophy, hypomyelinating, 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hld4_de_novo_form_same_disease
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the de novo heterozygous HSPD1 hypomyelinating leukodystrophy the same disease as recessive
          HLD4, or a separate dominant-negative entity that should have its own identifier?
        attaches_to:
        - has_subtypes#De novo heterozygous HSPD1 HLD
        - pathophysiology#HSP60 Chaperonin Oligomer Destabilization
        rationale: Both forms are HSPD1-caused hypomyelination with nystagmus and hypotonia progressing
          to spasticity, and both impair HSP60 oligomer assembly, which is why they are lumped here. But
          heterozygous D29G carriers are asymptomatic, so the de novo alleles must act differently (a
          proposed dominant-negative effect on ring assembly), the course is generally milder and non-lethal,
          and the de novo patients described so far have ataxia and tremor that were not features of the
          recessive kindred. With about five de novo patients reported, it is unknown whether the two
          forms differ in mechanism enough to warrant separate entries, and MONDO and OMIM have not yet
          assigned the de novo form an identifier.
      selected_evidence:
        snippet: We provide evidence that impaired oligomerisation of the chaperonin complex might underlie
          this HSPD1-related phenotype, possibly through exerting a dominant negative effect.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
