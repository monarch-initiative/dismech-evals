          codes for the second largest subunit of Pol III. Mutations in genes coding for Pol III subunits
          are a major cause of childhood-onset hypomyelinating leukodystrophies with prominent cerebellar
          dysfunction, oligodontia, and hypogonadotropic hypogonadism.
