        disease_term:
          preferred_term: Pelizaeus-Merzbacher disease
          term:
            id: MONDO:0010714
            label: Pelizaeus-Merzbacher spectrum disorder
        description: Classic X-linked hypomyelinating leukodystrophy (HLD1) caused by PLP1 duplications
          or point variants that shares diffuse CNS hypomyelination, ataxia, spasticity, and tremor with
          HLD7.
        distinguishing_features:
        - X-linked inheritance due to PLP1 variants rather than autosomal recessive POLR3A variants
        - Brainstem T2 hyperintensity of the medial lemniscus and pyramidal tracts in PMD, whereas HLD7
          preserves myelination of the medial lemniscus ("closed eye sign") and early-myelinating structures
        - Absence of the 4H dental (hypodontia/oligodontia) and endocrine (hypogonadotropic hypogonadism)
          triad
      selected_evidence:
        snippet: Various types of mutations of the X-linked proteolipid protein 1 gene (PLP1) that include
          copy number changes, point mutations, and insertions or deletions of a few bases lead to a clinical
          spectrum from the most severe connatal PMD, to the least severe spastic paraplegia 2 (SPG2).
          Signs of PMD include nystagmus, hypotonia, tremors, titubation, ataxia, spasticity, athetotic
          movements and cognitive impairment; the major findings in SPG2 are leg weakness and spasticity.
          A diffuse pattern of hypomyelination is seen on magnetic resonance imaging (MRI) of PMD/SPG2
          patients.
        supports: SUPPORT
