            label: Wiedemann-Rautenstrauch syndrome
        description: Allelic autosomal recessive neonatal progeroid syndrome caused by biallelic truncating
          and/or splicing variants in POLR3A, characterized by intrauterine growth restriction, poor postnatal
          weight gain, triangular progeroid facies, widened fontanelles, pseudohydrocephalus, prominent
          scalp veins, generalized lipodystrophy, and natal or hypoplastic teeth.
        distinguishing_features:
        - Neonatal progeroid habitus with severe intrauterine/postnatal growth failure and lipodystrophy
          rather than childhood-onset progressive leukodystrophy
        - Predominance of biallelic truncating and splicing POLR3A combinations distinct from the missense-enriched
          genotypes of HLD7
      selected_evidence:
        snippet: 'Bi-allelic missense variants in POLR3A have been associated with phenotypes distinct
          from WRS: hypogonadotropic hypogonadism and hypomyelinating leukodystrophy with or without oligodontia.
          Our findings confirm the association of bi-allelic POLR3A variants with WRS, expand the clinical
          phenotype of WRS, and suggest specific POLR3A genotypes associated with WRS and hypomyelinating
          leukodystrophy.'
        supports: SUPPORT
