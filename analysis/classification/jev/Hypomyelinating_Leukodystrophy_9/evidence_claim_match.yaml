          term:
            id: GO:0004814
            label: arginine-tRNA ligase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Biallelic variants in RARS1, encoding the cytoplasmic tRNA synthetase for arginine (ArgRS),
          cause a hypomyelinating leukodystrophy.
        supports: SUPPORT
