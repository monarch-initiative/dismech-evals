          not exclude disease, because start-loss alleles can leave active short isoform. No NCIT term
          for an enzyme activity assay was found (OLS searches "enzyme activity assay" and "enzyme assay"
          in NCIT returned only ELISA-unit and immunoassay terms), so diagnosis_term is omitted.'
      selected_evidence:
        snippet: As a consequence, normal ArgRS activity in vitro does not necessarily reflect aminoacylation
          in vivo, for which the long isoform is needed to form the multisynthetase complex.
        supports: SUPPORT
