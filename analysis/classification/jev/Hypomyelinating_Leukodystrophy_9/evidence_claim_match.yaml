      selected_evidence:
        snippet: ArgRS activity was significantly reduced in three patients with intermediate and severe
          phenotypes; in a fourth patient with intermediate to severe presentation, we measured normal
          ArgRS activity, but found translation mainly of the short instead of the long ArgRS isoform.
        supports: SUPPORT
