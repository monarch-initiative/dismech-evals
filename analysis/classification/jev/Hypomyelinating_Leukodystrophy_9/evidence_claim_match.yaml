        description: 'Biallelic germline variants in RARS1 (missense, start-codon loss, frameshift and
          splice variants) reduce the function of cytoplasmic arginyl-tRNA synthetase. The variants act
          through different proximate routes, so this node branches: some destabilize the protein, some
          impair catalysis directly, some abolish or reduce translation of the long isoform, and one missense
          allele (p.Ser456Leu) causes the protein to aggregate in lysosomes in cell models.'
        biological_scale: MOLECULAR
        role: trigger
        genetic_context:
