  1e36cf96956c773bca85ac67ef18b35916ee707c872f8bb81074ea69311b695f:
    claim:
      about:
        disease:
          name: Hypomyelinating Leukodystrophy 9
          disease_term:
            preferred_term: Hypomyelinating leukodystrophy 9
            term:
              id: MONDO:0014506
              label: leukodystrophy, hypomyelinating, 9
        context: []
      assertion_type: Genetic
      assertion:
        name: RARS1
        gene_term:
          preferred_term: RARS1
          term:
            id: hgnc:9870
            label: RARS1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'RARS1 (previously RARS) encodes cytoplasmic arginyl-tRNA synthetase. One transcript gives
          a long isoform, which enters the multi-tRNA synthetase complex, and a short cytosolic isoform
          translated from an alternative start codon. The 2024 review tallied 66 alleles in 33 patients:
          37 missense, 14 start loss, 7 splicing and 7 frameshift. No ClinGen gene-disease validity record
          for RARS1 is cached, so none is recorded.'
        variants:
        - name: RARS1 c.5A>G p.(Asp2Gly)
          description: The most frequent variant (7 of 20 patients in the multinational series). It alters
            the N-terminal extension found only in the long isoform and reduces translation of the long
            isoform without impairing catalytic activity. Homozygotes have mild disease and compound heterozygotes
            mild or intermediate disease; no carrier has had the severe early-infantile form.
        - name: RARS1 c.2T>C p.(Met1?)
          description: Start-loss variant found homozygous in several Iranian families, including two
            consanguineous Bakhtiari families and six cases of an Iranian leukodystrophy cohort, where
            the authors suggest a possible founder effect. Homozygotes have severe disease.
        - name: RARS1 p.Arg512Gln and p.Arg512Trp
          description: Missense changes at Arg512, close to the active centre, in three unrelated families,
            all with severe disease. p.Arg512Gln impairs ArgRS structure and function and lowers its stability.
        - name: RARS1 c.1367C>T p.(Ser456Leu)
          description: Catalytic-domain missense variant, compound heterozygous with a de novo frameshift
            in a patient reported by Nafisinia et al. In cell models the mutant protein aggregates in
            lysosomes and blocks oligodendroglial differentiation.
        - name: RARS1 c.5A>T p.(Asp2Val) and c.1382G>A p.(Arg461His)
          description: Variants reported by Wan et al.; with p.Arg512Gln they lowered ArgRS protein levels
            and stability in transfected cells. A homozygous p.Asp2Val patient had a severe developmental
            and epileptic encephalopathy, unlike carriers of p.Asp2Gly at the same residue.
      selected_evidence:
        snippet: The most frequent RARS1 variant, c.5A>G, led to mild or intermediate phenotypes, whereas
          truncating variants and variants affecting amino acids close to the ArgRS active centre led
          to severe phenotypes.
        supports: SUPPORT
    origin:
