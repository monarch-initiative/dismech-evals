              label: hypomyelination with brain stem and spinal cord involvement and leg spasticity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DARS1 Biallelic Variants
        biological_scale: MOLECULAR
        description: 'Biallelic germline DARS1 variants, mostly missense, alter highly conserved residues
          in or next to the active-site pocket of the C-terminal catalytic lobe of cytoplasmic aspartyl-tRNA
          synthetase (AspRS). Because complete loss of Dars1 is embryonic lethal in mice, disease alleles
          are inferred to retain residual function. Allele effects are not uniform: in an overexpression
          assay in HEK293 lysates A274V abolished aminoacylation while D367Y slightly increased it, so
          a simple loss of catalytic activity is not demonstrated for every allele.'
        genes:
        - preferred_term: DARS1
          term:
            id: hgnc:2678
            label: DARS1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Homozygous or compound heterozygous germline variants; partial loss of function
            is inferred from the lethality of the null allele in mice, not measured for each allele.
      selected_evidence:
        snippet: The complete loss of DARS function is not tolerated in mice suggesting that the identified
          HBSL mutations in humans retain some residual enzyme activity.
        supports: SUPPORT
        directness: INDIRECT
    origin:
