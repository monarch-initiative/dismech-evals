      assertion:
        name: DARS1
        gene_term:
          preferred_term: DARS1
          term:
            id: hgnc:2678
            label: DARS1
        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: The gene was called DARS until it was renamed DARS1, so the discovery paper and early case
          reports use DARS. DARS2, the mitochondrial paralog, causes the different disease LBSL. No ClinGen
          gene-disease validity record for DARS1 is cached in references_cache/, so gene_disease_validity
          is left absent.
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        variants:
        - name: p.Asp367Tyr (D367Y)
          description: A missense allele from the discovery cohort, carried in trans with A274V by the
            index patient and introduced into mouse Dars1 to build the first knock-in model. It did not
            reduce aminoacylation activity in an overexpression assay (PMID:33551752).
        - name: p.Met256Leu (M256L)
          description: A missense allele that causes severe disease in humans; homozygous knock-in mice
            are only mildly affected.
        - name: c.1363T>C and c.821C>G (compound heterozygous)
          description: Compound heterozygous genotype in a Chinese patient with childhood-onset developmental
            regression and leg spasticity; one of the two variants was novel at the time of report.
        - name: c.1498_1499insTCA, c.1210A>G and c.1432A>G
          description: 'Three variants found in two Chinese children: an in-frame single-isoleucine insertion
            (p.500_501insIle), p.Met404Val (present in both children) and p.Met478Val.'
        - name: p.Ala274Val (A274V)
          description: Carried in trans with D367Y by the index patient of the discovery cohort. In an
            overexpression assay it abolished aminoacylation activity, resembling a functional null allele.
        - name: p.Leu426Ser (L426S)
          description: c.1277T>C, reported homozygous; first described in the 2015 series that included
            the adolescent-onset patients (PMID:25527264).
      selected_evidence:
        snippet: Here, we report on the application of high-throughput genome and exome sequencing to
          a cohort of ten individuals with a leukoencephalopathy of unknown etiology
        supports: SUPPORT
