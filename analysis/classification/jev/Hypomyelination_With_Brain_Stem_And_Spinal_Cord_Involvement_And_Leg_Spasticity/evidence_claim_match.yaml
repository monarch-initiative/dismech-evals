        kind: KNOWLEDGE_GAP
        prompt: Is the primary lesion in HBSL neuronal or oligodendroglial? DARS1 is enriched in neurons
          and low in oligodendrocytes, yet the disease is defined by hypomyelination.
        attaches_to:
        - pathophysiology#Impaired Protein Synthesis in CNS Neurons and Glia
        - pathophysiology#Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
        rationale: The expression pattern points at neurons, but the hypomorphic mice show myelin protein
          loss and white matter demyelination, and no cited study has deleted or restored Dars1 selectively
          in neurons or oligodendrocytes. The answer determines which cells a gene-replacement vector
          would need to reach; the authors of the expression study anticipate a neuronal approach.
        status: OPEN
      selected_evidence:
        snippet: In particular, we anticipate high benefit from a gene replacement approach in neurons
          of HBSL mouse models, given the abundant endogenous DARS expression in this lineage cell.
        supports: SUPPORT
