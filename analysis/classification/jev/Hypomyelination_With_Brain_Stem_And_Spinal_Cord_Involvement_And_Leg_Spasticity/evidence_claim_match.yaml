        prompt: Why do adolescent-onset HBSL patients improve partially on steroids, and does an inflammatory
          component contribute to the subacute deteriorations?
        attaches_to:
        - treatments#Corticosteroid Therapy
        - phenotypes#Subacute spastic paraplegia
        rationale: A partial steroid response in a genetic hypomyelinating disorder is unexpected and
          has been reported only in a few uncontrolled cases. In at least one patient the improvement
          was short-lived and progression resumed within months, so it is unclear whether steroids alter
          the course at all. Whether the response reflects secondary inflammation, a non-specific effect,
          or the natural fluctuation of the course has not been studied.
        status: OPEN
      selected_evidence:
        snippet: In the five patients treated with steroids, four patients showed improvements and two
          patients described improvements in motor abilities; however, the effects were short-term in
          one patient, who progressed several months later.
