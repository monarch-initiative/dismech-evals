              label: hypoparathyroidism-deafness-renal disease syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GATA3 Haploinsufficiency
        biological_scale: MOLECULAR
        description: Heterozygous GATA3 variants (frameshift, nonsense, splice-site, missense and whole-gene
          deletions) halve the dose of functional GATA3. Over 90% of characterized variants abolish DNA
          binding by removing or disrupting the C-terminal zinc finger; missense variants cluster in the
          two zinc-finger domains and either abolish DNA binding, reduce binding affinity, or, for N-terminal
          finger variants, disrupt interaction with the cofactor FOG2. Whole-gene deletions produce the
          same syndrome, which is the primary argument for haploinsufficiency as the mechanism.
        genetic_context:
          gene:
            preferred_term: GATA3
            term:
              id: hgnc:4172
              label: GATA3
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: GATA3 sequence-specific DNA-binding transcription factor activity
          modifier: DECREASED
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
      selected_evidence:
        snippet: Investigation for GATA3 mutations in three other HDR probands identified one nonsense
          mutation and two intragenic deletions that predicted a loss of function, as confirmed by absence
          of DNA binding by the mutant GATA3 protein.
        supports: SUPPORT
    origin:
