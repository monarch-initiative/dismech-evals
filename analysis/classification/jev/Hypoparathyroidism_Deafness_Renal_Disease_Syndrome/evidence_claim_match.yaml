        description: 'Congenital anomalies of the female genital tract were present in 3 of 8 female patients
          (37.5%) in a kidney disease cohort, and genital malformations were found to be more common than
          first thought in a larger cohort and systematic review. The anomalies differ between patients:
          the three reported in the kidney cohort were vaginal atresia, uterine duplication and bicornuate
          uterus. Only bicornuate uterus is curated as a separate phenotype. Uterine duplication is not,
          because the source does not say which form of duplication was present. Vaginal atresia is not,
          because it occurred in the one patient (SC230) whose GATA3 variant, p.(Cys339Phe), is classified
          as of uncertain significance; that patient is also counted in the 3/8 figure.'
        phenotype_term:
