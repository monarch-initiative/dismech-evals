      assertion_type: Treatment
      assertion:
        name: Parathyroid Hormone Replacement (Palopegteriparatide)
        description: Conventional calcium and active vitamin D does not replace the renal and skeletal
          actions of PTH and carries a risk of hypercalciuria, nephrocalcinosis and stones. Palopegteriparatide,
          a once-daily prodrug of PTH(1-34), is approved for chronic hypoparathyroidism as a replacement
          therapy and in the phase 3 PaTHway trial normalized urinary calcium and was associated with
          improved eGFR. The evidence is from adults with chronic hypoparathyroidism of mixed causes,
          not specifically HDR; it is relevant here because HDR patients often have structurally abnormal
          kidneys.
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: palopegteriparatide
            term:
              id: CHEBI:759036
              label: palopegteriparatide
      selected_evidence:
        snippet: Conventional treatment includes activated vitamin D and/or calcium supplements, but this
          treatment does not fully replace the functions of PTH and can lead to short-term problems (such
          as hypocalcaemia, hypercalcaemia and increased urinary calcium excretion) and long-term complications
          (which include nephrocalcinosis, kidney stones and brain calcifications).
        supports: SUPPORT
