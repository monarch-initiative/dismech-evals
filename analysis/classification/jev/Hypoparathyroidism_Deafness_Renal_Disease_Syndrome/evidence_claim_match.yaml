              label: hypoparathyroidism-deafness-renal disease syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical and Molecular Diagnosis of HDR Syndrome
        description: HDR should be considered in any patient with two of the three components, and in
          particular in hypoparathyroidism with deafness whether or not renal disease is present, and
          in chronic kidney disease with sensorineural deafness. Apparently idiopathic hypoparathyroidism
          warrants evaluation of hearing and kidneys. The diagnosis is confirmed by a heterozygous pathogenic
          GATA3 variant; copy-number analysis is required because about 15% of variants are whole-gene
          deletions. Relatives should be screened for parathyroid, auditory and renal involvement given
          the variable expressivity.
      selected_evidence:
        snippet: HDR syndrome is a rare cause of hypoparathyroidism and must be excluded in all patients
          with apparently idiopathic hypoparathyroidism.
        supports: SUPPORT
