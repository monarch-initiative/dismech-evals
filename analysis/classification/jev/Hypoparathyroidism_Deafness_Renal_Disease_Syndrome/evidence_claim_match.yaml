        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced GCM2 Expression in Parathyroid Progenitors
        biological_scale: MOLECULAR
        description: GATA3 binds a double-GATA motif in the promoter of GCM2 (GCMB), the parathyroid-specific
          transcription factor, and is required for its expression in the third pharyngeal pouch. Halving
          GATA3 dose reduces the number of GCM2-expressing parathyroid progenitors.
        notes: The cell type is bound to the mature CL:0000446 chief cell of parathyroid gland because
          CL has no parathyroid progenitor term. An OLS search of CL for "parathyroid progenitor" returned
          no results, and a search for "parathyroid" returned only mature parathyroid cell types (chief,
          clear, dark, light, active and inactive chief cells, oxyphil, transitional, glandular and epithelial
          cells of the parathyroid gland).
        cell_types:
        - preferred_term: parathyroid chief cell progenitor
          term:
            id: CL:0000446
            label: chief cell of parathyroid gland
        biological_processes:
        - preferred_term: parathyroid gland development
          modifier: DECREASED
          term:
            id: GO:0060017
            label: parathyroid gland development
      selected_evidence:
        snippet: Electrophoretic mobility shift, luciferase reporter, and chromatin immunoprecipitation
          assays showed that GATA3 binds specifically to a functional double-GATA motif within the GCMB
          promoter.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
