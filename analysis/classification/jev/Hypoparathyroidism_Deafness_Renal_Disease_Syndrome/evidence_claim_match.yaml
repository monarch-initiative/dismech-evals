        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Nephric Duct and Ureteric Bud Development
        biological_scale: CELLULAR
        description: GATA3 is expressed in the nephric (Wolffian) duct downstream of PAX2/PAX8 and beta-catenin
          and upstream of RET. Its loss causes premature nephric duct differentiation, loss of RET expression
          and ectopic ureteric budding, producing a spectrum of congenital anomalies of the kidney and
          urinary tract (renal adysplasia, duplex systems, hydroureter) and of the genital tract derived
          from the same primordia. This is the proposed basis for the dysplastic renal and genital malformations
          of HDR, although the mouse evidence comes from homozygous or conditional loss rather than heterozygosity.
        cell_types:
        - preferred_term: ureteric bud cell
          term:
            id: CL:4030066
            label: ureteric bud cell
        biological_processes:
        - preferred_term: mesonephric duct development
          modifier: ABNORMAL
          term:
            id: GO:0072177
            label: mesonephric duct development
        - preferred_term: ureteric bud development
          modifier: ABNORMAL
          term:
            id: GO:0001657
            label: ureteric bud development
      selected_evidence:
        snippet: Here, we show that the nephric duct-specific inactivation of the transcription factor
          gene Gata3 leads to massive ectopic ureter budding. This results in a spectrum of urogenital
          malformations including kidney adysplasia, duplex systems, and hydroureter, as well as vas deferens
          hyperplasia and uterine agenesis.
        supports: SUPPORT
