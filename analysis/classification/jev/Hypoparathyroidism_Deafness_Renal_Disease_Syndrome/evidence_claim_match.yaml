          all hair cells and supporting cells; otoacoustic emissions deteriorate rapidly and outer hair
          cells accumulate vacuoles. Psychophysical testing in HDR patients shows the signature of outer
          hair cell loss. Complete loss of Gata3 in the developing inner ear additionally abolishes prosensory
          specification and depletes spiral ganglion neurons, showing that the gene is required at several
          steps of cochlear development.
