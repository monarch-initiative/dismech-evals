        name: Dysregulated Nephric Duct and Ureteric Bud Development
        biological_scale: CELLULAR
        description: GATA3 is expressed in the nephric (Wolffian) duct downstream of PAX2/PAX8 and beta-catenin
          and upstream of RET. Its loss causes premature nephric duct differentiation, loss of RET expression
          and ectopic ureteric budding, producing a spectrum of congenital anomalies of the kidney and
          urinary tract (renal adysplasia, duplex systems, hydroureter) and of the genital tract derived
          from the same primordia. This is the proposed basis for the dysplastic renal and genital malformations
          of HDR, although the mouse evidence comes from homozygous or conditional loss rather than heterozygosity.
        cell_types:
