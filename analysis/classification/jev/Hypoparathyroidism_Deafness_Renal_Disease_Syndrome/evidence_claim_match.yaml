        notes: The cell type is bound to the mature CL:0000446 chief cell of parathyroid gland because
          CL has no parathyroid progenitor term. An OLS search of CL for "parathyroid progenitor" returned
          no results, and a search for "parathyroid" returned only mature parathyroid cell types (chief,
          clear, dark, light, active and inactive chief cells, oxyphil, transitional, glandular and epithelial
          cells of the parathyroid gland).
