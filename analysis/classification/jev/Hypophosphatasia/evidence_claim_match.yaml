          value:
            name: TNAP-null mouse, Soriano line (Alpl tm1Sor)
            species: Mouse
            genotype: Alpl<tm1Sor>/Alpl<tm1Sor> (TNAP-/-)
            background: 'involves: 129S7/SvEvBrd, and 129S7/SvEvBrd * C57BL/6'
            alleles:
            - Alpl<tm1Sor>
            genes:
            - preferred_term: ALPL
              term:
                id: hgnc:438
                label: ALPL
            publication: PMID:7550313
            description: 'An independently derived TNAP knockout, curated separately from the Alpl<tm1Jlm>
              line above rather than merged with it, because the two differ on a substantive point: this
              line is reported to have normal skeletal development, while the tm1Jlm line shows abnormal
              bone mineralization. This is the study that establishes the pyridoxal 5''-phosphate mechanism
              behind the seizures - elevated serum PLP, reduced brain GABA, and rescue by pyridoxal administration
              - which the tm1Jlm report does not test.'
            notes: The skeletal discrepancy between the two TNAP-null lines is reported, not resolved
              here; allele construction, genetic background, and the age at assessment all differ between
              the two papers. The lab code in the allele symbol is Soriano - MGI records Alpl<tm1Sor>
              (MGI:1857124) as "targeted mutation 1, Philippe Soriano" - and MGI annotates PMID:7550313
              to this genotype.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Vitamin B6-dependent neurologic vulnerability
        relationship: RECAPITULATES
        fidelity: HIGH
        description: 'Establishes the full mechanistic chain this node names: TNAP loss impairs PLP metabolism,
          brain GABA falls, and seizures follow - with pyridoxal rescue closing the loop.'
        limitations: Mouse PLP handling and the dietary rescue are not straightforwardly transferable
          to human dosing, and the rescued animals go on to develop defective dentition, so pyridoxine
          responsiveness in this model should not be read as a claim about long-term outcome in patients.
        readouts:
        - name: Serum pyridoxal 5'-phosphate
          target: Vitamin B6-dependent neurologic vulnerability
          direction: INCREASED
          interpretation: Substrate accumulating upstream of the missing ectoenzyme, the direct biochemical
            signature of defective PLP dephosphorylation.
        - name: Brain gamma-aminobutyric acid
          target: Vitamin B6-dependent neurologic vulnerability
          direction: DECREASED
          interpretation: The neurotransmitter deficit linking impaired PLP handling to the seizure phenotype.
        - name: Seizure phenotype under pyridoxal supplementation
          target: Vitamin B6-dependent neurologic vulnerability
          direction: RESTORED
          interpretation: The rescue arm. Correcting the vitamer supply abolishes the seizures, which
            is what makes the PLP mechanism causal here rather than correlative.
      selected_evidence:
        snippet: However, at approximately two weeks after birth, homozygous mutant mice develop seizures
          which are subsequently fatal.
        supports: SUPPORT
