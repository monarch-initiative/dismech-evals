        notes: 'CLCN7 encodes ClC-7, which with its obligatory beta-subunit OSTM1 performs 2Cl-/H+ exchange
          across the lysosomal membrane and across the osteoclast ruffled border. Four allelic outcomes
          are on record, and they do not lie on a single dose axis:

          biallelic loss of function causes infantile malignant autosomal recessive osteopetrosis; a dominant-negative
          allele causes Albers-Schonberg autosomal dominant osteopetrosis type II; the gain-of-function
          alleles below cause HOD syndrome with no bone phenotype at all; and simple heterozygous loss
          of function causes no abnormality whatever. That last point is the one most easily lost - CLCN7
          haploinsufficiency is silent, so ADO II is not "half of" recessive osteopetrosis, and HOD is
          not the far end of a severity gradient.'
        gene_term:
          preferred_term: CLCN7
          term:
            id: hgnc:2025
            label: CLCN7
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        variants:
        - name: p.Tyr715Cys
          description: c.2144A>G (NM_001287.5), in the cytoplasmic C-terminal domain. Carried by four
            of the five published patients, all de novo.
          clinical_significance: PATHOGENIC
        - name: p.Lys285Thr
          description: c.854A>C, in the cytoplasmic portion beside the PI(3,5)P2 binding site. Reported
            once, de novo, absent from gnomAD v4.0.
          clinical_significance: PATHOGENIC
