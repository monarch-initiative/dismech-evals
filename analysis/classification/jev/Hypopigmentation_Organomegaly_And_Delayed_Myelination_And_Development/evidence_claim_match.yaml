          description: Measure melanosomal pH and tyrosinase activity in melanocytes from the Clcn7 p.Tyr715Cys
            knock-in mouse against littermate controls, and ask whether alkalinizing treatment restores
            pigment.
          would_support:
          - pathophysiology#Reduced Melanin Synthesis in Melanosomes
          supporting_outcome:
