      assertion_type: Pathophysiology
      assertion:
        name: Reduced Melanin Synthesis in Melanosomes
        biological_scale: CELLULAR
        description: 'The proposed route to hypopigmentation, and the weakest link in this entry''s chain.
          The melanosome is a lysosome-related organelle, tyrosinase is the rate-limiting enzyme of melanin
          synthesis and is inhibited at acidic pH, so a transporter that over-acidifies lysosomes is expected
          to over-acidify melanosomes and suppress pigment. Every step of that is plausible and none of
          it has been measured in this disease: no study has reported melanosomal pH, tyrosinase activity
          or melanosome morphology in a patient with HOD syndrome. The supporting evidence below is drawn
          from melanocyte biology generally and is marked INDIRECT for that reason.'
        biological_processes:
        - preferred_term: melanin biosynthetic process
          term:
            id: GO:0042438
            label: melanin biosynthetic process
          modifier: DECREASED
        cell_types:
        - preferred_term: melanocyte
          term:
            id: CL:0000148
            label: melanocyte
      selected_evidence:
        snippet: The activity of tyrosinase, the rate-limiting enzyme required for melanin synthesis,
          is generally minimal in an acidic environment.
        supports: SUPPORT
        directness: INDIRECT
