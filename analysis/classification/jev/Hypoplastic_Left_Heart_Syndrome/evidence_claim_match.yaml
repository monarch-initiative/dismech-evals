      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: myocardial_defect_upstream_of_flow
        hypothesis_label: Myocardial defect upstream of the flow deficit
        status: EMERGING
        description: A reconciliation rather than a third competitor. On this account an intrinsic myocardial
          defect impairs pump function, the impaired pump produces the flow deficit, and the flow deficit
          produces the structural hypoplasia, so both earlier models describe true steps in one sequence.
          The evidence is a genetic rescue with anatomical specificity. Restoring the gene only in myocardium
          rescues the ventricular, valve, and aortic phenotypes together, which is what one expects if
          all three are downstream of pump function and not if they are independent lesions. This is recorded
          as EMERGING because it rests on one model organism.
        notes: 'Recorded as a distinct hypothesis rather than folded into either parent because it makes
          a different prediction from both. The flow theory predicts that relieving obstruction should
          rescue growth regardless of myocardial genotype, and the intrinsic-defect model predicts that
          relieving obstruction should not help. This one predicts that relief should help partially and
          variably, depending on how much of the pump deficit is mechanical, which is closer to what fetal
          aortic valvuloplasty actually achieves.

          '
      selected_evidence:
        snippet: In contrast to current models, we demonstrate that these structural deficits arise secondary
          to impaired pump function as these phenotypes are rescued when Rbfox is specifically expressed
          in the myocardium.
        supports: SUPPORT
