  570fdb28bd7f7f7efda76cd9ad944c3cdaad46a7900cb0fe33b2190a8a1d6112:
    claim:
      about:
        disease:
          name: Hypoplastic Left Heart Syndrome
          disease_term:
            preferred_term: hypoplastic left heart syndrome
            term:
              id: MONDO:0004933
              label: hypoplastic left heart syndrome
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Rbfox-deficient zebrafish
        description: 'Zebrafish lacking both orthologues of RBFOX2, which develop ventricular, valve,
          and aortic deficiencies overlapping the human phenotype. Its importance is not that it phenocopies
          the disease but that it can be dissected. Restoring the gene only in myocardium rescues the
          structural phenotypes, which places the myocardial defect upstream of the flow deficit and upstream
          of the structural lesions, and human wild-type messenger RNA rescues while patient-derived variants
          do not, which establishes those variants as loss of function. Its limitation is anatomical,
          since the zebrafish heart has one ventricle and no left heart in the mammalian sense, so the
          model can support the mechanism without supporting the anatomy.

          '
        experimental_model_type: OTHER
        organism:
          preferred_term: zebrafish
          term:
            id: NCBITaxon:7955
            label: Danio rerio
        modeled_mechanisms:
        - target: Impaired cardiomyocyte proliferation and differentiation
          description: 'The model localises the primary defect to the myocardium by tissue-restricted
            rescue.

            '
        - target: Reduced flow through the left heart
          description: 'It places the flow deficit downstream of impaired pump function rather than upstream
            of the myocardial phenotype.

            '
        publication: PMID:36198703
      selected_evidence:
        snippet: In contrast to current models, we demonstrate that these structural deficits arise secondary
          to impaired pump function as these phenotypes are rescued when Rbfox is specifically expressed
          in the myocardium.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36198703
      reference_title: Intrinsic myocardial defects underlie an Rbfox-deficient zebrafish model of hypoplastic
