      assertion_type: Subtype
      assertion:
        name: Aortic atresia
        display_name: Hypoplastic left heart syndrome with aortic atresia
        description: 'The severe end of the spectrum, in which the aortic valve is imperforate. It matters
          mechanistically rather than only descriptively, because with no antegrade flow the ascending
          aorta becomes a retrograde-perfused conduit whose only function is to supply the coronary arteries.
          Coronary perfusion is then ductal-dependent, which is why ductal closure in this subtype threatens
          the myocardium and not only the systemic circulation.

          '
      selected_evidence:
        snippet: In the context of aortic atresia, the hypoplastic ascending aorta functions merely as
          a channel that supplies blood to the coronary arteries in a backward flow.
        supports: SUPPORT
