  19df8770eb1d6848dfc2638c6067f9f61f949092c36d929d98745293b5c6d293:
    claim:
      about:
        disease:
          name: Hypoplastic Left Heart Syndrome
          disease_term:
            preferred_term: hypoplastic left heart syndrome
            term:
              id: MONDO:0004933
              label: hypoplastic left heart syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Genetic and cytogenetic testing
        description: 'Chromosomal analysis and sequencing, offered because a minority of cases occur within
          a cytogenetic syndrome and because family clustering establishes heritability. What testing
          can deliver here is bounded in an unusual way. It reliably identifies the syndromic minority,
          and it usually does not identify a causal variant in the rest, not because the sequencing is
          inadequate but because the inheritance is not the kind a single variant explains. Counselling
          therefore has to distinguish a syndromic diagnosis, which carries its own recurrence risk and
          extracardiac surveillance, from a negative result, which does not mean the disease is non-genetic.

          '
      selected_evidence:
        snippet: The implication of this conclusion is that researchers must move beyond the expectation
          that a single disease-causing variant can be found.
