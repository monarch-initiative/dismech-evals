      assertion_type: Treatment
      assertion:
        name: Staged single-ventricle palliation
        description: 'Three operations converting a parallel, ductal-dependent circulation into a series
          circulation with the right ventricle as the systemic pump and passive venous return to the lungs.
          It is the reason the disease is survivable and it is also the origin of the disease these patients
          live with afterwards. In the largest long-term cohort fewer than a third were alive without
          transplantation at thirty-five years, and survival has not improved in recent eras, which is
          a statement about the limits of the approach rather than about surgical technique.

          '
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: Transplant-free survival was 31.0% at 35 years. Transplant-free survival improved over
          time but is not different across recent eras.
        supports: SUPPORT
