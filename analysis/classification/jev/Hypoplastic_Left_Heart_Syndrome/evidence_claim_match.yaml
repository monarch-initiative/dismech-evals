  9c71e8ae2d271a4033d8d18da3895c9150c1e6d6e26a928412bff844b3aa34f6:
    claim:
      about:
        disease:
          name: Hypoplastic Left Heart Syndrome
          disease_term:
            preferred_term: hypoplastic left heart syndrome
            term:
              id: MONDO:0004933
              label: hypoplastic left heart syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Restrictive or intact atrial septum
        biological_scale: ORGANISM
        description: 'The left atrium in this disease receives the entire pulmonary venous return and
          has no outlet through a hypoplastic or atretic mitral valve, so that blood can only leave across
          the atrial septum. When the interatrial communication is small or absent the pulmonary veins
          are obstructed in utero, and the consequence is not merely haemodynamic. Sustained pulmonary
          venous hypertension remodels the lung itself, producing pulmonary lymphangiectasia, so the child
          is born with lung disease as well as heart disease. This is why an intact septum converts an
          operable malformation into an emergency at the moment of delivery, and why it is the single
          prenatal finding that most changes prognosis.

          '
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: Fetuses with hypoplastic left heart syndrome (HLHS) and restrictive/intact atrial septum
          (RAS) have high mortality, partly due to pulmonary lymphangiectasia (PL).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41185129
      reference_title: Fetal Diagnosis of Hypoplastic Left Heart Syndrome With Restrictive Atrial Septum-Atrial
        Septal Morphology, Associated Lung Disease and Outcomes.
      evidence_source: HUMAN_CLINICAL
      explanation: States both the prognostic weight of the finding and the mechanism by which it kills,
