  f4b52a1d7804a2783e682d59522685ad091ea059a4cb56537a555b4b9dab2f88:
    claim:
      about:
        disease:
          name: Hypoplastic Left Heart Syndrome
          disease_term:
            preferred_term: hypoplastic left heart syndrome
            term:
              id: MONDO:0004933
              label: hypoplastic left heart syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: what_starts_the_disease
        kind: CONTROVERSY
        status: OPEN
        prompt: 'Does hypoplastic left heart syndrome begin with a myocardial defect, with a valvar obstruction,
          or with something that produces both?

          '
        rationale: 'This is the field''s central unsettled question and it is unusual in being a dispute
          about the kind of cause rather than the identity of one. The flow theory has the strongest human
          support, since relieving an obstruction in mid-gestation lets left-sided structures grow. The
          intrinsic-defect account has the strongest cellular support, since the first genetic mouse model
          showed proliferation and differentiation defects and a second, independent model in a different
          organism agreed. The reconciling position, that a myocardial defect impairs pump function and
          the resulting flow deficit produces the structural lesion, is supported by a tissue-restricted
          rescue but rests on one model organism with a heart that has no left ventricle. The practical
          stake is which fetuses can be helped, since only the mechanical component is currently addressable.

          '
        attaches_to:
        - pathophysiology#Reduced flow through the left heart
        - pathophysiology#Impaired cardiomyocyte proliferation and differentiation
        proposed_experiments:
        - experiment_id: exp_genotype_stratified_fetal_intervention
          name: Genotype-stratified analysis of fetal valvuloplasty response
          description: 'Sequence a cohort undergoing fetal aortic valvuloplasty and test whether achieving
            a biventricular circulation is predicted by the absence of variants in myocardial growth and
            sarcomeric genes. The three hypotheses make different predictions. Pure flow theory predicts
            no genotype effect, the intrinsic-defect model predicts poor response regardless, and the
            reconciling model predicts response is graded by how much of the pump deficit is mechanical.

            '
      selected_evidence:
        snippet: No single hypothesis has fully explained how HLHS is initiated, progresses, and presents
          with the clinical conditions that are encountered by cardiac surgeons and cardiologists.
        supports: SUPPORT
