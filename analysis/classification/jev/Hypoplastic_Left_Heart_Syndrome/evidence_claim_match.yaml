      assertion:
        name: Systemic right ventricle after staged palliation
        biological_scale: ORGANISM
        description: 'The reconstruction leaves the right ventricle pumping to the body and, after the
          final stage, venous blood flowing to the lungs without a ventricle behind it. This is not a
          repair and the entry curates it as a disease state rather than as an outcome. The right ventricle
          is not built for systemic afterload and eventually fails in a substantial proportion. There
          is also evidence that this failure is not purely mechanical wear, since recessive sarcomeric
          variants found in patients who developed late right ventricular dysfunction suggest the same
          molecular defect that arrested the left ventricle can express itself later as a myopathy of
          the right. Patients with this disease do worse after the same operation than patients with other
          single-ventricle anatomies, which is consistent with something intrinsic to the myocardium rather
          than to the plumbing.

          '
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: heart right ventricle
          term:
            id: UBERON:0002080
            label: heart right ventricle
        genes:
        - preferred_term: MYH6
          term:
            id: hgnc:7576
            label: MYH6
      selected_evidence:
        snippet: These findings implicate a shared molecular basis for the developmental arrest and latent
          myopathy of left and right ventricles, respectively.
        supports: SUPPORT
