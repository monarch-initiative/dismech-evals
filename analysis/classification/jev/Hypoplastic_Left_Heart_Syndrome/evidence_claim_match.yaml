              label: hypoplastic left heart syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Fetal aortic valvuloplasty
        description: 'Catheter dilation of a stenotic aortic valve in mid-gestation, attempted in fetuses
          with critical aortic stenosis whose left ventricle has not yet become hypoplastic. It is the
          only treatment in this disease that acts on mechanism rather than on consequence, and it is
          simultaneously the strongest human test of the flow theory, since it predicts that relieving
          obstruction should permit left heart growth. It partly does. Just over forty percent of live-born
          fetuses in the largest series achieved a biventricular circulation, and their left-sided structures
          were significantly larger at birth. Most still required postnatal intervention, so the result
          supports flow-dependent growth without supporting a cure.

          '
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Therapeutic Procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: Eighty-eight fetuses were live-born, and 38 had a BV circulation (31 from birth, 7 converted
          after initial univentricular palliation).
        supports: SUPPORT
