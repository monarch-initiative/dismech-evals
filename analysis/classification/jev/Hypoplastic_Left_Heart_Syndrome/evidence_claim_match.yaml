  0cc9561a45c6825572fe80d1fe6056402608a0930180535cd5f051b12c6b5b93:
    claim:
      about:
        disease:
          name: Hypoplastic Left Heart Syndrome
          disease_term:
            preferred_term: hypoplastic left heart syndrome
            term:
              id: MONDO:0004933
              label: hypoplastic left heart syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: model_systems_lack_a_left_ventricle
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Can a disease defined by the failure of one specific chamber to grow be modelled in organisms
          whose hearts are not built the same way?

          '
        rationale: 'The two model systems that carry most of the mechanistic weight in this entry both
          have an anatomical mismatch with the disease. The zebrafish heart has a single ventricle and
          no left heart in the mammalian sense, so a model of RBFOX2 loss can show that structural deficits
          are downstream of pump function without showing that the human left ventricle behaves the same
          way. The mouse has the right anatomy but reaches the phenotype through mutations that are not
          the ones most human patients carry, and the human genetic architecture includes lower-penetrance
          and common variation that single-locus mouse lines do not represent. This is a fidelity question
          rather than an absence of evidence, since the experiments themselves are strong. What is uncertain
          is how far a conclusion about causal order in a two-chambered heart transfers to a four-chambered
          one.

          '
        attaches_to:
        - pathophysiology#Impaired cardiomyocyte proliferation and differentiation
        - pathophysiology#Reduced flow through the left heart
        proposed_experiments:
        - experiment_id: exp_human_cardiac_organoid_flow_manipulation
          name: Flow manipulation in patient-derived human cardiac organoids
          description: 'Use patient-derived induced pluripotent stem cell cardiac organoids or chamber-forming
            cardioids carrying HLHS-associated variants, with controlled perfusion, to test whether the
            growth deficit is cell-autonomous, flow-dependent, or both in human tissue with human genetic
            background, closing the anatomical and genetic gaps the animal models leave open.

            '
      selected_evidence:
        snippet: However, unlike classical Mendelian disorders where a relatively small number of genes
          are largely determinative of the occurrence and severity of the disease, the picture in HLHS
          is complex.
        supports: SUPPORT
