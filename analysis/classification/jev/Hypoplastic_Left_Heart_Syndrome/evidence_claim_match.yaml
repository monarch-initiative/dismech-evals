      assertion:
        name: Genetic mouse models of hypoplastic left heart
        description: 'A panel of independently derived mouse lines, the first genetic models of this disease.
          They established two things that changed the field. The hypoplasia is underpinned by intrinsic
          cardiomyocyte proliferation and differentiation defects rather than being purely haemodynamic,
          and the disease is genetically heterogeneous and multigenic rather than attributable to one
          locus. Similar but milder defects in the right ventricle in these models are the animal counterpart
          of the late systemic right ventricular failure seen in patients.

          '
        experimental_model_type: OTHER
        organism:
          preferred_term: house mouse
          term:
            id: NCBITaxon:10090
            label: Mus musculus
        modeled_mechanisms:
        - target: Impaired cardiomyocyte proliferation and differentiation
          description: 'The models demonstrate cell-autonomous proliferation and differentiation defects
            underlying the hypoplasia.

            '
        - target: Genetic lesion affecting cardiac growth or valvulogenesis
          description: 'Eight independent lines establish the multigenic architecture the trigger node
            describes.

            '
        publication: PMID:29569026
      selected_evidence:
        snippet: The findings of similar defects of lesser severity in the right ventricle suggest this
          could contribute to the heart failure risks in surgically palliated HLHS patients.
        supports: SUPPORT
