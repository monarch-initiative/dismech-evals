        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: is_late_right_ventricular_failure_a_myopathy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Is failure of the systemic right ventricle after palliation an afterload consequence,
          an expression of the same myocardial defect that arrested the left ventricle, or both?

          '
        rationale: 'The default assumption is mechanical, that a chamber built for low pressure eventually
          fails under systemic load. Two independent observations complicate it. Patients with this disease
          fare substantially worse after Fontan palliation than patients with other anatomies who have
          the same systemic right ventricle and the same operation, which points at something in the disease
          rather than in the load. And recessive sarcomeric variants were found in patients who developed
          late right ventricular dysfunction, with the authors framing it as one molecular basis expressed
          as developmental arrest on the left and latent myopathy on the right. If that is general, then
          some patients are destined to fail regardless of haemodynamic optimisation, and identifying
          them prospectively would change transplant listing rather than only prognosis.

          '
        attaches_to:
        - pathophysiology#Systemic right ventricle after staged palliation
        proposed_experiments:
        - experiment_id: exp_sarcomeric_genotype_and_fontan_rv_function
          name: Sarcomeric genotype and systemic right ventricular trajectory
          description: 'In a multicentre Fontan cohort, test whether rare sarcomeric and cardiomyopathy-gene
            variant burden predicts the rate of decline in systemic right ventricular ejection fraction
            independently of haemodynamic variables, using other single-ventricle anatomies as the comparator
            group.

            '
      selected_evidence:
        snippet: The composite outcome occurred in 7.1 versus 2.1 cases per 100 person-years in patients
          with HLHS versus non-HLHS (P<0.0001).
        supports: SUPPORT
