      reference: PMID:25052401
      reference_title: 'Fetal aortic valvuloplasty for evolving hypoplastic left heart syndrome: postnatal
        outcomes of the first 100 patients.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'This is the human test of the claim on this node, that flow is an input to growth
        rather than only an output of chamber size. Fetuses whose obstruction was relieved and who reached
        a biventricular circulation had larger left-sided structures at birth. INDIRECT: the quote reports
        a size difference between outcome groups, and the claim follows only by an inference step. The
        design is not randomised, so the comparison is between outcome groups rather than between assigned
        treatments, and selection for who achieves a biventricular circulation is not independent of how
        large the left heart already was.'
