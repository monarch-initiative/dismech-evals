      assertion:
        name: Ductus-dependent systemic and coronary perfusion
        biological_scale: ORGANISM
        description: 'After birth the entire systemic output crosses the arterial duct from the pulmonary
          artery, and the right ventricle supplies both circulations in parallel. In aortic atresia the
          ascending aorta carries only retrograde flow to the coronary arteries, so the coronary supply
          is ductal-dependent too. Systemic and pulmonary flow now compete for the same output, which
          is why a fall in pulmonary vascular resistance after birth paradoxically worsens systemic perfusion
          by stealing flow into the lungs.

          '
        locations:
        - preferred_term: ascending aorta
          term:
            id: UBERON:0001496
            label: ascending aorta
      selected_evidence:
        snippet: Prostaglandin E1 (PGE1) is used to maintain ductus arteriosus patency in infants having
          ductal-dependent congenital heart lesions with oxygen saturation of less than 75% until surgical
          intervention and has become an integral part of palliative therapy in pediatric cardiology.
        supports: SUPPORT
        directness: INDIRECT
