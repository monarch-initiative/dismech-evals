        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: intrinsic_myocardial_defect
        hypothesis_label: Intrinsic myocardial and cell-autonomous defect
        status: ALTERNATIVE
        description: A primary defect of cardiomyocyte proliferation, differentiation, or sarcomeric function
          limits growth of the left heart directly, with the flow deficit a consequence rather than a
          cause. The strongest form of this argument is not that flow is irrelevant but that the flow
          deficit is itself downstream of a myocardial defect, which is what a myocardium-restricted genetic
          rescue of the structural phenotype demonstrates.
      selected_evidence:
        snippet: Current paradigm suggests HLHS is largely of hemodynamic origin, but recent findings
          from analysis of the first mouse model of HLHS showed intrinsic cardiomyocyte proliferation
          and differentiation defects underlying the left ventricular (LV) hypoplasia.
        supports: SUPPORT
    origin:
