            term:
              id: MONDO:0004933
              label: hypoplastic left heart syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endocardial fibroelastosis
        biological_scale: TISSUE
        description: 'A layer of fibroelastic tissue lining the hypoplastic ventricular cavity, further
          reducing compliance and inflow. It is curated as its own node because it is the specific finding
          the flow theory is criticised for failing to explain, so collapsing it into the hypoplasia node
          would hide the weakness in the model.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        locations:
        - preferred_term: heart left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
        notes: 'No biological_processes annotation is attached, and the reason is evidential rather than
          terminological. An earlier draft bound this node to GO:0001837 epithelial to mesenchymal transition,
          which is the wrong process. The literature describes endothelial-to-mesenchymal transition,
          a distinct event in which endocardial endothelium rather than epithelium acquires a mesenchymal
          phenotype. An apt term for that process does exist. GO:0140074 cardiac endothelial to mesenchymal
          transition carries EndMT and EndoMT as exact synonyms, and its definition reaches beyond endocardial
          cushion and valve formation to the generation of cardiac fibroblasts and smooth muscle cells,
          which is the population a fibroelastic lesion would draw on. It is deliberately not used here.
          The evidence cited on this node establishes only that the lesion exists and is unexplained by
          the flow model, and does not establish that any cell-state transition occurs, so binding GO:0140074
          would attach a mechanism claim this entry cannot support. A future curator who arrives with
          evidence for the transition itself should use that term. The cell types are retained because
          the cellular participants are not in doubt.

          '
      selected_evidence:
        snippet: However, the flow theory fails to identify initial causes of disturbed flow or related
          histological features of HLHS like endocardial fibroelastosis.
        supports: SUPPORT
    origin:
