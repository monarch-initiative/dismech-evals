              label: hypoplastic left heart syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Complex non-Mendelian inheritance
        description: 'The dominant pattern. Family clustering establishes that this disease and related
          left-sided malformations are heritable, and genomic regions influencing that inheritance have
          been identified, yet single causal variants have not been found in most patients. The conclusion
          drawn in the field is not that the genetics are unknown but that the inheritance model is wrong,
          that expecting one disease-causing variant is the error. That is why this entry curates the
          genetic contribution as a distributed input to a convergent phenotype rather than as a causal
          gene, and why simple recurrence-risk counselling is not available.

          '
        inheritance_term:
          preferred_term: Non-Mendelian inheritance
          term:
            id: HP:0001426
            label: Non-Mendelian inheritance
      selected_evidence:
        snippet: However, using simple Mendelian inheritance models, identification of single genetic
          variants that "cause" HLHS has remained elusive, and in most cases, the genetic cause remains
          unknown. These results suggest that HLHS inheritance is complex rather than simple.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
