        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: flow_theory
        hypothesis_label: Flow theory, no flow no grow
        status: CANONICAL
        description: An initiating obstruction at the mitral or aortic valve reduces flow through the
          left heart in mid-gestation, and the chamber, valves, and ascending aorta fail to grow because
          shear-dependent growth signalling is lost. On this account the hypoplasia is secondary and the
          primary lesion is mechanical. It is the model that predicts serial fetal echocardiography showing
          progression from isolated critical aortic stenosis to established hypoplasia, and it is the
          model that motivates fetal aortic valvuloplasty.
      selected_evidence:
        snippet: The flow theory is strongly supported by animal models and in utero interventions that
          demonstrate the impact of altered hemodynamics on cardiac morphogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42200818
      reference_title: Is There a Unified Etiology of Hypoplastic Left Heart Syndrome? Evaluating Genetic,
        Structural, and Hemodynamic Models of Disease Initiation.
      evidence_source: OTHER
      explanation: States both the support for the model and its two sources, animal work and the human
        intervention. Evidence source is OTHER because this is a review evaluating competing models rather
        than a primary study.
