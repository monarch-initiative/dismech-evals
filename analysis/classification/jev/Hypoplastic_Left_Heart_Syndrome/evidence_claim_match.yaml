        display_name: Evolving hypoplastic left heart syndrome
        description: 'A mid-gestation fetus with critical aortic stenosis and a left ventricle that is
          still of adequate size, which progresses to established hypoplasia by term if the obstruction
          is not relieved. It is curated as a subtype because it is the only setting in which the natural
          history of the disease is observable prospectively, and because it is the group in which the
          flow theory makes a testable prediction.

          '
      selected_evidence:
        snippet: We included 100 patients who underwent fetal aortic valvuloplasty for severe midgestation
          aortic stenosis with evolving HLHS from March 2000 to January 2013.
        supports: SUPPORT
