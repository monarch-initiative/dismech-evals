          hamartoma is one component of a multisystem malformation syndrome. Beyond point mutations, a
          structurally distinct class of large brain-tissue-specific copy-number and loss-of-heterozygosity
          variants spanning multiple Shh pathway genes accounts for half of the mutation-positive cases.
      selected_evidence:
        snippet: four subjects had somatic mutations in GLI3, an Shh pathway gene associated with HH
