          value:
            name: Small GABAergic Neuron Spontaneous Pacemaker Firing
            biological_scale: CELLULAR
            description: Approximately 80-90% of HH neurons have an interneuron-like phenotype with small,
              round soma and short unbranched processes lacking spines. They express glutamic acid decarboxylase
              and use GABA as their primary neurotransmitter, and possess intrinsic membrane properties
              that produce spontaneous, pacemaker-like firing. These small neurons additionally show functional
              GABA-A receptor rundown on repetitive GABA exposure — a defect intrinsic to the HH receptor
              protein and much less marked in the large neurons — further degrading inhibitory control.
              This autonomous firing is the proposed cellular origin of ictogenesis within the lesion.
            cell_types:
            - preferred_term: GABAergic neuron
              term:
                id: CL:0000617
                label: GABAergic neuron
            molecular_functions:
            - preferred_term: GABA-A receptor activity
              term:
                id: GO:0004890
                label: GABA-A receptor activity
              modifier: DYSREGULATED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Paradoxical GABA-Mediated Excitation of Large Projection Neurons
        description: The GABA released by the small pacemaker neurons depolarizes rather than inhibits
          the large projection neurons.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: These neurons appear to be excitatory, projection-type neurons, and have the functionally
          immature behavior of depolarizing and firing in response to GABA ligands.
        supports: SUPPORT
