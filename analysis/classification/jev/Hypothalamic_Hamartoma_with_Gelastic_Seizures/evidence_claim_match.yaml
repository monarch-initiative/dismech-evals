      assertion:
        name: Scalp Electroencephalography (Characteristically Non-Localizing)
        description: Scalp EEG is characteristically unrevealing for the gelastic seizures — most have
          no ictal scalp correlate, and those that do frequently localize falsely. This diagnostic negative
          is itself a signature of the subcortical (intralesional) seizure origin and should not dissuade
          from the diagnosis.
        diagnosis_term:
          preferred_term: electroencephalography
          term:
            id: NCIT:C38054
            label: Electroencephalography
      selected_evidence:
        snippet: 75% of gelastic seizures have no associated scalp EEG correlate; seizures with ictal
          EEG correlate have high rates of false localization suggesting scalp EEG may be of limited use
          in seizure localization.
        supports: SUPPORT
