      assertion_type: Discussion
      assertion:
        discussion_id: interp_hh_subcortical_seizure_origin
        prompt: How does HH overturn the conventional assumption that seizures originate in cortex, and
          why does that reframing determine treatment?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Intrinsic Ictogenesis within the Hamartoma
        - pathophysiology#Secondary Epileptogenesis in Extrahypothalamic Networks
        rationale: 'HH is the premier human model of subcortical epileptogenesis: depth-electrode and
          surgical evidence established that the gelastic seizures arise inside the hamartoma, not in
          cortical structures. This reframing is not merely academic — it explains why antiseizure medications
          and cortical resections fail, and why ablating a small deep lesion can abolish seizures. It
          also frames the cortical seizure types that appear later as secondary (kindled) rather than
          primary, which is the argument for intervening early, before secondary epileptogenesis and cognitive/behavioral
          deterioration become entrenched.'
      selected_evidence:
        snippet: Contrary to conventional thinking which attributed seizure origin to cortical structures,
          the hamartoma itself has now been firmly established as the site of intrinsic epileptogenesis
          for the gelastic seizures
        supports: SUPPORT
