        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hh_cluster_network_ictogenesis
        prompt: What is the local circuit mechanism by which clusters of small, spontaneously firing GABAergic
          neurons and GABA-depolarized large projection neurons synchronize to generate a gelastic seizure,
          and why do only some hamartomas become epileptogenic?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Small GABAergic Neuron Spontaneous Pacemaker Firing
        - pathophysiology#Paradoxical GABA-Mediated Excitation of Large Projection Neurons
        - pathophysiology#Intrinsic Ictogenesis within the Hamartoma
        rationale: The cellular ingredients are established — spontaneously firing small GABAergic neurons,
          large projection neurons that depolarize to GABA, and GABA-A receptor rundown — but how these
          assemble into a synchronized ictogenic network is explicitly framed as a hypothesis requiring
          further work. Resolving it would explain the variable epileptogenicity of anatomically similar
          lesions and could identify a pharmacological target for a disorder currently treatable only
          by ablation.
        proposed_experiments:
        - experiment_id: exp_hh_cluster_network_recording
          name: Multi-electrode network recording in resected HH tissue
          description: Perform multi-electrode array or multi-patch recordings across intact neuronal
            clusters in acutely resected human HH tissue to determine whether synchronization arises within
            single clusters or across clusters, and to test whether blocking GABA-A-mediated depolarization
            of large neurons desynchronizes the network.
        - experiment_id: exp_hh_epileptogenic_vs_silent_comparison
          name: Comparison of epileptogenic versus non-epileptogenic hamartomas
          description: Compare neuronal cluster architecture, small/large neuron ratio, GABA-A receptor
            rundown, and somatic mutation burden between hamartomas from patients with gelastic epilepsy
            and those presenting only with precocious puberty, to identify what confers epileptogenicity.
      selected_evidence:
        snippet: Further research to define and characterize these local networks is required
        supports: SUPPORT
