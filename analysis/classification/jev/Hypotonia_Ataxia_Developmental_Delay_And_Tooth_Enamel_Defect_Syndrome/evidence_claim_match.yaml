            id: GO:0042149
            label: cellular response to glucose starvation
          modifier: ABNORMAL
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Patient-derived dermal fibroblasts were found to be more sensitive to apoptosis during
          acute glucose deprivation compared to controls.
        supports: SUPPORT
