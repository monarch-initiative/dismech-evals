  431ce0ecfde438b511a939a5e637ca54208949a13848443a620f23d3b6dc7bef:
    claim:
      about:
        disease:
          name: Hypotonia, Ataxia, Developmental Delay, and Tooth Enamel Defect Syndrome
          disease_term:
            preferred_term: hypotonia, ataxia, developmental delay, and tooth enamel defect syndrome
            term:
              id: MONDO:0060666
              label: hypotonia, ataxia, developmental delay, and tooth enamel defect syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: CTBP1
        gene_term:
          preferred_term: CTBP1
          term:
            id: hgnc:2494
            label: CTBP1
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        presence: PRESENT
        association: Heterozygous CTBP1 variants cause HADDTS. The recurrent missense p.Arg342Trp (NM_001328.2:c.1024C>T;
          MANE Select NM_001012614.2:c.991C>T, p.Arg331Trp) accounts for most cases; a frameshift (NM_001328.3:c.1315_1316delCA,
          p.Gln439ValfsTer84) was reported in one patient with an incomplete phenotype.
        notes: 'Two residue numberings circulate for the same allele because CTBP1 has two protein-coding
          isoforms differing at the N-terminus: p.Arg342Trp on the 440-residue CtBP1-L isoform (NM_001328)
          used by most functional papers, and p.Arg331Trp on the MANE Select transcript NM_001012614.
          Healthy individuals carry heterozygous CTBP1 loss-of-function alleles, so the recurrent missense
          is argued to act through a dominant-negative or gain-of-function effect rather than haploinsufficiency;
          that argument is population-genetic and the dominant-negative effect has not been directly demonstrated
          in patient cells. Rarer CTBP1 missense variants (p.Ser124Phe and p.Arg36Pro on NM_001328) were
          reported with phenotypes their authors judged distinct from HADDTS (microcephaly, dysmorphism,
          skeletal anomalies, atrial septal defect, no enamel defect); they are not modelled as HADDTS
          alleles here. No ClinGen gene-disease validity record was consulted for this pair, so gene_disease_validity
          is left empty.'
        variants:
        - name: NM_001328.2:c.1024C>T (p.Arg342Trp)
          description: The recurrent de novo missense variant in most HADDTS patients, located next to
            the alpha-5 helix that frames the PXDLS-motif binding cleft. The same allele is NM_001012614.2:c.991C>T
            (p.Arg331Trp) on the MANE Select transcript.
          gene:
            preferred_term: CTBP1
            term:
              id: hgnc:2494
              label: CTBP1
          synonyms:
          - R342W
          - R331W
          - NM_001012614.2:c.991C>T (p.Arg331Trp)
          variant_type: single nucleotide variant
          type: missense
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: reduced binding of CtBP1 corepressor complex cofactors
            description: Affinity purification and mass spectrometry of tagged CtBP1 showed reduced association
              of the W342 mutant with zinc-finger repressors, HDAC1/2, G9a, GLP, LSD1 and CoREST. Whether
              this acts dominantly on the wild-type protein in patient cells is untested.
      selected_evidence:
        snippet: we have identified four patients with similar phenotypes of developmental delay, intellectual
          disability, failure to thrive, hypotonia, ataxia, and tooth enamel defects who all have the
          same de novo R331W missense variant in C-terminal binding protein 1 (CTBP1)
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27094857
      reference_title: A recurrent de novo CTBP1 mutation is associated with developmental delay, hypotonia,
        ataxia, and tooth enamel defects.
      evidence_source: HUMAN_CLINICAL
      explanation: Original report linking the recurrent de novo CTBP1 variant to the syndrome.
