            term:
              id: MONDO:0014027
              label: hypotrichosis 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Hair Follicle Hair Production
        description: Hair follicles produce too little or no hair, most consistently at the eyebrows and
          eyelashes, while skin, nails, teeth and sweating are spared. SmE is present in the nuclei of
          all hair follicle, epidermal and dermal cells of human scalp, so the restriction is not explained
          by expression. Whether the follicle defect is a subtle splicing change, reduced SmE dosage,
          or a U7 snRNP (histone mRNA 3' end processing) defect has not been tested in hair follicle cells.
          Evidence is human clinical phenotype plus human scalp immunohistochemistry.
        role: effector
        biological_scale: TISSUE
        cell_types:
        - preferred_term: hair follicle cell
          term:
            id: CL:0002559
            label: hair follicle cell
        locations:
        - preferred_term: hair follicle
          term:
            id: UBERON:0002073
            label: hair follicle
      selected_evidence:
        snippet: we detected SNRPE immunoreactivity in the nuclei of all cells of the hair follicle, the
          epidermis, and the dermis
        supports: SUPPORT
    origin:
