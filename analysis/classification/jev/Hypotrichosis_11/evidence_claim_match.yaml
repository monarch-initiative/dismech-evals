          eyelashes, while skin, nails, teeth and sweating are spared. SmE is present in the nuclei of
          all hair follicle, epidermal and dermal cells of human scalp, so the restriction is not explained
          by expression. Whether the follicle defect is a subtle splicing change, reduced SmE dosage,
          or a U7 snRNP (histone mRNA 3' end processing) defect has not been tested in hair follicle cells.
          Evidence is human clinical phenotype plus human scalp immunohistochemistry.
