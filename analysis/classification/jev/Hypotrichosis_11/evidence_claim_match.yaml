      assertion_type: Discussion
      assertion:
        discussion_id: snrpe_hair_restriction
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Hair Follicle Hair Production
        - pathophysiology#Reduced Soluble SmE for U snRNP Incorporation
        prompt: Why does a heterozygous variant in SmE, a core protein of every spliceosomal U snRNP and
          of the U7 snRNP, affect only hair, and does it change splicing in the hair follicle?
        rationale: SmE is expressed in all scalp cell types, yet the disease spares skin, nails, teeth
          and sweating. Minigene reporters and patient lymphocytes showed no major splicing abnormality,
          so the mis-splicing step that the spliceosomopathy module places downstream of the variant has
          not been observed for this disease, and the authors also raised a U7 snRNP (histone mRNA processing)
          contribution. A dominant Snrpe mouse mutant has no obvious hair phenotype, so no animal model
          exists. Other SNRPE variants cause microcephaly, which shows that different alleles reach different
          tissues. Transcriptome profiling of patient hair follicle cells, which the founding report proposed,
          has not been reported.
      selected_evidence:
        snippet: When analyzing these model substrates, no major splicing abnormalities were observed
        supports: SUPPORT
