  9f39e83f59f86bdccf6ece938db92e117f6ba627b6f0b22f4093be8790046212:
    claim:
      about:
        disease:
          name: Hypotrichosis 11
          disease_term:
            preferred_term: hypotrichosis 11
            term:
              id: MONDO:0014027
              label: hypotrichosis 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Soluble SmE for U snRNP Incorporation
        description: 'In transfected HEK293T cells both disease variants lowered the amount of soluble
          SmE: c.1A>G gave full-length protein from the GTG codon at lower levels plus a mostly insoluble
          N-terminally truncated form, and p.Gly45Ser was incorporated into the Sm core less efficiently.
          The authors proposed that the variants act by reducing the soluble fraction available to U snRNPs.
          In lymphocytes from a c.1A>G carrier, full-length SmE was incorporated into the Sm core with
          near-normal efficiency, so the reduction has not been shown in patient cells. Evidence is in
          vitro (HEK293T overexpression, patient lymphoblastoid cells).'
        role: central_effector
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: spliceosomal snRNP assembly
          term:
            id: GO:0000387
            label: spliceosomal snRNP assembly
          modifier: DECREASED
      selected_evidence:
        snippet: The two mutations identified here appear to affect the solubility of SNRPE and therefore
          may be pathogenic because they reduce the soluble fraction that can be incorporated into U snRNPs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
