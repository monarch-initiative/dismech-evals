  68e6ad32d1a713b4b9e6ea8929323828b6eaa3892108bf3f9bef3aafeef14c5c:
    claim:
      about:
        disease:
          name: Hypotrichosis 2
          disease_term:
            preferred_term: hypotrichosis 2
            term:
              id: MONDO:0007805
              label: hypotrichosis 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CDSN Exon 2 Truncating Variant
        biological_scale: MOLECULAR
        description: 'A heterozygous premature stop codon in exon 2 of CDSN yields a truncated corneodesmosin
          that keeps the N-terminal glycine/serine-rich adhesive domain. The clustering of all known HSS
          stop codons in one short region, and the fact that biallelic null alleles cause a different
          disease, argue that the HSS allele acts through its abnormal product rather than through simple
          haploinsufficiency.

          '
        genetic_context:
          gene:
            preferred_term: CDSN
            term:
              id: hgnc:1802
              label: CDSN
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: NEOMORPHIC
          description: 'NEOMORPHIC follows the amyloid work, which shows the truncated product forming
            toxic oligomers and fibrils, a property wild-type corneodesmosin does not have. An earlier
            family report read the clustered stop codons as a dominant-negative effect of the aggregates,
            but no study shows the mutant protein interfering with the wild-type protein. Either way the
            mechanism is dominant and is not haploinsufficiency.

            '
        genes:
        - preferred_term: CDSN
          term:
            id: hgnc:1802
            label: CDSN
        molecular_functions:
        - preferred_term: self-association of the corneodesmosin glycine/serine-rich domain
          term:
            id: GO:0042803
            label: protein homodimerization activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: All to date known nonsense mutations responsible 3 for HSS are clustered in a region
          of 40 amino acids which is in accordance with a dominant negative effect conferred by aggregates
          of truncated CDSN proteins.
        supports: SUPPORT
    origin:
