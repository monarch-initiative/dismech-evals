              It models loss of corneodesmosin, which is the peeling-skin mechanism, not the truncated-protein
              amyloid of HSS.

              '
            genes:
            - preferred_term: Cdsn
              term:
                id: hgnc:1802
                label: CDSN
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Progressive Hair Follicle Failure
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: TISSUE
        limitations: A null allele rather than a truncated aggregating protein, with a lethal barrier
          defect that HSS patients do not have; follicle degeneration here follows epidermal barrier failure
          and desmosome breakage, not perifollicular amyloid.
      selected_evidence:
        snippet: The epidermis was first hyperproliferative with a thick cornified layer, then, both the
          epidermis and the hair follicles degenerated.
