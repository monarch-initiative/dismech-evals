  c821f3d9fbcefa7b99da9e13c63a58393cde2c45d3b666967355599342ebeb46:
    claim:
      about:
        disease:
          name: Hypotrichosis 4
          disease_term:
            preferred_term: hypotrichosis 4
            term:
              id: MONDO:0100522
              label: hypotrichosis 4
        context: []
      assertion_type: Genetic
      assertion:
        name: HRURF
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: HRURF
          term:
            id: hgnc:55085
            label: HRURF
        notes: 'HRURF (HGNC:55085, "HR upstream open reading frame", 8p21.3) was approved as a distinct
          HGNC gene record only in 2020, with U2HR retained as an alias. Every primary MUHH1 report from
          2009 through at least 2023 attributes the variants to "U2HR", described as an inhibitory upstream
          ORF inside the 5'' UTR of HR (HGNC:5172); reports from 2025 onward use HRURF and gloss it as
          "formerly known as U2HR". The two names denote the same element. MONDO records HRURF as the
          RO:0004003 causal gene for MONDO:0100522, which is why this entry uses the approved symbol while
          the cited snippets say U2HR.

          Reported variant classes are all confined to the 34-codon uORF: loss of the initiation codon
          (c.1A>T, c.2T>C, c.3G>A), delayed/read-through termination (c.104A>G, c.105G>T), nonsense (c.67C>T)
          and missense (c.74C>T, c.74C>G), with mutation hot spots at codons 1-7 and 24-28.

          '
      selected_evidence:
        snippet: In 18 more families from different ancestral groups, we identified a range of defects
          in U2HR, including loss of initiation, delayed termination codon and nonsense and missense mutations.
        supports: SUPPORT
