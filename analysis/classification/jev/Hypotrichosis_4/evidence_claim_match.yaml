      assertion_type: Discussion
      assertion:
        discussion_id: muhh1_human_mechanism_gap
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Does anything downstream of increased HR translation - Wnt modulator change, premature
          catagen, follicle shortening - actually occur in human MUHH1 scalp?

          '
        attaches_to:
        - pathophysiology#Dysregulated Wnt Pathway Modulation in the Hair Follicle
        - pathophysiology#Premature Catagen Entry and Hair Follicle Shortening
        rationale: 'The human evidence stops early. Increased translation of the main HR ORF is shown
          in human reporter assays, and reduced follicle density is shown in human scalp biopsy. Everything
          in between - the Wnt modulator changes, earlier catagen entry, and follicle shortening - comes
          from the hairpoor mouse alone, and that model is semidominant with a homozygous phenotype (complete
          baldness, cystic follicles) that has no human counterpart. The largest human histopathological
          study states outright that the mechanism of progressive hair loss is unknown, and no transcriptomic,
          proteomic or single-cell dataset from MUHH1 follicles was found. So the entry''s middle nodes
          are model-derived and should be read that way. The resolving experiments would be a scalp-biopsy
          hair-cycle and Wnt-target readout in genotyped MUHH1 patients, and a heterozygous knock-in of
          a human HRURF variant.

          '
      selected_evidence:
        snippet: The mechanism of progressive hair loss is unknown.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
