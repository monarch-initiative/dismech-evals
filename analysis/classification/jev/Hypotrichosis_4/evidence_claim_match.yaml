      assertion_type: Discussion
      assertion:
        discussion_id: muhh1_wnt_direction
        kind: CONTROVERSY
        status: OPEN
        prompt: 'Does hairless overexpression in MUHH1 raise or lower net Wnt/beta-catenin activity in
          the hair follicle?

          '
        attaches_to:
        - pathophysiology#Dysregulated Wnt Pathway Modulation in the Hair Follicle
        rationale: 'Both published answers come from the same group working in the same hairpoor mouse,
          and they point in opposite directions. In 2010 they reported that HR overexpression decreases
          Sfrp2, a secreted Wnt inhibitor, and concluded that alopecia follows from abnormal upregulation
          of Wnt signaling. In 2014 they reported that HR overexpression increases Dkk1, also a secreted
          Wnt inhibitor and a catagen inducer, and concluded that Dkk1 upregulation drives the follicular
          abnormality. Increasing one Wnt inhibitor while decreasing another does not yield a single net
          direction, and no study measures a direct Wnt/beta-catenin pathway output such as nuclear beta-catenin
          or Axin2/Lef1 transcription in the mutant follicle. Until such a readout exists the pathway
          node is curated as DYSREGULATED rather than INCREASED, and any downstream reasoning that assumes
          "excess Wnt" in MUHH1 is running ahead of the data.

          '
      selected_evidence:
        snippet: This mutation conferred overexpression of HR through translational derepression and,
          in turn, decreased the expression of Sfrp2, an inhibitor of the Wnt signaling pathway.
        supports: SUPPORT
