        - path: /pathophysiology/3
          value:
            name: Dysregulated Wnt Pathway Modulation in the Hair Follicle
            biological_scale: CELLULAR
            description: 'In the hairpoor mouse, HR overexpression changes the expression of secreted
              Wnt inhibitors in follicular skin. The two published results are not concordant in sign:
              Sfrp2 falls (which the authors read as excess Wnt activation), while Dkk1 rises (a Wnt inhibitor
              and catagen inducer). The node therefore records the pathway as dysregulated rather than
              asserting a direction, and the discrepancy is tracked as an open controversy. Nothing here
              has been shown in human MUHH1 skin.

              '
            biological_processes:
            - preferred_term: Wnt signaling pathway modulation in follicular skin
              term:
                id: GO:0016055
                label: Wnt signaling pathway
              modifier: DYSREGULATED
            - preferred_term: secreted Wnt-inhibitor (Sfrp2, Dkk1) expression
              term:
                id: GO:0030178
                label: negative regulation of Wnt signaling pathway
              modifier: DYSREGULATED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Premature Catagen Entry and Hair Follicle Shortening
        causal_link_type: DIRECT
        description: 'Upregulation of the catagen-inducing Wnt inhibitor Dkk1 accompanies early catagen
          entry and shorter follicles in heterozygous hairpoor mice.

          '
      selected_evidence:
        snippet: These findings also indicated that alteration of the hair cycle in (+)/Hr(HP) mice was
          related to the up-regulation of Dkk1 by HR.
        supports: SUPPORT
