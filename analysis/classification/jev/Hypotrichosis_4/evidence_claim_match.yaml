      assertion:
        discussion_id: muhh1_gene_symbol_attribution
        kind: OPEN_QUESTION
        status: OPEN
        prompt: 'Should MUHH1 variants be attributed to HRURF as a gene, or to a regulatory element of
          HR?

          '
        attaches_to:
        - genetic#HRURF
        - genetic#HR
        rationale: 'Every primary report from 2009 to 2023 describes the lesion as being in "U2HR, an
          inhibitory upstream open reading frame in the 5'' UTR of the human hairless gene" - that is,
          as a regulatory element of HR, not as a separate gene. HGNC approved HRURF as its own protein-coding
          gene record only in 2020, and reports from 2025 onward use that symbol while glossing it as
          "formerly U2HR". MONDO records HGNC:55085 as the causal gene for MONDO:0100522, and this entry
          follows that. The open question is practical rather than nomenclatural: variant-calling pipelines
          and gene panels built around HR coding exons do not report this element, which is why the causal
          variant escaped detection for nine years after the locus was mapped, and a panel that lists
          "HR" is not necessarily testing HRURF.

          '
      selected_evidence:
        snippet: A novel likely pathogenic variant c.105G>T (p.(*35Tyrext*?)) in HRURF, formerly known
          as U2HR, causing MUHH1 was identified.
        supports: SUPPORT
