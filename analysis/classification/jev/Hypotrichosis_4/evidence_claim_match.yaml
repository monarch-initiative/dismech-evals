          with respect to HR, so an HR coding-exon panel, or an exome pipeline that does not annotate
          this UTR-embedded ORF, will miss the causal variant. That is exactly why linkage mapped MUHH
          to 8p21 in 2000 but the causal element was not found until 2009.

          '
        markers: Heterozygous pathogenic variant within the 34-codon HRURF (U2HR) upstream open reading
          frame in the 5' UTR of HR at 8p21.3.
        results: 'A heterozygous loss-of-initiation, delayed-termination, nonsense or missense HRURF variant
          in a patient with the characteristic hair phenotype confirms MUHH1.

          '
        diagnosis_term:
          preferred_term: HRURF (U2HR) sequencing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: We found that the c.1A>G mutation in an inhibitory upstream open-reading frame of HR
          (U2HR) was present in all MUHH patients
        supports: SUPPORT
