        - target: Translational De-repression of the Main HR Open Reading Frame
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: 'The mouse uATG mutation abolishes the same uORF and produces HR overexpression
            by translational derepression, the same molecular event as in human MUHH1.

            '
          limitations: 'The allele behaves as semidominant in the mouse - homozygotes are completely bald
            with cyst-like follicles, a state with no human counterpart, since human MUHH1 is described
            only in heterozygotes. Several mechanistic results in this model were obtained from homozygotes
            or from HR-overexpressing keratinocytes rather than from the heterozygote that corresponds
            to the human genotype.

            '
        - target: Dysregulated Wnt Pathway Modulation in the Hair Follicle
          relationship: MEASURES
          fidelity: LOW
          model_scale: MOLECULAR
          description: 'This model is the sole source of the Wnt-modulation claim; it measures Sfrp2 and
            Dkk1 transcript and protein levels in mutant skin.

            '
          limitations: 'The link extrapolates upward: the measurements are transcript and protein levels
            in mouse skin, while the node asserts a cell-level change in Wnt pathway activity in the hair
            follicle. No Wnt pathway readout has been reported in human MUHH1 scalp at all, and the two
            reported modulator changes point in opposite directions on net Wnt activity.

            '
          readouts:
