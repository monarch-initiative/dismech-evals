      assertion_type: Pathophysiology
      assertion:
        name: HRURF Upstream Open Reading Frame Disruption
        biological_scale: MOLECULAR
        description: 'A heterozygous germline variant disrupts the 34-codon inhibitory upstream open reading
          frame HRURF (U2HR) in the 5'' untranslated region of the HR transcript. Loss-of-initiation,
          delayed-termination, nonsense and missense changes all destroy the uORF peptide''s normal function.
          The variant is loss-of-function *for the uORF*; its effect on hairless is the opposite (see
          the next node).

          '
        genetic_context:
          gene:
            preferred_term: HRURF
            term:
              id: hgnc:55085
              label: HRURF
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'The category applies to HRURF, whose repressive uORF function is abolished. The
            downstream consequence for HR is increased protein output, which is a different claim about
            a different gene product and is modeled as a separate node.

            '
        biological_processes:
        - preferred_term: uORF-mediated repression of translational initiation at the main HR ORF
          term:
            id: GO:0045947
            label: negative regulation of translational initiation
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: In 18 more families from different ancestral groups, we identified a range of defects
          in U2HR, including loss of initiation, delayed termination codon and nonsense and missense mutations.
        supports: SUPPORT
