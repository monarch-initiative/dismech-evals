          - name: Dkk1 expression in mutant skin and HR-overexpressing keratinocytes
            target: Dysregulated Wnt Pathway Modulation in the Hair Follicle
            direction: INCREASED
            interpretation: 'Increased secreted Wnt inhibitor and catagen inducer - the opposite sign
              from the Sfrp2 result.

              '
        - target: Premature Catagen Entry and Hair Follicle Shortening
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: 'Heterozygous hairpoor mice enter catagen earlier and have shorter follicles than
            wild type, measured directly by hair-cycle staging and follicle length.

            '
          limitations: 'Premature catagen entry has never been demonstrated in human MUHH1 scalp; the
            only human histopathology available is a cross-sectional follicle count. The mouse hair cycle
            is synchronized and wave-like whereas the human scalp cycles asynchronously, so timing results
            do not transfer directly.

            '
          readouts:
          - name: Hair follicle length and hair-cycle stage
            target: Premature Catagen Entry and Hair Follicle Shortening
            direction: DECREASED
            interpretation: Shorter follicles and earlier catagen entry in heterozygous mutants.
        - target: Progressive Loss of Hair Follicle Density
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: 'Heterozygous mutants have sparse, short hair progressing towards near alopecia,
            broadly paralleling the human progressive loss.

            '
          limitations: 'The mouse phenotype is not the human natural history. Human MUHH1 is triphasic
            - sparse at birth, coarse and wiry in childhood, then patterned loss from puberty - and the
            model has no counterpart to the childhood coarse-wiry phase or to the pubertal inflection
            point. No follicle-density quantification in the mutant was reported for comparison with the
            human count of nine hairs per 4 mm section.

            '
      selected_evidence:
        snippet: Both mutations were in the uATG codon of the second uORF in the 5' UTR and corresponded
          to the mutations identified in Marie Unna Hereditary Hypotrichosis (MUHH) patients.
        supports: SUPPORT
