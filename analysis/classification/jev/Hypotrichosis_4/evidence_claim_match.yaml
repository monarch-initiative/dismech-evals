        snippet: MUHH is an autosomal dominant disorder that is characterized by the absence or scarcity
          of scalp hair, eyebrows, and eyelashes at birth; coarse and wiry hair during childhood; and
          progressive hair loss beginning around puberty.
        supports: SUPPORT
