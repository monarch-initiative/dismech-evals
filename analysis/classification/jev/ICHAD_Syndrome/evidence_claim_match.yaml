      assertion_type: Genetic
      assertion:
        name: IKZF2
        gene_term:
          preferred_term: IKZF2
          term:
            id: hgnc:13177
            label: IKZF2
        relationship_type: CAUSATIVE
        association: Dominant negative variants in the DNA-binding zinc fingers
        variant_origin: GERMLINE
        notes: IKZF2 encodes HELIOS. ICHAD variants lie in N-terminal DNA-binding zinc fingers 2 and 3.
          Variants elsewhere in the gene (truncating, or in the dimerization and partner-binding regions)
          cause non-syndromic HELIOS deficiency instead, and Zn2+-coordinating missense variants in zinc
          fingers 2 and 3 have been reported with isolated dominant hearing loss. No ClinGen gene-disease
          validity assertion exists for this pair.
      selected_evidence:
        snippet: These variants cause a novel genetic syndrome characterised by immunodysregulation, craniofacial
          anomalies, hearing impairment, athelia and developmental delay.
        supports: SUPPORT
