        description: CRISPR/Cas9 Idh3b loss-of-function allele with no detectable protein. Homozygotes
          are born at Mendelian ratios and show no retinal stress, normal scotopic ERG and normal retinal
          structure to postnatal day 180, and their embryonic fibroblasts have normal mitochondrial respiration.
        modeled_mechanisms:
        - target: Rod and Cone Photoreceptor Degeneration
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: TISSUE
          description: Idh3b-null mice keep normal retinal structure and rod function to six months, whereas
            patients develop retinitis pigmentosa.
          limitations: Follow-up stopped at six months, and human IDH3B patients present in adulthood,
            so the model may simply not have been aged long enough; a species difference in isocitrate
            dehydrogenase redundancy is the alternative.
          readouts:
          - name: Scotopic ERG a-wave and retinal GFAP at P180
            target: Rod and Cone Photoreceptor Degeneration
            direction: UNCHANGED
            interpretation: No retinal stress and normal rod responses in homozygous mutants.
