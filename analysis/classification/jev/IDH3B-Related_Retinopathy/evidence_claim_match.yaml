  b38d25a22bdec2f3514bb8b1e9a233d6f02da7c86aabc57f141138139335ed72:
    claim:
      about:
        disease:
          name: IDH3B-Related Retinopathy
          disease_term:
            preferred_term: IDH3B-related retinopathy
            term:
              id: MONDO:0800393
              label: IDH3B-related retinopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: idh3b_mouse_retina_mismatch
        prompt: Why do two independent Idh3b-null mouse lines lose IDH3 activity and accumulate retinal
          isocitrate yet keep normal retinas, while humans homozygous for IDH3B loss-of-function variants
          develop retinitis pigmentosa?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Photoreceptor Mitochondrial Energy Insufficiency
        - pathophysiology#Rod and Cone Photoreceptor Degeneration
        - animal_models#Idh3b c.478_487del CRISPR mouse
        - animal_models#Idh3b exon 2-4 deletion knockout mouse
        rationale: The proposed mechanism, photoreceptor energy failure from a partial TCA-cycle block,
          rests on human genetics and on retinal energetics measured in other contexts. The only in vivo
          models reproduce the enzyme and metabolite defect but not the degeneration, and Idh3b-null cells
          keep normal respiration, so the step from enzyme deficiency to photoreceptor death is untested.
          The candidate explanations (insufficient ageing, species differences in isocitrate dehydrogenase
          redundancy, or a retina-specific role of the human beta subunit) predict different results in
          aged mice and in human photoreceptor models. A fourth explanation, favoured by the Idh3a model's
          authors, is residual activity of IDH3 alpha-gamma dimers, which form without the beta subunit
