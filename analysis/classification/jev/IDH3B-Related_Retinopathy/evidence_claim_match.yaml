              label: IDH3B-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Photoreceptor Mitochondrial Energy Insufficiency
        description: 'Hypothesised link between the enzyme defect and cell loss. Photoreceptors are dependent
          on aerobic metabolism, and ex vivo mouse retina respires close to its maximal mitochondrial
          capacity with little reserve, so a partial TCA-cycle defect that other tissues tolerate could
          exhaust photoreceptor energy supply. Photoreceptor-specific deletion of Pdha1, which removes
          pyruvate entry into the TCA cycle, causes retinal degeneration in mice with decreased TCA-cycle
          intermediates, showing that photoreceptors need mitochondrial TCA-cycle input; that study did
          not involve IDH3. Direct evidence is lacking: Idh3b-null mouse fibroblasts show normal maximal
          and reserve respiration, Idh3b-null mouse retinas do not degenerate, and no measurement of respiration
          or ATP in IDH3B-deficient human photoreceptors has been reported.'
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: At baseline, mitochondria respiration in the intact wild-type retina was close to maximal,
          with limited reserve capacity.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
