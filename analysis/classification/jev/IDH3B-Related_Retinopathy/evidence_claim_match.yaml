      assertion_type: Pathophysiology
      assertion:
        name: Impaired Isocitrate Oxidation in the TCA Cycle
        description: In Idh3b-null mouse retina, citrate, isocitrate and aconitate roughly double while
          alpha-ketoglutarate and the metabolites downstream of it stay unchanged, consistent with partial
          compensation, for example by NADP-dependent isocitrate dehydrogenases. No patient tissue metabolite
          data have been reported. Hartong et al. proposed that IDH2 together with the mitochondrial transhydrogenase
          NNT can substitute for IDH3 outside the retina, and noted from EyeSAGE expression tags that
          IDH3 transcripts exceed IDH2 transcripts only in the retina and retinal pigment epithelium.
        biological_scale: CELLULAR
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        biological_processes:
        - preferred_term: isocitrate metabolic process
          modifier: DECREASED
          term:
