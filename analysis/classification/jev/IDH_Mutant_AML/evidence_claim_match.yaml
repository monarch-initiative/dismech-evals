              label: acute myeloid leukemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dioxygenase Inhibition
        description: 2-HG is structurally similar to alpha-ketoglutarate and competitively inhibits alpha-ketoglutarate-dependent
          dioxygenases. Key targets include TET2 DNA demethylases, Jumonji-domain histone demethylases,
          and prolyl hydroxylases. This disrupts normal epigenetic regulation and hypoxia responses.
        biological_processes:
        - preferred_term: DNA demethylation
          modifier: DECREASED
          term:
            id: GO:0141166
            label: chromosomal 5-methylcytosine DNA demethylation pathway
      selected_evidence:
        snippet: 2-HG dysregulates a wide array of molecular pathways, among them a large family of dioxygenases
          that utilise the closely related metabolite α-ketoglutarate (α-KG) as an essential co-substrate.
        supports: SUPPORT
    origin:
