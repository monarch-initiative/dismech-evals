  d420ca2b5c73afce1819864990de6062ae7f78709ae36745433f5462c389100e:
    claim:
      about:
        disease:
          name: Acute Myeloid Leukemia, IDH-Mutated
          disease_term:
            preferred_term: IDH-mutated acute myeloid leukemia
            term:
              id: MONDO:0018874
              label: acute myeloid leukemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IDH Neomorphic Enzyme Activity
        description: Wild-type IDH1 and IDH2 convert isocitrate to alpha-ketoglutarate in the cytoplasm
          and mitochondria respectively. Mutant IDH enzymes gain neomorphic activity, reducing alpha-ketoglutarate
          to the oncometabolite 2-hydroxyglutarate (2-HG), which accumulates to millimolar concentrations
          in leukemic cells.
        cell_types:
        - preferred_term: myeloblast
          term:
            id: CL:0000835
            label: myeloblast
      selected_evidence:
        snippet: Mutations in isocitrate dehydrogenase (IDH) 1 and -2 increase the capacity of cancer
          cells to produce a normally scarce metabolite, D-2-hydroxyglutarate (2-HG), by several orders
          of magnitude.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37526143
      reference_title: 'The curious case of IDH mutant acute myeloid leukaemia: biochemistry and therapeutic
        approaches.'
      evidence_source: OTHER
      explanation: This abstract links IDH1/2 mutations to increased 2-HG production, supporting the neomorphic
        IDH activity described.
