            term:
              id: MONDO:0003210
              label: intrahepatic cholangiocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 2-HG Accumulation and Dioxygenase Inhibition
        description: 2-HG is structurally similar to alpha-ketoglutarate and competitively inhibits aKG-dependent
          dioxygenases, including TET2 (DNA demethylation), JMJD histone demethylases, and prolyl hydroxylases.
          This leads to widespread epigenetic and metabolic dysregulation.
      selected_evidence:
        snippet: These mutations result in elevated levels of an oncometabolite, 2-hydroxyglutarate, which
          is associated with higher DNA CpG methylation and altered histone methylation that accompany
          a block in cellular differentiation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
