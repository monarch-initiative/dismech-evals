            term:
              id: MONDO:0003210
              label: intrahepatic cholangiocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IDH1/2 Neomorphic Mutation
        genetic_context:
          variant_origin: SOMATIC
        description: IDH1 R132 or IDH2 R140/R172 mutations are neomorphic, conferring a new enzymatic
          function. Instead of converting isocitrate to alpha-ketoglutarate (aKG), mutant IDH converts
          aKG to the oncometabolite D-2-hydroxyglutarate (2-HG). 2-HG accumulates to millimolar concentrations
          in tumor cells.
        cell_types:
        - preferred_term: cholangiocyte
          term:
            id: CL:1000488
            label: cholangiocyte
        molecular_functions:
        - preferred_term: isocitrate dehydrogenase (NADP+) activity
          modifier: ABNORMAL
          term:
            id: GO:0004450
            label: isocitrate dehydrogenase (NADP+) activity
        locations:
        - preferred_term: intrahepatic bile duct
          term:
            id: UBERON:0003704
            label: intrahepatic bile duct
      selected_evidence:
        snippet: Commonly occurring GAs in intrahepatic CCA were TP53 (35%), KRAS (24%), ARID1A (20%),
          IDH1 (18%), MCL1 (16%) and PBRM1 (11%).
        supports: SUPPORT
