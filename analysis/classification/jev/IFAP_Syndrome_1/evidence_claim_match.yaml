      assertion_type: Inheritance
      assertion:
        name: X-linked recessive inheritance
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
        description: 'MBTPS2 is on Xp22, and affected individuals are male. The locus was mapped to a
          5.4 Mb interval between DXS989 and DXS8019 before the gene was identified.

          Carrier females are not uniformly unaffected. Mosaic cutaneous lesions along Blaschko lines
          are described, and an ocular sign has been proposed: retinal vascular tortuosity in the carrier
          mother of two affected boys. That is a single family and is curated as such - it is a lead for
          examining carriers, not an established carrier test.'
      selected_evidence:
        snippet: Ichthyosis follicularis with atrichia and photophobia (IFAP syndrome) is a rare X-linked,
          oculocutaneous human disorder.
        supports: SUPPORT
