        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        features: MBTPS2 encodes site-2 protease, a membrane-embedded zinc metalloprotease that performs
          the intramembrane cleavage step of regulated intramembrane proteolysis for SREBP and ATF6. Both
          missense and splice-site variants are pathogenic.
        notes: 'Three things about this gene that a variant-interpretation reader needs.

          First, the genotype-phenotype relationship here is quantitative and was measured, not inferred.
          The gene-identification study assayed five patient variants for residual activity and found
          the degree of diminished activity correlated with clinical severity in male patients. That is
          unusually direct for a rare disease, and it is why the disease-BRESHECK continuum is curated
          as one entity.

          Second, that correlation coexists with real variable expressivity within a single allele. The
          intronic variant c.671-9T>G produced IFAP with Olmsted-like keratoderma in one patient and IFAP
          without keratoderma in two others. So residual activity predicts severity along the main axis
          while leaving individual features unpredictable - both statements are true and neither should
          be dropped.

          Third, MBTPS2 is an allelic series across several distinct diseases: IFAP with or without BRESHECK,
          keratosis follicularis spinulosa decalvans, an X-linked form of Olmsted syndrome, and osteogenesis
          imperfecta type XIX. Two of those already have dismech entries. Why the same gene produces a
          bone disease in one family and a skin-and-eye disease in another is explicitly unresolved in
          the review literature - it is not a matter of a curator not having looked it up.'
      selected_evidence:
        snippet: The degree of diminished activity correlated with clinical severity as noted in male
          patients.
        supports: SUPPORT
