    evidence_metadata:
      reference: PMID:33742461
      reference_title: 'Ichthyosis follicularis, atrichia and photophobia (IFAP) and hereditary mucoepithelial
        dysplasia: Two syndromes that share a common clinical spectrum.'
      evidence_source: HUMAN_CLINICAL
      explanation: Graded PARTIAL against the ATF6 node. It bears on the question by showing that losing
        the SREBP substrate alone produces an overlapping phenotype, but it does not measure the ATF6
        arm at all, and the two diseases differ in inheritance and in mucosal involvement - so it narrows
        the ATF6 arm's remaining explanatory role without excluding it.
