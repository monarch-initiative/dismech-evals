  380cac5b7092a8dba2fcd913ebf816aedaab391c9c92e273fc34224f6f3af238:
    claim:
      about:
        disease:
          name: IFAP Syndrome 1
          disease_term:
            preferred_term: IFAP syndrome
            term:
              id: MONDO:0100213
              label: IFAP syndrome 1, with or without BRESHECK syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ifap_allelic_series_tissue_specificity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do MBTPS2 variants produce a skin-and-eye disease in some families and a bone disease
          in others?
        attaches_to:
        - genetic#MBTPS2
        rationale: 'MBTPS2 causes IFAP with or without BRESHECK, keratosis follicularis spinulosa decalvans,
          an X-linked form of Olmsted syndrome, and osteogenesis imperfecta type XIX. These are not variations
          in severity of one phenotype - osteogenesis imperfecta is a different organ system from ichthyosis
          and keratopathy.

          The review literature is unusually explicit that this is unresolved, which is worth recording
          because it is easy for a curator to assume the answer is known and merely not looked up.

          Two features of this entry make the question sharper rather than more diffuse. The activity-severity
          correlation says residual protease activity sets severity along the IFAP-BRESHECK axis - so
          if it also set tissue specificity, KFSD and osteogenesis imperfecta would be points on the same
          line, and they are not. And the same allele can vary in expressivity within IFAP, so allele
          identity does not fully determine the phenotype even inside one disease.

          dismech is in an unusual position to notice this, because it already carries entries for two
          of the other MBTPS2 diseases. A cross-entry comparison of which residues and which functional
          consequences map to which entity is a concrete piece of work that does not need new data.'
        proposed_experiments:
        - experiment_id: exp_ifap_allelic_series_residue_map
          name: Residue-level map of MBTPS2 variants across the four allelic diseases
          description: Assemble every reported MBTPS2 variant with its associated clinical entity, map
            onto the protein's transmembrane and catalytic architecture, and test whether disease assignment
            separates by domain, by predicted residual activity, or by neither. Assay a matched set in
            both the SREBP and ATF6 readouts, since only the SREBP arm has been systematically measured.
          would_support:
          - pathophysiology#Hypomorphic MBTPS2 Variant
          - pathophysiology#Reduced Regulated Intramembrane Proteolysis
          supporting_outcome:
          - Variants segregate by domain or by which substrate arm they preferentially impair, giving
            a mechanism for the tissue specificity.
          would_refute:
          - pathophysiology#Reduced Regulated Intramembrane Proteolysis
          refuting_outcome:
          - Variants causing bone and skin disease are interleaved across domains with indistinguishable
            functional profiles, placing the determinant outside the protein.
      selected_evidence:
        snippet: While its functional role has become much clearer in the recent years, how mutations
          in the MBTPS2 gene lead to several human disorders with different phenotypes
        supports: SUPPORT
