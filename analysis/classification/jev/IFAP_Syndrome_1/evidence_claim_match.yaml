            term:
              id: MONDO:0100213
              label: IFAP syndrome 1, with or without BRESHECK syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired SREBP-Driven Lipid Synthesis
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'Less active SREBP reaches the nucleus, so cholesterol and fatty-acid synthesis genes
          are under-induced. The functional signature of this in the assays used to prove variant pathogenicity
          is failure to grow in cholesterol-depleted medium - a cell that cannot make its own lipid and
          is no longer given any.

          In the epidermis this is the barrier-lipid arm: the cornified envelope depends on locally synthesised
          lipids, and a follicular hyperkeratosis is what a failing keratinisation programme looks like
          at the skin surface.'
        biological_processes:
        - preferred_term: SREBP signaling pathway
          modifier: DECREASED
          term:
            id: GO:0032933
            label: SREBP signaling pathway
        - preferred_term: cholesterol biosynthesis
          modifier: DECREASED
          term:
            id: GO:0006695
            label: cholesterol biosynthetic process
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: Wild-type MBTPS2 was able to complement the protease deficiency in Chinese hamster M19
          cells as shown by induction of an SRE-regulated reporter gene in transient transfection experiments
          and by growth of stably transfected cells in media devoid of cholesterol and lipids.
        supports: SUPPORT
