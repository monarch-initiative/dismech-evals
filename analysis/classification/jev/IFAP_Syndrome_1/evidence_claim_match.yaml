              id: MONDO:0100213
              label: IFAP syndrome 1, with or without BRESHECK syndrome
        context:
        - path: /experimental_models/0
          value:
            name: CHO M19 site-2-protease-deficient complementation assay
            experimental_model_type: CELL_LINE
            description: 'Chinese hamster ovary M19 cells lack endogenous S2P and therefore cannot grow
              without exogenous cholesterol and lipid. Transfecting human MBTPS2 rescues them, and patient
              variants rescue them only partially - read out both by an SRE-regulated reporter and by
              growth in lipid-free medium.

              This is the assay the entire pathogenicity classification of MBTPS2 variants rests on, and
              it is the reason the severity relationship in this disease is quantitative rather than categorical.'
          role: ancestor
        - path: /experimental_models/0/modeled_mechanisms/0
          value:
            target: Impaired SREBP-Driven Lipid Synthesis
            relationship: MEASURES
            fidelity: MODERATE
            description: 'Quantifies residual S2P activity through its SREBP output, which is what makes
              the activity-severity correlation measurable.

              Curated as MEASURES rather than RECAPITULATES on purpose: the cell line does not model IFAP,
              it assays one function of the mutant protein. Nothing about a hamster ovary cell reproduces
              a hair follicle or a corneal limbus.'
            limitations: Two limits worth stating. The readout is the SREBP arm; the assay in its original
              form says nothing about ATF6, which is why the ER-stress node is graded lower. And a rodent
              ovary-derived line carries none of the tissue-specific context that determines why the phenotype
              falls on skin, hair and cornea rather than on the many other tissues that need SREBP.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: SRE-regulated reporter induction and growth in lipid-free medium
        target: Impaired SREBP-Driven Lipid Synthesis
        direction: DECREASED
        interpretation: Patient variants complement the M19 deficiency less well than wild-type MBTPS2,
          and the shortfall is graded rather than all-or-none.
      selected_evidence:
        snippet: Wild-type MBTPS2 was able to complement the protease deficiency in Chinese hamster M19
          cells as shown by induction of an SRE-regulated reporter gene in transient transfection experiments
          and by growth of stably transfected cells in media devoid of cholesterol and lipids.
        supports: SUPPORT
