        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Regulated Intramembrane Proteolysis
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'S2P makes the second cut of a two-cut cascade. SREBP and ATF6 are cleaved first
          by site-1 protease and then, within the membrane, by S2P, which releases the active transcription-factor
          domain into the cytosol. Reduce S2P activity and both substrates are released less efficiently.

          This node is the reason the disease looks pleiotropic. Two entirely unrelated transcriptional
          programmes share one protease, so a single hypomorphic allele hits lipid synthesis and the stress
          response together rather than choosing one.'
        cellular_components:
        - preferred_term: Golgi membrane
          term:
            id: GO:0000139
            label: Golgi membrane
      selected_evidence:
        snippet: The MBTPS2 gene on the X-chromosome encodes the membrane-bound transcription factor protease,
          site-2 (MBTPS2) or site-2 protease (S2P) which cleaves and activates several signaling and regulatory
          proteins from the membrane.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
