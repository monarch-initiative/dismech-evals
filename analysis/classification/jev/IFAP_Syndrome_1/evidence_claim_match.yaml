            term:
              id: MONDO:0100213
              label: IFAP syndrome 1, with or without BRESHECK syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Vascularising Keratopathy
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: PROVISIONAL
        description: 'The ocular phenotype, and the one that carries the morbidity. Photophobia is the
          symptom; the disease is a keratopathy that progresses through spontaneous epithelial defects,
          superficial and deep corneal vascularisation, and scarring to counting-fingers acuity.

          The most informative observation is developmental rather than static. An infant diagnosed at
          six days had clear corneas; the epithelial defects appeared at six months, and imaging then
          showed limbal thickening, peripheral pannus, conjunctivalisation and abnormal hyperreflective
          epithelium - the picture of limbal stem cell dysfunction. So the cornea is not malformed, it
          fails to maintain itself, which is a different therapeutic target.

          Graded PROVISIONAL: the limbal-failure account rests on one prospectively followed infant, and
          no histology or limbal-marker study has been published.'
        locations:
        - preferred_term: cornea
          term:
            id: UBERON:0000964
            label: cornea
        - preferred_term: corneal epithelium
          term:
            id: UBERON:0001772
            label: corneal epithelium
      selected_evidence:
        snippet: The progressive conjunctivalization, spontaneous epithelial defects, and anterior segment
          optical coherence tomography features are highly suggestive of limbal stem cell dysfunction
          in IFAP syndrome.
        supports: SUPPORT
