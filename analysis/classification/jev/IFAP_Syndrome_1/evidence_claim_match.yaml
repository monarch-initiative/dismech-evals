      assertion_type: Pathophysiology
      assertion:
        name: Hypomorphic MBTPS2 Variant
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'Missense variants exchanging highly conserved residues, and splice-site variants,
          in MBTPS2. The allelic spectrum is hypomorphic rather than null: every reported variant leaves
          some residual protease activity, and the amount left is what the phenotype tracks.

          That is not merely an observation about severity - it constrains what kind of variant can be
          pathogenic here. A curator or laboratory assessing a novel MBTPS2 variant should expect partial
          loss of function, and a variant predicted to abolish the protein entirely would be atypical
          for this entity rather than a confidently severe allele.'
        genes:
        - preferred_term: MBTPS2
          term:
            id: hgnc:15455
            label: MBTPS2
        molecular_functions:
        - preferred_term: site-2 protease intramembrane cleavage activity
          modifier: DECREASED
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
      selected_evidence:
        snippet: provide evidence that missense mutations exchanging highly conserved amino acids of membrane-bound
          transcription factor protease, site 2 (MBTPS2) are associated with this phenotype
        supports: SUPPORT
