    evidence_metadata:
      reference: PMID:19361614
      reference_title: IFAP syndrome is caused by deficiency in MBTPS2, an intramembrane zinc metalloprotease
        essential for cholesterol homeostasis and ER stress response.
      evidence_source: IN_VITRO
      explanation: 'Names both arms together as the affected system, which is the only published statement
        tying the ER-stress arm to the human phenotype - and it does so by naming the pair rather than
        by isolating this arm.

        Graded IN_VITRO despite the sentence being about phenotypic expression in patients, because the
        quantitative relationship it asserts is measured by the CHO M19 complementation assay; the clinical
        severity is the variable it is correlated against, not the evidence for the mechanism. Grading
        it HUMAN_CLINICAL would credit the ER-stress claim with human measurement that was never made
        - no ER stress has been measured in any IFAP patient tissue, which is the whole point of the discussion
        this node carries.'
