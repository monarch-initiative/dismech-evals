  f13789c2dd8c415a790beab49c7214a86b21878798b8561b961fafabdb27f0b5:
    claim:
      about:
        disease:
          name: IFAP Syndrome 1
          disease_term:
            preferred_term: IFAP syndrome
            term:
              id: MONDO:0100213
              label: IFAP syndrome 1, with or without BRESHECK syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ifap_atf6_arm_unattached_to_phenotype
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does loss of ATF6 signalling contribute anything to the IFAP phenotype, or is the disease
          explained by the SREBP arm alone?
        attaches_to:
        - pathophysiology#Impaired ATF6 Endoplasmic Reticulum Stress Response
        - pathophysiology#Impaired SREBP-Driven Lipid Synthesis
        rationale: 'Every account of this disease, including this entry''s own description, states that
          S2P loss impairs both cholesterol homeostasis and the ER stress response. The first half of
          that is measured and connected to phenotype. The second half is measured and connected to nothing.

          What exists for the ATF6 arm: a BRESHECK-associated variant fails to activate the ER stress
          response in vitro, and the gene-identification paper names "ability to cope with ER stress"
          alongside cholesterol homeostasis as the affected system. What does not exist: any clinical
          feature of IFAP attributed to ATF6 loss specifically, any tissue in which ER stress has been
          measured in a patient, and any account of why an ER-stress defect would fall on hair follicle
          and limbus rather than on the secretory tissues where the UPR matters most.

          So the two-arm mechanism is stated everywhere and load-bearing nowhere. Every phenotype curated
          in this entry could be produced by the SREBP arm alone. That is worth flagging rather than smoothing
          over, because a two-arm story that cannot be broken by any observation is not doing explanatory
          work.

          Two things pull in opposite directions, and both belong here.

          Arguing that the SREBP arm is sufficient: variants in SREBF1 - the gene for SREBP itself, one
          step downstream of this protease - cause a disease that shares a common clinical spectrum with
          IFAP. If losing the substrate alone reproduces much of the phenotype, the phenotype does not
          need the ATF6 arm. That is the strongest available argument for the SREBP arm carrying the disease,
          and it comes from human genetics rather than from a cell assay.

          Arguing against dismissing the ATF6 arm: in the one variant where both were tested, the SREBP
          pathway was *attenuated* while the ER stress response failed outright. If that pattern holds,
          the ATF6 arm is the more severely affected one, which makes its clinical silence more puzzling
          rather than less.

          The SREBF1 comparison also has a limit worth stating. SREBF1 disease is dominant and IFAP is
          X-linked recessive, and the SREBF1 phenotype includes mucosal involvement that IFAP does not
          - so the two are not the same phenotype with one mechanism subtracted, and the inference is
          suggestive rather than clean.'
        proposed_experiments:
        - experiment_id: exp_ifap_er_stress_in_patient_keratinocytes
          name: ER stress response in patient keratinocytes and limbal epithelial cells
          description: Derive keratinocytes and, where available, limbal epithelial cells from IFAP patients
            across the severity range, and measure ATF6 processing and downstream UPR target induction
            under tunicamycin or thapsigargin challenge alongside SREBP target induction in the same cells.
            This asks whether the two arms are impaired to different degrees in the tissues that actually
            express the phenotype, rather than in a hamster ovary line.
          would_support:
          - pathophysiology#Impaired ATF6 Endoplasmic Reticulum Stress Response
          supporting_outcome:
          - Patient keratinocytes show blunted ATF6 processing and UPR target induction, and the magnitude
            tracks cutaneous severity independently of the SREBP readout.
          would_refute:
          - pathophysiology#Impaired ATF6 Endoplasmic Reticulum Stress Response
          refuting_outcome:
          - ATF6 processing and UPR target induction are preserved in patient keratinocytes despite a
            measurable SREBP deficit, placing the whole phenotype on the SREBP arm.
        - experiment_id: ifap_srebf1_phenotype_subtraction
          name: Systematic phenotype comparison of MBTPS2 and SREBF1 disease
          description: Compare the feature-level phenotype of MBTPS2-related IFAP against SREBF1-related
            disease in matched cohorts, coded to HPO. Features present in both are candidates for the
            SREBP arm; features present only in MBTPS2 disease are where the ATF6 arm, or another S2P
            substrate, would have to act. This is a phenotype subtraction that needs no new laboratory
            work, only systematic coding of cases already published.
          would_support:
          - pathophysiology#Impaired ATF6 Endoplasmic Reticulum Stress Response
          supporting_outcome:
          - A reproducible set of MBTPS2-only features remains after subtracting the SREBF1 phenotype,
            giving the ATF6 arm something specific to explain.
          would_refute:
          - pathophysiology#Impaired ATF6 Endoplasmic Reticulum Stress Response
          refuting_outcome:
          - The MBTPS2 phenotype is contained within the SREBF1 phenotype, leaving no residual for a second
            substrate arm to account for.
      selected_evidence:
        snippet: Recently, variants in SREBF1, a gene coding for a transcription factor related to cholesterol
          and fatty acid synthesis, have been associated with the disease.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
