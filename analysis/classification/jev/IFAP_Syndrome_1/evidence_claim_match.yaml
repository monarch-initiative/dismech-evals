  91f1a5fb5f11413b03d0d02a31e0c0730709791cea65aa2e89973935a5ee048b:
    claim:
      about:
        disease:
          name: IFAP Syndrome 1
          disease_term:
            preferred_term: IFAP syndrome
            term:
              id: MONDO:0100213
              label: IFAP syndrome 1, with or without BRESHECK syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: SREBF1-related hereditary mucoepithelial dysplasia (IFAP syndrome 2)
        description: 'The differential that genetic testing actually resolves, and the one with the largest
          consequence for counselling: it is autosomal dominant, so the recurrence risk is entirely different
          from the X-linked recessive risk this entry carries.

          It is also the mechanistically interesting one. SREBF1 encodes SREBP - the substrate of the
          protease curated here, one step downstream. A dominant SREBF1 disease that shares this much
          of the clinical spectrum is evidence about which of the two S2P substrate arms carries the phenotype,
          and it is used as such in the ATF6 discussion below rather than left as a diagnostic footnote.

          Note the naming. MONDO carries this as MONDO:0100221 "IFAP syndrome 2", and the clinical literature
          calls it hereditary mucoepithelial dysplasia. They are the same concept approached from two
          directions; a search on one name alone will miss the other.'
        distinguishing_features:
        - Autosomal dominant, so an affected parent or a dominant pedigree argues for SREBF1 and against
          MBTPS2.
        - Mucosal involvement and perineal erythema are HMD features not typical of IFAP.
        - Alopecia is non-scarring in both, so it does not separate them; the mucosal findings and the
          inheritance pattern do.
      selected_evidence:
        snippet: Hereditary mucoepithelial dysplasia (HMD) is a dominantly inherited disease characterized
          by keratitis, non-scarring alopecia, skin lesions including follicular keratosis, perineal erythema,
          and mucosal involvement.
        supports: SUPPORT
