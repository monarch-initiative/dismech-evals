  03dfc2a69fb5ea3333982d205c22d53f10c526aa3eb9428bc062689233a8a39b:
    claim:
      about:
        disease:
          name: IFAP Syndrome 2
          disease_term:
            preferred_term: IFAP syndrome 2 (SREBF1-related)
            term:
              id: MONDO:0100221
              label: IFAP syndrome 2
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: IFAP syndrome 1 (MBTPS2-related, X-linked)
        description: 'The differential that only genetics resolves, and the one where getting it wrong
          changes the counselling completely: X-linked recessive rather than autosomal dominant.

          Mechanistically the two are one cascade broken at adjacent points. MBTPS2 encodes the site-2
          protease that makes the second cut of SREBP; SREBF1 encodes the substrate of the first cut.
          Losing either stops the same activation and produces the same triad, which is why the clinical
          picture does not separate them. What can point toward MBTPS2 is an X-linked pedigree, male predominance,
          or the additional CNS, skeletal and genital anomalies of the BRESHECK end of that spectrum.'
        disease_term:
          preferred_term: IFAP syndrome 1
          term:
            id: MONDO:0100213
            label: IFAP syndrome 1, with or without BRESHECK syndrome
        distinguishing_features:
        - X-linked inheritance with male predominance, versus autosomal dominant here.
        - Additional brain, skeletal, genital and renal anomalies in the BRESHECK-spectrum cases have
          no counterpart in SREBF1 disease.
        - Mucosal erythema, perineal intertrigo and gastrointestinal strictures point toward SREBF1.
        - Definitive separation is by sequencing, not by examination.
      selected_evidence:
        snippet: Previous research found that mutations in MBTPS2, encoding site-2-protease (S2P), underlie
          X-linked IFAP syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
