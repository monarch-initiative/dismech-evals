        context:
        - path: /pathophysiology/1
          value:
            name: Blocked Site-1 Proteolytic Activation of SREBP1
            biological_scale: MOLECULAR
            role: effector
            mechanism_confidence: ESTABLISHED
            description: 'SREBP1 is a membrane-tethered precursor that becomes a transcription factor
              only after two sequential cuts - site-1 protease in the Golgi lumen, then site-2 protease
              within the membrane - which release the active amino-terminal domain into the cytosol for
              import into the nucleus. With the site-1 recognition motif destroyed, the cascade stops
              at the first step and the active fragment is never generated.

              This is the node that makes IFAP syndrome 1 and 2 one disease mechanism approached from
              two directions: IFAP syndrome 1 removes the second protease, this removes the first cut''s
              substrate site, and both leave SREBP stranded on the membrane.'
            biological_processes:
            - preferred_term: SREBP signaling pathway
              modifier: DECREASED
              term:
                id: GO:0032933
                label: SREBP signaling pathway
            - preferred_term: proteolytic processing of SREBP1
              modifier: DECREASED
              term:
                id: GO:0016485
                label: protein processing
            cellular_components:
            - preferred_term: Golgi membrane
              term:
                id: GO:0000139
                label: Golgi membrane
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reduced Nuclear SREBP1 Transcriptional Output
        causal_link_type: DIRECT
        description: No cleaved fragment reaches the nucleus, so target-gene transcription falls.
      selected_evidence:
        snippet: As a result, SREBP1 variants exhibited significantly lower transcriptional activity compared
          to the wild-type, as demonstrated via luciferase reporter assay.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1/downstream/0
      evidence_path: /pathophysiology/1/downstream/0/evidence/0
      context_paths:
