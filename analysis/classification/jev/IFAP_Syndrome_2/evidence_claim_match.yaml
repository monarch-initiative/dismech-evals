        biological_scale: TISSUE
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'The meibomian gland secretes lipid of the wrong composition. Lipidomic analysis
          of meibum from an affected individual found it enriched in saturated wax esters, raising the
          saturated-to-unsaturated ratio to grossly abnormal levels.

          The consequence is physical rather than inflammatory, and that is the point: saturated wax esters
          melt at a higher temperature than unsaturated ones, so the secretion is thicker and expresses
          poorly at lid temperature. This is the step that turns a transcription-factor defect into an
          ocular surface disease, and it explains why photophobia in this disorder is not simply corneal
          irritation.'
        cell_types:
        - preferred_term: meibocyte
          term:
            id: CL:0000317
            label: sebocyte
        locations:
        - preferred_term: meibomian gland
          term:
            id: UBERON:0001818
            label: tarsal gland
        biological_processes:
