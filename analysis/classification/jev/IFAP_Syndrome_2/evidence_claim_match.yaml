          modifier: ABNORMAL
          term:
            id: GO:0008610
            label: lipid biosynthetic process
      selected_evidence:
        snippet: Our data showed that IFAP-2 meibum was enriched with SWE which increased the SWE/UWE
          ratio to highly abnormal levels.
        supports: SUPPORT
