  bc6657f1d1d2a17f9fb486c5b3419b433e91547898f917c075ba29de2547de6d:
    claim:
      about:
        disease:
          name: IFAP Syndrome 2
          disease_term:
            preferred_term: IFAP syndrome 2 (SREBF1-related)
            term:
              id: MONDO:0100221
              label: IFAP syndrome 2
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: SREBF1 gain-of-function hyperpigmentation-cataract disorder
        description: 'A distinct disorder caused by a different class of SREBF1 allele: a nonsense variant
          producing a truncated protein that localizes to the nucleus and is transcriptionally hyperactive,
          giving generalized hyperpigmentation with congenital cataracts. It is the reason a reported
          SREBF1 variant should never be interpreted as IFAP syndrome 2 without establishing its direction
          of effect.'
        distinguishing_features:
        - Generalized skin hyperpigmentation and xerosis rather than follicular ichthyosis and alopecia.
        - Congenital cataract is a presenting feature rather than a later complication.
        - The variant increases rather than decreases SREBP1 transcriptional activity.
      selected_evidence:
        snippet: We demonstrated that a gain-of-function variant of SREBF1 causes a previously undescribed
          disorder characterized by generalized skin hyperpigmentation and congenital cataracts.
        supports: SUPPORT
    origin:
