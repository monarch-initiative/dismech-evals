      assertion_type: Pathophysiology
      assertion:
        name: Failure of Follicular Keratinization
        biological_scale: TISSUE
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'The hair follicle and interfollicular epidermis cannot execute their keratinization
          programme. Two visible things follow: the infundibulum plugs with keratotic material, which
          is the spiny follicular papule seen clinically, and the shaft itself is structurally defective,
          with cuticle warping and detachment on scanning electron microscopy.

          The specificity is what makes this node informative rather than generic. It is the outer root
          sheath keratins that collapse, which is exactly the compartment whose failure would give a hair
          that forms and then breaks rather than a follicle that never forms.'
        biological_processes:
        - preferred_term: keratinization
          modifier: DECREASED
          term:
            id: GO:0031424
            label: keratinization
        - preferred_term: hair follicle development
          modifier: ABNORMAL
          term:
            id: GO:0001942
            label: hair follicle development
        cell_types:
        - preferred_term: outer root sheath cell
          term:
            id: CL:0002561
            label: outer root sheath cell
        locations:
        - preferred_term: hair follicle
          term:
            id: UBERON:0002073
            label: hair follicle
      selected_evidence:
        snippet: Together with previous research, the present findings suggest that SREBP signaling plays
          an essential role in epidermal differentiation, skin barrier formation, hair growth, and eye
          function.
        supports: SUPPORT
