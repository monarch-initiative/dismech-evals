              label: IFAP syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SREBF1 Cleavage-Site Variant
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'A heterozygous missense substitution or small in-frame deletion in SREBF1 affecting
          residues 527, 528 or 530 - the motif site-1 protease must recognise before it can cut SREBP1.

          The allelic spectrum is narrow and mechanistically legible: these are not scattered loss-of-function
          variants but a functional hotspot, and their common property is that they leave the protein
          intact while making it uncleavable. That has two consequences a curator should keep separate.
          The protein is still made, so this is not haploinsufficiency; and the uncleavable product is
          suspected of suppressing output from the normal allele, which is why the disease is dominant
          with a single hit rather than requiring both.'
        genes:
        - preferred_term: SREBF1
          term:
            id: hgnc:11289
            label: SREBF1
        genetic_context:
          gene:
            preferred_term: SREBF1
            term:
              id: hgnc:11289
              label: SREBF1
          allele_type: missense substitution or small in-frame deletion at the S1P recognition motif
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Variants at residues 527-530 abolish site-1 protease cleavage. Curated as loss
            of function because that is what the assays measure - reduced cleavage, blocked nuclear entry,
            reduced reporter activity. A dominant-negative component is plausible from the dominance of
            the trait and from residual activity well above zero in the reporter assay, but no experiment
            has separated a dominant-negative effect from simple haploinsufficiency of the pathway, so
            the stronger category is not asserted.
      selected_evidence:
        snippet: The three detected SREBF1 mutations caused substitution or deletion of residues 527,
          528, and 530, which are crucial for S1P cleavage.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
