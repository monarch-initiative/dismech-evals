            label: keratinocyte
      selected_evidence:
        snippet: RNA sequencing of the scalp skin from IFAP-affected individuals revealed a dramatic reduction
          in transcript levels of low-density lipoprotein receptor (LDLR) and of keratin genes known to
          be expressed in the outer root sheath of hair follicles.
        supports: SUPPORT
