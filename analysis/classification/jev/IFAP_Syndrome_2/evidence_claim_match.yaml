  54b05679828535171ba6425d24ab0e73dcd5ffd026d2fab1fad39f2a186df313:
    claim:
      about:
        disease:
          name: IFAP Syndrome 2
          disease_term:
            preferred_term: IFAP syndrome 2 (SREBF1-related)
            term:
              id: MONDO:0100221
              label: IFAP syndrome 2
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hereditary mucoepithelial dysplasia
        description: 'Historically a separate disorder, now understood to be caused by the same recurrent
          SREBF1 variant. It is retained as a differential rather than merged because MONDO still separates
          the two, and because the name remains in active clinical use - a curator or clinician searching
          only for IFAP will miss the ocular natural-history literature, which was published almost entirely
          under the HMD name.

          The substantive argument for lumping is recorded in this entry''s discussion section rather
          than settled here.'
        disease_term:
          preferred_term: hereditary mucoepithelial dysplasia
          term:
            id: MONDO:0008017
            label: hereditary mucoepithelial dysplasia
        distinguishing_features:
        - Same gene, same recurrent variant; the historical separation was clinical, not molecular.
        - Mucosal and perineal involvement was emphasized under the HMD name, the congenital cutaneous
          triad under the IFAP name.
        - A 2026 series applying ClinGen lumping-and-splitting criteria favours treating them as one condition.
      selected_evidence:
        snippet: Both are now known to be caused by the same NM_004176.5(SREBF1):c.1579C>T variant, but
          were previously described as separate disorders.
        supports: SUPPORT
