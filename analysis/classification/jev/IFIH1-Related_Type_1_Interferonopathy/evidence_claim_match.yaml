        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: IFIH1 (2q24.2) encodes MDA5, a RIG-I-like receptor that senses cytosolic double-stranded
          RNA and signals through MAVS to induce type I interferon. Heterozygous gain-of-function variants
          cause this disease. Common IFIH1 polymorphisms that modify autoimmune risk, and loss-of-function
          variants that predispose to viral infection, are different mechanisms and are not part of this
          entry. The variant is usually germline, but one AGS7 patient with lupus-like disease carried
          a somatic gain-of-function variant (PMID:40043752).
        variants:
        - name: NM_022168:c.2465G>A (p.Arg822Gln)
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: Recurrent Singleton-Merten allele.
        - name: NM_022168:c.2336G>A (p.Arg779His)
          type: MISSENSE
          description: Inherited by two brothers with spastic paraplegia from their asymptomatic father,
            who was mosaic.
      selected_evidence:
        snippet: We found that heterozygous mutations in the cytosolic double-stranded RNA receptor gene
          IFIH1 (also called MDA5) cause a spectrum of neuroimmunological features consistently associated
          with an enhanced interferon state.
        supports: SUPPORT
