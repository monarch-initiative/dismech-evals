              variants cause this disease. Common IFIH1 polymorphisms that modify autoimmune risk, and
              loss-of-function variants that predispose to viral infection, are different mechanisms and
              are not part of this entry. The variant is usually germline, but one AGS7 patient with lupus-like
              disease carried a somatic gain-of-function variant (PMID:40043752).
