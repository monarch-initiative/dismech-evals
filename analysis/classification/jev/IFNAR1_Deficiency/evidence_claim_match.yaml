  50066ef4ea77d699b56f49cc009bee841ab0c116c084c22a12a2ea2c7621735e:
    claim:
      about:
        disease:
          name: IFNAR1 Deficiency
          disease_term:
            preferred_term: IFNAR1 deficiency
            term:
              id: MONDO:0030970
              label: immunodeficiency 106, susceptibility to viral infections
        context: []
      assertion_type: Genetic
      assertion:
        name: IFNAR1
        association: Causal
        gene_term:
          preferred_term: IFNAR1
          term:
            id: hgnc:5432
            label: IFNAR1
        notes: 'Two distinct allele classes cause disease at this locus. Biallelic loss-of-function alleles
          cause autosomal recessive complete deficiency, including the Western Polynesian founder nonsense
          allele c.1156G>T (p.Glu386*). Separately, a set of in-frame alleles acts by negative dominance
          in heterozygotes and impairs responses to IFN-alpha and IFN-omega while sparing IFN-beta; one
          of these, P335del, is common in Southern China. IFNAR2 and the downstream JAK-STAT components
          are intact in both classes, so the defect is confined to type I interferon reception.

          Two further points about the allele spectrum matter diagnostically. Structural variants are
          a recurring route to biallelic loss: a large homozygous loss-of-function deletion and a multi-exon
          copy-number variant are both reported causal genotypes, so copy-number analysis belongs in the
          workflow rather than beside it. And not every complete deficiency removes the protein from the
          cell surface - a distinctive form is described in which a non-functional IFNAR1 is expressed
          at levels similar to wild type, which means a flow-cytometry surface-expression assay can look
          normal in a patient who has no signalling at all.'
      selected_evidence:
        snippet: All the patients are homozygous for the same nonsense IFNAR1 variant (p.Glu386*).
        supports: SUPPORT
