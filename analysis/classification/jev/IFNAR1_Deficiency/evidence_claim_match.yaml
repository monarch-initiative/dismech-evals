        context: []
      assertion_type: Diagnosis
      assertion:
        name: Whole-Blood IP-10 Induction Assay
        description: The functional confirmation, and the test that makes the diagnosis rather than merely
          suggesting it. Whole blood is stimulated with glycosylated IFN-alpha2, -beta or -omega and IP-10
          (the product of the interferon-stimulated gene CXCL10) is measured; IFN-gamma is run in parallel
          as the type II control. In inherited IFNAR1 deficiency IP-10 is induced only by IFN-gamma, so
          a defect confined to the type I arm is demonstrated directly rather than inferred. The same
          assay separates the inherited defect from its acquired phenocopy, because a patient with neutralising
          autoantibodies still responds to the type I interferons their antibodies do not neutralise.
        diagnosis_term:
          preferred_term: whole-blood IP-10 induction immunoassay
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: In patients with inherited IFNAR1, IFNAR2, TYK2, or IRF9 deficiency, IP-10 is induced
          only by IFN-γ, whereas, in those with auto-Abs neutralizing specific type I IFNs, IP-10 is also
          induced by the type I IFNs not neutralized by the auto-Abs.
        supports: SUPPORT
