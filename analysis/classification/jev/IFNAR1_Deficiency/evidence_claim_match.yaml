      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant (negative dominance)
        description: 'A separate, clinically distinct group of IFNAR1 alleles acts dominantly in the heterozygous
          state. The dominance is mediated by negative dominance rather than haploinsufficiency, and the
          resulting defect is partial and subtype-selective: responses to IFN-alpha and IFN-omega are
          impaired while responses to IFN-beta are preserved. This is recorded as a second inheritance
          mode rather than folded into the recessive entry, because both the mechanism and the severity
          differ.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Negative dominance, rather than haploinsufficiency, accounts for this dominance.
        supports: SUPPORT
