              term:
                id: GO:0051607
                label: defense response to virus
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Unrestricted Viral Replication in Permissive Cells
        causal_link_type: DIRECT
        description: With no interferon-induced restriction factors, permissive cells support viral replication
          that an interferon-competent host would contain.
      selected_evidence:
        snippet: Patient-derived fibroblasts are susceptible to viruses, including the YF and measles
          virus vaccine strains, in the absence or presence of exogenous type I IFN.
        supports: SUPPORT
