          form ternary complexes upon binding their respective ligands. This results in close proximity
          of the intracellularly associated kinases JAK1 and TYK2, which cross phosphorylate each other,
          the associated receptor chains, and signal transducer and activator of transcriptions, with
          the latter activating IFN-stimulated genes.
        supports: SUPPORT
