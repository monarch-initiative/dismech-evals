      assertion_type: Pathophysiology
      assertion:
        name: IFNAR1 Loss of Function
        description: Biallelic IFNAR1 variants abolish a functional low-affinity chain of the type I interferon
          receptor. Reported lesions include nonsense, frameshift and essential splice-site alleles that
          remove or truncate the protein, and the Western Polynesian founder nonsense allele c.1156G>T
          (p.Glu386*). Because IFNAR2 and the downstream JAK-STAT components are intact, the lesion is
          confined to assembly of a competent IFNAR1-IFNAR2 heterodimer.
        biological_scale: MOLECULAR
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The Iranian patient is homozygous and the Brazilian patient compound heterozygous for
          loss-of-function IFNAR1 variations.
        supports: SUPPORT
