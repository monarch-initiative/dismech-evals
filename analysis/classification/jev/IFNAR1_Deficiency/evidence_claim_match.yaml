        status: EMERGING
        description: Complete IFNAR1 deficiency abolishes the type I interferon response in vitro, yet
          the reported patients were healthy until a specific viral challenge and some have reached their
          fifth and sixth decades. The proposed explanation is that human type I interferons are largely
          redundant for protective immunity under everyday conditions, with other cell-intrinsic antiviral
          mechanisms compensating, and become indispensable only on systemic challenge with a replicating
          attenuated virus or a particularly virulent one. The competing reading - that ascertainment
          favours the catastrophic presentations while milder susceptibility goes unrecorded - is not
          excluded, and the estimated homozygote frequency in Samoa is high enough that undiagnosed individuals
          are expected. Which reading is right determines whether population screening of the founder
          allele identifies people at risk or mostly people who will never present.
      selected_evidence:
        snippet: Surprisingly, the patients concerned had managed to live to the age of 1–38 years without
          experiencing other unusually severe viral illnesses, and some are still alive at the age of
          45–55 years.
        supports: SUPPORT
