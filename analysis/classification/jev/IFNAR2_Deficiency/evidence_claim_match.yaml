            term:
              id: MONDO:0014727
              label: immunodeficiency 45
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IFNAR2 Loss of Function
        description: 'Biallelic IFNAR2 variants abolish a functional high-affinity chain of the type I
          interferon receptor. Two mechanisms are documented and converge on the same signalling null.
          Null alleles (frameshift, nonsense) remove the protein outright. The Arctic founder allele c.157T>C
          (p.Ser53Pro) instead permits translation but blocks trafficking: the substituted protein is
          retained intracellularly in an aberrantly glycosylated state and is absent from the cell surface,
          so no receptor is available to bind ligand. Because the second receptor chain IFNAR1 is intact,
          the lesion is specific to assembly of a competent IFNAR1-IFNAR2 heterodimer.'
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: two previously undescribed frameshift mutations in the interferon (IFN)α/β receptor 2
          (IFNAR2) gene
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
