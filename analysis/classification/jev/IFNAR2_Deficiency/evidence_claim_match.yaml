          viral vaccines - measles-mumps-rubella above all - are attenuated only relative to an interferon-competent
          host and cause disseminated, potentially fatal infection in IFNAR2 deficiency. This is the agents-and-circumstances-to-avoid
          consideration for this disease, and the reason case reports argue for genetic screening before
          immunisation in at-risk populations.
