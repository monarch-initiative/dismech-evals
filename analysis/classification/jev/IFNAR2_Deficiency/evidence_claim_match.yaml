            term:
              id: MONDO:0014727
              label: immunodeficiency 45
        context: []
      assertion_type: Genetic
      assertion:
        name: IFNAR2
        association: Causal
        gene_term:
          preferred_term: IFNAR2
          term:
            id: hgnc:5433
            label: IFNAR2
        notes: Biallelic loss-of-function IFNAR2 variants cause this autosomal recessive disease. Reported
          lesions include a homozygous mutation in the founder kindred (Duncan et al), two frameshift
          alleles in a compound heterozygote presenting with HLH (Passarelli et al), and the homozygous
          founder missense allele c.157T>C (p.Ser53Pro) in Inuit populations of Greenland, Canada and
          Alaska (Bastard et al). IFNAR1 and downstream JAK-STAT components are intact, so the defect
          is confined to type I interferon reception.
      selected_evidence:
        snippet: we identified a homozygous mutation in the high-affinity IFN-α/β receptor (IFNAR2) in
          the proband, as well as a newborn sibling, that rendered cells unresponsive to IFN-α/β
        supports: SUPPORT
