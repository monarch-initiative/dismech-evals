      assertion_type: Pathophysiology
      assertion:
        name: Natural Killer Cell Functional Dysregulation
        description: 'Beyond the antiviral state, type I interferon shapes NK cell behaviour: it normally
          augments degranulation and restrains IFN-gamma production. In IFNAR2-deficient NK cells stimulated
          with IFN-alpha, both responses fail. The loss of IFN-gamma restraint is the mechanistically
          interesting half, because unopposed IFN-gamma is the cytokine most closely tied to hemophagocytic
          lymphohistiocytosis - offering a route from a type I interferon receptor defect to a hyperinflammatory
          rather than merely infectious phenotype.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Natural killer cell
