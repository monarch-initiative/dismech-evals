        description: 'The discriminating test. Whole blood or PBMCs are stimulated ex vivo with IFN-alpha
          and STAT1/STAT2 phosphorylation read by flow cytometry; in IFNAR2 deficiency it is absent. Stimulating
          the same cells with IFN-gamma in parallel is what makes the test specific rather than merely
          abnormal: the type II response is intact, so a defect confined to the type I arm is demonstrated
          directly, separating IFNAR2 and STAT2 deficiency from STAT1 or JAK-level defects that impair
          both arms. The authors propose this as a rapid front-line assay when HLH follows a live attenuated
          vaccine.'
