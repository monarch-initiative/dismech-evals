      assertion_type: Biochemical
      assertion:
        name: Hemophagocytic lymphohistiocytosis laboratory signature
        notes: 'During an HLH episode the reported patient met the familiar HLH-2004 laboratory picture:
          marked hyperferritinemia, transaminitis, raised lactate dehydrogenase, hypertriglyceridemia
          and hypofibrinogenemia, with a progressive fall in blood counts. These are the markers that
          identify the hyperinflammatory episode; they are not markers of the underlying interferon receptor
          defect, which is why the diagnostic section rests on phospho-STAT signalling rather than on
          these values.'
        biomarker_term:
          preferred_term: Increased circulating ferritin concentration
          term:
            id: HP:0003281
            label: Increased circulating ferritin concentration
        readouts:
        - target: Hemophagocytosis
          relationship: READOUT_OF
          direction: POSITIVE
          interpretation: Marked hyperferritinemia is the headline laboratory abnormality of the HLH episode.
      selected_evidence:
        snippet: hyperferritinemia (4008 μg/L), elevation of liver enzymes (AST 360 U/L, ALT 550 U/L),
          lactate dehydrogenase (3155 U/L) and triglycerides (338 mg/dl), and hypofibrinogenemia (92.2
          mg/dl)
        supports: SUPPORT
