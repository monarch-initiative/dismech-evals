      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: narrow_phenotype_redundancy
        hypothesis_label: Type I interferon redundancy explains the narrow clinical phenotype
        status: EMERGING
        description: 'IFNAR2 deficiency abolishes type I interferon signalling completely in vitro, yet
          affected individuals are not broadly infection-prone: the index patient had no history of unusual
          susceptibility to respiratory viral pathogens before the fatal vaccine reaction. The proposed
          explanation is that human type I interferons are largely redundant for protective immunity under
          natural conditions, with other cell-intrinsic antiviral mechanisms compensating, and become
          indispensable only on systemic challenge with a replicating attenuated virus. The competing
          reading - that ascertainment favours the catastrophic presentations and milder susceptibility
          is simply unrecorded - is not excluded by the published cohorts, which remain very small. This
          distinction matters for whether population screening of the Arctic founder allele would identify
          people at risk or merely carriers.'
      selected_evidence:
        snippet: supports an essential but narrow role for IFN-α/β in human antiviral immunity
        supports: SUPPORT
    origin:
