      assertion:
        name: Molecular Genetic Confirmation and IFT140 Screening
        description: 'Molecular diagnosis is established by identifying biallelic IFT140 mutations. IFT140
          should be prioritized in skeletal ciliopathy-spectrum patients, especially JATD/MSS presentations
          with kidney disease with or without retinal involvement. A single pathogenic variant on panel
          or exome sequencing does not exclude the diagnosis: a recurrent exons 27-30 tandem duplication
          is missed by both, and was found only on genome sequencing in one patient and then by targeted
          screening for that duplication in a second. In a clinically convincing patient with one variant,
          look for the second by a method that can see a structural change.'
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Through a combination of ciliome resequencing and Sanger sequencing, we identified IFT140
          mutations in six MSS families and in a family with the clinically overlapping Jeune syndrome.
