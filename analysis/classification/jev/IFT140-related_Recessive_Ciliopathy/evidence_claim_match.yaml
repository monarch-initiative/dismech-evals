        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Renal Tubular Cystic and Fibrotic Disease
        conforms_to: ciliopathy_dysfunction#Renal Tubular Cystic and Fibrotic Disease
        description: 'Primary cilia on renal tubular epithelial cells sense luminal flow and maintain
          tubular architecture. IFT140 deficiency disrupts this ciliary signaling, driving a nephronophthisis-like
          tubulointerstitial process with cystic and fibrotic change that progresses to end-stage renal
          disease, typically within the first decade of life. The severity mirrors the cystic kidney phenotype
          of Ift140 conditional knockout mice and the high renal expression of IFT140.

          '
        cell_types:
        - preferred_term: Renal Tubular Epithelial Cell
          term:
            id: CL:1000507
            label: kidney tubule cell
        cellular_components:
        - preferred_term: Primary Cilium
          term:
            id: GO:0005929
            label: cilium
      selected_evidence:
        snippet: IFT140 patients presented with mild chest narrowing, but all had end-stage renal failure
          under 13 years of age and retinal dystrophy when examined for ocular dysfunction.
        supports: SUPPORT
    origin:
