        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ift140_biallelic_vs_monoallelic_adpkd
        kind: INTERPRETATION
        attaches_to:
        - disease#
        - genetic#IFT140 Biallelic Mutations
        prompt: How should this biallelic IFT140 ciliopathy be kept separate from the monoallelic IFT140
          cystic kidney phenotype?
        rationale: Monoallelic IFT140 loss of function causes a mild autosomal dominant polycystic kidney
          phenotype that is common enough to rank behind only PKD1 and PKD2 among cystic kidney disease
          probands. It shares a gene with this entry but is a different disease with different inheritance,
          severity and organ involvement, and the two are easy to conflate in a gene-first search. This
          entry is the biallelic recessive ciliopathy only. IFT140 also sits about 0.5 Mb from PKD1 at
          16p13.3, which is a recognised source of diagnostic confusion, and PKD1 variants may modify
          the IFT140 phenotype.
      selected_evidence:
        snippet: The distinctive monoallelic phenotype is mild PKD with large cysts, limited kidney insufficiency,
          and few liver cysts.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34890546
      reference_title: Monoallelic IFT140 pathogenic variants are an important cause of the autosomal
        dominant polycystic kidney-spectrum phenotype.
      evidence_source: HUMAN_CLINICAL
      explanation: Characterises the separate monoallelic phenotype that must not be merged into this
        entry.
