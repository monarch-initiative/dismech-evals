            term:
              id: MONDO:0100509
              label: IFT140-related recessive ciliopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IFT-A Retrograde Intraflagellar Transport Failure
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        description: 'Biallelic IFT140 mutations disrupt the intraflagellar transport complex A (IFT-A),
          which drives retrograde (tip-to-base) protein transport along the ciliary axoneme. Loss of IFT140
          function alters the ciliary abundance and localization of the transport machinery, impairing
          primary cilium assembly, maintenance, and signaling competence in ciliated cells. This molecular
          lesion is the shared upstream event from which the organ-specific renal, retinal, and skeletal
          phenotypes diverge.

          '
        genes:
        - preferred_term: IFT140
          term:
            id: hgnc:29077
            label: IFT140
        biological_processes:
        - preferred_term: Retrograde Intraflagellar Transport
          term:
            id: GO:0035721
            label: intraciliary retrograde transport
        - preferred_term: Intraflagellar Transport
          term:
            id: GO:0042073
            label: intraciliary transport
        - preferred_term: Cilium Assembly
          term:
            id: GO:0060271
            label: cilium assembly
        cellular_components:
        - preferred_term: Primary Cilium
          term:
            id: GO:0005929
            label: cilium
      selected_evidence:
        snippet: IFT140 is one of the six currently known components of the intraflagellar transport complex
          A (IFT-A) that regulates retrograde protein transport in ciliated cells.
        supports: SUPPORT
    origin:
