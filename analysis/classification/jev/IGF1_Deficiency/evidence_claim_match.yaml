      assertion_type: Pathophysiology
      assertion:
        name: IGF1 Loss of Function
        description: 'Biallelic pathogenic variants in IGF1 (deletions, frameshifts, or missense changes)
          abolish or severely reduce the amount or bioactivity of circulating insulin-like growth factor
          1. IGF-1 is produced predominantly by hepatocytes under growth hormone control and is the principal
          effector of the GH-IGF1 growth axis. Loss-of-function variants reduce immunoreactive and bioactive
          IGF-1, and some missense variants additionally impair the peptide''s ability to bind and activate
          its receptor.

          '
        gene:
          preferred_term: IGF1
          term:
            id: hgnc:5464
            label: IGF1
        molecular_functions:
        - preferred_term: growth factor activity
          term:
            id: GO:0008083
            label: growth factor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: Regulation of growth
          term:
            id: GO:0040008
            label: regulation of growth
          modifier: DECREASED
        cell_types:
        - preferred_term: Hepatocyte (principal IGF-1 source)
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: The mutant IGF1 protein had a significantly reduced activity on in vitro bioassays.
        supports: SUPPORT
