  78a893efefa1852a9163b9718def1a11923ef8927344e3e5aa9fb4651667aef3:
    claim:
      about:
        disease:
          name: IGF1 Deficiency
          disease_term:
            preferred_term: IGF1 deficiency
            term:
              id: MONDO:0012110
              label: growth delay due to insulin-like growth factor type 1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired IGF1R Growth Signaling
        description: 'IGF-1 normally binds and activates the type 1 IGF receptor (IGF1R), a receptor tyrosine
          kinase that drives somatic growth and neurodevelopment. In IGF1 deficiency, the loss of bioactive
          ligand reduces IGF1R autophosphorylation and downstream signal transduction. Missense IGF1 variants
          have been shown to hamper IGF1R interaction and reduce receptor phosphorylation, while frank
          loss-of-function alleles remove the ligand entirely.

          '
        biological_processes:
        - preferred_term: Insulin-like growth factor receptor signaling pathway
          term:
            id: GO:0048009
            label: insulin-like growth factor receptor signaling pathway
          modifier: DECREASED
        - preferred_term: Cell surface receptor tyrosine kinase signaling
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: IGF-1 plays a key role in pre- and postnatal growth and development in human.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23392101
      reference_title: 'Molecular IGF-1 and IGF-1 receptor defects: from genetics to clinical management.'
      evidence_source: HUMAN_CLINICAL
      explanation: Confirms the central role of IGF-1/IGF1R signaling in human pre- and postnatal growth,
        which is lost in IGF1 deficiency.
