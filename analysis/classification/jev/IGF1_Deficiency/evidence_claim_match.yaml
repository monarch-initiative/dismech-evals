  b32d82978fd17cee760516e89ced4ef3cfb60a8c84dace531d2ec40a49f3f1c8:
    claim:
      about:
        disease:
          name: IGF1 Deficiency
          disease_term:
            preferred_term: IGF1 deficiency
            term:
              id: MONDO:0012110
              label: growth delay due to insulin-like growth factor type 1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Somatic and Neural Growth
        description: 'Deficient IGF1R signaling during the fetal and postnatal period impairs cellular
          proliferation and tissue growth across multiple organ systems. Reduced growth signaling produces
          intrauterine and postnatal growth restriction, deficient brain growth (microcephaly and developmental
          delay), and abnormal cochlear development leading to sensorineural deafness. Mouse models with
          disruption of Igf1 or Igf1r recapitulate severe prenatal growth restriction, underscoring the
          essential growth-promoting role of this axis.

          '
        biological_processes:
        - preferred_term: Regulation of growth
          term:
            id: GO:0040008
            label: regulation of growth
          modifier: DECREASED
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: The clinical features of bi-allelic IGF1 defects are well established, i.e., severe growth
          failure and microcephaly, delayed psychomotor development, and sensorineural deafness.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
