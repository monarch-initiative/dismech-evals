        context: []
      assertion_type: Inheritance
      assertion:
        name: Heterozygous duplication with suspected maternal gonadal mosaicism
        description: The identical tandem duplication occurred in two maternal half-siblings with different
          fathers. It was not detected in the healthy mother's blood. The authors inferred likely gonadal
          mosaicism; maternal germ cells were not directly tested, so this is not a demonstrated mosaicism
          measurement.
      selected_evidence:
        snippet: A fetus from a second pregnancy of the mother by a different spouse showed similar craniofacial
          and limb malformations and the same duplication of the IHH-locus.
        supports: SUPPORT
