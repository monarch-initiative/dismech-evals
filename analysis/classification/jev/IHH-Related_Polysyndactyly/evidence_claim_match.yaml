  f0aa27bccd77a2b672efb5fea220430b112e6b6d5f67029b29180009208a6ed0:
    claim:
      about:
        disease:
          name: IHH-Related Polysyndactyly
          disease_term:
            preferred_term: IHH locus duplication-associated polysyndactyly
            description: Descriptive locus-defined scope; no exact MONDO binding has been established
              for this large duplication-associated family.
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Large Tandem Duplication Encompassing IHH and Adjacent Regulatory Sequence
        role: trigger
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: IHH
            term:
              id: hgnc:5956
              label: IHH
          variant_type: duplication
          genomic_contexts:
          - coding sequence
          - intergenic region
          variant_origin: GERMLINE
          description: The human K1549/K1552 allele is a 913663 bp tandem duplication at hg18 chr2:219583780-220497443.
            It contains IHH and 29 additional genes or partial genes, with the proximal breakpoint in
            CCDC108, as reported in 2012.
        description: The physical lesion increases copy number of IHH and neighboring sequence and rearranges
          their relationship to the adjacent EPHA4 regulatory domain. The limb mechanism involves a candidate
          regulatory position effect in addition to coding overlap. Contributions of other duplicated
          genes to the broader craniofacial and neurodevelopmental phenotype remain unresolved.
      selected_evidence:
        snippet: We defined the exact breakpoints and showed that the duplications are identical tandem
          duplications in both sibs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22234151
      reference_title: A large duplication involving the IHH locus mimics acrocallosal syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Long-range PCR and Sanger sequencing in the primary full text resolve the shared human
        allele to 913663 bp and the stated hg18 breakpoints. The abstract establishes that the two siblings
        have the same tandem allele.
