        description: Ectopic spatial and temporal IHH expression is the proposed consequence of enhancer
          adoption in the human duplication. In the doublefoot mouse deletion model, Ihh appears in distal
          limb mesenchyme at E10.5, before its normal limb expression, and at E11.5 resembles the Epha4
          expression domain. The human duplication was not recreated in this experiment. IHH transcript
          was undetectable in the adult human fibroblasts used for chromatin-contact assays, so those
          assays do not establish ectopic transcription in human embryonic digits. GOE is therefore provisional
          for this human allele despite direct ectopic-expression evidence in the model.
        gene:
          preferred_term: IHH
          term:
            id: hgnc:5956
            label: IHH
        biological_processes:
        - preferred_term: gene expression
          term:
            id: GO:0010467
            label: gene expression
          modifier: INCREASED
      selected_evidence:
        snippet: the onset of ectopic Indian hedgehog (Ihh) expression in the entire distal mesenchyme,
          except for the zone of polarising activity (ZPA), at E10.5
        supports: SUPPORT
        directness: INDIRECT
