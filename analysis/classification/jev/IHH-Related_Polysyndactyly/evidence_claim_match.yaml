        description: 'Identical tandem duplication in maternal half-siblings K1549 and K1552, resolved
          by long-range PCR and Sanger sequencing to hg18 chr2:219583780-220497443, with a reported size
          of 913663 bp. The interval includes IHH and 29 additional genes or partial genes; the proximal
          junction is within CCDC108 exon 25. This family was subsequently studied as the polydactyly
          family P1 in Lupiáñez et al. (2015).

          POSTRE Table 1 Nr5 and Supplementary Data 3 cite that later study but report hg19 chr2:219907598-220954793.
          Those secondary bounds differ from the resolved primary interval and are not treated here as
          an exact synonym or a separate clinical allele. The primary hg18 coordinates remain the defining
          representation pending reconciliation.

          Patient-fibroblast 4C-seq supports altered IHH regulatory contacts. Ectopic limb expression
          and altered GLI3 processing are demonstrated in the Dbf mouse deletion, not directly in this
          human duplication, so the proposed GOE is qualified in the pathophysiology chain.'
        functional_effects:
        - function: Altered IHH regulatory contacts
          type: Regulatory structural rearrangement
          regulatory_element_type: TAD_BOUNDARY
          regulatory_mechanism: Repositioning of a duplicated boundary and adjacent regulatory domains
          description: The human duplication permits ectopic contacts with centromeric EPHA4 regulatory
            sequence. The proposed configuration is a newly organized domain rather than physical boundary
            deletion; the two duplicated copies were not resolved individually by 4C-seq.
        - function: Proposed gain of ectopic IHH expression
          type: Candidate regulatory expression consequence
          regulatory_element_type: ENHANCER
          affected_developmental_stage: Embryonic limb patterning; mouse evidence at E10.5-E11.5
          regulatory_mechanism: Proposed adoption of EPHA4 limb enhancers
          description: Spatially and temporally ectopic expression is directly demonstrated in the Dbf
            mouse deletion model. The corresponding expression effect remains provisional for the human
            tandem duplication; fibroblast chromatin contacts alone are not an expression assay.
