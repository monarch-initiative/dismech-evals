        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ikbkg_cohort_ascertainment
        kind: INTERPRETATION
        status: OPEN
        prompt: How should frequencies from compilations and transplant cohorts be interpreted?
        rationale: Hanson combines reported patients with uneven testing and clinical ascertainment; denominators
          differ by feature. Its pneumococcal response text gives 72% for 13/16 whereas the table gives
          81%, so no categorical frequency is inferred from that inconsistency. Miot is a severe HSCT-selected
          series with overlapping published cases, not an independent population sample. Pre-HSCT findings
          are separated from conditioning toxicity and post-HSCT complications; inconsistent patient IDs
          for vascular events preclude precise reassignment. Picard 2011 reports pyogenic bacterial infection
          in about 90%, mycobacterial infection in about 40%, serious viral infection in 19%, and aggregate
          ectodermal dysplasia in about 90% of the NEMO-deficient patients described at that time. These
          quantitative observations are retained here rather than discarded. The review describes up to
          100 reported males and bases its NEMO infection tables on Hanson 2008 plus unpublished data,
          so it is not an independent population series. More importantly, its infection-occurrence estimates
          do not measure the narrower recurrent-infection phenotypes; the 19% viral composite includes
          HSV encephalitis, adenoviral gastroenteritis and CMV and is not a CMV-specific frequency. The
          approximately 90% ectodermal-dysplasia figure is not a frequency for each individual hair, dental
          or sweating abnormality. Although the numerical estimates fall within repository frequency bands,
          those bands would describe different endpoints from the phenotype entries. No categorical frequencies
          are transferred on that basis; observational study design alone is not the reason for declining
          them. These are NEMO-specific figures, not the separate IκBα cases.
        attaches_to:
        - phenotypes#Hypogammaglobulinemia
        - phenotypes#Impaired specific antibody response
        - phenotypes#Recurrent infections
        - phenotypes#Recurrent mycobacterial infections
        - phenotypes#Severe cytomegalovirus infection
        - has_subtypes#EDA-ID
      selected_evidence:
        snippet: Hypogammaglobulinemia occurred in 24/41 (59%), but correlated with impaired CD40 signaling
          only in Zinc Finger mutations.
        supports: SUPPORT
