      reference: PMID:16818673
      reference_title: X-linked susceptibility to mycobacteria is caused by mutations in NEMO impairing
        CD40-dependent IL-12 production.
      evidence_source: IN_VITRO
      explanation: Patient coculture experiments localize the defect to monocyte-dependent IL-12 production
        and secondary IFN-gamma output.
