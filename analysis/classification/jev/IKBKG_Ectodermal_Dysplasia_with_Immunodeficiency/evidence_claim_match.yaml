      assertion_type: Discussion
      assertion:
        discussion_id: ikbkg_variant_and_assay_scope
        kind: INTERPRETATION
        status: OPEN
        prompt: Which immune defects are shared and which depend on variant and assay?
        rationale: Patient-cell assays must retain their stimulus and genotype. C417 B-cell switching
          defects do not apply to E315A/R319Q B cells; c-Rel activation in the latter is delayed, not
          absent at every time point. The c.268delG family had no NF-kappaB functional assay, so the sequence
          alone does not demonstrate residual signaling. Normal lymphocyte counts or one normal response
          do not exclude immunodeficiency. Raw cytokine, proliferation and NK cytotoxicity assays are
          functional evidence, not extra causal clinical nodes.
        attaches_to:
        - pathophysiology#Impaired innate immune receptor responses
        - pathophysiology#Impaired CD40-dependent B-cell maturation
        - pathophysiology#Impaired CD40-dependent IL-12 and IFN-gamma cooperation
      selected_evidence:
        snippet: However, the CD40-dependent up-regulation of costimulatory molecules of dendritic cells
          and the proliferation and immunoglobulin class switch of B cells were normal.
        supports: SUPPORT
