        prompt: What is known about female manifestations and counseling?
        rationale: Female carriers are not uniformly asymptomatic or protected by skewed X-inactivation.
          Mild ectodermal findings, IP and immune or inflammatory manifestations occur. The recent adult
          female case developed infections after anti-TNF treatment, so it cannot establish that every
          infection or inflammatory comorbidity was caused solely by NEMO deficiency. Counseling should
          separate variant transmission from variable expression and should not apply classic-IP male
          lethality to all hypomorphic alleles.
        attaches_to:
        - inheritance#X-linked recessive inheritance (EDA-ID)
      selected_evidence:
        snippet: P6’s mother had recurrent bacterial infections.
        supports: SUPPORT
