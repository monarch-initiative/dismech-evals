      assertion_type: Pathophysiology
      assertion:
        name: Impaired CD40-dependent IL-12 and IFN-gamma cooperation
        description: E315A/R319Q variants impair CD40-triggered cytokine production by monocytes and dendritic
          cells. Delayed c-Rel nuclear accumulation and reduced IL-12 lead to reduced T-cell IFN-gamma
          secretion. This is an antigen-presenting-cell defect, not an intrinsic IFN-gamma defect in the
          T cell; responses to live BCG and several other stimuli can remain intact.
      selected_evidence:
        snippet: However, the patients' monocytes presented an intrinsic defect in T cell-dependent IL-12
          production, resulting in defective IFN-gamma secretion by T cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
