          route; the Jurkat L153R apoptosis/A20 phenotype is not direct proof for each manifestation.
          Frontal bossing, prenatal growth restriction, developmental delay, intracranial calcification
          and delayed cord separation likewise have uncertain patient-specific attribution. These gaps
          concern causal attribution, not mere absence of a drawn intermediary. The supported epithelial,
          appendage, humoral and infection-consequence routes are already represented. The low-IgM, high-IgA
          and low-T-cell findings are laboratory observations, not clinical functional-assay readouts.
