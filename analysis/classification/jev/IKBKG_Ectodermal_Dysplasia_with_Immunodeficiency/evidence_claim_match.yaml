          leave low-IgM pathophysiology unresolved and discuss CD40-independent IgA as a hypothesis. Reduced
          T-cell counts in one c.268delG patient are not localized to a demonstrated survival or developmental
          defect. Dry skin, ichthyosis, pigment changes, autoimmune cytopenias, thyroiditis, arthritis
