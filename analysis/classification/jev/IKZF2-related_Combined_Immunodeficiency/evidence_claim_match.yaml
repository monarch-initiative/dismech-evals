      assertion_type: Genetic
      assertion:
        name: IKZF2
        gene_term:
          preferred_term: IKZF2
          term:
            id: hgnc:13177
            label: IKZF2
        association: Germline loss-of-function variants (monoallelic or biallelic) cause HELIOS deficiency;
          de novo dominant negative DNA-binding-domain variants cause ICHAD syndrome.
        variant_origin: GERMLINE
        gene_disease_validity:
        - validity_classification: MODERATE
          classified_by: CLINGEN
          external_id: CGGV:assertion_3c007dec-2ef6-49a6-ba07-5f495c7794ae-2025-03-11T180000.000Z
          subtype: HELIOS deficiency
          notes: ClinGen classified IKZF2 for HELIOS deficiency (MONDO:0800139), the HELIOS deficiency
            subtype of this entry, with semidominant mode of inheritance.
        notes: 'relationship_type is left unset: the gene defines the disease, but ClinGen rates the IKZF2-HELIOS
          deficiency relationship Moderate, below the Definitive or Strong level the CAUSATIVE value is
          defined to mean.'
        variants:
        - name: p.Tyr200Ter
          description: Heterozygous truncating variant in the original Finnish pedigree. It abolishes
            heterodimerization with Ikaros and Aiolos and binding to Mi-2/NuRD; the truncated protein
            was not detected in patient cells.
        - name: p.Arg291Ter
          description: Heterozygous nonsense variant (NM_016260.3 c.871C>T) in the index patient with
            SLE, inherited from an asymptomatic father. The variant protein cannot homodimerize and does
            not bind DNA as a dimer.
        - name: Blood Advances missense variants
          description: Four heterozygous missense variants (p.Arg106Trp, p.Asn220Ser, p.Val347Met, p.Tyr359Cys)
            in five patients from four families with SLE or EBV-associated HLH. R106W and N220S, with
            R291X, reduced interaction with NuRD core components; Y359C and V347M appeared functionally
            neutral in the assays used.
        - name: p.Ile325Val
          description: Homozygous missense variant in the recessive patient. The protein keeps DNA binding
            and dimerization but loses interaction with several partners including epigenetic remodelers;
            CRISPR correction of the variant in patient T cells restored IL-2 production.
      selected_evidence:
        snippet: In summary, we show that this previously undescribed loss-of-function variant in Helios
          leads to an immunodeficiency with signs of immune overactivation.
        supports: SUPPORT
