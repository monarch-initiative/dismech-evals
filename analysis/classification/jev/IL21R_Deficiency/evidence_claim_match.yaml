      assertion_type: DifferentialDiagnosis
      assertion:
        name: IL2RG deficiency with preserved IL-2/IL-7 signalling
        description: 'The differential that matters most, because it can present identically. Two brothers
          with an IL2RG frameshift rescued by alternative splicing had chronic cryptosporidiosis and cholangitis
          with selectively impaired IL-4 and IL-21 signalling. Since IL-21R signals through the common
          gamma chain, a gamma chain lesion that spares IL-2 and IL-7 phenocopies IL-21R deficiency, and
          only sequencing separates them.

          '
      selected_evidence:
        snippet: Thus, our study shows that IL2RG deficiency can be associated with differential signaling
          defects.
