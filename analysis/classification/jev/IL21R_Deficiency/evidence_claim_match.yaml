            term:
              id: MONDO:0014082
              label: cryptosporidiosis-chronic cholangitis-liver disease syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: IL21R
        notes: 'IL21R (16p12.1) encodes the alpha chain of the IL-21 receptor, which pairs with the common
          gamma chain to signal through JAK1/JAK3 to STAT1, STAT3 and STAT5. Reported disease alleles
          include missense (p.Arg201Leu), in-frame deletion (p.C81_H82del) and frameshift (p.Ser45fs)
          changes; eight unique mutations were catalogued across the thirteen-patient cohort. The p.Arg201Leu
          allele is the mechanistically informative one because it is expressed but mistrafficked, showing
          the lesion is receptor function rather than transcript absence.

          '
        gene_term:
          preferred_term: IL21R
          term:
            id: hgnc:6006
            label: IL21R
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Eight unique mutations in IL21R were identified in these patients, including two novel
          mutations.
        supports: SUPPORT
