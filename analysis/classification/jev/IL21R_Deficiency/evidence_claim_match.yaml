            term:
              id: MONDO:0014082
              label: cryptosporidiosis-chronic cholangitis-liver disease syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant IL-21 Receptor Trafficking and Loss of Ligand Binding
        biological_scale: MOLECULAR
        description: 'The characterised missense allele does not abolish the protein; it misroutes it.
          IL-21R fails to traffic correctly to the plasma membrane and cannot bind IL-21. This distinction
          matters because it makes the disease a receptor functional failure rather than a null, and it
          is why the receptor may be detectable by flow cytometry in a patient who nonetheless has no
          IL-21 signalling.

          '
        gene:
          preferred_term: IL21R
          term:
            id: hgnc:6006
            label: IL21R
        biological_processes:
        - preferred_term: protein transport
          modifier: DECREASED
          term:
            id: GO:0015031
            label: protein transport
      selected_evidence:
        snippet: The IL-21R(Arg201Leu) mutation causes aberrant trafficking of the IL-21R to the plasma
          membrane, abrogates IL-21 ligand binding, and leads to defective phosphorylation of signal transducer
          and activator of transcription 1 (STAT1), STAT3, and STAT5.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
