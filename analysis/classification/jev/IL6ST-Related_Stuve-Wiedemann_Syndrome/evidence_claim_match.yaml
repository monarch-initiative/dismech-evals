              label: Stuve-Wiedemann syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic IL6ST Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic essential loss-of-function IL6ST alleles — nonsense (c.841C>T, p.Arg281*),
          an intronic splice variant causing exon 13 skipping (c.1699+4A>G), and a further truncating
          allele (p.Ser375*) — abolish functional cell-surface GP130. The truncating alleles lie in the
          extracellular domains, so the predicted products are soluble rather than membrane-anchored receptor
          fragments; the exon-13 skipping allele instead misfolds the membrane-proximal D6 domain, which
          is where the receptor transmits signal across the membrane.
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          allelic_hit_role: BIALLELIC_INACTIVATION
          zygosity: HOMOZYGOUS
          description: Homozygous germline null alleles of IL6ST (nonsense or essential splice). No compound-heterozygous
            STWS2 genotype has been reported; every published case arose in a consanguineous or homozygous-by-descent
            setting.
        genes:
        - preferred_term: IL6ST
          term:
            id: hgnc:6021
            label: IL6ST
        molecular_functions:
        - preferred_term: cytokine receptor activity
          term:
            id: GO:0004896
            label: cytokine receptor activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We identified essential loss-of-function variants in IL6ST (a homozygous nonsense variant
          and a homozygous intronic splice variant with exon skipping).
        supports: SUPPORT
