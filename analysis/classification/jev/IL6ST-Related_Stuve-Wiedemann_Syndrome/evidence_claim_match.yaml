        notes: IL6ST encodes GP130. Biallelic essential loss-of-function alleles cause STWS2. The published
          STWS2 alleles are c.841C>T (p.Arg281*), the essential splice variant c.1699+4A>G causing exon
          13 skipping, and p.Ser375*. Note that a different substitution at the same codon as the nonsense
          allele, p.Arg281Gln, causes an IL-11-selective craniosynostosis phenotype rather than STWS2
          — the residue is not what matters, the completeness of the loss is.
      selected_evidence:
        snippet: We identified essential loss-of-function variants in IL6ST (a homozygous nonsense variant
