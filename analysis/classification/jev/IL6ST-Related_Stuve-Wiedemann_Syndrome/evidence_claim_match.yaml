          value:
            target: Pan-IL-6-Family GP130 Signaling Failure
            relationship: RESCUES
            fidelity: HIGH
            description: Restoring GP130 in the patient's own cells reverses the signaling defect, establishing
              that the loss of IL-6-family responses follows from the IL6ST genotype rather than from
              a co-segregating variant or a culture artifact.
            limitations: A cellular rescue only. It says nothing about whether restoring GP130 in a developing
              skeleton or autonomic nervous system would rescue the disease phenotype, and the disorder
              is prenatal and multi-organ — a gap recorded separately as discussions#stws2_gp130_reconstitution_delivery_gap.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Cellular response to GP130-dependent cytokines
        target: Pan-IL-6-Family GP130 Signaling Failure
        direction: RESTORED
        interpretation: The signaling defect measured across IL-6, IL-11, IL-27, OSM and LIF is reversed
          when GP130 is restored.
      selected_evidence:
