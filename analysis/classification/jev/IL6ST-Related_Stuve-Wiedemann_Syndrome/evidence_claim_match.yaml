        discussion_id: stws2_gp130_reconstitution_delivery_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        prompt: Is there any tractable therapeutic strategy for complete GP130 loss, given that hematopoietic-restricted
          correction cannot reach the skeletal and autonomic compartments?
        rationale: Lentiviral reconstitution of GP130 rescues signaling in patient-derived cells, so the
          defect is correctable in principle. But the disorder is prenatal and multi-organ, and allogeneic
          bone marrow transplantation — the approach borrowed from STAT3 hyper-IgE — corrects only the
          hematopoietic compartment. Whether any delivery route could reach chondrocytes and autonomic
          neurons early enough is unaddressed in the literature.
      selected_evidence:
        snippet: this will not be effective in treating the multi-organ manifestations of severe Stüve-Wiedemann
          syndrome.
        supports: SUPPORT
