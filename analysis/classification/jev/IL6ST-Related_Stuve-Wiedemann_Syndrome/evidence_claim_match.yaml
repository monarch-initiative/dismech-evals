            term:
              id: MONDO:0030756
              label: Stuve-Wiedemann syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pan-IL-6-Family GP130 Signaling Failure
        biological_scale: CELLULAR
        description: 'GP130 is the shared transducer of the whole IL-6 cytokine family, so its complete
          loss silences every member at once — IL-6, IL-11, IL-27, oncostatin M and LIF have all been
          shown unresponsive in patient cells. This is the node that separates STWS2 from STWS1: LIFR
          loss removes only the LIF-receiving chain, leaving IL-6, IL-11 and IL-27 signaling intact. It
          also separates STWS2 from the IL6ST hyper-IgE and craniosynostosis phenotypes, which are cytokine-selective
          defects that spare LIF. Lentiviral reconstitution of GP130 in patient cells restores signaling,
          which is the strongest available evidence that the failure is the direct consequence of the
          genotype.'
        biological_processes:
        - preferred_term: interleukin-6-mediated signaling pathway
          term:
            id: GO:0070102
            label: interleukin-6-mediated signaling pathway
          modifier: LOSS_OF_FUNCTION
        - preferred_term: interleukin-11-mediated signaling pathway
          term:
            id: GO:0038154
            label: interleukin-11-mediated signaling pathway
          modifier: LOSS_OF_FUNCTION
        - preferred_term: interleukin-27-mediated signaling pathway
          term:
            id: GO:0070106
            label: interleukin-27-mediated signaling pathway
          modifier: LOSS_OF_FUNCTION
        - preferred_term: oncostatin-M-mediated signaling pathway
          term:
            id: GO:0038165
            label: oncostatin-M-mediated signaling pathway
          modifier: LOSS_OF_FUNCTION
        - preferred_term: leukemia inhibitory factor signaling pathway
          term:
            id: GO:0048861
            label: leukemia inhibitory factor signaling pathway
          modifier: LOSS_OF_FUNCTION
        - preferred_term: JAK-STAT cascade
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
          modifier: DECREASED
      selected_evidence:
        snippet: Functional tests showed absent cellular responses to GP130-dependent cytokines including
          IL-6, IL-11, IL-27, oncostatin M (OSM), and leukemia inhibitory factor (LIF).
        supports: SUPPORT
    origin:
