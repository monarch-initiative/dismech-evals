      assertion_type: Pathophysiology
      assertion:
        name: Pan-IL-6-Family GP130 Signaling Failure
        biological_scale: CELLULAR
        description: 'GP130 is the shared transducer of the whole IL-6 cytokine family, so its complete
          loss silences every member at once — IL-6, IL-11, IL-27, oncostatin M and LIF have all been
          shown unresponsive in patient cells. This is the node that separates STWS2 from STWS1: LIFR
          loss removes only the LIF-receiving chain, leaving IL-6, IL-11 and IL-27 signaling intact. It
          also separates STWS2 from the IL6ST hyper-IgE and craniosynostosis phenotypes, which are cytokine-selective
          defects that spare LIF. Lentiviral reconstitution of GP130 in patient cells restores signaling,
          which is the strongest available evidence that the failure is the direct consequence of the
          genotype.'
