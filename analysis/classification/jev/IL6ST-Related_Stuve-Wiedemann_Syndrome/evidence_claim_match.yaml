      assertion_type: Discussion
      assertion:
        discussion_id: stws2_lif_versus_pan_family_skeletal_attribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Failed LIF-Dependent Skeletal Development
        prompt: Is the bent-bone phenotype of STWS2 driven by loss of LIF signaling alone, or do the concurrently
          lost IL-6, IL-11, IL-27 and OSM arms contribute to the skeletal phenotype in a way that the
          LIFR-null comparison cannot detect?
        rationale: 'The attribution of the skeletal arm to LIF rests entirely on a phenotype comparison:
          STWS1 loses only LIF-family input and looks the same. That is an argument from similarity across
          two tiny case series, and it cannot exclude a contribution from IL-11, which has an established
          role in bone. Distinguishing them matters because it decides whether a signaling-restoration
          strategy would need to restore GP130 or could target the LIF axis alone. No IL6ST-null animal
          model of the skeletal phenotype has been reported alongside a LIFR-null comparison in the same
          study.'
      selected_evidence:
        snippet: Similarities of patients with loss of LIFR signaling and patients that had complete absence
          of GP130 suggest that LIF is essential during embryonic development.
        supports: SUPPORT
