        context: []
      assertion_type: Genetic
      assertion:
        name: CDKN1C
        gene_term:
          preferred_term: CDKN1C
          term:
            id: hgnc:1786
            label: CDKN1C
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: CDKN1C (11p15.4) encodes p57KIP2, a cyclin-dependent kinase inhibitor. IMAGe-associated
          variants are missense and cluster in the PCNA-binding domain - p.Ile272Ser, p.Asp274Asn and
          p.Phe276Val among them - and act by gain of function. Variants elsewhere in the gene cause Beckwith-Wiedemann
          syndrome by loss of function, so the domain, not merely the gene, is what identifies IMAGe.
      selected_evidence:
        snippet: We identified a novel heterozygous mutation, c.815T>G (p.Ile272Ser), in the CDKN1C gene
          in three siblings manifesting clinical symptoms associated with IMAGe syndrome and their mother
          (unaffected carrier).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24098681
      reference_title: Increased protein stability of CDKN1C causes a gain-of-function phenotype in patients
        with IMAGe syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: An independent family confirming both the variant class and the unaffected female carrier
        state expected under imprinting.
