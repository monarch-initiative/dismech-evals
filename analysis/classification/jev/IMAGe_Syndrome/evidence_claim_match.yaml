      assertion_type: Pathophysiology
      assertion:
        name: Stabilized p57KIP2 Protein
        biological_scale: MOLECULAR
        description: 'Wild-type p57KIP2 is short-lived and turned over by the proteasome. IMAGe-associated
          mutant proteins remain stable in the presence of cycloheximide, so the variant acts by escaping
          degradation. This is the step that resolves an apparent paradox: loss of PCNA binding alone
          does not explain undergrowth, but accumulation of a cell-cycle inhibitor does.'
        molecular_functions:
        - preferred_term: cyclin-dependent protein serine/threonine kinase inhibitor activity
          term:
            id: GO:0004861
            label: cyclin-dependent protein serine/threonine kinase inhibitor activity
          modifier: GAIN_OF_FUNCTION
        biological_processes:
        - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: the IMAGe-associated mutant CDKN1C proteins were fairly stable even in the presence of
          cycloheximide, whereas the wild-type protein was almost completely degraded via the proteasome
          pathway
        supports: SUPPORT
