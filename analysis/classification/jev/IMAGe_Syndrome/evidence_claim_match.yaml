      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing of CDKN1C
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        presence: Heterozygous CDKN1C pathogenic variant in the PCNA-binding domain of the maternally
          expressed allele
        description: Two constraints make this test more specific than "a CDKN1C variant". The variant
          must fall in the PCNA-binding domain - variants elsewhere in the gene cause Beckwith-Wiedemann
          syndrome, the overgrowth disorder, rather than IMAGe - and it must be on the maternally inherited
          allele, because CDKN1C is imprinted and the paternal copy is silent. A father can therefore
          carry the variant and be unaffected while transmitting it to affected children, so parental
          testing with determination of parent of origin is part of the diagnosis rather than an addendum
          to it.
      selected_evidence:
        snippet: The diagnosis of IMAGe syndrome is established in a proband with suggestive findings
          and/or a heterozygous CDKN1C pathogenic variant in the PCNA (proliferating cell nuclear antigen)-binding
          domain of the maternally expressed allele identified by molecular genetic testing.
        supports: SUPPORT
