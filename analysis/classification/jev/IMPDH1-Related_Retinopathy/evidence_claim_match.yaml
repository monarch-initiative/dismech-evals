        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does any model faithfully capture IMPDH1 disease, given that the disease is one of isoform-specific
          regulation and the human retina's IMPDH1 isoform proportions are unique among the species used
          as models?
        attaches_to:
        - pathophysiology#Retina-Restricted IMPDH1 Isoform Dependence
        rationale: The disease disrupts the regulation of retina-specific IMPDH1 isoforms, but the relative
          abundance of those isoforms in human retina differs from every mammalian model tested, and zebrafish
          reach a retinal variant by gene duplication rather than splicing. Mouse nulls model recessive
          loss, AAV models overexpress, and the D226N zebrafish does not degenerate. So model evidence
          exists but its translational validity to human disease is the open question, which is the defining
          HUMAN_MODEL_MISMATCH shape.
      selected_evidence:
        snippet: The relative abundance of IMPDH1 proteins in human retina is unique in comparison to
          other mammalian species, indicating an apparent lack of an ideal model organism for human retinal
          IMPDH1 expression.
        supports: SUPPORT
        directness: DIRECT
