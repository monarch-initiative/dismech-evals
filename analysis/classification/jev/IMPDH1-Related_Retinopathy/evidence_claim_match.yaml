        hypothesis_label: Dominant-negative misfolding and aggregation
        status: ALTERNATIVE
        description: One line of work holds that mutant IMPDH1 misfolds and, in hybrid tetramers, imposes
          its conformation on wild-type subunits, giving a dominant-negative mechanism. This is in direct
          tension with biochemical characterization of the same alleles that found no effect on protein
          stability or aggregation, so misfolding-driven dominant negativity is curated as a competing
          model rather than a settled one.
      selected_evidence:
        snippet: Under various conditions regain is close to the mutant figure, suggesting that, in hybrid
          tetramers, mutant subunits impose their faulty conformation on normal partners.
        supports: SUPPORT
