      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cgmp_toxicity_model
        hypothesis_label: Hyperactive enzyme with elevated cGMP causing death (refuted)
        status: DEPRECATED
        description: 'An intuitive early model held that feedback-resistant IMPDH1 would raise GTP and
          hence cGMP, killing photoreceptors by the cGMP-toxicity route familiar from PDE6 disease. Work
          in zebrafish cone models disproves it: cGMP was not elevated, a pde6c double mutant was not
          rescued, and metabolomic changes ran opposite to the prediction. No elevated-cGMP node is encoded
          for this disease.'
      selected_evidence:
        snippet: Our work disproves the model of a hyperactive enzyme leading to elevated cGMP causing
          cell death and reveals new defects associated with IMPDH1 mutant expression.
        supports: REFUTE
        directness: INDIRECT
