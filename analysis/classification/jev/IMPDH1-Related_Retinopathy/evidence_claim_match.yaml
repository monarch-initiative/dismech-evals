      assertion:
        name: Abnormal IMPDH1 Filament Assembly
        description: IMPDH1 assembles into octamers and micron-scale filaments (cytoophidia) whose architecture
          tunes activity. Disease variants form abnormally large, persistent and mislocalized filaments
          rather than dynamic ones; in zebrafish cones the mutant filaments sit at synapses and, for D226N,
          inside nuclei. In cultured cells D226N produces cytoophidia in most cells and is not dispersed
          by guanosine. Whether the abnormal filament is itself toxic or a marker of deregulation is not
          settled.
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
