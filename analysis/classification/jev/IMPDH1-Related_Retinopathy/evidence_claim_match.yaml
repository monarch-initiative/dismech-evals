          modifier: INCREASED
        - preferred_term: retinal cone cell apoptotic process
          term:
            id: GO:0097474
            label: retinal cone cell apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: Full-field electroretinograms were severely reduced and the dark-adapted rod and mixed
