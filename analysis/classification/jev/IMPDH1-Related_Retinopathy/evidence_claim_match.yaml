      assertion_type: Pathophysiology
      assertion:
        name: Photoreceptor Degeneration
        description: The convergent outcome is progressive photoreceptor dysfunction and death, rods before
          cones and periphery before centre. Dark-adapted rod electroretinogram responses are extinguished
          before light-adapted cone responses, rod loss exceeds cone loss at all ages, and the peripheral
          retina is more susceptible than the centre, so central function is relatively preserved until
          late. The final step from molecular defect to photoreceptor death is not fully established and
          may be the sum of the filament, nucleic-acid-binding and misfolding branches.
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: retinal rod cell
