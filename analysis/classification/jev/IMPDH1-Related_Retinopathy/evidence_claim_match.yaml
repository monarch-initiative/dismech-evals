        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Allosteric Regulation of IMPDH1
        description: Disease variants in the CBS (Bateman) domain disrupt allosteric control of the enzyme
          by purine nucleotides. The p.Asp226Asn allele confers resistance to feedback inhibition by GDP/GTP,
          and p.Arg224Pro abolishes ATP binding at the regulatory site. Cryo-EM shows the disease mutations
          split into two functional classes, one that disrupts GTP regulation and one that does not, so
          loss of regulation is variant-specific rather than universal.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: nucleotide binding at the CBS regulatory domain
          term:
            id: GO:0000166
            label: nucleotide binding
          modifier: DECREASED
      selected_evidence:
        snippet: 'we show that IMPDH1 disease mutations fall into two classes: one disrupts GTP regulation
          and the other has no effect on GTP regulation or filament assembly.'
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
