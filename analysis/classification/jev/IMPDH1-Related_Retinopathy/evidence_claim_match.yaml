      assertion_type: AnimalModel
      assertion:
        name: Impdh1 knockout mouse
        species: Mouse
        genotype: Impdh1-/- (targeted disruption)
        publication: PMID:14981049
        description: A germline null. It shows only slowly progressive retinal degeneration with most
          photoreceptors structurally intact at 12 months, in contrast to the severe human dominant disease.
          Its mildness is the contrast the field used to argue against a loss-of-catalysis mechanism,
          and it models autosomal recessive, not dominant, disease.
        modeled_mechanisms:
        - target: Photoreceptor Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Produces photoreceptor degeneration, but mild and slow, from loss of protein rather
            than a dominant missense allele.
          limitations: A null allele models absence of IMPDH1; human disease is a regulatory/dominant-negative
            missense with intact catalysis, and the mouse null is explicitly a recessive RP model.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: INVALIDATING
            description: The model's quantity is complete loss of IMPDH1 protein; the disease quantity
              is a heterozygous missense allele with preserved catalysis and lost regulation.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse retinal IMPDH1 isoform proportions differ from human, and the disease is
              one of isoform-specific regulation.
      selected_evidence:
        snippet: Impdh1(-/-) null mice are shown here to display a slowly progressive form of retinal
          degeneration in which visual transduction, analysed by electroretinographic wave functions,
          becomes gradually compromised, although at 12 months of age most photoreceptors remain structurally
          intact.
        supports: SUPPORT
        directness: DIRECT
