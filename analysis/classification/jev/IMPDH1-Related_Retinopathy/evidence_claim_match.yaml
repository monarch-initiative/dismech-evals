  ae2e6c82e8bc5c2741c2fbd07122b56bb47bca0409bd6c4bbf03b3d3b1c6433f:
    claim:
      about:
        disease:
          name: IMPDH1-Related Retinopathy
          disease_term:
            preferred_term: IMPDH1-related retinopathy
            term:
              id: MONDO:1040051
              label: IMPDH1-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IMPDH1 Missense Variant in the CBS Regulatory Domain
        description: A heterozygous missense (occasionally in-frame) variant arises in IMPDH1, clustered
          in and immediately downstream of the regulatory CBS (Bateman) domain encoded by exons 8-10,
          where the recurrent p.Asp226Asn allele lies. The variant is the initiating lesion. Critically,
          it does not reduce catalytic activity and does not perturb the bulk guanine nucleotide pool;
          its consequences are on allosteric regulation, higher-order assembly and a moonlighting nucleic-acid-binding
          function, with a dominant-negative component. Truncating variants and missense variants outside
          exons 8-10 are mostly not disease-causing, and gnomAD shows IMPDH1 loss of function is tolerated,
          so PVS1 does not apply to this gene for this disease.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        role: trigger
        gene:
          preferred_term: IMPDH1
          term:
            id: hgnc:6052
            label: IMPDH1
        genetic_context:
          gene:
            preferred_term: IMPDH1
            term:
              id: hgnc:6052
              label: IMPDH1
          variant_origin: GERMLINE
          functional_impact_category: DOMINANT_NEGATIVE
          description: Heterozygous germline missense variant in or downstream of the CBS domain (exons
            8-10). Catalytic activity is preserved; the pathogenic consequence is loss of allosteric regulation
            and of nucleic-acid binding, with evidence that mutant subunits impose their conformation
            on wild-type subunits in hybrid tetramers.
        molecular_functions:
        - preferred_term: IMP dehydrogenase activity
          term:
            id: GO:0003938
            label: IMP dehydrogenase activity
      selected_evidence:
        snippet: These adRP-associated variants were located in exons 8-10, a region within or downstream
          of the CBS domain.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38604988
      reference_title: 'Datasets-Based IMPDH1 Revisited: Heterozygous Missense Variants for Dominant Retinitis
