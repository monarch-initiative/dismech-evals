            background: C57BL/6J
            publication: PMID:36140676
            description: Constitutive Impg1 knockout with no detectable retinal SPACR. From 9 months,
              autofluorescent subretinal deposits across the fundus, falling scotopic and photopic ERG
              amplitudes, outer retinal thinning, disorganized IPM and outer segments, and RPE damage.
              Because it removes SPACR rather than expressing a mutant allele, it models the matrix-loss
              consequence shared by both IMPG1 diseases, not the dominant-negative allele itself.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Subretinal Autofluorescent Material Accumulation
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: Autofluorescent hyperreflective deposits form between outer segments and RPE.
        limitations: Mice have no macula, so the deposits are scattered across the fundus rather than
          forming a single central vitelliform lesion, and the knockout removes SPACR rather than expressing
          the human dominant allele.
        divergences:
        - divergence_type: PROXY_QUANTITY
          materiality: QUALIFYING
          description: A homozygous null removes SPACR entirely, whereas the dominant human disease retains
            one normal allele and adds an abnormal one; complete loss of the protein stands in for the
            abnormal behavior of a dominant mutant, so the model reproduces the subretinal deposit through
            loss of SPACR rather than the proposed dominant-negative matrix effect.
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: The mouse retina has no macula, so the deposits scatter across the fundus instead
            of forming the single central vitelliform lesion that defines the human macular phenotype.
      selected_evidence:
        snippet: These autofluorescent spots in the Impg1−/− mice were also detectable by SD-OCT as hyperreflective
          deposits localized between the photoreceptors OS and the RPE
        supports: SUPPORT
