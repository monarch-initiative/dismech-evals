          the extracellular matrix, which separates this disease from the recessive IMPG1 disease, where
          a single null allele is non-penetrant. A second codon-238 missense change (p.Leu238Pro) and
          the perifoveal-maculopathy change p.Leu579Pro are also heterozygous.
