        features: Monoallelic germline variants. The SEA1-domain missense change c.713T>G (p.Leu238Arg)
          segregates in three autosomal dominant vitelliform macular dystrophy families; a second codon-238
          change c.713T>C (p.Leu238Pro) was found in a simplex vitelliform case; the heterozygous c.1736T>C
          (p.Leu579Pro) change causes benign concentric annular macular dystrophy; and a dominant splice
          variant was identified in a family with autosomal dominant retinitis pigmentosa. A retrospective
          screen reported eight further IMPG1 families carrying different missense or nonsense variants
          in retinitis pigmentosa or vitelliform macular dystrophy, without a stated mode of inheritance.
          ClinGen classifies the monoallelic IMPG1 disease as Definitive.
        gene_disease_validity:
