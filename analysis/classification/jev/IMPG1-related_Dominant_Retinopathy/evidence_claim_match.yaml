  bb001297ce49fe9ca539c1396c51b321fd1a58e45aaa5030f4569d5fdd7a2d5c:
    claim:
      about:
        disease:
          name: IMPG1-related Dominant Retinopathy
          disease_term:
            preferred_term: IMPG1-related dominant retinopathy
            term:
              id: MONDO:1040036
              label: IMPG1-related dominant retinopathy
        context: []
      assertion_type: Subtype
      assertion:
        name: Dominant VMD
        display_name: Autosomal dominant IMPG1 vitelliform macular dystrophy
        description: 'Adult-onset vitelliform macular dystrophy in heterozygotes for an IMPG1 SEA1-domain
          missense allele (p.Leu238Arg in three families, p.Leu238Pro in a simplex case): a single subfoveal
          round vitelliform deposit of autofluorescent material, in some individuals with additional small
          multifocal deposits, a mean visual acuity around 20/30, and a normal or only slightly reduced
          electrooculogram Arden ratio, which distinguishes it from Best disease. Age of onset in the
          p.Leu238Arg families was 20 to 45 years, while the p.Leu238Pro simplex case had childhood onset.'
        mappings:
          mondo_mappings:
          - term:
              id: MONDO:0014508
              label: vitelliform macular dystrophy 4
            mapping_predicate: skos:broadMatch
            mapping_justification: VMD4 is defined by MONDO as any vitelliform macular dystrophy caused
              by IMPG1 mutation, whatever the inheritance mode, so it is broader than this monoallelic
              dominant subtype. Its dominant adult-onset form is curated as the IMPG1-related subtype
              of Adult_Onset_Foveomacular_Vitelliform_Dystrophy.
        genes:
        - preferred_term: IMPG1
          term:
            id: hgnc:6055
            label: IMPG1
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: In a large family with autosomal-dominant VMD, gene mapping and whole-exome sequencing
          led to the identification of a c.713T>G (p.Leu238Arg) IMPG1 mutation, which was subsequently
          found in two other families with autosomal-dominant VMD and the same phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23993198
      reference_title: Mutations in IMPG1 cause vitelliform macular dystrophies.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding report identified the dominant VMD allele p.Leu238Arg in three autosomal
        dominant families with the same phenotype.
