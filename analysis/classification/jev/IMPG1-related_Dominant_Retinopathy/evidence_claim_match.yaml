              label: IMPG1-related dominant retinopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: impg1_dominant_vmd_versus_rp
        prompt: What determines whether a monoallelic IMPG1 variant presents as adult-onset vitelliform
          macular dystrophy or as retinitis pigmentosa?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - has_subtypes#Dominant VMD
        - has_subtypes#BCAMD RP
        rationale: The dominant IMPG1 disease spans a macular vitelliform presentation and a retinitis
          pigmentosa presentation, with the benign concentric annular macular dystrophy allele later reclassified
          as RP with early macular involvement. It is tempting to read a domain rule off the two prototypical
          alleles — the vitelliform p.Leu238Arg in the N-terminal SEA1 domain and the retinitis-pigmentosa
          p.Leu579Pro in the C-terminal SEA2 domain — but this is only a hypothesis, and against it Olivier
          found a single splice variant producing either RP or VMD in different families, so the same
          allele is not tied to one presentation. Whether domain position, the specific substitution,
          or modifier loci such as IMPG2 decide the presentation is not established.
      selected_evidence:
        snippet: the clinical diagnosis of the IMPG1 retinopathy-associated variant, originally described
          as benign concentric annular macular dystrophy, was also revised to RP with early macular involvement
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32817297
      reference_title: Pathogenic variants in IMPG1 cause autosomal dominant and autosomal recessive retinitis
        pigmentosa.
      evidence_source: HUMAN_CLINICAL
      explanation: A dominant allele once called a benign macular dystrophy was reclassified as retinitis
        pigmentosa, showing the presentations are not sharply separated.
