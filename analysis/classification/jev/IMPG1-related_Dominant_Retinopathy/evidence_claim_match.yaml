      assertion_type: Discussion
      assertion:
        discussion_id: impg1_dominant_negative_versus_haploinsufficiency
        prompt: Do the dominant IMPG1 alleles cause disease by a dominant-negative effect of the mutant
          SPACR within the interphotoreceptor matrix, or by haploinsufficiency, and do the available loss-of-function
          models address either?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Non-null Heterozygous IMPG1 Variant
        - animal_models#Mouse
        - animal_models#Medaka
        rationale: The founding study proposes a dominant-negative mechanism because the p.Leu238Arg protein
          is produced and correctly localized and is not a null, while a later study leaves dominant-negative
          effect and haploinsufficiency open. Both the Impg1 knockout mouse and the medaka morpholino
          knockdown reduce or remove SPACR, so they test the consequence of absent proteoglycan, not the
          behavior of a heterozygous mutant protein alongside a normal one. No model expressing a human
          dominant allele has been reported, so the mechanism of the dominant disease is not directly
          modeled.
        proposed_experiments:
        - experiment_id: impg1_dominant_allele_knockin
          experiment_design: TARGETED_PERTURBATION
          name: Knock-in of a human dominant IMPG1 allele
          description: Generate an animal or human retinal-organoid model expressing a dominant IMPG1
            allele (for example p.Leu238Arg) alongside the wild-type allele, and test whether the mutant
            SPACR disrupts the matrix in the presence of normal SPACR, distinguishing a dominant-negative
            effect from haploinsufficiency.
          would_support:
          - pathophysiology#Non-null Heterozygous IMPG1 Variant
      selected_evidence:
        snippet: the current finding of a second missense mutation affecting amino acid p.(Leu238) in
          a patient with VMD supports the causative role of defective IMPG1 molecules in disease via an
          as yet unknown dominant-negative effect or haploinsufficiency
