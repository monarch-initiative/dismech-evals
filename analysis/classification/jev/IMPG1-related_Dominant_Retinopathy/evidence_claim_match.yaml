  8003900abd86bd47fa062393d291b24781b031a1cfd949f281a83e65da646974:
    claim:
      about:
        disease:
          name: IMPG1-related Dominant Retinopathy
          disease_term:
            preferred_term: IMPG1-related dominant retinopathy
            term:
              id: MONDO:1040036
              label: IMPG1-related dominant retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-null Heterozygous IMPG1 Variant
        description: A heterozygous IMPG1 allele produces an abnormal SPACR protein that acts in the interphotoreceptor
          matrix despite a normal allele. The prototypical change p.Leu238Arg sits at the start of the
          conserved N-terminal SEA1 domain; structural modeling predicts it destabilizes SEA1, but the
          mutant protein is produced at normal levels and is not mislocalized, so it is not a null allele.
          The founding study proposes a dominant-negative effect, the mutant behaving abnormally inside
          the extracellular matrix, which separates this disease from the recessive IMPG1 disease, where
          a single null allele is non-penetrant. A second codon-238 missense change (p.Leu238Pro) and
          the perifoveal-maculopathy change p.Leu579Pro are also heterozygous.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: IMPG1
          term:
            id: hgnc:6055
            label: IMPG1
        molecular_functions:
        - preferred_term: interphotoreceptor matrix structural constituent
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: UNKNOWN
      selected_evidence:
        snippet: Structural modeling indicates that the p.Leu238Arg substitution destabilizes the conserved
          SEA1 domain of SPACR.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23993198
      reference_title: Mutations in IMPG1 cause vitelliform macular dystrophies.
      evidence_source: COMPUTATIONAL
      explanation: In-silico structural modeling predicts the dominant allele destabilizes the SEA1 domain
