      assertion:
        name: Subretinal Autofluorescent Material Accumulation
        description: Autofluorescent, hyperreflective material accumulates between the photoreceptor outer
          segments and the RPE. In patients this forms the central vitelliform lesion, sometimes with
          multifocal deposits; in knockout mice, which lack a macula, the deposits appear across the whole
          fundus from about 9 months and grow with age. In IMPG1 disease the material sits above the RPE,
          unlike BEST1 disease, where it lies between the RPE and Bruch's membrane.
        biological_scale: TISSUE
      selected_evidence:
        snippet: These autofluorescent spots in the Impg1−/− mice were also detectable by SD-OCT as hyperreflective
          deposits localized between the photoreceptors OS and the RPE
