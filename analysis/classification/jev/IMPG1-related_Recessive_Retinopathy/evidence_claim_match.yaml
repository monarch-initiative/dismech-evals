        disease:
          name: IMPG1-related Recessive Retinopathy
          disease_term:
            preferred_term: IMPG1-related recessive retinopathy
            term:
              id: MONDO:1040037
              label: IMPG1-related recessive retinopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: impg1_mouse_knockout_discordance
        prompt: Do Impg1 knockout mice model the human recessive disease, given that one line shows no
          deficit up to 8 months and the other degenerates only from 9 months, with deposits spread across
          a retina that has no macula?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Photoreceptor Degeneration
        - pathophysiology#Subretinal Autofluorescent Material Accumulation
        - animal_models#Mouse
        rationale: The two knockout lines disagree. The later line attributes the difference to age at
          phenotyping and to the absence of fundus imaging in the earlier study, but this has not been
          tested by examining both lines side by side at the same age. The mouse also lacks a cone-rich
          macula, so the central location of the human vitelliform lesion cannot be reproduced, and whether
          the mouse degeneration corresponds to the vitelliform or the retinitis pigmentosa presentation
          is unclear.
        proposed_experiments:
        - experiment_id: impg1_ko_matched_age_phenotyping
          experiment_design: TARGETED_PERTURBATION
          name: Matched-age phenotyping of both Impg1 knockout lines
          description: Phenotype both knockout lines on the same background beyond 12 months with fundus
            autofluorescence, SD-OCT and ERG to test whether the discordance is due to age at examination.
          would_support:
          - pathophysiology#Photoreceptor Degeneration
      selected_evidence:
        snippet: Surprisingly, Salido et al. generated Impg1−/−, Impg2−/−, and double mutant mice and
          found no evidence of morphological or functional deficits in the Impg1−/− model and only small
          deficits in the double mutant mice
        supports: SUPPORT
