              by IMPG1 mutation, whatever the inheritance mode, so it is broader than this biallelic subtype.
              The dominant adult-onset part of VMD4 is curated as the IMPG1-related subtype of Adult_Onset_Foveomacular_Vitelliform_Dystrophy.
        genes:
