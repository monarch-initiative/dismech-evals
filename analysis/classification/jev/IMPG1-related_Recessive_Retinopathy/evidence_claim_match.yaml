              label: IMPG1-related recessive retinopathy
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Impg1 knockout mouse (Olivier 2022)
        species: Mouse
        genotype: Impg1-/- (floxed exon 6 deleted by CMV-Cre)
        background: C57BL/6J
        publication: PMID:36140676
        description: Constitutive Impg1 knockout with no detectable retinal SPACR. Normal at 2 months;
          from 9 months, autofluorescent subretinal deposits across the fundus, falling scotopic and photopic
          ERG amplitudes, outer retinal thinning, disorganized IPM and outer segments, and RPE damage,
          worsening by 14 months.
        modeled_mechanisms:
        - target: Subretinal Autofluorescent Material Accumulation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Autofluorescent hyperreflective deposits form between outer segments and RPE.
          limitations: Mice have no macula, so the deposits are scattered across the fundus rather than
            forming a single central vitelliform lesion; a single yolk-like dome was seen in one mouse
            only.
        - target: Photoreceptor Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Late-onset, slowly progressive loss of rod and cone function and outer retinal
            thinning.
          limitations: Degeneration is mild and late (detectable from 9 months), and the mouse shows no
            pigment deposits, so the retinitis pigmentosa fundus picture is not reproduced.
      selected_evidence:
        snippet: Impg1-/- mice provide a novel model for mechanistic investigations and the development
          of therapies for VMD and RP caused by IMPG1 pathogenic variants.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
