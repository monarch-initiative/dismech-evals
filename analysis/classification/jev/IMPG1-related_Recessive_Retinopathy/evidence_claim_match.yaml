  1d0085f2d399dafec0172c99004cd0c87c0d7f306f1622781be846413d860224:
    claim:
      about:
        disease:
          name: IMPG1-related Recessive Retinopathy
          disease_term:
            preferred_term: IMPG1-related recessive retinopathy
            term:
              id: MONDO:1040037
              label: IMPG1-related recessive retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic IMPG1 Loss of Function
        description: Both IMPG1 alleles carry a null variant (nonsense, canonical splice-site, exon-skipping
          splice variant) or a hypomorphic missense variant, so the photoreceptors secrete little or no
          functional SPACR into the interphotoreceptor matrix. In the founding families at least one allele
          was a nonsense or presumed frameshift allele, and a leaky splice variant (c.807+5G>A) skips
          exon 7 in about half of transcripts. Carriers of one null allele in recessive families are clinically
          unaffected or only subclinically affected, which is the basis for separating this entity from
          the dominant IMPG1 disease, where a heterozygous missense allele such as p.Leu238Arg is proposed
          to act dominantly within the matrix.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: IMPG1
          term:
            id: hgnc:6055
            label: IMPG1
        molecular_functions:
        - preferred_term: interphotoreceptor matrix structural constituent
          modifier: DECREASED
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: IMPG1 encodes the SPACR protein, a component of the rod and cone photoreceptor extracellular
          matrix domains.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23993198
      reference_title: Mutations in IMPG1 cause vitelliform macular dystrophies.
      evidence_source: HUMAN_CLINICAL
      explanation: SPACR is a structural component of the photoreceptor extracellular matrix, the molecular
        function that biallelic null alleles remove.
