        name: Recessive VMD
        display_name: Autosomal recessive IMPG1 vitelliform macular dystrophy
        description: 'Vitelliform macular dystrophy in individuals homozygous or compound heterozygous
          for IMPG1 variants: a round, autofluorescent, dome-shaped subfoveal deposit, in some families
          with additional multifocal extramacular vitelliform deposits, decreased visual acuity and a
          moderately decreased electrooculogram Arden ratio. Reported onset ranges from early childhood
          to adulthood. Heterozygous parents are asymptomatic or show only subclinical changes such as
          tiny extramacular deposits.'
        mappings:
          mondo_mappings:
          - term:
              id: MONDO:0014508
              label: vitelliform macular dystrophy 4
            mapping_predicate: skos:broadMatch
