            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Two individuals from one family affected by autosomal-recessive VMD were homozygous for
          the splice-site mutation c.807+1G>T
        supports: SUPPORT
