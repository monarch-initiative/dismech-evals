        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: impg1_recessive_rp_versus_vmd
        prompt: What determines whether biallelic IMPG1 loss of function presents as vitelliform macular
          dystrophy or as retinitis pigmentosa?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - has_subtypes#Recessive VMD
        - has_subtypes#Recessive RP
        rationale: ClinGen lumps the two presentations on the basis of a shared mechanism and treats them
          as a spectrum, but only about seven biallelic probands have been scored and no genotype-phenotype
          rule separating them has been described. Whether residual function of hypomorphic or leaky splice
          alleles, the position of variants in the SEA or EGF-like domains, or modifier loci such as IMPG2
          decides the presentation is not known.
      selected_evidence:
        snippet: The phenotypic variability between them appears to represent a spectrum of disease rather
          than separate disease entities.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
