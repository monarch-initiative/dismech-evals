      assertion_type: Pathophysiology
      assertion:
        name: Interphotoreceptor Matrix Disorganization
        description: SPACR is made by rod and cone photoreceptors and, with SPACRCAN (IMPG2), supplies
          most of the chondroitin sulfate of the interphotoreceptor matrix and the cone-specific glycocalyx.
          Loss of SPACR removes chondroitin sulfate and cone-associated PNA lectin staining from the outer-segment
          compartment of the matrix, and in older knockout mice the matrix becomes vacuolated and disorganized.
        biological_scale: TISSUE
        cellular_components:
        - preferred_term: interphotoreceptor matrix
          term:
            id: GO:0033165
            label: interphotoreceptor matrix
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: DECREASED
          term:
            id: GO:0030198
            label: extracellular matrix organization
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: In situ hybridization analyses indicate that, in the eye, IPM 150 mRNA is expressed specifically
          by cone and rod photoreceptor cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
