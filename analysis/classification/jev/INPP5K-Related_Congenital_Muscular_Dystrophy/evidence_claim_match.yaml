      assertion_type: Discussion
      assertion:
        discussion_id: inpp5k_alr_defect_in_patient_muscle
        kind: HUMAN_MODEL_MISMATCH
        prompt: Muscle-specific Inpp5k knockout mice show failed autophagic lysosome reformation with
          autophagy inhibition, but autophagic flux in patient fibroblasts was normal. Does the ALR defect
          operate in patient muscle carrying hypomorphic alleles?
        attaches_to:
        - pathophysiology#Defective Autophagic Lysosome Reformation
        - pathophysiology#Lysosome Depletion and Autophagic Flux Inhibition in Skeletal Muscle
        rationale: The mouse deletes the gene completely in muscle, while patients retain partial activity,
          and the only human flux experiment used skin fibroblasts, a cell type the mouse work suggests
          is less dependent on ALR. Patient biopsies show rimmed vacuoles and p62 labeling, which fit
          the model but do not measure flux or lysosome number. Measuring lysosome abundance, LC3-II flux
          and reformation tubules in patient myoblasts or muscle would test whether the mouse mechanism
          transfers.
      selected_evidence:
        snippet: However, LC3B immunoblotting and immunofluorescence staining as well as measurement of
          LC3B turnover and p62 levels in fibroblasts treated with the autophagy inducer rapamycin and
          the lysosomal inhibitor bafilomycin A1 did not reveal specific effects of different INPP5K genotypes.
        supports: SUPPORT
