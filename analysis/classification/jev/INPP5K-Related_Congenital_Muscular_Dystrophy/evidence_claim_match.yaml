        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Autophagic Lysosome Reformation
        biological_scale: CELLULAR
        description: Autophagic lysosome reformation recycles autolysosome membranes into new lysosomes
          through tubules that bud and undergo scission. In INPP5K-deficient myoblasts the autolysosomes
          enlarge and hyperextended reformation tubules persist, with the PI(4,5)P2 effector clathrin
          failing to disengage, so new lysosomes are not released. Wild-type INPP5K, but not disease mutants,
          restores lysosome homeostasis, which ties the patient alleles to this step.
        cell_types:
        - preferred_term: skeletal muscle myoblast
          term:
