        name: Molecular genetic testing of INPP5K
        description: Diagnosis rests on biallelic INPP5K variants. Exome or neuromuscular panel sequencing
          is the usual route; in patients from Puglia, targeted sequencing of exon 2 for the p.Val23Met
          founder allele is a reasonable first step. Synonymous variants can be pathogenic through splicing,
          so RNA analysis may be needed when only one variant is found.
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Our case highlights the critical role of RNA analysis in diagnosing non-canonical variants
