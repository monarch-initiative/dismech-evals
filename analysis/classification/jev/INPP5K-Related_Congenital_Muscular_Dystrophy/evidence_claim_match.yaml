      assertion_type: HistopathologyFinding
      assertion:
        name: Dystrophic myopathy with variable vacuolation
        description: 'Biopsies show nonspecific dystrophic changes: fiber size variation, fibrosis, fatty
          replacement, internal nuclei, rare necrotic and regenerating fibers, with vacuolated fibers
          in some. Electron microscopy can show dense membranous structures associated with myonuclei,
          as in Marinesco-Sjogren syndrome. Dystrophin, sarcoglycans and merosin are normal; alpha-dystroglycan
          is normal in some patients and reduced in others.'
      selected_evidence:
        snippet: Histological examination of three diagnostic muscle biopsies from individuals with INPP5K
          mutations showed vacuoles in several myofibers, and electron microscopy of one biopsy revealed
          dense membranous structures associated with some myonuclei.
        supports: SUPPORT
