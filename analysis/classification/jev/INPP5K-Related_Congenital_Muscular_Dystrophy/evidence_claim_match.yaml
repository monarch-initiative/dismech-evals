  2e7ff2a4eafb751eab1c2618371d2cdd7a63ec093d8654f6e59f4fe5891ea2fb:
    claim:
      about:
        disease:
          name: INPP5K-Related Congenital Muscular Dystrophy
          disease_term:
            preferred_term: congenital muscular dystrophy with cataracts and intellectual disability
            term:
              id: MONDO:0024607
              label: congenital muscular dystrophy with cataracts and intellectual disability
        context: []
      assertion_type: Genetic
      assertion:
        name: INPP5K
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: INPP5K
          term:
            id: hgnc:33882
            label: INPP5K
        notes: INPP5K encodes inositol polyphosphate-5-phosphatase K (SKIP), a 448-residue protein with
          an N-terminal 5-phosphatase domain and a C-terminal SKICH domain that targets it to the endoplasmic
          reticulum. Most reported pathogenic alleles are missense or in-frame changes in the phosphatase
          domain that leave partial residual activity in vitro; the truncating and splice alleles reported
          so far occur in compound heterozygosity with a missense allele. Constitutive Inpp5k knockout
          is embryonic lethal in mice, so patient alleles are interpreted as hypomorphic. INPP5K has no
          row in the committed ClinGen gene-disease validity ingest (kb/genes/ingest/clingen_gene_validity.tsv),
          so no validity tier is recorded.
        variants:
        - name: p.Ile50Thr (c.149T>C)
          description: Recurrent homozygous missense allele in consanguineous families of Bangladeshi
            and Pakistani origin. It reduces PI(4,5)P2 5-phosphatase activity in vitro with partial residual
            activity. The same allele, in a Pakistani family, produced congenital cataract and intellectual
            disability with only electromyographic myopathy.
          clinical_significance: PATHOGENIC
        - name: p.Val23Met (c.67G>A)
          description: Southern Italian founder allele, homozygous or compound heterozygous in six patients
            from Puglia sharing one haplotype. The recombinant protein retained 27% of wild-type activity
            against PI(4,5)P2 in vitro.
          clinical_significance: PATHOGENIC
        - name: p.Lys87= (c.261G>A) splice variant
          description: Synonymous variant that causes exon 3 skipping and a frameshift, reported in compound
            heterozygosity with the hypomorphic missense p.Arg92Cys in an adult with cataract and limb-girdle
            weakness but no intellectual disability.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Whole-exome sequencing revealed homozygous missense and compound heterozygous mutations
          in INPP5K in the affected members of each family.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28190459
      reference_title: Mutations in INPP5K Cause a Form of Congenital Muscular Dystrophy Overlapping Marinesco-Sjögren
        Syndrome and Dystroglycanopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: The independent companion discovery study in four further families.
