              id: MONDO:0010580
              label: immune dysregulation-polyendocrinopathy-enteropathy-X-linked syndrome
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Disease evolution with accrual of autoimmune manifestations
        age_range: Infancy through childhood
        notes: With progression, additional autoimmune manifestations arise (nephropathy, hepatitis, cytopenias,
          thyroiditis); presentations after 1 year of age can be atypical, and failure to thrive may be
          the sole initial manifestation after the first month of life.
      selected_evidence:
        snippet: 'Immunodysregulation polyendocrinopathy enteropathy x-linked (IPEX) syndrome is a monogenic
          autoimmune disease caused by FOXP3 mutations. ... Clinical histories of 96 patients with a genetically
          proven IPEX syndrome were collected from 38 institutions worldwide and retrospectively analyzed.
          ... The most common presentation suggestive of the diagnosis of IPEX syndrome remained the classical
          triad of enteropathy, T1D, and eczema for the majority of the 39 of 96 patients who had neonatal
          onset. Gastrointestinal involvement and eczema, but not T1D, were the dominant features of disease
          presentation after 1 month of age. However, failure to thrive was a hallmark of the disease
          and it was sometimes the sole initial manifestation after 1 month of age. After 1 year of age,
          the disease could also present with nephropathy or hepatitis, otherwise considered atypical
          at onset (Fig 1, C and D). ... The symptoms observed over the course of the disease and their
          prevalence are listed (Fig 1, D): with the exception of diarrhea, eczema, and failure to thrive,
          nephropathy (autoimmune or secondary to malnutrition and medication) was the most common (33
          of 96 patients), varying from lithiasis, nephrocalcinosis, or isolated proteinuria to more severe
          manifestations such as nephrotic syndrome (in some cases with a definite diagnosis of glomerulonephritis)
          or tubulopathy and interstitial nephritis. Hematological manifestations included autoimmune
          hemolytic anemia (25 of 96 patients), thrombocytopenia (13 of 96 patients), and neutropenia
          (6 of 96 patients). Other conditions included autoimmune thyroiditis (15 of 96 patients) and
          hepatitis (19 of 96 patients), while food allergies (13 of 96 patients), arthritis (8 of 96
          patients), alopecia (8 of 96 patients), and lymphadenopathy (9 of 96 patients) were occasionally
          reported during disease progression. ... In 11 patients new autoimmune manifestations arose
          while receiving IS, including T1D (4), thyroiditis (3), autoimmune cytopenia (2), autoimmune
          hepatitis (2), enteropathy (1), adrenal insufficiency (1), and arthritis (1).'
        supports: SUPPORT
