      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Untreated IPEX is usually fatal within the first one to two years of life. Even with
          modern therapy the disease imposes intensive management burden (parenteral nutrition, chronic
          immunosuppression or HSCT, lifelong insulin for diabetes), and long-term outcome under chronic
          immunosuppression is limited by disease recurrence and treatment complications.
      selected_evidence:
        snippet: The overall survival after HSCT was 73.2% (95% CI, 59.4-83.0) and after IS was 65.1%
          (95% CI, 62.8-95.8).
        supports: SUPPORT
