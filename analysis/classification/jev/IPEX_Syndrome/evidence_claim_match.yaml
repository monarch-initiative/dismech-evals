        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FOXP3 Loss and Regulatory T Cell Deficiency
        description: 'Loss-of-function mutations in FOXP3 (scurfin), the lineage-defining forkhead transcription
          factor of regulatory T cells, impair the development and suppressive function of CD4+CD25+FOXP3+
          Tregs. Most human mutations cluster in the forkhead (FKH) DNA-binding domain and abolish FOXP3
          transcriptional output, so Tregs are often present but nonfunctional rather than numerically
          absent.

          '
        cell_types:
        - preferred_term: CD4+CD25+ regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        biological_processes:
        - preferred_term: regulatory T cell differentiation
          term:
            id: GO:0045066
            label: regulatory T cell differentiation
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: FOXP3
            term:
              id: hgnc:6106
              label: FOXP3
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Hemizygous FOXP3 alleles in males, most often in the forkhead, leucine-zipper and
            repressor domains. Recorded as LOSS_OF_FUNCTION.
      selected_evidence:
        snippet: We present genetic evidence that different mutations of the human gene FOXP3, the ortholog
          of the gene mutated in scurfy mice (Foxp3), causes IPEX syndrome.
        supports: SUPPORT
