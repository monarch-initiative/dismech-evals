        description: 'APECED/APS-1 is the key mechanistic contrast to IPEX. It is caused by AIRE mutations
          and reflects a defect in CENTRAL (thymic) tolerance, that is failed negative selection of autoreactive
          T cells in the thymus, whereas IPEX is a FOXP3/Treg defect in PERIPHERAL tolerance. APECED is
          autosomal recessive and presents with chronic mucocutaneous candidiasis, hypoparathyroidism,
          and adrenal insufficiency, rather than the neonatal enteropathy-diabetes-eczema triad of IPEX.

          '
      selected_evidence:
        snippet: Other single-gene defects resulting in reduced Treg cell function include CD25, signal
          transducer and activator of transcription 5b, autoimmune regulator, and Wiskott-Aldrich syndrome
          protein.
        supports: SUPPORT
