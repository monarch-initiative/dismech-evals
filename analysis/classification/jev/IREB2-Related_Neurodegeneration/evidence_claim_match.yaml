      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: 'The dominant and disabling morbidity is neurological: profound global developmental delay,
          a choreoathetoid and dystonic movement disorder that has not responded to treatment, epilepsy
          or EEG abnormality, and progressive loss of cerebral volume. The haematological component is
          real and mechanistically inseparable from the neurological one, but in every reported patient
          the anaemia has been mild and was not the presenting problem, so a single-chapter assignment
          to NEUROLOGIC is correct. The disorder would be missed entirely by a haematology-first workup.'
      selected_evidence:
        snippet: This 16-year-old male had neurological and haematological features that emulate those
          of Ireb2 knockout mice, including neurodegeneration and a treatment-resistant choreoathetoid
          movement disorder.
        supports: SUPPORT
