  768512292d133bf918a0a26c8701447f43fcbf2d7e4134121faf5f3d0603986f:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Treatment
      assertion:
        name: Investigational - recruiting latent IRP1 activity
        description: 'A conceptually distinct preclinical strategy: rather than replacing IRP2, convert
          the abundant but latent aconitase pool of IRP1 into IRE-binding protein. Dietary Tempol, a stable
          nitroxide, did exactly this in Irp2-null mice - disassembling the IRP1 iron-sulfur cluster,
          restabilising the TfR1 transcript, repressing ferritin synthesis and markedly attenuating the
          progression of neuromuscular impairment. It is the only intervention shown to modify the neurological
          phenotype of an Irp2-null animal from the upstream regulatory node rather than from a downstream
          consequence, and it has never been tried in a patient.'
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: Tempol (investigational nitroxide)
      selected_evidence:
        snippet: We suggest that Tempol protected IRP2(-/-) mice by disassembling the cytosolic iron-sulfur
          cluster of IRP1 and activating IRE binding activity, which stabilized the TfR1 transcript, repressed
          ferritin synthesis, and partially restored normal cellular iron homeostasis in the brain.
        supports: SUPPORT
    origin:
