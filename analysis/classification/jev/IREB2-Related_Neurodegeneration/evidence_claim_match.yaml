  3129b7f5a3380ab57521665286567a95ef168bcbbcb2ecbb109d6e9ae2f8d4bf:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of IRP1 to Compensate
        biological_scale: MOLECULAR
        description: 'A paralogue exists and does not rescue, and understanding why is what makes a single-gene
          lesion in a two-gene system disease-causing. IRP1 is bifunctional: with an intact [4Fe-4S] cluster
          it is cytosolic aconitase, and only in the apo form does it bind IREs. In intact animal tissues
          most IRP1 is the aconitase form, and - the decisive observation - its RNA-binding activity does
          not increase on a low-iron diet that is sufficient to activate IRP2. The small RNA-binding fraction
          of IRP1 is essentially insensitive to cellular iron status. The relationship is asymmetric:
          IRP2 can compensate for the loss of IRP1 by increasing its binding activity, so Irp1-null mice
          misregulate iron only in kidney and brown fat, whereas Irp2-null mice misregulate target proteins
          in every tissue. IRP2 dominates post-transcriptional iron regulation in mammals, and its loss
          is therefore not buffered.

          This asymmetry is also the entry point for the only mechanism-directed therapy tested in vivo.
          Feeding Irp2-null mice the nitroxide Tempol disassembles the IRP1 iron-sulfur cluster, converting
          latent aconitase into active IRE-binding protein, which restabilises the TfR1 transcript and
          represses ferritin synthesis - and markedly attenuates the neuromuscular disease. The therapeutic
          logic is to unmask a redundancy the cell does not normally use.'
        biological_processes:
        - preferred_term: iron-sulfur cluster assembly in IRP1
          term:
            id: GO:0016226
            label: iron-sulfur cluster assembly
        molecular_functions:
        - preferred_term: cytosolic aconitase activity of IRP1
          modifier: INCREASED
          term:
            id: GO:0003994
            label: aconitate hydratase activity
      selected_evidence:
        snippet: IRP1-/- mice misregulate iron metabolism only in the kidney and brown fat, two tissues
          in which the endogenous expression level of IRP1 greatly exceeds that of IRP2, whereas IRP2-/-
          mice misregulate the expression of target proteins in all tissues.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:14726953
      reference_title: Genetic ablations of iron regulatory proteins 1 and 2 reveal why iron regulatory
        protein 2 dominates iron homeostasis.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the asymmetry between the two paralogues that makes IRP2 loss, and not
        IRP1 loss, a systemic disease.
