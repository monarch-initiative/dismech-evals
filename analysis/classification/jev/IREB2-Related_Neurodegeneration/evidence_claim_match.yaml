  bf40921ce30bc04d1a33a027fa1f0aa478e11e1f3f97c976ccd7e4c021ee5122:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absence or Accelerated Degradation of IRP2 Protein
        biological_scale: MOLECULAR
        description: 'The abundance arm of the lesion. In the index patient, whose two alleles are nonsense,
          patient-derived lymphoblasts contained no IRP2, attributed by the authors to nonsense-mediated
          decay of the transcript. In the fourth patient the mechanism is different and better resolved:
          the p.Asp826Val allele reduced IRP2 protein by roughly 70% when expressed in SH-SY5Y neuroblastoma
          cells, and the loss was reversed by the proteasome inhibitor MG-132. That the lesion is post-transcriptional
          was established in a separate experiment and a separate material - RT-qPCR on the patient''s
          own peripheral blood mononuclear cells showed no appreciable alteration of IREB2 at the mRNA
          level, which the authors used to exclude the splicing abnormality proposed for earlier patients.
          Structural modelling places residue 826 close to the surface through which IRP2 is recognised
          by FBXL5.

          That is the physiological degradation route being hijacked. In an iron-replete and oxygen-replete
          cell, the SCF-FBXL5 ubiquitin ligase binds IRP2, polyubiquitinates it and delivers it to the
          proteasome; FBXL5''s substrate-binding domain carries an oxygen-responsive [2Fe2S] cluster that
          organises the loop which grips IRP2, and the same interaction sterically prises IRP2 off its
          IRE. A variant that makes IRP2 a better or constitutively available FBXL5 substrate therefore
          removes the protein by the cell''s own quality-control machinery rather than by any defect in
          folding per se - which is why proteasome inhibition restores it.'
        genes:
        - preferred_term: IREB2
          term:
            id: hgnc:6115
            label: IREB2
        biological_processes:
        - preferred_term: proteasomal degradation of IRP2
          modifier: INCREASED
          term:
            id: GO:0043161
