        description: 'The newest and most disease-specific piece of the mechanism, and the only in vivo
          work built on an actual patient allele rather than a null. A CRISPR-Cas9 knock-in mouse homozygous
          for the p.Asp826Val variant found in the Chinese pedigree shows reduced Ireb2 protein, dysregulated
          iron metabolism, impaired spatial learning and memory and reduced motor activity, together with
          increased microglial activation and decreased hippocampal dendritic spine density, impaired
          long-term potentiation and elevated paired-pulse facilitation. That combination - fewer spines,
          weaker potentiation, altered presynaptic release probability, activated microglia - describes
          synaptic failure with neuroinflammation rather than cell loss, and it fits a disorder whose
          human presentation is developmental as much as degenerative: these children largely never acquired
