  1c29c272606b8bc058cd53105b101f5cac3d43cecf79ffabcac0813072db677d:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuronal and Oligodendrocyte Iron Mishandling
        biological_scale: CELLULAR
        description: 'The central nervous system is where the regulatory lesion is least tolerable and,
          confusingly, where it looks most like the opposite of what it is. In Irp2-null mice, ferric
          iron accumulates in the cytosol of neurons and oligodendrocytes in specific brain regions and
          in white matter tracts, with ferritin colocalising in the very neuronal populations that later
          degenerate and ubiquitin-positive inclusions accumulating in iron-laden oligodendrocytes. Those
          accumulations precede the movement disorder by months. The reconciliation with functional iron
          deficiency is that derepressed ferritin sequesters iron in a form the cell cannot use: the tissue
          is iron-loaded and the cytosolic labile pool is empty at the same time. Oligodendrocytes matter
          disproportionately here because they are the most iron-demanding cells in the brain - myelin
          lipid synthesis is iron-dependent - and delayed myelination with white matter loss is exactly
          what the patients'' imaging shows.'
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        chemical_entities:
        - preferred_term: ferritin-sequestered iron(3+)
          modifier: INCREASED
          term:
            id: CHEBI:29034
            label: iron(3+)
        biological_processes:
        - preferred_term: myelination
          modifier: DECREASED
          term:
            id: GO:0042552
            label: myelination
        protein_complexes:
        - preferred_term: ferritin complex
          modifier: INCREASED
          term:
            id: GO:0070288
            label: ferritin complex
        notes: The strongest evidence in this node is murine. Human brain iron content has not been quantified
          in any reported patient; the imaging descriptions are of volume loss, delayed myelination, white
          matter reduction and abnormal signal around the lateral ventricles, basal ganglia and thalamus,
          and abnormal signal on conventional sequences is not a measurement of iron. This entry therefore
          does NOT assert brain iron accumulation in humans, and NDCAMA is deliberately not curated as
          a neurodegeneration with brain iron accumulation (NBIA) disorder - see the differential and
          the knowledge gap on this point.
      selected_evidence:
        snippet: Ferric iron accumulates in the cytosol of neurons and oligodendrocytes in distinctive
          regions of the brain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
