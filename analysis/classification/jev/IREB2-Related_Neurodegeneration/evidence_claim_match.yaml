              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bi-allelic Loss-of-Function IREB2 Variants
        biological_scale: MOLECULAR
        description: 'The primary lesion is bi-allelic damage to IREB2 at 15q25.1, reported against transcript
          NM_004136. Two allele classes have been seen. The index patient carried two nonsense alleles,
          and his cells contained no detectable IRP2 at all. The three later patients carried missense
          alleles - and in one case a three-base in-frame deletion - which do not abolish the protein
          but either destabilise it or degrade its RNA-binding function. The distinction matters because
          it predicts the shape of the future phenotypic spectrum: complete loss of function has so far
          always produced severe disease, and partial loss of function is the untested territory where
          milder disease should be sought.'
        genes:
        - preferred_term: IREB2
          term:
            id: hgnc:6115
            label: IREB2
      selected_evidence:
        snippet: The first case exhibited two nonsense mutations
        supports: SUPPORT
