  dcdbe650967ae5ce7806dd5266f082aa0bb2feeeab69843c5ad72810310c22e6:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Full blood count with red cell indices and iron studies
        description: 'A complete blood count showing mild microcytic, hypochromic anaemia, with serum
          iron and transferrin saturation in the normal range, is the inexpensive finding that distinguishes
          this disorder from an isolated neurological syndrome. The combination of microcytosis with normal
          iron studies is the diagnostic signature: it is what would be expected if the problem were cellular
          iron handling rather than iron supply, and it means that a normal ferritin or serum iron does
          not argue against the diagnosis.'
        notes: 'The mouse predicts two further laboratory findings that have not been reported in patients
          and are worth measuring: absent bone marrow iron stores despite normal transferrin saturation,
          and raised free and zinc protoporphyrin from ALAS2 derepression. Erythrocyte protoporphyrin
          is a cheap, widely available test and is the most direct available probe of the mechanism in
          a living patient.'
      selected_evidence:
        snippet: We postulate that IRP2 mutations or deletions may be a cause of refractory microcytic
          anemia and bone marrow iron depletion in patients with normal transferrin saturations, elevated
          serum ferritins, elevated red cell protoporphyrin IX levels, and adult-onset neurodegeneration.
        supports: SUPPORT
