  70f3c9be84306953ae02e610702022897285dce95b2730f5ce733705177ea96d:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HIF2-alpha Stabilisation and the Glycolytic Shift
        biological_scale: CELLULAR
        description: 'A second, indirect consequence of cellular iron shortage. The prolyl hydroxylases
          that mark hypoxia-inducible factor subunits for degradation are themselves iron(II)-dependent,
          so a cell that cannot obtain iron behaves as though it were hypoxic. In globally Irp2-depleted
          mouse embryonic fibroblasts both Hif1-alpha and Hif2-alpha rose; Hif1-alpha drove glycolytic
          gene expression while Hif2-alpha suppressed iron-sulfur cluster biogenesis and electron transport
          chain genes, weakening respiration. In Irp2-null mice the in vivo picture is narrower and more
          informative - Hif2-alpha, not Hif1-alpha, was elevated in tissues, most markedly in the cerebellum
          and spinal cord, the regions the disease targets. Inhibiting Hif2-alpha with PT-2385 prevented
          the neurodegenerative phenotype and restored Purkinje cell architecture, while inhibiting Hif1-alpha
          did not.

          This makes the switch from oxidative phosphorylation to aerobic glycolysis a candidate driver
          rather than a bystander, and it identifies the first druggable node in the pathograph downstream
          of the untreatable primary lesion.'
        biological_processes:
        - preferred_term: cellular response to hypoxia
          modifier: INCREASED
          term:
            id: GO:0071456
            label: cellular response to hypoxia
        - preferred_term: aerobic glycolysis
          modifier: INCREASED
          term:
            id: GO:0006096
            label: glycolytic process
        - preferred_term: oxidative phosphorylation
          modifier: DECREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
        mechanism_confidence: PROVISIONAL
        notes: Marked PROVISIONAL because every observation in this node is murine - MEFs and Irp2-null
          mice. No HIF pathway measurement has been reported in a patient or in patient-derived cells,
          so the arm is a strong mechanistic hypothesis for the human disease rather than an established
          part of it. The discrepancy between the cell-culture result (both subunits up) and the in vivo
          result (Hif2-alpha only) is itself unexplained and is a reason to treat the cell-culture version
          with caution.
      selected_evidence:
        snippet: we used globally Irp2-depleted mouse embryonic fibroblasts (MEFs) and found that Irp2
          ablation significantly induced the expression of both hypoxia-inducible factor subunits, Hif1α
          and Hif2α.
        supports: SUPPORT
