  5a42fca30c3ecb60b5bef2ee9b0b1d121b7255332a55d87add0dd0e9c8582ca2:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Treatment
      assertion:
        name: Investigational - HIF2-alpha inhibition
        description: 'The most developed mechanism-directed lead, and preclinical only. In Irp2-null mice
          the selective HIF2-alpha inhibitor PT-2385 prevented neurodegenerative symptoms and restored
          Purkinje cell architecture, while inhibiting HIF1-alpha with PX-478 did not; PT-2385 also improved
          mitochondrial morphology and suppressed the glycolytic shift. PT-2385 is a small-molecule HIF2-alpha
          inhibitor of the same pharmacological class as belzutifan, the first-in-class HIF-2alpha inhibitor
          developed for clear cell renal carcinoma, so the chemistry is tractable in principle. That class
          comparison also carries a warning specific to this disorder: anaemia is a recognised on-target
          toxicity of belzutifan, and NDCAMA patients are already anaemic. Nothing has been tested in
          a patient and the murine treatment was given to adult animals with a slowly progressive disease,
          which is a poor match for an infant with established developmental arrest.'
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: HIF2-alpha inhibitor (investigational)
      selected_evidence:
        snippet: Consistent with this observation, inhibition of Hif2α by PT-2385, not Hif1α by PX-478,
          prevented neurodegenerative symptoms, which were proved by Purkinje cell arrangement from the
          shrunken and irregular to the full and regular array.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/0
