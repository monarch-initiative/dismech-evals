              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'Two damaged IREB2 alleles are required. All four published probands were compound
          heterozygous - none was homozygous, and no consanguinity is reported in any family. Both parents
          in the fourth family were healthy carriers, confirmed by Sanger sequencing of the paternal and
          maternal alleles, and the proband''s younger brother, who carries only the paternal allele,
          is developing normally. Heterozygous carriers are not described as affected in any report, which
          is consistent with the Ireb2 heterozygous mouse and with IRP2 abundance being regulated post-translationally
          rather than by gene dosage.

          Penetrance is not annotated. With four unrelated probands and no unaffected bi-allelic individual
          described, there is no basis for calling penetrance either complete or reduced; asserting COMPLETE
          from four ascertained cases would be an inference from the ascertainment itself.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Using exome sequencing, we identified the first human with bi-allelic loss-of-function
          variants in the gene IREB2 leading to an absence of IRP2.
        supports: SUPPORT
