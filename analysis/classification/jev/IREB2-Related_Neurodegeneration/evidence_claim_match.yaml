  9d91a2ec4f5b29130f4fc17061ef525dfc8e48937a1f8f0b540d5b8e77efdada:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of IRE-Dependent Post-Transcriptional Control
        biological_scale: MOLECULAR
        description: 'This is the node where a molecular lesion becomes a systems failure. IRPs are the
          sensor arm of a single feedback loop that operates entirely after transcription: bound to a
          5'' IRE they block ribosome loading, bound to a 3'' IRE they protect the transcript from endonucleolytic
          decay. The transcripts involved include the ferritin heavy and light chains and erythroid ALAS2
          (5'' IREs, translationally repressed by IRP binding) and TFRC (3'' IREs, stabilised by IRP binding);
          transcriptome-wide immunoselection has since extended the IRP-bound mRNA set well beyond these
          canonical members and shown that IRP1 and IRP2 have partly non-overlapping target repertoires.

          Without IRP2 the loop reads permanently "iron replete" regardless of the truth: ferritin translation
          is derepressed, so the cell builds storage capacity it does not need and locks iron inside it,
          while TFRC mRNA loses its stabilising protein and decays, so transferrin-mediated uptake falls.
          Both changes push iron the same way - out of the metabolically available pool. That is the specific
          reason the resulting deficiency is a *functional* one that no amount of circulating iron corrects.'
        molecular_functions:
        - preferred_term: iron-responsive element binding
          modifier: DECREASED
          term:
            id: GO:0030350
            label: iron-responsive element binding
        biological_processes:
        - preferred_term: IRE-mediated translational repression of ferritin and ALAS2
          modifier: DECREASED
          term:
            id: GO:0017148
            label: negative regulation of translation
        - preferred_term: IRP-dependent stabilisation of TFRC mRNA
          modifier: DECREASED
          term:
            id: GO:0048255
            label: mRNA stabilization
        - preferred_term: intracellular iron ion homeostasis
          modifier: ABNORMAL
          term:
            id: GO:0006879
            label: intracellular iron ion homeostasis
        protein_complexes:
        - preferred_term: cytosolic ferritin
          modifier: INCREASED
          term:
            id: GO:0070288
            label: ferritin complex
      selected_evidence:
        snippet: Two distinct but highly homologous proteins, IRP1 and IRP2, bind IREs with high affinity
          when cells are depleted of iron, inhibiting translation of some transcripts, such as ferritin,
          or turnover of others, such as the transferrin receptor (TFRC).
        supports: SUPPORT
