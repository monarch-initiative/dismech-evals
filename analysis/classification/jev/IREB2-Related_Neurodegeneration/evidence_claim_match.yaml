        context: []
      assertion_type: Treatment
      assertion:
        name: Investigational - stabilising a degradation-prone IRP2
        description: 'An allele-specific idea rather than a therapy. Because the p.Asp826Val protein is
          lost to the proteasome rather than mis-folded into uselessness, blocking its degradation restores
          both the protein and its regulatory output in cells. The authors of the fourth case report frame
          proteasome inhibition as a potential therapeutic direction. The caveats are severe: MG-132 is
          a research tool with no clinical use, clinically approved proteasome inhibitors are systemically
          toxic and poorly CNS-penetrant, and the strategy could only ever help the subset of patients
          whose alleles are degradation-prone. Restoration of IREB2 expression itself - achieved lentivirally
          in two independent patient cell lines - is the corresponding gene-directed proof of principle.'
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: proteasome inhibition or IRP2 stabilisation (investigational)
      selected_evidence:
        snippet: Moreover, the use of proteasome inhibitors can potentially restore the expression of
          IRP2, highlighting a promising therapeutic target
