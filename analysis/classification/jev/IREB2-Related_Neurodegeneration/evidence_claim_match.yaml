              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Synaptic Failure and Microglial Activation
        biological_scale: CELLULAR
        description: 'The newest and most disease-specific piece of the mechanism, and the only in vivo
          work built on an actual patient allele rather than a null. A CRISPR-Cas9 knock-in mouse homozygous
          for the p.Asp826Val variant found in the Chinese pedigree shows reduced Ireb2 protein, dysregulated
          iron metabolism, impaired spatial learning and memory and reduced motor activity, together with
          increased microglial activation and decreased hippocampal dendritic spine density, impaired
          long-term potentiation and elevated paired-pulse facilitation. That combination - fewer spines,
          weaker potentiation, altered presynaptic release probability, activated microglia - describes
          synaptic failure with neuroinflammation rather than cell loss, and it fits a disorder whose
          human presentation is developmental as much as degenerative: these children largely never acquired
          speech or ambulation rather than losing skills they once had.'
        cell_types:
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        - preferred_term: hippocampal neuron
          term:
            id: CL:0002608
            label: hippocampal neuron
        biological_processes:
        - preferred_term: microglial cell activation
          modifier: INCREASED
          term:
            id: GO:0001774
            label: microglial cell activation
        - preferred_term: long-term synaptic potentiation
          modifier: DECREASED
          term:
            id: GO:0060291
            label: long-term synaptic potentiation
        cellular_components:
        - preferred_term: dendritic spine
          term:
            id: GO:0043197
            label: dendritic spine
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: we establish a CRISPR-Cas9-mediated Ireb2 D826V/D826V mouse model, which carries the
          c.2477A>T (p.D826V) pathogenic variant in IREB2 identified in a Chinese pedigree with NDCAMA.
        supports: SUPPORT
