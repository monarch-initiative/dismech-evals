        name: Functional confirmation in patient-derived cells
        description: Where a variant of uncertain significance is found, the published approach is to
          derive lymphoblastoid cells and measure IRP2 protein, ferritin and transferrin receptor levels,
          labile iron and mitochondrial function, then show that lentiviral restoration of IREB2 reverses
          the abnormalities. This assay set has now been applied in two independent patients and is the
          reference method for demonstrating that a novel IREB2 allele is pathogenic. For alleles suspected
          of destabilising the protein, adding a proteasome inhibitor arm distinguishes accelerated degradation
          from impaired IRE-binding.
