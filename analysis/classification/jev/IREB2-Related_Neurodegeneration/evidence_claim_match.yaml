  97c549de8c3d4de68eef2c19241f5ccfdcf8307c8e0b68aa2df2667775cbb337:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Genetic
      assertion:
        name: IREB2
        association: Bi-allelic loss-of-function or hypomorphic variants; all four reported probands were
          compound heterozygous
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: IREB2
          term:
            id: hgnc:6115
            label: IREB2
        notes: 'Gene identity. HGNC:6115 is the single gene returned by `runoak -i sqlite:obo:mondo relationships
          -p RO:0004003 MONDO:0032758`, with symbol IREB2. The protein is universally called IRP2 in the
          literature, and older papers use the symbol IRP2 or Ireb2 interchangeably; every source cited
          here was checked to be about that protein.

          Allelic series across the four published patients, as summarised in PMID:39587636. Patient 1:
          two nonsense alleles, c.1069G>T (p.Gly357*) and c.1255C>T (p.Arg419*). Patient 2: a missense
          allele c.2353G>A (p.Gly785Arg) with a three-base in-frame deletion c.1329_1331del (p.Ser444del).
          Patient 3: two missense alleles, c.656A>C (p.Glu219Ala) and c.2240G>A (p.Gly747Glu). Patient
          4: two missense alleles, c.1111A>G (p.Ile371Val) and c.2477A>T (p.Asp826Val), reported against
          GenBank NM_004136.2 and located in exons 9 and 20. The per-variant cDNA and protein designations
          for patients 1 to 3 appear in the full text of PMID:39587636 in text that is broken by PDF line-wrap
          hyphenation and so cannot be quoted verbatim; they are recorded here as notes, with the quotable
          allele-class statements attached as evidence.

          Genotype-function correlation, which is the useful part. Complete absence of protein (patient
          1, nonsense alleles, attributed to nonsense-mediated decay) and near-complete functional loss
          (patients 2 and 3) have both produced severe disease. In patient 4 the two alleles were assayed
          separately - the only such experiment in this literature - and behaved very differently: c.2477A>T
          destabilised IRP2 and disturbed iron handling, while c.1111A>G did neither on its own. This
          is the first functional evidence that IREB2 alleles form a graded series, and it is the basis
          for expecting milder, still-unascertained phenotypes at the hypomorphic end.

          Not asserted. No population allele frequency, gnomAD constraint metric or ClinVar classification
          is recorded anywhere in this entry - none was retrieved from an authoritative source during
          this curation. The fourth patient''s variants were reported as absent from HGMD and ClinVar
          at the time of that publication, which is a statement about those databases in 2024 and is not
          restated here as a current fact.'
      selected_evidence:
        snippet: Using exome sequencing, we identified the first human with bi-allelic loss-of-function
          variants in the gene IREB2 leading to an absence of IRP2.
        supports: SUPPORT
