          patient has been compound heterozygous, and both parents were unaffected carriers. Every published
          patient reached diagnosis through broad sequencing rather than through a targeted clinical suspicion:
          exome sequencing in the index case, and whole-exome or parallel gene sequencing across the reported
          series. The most likely pre-genetic label is dystonic cerebral palsy, which the index patient
          carried, so reanalysis of undiagnosed cerebral-palsy-like exomes is a reasonable route to further
          cases.'
