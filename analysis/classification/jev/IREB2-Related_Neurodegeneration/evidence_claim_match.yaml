            id: CHEBI:28783
            label: zinc protoporphyrin
        notes: Species scope. The protoporphyrin findings and the absent marrow iron stores are murine.
          The human evidence for this node is the observation of mild microcytic anaemia with normal serum
          iron in the reported patients, plus the shared upstream mechanism. Free and zinc protoporphyrin
          have not, to this curation's knowledge, been measured in an IREB2 patient; if they were, the
          mouse predicts they would be raised, and this is the single cheapest test that could confirm
          or refute the model in a human.
      selected_evidence:
        snippet: Marked overexpression of 5-aminolevulinic acid synthase 2 (Alas2) results from loss of
          IRP-dependent translational repression, and markedly increased levels of free protoporphyrin
