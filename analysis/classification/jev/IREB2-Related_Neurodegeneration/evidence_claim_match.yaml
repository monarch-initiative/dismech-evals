  ab1ccc300a7330bfb32a5e7bf01e0748a1a373d3643ca6f9de48a52845a62487:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Ireb2 D826V/D826V knock-in (CRISPR-Cas9)
        category: Knock-in of a patient allele
        description: 'The first model of an actual patient variant rather than of gene ablation, generated
          from the p.Asp826Val allele of the Chinese proband. Homozygotes show reduced Ireb2 protein,
          dysregulated iron metabolism, impaired spatial learning and memory, reduced motor activity,
          increased microglial activation, decreased hippocampal dendritic spine density, impaired long-term
          potentiation and elevated paired-pulse facilitation. It moves the mechanism from iron chemistry
          into synaptic biology and neuroinflammation, and it is the model in which allele-specific therapeutic
          ideas such as IRP2 stabilisation could be tested.

          Its limitations are the obvious ones. It is homozygous for an allele that occurs in patients
          only in the compound heterozygous state, it has been reported once, and its behavioural readouts
          (Morris water maze, open field, Y-maze) address learning and activity rather than the dystonia
          and choreoathetosis that dominate the human phenotype. No haematological phenotype is reported
          in the cached abstract.'
        associated_phenotypes:
        - Impaired spatial learning and memory
        - Reduced motor activity
        - Increased microglial activation in the hippocampus
        - Decreased dendritic spine density
        - Impaired long-term potentiation with elevated paired-pulse facilitation
        - Reduced Ireb2 protein with dysregulated iron metabolism
      selected_evidence:
        snippet: However, the absence of an IREB2-mutated animal model has left the underlying pathogenic
          mechanisms poorly understood.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41234066
      reference_title: The D826V point mutation in IREB2 causes early-onset neurodegeneration in mice.
      evidence_source: MODEL_ORGANISM
      explanation: The authors' statement of the gap this model fills, which is also the reason the older
        null mouse cannot answer allele-specific questions.
