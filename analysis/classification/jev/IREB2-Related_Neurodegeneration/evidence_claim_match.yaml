  a590df4a407a277ffd17c54f773f7bc6ba3a31d044594a8f99b3c9fb534398e2:
    claim:
      about:
        disease:
          name: IREB2-Related Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, early-onset, with choreoathetoid movements and microcytic
              anemia
            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extrapyramidal Movement Disorder and Neurodevelopmental Arrest
        biological_scale: ORGANISM
        description: 'The clinical endpoint. All four patients converge on the same picture: neonatal
          feeding difficulty and hypotonia, then profound global developmental delay with no speech and
          no independent ambulation, severe dystonia and choreoathetoid movements, and epilepsy or EEG
          abnormality. The movement disorder has been explicitly described as treatment-resistant. The
          phenotype is developmental and degenerative at once, which is why the first patient carried
          a diagnosis of dystonic cerebral palsy before exome sequencing reassigned it - a mislabelling
          that any child with this genotype is likely to receive first.'
        notes: 'The Irp2-null mouse produces a strikingly parallel behavioural syndrome - motor deficits
          on rotarod and hanging wire, somatosensory impairment on hot and cold plate, impaired spatial
          search and impaired reversal learning, the last a prefrontal-dependent task. It is a genuine
          convergence rather than a superficial one, but the movement phenotypes are not the same: the
          mouse has ataxia, bradykinesia and tremor, whereas the human disorder is dominated by dystonia
          and choreoathetosis. That difference is not explained.'
      selected_evidence:
        snippet: These results suggest that loss of Irp2 in mice causes motor and behavioral deficits
          that faithfully reflect the IREB2 patient's neurodegenerative disorder.
        supports: SUPPORT
