            term:
              id: MONDO:0032758
              label: neurodegeneration, early-onset, with choreoathetoid movements and microcytic anemia
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Ireb2 (Irp2) targeted null, homozygous
        category: Knockout
        description: 'The founding model, and the reason the human disorder was recognisable when the
          first patient appeared. Irp2-null mice misregulate iron metabolism in the intestinal mucosa
          and the central nervous system, overexpress ferritin and express abnormally low transferrin
          receptor in multiple tissues, and develop in adulthood a movement disorder of ataxia, bradykinesia
          and tremor on a background of progressive neurodegeneration with widespread axonal degeneration
          and neuronal loss. Iron and ferritin accumulate in white matter tracts and in the neurons that
          later die, months before symptoms. In the erythron the same lesion produces iron-limited erythropoiesis
          with absent marrow iron stores, microcytic anaemia and, through ALAS2 derepression, an erythropoietic
          protoporphyria.

          Extensive behavioural phenotyping has since shown motor deficits on rotarod and hanging wire,
          somatosensory impairment on hot and cold plate testing, impaired spatial search in the Barnes
          maze and impaired reversal learning on an operant touchscreen task - a prefrontal-dependent
          measure. The authors read this as faithfully reflecting the patient''s disorder.

          The mismatches are as informative as the matches, and are curated as a discussion below: the
          mouse''s disease is adult-onset and slowly progressive where the human disease is manifest from
          infancy, its anaemia and protoporphyria are more severe than anything reported in a patient,
          its movement disorder is ataxic and hypokinetic rather than dystonic and choreoathetoid, and
          it accumulates brain iron in a way no patient has been shown to do.'
        associated_phenotypes:
        - Ataxia, bradykinesia and tremor in adulthood
        - Progressive neurodegeneration with axonal degeneration and neuronal loss
        - Brain iron and ferritin accumulation preceding symptoms
        - Microcytic anaemia with absent bone marrow iron stores
        - Erythropoietic protoporphyria with raised free and zinc protoporphyrin
        - Motor, somatosensory and executive deficits on behavioural testing
      selected_evidence:
        snippet: In adulthood, Ireb2(-/-) mice develop a movement disorder characterized by ataxia, bradykinesia
          and tremor.
        supports: SUPPORT
