  bc631313770c576a9ff7981c2ce70b9af79f730f78eec25341334b09540f1429:
    claim:
      about:
        disease:
          name: IRF1 Deficiency
          disease_term:
            preferred_term: IRF1 deficiency
            term:
              id: MONDO:0958011
              label: immunodeficiency 117
        context: []
      assertion_type: Treatment
      assertion:
        name: Hematopoietic Stem Cell Transplantation
        description: Because the defect is an abolished cellular response to IFN-gamma rather than impaired
          IFN-gamma production, replacing the hematopoietic compartment is the therapeutic route that
          addresses the mechanism. Reviews of MSMD identify transplantation, with gene therapy as a prospect,
          as the option for patients whose response to the cytokine is abolished.
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: 'Recombinant IFN-gamma is deliberately not listed as a treatment for this entry. It benefits
          MSMD patients whose defect is impaired IFN-gamma production; an IRF1 defect lies downstream
          of the receptor, so supplying more of the cytokine has no mechanistic route to restore the missing
          transcriptional response.

          Recorded so a future editor does not "correct" this omission without the argument: P1 was in
          fact receiving recombinant IFN-gamma, and mycobacterial disease recurred anyway. The clinical
          course is therefore consistent with the mechanistic reasoning rather than against it, and the
          drug is cited on the antimycobacterial pharmacotherapy entry above as part of the regimen that
          failed rather than as a treatment this entry endorses.'
      selected_evidence:
        snippet: for patients with abolished response to this cytokine, hematopoietic stem cell transplantation
          (HSCT) and promising gene therapy are the only current therapeutic options
        supports: SUPPORT
