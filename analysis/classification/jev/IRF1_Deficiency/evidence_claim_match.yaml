            preferred_term: IRF1 deficiency
            term:
              id: MONDO:0958011
              label: immunodeficiency 117
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: irf1_interferon_arm_asymmetry
        hypothesis_label: IRF1 is essential for the IFN-gamma arm and redundant for the IFN-alpha/beta
          arm despite being induced by both
        status: CANONICAL
        description: 'IRF1 is induced by both type I and type II interferons, which predicts a combined
          antiviral and antimycobacterial defect. The observed phenotype contradicts that prediction:
          mycobacterial disease is severe and early-onset, while antiviral immunity is essentially preserved.
          Two independent lines of evidence support the asymmetry rather than ascertainment - the clinical
          course (no severe viral disease despite documented exposure to many viruses, including SARS-CoV-2,
          which is life-threatening in impaired type I interferon immunity) and the cellular phenotype
          (intrinsic immunity to nine viruses almost normal in IRF1-deficient fibroblasts). The interpretation
          is that IRF1 carries a much larger share of the IFN-gamma-induced response than of the IFN-alpha/beta
          response, so other effectors cover for its loss in the type I arm but not the type II arm. This
          is recorded as CANONICAL rather than EMERGING because the negative antiviral result is experimentally
          demonstrated across nine viruses rather than merely unobserved.'
      selected_evidence:
        snippet: IFN-α/β-dependent intrinsic immunity to nine viruses, including SARS-CoV-2, is almost
          normal in IRF1-deficient fibroblasts.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
