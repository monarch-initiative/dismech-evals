            description: IFN-gamma binds an intact receptor and signals normally, but the IRF1-dependent
              arm of the induced transcriptional response is absent. The defect is therefore in the response
              to the cytokine rather than in its production - a distinction that separates this disease
              from the MSMD etiologies caused by impaired IL-12/IL-23-driven IFN-gamma output, and that
              determines which treatments can work.
            biological_scale: CELLULAR
            biological_processes:
            - preferred_term: Cellular response to interferon-gamma
              term:
                id: GO:0071346
                label: cellular response to type II interferon
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Loss of Macrophage Antimycobacterial Effector Function
        causal_link_type: DIRECT
        description: The IRF1-dependent genes are the ones that arm the mononuclear phagocyte against
          intracellular mycobacteria, so their absence disarms the cell.
      selected_evidence:
        snippet: IRF1-deficient mononuclear phagocytes do not control mycobacteria and related pathogens
          normally when stimulated with IFN-γ.
        supports: SUPPORT
    origin:
