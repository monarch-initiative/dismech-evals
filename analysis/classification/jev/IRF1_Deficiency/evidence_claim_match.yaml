  0654bb3bc6b8a2bab1016d0f9244d0f1f64e9c533cf07765451f42dc842c2db3:
    claim:
      about:
        disease:
          name: IRF1 Deficiency
          disease_term:
            preferred_term: IRF1 deficiency
            term:
              id: MONDO:0958011
              label: immunodeficiency 117
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IRF1 Loss of Function
        description: Biallelic loss-of-function IRF1 variants abolish the transcription factor entirely.
          IRF1 is not itself an interferon receptor or a signalling kinase; it is the induced transcriptional
          effector through which interferon signalling is converted into a change in gene expression,
          so its loss leaves upstream receptor and JAK-STAT signalling intact while removing the transcriptional
          output that depends on it.
        biological_scale: MOLECULAR
        genetic_context:
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Both reported patients are homozygous for a germline nonsense allele from a consanguineous
            kindred, and no truncated protein is detectable, so the functional consequence is complete
            loss of function rather than a hypomorphic effect.
      selected_evidence:
        snippet: We describe unrelated children with inherited complete IRF1 deficiency and early-onset,
          multiple, life-threatening diseases caused by weakly virulent mycobacteria and related intramacrophagic
          pathogens.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36736301
      reference_title: Human IRF1 governs macrophagic IFN-γ immunity to mycobacteria.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies complete IRF1 deficiency in unrelated children as the cause of the disease.
