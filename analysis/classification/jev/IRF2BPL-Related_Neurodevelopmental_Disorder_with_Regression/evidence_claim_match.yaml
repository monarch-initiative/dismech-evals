          a hyphenated line break in the extracted full text ("ocular distur-" / "bances (12/28)"), so
          no verbatim substring states the fraction, and reproducing the extraction artefact as a snippet
          would put a broken word on the page. The FREQUENT band is instead cited to the two clean sentences
          below, which place this domain in the same "relatively high frequency" group as the four features
          whose fractions are quotable and which run 36% to 75%.'
        phenotype_term:
          preferred_term: Ocular disturbance
          term:
            id: HP:0000478
            label: Abnormality of the eye
