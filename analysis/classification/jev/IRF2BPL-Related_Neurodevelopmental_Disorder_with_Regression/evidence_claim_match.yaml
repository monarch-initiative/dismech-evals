  fb94f59a1aa7d1cb6b5388a04098ec6ef6ed4c286c8c39e80e97cdba1b9dc06e:
    claim:
      about:
        disease:
          name: IRF2BPL-Related Neurodevelopmental Disorder with Regression
          disease_term:
