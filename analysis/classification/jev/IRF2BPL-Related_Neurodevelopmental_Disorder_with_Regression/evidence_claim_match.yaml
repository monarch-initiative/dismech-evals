          in 9, 6-10 years in 3, and 10-23 years in 5; GeneReviews puts the full span from the first year
          to the sixth decade. Severity does not track onset age - the review found no correlation between
          the two - which is the observation the `irf2bpl_onset_age_range` discussion is about.
      selected_evidence:
        snippet: Onset is highly variable and can be in the first year of life through the sixth decade.
