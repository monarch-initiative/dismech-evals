              and seizures
            term:
              id: MONDO:0060759
              label: neurodevelopmental disorder with regression, abnormal movements, loss of speech,
                and seizures
        context: []
      assertion_type: Genetic
      assertion:
        name: IRF2BPL
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        gene_term:
          preferred_term: IRF2BPL
          term:
            id: hgnc:14282
            label: IRF2BPL
        notes: 'Nonsense and frameshift variants predominate and remove the C-terminal RING-finger domain
          required for IRF2BPL''s transcriptional repressive and transactivating properties. Missense
          variants are reported and give a milder phenotype than nonsense alleles.

          The `genetic_context.functional_impact_category: DOMINANT_NEGATIVE` on the initiating pathophysiology
          node, rather than LOSS_OF_FUNCTION, is a deliberate call, and it is the point of the entry.
          The gene is intronless, the premature-stop transcript escapes nonsense-mediated decay and is
          expressed roughly 1:1 with the wild-type allele, and the resulting truncated protein sequesters
          full-length IRF2BPL into cytoplasmic aggregates. That is interference with the remaining wild-type
          product, which is what DOMINANT_NEGATIVE means here, not a halved dose.

          Variant position may matter, though it is not established. The three adults who presented as
          progressive myoclonus epilepsy all carried protein-truncating variants clustered in a proximal,
          highly conserved region around the coiled-coil domain, which hints at a positional effect on
          presentation and onset age. Set against that, the 28-patient systematic review found no significant
          correlation between the number of affected clinical domains and variant type, so the clustering
          is a lead rather than a genotype-phenotype rule. See the `irf2bpl_onset_age_range` discussion.'
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: We identified 11 unrelated individuals with DEE and de novo heterozygous truncating variants
          in the interferon regulatory factor 2-binding protein-like gene (IRF2BPL).
        supports: SUPPORT
    origin:
