  e4d3f917a60da89f4d2468920859fa12e33338bc534adef13d5570cb055a5a14:
    claim:
      about:
        disease:
          name: IRIDA Syndrome
          disease_term:
            preferred_term: Iron-refractory iron deficiency anemia
            term:
              id: MONDO:0008788
              label: IRIDA syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Treatment Response
        name: Refractoriness to Oral Iron
        frequency: VERY_FREQUENT
        description: 'Not a symptom but a therapeutic-response phenotype, and it is close to being part
          of the disease definition rather than an outcome of it - the entity was delimited by the failure
          of oral iron in multiplex kindreds before the gene was known. Curated here so it is queryable
          rather than buried in the treatment section.

          Banded VERY_FREQUENT rather than OBLIGATE, and the demotion is evidence-led rather than cautious.
          Two siblings with compound heterozygous TMPRSS6 variants already reported in classic IRIDA have
          been maintained on low-dose oral iron alone since diagnosis. One published exception is enough
          to make an OBLIGATE band false, and this exception is well characterised: genotype-confirmed,
          and reported precisely because it expands the disease spectrum.'
        phenotype_term:
          preferred_term: Iron deficiency anemia unresponsive to oral iron
          term:
            id: HP:0001891
            label: Iron deficiency anemia
        notes: 'The HP binding is deliberately the general term HP:0001891 "Iron deficiency anemia". HPO
          has no term for refractoriness to a specific therapy, so the treatment-response part of this
          phenotype lives in preferred_term and the description rather than in the ontology binding. Do
          not substitute a narrower-sounding term that does not mean this.

          Note the tension this phenotype now carries and should keep carrying: the disease is *named*
          for oral-iron refractoriness, and a genotype-confirmed kindred responds to oral iron. Both are
          true. Resolving it by dropping either the name or the exception would lose information.'
      selected_evidence:
        snippet: abnormal iron absorption characterized by no hematological improvement following treatment
          with oral iron
        supports: SUPPORT
