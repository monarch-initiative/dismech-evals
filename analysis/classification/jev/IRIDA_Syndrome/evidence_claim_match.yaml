        notes: 'The single most informative test in the differential, precisely because the abnormality
          is directional rather than a threshold crossing. A hepcidin value that would be unremarkable
          in a healthy person is abnormal in a patient with a transferrin saturation of five percent.

          No reference range is curated here on purpose. Hepcidin immunoassays and mass-spectrometry methods
          are not harmonised, absolute values are not comparable between laboratories, and there is no
          consensus adult interval to cite - so a numeric range in this entry would be a false precision.
          See the knowledge-gap discussion on assay standardisation.'
      selected_evidence:
        snippet: Hallmarks of this disease are microcytic hypochromic anemia, low transferrin saturation
          and normal/high serum hepcidin values.
        supports: SUPPORT
