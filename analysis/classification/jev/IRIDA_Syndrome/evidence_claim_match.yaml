  b2bc33de1eeb872d4aea44d0fe17a5632f811baab01369d86d1cd4f422e688e6:
    claim:
      about:
        disease:
          name: IRIDA Syndrome
          disease_term:
            preferred_term: Iron-refractory iron deficiency anemia
            term:
              id: MONDO:0008788
              label: IRIDA syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: irida_neogenin_liver_versus_cell_line
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does matriptase-2 cleave its partners in the liver the way it does in cultured hepatoma
          cells, and which system should a variant's functional assay be run in?
        attaches_to:
        - pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin
        rationale: 'Nearly all the functional evidence for this disease is transfected-cell biochemistry,
          and there is now a direct demonstration that at least one of those cell-line results does not
          hold in vivo.

          Matriptase-2 cleaves neogenin and sharply reduces neogenin levels in cultured hepatoma cells.
          In mouse liver it does the opposite - it stabilises neogenin - and matriptase-2''s suppression
          of hepcidin turns out to require neogenin to be present. The same protease, the same partner,
          opposite directions in the two systems.

          That is a `HUMAN_MODEL_MISMATCH` rather than a `KNOWLEDGE_GAP` in the strict sense used here:
          the evidence exists and is good, and what is uncertain is which system''s answer describes a
          patient''s hepatocyte. The practical stake is variant interpretation. A novel TMPRSS6 missense
          variant is currently assessed by exactly the transfected-cell cleavage assay whose fidelity
          this result puts in question, and a variant that cleaves normally in a hepatoma line is not
          thereby shown to be benign.

          Note the mismatch here is model-to-model, mouse liver against human cell line, with the human
          hepatocyte unobserved in both. That makes it a weaker claim about human biology than the label
          might suggest, and a stronger one about not trusting the cell line alone.'
        proposed_experiments:
        - experiment_id: exp_irida_cleavage_assay_system_comparison
          name: Same-allele comparison across hepatoma line, primary hepatocyte and liver
          description: Run the same panel of IRIDA missense alleles through the haemojuvelin and neogenin
            cleavage assays in a hepatoma line, in primary or iPSC-derived human hepatocytes, and in humanised
            mouse liver, and compare the rank order of functional impairment across the three systems.
            Concordant rank order would license continued use of the cheap assay; discordance would say
            which alleles have been misclassified.
          would_support:
          - pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin
          supporting_outcome:
          - Allele impairment ranks the same way in the hepatoma line as in hepatocytes and liver, so
            the cell-line assay is a valid surrogate.
          would_refute:
          - pathophysiology#Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin
          refuting_outcome:
          - Alleles that look severely impaired in the hepatoma line behave normally in hepatocytes or
            liver, or the reverse.
      selected_evidence:
        snippet: In contrast to the observations that Mt2 cleaves Neo1 and markedly reduces Neo1 levels
          in cultured hepatoma cells, we found that Mt2 stabilizes Neo1 in murine liver.
        supports: SUPPORT
