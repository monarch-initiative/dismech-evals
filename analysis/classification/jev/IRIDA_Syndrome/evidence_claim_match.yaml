              label: IRIDA syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Oral Iron
        description: Curated because it is what patients are given for years before the diagnosis is made,
          not because it works. It does not.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: iron
            term:
              id: CHEBI:29033
              label: iron(2+)
        notes: 'No target_mechanisms link is curated for oral iron, and the omission is deliberate: the
          drug does not act on any node in this pathograph, which is precisely the clinical point. That
          holds for the ascorbate combination too - ascorbate acts on luminal iron reduction and uptake,
          upstream of the ferroportin export step that hepcidin blocks, so even a real effect would not
          be acting on a node curated here.

          The two evidence items on this treatment deliberately disagree, and the disagreement is the
          content. One is a defining-cohort negative result, the other a seven-patient uncontrolled positive
          result in a phenotypically defined group. Collapsing them to a single grade would misrepresent
          the literature.'
      selected_evidence:
        snippet: abnormal iron absorption characterized by no hematological improvement following treatment
          with oral iron
        supports: REFUTE
