      reference_title: Functional and clinical impact of novel TMPRSS6 variants in iron-refractory iron-deficiency
        anemia patients and genotype-phenotype studies.
      evidence_source: IN_VITRO
      explanation: 'Extends the cleavage mechanism from one allele to a series of human IRIDA missense
        variants, with an explicit exception.

        The quoted sentence contains the source''s own spelling, "autoproteotylic". It is a typographical
        error for "autoproteolytic" and it is reproduced exactly because the cache is the authority for
