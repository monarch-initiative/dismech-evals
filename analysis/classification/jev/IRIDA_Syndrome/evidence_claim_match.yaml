    claim:
      about:
        disease:
          name: IRIDA Syndrome
          disease_term:
            preferred_term: Iron-refractory iron deficiency anemia
            term:
              id: MONDO:0008788
              label: IRIDA syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic TMPRSS6 Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'Germline TMPRSS6 variants - frameshift, splice-junction, nonsense and missense -
          on both alleles. In the defining cohort every variant lay distal to exon 8, in the region encoding
          the conserved ectodomain modules and especially the trypsin-like serine protease domain, and
          homozygous frameshifts predicted to disrupt only the catalytic domain were sufficient to cause
          disease.

          The reported allelic spectrum has since broadened across the whole large ectodomain rather than
          concentrating in the catalytic domain, which is why a novel missense variant outside the protease
          domain cannot be dismissed on position alone.'
        genes:
        - preferred_term: TMPRSS6
          term:
            id: hgnc:16517
            label: TMPRSS6
        molecular_functions:
        - preferred_term: matriptase-2 serine protease activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Here, we show that iron deficiency anemia refractory to oral iron therapy can be caused
          by germline mutations in TMPRSS6, which encodes a type II transmembrane serine protease produced
          by the liver that regulates the expression of the systemic iron regulatory hormone hepcidin.
        supports: SUPPORT
