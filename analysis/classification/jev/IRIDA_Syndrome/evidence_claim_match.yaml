  2b4745adea709cf4da915fd7052b770e03619d4ff2bbe56cd865ba516212172b:
    claim:
      about:
        disease:
          name: IRIDA Syndrome
          disease_term:
            preferred_term: Iron-refractory iron deficiency anemia
            term:
              id: MONDO:0008788
              label: IRIDA syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Matriptase-2 Cleavage of Membrane Hemojuvelin
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'Matriptase-2 cleaves haemojuvelin at the plasma membrane. Haemojuvelin is a BMP
          co-receptor that drives HAMP transcription, so removing it from the hepatocyte surface lowers
          hepcidin; failing to remove it keeps hepcidin up.

          Graded PROVISIONAL, and the reason is specific rather than generic caution. The supporting evidence
          is strong for the reaction and weak for the location. Eight IRIDA missense alleles were assayed
          and seven of them impair matriptase-2 autoactivation, reduce membrane haemojuvelin cleavage,
          and fail to inhibit haemojuvelin-dependent hepcidin activation - a genotype-activity correspondence
          across human disease alleles, not a single anecdote. But every one of those measurements is
          in transfected cells, none is in a patient hepatocyte, and in vivo mouse work finds the liver
          behaving differently from hepatoma cells for an adjacent substrate.

          The sharper problem is that in vivo dissection has since shown the catalytic domain to be required
          for hepcidin suppression while its proteolytic activity is not. The cleavage reaction is real
          and human disease alleles impair it; what is in doubt is whether the suppression runs through
          it. This node is retained rather than deleted for that reason, and the discussions carry the
          argument.'
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: BMP signaling through membrane hemojuvelin
          modifier: INCREASED
          term:
            id: GO:0030509
            label: BMP signaling pathway
      selected_evidence:
        snippet: Matriptase-2 cleaves hemojuvelin (HJV), a regulator of hepcidin, on plasma membrane;
          matriptase-2(MASK) shows no cleavage activity and the human mutant only partial cleavage capacity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18976966
      reference_title: The serine protease matriptase-2 (TMPRSS6) inhibits hepcidin activation by cleaving
