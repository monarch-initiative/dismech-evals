  84e6d1c587791ffab1a99b2630b90674453b3041a6568d434831fab014914161:
    claim:
      about:
        disease:
          name: IRIDA Syndrome
          disease_term:
            preferred_term: Iron-refractory iron deficiency anemia
            term:
              id: MONDO:0008788
              label: IRIDA syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acquired iron deficiency anemia
        description: 'The differential that matters, because it is overwhelmingly more common and the
          two overlap heavily on a full blood count and iron panel. They are not strictly indistinguishable:
          measured head to head, IRIDA patients had lower MCV and higher ferritin than iron-deficient
          controls, both significantly. But those are group differences with overlapping distributions,
          not a rule for an individual, and the ferritin difference points the counter-intuitive way -
          higher in the patient with the genetic iron-handling defect.

          The separating test is hepcidin, read against the transferrin saturation: suppressed in acquired
          deficiency, not suppressed in IRIDA. The therapeutic trial separates them too, but only after
          months of ineffective treatment, and a genotype-confirmed kindred responsive to oral iron shows
          even that is not absolute.'
        distinguishing_features:
        - Hepcidin is low or undetectable in acquired iron deficiency, but within or above the normal
          range in IRIDA despite an equally low transferrin saturation.
        - Ferritin is significantly higher in IRIDA than in acquired iron deficiency, because the iron
          is sequestered rather than absent - the opposite of the naive expectation.
        - A haematological response to oral iron argues strongly against IRIDA, but does not exclude it;
          a genotype-confirmed kindred has been maintained on low-dose oral iron alone.
      selected_evidence:
        snippet: In contrast to the low/undetectable hepcidin levels observed in acquired iron deficiency,
          in patients with Matriptase-2 deficiency, serum hepcidin is inappropriately high for the low
          iron status
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23729726
      reference_title: Iron refractory iron deficiency anemia.
      evidence_source: HUMAN_CLINICAL
      explanation: States the discriminating direction of the hepcidin result between the two conditions.
