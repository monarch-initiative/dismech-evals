        description: 'The functional lesion stated at the level the disease is actually defined by: TMPRSS6
          is the component that lets the liver register iron deficiency and shut off HAMP transcription.
          The mask mouse maps this directly - a splicing defect in Tmprss6 produces microcytic anaemia
          through reduced dietary iron absorption caused by high hepcidin.

          Note that the mouse work locates the Hamp-suppressing activity in the TMPRSS6 cytoplasmic domain
          acting on proximal promoter elements. That is a different molecular route from ectodomain cleavage
          of haemojuvelin, and the two are curated as parallel arms rather than as one chain.'
