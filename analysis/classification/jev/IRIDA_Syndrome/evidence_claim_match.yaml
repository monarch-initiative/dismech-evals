  6fcd5ea8020e7b8b4dc40669e6e4f8f184b0340aa84edcf10c763ea71066b42c:
    claim:
      about:
        disease:
          name: IRIDA Syndrome
          disease_term:
            preferred_term: Iron-refractory iron deficiency anemia
            term:
              id: MONDO:0008788
              label: IRIDA syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Laboratory
        name: Serum Ferritin Inappropriately Preserved
        frequency: VERY_FREQUENT
        description: 'The lab value that most cleanly separates IRIDA from acquired iron deficiency, and
          it separates them by not being low enough. Ferritin in IRIDA sits in the low-normal range because
          the body''s iron is misplaced rather than absent - hepcidin holds it in macrophages - whereas
          in acquired deficiency the stores really are empty. Measured head to head, ferritin was significantly
          higher in IRIDA patients than in iron-deficient controls at p < 0.001.

          The direction of the abnormality is therefore the opposite of what "iron deficiency anaemia"
          leads a reader to expect, which is why it is curated as a phenotype in its own right rather
          than left implicit.'
        phenotype_term:
          preferred_term: Serum ferritin inappropriately preserved for the degree of iron deficiency
          term:
            id: HP:0040133
            label: Abnormal circulating ferritin concentration
        notes: 'Bound to the general term HP:0040133 "Abnormal circulating ferritin concentration" rather
          than to the increased or decreased child terms, and the choice is deliberate. The finding is
          neither: it is a value that would be unremarkable in isolation and is abnormal only relative
          to the iron status. This is the same ontology gap as the hepcidin binding in this entry - HPO
          represents direction of change but not inappropriateness for a physiological context - and both
          are recorded in `notes` rather than papered over with a child term that asserts a direction
          the patients do not reliably show.'
      selected_evidence:
        snippet: develop microcytic anemia with remarkably low transferrin saturation (TSAT), low-normal
          ferritin levels, and a poor response to oral iron treatment
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/4
      evidence_path: /phenotypes/4/evidence/1
      context_paths:
