    evidence_metadata:
      reference: PMID:30594846
      reference_title: Favourable improvement in haematological parameters in response to oral iron and
        vitamin C combination in children with Iron Refractory Iron Deficiency Anemia (IRIDA) phenotype.
      evidence_source: HUMAN_CLINICAL
      explanation: Points the other way from the item above and is graded PARTIAL rather than SUPPORT
        for two reasons stated by the source itself. The cohort is seven children, uncontrolled and unblinded;
        and the paper's own title describes them as having the IRIDA *phenotype*, not confirmed biallelic
        TMPRSS6 genotype, so some may have had oral-iron-responsive iron deficiency that IRIDA was never
        the explanation for. This is evidence that the combination deserves a trial, not that the refractoriness
        claim is wrong.
