  0bd9d5e78a86e58b358cd817c924f97f2a930026767bfa1154fe86cf6711a1fc:
    claim:
      about:
        disease:
          name: IRIDA Syndrome
          disease_term:
            preferred_term: Iron-refractory iron deficiency anemia
            term:
              id: MONDO:0008788
              label: IRIDA syndrome
        context: []
      assertion_type: Definition
      assertion:
        name: Transferrin saturation to hepcidin ratio
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        scope: Early discrimination of TMPRSS6-related IRIDA from other causes of iron deficiency anaemia,
          in a patient already found to be iron deficient.
        description: 'A single computable quantity - transferrin saturation in percent divided by plasma
          hepcidin-25 in nM - with a derived threshold of 5.6 %/nM. Below the threshold suggests IRIDA;
          above it suggests iron deficiency from another cause.

          The ratio is the right form for this test because the abnormality it detects is relative. Neither
          the transferrin saturation nor the hepcidin level is diagnostic alone: a patient with acquired
          iron deficiency and an IRIDA patient can share a transferrin saturation, and a hepcidin value
          that is normal in absolute terms is the abnormal finding here. Dividing one by the other is
          what turns "inappropriately high for the iron status" into a number.

          Two preconditions are part of the rule, not caveats attached to it. It applies only when the
          patient has had no iron therapy in the preceding three months and has no moderate-to-severe
          inflammation, because both raise hepcidin independently of TMPRSS6 and would push a control
          across the threshold.'
        inclusion_criteria:
        - preferred_term: Established iron deficiency anaemia
          description: Iron deficiency anaemia already demonstrated on standard haematological and iron
            indices.
        - preferred_term: No iron therapy in the previous three months
          description: The derivation cohort's controls were required to be iron-therapy naive over this
            window, because administered iron raises hepcidin directly.
        - preferred_term: C-reactive protein below 10.0 mg/L
          description: The inflammation ceiling used in the derivation study, excluding moderate-to-severe
            inflammation.
        - preferred_term: Hepcidin-25 measured by a mass-spectrometry-calibrated method
          description: The threshold is expressed in nM against standardised isotope dilution mass spectrometry
            and is not portable to an uncalibrated immunoassay.
        exclusion_criteria:
        - preferred_term: Recent oral or parenteral iron therapy
          description: Raises hepcidin independently of TMPRSS6 and can move an IRIDA patient above the
            threshold, producing a false negative.
        - preferred_term: Moderate-to-severe inflammation
          description: Raises hepcidin through the inflammatory axis and reproduces the IRIDA pattern
            in a patient who does not have it.
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: 'Validated against TMPRSS6 genotype as the reference standard, which is the correct
            gold standard for this question, and the discrimination was complete: area under the curve
            1.000, sensitivity and specificity both 100%.

            Recorded as VALIDATED_AGAINST_GOLD_STANDARD on that basis, with the qualification that this
            is a derivation study rather than an external validation. Twenty registry-ascertained IRIDA
            patients and 39 selected controls is a small and enriched sample; the confidence intervals
            the authors report are the honest summary of the precision, and they themselves ask for further
            exploration in a broader population. No independent cohort has been reported applying the
            5.6 %/nM threshold.'
        attaches_to:
        - biochemical#Serum hepcidin
        - biochemical#Transferrin saturation
        - pathophysiology#Inappropriately Elevated Circulating Hepcidin
        notes: The 5.6 %/nM threshold is method-bound. Hepcidin was measured by standardised isotope dilution
          mass spectrometry, and routine hepcidin immunoassays are not calibrated to it, so the numeric
          cut-off cannot be carried to another laboratory without cross-calibration. Applying it to an
          uncalibrated immunoassay result would be a units error dressed as a diagnosis.
      selected_evidence:
        snippet: IRIDA patients had significantly lower TSAT/hepcidin ratios compared to IDA controls,
          median 0.6%/nM (interquartile range, IQR, 0.4-1.1%/nM) and 16.7%/nM (IQR, 12.0-24.0%/nM), respectively.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35163840
      reference_title: Transferrin Saturation/Hepcidin Ratio Discriminates TMPRSS6-Related Iron Refractory
