            is a derivation study rather than an external validation. Twenty registry-ascertained IRIDA
            patients and 39 selected controls is a small and enriched sample; the confidence intervals
            the authors report are the honest summary of the precision, and they themselves ask for further
            exploration in a broader population. No independent cohort has been reported applying the
            5.6 %/nM threshold.'
        attaches_to:
        - biochemical#Serum hepcidin
        - biochemical#Transferrin saturation
        - pathophysiology#Inappropriately Elevated Circulating Hepcidin
        notes: The 5.6 %/nM threshold is method-bound. Hepcidin was measured by standardised isotope dilution
          mass spectrometry, and routine hepcidin immunoassays are not calibrated to it, so the numeric
          cut-off cannot be carried to another laboratory without cross-calibration. Applying it to an
          uncalibrated immunoassay result would be a units error dressed as a diagnosis.
      selected_evidence:
        snippet: The TSAT/hepcidin ratio shows excellent performance in discriminating IRIDA from TMPRSS6-unrelated
          IDA early in the diagnostic work-up of IDA provided that recent iron therapy and moderate-to-severe
          inflammation are absent.
        supports: SUPPORT
