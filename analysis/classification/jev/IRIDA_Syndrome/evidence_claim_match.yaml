            label: negative regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: TMPRSS6 is an essential component of a pathway that detects iron deficiency and blocks
          Hamp transcription, permitting enhanced dietary iron absorption.
        supports: SUPPORT
