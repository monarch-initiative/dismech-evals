      assertion_type: Discussion
      assertion:
        discussion_id: hepatic_copper_arm_unresolved
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Systemic Copper Handling Defect
        - treatments#Oral Zinc Acetate
        prompt: Does hepatic copper overload occur in AP1B1 disease, given that the only targeted therapy
          is aimed at reducing it and the founding report did not find it?
        rationale: The founding AP1B1 paper states plainly that the affected individuals lacked evidence
          of copper toxicity in the liver, which is the arm of the MEDNIK picture derived from Wilson
          disease. GeneReviews nonetheless describes zinc acetate therapy for IDEDNIK as acting to reduce
          liver copper overload. Both cannot be straightforwardly true of the same patients. The likeliest
          reconciliations are that hepatic overload develops with age and was absent in the young patients
          first reported, or that the GeneReviews rationale is carried over from AP1S1 disease, where
          it was established. Either way, a curator should not read the treatment rationale as evidence
          that the hepatic arm is present in AP1B1 disease.
      selected_evidence:
        snippet: Similar to individuals with MEDNIK syndrome, the affected individuals we report display
          abnormal copper metabolism, evidenced by low plasma copper and ceruloplasmin, but lack evidence
          of copper toxicity in the liver.
        supports: REFUTE
        directness: DIRECT
