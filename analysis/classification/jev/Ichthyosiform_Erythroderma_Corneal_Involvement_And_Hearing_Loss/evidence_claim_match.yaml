            term:
              id: MONDO:0009440
              label: ichthyosiform erythroderma, corneal involvement, and hearing loss
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: copper_defect_to_skin_and_gut
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Systemic Copper Handling Defect
        - phenotypes#Congenital Ichthyosiform Erythroderma
        - phenotypes#Severe Enteropathy
        prompt: Do the skin and gut phenotypes follow from the copper defect, or from AP-1 cargo other
          than ATP7A that has not been identified?
        rationale: 'The pathograph in this entry runs the skin and gut phenotypes downstream of the copper
          handling defect, and both of those edges carry unknown intermediates because nothing cited here
          traces the route. There is a live alternative: AP-1 sorts many cargoes, and the ichthyosis and
          the enteropathy could reflect mistrafficking of epidermal or intestinal proteins entirely unrelated
          to copper. The clinical fact that bears on this is that zinc therapy, which acts on copper,
          is reported to improve the skin - which favours the copper route - but that report is uncontrolled
          and in some patients only. The distinction determines whether copper-directed therapy is worth
          pursuing for the two features that dominate morbidity and mortality.'
      selected_evidence:
        snippet: Treatment with oral zinc acetate therapy to reduce liver copper overload has been reported
          to improve behavioral disturbances, skin manifestations, and cognitive function in some individuals.
        supports: SUPPORT
        directness: INDIRECT
