  1dbd09e800a51e4a0c16b8e2f59b4b472b43eb44ca7808b1e89bdccae5596ffa:
    claim:
      about:
        disease:
          name: Ichthyosiform Erythroderma, Corneal Involvement, and Hearing Loss
          disease_term:
            preferred_term: ichthyosiform erythroderma, corneal involvement, and hearing loss
            term:
              id: MONDO:0009440
              label: ichthyosiform erythroderma, corneal involvement, and hearing loss
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: surveillance_schedule_has_no_schema_home
        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#
        prompt: Where should a recommended surveillance schedule live in a dismech entry, given that the
          schema has no slot for one?
        rationale: 'The GeneReviews chapter carries a detailed surveillance schedule for this disorder:
          growth and nutritional parameters, safety of oral intake, skin and hair, developmental progress,
          seizures and neuropathy, liver function tests, complete blood count, respiratory infection,
          plus audiology and ophthalmology review on their own cadences. Everything else in that chapter''s
          MANAGEMENT section has been mined into treatments: and diagnosis:; this part has not, because
          there is nowhere for it to go.

          It is not a treatment: nothing is administered, and modelling it as one would put "assess growth
          parameters" beside oral zinc acetate as though they were the same kind of thing. It is not a
          diagnostic test either: these are repeat measurements on an already-diagnosed patient, timed
          by risk rather than by a diagnostic question. And it is not a phenotype. The nearest structural
          analog dismech does have is biochemical.reference_ranges, which says what a value means but
          not when to measure it.

          Recorded as a gap rather than forced into an existing slot, because a surveillance schedule
          for a disorder whose leading causes of early death are enteropathy and sepsis is exactly the
          management content a reader would want, and burying it in prose would make it unqueryable across
          the KB. Raised here rather than solved, since the answer is a schema question and not a curation
          one.'
      selected_evidence:
        snippet: 'Surveillance: At each visit, assess growth parameters, nutritional status, safety of
          oral intake, diarrhea, skin and hair manifestations, developmental progress and educational
          needs, mobility and self-help needs, seizures and peripheral neuropathy, behavioral issues,
          liver function tests, complete blood count, evidence of aspiration and respiratory infections,
          and family needs.'
        supports: SUPPORT
        directness: DIRECT
    origin:
