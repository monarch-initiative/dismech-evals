          name: Ichthyosiform Erythroderma, Corneal Involvement, and Hearing Loss
          disease_term:
            preferred_term: ichthyosiform erythroderma, corneal involvement, and hearing loss
            term:
              id: MONDO:0009440
              label: ichthyosiform erythroderma, corneal involvement, and hearing loss
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: MEDNIK syndrome (AP1S1)
        description: 'The sibling disorder at the small sigma subunit of the same adaptor complex. Mechanistically
          this is the closest relative, not a mimic: current GeneReviews treats AP1B1 and AP1S1 disease
          as one entity, IDEDNIK syndrome. The reported difference is that the AP1B1 patients showed the
          copper-deficiency arm without demonstrable hepatic copper toxicity.'
        distinguishing_features:
        - Caused by AP1S1 rather than AP1B1
        - Peripheral neuropathy is part of the MEDNIK acronym and is not prominent in reported AP1B1 patients
        - Hepatic copper toxicity described in MEDNIK, looked for and not found in the founding AP1B1
          patients
      selected_evidence:
        snippet: Similar to individuals with MEDNIK syndrome, the affected individuals we report display
          abnormal copper metabolism, evidenced by low plasma copper and ceruloplasmin, but lack evidence
          of copper toxicity in the liver.
        supports: SUPPORT
        directness: DIRECT
