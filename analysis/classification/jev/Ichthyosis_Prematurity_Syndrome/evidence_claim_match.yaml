            quantity, but it is measured by lipidomics of whole epidermis from the intact animal, so the
            model observes the tissue-level lipid content rather than the keratinocyte synthetic step
            itself.
          limitations: Acylceramide was measured across whole epidermis in a neonatally lethal null mouse,
            which is far more severe than human IPS. It does not resolve which keratinocyte layer or step
            is affected, and no comparable acylceramide measurement in patient epidermis has been reported,
            so the human deficit is inferred from the mouse and from knockdown keratinocytes.
