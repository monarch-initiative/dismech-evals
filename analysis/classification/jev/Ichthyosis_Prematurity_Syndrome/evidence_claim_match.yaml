          another acyl-CoA synthetase, such as FATP1, compensates in human skin after birth, the mouse
          overstates the lasting human barrier defect and the human postnatal course depends on a mechanism
          the model lacks. No study has measured FATP1 or acylceramide in patient epidermis over time.
