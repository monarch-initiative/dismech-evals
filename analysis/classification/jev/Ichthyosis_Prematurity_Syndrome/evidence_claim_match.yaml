          congenital ichthyosis by its prematurity and prenatal amniotic findings, neonatal asphyxia,
          eosinophilia, characteristic epidermal ultrastructure, and the rapid improvement of the skin
          after birth, whereas ARCI scaling persists.
        distinguishing_features:
        - Premature birth with polyhydramnios and chorioamniotic membrane separation
        - Neonatal asphyxia from aspirated keratin debris
        - Marked peripheral eosinophilia
        - Curved trilamellar membrane aggregates on electron microscopy
        - Scale sheds within weeks, leaving a mild nonscaly ichthyosis
      selected_evidence:
        snippet: Ichthyosis prematurity syndrome (IPS) is classified as a syndromic congenital ichthyosis
          based on the presence of skin changes at birth, ultrastructural abnormalities in the epidermis,
