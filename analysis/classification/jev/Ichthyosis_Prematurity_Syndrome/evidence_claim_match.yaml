            preferred_term: ichthyosis prematurity syndrome
            term:
              id: MONDO:0012089
              label: ichthyosis prematurity syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autosomal recessive congenital ichthyosis
        disease_term:
          preferred_term: autosomal recessive congenital ichthyosis
          term:
            id: MONDO:0017265
            label: autosomal recessive congenital ichthyosis
        description: IPS shares recessive inheritance, congenital scaling and a lipid-barrier mechanism
          with non-syndromic ARCI, and SLC27A4 appears on ARCI gene panels. IPS is set apart as a syndromic
          congenital ichthyosis by its prematurity and prenatal amniotic findings, neonatal asphyxia,
          eosinophilia, characteristic epidermal ultrastructure, and the rapid improvement of the skin
          after birth, whereas ARCI scaling persists.
        distinguishing_features:
        - Premature birth with polyhydramnios and chorioamniotic membrane separation
        - Neonatal asphyxia from aspirated keratin debris
        - Marked peripheral eosinophilia
        - Curved trilamellar membrane aggregates on electron microscopy
        - Scale sheds within weeks, leaving a mild nonscaly ichthyosis
      selected_evidence:
        snippet: Diagnosing this syndrome is important to reassure parents, obstetricians, and pediatricians
          about its benign course after complications in the perinatal period.
        supports: SUPPORT
