          to Flg alone.
        modeled_mechanisms:
        - target: Profilaggrin and Filaggrin Deficiency
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: ft/ft mice express an abnormal, unprocessed profilaggrin and lack filaggrin.
          limitations: Mouse Flg frameshift on a mixed background that also carries the matted mutation;
            the mouse is homozygous, so it models biallelic rather than heterozygous disease.
        - target: Increased Percutaneous Allergen and Irritant Penetration
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Topical allergen produces cutaneous inflammation and allergen-specific antibodies.
          limitations: Ovalbumin sensitization in mice; the antibody response is mixed Th1/Th2 rather
            than purely type 2, and the background matted mutation is a potential confounder.
      selected_evidence:
        snippet: Here we report a 1-bp deletion mutation, 5303delA, analogous to common human FLG mutations,
          within the murine Flg gene in the spontaneous mouse mutant flaky tail (ft).
        supports: SUPPORT
