        association: Causative
        relationship_type: CAUSATIVE
        notes: Common European alleles are R501X and 2282del4, carried on conserved ancestral haplotypes;
          Asian populations carry largely different alleles, and FLG null alleles are less often found
          in African American patients. No ClinGen gene-disease validity record for FLG and ichthyosis
          vulgaris is cached in this repository, so no validity tier is recorded. A proportion of clinically
          diagnosed ichthyosis vulgaris, especially with atopic dermatitis, carries no detectable FLG
          mutation.
        case_fractions:
        - population: Chinese isolated ichthyosis vulgaris
          case_fraction_percent: 74.0
          notes: Full FLG sequencing; 43% in ichthyosis vulgaris associated with atopic dermatitis in
            the same study.
        - population: Austrian patients with marked generalized scaling
          case_fraction_percent: 71.4
          cohort_size: 21
          notes: 15 of 21 patients carried p.R501X or c.2282del4, the only alleles screened.
      selected_evidence:
        snippet: We show here that these common European mutations are ancestral variants carried on conserved
          haplotypes.
        supports: SUPPORT
