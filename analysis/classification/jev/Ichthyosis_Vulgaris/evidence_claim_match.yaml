        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FLG Loss-of-Function Variants
        conforms_to: epidermal_cornification_failure#Cornification Program Component Deficiency
        biological_scale: MOLECULAR
        description: 'Germline nonsense and frameshift variants in FLG, most commonly R501X and 2282del4
          in Europeans and population-specific alleles in Asia, truncate profilaggrin. Because the C-terminal
          region is required for processing, truncations anywhere in the repeat array abolish or sharply
          reduce filaggrin production, and with it the keratin filament binding of the filaggrin monomers.
          How much the clinical phenotype depends on lost keratin aggregation, as opposed to lost natural
          moisturizing factor, is debated: a filaggrin knockdown skin model showed no keratin extraction
          defect (PMID:20445547).'
        genes:
        - preferred_term: FLG
          term:
            id: hgnc:3748
            label: FLG
        molecular_functions:
        - preferred_term: keratin filament binding
          term:
            id: GO:1990254
            label: keratin filament binding
          modifier: DECREASED
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Nonsense and frameshift null alleles; heterozygous (mild) or homozygous / compound
            heterozygous (moderate to severe).
      selected_evidence:
        snippet: We have identified homozygous or compound heterozygous mutations R501X and 2282del4 in
          the gene encoding filaggrin (FLG) as the cause of moderate or severe ichthyosis vulgaris in
          15 kindreds.
        supports: SUPPORT
