        description: Spontaneous recessive mouse mutant lacking processed filaggrin and F-type keratohyalin
          granules, with dry flaky skin, orthokeratotic hyperkeratosis and enhanced percutaneous allergen
          priming.
        publication: PMID:19349982
        notes: The flaky tail line arose on a background carrying the recessive matted (ma) hair mutation
