  b28a5b65935341cc45947fc20c0c190584fcc0f695f218e43c0991b8fe7a5d5b:
    claim:
      about:
        disease:
          name: Idiopathic Hypereosinophilic Syndrome
          disease_term:
            preferred_term: idiopathic hypereosinophilic syndrome
            term:
              id: MONDO:0011895
              label: idiopathic hypereosinophilic syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: idiopathic_hes_count_damage_dissociation
        kind: KNOWLEDGE_GAP
        prompt: Why does eosinophil-mediated cardiac damage continue to progress after the blood eosinophil
          count has been normalised, and what should be monitored instead?
        rationale: Treatment response in this disease is assessed on the blood eosinophil count, but cardiac
          injury and its clinical consequences dissociate from that count. The fibrotic stage is irreversible
          and cardioembolism has been documented despite resolution of the hypereosinophilia, so a normal
          count is not evidence that the cardiac process has stopped. Troponin, NT-pro-BNP and cardiac
          imaging are in routine guideline use and are curated here, but they report damage that has already
          occurred; no validated surrogate for ongoing tissue-level eosinophil activity exists, so nothing
          tells a clinician the process is still running before the next increment of injury shows up.
        attaches_to:
        - pathophysiology#Endomyocardial Fibrosis and Restrictive Physiology
        - pathophysiology#Systemic Thromboembolism
      selected_evidence:
        snippet: More importantly, they demonstrate, for the first time, the dissociation between the
          eosinophil count and patients' clinical evolution, suggesting the need for close follow up even
          after the eosinophilia has been controlled.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39007045
