    claim:
      about:
        disease:
          name: Idiopathic Hypereosinophilic Syndrome
          disease_term:
            preferred_term: idiopathic hypereosinophilic syndrome
            term:
              id: MONDO:0011895
              label: idiopathic hypereosinophilic syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unexplained Eosinophil Lineage Expansion
        biological_scale: CELLULAR
        description: 'Sustained expansion of the eosinophil lineage without a demonstrable clonal myeloid
          lesion or an identifiable aberrant T-cell population driving it. This is the defining feature
          of the idiopathic variant and it is a negative characterisation: the same downstream cascade
          in myeloid HES traces to a kinase fusion and in lymphocytic HES to cytokine-producing T cells,
          whereas here a systematic work-up returns neither. The proximate driver is therefore unknown
          rather than absent.'
        cell_types:
        - preferred_term: eosinophil progenitor cell
          term:
            id: CL:0000611
            label: eosinophil progenitor cell
        biological_processes:
        - preferred_term: eosinophil differentiation
          modifier: INCREASED
          term:
            id: GO:0030222
            label: eosinophil differentiation
      selected_evidence:
        snippet: Moreover, the etiology of the eosinophilia in HESs can be primary (myeloid), secondary
          (lymphocyte-driven), or unknown.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25964669
      reference_title: How I treat hypereosinophilic syndromes.
      evidence_source: OTHER
      explanation: Establishes the three-way aetiologic split in which the idiopathic variant is the "unknown"
        arm, distinguished from the myeloid and lymphocyte-driven arms rather than from a shared downstream
        phenotype.
