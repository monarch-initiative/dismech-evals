          disease_term:
            preferred_term: idiopathic hypereosinophilic syndrome
            term:
              id: MONDO:0011895
              label: idiopathic hypereosinophilic syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Mepolizumab
        description: 'Anti-IL-5 monoclonal antibody, and the only biologic approved for HES. In FIP1L1-PDGFRA-negative
          HES with recurrent flares it halves the proportion of patients flaring, and in prednisone-dependent
          patients it permits substantial steroid tapering. Note what that trial population is: FIP1L1-PDGFRA
          negative is not a synonym for idiopathic, since it also contains lymphocytic-variant and non-PDGFRA
          myeloid disease. Idiopathic HES is its largest component and the small idiopathic-only cohort
          below points the same way, but the phase III result is not an idiopathic-specific measurement.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mepolizumab
            term:
              id: NCIT:C157376
              label: Mepolizumab
      selected_evidence:
        snippet: 'All patients with concomitant asthma (n = 8) experienced elimination of asthma flares,
          asthma control (ACQ < 0.75), functional improvement (mean ΔFEV1: 857 ± 594 mL), and an 82% reduction
          in oral corticosteroids'
        supports: SUPPORT
