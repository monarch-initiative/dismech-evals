      assertion_type: Diagnosis
      assertion:
        name: Consensus criteria and terminology
        description: The 2011 Working Conference on Eosinophil Disorders and Syndromes (ICOG-EO) unified
          previously divergent classifications and separated hypereosinophilia of undetermined significance
          - eosinophilia without organ damage - from hypereosinophilic syndrome proper. Idiopathic HES
          sits inside the syndrome category and requires demonstrable eosinophil-mediated organ damage.
        notes: No diagnosis_term is bound. This record states a classification convention, not a procedure
          performed on a patient, and NCIT:C18020 Diagnostic Procedure would assert something false about
          it.
      selected_evidence:
        snippet: The expert group agreed on unifying terminologies and criteria and a classification that
          delineates various forms of hypereosinophilia, including primary and secondary variants based
          on specific hematologic and immunologic conditions, and various forms of the hypereosinophilic
          syndrome.
        supports: SUPPORT
