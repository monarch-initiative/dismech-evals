        name: Eosinophil-Driven Prothrombotic State
        biological_scale: MOLECULAR
        description: 'Degranulating eosinophils shift haemostasis toward thrombosis independently of any
          endocardial surface lesion. Eosinophil cationic protein binds heparin and modulates thrombomodulin,
          blunting the physiological anticoagulant pathways. This is the arm that explains what surface
          thrombogenicity alone cannot: diffuse microangiopathy, thrombosis at sites remote from the heart,
          and events that continue after the blood eosinophil count has been normalised.'
        cell_types:
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        biological_processes:
        - preferred_term: blood coagulation
          modifier: INCREASED
          term:
            id: GO:0007596
            label: blood coagulation
      selected_evidence:
        snippet: Furthermore, the eosinophil activation and degranulation increases the release of eosinophil
          cationic protein that is able to bind heparin and modulate thrombomodulin so reducing the physiological
          anticoagulation mechanisms and so increasing the prothrombotic state in hypereosinophilia.
        supports: SUPPORT
