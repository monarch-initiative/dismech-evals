      assertion_type: Treatment
      assertion:
        name: Empirical Antiparasitic Therapy Before Corticosteroids
        description: A safety step rather than a treatment for the disease. Corticosteroids given to a
          patient with unrecognised strongyloidiasis can precipitate hyperinfection, and strongyloidiasis
          is itself a cause of eosinophilia that must be excluded before the idiopathic label is applied.
          Guidelines offer empirical ivermectin depending on exposure history and endemic-area risk, while
          noting that the value of empirical treatment in genuinely unexplained chronic hypereosinophilia
          is disputed.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ivermectin
            term:
              id: CHEBI:6078
              label: ivermectin
      selected_evidence:
        snippet: In the absence of available studies, the usefulness of empirical antiparasitic treatment
          in unexplained chronic HE is disputed.
        supports: SUPPORT
