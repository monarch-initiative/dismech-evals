      assertion_type: Pathophysiology
      assertion:
        name: Chemokine-Driven Eosinophil Recruitment into Tissue
        biological_scale: CELLULAR
        description: Eosinophil-selective chemokines - the eotaxins CCL11, CCL24, and CCL26 acting through
          CCR3, alongside CCL3 and CCL5 - direct primed eosinophils out of the circulation and into skin,
          lung, gut, and myocardium. This step is what converts a blood count into tissue disease, and
          it is the reason the circulating count and the tissue burden can move independently. It is inferred
          from general eosinophil biology rather than demonstrated uniquely in the idiopathic variant.
        cell_types:
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        biological_processes:
        - preferred_term: eosinophil chemotaxis
          modifier: INCREASED
          term:
            id: GO:0048245
            label: eosinophil chemotaxis
      selected_evidence:
        snippet: Because of activation by CCL5 and other cytokines, CCL3 can stimulate eosinophilic chemotaxis,
          which is important for eosinophil migration.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38611061
      reference_title: Clinical and Therapeutic Intervention of Hypereosinophilia in the Era of Molecular
