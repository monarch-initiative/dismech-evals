              label: idiopathic hypereosinophilic syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Contemporary threshold and the obsolete six-month rule
        description: The historical Chusid criterion required six months of eosinophilia before the diagnosis
          could be made. That waiting period is no longer applied when organ damage is already present,
          because the fibrotic and thromboembolic complications that determine outcome accrue during it.
          Persistence is now confirmed on repeat measurement over weeks rather than months, and etiological
          work-up runs in parallel with organ-damage assessment rather than before it.
        notes: 'No diagnosis_term is bound: this record is criteria history, not a procedure. The six-month
          figure is cited to a source that states it, rather than to Chusid''s own abstract, which describes
          persistence without naming a duration.'
      selected_evidence:
        snippet: The current definition of HES requires persistent eosinophilia with a corresponding absolute
          eosinophil count of >1.5 × 109/L for a shorter period of 2 to 4 weeks (compared to the historical
          criterion of more than 6 months outlined by Chusid and colleagues in 1975), and concomitant
          tissue damage
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40283978
      reference_title: Biologic Agents in Idiopathic Hypereosinophilic Syndrome.
      evidence_source: OTHER
      explanation: States both the historical six-month criterion and the 2-to-4-week window that replaced
        it.
