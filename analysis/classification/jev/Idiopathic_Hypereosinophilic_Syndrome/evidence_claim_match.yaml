              label: idiopathic hypereosinophilic syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: idiopathic_hes_unknown_driver
        kind: KNOWLEDGE_GAP
        prompt: What drives sustained eosinophilopoiesis in idiopathic hypereosinophilic syndrome when
          no clonal myeloid lesion and no aberrant T-cell population can be found?
        rationale: The idiopathic category is defined by the failure of the current work-up, not by a
          positive mechanistic finding, and it is the largest of the HES variants precisely because that
          work-up leaves most patients unexplained. Every node downstream of the first in this entry's
          chain is well supported; the first node is a placeholder for an unknown. Whether idiopathic
          HES is one disease or a residual bin holding several mechanisms with a shared effector pathway
          is unresolved, and it determines whether the category should eventually be split further or
          dissolved into newly identified variants.
        attaches_to:
        - pathophysiology#Unexplained Eosinophil Lineage Expansion
      selected_evidence:
        snippet: Unfortunately, despite recent advances in molecular and immunologic techniques, the etiology
          remains unproven in the overwhelming majority of cases.
        supports: SUPPORT
    origin:
