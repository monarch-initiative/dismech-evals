        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IL-5-Dependent Eosinophil Survival and Tissue Recruitment
        biological_scale: MOLECULAR
        description: 'IL-5 signalling through IL-5R-alpha maintains eosinophil survival, primes the cells,
          and supports their recruitment into tissue. The pathway is inferred to be operative in idiopathic
          HES chiefly from therapeutic reversal: neutralising IL-5 or depleting IL-5R-alpha-bearing cells
          lowers blood, marrow, and tissue eosinophilia and controls disease in FIP1L1-PDGFRA-negative
          patients.'
        cell_types:
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        biological_processes:
        - preferred_term: interleukin-5-mediated signaling pathway
          modifier: INCREASED
          term:
            id: GO:0038043
            label: interleukin-5-mediated signaling pathway
        - preferred_term: eosinophil chemotaxis
          modifier: INCREASED
          term:
            id: GO:0048245
            label: eosinophil chemotaxis
      selected_evidence:
        snippet: The numbers of bone marrow eosinophils, eosinophil precursors, and blood and bone marrow
          basophils were significantly decreased at week 12 in all the patients in the benralizumab group,
          but the number of mast cells and serum tryptase levels were unchanged
        supports: SUPPORT
        directness: INDIRECT
