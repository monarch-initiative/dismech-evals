  f78898888249c1a4a80b932f88ce6e1cbff21f3fc86b3ffa80093172a82d8506:
    claim:
      about:
        disease:
          name: Idiopathic Hypersomnia
          disease_term:
            preferred_term: idiopathic hypersomnia
            term:
              id: MONDO:0018044
              label: idiopathic hypersomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-Restorative Long Sleep and Unrefreshing Naps
        description: 'Sleep in idiopathic hypersomnia fails at its restorative function while succeeding
          at its structural one. Nocturnal sleep may extend well beyond ten hours, and daytime naps -
          which in narcolepsy are short and briefly restorative - are here long and leave the patient
          no better. This is the feature clinicians use to separate the two disorders in the consulting
          room, and it constrains any candidate mechanism: whatever is wrong is not a failure to obtain
          sleep but a failure of obtained sleep to discharge sleep pressure.'
        role: effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: sleep
          term:
            id: GO:0030431
            label: sleep
          modifier: ABNORMAL
      selected_evidence:
        snippet: as well as a 24 h PSG or a 2-wk actigraphy in association with a sleep log to ensure
          a total 24-h sleep time longer than or equal to 66O minutes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26599679
      reference_title: Idiopathic hypersomnia.
      evidence_source: OTHER
      explanation: Gives the operational threshold (a 24-hour sleep time of at least 660 minutes) by which
