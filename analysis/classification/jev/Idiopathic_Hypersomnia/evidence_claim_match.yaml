  0fd501489f785222fe29db1b47aff75370490003aad076cb16cec25ad9c23a59:
    claim:
      about:
        disease:
          name: Idiopathic Hypersomnia
          disease_term:
            preferred_term: idiopathic hypersomnia
            term:
              id: MONDO:0018044
              label: idiopathic hypersomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Increased Homeostatic Sleep Drive with Preserved Sleep Continuity
        description: 'The central and defining physiological abnormality: sleep propensity is pathologically
          elevated, but sleep architecture, efficiency, and continuity are normal or better than normal.
          This combination is what separates idiopathic hypersomnia from every other cause of daytime
          sleepiness. In narcolepsy type 1 the sleep-wake switch is unstable in both directions, so nocturnal
          sleep is fragmented; in sleep-disordered breathing it is destroyed by respiratory events; in
          circadian disorders it is displaced in time. Here sleep is abundant, consolidated, and still
          insufficient. Sleep is extended rather than curtailed, and the extension does not relieve the
          sleepiness - which is the observation that makes a simple sleep-debt model untenable.'
        role: central_effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: sleep
          term:
            id: GO:0030431
            label: sleep
          modifier: INCREASED
        - preferred_term: regulation of the sleep/wake cycle
          term:
            id: GO:0042749
            label: regulation of circadian sleep/wake cycle
          modifier: ABNORMAL
      selected_evidence:
        snippet: cases with IH had more severe sleepiness and sleep propensity, despite similar or longer
          sleep times
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38165322
      reference_title: Prevalence and Course of Idiopathic Hypersomnia in the Wisconsin Sleep Cohort Study.
      evidence_source: HUMAN_CLINICAL
      explanation: Population-cohort confirmation with objective polysomnography and multiple sleep latency
        testing that the sleepiness is not explained by reduced sleep, which is what the node asserts.
