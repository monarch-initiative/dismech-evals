          very severe sleep inertia and unrefreshing long naps. Retained here as a named subtype because
          it was a formal ICSD-2 category and because treatment trials have been stratified by it, but
          see the discussion on subtype validity: ICSD-3 abandoned the split.'
      selected_evidence:
        snippet: the description of idiopathic hypersomnia with two forms, polysymptomatic and monosymptomatic,
          by the same Bedrich Roth in 1976
        supports: SUPPORT
