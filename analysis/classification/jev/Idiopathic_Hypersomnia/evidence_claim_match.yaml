              label: idiopathic hypersomnia
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: gabaergic_potentiation
        hypothesis_label: Endogenous GABA-A Receptor Potentiation
        status: EMERGING
        description: 'The leading positive hypothesis, and the reason idiopathic hypersomnia is sometimes
          described as the mirror image of narcolepsy. Cerebrospinal fluid from hypersomnolent patients
          was reported to potentiate GABA-A receptor function in vitro in the presence of GABA, with the
          bioactivity attributable to a trypsin-sensitive component of 500-3000 daltons whose identity
          was never established. On this model the disorder is one of excessive endogenous somnogenic
          inhibition rather than deficient arousal drive - which would explain why it coexists with normal
          orexin, why sleep is abundant rather than fragmented, and why arousal from sleep is specifically
          impaired. The supporting flumazenil result is mechanistically striking, since flumazenil is
          conventionally regarded as lacking intrinsic activity, and it reversed the enhancement in vitro
          and normalised vigilance in an open-label series of seven patients. It is curated as EMERGING
          and not as the mechanism: the finding rests substantially on one laboratory''s assay, the bioactive
          substance was never identified, and the clinical arm was small and unblinded.'
      selected_evidence:
        snippet: Furthermore, flumazenil normalized vigilance in seven hypersomnolent patients.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23175709
      reference_title: Modulation of vigilance in the primary hypersomnias by endogenous enhancement of
