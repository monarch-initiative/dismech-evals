      assertion_type: Pathophysiology
      assertion:
        name: Chronic Functional Impairment
        description: 'The clinical endpoint. Idiopathic hypersomnia is most often a chronic condition
          of adolescent or young-adult onset with substantial occupational, educational, and social disability
          - sometimes rated by patients as greater than that of narcolepsy, in part because the disorder
          is less recognised and its severity less readily believed. It is not, however, uniformly permanent:
          in the only population-based longitudinal series, pathological somnolence remitted in roughly
          40% of cases over about twelve years, which is a prognostically important finding and one that
          any mechanistic account must accommodate.'
        role: consequence
        biological_scale: ORGANISM
      selected_evidence:
        snippet: The condition is disabling, sometimes even more so than narcolepsy type 1 or 2.
        supports: SUPPORT
