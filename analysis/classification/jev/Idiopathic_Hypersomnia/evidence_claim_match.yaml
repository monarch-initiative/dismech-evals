  ca99b6bc8bd0e0ac8662309eb82b4a9f83c7fe23206033ba807c7d0004e3e88e:
    claim:
      about:
        disease:
          name: Idiopathic Hypersomnia
          disease_term:
            preferred_term: idiopathic hypersomnia
            term:
              id: MONDO:0018044
              label: idiopathic hypersomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unidentified Somnogenic Process
        description: 'The trigger node, and it is deliberately named for what is not known. No structural
          lesion, neurotransmitter deficiency, autoimmune target, or causative gene has been established
          in idiopathic hypersomnia. What is established is negative and constraining: CSF hypocretin-1
          is normal, which excludes the orexin-deficiency mechanism; there is no HLA association of the
          strength seen in narcolepsy type 1; and no consistent neuropathology has been reported. Onset
          is typically in adolescence or young adulthood, a familial background is frequently reported
          but has never been rigorously characterised, and no biological marker exists. Curating this
          node as unknown rather than assigning it a plausible mechanism is the honest position and is
          what the disorder''s name records.'
        role: trigger
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Yet, MSLT is neither sensitive nor specific and the polysomnographic diagnostic criteria
          require continuous readjustment and biologic markers are still lacking.
        supports: SUPPORT
