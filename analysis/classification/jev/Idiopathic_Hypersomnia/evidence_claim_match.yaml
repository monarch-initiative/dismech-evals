  36299383f1d02c011552ec56cffc80c09468f7c6ec6cadc43681e0e8d9819560:
    claim:
      about:
        disease:
          name: Idiopathic Hypersomnia
          disease_term:
            preferred_term: idiopathic hypersomnia
            term:
              id: MONDO:0018044
              label: idiopathic hypersomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Arousal from Sleep (Sleep Inertia)
        description: 'A partly separable abnormality, and one that a pure sleep-drive model does not predict.
          Waking is prolonged, confused, and incomplete: patients are difficult to rouse, may require
          multiple alarms or another person, and remain impaired for tens of minutes to hours after rising
          - the "sleep drunkenness" Roth described in the original 1956 account. It is curated as its
          own node because it dissociates from sleepiness in treatment response as well as in phenomenology,
          and because it, rather than the sleepiness, is often the most disabling symptom and the one
          that most reliably distinguishes idiopathic hypersomnia from narcolepsy at the bedside.'
        role: effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: sleep/wake cycle state transition to wakefulness
          term:
            id: GO:0022410
            label: circadian sleep/wake cycle process
          modifier: ABNORMAL
      selected_evidence:
        snippet: It is often accompanied by sleep of long duration and debilitating sleep inertia.
        supports: SUPPORT
