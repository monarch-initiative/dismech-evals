        display_name: Idiopathic hypersomnia without long sleep time
        description: Nocturnal sleep of normal duration with a mean sleep latency of 8 minutes or less
          on the multiple sleep latency test and fewer than two sleep-onset REM periods. This is the subtype
          in which the two randomised modafinil trials were conducted, and the subtype whose boundary
          with narcolepsy type 2 is least secure.
      selected_evidence:
        snippet: Modafinil, an established treatment for narcolepsy, was tested for efficacy and safety
          in Japanese patients with IH without long sleep time.
        supports: SUPPORT
