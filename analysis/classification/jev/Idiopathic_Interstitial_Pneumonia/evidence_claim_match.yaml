  e2c07d7e545e52425c472dbb1f81df24d19158e0eadda6e113497c4fc4114e60:
    claim:
      about:
        disease:
          name: Idiopathic Interstitial Pneumonia
          disease_term:
            preferred_term: idiopathic interstitial pneumonia
            term:
              id: MONDO:0002429
              label: idiopathic interstitial pneumonia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_iip_behaviour_vs_pattern_classification
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Should an idiopathic interstitial pneumonia be classified by its histopathologic pattern
          or by its observed disease behaviour? The two axes disagree for the entities whose clinical
          course is heterogeneous, and antifibrotic therapy is now indicated on the behaviour axis while
          the entity name still comes from the pattern axis.
        attaches_to:
        - pathophysiology#Progressive pulmonary fibrosis
        - pathophysiology#Resolution of injury into a stereotyped histopathologic pattern
        rationale: The 2013 update proposed a behaviour-based classification precisely for the patients
          and entities the pattern-based scheme handles badly, and the 2022 guideline then defined progressive
          pulmonary fibrosis as a behaviour that cuts across entities and carries its own treatment recommendation.
          The result is a family whose members are named on one axis and treated on another. Which axis
          a mechanism knowledge base should treat as primary is unresolved, and the answer determines
          whether progressive pulmonary fibrosis is modelled as a shared outcome node (as here) or as
          a separate cross-cutting entity.
      selected_evidence:
        snippet: A classification based on observed disease behavior is proposed for patients who are
          difficult to classify or for entities with heterogeneity in clinical course.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24032382
      reference_title: 'An official American Thoracic Society/European Respiratory Society statement:
        Update of the international multidisciplinary classification of the idiopathic interstitial pneumonias.'
      evidence_source: OTHER
      explanation: The behaviour-based alternative is proposed in the classification statement itself,
        which is what makes this a live tension rather than a settled question.
