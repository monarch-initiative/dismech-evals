        biological_scale: ORGANISM
        role: consequence
        conforms_to: fibrotic_response#Architectural Distortion and Organ Dysfunction
        description: The shared adverse outcome of the family and the reason its members are managed together
          despite their different lesions. Accumulating matrix destroys alveolar architecture, and a subset
          of every fibrosing entity — including entities with an otherwise favourable prognosis — declines
          on symptoms, physiology, and imaging in the way IPF does. The 2022 ATS/ERS/JRS/ALAT guideline
          made this a defined, treatable behaviour rather than a descriptive impression, and it is behaviour,
          not the original histopathologic label, that then governs antifibrotic therapy.
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
