        context: []
      assertion_type: Diagnosis
      assertion:
        name: Multidisciplinary discussion
        description: The diagnostic standard for the family since 2002. Pulmonology, radiology, and pathology
          (with rheumatology where autoimmunity is in question) integrate clinical history, HRCT, and
          — when obtained — tissue, and it is this integrated assignment, not histology alone, that names
          the entity.
        notes: NEEDS TERM (NTR candidate). NCIT has no clinical-action term for multidisciplinary discussion
          as a diagnostic procedure; the nearest concepts are organizational (multidisciplinary team,
          tumor board) rather than the diagnostic act itself. The free-text preferred_term is therefore
          deliberate, not an omission. The other two diagnosis entries here are bound (NCIT:C20644, NCIT:C51748).
      selected_evidence:
        snippet: In addition, the historical "gold standard" of histologic diagnosis was replaced by a
          multidisciplinary approach.
        supports: SUPPORT
