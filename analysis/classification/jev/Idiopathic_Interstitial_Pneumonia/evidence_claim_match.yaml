      assertion_type: Pathophysiology
      assertion:
        name: Injury to the alveolar-interstitial compartment of unknown cause
        biological_scale: TISSUE
        role: trigger
        conforms_to: fibrotic_response#Tissue Injury
        description: The shared initiating step of the family. Injury reaches the alveolar epithelium
          and the surrounding interstitium, and the search for a cause — connective tissue disease, inhaled
          antigen, drug, infection, occupational exposure — returns nothing. What makes an interstitial
          pneumonia idiopathic is therefore not a distinct kind of injury but the exhaustion of the differential,
          which is why every entity in this family is defined partly by exclusion.
        cell_types:
        - preferred_term: alveolar type II pneumocyte
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
        - preferred_term: pulmonary alveolus
          term:
            id: UBERON:0002299
            label: alveolus of lung
        biological_processes:
        - preferred_term: wound healing
          term:
            id: GO:0042060
            label: wound healing
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Organizing pneumonia (OP) is a nonspecific lung parenchymal response to any form of injury,
          with its idiopathic variant coined as cryptogenic organizing pneumonia (COP).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
