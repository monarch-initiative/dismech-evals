      assertion:
        name: Bronchiolocentric pigmented macrophage accumulation
        biological_scale: CELLULAR
        role: effector
        description: The lesion shared by the two smoking-related IIPs. Pigmented ("smoker's") macrophages
          accumulate in respiratory bronchioles and the surrounding alveoli. Confined to the bronchiolar
          region the lesion is respiratory bronchiolitis-interstitial lung disease; when the same accumulation
          becomes diffuse and fills alveolar spaces it is desquamative interstitial pneumonia. This is
          the one arm of the classification with an identified and removable driver, which is why its
          first-line therapy is an exposure intervention rather than a drug.
        cell_types:
        - preferred_term: alveolar macrophage
          term:
