            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Desquamative interstitial pneumonia, also related to smoking, is characterized by exertional
          dyspnea, dry cough, restrictive lung function, and ground-glass opacities on high-resolution
          CT.
        supports: SUPPORT
