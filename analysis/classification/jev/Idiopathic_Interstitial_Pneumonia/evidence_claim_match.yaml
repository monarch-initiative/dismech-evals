      assertion_type: Pathophysiology
      assertion:
        name: Resolution of injury into a stereotyped histopathologic pattern
        biological_scale: TISSUE
        role: central_effector
        description: The pivot of the whole family, and the reason it is a classification rather than
          a single disease. The injured lung has only a small repertoire of histopathologic responses
