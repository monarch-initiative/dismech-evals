  5b5105e234dc1d51067dbb30805233d2b76a4686b1740714d453a32a7fbb47a8:
    claim:
      about:
        disease:
          name: Idiopathic Interstitial Pneumonia
          disease_term:
            preferred_term: idiopathic interstitial pneumonia
            term:
              id: MONDO:0002429
              label: idiopathic interstitial pneumonia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_iip_unclassifiable_mixed_patterns
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: A substantial minority of patients cannot be assigned to any of the defined IIP entities
          because their lungs show mixed patterns of injury. Are these genuinely distinct disease processes
          awaiting definition, or does the pattern-based classification impose discrete boundaries on
          what is really a continuum of injury responses?
        attaches_to:
        - pathophysiology#Resolution of injury into a stereotyped histopathologic pattern
        rationale: 'The entire classification rests on the premise that the injured lung adopts one of
          a small number of discrete patterns. The 2013 ATS/ERS update records that a substantial percentage
          of patients defeat that premise, usually because more than one pattern is present in the same
          lung. This matters for a knowledge base: if the mixed cases are a continuum rather than a set
          of undiscovered entities, then the pattern nodes modelled here are convenient landmarks on a
          spectrum rather than mutually exclusive states, and a curated entry should not imply that a
          patient occupies exactly one of them.'
      selected_evidence:
        snippet: A substantial percentage of patients with IIP are difficult to classify, often due to
          mixed patterns of lung injury.
        supports: SUPPORT
