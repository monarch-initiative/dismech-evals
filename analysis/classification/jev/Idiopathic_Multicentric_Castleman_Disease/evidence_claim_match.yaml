      assertion_type: Pathophysiology
      assertion:
        name: Lymph Node Stromal Cell Activation and Expansion
        description: Spatial proteomic and single-nuclei transcriptomic mapping shows that the non-lymphoid
          stromal compartment of the multicentric Castleman lymph node expands and forms microenvironments
          absent from reactive nodes. The subsets that expand here are PDGFRA+ T-zone reticular cells
          and ACTA2+ perivascular reticular cells, in contrast to the B-zone reticular cells that dominate
          the unicentric form. These stromal populations, not the hematopoietic compartment, carry the
          highest VEGFA and IL-6-module expression, and they activate JAK-STAT, TGF-beta, and MAPK programs.
          Plasma cells, plasmablasts, endothelium, lymphatics, monocytes and macrophages are also increased.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Follicular dendritic cell
          term:
            id: CL:0000442
            label: follicular dendritic cell
        - preferred_term: T-zone reticular cell
