            term:
              id: MONDO:0035838
              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: autoimmune_etiology
        hypothesis_label: Autoantibody-Driven Etiology of iMCD
        status: EMERGING
        description: iMCD is initiated by autoimmunity, with autoantibodies against connective tissue
          disease antigens and against cytokines themselves driving the hypercytokinemia. Supporting observations
          are an enrichment of CTD-associated and anti-cytokine IgG autoantibodies in iMCD sera relative
          to healthy controls, and the long-standing clinical overlap between iMCD and connective tissue
          disease. The autoantibodies detected are heterogeneous rather than a shared specificity, and
          no pathogenic mechanism has been demonstrated, so this remains one of several competing candidate
          etiologies.
        applies_to_subtypes:
        - iMCD-TAFRO
        - iMCD-IPL
        - iMCD-NOS
      selected_evidence:
        snippet: 'We propose that 1 or more of the following 3 candidate processes may drive iMCD hypercytokinemia:
          systemic inflammatory disease mechanisms via autoantibodies or inflammatory gene mutations,
          paraneoplastic syndrome mechanisms via ectopic cytokine secretion, and/or a non-HHV-8 virus.'
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24622327
      reference_title: 'HHV-8-negative, idiopathic multicentric Castleman disease: novel insights into
        biology, pathogenesis, and therapy.'
      evidence_source: HUMAN_CLINICAL
      explanation: Places the autoantibody mechanism as one of three explicitly competing candidate drivers,
