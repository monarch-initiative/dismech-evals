      assertion_type: Pathophysiology
      assertion:
        name: Endothelial Injury and Renal Thrombotic Microangiopathy
        description: Renal involvement is common in MCD and especially in TAFRO. Where kidney biopsy is
          performed, membranoproliferative glomerulonephritis-like injury and thrombotic microangiopathy
          are the findings most often reported, implicating glomerular endothelial injury rather than
          a primary tubular or immune-complex process. IL-6 and VEGF have both been proposed as the mediators,
          but their specific role in the renal lesion has not been established. Thrombotic microangiopathy
          was diagnosed after iMCD onset in 6.9% of the ACCELERATE cohort, predominantly TAFRO patients.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Glomerular endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: INCREASED
        notes: 'Unmined lead: Lossos et al. 2024 (DOI:10.1016/j.bvth.2024.100006) report high SVEP1, tissue
          factor and endotheliopathy in iMCD-TAFRO, which would be a candidate for the unidentified mediator
          this node records - and would connect the endothelial injury here to the PI3K/AKT/mTOR node,
          since SVEP1 is an mTOR activator. Not curated as evidence because the cached record for that
          paper has no retrievable abstract, so no exact quote can be taken. Carried in `references:`
          so the lead is not lost.'
      selected_evidence:
        snippet: Furthermore, membranoproliferative glomerulonephritis (MPGN)-like injury and thrombotic
          microangiopathy (TMA) are the most reported histopathologic findings of renal biopsy.
        supports: SUPPORT
