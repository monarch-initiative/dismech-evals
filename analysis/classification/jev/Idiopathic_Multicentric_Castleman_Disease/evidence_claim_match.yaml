      assertion_type: Pathophysiology
      assertion:
        name: Unknown iMCD Initiating Process
        description: 'The event that starts idiopathic multicentric Castleman disease has not been identified.
          Three candidate processes have been proposed and none has been excluded: systemic inflammatory
          disease driven by autoantibodies or germline inflammatory gene variants; a paraneoplastic mechanism
          in which a clonal cell population ectopically secretes cytokine; and infection by a virus other
          than HHV-8. Viral-Track analysis of 22 UCD and 19 iMCD lymph nodes found no shared viral signature,
          which weighs against the third candidate without excluding a hit-and-run or non-transcribed
          agent. This node is deliberately kept in the graph as an explicit unknown so that everything
          downstream is not implicitly attributed to IL-6.'
        biological_scale: ORGANISM
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: 'We propose that 1 or more of the following 3 candidate processes may drive iMCD hypercytokinemia:
          systemic inflammatory disease mechanisms via autoantibodies or inflammatory gene mutations,
          paraneoplastic syndrome mechanisms via ectopic cytokine secretion, and/or a non-HHV-8 virus.'
        supports: SUPPORT
