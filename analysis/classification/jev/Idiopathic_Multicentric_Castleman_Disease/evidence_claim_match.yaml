        discussion_id: controversy_imcd_ipl_as_subtype
        prompt: Should iMCD-IPL be recognized as a formal subtype separate from iMCD-NOS, and if so, does
          the CDCN severity classification apply to it?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - has_subtypes#iMCD-IPL
        - has_subtypes#iMCD-NOS
        rationale: 'The CDCN consensus criteria recognize only TAFRO and NOS, but IPL accounted for 45.2%
          of 228 iMCD-NOS patients in the largest cohort and behaved differently: higher inflammatory
          state, longer overall survival, better response to myeloma-like and IL-6-blocking regimens than
          to lymphoma-like ones, and - importantly - no survival difference between CDCN-severe and CDCN-non-severe
          patients, meaning the severity classification does not stratify this group. The 2026 expert
          perspective now lists IPL as one of three iMCD subtypes. Recording it as a subtype here follows
          that, but the formal criteria have not been revised.'
      selected_evidence:
        snippet: Whether these patients should be excluded from the current classification system lacks
          sufficient evidence.
        supports: SUPPORT
