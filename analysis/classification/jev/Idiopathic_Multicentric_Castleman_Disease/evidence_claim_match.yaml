            term:
              id: MONDO:0035838
              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: clonal_stromal_origin
        hypothesis_label: Clonal Somatic Mutation as a Driver of iMCD
        status: EMERGING
        description: Recurrent somatic mutations - notably NCOA4 L261F in about 23% of iMCD, with chromatin-organization
          and methylation abnormalities clustering in this form - make iMCD at least partly a clonal process
          rather than a purely reactive one. The alleles are recurrent and enriched, but they are present
          in a minority of cases, the functional consequence of NCOA4 L261F in this disease has not been
          characterized, no functional model has shown that it initiates the lymph node lesion, and its
          cell of origin within the node is unresolved.
        applies_to_subtypes:
        - iMCD-TAFRO
        - iMCD-IPL
        - iMCD-NOS
      selected_evidence:
        snippet: However, we continue to lack a foundational understanding of the biological mechanisms
          driving this disease process.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/3
      evidence_path: /mechanistic_hypotheses/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33804823
      reference_title: A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease.
      evidence_source: HUMAN_CLINICAL
      explanation: The same review states that the mechanistic significance of these genetic findings
