        description: Not a different disease from Castleman disease but the branch point within it, and
          the exclusion that defines iMCD. Distinguished by HHV-8 LANA-1 immunohistochemistry on the node,
          usually with HIV co-infection, higher rates of constitutional symptoms and splenomegaly, and
          a different first-line therapy (rituximab rather than siltuximab).
        distinguishing_features:
        - HHV-8 LANA-1-positive plasmablasts on lymph node immunohistochemistry; detectable plasma KSHV
          viral load; usual HIV co-infection.
      selected_evidence:
        snippet: patients with HHV8+ MCD had significantly higher rates of constitutional symptoms (46.6%
          vs 98.6%; P = .038) and splenomegaly (48.2% vs 89.2%; P = .031)
        supports: SUPPORT
