          value:
            name: iMCD-IPL
            display_name: iMCD with Idiopathic Plasmacytic Lymphadenopathy
            description: Indolent clinical subtype of iMCD characterized by polyclonal hypergammaglobulinemia,
              thrombocytosis, plasmacytic or mixed lymph node histopathology, and anemia of inflammation.
              Despite a higher measured inflammatory state than other iMCD-NOS patients, survival is longer,
              and IL-6-blocking and myeloma-like regimens outperform lymphoma-like regimens. It is the
              subtype most often confused with IgG4-related disease. Whether it should be formally split
              out of iMCD-NOS is still contested; it is recorded here as a subtype because the international
              expert review and the largest cohort both treat it as one.
          role: subtype
      assertion_type: HistopathologyFinding
      assertion:
        name: IgG4-Positive Plasma Cell Infiltrate
        description: 'Lymph nodes in iMCD-IPL can contain enough IgG4-positive plasma cells to satisfy
          the histological diagnostic criteria for IgG4-related disease: in one series 13 of 39 iMCD-IPL
          cases (33.3%) did so, and serum IgG4 levels did not separate the two conditions. The serum IgG4/IgG
          ratio, with a cut-off of 19.0%, is the discriminator that did.'
        context: iMCD-IPL
        subtype: iMCD-IPL
      selected_evidence:
        snippet: Among the cases considered to be iMCD-IPL, 33.3% (13/39) cases also met the histological
          diagnostic criteria for IgG4-RD and serum IgG4 levels were not different between the two groups.
        supports: SUPPORT
