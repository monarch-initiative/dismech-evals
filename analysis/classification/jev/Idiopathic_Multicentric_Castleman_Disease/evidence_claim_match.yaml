        hypothesis_label: Immune-Stromal Dysregulation and Molecular Endotypes
        status: EMERGING
        description: Molecular endotypes defined by differential pathway activation (IL-6 vs. CXCL13 vs.
          TNF vs. PI3K/AKT/mTOR signaling) underlie clinical and therapeutic heterogeneity in iMCD. Single-cell
          transcriptomics and spatial biology identify immune-stromal dysregulation involving fibroblastic
          reticular cells and endothelial dysfunction as core mechanistic components.
        applies_to_subtypes:
        - iMCD-TAFRO
        - iMCD-IPL
        - iMCD-NOS
      selected_evidence:
        snippet: Recent discoveries have transformed Castleman disease from a clinicopathological entity
          largely defined by interleukin-6 excess into a complex disorder of immune–stromal dysregulation.
          Single-cell transcriptomics and spatial biology have identified fibroblastic reticular cells,
          endothelial dysfunction and dysregulated immune-cell communication as central pathogenic components.
        supports: SUPPORT
