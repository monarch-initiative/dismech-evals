          osteosclerotic bone lesions, and endocrinopathy - none of which belong to iMCD, where the immunoglobulin
          elevation is polyclonal. The distinction changes prognosis sharply: MCD with non-osteosclerotic
          POEMS had 27% 5-year survival versus 65% for MCD without POEMS.'
        distinguishing_features:
