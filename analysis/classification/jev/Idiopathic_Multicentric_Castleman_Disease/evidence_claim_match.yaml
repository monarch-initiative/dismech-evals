        hypothesis_label: PI3K/AKT/mTOR Signaling in IL-6-Blockade-Refractory iMCD
        status: EMERGING
        description: In the substantial fraction of iMCD patients who do not respond to anti-IL-6 therapy,
          the disease is driven by PI3K/AKT/mTOR signaling with CD8+ T cell activation and VEGF-A elevation
          rather than by IL-6 itself. The supporting evidence is a three-patient precision-medicine study
          in which mTOR pathway activity was elevated and sirolimus produced durable remissions; a prospective
          single-arm trial (NCT03933904) was designed to test it.
        applies_to_subtypes:
        - iMCD-TAFRO
      selected_evidence:
        snippet: Studies of three IL-6-blockade refractory iMCD cases revealed increased CD8+ T cell activation,
          VEGF-A, and PI3K/Akt/mTOR pathway activity.
        supports: SUPPORT
