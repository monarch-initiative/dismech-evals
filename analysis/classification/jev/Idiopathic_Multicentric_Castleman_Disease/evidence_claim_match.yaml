        discussion_id: controversy_imcd_malignancy_risk
        prompt: Does iMCD raise the risk of subsequent myeloid and solid malignancy, or is the reported
          excess an artifact of misclassifying malignancy-associated reactive lymphadenopathy as iMCD?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - has_subtypes#iMCD-TAFRO
        - has_subtypes#iMCD-NOS
        rationale: 'A systematic review and a claims-based study both reported increased myeloid and solid
          malignancy after iMCD, but in the expert-adjudicated ACCELERATE cohort only one patient developed
          a myeloid malignancy and no patient developed diffuse large B-cell lymphoma, with a malignancy
          rate comparable to the claims study''s controls. The two readings have opposite implications:
          an excess means iMCD warrants cancer surveillance, whereas an artifact means claims-based iMCD
          cohorts contain patients who only ever had a malignancy. Because iMCD diagnostic criteria explicitly
          exclude concurrent malignancy, strict adjudication could also be excluding genuine iMCD patients
          who then developed cancer, so neither cohort settles it.'
      selected_evidence:
        snippet: In this cohort, few patients developed a malignancy following the diagnosis of iMCD.
        supports: SUPPORT
