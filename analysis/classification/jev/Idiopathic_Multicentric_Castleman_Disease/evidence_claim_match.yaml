              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: Biochemical
      assertion:
        name: Interleukin-6 (IL-6)
        presence: Elevated
        context: Markedly elevated in MCD (both HHV-8+ and iMCD); typically normal in UCD. IL-6 levels
          correlate with disease activity. The producing cell differs by iMCD subtype - plasma cells in
          IPL, vascular endothelium in TAFRO - and in TAFRO the serum elevation may be a downstream consequence
          of the cytokine storm rather than its driver. There is no validated diagnostic serum biomarker
          for iMCD, and serum IL-6 is not one.
      selected_evidence:
        snippet: In contrast, IL-6 production in iMCD-TAFRO may be predominantly from vascular endothelial
          cells, suggesting that elevated serum IL-6 is a secondary phenomenon of the cytokine storm in
          this subtype.
        supports: SUPPORT
