        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_imcd_no_disease_model
        prompt: Can a cell-culture or animal model be built that reproduces the Castleman lymph node lesion,
          and until one exists how can any proposed mechanism be tested causally?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
        - pathophysiology#Follicular Dendritic Cell Meshwork Expansion
        - pathophysiology#Stromal VEGF Overproduction and Neovascularization
        rationale: 'Every mechanism node in this entry derives from human tissue association - spatial
          transcriptomics, immunohistochemistry, serum proteomics - with no perturbation experiment behind
          it, because no validated model system exists. The authors of the largest spatial study state
          this limitation directly and note that the disease may have no genetic basis to engineer, being
          instead immune-driven by antigenic stimuli whose origin is unknown. This is the upstream reason
          the causal direction of the stromal model cannot be settled: stromal activation could be driving
          the cytokine storm or responding to it.'
        proposed_experiments:
        - experiment_id: exp_cd_lymphoid_organoid_stromal_perturbation
          name: Human lymphoid organoid with defined stromal perturbation
          description: 'Build a human lymphoid organoid or lymph-node-on-chip containing primary follicular
            dendritic cells, T-zone and perivascular reticular cells, naive B cells, and endothelium,
            then perturb single stromal populations (constitutive PDGFRB N666S expression, forced VEGFA
            or IL6 expression, lymphotoxin-beta receptor stimulation, DLL4-NOTCH1 blockade) and score
            for the defining tissue readouts: CD21 meshwork expansion, concentric mantle-zone B cell layering,
            perifollicular neovascularization, and plasmablast output.'
          would_support:
          - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
          - pathophysiology#Follicular Dendritic Cell Meshwork Expansion
          supporting_outcome:
          - Perturbing a single stromal population reproduces the onion-skinning and penetrating-vessel
            architecture, establishing stromal activation as sufficient rather than reactive.
          refuting_outcome:
          - No stromal perturbation reproduces the architecture, indicating the lesion requires a systemic
            or hematopoietic input absent from the organoid.
      selected_evidence:
        snippet: The absence of accurate cell culture or murine models limits functional studies of CD.
        supports: SUPPORT
