              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Peripheral Platelet Consumption
        description: Platelet counts fall in iMCD-TAFRO despite adequate marrow megakaryocyte numbers,
          so the deficit is peripheral rather than a failure of production. This distinguishes TAFRO sharply
          from iMCD-IPL and iMCD-NOS, where thrombocytosis rather than thrombocytopenia is typical. Kept
          separate from the marrow fibrosis node because the two are different claims - one about stromal
          remodeling in the marrow, one about platelet survival in the circulation - and neither is established
          as causing the other. The mechanism of the consumption has not been established; endothelial
          injury and thrombotic microangiopathy are the leading candidates in this subtype.
        biological_scale: ORGANISM
        mechanism_confidence: HYPOTHETICAL
        biological_processes:
        - preferred_term: Negative regulation of megakaryocyte differentiation
          term:
            id: GO:0045653
            label: negative regulation of megakaryocyte differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: Thrombocytopenia and severe anasarca accompanied by relatively low serum immunoglobulin
          levels are characteristic clinical findings of TAFRO syndrome that are not present in iMCD-not
          otherwise specified (iMCD-NOS).
        supports: SUPPORT
