      assertion:
        name: PI3K/AKT/mTOR Pathway Activation
        description: In IL-6-blockade-refractory iMCD, quantitative serum proteomics, cytokine panels,
          flow cytometry, and phospho-S6 immunohistochemistry showed increased CD8+ T cell activation,
          elevated VEGF-A, and PI3K/AKT/mTOR pathway activity. Sirolimus attenuated CD8+ T cell activation,
          lowered VEGF-A, and produced durable clinical benefit in all three patients studied. This is
          the first pharmacologically targetable process identified for patients whose disease does not
          respond to IL-6 blockade, and it is the mechanistic rationale for NCT03933904. The supporting
          series is three patients.
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
