      assertion:
        name: Lymphoma
        description: Hodgkin and non-Hodgkin lymphoma both produce lymphadenopathy with systemic symptoms
          and can generate reactive Castleman-like nodal changes; iMCD-NOS in particular mimics indolent
          lymphoma. Lymphoma is a formal exclusion in the iMCD diagnostic criteria. The relationship also
          runs the other way in HHV-8+ MCD, where concurrent KSHV-driven lymphoma occurs at 28 cases per
          1,000 patient-years.
      selected_evidence:
        snippet: Patients with autoimmune disease, lymphoma, and infections can experience Castleman‐like
          changes in reactive lymph nodes, and thus histologic findings must be combined with clinical
          and laboratory findings to accurately diagnose iMCD.
        supports: SUPPORT
