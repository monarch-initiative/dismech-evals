          The producing cell appears to differ by subtype: plasma cells in iMCD-IPL, under an XBP1-driven
          endoplasmic reticulum stress and plasma-cell-differentiation program, and vascular endothelial
          cells in iMCD-TAFRO, where the serum elevation may be secondary to the cytokine storm rather
          than its cause. That difference is the leading explanation for why IL-6 blockade works well
          in IPL and poorly in TAFRO, and it is why this node is not treated as the single unifying driver
          of the disease.'
        biological_scale: MOLECULAR
