  9e12184282682af7ebf20db9dac49db57cd5074a56cdb92a405da592d1fa28f6:
    claim:
      about:
        disease:
          name: Idiopathic Multicentric Castleman Disease
          disease_term:
            preferred_term: idiopathic multicentric Castleman disease
            term:
              id: MONDO:0035838
              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_imcd_diagnostic_biomarker
        prompt: Is there a serum or tissue marker that can establish a diagnosis of iMCD, rather than
          the current diagnosis by exclusion?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - diagnosis#International consensus diagnostic criteria for iMCD
        - biochemical#C-X-C Motif Chemokine Ligand 13 (CXCL13)
        - biochemical#Interleukin-6 (IL-6)
        rationale: iMCD is diagnosed on non-specific clinical features plus characteristic but non-specific
          histopathology, after excluding infection, malignancy, and autoimmune disease - and Castleman-like
          nodal changes occur in all three of those. There is no known diagnostic serum biomarker, which
          the natural history study names as a contributor to underdiagnosis. CXCL13 is the closest candidate
          but was validated as a predictor of siltuximab response, not as a diagnostic discriminator,
          and the reported comparison groups included related diseases rather than the full mimic set
          a diagnostic test would face.
        proposed_experiments:
        - experiment_id: exp_imcd_diagnostic_biomarker_mimic_cohort
          name: Biomarker discovery against the full iMCD mimic set
          description: Compare serum proteomes of adjudicated iMCD against each mimic the diagnostic criteria
            require excluding - IgG4-related disease, HHV-8+ MCD, POEMS, lymphoma, SLE, and HLH - powered
            per comparator rather than pooling them as "related diseases", and evaluate candidate markers
            including CXCL13 as a diagnostic classifier with prespecified sensitivity and specificity
            targets.
          would_support:
          - biochemical#C-X-C Motif Chemokine Ligand 13 (CXCL13)
          supporting_outcome:
          - A marker or panel separates iMCD from every individual mimic at clinically useful sensitivity
            and specificity.
          refuting_outcome:
          - Candidate markers separate iMCD from healthy controls but not from individual mimics, confirming
            that diagnosis by exclusion is unavoidable with serum markers alone.
      selected_evidence:
        snippet: Underdiagnosis is likely as diagnostic criteria were not developed until 2017, and there
          is no known diagnostic serum biomarker.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/7
      evidence_path: /discussions/7/evidence/0
