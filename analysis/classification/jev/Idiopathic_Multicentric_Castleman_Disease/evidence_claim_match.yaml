      assertion:
        discussion_id: gap_tafro_renal_lesion_mechanism
        prompt: Which mediator causes the glomerular endothelial injury of TAFRO, and would targeting
          it prevent the dialysis requirement?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Endothelial Injury and Renal Thrombotic Microangiopathy
        - phenotypes#Acute Renal Failure
        rationale: Renal failure is the most common post-diagnosis morbidity in iMCD (48%) and 27% of
          patients require dialysis, so the renal lesion drives a large share of the disease's burden.
          The histology - membranoproliferative-like injury and thrombotic microangiopathy - points at
          glomerular endothelium, and IL-6 and VEGF are the proposed mediators, but the review that summarizes
          this states plainly that their role in renal injury is not well understood. No therapy is directed
          at the renal lesion specifically.
        proposed_experiments:
        - experiment_id: exp_tafro_renal_biopsy_mediator_mapping
          name: Spatial mediator mapping of TAFRO renal biopsies
          description: Apply the same spatial transcriptomic and in situ hybridization panel used on Castleman
            lymph nodes to banked TAFRO kidney biopsies, localizing IL6, VEGFA, complement components,
            and endothelial injury markers to glomerular compartments, and compare with thrombotic microangiopathy
            from other causes and with membranoproliferative glomerulonephritis controls.
          would_support:
          - pathophysiology#Endothelial Injury and Renal Thrombotic Microangiopathy
          supporting_outcome:
          - A specific mediator localizes to injured glomerular endothelium in TAFRO but not in the comparator
            lesions, nominating a renal-directed target.
          refuting_outcome:
          - The TAFRO renal lesion is indistinguishable from other causes of thrombotic microangiopathy,
            indicating a shared final common pathway rather than a Castleman-specific mediator.
      selected_evidence:
        snippet: The role of these cytokines in renal injury, however, is not well understood.
        supports: SUPPORT
