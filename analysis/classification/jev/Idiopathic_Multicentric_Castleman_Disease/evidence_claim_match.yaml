      assertion:
        name: Somatic Stromal Cell Mutation
        description: Recurrent somatic mutations are found in the lesional tissue of both unicentric and
          idiopathic multicentric CD. PDGFRB N666S, an activating receptor tyrosine kinase allele, is
          present in about 10% of UCD, and NCOA4 L261F in about 23% of iMCD. In paraneoplastic-pemphigus-associated
          UCD, whole-exome sequencing found IL6ST (encoding gp130) and PDGFRB as the most frequently mutated
          genes at 32% each, with IL6ST variants predicting worse overall survival. More broadly, MAPK
          and interleukin signaling pathway abnormalities cluster in UCD while chromatin-organization
          and methylation abnormalities cluster in iMCD. Whether these alleles initiate the lesion or
          accumulate within it is unresolved.
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: GAIN_OF_FUNCTION
          notes: PDGFRB N666S is an activating allele; IL6ST encodes the gp130 subunit shared by IL-6
            and vIL-6 signaling. The functional consequence of NCOA4 L261F in this disease has not been
            characterized.
