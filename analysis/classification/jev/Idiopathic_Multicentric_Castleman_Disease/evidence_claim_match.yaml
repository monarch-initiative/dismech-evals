              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Excisional lymph node biopsy
        description: 'Diagnosis requires characteristic lymph node histopathology; there is no diagnostic
          serum biomarker. Excisional biopsy is preferred over core or fine needle sampling because architectural
          features - regressed or hyperplastic germinal centers, mantle-zone onion-skinning, penetrating
          vessels, interfollicular plasmacytosis - cannot be assessed on a fragment. Histology alone is
          not sufficient: reactive Castleman-like changes occur in autoimmune disease, lymphoma, and infection,
          so the findings must be combined with clinical and laboratory data.'
        diagnosis_term:
          preferred_term: lymph node biopsy
          term:
            id: NCIT:C51900
            label: Lymph Node Biopsy
        results: Angiofollicular lymph node hyperplasia of hyaline-vascular, plasma-cell, or mixed type.
      selected_evidence:
        snippet: Patients with autoimmune disease, lymphoma, and infections can experience Castleman‐like
          changes in reactive lymph nodes, and thus histologic findings must be combined with clinical
          and laboratory findings to accurately diagnose iMCD.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
