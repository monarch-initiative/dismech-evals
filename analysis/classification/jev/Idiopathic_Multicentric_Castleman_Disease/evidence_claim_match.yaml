        description: iMCD-TAFRO presents as an acute cytokine storm with fever, cytopenias, organomegaly,
          and multiorgan failure that is clinically close to HLH or to sepsis. Both require urgent treatment
          and the therapies differ, so the distinction is made on ferritin, soluble IL-2 receptor, hemophagocytosis
