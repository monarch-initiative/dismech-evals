        - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
        - pathophysiology#Stromal VEGF Overproduction and Neovascularization
        - pathophysiology#IL-6 Overproduction
        rationale: 'The spatial data establish where VEGF and IL-6 transcripts are, not what started them.
          The question is not academic: if stromal cells are the driver, stroma-directed agents (lymphotoxin-beta
          receptor fusion proteins, VEGF inhibitors, NOTCH inhibitors) are rational; if they are responders,
          those agents treat a consequence. The evidence is one observational cohort of 22 cases with
          no perturbation, and the subtype-specific IL-6 source data point the other way for TAFRO, where
          endothelial IL-6 is proposed to be secondary to the cytokine storm.'
