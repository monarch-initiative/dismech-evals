              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: stromal_cytokine_source
        hypothesis_label: Lymph Node Stromal Cells as the Source of IL-6 and VEGF
        status: EMERGING
        description: The cells that oversupply IL-6 and VEGF in iMCD are lymph node stromal cells - PDGFRA+
          T-zone reticular cells and ACTA2+ perivascular reticular cells, with CXCL13+ follicular dendritic
          cells contributing inside follicles - rather than the hematopoietic compartment that earlier
          immunohistochemical work implicated. The T-zone and perivascular subsets are the ones that expand
          in multicentric disease, in contrast to the B-zone reticular cells that dominate the unicentric
          form. The evidence is a single spatial multi-omic study of 22 cases with no functional perturbation,
          so the causal direction (stromal activation driving the cytokine storm versus responding to
          it) is not established.
        applies_to_subtypes:
        - iMCD-TAFRO
        - iMCD-IPL
        - iMCD-NOS
      selected_evidence:
        snippet: MCD is characterized by increased TRC while UCD shows increased B-reticular cells (BRC).
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
