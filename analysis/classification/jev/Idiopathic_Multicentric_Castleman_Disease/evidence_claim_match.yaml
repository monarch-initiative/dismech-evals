              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_imcd_anti_il6_nonresponse
        prompt: What drives disease in the majority of iMCD patients who do not respond to IL-6 blockade,
          and can non-responders be identified before weeks of failed therapy have passed?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#IL-6 Overproduction
        - pathophysiology#PI3K/AKT/mTOR Pathway Activation
        - pathophysiology#CXCL13 Chemokine Axis Elevation
        rationale: 'Siltuximab produced a durable response in 34% of patients in the registration trial
          and is effective in roughly 34-50% of cases, so most patients treated with the only approved
          drug do not benefit from it, and severe patients have a narrow window before escalation to cytotoxic
          chemotherapy is needed. Two partial answers exist and neither is complete: PI3K/AKT/mTOR activation
          identified in three refractory TAFRO patients, and an early CXCL13 fall that predicts response
          by day 8. What drives the remaining non-responders is not known.'
        proposed_experiments:
        - experiment_id: exp_imcd_pretreatment_endotype_stratified_trial
          name: Pretreatment endotype stratification with response-adaptive assignment
          description: Profile serum proteome, lymph node spatial transcriptome, and PBMC phospho-signaling
            before first-line therapy in an iMCD cohort, assign a candidate endotype (IL-6-high, CXCL13-high,
            TNF-high, mTOR-high), then randomize within endotype to IL-6 blockade versus the endotype-matched
            agent (sirolimus for mTOR-high, JAK inhibition for broad gp130 signaling). A day-8 CXCL13
            readout is embedded as a prespecified early futility rule.
          would_support:
          - mechanistic_hypotheses#immune_stromal_dysregulation
          - mechanistic_hypotheses#il6_independent_mtor
          supporting_outcome:
