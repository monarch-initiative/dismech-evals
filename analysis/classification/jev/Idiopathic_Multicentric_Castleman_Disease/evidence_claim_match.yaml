              id: MONDO:0035838
              label: idiopathic multicentric Castleman disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_imcd_initiating_process
        prompt: What initiates idiopathic multicentric Castleman disease - autoimmunity, an ectopic clonal
          cytokine source, a non-HHV-8 infection, or a germline inflammatory predisposition?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Unknown iMCD Initiating Process
        - pathophysiology#Autoantibody-Mediated Immune Dysregulation
        - pathophysiology#Somatic Stromal Cell Mutation
        rationale: This is the field's central unanswered question and everything downstream depends on
          it. Three candidate processes were formally proposed in 2014 and none has been confirmed or
          excluded since. Viral-Track sequencing of 22 UCD and 19 iMCD nodes found no shared viral signature,
          weakening the infectious candidate; autoantibody enrichment supports but does not establish
          the autoimmune candidate; and recurrent somatic alleles support but do not establish a clonal
          candidate. Because the etiology is unknown, iMCD is defined by exclusion, has no diagnostic
          biomarker, and is treated with a single-cytokine blockade that fails in most patients.
        proposed_experiments:
        - experiment_id: exp_imcd_paired_multiomic_etiology_screen
          name: Paired serologic, viral, and clonality screen across adjudicated iMCD subtypes
          description: 'In a prospectively enrolled, expert-adjudicated iMCD cohort stratified by TAFRO/IPL/NOS,
            run in parallel on the same patients: unbiased autoantigen-array and functional receptor-blocking
            serology, metagenomic and viral-capture sequencing of lymph node and plasma, and deep targeted
            sequencing of sorted stromal, plasma cell, and T cell fractions for clonality. Testing the
            three candidate etiologies on shared samples is what makes them comparable; the existing evidence
            for each comes from separate cohorts.'
          would_support:
          - pathophysiology#Autoantibody-Mediated Immune Dysregulation
          - pathophysiology#Somatic Stromal Cell Mutation
          supporting_outcome:
          - A candidate process is enriched in one subtype and co-segregates with disease activity, with
            the other two candidates negative in the same patients.
          refuting_outcome:
          - All three candidate processes are negative or are equally present in disease controls, indicating
            the initiating process lies outside the three proposed categories.
      selected_evidence:
        snippet: Urgent priorities include elucidating the process driving iMCD hypercytokinemia, identifying
          the hypercytokine-secreting cell, developing consensus criteria for diagnosis, and building
          a patient registry to track cases.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
