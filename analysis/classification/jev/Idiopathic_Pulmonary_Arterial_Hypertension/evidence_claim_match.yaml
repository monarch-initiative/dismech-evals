      assertion_type: Discussion
      assertion:
        discussion_id: gap_ipah_female_predominance_mechanism
        prompt: Why is IPAH roughly four times more common in women than in men, and why is this female
          predominance concentrated in the classical phenotype and largely absent in the low-DLCO lung
          phenotype?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - prevalence#Idiopathic PAH patients across epidemiological studies
        - has_subtypes#Classical IPAH
        - has_subtypes#Lung phenotype IPAH
        - pathophysiology#Unidentified Initiating Insult in a Susceptible Pulmonary Vasculature
        rationale: The entry records a 4.1:1 female-to-male incidence ratio in IPAH and shows that it
          collapses in the lung phenotype, but offers no mechanism. Sex-hormone metabolism, sex-differential
          BMP-pathway regulation and sex differences in right ventricular adaptation are all candidate
          explanations, and they make divergent predictions. Because the sex distribution differs so sharply
          between the two registry-defined phenotypes, resolving this would help decide whether classical
          IPAH and the lung phenotype are one disease with modifiers or two diseases sharing a haemodynamic
          definition.
      selected_evidence:
        snippet: women have a higher incidence rate than men across multiple studies (4.3:1 in the total
          PAH group and 4.1:1 in the IPAH category)
        supports: SUPPORT
