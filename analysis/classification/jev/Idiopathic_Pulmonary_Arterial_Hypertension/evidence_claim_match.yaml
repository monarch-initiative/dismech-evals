      assertion_type: Pathophysiology
      assertion:
        name: Occult Rare Variant Burden and Reclassification to Heritable PAH
        biological_scale: MOLECULAR
        role: modifier
        description: 'A substantial minority of patients who satisfy IPAH criteria are subsequently found
          on comprehensive PAH gene-panel or genome sequencing to carry a rare pathogenic or likely pathogenic
          germline variant - most often a loss-of-function BMPR2 allele, and less often variants in TBX4,
          ATP13A3, SOX17, GDF2, AQP1 or other curated PAH genes. Because incomplete, age- and sex-dependent
          penetrance means many carriers have no affected relative, absence of family history does not
          exclude a germline cause. Detecting such a variant reclassifies the patient as heritable PAH
          and opens cascade screening of relatives. This node is the explicit mechanistic boundary between
          this entry and Heritable Pulmonary Arterial Hypertension: it is not a separate remodeling mechanism
          but a statement that a fraction of the IPAH population is misclassified heritable disease.'
      selected_evidence:
        snippet: A meta-analysis, performed with MOOSE, included 24 studies involving 3124 IPAH patients
          and 470 P/LP variants.
        supports: SUPPORT
