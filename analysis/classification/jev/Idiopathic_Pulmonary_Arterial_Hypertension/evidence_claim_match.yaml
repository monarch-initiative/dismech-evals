      assertion_type: Subtype
      assertion:
        name: Vasoresponder IPAH
        display_name: Acutely vasoreactive, long-term calcium-channel-blocker-responsive IPAH
        description: A small IPAH subgroup identified by acute pulmonary vasodilator testing at diagnostic
          right-heart catheterisation. Roughly one in eight IPAH patients is an acute responder, but fewer
          than 10% sustain long-term benefit on calcium-channel blocker monotherapy. Long-term responders
          have an excellent prognosis, making vasoreactivity testing a distinctive and clinically decisive
          step in IPAH (and heritable/drug-associated PAH) that is not applied across other PH groups.
      selected_evidence:
        snippet: Among the 70 patients who displayed acute pulmonary vasoreactivity (12.6%; 95% CI, 9.8%
          to 15.3%) and received CCB therapy, only 38 showed long-term improvement (6.8%; 95% CI, 4.7%
          to 8.9%).
        supports: SUPPORT
