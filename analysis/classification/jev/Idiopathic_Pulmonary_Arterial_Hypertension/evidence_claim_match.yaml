              label: idiopathic pulmonary arterial hypertension
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ipah_residual_etiology_after_genetic_testing
        prompt: After comprehensive gene-panel and genome sequencing has excluded known pathogenic variants,
          and all associated conditions and exposures have been ruled out, what actually initiates pulmonary
          vascular disease in the remaining genuinely idiopathic majority of IPAH patients?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Unidentified Initiating Insult in a Susceptible Pulmonary Vasculature
        - pathophysiology#Occult Rare Variant Burden and Reclassification to Heritable PAH
        - genetic#BMPR2
        rationale: 'This entry models IPAH as a diagnosis of exclusion with an explicit trigger node that
          names no trigger. Pooled genetic testing accounts for roughly one in five IPAH diagnoses by
          reclassifying them as heritable disease, which sharpens rather than resolves the question: the
          remaining four in five have no identified cause at all. Resolving what initiates disease in
          that residual population is the single largest mechanistic gap in this entry and determines
          whether IPAH remains a coherent disease entity or fragments into further aetiological subtypes,
          as the low-DLCO lung phenotype already suggests.'
      selected_evidence:
        snippet: the frequency of P/LP variants in our cohort (10.48%) is lower than the overall average
          of 17.75% from the meta-analysis
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
