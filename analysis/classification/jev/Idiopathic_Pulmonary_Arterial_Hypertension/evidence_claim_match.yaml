          endpoint_context: DIAGNOSTIC
          description: Carbon monoxide transfer depends on the alveolar-capillary surface and the pulmonary
            capillary blood volume it drains, so a severely reduced DLCO with preserved spirometry is
            read as a functional signal of a depleted pulmonary vascular bed rather than of airway or
            restrictive lung disease.
