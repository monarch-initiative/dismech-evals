      assertion:
        name: Lung phenotype IPAH
        display_name: IPAH with a lung phenotype (low DLCO, smoking history)
        description: An emerging IPAH subgroup that meets diagnostic criteria for IPAH but has a severely
          reduced DLCO (<45% predicted) and a smoking history, with normal or near-normal spirometry and
          little or no parenchymal lung disease on CT. These patients are older, far less female-predominant,
          and respond poorly to PAH therapy, resembling Group 3 pulmonary hypertension more than classical
          IPAH.
      selected_evidence:
        snippet: Among patients meeting diagnostic criteria for idiopathic pulmonary arterial hypertension
          (IPAH), there is an emerging lung phenotype characterised by a low diffusion capacity for carbon
          monoxide (DLCO) and a smoking history.
        supports: SUPPORT
