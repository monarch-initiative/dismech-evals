      assertion_type: Pathophysiology
      assertion:
        name: Unidentified Initiating Insult in a Susceptible Pulmonary Vasculature
        biological_scale: ORGANISM
        role: trigger
        description: 'The defining feature of IPAH is that no associated condition, drug or toxin exposure,
          or family history explains the disease after a complete evaluation. This is an epistemic rather
          than a biological null: IPAH is best modelled as a threshold disorder in which incompletely
          characterised genetic susceptibility, epigenetic dysregulation, sex-hormone biology and acquired
          vascular stresses combine to cross a disease threshold, with no single trigger identifiable
          in the individual patient. This node substitutes for the disorder-specific trigger that heritable
          PAH (a germline BMPR2-pathway lesion) and drug- or toxin-induced PAH (a culprit exposure) each
          supply, and it is the reason IPAH is a diagnosis of exclusion.'
        locations:
