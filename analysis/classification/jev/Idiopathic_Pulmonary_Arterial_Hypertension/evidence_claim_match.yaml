      assertion_type: DifferentialDiagnosis
      assertion:
        name: Heritable pulmonary arterial hypertension
        description: Clinically and mechanistically indistinguishable from IPAH at presentation; the distinction
          rests entirely on family history or on identification of a pathogenic germline variant. Because
          penetrance is incomplete and sex-dependent, a substantial minority of apparently idiopathic
          patients are genetically heritable.
        distinguishing_features:
        - A pathogenic or likely pathogenic germline variant in a curated PAH gene reclassifies IPAH as
          heritable PAH.
        - Pooled genetic testing finds pathogenic BMPR2 variants in roughly 18% of patients diagnosed
          as IPAH.
        - Family history may be absent in genetically heritable disease because of incomplete, age- and
          sex-dependent penetrance.
        disease_term:
          preferred_term: heritable pulmonary arterial hypertension
          term:
            id: MONDO:0017148
            label: heritable pulmonary arterial hypertension
      selected_evidence:
        snippet: Benefits of including molecular genetic testing within the management protocol of patients
          with PAH include the identification of individuals misclassified by other diagnostic approaches
        supports: SUPPORT
