        - preferred_term: extracellular matrix organization
          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
        - preferred_term: blood vessel remodeling
          modifier: ABNORMAL
          term:
            id: GO:0001974
            label: blood vessel remodeling
      selected_evidence:
        snippet: Spontaneous coronary artery dissection (SCAD), although in the majority of cases presents
          as an acute coronary syndrome (ACS), has different pathophysiology from atherosclerosis that
          influences specific angiography findings and enables most patients to be solved by optimal medical
          therapy rather than percutaneous coronary intervention (PCI).
        supports: SUPPORT
