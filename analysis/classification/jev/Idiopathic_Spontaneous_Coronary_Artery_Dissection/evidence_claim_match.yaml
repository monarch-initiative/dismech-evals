      assertion:
        name: Nonatherosclerotic arteriopathy and vessel wall vulnerability
        description: Many idiopathic SCAD presentations occur without plaque rupture, atherosclerotic
          stenosis, trauma, or instrumentation. A systemic nonatherosclerotic arteriopathy or extracellular
          matrix vulnerability is a common clinical framework, especially when extracoronary fibromuscular
          dysplasia, tortuosity, aneurysm, or additional dissections are found.
        cell_types:
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        locations:
        - preferred_term: coronary artery
