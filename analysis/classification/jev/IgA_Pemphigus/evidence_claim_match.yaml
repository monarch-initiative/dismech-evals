        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'In SPD-type disease the antibody''s target is desmocollin 1, a desmosomal cadherin
          that with the desmogleins holds keratinocytes together, so the expected consequence is loss
          of intercellular adhesion. That expectation is the standard account of the disease and it is
          what makes it a pemphigus.

          Graded PROVISIONAL deliberately, because the pathogenicity of anti-desmocollin autoantibodies
          is not established the way anti-desmoglein pathogenicity is. A 2023 review of the question puts
          it plainly: beyond a few in vitro and in vivo studies there is currently no clear evidence that
          anti-Dsc autoantibodies are pathogenic, in contrast to the well-established significance of
          the anti-Dsg ones. The antigen is identified; the causal step from binding it to blistering
          is inferred.'
        molecular_functions:
        - preferred_term: cell adhesion molecule binding
          term:
            id: GO:0050839
            label: cell adhesion molecule binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: calcium-dependent cell-cell adhesion
          term:
            id: GO:0016339
            label: calcium-dependent cell-cell adhesion
          modifier: DECREASED
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: These results convincingly indicate that human Dsc1 is an autoantigen for SPD-type IgA
          pemphigus, suggesting the possibility of an important role for Dsc1 in the pathogenesis of this
          disease.
        supports: SUPPORT
