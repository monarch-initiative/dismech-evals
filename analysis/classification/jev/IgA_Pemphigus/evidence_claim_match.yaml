      assertion_type: Pathophysiology
      assertion:
        name: IgA Autoantibody Production Against Keratinocyte Cell Surface
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'The initiating event, and the one that defines the disease: production of IgA autoantibodies
          binding the keratinocyte cell surface. The isotype is the diagnostic criterion - IgA pemphigus
          is defined by tissue-bound and circulating IgA antibodies where the other three pemphigus variants
          are defined by IgG.

          What triggers the autoantibody response is not known. The association with IgA monoclonal gammopathy
          (9.5 percent of reported patients) and with IgA multiple myeloma is the strongest clue available,
          and in the myeloma cases the antibody titre tracks the plasma-cell clone: treating the myeloma
          with daratumumab, lenalidomide and dexamethasone cleared both the skin lesions and the anti-desmoglein
          and anti-desmocollin IgA ELISAs.'
        cell_types:
        - preferred_term: IgA plasma cell
          term:
            id: CL:0000987
            label: IgA plasma cell
        biological_processes:
        - preferred_term: immunoglobulin production
          term:
            id: GO:0002377
            label: immunoglobulin production
          modifier: DYSREGULATED
      selected_evidence:
        snippet: IgA pemphigus is characterized by tissue-bound and circulating IgA antibodies targeting
          desmosomal or nondesmosomal cell surface components in the epidermis.
        supports: SUPPORT
