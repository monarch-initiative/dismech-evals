  66e7f3127e1b18ebe6bff892f97dac533f66cb13638b638a9776bf68770dd16c:
    claim:
      about:
        disease:
          name: IgA Pemphigus
          disease_term:
            preferred_term: IgA pemphigus
            term:
              id: MONDO:0034127
              label: IgA pemphigus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FcalphaRI Cross-Linking on Neutrophils
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The step that makes the isotype matter, and the reason this disease is neutrophilic
          where the IgG pemphigus variants are not. FcalphaRI (CD89) is the IgA Fc receptor, expressed
          on neutrophils, eosinophils, monocytes and several macrophage subsets. Cross-linking it with
          IgA immune complexes sets off superoxide production, cytokine release, phagocytosis, degranulation
          and NET release - and, critically, release of the chemoattractant leukotriene B4, which recruits
          further neutrophils in a positive feedback loop.

          That loop is useful against IgA-opsonised bacteria, where it self-terminates when the organism
          is cleared. Against a fixed autoantigen in the epidermis it does not terminate, which is the
          account this entry curates of why the inflammation is sustained.

          The evidence is not disease-specific to IgA pemphigus: it is receptor biology, established in
