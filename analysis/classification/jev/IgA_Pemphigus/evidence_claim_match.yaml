      assertion_type: Treatment
      assertion:
        name: Treatment of an Underlying IgA Plasma Cell Dyscrasia
        description: 'Where an IgA myeloma is present, treating it treats the skin. In the reported case
          daratumumab, lenalidomide and dexamethasone cleared both the lesions and the anti-desmoglein
          and anti-desmocollin IgA ELISAs.

          This is the only reported treatment that acts on the autoantibody''s source rather than on the
          downstream inflammation, which is why it is curated separately from the immunosuppressants.
          It applies to a small minority.

          therapeutic_modality is OTHER rather than MONOCLONAL_ANTIBODY: daratumumab is one of three components,
          and the regimen as given also contains an immunomodulatory small molecule and a corticosteroid.
          Tagging the whole regimen by its antibody component would misclassify it. All three agents are
          bound individually instead.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
