      reference: PMID:38751960
      reference_title: A case of IgA pemphigus, with a poor response to dapsone, successfully treated
        with adalimumab.
      evidence_source: OTHER
      explanation: 'Directly contradicts the phenotype as curated, and kept rather than omitted because
        the fact that a 2024 case report makes the claim is itself evidence that the point is unsettled
        in this literature. Two other cited sources describe acantholytic cells and one describes acantholytic
        blisters, so the flat denial is not supportable on its own. NO_EVIDENCE is deliberate and is the
        weakest part of this item. REFUTE would read better as direction, but on a phenotypes[] item it
        is also a publication decision: it maps to an HPOA NOT qualifier, so it would assert to downstream
        consumers that IgA pemphigus does not feature acantholysis - a claim this very explanation argues
        against. Grading it SUPPORT is worse still, and is what the retired WRONG_STATEMENT value silently
        did here. NO_EVIDENCE publishes nothing while leaving the source, the quote and this reasoning
        visible. The substantive disagreement is carried by the phenotype description and by discussions[1].'
