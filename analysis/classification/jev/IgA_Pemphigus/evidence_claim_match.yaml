      assertion_type: Treatment
      assertion:
        name: Dapsone
        description: 'The drug of choice, and mechanistically apt: dapsone''s anti-inflammatory action
          is on neutrophil function, which is the effector arm of this disease rather than an incidental
          feature of it. Oral dapsone and corticosteroids were the two commonest treatments across the
          entire reported literature.

          It is not reliably effective. A minority of patients do not clear on it, and recalcitrant disease
          is well enough recognised to have a second-line list - colchicine, sulfapyridine, acitretin
          - and reported failures even of those.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
