      assertion_type: Subtype
      assertion:
        name: SPD type
        display_name: Subcorneal pustular dermatosis type
        description: 'Pustules in the uppermost epidermis, immediately beneath the stratum corneum, with
          IgA deposited in the intercellular space of the upper epidermis. The autoantigen is desmocollin
          1. It is the subtype associated with IgA monoclonal gammopathy and with IgA multiple myeloma.

          A diagnostic caution that follows from the antigen being known: SPD-type IgA pemphigus is clinically
          and histopathologically indistinguishable from classical subcorneal pustular dermatosis (Sneddon-Wilkinson
          disease), which has no autoantibody at all. In the largest cohort all thirteen classical SPD
          cases were immunologically negative and could not be told apart from the seventeen SPD-type
          IgA pemphigus cases on clinical or histological grounds. The immunofluorescence is the only
          thing that separates them.'
      selected_evidence:
        snippet: IgA antibodies of all six SPD-type IgA pemphigus cases reacted with the surface of cells
          expressing Dsc1, but not with cells expressing Dsc2 or Dsc3
        supports: SUPPORT
