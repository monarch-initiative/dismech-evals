  6a815d1779064e47e1a56b97f3a1091841bf32cc85080afdacba1c2942c3fdca:
    claim:
      about:
        disease:
          name: IgG4-Related Disease
          disease_term:
            preferred_term: IgG4-related disease
            term:
              id: MONDO:0017287
              label: immunoglobulin G4-related sclerosing disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: innate_first_bystander_model
        hypothesis_label: Innate-First Bystander Activation Model
        status: ALTERNATIVE
        description: Innate receptor activation can promote B-cell responses and fibroinflammation in
          cell systems and mouse models. An innate-initiation/adaptive-amplification sequence is a plausible
          alternative in human IgG4-RD, but its temporal transition is unobserved. Established adaptive
          responses show clonal selection; that disfavors a purely nonspecific bystander explanation without
          excluding a concurrent or earlier nonspecific component.
        notes: The report is useful for innate component pathways but the distinctive composite hypothesis
          remains weakly supported/unresolved. Mouse initiation does not establish human initiation. Anti-CD19
          efficacy shows therapeutic relevance of B-lineage functions, not universal necessity of antigen-specific
          adaptive immunity. NOD2/BAFF and basophil experiments concern cultured cells; the pDC pathway
          has separate primary evidence, although the report mislabels a review as an independent study.
          The two-phase transition remains an open alternative and is not encoded as a proven causal edge.
      selected_evidence:
        snippet: TLR-7-expressing M2 macrophages may promote the activation of Th2 immune responses via
          IL-33 secretion in IgG4-RD.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31339007
      reference_title: Activated M2 Macrophages Contribute to the Pathogenesis of IgG4-Related Disease
        via Toll-like Receptor 7/Interleukin-33 Signaling.
      evidence_source: OTHER
      explanation: This concluding sentence synthesizes human tissue, cultured macrophage and transgenic-mouse
        results. It supports an innate amplifier, not temporal priority in human disease.
