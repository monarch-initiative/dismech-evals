              label: immunoglobulin G4-related sclerosing disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_igg4rd_organ_tropism_and_fibroinflammation
        prompt: Why do shared plasmablast, IgG4 class-switching, and CD4-positive cytotoxic-T-cell programs
          produce different organ manifestations such as pancreatitis, cholangitis, retroperitoneal fibrosis,
          kidney disease, and salivary/lacrimal gland enlargement?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Storiform Fibrosis
        - pathophysiology#Organ-Specific Fibroinflammatory Injury
        rationale: IgG4-RD has a conserved fibroinflammatory histology, but the current model cannot yet
          explain why particular organs are targeted in individual patients. Organ-restricted antigens,
          epithelial-barrier functions, chemokine niches, and local stromal repair programs remain plausible
          but incompletely connected mechanisms.
        proposed_experiments:
        - experiment_id: exp_igg4rd_multi_organ_single_cell_stromal_immune_map
          name: Multi-organ single-cell immune-stromal map of IgG4-RD lesions
          description: Compare affected pancreas, bile duct, kidney, retroperitoneum, and salivary/lacrimal
            tissues using single-cell RNA sequencing, spatial transcriptomics, BCR/TCR sequencing, and
            autoantigen staining to separate shared fibroinflammatory circuitry from organ-specific injury
            programs.
          experiment_type:
            preferred_term: multi-organ single-cell spatial profiling study
          model_systems:
          - name: Human IgG4-RD affected-organ biopsy cohort
            description: Cross-organ biopsy cohort with matched blood, histopathology, serum autoantibody,
              and treatment-response metadata.
            experimental_model_type: OTHER
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
          readouts:
          - name: Organ-specific antigen and stromal activation signatures
            target: pathophysiology#Organ-Specific Fibroinflammatory Injury
            description: Spatial colocalization of candidate autoantigens, plasmablasts/plasma cells,
              CD4+ CTLs, macrophages, fibroblasts, myofibroblasts, and extracellular matrix gene programs.
            assays:
            - preferred_term: single-cell RNA sequencing
            - preferred_term: spatial transcriptomics
            direction: POSITIVE
          decision_criterion: Organ tropism is supported as antigen/barrier-driven if candidate autoantigen
            expression and barrier injury localize with immune clonotypes and stromal activation in the
            affected organ more strongly than in unaffected or disease-control tissue.
          would_support:
          - pathophysiology#Organ-Specific Fibroinflammatory Injury
          - pathophysiology#Storiform Fibrosis
      selected_evidence:
        snippet: This makes it tempting to speculate that a decreased epithelial barrier function with
          attraction of immune cells and impaired bicarbonate secretion as a result of dysfunction of
          laminin 511 by autoantibody binding could potentially be a common systemic pathogenic mechanism
          in a subset of patients with IgG4-RD.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
