        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: plasmablast_autoantigen_fibrosis_driver_model
        hypothesis_label: Plasmablast-Autoantigen Fibrosis Driver Model
        status: CANONICAL
        description: An adaptive immune framework in which antigen-experienced B cells, plasmablasts and
          T-cell populations participate in chronic fibroinflammation. Tfh cells enhance IgG4 production
          and plasmablast differentiation in coculture; B-lineage cells can directly stimulate fibroblast
          collagen production, and cytotoxic T cells show tissue injury and profibrotic mediator programs.
          Universal autoantigen identity, the precise B-cell-to-CTL interaction and the CTL-specific route
          to storiform architecture remain unresolved.
      selected_evidence:
        snippet: CD4+ CTLs in affected tissues secrete pro-fibrotic cytokines including IL-1β, TGF-β1,
          and IFN-γ as well as cytolytic molecules such as perforin and granzymes A and B.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28166682
      reference_title: Clonally expanded cytotoxic CD4(+) T cells and the pathogenesis of IgG4-related
        disease.
      evidence_source: OTHER
      explanation: Review-level synthesis supports CD4+ cytotoxic T cells as the immune-cell arm most
        directly linked to fibrogenic mediator production.
