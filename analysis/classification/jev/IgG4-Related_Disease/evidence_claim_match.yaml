      assertion_type: Phenotype
      assertion:
        name: Peripheral Blood Eosinophilia
        category: Hematologic
        frequency: OCCASIONAL
        description: Raised blood eosinophil counts occur as part of an atopy-associated cluster alongside
          allergic comorbidity and elevated serum IgE. This is a blood finding and is distinct from the
          tissue eosinophilia recorded as a supportive histopathologic feature.
        notes: A systematic review and meta-analysis of 32 studies puts the pooled proportion with eosinophilia
          at 22%, alongside allergy in 44% and hyper-IgE in 73%. The co-occurrence is well replicated;
          whether the type 2 axis contributes causally to IgG4-RD or simply travels with it is unresolved,
          so no causal edge is drawn from this phenotype in the pathograph.
        phenotype_term:
          preferred_term: Peripheral blood eosinophilia
          term:
            id: HP:0001880
            label: Increased total eosinophil count
      selected_evidence:
        snippet: The pooled proportion with eosinophilia was 0.22 (95% CI, 0.18, 0.26; p < 0.01; n = 4376),
          and with hyper-IgE was 0.73 (95% CI, 0.63, 0.83; p < 0.01; n = 2353).
        supports: SUPPORT
