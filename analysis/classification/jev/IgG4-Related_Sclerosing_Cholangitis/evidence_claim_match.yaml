        - Tissue sampling, cytology, imaging, and repeat evaluation are needed when malignancy remains
          possible.
        - Steroid trials should be avoided when neoplasia has not been reasonably excluded.
      selected_evidence:
        snippet: If IgG4-SC cannot be clinically ruled out, a patient must not be treated with facile
          steroid therapy but should be referred to a specialized medical facility.
        supports: SUPPORT
