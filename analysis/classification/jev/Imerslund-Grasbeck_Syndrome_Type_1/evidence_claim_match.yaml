            factor-cobalamin binding region, and is a missense change rather than a truncation, so cubilin
            still reaches the brush border. What it destroys is ligand recognition: surface plasmon resonance
            shows the substitution raises the dissociation constant for intrinsic factor-cobalamin several-fold,
            mostly by slowing association. This is the allele behind the Finnish prevalence figure this
            entry records, and it is the cleanest evidence that IGS is a receptor-affinity disease and
            not only a receptor-abundance one.'
