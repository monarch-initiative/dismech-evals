              label: Imerslund-Grasbeck syndrome type 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Selective cobalamin malabsorption with normal intrinsic factor
        description: 'The diagnostic logic is subtractive: establish cobalamin deficiency, show it is
          due to malabsorption, show the malabsorption is not corrected by giving intrinsic factor, and
          exclude the other causes of cobalamin malabsorption. A trap sits inside this. Cobalamin deficiency
          itself damages enterocyte function, so absorption testing during the deficient state can read
          as generalised malabsorption; tests must be repeated after the deficiency is corrected. That
          is one reason molecular testing of CUBN, AMN and GIF has largely displaced absorption testing.'
      selected_evidence:
        snippet: In diagnosing this disease, it is important to be aware that cobalamin deficiency affects
          enterocyte function; therefore, all tests suggesting general and cobalamin malabsorption should
          be repeated after abolishment of the deficiency.
        supports: SUPPORT
