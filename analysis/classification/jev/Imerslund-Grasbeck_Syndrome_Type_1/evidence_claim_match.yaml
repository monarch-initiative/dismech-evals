        notes: 'Cubilin is the 460 kDa ligand-binding subunit of cubam, encoded in 67 exons on chromosome
          10p12.1.

          Where the variant falls in the gene decides which of the two organ arms is affected, and this
          is the most useful genotype-phenotype fact about CUBN. IGS-causing alleles cluster in the N-terminal
          third, which holds both the amnionless-association helix and the CUB 5-8 intrinsic factor-cobalamin
          binding site. Variants after the vitamin B12-binding domain leave intestinal cobalamin uptake
          intact and present instead as isolated childhood-onset albuminuria with normal renal function,
          a phenotype mild enough that four such variants show up as albuminuria associations in population
          cohorts. A C-terminal CUBN genotype should therefore not be reported as IGS without evidence
          of cobalamin malabsorption.'
