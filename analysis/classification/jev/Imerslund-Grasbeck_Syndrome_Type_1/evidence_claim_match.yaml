            description: 'A naturally occurring canine CUBN disease. It is the model in which a CUBN lesion,
              rather than an AMN one, produces the syndrome, which matters because the mouse is not usable
              here: cubam has rodent-specific functions in embryogenesis and the AMN knockout is embryonic
              lethal. The Border Collie disease is milder and later in onset than the giant schnauzer
              and Australian shepherd AMN diseases.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Failure of Cubam Receptor Assembly at the Brush Border
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: A spontaneous biallelic CUBN lesion in an outbred animal, producing cobalamin malabsorption
          with selective proteinuria, the same two-organ pattern as the human disease and from the same
          gene.
        limitations: The canine allele is a C-terminal (exon 53) frameshift, whereas human IGS alleles
          cluster in the N-terminal third. The model therefore demonstrates that a CUBN lesion can abrogate
          cubam function, but its allele is not positionally representative of the human mutation spectrum,
          and human C-terminal variants give isolated proteinuria rather than IGS. Fidelity is recorded
          as MODERATE rather than HIGH for that reason.
      selected_evidence:
        snippet: The border collie disorder indicates that a CUBN mutation far C-terminal from the intrinsic
          factor-cobalamin binding site can abrogate receptor expression and cause Imerslund-Gräsbeck
          syndrome.
        supports: SUPPORT
