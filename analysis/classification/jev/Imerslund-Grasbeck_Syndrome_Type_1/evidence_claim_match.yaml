  1439ac56fe01e016904fcf117ec99fe41318378f538e2f0ead8d79e3fcc3f49b:
    claim:
      about:
        disease:
          name: Imerslund-Grasbeck Syndrome Type 1
          disease_term:
            preferred_term: Imerslund-Grasbeck syndrome type 1
            term:
              id: MONDO:0100156
              label: Imerslund-Grasbeck syndrome type 1
        context: []
      assertion_type: Phenotype
      assertion:
        name: Proteinuria
        category: Renal
        description: 'Mild, persistent, and unaccompanied by any decline in renal function.

          The frequency is contested, and the disagreement is worth carrying rather than resolving. A
          2006 review put it at about half of patients. The 2023 systematic review of every published
          case found 212 of 239 patients with documented urinalysis had it, 89%, and recommends urinalysis
          in any child with vitamin B12 deficiency on the strength of that. The same review then argues
          against its own number: urinalysis was documented in far fewer patients than clinical features
          were, so 62% may be closer, and patients without proteinuria are less likely to be worked up
          for IGS at all, which inflates the observed fraction. The band recorded here follows the systematic
          review''s primary figure. Its own lower estimate, 62%, sits in the FREQUENT band instead, so
          this entry does not treat the choice as settled.

          Finland is the documented exception, at 20% against 89% elsewhere. That matters here specifically:
          the Finnish founder allele recorded in the variants section is a missense change that reduces
          intrinsic factor-cobalamin affinity rather than abolishing the receptor, which is a candidate
          explanation for a spared renal arm.

          Its absence does not exclude the diagnosis under any of these figures.'
        phenotype_term:
          preferred_term: Proteinuria
          term:
            id: HP:0000093
            label: Proteinuria
          temporality: CHRONIC
        frequency: VERY_FREQUENT
      selected_evidence:
        snippet: In 239/456 patients, urinalysis was documented. Of these patients, 212 (89%) had proteinuria.
          Only in Finland, the fraction of patients with proteinuria was lower than in other countries
          (20% had proteinuria, 18% had no proteinuria, 62% had no urinalysis).
        supports: SUPPORT
    origin:
