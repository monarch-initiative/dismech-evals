            term:
              id: MONDO:0100156
              label: Imerslund-Grasbeck syndrome type 1
        context: []
      assertion_type: Treatment
      assertion:
        name: High-dose oral cobalamin
        description: 'Passive diffusion absorbs a small fraction of an oral dose independently of any
          receptor, so a large enough daily oral dose could in principle substitute for injections. The
          direct evidence in this disease is canine: three Beagles with hereditary cobalamin malabsorption
          were maintained in clinical and metabolic remission on 1 mg oral cyanocobalamin daily.

          No equivalent human trial exists in IGS. That is not the same as no human support: the 2023
          systematic review states plainly that patients may be treated orally provided the dose is raised,
          and describes one of its own two new patients, an IGS sibling, corrected on 1 mg oral cyanocobalamin
          daily. So this is an accepted option supported by observation rather than an untested hypothesis,
          and what is missing is a controlled comparison against injections, not evidence that it works
          at all.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: cyanocobalamin
            term:
              id: CHEBI:17439
              label: cyanocob(III)alamin
      selected_evidence:
        snippet: Patients may be treated with oral vitB12 supplementations but may need higher doses.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/1
      context_paths:
