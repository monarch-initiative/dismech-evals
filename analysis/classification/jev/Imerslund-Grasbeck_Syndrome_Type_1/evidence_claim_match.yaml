  12b72e4bd548f1204c38903a774e3492158185c8b8cd9fa98aa3b4df648624dd:
    claim:
      about:
        disease:
          name: Imerslund-Grasbeck Syndrome Type 1
          disease_term:
            preferred_term: Imerslund-Grasbeck syndrome type 1
            term:
              id: MONDO:0100156
              label: Imerslund-Grasbeck syndrome type 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Cubam Receptor Assembly at the Brush Border
        biological_scale: MOLECULAR
        description: 'Cubilin has no transmembrane domain and no endocytic motif of its own. Amnionless
          supplies both, binding the N-terminal third of cubilin and carrying it to the apical surface;
          neither subunit endocytoses ligand alone. A cubilin that cannot bind amnionless, or cannot bind
          intrinsic factor-cobalamin, leaves a brush border without a working receptor.

          Cubam is not the whole endocytic machine. Megalin (LRP2) is required for efficient internalization
          of cubilin and its ligands, so apical uptake depends on a three-protein system in which CUBN
          supplies ligand recognition and the other two supply membrane anchoring and internalization.
          The same cubilin regions bind intrinsic factor-cobalamin and albumin, which is why one receptor
          lesion produces both the intestinal and the renal arm of this disease rather than one or the
          other.'
        cellular_components:
        - preferred_term: apical brush border membrane
          term:
            id: GO:0016324
            label: apical plasma membrane
        molecular_functions:
        - preferred_term: intrinsic factor-cobalamin binding by cubilin
          modifier: DECREASED
          term:
            id: GO:0031419
            label: cobalamin binding
      selected_evidence:
        snippet: In transfected cells expressing either AMN or a truncated IF-cobalamin-binding cubilin
          construct, neither protein alone conferred ligand endocytosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:14576052
      reference_title: The functional cobalamin (vitamin B12)-intrinsic factor receptor is a novel complex
        of cubilin and amnionless.
      evidence_source: IN_VITRO
      explanation: The transfection experiment establishing that a lone cubilin subunit cannot endocytose
        ligand, which is why a CUBN lesion abolishes receptor function rather than merely reducing it.
