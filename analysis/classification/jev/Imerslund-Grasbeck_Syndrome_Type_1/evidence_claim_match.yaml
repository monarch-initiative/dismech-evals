      - /disease_term
    evidence_metadata:
      reference: PMID:37710296
      reference_title: 'Imerslund-Gräsbeck syndrome: a comprehensive review of reported cases.'
      evidence_source: HUMAN_CLINICAL
      explanation: Human observational support for the oral route, from the systematic review of every
        published case. It is what makes this a recognised option rather than an extrapolation from the
