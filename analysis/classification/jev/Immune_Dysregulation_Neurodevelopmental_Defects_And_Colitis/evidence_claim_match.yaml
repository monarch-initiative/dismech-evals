          of the beta-propeller and abolishes surface expression of alphaV and its partner beta3; and
          compound heterozygous c.1564_1564+3delAGTA (splice donor loss, p.Cys502*) with c.2247-1G>A (exon
          23 skipping) in the third family, where ITGAV transcripts were nearly undetectable.'
      selected_evidence:
        snippet: However, the ITGAV variant created a novel acceptor splice site in exon 4 that was predicted
          to be stronger than the canonical acceptor site.
        supports: SUPPORT
