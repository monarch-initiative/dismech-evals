        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Integrin-Mediated Latent TGF-beta Activation
        description: TGF-beta is secreted bound to its latency-associated peptide and needs the RGD-binding
          integrins alphaVbeta6 and alphaVbeta8 to become active. In mice, abolishing the integrin-binding
          RGD motif of latent TGF-beta1 reproduces the vascular, inflammatory and immune features of TGF-beta1
          deficiency even though latent TGF-beta1 is made normally. ITGAV deficiency removes both activating
          integrins at once.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: These findings indicate that RGD-binding integrins are requisite latent TGFbeta1 activators
          during development and in the immune system.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17353357
      reference_title: Absence of integrin-mediated TGFbeta1 activation in vivo recapitulates the phenotype
        of TGFbeta1-null mice.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that integrin binding is required to activate latent TGF-beta1 in vivo
        during development and in the immune system.
