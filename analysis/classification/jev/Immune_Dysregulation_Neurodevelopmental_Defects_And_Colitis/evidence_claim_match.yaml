        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ITGAV Biallelic Loss of Function
        description: Biallelic ITGAV variants reduce or abolish functional integrin alphaV, either by
          aberrant splicing with nonsense-mediated decay or by a missense change that blocks trafficking
          of the alphaV heterodimer to the cell surface. Every alphaV integrin (alphaVbeta1, beta3, beta5,
          beta6, beta8) is affected because alphaV is their shared subunit. This is the initiating lesion.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ITGAV
          modifier: DECREASED
          term:
            id: hgnc:6150
            label: ITGAV
        molecular_functions:
        - preferred_term: transforming growth factor beta binding
          modifier: DECREASED
          term:
            id: GO:0050431
            label: transforming growth factor beta binding
      selected_evidence:
        snippet: the surface expression of Integrin αV and one of its associated β subunits, ITGB3, which
          are both normally well-expressed in lymphocytes, was virtually undetected in P2 compared with
          his healthy brother
        supports: SUPPORT
