      assertion_type: Pathophysiology
      assertion:
        name: T Cell Dysregulation
        description: Th1/Th17 imbalance and reduced regulatory T cell function contribute to loss of tolerance.
          Cytotoxic T cells may directly kill platelets and megakaryocytes.
        cell_types:
        - preferred_term: CD4+ T Cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: Immune Regulation
          term:
            id: GO:0002682
            label: regulation of immune system process
      selected_evidence:
        snippet: Studies have shown that an imbalance between T helper 17 (Th17) and Regulatory T (Treg)
          cells differentiated from CD4+T-cells is a key factor influencing the development and pathogenesis
          of immune thrombocytopenia. Th17 cells promote the development of chronic inflammatory disorders
          and induce autoimmune diseases, whereas Treg cells regulate immune homeostasis and prevent autoimmune
          diseases.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37062251
      reference_title: Regulatory factors involved in Th17/Treg cell balance of immune thrombocytopenia.
      explanation: This review establishes that Th17/Treg imbalance is a key pathogenic factor in ITP,
        with Th17 cells promoting autoimmunity and Treg dysfunction leading to loss of tolerance.
