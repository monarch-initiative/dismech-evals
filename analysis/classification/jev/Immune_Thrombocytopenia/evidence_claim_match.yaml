      assertion:
        name: Antiplatelet Antibody Production
        description: Autoantibodies (primarily IgG) target platelet surface glycoproteins, especially
          GPIIb/IIIa and GPIb/IX. Antibody-coated platelets are cleared by splenic macrophages through
          Fc receptor-mediated phagocytosis.
        cell_types:
        - preferred_term: Platelet
          term:
            id: CL:0000233
            label: platelet
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: Phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
      selected_evidence:
        snippet: A better understanding of the underlying pathology has facilitated the development of
          a number of new targeted therapies (Bruton's tyrosine kinase inhibitors, neonatal Fc receptors,
          strategies targeting B and plasma cells, strategies targeting T cells, complement inhibitors,
          and newer TPO-RAs for improving megakaryopoiesis), which seem to be highly effective and well
          tolerated and result in a significant improvement in patients' quality of life.
        supports: NO_EVIDENCE
