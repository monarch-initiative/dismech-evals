            term:
              id: MONDO:0008558
              label: autoimmune thrombocytopenic purpura
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Megakaryopoiesis
        description: Autoantibodies also target megakaryocytes, impairing platelet production. T cell-mediated
          megakaryocyte damage and cytokine effects further suppress thrombopoiesis.
        cell_types:
        - preferred_term: Megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
        biological_processes:
        - preferred_term: Platelet Formation
          term:
            id: GO:0030220
            label: platelet formation
      selected_evidence:
        snippet: In vitro studies using ITP sera or monoclonal antibodies against platelet and megakaryocyte
          surface glycoproteins have shown an impairment of many steps of megakaryopoiesis and thrombopoiesis,
          such as megakaryocyte differentiation and maturation, migration from the osteoblastic to the
          vascular niche, adhesion to extracellular matrix proteins, and proplatelet formation, resulting
          in impaired and ectopic platelet production in the bone marrow and diminished platelet release
          in the bloodstream.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38525349
      reference_title: Immune attack on megakaryocytes in immune thrombocytopenia.
      explanation: This study demonstrates that ITP autoantibodies directly impair multiple steps of megakaryocyte
        maturation and platelet production, contributing to thrombocytopenia beyond peripheral destruction.
