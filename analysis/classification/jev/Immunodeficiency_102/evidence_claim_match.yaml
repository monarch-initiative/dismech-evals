        burden_level: VARIABLE
        rationale: The reported range runs from an asymptomatic hemizygous brother, through an adult carried
          for decades under a common variable immunodeficiency label with two severe viral episodes, to
          refractory autoimmune cytopenias requiring splenectomy. Recurrent sinopulmonary, cutaneous and
          mucosal infection is the common thread, and the immune dysregulation rather than the infection
          burden is what drives the most severe presentations. With fewer than a dozen reported patients
          and a median follow-up measured in single case reports, any single burden level would overstate
          what is known.
      selected_evidence:
