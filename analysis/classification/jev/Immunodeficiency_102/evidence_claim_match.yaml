      assertion_type: Pathophysiology
      assertion:
        name: NK Cell Depletion and Impaired Cytotoxicity
        biological_scale: CELLULAR
        description: 'NK cell numbers are reduced in most reported patients, and NK deficiency is a recurring
          feature of the SASH3 cases ascertained through congenital neutropenia sequencing. The mechanism
          is the least settled part of this entry. In the mouse, SLy1 in NK cells does not act as a signalling
          scaffold at all: it stabilises the ribosome, and its loss frees ribosomal proteins, stabilises
          p53, and drives NK senescence and exhaustion with reduced cytotoxicity. Whether human SASH3
          has the same non-signalling role in NK cells has not been tested, so the mouse mechanism is
          recorded here but not asserted of patients.'
        cell_types:
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        biological_processes:
        - preferred_term: natural killer cell mediated cytotoxicity
          term:
            id: GO:0042267
            label: natural killer cell mediated cytotoxicity
          modifier: DECREASED
      selected_evidence:
        snippet: A shared feature among these cases was a tendency toward reduced lymphocyte subsets,
          particularly NK cells.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
