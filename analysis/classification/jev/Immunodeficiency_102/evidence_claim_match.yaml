      assertion_type: Pathophysiology
      assertion:
        name: Impaired Germinal Center Reaction and Loss of Class-Switched Memory B Cells
        biological_scale: TISSUE
        conforms_to: germinal_center_reaction#Germinal Center Reaction
        description: The humoral arm fails at the germinal centre. Splenic histology in one patient, examined
          after a clinically indicated splenectomy, showed severe hypoplasia or absence of germinal centres.
          Patients consistently lose class-switched and IgM memory B cells even when total B-cell numbers
          and IgG are preserved, and serum IgM is frequently low. In the Sly1 mutant mouse the corresponding
          defect is a selective block at the marginal-zone B-cell transition with severely impaired antibody
          responses to both T-dependent and T-independent antigens.
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: class switched memory B cell
          term:
            id: CL:0000972
            label: class switched memory B cell
        biological_processes:
        - preferred_term: germinal center formation
          term:
            id: GO:0002467
            label: germinal center formation
          modifier: DECREASED
        - preferred_term: immunoglobulin isotype switching
          term:
            id: GO:0045190
            label: isotype switching
          modifier: DECREASED
        - preferred_term: immunoglobulin production
          term:
            id: GO:0002377
            label: immunoglobulin production
          modifier: DECREASED
        locations:
        - preferred_term: spleen
          term:
            id: UBERON:0002106
            label: spleen
      selected_evidence:
        snippet: However, further analysis of B cells demonstrated a considerable reduction in IgM memory
          B cells (CD19+CD27+IgD+) at 1.6% and switched memory B cells (CD19+CD27+IgD−) at 2.4%
        supports: SUPPORT
