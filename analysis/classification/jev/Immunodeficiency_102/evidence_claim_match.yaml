        description: Thymic cellularity falls by roughly half, with a block at the double-negative to
          double-positive transition driven by premature programmed cell death.
        limitations: The human block is inferred from in vitro differentiation of patient CD34+ cells
          and from a T-cell receptor alpha rearrangement signature, not from thymic tissue, so the staging
          observed in the mouse has never been confirmed in a patient. The mouse is also a complete null,
          whereas one human variant is missense.
        readouts:
        - name: Ribosomal protein S6 phosphorylation and nutrient receptor induction in thymocytes
          target: Thymocyte Survival Failure and Reduced Thymic Output
