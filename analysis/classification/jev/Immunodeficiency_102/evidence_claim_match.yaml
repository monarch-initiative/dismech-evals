      assertion_type: Pathophysiology
      assertion:
        name: Failure of Antigen Receptor Signal Propagation
        biological_scale: MOLECULAR
        description: Without the SASH3 scaffold, signals initiated at the T-cell and B-cell antigen receptors
          are not propagated normally. In the mouse the same protein is phosphorylated on Ser27 upon T-
          or B-cell receptor engagement and shuttles from nucleus to cytoplasm, which is the molecular
          event this node loses. In patients the readout is abnormal T-cell activation and proliferation,
          and the defect is corrected by re-expressing SASH3.
        biological_processes:
        - preferred_term: T cell receptor signaling
          term:
            id: GO:0050852
            label: T cell receptor signaling pathway
          modifier: DECREASED
        - preferred_term: B cell receptor signaling
          term:
            id: GO:0050853
            label: B cell receptor signaling pathway
          modifier: DECREASED
        - preferred_term: intracellular signal transduction downstream of the antigen receptor
          term:
            id: GO:0035556
            label: intracellular signal transduction
          modifier: DECREASED
      selected_evidence:
        snippet: SASH3 deficiency was described as a novel X-linked combined immunodeficiency with immune
          dysregulation, associated with impaired TCR signaling and thymocyte survival in humans.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
