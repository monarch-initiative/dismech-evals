    evidence_metadata:
      reference: PMID:40510848
      reference_title: Expanding the phenotypic and genetic landscape of congenital neutropenia through
        whole-exome and genome sequencing.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The human observation, and marked INDIRECT because of the inference step it needs:
        the sentence is about the immunodeficiency-gene subset of a congenital-neutropenia cohort as a
        whole, not about the SASH3 patient in it. SASH3 is named among those genes elsewhere in the same
        paper, so NK reduction in this disease follows from the cohort statement rather than being asserted
        by it.'
