        biological_scale: CELLULAR
        description: 'Developing thymocytes require the SASH3 scaffold to survive the transition from
          the CD4-CD8- double-negative to the CD4+CD8+ double-positive stage. In patients this is inferred
          from in vitro differentiation of CD34+ progenitors and from the rearrangement signature at the
          T-cell receptor alpha locus, which reports how long thymocytes survive at the double-positive
          stage. In the mouse the block is direct and staged: thymic cellularity falls by about half and
          precursors are deleted by premature programmed cell death, with reduced proliferation in the
          DN3 subpopulation contributing.'
        cell_types:
