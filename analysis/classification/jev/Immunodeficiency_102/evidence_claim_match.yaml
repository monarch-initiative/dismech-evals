        notes: 'Hemizygous germline loss-of-function variants in SASH3 on the X chromosome. No cited source
          in this entry states the cytogenetic band, so none is recorded. Four variant types had been
          reported worldwide as of the 2025 case report PMID:40947476, which tabulates them: three nonsense
          (c.505C>T p.Gln169*, c.733C>T p.Arg245*, c.862C>T p.Arg288*) and one missense (c.1039C>T p.Arg347Cys).
          Arg347 is conserved from Xenopus to human and sits in a putative protein-kinase-A binding motif
          adjacent to the Ser349 phosphorylation site, which is the proposed reason a single missense
          substitution behaves like a null. The gene is also known as SLY1; the mouse literature, which
          is far larger than the human, uses that name.'
      selected_evidence:
        snippet: Here, we identified 3 novel SASH3 deleterious variants in 4 unrelated male patients with
          a history of combined immunodeficiency and immune dysregulation that manifested as recurrent
          sinopulmonary, cutaneous, and mucosal infections and refractory autoimmune cytopenias.
