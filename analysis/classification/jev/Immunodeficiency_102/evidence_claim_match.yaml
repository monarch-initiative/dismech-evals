  d101c471443a3b1b830d11eb8390418258975063eef4235dba12bcfb781b633c:
    claim:
      about:
        disease:
          name: Immunodeficiency 102
          disease_term:
            preferred_term: immunodeficiency 102
            term:
              id: MONDO:0024781
              label: immunodeficiency 102
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sash3_extra_immune_manifestations
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Are the skeletal and neurodevelopmental findings reported in one patient with a SASH3
          missense variant part of the disease, or coincidental?
        attaches_to:
        - genetic#SASH3
        rationale: 'One reported patient had osteogenesis imperfecta, metaphyseal dysplasia, intellectual
          disability, hearing loss, cleft lip and palate and renal agenesis alongside the immunological
          phenotype. Exome sequencing in that patient found no pathogenic variant in any gene linked to
          osteogenesis imperfecta or intellectual disability. The reporting authors explicitly declined
          to attribute the skeletal and neurological findings to SASH3, and no other patient has had them.
          This entry follows them: those features are not curated as phenotypes of immunodeficiency 102,
          and this discussion records why the decision could go the other way if a second such patient
          is reported.'
      selected_evidence:
        snippet: While immunological features in this case were characterized, further studies are needed
          to determine the association between the SASH3 variant and the skeletal or neurological manifestations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40947476
      reference_title: Osteogenesis imperfecta, intellectual disability and recurrent infections in a
