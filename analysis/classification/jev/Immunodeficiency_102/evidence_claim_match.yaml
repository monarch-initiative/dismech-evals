            label: T cell differentiation in thymus
          modifier: DECREASED
        - preferred_term: thymocyte apoptosis
          term:
            id: GO:0070242
            label: thymocyte apoptotic process
          modifier: INCREASED
        locations:
        - preferred_term: thymus
          term:
            id: UBERON:0002370
            label: thymus
      selected_evidence:
        snippet: In vitro T-cell differentiation of CD34+ cells and molecular signatures of rearrangements
          at the T-cell receptor α (TRA) locus were indicative of impaired thymocyte survival.
