        context:
        - path: /pathophysiology/2
          value:
            name: Thymocyte Survival Failure and Reduced Thymic Output
            biological_scale: CELLULAR
            description: 'Developing thymocytes require the SASH3 scaffold to survive the transition from
              the CD4-CD8- double-negative to the CD4+CD8+ double-positive stage. In patients this is
              inferred from in vitro differentiation of CD34+ progenitors and from the rearrangement signature
              at the T-cell receptor alpha locus, which reports how long thymocytes survive at the double-positive
              stage. In the mouse the block is direct and staged: thymic cellularity falls by about half
              and precursors are deleted by premature programmed cell death, with reduced proliferation
              in the DN3 subpopulation contributing.'
            cell_types:
            - preferred_term: thymocyte
              term:
                id: CL:0000893
                label: thymocyte
            - preferred_term: double negative thymocyte
              term:
                id: CL:0002489
                label: double negative thymocyte
            biological_processes:
            - preferred_term: T cell differentiation in thymus
              term:
                id: GO:0033077
                label: T cell differentiation in thymus
              modifier: DECREASED
            - preferred_term: thymocyte apoptosis
              term:
                id: GO:0070242
                label: thymocyte apoptotic process
              modifier: INCREASED
            locations:
            - preferred_term: thymus
              term:
                id: UBERON:0002370
                label: thymus
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Combined immunodeficiency
        causal_link_type: DIRECT
        description: The cellular arm of the combined defect. Reduced thymic output is what distinguishes
          this disease from a purely humoral immunodeficiency, notwithstanding that several patients were
          first labelled with one.
      selected_evidence:
        snippet: These findings define a new type of X-linked combined immunodeficiency in humans that
          recapitulates many of the abnormalities reported in mice with Sly1-/- and Sly1Δ/Δ mutations,
          highlighting an important role of SASH3 in human lymphocyte function and survival.
        supports: SUPPORT
