              label: immunodeficiency 102
        context:
        - path: /pathophysiology/0
          value:
            name: SASH3 Adaptor Loss in Lymphocytes
            biological_scale: MOLECULAR
            description: The initiating lesion. SASH3 is expressed only in lymphocytes and has no enzymatic
              activity; it is a scaffold whose SH3 and sterile alpha motif domains recruit and connect
              downstream effectors. Nonsense variants (p.Gln169*, p.Arg245*, p.Arg288*) abolish the protein,
              and the single reported missense variant, p.Arg347Cys, falls in a conserved motif adjacent
              to the Ser349 phosphorylation site. Because expression is lymphocyte restricted, the consequences
              of losing it are confined to the lymphoid compartment rather than being systemic.
            genetic_context:
              variant_origin: GERMLINE
              zygosity: HEMIZYGOUS
              functional_impact_category: LOSS_OF_FUNCTION
              description: Hemizygous germline loss-of-function variants in SASH3 on the X chromosome.
                Three of the four reported variant types are nonsense.
            molecular_functions:
            - preferred_term: SASH3 signalling adaptor activity
              term:
                id: GO:0035591
                label: signaling adaptor activity
              modifier: LOSS_OF_FUNCTION
            cell_types:
            - preferred_term: T cell
              term:
                id: CL:0000084
                label: T cell
            - preferred_term: B cell
              term:
                id: CL:0000236
                label: B cell
            - preferred_term: natural killer cell
              term:
                id: CL:0000623
                label: natural killer cell
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure of Antigen Receptor Signal Propagation
        causal_link_type: DIRECT
        description: Loss of the scaffold removes the protein-protein connections that couple an engaged
          antigen receptor to its downstream effectors. Restoring the protein by lentiviral transfer restores
          signalling, which is what makes this a direct rather than an inferred link.
      selected_evidence:
        snippet: Lentivirus-mediated transfer of the SASH3 complementary DNA-corrected protein expression,
          in vitro proliferation, and signaling in SASH3-deficient Jurkat and patient-derived T cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/0
      evidence_path: /pathophysiology/0/downstream/0/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /pathophysiology/0
    evidence_metadata:
      reference: PMID:33876203
      reference_title: SASH3 variants cause a novel form of X-linked combined immunodeficiency with immune
        dysregulation.
      evidence_source: IN_VITRO
      explanation: Gene restoration rescues signalling in both a cell line and patient T cells, tying
        the signalling failure to the absent protein rather than to a correlate.
