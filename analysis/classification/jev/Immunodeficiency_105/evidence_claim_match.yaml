      assertion_type: Genetic
      assertion:
        name: PTPRC C77G
        gene_term:
          preferred_term: PTPRC
          term:
            id: hgnc:9666
            label: PTPRC
        association: Susceptibility variant, not a cause of this disease
        relationship_type: SUSCEPTIBILITY
        notes: Recorded here specifically so it is not mistaken for a cause of this disease. C77G is a
          common isoform-altering polymorphism in PTPRC exon 4 that disrupts an exonic splicing silencer
          and causes aberrant retention of CD45RA on activated and memory T cells. It is enriched in autoimmune
          and infectious disease cohorts and alters CD45 isoform expression rather than abolishing the
          protein, so it belongs to a different mechanistic class from the biallelic null variants that
          cause immunodeficiency 105. A literature search on PTPRC returns the polymorphism far more often
          than the deficiency, which is why the distinction is worth making explicitly in the entry rather
          than leaving it to the reader.
      selected_evidence:
        snippet: Two polymorphisms (C77G and A138G), which alter CD45 isoform expression, are associated
          with autoimmune and infectious diseases.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/1
      evidence_path: /genetic/1/evidence/0
      context_paths:
