      assertion_type: Definition
      assertion:
        name: Newborn screening by T-cell receptor excision circle quantification
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: CD45 deficiency produces T lymphopenia from birth, so it falls within the population
          detectable by universal newborn severe combined immunodeficiency screening, which quantifies
          T-cell receptor excision circles in dried blood spots. Confirmation is by flow cytometry, where
          absent surface CD45 on all leukocytes is directly visible and effectively pathognomonic, followed
          by PTPRC sequencing.
        notes: This describes the screening pathway for severe combined immunodeficiency in general. No
          published case of immunodeficiency 105 has been reported as detected by newborn screening, so
          the applicability here is inferred from the T-lymphopenic immunophenotype rather than demonstrated.
      selected_evidence:
        snippet: Severe combined immunodeficiency (SCID) can be detected at birth through T-cell receptor
          excision circles (TREC) analysis in dried blood spots.
        supports: SUPPORT
