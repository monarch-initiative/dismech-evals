              label: immunodeficiency 105
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Arrest of Thymocyte Development
        biological_scale: CELLULAR
        description: 'Thymocyte maturation depends on T-cell receptor signals at two checkpoints, and
          both are impaired. In the Ptprc-null mouse the double-negative to double-positive transition
          is roughly halved and the subsequent maturation of double-positive cells into single-positive
          thymocytes falls a further four to fivefold, so the deficit compounds. Negative selection is
          affected too: null thymocytes fail to undergo apoptosis in response to T-cell receptor crosslinking
          while responding normally to non-receptor signals, which is what localises the lesion to receptor-proximal
          signalling rather than to the apoptotic machinery.'
        cell_types:
        - preferred_term: thymocyte
          term:
            id: CL:0000893
            label: thymocyte
        - preferred_term: double-positive thymocyte
          term:
            id: CL:0000809
            label: double-positive, alpha-beta thymocyte
        biological_processes:
        - preferred_term: T cell differentiation
          modifier: DECREASED
          term:
            id: GO:0030217
            label: T cell differentiation
        locations:
        - preferred_term: thymus
          term:
            id: UBERON:0002370
            label: thymus
      selected_evidence:
        snippet: T cell development is significantly inhibited in CD45-null animals at two distinct stages.
        supports: SUPPORT
    origin:
