      assertion_type: Pathophysiology
      assertion:
        name: Failure of Lck Activation
        biological_scale: MOLECULAR
        description: Lck activity is set by the opposing action of CD45, which removes the inhibitory
          C-terminal phosphotyrosine, and Csk, which installs it. With CD45 gone, that balance collapses
          towards the closed, autoinhibited conformation and Lck cannot phosphorylate the T-cell receptor
          ITAMs that begin proximal signalling.
        biological_processes:
        - preferred_term: protein dephosphorylation
          modifier: DECREASED
          term:
            id: GO:0006470
            label: protein dephosphorylation
      selected_evidence:
        snippet: The balance of phosphorylation at the inhibitory and activating Tyr residues is maintained
          by a balance between CD45 and Csk and is dependent upon intact intracellular trafficking machinery.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
