        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Biallelic loss-of-function variants in PTPRC on chromosome 1q31.3. Reported mechanisms
          are a large deletion in trans with an intervening-sequence 13 donor splice-site change, a homozygous
          in-frame six-base-pair deletion removing Glu339 and Tyr340, and uniparental isodisomy of chromosome
          1 making a single maternal allele homozygous. The last of these is worth remembering as a general
          lesson: the patient looked homozygous for a variant found in only one parent.'
      selected_evidence:
        snippet: This is the second description of a clinically relevant CD45 mutation, provides direct
          evidence for the importance of CD45 in immune function in humans, and suggests that abnormalities
          in CD45 expression are a possible cause of SCID in humans.
