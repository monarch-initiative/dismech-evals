        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of CD45 Surface Expression
        biological_scale: MOLECULAR
        description: 'Biallelic PTPRC loss-of-function variants abolish CD45 at the leukocyte surface.
          The reported mechanisms differ but converge: a large deletion paired with an intervening-sequence
          13 donor splice-site change; a homozygous in-frame six-base-pair deletion removing Glu339 and
          Tyr340 from the first fibronectin type III module, where modelling places Tyr340 as structurally
          load-bearing so the protein never reaches the membrane; and uniparental isodisomy of chromosome
          1 making a single maternal allele homozygous.'
        molecular_functions:
        - preferred_term: CD45 receptor tyrosine phosphatase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005001
            label: transmembrane receptor protein tyrosine phosphatase activity
        cell_types:
        - preferred_term: leukocyte
          term:
            id: CL:0000738
            label: leukocyte
      selected_evidence:
        snippet: we identified a male patient with a deficiency in CD45 due to a large deletion at one
          allele and a point mutation at the other. The point mutation resulted in the alteration of intervening
          sequence 13 donor splice site.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
