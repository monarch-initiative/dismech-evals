            preferred_term: immunodeficiency 105
            term:
              id: MONDO:0800104
              label: immunodeficiency 105
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: B Cell Signalling Failure Despite Normal B Cell Numbers
        biological_scale: CELLULAR
        description: 'B cells are generated in normal or increased numbers, so this is not a developmental
          block in the B lineage. What fails is B-cell receptor signalling: CD45 is required to transmit
          mitogenic signals through surface IgM and IgD, while CD40-mediated proliferation is preserved.
          Clinically this is why immunoglobulin concentrations fall progressively with age rather than
          being absent at presentation, and it is the feature that separates this disorder from the T-negative
          B-negative severe combined immunodeficiencies.'
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: B cell receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0050853
            label: B cell receptor signaling pathway
      selected_evidence:
        snippet: CD45 is absolutely required for the transmission of mitogenic signals via IgM and IgD.
          By contrast, CD45-null B cells proliferate as well as wild-type cells to CD40-mediated signals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
