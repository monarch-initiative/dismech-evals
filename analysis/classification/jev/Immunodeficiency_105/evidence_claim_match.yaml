    evidence_metadata:
      reference: PMID:18312479
      reference_title: PTPRC (CD45) variation and disease association studied using single nucleotide
        polymorphism tagging.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that these are isoform-altering susceptibility alleles, which is a different
