      - /disease_term
    evidence_metadata:
      reference: PMID:32794043
      reference_title: The role of competing mechanisms on Lck regulation.
      evidence_source: OTHER
      explanation: A review establishing that CD45 is one of the two opposing regulators setting Lck's
