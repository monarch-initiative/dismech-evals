      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation
        description: 'The only curative treatment for severe combined immunodeficiency, including CD45
          deficiency: donor haematopoiesis supplies leukocytes carrying CD45 and reconstitutes antigen-receptor
          signalling. Outcome depends heavily on whether the diagnosis was made before infection had accumulated.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: allogeneic haematopoietic stem cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: 'No CD45-deficiency-specific transplant series exists, so the survival figures above are
          for severe combined immunodeficiency as a whole. There is, however, one genotype-specific datum:
          the uniparental-disomy patient was successfully transplanted, which is recorded in the evidence
          above. So the recommendation rests on that single case plus the general reasoning that a haematopoietic
          defect is correctable by replacement, not on nothing.'
      selected_evidence:
        snippet: Nonlymphoid blood cells and other mesoderm- and ectoderm-derived tissues retained UPD
          of the entire maternal Chr1 in this patient, who had undergone successful bone marrow transplantation.
        supports: SUPPORT
