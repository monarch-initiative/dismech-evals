      assertion_type: Phenotype
      assertion:
        name: Decreased Circulating Immunoglobulin
        category: Immune
        description: 'Low immunoglobulins with normal total protein and albumin in the youngest 2026 patient,
          treated with intravenous immunoglobulin; hypogammaglobulinaemia in the Chinese patient, also
          on replacement; moderately low B cell counts and IgG in the Omani patient.

          This is the finding that sits least comfortably with the founding description of an otherwise
          intact immune system. Three of the four 2026 patients received immunoglobulin replacement.'
        frequency: FREQUENT
        phenotype_term:
          preferred_term: Hypogammaglobulinaemia requiring immunoglobulin replacement
          term:
            id: HP:0004313
            label: Decreased circulating immunoglobulin concentration
        notes: 3 of 4 patients in the 2026 series; not reported in the 2023 cohort, whose leukocyte subsets
          are described as normal without immunoglobulin data being quoted in the abstract. Whether this
          is a newly recognised part of the phenotype or a difference in what was measured and reported
          cannot be settled from the published record, and the entry does not try to.
      selected_evidence:
        snippet: Immunological analyses revealed that P1 had low immunoglobulin (IG) levels, despite having
          normal total serum protein and albumin levels. Intravenous IG (IVIG) treatment was therefore
          initiated.
        supports: SUPPORT
        directness: DIRECT
