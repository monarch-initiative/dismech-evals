              label: immunodeficiency 118
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ribosomal Stalling at the JAK2 Start-Stop Upstream Open Reading Frames
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'This node is the specificity of the disease. The JAK2 5-prime untranslated region
          carries three upstream open reading frames, two of them ultra-short start-stop frames. Without
          MCTS1 to recycle them, 40S subunits stall at those stop codons and cannot reinitiate at the
          JAK2 main open reading frame.

          It is why a general translation defect produces a single-pathway disease. Of seventeen genes
          of IFN-gamma immunity tested in MCTS1-knockout cells, only JAK2 showed a substantial translational
          decrease, rescued by wild-type MCTS1 and not by patient variants. A gene''s vulnerability here
          is a property of its 5-prime untranslated region, not of its function.'
        biological_processes:
        - preferred_term: translational initiation
          term:
            id: GO:0006413
            label: translational initiation
          modifier: DECREASED
      selected_evidence:
        snippet: MCTS1 promotes JAK2 translation by reinitiating translation in the JAK2 5′UTR.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41623352
      reference_title: Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial
