  9dfc8d96df7517ee65449308274b34785db5ed8f7d0d0237e89b8615941d81a0:
    claim:
      about:
        disease:
          name: Immunodeficiency 118
          disease_term:
            preferred_term: immunodeficiency 118
            term:
              id: MONDO:0958030
              label: immunodeficiency 118
        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant Interferon Gamma-1b
        therapeutic_modality: PROTEIN_REPLACEMENT
        description: 'The mechanistically indicated therapy, and the one this entry''s pathograph predicts.
          The lesion is upstream of the IFN-gamma receptor and patient cells respond normally to exogenous
          IFN-gamma, so supplying it bypasses the block rather than working around it.

          Three of the four 2026 patients received it. In the Omani patient subcutaneous IFN-gamma-1b
          improved activity, mobility and nutritional status before he was lost to follow-up and it was
          stopped after six weeks; in the American patient, increasing doses over a year and a half, reaching
          400 micrograms three times weekly, produced substantial improvement after about a year.

          Those are two uncontrolled observations, one of them in a patient who then died after the drug
          was stopped. They are recorded as such.'
        treatment_term:
          preferred_term: interferon gamma therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: interferon gamma-1b
            term:
              id: NCIT:C100089
              label: Interferon Gamma-1b
        notes: 'therapeutic_modality is PROTEIN_REPLACEMENT rather than the immunomodulation reading the
          drug''s usual context invites. The lesion here is an inability to produce IFN-gamma: IL-23 signalling
          fails, so MAIT and gamma-delta cells do not make the cytokine. Giving it replaces a protein
          the patient cannot make, in a patient whose response to it is intact. That is replacement in
          the same sense immunoglobulin replacement is, and it is why the entry''s pathograph predicts
          the therapy rather than merely accommodating it.'
      selected_evidence:
        snippet: Subcutaneous IFN-γ1b treatment was initiated, leading to improvements in the patient’s
          activity, mobility, and nutritional status.
        supports: SUPPORT
        directness: DIRECT
