      assertion_type: Pathophysiology
      assertion:
        name: Hemizygous MCTS1 Loss-of-Function Variants
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Eight variants are published across nine families. The 2023 five are all loss-of-expression
          or complete loss-of-function: two frameshift, one splice-site, and two in-frame 3-prime deletions
          both removing residues Ala133 to Lys181. The 2026 report adds p.Leu170* and p.Glu60Lysfs*5,
          both loss-of-function, and p.Trp175*, which is hypomorphic when overexpressed rather than null.

          That last allele is the reason this entity now has a partial form. A nonsense variant at codon
          175 of a 181-residue protein removes very little, and the patient who carries it was not BCG-vaccinated,
          stayed healthy through childhood, and presented at sixteen with weight loss and diarrhoea and
          at twenty-two with disseminated Mycobacterium abscessus. Allele severity and age at presentation
          move together.'
        genes:
        - preferred_term: MCTS1
          term:
            id: hgnc:23357
            label: MCTS1
        genetic_context:
          genes:
          - preferred_term: MCTS1
            term:
              id: hgnc:23357
              label: MCTS1
          allele_type: frameshift, nonsense, splice-site and in-frame 3-prime deletion alleles, with one
            hypomorphic nonsense allele near the C-terminus
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          notes: LOSS_OF_FUNCTION describes eight of the nine genotypes; p.Trp175* is hypomorphic on overexpression
            and is the exception, recorded in this node's description rather than by splitting the slot.
            The slot is single-valued and the majority genotype is a true null.
      selected_evidence:
        snippet: The p.L170* and E60Kfs5* variants are LOF, whereas p.W175* is hypomorphic when overexpressed.
        supports: SUPPORT
        directness: DIRECT
