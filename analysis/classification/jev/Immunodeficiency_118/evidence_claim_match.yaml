  a6bdfeeac63a692bd19088b37a9ee6a06f06f2d85862f3d69127590718537eaf:
    claim:
      about:
        disease:
          name: Immunodeficiency 118
          disease_term:
            preferred_term: immunodeficiency 118
            term:
              id: MONDO:0958030
              label: immunodeficiency 118
        context: []
      assertion_type: Phenotype
      assertion:
        name: Normal Circulating Leukocyte Subsets
        category: Immune
        description: 'Routine immunophenotyping is normal. That is the diagnostic problem this disease
          poses: the test a clinician runs to confirm an immunodeficiency comes back reassuring, and only
          molecular diagnosis finds it.

          Recorded as a phenotype in its own right because its absence is what a curator or clinician
          would otherwise infer from the disease''s name.'
        frequency: VERY_FREQUENT
        phenotype_term:
          preferred_term: Normal development of circulating leukocyte subsets
        notes: 'Reported for all five 2023 patients and for the American patient in 2026.

          Deliberately unbound. HPO has no term for a normal immunophenotype in a patient who has an immunodeficiency,
          and every candidate inverts the claim: HP:0002721 Immunodeficiency asserts the abnormality this
          node exists to deny, and the lymphocyte-count terms assert a direction. A term plus a disclaimer
          is still a wrong term — the disclaimer is prose and the term is machine-readable — so `term:`
          is omitted and `preferred_term` carries the finding. Needs a term request: the concept is "routine
          immunophenotyping normal", which is diagnostically load-bearing across the whole of MSMD and
          not only here.

          Searched before omitting, and re-run against `ols:hp` before committing this note. `l~leukocyte`
          returns abnormality terms only (HP:0001881 Abnormal leukocyte morphology, HP:0001974 Increased
          total leukocyte count, HP:0033797 Leukocyte migration defect and siblings). `l~lymphocyte count`
          returns HP:0040088 Abnormal lymphocyte count and its increased/decreased children, including
          HP:0005403 Decreased total T cell count. `l~immunophenotyp` returns nothing at all. `l~normal`
          returns terms in which "normal" is part of some other concept — HP:0002343 Normal pressure hydrocephalus,
          HP:0002372 Normal interictal EEG, HP:0002632 Low-to-normal blood pressure — and nothing about
          a normal immunological result. HPO has terms for the presence of an abnormality and none for
          a documented normal finding in this domain, which is what makes this an NTR rather than a search
          failure. Note HP:0002372 shows the shape a suitable term would take.'
      selected_evidence:
        snippet: All the detected leukocyte subsets developed normally in the patients.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /phenotypes/3
      evidence_path: /phenotypes/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41623352
      reference_title: Complete and partial forms of X-linked MCTS1 deficiency in patients with mycobacterial
        disease.
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: The normal immunophenotype across the 2023 cohort, restated in the 2026 introduction
        — which is why it is graded BACKGROUND rather than PRIMARY_RESULT.
