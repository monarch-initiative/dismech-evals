        name: Impaired IL-23 Receptor Signalling
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'IL-23 signalling is JAK2-dependent and is the response that fails here; IL-12 signalling
          is partially affected. The placement of this disease on the IL-23 limb rather than the IL-12
          limb of the MSMD circuit is not an inference from the biochemistry — it was measured in patient
          cells, which showed impaired IL-23 responses with normal IL-12 responses.

          That places IMD118 beside IL23R deficiency and IL-23 deficiency in the same functional pathway,
          and it is the reason the phenotype is mycobacterial rather than the broader susceptibility that
          IL-12 axis defects produce.'
        biological_processes:
