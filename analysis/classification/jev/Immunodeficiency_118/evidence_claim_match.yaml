      assertion_type: Genetic
      assertion:
        name: MCTS1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: MCTS1
          term:
            id: hgnc:23357
            label: MCTS1
        notes: 'The single causal gene. MCTS1 is also a well-established oncogene, overexpressed in several
          tumour types, which makes the narrowness of the germline loss-of-function phenotype the surprising
          part of this disease: nine hemizygous null or near-null males with mycobacterial disease and
          no reported malignancy.

          A note on the identifier. The deep-research report committed alongside this entry gives MCTS1
          as HGNC:7838, which is NKX3-1, an unrelated homeobox gene. The correct identifier is hgnc:23357.
          The same run''s HLASA report made the same class of error for LARS2. Gene CURIEs are unchecked
          in the research lane (the recipe passes --term-skip-prefix HGNC) and only self-consistency-checked
          on the KB side, which is dismech issue #10948; the report''s JAK2 identifier, by contrast, was
          correct.'
      selected_evidence:
        snippet: These findings suggest that X-linked recessive human MCTS1 deficiency underlies isolated
          mycobacterial disease by impairing JAK2 translation in innate-like adaptive T lymphocytes, thereby
          impairing the IL-23-dependent induction of IFN-γ.
        supports: SUPPORT
        directness: DIRECT
