        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of 40S Ribosome Recycling and Translation Reinitiation
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'MCTS1 heterodimerises with DENR to recycle 40S ribosomal subunits after termination
          and to permit reinitiation on messages carrying short upstream open reading frames. Without
          it, subunits are not released at stop codons and reinitiation downstream is impaired.

          The striking part is how little this costs. The founding authors call MCTS1-dependent recycling
          "otherwise physiologically redundant" in these patients — meaning that outside the one pathway
          below, no phenotype attributable to a general translation defect was found. That is a strong
          claim and it is theirs, not this entry''s; the 2026 series'' growth failure, hypogammaglobulinaemia
          and gastrointestinal disease sit awkwardly against it, and this entry records both.'
        molecular_functions:
        - preferred_term: translation reinitiation factor activity
          term:
            id: GO:0003743
            label: translation initiation factor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: regulation of translational initiation
          term:
            id: GO:0006446
            label: regulation of translational initiation
          modifier: DECREASED
      selected_evidence:
        snippet: Complete deficiency of this translation re-initiation factor impairs the translation
          of a subset of proteins, including the kinase JAK2 in all cell types tested, including T lymphocytes
          and phagocytes.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
