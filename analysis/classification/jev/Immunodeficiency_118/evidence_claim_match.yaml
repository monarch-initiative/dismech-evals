          The 2026 series shows the range: axillary adenitis with bone-marrow involvement at four months,
          abscessed BCG adenitis at seven months, local armpit disease at one month, and in one patient
          a BCG-osis involving brain, mastoid sinuses, lung, liver and gastrointestinal tract that was
          fatal.'
        frequency: VERY_FREQUENT
        phenotype_term:
          preferred_term: Disseminated BCG disease
          term:
            id: HP:0020087
            label: BCGosis
