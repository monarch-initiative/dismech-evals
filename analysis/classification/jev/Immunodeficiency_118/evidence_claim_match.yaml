      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: BELOW_1_IN_1000000
        notes: 'Nine patients in nine unrelated families: five in 2023 from China, Finland, Iran (two
          families) and Saudi Arabia, and four in 2026 from Iran, Oman, China and the United States. All
          male, all hemizygous, eight distinct variants.

          No population estimate exists. Ascertainment is through MSMD cohorts, so the denominator is
          the set of patients whose mycobacterial disease prompted genetic investigation, not the population.
          rate_per_100000 is left unset.

          One quantity worth recording: MCTS1 is one of twenty-two genes underlying forty-seven genetic
          aetiologies of MSMD as of the 2026 report. That is the population this entity is a slice of,
          and it is the reason a targeted MSMD panel rather than a single-gene test is the diagnostic
          route.'
      selected_evidence:
        snippet: Variants of 22 genes underlie 47 different genetic etiologies of MSMD (4).
