        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Replication factor C is the clamp loader that places PCNA on DNA so that polymerase
          delta can begin synthesis. Less assembled polymerase delta means less effective RFC recruitment,
          so fewer replication events start. The deficit is at initiation rather than at elongation, which
          is why the cellular phenotype is a reduced fraction of cells in S phase rather than slow replication
          in all of them.
        biological_processes:
        - preferred_term: DNA replication initiation
          term:
            id: GO:0006270
            label: DNA replication initiation
          modifier: DECREASED
      selected_evidence:
        snippet: Additionally, the Polδ complex coordinately interacts with a number of proteins that
          enable its function, including DNA replication factor C (RFC) and Proliferating Cell Nuclear
          Antigen (PCNA)
        supports: SUPPORT
        directness: INDIRECT
