            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Both parents were heterozygous for the mutation. Her sister P2, who also suffered from
          recurrent infections, was found homozygous for the same mutation by Sanger sequencing, as was
          a paternal aunt P3
