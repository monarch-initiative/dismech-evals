      assertion:
        name: Destabilisation of the Polymerase Delta Holoenzyme
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Polymerase delta is a heterotetramer: POLD1 carries the polymerase and exonuclease
          activities, POLD2 is the scaffold that holds POLD1 to the rest, and POLD3 and POLD4 regulate
          activity and stability. A substitution at the POLD1-POLD2 interface therefore does not inactivate
          one subunit, it lowers the amount of assembled enzyme — POLD1, POLD2 and POLD3 fall together.'
        genes:
        - preferred_term: POLD1
          term:
            id: hgnc:9175
            label: POLD1
        cellular_components:
        - preferred_term: DNA polymerase delta complex
          term:
            id: GO:0043625
            label: delta DNA polymerase complex
          modifier: DECREASED
      selected_evidence:
        snippet: The mutation destabilizes the Polδ complex, leading to ineffective recruitment of replication
          factor C to initiate DNA replication.
        supports: SUPPORT
        directness: DIRECT
