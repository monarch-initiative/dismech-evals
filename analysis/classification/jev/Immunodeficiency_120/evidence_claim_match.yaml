        kind: OPEN_QUESTION
        status: OPEN
        prompt: Does a defect in the replicative polymerase increase the risk of conditioning-regimen
          toxicity, when DNA repair after genotoxic stress is normal in these patients?
        rationale: 'This is a case where the clinical worry and the laboratory finding point in different
          directions, and a real decision had to be made without resolving it.

          The transplant team''s stated concern was regimen-related toxicity from impaired DNA repair.
          The mechanistic work points the opposite way: repair after genotoxic stress was normal, and
          the lesion is in S-phase progression. If that is right, POLD1 deficiency is unlike the DNA-repair
          immunodeficiencies where conditioning toxicity is a documented problem, and the caution may
          be borrowed rather than earned.

          There is a gap in that reassurance, and it is exactly where it should not be. The genotoxic-sensitivity
          experiment was run in the POLD2 patient''s fibroblasts. No POLD1 patient''s cells have been
          exposed to a genotoxic compound in any published experiment. So the argument that a POLD1-deficient
          patient tolerates alkylator-based conditioning runs through a different gene''s patient — a
          defensible inference from the shared holoenzyme, and not a measurement.

          One reduced-intensity transplant went well. That is consistent with the caution being unnecessary
          and equally consistent with reduced-intensity conditioning having been the reason it went well.
          Distinguishing them needs more patients, or the obvious missing experiment: alkylator and fludarabine
          sensitivity in POLD1 patient cells, which would cost little and has not been published.'
        attaches_to:
        - treatments#Haematopoietic Stem Cell Transplantation
        - pathophysiology#Impaired S-Phase Progression and Replicative Stress
        - diagnosis#DNA repair assay after genotoxic stress
