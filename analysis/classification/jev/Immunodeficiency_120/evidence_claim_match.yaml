          value:
            name: Biallelic Hypomorphic POLD1 Variants
            biological_scale: MOLECULAR
            mechanism_confidence: ESTABLISHED
            description: 'Two genotypes are published. The Turkish kindred is homozygous for c.3178C>T,
              p.Arg1060Cys, absent from gnomAD, ExAC, dbSNP and 1000 Genomes, found by homozygosity mapping
              in the largest of five runs of homozygosity and confirmed by Sanger sequencing in all three
              affected relatives.

              The second family''s patient carries three heterozygous POLD1 variants making up two alleles:
              p.Gln684His and p.Ser939Trp inherited together in cis on the maternal allele, and p.Arg1074Trp
              on the paternal allele. Getting that configuration right matters, because two of the three
              substitutions are on one chromosome — a reader counting substitutions rather than alleles
              would conclude the patient has three hits when they have two.

              No null allele appears in either family, and none is expected to: complete POLD1 deficiency
              is embryonic lethal in mice, and POLD1''s high pRec score predicts intolerance of complete
              loss of function in humans. Every disease allele here is hypomorphic by necessity.'
            genes:
            - preferred_term: POLD1
              term:
                id: hgnc:9175
                label: POLD1
            genetic_context:
              genes:
              - preferred_term: POLD1
                term:
