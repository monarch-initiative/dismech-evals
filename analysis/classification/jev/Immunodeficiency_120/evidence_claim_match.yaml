      assertion_type: Phenotype
      assertion:
        name: Bronchiectasis
        category: Respiratory
        description: Chronic bronchitis progressing to bronchiectasis in the second family's POLD1 patient,
          a 24-year-old man. It is the irreversible consequence of years of untreated infection, and the
          reason early recognition rather than any drug is the intervention that changes outcome here.
        frequency: OCCASIONAL
        phenotype_term:
          preferred_term: Bronchiectasis following chronic bronchitis
          term:
            id: HP:0002110
            label: Bronchiectasis
        notes: '1 of 4 published POLD1 patients. Not reported in the Turkish kindred, where immunoglobulin
          replacement resolved the lower respiratory infections — consistent with bronchiectasis being
          a function of untreated years rather than of genotype, though two families cannot separate that
          from chance.

          A caution about the source. The paper that reports this patient also reports a second patient
          with a POLD2 defect, whose bronchiectasis dates from six months of age and who also has chronic
          facial molluscum contagiosum and recurrent skin abscesses. That patient is not IMD120 — different
          gene, different disease. The deep-research report committed with this entry attributes all three
          of those features to POLD1, and they are not curated here. Within a single paper describing
          a shared syndrome across two genes, the patient-to-gene assignment is the thing to check.'
      selected_evidence:
        snippet: Patient 2 (P2) is a 24-year-old male born to nonconsanguineous parents. He presented
          with chronic bronchitis resulting in bronchiectasis and skin warts that were negative for common
          papilloma virus strains
        supports: SUPPORT
        directness: DIRECT
