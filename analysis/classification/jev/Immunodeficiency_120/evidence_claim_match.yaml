              allele_type: a homozygous CysB-motif missense variant in one family, and two missense variants
                in cis opposite a third missense variant in the other
              variant_origin: GERMLINE
              functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
              description: Zygosity differs between the two families — homozygous in the Turkish kindred,
                compound heterozygous in the second — so the slot is left unset rather than asserting
                one family's configuration for both.
              notes: 'PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION, and the reasoning is not
                a hedge: complete polymerase delta loss is embryonic lethal in mice and predicted intolerable
                in humans, so a viable patient''s alleles are hypomorphic by construction. Both genotypes
