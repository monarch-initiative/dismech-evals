      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: BELOW_1_IN_1000000
        notes: 'Four published POLD1 patients in two unrelated families: three relatives across two generations
          of a consanguineous Turkish kindred, and one man from a non-consanguineous family. A fifth patient
          is described in the 2026 transplant report — an 18-year-old woman with POLD1 deficiency — whose
          relationship to the two published families is not stated there, so she is not counted here and
          the count above may be an undercount by one.

          No population estimate exists. Consanguinity is the route to the homozygous genotype in one
          family and p.Arg1060Cys is absent from every population database checked, so no founder effect
          or carrier frequency can be inferred. rate_per_100000 is left unset rather than computed from
          four cases.'
