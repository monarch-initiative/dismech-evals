              id: MONDO:0970994
              label: immunodeficiency 120
        context: []
      assertion_type: Diagnosis
      assertion:
        name: DNA repair assay after genotoxic stress
        presence: ABSENT
        description: 'Recorded as a negative. A clinician faced with a combined immunodeficiency and syndromic
          features will reasonably think of the DNA-repair immunodeficiencies and send a repair assay.
          In polymerase delta deficiency it is normal, and that normal result is informative rather than
          uninformative: it places the lesion at replication rather than at repair.

          The qualifier matters and this entry originally lacked it. The experiment was done in the POLD2
          patient''s fibroblasts. The POLD1 patient — the one this entry curates — was never tested with
          genotoxic compounds. Everything below rests on the two patients sharing a holoenzyme, which
          is the same argument the whole paper is built on, and is still an extrapolation.'
        notes: Do not read this as a measured property of POLD1 deficiency. It is a measured property
          of POLD2 deficiency carried across. If the two differ anywhere, conditioning-regimen tolerance
          is exactly where it would matter, and that is the subject of one of this entry's discussions.
      selected_evidence:
        snippet: P1 fibroblasts showed no overt sensitivity to an array of genotoxic reagents, which suggests
          that, despite an unstable POLD complex, its activity was sufficient to ensure proficiency in
          specific DNA repair pathways
        supports: SUPPORT
        directness: INDIRECT
    origin:
