      assertion_type: Genetic
      assertion:
        name: POLD1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: POLD1
          term:
            id: hgnc:9175
            label: POLD1
        notes: 'The causal gene, and one where the allele class decides the disease. Biallelic hypomorphic
          missense causes this entity. Heterozygous variants in the exonuclease (proofreading) domain
          cause colorectal cancer predisposition, by a mechanism that is functionally the opposite — the
          authors of the second paper describe it as a loss of function that produces a functional gain
          of function through an increased mutation rate. The recurrent heterozygous p.Ser605del causes
          MDPL syndrome.

          The founding kindred contains the cleanest possible statement of that separation: several extended
          family members had colon and rectal cancers and none of them carried the mutant allele. A family
          history of colorectal cancer in a POLD1 kindred is not evidence that the immunodeficiency allele
          predisposes to it.'
      selected_evidence:
        snippet: These results identify gene defects in POLD1 as a novel cause of T-cell immunodeficiency.
        supports: SUPPORT
        directness: DIRECT
