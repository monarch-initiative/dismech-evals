  fd92778c3c3d33276d78d6a923c2fa79a4a045baf190b8d23d94dfe8fd615376:
    claim:
      about:
        disease:
          name: Immunodeficiency 120
          disease_term:
            preferred_term: immunodeficiency 120
            term:
              id: MONDO:0970994
              label: immunodeficiency 120
        context: []
      assertion_type: Treatment
      assertion:
        name: Haematopoietic Stem Cell Transplantation
        therapeutic_modality: CELL_THERAPY
        description: 'The only reported route to correcting the immune defect rather than substituting
          for it. A 2026 report describes the first successful transplant in POLD1 deficiency: an 18-year-old
          woman with recurrent pulmonary infections and shingles, dependent on immunoglobulin replacement,
          transplanted from a matched related donor using reduced-intensity conditioning with cyclophosphamide,
          fludarabine and anti-thymocyte globulin, with bone marrow and peripheral blood as stem-cell
          sources and tacrolimus plus low-dose methotrexate for graft-versus-host disease prophylaxis.
          Engraftment was prompt and without major complications; at two years her T-cell counts and function
          were improved and she no longer needed replacement.

          The reason it is a report rather than a routine option is a specific and well-founded fear:
          conditioning regimens work by damaging DNA, and a disease of the replicative polymerase raises
          the question of regimen-related toxicity. The family were told about that concern before the
          decision. Reduced-intensity conditioning was chosen against it, and the result argues the fear
          may be manageable — in one patient.'
        treatment_term:
          preferred_term: hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: One patient, two years, one report. It is not a series and this entry does not present
          it as one. What it establishes is feasibility against a specific fear, not a standard of care.
      selected_evidence:
        snippet: She underwent HSCT from a matched related donor using a reduced-intensity regimen (cyclophosphamide,
          fludarabine, ATG) with bone marrow and peripheral blood as stem cell sources.
        supports: SUPPORT
        directness: DIRECT
