      assertion_type: Pathophysiology
      assertion:
        name: Impaired S-Phase Progression and Replicative Stress
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'A smaller fraction of cells enters and completes S phase, and replication-associated
          DNA lesions accumulate. Both findings are reported for the patients'' cells in the plural and
          are attributable to the POLD1 patient as well as the POLD2 one.

          The control that would place this disease among the proliferation defects rather than among
          the DNA-repair immunodeficiencies — ataxia-telangiectasia, Nijmegen breakage, LIG4 deficiency
          — is the genotoxic-sensitivity experiment, and that one is not plural. It was done in the POLD2
          patient''s fibroblasts, which showed no overt sensitivity to an array of genotoxic reagents.
          The POLD1 patient was never tested. The inference to POLD1 runs through the shared holoenzyme
          and is reasonable; it is not a measurement in this disease, and this entry marks it as extrapolated
          wherever it is used.

          It has a practical consequence recorded under treatments: a repair-competent cell is a different
          transplant-conditioning risk from a repair-deficient one, and the first HSCT in this disease
          was performed against exactly that uncertainty — with the team''s stated concern pointing the
          opposite way from this extrapolation.'
        biological_processes:
