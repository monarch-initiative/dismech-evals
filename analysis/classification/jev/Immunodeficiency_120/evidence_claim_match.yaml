          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Destabilisation of the Polymerase Delta Holoenzyme
        causal_link_type: DIRECT
        description: The p.Arg1060Cys route. The substitution disrupts the intramolecular contact between
          the POLD1 CysB motif and the catalytic domain, and the contact between POLD1 and POLD2, so the
          complex falls apart and all three measured subunits drop together.
      selected_evidence:
        snippet: Molecular dynamics simulation revealed that the R1060C mutation disrupts the intramolecular
