        biological_scale: ORGANISM
        mechanism_confidence: HYPOTHETICAL
        description: 'Short stature, developmental impairment and sensorineural hearing loss occur in
          part of the series, and are prominent in the second family. The mechanism is assumed rather
          than shown: polymerase delta is needed wherever cells divide, so a general replication restriction
          should affect development.

          Two things argue for caution. Nothing has been measured in any affected non-haematopoietic tissue
          in either family. And in the Turkish kindred the affected aunt''s intellectual impairment, hearing
          deficit and speech delay are explicitly attributed by the authors to a varicella encephalitis
          at age three — an infection the immunodeficiency plausibly permitted, which makes her deficits
          a consequence of the immune phenotype rather than a parallel developmental one.'
      selected_evidence:
        snippet: a previously unknown autosomal-recessive syndrome that combines replicative stress, neurodevelopmental
          abnormalities, and immunodeficiency
        supports: SUPPORT
        directness: INDIRECT
