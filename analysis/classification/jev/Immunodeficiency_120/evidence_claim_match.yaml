        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd120_cd8_asymmetry
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Why does a general restriction on cell-cycle entry produce oligoclonality and restricted
          receptor V-J pairing in CD8 but not CD4 T cells?
        rationale: 'Polymerase delta is required by every dividing cell, so the naive expectation is a
          uniform proliferation ceiling. What is observed is asymmetric: naive CD8 cells are lost more
          than naive CD4 cells, and the repertoire contraction is confined to CD8.

          The founding authors offer two candidate explanations in one sentence — a difference in peripheral
          CD8 expansion, or a difference in thymic selection — and commit to neither. The distinction
          is testable and consequential. If it is peripheral, the repertoire should contract progressively
          with age and antigen exposure, and a transplant should restore it. If it is thymic, the defect
          is set early and a transplant in an adult with an involuted thymus may restore counts without
          restoring breadth.

          The 2026 transplant report gives improved T-cell counts and function at two years but does not
          report repertoire sequencing, which is exactly the measurement that would separate them.'
        attaches_to:
        - pathophysiology#Contracted Oligoclonal T Cell Repertoire
        - treatments#Haematopoietic Stem Cell Transplantation
      selected_evidence:
        snippet: suggesting that POLD1R1060C differentially affects peripheral CD8+ T-cell expansion and
          possibly thymic selection
        supports: SUPPORT
        directness: DIRECT
