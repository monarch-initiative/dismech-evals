        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic POLD3 Variants
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Two homozygous missense genotypes are published, one per family. The Lebanese patient
          is homozygous for c.29T>C, p.Ile10Thr, in the POLD2-binding region of POLD3; the Omenn patient
          is homozygous for c.1118A>C, p.Lys373Thr, in a positively charged interdomain region thought
          to aid polymerase activity and DNA binding.

          No null allele appears, and none is expected to: in mice POLD3 is essential for development
          and for viability in adult animals, and even heterozygous loss is haploinsufficient for stabilising
          the complex. A viable patient''s alleles are hypomorphic by construction.'
        genes:
        - preferred_term: POLD3
          term:
            id: hgnc:20932
            label: POLD3
        genetic_context:
          genes:
          - preferred_term: POLD3
            term:
              id: hgnc:20932
              label: POLD3
          allele_type: homozygous missense in each family — p.Ile10Thr in one, p.Lys373Thr in the other
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          notes: 'PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION, and the reasoning is not a hedge:
            complete POLD3 loss is embryonic lethal in mice and POLD3 is haploinsufficient even in the
            heterozygous state, so a viable patient''s alleles must retain some function. One allele nonetheless
            abolishes detectable protein — the hypomorphism is at the level of the holoenzyme''s residual
            output, not necessarily of each subunit''s expression.'
      selected_evidence:
        snippet: We identified, by whole exome sequencing, a homozygous missense mutation (c.1118A > C;
          p.K373T) in POLD3 in a patient with Omenn syndrome.
        supports: SUPPORT
        directness: DIRECT
