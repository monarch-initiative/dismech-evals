      assertion:
        name: Impaired DNA Replication and S-Phase Entry
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: POLD3 mediates the complex's interaction with PCNA, which the holoenzyme needs for
          activity and processivity, so less functional polymerase delta means fewer cells begin and complete
          DNA synthesis. The Omenn patient's fibroblasts showed a marked defect in S-phase entry and reduced
          proliferation over a week in culture, and the defect was at the entry to S phase rather than
          in elongation.
        biological_processes:
        - preferred_term: DNA replication initiation
          term:
            id: GO:0006270
            label: DNA replication initiation
          modifier: DECREASED
        - preferred_term: cell cycle
          term:
            id: GO:0007049
            label: cell cycle
          modifier: DECREASED
      selected_evidence:
        snippet: POLD3 mediates interaction with proliferating cell nuclear antigen (PCNA), which is essential
          for PolD activity and processivity
        supports: SUPPORT
        directness: INDIRECT
