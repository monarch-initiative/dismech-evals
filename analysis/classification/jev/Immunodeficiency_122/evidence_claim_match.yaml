          fibroblasts carried an increased number of double-strand-break-associated foci despite normal
          subunit expression, which is the direct evidence of DNA damage that the POLD1 patients lacked.
          This is the branch that pushes the phenotype towards the DNA-damage end of the polymerase-delta
          spectrum, consistent with the Omenn rather than the milder CID presentation.
