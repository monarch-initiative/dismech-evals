          modifier: DECREASED
        - preferred_term: T cell proliferation
          term:
            id: GO:0042098
            label: T cell proliferation
          modifier: DECREASED
      selected_evidence:
        snippet: The patient exhibited severely decreased numbers of naïve T cells associated with a restricted
          T-cell receptor repertoire and a defect in the early stages of TCR recombination.
        supports: SUPPORT
        directness: DIRECT
