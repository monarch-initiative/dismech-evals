      assertion_type: Pathophysiology
      assertion:
        name: Impaired T Cell Development and Proliferation
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: Antigen-receptor recombination and clonal expansion both require heightened, accurate
          DNA replication, so a replication-limited progenitor pool fails at T-cell development first.
          The Omenn patient had a defect in the early stages of TCR recombination, severely reduced naive
          T cells and a restricted repertoire; the Lebanese patient had low naive T cells with preserved
          B-cell numbers. The B-cell compartment is comparatively spared, which is why the defect presents
          as T-cell rather than purely combined at the cellular level.
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
