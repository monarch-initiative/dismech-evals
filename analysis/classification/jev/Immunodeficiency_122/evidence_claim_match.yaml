  7679d54da6eeaae829d376a1101856d371dd78430a01c52a29745f74d08153b8:
    claim:
      about:
        disease:
          name: Immunodeficiency 122
          disease_term:
            preferred_term: immunodeficiency 122
            term:
              id: MONDO:0971151
              label: immunodeficiency 122
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd122_omenn_vs_cid_spectrum
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Why does one POLD3 genotype present as florid Omenn syndrome with documented DNA damage
          while the other presents as a milder syndromic CID — is it the allele, the degree of residual
          function, or something else?
        rationale: 'The two patients differ along two axes at once, which is exactly what makes the question
          hard. The Omenn patient (p.Lys373Thr) has normal subunit expression but impaired function, a
          marked S-phase-entry defect and increased double-strand-break foci, and the full dysregulation
          picture. The Lebanese patient (p.Ile10Thr) has abolished subunit expression — a seemingly more
          severe molecular lesion — but a milder clinical picture of syndromic CID with preserved B-cell
          numbers and no reported Omenn features.

          So the more complete loss of protein does not map to the more severe clinical picture, which
          argues the phenotype is set by residual holoenzyme output and by which downstream processes
          it limits rather than by subunit abundance. Distinguishing the possibilities needs the missing
          measurements: cell-cycle and DNA-damage assays were done only in the Omenn patient, so there
          is no functional comparison of the two alleles in the same assay.'
        attaches_to:
        - pathophysiology#Destabilisation of the Polymerase Delta Complex
        - pathophysiology#Impaired Polymerase Delta Function with Intact Complex
        - pathophysiology#Replication-Associated DNA Damage
      selected_evidence:
        snippet: Patient fibroblasts showed a marked defect in S-phase entry and an enhanced number of
          double-stranded DNA break-associated foci despite normal expression levels of PolD components.
        supports: SUPPORT
        directness: DIRECT
