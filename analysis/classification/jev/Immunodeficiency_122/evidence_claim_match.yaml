          does not inactivate one subunit, it lowers the amount of assembled enzyme. In the mouse, deleting
          Pold3 destabilises every member of the complex, which is the model for why one subunit's loss
          drags the others down.
        genes:
        - preferred_term: POLD3
          term:
            id: hgnc:20932
            label: POLD3
        cellular_components:
        - preferred_term: DNA polymerase delta complex
          term:
            id: GO:0043625
            label: delta DNA polymerase complex
          modifier: DECREASED
      selected_evidence:
        snippet: we show that Pold3 deletion destabilizes all members of the Polδ complex, explaining
          its major role in DNA replication and the severe impact of its deficiency
        supports: SUPPORT
        directness: INDIRECT
