      assertion_type: Genetic
      assertion:
        name: POLD3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: POLD3
          term:
            id: hgnc:20932
            label: POLD3
        notes: 'The causal gene. POLD3 is an accessory subunit of DNA polymerase delta: it stabilises
          the POLD1-POLD2 interaction and, through a C-terminal PIP box, mediates the complex''s interaction
          with PCNA. Both published alleles are homozygous missense. p.Ile10Thr abolishes expression of
          all three subunits (the destabilising route); p.Lys373Thr leaves expression intact but impairs
          function (the reduced-activity route). Unlike POLD1, no cancer-predisposition or progeroid allele
          class is described for POLD3 in humans.'
      selected_evidence:
        snippet: POLD3, with POLD2 and POLD4, regulate the activity of POLD1, the activity and stability
          of PolD, and establish protein–protein interactions
