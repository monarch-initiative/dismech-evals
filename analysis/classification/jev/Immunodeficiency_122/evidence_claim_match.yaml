      assertion_type: Discussion
      assertion:
        discussion_id: imd122_syndromic_attribution
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Are the developmental and sensorineural features of POLD3 deficiency a direct consequence
          of reduced polymerase delta in dividing non-haematopoietic tissue, as the mouse replication-stress
          phenotype would suggest, or are they confounded by infection and transplant course in the two
          human patients?
        rationale: 'The mouse supplies a clean mechanistic prediction: Pold3 loss causes embryonic replication
          stress with brain-preferential phenotypes reminiscent of microcephaly syndromes, so a hypomorphic
          human should show developmental effects. The human data cannot confirm it. No non-haematopoietic
          tissue was examined in either patient; the Lebanese patient''s hearing loss and developmental
          delay are reported without mechanism; and the Omenn patient''s neurodevelopmental course is
          confounded by his transplant, conditioning and fatal neurological regression. The model predicts
          a direct developmental effect that the human evidence can neither establish nor exclude — classified
          HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the model evidence exists and the open
          question is its translational validity, not the absence of any evidence.'
        attaches_to:
        - pathophysiology#Syndromic Developmental and Sensorineural Features
        - phenotypes#Sensorineural Hearing Loss
        - phenotypes#Global Developmental Delay
      selected_evidence:
        snippet: POLD3 is essential for mouse development and is also required for viability in adult
          animals
        supports: SUPPORT
        directness: INDIRECT
