      assertion_type: Pathophysiology
      assertion:
        name: Syndromic Developmental and Sensorineural Features
        biological_scale: ORGANISM
        mechanism_confidence: HYPOTHETICAL
        description: 'Neurodevelopmental delay in both patients, sensorineural hearing loss in the Lebanese
          patient, and growth retardation with facial dysmorphism in the Omenn patient. The mechanism
          is assumed rather than shown: polymerase delta is required wherever cells divide, so a general
          replication restriction should affect development — and the mouse models the point, with replication-stress
          features reminiscent of microcephaly syndromes. No non-haematopoietic tissue was examined in
          either patient, and the Omenn patient''s post-transplant neurological regression confounds the
          developmental attribution, so the node is graded HYPOTHETICAL.'
      selected_evidence:
        snippet: Here we report a homozygous POLD3 variant (NM_006591.3; p.Ile10Thr) in a Lebanese patient,
          the product of a consanguineous family, presenting with a syndromic severe combined immunodeficiency
          (SCID) with neurodevelopmental delay and hearing loss.
        supports: SUPPORT
        directness: INDIRECT
