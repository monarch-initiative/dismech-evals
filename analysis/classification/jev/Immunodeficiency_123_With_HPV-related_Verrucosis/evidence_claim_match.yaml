      assertion_type: Pathophysiology
      assertion:
        name: Loss of CD28 Co-stimulatory Signaling
        description: 'CD28 is the canonical second signal of T cell activation: engaged by CD80 or CD86
          on antigen-presenting cells, it amplifies T cell receptor signalling. Patient T cells respond
          normally to CD3 and CD2 stimulation but not to CD28 co-stimulation. This node captures the single
          concept of the lost co-stimulatory signal, and is the branch point from which the skin disease
          and the laboratory findings separate.'
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: T cell costimulation
          term:
            id: GO:0031295
            label: T cell costimulation
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: CD28 has a major costimulatory role of T-cell receptor signaling when engaged by CD80
          or CD86 expressed on antigen-presenting cells.
        supports: SUPPORT
