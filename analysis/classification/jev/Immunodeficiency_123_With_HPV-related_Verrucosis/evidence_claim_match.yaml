  2df3997cc4b8672169b310aa20873d48be01826a1de4ba3881663a7c189cb40b:
    claim:
      about:
        disease:
          name: Immunodeficiency 123 With HPV-related Verrucosis
          disease_term:
            preferred_term: immunodeficiency 123 with HPV-related verrucosis
            term:
              id: MONDO:0971177
              label: immunodeficiency 123 with HPV-related verrucosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_imd123_mouse_warts_regress
        prompt: Can the CD28-knockout mouse inform the chronic, progressive human lesion, given that its
          warts regress spontaneously and its papillomavirus is a different virus in a different species?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#HPV-2-Driven Tree-Man Phenotype
        - pathophysiology#Uncontrolled Cutaneous HPV Replication in Keratinocytes
        rationale: The model is excellent for the immunological requirement and poor for the disease.
          It establishes that CD28, and specifically the CD28-CD80/CD86 axis, is required for papillomavirus
          control, since ligand blockade phenocopies the knockout. But the knockout's cutaneous warts
          regress spontaneously at about five weeks, mucosal clearance is delayed rather than absent,
          and the authors conclude that CD28 deficiency delays but does not prevent clearance. The human
          counterpart is a lesion that progressed to giant cutaneous horns over years. Papillomaviruses
          are strictly species-specific, so the discrepancy cannot be resolved by infecting mice with
          HPV-2; it needs either a humanized system or a mouse virus that establishes persistence in this
          background. Until then, the persistence and progression half of the human disease has no model,
          which is also the half any therapy would have to address.
        proposed_experiments:
        - experiment_id: exp_imd123_persistent_papillomavirus_model
          name: A CD28-deficient model that reproduces lesion persistence
          description: Test whether MmuPV1 persistence can be achieved in CD28-knockout mice on permissive
            backgrounds or with additional immune perturbation, and in parallel whether a humanized skin
            graft system supports HPV-2 persistence under CD28 blockade, so that lesion progression rather
            than only initial susceptibility can be studied.
      selected_evidence:
        snippet: Collectively, these findings indicate that CD28 deficiency delays but does not prevent
          the clearance of papillomavirus infections at both cutaneous and mucosal sites in mice.
        supports: SUPPORT
