      assertion:
        name: CARMIL2 deficiency
        description: 'The closest mimic, and the informative one: CARMIL2 is the scaffolding protein required
          for CD28 co-stimulation, so CARMIL2-deficient patients have the same broken signalling pathway
          and, like CD28-deficient patients, recalcitrant warts and low memory T cell counts. The phenotype
          is nonetheless much broader, which is the argument that CARMIL2 does more than serve CD28.'
        distinguishing_features:
        - Numerous infections rather than susceptibility restricted to skin papillomaviruses
        - Low NK cell and memory B cell counts, which are normal in CD28 deficiency
        - Weak antibody responses, whereas CD28-deficient patients make virus-specific antibody
        - EBV-positive smooth muscle tumours and inflammatory bowel disease
      selected_evidence:
        snippet: Like CD28-deficient patients, CARMIL2-deficient patients display recalcitrant warts and
          low blood counts of CD4+ and CD8+ memory T cells and CD4+ TREGs.
        supports: SUPPORT
