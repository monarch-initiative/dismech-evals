  772e8994e2ad62f1e83b700465113664d77781cb3e15312bbc847948628e3f69:
    claim:
      about:
        disease:
          name: Immunodeficiency 123 With HPV-related Verrucosis
          disease_term:
            preferred_term: immunodeficiency 123 with HPV-related verrucosis
            term:
              id: MONDO:0971177
              label: immunodeficiency 123 with HPV-related verrucosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_imd123_why_hpv_only
        prompt: Why does loss of the canonical T cell second signal produce susceptibility to skin papillomaviruses
          and to essentially nothing else?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of CD28 Co-stimulatory Signaling
        - pathophysiology#Failed HPV-Reactive CD4+ T Cell Response
        rationale: 'This is the central unexplained fact of the disease, and it runs against the textbook.
          CD28 is the co-stimulatory receptor of the two-signal model, and losing it should produce a
          combined immunodeficiency; instead these patients have normal T cell development, normal leukocyte
          counts and immunoglobulins, carry EBV and CMV without disease, and are ill only from HPV-2 and
          HPV-4 in skin. The authors state the conclusion - CD28-dependent T cell responses are largely
          redundant for protective immunity - but not the reason. Candidate explanations that the published
          work does not distinguish between: the somatic revertant memory CD4+ T cell population may cover
          most requirements while being too small or wrongly localized to clear cutaneous papillomavirus;
          keratinocyte control of HPV may depend on a tissue-resident T cell response with an unusually
          strict co-stimulation requirement; or CD2 and other co-stimulatory routes, which these T cells
          use normally, may substitute everywhere except the skin. Nothing in the literature tests these
          against each other, and with three patients in one family there is little prospect of resolving
          it clinically.'
        proposed_experiments:
        - experiment_id: exp_imd123_revertant_t_cell_repertoire
          name: Antigen specificity and tissue distribution of the revertant T cell population
          description: Characterize the somatic revertant memory CD4+ T cells in the patients for antigen
            specificity and for presence in skin versus blood, to test whether broad protection outside
            the skin is carried by the revertant compartment rather than by CD28-independent immunity.
        - experiment_id: exp_imd123_costim_requirement_by_tissue
          name: Co-stimulation requirement of cutaneous versus systemic antiviral T cell responses
          description: In the CD28-knockout mouse, compare the CD28 dependence of tissue-resident antiviral
            T cell responses in skin against systemic responses to other viruses, to test whether the
            skin has a distinctively strict requirement.
      selected_evidence:
        snippet: Surprisingly, human CD28-dependent T cell responses are largely redundant for protective
          immunity.
        supports: SUPPORT
    origin:
