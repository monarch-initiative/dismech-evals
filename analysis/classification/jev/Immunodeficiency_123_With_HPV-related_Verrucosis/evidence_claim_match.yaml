    claim:
      about:
        disease:
          name: Immunodeficiency 123 With HPV-related Verrucosis
          disease_term:
            preferred_term: immunodeficiency 123 with HPV-related verrucosis
            term:
              id: MONDO:0971177
              label: immunodeficiency 123 with HPV-related verrucosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_imd123_hpv_type_determines_severity
        prompt: Why does the same homozygous CD28 variant produce a chronic, progressive tree-man phenotype
          with HPV-2 and stable, sometimes regressing warts with HPV-4?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Uncontrolled Cutaneous HPV Replication in Keratinocytes
        - pathophysiology#HPV-2-Driven Tree-Man Phenotype
        rationale: 'Within one family carrying one allele, the outcome tracks the infecting virus rather
          than the genotype: HPV-2 in one relative progressed to giant horns, HPV-4 in two others produced
          severe but stable warts. Of the three individuals with germline CD28 deficiency reported to
          date, one had persistent lesions, one had disease resolution, and one the chronic tree-man phenotype.
          So viral type, not host genotype, is doing the work here - but no comparison of HPV-2 and HPV-4
          in a CD28-deficient background has been made, and the mouse model uses a third virus entirely.
          This matters clinically because it is what determines prognosis for a newly diagnosed patient.'
        proposed_experiments:
        - experiment_id: exp_imd123_hpv2_vs_hpv4_keratinocyte_control
          name: Comparative control of HPV-2 and HPV-4 in CD28-deficient immune reconstitution
          description: Compare the CD28-dependence of T cell responses raised against HPV-2 and HPV-4
            antigens using patient and control cells, to test whether HPV-2 is simply less controllable
            without CD28 or whether it additionally evades a CD28-independent mechanism that holds HPV-4.
      selected_evidence:
        snippet: 'To date, three individuals with germline CD28 deficiency have been reported to develop
          recalcitrant, HPV-driven warts: one exhibited persistent lesions, another experienced disease
          resolution, and the third developed a chronic "tree-man" phenotype.'
        supports: SUPPORT
