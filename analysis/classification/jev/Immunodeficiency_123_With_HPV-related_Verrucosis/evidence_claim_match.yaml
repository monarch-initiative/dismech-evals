      assertion_type: Genetic
      assertion:
        name: CD28
        gene_term:
          preferred_term: CD28
          term:
            id: hgnc:1653
            label: CD28
        relationship_type: CAUSATIVE
        notes: CD28 (2q33.2) encodes the CD28 T cell co-stimulatory receptor. The single reported disease
          allele is a homozygous missense variant, c.52G>A p.(Gly18Arg), abolishing detectable surface
          protein. A small population of revertant memory CD4+ T cells does carry detectable CD28, so
          surface staining is not uniformly negative. MONDO:0971177 records no causal gene; CD28 was taken
          from the MedGen record for the same concept (uid 1855052, CUI C5935639), whose AssociatedGenes
          element reads `gene_id="940" chromosome="2" cytogen_loc="2q33.2"` for CD28, and confirmed against
          the primary report.
      selected_evidence:
        snippet: Utilizing whole exome sequencing, we identified a homozygous, previously unreported missense
          mutation (c.52G>A; p.Gly18Arg) in the CD28 gene.
        supports: SUPPORT
