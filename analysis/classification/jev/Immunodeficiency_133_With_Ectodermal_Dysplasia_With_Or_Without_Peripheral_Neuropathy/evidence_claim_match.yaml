        context: []
      assertion_type: Genetic
      assertion:
        name: ITPR3
        gene_term:
          preferred_term: ITPR3
          term:
            id: hgnc:6182
            label: ITPR3
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: ITPR3 encodes IP3R3, one of three subunits that assemble into the tetrameric IP3 receptor
          in the endoplasmic reticulum membrane. Disease-causing variants are heterozygous missense substitutions
          that interfere with channel function of the assembled tetramer, so the functional impact is
          dominant-negative rather than loss of function; that is recorded on the pathophysiology node
          "Impaired IP3-Gated Endoplasmic Reticulum Calcium Release", which carries the ITPR3 gene descriptor
          and the genetic_context block.
        variants:
        - name: p.Arg2524Cys
          description: Recurrent de novo substitution (NM_002224.3:c.7570C>T) reported in four unrelated
            patients. Site-directed mutagenesis showed the residue is exquisitely sensitive to any amino
            acid change.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Pathogenicity is not due to haploinsufficiency, rather ITPR3 protein variants interfere
          with IP3R channel function leading to depletion of ER Ca2+ stores and blunted SOCE in T cells.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
