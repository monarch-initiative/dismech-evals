        biological_scale: TISSUE
        description: IP3R3 is required for peripheral nerve maintenance, and ITPR3 variants cause demyelinating
          sensorimotor Charcot-Marie-Tooth neuropathy type 1J. The neuropathy is incompletely penetrant
          within this disease, and one patient's nerve involvement was a motor neuronopathy without demyelination,
          so the node is kept at the level of nerve maintenance rather than asserting demyelination in
          every case.
        biological_processes:
        - preferred_term: peripheral nervous system myelin maintenance
          modifier: ABNORMAL
          term:
            id: GO:0032287
            label: peripheral nervous system myelin maintenance
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
      selected_evidence:
        snippet: This previously reported p.Thr1424Met change was present in 33 affected individuals from
          nine unrelated families from multiple populations, representing an unusual recurrence rate at
          a mutational hotspot, strengthening the gene-disease relationship
        supports: SUPPORT
