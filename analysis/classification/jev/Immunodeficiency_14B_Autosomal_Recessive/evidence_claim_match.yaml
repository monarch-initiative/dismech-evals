      assertion:
        name: Failure of PIP3 Generation on Antigen and Cytokine Receptor Engagement
        biological_scale: CELLULAR
        description: PI3K-delta phosphorylates PIP2 to PIP3 at the leukocyte plasma membrane downstream
          of antigen and cytokine receptors. Patient T lymphoblasts fail to generate PIP3 on T-cell receptor
          engagement, which is the proximal signalling failure from which the rest of the disease follows.
      selected_evidence:
        snippet: patient-derived T lymphoblasts were profoundly impaired in their ability to generate
          PIP3 upon T cell receptor (TCR) engagement
        supports: SUPPORT
