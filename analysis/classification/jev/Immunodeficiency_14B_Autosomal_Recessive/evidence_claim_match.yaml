      assertion_type: DifferentialDiagnosis
      assertion:
        name: Idelalisib-associated immune-mediated colitis
        description: Not an inherited mimic but the acquired, pharmacological counterpart. Patients given
          the p110-delta-specific inhibitor idelalisib for haematological malignancy develop severe colitis
          - the same on-target loss of activity producing the same gut disease in adults with no PIK3CD
          variant. It belongs here because it is the strongest available evidence that the enterocolitis
          in IMD14B is caused by loss of p110-delta activity itself rather than by anything else in these
          patients' genomes.
        distinguishing_features:
        - Acquired and drug-induced rather than germline, with onset during therapy in adults
        - No PIK3CD variant; the enzyme is inhibited rather than absent
        - Resolves or is managed by withdrawing the drug, an option unavailable in the genetic disease
      selected_evidence:
        snippet: In humans, immune dysregulation including severe colitis is present in many cancer patients
          who are treated with the p110δ-specific inhibitor idelalisib.
        supports: SUPPORT
