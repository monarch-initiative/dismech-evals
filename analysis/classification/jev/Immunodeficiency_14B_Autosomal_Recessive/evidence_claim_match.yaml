      assertion:
        name: Common variable immunodeficiency
        description: 'The clinical bucket IMD14B patients are most likely to be placed in before genetic
          testing: hypogammaglobulinaemia, absent class-switched memory B cells, recurrent sinopulmonary
          infection and autoimmune cytopenia together describe a CVID phenotype. Routine T-cell testing
          is often normal, which does nothing to prompt a monogenic search.'
        distinguishing_features:
        - CVID is a clinical diagnosis of exclusion; IMD14B has a defined biallelic PIK3CD genotype
        - Consanguinity and affected siblings should prompt a monogenic search
        - Enterocolitis with crypt apoptosis and refractory immune thrombocytopenia are more suggestive
          of a monogenic defect
      selected_evidence:
        snippet: Therefore a high index of suspicion for an underlying monogenic cause is required in
          this setting.
        supports: SUPPORT
