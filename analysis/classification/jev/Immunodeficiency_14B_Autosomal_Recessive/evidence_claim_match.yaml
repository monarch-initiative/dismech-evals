        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Paradoxical T-Cell Hyperactivation
        biological_scale: CELLULAR
        description: 'The counterintuitive step, and the one that makes the autoimmune half of this disease
          make sense. PI3K-delta drives T-cell activation, so losing it ought to make T cells less responsive
          - yet patient CD3+ cells are hyperactivated. The proposed reason is substrate rerouting: with
          the kinase gone, its substrate PIP2 accumulates and is instead hydrolysed by phospholipase C-gamma1
          into second messengers that drive activation through a different arm.

          The consequence is a two-sided failure at the gut mucosa - effector T cells that are improperly
          activated, and PI3K-delta-deficient regulatory T cells unable to suppress them.'
        cell_types:
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
          modifier: INCREASED
      selected_evidence:
        snippet: Our data supports the conclusion that CD3 + hyperactivation is a natural consequence
          of PIK3CD protein loss.
        supports: SUPPORT
