        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Activated PI3K-delta syndrome (APDS1 / IMD14A)
        description: The same gene in the opposite direction. APDS1 arises from heterozygous activating
          PIK3CD variants and presents with lymphoproliferation, herpesvirus infection and CD4 lymphopenia;
          IMD14B arises from biallelic null variants and presents with humoral deficiency, autoimmunity
          and enterocolitis. Distinguishing them is not academic - a PI3K-delta inhibitor is rational
          therapy in APDS and would be expected to worsen IMD14B.
        distinguishing_features:
        - APDS1 is autosomal dominant with gain-of-function variants; IMD14B is autosomal recessive with
          biallelic loss of function
        - APDS1 features chronic lymphoproliferation and CD4 lymphopenia
        - PI3K-delta inhibition is a therapeutic strategy in APDS and would aggravate the lesion in IMD14B
      selected_evidence:
        snippet: Activating germline mutations inPIK3CDcause the immune dysregulatory disease activated
          PI3Kδ syndrome (APDS), usually presenting with recurrent sinopulmonary infections in childhood,
          herpes virus infections and CD4 lymphopenia
        supports: SUPPORT
