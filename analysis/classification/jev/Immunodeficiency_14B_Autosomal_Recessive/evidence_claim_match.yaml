              label: immunodeficiency 14b, autosomal recessive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired AKT-mTOR Signalling and Lymphocyte Metabolic Reprogramming
        biological_scale: CELLULAR
        description: Reduced PIP3 blunts the PDK1-AKT-mTOR cascade, and with it the metabolic switch lymphocytes
          need in order to expand and acquire effector function. Patient cells show reduced AKT and S6
          phosphorylation and impaired glycolysis - and the same glycolytic defect is reproduced in healthy
          donor cells simply by adding idelalisib, which ties the metabolic phenotype directly to loss
          of p110-delta activity rather than to anything else in the patient's background.
        biological_processes:
        - preferred_term: glycolytic process
          term:
            id: GO:0006096
            label: glycolytic process
          modifier: DECREASED
      selected_evidence:
        snippet: A glycolysis stress test showed impaired IL-2-stimulated glycolysis and glycolytic reserve
          in patient cells, similar to the behavior of CD4 and CD8 T cells treated with idelalisib
        supports: SUPPORT
