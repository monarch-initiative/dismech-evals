      assertion_type: Treatment
      assertion:
        name: Immunosuppressive and Anti-Inflammatory Therapy
        description: Control of the immune-mediated enterocolitis. In the index case anti-inflammatory
          therapy alone failed, and the diarrhoea only came under control with corticosteroid, cyclosporine
          and infliximab; weaning the immunosuppression relapsed the gut disease. Other reported patients
          were managed with mesalazine, steroids or 6-mercaptopurine. It is curated against the tolerance
          node because it suppresses the dysregulated immune response rather than correcting the signalling
          lesion - which is also why it controls rather than cures.
