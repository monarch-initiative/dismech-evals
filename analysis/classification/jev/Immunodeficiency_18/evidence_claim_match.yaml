        notes: No population estimate exists for CD3epsilon deficiency specifically. The disorder is known
          from single families and from the occasional CD3E case within larger severe combined immunodeficiency
          cohorts - two of 23 solved patients in one Turkish series, one of twenty in an Egyptian series
          - and those denominators are ascertainment-selected cohorts of SCID patients, not populations,
          so no rate is recorded.
      selected_evidence:
        snippet: 'In total, 24 disease-causing variants (17 known and 7 novel) were identified in 23 patients
          in 9 different SCID genes: RAG1 (n = 5), RAG2 (n = 2), ADA (n = 3), DCLRE1C (n = 2), NHEJ1 (n
          = 2), CD3E (n = 2), IL2RG (n = 3), JAK3 (n = 4) and IL7R (n = 1).'
        supports: SUPPORT
