        name: Allogeneic haematopoietic stem cell transplantation
        description: The only definitive treatment for the complete-deficiency form. A patient with a
          homozygous CD3E splice-site variant transplanted haploidentically from his mother developed
          normal T- and B-cell immunity and was followed for fifteen years. Engraftment was confined to
          the T-cell lineage, T-cell counts never reached normal, and naive T cells stayed low, which
          is the pattern that later allowed humoral immunity to fail.
