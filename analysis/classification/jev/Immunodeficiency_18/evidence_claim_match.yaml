      assertion_type: Discussion
      assertion:
        discussion_id: gap_cd3e_genotype_severity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does residual CD3epsilon protein reliably predict a milder course, and how much is enough
          to permit T-cell development?
        attaches_to:
        - genetic#CD3E
        - pathophysiology#Residual Unstable CD3epsilon in Partial Deficiency
        rationale: 'The reported spectrum implies a dose relationship: truncating and splice alleles that
          abolish the chain give severe combined immunodeficiency, while the two hypomorphic alleles in
          the family in which CD3E was first implicated left an unstable chain, about a tenth of the normal
          surface receptor, and a T-cell compartment that existed. But the inference rests on one hypomorphic
          family against a handful of null families, and nobody has measured residual CD3epsilon protein
          across a series and related it to outcome. The threshold question is open in both directions:
          how much residual chain permits thymopoiesis, and whether a patient with an intermediate amount
          would present as leaky severe combined immunodeficiency, as a milder combined immunodeficiency,
          or as something resembling CD3gamma deficiency. It is a practical question, because the answer
          determines whether a newly diagnosed infant should be transplanted urgently, and because newborn
          screening detects the null form but would not reliably detect a hypomorphic one.'
      selected_evidence:
        snippet: We report on another immunodeficient patient whose T lymphocytes express the T cell receptor
          at one-tenth of normal fluorescence intensity and are not triggered to proliferate in vitro
          by anti-CD3 or anti-CD2 antibodies.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:1370449
      reference_title: Structural analysis of low TCR-CD3 complex expression in T cells of an immunodeficient
