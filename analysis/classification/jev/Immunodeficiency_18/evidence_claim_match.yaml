  f8a0972f1eca82500c2f36fde6bd5cc6959200d147424d38cafda366178b44e2:
    claim:
      about:
        disease:
          name: Immunodeficiency 18
          disease_term:
            preferred_term: immunodeficiency 18
            term:
              id: MONDO:0014278
              label: immunodeficiency 18
        context: []
      assertion_type: Genetic
      assertion:
        name: CD3E
        association: Causal biallelic variant
        gene_term:
          preferred_term: CD3E
          term:
            id: hgnc:1674
            label: CD3E
        notes: 'The reported allelic spectrum is small and largely private to individual families: a homozygous
          two-base deletion in exon 5, a homozygous frameshift (p.L58Hfs*9) in two Turkish siblings, a
          homozygous splice-site change abolishing the protein, and nonsense alleles including p.Trp151*
          in a Pakistani family and one reported in an Egyptian cohort. The genotype does appear to set
          the severity in this disorder, unlike in CD3gamma deficiency: truncating and splice alleles
          that abolish the chain give severe combined immunodeficiency, while the two hypomorphic alleles
          in the original family left residual protein and a milder disease. That inference rests on a
          handful of families and has never been tested systematically.'
      selected_evidence:
        snippet: This included four novel nonsense variants in CD70 p.(Thr126Profs*33), CD3e p.(Trp151*),
          IL7R p.(Val138Ilefs*10), and ITGB2 p.(Ser627Valfs*61), and one previously reported in ITGB2
          p.(Cys62*).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
