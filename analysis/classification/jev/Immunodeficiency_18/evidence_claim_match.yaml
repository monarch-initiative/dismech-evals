        snippet: Finally, the absence of intact CD3-epsilon polypeptides had no discernible effect on
          the completion of TCR gamma and TCR delta gene rearrangements, emphasizing that they are probably
          not subjected to the same epigenetic controls as those operating on the expression of TCR alpha
          and beta genes.
        supports: SUPPORT
