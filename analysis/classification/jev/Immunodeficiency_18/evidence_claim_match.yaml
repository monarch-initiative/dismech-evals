              is required.
        - target: Blocked Pre-TCR Signaling at Beta-Selection
          relationship: MEASURES
          fidelity: MODERATE
          description: 'The knockout separates recombination from signalling: TCRbeta rearrangement proceeds
            and full-length transcripts are made, so what fails is the receptor that reads the rearrangement,
