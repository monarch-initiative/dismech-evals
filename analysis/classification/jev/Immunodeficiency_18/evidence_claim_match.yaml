            preferred_term: immunodeficiency 18
            term:
              id: MONDO:0014278
              label: immunodeficiency 18
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the CD3epsilon Chain
        biological_scale: MOLECULAR
        description: Complete absence of the CD3epsilon polypeptide. Because CD3epsilon is the common
          partner of both CD3gamma and CD3delta, its loss takes out the gamma-epsilon and delta-epsilon
          dimers together, which is why it is more damaging than loss of either partner alone. In mouse
          thymocytes, disrupting the gene also strongly suppresses expression of CD3gamma and CD3delta,
          although that turned out to reflect the arrest rather than transcriptional control by CD3epsilon
          itself.
      selected_evidence:
        snippet: The T-cell receptor (TCR) is composed of two glycoproteins (alpha and beta or gamma and
          delta) associated with four invariant polypeptides (CD3-gamma, delta, epsilon and zeta). The
          majority of TCR/CD3 complexes contain six polypeptide chains, and although there is some flexibility
          in the complex subunit stoichiometry the CD3-epsilon chain is central to CD3 core assembly and
          full complex formation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8490660
      reference_title: Independent mutations of the human CD3-epsilon gene resulting in a T cell receptor/CD3
        complex immunodeficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: States the structural position of CD3epsilon that makes its loss consequential for
        the whole complex.
