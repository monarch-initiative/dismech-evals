      assertion_type: Diagnosis
      assertion:
        name: Newborn screening by T-cell receptor excision circle quantitation
        description: Measurement of TRECs in a dried blood spot. Because CD3epsilon deficiency blocks
          thymopoiesis outright, thymic output is absent and TRECs are undetectable, so the complete-deficiency
          form is detectable at birth by the universal screen. The hypomorphic form, in which T cells
          do develop, is not reliably detectable this way.
        results: Undetectable TRECs with normal kappa-deleting recombination excision circles.
        diagnosis_term:
          preferred_term: newborn screening
          term:
            id: NCIT:C81178
            label: Newborn Screening
      selected_evidence:
        snippet: T cell receptor excision circle (TREC) and kappa-deleting recombination excision circle
          (KREC) analyses were performed for T and B cell maturation. TRECs were not detected in both
          patients and the KREC copy numbers were similar to the other family members.
        supports: SUPPORT
