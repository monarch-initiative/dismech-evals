        modeled_mechanisms:
        - target: Arrest of Thymocyte Development
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The knockout reproduces the complete developmental block that defines the human
            null phenotype, and localises it to the pre-TCR checkpoint.
          limitations: 'Fidelity is moderate rather than high because the human arrest stage was never
            established: no thymus was available from the CD3epsilon-deficient family, so the correspondence
            is between the mouse''s arrest and the human outcome, not between two measured arrest points.
