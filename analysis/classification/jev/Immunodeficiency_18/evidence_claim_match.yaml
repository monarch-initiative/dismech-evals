  b1576442e6b2d818e11128751b8a1a4412e5878564af7662f919aa3a5ecafde9:
    claim:
      about:
        disease:
          name: Immunodeficiency 18
          disease_term:
            preferred_term: immunodeficiency 18
            term:
              id: MONDO:0014278
              label: immunodeficiency 18
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Combined immunodeficiency due to CD3gamma deficiency
        description: 'The sibling chain of the same receptor complex, and the boundary this entry is drawn
          against. CD3gamma deficiency shares the biochemical lesion - an incomplete TCR/CD3 complex -
          but does not block thymocyte development: patients have normal absolute T-cell numbers with
          reduced surface receptor, and their dominant clinical problem is immune dysregulation and autoimmunity
          rather than infection. The asymmetry is not a matter of degree but of which chain is lost: CD3epsilon
          partners both CD3gamma and CD3delta, so losing it removes two dimers rather than one. The one
          point of genuine overlap is the hypomorphic end of the CD3epsilon spectrum, where reduced surface
          receptor with preserved T cells is also what the flow panel shows; there the two are distinguished
          by sequencing, not by immunophenotype.'
        disease_term:
          preferred_term: combined immunodeficiency due to CD3gamma deficiency
          term:
            id: MONDO:0014276
            label: combined immunodeficiency due to CD3gamma deficiency
        distinguishing_features:
        - Normal absolute T-cell numbers rather than a developmental block
        - Autoimmunity, particularly thyroiditis and cytopenias, as the dominant problem
        - Biallelic CD3G rather than CD3E variants
      selected_evidence:
        snippet: Thus, the peripheral T lymphocyte pool was comparatively well preserved in human CD3gamma
          deficiencies despite poor thymus output or clinical outcome.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17277165
      reference_title: Differential biological role of CD3 chains revealed by human immunodeficiencies.
      evidence_source: HUMAN_CLINICAL
      explanation: Records the preserved peripheral T-cell pool in CD3gamma deficiency, the feature that
        CD3epsilon deficiency lacks.
