            description: 'No circulating CD3-positive T cells, with normal or high B-cell counts and present
              NK cells. The selectivity is the point: only the T lineage requires the pre-TCR, so B and
              NK development proceed normally, and the resulting T-B+NK+ pattern is what a diagnostic
              flow panel sees. Thymic output measured as T-cell receptor excision circles is undetectable,
              which is what makes the disorder visible to newborn screening.'
            cell_types:
            - preferred_term: T cell
              modifier: ABSENT
              term:
                id: CL:0000084
                label: T cell
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure of Cellular Immunity
        description: Without T cells there is no cell-mediated defence against viral, fungal and opportunistic
          pathogens.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Homozygous mutations in CD3D and CD3E genes lead to a complete block in T-cell development
          and thus to an early-onset severe combined immunodeficiency phenotype. Thymic studies have shown
          that the defect in T-cell development occurs at the transition between 'double-negative' and
          'double-positive' thymocytes. These results contrast with the partial T-cell immunodeficiency
          caused by a deficiency in CD3G.
        supports: SUPPORT
