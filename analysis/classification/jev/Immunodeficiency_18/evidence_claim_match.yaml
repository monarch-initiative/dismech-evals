  c240c067bac36c4bf3d7631facd1e12f65d03443d5a205c1f8dd01ae462621db:
    claim:
      about:
        disease:
          name: Immunodeficiency 18
          disease_term:
            preferred_term: immunodeficiency 18
            term:
              id: MONDO:0014278
              label: immunodeficiency 18
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cd3e_human_arrest_stage
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: At what stage does thymocyte development actually arrest in human CD3epsilon deficiency,
          and is the mouse arrest point a safe stand-in for it?
        attaches_to:
        - pathophysiology#Arrest of Thymocyte Development
        - pathophysiology#Blocked Pre-TCR Signaling at Beta-Selection
        rationale: 'Every account of this disorder places the block at beta-selection, and every such
          account traces back to the Cd3e-null mouse. The authors who first identified CD3epsilon deficiency
          said so explicitly: no thymus material was available from the affected family, so the stage
          could not be assessed, and the mouse arrest was offered as a possibility rather than a finding.
          What is established in humans is only the outcome - absence of CD3epsilon abrogates T-cell development.
          The gap matters because the neighbouring chain gives a documented precedent for the mouse being
          wrong about a human CD3 chain: Cd3g-null mice have severe combined immunodeficiency while CD3gamma-deficient
          patients keep normal T-cell numbers, a discordance with a known structural basis in the composition
          of the human gamma-delta receptor. The same paper that describes the human CD3delta thymus reports
          the arrest there at entry to the double-positive stage rather than at the double-negative stage
          the mouse shows for CD3epsilon, so the two chains do not even arrest at the same point within
          one species. No human thymus from a CD3epsilon-deficient patient or fetus has been examined
          since.'
      selected_evidence:
        snippet: It was not possible to assess at what stage the CD3 ε deficiency blocked T cell differentiation
          in patients from family I, as no thymus material was available.
        supports: NO_EVIDENCE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15546002
      reference_title: Severe combined immunodeficiency caused by deficiency in either the delta or the
        epsilon subunit of CD3.
      evidence_source: HUMAN_CLINICAL
      explanation: States that the human arrest stage was not determined, which is the gap.
