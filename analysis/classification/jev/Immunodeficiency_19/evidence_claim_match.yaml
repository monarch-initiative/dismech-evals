        biological_scale: MOLECULAR
        description: 'The hypomorphic branch. The splice-donor allele causes exon 2 skipping in most transcripts,
          but some correctly spliced transcript remains, so T cells carry a reduced amount of CD3delta
          rather than none. This is the mechanistic reason severity in this disorder is graded, and it
          is curated separately because its downstream chain differs from the null branch: a lineage-selective
          block rather than an absolute one.'
