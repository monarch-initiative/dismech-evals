          value:
            name: Leaky splice allele
            display_name: Leaky CD3delta deficiency (Talphabeta-Tgammadelta+B+NK+ SCID)
            description: The homozygous IVS2+5G>A splice-donor allele, reported in two unrelated Ecuadorian
              children and, as c.274+5G>A, in the two Omenn-syndrome patients of the transplant series.
              It reduces but does not abolish CD3D transcript and CD3delta protein in T cells - enough
              for gamma-delta selection but not for alpha-beta selection, so the immunophenotype is Talphabeta-Tgammadelta+B+NK+
              rather than T-B+NK+. The residual alpha-beta compartment is oligoclonal and T-cell help
              to B cells is impaired, so the leaky form is still a SCID.
            genes:
            - preferred_term: CD3D
              term:
                id: hgnc:1673
                label: CD3D
          role: subtype
      assertion_type: Phenotype
      assertion:
        name: Decreased total T cell count with preserved gamma-delta T cells
        category: Immunologic
        diagnostic: true
        subtype: Leaky splice allele
        description: 'The leaky-allele laboratory picture: scant, oligoclonal peripheral alpha-beta T
          cells, with gamma-delta T cells present, so the immunophenotype is Talphabeta-Tgammadelta+B+NK+.
          Recording it matters diagnostically because a SCID panel read only as total CD3 count can miss
          the pattern, and because it is the mirror image of the mouse knockout in which gamma-delta development
          is the spared lineage.'
        phenotype_term:
          preferred_term: Decreased total T cell count
          term:
            id: HP:0005403
            label: Decreased total T cell count
        notes: 'HPO has no term for a selective reduction of alpha-beta T cells: `runoak -i ols:hp search
          "alpha-beta T cell proportion"` returns only CD4, CD8 and memory-subset proportion terms, and
          the gamma-delta terms returned by `runoak -i ols:hp search "gamma-delta T cell"` (HP:0500269
          abnormal, HP:0500270 increased, HP:0500271 decreased gamma-delta T cell proportion) describe
          an abnormal proportion rather than a preserved one. The total-count term is therefore bound
          and the lineage detail carried in `preferred_term` and the description.'
      selected_evidence:
        snippet: Here, we report 2 unrelated cases of SCID with a selective block in αβ but not in γδ
          T cell development, associated with a new splicing mutation in the CD3D gene.
        supports: SUPPORT
