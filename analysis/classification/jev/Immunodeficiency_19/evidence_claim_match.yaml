      assertion_type: Subtype
      assertion:
        name: Leaky splice allele
        display_name: Leaky CD3delta deficiency (Talphabeta-Tgammadelta+B+NK+ SCID)
        description: The homozygous IVS2+5G>A splice-donor allele, reported in two unrelated Ecuadorian
          children and, as c.274+5G>A, in the two Omenn-syndrome patients of the transplant series. It
          reduces but does not abolish CD3D transcript and CD3delta protein in T cells - enough for gamma-delta
          selection but not for alpha-beta selection, so the immunophenotype is Talphabeta-Tgammadelta+B+NK+
          rather than T-B+NK+. The residual alpha-beta compartment is oligoclonal and T-cell help to B
          cells is impaired, so the leaky form is still a SCID.
        genes:
        - preferred_term: CD3D
          term:
            id: hgnc:1673
            label: CD3D
      selected_evidence:
        snippet: Here, we report 2 unrelated cases of SCID with a selective block in αβ but not in γδ
          T cell development, associated with a new splicing mutation in the CD3D gene.
        supports: SUPPORT
    origin:
