            term:
              id: MONDO:0014280
              label: immunodeficiency 19
        context: []
      assertion_type: Genetic
      assertion:
        name: CD3D
        association: Causal biallelic variant
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: CD3D
          term:
            id: hgnc:1673
            label: CD3D
        notes: 'Three recurrent alleles carry most reported patients and segregate with ancestry - c.202C>T
          (R68X) in Mennonite families in North America and Europe, a splice-acceptor change at intron
          2 (c.275-2A>G) in a Japanese family, and c.274+5G>A (IVS2+5G>A) in Ecuadorian families - which
          the transplant series reads as three founder effects. The genotype-phenotype relation is one
          of the clearer ones among the CD3 chains: nonsense and splice-acceptor alleles abolish the chain
          and give complete T-cell absence, while the single leaky donor-site allele permits gamma-delta
          development and the Omenn presentations. That inference rests on a handful of families and has
          not been tested systematically.'
      selected_evidence:
        snippet: All patients were found to have homozygous mutations in the CD3δ gene. Three different
          mutations have been identified which segregate according to ethnic origin suggesting a different
          founder effect in each group (Table 1).
        supports: SUPPORT
    origin:
