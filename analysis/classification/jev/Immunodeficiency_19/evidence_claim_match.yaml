  7a9df1af25bb15dc25564587d58f9c54731155a3a9c058ce6cbab8815d06a35a:
    claim:
      about:
        disease:
          name: Immunodeficiency 19
          disease_term:
            preferred_term: immunodeficiency 19
            term:
              id: MONDO:0014280
              label: immunodeficiency 19
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cd3d_arrest_stage_two_studies
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Where exactly does thymocyte development arrest in human CD3delta deficiency - at the
          pre-TCR checkpoint or at the intermediate single-positive stage just before the double-positive
          transition?
        attaches_to:
        - pathophysiology#Arrest of Thymocyte Development
        - pathophysiology#Failure of pre-TCR and TCR Complex Assembly
        rationale: 'The two studies that examined CD3delta-deficient human thymic tissue do not agree
          on the stage. The earlier one, on infant thymi, placed the block at pre-TCR expression from
          reduced CD4 and CD8 message and protein; the later one, on fetal thymi, found abundant CD3epsilon-positive
          CD4+ CD45RO- CD8- intermediate single-positive cells with strongly reduced proliferation, and
          placed the block slightly later, at the ISP stage. The authors of the second study attribute
          the difference to the tissue examined (infant versus fetal) and to the analysis method rather
          than to a biological disagreement, and suggest that some pre-TCR-positive thymocytes may survive
          to the ISP stage in the absence of CD3delta. A third reading exists: the transplant series,
          summarising a biopsy and an autopsy, reports the arrest at the CD4/CD8 double-negative stage
