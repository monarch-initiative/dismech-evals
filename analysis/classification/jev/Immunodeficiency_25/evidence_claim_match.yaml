  7e00ca523f1a5fcdc2351c6ac01af4b891066654be6440b30711d9c6979873a4:
    claim:
      about:
        disease:
          name: Immunodeficiency 25
          disease_term:
            preferred_term: immunodeficiency 25
            term:
              id: MONDO:0012426
              label: immunodeficiency 25
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired TCR/CD3 Complex Assembly and Surface Expression
        biological_scale: MOLECULAR
        description: The zeta-zeta homodimer is one of the invariant dimers the octameric receptor needs
          to complete assembly in the endoplasmic reticulum and leave it. Without it the incomplete complex
          is retained rather than exported, and surface receptor density falls sharply — unlike CD3gamma
          deficiency, where CD3delta can partly substitute and T-cell numbers stay normal. This was in
          fact the first biochemical description of the disorder, made before the gene was identified,
          as a failure of the zeta chain to associate with the rest of the complex.
        protein_complexes:
        - preferred_term: alpha-beta T cell receptor complex
          modifier: DECREASED
          term:
            id: GO:0042105
            label: alpha-beta T cell receptor complex
        cell_types:
        - preferred_term: mature alpha-beta T cell
          term:
            id: CL:0000791
            label: mature alpha-beta T cell
      selected_evidence:
        snippet: The biochemical basis of the defect in one of the cases thus far studied is an impaired
          association of CD3-zeta chain with the other chains of the complex. This defect prevented the
          maturation and transport of the incomplete complex to the cell surface.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
