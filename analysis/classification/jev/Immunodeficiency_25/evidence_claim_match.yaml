    evidence_metadata:
      reference: PMID:17291425
      reference_title: '[Expression anomalies of the CD3-TCR complex expression and immunodeficiencies].'
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that mouse-human divergence is a general feature of the CD3 complex rather
        than specific to CD247, which is why the mismatch should be assumed rather than discovered for
        each subunit.
