        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ITAM-Dependent Proximal TCR Signaling
        biological_scale: MOLECULAR
        description: 'CD247 carries three of the ten ITAMs in the receptor complex. Their tyrosines are
          the docking sites that, once phosphorylated by LCK, recruit ZAP70 and start the proximal signalling
          cascade. In CD247 deficiency this step fails, and the failure is not repaired by restoring surface
          receptor: revertant variants that put the receptor back on the membrane still fail to support
          TCR-induced ZAP70 phosphorylation. The activation defect is therefore partly independent of
          receptor density.'
        biological_processes:
        - preferred_term: T cell receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0050852
            label: T cell receptor signaling pathway
      selected_evidence:
        snippet: Furthermore, all CD247 somatic variants failed to induce TCR-mediated ZAP70 tyrosine
          phosphorylation compared to WT.
        supports: SUPPORT
