      assertion_type: Phenotype
      assertion:
        category: Immunologic
        name: Reduced Surface TCR/CD3 Expression
        description: 'The defining laboratory finding, and the one that points at a TCR-complex gene rather
          than a recombination or signalling defect: the few T cells present carry markedly reduced surface
          CD3. HPO has no term for reduced surface TCR or CD3 density on T cells, so this is recorded
          with a free-text preferred_term and no binding.'
        phenotype_term:
          preferred_term: Reduced surface TCR/CD3 complex density on T cells
        notes: Needs an ontology term. HPO was searched through the OAK ols:hp adapter for "T cell receptor",
          "CD3", "surface CD3" and "TCR expression", with HP:0031382 used as a positive control to confirm
          the search was returning results rather than failing silently. Nothing matches receptor density
          per cell. The nearest hits are counts and proportions — HP:0005403 Decreased total T cell count,
          HP:5210413 Decreased total T cell proportion — which measure how many T cells there are rather
          than how much receptor each one carries. Those are the wrong measurement here and binding to
          one would misstate the finding, so this is recorded unbound.
      selected_evidence:
        snippet: The few T cells present contained no detectable CD3zeta protein, expressed low levels
          of cell surface CD3epsilon, and were nonfunctional.
        supports: SUPPORT
