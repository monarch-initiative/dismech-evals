  8555f50790b923192f658289678e39b3dd230ca9aad6077148195c5a18d2f842:
    claim:
      about:
        disease:
          name: Immunodeficiency 25
          disease_term:
            preferred_term: immunodeficiency 25
            term:
              id: MONDO:0012426
              label: immunodeficiency 25
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mouse_does_not_model_cd247
        kind: HUMAN_MODEL_MISMATCH
        prompt: Can murine CD247 reconstitution data be used to predict the effect of a human CD247 allele,
          given that the same truncating allele behaves differently in the two species?
        attaches_to:
        - pathophysiology#Impaired TCR/CD3 Complex Assembly and Surface Expression
        rationale: 'The mismatch is allele-specific, not global, and that is the useful form of the statement.
          MA5.8 handles a true null correctly: the exon 7 frameshift allele fails to rescue TCR assembly
          or surface expression in that line, which is exactly what it does in the patient. What MA5.8
          gets wrong is the retained-truncated-chain class — Q70X restores surface TCR there and does
          not in human cells. So the practical rule is that a murine reconstitution result can be trusted
          for an allele whose product is degraded away, and cannot be trusted for an allele that leaves
          a partial chain behind.

          The direction of the error matters: it is optimistic, so a damaging human allele of the retained
          class looks tolerated in the mouse. And this is not an isolated quirk of CD247 — the CD3 chains
          already have partly reciprocal roles across the two species, with CD3delta loss permitting some
          T-cell development in mice while causing SCID in humans, and CD3gamma loss doing the reverse.
          Whether the human-specific requirement reflects different subunit stoichiometry, different ER
          quality control, or something else has not been established.'
      selected_evidence:
        snippet: The main differences observed involve the respective roles of the CD3gamma chain as well
          as the CD3delta, whose functions seem to be reciprocal between the two species.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/2
      context_paths:
