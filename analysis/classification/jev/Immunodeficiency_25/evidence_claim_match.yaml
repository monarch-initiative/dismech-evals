        - path: /experimental_models/1
          value:
            name: ZKO CRISPR/Cas9 CD247-knockout Jurkat line
            experimental_model_type: CELL_LINE
            description: A human T-cell line in which CD247 has been knocked out, giving an isogenic null
              background for reconstitution with wild-type or mutant CD247. This is the system that carries
              most of the mechanistic argument in the entry, and the one against which the murine line
              was found wanting.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Loss of ITAM-Dependent Proximal TCR Signaling
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Reconstituting the null background with ITAM-truncated CD247 reproduces both the
          assembly defect and the downstream activation failure, and grades them by the number of ITAMs
          lost.
        limitations: Jurkat is a transformed leukaemic line with known deficiencies in phosphoinositide
          phosphatase regulation, and reconstitution is by overexpression rather than at endogenous level.
          It also cannot model thymic selection, which is where the clinical phenotype is generated.
        readouts:
        - name: CD69 induction after TCR stimulation
          target: Loss of ITAM-Dependent Proximal TCR Signaling
          direction: DECREASED
          interpretation: Activation marker induction falls with ITAM loss, reporting the proximal signalling
            block.
      selected_evidence:
        snippet: Jurkat T cells, either wild-type (WT) or CRISPR/Cas9-edited CD247-deficient (ZKO), were
          lentivirally transduced with WT CD247 or mutations ablating 1 (Q142X), 2 (Q101X), or 3 (Q70X)
          ITAMs.
        supports: SUPPORT
