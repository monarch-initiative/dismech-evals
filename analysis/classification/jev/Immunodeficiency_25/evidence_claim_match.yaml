  be8259fcf4f1172a547e01fbcc9379e6ef7f181d3cebf1b33d220e934121f197:
    claim:
      about:
        disease:
          name: Immunodeficiency 25
          disease_term:
            preferred_term: immunodeficiency 25
            term:
              id: MONDO:0012426
              label: immunodeficiency 25
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CD247 Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: 'Reported germline alleles include an initiation-codon change (p.M1T) and a nonsense
          change truncating the protein before all three ITAMs (p.Q70X). The two act differently: p.M1T
          abolishes translation initiation, while p.Q70X leaves a truncated chain that can still be detected
          intracellularly with a transmembrane-directed antibody but not with an ITAM-3-directed one.
          That distinction matters, because a retained truncated chain can compete with wild-type CD247
          whereas a true null cannot.

          A third reported allele is a homozygous single-C insertion after nucleotide 411 in exon 7. It
          behaves as a true null at the protein level: no CD3zeta is detectable in the patient''s T cells,
          and when the mutant cDNA is transduced into a CD247-deficient background the nascent protein
          is not detected at all on metabolic labelling, indicating it is made and then rapidly degraded.
          That completes the allelic picture — one allele class is degraded away, another is retained
          as a truncated competitor, and the two are not interchangeable when predicting a novel variant''s
          behaviour.'
        genes:
        - preferred_term: CD247
          term:
            id: hgnc:1677
            label: CD247
        genetic_context:
          allele_type: NONSENSE
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          gene:
            preferred_term: CD247
            term:
              id: hgnc:1677
              label: CD247
          notes: Recorded for the p.Q70X nonsense allele. The other reported germline change, p.M1T, is
            an initiation-codon variant rather than a nonsense one; both are biallelic and germline.
      selected_evidence:
        snippet: CD247 deficiency is a rare early-onset primary immunodeficiency disorder characterized
          by variants in the CD247 gene
        supports: SUPPORT
