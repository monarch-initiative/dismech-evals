              id: MONDO:0012426
              label: immunodeficiency 25
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: expression_function_uncoupling
        hypothesis_label: Restoring TCR surface expression is not sufficient to restore TCR function in
          CD247 deficiency
        status: EMERGING
        description: Somatic revertant variants at the patients' own germline codon recover surface receptor
          to varying degrees, yet none of them restores TCR-induced ZAP70 tyrosine phosphorylation, and
          the hierarchy of expression rescue does not match the hierarchy of activation rescue. If this
          holds, the ITAM-bearing cytoplasmic tail is doing something for signalling that is separable
          from what the transmembrane region does for assembly, and any therapy aimed at restoring receptor
          density alone would be expected to fail. The clinical correlate — that revertant T cells did
          not help any reported patient — is consistent but is an observation on very few patients.
      selected_evidence:
        snippet: Somatic reversions, such as those detected in patients with pathogenic CD247 germinal
          changes, display a discordant capability to rescue TCR expression versus function.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
