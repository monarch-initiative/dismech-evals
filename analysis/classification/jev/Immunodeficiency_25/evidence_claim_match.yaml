      assertion:
        target: Impaired TCR/CD3 Complex Assembly and Surface Expression
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: The Q70X allele restores surface TCR in MA5.8 but not in human T cells, so the murine
          line scores a truncating allele as functional for assembly when in human cells it is not.
        limitations: Species divergence at the assembly step itself, which is the mechanism under study
          rather than a peripheral difference. A reconstitution result obtained in MA5.8 cannot be assumed
          to transfer to human CD247 deficiency, and the direction of the error is optimistic — it makes
          a damaging allele look tolerated.
        readouts:
        - name: Surface TCR/CD3 expression after Q70X reconstitution
          target: Impaired TCR/CD3 Complex Assembly and Surface Expression
          direction: RESTORED
          interpretation: Restored in the murine line and not in human cells; the discrepancy is the finding,
            not the restoration.
      selected_evidence:
        snippet: MA5.8 mouse T cells do not accurately model human CD247 deficiencies, as Q70X restores
          TCR expression in MA5.8 but not in human cells.
        supports: SUPPORT
