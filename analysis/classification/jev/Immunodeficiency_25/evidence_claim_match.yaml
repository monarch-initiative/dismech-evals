      assertion_type: Genetic
      assertion:
        name: CD247 heterozygous nonsense alleles
        notes: A separate, non-recessive situation worth recording because it is easy to misread as carrier
          status. Heterozygous nonsense alleles that retain a truncated ITAM-deficient chain suppress
          wild-type receptor expression and signalling in vitro, so they are not equivalent to heterozygous
          nulls. The reported patients carrying them had signs of immunodeficiency or autoimmunity, but
          the dominant-negative effect is demonstrated in cell lines rather than established as the cause
          of their clinical features.
        gene_term:
          preferred_term: CD247
          term:
            id: hgnc:1677
            label: CD247
        relationship_type: DISPUTED
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Our results suggest that CD247 variants lacking ITAMs due to nonsense, but not null,
          mutations are defective for normal TCR assembly and exert a dominant-negative effect on TCR
          expression and signaling in vitro.
        supports: SUPPORT
