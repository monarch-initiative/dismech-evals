          term:
            id: CL:0000893
            label: thymocyte
      selected_evidence:
        snippet: All reported patients showed T cell lymphopenia, suffered infections, and required stem
          cell transplantation to survive. Older patients also showed autoimmune features, suggesting
          poor T-cell selection.
        supports: SUPPORT
