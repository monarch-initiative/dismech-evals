          to complete assembly in the endoplasmic reticulum and leave it. Without it the incomplete complex
          is retained rather than exported, and surface receptor density falls sharply — unlike CD3gamma
          deficiency, where CD3delta can partly substitute and T-cell numbers stay normal. This was in
