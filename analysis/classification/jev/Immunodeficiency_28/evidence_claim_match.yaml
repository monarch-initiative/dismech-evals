      assertion:
        target: Sustained IFN-gamma Production Without Receptor Response
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: The uncleared mycobacterial burden is what keeps IFN-gamma production going. Infected
          macrophages release IL-12, IL-12 acts on its receptor on T and NK cells, and those cells secrete
          IFN-gamma - a circuit that is intact in this disease and that the receptor block leaves running
          without a consumer. The intermediate step is named and established; what no source cited here
          measures is the size of that drive in IFNGR2-deficient patients specifically, hence the indirect
          link type.
      selected_evidence:
        snippet: IL-12 binds to its receptors, IL-12Rβ1 and IL-12Rβ2, on T lymphocytes and NK cells and
          is a potent inducer of IFN-γ.
        supports: SUPPORT
        directness: INDIRECT
