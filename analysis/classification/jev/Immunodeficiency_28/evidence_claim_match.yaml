    evidence_metadata:
      reference: PMID:30814731
      reference_title: Structure of the IFNγ receptor complex guides design of biased agonists.
      evidence_source: IN_VITRO
      explanation: Establishes the ordered assembly this node describes - IFNGR2 recruitment depends on
        the preformed intermediate, so an IFNGR2 defect stalls the complex.
