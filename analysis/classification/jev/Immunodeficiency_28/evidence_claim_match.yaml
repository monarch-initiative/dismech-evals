      assertion_type: Pathophysiology
      assertion:
        name: Failure of Hexameric IFN-gamma Receptor Assembly
        biological_scale: MOLECULAR
        description: IFN-gamma is a homodimer that first engages two constitutively expressed IFNGR1 chains.
          Only the preformed IFN-gamma-IFNGR1 complex presents the composite surface that IFNGR2 binds,
          so the 2:2:2 hexamer assembles strictly in that order. A defective or absent IFNGR2 chain leaves
          the assembly stalled at the intermediate complex.
        gene:
          preferred_term: IFNGR2
          term:
            id: hgnc:5440
            label: IFNGR2
      selected_evidence:
        snippet: We expressed IFNγR1 on the surface of yeast cells and showed that IFNγR2 only binds to
          the preformed IFNγR1–IFNγ complex, but not IFNγ alone.
        supports: SUPPORT
    origin:
