      assertion_type: Subtype
      assertion:
        name: AR partial
        display_name: Autosomal recessive partial IFN-gammaR2 deficiency
        classification: molecular
        description: 'Residual signalling, by one of two routes: a dysfunctional receptor displayed on
          the cell surface, or a normal receptor present in only small amounts because translation initiates
          at a downstream non-AUG codon. The two are not equivalent - the second gives lower residual
          signalling and a more severe phenotype, which is the sharpest available demonstration that signalling
          level rather than receptor class sets severity.'
      selected_evidence:
        snippet: Residual levels of IFN-γ signaling were very low, accounting for the more severe clinical
          phenotype of these patients with residual expression levels of normally functional surface receptors
          than of patients with partial recessive IFN-γR2 deficiency due to surface-expressed dysfunctional
          receptors, whose residual levels of IFN-γ signaling were higher.
        supports: SUPPORT
