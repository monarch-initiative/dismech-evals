          a non-functional receptor sitting at normal density on the cell surface looks normal on this
          assay, so a normal result does not exclude the disease and must be read alongside a functional
          assay. In heterozygotes the same measurement is what demonstrates the haploinsufficiency underlying
          the dominant form.'
