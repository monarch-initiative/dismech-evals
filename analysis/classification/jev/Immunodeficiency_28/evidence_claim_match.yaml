      assertion_type: Pathophysiology
      assertion:
        name: IFNGR2 Loss-of-Function Variant
        biological_scale: MOLECULAR
        description: Germline IFNGR2 variants of several molecular classes converge on the same consequence.
          Null alleles abolish surface receptor entirely; missense alleles such as T168N introduce a new
          N-glycosylation site; splice-acceptor variants delete residues from the extracellular fibronectin
          type III domain; and variants of the initiation or second codon leave only the small amount
          of protein that leaky downstream translation initiation produces. What varies between them is
          residual signalling, and that is what sets severity.
        gene:
          preferred_term: IFNGR2
          term:
            id: hgnc:5440
            label: IFNGR2
        genetic_context:
          gene:
            preferred_term: IFNGR2
            term:
              id: hgnc:5440
              label: IFNGR2
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Germline bi-allelic mutations of IFNGR2 can underlie partial or complete forms of IFN-γ
          receptor 2 (IFN-γR2) deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
