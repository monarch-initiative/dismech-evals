      assertion:
        name: IFNGR2 sequencing
        description: Molecular confirmation, in practice by exome sequencing with Sanger confirmation.
          Exome is the usual route because MSMD is genetically heterogeneous - the clinical picture points
          to the syndrome, not to the gene - and because several of the reported IFNGR2 alleles are splice-site
          or initiation-codon variants that a phenotype-first panel may not resolve.
      selected_evidence:
        snippet: Whole exome sequencing of the two affected surviving infants along with their consanguineous
          parents identified a novel, homozygous single nucleotide splice acceptor site variant in intron
          2 of the interferon gamma receptor 2 (IFNGR2) gene.
        supports: SUPPORT
