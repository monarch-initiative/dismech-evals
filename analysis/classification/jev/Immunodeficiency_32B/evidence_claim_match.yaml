      reference: PMID:21524210
      reference_title: IRF8 mutations and human dendritic-cell immunodeficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes IRF8 as the causative gene and its role in mononuclear phagocyte development
        and antimycobacterial immunity.
