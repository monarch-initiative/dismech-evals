      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'IMD32B is inherited in an autosomal recessive manner: complete IRF8 deficiency requires
          biallelic loss-of-function variants. The index case was homozygous for the K108E variant, present
          in both healthy parents in a heterozygous state; subsequent patients have been compound heterozygous
          (for example R83C/R291Q, or c.55del/R111*). This distinguishes IMD32B from the milder autosomal
          dominant IRF8 disorder (immunodeficiency 32A, T80A), in which a single allele produces a selective
          dendritic cell depletion rather than the complete monocyte and dendritic cell aplasia seen here.

          '
      selected_evidence:
        snippet: The K108E variant was associated with an autosomal recessive severe immunodeficiency
          with a complete lack of circulating monocytes and dendritic cells.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
