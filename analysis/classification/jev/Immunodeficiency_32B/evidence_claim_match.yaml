      assertion_type: Pathophysiology
      assertion:
        name: Widespread Immune Dysregulation
        biological_scale: CELLULAR
        description: 'Biallelic (complete) IRF8 deficiency is not confined to the mononuclear phagocyte
          compartment: it produces widespread immune dysregulation across other hematopoietic lineages.
          Natural killer cell development and maturation are arrested; TH1, TH17 and CD8+ memory T-cell
          differentiation is reduced with loss of CXCR3; and B-cell development is impaired with fewer
          memory cells, reduced class-switching and reduced somatic hypermutation. The T-cell component
          is at least partly secondary to the absent antigen-presenting compartment, whereas the NK and
          B-cell defects reflect the broader roles of IRF8. This axis distinguishes the complete recessive
          syndrome from the milder dominant IRF8 disorder.

          '
        cell_types:
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
      selected_evidence:
        snippet: Cell-specific gene expression was widely disturbed in interferon- and IRF8-regulated
          transcripts.
        supports: SUPPORT
