      assertion_type: Genetic
      assertion:
        name: IRF8
        gene_term:
          preferred_term: IRF8
          term:
            id: hgnc:5358
            label: IRF8
        association: CAUSATIVE
        variant_origin: GERMLINE
        features: 'IRF8 encodes interferon regulatory factor 8, a transcription factor that controls the
          development and function of mononuclear myeloid cells. IMD32B is caused by biallelic loss-of-function
          variants: the paradigmatic allele is the homozygous missense K108E, which maps to the DNA-binding
          domain and abolishes transcriptional activity, and additional recessive alleles include compound-heterozygous
          missense (R83C, R291Q) and truncating (R111*, c.55del) variants, all experimentally shown to
          be loss-of-function in overexpression/luciferase assays. Loss of IRF8 removes the transcriptional
          instruction for monocyte and dendritic cell differentiation while sparing granulopoiesis, which
          expands.

          '
      selected_evidence:
        snippet: They also show that human IRF8 is critical for the development of monocytes and dendritic
          cells and for antimycobacterial immunity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
