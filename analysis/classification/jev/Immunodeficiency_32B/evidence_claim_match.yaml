      assertion_type: Pathophysiology
      assertion:
        name: IRF8 Biallelic Loss of Function
        biological_scale: MOLECULAR
        genetic_context:
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        description: 'The initiating lesion is biallelic loss of function of IRF8. IRF8 is a sequence-specific
          DNA-binding transcription factor; the disease-causing variants map to its DNA-binding domain
          and disrupt the IRF8-DNA interaction, abolishing transcriptional activity. For the K108E allele
          this proceeds through protein destabilization: loss of the positively charged side chain causes
          loss of nuclear localization and of transcriptional activity, with enhanced proteasomal degradation
          of the misfolded protein.

          '
        molecular_functions:
        - preferred_term: IRF8 sequence-specific DNA-binding transcription factor activity
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Biochemical characterization of the IRF8(K108E) mutant in vitro shows that loss of the
          positively charged side chain at K108 causes loss of nuclear localization and loss of transcriptional
          activity
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
