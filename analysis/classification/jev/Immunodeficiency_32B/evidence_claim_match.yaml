      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: UNKNOWN
        notes: Autosomal recessive complete IRF8 deficiency is exceedingly rare. At the time of the Rosain
          et al. report only three unrelated patients had been described (from Ireland, England and China),
          with the Argentinian patient in that paper the fourth. No population rate can be derived from
          a handful of reported individuals, so the class is UNKNOWN rather than an ultra-rare band.
      selected_evidence:
        snippet: Autosomal recessive (AR) complete IRF8 deficiency is a rare severe inborn error of immunity
          underlying an absence of blood myeloid mononuclear cells, intracerebral calcifications, and
          multiple infections. Only three unrelated patients have been reported.
        supports: SUPPORT
