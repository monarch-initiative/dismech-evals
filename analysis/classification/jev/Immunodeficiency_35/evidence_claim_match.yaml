      assertion_type: Environmental
      assertion:
        name: Bacille Calmette-Guerin vaccination
        description: 'Live attenuated Mycobacterium bovis BCG, given routinely in most tuberculosis-endemic
          countries in the first days of life. In this disorder it is not a neutral exposure: it supplies
          the mycobacterium that the unarmed macrophage compartment cannot contain, and BCG disease is
          the commonest single mycobacterial manifestation. Several reported patients have asymptomatic
          homozygous siblings who were simply never vaccinated, which is the clearest available demonstration
          that this exposure gates the phenotype rather than merely accompanying it.'
        effect: Triggers local or disseminated mycobacterial disease in individuals who cannot activate
          macrophages through the interferon-gamma axis.
        notes: No ECTO exposure term is bound. ECTO was searched for a vaccination-exposure class covering
          administration of a live attenuated bacterial vaccine and none was found that names the exposure
          rather than the vaccine substance, so the entry is left with free text rather than a term chosen
          for the sake of having one.
      selected_evidence:
        snippet: Impaired responses to type I IFNs underlie severe viral diseases, including COVID-19
          pneumonia, influenza pneumonia, herpes simplex encephalitis, and adverse reactions to live attenuated
          vaccines.
        supports: SUPPORT
