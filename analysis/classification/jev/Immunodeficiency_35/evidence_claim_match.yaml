          term:
            id: CL:0000791
            label: mature alpha-beta T cell
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        - preferred_term: mucosal-associated invariant T cell
          term:
            id: CL:0000940
            label: mucosal-associated invariant T cell
        - preferred_term: gamma-delta T cell
          term:
            id: CL:0000798
            label: gamma-delta T cell
      selected_evidence:
        snippet: Impairment of the IL-23-dependent induction of IFN-γ is the only mechanism of mycobacterial
          disease common to patients with complete TYK2 deficiency with or without TYK2 expression, partial
          TYK2 deficiency across signaling pathways, or rare or common partial TYK2 deficiency specific
          for IL-23 signaling.
        supports: SUPPORT
