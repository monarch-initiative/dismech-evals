      assertion_type: Genetic
      assertion:
        name: TYK2
        association: Causal biallelic variant
        gene_term:
          preferred_term: TYK2
          term:
            id: hgnc:12440
            label: TYK2
        notes: 'Complete deficiency covers two of the five recognised forms of autosomal recessive TYK2
          deficiency: loss-of-expression alleles that abolish protein production, and rare alleles such
          as G1010D that leave a detectable but catalytically dead protein. The other three forms are
          partial and are not curated here. Reported complete-deficiency alleles include the nonsense
          changes c.745C>T (p.R249*) and c.3388C>T (p.Arg1130*), splice variants, and frameshifts; the
          reported alleles are private to individual families rather than recurrent.'
      selected_evidence:
        snippet: 'Complete TYK2 deficiency was first described in 2006 in a single patient, and five forms
          of AR TYK2 deficiency have now been described in 25 patients: (1) complete without and (2) with
          residual expression, (3) partial deficiency affecting all pathways, partial deficiency affecting
          specifically IL-23 signaling due to (4) rare and (5) common variants.'
        supports: SUPPORT
    origin:
