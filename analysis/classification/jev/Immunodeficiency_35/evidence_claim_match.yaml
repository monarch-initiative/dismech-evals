      assertion_type: Pathophysiology
      assertion:
        name: Impaired IL-10 Signaling
        biological_scale: CELLULAR
        description: 'IL-10R2 is TYK2-associated, so IL-10 responses are reduced alongside the others.
          No clinical consequence has been established for this branch: unlike IL-10 receptor deficiency,
          TYK2-deficient patients do not develop very-early-onset inflammatory bowel disease. It is curated
          as a node because it is a measured, reproducible part of the cellular phenotype and is used
          diagnostically, not because it is thought to cause disease; it therefore has no downstream edge.'
        biological_processes:
        - preferred_term: interleukin-10-mediated signaling pathway
          modifier: DECREASED
          term:
            id: GO:0140105
            label: interleukin-10-mediated signaling pathway
      selected_evidence:
        snippet: All eight TYK2-deficient patients displayed impaired but not abolished cellular responses
          to (a) IL-12 and IFN-α/β, accounting for mycobacterial and viral infections, respectively; (b)
          IL-23, with normal proportions of circulating IL-17(+) T cells, accounting for their apparent
          lack of mucocutaneous candidiasis; and (c) IL-10, with no overt clinical consequences, including
          a lack of inflammatory bowel disease.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
