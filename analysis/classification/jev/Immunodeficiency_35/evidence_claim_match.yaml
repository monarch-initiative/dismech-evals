      assertion_type: IUISAssignment
      assertion:
        classification_value: innate immunity defect
        notes: IUIS 2022 classification of inborn errors of immunity, Table 6 (defects in intrinsic and
          innate immunity), where Tyk2 deficiency sits among the Mendelian susceptibility to mycobacterial
          disease entities. The same table lists P1104A TYK2 homozygosity as a separate row with a narrower
          cellular defect and a narrower clinical phenotype, which is the nosological basis for confining
          this entry to complete deficiency. The table rows are not quoted as evidence; the P1104A distinction
          is evidenced from the primary TYK2 paper instead.
      selected_evidence:
        snippet: Cells homozygous for the common P1104A TYK2 allele have selectively impaired responses
          to IL-23 (underlying isolated mycobacterial disease).
        supports: SUPPORT
