  5d26eb22b0fdb866ef6f20a81e05f7a07527c8b7c323a8e9a14313f501601c3c:
    claim:
      about:
        disease:
          name: Immunodeficiency 35
          disease_term:
            preferred_term: immunodeficiency 35
            term:
              id: MONDO:0012682
              label: immunodeficiency 35
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Tyk2-deficient mouse
        species: Mouse
        genotype: Tyk2 null (germline knockout)
        publication: PMID:11070173
        description: 'Germline Tyk2 knockout mice, generated independently by two groups in 2000. They
          are viable and developmentally normal, and they reproduce the partial-signalling character of
          the human disorder rather than a complete block - which is the property that makes them informative
          and also the property that limits them. Where the mouse and the human diverge is IL-10 and IL-6:
          mouse responses to both are normal, whereas the human deficiency impairs IL-10 signalling, and
          the original human patient had an IL-6 defect as well.'
        modeled_mechanisms:
        - target: Impaired Type I Interferon Signaling
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'The mouse reproduces the partial, dose-dependent character of the human type I
            interferon defect: low-dose IFN-alpha fails to signal while high concentrations still transduce
            fully.'
          limitations: The residual signalling is more evident in the mouse than in patients, and the
            antiviral phenotype is elicited by high-dose experimental challenge with vaccinia and LCMV
            rather than by the herpesviruses and respiratory viruses that affect patients.
          readouts:
          - name: Vaccinia virus clearance and LCMV-specific T-cell response
            target: Impaired Type I Interferon Signaling
            direction: DECREASED
            interpretation: Functional antiviral consequence of the type I interferon signalling defect
              in the model.
        - target: Impaired IL-12 and IL-23 Signaling
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: IL-12-driven T-cell function is defective in the knockout, matching the IL-12 arm
            of the human lesion, and the macrophages fail an activation-dependent effector readout.
          limitations: The mouse experiments predate the recognition that IL-23-dependent interferon-gamma
            induction is the defect shared by all human forms, and they measure IL-12-driven T-cell function
            and nitric oxide production rather than IL-23-driven interferon-gamma output, so the specific
            human convergence point is not directly modelled.
          readouts:
          - name: IL-12-induced T-cell function
            target: Impaired IL-12 and IL-23 Signaling
            direction: DECREASED
            interpretation: The IL-12 signalling arm of the human lesion is present in the mouse.
          - name: Lipopolysaccharide-induced macrophage nitric oxide production
            target: Impaired IL-12 and IL-23 Signaling
            direction: DECREASED
            interpretation: A macrophage effector readout that fails downstream of the same signalling
              lesion.
        - target: Impaired IL-10 Signaling
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Tyk2-deficient mice respond normally to IL-10, whereas the IL-10 response is impaired
            in every human patient assayed. The mouse cannot be used to study this branch.
          limitations: 'The species difference is not a matter of degree: mouse IL-10 responses are reported
            as normal, so there is no defect in the model to characterise. The same holds for IL-6, where
            the mouse is normal and the human index patient was not. The original human report drew exactly
            this contrast, noting that the human requirement for TYK2 across cytokine pathways differs
            substantially from the mouse.'
      selected_evidence:
        snippet: These observations demonstrate that tyk2 plays only a restricted role in mediating IFNalpha-dependent
          signaling while being required in mediating IL-12-dependent biological responses.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11070174
      reference_title: Tyk2 plays a restricted role in IFN alpha signaling, although it is required for
        IL-12-mediated T cell function.
      evidence_source: MODEL_ORGANISM
      explanation: The summary of what this model does and does not establish about TYK2 pathway dependence.
