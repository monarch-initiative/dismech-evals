      assertion_type: Phenotype
      assertion:
        name: Elevated serum IgE with eczema
        category: Immunologic
        frequency: VERY_RARE
        description: The feature that gave the disorder its original name and that later work removed
          from it. The 2006 index patient had atopic dermatitis, high IgE and staphylococcal abscesses
          and was diagnosed clinically with hyper-IgE syndrome; none of the seven patients reported in
          2015 had any of this, and their cells responded normally to IL-6. Hyper-IgE syndrome is therefore
          not an intrinsic feature of TYK2 deficiency, and this phenotype is curated only to record that
          the historical label was wrong.
        phenotype_term:
          preferred_term: Increased circulating IgE concentration
          term:
            id: HP:0003212
            label: Increased circulating IgE concentration
      selected_evidence:
        snippet: Autosomal recessive, complete TYK2 deficiency was previously described in a patient (P1)
          with intracellular bacterial and viral infections and features of hyper-IgE syndrome (HIES),
          including atopic dermatitis, high serum IgE levels, and staphylococcal abscesses.
