  1b123333257fcd6886554d1b1e7a7f4e6301ac9c1f9143f5ba366b065257fd83:
    claim:
      about:
        disease:
          name: Immunodeficiency 35
          disease_term:
            preferred_term: immunodeficiency 35
            term:
              id: MONDO:0012682
              label: immunodeficiency 35
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: TYK2 P1104A homozygosity
        description: The same gene, a different entity. P1104A is a common hypomorphic missense allele
          - homozygous in roughly one in six hundred Europeans - that is catalytically dead but docks
          and scaffolds normally, and that selectively disrupts IL-23 signalling while sparing IFN-alpha,
          IL-10 and IL-12. Its clinical expression is tuberculosis, and more rarely mycobacterial disease,
          without viral disease. The IUIS nosology lists it as a separate entity from Tyk2 deficiency.
          It is the differential that matters most here, because a literature search on TYK2 returns far
          more on this allele than on complete deficiency.
        distinguishing_features:
        - Normal cellular responses to IFN-alpha, IL-10 and IL-12, with only IL-23 impaired
        - Normal TYK2 scaffolding of IFN-alphaR1, IL-12Rbeta1 and IL-10R2
        - Tuberculosis rather than viral disease as the clinical expression
        - Allele frequency in the general population, not a private family variant
      selected_evidence:
        snippet: Surprisingly, we also show that TYK2 P1104A impairs cellular responses to IL-23, but
          not to IFN-α, IL-10, or even IL-12, which, like IL-23, induces IFN-γ via activation of TYK2
          and JAK2.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30578352
      reference_title: Tuberculosis and impaired IL-23-dependent IFN-γ immunity in humans homozygous for
        a common TYK2 missense variant.
      evidence_source: IN_VITRO
      explanation: 'The cellular measurement that separates the two entities: three of the four TYK2-dependent
        responses are preserved in P1104A homozygotes.'
