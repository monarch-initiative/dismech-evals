        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tyk2_penetrance_determinants
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether a person homozygous for a TYK2 null allele develops mycobacterial
          disease, viral disease, both, or nothing at all?
        attaches_to:
        - phenotypes#Mycobacterial disease
        - phenotypes#Severe or recurrent viral infection
        rationale: Penetrance is incomplete for both defining phenotypes - roughly half of patients develop
          mycobacterial disease and three-fifths viral disease - and asymptomatic homozygous adults are
          on record, including siblings of severely affected probands. Exposure explains part of it, since
          several asymptomatic homozygotes were never given BCG and BCG disease is the commonest mycobacterial
          presentation, and the environmental link curated here records that. It does not explain the
          viral arm, where exposure to herpesviruses and respiratory viruses is effectively universal
          and yet two of five siblings in one family had hypoxaemic COVID-19 pneumonia while another was
          asymptomatic after infection. No modifier has been identified, and with twenty-five reported
          patients there is no cohort in which one could be sought.
      selected_evidence:
        snippet: Incomplete clinical penetrance has been observed for mycobacterial and viral diseases,
          as 48% and 60% of patients, respectively, develop these diseases.
        supports: SUPPORT
