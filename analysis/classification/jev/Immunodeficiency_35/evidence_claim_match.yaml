              id: MONDO:0012682
              label: immunodeficiency 35
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tyk2_complete_vs_hypomorph_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Where does complete TYK2 deficiency end and partial TYK2 deficiency begin, given that
          the mechanism now held to explain mycobacterial disease is shared by both?
        attaches_to:
        - genetic#TYK2
        - pathophysiology#Deficient Interferon-Gamma Induction in Lymphocytes
        rationale: 'The 2022 analysis showed that impaired IL-23-dependent interferon-gamma induction
          is the only mechanism of mycobacterial disease common to all five forms of autosomal recessive
          TYK2 deficiency, from complete loss of expression through to homozygosity for the common P1104A
          allele. That result is what makes the boundary awkward. For the mycobacterial phenotype the
          two ends of the spectrum are mechanistically continuous, and the reasons for keeping them apart
          are that complete deficiency additionally loses type I interferon, IL-12 and IL-10 signalling
          and the scaffolding function, and that only complete deficiency produces viral disease. Those
          are real differences and the IUIS nosology encodes them as separate entities, so this entry
          is confined to complete deficiency. But the line is drawn on the extra pathways, not on the
          mechanism the two share, and no study has tested whether the mycobacterial disease seen in a
          complete-deficiency patient differs in kind from that seen in a P1104A homozygote once exposure
          is matched. Until it does, the question of whether these should be one graded entity or two
          is open, and this entry records that rather than settling it. Note also that the intermediate
          forms complicate any purely genetic rule: G1010D produces a detectable protein that is nonetheless
          loss-of-function across all pathways and is counted as complete deficiency, while R864C produces
          a hypomorph that is not.'
      selected_evidence:
        snippet: Impairment of the IL-23-dependent induction of IFN-γ is the only mechanism of mycobacterial
          disease common to patients with complete TYK2 deficiency with or without TYK2 expression, partial
          TYK2 deficiency across signaling pathways, or rare or common partial TYK2 deficiency specific
          for IL-23 signaling.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in
        patients with inherited TYK2 deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The result that makes the boundary a genuine question: one mechanism spans the whole
        spectrum.'
