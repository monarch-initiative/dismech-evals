      assertion_type: Pathophysiology
      assertion:
        name: Deficient Interferon-Gamma Induction in Lymphocytes
        biological_scale: CELLULAR
        description: 'Peripheral blood mononuclear cells from patients make less interferon-gamma when
          stimulated with IL-12 or IL-23. This is the convergence point of the mycobacterial branch: the
          2022 analysis showed that impaired IL-23-dependent interferon-gamma induction is the single
          defect shared by every form of TYK2 deficiency that causes mycobacterial disease, whether the
          protein is absent, present but catalytically dead, or merely hypomorphic. In complete deficiency
          the IL-12-dependent arm fails as well, and the additional loss is associated with more severe
          mycobacterial disease.'
        biological_processes:
        - preferred_term: positive regulation of interferon-gamma production
          modifier: DECREASED
          term:
            id: GO:0032729
            label: positive regulation of type II interferon production
        cell_types:
