              label: immunodeficiency 35
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of TYK2 Kinase Activity
        biological_scale: MOLECULAR
        description: TYK2 is a non-receptor tyrosine kinase that pairs with JAK1 or JAK2 on the receptors
          for type I interferons, IL-12, IL-23 and IL-10 and phosphorylates the receptor and the STATs
          recruited to it. In complete deficiency that catalytic activity is gone, whether because no
          protein is made or because the protein made cannot phosphorylate. The consequences are pathway-shared
          rather than pathway-specific, which is why one gene defect produces two otherwise unrelated
          infectious susceptibilities.
        molecular_functions:
        - preferred_term: tyrosine kinase 2 catalytic activity
          modifier: ABSENT
          term:
            id: GO:0004715
            label: non-membrane spanning protein tyrosine kinase activity
      selected_evidence:
        snippet: The patient's cells displayed defects in multiple cytokine signaling pathways including
          those for type I interferon (IFN), interleukin (IL)-6, IL-10, IL-12, and IL-23.
        supports: SUPPORT
