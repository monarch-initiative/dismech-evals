          disease_term:
            preferred_term: immunodeficiency 35
            term:
              id: MONDO:0012682
              label: immunodeficiency 35
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Interleukin-12 receptor beta-1 deficiency
        description: The commonest genetic cause of Mendelian susceptibility to mycobacterial disease
          and the closest phenocopy of the mycobacterial arm of this disorder. IL-12Rbeta1 is the receptor
          chain TYK2 sits on, so both defects impair IL-12- and IL-23-driven interferon-gamma production
          - but in IL-12Rbeta1 deficiency that production is abolished rather than reduced, and type I
          interferon signalling is intact, so there is no viral susceptibility.
        distinguishing_features:
        - Interferon-gamma production abolished rather than impaired
        - Intact type I interferon responses and no severe viral disease
        - Biallelic IL12RB1 rather than TYK2 variants
      selected_evidence:
        snippet: whereas IL-12– and IL-23–mediated IFN-γ production was completely abolished in the IL-12Rβ1–deficient
          patient.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36094518
      reference_title: Impaired IL-23-dependent induction of IFN-γ underlies mycobacterial disease in
        patients with inherited TYK2 deficiency.
      evidence_source: IN_VITRO
      explanation: Contrasts the abolished production in IL-12Rbeta1 deficiency with the merely impaired
        production in TYK2 deficiency, measured side by side.
