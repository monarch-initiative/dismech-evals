      assertion_type: DifferentialDiagnosis
      assertion:
        name: Chronic granulomatous disease
        description: The disorder TYK2 deficiency is most often mistaken for in practice, because both
          present with granulomatous disease after BCG in an infant. The discriminator is the phagocyte
          oxidative burst, which is normal here and absent in chronic granulomatous disease.
        distinguishing_features:
        - Normal neutrophil oxidative burst on dihydrorhodamine or nitroblue tetrazolium testing
        - Viral as well as mycobacterial susceptibility
      selected_evidence:
        snippet: Clinical overlap with chronic granulomatous disease (CGD) and other granulomatous disorders
          complicates diagnosis, particularly in nations where universal BCG vaccination is instituted.
        supports: SUPPORT
