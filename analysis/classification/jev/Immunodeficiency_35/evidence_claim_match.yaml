      assertion:
        name: Phospho-STAT response to IFN-alpha, IL-10, IL-12 and IL-23
        description: Functional testing of patient cells for STAT phosphorylation and downstream responses
          after stimulation with each TYK2-dependent cytokine. This is the assay that separates complete
          deficiency, in which all four responses are impaired, from the partial forms in which only IL-23
          signalling is affected - a distinction sequencing alone cannot make for a missense allele.
        results: Impaired but not abolished responses to IFN-alpha/beta, IL-12, IL-23 and IL-10, with
          normal responses to IFN-gamma, IFN-lambda, IL-21, IL-27 and LIF.
        diagnosis_term:
          preferred_term: flow cytometry
          term:
            id: NCIT:C16585
            label: Flow Cytometry
      selected_evidence:
        snippet: All eight TYK2-deficient patients displayed impaired but not abolished cellular responses
          to (a) IL-12 and IFN-α/β, accounting for mycobacterial and viral infections, respectively; (b)
          IL-23, with normal proportions of circulating IL-17(+) T cells, accounting for their apparent
          lack of mucocutaneous candidiasis; and (c) IL-10, with no overt clinical consequences, including
          a lack of inflammatory bowel disease.
        supports: SUPPORT
