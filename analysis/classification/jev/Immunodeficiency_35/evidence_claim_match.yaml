              label: immunodeficiency 35
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_tyk2_type_iii_interferon
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does type III interferon signalling actually require TYK2 in human cells, and if it does
          so only in some cell types, what does that mean for the antiviral phenotype of complete TYK2
          deficiency?
        attaches_to:
        - pathophysiology#Impaired Type I Interferon Signaling
        rationale: 'TYK2 is constitutively associated with IL-10R2, one of the two chains of the type
          III interferon receptor, so on the receptor architecture alone IFN-lambda signalling ought to
          fail in complete deficiency. The 2015 patient series found responses to IL-28/IL-29 normal,
          and this entry follows that in confining the antiviral lesion to type I interferon. But the
          cell-line evidence does not agree with itself: SV40-transformed fibroblasts from patients with
          complete TYK2 deficiency respond very weakly to type III interferon while their EBV-transformed
          B cells respond normally, and a TYK2-knockout HAP1 line responds normally to IFN-lambda1. The
          result is therefore cell-type-dependent, and every observation on either side comes from a transformed
          line rather than from a primary cell or a clinical outcome. Whether the discrepancy reflects
          real tissue-specific redundancy - with JAK1, or with the JAK2 phosphorylation that type III
          but not type I interferons trigger, taking over - or an artefact of transformation is unresolved.
          It matters because the epithelial surfaces where type III interferon does most of its work are
          exactly the surfaces on which these patients get their respiratory viral disease, and no patient-derived
          epithelial system has been tested.'
      selected_evidence:
        snippet: By contrast, for complete TYK2 deficiency, SV40-transformed fibroblasts have very weak
          responses, whereas EBV-B cells respond normally
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38781720
      reference_title: 'In search of a function for human type III interferons: insights from inherited
        and acquired deficits.'
      evidence_source: IN_VITRO
      explanation: The cell-type discrepancy itself, measured in two transformed lines from patients with
        complete deficiency.
