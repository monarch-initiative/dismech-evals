      assertion:
        name: BCL10
        gene_term:
          preferred_term: BCL10
          term:
            id: hgnc:989
            label: BCL10
        relationship_type: CAUSATIVE
        presence: PRESENT
        variant_origin: GERMLINE
        notes: Reported alleles are a splice-site change (IVS1+1G>A), two nonsense changes (K63X, R88X)
          and two missense changes (T91P, R42H), plus a later linker-region frameshift (p.Gly116GlufsTer3).
          The first five all fall in the CARD domain, which is the protein-protein interaction surface
          that nucleates the CBM filament, so the genotype-phenotype story is about the assembly interface
          rather than about protein dosage.
      selected_evidence:
        snippet: BCL10 is a 233 amino acid intracellular signaling protein characterized by an amino-terminal
          CARD motif and a Ser/Thr-rich carboxyl terminus of unknown function [27,28].
        supports: SUPPORT
