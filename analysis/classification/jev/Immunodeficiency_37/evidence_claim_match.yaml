        description: The diagnostic trap. Total T and B cell counts are normal, so quantitative immunophenotyping
          reads as reassuring; the abnormality appears only in memory subset proportions, immunoglobulin
          levels, and proliferation on stimulation. One patient passed newborn SCID screening and presented
          at five months with fatal disseminated infection.
