              label: immunodeficiency 37
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd37_mouse_neural_tube_defect_absent_in_humans
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - animal_models#Bcl10-null mouse
        - pathophysiology#CBM Signalosome Assembly Failure
        prompt: Why does Bcl10 loss cause a neural tube closure defect in mouse but not, apparently, in
          humans?
        rationale: 'A third of Bcl10-null mouse embryos develop exencephaly and die of it. Nothing like
          that has been described in any reported human patient, all of whom had complete or near-complete
          deficiency and survived to present with infection. Three explanations are open and nothing distinguishes
          them: BCL10 may simply have no non-redundant role in human neural tube closure; the human alleles
          may retain enough residual function for closure while failing for lymphocyte activation; or
          human embryos with the same defect may be lost before ascertainment, since every reported family
          came to attention through a surviving affected child. The third possibility matters for counselling
          and is unaddressed. It also bears on the fibroblast finding: a developmental role for BCL10
          outside the haematopoietic system would fit the non-haematopoietic defect this entry records.'
      selected_evidence:
        snippet: We show that one-third of bcl10-/- embryos developed exencephaly, leading to embryonic
          lethality.
        supports: SUPPORT
