      assertion:
        name: Arrest of T-Lineage Commitment and Development
        biological_scale: CELLULAR
        description: 'BCL11B is induced by Notch signalling and commits progenitors to the T lineage.
          Knockdown of BCL11B, or expression of the dominant-negative p.N441K allele, abrogates T-cell
          development from human hematopoietic stem cells without affecting B-cell development, and bcl11ba
          knockdown blocks T-progenitor development in zebrafish; this is the basis of the T-B+NK+ SCID
          phenotype.

          '
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: double negative thymocyte
          term:
            id: CL:0002489
            label: double negative thymocyte
        biological_processes:
        - preferred_term: T cell differentiation in thymus
          term:
            id: GO:0033077
            label: T cell differentiation in thymus
          modifier: DECREASED
      selected_evidence:
        snippet: Moreover, BCL11B played a critical role in the development of human T-cell progenitors,
          in that their development, but not that of B cells, was impaired by knockdown of BCL11B with
          the use of siRNA (Fig. 2C and 2D); moreover, ectopic expression of the patient’s mutant construct
          also abrogated T-cell development, which suggested a dominant negative effect.
        supports: SUPPORT
