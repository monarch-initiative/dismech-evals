      assertion:
        name: Dominant-Negative BCL11B Zinc-Finger Missense Variant
        biological_scale: MOLECULAR
        genetic_context:
          allele_type: MISSENSE
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
        description: 'A missense substitution at a DNA-contacting residue of a BCL11B zinc finger (p.N441K
          in the index IMD49 patient). The mutant protein heterodimerizes with wild-type BCL11B on stimulation,
          the heterodimer fails to bind canonical target sites, and the mutant also binds a novel site
          in TACC1, so the allele both removes wild-type function and redirects binding.

          '
        genes:
        - preferred_term: BCL11B
          term:
            id: hgnc:13222
            label: BCL11B
        molecular_functions:
        - preferred_term: sequence-specific DNA binding
          term:
            id: GO:0043565
            label: sequence-specific DNA binding
          modifier: DECREASED
      selected_evidence:
        snippet: The resulting BCL11B protein had dominant negative activity, which abrogated the ability
          of wild-type BCL11B to bind DNA, thereby arresting development of the T-cell lineage and disrupting
          hematopoietic stem-cell migration; this revealed a previously unknown function of BCL11B.
        supports: SUPPORT
