          Th2 differentiation, which has not been demonstrated in patient cells. It is not explained by
          ILC2s, which normally drive type 2 inflammation but are reduced in these patients; the Lessel
          cohort authors suggest that exacerbated Th2 immunity together with the lack of ILC2-mediated
          epithelial repair may contribute to asthma.

          '
        biological_processes:
