          term:
            id: GO:0045064
            label: T-helper 2 cell differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: In agreement with the previously reported repressive function of BCL11B on Th2 differentiation
          (Califano et al., 2014), exacerbated Th2 responses were clinically recognized in five patients,
          including two with asthma (Table 1 and Supplementary Table 2).
        supports: SUPPORT
