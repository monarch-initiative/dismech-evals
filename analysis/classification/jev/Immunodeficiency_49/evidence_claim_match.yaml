  36e4a458c38703e579385281cf49f1696882fb8464ccfdbc24c711e2eaacf75a:
    claim:
      about:
        disease:
          name: Immunodeficiency 49
          disease_term:
            preferred_term: immunodeficiency 49
            term:
              id: MONDO:0014981
              label: immunodeficiency 49
        context: []
      assertion_type: Genetic
      assertion:
        name: BCL11B
        gene_term:
          preferred_term: BCL11B
          term:
            id: hgnc:13222
            label: BCL11B
        association: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Heterozygous germline variants. The SCID presentation is associated with a missense
          variant (p.N441K) at a DNA-contacting residue of zinc finger 2 that acts as a dominant negative;
          a second zinc-finger DNA-recognition missense (p.N807K, zinc finger 4) gave the most severe
          phenotype of the first IDDSFTA cohort. Frameshift and nonsense variants (most in the last exon,
          predicted to escape nonsense-mediated decay and to delete the C-terminal zinc fingers), balanced
          translocations that separate BCL11B from its enhancers and halve its expression, and 14q32.2
          deletions give the neurodevelopmental presentation. An N-terminal missense (p.R3S) that weakens
          binding to the NuRD and PRC2 complexes was found in isolated coronal craniosynostosis.

          '
      selected_evidence:
        snippet: Using massively parallel sequencing we identified 13 patients bearing heterozygous germline
          alterations in BCL11B.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
