      assertion:
        hypothesis_group_id: mtec_central_tolerance_autoimmunity
        hypothesis_label: Organ autoimmunity from defective mTEC-dependent central tolerance
        status: ALTERNATIVE
        description: 'The liver, lung and skin autoimmunity of partial RelB deficiency arises from the
          same thymic stromal defect that causes anti-type I IFN autoantibodies: too few AIRE-expressing
          mTECs to delete organ-reactive T cells. The supporting argument is resemblance to mice lacking
          Relb only in mTECs.'
      selected_evidence:
        snippet: By contrast, the liver, lung, and skin-related autoimmunity reported in two patients
          with AR partial RelB deficiency (25) closely mimics the T cell infiltration of organs in mice
          with a conditional Relb-KO in mTECs (67), providing additional evidence for the mTEC-intrinsic
          essential role of human RelB in central tolerance.
        supports: SUPPORT
        directness: INDIRECT
