        prompt: Why does germline Relb loss cause lethal multiorgan inflammation in mice but only anti-type
          I IFN autoantibodies in human complete deficiency?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#Organ-Infiltrating Autoimmunity
        rationale: The mouse knockout is the main experimental basis for RelB's role in tolerance and
          inflammation, but its autoimmune phenotype is far more severe than the human one. Mouse findings
          about inflammation should not be transferred to patients without human data.
      selected_evidence:
        snippet: The autoimmune phenotype observed in P1 and P2, restricted to the development of auto-Abs
          against type I IFNs, sharply contrasts with that of Relb-KO mice, which die from overwhelming
          T lymphocyte-dependent multiple-organ inflammation at the age of 2 to 6 wk
        supports: SUPPORT
