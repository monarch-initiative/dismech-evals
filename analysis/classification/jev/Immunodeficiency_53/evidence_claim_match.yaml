          as an exaggerated response rather than the infection alone. No HPO term for non-infectious bronchiolitis
          exists (HP:0011950 is now Unusual bronchiolitis, an infection-susceptibility term), so the histology
          is recorded here and on the organ-autoimmunity node rather than as its own phenotype. It has
          no incoming edge on purpose: it is a single isolate, and the authors do not attribute it to
          a specific immune defect.'
