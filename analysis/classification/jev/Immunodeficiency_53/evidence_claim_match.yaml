      assertion_type: Pathophysiology
      assertion:
        name: Organ-Infiltrating Autoimmunity
        description: In the two older of three siblings homozygous for P364L, chronic hepatitis with portal
          fibrosis (with sclerosing cholangitis in one), autoimmune enteritis with villous atrophy, inflammatory
          lung disease and T cell and plasma cell skin infiltrates progressed through the second decade.
          The youngest sibling, aged 4, has had only one severe infection so far. The resected lung lobe
          also grew Mycobacterium tuberculosis, and the authors describe the lung lesion as an exaggerated
          inflammatory response rather than calling it autoimmune. Organ autoimmunity has not been reported
          in the complete-deficiency patients or in P2, whose autoimmunity is limited to anti-type I IFN
          autoantibodies.
        biological_scale: TISSUE
      selected_evidence:
        snippet: Patients presented with multiple autoimmune progressive severe manifestations encompassing
          the liver, gut, lung, and skin, becoming debilitating in the second decade of life.
        supports: SUPPORT
