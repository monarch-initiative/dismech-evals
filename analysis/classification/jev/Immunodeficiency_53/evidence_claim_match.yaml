      assertion_type: Pathophysiology
      assertion:
        name: Biallelic RELB Loss of Function
        description: Biallelic RELB variants either abolish RelB protein (the Q72fs frameshift and Y397*
          nonsense alleles are amorphic) or encode a protein with strongly reduced transcriptional activity
          (Q135dup, E145K, P364L are hypomorphic). The P364L protein is also unstable and expressed at
          very low levels.
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: RelB DNA-binding transcription factor activity
          modifier: DECREASED
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        genes:
        - preferred_term: RELB
          term:
            id: hgnc:9956
            label: RELB
      selected_evidence:
        snippet: These data suggest that Q72fs and Y397* are amorphic, whereas Q135dup, P364L, and E145K,
          are strongly hypomorphic.
        supports: SUPPORT
