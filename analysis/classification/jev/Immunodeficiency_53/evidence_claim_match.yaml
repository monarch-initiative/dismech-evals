              label: immunodeficiency 53
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: relb_organ_autoimmunity_mechanism
        prompt: Is the organ autoimmunity of partial RelB deficiency caused by the thymic stromal tolerance
          defect, by loss of RelB restraint on RelA, or both?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Organ-Infiltrating Autoimmunity
        - mechanistic_hypotheses#mtec_central_tolerance_autoimmunity
        - mechanistic_hypotheses#rela_derepression_autoimmunity
        rationale: Sharfe et al. (2022) attribute the autoimmunity to RelA derepression measured in fibroblasts.
          Le Voyer et al. (2024) attribute it to the mTEC defect, by analogy with mTEC-specific Relb knockout
          mice. Neither was tested in the patients' T cells or tissues. The two hypotheses also leave
          open why complete deficiency spares the organs. A thymic account predicts that organ autoimmunity
          persists after HSCT; a hematopoietic RelA account predicts it resolves. No partial-deficiency
          patient with organ autoimmunity has been transplanted.
      selected_evidence:
        snippet: It would therefore be interesting to determine whether this procedure can also correct
          organ-related autoimmunity in patients with AR partial RelB deficiency.
        supports: SUPPORT
