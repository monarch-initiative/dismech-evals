          mTECs fails. This is a stromal defect, so hematopoietic stem cell transplantation does not correct
          it.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: medullary thymic epithelial cell
          term:
            id: CL:0002365
            label: medullary thymic epithelial cell
        biological_processes:
        - preferred_term: thymus development
          modifier: DECREASED
          term:
            id: GO:0048538
            label: thymus development
      selected_evidence:
        snippet: These findings suggest that RELB deficiency does not completely block mTEC specification
          but, rather, prevents differentiation into AIRE-expressing and post-AIRE mTECs.
        supports: SUPPORT
