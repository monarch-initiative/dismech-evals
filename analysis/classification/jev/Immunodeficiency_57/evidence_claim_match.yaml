        - path: /pathophysiology/0
          value:
            name: RIPK1 Loss of Function
            biological_scale: MOLECULAR
            description: Biallelic loss-of-function variants abolish RIPK1 protein. RIPK1 is a 75.9 kDa
              protein with an N-terminal kinase domain, a C-terminal death domain and an intermediate
              domain carrying a RIP homotypic interaction motif, and it is recruited with TRADD to TNFR1
              to form signalling complex I. Because the protein carries both a scaffolding role and a
              kinase role, its complete absence removes two opposing functions simultaneously, which is
              why the resulting disease is not simply a loss of inflammation or a gain of it.
            genes:
            - preferred_term: RIPK1
              term:
                id: hgnc:10019
                label: RIPK1
            genetic_context:
              variant_origin: GERMLINE
              zygosity: HOMOZYGOUS
              functional_impact_category: LOSS_OF_FUNCTION
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired NF-kappaB and MAPK Signalling
        causal_link_type: DIRECT
        description: RIPK1 is a component of complex I, whose ubiquitination provides the docking platform
          for the kinases that activate NF-kappaB and MAPK. Without RIPK1 that platform is not assembled.
      selected_evidence:
        snippet: Mutations in RIPK1 were associated with reduced NF-κB activity, defective differentiation
          of T and B cells, increased inflammasome activity, and impaired response to TNFR1-mediated cell
          death in intestinal epithelial cells.
        supports: SUPPORT
    origin:
