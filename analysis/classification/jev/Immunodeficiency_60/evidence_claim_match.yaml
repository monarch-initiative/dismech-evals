      assertion_type: Pathophysiology
      assertion:
        name: BACH2 Haploinsufficiency
        biological_scale: MOLECULAR
        description: 'Loss of one functional BACH2 allele leaves insufficient BACH2 protein to specify
          lymphocyte lineage decisions. IUIS characterises the defect as haploinsufficiency for a critical
          lineage specification transcription factor, which is a dosage statement rather than a dominant-negative
          one: the residual wild-type allele is not poisoned, it is simply not enough. BACH2 is required
          in both lymphoid lineages, which is why one dosage lesion produces a T-cell and a B-cell defect
          at once.'
        molecular_functions:
        - preferred_term: BACH2 transcriptional repressor activity
          term:
            id: GO:0001227
            label: DNA-binding transcription repressor activity, RNA polymerase II-specific
          modifier: DECREASED
      selected_evidence:
        snippet: BACH2 is highly expressed on B cells, suppresses the production of immunoglobulins
        supports: SUPPORT
        directness: INDIRECT
