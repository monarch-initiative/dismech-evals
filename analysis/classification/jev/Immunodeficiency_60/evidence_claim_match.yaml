      assertion_type: HistopathologyFinding
      assertion:
        name: Chronic colitis with crypt branching and pericryptal lymphocytic infiltrate
        description: 'The colonic biopsy in the index patient shows chronic architectural change - crypt
          branching - together with lymphocytes massed around the crypts, and a Treg population that is
          reduced relative both to healthy controls and to patients with ordinary inflammatory bowel disease.
          That last comparison is what makes the biopsy mechanistically informative rather than merely
          confirmatory: the Treg deficit is not a generic consequence of colonic inflammation, so it points
          at the regulatory T-cell failure as the cause of the colitis rather than its result.'
        diagnostic: false
        notes: No finding_term is bound. HP has no term for crypt architectural distortion or a pericryptal
          lymphocytic infiltrate, and NCIT's Crypt-prefixed terms are all Cryptococcus, cryptochrome or
          cryptorchidism - none of them this finding. Searched both before leaving it unbound rather than
          binding an approximate term.
      selected_evidence:
        snippet: with significantly reduced FoxP3+ regulatory T (Treg) cells compared with healthy controls
          or patients with classical IBD
        supports: SUPPORT
