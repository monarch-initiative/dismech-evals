  75bd48d96830ac7f3fa8a2e0cc26dd2d3fa8b84742c59c08814b72a49752ec66:
    claim:
      about:
        disease:
          name: Immunodeficiency 60
          disease_term:
            preferred_term: immunodeficiency 60
            term:
              id: MONDO:0032723
              label: immunodeficiency 60
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Memory B Cell Development
        biological_scale: CELLULAR
        description: 'The B-cell arm of the defect. IUIS records impaired memory B-cell development as
          the circulating B-cell finding in BACH2 deficiency. Mechanistically BACH2 sits upstream of the
          memory-versus-plasma-cell decision: in normal human memory B cells, differentiation to plasma
          cells is driven by PRDM1/BLIMP1 induction with reciprocal downregulation of BACH2, so BACH2
          is the repressor that holds the memory programme open. Insufficient BACH2 leaves that programme
          unable to be established, and the memory B-cell compartment that supplies durable mucosal and
          respiratory antibody does not accumulate.

          The founding report''s full text resolves how far the defect goes, which earlier versions of
          this entry left open. The loss in patients is not only of memory B cells but specifically of
          class-switched ones, and activating patient naive B cells in vitro reproduces the failure directly:
          class-switch recombination, plasmablast generation and class-switched antibody secretion are
          all impaired. Isotype switching is therefore annotated here as a patient-level defect rather
          than a mouse inference.'
        cell_types:
        - preferred_term: memory B cell
          term:
            id: CL:0000787
            label: memory B cell
        - preferred_term: IgG class-switched memory B cell
          term:
            id: CL:0000979
            label: IgG memory B cell
        biological_processes:
        - preferred_term: memory B cell differentiation
          term:
            id: GO:0002319
            label: memory B cell differentiation
          modifier: DECREASED
        - preferred_term: immunoglobulin class switch recombination
          term:
            id: GO:0045190
            label: isotype switching
          modifier: DECREASED
      selected_evidence:
        snippet: Impaired memory B cell development
        supports: SUPPORT
