  47a0cf4d3e67bb2b286da816dd2a4a85e8f1933178b5701c19a99133631cca4b:
    claim:
      about:
        disease:
          name: Immunodeficiency 60
          disease_term:
            preferred_term: immunodeficiency 60
            term:
              id: MONDO:0032723
              label: immunodeficiency 60
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bach2_imd60_humoral_phenotype_uncurated
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Memory B Cell Development
        - phenotypes#Recurrent sinopulmonary infections
        prompt: Which immunoglobulin isotypes fall in immunodeficiency 60, by how much, and does the picture
          meet criteria for common variable immunodeficiency?
        rationale: 'Two of the three parts are now answered from the founding report''s full text, and
          the third is not.

          Which isotypes: not the same ones in every patient. Two founding subjects were low in IgM, IgG,
          IgA and IgE together; the third, carrying the same E788K allele as her affected father, had
          low IgA against raised IgM and IgG. IgA is the only isotype low in all three, and a further
          family carrying R576L was also IgA deficient. The pattern therefore does not track the variant,
          which rules out the simplest reading - that each allele produces its own humoral picture - and
          leaves modifiers, age or ascertainment as the explanation. All of this is now curated: the isotype
          spread on the Immunoglobulin deficiency phenotype, IgA separately as the consistent one.

          CVID criteria: the authors state that all three subjects developed "a chronic variable immunodeficiency"
          characterised by recurrent respiratory infection with failure to respond to vaccination, and
          the vaccine-response failure is curated as its own phenotype. That is the authors'' characterisation
          rather than a formal application of ESID or ICON diagnostic criteria, and this entry does not
          upgrade it into one. The separate question of whether the disorder belongs with the antibody
          deficiencies at all is tracked in the IUIS-versus-ClinGen discussion below.

          By how much: still open, and now for a specific and probably permanent reason. The immunoglobulin
          concentrations are reported in Supplementary Table 1, which is not part of the article record
          served by PMC, so no accessible source gives a value. Table 1 of the main article gives only
          Low, Normal or High per isotype. Until a further family is reported with values in the main
          text, this entry can record the direction of each isotype but not its magnitude, and cannot
          carry reference ranges for the humoral phenotype.

          The plasmablast and class-switch assay results named in the original version of this gap are
          no longer missing and are curated on the memory B-cell node.'
      selected_evidence:
        snippet: '| IgG | Low | Low | High * |'
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28530713
      reference_title: BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Table 1, the IgG row. It is the sharpest statement of the non-uniformity: the third
        subject''s IgG is not merely normal but raised, which is why this entry does not describe BRIDA
        as a hypogammaglobulinemia.'
