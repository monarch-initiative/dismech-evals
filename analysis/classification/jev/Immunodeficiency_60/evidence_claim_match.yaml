        - path: /animal_models/0
          value:
            name: Bach2-heterozygous mouse (BRIDA report)
            species: Mouse
            genotype: Bach2 heterozygous (Bach2+/-)
            publication: PMID:28530713
            description: The dose-matched model. Because BRIDA is a haploinsufficiency, a heterozygous
              mouse rather than a knockout is the construct that reproduces the human genetic state, and
              the founding report shows it produces analogous lymphocyte defects.
            notes: 'Same line as the three model entries below, and no longer an open question: the founding
              report''s methods state that its Bach2 animals "were generated and housed as previously
              described", citing the study curated here as PMID:23728300. So this heterozygote and the
              heterozygote in that study are one line, characterized twice. They are two experiments and
              not two independent observations of the line - do not count them as replication of each
              other.'
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: BACH2 Haploinsufficiency
            relationship: RECAPITULATES
            fidelity: HIGH
            description: Heterozygous loss in mouse reproduces the molecular state of heterozygous loss
              in humans - reduced Bach2 message and protein with de-repressed Prdm1 - which is what licenses
              reading mouse Bach2 dosage biology onto this disorder.
            limitations: 'The mouse is normal until it is challenged. Bulk CD4+, CD8+, B-cell and plasma-cell
              numbers are unchanged in unimmunized animals, whereas the patients have a progressive T-cell
              lymphopenia, so the heterozygote does not model the resting human phenotype and its informative
              readouts all come from immunization or from subset gating rather than from counts.

              Keeping the dose-match versus dose-dependence distinction this entry draws: dose match is
              a property of the construct, and every heterozygote here has it by construction. Dose dependence
              is a demonstrated graded response, and it needs a genotype comparison. This model now has
              both - the full text compares Bach2+/- against wild-type for message, protein, Prdm1, and
              the immunization readouts - which is why the fidelity here is HIGH rather than the MODERATE
              that the abstract-only record supported.'
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Bach2 message and protein in heterozygous animals
        target: BACH2 Haploinsufficiency
        direction: DECREASED
        interpretation: The gene-dosage lesion itself, confirmed at both message and protein level.
      selected_evidence:
        snippet: We found that Bach2+/− mice manifest reduced Bach2 mRNA (Fig. 6a) and protein expression
          (Fig. 6b) together with elevated Prdm1 mRNA
        supports: SUPPORT
