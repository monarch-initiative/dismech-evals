          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Memory B Cell Development
        relationship: RECAPITULATES
        fidelity: HIGH
        description: 'On immunization the heterozygote fails at exactly the step the patients fail at:
          it barely generates class-switched B cells or plasma cells, and its germinal centers are reduced.
          This is the dose-matched counterpart of the patients'' impaired in vitro class switching, and
          it is the readout that most directly connects halving BACH2 to the humoral phenotype.'
        limitations: Requires deliberate immunization to appear; unchallenged heterozygotes have normal
          B-cell and plasma-cell numbers. The readout is also a single model antigen (NP-CGG in alum),
          so it speaks to the T-dependent IgG response and not to the mucosal IgA arm that dominates the
          patients' isotype pattern.
        readouts:
        - name: Class-switched B cells and plasma cells after immunization
          target: Impaired Memory B Cell Development
          direction: DECREASED
          interpretation: The class-switch and terminal-differentiation failure at matched gene dosage.
        - name: Germinal center B cell proportion after immunization
          target: Impaired Memory B Cell Development
          direction: DECREASED
          interpretation: Locates part of the failure upstream of switching, in the germinal center reaction
            that class switching and memory formation depend on.
      selected_evidence:
        snippet: Immunized Bach2+/− mice exhibited minimal induction of both IgG1 class switched-B220hiCD138−
          B cells and B220loCD138+ plasma cells compared to WT mice
        supports: SUPPORT
