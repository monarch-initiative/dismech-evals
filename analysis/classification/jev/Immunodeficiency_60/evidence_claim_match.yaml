      assertion_type: Discussion
      assertion:
        discussion_id: bach2_imd60_phenotype_expansion
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - disease#
        - phenotypes#
        prompt: How wide is the BRIDA phenotype beyond immunoglobulin deficiency and colitis?
        rationale: 'Reports after the founding description have attached progressively more autoimmunity
          to heterozygous BACH2 variants - early-onset systemic lupus with juvenile dermatomyositis and
          IgA deficiency in one family, and autoimmune enteropathy alongside T-cell large granular lymphocytic
          leukemia, type 1 diabetes, pure red cell aplasia and celiac disease in another. Each is a single
          case, and the second carries obvious confounders: an HLA-DQ8 allele and a concurrent clonal
          lymphoproliferative disorder that is itself associated with autoimmunity. So these are not curated
          as phenotypes of this entry. The open question is whether BRIDA is a broad autoimmunity-predisposing
          state whose reported range is still growing, or whether single-case reports are accumulating
          around a gene that is also a common autoimmune susceptibility locus. Deciding it needs a case
          series, not more single reports.'
      selected_evidence:
        snippet: She carries an HLA-DQ8 allele and a germline heterozygous mutation of BACH2.
        supports: SUPPORT
        directness: INDIRECT
