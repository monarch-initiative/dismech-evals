        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - genetic#BACH2
        - inheritance#Autosomal dominant
        prompt: Is BRIDA fully penetrant, and can a BACH2 carrier have the cellular phenotype without
          the disease?
        rationale: 'In the second reported family the R576L variant was inherited from the father, who
          had no obvious symptoms yet showed an extreme reduction in memory B cells. That is a carrier
          with the laboratory phenotype and without the clinical one, which is the signature of incomplete
          penetrance or of a threshold effect requiring a second hit. It matters practically: it means
          an asymptomatic parent cannot be assumed to be a non-carrier, and it bears on how a family is
          counselled. One family is not enough to establish a penetrance estimate, and no source consulted
          here reports carrier counts, so this is a single observation rather than a quantified claim.'
      selected_evidence:
        snippet: Notably, extreme reduction of memory B cells was detected in the patient's father, although
          he had no obvious symptoms.
        supports: SUPPORT
