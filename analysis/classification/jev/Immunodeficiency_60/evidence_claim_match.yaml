        attaches_to:
        - pathophysiology#Impaired Memory B Cell Development
        prompt: If BACH2 suppresses immunoglobulin production, why does losing it cause antibody deficiency
          rather than excess antibody?
        rationale: BACH2 represses immunoglobulin production, and in normal memory B cells plasma-cell
          differentiation proceeds by inducing BLIMP1 and downregulating BACH2. Read naively, halving
          BACH2 should release antibody output rather than reduce it.
        resolution_note: 'Answered by the Bach2 knockout. Bach2-null B cells still produce IgM and still
          express Blimp-1 and XBP-1 abundantly, so plasmacytic differentiation itself does not require
          BACH2 - what fails is class switch recombination specifically. The abundance is itself informative:
          BACH2 represses BLIMP1, so losing BACH2 de-represses the plasma-cell programme rather than leaving
          it untouched, and the cell terminally differentiates without having switched isotype. BACH2
          is therefore not a brake on antibody output in general; it is required for the class-switch
          and somatic-hypermutation programme while restraining premature terminal differentiation. Losing
          it yields antibody that is present but unswitched and unmutated, which is a functional humoral
          deficiency rather than an excess. The memory B-cell node is worded accordingly.

          The dose caveat this note used to end on is now closed. The resolution rested on a homozygous
          null mouse; the founding report''s full text shows the same thing in human cells at the human
          gene dosage, by knocking BACH2 down about 50 percent in healthy donor B cells and finding class
          switching to IgG and IgA suppressed. So the class-switch dependency is a property of BACH2 dosage
          in human B cells, not an artifact of complete loss in mouse.

          One thing the full text complicates rather than settles. The null mouse showed plasmacytic differentiation
          intact, which is what let the answer be "switching fails, terminal differentiation does not".
          Patient naive B cells stimulated with IL-21 in vitro show impaired plasmablast generation as
          well as impaired switching. Those need not conflict - different species, different dosage, different
          stimulus - but the clean separation should not be over-read. This entry annotates isotype switching
          on the memory B-cell node and does not annotate plasma-cell differentiation, because the human
          plasmablast finding is a single in vitro assay and the mouse evidence points the other way.'
      selected_evidence:
        snippet: silencing BACH2 in healthy control B cells, significantly suppressed in vitro class switch
          recombination towards the IgG and IgA isotypes
        supports: SUPPORT
