        discussion_id: bach2_imd60_iuis_versus_clingen_panel
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - disease#
        prompt: Should immunodeficiency 60 be grouped with the antibody deficiencies or with the diseases
          of immune dysregulation?
        rationale: The two authorities pull in different directions and both are defensible. ClinGen curated
          the gene through its Antibody Deficiencies Gene Curation Expert Panel, which reflects how the
          disorder presents - sinopulmonary infection and humoral deficiency. IUIS places it in Table
          4 with the regulatory T-cell defects, which reflects the mechanism and the infiltrative colitis.
          This entry follows IUIS, because the Tregopathy classification is corroborated independently
          and because the lymphocytic colitis is not explicable as a consequence of antibody deficiency.
          The disagreement is recorded rather than hidden, since a reader coming from the ClinGen side
          will expect the other answer.
      selected_evidence:
        snippet: BACH2 | HGNC:14078 | immunodeficiency 60 | MONDO:0032723 | AD | Moderate | SOP9 | Antibody
          Deficiencies Gene Curation Expert Panel | 2023-02-21T18:00:00.000Z
        supports: SUPPORT
