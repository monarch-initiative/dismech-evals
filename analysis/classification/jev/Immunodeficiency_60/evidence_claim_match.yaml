      assertion_type: IUISAssignment
      assertion:
        classification_value: immune dysregulation
        notes: IUIS 2022 phenotypic classification Table 4 (diseases of immune dysregulation). The assignment
          is worth stating explicitly because the clinical picture - humoral deficiency with sinopulmonary
          infection and bronchiectasis - looks like a predominantly antibody deficiency, and ClinGen curated
          the gene through its Antibody Deficiencies expert panel. IUIS nonetheless places BACH2 deficiency
          with the regulatory T-cell defects, which matches the Tregopathy mechanism.
      selected_evidence:
        snippet: BACH2 deficiency BACH2 AD 605394 Progressive T cell lymphopenia Impaired memory B cell
          development Haploinsufficiency for a critical lineage specification transcription factor Lymphocytic
          colitis, sinopulmonary infections
        supports: SUPPORT
