      assertion_type: Pathophysiology
      assertion:
        name: BACH2 Protein Destabilization
        biological_scale: MOLECULAR
        description: The step that explains why one mutant allele yields half-dosage rather than a poisoned
          pathway. The reported BRIDA mutations do not produce a dominant-negative protein; they destabilize
          BACH2 itself, either by interfering with homodimerization through the BTB/POZ domain or by driving
          the protein into aggregates. The mutant product is therefore lost rather than interfering, which
          is what makes the downstream defect a pure gene-dosage problem.
        genes:
        - preferred_term: BACH2
          term:
            id: hgnc:14078
            label: BACH2
        genetic_context:
          gene:
            preferred_term: BACH2
            term:
              id: hgnc:14078
              label: BACH2
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
      selected_evidence:
        snippet: The mutations disrupted protein stability by interfering with homodimerization or by
          causing aggregation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28530713
      reference_title: BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: States the molecular consequence of the variants directly, and is the reason this entry
