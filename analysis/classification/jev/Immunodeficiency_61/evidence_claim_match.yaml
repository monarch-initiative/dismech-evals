  b9fe93e852b5ac095638e6a4b008d92d37595e22315e506bd28e51e3c1be5d0a:
    claim:
      about:
        disease:
          name: Immunodeficiency 61
          disease_term:
            preferred_term: immunodeficiency 61
            term:
              id: MONDO:0010296
              label: immunodeficiency 61
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the Preformed SLP65-CIN85 Transducer Module
        biological_scale: MOLECULAR
        role: central_effector
        description: 'CIN85 trimerises through a C-terminal coiled-coil domain, and the nine SH3 domains
          of a trimer bind multiple SLP65 molecules, each of which recruits further CIN85 trimers - a
          self-perpetuating oligomerisation that concentrates the effector rather than merely connecting
          two proteins to each other. The resulting complex is held in cytoplasmic granules formed by
          tripartite phase separation of SLP65, CIN85 and lipid vesicles. Its purpose is READINESS: the
          module exists in the RESTING B cell so that signalling can begin immediately on receptor engagement.
          The mechanistic point the disease makes is that a signalling cascade can fail not because a
          component is missing from the pathway but because too few copies of it are pre-concentrated
          in the right place.'
        biological_processes:
        - preferred_term: B cell receptor signaling pathway
          term:
            id: GO:0050853
            label: B cell receptor signaling pathway
          modifier: DECREASED
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
      selected_evidence:
        snippet: in B lymphocytes, CIN85 functions to oligomerize SLP-65, which is the central effector
          protein of the B cell receptor (BCR). Therefore, CIN85 trimerizes through a carboxyl-terminal,
          coiled-coil domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27353366
      reference_title: The adaptor protein CIN85 assembles intracellular signaling clusters for B cell
        activation.
