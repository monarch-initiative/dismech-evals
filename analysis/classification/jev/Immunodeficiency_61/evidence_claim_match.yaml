              label: immunodeficiency 61
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd61_cin85_positive_versus_negative_regulator
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is CIN85 a positive or a negative regulator of B cell receptor signalling? The human deletion
          and the cell-line knockdown point in opposite directions.
        attaches_to:
        - pathophysiology#Impaired B Cell Receptor Effector Signalling
        rationale: Two well-executed bodies of work disagree about the sign of CIN85's effect. In humans
          lacking CIN85, and in reconstitution experiments lacking the SLP65-CIN85 complex, BCR effector
          responses are IMPAIRED - NF-kB and CD86 in patients, calcium and NF-kB in cells - which is a
          positive, transducer role. But CIN85 knockdown in B cell lines and primary B cells ENHANCES
          BCR-induced survival and growth and increases expression of BcLxL, A1, cyclin D2 and myc, consistent
          with a negative regulatory role exercised through Cbl-mediated ubiquitination and degradation
          of Syk. Both cannot be the whole story. The plausible reconciliations - that acute knockdown
          and germline absence are not the same perturbation, that CIN85 isoforms differ, or that the
          transducer and Cbl-adaptor functions are separable and read out on different timescales - are
          untested. This matters for the disease entry because it determines whether the pathograph's
          central node is correctly signed, and no entry in this family should assert a single unified
          CIN85 function.
        proposed_experiments:
        - experiment_id: exp_imd61_acute_versus_germline_cin85_loss
          name: Side-by-side acute knockdown versus germline null in the same B cell background
          description: Compare degenerate CIN85 knockdown, inducible degron-mediated acute depletion,
            and stable germline knockout in one isogenic human B cell line, reading out Syk ubiquitination
            and phosphorylation, calcium flux, NF-kB activation, CD86 upregulation, survival and proliferation
            in parallel. This would test directly whether the opposing published phenotypes are an artefact
            of perturbation kinetics rather than a genuine dual function.
      selected_evidence:
        snippet: CIN85 knockdown in primary B cells enhanced BCR-induced survival and growth, and increased
          the expression of BcLxL, A1, cyclin D2, and myc
        supports: REFUTE
    origin:
