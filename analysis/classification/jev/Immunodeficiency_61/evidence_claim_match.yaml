    claim:
      about:
        disease:
          name: Immunodeficiency 61
          disease_term:
            preferred_term: immunodeficiency 61
            term:
              id: MONDO:0010296
              label: immunodeficiency 61
        context: []
      assertion_type: Genetic
      assertion:
        name: SH3KBP1 loss-of-function deletion
        gene_term:
          preferred_term: SH3KBP1
          term:
            id: hgnc:13867
            label: SH3KBP1
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'SH3KBP1 (CIN85) at Xp22.12 is the gene MedGen and OMIM associate with IMD61; MONDO:0010296
          itself records no causal-gene relationship, so the anchor here comes from OMIM/MedGen, and that
          MONDO gap is worth reporting upstream. Evidence strength should be stated plainly rather than
          implied: only two affected individuals - brothers - have been reported with loss-of-function
          SH3KBP1 variants, and the one subsequent case carries a partial deletion classified as a variant
          of uncertain significance whose authors state that a causal relationship remains unproven. No
          ClinGen gene-disease validity assertion for SH3KBP1 was present in the cached ClinGen snapshot.
          `relationship_type` is nonetheless CAUSATIVE rather than DISPUTED because the founding report
          demonstrated the mechanism functionally in patient cells and no publication disputes the relationship;
          the limitation is quantity of evidence, not conflict within it.'
        variants:
        - name: Germline intragenic SH3KBP1 deletion (founding kindred)
          description: A germline deletion within the CIN85 gene on the X chromosome, hemizygous in two
            affected brothers, described by a later report as loss of function.
          clinical_significance: PATHOGENIC
        - name: Partial hemizygous Xp22.12 deletion involving SH3KBP1 (later case)
          description: A hemizygous deletion of approximately 200 kb at Xp22.12 partially involving SH3KBP1,
            predicted to disrupt exons 2 to 6 and possibly a larger region, detected by array comparative
            genomic hybridization and classified as a variant of uncertain significance. It arose DE NOVO,
            confirmed by its absence in the patient's mother. The deleted interval also spans neighbouring
            genes, so a contiguous-gene contribution cannot be excluded, and no functional studies were
            performed.
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          identifiers:
          - ClinVar:SCV005849918
      selected_evidence:
        snippet: To date, only two affected individuals have been reported in the literature.
        supports: SUPPORT
