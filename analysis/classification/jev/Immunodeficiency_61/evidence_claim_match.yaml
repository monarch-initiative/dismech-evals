              label: immunodeficiency 61
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd61_nosology_not_an_agammaglobulinemia
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Should MONDO:0010296 remain classified under agammaglobulinemia, given that the disease
          it names is a selective antibody-response defect with normal B cell development?
        attaches_to:
        - pathophysiology#Defective Antibody Production by Intrinsically Impaired B Cells
        rationale: 'The entity carries the legacy names AGMX2, XLA2 and "agammaglobulinemia, X-linked,
          type 2", and MONDO places MONDO:0010296 under MONDO:0015977 agammaglobulinemia. The disease
          as characterised does not match that placement: in the founding report all immune cell compartments
          developed normally and the defect was intrinsic to B cell effector function, and the subsequently
          reported features are impaired specific antibody responses and altered memory B cell subsets.
          The question is about mechanism, not about immunoglobulin levels: the more severely affected
          founding brother had undetectable total IgG and IgA, so a categorical "this is not an agammaglobulinemia"
          would overstate the case. What the placement does invite is confusion with BTK-related X-linked
          agammaglobulinemia, which is a different gene, a different mechanism, and - decisively - a different
          B cell phenotype, since B cell development is intact here. This is recorded as a curation-facing
          question rather than acted on unilaterally, because reclassifying a MONDO concept is not a disorder
          entry''s job.'
        proposed_experiments:
        - experiment_id: exp_imd61_immunophenotype_reconciliation
          name: Standardised immunophenotyping of all reported SH3KBP1 patients
          description: Apply one standardised B cell immunophenotyping panel - total, transitional, naive,
            memory and switched-memory B cells, plus serum immunoglobulin isotypes and specific antibody
            responses to protein and polysaccharide vaccines - across all reported SH3KBP1 patients, to
            settle whether the entity is an agammaglobulinemia, a specific antibody deficiency, or a memory
            B cell disorder, and to reconcile the reported discrepancy in B cell counts.
      selected_evidence:
        snippet: impaired humoral immune responses, reduced B-cell counts
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
