  08d155d6f19a7ab92d03d4b873d3a88f357dd8c7f480f404bcd779d865321aba:
    claim:
      about:
        disease:
          name: Immunodeficiency 61
          disease_term:
            preferred_term: immunodeficiency 61
            term:
              id: MONDO:0010296
              label: immunodeficiency 61
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SH3KBP1 (CIN85) Loss-of-Function Deletion
        biological_scale: MOLECULAR
        role: trigger
        description: A germline deletion within SH3KBP1 on the X chromosome, hemizygous in affected males.
          CIN85 is ubiquitously expressed and multifunctional, and before this report nothing was known
          about its role in humans - the only in vivo data were conditional mouse mutants ablating distinct
          CIN85 isoforms in brain and B lymphocytes. The human deletion is therefore the experiment that
          established which of CIN85's many proposed functions are non-redundant.
        genes:
        - preferred_term: SH3KBP1
          term:
            id: hgnc:13867
            label: SH3KBP1
        genetic_context:
          gene:
            preferred_term: SH3KBP1
            term:
              id: hgnc:13867
              label: SH3KBP1
          allele_type: intragenic deletion
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Hemizygous germline deletion within SH3KBP1 in affected males, described by a later
            report as a loss-of-function variant. LOSS_OF_FUNCTION rather than PARTIAL_LOSS_OF_FUNCTION
            because the founding study frames its findings as "in the absence of CIN85" and reads the
            resulting defects as revealing non-redundant CIN85 functions.
          notes: '`variant_origin` is left unset ON THIS BLOCK because the block describes the founding
            kindred''s lesion, and the cached sources do not report parental testing for those two brothers.
            It is NOT unset for want of data on the later case: that patient''s deletion is affirmatively
            de novo, confirmed by its absence in his mother, and that is recorded on the corresponding
            `variants[]` entry. The authors'' separate remark that segregation was limited to maternal
            testing with mosaicism not excluded comes from their limitations paragraph and qualifies how
            exhaustively segregation was assessed, not whether the mother carried the variant.'
      selected_evidence:
        snippet: limited information exists about the in vivo roles of CIN85, because only conditional
          mouse mutants with cell type-specific ablation of distinct CIN85 isoforms in brain and B lymphocytes
          have been generated so far. No information is available about the roles of CIN85 in humans.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29636373
      reference_title: Germline deletion of CIN85 in humans with X chromosome-linked antibody deficiency.
      evidence_source: OTHER
      explanation: Establishes the state of knowledge this deletion resolved, and incidentally records
        that brain is one of the two compartments in which CIN85 had been conditionally ablated in mice.
