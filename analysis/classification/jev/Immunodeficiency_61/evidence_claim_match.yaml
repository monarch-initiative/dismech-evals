              label: immunodeficiency 61
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neurodevelopmental Involvement
        biological_scale: ORGANISM
        role: consequence
        description: 'Neurodevelopmental features have accompanied the immune phenotype in every reported
          individual: attention-deficit/hyperactivity disorder and mild cognitive impairment in the two
          brothers, and autism spectrum disorder with developmental delay in the later case. Whether this
          reflects a genuine second function of CIN85 or ascertainment in patients who reached genetics
          services for developmental reasons is not established. Two things make it worth curating rather
          than dismissing: CIN85 is ubiquitously expressed and brain was one of only two compartments
          in which it had been conditionally ablated in mice before the human report; and in the later
          case the deletion also spanned neighbouring genes, so a contiguous-gene effect cannot be excluded.
          The causal link is therefore typed as having unknown intermediates and its evidence marked PARTIAL
          throughout.'
      selected_evidence:
        snippet: both patients also presented with neurodevelopmental manifestations, including attention-deficit/hyperactivity
          disorder (ADHD) and mild cognitive impairment
        supports: SUPPORT
