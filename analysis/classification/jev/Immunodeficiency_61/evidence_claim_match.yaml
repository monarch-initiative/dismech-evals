          term:
            id: CL:0000236
            label: B cell
      selected_evidence:
        snippet: In the absence of CIN85, all immune cell compartments developed normally, but B lymphocytes
          showed intrinsic defects in distinct effector pathways of the B cell antigen receptor, most
          notably NF-κB activation and up-regulation of CD86 expression on the cell surface.
        supports: SUPPORT
