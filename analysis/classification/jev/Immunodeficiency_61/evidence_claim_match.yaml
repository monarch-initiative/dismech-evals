          - most notably NF-kB activation and upregulation of CD86 on the cell surface - while the cells
          themselves developed and persisted normally. In the cell-line and reconstitution models the
          same lesion abrogates BCR-induced calcium and NF-kB responses. What is lost is the capacity
          of a B cell to translate receptor engagement into an effector programme, not the B cell itself.
        biological_processes:
        - preferred_term: positive regulation of canonical NF-kappaB signal transduction
