        context: []
      assertion_type: Genetic
      assertion:
        name: ARHGEF1 biallelic loss of function
        gene_term:
          preferred_term: ARHGEF1
          term:
            id: hgnc:681
            label: ARHGEF1
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'ARHGEF1 at 19q13.2 is the gene OMIM (#618459) and MedGen (C5193109) associate with IMD62;
          MONDO:0032763 itself records no causal-gene relationship, so the anchor here comes from OMIM/MedGen
          and from the IUIS classification row rather than from MONDO. That MONDO gap is worth reporting
          upstream. The evidence strength should be read plainly: two affected individuals, sisters, from
          one family, with the causal direction established functionally in their own cells (RhoA activity
          and actin polymerisation restored by retroviral ARHGEF1 expression) rather than by segregation
          across families. A search of the 612 ClinGen gene-disease validity records cached in this repository
          (`grep -l ARHGEF1 references_cache/CGGV_*.md`, re-run 2026-09-25) returned no file, so there
          is no ClinGen validity assertion for ARHGEF1 to cite. `relationship_type` is CAUSATIVE rather
          than DISPUTED because no publication disputes the relationship; the limitation is quantity of
          evidence, not conflict within it.'
        variants:
        - name: ARHGEF1 c.898C>T p.(Arg300Ter) (paternal allele)
          description: Nonsense variant in exon 12 of NM_199002.1, inherited from the healthy father,
            with a CADD score of 41 and absent from ExAC, the Exome Sequencing Project, dbSNP and SwissVar
            at the time of reporting.
          clinical_significance: PATHOGENIC
        - name: ARHGEF1 c.1669-1G>T splice acceptor variant (maternal allele)
          description: Splice acceptor site variant inherited from the healthy mother. RT-PCR on patient
            and maternal peripheral blood mononuclear cells detected an aberrant transcript, expressed
            at lower level than the main transcript, that skips exon 19 and frameshifts to a premature
            stop codon.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We assume that any combination of these variations will lead to ARHGEF1 deficiency.
        supports: SUPPORT
