  55f5f6c5a53d93f5e4164428fecd23a9b9cd6d5f902c0b2f1a54666bd7e49482:
    claim:
      about:
        disease:
          name: Immunodeficiency 62
          disease_term:
            preferred_term: immunodeficiency 62
            term:
              id: MONDO:0032763
              label: immunodeficiency 62
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd62_mouse_platelet_phenotype_absent_in_humans
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Arhgef1-null mice have a severe platelet activation and haemostasis defect. An ARHGEF1-deficient
          human has none. Which species is telling us what ARHGEF1 does in platelets?
        attaches_to:
        - pathophysiology#Reduced RhoA Activation in Lymphocytes
        rationale: 'Arhgef1-/- mice have prolonged tail bleeding and carotid occlusion times, with defective
          platelet aggregation, granule secretion, integrin activation, clot retraction and spreading,
          and absent platelet RhoA activation - a phenotype striking enough that its authors proposed
          ARHGEF1 as a therapeutic target in thrombosis. When platelet function was finally measured in
          the younger of the two ARHGEF1-deficient sisters, everything was normal: aggregometry across
          seven agonists, glycoprotein expression and PAC-1 binding, dense and alpha granule content and
          secretion, spreading, clot retraction, procoagulant extracellular vesicle release, and - decisively
          - platelet RhoA activation itself, which was of similar magnitude to control. She had had no
          bleeding through lobectomy, ovarian cyst excision, breast implant surgery, two childbirths and
          terminations. So the divergence is not a matter of assay sensitivity: the proximate signalling
          step that fails in the patient''s lymphocytes does not fail in her platelets. The authors attribute
          this to redundancy among the RhoGEFs human platelets express, noting that ARHGEF7 and ARHGEF6
          are more abundant than ARHGEF1 there, and that ARHGEF2 and ARHGEF6 protein levels were unchanged
          so any compensation would have to be at the level of activation rather than abundance. The mismatch
          matters for this entry in two directions: it warns against importing the mouse platelet literature
          into the human disease description, and it suggests that the lymphocyte phenotype is severe
          precisely because lymphocytes lack the RhoGEF redundancy that protects platelets. It is also
          a single patient, and the compensating mechanism is hypothesised rather than identified.'
        proposed_experiments:
        - experiment_id: exp_imd62_platelet_rhogef_redundancy
          name: Which RhoGEF sustains RhoA activation in ARHGEF1-null human platelets
          description: Knock down ARHGEF7, ARHGEF6, ARHGEF2 and ARHGEF12 individually and in combination
            in a human megakaryocytic system carrying an engineered ARHGEF1 null, and measure agonist-induced
            RhoA-GTP, aggregation and clot retraction. This would test directly the redundancy hypothesis
            the platelet paper offers, and would say whether lymphocytes lack the same redundancy.
          would_support:
          - discussions#imd62_mouse_platelet_phenotype_absent_in_humans
          supporting_outcome:
          - Loss of one or more additional platelet RhoGEFs on the ARHGEF1-null background reproduces
            the murine platelet phenotype in human cells.
          refuting_outcome:
          - RhoA activation and platelet function remain intact despite combined RhoGEF knockdown, implying
            the species difference lies elsewhere than in RhoGEF redundancy.
      selected_evidence:
        snippet: Our results indicate that Arhgef1-/- mice had prolonged carotid artery occlusion and
          tail bleeding times.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30994039
      reference_title: Arhgef1 Plays a Vital Role in Platelet Function and Thrombogenesis.
      evidence_source: MODEL_ORGANISM
      explanation: The murine haemostatic phenotype that the human patient does not have.
