      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'ARHGEF1 lies at 19q13.2 and the two affected sisters are compound heterozygotes:
          a nonsense allele inherited from their healthy father and a splice acceptor site allele from
          their healthy mother. Both parents are unaffected carriers, so the recurrence risk for a further
          pregnancy of this couple is the standard autosomal recessive 25%. Segregation rests on this
          one family; no second kindred has been reported.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: 'A nonsense mutation c.898C>T (Chr19: 42398710: C>T; hg19 build 137) was inherited from
          the father, and a splice mutation c.1669-1G>T (Chr19: 42406933: G>T) was inherited from the
          mother.'
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
