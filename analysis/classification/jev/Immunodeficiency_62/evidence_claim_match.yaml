  65b1715dae65b102bd26e97a0e63c99aec1cd32b208e8c07b22485ce70cb59eb:
    claim:
      about:
        disease:
          name: Immunodeficiency 62
          disease_term:
            preferred_term: immunodeficiency 62
            term:
              id: MONDO:0032763
              label: immunodeficiency 62
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd62_malignancy_risk_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does germline ARHGEF1 loss carry a tumour risk, and specifically a lymphoma risk, given
          that somatic ARHGEF1 loss of function is recurrent in germinal centre B cell-like diffuse large
          B cell lymphoma?
        attaches_to:
        - phenotypes#Bronchial neoplasm
        - pathophysiology#Disturbed Germinal Center Reaction
        rationale: 'One of the two reported patients developed a bronchial mucoepidermoid carcinoma at
          21. Taken alone that is a single tumour in a chronically infected and bronchiectatic lobe, and
          nothing more. What keeps the question open is the mechanism on the other side: the founding
          report''s own introduction notes that germinal centre B cell-like diffuse large B cell lymphoma
          is frequently associated with loss-of-function ARHGEF1 mutations, and that Arhgef1-null mouse
          germinal centre B cells fail to activate sphingosine-1-phosphate signalling and escape excessively
          into blood and lymph - the same retention failure this entry curates as the cause of the patients''
          small, B cell-poor germinal centres. A germline null in that pathway is therefore not an obviously
          neutral background for lymphomagenesis, whatever the salivary-type carcinoma turns out to have
          been. With two patients and one tumour of the wrong lineage to bear on the question, the honest
          position is that malignancy risk in IMD62 is UNKNOWN - not absent, and not established. Nothing
          in this entry should be used to counsel a family about cancer risk, and no surveillance recommendation
          follows from it.'
      selected_evidence:
        snippet: at 21 years of age, she was diagnosed with bronchial mucoepidermoid carcinoma and underwent
          a lung lobectomy
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30521495
      reference_title: Loss of ARHGEF1 causes a human primary antibody deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: The single reported malignancy in the two-patient series.
