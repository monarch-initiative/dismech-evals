      assertion_type: Pathophysiology
      assertion:
        name: Reduced RhoA Activation in Lymphocytes
        biological_scale: MOLECULAR
        description: 'RhoA-GTP is two- to three-fold below control in patient B and T lymphocytes. This
          is the hub of the entry: RhoA activation is what the ARHGEF1 lesion removes, and both downstream
          arms - cortical actin assembly and ROCK-mediated restraint of PI3K/AKT - branch from here. Both
          are correctable, in patient cells, by a pharmacological RhoA activator or by re-expressing ARHGEF1,
          which is what establishes the causal direction rather than mere association.'
        biological_processes:
        - preferred_term: RhoA signal transduction
          term:
            id: GO:0007266
            label: Rho protein signal transduction
          modifier: DECREASED
      selected_evidence:
        snippet: Enforced ARHGEF1 expression or drug-induced activation of RhoA in the patients' cells
          corrected the impaired actin polymerization and AKT regulation.
        supports: SUPPORT
