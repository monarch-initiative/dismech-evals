      assertion_type: Genetic
      assertion:
        name: IL2RB
        gene_term:
          preferred_term: IL2RB
          term:
            id: hgnc:6009
            label: IL2RB
        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Four alleles are reported and they fail in three different ways, which is what the index
          paper means by "distinct mechanisms": p.Leu77Pro misfolds and is sequestered intracellularly,
          p.Ser40Leu reaches the surface but cannot signal, p.Pro222_Gln225del disrupts the WSXWS motif
          and loses surface expression, and p.Gln96* truncates. The first three are hypomorphic and give
          the infantile immune-dysregulation phenotype; the truncating allele is perinatally lethal.'
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        variants:
        - name: p.Leu77Pro
          description: Misfolded and intracellularly sequestered, so surface IL-2Rbeta is severely reduced,
            yet the mutant retains some signalling capacity where it does reach the surface.
          gene:
            preferred_term: IL2RB
            term:
              id: hgnc:6009
              label: IL2RB
        - name: p.Ser40Leu
          description: Sits at a ligand-binding interface. Surface expression is only partially reduced,
            but the receptor cannot induce STAT5 phosphorylation, so this is a signalling defect rather
            than an expression defect.
          gene:
            preferred_term: IL2RB
            term:
              id: hgnc:6009
              label: IL2RB
        - name: p.Pro222_Gln225del
          description: A 9-bp in-frame deletion disrupting the conserved extracellular WSXWS motif, drastically
            reducing surface expression. This is the allele in the two index siblings and the one with
            five-year post-transplant follow-up.
          gene:
            preferred_term: IL2RB
            term:
              id: hgnc:6009
              label: IL2RB
        - name: p.Gln96*
          description: 'A truncating allele, and the severe end of the spectrum: the kindred carrying
            it comprised two fetuses and a neonate who died of respiratory failure. Unlike the three hypomorphic
            alleles, this one is not compatible with the infantile immune-dysregulation presentation.'
          gene:
            preferred_term: IL2RB
            term:
              id: hgnc:6009
              label: IL2RB
      selected_evidence:
        snippet: Here, we report the first human defect in IL-2Rβ, occurring in two infant siblings with
          a homozygous IL2RB mutation in the WSXWS motif
        supports: SUPPORT
