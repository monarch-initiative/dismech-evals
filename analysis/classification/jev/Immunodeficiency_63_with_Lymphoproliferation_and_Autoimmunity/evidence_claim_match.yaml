        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: il2rb_nk_threshold_requirement
        kind: KNOWLEDGE_GAP
        prompt: What level of IL-2Rbeta signalling does human NK development actually require, and how
          much residual signalling do the hypomorphic alleles leave?
        attaches_to:
        - pathophysiology#NK Cell Maturation Defect
        rationale: 'The human picture is consistent, not contested: NK numbers are preserved or raised
          across three alleles, maturation is arrested at the CD56-bright stage with negligible CD57,
          and cytotoxicity is intact. What is genuinely unknown is the dose-response -- how much receptor
          signal NK differentiation needs -- and the paper that built the model to answer it says its
          model cannot. That puts the gap in the model system, not in the human data.'
        status: OPEN
      selected_evidence:
        snippet: First, questions regarding the threshold requirement for NK cell development and function
          remain and are not easily explored using the Il2rb Mut model system.
        supports: SUPPORT
