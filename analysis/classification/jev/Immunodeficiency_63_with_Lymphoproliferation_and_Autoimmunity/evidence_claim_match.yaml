      assertion_type: Discussion
      assertion:
        discussion_id: il2rb_nk_species_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the Il2rb knock-in mouse tell us anything about the NK-cell arm of human IL-2Rbeta
          deficiency, given that its NK maturation phenotype runs in the opposite direction to the patients'?
        attaches_to:
        - pathophysiology#NK Cell Maturation Defect
        - animal_models#Mouse
        rationale: 'The CMV susceptibility is what makes this an immunodeficiency rather than a pure tolerance
          disorder, and failed differentiation toward adaptive NK cells is the proposed route. But the
          model that would test it diverges in direction: patients accumulate immature CD56-bright NK
          cells, while the mutant mice lose mature stage E cells and accumulate terminally differentiated
          cytotoxic ones. This is not a gap in evidence -- the mouse is informative, and decisive, for
          the T-cell arm -- it is a question about whether the model transfers, which is why it is a mismatch
          rather than a knowledge gap.'
        status: OPEN
        proposed_experiments:
        - experiment_id: il2rb_patient_nk_cytotoxicity
          name: Functional NK cytotoxicity and CMV control in patient cells
          description: Measure adaptive NK differentiation and CMV-specific IFN-gamma responses directly
            in patient NK cells. Cytotoxicity is already known to be intact, so measuring it again would
            not discriminate.
          readouts:
          - name: Adaptive NK-cell differentiation and IFN-gamma response to CMV
            target: NK Cell Maturation Defect
            direction: DECREASED
            interpretation: Would establish that the maturation arrest, rather than a cytotoxicity deficit,
              is what translates into failed viral control in humans.
          would_support:
          - pathophysiology#Impaired Control of Cytomegalovirus
      selected_evidence:
        snippet: Unlike the increase in immature CD56bright NK cells observed in humans, we observed decreased
          mature stage E (CD11b+CD27+) NK cells and an excess of mature/potent cytotoxic (CD11b+CD27−)
          cells
        supports: SUPPORT
