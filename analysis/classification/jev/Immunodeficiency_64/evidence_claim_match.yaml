              label: immunodeficiency 64
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immune Dysregulation with Autoimmunity and Vasculopathy
        biological_scale: ORGANISM
        description: 'A second clinical arm, and the one whose weight has grown with reporting. Alongside
          cytopenic autoimmunity, the 2026 systematic review identifies vascular autoimmunity as an emerging
          life-threatening phenotype: the index case of that report had severe vasculopathy with ischaemic
          stroke and thrombosis, secondary antiphospholipid syndrome, and fatal refractory autoimmune
          haemolytic anaemia. This entry records vasculopathy as emerging rather than established, following
          the source''s own framing.

          The proposed mechanism is a breakdown of tolerance to vascular antigens, which is the same loss
          of B-cell tolerance that produces the cytopenic autoantibodies - so the vascular and cytopenic
          arms are one lesion with two targets, not two findings that happen to co-occur.

          '
      selected_evidence:
        snippet: We report a 5-year-old male with novel homozygous splice-donor mutations in RASGRP1(c.1720+1G>A
          and c.1720+2T>C) who presented with severe vasculopathy (ischemic stroke and thrombosis), secondary
          antiphospholipid syndrome, and fatal refractory autoimmune hemolytic anemia.
        supports: SUPPORT
