            preferred_term: immunodeficiency 64
            term:
              id: MONDO:0032803
              label: immunodeficiency 64
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Expansion of EBV-Specific CD8-Positive T Cells
        biological_scale: CELLULAR
        description: 'The step that makes IMD64 an EBV disease specifically. RASGRP1 is grouped with MAGT1
          and ITK as genes whose mutation causes defective expansion of EBV-specific CD8+ T cells, and
          therefore failure to eliminate proliferating EBV-infected B cells. This is a shared final common
          path across a family of inborn errors, reached here through a TCR-proximal signalling defect.

          Two specific downstream steps are named: loss of RASGRP1 prevents upregulation of CTP synthetase
          1 and of the CD27-CD70 axis. Both of those are themselves causes of EBV-susceptibility inborn
          errors in their own right, which is the concrete reason this disease''s oncogenic profile resembles
          the narrow-spectrum EBV IEIs (CD27, CD70, ITK) rather than the broad lymphoproliferation of
          ALPS.

          '
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
      selected_evidence:
        snippet: the defective expansion of EBV-specific CD8 T cells results from mutations in genes involved
          in T-cell activation (such as RASGRP1, MAGT1, and ITK)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
