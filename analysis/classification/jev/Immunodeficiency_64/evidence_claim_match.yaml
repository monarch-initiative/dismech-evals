              label: immunodeficiency 64
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic RASGRP1 Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: 'Stop-gain, other truncating, and splice-donor alleles, all biallelic. The structural
          basis for why truncation is catastrophic is known: RASGRP1 is held autoinhibited, with its RAS-binding
          catalytic site blocked by an interdomain linker and its membrane-interaction surface buried
          in a dimerization interface stabilised by the C-terminal oligomerization domain. Calcium binding
          to the EF-hand regulatory module drives the conformational change that releases it. Truncating
          alleles remove the catalytic or regulatory modules that convert the calcium/DAG signal into
          RAS-GTP loading, so there is no partial-activity state to fall back on.

          '
        genes:
        - preferred_term: RASGRP1
          term:
            id: hgnc:9878
            label: RASGRP1
          modifier: DECREASED
        genetic_context:
          description: Biallelic loss-of-function RASGRP1 alleles - homozygous stop-gain in the index
            kindred, with subsequently reported truncating and splice-donor alleles.
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: This variant segregated perfectly with the disease and has not been reported in genetic
          databases.
        supports: SUPPORT
