        prompt: Does lenalidomide's reversal of the RhoA, migration and activation defects in RASGRP1-deficient
          cells translate into clinical benefit in patients?
        rationale: The lenalidomide result is an ex vivo cellular rescue reported in the original description.
          No trial, cohort, or case series establishing clinical benefit in RASGRP1 deficiency has been
          reported, and the 2026 systematic review states that transplantation remains the only curative
          therapy. The gap is worth recording rather than glossing because a mechanism-based rescue in
          patient cells is exactly the kind of finding that gets cited as if it were a therapy.
