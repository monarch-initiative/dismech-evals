              label: immunodeficiency 64
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rasgrp1_mouse_cannot_model_ebv
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Failed Expansion of EBV-Specific CD8-Positive T Cells
        - pathophysiology#EBV-Driven B Cell Lymphoproliferation and Lymphoma
        prompt: The defining human phenotype of this disease is EBV-driven B-cell lymphoproliferation,
          and mice are not susceptible to EBV. What can a mouse model establish about the EBV arm, and
          what can it not?
        rationale: 'This is a structural mismatch rather than a fidelity shortfall: the limitation is
          in the host species, not in how the model was built. Murine Rasgrp1 deficiency produces a systemic-lupus-like
          autoimmune phenotype, which maps usefully onto this entry''s autoimmunity arm, and mouse work
          has characterised the T-cell developmental requirement for Rasgrp1. Neither can speak to EBV
          control, because Epstein-Barr virus does not infect mice. The consequence for this entry is
          specific: the causal chain from failed EBV-specific CD8+ T cell expansion to B-cell lymphoproliferation
          is supported entirely by human observation plus the shared-mechanism argument across MAGT1,
          ITK, CD27 and CD70, with no animal system able to test it. Humanised-mouse EBV models exist
          for other EBV-susceptibility IEIs and are the obvious route.'
      selected_evidence:
        snippet: the systemic lupus erythematosus (SLE)‐like condition observed in RASGRP1‐deficient mice
        supports: SUPPORT
