        biological_scale: MOLECULAR
        description: 'Without IRF9 the STAT1/STAT2/IRF9 trimer cannot form in response to type I interferon,
          while STAT1 homodimers (gamma-activated factor, GAF) still assemble normally. This is the discriminating
          molecular finding on functional testing and the reason the immunodeficiency is selective: the
          type II interferon arm, which signals through GAF, is intact.'
        protein_complexes:
        - preferred_term: ISGF3 complex
          term:
            id: GO:0070721
            label: ISGF3 complex
          modifier: DECREASED
