  ee774aa77c5bc5e15a14a6b848f9e5d66d6b304ba9043bc1b8b9fc64d08b243d:
    claim:
      about:
        disease:
          name: Immunodeficiency 65 (IRF9 Deficiency)
          disease_term:
            preferred_term: immunodeficiency 65, susceptibility to viral infections
            term:
              id: MONDO:0032848
              label: immunodeficiency 65, susceptibility to viral infections
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: irf9_mouse_type_ii_ifn_divergence
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why is type II interferon signalling intact in human IRF9 deficiency but impaired in the
          p48-null mouse, and does that divergence limit what the mouse can say about the human disease?
        attaches_to:
        - pathophysiology#Failure of ISGF3 Trimer Assembly
        rationale: 'The selectivity of the human defect is this entry''s defining claim: patient cells
          form STAT1 homodimers normally, so the gamma-activated factor arm that transduces type II interferon
          still works, and the disease is an ISGF3 failure rather than a global interferon unresponsiveness.
          The p48-null mouse does not reproduce that boundary - in the mouse, the antiviral state induced
          by IFN-gamma is impaired too. Whether this reflects a species difference in how much type II
          interferon signalling depends on p48, a difference between a constitutive germline null and
          a hypomorphic human allele, or the difference between embryonic fibroblasts and the patient
          cell types assayed, is not resolved. Until it is, the mouse supports the ISG-induction node
          and cannot be used to argue about the selectivity.'
        proposed_experiments:
        - experiment_id: irf9_gaf_formation_across_species_and_cell_types
          name: GAF formation and IFN-gamma-induced antiviral state in p48-null mouse and IRF9-null human
            cells, matched by cell type
          description: 'Assay STAT1 homodimer formation and the IFN-gamma-induced antiviral state side
            by side in p48-null mouse embryonic fibroblasts, p48-null mouse cells of a type matched to
            those assayed in patients, and IRF9-deficient human fibroblasts. The three-way comparison
            separates the candidate explanations the rationale names: if the mouse defect persists across
            cell types while the human one does not, it is a species difference; if it tracks cell type,
            the original discrepancy is an artefact of comparing embryonic fibroblasts with patient cells.'
          would_support:
          - pathophysiology#Failure of ISGF3 Trimer Assembly
          supporting_outcome:
          - GAF formation and the IFN-gamma-induced antiviral state are intact in IRF9-null human cells
            but impaired in p48-null mouse cells of the same type, establishing a genuine species difference
            and confirming that the mouse cannot speak to the selectivity of the human defect.
          refuting_outcome:
          - The type II interferon defect in p48-null mouse cells disappears when a cell type matching
            the human assays is used, indicating the divergence is a comparison artefact rather than a
            species difference, and that the model may after all be informative about selectivity.
      selected_evidence:
        snippet: We show that p48 plays an essential role in both type I and type II IFN responses
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9078371
      reference_title: Essential and non-redundant roles of p48 (ISGF3 gamma) and IRF-1 in both type I
