          term:
            id: GO:0060337
            label: type I interferon-mediated signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Her cells activate gamma-activated factor (GAF) STAT1 homodimers but not IFN-stimulated
          gene factor 3 (ISGF3) trimers (STAT1/STAT2/IRF9) in response to IFN-α2b.
        supports: SUPPORT
