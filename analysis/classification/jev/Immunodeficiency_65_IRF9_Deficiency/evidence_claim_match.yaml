  48cc9e8b85ac757087800cdf0c8fca13b9df44aaa2b0cbf82ade507583f6ffb7:
    claim:
      about:
        disease:
          name: Immunodeficiency 65 (IRF9 Deficiency)
          disease_term:
            preferred_term: immunodeficiency 65, susceptibility to viral infections
            term:
              id: MONDO:0032848
              label: immunodeficiency 65, susceptibility to viral infections
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of USP18 Negative Feedback on Interferon Receptor Signalling
        biological_scale: CELLULAR
        description: ISGF3 loss suppresses but does not abrogate type I interferon receptor signalling.
          Because USP18 and other negative regulators are themselves ISGF3-induced, their induction fails
          and receptor signalling becomes abnormally prolonged. This is the mechanistic bridge to the
          inflammatory arm and resolves what otherwise looks like a contradiction - a patient who cannot
          mount an interferon response yet suffers interferon-driven inflammation.
        biological_processes:
        - preferred_term: negative regulation of type I interferon-mediated signaling pathway
          term:
            id: GO:0060339
            label: negative regulation of type I interferon-mediated signaling pathway
          modifier: DECREASED
        - preferred_term: type I interferon-mediated signaling pathway
          term:
            id: GO:0060337
            label: type I interferon-mediated signaling pathway
          modifier: INCREASED
        notes: The two process terms here say different things and are not in tension. GO:0060339 DECREASED
          is the substantive claim - the brake fails, because USP18 and the other negative regulators
          are themselves ISGF3-induced. GO:0060337 INCREASED records the consequence, that receptor-proximal
          signalling therefore runs long. Binding the negative-regulation term directly is what makes
          this coherent with the DECREASED modifier on GO:0060337 at the ISGF3 assembly node, where the
          claim is about ISGF3-dependent transcription rather than about signalling duration.
      selected_evidence:
        snippet: Deficiency of any IFN-stimulated gene factor 3 component suppressed but did not abrogate
          IFN-I receptor signaling, which was abnormally prolonged, in keeping with insufficient induction
          of negative regulators such as ubiquitin-specific peptidase 18 (USP18).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
