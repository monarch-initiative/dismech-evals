            term:
              id: MONDO:0032848
              label: immunodeficiency 65, susceptibility to viral infections
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: irf9_type_iii_ifn_contribution
        kind: KNOWLEDGE_GAP
        prompt: Does the type III interferon arm of the ISGF3 defect contribute independently to the IMD65
          phenotype, or is the clinical disease entirely attributable to loss of type I interferon signalling?
        attaches_to:
        - pathophysiology#Failure of ISGF3 Trimer Assembly
        rationale: IRF9 loss disables ISGF3 downstream of both the type I and the type III interferon
          receptor, and the founding paper's conclusion names both pathways. But patients whose cells
          cannot respond to type III interferons because of inherited IL10RB deficiency have no overt
          viral disease, which argues that the type III arm is largely redundant in humans and that the
          IMD65 phenotype is driven by the type I loss. The entry therefore does not model a separate
          type III node, and this discussion records why that absence is a judgement rather than an oversight.
      selected_evidence:
        snippet: Patients with cells that do not respond to type III IFNs due to inherited IL10RB deficiency
          display no overt viral disease
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38781720
      reference_title: 'In search of a function for human type III interferons: insights from inherited
        and acquired deficits.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The observation that motivates the gap: an isolated type III unresponsiveness produces
        no viral phenotype, so the type III component of the ISGF3 defect cannot be assumed to contribute.'
