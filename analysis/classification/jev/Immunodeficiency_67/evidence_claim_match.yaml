          disease_term:
            preferred_term: IRAK4 deficiency
            term:
              id: MONDO:0011888
              label: immunodeficiency 67
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mouse_broad_vs_human_narrow_susceptibility
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do MyD88/IRAK-4-deficient mice show broad susceptibility to viruses, intracellular
          bacteria, and fungi, whereas human IRAK-4 deficiency produces only a narrow, largely age-limited
          susceptibility to pyogenic bacteria?
        attaches_to:
        - pathophysiology#Impaired Inflammatory Response to Pyogenic Bacteria
        - pathophysiology#Invasive Pyogenic Bacterial Infection
        rationale: 'The murine knockout recapitulates the Gram-positive pyogenic susceptibility of the
          human disease but not its restriction: MyD88-deficient mice are susceptible to a wide range
          of viral, intracellular bacterial, and fungal pathogens that do not define human IRAK-4 deficiency.
          The open translational question is why the same MyD88-dependent pathway lesion yields a far
          broader infectious phenotype in mice than in humans - i.e. why the human pathway is so much
          more redundant for antiviral, antifungal, and intracellular bacterial immunity. An explicit
          caveat: much of the broad-susceptibility evidence comes from MyD88-deficient rather than IRAK4-deficient
          mice, so the discordance is a property of the shared pathway and is not established for the
          IRAK-4 knockout in isolation.'
      selected_evidence:
        snippet: The susceptibility of IRAK-4–deficient patients to S. aureus is consistent with that
          observed in IRAK-4– and MyD88-deficient mice (31, 43).
        supports: SUPPORT
