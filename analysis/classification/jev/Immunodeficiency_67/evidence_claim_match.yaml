            but discordant in scope: the mouse phenotype is far broader than the narrow, age-limited human
            susceptibility.'
          limitations: Much of the broad-susceptibility evidence is drawn from MyD88-deficient rather
            than IRAK4-deficient mice, so the discordance is attributed to the shared pathway rather than
            to IRAK-4 alone; and the mouse phenotype is not age-restricted the way the human disease is.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: MyD88/IRAK-4-deficient mice are susceptible to murine CMV, HSV-1, Listeria, Mycobacterium
              avium, Toxoplasma, Cryptococcus, Candida, and Aspergillus, none of which define the human
              disease; the human MyD88-dependent pathway is thus far more redundant for antiviral, antifungal,
              and intracellular bacterial immunity than the murine one.
      selected_evidence:
        snippet: The susceptibility of IRAK-4–deficient patients to S. aureus is consistent with that
          observed in IRAK-4– and MyD88-deficient mice (31, 43).
