          functional_impact_category: LOSS_OF_FUNCTION
          description: Germline biallelic null/loss-of-function IRAK4 variants (nonsense, frameshift,
            splice) abolishing IRAK-4 kinase activity.
      selected_evidence:
        snippet: Upon ligand binding and via its N-terminal death domain, IRAK4 is recruited to an oligomeric
          receptor that is proximal to the Myddosome signaling complex, inducing IRAK4 kinase domain dimerization,
