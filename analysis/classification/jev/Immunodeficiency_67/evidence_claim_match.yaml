      assertion_type: Diagnosis
      assertion:
        name: Cellular responses to TLR and IL-1R agonists (functional immunology)
        description: Functional testing of patient blood cells provides the immunological confirmation.
          Whole blood cells or peripheral blood mononuclear cells fail to produce the major proinflammatory
          cytokines (TNF-alpha, IL-6, IL-12) on stimulation with MyD88-dependent TLR agonists, and fail
          to secrete IL-6 in response to IL-1beta (and IFN-gamma in response to IL-18), reflecting the
          IRAK-4 block in MyD88-dependent signaling. The response to the TLR3-specific agonist poly(I:C)
          is spared, which distinguishes the pattern from a global signaling defect.
        diagnosis_term:
          preferred_term: TLR and IL-1R agonist cellular stimulation assay
        markers: TNF-alpha, IL-6, IL-12 (whole blood / PBMC cytokine induction on TLR and IL-1R stimulation)
      selected_evidence:
        snippet: do not induce the production of major inflammatory cytokines (TNF-α, IL-6, and IL-12)
          and growth factors (G-CSF and GM-CSF) in whole blood cells and PBMCs
        supports: SUPPORT
