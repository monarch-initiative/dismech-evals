  b9b356c7725a41547424e5b0dc3c91cda838e53b39e2d1293c9fcd551a43bca5:
    claim:
      about:
        disease:
          name: Immunodeficiency 67
          disease_term:
            preferred_term: IRAK4 deficiency
            term:
              id: MONDO:0011888
              label: immunodeficiency 67
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: age_dependent_improvement
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does susceptibility to invasive pyogenic infection in IRAK-4 deficiency wane sharply
          with age despite a persistent, lifelong signaling defect?
        attaches_to:
        - pathophysiology#Invasive Pyogenic Bacterial Infection
        rationale: 'Invasive infection and death are concentrated in early childhood: no death and no
          invasive infection were reported after the ages of 8 and 14 years, respectively, in the two
          largest cohorts. The IRAK-4 signaling defect is constitutive and does not resolve, so the improvement
          is presumed to reflect maturation of adaptive immunity and acquisition of protective antibody
          with age rather than any change in the innate lesion. The precise mechanism of the age-dependent
          narrowing is not established, which is why it is recorded as a knowledge gap. The improvement
          is also not absolute: fatal breakthrough pneumococcal meningitis has been reported at age 7
          in a prophylaxed, vaccinated child, driven by an antibiotic-resistant serotype.'
      selected_evidence:
        snippet: even older IRAK-4-deficient patients are at high risk of rapidly fatal infection due
          to emergence of antibiotic resistance.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24596024
      reference_title: Fatal pneumococcal meningitis in a 7-year-old girl with interleukin-1 receptor
        activated kinase deficiency (IRAK-4) despite prophylactic antibiotic and IgG responses to Streptococcus
        pneumoniae vaccines.
      evidence_source: HUMAN_CLINICAL
      explanation: Qualifies the age-dependent improvement - a fatal infection still occurred at age 7
        despite prophylaxis and vaccination, so the improvement is not absolute.
