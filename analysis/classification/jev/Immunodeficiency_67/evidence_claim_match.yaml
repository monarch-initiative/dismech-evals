      assertion_type: Pathophysiology
      assertion:
        name: Impaired TLR7-Dependent Type I Interferon Production
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: A recently recognized branch that qualifies the classic teaching that antiviral immunity
          is intact. TLR7 is a MyD88- and IRAK-4-dependent endosomal single-stranded-RNA sensor, so plasmacytoid
          dendritic cells cannot mount TLR7-driven type I interferon in response to SARS-CoV-2. The evidence
          comes from a combined cohort of autosomal recessive MyD88 or IRAK-4 deficiency, so the finding
          is attributed to the shared pathway rather than to IRAK-4 alone.
        cell_types:
        - preferred_term: plasmacytoid dendritic cell
          term:
            id: CL:0000784
            label: plasmacytoid dendritic cell
        biological_processes:
        - preferred_term: type I interferon production
          term:
            id: GO:0032606
            label: type I interferon production
          modifier: DECREASED
      selected_evidence:
        snippet: The patients' susceptibility to SARS-CoV-2 can be attributed to impaired TLR7-dependent
          type I IFN production by pDCs, which do not sense SARS-CoV-2 correctly.
        supports: SUPPORT
