            term:
              id: MONDO:0011888
              label: immunodeficiency 67
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired MyD88-Dependent TLR and IL-1R Signaling
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'Cells cannot transduce signals through the MyD88-dependent Toll-like receptors (all
          TLRs except TLR3) or the IL-1R family. The TLR3 and TLR4-interferon-alpha/beta arms, which do
          not require IRAK-4, are spared, so most antiviral immunity is preserved. The important exception
          is TLR7, an endosomal single-stranded-RNA sensor that is itself MyD88- and IRAK-4-dependent:
          its signaling is lost, which underlies the recently recognized susceptibility to severe viral
          pneumonia (see the TLR7 branch below).'
        cell_types:
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        - preferred_term: dendritic cell
          term:
            id: CL:0000451
            label: dendritic cell
        biological_processes:
        - preferred_term: MyD88-dependent toll-like receptor signaling pathway
          term:
            id: GO:0002755
            label: MyD88-dependent toll-like receptor signaling pathway
          modifier: LOSS_OF_FUNCTION
        - preferred_term: interleukin-1-mediated signaling pathway
          term:
            id: GO:0070498
            label: interleukin-1-mediated signaling pathway
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Human interleukin (IL) 1 receptor-associated kinase 4 (IRAK-4) deficiency is a recently
          discovered primary immunodeficiency that impairs Toll/IL-1R immunity, except for the Toll-like
          receptor (TLR) 3- and TLR4-interferon (IFN)-alpha/beta pathways.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17893200
      reference_title: 'Selective predisposition to bacterial infections in IRAK-4-deficient children:
        IRAK-4-dependent TLRs are otherwise redundant in protective immunity.'
      evidence_source: HUMAN_CLINICAL
      explanation: States that IRAK-4 deficiency impairs Toll/IL-1R signaling while sparing the TLR3 and
        TLR4-IFN pathways.
