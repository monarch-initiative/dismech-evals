            term:
              id: MONDO:0011888
              label: immunodeficiency 67
        context: []
      assertion_type: Genetic
      assertion:
        name: IRAK4
        gene_term:
          preferred_term: IRAK4
          term:
            id: hgnc:17967
            label: IRAK4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: IRAK4 encodes interleukin-1 receptor-associated kinase 4, the proximal serine/threonine
          kinase of the Myddosome that assembles on MyD88 after a MyD88-dependent TLR or an IL-1R family
          receptor is engaged. Reported disease alleles are germline biallelic loss-of-function variants
          (nonsense, frameshift and splice) that abolish kinase function, so the gene-disease relationship
          is recorded as causative with an autosomal recessive, loss-of-function mechanism.
        variants:
        - name: Biallelic loss-of-function IRAK4 variants
          description: The reported alleles are germline null or loss-of-function variants (nonsense,
            frameshift, and splice-site) carried in the homozygous or compound-heterozygous state, abolishing
            IRAK-4 kinase activity and MyD88-dependent signaling.
          clinical_significance: PATHOGENIC
        - name: Q293X
          description: A recurrent nonsense allele found in homozygotes from six kindreds and compound
            heterozygotes from four kindreds in the Ku cohort, its recurrence possibly reflecting a mutational
            hotspot, a founder effect, or both. Nomenclature follows the source (Q293X).
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Their blood and fibroblast cells did not activate nuclear factor kappaB and mitogen-activated
          protein kinase (MAPK) and failed to induce downstream cytokines in response to any of the known
          ligands of TIR-bearing receptors.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12637671
      reference_title: Pyogenic bacterial infections in humans with IRAK-4 deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates that loss of IRAK-4 abolishes NF-kB/MAPK activation and cytokine induction
        downstream of TIR-bearing receptors, the functional basis of the gene-disease relationship.
