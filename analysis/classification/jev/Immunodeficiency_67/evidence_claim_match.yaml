        description: Germline Irak4- and Myd88-deficient mice model the MyD88-dependent TLR/IL-1R signaling
          lesion. They reproduce the human susceptibility to Gram-positive pyogenic bacteria (notably
          Staphylococcus aureus) but, unlike human patients, show broad susceptibility to viruses, intracellular
          bacteria, and fungi - a discordance that is central to interpreting the model (see the HUMAN_MODEL_MISMATCH
          discussion).
