      assertion:
        name: Bacille Calmette-Guerin (BCG) vaccination
        description: 'Routine BCG immunisation is the sentinel environmental exposure in this disorder.
          The attenuated Mycobacterium bovis BCG strain is harmless to immunocompetent infants but disseminates
          in patients who cannot mount IFN-gamma-dependent macrophage activation, which is how MSMD patients
          typically come to attention.

          '
        exposure_term:
          preferred_term: exposure to Bacille Calmette-Guerin vaccine
          term:
            id: ECTO:2000129
            label: exposure to vaccination
        effect: Triggers disseminated mycobacterial disease in IFN-gamma-deficient hosts.
        notes: 'The binding is deliberately broader than the exposure. ECTO has no BCG-, Calmette- or
          M. bovis-specific exposure class: `runoak -i sqlite:obo:ecto search "l~BCG"`, `"l~Calmette"`
          and `"l~bacille"` each return nothing, and `"l~mycobacter"` returns only pathogen exposure classes
          for M. tuberculosis and M. avium and exposures to antimycobacterial drugs, none of which is
          a vaccine. ECTO:2000129 exposure to vaccination is the most specific true class available, and
          preferred_term carries the vaccine identity.'
      selected_evidence:
        snippet: Mendelian susceptibility to mycobacterial disease (MSMD) is characterized by a selective
          predisposition to clinical disease caused by the Bacille Calmette-Guérin (BCG) vaccine and environmental
          mycobacteria.
        supports: SUPPORT
