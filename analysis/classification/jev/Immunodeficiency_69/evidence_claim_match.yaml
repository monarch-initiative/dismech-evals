            term:
              id: MONDO:0033541
              label: immunodeficiency 69
        context: []
      assertion_type: Genetic
      assertion:
        name: IFNG
        gene_term:
          preferred_term: IFNG
          term:
            id: hgnc:5438
            label: IFNG
        association: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Homozygous four-nucleotide deletion c.354_357del in IFNG, generating a frameshift and
          a premature stop codon (p.T119Ifs4*). The allele is both loss of expression and loss of function:
          patient-derived T lymphocytes produce no IFN-gamma, and the defect is corrected by retrotransduction
          with wild-type IFNG cDNA, establishing that the IFNG lesion is causal rather than coincidental.
          The variant scored a combined annotation-dependent depletion (CADD) score of 25, above the IFNG
          mutation significance cutoff (MSC) of 20.877, and was absent from population databases (gnomAD
          v2.1, TOPMed BRAVO) and an in-house cohort of over 6000 infectious-disease patients, with an
          estimated allele frequency below 3x10^-6.

          '
        notes: 'The CADD-versus-MSC comparison is reported in prose rather than as a snippet-quoted evidence
          item: the source sentence in the cached full text (references_cache/PMID_32163377.md) is broken
          by PDF-extraction hyphenation ("muta-"/"tion" across a line wrap), so no exact, non-fabricated
          quote spans the full comparison. The companion population-frequency claim below is separately
          evidenced with a clean quote.'
      selected_evidence:
        snippet: The mutant allele is loss of expression and loss of function.
        supports: SUPPORT
