      assertion_type: Pathophysiology
      assertion:
        name: Defective IFN-gamma-Dependent Macrophage Activation
        biological_scale: CELLULAR
        description: 'IFN-gamma is the principal macrophage-activating cytokine. Without it, the IFN-gamma
          receptor on mononuclear phagocytes is never engaged, the JAK1/JAK2-STAT1 cascade is not triggered,
          and the antimicrobial programme that allows macrophages to restrict intracellular mycobacteria
          is not induced. The receptor and its signalling machinery are structurally intact here, which
          is what distinguishes this etiology from the IFN-gamma receptor deficiencies and makes it pharmacologically
          addressable with the recombinant cytokine.

          '
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
