  3483f9666840230fcec3a991c590c00592ee9f86c7a7c6ad9b9cdb2f21c70706:
    claim:
      about:
        disease:
          name: Immunodeficiency 69
          disease_term:
            preferred_term: immunodeficiency 69
            term:
              id: MONDO:0033541
              label: immunodeficiency 69
        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant Interferon Gamma
        description: 'Subcutaneous recombinant IFN-gamma is the mechanistically rational therapy for this
          specific MSMD etiology. Because the defect is in the cytokine and not in its receptor or in
          the downstream JAK-STAT1 machinery, exogenous IFN-gamma can engage an intact receptor and restore
          macrophage activation. This is the therapeutic distinction between IFNG deficiency and complete
          IFN-gamma receptor deficiency, in which the cytokine cannot act. Recombinant IFN-gamma has already
          proven useful in other MSMD etiologies with impaired IFN-gamma production, such as IL-12Rbeta1
          deficiency.

          '
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: interferon gamma-1b
            term:
              id: NCIT:C100089
              label: Interferon Gamma-1b
        notes: 'Recombinant IFN-gamma WAS administered in this genotype: patient 1 received IMUKIN at
          50 micrograms/m2 three times weekly, started 18 months after initial presentation. What is absent
          is an evaluable efficacy result, not the exposure — see the KNOWLEDGE_GAP discussion. An earlier
          draft of this entry stated that no treatment outcome had been reported in these patients; that
          was wrong and is corrected here.'
      selected_evidence:
        snippet: Human recombinant IFN-γ (IMUKIN) treatment (50 μg/m 2, 3 times per week) was started
          18 months after the patient’s initial presentation.
        supports: SUPPORT
