          modifier: DECREASED
        - preferred_term: macrophage activation
          term:
            id: GO:0042116
            label: macrophage activation
          modifier: DECREASED
        conforms_to: granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation
      selected_evidence:
        snippet: The nine gene products are physiologically related, as all are involved in IFN-γ-dependent
          immunity.
        supports: SUPPORT
