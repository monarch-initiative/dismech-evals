      assertion_type: Discussion
      assertion:
        discussion_id: ivns1abp_gene_disease_validity
        kind: KNOWLEDGE_GAP
        prompt: Is IVNS1ABP haploinsufficiency an established monogenic cause of immunodeficiency, or
          a candidate association awaiting replication?
        rationale: 'This is the first question a reader of this entry should be able to answer, and the
          schema gives no structured way to record it, so it is recorded here.

          In favour: three independent truncating variants with none in controls, a loss-of-function-intolerant
          gene, protein measured at about half of control, and a shared clinical and immunophenotypic
          picture the authors describe as previously undescribed. That combination is more than a statistical
          hit.

          Against: one cohort, three patients, all sporadic with no family segregation, a reported posterior
          probability of 0.33, no replication cohort in the six years since, no ClinGen gene-disease validity
          assertion, and no Orphanet record. The confirmatory experiments establish that the variants
          reduce protein, not that reduced protein causes the phenotype.

          The gap is practical. Until it closes, a heterozygous IVNS1ABP truncating variant found in a
          diagnostic laboratory cannot be reported as diagnostic, and the recurrence risk quoted in counselling
          is conditional on a relationship that has not been independently confirmed.'
        attaches_to:
        - genetic#IVNS1ABP
        - pathophysiology#NS1-BP Haploinsufficiency
      selected_evidence:
        snippet: BeviMed enrichment (PPA=0.33) of IVNS1ABP was driven by three independent heterozygous
          protein-truncating variants, suggesting haploinsufficiency, while no such variants were observed
          in controls
        supports: SUPPORT
