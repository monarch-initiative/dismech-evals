          measured rather than inferred: patient peripheral blood mononuclear cells carry about half the
          normal amount of IVNS1ABP protein. Two independent lines support treating this as pathogenic
          rather than tolerated - the direct protein measurement, and the gene''s population-level intolerance
          to loss of function (pLI = 0.994).

