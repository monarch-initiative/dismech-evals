  987b0bcb5c0e4928c45ec320ac93158d457ca09433caa3d87e26a5de766dbdfe:
    claim:
      about:
        disease:
          name: Immunodeficiency 70
          disease_term:
            preferred_term: immunodeficiency 70
            term:
              id: MONDO:0033542
              label: immunodeficiency 70
        context: []
      assertion_type: Genetic
      assertion:
        name: IVNS1ABP
        gene_term:
          preferred_term: IVNS1ABP
          term:
            id: hgnc:16951
            label: IVNS1ABP
        relationship_type: CAUSATIVE
        notes: 'IVNS1ABP encodes NS1-BP, a BTB-Kelch family protein first identified through its interaction
          with the influenza A virus NS1 protein. It has an N-terminal BTB/POZ domain and five kelch-like
          tandem repeats.

          Three candidate cellular activities are described, in three separate literatures that have not
          met. Two are in mRNA processing: with hnRNP K it regulates splicing, and it competes with viral
          NS1 for the mRNA export receptor NXF1 to route transcripts out of the nucleus. The third is
          cytoskeletal - Kelch-family proteins associate with F-actin, and rat macrophage work links Ivns1abp
          to phagocytosis and to macrophage phenotype under inflammatory conditions.

          The third is the most immunologically plausible of the three, since actin defects are an established
          class of inborn errors of immunity, but it is also the least directly evidenced for this protein:
          the F-actin statement is a background claim about the Kelch family rather than a measurement
          of NS1-BP itself, and the functional work is in rat. None of the three has been connected to
          the patients'' phenotype.

          Two cautions about how this gene''s literature reads. First, most of the 31 indexed IVNS1ABP
          papers concern influenza virology or cancer biology rather than immunity, so a literature search
          on the gene symbol returns a great deal that is not about this disease. Second, relationship_type
          is recorded as CAUSATIVE because that is what the reporting study concludes, but the underlying
          evidence is a single cohort with a posterior probability of 0.33 plus functional follow-up.
          There is no ClinGen gene-disease validity assertion and no Orphanet record for this entity.
          A reader should weigh the relationship as a well-supported candidate rather than as an established
          one; the dismech schema has no slot in which to record that distinction, which is why it is
          stated here in prose.'
      selected_evidence:
        snippet: Taken together, these data implicate IVNS1ABP haploinsufficiency as a novel monogenic
          cause of PID
        supports: SUPPORT
