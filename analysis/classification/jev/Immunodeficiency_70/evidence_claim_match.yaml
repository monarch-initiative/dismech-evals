  6b261f3fc77c7bb35419a6ce263cc06e33d1059086dd3058572f5991efcdf8aa:
    claim:
      about:
        disease:
          name: Immunodeficiency 70
          disease_term:
            preferred_term: immunodeficiency 70
            term:
              id: MONDO:0033542
              label: immunodeficiency 70
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ivns1abp_molecular_to_immune_link
        kind: KNOWLEDGE_GAP
        prompt: Which NS1-BP-dependent mRNA processing event, if any, becomes limiting at half protein
          dose and produces the naive T cell phenotype and the HPV susceptibility?
        rationale: 'NS1-BP has three described activities - splicing co-regulation with hnRNP K, NXF1-dependent
          mRNA export, and an F-actin association shared with the rest of the Kelch family - and none
          has been connected to the immune phenotype. The first two were characterised in the context
          of influenza infection, in cell lines, by investigators studying virology rather than immunity.
          The third comes from a rat macrophage study of inflammation. Three literatures, none of which
          cites the immunodeficiency.

          The actin route deserves the most attention despite having the weakest direct evidence, because
          actin defects are a recognised class of inborn errors of immunity - and because the very cohort
          paper that proposed IVNS1ABP also analysed ARPC1B, an actin-related immunodeficiency gene. If
          NS1-BP belongs in that class the disease has a ready-made mechanistic frame; the evidence for
          its actin role is currently a family-level generalisation plus rat phagocytosis data, which
          is not enough to curate as mechanism.

          This is why both causal edges out of the haploinsufficiency node in this entry are typed INDIRECT_UNKNOWN_INTERMEDIATES.
          It would be easy to write a plausible chain - NS1-BP regulates host splicing, splicing shapes
          lymphocyte differentiation, therefore a splicing defect alters naive T cells - but no step of
          it has been tested, and curating it would manufacture a mechanism.

          A concrete first step exists: transcriptome-wide splicing and export analysis of patient T cells
          against controls would say whether the characterised activities are even perturbed at half dose.'
        attaches_to:
        - pathophysiology#NS1-BP Haploinsufficiency
        - pathophysiology#Aberrant Naive T Cell Surface Phenotype
        - pathophysiology#Susceptibility to Cutaneous HPV Disease
        proposed_experiments:
        - experiment_id: ivns1abp_patient_tcell_splicing
          name: Splicing and mRNA export profiling of patient naive T cells
          description: RNA sequencing with splice-junction and nuclear/cytoplasmic fractionation analysis
            of naive T cells from IVNS1ABP truncating-variant carriers against matched controls, to test
            whether NS1-BP's characterised activities are measurably impaired at half dose in the cell
            type that shows the phenotype.
          readouts:
          - name: Differential splice-junction usage in patient naive T cells
            target: pathophysiology#Aberrant Naive T Cell Surface Phenotype
            direction: ALTERED
            interpretation: Altered splicing of immune-relevant transcripts would give the missing first
              step of a mechanism.
          would_support:
          - pathophysiology#NS1-BP Haploinsufficiency
          supporting_outcome:
          - Reproducible mis-splicing or nuclear retention of transcripts with established roles in T
            cell differentiation or antiviral defence, absent in controls.
          would_refute:
          - pathophysiology#NS1-BP Haploinsufficiency
          refuting_outcome:
          - No detectable splicing or export abnormality in patient T cells, which would mean the disease
            mechanism is not the protein's characterised activity and would redirect the search.
      selected_evidence:
        snippet: Additionally, we show that hnRNP K and NS1-BP regulate host splicing events and that
          viral infection causes mis-splicing of some of these transcripts.
        supports: SUPPORT
        directness: INDIRECT
