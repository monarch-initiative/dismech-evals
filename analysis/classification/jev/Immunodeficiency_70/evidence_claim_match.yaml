          measured rather than inferred: patient peripheral blood mononuclear cells carry about half the
          normal amount of IVNS1ABP protein. Two independent lines support treating this as pathogenic
          rather than tolerated - the direct protein measurement, and the gene''s population-level intolerance
          to loss of function (pLI = 0.994).

          Note what does not follow. Halving the protein is established; which of NS1-BP''s molecular
          activities becomes limiting at half dose is not, and no dose-response experiment has been reported.'
      selected_evidence:
        snippet: IVNS1ABP protein expression was around 50% of control, consistent with haploinsufficiency
        supports: SUPPORT
