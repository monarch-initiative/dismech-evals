      assertion_type: Genetic
      assertion:
        name: RAC2
        gene_term:
          preferred_term: RAC2
          term:
            id: hgnc:9802
            label: RAC2
        association: RAC2 encodes a haematopoietic-restricted Rho-family GTPase. Heterozygous dominant-activating
          missense variants cause IMD73B; other biochemical classes of RAC2 allele cause different diseases.
        relationship_type: CAUSATIVE
        variants:
        - name: RAC2 p.Glu62Lys (E62K)
          description: The best-characterised dominant-activating allele. It retains intrinsic GTP hydrolysis
            but is not accelerated by GTPase-activating protein, so it dwells in the active GTP-bound
            state.
          clinical_significance: PATHOGENIC
        - name: RAC2 p.Asn92Thr (N92T)
          description: A dominant-activating allele in a child who presented with combined immunodeficiency
            at 10 years rather than with a congenital neutrophil disease.
          clinical_significance: PATHOGENIC
        - name: RAC2 p.Pro29Arg (P29R)
          description: A de novo dominant-activating allele in the highly conserved Switch I domain, reported
            with raised ROS, elevated F-actin and increased RAC2 protein expression.
          clinical_significance: PATHOGENIC
        - name: RAC2 p.Arg68Trp (R68W), homozygous
          description: A rare variant that produces the dominant-activating phenotype only in the homozygous
            state. Protein expression is markedly reduced yet effector signalling is increased, so expression
            level and functional direction point opposite ways in the same patient.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: 'Disease correlated to RAC2 activity: constitutively active RAS-like mutations caused
          neonatal SCID, dominant-negative mutations caused LAD-like disease, whereas dominant-activating
          mutations caused CID.'
        supports: SUPPORT
