            the intervening mechanism, so the model shares the human entry's uncertainty about how RAC2
            signalling reaches thymic and marrow output rather than resolving it.
          readouts:
          - name: Peripheral T- and B-cell counts in Rac2+/E62K mice
            target: T and B Lymphopenia with Impaired Lymphocyte Output
            direction: DECREASED
            interpretation: The lymphoid arm of the human phenotype is allele-driven and reproducible
              in a mouse carrying only that change.
        - target: Dysregulated F-Actin Assembly and Loss of Polarization
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Neutrophil F-actin is increased in the knock-in, matching the patient finding.
