        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd73b_allele_class_boundary
        kind: KNOWLEDGE_GAP
        prompt: Where exactly is the boundary between the dominant-activating alleles that cause IMD73B
          and the constitutively active RAS-like alleles that cause neonatal SCID?
        attaches_to:
        - genetic#RAC2
        rationale: The cohort framework treats activity level as a continuum that maps onto discrete syndromes,
          but individual reports do not always sort cleanly. The G12R allele is described biochemically
          as gain of function while its three reported newborns presented with profound leukopenia and
          a severe autosomal-dominant SCID picture rather than the later-onset combined immunodeficiency
          of this entry. Until functional thresholds are standardized, assigning a new activating allele
          to IMD73B rather than to the SCID arm is a clinical judgement, not a measurement.
      selected_evidence:
        snippet: In three newborns presenting with frequent infections and profound leukopenia, we identified
          a private, heterozygous mutation in the RAC2 gene (p.G12R).
        supports: SUPPORT
    origin:
