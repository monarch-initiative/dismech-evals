        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd73b_lymphopenia_mechanism
        kind: KNOWLEDGE_GAP
        prompt: By what route does constitutive RAC2 activation in the cytoskeletal and oxidase arms produce
          reduced thymic and bone-marrow lymphocyte output?
        attaches_to:
        - pathophysiology#T and B Lymphopenia with Impaired Lymphocyte Output
        rationale: Low TRECs and KRECs establish that output is reduced rather than that peripheral cells
          are being consumed, and accelerated caspase-3-positive apoptosis is measured in patient lymphocytes.
          What is missing is the step between them, since no patient thymus or marrow study demonstrates
          where in development the loss occurs. This entry therefore types the edge from apoptosis to
          lymphopenia as having unknown intermediates rather than asserting a pathway.
      selected_evidence:
        snippet: Immunologic investigation revealed low numbers of TRECs/KRECs, a severe reduction of
          memory B cells, absence of isohemagglutinins, and low IgG levels.
        supports: SUPPORT
