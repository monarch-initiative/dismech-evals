  a5835536dae28ef50ce4ef71ed76a2a3a5a19b79aa3c3e9970634d159b62ef72:
    claim:
      about:
        disease:
          name: Immunodeficiency 74, COVID-19-Related, X-Linked
          disease_term:
            preferred_term: X-linked recessive TLR7 deficiency
            term:
              id: MONDO:0026767
              label: immunodeficiency 74, COVID-19-related, X-linked
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Tlr7-null mouse challenged with mouse-adapted SARS-CoV-2
        species: Mouse
        genotype: Tlr7 knockout (TLR7-/-)
        publication: PMID:40162785
        description: 'The model that supplies what human studies cannot: direct measurement of lung viral
          load, lung interferon output and lung histology under a controlled challenge. TLR7-null mice
          infected with mouse-adapted SARS-CoV-2 have higher lung virus titres, lower type I and III interferon
          and interferon-stimulated gene expression, more neutrophil infiltration, worse lung pathology
          and higher mortality than controls.'
        modeled_mechanisms:
        - target: Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Reproduces the failure of viral control in the lung that the human disease infers
            from its interferon defect and clinical outcome.
          limitations: 'The challenge is a mouse-adapted virus, not the human pathogen, and the mouse
            lesion is a whole-animal knockout rather than one of the graded human alleles. More importantly
            the cellular geography differs: human TLR7 deficiency acts through pDC-derived interferon
            with no epithelial contribution, since human lung epithelium does not express TLR7, whereas
            the mouse study reports reduced interferon-stimulated gene expression in the lung and viral
            antigen in bronchial epithelial cells.'
          readouts:
          - name: Lung virus load
            target: Unrestrained Early SARS-CoV-2 Replication in the Respiratory Tract
            direction: INCREASED
            interpretation: The quantitative correlate of failed viral containment, which is the step
              the human pathograph asserts without measuring.
        - target: Lung Neutrophil Accumulation and Immunopathology
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Reproduces the inflammatory lung lesion, and establishes its position downstream
            of the viral-control failure rather than as an independent process.
          limitations: Mouse neutrophil biology and the mouse-adapted virus both differ from the human
            disease, and no histological series from TLR7-deficient human lungs exists to compare against.
          readouts:
          - name: Lung neutrophil accumulation and histopathology
            target: Lung Neutrophil Accumulation and Immunopathology
            direction: INCREASED
            interpretation: The structural correlate of the immunopathology node in this model.
      selected_evidence:
        snippet: Additionally, given the similar disease outcomes in control, TLR7-/-, and IFNAR-deficient
          MA-CoV-2-infected mice and coronavirus disease 2019 (COVID-19) patients, we propose that MA-CoV-2-infected
          mice constitute an excellent model for studying COVID-19.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
