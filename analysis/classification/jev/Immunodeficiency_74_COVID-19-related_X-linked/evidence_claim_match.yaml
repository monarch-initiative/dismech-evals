        conforms_to: innate_antiviral_interferon_response#Viral PAMP Sensing by Pattern-Recognition Receptors
        description: 'TLR7 sits in the endosomal compartment and binds single-stranded RNA, including
          the SARS-CoV-2 genome delivered there by endocytosed virions. Without a functional receptor
          the ligand is not detected. The defect is specific to this receptor and not to endosomal sensing
          in general: the same patient pDCs respond normally to a TLR9 agonist, and no enrichment of deleterious
          variants was found at the adjacent X-linked gene TLR8.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        cellular_components:
