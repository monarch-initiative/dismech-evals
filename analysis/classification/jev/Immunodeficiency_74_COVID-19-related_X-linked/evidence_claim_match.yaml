        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Type II Interferon Induction
        description: 'TLR7 stimulation of patient cells also fails to raise IFN-gamma. This arm is affected
          across the allelic spectrum rather than only in null alleles: a transcriptomic study of stimulated
          patient PBMCs found the failure of IFN-gamma upregulation even in cells carrying hypofunctional
          and hypomorphic variants that retain measurable NF-kappaB activity. It is recorded as a separate
          node because it is a distinct measured output of the same signalling block, and because it is
          what distinguishes TLR7 deficiency from a pure type I interferonopathy.'
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: type II interferon production
          term:
            id: GO:0032609
            label: type II interferon production
          modifier: DECREASED
      selected_evidence:
        snippet: Of note, a failure in IFNγ upregulation following stimulation was also observed in cells
          harboring the hypofunctional and hypomorphic variants.
        supports: SUPPORT
