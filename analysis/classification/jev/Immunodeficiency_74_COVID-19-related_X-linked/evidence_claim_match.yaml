      assertion:
        discussion_id: tlr7_propofol_sedation_interaction
        kind: INTERPRETATION
        status: OPEN
        prompt: Does propofol sedation further suppress TLR7 signalling in a patient whose residual TLR7
          function is already reduced, and should sedation choice differ in a TLR7-hypomorphic patient
          being ventilated for COVID-19?
        attaches_to:
        - pathophysiology#Abolished MyD88-Dependent Signal Transduction
        - treatments#Early exogenous interferon therapy
        rationale: 'Propofol binds TLR7 directly and hinders its association with MyD88, attenuating interferon
          induction in dendritic cells and in lung tissue. The pharmacological target is precisely this
          entry''s signalling node, and the clinical setting in which these patients are identified is
          one in which propofol is routinely given: they are diagnosed while intubated for critical COVID-19
          pneumonia. For an outright loss-of-function allele the question does not arise, since there
          is no signal left to inhibit. It arises for the hypomorphic and hypofunctional alleles, which
          retain measurable activity and account for several of the reported patients, and for heterozygous
          female carriers. This is recorded as an interpretation rather than as a treatment caution because
          the evidence is biochemical and murine: no study has measured interferon output in a TLR7-hypomorphic
          patient under propofol, and no clinical comparison against another sedative exists.'
      selected_evidence:
        snippet: R837 increased IFN-β expression in the lungs, and propofol attenuated IFN-β expression
          in an in vivo model of R837 intranasal instillation.
        supports: SUPPORT
        directness: INDIRECT
