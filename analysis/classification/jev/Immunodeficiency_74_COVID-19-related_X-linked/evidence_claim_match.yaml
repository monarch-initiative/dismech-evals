      assertion_type: Discussion
      assertion:
        discussion_id: tlr7_neurological_sequelae
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does TLR7 deficiency contribute to neurological deterioration after COVID-19, or is the
          single reported case a coincidence of two findings in one patient?
        attaches_to:
        - phenotypes#Severe viral infection
        rationale: 'One pediatric patient with post-COVID-19 neurological deterioration was found to carry
          a novel hemizygous frameshift TLR7 allele, and the reporting authors suggest TLR7 loss of function
          may contribute to neurological complications. That is a single case, the authors themselves
          hedge it, and no neurological phenotype appears in any of the cohort studies - so no neurological
          phenotype is curated in this entry. The gap is recorded rather than resolved because the cohorts
          were assembled on respiratory severity and would not have detected a neurological outcome had
          one existed. A second patient in whom TLR7 deficiency coexisted with ataxia-telangiectasia shows
          the shape of the confound: that patient''s neurological signs were attributable to a homozygous
          ATM variant, with TLR7 accounting only for the COVID-19 severity.'
      selected_evidence:
        snippet: However, our preliminary findings also suggest TLR7 loss of function may contribute to
          neurological complications post-COVID-19, especially in young previously healthy patients.
        supports: SUPPORT
