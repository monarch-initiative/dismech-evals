          term:
            id: GO:0009597
            label: detection of virus
          modifier: DECREASED
        - preferred_term: toll-like receptor 7 signaling pathway
          term:
            id: GO:0034154
            label: toll-like receptor 7 signaling pathway
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: pDCs from P8 and P14 did not produce type I IFNs (or IL-6) upon stimulation with a TLR7
          agonist, whereas they responded to a TLR9 agonist
        supports: SUPPORT
