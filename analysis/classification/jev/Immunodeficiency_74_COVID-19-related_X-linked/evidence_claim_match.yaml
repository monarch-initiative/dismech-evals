      assertion_type: Pathophysiology
      assertion:
        name: Deficient Plasmacytoid Dendritic Cell Type I Interferon Production
        conforms_to: innate_antiviral_interferon_response#Type I and III Interferon Induction and JAK-STAT
          Signaling
        description: 'The central node. pDCs are the body''s dominant source of type I interferon on nucleic-acid
          sensing, producing 100 to 1,000 times more per cell than any other leukocyte subset after TLR7
          stimulation, and they are the cell type in which TLR7 deficiency matters. Patient pDCs infected
          with SARS-CoV-2 induce the type I interferon gene module 10 to 100 times more weakly than control
          pDCs and fail to mature into the PD-L1-high S1 subset that produces most of the IFN-alpha. The
          defect is partial rather than absolute, which the discovery study attributes to TLR7-independent
          sensors, TLR9 among them. pDC numbers themselves are normal: deep immunophenotyping found no
          abnormality in the leukocyte subsets, so this is a functional and not a numerical defect. The
          module node this conforms to bundles interferon induction with downstream JAK-STAT signalling,
          and only the induction half is lost here: the interferon receptor and its JAK-STAT machinery
          are intact in TLR7 deficiency, which is what makes exogenous interferon a rational replacement
          rather than a futile one.'
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: plasmacytoid dendritic cell
          term:
            id: CL:0000784
            label: plasmacytoid dendritic cell
        biological_processes:
        - preferred_term: type I interferon production
          term:
            id: GO:0032606
            label: type I interferon production
          modifier: DECREASED
        - preferred_term: positive regulation of type I interferon production
          term:
            id: GO:0032481
            label: positive regulation of type I interferon production
          modifier: DECREASED
      selected_evidence:
        snippet: Induction of the 17 type I IFN genes in pDCs from TLR7-deficient patients was 10 to 100
          times weaker than that in pDCs from healthy individuals
        supports: SUPPORT
