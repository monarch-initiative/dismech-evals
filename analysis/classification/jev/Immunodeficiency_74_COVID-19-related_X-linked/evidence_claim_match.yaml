  cb8900e467682b1ee3449485576ff25727b45fc6b0164917ea733ef063f6bead:
    claim:
      about:
        disease:
          name: Immunodeficiency 74, COVID-19-Related, X-Linked
          disease_term:
            preferred_term: X-linked recessive TLR7 deficiency
            term:
              id: MONDO:0026767
              label: immunodeficiency 74, COVID-19-related, X-linked
        context: []
      assertion_type: Treatment
      assertion:
        name: Early exogenous interferon therapy
        description: 'Mechanistically the obvious replacement: the lesion is a failure to produce type
          I interferon in a cell type whose receptor pathway is intact, so exogenous interferon bypasses
          the defect. It is a rational option rather than a demonstrated one - no trial or case series
          in TLR7-deficient patients supports it, and the argument is carried over from inborn errors
          of interferon signalling in general. Recorded here because the reasoning is explicit in the
          clinical literature on this disorder, and flagged as unproven because it is.

          The nearest randomised evidence comes from genotype-unselected COVID-19 trials of pegylated
          interferon lambda, a type III interferon, and its lesson is about timing rather than about this
          genotype. A single early subcutaneous dose in outpatients within seven days of symptom onset
          halved hospitalisation or emergency attendance, while two doses given to patients already admitted
          to hospital produced no benefit. If that time dependence carries over, it is awkward for this
          disorder specifically: TLR7-deficient patients are found because they are already critically
