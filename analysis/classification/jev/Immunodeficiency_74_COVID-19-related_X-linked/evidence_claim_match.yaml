          and lung pathology in TLR7-null mice, with viral antigen in macrophages, pneumocytes and bronchial
          epithelial cells. No histological series from TLR7-deficient human lungs exists, so nothing
          more specific about the human lesion is asserted here. The sequence matters for how the disease
          is read: the inflammation here is downstream of a failed antiviral response, not of an excessive
          innate response, so TLR7-deficient patients are not interferonopathy patients and the mechanistic
          argument for immunosuppression as the primary intervention is weaker than in unselected severe
          COVID-19.'
