            term:
              id: MONDO:0026767
              label: immunodeficiency 74, COVID-19-related, X-linked
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: age_dependent_penetrance_pdc
        hypothesis_label: Declining plasmacytoid dendritic cell numbers explain why penetrance rises with
          age
        status: EMERGING
        description: Penetrance of TLR7 deficiency for severe or critical COVID-19 is high but incomplete,
          and the exceptions are mostly young. Among the hemizygous relatives identified by family screening,
          the three with asymptomatic, mild or moderate infection were aged 5, 5 and 38 years, while those
          with severe or critical pneumonia were older on average (mean 32.4 years against 16), though
          that group spans 7 to 71 years and includes children. The discovery study proposes that because
          blood pDC counts fall with age, a young TLR7-deficient boy still has enough pDC-independent
          or residual TLR9-driven interferon capacity to contain the virus, while the same genotype in
          an adult does not. A second, non-exclusive proposal from the same study is that genetic or epigenetic
          variation in TLR9 responses modifies the phenotype, since patient pDCs respond normally to TLR9
          agonists. Which is right determines whether a hemizygous child identified by family screening
          should be counselled as being at risk now or as becoming at risk later.
      selected_evidence:
        snippet: 'Of the 23 male patients carrying deleterious alleles of TLR7 infected with SARS-CoV-2,
          the 20 patients who developed severe (n=3) or critical (n=17) COVID-19 were aged 7-71 years
          (mean: 32.4 years) whereas the three patients who developed asymptomatic, mild, or moderate
          infection were younger: 5, 5, and 38 years (mean: 16 years).'
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
