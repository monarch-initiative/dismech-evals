            term:
              id: MONDO:0026767
              label: immunodeficiency 74, COVID-19-related, X-linked
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TLR7 Loss of Function
        description: 'Hemizygous TLR7 variants that abolish or substantially reduce receptor function.
          The reported spectrum is broad in kind and consistent in consequence: frameshift and nonsense
          alleles that remove the protein (p.Asn158Thrfs*11, p.Leu227fs) or truncate it (p.Lys684*, p.Phe670Leufs*8),
          the four-nucleotide deletion p.Gln710Argfs*18 of the original Dutch kindred, and missense alleles
          expressed at normal levels that are nonetheless dead in a signalling assay (p.Val795Phe, p.His781Leu,
          p.Leu988Ser, p.Asn215Ser). Grading is biochemical, not predictive: of 20 alleles found in one
          cohort of critical cases, 12 were loss-of-function, three hypomorphic and five neutral in an
          NF-kappaB reporter assay, so the functional test is what distinguishes a causal allele from
          a rare one.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: TLR7
          term:
            id: hgnc:15631
            label: TLR7
        molecular_functions:
        - preferred_term: TLR7 pattern recognition receptor activity
          term:
            id: GO:0038187
            label: pattern recognition receptor activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Rapid clinical whole-exome sequencing of the patients and segregation in available family
          members identified loss-of-function variants of the X-chromosomal TLR7.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32706371
      reference_title: Presence of Genetic Variants Among Young Men With Severe COVID-19.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies loss-of-function TLR7 alleles as the molecular lesion, from the study that
