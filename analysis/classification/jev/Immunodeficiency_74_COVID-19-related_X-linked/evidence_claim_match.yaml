              label: immunodeficiency 74, COVID-19-related, X-linked
        context: []
      assertion_type: Treatment
      assertion:
        name: SARS-CoV-2 mRNA vaccination
        description: 'The one intervention with both a mechanistic rationale and direct supporting data
          in this disorder. Because TLR7 deficiency is clinically silent until infection, prophylaxis
          is what changes the outcome, and it was applied this way in practice: hemizygous relatives identified
          by family screening were fast-tracked for early vaccination. The rationale is not obvious a
          priori - TLR7 senses single-stranded RNA and an mRNA vaccine delivers it - so the key observation
          is that the humoral response to mRNA vaccination in TLR7-deficient patients is essentially normal
          in amplitude, duration and neutralising capacity, which the authors read as showing that induction
          of type I interferon is not required for an efficient humoral response to an mRNA vaccine. Whether
          the nucleoside-modified mRNA is sensed by endosomal TLRs at all is left open in their discussion,
          which notes that modified mRNA may still be partially recognised by those receptors, so the
          normal response is not explained here by assuming the vaccine bypasses TLR7.'
        treatment_term:
          preferred_term: Vaccination
          term:
            id: NCIT:C15346
            label: Vaccination
          therapeutic_agent:
          - preferred_term: mRNA COVID-19 vaccine
            term:
              id: NCIT:C181140
              label: mRNA COVID-19 Vaccine
        therapeutic_modality: VACCINE
      selected_evidence:
        snippet: Based on the TLR7 variant carriership, these individuals were fast-tracked for early
          vaccination.
        supports: SUPPORT
