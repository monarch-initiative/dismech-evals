        rationale: 'The two species give opposite answers, and both results are direct. In mice, Tlr7
          deficiency abolishes germinal-centre-dependent class-switched IgG2b/IgG2c and neutralising antibody
          to SARS-CoV-2, and a B-cell-intrinsic requirement is demonstrated; a second murine study independently
          reports substantially reduced anti-SARS-CoV-2 antibody with delayed viral clearance. In TLR7-deficient
          humans given an mRNA vaccine, the RBD-specific memory B cell response is quantitatively and
          qualitatively similar to healthy donors and neutralising IgG is largely unaffected for seven
          months. The mismatch is mechanistically meaningful rather than a technical discrepancy: the
          human data are from a nucleoside-modified mRNA vaccine designed not to engage innate RNA sensors,
          whereas the murine data use inactivated virus and a pathogen-like particle carrying bacterial
          single-stranded RNA as a deliberate TLR7 ligand. So the comparison may be between two different
          antigens rather than between two species. It matters clinically: if the human B cell compartment
          does need TLR7 for a response to the virus itself, the normal mRNA-vaccine response does not
          license the conclusion that convalescent immunity in these patients is intact, and the entry''s
          main intervention rests on that conclusion.'
        proposed_experiments:
        - experiment_id: tlr7_natural_infection_antibody_response
          experiment_design: HUMAN_OBSERVATIONAL
          name: Natural-infection antibody response in TLR7-deficient patients versus relatives
          description: Measure RBD-specific class-switched IgG, memory B cell frequency and serum neutralising
            titre after natural SARS-CoV-2 infection (not vaccination) in TLR7-deficient patients, their
            non-carrier relatives and heterozygous mothers. Natural infection presents unmodified viral
            single-stranded RNA, which is the ligand the modified mRNA vaccine was engineered to avoid,
            so this is the comparison that separates a species difference from an antigen difference.
          would_support:
          - pathophysiology#Defective B Cell and Myeloid TLR7 Responsiveness
          supporting_outcome:
          - Reduced class-switched RBD-specific IgG and neutralising titre in TLR7-deficient patients
            relative to infected non-carrier relatives, with preserved responses to mRNA vaccination in
            the same individuals.
          would_refute:
          - pathophysiology#Defective B Cell and Myeloid TLR7 Responsiveness
          refuting_outcome:
          - Class-switched RBD-specific IgG, memory B cell frequency and neutralising titre after natural
            infection indistinguishable from infected non-carrier relatives, which would confine the B
            cell defect to the in vitro stimulation phenotype.
      selected_evidence:
        snippet: Sustained germinal center responses led to accumulation of somatic hypermutations in
          immunoglobulin heavy chain genes.
        supports: REFUTE
