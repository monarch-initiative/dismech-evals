      assertion:
        name: FCHO1
        gene_term:
          preferred_term: FCHO1
          term:
            id: hgnc:29002
            label: FCHO1
        relationship_type: CAUSATIVE
        notes: Biallelic loss-of-function variants. Reported alleles span frameshift and nonsense truncations,
          canonical splice-site changes, and missense substitutions in either of the two functional domains
          - p.A34P in the F-BAR domain and p.R679P in the mu-homology domain. That both domains yield
          the same disease is what shows the requirement is for the intact initiation function rather
          than for one binding partner.
      selected_evidence:
        snippet: We demonstrate that these mutations either lead to mislocalisation of the protein or
          prevent its interaction with binding partners.
        supports: SUPPORT
