  365cc93d58e29fc5c888cca89178dfc78143ad826e1ef283d28eb97b4ce78497:
    claim:
      about:
        disease:
          name: Immunodeficiency 76
          disease_term:
            preferred_term: immunodeficiency 76
            term:
              id: MONDO:0030898
              label: immunodeficiency 76
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Clathrin-Mediated Endocytosis
        biological_scale: CELLULAR
        description: 'Cargo that depends on clathrin is internalised poorly. The defect is partial rather
          than absolute, and it is selective for the clathrin route - in the same patient cells a clathrin-independent
          internalisation pathway is preserved, which is the internal control that makes the attribution
          specific.

          The two founding cohorts disagree about how selective it is, and the disagreement is on the
          same cargo in the same cell type. Calzoni et al. report transferrin internalisation as minimally
          detectable in patient T cells; Lyszkiewicz et al. report transferrin receptor endocytosis as
          apparently unaffected in FCHO1-deficient cells, and draw the broader conclusion that FCHO1 deficiency
          does not generally impair clathrin-dependent processes. Both results are curated below as SUPPORT
          and REFUTE items on this node rather than resolved in prose. Neither paper addresses the other,
          and the entry does not choose between them: what is agreed is that FCHO1''s requirement is cargo-selective,
          and the TCR arm below is the cargo both cohorts implicate.'
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: clathrin-dependent endocytosis
          modifier: DECREASED
