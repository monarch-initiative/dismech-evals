      assertion_type: Pathophysiology
      assertion:
        name: Impaired Thymic T-Cell Development
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'A developmental contribution to the lymphopenia, and the point on which the two
          founding cohorts disagree. Lyszkiewicz et al. title their paper for a role in T-cell development
          and support it pharmacologically: chlorpromazine inhibition of clathrin-mediated endocytosis
          during in vitro T-cell development held cells at the DN3 stage, with only 30-35% reaching double-positive
          against more than 50% untreated. The experiment carries its own specificity control - B-cell
          and granulocyte development from the same progenitors were unaffected - so it is not general
          toxicity.

          Graded HYPOTHETICAL for the human disease, for two reasons the entry should not paper over.
          The developmental evidence is pharmacological CME inhibition in an in vitro system, not an FCHO1-deficient
          thymus; and Calzoni et al. found preserved T-cell repertoire diversity, composition and clonal
          abundance in a patient, which is what a normal thymic output looks like. The two arms are not
          strictly incompatible - a partial developmental delay can coexist with a normal emergent repertoire
          - but no source reconciles them, and this node records the open question rather than resolving
          it.'
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: T cell differentiation
          modifier: DECREASED
          term:
            id: GO:0030217
            label: T cell differentiation
        - preferred_term: alpha-beta T cell differentiation
          modifier: DECREASED
          term:
            id: GO:0046632
            label: alpha-beta T cell differentiation
      selected_evidence:
        snippet: Whereas > 50% of cells reached the DP stage in the absence of CME inhibition, only 30–35%
          of chlorpromazine-treated showed progression to the DP stage.
        supports: SUPPORT
