      assertion_type: Diagnosis
      assertion:
        name: Flow cytometry for surface CD4
        description: 'Absence of CD4 on T cells, monocytes and dendritic cells. The finding is unmistakable
          once looked for; the difficulty is that a patient whose only complaint is recurrent warts is
          unlikely to have lymphocyte immunophenotyping requested. Expect a compensatory TCR-alpha-beta+
          CD4-CD8- population rather than simple T cell lymphopenia.

          '
      selected_evidence:
        snippet: All patients lack CD4+ T cells and have increased numbers of TCRαβ+CD4-CD8- T cells
        supports: SUPPORT
