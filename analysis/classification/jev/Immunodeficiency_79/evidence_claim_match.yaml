      assertion:
        name: Biallelic CD4 Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: 'Homozygous rare deleterious CD4 variants that abolish expression of the canonical
          CD4 isoform. The first reported family carried a variant disrupting the translation-initiation
          codon. A shorter expressed isoform that interacts with LCK but not with HLA class II is affected
          by only one of the reported variants, so the cohort is not uniform at the isoform level even
          though it is uniform in losing canonical CD4.

          '
        genes:
        - preferred_term: CD4
          term:
            id: hgnc:1678
            label: CD4
          modifier: LOSS_OF_FUNCTION
        genetic_context:
          description: Germline homozygous CD4 alleles, including a translation-initiation codon variant.
            All impact expression of the canonical CD4 isoform.
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: All patients are homozygous for rare deleterious CD4 variants impacting expression of
          the canonical CD4 isoform. A shorter expressed isoform that interacts with LCK, but not HLA
          class II, is affected by only one variant.
        supports: SUPPORT
