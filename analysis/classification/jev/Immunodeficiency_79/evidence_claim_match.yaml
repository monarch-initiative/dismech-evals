              id: MONDO:0030981
              label: immunodeficiency 79
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absent CD4 Co-Receptor Expression
        biological_scale: CELLULAR
        description: 'CD4 is absent from T cells, monocytes and dendritic cells, and soluble CD4 is absent
          from plasma. In the founding proband this was demonstrated not only in peripheral blood but
          in lymph node, bone marrow, skin and ileum — that is, the loss is systemic and tissue-wide rather
          than a peripheral blood finding. This distinguishes the disease from every acquired or ligand-side
          model of CD4+ T cell loss: it is the co-receptor itself that is gone, including its soluble
          form.

          '
        cell_types:
        - preferred_term: CD4-positive helper T cell
          term:
            id: CL:0000492
            label: CD4-positive helper T cell
          modifier: ABSENT
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        - preferred_term: dendritic cell
          term:
            id: CL:0000451
            label: dendritic cell
      selected_evidence:
        snippet: complete loss of membrane and plasma soluble CD4 in peripheral blood, lymph node, bone
          marrow, skin, and ileum of a homozygous proband
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
