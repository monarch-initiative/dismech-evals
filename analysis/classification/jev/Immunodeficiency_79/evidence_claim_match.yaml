      assertion_type: Diagnosis
      assertion:
        name: CD4 sequencing
        description: 'Molecular confirmation. Worth distinguishing from idiopathic CD4 lymphocytopenia,
          which is an acquired non-Mendelian phenotype of reduced CD4+ T cell counts, and from MHC class
          II deficiency, in which CD4 is present but its ligand is not.

          '
      selected_evidence:
        snippet: This inherited CD4 knockout disease illustrates the clinical and immunological features
          of a complete deficiency of any functional component of CD4 and its similarities and differences
          with other clinical models of primary or acquired loss of CD4+ T cells.
        supports: SUPPORT
