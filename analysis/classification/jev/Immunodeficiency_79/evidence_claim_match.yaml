            term:
              id: MONDO:0030981
              label: immunodeficiency 79
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Compensatory Double-Negative Helper T Cell Development
        biological_scale: CELLULAR
        description: 'The finding that reframes the disease. Patients accumulate TCR-alpha-beta+ CD4-negative
          CD8-negative T cells that resemble conventional helper T cells both phenotypically and transcriptionally.
          Functionally these cells are not a poor substitute: they respond intact to HLA class II-restricted
          antigens and promote B cell differentiation in vitro. Helper immunity is therefore reconstituted
          without the co-receptor, which is why patients acquire effective cellular and humoral immunity
          against an unexpectedly large range of pathogens.

          '
        cell_types:
        - preferred_term: TCR-alpha-beta+ CD4-CD8- T cell
          term:
            id: CL:0000791
            label: mature alpha-beta T cell
          modifier: INCREASED
        biological_processes:
        - preferred_term: T-helper cell differentiation
          term:
            id: GO:0042093
            label: T-helper cell differentiation
        - preferred_term: response to HLA class II-restricted antigen
          term:
            id: GO:0002456
            label: T cell mediated immunity
        - preferred_term: provision of help for B cell differentiation
          term:
            id: GO:0030183
            label: B cell differentiation
      selected_evidence:
        snippet: which phenotypically and transcriptionally resemble conventional Th cells
        supports: SUPPORT
