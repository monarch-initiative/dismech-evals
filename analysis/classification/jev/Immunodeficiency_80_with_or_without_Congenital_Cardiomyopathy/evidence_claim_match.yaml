      assertion_type: Genetic
      assertion:
        name: MCM10
        gene_term:
          preferred_term: MCM10
          term:
            id: hgnc:18043
            label: MCM10
        relationship_type: CAUSATIVE
        notes: 'MCM10 (minichromosome maintenance 10 replication initiation factor) is an essential activator/processivity
          factor of the eukaryotic CMG (CDC45-MCM2-7-GINS) replicative helicase. Both reported kindreds
          carry compound heterozygous variants that together reduce, but do not eliminate, MCM10 function
          (complete biallelic loss of MCM10 is expected to be incompatible with cell viability, since
          MCM10 is essential for DNA replication). The NKD proband carries a hypomorphic missense variant
          (c.1276C>T, p.R426C) together with a nonsense variant (c.1744C>T, p.R582X); the RCM family carries
          a frameshift variant (c.236delG, p.G79EfsTer6) together with a splice-donor variant (c.764+5G>A,
          p.D198GfsTer10). Neither variant set has been observed in homozygosity in population reference
          databases, consistent with very rare autosomal recessive alleles.

          '
      selected_evidence:
        snippet: Minichromosome maintenance protein 10 (MCM10) is essential for eukaryotic DNA replication.
        supports: SUPPORT
