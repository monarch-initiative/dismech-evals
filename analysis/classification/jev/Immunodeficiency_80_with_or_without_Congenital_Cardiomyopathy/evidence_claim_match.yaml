      assertion_type: Pathophysiology
      assertion:
        name: Biallelic MCM10 Hypomorphic/Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: 'Compound heterozygous MCM10 variants reduce functional MCM10 protein below a critical
          threshold. NK-cell-deficiency-associated alleles are a hypomorphic missense variant (p.R426C)
          paired with a nonsense variant (p.R582X); restrictive-cardiomyopathy-associated alleles are
          a frameshift variant (c.236delG) paired with a splice-donor variant (c.764+5G>A). MCM10 is required
          for activation and processivity of the CMG (CDC45-MCM2-7-GINS) replicative helicase.

          '
        biological_processes:
        - preferred_term: DNA replication initiation
          modifier: DECREASED
          term:
            id: GO:0006270
            label: DNA replication initiation
      selected_evidence:
        snippet: 'Here, we describe compound heterozygous MCM10 variants in patients with distinctive,
          but overlapping, clinical phenotypes: natural killer (NK) cell deficiency (NKD) and restrictive
          cardiomyopathy (RCM) with hypoplasia of the spleen and thymus.'
        supports: SUPPORT
