      assertion_type: IUISAssignment
      assertion:
        classification_value: combined immunodeficiency with syndromic features
        notes: Corrected from `innate immunity defect` (2026-08-26). MCM10 deficiency's only table listing
          in the IUIS 2022 update (PMID:35748970) is Table 2 (combined immunodeficiencies with associated
          or syndromic features), sub-section 2, DNA Repair Defects Other Than Those Listed in Table 1
          — the row "MCM10 deficiency (1 patient)", grouped with GINS1 deficiency, which it phenocopies.
          The paper's own prose also lists MCM10 among the new "Combined immunodeficiencies with syndromic
          features (Table 2)". The previous `innate immunity defect` assignment was phenotype-motivated
          (NK cell deficiency alongside MCM4/GINS1/GINS4 as CMG helicase defects) but is not where IUIS
          places MCM10; the paper carries no MCM10 row in Table 6.
      selected_evidence:
        snippet: MCM10 deficiency (1 patient) MCM10 AR 619313 Low or normal Low Normal IgM, IgA, decreased
          IgG
        supports: SUPPORT
