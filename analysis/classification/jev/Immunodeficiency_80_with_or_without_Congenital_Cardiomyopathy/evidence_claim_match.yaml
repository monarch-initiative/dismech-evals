              label: immunodeficiency 80 with or without congenital cardiomyopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chronic Replication Stress and Genomic Instability
        biological_scale: CELLULAR
        description: 'Reduced MCM10 function impairs CMG helicase activity, causing chronic replication
          stress with accumulation of terminally arrested, single-strand-DNA-enriched replication fork
          structures. These abnormal forks require endonucleolytic processing by MUS81; in MCM10:MUS81
          double-mutant cells, viability falls further and telomere shortening accelerates, indicating
          that MUS81-dependent fork processing is a downstream node that itself contributes to (rather
          than merely reads out) the genomic instability.

          '
        biological_processes:
        - preferred_term: DNA damage response
          modifier: INCREASED
          term:
            id: GO:0006974
            label: DNA damage response
        - preferred_term: telomere maintenance
          modifier: DECREASED
          term:
            id: GO:0000723
            label: telomere maintenance
      selected_evidence:
        snippet: MCM10 deficiency causes chronic replication stress that reduces cell viability due to
          increased genomic instability and telomere erosion.
        supports: SUPPORT
