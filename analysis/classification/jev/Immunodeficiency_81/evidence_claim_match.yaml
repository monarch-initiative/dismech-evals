        name: Slp76-null mouse (Lcp2 knockout)
        species: Mouse
        genotype: Slp76 (Lcp2) null (homozygous knockout)
        publication: PMID:9695951
        description: 'The germline Slp76-null mouse, generated by homologous recombination, was the original
          in vivo model of SLP-76 loss. It exhibits impaired viability, a profound thymic developmental
          block, and hemorrhage. It informs the human disease but diverges from it in two ways relevant
          to IMD81: the complete null causes an absolute developmental block with no peripheral T cells
          (human hypomorphic alleles leave dysregulated peripheral T cells), and B-cell development is
          entirely normal (human patients have a B-cell antigen-receptor signaling defect).'
        modeled_mechanisms:
        - target: Impaired Thymic T-Cell Development
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The null reproduces the SLP-76-dependent thymic developmental block, with absence
            of double-positive thymocytes and peripheral T cells.
          limitations: The complete null causes an absolute block with no peripheral T cells, whereas
            human hypomorphic/leaky alleles leave dysregulated peripheral T cells (skewed toward CD8 TEMRA),
            so the null overstates the human developmental defect.
          readouts:
          - name: Double-positive thymocyte and peripheral T-cell content
            target: Impaired Thymic T-Cell Development
            direction: DECREASED
            interpretation: Absence of CD4+8+ double-positive thymocytes and of peripheral T cells is
              the structural correlate of the thymic-development node in this model.
        - target: Combined T- and B-Cell Immunodeficiency
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: 'The Slp76-null mouse does not reproduce the B-cell arm of the human combined immunodeficiency:
            murine B-cell development is entirely normal.'
          limitations: B-cell development is normal in the null mouse, whereas human IMD81 patients have
            a B-cell antigen-receptor signaling defect with reduced class-switched memory B cells and
            antibody deficiency; the null therefore misses the B-cell component of the human phenotype.
      selected_evidence:
        snippet: We generated a SLP-76 null mutation in mice by homologous recombination in embryonic
          stem cells to evaluate the role of SLP-76 in T cell development and activation.
        supports: SUPPORT
