      assertion_type: Pathophysiology
      assertion:
        name: LCP2 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic loss-of-function variants in LCP2 reduce or abolish functional SLP-76 protein.
          Frameshift alleles eliminate the protein; missense alleles in the proline-rich repeat domain
          reduce its expression and signalosome function.
