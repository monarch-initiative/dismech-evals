            TCR signaling (ERK phosphorylation, CD69 induction, calcium mobilization).
          limitations: A transformed leukemic line with fixed-promoter cDNA expression, not primary cells;
            the clonal, supraphysiological context limits quantitative transfer to the patient's cells.
          readouts:
          - name: TCR-induced ERK phosphorylation, CD69 expression and calcium mobilization
            target: Impaired Proximal TCR Signaling
            direction: DECREASED
            interpretation: Reduced ERK, CD69 and calcium responses in the mutant-reconstituted line are
              the readouts of the proximal TCR-signaling node.
        - target: Impaired Proximal TCR Signaling
          relationship: RESCUES
          fidelity: MODERATE
          description: Ectopic expression of wild-type SLP-76 in the deficient line rescues the signaling
            consequences, confirming the defect is SLP-76-dependent and reversible.
          limitations: Rescue is partial and demonstrated in a leukemic cell line rather than in patient
            primary cells or in vivo.
      selected_evidence:
        snippet: we characterized aspects of the patient's immune phenotype, modeled them with an SLP76-deficient
          Jurkat-derived T cell line, and rescued some consequences using ectopic expression of wild-type
          SLP76.
        supports: SUPPORT
