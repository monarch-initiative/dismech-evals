        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: An ultra-rare entity. LCP2/SLP-76 deficiency was first linked to a human disease in 2021,
          and only a small number of unrelated patients have since been reported (an index infant with
          SCID, a patient with EBV-related lymphoma, and a compound-heterozygous patient with milder combined
          immunodeficiency). No population rate can be derived from these case reports.
      selected_evidence:
        snippet: Our current study links this gene, for the first time, to a human immunodeficiency characterized
          by early-onset life-threatening infections, combined T and B cell immunodeficiency, severe neutrophil
          defects, and impaired platelet aggregation.
        supports: SUPPORT
