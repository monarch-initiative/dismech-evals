        name: Impaired Thymic T-Cell Development
        biological_scale: CELLULAR
        description: SLP-76 integrates the pre-TCR signals that drive expansion of CD4+CD8+ double-positive
          thymocytes. In the mouse Slp76 knockout, thymocyte development is blocked at the double-negative
          3 stage, with resulting absence of CD4+CD8+ double-positive thymocytes and peripheral T cells,
          providing the developmental basis for the T-cell lymphopenia seen in severe human cases.
        cell_types:
        - preferred_term: CD4+CD8+ double-positive thymocyte
          term:
            id: CL:0000809
            label: double-positive, alpha-beta thymocyte
        biological_processes:
        - preferred_term: T cell differentiation in thymus
          term:
            id: GO:0033077
            label: T cell differentiation in thymus
          modifier: DECREASED
      selected_evidence:
        snippet: In the SLP76-deficient mouse model, thymocyte development was blocked at the double-negative
          3 stage, resulting in the absence of peripheral T cells.
        supports: SUPPORT
        directness: INDIRECT
