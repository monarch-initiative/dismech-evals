            term:
              id: MONDO:0030308
              label: immunodeficiency 82 with systemic inflammation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: syk_gof_inflammation_and_deficiency_together
        kind: OPEN_QUESTION
        status: OPEN
        prompt: How does a single activating kinase variant produce immunodeficiency and systemic inflammation
          at the same time?
        attaches_to:
        - pathophysiology#Constitutive SYK Kinase Hyperactivation
        - pathophysiology#Impaired Humoral Immunity
        rationale: 'A gain-of-function variant in a proximal immunoreceptor kinase predicts inflammation,
          and that is observed. It does not obviously predict reduced memory B cells, low IgM and IgG,
          and fatal infection, and those are observed too, in the same patients.

          Several accounts are compatible with the curated evidence and none is established by it. Chronically
          hyperactive B cell receptor signalling could drive anergy or deletion rather than productive
          responses, in which case the deficiency is a downstream consequence of the same excess. The
          deficiency could instead be secondary to the inflammatory disease itself - protein loss through
          an ulcerated colon, or the effect of chronic inflammation on lymphopoiesis. Or the two could
          be genuinely independent effects of SYK in different lineages. The distinction matters for treatment:
          if the deficiency is driven by excess signalling then kinase inhibition should improve it, whereas
          if it is a consequence of tissue damage it should follow the colitis instead.'
      selected_evidence:
        snippet: We identified damaging monoallelic SYK variants in six patients with immune deficiency,
          multi-organ inflammatory disease such as colitis, arthritis and dermatitis, and diffuse large
          B cell lymphomas.
        supports: SUPPORT
