      assertion_type: Pathophysiology
      assertion:
        name: Constitutive SYK Kinase Hyperactivation
        biological_scale: MOLECULAR
        description: 'The pivotal node. SYK is the tandem-SH2 kinase recruited to phosphorylated ITAMs
          of B cell receptors, Fc receptors and other immunoreceptors, and it also transduces signals
          from C-type lectin receptors, Toll-like receptors and integrins. The disease variants raise
          its phosphorylation and downstream output. The modifier here is GAIN_OF_FUNCTION rather than
          INCREASED because the claim is qualitative: the kinase escapes its normal regulatory constraint,
          not merely that there is more signalling.'
        molecular_functions:
        - preferred_term: SYK protein tyrosine kinase activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004715
            label: non-membrane spanning protein tyrosine kinase activity
        biological_processes:
        - preferred_term: immune response-regulating cell surface receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0002768
            label: immune response-regulating cell surface receptor signaling pathway
      selected_evidence:
        snippet: The SYK variants increased phosphorylation and enhanced downstream signaling, indicating
          gain of function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
