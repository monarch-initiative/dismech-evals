  c9c14aa9b9e17f6686cac509a054f4cad14559bc496559a8cd7a0b15f1599dc0:
    claim:
      about:
        disease:
          name: Immunodeficiency 82 With Systemic Inflammation
          disease_term:
            preferred_term: immunodeficiency 82 with systemic inflammation
            term:
              id: MONDO:0030308
              label: immunodeficiency 82 with systemic inflammation
        context: []
      assertion_type: Genetic
      assertion:
        name: SYK
        gene_term:
          preferred_term: SYK
          term:
            id: hgnc:11491
            label: SYK
        relationship_type: CAUSATIVE
        notes: 'SYK and ZAP70 are the two tandem-SH2 kinases recruited to phosphorylated ITAMs and are
          functionally paired: ZAP70 acts principally in T and NK cells, SYK in mononuclear phagocytes
          and B cells. The two diseases are mirror images - biallelic ZAP70 loss of function gives a selective
          T cell defect, monoallelic SYK gain of function gives this disorder. dismech already carries
          a ZAP70_Deficiency entry; the pairing is why this entry''s cell types are phagocyte and B cell
          rather than T cell.

          The variant modelled in mouse is the human p.Ser550Tyr, corresponding to mouse Ser544Tyr.

          Allelic series across the six reported patients: p.S550Y (Patient 1, de novo), p.S550F (Patients
          2 and 3), p.P342T (Patient 4, de novo), p.A353T (Patient 5) and p.M450I (Patient 6). The positions
          group into three structural classes that the source distinguishes: p.S550 sits close to the
          two activation-loop tyrosines and away from the ATP pocket; p.M450 sits close to the ATP-binding
          pocket; and p.P342T and p.A353T sit in the interdomain B linker that holds SYK auto-inhibited.
          All are novel or very rare and carry CADD scores above 25. ClinVar accessions SCV001450452 to
          SCV001450456 are cited by the source.'
      selected_evidence:
        snippet: In this study we identify monoallelic gain-of-function variants in SYK that result in
          immunodeficiency and systemic inflammatory disease in humans
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
