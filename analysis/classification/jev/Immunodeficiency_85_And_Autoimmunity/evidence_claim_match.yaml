  62972c01584ef09ea5abe6dff06520633984a62e9cdadf8447b179f53bb74c7c:
    claim:
      about:
        disease:
          name: Immunodeficiency 85 and Autoimmunity
          disease_term:
            preferred_term: immunodeficiency 85 and autoimmunity
            term:
              id: MONDO:0030428
              label: immunodeficiency 85 and autoimmunity
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_why_hsct_failed
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why did haematopoietic stem cell transplantation fail, and is the non-haematopoietic compartment
          the reason?
        attaches_to:
        - treatments#Hematopoietic Stem Cell Transplantation
        - pathophysiology#Impaired Lymphocyte Effector Function
        rationale: 'HSCT replaces the haematopoietic compartment and nothing else. It is the standard
          curative approach for inborn errors of immunity precisely because most of them are diseases
          of haematopoietic lineages.

          The 2025 authors advance a specific answer, and it is worth stating as theirs rather than as
          this entry''s reasoning. TOM1 is a ubiquitous trafficking adaptor rather than an immune-restricted
          gene; the signalling deficit in these patients was demonstrated in fibroblasts, a lineage a
          transplant does not replace; and they propose that persistent poorly-controlled innate signalling
          in those resident cells kept stimulating the replaced immune cells in a self-reinforcing loop,
          which they offer as a plausible explanation for the fatal lung disease. They state it at that
          strength - "potentially account for", "plausible explanation" - so it is a hypothesis with a
          mechanism, not a finding.

          What keeps it open is that three other explanations are live and the evidence does not separate
          them. The discovery paper records that the patient *rejected the allograft* within six months
          and the disease returned, which is a sufficient explanation for relapse on its own and is documented
          rather than inferred. Post-transplant pulmonary fibrosis is a recognised complication in its
          own right. And the fatal organ was already diseased before transplant, so its progression need
          not indicate anything about the graft at all. One patient cannot distinguish these, and the
          fibroblast finding shows the variant acts outside blood without showing that the lung disease
          is cell-autonomous.

          The stakes are practical: if the stromal contribution is real, transplant cannot be curative
          here and the caution the authors extend to other innate-immunity IEIs follows; if rejection
          is the whole story, it says nothing about the approach.'
        proposed_experiments:
        - experiment_id: tom1_lineage_restricted_models
          name: Lineage-restricted TOM1 models to separate haematopoietic from stromal contribution
          description: Generate haematopoietic-restricted and mesenchymal-restricted TOM1 G307D models
            and compare lung and gut pathology, to test whether disease in those organs requires the variant
            in the resident tissue or is driven entirely by transplantable immune cells. A stromal requirement
            would explain the transplant outcome and change the therapeutic target. Note that the rejection
            observed in the index case cannot be modelled this way and would need separating from it clinically,
            in any future transplanted patient, by documenting chimerism alongside organ disease.
      selected_evidence:
        snippet: Impaired inhibition of these pathways in TOM1 G307D patient fibroblasts likely caused
          a vicious circle, offering a plausible explanation for the severe lung inflammation and fibrosis
          to which the patient eventually succumbed.
        supports: SUPPORT
