  6ecdf1a7333335bd07a3c0fd10544ffb5f63c5ed2271b604fd9f248823438183:
    claim:
      about:
        disease:
          name: Immunodeficiency 85 and Autoimmunity
          disease_term:
            preferred_term: immunodeficiency 85 and autoimmunity
            term:
              id: MONDO:0030428
              label: immunodeficiency 85 and autoimmunity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of TOM1 Restraint on TOLLIP Phosphoinositide Binding
        role: amplifier
        biological_scale: MOLECULAR
        description: 'The regulatory step the 2025 work resolves, and the reason this disease is a failure
          of one adaptor to regulate another rather than a simple loss of function.

          The phosphoinositide binding here is TOLLIP''s, not TOM1''s - a distinction worth stating because
          it is easy to attribute to the wrong protein. Purified TOM1 does not bind PtdIns3P-containing
          liposomes at all. What wild-type TOM1 does is *reduce* TOLLIP''s affinity for PtdIns3P, releasing
          TOLLIP from the endosomal membrane and committing both proteins to cargo trafficking. TOM1 G307D
          is significantly less efficient at that inhibition, so TOLLIP remains committed to membrane
          PtdIns3P - which is why the molecular function below is annotated INCREASED rather than lost.'
        molecular_functions:
        - preferred_term: TOLLIP binding to phosphatidylinositol 3-phosphate, no longer restrained by
            TOM1
          term:
            id: GO:0032266
            label: phosphatidylinositol-3-phosphate binding
          modifier: INCREASED
      selected_evidence:
        snippet: However, TOM1 G307D was significantly less efficient in inhibiting TOLLIP phosphoinositide
          association (Fig. 2C), suggesting that some TOLLIP remains committed to membrane PtdIns3P.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
