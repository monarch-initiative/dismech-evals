          one. The 2019 discovery paper, which describes the clinical course in detail, says he died one
          year after the transplant; the 2025 paper says six months post-HSCT. Both are quoted below.

          Curated because a failed treatment is a finding, not an absence of one. The 2025 paper frames
          its own contribution partly in these terms - as insight into the caveats of immunomodulatory
          and stem cell therapy in this disease - and an entry that listed HSCT without its outcome would
          mislead in the direction that matters most.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: hematopoietic stem cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: Attempts to alleviate the severe autoimmunity with several immunomodulating drugs failed,
          and the younger patient, with a more severe phenotype, underwent hematopoietic stem cell transplantation
          (HSCT) but died 6 months post-HSCT owing to lung fibrosis.
        supports: REFUTE
