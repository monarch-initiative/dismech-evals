  4f720d1b4382ac535a1171b801a58101430525a4b38378cbf6d4ab9a35643ddb:
    claim:
      about:
        disease:
          name: Immunodeficiency 85 and Autoimmunity
          disease_term:
            preferred_term: immunodeficiency 85 and autoimmunity
            term:
              id: MONDO:0030428
              label: immunodeficiency 85 and autoimmunity
        context: []
      assertion_type: Treatment
      assertion:
        name: mTOR Inhibitor Therapy
        description: 'Everolimus was given to the severely affected patient on an explicit mechanistic
          rationale: rapalogs induce autophagy, and this is a disease of impaired autophagy. It made him
          worse, with flares of eczema and respiratory distress that settled once the drug was stopped.

          The 2025 work supplies the reason, and it turns the failure into a mechanistic result rather
          than an idiosyncratic reaction. The block in this disease is at autophagosome-lysosome *fusion*,
          not at autophagosome *formation*. An mTOR inhibitor pushes harder on formation, upstream of
          a step that cannot clear, so autophagosomes accumulate further and flux does not improve. The
          corresponding in vitro observation is that rapamycin failed to raise autophagosome numbers in
          patient lymphocytes at all.

          The authors state the clinical implication as caution rather than contraindication, and this
          entry does not strengthen it.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: everolimus
            term:
              id: CHEBI:68478
              label: everolimus
      selected_evidence:
        snippet: Rapamycin and other rapalogs are potent inducers of autophagy, and in an attempt to control
          autoimmunity we treated patient 2 with everolimus. Contrary to our expectations, this led to
          flares of eczema and respiratory distress, symptoms that quickly stabilized once the drug was
          stopped.
        supports: REFUTE
    origin:
