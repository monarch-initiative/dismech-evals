      assertion_type: Pathophysiology
      assertion:
        name: TOM1 GAT-Domain Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'The variant p.Gly307Asp lies in the GAT domain of TOM1, the domain through which
          TOM1 binds TOLLIP and ubiquitin. It is at a locus conserved across species and absent from gnomAD,
          and it does not abolish expression - wild-type and mutant TOM1 are expressed equally, so the
          lesion acts through protein-protein interactions rather than through absence of protein.

          Two interactions are measurably weakened, and they reach the same downstream failure by different
          routes: TOLLIP, which is the route this entry curates in detail, and myosin VI, which acts on
          autophagosome maturation directly. The node is kept to the variant itself so that both routes
          can hang off it.'
      selected_evidence:
        snippet: We report here a heterozygous TOM1 p.G307D missense mutation, detected by whole-exome
          sequencing, in two related patients presenting with early-onset autoimmunity, antibody deficiency,
          and features of combined immunodeficiency.
        supports: SUPPORT
