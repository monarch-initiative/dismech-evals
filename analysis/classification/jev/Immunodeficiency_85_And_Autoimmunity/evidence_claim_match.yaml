            term:
              id: MONDO:0030428
              label: immunodeficiency 85 and autoimmunity
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_single_family_causality
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is TOM1 p.Gly307Asp causative of this syndrome, or is it a rare variant that co-segregated
          with the phenotype in the one family it has been reported in?
        attaches_to:
        - genetic#TOM1
        - pathophysiology#TOM1 GAT-Domain Variant
        rationale: 'Two claims are entangled here and have different amounts of evidence behind them,
          so the gap is about separating them rather than about a shortage of patients as such.

          TOM1 as a disease gene now has two unrelated families: the mother and son with p.Gly307Asp,
          and a subsequently reported child with a severe IPEX-like phenotype carrying a different, likely
          dominant-negative TOM1 splice variant. Two families with concordant immune dysregulation and
          different lesions in the same gene is a meaningfully stronger position than one.

          TOM1 p.Gly307Asp as *this* disease still rests on the original two related patients. Every functional
          experiment curated here was done on their cells, and the 2025 follow-up deepens that characterisation
          rather than adding cases. The functional work establishes that the variant has a specific, reproducible
          molecular effect - loss of the TOLLIP interaction, failure to restrain TOLLIP phosphoinositide
          binding, reduced myosin VI binding, autophagosome accumulation, excess inflammatory signalling.
          That is strong evidence the variant does something. It is weaker evidence that what it does
          is this disease, because a mother and son share far more than one variant, and the severity
          difference between them is itself attributed to unidentified modifiers.

          The 2025 authors state both halves in their own limitations paragraph, and this entry follows
          them: the second family is reported there, and so is the call for a larger cohort in the next
          sentence.

          The practical consequence is for variant interpretation. A GAT-domain TOM1 variant found in
          a new patient can now be read against a gene with two supporting families, but not against a
          case series for any particular allele, because there is none.'
        proposed_experiments:
        - experiment_id: unrelated_tom1_cohort
          name: Targeted TOM1 screening in unexplained combined immunodeficiency with autoimmunity
          description: Screen TOM1 in existing cohorts of genetically unsolved inborn errors of immunity
            presenting with combined immunodeficiency and early-onset autoimmunity, and functionally test
            any GAT-domain variants for the TOLLIP-interaction and myosin VI binding defects that characterise
            p.Gly307Asp. The IPEX-like cohort that found the second family shows the approach works; what
            it did not do is test that patient's variant functionally, so a concordant functional phenotype
            in a third, unrelated carrier is what would settle this.
      selected_evidence:
        snippet: However, since the initial report of these patients (Keskitalo et al., 2019), an unrelated
          child carrying a pathogenic TOM1 variant has been reported (Baxter et al., 2022), with a clinical
          phenotype resembling that of the TOM1 patients discussed here.
        supports: SUPPORT
