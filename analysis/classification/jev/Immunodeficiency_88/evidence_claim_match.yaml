      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'The index patient is homozygous for a loss-of-function TBX21 variant, described
          by the reporting group as autosomal recessive, complete T-bet deficiency. Consistent with the
          rest of the MSMD gene set, in which most etiologies are autosomal recessive complete deficiencies,
          heterozygous carriage is not reported to cause mycobacterial disease. The patient was ascertained
          in a Moroccan MSMD cohort in which 64% of patients were born to consanguineous parents — the
          demographic context in which autosomal recessive MSMD etiologies are found, and the reason BCG-vaccinating,
          TB-endemic, high-consanguinity populations are where further TBX21 cases would be looked for.

          '
      selected_evidence:
        snippet: showed that homozygosity for a T-box transcription factor-21 (TBX21) variant could result
          in MSMD
        supports: SUPPORT
