      assertion_type: Treatment
      assertion:
        name: Antimycobacterial Therapy
        description: 'Prolonged multidrug antimycobacterial chemotherapy is the mainstay of managing the
          mycobacterial disease itself, and is required regardless of which MSMD gene is involved. It
