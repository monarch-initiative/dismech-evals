              label: immunodeficiency 88
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Purely Adaptive IFN-gamma Compensation
        biological_scale: CELLULAR
        description: 'CD8+ alpha-beta T and non-classic CD4+ alpha-beta TH1* lymphocytes are spared by
          the T-bet lesion and produce IFN-gamma normally in response to mycobacterial antigens. They
          nonetheless fail to compensate for the missing innate and innate-like output. This negative
          result is the disease''s central mechanistic finding: it establishes that the innate and innate-like
          IFN-gamma compartments are non-redundant for anti-mycobacterial immunity in humans, and it is
          why the residual adaptive response does not rescue the phenotype.

          '
        cell_types:
        - preferred_term: mycobacterium-specific CD8+ alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        - preferred_term: non-classic CD4+ alpha-beta TH1-star cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
      selected_evidence:
        snippet: Other lymphocyte subsets develop normally but produce low levels of IFN-γ, with the exception
          of CD8+ αβ T and non-classic CD4+ αβ TH1∗ lymphocytes, which produce IFN-γ normally in response
          to mycobacterial antigens.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33296702
