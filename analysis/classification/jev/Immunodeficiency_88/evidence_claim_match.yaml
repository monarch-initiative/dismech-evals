  806199a888357f4479f4a26aa2a2d8492d3036d21b0360522bf21f5fdfb14ad9:
    claim:
      about:
        disease:
          name: Immunodeficiency 88
          disease_term:
            preferred_term: immunodeficiency 88
            term:
              id: MONDO:0030483
              label: immunodeficiency 88
        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant Interferon Gamma
        description: 'Subcutaneous recombinant IFN-gamma is the mechanistically indicated therapy for
          this etiology. TBX21 is not itself a component of the IFN-gamma receptor or the downstream JAK-STAT1
          module, so those are not mutated in this patient; whether the patient''s cells respond normally
          to IFN-gamma has not been directly assayed. This is the therapeutic dividing line within MSMD:
          production defects are candidates for recombinant IFN-gamma, whereas defects abolishing the
          response to the cytokine are not, and are managed with transplantation or gene therapy instead.
          Note that this is a mechanism-based indication for the production arm of MSMD generally; no
          trial or case series of recombinant IFN-gamma in TBX21-deficient patients has been reported.

          '
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: interferon gamma-1b
            term:
              id: NCIT:C100089
              label: Interferon Gamma-1b
        notes: Recorded as a class-level indication, not as an administered treatment. The published TBX21-deficient
          patient was treated with antimycobacterial drugs alone and responded; recombinant IFN-gamma
          is not reported to have been given to him or to any other TBX21-deficient individual.
      selected_evidence:
        snippet: Patients with defects in IFN-γ production may benefit from treatment with recombinant
          human IFN-γ, in addition to antibiotics.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/1
