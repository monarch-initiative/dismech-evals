            term:
              id: MONDO:0030483
              label: immunodeficiency 88
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of T-bet-Dependent B Cell Subset Development and Class-Switch Skewing
        biological_scale: CELLULAR
        description: 'A third consequence of the same lesion, in a third compartment. T-bet is dispensable
          for the bulk of humoral immunity in humans — somatic hypermutation, affinity maturation, memory
          and plasmablast formation, and vaccine-specific antibody titres are all intact — but it is required
          for one specific B cell subset (CD11c-high CD21-low) and it biases immunoglobulin class switching.
          The patient''s isotype profile is skewed toward IgG1, IgG4 and IgE and away from IgG2. The IgE
          limb is not incidental: it runs in the same type-2 direction as the Th2 excess, which is consistent
          with a common loss of T-bet restraint on type 2 responses.

          '
        cell_types:
        - preferred_term: CD11c-high CD21-low B cell
          term:
            id: CL:0000236
            label: B cell
      selected_evidence:
        snippet: Nevertheless, the patient exhibited skewed class switching to IgG1, IgG4, and IgE, along
          with reduced IgG2, both in vivo and in vitro.
        supports: SUPPORT
