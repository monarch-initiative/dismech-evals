  726f36b1889f2d1f54fd0752542a062c642d6fdb429cdf9a0dec232d62b964d3:
    claim:
      about:
        disease:
          name: Immunodeficiency 88
          disease_term:
            preferred_term: immunodeficiency 88
            term:
              id: MONDO:0030483
              label: immunodeficiency 88
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Extended innate and innate-like lymphocyte immunophenotyping
        description: 'Routine immunological testing is unremarkable in MSMD, which is precisely why the
          syndrome is missed. What distinguishes TBX21 deficiency is an extended flow panel covering the
          innate and innate-like compartments — NK, invariant NKT, MAIT and Vdelta2+ gamma-delta T cells
          — all of which are present at extremely low counts here. That combined pattern is close to specific
          for this etiology: no other MSMD gene removes all four lineages, since the others break the
          cytokine circuit rather than the developmental program that builds it. A standard lymphocyte
          subset panel does not include these populations and will look normal.

          '
      selected_evidence:
        snippet: The patient has extremely low counts of circulating Mycobacterium-reactive natural killer
          (NK), invariant NKT (iNKT), mucosal-associated invariant T (MAIT), and Vδ2+ γδ T lymphocytes
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33296702
      reference_title: Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria.
