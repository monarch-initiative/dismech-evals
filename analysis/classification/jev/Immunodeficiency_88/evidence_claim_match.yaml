        context: []
      assertion_type: Diagnosis
      assertion:
        name: Whole blood IL-12 / IFN-gamma activation test
        description: 'The functional screening assay for MSMD. Whole blood is stimulated and both the
          production of IL-12 and IFN-gamma and the response to those cytokines are measured, which localises
          the lesion to the production or the response arm of the circuit before any gene is named. In
          TBX21 deficiency the expected pattern is impaired IFN-gamma production with an intact response
          — the distinction that determines whether recombinant IFN-gamma is a rational therapy.

          '
      selected_evidence:
        snippet: Whole blood activation test was performed to assess both the production of IL-12 and
          IFN-γ and the response to these two cytokines
        supports: SUPPORT
