        context: []
      assertion_type: Treatment
      assertion:
        name: Inhaled Corticosteroid Controller Therapy
        description: 'Standard step-1-to-4 asthma controller therapy, and the first-line management of
          the asthma this patient''s type-2 arm produces. GINA recommends inhaled corticosteroids for
          every asthma patient, daily or as needed, including mild disease. Curated ahead of the type-2
          biologics below because it is the therapy that would actually be given: the biologics are step-5
          options reserved for disease uncontrolled on this, and none has been given to a TBX21-deficient
          patient. Like them, this is extrapolated from the general asthma literature — nothing IMD88-specific
          has been published — but it is the less speculative extrapolation of the two, and treating the
          asthma arm as though only biologics were available would invert the usual evidence gradient.

          Symptomatic control of airway inflammation only. It does not touch the T-bet lesion, the Th2
          skew that drives it, or the mycobacterial-susceptibility arm of the disease, and carries the
          usual caveat that corticosteroid use in a patient with impaired mycobacterial control is a risk-benefit
          judgement rather than a free intervention.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: inhaled corticosteroid therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: inhaled corticosteroid
            term:
              id: CHEBI:24261
              label: glucocorticoid
      selected_evidence:
        snippet: Further, asthma management requires a stepwise approach, escalating and de-escalating
          treatment based on symptom control.
        supports: SUPPORT
