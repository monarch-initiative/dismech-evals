          production of the Th2 cytokines IL-4, IL-5, IL-9 and IL-13 when overexpressed in Th2 cells.
          A single transcription-factor lesion therefore produces two opposite-signed defects at once,
          and this repressive arm is what gives IMD88 an allergic phenotype on top of its infectious one.

          '
