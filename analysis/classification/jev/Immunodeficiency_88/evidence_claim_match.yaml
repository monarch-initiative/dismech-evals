        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Reported course of the index patient
        notes: 'The only published disease course in this genotype, and a single patient''s course rather
          than a natural history for the disorder. Disease presented as mycobacterial disease in childhood
          and was treated; he has since remained in remission and free of mycobacterial infection for
          several years. The specific regimen and its duration are deliberately not stated here: they
          appear in a deep-research summary but in none of the cited sources, and an uncited treatment
          duration is exactly the kind of detail that should not be promoted to entry fact.

          Two features of the course are worth separating. First, if an affected child is ascertained
          through BCG disease, the age at onset is a property of the vaccination schedule rather than
          of the genotype — an affected child in a country that does not give BCG would be expected to
          present later, on exposure to an environmental mycobacterium. Do not read an infantile onset
          as an intrinsic disease property. Second, the type-2 arm did not follow the infection''s trajectory:
          the upper airway inflammation and eosinophilia were reported independently of the mycobacterial
          episode, which is consistent with the two arms being mechanistically separate.'
      selected_evidence:
        snippet: The patient also developed upper airway inflammation and peripheral eosinophilia due
          to TH2-skewing of T-bet-deficient CD4+ T cells
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/0
      context_paths:
