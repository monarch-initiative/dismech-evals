            term:
              id: MONDO:0030483
              label: immunodeficiency 88
        context: []
      assertion_type: Treatment
      assertion:
        name: Dupilumab
        description: 'Dupilumab blocks IL-4 receptor alpha, the shared receptor subunit through which
          both IL-4 and IL-13 signal — two of the four Th2 cytokines this patient''s T-bet-deficient CD4+
          alpha-beta T cells overproduce. It is approved for uncontrolled moderate-to-severe asthma, with
          the largest benefit in patients with elevated blood eosinophils, the same laboratory picture
          recorded in this entry. As with mepolizumab, this is a mechanism-based indication only: no TBX21-deficient
          patient has been treated with dupilumab.

          '
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: dupilumab
            term:
              id: NCIT:C162455
              label: Dupilumab
        notes: 'Recorded as a class-level, mechanism-based indication extrapolated from the general eosinophilic
          asthma population, not as an administered treatment. No case report or series of a TBX21-deficient
          patient receiving dupilumab has been published.

          Benralizumab (anti-IL-5-receptor-alpha) is deliberately not curated, although the openscientist
          deep-research artifact names it alongside mepolizumab. Mepolizumab already represents the anti-IL-5
          axis in this entry, and adding a second agent against the same axis would multiply mechanism-based
          extrapolations without adding a distinct mechanism. Noted so the omission reads as a scoping
          decision rather than an oversight.'
      selected_evidence:
        snippet: patients who received dupilumab had significantly lower rates of severe asthma exacerbation
          than those who received placebo, as well as better lung function and asthma control. Greater
          benefits were seen in patients with higher baseline levels of eosinophils.
        supports: SUPPORT
