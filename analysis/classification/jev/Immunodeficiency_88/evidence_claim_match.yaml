        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of T-bet-Dependent Chromatin Accessibility at Lineage-Defining Loci
        biological_scale: MOLECULAR
        description: 'The molecular step between the transcription-factor lesion and the B cell outcome.
          T-bet governs the CD11c-high CD21-low differentiation program by controlling chromatin accessibility
          at a defined set of lineage-defining genes — FAS, IL21R, SEC61B, DUSP4, DAPP1, SOX5, CD79B and
          CXCR4. Without T-bet those loci do not open: 89% of the 2478 loci differentially regulated in
          stimulated healthy B cells remained unaltered in the patient''s. This is what makes the requirement
          structural rather than a matter of transcriptional tuning, and it is the reason the subset fails
          to form at all rather than forming at reduced numbers.

          '
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: T-bet-dependent chromatin opening at lineage-defining loci
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: DECREASED
      selected_evidence:
        snippet: 89% (2208) of these 2478 differentially regulated loci remained unaltered in CpG/αIg/IFN-γ-stimulated
          T-bet-deficient B cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
