      assertion_type: Discussion
      assertion:
        discussion_id: card10_intrafamilial_variability
        kind: OPEN_QUESTION
        attaches_to:
        - disease#
        prompt: Why did two siblings with the same homozygous CARD10 genotype differ so much in severity
          and age at presentation?
        rationale: The elder brother, who had an unhealthy lifestyle and occupational metal dust exposure,
          developed immunodeficiency and autoimmune disease substantially earlier than his sister, who
          had a milder course. The reporting authors attribute the difference to environmental factors.
          With only two affected individuals described, this is a hypothesis about modifiers rather than
          a demonstrated gene-environment interaction, but it is the only account currently offered for
          the variability and it bears directly on how a future carrier should be counselled.
      selected_evidence:
        snippet: The elder brother, who lived an unhealthy lifestyle and was exposed to metal dust, suffered
          immunodeficiency and autoimmune disease much earlier than his sister.
        supports: SUPPORT
