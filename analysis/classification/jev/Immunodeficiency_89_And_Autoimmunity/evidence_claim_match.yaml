      assertion_type: Pathophysiology
      assertion:
        name: Airway Epithelial CBM Signaling Failure
        biological_scale: TISSUE
        description: CARD10 is expressed in airway epithelium, where the CBM complex drives type-2 cytokine
          production. Its loss is the proposed explanation for the entry's most distinctive clinical dissociation
          - asthma with low rather than raised blood eosinophils - because the eosinophil recruitment
          arm fails while airway hyperresponsiveness does not. The account comes from the Card10-deficient
          mouse airway model rather than from patient airway tissue.
