      assertion:
        discussion_id: card10_imd89_evidence_strength
        kind: KNOWLEDGE_GAP
        attaches_to:
        - disease#
        - genetic#CARD10
        prompt: Is CARD10 established as the cause of immunodeficiency 89 and autoimmunity, or is it still
          a single-family candidate?
        rationale: The entity rests on one consanguineous family with two affected siblings homozygous
          for a single missense variant, reported as a short communication whose authors call the variant
          the possible cause. No independent family has been reported. The gene is biologically plausible
          - its paralogues CARD9, CARD11 and CARD14 all cause recognised immune disease, and CARD10 is
          highly expressed in gastrointestinal epithelium - but plausibility is not replication. Independent
          families, or a ClinGen gene-disease validity assertion, would settle it. The genetic relationship_type
          is recorded as DISPUTED for this reason.
      selected_evidence:
        snippet: we identified aCARD10mutation as the possible cause of a novel form of autosomal recessive
          genetic disease
        supports: SUPPORT
