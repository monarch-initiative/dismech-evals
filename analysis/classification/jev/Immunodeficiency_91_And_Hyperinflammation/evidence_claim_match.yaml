      assertion_type: Pathophysiology
      assertion:
        name: Virally Triggered Hyperinflammatory Episode
        biological_scale: ORGANISM
        description: 'The clinical event that defines the disease: a systemic inflammatory episode precipitated
          by infection, with cytopenia and hepatitis, meeting HLH criteria in half of the affected patients
          in the founding cohort. Two negative findings are load-bearing for the mechanism. NK-cell degranulation
          and cytotoxicity were normal in every patient with HLH, so this is not the cytotoxicity defect
          of familial HLH. And the episodes are accompanied by leukocytosis, which the authors note is
          much less common in classical HLH.

          Episodes are not always infection-locked: some patients progressed after the virus had been
          cleared, and some in the apparent absence of any infectious agent, which is difficult to reconcile
          with a purely trigger-driven model and is one reason the inflammasome arm is attractive.'
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: other patients showed progressive disease even after the virus had been cleared
        supports: SUPPORT
