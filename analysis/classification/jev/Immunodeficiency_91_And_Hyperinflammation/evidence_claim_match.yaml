      assertion_type: DifferentialDiagnosis
      assertion:
        name: Familial hemophagocytic lymphohistiocytosis
        description: The differential that matters most, because ZNFX1 disease presents as HLH and the
          two are separated by mechanism rather than by presentation. Familial HLH is caused by variants
          in six genes that directly impair perforin-mediated cytotoxicity. ZNFX1 patients have normal
          NK-cell degranulation and cytotoxicity, so the pathway that defines familial HLH is intact in
          them.
        distinguishing_features:
        - Normal NK-cell degranulation and cytotoxicity in ZNFX1 deficiency, versus impaired perforin-mediated
          cytotoxicity in familial HLH.
        - Leukocytosis accompanying the inflammatory episodes, which is much less common in classical
          HLH.
      selected_evidence:
        snippet: To date, variants in 6 different genes (PRF1, UNC13D, STXBP2, STX11, RAB27A, and LYST)
          are known to directly affect perforin-mediated cytotoxicity and thereby cause HLH.
        supports: SUPPORT
