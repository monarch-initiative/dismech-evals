      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Interferon-Stimulated Gene Induction
        biological_scale: CELLULAR
        description: 'The defect is dysregulation, not simple loss. Patient cells stimulated with intracellular
          double-stranded nucleic acid over-express interferon-stimulated genes, and the half-life of
          ISG mRNA is altered; baseline ISG expression in patient blood is higher than in controls. Yet
          the same cells respond poorly to soluble poly(I:C) and clear virus less well. Curating this
          node as "reduced interferon response" would misstate the finding: the pathology is an unbalanced
          response whose direction depends on how the nucleic acid is presented.'
        biological_processes:
        - preferred_term: type I interferon-mediated signaling pathway
          term:
            id: GO:0060337
            label: type I interferon-mediated signaling pathway
        cell_types:
        - preferred_term: dermal fibroblast
          term:
            id: CL:0002551
            label: fibroblast of dermis
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Stimulation of patient-derived primary cells with synthetic double-stranded nucleic acids
          was associated with a deregulated pattern of expression of ISGs and alterations in the half-life
          of the mRNA of ISGs and also associated with poorer clearance of viral infections by monocytes.
        supports: SUPPORT
