  4ea8e60969e01d7542c5cc36cddea26a7dda29dd117d20ff65c79ae96e404d50:
    claim:
      about:
        disease:
          name: Immunodeficiency 91 and Hyperinflammation
          disease_term:
            preferred_term: immunodeficiency 91 and hyperinflammation
            term:
              id: MONDO:0030491
              label: immunodeficiency 91 and hyperinflammation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Derepression of the NLRP3 Inflammasome
        biological_scale: MOLECULAR
        description: 'Independently of its sensing role, ZNFX1 restrains the NLRP3 inflammasome by holding
          NLRP3 in the cytoplasm and preventing its accumulation on trans-Golgi-network vesicles in the
          resting state. Loss of that restraint releases caspase-1 activation and IL-1-family cytokine
          maturation. Two features make this the most attractive current explanation for the hyperinflammatory
          pole of the disease: it is a licensing defect rather than a signalling deficiency, and human
          pathogenic ZNFX1 variants fail to rescue it where wild-type ZNFX1 does.

          It is nonetheless graded provisional. The work is in cell lines and mice; no patient-derived
