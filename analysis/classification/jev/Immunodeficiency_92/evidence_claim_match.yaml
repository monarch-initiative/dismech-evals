  351af6ade3d8fa7da2090f15b2c48f4495e133ca1250784a4d91ee6143ce74a1:
    claim:
      about:
        disease:
          name: Immunodeficiency 92
          disease_term:
            preferred_term: c-Rel deficiency (immunodeficiency 92)
            term:
              id: MONDO:0030498
              label: immunodeficiency 92
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Transcription of c-Rel-Dependent Cytokine Genes
        biological_scale: MOLECULAR
        description: 'c-Rel binds the promoters of IL-2, IFN-gamma, IL-12, IL-21 and IL-23. That target
          set is not a random collection: IL-12 and IFN-gamma are the axis controlling macrophage activation
          against intracellular pathogens, IL-2 drives T-cell clonal expansion, and IL-21 is the principal
          T-follicular-helper signal for B-cell class switching and memory formation. The disease phenotype
          can be read almost directly off this promoter list, which is the strongest argument that the
          mechanism is correct despite the tiny patient number.'
        biological_processes:
        - preferred_term: positive regulation of transcription by RNA polymerase II
          modifier: DECREASED
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
        - preferred_term: interleukin-12 production
          modifier: DECREASED
          term:
            id: GO:0032615
            label: interleukin-12 production
        mechanism_confidence: ESTABLISHED
        notes: 'This node was drafted as PROVISIONAL on the reasoning that c-Rel''s promoter targets were
          established from prior immunology but had not been measured in patient cells. That was wrong:
          PMID:34623332 measures the output directly in a c-Rel-deficient patient, and the node is graded
          ESTABLISHED accordingly. The measurement is still n=1, but it is a direct measurement rather
          than an inference.'
      selected_evidence:
        snippet: c-Rel binds to the promoters of genes that encode cytokines important for immunity against
          infectious pathogens, including IL-2, IFN-γ, IL-12, IL-21, and IL-23.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
