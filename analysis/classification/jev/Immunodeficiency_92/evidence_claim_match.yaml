              label: immunodeficiency 92
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Myeloid Antigen-Presenting Cell Failure
        biological_scale: CELLULAR
        description: The arm that the phrase "combined immunodeficiency" hides. c-Rel is required in conventional
          type 1 dendritic cells and monocytes for IL-12 and IL-23 production, and its loss abolishes
          that output - while cDC2s are spared. It is also required for CD86 induction on conventional
          dendritic cells, so the defect is not only cytokine secretion but antigen-presenting capacity
          itself. Since IL-12 from cDC1s is what licenses Th1 differentiation and IFN-gamma-dependent
          macrophage activation, this node explains the mycobacterial and intracellular susceptibility
          without needing to invoke a T-cell-intrinsic defect at all - though the entry models both, because
          both are measured.
        cell_types:
        - preferred_term: conventional dendritic cell
          term:
            id: CL:0000990
            label: conventional dendritic cell
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        biological_processes:
        - preferred_term: interleukin-23 production
          modifier: ABSENT
          term:
            id: GO:0032627
            label: interleukin-23 production
        - preferred_term: antigen processing and presentation
          modifier: DECREASED
          term:
            id: GO:0019882
            label: antigen processing and presentation
        mechanism_confidence: PROVISIONAL
        notes: Graded PROVISIONAL on patient number, not on the quality of the measurement. The experiments
          are direct and internally controlled (cDC1 affected, cDC2 not), but they were performed on one
          patient's cells.
      selected_evidence:
        snippet: c-Rel was also required for induction of CD86 expression on, and thus antigen-presenting
          cell function of, cDCs.
        supports: SUPPORT
    origin:
