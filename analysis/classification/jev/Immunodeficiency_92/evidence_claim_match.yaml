  1cf390efa2be9e8ad8a842c03b9b56fd99296a87a00cf8b0c0fb9787f8fa4d27:
    claim:
      about:
        disease:
          name: Immunodeficiency 92
          disease_term:
            preferred_term: c-Rel deficiency (immunodeficiency 92)
            term:
              id: MONDO:0030498
              label: immunodeficiency 92
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Loss-of-Function REL Variants
        biological_scale: MOLECULAR
        description: 'The primary lesion is biallelic damage to REL, encoding c-Rel. Three homozygous
          alleles are published, all reaching the same endpoint - absent or severely reduced protein -
          by different molecular routes, and two of them are an instructive contrast at the same exon.
          The index patient carried a canonical DONOR splice-site variant AFTER exon 5 (c.535+1G>A), which
          forces use of cryptic donor and acceptor sites and produces an IN-FRAME transcript lacking 54
          nucleotides - 18 residues - within the Rel homology domain, the DNA-binding and dimerisation
          module. The second patient carried the mirror lesion: c.395-1G>A, in the essential ACCEPTOR
          splice site of exon 5, common to both known REL isoforms. Skipping exon 5 there generates a
          FRAMESHIFT and a premature stop at codon 134. Same exon, opposite splice boundary, and a different
          class of consequence. The third patient carried a homozygous frameshift, c.24del p.(Tyr9Ilefs*2),
          introducing a premature stop almost at the start of the coding sequence.'
        genes:
        - preferred_term: REL
          term:
            id: hgnc:9954
            label: REL
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: The mutant transcript lacks 54 nucleotides encoding 18 residues within the Rel homology
          domain
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
