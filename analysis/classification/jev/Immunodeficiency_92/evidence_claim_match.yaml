      assertion_type: Genetic
      assertion:
        name: REL
        gene_term:
          preferred_term: REL
          term:
            id: hgnc:9954
            label: REL
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'REL encodes c-Rel, an NF-kB family transcription factor. Inheritance is autosomal recessive.
          THREE homozygous alleles are published: NM_002908.3:c.535+1G>A, a canonical DONOR splice-site
          variant after exon 5 producing an in-frame 54-nucleotide deletion within the Rel homology domain
          via cryptic splice sites; c.395-1G>A, in the essential ACCEPTOR splice site of exon 5 common
          to both known REL isoforms, where exon-5 skipping frameshifts to a premature stop at codon 134;
          and NM_001291746.4:c.24del p.(Tyr9Ilefs*2), a frameshift creating a very early premature stop.
          All three patients were from consanguineous families - Arabic, Moroccan and Moroccan respectively.
          The first two are worth reading together: the same exon, opposite splice boundaries, and different
          consequence classes (in-frame deletion versus frameshift), both ending in absent protein.

          Functional impact is loss of function for both alleles, demonstrated at protein level by immunoblot
          in each case rather than predicted from the variant class.'
      selected_evidence:
        snippet: 'a homozygous mutation in the canonical donor splice-site after exon 5 of REL (NM_002908.3:
          c.535+1G>A) was considered the most likely pathogenic variant due to the known contribution
          of c-Rel in T and B cell activation and cytokine secretion'
        supports: SUPPORT
