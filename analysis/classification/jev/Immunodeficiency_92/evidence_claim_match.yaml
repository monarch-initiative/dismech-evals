  63e7be254c1d1295cd418dedc6f6c2ecf59786ec460a5bf60e54fb3772f1396f:
    claim:
      about:
        disease:
          name: Immunodeficiency 92
          disease_term:
            preferred_term: c-Rel deficiency (immunodeficiency 92)
            term:
              id: MONDO:0030498
              label: immunodeficiency 92
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absent c-Rel Protein
        biological_scale: MOLECULAR
        description: 'Both patients were shown by immunoblot of peripheral blood mononuclear cells to
          lack c-Rel protein - absent with no detectable truncation product in the index patient, severely
          reduced in the third. The third report adds an important specificity control: p65 (RelA) levels
          were preserved, so the lesion is subunit-selective rather than a general collapse of NF-kB.
          This is what makes the disease informative about c-Rel''s non-redundant role in humans.'
        genes:
        - preferred_term: REL
          term:
            id: hgnc:9954
            label: REL
        biological_processes:
        - preferred_term: canonical NF-kappaB signal transduction
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
        mechanism_confidence: ESTABLISHED
        notes: '`modifier: LOSS_OF_FUNCTION` rather than `DECREASED` is deliberate here. The claim is
          qualitative - one subunit of the canonical NF-kB machinery is missing while the rest is intact,
          so the pathway''s output is altered in composition, not merely reduced in amount. The preserved
          p65 is what licenses that reading.'
      selected_evidence:
        snippet: immunoblotting using an antibody specific to the protein's N-terminus demonstrated the
          absence of c-Rel protein in the patient's peripheral blood mononuclear cells (PBMCs) with no
          detectable truncation products, indicating that the mutation abrogates protein expression
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31103457
      reference_title: Combined immunodeficiency in a patient with c-Rel deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Direct protein-level demonstration that the splice allele abolishes c-Rel, closing
