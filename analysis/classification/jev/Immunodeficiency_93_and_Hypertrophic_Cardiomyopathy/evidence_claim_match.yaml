      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated AMPK and mTORC1 Nutrient Sensing
        biological_scale: MOLECULAR
        description: 'FNIP1 forms a complex with folliculin (FLCN) that couples cellular energy and amino-acid
          status to the two master metabolic regulators: it binds and modulates AMP-activated protein
          kinase (AMPK), and the FLCN-FNIP1 complex acts as a GTPase-activating protein for RagC/D, controlling
          mTORC1 recruitment to the lysosome. FNIP1 additionally interacts with the HSP90 chaperone machinery,
          coupling its own stability to proteostasis. Loss of FNIP1 produces an AMPK phosphorylation (AMPK-P)
          gain-of-function state; in mouse B-cell progenitors both AMPK and mTORC1 are simultaneously
          activated, mTOR is inappropriately localized at the lysosome under nutrient-depleted conditions,
          and the MiT/TFE transcription factor TFE3 accumulates in the nucleus, driving lysosomal biogenesis
          and increased autophagic flux. The lesion is notably not reducible to a single linear "AMPK-high"
          or "mTOR-high" abnormality.

          '
        molecular_functions:
        - preferred_term: AMP-activated protein kinase activity
          term:
            id: GO:0004679
            label: AMP-activated protein kinase activity
          modifier: INCREASED
        - preferred_term: RagC/D GTPase-activating activity of the FLCN-FNIP1 complex
          term:
            id: GO:0005096
            label: GTPase activator activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: mTORC1 (TOR) signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: DYSREGULATED
        - preferred_term: cellular response to nutrient levels
          term:
            id: GO:0031669
            label: cellular response to nutrient levels
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: lysosome
          term:
            id: GO:0005764
            label: lysosome
      selected_evidence:
        snippet: FNIP1 forms a complex with folliculin (FLCN) to regulate the mechanistic target of rapamycin
          complex 1 (mTORC1), functioning as a GTPase-activating protein (GAP) for RagC/D.
        supports: SUPPORT
