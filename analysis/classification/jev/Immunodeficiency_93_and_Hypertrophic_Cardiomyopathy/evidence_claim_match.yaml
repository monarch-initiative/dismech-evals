      assertion_type: Pathophysiology
      assertion:
        name: Pre-B Cell Metabolic Checkpoint Failure and Developmental Arrest
        biological_scale: CELLULAR
        description: 'FNIP1 enforces a metabolic checkpoint that verifies a developing pre-B cell has
