  fa20298f9500abfdbe08c2266040bc401c22e76902c649ef6f8706ccc62c89c8:
    claim:
      about:
        disease:
          name: Immunodeficiency 93 and Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: immunodeficiency 93 and hypertrophic cardiomyopathy
            term:
              id: MONDO:0030528
              label: immunodeficiency 93 and hypertrophic cardiomyopathy
        context: []
      assertion_type: Treatment
      assertion:
        name: Heart Failure Pharmacotherapy
        description: 'Supportive cardiac pharmacotherapy for the hypertrophic cardiomyopathy and its haemodynamic
          consequences. Reported regimens have included an ACE inhibitor (captopril), a loop diuretic
          (furosemide), antiplatelet therapy (acetylsalicylic acid), and carnitine in one patient, and
          digoxin in another. These are symptomatic measures; none targets the underlying AMPK gain-of-function
          lesion.

          '
        notes: 'SAFETY CAVEAT: the afterload-reducing ACE inhibitor and the loop diuretic quoted below
          were used in a patient whose cardiomyopathy was not documented as obstructive. Vasodilators
          and aggressive diuresis are relatively contraindicated in obstructive HCM, where reducing preload
          or afterload worsens the left ventricular outflow tract gradient — and hypertrophic OBSTRUCTIVE
          cardiomyopathy is documented in this same cohort (PMID:39537849). This regimen must therefore
          not be generalised across IMD93 without echocardiographic assessment for outflow tract obstruction.
          No FNIP1-specific cardiology guideline exists; the contraindication is standard HCM management
          rather than a disorder-specific finding, so it is recorded here as a curator note rather than
          as an evidence-backed assertion.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: captopril
            term:
              id: CHEBI:3380
              label: captopril
          - preferred_term: furosemide
            term:
              id: CHEBI:47426
              label: furosemide
      selected_evidence:
        snippet: she is also treated with acetylsalicylic acid, captopril, furosemide, and carnitine achieving
          normal growth and no physical limitations.
        supports: SUPPORT
