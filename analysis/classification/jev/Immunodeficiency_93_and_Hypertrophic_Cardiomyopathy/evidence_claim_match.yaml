  e00f955c1137c123feebc2fab2320ad5dd2b0a582822e8909c647ba47e5dba18:
    claim:
      about:
        disease:
          name: Immunodeficiency 93 and Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: immunodeficiency 93 and hypertrophic cardiomyopathy
            term:
              id: MONDO:0030528
              label: immunodeficiency 93 and hypertrophic cardiomyopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: imd93_neuro_myopathic_features_attribution
        kind: KNOWLEDGE_GAP
        prompt: 'Are the neurologic and myopathic features reported in some FNIP1-deficient patients (microcephaly,
          developmental delay, muscular hypotonia, cerebellar hypoplasia, metabolic myopathy) genuinely
          part of IMD93, or do they reflect additional, as-yet-unidentified genetic factors segregating
          in the consanguineous pedigrees in which they were observed?

          '
        rationale: 'OMIM 619705 and MONDO:0030528 both flag these as inconsistent features that may be
          related to other genetic defects, and the primary literature supplies the reason: CNS involvement
          was reported in 4 of 6 early patients but only in consanguineous pedigrees, where recessive
          homozygosity at unrelated loci is expected to be enriched. FNIP1 is nonetheless plausibly relevant
          to muscle — Fnip1 regulates skeletal muscle fiber-type specification in mice — so the question
          is genuinely open rather than settled in either direction. Curating these as core phenotypes
          on the current evidence would overstate the phenotypic definition; this entry therefore omits
          them.

          '
        attaches_to:
        - pathophysiology#Dysregulated AMPK and mTORC1 Nutrient Sensing
        proposed_experiments:
        - experiment_id: imd93_exp_reanalysis_second_diagnosis
          name: Exome/genome reanalysis for a second recessive diagnosis
          description: 'Systematic reanalysis of exome/genome data from FNIP1-deficient patients with
            neurologic features, searching for a second, unrelated recessive diagnosis that could independently
            explain the CNS phenotype.

            '
          supporting_outcome:
          - Finding no second candidate diagnosis in multiple such patients would support the neurologic
            features being genuinely FNIP1-attributable.
          refuting_outcome:
          - Identifying independent pathogenic biallelic variants at other loci would refute FNIP1 attribution
            for those features.
        - experiment_id: imd93_exp_nonconsanguineous_deep_phenotyping
          name: Deep phenotyping of non-consanguineous FNIP1-deficient patients
          description: 'Neuroimaging, muscle biopsy, and creatine kinase measurement in FNIP1-deficient
            patients from non-consanguineous pedigrees, in whom a co-segregating second recessive disorder
            is far less likely.

            '
          supporting_outcome:
          - Neurologic or myopathic findings in non-consanguineous patients would support these as true
            FNIP1 phenotypes.
          refuting_outcome:
          - Consistently normal neurologic and muscle findings in non-consanguineous patients would argue
            the association is confounded by consanguinity.
        - experiment_id: imd93_exp_conditional_fnip1_deletion
          name: Tissue-specific conditional Fnip1 deletion
          description: 'Conditional Fnip1 deletion in neural and skeletal-muscle lineages in mice to test
            whether neurologic and myopathic features are cell-autonomous consequences of FNIP1 loss.

            '
          supporting_outcome:
          - Cell-autonomous neural or muscle phenotypes on lineage-restricted deletion would support a
            direct FNIP1 role.
          refuting_outcome:
          - Absence of phenotype on lineage-restricted deletion would argue against a direct, cell-autonomous
            FNIP1 contribution.
      selected_evidence:
        snippet: Fnip1 regulates skeletal muscle fiber type specification, fatigue resistance, and susceptibility
          to muscular dystrophy.
        supports: SUPPORT
