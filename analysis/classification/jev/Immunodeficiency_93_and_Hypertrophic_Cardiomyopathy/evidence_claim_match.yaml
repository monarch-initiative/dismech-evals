  03fb29cc2008622f339b36c1c7951c925f870c7672a999a33f29ab1eb046fbda:
    claim:
      about:
        disease:
          name: Immunodeficiency 93 and Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: immunodeficiency 93 and hypertrophic cardiomyopathy
            term:
              id: MONDO:0030528
              label: immunodeficiency 93 and hypertrophic cardiomyopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: FNIP1
        gene_term:
          preferred_term: FNIP1
          term:
            id: hgnc:29418
            label: FNIP1
        relationship_type: CAUSATIVE
        notes: 'Biallelic loss-of-function variants in FNIP1 (chromosome 5q31.1) abolish the FNIP1 protein.
          Reported alleles span nonsense (c.868C>T; c.3334C>T, p.Gln1112*), splice-site (c.3306+1G>A),
          frameshift (c.52_64dup, p.Asp22GlyfsTer21; c.3218delT, p.Leu1073Trpfs*32) and multi-exon deletion
          variants. Two mechanistically instructive "second-hit" configurations have been documented:
          unmasking of a heterozygous variant by uniparental disomy, and hemizygosity created by a de
          novo copy-number deletion spanning FNIP1 on the other allele. FNIP2, the close paralogue, is
          not upregulated to compensate — FNIP2 protein abundance was unchanged in patient cells.

          '
        variants:
        - name: NM_133372.3:c.52_64dup (p.Asp22GlyfsTer21)
          description: 'Homozygous 13-bp duplication in exon 1 of 18 causing a frameshift and premature
            stop; classified likely pathogenic (ACMG).

            '
        - name: NM_133372.3:c.3334C>T (p.Gln1112*)
          description: 'Nonsense variant in exon 17, present in a hemizygous state due to a de novo paternal
            copy-number deletion spanning FNIP1; immunoblotting showed complete absence of FNIP1 protein
            in patient cells.

            '
      selected_evidence:
        snippet: We identified homozygous or compound-heterozygous variants in the gene for folliculin
          interacting protein 1 (FNIP1), leading to loss of the FNIP1 protein.
        supports: SUPPORT
