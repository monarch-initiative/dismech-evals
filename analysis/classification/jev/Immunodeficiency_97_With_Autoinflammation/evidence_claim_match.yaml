        context: []
      assertion_type: Genetic
      assertion:
        name: PIK3CG
        gene_term:
          preferred_term: PIK3CG
          term:
            id: hgnc:8978
            label: PIK3CG
        relationship_type: CAUSATIVE
        notes: 'PIK3CG encodes p110gamma, the catalytic subunit of class IB PI3K. Biallelic loss-of-function
          variants abolish the protein. Because p110gamma is the only class IB catalytic subunit and is
          essentially leukocyte-restricted, the consequences are confined to the immune system rather
          than being systemic.

          There is a protein-level account of how a single residue can do this. Biophysical work on the
          C-terminal residue R1021 shows that immunodeficiency and oncogenic mutations at the same position
          act in opposite directions - inactivating or activating the enzyme - by disrupting regulatory
          C-terminal dynamics. That one residue can be pushed either way is what makes this gene a locus
          for both an inborn error of immunity and a cancer target, and it is the mechanism by which a
          missense change, rather than a truncation, produces a functional null.

          '
      selected_evidence:
        snippet: Phosphatidylinositol 3-kinase-gamma (PI3Kγ) is highly expressed in leukocytes and is
          an attractive drug target for immune modulation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
