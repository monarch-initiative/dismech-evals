        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pik3cg_pro_versus_anti_inflammatory
        kind: KNOWLEDGE_GAP
        prompt: Why did experimental systems disagree about whether PI3Kgamma is pro-inflammatory or anti-inflammatory,
          and does the human loss-of-function phenotype settle it?
        attaches_to:
        - pathophysiology#PIK3CG Loss of Function
        rationale: 'PI3Kgamma is an active drug target for immune modulation, and inhibitors are being
          developed on the premise that blocking it is anti-inflammatory. The human null phenotype points
          the other way for the myeloid arm: losing the kinase increases IL-12 and IL-23 output and produces
          tissue immunopathology. The conflict was explicit in the literature before this patient was
          described and the index report frames its own contribution as addressing it. Recorded here because
          the resolution bears directly on whether PI3Kgamma inhibition carries an autoinflammatory liability,
          which is a question about drugs in development rather than only about this disease.

          The same reading has a therapeutic corollary that this entry deliberately does not model as
          a treatment: if the myeloid arm is driven by unrestrained IL-12 and IL-23, then blocking their
          shared p40 subunit is the mechanistically indicated intervention. No reported patient has been
          given such an agent, so there is nothing to curate under treatments - a mechanistic rationale
          is not a treatment record - and it is noted here instead.'
      selected_evidence:
        snippet: Different experimental systems have led to conflicting conclusions regarding inflammatory
          and anti-inflammatory functions of PI3Kγ.
        supports: SUPPORT
