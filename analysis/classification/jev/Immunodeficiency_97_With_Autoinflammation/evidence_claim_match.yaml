        classification_value: immune dysregulation
        notes: Recorded as immune dysregulation because the defining clinical picture combines a humoral
          deficiency with tissue-infiltrative autoinflammation (T-lymphocytic pneumonitis and colitis)
          and autoimmune cytopenias, with reduced regulatory T cells as the immunological correlate. A
          pure-deficiency classification would not capture the inflammatory half of the phenotype the
          disease is named for.
