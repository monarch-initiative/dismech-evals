      assertion_type: ClinicalBurden
      assertion:
        burden_level: MODERATE
        rationale: The reported patient required blood transfusions and steroids for autoimmune haemolytic
          anaemia at nine, B-cell depletion with rituximab for recurrent cytopenias at seventeen, and
          is on indefinite immunoglobulin replacement plus mycophenolate mofetil. That is chronic, multi-agent,
          lifelong therapy for both halves of the phenotype. Recorded as MODERATE rather than HIGH because
          the disease proved controllable on that regimen and no death or organ failure is reported -
          but the assessment rests on the index patient's course, so it should be read as provisional
          rather than as a population estimate.
      selected_evidence:
        snippet: Patient A.1 is currently treated with immunoglobulin replacement therapy to restore humoral
          protection and mycophenolate mofetil to suppress inflammation.
        supports: SUPPORT
