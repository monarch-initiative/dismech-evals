      assertion_type: Discussion
      assertion:
        discussion_id: pik3cg_microbiota_dependence_human_translation
        kind: HUMAN_MODEL_MISMATCH
        prompt: Is the human disease microbiota-dependent in the way the mouse model is, or is the co-housing
          requirement a property of laboratory mice rather than of PI3Kgamma loss?
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#Unrestrained TLR-Driven Myeloid IL-12 and IL-23 Production
        rationale: The Pik3cg knockout does not display the phenotype under specific-pathogen-free housing;
          it does so only after acquiring natural microbiota from pet-store mice. That is a strong and
          specific mechanistic claim, and it fits the TLR-dependence of the myeloid cytokine defect. But
          specific-pathogen-free housing has no human counterpart - every human carries a microbiota -
          so the experiment that establishes the dependence in mice cannot be run in people, and the human
          patient gives no information about what her disease would look like without microbial exposure.
          This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because the evidence exists and is
          good; what is uncertain is whether the conditionality it demonstrates transfers.
      selected_evidence:
        snippet: Pik3cg-deficient mice recapitulate major features of human disease after exposure to
          natural microbiota through co-housing with pet-store mice.
        supports: SUPPORT
