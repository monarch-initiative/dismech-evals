  703b7563fe817b002fc459b388e67d24fa5a3fb5d2db1aad92c41597af8fa65c:
    claim:
      about:
        disease:
          name: Immunodeficiency 97 With Autoinflammation
          disease_term:
            preferred_term: immunodeficiency 97 with autoinflammation
            term:
              id: MONDO:0030717
              label: immunodeficiency 97 with autoinflammation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pik3cg_two_patient_evidence_base
        kind: KNOWLEDGE_GAP
        prompt: Which features of this entry are properties of the disease, and which are properties of
          the one patient it was defined from - and does the second reported patient's milder humoral
          phenotype reflect residual kinase activity or something else?
        attaches_to:
        - disease#Immunodeficiency 97 With Autoinflammation
        - phenotypes#Decreased circulating immunoglobulin concentration
        rationale: 'Every HUMAN_CLINICAL item in this entry traces to one individual, the index patient.
          That is enough to establish that biallelic PIK3CG loss causes disease in humans - the trio exome,
          the absent protein and the functional cellular work together make that case - but it is not
          enough to distinguish the disease''s core phenotype from this patient''s particular course.
          Frequencies, age at onset, penetrance and burden are therefore recorded either as this patient''s
          values or not at all, rather than as disease-level statistics.

          A second unrelated patient with compound heterozygous PIK3CG variants has been reported (PMID:33054089),
          so the human evidence base is no longer one case. It does not settle the questions above, and
          it opens two of its own.

          The first is phenotypic. That patient presented at fourteen with fever, hyperferritinaemia,
          hypertriglyceridaemia and haemophagocytosis - a macrophage-activation picture that fell short
          of HLH criteria - with an NK-cell defect, and she has been stable on anakinra. The index patient
          presented in childhood with an antibody defect, autoimmune cytopenias and lymphocytic infiltration
          of lung and gut. Both are PI3Kgamma deficiency by genotype; clinically they share little beyond
          immune dysregulation. With two patients, there is no way to tell whether that is a spectrum,
          an allele effect, or two mechanisms that happen to share a gene.

          The second is about residual activity, and the two papers do not agree. The primary report finds
          p110gamma protein expressed at normal levels in the patient''s T cells, and then shows by reconstitution
          that neither variant restores CD69 upregulation - a loss-of-function readout with the protein
          present. A later B-cell study reading the same case calls the kinase potentially hypomorphic,
          on the grounds that serum IgG was normal. Both may be right about different assays, but the
          entry should not assert either as the patient''s residual-activity level, so it records both
          and asserts neither.'
      selected_evidence:
        snippet: Here, we report a human patient with bi-allelic, loss-of-function mutations in PIK3CG
        supports: SUPPORT
