          detail. TLR8 is expressed in the erythroid lineage, and activating it impairs erythropoiesis
          from the progenitor stage onward while inhibiting it enhances erythropoiesis. The mechanism
          is specific: TLR8 activation blocks annexin A2-mediated plasma membrane localisation of STAT5,
          which disrupts erythropoietin signalling. This is an erythroid-intrinsic effect rather than
          a consequence of the marrow inflammation, which is why it is modelled as its own branch from
          the receptor node rather than downstream of the cytokine node.'
        biological_scale: MOLECULAR
