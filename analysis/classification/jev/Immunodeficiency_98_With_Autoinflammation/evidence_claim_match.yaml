      assertion_type: Diagnosis
      assertion:
        name: Targeted deep sequencing for low-variant-allele-fraction somatic TLR8 variants
        description: 'The diagnostic problem in this disease is not recognising the phenotype, it is detecting
          the variant. Eight of ten patients are somatic mosaics with peripheral blood variant allele
          fractions between 7 and 26 per cent, and a germline exome or genome pipeline calling at standard
          heterozygous thresholds will filter those out. The authors state the remedy directly: a high
          index of suspicion, and targeted deep sequencing when standard analysis is negative.

          Two details change the threshold for reaching for it. In female patients the fraction is expected
          to be lower still, because there are two X chromosomes to dilute it - which is precisely the
          group least likely to be suspected in what was described as a male disease. And a negative blood
          test does not exclude the diagnosis, since the mosaicism has been found in skin fibroblasts
          as well.'
        diagnosis_term:
          preferred_term: targeted deep sequencing
          term:
            id: NCIT:C101293
            label: Next Generation Sequencing
      selected_evidence:
        snippet: A high index of suspicion is necessary, as somatic mutations may be missed on standard
          exome and genome analysis, especially in female patients where VAFs may be lower due to the
          presence of 2 X chromosomes.
        supports: SUPPORT
