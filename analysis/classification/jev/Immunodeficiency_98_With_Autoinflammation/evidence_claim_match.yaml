      assertion_type: Pathophysiology
      assertion:
        name: Hypersensitivity of the Endosomal ssRNA Sensor
        description: TLR8 sits in the endosome and recognises single-stranded RNA degradation products,
          signalling through NF-kB. A hypersensitive receptor converts ordinary ligand exposure - which
          for an endosomal RNA sensor is routine - into a disproportionate signal. Myeloid cells differentiated
          from patient-derived induced pluripotent stem cells show the increased responsiveness directly,
          which matters because it locates the defect in the cell rather than in the patient's inflammatory
          milieu.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        biological_processes:
        - preferred_term: toll-like receptor signaling pathway
          term:
            id: GO:0002224
            label: toll-like receptor signaling pathway
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: Differentiation of myeloid cells from patient-derived induced pluripotent stem cells
          demonstrated increased responsiveness to TLR8.
        supports: SUPPORT
