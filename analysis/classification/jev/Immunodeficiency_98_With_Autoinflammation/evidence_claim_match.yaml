  7484675e97288724d401f90765203a656497b0142cc82e07402bdc6be699268d:
    claim:
      about:
        disease:
          name: Immunodeficiency 98 With Autoinflammation
          disease_term:
            preferred_term: immunodeficiency 98 with autoinflammation, X-linked
            term:
              id: MONDO:0024777
              label: immunodeficiency 98 with autoinflammation, X-linked
        context: []
      assertion_type: Treatment
      assertion:
        name: TLR8 Inhibition
        description: 'Preclinical, and the evidence now comes from two directions that need separating.

          In patient cells. Three inhibitors were tested in iPSC-derived macrophages carrying the p.P432L
          variant, the commonest one in this disease. Chloroquine, which raises endosomal pH, and CPG-52364,
          a small-molecule TLR7/8 inhibitor, both suppressed IL-6 production from the gain-of-function
          receptor. CU-CPT9a did not: it inhibited wild-type TLR8 and the p.P432L cells were resistant
          to it. That split is informative beyond the drug screen, because CU-CPT9a works by binding TLR8
          in its inactive conformation - so a variant that resists it is a variant that is not spending
          its time in that conformation, which is what the conformational-gain hypothesis in this entry
          predicts.

          In other erythroid systems. TLR8 inhibition also improves erythropoiesis in RPS19-haploinsufficient
          cells and in CD34-positive cells from healthy donors and from patients with inherited non-haemolytic
          anaemia. That work was done in the context of inherited anaemia rather than in TLR8 gain-of-function
          patients, so it supports the erythroid arm by analogy rather than directly.

          Neither line has reached a patient. There are no clinical data for any TLR8 inhibitor in this
          disease, and the one endosomal-signalling inhibitor that was given to a patient - hydroxychloroquine,
          in one case - had no effect on the neutrophil count.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: we identify a gene implicated in inherited anemia and a previously undescribed role for
          TLR8 in erythropoiesis, which could potentially be explored for therapeutic benefit in inherited
          anemia.
        supports: SUPPORT
