  9e1d047f8d4de3d93761e7bc053412e83da9c493f3c568cfde987660a9656356:
    claim:
      about:
        disease:
          name: Immunodeficiency 98 With Autoinflammation
          disease_term:
            preferred_term: immunodeficiency 98 with autoinflammation, X-linked
            term:
              id: MONDO:0024777
              label: immunodeficiency 98 with autoinflammation, X-linked
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TIRAP-MyD88 Adaptor Assembly and IRAK Activation
        description: 'The step between the receptor and its transcriptional output, and the reason to
          curate it separately is that it is where this disease''s species problem lives.

          TLR8 signals through MyD88, and recent work shows TIRAP - long thought to serve only plasma-membrane
          TLRs - is also recruited to the endosomal TLR8-MyD88 complex, where it is required for late
          IRAK1 activation, IKK phosphorylation and IRF5 nuclear translocation. A peptide that disrupts
          the TIRAP-MyD88 interaction blocks TLR8-induced IFN-beta and IL-12 in human monocytes and whole
          blood, and fails entirely against murine TLR7, because TIRAP is not recruited to MyD88 in mouse
          macrophages after ligand stimulation.

          That last observation matters for this entry specifically. The entry''s argument against a mouse
          model rests on species-specific ligand recognition at the receptor; this adds a second, independent
          divergence one step downstream, in the adaptor complex itself. IRAK-2 shows the same pattern
          from the other direction: human IRAK-2 is required for TLR8-mediated NF-kB and p38 activation
          in primary human cells, where the inbred mouse knockout said it was not needed.

          Note the gain-of-function claim here is inferred, not measured. No study has shown the adaptor
          complex assembling excessively in TLR8-GOF patient cells; what is established is that the step
          is required, and that the receptor above it is hypersensitive.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        biological_processes:
        - preferred_term: MyD88-dependent toll-like receptor signaling pathway
          term:
            id: GO:0002755
            label: MyD88-dependent toll-like receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: In primary human monocytes and a whole blood model, P7-Pen inhibited TLR7- and TLR8-induced
          expression and secretion of IRF5-regulated cytokines IFNβ, IL-12p40, and IL-12p70, without effect
          on TNF or IL-6.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41159953
      reference_title: A novel TIRAP-MyD88 inhibitor blocks TLR7- and TLR8-induced type I IFN responses.
      evidence_source: IN_VITRO
      explanation: 'That the adaptor step is required for part of the TLR8 cytokine output, and which
        part: the IRF5-regulated arm rather than TNF or IL-6. Worth noting because the patient cell readout
        used elsewhere in this entry is IL-6.'
