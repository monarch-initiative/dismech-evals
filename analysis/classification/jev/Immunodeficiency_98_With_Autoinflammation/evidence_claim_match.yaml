          group least likely to be suspected in what was described as a male disease. And a negative blood
          test does not exclude the diagnosis, since the mosaicism has been found in skin fibroblasts
          as well.'
        diagnosis_term:
          preferred_term: targeted deep sequencing
          term:
            id: NCIT:C101293
            label: Next Generation Sequencing
      selected_evidence:
        snippet: This not only has repercussions for the diagnostic workup of these disorders, inasmuch
          that routine genetic testing may miss somatic variants, but has therapeutic implications as
          well, for example, with the approach to curative treatment, such as hematopoietic stem cell
          transplantation.
        supports: SUPPORT
