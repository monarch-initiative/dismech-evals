              id: MONDO:0024777
              label: immunodeficiency 98 with autoinflammation, X-linked
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Human TLR8 transgenic mouse crossed onto a lupus background
        species: Mouse
        genotype: Transgenic expression of human TLR8, crossed with a lupus-prone strain
        publication: PMID:41370196
        description: 'The humanised route around this disease''s species problem. A knock-in mouse carrying
          the homologous substitution would not help, because murine TLR8 does not recognise the same
          ligands - that objection stands. Putting the human receptor into a mouse sidesteps it, and that
          experiment has been done: mice transgenic for human TLR8, crossed onto a lupus background, develop
          fatal anaemia driven by myeloid cell dysregulation.

          The authors of the patient cohort cite it as indicating a potential mechanism for the pure red
          cell aplasia in their own patients, which is why it is curated here rather than treated as unrelated
          lupus work. It converges on the erythroid arm this entry models, and by a myeloid route rather
          than an erythroid-intrinsic one, which is a different account from the erythroid-intrinsic TLR8
          signalling reported in inherited anaemia.

          Two things it is not. It is not a model of TLR8 gain of function - the transgene is wild-type
          human TLR8, and what is varied is dose and background, not receptor activity. And the anaemia
          arises on a lupus-prone background that contributes its own autoimmunity, so the phenotype cannot
          be attributed to TLR8 alone.'
        modeled_mechanisms:
        - target: TLR8-Driven Blockade of EPO Signaling in Erythroid Progenitors
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Produces the organism-level outcome this arm ends in - fatal anaemia - and attributes
            it to myeloid dysregulation. It does not reproduce the node itself, which is a molecular claim
            about EPO receptor signalling in erythroid progenitors.
          limitations: The transgene is wild-type human TLR8, not a gain-of-function variant, so the model
            tests the consequence of human TLR8 activity in a mouse rather than the consequence of this
            disease's variants. The lupus-prone background contributes autoimmunity of its own and is
            required for the phenotype. Transgenic expression is not the mosaic, low-variant-allele-fraction
            state patients are in. And the mechanism reported is myeloid dysregulation, whereas the node
            it is linked to is erythroid-intrinsic.
          divergences:
          - divergence_type: CONTESTED_ASSUMPTION
            materiality: QUALIFYING
            description: The model assumes that expressing human TLR8 at transgenic levels in a mouse
              is equivalent to a hypersensitive human TLR8 in a subset of human myeloid cells. The equivalence
              is between quantity of normal receptor and quality of abnormal receptor, and this entry's
              own conformational-gain hypothesis argues those are different lesions.
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The model's quantity is fatal anaemia in a whole animal. The node's quantity
              is blocked EPO receptor signalling in erythroid progenitors. The model reports the outcome
              and not the mechanism, and reaches it by a myeloid route rather than the erythroid-intrinsic
              one the node describes.
          - divergence_type: POPULATION_MISMATCH
            materiality: QUALIFYING
            description: A lupus-prone inbred background is not the genetic context of these patients,
              and the phenotype requires it. No anaemia is reported from the human TLR8 transgene alone.
      selected_evidence:
        snippet: a recent study that crossed transgenic mice expressing human TLR8 with lupus mice demonstrated
          that expression of human TLR8 in lupus mice induces fatal anemia via myeloid cell dysregulation,16
          indicating a potential mechanism in our patients.
        supports: SUPPORT
        directness: INDIRECT
