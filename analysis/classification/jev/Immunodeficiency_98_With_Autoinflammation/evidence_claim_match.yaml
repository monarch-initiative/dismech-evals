        snippet: 'TLR8 recognized two degradation products of ssRNA—uridine and a short oligonucleotide—at
          two distinct sites: uridine bound the site on the dimerization interface where small chemical
          ligands are recognized, whereas short oligonucleotides bound a newly identified site on the
          concave surface of the TLR8 horseshoe structure.'
        supports: SUPPORT
