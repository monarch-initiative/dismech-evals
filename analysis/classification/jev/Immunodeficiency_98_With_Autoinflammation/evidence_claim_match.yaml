              label: immunodeficiency 98 with autoinflammation, X-linked
        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked dominant, frequently somatic mosaic
        description: TLR8 is at Xp22.2. The disease was first described in males, but a female patient
          with a germline variant has since been reported, which establishes the mode as X-linked dominant
          rather than X-linked recessive. Most patients carry the variant as a post-zygotic somatic mosaic
          rather than in the germline, and mosaicism has been demonstrated outside the haematopoietic
          compartment in skin fibroblasts - so the mutational event is early and not confined to blood.
        inheritance_term:
          preferred_term: X-linked dominant inheritance
          term:
            id: HP:0001423
            label: X-linked dominant inheritance
      selected_evidence:
        snippet: TLR8 GOF is an X-linked dominant disorder that should be considered in male and female
          patients with cytopenia, particularly severe neutropenia, lymphoproliferation with immune dysregulation,
          increased LGLs, and new to this cohort, red cell aplasia.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41370196
      reference_title: Clinical characteristics, management, and hematopoietic cell transplantation of
        patients with TLR8 gain-of-function.
      evidence_source: HUMAN_CLINICAL
      explanation: States the inheritance mode explicitly, and the female patient is what changed it from
        the X-linked recessive assumption of the original male-only cohort.
