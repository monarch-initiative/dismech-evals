              label: immunodeficiency 98 with autoinflammation, X-linked
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: low_vaf_mosaic_sufficiency
        hypothesis_label: How a somatic clone at 7-26 per cent variant allele fraction produces the full
          phenotype
        status: EMERGING
        description: 'Eight of the ten reported patients are somatic mosaics with peripheral blood variant
          allele fractions between 7 and 26 per cent. A minority of hypersensitive cells is therefore
          sufficient to produce severe, refractory, transplant-requiring disease. The original authors
          read this as evidence of a dominant mechanism.

          What "dominant" means here is the open part, but the authors are not neutral between the two
          readings and this entry should not present them as though they were. They call the neutropenia
          likely cell-extrinsic, on the grounds that patients with the variant in a small fraction of
          cells carry a large burden of disease, and they make a sharper version of the same argument
          for the lymphoid arm: T and B cells do not express TLR8 at all, so whatever is dysregulating
          them cannot be acting inside them.

          They also name candidates for the intermediate, which is the step the pathograph leaves as INDIRECT_UNKNOWN_INTERMEDIATES.
          By analogy with the neutropenia of large granular lymphocyte leukaemia, the proposals are high
          soluble Fas ligand triggering apoptosis of neutrophil and myeloid progenitors, and direct destruction
          by infiltrating T cells. Soluble Fas ligand has been measured as elevated in these patients,
          so the first is a candidate with a measurement behind it rather than a guess.

          What remains genuinely open is whether either candidate is doing the work. A cell-autonomous
          account would require the mutant clone to have a competitive advantage that the data do not
          establish; the cell-extrinsic account fits the observed picture and explains why transplantation
          with full donor chimerism resolves the phenotype, but neither candidate intermediate has been
          tested in these patients.

          Two practical consequences follow regardless of which is right. A germline-only variant calling
          pipeline at standard heterozygous thresholds will miss most of these patients, and a negative
          blood test does not exclude the disease, since mosaicism has been found in fibroblasts.'
      selected_evidence:
        snippet: Eight patients had somatic mosaicism with peripheral blood variant allele fractions of
          7% to 26%, and age of disease onset of 9 months to 28 years.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
