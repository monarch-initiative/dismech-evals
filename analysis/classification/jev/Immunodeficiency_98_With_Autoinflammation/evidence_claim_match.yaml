          for an endosomal RNA sensor is routine - into a disproportionate signal. Myeloid cells differentiated
          from patient-derived induced pluripotent stem cells show the increased responsiveness directly,
          which matters because it locates the defect in the cell rather than in the patient's inflammatory
          milieu.
        biological_scale: CELLULAR
