  3a3cef5875b012699c7e7932191b70368fbc53c7c3f705477c86602b858d0351:
    claim:
      about:
        disease:
          name: Immunodeficiency 98 With Autoinflammation
          disease_term:
            preferred_term: immunodeficiency 98 with autoinflammation, X-linked
            term:
              id: MONDO:0024777
              label: immunodeficiency 98 with autoinflammation, X-linked
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: conformational_gain_not_receptor_gain
        hypothesis_label: Whether gain of function here is conformational stabilisation rather than more
          receptor
        status: EMERGING
        description: 'The A518T allele produces more NF-kB activation and more cytokine from *less* protein:
          turnover assays show reduced abundance of the mutant, through faster proteasomal degradation.
          So whatever "gain of function" means in this disease, it is not gain of receptor.

          The proposal is that the substitution stabilises the *active* TLR8 homodimer interface - computational
          modelling predicts additional water-mediated hydrogen bonds there - so each remaining receptor
          spends more of its time in the signalling conformation. That is consistent with the ligand-hypersensitivity
          phenotype the founding cohort reported, and it would explain why a somatic clone at low variant
          allele fraction suffices, since the effect is per-receptor rather than per-cell.

          It is one allele, and the structural claim is a prediction rather than a solved structure. Whether
          the other reported variants share the mechanism has not been tested; they were characterised
          as gain of function by reporter activity, which does not distinguish more receptor from better
          receptor.'
      selected_evidence:
        snippet: Protein degradation and turnover assays revealed reduced abundance of the mutant TLR8
          protein due to faster turnover and increased proteasomal degradation.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41729082
      reference_title: Structural modeling and functional characterization of a novel gain-of-function
