    evidence_metadata:
      reference: PMID:17984804
      reference_title: Deficiency of mannose-binding lectin-associated serine protease-2 associated with
        increased risk of fever and neutropenia in pediatric cancer patients.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The clearest positive clinical signal in the literature, and the support is indirect
        in two ways: deficiency here is a low serum MASP-2 concentration rather than a genotype, and the
        children were neutropenic from chemotherapy, so the finding bears on MASP-2 as a contributory
        factor under a second immune defect rather than on the deficiency alone.'
