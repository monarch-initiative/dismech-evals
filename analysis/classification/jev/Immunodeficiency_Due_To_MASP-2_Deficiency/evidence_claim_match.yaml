            term:
              id: MONDO:0013423
              label: immunodeficiency due to MASP-2 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MASP2 p.D120G Loss of Binding to Lectin Pathway Recognition Molecules
        biological_scale: MOLECULAR
        description: 'MASP-2 circulates in complexes with the recognition molecules of the lectin pathway
          and is activated when one of them binds a microbial or altered-self surface. The p.D120G substitution
          falls in the region that mediates that association: recombinant D120G MASP-2 does not bind mannose-binding
          lectin, so the enzyme is never recruited to a recognised surface. The variant is found in Europeans
          and in Inuit from West Greenland and not in the other populations surveyed.'
        genetic_context:
          gene:
            preferred_term: MASP2
            term:
              id: hgnc:6902
              label: MASP2
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: MASP-2 serine protease activity on recognised surfaces
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
          modifier: DECREASED
      selected_evidence:
        snippet: We found that D120G and CHNHdup could not associate with MBL, whereas R99Q, P126L, H155R,
          V377A, R439H, and wild-type MASP-2 bound equally well to MBL.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19234189
      reference_title: Polymorphisms in mannan-binding lectin (MBL)-associated serine protease 2 affect
        stability, binding to MBL, and enzymatic activity.
      evidence_source: IN_VITRO
      explanation: The direct demonstration, in recombinant protein, that D120G abolishes the interaction
        with the recognition molecule. This is what LOSS_OF_FUNCTION rests on, and it distinguishes D120G
        from the several MASP2 polymorphisms that bind normally.
