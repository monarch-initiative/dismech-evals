            term:
              id: MONDO:0013423
              label: immunodeficiency due to MASP-2 deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: MASP2
        gene_term:
          preferred_term: MASP2
          term:
            id: hgnc:6902
            label: MASP2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'p.D120G is the allele behind essentially every reported European case. Other MASP2 missense
          alleles lower the protein or its activity without abolishing pathway function - V377A lowers
          serum levels with normal enzyme activity, P126L gives serum that is non-functional in homozygotes
          (PMID:17252003) although recombinant P126L cleaves C4 with activity comparable to wild-type
          (PMID:19234189) - the two results are reported together rather than reconciled - R439H binds
          mannose-binding lectin but cannot autoactivate and is common in sub-Saharan Africa - so a MASP2
          variant and MASP-2 deficiency are not interchangeable.

          The geographic distribution of the D120G allele has been read as selection for low lectin-pathway
          activity: a Siberian survey found it commoner in Russians than in the Nenets and Dolgan-Nganasan
          aboriginal populations. That is a hypothesis the authors advance, not a demonstrated history.

          No ClinGen gene-disease validity assertion is recorded here because none was found for this
          pair; gene_disease_validity is left absent rather than filled with a curator''s own tier.'
        variants:
        - name: p.D120G
          description: MASP2 c.359A>G, rs72550870. Abolishes association with mannose-binding lectin and
            so prevents lectin-pathway C4 cleavage; homozygosity is the deficiency state.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: In Europeans, MASP-2 deficiency, due to homozygosity for c.359A > G
        supports: SUPPORT
