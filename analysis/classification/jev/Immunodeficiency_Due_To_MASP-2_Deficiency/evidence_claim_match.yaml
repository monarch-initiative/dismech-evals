      assertion_type: Pathophysiology
      assertion:
        name: Reduced Lectin Pathway Opsonization of Microbial Surfaces
        biological_scale: CELLULAR
        description: 'With no lectin-pathway C4 cleavage, complement opsonins are not deposited by this
          route, and complement-receptor-mediated uptake of the organism by neutrophils and macrophages
          is correspondingly reduced. This is the mechanism the classification of MASP-2 deficiency as
          a primary immunodeficiency assumes. Whether it produces measurable susceptibility in people
          is the entry''s central open question: the classical and alternative pathways still opsonise,
          and the evidence below runs both ways.'
        cell_types:
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: opsonization
          term:
            id: GO:0008228
            label: opsonization
          modifier: DECREASED
        - preferred_term: phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: In this study, MASP-2 deficiency was associated with an increased risk of FN in children
          treated with chemotherapy for cancer.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
