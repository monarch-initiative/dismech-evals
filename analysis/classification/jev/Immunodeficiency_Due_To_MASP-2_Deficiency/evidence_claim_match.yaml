        - preferred_term: phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: Total absence of lectin pathway functional activity did not confer higher susceptibility
          to T. cruzi infection, suggesting that it plays a minor role in the immune response against
          this parasite.
        supports: REFUTE
