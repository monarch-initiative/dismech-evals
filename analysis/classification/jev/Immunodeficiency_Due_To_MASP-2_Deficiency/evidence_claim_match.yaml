        notes: 'The functional counterpart of the concentration measurement, and the one that distinguishes
          a deficiency state from a merely low level: homozygotes have no lectin-pathway activity, whereas
          heterozygotes have reduced protein with preserved activity.

          The two cohorts cited below disagree on heterozygote function. The neonatal cohort (PMID:19307021)
          found heterozygosity lowered the protein but not pathway activity; the cystic fibrosis cohort
          (PMID:15654829) found pathway function reduced in carriers of a mutant MASP-2 allele, who in
          that series were mostly heterozygous. The disagreement is left standing rather than resolved,
          because the two measured different populations with different assays.'
      selected_evidence:
        snippet: Heterozygosity for this allele significantly influenced the protein concentration, but
          not the lectin pathway of complement activity
        supports: SUPPORT
