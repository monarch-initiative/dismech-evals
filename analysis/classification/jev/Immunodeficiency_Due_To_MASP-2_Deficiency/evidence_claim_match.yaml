      assertion_type: Pathophysiology
      assertion:
        name: Impaired Lectin Pathway Antiviral Activity
        biological_scale: CELLULAR
        description: Two adults with herpes simplex encephalitis carried rare heterozygous MASP2 missense
          variants, G634R and R203W, which reduce or abolish secretion of the protein and, for G634R,
          prevent autoactivation of the zymogen and reduce antiviral activity in vivo. This node is a
          different genetic architecture from the rest of the entry - rare heterozygous alleles in adults,
          not D120G homozygosity - and the association rests on two cases, so the node records a proposed
          antiviral role for the pathway rather than an established mechanism of MASP-2 deficiency.
      selected_evidence:
        snippet: Altogether, these data suggest that MASP-2 deficiency can increase susceptibility to
          adult HSE.
        supports: SUPPORT
        directness: INDIRECT
