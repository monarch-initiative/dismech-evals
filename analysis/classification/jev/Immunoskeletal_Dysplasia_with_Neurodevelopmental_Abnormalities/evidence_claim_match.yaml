      assertion:
        discussion_id: isdna_visceral_cyst_mechanism
        kind: KNOWLEDGE_GAP
        prompt: 'By what mechanism does EXTL3 deficiency produce hepatic and renal cysts, and are the
          cysts a direct consequence of the heparan sulfate defect?

          '
        attaches_to:
        - phenotypes#Hepatic Cysts
        - phenotypes#Renal Cysts
        rationale: 'Hepatic (and less often renal) cysts are a recurrent, sometimes prenatal feature of
          ISDNA, unusual enough in infancy that the original authors judged the association non-fortuitous
          — yet no study has proposed or tested a mechanism connecting aberrant heparan sulfate to biliary
          or renal tubular cystogenesis. No causal edge is asserted for these phenotypes because the mechanistic
          route is genuinely unknown, not merely uncurated.

          '
        proposed_experiments:
        - experiment_id: exp_isdna_cyst_histopathology
          name: Histopathological characterization of ISDNA visceral cysts
          description: Histological and immunohistochemical characterization of hepatic and renal cysts
            from affected individuals (biopsy or autopsy material), including ductal-plate and primary-cilium
            markers, to classify the cysts against known ciliopathy and ductal-plate-malformation entities.
      selected_evidence:
        snippet: Because of its rarity in infants, the association of the liver cyst seems not fortuitous;
          however, further characterization of the disorder is necessary to determine its clinical significance
          and the relation to the mutation.
        supports: SUPPORT
