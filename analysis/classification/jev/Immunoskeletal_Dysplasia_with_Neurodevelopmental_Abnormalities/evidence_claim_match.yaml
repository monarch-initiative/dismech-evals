          iPSCs show reduced expansion of lymphohematopoietic progenitors together with defective differentiation
          of thymic epithelial progenitors (reduced TBX1, EYA1, and CK5 with persistent SOX17). extl3-mutant
          zebrafish crossed to a rag2:GFP thymic reporter show roughly halved thymic volume, rescued by
