              label: immunoskeletal dysplasia with neurodevelopmental abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: isdna_immune_severity_modifiers
        kind: KNOWLEDGE_GAP
        prompt: 'What modifiers determine whether an individual with biallelic EXTL3 variants develops
          Omenn-like SCID versus a clinically intact immune system?

          '
        attaches_to:
        - pathophysiology#T-Cell-Predominant Immunodeficiency
        rationale: 'Immunological severity is discordant between individuals homozygous for the identical
          EXTL3 allele — including unrelated patients sharing p.Pro318Leu or p.Pro461Leu — while the skeletal
          phenotype stays comparatively uniform. Variant position therefore does not predict immune outcome,
          and the responsible genetic or environmental modifiers are unidentified. This is the single
          largest barrier to prognostication and to deciding which infants warrant transplant evaluation.

          '
        proposed_experiments:
        - experiment_id: exp_isdna_modifier_screen
          name: Modifier screening across the reported ISDNA cohort
          description: Genome-wide modifier screening across the full reported ISDNA cohort, focusing
            on heparan-sulfate-biosynthesis and thymic-development loci, to identify variants segregating
            with immunological severity independently of the EXTL3 genotype.
        - experiment_id: exp_isdna_isogenic_ipsc_background_swap
          name: Isogenic iPSC background-swap panel
          description: Isogenic iPSC panels carrying each EXTL3 allele on shared and divergent genetic
            backgrounds, differentiated to thymic epithelial progenitors and lymphohematopoietic progenitors,
            to test whether genetic background alone reproduces the observed divergence in immune severity.
      selected_evidence:
        snippet: Notably, patients harbouring the same variant in EXTL3 gene show phenotypic variability
          especially with respect to presence or absence of immunological manifestations, suggesting a
          role of unknown modifiers.
        supports: SUPPORT
    origin:
