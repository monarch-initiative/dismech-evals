      assertion:
        name: Molecular confirmation by exome or genome sequencing
        description: 'There are no formal consensus diagnostic criteria. Diagnosis rests on molecular
          confirmation of biallelic EXTL3 variants, typically by trio exome or genome sequencing (or a
          skeletal-dysplasia / inborn-error-of-immunity panel containing EXTL3), with familial segregation
          confirmed by Sanger sequencing. Because the radiographic phenotype overlaps several morphologically
          similar spondyloepimetaphyseal dysplasias, sequencing is what discriminates the entity rather
          than imaging alone.

          '
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
