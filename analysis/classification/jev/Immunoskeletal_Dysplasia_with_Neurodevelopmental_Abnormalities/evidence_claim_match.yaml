  e2e8ea0a84f37897ef35c4b9aadd78fc24bf7731522ab53d1dc77beee626f58d:
    claim:
      about:
        disease:
          name: Immunoskeletal Dysplasia with Neurodevelopmental Abnormalities
          disease_term:
            preferred_term: immunoskeletal dysplasia with neurodevelopmental abnormalities
            term:
              id: MONDO:0044312
              label: immunoskeletal dysplasia with neurodevelopmental abnormalities
        context: []
      assertion_type: Genetic
      assertion:
        name: EXTL3
        gene_term:
          preferred_term: EXTL3
          term:
            id: hgnc:3518
            label: EXTL3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'EXTL3 (chromosome 8p21.2) encodes a Golgi bi-domain glycosyltransferase carrying GT47
          and GT64 domains. It acts as N-acetylglucosaminyltransferase-I and -II, transferring GlcNAc
          from UDP-GlcNAc both to the tetrasaccharide linkage region (initiating the HS chain) and to
          the growing glucuronic acid terminus (elongating it). All reported ISDNA alleles are germline
          missense variants that reduce, but do not abolish, enzyme activity — consistent with the embryonic
          lethality of complete Extl3 loss in mouse. Reported alleles include c.953C>T (p.Pro318Leu),
          c.1015C>T (p.Arg339Trp), c.1382C>T (p.Pro461Leu), c.1537C>T (p.Arg513Cys), c.1970A>G (p.Asn657Ser),
          c.2008T>G (p.Tyr670Asp), and c.2015G>A (p.Arg672Gln).

          Two features of the allelic spectrum are notable. First, every reported disease allele to date
          is a missense change and all cluster in exon 3 — no nonsense, frameshift, or whole-gene deletion
          allele has been reported in a surviving patient, which is the human genetic counterpart of the
          embryonic lethality of complete Extl3 loss in mouse and implies that ISDNA is a partial-loss-of-function
          disease with a floor below which the genotype is not viable. Second, ISDNA alleles are essentially
          private: the variants were absent from dbSNP, 1000 Genomes, ExAC, ESP6500, and HGMD at the time
          of first reporting, or present only at very low frequency, consistent with a severe recessive
          disorder under selection. Penetrance of the skeletal phenotype appears complete in reported
          biallelic individuals, whereas the immune phenotype is incompletely penetrant even within a
          genotype (see the immune_severity_modifiers hypothesis).

          Beyond disease genetics, EXTL3 occupies the branch point of glycosaminoglycan biosynthesis:
          acting on the shared tetrasaccharide linker, it adds the GlcNAc that commits a chain to the
          heparan sulfate rather than chondroitin sulfate fate, and it does so with a preference for heparan-sulfate
          proteoglycan core-protein substrates. This is the biochemical reason an EXTL3 lesion perturbs
          HS specifically, and it is also why the disease biomarker is a chondroitin-disaccharide excess
          — the linker traffic that EXTL3 fails to commit to HS is measurable on the other branch.'
      selected_evidence:
        snippet: EXTL3 encodes N-acetylglucosaminyltransferase-I (GlcNAcT-I) and GlcNAcT-II, which transfers
          N-acetylglucosamine (GlcNAc) from uridine diphosphate-GlcNAc (UDP-GlcNAc) to the linkage region
          of heparan sulfate (HS) and heparin, and to the glucuronic acid (GlcUA) of growing glycan chains,
          respectively
        supports: SUPPORT
