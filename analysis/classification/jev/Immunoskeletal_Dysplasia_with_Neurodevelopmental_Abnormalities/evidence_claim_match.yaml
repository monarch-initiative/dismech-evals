              label: immunoskeletal dysplasia with neurodevelopmental abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: isdna_neuro_primary_vs_secondary
        kind: KNOWLEDGE_GAP
        prompt: 'Is the neurodevelopmental impairment in ISDNA a primary consequence of the heparan sulfate
          defect in the developing brain, or largely secondary to cervical cord compression and chronic
          illness?

          '
        attaches_to:
        - pathophysiology#Neurodevelopmental Impairment
        - pathophysiology#Cervical Cord Compression
        rationale: 'Cord compression, laryngotracheal narrowing, recurrent infection, and failure to thrive
          all independently impair development, and all co-occur with the neurological phenotype. No reported
          patient separates the two contributions, yet the distinction determines whether early cervical
          decompression should be expected to improve cognitive outcome or only to prevent further injury.

          '
        proposed_experiments:
        - experiment_id: exp_isdna_decompression_neurodev_followup
          name: Pre- and post-decompression neurodevelopmental follow-up
          description: Longitudinal neurodevelopmental assessment of patients before and after early cervical
            decompression, compared against affected patients without cervical stenosis, to separate compression-attributable
            from HS-attributable developmental impairment.
        - experiment_id: exp_isdna_neural_conditional_extl3_ko
          name: Neural-progenitor-restricted conditional Extl3 deletion
          description: Conditional Extl3 deletion restricted to neural progenitors in mouse, bypassing
            the skeletal and cervical phenotype, to test whether neurodevelopmental impairment arises
            cell-autonomously in the brain.
      selected_evidence:
        snippet: craniocervical magnetic resonance imaging showed impingement of the posterior arch of
          C1 on the medulla with mild stenosis of the cervical canal requiring neurosurgery
        supports: SUPPORT
