      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other immuno-osseous dysplasias
        description: 'The closest differential is the small group of disorders combining skeletal dysplasia
          with immune dysfunction — collectively termed immune-osseous dysplasias. These are distinguished
          from ISDNA by their causal genes, which is why molecular testing rather than radiography resolves
          the differential.

          '
        distinguishing_features:
        - Schimke immuno-osseous dysplasia is caused by SMARCAL1, cartilage-hair hypoplasia by RMRP, and
          spondyloenchondrodysplasia with immune dysregulation by ACP5, whereas ISDNA is caused by biallelic
          EXTL3 variants.
      selected_evidence:
        snippet: The list includes Schimke immuno-osseous dysplasia (MIM 242900), cartilage–hair hypoplasia
          (MIM 250250) and spondyloenchondrodysplasia with immune dysregulation (MIM 607944), which are
          caused by mutations in SMARCAL1 (MIM 606622), RMRP (MIM 157660) and ACP5 (MIM 171640), respectively.
        supports: SUPPORT
