      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: immune_severity_modifiers
        hypothesis_label: Unidentified modifiers determine immunological severity
        status: EMERGING
        description: 'The most conspicuous unexplained feature of ISDNA is that immunological severity
          does not track with variant position or identity: individuals homozygous for the identical allele
          (both p.Pro318Leu and p.Pro461Leu) have ranged from Omenn-like SCID to a clinically intact immune
          system, while the skeletal phenotype remains comparatively uniform. This dissociation implies
          that genetic modifiers or environmental factors — not the EXTL3 lesion alone — gate whether
          the HS defect is transduced into thymic/hematopoietic failure. No modifier locus has been identified.

          '
      selected_evidence:
        snippet: Notably, patients harbouring the same variant in EXTL3 gene show phenotypic variability
          especially with respect to presence or absence of immunological manifestations, suggesting a
          role of unknown modifiers.
        supports: SUPPORT
