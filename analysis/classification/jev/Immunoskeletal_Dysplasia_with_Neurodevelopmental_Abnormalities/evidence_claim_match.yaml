          while its structure is not: chains are longer and carry an increased proportion of 6-O- and
          2-O-sulfated disaccharides. This is the cell-level assay corresponding to the mechanism the
          entry models — a qualitative, not quantitative, HS defect — and it is correctable by wild-type
          EXTL3 complementation, which is what establishes the variants as causal rather than incidental.

          '
      selected_evidence:
        snippet: extracted ion chromatogram liquid chromatography–mass spectrometry revealed an abnormal
          HS sulfation pattern in P1’s fibroblasts, with increase in 6-O–sulfated and 2-O–sulfated disaccharides,
          which was corrected by EXTL3 overexpression
        supports: SUPPORT
