          as a primary consequence of the HS defect rather than solely secondary to cord compression,
          although the two coexist and their relative contributions have not been separated in patients.

          '
      selected_evidence:
        snippet: 'Neurological abnormalities included: opisthotonus, hyperreflexia, generalized seizures,
