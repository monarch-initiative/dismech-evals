      assertion_type: Biochemical
      assertion:
        name: Circulating and Urinary Glycosaminoglycan Disaccharide Signature
        presence: INCREASED
        biomarker_term:
          preferred_term: glycosaminoglycan disaccharides (D0a0, D0a4)
          term:
            id: NCIT:C28153
            label: Glycosaminoglycan
        specificity: Reported as the biochemical readout distinguishing EXTL3 deficiency from morphologically
          similar spondyloepimetaphyseal dysplasias. Specificity has not been formally quantified against
          a control or disease-comparator cohort; the supporting study reports the abnormality in all
          analyzed affected individuals but provides no sensitivity/specificity statistics.
        notes: 'Biallelic EXTL3 variants produce a measurable glycosaminoglycan abnormality in body fluids,
          not only in cultured cells: total GAG concentrations are abnormal and the non-sulfated chondroitin
          disaccharide D0a0 and the disaccharide D0a4 are increased in serum and urine. This is the one
          biochemical readout reported to distinguish EXTL3 deficiency from morphologically similar spondyloepimetaphyseal
          dysplasias, and it is assayed on accessible fluids rather than requiring a fibroblast biopsy.
          Note the contrast with routine mucopolysaccharidosis screening, which is normal in this disorder
          (see the diagnosis section) — the abnormality is detected by disaccharide-resolved analysis,
          not by bulk urinary GAG screening.

          '
      selected_evidence:
        snippet: We observed abnormal glycosaminoglycan concentrations and increased concentrations of
          the non-sulfated chondroitin disaccharide D0a0 and the disaccharide D0a4 in serum and urine
          of all analyzed affected individuals.
        supports: SUPPORT
