              label: immunoskeletal dysplasia with neurodevelopmental abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: isdna_zebrafish_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        prompt: 'Does the extl3-mutant zebrafish thymic phenotype model the human immune disease closely
          enough to support therapeutic inference, given that the fish model does not reproduce the human
          spinal, cognitive, or longitudinal phenotype?

          '
        attaches_to:
        - pathophysiology#Impaired Thymopoiesis and Progenitor Expansion
        rationale: 'The zebrafish box mutant provides the strongest in vivo causal evidence in the disease
          — roughly halved thymic volume rescued by wild-type human EXTL3 RNA — but reproduces only the
          thymic and fin phenotypes. Meanwhile complete Extl3 knockout in mouse is lethal at E9.5, so
          no mammalian model recapitulates the surviving hypomorphic human state. Evidence therefore exists
          in models, but its translational reach to human immune reconstitution is the open question.

          '
        proposed_experiments:
        - experiment_id: exp_isdna_hypomorphic_knockin_mouse
          name: Hypomorphic knock-in mouse models
          description: Knock-in mouse models carrying the human hypomorphic alleles (p.Pro318Leu, p.Arg339Trp)
            rather than a null, to obtain a viable mammalian model that reproduces the partial-function
            human state.
        - experiment_id: exp_isdna_patient_thymic_organoid
          name: Patient-derived thymic organoids
          description: Patient-derived thymic organoid systems to test whether the thymic-stromal defect
            is cell-autonomous and whether it can be corrected independently of the hematopoietic compartment
            — the key question for HSCT rationale.
      selected_evidence:
        snippet: Interbreeding of the extl3-mutant zebrafish (box) with Tg(rag2:green fluorescent protein)
          transgenic zebrafish revealed defective thymopoiesis, which was rescued by injection of wild-type
          human EXTL3 RNA.
        supports: SUPPORT
