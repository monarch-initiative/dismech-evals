      assertion_type: Treatment
      assertion:
        name: Topical Antibiotic Therapy for Limited Impetigo
        description: 'Limited impetigo is treated with topical antibiotics such as mupirocin, retapamulin,
          ozenoxacin, or fusidic acid, which kill S. aureus and S. pyogenes locally and shorten the contagious
          superficial infection. Resistance limits these agents: the fusidic acid-resistant epidemic European
          impetigo clone (EEFIC) of S. aureus has persisted in Belgium, and a variant of it carrying mupirocin
          resistance has spread among children there.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Antibiotic Therapy
          term:
            id: NCIT:C15620
            label: Antibiotic Therapy
          therapeutic_agent:
          - preferred_term: mupirocin
            term:
              id: CHEBI:7025
              label: mupirocin
          - preferred_term: retapamulin
            term:
              id: CHEBI:166679
              label: Retapamulin
          - preferred_term: ozenoxacin
            term:
              id: CHEBI:136050
              label: ozenoxacin
          - preferred_term: fusidic acid
            term:
              id: CHEBI:29013
              label: fusidic acid
      selected_evidence:
        snippet: We highlight the spread of a mupirocin-resistant EEFIC in children, with a seasonal trend
          for the third quarter of the year. This is of concern because this variant is resistant to the
          two main topical antibiotics used to treat impetigo in Belgium.
        supports: SUPPORT
