        context: []
      assertion_type: Treatment
      assertion:
        name: AAV-mediated hBAG3 gene therapy (investigational)
        description: 'Investigational, preclinical gene-replacement strategy. Systemic AAVrh74.tMCK-driven
          overexpression of human BAG3 (a co-chaperone that initiates the autophagy-lysosome pathway)
          was tested in the VCP-A232E mouse model of VCP-related hereditary inclusion body myositis. The
          rationale is to bypass the VCP proteostasis defect by upregulating autophagic flux and mitophagy,
          thereby clearing misfolded protein aggregates and restoring mitochondrial quality control. hBAG3
          delivery improved motor function, reduced TDP-43-positive aggregates, and improved mitophagy/mitochondrial
          homeostasis markers. No clinical (human) data exist; this remains an early proof-of-concept
          therapeutic strategy.

          '
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        target_phenotypes:
        - preferred_term: Proximal muscle weakness
          term:
            id: HP:0003701
            label: Proximal muscle weakness
      selected_evidence:
        snippet: hBAG3 treatment improved treadmill running distance and rotarod duration, reduced the
          number of TDP-43-positive aggregates, and decreased the number of fibers showing abnormalities
          in mitochondrial enzyme histochemistry, compared with the untreated cohort.
        supports: SUPPORT
    origin:
