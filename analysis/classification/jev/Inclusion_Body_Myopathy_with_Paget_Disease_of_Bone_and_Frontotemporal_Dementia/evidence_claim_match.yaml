          whose glycine-rich C-terminal region is a prion-like domain. The reported disease variants are
          missense and lie within that domain, where they strengthen a steric zipper motif and accelerate
          self-seeding fibril assembly, so the mechanism is a gain of aggregation propensity rather than
          loss of the protein. ClinGen grades the relationship Moderate and lumps the reported amyotrophic
