            term:
              id: MONDO:0000507
              label: inclusion body myopathy with Paget disease of bone and frontotemporal dementia
        context: []
      assertion_type: Subtype
      assertion:
        name: IBMPFD3
        display_name: IBMPFD3 / multisystem proteinopathy 3 (HNRNPA1)
        subtype_term:
          preferred_term: HNRNPA1-related inclusion body myopathy with Paget disease of bone and frontotemporal
            dementia
          term:
            id: MONDO:0014179
            label: inclusion body myopathy with early-onset Paget disease with or without frontotemporal
              dementia 3
        description: The HNRNPA1 form, identified in a second VCP-negative family by the same study that
          defined the HNRNPA2B1 form. The reported variant substitutes valine for the conserved aspartate
          at the equivalent position of the HNRNPA1 prion-like domain, so the two subtypes share both
          the affected residue context and the aggregation mechanism. A variant at the same aspartate
          was also found in one dominantly inherited familial amyotrophic lateral sclerosis case.
        genes:
        - preferred_term: HNRNPA1
          term:
            id: hgnc:5031
            label: HNRNPA1
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Here we define pathogenic mutations in PrLDs of heterogeneous nuclear ribonucleoproteins
          (hnRNPs) A2B1 and A1 in families with inherited degeneration affecting muscle, brain, motor
          neuron and bone, and in one case of familial amyotrophic lateral sclerosis.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23455423
      reference_title: Mutations in prion-like domains in hnRNPA2B1 and hnRNPA1 cause multisystem proteinopathy
        and ALS.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding report of both hnRNP forms, establishing HNRNPA1 variants in a family
        with the muscle, bone, brain and motor neuron degeneration this entry models, and in one familial
        ALS case.
