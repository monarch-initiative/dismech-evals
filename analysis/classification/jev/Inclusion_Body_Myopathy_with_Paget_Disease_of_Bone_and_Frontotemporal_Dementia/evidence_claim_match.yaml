        description: 'The disease variants in HNRNPA2B1 and HNRNPA1 lie in the glycine-rich prion-like
          domain that both paralogues carry. Wild-type hnRNPA2 and hnRNPA1 already have an intrinsic tendency
          to self-assemble into fibrils; the variants strengthen a steric zipper motif inside that domain,
          which accelerates formation of self-seeding fibrils and lets them cross-seed polymerization
          of the wild-type protein. The proximal defect in the hnRNP forms of this disorder is therefore
          a gain of ordered self-assembly, not the loss of ubiquitin dependent segregase activity that
          drives the VCP form.

          '
        genes:
