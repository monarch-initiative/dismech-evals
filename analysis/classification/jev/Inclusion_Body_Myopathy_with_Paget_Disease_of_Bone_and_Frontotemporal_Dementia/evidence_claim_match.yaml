        context: []
      assertion_type: Subtype
      assertion:
        name: IBMPFD2
        display_name: IBMPFD2 / multisystem proteinopathy 2 (HNRNPA2B1)
        subtype_term:
          preferred_term: HNRNPA2B1-related inclusion body myopathy with Paget disease of bone and frontotemporal
            dementia
          term:
            id: MONDO:0014178
            label: inclusion body myopathy with early-onset Paget disease with or without frontotemporal
              dementia 2
        description: The HNRNPA2B1 form of this multisystem proteinopathy, first defined in a VCP-negative
          family with dominantly inherited degeneration of muscle, bone, brain and motor neurons. Reported
          variants are missense and fall in the prion-like domain of the protein. Disabling muscle weakness
          is the usual presentation, osteolytic Paget-type bone lesions occur in about half of reported
          cases, and frontotemporal dementia in a minority; penetrance of the muscle phenotype is incomplete.
          ClinGen classifies the gene-disease relationship as Moderate.
        genes:
        - preferred_term: HNRNPA2B1
          term:
            id: hgnc:5033
            label: HNRNPA2B1
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: IBMPFD2 families present with an incomplete penetrance of disabling muscle weakness in
          most cases, osteolytic bone lesions consistent with Paget disease in around half of cases, and
          frontotemporal dementia in a handful of cases. At least 5 variants, all missense, have been
          reported in humans.
        supports: SUPPORT
    origin:
