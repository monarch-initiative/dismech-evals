              muscle weakness is the usual presentation, osteolytic Paget-type bone lesions occur in about
              half of reported cases, and frontotemporal dementia in a minority; penetrance of the muscle
              phenotype is incomplete. ClinGen classifies the gene-disease relationship as Moderate.
