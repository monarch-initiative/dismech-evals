  1a83feebf4d756013000025dc4e257c76276a696e1b525ac9ec74ea9081b9104:
    claim:
      about:
        disease:
          name: Inclusion Body Myositis
          disease_term:
            preferred_term: Sporadic Inclusion Body Myositis
            term:
              id: MONDO:0007827
              label: inclusion body myositis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ibm_autoimmune_vs_degenerative_primacy
        kind: CONTROVERSY
        status: OPEN
        prompt: Is sporadic inclusion body myositis primarily a T cell-mediated autoimmune disease with
          secondary degeneration, or primarily a cell-autonomous degenerative myopathy with secondary
          inflammation?
        attaches_to:
        - pathophysiology#Cytotoxic T Cell Invasion of Non-Necrotic Myofibres
        - pathophysiology#Autophagy-Lysosome Failure and Rimmed Vacuole Formation
        rationale: 'This is the central unresolved question in IBM and it determines therapeutic strategy.
          The autoimmune-primary case rests on the HLA association, the anti-cN1A autoantibody, the clonal
          cytotoxic T cell signature, and the observation that invasion of non-necrotic fibres is far
          more common than aggregate-bearing fibres (fewer than 1% of myofibres). The degeneration-primary
          case rests on the consistent failure of immunosuppression and on the xenograft experiment showing
          rimmed vacuoles and TDP-43 loss of function persist after T cell depletion. The two models are
          not mutually exclusive; the disputed point is which arm is upstream and therefore which is the
          therapeutic target. The single most informative test has now reported: the registrational anti-KLRG1
          (ulviprubart) MUSCLE trial depleted precisely the effector population the autoimmune model implicates,
          sparing broader immunity in a way conventional immunosuppression does not, and per sponsor topline
          announcements it missed its primary and key secondary endpoints in the overall population. If
          that result holds on peer-reviewed publication it is substantial negative evidence for the autoimmune-primary
          model as a complete account, and shifts weight toward the degeneration-primary arm or toward
          a model in which immune injury initiates but does not sustain the disease. The `autoimmune_primary`
          hypothesis is retained as CANONICAL for now because it remains the dominant published interpretation
          and the trial result is not yet peer-reviewed; that status should be revisited when it is.'
        proposed_experiments:
        - experiment_id: ibm_klrg1_trial_peer_reviewed_publication
          name: Peer-reviewed publication of the anti-KLRG1 MUSCLE trial with target engagement
          description: Publish the full MUSCLE (ulviprubart, NCT05721573) dataset in the peer-reviewed
            literature, reporting functional outcomes alongside confirmed pharmacodynamic depletion of
            KLRG1+ T cells in blood and muscle. The topline result is already announced as negative in
            the overall population, so the decisive remaining question is whether the effector population
            was actually cleared from muscle.
          supporting_outcome:
          - A null functional result together with documented near-complete depletion of muscle-invading
            KLRG1+ T cells would be strong evidence against the autoimmune-primary model, since the mechanism
            was engaged and the disease progressed anyway.
          refuting_outcome:
          - A null functional result with poor muscle-compartment depletion would leave the autoimmune-primary
            model intact and reframe the trial as a pharmacokinetic rather than a mechanistic failure.
        - experiment_id: ibm_paired_biopsy_temporal_ordering
          name: Longitudinal paired-biopsy ordering of the two arms
          description: Serial paired muscle biopsies measuring TDP-43 cryptic exon burden alongside quantified
            cytotoxic T cell infiltration in the same patients over time.
          decision_criterion: Whichever readout rises first, and predicts subsequent change in the other,
            identifies the upstream arm.
      selected_evidence:
        snippet: Sporadic inclusion body myositis (IBM) is the most common acquired muscle disease in
          adults over age 50, yet it remains unclear whether the disease is primarily driven by T cell-mediated
          autoimmunity.
        supports: SUPPORT
