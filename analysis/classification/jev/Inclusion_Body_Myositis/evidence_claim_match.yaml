    evidence_metadata:
      reference: PMID:39757935
      reference_title: Loss of TDP-43 Splicing Repression Occurs in Myonuclei of Inclusion Body Myositis
        Patients.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The positive counter-example to the specificity claim. A TDP-43-dependent cryptic
        HDGFL2 peptide was found in 79 of 122 IBM biopsies and was absent across 197 disease controls,
        demonstrating that a genuinely IBM-specific molecular marker exists and that it is not amyloid.
        Graded PARTIAL rather than REFUTE deliberately: this study never measures amyloid, so it displaces
        amyloid from the role of specific marker without directly testing amyloid''s specificity.'
