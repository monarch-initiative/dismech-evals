  f3bbdb6dc161e8bd1cffce5858cbf3d8406abbc5cbc67e4da7cca9b83d8263c8:
    claim:
      about:
        disease:
          name: Inclusion Body Myositis
          disease_term:
            preferred_term: Sporadic Inclusion Body Myositis
            term:
              id: MONDO:0007827
              label: inclusion body myositis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ibm_no_faithful_animal_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Can any available experimental model reproduce sporadic IBM faithfully enough to establish
          drug efficacy, given that no animal model recapitulates the combination of HLA-restricted clonal
          autoimmunity, aging stroma, selective muscle distribution and decade-long progression?
        attaches_to:
        - pathophysiology#Clonal Expansion of Highly Differentiated Cytotoxic CD8+ T Cells
        rationale: VCP-mutant mice model hereditary VCP multisystem proteinopathy, not sporadic IBM, and
          were nonetheless part of the preclinical rationale for arimoclomol, which subsequently failed
          in humans. The human muscle xenograft model is the closest available system and reproduces both
          inflammatory and degenerative features, but it is short-term and cannot capture years-long progression.
          Cultured myoblasts cannot recreate chronic HLA-restricted immunity or aging stroma. This model
          gap is a plausible contributor to the repeated translational failures in IBM and should temper
          confidence in any mechanism supported only by model-system evidence.
        proposed_experiments:
        - experiment_id: ibm_xenograft_autologous_t_cell_reconstitution
          name: Autologous T cell reconstitution of the IBM muscle xenograft
          description: Extend the human IBM muscle xenograft model with autologous reconstitution of the
            patient's clonal KLRG1+ T cell population.
          supporting_outcome:
          - De novo emergence of degenerative pathology in previously unaffected grafted muscle would
            establish that the immune arm is sufficient to initiate degeneration.
          refuting_outcome:
          - Absence of new degenerative pathology despite robust T cell engraftment would indicate the
            immune arm is not sufficient.
        - experiment_id: ibm_xenograft_prospective_benchmarking
          name: Prospective xenograft benchmarking of candidate therapies
          description: Test candidate therapies against the human muscle xenograft model before committing
            to phase 3 trials, using TDP-43 cryptic exon burden as a molecular endpoint.
          decision_criterion: Concordance between xenograft molecular response and subsequent human trial
            outcomes would qualify the model as a translational filter; repeated discordance would confirm
            the model gap.
      selected_evidence:
        snippet: To determine the role of T cells in pathogenesis, we generated a xenograft model by transplanting
          human IBM muscle into the hindlimb of immunodeficient mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35044790
      reference_title: Loss of TDP-43 function and rimmed vacuoles persist after T cell depletion in a
        xenograft model of sporadic inclusion body myositis.
      evidence_source: MODEL_ORGANISM
      explanation: Describes the human-muscle xenograft as the model developed precisely because no conventional
        animal model of sporadic IBM exists.
