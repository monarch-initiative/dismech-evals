        description: 'Not merely a mimic but a genuine overlap: the majority of IBM patients meet standard
          diagnostic criteria for T-LGL leukaemia on blood flow cytometry. This is better understood as
          a shared clonal cytotoxic T cell process than as a differential to exclude, and it can prompt
          inappropriate haematological workup if not recognized. Retained here because it is a real bedside
          diagnostic consideration, but the association itself is modelled properly in kb/comorbidities/com_Inclusion_Body_Myositis__T_Cell_Large_Granular_Lymphocytic_Leukemia.yaml,
