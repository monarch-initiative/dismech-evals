      assertion_type: Pathophysiology
      assertion:
        name: Refractoriness to Conventional Immunosuppression
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        description: 'Unlike dermatomyositis, polymyositis and immune-mediated necrotizing myopathy, IBM
          does not respond to glucocorticoids, methotrexate, azathioprine or most tested biologics. This
          is a defining clinical property of the disease and a diagnostic clue: steroid-refractory "polymyositis",
          particularly with finger-flexor or quadriceps selectivity, should prompt reassessment for IBM.
          The proposed mechanism is that the effector clone has acquired a neoplastic or neoplastic-like
          character, making it a self-sustaining population rather than an antigen-driven response that
          immunosuppression can switch off.'
      selected_evidence:
        snippet: Classical immunosuppressants are ineffective in treating inclusion body myositis, and
          to date there are no recommendations for pharmacological approaches to treatment.
        supports: SUPPORT
