        description: 'When conservative swallowing management fails, interventional options are used for
          the obstructive cricopharyngeal component: balloon dilation, botulinum toxin injection of the
          cricopharyngeus, and cricopharyngeal myotomy. Myotomy is irreversible. Gastrostomy (PEG) placement
          is used for nutritional support once oral intake becomes unsafe; roughly half of patients in
          a population-based cohort eventually required a feeding tube. Evidence is limited to small series
          and clinical experience rather than randomised trials.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: surgical procedure
