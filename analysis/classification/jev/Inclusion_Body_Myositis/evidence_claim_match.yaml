      reference: PMID:8394158
      reference_title: beta-Amyloid precursor protein mRNA is increased in inclusion-body myositis muscle.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The founding observation of the hypothesis: increased APP transcript in vacuolated
        IBM fibres, offered as evidence that APP accumulation is generated locally rather than deposited.'
