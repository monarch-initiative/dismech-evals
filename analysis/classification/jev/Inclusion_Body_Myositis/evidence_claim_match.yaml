          refuting_outcome:
          - Failure to reproduce the signal, or an equal signal in the chronic-injury controls, would
            confirm the DEPRECATED assessment.
        - experiment_id: ibm_amyloid_burden_versus_progression
          name: Amyloid burden against clinical progression
          description: Test whether quantified muscle amyloid-beta burden at biopsy predicts subsequent
            rate of functional decline, independently of T cell infiltrate density and TDP-43 cryptic
            exon burden, in a prospectively followed cohort.
          supporting_outcome:
          - An association between amyloid burden and subsequent decline that survives adjustment for
            T cell infiltrate density and TDP-43 cryptic exon burden would support a causal role even
            at low fibre frequency.
          refuting_outcome:
          - No independent association would confirm amyloid as a bystander marker of chronic fibre injury.
      selected_evidence:
        snippet: Dot-immunoblots using highly specific anti-ADDL monoclonal antibodies also showed highly
          increased ADDLs in all s-IBM biopsies studied, while controls were negative.
        supports: SUPPORT
