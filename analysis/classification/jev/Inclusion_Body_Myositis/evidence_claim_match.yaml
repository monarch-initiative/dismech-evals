              label: inclusion body myositis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: autoimmune_primary
        hypothesis_label: IBM is primarily a T cell-mediated autoimmune disease; protein aggregation is
          a downstream or secondary marker
        status: CANONICAL
        description: The dominant contemporary model holds that clonally expanded, highly differentiated
          cytotoxic CD8+ T cells are the primary pathogenic effectors, and that the degenerative pathology
          (rimmed vacuoles, aggregates) is downstream of, or secondary to, chronic immune injury. Supporting
          arguments are the HLA association, the circulating anti-cN1A autoantibody, the marked cytotoxic
          T cell transcriptomic signature, the clonality and persistence of the effector population, and
          the observation that invasion of non-necrotic fibres is far more frequent than amyloid-containing
          fibres. The treatment refractoriness is explained on this model by the effector cells being
          terminally differentiated and resistant to conventional immunotherapy rather than by the disease
          being non-immune.
      selected_evidence:
        snippet: Findings from the past decade that implicate autoimmunity in IBM include the identification
          of a circulating autoantibody (anti-cN1A); the absence of any statistically significant genetic
          risk factor other than the common autoimmune disease 8.1 MHC haplotype in whole-genome sequencing
          studies; the presence of a marked cytotoxic T cell signature in gene expression studies; and
          the identification in muscle and blood of large populations of clonal highly differentiated
          cytotoxic CD8+ T cells that are resistant to many immunotherapies.
        supports: SUPPORT
