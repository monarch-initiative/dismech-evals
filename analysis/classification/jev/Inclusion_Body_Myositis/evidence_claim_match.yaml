      assertion_type: Pathophysiology
      assertion:
        name: Amyloid-beta and APP Accumulation in Myofibres
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'Disputed node, curated to make the historical amyloid model of IBM explicit and
          assessable rather than absent. On the `amyloid_beta_proteotoxicity` model, IBM myofibres transcribe
          APP at increased levels, accumulate APP and its cleavage product amyloid-beta intracellularly
          (preferentially Abeta42), and are injured by soluble Abeta oligomers upstream of proteostasis
          failure and vacuolar degeneration.

          The node is marked HYPOTHETICAL because the evidence does not support it as curated fact. Amyloid-beta
          immunoreactivity is detectable in only a very small minority of IBM myofibres and in one quantitative
          series in none at all, it is not specific to IBM (the same amyloid-positive filamentous vacuoles
          occur in chronic denervation and in congenital childhood myopathies), unbiased proteomics of
          rimmed vacuoles does not report it as an enriched constituent, and cultured IBM myofibres do
          not accumulate APP. Any real amyloid-beta present is best read as one constituent of the aggregate
          pathology captured by the `Autophagy-Lysosome Failure and Rimmed Vacuole Formation` node rather
          than as a specific or upstream driver. No IBM therapeutic has targeted it.'
        cell_types:
        - preferred_term: Skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        genes:
        - preferred_term: APP
          term:
            id: hgnc:620
            label: APP
        biological_processes:
        - preferred_term: amyloid precursor protein metabolic process
          term:
            id: GO:0042982
            label: amyloid precursor protein metabolic process
          modifier: ABNORMAL
        - preferred_term: amyloid-beta formation
          term:
            id: GO:0034205
            label: amyloid-beta formation
          modifier: INCREASED
      selected_evidence:
        snippet: In affected fibers, increased beta APP-mRNA correspond to abnormally accumulated beta
          APP immunoreactivity (including beta-amyloid protein epitope).
        supports: SUPPORT
