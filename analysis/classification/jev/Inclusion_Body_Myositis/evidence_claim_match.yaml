        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: TDP-43 is cleared from myonuclei and aggregates in the cytoplasm, producing a loss
          of its normal splicing-repressor function and consequent inclusion of cryptic exons in target
          transcripts. This is a molecular convergence with ALS and frontotemporal dementia, is the most
          disease-specific molecular lesion described in IBM, and forms the basis of a highly specific
          diagnostic assay. Critically, this arm persists after T cell depletion in a human muscle xenograft,
          indicating it is at least partly T cell-independent.
        cell_types:
        - preferred_term: Skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
