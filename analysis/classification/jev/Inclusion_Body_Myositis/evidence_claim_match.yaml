  add25c22a23c60590fea47e1886f9cdf0b3989cf7186d2a1385996f2ae20d292:
    claim:
      about:
        disease:
          name: Inclusion Body Myositis
          disease_term:
            preferred_term: Sporadic Inclusion Body Myositis
            term:
              id: MONDO:0007827
              label: inclusion body myositis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: amyloid_beta_proteotoxicity
        hypothesis_label: Amyloid-beta and its precursor APP are abnormally and specifically over-produced
          in IBM myofibres and are the upstream proteotoxic driver of the disease
        status: DEPRECATED
        description: 'Proposed by Askanas and Engel from the early 1990s, this model cast sporadic IBM
          as a muscle analogue of Alzheimer disease: increased APP transcription in vacuolated fibres
          leads to intracellular accumulation of APP and its proteolytic fragment amyloid-beta, preferentially
          the more aggregation-prone Abeta42, whose soluble oligomers are cytotoxic and sit upstream of
          tau phosphorylation, oxidative stress, proteasome inhibition, ER stress and vacuolar degeneration.
          It was the dominant degenerative account of IBM for roughly two decades and supplied the rationale
          for the Congo red / amyloid criterion in older diagnostic schemes.

          It is recorded here as DEPRECATED, and the two claims embedded in the label fail for different
          reasons.

          The claim of SPECIFICITY fails outright: beta-amyloid-immunoreactive, Congo-red-positive rimmed
          vacuoles with tubulofilaments occur in long-standing denervation (postpoliomyelitis muscular
          atrophy) and in congenital myopathies of childhood, so the finding tracks chronicity of fibre
          injury rather than IBM itself. (Oculopharyngeal muscular dystrophy is deliberately excluded
          from this list: it shares the ubiquitinated filamentous inclusions, but the one study here that
          stained it for beta-amyloid found labelling in IBM and not in OPMD.) Comparative quantification
          puts the point sharply: in the same biopsies in which sarcoplasmic TDP-43 marked 23% of myofibres,
          focal beta-amyloid immunoreactivity (R1282) was found in 0.00% and fluorescent Congo red material
          in 0.57%. TDP-43 mislocalization, not amyloid, is now the sensitive and specific molecular marker
          of IBM.

          The claim of ABNORMAL PRESENCE is weaker than the literature suggests rather than plainly false.
          Positive immunoblot and ADDL data exist, but almost entirely from the originating laboratory;
          unbiased laser-capture mass spectrometry of rimmed vacuoles recovered 213 enriched proteins
          dominated by protein-folding and autophagy machinery without reporting amyloid-beta or APP enrichment;
          cultured IBM myotubes from the same laboratory do not accumulate betaAPP, so any accumulation
          is not cell-autonomous; the companion phospho-tau claim was shown to rest on antibodies that
          stain normal myonuclei and recognize proteins other than tau, which impugns the reagent class
          the histological arm depended on; and a formal citation-network analysis of the entire literature
          on this belief found its authority inflated by citation bias, amplification and invention rather
          than by accumulated data.

          What survives is modest and is retained in the entry: protein aggregates of several kinds, amyloid-beta
          among them, are demonstrable in a small minority of IBM myofibres and are best read as a marker
          of overwhelmed proteostasis (see the `Autophagy-Lysosome Failure and Rimmed Vacuole Formation`
          node) rather than as a specific or upstream cause. Neither of the two live models for IBM requires
          amyloid-beta, and no anti-amyloid therapeutic strategy has been taken into IBM trials.

          Two axes outside the histology point the same way, and both are arguments from what has not
          been tested or found rather than direct refutations. Therapeutically the mechanism has never
          been put to the test: no BACE or gamma-secretase inhibitor and no anti-amyloid antibody has
          entered an IBM trial, and the nearest proxies that did enter one, the protein-homeostasis agents
          arimoclomol and sirolimus, are among the interventions a systematic review of the randomised-trial
          record found to have no effect on progression. Genetically the amyloid pathway is likewise absent:
          reported IBM susceptibility loci are immune (HLA class II, PTPN22) and proteostasis or autophagy
          genes (VCP, SQSTM1, FYCO1), with no association reported for APP, PSEN1, PSEN2, BACE1 or APOE.'
        notes: Retained rather than deleted because the hypothesis remains widely cited in reviews, textbooks
          and older diagnostic criteria, and curators encountering amyloid claims in the IBM literature
          need the assessment recorded rather than silently absent.
      selected_evidence:
        snippet: Vacuolated muscle fibers in muscle biopsies of 8 out of 8 inclusion body myositis (IBM)
          patients, including 2 hereditary patients, manifested increased mRNA for the beta-amyloid precursor
          protein (beta APP) that contains Kunitz-type protease inhibitor motif.
        supports: SUPPORT
