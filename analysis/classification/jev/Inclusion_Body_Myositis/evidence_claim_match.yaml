    evidence_metadata:
      reference: PMID:39843353
      reference_title: 'Efficacy and safety of pharmacological treatments in inclusion body myositis:
        a systematic review.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'A systematic review of the whole randomised-trial record for IBM, in which no amyloid-directed
        agent appears at all. Graded NO_EVIDENCE for that reason: the trial literature cannot speak for
        or against this hypothesis because the mechanism has never been targeted in a patient. What the
        review does establish is that the nearest proxies, the protein-homeostasis agents arimoclomol
        and sirolimus, had no effect on progression. Recorded because the therapeutic axis leaves the
        hypothesis formally untested rather than formally excluded, which is a different position from
        the refutation the histological evidence supplies.'
