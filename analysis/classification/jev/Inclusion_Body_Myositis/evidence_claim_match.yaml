              label: inclusion body myositis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ibm_muscle_selectivity_unexplained
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why are the quadriceps and the deep finger flexors selectively vulnerable in inclusion
          body myositis?
        attaches_to:
        - pathophysiology#Progressive Myofibre Degeneration and Selective Muscle Loss
        rationale: The weakness distribution is the single most reliable diagnostic feature of IBM and
          is unique among muscle diseases, yet no proposed mechanism explains it. Neither the HLA-restricted
          autoimmune arm nor the proteostasis and mitochondrial arms predict selective involvement of
          these particular muscles. Selective type 2 myofibre vulnerability and a functional denervation
          program have been demonstrated at the transcriptomic level, but these are fibre-type rather
          than muscle-group explanations and do not account for the specific anatomical pattern.
        proposed_experiments:
        - experiment_id: ibm_affected_vs_spared_transcriptomics
          experiment_design: DESCRIPTIVE_PROFILING
          name: Affected-versus-spared muscle transcriptomic comparison
          description: Comparative single-nucleus and spatial transcriptomics of affected (quadriceps,
            flexor digitorum profundus) versus clinically spared muscles sampled from the same patients.
          decision_criterion: Identification of muscle-group-intrinsic transcriptional programs that segregate
            with clinical involvement independently of fibre type would supply the missing determinant
            of selectivity.
        - experiment_id: ibm_regional_lesion_burden_mapping
          name: Regional molecular lesion burden mapping
          description: Quantify somatic mtDNA deletion burden and TDP-43 cryptic exon load across affected
            versus spared muscle groups in the same individuals.
          decision_criterion: A gradient of lesion burden tracking clinical involvement would place the
            selectivity determinant within the degenerative arm rather than the immune arm.
      selected_evidence:
        snippet: Moreover, causal factors and molecular drivers of IBM progression are largely unknown.
        supports: SUPPORT
    origin:
