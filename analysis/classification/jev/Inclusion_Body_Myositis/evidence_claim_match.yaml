  6df7a74cd9fce1c9d7ddaf34d9922317ec01b6f0a6b2fa09b039127394e1126a:
    claim:
      about:
        disease:
          name: Inclusion Body Myositis
          disease_term:
            preferred_term: Sporadic Inclusion Body Myositis
            term:
              id: MONDO:0007827
              label: inclusion body myositis
        context: []
      assertion_type: Biochemical
      assertion:
        name: Anti-cN1A (NT5C1A) Autoantibody
        notes: Autoantibodies against cytosolic 5'-nucleotidase 1A (cN1A / NT5C1A / Mup44), the first
          and only myositis-associated autoantibody described in IBM. Reported sensitivity varies widely
          with assay and threshold (roughly 33-70%) while specificity against other muscle diseases is
          high (about 92-98%). A negative test does not exclude IBM, and anti-cN1A also occurs in Sjogren
          disease and lupus, so a positive result supports the diagnosis only in the appropriate clinical
          context. cN1A also accumulates in perinuclear regions and rimmed vacuoles in IBM muscle, potentially
          linking the autoimmune and degenerative arms of the disease.
        presence: PRESENT
        specificity: High specificity against other muscle diseases (approximately 92-98% depending on
          reactivity threshold), but anti-cN1A is also found in Sjogren disease and systemic lupus erythematosus.
      selected_evidence:
        snippet: By immunoprecipitation of recombinant cN1A, high concentrations of anti-Mup44 autoantibodies
          were detected in 33% of sIBM patient sera, whereas their prevalence in dermatomyositis, polymyositis,
          and other neuromuscular disorders appeared to be rare (4.2%, 4.5%, and 3.2%, respectively).
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/0
      context_paths:
