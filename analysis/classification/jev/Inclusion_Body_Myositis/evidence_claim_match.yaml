    evidence_metadata:
      reference: PMID:23496965
      reference_title: Cell stress molecules in the skeletal muscle of GNE myopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'A further non-specificity observation: APP is raised in GNE myopathy too, and its
        expression correlates with generic cell-stress and pro-inflammatory markers, consistent with a
        shared stress response rather than an IBM-specific lesion. Graded PARTIAL, not REFUTE, because
        the quoted APP elevation did not reach statistical significance; a null result cannot carry a
        refutation, and the significant finding here is the correlation with cell-stress markers rather
        than the elevation itself.'
