        name: GNE Myopathy (hereditary inclusion body myopathy)
        description: An autosomal recessive hereditary myopathy that shares rimmed vacuoles and protein
          inclusions on biopsy but is a mechanistically distinct disease. It is the most important hereditary
          mimic of IBM and a recurring source of entity confusion.
        distinguishing_features:
        - Onset typically before age 40
        - Characteristic sparing of the quadriceps
        - Absence of endomysial inflammatory infiltrate and MHC class I upregulation
        - Autosomal recessive GNE variants identifiable
      selected_evidence:
        snippet: For example, hIBM2 caused by autosomal recessive inheritance of mutations in the GNE
          gene typically spares the quadriceps, and biopsy shows rimmed vacuoles and protein inclusions
          but lacks inflammation.
        supports: SUPPORT
