          name: Inclusion Body Myositis
          disease_term:
            preferred_term: Sporadic Inclusion Body Myositis
            term:
              id: MONDO:0007827
              label: inclusion body myositis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: degeneration_primary
        hypothesis_label: IBM is primarily a cell-autonomous degenerative myopathy with secondary or non-essential
          inflammation
        status: ALTERNATIVE
        description: A competing model holds that cell-autonomous myofibre degeneration (proteostasis
          failure, TDP-43 loss of function, mitochondrial damage) drives the disease and that the inflammatory
          infiltrate, while conspicuous, is not the essential driver. The strongest direct evidence is
          the IBM muscle xenograft experiment in which depleting human T cells suppressed myofibre MHC
          class I upregulation but left rimmed vacuoles and TDP-43 loss of function intact. The consistent
          failure of immunosuppression to alter functional decline is the main clinical argument. Note
          that this model is not mutually exclusive with the autoimmune-primary model; both arms are likely
          to operate, and the disputed question is which is upstream.
      selected_evidence:
        snippet: Reduction of human T cells within IBM xenografts by treating mice intraperitoneally with
          anti-CD3 (OKT3) suppressed MHC-I up-regulation. However, rimmed vacuoles and loss of TDP-43
          function persisted. These data suggest that T cell depletion does not alter muscle degenerative
          pathology in IBM.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35044790
      reference_title: Loss of TDP-43 function and rimmed vacuoles persist after T cell depletion in a
        xenograft model of sporadic inclusion body myositis.
      evidence_source: MODEL_ORGANISM
      explanation: Direct experimental dissociation of the degenerative arm from T cell activity in a
        human-muscle xenograft, the key evidence for the degeneration-primary model.
