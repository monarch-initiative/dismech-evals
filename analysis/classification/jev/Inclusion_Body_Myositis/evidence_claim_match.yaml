  d1a150232fcbbfceff3946beeb2055a0a2731ea0ea8dc8f137ef866140c0fef1:
    claim:
      about:
        disease:
          name: Inclusion Body Myositis
          disease_term:
            preferred_term: Sporadic Inclusion Body Myositis
            term:
              id: MONDO:0007827
              label: inclusion body myositis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ibm_amyloid_beta_specificity
        kind: CONTROVERSY
        status: OPEN
        prompt: Are amyloid-beta and its precursor APP abnormally and specifically present in inclusion
          body myositis muscle, and if some amyloid-beta is genuinely present, is it a cause of myofibre
          injury or a downstream marker?
        attaches_to:
        - pathophysiology#Amyloid-beta and APP Accumulation in Myofibres
        - pathophysiology#Autophagy-Lysosome Failure and Rimmed Vacuole Formation
        rationale: 'The two halves of the claim have different answers and should not be resolved together.

          SPECIFICITY is settled in the negative. Amyloid-positive, ubiquitinated filamentous rimmed vacuoles
          indistinguishable from those of IBM occur in long-standing denervation after poliomyelitis and
          in congenital myopathies of children, so the finding indexes chronic myofibre injury rather
          than IBM. Oculopharyngeal muscular dystrophy is not part of this argument: it shares the ubiquitinated
          filamentous inclusions, but the single study here that applied a beta-amyloid antibody to it
          found labelling in IBM and not in OPMD, so it is used below only as an experimental control
          arm. Quantitatively the marker performs poorly: in the series that compared markers head to
          head, sarcoplasmic TDP-43 was present in 23% of IBM myofibres while focal beta-amyloid immunoreactivity
          was present in 0.00% and Congo-red material in 0.57%. TDP-43 mislocalization has displaced amyloid
          as the specific molecular signature of IBM.

          ABNORMAL PRESENCE remains genuinely open, and is the reason this discussion is filed as a CONTROVERSY
          rather than closed. Immunoblot and ADDL data reporting Abeta oligomers in every IBM sample and
          no control exist and have not been formally retracted or directly rebutted, but they issue almost
          entirely from the laboratory that proposed the hypothesis; the corresponding negative is largely
          an absence — unbiased laser-capture proteomics of rimmed vacuoles does not report amyloid-beta
          or APP among 213 enriched proteins — and absence of detection in a spectral-count experiment
          is weak evidence of absence for a small, aggregation-prone, poorly soluble peptide. That the
          positive data are single-laboratory is a checked absence rather than an inference from authorship:
          a targeted literature search for independent, non-originating-laboratory replication of the
          Abeta oligomer and Abeta42 immunodetection in IBM muscle, run in 2026, returned no papers. A
          negative search bounds the published record at that date and is not proof that no replication
          was ever attempted. What makes the open question tractable is that nobody has run the decisive
          experiment: a blinded, multi-centre, targeted mass-spectrometric quantification of amyloid-beta
          peptides in IBM versus disease-control muscle.

          Two further considerations bear on how much weight the existing literature can carry. The companion
          phospho-tau claim was shown to rest on antibodies that stain normal myonuclei and bind proteins
          other than tau, which impugns the reagent class the histological arm depended on; and a citation-network
          analysis taking this precise belief as its subject found its authority built by citation bias,
          amplification and invention rather than by data. Both argue for resolving the question with
          orthogonal, antibody-independent methods rather than with more immunohistochemistry.'
        proposed_experiments:
        - experiment_id: ibm_targeted_ms_amyloid_quantification
          name: Blinded targeted mass-spectrometric quantification of amyloid-beta in IBM versus disease-control
            muscle
          description: Parallel reaction monitoring or immunoprecipitation-mass spectrometry with stable-isotope-labelled
            Abeta40/Abeta42 internal standards, applied to whole muscle lysates and to laser-captured
            rimmed vacuoles, from IBM, polymyositis, dermatomyositis, chronically denervated, oculopharyngeal
            muscular dystrophy and age-matched normal muscle, with samples blinded and analysed in more
            than one laboratory. This is antibody-independent and so is not vulnerable to the cross-reactivity
            that undermined the immunohistochemical literature.
          supporting_outcome:
          - Quantifiable Abeta42 above disease controls, in IBM muscle, reproduced across laboratories,
            would establish abnormal presence and reopen the question of whether it is specific and upstream.
          refuting_outcome:
          - Abeta peptides at or below disease-control levels, with adequate sensitivity demonstrated
            on spiked standards, would close the abnormal presence claim and retire the hypothesis outright.
        - experiment_id: ibm_lcm_ms_peptide_library_reinterrogation
          experiment_design: DESCRIPTIVE_PROFILING
          name: Targeted re-interrogation of existing rimmed-vacuole LCM-MS peptide libraries for APP
            and amyloid-beta
          description: Re-query the already-acquired laser-capture mass-spectrometry peptide libraries
            from the rimmed-vacuole proteomics study for APP and amyloid-beta peptides specifically, reporting
            detection limits and spiked-standard sensitivity. The published analysis reports 213 enriched
            proteins but does not state whether these peptides were sought, so "not reported" cannot currently
            be read as "absent".
          supporting_outcome:
          - Detection of APP or amyloid-beta peptides enriched in rimmed vacuoles would restore a constituent
            role for amyloid in the defining lesion.
          refuting_outcome:
          - Confirmed non-detection at a demonstrated spiked-standard sensitivity would convert the present
            silence in the published analysis into a real negative. This is far cheaper than a new prospective
            study and should precede one.
        - experiment_id: ibm_independent_abeta_oligomer_replication
          name: Independent replication of the Abeta oligomer immunoblot result
          description: Replication of the Abeta-dimer/trimer/tetramer and ADDL immunoblot findings in
            an independent laboratory with pre-registered antibodies, peptide-competition controls, and
            disease controls that include chronically denervated and oculopharyngeal muscular dystrophy
            muscle rather than normal muscle alone.
          supporting_outcome:
          - Reproduction of the oligomer signal in IBM but not in chronic-denervation or OPMD controls
            would restore the hypothesis to ALTERNATIVE status.
          refuting_outcome:
          - Failure to reproduce the signal, or an equal signal in the chronic-injury controls, would
            confirm the DEPRECATED assessment.
        - experiment_id: ibm_amyloid_burden_versus_progression
          name: Amyloid burden against clinical progression
          description: Test whether quantified muscle amyloid-beta burden at biopsy predicts subsequent
            rate of functional decline, independently of T cell infiltrate density and TDP-43 cryptic
            exon burden, in a prospectively followed cohort.
          supporting_outcome:
          - An association between amyloid burden and subsequent decline that survives adjustment for
            T cell infiltrate density and TDP-43 cryptic exon burden would support a causal role even
            at low fibre frequency.
          refuting_outcome:
          - No independent association would confirm amyloid as a bystander marker of chronic fibre injury.
      selected_evidence:
        snippet: The presence of as little as >1% of myofibers with nonnuclear sarcoplasmic TDP-43 was
          highly sensitive (91%) and specific (100%) to IBM among 50 inflammatory myopathy patient samples
        supports: REFUTE
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19533646
      reference_title: Sarcoplasmic redistribution of nuclear TDP-43 in inclusion body myositis.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes the marker that displaced amyloid-beta: TDP-43 mislocalization, not amyloid,
        carries the diagnostic specificity that the amyloid hypothesis claimed.'
