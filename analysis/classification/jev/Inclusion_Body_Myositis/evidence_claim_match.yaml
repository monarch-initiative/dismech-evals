      reference_title: Mitochondrial dysfunction in skeletal muscle of amyloid precursor protein-overexpressing
        mice.
      evidence_source: MODEL_ORGANISM
      explanation: 'Forced intramyofibre beta-amyloid accumulation produced mitochondrial structural damage,
        reduced TCA-cycle activity, a shift to anaerobic glucose metabolism, increased ROS and plasmalemmal
        depolarization by 2-3 months of age, ahead of overt histopathology. Graded INDIRECT because the
        finding comes from an APP-overexpressing mouse rather than from IBM muscle: it shows amyloid-beta
        can be upstream of mitochondrial injury in principle, not that it is upstream in the human disease.'
