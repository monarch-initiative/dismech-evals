      assertion_type: Treatment
      assertion:
        name: Intravenous Immunoglobulin (IVIG)
        description: IVIG has been tested in randomised controlled trials in IBM without demonstrating
          a sustained strength benefit; the Cochrane review could not pool the trials or draw conclusions
          from them. It retains a limited, non-consensus role in selected patients with refractory dysphagia,
          where transient swallowing improvement has been reported, but it does not alter the overall
          course of the disease.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: immunoglobulin infusion therapy
          term:
            id: NCIT:C62710
            label: Immunoglobulin Therapy
        target_phenotypes:
        - preferred_term: Oral-pharyngeal dysphagia
          term:
            id: HP:0200136
            label: Oral-pharyngeal dysphagia
      selected_evidence:
        snippet: Three trials (n = 78) compared intravenous immunoglobulin (combined in one trial with
          prednisone) to a placebo, but we were unable to perform meta-analysis because of variations
          in study analysis and presentation of trial data, with no access to the primary data for re-analysis.
        supports: SUPPORT
