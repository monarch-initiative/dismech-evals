      assertion_type: DifferentialDiagnosis
      assertion:
        name: Polymyositis
        description: Historically the most common misdiagnosis. Contemporary opinion holds that many cases
          labelled polymyositis are better classified as IBM, immune-mediated necrotizing myopathy or
          antisynthetase syndrome. Steroid-refractory "polymyositis", especially with finger-flexor or
          quadriceps selectivity, should prompt reassessment for IBM.
        disease_term:
          preferred_term: Polymyositis
          term:
            id: MONDO:0019127
            label: polymyositis
        distinguishing_features:
        - Selective deep finger flexor and quadriceps weakness in IBM
        - Rimmed vacuoles and p62/TDP-43 aggregates on biopsy in IBM, absent in polymyositis
        - Refractoriness to corticosteroids in IBM
        - Invasion of muscle by large granular lymphocytes in IBM but rarely in polymyositis
      selected_evidence:
        snippet: Muscle immunohistochemistry demonstrated invasion of large granular lymphocytes into
          muscle in 15/15 inclusion body myositis patients but in only 1/28 patients with dermatomyositis
          or polymyositis.
        supports: SUPPORT
    origin:
