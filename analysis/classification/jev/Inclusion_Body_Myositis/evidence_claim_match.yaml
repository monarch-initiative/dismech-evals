        context: []
      assertion_type: Treatment
      assertion:
        name: Ulviprubart (ABC008, anti-KLRG1)
        description: A monoclonal antibody designed to deplete highly differentiated KLRG1+ cytotoxic
          T cells while sparing naive and regulatory compartments, directly targeting the effector population
          identified as pathogenic in IBM. The registrational phase 2/3 MUSCLE trial (NCT05721573, 272
          participants, primary endpoint IBMFRS change at week 76) completed in November 2025. Sponsor
          topline announcements report that the trial did NOT meet its primary endpoint or key secondary
          endpoints in the overall population, with favourable trends limited to a mild-to-moderate disease
          subgroup. This is the most direct test of the autoimmune-primary hypothesis conducted to date
          and its failure is meaningful negative evidence for that model. See notes for the important
          provenance caveat.
        notes: 'PROVENANCE CAVEAT: the negative topline result is sourced from sponsor press releases
          (24 February 2026 topline; detailed data presented 26 March 2026), which are NOT peer-reviewed
          and are NOT yet posted as results on ClinicalTrials.gov (the registry record still reports hasResults=false
          as of the 2026-01-29 last update). It is therefore recorded here as a note rather than as a
          snippet-validated evidence item, per the repository rule that an unquotable claim belongs in
          notes. The subgroup trend must NOT be read as efficacy: it is a subgroup analysis in a trial
          that missed its primary endpoint. Replace this note with proper evidence when the peer-reviewed
          publication or registry results appear.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: monoclonal antibody
            term:
              id: NCIT:C20401
              label: Monoclonal Antibody
      selected_evidence:
        snippet: Targeting highly differentiated cytotoxic T cells could be a favourable approach to treatment
          of inclusion body myositis.
        supports: SUPPORT
    origin:
