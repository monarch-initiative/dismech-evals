          by itself indicate a separate haematological disease
      selected_evidence:
        snippet: Most (22/38; 58%) patients with inclusion body myositis had aberrant populations of large
          granular lymphocytes in their blood meeting standard diagnostic criteria for T cell large granular
          lymphocytic leukaemia.
