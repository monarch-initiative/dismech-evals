  cb19b513fe9502b27ad2a7233fdce4e8d29e8490a24e8d4d95342e747c9624a1:
    claim:
      about:
        disease:
          name: Inclusion Conjunctivitis
          disease_term:
            preferred_term: inclusion conjunctivitis
            term:
              id: MONDO:0005808
              label: inclusion conjunctivitis
        context: []
      assertion_type: AgentLifeCycle
      assertion:
        description: C. trachomatis is modeled with humans as the relevant host and without an arthropod
          vector. Infectious elementary bodies are deposited on conjunctival epithelium, enter conjunctival
          epithelial cells, convert inside a membrane-bound chlamydial inclusion into noninfectious reticulate
          bodies, replicate, and then redifferentiate into elementary bodies that are released to infect
          neighboring epithelial cells.
        hosts:
        - preferred_term: human
          role: obligate human reservoir and mucosal host
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        life_cycle_stages:
        - name: Elementary-body entry into conjunctival epithelial cells
          description: The elementary body is the infectious extracellular form that is taken up by a
            eukaryotic epithelial host cell and establishes the intracellular chlamydial inclusion.
        - name: Reticulate-body replication and elementary-body redifferentiation
          description: Within the inclusion, the elementary body differentiates into the replicative reticulate
            body; reticulate bodies then proliferate and convert back to elementary bodies able to infect
            new host cells.
        notes: No vector or nonhuman reservoir is recorded for C. trachomatis inclusion conjunctivitis;
          the guinea-pig C. caviae system is useful experimentally but is not a natural reservoir for
          human ocular C. trachomatis infection.
      selected_evidence:
        snippet: Chlamydia are obligate intracellular bacteria that reside within a membrane-bound compartment
          called the chlamydial inclusion inside a eukaryotic host cell.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /agent_life_cycle
      evidence_path: /agent_life_cycle/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35703434
      reference_title: Differential Effects of Small Molecule Inhibitors on the Intracellular Chlamydia
        Infection.
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      explanation: Establishes that Chlamydia spp. complete their developmental cycle inside a host-cell
        chlamydial inclusion.
