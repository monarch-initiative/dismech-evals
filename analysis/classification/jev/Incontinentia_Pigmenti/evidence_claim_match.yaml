      assertion_type: Pathophysiology
      assertion:
        name: Bystander NF-kB-Competent Eotaxin Secretion and Eosinophil Recruitment
        biological_scale: CELLULAR
        description: In the mosaic epidermis the surviving NEMO-competent cells (those with the wild-type
          X active) respond to inflammatory stimuli by activating NF-kB and secreting the eosinophil-selective,
          NF-kB-activated chemokine eotaxin. This drives the massive epidermal eosinophil infiltration
          and peripheral eosinophilia that characterize the first (vesiculobullous) stage — the florid
          inflammation of IP thus arises from the NF-kB that the mutant cells have lost, produced instead
          by their normal neighbors.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
      selected_evidence:
        snippet: Monoclonal antibody (6H9) specific for human eotaxin strongly labelled the suprabasal
          epidermis of IP skin, paralleling the upper epidermal accumulation of eosinophils
        supports: SUPPORT
