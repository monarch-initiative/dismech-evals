        biological_scale: ORGANISM
        description: Selective apoptotic elimination of cells expressing the mutant IKBKG allele has divergent
          organism-level outcomes by sex. In affected females the surviving cells preferentially express
          the wild-type X, producing the mosaic Blaschko-linear distribution and permitting survival.
          Hemizygous male conceptuses carrying a null allele have no wild-type cells to select for and
          miscarry; the rare surviving affected males have a 47,XXY karyotype or somatic mosaicism.
      selected_evidence:
        snippet: Surviving mice recover almost completely, presumably through clearing the skin of NEMO-deficient
          keratinocytes.
        supports: SUPPORT
