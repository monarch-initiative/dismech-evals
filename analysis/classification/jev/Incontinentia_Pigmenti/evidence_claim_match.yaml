        context: []
      assertion_type: Genetic
      assertion:
        name: IKBKG
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: IKBKG
          term:
            id: hgnc:5961
            label: IKBKG
        notes: 'IP is caused by loss-of-function variants in IKBKG (NEMO). The major genetic defect (~65-80%
          of unrelated probands) is a recurrent heterozygous deletion of exons 4-10 (IKBKGdel), a complete-loss-of-function
          allele generated by recombination at the structurally unstable Xq28 locus; the remainder carry
          small indels, nonsense, or splice-site variants. The exon 4-10 deletion recurs independently
          in unrelated families (a recurrent rearrangement, not a single ancestral founder allele). IKBKG
          is allelic with a distinct disorder: hypomorphic (partial-function) IKBKG variants in hemizygous
          males cause ectodermal dysplasia with immunodeficiency (EDA-ID; see the IKBKG_Ectodermal_Dysplasia_with_Immunodeficiency
          entry), whereas the null alleles here cause male-lethal incontinentia pigmenti in heterozygous
          females.'
      selected_evidence:
        snippet: The major genetic defect in IP is a heterozygous exon4_10 IKBKG deletion (IKBKGdel)
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
