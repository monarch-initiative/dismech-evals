        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ip_genotype_phenotype
        prompt: Why is the phenotypic expressivity of IP so highly variable — from skin-limited disease
          to severe ocular and CNS involvement — when most patients carry the same recurrent exon 4-10
          IKBKG deletion, and what determines which organs are affected in a given individual?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#IKBKG (NEMO) Loss of Function
        - pathophysiology#Cerebral Vaso-Occlusive and Neuronal Injury
        rationale: Because the predominant lesion is a single recurrent null deletion, allele identity
          alone cannot explain why some individuals have skin-limited disease while others develop sight-
          or life-threatening ocular and neurologic involvement. The degree and tissue distribution of
          X-inactivation skewing is a leading candidate modifier, but the genotype-phenotype relationship
          remains unresolved and limits prognostic counseling.
      selected_evidence:
        snippet: the clinical genotype-phenotype correlation remains unclear due to its highly variable
          phenotypic expressivity.
        supports: SUPPORT
