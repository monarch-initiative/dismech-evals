      assertion:
        discussion_id: interp_ip_bystander_nfkb_paradox
        prompt: How can IP — a disease of NF-kB LOSS — present with a florid, NF-kB-driven eosinophilic
          inflammation in its first stage?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Bystander NF-kB-Competent Eotaxin Secretion and Eosinophil Recruitment
        - pathophysiology#Stage I Vesiculobullous Eruption
        rationale: 'The apparent paradox is resolved by mosaicism: the eosinophil-recruiting chemokine
          eotaxin is NF-kB-activated and is secreted not by the NEMO-null cells but by the surviving NEMO-competent
          bystander cells that retain the wild-type X as the active allele. The inflammation of IP is
          therefore produced by the very NF-kB signaling the mutant cells have lost, generated by their
          normal neighbors — an interpretation important for reading the stage-I histology and for not
          mistaking IP for a primary inflammatory or infectious dermatosis.'
      selected_evidence:
        snippet: are probably produced by the adjacent IKKγ+cells, since NF-κB is not activated in IKKγ
        supports: SUPPORT
