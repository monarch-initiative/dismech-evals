      assertion_type: Pathophysiology
      assertion:
        name: Heightened Susceptibility to TNF-Induced Apoptosis
        biological_scale: CELLULAR
        description: Because NF-kB normally induces anti-apoptotic genes, NEMO-deficient cells (keratinocytes,
          vascular endothelium, neurons) lose this cytoprotection and become hypersensitive to TNF-induced
          apoptosis and necrosis — a stimulus that is pro-survival in normal cells becomes lethal. This
          apoptotic vulnerability is the shared cellular mechanism behind the skin, ocular, and CNS lesions
          and behind the selective elimination of mutant-X cells.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: NEMO deletion completely inhibited NF-kappaB activation and sensitized keratinocytes
          to tumor necrosis factor (TNF)-induced death but did not affect epidermal development.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
