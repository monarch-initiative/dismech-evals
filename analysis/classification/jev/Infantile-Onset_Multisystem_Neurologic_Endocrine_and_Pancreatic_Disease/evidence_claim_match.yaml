        description: Reduced Purkinje cell size and density, stunted dendrites, lower phosphorylated ribosomal
          protein S6, and marked cell loss by adulthood, with progressive cerebellar atrophy and ataxia
          at the whole-animal level.
        limitations: The human counterpart is inferred from MRI atrophy; no human IMNEPD cerebellar tissue
          has been examined. And the model is a Purkinje-cell deletion, where patients are constitutive
          biallelic carriers, so it isolates the cell-autonomous contribution by construction and says
          nothing about how much of the human cerebellar phenotype is cell-autonomous.
        readouts:
