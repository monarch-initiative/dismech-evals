            term:
              id: MONDO:0024189
              label: neurologic, endocrine, and pancreatic disease, multisystem, infantile-onset
        context: []
      assertion_type: Genetic
      assertion:
        name: PTRH2
        gene_term:
          preferred_term: PTRH2
          term:
            id: hgnc:24265
            label: PTRH2
        relationship_type: CAUSATIVE
        notes: 'PTRH2 on 17q23.1 encodes peptidyl-tRNA hydrolase 2, also called BIT1. It was not associated
          with any disease before 2014. Biallelic variants cause IMNEPD.

          The allele spectrum is unusual in being dominated by one recurrent missense change, p.Gln85Pro,
          across unrelated consanguineous Arab communities. That allele leaves transcription intact and
          destabilises the protein, which is why a missense change behaves as loss of function here.'
        variants:
        - name: c.269_270delCT, p.Ala90fs
          description: Homozygous in the founding Yazidian-Turkish family of two affected siblings. A
            frameshift, and the allele that established the gene-disease relationship.
        - name: c.254A>C, p.Gln85Pro
          description: The recurrent missense allele, reported in multiple unrelated consanguineous families.
            Patient fibroblasts carrying it have normal PTRH2 mRNA and strongly reduced protein, so it
            acts by destabilising the protein rather than by preventing its transcription.
      selected_evidence:
        snippet: In a consanguineous family with two individuals with IMNEPD, we identified a homozygous
          frameshift mutation in the previously not disease-associated peptidyl-tRNA hydrolase 2 (PTRH2)
          gene.
        supports: SUPPORT
