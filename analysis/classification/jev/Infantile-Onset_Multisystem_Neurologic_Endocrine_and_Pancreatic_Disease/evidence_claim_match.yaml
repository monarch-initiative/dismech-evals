        - path: /genetic/0
          value:
            name: PTRH2
            gene_term:
              preferred_term: PTRH2
              term:
                id: hgnc:24265
                label: PTRH2
            relationship_type: CAUSATIVE
            notes: 'PTRH2 on 17q23.1 encodes peptidyl-tRNA hydrolase 2, also called BIT1. It was not associated
              with any disease before 2014. Biallelic variants cause IMNEPD.

              The allele spectrum is unusual in being dominated by one recurrent missense change, p.Gln85Pro,
              across unrelated consanguineous Arab communities. That allele leaves transcription intact
              and destabilises the protein, which is why a missense change behaves as loss of function
              here.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: c.254A>C, p.Gln85Pro
        description: The recurrent missense allele, reported in multiple unrelated consanguineous families.
          Patient fibroblasts carrying it have normal PTRH2 mRNA and strongly reduced protein, so it acts
          by destabilising the protein rather than by preventing its transcription.
      selected_evidence:
        snippet: PTRH2 protein levels were strongly reduced in fibroblasts from patient II.1, family 2,
          while PTRH2 mRNA levels were unchanged
        supports: SUPPORT
