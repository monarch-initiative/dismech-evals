            preferred_term: neurologic, endocrine, and pancreatic disease, multisystem, infantile-onset
            term:
              id: MONDO:0024189
              label: neurologic, endocrine, and pancreatic disease, multisystem, infantile-onset
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Adhesion-Dependent Survival Signalling
        biological_scale: CELLULAR
        description: 'PTRH2, as BIT1, is a mitochondrial protein released into the cytosol when a cell
          loses contact with the extracellular matrix, where it complexes with the Groucho/TLE protein
          AES and drives caspase-independent apoptosis. Attachment to fibronectin counteracts it. So the
          wild-type protein sits on both sides of a survival decision, and losing it removes both the
          death signal and the attachment-dependent survival arm.

          This node is the mechanism most often quoted for IMNEPD and the one least connected to it: the
          anoikis work is cell-biological and predates the disease, and no published study demonstrates
          dysregulated anoikis in patient tissue. It is recorded because it is what PTRH2 does, with the
          gap stated rather than bridged.'
        biological_processes:
        - preferred_term: cell-matrix adhesion
          modifier: ABNORMAL
          term:
            id: GO:0007160
            label: cell-matrix adhesion
      selected_evidence:
        snippet: Cytoplasmic Bit1 forms a complex with AES, a small Groucho/transducin-like enhancer of
          split (TLE) protein, and induces cell death with characteristics of caspase-independent apoptosis.
        supports: SUPPORT
    origin:
