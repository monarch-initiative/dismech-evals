  902be39436a4b429be89caae561ad322c40280a9fed8bc3ba89ef39ccdd5f6ff:
    claim:
      about:
        disease:
          name: Infantile Cataract, Skin Abnormalities, Glutamate Excess, and Impaired Intellectual Development
          disease_term:
            preferred_term: infantile cataract, skin abnormalities, glutamate excess, and impaired intellectual
              development
            term:
              id: MONDO:0032685
              label: infantile cataract, skin abnormalities, glutamate excess, and impaired intellectual
                development
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: casgid-skin-abnormalities-in-name-unevidenced
        kind: KNOWLEDGE_GAP
        status: RESOLVED
        prompt: The OMIM/MONDO name for this entity asserts "skin abnormalities", but the primary report's
          abstract does not document any dermatological phenotype. What is the skin phenotype, and how
          frequent is it?
        rationale: 'The entity name (OMIM 618339, MONDO:0032685) lists four features: infantile cataract,
          skin abnormalities, glutamate excess, and impaired intellectual development. Three of the four
          are evidenced in the abstract of the original report (PMID:30239721); the skin abnormalities
          are not mentioned there at all, and the clinical table in PMID:31603991 itemizes this patient
          only under Development, Neurologic, Structural, and Ophthalmologic headings. The entry initially
          omitted the skin phenotype rather than curate it on the strength of a disease name.'
        resolution_note: 'Resolved by the discussion prose of PMID:31603991, which does record skin involvement
          for this disorder even though its per-patient table does not: "Different skin abnormalities
          are seen in patients with GS deficiency, GLS hyperactivity, PSAT and TAT deficiency", reported
          as 2.5-3.0x more common in glutamate-related disorders than in other Mendelian disorders. A
          Skin abnormality phenotype bound to HP:0000951 has been added on that basis. Two limits remain
          and are deliberately not overstated: the source does not say which specific skin findings this
          patient had, so no specific lesion is asserted; and the statement is made at the level of the
          disorder class rather than the individual, so it substantiates the "skin abnormalities" component
          of the entity name without establishing its severity or frequency in a single reported case.
          The oxidative-stress question below remains a live mechanistic hypothesis rather than a documented
          finding.'
        attaches_to:
        - pathophysiology#Impaired Reactive Oxygen Species Detoxification
        proposed_experiments:
        - experiment_id: exp_casgid_skin_phenotype_specificity
          name: Characterize which skin findings occur in GLS hyperactivity
          description: Retrieve the full text of PMID:30239721 (or the OMIM 618339 clinical synopsis)
            and extract the specific dermatological findings, so the annotation can be refined from the
            general HP:0000951 to a specific lesion term.
        - experiment_id: exp_casgid_ros_skin_mechanism
          name: Test whether the lens oxidative-stress mechanism extends to skin
          description: Assess whether the impaired reactive-oxygen-species detoxification already curated
            for the lens also operates in skin, since that defect is not tissue-restricted and the review
            links reduced redox buffer capacity to cataract. Patient fibroblasts are already available
            and showed the amino acid imbalance, making them the natural test system.
        posed_by: curator
        resolved_date: '2026-08-07T00:00:00Z'
      selected_evidence:
        snippet: Different skin abnormalities are seen in patients with GS deficiency, GLS hyperactivity,
          PSAT and TAT deficiency
        supports: SUPPORT
