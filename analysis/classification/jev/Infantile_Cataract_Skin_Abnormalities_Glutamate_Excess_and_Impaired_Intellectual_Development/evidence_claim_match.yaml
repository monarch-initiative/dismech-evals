      assertion_type: Genetic
      assertion:
        name: GLS
        gene_term:
          preferred_term: GLS
          term:
            id: hgnc:4331
            label: GLS
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: 'A heterozygous de novo missense variant p.Ser482Cys in GLS causes this disorder by a hypermorphic
          (gain-of-function) mechanism — the enzyme is intrinsically hyperactive. This is the opposite
          direction of effect from the biallelic loss-of-function alleles that cause Neonatal Epileptic
          Encephalopathy Due to Glutaminase Deficiency, and from the noncoding 5'' untranslated region
          GCA-repeat expansion that causes Global Developmental Delay, Progressive Ataxia, and Elevated
          Glutamine. Inheritance is correspondingly different: this entity is mono-allelic and dominant,
          arising de novo, whereas both loss-of-function entities are bi-allelic and autosomal recessive.

          '
        variants:
        - name: GLS p.Ser482Cys
          description: De novo heterozygous missense variant substituting cysteine for the highly conserved
            serine at position 482 of glutaminase. Not a catalytic residue, but conserved to the same
            degree as the catalytic residues; the substitution is proposed to improve the electrostatic
            environment of the catalytic site and thereby raise activity.
          gene:
            preferred_term: GLS
            term:
              id: hgnc:4331
              label: GLS
      selected_evidence:
        snippet: GLS hyperactivity illustrates that mono‐allelic, dominant enzyme defects can be harmful
          as well.
        supports: SUPPORT
