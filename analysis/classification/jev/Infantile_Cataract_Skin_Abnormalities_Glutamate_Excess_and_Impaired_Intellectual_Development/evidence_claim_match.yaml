  9204cdf8af691f0b2e84149a393fe4a50a1f90d4e5183bccf5dcc6897a9a6fe2:
    claim:
      about:
        disease:
          name: Infantile Cataract, Skin Abnormalities, Glutamate Excess, and Impaired Intellectual Development
          disease_term:
            preferred_term: infantile cataract, skin abnormalities, glutamate excess, and impaired intellectual
              development
            term:
              id: MONDO:0032685
              label: infantile cataract, skin abnormalities, glutamate excess, and impaired intellectual
                development
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Broad Metabolic Network Remodeling
        biological_scale: MOLECULAR
        description: 'Because glutaminase sits at the junction of many pathways, its hyperactivity remodels
          the metabolome well beyond the glutamine/glutamate pair. In a HEK293 model tuning GLS activity,
          109 endogenously relevant metabolite features were significantly affected: TCA-cycle intermediates
          rose with a truncation of the cycle at citrate; transamination products, proline and ornithine
          synthesis, and GABA metabolism increased; and asparagine and nucleotide metabolites — notably
          pyrimidine/thymine metabolites — fell in step with glutamine. This positions the disorder as
          a broad metabolic perturbation rather than a single-metabolite excess, and plausibly underlies
          the mild hyperammonemia and the raised brain alanine and lactate reported in the patient.

          '
        biological_processes:
        - preferred_term: glutamate metabolic process
          term:
            id: GO:0006536
            label: glutamate metabolic process
          modifier: INCREASED
      selected_evidence:
        snippet: 109 features corresponding to endogenously relevant metabolites were significantly affected
          by high GLS activity
        supports: SUPPORT
