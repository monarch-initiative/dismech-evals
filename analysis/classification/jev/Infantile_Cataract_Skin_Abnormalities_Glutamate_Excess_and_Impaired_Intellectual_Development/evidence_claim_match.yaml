              id: MONDO:0032685
              label: infantile cataract, skin abnormalities, glutamate excess, and impaired intellectual
                development
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Glutamate Excess and Glutamine Depletion
        biological_scale: MOLECULAR
        description: 'Hyperactive glutaminase drives excessive conversion of glutamine to glutamate. Increased
          glutamate with decreased glutamine was measured in urine and in fibroblasts, and the imbalance
          is far more extreme in brain, where magnetic resonance spectroscopic imaging showed extremely
          high glutamate in both grey and white matter with glutamine almost undetectable. This is the
          exact biochemical inverse of the hyperglutaminemia of glutaminase deficiency. Notably the imbalance
          is compartment-dependent: cerebrospinal-fluid glutamate and glutamine were reported as unremarkable
          even while brain-tissue spectroscopy was grossly abnormal, so a normal CSF amino acid profile
          does not exclude the diagnosis.

          '
        biological_processes:
        - preferred_term: L-glutamine catabolic process
          term:
            id: GO:0006543
            label: L-glutamine catabolic process
          modifier: INCREASED
        - preferred_term: L-glutamate biosynthetic process
          term:
            id: GO:0097054
            label: L-glutamate biosynthetic process
          modifier: INCREASED
      selected_evidence:
        snippet: In line with GLS hyperactivity, increased glutamate and decreased glutamine concentrations
          were measured in urine and fibroblasts.
        supports: SUPPORT
