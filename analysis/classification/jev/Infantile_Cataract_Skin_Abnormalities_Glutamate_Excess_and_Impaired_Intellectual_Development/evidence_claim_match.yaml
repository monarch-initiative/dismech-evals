        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Homeostatic Compensation
        biological_scale: CELLULAR
        description: 'Cells mount a two-armed homeostatic response to the hyperactive enzyme: compensatory
          downregulation of GLS expression, and upregulation of the counteracting enzyme glutamine synthetase,
          which runs the reverse reaction (glutamate to glutamine). The persistence of severe glutamate
          excess and glutamine depletion in patient tissues shows this compensation to be insufficient.
          The presence of the compensatory response is itself part of the evidence for pathogenicity,
          since it demonstrates the cell registers the variant as a perturbation.

          '
      selected_evidence:
        snippet: compensatory downregulation of GLS expression combined with upregulation of the counteracting
          enzyme GS, supporting pathogenicity
        supports: SUPPORT
