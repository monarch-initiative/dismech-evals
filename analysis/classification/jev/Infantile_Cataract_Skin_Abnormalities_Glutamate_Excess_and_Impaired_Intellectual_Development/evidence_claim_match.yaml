        biological_scale: MOLECULAR
        description: 'The primary lesion is a heterozygous de novo missense variant, p.Ser482Cys, in GLS.
          Ser482 is not itself a catalytic residue but is conserved to the same degree as the catalytic
          residues across roughly 12,000 GLS sequences from more than 1,000 genera — evidence that its
          identity is under strong selection precisely because it tunes enzyme activity downward.

          '
      selected_evidence:
        snippet: We report a de novo Ser482Cys gain-of-function variant in GLS encoding GLS associated
          with profound developmental delay and infantile cataract.
        supports: SUPPORT
