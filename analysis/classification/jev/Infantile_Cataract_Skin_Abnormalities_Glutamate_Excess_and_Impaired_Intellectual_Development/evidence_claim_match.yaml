      assertion:
        name: Glutamate Neurotoxicity
        biological_scale: CELLULAR
        description: 'Glutamate is neurotoxic in excess (excitotoxicity), and the brain glutamate concentrations
          measured in this patient were strikingly high. The original authors advance this as the explanation
          for the profound developmental delay. Note the direction of the claim: this is the same neurotransmitter
          whose deficiency is invoked in GLS loss-of-function disease, so glutaminase disorders damage
          the brain from either direction.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: It is however remarkable that the patient with GLS hyperactivity and glutamate excess
          in the brain did not develop seizures.
        supports: SUPPORT
