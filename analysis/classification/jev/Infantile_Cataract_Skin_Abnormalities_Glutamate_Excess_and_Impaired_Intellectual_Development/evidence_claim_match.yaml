        context: 'Plasma and cerebrospinal-fluid glutamate and glutamine are normal, despite grossly abnormal
          brain spectroscopy and urine in the same patient — a compartment dissociation the review attributes
          to the tissue-specific expression of GLS, noting that CSF is formed by the choroid plexus, where
          glutamate and glutamine are regulated by glutamine synthetase rather than glutaminase. This
          is diagnostically decisive: a normal plasma or CSF amino acid profile does not exclude this
          disorder, so brain MR spectroscopy is the investigation that finds it.

          '
      selected_evidence:
        snippet: This illustrates that normal CSF values do not exclude the possibility of abnormal glutamate
          values in the brain.
        supports: SUPPORT
