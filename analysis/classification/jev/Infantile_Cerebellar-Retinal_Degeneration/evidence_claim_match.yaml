  4e1019cda46eaef6cb633d20973c9c5bb4f93582c48df86c8fecfb1092be2741:
    claim:
      about:
        disease:
          name: Infantile Cerebellar-Retinal Degeneration
          disease_term:
            preferred_term: infantile cerebellar-retinal degeneration
            term:
              id: MONDO:0013802
              label: infantile cerebellar-retinal degeneration
        context: []
      assertion_type: Treatment
      assertion:
        name: Triheptanoin anaplerotic therapy
        description: 'Triheptanoin, a C7 triglyceride, given to two brothers with ACO2 deficiency. It
          is anaplerotic: its odd-chain metabolites enter the Krebs cycle as succinyl-CoA, downstream
          of the aconitase step, so it refills cycle intermediates without requiring the blocked enzyme.
          Motor abilities improved in both patients. This is the only treatment curated here that acts
          on the mechanism rather than on its consequences.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: anaplerotic therapy with triheptanoin
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: 'therapeutic_agent is left unbound: triheptanoin has no row in the local CHEBI term cache,
          and a CURIE is never written without reading it from a source in the same step. The evidence
          is two brothers in an open-label in vivo trial with a subjective motor endpoint, so this is
          recorded as a mechanistically rational intervention with a promising result, not as established
          therapy.'
      selected_evidence:
        snippet: In an in vivo trial, triheptanoin was used to bypass the defective aconitase 2 and fill
          up the citric acid cycle. Motor abilities in both patients improved.
        supports: SUPPORT
