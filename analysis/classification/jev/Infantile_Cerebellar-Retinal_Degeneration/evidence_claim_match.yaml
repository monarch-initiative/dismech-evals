  dd1ce292a0285aee6c55e1526ea2afbbb5cd6a973c13a17247825ca83b37324b:
    claim:
      about:
        disease:
          name: Infantile Cerebellar-Retinal Degeneration
          disease_term:
            preferred_term: infantile cerebellar-retinal degeneration
            term:
              id: MONDO:0013802
              label: infantile cerebellar-retinal degeneration
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Krebs Cycle Flux Block
        biological_scale: MOLECULAR
        description: An isolated interruption of the tricarboxylic acid cycle. This node, rather than
          a respiratory-chain node, is where the mechanism sits, because the respiratory chain was measured
          and found intact. Plasma metabolomics in affected patients yields a diagnostic metabolic fingerprint,
          which is consistent with an accumulating upstream substrate pool rather than with a general
          failure of mitochondrial energy production.
        biological_processes:
        - preferred_term: tricarboxylic acid cycle
          modifier: DECREASED
          term:
            id: GO:0006099
            label: tricarboxylic acid cycle
      selected_evidence:
        snippet: We also observed a deficiency in cellular respiration and, for the first time, demonstrate
          evidence of mitochondrial DNA depletion and altered expression of some TCA components and electron
          transport chain subunits.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26992325
      reference_title: Functional cellular analyses reveal energy metabolism defect and mitochondrial
        DNA depletion in a case of mitochondrial aconitase deficiency.
      evidence_source: IN_VITRO
      explanation: 'Records the downstream consequences seen in patient fibroblasts. Curated to keep the
        entry''s OXPHOS exclusion honest: the respiratory-chain normality is a muscle-mitochondria result,
        and in fibroblasts respiration is impaired and mtDNA is depleted. This does not displace the flux
        block as the primary lesion; it bounds the claim to the tissue in which it was measured.'
