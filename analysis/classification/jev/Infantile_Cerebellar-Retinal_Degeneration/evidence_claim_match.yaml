  5f3f290e42d5c07e5726411988f3c48bb539ae920c145c46e1fd362c6821ab73:
    claim:
      about:
        disease:
          name: Infantile Cerebellar-Retinal Degeneration
          disease_term:
            preferred_term: infantile cerebellar-retinal degeneration
            term:
              id: MONDO:0013802
              label: infantile cerebellar-retinal degeneration
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: aco2_selective_tissue_vulnerability
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does loss of a ubiquitous Krebs-cycle enzyme damage the cerebellum, optic nerve and
          retina in particular?
        attaches_to:
        - pathophysiology#Krebs Cycle Flux Block
        - pathophysiology#Progressive Neuronal and Photoreceptor Degeneration
        rationale: 'Mitochondrial aconitase is expressed in every tissue with mitochondria, and the enzymatic
          deficit was demonstrated in lymphoblasts - a cell type that is not clinically affected. Yet
          the disease is concentrated in cerebellum, optic nerve and retina, with the cortex involved
          enough to give evolving microcephaly and the muscle apparently spared.

          Nothing curated here explains this. The usual candidate accounts - high and inflexible energy
          demand in retinal ganglion cells and their long unmyelinated axons, limited metabolic reserve
          in cerebellar neurons, or a tissue-specific consequence of substrate accumulation rather than
          of ATP shortfall - are plausible and untested in this disorder.

          This gap is not decorative. The same selective vulnerability pattern is what the dominant ACO2
          optic atrophy shows in isolation, so whatever explains the tissue selectivity may also explain
          why a monoallelic dose produces an eye-limited disease while a biallelic dose produces a multisystem
          one.'
      selected_evidence:
        snippet: Specific aconitase activity in the individuals' lymphoblasts was severely reduced.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
