        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: aco2_dominant_optic_atrophy_needs_own_entry
        kind: CURATION_TODO
        status: OPEN
        prompt: Should dominant ACO2-related isolated optic atrophy be a separate dismech Disease entry?
        attaches_to:
        - genetic#ACO2
        rationale: 'Yes, and this entry deliberately leaves room for it rather than absorbing it.

          Monoallelic ACO2 variants cause isolated dominant optic atrophy, and it is the numerically commoner
          ACO2 disease: 50 dominant index cases against 11 biallelic in one European screen of unsolved
          inherited optic neuropathies. It cannot be a has_subtypes record under this entry, because a
          subtype of a recessive disease cannot carry dominant inheritance, and dismech treats mode of
          inheritance as a split signal rather than a severity gradient.

          A third presentation sits between them: biallelic variants causing isolated ophthalmological
          phenotypes without neurological features. The literature records explicit doubt about whether
          that entity is real, so it should not be curated as established until that doubt resolves.

          Recorded as a CURATION_TODO rather than a knowledge gap because the science is settled and the
          outstanding work is curation.'
      selected_evidence:
        snippet: However, some doubt remains as to whether biallelic ACO2 variants can cause isolated
          ophthalmologic phenotypes.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32449285
      reference_title: Recessive ACO2 variants as a cause of isolated ophthalmologic phenotypes.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports leaving the third, recessive eye-limited presentation uncurated for now. Marked
        INDIRECT because it reports uncertainty rather than a finding.
