      assertion_type: Genetic
      assertion:
        name: ACO2
        gene_term:
          preferred_term: ACO2
          term:
            id: hgnc:118
            label: ACO2
        relationship_type: CAUSATIVE
        notes: 'ACO2 encodes mitochondrial aconitase, a Krebs-cycle enzyme. Its allelic spectrum spans
          three clinically distinct presentations, and only the first is curated in this entry.

          Biallelic variants cause this infantile neurological syndrome. Biallelic variants can also cause
          isolated ophthalmological phenotypes without the neurological features, though the literature
          records explicit doubt about that. Monoallelic variants cause dominant isolated optic atrophy,
          and that is numerically the commonest ACO2 disease: a European screen of genetically unsolved
          inherited optic neuropathies found 50 dominant index cases against 11 biallelic.

          The dominant disorder is not a subtype of this entry. A has_subtypes record under a recessive
          disease cannot carry a dominant mode of inheritance, and inheritance is a split signal rather
          than a severity gradient. It warrants its own Disease entry; see the discussion.'
      selected_evidence:
        snippet: By screening European cohorts of individuals with genetically unsolved inherited optic
          neuropathies, we identified 61 cases harbouring variants in ACO2, among whom 50 carried dominant
          mutations, emphasizing for the first time the important contribution of ACO2 monoallelic pathogenic
          variants to dominant optic atrophy.
        supports: SUPPORT
