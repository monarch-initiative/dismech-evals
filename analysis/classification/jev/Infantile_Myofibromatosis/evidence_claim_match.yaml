      assertion_type: Genetic
      assertion:
        name: PDGFRB Gain-of-Function Mutations
        gene_term:
          preferred_term: PDGFRB
          term:
            id: hgnc:8804
            label: PDGFRB
        association: Causative
        features: Heterozygous gain-of-function mutations in PDGFRB cause constitutive receptor activation
          in the absence of ligand. Mutations are located in the transmembrane, juxtamembrane, and kinase
          domains. In sporadic multicentric disease, mutations were found in 6 of 8 patients. A two-hit
          model has been proposed for familial myofibromatosis with a weakly-activating germline variant
          combined with a stronger somatic mutation.
      selected_evidence:
        snippet: Mutations in the coding sequence of PDGFRB were identified in 6 out of 8 patients with
          the sporadic multicentric form of the disease and in 1 out of 8 patients with isolated myofibroma.
        supports: SUPPORT
