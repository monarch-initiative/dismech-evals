  4d6d84c09414a5d8deef0c62fb28068e789f380d86aa508b7730ac48fc96da66:
    claim:
      about:
        disease:
          name: Infantile_Myofibromatosis
          disease_term:
            preferred_term: familial infantile myofibromatosis
            term:
              id: MONDO:0009227
              label: myofibromatosis, infantile, 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: PDGFRB Genetic Sequencing
        description: Paired deep sequencing or exome sequencing of both tumor biopsy tissue and germline
          (peripheral blood) DNA for activating PDGFRB variants supports diagnosis, distinguishes germline
          familial disease from post-zygotic somatic mosaicism, guides prognostic stratification for multicentric
          disease, and informs selection of tyrosine kinase inhibitor therapy. Because sporadic and multicentric
          cases are frequently somatic or mosaic—and separate nodules in the same patient can harbor either
          identical or independent somatic PDGFRB mutations—testing affected lesional tissue (and multiple
          separate nodules when available) alongside blood is essential when germline blood sequencing
          is negative.
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: Identification of germline, somatic, or mosaic activating variants in PDGFRB, clustering
          in the transmembrane, juxtamembrane, and kinase domains.
        notes: Activating PDGFRB mutations in infantile myofibromatosis include juxtamembrane domain variants
          (such as p.Arg561Cys and p.Pro560_Arg561delinsHis), kinase domain variants (such as p.Asn666Lys
          and p.Asp850Val), and transmembrane domain substitutions.
      selected_evidence:
        snippet: The PDGFRB sequencing appears to have a high value for diagnosis, prognosis, and therapy
          of soft-tissue tumors in children.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
