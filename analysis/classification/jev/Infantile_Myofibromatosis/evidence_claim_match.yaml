      assertion_type: Pathophysiology
      assertion:
        name: Constitutive PDGFRB Signaling
        description: Gain-of-function mutations in the transmembrane, juxtamembrane, and kinase domains
          of PDGFRB—or increased PDGFRB expression driven by hyperactive NOTCH3 signaling—lead to ligand-independent
          or enhanced receptor tyrosine kinase activation, transforming fibroblasts and promoting perivascular
          mesenchymal cell growth (both fibroblast and pericyte are bound in cell_types because the tumor
          cell of origin spans the perivascular pericyte-to-myofibroblast lineage continuum). In sporadic
          disease, activating PDGFRB mutations frequently arise as post-zygotic somatic mosaic events,
          reminiscent of multifocal venous malformations induced by TIE2 mutations.
        genes:
        - preferred_term: PDGFRB
          term:
            id: hgnc:8804
            label: PDGFRB
        genetic_context:
          gene:
            preferred_term: PDGFRB
            term:
              id: hgnc:8804
              label: PDGFRB
          variant_origin: SOMATIC
          functional_impact_category: GAIN_OF_FUNCTION
          description: Somatic or post-zygotic mosaic activating mutations in PDGFRB (or somatic second-hit
            activating mutations in familial disease) drive constitutive ligand-independent receptor tyrosine
            kinase signaling in perivascular myofibroblastic precursors.
        molecular_functions:
        - preferred_term: platelet-derived growth factor beta-receptor activity
          term:
            id: GO:0005019
            label: platelet-derived growth factor beta-receptor activity
        biological_processes:
        - preferred_term: platelet-derived growth factor receptor signaling pathway
          term:
            id: GO:0048008
            label: platelet-derived growth factor receptor signaling pathway
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: pericyte
          term:
            id: CL:0000669
            label: pericyte
      selected_evidence:
        snippet: the three other mutants were constitutively active and able to transform NIH3T3 and Ba/F3
          cells to different extents.
        supports: SUPPORT
