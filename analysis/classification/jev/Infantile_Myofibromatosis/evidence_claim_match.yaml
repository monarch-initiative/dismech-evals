            label: PDGFRB
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE_AND_SOMATIC
        association: Causative
        subtype: Infantile Myofibromatosis 1
        features: Heterozygous germline, post-zygotic mosaic, and/or lesion-restricted somatic gain-of-function
          mutations in PDGFRB (such as p.Arg561Cys, p.Asn666Lys, and p.Asp850Val) located in the transmembrane,
          juxtamembrane, and kinase domains cause constitutive receptor activation in the absence of ligand.
          Familial cases exhibit variable expressivity and frequently follow a two-hit model combining
          a weakly activating germline variant with a stronger somatic second hit in tumor tissue, whereas
          sporadic multicentric and solitary cases typically arise from somatic or mosaic mutations.
        notes: Gain-of-function PDGFRB variants cluster in the transmembrane, juxtamembrane, and kinase
          domains. While most mutants are sensitive to imatinib, the kinase-domain p.Asp850Val (D850V)
          substitution confers imatinib resistance while remaining sensitive to dasatinib and ponatinib.
        case_fractions:
        - population: Pediatric sporadic multicentric infantile myofibromatosis cohort
          case_fraction_percent: 68.4
          cohort_size: 19
          notes: 13 of 19 pediatric multicentric myofibromatosis cases carried gain-of-function PDGFRB
            mutations.
        - population: Sporadic multicentric infantile myofibromatosis sequencing series
          case_fraction_percent: 75.0
          cohort_size: 8
          notes: 6 of 8 patients with sporadic multicentric infantile myofibromatosis harbored coding
            PDGFRB mutations.
      selected_evidence:
        snippet: Mutations in the coding sequence of PDGFRB were identified in 6 out of 8 patients with
          the sporadic multicentric form of the disease and in 1 out of 8 patients with isolated myofibroma.
        supports: SUPPORT
