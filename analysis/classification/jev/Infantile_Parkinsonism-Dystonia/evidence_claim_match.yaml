      assertion_type: Pathophysiology
      assertion:
        name: Dopaminergic Neurodegeneration and Nigrostriatal Dysfunction
        description: Excess synaptic dopamine and impaired handling lead to dopamine toxicity, oxidative/carbonyl
          stress, TNF-alpha-mediated inflammation, and apoptotic neurodegeneration of midbrain dopaminergic
          neurons, demonstrated in patient iPSC-derived midbrain dopaminergic neurons and in the DAT knockout
          mouse, which recapitulates tremor, bradykinesia, and premature death. The substantia nigra and
          striatum are the principal affected structures of the nigrostriatal system, and their dysfunction
          underlies the progressive parkinsonism-dystonia phenotype.
        cell_types:
        - preferred_term: Midbrain dopaminergic neuron
          term:
            id: CL:0000700
            label: dopaminergic neuron
        biological_processes:
        - preferred_term: Neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
        - preferred_term: Neuroinflammatory response
          term:
            id: GO:0150076
            label: neuroinflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: we generated a midbrain dopaminergic (mDA) neuron model of DTDS that exhibited marked
          impairment of DAT activity, apoptotic neurodegeneration associated with TNFα-mediated inflammation,
          and dopamine toxicity.
        supports: SUPPORT
