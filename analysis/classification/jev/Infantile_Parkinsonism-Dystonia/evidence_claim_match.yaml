          variants include protein-truncating changes (nonsense, splice-site, deletions) and missense
          substitutions. A single autosomal dominant case caused by a heterozygous dominant-negative SLC6A3
          variant has been reported.
      selected_evidence:
        snippet: Infantile parkinsonism-dystonia due to dopamine transporter deficiency syndrome (DTDS)
          is an ultrarare childhood movement disorder caused by biallelic loss-of-function mutations in
          the SLC6A3 gene.
