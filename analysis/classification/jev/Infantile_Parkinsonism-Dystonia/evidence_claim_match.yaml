            term:
              id: MONDO:0013150
              label: parkinsonism-dystonia, infantile
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Synaptic Dopamine Homeostasis
        description: Impaired DAT-mediated reuptake reduces dopamine clearance, raising extracellular
          synaptic dopamine and increasing dopamine turnover. This is reflected biochemically as elevated
          cerebrospinal fluid homovanillic acid (HVA, a dopamine catabolite) with normal 5-hydroxyindoleacetic
          acid (5-HIAA), yielding a raised HVA:5-HIAA ratio, and by absent or markedly reduced presynaptic
          DAT tracer uptake in the basal ganglia on DaTscan.
        cell_types:
        - preferred_term: Midbrain dopaminergic neuron
          term:
            id: CL:0000700
            label: dopaminergic neuron
        biological_processes:
        - preferred_term: Regulation of dopamine secretion
          term:
            id: GO:0014059
            label: regulation of dopamine secretion
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Increased levels of HVA might reflect increased DA turnover promoted by higher extracellular
          DA levels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34002696
      reference_title: Psychomotor impairments and therapeutic implications revealed by a mutation associated
        with infantile Parkinsonism-Dystonia.
      evidence_source: IN_VITRO
      explanation: Explains the mechanistic link between loss of reuptake, increased extracellular dopamine,
