  aca4d8a1acd9d11acda83f34b5ae9ae4cf319b7df18974b2bf924cbca69713b5:
    claim:
      about:
        disease:
          name: Inflammatory Myofibroblastic Tumor
          disease_term:
            preferred_term: inflammatory myofibroblastic tumor
            term:
              id: MONDO:0015798
              label: inflammatory myofibroblastic tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acquired Resistance to Kinase Inhibition
        description: In patients treated with ALK (or ROS1) tyrosine kinase inhibitors, acquired resistance
          commonly emerges through secondary mutations in the ALK kinase domain (e.g., L1196M, G1202R,
          I1171N, G1269A) that impair drug binding, or through compensatory activation of bypass signaling
          pathways (e.g., EGFR, PDGFRB, MAPK, SHH). This limits the durability of targeted therapy and
          motivates sequential next-generation inhibitors and repeat molecular profiling at relapse.
        cell_types:
        - preferred_term: myofibroblast
          term:
            id: CL:0000186
            label: myofibroblast cell
        biological_processes:
        - preferred_term: receptor tyrosine kinase signaling
          modifier: INCREASED
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
      selected_evidence:
        snippet: Acquired resistance to ALK inhibitors is often accompanied by three types of secondary
          mutations in the ALK kinase domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33116613
      reference_title: Efficacy and Resistance of ALK Inhibitors in Two Inflammatory Myofibroblastic Tumor
        Patients with ALK Fusions Assessed by Whole Exome and RNA Sequencing.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents secondary ALK kinase-domain mutations as a recurrent mechanism of acquired
