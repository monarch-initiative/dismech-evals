              label: inflammatory myofibroblastic tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Clonal Receptor Tyrosine Kinase Gene Rearrangement
        genetic_context:
          variant_origin: SOMATIC
        description: A defining initiating event in roughly half of IMTs is a clonal chromosomal rearrangement
          of the ALK receptor tyrosine kinase gene at 2p23, fusing the ALK kinase domain to an N-terminal
          partner gene (e.g., TPM3, TPM4, CLTC, DCTN1, RANBP2). Analogous rearrangements involving ROS1,
          NTRK1/3, RET, and PDGFRB occur in ALK-negative cases. The fusion partner drives constitutive
          expression and oligomerization of the chimeric kinase.
        cell_types:
        - preferred_term: myofibroblast
          term:
            id: CL:0000186
            label: myofibroblast cell
        gene_products:
        - preferred_term: ALK tyrosine kinase receptor
          term:
            id: NCIT:C27032
            label: ALK Tyrosine Kinase Receptor
      selected_evidence:
        snippet: "Approximately \nhalf of IMTs harbor anaplastic lymphoma kinase (ALK) gene rearrangements,\
          \ and \nfusions involving ROS1, PDGFRβ, RET and NTRK have also been described."
        supports: SUPPORT
    origin:
