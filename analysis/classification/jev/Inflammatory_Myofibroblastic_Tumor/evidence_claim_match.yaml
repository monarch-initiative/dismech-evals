      assertion_type: Pathophysiology
      assertion:
        name: Constitutive Tyrosine Kinase Activation
        description: The fusion oncoprotein exhibits ligand-independent, constitutive tyrosine kinase
          activity. The chimeric kinase autophosphorylates and activates downstream proliferative and
          survival signaling cascades (RAS-MAPK, PI3K-AKT, JAK-STAT), driving oncogenic transformation
          of the myofibroblast.
        cell_types:
        - preferred_term: myofibroblast
          term:
            id: CL:0000186
            label: myofibroblast cell
        biological_processes:
        - preferred_term: receptor tyrosine kinase signaling
          modifier: INCREASED
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
      selected_evidence:
        snippet: "ALK oncogenic activation mechanisms were characterized in four conventional \nspindle-cell\
          \ inflammatory myofibroblastic tumours (IMT) and five atypical IMT, \neach of which had ALK\
          \ genomic perturbations."
        supports: SUPPORT
