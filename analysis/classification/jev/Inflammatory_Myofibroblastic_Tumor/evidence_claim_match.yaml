            label: cell surface receptor protein tyrosine kinase signaling pathway
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
      selected_evidence:
        snippet: "ALK oncogenic activation mechanisms were characterized in four conventional \nspindle-cell\
          \ inflammatory myofibroblastic tumours (IMT) and five atypical IMT, \neach of which had ALK\
          \ genomic perturbations."
        supports: SUPPORT
