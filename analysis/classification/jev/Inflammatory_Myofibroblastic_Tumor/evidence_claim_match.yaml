      assertion_type: Subtype
      assertion:
        name: EIMS
        display_name: Epithelioid Inflammatory Myofibroblastic Sarcoma
        classification: histological
        subtype_term:
          preferred_term: epithelioid inflammatory myofibroblastic sarcoma
          term:
            id: MONDO:0850127
            label: epithelioid inflammatory myofibroblastic sarcoma
        description: 'An ALK-rearranged variant of IMT, defined by epithelioid morphology and a nuclear
          membrane or perinuclear pattern of ALK immunostaining. The case series that proposed the name
          characterized these tumors as a distinctive intra-abdominal sarcoma with a predilection for
          male patients, and chose the name to convey both their malignant behavior and their close relationship
          with IMT. In that series FISH detected ALK gene rearrangement, and RT-PCR found a RANBP2-ALK
          fusion in the cases tested. In a later small series, ALK staining differed by fusion partner:
          tumors with RANBP2-ALK showed nuclear membranous staining, whereas tumors with RRBP1-ALK, a
          recurrent fusion in EIMS, showed cytoplasmic staining with perinuclear accentuation. Small case
          series report that EIMS pursues an aggressive course with rapid local recurrences, and a review
          pooling the reported cases concluded that it behaves more aggressively than conventional IMT.
          It is a histological variant within ALK-rearranged IMT, so it overlaps the ALK-Positive subtype
          rather than forming a separate fusion class.'
      selected_evidence:
        snippet: In summary, the epithelioid variant of IMT with nuclear membrane or perinuclear ALK is
          a distinctive intra-abdominal sarcoma with a predilection for male patients.
        supports: SUPPORT
        directness: DIRECT
    origin:
