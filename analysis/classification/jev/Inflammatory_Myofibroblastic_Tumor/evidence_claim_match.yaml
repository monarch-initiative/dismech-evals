      quote_role: PRIMARY_RESULT
      explanation: Summing up their own patient series, the authors characterize the epithelioid variant
        of IMT with nuclear membrane or perinuclear ALK immunostaining as a distinctive intra-abdominal
        sarcoma. The epithelioid morphology and the ALK staining pattern are what define the variant;
        the intra-abdominal site describes the tumors of this series, all of which were intra-abdominal,
        and is not part of the definition. The closing sentence of the same abstract proposes the name
        epithelioid inflammatory myofibroblastic sarcoma.
