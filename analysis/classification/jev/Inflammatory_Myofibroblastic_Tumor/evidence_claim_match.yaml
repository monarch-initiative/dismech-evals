        name: Myofibroblastic Proliferation and Inflammatory Recruitment
        description: Constitutive kinase signaling drives clonal proliferation of neoplastic myofibroblasts
          arranged in fascicles, accompanied by recruitment of a dense polymorphous inflammatory infiltrate
          (plasma cells, lymphocytes, eosinophils). The resulting mass is locally infiltrative with a
          propensity for recurrence; rare cases metastasize.
        cell_types:
        - preferred_term: myofibroblast
          term:
            id: CL:0000186
            label: myofibroblast cell
        - preferred_term: plasma cell
          term:
            id: CL:0000786
            label: plasma cell
        biological_processes:
        - preferred_term: cell proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
      selected_evidence:
        snippet: "Inflammatory myofibroblastic tumor is a distinctive, rarely metastasizing \nmesenchymal\
          \ neoplasm composed of fascicles of spindle cells with a prominent \ninflammatory infiltrate."
        supports: SUPPORT
