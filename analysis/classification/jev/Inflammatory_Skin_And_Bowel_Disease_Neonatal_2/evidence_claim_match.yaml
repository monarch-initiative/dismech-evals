          term:
            id: hgnc:3236
            label: EGFR
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: Biallelic germline loss-of-function variants in EGFR, encoding the epidermal growth factor
          receptor tyrosine kinase, cause NISBD2. Gain-of-function and amplifying somatic EGFR alterations
          in cancer are a different mechanism and are not part of this entry. No ClinGen gene-disease
          validity assertion for EGFR and this disease was found in the committed ClinGen validity export
          (cache/clingen/gene_validity.csv), so no gene_disease_validity tier is recorded.
        variants:
        - name: p.Gly428Asp (c.1283G>A)
          description: Missense variant in exon 11, in extracellular domain III of the receptor; a Roma
            founder allele found homozygous in essentially all reported patients.
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
      selected_evidence:
        snippet: Using whole-exome sequencing, we identified a homozygous loss-of-function missense mutation
          in EGFR (c.1283 G>A; p.Gly428Asp) in a male infant with lifelong inflammation affecting the
          skin, bowel, and lungs.
        supports: SUPPORT
