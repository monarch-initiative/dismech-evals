      assertion_type: Discussion
      assertion:
        discussion_id: nisbd2_jak_inhibition_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hair Follicle Inflammation and Degeneration
        - treatments#
        prompt: JAK1/2 inhibition reverses inflammation, restores barrier function and regrows hair in
          mouse models of epidermal Egfr deletion. Would a JAK inhibitor reduce the inflammatory skin
          disease of NISBD2 patients, whose EGFR loss is germline and multisystem?
        rationale: The only mechanism-directed intervention yet shown to work against the cutaneous consequences
          of EGFR loss comes from mice and EGFR-inhibitor patients; it has not been tried in germline
          EGFR deficiency, which has no disease-specific treatment.
      selected_evidence:
        snippet: Hair follicle-specific genetic depletion of either JAK1/2 or STAT1 or therapeutic inhibition
          of JAK1/2 ameliorated the inflammation, restored skin barrier function and activated the residual
          stem cells to resume hair growth in mouse models of epidermal and hair follicle-specific EGFR
          deletion.
        supports: SUPPORT
