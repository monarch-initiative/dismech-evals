        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Triggering of Acute Myocardial Infarction
        description: 'Acute influenza is a recognized short-term trigger of acute myocardial infarction.
          Influenza-driven systemic inflammation, endothelial activation, platelet activation, and a procoagulant
          shift can destabilize vulnerable coronary atherosclerotic plaque and precipitate atherothrombotic
          occlusion, with the excess risk concentrated in the first 7 days after infection. In a self-controlled
          case-series of laboratory-confirmed influenza, the incidence of hospitalization for acute myocardial
          infarction was about six-fold higher during the 7-day risk interval than during the control
          interval, with no increased incidence after day 7. This makes acute MI an important downstream
          cardiovascular sequela of influenza beyond the respiratory tract, and underpins the cardioprotective
          rationale for influenza vaccination.

          '
        cell_types:
        - preferred_term: coronary endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        - preferred_term: platelet
          term:
