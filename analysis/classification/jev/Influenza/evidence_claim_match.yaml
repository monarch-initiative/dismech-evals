  d04dc651a5805800f7652c2cedc7cd27965a9ed1d33e34c1c18e1b44afa6b0ab:
    claim:
      about:
        disease:
          name: Influenza
          disease_term:
            preferred_term: influenza
            term:
              id: MONDO:0005812
              label: influenza
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PANoptosis and Inflammatory Cell Death
        description: 'Influenza A virus triggers multiple regulated cell death pathways including apoptosis,
          necroptosis, and pyroptosis, integrated as PANoptosis. ZBP1 senses viral Z-RNA and coordinates
          these death pathways via RHIM-dependent interactions with RIPK3/RIPK1. MLKL-driven membrane
          rupture during necroptosis activates NLRP3 inflammasome. Caspase-3 can cleave gasdermin E, linking
          apoptosis to pyroptosis. This integrated cell death ensures viral clearance but can intensify
          tissue damage.

          '
        biological_processes:
        - preferred_term: necroptotic process
          term:
            id: GO:0070266
            label: necroptotic process
        - preferred_term: programmed necrotic cell death
          term:
            id: GO:0097300
            label: programmed necrotic cell death
      selected_evidence:
        snippet: Influenza A virus (IAV) infection initiates a complex interplay of cell death modalities,
          including apoptosis, necroptosis, pyroptosis, and their integration, known as PANoptosis, which
          significantly impacts host immune responses and tissue integrity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
