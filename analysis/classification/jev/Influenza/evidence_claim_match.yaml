  e7437bfc41652430ddcc3e39742fef153d2682d53ed4075e77830e5ebc6a24cb:
    claim:
      about:
        disease:
          name: Influenza
          disease_term:
            preferred_term: influenza
            term:
              id: MONDO:0005812
              label: influenza
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Toll-like Receptor Signaling and Innate Immune Activation
        conforms_to: innate_antiviral_interferon_response#Viral PAMP Sensing by Pattern-Recognition Receptors
        description: 'Innate immune sensing of influenza occurs through endosomal TLR3, TLR7, and TLR8.
          TLR7/8 signal via MYD88 to activate IRF5/IRF7 and NF-kappaB, while TLR3 signals via TRIF to
          activate IRF3 via TBK1/IKK-epsilon. This dual signaling induces type I and III interferons,
          pro-inflammatory cytokines, and chemokines. The TLR response is a double-edged sword: necessary
          for viral control but capable of driving immunopathology when hyperactivated.

          '
        cell_types:
        - preferred_term: dendritic cell
          term:
            id: CL:0000451
            label: dendritic cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: toll-like receptor signaling pathway
          term:
            id: GO:0002224
            label: toll-like receptor signaling pathway
        - preferred_term: response to type I interferon
          term:
            id: GO:0034340
            label: response to type I interferon
      selected_evidence:
        snippet: Because TLRs may act as a double-edged sword, a balanced TLR response is critical for
          the overall benefit of the host.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.3390/ijms25115909
      reference_title: Recent Insights into the Molecular Mechanisms of the Toll-like Receptor Response
        to Influenza Virus Infection
      explanation: Confirms the dual role of TLR signaling in both antiviral defense and immunopathology
