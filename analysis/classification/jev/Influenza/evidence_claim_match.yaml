              id: MONDO:0005812
              label: influenza
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inflammasome Activation and Cytokine Storm
        description: 'IAV infection activates NLRP3 and AIM2 inflammasomes. AIM2, canonically a cytosolic
          dsDNA sensor, is activated by host mitochondrial DNA released after IAV-induced mitochondrial
          damage. Inflammasome activation leads to caspase-1-mediated processing of IL-1-beta and IL-18,
          and gasdermin D-mediated pyroptosis. Excessive inflammasome activation contributes to the cytokine
          storm associated with severe influenza.

          '
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: pyroptotic inflammatory response
          term:
            id: GO:0070269
            label: pyroptotic inflammatory response
      selected_evidence:
        snippet: Paradoxically, AIM2 deficiency has been linked to both enhanced and reduced vulnerability
          to IAV infection.
        supports: SUPPORT
