      assertion:
        name: Respiratory Epithelial Infection and Cytopathic Effect
        description: 'Influenza viruses bind to sialic acid residues on respiratory epithelial cells via
          hemagglutinin, followed by endocytosis and viral replication in the nucleus. Viral neuraminidase
          facilitates release of new virions. This causes direct cytopathic damage to airway epithelium,
          leading to desquamation, impaired mucociliary clearance, and susceptibility to secondary bacterial
          infection.

          '
        cell_types:
