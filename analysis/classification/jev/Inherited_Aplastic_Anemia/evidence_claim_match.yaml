        name: Inflammatory Cytokine-Mediated HSC Suppression
        description: Pro-inflammatory cytokines including TGF-beta, IL-1beta, and IFN-alpha mediate cytopenias
          across inherited bone marrow failure syndromes. Different germline stresses converge on TP53-dependent
          growth arrest and apoptosis of hematopoietic stem, progenitor, and precursor cells, with inflammatory
          cytokines playing a pathogenic role in both cytopenias and transformation to myeloid neoplasia.
        cell_types:
        - preferred_term: Hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: Inflammatory Response
          term:
