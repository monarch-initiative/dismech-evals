      assertion:
        name: Telomere Attrition
        description: Telomere biology disorders arise from defects in telomerase (TERT, TERC, DKC1), shelterin
          components (TINF2), or telomere replication helicases (RTEL1). Critically short telomeres trigger
          replicative senescence and apoptosis preferentially in highly proliferative tissues including
          hematopoietic stem cells. Telomere length below the first percentile for age is a diagnostic
          hallmark.
        cell_types:
        - preferred_term: Hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: Telomere Maintenance
          term:
            id: GO:0000723
            label: telomere maintenance
        - preferred_term: Replicative Senescence
          term:
            id: GO:0090399
            label: replicative senescence
      selected_evidence:
        snippet: Premature aging due to critically short telomere length (TL) can also result from pathogenic
          germline variants in the telomerase complex or related genes that typically counteract replicative
          telomere shortening in germline and certain somatic cell populations, e.g., hematopoetic stem
          cells
        supports: SUPPORT
    origin:
