      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acquired aplastic anemia
        disease_term:
          preferred_term: acquired aplastic anemia
          term:
            id: MONDO:0015610
            label: acquired aplastic anemia
        description: Immune-mediated bone marrow failure that can clinically mimic cryptic or adult-onset
          inherited bone marrow failure syndromes when congenital stigmata are absent.
        distinguishing_features:
        - Absence of pathogenic germline variants in IBMFS genes and normal DEB chromosomal breakage and
          flow-FISH telomere length (though mild telomere shortening can occur).
        - Cryptic FA or telomeropathies must be excluded before immunosuppressive therapy or standard-conditioning
          transplant.
      selected_evidence:
        snippet: After examination of a bone marrow to confirm aplastic anemia and rule out acute leukemia
          or myelodysplastic syndrome (MDS), the pediatric approach usually begins with consideration
          of Fanconi anemia (FA) by physical examination and by testing for chromosome breakage, while
          the adult approach might be to rule out paroxysmal nocturnal hemoglobinuria (PNH) by flow cytometry
          for CD55 or CD59 negative clones.
        supports: SUPPORT
    origin:
