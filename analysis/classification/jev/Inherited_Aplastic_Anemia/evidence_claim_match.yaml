        - preferred_term: Apoptotic Process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: an overarching hypothesis states that different stresses elicit TP53-dependent growth
          arrest and apoptosis of hematopoietic stem, progenitor, and precursor cells. Here, we review
          the IBMFSs and propose a role for pro-inflammatory cytokines, such as TGF-β, IL-1β, and IFN-α,
          in mediating the cytopenias
