      assertion_type: Pathophysiology
      assertion:
        name: Defective DNA Damage Repair
        description: The Fanconi anemia pathway repairs DNA interstrand crosslinks through coordinated
          monoubiquitination of FANCD2/FANCI and recruitment of downstream nucleases and homologous recombination
          machinery. Loss of any FA pathway component leads to unrepaired DNA damage, chromosomal instability,
          p53-mediated apoptosis of hematopoietic progenitors, and progressive marrow failure.
        cell_types:
        - preferred_term: Hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: DNA Interstrand Crosslink Repair
          term:
            id: GO:0036297
            label: interstrand cross-link repair
        - preferred_term: DNA Damage Response
          term:
            id: GO:0006974
            label: DNA damage response
      selected_evidence:
        snippet: Central to the FA pathway is the monoubiquitination of FANCI-FANCD2 mediated by a ubiquitin
          RING-E3 ligase complex called the FA core complex. Genetic mutation in any component of the
          FA core complex results in defective FANCI-FANCD2 monoubiquitination and phenotypes of DNA damage
          sensitivity, birth defects, early-onset bone marrow failure and cancer
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
