      assertion:
        phase: Acute hepatic attack susceptibility
        notes: Acute hepatic porphyria carriers may remain asymptomatic until physiologic, hormonal, medication,
          fasting, alcohol, tobacco, or illness triggers induce hepatic ALAS1 and precursor overproduction.
      selected_evidence:
        snippet: Pathogenic variants in 1 of 4 enzymes of heme synthesis are necessary for the development
          of AHP, and the onset of acute attacks also requires the induction of δ-aminolevulinic acid
          synthase 1 (ALAS1), the first and rate-limiting step of heme synthesis in the liver.
        supports: SUPPORT
