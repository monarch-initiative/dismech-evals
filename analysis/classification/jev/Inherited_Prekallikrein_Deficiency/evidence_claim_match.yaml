      assertion_type: AnimalModel
      assertion:
        name: Plasma prekallikrein-deficient mouse
        species: Mouse
        genotype: Klkb1-/-
        publication: PMID:22398951
        description: The engineered knockout is the only substantial model of this disease and it reproduces
          the human biochemistry closely, including the prolonged aPTT and its partial correction on prolonged
          incubation. It diverges from the human disease where it is most interesting, in being strongly
          protected from thrombosis.
        genes:
        - preferred_term: KLKB1
          term:
            id: hgnc:6371
            label: KLKB1
        modeled_mechanisms:
        - target: Rate-Limited Factor XII Autoactivation as the Sole Contact Trigger
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: Knockout plasma shows the defining kinetic signature of the human defect, a long
            aPTT and defective contact-activation-induced thrombin generation that partially corrects
            when incubation is prolonged.
          limitations: Mouse and human contact-factor biology are not identical, and the correction is
            reported as partial rather than quantified against human plasma.
        - target: Hemostasis Preserved Despite the Contact Defect
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: 'The knockout does not bleed abnormally in provoked challenges, matching the human
            phenotype, but the match is not exact: tail bleeding time was modestly increased, while renal
            bleeding times were unaffected.'
          limitations: Murine tail and renal bleeding assays are not human surgery, and the modest tail-bleeding
            increase has no human counterpart, so the agreement is qualitative.
        - target: Reduced Kallikrein-Driven Thromboinflammation in Model Systems
          relationship: RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Arterial occlusion is prevented or delayed across ferric chloride and rose bengal
            models, and the protection extends to thromboinflammatory and atherosclerotic models. This
            is the model's distinctive finding and the node is scoped to model systems because of it.
          limitations: 'The human disease shows no such protection: nine of 75 reported patients had thrombotic
            events, and reported patients carry an excess rather than a deficit of cardiovascular disease.
            The fidelity tier is low for that reason, not because the murine result is weak.'
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: INVALIDATING
            description: The protective phenotype does not transfer. Murine thrombosis models use a defined
              chemical or photochemical arterial injury in young inbred animals, whereas human thrombotic
              events in this disease occurred mostly in patients with acquired risk factors such as hypertension
              and diabetes. The claim that losing prekallikrein protects against thrombosis should not
              be carried from this model to patients.
      selected_evidence:
        snippet: Deficiency in humans is characterised by prolonged activated partial thromboplastin time
          (aPTT); however, the balance between thrombosis and haemostasis is not fully understood.
        supports: SUPPORT
