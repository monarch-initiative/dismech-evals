        biological_scale: TISSUE
        description: 'Prekallikrein-null mice are protected across thrombotic and thromboinflammatory
          challenges while bleeding essentially normally: arterial occlusion is delayed or prevented,
          and protection extends to models far from coagulation, including brain edema in experimental
          cerebral malaria and atherosclerotic plaque development. This node is a model-system claim and
          is named as one, because the corresponding human protection has not been demonstrated. Patients
          with the deficiency are not protected from thrombosis, which is recorded as an open question
          rather than resolved here. The platelet and intrinsic-pathway bindings describe the arterial
          thrombosis arm of this evidence only; the cerebral malaria and atherosclerosis findings are
          not platelet or intrinsic-pathway readouts.'
        cell_types:
