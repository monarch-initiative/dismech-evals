        name: Isolated prolonged aPTT with a normal prothrombin time
        description: The presentation is a laboratory result, almost always found incidentally or on preoperative
          screening in a patient with no bleeding history. A mixing study comes first and separates a
          factor deficiency, which corrects, from an inhibitor such as a lupus anticoagulant, which does
          not. Normal factor VIII, IX, XI and XII activities and a negative lupus anticoagulant screen
          leave the contact factors prekallikrein and high-molecular-weight kininogen.
      selected_evidence:
        snippet: Results of the initial coagulation tests demonstrated no deficiency of factors VIII,
          IX, or XI and no evidence for lupus anticoagulant or antiphospholipid antibodies. However, a
          mixing study test was suggestive of factor deficiency.
