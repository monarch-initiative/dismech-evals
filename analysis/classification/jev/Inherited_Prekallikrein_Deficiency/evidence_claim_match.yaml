              id: MONDO:0012901
              label: inherited prekallikrein deficiency
        context: []
      assertion_type: Phenotype
      assertion:
        name: Hypertension
        category: Cardiovascular
        description: 'Reported patients carry an excess of hypertension and of its vascular complications,
          which is the one clinical association that has repeatedly been noticed. Across all 89 published
          cases of proven deficiency, hypertension or a vascular complication of it was found in 21 patients,
          21 of the 64 aged over 25 years. No frequency band is recorded, because the two denominators
          fall in different bands and hypertension is age-dependent, so a single figure for the disease
          would be a guess. In the assembled cohort of 111 cases, cardiovascular events occurred in 15
          per cent overall and rose with age across bands. Whether the association is causal is unsettled:
          these are analyses of reported cases with no matched comparison group, the authors who describe
          it say explicitly that association is not causation, and prekallikrein-null mice are normotensive.
          It is recorded as a phenotype because it is a consistent observation, not because a mechanism
          is established.'
        phenotype_term:
          preferred_term: Hypertension
          term:
            id: HP:0000822
            label: Hypertension
      selected_evidence:
        snippet: Altogether, 89 cases of proven prekallikrein deficiency have been described in the literature.
          Hypertension or vascular complications of it were found in 21 patients
        supports: SUPPORT
