      assertion_type: Pathophysiology
      assertion:
        name: Rate-Limited Factor XII Autoactivation as the Sole Contact Trigger
        biological_scale: MOLECULAR
        description: Contact activation still happens, but only as fast as factor XII can autoactivate
          on the surface. The whole laboratory picture follows from this being a kinetic defect rather
          than an absolute one. In the standard aPTT, with its brief preincubation, too little factor
          XIIa has formed and the clotting time is grossly prolonged. Extending the preincubation lets
          autoactivation proceed and the aPTT shortens towards normal, a behaviour seen in prekallikrein-deficient
          plasma and not in plasma deficient in factor XII, high-molecular-weight kininogen or factor
          XI, and abolished by an antibody against activated factor XII.
        biological_processes:
        - preferred_term: blood coagulation, intrinsic pathway
          modifier: DECREASED
          term:
            id: GO:0007597
            label: blood coagulation, intrinsic pathway
      selected_evidence:
        snippet: We conclude that the normalization of a severely prolonged aPTT upon increased preincubation
          time (PIT), characteristic of PK deficiency, is due to FXII autoactivation.
        supports: SUPPORT
