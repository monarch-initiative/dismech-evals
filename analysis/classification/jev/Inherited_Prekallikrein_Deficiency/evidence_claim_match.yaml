      assertion:
        name: Shortening of the aPTT on prolonged preincubation
        description: Prekallikrein-deficient plasma is the only contact-factor-deficient plasma whose
          markedly prolonged aPTT shortens substantially when preincubation with the activator is extended,
          because factor XII autoactivation is given time to proceed. It is the cheapest pointer to the
          diagnosis and is widely used as a clue, but it is a kinetic behaviour rather than a specific
          assay and does not replace measuring prekallikrein.
      selected_evidence:
        snippet: His PTT characteristically became shorter with prolonged incubation, providing a clue
          at testing for PK levels, which were found to be severely low.
        supports: SUPPORT
