        rationale: 'The deficiency itself imposes essentially no burden: it is asymptomatic, needs no
          treatment, does not shorten life and does not restrict surgery. What burden exists is iatrogenic
          and diagnostic. An unexplained prolonged aPTT triggers a hematology referral and a sequence
          of exclusion tests, invites plasma transfusion that the patient''s hemostasis does not need,
          and can delay an operation. Recognising the deficiency is what averts the burden. The reported
          excess of hypertension and cardiovascular events, if it is real, would be the only substantive
          burden, and it is unresolved.'
      selected_evidence:
        snippet: The patient had an uneventful biopsy course after receiving fresh frozen plasma (FFP).
