        context: []
      assertion_type: Genetic
      assertion:
        name: KLKB1
        gene_term:
          preferred_term: KLKB1
          term:
            id: hgnc:6371
            label: KLKB1
        association: Biallelic loss-of-function variants, predominantly truncating (nonsense and frameshift)
          with a minority of missense alleles that either block secretion or leave a non-functional circulating
          protein; reported variants cluster in the exons encoding the catalytic domain
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        frequency: the only known cause of inherited prekallikrein deficiency
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_ada3e3e0-165c-4bfb-af20-d811b7b8d9b8-2022-12-05T170000.000Z
        variants:
        - name: c.451dupT (p.Ser151PhefsTer34)
          description: Frameshift allele that is common in West African populations and absent from European
            collectives, and the cause in every genotyped African-ancestry patient reported so far. It
            is the allele behind the higher estimated prevalence in people of African ancestry.
          clinical_significance: PATHOGENIC
          variant_type: duplication
          gene:
            preferred_term: KLKB1
            term:
              id: hgnc:6371
              label: KLKB1
        - name: c.1643G>A (p.Cys548Tyr)
          description: Recurrent missense allele reported in unrelated European and American patients,
            including as a homozygote in two consecutive unrelated cases with no known consanguinity,
            and as one half of a compound heterozygous genotype. It was absent from a European population
            collective, so its recurrence among patients is not explained by high population frequency.
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
          gene:
            preferred_term: KLKB1
            term:
              id: hgnc:6371
              label: KLKB1
        - name: p.Gly104Arg with p.Asn124Ser (apple domain 2)
          description: 'Homozygous pair of substitutions in the second apple domain of the heavy chain,
            reported in Japanese patients as PKD Seki. It is the mechanistically distinct class: the apple
            domains mediate binding to high-molecular-weight kininogen, and recombinant mutant domain
            binds kininogen poorly, so the defect is in assembly of the prekallikrein-kininogen complex
            rather than in the catalytic domain. Asn124Ser was subsequently shown to be a common polymorphism,
            so the pairing matters rather than either substitution alone.'
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
          gene:
            preferred_term: KLKB1
            term:
              id: hgnc:6371
              label: KLKB1
        - name: p.Trp499Ter
          description: Homozygous nonsense allele truncating the protein within the catalytic domain,
            a worked example of the dominant truncating class.
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
          gene:
            preferred_term: KLKB1
            term:
              id: hgnc:6371
              label: KLKB1
        notes: Residue numbering in this literature is inconsistent and the same allele appears under
          two names. Older reports count from the mature protein and omit the 19-residue prepro sequence,
          so Cys529Tyr and Cys548Tyr are the same substitution under different conventions. The variant
          names used here follow the full-precursor numbering, and each row's evidence quotes the source
          in the source's own numbering.
      selected_evidence:
        snippet: We characterized the genetic background of severe PK deficiency, critically appraised
          mutations, and provided prevalence estimates.
        supports: SUPPORT
