      assertion_type: Pathophysiology
      assertion:
        name: KLKB1 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: 'Homozygous or compound heterozygous KLKB1 variants abolish production of functional
          prekallikrein. The reported spectrum is dominated by truncating alleles, with nonsense, frameshift
          and missense classes all represented and a concentration in the exons encoding the catalytic
          domain. Missense alleles act by two routes: some prevent secretion of the protein, while others
          leave a circulating but non-functional molecule.'
        genes:
        - preferred_term: KLKB1
          term:
            id: hgnc:6371
            label: KLKB1
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        molecular_functions:
        - preferred_term: plasma kallikrein serine protease activity
          modifier: DECREASED
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: 'The prekallikrein deficiency results from two mutations in the KLKB 1-gene: first, an
          insertion of 1 bp in codon 149 in exon 5 and, second, a base exchange Cys 548 (TGC) > Tyr (TAC)
          in exon 14.'
        supports: SUPPORT
    origin:
