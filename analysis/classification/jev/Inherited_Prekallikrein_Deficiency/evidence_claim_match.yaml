        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Plasma Prekallikrein Deficiency
        biological_scale: MOLECULAR
        description: 'Plasma prekallikrein activity is absent or near-absent. This is the measured biochemical
          state that defines the disease, and in most patients it is the only abnormality that can be
          found. Immunological testing splits the deficiency in two: cross-reactive-material-negative
          cases, roughly 70 per cent of the total, have no detectable antigen, while cross-reactive-material-positive
          cases carry a non-functional molecule at reduced but measurable concentration.'
        genes:
        - preferred_term: KLKB1
          term:
            id: hgnc:6371
            label: KLKB1
      selected_evidence:
        snippet: In the five other subjects, however, nonfunctional material immunologically indistinguishable
          from normal prekallikrein was detected by radioimmunoassays at concentrations of 13 to 30 per
          cent (CRM+ variant).
        supports: SUPPORT
