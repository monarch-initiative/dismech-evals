  d3e77fa79f3c6d7b316d074cc9a01bd905c45afaa84e9907f5b79a9521de11b8:
    claim:
      about:
        disease:
          name: Inherited Prekallikrein Deficiency
          disease_term:
            preferred_term: inherited prekallikrein deficiency
            term:
              id: MONDO:0012901
              label: inherited prekallikrein deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pk_deficiency_cardiovascular_association
        prompt: Reported patients with prekallikrein deficiency carry an excess of hypertension and cardiovascular
          events, up to 21 of 64 cases over 25 years of age. Is this caused by loss of kallikrein-dependent
          bradykinin and its vascular effects, or is it ascertainment, since the deficiency is found incidentally
          during investigations that older and comorbid patients undergo more often?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Hypertension
        - mechanistic_hypotheses#pk_bradykinin_vascular_tone
        rationale: 'This is the only claimed clinical consequence of the deficiency and it decides whether
          the diagnosis changes anything beyond reassurance. Every report of it is an analysis of published
          cases without a comparison group, and the detection route is itself a selection filter: a prolonged
          aPTT is most often found during preoperative or inpatient testing, which selects for older patients
          with vascular disease. The animal evidence points the other way, since prekallikrein-null mice
          are normotensive and are protected from atherosclerosis through stabilisation of the low-density
          lipoprotein receptor. A registry with matched controls is the design that would settle it, and
          an international prekallikrein and kininogen deficiency registry is being established.'
      selected_evidence:
        snippet: Congenital prekallikrein deficiency is frequently associated with cardiovascular conditions,
          namely hypertension, coronary disease, ischemic stroke, venous thrombosis.
        supports: SUPPORT
