      assertion_type: Treatment
      assertion:
        name: Observation Without Hemostatic Prophylaxis
        description: 'No replacement or prophylaxis is needed, including before surgery. The management
          decision is to withhold treatment: reported patients have undergone hallux amputation, kidney
          biopsy, deep brain stimulator implantation and endovascular aortic repair without hemorrhagic
          complications, several of them after fresh frozen plasma given for the laboratory value rather
          than for any hemostatic need, and reviews of the accumulated cases conclude that routine blood-product
          prophylaxis is not indicated. The point of recognising the deficiency is to allow a definitive
          assessment of bleeding risk and so avoid deferring the procedure.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: observation without hemostatic prophylaxis
        notes: The treatment term is deliberately left unbound. TreatmentTerm is rooted at NCIT:C25218
          Clinical Intervention or Procedure, and this record's content is an action withheld rather than
          given. Against ols:ncit, `l~watchful` returns only questionnaire items, and `l~observation`
          returns NCIT:C25598 Observation Activity and NCIT:C16084 Observational Study, which are study-conduct
          rather than intervention concepts. NCIT:C15747 Supportive Care was rejected because it asserts
          care delivered. Both searches were re-run immediately before this note was written.
      selected_evidence:
        snippet: Our review suggests that routine prophylactic administration of blood products for pre-operative
          management of this condition is not indicated but may be considered if the patient is at high
          risk of hemorrhage or clinical deterioration.
        supports: SUPPORT
