            term:
              id: MONDO:0012901
              label: inherited prekallikrein deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Preoperative Fresh Frozen Plasma for Activated Clotting Time Monitoring
        description: 'The one stated indication for replacement is not hemostasis but repair of a monitoring
          assay. The activated clotting time used to steer intraoperative heparin and protamine is contact
          activated and so is already prolonged at baseline in these patients, which makes it unusable.
          Replenishing prekallikrein with fresh frozen plasma before the procedure restored a usable activated
          clotting time during endovascular aortic repair. This is a single reported case and the indication
          is narrow: elsewhere fresh frozen plasma has been given for the laboratory value alone, which
          is the practice the preceding record argues against.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: fresh frozen plasma transfusion
          term:
            id: NCIT:C116475
            label: Fresh Frozen Plasma Transfusion
      selected_evidence:
        snippet: Prekallikrein deficiency is a rare autosomal recessive coagulation disorder that prolongs
          the activated clotting time.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
