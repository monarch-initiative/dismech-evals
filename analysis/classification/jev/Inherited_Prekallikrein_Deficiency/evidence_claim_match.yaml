        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hemostasis Preserved Despite the Contact Defect
        biological_scale: ORGANISM
        description: Thrombin generation after injury is unaffected, both because the tissue factor and
          factor VIIa route is untouched and because the contact pathway is slowed rather than blocked.
          Patients come through major operations without hemostatic support, and whole-blood viscoelastic
          testing, which also depends on contact activation, can be entirely normal in the same patient
          whose plasma aPTT is doubled or tripled. This node is why an alarming laboratory value has no
          hemorrhagic consequence. The extrinsic-pathway binding names the route that stays intact, and
          it carries no modifier because that route's activity is unchanged.
        biological_processes:
        - preferred_term: tissue factor and factor VIIa initiated coagulation, unaffected
          term:
            id: GO:0007598
            label: blood coagulation, extrinsic pathway
      selected_evidence:
        snippet: Severe PK deficiency may markedly prolong the plasma-based aPTT without parallel abnormalities
          on TEG 6s, highlighting assay-specific differences in sensitivity to PK deficiency.
        supports: SUPPORT
