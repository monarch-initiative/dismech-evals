        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pk_bradykinin_vascular_tone
        hypothesis_label: Loss of kallikrein-dependent bradykinin raises vascular tone and blood pressure
        status: EMERGING
        description: 'A proposed explanation for the hypertension and cardiovascular events reported in
          prekallikrein-deficient patients: bradykinin is a vasodilator that also raises vascular permeability
          and contributes to blood-pressure control, so losing its kallikrein-dependent production would
          shift vascular tone upward. The supporting evidence is the clinical association plus bradykinin''s
          known vascular pharmacology, not a measurement in patients. Two findings cut against it. Prekallikrein-null
          mice have normal blood pressure despite reduced plasma bradykinin, and the same mice are protected
          from atherosclerosis rather than predisposed to it. Ascertainment is the competing explanation,
          since reported cases are enriched for older patients investigated for other reasons.'
      selected_evidence:
        snippet: Blood pressure and heart rate were normal in plasma kallikrein-deficient mice
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
