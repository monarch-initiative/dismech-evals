      selected_evidence:
        snippet: These studies confirm and extend studies with prekallikrein ASO, and demonstrate that
          plasma kallikrein deletion prevents occlusive thrombus formation in mice with a minimal role
          in provoked bleeding.
        supports: SUPPORT
