          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Prekallikrein deficiency is a rare autosomal recessive disease not considered to be associated
          with a tendency for bleeding, despite marked prolongation of activated partial thromboplastin
          time.
        supports: SUPPORT
