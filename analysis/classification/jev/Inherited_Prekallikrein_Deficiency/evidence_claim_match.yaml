              id: MONDO:0012901
              label: inherited prekallikrein deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Kallikrein-Dependent Bradykinin Generation
        biological_scale: MOLECULAR
        description: 'Kallikrein liberates bradykinin from high-molecular-weight kininogen, so deficient
          plasma generates none on contact activation and prekallikrein-null mice have reduced circulating
          bradykinin. No clinical phenotype in deficient humans has been established for this arm, and
          bradykinin generation in vivo is clearly not abolished: a patient with complete absence of plasma
          prekallikrein developed angiotensin-converting-enzyme-inhibitor angioedema, which is bradykinin-mediated,
          so other enzymes including factor XIIa, plasmin and tissue kallikreins can supply kinin. The
          weight of this arm is instead established from the opposite direction, because inhibiting kallikrein
          or lowering prekallikrein treats bradykinin-mediated hereditary angioedema.'
        biological_processes:
        - preferred_term: plasma kallikrein-kinin cascade
          modifier: DECREASED
          term:
            id: GO:0002353
            label: plasma kallikrein-kinin cascade
        - preferred_term: bradykinin biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0002936
            label: bradykinin biosynthetic process
      selected_evidence:
        snippet: Fletcher factor-deficient plasma is deficient in prekallikrein and therefore generates
          no bradykinin upon activation with kaolin.
        supports: SUPPORT
