      assertion_type: Pathophysiology
      assertion:
        name: Diminished Surface-Activated Fibrinolysis In Vitro
        biological_scale: MOLECULAR
        description: Kaolin-activated plasmin generation and fibrinolysis are slow in deficient plasma
          and correct on adding prekallikrein, because kallikrein activates pro-urokinase and contributes
          to contact-dependent plasminogen activation. In patients, reported fibrinolysis has been normal
          or defective rather than consistently impaired, and testing of one deficient sibling concluded
          that prekallikrein is not important for fibrinolysis in vivo, where tissue and vessel-wall activators
          do the work. The node is therefore kept as an in vitro finding and no clinical consequence is
          claimed for it.
        biological_processes:
        - preferred_term: fibrinolysis
          modifier: DECREASED
          term:
            id: GO:0042730
            label: fibrinolysis
      selected_evidence:
        snippet: Prekallikrein deficiency is found not to be important in normal in vivo fibrinolysis,
          which possibly operates via tissue or vessel wall fibrinolytic activator release.
        supports: REFUTE
