          name: Inherited Prekallikrein Deficiency
          disease_term:
            preferred_term: inherited prekallikrein deficiency
            term:
              id: MONDO:0012901
              label: inherited prekallikrein deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pk_deficiency_thrombosis_protection
        prompt: Prekallikrein-null mice are strongly protected from arterial thrombosis and from several
          thromboinflammatory injuries, yet patients with severe prekallikrein deficiency are not protected
          from thrombosis and may carry an excess of cardiovascular events. Is the murine protection a
          real human effect masked by small numbers, reporting bias and acquired risk factors, or does
          contact-system biology differ enough between the species that the protection does not transfer?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Kallikrein-Driven Thromboinflammation in Model Systems
        rationale: The mismatch is not a detail. The murine result is the main reason plasma kallikrein
          is pursued as an antithrombotic target, and the human experiment that would test it already
          exists in the form of untreated biallelic patients. The human evidence against protection is
          weak in design, being an analysis of reported cases with no comparison group, in which six of
          the nine thrombotic patients had acquired risk factors. No matched cohort has ever compared
          thrombotic incidence in deficient individuals with controls. Until one does, the murine protection
          cannot be read as a human effect and the published human series cannot settle its absence either.
      selected_evidence:
        snippet: Among these patients were 9 with thrombosis, 6 arterial (myocardial infarction and ischemic
          stroke) and 3 venous (deep vein thrombosis with or without pulmonary embolism).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
