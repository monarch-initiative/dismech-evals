      assertion_type: Pathophysiology
      assertion:
        name: Photoreceptor Outer Segment and Ciliary Dysfunction
        description: Many IRD genes encode proteins required for the structure and renewal of the photoreceptor
          outer segment and for protein/lipid transport through the connecting cilium. Defects in outer-segment
          morphogenesis, disc renewal, or intraflagellar/ciliary transport (e.g., RPGR, CEP290, USH2A)
          impair phototransduction protein trafficking and outer-segment maintenance, leading to photoreceptor
          stress and degeneration.
        genes:
        - preferred_term: RPGR
          term:
            id: hgnc:10295
            label: RPGR
        - preferred_term: USH2A
          term:
            id: hgnc:12601
            label: USH2A
        molecular_functions:
        - preferred_term: guanyl-nucleotide exchange factor activity
          term:
            id: GO:0005085
            label: guanyl-nucleotide exchange factor activity
        - preferred_term: small GTPase binding
          term:
            id: GO:0031267
            label: small GTPase binding
        - preferred_term: extracellular matrix structural constituent
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
        cell_types:
        - preferred_term: rod photoreceptor
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: cone photoreceptor
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: photoreceptor cell outer segment organization
          term:
            id: GO:0035845
            label: photoreceptor cell outer segment organization
      selected_evidence:
        snippet: Inherited retinal dystrophies (IRDs) are congenital retinal degenerative diseases that
          have various inheritance patterns, including dominant, recessive, X-linked, and mitochondrial.
          These diseases are most often the result of defects in rod and/or cone photoreceptor and retinal
          pigment epithelium function, development, or both.
        supports: SUPPORT
