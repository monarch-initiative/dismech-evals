            label: Leber congenital amaurosis
        description: The most severe and earliest-onset IRD, presenting in the first year of life with
          profound visual impairment, nystagmus, sluggish pupillary responses, and a severely reduced
          or non-recordable electroretinogram. Caused by biallelic variants in genes including RPE65,
          CEP290, GUCY2D, and CRB1. RPE65-associated LCA is treatable with voretigene neparvovec gene
          therapy.
      selected_evidence:
        snippet: In RPE65-related LCA, onset of visual manifestations frequently occurs in infancy during
          the first year of life.
        supports: SUPPORT
