      assertion_type: Pathophysiology
      assertion:
        name: RPE Dysfunction and Toxic Metabolite Accumulation
        description: The RPE supports photoreceptors via the visual cycle, daily phagocytosis of shed
          outer-segment discs, and metabolic and barrier functions. In IRDs such as ABCA4-related disease
          (Stargardt) and choroideremia, defective clearance of retinoid by-products leads to accumulation
          of toxic bisretinoids (lipofuscin/A2E) in the RPE, RPE cell death, and secondary photoreceptor
          and choriocapillaris degeneration.
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        cellular_components:
        - preferred_term: photoreceptor outer segment
          term:
            id: GO:0001750
            label: photoreceptor outer segment
        biological_processes:
        - preferred_term: phagocytosis of shed photoreceptor outer segment discs
          term:
            id: GO:0006909
            label: phagocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: These diseases are most often the result of defects in rod and/or cone photoreceptor
          and retinal pigment epithelium function, development, or both.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
