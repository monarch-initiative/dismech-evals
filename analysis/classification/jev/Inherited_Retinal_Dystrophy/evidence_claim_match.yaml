      assertion_type: Pathophysiology
      assertion:
        name: Visual Cycle and Phototransduction Disruption
        description: A second major class of IRD genes encodes components of the retinoid (visual) cycle
          and the phototransduction cascade. Defects in RPE65, LRAT, RDH genes, RPE-photoreceptor retinoid
          recycling, or in phototransduction proteins (RHO, GUCY2D, PDE6, CNGA1) impair regeneration of
          11-cis-retinal or the conversion of light into a neural signal, causing photoreceptor dysfunction
          and, when chronic, degeneration.
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        - preferred_term: rod photoreceptor
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: visual perception / phototransduction
          term:
            id: GO:0007601
            label: visual perception
        - preferred_term: retinoid metabolic process
          term:
            id: GO:0001523
            label: retinoid metabolic process
      selected_evidence:
        snippet: have downstream effects in pathways critical to vision, including phototransduction,
          the visual cycle, photoreceptor development, cellular respiration, and retinal homeostasis
        supports: SUPPORT
