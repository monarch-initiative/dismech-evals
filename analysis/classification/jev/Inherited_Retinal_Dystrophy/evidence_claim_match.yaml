      assertion_type: Subtype
      assertion:
        name: RP
        display_name: Retinitis Pigmentosa
        subtype_term:
          preferred_term: retinitis pigmentosa
          term:
            id: MONDO:0019200
            label: retinitis pigmentosa
        description: The most common IRD; a rod-cone dystrophy beginning with rod photoreceptor degeneration
          producing night blindness and progressive peripheral (mid-peripheral) visual field constriction,
          followed by cone involvement and eventual central vision loss. Hallmark fundus findings are
          bone-spicule pigmentation, attenuated retinal vessels, and waxy disc pallor. Inherited as autosomal
          recessive, autosomal dominant, or X-linked, and caused by variants in dozens of genes (e.g.,
          RHO, USH2A, RPGR).
      selected_evidence:
        snippet: patients typically lose night vision in adolescence, side vision in young adulthood,
          and central vision in later life because of progressive loss of rod and cone photoreceptor cells
        supports: SUPPORT
    origin:
