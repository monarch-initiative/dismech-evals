        description: Juvenile- or young-adult-onset macular dystrophy caused by biallelic ABCA4 variants,
          presenting with central scotomas (sometimes with foveal sparing), macular cone spacing abnormalities,
          and lipofuscin-driven fundus autofluorescence changes rather than primary pan-retinal rod-cone
          degeneration, though severe biallelic ABCA4 alleles overlap with cone-rod and rod-cone IRD.
        disease_term:
          preferred_term: Stargardt disease
          term:
            id: MONDO:0019353
            label: Stargardt disease
        distinguishing_features:
        - Central scotomas (with occasional foveal sparing), early macular cone spacing abnormalities,
          and lipofuscin-driven macular autofluorescence changes caused by ABCA4 mutations.
      selected_evidence:
        snippet: Central scotomas were present in all patients, although the fovea was spared in three
          patients. The earliest cone spacing abnormalities were observed in regions of homogeneous AF,
          normal visual function, and normal outer retinal structure.
        supports: SUPPORT
