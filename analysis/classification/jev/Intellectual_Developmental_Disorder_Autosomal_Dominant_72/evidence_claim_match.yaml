      assertion:
        discussion_id: mrd72_genotype_severity_gradient
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#SRRM2 Haploinsufficiency
        prompt: Is the more severe phenotype of large 16p13.3 deletions (moderate-to-severe intellectual
          disability, microcephaly, seizures) caused by SRRM2 loss itself, or by loss of neighbouring
          genes within the deleted interval?
        rationale: Both classes of lesion abolish one SRRM2 allele, so a pure haploinsufficiency model
          predicts comparable severity. The observed gradient therefore points either to a contiguous-gene
          effect at 16p13.3 or to ascertainment differences between the cohorts. The authors themselves
          note that phenotypic blending from co-occurring pathogenic variants in CASR/PKD1 and SLC17A5
          confounded two of the six deletion cases, so the comparison is not clean. Resolving this determines
          whether the deletion subtype should be modelled as the same disease with greater severity or
          as a distinct contiguous-gene syndrome.
        proposed_experiments:
        - experiment_id: mrd72_deletion_breakpoint_phenotype_correlation
          name: Deletion-interval breakpoint-to-phenotype correlation
          description: Assemble a larger series of SRRM2-spanning 16p13.3 deletions with precise breakpoints
            and systematic phenotyping, and test whether severity tracks deletion size and specific co-deleted
            genes independently of SRRM2 loss.
      selected_evidence:
        snippet: Phenotypic blending, present for two cases with additional pathogenic variants in CASR/PKD1
          and SLC17A5, hampered the phenotypic delineation of this recently described condition.
        supports: SUPPORT
