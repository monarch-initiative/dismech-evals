        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mrd72_speckle_dosage_threshold
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Nuclear Speckle Scaffold Disruption
        prompt: Is a 50% reduction in SRRM2 dosage - the actual lesion in MRD72 - sufficient to degrade
          nuclear speckle architecture, or are speckles buffered against heterozygous loss?
        rationale: 'Every published demonstration that speckles depend on SRRM2 used a much harsher perturbation
          than the disease: co-depletion of both SON and SRRM2, depletion of SON in a line whose SRRM2
          intrinsically disordered regions had been genetically deleted, or acute degron depletion. None
          tested the heterozygous state. Because SON remains at full dosage in MRD72, speckles may well
          be largely preserved, in which case the disease-relevant consequence of SRRM2 haploinsufficiency
          runs through the spliceosome-catalytic-centre role rather than through speckle architecture.
          This is the single largest uncertainty in the entry''s pathograph, and it is why the speckle
          node is marked PROVISIONAL while the splicing node is ESTABLISHED.'
        proposed_experiments:
        - experiment_id: mrd72_speckle_morphometry_heterozygous
          name: Speckle morphometry in SRRM2-heterozygous human cells
          description: Quantitative imaging of nuclear speckle number, size, and sphericity in isogenic
            SRRM2+/- human cells (and, where available, patient-derived fibroblasts or iPSC-derived neurons)
            against wild-type, to test whether the disease-relevant dosage measurably alters speckle architecture.
        - experiment_id: mrd72_speckle_vs_splicing_separation
          name: Separation of the speckle and catalytic-centre contributions
          description: Compare transcriptome-wide splicing in SRRM2+/- cells against cells carrying a
            separation-of-function allele that preserves the spliceosomal N-terminus while deleting the
            speckle-driving IDRs, to apportion the splicing defect between the two roles.
      selected_evidence:
        snippet: depletion of SON leads only to a partial disassembly of NS, while co-depletion of SON
          and SRRM2 or depletion of SON in a cell-line where intrinsically disordered regions (IDRs) of
          SRRM2 are genetically deleted, leads to a near-complete dissolution of NS
        supports: SUPPORT
