          preferred_term: ZTTK syndrome
          term:
            id: MONDO:0014936
            label: ZTTK syndrome
        description: 'The closest mechanistic relative of MRD72: heterozygous loss of function of SON,
          the other non-redundant nuclear speckle scaffold protein, which likewise perturbs splicing of
          transcripts with weak splice sites. Both disorders are therefore nuclear-speckle scaffold haploinsufficiencies
          presenting with developmental delay and intellectual disability.'
        distinguishing_features:
        - ZTTK syndrome is a complex, multisystem developmental disorder with congenital anomalies (growth
          retardation, skeletal abnormalities, kidney agenesis), whereas MRD72 is comparatively mild and
          largely confined to neurodevelopment, behaviour, weight, and facial gestalt.
        - Haematological and immunological involvement (leukopenia, immunoglobulin deficiency) is described
          in ZTTK syndrome but not in MRD72.
        notes: 'Nomenclature caution, not a clinical differential: an autosomal dominant neurodevelopmental
          disorder with a similar descriptive name - "macrocephaly, neurodevelopmental delay, lymphoid
          hyperplasia, and persistent fetal hemoglobin" (MNDLFH, OMIM 619769, MONDO:0859231, caused by
          ZBTB7A) - is a distinct entity. One of the deep-research runs for this entry initially attributed
          MRD72 to ZBTB7A before self-correcting, so any ZBTB7A-derived literature must be kept out of
          this record.'
      selected_evidence:
        snippet: Thus, ZTTK syndrome is a complex, multisystem developmental disorder
        supports: SUPPORT
