      assertion:
        target: Nuclear Speckle Scaffold Disruption
        causal_link_type: UNKNOWN
        description: SRm300 is one of the two non-redundant scaffold proteins of nuclear speckles. Note
          the cited experiment shows near-complete speckle dissolution only on CO-depletion of SON and
          SRRM2, or on SON depletion in a line whose SRRM2 intrinsically disordered regions are deleted
          - neither SRRM2 depletion alone nor a 50% dosage reduction has been shown to degrade speckle
          architecture. The edge is therefore recorded as mechanistically motivated but not directly demonstrated
          at disease-relevant dosage.
      selected_evidence:
        snippet: the core of NS is likely formed by SON and SRRM2, since depletion of SON leads only to
          a partial disassembly of NS, while co-depletion of SON and SRRM2 or depletion of SON in a cell-line
          where intrinsically disordered regions (IDRs) of SRRM2 are genetically deleted, leads to a near-complete
          dissolution of NS
        supports: SUPPORT
