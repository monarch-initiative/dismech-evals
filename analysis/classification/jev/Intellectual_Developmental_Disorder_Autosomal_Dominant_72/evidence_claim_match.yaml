        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nuclear Speckle Scaffold Disruption
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: SRm300 and SON are the two non-redundant scaffolds of nuclear speckles, membraneless
          nuclear condensates that concentrate splicing factors. The serine/arginine-rich intrinsically
          disordered regions of SRRM2 drive multicomponent liquid-liquid phase separation that subcompartmentalizes
          the speckle. The scaffold role itself is well established; what is NOT established is that the
          ~50% dosage reduction of MRD72 is sufficient to degrade speckle architecture. The published
          dissolution experiments used co-depletion of both scaffolds or complete IDR deletion, so this
          node is recorded as PROVISIONAL - see the mrd72_speckle_dosage_threshold discussion.
        cellular_components:
        - preferred_term: nuclear speck
          term:
            id: GO:0016607
            label: nuclear speck
        biological_processes:
        - preferred_term: nuclear speck organization
          term:
            id: GO:0035063
            label: nuclear speck organization
          modifier: DECREASED
      selected_evidence:
        snippet: We further show that SRRM2 forms multicomponent liquid phases in cells to drive NS subcompartmentalization,
          which is reliant on homotypic interaction and heterotypic non-selective protein-RNA complex
          coacervation-driven phase separation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
