        context: []
      assertion_type: Subtype
      assertion:
        name: Large 16p13.3 deletion
        display_name: Large contiguous 16p13.3 deletion including SRRM2
        description: 'Individuals carrying whole-gene deletions of SRRM2 (248-482 kb in the Genomics England
          series, 66-270 kb in the defining cohort) rather than protein-truncating point variants. The
          subtype is defined by lesion architecture, which is well characterised: distal breakpoints cluster
          within a 144 kb palindrome-like structure 75 kb upstream of SRRM2, and three of the four Genomics
          England deletions carried inverted internal segments of 45-94 kb. A severity difference is often
          attributed to this subtype but is NOT established: the moderate-to-severe intellectual disability
          reported by Genomics England describes all six of their patients (four deletions plus two point
          variants) versus the defining cohort as a whole (which itself contained two microdeletions),
          two of the six carried co-occurring pathogenic variants in other genes, and both seizure cases
          were point-variant carriers. See the mrd72_genotype_severity_gradient discussion.'
      selected_evidence:
        snippet: Deletions ranged between 248 and 482 kb in size and all distal breakpoints clustered
          within a complex 144 kb palindrome situated 75 kb upstream of SRRM2. Strikingly, three of the
          deletions were complex, with inverted internal segments of 45-94 kb.
        supports: SUPPORT
