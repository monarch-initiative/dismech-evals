  91b389bc33565c1bc4136a30fedbe8b933047d672323fd858a3ddce23dbd0412:
    claim:
      about:
        disease:
          name: Intellectual Developmental Disorder, Autosomal Dominant 72
          disease_term:
            preferred_term: intellectual developmental disorder, autosomal dominant 72
            term:
              id: MONDO:0957397
              label: intellectual developmental disorder, autosomal dominant 72
        context: []
      assertion_type: Genetic
      assertion:
        name: SRRM2
        gene_term:
          preferred_term: SRRM2
          term:
            id: hgnc:16639
            label: SRRM2
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        presence: PRESENT
        notes: SRRM2 at 16p13.3 encodes SRm300, a 2,752-amino-acid SR-related splicing factor and nuclear
          speckle scaffold. Heterozygous loss of function - by frameshift, nonsense, canonical splice-site
          variant, or whole-gene deletion - is the sole established cause of MRD72. The gene was first
          robustly implicated by de novo mutation enrichment across 31,058 developmental-disorder trios.
        variants:
        - name: Recurrent arginine-to-stop variants (CpG deamination)
          description: SRRM2 is arginine-rich (468/2,752 residues) and correspondingly CpG-dense, making
            it a high-risk gene for de novo nonsense variants arising by deamination of methylated cytosine.
            Four of the 22 variants in the defining cohort were Arg-to-Ter changes, and p.(Arg632*) reported
            in the Genomics England series lies close to the previously reported p.(Arg628*).
          gene:
            preferred_term: SRRM2
            term:
              id: hgnc:16639
              label: SRRM2
          clinical_significance: PATHOGENIC
        - name: MSP-associated missense variant disrupting the SRRM2-ACIN1 interaction
          description: 'A co-segregating SRRM2 missense variant reported in a family with dominantly inherited
            multisystem proteinopathy - a degenerative nervous-system/muscle/bone disorder, NOT MRD72.
            Knock-in of the single amino-acid change abolished the SRRM2-ACIN1 protein-protein interaction
            and produced widespread expression change converging on synapse-associated pathways. Recorded
            here as an allelic-spectrum contrast: it indicates that SRRM2 missense alleles can act through
            a mechanism other than the haploinsufficiency that causes MRD72, and such variants should
            not be assumed to cause this disorder.'
          gene:
            preferred_term: SRRM2
            term:
              id: hgnc:16639
              label: SRRM2
        - name: p.Gln1554Leu (intrinsically disordered region missense)
          description: A de novo missense variant NM_016333:c.4661A>T (p.Q1554L) in the SRRM2 intrinsically
            disordered region, classified Likely Pathogenic, reported in a patient with a hyperphagia-driven
            severe obesity presentation. This is the principal reported non-truncating candidate; the
            disorder's mechanism is otherwise haploinsufficiency.
          gene:
            preferred_term: SRRM2
            term:
              id: hgnc:16639
              label: SRRM2
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: We established SRRM2 as a gene responsible for a rare neurodevelopmental disease.
        supports: SUPPORT
