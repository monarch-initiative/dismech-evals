              label: intellectual developmental disorder, autosomal dominant 72
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mrd72_mouse_model_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Neuronal and Oligodendrocyte Development
        prompt: Does the Srrm2+/- mouse brain phenotype - reduced striatal oligodendrocytes, impaired
          myelination, reduced sleep spindles, blunted startle - correspond to anything measurable in
          people with MRD72, whose defining features are speech delay, overfriendliness, hypotonia, and
          overweight?
        rationale: 'The Srrm2+/- mouse has excellent construct validity: the same gene, the same heterozygous
          dosage. But it was built and interpreted as a genetic model of schizophrenia, and its readouts
          were chosen accordingly. None of the human MRD72 features - the predominant speech delay, the
          characteristic overfriendliness, the facial dysmorphism, the overweight - has a murine counterpart
          in the published phenotyping, and no MRD72 patient series reports EEG sleep-spindle or myelin-imaging
          data. The mouse therefore substantiates the molecular arm of the mechanism (splicing, synaptic
          protein isoforms, oligodendrocytes) while leaving the mapping onto the human syndrome undetermined.
          This matters for curation because the myelination and oligodendrocyte nodes rest entirely on
          this model.'
        proposed_experiments:
        - experiment_id: mrd72_white_matter_imaging
          name: Neuroimaging of white matter in MRD72 patients
          description: Diffusion MRI in a genotype-confirmed MRD72 cohort against matched controls, to
            test whether the murine myelin deficit has a human structural correlate.
        - experiment_id: mrd72_sleep_eeg_spindles
          name: Sleep EEG in MRD72 patients
          description: Overnight polysomnography with spindle quantification in MRD72 patients, the direct
            human counterpart of the murine EEG finding.
      selected_evidence:
        snippet: electroencephalogram (EEG) recordings reveal reduced sleep spindles resembling humans
          with schizophrenia
        supports: SUPPORT
