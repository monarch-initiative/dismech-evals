        description: Missense variants cluster in the N-terminal leucine-rich repeat (LRR) domain at conserved
          consensus positions (L65, N94, C106, L296), and these abolish LRR binding to protein phosphatase
          1 alpha, MACF1 and Erbin in 293T cells. L296P also prevents postsynaptic targeting. The PDZ-domain
          variant L1567Q reduces delta-catenin binding and the fraction of densin-180 clusters at Shank3-positive
          synapses.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: protein phosphatase 1 alpha binding by the LRR domain
          term:
            id: GO:0008157
            label: protein phosphatase 1 binding
          modifier: DECREASED
        genes:
        - preferred_term: LRRC7
          term:
            id: hgnc:18531
            label: LRRC7
      selected_evidence:
        snippet: In summary, four variants at key positions of the LRR consensus sequence (L65, N94, C106
          and L296) severely disrupt binding to all partners tested.
        supports: SUPPORT
