        name: LRRC7
        gene_term:
          preferred_term: LRRC7
          term:
            id: hgnc:18531
            label: LRRC7
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: LRRC7 (1p31.1) encodes densin-180. Truncating variants (nonsense, splice, frameshift, and
          a 99 kb deletion including the last exon) account for more than half of cases; missense variants
          cluster in the LRR domain, with one in the PDZ domain. Variants arise de novo or are inherited.
          LRRC7 was first implicated by a gene-level rare-variant association with intellectual disability
          in the 100,000 Genomes Project. Inherited variants have not been observed to be milder than
          de novo ones. Exon 23 is skipped in a large share of brain transcripts, so truncating variants
          there (p.Gln1375*, p.Asn1377Thrfs*13) may be less severe. Of the missense variants, A193P was
          inherited from a healthy father and only weakly disrupts LRR binding, and L221M disrupts no
          tested interaction and is best treated as a VUS. ClinGen had not classified LRRC7 as of 2026-10-16.
      selected_evidence:
        snippet: We conclude that LRRC7 encodes a major determinant of intellectual development and behaviour.
        supports: SUPPORT
