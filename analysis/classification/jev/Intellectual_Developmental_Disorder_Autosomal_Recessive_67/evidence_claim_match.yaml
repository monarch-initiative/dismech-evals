      assertion_type: Discussion
      assertion:
        discussion_id: eif3f_epilepsy_frequency_discrepancy
        kind: CONTROVERSY
        status: OPEN
        prompt: Is epilepsy a common feature of EIF3F-related neurodevelopmental disorder or an uncommon
          one? The two published cohorts disagree by a wide margin.
        attaches_to:
        - phenotypes#Epilepsy
        rationale: 'Epilepsy occurred in six of the nine individuals in the founding cohort, and was reported
          as substantially less frequent in the larger follow-up cohort of twenty-one. Both describe the
          same homozygous founder allele, so the difference is not genotypic. The likely explanation is
          ascertainment: the founding cases came out of a cohort recruited for undiagnosed developmental
          disorders and analysed by recessive burden, while the follow-up cohort was assembled through
          GeneMatcher after the gene was already known, which lets milder and non-epileptic cases in.
          If that is right, the true frequency is closer to the lower figure and the founding report overstates
          it, which matters for what a family is told at diagnosis. No frequency band is asserted on the
          epilepsy phenotype in this entry until a third independent cohort settles it.'
      selected_evidence:
        snippet: Beside variable intellectual disability (ID) in all individuals, epilepsy occurred in
          six, and behavioral problems or sensorineural hearing loss in three individuals, respectively
        supports: SUPPORT
