        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eif3f_meningioma_signal
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Two of twenty-one individuals in a cohort with a median age of 8.5 years had a meningioma.
          Is that a tumour predisposition, or coincidence in a small cohort?
        attaches_to:
        - pathophysiology#Reduced Cell Proliferation and Growth
        rationale: 'The number is small but the context makes it hard to dismiss: meningioma in two of
          twenty-one individuals whose median age at last examination was 8.5 years is not what a paediatric
          cohort normally looks like. In one of the two it was an increased seizure frequency that led
          to the diagnosis, and in the other the tumour is named as a confound for that individual''s
          apparent developmental regression, so the finding is currently visible in this entry only as
          a caveat inside the regression phenotype rather than as a question in its own right. The authors
          went looking for a mechanism and did not find one: somatic EIF3F variants appear in 0.9% of
          nearly 39,000 COSMIC samples and in none of 130 meningiomas. That negative is worth curating
          explicitly, because it is the kind of result that does not get published twice and would otherwise
          have to be re-derived by the next person who notices the two cases. This is recorded as a knowledge
          gap and NOT as a phenotype and NOT as a surveillance recommendation: two cases with an explicit
          negative tumour-genetics check do not support either.'
        proposed_experiments:
        - experiment_id: eif3f_tumour_incidence_in_carrier_cohort
          name: Ascertain tumour incidence in a larger EIF3F biallelic cohort
          description: Follow the reported and future biallelic carriers longitudinally and compare central
            nervous system tumour incidence against age-matched expectation. Two cases in twenty-one cannot
            distinguish a real predisposition from ascertainment; a defined denominator with follow-up
            time can. A negative would retire the question; a positive would change surveillance, which
            is why it should not be inferred either way from the present data.
      selected_evidence:
        snippet: somatic EIF3F variants have been detected in 0.9% of 38,579 samples (n = 353) and did
          not include 130 meningioma samples, providing no further evidence for a role of EIF3F in tumorigenesis
          of meningioma
        supports: REFUTE
