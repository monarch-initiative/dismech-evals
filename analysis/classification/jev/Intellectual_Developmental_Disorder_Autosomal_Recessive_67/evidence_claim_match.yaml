  2518cc2b2345fa5eb41d965de282b7bb7a82e9d5b8f1a4c2ede977372bd40ba7:
    claim:
      about:
        disease:
          name: Intellectual Developmental Disorder Autosomal Recessive 67
          disease_term:
            preferred_term: intellectual developmental disorder, autosomal recessive 67
            term:
              id: MONDO:0032662
              label: intellectual developmental disorder, autosomal recessive 67
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Homozygous EIF3F p.Phe232Val Lowers eIF3f Protein Abundance
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The founder missense allele does not obviously break a catalytic site; what it does
          is leave less eIF3f protein in the cell. Stem cells gene-edited to carry the variant homozygously
          have reduced eIF3f protein levels, which is the observation the loss-of-function interpretation
          rests on. Population genetics agrees: EIF3F is strongly intolerant of loss-of-function variation,
          no gnomAD individual is homozygous for this allele, and no patient with two truncating alleles
          has been reported, so this allele is best read as a hypomorph that survives where a null would
          not.'
        molecular_functions:
        - preferred_term: translation initiation factor activity of the eIF3f subunit
          term:
            id: GO:0003743
            label: translation initiation factor activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: eukaryotic translation initiation factor 3 complex
          term:
            id: GO:0005852
            label: eukaryotic translation initiation factor 3 complex
        genetic_context:
          gene:
            preferred_term: EIF3F
            term:
              id: hgnc:3275
              label: EIF3F
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Homozygous c.694T>G p.(Phe232Val) in almost every reported individual; one compound
            heterozygote carries this allele with a frameshift on the other chromosome and is more severely
            affected.
      selected_evidence:
        snippet: In vitro studies of induced pluripotent stem cells (iPSC), gene-edited to be homozygous
          for the c.694T>G/ p.(Phe232Val) variant, demonstrated lower EIF3F protein levels and reduced
          proliferation rates
        supports: SUPPORT
    origin:
