            term:
              id: MONDO:0032662
              label: intellectual developmental disorder, autosomal recessive 67
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Brain Development and Somatic Growth
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: 'The clinical endpoint: global developmental delay with prominent speech delay in
          every reported individual, plus a variable syndromic tail of hearing loss, abnormal muscle tone,
          short stature and microcephaly. This node is marked provisional because the step from a general
          reduction in translation to these specific outcomes is inferred rather than measured. No neural
          model of the disease allele has been reported; the cellular work was done in undifferentiated
          stem cells and the in vivo work in mouse muscle. Brain imaging in affected people is unhelpfully
          nonspecific, which is itself a piece of evidence: there is no structural lesion to point at.'
        biological_processes:
        - preferred_term: brain development
          term:
            id: GO:0007420
            label: brain development
          modifier: ABNORMAL
      selected_evidence:
        snippet: All affected individuals had developmental delays including delayed speech development.
          About half of the affected individuals had behavioral problems, altered muscular tone, hearing
          loss, and short stature.
        supports: SUPPORT
