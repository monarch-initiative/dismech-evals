            term:
              id: MONDO:0032662
              label: intellectual developmental disorder, autosomal recessive 67
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eif3f_white_matter_involvement
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is white-matter disease part of EIF3F-related neurodevelopmental disorder, and if so does
          it act through eIF3f's role in repeat-associated non-ATG translation?
        attaches_to:
        - phenotypes#Leukoencephalopathy
        rationale: 'Two individuals have been reported with white-matter abnormalities on MRI, one with
          cystic dilatation of the perivascular spaces and one, a compound heterozygote, with extensive
          supratentorial leukodystrophy. That is thin, and it sits against a larger cohort in which brain
          imaging was explicitly nonspecific and was judged not diagnostically useful. What makes it worth
          keeping open rather than dismissing is a piece of biology from an unrelated disease: eIF3F regulates
          repeat-associated non-ATG translation, and knocking it down lowers the steady-state level of
          the SCA8 polySer protein, whose aggregates accumulate specifically in white-matter regions that
          show demyelination and axonal degeneration. That is a real, published route by which an eIF3f
          defect could reach white matter. It is also entirely circumstantial here: no one has examined
          RAN translation, myelination or oligodendrocytes in a patient or in a model of the disease allele,
          and the genotype differed between the two individuals with imaging findings. Until someone does,
          the leukoencephalopathy is curated as a phenotype without a frequency and without a causal edge
          into the pathograph.'
        proposed_experiments:
        - experiment_id: eif3f_oligodendrocyte_translation
          name: Test myelination and RAN-translation readouts in p.(Phe232Val) oligodendrocytes
          description: Differentiate oligodendrocytes from the gene-edited p.(Phe232Val) homozygous stem
            cell lines and isogenic controls, and compare myelin gene translational efficiency and RAN-protein
            steady-state levels. A positive result would convert the imaging finding from an association
            into a mechanism; a negative one would argue the two reported scans are incidental.
      selected_evidence:
        snippet: Additionally, knockdown of the eukaryotic translation initiation factor eIF3F in cells
          reduces steady-state levels of SCA8 polySer and other RAN proteins.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30206144
      reference_title: SCA8 RAN polySer protein preferentially accumulates in white matter regions and
        is regulated by eIF3F.
      evidence_source: IN_VITRO
      explanation: Establishes that eIF3F modulates RAN protein accumulation, the biology this question
        asks about.
