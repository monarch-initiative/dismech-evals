          disease_term:
            preferred_term: intellectual developmental disorder, autosomal recessive 67
            term:
              id: MONDO:0032662
              label: intellectual developmental disorder, autosomal recessive 67
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eif3f_no_neural_model
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a general reduction in translation initiation produce this particular phenotype,
          with speech affected in everyone and hearing, stature and pain sensation affected in only some?
        attaches_to:
        - pathophysiology#Impaired Brain Development and Somatic Growth
        rationale: Every functional measurement in this disease has been made outside the nervous system.
          The cellular work used undifferentiated induced pluripotent stem cells; the in vivo work used
          mouse skeletal muscle in an animal carrying a null allele on one chromosome, not the human missense
          allele on both. There is no neural model of the disease allele at all, and brain imaging in
          patients is explicitly nonspecific, so there is no structural finding to reason from either.
          The step from "translation is slower" to "speech does not develop" is therefore an inference.
          It is a reasonable one, since eIF3 loads a defined subset of mRNAs rather than acting uniformly,
          but which of those messages matter in which neural cell type at which developmental stage is
          entirely unknown.
        proposed_experiments:
        - experiment_id: eif3f_neural_differentiation_translatome
          name: Profile the translatome of patient-allele neurons through differentiation
          description: Differentiate cortical neurons from the existing gene-edited p.(Phe232Val) homozygous
            stem cell lines and their isogenic controls, and compare ribosome profiling across differentiation
            stages to identify which transcripts lose translational efficiency in neural lineage cells
            specifically, rather than in stem cells.
      selected_evidence:
        snippet: In concordance with the previous study, brain imaging did not reveal specific findings
          and were therefore not considered diagnostically indicative in EIF3F related NDD.
        supports: SUPPORT
