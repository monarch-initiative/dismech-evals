              label: intellectual developmental disorder, autosomal recessive 67
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Global Translation Initiation
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: eIF3 is the largest of the eukaryotic initiation factors, and it does not load every
          message equally; it binds a specific subset of mRNAs involved in proliferation, growth, cell-cycle
          control, differentiation and apoptosis. Lowering eIF3f lowers the measured translation rate
          in cells carrying the variant, in heterozygotes as well as homozygotes. In mouse, partial eIF3f
          depletion reduces polysome content and protein synthesis rate and inhibits the mTOR pathway,
          which is the coupling by which a translation-factor defect becomes a growth defect.
        biological_processes:
        - preferred_term: translational initiation
          term:
            id: GO:0006413
            label: translational initiation
          modifier: DECREASED
        - preferred_term: TOR signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: DECREASED
      selected_evidence:
        snippet: Furthermore, both heterozygous and homozygous variants reduced translation rates in iPSC
          cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
