            description: 'The isogenic human cell model, and the source of every functional measurement
              this pathograph rests on. Induced pluripotent stem cells were gene-edited to carry the founder
              variant homozygously, and show reduced eIF3f protein, reduced translation rate and reduced
              proliferation against their unedited controls. It is the only human system in this entry,
              and it is the model the "no neural model" knowledge gap is measured against: it establishes
              the molecular and cellular steps in human cells while saying nothing about neurons, because
              the cells were never differentiated.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Homozygous EIF3F p.Phe232Val Lowers eIF3f Protein Abundance
        relationship: RECAPITULATES
        fidelity: HIGH
        description: Carries the exact human disease allele in the exact zygosity of affected people,
          on an isogenic background, and reproduces the reduction in eIF3f protein that the molecular
          node asserts.
        limitations: Undifferentiated stem cells. Protein abundance is measured in a cell type that has
          nothing to do with the affected tissue, so the model establishes that the allele lowers eIF3f,
          not that it does so in a neuron.
        readouts:
        - name: eIF3f protein level in the edited line
          target: Homozygous EIF3F p.Phe232Val Lowers eIF3f Protein Abundance
          direction: DECREASED
          interpretation: Lower eIF3f protein against an isogenic control is the measurement the molecular
            node rests on, and the reason the allele is read as hypomorphic rather than as a change in
            protein activity.
      selected_evidence:
        snippet: In vitro studies of induced pluripotent stem cells (iPSC), gene-edited to be homozygous
          for the c.694T>G/ p.(Phe232Val) variant, demonstrated lower EIF3F protein levels and reduced
          proliferation rates
        supports: SUPPORT
