  11d45fb82de3eafa712578fe4dd51a06ddf89e7216b52131ec3a0b8c89b87f8d:
    claim:
      about:
        disease:
          name: Intellectual Developmental Disorder Autosomal Recessive 67
          disease_term:
            preferred_term: intellectual developmental disorder, autosomal recessive 67
            term:
              id: MONDO:0032662
              label: intellectual developmental disorder, autosomal recessive 67
        context: []
      assertion_type: Genetic
      assertion:
        name: EIF3F
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: EIF3F (eukaryotic translation initiation factor 3 subunit F)
          term:
            id: hgnc:3275
            label: EIF3F
        notes: 'The only gene attributed to this entity, and one of only two genes that a genome-wide
          recessive burden analysis of the Deciphering Developmental Disorders cohort identified as newly
          associated with recessive developmental disorders. Its allelic architecture is unusual for a
          recessive neurodevelopmental disorder: rather than many private truncating variants in a few
          families, almost every reported patient carries the same relatively common missense founder
          allele.'
        variants:
        - name: EIF3F c.694T>G p.(Phe232Val)
          description: The founder allele, homozygous in 21 of 22 reported individuals across sixteen
            families and present on a single shared haplotype in all fifteen families tested, so it arose
            once. It is the seventh most common EIF3F missense variant in gnomAD at 0.07% overall, 0.21%
            in Ashkenazi Jewish and 0.12% in non-Finnish European individuals, yet no gnomAD individual
            is homozygous for it, in contrast to five of the six more frequent EIF3F missense variants.
            Functionally it lowers eIF3f protein level, translation rate and proliferation in gene-edited
            stem cells.
          gene:
            preferred_term: EIF3F
            term:
              id: hgnc:3275
              label: EIF3F
          clinical_significance: PATHOGENIC
          type: missense
        - name: EIF3F c.861dup p.(Gln288AlafsTer14)
          description: A frameshift allele found in trans with the founder missense variant in one individual,
            who was at the severe end of the spectrum for motor milestones, speech delay, organic problems
            and pre- and postnatal growth of body and head. This is the entity's only genotype-phenotype
            signal, and it is what supports reading the founder allele as hypomorphic rather than null.
          gene:
            preferred_term: EIF3F
            term:
              id: hgnc:3275
              label: EIF3F
          clinical_significance: PATHOGENIC
          type: frameshift
      selected_evidence:
        snippet: We identified two genes not previously associated with recessive developmental disorders,
          KDM5B and EIF3F, and functionally validated them with mouse and cellular models.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
