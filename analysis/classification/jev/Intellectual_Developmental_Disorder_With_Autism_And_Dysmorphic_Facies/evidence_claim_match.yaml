            term:
              id: MONDO:0859281
              label: intellectual developmental disorder with autism and dysmorphic facies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PDZD8 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: Both PDZD8 alleles carry a premature termination codon (p.Q30* in exon 1, p.Y298*
          in exon 2, p.S733* in the last exon). Any protein escaping nonsense-mediated decay would keep
          the ER transmembrane anchor but lack the C-terminal regions that bind protrudin, late-endosome/lysosome
          phospholipids and Rab7, so no functional full-length protein is expected. PDZD8's SMP domain
          binds and transfers glycerophospholipids and ceramides between membranes, and the protein tethers
          the ER to late endosomes/lysosomes and to mitochondria. These activities are the gene's established
          functions; they were not measured on the patient alleles.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HOMOZYGOUS
        genes:
        - preferred_term: PDZD8
          term:
            id: hgnc:26974
            label: PDZD8
        molecular_functions:
        - preferred_term: lipid transfer activity
          modifier: DECREASED
          term:
            id: GO:0120013
            label: lipid transfer activity
        - preferred_term: endoplasmic reticulum-endosome tether activity
          modifier: DECREASED
          term:
            id: GO:0170016
            label: endoplasmic reticulum-endosome tether activity
        - preferred_term: mitochondrion-endoplasmic reticulum membrane tether activity
          modifier: DECREASED
          term:
            id: GO:0140474
            label: mitochondrion-endoplasmic reticulum membrane tether activity
      selected_evidence:
        snippet: These data demonstrate the involvement of homozygous loss-of-function mutations in PDZD8
          in a neurodevelopmental cognitive disorder.
        supports: SUPPORT
