              label: intellectual developmental disorder with autism and dysmorphic facies
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: iddadf_nonneural_features
        prompt: Which PDZD8 function explains the muscle weakness, facial dysmorphism and short stature
          of IDDADF, and which of the two contact-site roles (ER-endolysosome lipid transfer or ER-mitochondria
          calcium coupling) drives the neurodevelopmental phenotype?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Muscle Weakness
        - phenotypes#Facial Dysmorphism
        - phenotypes#Short Stature
        - pathophysiology#Impaired ER-Mitochondria Calcium Coupling
        - pathophysiology#Impaired Endolysosome Maturation
        rationale: The mechanistic evidence comes from cultured cells, flies and mice; no patient cells
          have been studied, and PDZD8 protein is not detectable in blood. The mouse studies link the
          cognitive phenotype to synaptic plasticity and brain lipid accumulation but do not separate
          the endolysosomal and mitochondrial roles. No source cited here addresses the muscle, craniofacial
          or growth features, and in family A a second homozygous ANKRD2 variant may contribute to the
          myopathy.
      selected_evidence:
        snippet: The lack of PDZD8 protein in human blood limits our ability to detect truncated PDZD8
          proteins (31).
        supports: SUPPORT
