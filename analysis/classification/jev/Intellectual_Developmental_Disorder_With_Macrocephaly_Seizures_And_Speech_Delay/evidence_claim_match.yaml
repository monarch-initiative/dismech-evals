          disease_term:
            preferred_term: intellectual developmental disorder with macrocephaly, seizures, and speech
              delay
            term:
              id: MONDO:0032568
              label: intellectual developmental disorder with macrocephaly, seizures, and speech delay
        context: []
      assertion_type: Genetic
      assertion:
        name: PAK1
        gene_term:
          preferred_term: PAK1
          term:
            id: hgnc:8590
            label: PAK1
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'All reported alleles are heterozygous missense variants, de novo where parents were tested
          (NM_002576 unless stated). Regulatory region: c.251C>G p.(Thr84Arg), c.328T>A p.(Ser110Thr),
          c.361C>T p.(Pro121Ser), c.362C>T p.(Pro121Leu) (NM_001128620), c.392A>G p.(Tyr131Cys), c.396C>A
          p.(Asn132Lys), c.397T>C p.(Ser133Pro), and the Met143 hotspot c.427A>G p.(Met143Val), c.428T>C
          p.(Met143Thr) and c.428T>A p.(Met143Lys) (NM_001128620). Kinase domain: c.1286A>G p.(Tyr429Cys),
          c.1409T>G p.(Leu470Arg), c.1409T>A p.(Leu470Gln), and p.(Ile312Ser), p.(Asp407Asn), p.(Met453Thr),
          p.(Leu470Pro) and p.(Ile476Thr) from one Chinese series, plus c.1427T>C in a further Chinese
          proband. Leu470Pro was mosaic in blood (VAF 13.4%). The Thr84Arg proband also carries a de novo
          1q44 deletion, so part of her phenotype may have a second cause. No truncating allele has been
          reported, PAK1 is depleted of missense variation in the population, and Pak1 knockout mice are
          viable without gross abnormalities, which argues against loss of function as the mechanism.'
      selected_evidence:
        snippet: Using trio exome sequencing, we identified de novo heterozygous missense variants in
          PAK1 in four unrelated individuals with intellectual disability, macrocephaly and seizures.
        supports: SUPPORT
