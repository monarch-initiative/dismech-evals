            term:
              id: MONDO:0032568
              label: intellectual developmental disorder with macrocephaly, seizures, and speech delay
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PAK1 Autoinhibitory Homodimerization Loss
        biological_scale: MOLECULAR
        description: Resting PAK1 is a trans-inhibited homodimer in which the autoinhibitory switch domain
          of each monomer covers the kinase domain of the other; RAC1 or CDC42 binding dissociates the
          dimer and activates the kinase. Disease variants sit in the N-terminal regulatory region (Thr84
          in the GTPase binding region; Ser110, Pro121, Tyr131, Asn132, Ser133 and the Met143 hotspot)
          or in the kinase domain at its contact surface with the inhibitory switch (Tyr429, Leu470).
          Reduced dimerization was measured for Tyr131Cys and Tyr429Cys; for the other variants it is
          inferred from structural modelling.
        genes:
        - preferred_term: PAK1
          term:
            id: hgnc:8590
            label: PAK1
        genetic_context:
          gene:
            preferred_term: PAK1
            term:
              id: hgnc:8590
              label: PAK1
          allele_type: missense
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
        molecular_functions:
        - preferred_term: protein homodimerization activity
          term:
            id: GO:0042803
            label: protein homodimerization activity
          modifier: DECREASED
      selected_evidence:
        snippet: By using co-immunoprecipitation and size-exclusion chromatography, we observed a significantly
          reduced dimerization for both PAK1 mutants compared with wild-type PAK1.
        supports: SUPPORT
    origin:
