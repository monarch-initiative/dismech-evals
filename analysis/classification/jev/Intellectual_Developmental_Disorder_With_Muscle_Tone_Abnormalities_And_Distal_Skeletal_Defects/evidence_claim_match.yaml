        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cns_kv1_short_term_plasticity
        hypothesis_label: Loss of oligodendrocyte-derived LGI3 impairs Kv1-dependent synaptic plasticity
        status: EMERGING
        description: The proposal that the intellectual disability arises because LGI3 secreted by oligodendrocytes
          is needed to cluster ADAM23 and Kv1 channels at central juxtaparanodes, and that their loss
          impairs Kv1-mediated short-term synaptic plasticity. The plasticity defect is shown in mice,
          but Lgi3-null mice showed no behavioural or cognitive deficit, and the pathway has not been
          examined in patients.
      selected_evidence:
        snippet: Given the defective secretion of the LGI3 missense variant, we propose a molecular pathway,
          the juxtaparanodal LGI3-ADAM23-Kv1 channel, for understanding neurodevelopmental disorders.
        supports: SUPPORT
    origin:
