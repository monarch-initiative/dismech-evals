        description: 'LGI3 accumulates at the juxtaparanodes of myelinated axons, where it binds the axonal
          receptor ADAM23 and co-assembles with Kv1 channel complexes. ADAM23 needs its LGI ligands to
          cluster those complexes; LGI2 can partly substitute for LGI3 in the peripheral nerve. The source
          of LGI3 differs by compartment: oligodendrocytes in the brain, and in peripheral nerve mainly
          the neurons themselves, acting in an autocrine fashion, rather than Schwann cells.'
        biological_scale: MOLECULAR
        cell_types:
