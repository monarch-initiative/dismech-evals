        cellular_components:
        - preferred_term: juxtaparanode region of axon
          term:
            id: GO:0044224
            label: juxtaparanode region of axon
      selected_evidence:
        snippet: Here, we find that LGI3 is uniquely secreted from oligodendrocytes in the brain and enriched
