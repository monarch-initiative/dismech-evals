          share the missense p.(Arg188His), and the authors raise a possible different effect, such as
          gain of function, for that allele; this is untested.'
      selected_evidence:
        snippet: As a result of exome-based sequencing work performed by the DDD study, de novo variants
          in CNOT3 have emerged as a newly recognised cause of a developmental disorder.
        supports: SUPPORT
