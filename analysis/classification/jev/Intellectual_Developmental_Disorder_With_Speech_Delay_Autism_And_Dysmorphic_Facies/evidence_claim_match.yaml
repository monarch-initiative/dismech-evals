      assertion_type: Pathophysiology
      assertion:
        name: CNOT3 Haploinsufficiency
        description: Heterozygous truncating, splice and missense CNOT3 variants reduce the amount of
          functional CNOT3. Patient blood shows reduced CNOT3 mRNA and altered expression of other CCR4-NOT
          subunits. CNOT3 is a non-catalytic subunit; its C terminus binds the rest of the complex, and
          loss of CNOT3 lowers the level of the CNOT1 scaffold, so its molecular role is to hold the deadenylase
          complex together rather than to catalyse deadenylation.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CNOT3
          term:
            id: hgnc:7879
            label: CNOT3
        molecular_functions:
        - preferred_term: CCR4-NOT complex adaptor activity
          term:
            id: GO:0030674
            label: protein-macromolecule adaptor activity
          modifier: DECREASED
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Haploinsufficiency appears to be the most likely mechanism of action, with eight cases
          found to have protein-truncating variants.
        supports: SUPPORT
