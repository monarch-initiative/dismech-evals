      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Cortical Neurogenesis
        description: During cortical development, mRNA stability is tuned so that transcripts rising across
          development are stable and falling ones are labile. Complete Cnot3 loss in mouse neural progenitors
          alters progenitor fate and triggers p53-dependent apoptosis, with severe microcephaly and loss
          of deep-layer neurons. Heterozygous loss leaves mouse brain size normal, so the human phenotype
          is assumed to reflect a subtler, dosage-sensitive disturbance of the same process.
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: cerebral cortex development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
        - preferred_term: neurogenesis
          term:
            id: GO:0022008
            label: neurogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Conditional knockout of Cnot3 in neural progenitors and their progeny in the developing
          mouse cortex leads to severe microcephaly due to altered cell fate and p53-dependent apoptosis.
        supports: SUPPORT
