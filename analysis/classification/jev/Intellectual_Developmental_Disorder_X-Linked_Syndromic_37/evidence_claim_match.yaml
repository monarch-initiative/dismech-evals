  44846774c64230d504b1bd9fde9510c8d5e4e04851875bbea6cbfed6b90fd795:
    claim:
      about:
        disease:
          name: Intellectual Developmental Disorder, X-Linked, Syndromic 37
          disease_term:
            preferred_term: intellectual developmental disorder, X-linked, syndromic 37
            term:
              id: MONDO:0958322
              label: intellectual developmental disorder, X-linked, syndromic 37
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: zfx_missense_endocrine_gap
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Germline ZFX Zinc-Finger Missense Variant
        prompt: 'Do zinc-finger missense alleles cause hyperparathyroidism through gained or altered transcriptional
          activity, or is the missense-only association an artefact of small numbers?

          '
        rationale: 'The genotype-phenotype claim rests on hyperparathyroidism having been reported in
          four missense families and in no truncating case. With eighteen founding subjects plus a handful
          of later reports, and with hyperparathyroidism being an age-dependent finding in a largely paediatric
          cohort, the absence of endocrine disease among truncating carriers may reflect ascertainment
          and follow-up rather than biology. The functional data do not settle it either: the founding
          paper reports "differential expression of a small set of target genes" and explicitly declines
          to say whether this is gain or loss of activity. Resolving this matters clinically, because
          it determines whether endocrine surveillance should be offered to all ZFX carriers or only to
          missense carriers, which is how the current recommendation is written.

          '
        proposed_experiments:
        - experiment_id: prospective_endocrine_surveillance_by_allele_class
          name: Prospective endocrine surveillance across allele classes
          description: 'Longitudinal serum calcium and PTH in an unselected ZFX cohort stratified by allele
            class, with sufficient follow-up into adulthood to test whether truncating carriers are genuinely
            spared.

            '
        - experiment_id: direction_resolving_functional_assay
          name: Direction-resolving functional assay in parathyroid-relevant cells
          description: 'Compare genome-wide binding and target activation of wild-type ZFX, zinc-finger
            missense alleles, and null in a parathyroid or endocrine-competent cell model, to determine
            whether the missense alleles gain targets, lose targets, or redistribute.

            '
      selected_evidence:
        snippet: DNA-binding domain variants elicited differential expression of a small set of target
          genes relative to wild-type ZFX in cultured cells, suggesting a gain or loss of transcriptional
          activity.
        supports: SUPPORT
