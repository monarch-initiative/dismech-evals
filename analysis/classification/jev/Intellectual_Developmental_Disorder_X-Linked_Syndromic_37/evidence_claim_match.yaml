        hypothesis_label: Haploinsufficiency / loss of ZFX transcriptional dosage
        status: CANONICAL
        description: 'Truncating alleles, and by extension the neurodevelopmental phenotype generally,
          act by reducing the amount of functional ZFX available to activate its CpG island promoter targets,
          with the elongation defect and the self-renewal defect as the proximate consequences. This is
          the default model and the one consistent with the cell-line knockdown and knockout data.

          '
      selected_evidence:
        snippet: Many genes with promoters bound by ZFX were down-regulated upon ZFX knockdown, supporting
          the hypothesis that ZFX acts as a transcriptional activator.
        supports: SUPPORT
