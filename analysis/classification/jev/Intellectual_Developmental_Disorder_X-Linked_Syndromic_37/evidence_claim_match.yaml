              label: intellectual developmental disorder, X-linked, syndromic 37
        context: []
      assertion_type: Genetic
      assertion:
        name: ZFX
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: ZFX
          term:
            id: hgnc:12869
            label: ZFX
        notes: 'ZFX (Xp22.11; zinc finger protein X-linked) encodes a Krueppel-type C2H2 zinc-finger transcription
          factor with an N-terminal acidic transactivation region and a C-terminal DNA-binding domain
          of 13 tandem C2H2 zinc fingers. ZFX has two close relatives: the Y-linked paralogue ZFY, which
          is 99% identical across the zinc-finger domain, and ZNF711.

          Allelic spectrum: the founding cohort reported 11 distinct variants in 18 subjects from 16 families
          - four missense (accounting for 11 subjects) and seven truncating. The two classes are curated
          as separate pathophysiology nodes because they differ in reported consequence and in phenotype:
          the missense alleles affect the zinc-finger DNA-binding region and are the ones reported with
          hyperparathyroidism, whereas the truncating alleles are presumed simple loss of function. Zinc
          fingers 11-13 are necessary and sufficient for DNA binding, which is the region in which both
          the germline missense alleles and the recurrent somatic parathyroid-adenoma hotspot (R786/R787)
          fall.

          Recurrence across individuals is documented: p.(Met666Valfs*2) was found in a female by genome
          sequencing having previously been reported in an affected male, which is independent support
          for causality of that allele.

          Somatic/germline duality: ZFX is unusual among neurodevelopmental genes in that the same gene
          carries recurrent SOMATIC missense mutations selected in sporadic parathyroid adenomas. Those
          somatic events are a separate phenomenon from the germline disorder and are cited here only
          because they converge on the same protein region.

          '
      selected_evidence:
        snippet: Here, we present clinical and molecular characterization of 18 individuals with germline
          ZFX variants.
        supports: SUPPORT
