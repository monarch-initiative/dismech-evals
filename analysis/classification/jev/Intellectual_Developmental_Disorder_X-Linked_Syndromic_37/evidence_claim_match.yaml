              than from the truncating class. Germline missense carriers develop primary hyperparathyroidism,
              in some cases with a resectable parathyroid lesion and normalisation of PTH and calcium
              after parathyroidectomy. The supporting rationale is that recurrent SOMATIC ZFX missense
              mutations at a two-arginine hotspot (R786/R787) in a C-terminal zinc finger are positively
              selected in sporadic parathyroid adenomas, without loss of heterozygosity - the signature
              of a proto-oncogene rather than a tumour suppressor. Note this is convergence of two allele
              sets on one protein region, not a demonstration that the germline alleles act by the same
              biochemical route.

              '
            cell_types:
            - preferred_term: chief cell of parathyroid gland
              term:
                id: CL:0000446
                label: chief cell of parathyroid gland
            locations:
            - preferred_term: parathyroid gland
              term:
                id: UBERON:0001132
                label: parathyroid gland
            biological_processes:
            - preferred_term: cell population proliferation
              term:
                id: GO:0008283
                label: cell population proliferation
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Osteoporosis
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: 'Long-standing parathyroid hormone excess drives bone resorption, giving the reduced
          bone density seen after years of untreated disease.

          '
      selected_evidence:
        snippet: A 51-year-old woman with a history of primary hyperparathyroidism (PHPT) with prior parathyroidectomy,
          osteoporosis, and learning disability was referred for hypercalcemia discovered after a fall.
