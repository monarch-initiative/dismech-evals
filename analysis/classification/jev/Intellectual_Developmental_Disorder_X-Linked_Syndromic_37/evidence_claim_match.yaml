  0137ac982b52f050d43192c9cac41272d7624b2bf5cef85cb4f72c80e5a431dd:
    claim:
      about:
        disease:
          name: Intellectual Developmental Disorder, X-Linked, Syndromic 37
          disease_term:
            preferred_term: intellectual developmental disorder, X-linked, syndromic 37
            term:
              id: MONDO:0958322
              label: intellectual developmental disorder, X-linked, syndromic 37
        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked inheritance
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'The neutral HPO X-linked term is used deliberately, and neither X-linked dominant
          nor X-linked recessive is asserted.

          The reason is that ZFX escapes X inactivation. Both X alleles are normally expressed in females,
          so a heterozygous female is not a mosaic of wild-type and mutant cells whose phenotype depends
          on skewing - she has a uniform partial reduction in ZFX activity. Consequently females are genuinely
          affected rather than obligate silent carriers, which is what the reported female cases show,
          including a de novo frameshift in a syndromically affected 20-year-old woman.

          Expressivity in females is nevertheless wide, from apparently unaffected transmitting mothers
          through to multi-organ syndromic presentations, and males are in general more severely affected
          than females. The founding cohort included both de novo and inherited variants. Because the
          number of reported individuals is still small and no penetrance study exists, no numeric penetrance
          estimate is curated here.

          Counselling implication drawn by the reporting authors: endocrine testing should be offered
          even to clinically unaffected females carrying missense variants, because the hyperparathyroidism
          risk tracks the allele rather than the neurodevelopmental phenotype.

          '
      selected_evidence:
        snippet: Female carriers of pathogenic ZFX variants demonstrate highly variable expressivity,
          ranging from apparently unaffected individuals to syndromic presentations.
        supports: SUPPORT
