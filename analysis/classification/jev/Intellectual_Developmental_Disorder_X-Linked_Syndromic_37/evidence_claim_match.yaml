        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: zfx_mouse_xci_mismatch
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Escape of ZFX from X Inactivation
        prompt: 'Can mouse Zfx models be used to reason about ZFX dosage in human female carriers, given
          that mouse Zfx is subject to X inactivation while human ZFX escapes it?

          '
        rationale: 'This is a species difference in the exact variable the human disease mechanism turns
          on. In humans, ZFX escapes X inactivation, so a heterozygous female has a uniform partial reduction
          of ZFX in every cell - which is the proposed reason females are genuinely affected rather than
          silent carriers. In mouse, Zfx is inactivated, so a heterozygous female mouse is a cellular
          mosaic of wild-type and mutant cells and her phenotype depends on skewing. A heterozygous Zfx
          mouse therefore does not model a heterozygous ZFX human, and a mild or absent phenotype in such
          a mouse would be uninformative about human female dosage sensitivity rather than evidence against
          it. The mouse data used in this entry are from homozygous/conditional deletion in stem cell
          compartments, where the question does not arise; the mismatch bites for any future heterozygous
          mouse model.

          '
        proposed_experiments:
        - experiment_id: allele_specific_zfx_expression_female_cells
          name: Allele-specific ZFX expression in patient-derived female cells
          description: 'Measure allele-specific ZFX transcript and protein levels in cells from heterozygous
            females across the expressivity range, to test whether residual ZFX dosage - rather than X-inactivation
            skewing, which should not apply to an escape gene - tracks clinical severity.

            '
        - experiment_id: escape_competent_mouse_model
          name: Humanised or escape-competent mouse model
          description: 'Assess whether a mouse model engineered so that Zfx escapes inactivation reproduces
            female dosage sensitivity, isolating escape status as the variable.

            '
      selected_evidence:
        snippet: These results indicate that the mouse Zfx gene is subject to X inactivation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
