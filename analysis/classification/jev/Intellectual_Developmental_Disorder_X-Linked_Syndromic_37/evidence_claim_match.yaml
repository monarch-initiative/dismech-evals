      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: altered_dna_binding_specificity_model
        hypothesis_label: Altered DNA-binding specificity / gained activity of zinc-finger missense alleles
        status: EMERGING
        description: 'Zinc-finger missense alleles are not simple nulls but change which targets are activated
          and by how much, and this altered activity - rather than reduced dosage - is what predisposes
          to parathyroid chief cell proliferation. The supporting arguments are that the founding cohort''s
          functional assay showed differential rather than abolished target expression, that hyperparathyroidism
          has been reported only with missense alleles, and that the somatic parathyroid hotspot is a
          recurrent missense change without loss of heterozygosity. The direction of effect is explicitly
          unresolved: the founding paper says "a gain or loss of transcriptional activity" and does not
          choose.

          '
      selected_evidence:
        snippet: DNA-binding domain variants elicited differential expression of a small set of target
          genes relative to wild-type ZFX in cultured cells, suggesting a gain or loss of transcriptional
          activity.
        supports: SUPPORT
