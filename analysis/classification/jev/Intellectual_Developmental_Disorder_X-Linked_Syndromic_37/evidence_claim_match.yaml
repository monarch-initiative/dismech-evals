              asserts absence of the endocrine phenotype in truncating carriers. The functionally critical
              fingers are the C-terminal ones: zinc fingers 11-13 are necessary and sufficient for DNA
              binding, and the somatic parathyroid-adenoma hotspot (R786/R787) lies in the same C-terminal
              zinc-finger region.

              '
