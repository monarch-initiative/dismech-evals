        - path: /pathophysiology/2
          value:
            name: Escape of ZFX from X Inactivation
            biological_scale: MOLECULAR
            description: 'ZFX is one of the few human X-linked genes that escape X inactivation, so it
              is transcribed from both the active and the inactive X in females. This is a constitutive
              property of the locus rather than a disease event, and it is modelled here because it is
              what determines the dosage consequence of a heterozygous allele: a female carrier has a
              uniform partial reduction in ZFX activity in every cell rather than a mosaic of wild-type
              and mutant cells, which is why females are genuinely affected rather than silent carriers.

              '
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired ZFX-Dependent Transcriptional Activation at CpG Island Promoters
        description: 'MODULATING, not causing. Note the schema''s `causal_link_type` encodes only directness,
          so it is deliberately left unset here rather than asserting a directness that would misdescribe
          this edge. Escape from X inactivation is a constitutive normal property of the locus and produces
          no disease on its own; what it does is set how a heterozygous allele translates into dosage.
          Because the second allele cannot be recruited by skewed inactivation, heterozygosity in a female
          produces a uniform partial reduction in ZFX activity rather than a mosaic.

          '
      selected_evidence:
        snippet: Female carriers of pathogenic ZFX variants demonstrate highly variable expressivity,
          ranging from apparently unaffected individuals to syndromic presentations.
        supports: SUPPORT
