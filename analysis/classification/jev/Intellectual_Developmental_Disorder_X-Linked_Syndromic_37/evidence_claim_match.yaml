        name: Escape of ZFX from X Inactivation
        biological_scale: MOLECULAR
        description: 'ZFX is one of the few human X-linked genes that escape X inactivation, so it is
          transcribed from both the active and the inactive X in females. This is a constitutive property
          of the locus rather than a disease event, and it is modelled here because it is what determines
          the dosage consequence of a heterozygous allele: a female carrier has a uniform partial reduction
          in ZFX activity in every cell rather than a mosaic of wild-type and mutant cells, which is why
          females are genuinely affected rather than silent carriers.

          '
      selected_evidence:
        snippet: Transcription analysis of human-rodent hybrid cell lines containing "inactive" human
          X chromosomes suggests that ZFX escapes X inactivation.
        supports: SUPPORT
