            term:
              id: MONDO:0958322
              label: intellectual developmental disorder, X-linked, syndromic 37
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: zfx_neural_progenitor_gap
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Impaired Stem and Progenitor Cell Self-Renewal
        prompt: 'Does ZFX loss actually impair neural progenitor self-renewal in the developing human
          brain, or is the progenitor route to the neurodevelopmental phenotype an inference from embryonic
          and haematopoietic stem cells?

          '
        rationale: 'Every direct measurement of a ZFX self-renewal requirement comes from embryonic stem
          cells (mouse and human) or adult haematopoietic stem cells. No study has assayed neural progenitors,
          and no patient-derived neural tissue or organoid model of MRXS37 has been reported. The step
          from "ZFX maintains stem cell self-renewal" to "ZFX loss disrupts cortical development" is therefore
          currently an extrapolation across cell type, and the entry marks the causal edge into the neurodevelopmental
          node PARTIAL for that reason. The alternative that has not been excluded is that the relevant
          defect is not progenitor depletion at all but a post-mitotic transcriptional deficit in differentiating
          neurons.

          '
        proposed_experiments:
        - experiment_id: patient_ipsc_cortical_organoids
          name: Patient-derived iPSC cortical organoids
          description: 'Differentiate iPSCs carrying truncating and zinc-finger missense ZFX alleles into
            cortical organoids and measure neural progenitor proliferation, apoptosis and cell-cycle exit
            against isogenic controls, distinguishing a progenitor-maintenance defect from a differentiation
            defect.

            '
        - experiment_id: zfx_target_mapping_neural_progenitors
          name: ZFX target-gene mapping in human neural progenitors
          description: 'ChIP-seq and nascent-transcription profiling of ZFX in human neural progenitor
            cells, to test whether the promoter-proximal pausing mechanism established in cancer cell
            lines operates on neurodevelopmental target genes.

            '
      selected_evidence:
        snippet: These studies identify Zfx as a shared transcriptional regulator of ESC and HSC, suggesting
          a common genetic basis of self-renewal in embryonic and adult SC.
        supports: SUPPORT
