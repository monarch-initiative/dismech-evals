            term:
              id: MONDO:0859080
              label: intellectual developmental disorder, X-linked, syndromic, with pigmentary mosaicism
                and coarse facies
        context: []
      assertion_type: Inheritance
      assertion:
        name: Post-zygotic mosaicism in some affected males
        description: 'Some affected males carry the TFE3 variant in a mosaic state, at least two of the
          five males in the largest series and the single male among the first five reported patients.
          This is DNA-level post-zygotic mosaicism in those individuals. It is not the architecture of
          the disease as a whole: other males carry a constitutional hemizygous variant, and the pigmentary
          pattern of heterozygous females reflects functional X-chromosome mosaicism, which is not encoded
          by this term. The mosaic males are treated as individual mosaic probands rather than a recognized
          mosaic arm of the disease: the sources describe the same phenotype in mosaic and non-mosaic
          patients and do not delineate a distinct mosaic-only presentation, so the entry is not proposed
          for the Somatic_Mosaic_Disorders grouping.'
        inheritance_term:
          preferred_term: Typified by somatic mosaicism
          term:
            id: HP:0001442
            label: Typified by somatic mosaicism
      selected_evidence:
        snippet: The variant was at a mosaic state in at least two male patients.
        supports: SUPPORT
