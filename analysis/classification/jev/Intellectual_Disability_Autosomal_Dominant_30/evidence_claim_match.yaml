      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No population prevalence estimate exists. The disorder is known from aggregated case reports
          and small cohorts - the largest published series describes 20 individuals with ZMYND11-associated
          epilepsy, assembled through GeneMatcher, ClinVar and a rare-epilepsy network. The class is recorded
          as ULTRA_RARE on that basis, and this record exists to say "no estimate exists" structurally
          rather than to leave the section absent.
      selected_evidence:
        snippet: We obtained clinical descriptions of 16 new and nine published individuals, plus detailed
          case history of two children.
        supports: SUPPORT
