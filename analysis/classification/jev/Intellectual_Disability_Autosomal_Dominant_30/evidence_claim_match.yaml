      assertion:
        name: Molecular genetic testing
        description: Diagnosis is molecular. Intragenic ZMYND11 variants are found by exome or genome
          sequencing or by intellectual-disability and epilepsy gene panels; whole-gene deletions within
          a 10p15.3 microdeletion are found by chromosomal microarray, which a sequencing-only strategy
          can miss. Variants are classified against ACMG criteria. There is no biochemical marker and
          no functional assay in clinical use.
      selected_evidence:
        snippet: Genetic evaluation was performed using gene panels or exome sequencing; variants were
          classified using American College of Medical Genetics (ACMG) criteria.
