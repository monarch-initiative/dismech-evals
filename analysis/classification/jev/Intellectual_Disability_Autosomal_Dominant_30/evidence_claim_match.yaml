      assertion:
        name: ZMYND11-deficient human embryonic stem cell-derived cortical neural stem cells
        experimental_model_type: OTHER
        description: 'Isogenic human embryonic stem cell lines carrying CRISPR-engineered ZMYND11 loss-of-function
          (knockout) and heterozygous patient-like mutations, differentiated to cortical fates in two
          formats: 3D guided cortical organoids and 2D monolayer directed differentiation to prefrontal-like
          cortical neural stem cells. The quantitative progenitor and neuron readouts come from the monolayer
          cultures, which the authors adopted to reduce organoid variability. Classified as OTHER because
          the system is human embryonic stem cell-derived rather than iPSC-derived and spans organoid
          and monolayer formats.'
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        cell_types:
        - preferred_term: neural stem cell
          term:
            id: CL:0000047
            label: neural stem cell
        cell_source: Human embryonic stem cells with CRISPR-engineered isogenic ZMYND11 loss-of-function
          and heterozygous patient-like mutations
        culture_system: 2D monolayer directed cortical differentiation (flow cytometry readouts); 3D guided
          cortical organoids
        publication: PMID:41068108
        modeled_mechanisms:
        - target: Impaired cortical progenitor and neuron production
          relationship: PARTIALLY_RECAPITULATES
          fidelity: UNKNOWN
          model_scale: CELLULAR
          description: ZMYND11-deficient cortical cultures produce fewer TBR2-positive intermediate progenitors
            and fewer TBR1-positive deep-layer neurons, and re-expressing ZMYND11 restores neuron differentiation
            in the cells that keep expressing the transgene. The heterozygous patient-like lines behave
            like the knockout, which is what makes the model relevant to a dominant disorder.
          limitations: 'The model observes cell populations in culture, while the node is a tissue-level
            claim about cortical development, so the link extrapolates upward. The deficit is a delay
            rather than a permanent block: by day 30 the mutant cultures had caught up substantially.
            Patients with ZMYND11 variants do not show major brain malformations, and no study has measured
            a cortical progenitor or neuron deficit in patients, which is why fidelity is UNKNOWN and
            why the linked HUMAN_MODEL_MISMATCH discussion is open. PARTIALLY_RECAPITULATES rather than
            RECAPITULATES because the node asserts a deficit in cortical development and the model shows
            a delayed one in vitro.'
          readouts:
          - name: TBR2-positive intermediate progenitor generation
            target: Impaired cortical progenitor and neuron production
            direction: DECREASED
            interpretation: The primary quantitative readout of the progenitor deficit, measured by flow
              cytometry in day-16 monolayer cultures.
          - name: TBR1-positive deep-layer neuron generation
            target: Impaired cortical progenitor and neuron production
            direction: DECREASED
            interpretation: Confirms that the progenitor deficit carries through to neuron output.
          - name: Neuron differentiation after ZMYND11 re-expression
            target: Impaired cortical progenitor and neuron production
            direction: RESTORED
            interpretation: 'Rescue arm: doxycycline-inducible FLAG-ZMYND11 in the knockout line. The
              overall rescue was modest because the transgene was silenced during differentiation; the
              effect is clear only in FLAG-positive cells.'
      selected_evidence:
        snippet: we engineered loss-of-function and heterozygous/patient-like mutations in human embryonic
          stem cells (hESCs) to investigate its function in disease-relevant cell types within an isogenic
          background
        supports: SUPPORT
