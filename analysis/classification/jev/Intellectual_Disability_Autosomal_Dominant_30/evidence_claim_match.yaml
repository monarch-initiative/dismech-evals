              label: intellectual disability, autosomal dominant 30
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ZMYND11 H3.3K36me3 reader function
        biological_scale: MOLECULAR
        description: ZMYND11 binds H3.3K36me3 over the bodies of actively transcribed genes and acts as
          an unconventional co-repressor, damping the elongation phase of RNA polymerase II. A heterozygous
          loss-of-function allele halves that reader dosage. The proposed normal role is suppression of
          cryptic transcription initiating from within gene bodies of highly expressed genes, so this
          is loss of a brake on transcriptional noise rather than loss of a dedicated activator or repressor
          of specific target genes.
        genes:
        - preferred_term: ZMYND11
          term:
            id: hgnc:16966
            label: ZMYND11
        molecular_functions:
        - preferred_term: chromatin binding
          term:
            id: GO:0003682
            label: chromatin binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: the ZMYND11 gene has important functions in epigenetic regulation as an unconventional
          transcription co-repressor of highly expressed genes, possibly acting in the repression of cryptic
          transcription from gene bodies
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28933030
      reference_title: Phenotype comparison confirms ZMYND11 as a critical gene for 10p15.3 microdeletion
