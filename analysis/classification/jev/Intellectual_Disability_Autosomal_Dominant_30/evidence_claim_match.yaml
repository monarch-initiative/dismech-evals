          name: Intellectual Disability, Autosomal Dominant 30
          disease_term:
            preferred_term: intellectual disability, autosomal dominant 30
            term:
              id: MONDO:0014486
              label: intellectual disability, autosomal dominant 30
        context: []
      assertion_type: Genetic
      assertion:
        name: ZMYND11
        association: Causative
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: ZMYND11
          term:
            id: hgnc:16966
            label: ZMYND11
        notes: 'Variant origin. Most reported pathogenic variants are de novo, but not all: a 10p15.3
          microdeletion has been shown to be inherited from a father with mild language impairment. variant_origin
          is therefore deliberately left unset rather than asserted as DE_NOVO, because both origins occur
          and the difference is what a counselling conversation turns on.

          Variant classes and what separates them. Most reported pathogenic variants are truncating or
          whole-gene deletions and are consistent with haploinsufficiency. Missense variants are rarer
          and may not be a weaker version of the same thing: aggregate comparison of 13 reported missense
          variants found higher frequencies of strabismus, hypotonia and severe intellectual disability
          than in loss-of-function carriers, and the recurrent c.1798C>T p.Arg600Trp variant is associated
          with microcephaly, broad nasal alae, short stature, cryptorchidism and nipple anomalies that
          are not emphasised in loss-of-function cases. Variants are distributed across the gene with
          no reproducible positional genotype-phenotype correlation, so variant position should not be
          used prognostically.'
      selected_evidence:
        snippet: truncations of ZMYND11 in individuals with autism, aggression and complex neuropsychiatric
          features
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
