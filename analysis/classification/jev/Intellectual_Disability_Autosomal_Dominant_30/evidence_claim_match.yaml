        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of brain-specific RBFOX2-dependent splicing
        biological_scale: MOLECULAR
        description: 'Two literatures meet at this node and they do not say the same thing, so the entry
          states both rather than picking the tidier one.

          In non-neural cells, ZMYND11 couples the chromatin mark it reads directly to pre-mRNA processing:
          it associates with U5 snRNP spliceosome components and promotes intron retention by physically
          antagonising EFTUD2, and that regulation depends on its binding to H3K36me3-decorated chromatin.
          That is a direct, chromatin-dependent splicing role.

          In human cortical cells it appears not to work that way. The corticogenesis study found that
          ZMYND11 did not largely regulate splicing directly - few differentially spliced events overlapped
          its chromatin binding - and attributes the splicing phenotype instead to increased RBFOX2 expression
          in the mutant, making the effect indirect. The disease-relevant output is a brain-specific RNA
          isoform switch, and it is partially rescuable by enhancing ZMYND11 function.

          The incoming edge is graded INDIRECT_KNOWN_INTERMEDIATES to follow the cortical evidence, since
          that is the tissue this disease is about.'
        biological_processes:
        - preferred_term: RNA splicing
          term:
            id: GO:0008380
            label: RNA splicing
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Biochemical and genetic experiments demonstrate that BS69 promotes IR by antagonizing
          EFTUD2 through physical interactions.
        supports: SUPPORT
