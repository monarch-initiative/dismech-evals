  14f032f5231e7e67714c3ceab52d73b6496e7f85889c490e4ea92f3992b4c412:
    claim:
      about:
        disease:
          name: Intellectual Disability Autosomal Dominant 42
          disease_term:
            preferred_term: intellectual disability, autosomal dominant 42
            term:
              id: MONDO:0014855
              label: intellectual disability, autosomal dominant 42
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GNB1 Pathogenic Variant
        description: 'A heterozygous germline GNB1 variant, most often a de novo missense change clustered
          in exons 6 and 7 at Gbeta residues that contact Galpha and downstream effectors (recurrent sites
          include Lys78, Ile80 and Asp118), and less often a truncating or splice variant. Variant effects
          are allele-specific rather than uniformly gain or loss of function. The molecular functions
          bound here are the normal Gbeta1 activities that the two downstream arms disturb, taken from
          GO annotations of human GNB1 (UniProt P62873): GTPase binding (binding Galpha, IPI) and potassium
          channel activator activity (GIRK activation, IDA). They are GO annotations of the wild-type
          protein, not functions measured in patients.'
        biological_scale: MOLECULAR
        role: trigger
        molecular_functions:
        - preferred_term: GTPase binding
          term:
            id: GO:0051020
            label: GTPase binding
          modifier: ABNORMAL
        - preferred_term: potassium channel activator activity
          term:
            id: GO:0099104
            label: potassium channel activator activity
          modifier: ABNORMAL
        gene:
          preferred_term: GNB1
          term:
            id: hgnc:4396
            label: GNB1
        genetic_context:
          gene:
            preferred_term: GNB1
            term:
              id: hgnc:4396
              label: GNB1
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          description: Mostly de novo heterozygous missense variants; truncating and splice variants also
            occur. functional_impact_category is left unset because the consequence differs by allele
            (loss of complex assembly for many missense and all truncating alleles, GIRK gain of function
            for K78R, GIRK loss of function for I80T/N).
      selected_evidence:
        snippet: we identified 14 different novel variants (2 splice site, 2 frameshift and 10 missense
          changes) in GNB1 in 16 pediatric patients
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
