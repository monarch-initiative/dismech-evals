              label: intellectual disability, autosomal dominant 42
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Gbeta-gamma Dimer and Heterotrimer Assembly
        description: Mutant Gbeta1 fails to dimerize normally with Ggamma or to assemble into the Galpha-beta-gamma
          heterotrimer, so receptor-driven G protein activation is reduced. For truncating and splice
          alleles this amounts to loss of function of one allele (haploinsufficiency); whether haploinsufficiency
          is a disease mechanism was still judged unclear by ClinGen in 2023, and Gnb1 haploinsufficient
          mice do not show increased seizure susceptibility.
        biological_scale: MOLECULAR
        role: mediator
        protein_complexes:
        - preferred_term: heterotrimeric G-protein complex
          term:
            id: GO:0005834
            label: heterotrimeric G-protein complex
        biological_processes:
        - preferred_term: G protein-coupled receptor signaling pathway
          term:
            id: GO:0007186
            label: G protein-coupled receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: These studies revealed altered functionality of the missense mutations R52G, G64V, A92T,
          P94S, P96L, A106T and D118G but not for L30F, H91R and K337Q.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
