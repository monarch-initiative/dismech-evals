      - /disease_term
    evidence_metadata:
      reference: PMID:28087732
      reference_title: Novel GNB1 mutations disrupt assembly and function of G protein heterotrimers and
        cause global developmental delay in humans.
      evidence_source: IN_VITRO
      explanation: BRET assays of Gbeta-gamma and heterotrimer formation and D1 receptor coupling show
