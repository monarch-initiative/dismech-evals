      assertion_type: Subtype
      assertion:
        name: Microcephalic
        display_name: Microcephalic MRD48 (dominant-negative RAC1 variants)
        description: Microcephaly (about -2.5 to -5 SD) with dominant-negative or presumed dominant-negative
          variants. p.Cys18Tyr, p.Asn39Ser, p.Glu31Gly and variants in the C-terminal part of switch II
          (P69-Q74) are dominant-negative in functional assays; p.Pro73Leu and p.Cys157Tyr showed at most
          a modest effect in fibroblast assays and are grouped here by phenotype.
      selected_evidence:
        snippet: By contrast, individuals with variants in the C-terminal part of switch II exhibited
          microcephaly.
        supports: SUPPORT
