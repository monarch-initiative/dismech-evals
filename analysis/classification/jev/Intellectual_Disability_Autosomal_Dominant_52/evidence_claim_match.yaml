      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_mrd52_model_genotype_and_seizure_semiology
        prompt: How do dosage, seizure subtype and rescue effects translate from distinct Ash1l mouse
          models to human epilepsy?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cortical Excitation-Inhibition Imbalance
        - phenotypes#Seizures
        - phenotypes#Absence Seizures
        - phenotypes#Focal Motor Seizures
        - phenotypes#Myoclonic Seizures
        - phenotypes#Febrile Seizures
        rationale: Severe juvenile PFC knockdown and heterozygous gene-trap models both support hyperexcitability,
          but differ in dosage, mortality and rescue. Combined diazepam/chemogenetic inhibition rescued
          seizures without social or anxiety rescue in the severe model; pyramidal inhibition alone improved
          social behavior and absence-like seizures in the heterozygous model. Human absence seizures
          are explicitly reported, so absence semiology is shared. Human focal motor, myoclonic and febrile
          seizures have no demonstrated subtype-specific circuit in these experiments. PTZ-provoked convulsions
          are not spontaneous generalized convulsive seizures.
        proposed_experiments:
        - experiment_id: exp_mrd52_heterozygous_model_seizure_characterization
          name: Longitudinal seizure phenotyping of genotype-matched Ash1l heterozygotes
          description: Perform long-term video-EEG across development in heterozygous Ash1l mice on more
            than one genetic background, classifying seizure types against the human semiologies, and
            test whether the GABA-enhancing rescue that works in the severe knockdown also works at heterozygous
            dose.
      selected_evidence:
        snippet: Chemogenetic inhibition of PFC pyramidal neuronal activity, combined with the administration
          of GABA enhancer diazepam, rescues PFC synaptic imbalance and seizures, but not autistic social
          deficits or anxiety-like behaviors.
        supports: SUPPORT
    origin:
