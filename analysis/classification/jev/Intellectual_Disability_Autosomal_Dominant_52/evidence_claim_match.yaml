          seizures have no demonstrated subtype-specific circuit in these experiments. PTZ-provoked convulsions
          are not spontaneous generalized convulsive seizures.
        proposed_experiments:
        - experiment_id: exp_mrd52_heterozygous_model_seizure_characterization
          name: Longitudinal seizure phenotyping of genotype-matched Ash1l heterozygotes
          description: Perform long-term video-EEG across development in heterozygous Ash1l mice on more
            than one genetic background, classifying seizure types against the human semiologies, and
            test whether the GABA-enhancing rescue that works in the severe knockdown also works at heterozygous
            dose.
      selected_evidence:
        snippet: Epileptiform discharges were found on electroencephalograms (EEGs) of Ash1l+/GT mice,
          indicating absence-like seizures.
        supports: SUPPORT
