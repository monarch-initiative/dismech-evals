        prompt: How does reduced ASH1L function alter promoter H3K4me3 in the relevant neuronal systems?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced ASH1L Histone Methyltransferase Activity
        - pathophysiology#Loss of Activating Chromatin Marks at Neurodevelopmental Gene Promoters
        rationale: Biochemical evidence establishes H3K36 substrate specificity, while severe mouse PFC
          knockdown lowers H3K4me3 without changing bulk H3K36me2/me3. Human-neuron work discusses H3K4me3
          deposition by the interacting MLL complex. The remaining gap is the indirect route and disease-relevant
          chromatin context, not equal evidence that ASH1L directly catalyzes both marks.
        proposed_experiments:
        - experiment_id: exp_mrd52_separation_of_function_ash1l_alleles
          name: Separation-of-function ASH1L alleles in neurons
          description: Compare matched ASH1L dosage reduction and catalytic inactivation in isogenic human
            neurons, measuring H3K36me2, promoter H3K4me3, associated chromatin complexes and transcription.
            Rescue experiments should separate catalytic output from indirect chromatin regulation.
      selected_evidence:
        snippet: However, H3K36me2 presence will lead to upregulation of H3K36me3 by SET2 54, and H3K4me3
          marks are deposited by the ASH1L interactor - MLL complex 55.
        supports: SUPPORT
        directness: INDIRECT
