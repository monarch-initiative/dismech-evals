          simple haploinsufficiency?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Heterozygous ASH1L Loss of Function
        - pathophysiology#Reduced ASH1L Histone Methyltransferase Activity
        rationale: Small published case series suggested greater severity with missense alleles, but ascertainment,
          variable pathogenicity and allele-specific effects prevent inferring dominant-negative or gain-of-function
          behavior from clinical severity alone. The 2024 registry excluded its three missense-VUS participants;
          its literature table nevertheless includes earlier reported missense cases. Functional results
          in ASH1L-associated Tourette cohorts cannot automatically establish the mechanism of different
          MRD52 alleles.
        proposed_experiments:
        - experiment_id: exp_mrd52_missense_allele_functional_assay
          name: Functional assay of reported ASH1L missense alleles
          description: Express reported missense alleles alongside wild type and null in a neuronal system,
            and test both catalytic output and whether the missense protein interferes with the wild-type
            allele, to distinguish haploinsufficiency from a dominant-negative effect.
      selected_evidence:
        snippet: However, additional functional studies are needed to understand the mechanism of disease
          for missense variants [11]
        supports: SUPPORT
