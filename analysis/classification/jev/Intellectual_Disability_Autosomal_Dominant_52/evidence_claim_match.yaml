      assertion_type: AnimalModel
      assertion:
        name: Cortex-specific Ash1l conditional knockout mouse
        species: Mouse
        genotype: Ash1l exon 4 conditional deletion (p.V1693Afs*2), Emx1-Cre-ERT2 induced at E10.5; and
          Ash1l germline null
        publication: PMID:38943682
        description: 'Tamoxifen-induced cortical deletion from E10.5 misspecifies cortical projection
          neurons: SATB2-expressing neurons increase in number, spread through the cortical plate, and
          appear ectopically in deep layers, with an altered differentiation trajectory on single-cell
          RNA sequencing. The germline null is present at expected proportions at E18.5 but absent at
          birth, and has shortened nasal bones.'
        modeled_mechanisms:
        - target: Disrupted Cortical Neuron Specification and Lamination
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Cortical Ash1l deletion produces excess and ectopically placed SATB2-expressing
            projection neurons with an altered differentiation trajectory, establishing a requirement
            for ASH1L in projection neuron specification.
          limitations: This is a homozygous conditional deletion, not the usual human heterozygous dosage.
            The reviewed human cases do not establish an equivalent cortical lamination lesion; delayed
            white-matter myelination in one missense case is a different finding.
          readouts:
          - name: Laminar distribution of SATB2-expressing neurons
            target: Disrupted Cortical Neuron Specification and Lamination
            description: Immunohistochemistry for SATB2 with EdU birthdating in conditional knockout versus
              control cortex.
            direction: ALTERED
            interpretation: Deep-layer neurons ectopically expressing an upper-layer marker are the structural
              readout of misspecification.
        - target: Impaired Craniofacial Development
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: The germline null dies perinatally and has shortened nasal bones, demonstrating
            a requirement for Ash1l in craniofacial development outside the brain.
          limitations: The mouse finding is a specific craniofacial measurement in homozygous nulls; the
            human extraneural phenotype is dominated by genital and musculoskeletal anomalies with no
            consistent facial gestalt, and human heterozygotes survive. The two do not correspond feature
            for feature.
          readouts:
          - name: Nasal bone length
            target: Impaired Craniofacial Development
            description: Skeletal measurement in Ash1l germline null embryos versus controls.
            direction: DECREASED
            interpretation: A quantified craniofacial skeletal defect outside the nervous system.
      selected_evidence:
        snippet: In the cortical-specific knockout model, SATB2 neurons showed increased numbers (n =
          6/genotype, P = 0.0001) and were distributed through the cortical plate.
        supports: SUPPORT
