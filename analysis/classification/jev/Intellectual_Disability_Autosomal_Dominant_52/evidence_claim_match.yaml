        relationship_type: CAUSATIVE
        notes: ASH1L (1q22) encodes a Trithorax-group histone methyltransferase. Pathogenic alleles reported
          with detailed phenotyping are predominantly loss-of-function (nonsense, frameshift, deletion);
          missense alleles have also been reported but their disease mechanism is unresolved. ClinGen's
          Intellectual Disability and Autism Gene Curation Expert Panel classified the gene-disease relationship
          as Definitive.
      selected_evidence:
        snippet: A review of reported ASH1L nonsense mutations to explore genotype-phenotype correlations
          suggested that these variants typically result in a loss of function.
        supports: SUPPORT
