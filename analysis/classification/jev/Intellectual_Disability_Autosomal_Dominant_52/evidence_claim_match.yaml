      assertion:
        name: Ash1l heterozygous knockout mouse (EphA7 pruning model)
        species: Mouse
        genotype: Ash1l+/- germline heterozygous knockout, and neuron-specific Ash1l deletion
        publication: PMID:35081333
        description: Haploinsufficient mice show anxiety, repetitive behaviour and altered social behaviour
          with intact learning but impaired discrimination. Neuronal Ash1l deletion produces excess synapses
          through a pruning deficit, traced to silencing of Eph receptor A7 by EZH2-deposited H3K27me3;
          supplying the EphA7 ligand ephrin-A5 restores pruning and rescues the discrimination deficit.
        modeled_mechanisms:
        - target: Synaptic Pruning Failure
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Excess synapses persist because developmental pruning fails, and the responsible
            gene, Eph receptor A7, is identified together with the repressive-mark mechanism silencing
            it.
          limitations: Synapse counts and pruning have not been measured in human ASH1L patients or tissue,
            and the pruning defect is most evident post-learning in a specific paradigm; the EPHA7 route
            is one identified mechanism, not necessarily the only one.
          readouts:
          - name: Synapse number after learning
            target: Synaptic Pruning Failure
            description: Synapse quantification in Ash1l-deleted neurons, particularly in the post-learning
              period.
            direction: INCREASED
            interpretation: Excess synapses are the direct cellular readout of the pruning failure.
          - name: Discrimination performance after ephrin-A5 supplementation
            target: Synaptic Pruning Failure
            description: Behavioural discrimination testing in Ash1l+/- mice given the EphA7 ligand ephrin-A5,
              against untreated mutants.
            direction: RESTORED
            interpretation: Rescue by reactivating the specific downstream receptor is what makes the
              EPHA7 route causal rather than correlative.
      selected_evidence:
        snippet: Our results suggest that Ash1l haploinsufficiency is a highly penetrant risk factor for
          ASD, resulting from synapse pruning deficits.
        supports: SUPPORT
