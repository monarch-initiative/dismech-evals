        - phenotypes#Movement Impairment
        rationale: 'The MRT series is conventionally treated as static, and developmental regression is
          taken to argue against the diagnosis. The knock-in mouse says otherwise for this gene: lipofuscin
          accumulation, progressive caspase-3 activation, and motor decline that worsens between adolescence
          and adulthood. The human evidence is a retrospective chart review that found movement deficits,
          not a longitudinal study that found progression. No patient has been followed prospectively,
          and no human neuropathology exists. Resolving this changes surveillance - whether these patients
          need serial motor assessment - and it changes whether MRT43 should be described as a neurodevelopmental
          or a neurodegenerative disorder.'
