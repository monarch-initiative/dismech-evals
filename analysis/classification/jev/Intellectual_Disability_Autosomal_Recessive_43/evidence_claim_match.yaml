  f247c3116e6d0e390ac71c368ff0266a95d7e06b4af3a65bcccdc3041cc11405:
    claim:
      about:
        disease:
          name: Intellectual Disability, Autosomal Recessive 43
          disease_term:
            preferred_term: intellectual disability, autosomal recessive 43
            term:
              id: MONDO:0014354
              label: intellectual disability, autosomal recessive 43
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: WASHC3-related short stature and neurodevelopmental syndrome
        description: WASHC3/CCDC53 is a third subunit of the same pentamer. Variants in it were reported
          in 2025 to cause short stature, variable neurodevelopmental abnormalities and distinctive facial
          dysmorphism - a phenotype that overlaps MRT43 closely enough to be a real diagnostic and curation
          confusion, since short stature, developmental abnormality and dysmorphism are exactly the MRT43
          triad. The distinction is the gene, and that one reported WASHC3 family carries a de novo dominant
          allele rather than biallelic variants.
        distinguishing_features:
        - Caused by WASHC3/CCDC53, not WASHC4/KIAA1033
        - Includes a de novo dominant missense family, so inheritance is not uniformly recessive
        - Short stature is attributed to impaired PTH1R endosomal trafficking in growth plate chondrocytes,
          a mechanism not demonstrated for WASHC4
      selected_evidence:
        snippet: In the first family, a de-novo-dominant missense variant (p.L69F) impaired WASHC3 participation
          in the WASH complex, altered PTH1R endosomal trafficking, diminished PTH1R signaling, and affected
          growth plate chondrocyte hypertrophic differentiation, providing a likely explanation for the
          short stature.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/1
      context_paths:
