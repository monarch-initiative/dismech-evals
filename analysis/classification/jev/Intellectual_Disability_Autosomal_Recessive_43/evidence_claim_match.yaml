        genotype: Washc4 p.Pro1019Arg knock-in, homozygous (SWIP-P1019R), CRISPR-generated
        category: Genetic
        publication: PMID:33749590
        description: A mouse carrying the exact missense allele found in the founding Omani pedigree.
          It is the only animal model of a specific human MRT43 allele, and it generated a prediction
          - progressive motor decline - that was subsequently confirmed in the patients.
        genes:
        - preferred_term: WASHC4
          term:
            id: hgnc:29174
            label: WASHC4
        modeled_mechanisms:
        - target: WASH Complex Destabilization
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: Spatial proteomics of mutant mouse brain shows the same complex destabilisation
            demonstrated for the patient allele in cells.
        - target: Neuronal Endo-Lysosomal Dysfunction
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Enlarged endosomes and lysosomes, lipofuscin accumulation and progressive caspase-3
            activation in mutant brain.
          limitations: The corresponding neuropathology has not been examined in patients - there is no
            human brain tissue in the literature for this disorder - so the cellular phenotype is established
            only in the mouse.
          readouts:
          - name: Endosome and lysosome size and lysosomal substrate accumulation
            target: Neuronal Endo-Lysosomal Dysfunction
            direction: INCREASED
            interpretation: Morphological correlate of the sorting failure at the compartment level.
        - target: Movement Impairment
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Rotarod, gait and strength decline with age in mutant mice; the equivalent human
            deficits were then found on retrospective chart review.
          limitations: Rodent rotarod and gait measures are not the clinical movement examination used
            in the patients, and the human confirmation is retrospective, so the correspondence is at
            the level of "movement is affected and worsens", not of a matched motor phenotype.
          readouts:
          - name: TreadScan gait parameters at adolescence versus adulthood
            target: Movement Impairment
            direction: ALTERED
            interpretation: 'Behavioural correlate of the progressive motor arm of the phenotype: gait
              is indistinguishable from wild type in adolescence and clearly abnormal in the same animals
              as adults.'
      selected_evidence:
        snippet: To uncover how dysfunction of endosomal SWIP leads to disease, we generate a mouse model
          of the human WASHC4c.3056C>G mutation.
        supports: SUPPORT
