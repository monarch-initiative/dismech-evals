            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            frequency: The only gene known to cause MRT43; all reported families carry biallelic WASHC4
              variants.
            notes: 'Formerly KIAA1033; the protein is widely called SWIP (Strumpellin and WASH interacting
              protein). Reported disease alleles are the homozygous missense c.3056C>G p.(Pro1019Arg)
              in the founding Omani family, the compound heterozygous pairs p.(Gln442*)/p.(Asp1048Gly)
              and p.(Lys1079Arg)/p.(His503Arg), and a further homozygous variant in the 2022 sibship.
              Both truncating and missense alleles occur, and the functionally characterised missense
              allele behaves as a loss of function by destabilising the complex rather than by any gain
              of activity.

              Complete Washc4 knockout in mouse is reported by MGI and IMPC to cause early embryonic phenotypes
              consistent with embryonic lethality, which would mean the human disease alleles are necessarily
              hypomorphic rather than true nulls. That constraint is recorded here without an evidence
              item: it is carried by mouse database phenotype annotations rather than by any statement
              in the WASHC4 disease literature, none of the cached references asserts it, and this repository
              has no MGI or IMPC ingest to quote from. It is stated as an unverified lead, not as a curated
              claim.'
          role: ancestor
      assertion_type: Variant
