        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: CCDC22-related attenuated 3C/Ritscher-Schinzel syndrome
        description: CCDC22 is a subunit of the CCC complex, which works together with the WASH complex
          on the same endosomal recycling step. Biallelic CCDC22 variants cause 3C/Ritscher-Schinzel syndrome,
          and a 2025 report describes an attenuated form without the cardiac or neuroanatomical malformations
          - a neurodevelopmental presentation that overlaps MRT43 more closely than the classical malformation
          syndrome does. The distinction is the gene and the complex, not the phenotype.
        distinguishing_features:
        - Caused by CCDC22, a CCC-complex subunit, not by WASHC4 in the WASH complex
        - The classical form carries cranio-cerebello-cardiac malformations absent from MRT43
        - The attenuated form is defined by the absence of those malformations, which is what makes it
          the harder differential
      selected_evidence:
        snippet: Here, we report a new CCDC22 missense mutation, p.E208K, that results in attenuated 3
          C syndrome, without cardiac or neuroanatomical abnormalities.
        supports: SUPPORT
