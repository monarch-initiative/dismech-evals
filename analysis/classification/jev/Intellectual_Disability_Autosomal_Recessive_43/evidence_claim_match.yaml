      assertion_type: Pathophysiology
      assertion:
        name: Loss of SWIP-Mediated Endosomal Membrane Anchoring
        biological_scale: MOLECULAR
        description: The textbook route by which the WASH complex reaches the endosomal membrane is the
          FAM21-VPS35 interaction with retromer. SWIP provides a second, retromer-INDEPENDENT anchor,
          binding phosphoinositides directly, with PI(3,5)P2 the species that matters for endosomal binding.
          Loss of SWIP therefore removes an anchor that retromer cannot substitute for. This is a deliberate
          qualification of the common shorthand that WASH acts only downstream of retromer.
        molecular_functions:
        - preferred_term: phosphatidylinositol-3,5-bisphosphate binding
          term:
            id: GO:0080025
            label: phosphatidylinositol-3,5-bisphosphate binding
        cellular_components:
        - preferred_term: endosome
          term:
            id: GO:0005768
            label: endosome
        notes: Cell-biological work in cultured cells on the SWIP protein, not on patient material. It
          is included because it is about WASHC4/SWIP itself; the disease-level consequence is inferred,
          and the downstream edges carry their own evidence.
      selected_evidence:
        snippet: The retromer-independent membrane anchor is directly mediated by the subunit SWIP.
        supports: SUPPORT
