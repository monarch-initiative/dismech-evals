  2b6b45cd6537ed6156b86db81d702c9cb1dc7ba63aa686a4578567ced1375bde:
    claim:
      about:
        disease:
          name: Intellectual Disability, Autosomal Recessive 43
          disease_term:
            preferred_term: intellectual disability, autosomal recessive 43
            term:
              id: MONDO:0014354
              label: intellectual disability, autosomal recessive 43
        context: []
      assertion_type: Genetic
      assertion:
        name: WASHC4
        gene_term:
          preferred_term: WASHC4
          term:
            id: hgnc:29174
            label: WASHC4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        frequency: The only gene known to cause MRT43; all reported families carry biallelic WASHC4 variants.
        notes: 'Formerly KIAA1033; the protein is widely called SWIP (Strumpellin and WASH interacting
          protein). Reported disease alleles are the homozygous missense c.3056C>G p.(Pro1019Arg) in the
          founding Omani family, the compound heterozygous pairs p.(Gln442*)/p.(Asp1048Gly) and p.(Lys1079Arg)/p.(His503Arg),
          and a further homozygous variant in the 2022 sibship. Both truncating and missense alleles occur,
          and the functionally characterised missense allele behaves as a loss of function by destabilising
          the complex rather than by any gain of activity.

          Complete Washc4 knockout in mouse is reported by MGI and IMPC to cause early embryonic phenotypes
          consistent with embryonic lethality, which would mean the human disease alleles are necessarily
          hypomorphic rather than true nulls. That constraint is recorded here without an evidence item:
          it is carried by mouse database phenotype annotations rather than by any statement in the WASHC4
          disease literature, none of the cached references asserts it, and this repository has no MGI
          or IMPC ingest to quote from. It is stated as an unverified lead, not as a curated claim.'
        variants:
        - name: c.3056C>G p.(Pro1019Arg)
          type: missense
          description: The founding allele, homozygous in the consanguineous Omani pedigree. It is the
            only WASHC4 disease allele that has been functionally characterised and modelled in an animal;
            it destabilises the WASH complex rather than abolishing the protein.
        - name: p.(Gln442*) / p.(Asp1048Gly)
          type: compound heterozygous stop-gain and missense
          description: Compound heterozygous pair in the two sisters of the 2020 report, one allele inherited
            from each parent.
        - name: p.(Lys1079Arg) / p.(His503Arg)
          type: compound heterozygous missense
          description: Compound heterozygous missense pair in the third patient of the 2020 report, a
            34-year-old with mild intellectual disability, short stature and microcephaly.
        - name: Unnamed homozygous WASHC4 variant (2022 sibship)
          description: A homozygous WASHC4 variant in the two siblings reported in 2022. The abstract
            states that the variant is homozygous but does not give its nucleotide or protein change,
            and the full text is not in the reference cache, so no allele designation is asserted here.
      selected_evidence:
        snippet: a member of the recently discovered WASH complex, which is involved in actin polymerization
          and multiple endosomal transport processes.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
