  51ec026620fcb8060c6acc1a8b1e4f473c98042edc6e5b61d0e8af71a9a91316:
    claim:
      about:
        disease:
          name: Intellectual Disability X-linked 100
          disease_term:
            preferred_term: intellectual disability, X-linked 100
            term:
              id: MONDO:0010488
              label: intellectual disability, X-linked 100
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Kif4 R728Q knock-in mouse
        species: Mouse
        genotype: Kif4 Mut/Y, CRISPR/Cas9 knock-in of the patient R728Q substitution
        publication: PMID:36482480
        description: The only mouse carrying a KIF4A patient allele. Built by CRISPR/Cas9 with homology-directed
          repair at the mouse exon corresponding to human KIF4A exon 20, it reproduces the substitution
          rather than deleting the gene. Hemizygous mutant males have mild developmental delay and a lowered
          seizure threshold, with aberrant dendrite and spine morphology in hippocampal pyramidal neurons
          traced to the PARP1-TrkB-KCC2 chain. NAD supplementation rescues the seizure phenotype. The
          line also shows raised embryonic mortality.
        genes:
        - preferred_term: KIF4A
          term:
            id: hgnc:13339
            label: KIF4A
        modeled_mechanisms:
        - target: PARP1-TrkB-KCC2 Signalling Disruption
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The system in which this entire signalling arm was defined, and the only one with
            a pharmacological test of it - NAD, which activates PARP1, rescues the seizure phenotype,
            which is what makes the PARP1 step causal rather than correlative.
          limitations: The mouse gene is Kif4, which has no paralogue on the mouse X and shares about
            85 percent of its amino acid sequence with human KIF4A, so the coiled-coil context of the
            substitution is similar but not identical. More importantly the allele modelled is one patient's
            missense change out of an allelic series that is mostly splice and missense variants read
            as loss of function; a substitution that strengthens PARP1 binding is not obviously representative
            of alleles that reduce the protein. Nothing in this chain has been measured in a human neuron.
          readouts:
          - name: Dendrite and spine morphology of hippocampal pyramidal neurons
            target: PARP1-TrkB-KCC2 Signalling Disruption
            direction: ALTERED
            interpretation: The structural output of the signalling chain, and the level at which the
              synaptic model becomes visible.
          - name: Seizure threshold after NAD supplementation
            target: PARP1-TrkB-KCC2 Signalling Disruption
            direction: RESTORED
            interpretation: Restoring PARP1 activity pharmacologically reverses the seizure phenotype,
              which establishes the direction of the lesion as reduced rather than increased PARP1 activity.
        - target: Seizures and Lowered Seizure Threshold
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The mouse is seizure-prone rather than epileptic, so it models susceptibility rather
            than the disease trait.
          limitations: The human carrying this allele had intractable epileptic spasms from infancy; the
            mouse has a lowered threshold on provocation and mild developmental delay. That is a substantial
            difference in severity, and it means the model cannot be used to argue about seizure control
            in patients.
          readouts:
          - name: Seizure threshold
            target: Seizures and Lowered Seizure Threshold
            direction: DECREASED
            interpretation: Susceptibility to provoked seizures is raised, which is the trait the model
              expresses in place of spontaneous epilepsy.
      selected_evidence:
        snippet: Therefore, these findings indicate that KIF4 is engaged in a fundamental mechanism regulating
          seizure susceptibility and could be a potential target for epilepsy treatment.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
