  a1917b10f4dbfd9785ec263a0c50da7fb5ac1acdcdb602287bd149f9cd69b4c0:
    claim:
      about:
        disease:
          name: Intellectual Disability X-linked 100
          disease_term:
            preferred_term: intellectual disability, X-linked 100
            term:
              id: MONDO:0010488
              label: intellectual disability, X-linked 100
        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked recessive
        description: 'Hemizygous KIF4A variants at Xq13.1. Affected individuals are male; in the founding
          family four affected males segregated one splice-disrupting allele, and across the largest published
          series ten of eleven probands inherited the variant from an unaffected mother. One variant arose
          de novo. Carrier mothers were reported without obvious differences in developmental milestones,
          schooling or occupation.

          The carrier data cut both ways and are worth reading carefully. Unaffected transmitting mothers
          are what X-linked recessive inheritance predicts, but they are also what would be seen if a
          variant were simply not causal, which is part of why the gene-disease relationship is rated
          Limited rather than Definitive.'
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
      selected_evidence:
        snippet: Four males from a single family with a disruptive mutation in the X-linked KIF4A (c.1489-8_1490delins10;
          p.?- exon skipping) showed mild to moderate ID and epilepsy.
        supports: SUPPORT
