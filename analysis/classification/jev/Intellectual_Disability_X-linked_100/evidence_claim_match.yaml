  2e47113447e31e52d11ab4d25dc4b2f714d554c00c18953b34c2a37d9cac84e4:
    claim:
      about:
        disease:
          name: Intellectual Disability X-linked 100
          disease_term:
            preferred_term: intellectual disability, X-linked 100
            term:
              id: MONDO:0010488
              label: intellectual disability, X-linked 100
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing in a male with unexplained intellectual disability
        description: 'MRX100 has no feature that identifies it clinically. The founding family was found
          by next-generation sequencing in an intellectual disability cohort; the largest series was assembled
          genotype-first through GeneMatcher after diagnostic exome sequencing; the 2025 Chinese case
          was found by whole-exome sequencing with Sanger confirmation and parental segregation.

          The interpretive problem is the hard part. Most reported alleles are missense, KIF4A is rated
          Limited, and maternal segregation from an unaffected carrier is both what the inheritance model
          predicts and what a benign variant would show. A KIF4A variant of uncertain significance in
          a male with intellectual disability is genuinely uncertain, and the 2025 report is a worked
          example: the variant it reports is ACMG-uncertain, absent from dbSNP, OMIM, HGMD, ClinVar and
          gnomAD, and carried by the unaffected mother and sister.'
      selected_evidence:
        snippet: For formal reasons, all missense variants identified had to be classified VUS using strict
          ACMG criteria.
        supports: SUPPORT
