        name: Other kinesinopathies with brain malformation
        description: KIF7, KIF11 and KIF14 variants cause structural brain malformation syndromes - acrocallosal
          and Joubert syndrome 12 and hydrolethalus syndrome 2 for KIF7, Meckel syndrome 12 and primary
          microcephaly for KIF14 - and the anomaly patterns overlap what has been reported for KIF4A.
          A patient with microcephaly, callosal dysgenesis and cerebellar anomalies is not distinguishable
          from these on imaging.
        distinguishing_features:
        - 'Inheritance is the first discriminator: KIF4A is X-linked and affects males, while KIF7 and
          KIF14 disease is autosomal recessive. Beyond that it is sequencing. The KIF7 and KIF14 disorders
          also carry a ciliopathy signature - polydactyly, molar tooth sign, cystic kidneys as part of
          a recognised syndrome - that has not been described as a coherent pattern in KIF4A patients,
          though cystic dysplastic kidneys were reported in one KIF4A sibling pair.'
      selected_evidence:
        snippet: 'Anomaly patterns reminiscent of ciliopathies have been described particularly for pathogenic
          variants in KIF7 (Acrocallosal syndrome/Joubert syndrome 12, OMIM #200990; Hydrolethalus syndrome
          2, OMIM #614120; Putoux et al., 2011) and KIF14 (Meckel syndrome 12, OMIM #616258; primary Microcephaly,
          OMIM# 617914; Filges et al., 2013; Moawia et al., 2017).'
        supports: SUPPORT
