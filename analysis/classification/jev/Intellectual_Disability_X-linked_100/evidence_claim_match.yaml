        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Chromosome Condensation and Midzone Assembly
        description: 'The mitotic arm, and the better-established biochemistry of the two. KIF4A compacts
          mitotic chromosomes laterally in concert with condensin, and it translocates PRC1 to organise
          the central spindle and the midzone at cytokinesis. Reducing KIF4A function should therefore
          perturb division, and in a tissue whose size and folding depend on a precisely timed progenitor
          expansion that is a plausible route to microcephaly and cortical malformation.

          What is missing is any demonstration that it happens in a KIF4A-variant brain. The condensation
          and midzone work is cell-biological and was not done in neural progenitors or in a disease model,
          and no KIF4A model has been shown to have a progenitor proliferation defect. The downstream
          edge is drawn with unknown intermediates for that reason.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: mitotic chromosome condensation
          term:
            id: GO:0030261
            label: chromosome condensation
          modifier: DECREASED
        - preferred_term: mitotic cytokinesis
          term:
            id: GO:0000281
            label: mitotic cytokinesis
          modifier: DECREASED
      selected_evidence:
        snippet: chromokinesin KIF4 cooperated in a parallel pathway with condensin complexes to promote
          the lateral compaction of chromatid arms
        supports: SUPPORT
