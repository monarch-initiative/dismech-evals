          name: Intellectual Disability X-linked 100
          disease_term:
            preferred_term: intellectual disability, X-linked 100
            term:
              id: MONDO:0010488
              label: intellectual disability, X-linked 100
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: kif4a_synaptic_ei_imbalance
        hypothesis_label: Synaptic excitation-inhibition imbalance from impaired KIF4A function in postmitotic
          neurons
        status: CANONICAL
        description: 'The model the field works from. KIF4A is a neuronal motor with a PARP1-binding tail,
          and the phenotype follows from what happens to a differentiated neuron that has lost normal
          KIF4A function: the balance between excitatory and inhibitory synaptic transmission shifts,
          dendrites and spines are malformed, chloride handling through KCC2 is disturbed, and the seizure
          threshold falls. It accounts for the two features present in essentially every reported case
          - intellectual disability and epilepsy - and it is the only arm with a direct experimental manipulation
          behind it in more than one system.

          Its weakness is that both experimental systems are rodent. The rat knockdown is an acute loss
          of the whole protein, and the mouse carries one patient substitution; nothing has been measured
          in human neurons carrying a KIF4A variant.'
      selected_evidence:
        snippet: Knock-down of Kif4a in rat primary hippocampal neurons altered the balance between excitatory
          and inhibitory synaptic transmission
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
