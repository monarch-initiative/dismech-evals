            preferred_term: intellectual disability, X-linked 100
            term:
              id: MONDO:0010488
              label: intellectual disability, X-linked 100
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: kif4a_mitotic_neurogenesis
        hypothesis_label: Impaired mitotic chromosome condensation and midzone assembly in neural progenitors
        status: EMERGING
        description: 'The alternative reading of the same gene. KIF4A''s better-characterised biochemistry
          is mitotic: it compacts chromosomes laterally with condensin and it translocates PRC1 to organise
          the central spindle and midzone. A proliferation defect in neural progenitors would explain
          the part of the phenotype the synaptic model does not touch - microcephaly, perisylvian polymicrogyria,
          hippocampal malrotation and dysplasia, callosal dysgenesis, hydrocephalus - and would put KIF4A
          alongside the other kinesinopathies, KIF7, KIF11 and KIF14, in which structural brain malformation
          is the presenting problem.

          It is EMERGING because the human end of it is entirely observational. Polymicrogyria has been
          reported with a KIF4A variant and a hydrocephalic fetus had 12 percent of normal brain KIF4A
          mRNA, but no KIF4A model has been shown to have a progenitor proliferation defect, and the reported
          brain malformations have not been shown to arise from one.'
      selected_evidence:
        snippet: Furthermore, KIF4A is responsible for the translocation of the cytokinesis protein PRC1,
          thus participating in the organization of central spindle and midzone formation during mitosis
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34346154
      reference_title: Expanding the KIF4A-associated phenotype.
      evidence_source: OTHER
      explanation: The mitotic function the hypothesis rests on. Graded OTHER because the sentence is
        the review's summary of prior cell biology, not a result the paper reports.
