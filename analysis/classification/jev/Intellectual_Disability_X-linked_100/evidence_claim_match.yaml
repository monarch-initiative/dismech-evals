  b147b72bae1ea99b9118889c5b037d16f25776743c2db425cea62af4acb39ee5:
    claim:
      about:
        disease:
          name: Intellectual Disability X-linked 100
          disease_term:
            preferred_term: intellectual disability, X-linked 100
            term:
              id: MONDO:0010488
              label: intellectual disability, X-linked 100
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kif4a_parp1_opposite_directions
        kind: KNOWLEDGE_GAP
        prompt: Loss of KIF4A derepresses PARP1, while the R728Q substitution binds PARP1 harder and impairs
          its activity. If both allele classes cause overlapping intellectual disability and epilepsy,
          is PARP1 dysregulation in either direction sufficient, or is only one of the two routes actually
          causal?
        attaches_to:
        - pathophysiology#Reduced KIF4A Motor Function
        - pathophysiology#Increased KIF4-PARP1 Binding
        - pathophysiology#PARP1-TrkB-KCC2 Signalling Disruption
        rationale: 'The KIF4-PARP1 relationship is well characterised and it is inhibitory: KIF4''s C-terminal
          module suppresses PARP-1, and depolarisation releases the suppression through CaMKII so that
          PARP-1 activity rises and supports neuronal survival. On that biochemistry, losing KIF4A should
          raise PARP1 activity. The R728Q substitution does the opposite - it lengthens the coiled coil,
          strengthens binding to PARP1, and lowers PARP1 activity, which is why supplementing NAD rescues
          those mice.

          So the two reported allele classes should move PARP1 in opposite directions, and both are reported
          with intellectual disability and epilepsy. Three readings are open and the literature does not
          choose between them. PARP1 activity may need to sit in a narrow band, with excursions in either
          direction damaging - which is common enough for signalling enzymes but has not been shown for
          this one in neurons. Or the loss-of-function alleles may cause disease through something other
          than PARP1, most obviously the mitotic route, with the PARP1 chain belonging only to R728Q.
          Or the direction assigned to one of the two classes may be wrong, since PARP1 activity has never
          actually been measured in a neuron carrying a loss-of-function KIF4A allele.

          This matters beyond tidiness because it decides whether NAD or a PARP1 modulator could be relevant
          to anyone but R728Q carriers. A therapy that raises PARP1 activity would be expected to help
          one allele class and harm the other.'
        proposed_experiments:
        - experiment_id: exp_mrx100_parp1_activity_by_allele_class
          name: PARP1 activity in neurons carrying loss-of-function versus R728Q KIF4A alleles
          description: Measure PARP1 activity, by poly-ADP-ribose immunoblot and an activity assay, in
            iPSC-derived cortical neurons from a carrier of a splice-disrupting KIF4A allele, from an
            R728Q carrier, and from isogenic controls, at baseline and after depolarisation. Read out
            TrkB and KCC2 levels and intracellular chloride in the same cells, and test whether NAD supplementation
            moves each genotype toward or away from control.
          would_support:
          - pathophysiology#PARP1-TrkB-KCC2 Signalling Disruption
          supporting_outcome:
          - Both allele classes displace PARP1 activity from the control range, in opposite directions,
            and both show TrkB-KCC2 abnormality - which would make PARP1 dysregulation per se the shared
            lesion and put the whole allelic series on this node.
          would_refute:
          - pathophysiology#PARP1-TrkB-KCC2 Signalling Disruption
          refuting_outcome:
          - Loss-of-function neurons have normal PARP1 activity and normal TrkB-KCC2 levels while R728Q
            neurons are abnormal - which would confine this node to R728Q and leave the loss-of-function
            alleles needing a different mechanism, most likely the mitotic one.
      selected_evidence:
        snippet: When neurons are stimulated by membrane depolarization, calcium signaling mediated by
          CaMKII induces dissociation of KIF4 from PARP-1, resulting in upregulation of PARP-1 activity,
          which supports neuron survival.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16630823
      reference_title: KIF4 motor regulates activity-dependent neuronal survival by suppressing PARP-1
        enzymatic activity.
      evidence_source: IN_VITRO
      explanation: That releasing KIF4 from PARP-1 raises PARP-1 activity, which is the physiological
        version of what a loss-of-function allele would do constitutively.
