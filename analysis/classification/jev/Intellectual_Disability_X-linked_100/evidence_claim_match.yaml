        description: 'A second, mechanistically distinct trigger, and the only KIF4A allele with a worked-out
          molecular consequence. The R728Q substitution sits in the coiled-coil domain, raises the predicted
          coiling probability at that position, lengthens the coil, and strengthens KIF4''s affinity for
          PARP1. Because KIF4''s C-terminal module normally suppresses PARP1, binding it harder impairs
          PARP1 activity - which is why supplementing NAD, a PARP1 activator, rescues the mouse.

          This is not the same lesion as reduced motor function. It is a change in a protein-protein interaction
          that runs PARP1 in the opposite direction from what simple KIF4A loss would do, and it is the
          substance of the knowledge gap recorded below. functional_impact_category is HYPERMORPHIC rather
          than the LOSS_OF_FUNCTION used on the other trigger node, because KIF4''s normal job at this
          interface is to suppress PARP1 and the variant does more of it - not because motor activity
          is increased, which was not measured. The patient carrying it had global developmental delay,
          severe intellectual disability and intractable seizures with a normal brain MRI.'
