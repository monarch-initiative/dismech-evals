      assertion_type: Pathophysiology
      assertion:
        name: Seizures and Lowered Seizure Threshold
        description: 'Epilepsy was present in all four males of the founding family, in the four brothers
          with polymicrogyria, and in the patient carrying R728Q, who had intractable seizures with frequent
          epileptic spasms on video EEG. The knock-in mouse reproduces the trait as a lowered seizure
          threshold rather than spontaneous epilepsy.

          It is not universal. The 2025 Chinese case had no seizures and no febrile convulsions, and the
          Japanese patient with polymicrogyria in the 2021 series had no epileptic seizures and a normal
          EEG at two years. Both the synaptic and the malformation routes lead here, which is why the
          node has two upstream parents.'
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Four males from a single family with a disruptive mutation in the X-linked KIF4A (c.1489-8_1490delins10;
          p.?- exon skipping) showed mild to moderate ID and epilepsy.
        supports: SUPPORT
