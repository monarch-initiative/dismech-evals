              label: intellectual disability, X-linked 100
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: L1CAM-related X-linked hydrocephalus
        description: 'The closest differential for the malformation end of the KIF4A spectrum, and the
          reason a KIF4A variant in a male fetus with hydrocephalus is not self-evidently the answer.
          L1CAM variants cause X-linked isolated and syndromic hydrocephalus with aqueductal stenosis,
          and the KIF4A patients reported with hydrocephalus, hydranencephaly and ventriculomegaly - one
          with confirmed aqueductal stenosis - were explicitly described as resembling that phenotype.

          The overlap is not coincidental, which is what makes the differential mechanistically interesting
          rather than merely clinical: KIF4A transports L1CAM and belongs to the L1CAM recycling pathway,
          so the two genes plausibly converge. This is also the competing route to the malformation node
          recorded in the mitotic knowledge gap.'
        distinguishing_features:
        - 'Sequencing, not phenotype. Neither the imaging nor the inheritance pattern separates them:
          both are X-linked, both give aqueductal stenosis and severe ventriculomegaly in males. L1CAM-related
          disease is the far better established of the two, with a Definitive gene-disease relationship,
          whereas KIF4A is rated Limited - so an L1CAM variant should be excluded before a KIF4A variant
          is called causal in this presentation.'
      selected_evidence:
        snippet: KIF4A is a member of the L1CAM recycling pathway and variants in L1CAM are well known
          to cause X‐linked isolated and syndromic hydrocephalus
        supports: SUPPORT
