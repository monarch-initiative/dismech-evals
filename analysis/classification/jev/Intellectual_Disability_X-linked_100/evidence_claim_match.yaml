          name: Intellectual Disability X-linked 100
          disease_term:
            preferred_term: intellectual disability, X-linked 100
            term:
              id: MONDO:0010488
              label: intellectual disability, X-linked 100
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kif4a_mitotic_arm_unproven
        kind: KNOWLEDGE_GAP
        prompt: Do KIF4A variants cause the reported cortical and midline brain malformations through
          a neural progenitor proliferation defect, or by some other route?
        attaches_to:
        - pathophysiology#Impaired Chromosome Condensation and Midzone Assembly
        - pathophysiology#Cortical and Midline Brain Malformation
        rationale: 'The mitotic arm of this entry is built entirely from cell biology plus clinical observation,
          with nothing joining them. KIF4A demonstrably compacts mitotic chromosomes with condensin and
          translocates PRC1 to build the midzone; patients demonstrably have polymicrogyria, microcephaly,
          hippocampal and callosal malformation and hydrocephalus. What is missing is any experiment showing
          a proliferation or division defect in a neural progenitor carrying a KIF4A variant. The knock-in
          mouse was not examined for one, and the only human molecular datum is a transcript measurement
          in a malformed fetal brain, which establishes depletion but not a mechanism.

          The alternative routes are not exotic. KIF4A transports the cell adhesion molecule L1CAM, and
          L1CAM variants cause X-linked hydrocephalus with aqueductal stenosis, so a transport defect
          could produce the same malformations without any mitotic involvement. Migration rather than
          proliferation is also a candidate, since periventricular nodular heterotopia was reported alongside
          the polymicrogyria.

          Until one of these is tested, the edge from the mitotic node to the malformation node is drawn
          with unknown intermediates, and the hypothesis group is EMERGING rather than ALTERNATIVE.'
        proposed_experiments:
        - experiment_id: exp_mrx100_progenitor_division_in_organoids
          name: Neural progenitor division in KIF4A-variant cortical organoids
          description: Generate dorsal forebrain organoids from iPSCs carrying a loss-of-function KIF4A
            allele and isogenic corrected controls, and quantify mitotic index, spindle and midzone morphology,
            chromosome condensation, cytokinesis failure and binucleation in apical and basal progenitors,
            together with ventricular zone thickness and cortical plate organisation over time. Include
            an L1CAM-transport readout in the same material so the two candidate routes are tested side
            by side rather than sequentially.
          would_support:
          - pathophysiology#Impaired Chromosome Condensation and Midzone Assembly
          supporting_outcome:
          - Variant organoids show impaired condensation, midzone defects or cytokinesis failure in progenitors
            with a reduced progenitor pool and disorganised cortical plate - which would convert the mitotic
            arm from EMERGING to a demonstrated mechanism and explain the malformation end of the spectrum.
          would_refute:
          - pathophysiology#Impaired Chromosome Condensation and Midzone Assembly
          refuting_outcome:
          - Progenitor division is normal while L1CAM transport or neuronal migration is impaired - which
            would move the malformation node onto a transport or migration mechanism and remove the mitotic
            arm from the human disease.
      selected_evidence:
        snippet: qPCR confirmed a significant reduction of KIF4A mRNA in brain tissue of the affected
          fetus (12%) compared to FFPE brain tissue of an age‐matched control.
        supports: SUPPORT
        directness: INDIRECT
