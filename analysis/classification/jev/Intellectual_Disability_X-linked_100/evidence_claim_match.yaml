        context: []
      assertion_type: Genetic
      assertion:
        name: KIF4A
        notes: 'KIF4A at Xq13.1 encodes a kinesin-4 family chromokinesin with an N-terminal motor domain
          (roughly residues 9-336), a long coiled coil (roughly 350-999), and a C-terminal globular tail
          carrying a nuclear localisation signal and the PARP1-binding module. The PRC1 interaction region
          overlaps the coil and tail. Reported disease alleles are distributed across all of these.

          ClinGen''s Intellectual Disability and Autism expert panel rates the gene-disease relationship
          Limited, and in the same curation records a lumping and splitting decision: two brothers with
          KIF4A variants who had taurodontism, microdontia and dens invaginatus without developmental
          delay were assigned to a separate disease entity and excluded from the neurodevelopmental curation.
          That split is respected here, which is why no dental phenotype appears in this entry.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: KIF4A
          term:
            id: hgnc:13339
            label: KIF4A
      selected_evidence:
        snippet: Per criteria outlined by the ClinGen Lumping and Splitting Working Group, we determined
          two distinct disease entities, as KIF4A was also reported in relation to the disease taurodontism,
          microdontia, and dens invaginatus.
        supports: SUPPORT
