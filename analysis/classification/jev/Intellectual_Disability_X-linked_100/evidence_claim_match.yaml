              label: intellectual disability, X-linked 100
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PARP1-TrkB-KCC2 Signalling Disruption
        description: 'The signalling chain the R728Q mouse traced. Impaired PARP1 activity alters TrkB
          and KCC2 expression; KCC2 is the neuronal potassium-chloride cotransporter that keeps intracellular
          chloride low, so lowering it raises intracellular chloride and weakens GABAergic inhibition.
          The chain was tested in the direction that matters: supplementing NAD, which activates PARP1,
          modulates TrkB-KCC2 and rescues the mouse''s seizure susceptibility.

          KIF4''s control of PARP1 was established long before the disease work. In juvenile neurons,
          KIF4''s C-terminal domain suppresses PARP-1, depolarisation releases it through CaMKII, and
          the resulting PARP-1 activity supports neuronal survival - a normal physiology that a variant
          altering the KIF4-PARP1 interface would be expected to disturb.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: hippocampal pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        molecular_functions:
        - preferred_term: PARP1 poly-ADP-ribosyltransferase activity
          term:
            id: GO:0003950
            label: NAD+ poly-ADP-ribosyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: neuronal chloride extrusion through KCC2
          term:
            id: GO:1902476
            label: chloride transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: Further experiments revealed that the KIF4 mutation caused aberrant morphology in dendrites
          and spines of hippocampal pyramidal neurons through PARP1-TrkB-KCC2 pathway.
        supports: SUPPORT
