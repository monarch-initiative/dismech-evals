              id: MONDO:0010488
              label: intellectual disability, X-linked 100
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortical and Midline Brain Malformation
        description: 'The structural end of the phenotypic spectrum: bilateral perisylvian and perirolandic
          polymicrogyria, microcephaly, hippocampal malrotation and dysplasia, corpus callosum dysgenesis,
          cerebellar heterotopia and asymmetric aplasia, and at the severe end hydrocephalus, ventriculomegaly
          and hydranencephaly. In four related males with a single KIF4A variant, all four had bilateral
          polymicrogyria.

          Two things keep this node honest. First, the mechanism above it is not demonstrated - the edge
          from the mitotic node carries unknown intermediates because no proliferation defect has been
          shown in any KIF4A model. Second, a large part of this phenotype sits outside MONDO:0010488,
          which names a non-syndromic intellectual disability; it is curated here because these are the
          same alleles in the same gene, and separating them would leave a reader thinking KIF4A causes
          only isolated intellectual disability.'
        biological_scale: TISSUE
      selected_evidence:
        snippet: All had bilateral perisylvian and perirolandic polymicrogyria, while some also had malformations
          of the hippocampus (malrotation and dysplasia), cerebellum (heterotopias and asymmetric aplasia),
          corpus callosum dysgenesis, and brainstem asymmetric dysplasia.
        supports: SUPPORT
