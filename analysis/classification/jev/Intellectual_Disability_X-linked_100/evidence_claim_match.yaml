              label: intellectual disability, X-linked 100
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced KIF4A Motor Function
        description: 'The trigger for most reported cases. The founding allele, c.1489-8_1490delins10,
          disrupts the acceptor splice site of exon 15 and causes exon skipping within the coiled-coil
          domain; a second splice allele, c.1674+1G>A, sits in intron 15. In a fetus carrying the missense
          p.Val699Glu, brain KIF4A mRNA was 12 percent of an age-matched control, which is the only direct
          measurement of allele consequence in human tissue and is what makes loss of function the default
          reading. ClinGen''s expert panel reaches the same conclusion.

          Most other reported alleles are missense with deleterious in silico predictions and no functional
          assay, so "reduced function" for those is an inference from prediction plus domain location
          rather than a measurement. The 2021 series says so explicitly.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: KIF4A
          term:
            id: hgnc:13339
            label: KIF4A
        molecular_functions:
        - preferred_term: microtubule motor activity
          term:
            id: GO:0003777
            label: microtubule motor activity
          modifier: DECREASED
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          allele_type: SPLICE_SITE
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
      selected_evidence:
        snippet: Four males from a single family with a disruptive mutation in the X-linked KIF4A (c.1489-8_1490delins10;
          p.?- exon skipping) showed mild to moderate ID and epilepsy.
        supports: SUPPORT
