      assertion:
        name: X-linked recessive inheritance
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
        description: 'Families with an inherited hypomorphic missense allele segregate in an apparently
          X-linked recessive pattern: hemizygous males are affected while the transmitting heterozygous
          mother is unaffected or only mildly affected. This is not a separate disease but the same locus
          seen through a residual-function allele. A carrier mother transmits the allele to half her pregnancies;
          sons who inherit it are affected, and daughters who inherit it become heterozygotes who are
          not expected to manifest a neurodevelopmental phenotype.'
      selected_evidence:
        snippet: Males who inherit the pathogenic variant will be affected; females who inherit the pathogenic
          variant will be heterozygotes and are not expected to manifest a neurodevelopmental phenotype
        supports: SUPPORT
