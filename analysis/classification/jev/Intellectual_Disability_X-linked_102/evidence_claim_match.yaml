              label: intellectual disability, X-linked 102
        context: []
      assertion_type: Genetic
      assertion:
        name: DDX3X
        gene_term:
          preferred_term: DDX3X
          term:
            id: hgnc:2745
            label: DDX3X
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: DDX3X (Xp11.4) encodes a DEAD-box ATP-dependent RNA helicase. The disorder is germline;
          somatic DDX3X variants occur in medulloblastoma and several lymphoid malignancies and must not
          be used as evidence for the constitutional disorder. Reported germline classes are nonsense,
          frameshift, canonical and non-canonical splice, missense and in-frame indels in females, and
          missense or splice only in males. Recurrent male substitutions are p.(Arg351Gln) and p.(Arg488Cys);
          the inherited p.Arg79Lys allele lies outside the core helicase domain and is a demonstrated
          hypomorph.
        case_fractions:
        - population: Females with unexplained intellectual disability in diagnostic sequencing cohorts
          case_fraction_low: 1.0
          case_fraction_high: 3.0
          notes: This is a diagnostic yield within an ascertained cohort, not a population prevalence,
            and it is quoted consistently across independent series.
      selected_evidence:
        snippet: we present 35 unique deleterious de novo mutations in DDX3X identified by whole exome
          sequencing in 38 females with ID and various other features including hypotonia, movement disorders,
          behavior problems, corpus callosum hypoplasia, and epilepsy
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
