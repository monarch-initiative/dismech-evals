        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ddx3y_compensation_conflict
        kind: CONTROVERSY
        status: OPEN
        prompt: Does the Y-linked paralog DDX3Y compensate for DDX3X in the developing male brain?
        attaches_to:
        - pathophysiology#Hemizygous Partial Loss of DDX3X Function in Males
        - pathophysiology#Partial Escape from X-Chromosome Inactivation
        rationale: 'Two mouse studies reach opposite conclusions. The conditional neural-progenitor knockout
          reports that Ddx3y compensates for Ddx3x in the developing male neocortex, making the phenotype
          sexually dimorphic. The haploinsufficient mouse paper argues DDX3Y cannot compensate because
          it is translated only in spermatocytes. The answer matters: if DDX3Y compensates in the developing
          brain, it is a second reason - alongside escape from X-inactivation - that hemizygous males
          tolerate an allele that a female does not, and it changes how a hemizygous variant of uncertain
          significance in a male should be interpreted.'
        notes: Both statements are about mouse. Neither has been tested in human fetal cortex, which is
          where the question would have to be settled.
      selected_evidence:
        snippet: In addition, Ddx3x loss is sexually dimorphic, as its paralog, Ddx3y, compensates for
          Ddx3x in the developing male neocortex.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35762573
      reference_title: Aberrant cortical development is driven by impaired cell cycle and translational
        control in a DDX3X syndrome model.
      evidence_source: MODEL_ORGANISM
      explanation: The position that Ddx3y does compensate, demonstrated in conditional knockout neocortex.
