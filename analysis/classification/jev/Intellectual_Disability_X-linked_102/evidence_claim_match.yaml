          de novo status, which is central to interpreting a female heterozygote, and because the differential
          for unexplained developmental delay is broad. Chromosomal microarray detects DDX3X-containing
          deletions but misses the single-nucleotide and small indel variants that account for nearly
          all cases. There is no biochemical biomarker.
