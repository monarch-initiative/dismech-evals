        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ei_imbalance_human_translation
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Is the excitatory/inhibitory neuronal imbalance seen in ddx3x-deficient zebrafish present
          in human DDX3X-related neurodevelopmental disorder, and is the glutamatergic rescue translatable?
        attaches_to:
        - pathophysiology#Excitatory-Inhibitory Neuronal Differentiation Imbalance
        - pathophysiology#Reduced CREBBP mRNA Stability and Notch Signalling
        rationale: 'The zebrafish work supplies the only mechanistic route from DDX3X loss to a pharmacologically
          reversible phenotype: crebbp mRNA destabilisation, reduced Notch signalling, an excitatory/inhibitory
          differentiation imbalance, and partial behavioural rescue with L-glutamate or a glutamate receptor
          agonist. Every step of that chain is untested in human cells or tissue. The mismatch is substantive
          rather than routine because it is the only current candidate for a disease-modifying target,
          so the translational gap is what stands between a model result and a therapeutic hypothesis.
          Zebrafish forebrain development also lacks the mammalian cortical architecture in which the
          human phenotype arises.'
      selected_evidence:
        snippet: the supplementation of L-glutamate or glutamate receptor agonist ly404039 could partly
          rescue the adaptation and social deficits
        supports: SUPPORT
