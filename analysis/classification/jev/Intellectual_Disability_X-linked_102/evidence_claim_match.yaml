        - prevalence#Worldwide
        rationale: 'Every quantitative statement about how common this disorder is comes from diagnostic
          sequencing cohorts of already-ascertained intellectual disability, or from counts of diagnosed
          individuals. Neither supports a population rate. Ascertainment is additionally sex-biased, so
          even the observed sex ratio among diagnosed individuals cannot be read as the true one: males
          with hypomorphic alleles are under-recognised, and the male cohort''s median age at diagnosis
          was 8 years with a range extending to 47.'
