          term:
            id: HP:0001417
            label: X-linked inheritance
        description: DDX3X sits at Xp11.4 and the disorder is X-linked, but neither the dominant nor the
          recessive label alone describes it. Most recognised probands are females with a de novo heterozygous
          allele; a minority are hemizygous males with a missense or splice allele that is often maternally
          inherited from an unaffected or only mildly affected carrier.
      selected_evidence:
        snippet: Our data show that variants in DDX3X can cause an X-linked neurodevelopmental disorder
          in males, with unaffected or mildly affected carrier females.
        supports: SUPPORT
