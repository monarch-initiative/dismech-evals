              label: intellectual disability, X-linked 102
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Partial Escape from X-Chromosome Inactivation
        biological_scale: MOLECULAR
        description: DDX3X partially escapes X-chromosome inactivation, so both alleles are transcribed
          in a heterozygous female. The usual protection that functional mosaicism or wild-type-favouring
          skewing gives a female carrier of an X-linked allele therefore does not apply here, which is
          the structural reason the recognised patient population is female-biased rather than male-biased
          as it is for most X-linked intellectual disability genes.
        genes:
        - preferred_term: DDX3X
          term:
            id: hgnc:2745
            label: DDX3X
      selected_evidence:
        snippet: It was discovered that XCI in the mutant allele was insufficient to reverse the phenotype
          of DDX3X-related neurodevelopmental disorder.
        supports: SUPPORT
    origin:
