            publication: PMID:35762573
            description: A dosage series of Ddx3x loss restricted to neural progenitors, used with live
              imaging and in vivo ribosome profiling. It is the model that separates the cell-cycle and
              translational arms of the mechanism and that shows the male-specific Ddx3y contribution.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Altered Neural Progenitor Cell Cycle and Neurogenic Division
        relationship: RECAPITULATES
        fidelity: HIGH
        description: Live imaging of progenitors demonstrates altered cell-cycle duration and a shifted
          balance of neurogenic divisions, and ribosome profiling identifies the DDX3X-dependent translated
          transcripts underlying it.
        limitations: Mouse corticogenesis lacks the expanded human outer subventricular zone and outer
          radial glia, so the quantitative relationship between progenitor behaviour and cortical output
          may not transfer. Conditional deletion also removes Ddx3x more completely than any human allele
          does.
        readouts:
        - name: Progenitor cell-cycle duration and neurogenic division fraction
          target: Altered Neural Progenitor Cell Cycle and Neurogenic Division
          direction: ALTERED
          interpretation: Both parameters shift on live imaging, and together they set neuronal output.
      selected_evidence:
        snippet: Here, using a mouse model of Ddx3x loss-of-function we demonstrate that DDX3X directs
          translational and cell cycle control of neural progenitors, which underlies precise corticogenesis.
        supports: SUPPORT
