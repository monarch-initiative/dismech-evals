        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brwd3_no_mammalian_model
        kind: HUMAN_MODEL_MISMATCH
        prompt: Do the Drosophila BRWD3 mechanisms (KDM5 degradation, restraint of H3.3 deposition, JAK/STAT
          regulation) operate in human or mouse neurons, and does any of them account for the human phenotype?
        attaches_to:
        - pathophysiology#KDM5 Stabilization and H3K4 Methylation Imbalance
        - pathophysiology#Excess Histone H3.3 Deposition
        - pathophysiology#Reduced JAK-STAT Pathway Signaling
        - animal_models#Drosophila melanogaster
        rationale: Every mechanistic node below BRWD3 loss comes from Drosophila mutants or Drosophila
          cultured cells. The fly null is a developmental lethal with eye and dendrite phenotypes, whereas
          hemizygous human loss is viable and causes mild-to-moderate intellectual disability with overgrowth,
          so the two may not share the limiting pathway. A mammalian Brwd3 knockout, or patient iPSC neurons
          measuring KDM5 levels, H3K4me3, H3.3 occupancy and dendrite morphology, would test whether any
          of the fly mechanisms carries over.
        proposed_experiments:
        - experiment_id: brwd3_mammalian_knockout
          name: Mammalian Brwd3 knockout phenotyping
          description: Generate a hemizygous Brwd3 null mouse and measure brain and body growth, adiposity,
            learning and behaviour, together with neuronal KDM5 protein levels, H3K4me3 and H3.3 occupancy,
            and dendrite morphology.
          decision_criterion: Macrocephaly or adiposity with altered KDM5, H3K4me3 or H3.3 in neurons
            would support the fly-derived nodes; normal chromatin readouts despite a phenotype would refute
            them as the limiting mechanism.
          would_support:
          - pathophysiology#KDM5 Stabilization and H3K4 Methylation Imbalance
          - pathophysiology#Excess Histone H3.3 Deposition
        - experiment_id: brwd3_patient_ipsc_neurons
          name: Patient iPSC-derived neuron chromatin and morphology study
          description: Derive cortical neurons from iPSCs of hemizygous BRWD3-null patients and isogenic
            corrected controls; measure KDM5 protein stability, H3K4me3 and H3K4me1 profiles, H3.3 deposition,
            transcriptome, and dendrite arborization.
          decision_criterion: KDM5 stabilisation or H3.3 excess in patient neurons that is reversed by
            correction would support carry-over of the fly mechanisms to human neurons.
          would_support:
          - pathophysiology#KDM5 Stabilization and H3K4 Methylation Imbalance
          - pathophysiology#Excess Histone H3.3 Deposition
          - pathophysiology#Impaired Dendrite Morphogenesis
      selected_evidence:
        snippet: Relatively little is known about the biology of the BRWD3 phenotype, and to our knowledge,
          there have been no reports of knockout models or functional studies in mammalian models.
        supports: SUPPORT
