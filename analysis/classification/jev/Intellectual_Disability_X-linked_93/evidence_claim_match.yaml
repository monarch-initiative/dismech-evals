  e401edb2f41cfb6dc941c09f27692ed60eba4f7f0f645350ddaa6a87491d7b92:
    claim:
      about:
        disease:
          name: Intellectual Disability X-linked 93
          disease_term:
            preferred_term: intellectual disability, X-linked 93
            term:
              id: MONDO:0010393
              label: intellectual disability, X-linked 93
        context: []
      assertion_type: Genetic
      assertion:
        name: BRWD3
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: BRWD3
          term:
            id: hgnc:17342
            label: BRWD3
        notes: 'BRWD3 (bromodomain and WD repeat domain containing 3) maps to Xq21.1 and encodes an 1802-residue
          protein with eight WD40 repeats and two bromodomains. All disease alleles in the largest series
          are null (stop-gain, frameshift, canonical splice) or partial gene deletions, and none is in
          gnomAD. The founding screen found truncating BRWD3 variants in 2 of 250 XLID families (about
          1%); a missense variant (p.K1596E) segregating in a third family without macrocephaly was of
          uncertain significance and is not counted here.

          ClinGen''s Intellectual Disability and Autism expert panel classifies BRWD3 as Definitive for
          X-linked syndromic intellectual disability (MONDO:0020119), a broader MONDO term than this entry''s
          disease_term, so the classification is cited as evidence but not recorded as a gene_disease_validity
          assertion for MONDO:0010393.

          A Chinese epilepsy cohort reported maternally inherited BRWD3 missense and near-splice variants
          in five individuals with idiopathic partial epilepsy and normal intellect, and proposed that
          truncating alleles cause intellectual disability while WD40/bromodomain missense alleles cause
          epilepsy. That association rests on a single cohort and on case-control allele counting without
          functional data; it is not modelled as a subtype of this entry.'
      selected_evidence:
        snippet: In the course of systematic screening of the X-chromosome coding sequences in 250 families
          with nonsyndromic X-linked mental retardation (XLMR), two families were identified with truncating
          mutations in BRWD3, a gene encoding a bromodomain and WD-repeat domain-containing protein.
        supports: SUPPORT
