            term:
              id: MONDO:0010393
              label: intellectual disability, X-linked 93
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BRWD3 Loss of Function
        description: The initiating lesion. Reported pathogenic alleles are stop-gain, frameshift and
          canonical splice variants and partial or whole-gene deletions, predicted to abolish BRWD3 function.
          A 586 kb Xq21.1 deletion whose only disease-associated gene is BRWD3 reproduces the phenotype,
          which supports loss of function as sufficient to cause the disorder. BRWD3 contains eight N-terminal
          WD40 repeats and two C-terminal bromodomains. Its best-characterised molecular activity is as
          a substrate-recognition subunit of the CUL4-DDB1-ROC1 (CRL4) E3 ubiquitin ligase, shown biochemically
          for Drosophila BRWD3 with human CRL4 components; the molecular function binding records that
          activity as lost.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: BRWD3
          term:
            id: hgnc:17342
            label: BRWD3
        molecular_functions:
        - preferred_term: CRL4 ubiquitin ligase substrate receptor activity
          term:
            id: GO:1990756
            label: ubiquitin-like ligase-substrate adaptor activity
          modifier: DECREASED
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          allele_type: null (stop-gain, frameshift, canonical splice, partial or whole-gene deletion)
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
      selected_evidence:
        snippet: The 12 BRWD3 sequence variants included six stop-gain, four frameshift and two canonical
          splice site variants (predicted to disrupt normal splicing), which were predicted to result
          in haploinsufficiency of a gene which exhibits a high degree of loss-of-function constraint
          (pLI 1.00, haploinsufficiency index 28.62%, PVS1).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
