      assertion:
        name: X-linked recessive
        description: Hemizygous BRWD3 null variants or deletions in males. In the largest single series
          every sequence variant with inheritance data (12 patients) was maternally inherited, while both
          partial gene deletions arose de novo; across the pooled literature 19 of 28 variants with segregation
          data came from unaffected mothers and 9 were de novo, so a negative family history does not
          exclude the diagnosis. Carrier females are usually unaffected, and in the founding family the
          three tested carriers preferentially inactivated the mutant X. A small number of affected heterozygous
          females have been reported, all milder than males and with skewed X inactivation in each one
          tested.
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
      selected_evidence:
        snippet: Inheritance data were available for 12 patients with sequence variants; all were maternally
          inherited.
        supports: SUPPORT
