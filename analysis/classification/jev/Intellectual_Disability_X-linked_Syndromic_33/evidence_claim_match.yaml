      assertion_type: Pathophysiology
      assertion:
        name: TFIID-Dependent Transcription Dysfunction
        role: intermediate
        biological_scale: MOLECULAR
        description: 'TAF1 is the largest subunit of TFIID, which with TATA-binding protein and the other
          TBP-associated factors nucleates the RNA polymerase II preinitiation complex at essentially
          all pol II promoters. A TAF1 lesion therefore perturbs a general transcription function rather
          than a single target pathway. The node is tagged DYSREGULATED rather than DECREASED because
          it has two upstream lesions pushing in opposite directions — hypomorphic missense alleles reducing
          TAF1 function and Xq13.1 duplications increasing TAF1 dosage — and because no study has measured
          preinitiation complex assembly in patient material in either direction.

          '
        biological_processes:
        - preferred_term: RNA polymerase II preinitiation complex assembly
          term:
            id: GO:0051123
            label: RNA polymerase II preinitiation complex assembly
          modifier: DYSREGULATED
      selected_evidence:
        snippet: TAF1 encodes the largest subunit of the basal transcription factor II D (TFIID), which
          directs the assembly of the pol II preinitiation complex (Papai, Weil, & Schultz, 2011) and
          is likely required for all pol II gene promoters
        supports: SUPPORT
