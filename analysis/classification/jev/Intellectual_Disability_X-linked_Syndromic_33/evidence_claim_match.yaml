            publication: PMID:31344492
            description: 'A somatic brain transgenesis model in which TAF1 is deleted in the postnatal
              rat brain by intracerebroventricular delivery of lentiviral CRISPR/Cas9. It was developed
              specifically because embryonic mouse knockouts of TAF1 had failed, and it produces behavioral
              deficits with cerebellar Purkinje cell pathology.

