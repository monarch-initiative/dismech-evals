        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced RAP74 Phosphorylation in Patient Cells
        role: intermediate
        biological_scale: MOLECULAR
        description: 'Lymphoblasts from probands carrying two independent pathogenic TAF1 variants show
          reduced phosphorylation of RNA polymerase II-associated protein 74 (RAP74). The curated observation
          here is that measured reduction in RAP74 phosphorylation, not the identity of the responsible
          kinase. PMID:42548218 attributes the activity to TAF1''s own N- and C-terminal serine/threonine
          kinase domains, but a 2024 TAF1 review reports that the enzymatic activities historically attributed
          to TAF1 — kinase among them — could not be confirmed in recent TFIID/TAF1 studies and that much
          of the underlying work has been retracted. This node therefore does not bind a TAF1 kinase molecular
          function, and the route onward to transcriptional dysfunction is hypothesis-scoped.

          '
      selected_evidence:
        snippet: The N- and C-terminal domains of TAF1 are known to possess a serine/threonine kinase
          activity that selectively phosphorylates RNA polymerase II-associated protein 74 (RAP74).
        supports: SUPPORT
