        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No population-based prevalence estimate exists. Ascertainment is entirely from published
          case series: the original report described eleven families, and a subsequent genotype-first
          study added 27 further families, of which pathogenicity could be confidently assigned in only
          a subset. The count of published families, not a rate, is the available occurrence measure.

          '
      selected_evidence:
        snippet: The initial study reported eleven families, and the syndrome was defined as presenting
          early in life with hypotonia, facial dysmorphia, and developmental delay that evolved into intellectual
          disability (ID) and/or autism spectrum disorder (ASD). We have now identified an additional
          27 families through a genotype-first approach.
        supports: SUPPORT
