      assertion:
        name: X-linked recessive
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
        description: 'TAF1 maps to Xq13.1 and the syndrome manifests in hemizygous males, with variants
          arising de novo or inherited from an unaffected carrier mother. Heterozygous carrier females
          are typically asymptomatic in association with completely skewed X-chromosome inactivation toward
          the non-mutant chromosome, although symptomatic females carrying TAF1 variants have also been
          reported.

          '
      selected_evidence:
        snippet: We describe an X-linked genetic syndrome associated with mutations in TAF1 and manifesting
          with global developmental delay, intellectual disability (ID), characteristic facial dysmorphology,
          generalized hypotonia, and variable neurologic features, all in male individuals.
        supports: SUPPORT
