      assertion:
        target: Cerebellar Purkinje Cell Loss
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: 'TAF1 deletion in the developing rat brain produces Purkinje cell hypoplasia and
          loss with reduced CaV3.1 expression and associated motor deficits — the observations that define
          this node.

          '
        limitations: The lesion is a somatic postnatal deletion delivered to part of the brain, not a
          germline hypomorphic missense allele present from conception, and no human MRXS33 neuropathology
          exists against which to check the Purkinje finding.
        readouts:
        - name: Purkinje cell number and cerebellar morphology
          target: Cerebellar Purkinje Cell Loss
          direction: DECREASED
          interpretation: Direct histopathological correlate of the Purkinje cell loss node.
        - name: CaV3.1 T-type calcium channel expression
          target: Cerebellar Purkinje Cell Loss
          direction: DECREASED
          interpretation: 'Reduced presynaptic CaV3.1 is the channel-level change the authors link to
            irregular cerebellar output in this model.

            '
        - name: Behavioral response to the T-type calcium channel enhancer SAK3
          target: Cerebellar Purkinje Cell Loss
          direction: RESTORED
          interpretation: 'Pharmacological rescue in the same model. SAK3 is a preclinical tool compound
            in rats; it is not a treatment for the human disease and is deliberately not curated in the
            treatments section.

            '
        - name: Cortical neuron and astrocyte survival under SAK3
          target: Cerebellar Purkinje Cell Loss
          direction: RESTORED
          interpretation: 'The same compound protects cortical neurons and astrocytes and restores BDNF/AKT/GSK3-beta
            signaling, indicating the rescue is not confined to the cerebellum. Recorded here because
            the companion study shares the model; it is a preclinical rat result, not a human therapy.

            '
      selected_evidence:
        snippet: Here, we report the development and characterization of a novel animal model for TAF1
          ID syndrome in which the TAF1 gene is deleted in embryonic rats using clustered regularly interspaced
          short palindromic repeats (CRISPR) associated protein 9 (Cas9) technology and somatic brain
          transgenesis mediated by lentiviral transduction.
        supports: SUPPORT
