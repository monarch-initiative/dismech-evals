        snippet: To date, only missense variants have been found; the lack of hemi- and homozygous loss-of-function
          variants in the protein coding part of the canonical TAF1 isoform in human population databases
          suggests that the complete loss of TAF1 may be embryonic-lethal.
        supports: SUPPORT
