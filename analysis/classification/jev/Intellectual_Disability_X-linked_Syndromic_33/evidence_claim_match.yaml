        role: intermediate
        biological_scale: MOLECULAR
        description: 'TAF1''s C-terminal bromodomain exerts a repressive role during cardiogenesis. Damaging
          bromodomain missense variants taken from congenital heart disease patients abrogate that repression,
          and a selective chemical inhibitor of the TAF1 bromodomain reproduces the same effect - it was
          recovered in an unbiased screen as an activator of atrial and ventricular fetal myosins during
          pluripotent stem cell differentiation. This is the entry''s only mechanism-level account of
          the cardiac phenotype, and it is specific to the bromodomain variant class rather than to TAF1
          variants generally.

          '
      selected_evidence:
        snippet: Damaging TAF1 missense variants from CHD patients were studied by mutational analysis
          of the TAF1 bromodomain, demonstrating a repressive role of TAF1 that can be abrogated by the
          introduction of damaging bromodomain variants or chemical TAF1 bromodomain inhibition.
        supports: SUPPORT
