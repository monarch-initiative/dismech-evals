        description: 'Pathogenic variants in other components of the TAF/TFIID complex — TBP, TAF2, and
          TAF6 — produce an overlapping syndrome of intellectual disability with craniofacial and cardiac
          anomalies, collectively termed TAFopathy. These share the general-transcription-machinery mechanism
          with TAF1 disease and overlap clinically, so the differential is resolved by which subunit carries
          the variant rather than by phenotype.

          '
