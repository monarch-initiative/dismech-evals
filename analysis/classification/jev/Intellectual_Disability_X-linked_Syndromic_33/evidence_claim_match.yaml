            term:
              id: MONDO:0010500
              label: intellectual disability, X-linked, syndromic 33
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: taf1_models_are_null_human_disease_is_hypomorphic
        kind: HUMAN_MODEL_MISMATCH
        prompt: 'Every TAF1 animal model uses a null or somatic-deletion lesion, while human MRXS33 is
          caused by germline hypomorphic missense variants. Does any existing model report on the mechanism
          of the human missense disease?

          '
        attaches_to:
        - pathophysiology#TAF1 Hypomorphic Missense Variants
        - pathophysiology#Cerebellar Purkinje Cell Loss
        rationale: 'The mismatch is structural, not incidental. Complete TAF1 loss is embryonically lethal
          in both mouse and zebrafish, so the genotype that corresponds to an affected human male cannot
          be studied in those systems at all; the rat model circumvents lethality only by deleting TAF1
          somatically in the postnatal brain, which is a different lesion in a different developmental
          window. Consequently the cerebellar Purkinje pathology that the rat model contributes — the
          entry''s only cellular account of the motor phenotype — rests on a lesion class the human disease
          does not have, and no human neuropathology exists to check it against. Brain MRI is reported
          normal in at least one affected male, which is at least consistent with the cerebellar route
          not being universal.

          '
      selected_evidence:
        snippet: Mouse models which have embryonically targeted TAF1 have failed, possibly due to TAF1
          being essential for viability, preferentially expressed in early brain development, and intolerant
          of mutation.
        supports: SUPPORT
    origin:
