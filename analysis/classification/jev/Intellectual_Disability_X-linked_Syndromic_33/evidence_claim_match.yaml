            preferred_term: TAF1 intellectual disability syndrome
            term:
              id: MONDO:0010500
              label: intellectual disability, X-linked, syndromic 33
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: X-linked dystonia-parkinsonism
        description: 'The other TAF1 disease, and the key allelic differential. XDP is caused by a Filipino
          founder SINE-VNTR-Alu retrotransposon insertion in intron 32 of TAF1 — a non-coding lesion —
          and presents in adulthood as a progressive dystonia-parkinsonism with neostriatal degeneration.
          MRXS33 is caused by coding missense variants (or Xq13.1 duplication) and presents congenitally
          as a neurodevelopmental syndrome. Both are X-linked and both involve TAF1 transcriptional dysregulation,
          so gene-level testing alone does not distinguish them; the lesion class does.

          '
        disease_term:
          preferred_term: X-linked dystonia-parkinsonism
          term:
            id: MONDO:0010747
            label: X-linked dystonia-parkinsonism
        distinguishing_features:
        - Lesion class - intronic SVA retrotransposon insertion in XDP versus coding missense variant
          or Xq13.1 duplication in MRXS33
        - Age at onset - adult in XDP versus congenital/infantile in MRXS33
        - Filipino founder ancestry with a single shared haplotype in XDP
        - Progressive movement disorder with neostriatal degeneration in XDP versus developmental delay
          with facial dysmorphism in MRXS33
      selected_evidence:
        snippet: TAF1 missense variants in human males cause X-linked intellectual disability, a neurodevelopmental
          disorder, and TAF1 is dysregulated in X-linked dystonia-parkinsonism, a neurodegenerative disorder.
        supports: SUPPORT
