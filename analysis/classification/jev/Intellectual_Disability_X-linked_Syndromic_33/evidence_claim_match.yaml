        inheritance:
        - name: X-linked recessive
          inheritance_term:
            preferred_term: X-linked recessive inheritance
            term:
              id: HP:0001419
              label: X-linked recessive inheritance
        notes: 'TAF1 lies at Xq13.1 and encodes the largest subunit of TFIID, a protein of roughly 1,870-1,890
