      assertion_type: Diagnosis
      assertion:
        name: Chromosomal microarray for the duplication lesion
        description: 'Sequencing-based testing will not reliably detect the Xq13.1 duplication that constitutes
          the entry''s second trigger lesion, so copy-number testing is the complementary diagnostic route.
          A reported case of floppy infant syndrome was resolved by SNP array showing an Xq13.1 duplication
          spanning TAF1 among other genes, with the same duplication carried by the mother and grandmother
          - which also illustrates the X-linked segregation the inheritance block describes.

          '
        diagnosis_term:
          preferred_term: chromosomal microarray analysis
          term:
            id: NCIT:C18477
            label: Microarray Analysis
        results: 'Detection of a copy-number gain at Xq13.1 encompassing TAF1 in a male with hypotonia
          and developmental delay.

          '
      selected_evidence:
        snippet: The multiple PCR-DHPLC assay confirmed duplication of HDAC8, PHKA1, TAF1, DLG3, KIF4A,
          IGBP1, PJA1 and SLC16A2 genes in the proband.
        supports: SUPPORT
