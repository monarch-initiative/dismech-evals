            term:
              id: MONDO:0010500
              label: intellectual disability, X-linked, syndromic 33
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: rap74_phosphorylation_route
        hypothesis_label: Reduced RAP74 phosphorylation as the route from TAF1 variant to transcriptional
          dysfunction
        status: EMERGING
        description: 'Patient lymphoblasts carrying two independent pathogenic TAF1 variants show reduced
          phosphorylation of RAP74. The authors advance this as a potential mechanism connecting the variants
          to transcriptional dysfunction. Two things keep it a hypothesis rather than a curated step.
          No study has shown the phosphorylation deficit is necessary or sufficient for the neurodevelopmental
          phenotype; and the mechanism the authors propose depends on TAF1 itself being the kinase, an
          activity a 2024 review reports could not be confirmed in recent TFIID/TAF1 studies, with much
          of the original work retracted. The measured phosphorylation change stands; its attribution
          to a TAF1 kinase activity does not.

          '
      selected_evidence:
        snippet: This study expands the phenotypic spectrum of TAF1-related XLID and implicates reduced
          RAP74 phosphorylation as a potential mechanism.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
