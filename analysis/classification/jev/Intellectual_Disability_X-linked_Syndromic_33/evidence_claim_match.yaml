              one splice-site variant, and two large Xq13.1 duplications have also been reported, so "missense"
              describes the dominant class rather than the whole allelic spectrum. The absence of hemizygous
              loss-of-function alleles in population databases - a statement both sources qualify to the
              canonical protein-coding isoform - together with embryonic lethality of null alleles in
              mouse and zebrafish, indicates that complete loss of TAF1 is not viable and that disease
              alleles retain partial function. Assigning pathogenicity to individual TAF1 missense variants
