          in turn permits Sdo1-stimulated Efl1 to release the anti-association factor Tif6. A missense-altered
          uL16 traps Nmd3 in the P site, so Nmd3 and Tif6 are not released and the subunit cannot be licensed
          for translation.

          '
        biological_scale: MOLECULAR
        biological_processes:
