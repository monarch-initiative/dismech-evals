            term:
              id: MONDO:0030908
              label: intellectual disability, X-linked, syndromic, 35
        context: []
      assertion_type: Genetic
      assertion:
        name: RPL10
        association: Causative
        variant_origin: GERMLINE
        gene_term:
          preferred_term: RPL10
          term:
            id: hgnc:10298
            label: RPL10
        notes: 'RPL10 (Xq28; reference transcript NM_006013.5, seven exons) encodes uL16, a 214-amino-acid
          structural component of the 60S ribosomal subunit. Every reported MRXS35 allele is missense;
          no truncating allele has been described, consistent with complete loss of this core ribosomal
          protein being incompatible with viability. Reported syndromic substitutions cluster in the N-terminal
          and rRNA-contacting regions (p.R32L, p.A64V, p.K78E, p.R116Q), whereas the C-terminal p.L206M
          and p.H213Q alleles were reported in autism families and behave as hypomorphs. Functional data
          support loss of function: p.K78E fails to rescue rpl10 morphant zebrafish, and p.R116Q reduces
          RPL10 mRNA and protein in transfected cells. The p.A64V allele is the informative exception,
          producing a functional protein that instead increases the actively translating ribosome pool,
          so "loss of function" should not be assumed uniformly across the allelic series.

          RPL10 is strongly constrained in population reference data (gnomAD v2 pLI 0.997, missense Z
          4.08), which fits the missense-only allelic spectrum: partial-loss-of-function substitutions
          are compatible with viability where a null allele is not. These constraint statistics are database
          values rather than a finding quoted from a paper, so they are recorded here rather than as an
          evidence item. The gnomAD absence of a specific pathogenic allele is cited separately, on the
          RPL10 Missense Substitution in uL16 pathophysiology node.

          '
      selected_evidence:
        snippet: we identified a novel missense mutation in the gene encoding 60S ribosomal protein L10
          (RPL10), a locus associated previously with autism spectrum disorders (ASD)
        supports: SUPPORT
