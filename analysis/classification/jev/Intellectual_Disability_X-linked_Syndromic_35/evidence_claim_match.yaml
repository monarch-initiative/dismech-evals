              label: intellectual disability, X-linked, syndromic, 35
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: p.A64V Increases the Actively Translating Ribosome Population
        description: 'A second departure from the loss-of-function chain, and in the opposite direction
          from the C-terminal hypomorphs. The N-terminal p.A64V allele yields a functional protein that
          complements a conditional lethal yeast rpl10 mutant, yet shifts the polysome profile toward
          more actively translating ribosomes. It is modelled separately because it can be neither a maturation
          failure nor a hypomorph, and because the two cousins carrying it are the source of the cerebellar
          hypoplasia and spondyloepiphyseal dysplasia reported in this disorder. Whether this represents
          a genuinely opposite route to the same phenotype is unresolved and is recorded as a knowledge
          gap.

          '
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: translation
          modifier: INCREASED
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: unlike previously reported mutations, this novel RPL10 missense mutation results in an
          increase in the actively translating ribosome population
        supports: SUPPORT
