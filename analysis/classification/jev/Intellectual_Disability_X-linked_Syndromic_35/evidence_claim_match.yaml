      assertion_type: Pathophysiology
      assertion:
        name: Tissue-Specific Translational Vulnerability
        description: 'Ribosomes are ubiquitous, yet ribosomopathies produce tissue-restricted phenotypes.
          RPL10 protein is disproportionately abundant in the tissues this disorder targets outside the
          brain: it is highly expressed in vertebrate epiphyseal cartilage, and ranks 553rd of 12,000
          expressed genes in the human retina. That expression bias is the proposed reason a general shortfall
          of translation-competent subunits produces retinal degeneration and spondyloepiphyseal dysplasia
          rather than a uniform systemic defect. The route is inferred from expression data, not demonstrated
          in patient tissue.

          '
        biological_scale: TISSUE
