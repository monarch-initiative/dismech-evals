  c05192e8f9b7083b884e8025db234bc6a9571e18a966f7a5db1b0258da4aa815:
    claim:
      about:
        disease:
          name: Intellectual Disability X-linked Syndromic 35
          disease_term:
            preferred_term: intellectual disability, X-linked, syndromic, 35
            term:
              id: MONDO:0030908
              label: intellectual disability, X-linked, syndromic, 35
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Trio Exome or Genome Sequencing
        description: 'There are no formal clinical diagnostic criteria and the phenotype is not specific
          enough to be separated clinically from other X-linked intellectual disability, so molecular
          diagnosis is definitive. Every reported case was ascertained by exome sequencing, in most instances
          after a normal array-CGH and negative targeted testing (including fragile X). The trio design
          matters both for detecting the occasional de novo variant and for confirming maternal carrier
          status, which drives recurrence counselling. Most RPL10 missense alleles are initially returned
          as variants of uncertain significance, so functional follow-up may be required for reclassification.

          The clinical differential is other syndromic X-linked intellectual disability of similar presentation,
          in particular MECP2, KDM5C, USP9X and MSL3. None is separable from MRXS35 on phenotype alone,
          which is why the diagnosis is molecular; a multi-gene panel or exome covers them together.

          Chromosomal microarray is not merely historical here. RPL10 sits inside the recurrent Xq28 duplication
          interval alongside FLNA and GDI1, and multigenic Xq28 copy-number gains produce their own intellectual
          disability syndromes that are distinct from MRXS35 and not attributable to RPL10. Microarray
          is what separates them from a point mutation in this gene.

          '
      selected_evidence:
        snippet: Due to their multiple congenital anomalies, whole-exome sequencing (WES) was recommended
          and conducted.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
