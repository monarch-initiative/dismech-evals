            term:
              id: MONDO:0030908
              label: intellectual disability, X-linked, syndromic, 35
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ul16_maturation_checkpoint_untested_in_syndromic_alleles
        kind: KNOWLEDGE_GAP
        prompt: 'Does the 60S maturation checkpoint failure demonstrated for uL16 in yeast actually occur
          in cells carrying the MRXS35 alleles?

          '
        attaches_to:
        - pathophysiology#Impaired Late Cytoplasmic 60S Subunit Maturation
        rationale: 'The molecular step in this entry''s central node - trapping of Nmd3 in the P site
          and failure to release Tif6 - has been demonstrated for the somatic leukemia allele rpl10-R98S
          in S. cerevisiae, not for any of the germline syndromic alleles. The MRXS35 alleles have been
          assayed only at coarser resolution: morphant rescue in zebrafish (p.K78E), transcript and protein
          level in transfected cells (p.R116Q), and polysome distribution in yeast (p.A64V). No study
          has measured Nmd3/Tif6 release, pre-60S quality control passage, or subunit joining for a syndromic
          allele. The chain from the initiating lesion to reduced translational capacity is therefore
          assembled from a conserved-protein argument rather than from direct measurement in this disease,
          and the evidence items on those edges are graded INDIRECT for that reason.

          '
        proposed_experiments:
        - experiment_id: late_60s_maturation_assay_across_mrxs35_alleles
          name: Late 60S maturation assay across the MRXS35 allelic series
          description: 'Reconstitute each syndromic RPL10 allele (p.R32L, p.A64V, p.K78E, p.R116Q) alongside
            p.R98S and wild type, and measure Nmd3 and Tif6 release, pre-60S cytoplasmic quality control
            passage, and 60S-40S subunit joining.

            '
          would_support:
          - pathophysiology#Impaired Late Cytoplasmic 60S Subunit Maturation
          supporting_outcome:
          - Syndromic alleles show retained Nmd3 and Tif6 on cytoplasmic pre-60S particles and reduced
            subunit joining relative to wild type.
          would_refute:
          - pathophysiology#Impaired Late Cytoplasmic 60S Subunit Maturation
          refuting_outcome:
          - Syndromic alleles release Nmd3 and Tif6 normally and join subunits at wild-type rates, indicating
            the neurodevelopmental alleles act through a mechanism other than the late maturation checkpoint.
      selected_evidence:
        snippet: Mutations in the ribosomal protein Rpl10 (uL16) can be drivers of T-cell acute lymphoblastic
          leukemia (T-ALL).
        supports: SUPPORT
        directness: INDIRECT
    origin:
