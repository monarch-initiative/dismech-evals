  ab5d67aad6fcf7e9a56ebcbc837e1881fea35932be417b836dc4c696863478d5:
    claim:
      about:
        disease:
          name: Intellectual Disability X-linked Syndromic 35
          disease_term:
            preferred_term: intellectual disability, X-linked, syndromic, 35
            term:
              id: MONDO:0030908
              label: intellectual disability, X-linked, syndromic, 35
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: a64v_increased_translating_ribosomes_paradox
        kind: KNOWLEDGE_GAP
        prompt: 'Why does p.A64V increase the actively translating ribosome population when a loss-of-function
          model predicts the opposite?

          '
        attaches_to:
        - pathophysiology#p.A64V Increases the Actively Translating Ribosome Population
        - genetic#RPL10
        rationale: 'The dominant mechanistic account of this disorder is loss of function, and two alleles
          support it. p.A64V does not: in yeast it complements a conditional lethal rpl10 mutation and
          shifts the polysome profile toward more actively translating ribosomes, yet the two cousins
          carrying it have intellectual disability, cerebellar hypoplasia and spondyloepiphyseal dysplasia.
          Either the disorder can arise from opposite directions of translational perturbation, or the
          yeast polysome readout does not capture the relevant human defect. This matters for interpretation
          of new missense alleles, which are routinely returned as variants of uncertain significance
          and adjudicated against a loss-of-function expectation.

          '
        proposed_experiments:
        - experiment_id: a64v_vs_lof_in_human_neural_progenitors
          name: Human neural cell comparison of p.A64V against loss-of-function alleles
          description: 'Introduce p.A64V and a demonstrated loss-of-function allele into isogenic human
            iPSC-derived neural progenitors and compare ribosome content, bulk translation rate, translational
            fidelity and the translated transcriptome.

            '
          would_support:
          - pathophysiology#Reduced Pool of Translation-Competent 60S Subunits
          supporting_outcome:
          - p.A64V reduces ribosome content or bulk translation in human neural cells despite the opposite
            polysome result in yeast, reconciling it with the loss-of-function chain.
          would_refute:
          - pathophysiology#Reduced Pool of Translation-Competent 60S Subunits
          refuting_outcome:
          - p.A64V leaves ribosome content and bulk translation intact while altering which transcripts
            are translated, indicating a qualitative rather than quantitative translational lesion.
      selected_evidence:
        snippet: The mutation generates a functional ribosomal protein, able to complement the translational
          defects of a conditional lethal mutation of yeast rpl10.
        supports: SUPPORT
