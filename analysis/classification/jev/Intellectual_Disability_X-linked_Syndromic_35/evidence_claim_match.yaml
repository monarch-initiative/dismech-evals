          p.L206M and p.H213Q, found in autism families, leave basic translation intact while impairing
          regulation of the translation process, a hypomorphic rather than null behaviour. This is the
          mechanistic basis for the autism-only end of the RPL10 spectrum and is presented here as a separate
          node because it does not proceed through the 60S maturation-failure chain above. No modifier
          is set on the process term deliberately: the cited claim is that regulation of translation is
          altered while bulk output is preserved, so neither DECREASED nor INCREASED describes it.

          '
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: We have obtained evidence that the amino-acid substitutions L206M and H213Q at the C-terminal
          end of RPL10 confer hypomorphism with respect to the regulation of the translation process while
          keeping the basic translation functions intact.
        supports: SUPPORT
