      assertion_type: Discussion
      assertion:
        discussion_id: cnksr2_synapse_to_hyperexcitability
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which consequence of CNKSR2 loss produces network hyperexcitability and sleep-activated
          spike-wave discharges, given that the best characterized synaptic defect is a weaker glutamatergic
          postsynaptic response?
        attaches_to:
        - pathophysiology#Reduced Glutamatergic Postsynaptic Response
        - pathophysiology#Neuronal Network Hyperexcitability
        rationale: Cultured CNKSR2-deficient hippocampal neurons show reduced AMPA receptor surface accumulation
          and a smaller response to glutamate, and the same study found no increase in chemically induced
          seizure susceptibility, whereas the knockout mouse has spontaneous seizures and CNKSR2 is present
          at inhibitory as well as excitatory postsynapses. No edge is drawn from the synaptic nodes to
          hyperexcitability for this reason.
      selected_evidence:
        snippet: Furthermore, disruption of MAGUIN did not increase the seizure susceptibility to flurothyl,
          a GABAA receptor antagonist.
        supports: SUPPORT
