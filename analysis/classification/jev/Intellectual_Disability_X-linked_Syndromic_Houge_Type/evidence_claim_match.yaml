          cortical excitatory circuits independently of seizures, or both?
        attaches_to:
        - phenotypes#Loss of acquired spoken language
        - pathophysiology#Excitatory Neuron Dysfunction in Anterior Cingulate Cortex
        rationale: In patients, language regression coincides with the onset of the epilepsy and spike-wave
          activation in sleep, but persists after the epilepsy remits. In mice, vocalization loss can
          be dissociated from seizures, but ultrasonic vocalization is a weak model of human language,
          so the mouse result does not settle the human question.
