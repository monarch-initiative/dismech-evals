  4487e11105e676c8429882c7bd29136906eecdd388023467b2193883a508aaa3:
    claim:
      about:
        disease:
          name: CNKSR2-Related Neurodevelopmental and Epilepsy Disorder
          disease_term:
            preferred_term: intellectual disability, X-linked, syndromic, Houge type
            term:
              id: MONDO:0030909
              label: intellectual disability, X-linked, syndromic, Houge type
        context: []
      assertion_type: Genetic
      assertion:
        name: CNKSR2
        gene_term:
          preferred_term: CNKSR2
          term:
            id: hgnc:19701
            label: CNKSR2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: 'CNKSR2 (Xp22.12) is the only gene associated with this disorder. Pathogenic alleles
          are almost all predicted loss-of-function: whole or partial gene deletions, nonsense, frameshift
          and canonical splice variants, with a minority of missense variants.'
        notes: ClinGen classifies CNKSR2 as Definitive for X-linked complex neurodevelopmental disorder
          (MONDO:0100148, CGGV assertion 420ee599-c745-43b9-b9a9-c80dfd7f68a8, December 2020), a broader
          lumped disease rather than MONDO:0030909, so no gene_disease_validity assertion is recorded
          here.
        variants:
        - name: p.Arg712Ter
          description: Recurrent nonsense variant reported in an X-linked family with epilepsy-aphasia
            spectrum phenotypes and, de novo, in a severely affected female. The family report gives the
            cDNA position as c.2314C>T and the later report as c.2134C>T; codon 712 corresponds to c.2134.
          clinical_significance: PATHOGENIC
        - name: p.Arg729Ter
          description: Recurrent nonsense variant from a CGA>TGA transition at a CpG dinucleotide, found
            de novo in two unrelated males.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We detail the disease caused by absence of the synaptic protein CNKSR2 in 8 patients
          ranging from 6 to 62 years old.
        supports: SUPPORT
