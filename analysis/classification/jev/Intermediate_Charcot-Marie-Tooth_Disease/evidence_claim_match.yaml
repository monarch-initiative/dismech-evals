            id: MONDO:0011909
            label: Charcot-Marie-Tooth disease dominant intermediate D
        description: 'Dominant-intermediate CMT type D, caused by heterozygous mutations in MPZ encoding
          myelin protein zero, the major structural glycoprotein of compact peripheral-nerve myelin. MPZ
          is one of several genes in this compartment whose allelic series crosses the CMT compartment
          boundaries: different MPZ alleles produce demyelinating, axonal or intermediate neuropathy,
          so the demyelinating form (CMT1B) is curated on the Charcot-Marie-Tooth Disease Type 1 entry
          and the axonal forms (CMT2I/CMT2J) on Charcot-Marie-Tooth Disease Type 2, while this row holds
          only the intermediate presentation.'
        genes:
        - preferred_term: MPZ
          term:
            id: hgnc:7225
            label: MPZ
      selected_evidence:
        snippet: Myelin protein zero is a key structural component of compact myelin, and over 100 mutations
          in this protein have been reported, which can give rise to neuropathies with either axonal,
          demyelinating, or intermediate features encompassing a wide range of severity.
        supports: SUPPORT
