          and the glial cells of the peripheral nervous system. Plekhg5 knockout mice reproduce the reduced
          nerve conduction velocities seen in affected individuals, and the same gene produces a severe
          childhood-onset lower motor neuron disease with other genotypes.
        cell_types:
