        notes: 'The glial binding stays at the root CL:0000125 glial cell because CL has no peripheral-nervous-system
          glia class. Searched ols:cl on 2026-09-26: `l^peripheral nervous system` returns exactly one
          term, CL:2000032 peripheral nervous system neuron, and no glial counterpart; `peripheral nervous
          system glial cell` and `satellite glial cell` both return nothing, against a working control
          (`Schwann cell` returns six terms). `l^satellite` returns CL:0000516 perineuronal satellite
          cell, which is a real PNS glial type but is not what this node claims - the cited sentence reports
          Plekhg5 expression in peripheral glia generally, not in ganglionic satellite glia, so binding
