      assertion:
        name: SFTPA1 Carbohydrate-Recognition Domain Missense Variant
        description: Disease-associated SFTPA1 variants are germline missense changes in the C-terminal
          carbohydrate-recognition domain (CRD) of SP-A1, including p.Trp211Arg (a residue invariant across
          CRD-containing proteins), p.Val178Met and p.Tyr208His.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SFTPA1
          term:
            id: hgnc:10798
            label: SFTPA1
        genetic_context:
          variant_origin: GERMLINE
        molecular_functions:
        - preferred_term: SP-A1 carbohydrate-recognition domain carbohydrate binding
          term:
            id: GO:0030246
            label: carbohydrate binding
        notes: The molecular function is bound without a modifier. The variants lie in the carbohydrate-recognition
          domain, but the cited studies measure loss of secretion, not loss of carbohydrate binding, so
          no change in this activity is asserted. GO:0120153 calcium-dependent carbohydrate binding was
          not used because no cited source states the calcium dependence.
      selected_evidence:
        snippet: SP-A binds specific carbohydrate moieties found on lipids and on the surface of microorganisms,
          playing an essential role in the defense against respiratory pathogens
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: CGGV:assertion_3c3d8e40-6ec1-4fb0-8a30-ce4f1e33dbdf-2025-01-28T170000.000Z
      reference_title: SFTPA1 / interstitial lung disease 1 (Moderate)
      evidence_source: OTHER
      explanation: ClinGen's summary of SP-A function supports the carbohydrate-binding molecular function,
        the activity of the domain in which every reported ILD1 variant lies.
