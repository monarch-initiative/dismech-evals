      assertion_type: Pathophysiology
      assertion:
        name: Misfolded SP-A2 Retention in the Endoplasmic Reticulum
        description: Mutant SP-A2 is made but forms fewer dimers and trimers, is partly insoluble, is
          unstable to proteolysis, and is degraded by ER-associated degradation instead of being secreted.
          In patient lung tissue the SP-A staining pattern is altered. Total SP-A in bronchoalveolar lavage
          of heterozygous carriers is normal, so the disease is not attributed to a lack of secreted SP-A.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: alveolar type II cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        biological_processes:
        - preferred_term: protein secretion
          term:
            id: GO:0009306
            label: protein secretion
          modifier: DECREASED
        - preferred_term: ER-associated degradation of mutant SP-A2
          term:
            id: GO:0036503
            label: ERAD pathway
          modifier: INCREASED
        genes:
        - preferred_term: SFTPA2
          term:
            id: hgnc:10799
            label: SFTPA2
      selected_evidence:
        snippet: We show that, in contrast with all other SP-A2 variants, the mutant proteins are not
          secreted into the medium with wild-type SP-A isoforms, form fewer intracellular dimer and trimer
          oligomers, are partially insoluble in 0.5% Nonidet P-40 lysates of transfected A549 cells, and
          demonstrate greater protein instability in chymotrypsin proteolytic digestions.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20466729
      reference_title: Surfactant protein A2 mutations associated with pulmonary fibrosis lead to protein
        instability and endoplasmic reticulum stress.
      evidence_source: IN_VITRO
      explanation: In A549 and primary type II cells the mutant proteins are unstable, poorly oligomerized
        and not secreted, unlike the common SP-A2 variants.
