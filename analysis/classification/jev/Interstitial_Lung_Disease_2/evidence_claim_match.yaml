      assertion_type: Pathophysiology
      assertion:
        name: SFTPA2 Carbohydrate-Recognition Domain Missense Variant
        description: Disease-associated SFTPA2 variants are germline heterozygous missense changes at
          invariant residues of the C-terminal carbohydrate-recognition domain (CRD) of SP-A2, including
          the founding p.Gly231Val and p.Phe198Ser and the later p.Asn207Tyr. They are predicted to disrupt
          the structure of the domain.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SFTPA2
          term:
            id: hgnc:10799
            label: SFTPA2
        genetic_context:
          variant_origin: GERMLINE
        molecular_functions:
        - preferred_term: SP-A2 carbohydrate-recognition domain carbohydrate binding
          term:
            id: GO:0030246
            label: carbohydrate binding
        notes: The molecular function is bound without a modifier. The variants lie in the carbohydrate-recognition
          domain, but the cited studies measure misfolding and loss of secretion, not loss of carbohydrate
          binding, so no change in this activity is asserted.
      selected_evidence:
        snippet: 'A novel mutation (NM_001098668.4: c.619A>T; NP_001092138.1: p.N207Y) in surfactant protein
          A2 (SFTPA2,), having not been previously reported to be a mutation, was identified and co-separated
          with all affected individuals in the IPF family.'
        supports: SUPPORT
