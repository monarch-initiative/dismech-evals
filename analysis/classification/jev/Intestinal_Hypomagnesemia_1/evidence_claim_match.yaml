      assertion_type: ModelMechanismLink
      assertion:
        target: Intestinal Magnesium Malabsorption
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: Intestinal loss of Trpm6 alone produces systemic magnesium deficiency.
        limitations: Mouse magnesium absorption depends mainly on the colon; the relative contribution
          of human small intestine and colon is not established.
