        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Genetic and Hormonal Susceptibility of Hepatobiliary Transport
        biological_scale: MOLECULAR
        description: Heterozygous variants in canalicular transporter genes - ABCB4 (phospholipid floppase
          MDR3), ABCB11 (bile salt export pump BSEP) and ATP8B1 - reduce the reserve capacity of hepatocellular
          bile export without causing disease outside pregnancy. Genome-wide meta-analysis implicates
          a broader set of loci acting through bile acid synthesis and lipid metabolism. In the third
          trimester, sulfated progesterone metabolites and estrogen glucuronides inhibit BSEP and antagonise
          the bile acid sensor FXR (NR1H4), converting this latent reserve deficit into overt cholestasis.
          The strictly gestational timing of ICP, and its resolution after delivery, follow from this
          gene-by-hormone interaction.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        genes:
        - preferred_term: ABCB4
          term:
            id: hgnc:45
            label: ABCB4
        - preferred_term: ABCB11
          term:
            id: hgnc:42
            label: ABCB11
        - preferred_term: ATP8B1
          term:
            id: hgnc:3706
            label: ATP8B1
        - preferred_term: NR1H4
          term:
            id: hgnc:7967
            label: NR1H4
        - preferred_term: ABCG5
          term:
            id: hgnc:13886
            label: ABCG5
        - preferred_term: ABCG8
          term:
            id: hgnc:13887
            label: ABCG8
        - preferred_term: CYP8B1
          term:
            id: hgnc:2653
            label: CYP8B1
        biological_processes:
        - preferred_term: response to estrogen
          modifier: INCREASED
          term:
            id: GO:0043627
            label: response to estrogen
        - preferred_term: bile acid metabolic process
          modifier: DYSREGULATED
          term:
            id: GO:0008206
            label: bile acid metabolic process
      selected_evidence:
        snippet: The associated loci implicate bile acid synthesis, LDL cholesterol, and lipid metabolism.
        supports: SUPPORT
