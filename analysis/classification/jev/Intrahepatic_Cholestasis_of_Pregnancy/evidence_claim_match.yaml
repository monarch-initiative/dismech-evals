        biological_scale: CELLULAR
        description: 'Taurocholic acid produces abnormal calcium dynamics and impaired contraction in
          cardiomyocytes, slows ventricular conduction, and promotes arrhythmia. Cardiac fibroblast-cardiomyocyte
          coupling contributes: bile acids and hypoxia promote fibroblast-to-myofibroblast transition
          and gap-junctional depolarisation of cardiomyocytes, and ursodeoxycholic acid acts partly by
          hyperpolarising these myofibroblasts. This node is the mechanistic core of the stillbirth model
          and is where the human-translation uncertainty is concentrated.'
        cell_types:
        - preferred_term: fetal cardiomyocyte
