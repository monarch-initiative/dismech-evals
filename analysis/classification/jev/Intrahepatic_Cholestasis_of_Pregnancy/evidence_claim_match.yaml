          to a coarser available parent would misrepresent the single most important outcome of this disorder,
          so the phenotype is left unbound and the ontology gap recorded here.
      selected_evidence:
        snippet: The risk of stillbirth is increased in women with intrahepatic cholestasis of pregnancy
          and singleton pregnancies when serum bile acids concentrations are of 100 μmol/L or more.
        supports: SUPPORT
