            term:
              id: MONDO:0100429
              label: intrahepatic cholestasis of pregnancy
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: fetal_bile_acid_cardiotoxicity_model
        hypothesis_label: Fetal Bile Acid Cardiotoxicity Model of ICP Stillbirth
        status: CANONICAL
        description: 'ICP stillbirth is not caused by progressive placental insufficiency (which would
          be preceded by growth restriction and abnormal Dopplers) but by an acute, bile-acid-mediated
          fetal cardiac event. Bile acids transferred across the placenta accumulate in fetal serum and
          myocardium, where taurocholic acid disturbs cardiomyocyte calcium dynamics, slows conduction
          and promotes arrhythmia. This explains the characteristic clinical signature of ICP loss: sudden
          death in an appropriately grown fetus, near term, without antecedent surveillance abnormalities.
          It also explains why bile acid concentration rather than pruritus severity or transaminase level
          stratifies risk.'
        notes: Strongest supporting strands are (1) the concentration-threshold epidemiology (stillbirth
          risk rises sharply at total bile acids of 100 micromol/L or more) and (2) direct cardiomyocyte
          electrophysiology in model systems. The principal gap is that the arrhythmia mechanism is demonstrated
          in rodent cardiomyocytes and in vitro human fetal cardiac cells, not in human fetuses in vivo,
          where the terminal event is by definition unobserved. See the HUMAN_MODEL_MISMATCH discussion
          below.
      selected_evidence:
        snippet: The risk of stillbirth is increased in women with intrahepatic cholestasis of pregnancy
          and singleton pregnancies when serum bile acids concentrations are of 100 μmol/L or more.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
