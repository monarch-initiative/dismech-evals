      assertion:
        name: Impaired Hepatocellular Bile Acid Export
        conforms_to: cholestatic_liver_injury#Impaired Bile Formation and Secretion
        biological_scale: CELLULAR
        description: Canalicular export of bile salts and phospholipid falls below the load presented
          to the hepatocyte, producing intrahepatic cholestasis with retention of bile acids inside the
          hepatocyte and a modest hepatocellular injury signature (raised aminotransferases). Unlike the
          biliary-obstruction cholestases, jaundice is uncommon and hepatic architecture is preserved,
          and the process reverses within days to weeks of delivery.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: bile acid and bile salt transport
          modifier: DECREASED
          term:
            id: GO:0015721
            label: bile acid and bile salt transport
      selected_evidence:
        snippet: Intrahepatic cholestasis of pregnancy is the most common liver disorder induced by pregnancy.
        supports: SUPPORT
