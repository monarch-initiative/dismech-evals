        context: []
      assertion_type: Treatment
      assertion:
        name: Bile-Acid-Guided Timed Delivery
        description: Because the stillbirth hazard is concentrated late in gestation and rises with bile
          acid concentration, planned early-term or preterm delivery timed to the maximum measured bile
          acid concentration is the principal intervention that plausibly reduces fetal death. This trades
          an iatrogenic prematurity cost against stillbirth risk, and the balance is explicitly concentration-dependent.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: labor induction
          term:
            id: NCIT:C92814
            label: Induction of Labor
      selected_evidence:
        snippet: The risk of stillbirth is increased in women with intrahepatic cholestasis of pregnancy
          and singleton pregnancies when serum bile acids concentrations are of 100 μmol/L or more.
        supports: SUPPORT
