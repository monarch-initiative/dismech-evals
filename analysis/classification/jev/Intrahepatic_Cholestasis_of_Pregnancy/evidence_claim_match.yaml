      assertion_type: Pathophysiology
      assertion:
        name: Transplacental Bile Acid Transfer and Fetal Accumulation
        biological_scale: ORGANISM
        description: The fetus normally exports bile acids to the maternal circulation across the placenta.
          When the maternal compartment is loaded, this gradient flattens or reverses and bile acids accumulate
          in fetal serum, amniotic fluid and meconium. Fetal accumulation is the necessary link between
          a maternal hepatic disorder and a fetal cardiac event, and accounts for the meconium-stained
          liquor that accompanies severe disease.
        cell_types:
        - preferred_term: syncytiotrophoblast
          term:
            id: CL:0000525
            label: syncytiotrophoblast cell
        biological_processes:
        - preferred_term: bile acid and bile salt transport
          modifier: DYSREGULATED
          term:
            id: GO:0015721
            label: bile acid and bile salt transport
      selected_evidence:
        snippet: Bile acids are elevated in the blood of women with intrahepatic cholestasis of pregnancy
          (ICP) and this may lead to fetal arrhythmia, fetal hypoxia and potentially fetal death in utero.
        supports: SUPPORT
    origin:
