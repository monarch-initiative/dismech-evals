              label: candidiasis, invasive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Candida beta-1,3-Glucan Synthesis by Fks Glucan Synthase
        description: 'The Candida plasma-membrane glucan-synthase complex uses the catalytic subunit encoded
          principally by FKS1; FKS2 supplies additional catalytic capacity in species such as Candida
          glabrata. The complex synthesizes beta-1,3-glucan, an essential structural polymer of the fungal
          cell wall. This fungus-specific activity is the direct therapeutic vulnerability inhibited by
          echinocandins. The node is intentionally target-only: it does not assert that normal wall synthesis
          positively causes the intervention-conditional wall failure that follows pharmacologic inhibition.'
        biological_scale: MOLECULAR
        role: therapeutic_vulnerability
        conforms_to: fungal_cell_wall_glucan_synthesis_inhibition#beta-1,3-Glucan Synthesis at the Plasma
          Membrane by Fks Glucan Synthase
        biological_processes:
        - preferred_term: beta-1,3-Glucan Biosynthesis
          term:
            id: GO:0006075
            label: (1->3)-beta-D-glucan biosynthetic process
        molecular_functions:
        - preferred_term: 1,3-beta-D-Glucan Synthase Activity
          term:
            id: GO:0003843
            label: 1,3-beta-D-glucan synthase activity
      selected_evidence:
        snippet: They are the first cell wall-active agents and target the fungal-specific enzyme glucan
          synthase, which catalyzes the biosynthesis of β-1,3-glucan, a key cell wall polymer.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
