      assertion_type: Diagnosis
      assertion:
        name: Gastric iron encrustation at autopsy
        description: Gross iron encrustation over the gastric rugae is reported as specific for acute
          ingestion when it is present, making it a post-mortem discriminator between acute poisoning
          and chronic iron overload.
        notes: Reported from a single autopsy case with literature review, so the specificity claim rests
          on a narrow base. The same source cautions that the clinical course and laboratory testing of
          severe acute iron overdose is fairly non-specific.
      selected_evidence:
        snippet: At autopsy, iron encrustations were present over the gastric rugae.
        supports: SUPPORT
