  a0fde87fc2f9b8648dd1f22db0ad4bf851553314d393a4705b4d48ca550e672a:
    claim:
      about:
        disease:
          name: Iron Poisoning
          disease_term:
            preferred_term: iron poisoning
            term:
              id: MONDO:0800385
              label: iron poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: deferiprone_human_translation_acute_poisoning
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the mortality benefit of oral deferiprone seen in the rat acute oral-iron model translate
          to human acute iron poisoning, where the chelator must be given after ingestion rather than
          coadministered with the iron?
        attaches_to:
        - treatments#Oral Deferiprone (investigational for acute poisoning)
        - pathophysiology#Ingestion of Iron in Excess of Absorptive and Binding Capacity
        rationale: 'The rat result is a real, dose-responsive survival benefit, but its design limits
          what it can say about the clinical problem: deferiprone was coadministered with the iron or
          given two hours later, whereas a poisoned child presents hours after an ingestion of unknown
          size, often already vomiting — which is both the reason an oral agent is attractive and the
          reason it may not be retained. The authors state plainly that oral efficacy in acute poisoning
          had not been tested in humans. The stakes are access rather than superiority: deferoxamine''s
          cost and parenteral route put it out of reach in much of the world, so an oral alternative would
          change who can be treated at all. Until human data exist, deferiprone is curated here as investigational
          and deferoxamine remains the antidote.

          This discussion attaches to the ingested-burden node rather than to plasma non-transferrin-bound
          iron, matching where this treatment''s target_mechanisms edge points and for the same reason:
          the only measurement supporting oral deferiprone in the acute setting is gastrointestinal tissue
          iron, not a plasma iron species. A systemically absorbed chelator plausibly also acts on plasma
          NTBI, but nothing in the cited evidence measures that, so both links are drawn where the evidence
          is rather than where the pharmacology is assumed to reach.'
        proposed_experiments:
        - experiment_id: delayed_oral_chelation_rat_model
          name: Delayed-administration oral chelation in the rat model
          description: Repeat the rat acute oral iron model with deferiprone given at intervals matching
            realistic human presentation delays, and in animals made to vomit or with delayed gastric
            emptying, to test whether the benefit survives the timing and retention conditions of a real
            poisoning.
        - experiment_id: deferiprone_registry_human_cohort
          name: Registry-based human comparative cohort
          description: In settings where parenteral deferoxamine is unavailable and oral deferiprone is
            used, assemble a poison-centre registry cohort comparing chelated and unchelated acute iron
            poisonings on mortality, peak serum iron and hepatic injury, with severity adjustment.
      selected_evidence:
        snippet: Its efficacy, by oral administration, in acute iron poisoning has not been tested.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
      context_paths:
      - /name
      - /disease_term
