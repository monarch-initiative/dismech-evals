  6ea54c51bbed56a0b16f6b18f5b5c49cc8a51450d8fd23446d6b9341dadce90a:
    claim:
      about:
        disease:
          name: Iron Poisoning
          disease_term:
            preferred_term: iron poisoning
            term:
              id: MONDO:0800385
              label: iron poisoning
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Absent significant hepatic stainable iron despite fatal poisoning
        description: In the same fatal case, no significant stainable iron was found in the liver, even
          though the clinical course showed hepatic compromise with markedly elevated serum iron. Stainable
          hepatic iron is therefore not a reliable post-mortem marker of acute iron poisoning, and its
          absence does not exclude the diagnosis.
        notes: 'This sits in tension with the entry''s Periportal Hepatocellular Necrosis node, which
          argues the hepatocyte takes the highest iron flux by way of the portal circulation. The tension
          is real but not necessarily a contradiction: the patient died 65.5 hours after ingestion and
          had been treated, so redistribution, chelation and clearance all intervene between the toxic
          exposure and the section. It is recorded here rather than omitted because a single autopsy is
          the whole of the cited histological evidence, and the negative is part of it.'
      selected_evidence:
        snippet: No significant stainable iron was present in the liver.
        supports: SUPPORT
    origin:
