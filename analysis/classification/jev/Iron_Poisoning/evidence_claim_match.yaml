  a43da704f9bbeb9db3331efbfdca57460fa363f85d0d3a67e51736bb0592f6c7:
    claim:
      about:
        disease:
          name: Iron Poisoning
          disease_term:
            preferred_term: iron poisoning
            term:
              id: MONDO:0800385
              label: iron poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ferroptosis_in_acute_iron_poisoning
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Which route carries the hepatocellular and mucosal cell death of acute iron poisoning:
          ferroptosis (iron-dependent, GPX4-restrained lethal lipid peroxidation), lysosomal destabilisation
          ending in apoptotic or necrotic death, or unregulated oxidative organelle damage requiring no
          death programme at all? The three are not mutually exclusive, and none has been demonstrated
          in this disease.'
        attaches_to:
        - pathophysiology#Iron-Catalysed Oxidative Organelle Injury
        - pathophysiology#Periportal Hepatocellular Necrosis
        rationale: 'Ferroptosis is a well-characterised, iron-dependent regulated cell-death pathway,
          and acute iron poisoning is the most extreme iron load a human tissue encounters — so the pathway
          is an obvious candidate for the cell death in this disease. But that inference runs from the
          general mechanism to this disease, not from evidence in it: the acute-iron-poisoning literature
          is a clinical toxicology literature of case series and poison-centre surveillance, and it predates
          the description of ferroptosis. No ferroptosis marker has been demonstrated in human acute iron
          poisoning tissue. The distinction is not academic, because a regulated pathway is druggable
          in ways that Fenton-chemistry damage is not: if ferroptosis carries a meaningful share of the
          hepatocyte death, a ferroptosis inhibitor becomes a candidate adjunct to chelation. This entry
          therefore curates the oxidative organelle injury it has evidence for, and records ferroptosis
          as an untested possibility rather than annotating GO:0097707 on the pathograph.

          The gap is wider than ferroptosis alone. PMID:11978485 proposes a separate, explicitly non-exclusive
          route in which iron-catalysed oxidative destabilisation of lysosomes spills digestive enzymes
          into the cytoplasm and ends in apoptotic or necrotic death. So there are at least two mechanistically
          distinct candidate death routes on offer — lipid-peroxidative ferroptosis and lysosomal rupture
          — and the acute iron poisoning literature demonstrates neither. Both are drawn from chronic
          iron-overload and general iron-toxicity biology. Establishing which, if either, carries the
          hepatocyte death in acute poisoning is the question; the experiments below should discriminate
          between them rather than test ferroptosis in isolation.

          A third literature bears on this without being about it, and it argues for restraint rather
          than for ferroptosis. Acetaminophen hepatotoxicity is the best-studied iron-dependent drug-induced
          liver injury, and a critical review of it warns in general terms against applying death mechanisms
          across cell types and disease states without validation, then concludes from the published data
          that hepatic antioxidant defences normally hold lipid peroxidation below pathophysiological
          relevance, so that ferroptosis becomes a significant mode of drug-induced cell death only where
          those defences are severely compromised. Acute iron poisoning is a plausible candidate for exactly
          that compromised state, which is the argument for testing it, not a demonstration that it holds.
          The same literature also supplies a specific route that would connect the two organelles this
          entry annotates on one node: lysosomal damage releasing iron that the mitochondrial calcium
          uniporter then takes up, making the lysosome the source and the mitochondrion the site. Whether
          that relay operates in iron poisoning, where the iron arrives from outside the cell rather than
          from a damaged lysosome, is untested and is worth distinguishing in the experiments below.'
        proposed_experiments:
        - experiment_id: death_route_discrimination_in_poisoning_liver
          name: Discriminate the ferroptotic and lysosomal death routes in poisoned liver
          description: 'In explanted or post-mortem liver from acute iron poisoning, benchmarked against
            liver injured by a non-iron hepatotoxin, assay both candidate routes in the same tissue: lipid-peroxidation
            products and ferroptosis-associated transcriptional signatures for the ferroptotic route,
            and lysosomal membrane permeabilisation — cathepsin release into the cytosol, LAMP staining
            — for the lysosomal route. The point is to discriminate between them, so a design that assays
            only one cannot answer the question. The non-iron comparator is what separates an iron-specific
            death signature from generic oxidative necrosis.'
        - experiment_id: gpx4_readout_validation_against_selenium_status
          name: Validate GPX4 abundance as a ferroptosis readout against selenium status
          description: Before GPX4 abundance is used as an index of ferroptotic pressure in poisoned tissue,
            establish what it is measuring. GPX4 is a selenoprotein whose expression tracks intracellular
            selenium utilisation and selenoprotein-synthesis capacity, so a low GPX4 in poisoned liver
            may reflect selenium status rather than iron-driven consumption. Measure selenium status and
            selenoprotein-synthesis capacity alongside GPX4 in the same specimens and test whether GPX4
            varies with iron exposure once selenium status is accounted for. If it does not, the lipid
            hydroperoxide products should be the primary ferroptosis readout in the discrimination experiment
            above.
        - experiment_id: ferroptosis_inhibition_rat_acute_iron_model
          name: Ferroptosis inhibition in the rat acute oral iron model
          description: Add a ferroptosis inhibitor to the established rat acute oral iron LD50 model,
            alone and with chelation, and measure mortality, transaminases and hepatic histology. A survival
            benefit beyond chelation alone would establish a regulated-death contribution and a therapeutic
            target.
      selected_evidence:
        snippet: An alternative-and not mutually exclusive-mechanism for cellular iron toxicity involves
          iron-catalyzed oxidative destabilization of lysosomes, leading to leak of digestive enzymes
          into the cell cytoplasm and eventuating in apoptotic or necrotic cell death.
        supports: SUPPORT
