  39379ea38b2600d1ac966888f7869778d62a437d39c1ff4cd9a464e3bfb478e3:
    claim:
      about:
        disease:
          name: Iron Poisoning
          disease_term:
            preferred_term: iron poisoning
            term:
              id: MONDO:0800385
              label: iron poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: iron_effects_on_fibrinogen_versus_proteases
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: This entry models the coagulopathy of acute iron poisoning as reversible iron inhibition
          of the coagulation serine proteases, leaving fibrinogen itself undamaged. A separate literature
          reports the opposite kind of effect, in which ferric iron generates hydroxyl radicals that convert
          fibrinogen into fibrinolysis-resistant fibrin. Do both happen in acute iron poisoning, and if
          the second does, is the coagulopathy still correctable by removing the iron?
        attaches_to:
        - pathophysiology#Reversible Iron Inhibition of Coagulation Serine Proteases
        rationale: 'The two reported effects are not variants of one another. PMID:6421970, the source
          this entry''s coagulation node is built on, found iron inactivating thrombin, factor Xa and
          kallikrein reversibly while leaving the zymogens and fibrinogen intact, which is an anticoagulant
          effect and matches the bleeding seen clinically. PMID:23170793 reports ferric ions generating
          hydroxyl radicals that convert fibrinogen into dense matted deposits with permanent resistance
          to enzymatic degradation, which is a prothrombotic effect on the substrate the first paper found
          undamaged.

          Three things keep this a gap rather than a contradiction to resolve. The second finding comes
          from a chronic degenerative disease frame, atherosclerosis and diabetes, where the iron burden
          and its time course are nothing like an overdose. The two describe different iron species and
          different targets, so they can both be true without meeting. And no cited source looks for fibrinogen
          structural change in acute iron poisoning at all.

          What makes it worth recording is that the entry''s node carries a therapeutic implication which
          the second mechanism would not share. Protease inhibition is reversible, so the node states
          the coagulopathy is in principle correctable by chelation rather than only by factor replacement.
          A structural conversion of fibrinogen described as permanently resistant to degradation would
          not be undone by removing the iron. If both operate, chelation would correct one arm of the
          coagulopathy and not the other, and the node''s framing is incomplete rather than wrong.'
        proposed_experiments:
        - experiment_id: fibrinogen_structure_in_acute_iron_poisoning_plasma
          name: Look for fibrinogen structural change in acute iron poisoning plasma
          description: 'In plasma from patients with acute iron poisoning, sampled before and after chelation,
            assay both arms in the same specimens: protease activity for the reversible inhibition arm,
            and clot ultrastructure with fibrinolytic susceptibility for the fibrinogen arm. The discriminating
            result is what chelation does to each. Recovery of protease activity without recovery of clot
            architecture would show the two arms coming apart and would qualify the claim that this coagulopathy
            is correctable by removing the iron. Benchmark against plasma from a non-iron coagulopathy
            so that any change is attributable to iron rather than to critical illness.'
      selected_evidence:
        snippet: A characteristic feature of DMDs is their remarkable and permanent resistance to the
          enzymatic degradation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23170793
      reference_title: Oxidation inhibits iron-induced blood coagulation.
      evidence_source: IN_VITRO
      explanation: The property that gives this gap its therapeutic edge. The node's claim that the coagulopathy
        is correctable by removing the iron rests on the inhibition being reversible; a fibrin deposit
        described as permanently resistant to enzymatic degradation would not be reversed by chelation.
        PARTIAL on the same disease-frame grounds.
