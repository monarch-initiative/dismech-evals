        context: []
      assertion_type: Stage
      assertion:
        name: Phase 4 - Gastric or duodenal stenosis (2 to 6 weeks)
        description: A late phase seen mainly in young children, in which vomiting recurs because the
          healed iron-induced ulcers have narrowed the gastric outlet or duodenum.
        notes: Emergency-medicine sources commonly teach a five-stage scheme that splits the hepatotoxicity
          of days 2-5 into a stage of its own between shock and late stenosis. The four-phase scheme curated
          here is the one stated in the cited source; the two describe the same course at different granularity,
          and the hepatic injury is carried in this entry by the Periportal Hepatocellular Necrosis pathophysiology
          node.
      selected_evidence:
        snippet: The last (fourth) phase, 2 to 6 weeks after ingestion, is only likely to develop in young
          children and is characterised by recurrence of vomiting due to gastric or duodenal stenosis
          caused by healing of iron-induced mucosal ulcers.
        supports: SUPPORT
