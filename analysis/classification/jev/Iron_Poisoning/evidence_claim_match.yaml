      assertion:
        name: Serum iron concentration
        reference_ranges:
        - lower_bound: 50.0
          upper_bound: 150.0
          unit: microg/dL
          population: general reference interval cited for acute-poisoning comparison
          notes: Quoted as the reference range against which acute poisoning concentrations are judged
            in a review of iron-poisoning hepatotoxicity, not derived from a laboratory reference-interval
            study. Equivalent to 9-27 micromol/L in the same source.
          interpretation_bands:
          - name: Reference interval
            lower_bound: 50.0
            upper_bound: 150.0
            unit: microg/dL
            abnormal_flag: NORMAL
          - name: At or above the conventional toxic threshold when symptomatic
            lower_bound: 350.0
            upper_bound: 500.0
            unit: microg/dL
            abnormal_flag: HIGH
            interpretation: By long-standing convention a concentration of 350 microg/dL is considered
              toxic in a patient who has symptoms, and likely to need treatment to prevent decompensation.
              Below 500 microg/dL the convention is conditional on the presence of symptoms, which is
              why this band is separated from the one below it. Curated as the tradition its source describes
              it as, not as a validated decision threshold; the serum_iron_versus_ingested_dose discussion
              is the context to read it in.
          - name: At or above the conventional toxic threshold regardless of symptoms
            lower_bound: 500.0
            upper_bound: 1700.0
            unit: microg/dL
            abnormal_flag: HIGH
            interpretation: 'At or above 500 microg/dL the conventional threshold no longer depends on
              whether the patient has symptoms. The upper bound of this band is not a second threshold:
              it is simply where the band reporting the lowest concentration ever observed with hepatotoxicity
              begins.'
          - name: At or above the lowest concentration reported with hepatotoxicity
            lower_bound: 1700.0
            unit: microg/dL
            abnormal_flag: CRITICAL_HIGH
            severity: SEVERE
            interpretation: 1700 microg/dL is the lowest acute serum iron concentration reported in association
              with hepatotoxicity, not a validated decision threshold. Hepatotoxicity has not been shown
              to be excluded below it.
            phenotype_term:
              preferred_term: Hepatic necrosis
              term:
                id: HP:0002605
                label: Hepatic necrosis
        notes: 'The measured serum iron concentration is the central laboratory quantity in iron poisoning:
          it feeds the chelation decision, separates acute poisoning from chronic overload, and in severe
          poisoning runs an order of magnitude above the normal interval. That said, its clinical usefulness
          is contested: PMID:14722368 reports that in a 21-patient paediatric cohort the ingested dose
          and clinical signs guided management while the serum iron did not, and that vin-rose urine was
          absent in 31% of chelated patients even with a high serum iron. The reference interval and the
          hepatotoxicity-associated concentration below are curated as measurements, not as decision rules.
          The conventional toxicity thresholds are curated in the interpretation bands above, as a tradition
          rather than as validated cutoffs. They were previously left out of this entry for want of a
          quotable source, the consensus guideline that states them having cached with an empty body;
          PMID:39509998 states them in its own background and so supplies the quotation. What that fixes
          is attribution, not validation, and the serum_iron_versus_ingested_dose discussion is the context
          a curator should read them in.

          The 150 to 350 microg/dL range is deliberately unbanded. It sits above the reference interval
          and below the lower conventional toxicity threshold, and no source this entry can quote says
          what a concentration there means. That gap is the honest state of the evidence rather than an
          oversight to patch; a band invented to fill it would assert an interpretation nobody has published.'
      selected_evidence:
        snippet: By using estimates of the total body burden of iron, clinical symptoms, and the serum
          iron concentration, an appropriate decision can be made to initiate aggressive chelation therapy
          with deferoxamine.
        supports: SUPPORT
