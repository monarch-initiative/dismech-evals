            phenotype_term:
              preferred_term: Hepatic necrosis
              term:
                id: HP:0002605
                label: Hepatic necrosis
        notes: 'The measured serum iron concentration is the central laboratory quantity in iron poisoning:
          it feeds the chelation decision, separates acute poisoning from chronic overload, and in severe
          poisoning runs an order of magnitude above the normal interval. That said, its clinical usefulness
          is contested: PMID:14722368 reports that in a 21-patient paediatric cohort the ingested dose
          and clinical signs guided management while the serum iron did not, and that vin-rose urine was
          absent in 31% of chelated patients even with a high serum iron. The reference interval and the
          hepatotoxicity-associated concentration below are curated as measurements, not as decision rules.
          The conventional toxicity thresholds are curated in the interpretation bands above, as a tradition
          rather than as validated cutoffs. They were previously left out of this entry for want of a
          quotable source, the consensus guideline that states them having cached with an empty body;
          PMID:39509998 states them in its own background and so supplies the quotation. What that fixes
          is attribution, not validation, and the serum_iron_versus_ingested_dose discussion is the context
          a curator should read them in.

          The 150 to 350 microg/dL range is deliberately unbanded. It sits above the reference interval
          and below the lower conventional toxicity threshold, and no source this entry can quote says
          what a concentration there means. That gap is the honest state of the evidence rather than an
          oversight to patch; a band invented to fill it would assert an interpretation nobody has published.'
      selected_evidence:
        snippet: Traditionally, a concentration of 350 μg/dL with symptoms, or 500 μg/dL without symptoms,
          is considered toxic and will likely need treatment to prevent decompensation.
