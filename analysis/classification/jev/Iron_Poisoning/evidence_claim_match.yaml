          description: Add a ferroptosis inhibitor to the established rat acute oral iron LD50 model,
            alone and with chelation, and measure mortality, transaminases and hepatic histology. A survival
            benefit beyond chelation alone would establish a regulated-death contribution and a therapeutic
            target.
      selected_evidence:
        snippet: Loss of PRDX6 decreases the expression of selenoproteins and induces ferroptosis via
          a reduction in GPX4.
        supports: NO_EVIDENCE
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/5
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38867112
      reference_title: PRDX6 augments selenium utilization to limit iron toxicity and ferroptosis.
      evidence_source: IN_VITRO
      explanation: Cited ONLY as a caveat on how this gap should be tested, not as evidence about acute
        iron poisoning. It is cell-line selenium biology with no ingestion, no human subject and no poisoning,
        and the "iron toxicity" of its title means ferroptotic death in culture rather than the clinical
        syndrome. What it contributes is that GPX4 abundance is set by selenoprotein-synthesis capacity,
        which makes a low GPX4 an ambiguous readout in the proposed post-mortem experiment above. It does
        nothing to close this gap; if anything it shows how far the ferroptosis literature sits from the
        disease.
