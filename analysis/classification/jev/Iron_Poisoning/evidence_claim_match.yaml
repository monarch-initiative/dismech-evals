      assertion_type: Pathophysiology
      assertion:
        name: Non-Transferrin-Bound Iron in Plasma
        biological_scale: MOLECULAR
        description: Once absorbed iron exceeds the binding capacity of transferrin, iron circulates unbound
          to its physiological carrier. This non-transferrin-bound fraction is redox-active and enters
          cells outside transferrin-receptor control, so the cellular iron-handling machinery that would
          normally throttle uptake is bypassed. It is the species to which the systemic, as opposed to
          corrosive, manifestations of iron poisoning are attributed.
        chemical_entities:
        - preferred_term: iron(3+)
          term:
            id: CHEBI:29034
            label: iron(3+)
        biological_processes:
        - preferred_term: iron ion transport
          term:
            id: GO:0006826
            label: iron ion transport
          modifier: INCREASED
      selected_evidence:
        snippet: The pathophysiological significance of NTBI and LPI lies in their ability to enter cells
          via alternative transport pathways that are not regulated by the transferrin receptor system
          or by cellular iron levels.
        supports: SUPPORT
