              id: MONDO:0800385
              label: iron poisoning
        context: []
      assertion_type: Environmental
      assertion:
        name: Unintentional ingestion of iron supplements by young children
        description: 'The classic exposure: a child under five swallows adult-strength iron tablets or
          prenatal vitamins from a household supply. Acute iron poisoning is most common in this age group,
          and the exposure is determined by product availability and packaging rather than by any host
          factor.'
        exposure_term:
          preferred_term: exposure to iron via ingestion
          term:
            id: ECTO:0900035
            label: exposure to iron via ingestion
        effect: Establishes the ingested iron burden that initiates poisoning.
        notes: 'The packaging story is more equivocal than it is usually told. Deaths in children under
          six fell from 29 to 1 across the 1997 unit-dose packaging regulation (PMID:15939855), but that
          mandate was vacated in 2003 after Nutritional Health Alliance v. FDA, and a 2000-2017 National
          Poison Data System cohort found severe exposures continued to decline anyway (DOI:10.1177/0009922819901010).
          A third strand cuts the same way from the other end of the timeline: PMID:10798501, published
          before the mandate could have had an effect, reports paediatric iron fatalities already falling
          from a peak of 10 in 1991 to 2 by 1995. All three results are curated here; none is a controlled
          comparison, and the entry does not assert that packaging alone caused the fall.

          The same source undercuts a simpler reading of the exposure itself. Child-resistant containers
          were already in use, and children were getting the iron out of them anyway, or out of ones an
          adult had left open. That is why the regulatory move was to unit-dose blistering rather than
          to more child resistance, and it is part of why this exposure is described above as set by product
          form rather than by any host factor.'
      selected_evidence:
        snippet: Multiple factors-including legal and manufacturing practices-have changed the landscape
          of iron poisoning over the decades.
        supports: SUPPORT
    origin:
