        name: Serum iron concentration
        description: 'How much weight the serum iron concentration should carry is contested, and this
          entry does not settle it. On one account it is one of three inputs to the chelation decision,
          alongside an estimate of the ingested body iron burden and the clinical features, and the ingested
          dose is unusable as a severity measure because it is rarely known accurately and absorption
          is unpredictable once vomiting and diarrhoea have removed some of it. A paediatric cohort reports
          the reverse on both counts: the dose and the clinical signs guided management and the serum
          iron did not. A third series reports the strongest quantitative result on this question in either
          direction, and reports it within a severity stratum rather than pooled: among patients whose
          symptoms stayed minor, an early concentration at or below 300 microg/dL was followed by no later
          toxic concentration at all. All three positions are curated below, together with the conventional
          toxicity thresholds and the reason a concentration drawn too soon can under-read the exposure
          rather than measure it. The one use not in dispute is discriminating this disease from the chronic
          iron-overload states that share a MONDO synonym with it.'
        notes: The value of the serum iron concentration is genuinely contested in the cited literature
          and this entry does not resolve it; see the serum_iron_versus_ingested_dose CONTROVERSY discussion,
          which states the disagreement and what would settle it. Both positions are curated here with
          their evidence rather than one being chosen. A curator adding a numeric decision threshold should
          treat that disagreement as the context for the threshold, not curate the threshold as settled.
          The conventional thresholds are now curated on the biochemical entry on exactly that footing.
      selected_evidence:
        snippet: In this case series, a concentration of 300 μg/dL or less between 2 and 4 h was the ideal
          cutoff to predicting subsequent potentially toxic concentrations, with a sensitivity of 100 %
          and a specificity of 54 %.
        supports: SUPPORT
