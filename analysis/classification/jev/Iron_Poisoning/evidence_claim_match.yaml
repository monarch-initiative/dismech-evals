      assertion:
        name: Serum iron concentration
        reference_ranges:
        - lower_bound: 50.0
          upper_bound: 150.0
          unit: microg/dL
          population: general reference interval cited for acute-poisoning comparison
          notes: Quoted as the reference range against which acute poisoning concentrations are judged
            in a review of iron-poisoning hepatotoxicity, not derived from a laboratory reference-interval
            study. Equivalent to 9-27 micromol/L in the same source.
          interpretation_bands:
          - name: Reference interval
            lower_bound: 50.0
