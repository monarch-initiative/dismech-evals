    evidence_metadata:
      reference: PMID:39509998
      reference_title: Utility of iron concentration two to four hours post ingestion in predicting toxicity.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Gives the operating characteristics behind that rule-out, and the specificity is the
        half a curator should not drop: 54% means roughly half the patients the cutoff flags do not go
        on to a toxic concentration. A sensitive rule-out with poor specificity is useful for deciding
        whom to stop watching and close to useless for deciding whom to chelate, which is the distinction
        the contested-threshold discussion in this entry turns on.'
