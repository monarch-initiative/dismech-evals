  e65883dec8bcad0726afeb02e361884522782c394572e79711f31e0a230018bf:
    claim:
      about:
        disease:
          name: Iron Poisoning
          disease_term:
            preferred_term: iron poisoning
            term:
              id: MONDO:0800385
              label: iron poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: serum_iron_versus_ingested_dose
        kind: CONTROVERSY
        status: OPEN
        prompt: In acute iron poisoning, which better identifies the patient who will develop toxicity
          — the serum iron concentration, or the suspected ingested dose of elemental iron? The cited
          literature does not agree. Two paediatric cohorts answer in opposite directions, and a third
          series finds a timed serum-iron cutoff with complete negative predictive value inside the mild-symptom
          stratum.
        attaches_to:
        - diagnosis#Serum iron concentration
        - biochemical#Serum iron concentration
        - pathophysiology#Ingestion of Iron in Excess of Absorptive and Binding Capacity
        rationale: 'How to read the enums here, first, because they are counter-intuitive. Every evidence
          item on this discussion is marked SUPPORT, including items on opposite sides of the question,
          because what each supports is the claim that the literature disagrees, and that is this discussion''s
          only claim. There is no schema slot for which side a source is on; the explanations carry it.
          The polarity that takes a side lives on the serum-iron diagnosis entry instead, where the claim
          being supported or refuted is that the serum iron is informative.

          This is a live disagreement between published positions rather than a gap, and both positions
          are curated on the serum-iron diagnosis entry with their own evidence. PMID:14722368, a 21-patient
          Indian cohort with four deaths, found the ingested dose and clinical signs guided management
          while the serum iron did not help. PMID:34121325, a 54-patient Australian cohort of unintentional
          exposures with no severe toxicity, found the reverse on both counts: peak serum iron separated
          symptomatic from asymptomatic children at P < 0.001, while suspected dose did not differ between
          them.

          The cohorts are not interchangeable and the difference may be the answer rather than a contradiction.
          One is a referral series containing deaths; the other is a poisons-information-service series
          of unintentional exposures in which nobody became severely toxic. A measurement can discriminate
          mild toxicity from none and still fail to guide management once a child is already shocked,
          and an ingested dose reported by a parent may be estimated very differently in the two settings.
          Nothing cited here resolves which explanation holds.

          A third series, PMID:39509998, narrows the disagreement without settling it, and narrows it
          along the axis the proposed experiment below names. It analysed the serum iron inside a severity
          stratum rather than pooled and found it discriminating in the mild one: among patients whose
          symptoms stayed minor, a concentration at or below 300 microg/dL drawn 2 to 4 hours after ingestion
          was followed by no subsequent toxic concentration, giving complete negative predictive value.
          That is the mild-range half of the stratified prediction below, arriving from a study that was
          run without reference to it. It is not the whole of that prediction: no severe stratum was analysed,
          the ingested dose was not compared against the concentration, and the abstract does not report
          the age distribution of its 75 patients, so it does not stand as a third paediatric cohort.
          Its specificity of 54% also bounds what it licenses, since a rule for whom to stop watching
          is not a rule for whom to chelate.

          The practical consequence has changed in one respect and not in the other. This entry now curates
          the conventional serum-iron thresholds, on the biochemical entry, because PMID:39509998 states
          them quotably and they are curated as what its own sentence calls them, a tradition, rather
          than as validated cutoffs. The elemental-iron dose bands remain curated nowhere: no source this
          entry can quote states them, and unlike the serum concentration the ingested dose has now failed
          to discriminate outright in one cohort.'
        proposed_experiments:
        - experiment_id: serum_iron_versus_dose_discrimination_by_severity_stratum
          name: Test both predictors against outcome, stratified by severity stratum
          description: 'In a cohort spanning both settings - unintentional exposures and referred severe
            poisonings - record suspected ingested dose and timed serum iron against a hard outcome, and
            analyse within severity strata rather than pooled. The specific question is whether serum
            iron discriminates in the mild range while dose discriminates in the severe range, which would
            make both cited findings correct in their own populations and would explain the disagreement
            without either being wrong. Report how the ingested dose was ascertained, since parental estimate
            and pharmacy reconciliation are not the same measurement. PMID:39509998 is a partial instance
            of this design and is the reason it is worth running in full: it stratified by symptom severity
            and found the serum iron discriminating in the mild stratum, but analysed no severe stratum
            and did not put the ingested dose alongside the concentration in the same comparison.'
      selected_evidence:
        snippet: Suspected dose ingested is a poor predictor of toxicity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
