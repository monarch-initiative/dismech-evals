              label: iron poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: evidence_base_quality_for_diagnosis_and_management
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: The diagnostic and management claims in this entry rest on case series, expert consensus,
          animal studies and adult volunteer studies rather than on controlled human trials in acute iron
          poisoning. Which of them would survive a trial-grade evidence base, and which are conventions
          that have persisted for want of better data?
        attaches_to:
        - diagnosis#Serum iron concentration
        - diagnosis#Abdominal radiography for retained iron tablets
        - treatments#Whole Bowel Irrigation
        - treatments#Oral Deferiprone (investigational for acute poisoning)
        rationale: 'This is a standing limitation on the entry rather than a gap in one mechanism, and
          it is stated by a review of the field rather than inferred here: diagnosis and management of
          iron poisoning have minimally evolved, and the evidence for them remains principally case series,
          expert consensus, animal studies and adult volunteer studies. That is visible throughout this
