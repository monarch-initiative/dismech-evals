          to its physiological carrier. This non-transferrin-bound fraction is redox-active and enters
          cells outside transferrin-receptor control, so the cellular iron-handling machinery that would
          normally throttle uptake is bypassed. It is the species to which the systemic, as opposed to
          corrosive, manifestations of iron poisoning are attributed.
        chemical_entities:
