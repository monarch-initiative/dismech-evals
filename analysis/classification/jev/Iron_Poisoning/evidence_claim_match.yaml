          and acute iron poisoning is the most extreme iron load a human tissue encounters — so the pathway
          is an obvious candidate for the cell death in this disease. But that inference runs from the
          general mechanism to this disease, not from evidence in it: the acute-iron-poisoning literature
          is a clinical toxicology literature of case series and poison-centre surveillance, and it predates
          the description of ferroptosis. No ferroptosis marker has been demonstrated in human acute iron
          poisoning tissue. The distinction is not academic, because a regulated pathway is druggable
          in ways that Fenton-chemistry damage is not: if ferroptosis carries a meaningful share of the
          hepatocyte death, a ferroptosis inhibitor becomes a candidate adjunct to chelation. This entry
          therefore curates the oxidative organelle injury it has evidence for, and records ferroptosis
          as an untested possibility rather than annotating GO:0097707 on the pathograph.

          The gap is wider than ferroptosis alone. PMID:11978485 proposes a separate, explicitly non-exclusive
          route in which iron-catalysed oxidative destabilisation of lysosomes spills digestive enzymes
          into the cytoplasm and ends in apoptotic or necrotic death. So there are at least two mechanistically
          distinct candidate death routes on offer — lipid-peroxidative ferroptosis and lysosomal rupture
          — and the acute iron poisoning literature demonstrates neither. Both are drawn from chronic
          iron-overload and general iron-toxicity biology. Establishing which, if either, carries the
          hepatocyte death in acute poisoning is the question; the experiments below should discriminate
          between them rather than test ferroptosis in isolation.

          A third literature bears on this without being about it, and it argues for restraint rather
          than for ferroptosis. Acetaminophen hepatotoxicity is the best-studied iron-dependent drug-induced
          liver injury, and a critical review of it warns in general terms against applying death mechanisms
          across cell types and disease states without validation, then concludes from the published data
          that hepatic antioxidant defences normally hold lipid peroxidation below pathophysiological
          relevance, so that ferroptosis becomes a significant mode of drug-induced cell death only where
          those defences are severely compromised. Acute iron poisoning is a plausible candidate for exactly
          that compromised state, which is the argument for testing it, not a demonstration that it holds.
