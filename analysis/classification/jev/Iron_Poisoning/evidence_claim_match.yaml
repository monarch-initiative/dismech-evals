      assertion_type: Treatment
      assertion:
        name: Whole Bowel Irrigation
        description: Whole bowel irrigation with polyethylene glycol solution is used to clear unabsorbed
          iron tablets from the gut. It is specifically endorsed for substantial iron ingestions because
          the morbidity is high and other decontamination options are lacking — activated charcoal does
          not absorb iron and gastric lavage is a questionable intervention.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: gastrointestinal decontamination by whole bowel irrigation
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
        notes: Contraindicated in bowel obstruction, perforation, ileus, haemodynamic instability, or
          a compromised unprotected airway — relevant in iron poisoning, where shock and late obstruction
          both occur.
      selected_evidence:
        snippet: Although some volunteer studies have shown substantial decreases in the bioavailability
          of ingested drugs, no controlled clinical trials have been performed and there is no conclusive
          evidence that WBI improves the outcome of the poisoned patient.
        supports: SUPPORT
