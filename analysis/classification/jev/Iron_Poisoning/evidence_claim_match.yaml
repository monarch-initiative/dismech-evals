  2796b7c28450e7873300a99fc5c1fb421d99e3e873f2b2938a97f757c518c633:
    claim:
      about:
        disease:
          name: Iron Poisoning
          disease_term:
            preferred_term: iron poisoning
            term:
              id: MONDO:0800385
              label: iron poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Iron-Catalysed Oxidative Organelle Injury
        biological_scale: CELLULAR
        description: 'Redox-active iron entering cells catalyses Fenton-type generation of reactive oxygen
          species, peroxidising membrane lipids and damaging intracellular organelles. The affected cells
          are those exposed to the highest iron flux — the mucosa in contact with the ingested salt and,
          through the portal circulation, the hepatocyte. Two organelles are proposed as the proximate
          targets: mitochondria, which may make cells with high mitochondrial activity preferentially
          vulnerable, and lysosomes, whose iron-catalysed oxidative destabilisation releases digestive
          enzymes into the cytoplasm. Both routes are described in the cellular iron-toxicity literature
          rather than demonstrated in acute poisoning — see this node''s notes.'
        biological_processes:
        - preferred_term: iron-catalysed reactive oxygen species generation
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
          modifier: INCREASED
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
          modifier: INCREASED
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        - preferred_term: lysosome
          term:
            id: GO:0005764
            label: lysosome
        notes: 'The organelle-level detail on this node comes from PMID:11978485, a review whose clinical
          frame is hereditary and secondary haemochromatosis, not acute ingestion. It is used here because
          the mitochondrial and lysosomal routes it describes are cell-level mechanisms that do not depend
          on how the iron arrived, and because acute iron poisoning has no comparable mechanistic literature
          of its own. That extrapolation is the reason all three items are PARTIAL. One arm of the same
          review is deliberately NOT curated: its proposal that iron-mediated damage to the mitochondrial
          genome accumulates mutational events is explicitly about long-term toxicity, and cannot apply
          to a poisoning that kills within about 48 hours. This is the trap the entry''s top-level notes
          warn about — literature reached through the "iron overload" synonym is usually about the chronic
          disorders — and it is recorded here rather than resolved silently.'
      selected_evidence:
        snippet: They also cause metabolic acidosis by interfering with intermediary metabolism and producing
          shock and reduced tissue perfusion.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:3784842
      reference_title: Management of acute iron poisoning.
      evidence_source: HUMAN_CLINICAL
      explanation: Attributes the metabolic derangement of iron poisoning to interference with intermediary
        metabolism, the clinical expression of this node.
