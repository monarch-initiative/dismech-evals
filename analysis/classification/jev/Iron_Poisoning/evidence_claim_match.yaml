        target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Reproduces the defining exposure of human iron poisoning — a single acute oral iron
          load large enough to kill — and the gastrointestinal iron accumulation that follows it.
        limitations: The dose is set at the rodent LD50 rather than scaled from human ingestions, and
          rodent gastrointestinal anatomy and dosing pharmacokinetics differ from the human paediatric
          case; LD50 estimates for iron salts vary widely between studies and strains, so this model supports
          relative comparisons (chelated versus unchelated) far better than absolute human dose extrapolation.
        readouts:
        - name: Mortality after acute oral iron load
          target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
          direction: DECREASED
          interpretation: 'Direction is stated relative to the unchelated model arm: the model itself
            is lethal at this iron dose, and mortality fell when oral chelation was added, showing the
            lethality is iron-dependent and chelation-modifiable.'
        - name: Gastrointestinal tissue iron accumulation
          target: Ingestion of Iron in Excess of Absorptive and Binding Capacity
          direction: DECREASED
          interpretation: 'Direction is stated relative to the unchelated model arm: the model accumulates
            gastrointestinal tissue iron, and that accumulation fell dose-dependently with chelation,
            tying the readout to the iron burden.'
      selected_evidence:
        snippet: Our objective was to determine whether orally administered deferiprone can reduce the
          mortality of rats following acute, toxic, oral doses of iron.
        supports: SUPPORT
