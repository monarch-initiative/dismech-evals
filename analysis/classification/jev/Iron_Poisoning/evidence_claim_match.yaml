        context: []
      assertion_type: Diagnosis
      assertion:
        name: Abdominal radiography for retained iron tablets
        description: Iron tablets are visible on abdominal radiography, so a film both supports the diagnosis
          and shows how much unabsorbed tablet burden remains. That is what gates whole bowel irrigation
          and tells the clinician when to stop it — the rectal effluent can run clear while radiography
          still shows iron in the gut, so the effluent alone is not a reliable endpoint.
        notes: A single case report, so it establishes that radiography shows retained iron and that effluent
          clearing is an unreliable endpoint, not the test's sensitivity or specificity. A negative film
          does not exclude a significant ingestion; that limitation was not sourced to a cached reference
          and is deliberately not asserted here.
      selected_evidence:
        snippet: The rectal effluent cleared within 2 days of the start of PEG-ELS therapy despite the
          persistence of iron in the gastrointestinal tract as shown on radiography.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
