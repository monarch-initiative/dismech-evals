      assertion_type: Pathophysiology
      assertion:
        name: Reversible Iron Inhibition of Coagulation Serine Proteases
        biological_scale: MOLECULAR
        description: Non-transferrin-bound iron reversibly inactivates the serine proteases of the coagulation
          cascade — thrombin, factor Xa and kallikrein — without damaging the zymogens or fibrinogen itself.
          This produces a coagulopathy that is mechanistically distinct from the coagulopathy of hepatic
          synthetic failure, an attribution the authors state as likely rather than established; the two
          may coexist in severe poisoning. Because the inhibition is relieved by removing the iron, it
          is in principle correctable by chelation rather than only by factor replacement.
        molecular_functions:
        - preferred_term: serine-type endopeptidase activity of the coagulation cascade
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
          modifier: DECREASED
      selected_evidence:
        snippet: 'Because the amidolytic activity of human thrombin as well as factor Xa, kallikrein,
          and bovine trypsin was also reversibly suppressed by ferrous sulfate as well as ferric citrate,
          we consider it likely that the coagulopathy occurring in iron poisoning is the consequence of
          a general, physiologically important phenomenon: the susceptibility of serine proteases to nontransferrin-bound
          Fe3+.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
      - /name
      - /disease_term
