          entry annotates on one node: lysosomal damage releasing iron that the mitochondrial calcium
          uniporter then takes up, making the lysosome the source and the mitochondrion the site. Whether
          that relay operates in iron poisoning, where the iron arrives from outside the cell rather than
          from a damaged lysosome, is untested and is worth distinguishing in the experiments below.'
        proposed_experiments:
        - experiment_id: death_route_discrimination_in_poisoning_liver
          name: Discriminate the ferroptotic and lysosomal death routes in poisoned liver
          description: 'In explanted or post-mortem liver from acute iron poisoning, benchmarked against
            liver injured by a non-iron hepatotoxin, assay both candidate routes in the same tissue: lipid-peroxidation
            products and ferroptosis-associated transcriptional signatures for the ferroptotic route,
            and lysosomal membrane permeabilisation — cathepsin release into the cytosol, LAMP staining
            — for the lysosomal route. The point is to discriminate between them, so a design that assays
            only one cannot answer the question. The non-iron comparator is what separates an iron-specific
            death signature from generic oxidative necrosis.'
        - experiment_id: gpx4_readout_validation_against_selenium_status
          name: Validate GPX4 abundance as a ferroptosis readout against selenium status
          description: Before GPX4 abundance is used as an index of ferroptotic pressure in poisoned tissue,
            establish what it is measuring. GPX4 is a selenoprotein whose expression tracks intracellular
            selenium utilisation and selenoprotein-synthesis capacity, so a low GPX4 in poisoned liver
            may reflect selenium status rather than iron-driven consumption. Measure selenium status and
            selenoprotein-synthesis capacity alongside GPX4 in the same specimens and test whether GPX4
            varies with iron exposure once selenium status is accounted for. If it does not, the lipid
            hydroperoxide products should be the primary ferroptosis readout in the discrimination experiment
            above.
