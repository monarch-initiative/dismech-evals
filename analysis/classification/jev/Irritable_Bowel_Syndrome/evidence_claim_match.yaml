        name: Microbiome Dysbiosis
        description: 'Altered composition and function of gut microbiota may contribute to symptoms. Post-infectious
          IBS follows gastroenteritis in some patients. Genus-level composition is modifiable by dietary
          fermentable substrate: adding high-amylose resistant starch to a low-FODMAP diet shifts composition
          and enriches the resistant-starch degrader Ruminococcus E. Whether such a shift moves the community
          toward a healthy-donor reference is untested, as the trials reporting it carry no healthy-control
          arm.

          '
        biological_processes:
        - preferred_term: Host-Microbiome Interaction
          term:
            id: GO:0044003
            label: symbiont-mediated perturbation of host process
      selected_evidence:
        snippet: Although the pathophysiology of IBS has not been fully elucidated, it involves dysregulation
          of communication between the brain and gut (brain-gut axis) which is associated with alterations
          in intestinal motility, gut permeability, visceral hypersensitivity and gut microbiota composition.
        supports: SUPPORT
