  d650ea720b4cd8d17e4c31dfa322c7981ecaf034b8b7fc134c5f35b0d04fe38a:
    claim:
      about:
        disease:
          name: Irritable Bowel Syndrome
          disease_term:
            preferred_term: irritable bowel syndrome
            term:
              id: MONDO:0005052
              label: irritable bowel syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: High-Amylose Resistant Starch and Psyllium Blend
        description: 'Supplementation of an established low-FODMAP diet with a blend of high-amylose maize
          resistant starch (HAMS) and psyllium husk, as an adjunct aimed at the microbial cost of FODMAP
          restriction rather than at symptom control. Distinct from psyllium monotherapy: the single trial
          reporting it used a psyllium-matched placebo, so the effects below are the incremental effect
          of the resistant-starch component on a psyllium background, not an effect of psyllium. Investigational
          — one small unreplicated preprint trial, with no guideline standing.'
        treatment_term:
          preferred_term: dietary intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
        notes: Trial registration and full composition (56 g dietary fibre per 100 g, of which 36 g is
          resistant starch) are in the cited preprint. Symptom severity, the trial's primary outcome,
          did not differ between arms; faecal and blood biomarkers were unchanged. Treat the microbiota
          and anxiety findings as secondary outcomes of a 13-vs-13 study pending peer review and replication.
      selected_evidence:
        snippet: ur gut® improved GI-specific anxiety (P = 0.01) and sexual subscale of QOL (P = 0.018).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PPR:PPR1298203
      reference_title: 'Dietary fibre blend improves gut health in patients with Irritable Bowel Syndrome
        following a low FODMAP diet: a randomised, double-blind control trial'
      evidence_source: HUMAN_CLINICAL
      explanation: Randomised double-blind trial (n=26, 13 per arm; non-peer-reviewed preprint) reporting
        improved GI-specific anxiety and the sexual subscale of quality of life in the blend arm. The
        comparator contained an identical psyllium dose, so this is the incremental effect of the resistant-starch
        component.
