  89acfc51f23238672a292601625c7f59ea483206e3b79363ba29c99b220ba7d4:
    claim:
      about:
        disease:
          name: Ischemic Stroke
          disease_term:
            preferred_term: Ischemic stroke
            term:
              id: MONDO:1060198
              label: ischemic stroke
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chronic Low-Grade Systemic Inflammation
        conforms_to: inflammaging#Chronic Low-Grade Sterile Inflammation
        biological_scale: ORGANISM
        description: 'Persistently raised circulating inflammatory markers, chiefly interleukin-6 and
          C-reactive protein, mark a higher risk of a first ischemic stroke and of recurrence after one.
          Genetic evidence that lower IL-6 signaling lowers the risk of large-artery and small-vessel
          stroke, but not cardioembolic stroke, suggests the IL-6 axis is causal rather than only a marker.
          In aged mice, age-related changes in blood-cell production generate atypical neutrophils that
          worsen the inflammatory response to stroke, and related neutrophil subsets track with worse
          reperfusion in elderly patients. Most of the human evidence concerns inflammation in general
          rather than inflammation driven by ageing, so this node is a disease-specific use of the inflammaging
          module. Anti-inflammatory treatment has not yet been shown to prevent stroke: low-dose colchicine
          did not reduce early recurrence in a large trial.'
        biological_processes:
        - preferred_term: Inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        - preferred_term: Cytokine production
          modifier: INCREASED
          term:
            id: GO:0001816
            label: cytokine production
      selected_evidence:
        snippet: CRP concentration has continuous associations with the risk of coronary heart disease,
          ischaemic stroke, vascular mortality, and death from several cancers and lung disease that are
          each of broadly similar size.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20031199
      reference_title: 'C-reactive protein concentration and risk of coronary heart disease, stroke, and
        mortality: an individual participant meta-analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Pooled prospective data link higher CRP to ischemic stroke risk. The association is
        shared with non-vascular deaths and depends considerably on conventional risk factors, so on its
        own it does not show that inflammation causes stroke.
