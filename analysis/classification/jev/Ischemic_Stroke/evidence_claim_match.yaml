      assertion_type: Pathophysiology
      assertion:
        name: Post-Ischemic Mitochondrial Dysfunction
        conforms_to: mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress
        biological_scale: CELLULAR
        description: After arterial occlusion and reperfusion, neuronal mitochondria generate reactive
          oxygen species and open the permeability transition pore, which couples the energy failure of
          the penumbra to neuronal death. In rodent focal ischemia, mitochondria in the ischemic focus
          lose respiratory capacity, and succinate that accumulates during ischemia is re-oxidized on
          reperfusion, driving the reactive oxygen species burst by reverse electron transport at complex
          I. This is an acute injury process, not the age-related decline the conformed module describes;
          the shared element is the bioenergetic-failure and oxidative-stress state. Mechanistic support
          is almost entirely from rodents, and the one randomized human test of targeting the pore (cyclosporine)
          missed its primary endpoint, so the causal weight of this node in human stroke is unsettled.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Oxidative Phosphorylation
          modifier: DECREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
        - preferred_term: Reactive Oxygen Species Metabolism
          modifier: INCREASED
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
        locations:
        - preferred_term: Cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
        - preferred_term: Striatum
          term:
            id: UBERON:0002435
            label: striatum
      selected_evidence:
        snippet: reactive oxygen species generated by mitochondrial electron transport escape cellular
          antioxidant defenses and promote highly damaging hydroxyl radical activity after transient brain
          ischemia in the rat
        supports: SUPPORT
