      reference: PMID:39157811
      reference_title: 'Global, regional, and national burden of ischemic stroke, 1990-2021: an analysis
        of data from the global burden of disease study 2021.'
      evidence_source: COMPUTATIONAL
      explanation: The GBD 2021 analysis estimates approximately 69.9 million prevalent ischemic-stroke
        cases worldwide and an age-standardized prevalence rate of 819.5 per 100,000. It analyzes 20 age
        groups and 204 countries/territories.
