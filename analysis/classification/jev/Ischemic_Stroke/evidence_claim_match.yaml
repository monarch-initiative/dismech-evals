            label: CTSD
        - preferred_term: BECN1
          term:
            id: hgnc:1034
            label: BECN1
      selected_evidence:
        snippet: autophagy was activated within 7 d of tMCAO induction, and it strengthened at 1 d and
          then weakened steadily from 3 to 7 d
