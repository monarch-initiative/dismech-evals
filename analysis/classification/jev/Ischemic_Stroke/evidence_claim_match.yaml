      assertion_type: Prevalence
      assertion:
        population: Global, all ages
        notes: GBD 2021 estimated about 69.9 million prevalent ischemic stroke cases globally, with an
          age-standardized prevalence rate of 819.5 per 100,000.
      selected_evidence:
        snippet: 'Data for this study was obtained from the 2021 Global Burden of Diseases, Injuries,
          and Risk Factors Study (GBD). To quantify temporal patterns and assess trends in age-standardized
          rates of ischemic stroke prevalence (ASPR), incidence (ASIR), mortality (ASDR), and DALYs, estimated
          annual percentage changes (EAPCs) were computed over the study period. The analyses were disaggregated
          by gender, 20 age categories, 21 GBD regions, 204 nations/territories, and 5 SDI quintiles.
          ... In 2021, the global burden of ischemic stroke remained substantial, with a total of 69,944,884.8
          cases with an ASPR of 819.5 cases per 100,000 individuals (95% UI: 760.3-878.7).'
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
