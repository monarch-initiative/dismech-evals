          value:
            name: Chronic Low-Grade Systemic Inflammation
            conforms_to: inflammaging#Chronic Low-Grade Sterile Inflammation
            biological_scale: ORGANISM
            description: 'Persistently raised circulating inflammatory markers, chiefly interleukin-6
              and C-reactive protein, mark a higher risk of a first ischemic stroke and of recurrence
              after one. Genetic evidence that lower IL-6 signaling lowers the risk of large-artery and
              small-vessel stroke, but not cardioembolic stroke, suggests the IL-6 axis is causal rather
              than only a marker. In aged mice, age-related changes in blood-cell production generate
              atypical neutrophils that worsen the inflammatory response to stroke, and related neutrophil
              subsets track with worse reperfusion in elderly patients. Most of the human evidence concerns
              inflammation in general rather than inflammation driven by ageing, so this node is a disease-specific
              use of the inflammaging module. Anti-inflammatory treatment has not yet been shown to prevent
              stroke: low-dose colchicine did not reduce early recurrence in a large trial.'
            biological_processes:
            - preferred_term: Inflammatory response
              modifier: INCREASED
