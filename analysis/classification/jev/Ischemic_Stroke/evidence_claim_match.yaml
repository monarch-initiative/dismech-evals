        description: 'Macroautophagy is activated within the ischemic penumbra after arterial occlusion,
          with autophagosome numbers and autophagy-marker (Beclin-1, LC3B) levels rising early and then
          declining over the following days as autophagic flux weakens. In parallel, the lysosomal protease
          cathepsin D (CTSD) is progressively lost, and this lysosomal dysfunction, rather than autophagy
          induction itself, is the step this node conforms to: loss of CTSD is sufficient to cause lysosomal
          dysfunction and aggravates neuronal death under oxygen-glucose deprivation, while restoring
          CTSD activity protects neurons.'
        cell_types:
        - preferred_term: neuron
