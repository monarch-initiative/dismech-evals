              oxygen species and open the permeability transition pore, which couples the energy failure
              of the penumbra to neuronal death. In rodent focal ischemia, mitochondria in the ischemic
              focus lose respiratory capacity, and succinate that accumulates during ischemia is re-oxidized
              on reperfusion, driving the reactive oxygen species burst by reverse electron transport
              at complex I. This is an acute injury process, not the age-related decline the conformed
              module describes; the shared element is the bioenergetic-failure and oxidative-stress state.
              Mechanistic support is almost entirely from rodents, and the one randomized human test of
              targeting the pore (cyclosporine) missed its primary endpoint, so the causal weight of this
              node in human stroke is unsettled.
