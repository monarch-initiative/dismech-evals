        name: Eye Field Transcription Factor Network Dosage Loss
        biological_scale: MOLECULAR
        role: trigger
        description: The proximal molecular lesion in most genetically explained cases is loss of functional
          dosage of a transcription factor that specifies and maintains the anterior neural-plate eye
          field. SOX2 and OTX2 act as dosage-sensitive hubs that bind regulatory elements of downstream
          eye-field genes including RAX and PAX6; heterozygous loss-of-function variants, whole-gene deletions
          and regulatory or copy-number lesions all reduce effective dosage. Biallelic loss of RAX, VSX2
          or FOXE3 removes the corresponding node outright. Because these factors act sequentially and
          combinatorially, the developmental stage at which the network first fails, rather than the identity
          of the gene alone, sets the severity of the resulting malformation.
        biological_processes:
        - preferred_term: eye field specification
