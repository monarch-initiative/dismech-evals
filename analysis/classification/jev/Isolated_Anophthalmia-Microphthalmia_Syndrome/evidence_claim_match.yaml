      assertion_type: Pathophysiology
      assertion:
        name: Retinoic Acid Signalling Deficiency
        biological_scale: MOLECULAR
        role: trigger
        description: A coherent sub-pathway converging on the same morphogenetic steps. Vitamin A (retinol)
          is delivered to the embryo bound to RBP4 and taken up by the membrane receptor STRA6; ALDH1A3
          (retinaldehyde dehydrogenase 3) oxidises retinaldehyde to all-trans retinoic acid; RARB transduces
          the signal in the nucleus. Loss of any step depletes retinoic acid in the ventral optic cup
          and periocular mesenchyme, impairing optic-cup morphogenesis and fissure closure. Biallelic
          ALDH1A3 variants account for approximately 11% of recessively inherited severe developmental
          eye anomalies. This node is also the point of convergence for the non-genetic retinoid causes
          (maternal vitamin A deficiency, exogenous retinoid teratogens), which perturb the same pathway
          from the opposite direction — both loss and gain of retinoic acid signalling cause structural
          eye defects.
