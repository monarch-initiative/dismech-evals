              in the protein''s C-terminal alpha helix 8, reported with late-onset angle-closure glaucoma
              and loss of visual acuity. TMEM98 sits in the same pathway as MYRF: Tmem98 expression falls
              in Myrf conditional knockout mouse eyes and the two proteins interact physically. The gene-disease
              assertion is thin — ClinGen''s Glaucoma and Neuro-Ophthalmology expert panel classifies
              TMEM98 for nanophthalmos 4 as Limited, and the Austrian pedigree report describes its own
              variant as potentially causative rather than established — so this row is curated with that
              reservation rather than as a settled locus.'
            genes:
            - preferred_term: TMEM98
              term:
                id: hgnc:24529
                label: TMEM98
          role: subtype
