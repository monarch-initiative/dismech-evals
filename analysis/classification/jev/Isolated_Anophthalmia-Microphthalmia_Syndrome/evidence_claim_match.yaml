                label: nanophthalmos 1
            description: Autosomal dominant nanophthalmos at the first mapped nanophthalmos locus, caused
              by MYRF variants. MYRF encodes a membrane-bound transcription factor of the retinal pigment
              epithelium that undergoes autoproteolytic cleavage for nuclear localization, so this locus
              places a small-eye phenotype downstream of retinal pigment epithelial transcriptional control
              rather than of optic vesicle or optic cup patterning. C-terminal alleles give predominantly
              isolated nanophthalmos and behave as partial rather than complete loss of function, while
              earlier truncating alleles give syndromic disease.
            genes:
            - preferred_term: MYRF
              term:
                id: hgnc:1181
                label: MYRF
          role: subtype
      assertion_type: Genetic
      assertion:
        name: MYRF
        gene_term:
          preferred_term: MYRF
          term:
            id: hgnc:1181
            label: MYRF
        relationship_type: CAUSATIVE
        subtype: NNO1
        notes: Autosomal dominant. MYRF is the gene at NNO1, the first mapped nanophthalmos locus, identified
          by combining pooled exome sequencing with the linkage data from the pedigree in which that locus
          was mapped. HGNC records C11orf9 as a previous symbol, which is worth knowing when reading the
          pre-2019 literature on this locus. The protein is a membrane-bound transcription factor of the
          retinal pigment epithelium that undergoes autoproteolytic cleavage for nuclear localization;
          C-terminal alleles reduce target-gene expression without preventing cleavage or localization,
          and act as partial loss of function, while earlier truncating alleles produce syndromic disease.
          The syndromic arm of MYRF disease is curated in this knowledge base under Congenital_Diaphragmatic_Hernia.
          In a Chinese nanophthalmos cohort of 43 pedigrees, variants were found only in MFRP, PRSS56
          and MYRF, and MYRF-related eyes were less short than MFRP- or PRSS56-related eyes.
      selected_evidence:
        snippet: We used combined pooled exome sequencing and strong linkage data in the large family
          used to map this locus to identify a canonical splice site alteration upstream of the last exon
          of the gene encoding myelin regulatory factor (MYRF c.3376-1G>A), a membrane bound transcription
          factor that undergoes autoproteolytic cleavage for nuclear localization.
        supports: SUPPORT
