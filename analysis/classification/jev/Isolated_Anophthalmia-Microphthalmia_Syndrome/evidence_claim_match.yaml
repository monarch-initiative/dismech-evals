        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing
        description: Molecular genetic testing identifies a cause in 80% of individuals with bilateral
          anophthalmia or severe microphthalmia and up to 20% of all MAC individuals, and should combine
          sequence analysis with gene-targeted deletion/duplication analysis. Clinical exome sequencing
          achieved a diagnostic rate starting at 32.3% in a 189-person non-isolated MAC cohort, and a
          subset of the implicated genes are absent from commercially available ophthalmic gene panels
          - an argument for exome or genome sequencing rather than panel testing. Real-world yield is
          comparable in unilateral and bilateral disease (33% each), so testing should not be restricted
          to bilateral cases.
        diagnosis_term:
          preferred_term: Whole Exome Sequencing
          term:
            id: NCIT:C101295
            label: Whole Exome Sequencing
      selected_evidence:
        snippet: can identify a genetic cause in 80% of individuals with bilateral anophthalmia/severe
          microphthalmia and in up to 20% of all individuals with an ocular malformation in the MAC spectrum.
        supports: SUPPORT
