      assertion:
        name: Failure of Optic Cup Invagination and Growth
        biological_scale: TISSUE
        role: mediator
        description: STEP 2 OF THE THREE-STEP SPINE. Extension of the optic vesicle drives invagination
          of its distal surface, partitioning it into proximal (optic stalk) and distal (optic cup) territories;
          the two layers of the cup become the neural retina and the retinal pigment epithelium, while
          the overlying surface ectoderm is induced to form the lens placode. Partial rather than complete
          failure at this step — impaired cell movements integral to invagination, failure of lens induction,
          or defective early retinal differentiation — yields a globe that forms but remains small. The
          BMP-family ligands GDF3 and GDF6 pattern this step, and heterozygous missense variants in either
          produce ocular anomalies ranging from bilateral anophthalmia to unilateral coloboma. This is
          the step whose failure yields microphthalmia rather than anophthalmia.
        biological_processes:
