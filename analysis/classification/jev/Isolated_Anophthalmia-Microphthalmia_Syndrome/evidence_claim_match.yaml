      assertion_type: Subtype
      assertion:
        name: Anophthalmia
        display_name: Anophthalmia (clinical and true)
        description: Complete absence of the globe in the presence of ocular adnexa (eyelids, conjunctiva,
          lacrimal apparatus). "Clinical anophthalmia" denotes absence of any visible ocular structure
          although a histologically detectable remnant may persist; "true" anophthalmia denotes total
          absence of any ocular tissue. The boundary with extreme microphthalmia is a fine one. Represents
          failure at the earliest step (optic vesicle evagination/induction) and is the phenotype most
          strongly enriched for a molecular diagnosis.
      selected_evidence:
        snippet: Anophthalmia refers to complete absence of the globe in the presence of ocular adnexa
        supports: SUPPORT
