        role: mediator
        description: VSX2 (CHX10) is expressed from optic-vesicle stage in the presumptive neural retina,
          where it drives retinal-progenitor proliferation and represses the retinal-pigment-epithelium
          programme. Biallelic VSX2 loss shifts the neural-retina/RPE boundary toward RPE identity and
          depletes the progenitor pool that would otherwise expand the optic cup, producing bilateral
          microphthalmia. The mutations reported in recessive microphthalmia disrupt either the homeodomain
          or the conserved CVC motif required for DNA binding and repression.
