      assertion:
        name: Genetic counselling and molecular diagnosis
        description: Molecular testing identifies a genetic cause in 80% of individuals with bilateral
          anophthalmia or severe microphthalmia and up to 20% of all MAC individuals, and should combine
          sequencing with gene-targeted deletion/duplication analysis and chromosomal microarray. Real-world
          yields are meaningful in unilateral as well as bilateral disease (33% in each group in a prospective
          cohort), so testing should not be restricted to bilateral cases. Counselling must address de
          novo occurrence, incomplete penetrance, variable expressivity and germline mosaicism, which
          together mean recurrence risk after an apparently de novo diagnosis is not zero.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
