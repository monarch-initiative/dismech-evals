        name: TMEM98
        gene_term:
          preferred_term: TMEM98
          term:
            id: hgnc:24529
            label: TMEM98
        relationship_type: CAUSATIVE
        subtype: NNO4
        notes: 'Autosomal dominant, and the weakest gene-disease assertion in this entry. Three missense
          alleles have been reported at NNO4, all in the C-terminal alpha helix 8 of the protein, and
          the most recent report calls its own segregating variant potentially causative rather than established.
          ClinGen''s Glaucoma and Neuro-Ophthalmology Gene Curation Expert Panel classified TMEM98 for
          nanophthalmos 4 as Limited on 2025-04-22. The gene is nonetheless mechanistically coherent with
          MYRF, on which it depends: Tmem98 expression falls in Myrf conditional knockout mouse eyes,
          and the two proteins interact physically. The record is kept, with its classification stated,
          rather than dropped or asserted as settled.'
