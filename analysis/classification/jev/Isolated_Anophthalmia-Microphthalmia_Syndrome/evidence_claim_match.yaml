          term:
            id: CHEBI:15367
            label: all-trans-retinoic acid
          modifier: DECREASED
        genes:
        - preferred_term: ALDH1A3
          term:
            id: hgnc:409
            label: ALDH1A3
      selected_evidence:
        snippet: Biallelic pathogenic variants in ALDH1A3 are responsible for approximately 11%
