        name: Fraser syndrome (cryptophthalmos)
        description: Failure of eyelid separation with skin running continuously over a malformed globe,
          most often as part of Fraser syndrome with cutaneous syndactyly and renal agenesis. Clinically
          resembles anophthalmia because no eye is visible, but the adnexa are abnormal rather than preserved
          — the key discriminator from clinical anophthalmia, whose definition explicitly requires intact
          adnexa.
        disease_term:
          preferred_term: Fraser syndrome
          term:
            id: MONDO:0009046
            label: Fraser syndrome
        distinguishing_features:
        - Absent palpebral fissure with skin continuous over the orbit.
        - Cutaneous syndactyly and renal agenesis.
      selected_evidence:
        snippet: Anophthalmia refers to complete absence of the globe in the presence of ocular adnexa
          (eyelids, conjunctiva, and lacrimal apparatus).
        supports: SUPPORT
