          growth is normally driven by the expanding globe, an ocularist fits conformers of progressively
          increasing size starting shortly after birth to expand the palpebral fissure, conjunctival cul-de-sac
          and bony orbit. In a 24-orbit case series with a mean of 7 conformer exchanges over 51 months,
          good outcomes were achieved in 18 orbits (75%) and fair outcomes in 6 (25%), with unilateral
          cases reaching a mean final lid length of 22.3 mm against 23.5 mm in the normal contralateral
          eye.
