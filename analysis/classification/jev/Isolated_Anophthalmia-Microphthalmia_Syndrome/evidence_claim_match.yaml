      assertion_type: Pathophysiology
      assertion:
        name: Absent or Severely Reduced Globe Formation
        biological_scale: TISSUE
        role: central_effector
        description: 'The convergent structural outcome of all upstream routes: a globe that is absent,
          or whose total axial length is at least two standard deviations below the age-adjusted mean
          (<21 mm in adults, <14 mm in newborns). Severe microphthalmia is defined by a corneal diameter
          under 4 mm with total axial length under 10 mm at birth or under 12 mm after one year. The structural
          deficit is permanent and does not remit; asymmetric and unilateral involvement is common, implying
          differences in developmental robustness and buffering between the two sides. A mechanistically
          separate route to a small globe is restricted axial growth with a normal anterior segment (posterior
          microphthalmia and nanophthalmia), caused by biallelic MFRP or PRSS56 variants. Nanophthalmos
          also has a dominant arm, acting through the retinal pigment epithelium: MYRF, a membrane-bound
          transcription factor of that epithelium, and TMEM98, whose expression depends on it. In that
          arm the eye is short but structurally sound, so the outcome is high hyperopia and angle-closure
          glaucoma rather than the absent or profoundly malformed globe the rest of this node describes.'
        locations:
        - preferred_term: eyeball of camera-type eye
          term:
            id: UBERON:0010230
            label: eyeball of camera-type eye
        biological_processes:
