        name: Congenital rubella syndrome and other acquired destructive ocular disease
        description: A shrunken, disorganised globe following intrauterine infection, inflammation, trauma,
          retinopathy of prematurity or intraocular tumour can be mistaken for congenital microphthalmia.
          Congenital rubella is the classic infectious cause, producing cataract, retinopathy and microphthalmia
          together with deafness and cardiac defects; congenital Zika virus infection produced microphthalmia
          in 2.7% of reviewed cases. Serology, laterality, corneal diameter relative to axial length,
          and imaging for calcification or scarring distinguish an acquired small eye from a developmental
          one.
        disease_term:
