      assertion_type: Pathophysiology
      assertion:
        name: Chronic Prostaglandin E2 Excess
        description: Persistently raised PGE2 is the biochemical state of HPGD deficiency. In PHO type
          1 it accompanies clubbing, periostosis and pachydermia; in the isolated form only the digital
          component is expressed, which may reflect a smaller PGE2 excess from a hypomorphic allele. That
          dose explanation is a hypothesis. This node is not assumed for the SLCO2A1 isolated-clubbing
          family, whose serum and urinary PGE2 were normal.
        biological_scale: ORGANISM
        chemical_entities:
        - preferred_term: prostaglandin E2
          term:
            id: CHEBI:15551
            label: prostaglandin E2
          modifier: INCREASED
      selected_evidence:
        snippet: Homozygous individuals develop PHO secondary to chronically elevated prostaglandin E(2)
          levels.
        supports: SUPPORT
        directness: INDIRECT
