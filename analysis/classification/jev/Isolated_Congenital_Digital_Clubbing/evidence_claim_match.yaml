        discussion_id: isolated_versus_pho_expressivity
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Chronic Prostaglandin E2 Excess
        - genetic#HPGD
        prompt: Why does homozygous HPGD c.577T>C produce isolated clubbing in one family and full primary
          hypertrophic osteoarthropathy in another?
        rationale: The entry's chain assumes that a smaller PGE2 excess restricts disease to the digits.
          No enzyme assay of the p.Ser193Pro protein is reported in the cited abstracts, and the urinary
          PGE2 measured in the isolated-clubbing family (indexed in MeSH but not reported in its abstract)
          could not be compared with the PHO family for this entry. Modifier genes, sex and age at examination
          are alternatives. The SLCO2A1 isolated-clubbing family with normal PGE2 shows that isolated
          clubbing does not always come with measurable PGE2 excess. Resolving this decides whether isolated
          clubbing is a stable entity or a mild presentation of PHO type 1.
      selected_evidence:
        snippet: 'Biochemical tests were unremarkable (serum PGE2 (117 pg/mL) urinary PGE2 (131 pg/mL)
          (normal: 25–200 pg/mL).'
        supports: SUPPORT
