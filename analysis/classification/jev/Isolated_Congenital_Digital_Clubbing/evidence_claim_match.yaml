      assertion:
        name: HPGD Biallelic Missense Variant
        description: The initiating lesion. Affected individuals are homozygous for HPGD c.577T>C (p.Ser193Pro)
          in exon 6, found by homozygosity mapping to 4q32.3-q34.1 and candidate-gene sequencing. The
          abstract reports no enzyme assay for this allele, so its functional class (complete or partial
          loss of function) is inferred here rather than demonstrated.
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
      selected_evidence:
        snippet: Sequence analysis of the candidate genes, in the ICNC linkage interval, revealed a homozygous
          missense mutation (c.577T>C; p.S193P) in exon 6 of the human HPGD gene encoding NAD(+) dependent
          15-hydroxyprostaglandin dehydrogenase (15-PGDH).
        supports: SUPPORT
