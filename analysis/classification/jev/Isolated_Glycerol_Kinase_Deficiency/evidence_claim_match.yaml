      assertion_type: Pathophysiology
      assertion:
        name: Pseudohypertriglyceridaemia on Lipase-Based Triglyceride Assay
        description: An analytical artefact, not a lipid disorder. Enzymatic triglyceride assays liberate
          glycerol with a lipase and measure it as a proxy for triglyceride; in hyperglycerolaemia the
          pre-existing endogenous glycerol is counted as though it were triglyceride-derived. Orthogonal
          NMR measurement in the same patients returns normal triglycerides and, in the same comparison,
          shows that lipase-based assays simultaneously under-report LDL cholesterol. The serum is characteristically
          not lipaemic, which is the bedside clue that the number is wrong.
        role: consequence
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Compared to NMR, lipase-based assays overreported triglycerides
        supports: SUPPORT
    origin:
