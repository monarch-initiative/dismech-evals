            term:
              id: MONDO:0018459
              label: isolated glycerol kinase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Glycerol Kinase Loss of Function
        description: Hemizygous loss-of-function variants in GK (Xp21.2) — nonsense, frameshift, splice-site,
          missense and partial gene deletions — abolish or severely reduce glycerol kinase activity, which
          is measurable at under 10% of reference in patient fibroblasts. Because the gene is X-linked,
          essentially all clinically ascertained patients are hemizygous males and mothers are unaffected
          heterozygotes. No genotype-phenotype correlation has been established, so this node is modelled
          as a single functional lesion rather than an allele-graded one.
        role: trigger
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        conforms_to: metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism
        genes:
        - preferred_term: GK
          term:
            id: hgnc:4289
            label: GK
        molecular_functions:
        - preferred_term: glycerol kinase activity
          term:
            id: GO:0004370
            label: glycerol kinase activity
          modifier: LOSS_OF_FUNCTION
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Isolated glycerol kinase deficiency (GKD) is an X linked recessive disorder.
        supports: SUPPORT
