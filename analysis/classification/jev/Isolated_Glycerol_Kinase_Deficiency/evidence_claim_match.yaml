        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: age_dependent_gluconeogenic_substrate_model
        hypothesis_label: Age-dependent glycerol-as-gluconeogenic-substrate model
        status: CANONICAL
        description: Symptoms track how much the individual depends on glycerol as a gluconeogenic substrate
          rather than how much residual enzyme activity is present. Young children, whose fasting glucose
          production draws proportionally more on glycerol, decompensate under catabolic stress; the same
          individuals become tolerant after puberty despite an unchanged genotype and unchanged hyperglycerolaemia.
          This model accounts for the otherwise puzzling observation that genotype does not predict phenotype.
      selected_evidence:
        snippet: The greater importance of glycerol as a gluconeogenetic substrate in children than in
          adults may explain the episodes in young patients with GKD, often elicited by catabolic stress.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15303806
      reference_title: 'Glycerol kinase deficiency: follow-up during 20 years, genetics, biochemistry
        and prognosis.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the age-dependent substrate-dependence model directly, from 20-year follow-up
        of two affected boys.
