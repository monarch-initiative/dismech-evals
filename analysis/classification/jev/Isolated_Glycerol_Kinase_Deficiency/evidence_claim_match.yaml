      assertion_type: DifferentialDiagnosis
      assertion:
        name: Complex glycerol kinase deficiency (Xp21 contiguous gene deletion syndrome)
        disease_term:
          preferred_term: chromosome Xp21 deletion syndrome
          term:
            id: MONDO:0010399
            label: chromosome Xp21 deletion syndrome
        description: 'A deletion at Xp21 that removes GK together with neighbouring genes — NR0B1 (adrenal
          hypoplasia congenita), DMD (Duchenne muscular dystrophy) and sometimes IL1RAPL1 (intellectual
          disability). It shares the hyperglycerolaemia but is a different disease: the danger comes from
          the adrenal insufficiency, not from the glycerol.'
        distinguishing_features:
        - Salt-wasting adrenal crisis in infancy, usually the first and most dangerous manifestation
        - Raised creatine kinase and a Duchenne muscular dystrophy phenotype
        - Intellectual disability when the deletion extends to IL1RAPL1
        - A multigene Xp21 deletion on microarray or MLPA rather than an intragenic GK variant
      selected_evidence:
        snippet: It is caused by partial deletion of Xp21, which includes the genes responsible for glycerol
          kinase deficiency, congenital adrenal hypoplasia, Duchenne muscular dystrophy and intellectual
          disability.
        supports: SUPPORT
