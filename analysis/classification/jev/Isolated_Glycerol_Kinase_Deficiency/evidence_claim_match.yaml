          series all three patients had lipid-lowering treatment discontinued after diagnosis without
          adverse outcome, and a long-followed hyperglycerolaemic cohort showed no premature atherosclerotic
          cardiovascular disease attributable to the condition itself. A published clinical suspicion
          score exists specifically to spare these patients unwarranted treatment. Ordinary cardiovascular
          risk factors still require routine monitoring.
        treatment_term:
          preferred_term: withdrawal of unwarranted lipid-lowering pharmacotherapy
      selected_evidence:
