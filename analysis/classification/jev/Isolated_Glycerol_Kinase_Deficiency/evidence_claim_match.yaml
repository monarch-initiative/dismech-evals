      assertion:
        name: Primary hypertriglyceridaemia
        description: The condition patients with the adult form are almost always labelled with first.
          True hypertriglyceridaemia gives lipaemic serum, responds at least partly to lipid-lowering
          therapy, and is not accompanied by glyceroluria.
        distinguishing_features:
        - Non-lipaemic serum despite a high reported triglyceride
        - Complete resistance to hypolipidaemic drugs over years of treatment
        - Normal triglyceride when measured by NMR rather than a lipase-based assay
        - Raised plasma and urinary glycerol
      selected_evidence:
        snippet: High triglyceride in a serum sample with no apparent visible lipaemia is a confusing
          laboratory condition.
        supports: SUPPORT
