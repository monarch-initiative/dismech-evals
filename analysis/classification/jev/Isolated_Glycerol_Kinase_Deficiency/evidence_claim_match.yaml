        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gkd_gluconeogenesis_versus_ketolysis
        prompt: Are the childhood crises of isolated glycerol kinase deficiency caused by failure of glycerol-dependent
          gluconeogenesis, by a defect in ketolysis, or by both?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Fasting and Catabolic-Stress Intolerance
        - pathophysiology#Hyperketotic Hypoglycaemic Decompensation
        rationale: 'The pathograph as curated routes the crisis through loss of glycerol as a gluconeogenic
          substrate, but the primary review of the disorder explicitly declines to settle that attribution
          and raises ketolysis as an alternative or additional contributor. The distinction matters for
          management: a gluconeogenic-substrate deficit is fully addressed by exogenous glucose, whereas
          a ketolytic defect would predict residual vulnerability despite adequate glucose supply. It
          also bears on why adults with unchanged hyperglycerolaemia still show pronounced ketonaemia
          on fasting while no longer becoming hypoglycaemic.'
        proposed_experiments:
        - experiment_id: gkd_paired_tracer_gluconeogenesis_ketolysis
          name: Paired glycerol and ketone tracer study across the pubertal transition
          description: In hemizygous GK patients studied as children and again as adults, combine 13C3-glycerol
            infusion (already validated in this disorder) with a 13C-labelled beta-hydroxybutyrate infusion
            during a controlled fast. Measure glycerol-to-glucose conversion, whole-body glucose production,
            and ketone body oxidation rate. If gluconeogenic substrate loss alone explains the crises,
            ketone oxidation should be normal at both ages while glucose production falls only in childhood.
      selected_evidence:
        snippet: Isolated GKD patients showed a tendency towards hypoglycaemia with hyperketonaemia; whether
          the clinical symptoms of GKD are caused by dysfunction of gluconeogenesis and/or ketolysis needs
          to be investigated further.
        supports: SUPPORT
