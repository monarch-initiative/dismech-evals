            term:
              id: NCIT:C837
              label: Somatropin
      selected_evidence:
        snippet: Children with GHD receive replacement therapy with daily injections of recombinant human
          GH (rhGH). RhGH therapy is effective in increasing short-term height gain and adult height in
          patients with GHD.
        supports: SUPPORT
