            term:
              id: MONDO:0000050
              label: isolated congenital growth hormone deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Growth hormone provocative (stimulation) stimulation testing
        description: 'The diagnostic core of this entry: types IB, II, and III are defined by a subnormal
          peak GH response to pharmacologic stimulation (GHRH, L-dopa, clonidine, arginine, insulin, glucagon,
          or macimorelin), unlike type IA, which is instead defined molecularly by complete absence of
          the GH1 gene product (see the type IA sibling entry). Practice varies substantially across countries:
          preferred stimulation tests and their GH cutoffs differ, priming with sex steroids before testing
          in peripubertal children is now recommended in a majority of surveyed countries (with differing
          protocols), and the clinical pretest criteria that qualify a child for testing are inconsistently
          defined. Height, IGF-1, and bone age are used as additional diagnostic parameters in some countries''
          guidelines, on top of the stimulation test itself.'
        diagnosis_term:
          preferred_term: growth hormone stimulation test
      selected_evidence:
        snippet: Preferred GH stimulation tests and chosen cutoffs vary substantially. Overall, a trend
          to lowering the GH cutoff was identified. Priming is becoming more popular and now recommended
          in 5 out of 9 countries; however, with different protocols.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31707392
      reference_title: 'GHD Diagnostics in Europe and the US: An Audit of National Guidelines and Practice.'
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the international heterogeneity in stimulation-test choice, cutoff, and priming
        protocol - the basis for this node's caution against citing a single universal numeric cutoff.
