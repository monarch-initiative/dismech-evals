  e4da7ed90269499fa2f76dd1f96df1086f45eae3bdc9757186f60f31e6ce97d9:
    claim:
      about:
        disease:
          name: Isolated Growth Hormone Deficiency
          disease_term:
            preferred_term: isolated congenital growth hormone deficiency
            term:
              id: MONDO:0000050
              label: isolated congenital growth hormone deficiency
        context: []
      assertion_type: Subtype
      assertion:
        name: Type III
        display_name: Type III (X-linked; BTK-region or SOX3)
        description: 'X-linked. The classic description (Fleisher syndrome) is a contiguous phenotype
          of X-linked hypogammaglobulinemia and isolated GH deficiency (XLA/GHD) mapping near the BTK
          gene at Xq21.3-q22, the same locus disrupted in Bruton''s X-linked agammaglobulinemia (kb/disorders/X-linked_Agammaglobulinemia.yaml).
          The molecular basis of the GHD component is genuinely unresolved: in the kindred where it was
          originally described, BTK mRNA and protein were present at normal levels and the BTK coding
          sequence was normal, showing that XLA/GHD is not simply Bruton''s XLA with an incidental growth
          phenotype, and a contiguous-deletion mechanism was explicitly excluded in three further XLA/GHD
          patients. A separate X-linked route is dosage alteration (duplication or deletion) of SOX3 at
          Xq26-27, which more typically produces infundibular hypoplasia with combined pituitary hormone
          deficiency rather than a strictly isolated GH deficit, though isolated GH deficiency has been
          reported as part of its phenotypic spectrum.'
        subtype_term:
          preferred_term: isolated growth hormone deficiency type III
          term:
            id: MONDO:0010615
            label: isolated growth hormone deficiency type III
        genes:
        - preferred_term: BTK
          term:
            id: hgnc:1133
            label: BTK
        - preferred_term: SOX3
          term:
            id: hgnc:11199
            label: SOX3
        inheritance:
        - name: X-linked recessive
          inheritance_term:
            preferred_term: X-linked recessive inheritance
            term:
              id: HP:0001419
              label: X-linked recessive inheritance
          description: Applies to the BTK-region (Fleisher syndrome) route, in which affected males have
            both agammaglobulinemia and GH deficiency. The SOX3-dosage route is X-linked but its dominance/recessiveness
            is less clearly established, since reported carrier females have ranged from unaffected to
            mildly affected.
      selected_evidence:
        snippet: We conclude that both over- and underdosage of SOX3 are associated with similar phenotypes,
          consisting of infundibular hypoplasia and hypopituitarism but not necessarily MR.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15800844
      reference_title: Over- and underdosage of SOX3 is associated with infundibular hypoplasia and hypopituitarism.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes SOX3 dosage as a second, molecularly distinct X-linked route into this
        subtype's phenotype.
    first_seen_at: '2026-09-28T17:57:31.091101+00:00'
