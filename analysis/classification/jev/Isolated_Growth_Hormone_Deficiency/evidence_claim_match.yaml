  5639f663bab54503f4418160e54aec912cdc9eb2c61024cb47d615df879b8d9b:
    claim:
      about:
        disease:
          name: Isolated Growth Hormone Deficiency
          disease_term:
            preferred_term: isolated congenital growth hormone deficiency
            term:
              id: MONDO:0000050
              label: isolated congenital growth hormone deficiency
        context: []
      assertion_type: Subtype
      assertion:
        name: Type II
        display_name: Type II (autosomal dominant GH1 intron-3 splice variant; dominant-negative 17.5-kDa
          isoform)
        description: 'Autosomal dominant, and the mechanistically richest subtype: a heterozygous variant
          at the GH1 intron-3 splice donor site (the recurrent "hot spot" IVS3+1G>A is the most frequently
          reported single lesion) or at a nearby exonic splicing enhancer causes skipping of exon 3, producing
          a truncated, dominant-negative 17.5-kDa GH isoform alongside normal 22-kDa GH from the other
          allele. The 17.5-kDa isoform disrupts GH secretory granules in a dose-dependent manner and separately
          triggers endoplasmic reticulum stress and caspase-mediated apoptosis in somatotrophs, destroying
          most of them in transgenic mouse models and causing anterior pituitary hypoplasia. Clinical
          severity is variable even among carriers of the same mutation, which splicing-enhancer-strength
          studies suggest may reflect how much 17.5-kDa isoform a given variant actually produces.'
        subtype_term:
          preferred_term: isolated growth hormone deficiency type II
          term:
            id: MONDO:0008250
            label: isolated growth hormone deficiency type II
        genes:
        - preferred_term: GH1
          term:
            id: hgnc:4261
            label: GH1
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Isolated growth hormone deficiency type II (IGHD II) is characterized by short stature
          due to dominant-negative mutations of the human growth hormone gene (GH1).
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/2
      evidence_path: /has_subtypes/2/evidence/1
      context_paths:
