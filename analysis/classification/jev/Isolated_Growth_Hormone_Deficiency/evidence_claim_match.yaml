  c379a7641a68f974f3a52c5d862e687aad4668d211c079d46445d1e3208d9fe7:
    claim:
      about:
        disease:
          name: Isolated Growth Hormone Deficiency
          disease_term:
            preferred_term: isolated congenital growth hormone deficiency
            term:
              id: MONDO:0000050
              label: isolated congenital growth hormone deficiency
        context:
        - path: /has_subtypes/2
          value:
            name: Type II
            display_name: Type II (autosomal dominant GH1 intron-3 splice variant; dominant-negative 17.5-kDa
              isoform)
            description: 'Autosomal dominant, and the mechanistically richest subtype: a heterozygous
              variant at the GH1 intron-3 splice donor site (the recurrent "hot spot" IVS3+1G>A is the
              most frequently reported single lesion) or at a nearby exonic splicing enhancer causes skipping
              of exon 3, producing a truncated, dominant-negative 17.5-kDa GH isoform alongside normal
              22-kDa GH from the other allele. The 17.5-kDa isoform disrupts GH secretory granules in
              a dose-dependent manner and separately triggers endoplasmic reticulum stress and caspase-mediated
              apoptosis in somatotrophs, destroying most of them in transgenic mouse models and causing
              anterior pituitary hypoplasia. Clinical severity is variable even among carriers of the
              same mutation, which splicing-enhancer-strength studies suggest may reflect how much 17.5-kDa
              isoform a given variant actually produces.'
            subtype_term:
              preferred_term: isolated growth hormone deficiency type II
              term:
                id: MONDO:0008250
                label: isolated growth hormone deficiency type II
            genes:
            - preferred_term: GH1
              term:
                id: hgnc:4261
                label: GH1
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: GH1 Intron-3 Splice-Site or Splicing-Enhancer Variant
        genes:
        - preferred_term: GH1
          term:
            id: hgnc:4261
            label: GH1
        role: trigger
        subtypes:
        - Type II
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: GH1
            term:
              id: hgnc:4261
              label: GH1
          functional_impact_category: DOMINANT_NEGATIVE
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Most frequently the recurrent intron-3 donor splice-site variant IVS3+1G>A; other
            reported lesions weaken exon-3 splicing enhancers (dual enhancers are normally required for
            exon-3 definition) rather than disrupting the canonical splice site itself.
        description: A single mutant GH1 allele produces a mixture of normal transcript and an aberrantly
          spliced transcript lacking exon 3, while the other allele continues to produce normal transcript
          - the genetic basis of the dominant-negative phenotype elaborated in the nodes below.
      selected_evidence:
        snippet: The "hot spot" of mutations is 5'-donor splicing site of GH-1 intron 3, while IVS3 +IG>A
          mutation can be regarded as the most incident in type II isolated growth hormone deficiency
          in the Russian population.
        supports: SUPPORT
    origin:
