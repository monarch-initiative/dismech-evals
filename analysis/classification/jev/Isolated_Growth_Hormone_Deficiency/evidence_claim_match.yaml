        context:
        - path: /has_subtypes/3
          value:
            name: Type III
            display_name: Type III (X-linked; BTK-region or SOX3)
            description: 'X-linked. The classic description (Fleisher syndrome) is a contiguous phenotype
              of X-linked hypogammaglobulinemia and isolated GH deficiency (XLA/GHD) mapping near the
              BTK gene at Xq21.3-q22, the same locus disrupted in Bruton''s X-linked agammaglobulinemia
              (kb/disorders/X-linked_Agammaglobulinemia.yaml). The molecular basis of the GHD component
              is genuinely unresolved: in the kindred where it was originally described, BTK mRNA and
              protein were present at normal levels and the BTK coding sequence was normal, showing that
              XLA/GHD is not simply Bruton''s XLA with an incidental growth phenotype, and a contiguous-deletion
              mechanism was explicitly excluded in three further XLA/GHD patients. A separate X-linked
              route is dosage alteration (duplication or deletion) of SOX3 at Xq26-27, which more typically
              produces infundibular hypoplasia with combined pituitary hormone deficiency rather than
              a strictly isolated GH deficit, though isolated GH deficiency has been reported as part
              of its phenotypic spectrum.'
            subtype_term:
              preferred_term: isolated growth hormone deficiency type III
              term:
                id: MONDO:0010615
                label: isolated growth hormone deficiency type III
            genes:
            - preferred_term: BTK
              term:
                id: hgnc:1133
                label: BTK
            - preferred_term: SOX3
              term:
                id: hgnc:11199
                label: SOX3
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: BTK-Region Xq21.3-q22 Genetic Lesion
        role: trigger
        subtypes:
        - Type III
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: BTK
            term:
              id: hgnc:1133
              label: BTK
          variant_origin: GERMLINE
          description: 'X-linked segregation of GH deficiency together with agammaglobulinemia is well
            established clinically in this region, but the specific genetic lesion responsible for the
            GHD component has not been identified: in the originally described kindred BTK mRNA and protein
            were both present at normal levels and the BTK coding sequence was normal, and a contiguous
            deletion spanning the region was explicitly excluded in three further XLA/GHD patients. This
            is a genuine knowledge gap (see discussions below), not a settled BTK mechanism.'
        description: Named for the BTK locus because that is the established cause of the co-occurring
          agammaglobulinemia (Bruton's X-linked agammaglobulinemia, kb/disorders/X-linked_Agammaglobulinemia.yaml),
          not because BTK itself has been shown to cause the GH deficiency.
      selected_evidence:
        snippet: Southern blot analysis using cDNA clones isolated from this region permitted us to exclude
          a contiguous deletion syndrome as an underlying defect in three patients with XLA and associated
          growth hormone deficiency.
        supports: SUPPORT
