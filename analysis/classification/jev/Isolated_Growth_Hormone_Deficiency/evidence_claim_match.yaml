  203a4e7cd4a1dc23c70a77e1b29d8d1cfa3049775a79e46cfa23bf38ae25e1c6:
    claim:
      about:
        disease:
          name: Isolated Growth Hormone Deficiency
          disease_term:
            preferred_term: isolated congenital growth hormone deficiency
            term:
              id: MONDO:0000050
              label: isolated congenital growth hormone deficiency
        context: []
      assertion_type: Subtype
      assertion:
        name: Type IB
        display_name: Type IB (GHRHR or GH1 partial loss-of-function; diminished but detectable GH)
        description: 'Autosomal recessive, with low but detectable GH (unlike type IA''s complete absence),
          significantly retarded bone age, and - because some endogenous GH was always present - a positive
          growth response and immunologic tolerance to exogenous GH therapy. The best-characterized molecular
          cause is an inactivating mutation of the GH-releasing hormone receptor (GHRHR), which leaves
          somatotrophs present but unable to receive the hypothalamic signal that drives GH synthesis
          and secretion; the founding description is "Dwarfism of Sindh," a consanguineous Pakistani kindred
          with a GHRHR nonsense mutation. An intrinsic GH1 defect is a much rarer alternative cause: a
          systematic sequencing survey found GH1 alterations in only 1.7% of subjects with the type IB
          phenotype, versus two-thirds of type IA families, and concluded that most type IB cases are
          not explained by GH1 itself.'
        subtype_term:
          preferred_term: isolated growth hormone deficiency type IB
          term:
            id: MONDO:0013006
            label: isolated growth hormone deficiency type IB
        genes:
        - preferred_term: GHRHR
          term:
            id: hgnc:4266
            label: GHRHR
        - preferred_term: GH1
          term:
            id: hgnc:4261
            label: GH1
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: DNA sequencing revealed a nonsense mutation (Glu50-->Stop) in the extracellular domain
          of the GHRH-R.
        supports: SUPPORT
