      - /disease_term
    evidence_metadata:
      reference: PMID:12720086
      reference_title: Disruption of exon definition produces a dominant-negative growth hormone isoform
        that causes somatotroph death and IGHD II.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the dominant-negative GH1 mechanism that defines this subtype, elaborated
