        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_type3_btk_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the actual genetic lesion responsible for the growth hormone deficiency component
          of X-linked hypogammaglobulinemia and isolated growth hormone deficiency (XLA/GHD, "Fleisher
          syndrome"), if it is not BTK itself?
        attaches_to:
        - pathophysiology#BTK-Region Xq21.3-q22 Genetic Lesion
        - genetic#BTK
        rationale: 'The clinical entity is well established and clearly X-linked, but the two molecular
          studies available on the founding kindred and a further three XLA/GHD patients both point away
          from BTK as the GHD-causing gene: BTK mRNA, protein, and coding sequence were normal in the
          original patient, and a contiguous deletion spanning the flanking region was explicitly excluded
          in three more patients. Type III is therefore curated with BTK as an UNKNOWN-relationship locus
          marker rather than a CAUSATIVE gene for the GHD arm specifically, and the causal_link_type on
          this node''s downstream edge is INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT. No later
          molecular candidate for the actual GHD gene at this locus was found in the literature searched
          for this entry.'
