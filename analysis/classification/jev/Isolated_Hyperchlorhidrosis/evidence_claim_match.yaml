          so sweat emerging at the skin surface is hypotonic. With reduced CA XII catalysis ductal AE2
          activity is lost, so chloride (and the sodium that follows it) is not reclaimed and remains
          in the duct lumen. The route to that loss is not settled: in mouse salivary gland and expression
          models the misfolded CA12(E143K) protein is retained in the endoplasmic reticulum, whereas in
          polarized MDCK cells the same variant reached the basolateral membrane with activity lost instead
          through chloride inhibition. Both were studied outside the sweat duct, so the molecular route
          there is inferred.'
