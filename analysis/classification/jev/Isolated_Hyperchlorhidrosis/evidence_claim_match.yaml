        biological_scale: MOLECULAR
        description: Biallelic loss-of-function variants in CA12 are the initiating lesion. The best-characterised
          allele, the active-site missense p.Glu143Lys, lowers protein-zinc affinity and leaves the enzyme
          catalytically partial but, unlike the wild-type, inhibitable by chloride at physiologic concentrations;
          other reported alleles (p.His121Gln, p.Thr255Pro, a nonsense and compound heterozygous alleles)
          similarly reduce CA XII function.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
