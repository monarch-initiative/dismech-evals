            relationship: PARTIALLY_RECAPITULATES
            fidelity: LOW
            model_scale: TISSUE
            description: Reproduces the secretory-gland arm of CA XII deficiency - the disease allele
              inhibits ductal fluid secretion and salivation - in the salivary gland rather than in the
              sweat gland where the human disorder presents.
            limitations: The animals are wild-type mice transduced in adulthood with a human CA12(E143K)
              cDNA, so the experiment reports what the allele does to an otherwise normal gland rather
              than what lifelong biallelic loss of CA12 does to a developing one. No sweat chloride or
              sweat electrolyte measurement is reported, and the mouse does not carry a human-like distribution
              of eccrine sweat glands.
