      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: INCOMPLETE
        description: 'Disease requires two CA12 loss-of-function alleles. Affected individuals are homozygous
          or compound heterozygous; obligate heterozygote parents and screened heterozygous relatives
          are clinically unaffected. Penetrance is recorded as incomplete for the clinical disease, not
          for the biochemical defect: screening the Bedouin kindred found 4 of 11 biallelic individuals
          with elevated sweat chloride but normal or near-normal serum sodium and chloride and no salt-losing
          episodes, so the sweat phenotype is the penetrant trait and symptomatic salt wasting is not.'
      selected_evidence:
        snippet: Screening of the entire kindred identified 4 asymptomatic individuals with elevated sweat
          chloride. All symptomatic patients had failure to thrive and moderate-severe hyponatremia (106-124
          mmol l(-1)); 6 had hypochloremia (79-94 mmol l(-1)). All asymptomatic subjects had normal or
          near-normal serum sodium and chloride concentrations.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24714577
      reference_title: Natural history and clinical manifestations of hyponatremia and hyperchlorhidrosis
        due to carbonic anhydrase XII deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents biallelic individuals with the biochemical sweat phenotype but no clinical
        salt wasting, which is the basis for recording incomplete penetrance of the clinical disease.
