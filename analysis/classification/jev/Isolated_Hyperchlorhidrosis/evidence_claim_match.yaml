            description: 'An acute physiological preparation rather than a germline disease model: a first-generation
              E1-deleted serotype 5 adenovirus carrying human wild-type CA12 or CA12(E143K) cDNA was delivered
              by ductal cannulation to 8-week-old C57 mice, after which pilocarpine-stimulated salivation
              and fluid secretion by isolated ducts were measured.'
