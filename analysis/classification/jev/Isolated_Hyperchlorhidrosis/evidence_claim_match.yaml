        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Carbonic Anhydrase XII Catalysis in the Sweat Duct
        biological_scale: MOLECULAR
        description: Carbonic anhydrase XII catalyses the reversible hydration of carbon dioxide to bicarbonate
          and a proton. CA XII is localized basolaterally in the reabsorptive duct of the human eccrine
          sweat gland; its role as the major bicarbonate supplier for the ductal Cl--HCO3- exchanger AE2
          was demonstrated directly in salivary and pancreatic ducts, and is inferred for the sweat duct.
          Reduced CA XII catalysis (through diminished activity, chloride inhibition shown directly for
          the E143K allele, or ER retention of the misfolded protein in expression models) lowers local
          bicarbonate available to drive anion exchange.
        biological_processes:
        - preferred_term: ductal bicarbonate supply to the Cl-/HCO3- exchanger AE2
          modifier: DECREASED
          term:
            id: GO:0015701
            label: bicarbonate transport
        locations:
        - preferred_term: duct of eccrine sweat gland
          term:
            id: UBERON:0035073
            label: duct of eccrine sweat gland
      selected_evidence:
        snippet: CA12 markedly increases the activity and is the major HCO3 (-) supplier of ductal Cl(-)
          -HCO3 (-) exchanger AE2, but not of NBCe1-B.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
