      assertion_type: Discussion
      assertion:
        discussion_id: ca12_airway_involvement
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does loss of CA XII function cause airway disease, or is the bronchiectasis in the one
          reported compound heterozygous adult independent of CA12?
        attaches_to:
        - pathophysiology#CA12 Loss-of-Function Variants
        rationale: CA XII protein is expressed apically in human bronchiolar epithelium, and the single
          reported compound heterozygous adult was diagnosed with cystic fibrosis on the strength of elevated
          sweat chloride and lung disease, which would make airway bicarbonate and surface pH handling
          a second organ arm of the disorder. Against that, long-term follow-up of eleven members of the
          Bedouin kindred carrying p.Glu143Lys found no chronic respiratory abnormality. This entry therefore
          models no airway node and treats the pulmonary finding as an unresolved association; resolving
          it needs airway phenotyping of further biallelic CA12 patients across genotypes.
        posed_by: 'dismech curation (issue #13989)'
        posed_date: '2026-10-13T00:00:00Z'
      selected_evidence:
        snippet: CA XII protein was localized apically in human bronchiolar epithelia and basolaterally
          in the reabsorptive duct of human sweat glands.
        supports: SUPPORT
