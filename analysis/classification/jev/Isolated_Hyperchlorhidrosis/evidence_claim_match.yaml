  0032fe1225800f54bce86bcda8bbfe3b0ae0fd04d6bf10b375a86c0c3bbd8326:
    claim:
      about:
        disease:
          name: Isolated Hyperchlorhidrosis
          disease_term:
            preferred_term: isolated hyperchlorhidrosis
            term:
              id: MONDO:0007747
              label: isolated hyperchlorhidrosis
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Adenoviral CA12(E143K) expression in mouse salivary gland
        species: Mouse
        genotype: Wild-type mice transduced with a replication-defective adenovirus carrying human CA12
          or CA12(E143K) cDNA; no germline Ca12 mutation
        background: C57
        publication: PMID:26486891
        description: 'An acute physiological preparation rather than a germline disease model: a first-generation
          E1-deleted serotype 5 adenovirus carrying human wild-type CA12 or CA12(E143K) cDNA was delivered
          by ductal cannulation to 8-week-old C57 mice, after which pilocarpine-stimulated salivation
          and fluid secretion by isolated ducts were measured.'
        modeled_mechanisms:
        - target: Impaired Salivary Ductal Fluid and Bicarbonate Secretion
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Reproduces the secretory-gland arm of CA XII deficiency - the disease allele inhibits
            ductal fluid secretion and salivation - in the salivary gland rather than in the sweat gland
            where the human disorder presents.
          limitations: The animals are wild-type mice transduced in adulthood with a human CA12(E143K)
            cDNA, so the experiment reports what the allele does to an otherwise normal gland rather than
            what lifelong biallelic loss of CA12 does to a developing one. No sweat chloride or sweat
            electrolyte measurement is reported, and the mouse does not carry a human-like distribution
            of eccrine sweat glands.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: 'The eccrine sweat duct, which is where the disorder is expressed in patients,
              lies outside the model: only salivary and pancreatic ducts were studied.'
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The in vivo measurement is pilocarpine-stimulated salivary flow, which stands
              in for the node's quantity of ductal bicarbonate supply to AE2; bicarbonate itself was assayed
              in isolated ducts, not in the whole animal.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse salivary gland secretion is the measured system, and mouse sweat gland
              anatomy differs from the human eccrine gland, so the quantitative size of the secretory
              deficit does not transfer to patients.
          readouts:
          - name: Pilocarpine-stimulated salivation rate
            target: Impaired Salivary Ductal Fluid and Bicarbonate Secretion
            direction: DECREASED
            interpretation: Expressing the disease allele lowers stimulated salivary flow, the functional
              correlate of reduced ductal fluid secretion, while wild-type CA12 raises it.
          - name: Salivary Na+ and Cl- concentration
            target: Impaired Salivary Ductal Fluid and Bicarbonate Secretion
            direction: INCREASED
            interpretation: Expressing the disease allele raised salivary sodium and chloride, the closest
              the salivary model comes to the patients' high-salt sweat.
      selected_evidence:
        snippet: Viruses were delivered to 8-week-old C57 mice.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/1
      context_paths:
