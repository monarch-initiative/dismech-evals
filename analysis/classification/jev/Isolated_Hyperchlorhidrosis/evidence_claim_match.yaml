  2029ad079223fdcd594620de0e474edca5a0ac9aba0bc196beccb07857271380:
    claim:
      about:
        disease:
          name: Isolated Hyperchlorhidrosis
          disease_term:
            preferred_term: isolated hyperchlorhidrosis
            term:
              id: MONDO:0007747
              label: isolated hyperchlorhidrosis
        context: []
      assertion_type: Genetic
      assertion:
        name: CA12
        gene_term:
          preferred_term: CA12
          term:
            id: hgnc:1371
            label: CA12
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: CA12 encodes carbonic anhydrase XII, a plasma-membrane-anchored carbonic anhydrase with
          an extracellular catalytic site. No external gene-disease validity classification (ClinGen)
          is recorded for the CA12-isolated hyperchlorhidrosis pair; the evidence base is the reported
          kindreds and case reports below.
        variants:
        - name: p.Glu143Lys (c.427G>A)
          description: The founder missense allele in the consanguineous Israeli Bedouin kindred, homozygous
            in affected individuals. Glu143 lies in the active site and is essential for zinc coordination;
            the mutant enzyme retains partial activity but, unlike the wild-type, is inhibited by physiologic
            concentrations of chloride, and the protein is abnormally glycosylated and retained in the
            endoplasmic reticulum.
          clinical_significance: PATHOGENIC
        - name: p.His121Gln
          description: Homozygous missense variant in a consanguineous Omani family with elevated sweat
            chloride, infantile failure to thrive and recurrent hyponatremia; enzyme activity is severely
            diminished at physiologic extracellular chloride.
          clinical_significance: PATHOGENIC
        - name: c.908-1G>A / c.859_860insACCT (compound heterozygous)
          description: Compound heterozygous CA12 alleles - a splice-acceptor variant and a frameshift
            insertion - in an American adult who had been diagnosed with cystic fibrosis on the basis
            of elevated sweat chloride. Respiratory epithelial RNA from this proband carried only aberrant
            CA12 transcripts with greatly reduced CA XII protein, while CFTR-mediated chloride transport
            was intact. The report describes them as deleterious without assigning an ACMG class, so none
            is recorded here.
        - name: p.Thr255Pro (c.763A>C)
          description: Novel homozygous missense variant reported in a Chinese infant with recurrent hyponatremic
            hypochloremic dehydration; the first CA12 variant reported in China. Classified a variant
            of uncertain significance under ACMG criteria but segregating with the recessive phenotype.
          clinical_significance: UNCERTAIN_SIGNIFICANCE
        - name: p.Tyr195Ter / p.Pro212Leu (compound heterozygous)
          description: 'Compound heterozygous CA12 variants in a Jordanian infant initially diagnosed
            with pseudohypoaldosteronism: a likely-pathogenic nonsense allele c.585C>A (p.Tyr195Ter) and
            a variant of uncertain significance c.635C>T (p.Pro212Leu).'
      selected_evidence:
        snippet: we demonstrate that the phenotype is due to a homozygous mutation in CA12, encoding carbonic
          anhydrase XII.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
