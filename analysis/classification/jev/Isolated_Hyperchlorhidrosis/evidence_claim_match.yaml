      assertion:
        name: Impaired Salivary Ductal Fluid and Bicarbonate Secretion
        biological_scale: TISSUE
        description: 'CA XII is not confined to the sweat duct: it is the major bicarbonate supplier for
          the ductal anion exchanger AE2 in salivary and pancreatic gland ducts as well, so the same loss
          of function reduces salivary ductal fluid and bicarbonate secretion. Delivering the human CA12(E143K)
          allele to mouse salivary glands inhibits ductal fluid secretion and salivation, and patients
          homozygous for that allele report a dry mouth and dry tongue. This is a parallel consequence
          of the molecular lesion rather than a step in the sweat-duct chain.'
        biological_processes:
        - preferred_term: salivary ductal bicarbonate secretion
          modifier: DECREASED
