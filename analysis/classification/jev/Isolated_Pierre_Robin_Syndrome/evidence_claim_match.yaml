      assertion_type: Pathophysiology
      assertion:
        name: Modular Loss of SOX9 Expression in Cranial Neural Crest
        biological_scale: MOLECULAR
        subtypes:
        - SOX9 regulatory
        mechanism_confidence: PROVISIONAL
        regulatory_category: mLOE
        description: Loss of distal enhancer activity is proposed to reduce SOX9 expression during a restricted
          cranial neural crest developmental window in affected individuals. In engineered hESC-derived
          cells, heterozygous EC1.45 deletion reduced expression from the edited allele by 50-55% in late
          cranial neural crest cells; EC1.25 deletion had a smaller effect. Neither deletion produced
          allelic expression skew after differentiation into cranial chondrocytes. These paired contexts
          support modular loss of expression in the experimental system. The provisional confidence records
          extrapolation to the larger patient F1 deletion, whose embryonic expression effect was not directly
          measured.
        genes:
        - preferred_term: SOX9
          term:
            id: hgnc:11204
            label: SOX9
        cell_types:
        - preferred_term: cranial neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        biological_processes:
        - preferred_term: SOX9 gene expression during cranial neural crest development
          modifier: DECREASED
          term:
            id: GO:0010467
            label: gene expression
      selected_evidence:
        snippet: The effect of EC1.45 enhancer deletion on SOX9 expression was larger than that of EC1.25
          deletion, especially in passage 3 (P3)–P4 late hCNCCs, where it led to 50%–55% lower expression
          of the mutated allele.
        supports: SUPPORT
        directness: INDIRECT
    origin:
