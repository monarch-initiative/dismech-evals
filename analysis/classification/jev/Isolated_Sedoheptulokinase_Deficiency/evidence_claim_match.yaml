          authors explicitly could not establish causality, and the Shpk-knockout mouse reproduces the
          biochemical profile without supplying a human-like clinical phenotype. The pathograph therefore
          stops at urinary sedoheptulose and erythritol rather than treating cholestasis, hypoglycemia,
          anemia, arthrogryposis, contractures, or dysmorphism as downstream consequences.
        proposed_experiments:
