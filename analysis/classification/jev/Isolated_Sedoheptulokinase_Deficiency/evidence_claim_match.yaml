        discussion_id: gap_shpk_clinical_causality
        prompt: Is isolated SHPK deficiency a clinically penetrant disorder, or a largely benign biochemical
          trait that was incidental to the two reported patients' non-overlapping syndromes?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Free sedoheptulose accumulation
        - pathophysiology#Fructokinase and aldolase B bypass to erythritol
        rationale: The only two reported individuals had distinct clinical presentations, the defining
          authors explicitly could not establish causality, and the Shpk-knockout mouse reproduces the
          biochemical profile without supplying a human-like clinical phenotype. The pathograph therefore
          stops at urinary sedoheptulose and erythritol rather than treating cholestasis, hypoglycemia,
          anemia, arthrogryposis, contractures, or dysmorphism as downstream consequences.
        proposed_experiments:
        - experiment_id: exp_shpk_recall_lof_homozygotes
          name: Genotype-first recall and biochemical phenotyping of SHPK loss-of-function homozygotes
          description: Identify biallelic SHPK loss-of-function carriers in population genomic cohorts,
            confirm urinary sedoheptulose and erythritol, and compare deeply phenotyped clinical outcomes
            with matched controls.
      selected_evidence:
        snippet: There remains the question of whether SHPK deficiency is the causal factor for the clinical
          phenotypes of our patients.
        supports: SUPPORT
