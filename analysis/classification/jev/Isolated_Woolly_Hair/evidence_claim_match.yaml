              label: isolated familial wooly hair disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inner Root Sheath Keratin Filament Defect
        conforms_to: keratin_intermediate_filament_fragility#Keratin Filament Network Collapse and Aggregation
        description: 'The inner root sheath keratins heterodimerise in obligate type I / type II pairs
          to build the keratin intermediate filaments that shape the growing hair shaft. KRT74 and KRT71
          are the type II partners and KRT25 the type I partner curated here. Heterozygous dominant KRT74
          or KRT71 variants impair filament assembly in the inner root sheath, and biallelic KRT25 variants
          disrupt the same filaments from the type I side, in each case distorting hair-shaft formation
          and producing woolly hair with variable hypotrichosis. This is a separate mechanism from the
          LIPH-LPA-LPAR6 signalling node: the keratin subtypes are not LPA-axis disorders, which is why
          a single entry carries two independent pathophysiology chains.

          '
        genes:
        - preferred_term: KRT74
          term:
            id: hgnc:28929
            label: KRT74
        - preferred_term: KRT71
          term:
            id: hgnc:28927
            label: KRT71
        - preferred_term: KRT25
          term:
            id: hgnc:30839
            label: KRT25
        cell_types:
        - preferred_term: hair follicular keratinocyte
          term:
            id: CL:2000092
            label: hair follicular keratinocyte
        biological_processes:
        - preferred_term: intermediate filament (keratin) organization
          term:
            id: GO:0045109
            label: intermediate filament organization
          modifier: ABNORMAL
        - preferred_term: hair follicle morphogenesis
          term:
            id: GO:0031069
            label: hair follicle morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: We demonstrate that the mutant K74 protein results in disruption of keratin intermediate
          filament formation in cultured cells, most likely in a dominant-negative manner.
        supports: SUPPORT
