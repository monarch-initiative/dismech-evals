              label: isolated familial wooly hair disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted LIPH-LPAR6 Lysophosphatidic Acid Signaling
        description: 'LIPH (lipase H) is a membrane-bound phospholipase A1 that hydrolyzes phosphatidic
          acid to produce 2-acyl lysophosphatidic acid (LPA). LPA is the physiological ligand for LPAR6
          (P2RY5), a G-protein-coupled receptor expressed in the inner root sheath of the hair follicle.
          Loss-of-function variants in either LIPH or LPAR6 disrupt this autocrine/paracrine LPA-signaling
          axis that is required for normal hair-follicle differentiation, producing tightly curled woolly
          hair and hypotrichosis. Reduced LIPH-LPA-LPAR6 signaling decreases transactivation of downstream
          EGFR signaling, resulting in underdeveloped hairs.

          '
        genes:
        - preferred_term: LIPH
          term:
            id: hgnc:18483
            label: LIPH
        - preferred_term: LPAR6
          term:
            id: hgnc:15520
            label: LPAR6
        - preferred_term: C3ORF52
          term:
            id: hgnc:26255
            label: C3orf52
        cell_types:
        - preferred_term: hair follicular keratinocyte
          term:
            id: CL:2000092
            label: hair follicular keratinocyte
        biological_processes:
        - preferred_term: phospholipid catabolism / 2-acyl-LPA production by lipase H
          term:
            id: GO:0009395
            label: phospholipid catabolic process
          modifier: DECREASED
        - preferred_term: LPA receptor (LPAR6) G-protein-coupled signaling
          term:
            id: GO:0007186
            label: G protein-coupled receptor signaling pathway
          modifier: DECREASED
        - preferred_term: hair follicle development
          term:
            id: GO:0001942
            label: hair follicle development
          modifier: ABNORMAL
      selected_evidence:
        snippet: the loss of function of LIPH, LPAR6 or C3ORF52 leads to reduced LIPH-LPA-LPAR6 signalling,
          resulting in the decreased transactivation of EGFR signalling and the phenotype of underdeveloped
          hairs.
        supports: SUPPORT
    origin:
