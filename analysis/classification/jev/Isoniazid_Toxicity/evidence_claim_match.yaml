  3f4d68d83e0f6d7f45b7d8dd7a335e51a3d6f9bc51165f601a98b18dfc2b2275:
    claim:
      about:
        disease:
          name: Isoniazid Toxicity
          disease_term:
            preferred_term: isoniazid toxicity
            term:
              id: MONDO:0027677
              label: isoniazid toxicity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Peripheral Nerve Deprivation of Pyridoxal Phosphate
        description: 'Peripheral nerve deprived of the cofactor. The insult that reaches the neuron here
          is a nutritional one, which is unlike most of the toxic neuropathies - nothing is accumulating
          in the nerve, something is missing from it. Risk tracks the things that lower B6 reserve to
          begin with: malnutrition, alcoholism, and slow acetylation.'
        role: intermediate
        biological_scale: CELLULAR
        conforms_to: peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells
        notes: 'Conformance is asserted at the module''s insult node because that is where an injury to
          peripheral neurons belongs, but the fit is unusual and worth flagging: the module''s insult
          is something done to the nerve, and this one is something withheld from it. This entry does
          not conform to the module''s "Distal Axonal Degeneration and Demyelination" node. Isoniazid
          neuropathy is conventionally described as a distal axonopathy, but the sources cited here do
          not report fibre pathology - the one case they describe had normal nerve conduction velocity
          - and a conformance would be asserting more than they say.'
      selected_evidence:
        snippet: Isoniazid (INH)-induced peripheral neuritis is not uncommonly reported in adults, especially
          those with malnutrition and alcoholism, but it is very rare in children.
        supports: SUPPORT
