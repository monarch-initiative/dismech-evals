      assertion_type: Treatment
      assertion:
        name: Pyridoxine as antidote in acute overdose
        description: 'Replacement of the depleted cofactor, dosed gram for gram against the isoniazid
          swallowed. It is an antidote in the strict sense - it restores the thing the poison removed
          - which is rarer in toxicology than the word suggests. Its availability is a real constraint:
          a survey of Australian emergency departments was conducted precisely because stocking enough
          of it is not guaranteed.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: pyridoxine
            term:
              id: CHEBI:16709
              label: pyridoxine
        notes: Pyridoxine is not harmless at antidotal doses; the cited pyridoxine review states that
          excessive dosage has adverse effects, which it summarises. This entry records that the caveat
          exists rather than restating effects it does not quote.
      selected_evidence:
        snippet: This paper presents a series of two cases of isoniazid poisoning presenting to a tertiary
          referral centre in North Queensland.
        supports: SUPPORT
