      assertion_type: Treatment
      assertion:
        name: NAT2 genotype-guided isoniazid dosing
        description: Setting the dose by acetylator genotype instead of by weight alone - roughly half
          the standard dose for slow acetylators, one and a half times it for rapid ones. In the randomised
          trial, 78 percent of slow acetylators on standard dosing developed isoniazid liver injury and
          none did under genotype-guided dosing. It is the entry's only intervention that acts on the
          modifier rather than on the injury, and it improved efficacy as well as tolerability, because
          the rapid acetylators had been under-dosed.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: isoniazid
            term:
              id: CHEBI:6030
              label: isoniazide
        notes: Curated as a treatment because it is a randomised intervention with a measured outcome,
          not as a diagnostic. The trial is single-country and the strata are small; it demonstrates the
          principle rather than establishing a dosing table for general use.
      selected_evidence:
        snippet: Thus, the NAT2 genotype-guided regimen resulted in much lower incidences of unfavorable
          events, INH-DILI or early treatment failure, than the conventional standard regimen.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
