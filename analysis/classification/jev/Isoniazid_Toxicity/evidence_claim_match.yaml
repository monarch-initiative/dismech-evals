  b784a993d82bf7d50ba1c90034932223e58f4015b69f2b631a6fb6709e336a4c:
    claim:
      about:
        disease:
          name: Isoniazid Toxicity
          disease_term:
            preferred_term: isoniazid toxicity
            term:
              id: MONDO:0027677
              label: isoniazid toxicity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Functional Pyridoxine Deficiency
        description: Depletion of usable vitamin B6. Isoniazid is a hydrazide and reacts with pyridoxal,
          and the result is that the patient has a deficiency of the cofactor rather than a poison in
          the nerve. Everything downstream of this node is an enzyme failing for want of pyridoxal 5-phosphate,
          which is why one node supplies two clinically unrelated syndromes on two different timescales,
          and why one vitamin treats both.
        role: central_effector
        biological_scale: MOLECULAR
        notes: The two chemical steps are curated in the order the cited kinetic work supports, which
          is not the order usually given. Isoniazid reacts with pyridoxal and pyridoxal 5-phosphate to
          form covalent complexes, and the inhibition of pyridoxal kinase follows from those complexes
          rather than running beside them. Secondary accounts often present covalent trapping and kinase
          inhibition as two parallel mechanisms; the source cited here reports them as sequential. The
          work is in vitro, on non-purified erythrocyte enzyme, and isoniazid is one of several drugs
          examined - it is not a study of isoniazid toxicity in patients.
      selected_evidence:
        snippet: INH leads to peripheral neuritis by causing a deficiency in the serum level of pyridoxine
          which depends on the dose of INH, duration of treatment and the patient's nutritional and acetylator
          status.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29897291
      reference_title: Isoniazid-induced neuropathy in a pre-pubertal child.
      evidence_source: HUMAN_CLINICAL
      explanation: States that the drug produces a pyridoxine deficiency and that this is how the neuritis
        arises, which is the whole basis of this node.
