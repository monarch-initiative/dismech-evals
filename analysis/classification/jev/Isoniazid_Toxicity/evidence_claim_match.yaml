              label: isoniazid toxicity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NAT2 Slow Acetylator Genotype
        description: Reduced N-acetyltransferase 2 activity, which changes how much isoniazid is routed
          down the acetylation pathway and how long the parent drug persists. Slow acetylators carry roughly
          three times the risk of anti-tuberculosis drug-induced liver injury. This is one of the better-quantified
          pharmacogenetic effects in clinical toxicology.
        role: modifier
        biological_scale: MOLECULAR
        notes: The meta-analysis measures anti-tuberculosis drug-induced liver injury, which is the injury
          from a multi-drug regimen rather than from isoniazid in isolation. That is the outcome the clinical
          literature actually reports, and this entry does not restate it as an isoniazid-specific odds
          ratio.
      selected_evidence:
        snippet: Slow acetylator genotypes were significantly associated with an increased risk of AT-DILI
          (pooled OR = 3.02; 95% CI = 2.50-3.64; p < 0.001).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
