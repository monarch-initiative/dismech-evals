        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: acetylhydrazine_metabolic_idiosyncrasy
        hypothesis_label: Acetylhydrazine bioactivation without an immune response
        status: DEPRECATED
        description: 'The long-standing account: isoniazid is acetylated to acetylhydrazine, which is
          oxidised to a reactive species that injures the hepatocyte, and the injury is a metabolic idiosyncrasy
          with no immune involvement. This is the model most textbooks still carry and it is the reason
          slow acetylation was originally expected to matter. It is recorded here as deprecated rather
          than omitted, because a curator meeting the acetylhydrazine story in a secondary source should
          be able to find out from this entry that it has been superseded.'
      selected_evidence:
        snippet: Previous mechanistic hypotheses have classified this type of drug-induced liver injury
          (DILI) as 'metabolic idiosyncrasy' which was thought not to involve an immune response and was
          mainly due to the bioactivation of the acetylhydrazine metabolite.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26773235
      reference_title: 'Mechanism of isoniazid-induced hepatotoxicity: then and now.'
      evidence_source: OTHER
      explanation: States the older model in the review's own words, and marks it as previous.
