              label: isoniazid toxicity
        context:
        - path: /treatments/0
          value:
            name: NAT2 genotype-guided isoniazid dosing
            description: Setting the dose by acetylator genotype instead of by weight alone - roughly
              half the standard dose for slow acetylators, one and a half times it for rapid ones. In
              the randomised trial, 78 percent of slow acetylators on standard dosing developed isoniazid
              liver injury and none did under genotype-guided dosing. It is the entry's only intervention
              that acts on the modifier rather than on the injury, and it improved efficacy as well as
              tolerability, because the rapid acetylators had been under-dosed.
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: isoniazid
                term:
                  id: CHEBI:6030
                  label: isoniazide
            notes: Curated as a treatment because it is a randomised intervention with a measured outcome,
              not as a diagnostic. The trial is single-country and the strata are small; it demonstrates
              the principle rather than establishing a dosing table for general use.
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: NAT2 Slow Acetylator Genotype
        treatment_effect: MODULATES
        description: Genotype-guided dosing does not change the genotype; it changes the exposure that
          genotype produces, which is why the effect is recorded as MODULATES on the modifier node rather
          than as an inhibition of anything downstream.
      selected_evidence:
        snippet: In the intention-to-treat (ITT) analysis, INH-DILI occurred in 78 % of the slow acetylators
          in the STD-treatment, while none of the slow acetylators in the PGx-treatment experienced either
          INH-DILI or early treatment failure.
        supports: SUPPORT
