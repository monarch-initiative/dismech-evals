      assertion_type: Genetic
      assertion:
        name: NAT2
        gene_term:
          preferred_term: NAT2
          term:
            id: hgnc:7646
            label: NAT2
        relationship_type: SUSCEPTIBILITY
        notes: 'Slow acetylator genotypes carry about three times the risk of anti-tuberculosis drug-induced
          liver injury in a meta-analysis of 48 studies and 11,035 patients. Acetylator status also appears
          in the neuropathy literature as a factor in how much pyridoxine deficiency develops, so this
          gene modifies both of the entry''s major arms rather than only the hepatic one.


          The allele-level picture is not the phenotype-level one. A trans-ethnic GWAS found NAT2*5 LESS
          frequent in cases while NAT2*6 and NAT2*7 homozygotes were enriched, and its authors call the
          NAT2 contribution complex rather than simply dose-dependent on acetylator speed. Both statements
          are curated here because a reader taking only the pooled odds ratio would infer that every slow-acetylator
          allele carries the same risk, and this study says otherwise.'
      selected_evidence:
        snippet: Slow acetylator genotypes were significantly associated with an increased risk of AT-DILI
          (pooled OR = 3.02; 95% CI = 2.50-3.64; p < 0.001).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41657030
      reference_title: 'The role of NAT2 genetic variants in anti-tuberculosis drug-induced liver injury
