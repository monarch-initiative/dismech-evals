      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: direct_bioactivation_immune
        hypothesis_label: Direct bioactivation of isoniazid with an immune response
        status: CANONICAL
        description: 'The current account: isoniazid itself is bioactivated to a reactive metabolite,
          and in some patients that provokes an immune response. Two phenotypes follow - a common mild
          injury that resolves as immune tolerance develops, and an uncommon severe one carrying anti-drug
          and anti-CYP antibodies that can progress to liver failure. The clinically important consequence
          is that resolving transaminase elevation on continued treatment is an expected outcome rather
          than a paradox.'
      selected_evidence:
        snippet: more recent studies support an alternative hypothesis, specifically, that INH itself
          is directly bioactivated to a reactive metabolite, which in some patients leads to an immune
          response and liver injury
        supports: SUPPORT
