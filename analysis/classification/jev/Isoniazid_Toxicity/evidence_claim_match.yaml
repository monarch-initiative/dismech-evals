  f14e8a1f2f8f438d2d3f1b66fc310885e087cc84544100b9952aafb166db256f:
    claim:
      about:
        disease:
          name: Isoniazid Toxicity
          disease_term:
            preferred_term: isoniazid toxicity
            term:
              id: MONDO:0027677
              label: isoniazid toxicity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired GABA Synthesis
        description: 'Failure to make gamma-aminobutyric acid, because the enzyme that makes it requires
          pyridoxal 5-phosphate. This is what turns an overdose into a seizure that ordinary anticonvulsants
          cannot hold: the drugs that potentiate GABA signalling need GABA to potentiate, and there is
          not enough of it.'
        role: intermediate
        biological_scale: CELLULAR
        conforms_to: epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance
        notes: 'Conformance to the module''s excitation-inhibition node is the right level for this claim,
          and this entry deliberately stops there. It does not conform to the module''s "Recurrent Unprovoked
          Seizures" outcome, because isoniazid seizures are provoked by definition and stop when the drug
          is cleared and the cofactor is replaced. Unprovoked recurrence is what that node means, and
          asserting it here would turn a poisoning into an epilepsy.


          The specific enzyme - glutamate decarboxylase - is named in the standard account but is not
          stated by any source cited in this entry, so this node refers to GABA synthesis rather than
          naming the enzyme.'
      selected_evidence:
        snippet: The seizures are often refractory to traditional antiepileptics.
        supports: SUPPORT
