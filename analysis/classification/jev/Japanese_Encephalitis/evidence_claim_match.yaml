      assertion:
        name: JEV-Specific IgM MAC-ELISA and Plaque Reduction Neutralization Test
        description: Laboratory diagnosis of Japanese encephalitis virus infection by detection of JEV-specific
          IgM antibodies in cerebrospinal fluid (CSF) or serum using IgM antibody-capture ELISA (MAC-ELISA),
          confirmed by plaque reduction neutralization testing (PRNT) to differentiate cross-reactive
          flavivirus antibodies.
        diagnosis_term:
          preferred_term: diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
      selected_evidence:
        snippet: At CDC, the PRNT is used to confirm MAC-ELISA results and also as a more specific test
          to differentiate flavivirus cross-reactivity in primary flavivirus infections.
        supports: SUPPORT
