      assertion_type: Transmission
      assertion:
        name: Haemaphysalis tick bite transmission
        description: Humans acquire Japanese spotted fever when infected ticks inoculate R. japonica during
          blood feeding; in Ibaraki Prefecture, Haemaphysalis hystricis carried R. japonica and wild boars
          were implicated as hosts that can transport infected ticks rather than as proven reservoirs.
      selected_evidence:
        snippet: These results suggest that H. hystricis is a potential vector of R. japonica in Ibaraki
          Prefecture and that wild boars may potentially transport H. hystricis carrying R. japonica.
        supports: SUPPORT
