      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Cortical Function
        description: Disruptions in normal brain function, especially in the visual cortex and thalamus,
          leading to seizures.
        locations:
        - preferred_term: Visual Cortex
          description: Brain region in the occipital lobe responsible for processing visual information.
          term:
            id: UBERON:0000411
            label: visual cortex
        - preferred_term: Thalamus
          description: Central brain structure that relays sensory and motor signals to the cerebral cortex.
          term:
            id: UBERON:0001897
            label: dorsal plus ventral thalamus
        biological_processes:
        - preferred_term: visual perception
          description: Process by which visual stimuli are received and interpreted by the nervous system.
          term:
            id: GO:0007601
            label: visual perception
      selected_evidence:
        snippet: JS has been proposed as idiopathic generalized epilepsy (IGE) because of normal posterior
          dominant background activity and paroxysmal generalized ictal epileptiform discharges (EDs).
          However, we noticed subtle occipital EDs preceding EM and interictal posterior EDs using digital
          video-EEG... Further clinical observations of seizures induced by eye closure, photic stimulation,
          and hyperventilation along with EEG paroxysms would raise the possibility of the occipital cortex
          initiating generalized epilepsy network involving the brainstem, and thalamocortical and transcortical
          pathways in JS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
