        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: jelans_seizure_and_arrhythmia_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Which CRELD1 function, acetylcholine receptor assembly, ER-mitochondria signalling or
          calcineurin-NFAT signalling, accounts for the epilepsy and the cardiac arrhythmias, and why
          do arrhythmia and early death cluster with the p.(Cys192Tyr)-plus-frameshift genotype?
        attaches_to:
        - pathophysiology#Increased Seizure Susceptibility
        - phenotypes#Cardiac arrhythmia
        - pathophysiology#Biallelic Hypomorphic CRELD1 Variants
        rationale: 'Each candidate function rests on model systems: AChR assembly in C. elegans, mitochondrial
          dynamics in flies and HeLa cells, and calcineurin-NFAT signalling in the developing mouse heart.
          None has been tested in patient-derived neurons or cardiomyocytes. The Xenopus seizure phenotype
          is provoked by a muscarinic agonist, which the founding authors note runs opposite to the prediction
          from reduced AChR assembly. In the overexpression assay p.(Cys192Tyr) retained more function
          than other missense alleles, yet it is the allele associated with arrhythmia and death, so the
          assay may not measure the function that matters.

          '
      selected_evidence:
        snippet: We also note, however, that the p.(Cys192Tyr) displayed greater protein function than
          some of the other variants tested in our overexpression assay.
        supports: SUPPORT
