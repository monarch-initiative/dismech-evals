        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: jelans_recurrent_infection_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: T cell-specific Creld1 knockout mice lose T cells with age, but patients with recurrent
          infections had normal proportions of T cells, including naive CD4+ T cells. What explains the
          infections in patients?
        attaches_to:
        - phenotypes#Recurrent infections
        rationale: 'The mouse result came from a complete conditional knockout, while patients retain
          partial CRELD1 function, and the patient testing was a single baseline flow cytometry panel
          in four individuals. Infections may instead follow aspiration, neurological disability or a
          functional immune defect that subset proportions would not reveal; T cell activation, proliferation
          and apoptosis, which were abnormal in the mouse, have not been measured in patient cells.

          '
