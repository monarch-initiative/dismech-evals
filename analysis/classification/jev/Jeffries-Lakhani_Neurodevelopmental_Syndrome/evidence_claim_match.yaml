  14b6a86d51a08045399da003554ac568ae2429bec4ffce09b85097f954c2a932:
    claim:
      about:
        disease:
          name: Jeffries-Lakhani Neurodevelopmental Syndrome
          disease_term:
            preferred_term: Jeffries-Lakhani neurodevelopmental syndrome
            term:
              id: MONDO:0958329
              label: Jeffries-Lakhani neurodevelopmental syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: CRELD1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: CRELD1 (3p25.3) encodes cysteine-rich with EGF-like domains 1. The causal call rests on
          the 14-family founding cohort with functional testing of patient missense alleles in Xenopus
          (Jeffries et al. 2024), on a recessive gene-burden excess in which CRELD1 passed Bonferroni
          correction (Chundru et al. 2024, which may share GeneDx patients with the founding cohort),
          and on later case reports. ClinGen has classified CRELD1 only for autosomal dominant congenital
          heart disease (Limited, MONDO:0005453), which is a different disease, so gene_disease_validity
          is left absent. The recurrent alleles are p.(Cys192Tyr) in the first EGF-like domain and the
          frameshifts p.(Gln320Argfs*25) and p.(Ala377Thrfs); no patient has two frameshift alleles.
        gene_term:
          preferred_term: CRELD1
          term:
            id: hgnc:14630
            label: CRELD1
      selected_evidence:
        snippet: Most harbored a frameshift in trans with a missense allele, with 1 recurrent variant,
          p.(Cys192Tyr), identified in 10 families.
        supports: SUPPORT
