              label: Jeffries-Lakhani neurodevelopmental syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic CRELD1 Variants
        biological_scale: MOLECULAR
        description: One frameshift allele, presumed null, in trans with a missense allele that retains
          reduced function. Complete loss is thought to be incompatible with life, as in Creld1 knockout
          mice, and heterozygous loss is tolerated, so the disease is attributed to residual CRELD1 function
          below about half of normal. CRELD1 acts as an ER-resident protein disulfide isomerase; whether
          the patient missense alleles reduce that activity has not been measured.
        genes:
        - preferred_term: CRELD1
          term:
            id: hgnc:14630
            label: CRELD1
        molecular_functions:
        - preferred_term: protein disulfide isomerase activity
          modifier: DECREASED
          term:
            id: GO:0003756
            label: protein disulfide isomerase activity
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Additionally, human CRELD1 harboring missense variants from affected individuals had
          reduced protein function, indicated by a diminished ability to induce craniofacial defects when
          overexpressed in X tropicalis.
        supports: SUPPORT
    origin:
