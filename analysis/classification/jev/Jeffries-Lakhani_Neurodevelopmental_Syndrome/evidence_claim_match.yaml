      assertion:
        name: Increased Seizure Susceptibility
        biological_scale: TISSUE
        description: Lowered seizure threshold of the brain. creld1-depleted Xenopus tadpoles show no
          spontaneous seizures but seize more often than controls after a low dose of pilocarpine. In
          patients seizures are frequently triggered by elevated body temperature. The cellular basis
          is unknown; reduced neuronal AChR assembly and altered mitochondrial signalling have both been
          proposed.
      selected_evidence:
        snippet: However, when treated with a minimally-phenotypic dose of the chemical convulsant pilocarpine
          (50mM), CRELD1-MO tadpoles displayed more robust seizure behaviors within 30 minutes of treatment
          (mean 79%, n=78) compared to control MO (mean 33%, n=80) and uninjected control tadpoles (mean
          41%, n=81)
        supports: SUPPORT
