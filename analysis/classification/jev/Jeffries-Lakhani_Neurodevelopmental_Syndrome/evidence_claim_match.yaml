      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: achr_biogenesis
        hypothesis_label: Reduced ionotropic acetylcholine receptor assembly
        status: EMERGING
        description: Reduced CRELD1 disulfide isomerase function lowers assembly of ionotropic acetylcholine
          receptors in the ER, reducing receptor numbers at neuromuscular and possibly central synapses.
          Proposed to explain muscle weakness and arthrogryposis, and possibly part of the epilepsy. Supported
          by C. elegans knock-ins of patient-equivalent alleles; untested in patient tissue, and the founding
          cohort did not find neuromuscular junction signs.
      selected_evidence:
        snippet: Therefore, we can also hypothesize that specific CRELD1 compound variants affect the
          expression of some subtypes of AChRs and ultimately contribute to the neurodevelopmental and
          epileptic phenotypes observed in our patient.
        supports: SUPPORT
        directness: INDIRECT
