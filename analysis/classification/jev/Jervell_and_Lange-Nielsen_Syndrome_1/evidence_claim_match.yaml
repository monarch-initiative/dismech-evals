        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: jlns1_gastric_arm_single_cohort
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How frequent is the gastric phenotype of JLNS across the allelic and population spectrum,
          given that it has been systematically looked for in only one national cohort?
        attaches_to:
        - pathophysiology#Impaired Gastric Parietal Cell Luminal K+ Recycling
        - pathophysiology#Achlorhydria, Hypergastrinemia, and Iron Deficiency Anemia
        - biochemical#Faecal Calprotectin
        rationale: 'Every quantitative statement about the gastric arm in this entry traces to one study
          of fourteen Swedish patients, and denominators within it fall to nine and to seven for individual
          analytes. That cohort is drawn from the national JLNS population in which p.Arg518Ter is the
          majority allele, so the figures may describe one founder genotype rather than JLNS generally.
          The mechanism is not in doubt: KCNQ1 is the non-redundant luminal K+ channel of the parietal
          cell in mouse, and the human cohort attributes the anemia to hypochlorhydria. What is unknown
          is prevalence, severity distribution, and whether the phenotype tracks residual channel function
          the way the cardiac and cochlear arms do.

          The raised faecal calprotectin is the sharper gap. It was abnormal in nine of nine patients
          tested, coeliac disease and inflammatory bowel disease were excluded by endoscopy in those scoped,
          and neutrophilic intestinal inflammation is not predicted by a parietal-cell secretory defect.
          No mechanism has been offered. KCNQ1 is expressed in intestinal epithelium as well as gastric,
          so an intestinal transport phenotype is plausible and unexamined.'
        notes: Recorded rather than resolved. This is why iron-deficiency anemia is curated at FREQUENT
          and not raised to VERY_FREQUENT on the cohort's 12 of 14, and why the calprotectin finding is
          recorded in the biochemical section as unexplained rather than attached to a mechanism node.
      selected_evidence:
        snippet: All Swedish Jervell and Lange-Nielsen cases with double KCNQ1 mutations (14 cases) were
          investigated by medical record review, an interview, and were offered laboratory testing for
          iron-deficiency anaemia and gastrointestinal markers.
        supports: SUPPORT
    origin:
