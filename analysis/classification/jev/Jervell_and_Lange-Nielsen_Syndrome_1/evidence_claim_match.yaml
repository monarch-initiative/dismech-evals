      assertion_type: Genetic
      assertion:
        name: KCNQ1
        gene_term:
          preferred_term: KCNQ1
          term:
            id: hgnc:6294
            label: KCNQ1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        frequency: the major molecular subtype of JLNS, accounting for the large majority of cases
        case_fractions:
        - population: JLNS cases (mixed-cohort/case-based literature)
          case_fraction_percent: 90.0
          notes: Approximately 90% of JLNS cases are attributable to biallelic KCNQ1 variants; the remainder
            are attributable to KCNE1 (JLNS2).
        notes: 'Gene dosage, not merely gene identity, sets the phenotype. Biallelic KCNQ1 loss causes
          JLNS; a single copy of the same allele causes Romano-Ward LQT1 or nothing at all, and the gap
          between the two states is large and quantified. In the Swedish p.R518X founder families the
          contrast within one allele is QTc 576 +/- 61 ms in JLNS homozygotes against 462 +/- 34 ms in
          heterozygotes, with cumulative (aborted) cardiac arrest of 47% against 1%. The less obvious
          half of the dosage story is that heterozygous carriers of JLNS-causing alleles are milder than
          typical LQT1 heterozygotes, not more severe: in a 789-carrier series they had a lower risk of
          cardiac events than carriers of non-JLNS KCNQ1 variants (hazard ratio 0.34). That is what recessiveness
          means at the channel level, and it is why a JLNS proband''s heterozygous parents are often asymptomatic,
          as this entry''s inheritance section records.

          One consequence for reading the rest of this entry: the Swedish cohort in which the extracardiac
          gastric phenotype was characterized (PMID:22805636, cited on the gastric pathophysiology node
          and in the biochemical section) is drawn from the same national JLNS population as the p.Arg518Ter
          founder families below. Neither paper states the overlap, so it is not asserted here, but it
          is a reason to read the gastric findings as characterized in a largely single-allele population
          rather than across the JLNS allelic spectrum.'
        variants:
        - name: KCNQ1 p.Arg518Ter
          description: c.1552C>T, p.Arg518*, a protein-truncating KCNQ1 allele and a worldwide cause of
            both recessive JLNS and dominant LQT1. In Sweden it is a founder mutation accounting for the
            majority of JLNS cases and the second most common cause of LQTS, with a shared haplotype across
            17 of 19 index families, an estimated mutation age of 28 generations, and geographical clustering
            in the Pite River valley. Estimated heterozygote prevalence there is roughly 1 in 2,000 to
            4,000, which makes it the best-characterized single JLNS allele anywhere and the reason Swedish
            series recur throughout the JLNS literature.
          gene:
            preferred_term: KCNQ1
            term:
              id: hgnc:6294
              label: KCNQ1
          type: nonsense
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Most mutations (90.5%) are on the KCNQ1 gene; mutations on the KCNE1 gene are associated
          with a more benign course.
        supports: SUPPORT
