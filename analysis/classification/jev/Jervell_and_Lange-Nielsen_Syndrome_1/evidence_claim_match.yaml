            repolarization. Dispersion of repolarization across the ventricular wall, reentry, and the
            conducted arrhythmia itself are tissue-level properties that dissociated or monolayer cardiomyocytes
            cannot report, so calling field-potential prolongation an arrhythmogenic substrate is an inference.
            hiPSC-derived cardiomyocytes are also electrophysiologically immature relative to adult ventricular
            myocardium, with a depolarized resting potential and a mixed atrial/ventricular/nodal population.
          divergences:
