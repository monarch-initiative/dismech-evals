            correlates of the prolonged QT interval, and the model also reproduces the two clinical features
            that make the substrate dangerous: adrenergic provocation lengthens the action potential specifically
            in JLNS cells, matching the emotion- and exercise-triggered events that account for 95% of
            arrhythmias in patients, and sensitivity to QT-prolonging drugs is markedly increased, which
            is the in-vitro counterpart of the drug-avoidance advice curated under treatments.'
