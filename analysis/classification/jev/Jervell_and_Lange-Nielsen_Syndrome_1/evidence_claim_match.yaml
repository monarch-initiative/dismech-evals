        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Achlorhydria, Hypergastrinemia, and Iron Deficiency Anemia
        biological_scale: ORGANISM
        role: consequence
        description: Loss of KCNQ1-dependent gastric acid secretion produces achlorhydria, with compensatory
          elevation of serum gastrin (loss of acid-mediated negative feedback on G cells) and iron-deficiency
          anemia from impaired acid-dependent dietary iron absorption. GeneReviews lists both as frequent,
          non-cardioauditory features of JLNS.
        notes: The same cohort reports a significant correlation between elevated gastrin and concurrent
          iron deficiency or anaemia (p = 0.039), which is what ties the two halves of this node into
          one gastric mechanism rather than two coincident findings. Its authors also flag the sustained
          hypergastrinaemia as a potential risk factor for later gastrointestinal malignancy and recommend
          monitoring for anaemia and hypergastrinaemia in JLNS; no such malignancy has been reported in
          a JLNS patient, so that is curated here as the cohort's recommendation and not as a phenotype
          of the disease.
      selected_evidence:
        snippet: Iron-deficient anemia and elevated levels of gastrin are also frequent features of JLNS.
        supports: SUPPORT
