      assertion_type: ModelMechanismLink
      assertion:
        target: Biallelic KCNQ1 Loss-of-Function Variants
        relationship: RECAPITULATES
        fidelity: HIGH
        model_scale: MOLECULAR
        description: 'The model resolves the trigger node into two mechanistically distinct allele classes:
          an amorphic splice-site allele that is strictly recessive, and a missense allele that reduces
          membrane channel density in a gene-dosage-dependent way. That distinction is what the entry''s
          genetic_context describes as "missense, nonsense, frameshift, or splice-site". Whether it also
          accounts for why some heterozygous carriers of JLNS alleles show a Romano-Ward phenotype and
