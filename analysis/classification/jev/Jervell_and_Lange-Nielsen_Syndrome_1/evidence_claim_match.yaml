            label: Gastrin Measurement
        notes: The same cohort found a significant correlation between elevated gastrin and concurrent
          iron deficiency or anaemia (p = 0.039), and its authors raise sustained hypergastrinaemia as
          a potential risk factor for later gastrointestinal malignancy. No such malignancy has been reported
          in a JLNS patient.
      selected_evidence:
        snippet: Elevated levels of gastrin in seven of nine cases, pepsinogen in six of seven cases,
          and faecal calprotectin in nine of nine cases were present.
