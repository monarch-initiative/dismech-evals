      assertion:
        name: Left Cardiac Sympathetic Denervation
        description: Surgical anti-adrenergic escalation considered for recurrent syncope or breakthrough
          ventricular arrhythmia despite full-dose beta-blockade, or when ICD implantation is declined
          or contraindicated.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: left cardiac sympathetic denervation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        notes: Among the 45 patients whose only pre-procedure events were syncope or ICD shocks, a 6-month
          post-procedure QTc below 500 ms predicted excellent outcome. That makes QTc shortening a usable
          response biomarker after denervation rather than only a diagnostic measurement, but it was established
          in that subgroup and not across the whole series. Note also that the cohort is LQTS overall,
          not JLNS specifically; the JLNS-relevant reading is the very-high-risk subgroup result rather
          than the headline 86% reduction.
      selected_evidence:
        snippet: If the patient has one more syncope despite a full dose beta-blockade, left cardiac sympathetic
          denervation (LCSD) should be performed without hesitation
        supports: SUPPORT
