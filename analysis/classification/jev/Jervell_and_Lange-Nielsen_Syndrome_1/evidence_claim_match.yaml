            term:
              id: MONDO:0024540
              label: Jervell and Lange-Nielsen syndrome 1
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Two independently disabling burdens fall on the same child. The cardiac one is lethal:
          untreated, more than half die before age 15, and the largest series describes JLNS as a most
          severe variant of long QT syndrome, with events in 86% of patients and onset by age three in
          half of them. It is also only partly tractable - on beta-blockade, half the cohort still had
          events and 27% still had cardiac arrest or sudden death - so the burden persists under best
          available medical therapy rather than resolving with diagnosis. The auditory one is permanent
          and present from birth, and because the mammalian cochlea does not regenerate it is managed
          by prosthetic substitution rather than repair. The two also interact: cochlear implantation,
          the standard treatment for the deafness, is general anesthesia in a child with a markedly prolonged
          QT interval, and a published case records life-threatening arrhythmia triggered by anesthesia
          at the end of exactly that surgery.'
      selected_evidence:
        snippet: The hearing of this patient improved significantly with the help of cochlear implantation
          (CI). But life-threatening arrhythmias occurred with a trigger of anesthesia after the end of
          the CI surgery.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
