            description: Autonomic innervation is outside the culture, so the adrenergic provocation is
              applied pharmacologically rather than arising from the sympathetic surge that triggers events
              in patients. The clinical relevance of left cardiac sympathetic denervation, curated under
              treatments, turns on exactly the structure this model omits.
          readouts:
          - name: Action potential and field potential duration
            target: Markedly Prolonged QTc and Arrhythmogenic Substrate
            direction: INCREASED
            interpretation: Prolonged repolarization at the cellular and monolayer level is the in-vitro
              correlate of the prolonged QTc, one scale below it.
          - name: Susceptibility to proarrhythmic drug challenge
            target: Markedly Prolonged QTc and Arrhythmogenic Substrate
            direction: INCREASED
            interpretation: Increased sensitivity to QT-prolonging drugs in JLNS cardiomyocytes is the
              in-vitro counterpart of the clinical instruction to avoid QT-prolonging agents, and it was
              pharmacologically correctable in this system.
      selected_evidence:
        snippet: Electrophysiological comparison of hiPSC-derived cardiomyocytes (CMs) from homozygous
          JLNS, heterozygous, and wild-type lines recapitulated the typical and severe features of JLNS
        supports: SUPPORT
