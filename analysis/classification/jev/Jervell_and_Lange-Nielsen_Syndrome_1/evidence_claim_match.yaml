              cannot report, so calling field-potential prolongation an arrhythmogenic substrate is an
              inference. hiPSC-derived cardiomyocytes are also electrophysiologically immature relative
              to adult ventricular myocardium, with a depolarized resting potential and a mixed atrial/ventricular/nodal
              population.
