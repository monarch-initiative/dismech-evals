      assertion:
        name: JLNS patient-derived and gene-edited hiPSC cardiomyocytes
        experimental_model_type: IPSC_DERIVED_MODEL
        description: 'Human induced pluripotent stem cell lines carrying JLNS-causing KCNQ1 genotypes,
          generated both by reprogramming patient cells and by genetic engineering, differentiated to
          cardiomyocytes and studied by patch clamp and multielectrode array. The panel covers the two
          major classes of JLNS-causing KCNQ1 defect (a splice-site allele, c.478-2A>T, and a missense
          allele, c.1781G>A) in homozygous, heterozygous, and wild-type form, so the recessive genotype-phenotype
          relationship is read off an allelic series in one human genetic background rather than inferred
          across patients. It is the human-cell counterpart to the Kcnq1-null mouse curated under animal_models:
          the mouse carries the cochlear phenotype that human cardiomyocytes cannot report, and this model
          carries the human cardiac electrophysiology that the mouse reports poorly because murine ventricular
          repolarization does not depend on I_Ks the way human repolarization does.'
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        cell_types:
        - preferred_term: hiPSC-derived cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        culture_system: Directed cardiomyocyte differentiation of hiPSC lines; patch-clamp and multielectrode
          array electrophysiology
        cell_source: JLNS patient somatic cells reprogrammed to hiPSC, plus isogenic genetically engineered
          lines
        publication: PMID:25453094
        modeled_mechanisms:
        - target: Biallelic KCNQ1 Loss-of-Function Variants
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: 'The model resolves the trigger node into two mechanistically distinct allele classes:
            an amorphic splice-site allele that is strictly recessive, and a missense allele that reduces
            membrane channel density in a gene-dosage-dependent way. That distinction is what the entry''s
            genetic_context describes as "missense, nonsense, frameshift, or splice-site". Whether it
            also accounts for why some heterozygous carriers of JLNS alleles show a Romano-Ward phenotype
