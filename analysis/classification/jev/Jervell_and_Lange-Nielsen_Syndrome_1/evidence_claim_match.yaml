            experimental_model_type: IPSC_DERIVED_MODEL
            description: 'Human induced pluripotent stem cell lines carrying JLNS-causing KCNQ1 genotypes,
              generated both by reprogramming patient cells and by genetic engineering, differentiated
              to cardiomyocytes and studied by patch clamp and multielectrode array. The panel covers
              the two major classes of JLNS-causing KCNQ1 defect (a splice-site allele, c.478-2A>T, and
              a missense allele, c.1781G>A) in homozygous, heterozygous, and wild-type form, so the recessive
              genotype-phenotype relationship is read off an allelic series in one human genetic background
              rather than inferred across patients. It is the human-cell counterpart to the Kcnq1-null
              mouse curated under animal_models: the mouse carries the cochlear phenotype that human cardiomyocytes
              cannot report, and this model carries the human cardiac electrophysiology that the mouse
              reports poorly because murine ventricular repolarization does not depend on I_Ks the way
              human repolarization does.'
            organism:
              preferred_term: human
