        - path: /treatments/4
          value:
            name: KCNQ1 Suppression-and-Replacement Gene Therapy
            description: Investigational dual-component gene therapy that suppresses both endogenous KCNQ1
              alleles with a short hairpin RNA while supplying an shRNA-immune wild-type KCNQ1 cDNA from
              the same construct. Because suppression is mutation-independent, one vector in principle
              covers any KCNQ1 genotype rather than requiring an allele-specific product, which is the
              property that makes it relevant to a disease defined by two different loss-of-function alleles
              per patient. In LQT1 patient iPSC-derived cardiomyocytes it shortened the prolonged action
              potential to isogenic control values.
            therapeutic_modality: GENE_THERAPY
            treatment_term:
              preferred_term: Gene Therapy
              term:
                id: NCIT:C15238
                label: Gene Therapy
            notes: 'Not a therapy. This is a cell-culture proof of principle in heterozygous LQT1 with
              no in vivo data and no JLNS genotype tested, curated so that the cardiac arm has the counterpart
              to the AAV1-Kcnq1 cochlear rescue already recorded under animal_models, and so the gap is
              visible rather than absent. Two things would have to be shown before it means anything for
              JLNS: efficacy against a biallelic null background, where there is no residual wild-type
              channel to build on, and delivery to ventricular myocardium in vivo.'
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Near-Complete Loss of Cardiac I_Ks Repolarizing Current
        treatment_effect: RESTORES
        description: Supplying wild-type KCNQ1 coding sequence restores the pore-forming subunit whose
          absence is this node, rather than compensating downstream of it.
      selected_evidence:
        snippet: In LQT1 iPSC-CMs, KCNQ1-SupRep gene therapy shortened the APD, thereby eliminating the
