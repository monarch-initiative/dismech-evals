        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: ChannelopathyAssignment
      assertion:
        classification_value: cardiac channelopathy
        notes: 'The slot is single-valued and records the organ system by which the channelopathy is classified
          clinically. JLNS1 is not confined to the heart: the same KCNQ1-KCNE1 channel also carries the
          strial K+-secretion current of the inner ear and the luminal K+-recycling current of the gastric
          parietal cell, both curated as pathophysiology nodes here, and both are epithelial transport
          defects. ChannelopathyOrganSystemEnum does offer `epithelial channelopathy` for exactly that,
          so the choice here is a real one rather than an absence of alternatives: cardiac was taken because
          the slot is single-valued, because the arrhythmia is what defines the syndrome clinically and
          drives its management and mortality, and because JLNS is universally classified with the long
          QT syndromes. No value covers a combined epithelial-and-cardiac channelopathy, so this assignment
          records the clinical classification rather than the full extent of the channel defect.'
      selected_evidence:
        snippet: Congenital long QT syndrome (LQTS) is an inherited channelopathy characterized by a prolonged
          QT-interval and arrhythmias caused by delayed repolarization
        supports: SUPPORT
    origin:
