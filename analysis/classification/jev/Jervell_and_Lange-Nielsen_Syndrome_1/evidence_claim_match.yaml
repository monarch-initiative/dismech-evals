  1fe4774866ab1df4b70eae4b0e38c30d4b819a0ffef8815e9f3bad9619ca9b8d:
    claim:
      about:
        disease:
          name: Jervell and Lange-Nielsen Syndrome 1
          disease_term:
            preferred_term: Jervell and Lange-Nielsen syndrome 1
            term:
              id: MONDO:0024540
              label: Jervell and Lange-Nielsen syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: jlns1_murine_qt_extracardiac
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Is the QT prolongation of the Kcnq1-null mouse a valid model of the human JLNS cardiac
          phenotype, given that it appears in vivo but not in isolated hearts and its authors attribute
          it to extracardiac signals?
        attaches_to:
        - pathophysiology#Near-Complete Loss of Cardiac I_Ks Repolarizing Current
        - pathophysiology#Markedly Prolonged QTc and Arrhythmogenic Substrate
        - animal_models#Mouse
        rationale: 'The human mechanism curated here is cell-autonomous: biallelic KCNQ1 loss removes
          I_Ks from the ventricular cardiomyocyte, the action potential fails to repolarize on time, and
          the QT interval lengthens. The mouse that carries the same genotype does prolong its QT and
          JT intervals, but only in the intact animal. The effect disappeared in isolated hearts, and
          the authors concluded the repolarization defect is induced by extracardiac signals rather than
          being intrinsic to the myocardium. That is a different mechanism reaching a similar readout.

          Two things make this more than a technical caveat. Murine ventricular repolarization does not
          depend on I_Ks the way human repolarization does, so the mouse is a poor cardiac model of this
          disease on prior grounds, and the finding is what that prior would predict. And the mouse is
          the entry''s main in vivo system: it carries the cochlear arm, where it recapitulates the human
          lesion well. So the same animal is strong evidence for one arm of the disease and weak evidence
          for the other, and nothing in the entry''s structure signals that asymmetry except the fidelity
          grading on each link.

          The human cell evidence does not close the gap. The hiPSC-cardiomyocyte panel shows I_Ks loss
          and action-potential prolongation in dissociated cells, which is the cell-autonomous claim,
          but those cells cannot report a QT interval and are electrophysiologically immature. So the
          cell-autonomous step is shown at cellular scale in human cells, and the organ-scale phenotype
          is shown in an animal where it appears not to be cell-autonomous. No system currently shows
          both.'
        proposed_experiments:
        - experiment_id: jlns1_exp_isolated_heart_ap
          name: Optical mapping of repolarization in isolated hearts across species
          description: Map action-potential duration and its transmural dispersion in Langendorff-perfused
            hearts from Kcnq1-null mice and from a large-animal or human-relevant preparation with the
            same genotype, under matched pacing and under beta-adrenergic stimulation. The mouse result
            predicts no intrinsic prolongation without extracardiac input; a species whose repolarization
            depends on I_Ks should prolong in the denervated, isolated organ.
          would_support:
          - pathophysiology#Markedly Prolonged QTc and Arrhythmogenic Substrate
          supporting_outcome:
          - Action-potential duration is prolonged and transmural dispersion increased in the isolated
            null heart, without any extracardiac input, establishing the organ-scale phenotype as intrinsic
            to the myocardium.
          refuting_outcome:
          - Repolarization is normal in every isolated null heart regardless of species, which would place
            the human QT prolongation downstream of autonomic or humoral input rather than of cardiomyocyte
            I_Ks loss and would require rewriting this edge.
        - experiment_id: jlns1_exp_engineered_tissue
          name: Engineered human cardiac tissue from JLNS hiPSC lines
          description: Build three-dimensional engineered heart tissue or cardiac slices from the existing
            JLNS hiPSC-cardiomyocyte lines and their isogenic controls, and measure conduction, repolarization
            dispersion, and arrhythmia inducibility under adrenergic challenge. This addresses the scale
            gap the entry records as a SCALE_EXTRAPOLATION divergence on the hiPSC model without introducing
            a species gap.
          would_support:
          - pathophysiology#Markedly Prolonged QTc and Arrhythmogenic Substrate
          supporting_outcome:
          - Human JLNS tissue shows increased repolarization dispersion and inducible reentrant arrhythmia
            relative to isogenic controls, supplying the tissue-scale evidence that neither current model
            provides.
          refuting_outcome:
          - Dispersion and inducibility are unchanged from isogenic controls, which would suggest the
            arrhythmogenic substrate needs tissue architecture or autonomic input the preparation lacks.
        notes: The caveat is already carried structurally on the animal model link (PARTIALLY_RECAPITULATES,
          with limitations naming the isolated-heart result) and on the edge evidence, which is graded
          INDIRECT for this reason. This discussion promotes it from a caveat attached to one link into
          the open question it actually is.
      selected_evidence:
        snippet: These changes are indicative of cardiac repolarization defects that appear to be induced
          by extracardiac signals.
        supports: SUPPORT
