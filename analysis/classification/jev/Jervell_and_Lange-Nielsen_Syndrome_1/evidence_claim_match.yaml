          G cells when parietal-cell acid secretion fails, so this is the biochemical readout of the gastric
          arm of the pathophysiology rather than an independent finding. Frequency is carried on the Hypergastrinemia
          phenotype.
        biomarker_term:
          preferred_term: Gastrin Measurement
