    evidence_metadata:
      reference: PMID:35331422
      reference_title: 'Left Cardiac Sympathetic Denervation for Long QT Syndrome: 50 Years'' Experience
        Provides Guidance for Management.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The relevant caveat for JLNS. The inference step, and the reason this is graded INDIRECT,
        is that the cohort is LQTS-wide and reports no JLNS subgroup: placing JLNS patients in the very-high-risk
        stratum follows from that stratum''s definition (symptomatic in the first year of life, or highly
        malignant genetics), which JLNS patients typically meet, rather than from the paper assigning
        them there. On that reading only 17% of the stratum became asymptomatic, so denervation substantially
        reduces events without removing residual risk. The same paper reports that LCSD results are not
        affected by common genotypes.'
