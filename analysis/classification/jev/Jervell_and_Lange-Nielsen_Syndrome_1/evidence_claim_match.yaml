            label: Implantable Cardioverter-Defibrillator Placement
        notes: 'Risk within JLNS is not uniform, and two variables measurable early plus sex separate
          higher- from lower-risk patients: a QTc above 550 ms and syncope in the first year of life are
          independent predictors of subsequent cardiac arrest or sudden death, and females are at lower
          risk (hazard ratio 0.54, 95% CI 0.34 to 0.88). That stratification is what the 186-patient cohort
          proposes as the basis for implanting a defibrillator early rather than after a first arrest,
          which is why it is recorded on this treatment rather than as a stage of the disease course.'
      selected_evidence:
        snippet: A QTc >550 ms and history of syncope during the first year of life are independent predictors
          of subsequent CA/SD.
