            c.112G>A polymorphism, which is not a JLNS2 allele. The screen was Sanger sequencing of the
            two genes only, so it would not detect a copy-number variant, and the cohort is small enough
            that zero is compatible with the low single-digit percentages seen elsewhere. The report also
            never states how many of the 14 investigated patients were solved, so the denominator is patients
            screened rather than cases explained: this is a screening-negative result and is not directly
            comparable with the Egyptian case fraction above it.'
