            term:
              id: MONDO:0012871
              label: Jervell and Lange-Nielsen syndrome 2
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: ChannelopathyAssignment
      assertion:
        classification_value: cardiac channelopathy
        notes: 'ChannelopathyOrganSystemEnum is single-valued, and JLNS2 is a channelopathy in two organ
          systems: the same IKs channel carries ventricular repolarizing current in cardiac myocytes and
          drives potassium secretion by the epithelial marginal cells of the stria vascularis. "cardiac
          channelopathy" is assigned because that is how the disease is classified clinically and how
          its dominant allelic form (LQT5) is grouped, but the cochlear lesion is an epithelial transport
          defect and would take "epithelial channelopathy" if the slot were multivalued. Recorded here
          rather than resolved by picking a second value.'
      selected_evidence:
        snippet: KCNQ1 encodes the alpha subunit Kv7.1 of the ion channels accountable for slow delayed
          rectifier potassium currents (IKs), whereas KCNE1 encodes the beta subunit mink, which modulates
          the function of IKs.
        supports: SUPPORT
    origin:
      assertion_path: /classifications/channelopathy_category
      evidence_path: /classifications/channelopathy_category/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /classifications
    evidence_metadata:
      reference: PMID:42389506
      reference_title: Jervell and Lange-Nielsen Syndrome Related Clinical Genetics and Experimental Models.
      evidence_source: OTHER
      explanation: Identifies KCNE1 as the beta subunit of the IKs potassium channel, so JLNS2 is an ion-channel
        disorder; paired with the QT prolongation that defines the syndrome, this supports the cardiac
        channelopathy grouping.
