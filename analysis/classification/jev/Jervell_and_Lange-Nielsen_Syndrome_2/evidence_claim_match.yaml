        discussion_id: jlns2_vestibular_human_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
        prompt: Do genotype-confirmed human JLNS2 (biallelic KCNE1) patients have clinically significant
          vestibular dysfunction, as Kcne1-/- mice do?
        rationale: 'Kcne1-/- mice show clear structural and functional vestibular involvement: KCNQ1/KCNE1
          channels are expressed in vestibular dark cells as well as strial marginal cells, and untreated
          Kcne1-/- mice show abnormal endolymphatic-space development, vestibular hair cell degeneration,
          and impaired vestibular behavior that gene therapy can rescue (PMID:33514733). However, the
          only quantitative human vestibular study of JLNS (PMID:25471708) genotyped its cohort and found
          all 14 tested cases carried double KCNQ1 (JLNS1) mutations, not KCNE1. Whether the mouse vestibular
          phenotype translates to genotype-confirmed human JLNS2 patients is therefore untested, and this
          entry deliberately does not curate vestibular dysfunction as an established JLNS2 phenotype.'
        proposed_experiments:
        - experiment_id: exp_jlns2_genotype_stratified_vestibular_function
          name: Genotype-stratified human vestibular function study in JLNS2
          description: Vestibular function testing (post-rotatory nystagmus, video head impulse testing)
            in a cohort of genotype-confirmed KCNE1/JLNS2 patients, analogous to the KCNQ1-genotyped study
            already published for JLNS1 (PMID:25471708).
      selected_evidence:
        snippet: Mutations in voltage-gated potassium channel KCNE1 cause Jervell and Lange-Nielsen syndrome
          type 2 (JLNS2), resulting in congenital deafness and vestibular dysfunction.
        supports: SUPPORT
