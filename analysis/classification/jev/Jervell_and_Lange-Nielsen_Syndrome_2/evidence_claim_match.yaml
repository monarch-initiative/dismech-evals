  25b33f8129b401e65cc165b7cf4f045e6643dccfb3a8361d679d3dea5f52eef4:
    claim:
      about:
        disease:
          name: Jervell and Lange-Nielsen Syndrome 2
          disease_term:
            preferred_term: Jervell and Lange-Nielsen syndrome 2
            term:
              id: MONDO:0012871
              label: Jervell and Lange-Nielsen syndrome 2
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: CHO-K1 heterologous KCNQ1/KCNE1 expression with automated voltage clamp
        description: Chinese hamster ovary (CHO-K1) cells stably expressing human KCNE1, into which KCNE1
          variants are coexpressed with KCNQ1 and the resulting IKs current is measured by high-throughput
          automated patch-clamp recording. Variants were studied in the homozygous state, which is the
          configuration that corresponds to biallelic JLNS2 genotypes, and a subset additionally in the
          heterozygous state corresponding to the dominant LQT5 configuration. This is the assay that
          supplies the loss-of-function mechanism and the carrier-frequency estimate curated elsewhere
          in this entry.
        experimental_model_type: CELL_LINE
        organism:
          preferred_term: Chinese hamster
          term:
            id: NCBITaxon:10029
            label: Cricetulus griseus
        cell_source: CHO-K1 cell line stably expressing human KCNE1, with KCNQ1 and variant KCNE1 introduced
          by transfection.
        culture_system: Heterologous expression in a non-excitable mammalian cell line with high-throughput
          automated patch-clamp electrophysiology.
        conditions:
        - 95 KCNE1 variants expressed in the homozygous state
        - a subset of variants additionally coexpressed with wild-type KCNE1 (heterozygous state)
        publication: PMID:41200805
        modeled_mechanisms:
        - target: Biallelic KCNE1 Loss of Function
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Expressing a KCNE1 variant in the homozygous state alongside KCNQ1 reproduces the
            molecular configuration of a JLNS2 genotype and measures the resulting IKs current directly,
            which is the node's claim.
          limitations: A non-excitable rodent cell line supplies neither the native cardiomyocyte action
            potential nor the stria vascularis epithelium, so the assay reports channel function in isolation
            and cannot show either downstream consequence. Channel subunit stoichiometry and trafficking
            in a heterologous system need not match the native tissue.
          readouts:
          - name: IKs peak current density and activation voltage-dependence
            target: Biallelic KCNE1 Loss of Function
            direction: DECREASED
            interpretation: Reduced peak IKs current density in the homozygous configuration is the direct
              measurement of the loss of function this node asserts.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: The cardiomyocyte action potential and the stria vascularis epithelium are outside
              the model boundary. The assay measures the channel current only, so every downstream node
              in both branches of this entry's pathograph is inferred rather than observed here.
          - divergence_type: SPECIES_MISMATCH
            materiality: IMMATERIAL
            description: The host cell is Chinese hamster rather than human, but the expressed channel
              subunits are both human and the readout is the current those human subunits carry, so the
              host species does not bear on this link's claim.
        notes: 'This is the only KCNE1-specific experimental platform curated here. No JLNS2-specific
          iPSC-derived cardiomyocyte or inner-ear hair cell model was identified: the published JLNS iPSC
          work engineers KCNQ1 variants (JLNS1), and a review of JLNS experimental models states that
          JLNS-specific iPSC-derived inner hair cell models are lacking. Importing those KCNQ1 models
          here would breach this entry''s KCNE1 scope, so the gap is recorded rather than filled.'
      selected_evidence:
        snippet: We determined the functional properties of 95 KCNE1 variants coexpressed with KCNQ1 in
          heterologous cells using high-throughput voltage-clamp recording.
        supports: SUPPORT
