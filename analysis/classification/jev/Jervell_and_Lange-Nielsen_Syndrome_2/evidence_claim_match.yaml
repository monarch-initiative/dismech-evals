      assertion_type: Pathophysiology
      assertion:
        name: Biallelic KCNE1 Loss of Function
        conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
        role: trigger
        biological_scale: MOLECULAR
        description: Biallelic loss-of-function variants in KCNE1 abolish or severely reduce the regulatory
          (beta-subunit) contribution of MinK to the IKs channel complex. Because KCNE1 must coassemble
          with KCNQ1 to generate a normal IKs current, homozygous or compound heterozygous KCNE1 variants
          produce the same downstream functional deficit as biallelic KCNQ1 loss (JLNS1), even though
          the two genes encode structurally distinct subunits of the same channel. High-throughput voltage-clamp
          profiling shows that most disease-associated KCNE1 variants reduce IKs current density in the
          homozygous state without dominant-negative behavior on coexpressed wild-type subunits, consistent
          with a recessive disease mechanism.
        genes:
        - preferred_term: KCNE1
          term:
            id: hgnc:6240
            label: KCNE1
        molecular_functions:
        - preferred_term: ion channel regulator activity
          term:
            id: GO:0099106
            label: ion channel regulator activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: KCNE1 specifically encodes the beta subunit (mink) of IKs
        supports: SUPPORT
