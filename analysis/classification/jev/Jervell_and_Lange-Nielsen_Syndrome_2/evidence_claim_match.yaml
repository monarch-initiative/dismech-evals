            species: Mouse
            genotype: Kcne1-/-
            publication: PMID:33514733
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Kcne1-/- mice lack Kcne1 expression in strial marginal cells and vestibular dark
          cells, the same cell types that express the KCNQ1/KCNE1 complex in humans, and show abnormal
          endolymphatic-space development.
        limitations: Mouse cochlear structure, developmental timing, and the extent of vestibular involvement
          are not identical to human JLNS2; no genotype-confirmed human vestibular data exist for direct
          comparison (see the HUMAN_MODEL_MISMATCH discussion on this node).
        readouts:
        - name: Reissner's membrane and vestibular wall collapse
          target: Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
          direction: RESTORED
          interpretation: Early AAV1-CB7-Kcne1 gene therapy via the posterior semicircular canal prevented
            collapse of Reissner's membrane and the vestibular wall and preserved normal semicircular
            canal size, demonstrating the causal role of Kcne1 loss in this structural degeneration.
        - name: Auditory brainstem response threshold
          target: Loss of IKs-Mediated Potassium Secretion in Stria Vascularis Marginal Cells
          direction: RESTORED
          interpretation: High-dosage gene therapy preserved auditory function in 16 of 20 treated Kcne1-/-
            mice for at least five months, supporting a causal link between restored strial Kcne1 expression
            and preserved hearing.
      selected_evidence:
        snippet: Both Kcne1−/− and Kcnq1−/− mice exhibit an abnormal development of the endolymphatic
          space, severe degeneration of the hair cells (HCs), and spiral ganglion neurons (SGNs)
        supports: SUPPORT
