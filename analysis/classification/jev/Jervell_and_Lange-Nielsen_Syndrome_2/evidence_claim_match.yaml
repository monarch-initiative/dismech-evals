      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: Molecular confirmation of biallelic KCNE1 pathogenic variants is required to distinguish
          JLNS2 from JLNS1 (biallelic KCNQ1) and from heterozygous KCNE1-related dominant LQT5, which
          lacks congenital deafness.
        results: Detection of two pathogenic KCNE1 alleles (homozygous or compound heterozygous) in trans
          confirms JLNS2 and distinguishes it from the allelic dominant LQT5 phenotype, in which only
          one KCNE1 allele is affected.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: heterozygotes for loss-of-function variants of KCNE1 may have normal QT intervals while
          biallelic null alleles are associated with JLNS2
        supports: SUPPORT
