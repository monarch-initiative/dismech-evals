      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: variant_specific_dominant_negative_vs_haploinsufficiency
        hypothesis_label: Variant-specific dominant-negative versus simple loss-of-function/haploinsufficiency
          KCNE1 mechanism
        status: EMERGING
        description: KCNE1 loss-of-function variants appear to split mechanistically by variant. A large
          2025 functional screen found no apparent dominant-negative effect on wild-type IKs current among
          the KCNE1 variants it tested when coexpressed with wild-type KCNE1, consistent with a simple
          recessive loss-of-function/haploinsufficiency mechanism requiring biallelic loss for JLNS2.
          However, an independent study of KCNE1 nonsense and missense alleles reports that coassembly
          of certain other mutant KCNE1 monomers with wild-type KCNQ1 subunits produces dominant Romano-Ward
          syndrome via a dominant-negative mechanism. Whether these are truly non-overlapping variant
          classes, or whether the discrepancy partly reflects differences in the specific variants and
          assay conditions tested, is not yet resolved.
      selected_evidence:
        snippet: We observed no apparent dominant-negative effects when variant and wild-type KCNE1 were
          coexpressed.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
