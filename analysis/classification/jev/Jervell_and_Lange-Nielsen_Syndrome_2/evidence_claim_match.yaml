  784e194ce81c59baba81bd8031942195f56a471aba09cfb81ff9ef67dfcb8b9d:
    claim:
      about:
        disease:
          name: Jervell and Lange-Nielsen Syndrome 2
          disease_term:
            preferred_term: Jervell and Lange-Nielsen syndrome 2
            term:
              id: MONDO:0012871
              label: Jervell and Lange-Nielsen syndrome 2
        context: []
      assertion_type: Genetic
      assertion:
        name: KCNE1
        notes: 'KCNE1 (21q22.11) encodes MinK, a 129-amino-acid single-transmembrane-domain protein that
          is the regulatory beta subunit of the IKs channel; it must coassemble with the KCNQ1 (Kv7.1)
          alpha subunit to generate the slow delayed-rectifier potassium current. A 2025 high-throughput
          voltage-clamp screen of 95 KCNE1 variants found that about half exhibited peak current densities
          significantly different from wild type when studied in the homozygous state, with most dysfunctional
          variants showing loss-of-function properties and no apparent dominant-negative effect on the
          specific variant panel tested when variant and wild-type KCNE1 were coexpressed. This is not
          a categorical claim that KCNE1 variants are never dominant-negative: a separate study of KCNE1
          nonsense alleles reports that coassembly of certain other mutant KCNE1 monomers with wild-type
          KCNQ1 subunits does produce dominant Romano-Ward syndrome via a dominant-negative mechanism.
          The two observations are reconciled, not contradictory, by variant-specific mechanism: most
          loss-of-function KCNE1 alleles behave as simple recessive nulls requiring biallelic loss for
          JLNS2, while a smaller set of missense alleles instead act dominantly through interference with
          wild-type KCNQ1/KCNE1 complexes.'
        gene_term:
          preferred_term: KCNE1
          term:
            id: hgnc:6240
            label: KCNE1
        relationship_type: CAUSATIVE
        case_fractions:
        - population: Egyptian JLNS cohort (52 sequenced patients, 47 families, 76.2% consanguineous)
          case_fraction_percent: 2.0
          cohort_size: 52
          notes: One of 52 sequenced JLNS patients carried a homozygous KCNE1 variant; the other 51 carried
            KCNQ1. The authors note this 98%/2% split is close to the 95%/5% split reported by Schwartz
            et al. (2006). Preprint, not yet peer-reviewed at the time of curation.
        - population: Iranian JLNS families (14 patients and their families, KCNQ1/KCNE1 Sanger screen)
          case_fraction_percent: 0.0
          cohort_size: 14
          notes: 'A negative result, recorded because it bears on how rare KCNE1 is as a cause of JLNS.
            No pathogenic KCNE1 variant was found in this cohort; the only KCNE1 finding was the common
            c.112G>A polymorphism, which is not a JLNS2 allele. The screen was Sanger sequencing of the
            two genes only, so it would not detect a copy-number variant, and the cohort is small enough
            that zero is compatible with the low single-digit percentages seen elsewhere. The report also
            never states how many of the 14 investigated patients were solved, so the denominator is patients
            screened rather than cases explained: this is a screening-negative result and is not directly
            comparable with the Egyptian case fraction above it.'
      selected_evidence:
        snippet: The diagnosis of JLNS is established in a child with congenital sensorineural deafness,
          long QT interval, and presence of biallelic pathogenic variants in either KCNQ1 or KCNE1.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
