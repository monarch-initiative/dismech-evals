          prompts an ECG. Those are recorded here rather than as separate environmental entries because
          no ECTO exposure term was found for febrile illness or for hypokalemia. Auditory stimuli are
          also listed as a generic long-QT trigger in that sentence but are deliberately not modeled for
          JLNS2: these patients have congenital profound deafness, so a startle-by-sound trigger cannot
          be assumed to transfer to them, and no JLNS-specific report of it was identified.

          Both sources are syndrome-level: GeneReviews and the review both describe JLNS as a whole, and
          neither stratifies the anesthetic hazard by causal gene.'
