      assertion:
        phase: Fetal and neonatal recognition
        age_range: Fetal life through the neonatal period
        notes: 'The two organ systems declare themselves by different routes and at different clinics:
          prolonged QT intervals and T-wave alternans bring the child to cardiology, with bradycardia
          detectable earlier still from fetal life, while a failed newborn hearing screen brings the child
          to otorhinolaryngology. Both are reported for JLNS as a whole rather than stratified by causal
          gene, so this phase describes JLNS2 by inheritance from the syndrome-level natural history and
          not from KCNE1-genotyped series.'
      selected_evidence:
        snippet: Children diagnosed with JLNS typically exhibit bradycardia beginning in the fetal stage
        supports: SUPPORT
