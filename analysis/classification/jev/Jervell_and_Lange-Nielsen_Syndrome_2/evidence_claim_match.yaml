            term:
              id: MONDO:0012871
              label: Jervell and Lange-Nielsen syndrome 2
        context: []
      assertion_type: Treatment
      assertion:
        name: Atrial Pacing with Beta-Blockade
        description: Atrial pacing combined with escalated beta-blocker dosing, reported in young high-risk
          JLNS children as an alternative to early ICD implantation, which is technically difficult at
          that age. In a Norwegian series of genetically confirmed JLNS patients, six children with atrial
          leads had no arrhythmic events over a mean 6.9 years, while the one patient given a ventricular
          lead died during follow-up. The authors propose it as a bridge to a two-chamber ICD where left
          cardiac sympathetic denervation is unavailable.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: cardiac pacemaker implantation
          term:
            id: NCIT:C80434
            label: Pacemaker Placement
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: cardiac pacemaker
              term:
                id: NCIT:C94198
                label: Cardiac Pacemaker
          therapeutic_agent:
          - preferred_term: beta-adrenergic antagonist
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
        notes: Nine patients, all Norwegian, and the authors present it as provisional ("if confirmed
          in additional patients"), so this is curated as a reported strategy rather than as standard
          care. The cohort is described as genetically confirmed JLNS but the causal gene is not broken
          out in the abstract, and Norwegian JLNS is predominantly KCNQ1, so no KCNE1-specific efficacy
          is claimed. The treatment term is the clinical action (NCIT:C80434, the sibling of the NCIT:C80435
          used for ICD placement in this entry); the device itself is attached as a qualifier, per the
          device-versus-clinical-action convention. therapeutic_modality is DEVICE to match the ICD treatment,
          which is this treatment's nearest analogue in the file, even though the mechanical treatment_term-to-modality
          table would suggest SURGERY for a C15329-family procedure term.
      selected_evidence:
        snippet: The 6 patients with atrial leads survived without events at a mean follow-up of 6.9 years
          after pacemaker implantation.
        supports: SUPPORT
    origin:
