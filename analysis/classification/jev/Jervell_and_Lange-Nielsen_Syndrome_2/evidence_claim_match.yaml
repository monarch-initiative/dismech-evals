      assertion_type: Phenotype
      assertion:
        category: Ear
        name: Congenital Profound Bilateral Sensorineural Hearing Loss
        description: Congenital, profound, bilateral sensorineural hearing loss is a defining feature
          of JLNS, present from birth or identified on newborn hearing screening.
        frequency: VERY_FREQUENT
        phenotype_term:
          preferred_term: Congenital sensorineural hearing impairment
          term:
            id: HP:0008527
            label: Congenital sensorineural hearing impairment
        notes: 'The band is VERY_FREQUENT (80-99%) rather than OBLIGATE (100%), and the distinction is
          in the qualifier rather than in the feature. Congenital sensorineural deafness itself is definitional:
          GeneReviews characterises JLNS by it and the diagnosis requires it, so hearing loss as such
          would justify OBLIGATE. What this phenotype asserts is the *profound* bilateral form named in
          its title, and severity is not uniform across reported patients, so the lower band avoids over-claiming
          on a qualifier the sources do not quantify. Splitting the difference the other way - OBLIGATE
          on a profundity claim - would assert more than GeneReviews supports.

          This is still a different kind of claim from the undenominated "frequent" that was rejected
          as a frequency source for the iron-deficiency anemia and hypergastrinemia phenotypes: those
          have no numerator, no denominator and no definitional standing, whereas this one is bounded
          below by a diagnostic criterion.'
      selected_evidence:
        snippet: Jervell and Lange-Nielsen syndrome (JLNS) is characterized by congenital profound bilateral
          sensorineural hearing loss and long QTc, usually >500 msec.
        supports: SUPPORT
