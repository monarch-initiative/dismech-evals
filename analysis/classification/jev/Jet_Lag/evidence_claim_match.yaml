              label: circadian rhythm sleep disorder, jet lag type
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: LOW
        rationale: Typical jet lag is self-limited over days after travel and does not usually impose
          long-term morbidity, intensive management, or mortality risk. It is still clinically relevant
          because the transient sleep and daytime-function disruption can affect travel, work performance,
          and safety.
      selected_evidence:
        snippet: After a flight through six or more time zones most travellers will take 4‐6 days to re‐establish
          a normal sleeping pattern and not to feel tired during the day.
        supports: SUPPORT
    origin:
