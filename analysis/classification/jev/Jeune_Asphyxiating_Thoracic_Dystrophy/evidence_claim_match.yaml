            description: 'Caused by biallelic mutations in DYNC2I2, previously called WDR34, a dynein-2
              intermediate chain orthologous to Chlamydomonas FAP133. Reported in nine families with a
              clinical diagnosis of Jeune syndrome. Disease-associated alleles produce a range of molecular
              consequences across dynein-2 assembly, IFT-B localization, transition zone integrity and
              Hedgehog signaling. Corresponds to short-rib thoracic dysplasia 11 (SRTD11).

              '
          role: subtype
      assertion_type: Genetic
      assertion:
        name: DYNC2I2 (WDR34) Mutations
        gene_term:
          preferred_term: DYNC2I2
          term:
            id: hgnc:28296
            label: DYNC2I2
        association: Causative
        relationship_type: CAUSATIVE
        subtype: DYNC2I2-associated
        notes: 'Biallelic mutations in WDR34, renamed DYNC2I2 by HGNC, whose approved gene name is dynein
          2 intermediate chain 2. Disease-associated WDR34 mutations produce a diverse spectrum of molecular
          defects including dynein-2 assembly disruption, IFT-B protein mislocalization, transition zone
          integrity loss, and Hedgehog signaling impairment. This mechanistic heterogeneity underlies
          the variable expressivity of WDR34-associated JATD.

          '
      selected_evidence:
        snippet: WDR34 mutations led to different spectrums of phenotypes. Quantitative proteomics demonstrated
          changes in dynein-2 assembly, whereas initiation and extension of the axoneme, localization
          of intraflagellar transport complex-B proteins, transition zone integrity and Hedgehog signalling
          were also affected.
        supports: SUPPORT
