      assertion_type: Pathophysiology
      assertion:
        name: Centriolar Assembly and Ciliogenesis Failure
        description: 'Loss of the centriolar proteins CEP120 and KIAA0586 (TALPID3) blocks ciliogenesis
          upstream of transport: the cilium is not built, rather than built and then incorrectly loaded.
          Patient fibroblasts show reduced cilia and an abnormal number of centrioles, and restoring wild-type
          KIAA0586 rescues the cilia defect. Both genes also produce Joubert-syndrome features, so this
          node is the point at which the skeletal and neurological ciliopathies converge.

          '
        biological_scale: CELLULAR
        genes:
