      assertion:
        name: DYNC2H1-associated
        display_name: DYNC2H1-associated JATD (SRTD3)
        subtype_term:
          preferred_term: asphyxiating thoracic dystrophy 3
          term:
            id: MONDO:0013127
            label: asphyxiating thoracic dystrophy 3
        genes:
        - preferred_term: DYNC2H1
          term:
            id: hgnc:2962
            label: DYNC2H1
        description: 'The most common genetic form, accounting for 33-59% of families. Caused by biallelic
          mutations in DYNC2H1, the dynein-2 heavy chain that provides the motor ATPase of the retrograde
          intraflagellar transport machinery. Characterized by predominantly skeletal involvement with
          limited extra-skeletal features: polydactyly, renal cysts, and retinal dystrophy are rare or
          absent. Corresponds to short-rib thoracic dysplasia 3 (SRTD3).

          '
      selected_evidence:
        snippet: DYNC2H1 patients largely lacked significant extra-skeletal involvement, demonstrating
          an important genotype-phenotype correlation in JATD.
        supports: SUPPORT
