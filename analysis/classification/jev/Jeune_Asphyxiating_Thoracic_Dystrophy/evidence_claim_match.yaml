          disrupts transport of cargo towards the ciliary tip. This impairs ciliary assembly, maintenance,
          and signaling, particularly Hedgehog pathway transduction required for skeletal development.
          The genes bound here are the IFT-B subunits; the retrograde IFT-A adaptor and the dynein-2 motor
          that returns cargo to the ciliary base are modeled as separate nodes, because the complex a
          gene belongs to is what determines which transport direction fails.

          '
