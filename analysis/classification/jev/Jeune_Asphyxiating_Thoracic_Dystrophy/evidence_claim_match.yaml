        association: Causative
        relationship_type: CAUSATIVE
        subtype: IFT74-associated
        notes: 'Biallelic mutations in IFT74, encoding the tubulin-binding subunit of the IFT-B complex.
          Exhibits allele-specific phenotypes: exon 2 deletion alleles produce ciliary chondrodysplasia
          with narrow thorax plus mucociliary clearance disorder (combined primary and motile cilia phenotype),
          while splice site variants cause lethal skeletal chondrodysplasia. This dual primary/motile
          cilia involvement is mechanistically explained by the higher demand for tubulin transport in
          motile cilia.

