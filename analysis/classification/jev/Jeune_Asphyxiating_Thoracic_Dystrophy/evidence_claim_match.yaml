          above. The reported phenotype is restricted to short ribs, a narrow chest, and respiratory insufficiency
          without other diagnostic signs. No molecular pathway assay was reported in these patients, so
          no signaling process is bound to this node; the anatomical site is bound because the source
          states it. The association is described by its authors as newly identified and has not been
          independently replicated.

