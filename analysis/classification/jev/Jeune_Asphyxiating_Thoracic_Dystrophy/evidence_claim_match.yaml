        name: Ciliary Hedgehog and Wnt Signal Transduction Failure
        description: 'Loss of GRK2 produces the Jeune phenotype without any structural cilium defect.
          GRK2 phosphorylates ciliary Smoothened, and its loss compromises cilia-based Hedgehog and Wnt
          signaling while cilia morphology remains intact. This node is kept separate from the transport
          nodes for that reason: the signaling output fails even though the organelle and its transport
          machinery are built correctly. Evidence rests on a single reported case, so this node is the
          least replicated in the entry.

          '
