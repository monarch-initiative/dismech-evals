  4fe8bed4ef2a9bc472c9a4772ceedd267d4fa175e7541a09eaeb3a49e8c96d5e:
    claim:
      about:
        disease:
          name: Joint Laxity, Short Stature, and Myopia
          disease_term:
            preferred_term: joint laxity, short stature, and myopia
            term:
              id: MONDO:0060556
              label: joint laxity, short stature, and myopia
        context: []
      assertion_type: Genetic
      assertion:
        name: GZF1
        notes: 'GZF1 (20p11.21) encodes GDNF-inducible zinc finger protein 1, a BTB/POZ-domain transcriptional
          repressor with tandem zinc fingers. Reported disease alleles are truncating: homozygous truncating
          variants in the two founding consanguineous families, compound heterozygous frameshifts (p.Leu133fs,
          p.Met492fs) in Chinese patients, and the recurrent c.1440del (p.His481IlefsTer26) both homozygous
          and compound heterozygous in a 2026 series. Functional work on two of the frameshift alleles
          shows loss of protein by different routes, which is direct evidence that the mechanism is loss
          of function rather than a dominant-negative effect.

          '
        gene_term:
          preferred_term: GZF1
          term:
            id: hgnc:15808
            label: GZF1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Independently, the same approach identified a second homozygous truncating GZF1 variant
          in another multiplex consanguineous family affected by severe myopia, retinal detachment, and
          milder skeletal involvement.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28475863
      reference_title: GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: A second independent family with a homozygous truncating GZF1 variant, which is what
        establishes the gene-disease relationship rather than a single observation.
