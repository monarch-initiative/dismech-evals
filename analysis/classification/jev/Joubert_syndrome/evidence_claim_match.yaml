  1def8c3da39fa33e8598bc730fd9e1a45599822b7a3430bc04f652047c5d0b83:
    claim:
      about:
        disease:
          name: Joubert syndrome
          disease_term:
            term:
              id: MONDO:0018772
              label: Joubert syndrome
            preferred_term: Joubert syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biliary ductal plate malformation via ciliary tight junction defect
        description: TMEM67 variants confer the highest risk of liver fibrosis among JS genotypes. Mechanistically,
          B9D2 — a TMEM67 partner at the ciliary transition zone — also acts before ciliogenesis to mature
          and maintain epithelial tight junctions, ensuring biliary lumen formation. Loss of B9D2 function
          disrupts cholangiocyte tight junctions and biliary lumen formation, producing the ductal plate
          malformation that underlies congenital hepatic fibrosis and portal hypertension in JS.
        genes:
        - preferred_term: TMEM67
          term:
            id: hgnc:28396
            label: TMEM67
        - preferred_term: B9D2
          term:
            id: hgnc:28636
            label: B9D2
        cell_types:
        - preferred_term: cholangiocyte
          term:
            id: CL:1000488
            label: cholangiocyte
        biological_processes:
        - preferred_term: tight junction assembly
          term:
            id: GO:0120192
            label: tight junction assembly
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Our work demonstrates that before ciliogenesis occurs, B9D2 is crucial for the maturation
          and maintenance of tight junctions ensuring epithelial barrier tightness and appropriate biliary
          lumen formation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/14
      evidence_path: /pathophysiology/14/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39455645
      reference_title: New functions of B9D2 in tight junctions and epithelial polarity.
      explanation: Establishes a non-ciliary B9D2 function in tight junctions and biliary lumen formation
        as the mechanism of biliary dysgenesis in JS.
      evidence_source: IN_VITRO
