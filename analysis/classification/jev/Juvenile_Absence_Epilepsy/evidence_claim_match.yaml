        description: Routine EEG with a standardized period of hyperventilation is the highest-yield single
          test. Hyperventilation reliably provokes generalized spike-wave activity and often a clinical
          absence in untreated patients, which converts an intermittent history into a recorded event.
          Persistence of hyperventilation positivity on follow-up EEG carries prognostic weight, being
          associated with a lower chance of seizure freedom.
