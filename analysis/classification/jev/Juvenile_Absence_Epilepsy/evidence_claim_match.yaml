      assertion_type: Pathophysiology
      assertion:
        name: Aberrant GABAergic Inhibition in the Thalamic Reticular Nucleus
        conforms_to: epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance
        biological_scale: CELLULAR
        description: The thalamic reticular nucleus is a GABAergic shell that inhibits thalamic relay
          neurons. The rhythmic hyperpolarization it imposes is what de-inactivates T-type calcium channels
          in relay cells and licenses the next burst, making reticular GABAergic output the pacemaker
          candidate for the spike-wave rhythm. Recordings in genetic models show reticular neurons fire
          synchronized bursts locked to the EEG spike while retaining intranuclear lateral inhibition.
        cell_types:
        - preferred_term: GABAergic neuron of the thalamic reticular nucleus
          term:
            id: CL:0000617
            label: GABAergic neuron
        biological_processes:
        - preferred_term: gamma-aminobutyric acid signaling pathway
          term:
            id: GO:0007214
            label: gamma-aminobutyric acid signaling pathway
          modifier: ABNORMAL
      selected_evidence:
        snippet: This novel finding demonstrates that spontaneous genetically determined SWDs occur in
          the presence of intra-NRT lateral inhibition.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
