  e8137990ed7c945072789d7ff505f454aef6404fc4e68a37d013e84f36daac79:
    claim:
      about:
        disease:
          name: Juvenile Absence Epilepsy
          disease_term:
            preferred_term: juvenile absence epilepsy
            term:
              id: MONDO:0800453
              label: juvenile absence epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: jae_cortical_focus_human_translation
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: The cortical initiation focus for spike-wave discharges is established in rodent genetic
          models and localizes to somatosensory cortex, a region with no obvious counterpart role in human
          juvenile absence epilepsy. Does a discrete, anatomically stereotyped cortical focus exist in
          human JAE at all?
        attaches_to:
        - pathophysiology#Corticothalamic Drive from Deep-Layer Cortical Neurons
        - pathophysiology#Hypersynchronous Thalamocortical Oscillation
        rationale: 'This is a translational-validity problem rather than an absence of evidence, which
          is why it is recorded as a human-model mismatch and not as a plain knowledge gap. Both pillars
          of the cortical focus argument are rodent: the WAG/Rij time-delay analysis localizing a focus
          to the peri-oral somatosensory cortex, and the GAERS tetrodotoxin inactivation showing that
          focus is necessary and sufficient. The WAG/Rij authors themselves hedged the extrapolation,
          writing only that analogous mechanisms may underlie human absence epilepsy. The mismatch has
          three parts. First, the rodent focus sits in the peri-oral somatosensory cortex, whereas human
          absence-epilepsy imaging implicates frontal and default-mode network structures rather than
          a single stereotyped sensory locus; JAE-specific structural imaging finds reduced grey matter
          in sensorimotor and frontal regions without identifying a discrete ictal generator. Second,
          the rodent models are models of childhood-onset absence, not of a peri-pubertal syndrome; nothing
          in them speaks to the JAE-specific features of later onset and high tonic-clonic burden. Third,
          if the human equivalent is a distributed network state rather than a focus, then focal interventions
          suggested by the rodent work, including targeted neuromodulation, do not have an obvious human
          target.'
        proposed_experiments:
        - experiment_id: exp_human_jae_focus_search_intracranial
          name: Search for a reproducible cortical onset zone in human generalized spike-wave
          description: Analysis of intracranial or high-density scalp recordings from patients with idiopathic
            generalized epilepsy who have undergone invasive monitoring or dense EEG, applying the same
            nonlinear time-delay association methods used in the WAG/Rij rat to test whether a consistent
            cortical site leads the rest of the network at discharge onset.
          decision_criterion: A reproducible leading cortical site across patients would establish that
            the rodent focus concept transfers; heterogeneous or absent leading sites would indicate the
            human syndrome is a distributed network disorder and that the focus model should not be carried
            over.
        - experiment_id: exp_jae_specific_rodent_model_peripubertal
          name: Peri-pubertal-onset absence model with tonic-clonic seizures
          description: Development or characterization of a rodent or other animal model in which absence
            seizures emerge around puberty and are accompanied by generalized tonic-clonic seizures, matching
            the JAE phenotype rather than the childhood absence phenotype the existing models reproduce.
          decision_criterion: A model that reproduces peri-pubertal onset and tonic-clonic burden would
            allow the cortical-focus question to be asked for JAE specifically rather than inferred from
            childhood absence models.
      selected_evidence:
        snippet: Nonlinear association analysis revealed a consistent cortical "focus" within the peri-oral
          region of the somatosensory cortex.
        supports: SUPPORT
