      assertion_type: Pathophysiology
      assertion:
        name: Polygenic Susceptibility to Generalized Absence Epilepsy
        biological_scale: MOLECULAR
        description: JAE is highly heritable but, in the great majority of patients, is not monogenic.
          Susceptibility is conferred by common variants of individually small effect together with rarer
          variants in genes encoding thalamic and cortical voltage-gated calcium channels and GABA-A receptor
          subunits. No single gene is necessary or sufficient, and the individual gene associations that
          were asserted most confidently in the early literature have not all survived replication.
        biological_processes:
        - preferred_term: regulation of postsynaptic membrane potential
          term:
            id: GO:0060078
            label: regulation of postsynaptic membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: Mutations in GABRG2 have been associated with simple febrile seizures and with genetic
          epilepsy syndromes, including childhood absence epilepsy, generalized epilepsy with febrile
          seizures plus, and Dravet syndrome or severe myoclonic epilepsy in infancy.
        supports: SUPPORT
