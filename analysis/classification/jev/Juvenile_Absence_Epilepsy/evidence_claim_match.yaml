  ffeb548198f410be69521d4ac660aeed879a961249cc83c4082f5c0bcfb3920b:
    claim:
      about:
        disease:
          name: Juvenile Absence Epilepsy
          disease_term:
            preferred_term: juvenile absence epilepsy
            term:
              id: MONDO:0800453
              label: juvenile absence epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: jae_cae_syndrome_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the age-of-onset boundary that separates juvenile absence epilepsy from childhood
          absence epilepsy mark a real mechanistic discontinuity, or is it a convenient cut through a
          single continuous absence-epilepsy spectrum?
        attaches_to:
        - pathophysiology#Polygenic Susceptibility to Generalized Absence Epilepsy
        rationale: 'The two syndromes are separated primarily by age of onset around puberty, and they
          share the thalamocortical mechanism, the EEG signature, and much of their candidate genetics.
          Yet they differ substantially in the things patients care about: absence frequency, generalized
          tonic-clonic burden, and the probability of remission. Nothing currently in the model explains
          why the same circuit lesion should produce a self-limiting pyknoleptic illness when it declares
          at age six and a persistent tonic-clonic-dominant illness when it declares at age twelve. Candidate
          explanations are different underlying genetic architecture, a pubertal endocrine or maturational
          modifier acting on an identical substrate, or an artefact of where the ILAE drew the line. JAE-specific
          imaging offers a partial handle: patients differ from controls in sensorimotor and frontal grey
          matter, and one trait, dorsal midcingulate volume, is shared with unaffected siblings, which
          suggests a heritable trait marker separable from the disease state. This gap matters for curation
          because it determines whether dismech should carry two mechanistically distinct entries or one
          entry with an onset-stratified model.'
        proposed_experiments:
        - experiment_id: exp_cae_jae_shared_polygenic_architecture
          name: Genetic-correlation analysis between CAE and JAE
          description: Estimate the genetic correlation between syndrome-resolved childhood absence epilepsy
            and juvenile absence epilepsy cohorts, and test whether age of onset behaves as a continuous
            polygenic trait or as a mixture of two distinct liability distributions.
          decision_criterion: A genetic correlation near unity with continuous onset liability would favour
            a single spectrum; distinguishable architectures would support two mechanistically separate
            entries.
        - experiment_id: exp_pubertal_modifier_absence_onset
          name: Pubertal endocrine modifier study in absence epilepsy
          description: Prospective study of children with absence epilepsy through puberty, relating pubertal
            staging and sex-steroid trajectories to change in absence frequency, emergence of generalized
            tonic-clonic seizures, and remission.
          decision_criterion: If pubertal transition predicts the shift toward the JAE phenotype in children
            who began with a CAE phenotype, a maturational modifier acting on a shared substrate is supported
            over distinct diseases.
      selected_evidence:
        snippet: increased gray matter volume in the dorsal midcingulate cortex was present in both patients
          and their siblings relative to controls
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41531116
      reference_title: Syndrome-specific and familial imaging traits in juvenile absence epilepsy.
