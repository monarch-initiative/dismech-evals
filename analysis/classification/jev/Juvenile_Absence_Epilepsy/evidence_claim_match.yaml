      assertion_type: Pathophysiology
      assertion:
        name: Altered Thalamic Low-Threshold Calcium Bursting
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        biological_scale: CELLULAR
        description: Thalamic relay and reticular neurons carry a low-voltage-activated T-type calcium
          current that, when a neuron is hyperpolarized and then released, produces a low-threshold calcium
          spike crowned by a high-frequency burst of action potentials. This burst mode is the cellular
          substrate of the spike component of the spike-wave discharge, and it is the target of the first-line
          absence drug ethosuximide.
        cell_types:
        - preferred_term: thalamic relay neuron
          term:
            id: CL:4023068
            label: thalamic excitatory neuron
        biological_processes:
        - preferred_term: T-type calcium current in thalamic neurons
          term:
            id: GO:0090676
            label: calcium ion transmembrane transport via low voltage-gated calcium channel
          modifier: INCREASED
      selected_evidence:
        snippet: The prolonged (up to 15 action potentials), high-frequency bursts present during SWDs
          were tightly synchronized between adjacent neurons, correlated with the EEG spike component,
          and generated by a low-threshold Ca(2+) potential
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11896171
      reference_title: Activity of thalamic reticular neurons during spontaneous genetically determined
        spike and wave discharges.
      evidence_source: MODEL_ORGANISM
      explanation: Intracellular recordings during spontaneous spike-wave discharges in the GAERS rat
        tie the EEG spike component directly to low-threshold calcium-generated bursts, the cellular event
        this node asserts.
