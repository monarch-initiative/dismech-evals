  d5997aad789a636fd50729a98d85afbbb7a45b95ca8a99af17341e80c4d61f37:
    claim:
      about:
        disease:
          name: Juvenile Absence Epilepsy
          disease_term:
            preferred_term: juvenile absence epilepsy
            term:
              id: MONDO:0800453
              label: juvenile absence epilepsy
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Persistence into adulthood with attempted medication withdrawal
        age_range: Adolescence to adulthood
        notes: In contrast to childhood absence epilepsy, JAE usually persists. In a 10-year follow-up
          cohort, about two thirds of patients reached at least two years of seizure freedom on medication,
          and roughly half attempted medication withdrawal, but only a small number ultimately discontinued
          treatment entirely. EEG abnormalities improved over follow-up in most patients.
      selected_evidence:
        snippet: Juvenile absence epilepsy is a common idiopathic generalized epilepsy syndrome that often
          requires long-term antiseizure medications (ASMs). ... This retrospective study included 58
          patients diagnosed with JAE, with a mean age at epilepsy onset of 11.86 ± 3.87 years. The median
          follow-up duration was 9.57 years (range, 3-27 years). Among these patients, 38 (65.5 %) achieved
          seizure freedom for at least 2 years. ... ASMs withdrawal was attempted in 28 patients (48.3
          %) and 18 of them did not experience seizure recurrence during the tapering process. Among these
          18 patients, ASMs were discontinued in 9 patients at the last follow-up. ... After a median
          EEG follow-up period of 6 years, abnormal EEG improved in 34 of the 58 patients (58.6 %). Additionally,
          14 of the 58 patients (24.1 %) had normal EEG in subsequent recordings.
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40945312
      reference_title: 'Long-term seizure outcomes and the likelihood of antiseizure medication withdrawal
        in patients with juvenile absence epilepsy: A 10-year follow-up study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the JAE cohort, onset and follow-up ages, seizure freedom, attempted versus
        completed medication withdrawal, and EEG improvement. Nine patients fully discontinued treatment;
        eighteen had no recurrence during tapering.
