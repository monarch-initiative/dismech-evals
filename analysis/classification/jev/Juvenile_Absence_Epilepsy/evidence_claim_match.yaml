      assertion_type: Pathophysiology
      assertion:
        name: Corticothalamic Drive from Deep-Layer Cortical Neurons
        biological_scale: CELLULAR
        description: Layer VI pyramidal neurons supply the sole descending cortical input to thalamic
          relay and reticular cells. Selectively removing P/Q-type calcium channels from these neurons
          alone is sufficient to produce a spontaneous, ethosuximide-responsive spike-wave absence phenotype,
          showing that the cortical arm of the loop is not merely a passive recipient of a thalamic rhythm.
        cell_types:
        - preferred_term: layer VI corticothalamic projection neuron
          term:
            id: CL:4023013
            label: corticothalamic-projecting glutamatergic cortical neuron
      selected_evidence:
        snippet: Targeted Cacna1a ablation in layer VI cells resulted in mice that display a robust spontaneous
          spike-wave absence seizure phenotype accompanied by behavioral arrest and inhibited by ethosuximide.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26758833
      reference_title: Isolated P/Q Calcium Channel Deletion in Layer VI Corticothalamic Neurons Generates
        Absence Epilepsy.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that a lesion confined to the corticothalamic arm is sufficient to generate
        the absence phenotype, supporting a cortical contribution to ictogenesis independent of a primary
        thalamic defect.
