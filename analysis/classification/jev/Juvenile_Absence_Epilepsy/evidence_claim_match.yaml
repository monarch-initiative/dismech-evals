      reference_title: Absence epilepsies with widely variable onset are a key feature of familial GLUT1
        deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the autosomal dominant familial form and its extra-epileptic features,
        which are the clinical handles that separate it from polygenic JAE.
