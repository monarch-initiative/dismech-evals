          rather than from JAE-diagnosed patients. The familial form nevertheless has widely variable
          onset, so it stays on the differential list for atypical or refractory presentations. This is
          the one differential that changes management, since the ketogenic diet supplies ketone bodies
          as an alternative fuel that bypasses the missing transporter. The diet is deliberately not listed
          under this entry's treatments, because it treats this differential rather than JAE itself and
          no JAE-specific evidence for it was found in this curation pass.
        distinguishing_features:
        - Reduced CSF-to-plasma glucose ratio on paired fasting samples.
        - Pathogenic SLC2A1 variant, often autosomal dominant and familial.
        - Paroxysmal exertional dyskinesia in some affected family members.
        - Onset typically before four years of age in the screened cohorts.
        - Responsive to the ketogenic diet, unlike polygenic JAE.
      selected_evidence:
        snippet: Familial glucose transporter type 1 (GLUT1) deficiency due to autosomal dominant inheritance
          of SLC2A1 mutations is associated with paroxysmal exertional dyskinesia; epilepsy and intellectual
          disability occur in some family members.
        supports: SUPPORT
