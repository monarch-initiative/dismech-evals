      assertion:
        name: Childhood Absence Epilepsy
        disease_term:
          preferred_term: childhood absence epilepsy
          term:
            id: MONDO:0010826
            label: childhood absence epilepsy
        description: The nearest neighbour of JAE and the hardest to separate, because the two share the
          thalamocortical mechanism, the EEG signature, and much of their candidate genetics. The age-of-onset
          boundary between them is a curation-relevant open question, recorded in the discussions block.
        distinguishing_features:
        - Earlier onset, typically in mid-childhood rather than around puberty.
        - Pyknoleptic absences occurring many times daily rather than sporadically.
        - Much lower burden of generalized tonic-clonic seizures.
        - High rate of spontaneous remission, whereas JAE usually persists.
      selected_evidence:
        snippet: The goal of this paper is to delineate the four syndromes comprising the IGEs, namely
          childhood absence epilepsy, juvenile absence epilepsy, juvenile myoclonic epilepsy, and epilepsy
          with generalized tonic-clonic seizures alone.
        supports: SUPPORT
