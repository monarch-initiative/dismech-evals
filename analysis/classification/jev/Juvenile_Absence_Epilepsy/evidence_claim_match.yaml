  efd6a8efbdd832e1298e4210a3a8265827ebda115d1d03d0b6f1580f2fdc095e:
    claim:
      about:
        disease:
          name: Juvenile Absence Epilepsy
          disease_term:
            preferred_term: juvenile absence epilepsy
            term:
              id: MONDO:0800453
              label: juvenile absence epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cacna1h_disputed_gene_disease_validity
        kind: CONTROVERSY
        status: OPEN
        prompt: Given that ClinGen has reclassified CACNA1H as a disputed epilepsy gene, should CACNA1H
          be retained in the JAE model at all, and if so on what footing?
        attaches_to:
        - pathophysiology#Polygenic Susceptibility to Generalized Absence Epilepsy
        - pathophysiology#Altered Thalamic Low-Threshold Calcium Bursting
        rationale: 'CACNA1H encodes Cav3.2, the very T-type channel that carries the thalamic low-threshold
          current this entry models, so the gene is mechanistically attractive. It was reported in a childhood
          absence epilepsy cohort in 2003 and subsequently entered commercial epilepsy gene panels. A
          2020 reassessment found that no published or ClinVar CACNA1H variant would meet ACMG criteria
          for pathogenic or likely pathogenic, that large exome studies show no enrichment of rare or
          de novo CACNA1H variants in epilepsy cohorts relative to controls, and that Cacna1h knockout
          mice do not seize. ClinGen classified the gene-disease relationship as disputed. The residual
          possibility is that CACNA1H acts as a modifier rather than a monogenic cause, which is exactly
          what the GAERS rat suggests, where a Cacna1h variant accounts for roughly a third of the variance
          in seizure frequency.

          That choice has been made here rather than inherited from legacy panels. The gene is retained
          with relationship_type MODIFIER, not SUSCEPTIBILITY. The refutation of monogenic causation is
          carried directly as REFUTE evidence, and the surviving modifier role alongside it as PARTIAL,
          sourced to the GAERS observation above. Removal was rejected because Cav3.2 is the T-type channel
          this entry''s whole thalamic-bursting mechanism runs on, so deleting it would leave that mechanism
          attributed to no gene at all; a demoted typing that carries both the refutation and what survived
          it is the more honest record.

          The discussion stays OPEN because the science is unsettled, not because the curation decision
          is. ClinGen''s disputed classification stands, the modifier role rests on rodent data, and the
          experiments below are what would resolve it.'
        proposed_experiments:
        - experiment_id: exp_cacna1h_common_variant_burden_jae
          name: CACNA1H variant burden in syndrome-resolved IGE cohorts
          description: Burden and common-variant association testing of CACNA1H in large idiopathic generalized
            epilepsy cohorts that are resolved to ILAE 2022 syndrome level, so that JAE is analysed separately
            from childhood absence epilepsy rather than pooled.
          decision_criterion: A significant burden or association confined to a syndrome stratum would
            justify retaining CACNA1H as a susceptibility contributor; a null result across strata would
            justify removing it from the model.
        - experiment_id: exp_cacna1h_modifier_effect_human
          name: Test of CACNA1H as a seizure-severity modifier in humans
          description: Test whether CACNA1H genotype modifies seizure frequency, drug response, or age
            of onset among patients who already carry an established epilepsy risk background, mirroring
            the modifier effect observed in the GAERS rat.
          decision_criterion: A reproducible genotype-severity relationship would support recuration of
            CACNA1H as a modifier rather than a susceptibility or causal gene.
      selected_evidence:
        snippet: the current status of CACNA1H as a monogenic cause of epilepsy is controversial, highlighted
          by ClinGen's recent reclassification of CACNA1H as disputed
        supports: SUPPORT
