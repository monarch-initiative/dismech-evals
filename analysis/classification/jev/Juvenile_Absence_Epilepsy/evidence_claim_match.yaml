        discussion_id: jae_thalamic_versus_cortical_ictogenesis
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: Is the generalized spike-wave discharge of juvenile absence epilepsy initiated by a thalamic
          pacemaker, or does it originate in cortex and merely recruit the thalamus, and does the answer
          change what should be considered the primary drug target?
        attaches_to:
        - pathophysiology#Aberrant GABAergic Inhibition in the Thalamic Reticular Nucleus
        - pathophysiology#Corticothalamic Drive from Deep-Layer Cortical Neurons
        - pathophysiology#Hypersynchronous Thalamocortical Oscillation
        rationale: 'The classical account, and the one that motivates ethosuximide, places the pacemaker
          in thalamus: reticular GABAergic neurons rhythmically hyperpolarize relay cells, de-inactivating
          T-type calcium channels and producing the burst that becomes the EEG spike. Intracellular recordings
          in the GAERS rat support that reticular neurons burst in tight synchrony with the EEG spike.
          But a competing body of work locates initiation in cortex. Focal tetrodotoxin inactivation of
          facial somatosensory cortex in GAERS abolishes paroxysmal activity both locally and in the thalamic
          neurons connected to it, whereas inactivating a remote motor cortical region or the related
          thalamic nuclei does not; and deleting P/Q calcium channels from layer VI corticothalamic neurons
          alone is sufficient to produce spontaneous spike-wave absence seizures. A 2020 synthesis states
          outright that cortical rather than exclusively thalamic mechanisms drive ictogenesis and set
          the spike-wave frequency. This entry therefore models both arms as contributing nodes rather
          than asserting a single origin. The stake is practical: if ictogenesis is cortical, thalamic
          T-type blockade is treating a downstream amplifier rather than the initiator, which would help
          explain why ethosuximide controls absences but not the tonic-clonic seizures that dominate JAE
          morbidity. It is also worth noting that the decisive experiments are rodent genetic models of
          childhood-type absence, so their transfer to the peri-pubertal human syndrome is itself unestablished.'
        proposed_experiments:
        - experiment_id: exp_jae_meg_eeg_onset_localization
          name: High-density MEG-EEG source localization of spike-wave onset in JAE
          description: Simultaneous high-density EEG and magnetoencephalography in drug-naive JAE patients,
            with source reconstruction of the first tens of milliseconds of each generalized spike-wave
            discharge, testing whether a reproducible cortical onset zone precedes thalamic recruitment
            as it does in rodent models.
          decision_criterion: A consistent cortical lead over thalamic activity at discharge onset would
            support cortical ictogenesis in the human syndrome; simultaneous or thalamus-leading onset
            would support the thalamic pacemaker account.
        - experiment_id: exp_jae_targeted_ttype_blocker_trial
          name: Selective T-type calcium channel blocker trial in JAE
          description: Clinical trial of a selective T-type calcium channel antagonist in JAE, reporting
            absence and generalized tonic-clonic outcomes separately rather than pooled.
          decision_criterion: Suppression of absences without effect on tonic-clonic seizures would indicate
            the thalamic burst mechanism is specific to the absence phenotype and not the whole syndrome;
            suppression of both would argue the thalamic node is upstream of the shared generalized mechanism.
      selected_evidence:
        snippet: in contrast to the predominant opinion, cortical mechanisms, rather than an exclusively
          thalamic rhythmogenesis, are key in driving seizure ictogenesis and determining spike-wave frequency
        supports: SUPPORT
