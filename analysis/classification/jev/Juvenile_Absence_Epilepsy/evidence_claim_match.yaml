              label: juvenile absence epilepsy
        context: []
      assertion_type: Treatment
      assertion:
        name: Selective Sodium Channel Blockers (Seizure-Aggravating)
        description: 'Selective sodium channel blockers, principally carbamazepine and its relatives oxcarbazepine
          and phenytoin, carry a recognized risk of seizure worsening in the genetic generalized epilepsies
          and are generally avoided in JAE. This is modelled as a treatment entry with an aggravating
          rather than therapeutic target_mechanisms link so that the contraindication sits on the pathograph
          instead of floating free as a warning.

          Scope of the evidence. The cited cohort covers selective sodium channel blockers only, and its
          observed aggravation was significantly associated with juvenile myoclonic epilepsy rather than
          with JAE, so the edge is recorded against the shared generalized hypersynchrony node rather
          than against a JAE-specific mechanism.

          Not evidenced here. The GABA-elevating agents vigabatrin and tiagabine, and the gabapentinoids,
          are also classically listed as absence-aggravating, and the usual mechanistic account is that
          raising thalamic GABA tone increases GABA-B-mediated hyperpolarization of relay neurons, de-inactivating
          T-type calcium channels and licensing more burst firing. That account is biologically continuous
          with the mechanism this entry models, but no citable source for it was located in this curation
          pass, so it is stated here as background rather than curated as an evidenced mechanism edge.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: carbamazepine
            term:
              id: CHEBI:3387
              label: carbamazepine
      selected_evidence:
        snippet: Selective sodium channel blockers (SSCBs) have a limited use in genetic generalized epilepsy
          (GGE), due to their well-known risk of seizure worsening.
        supports: SUPPORT
