      - /disease_term
    evidence_metadata:
      reference: PMID:42466628
      reference_title: Rare variant analysis of whole genome sequenced juvenile idiopathic arthritis multiplex
        pedigrees identifies rare variants in NOD2 and ACVR1.
      evidence_source: HUMAN_CLINICAL
      explanation: WGS of 23 multiplex JIA families identified NOD2 pathogenic variants in four families,
        establishing NOD2 as a candidate gene in familial JIA. The known-pathogenic variants score 3.08-4.77
        on GEM; the one VUS family scores 0.962-1.04, so the two are reported separately rather than as
        a single span.
