            term:
              id: MONDO:0011429
              label: juvenile idiopathic arthritis
        context: []
      assertion_type: Genetic
      assertion:
        name: HLA-DRB1
        gene_term:
          preferred_term: HLA-DRB1
          term:
            id: hgnc:4948
            label: HLA-DRB1
        association: Susceptibility
        notes: HLA class II is the dominant genetic susceptibility locus for JIA, with `HLA-DRB1` alleles
          showing subtype-specific risk associations (HLA-DRB1*08 in oligoarticular and polyarticular
          JIA; HLA-DRB1*11 additionally predisposing to oligoarticular JIA; HLA-DRB1*01 and HLA-DRB1*04
          in RF-positive polyarticular JIA; HLA-DRB1*04 in systemic JIA). RF-positive polyarticular JIA
          is increasingly recognized as childhood-onset seropositive rheumatoid arthritis with distinct
          genetic architecture from RF-negative disease, though all polyarticular subtypes show shared
          immunogenetic features suggesting overlapping immune-mediated mechanisms.
      selected_evidence:
        snippet: Genetic predisposition to JIA is mainly due to HLA class II molecules (HLA-DRB1, HLA-DPB1),
          although HLA class I molecules and non-HLA genes have been implicated, too.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
