        context: []
      assertion_type: Genetic
      assertion:
        name: NOD2
        gene_term:
          preferred_term: NOD2
          term:
            id: hgnc:5331
            label: NOD2
        association: Risk Factor
        relationship_type: RISK_FACTOR
        notes: 'Pathogenic variants in NOD2 were identified in four familial JIA multiplex pedigrees (R334Q,
          R334W, R587C). Their GEM scores run 3.08 to 4.77, above the study''s stated diagnostic threshold
          of 2; a fourth pedigree carries a NOD2 variant reported in ClinVar as a VUS, scoring 0.962 to
          1.04. The frameshift N637Sfs*120 is a separate finding from the 115-singleton replication cohort
          rather than the multiplex pedigrees, and the authors discount it: the transcript is predicted
          to undergo nonsense-mediated decay, but gnomAD constraint metrics suggest NOD2 is haplosufficient,
          so they judge it less likely to contribute to that individual''s risk while still worth experimental
          follow-up. NOD2 variants are associated with Blau syndrome, an ultra-rare autosomal-dominant
          autoinflammatory disorder, and recent studies show substantial phenotypic overlap with milder
          presentations of Blau syndrome being misdiagnosed as JIA. The authors'' own primary reading
          is stronger than shared pathogenesis - they describe these as an additional four families with
          Blau syndrome previously ascertained as JIA - which bears on whether these families are JIA
          at all, and is why this gene is recorded as a risk factor for the JIA concept rather than as
          causative of it.'
      selected_evidence:
        snippet: Pathogenic variants in NOD2 associated with Blau syndrome, an ultra-rare Mendelian inflammatory
          disorder, are the most recurrent variants in the cohort, consistent with previous reports that
          milder presentations of Blau syndrome are oftentimes misdiagnosed as juvenile idiopathic arthritis.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/2
      evidence_path: /genetic/2/evidence/0
      context_paths:
