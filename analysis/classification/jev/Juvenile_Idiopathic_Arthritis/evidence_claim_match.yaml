              label: juvenile idiopathic arthritis
        context: []
      assertion_type: Genetic
      assertion:
        name: SMAD6
        gene_term:
          preferred_term: SMAD6
          term:
            id: hgnc:6772
            label: SMAD6
        association: Risk Factor
        relationship_type: RISK_FACTOR
        notes: A frameshift variant in SMAD6 (R231Sfs*72) was identified segregating in one JIA multiplex
          family across three affected children and an affected parent. The authors call it a candidate
          variant and state that experimental follow-up is needed to confirm the consequence of the frameshift
          on the transcript and/or protein, which is why this entry records SMAD6 as a risk factor rather
          than as causative in the Mendelian sense. In silico prediction by MutationTaster suggests the
          truncated protein would lose SMAD1-binding capacity and fail to inhibit BMP-SMAD1 signaling;
          that is a prediction, not a measured loss of function. SMAD6 is a canonical negative regulator
          of BMP signal transduction, and SMAD6-deficient mice show elevated BMP signaling in growth-plate
          chondrocytes with aberrant differentiation. The SMAD6 frameshift thus complements the ACVR1
          gain-of-function variants in suggesting BMP pathway dysregulation as a mechanistic contributor
          to JIA pathogenesis.
      selected_evidence:
        snippet: Within our cohort, we observed a frameshift (R231Sfs*72) in SMAD6 shared by three affected
          children and an affected parent with a positive family history of autoimmune disease.
        supports: SUPPORT
