              label: juvenile idiopathic arthritis
        context:
        - path: /pathophysiology/0
          value:
            name: Synovial Leukocyte Infiltration
            description: T-cell and macrophage recruitment to the synovial membrane is the initiating
              cellular event of synovitis in JIA, with the relative contribution of adaptive autoimmunity
              versus innate autoinflammation varying by ILAR subtype. Recent synovial atlas and spatial
              transcriptomic studies have identified that these infiltrating immune cells form organized
              inflammatory niches within the synovium, with distinct subsets of T cells (particularly
              lymphocyte activation markers), synovial macrophages, and B cells positioning themselves
              in tissue-specific configurations that sustain chronic arthritis. The genetic susceptibility
              loci identified by GWAS (lymphocyte activation, cytokine signaling, and immune regulation
              genes) directly correlate with these immune-cell states, linking inherited risk to the cellular
              environment perpetuating synovitis.
            cell_types:
            - preferred_term: T cell
              term:
                id: CL:0000084
                label: T cell
            - preferred_term: macrophage
              term:
                id: CL:0000235
                label: macrophage
            - preferred_term: B cell
              term:
                id: CL:0000236
                label: B cell
            biological_processes:
            - preferred_term: immune response
              modifier: ABNORMAL
              term:
                id: GO:0006955
                label: immune response
            - preferred_term: lymphocyte activation
              modifier: INCREASED
              term:
                id: GO:0046649
                label: lymphocyte activation
            locations:
            - preferred_term: synovial membrane
              term:
                id: UBERON:0002018
                label: synovial membrane of synovial joint
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Synovial Hyperplasia
        causal_link_type: DIRECT
      selected_evidence:
        snippet: synovial inflammation is the consequence of a disturbed balance between proinflammatory
          effector cells (such as T-helper-17 cells), and anti-inflammatory regulatory cells (such as
          FOXP3-positive regulatory T cells)
        supports: SUPPORT
