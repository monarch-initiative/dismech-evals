  6dda251581513cd43917392468dbb631c738e4fffcaf2c9ae219e0231096f31e:
    claim:
      about:
        disease:
          name: Juvenile Idiopathic Arthritis
          disease_term:
            preferred_term: juvenile idiopathic arthritis
            term:
              id: MONDO:0011429
              label: juvenile idiopathic arthritis
        context: []
      assertion_type: Genetic
      assertion:
        name: ACVR1
        gene_term:
          preferred_term: ACVR1
          term:
            id: hgnc:171
            label: ACVR1
        association: Risk Factor
        relationship_type: RISK_FACTOR
        notes: Rare variants in ACVR1 (R160G and H121Y) were identified in two JIA multiplex families.
          Both are reported as VUS in ClinVar and score 0.75-1.63 on GEM, below the study's stated diagnostic
          threshold of 2, and the authors call them candidate variants, contributing familial and experimental
          data to support reclassification while stating that additional follow-up is still needed. That
          is why this entry records ACVR1 as a risk factor rather than as causative in the Mendelian sense.
          Inheritance is weaker than clean autosomal-dominant segregation in both families. R160G is transmitted
          from an affected mother to three children with oligoarticular JIA, but Sanger sequencing showed
          five of eight children carry it and two carriers are unaffected, so penetrance is incomplete
          - the authors note those two were under 16 at ascertainment and may yet develop JIA. H121Y was
          not transmitted from the mother, who has scleroderma rather than autoimmune arthritis, and the
          father was not genotyped. The paper's own wording is that the JIA-associated variants are likely
          autosomal dominant. AlphaFold3 modeling predicts that both variants disrupt the interaction
          between ACVR1 and its inhibitor O-GlcNAc transferase (OGT), suggesting a gain-of-function phenotype
          that results in aberrant BMP signaling activation. Drosophila modeling demonstrates that ACVR1R160G
          exhibits 1.4-fold greater embryonic lethality than wild-type, consistent with elevated Dpp/BMP
          pathway activation. The JIA-associated variants map upstream of the FOP-associated R206H mutation,
          raising the possibility of shared BMP pathway dysregulation between JIA and fibrodysplasia ossificans
          progressiva.
      selected_evidence:
        snippet: These computational data support pathogenicity for the ACVR1R160G and ACVR1H121Y missense
          alleles in JIA
        supports: SUPPORT
        directness: INDIRECT
    origin:
