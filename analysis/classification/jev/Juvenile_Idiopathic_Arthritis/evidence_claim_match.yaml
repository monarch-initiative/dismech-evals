      evidence_source: COMPUTATIONAL
      explanation: The AlphaFold3 structural prediction arm, graded COMPUTATIONAL rather than folded into
        the cohort finding. The authors model the ACVR1-OGT interaction and find it disrupted by both
        alleles, as it is by the FOP-associated R206H. INDIRECT because pathogenicity follows from the
        predicted structural disruption by an inference step rather than being measured.
