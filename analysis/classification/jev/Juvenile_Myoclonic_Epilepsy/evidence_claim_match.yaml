      assertion_type: Discussion
      assertion:
        discussion_id: jme-valproate-vs-alternatives-women
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Myoclonic and Generalized Seizures
        prompt: Valproate is the most effective drug across all three JME seizure types but is teratogenic
          and generally contraindicated in women of childbearing potential. How well do the main alternatives
          (levetiracetam, lamotrigine) control myoclonic seizures specifically, and can a first-line non-valproate
          strategy achieve comparable seizure freedom without the teratogenic risk?
        rationale: JME predominantly affects adolescents and young adults, so the valproate-teratogenicity
          trade-off is a routine, high-stakes clinical decision. Levetiracetam is favored for women but
          head-to-head evidence on myoclonic-seizure control versus valproate is limited, and lamotrigine
          can aggravate myoclonus in some patients.
        proposed_experiments:
        - experiment_id: jme-nonvalproate-trial
          name: Non-valproate first-line strategy trial
          description: Randomized comparison of levetiracetam (and/or lamotrigine) versus valproate as
            first-line therapy in newly diagnosed JME, stratified by sex, with seizure-freedom and myoclonus-specific
            outcomes and long-term follow-up.
          readouts:
          - name: Seizure freedom and myoclonus control by drug and sex
            target: pathophysiology#Myoclonic and Generalized Seizures
          decision_criterion: Comparable seizure freedom without teratogenic risk would support a non-valproate
            first-line strategy.
          would_support:
          - pathophysiology#Myoclonic and Generalized Seizures
      selected_evidence:
        snippet: Levetiracetam and sodium valproate have similar efficacy
        supports: SUPPORT
