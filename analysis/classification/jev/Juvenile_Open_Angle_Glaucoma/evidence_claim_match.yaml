      assertion:
        name: Mutant Myocilin Misfolding and Trabecular Cell Stress
        conforms_to: glaucoma_optic_neuropathy#Trabecular Meshwork Outflow Dysfunction
        description: 'In MYOC-related JOAG, mutations (predominantly in the olfactomedin domain) cause
          a gain of toxic function: mutant myocilin aggregates intracellularly in trabecular meshwork
          cells instead of being secreted. The resulting ER stress and unfolded-protein response causes
          an early, accelerated timeline of TM cell death, elevated IOP, and downstream glaucomatous optic
          neuropathy. The early-onset, severe phenotype of JOAG reflects the high-penetrance, toxic gain-of-function
          nature of these alleles.

          '
        locations:
        - preferred_term: Eye Trabecular Meshwork
          term:
            id: UBERON:0005969
            label: eye trabecular meshwork
        cell_types:
        - preferred_term: Trabecular Meshwork Cell
          term:
            id: CL:0002367
            label: trabecular meshwork cell
        biological_processes:
        - preferred_term: Endoplasmic Reticulum Unfolded Protein Response
          term:
            id: GO:0030968
            label: endoplasmic reticulum unfolded protein response
          modifier: INCREASED
        - preferred_term: Protein Folding
          term:
            id: GO:0006457
            label: protein folding
          modifier: ABNORMAL
        - preferred_term: Apoptotic Process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: The prevailing pathogenic mechanism involves a gain of toxic function whereby mutant
          myocilin aggregates intracellularly instead of being secreted, which causes cell stress and
          an early timeline for TM cell death, elevated intraocular pressure, and subsequent glaucoma-associated
          retinal degeneration.
        supports: SUPPORT
