        context: []
      assertion_type: Subtype
      assertion:
        name: MYOC JOAG
        display_name: MYOC-related Juvenile Open-Angle Glaucoma
        description: 'Autosomal dominant JOAG caused by mutations in myocilin (MYOC, the GLC1A locus),
          the most commonly identified genetic cause. Mutations cluster in the olfactomedin domain, are
          highly penetrant, and are associated with severe, surgery-prone glaucoma. Mutant myocilin misfolds
          and aggregates intracellularly in trabecular meshwork cells rather than being secreted, triggering
          ER stress and TM cell death with consequent IOP elevation.

          '
        genes:
        - preferred_term: MYOC
          term:
            id: hgnc:7610
            label: MYOC
        subtype_term:
          preferred_term: glaucoma 1, open angle, A
          term:
            id: MONDO:0007664
            label: glaucoma 1, open angle, A
      selected_evidence:
        snippet: Pathogenic variants in the Myocilin gene (MYOC) cause juvenile open angle glaucoma (JOAG)
          in 8-36% of cases, and display an autosomal dominant inheritance with high penetrance.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
