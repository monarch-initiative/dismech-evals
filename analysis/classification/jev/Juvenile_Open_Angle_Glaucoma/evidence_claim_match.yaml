        name: Loss of CYP1B1 Monooxygenase Activity
        biological_scale: MOLECULAR
        description: 'CYP1B1 encodes a cytochrome P450 monooxygenase, and the recessive variants found
          in JOAG reduce or abolish that enzymatic activity. The enzyme''s relevant ocular substrate is
          not known - the review that establishes its activity says so explicitly - so this node asserts
          the loss of the activity and not a particular reaction. In mouse, the same loss produces post-natal
          trabecular meshwork degeneration attributed to increased oxidative stress, which is the route
          by which an enzymatic deficit reaches the outflow pathway.

          '
        genes:
        - preferred_term: CYP1B1
          term:
