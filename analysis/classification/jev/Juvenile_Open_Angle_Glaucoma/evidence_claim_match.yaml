          angle developmental abnormalities that obstruct aqueous outflow and elevate IOP. CYP1B1 is the
          classic primary congenital glaucoma gene, and its involvement in JOAG links juvenile-onset disease
          to a developmental, dysgenetic mechanism rather than purely degenerative outflow failure.

          '
