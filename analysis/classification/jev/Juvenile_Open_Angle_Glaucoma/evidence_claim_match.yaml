          term:
            id: CL:0002367
            label: trabecular meshwork cell
      selected_evidence:
        snippet: The CYP1B1 gene encodes a cytochrome p450 monooxygenase enzyme, and over 150 variants
          have been associated with a spectrum of eye diseases, including primary congenital glaucoma,
          anterior segment dysgenesis, juvenile open-angle glaucoma, and primary open-angle glaucoma.
        supports: SUPPORT
