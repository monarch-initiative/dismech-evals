        name: Autosomal recessive (TNFRSF11B/OPG deficiency, predominant form)
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: The great majority of JPD is autosomal-recessive OPG deficiency from homozygous or
          compound-heterozygous loss-of-function variants in TNFRSF11B, with consanguinity and geographic
          founder alleles (e.g. a Navajo homozygous deletion; a "Balkan" 966_969delTGACinsCTT indel) recurrent
          in the reported cohort. The genetically distinct minority forms — a heterozygous activating
          TNFRSF11A (RANK) duplication and a de novo heterozygous neomorphic SP7 variant — behave dominantly
          and are recorded in the genetic section rather than here.
      selected_evidence:
        snippet: Juvenile Paget's disease, an autosomal recessive osteopathy, is characterized by rapidly
          remodeling woven bone, osteopenia, fractures, and progressive skeletal deformity.
        supports: SUPPORT
