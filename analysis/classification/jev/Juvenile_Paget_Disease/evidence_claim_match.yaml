        age_range: Infancy to early childhood onset; progressive through the adolescent growth spurt
        notes: JPD presents in infancy or early childhood with fractures and deformity and, untreated,
          progresses through the growth years; severe forms carry high morbidity and can be fatal in childhood
          or young adulthood. Early anti-resorptive treatment halts deformity/fracture progression; there
          is no spontaneous remission, and turnover relapses if bisphosphonate therapy is stopped. Extraskeletal
          disease (retinopathy, vascular) can progress even under good skeletal control.
