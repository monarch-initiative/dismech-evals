      assertion:
        name: Ectopic Vascular and Bruch-Membrane Calcification
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: A hypothesised extraskeletal arm reflecting OPG's vascular-protective role. OPG/RANKL
          dysfunction is proposed to promote calcification of Bruch membrane (producing angioid streaks
          liable to choroidal neovascularisation) and of arterial walls (vascular microcalcification with
          a predisposition to carotid and iliac aneurysms). The clinical associations are well documented;
          the mechanistic link is inferential, and the retinopathy notably progresses despite good skeletal
          disease control, indicating partial uncoupling from the osteoclast axis.
      selected_evidence:
        snippet: Osteoprotegerin or its signaling pathway may have a role in calcification of Bruch membrane
          and in the pathogenesis of angioid streaks.
        supports: SUPPORT
        directness: INDIRECT
