        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: jpd-retinopathy-uncoupling
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Why does JPD retinopathy progress despite excellent skeletal disease control on anti-resorptive
          therapy, and is the ocular/vascular arm mechanistically uncoupled from the osteoclast axis that
          bisphosphonates and denosumab target?
        attaches_to:
        - pathophysiology#Ectopic Vascular and Bruch-Membrane Calcification
        - phenotypes#Angioid Streaks and Retinopathy
        rationale: In the long-term denosumab cohort, retinopathy progressed (including sudden vision
          loss requiring anti-VEGF therapy) despite normalised ALP and no new fractures. This suggests
          the Bruch-membrane/vascular calcification arm of OPG deficiency is at least partly independent
          of the RANKL-osteoclast axis, with direct implications for surveillance (ongoing ophthalmology
          regardless of skeletal control) and for whether RANKL-pathway therapy can ever prevent the ocular
          disease.
      selected_evidence:
        snippet: long-term denosumab administration in adults with JPD, who had been previously treated
          with bisphosphonates, was safe and effective in terms of the skeletal disease, but it may not
          prevent the emergence of retinopathy.
        supports: SUPPORT
