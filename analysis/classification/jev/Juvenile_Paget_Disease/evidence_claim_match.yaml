      assertion_type: Genetic
      assertion:
        name: TNFRSF11B
        gene_term:
          preferred_term: TNFRSF11B
          term:
            id: hgnc:11909
            label: TNFRSF11B
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: TNFRSF11B (8q24.12) encodes osteoprotegerin (OPG). Biallelic loss-of-function variants
          — whole-gene/multi-exon deletions, splice variants (e.g. c.30+5G>A), ligand-binding-domain missense
          variants (e.g. c.329G>T p.Gly110Val), cysteine-residue missense, and small indels such as the
          "Balkan" 966_969delTGACinsCTT — cause the predominant autosomal-recessive form. Homozygosity
          dominates; compound heterozygosity is rare. A strong genotype-phenotype gradient runs from severe
          (large deletions, ligand-binding-domain cysteine missense; deformity before 18 months) to mild
          (an exon-5 indel). Founder alleles include a Navajo homozygous deletion and the Balkan indel.
          The functional consequence (loss of function) is recorded on the pathophysiology genetic_context.
      selected_evidence:
        snippet: JPD is characterized by a strong genotype-phenotype correlation, so depending on the
          alteration of the TNFRSN11B gene, the phenotype is variable.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
