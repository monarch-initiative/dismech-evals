        name: Opg-knockout mouse (Tnfrsf11b-/-)
        species: Mouse
        genotype: Tnfrsf11b (Opg) homozygous knockout
        publication: PMID:23607938
        description: The primary and best-validated JPD model. Osteoprotegerin-null mice show numerous
          osteoclasts and rapidly remodelling woven bone (recapitulating the skeletal disease), and reproduce
          the dual deafness of JPD — conductive loss from ossicular resorption plus sensorineural loss
          from cochlear-nerve degeneration.
        modeled_mechanisms:
        - target: Cochlear OPG Deficiency and Spiral Ganglion Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: OPG-null mice reproduce the cochlear-nerve degeneration and sensorineural loss
            of JPD.
          limitations: Mouse cochlear ageing/degeneration biology differs from human; the model demonstrates
            the mechanism but the human sensorineural component remains inferred from it.
          readouts:
          - name: Cochlear-nerve demyelination and spiral-ganglion degeneration
            target: Cochlear OPG Deficiency and Spiral Ganglion Degeneration
            direction: INCREASED
            interpretation: Structural correlate of the sensorineural-loss mechanism in the OPG-null model.
        - target: Accelerated Osteoclastic Bone Resorption
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
