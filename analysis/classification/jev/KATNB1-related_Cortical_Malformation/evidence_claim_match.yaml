        disease:
          name: KATNB1-related Cortical Malformation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_katnb1_organoid_branch_scope
        prompt: Which KATNB1 phenotypes observed in patient-derived iPSCs, brain organoids, mouse embryos,
          zebrafish, and fly neuroblasts correspond to the same human cortical pathograph, and which require
          a distinct human progenitor or migration branch?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Centrosome-Cilium and Mitotic-Spindle Dysregulation
        - pathophysiology#Abnormal Asymmetric Neural Progenitor Division
        - pathophysiology#Microtubule-Dependent Neurogenesis and Neuronal Migration Failure
        rationale: KATNB1 has unusually strong new-approach model evidence because patient-derived iPSCs
          and brain organoids confirm parts of the model-system phenotype. The remaining curation gap
          is not whether organoid evidence exists, but how to weight the organoid migration/neurogenesis
          findings against fly neuroblast, zebrafish, mouse, and fibroblast findings when deciding whether
          a subtype-specific branch is justified.
        proposed_experiments:
        - experiment_id: exp_katnb1_isogenic_organoid_spindle_migration_rescue
          name: KATNB1 isogenic cortical-organoid spindle and migration rescue experiment
          description: Generate patient-derived and engineered human cortical organoids carrying representative
            biallelic KATNB1 loss-of-function or hypomorphic variants, compare them with isogenic corrected
            and knock-in controls, and assay radial-glial spindle behavior, cilium/Hedgehog readouts,
            oRG-like progenitor dynamics, neuronal migration, and rescue by wild-type KATNB1 or targeted
            modulation of the p80/NuMA/dynein microtubule pathway.
          experiment_type:
            preferred_term: isogenic cortical organoid rescue experiment
          model_systems:
