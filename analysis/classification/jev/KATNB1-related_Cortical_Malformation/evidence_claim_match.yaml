  7d69bac5dcd65c6916d1765400114474fd5a656f42be54a991f7eb15a828d495:
    claim:
      about:
        disease:
          name: KATNB1-related Cortical Malformation
          disease_term:
            preferred_term: KATNB1-related microlissencephaly
            term:
              id: MONDO:0014534
              label: lissencephaly 6 with microcephaly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_katnb1_organoid_branch_scope
        prompt: Which KATNB1 phenotypes observed in patient-derived iPSCs, brain organoids, mouse embryos,
          zebrafish, and fly neuroblasts correspond to the same human cortical pathograph, and which require
          a distinct human progenitor or migration branch?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Centrosome-Cilium and Mitotic-Spindle Dysregulation
        - pathophysiology#Abnormal Asymmetric Neural Progenitor Division
        - pathophysiology#Microtubule-Dependent Neurogenesis and Neuronal Migration Failure
        rationale: KATNB1 has unusually strong new-approach model evidence because patient-derived iPSCs
          and brain organoids confirm parts of the model-system phenotype. The remaining curation gap
          is not whether organoid evidence exists, but how to weight the organoid migration/neurogenesis
          findings against fly neuroblast, zebrafish, mouse, and fibroblast findings when deciding whether
          a subtype-specific branch is justified.
        proposed_experiments:
        - experiment_id: exp_katnb1_isogenic_organoid_spindle_migration_rescue
          experiment_design: TARGETED_PERTURBATION
          name: KATNB1 isogenic cortical-organoid spindle and migration rescue experiment
          description: Generate patient-derived and engineered human cortical organoids carrying representative
            biallelic KATNB1 loss-of-function or hypomorphic variants, compare them with isogenic corrected
            and knock-in controls, and assay radial-glial spindle behavior, cilium/Hedgehog readouts,
            oRG-like progenitor dynamics, neuronal migration, and rescue by wild-type KATNB1 or targeted
            modulation of the p80/NuMA/dynein microtubule pathway.
          experiment_type:
            preferred_term: isogenic cortical organoid rescue experiment
          model_systems:
          - name: KATNB1 human iPSC-derived cortical organoid
            description: Three-dimensional human cortical organoid with radial-glial progenitors, oRG-like
              progenitors, and migrating cortical neurons, derived from patient-specific or engineered
              iPSCs.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: radial glial cell
              term:
                id: CL:0000681
                label: radial glial cell
            - preferred_term: neural progenitor cell
              term:
                id: CL:0011020
                label: neural progenitor cell
            - preferred_term: migrating cortical neuron
              term:
                id: CL:0000540
                label: neuron
            conditions:
            - KATNB1-related cortical malformation
            - microlissencephaly
            - katanin microtubule-severing defect
            cell_source: Patient-derived or CRISPR-engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cortical organoid with live imaging, immunostaining, and
              single-cell readouts
          perturbations:
          - name: KATNB1 variant correction or biallelic knock-in
            target: pathophysiology#Biallelic KATNB1 Loss and Katanin Microtubule-Severing Defect
            genes:
            - preferred_term: KATNB1
              term:
                id: hgnc:6217
                label: KATNB1
            description: Correct patient variants or introduce representative KATNB1 variants in an isogenic
              human iPSC background to separate variant mechanism from donor background.
          - name: p80/NuMA/dynein pathway rescue
            target: pathophysiology#Microtubule-Dependent Neurogenesis and Neuronal Migration Failure
            description: Test rescue with wild-type KATNB1 or targeted modulation of the p80/NuMA/dynein
              microtubule-remodeling pathway.
          readouts:
          - name: Progenitor spindle, cilium, and division-mode readouts
            target: pathophysiology#Abnormal Asymmetric Neural Progenitor Division
            biological_processes:
            - preferred_term: mitotic spindle organization
              term:
                id: GO:0007052
                label: mitotic spindle organization
              modifier: DYSREGULATED
            - preferred_term: cilium assembly
              term:
                id: GO:0060271
                label: cilium assembly
              modifier: ABNORMAL
            - preferred_term: asymmetric cell division
              term:
                id: GO:0008356
                label: asymmetric cell division
              modifier: DYSREGULATED
            assays:
            - preferred_term: live-cell imaging assay
            - preferred_term: immunostaining
            direction: POSITIVE
          - name: Neuronal migration and cortical-output readouts
            target: pathophysiology#Microtubule-Dependent Neurogenesis and Neuronal Migration Failure
            biological_processes:
            - preferred_term: neuron migration
              term:
                id: GO:0001764
                label: neuron migration
              modifier: DECREASED
            - preferred_term: neurogenesis
              term:
                id: GO:0022008
                label: neurogenesis
              modifier: DECREASED
            assays:
            - preferred_term: live-cell imaging assay
            - preferred_term: single-cell transcriptomic profiling
            direction: NEGATIVE
          controls:
          - name: Isogenic corrected organoids
            description: Matched organoids in which the patient KATNB1 variant is corrected.
          - name: Isogenic knock-in organoids
            description: Wild-type-background organoids carrying the introduced KATNB1 variant.
          decision_criterion: A shared KATNB1 disease skeleton is supported if mutant organoids reproduce
            spindle/cilium, progenitor-output, and neuronal-migration readouts that are rescued by KATNB1
            correction and reproduced by knock-in. A subtype branch is justified only if specific variants
            reproducibly separate progenitor depletion, ciliary/Hedgehog dysfunction, or migration defects.
          would_support:
          - pathophysiology#Centrosome-Cilium and Mitotic-Spindle Dysregulation
          - pathophysiology#Abnormal Asymmetric Neural Progenitor Division
          - pathophysiology#Microtubule-Dependent Neurogenesis and Neuronal Migration Failure
      selected_evidence:
        snippet: Recent work has uncovered critical cellular and molecular differences between cortical
          development in humans and mice, further underscoring the need to develop human model systems.
        supports: SUPPORT
