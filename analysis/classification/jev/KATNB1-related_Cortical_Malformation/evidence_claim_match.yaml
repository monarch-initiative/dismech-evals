  92241c14b858b1241f803b3dc17e8257798c5a6e737adb06983cfcbbf582ac92:
    claim:
      about:
        disease:
          name: KATNB1-related Cortical Malformation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_katnb1_cilia_spindle_migration_branch_weights
        prompt: How much of KATNB1-related cortical malformation is caused by cilium/Hedgehog dysregulation,
          mitotic-spindle/asymmetric-division failure, reduced progenitor survival, and postmitotic neuronal
          migration failure?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Centrosome-Cilium and Mitotic-Spindle Dysregulation
        - pathophysiology#Abnormal Asymmetric Neural Progenitor Division
        - pathophysiology#Microtubule-Dependent Neurogenesis and Neuronal Migration Failure
        rationale: The literature supports several connected mechanisms, but the current case counts and
          model systems do not yet cleanly partition which branch drives which imaging or developmental
          feature. This matters for curation because subtype-specific branches should be used only when
          the same skeleton is retained and a branch has evidence that differs by variant, cell type,
          or phenotype.
        proposed_experiments:
        - experiment_id: exp_katnb1_branch_dissection_panel
          name: KATNB1 branch-dissection perturbation panel
          description: Compare matched KATNB1 mutant organoids, neural progenitor monolayers, mouse embryonic
            cortex perturbations, and neuronal migration assays using branch-specific readouts for cilia/Hedgehog
            signaling, spindle orientation, progenitor survival, neurogenesis, and migration. Apply KATNB1
            rescue and pathway-specific perturbations to test whether each branch is upstream, downstream,
            or parallel.
          experiment_type:
            preferred_term: cross-model mechanism dissection experiment
          model_systems:
          - name: KATNB1 neural progenitor and cortical organoid panel
            description: Parallel human iPSC-derived neural progenitors and cortical organoids assayed
              with matched mouse or in vivo perturbation readouts.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: neural progenitor cell
              term:
