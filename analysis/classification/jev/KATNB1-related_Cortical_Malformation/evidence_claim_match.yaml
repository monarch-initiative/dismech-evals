        discussion_id: gap_katnb1_cilia_spindle_migration_branch_weights
        prompt: How much of KATNB1-related cortical malformation is caused by cilium/Hedgehog dysregulation,
          mitotic-spindle/asymmetric-division failure, reduced progenitor survival, and postmitotic neuronal
          migration failure?
        kind: KNOWLEDGE_GAP
