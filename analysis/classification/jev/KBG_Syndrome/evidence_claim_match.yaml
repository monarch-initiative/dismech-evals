          modifier: DECREASED
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: regulation of transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: DECREASED
