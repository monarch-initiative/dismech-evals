        - path: /genetic/0
          value:
            name: ANKRD11
            gene_term:
              preferred_term: ANKRD11
              term:
                id: hgnc:21316
                label: ANKRD11
            association: Causative
            presence: Positive
            notes: 'ANKRD11 (16q24.3) is the single causal gene for KBG syndrome. Disease is caused by
              heterozygous loss-of-function sequence variants (frameshift and nonsense predominate; splice-site
              and missense also occur) and by 16q24.3 copy-number deletions involving ANKRD11. In a ClinVar/literature
              synthesis, frameshift and nonsense were the most frequent of 583 pathogenic/likely pathogenic
              ANKRD11 variants. Inheritance is autosomal dominant; a large fraction of cases are de novo.

              '
          role: ancestor
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Familial and de novo cases have been reported. Causative de novo variants occur approximately
          one third of the time. Transmission follows an autosomal dominant pattern.
        supports: SUPPORT
