        notes: 'ANKRD11 (16q24.3) is the single causal gene for KBG syndrome. Disease is caused by heterozygous
          loss-of-function sequence variants (frameshift and nonsense predominate; splice-site and missense
          also occur) and by 16q24.3 copy-number deletions involving ANKRD11. In a ClinVar/literature
          synthesis, frameshift and nonsense were the most frequent of 583 pathogenic/likely pathogenic
          ANKRD11 variants. Inheritance is autosomal dominant; a large fraction of cases are de novo.

          '
