  a0d1238eb42379b5a1f2ef9894a4f7ceab6d845a197d8e1b3bc08287ac847cd2:
    claim:
      about:
        disease:
          name: KBG Syndrome
          disease_term:
            preferred_term: KBG Syndrome
            term:
              id: MONDO:0007846
              label: KBG syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Chromatin-Associated Transcriptional Regulation
        description: 'ANKRD11 is a nuclear transcriptional regulator that controls expression of key developmental
          genes by recruiting chromatin remodelers and interacting with transcriptional repressors and
          activators, including HDAC-containing and p160 coactivator complexes. Reduced ANKRD11 function
          therefore impairs chromatin-linked transcriptional regulation, placing KBG syndrome among the
          "chromatinopathies." Functional studies of truncating variants show escape from nonsense-mediated
          decay, aberrant nuclear accumulation of truncated protein, and reduced transactivation of target
          promoters such as CDKN1A/P21, implicating impaired transcriptional regulatory function and,
          for some alleles, a possible dominant-negative effect.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: ABNORMAL
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: ABNORMAL
        - preferred_term: protein deacetylation (HDAC recruitment)
          term:
            id: GO:0006476
            label: protein deacetylation
          modifier: ABNORMAL
      selected_evidence:
        snippet: The ANKRD11 gene encodes the ankyrin repeat-containing protein 11A transcriptional regulator,
          which is expressed in the brain and implicated in neural development.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36440975
      reference_title: ANKRD11 pathogenic variants and 16q24.3 microdeletions share an altered DNA methylation
        signature in patients with KBG syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Supports ANKRD11''s role as a transcriptional regulator expressed in brain and implicated
        in neural development, the basis of the neurodevelopmental phenotype.

        '
