              label: KBG syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ANKRD11 Haploinsufficiency
        description: 'KBG syndrome results predominantly from haploinsufficiency of ANKRD11 (ankyrin repeat
          domain-containing protein 11) at 16q24.3. Heterozygous loss-of-function sequence variants (most
          frequently frameshift and nonsense), as well as 16q24.3 microdeletions encompassing part or
          all of ANKRD11 (and even deletions limited to the non-coding exon 1 / upstream region), reduce
          functional ANKRD11 dosage. Precise levels of ANKRD11 transcript/protein are essential for normal
          human development, so reduced dosage is the unifying mechanism shared by sequence-variant and
          CNV cases.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: regulation of transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: DECREASED
      selected_evidence:
        snippet: The vast majority of identified variants are loss of function, which include nonsense
          and frameshift variants and larger deletions at 16q24.3. Haploinsufficiency appears to be the
          mechanism of pathogenicity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
