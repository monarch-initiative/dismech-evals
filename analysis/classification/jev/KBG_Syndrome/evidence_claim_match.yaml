              label: KBG syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ANKRD11 Haploinsufficiency
        description: KBG syndrome results predominantly from haploinsufficiency of ANKRD11 (ankyrin repeat
          domain-containing protein 11) at 16q24.3. Heterozygous loss-of-function sequence variants (most
          frequently frameshift and nonsense), as well as 16q24.3 microdeletions encompassing part or
          all of ANKRD11 (and even deletions limited to the non-coding exon 1 / upstream region), reduce
          functional ANKRD11 dosage. Precise levels of ANKRD11 transcript/protein are essential for normal
          human development, so reduced dosage is the unifying mechanism shared by sequence-variant and
          CNV cases.
        genes:
        - preferred_term: ANKRD11
          term:
            id: hgnc:21316
            label: ANKRD11
        molecular_functions:
        - preferred_term: transcription corepressor activity
          term:
            id: GO:0003714
            label: transcription corepressor activity
          modifier: DECREASED
        - preferred_term: histone deacetylase binding
          term:
            id: GO:0042826
            label: histone deacetylase binding
          modifier: DECREASED
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: regulation of transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: DECREASED
      selected_evidence:
        snippet: Heterozygous chromosomal deletion encompassing the partial or entire ANKRD11 gene, as
          well as the loss of function mutations, result in haploinsufficiency of the gene, leading to
          KBG syndrome. This indicates that precise levels of ANKRD11 transcripts or protein are essential
          for human development.
        supports: SUPPORT
    origin:
