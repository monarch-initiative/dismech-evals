        context: []
      assertion_type: Treatment
      assertion:
        name: 4-Aminopyridine (Gain-of-Function Precision Therapy)
        description: 'For patients carrying gain-of-function KCNA2 variants, the potassium-channel blocker
          4-aminopyridine (fampridine) is a mechanism-tailored therapy: it antagonizes the gain-of-function
          defect in vitro and, in n-of-1 trials, benefitted 9 of 11 patients with gain-of-function variants,
          improving seizures, gait, ataxia, alertness, cognition, or speech. It is not appropriate for
          loss-of-function variants, where blocking residual Kv1.2 current would be expected to worsen
          hyperexcitability.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: 4-aminopyridine
            term:
              id: CHEBI:34385
              label: 4-aminopyridine
      selected_evidence:
        snippet: we show for KCNA2-encephalopathy that the K+ channel blocker 4-aminopyridine can antagonize
          gain-of-function defects caused by variants in the KV1.2 subunit in vitro, by reducing current
          amplitudes and negative shifts of steady-state activation and increasing the firing rate of
          transfected neurons.
        supports: SUPPORT
