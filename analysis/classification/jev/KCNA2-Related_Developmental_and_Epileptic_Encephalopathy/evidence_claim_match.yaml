        description: Gain-of-function variants (e.g. R297Q, L298F) shift voltage-dependent activation
          strongly in the hyperpolarizing direction and increase current amplitude, leaving Kv1.2 channels
          permanently open at physiological membrane potentials. The excess potassium conductance hyperpolarizes
          the membrane and electrically silences the affected neuron. Because Kv1.2 is expressed in both
          excitatory and inhibitory neurons, silencing of inhibitory interneurons is the leading hypothesis
          for how a potassium-channel gain of function paradoxically produces network hyperexcitability
          and severe epilepsy.
        role: central_effector
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: interneuron
          term:
            id: CL:0000099
            label: interneuron
        biological_processes:
        - preferred_term: potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: INCREASED
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: R297Q and L298F predict permanently open channels at physiological membrane potentials,
          and electrical silencing by membrane hyperpolarization (as observed in oocytes).
        supports: SUPPORT
