  f70a89faf69a6fee757f89fd5c91022ecdaa6d4d4110fc43662d98eed6fed356:
    claim:
      about:
        disease:
          name: KCNA2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: KCNA2-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0014607
              label: developmental and epileptic encephalopathy, 32
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_kcna2_4ap_generalization
        prompt: Does the benefit of 4-aminopyridine generalize across all gain-of-function KCNA2 variants
          and to the gain-and-loss-of-function subgroup, and can functional variant classification prospectively
          predict which patients respond?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
        rationale: The n-of-1 4-aminopyridine trials showed benefit in 9 of 11 gain-of-function patients,
          but two did not benefit and one worsened, and the gain-and-loss-of-function subgroup — which
          combines an activation shift with reduced amplitude — was not clearly addressed. Whether response
          can be predicted prospectively from the precise biophysical fingerprint of each variant, and
          whether the gain-and-loss group behaves like the gain group for treatment selection, is not
          established, yet it determines who should receive channel-blocking therapy.
        proposed_experiments:
        - experiment_id: exp_kcna2_4ap_variant_response_map
          name: Biophysical response map for 4-aminopyridine across KCNA2 variants
          description: Across a panel of KCNA2 variants spanning pure gain, gain-and-loss, and loss of
            function, quantify the biophysical fingerprint (activation shift, amplitude, inactivation)
            and the in-vitro rescue by 4-aminopyridine, then correlate with clinical response in treated
            patients to build a prospective response predictor.
          experiment_type:
            preferred_term: genotype-response correlation study
          perturbations:
          - name: KCNA2 variant panel expression
            target: pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
            genes:
            - preferred_term: KCNA2
              term:
                id: hgnc:6220
                label: KCNA2
            description: Express each KCNA2 variant class and characterize its biophysical fingerprint
              and 4-aminopyridine sensitivity.
          readouts:
          - name: Channel biophysics and 4-aminopyridine rescue
            target: pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
            biological_processes:
            - preferred_term: potassium ion transmembrane transport
              term:
                id: GO:0071805
                label: potassium ion transmembrane transport
              modifier: INCREASED
            assays:
            - preferred_term: voltage-clamp recording
            direction: NEGATIVE
          controls:
          - name: Wild-type KCNA2
            description: Wild-type Kv1.2 characterized under identical conditions.
          decision_criterion: A predictor is supported if the in-vitro 4-aminopyridine rescue of a variant's
            biophysical defect correlates with clinical response across the treated cohort, and if the
            gain-and-loss group segregates predictably.
          would_support:
          - pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
      selected_evidence:
        snippet: In n-of-1 trials carried out in nine different centers, 9 of 11 patients carrying such
          variants benefitted from treatment with 4-aminopyridine.
        supports: SUPPORT
