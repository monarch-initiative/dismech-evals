  74afbc66517e3071035cb583fa467479f95fd582a92bb4dc10ed2f1effc24a35:
    claim:
      about:
        disease:
          name: KCNA2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: KCNA2-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0014607
              label: developmental and epileptic encephalopathy, 32
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_kcna2_gof_seizure_paradox
        prompt: How does a gain of function of the Kv1.2 potassium channel — which hyperpolarizes and
          electrically silences individual neurons — paradoxically produce a more severe epilepsy than
          the loss-of-function variants, and is preferential silencing of inhibitory interneurons the
          correct explanation at the network level?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
        - pathophysiology#Network Excitation-Inhibition Imbalance and Seizures
        rationale: At the single-neuron level, increased Kv1.2 conductance hyperpolarizes and silences
          neurons, yet clinically the gain-of-function variants cause more severe, generalized epilepsy
          than the loss-of-function variants that produce classic hyperexcitability. The leading resolution
          is that gain of function preferentially silences inhibitory interneurons, disinhibiting the
          network, but this cell-type-specific mechanism has not been definitively established in human
          cortical circuits and remains, in the words of the review literature, an unresolved paradox
          with direct consequences for whether channel-blocking (4-aminopyridine) versus channel-opening
          strategies are appropriate for a given variant.
        proposed_experiments:
        - experiment_id: exp_kcna2_gof_interneuron_silencing
          name: Cell-type-resolved test of interneuron silencing in KCNA2 gain of function
          description: In human iPSC-derived or mouse cortical networks expressing a KCNA2 gain-of-function
            variant, measure firing and intrinsic excitability separately in excitatory neurons and inhibitory
            interneurons, and test whether interneurons are preferentially silenced and whether the resulting
            network is hyperexcitable, with reversal by 4-aminopyridine.
          experiment_type:
            preferred_term: cell-type-resolved electrophysiology experiment
          perturbations:
          - name: KCNA2 gain-of-function expression
            target: pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
            genes:
            - preferred_term: KCNA2
              term:
                id: hgnc:6220
                label: KCNA2
            description: Express a gain-of-function KCNA2 variant (e.g. R297Q or L298F) across a cortical
              network with excitatory and inhibitory neurons distinguished.
          readouts:
          - name: Interneuron versus principal-neuron firing and network activity
            target: pathophysiology#Network Excitation-Inhibition Imbalance and Seizures
            biological_processes:
            - preferred_term: regulation of membrane potential
              term:
                id: GO:0042391
                label: regulation of membrane potential
              modifier: ABNORMAL
            assays:
            - preferred_term: patch-clamp recording
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: Wild-type KCNA2
            description: Wild-type Kv1.2 expressed in the same network.
          - name: 4-aminopyridine versus vehicle
            description: Matched networks treated with 4-aminopyridine or vehicle.
          decision_criterion: Preferential interneuron silencing is supported if inhibitory interneurons
            show disproportionately reduced firing while the network becomes hyperexcitable, and if 4-aminopyridine
            restores interneuron firing and network balance.
          would_support:
          - pathophysiology#Gain-of-Function Kv1.2 Conductance and Neuronal Silencing
          - pathophysiology#Network Excitation-Inhibition Imbalance and Seizures
      selected_evidence:
        snippet: This development has been difficult to understand as traditionally potassium channel
          loss-of-function, not gain-of-function, has been associated with hyperexcitability disorders.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
