            term:
              id: MONDO:0014477
              label: developmental and epileptic encephalopathy, 26
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mouse (Mus musculus)
        genotype: Kcnb1 deletion (loss of function)
        description: Kcnb1-deletion mice, which lose the delayed-rectifier K+ current carried by Kv2.1,
          show reduced thresholds to induced seizures but not spontaneous seizures. This pure loss-of-function
          model recapitulates only a modest hyperexcitability/seizure-susceptibility phenotype and does
          not reproduce the severe spontaneous epileptic encephalopathy of humans, providing the explicit
          loss-of-function counterweight to the gain-of-function and dominant-negative effects of the
          human pore/selectivity-filter variants.
      selected_evidence:
        snippet: Reduction of delayed rectifier potassium current by Kcnb1 deletion in mice results in
          reduced thresholds to induced seizures, but not spontaneous seizures.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
