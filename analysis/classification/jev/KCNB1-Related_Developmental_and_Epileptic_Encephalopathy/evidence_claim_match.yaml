        description: Loss of the repolarizing delayed-rectifier current and an aberrant depolarizing cation
          conductance disturb the excitability of cortical and hippocampal neurons. In heterologous studies
          the dominant-negative and gain-of-function defects predict depolarized resting potential and
          increased cellular excitability, whereas neuronal studies of some variants show impaired repetitive
          firing of pyramidal cells; both routes converge on a disturbed balance between excitatory and
          inhibitory signaling in cortical networks.
        role: amplifier
