  09abc3373e4a05deb22be3d03947b389e1e76295cbd2f2b55b352a6a77461694:
    claim:
      about:
        disease:
          name: KCNB1-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: KCNB1-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0014477
              label: developmental and epileptic encephalopathy, 26
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_kcnb1_nonconducting_role_contribution
        prompt: How much of KCNB1-related encephalopathy is driven by loss of Kv2.1's non-conducting structural
          role in surface clustering and endoplasmic reticulum-plasma-membrane junction organization,
          as opposed to the conduction defect, and does disrupting this scaffolding function alone produce
          disease-relevant neuronal dysfunction?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Kv2.1 Clustering and ER-Plasma-Membrane Junction Organization
        rationale: Kv2.1 has a well-established conductance-independent role in forming ER-plasma-membrane
          junctions that serve as membrane-trafficking and Ca2+-signaling hubs, and disease variants alter
          Kv2.1 expression and subcellular localization. It is not yet resolved whether the encephalopathy
          phenotype depends on this scaffolding defect in addition to the conduction defect, which matters
          for whether therapies must restore channel gating, channel localization/clustering, or both.
        proposed_experiments:
        - experiment_id: exp_kcnb1_clustering_separation_of_function
          name: KCNB1 conduction-versus-clustering separation-of-function test
          description: Using engineered Kv2.1 alleles that separate conduction from clustering (a conduction-dead
            but clustering-competent channel and a conducting but clustering-deficient channel), test
            in human iPSC neurons whether disrupting the clustering/ER-plasma-membrane-junction role alone
            impairs neuronal Ca2+ signaling, trafficking, and network maturation independent of the current
            defect.
          experiment_type:
            preferred_term: separation-of-function structure-function experiment
          perturbations:
          - name: Conduction versus clustering separation-of-function alleles
            target: pathophysiology#Disrupted Kv2.1 Clustering and ER-Plasma-Membrane Junction Organization
            genes:
            - preferred_term: KCNB1
              term:
                id: hgnc:6231
                label: KCNB1
            description: Express clustering-deficient and conduction-dead Kv2.1 variants to isolate the
              scaffolding role from the conduction role.
          readouts:
          - name: ER-plasma-membrane junction integrity and network maturation
            target: pathophysiology#Impaired Neurodevelopment and Cortical Network Maturation
            biological_processes:
            - preferred_term: organelle localization by membrane tethering
              term:
                id: GO:0140056
                label: organelle localization by membrane tethering
              modifier: ABNORMAL
            assays:
            - preferred_term: total internal reflection fluorescence microscopy
            - preferred_term: multielectrode array recording
            direction: NEGATIVE
          controls:
          - name: Wild-type KCNB1
            description: Wild-type Kv2.1 expressed in the same neuronal background.
          - name: Conduction-only defect allele
            description: A clustering-competent, conduction-impaired allele as comparator.
          decision_criterion: An independent contribution of the scaffolding role is supported if a clustering-deficient
            but conducting allele impairs junction integrity and network maturation, and is refuted if
            only conduction-impairing alleles produce neuronal dysfunction.
          would_support:
          - pathophysiology#Disrupted Kv2.1 Clustering and ER-Plasma-Membrane Junction Organization
      selected_evidence:
        snippet: Kv2.1 localizes to dense, cell-surface clusters that contain non-conducting channels,
          indicating that they have a function that is unrelated to membrane-potential regulation.
        supports: SUPPORT
