    evidence_metadata:
      reference: PMID:25164438
      reference_title: De novo KCNB1 mutations in epileptic encephalopathy.
      evidence_source: MODEL_ORGANISM
      explanation: Mouse Kcnb1 deletion lowers induced-seizure threshold without spontaneous seizures,
        showing that pure loss of Kv2.1 function is only modestly proconvulsant and distinguishing it
        from the human gain-of-function disease.
