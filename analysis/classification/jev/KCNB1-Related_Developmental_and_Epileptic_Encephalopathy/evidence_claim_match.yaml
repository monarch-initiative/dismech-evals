            term:
              id: MONDO:0014477
              label: developmental and epileptic encephalopathy, 26
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Loss of Delayed-Rectifier K+ Current
        description: Mutant Kv2.1 subunits co-assemble with wild-type subunits into heterotetrameric channels,
          so a single variant allele suppresses the delayed-rectifier K+ current in a dominant-negative
          fashion. Pore-domain variants can selectively abolish the endogenous Kv2 current, while selectivity-filter
          variants additionally cause loss of K+ selectivity, rendering the channel a nonselective, depolarizing
          cation conductance. Loss of the repolarizing delayed-rectifier current, together with an aberrant
          inward cation current, is predicted to depolarize the resting membrane potential and impair
          membrane repolarization.
        role: central_effector
        cell_types:
        - preferred_term: pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        molecular_functions:
        - preferred_term: delayed rectifier potassium channel activity
          term:
            id: GO:0005251
            label: delayed rectifier potassium channel activity
          modifier: DECREASED
        - preferred_term: voltage-gated potassium channel activity
          term:
            id: GO:0005249
            label: voltage-gated potassium channel activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: the mutation in the channel pore domain (p.G401R) selectively abolished endogenous Kv2
          currents in transfected pyramidal neurons, indicating a dominant-negative effect.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
