      assertion:
        name: Disrupted Kv2.1 Clustering and ER-Plasma-Membrane Junction Organization
        description: Beyond conducting current, Kv2.1 localizes to dense surface clusters of largely non-conducting
          channels that play a direct structural role in forming stable endoplasmic reticulum-plasma-membrane
          junctions, which serve as membrane-trafficking and Ca2+-signaling hubs. Disease variants perturb
          Kv2.1 expression and subcellular localization and reciprocally alter the trafficking of co-assembled
          wild-type subunits, so this non-conducting scaffolding role is an independent, conductance-separable
          arm of the pathophysiology.
        role: effector
        cell_types:
        - preferred_term: pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
