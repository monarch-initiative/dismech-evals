  14696ff45eb8bd6de5e77373ba345d859de9514133bb51636c4e4a8a56b5ecdd:
    claim:
      about:
        disease:
          name: KCNH1 Associated Disorder
          disease_term:
            preferred_term: KCNH1 associated disorder
            term:
              id: MONDO:0100485
              label: KCNH1 associated disorder
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Heterozygous KCNH1 missense variants act dominantly, and the majority of individuals
          with the syndromic or encephalopathic phenotypes carry de novo variants, with inherited and
          mosaic alleles concentrated at the milder end of the spectrum. A `de_novo_rate` is deliberately
          not asserted: the only pooled figure available (38 of 51 published patients) comes from a full-text
          table rather than any abstract cached here, so no quotable source supports a specific percentage.
          Because dominance operates through a gain of channel function on the tetrameric Kv10.1 complex
          rather than through haploinsufficiency, truncating alleles are not straightforwardly pathogenic
          and one reported nonsense variant segregated only weakly with epilepsy.'
      selected_evidence:
        snippet: Here we report damaging de novo mutations in KCNH1 (encoding a protein called ether à
          go-go, EAG1 or KV10.1), a voltage-gated potassium channel that is predominantly expressed in
          the central nervous system (CNS), in six individuals with TBS.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
