  9d0edb849872debc55d74658f7c6a92d68467bf498614784e5bf8dde1f14775f:
    claim:
      about:
        disease:
          name: KCNH1 Associated Disorder
          disease_term:
            preferred_term: KCNH1 associated disorder
            term:
              id: MONDO:0100485
              label: KCNH1 associated disorder
        context: []
      assertion_type: Treatment
      assertion:
        name: Kv10.1-Directed Precision Therapy (Investigational)
        description: 'Because the disorder is caused by gain of Kv10.1 function, inhibiting or right-shifting
          the channel is the rational disease-specific target. No such agent is approved. Two obstacles
          dominate development. First, selectivity: Kv10.1 is closely related to the cardiac channel Kv11.1
          (hERG), which is uniquely promiscuous in binding drugs, so a non-selective Kv10.1 blocker risks
          cardiac repolarization toxicity. Second, mechanism of action: expert argument favours allosteric
          modulators that shift the activation threshold in the depolarizing direction over pore blockers
          that abolish channel function altogether. Spider-venom inhibitor cystine knot peptides (Aa1a,
          Ap1a) that target both activation and inactivation gating are the most potent peptidic hEAG1
          inhibitors reported and are being pursued as leads. This is investigational: no clinical trial
          data exist.'
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: A major challenge in developing disease-specific anti-seizure medications for KCNH1 epilepsy
          is selectivity over Kv11.1 (hERG), a closely related channel that plays a fundamental role in
          repolarization of the cardiac action potential and which is uniquely susceptible to inhibition
          by a diverse range of drugs.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
