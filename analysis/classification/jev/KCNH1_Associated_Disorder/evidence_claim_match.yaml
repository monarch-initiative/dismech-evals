      assertion_type: Discussion
      assertion:
        discussion_id: kcnh1_lump_versus_split
        prompt: Should Temple-Baraitser syndrome and Zimmermann-Laband syndrome type 1 be lumped into
          a single KCNH1-related entity, or kept as separate clinical diagnoses?
        kind: CONTROVERSY
        status: OPEN
        rationale: 'The question was posed explicitly in the literature in 2015 and has not been formally
          settled. The case for lumping is strong: the same variant has been seen in both syndromes, the
          facial phenotype is shared, the limb phenotype is variable and age-dependent, and a large group
          of patients fits neither label. The case for splitting is that the two clinical gestalts are
          recognisable and useful at the bedside. dismech resolves this pragmatically rather than dogmatically
          — this gene-centric umbrella entry models the spectrum and its shared mechanism, while the separate
          Temple-Baraitser Syndrome and Zimmermann-Laband Syndrome entries retain the clinically useful
          syndromic descriptions.'
      selected_evidence:
        snippet: In summary, we show that the phenotypic variability of individuals with KCNH1 mutations
          is more pronounced than previously expected, and we discuss whether KCNH1 mutations allow for
          "lumping" or for "splitting" of TMBTS and ZLS.
        supports: SUPPORT
