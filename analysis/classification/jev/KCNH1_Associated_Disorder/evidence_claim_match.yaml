        context: []
      assertion_type: Genetic
      assertion:
        name: KCNH1
        gene_term:
          preferred_term: KCNH1
          term:
            id: hgnc:6250
            label: KCNH1
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        presence: PRESENT
        notes: KCNH1 encodes Kv10.1 (EAG1), the single causal gene of this spectrum. Pathogenic alleles
          are missense and act by gain of function; the position of the substitution, together with whether
          it arose de novo or was inherited/mosaic, is the main determinant of where an individual falls
          on the phenotypic spectrum. De novo variants in the S4 and S6 transmembrane hotspots produce
          epileptic encephalopathy; recurrent Gly496 substitutions and CNBHD variants are associated with
          the attenuated non-syndromic presentation; inherited germline or mosaic variants produce isolated
          epilepsy or febrile seizures. Truncating alleles are not straightforwardly pathogenic, since
          haploinsufficiency is not the mechanism.
      selected_evidence:
        snippet: Variants in the KCNH1 cause a spectrum of epileptic disorders ranging from a benign form
          of genetic isolated epilepsy/FS to intractable form of epileptic encephalopathy. The genotypes
          and variant locations help explaining the phenotypic variation of patients with KCNH1 variant.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
