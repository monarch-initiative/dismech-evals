            term:
              id: MONDO:0100485
              label: KCNH1 associated disorder
        context: []
      assertion_type: Subtype
      assertion:
        name: Attenuated non-syndromic
        display_name: KCNH1-related intellectual disability without TBS/ZLS features
        description: 'Individuals with severe intellectual disability with or without epilepsy in whom
          the distinctive gingival and nail features of TBS/ZLS are absent, so that neither syndromic
          diagnosis is clinically considered. This subtype is recognised only after molecular diagnosis
          by exome sequencing or an epilepsy gene panel, and is enriched for recurrent Gly496 substitutions
          and for variants in the C-terminal cyclic nucleotide-binding homology domain (CNBHD). It is
          the reason the gene-centric umbrella entity is needed: these individuals have no syndromic label
          to be assigned to.'
        genes:
        - preferred_term: KCNH1
          term:
            id: hgnc:6250
            label: KCNH1
      selected_evidence:
        snippet: Our study expands the phenotypical spectrum of KCNH1-related encephalopathies to individuals
          with an attenuated extraneurological phenotype preventing a clinical diagnosis of TBS or ZLS.
        supports: SUPPORT
