      assertion_type: Treatment
      assertion:
        name: Gingivectomy and Gingivoplasty
        description: 'Surgical reduction of the enlarged gingiva, performed under general anaesthesia,
          is the definitive management for the gingival fibromatosis at the Zimmermann-Laband end of the
          spectrum. It is functional as well as cosmetic: gingival overgrowth can bury the dentition and
          block tooth eruption, and resection restores masticatory function and a normal occlusal relationship.
          Regrowth is expected — recurrence was documented at two-year follow-up — so this is a repeatable
          palliative procedure rather than a cure, and it does not address the channel defect.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Gingivectomy
          term:
            id: NCIT:C82090
            label: Gingivectomy
      selected_evidence:
        snippet: Gingivectomy and gingivoplasty were performed under general anesthesia. After surgery,
          the gingival appearance improved significantly, and the masticatory function of the teeth was
          restored.
        supports: SUPPORT
