      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: Diagnosis rests on identification of a heterozygous pathogenic KCNH1 missense variant.
          Because a substantial share of affected individuals lack the gingival and nail features that
          would prompt a clinical diagnosis of TBS or ZLS, the diagnosis is now most often made by untargeted
          testing — whole-exome sequencing or an epilepsy gene panel — rather than by phenotype-driven
          single-gene testing. Clinical reappraisal after a molecular result is worthwhile, since nail
          hypoplasia can be subtle and can emerge over time.
      selected_evidence:
        snippet: We report a series of seven patients with ID and de novo pathogenic KCNH1 variants identified
          by whole-exome sequencing or an epilepsy gene panel in whom the diagnosis of TBS/ZLS had not
          been first considered.
        supports: SUPPORT
