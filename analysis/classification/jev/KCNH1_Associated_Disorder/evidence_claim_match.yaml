          the attenuated non-syndromic presentation; inherited germline or mosaic variants produce isolated
          epilepsy or febrile seizures. Truncating alleles are not straightforwardly pathogenic, since
          haploinsufficiency is not the mechanism.
      selected_evidence:
        snippet: De novo missense variants in the pore region of the channel result in severe phenotypes
          presenting usually with DEE with various malformations.
        supports: SUPPORT
