        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kcnh1_gof_to_hyperexcitability
        prompt: How does KCNH1 gain of function produce seizures through neuronal and circuit dysfunction,
          given that the mutant channels hyperpolarize heterologous cells?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Aberrant Neuronal Excitability and Network Dysfunction
        - phenotypes#Intellectual disability
        - phenotypes#Global developmental delay
        - phenotypes#Seizures
        - phenotypes#Status epilepticus
        - phenotypes#Febrile seizures
        - phenotypes#Neonatal hypotonia
        - phenotypes#Absent speech
        - phenotypes#Autistic behavior
        rationale: The causal relations from pathogenic channel gain of function to seizures, intellectual
          disability and global developmental delay are retained as indirect edges. The three channel-to-network-to-encephalopathy
          edges represent a literature-supported emerging route, with unknown intermediates; lack of a
          complete route does not negate causation. Heterologous-cell hyperpolarization does not establish
          the direction of native-neuron excitability changes. The cellular contributions to developmental
          impairment, neonatal hypotonia, absent speech and autistic behavior remain unresolved, and the
          DEE summary is not treated as a cause of every component finding. Status epilepticus and febrile
          seizures remain separately observed presentations without additional feature-specific causal
          assertions. EEG slowing remains an observational readout, including in a patient without seizures.
        proposed_experiments:
        - experiment_id: kcnh1_interneuron_selectivity
          experiment_design: TARGETED_PERTURBATION
          name: Cell-type-resolved excitability phenotyping
          description: Cell-type-resolved electrophysiology in patient-derived or knock-in neurons, testing
            whether inhibitory interneurons are preferentially silenced by the gain of function while
            excitatory neurons are spared, producing net disinhibition.
        - experiment_id: kcnh1_developmental_circuit_assembly
          experiment_design: TARGETED_PERTURBATION
          name: Developmental-stage-resolved circuit characterisation
          description: Developmental-stage-resolved characterisation in a knock-in model, testing whether
            the pathogenic effect is on circuit assembly during development rather than on acute excitability
            in the mature network.
      selected_evidence:
        snippet: suggesting a direct role of KCNH1 in epileptogenesis, although the underlying mechanism
          is not understood
        supports: SUPPORT
