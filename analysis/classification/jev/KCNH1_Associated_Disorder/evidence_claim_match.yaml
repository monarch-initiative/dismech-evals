  ad168ec5eb1be363fca13d344aae40f558f0fd6428521766450f7ebc9791258a:
    claim:
      about:
        disease:
          name: KCNH1 Associated Disorder
          disease_term:
            preferred_term: KCNH1 associated disorder
            term:
              id: MONDO:0100485
              label: KCNH1 associated disorder
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: channel_to_network_dysfunction
        hypothesis_label: Altered Kv10 gating and heteromeric crosstalk perturb neuronal circuits
        status: EMERGING
        description: 'The causal relation between pathogenic KCNH1 gain of function and epilepsy is established.
          This hypothesis concerns its intervening route: altered gating and heteromeric subunit interactions
          may disturb neuronal signaling and developmental circuit function. The neurotransmission route
          is proposed in the clinical literature, and heteromeric effects are demonstrated in HEK293T
          cells, but their endogenous neuronal consequences remain untested. No specific inhibitory-versus-excitatory
          cell effect is asserted.'
      selected_evidence:
        snippet: In summary, we identify heteromeric crosstalk between Kv10.1 and Kv10.2 as a key mechanism
          by which gain-of-function mutations may propagate their effects, extending pathogenic influence
          beyond the mutated gene itself. This mechanism provides a possible explanation for the variability
          of neurological phenotypes associated withKCNH1andKCNH5mutations and highlights the importance
          of considering subfamily-wide interactions in understanding channelopathies.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41656275
      reference_title: Crosstalk of KCNH1 and KCNH5 gain-of-function mutations leading to epilepsy and
        neurodevelopmental disorders.
      evidence_source: IN_VITRO
      explanation: The authors propose heteromeric crosstalk as an explanation for neurological variability.
        The experiments were in HEK293T cells, and endogenous neuronal stoichiometry and effects still
        require testing.
