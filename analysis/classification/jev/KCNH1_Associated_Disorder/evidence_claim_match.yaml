        hypothesis_label: Ciliary Kv10.1 and Hedgehog signalling explain the extraneurological features
        status: EMERGING
        description: Proposes that the limb, nail, craniofacial, hair, and gingival features of the spectrum
          arise not from neuronal hyperexcitability but from a separate, non-excitable-cell role of Kv10.1
          at the base of the primary cilium, where activating variants disturb ciliogenesis and Sonic
          Hedgehog signal transduction during development. The supporting data are from human dermal fibroblasts
          and hTERT RPE1 cells; the causal link from disturbed fibroblast/RPE Hedgehog signalling to the
          specific human malformations has not been demonstrated in developing tissue, which is why this
          is recorded as emerging rather than canonical.
      selected_evidence:
        snippet: the pathogenic missense variants (L352V and R330Q; NP_002229.1) perturb cilia morphology,
          assembly/disassembly, and Sonic Hedgehog signaling, disclosing a multifaceted role of the protein
