      assertion:
        name: Hyperpolarizing Shift of Kv10.1 Activation
        biological_scale: MOLECULAR
        description: Disease-associated Kv10.1 subunits open at more negative membrane potentials than
          wild type and close more slowly, so potassium conductance is available at or near the resting
          potential where the wild-type channel would be shut. Functional characterisation in Xenopus
          oocytes and human HEK293T cells shows a decreased threshold of activation together with delayed
          deactivation. Several severe variants, including Gly496Glu, are non-functional when expressed
          alone and produce their gain of function only after assembly with wild-type subunits, so the
          pathogenic species is the heteromeric channel.
        biological_processes:
        - preferred_term: potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: INCREASED
      selected_evidence:
        snippet: Characterization of the mutant channels in both Xenopus laevis oocytes and human HEK293T
          cells showed a decreased threshold of activation and delayed deactivation, demonstrating that
          TBS-associated KCNH1 mutations lead to deleterious gain of function.
        supports: SUPPORT
