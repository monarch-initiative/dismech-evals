  a21d4d26a04656e01328f88412736d4ed4602073e0dce4744acceb81f213c4a7:
    claim:
      about:
        disease:
          name: KCNQ2 Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: KCNQ2 developmental and epileptic encephalopathy
            term:
              id: MONDO:0013387
              label: developmental and epileptic encephalopathy, 7
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_kcnq2_same_gene_opposite_severity
        prompt: What distinguishes the benign self-limited end of the KCNQ2 spectrum (self-limited familial
          neonatal epilepsy, modeled in the Benign Neonatal Seizures entry) from the severe NEO-DEE end,
          given that both arise from variants in the same gene?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#KCNQ2 Pathogenic Variant
        - pathophysiology#Neuronal M Channel Dysfunction
        rationale: KCNQ2 produces a phenotypic continuum from a benign, self-limited neonatal epilepsy
          with normal development to a severe developmental and epileptic encephalopathy. The prevailing
          explanation is that the benign end reflects simple haploinsufficiency or mild loss-of-function
          while the severe end reflects dominant-negative suppression (or gain-of-function), producing
          a larger M-current deficit. But this genotype-to-severity map is incomplete, and it is the same
          open question posed from the mild side in the Benign Neonatal Seizures entry. A quantitative
          rule linking residual M-current to outcome would let the neonatal genetic diagnosis predict
          prognosis.
        proposed_experiments:
