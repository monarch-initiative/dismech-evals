      assertion_type: Discussion
      assertion:
        discussion_id: gap_kcnq2_gof_vs_lof_opposite_drugs
        prompt: KCNQ2-NEO-DEE is caused by both dominant-negative loss-of-function and gain-of-function
          variants, which have opposite biophysical effects on the M channel yet converge on a severe
          encephalopathy - how does gain-of-function cause disease, and can functional variant classification
          reliably direct the opposite therapies (M channel opener for loss-of-function, avoidance or
          negative modulation for gain-of-function) each requires?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#KCNQ2 Pathogenic Variant
        - pathophysiology#Neuronal M Channel Dysfunction
        rationale: Most NEO-DEE variants are dominant-negative and reduce M-current, so a Kv7 opener is
          the mechanistically correct drug. But a minority are gain-of-function, which increase potassium
          current and would be worsened by an opener, plausibly requiring the opposite pharmacology. Because
          the drug that helps one class can harm the other, reliable functional classification of each
          variant is clinically decisive, not merely academic, yet a validated rapid variant-to-drug assignment
          pathway does not exist. Resolving how gain-of-function produces encephalopathy and how to triage
          variants to opener versus non-opener strategies is the central precision-therapy gap.
        proposed_experiments:
        - experiment_id: exp_kcnq2_variant_functional_triage
          name: Functional-class-guided drug response in KCNQ2-DEE models
          description: Classify a panel of NEO-DEE variants as loss-of-function, dominant-negative, or
            gain-of-function by electrophysiology in heterologous cells and patient iPSC-derived neurons,
            then test Kv7-opener versus Kv7-blocker responses to determine whether functional class predicts
            the correct pharmacology.
          experiment_type:
            preferred_term: variant functional classification and drug-response experiment
          readouts:
          - name: Drug response by functional class
            target: pathophysiology#Neuronal M Channel Dysfunction
            biological_processes:
            - preferred_term: Regulation of membrane potential
              term:
                id: GO:0042391
                label: regulation of membrane potential
              modifier: DYSREGULATED
            assays:
            - preferred_term: patch clamp recording
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: Wild-type KCNQ2 channels
            description: Wild-type Kv7.2/7.3 channels as the normalization reference.
          decision_criterion: Functional triage is supported if Kv7 openers normalize excitability for
            loss-of-function and dominant-negative variants but worsen it for gain-of-function variants,
            establishing variant class as a treatment selector.
          would_support:
          - pathophysiology#Neuronal M Channel Dysfunction
      selected_evidence:
        snippet: Five individuals had daily seizures at baseline and experienced at least 50% seizure
          reduction with treatment, sustained in four.
        supports: SUPPORT
