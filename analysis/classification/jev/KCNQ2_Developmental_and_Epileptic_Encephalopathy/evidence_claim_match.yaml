          name: Residual M-current versus clinical severity mapping
          description: Across a large set of benign-end and NEO-DEE variants, quantify residual M-current
            (accounting for dominant-negative co-assembly) and correlate it with clinical severity and
            developmental outcome to test whether a current-deficit threshold separates the benign from
            the severe phenotype.
          experiment_type:
            preferred_term: genotype-to-severity correlation experiment
          readouts:
          - name: Residual current versus outcome
            target: pathophysiology#Neuronal M Channel Dysfunction
            assays:
            - preferred_term: patch clamp recording
            direction: POSITIVE
          controls:
          - name: Benign-end variants
            description: Self-limited-epilepsy variants as the mild-end comparator.
          decision_criterion: A severity determinant is supported if residual M-current (or the degree
            of dominant-negative suppression) separates benign-end from NEO-DEE variants and tracks developmental
            outcome.
