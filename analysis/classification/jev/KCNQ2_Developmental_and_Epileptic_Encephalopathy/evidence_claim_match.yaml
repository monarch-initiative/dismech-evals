  f4dfd912d8c2f5d09604d709c6bc1d4a7e5f219bd6b2b1cacb7e006a0763c811:
    claim:
      about:
        disease:
          name: KCNQ2 Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: KCNQ2 developmental and epileptic encephalopathy
            term:
              id: MONDO:0013387
              label: developmental and epileptic encephalopathy, 7
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_kcnq2_seizure_remission_vs_persistent_encephalopathy
        prompt: Why do KCNQ2-NEO-DEE seizures typically remit between about nine months and four years
          of age while the developmental encephalopathy persists, and is the developmental impairment
          driven by the neonatal seizures and M-current loss during a critical window (and therefore reducible
          by early variant-appropriate treatment) or by a seizure-independent developmental role of the
          M channel?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neonatal-Onset Developmental Encephalopathy
        - pathophysiology#Neonatal-Onset Seizures with Burst-Suppression EEG
        rationale: The dissociation between remitting seizures and a persistent encephalopathy is a defining
          and puzzling feature of NEO-DEE. If the developmental impairment is largely caused by the neonatal
          seizures and the M-current deficit acting during an early critical window, then rapid neonatal
          genetic diagnosis and early variant-appropriate therapy could improve developmental outcome.
          If instead the M channel has a seizure-independent developmental role, cognitive prognosis would
          be more fixed. This determines how much developmental benefit to expect from the treat-early-and-right
          strategy.
        proposed_experiments:
        - experiment_id: exp_kcnq2_early_treatment_developmental_outcome
          experiment_design: TARGETED_PERTURBATION
          name: Early variant-appropriate treatment and developmental outcome
          description: In a KCNQ2-NEO-DEE knock-in model, apply variant-appropriate therapy (M channel
            opener for loss-of-function, or seizure suppression) at graded ages spanning the neonatal
            window and measure whether earlier seizure control improves cognitive and behavioral outcome
            independently of later seizure remission.
          experiment_type:
            preferred_term: early-treatment developmental-outcome experiment
          readouts:
          - name: Cognitive outcome by treatment timing
            target: pathophysiology#Neonatal-Onset Developmental Encephalopathy
            assays:
            - preferred_term: behavioral assay
            - preferred_term: electroencephalography
            direction: POSITIVE
          controls:
          - name: Untreated and wild-type
            description: Matched untreated mutants and wild-type controls.
          decision_criterion: A seizure/window-driven contribution is supported if earlier treatment improves
            developmental outcome beyond its effect on later seizure remission; a seizure-independent
            developmental role is supported if outcome is unchanged by treatment timing.
          would_support:
          - pathophysiology#Neonatal-Onset Developmental Encephalopathy
      selected_evidence:
        snippet: displays spontaneous generalized seizures and cognitive impairment
        supports: SUPPORT
