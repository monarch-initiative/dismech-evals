            term:
              id: MONDO:1040063
              label: KCNV2-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Kv8.2/Kv2.1 Heteromeric Photoreceptor Potassium Channel Dysfunction
        role: trigger
        biological_scale: MOLECULAR
        description: 'Biallelic KCNV2 variants disrupt Kv8.2, a modulatory alpha-subunit that cannot form
          functional channels on its own but heteromerizes with Kv2.1 in rod and cone photoreceptor inner
          segments to form the native delayed-rectifier potassium current. Loss-of-function KCNV2 variants
          follow at least two distinct molecular mechanisms: pore-domain mutations that yield non-conducting
          Kv2.1/Kv8.2 heteromers, and tetramerization-domain mutations that prevent heteromer assembly
          altogether, leaving only homomeric Kv2.1 channels with altered gating properties. Either route
          alters photoreceptor membrane excitability and light-response kinetics, producing the disease''s
          pathognomonic supernormal rod b-wave and progressive cone-mediated visual loss.

          '
        cell_types:
        - preferred_term: Retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: Retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: Potassium ion transmembrane transport
          term:
            id: GO:0071805
            label: potassium ion transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: KCNV2 codes for the modulatory voltage-gated potassium channel α-subunit, Kv8.2, which
          is incapable of forming functional channels on its own. Functional heteromeric channels are
          however formed with Kv2.1 in heterologous expression systems, with both α-subunit genes expressed
          in rod and cone photoreceptors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23115240
      reference_title: Functional analysis of missense mutations in Kv8.2 causing cone dystrophy with
        supernormal rod electroretinogram.
      evidence_source: IN_VITRO
      explanation: Establishes that Kv8.2 requires heteromerization with Kv2.1 to form a functional photoreceptor
        potassium channel.
