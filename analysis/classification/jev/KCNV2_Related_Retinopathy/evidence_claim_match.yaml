  2b7f5415656394ef50fc14b0d209dcb86b1d2a151b22b5398d50816801a7f0ec:
    claim:
      about:
        disease:
          name: KCNV2-Related Retinopathy
          disease_term:
            preferred_term: KCNV2-related retinopathy
            term:
              id: MONDO:1040063
              label: KCNV2-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Photoreceptor Light Adaptation
        description: 'Kv8.2 does not carry current itself; it shifts the activation range of the photoreceptor
          inner-segment potassium channels it heteromerizes into. Losing that modulation leaves the photoreceptor
          unable to set its operating point appropriately for the ambient light level, so what fails is
          adaptation rather than phototransduction. This is why the disease produces a paradoxical rather
          than a simply reduced electroretinogram, and why the a-wave is delayed even where its amplitude
          is preserved: the rod is responding, but on the wrong timescale and from the wrong baseline.

          '
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: Retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: Response to light stimulus
          term:
            id: GO:0009416
            label: response to light stimulus
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: photoreceptor inner segment
          term:
            id: GO:0001917
            label: photoreceptor inner segment
      selected_evidence:
        snippet: This gene encodes Kv8.2, a voltage-gated potassium channel subunit that acts as a modulator
          by shifting the activation range of the K+ channels in photoreceptor inner segments.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32441199
      reference_title: 'KCNV2 retinopathy: clinical features, molecular genetics and directions for future
        therapy.'
      evidence_source: OTHER
      explanation: Establishes the modulatory, activation-range-shifting role in the inner segment that
        this node asserts is lost. Evidence source is OTHER because this is a review.
