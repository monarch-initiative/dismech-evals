  e9467f01cbcbc40e869c2873aed1f55f90b7b31fa023f940bf367949b9b56ebd:
    claim:
      about:
        disease:
          name: KCNV2-Related Retinopathy
          disease_term:
            preferred_term: KCNV2-related retinopathy
            term:
              id: MONDO:1040063
              label: KCNV2-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Paradoxical Supernormal Scotopic b-Wave with Delayed Response Timing
        description: 'The pathognomonic electrophysiology, and the reason the disease was recognized before
          its gene was. Rod b-wave amplitude rises disproportionately over a narrow range of stimulus
          intensity, most steeply between the two dimmest flashes, and at bright flash exceeds normal
          - hence "supernormal" - while the a-wave is depressed or normal in amplitude but delayed at
          every intensity. The resulting b:a ratio sits at or above the upper reference limit. These are
          not merely diagnostic curiosities: the amplitude jump, the peak-time delay and the b:a ratio
          have each been proposed as trial biomarkers, because they are quantitative and present before
          structural change.

          '
        role: effector
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal bipolar neuron
          term:
            id: CL:0000748
            label: retinal bipolar neuron
        biological_processes:
        - preferred_term: Detection of light stimulus
          term:
            id: GO:0009583
            label: detection of light stimulus
          modifier: ABNORMAL
      selected_evidence:
        snippet: There was a disproportionate increase in b-wave amplitude with a relatively small light
          intensity increase, especially between the two dimmest stimuli of DA 0.002 and 0.01 (-2.7 and
          -2.0 log cd.s/m2).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38443311
      reference_title: Natural history and biomarkers of KCNV2-associated retinopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the disproportionate amplitude jump at the specific stimulus intensities
        where it is steepest.
