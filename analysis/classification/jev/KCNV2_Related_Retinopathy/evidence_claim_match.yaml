              label: KCNV2-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Cone and Outer Nuclear Layer Loss
        description: 'Beyond the functional lesion, photoreceptors are progressively lost. In the Kv8.2
          knockout mouse the structural change at six months is largely confined to the outer nuclear
          layer while outer segments remain intact, with increased TUNEL-positive cells throughout the
          retina - a pattern of photoreceptor cell death rather than outer-segment failure. In that model
          the loss is in fact rod-predominant (cones reduced only to about 80% of wild-type versus about
          60% overall photoreceptor-layer thinning); the cone-predominant pattern in this node reflects
          the human macular disease rather than the mouse. In patients this is seen as a bull''s-eye maculopathy
          on fundus autofluorescence with foveal ellipsoid zone disruption on optical coherence tomography.

          '
        role: effector
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: Photoreceptor cell maintenance
          term:
            id: GO:0045494
            label: photoreceptor cell maintenance
          modifier: DECREASED
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: In addition, there is a significant increase in TUNEL-positive cells throughout the retina.
