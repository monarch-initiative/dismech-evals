        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: Reported in single families and sporadic cases. A 2024 review assembled 14 published KDF1
          cases in total, of which 8 carried ectodermal-dysplasia alleles and 6 carried tooth-agenesis-only
          alleles; subsequent reports have added a further three-generation family.
      selected_evidence:
        snippet: A total of 14 reviewed KDF1 cases revealed ED-associated variants (3 variants in 8 patients)
          clustering in the region of amino acids 251-275, within the DUF4656 domain, while NSTA-causing
          variants (4 variants in 6 patients) were typically found in amino- or carboxy-termini to this
          region.
        supports: SUPPORT
    origin:
