  31f67005fb12c46fe860f170544c4f7a14ebd15324847a353ea701d80629b168:
    claim:
      about:
        disease:
          name: KDF1-Related Ectodermal Dysplasia
          disease_term:
            preferred_term: KDF1-related ectodermal dysplasia
            term:
              id: MONDO:0015024
              label: ectodermal dysplasia 12, hypohidrotic/hair/tooth/nail type
        context:
        - path: /genetic/0
          value:
            name: KDF1
            gene_term:
              preferred_term: KDF1
              term:
                id: hgnc:26624
                label: KDF1
            association: Pathogenic Variants
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            notes: 'Reported KDF1 alleles are heterozygous missense changes, not truncations, which is
              unusual for an ectodermal dysplasia gene and leaves the mechanism at the protein level unsettled:
              a simple haploinsufficiency model is not the obvious reading of a dominant missense series,
              and the mouse evidence is from a homozygous null. One study reports gain-of-function KDF1
              alleles acting by stabilising IkappaB kinase alpha, which would make at least part of the
              series mechanistically gain-of-function, but its text is not available to quote (see the
              entry `notes`). `functional_impact_category` is therefore left off the pathophysiology nodes
              rather than guessed. `gene_disease_validity` is absent because no external body has published
              a classification for this pair.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: c.753C>A
        description: The allele in the multigenerational Saudi family that defined the disease, segregating
          with ectodermal dysplasia across three generations. Five of the six affected members had lost
          all their teeth; the sixth, reported at age 1, had natal teeth. The cDNA change is recorded
          inconsistently in the sources and this entry does not resolve it. PMID:40463401's Table II writes
          c.753C>A for all six Shamseldin patients, and that is the string used here because it is the
          one that can be quoted from a cached reference. The committed OpenScientist report instead gives
          c.753C>G (p.Phe251Leu), attributing it to ClinVar. The Shamseldin abstract itself names no allele,
          so neither form can be checked against the primary report from PubMed, and ClinVar was not reachable
          to adjudicate. Both changes would alter the same TTC codon to a leucine codon, so the protein
          consequence is probably p.Phe251Leu either way - which matters, because residue 251 is the lower
          boundary of the amino-acid 251-275 cluster this entry's genotype-phenotype reasoning rests on.
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Patient I:1 from Shamseldin et al | ED | Loss of all teeth | 52 years | c.753C>A | N/A
          | (3)
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0/variants/0
      evidence_path: /genetic/0/variants/0/evidence/0
      context_paths:
