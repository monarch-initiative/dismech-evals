            term:
              id: MONDO:0015024
              label: ectodermal dysplasia 12, hypohidrotic/hair/tooth/nail type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of USP7-Mediated IKK-alpha Stabilization
        description: 'KDF1 and IKK-alpha physically interact in differentiating keratinocytes, and KDF1
          recruits the deubiquitinase USP7 to deubiquitinate and so stabilise IKK-alpha. Losing that interaction
          destabilises IKK-alpha. The genetic argument that this axis is the relevant one is a phenocopy
          argument of the same shape as the one that implicated KDF1 in the first place: ablating either
