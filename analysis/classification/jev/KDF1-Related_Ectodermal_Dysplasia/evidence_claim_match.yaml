          shifts the balance towards proliferation and away from differentiation. The network membership
          is the load-bearing claim: ectodermal knockout of Irf6, Ikk-alpha, Ripk4, stratifin or Kdf1
          in mouse gives a strikingly similar phenotype, and three of those five genes already had human
          ectodermal disease before KDF1 did.'
        biological_scale: MOLECULAR
