        - preferred_term: regulation of epidermal cell differentiation
          modifier: DECREASED
          term:
            id: GO:0045604
            label: regulation of epidermal cell differentiation
      selected_evidence:
        snippet: TP63, itself mutated in ectodermal dysplasia, links many other ectodermal dysplasia disease
          genes through a regulatory network that maintains the balance between proliferation and differentiation
          of the epidermis and other ectodermal derivatives.
        supports: SUPPORT
