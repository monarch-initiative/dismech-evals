  d593a447508c5c6a281ad211810a917e4462f24be22a21f2fa99a4bacc74f9e9:
    claim:
      about:
        disease:
          name: KDM1A-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: KDM1A-related neurodevelopmental disorder
            term:
              id: MONDO:0014751
              label: palatal anomalies-widely spaced teeth-facial dysmorphism-developmental delay syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm1a_loss_versus_gain_of_function
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired LSD1 Catalytic Activity and Protein Stability
        prompt: Do the disease-associated KDM1A missense variants act through loss of function, gain of
          function, or a dominant-negative effect on the LSD1-CoREST complex?
        rationale: 'Every reported allele is missense and clusters in the amine oxidase domain, and biochemistry
          shows only partial catalytic impairment plus reduced protein half-life — a hypomorphic profile.
          But mice heterozygous for a Kdm1a deletion are reported to be normal, which argues that simple
          haploinsufficiency is not sufficient to produce the phenotype. The absence of any reported truncating
          or whole-gene-deletion allele in this phenotype is consistent with a non-loss-of-function mechanism,
          but could equally reflect ascertainment in an ultra-rare cohort. Because LSD1 acts both catalytically
          and as a scaffold, a mutant protein that is stably incorporated into CoREST but catalytically
          crippled could poison the complex — a dominant-negative model that has not been tested. The
          distinction matters therapeutically: pharmacological LSD1 inhibition, which is beneficial in
          mouse models of Kabuki syndrome, would be expected to worsen a loss-of-function KDM1A disorder.'
        proposed_experiments:
        - experiment_id: kdm1a_truncating_allele_cohort_screen
          name: Truncating-allele cohort screen
          description: Screen large developmental-disorder sequencing cohorts for truncating KDM1A alleles
            and phenotype any carriers.
          supporting_outcome:
          - Recovery of truncating carriers with the CPRF phenotype would support a simple loss-of-function/haploinsufficiency
            mechanism.
          refuting_outcome:
          - Truncating carriers who are unaffected, or complete absence of truncating alleles despite
            adequate power, would argue against haploinsufficiency and favour a dominant-negative or altered-specificity
            mechanism.
        - experiment_id: kdm1a_knockin_versus_null_comparison
          name: Patient-allele knock-in versus null allele comparison
          description: Generate mouse or human iPSC models carrying p.Glu403Lys, p.Asp580Gly or p.Tyr785His
            in the heterozygous state and compare craniofacial and neurodevelopmental phenotypes and transcriptomes
            with isogenic heterozygous-null controls.
          supporting_outcome:
          - A missense knock-in phenotype more severe than the heterozygous null would support a dominant-negative
            or gain-of-function mechanism.
          refuting_outcome:
          - Phenotypic equivalence between missense knock-in and heterozygous null would support simple
            loss of function.
        - experiment_id: kdm1a_corest_incorporation_profiling
          name: CoREST incorporation and target-locus chromatin profiling
          description: Determine whether mutant LSD1 is still incorporated into the CoREST complex, and
            measure H3K4me1/2 and target-gene expression at LSD1-CoREST loci in patient-derived neurons.
          supporting_outcome:
          - Retained complex incorporation with locally increased H3K4me1/2 and target derepression would
            support complex poisoning by a dominant-negative mechanism.
          refuting_outcome:
          - Failure of mutant LSD1 to be incorporated into CoREST would favour simple reduction of functional
            complex.
      selected_evidence:
        snippet: Nevertheless, it remains to be seen if the phenotypes we report to be caused by variants
          in KDM1A are due to loss or gain of function.
        supports: SUPPORT
