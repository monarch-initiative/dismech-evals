        context:
        - path: /genetic/0
          value:
            name: KDM1A de novo missense variants
            gene_term:
              preferred_term: KDM1A
              term:
                id: hgnc:29079
                label: KDM1A
            association: Causative
            relationship_type: CAUSATIVE
            variant_origin: DE_NOVO
            features: Every reported disease-associated KDM1A allele is a heterozygous missense change;
              no truncating, whole-gene-deletion or biallelic alleles have been reported in this phenotype.
              The three index variants — p.(Glu403Lys), p.(Asp580Gly) and p.(Tyr785His) — all alter conserved
              residues within the FAD-dependent amine oxidase domain, and a fourth proband carried a novel
              missense variant in exon 16. KDM1A sits in the top 2% of evolutionarily constrained human
              genes.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: KDM1A p.(Tyr785His)
        description: NM_001009999.2 c.2353T>C. De novo missense variant in the amine oxidase domain, identified
          in the index proband (Family A) who also carried an ANKRD11 in-frame deletion later argued not
          to be causal.
        gene:
          preferred_term: KDM1A
          term:
            id: hgnc:29079
            label: KDM1A
        clinical_significance: PATHOGENIC
        functional_effects:
        - function: LSD1 histone H3K4 demethylase activity
          description: Partial impairment of demethylase activity, perturbed engagement of developmental
            transcription factors, and reduced cellular protein half-life.
      selected_evidence:
        snippet: c.2353T>C, predicting p.Tyr785His in KDM1A, a gene not previously associated with a human
          phenotype.
        supports: SUPPORT
