      assertion:
        name: Loss of LSD1-CoREST-Mediated Transcriptional Repression
        biological_scale: CELLULAR
        description: LSD1 functions within the BRAF-HDAC/CoREST corepressor complex, together with PHF21A
          (BHC80), to keep non-neuronal and neuronal gene sets correctly silenced and to time neuronal
          gene expression during development. Reduced LSD1 activity or occupancy therefore derepresses
          this target set. Two independent lines support the step. In mouse, inducible forebrain-restricted
          Kdm1a deletion activates non-neuronal genes normally silenced by the polycomb repressor complex
          and weakens their topological segregation from neighbouring active chromatin. In humans, haploinsufficiency
          of the LSD1 partner PHF21A derepresses the neuronal gene SCN3A with reduced LSD1 promoter occupancy,
          and PHF21A knockdown in zebrafish causes craniofacial abnormalities and neuronal apoptosis.
        genes:
        - preferred_term: KDM1A
          term:
            id: hgnc:29079
            label: KDM1A
        biological_processes:
        - preferred_term: negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: DECREASED
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: chromatin
          term:
            id: GO:0000785
            label: chromatin
      selected_evidence:
        snippet: Along with lysine-specific demethylase 1 (LSD1), PHF21A, also known as BHC80, is a component
          of the BRAF-histone deacetylase complex that represses target-gene transcription.
        supports: SUPPORT
