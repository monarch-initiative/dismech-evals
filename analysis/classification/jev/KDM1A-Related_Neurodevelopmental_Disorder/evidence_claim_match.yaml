          modifier: DECREASED
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: chromatin
          term:
            id: GO:0000785
            label: chromatin
      selected_evidence:
        snippet: during the perinatal period, alternative splicing of KDM1A results in expression of two
          neuron-specific isoforms that regulate neurite maturation
