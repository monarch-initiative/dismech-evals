        name: Trio Exome or Genome Sequencing
        description: 'There is no biochemical or imaging marker for this disorder and the clinical presentation
          (developmental delay, hypotonia, non-specific dysmorphism) is not distinctive enough to be diagnosed
          on examination. Diagnosis is molecular: trio exome or genome sequencing analysed under a de
          novo model, with KDM1A also included on broad developmental-delay/intellectual-disability, cleft-palate
          and chromatinopathy panels. Because every reported allele is a missense change, variant interpretation
          requires confirming de novo status by parental testing and weighing domain location and conservation;
          the index cohort was ascertained exactly this way, and the fourth proband was diagnosed by trio
          genome sequencing only after karyotype, microarray, FMR1 repeat testing and a metabolic workup
          were unrevealing.'
        notes: No disease-specific DNA-methylation episignature has been validated for KDM1A, unlike several
          other chromatinopathies; the 2025 report proposes episignature analysis as a future means of
          classifying KDM1A variants of uncertain significance.
      selected_evidence:
        snippet: Analysis of variants from ES under a de novo mutation model confirmed the presence of
          a different de novo variant in KDM1A (Refseq NM_001009999.2) in each of Families A and B
        supports: SUPPORT
