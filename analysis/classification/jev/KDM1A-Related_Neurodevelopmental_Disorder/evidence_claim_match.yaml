      - /disease_term
    evidence_metadata:
      reference: PMID:26656649
      reference_title: 'Gene discovery for Mendelian conditions via social networking: de novo variants
        in KDM1A cause developmental delay and distinctive facial features.'
      evidence_source: HUMAN_CLINICAL
      explanation: The three index probands each carried a de novo heterozygous missense variant with
        CADD scores in the range expected for dominant disease alleles, establishing autosomal dominant,
        de novo inheritance.
