            term:
              id: MONDO:0014751
              label: palatal anomalies-widely spaced teeth-facial dysmorphism-developmental delay syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant, de novo
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        expressivity: VARIABLE
        description: All reported probands carry heterozygous KDM1A missense variants that arose de novo;
          no vertical transmission has been reported and parents are unaffected. Expressivity is variable
          — palatal involvement, the feature that names the MONDO/Orphanet entity, was absent in the fourth
          published proband.
      selected_evidence:
        snippet: All three variants in KDM1A were missense variants predicted to be deleterious (minimum
          Polyphen-2 HumVar score of 0.962), result in amino acid substitutions of highly conserved amino
          acid residues (minimum GERP score was 5.72) in KDM1A, and have high CADD scores suggestive of
          dominant mutations (minimum CADD score 27.2) (Table 1).
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
