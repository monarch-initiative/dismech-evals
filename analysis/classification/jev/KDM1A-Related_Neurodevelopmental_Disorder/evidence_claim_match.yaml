            term:
              id: MONDO:0014751
              label: palatal anomalies-widely spaced teeth-facial dysmorphism-developmental delay syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm1a_heterozygous_mouse_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired LSD1 Catalytic Activity and Protein Stability
        - pathophysiology#Dysregulated Neurodevelopmental and Craniofacial Gene Programs
        prompt: Given that mice heterozygous for a Kdm1a deletion are reported to be apparently normal
          and fertile while homozygous knockout is embryonic-lethal, does any available model reproduce
          the human heterozygous missense-variant syndrome — and in particular its craniofacial arm?
        rationale: 'The mouse Kdm1a allelic series brackets the human condition without reproducing it.
          The homozygous null dies in early embryogenesis, so it cannot be used to study postnatal neurodevelopment
          or craniofacial patterning. The heterozygous null is reported as phenotypically normal, so it
          does not reproduce the human dysmorphism, hypotonia or developmental delay. Human disease sits
          between these: a stably expressed but catalytically impaired protein at one of two alleles.
          The two strongest modern datasets share this limitation — the adult forebrain conditional knockout
          models complete somatic loss in mature neurons, and the zebrafish line is a knockout. Most importantly,
          the craniofacial and palatal arm of the phenotype, which supplies the disorder''s name, has
          never been modelled with a KDM1A patient allele at all; the supporting evidence comes from knockdown
          of the partner gene PHF21A. This is a model-fidelity question, not an absence of data.'
        proposed_experiments:
        - experiment_id: kdm1a_heterozygous_knockin_mouse
          name: Heterozygous patient-allele knock-in mouse
          description: Build heterozygous knock-in mice carrying the human missense substitutions and
            phenotype palate, craniofacial skeleton, muscle tone and behaviour against both wild-type
            and heterozygous-null littermates.
          supporting_outcome:
          - Reproduction of palatal, craniofacial and neurodevelopmental phenotypes would validate the
            mouse as a model of the human disorder.
          refuting_outcome:
          - A normal heterozygous knock-in mouse would indicate that the mouse cannot model this disorder
            and would redirect effort to human cellular models.
        - experiment_id: kdm1a_ipsc_neural_crest_model
          name: Patient-derived iPSC neurons and cranial neural crest cells
          description: Differentiate patient-derived iPSCs into cortical neurons and cranial neural crest
            cells and test whether the human alleles perturb LSD1-CoREST target-gene repression in the
            relevant human cell types, against isogenic corrected controls.
          supporting_outcome:
          - Allele-dependent derepression of LSD1-CoREST targets in human neural crest would establish
            the craniofacial arm of the mechanism in human cells.
          refuting_outcome:
          - Absence of any transcriptional consequence in patient neural crest would argue that the craniofacial
            phenotype arises by a different route.
      selected_evidence:
        snippet: mice heterozygous for a Kdm1a deletion are apparently normal and fertile
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
