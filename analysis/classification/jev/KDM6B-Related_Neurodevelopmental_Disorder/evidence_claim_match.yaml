      assertion_type: Variant
      assertion:
        name: Copy-number deletions encompassing KDM6B
        gene:
          preferred_term: KDM6B
          term:
            id: hgnc:29012
            label: KDM6B
        type: Copy number loss
        clinical_significance: UNCERTAIN_SIGNIFICANCE
        description: Chromosomal microarray has identified 17p13.1 deletions that encompass KDM6B in individuals
          with overlapping features (developmental delay, intellectual disability, speech delay). These
          are curated as a separate, weaker variant class rather than as established pathogenic alleles,
          because every reported deletion also removes neighbouring genes, so the phenotype cannot be
          attributed to KDM6B alone. Chromosomal microarray therefore remains appropriate when a copy-number
          disorder is suspected, but a deletion finding does not by itself establish this diagnosis.
      selected_evidence:
        snippet: However, it is important to note that all seven of these deletions also encompass neighboring
          genes the effects of which are uncertain.
        supports: SUPPORT
