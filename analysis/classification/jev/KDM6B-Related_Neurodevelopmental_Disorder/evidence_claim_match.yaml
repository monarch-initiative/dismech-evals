        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm6b_visceral_connective_feature_mechanisms
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does KDM6B haploinsufficiency produce the visceral, connective-tissue,
          and genitourinary features of the disorder (neonatal feeding difficulties, gastroesophageal
          reflux, constipation, congenital heart anomalies, cryptorchidism, joint hypermobility)?
        attaches_to:
        - phenotypes#Feeding difficulties
        - phenotypes#Gastroesophageal reflux
        - phenotypes#Constipation
        - phenotypes#Patent foramen ovale
        - phenotypes#Cryptorchidism
        - phenotypes#Joint hypermobility
        rationale: These features are documented in affected individuals, but no study connects KDM6B
          loss to gastrointestinal, cardiac, urogenital, or connective-tissue development, so this entry
          deliberately draws no causal edge to them. KDM6B is expressed in different tissues during development,
          and the same feature set recurs in Kabuki syndrome type 2, caused by variants in the paralogous
          H3K27 demethylase KDM6A, which makes a shared KDM6-dependent developmental origin plausible
          without demonstrating it. Neonatal feeding difficulty co-occurs with hypotonia in reported patients
          and may be secondary to it, but the founding series records the two only side by side, without
          a causal assessment.
        proposed_experiments:
        - experiment_id: exp_kdm6b_het_mouse_visceral_survey
          name: Systematic visceral and connective-tissue phenotyping of Kdm6b heterozygous mice
          description: Extend phenotyping of the constitutive Kdm6b heterozygous mouse beyond behavior
            to cardiac septation, gastrointestinal motility, urogenital development, and joint laxity,
            to test whether the non-neural human features are dosage-dependent KDM6B effects at all.
      selected_evidence:
        snippet: 'Overlapping phenotypic features between

          KDM6A and KDM6B include prominent ears, abnormal dentition, con-

          genital heart disease, feeding difficulties, cryptorchidism, joint hyper-

          mobility, developmental delay, hypotonia, and behavioral difficulties.'
        supports: SUPPORT
