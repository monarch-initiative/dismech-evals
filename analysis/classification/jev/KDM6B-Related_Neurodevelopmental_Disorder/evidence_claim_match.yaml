        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        features: Pathogenic alleles include nonsense, frameshift, and splice variants distributed across
          the gene (consistent with haploinsufficiency) as well as missense and in-frame indel variants
          clustered in or near the catalytic JmjC domain and the Zn-containing domain required for cofactor
          binding and protein stability.
        notes: KDM6B (lysine demethylase 6B, also known as JMJD3) encodes a JmjC domain-containing histone
          H3K27me2/me3 demethylase at 17p13.1. Inheritance is autosomal dominant with the great majority
          of variants arising de novo; see the disease-level inheritance block.
      selected_evidence:
        snippet: The KDM6B protein consists of the JmjC catalytic domain and C-terminal helix and zinc
          motifs which are important in cofactor binding and protein stability
        supports: SUPPORT
