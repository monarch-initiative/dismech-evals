          provides the opposing, erasing arm of this switch; its enzymatic activity antagonizes Polycomb
          regulation and resolves bivalent promoters at the onset of differentiation. With KDM6B activity
          reduced, developmental promoters and enhancers that should be de-repressed remain Polycomb-silenced.
          This is the mechanistic mirror image of PRC2 gain-of-function chromatinopathies such as EZH2-related
          Weaver syndrome, in which the writing arm is overactive.

          '
        biological_processes:
        - preferred_term: negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: INCREASED
        - preferred_term: chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: ABNORMAL
      selected_evidence:
        snippet: This supports both the ideas that writers and erasers of histone marks exist in a fine
          balance to maintain epigenome state and that epigenetic modulating agents have therapeutic potential
          for the treatment of MDEMs.
        supports: SUPPORT
