      assertion_type: DifferentialDiagnosis
      assertion:
        name: Weaver syndrome
        disease_term:
          preferred_term: Weaver syndrome
          term:
            id: MONDO:0010193
            label: Weaver syndrome
        description: 'EZH2-related overgrowth and intellectual disability syndrome. EZH2 is the catalytic
          subunit of PRC2 and writes the very H3K27me3 mark that KDM6B erases, so Weaver syndrome and
          KDM6B-related NDD are opposite perturbations of the same H3K27 methylation switch. The contrast
          is worth stating explicitly: the same chromatin axis produces an overgrowth syndrome when the
          writer is overactive and a non-overgrowth neurobehavioral syndrome when the eraser is lost.'
        distinguishing_features:
        - Weaver syndrome features pre- and postnatal overgrowth with advanced bone age and a distinctive
          facial appearance, which are not part of the core KDM6B-related NDD presentation.
        - KDM6B-related NDD is dominated by cognitive, behavioral, and psychiatric features with mild,
          non-gestalt dysmorphism.
        - Molecular testing distinguishes them unambiguously (EZH2 versus KDM6B).
      selected_evidence:
        snippet: Weaver syndrome is a Mendelian disorder of the epigenetic machinery (MDEM) caused by
          germline pathogenic variants in EZH2, which encodes the predominant H3K27 methyltransferase
          and key enzymatic component of Polycomb repressive complex 2 (PRC2). Weaver syndrome is characterized
          by striking overgrowth and advanced bone age, intellectual disability, and distinctive facies.
        supports: SUPPORT
