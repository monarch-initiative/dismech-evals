            description: Chromatinopathy caused by heterozygous KDM6B (H3K27 demethylase) variants; the
              OMIM/MONDO label is "neurodevelopmental disorder with coarse facies and mild distal skeletal
              abnormalities".
            term:
              id: MONDO:0032790
              label: neurodevelopmental disorder with coarse facies and mild distal skeletal abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm6b_mouse_human_dysmorphology_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the available Kdm6b mouse models reproduce the non-neural (craniofacial and distal
          skeletal) arm of the human phenotype, or only the behavioral arm?
        attaches_to:
        - pathophysiology#Disrupted Craniofacial and Skeletal Patterning
        rationale: The heterozygous and mosaic-brain-knockout mouse models are reported in terms of sociability,
          memory, hyperactivity, impulsivity, and hippocampal synaptic physiology. The mosaic model is
          brain-restricted by construction and cannot address craniofacial or limb development at all.
          Homozygous demethylase-deficient Jmjd3 mutant embryos do show an axial skeletal phenotype (anterior
          homeotic transformation), but at a dosage that does not match the human heterozygous state,
          and craniofacial and distal limb morphology of constitutive heterozygotes remains unexamined.
          Evidence therefore exists in a model system but its fidelity to the dysmorphic component of
          the human disorder is untested rather than absent, which is the defining situation for a HUMAN_MODEL_MISMATCH
          rather than a plain knowledge gap.
        proposed_experiments:
        - experiment_id: exp_kdm6b_het_mouse_craniofacial_morphometry
          name: Craniofacial and skeletal morphometry of Kdm6b heterozygous mice
          description: Perform skeletal preparations and micro-CT craniofacial morphometry on constitutive
            Kdm6b heterozygous mice against wild-type littermates to test whether the dysmorphic arm of
            the human phenotype is modelled at all.
        - experiment_id: exp_kdm6b_lineage_conditional_deletion
          name: Lineage-restricted conditional Kdm6b deletion
          description: Delete Kdm6b conditionally in neural crest and limb bud lineages to test tissue-autonomous
            requirements for craniofacial and distal limb patterning.
      selected_evidence:
        snippet: Here we show the impact of KDM6B mosaic brain knockout on the manifestation of different
          autistic-like phenotypes including repetitive behaviors, social interaction, and significant
          cognitive deficits.
        supports: SUPPORT
