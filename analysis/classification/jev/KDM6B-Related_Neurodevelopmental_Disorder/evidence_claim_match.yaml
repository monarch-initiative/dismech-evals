      assertion:
        name: Disrupted Craniofacial and Skeletal Patterning
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'A minority of affected individuals have coarse facial features, mild distal skeletal
          anomalies (broad hands, syndactyly, clinodactyly), and axial skeletal findings (scoliosis, pectus
          excavatum, supernumerary ribs). A plausible mechanism is loss of KDM6-dependent de-repression
          of HOX and other patterning loci: H3K27me3 controls Hox gene expression and body patterning,
          inhibition of the KDM6 paralogue UTX in zebrafish causes hox mis-regulation with a posterior
          developmental defect, and Jmjd3 mutant mouse embryos show reduced Hox expression with anterior
          homeotic transformation of the axial skeleton. This route has not been demonstrated for KDM6B
          in human craniofacial or limb development, and the 85-individual cohort showed these features
          to be uncommon, so the node is explicitly hypothetical.

          '
        biological_processes:
        - preferred_term: cell fate commitment involved in pattern specification
          term:
            id: GO:0060581
            label: cell fate commitment involved in pattern specification
          modifier: ABNORMAL
      selected_evidence:
        snippet: Importantly, morpholino oligonucleotide inhibition of a zebrafish UTX homologue resulted
          in mis-regulation of hox genes and a striking posterior developmental defect, which was partially
          rescued by wild-type, but not by catalytically inactive, human UTX.
        supports: SUPPORT
        directness: INDIRECT
