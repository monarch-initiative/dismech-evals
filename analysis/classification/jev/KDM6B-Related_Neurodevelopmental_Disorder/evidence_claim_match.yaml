              OMIM/MONDO label is "neurodevelopmental disorder with coarse facies and mild distal skeletal
              abnormalities".
            term:
              id: MONDO:0032790
              label: neurodevelopmental disorder with coarse facies and mild distal skeletal abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm6b_omim_name_mismatch
        kind: CONTROVERSY
        status: OPEN
        prompt: Should the OMIM and MONDO label "neurodevelopmental disorder with coarse facies and mild
          distal skeletal abnormalities" be retired in favour of a gene-anchored name, given that the
          two features in the name are uncommon?
        attaches_to:
        - pathophysiology#Disrupted Craniofacial and Skeletal Patterning
        rationale: The syndrome name derives from a 12-patient ascertainment series. The 85-individual
          cohort found coarse facies and distal skeletal anomalies to be rare while hypotonia and psychosis
          are unexpectedly common, and stated explicitly that the OMIM description is inaccurate and potentially
          misleading. Retaining the name risks misdirecting clinical suspicion away from patients who
          lack dysmorphism. This entry uses the gene-anchored name while preserving MONDO:0032790 and
          the OMIM label as synonyms.
      selected_evidence:
        snippet: Here, by examining the molecular and clinical spectrum of 85 reported individuals with
          mostly de novo (likely) pathogenic KDM6B variants, we demonstrate that this description is inaccurate
          and potentially misleading.
        supports: SUPPORT
