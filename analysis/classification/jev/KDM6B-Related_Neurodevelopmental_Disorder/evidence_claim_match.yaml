    claim:
      about:
        disease:
          name: KDM6B-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: KDM6B-related neurodevelopmental disorder
            description: Chromatinopathy caused by heterozygous KDM6B (H3K27 demethylase) variants; the
              OMIM/MONDO label is "neurodevelopmental disorder with coarse facies and mild distal skeletal
              abnormalities".
            term:
              id: MONDO:0032790
              label: neurodevelopmental disorder with coarse facies and mild distal skeletal abnormalities
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant, predominantly de novo
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        de_novo_rate: Most reported pathogenic KDM6B variants have arisen de novo. The original 12-patient
          series consisted entirely of de novo alterations, and the 85-individual cohort is described
          as carrying mostly de novo (likely) pathogenic variants, with a minority inherited from a mildly
          affected or apparently unaffected parent.
        expressivity: VARIABLE
        description: 'Heterozygous KDM6B variants act in a dominant, dosage-sensitive manner. Expressivity
          is highly variable: cognitive involvement is consistent, but the severity of intellectual impairment
          and the presence of behavioral, psychiatric, dysmorphic, and skeletal features differ widely
          between individuals carrying comparable variants. Because the great majority of variants are
          de novo, recurrence risk for the siblings of a proband with a confirmed de novo variant is low,
          with residual risk from parental germline mosaicism. Inheritance from a mildly affected or apparently
          unaffected parent is documented and implies incomplete penetrance or highly variable expressivity
          in a minority of families.'
      selected_evidence:
        snippet: 85 reported individuals with mostly de novo (likely) pathogenic KDM6B variants
        supports: SUPPORT
