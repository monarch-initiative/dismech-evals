        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin
          State Imbalance
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'H3K27me3 is deposited by Polycomb repressive complex 2 (PRC2, catalytic subunit
          EZH2) and read by Polycomb repressive complex 1 to enforce transcriptional silencing. KDM6B
          provides the opposing, erasing arm of this switch; its enzymatic activity antagonizes Polycomb
          regulation and resolves bivalent promoters at the onset of differentiation. With KDM6B activity
          reduced, developmental promoters and enhancers that should be de-repressed remain Polycomb-silenced.
          This is the mechanistic mirror image of PRC2 gain-of-function chromatinopathies such as EZH2-related
          Weaver syndrome, in which the writing arm is overactive.

          '
        biological_processes:
        - preferred_term: negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: INCREASED
        - preferred_term: chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: ABNORMAL
      selected_evidence:
        snippet: Histone H3K27 trimethylation (H3K27me3) has been linked to polycomb-group-protein-mediated
          suppression of Hox genes and animal body patterning, X-chromosome inactivation and possibly
          maintenance of embryonic stem cell (ESC) identity.
        supports: SUPPORT
