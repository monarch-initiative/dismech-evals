              OMIM/MONDO label is "neurodevelopmental disorder with coarse facies and mild distal skeletal
              abnormalities".
            term:
              id: MONDO:0032790
              label: neurodevelopmental disorder with coarse facies and mild distal skeletal abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm6b_commitment_direction_paradox
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Does KDM6B loss block neural differentiation or accelerate it? Both are reported, and
          the reconciliation determines which cellular node actually drives the human cognitive phenotype.
        attaches_to:
        - pathophysiology#Impaired Neural Commitment and Neurogenesis
        - pathophysiology#Precocious Neural Stem Cell Differentiation and Pool Depletion
        rationale: Human embryonic stem cell-derived progenitors lacking KDM6 enzymes fail to differentiate
          into neurons and glia, and Jmjd3 deletion in subventricular zone neural stem cells impairs neuronal
          differentiation. In the hippocampal dentate gyrus, by contrast, Kdm6b deletion causes precocious
          neuronal differentiation that exhausts the stem cell pool. These are opposite directions of
          effect on the same cell-fate decision. Plausible reconciliations include regional specialisation
          (dentate gyrus versus subventricular zone and cortex), developmental timing, differing degrees
          of KDM6A compensation, or partial versus complete loss of KDM6 activity; the entry currently
          models both as separate nodes rather than forcing one. A further open strand is whether some
          of KDM6B's requirement is catalytic-independent, which would mean H3K27me3 demethylase activity
          alone does not account for the disorder; the abstracts available here do not settle that.
        proposed_experiments:
        - experiment_id: exp_kdm6b_region_matched_deletion_comparison
          name: Region-matched conditional Kdm6b deletion comparison
          description: Delete Kdm6b at matched developmental timepoints in dentate gyrus, subventricular
            zone, and cortical progenitors in the same study and score differentiation direction with
            common markers, to test whether the discrepancy is regional or methodological.
        - experiment_id: exp_kdm6b_catalytic_dead_rescue
          name: Catalytically dead KDM6B rescue
          description: Rescue KDM6B-null human neural progenitors with wild-type versus catalytically
            dead KDM6B and compare differentiation, proliferation, and H3K27me3 landscape, to quantify
            how much of the requirement is demethylase-dependent.
      selected_evidence:
        snippet: However, KDM6-deficient NPCs exhibit poor proliferation and a failure to differentiate
          into neurons and glia.
        supports: SUPPORT
