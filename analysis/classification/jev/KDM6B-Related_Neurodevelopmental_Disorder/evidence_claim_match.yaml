          of HOX and related patterning loci during craniofacial and skeletal development. Supporting
          evidence is from model organisms (H3K27me3 control of Hox genes; hox mis-regulation and posterior
          developmental defects after inhibition of the KDM6 paralogue UTX in zebrafish; reduced Hox expression
          with anterior homeotic transformation of the axial skeleton in demethylase-deficient Jmjd3 mutant
          mouse embryos). No human KDM6B craniofacial or limb developmental study has tested this directly,
          and the features are uncommon in the largest cohort.
