            term:
              id: MONDO:0700055
              label: KIF1A related neurological disorder
        context: []
      assertion_type: Subtype
      assertion:
        name: SPG30A
        display_name: Spastic paraplegia 30A, autosomal dominant
        description: Autosomal dominant (inherited or de novo) spastic paraplegia, slowly progressive
          and mostly pure, with onset from infancy to late adulthood. It is caused by motor-domain missense
          variants and, unlike the other KIF1A disorders, also by heterozygous loss-of-function variants
          outside the motor domain. KIF1A explained 6-7% of a Dutch clinical-exome cohort of mostly pure
          spastic paraplegia. Two families with motor-domain missense variants (p.Ser69Leu, p.Leu173Pro)
          also had learning difficulties, with borderline intellectual disability in one patient, placing
          SPG30A on a continuum with MRD9.
        subtype_term:
          preferred_term: spastic paraplegia 30A, autosomal dominant
          term:
            id: MONDO:0700307
            label: spastic paraplegia 30A, autosomal dominant
        genes:
        - preferred_term: KIF1A
          term:
            id: hgnc:888
            label: KIF1A
      selected_evidence:
        snippet: Segregation analyses showed a de novo occurrence in seven cases, and a dominant inheritance
          pattern in 11 families.
        supports: SUPPORT
    origin:
