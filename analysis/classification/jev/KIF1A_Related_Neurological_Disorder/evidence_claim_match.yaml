      assertion_type: Subtype
      assertion:
        name: MRD9
        display_name: Intellectual disability, autosomal dominant 9 (NESCAV syndrome)
        description: The classic and most frequent KAND presentation, caused by heterozygous, mostly de
          novo missense variants in the KIF1A motor domain. Features are developmental delay or intellectual
          disability with variable cerebellar atrophy, spastic paraparesis, optic nerve atrophy, peripheral
          neuropathy and epilepsy. p.Thr99Met, in the P-loop ATP-binding site, was the first de novo variant
          reported in nonsyndromic intellectual disability and is recurrent.
        subtype_term:
          preferred_term: intellectual disability, autosomal dominant 9
          term:
            id: MONDO:0013656
            label: intellectual disability, autosomal dominant 9
        genes:
        - preferred_term: KIF1A
          term:
            id: hgnc:888
            label: KIF1A
      selected_evidence:
        snippet: De novo missense mutations were identified in KIF1A (c.296C>T/p.Thr99Met), GRIN1 (c.1984G>A/p.Glu662Lys),
          EPB41L1 (c.2560C>T/p.Pro854Ser), and CACNG2 (c.427G>C/p.Val143Leu) (Table 2).
        supports: SUPPORT
