            term:
              id: MONDO:0700055
              label: KIF1A related neurological disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kand_aso_target_engagement_unmeasured
        prompt: Did the clinical improvement on nL-KIF1-001 come from knockdown of the pathogenic KIF1A
          transcript, given that knockdown was never measured in the patient?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Allele-Specific Antisense Oligonucleotide (n-of-1)
        - experimental_models#Patient-derived iPSC glutamatergic cortical neurons (KAND ASO testing)
        rationale: 'Allele-specific knockdown is established in patient-derived neurons in culture, and
          the clinical course of the one treated patient improved. The step between them is missing: no
          mutant-transcript or KIF1A protein measurement was made in the patient, in CSF or anywhere else,
          so nothing links the dose actually given to the molecular effect the drug was designed to have.
          CSF neurofilament light chain, the one disease-related molecular measure reported, was stable
          rather than moving with the clinical picture, and it reports neuroaxonal injury rather than
          target engagement. With n=1, open-label, caregiver-recorded primary outcomes in a disorder whose
          severity varies with age, natural history and expectancy are not excluded either. Neither ASO
          paper reports a non-targeting control ASO arm in vivo, so dependence on the mechanism is untested
          in an animal as well.'
        proposed_experiments:
        - experiment_id: kand_aso_csf_target_engagement
          experiment_design: TARGETED_PERTURBATION
          name: Mutant-allele transcript knockdown in patient CSF against clinical response
          description: Measure allele-specific KIF1A transcript or protein in CSF across the dose-escalation
            timepoints already being sampled, and test whether the degree of knockdown tracks the spell
            and fall diaries. CSF analysis is listed among the study's safety laboratory tests and CSF
            neurofilament light chain was measured, so the specimens exist.
          perturbations:
          - name: Intrathecal nL-KIF1-001 dose escalation
            target: treatments#Allele-Specific Antisense Oligonucleotide (n-of-1)
          readouts:
          - name: Allele-specific KIF1A transcript level in CSF
            target: pathophysiology#Dominant-Negative Inhibition of Wild-Type KIF1A
            interpretation: Knockdown rising with dose, and clinical measures moving with it, would close
              the gap between the in-vitro mechanism and the clinical result.
          would_support:
          - pathophysiology#Dominant-Negative Inhibition of Wild-Type KIF1A
          supporting_outcome:
          - Pathogenic-allele transcript falls with dose while the wild-type allele is spared, and the
            fall in transcript precedes or accompanies the clinical improvement.
          refuting_outcome:
          - No measurable reduction of the pathogenic transcript at any dose, which would leave the clinical
            improvement unexplained by the intended mechanism.
        - experiment_id: kand_aso_control_aso_counterfactual
          experiment_design: TARGETED_PERTURBATION
          name: Control-ASO counterfactual in a KAND knock-in animal
          description: In a knock-in model carrying a human KAND variant in cis with a targetable polymorphism,
            compare the allele-specific ASO against a sequence-matched non-targeting ASO on the same schedule.
          readouts:
          - name: Neurological phenotype rescue in treated versus control-ASO animals
            target: pathophysiology#Dominant-Negative Inhibition of Wild-Type KIF1A
            interpretation: Benefit confined to the targeting ASO would establish that the effect depends
              on allele-specific knockdown rather than on intrathecal dosing or the oligonucleotide backbone.
          would_support:
          - pathophysiology#Dominant-Negative Inhibition of Wild-Type KIF1A
          supporting_outcome:
          - The targeting ASO rescues the phenotype and the non-targeting ASO does not.
          refuting_outcome:
          - Both arms improve equally, indicating a sequence-independent effect.
      selected_evidence:
        snippet: Neurofilament light chain in the CSF was stable over time.
        supports: SUPPORT
