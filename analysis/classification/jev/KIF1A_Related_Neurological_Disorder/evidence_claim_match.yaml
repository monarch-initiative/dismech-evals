        context: []
      assertion_type: Treatment
      assertion:
        name: Polymorphism-Targeted Allele-Specific Antisense Oligonucleotides (preclinical)
        description: 'Preclinical extension of the nL-KIF1-001 approach from one patient to most patients.
          No single KIF1A variant accounts for more than 5% of cases, so designing one ASO per variant
          does not scale past the individual. Instead, antisense oligonucleotides are designed against
          common KIF1A polymorphisms and given to whichever patients carry their pathogenic variant in
          cis with the targeted allele, so one pre-selected reagent serves many genotypes rather than
          being screened for a single patient. Long-read phasing of 56 individuals found four polymorphisms
          that together would make 54 of them eligible. In patient-derived glutamatergic neurons, two
          ASOs against rs1063353 achieved 74% and 60% allele-specific knockdown and restored dendrite
          neurite outgrowth length. Preclinical: neither rs1063353 ASO has been given to a patient, and
          every ASO tested also knocked the non-targeted allele down to some degree, so selectivity is
          relative rather than absolute.'
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        oligonucleotide_details:
          oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
          target_gene:
            preferred_term: KIF1A
            term:
              id: hgnc:888
              label: KIF1A
          target_transcript: KIF1A pre-mRNA from the allele carrying a targeted common polymorphism in
            cis with the pathogenic variant
        delivery_system:
          delivery_platform: UNFORMULATED
          targeting_ligand: UNCONJUGATED
        treatment_term:
          preferred_term: polymorphism-targeted allele-specific antisense oligonucleotide therapy
          term:
