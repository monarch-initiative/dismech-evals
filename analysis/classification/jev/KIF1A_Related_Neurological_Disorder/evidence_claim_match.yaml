            description: Autosomal dominant (inherited or de novo) spastic paraplegia, slowly progressive
              and mostly pure, with onset from infancy to late adulthood. It is caused by motor-domain
              missense variants and, unlike the other KIF1A disorders, also by heterozygous loss-of-function
              variants outside the motor domain. KIF1A explained 6-7% of a Dutch clinical-exome cohort
              of mostly pure spastic paraplegia. Two families with motor-domain missense variants (p.Ser69Leu,
              p.Leu173Pro) also had learning difficulties, with borderline intellectual disability in
              one patient, placing SPG30A on a continuum with MRD9.
