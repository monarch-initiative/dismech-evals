  01ed10a44819e2e07683e4be5443597074a65e93493b9ad882bbe49b038fb8c9:
    claim:
      about:
        disease:
          name: KIF1A-Related Neurological Disorder
          disease_term:
            preferred_term: KIF1A related neurological disorder
            term:
              id: MONDO:0700055
              label: KIF1A related neurological disorder
        context: []
      assertion_type: Treatment
      assertion:
        name: Allele-Specific Antisense Oligonucleotide (n-of-1)
        description: 'Experimental individualized therapy. A 9-year-old girl with severe KAND and a de
          novo p.Pro305Leu variant received intrathecal nL-KIF1-001, a 5-10-5 2''-MOE gapmer with mixed
          phosphorothioate/phosphodiester backbone designed to recruit RNase H1 to the transcript of the
          pathogenic allele. It was developed with the non-profit n-Lorem Foundation, which makes individualized
          ASOs for patients with "nano-rare" variants. Allele selectivity comes from a common polymorphism
          rather than from the pathogenic variant itself: long-read phasing placed p.Pro305Leu in trans
          with the alternate allele of intronic SNP rs7578279, and the lead ASO, chosen from 468 gapmers
          screened against 77 heterozygous sites, binds the reference sequence in cis with the pathogenic
          variant. Dosing escalated from 20 mg in 20 mg steps to 80 mg. Over 9 months it was safe apart
          from an epidural CSF collection after the first injection; spells of behavioral arrest, falls
          and quality of life improved, 6-minute walk distance changed little, cognition was stable, and
          CSF neurofilament light chain was stable. Knockdown of the pathogenic transcript was not measured
          in the patient, and the authors expect intrathecal delivery to leave optic nerve atrophy untreated.
          The rationale is to remove the dominant-negative allele, leaving a haploinsufficient state that
          loss-of-function carriers suggest is much milder.'
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        oligonucleotide_details:
          oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
          target_gene:
            preferred_term: KIF1A
            term:
              id: hgnc:888
              label: KIF1A
          target_transcript: KIF1A mRNA from the p.Pro305Leu allele (allele-specific)
          oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
        delivery_system:
          delivery_platform: UNFORMULATED
