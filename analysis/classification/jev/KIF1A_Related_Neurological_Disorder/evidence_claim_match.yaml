      assertion_type: Discussion
      assertion:
        discussion_id: kand_haploinsufficiency_tolerance
        prompt: Is a heterozygous KIF1A loss-of-function state benign enough that silencing the dominant-negative
          allele is a durable therapeutic goal?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#KIF1A Haploinsufficiency
        - treatments#Allele-Specific Antisense Oligonucleotide (n-of-1)
        rationale: Allele-specific knockdown converts a dominant-negative genotype into a haploinsufficient
          one. Loss-of-function carriers have a much milder, pure spastic paraplegia, but they do develop
          disease, sometimes from infancy, so the ceiling of benefit and the long-term outcome of knockdown
          are unknown.
      selected_evidence:
        snippet: Heterozygous variants leading to KIF1A haploinsufficiency are associated only with adult
          onset hereditary spastic paraplegia without seizures or cognitive impairment, a phenotype significantly
          milder than that associated with missense variants9 suggesting that gapmer ASO mediated therapy
          might provide a bridging therapeutic approach for dominant negative missense variants in KIF1A
          until other treatment options are available.
        supports: SUPPORT
