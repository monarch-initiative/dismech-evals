      assertion:
        name: Dominant-Negative Inhibition of Wild-Type KIF1A
        role: mechanism
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        subtypes:
        - MRD9
        - SPG30A
        description: Activated KIF1A moves as a dimer, so in a heterozygous neuron about half of the motors
          are wild-type/mutant heterodimers. Mutant subunits suppress the motility of these heterodimers,
          and KAND knock-in worms heterozygous for the variant are more impaired than heterozygous null
          worms. Missense disease is clinically far more severe than loss-of-function disease, consistent
          with a dominant-negative rather than haploinsufficient mechanism; rigor motors may additionally
          act as roadblocks to other microtubule traffic.
      selected_evidence:
        snippet: Overall, the phenotypes of unc-104(R9Q)/+, unc-104(R251Q)/+, and unc-104(P298L)/+ were
          stronger than unc-104(null)/+, suggesting that the KAND mutations result in dominant-negative
          phenotypes for unc-104 transport in living animals.
        supports: SUPPORT
