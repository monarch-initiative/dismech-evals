        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#KIF1A Motor Domain Missense Variants
        rationale: Genotype-severity correlation matters for counseling and for selecting patients for
          allele-specific therapy. A 100-patient cohort links P-loop, switch I and switch II variants
          and rigor motility to severe disease, while a 28-patient Italian series found no correlation
          between mutation location and neurological or imaging presentation. Both are cross-sectional,
          and severity rises with age in a progressive disease.
      selected_evidence:
        snippet: 'We found increased severity is strongly associated with variants occurring in protein
          regions involved with ATP and MT binding: the P loop, switch I, and switch II.'
