              with nL-KIF1-001, differentiated into glutamatergic cortical neurons without co-culture
              and compared with isogenic CRISPR-corrected controls. MAP2 staining of at least 50 cells
              per genotype gives a cell-autonomous readout, dendrite neurite outgrowth length, which is
              shorter in variant-carrying neurons. This is the system in which allele-specific ASOs were
              shown to knock the pathogenic transcript down and restore outgrowth. nL-KIF1-001''s own
              selectivity was established in iPSC-derived neurons reprogrammed from the patient''s fibroblasts
              as well, but by allele-specific expression measurement alone: neither ASO paper cited here
              reports a phenotypic rescue readout outside this model.'
