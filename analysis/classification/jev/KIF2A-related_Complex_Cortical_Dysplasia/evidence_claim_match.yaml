  d02f57bd424a95447bc5a8d10f8d3062b492d87957a8e900941f015c1eebe3a9:
    claim:
      about:
        disease:
          name: KIF2A-related Complex Cortical Dysplasia
          disease_term:
            preferred_term: complex cortical dysplasia with other brain malformations 3
            term:
              id: MONDO:0014170
              label: complex cortical dysplasia with other brain malformations 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KIF2A Motor-Domain Nucleotide-Pocket Disruption
        role: TRIGGER
        biological_scale: MOLECULAR
        conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
        description: Pathogenic missense variants alter residues in or next to the nucleotide-binding
          pocket of the central KIF2A motor domain (recurrently Ser317 and His321, also Gly318, Thr320,
          Ser433 and Gly440). The altered motor domain is expected to bind or hydrolyse ATP poorly. Recombinant
          mutant motor domains are poorly soluble, consistent with misfolding, and mutant proteins mislocalize
          in cells. Because both alleles are expressed and KIF2A acts as a dimer, the original report
          considered the data consistent with a dominant-negative effect.
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          allele_type: missense
          description: Only heterozygous missense alleles in the motor domain are associated with CDCBM3.
            The dominant-negative call follows the authors' stated interpretation ("consistent with a
            dominant-negative effect") and has not been demonstrated directly, for example by mixing mutant
            and wild-type dimers.
        genes:
        - preferred_term: KIF2A
          term:
            id: hgnc:6318
            label: KIF2A
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: DECREASED
        - preferred_term: microtubule binding
          term:
            id: GO:0008017
            label: microtubule binding
          modifier: DYSREGULATED
      selected_evidence:
        snippet: both conserved residues p.S317 and p.H321 are located around the nucleotide binding pocket,
          suggesting that the ability of KIF2A mutants to bind and/or hydrolyse ATP is likely to be impaired.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23603762
      reference_title: Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development
        and microcephaly.
      evidence_source: COMPUTATIONAL
      explanation: Structural mapping places the founding variants at the nucleotide-binding pocket and
        predicts impaired ATP binding or hydrolysis.
