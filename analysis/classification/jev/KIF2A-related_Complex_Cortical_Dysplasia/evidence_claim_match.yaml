      assertion_type: Discussion
      assertion:
        discussion_id: gap_kif2a_progenitor_versus_null
        prompt: Do KIF2A disease variants impair cortical progenitor proliferation, given that conditional
          loss of Kif2a in mouse does not?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Progenitor Ciliogenesis and Cell-Cycle Coupling Defect
        rationale: In utero electroporation of patient variants reduces progenitor proliferation and alters
          ciliogenesis, but conditional inactivation of Kif2a in cortical progenitors leaves embryonic
          neurogenesis intact and instead causes postnatal neuronal maturation failure and degeneration.
          If the missense variants act dominant-negatively, they could impair progenitors in a way that
          removing the protein does not; alternatively the electroporation result may reflect overexpression.
          The answer decides whether microcephaly in this disease comes mainly from reduced progenitor
          output or from neuronal loss.
      selected_evidence:
        snippet: Here, we report that KIF2A is dispensable for embryogenic neurogenesis but critical in
          postnatal stages for maturation, connectivity, and maintenance of neurons.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
