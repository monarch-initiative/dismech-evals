        description: Pathogenic missense variants alter residues in or next to the nucleotide-binding
          pocket of the central KIF2A motor domain (recurrently Ser317 and His321, also Gly318, Thr320,
          Ser433 and Gly440). The altered motor domain is expected to bind or hydrolyse ATP poorly. Recombinant
          mutant motor domains are poorly soluble, consistent with misfolding, and mutant proteins mislocalize
          in cells. Because both alleles are expressed and KIF2A acts as a dimer, the original report
          considered the data consistent with a dominant-negative effect.
