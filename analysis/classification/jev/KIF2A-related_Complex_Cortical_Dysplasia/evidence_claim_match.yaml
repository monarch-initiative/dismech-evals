    evidence_metadata:
      reference: PMID:36343267
      reference_title: KIF2A deficiency causes early-onset neurodegeneration.
      evidence_source: MODEL_ORGANISM
      explanation: Conditional loss of Kif2a does not impair embryonic neurogenesis, which argues against
