  953fcedeb5eaac50c3b5e1e10b8d45d38ef7e05df330d56797c89319a74c9187:
    claim:
      about:
        disease:
          name: KIF5B-Related Kyphomelic Dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Kinesin-1 Dependent Intracellular Transport
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: 'Impaired kinesin-1 motor function is expected to disrupt anterograde microtubule-based
          transport of organelles and secretory cargo. This node is curated as PROVISIONAL rather than
          ESTABLISHED because the inference runs from variant location to cellular consequence: the reporting
          study demonstrated where the variants sit and what they do clinically, but did not directly
          measure transport, motility or cargo delivery in patient cells. The cell-biological step between
          a damaged motor domain and a bent femur is therefore not yet evidenced.'
        molecular_functions:
        - preferred_term: microtubule motor activity
          modifier: DECREASED
          term:
            id: GO:0003777
            label: microtubule motor activity
      selected_evidence:
        snippet: Furthermore, alterations in kinesins cause various symptoms known as kinesinopathies,
          and our findings also extend the phenotypic spectrum of kinesinopathies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:35342932
      reference_title: De novo heterozygous variants in KIF5B cause kyphomelic dysplasia.
      evidence_source: OTHER
      explanation: Places the disorder in the kinesinopathy class, the disease family defined by impaired
        kinesin function.
