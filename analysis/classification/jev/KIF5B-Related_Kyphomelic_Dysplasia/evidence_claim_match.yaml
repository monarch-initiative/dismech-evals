  2b8d2eb8fe11c491a561d59d5e2ba68db3280b96fde92ce291d60597fddaf737:
    claim:
      about:
        disease:
          name: KIF5B-Related Kyphomelic Dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bent Bone Skeletal Dysplasia with Bone Fragility
        biological_scale: ORGANISM
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: 'The clinical endpoint: sharp angulation of the femora and humeri with distinctive
          facial features and neonatal respiratory distress. Distinctively for this form, the skeleton
          is also fragile — three of four individuals developed postnatal osteoporosis with subsequent
          fractures — and two had optic atrophy, a non-skeletal feature consistent with a motor protein
          expressed well beyond cartilage.'
      selected_evidence:
        snippet: All individuals had sharp angulation of the femora and humeri, distinctive facial features,
          and neonatal respiratory distress.
        supports: SUPPORT
