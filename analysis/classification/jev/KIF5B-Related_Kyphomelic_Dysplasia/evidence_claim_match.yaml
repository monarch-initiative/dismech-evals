        notes: KIF5B (10p11.22) encodes the kinesin-1 heavy chain. The three reported pathogenic alleles
          — p.(Lys91Arg) recurring in two individuals, p.(Thr195Lys) and p.(Gly234Val) — all affect conserved
          residues in or near the ATPase-related motifs of the catalytic motor domain. Recurrence of p.(Lys91Arg)
          in two unrelated individuals strengthens the gene-disease assertion beyond what four cases would
          otherwise support. KIF5B disease belongs to the kinesinopathies, and this phenotype extends
          that spectrum.
