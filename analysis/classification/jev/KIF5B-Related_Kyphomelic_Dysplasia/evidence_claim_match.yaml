  7f74a5f72cf2b23665e1e45da76aee30706d50ccc315c71ec712946cf900929a:
    claim:
      about:
        disease:
          name: KIF5B-Related Kyphomelic Dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KIF5B Motor Domain Dysfunction
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'KIF5B encodes the kinesin-1 heavy chain, the ATP-hydrolysing motor subunit that
          moves cargo anterogradely along microtubules. The three reported pathogenic variants — p.(Lys91Arg),
          p.(Thr195Lys) and p.(Gly234Val) — all affect conserved residues in or close to the ATPase-related
          motifs of the catalytic motor domain. That clustering is the mechanistic argument: the lesion
          is in force generation or ATP handling specifically, not in overall kinesin expression, which
          is consistent with a dominant rather than haploinsufficient mode.'
        genes:
        - preferred_term: KIF5B
          term:
            id: hgnc:6324
            label: KIF5B
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          description: De novo heterozygous missense variants clustering in the catalytic motor domain.
            Dominant action on a motor that functions as a dimer is the straightforward reading, though
            the specific dominant mechanism was not tested experimentally.
        molecular_functions:
        - preferred_term: microtubule motor activity
          modifier: DECREASED
          term:
            id: GO:0003777
            label: microtubule motor activity
      selected_evidence:
        snippet: 'All individuals had de novo heterozygous variants in KIF5B encoding kinesin-1 heavy
          chain: two with c.272A>G:p.(Lys91Arg), one with c.584C>A:p.(Thr195Lys), and the other with c.701G>T:p.(Gly234Val).'
        supports: SUPPORT
