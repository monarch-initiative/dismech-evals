              label: KINSSHIP syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Multisystem Developmental Patterning Failure
        biological_scale: ORGANISM
        description: 'The convergent endpoint: mesomelic limb deformity, horseshoe kidney, brain malformation
          and seizures, hypertrichosis, and pulmonary involvement. The Aff3 knockout mouse develops skeletal
          anomalies, kidney defects, brain malformations, and neurological anomalies — the same organ
          set — which is the strongest available argument that these are one pleiotropy rather than coincidence.'
      selected_evidence:
        snippet: Whereas homozygous Aff3 knockout mice display skeletal anomalies, kidney defects, brain
          malformations, and neurological anomalies, knockin animals modeling one of the microdeletions
          and the most common of the missense variants identified in affected individuals presented with
          lower mesomelic limb deformities like KINSSHIP-affected individuals and early lethality, respectively.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
