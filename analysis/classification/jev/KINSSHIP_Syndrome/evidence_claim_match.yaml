      assertion_type: Pathophysiology
      assertion:
        name: Degron Disruption Stabilizing AFF3
        biological_scale: MOLECULAR
        genes:
        - preferred_term: AFF3
          term:
            id: hgnc:6473
            label: AFF3
        genetic_context:
          gene:
            preferred_term: AFF3
            term:
              id: hgnc:6473
              label: AFF3
          allele_type: degron missense substitution or degron-spanning microdeletion
          zygosity: HETEROZYGOUS
          variant_origin: DE_NOVO
        description: 'A degron is a short sequence that marks a protein for destruction. AFF3''s is nine
          amino acids long and binds a ubiquitin ligase. Missense variants within it, and microdeletions
          removing it, both prevent that hand-off. The consequence is not loss of AFF3 but persistence
          of it: the variant classes converge on the same endpoint precisely because the motif''s only
          job is to be recognized, so disrupting it by substitution or by excision is equivalent.'
        molecular_functions:
        - preferred_term: AFF3 degron binding to ubiquitin ligase
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0031625
            label: ubiquitin protein ligase binding
        biological_processes:
        - preferred_term: Ubiquitin-dependent degradation of AFF3
          modifier: DECREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
      selected_evidence:
        snippet: de novo missense variants in the degron of AFF3, a nine amino acid sequence important
          for its binding to ubiquitin ligase, or with de novo deletions of this region
        supports: SUPPORT
