        name: AFF3
        gene_term:
          preferred_term: AFF3
          term:
            id: hgnc:6473
            label: AFF3
        relationship_type: CAUSATIVE
        notes: 'AF4/FMR2 family member 3, an ALF-family component of the transcriptional super elongation
          complex. The pathogenic alleles are confined to a nine-residue degron — an unusually tight variant-location
          constraint, which is diagnostically useful: a missense variant elsewhere in AFF3 should not
          be called causal for KINSSHIP on the strength of the gene alone. Note also that a GCC repeat
          expansion in AFF3 has been separately associated with disease; that is a different allele class
          and is not curated here.'
      selected_evidence:
        snippet: We describe an autosomal dominant disorder associated with de novo missense variants
          in the degron of AFF3, a nine amino acid sequence important for its binding to ubiquitin ligase,
          or with de novo deletions of this region.
        supports: SUPPORT
