        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Super Elongation Complex Activity
        biological_scale: CELLULAR
        description: 'AFF3 is one of four ALF paralogs (AFF1-AFF4) in the transcriptional super elongation
          complex, which releases paused RNA polymerase II at genes governing neurogenesis and development.
          Excess AFF3 therefore acts on transcriptional output rather than on any single structural protein,
          which is why the phenotype is multisystem. The paralogs are not interchangeable: AFF4 variants
          cause CHOPS syndrome, which overlaps KINSSHIP only partially, and the published transcriptome
          work argues each ALF factor contributes something distinct.'
        biological_processes:
        - preferred_term: transcription elongation by RNA polymerase II
          modifier: DYSREGULATED
          term:
            id: GO:0006368
            label: transcription elongation by RNA polymerase II
      selected_evidence:
        snippet: The ALF transcription factor paralogs, AFF1, AFF2, AFF3, and AFF4, are components of
          the transcriptional super elongation complex that regulates expression of genes involved in
          neurogenesis and development.
        supports: SUPPORT
    origin:
