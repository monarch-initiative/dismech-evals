      assertion_type: Pathophysiology
      assertion:
        name: KIZ c.226C>T Exonic Splicing Enhancer Disruption
        biological_scale: MOLECULAR
        description: Besides creating a premature stop codon in exon 3, the founder c.226C>T (p.Arg76*)
          change lies in a predicted SRSF5-recognized exonic splicing enhancer. Patient fibroblasts show
          less full-length transcript and more transcripts lacking exon 3, all of which are out of frame,
          so the allele removes kizuna by two routes.
        biological_processes:
        - preferred_term: alternative mRNA splicing
          term:
            id: GO:0000380
            label: alternative mRNA splicing, via spliceosome
          modifier: DYSREGULATED
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Our data indicate that p.R76* affect an ESE which in turn results in the pronounced skipping
          of exon 3.
        supports: SUPPORT
