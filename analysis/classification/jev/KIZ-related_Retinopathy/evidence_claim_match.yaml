        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kiz_photoreceptor_function
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Kizuna at the Photoreceptor Ciliary Base
        - pathophysiology#Photoreceptor Connecting Cilium Dysfunction
        prompt: What does kizuna do in post-mitotic photoreceptors, and does its loss damage the connecting
          cilium or outer segment?
        rationale: Kizuna's only characterized function is stabilizing pericentriolar material in dividing
          cells. The photoreceptor mechanism rests on localization of the mouse ortholog to the base of
          the connecting cilium, patient fibroblasts show no ciliary defect, and no KIZ-deficient animal
          or retinal organoid model has been described, so the steps between loss of kizuna and rod degeneration
          are inferred.
        proposed_experiments:
        - experiment_id: kiz_patient_retinal_organoid_cilium
          name: Connecting cilium and outer segment structure in KIZ patient retinal organoids
          description: Compare connecting cilium length, basal body and pericentriolar material organization,
            outer segment formation and opsin localization in photoreceptors of retinal organoids from
            c.226C>T homozygous patient iPSCs against gene-corrected isogenic controls.
          would_support:
          - pathophysiology#Photoreceptor Connecting Cilium Dysfunction
      selected_evidence:
        snippet: Together, our findings unveil the limitations of fibroblasts as a cellular model for
          RCD and call for other models such as induced pluripotent stem cells to shed light on retinal
          pathogenic mechanisms of KIZ mutations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
