        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic KIZ Loss of Function
        biological_scale: MOLECULAR
        conforms_to: photoreceptor_degeneration#Photoreceptor Gene Defect
        description: Biallelic nonsense, frameshift and start-loss variants remove functional kizuna.
          Kizuna is a centrosomal protein phosphorylated by PLK1; in dividing cells it keeps the pericentriolar
          material attached to the centrioles so that the mitotic spindle stays bipolar. Its function
          in post-mitotic photoreceptors is not known. ClinGen records biallelic loss of function as the
          mechanism. Patient fibroblasts compound heterozygous for two truncating alleles showed no detectable
          change in KIZ transcript level, protein localization or cilium length, so the expected loss
          of protein has not been demonstrated in patient cells.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: KIZ
          term:
            id: hgnc:15865
            label: KIZ
        molecular_functions:
        - preferred_term: protein kinase binding (PLK1 substrate)
          term:
            id: GO:0019901
            label: protein kinase binding
          modifier: DECREASED
      selected_evidence:
        snippet: The mechanism of pathogenicity appears to be biallelic loss of function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
