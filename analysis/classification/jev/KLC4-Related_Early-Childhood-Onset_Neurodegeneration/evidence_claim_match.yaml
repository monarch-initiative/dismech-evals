              label: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
                hearing loss, and demyelinating peripheral neuropathy
        context:
        - path: /animal_models/0
          value:
            name: klc4 mutant zebrafish
            species: Zebrafish
            genotype: klc4 uw314 (nonsense mutation, homozygous)
            publication: PMID:36222498
            description: 'The principal in vivo model, and the source of essentially all of this entry''s
              cell biology. Live imaging in klc4 mutant embryos shows that KLC4 is required for stabilising
              nascent sensory axon branches, for normal microtubule dynamics and endosomal transport,
              and for the contact repulsion that keeps peripheral arbors tiled rather than fasciculated.
              Mutant larvae are hypersensitive to touch and mutant adults show anxiety-like behaviour.

              It is also the model that complicates the disease''s name: these fish are adult viable and
              show no signs of early neurodegeneration.'
            genes:
            - preferred_term: KLC4
              term:
                id: hgnc:21624
                label: KLC4
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Progressive Complicated Spastic Paraplegia
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: The human disease is a childhood-onset progressive neurodegeneration with spastic
          paraplegia. The fish mutant is adult viable, its axons grow faster rather than slower, and it
          shows no signs of early neurodegeneration. Whatever the fish is modelling, it is not degeneration.
        limitations: 'The mismatch may be real biology or may be species redundancy: zebrafish and human
          both have several kinesin light chains, but nothing establishes that the compensation available
          in a fish is available in a child, and no ageing study of these mutants beyond adult viability
          has been published. Nor has the fish been examined for a corticospinal-equivalent phenotype
          - fish have no corticospinal tract - so the absence of paraplegia is partly a statement about
          the model''s anatomy rather than about KLC4. Recorded as FAILS_TO_RECAPITULATE because the published
          phenotypes do not correspond, not because degeneration has been excluded as a consequence of
          KLC4 loss.'
      selected_evidence:
        snippet: Klc4 mutant neurons do not have a general growth defect, in that their axons grow faster
          than wild type axons. In addition, klc4 mutants are adult viable and show no signs of early
          neurodegeneration.
        supports: SUPPORT
