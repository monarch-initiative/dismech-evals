  f9de295a8f66a74a06e1fa5fe558faec13fae621b86fa9452ef074c042515505:
    claim:
      about:
        disease:
          name: KLC4-Related Early-Childhood-Onset Neurodegeneration
          disease_term:
            preferred_term: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
              hearing loss, and demyelinating peripheral neuropathy
            term:
              id: MONDO:0700288
              label: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
                hearing loss, and demyelinating peripheral neuropathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: klc4_disease_name_outruns_its_published_phenotype
        kind: KNOWLEDGE_GAP
        prompt: MONDO and OMIM name this disease after retinitis pigmentosa, sensorineural hearing loss
          and demyelinating peripheral neuropathy. The abstract of its only clinical publication names
          none of the three. Where did they come from, and what should a curator do about it?
        attaches_to:
        - disease#KLC4-Related Early-Childhood-Onset Neurodegeneration
        - phenotypes#Visual Impairment
        - phenotypes#Hearing Impairment
        rationale: 'MedGen''s definition of this concept attributes the full description - progressive
          walking difficulty, retinitis pigmentosa with blindness, sensorineural hearing loss, demyelinating
          peripheral neuropathy, severely impaired intellectual development - to Bayrakli et al. 2015.
          That is the same publication this entry cites. So the features are almost certainly in the paper''s
          full text, in a clinical table or case descriptions that its abstract compresses into the four
          words "progressive complicated spastic paraplegia".

          The paper is behind a paywall and its full text cannot be retrieved into the reference cache,
          and a dismech evidence snippet must be an exact substring of a cached source. So the entry cannot
          curate retinitis pigmentosa, sensorineural hearing loss or demyelinating neuropathy, even though
          the disease is named after them and they are very likely true.

          What it can do is curate one level up. A later zebrafish paper summarises the human phenotype
          as defects in vision, hearing, movement and cognition, and that sentence is quotable. The three
          phenotype records here are bound accordingly - HP:0000505 rather than a retinal dystrophy term,
          HP:0000365 rather than a sensorineural one - and each says in its description why.

          This is a resolvable gap, not a permanent one, and the resolution is mechanical: obtain the
          2015 full text, cache it, and split the visual, auditory and peripheral nerve records to the
          specificity it supports. Until then, a reader should treat the disease''s own name as the best
          available hypothesis about its phenotype rather than as something this entry has verified.

          One lead for whoever does that work. The falcon deep-research report committed alongside this
          entry had retrieval access to the 2015 paper''s full text and reports retinitis pigmentosa progressing
          to blindness in the oldest patient, described in 3 of 3 affected siblings, alongside sensorineural
          hearing loss and demyelinating polyneuropathy. That is a provider report, not a source this
          entry can quote, and it is recorded here as a lead rather than as evidence - but it is consistent
          with MedGen''s attribution and says the full text is worth obtaining.'
      selected_evidence:
        snippet: Three patients from the same family shared common features of progressive complicated
          spastic paraplegia.
        supports: SUPPORT
