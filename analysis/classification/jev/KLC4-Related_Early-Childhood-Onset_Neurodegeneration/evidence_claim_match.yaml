              label: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
                hearing loss, and demyelinating peripheral neuropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Axon Branch Stabilisation and Arbor Patterning
        description: 'Without KLC4, nascent sensory axon branches fail to stabilise and peripheral axons
          lose the contact repulsion that normally keeps neighbouring arbors from overlapping - they fasciculate
          instead, which is how central rather than peripheral axons behave. The result is a sensory field
          that is innervated in the wrong pattern rather than not innervated at all, and it implies KLC4
          helps establish the molecular difference between a neuron''s central and peripheral axons.

          Every measurement behind this node is from zebrafish. Nothing equivalent has been looked at
          in a patient.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: axon guidance
          term:
            id: GO:0007411
            label: axon guidance
          modifier: ABNORMAL
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
      selected_evidence:
        snippet: Finally, we find that klc4 mutant larva are hypersensitive to touch and adults show anxiety-like
          behavior in a novel tank test, implicating klc4 as a new gene involved in stress response circuits.
        supports: SUPPORT
    origin:
