          value:
            name: Humanized hKLC4 Caenorhabditis elegans
            species: Caenorhabditis elegans
            genotype: klc-2 replaced by human KLC4 (hKLC4), with hKLC4 variants introduced
            publication: PMID:37565267
            description: 'A humanised worm built to test KLC4 variants of uncertain significance: the
              endogenous klc-2 gene was replaced with human KLC4, which retained most of klc-2''s function,
              and five hKLC4 variants were then introduced into that background. The clinical variant
              caused early lethality with nuclear migration defects when homozygous and a weak defect
              when heterozygous.

              Important scope limit: the "clinical variant" here is the *heterozygous, late-onset* frameshift
              at residue 369 from an Undiagnosed Diseases Network proband, not the homozygous exon-6 deletion
              of the family this entry curates. The model is included because both truncations are predicted
              to remove the same cargo-binding domain, so it speaks to whether losing that domain is deleterious
              - not to this disease''s allele.'
            genes:
            - preferred_term: KLC4
              term:
                id: hgnc:21624
                label: KLC4
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Loss of the KLC4 Cargo-Binding TPR Domain
        relationship: PERTURBS
        fidelity: LOW
        description: The only experimental test of what a truncating KLC4 allele does in a living animal
          expressing human KLC4. A homozygous truncation is lethal in this background with severe nuclear
          migration defects, which is direct evidence that the truncation is not tolerated - the question
          this node otherwise answers only by structural prediction.
        limitations: 'The allele is the wrong one: a residue-369 frameshift from a heterozygous late-onset
          patient, not the residue-277 truncation of this recessive childhood disease. The readout is
          also the wrong one: nuclear migration is a klc-2 function in the worm with no established counterpart
          in this disease''s phenotype. And the paper notes that a dominant-negative effect of the truncated
          protein could not be reproduced in this system at all, because the transcript is likely subject
          to nonsense-mediated decay. Fidelity is LOW; this establishes that the domain matters, and nothing
          about the disease.'
        readouts:
        - name: Nuclear migration in humanized hKLC4 worms carrying the clinical variant
          target: Loss of the KLC4 Cargo-Binding TPR Domain
          direction: ALTERED
          interpretation: Homozygous clinical variant animals show significant nuclear migration defects
            and early lethality; heterozygotes show a weak defect.
      selected_evidence:
        snippet: We created a humanized Caenorhabditis elegans model in which klc-2 was replaced by human
          KLC4 (referred to as hKLC4) and assessed the extent to which hKLC4 retained function in the
          worm.
        supports: SUPPORT
