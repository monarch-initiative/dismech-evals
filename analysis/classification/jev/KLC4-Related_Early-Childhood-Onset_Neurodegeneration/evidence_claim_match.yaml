      assertion:
        name: Nascent axon branch stabilization
        target: Defective Axon Branch Stabilisation and Arbor Patterning
        direction: DECREASED
        interpretation: New peripheral sensory axon branches fail to be maintained in the mutant, which
          is the primary morphological defect the model shows.
      selected_evidence:
        snippet: Using live imaging approaches in klc4 mutant zebrafish, we show that KLC4 is required
          for stabilization of nascent axon branches, proper microtubule (MT) dynamics, and endosomal
          transport.
