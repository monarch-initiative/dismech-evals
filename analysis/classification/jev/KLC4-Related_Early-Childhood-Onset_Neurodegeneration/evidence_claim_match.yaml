  c254e083ec4abb7bd9f2425a06638885d79a66121c5ce52d31d7f2dd55048217:
    claim:
      about:
        disease:
          name: KLC4-Related Early-Childhood-Onset Neurodegeneration
          disease_term:
            preferred_term: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
              hearing loss, and demyelinating peripheral neuropathy
            term:
              id: MONDO:0700288
              label: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
                hearing loss, and demyelinating peripheral neuropathy
        context: []
      assertion_type: Genetic
      assertion:
        name: KLC4
        notes: 'KLC4 encodes kinesin light chain 4, one of four vertebrate kinesin light chains. Three
          of them - KLC1, KLC2 and KLC4 - are expressed in the nervous system, and the evidence is that
          they divide the work rather than substituting for one another: each has distinct cargo-adaptor
          affinities and distinct loss-of-function phenotypes. In zebrafish, klc4 is expressed early and
          in diverse neural populations of both the central and peripheral nervous system; no equivalent
          human expression study has been published.

          One published disease allele exists: c.853_871del19 in exon 6, homozygous, in one consanguineous
          family. ClinVar holds a second allele classified against this disease concept, NM_201521.3:c.1164T>A
          (p.Cys388Ter), as likely pathogenic. A PubMed search for KLC4 and for "kinesin light chain 4"
          returned no clinical report beyond the two discussed here, so that allele is not used as evidence.

          The gene-phenotype relationship is not settled. NCBI''s `mim2gene_medgen` maps MIM 621129 to
          KLC4 with the qualifier `question`, which that file''s documentation defines as a question mark
          before the disease name in OMIM, indicating an unconfirmed or possibly spurious mapping. KLC4
          has no ClinGen gene-disease validity classification - it does not appear in the ClinGen Gene-Disease
          Validity CSV.

          The sibling gene is worth knowing about when reading this disease. Biallelic KLC2 variants cause
          SPOAN syndrome, a progressive spastic paraplegia with optic atrophy and neuropathy beginning
          in infancy, which is close enough to this phenotype that the two genes are best understood as
          a pair.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: KLC4
          term:
            id: hgnc:21624
            label: KLC4
      selected_evidence:
        snippet: The association of a KLC4 mutation with spastic paraplegia identifies a new locus for
          the disease.
        supports: SUPPORT
