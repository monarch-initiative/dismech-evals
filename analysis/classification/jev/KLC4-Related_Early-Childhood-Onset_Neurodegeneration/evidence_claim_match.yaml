  ab5f7e28ffd1b2aeb4878db5f3203047906b8165fe4b33a2e49985115c93eac2:
    claim:
      about:
        disease:
          name: KLC4-Related Early-Childhood-Onset Neurodegeneration
          disease_term:
            preferred_term: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
              hearing loss, and demyelinating peripheral neuropathy
            term:
              id: MONDO:0700288
              label: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
                hearing loss, and demyelinating peripheral neuropathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: klc4_zebrafish_patterning_versus_human_neurodegeneration
        kind: HUMAN_MODEL_MISMATCH
        prompt: The klc4 mutant zebrafish is adult viable with no early neurodegeneration, and its defect
          is one of axon patterning rather than axon survival. The human disease is called a neurodegeneration.
          Which is right about KLC4?
        attaches_to:
        - animal_models#klc4 mutant zebrafish
        - pathophysiology#Disordered Patterning Across Multiple Neural Systems
        - phenotypes#Progressive Complicated Spastic Paraplegia
        rationale: 'The fish authors are explicit that their mutant''s neurons look healthy, that axons
          grow faster rather than slower, and that there is no sign of early degeneration - and they read
          the human disease accordingly, as possibly caused by defects in developmental patterning rather
          than by degeneration. The human report describes a progressive disorder, and the disease''s
          name in MONDO and OMIM begins with the word neurodegeneration.

          These need not be contradictory. A developmental patterning defect can present as progressive
          loss of function if a mispatterned circuit decompensates with age or fails to keep pace with
          growth, and "progressive" in the clinical report is a description of course, not of pathology.
          No neuropathology from an affected person has been published, so no one has looked at whether
          neurons are actually dying.

          But they are different mechanistic claims with different consequences, and the entry does not
          choose between them. The pathograph is built on the patterning account, because that is where
          the measurements are, and the fish''s viability is curated as a FAILS_TO_RECAPITULATE link against
          the spastic paraplegia phenotype rather than omitted.

          Two caveats belong with the mismatch. Fish have no corticospinal tract, so the absence of spastic
          paraplegia in the model is partly a fact about its anatomy. And vertebrates carry four kinesin
          light chains with overlapping neuronal expression, so paralogue redundancy may differ between
          species - the fish may simply be better compensated than a child.'
      selected_evidence:
        snippet: Klc4 mutant neurons do not have a general growth defect, in that their axons grow faster
          than wild type axons. In addition, klc4 mutants are adult viable and show no signs of early
          neurodegeneration.
        supports: SUPPORT
