        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: Defective Axon Branch Stabilisation and Arbor Patterning
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: This node is not a human observation that the fish corroborates - it is the experiment.
              Axon branch dynamics and arbor tiling cannot be measured in a patient, and no neuropathology
              from an affected person has been published, so every claim in the node comes from this line.
            limitations: Two gaps. The fish is a whole-animal nonsense mutant of a single klc4 gene, while
              the human patients are homozygous for a truncation in one of four light chains whose paralogues
              are also expressed in neurons - so redundancy differs between the species and nothing establishes
              that a human KLC4 truncation produces the same cellular defect. And the measurements are
              in embryonic Rohon-Beard sensory neurons, a cell type with no direct human counterpart,
              whereas the human phenotype is dominated by corticospinal involvement that this model does
              not address at all. Fidelity is MODERATE rather than HIGH for that reason.
          role: ancestor
