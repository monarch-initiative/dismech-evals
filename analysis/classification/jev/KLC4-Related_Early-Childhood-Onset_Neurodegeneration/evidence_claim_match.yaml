          then whole-exome sequencing within them. The interpretive caution is the same one that applies
          to any gene at unconfirmed validity - a KLC4 variant found on a panel or exome in a child with
          complicated spastic paraplegia is a candidate to pursue with segregation testing, not a finished
          diagnosis, and OMIM''s own qualifier on this gene-phenotype mapping should be read alongside
