          consanguinity to discuss in a family where it is the reason the allele became homozygous. Two
          things specific to this disease belong in the conversation: the gene-phenotype relationship
          is flagged by OMIM as unconfirmed, so a KLC4 result should be presented as probable rather than
          settled; and unaffected heterozygous relatives in the reported family had no symptoms, which
          is the reassurance carrier testing can offer.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'No target_mechanisms link is recorded: counselling does not act on a pathograph node and
          every TreatmentEffectEnum value asserts a change to a mechanism.

          This is the only treatment record in the entry because it is the only one that can be stated
          without inventing an experience. No management of any kind is described for any affected individual
          - no physiotherapy, no antispasticity drug, no hearing or visual aid, no outcome - and no KLC4-directed
          therapy or clinical trial exists. Symptomatic management of spasticity and sensory impairment
          is what these children would receive, but writing that as a treatment record would state a class-level
          standard of care as though it were something known about this disease.'
      selected_evidence:
        snippet: Meanwhile, the unaffected parents and two siblings were heterozygous and one sibling
          was homozygous wild type.
        supports: SUPPORT
