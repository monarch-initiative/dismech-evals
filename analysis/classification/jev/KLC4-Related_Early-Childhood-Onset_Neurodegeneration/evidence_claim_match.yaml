  7e3149d10df9db3d5036403da7d99623fc0002c012b51f9ba51538417d4669aa:
    claim:
      about:
        disease:
          name: KLC4-Related Early-Childhood-Onset Neurodegeneration
          disease_term:
            preferred_term: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
              hearing loss, and demyelinating peripheral neuropathy
            term:
              id: MONDO:0700288
              label: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
                hearing loss, and demyelinating peripheral neuropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Axon Branch Stabilisation and Arbor Patterning
        description: 'Without KLC4, nascent sensory axon branches fail to stabilise and peripheral axons
          lose the contact repulsion that normally keeps neighbouring arbors from overlapping - they fasciculate
          instead, which is how central rather than peripheral axons behave. The result is a sensory field
          that is innervated in the wrong pattern rather than not innervated at all, and it implies KLC4
          helps establish the molecular difference between a neuron''s central and peripheral axons.

          Every measurement behind this node is from zebrafish. Nothing equivalent has been looked at
          in a patient.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: axon guidance
          term:
            id: GO:0007411
            label: axon guidance
          modifier: ABNORMAL
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
      selected_evidence:
        snippet: 'Furthermore, KLC4 is required for proper tiling of peripheral axon arbors: in klc4 mutants,
          peripheral axons showed abnormal fasciculation, a behavior characteristic of central axons.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36222498
      reference_title: KLC4 shapes axon arbors during development and mediates adult behavior.
      evidence_source: MODEL_ORGANISM
      explanation: 'The tiling defect, and the detail that gives it mechanistic meaning: peripheral axons
        start behaving like central ones, so the lost function is compartment identity rather than growth.'
