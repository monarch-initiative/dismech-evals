          proteins, and they also activate the motor by relieving autoinhibition of the kinesin heavy
          chain. A stop codon after residue 277 removes those repeats. This is a prediction from the position
          of the truncation rather than a measurement: no patient material has been assayed for KLC4 protein,
          cargo binding or motor activity.'
        biological_scale: MOLECULAR
        cellular_components:
        - preferred_term: kinesin I complex
          term:
            id: GO:0016938
            label: kinesin I complex
      selected_evidence:
        snippet: KLCs are known to mediate binding between the kinesin motor and cellular cargos, and
          also to activate the motor by releasing KHC autoinhibition
        supports: SUPPORT
