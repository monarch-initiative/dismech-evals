              hearing loss, and demyelinating peripheral neuropathy
            term:
              id: MONDO:0700288
              label: early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural
                hearing loss, and demyelinating peripheral neuropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Kinesin-1 Cargo Delivery in Developing Neurons
        description: 'Kinesin-1 carries mitochondria, synaptic vesicle precursors, endosomes, lysosomes
          and RNA granules along microtubules, and the light chain is what makes that transport selective.
          In a klc4 mutant, endosomal transport and microtubule dynamics are both altered.

          The specificity of the defect is the notable part. Losing KLC4 does not stop transport in general
          - mutant axons grow faster than wild type - so the lesion is in which cargo reaches which compartment
          rather than in how much cargo moves.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        biological_processes:
        - preferred_term: anterograde axonal transport
          term:
            id: GO:0008089
            label: anterograde axonal transport
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Using live imaging approaches in klc4 mutant zebrafish, we show that KLC4 is required
          for stabilization of nascent axon branches, proper microtubule (MT) dynamics, and endosomal
          transport.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
