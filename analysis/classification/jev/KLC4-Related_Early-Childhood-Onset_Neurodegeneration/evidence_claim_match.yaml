            description: 'The principal in vivo model, and the source of essentially all of this entry''s
              cell biology. Live imaging in klc4 mutant embryos shows that KLC4 is required for stabilising
              nascent sensory axon branches, for normal microtubule dynamics and endosomal transport,
              and for the contact repulsion that keeps peripheral arbors tiled rather than fasciculated.
              Mutant larvae are hypersensitive to touch and mutant adults show anxiety-like behaviour.

              It is also the model that complicates the disease''s name: these fish are adult viable and
              show no signs of early neurodegeneration.'
            genes:
