        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: klc4_two_alleles_two_inheritance_modes
        kind: KNOWLEDGE_GAP
        prompt: 'KLC4 has two published patients: three siblings homozygous for a residue-277 truncation
          with early-childhood multisystem disease, and one man heterozygous for a residue-369 truncation
