  677fe431e9d5ddc6432c8691b0d05b412704b8a558d11d524689439c58879684:
    claim:
      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: PRKAG2 cardiac syndrome
        disease_term:
          preferred_term: PRKAG2 cardiac syndrome
          term:
            id: MONDO:0800484
            label: PRKAG2-related cardiomyopathy
        description: 'The classic glycogen-storage mimic of hypertrophic cardiomyopathy, and the entity
          that shares CMH29''s most distinctive histological feature. Cardiomyocyte polyglucosan bodies,
          PAS-positive and diastase-resistant, are found in both, so a pathologist reading a PAS-diastase
          stain cannot tell them apart. Everything upstream and downstream of that stain differs. PRKAG2
          encodes the gamma-2 regulatory subunit of AMP-activated protein kinase; dominant missense variants
          render the kinase constitutively active, which drives glucose uptake and glycogen synthesis
          and produces bulk non-lysosomal glycogen storage. The stored material is the primary lesion.
          In CMH29 the primary lesion is failure of intermediate filament turnover, the polyglucosan is
          secondary and unexplained, and the primary stored species is desmin protein rather than polysaccharide.

          The clinical separator is electrophysiological. PRKAG2 disease is defined by ventricular pre-excitation
          - accessory atrioventricular connections producing Wolff-Parkinson-White - with progressive
          atrioventricular block and pacemaker dependence. CMH29 has conduction-interval prolongation
          and malignant ventricular arrhythmia but no accessory pathways and no pre-excitation has been
          reported. An adult with hypertrophy plus a delta wave is PRKAG2 until proven otherwise; an adult
          with hypertrophy plus non-sustained ventricular tachycardia and unaffected parents who are first
          cousins is not.'
        distinguishing_features:
        - PRKAG2 cardiac syndrome is autosomal dominant with an affected parent in most families; CMH29
          is autosomal recessive with unaffected heterozygous parents and frequent parental consanguinity.
        - Ventricular pre-excitation (Wolff-Parkinson-White) and progressive atrioventricular block define
          PRKAG2 disease and have not been reported in CMH29.
        - PRKAG2 is one of the eight canonical muscle polyglucosan storage genes; KLHL24 is not, and was
          reached in the founding study only after that gene set was sequenced and excluded.
        - In PRKAG2 disease the stored polysaccharide sits in large isolated cytosolic vacuoles; in CMH29
          the polyglucosan is intermyofibrillar and accompanied by accumulated desmin filaments and sarcoplasmic-reticulum-derived
          tubules.
        - Desmin accumulation on immunohistochemistry and Western blot is characteristic of CMH29 and
          is not a feature of PRKAG2 disease.
        notes: 'MONDO:0800484 was verified with OAK: it carries `relationship: RO:0004003 HGNC:9386 !
          PRKAG2` and the synonym "PRKAG2 cardiac syndrome", and matches the disease_term already bound
          in `kb/disorders/PRKAG2_Cardiac_Syndrome.yaml`. That file was read for scoping and was not modified.
          Its NEC note records that MONDO:0859372 was incorrectly proposed as its target; this entry is
          the correct home for that identifier.'
      selected_evidence:
        snippet: in which hypertrophy, ventricular pre-excitation and conduction system defects coexist
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
