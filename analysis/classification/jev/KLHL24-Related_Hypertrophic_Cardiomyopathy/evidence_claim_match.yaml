            description: 'This is the node that determines prognosis, and it is the feature that most
              distinguishes CMH29 from ordinary hypertrophic cardiomyopathy. Three of the 11 young adults
              in the founding cohort died suddenly, at ages 20, 26 and 26; several others received implantable
              cardioverter-defibrillators in their twenties or thirties. Electrocardiography in the founding
              families showed generalised ST-T change, QRS durations at or above the upper limit of normal
              (120, 125 and 154 ms in the three individuals with a recorded value), one prolonged PR interval
              of 210 ms, and frequent episodes of non-sustained ventricular tachycardia in one individual
              - a pattern of both conduction-system involvement and ventricular ectopy. The other three
              recorded PR intervals were 186, 188 and 194 ms, so PR prolongation is not a consistent feature
              and should not be used as a diagnostic pointer. The arrhythmic risk is disproportionate
              to structural severity and can precede it, which is a genuine departure from the standard
              HCM risk model.

