              network normally couples the sarcolemma, Z-disc and intercalated disc, and its disorganisation
              disturbs both mechanical coupling and, plausibly, the sarcoplasmic reticulum-dependent calcium
              handling that underlies the cardiac action potential. That mechanistic account is stated
