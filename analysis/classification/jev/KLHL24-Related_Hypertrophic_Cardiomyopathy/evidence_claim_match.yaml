          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Skeletal Muscle Cogwheel Fibre Pathology
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'KLHL24 is expressed more highly in skeletal muscle than in heart, and skeletal muscle
          in CMH29 is unambiguously abnormal - yet it is clinically silent. Muscle biopsies from three
          individuals across both founding families showed focal subsarcolemmal and intermyofibrillar
          accumulation of glycogen and desmin, distributed so as to give the fibre periphery a jagged
          outline that the authors named the "cogwheel" fibre and proposed as a diagnostic marker. Both
          type 1 and type 2 fibres were affected. Against this, no individual had muscle weakness or wasting
          and nerve conduction studies were normal.

          This dissociation is one of the two central unexplained features of the disease, alongside the
          polyglucosan, and it is why this node sits outside the causal chain to the cardiac phenotype
          rather than upstream of it. Its practical value is diagnostic: a skeletal muscle biopsy in a
          young adult with unexplained hypertrophic cardiomyopathy is low-morbidity relative to endomyocardial
          biopsy and, if the cogwheel pattern is present, points directly at this gene.'
        cell_types:
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        notes: The term "cogwheel" fibre, the type 1 and type 2 fibre involvement, the proposal of the
          pattern as a diagnostic marker, and the explicit statement that no muscular atrophy or weakness
          was found and nerve conduction studies were normal are all in the full text of PMID:30715372
          (PMC6812045, read 2026-08-01). None is in the cached abstract. The HPO annotation file for OMIM:620236
          independently records Muscle weakness (HP:0001324) at 0/8, corroborating the absence of weakness.
      selected_evidence:
        snippet: Endomyocardial and skeletal muscle biopsies from affected individuals of both families
          demonstrated characteristic alterations, including accumulation of desmin intermediate filaments.
        supports: SUPPORT
