  d35e3046b82aba8a4ca7b58bc43ac29aa7ea1a1f644dd4f85f5ac95160dfb875:
    claim:
      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intermyofibrillar Glycogen and Polyglucosan Storage
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'Alongside the accumulated filaments, the intermyofibrillar space of CMH29 cardiomyocytes
          fills with glycogen and with discrete polyglucosan bodies - periodic-acid-Schiff-positive material
          that resists alpha-amylase digestion, identifying it as the amylopectin-like, poorly branched,
          poorly soluble polysaccharide called polyglucosan rather than as ordinary glycogen. Skeletal
          muscle shows the same focal subsarcolemmal and intermyofibrillar glycogen accumulation.

          This node is deliberately marked HYPOTHETICAL, because its mechanism is genuinely unknown and
          the founding authors say so. Cardiomyopathies with polyglucosan accumulation are otherwise essentially
          confined to disorders of glycogen metabolism, and eight genes are canonically associated with
          muscle polyglucosan storage - GYG1, GBE1, RBCK1, PFKM, EPM2A, EPM2B, PRDM8 and PRKAG2. None
          of those was mutated in the founding families; a dedicated nine-gene polyglucosan-storage panel
          was screened and excluded before KLHL24 was reached. KLHL24 has no known role in glycogen metabolism,
          and no experiment has connected loss of its ligase-adaptor function to polysaccharide handling.
          Three explanations remain open and are set out in the knowledge-gap discussion below. Until
          one is demonstrated, the polyglucosan is curated as a reproducible diagnostic marker of the
          disease and as an unexplained co-occurrence, not as a step in the causal chain.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        chemical_entities:
        - preferred_term: polyglucosan (amylopectin-like polysaccharide)
          modifier: INCREASED
          term:
            id: CHEBI:28057
            label: amylopectin
        - preferred_term: glycogen
          modifier: INCREASED
          term:
            id: CHEBI:28087
            label: glycogen
        biological_processes:
        - preferred_term: glycogen metabolic process
          modifier: ABNORMAL
          term:
            id: GO:0005977
            label: glycogen metabolic process
        notes: The PAS and PAS-diastase histochemistry, the electron microscopy, the exclusion of the
          nine-gene polyglucosan panel, and the authors' statement that "the pathogenesis of the polyglucosan
          storage in our patients remains unknown but may serve as a diagnostic marker" are all in the
          full text of PMID:30715372 (PMC6812045, read 2026-08-01). Only the abstract of that paper is
          cached, and the abstract does not mention polyglucosan at all, so none of this is quotable and
          all of it is recorded as notes. A PubMed search for `KLHL24 AND polyglucosan` on 2026-08-01
          returned zero records, which is a direct measure of how little attention this feature has had
          since 2019 despite naming the OMIM entity.
      selected_evidence:
        snippet: Mutations in eight human genes are known to be associated with polyglucosan storage involving
          muscle, namely GYG1, GBE1, RBCK1 (HOIL-1), PFKM, EPM2A, EPM2B (NHLRC1), PRDM8, and PRKAG2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26278982
      reference_title: Polyglucosan storage myopathies.
      evidence_source: OTHER
      explanation: Enumerates the canonical polyglucosan-storage gene set, written by the same group that
        later described CMH29. KLHL24 is absent from it, which is what makes the polyglucosan in this
        disease anomalous rather than expected.
