        context: []
      assertion_type: Phenotype
      assertion:
        name: Hypertrophic cardiomyopathy
        category: Cardiovascular
        diagnostic: true
        description: 'Unexplained left ventricular hypertrophy is the presenting and defining phenotype.
          The morphology is that of classical hypertrophic cardiomyopathy - a thick-walled, small-cavity
          ventricle with preserved or supranormal ejection fraction early on - which is why the disease
          is diagnosed as sarcomeric HCM until sequencing says otherwise. Reported wall thicknesses reach
          extremes: septal thickness of 4.0 cm in one founding-family individual and interventricular
          septal thickness of 38 to 42 mm in an independently reported adolescent.

          Onset is characteristically in the late teens to late twenties. Recorded ages of onset in the
          founding families were 16, 19, 21, 24 and 28 years, and independently reported probands presented
          at 16, 18 and 20. The combination of a young age at presentation, severe hypertrophy and no
          dominant family history is the clinical signature that should prompt consideration of a recessive
          non-sarcomeric gene.'
        phenotype_term:
          preferred_term: Hypertrophic cardiomyopathy
          term:
            id: HP:0001639
            label: Hypertrophic cardiomyopathy
          clinical_course: PROGRESSIVE
          onset:
            onset_category: YOUNG_ADULT
            min_age_years: 16.0
            max_age_years: 28.0
            notes: The HPO annotation file for OMIM:620236 records Young adult onset (HP:0011462) at 5/5,
              sourced to PMID:30715372 (retrieved 2026-08-01) - that is, in every individual for whom
              an age of onset was determinable. The 16 to 28 year range comes from the founding cohort's
              clinical table (PMC6812045, read 2026-08-01) together with the more recent reports, two
              of which describe presentations at 16 and 18 years. Those are adolescent rather than young
              adult, so the HPO category may narrow the true onset window.
        notes: No FrequencyEnum band is asserted; see the entry-level notes. The wall thickness figures
          are from the clinical tables in the full text of PMID:30715372 (PMC6812045, read 2026-08-01)
          and from the cached full text of PMID:42158087 respectively.
      selected_evidence:
        snippet: Here, we show that mutations in KLHL24 cause HCM in humans.
        supports: SUPPORT
