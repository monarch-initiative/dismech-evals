  61812ed2108529a13b7c724d52846a64493c0e1564d78a33de81ce3a2e243ce4:
    claim:
      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'CMH29 requires two damaged KLHL24 alleles. The founding report identified homozygous
          variants in two consanguineous families and showed that the parents of affected individuals
          were heterozygous carriers and unaffected; an additional branch of the Iranian family independently
          produced a homozygous affected offspring of heterozygous parents, which is what established
          the recessive pattern rather than assumed it. Subsequent families confirm the same architecture
          in a non-consanguineous setting: a Chinese sibship carried compound heterozygous variants inherited
          one from each clinically asymptomatic parent, and an Indian case carried compound heterozygous
          truncating variants with no family history of hypertrophic cardiomyopathy.

          This is the point of greatest clinical consequence in the entry. Because the disease is recessive
          and the parents are unaffected, a young adult with unexplained septal hypertrophy and no family
          history is exactly the presentation in which a dominant sarcomeric aetiology is assumed and
          in which KLHL24 will be missed unless the panel includes it. Penetrance in biallelic individuals
          appears complete on the evidence available - every reported homozygote or compound heterozygote
          had a demonstrable cardiac phenotype - but the total number of biallelic individuals ever described
          is small enough that this should be read as an absence of counterexamples rather than as a penetrance
          estimate. Heterozygous carriers are not reported to be affected, and no carrier phenotype has
          been sought systematically.

          Provenance for this assertion. The HPO annotation file for OMIM:620236 records HP:0000007 sourced
          to PMID:30715372 (retrieved 2026-08-01), and the ClinGen Hereditary Cardiovascular Disease Gene
          Curation Expert Panel curated the KLHL24 gene-disease relationship specifically under an AR
          mode of inheritance. No dominant mode of inheritance is asserted for this entity; the dominant
          KLHL24 disease is the allelic skin disorder EBS6 (MONDO:0015006), curated below as a differential.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: KLHL24 | HGNC:25947 | hypertrophic cardiomyopathy | MONDO:0005045 | AR | Moderate
        supports: SUPPORT
