        context: []
      assertion_type: Diagnosis
      assertion:
        name: Echocardiography with family cascade screening
        description: 'Echocardiography establishes the structural phenotype - septal thickness, cavity
          size, systolic anterior motion, outflow gradient, diastolic function - and is the screening
          test for at-risk relatives. Because inheritance is recessive, cascade screening targets siblings,
          who carry a one-in-four risk, rather than the parents and offspring who are the focus in dominant
          hypertrophic cardiomyopathy. The screening yield is high and the finding can be dramatic in
          someone who reports no symptoms at all: in one reported sibship the asymptomatic younger brother,
          found on family screening, had interventricular septal thickness of 38 to 42 mm.'
      selected_evidence:
        snippet: biallelic pathogenic variants can be misleading, as severe structural and subclinical
          functional heart disease may already be present, necessitating pre-symptomatic diagnosis and
          management.
        supports: SUPPORT
