          The dominant skin alleles, by contrast, are confined to the translation initiation codon and
          its immediate vicinity - c.1A>G, c.1A>T, c.2T>C, c.2T>G, c.3G>A, c.3G>C, c.3G>T - plus, as later
          shown, any nonsense-inducing change in c.4_84 that permits translation re-initiation at Met29.
          The rule is therefore positional as well as functional: variants that abolish the normal start
          codon and allow re-initiation produce a stabilised, hyperactive KLHL24-deltaN28 and dominant
          disease; variants that damage the body of the protein produce a dead adaptor and recessive disease.
          A diagnostic laboratory reporting a KLHL24 variant cannot assign a phenotype from the gene alone,
          and must read the position and the zygosity.

          Gene-disease validity. ClinGen''s Hereditary Cardiovascular Disease Gene Curation Expert Panel
          classified KLHL24 as MODERATE for hypertrophic cardiomyopathy under autosomal recessive inheritance
          in September 2023, and the panel''s 2025 reappraisal publication lists KLHL24 among the newly
          curated genes reaching moderate evidence. Moderate, not definitive or strong, is the honest
          state of this gene: the human genetic evidence is several small families and the experimental
          evidence is a zebrafish morpholino knockdown with allele-specific rescue failure. That is enough
          to justify including KLHL24 on a hypertrophic cardiomyopathy panel and reporting biallelic loss-of-function
          variants, and not enough to treat a single biallelic finding as diagnostic without phenotype
          correlation.

          Not asserted, deliberately. No gnomAD constraint metric (pLI, o/e LoF, missense Z) is recorded
          anywhere in this entry, because none was retrieved from a primary source during this curation.
          The founding paper''s Residual Variation Intolerance Score is recorded in the pathophysiology
          notes with its source rather than restated as a constraint claim. No founder allele, modifier
          locus, methylation episignature, digenic contribution or somatic mechanism has been described
          for this disease and none is asserted.'
      selected_evidence:
        snippet: variants in several additional genes (ACTN2, ALPK3, CSRP3, FHOD3, FLNC, JPH2, KLHL24,
          PLN and TRIM63), encoding non-sarcomeric proteins with diverse functions, have been shown to
          be disease-causing in a small number of patients
        supports: SUPPORT
