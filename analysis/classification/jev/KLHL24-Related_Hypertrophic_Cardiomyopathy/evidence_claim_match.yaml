      reference_title: 'Novel compound heterozygous mutations in KLHL24-induced recessive inherited hypertrophic
        cardiomyopathy: a case report.'
      evidence_source: HUMAN_CLINICAL
      explanation: Documents that a conventional hypertrophic cardiomyopathy gene panel was uninformative
        and that only KLHL24 segregated, which is the argument for including the gene on panels and for
        reflex exome sequencing.
