            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Desmin Intermediate Filament Turnover
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Desmin is the muscle-specific type III intermediate filament that links adjacent
          Z-discs to each other, to the sarcolemma at costameres, and to mitochondria and nuclei, transmitting
          force laterally and maintaining myofibrillar register. It is a dynamic polymer whose subunits
          are continuously exchanged, and that exchange requires a route for disposal of displaced subunits.
          KLHL24 supplies that route in muscle: it is the cardiac and skeletal-muscle counterpart of the
          KLHL24-keratin-14 relationship characterised in basal keratinocytes, desmin standing to the
          myocyte as keratin-14 stands to the keratinocyte.

          In KLHL24-null myocytes the polymer is not disposed of. Immunohistochemistry on heart and skeletal
          muscle from the founding families showed desmin accumulating in the intermyofibrillar and subsarcolemmal
          spaces, electron microscopy resolved irregularly arranged 8-12 nm filaments in the same compartment,
          and Western blotting showed desmin markedly upregulated in both tissues relative to controls.
          This is the inverse of the lesion in KLHL24 gain-of-function disease, in which desmin is depleted
          roughly tenfold in patient-derived engineered heart tissue and in explanted myocardium. The
          same protein pair therefore produces two cardiomyopathies of opposite morphology depending on
          the direction in which turnover fails.'
        genes:
        - preferred_term: DES
          term:
            id: hgnc:2770
            label: DES
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        cellular_components:
        - preferred_term: desmin intermediate filament
          modifier: INCREASED
          term:
            id: GO:0005882
            label: intermediate filament
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
        biological_processes:
        - preferred_term: intermediate filament cytoskeleton organization
          modifier: ABNORMAL
          term:
            id: GO:0045104
            label: intermediate filament cytoskeleton organization
        notes: 'The immunohistochemistry, the 8-12 nm filament measurement, and the desmin immunoblot
          are in the full text and figures of PMID:30715372 (PMC6812045, read 2026-08-01) and not in the
          cached abstract, so they are described here rather than quoted. The immunoblot comparison carries
          a caveat the paper itself states in the Figure 5 legend: control 3 is a normal heart, whereas
          control 4 is a heart explant from a patient with a different cardiomyopathy "with an expected
          moderate upregulation of desmin". The assay therefore reads against both a normal and a failing-myocardium
          baseline, and the second of those is not a desmin-normal comparator.'
      selected_evidence:
        snippet: including desmin—the cardiac homolog of keratin-14
        supports: SUPPORT
