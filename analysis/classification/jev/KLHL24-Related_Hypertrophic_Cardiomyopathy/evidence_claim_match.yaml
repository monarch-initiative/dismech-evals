  61f422f28c642ec131172a22c8e179ad04b2b5105dc1d070e347df639ccc4b77:
    claim:
      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Epidermolysis bullosa simplex 6, generalized, with scarring and hair loss
        disease_term:
          preferred_term: epidermolysis bullosa simplex 6, generalized, with scarring and hair loss
          term:
            id: MONDO:0015006
            label: epidermolysis bullosa simplex 6, generalized, with scarring and hair loss
        description: The allelic disorder, and the most informative entry in this list. The same gene,
          mutated at its translation initiation codon rather than in its body, causes a dominant disease
          of skin fragility with scarring alopecia and DILATED cardiomyopathy. The mechanism is the mirror
          image of this entity's. Loss of the first 28 amino acids by translation re-initiation at Met29
          produces KLHL24-deltaN28, which escapes the autoubiquitination that normally limits KLHL24's
          own half-life; the stabilised adaptor then hyperdegrades its substrates - keratin 14 and other
          keratins in basal keratinocytes, desmin, synemin and vimentin in cardiac cells. Where CMH29
          accumulates intermediate filament, EBS6 destroys it; where CMH29 gives a thick-walled small-cavity
          ventricle, EBS6 gives a thin-walled dilated one. A clinician will never confuse the two at the
          bedside - one has blistering from birth, the other has no skin findings at all - but a laboratory
          reading a KLHL24 variant absolutely can, and that is why this differential is here.
        distinguishing_features:
        - EBS6 is autosomal dominant and often de novo; CMH29 is autosomal recessive, so zygosity alone
          separates them in most cases.
        - EBS6 alleles are confined to the translation initiation codon and to nonsense-inducing changes
          in c.4_84 that permit re-initiation; CMH29 alleles lie in the BACK and Kelch domains.
        - EBS6 is a gain-of-function mechanism producing substrate depletion; CMH29 is loss of function
          producing substrate accumulation.
        - The cardiomyopathy of EBS6 is dilated; that of CMH29 is hypertrophic with a small cavity.
        - EBS6 presents at birth with extensive skin denudation and later scarring alopecia; no individual
          with biallelic KLHL24 variants has had any skin abnormality, and family members of CMH29 probands
          screened for skin symptoms were normal.
        notes: 'MONDO:0015006 was verified with OAK: `runoak -i sqlite:obo:mondo info MONDO:0015006 -O
          obo` returns xref OMIM:617294, `is_a MONDO:0000426` (autosomal dominant disease), `is_a MONDO:0017610`
          (epidermolysis bullosa simplex) and `relationship: RO:0004003 HGNC:25947 ! KLHL24` - the same
          gene as this entry, which is what makes it allelic. The dismech entry `kb/disorders/Epidermolysis_Bullosa_Simplex.yaml`
          covers this disease as part of the broader EBS entity and was not modified.'
      selected_evidence:
        snippet: monoallelic mutations, c.1A>G and c.2T>C, in the translation initiation codon of the
          gene encoding kelch-like protein 24 (KLHL24) in 14 individuals with a distinct skin-fragility
          phenotype and skin cleavage within basal keratinocytes
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27889062
      reference_title: Monoallelic Mutations in the Translation Initiation Codon of KLHL24 Cause Skin
        Fragility.
      evidence_source: HUMAN_CLINICAL
      explanation: Independently establishes that the skin disease alleles are monoallelic and confined
        to the initiation codon, in direct contrast to the biallelic body-of-gene alleles of CMH29.
