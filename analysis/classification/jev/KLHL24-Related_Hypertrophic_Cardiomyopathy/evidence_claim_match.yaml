        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Sarcomeric hypertrophic cardiomyopathy
        disease_term:
          preferred_term: familial hypertrophic cardiomyopathy
          term:
            id: MONDO:0024573
            label: familial hypertrophic cardiomyopathy
        description: The default diagnosis, the parent term of this entity in MONDO, and the label almost
          every CMH29 patient carries before sequencing. Sarcomeric HCM is dominant, caused by variants
          in MYH7, MYBPC3 and the other sarcomere-protein genes, and accounts for the large majority of
          familial hypertrophic cardiomyopathy; the genetic cause of up to 50 percent of clinically diagnosed
          HCM nevertheless remains unknown, and CMH29 lives in that unexplained fraction. The echocardiographic
          appearances overlap completely. What separates them is the pedigree, the histology and the gene.
        distinguishing_features:
        - Sarcomeric HCM is autosomal dominant with a vertically transmitted family history; CMH29 is
          recessive, so unaffected parents and affected siblings are the expected pattern.
        - Myocyte and myofibrillar disarray is the pathognomonic histology of sarcomeric HCM and is not
          what CMH29 biopsies show.
        - Polyglucosan bodies, desmin accumulation and intermyofibrillar glycogen are not features of
          sarcomeric HCM.
        - Skeletal muscle histology is normal in sarcomeric HCM and abnormal, though clinically silent,
          in CMH29.
        - Arrhythmic risk in sarcomeric HCM tracks conventional risk markers reasonably well; in CMH29
          malignant arrhythmia may precede structural severity, so those markers underestimate risk.
        notes: MONDO:0024573 was verified with OAK and is the asserted MONDO parent of MONDO:0859372.
          `kb/disorders/Hypertrophic_Cardiomyopathy.yaml` is the dismech entry covering sarcomeric HCM;
          it lists KLHL24 as a panel gene and quotes the same ClinGen assertion cited here, and it was
          not modified.
      selected_evidence:
        snippet: Hypertrophic cardiomyopathy (HCM) is the most common inherited cardiovascular disorder,
          yet the genetic cause of up to 50% of cases remains unknown.
        supports: SUPPORT
