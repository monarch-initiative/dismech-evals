      assertion:
        name: Loss of CUL3-KLHL24 Substrate Adaptor Function
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'KLHL24 is a BTB-BACK-Kelch protein. Its BTB and BACK domains dock onto CUL3, and
          its C-terminal six-bladed Kelch beta-propeller selects substrates; the assembled CUL3-RBX1-KLHL24
          complex then transfers ubiquitin onto those substrates and commits them to the 26S proteasome.
          KLHL24 is not a housekeeping component of that machinery but a specificity module: which proteins
          are degraded depends on which Kelch adaptor is loaded. Losing KLHL24 therefore does not impair
          ubiquitination in general - it removes one branch of substrate selection, which is why the disease
          is tissue-restricted despite the ubiquity of the proteasome. KLHL24 is most highly expressed
          in skeletal muscle, then lung, then left ventricle, so the branch that is lost is the one that
          operates in striated muscle.'
