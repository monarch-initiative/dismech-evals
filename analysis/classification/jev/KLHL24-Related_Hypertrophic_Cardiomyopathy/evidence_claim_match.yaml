            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context:
        - path: /pathophysiology/3
          value:
            name: Intermyofibrillar Glycogen and Polyglucosan Storage
            biological_scale: MOLECULAR
            mechanism_confidence: HYPOTHETICAL
            description: 'Alongside the accumulated filaments, the intermyofibrillar space of CMH29 cardiomyocytes
              fills with glycogen and with discrete polyglucosan bodies - periodic-acid-Schiff-positive
              material that resists alpha-amylase digestion, identifying it as the amylopectin-like, poorly
              branched, poorly soluble polysaccharide called polyglucosan rather than as ordinary glycogen.
              Skeletal muscle shows the same focal subsarcolemmal and intermyofibrillar glycogen accumulation.

              This node is deliberately marked HYPOTHETICAL, because its mechanism is genuinely unknown
              and the founding authors say so. Cardiomyopathies with polyglucosan accumulation are otherwise
              essentially confined to disorders of glycogen metabolism, and eight genes are canonically
              associated with muscle polyglucosan storage - GYG1, GBE1, RBCK1, PFKM, EPM2A, EPM2B, PRDM8
              and PRKAG2. None of those was mutated in the founding families; a dedicated nine-gene polyglucosan-storage
              panel was screened and excluded before KLHL24 was reached. KLHL24 has no known role in glycogen
              metabolism, and no experiment has connected loss of its ligase-adaptor function to polysaccharide
              handling. Three explanations remain open and are set out in the knowledge-gap discussion
              below. Until one is demonstrated, the polyglucosan is curated as a reproducible diagnostic
              marker of the disease and as an unexplained co-occurrence, not as a step in the causal chain.'
            cell_types:
            - preferred_term: Cardiomyocyte
              term:
                id: CL:0000746
                label: cardiac muscle cell
            chemical_entities:
            - preferred_term: polyglucosan (amylopectin-like polysaccharide)
              modifier: INCREASED
              term:
                id: CHEBI:28057
                label: amylopectin
            - preferred_term: glycogen
              modifier: INCREASED
              term:
                id: CHEBI:28087
                label: glycogen
            biological_processes:
            - preferred_term: glycogen metabolic process
              modifier: ABNORMAL
              term:
                id: GO:0005977
                label: glycogen metabolic process
            notes: The PAS and PAS-diastase histochemistry, the electron microscopy, the exclusion of
              the nine-gene polyglucosan panel, and the authors' statement that "the pathogenesis of the
              polyglucosan storage in our patients remains unknown but may serve as a diagnostic marker"
              are all in the full text of PMID:30715372 (PMC6812045), whose full text is now cached. The
              abstract does not mention polyglucosan at all; these findings are in the results, figures
              and discussion, and are recorded as notes here rather than as evidence items. A PubMed search
              for `KLHL24 AND polyglucosan` on 2026-08-01 returned zero records, which is a direct measure
              of how little attention this feature has had since 2019 despite naming the OMIM entity.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Cardiac polyglucosan accumulation
        description: Amylase-resistant polyglucosan bodies within cardiomyocytes are the entity-defining
          readout of this node.
