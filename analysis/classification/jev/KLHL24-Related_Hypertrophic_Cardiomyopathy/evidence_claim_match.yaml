      assertion:
        name: Loss of CUL3-KLHL24 Substrate Adaptor Function
        conforms_to: cul3_substrate_adaptor_dysfunction#CUL3 Scaffold or BTB Substrate Adaptor Lesion
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'KLHL24 is a BTB-BACK-Kelch protein. Its BTB and BACK domains dock onto CUL3, and
          its C-terminal six-bladed Kelch beta-propeller selects substrates; the assembled CUL3-RBX1-KLHL24
          complex then transfers ubiquitin onto those substrates and commits them to the 26S proteasome.
          KLHL24 is not a housekeeping component of that machinery but a specificity module: which proteins
          are degraded depends on which Kelch adaptor is loaded. Losing KLHL24 therefore does not impair
          ubiquitination in general - it removes one branch of substrate selection, which is why the disease
          is tissue-restricted despite the ubiquity of the proteasome. KLHL24 is most highly expressed
          in skeletal muscle, then lung, then left ventricle, so the branch that is lost is the one that
          operates in striated muscle.'
        genes:
        - preferred_term: KLHL24
          term:
            id: hgnc:25947
            label: KLHL24
        - preferred_term: CUL3
          term:
            id: hgnc:2553
            label: CUL3
        protein_complexes:
        - preferred_term: CUL3-RBX1-KLHL24 E3 ubiquitin ligase
          modifier: DECREASED
          term:
            id: GO:0031463
            label: Cul3-RING ubiquitin ligase complex
        molecular_functions:
        - preferred_term: ubiquitin-protein transferase activity
          modifier: DECREASED
          term:
            id: GO:0004842
            label: ubiquitin-protein transferase activity
        biological_processes:
        - preferred_term: substrate polyubiquitination by the CUL3-KLHL24 ligase
          modifier: DECREASED
          term:
            id: GO:0000209
            label: protein polyubiquitination
        - preferred_term: proteasomal degradation of KLHL24 substrates
          modifier: DECREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
        notes: 'The tissue-expression ranking (skeletal muscle > lung > left ventricle, GTEx v6p) is reported
          in the full text of PMID:30715372 (PMC6812045, now cached) and is recorded here rather than
          quoted; it has not yet been added as an evidence item. Note that this expression pattern is
          itself part of the disease''s unexplained anatomy: the tissue with the highest expression, skeletal
          muscle, is the one that is histologically abnormal but clinically silent.'
      selected_evidence:
        snippet: KLHL24 is a component of the ubiquitin-proteasome system and acts as a substrate-specific
          adaptor protein for E3 ubiquitin ligase.
        supports: SUPPORT
