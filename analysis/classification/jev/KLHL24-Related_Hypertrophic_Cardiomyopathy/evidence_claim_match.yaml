  5294aa418c732b7fe00439cc1ae3776bdbeb3b10488dc488be7adb9139954507:
    claim:
      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Danio rerio
        genotype: klhl24a splice-blocking antisense morpholino knockdown (morphant; no stable mutant line
          reported)
        category: Transient loss-of-function knockdown model
        description: 'The only in vivo model of this disorder, and it is a transient morpholino knockdown
          rather than a germline mutant - a distinction that limits how much weight it can carry. Zebrafish
          have two KLHL24 orthologues; klhl24a is expressed in the cardiac cone at 22 hours post fertilisation
          and in the ventricle at 72 hours, whereas klhl24b is not expressed in the developing heart,
          so the cardiac arm of the gene family is klhl24a. Knockdown produced pericardial oedema, altered
          heart rate and reduced circulation from 48 hours, progressing to ventricular failure and blocked
          circulation in about 90 percent of morphants against 4 percent of controls. A second, independently
          targeted morpholino reproduced the phenotype, and co-injection of wild-type klhl24a mRNA partially
          rescued it, which are the two standard specificity controls.

          The experiment that matters most for this entry is the allele test. Zebrafish klhl24a mRNA carrying
          the residues equivalent to the two human CMH29 alleles failed to rescue, giving heart defects
          in 71.5 and 77.5 percent of embryos respectively. That is the direct functional evidence that
          p.Arg306His and p.Glu350* are loss-of-function alleles rather than dominant-negatives or benign
          variants.

          Its limitations are substantial and are the reason a knowledge gap is recorded below. The model
          is a knockdown, not a biallelic point-mutant; it reports on cardiac development in the embryo
          rather than on adult-onset hypertrophy; desmin protein levels were unchanged in morphants at
          52 hours, which the authors attribute to the short experimental window; and it produces ventricular
          failure rather than the hypertrophy, polyglucosan storage or arrhythmia that define the human
          disease.

          Provenance and caveats. The morpholino doses, the second morpholino, the RT-PCR confirmation
          of exon 3 skipping, the rescue percentages, the allele-specific rescue failure percentages and
          the unchanged morphant desmin immunoblot are all in the full text and figures of PMID:30715372
          (PMC6812045, now cached), and are described here rather than quoted; much of the detail is in
          the figures. Morpholino knockdowns are subject to well-documented off-target and p53-mediated
          artefacts; the second-morpholino and mRNA-rescue controls reported here mitigate but do not
          eliminate that concern. No mouse model of KLHL24 loss of function was found during this curation.'
        associated_phenotypes:
        - Pericardial oedema
        - Altered heart rate
        - Ventricular failure with blocked circulation
        - Failure of rescue by mRNA carrying human CMH29 alleles
      selected_evidence:
        snippet: Knock-down of the zebrafish homologue klhl24a results in heart defects similar to that
          described for other HCM-linked genes providing additional support for KLHL24 as a HCM-associated
          gene.
        supports: SUPPORT
