      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing with biallelic KLHL24 variant interpretation
        description: 'Molecular diagnosis rests on identifying biallelic KLHL24 variants against transcript
          NM_017644.3, with parental testing to confirm that compound heterozygous variants are in trans.
          Three interpretive points follow from the published genotype-phenotype pattern. First, KLHL24
          must actually be on the panel: the founding families were solved only after an 88-gene inherited-cardiac-conditions
          panel and a 9-gene polyglucosan-storage panel had both come back negative, and the most recent
          reported sibship was likewise negative across a conventional hypertrophic cardiomyopathy gene
          panel - MYH7, MYBPC3, TNNT2, TNNI3, MYL2, MYL3, TPM1, ACTC1, TNNC1, JPH2, PRKAG2, GLA, LAMP2,
          RYR2, DSP, FLNC, MYPN, CSRP3, TCAP, ZASP and others - before exome sequencing found KLHL24.
          Second, a single heterozygous KLHL24 variant does not explain a hypertrophic cardiomyopathy
          phenotype and should not be reported as though it did; the disease is recessive. Third, position
          matters as much as consequence - an initiation-codon variant is the dominant skin-and-dilated-cardiomyopathy
          allele, not this disease. For a young adult with severe unexplained hypertrophy, no dominant
          family history and a negative sarcomere panel, reanalysis or reflex exome sequencing is the
          appropriate next step.'
      selected_evidence:
        snippet: only compound heterozygous KLHL24 variants segregated with the disease phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
