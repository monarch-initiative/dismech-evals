      assertion_type: Pathophysiology
      assertion:
        name: Cardiomyocyte Hypertrophy and Concentric Left Ventricular Remodelling
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'The myocyte enlarges. The founding heart explant and endomyocardial biopsies showed
          myocyte hypertrophy, and the HPO annotation set records cardiomyocyte hypertrophy in both individuals
          examined histologically. At organ level this produces the picture that brings patients to attention:
          severe septal thickening, a small left ventricular cavity, a reduced left ventricular end-systolic
          diameter, systolic anterior motion of the mitral valve and dynamic left ventricular outflow
          tract obstruction, with ejection fraction preserved or supranormal early on.

          Two things distinguish this hypertrophy from sarcomeric HCM. First, part of the wall thickness
          is storage rather than contractile mass - accumulated filaments, polysaccharide and membrane
          occupy the intermyofibrillar space. Second, myofibre disarray, the histological hallmark of
          sarcomeric HCM, is not what the biopsies show; what they show is intermyofibrillar accumulation.
          The clinical phenotype is nevertheless indistinguishable at the echocardiogram, which is precisely
          why the disease is missed.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: cardiac muscle hypertrophy
          modifier: INCREASED
          term:
            id: GO:0003300
            label: cardiac muscle hypertrophy
        locations:
        - preferred_term: interventricular septum
          term:
            id: UBERON:0002094
            label: interventricular septum
        - preferred_term: left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
        notes: The per-individual echocardiographic measurements - septal wall thickness from 0.9 to 4.0
          cm, left ventricular end-diastolic volumes as low as 30 mL, outflow gradients of 48 and 112
          mmHg - are tabulated in the full text of PMID:30715372 (PMC6812045, read 2026-08-01) and are
          not quotable from the cached abstract. They are cited here as the source of the "small cavity,
          thick wall" description rather than reproduced as asserted figures.
      selected_evidence:
        snippet: Imaging revealed asymmetric septal hypertrophy with minimal fibrosis and preserved systolic
          function.
        supports: SUPPORT
