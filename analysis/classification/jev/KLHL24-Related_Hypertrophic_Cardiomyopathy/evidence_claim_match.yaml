  128b2a365838f9ff1f3aa08affca239660aad1e797a5e5a5c4ab7cb23e997526:
    claim:
      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Myocardial Fibrosis and Focal Macrophage Infiltration
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'The CMH29 heart develops patchy interstitial fibrosis, and the founding explant
          showed small CD68-positive macrophage infiltrates that were preferentially associated with polyglucosan-containing
          myocytes. That spatial association suggests the inclusions themselves recruit the infiltrate
          - an inclusion-triggered innate response rather than a diffuse inflammatory cardiomyopathy -
          but the observation is from one explanted heart and has not been replicated. The extent of fibrosis
          is variable: the founding explant showed patchy scar, one independently reported adolescent
          had minimal fibrosis despite severe hypertrophy, while another young adult had extensive late-gadolinium-enhancement-positive
          septal scar. Fibrosis burden therefore does not track hypertrophy severity in this disease,
          which is one reason conventional imaging-based risk scores behave poorly in it.'
        cell_types:
        - preferred_term: cardiac fibroblast
          term:
            id: CL:0002548
            label: fibroblast of cardiac tissue
        - preferred_term: CD68-positive macrophage
          term:
            id: CL:0000235
            label: macrophage
        notes: The CD68 immunostaining, the van Gieson-stained patchy fibrosis and the association of
          macrophage infiltrates with polyglucosan-containing myocytes are in the full text and figures
          of PMID:30715372 (PMC6812045, now cached), and are described here rather than quoted. The contrasting
          extensive-scar case is in the cached full text of PMID:42158087, which reports multifocal mid-wall
          late gadolinium enhancement in the septum of the younger sibling; the exact wording there contains
          PDF ligature artefacts, so it is described rather than quoted.
      selected_evidence:
        snippet: Imaging revealed asymmetric septal hypertrophy with minimal fibrosis and preserved systolic
          function.
        supports: SUPPORT
