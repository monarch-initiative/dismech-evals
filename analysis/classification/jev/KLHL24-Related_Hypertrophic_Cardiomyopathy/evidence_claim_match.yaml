              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: No prevalence or incidence estimate of any kind has been published for CMH29, and the 2026
          case report cited below states that plainly. The total published experience consists of the
          two founding consanguineous families (11 young affected adults ascertained, of whom 8 are tabulated
          with clinical detail), plus four subsequent families - a Middle Eastern consanguineous family
          in a recessive-cardiomyopathy exome series, a Brazilian consanguineous family with two affected
          sisters, a non-consanguineous sibship of two reported from China, and a single adolescent reported
          from India. `NOT_YET_DOCUMENTED` is used rather than a qualitative band because there is no
          source to band, and `rate_per_100000` is deliberately left empty. Ascertainment to date is heavily
          weighted towards consanguineous populations and towards centres running broad exome-based cardiomyopathy
          panels, so the geographic distribution of reports reflects how the disease is found rather than
          where it occurs. Note that the last two reports state only the reporting centre, not the family's
          ancestry; see the ancestry-versus-reporting-centre note in the entry description.
      selected_evidence:
        snippet: Of the 11 young affected adults identified, 3 died suddenly and 1 had a cardiac transplant
          due to heart failure.
        supports: SUPPORT
