    evidence_metadata:
      reference: PMID:41348940
      reference_title: KLHL24 mutation drives intermediate filament degradation, mitochondrial dysfunction
        and fibrosis in heart failure patients.
      evidence_source: OTHER
      explanation: Marked PARTIAL because the experimental system carries the gain-of-function allele,
        not the biallelic loss-of-function genotype of this entity. It establishes that KLHL24 dysfunction
        in cardiac tissue generates a fibrotic programme, and that cardiac fibroblasts as well as cardiomyocytes
        are affected cell types, but the direction of substrate change is opposite to this disease's.
        Tagged OTHER rather than IN_VITRO because this proteomic result is drawn from mixed sources -
        the abstract states that the authors "integrated clinical data with proteomic analyses of heart
        tissue as well as human induced pluripotent stem cell (hiPSC) models" and that the hiPSC-cardiomyocyte
        mass spectrometry "mirrored the proteomic profile of their corresponding left ventricle tissue
        samples" - so patient left-ventricle tissue and hiPSC material both contribute and no single evidence_source
        describes it. The purely hiPSC-derived result from the same paper is cited separately, under Failure
        of Desmin Intermediate Filament Turnover, and remains tagged IN_VITRO.
