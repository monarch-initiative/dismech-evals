        context: []
      assertion_type: Treatment
      assertion:
        name: Implantable cardioverter-defibrillator
        description: The single intervention with a plausible mortality benefit in this disease, and the
          one where CMH29 departs from standard hypertrophic cardiomyopathy practice. Because malignant
          ventricular arrhythmia in this genotype can precede structural severity and can be the first
          manifestation, conventional HCM risk scores - which weight wall thickness, fibrosis burden,
          family history of sudden death and syncope - underestimate risk. Several individuals in the
          founding families received defibrillators in their twenties and thirties, and an independently
          reported 16-year-old with low conventional risk markers received a prophylactic device on genotype
          grounds. That decision was made case by case; no guideline addresses this genotype and no comparative
          data exist.
        treatment_term:
          preferred_term: implantable cardioverter-defibrillator placement
          term:
            id: NCIT:C80435
            label: Implantable Cardioverter-Defibrillator Placement
        notes: '`runoak -i sqlite:obo:ncit search ''t~defibrillator''` returns NCIT:C80435 Implantable
          Cardioverter-Defibrillator Placement, which matches the preferred term exactly and is the identifier
          already used for this intervention elsewhere in the repository (for example `kb/disorders/Brugada_Syndrome.yaml`
          and `kb/disorders/Paroxysmal_Familial_Ventricular_Fibrillation.yaml`). `runoak -i sqlite:obo:ncit
          ancestors -p i NCIT:C80435` places it under NCIT:C80430 Cardiac Therapeutic Procedure and NCIT:C49236
          Therapeutic Procedure, so this binding is the specific term rather than the branch root.'
      selected_evidence:
        snippet: Early genetic testing enables genotype-guided preventive strategies, including timely
          prophylactic ICD implantation, even in apparently low-risk phenotypes.
        supports: SUPPORT
