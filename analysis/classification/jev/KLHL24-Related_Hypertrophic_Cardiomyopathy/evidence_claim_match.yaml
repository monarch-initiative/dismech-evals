  646f455e1f108e4a6c19670c02c2a239a714beb1573f544cc68279d72e872023:
    claim:
      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Loss-of-Function KLHL24 Variants
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The primary lesion is biallelic damage to KLHL24 at 3q27.1, reported against transcript
          NM_017644.3. The founding alleles are a homozygous nonsense variant c.1048G>T (p.Glu350*) in
          the Kelch-repeat region and a homozygous missense variant c.917G>A (p.Arg306His) at a residue
          conserved both across vertebrates and across the KLHL protein family. Later families add a frameshift
          in the BACK domain and a missense in the Kelch domain in trans, and compound heterozygous truncating
          alleles. All reported CMH29 genotypes therefore damage the BACK or Kelch portions of the protein
          - the substrate adaptor machinery - and none of them affects the translation initiation codon,
          which is the region mutated in the dominant skin disease. That positional separation is the
          structural basis of the allelic contrast that runs through this entry.

          The alleles behave as true loss of function rather than as dominant-negatives: heterozygous
          parents are unaffected, and both founding alleles failed to rescue zebrafish klhl24a knockdown
          when the equivalent substitutions were engineered into the fish transcript, whereas wild-type
          klhl24a mRNA did rescue.'
        genes:
        - preferred_term: KLHL24
          term:
