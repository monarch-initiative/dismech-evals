  8f86237608bbf19531eab5885e0bd42480baf33e04f0b8de195c47210acb7ff2:
    claim:
      about:
        disease:
          name: KLHL24-Related Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
            term:
              id: MONDO:0859372
              label: cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ventricular Electrical Instability and Malignant Arrhythmia
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: 'This is the node that determines prognosis, and it is the feature that most distinguishes
          CMH29 from ordinary hypertrophic cardiomyopathy. Three of the 11 young adults in the founding
          cohort died suddenly, at ages 20, 26 and 26; several others received implantable cardioverter-defibrillators
          in their twenties or thirties. Electrocardiography in the founding families showed generalised
          ST-T change, QRS durations at or above the upper limit of normal (120, 125 and 154 ms in the
          three individuals with a recorded value), one prolonged PR interval of 210 ms, and frequent
          episodes of non-sustained ventricular tachycardia in one individual - a pattern of both conduction-system
          involvement and ventricular ectopy. The other three recorded PR intervals were 186, 188 and
          194 ms, so PR prolongation is not a consistent feature and should not be used as a diagnostic
          pointer. The arrhythmic risk is disproportionate to structural severity and can precede it,
          which is a genuine departure from the standard HCM risk model.

          Mechanistically this is attributed to failure of cytoskeletal protein turnover: the desmin network
          normally couples the sarcolemma, Z-disc and intercalated disc, and its disorganisation disturbs
          both mechanical coupling and, plausibly, the sarcoplasmic reticulum-dependent calcium handling
          that underlies the cardiac action potential. That mechanistic account is stated in the literature
          but has not been tested experimentally in a biallelic loss-of-function system.'
        biological_processes:
        - preferred_term: cardiac conduction
          modifier: ABNORMAL
          term:
            id: GO:0061337
            label: cardiac conduction
        - preferred_term: cardiac muscle cell action potential
          modifier: ABNORMAL
          term:
            id: GO:0086001
            label: cardiac muscle cell action potential
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Of the 11 young affected adults identified, 3 died suddenly and 1 had a cardiac transplant
          due to heart failure.
        supports: SUPPORT
