      assertion:
        name: Reduced POMP in Differentiating Keratinocytes
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: Patient epidermis shows altered POMP distribution. Silencing POMP in organotypic
          human epidermis by about half reproduced the patient staining pattern for POMP, proteasome subunits
          and filaggrin, supporting reduced POMP as the causal intermediate. POMP acts as a proteasome
          assembly chaperone by binding proteasome precursor subunits; GO has no molecular-function term
          for assembly-chaperone activity, so the binding activity is recorded with the general protein
          binding term, which is POMP's experimentally supported GO function.
        genes:
        - preferred_term: POMP
          term:
            id: hgnc:20330
            label: POMP
        molecular_functions:
        - preferred_term: proteasome precursor subunit binding (assembly chaperone)
          modifier: DECREASED
          term:
            id: GO:0005515
            label: protein binding
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        locations:
        - preferred_term: epidermis
          term:
            id: UBERON:0001003
            label: skin epidermis
      selected_evidence:
        snippet: Immunohistochemical analysis of skin biopsies from KLICK patients revealed an altered
          epidermal distribution of POMP, the proteasome subunit proteins alpha 7 and beta 5, and the
          ER stress marker CHOP.
        supports: SUPPORT
