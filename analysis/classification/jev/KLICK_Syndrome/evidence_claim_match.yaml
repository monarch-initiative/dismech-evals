      assertion:
        name: ER Stress-Driven Cutaneous Autoinflammation
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'Proposed: chronic keratinocyte ER stress triggers innate-immune or type 1 interferon
          activation, which would make KLICK an autoinflammatory keratinization disease and explain the
          mild upper dermal infiltrate seen on biopsy. No inflammatory pathway has been measured in KLICK
          patients, and the PRAAS2 discovery paper describes KLICK as non-inflammatory. The observed infiltrate
          itself is recorded under histopathology.'
        locations:
        - preferred_term: dermis
          term:
            id: UBERON:0002067
            label: dermis
      selected_evidence:
        snippet: As we have cited that prolonged ER stress is known to induce inflammation in numerous
          chronic inflammatory skin diseases (23), the inflammation seen in KLICK syndrome could be considered
          to result from continuous abnormal ER stress in keratinocytes.
        supports: SUPPORT
        directness: INDIRECT
