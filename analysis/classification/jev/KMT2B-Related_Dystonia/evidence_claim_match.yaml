            label: regulation of transcription by RNA polymerase II
          modifier: ABNORMAL
      selected_evidence:
        snippet: Moreover, we provide evidence for a causative role of disordered histone modification,
          chromatin states, and transcriptional deregulation in dystonia pathogenesis.
        supports: SUPPORT
