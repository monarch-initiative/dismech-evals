        name: Transcriptional Dysregulation at KMT2B Target Loci
        description: Loss of the activating H3K4 mark together with gain of promoter DNA methylation disturbs
          transcription at a broad set of KMT2B target loci, including neurodevelopmental and neuronal-identity
          programs. Which of those targets actually drives the dystonic phenotype is not established,
          and this is the weakest link in the chain — the epigenetic lesion is well characterized while
          its motor-specific effectors are not.
