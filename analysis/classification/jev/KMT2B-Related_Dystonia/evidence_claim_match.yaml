            term:
              id: MONDO:0015004
              label: dystonia 28, childhood-onset
        context: []
      assertion_type: ImagingFinding
      assertion:
        name: Symmetrical hypointense lateral streaks in the external globus pallidus
        modality: MRI
        imaging_finding_term:
          preferred_term: Abnormal globus pallidus morphology
          term:
            id: HP:0002453
            label: Abnormal globus pallidus morphology
        located_in:
          preferred_term: external globus pallidus
          term:
            id: UBERON:0002476
            label: lateral globus pallidus
        laterality: BILATERAL
        diagnostic: false
        description: Subtle, symmetrical hypointense lateral streaks in the external globus pallidus on
          T2-weighted and susceptibility-sensitive sequences, reported in roughly a quarter of published
          cases and treated as a feature of the disease. It is the one structural correlate described
          for KMT2B-related dystonia, and it is anatomically independent of the therapeutic evidence,
          which is what makes it worth recording even though it is neither sensitive nor required for
          diagnosis.
        notes: 'Recorded with its negative alongside it. The same cohort that reports the ~27% literature
          figure saw no indicative MRI abnormality in any of its own nine patients, and attributes that
          to the sign being age-dependent and often absent in adults. A normal MRI therefore argues nothing.
          Note also that the streaks are in the external segment while deep brain stimulation targets
          the internal segment, so this corroborates pallidal involvement without confirming that the
          internal segment is where the lesion sits. The frequency slot is deliberately left empty: a
          single band would flatten the conflict between the ~27% literature figure and the zero-of-nine
          cohort result that this record exists to preserve.'
      selected_evidence:
        snippet: Brain MRI in ~27% of the patients with DYT-KMT2B in the literature showed abnormalities
          considered features of the disease (subtle and symmetrical hypointense lateral streaks in the
          external globus pallidus).
        supports: SUPPORT
