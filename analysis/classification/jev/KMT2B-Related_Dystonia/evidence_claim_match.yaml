  188cda5d63ee7470ccd8f877298043e46239f9385453358246289f3ed34bb25f:
    claim:
      about:
        disease:
          name: KMT2B-Related Dystonia
          disease_term:
            preferred_term: KMT2B-related dystonia
            term:
              id: MONDO:0015004
              label: dystonia 28, childhood-onset
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pallidal Motor Circuit Dysfunction
        description: 'Transcriptional dysregulation disturbs basal-ganglia motor output at the level of
          pallidal outflow. The circuit-level location of the lesion is inferred clinically rather than
          molecularly: no cell-type-resolved patient data localize it. Two independent lines of clinical
          evidence point at the pallidum — the substantial and sustained response to bilateral globus
          pallidus internus deep brain stimulation, and the symmetrical hypointense streaks reported on
          MRI in about a quarter of published cases. Neither is decisive alone, and they do not agree
          on segment: the imaging sign is in the external pallidum while stimulation targets the internal.'
        notes: 'Named for the pallidum alone, and left without a cell-type binding, because that is as
          far as the evidence reaches. Striatal medium spiny neurons are the usual candidate by circuit
          logic and by the choice of DBS target, but nothing cited here reports striatal or cell-type-resolved
          data in KMT2B variant carriers, so binding CL:1001474 would assert a localization no source
          makes. The imaging corroboration is real but weak: the sign is absent in roughly three quarters
          of published cases and was absent throughout the one cohort that looked for it prospectively.'
        biological_scale: TISSUE
      selected_evidence:
        snippet: These findings highlight a clinically recognizable and potentially treatable form of
          genetic dystonia, demonstrating the crucial role of KMT2B in the physiological control of voluntary
          movement.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
