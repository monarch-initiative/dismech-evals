        description: Focal chemodenervation of the affected muscle group. It does nothing to the underlying
          epigenetic lesion and acts at the neuromuscular junction, far downstream of everything this
          entry models, but it is the practical option for the focal and segmental presentations — blepharospasm,
          cervical dystonia, spasmodic dysphonia — where generalized measures are disproportionate. Reported
          benefit in the adult-onset series is partial and, in one subject, short-lived.
        notes: therapeutic_agent is left unbound. The cited report says "botulinum toxin" without a serotype;
          CHEBI codes only type A, and NCIT's generic NCIT:C163032 Botulinum Toxin is not reachable from
          the ChemicalEntityTerm roots (CHEBI:24431, NCIT:C1909), so the only bindable options would assert
          a serotype the source does not give.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: botulinum toxin
      selected_evidence:
        snippet: Anticholinergics did not bring any benefit. Botulinum toxin injections led to moderate
          improvement of dystonia.
        supports: SUPPORT
