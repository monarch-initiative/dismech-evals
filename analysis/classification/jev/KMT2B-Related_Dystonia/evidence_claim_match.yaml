          are individually repressive, and repression is the usual reading, but no patient transcriptomic
          data were found for this disorder and the cited sources say "transcriptional deregulation" without
          a direction, so the modifier is ABNORMAL rather than DECREASED.
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental
          Transcriptional Program
