      assertion_type: Diagnosis
      assertion:
        name: KMT2B DNA methylation episignature
        description: 'Genome-wide peripheral-blood DNA methylation profiling resolves a disorder-specific
          episignature for KMT2B haploinsufficiency. Its practical value is variant reclassification:
          it distinguishes carriers from controls and from other dystonic and neurodevelopmental disorders,
          so a KMT2B variant of uncertain significance can be resolved functionally rather than left open.
          The signature is attenuated in Arg2565 missense carriers relative to loss-of-function carriers,
          so a weak result does not exclude the diagnosis.'
        presence: PRESENT
      selected_evidence:
        snippet: We demonstrate a distinctive DNA hypermethylation pattern associated with DYT28, provide
          an epigenetic signature for this disorder enabling accurate diagnosis and reclassification of
          ambiguous genetic findings and suggest potential therapeutic approaches.
        supports: SUPPORT
