            term:
              id: MONDO:0015004
              label: dystonia 28, childhood-onset
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced H3K4 Methylation at Target Promoters
        description: 'KMT2B is one of the SET1/MLL-family enzymes that deposit methyl marks on histone
          H3 lysine 4 at promoters and enhancers. Reduced enzyme dose lowers H3K4 methylation across the
          loci KMT2B normally licenses, changing chromatin state rather than deleting any single downstream
          gene. Note that the loss of the activating mark is only half the lesion: the same loss of KMT2B
          occupancy also removes a barrier to repressive machinery, and that arm is drawn as a parallel
          branch from the haploinsufficiency node rather than from here.'
        notes: The reduction in H3K4 methylation is inferred from enzyme identity and gene dosage, not
          measured in patients or patient tissue. No cited reference quantifies the mark in KMT2B variant
          carriers, which is why the incoming edge is graded INDIRECT and why the adjacent hypermethylation
          node — which is measured — carries the weight of the chain.
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin
          State Imbalance
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: DECREASED
      selected_evidence:
        snippet: Heterozygous variants in lysine methyltransferase 2B (KMT2B), encoding a histone H3 methyltransferase,
          have been associated with a childhood-onset, progressive and complex form of dystonia (dystonia
          28, DYT28).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
