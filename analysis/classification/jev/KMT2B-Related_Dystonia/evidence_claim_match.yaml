  e68b7d1d73a0fefa7c512518554b18b54943998b6251f7692f431c809f38d732:
    claim:
      about:
        disease:
          name: KMT2B-Related Dystonia
          disease_term:
            preferred_term: KMT2B-related dystonia
            term:
              id: MONDO:0015004
              label: dystonia 28, childhood-onset
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Promoter DNA Hypermethylation
        description: 'KMT2B haploinsufficiency produces non-random genome-wide DNA hypermethylation that
          is selectively enriched at promoters and other positively acting regulatory elements. This is
          the one step in the chain measured directly in patients rather than inferred: the pattern is
          reproducible enough in peripheral blood to serve as a diagnostic episignature, which is also
          why it can reclassify variants of uncertain significance.'
        notes: 'The mechanism usually offered for this step — that loss of KMT2B occupancy lets DNA methyltransferases
          and Polycomb machinery act at loci they would normally be excluded from — comes from mouse embryonic
          stem cell work and has not been shown in human neurons or patient tissue. It is therefore left
          out of the description rather than asserted as human mechanism; what is curated here is the
          measured hypermethylation, not its proposed cause. No current GO biological-process term fits:
          GO has obsoleted histone H3-K4 methylation, histone lysine methylation and DNA methylation alike,
          so the node is left without a process annotation rather than reusing the generic chromatin-organization
          term already carried by the adjacent node.'
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Notably, defective KMT2B function in DYT28 causes a non-random DNA hypermethylation across
          the genome, selectively involving promoters and other regulatory regions positively controlling
          gene expression.
        supports: SUPPORT
    origin:
