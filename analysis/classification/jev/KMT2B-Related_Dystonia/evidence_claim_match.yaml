  e985ad0ee885d47da2af61b6d8450d20bf0ad317263f5be3f6f5c354f885c8a2:
    claim:
      about:
        disease:
          name: KMT2B-Related Dystonia
          disease_term:
            preferred_term: KMT2B-related dystonia
            term:
              id: MONDO:0015004
              label: dystonia 28, childhood-onset
        context: []
      assertion_type: Subtype
      assertion:
        name: Adult-onset
        display_name: Adult-onset focal or segmental DYT-KMT2B
        description: 'A milder, later-onset form presenting in adulthood as focal or segmental dystonia
          — blepharospasm, cervical dystonia, writer''s cramp or spasmodic dysphonia — usually without
          the developmental delay of the classic childhood-onset disease. It is not simply a late presentation
          of the same process: on genome-wide methylation profiling the adult-onset cases cluster with
          controls rather than with early-onset DYT-KMT2B, and the probes that do distinguish them do
          not overlap the early-onset episignature, which the authors read as a different molecular mechanism.
          This entry''s pathophysiology chain is therefore not asserted to apply to the subtype. Two of
          the four missense alleles involved (p.S640T, p.R2339Q) are described by the reporting authors
          as lacking segregation proof, so the subtype rests on a smaller evidence base than the childhood-onset
          disease.'
      selected_evidence:
        snippet: Seven affected subjects presented with adult-onset focal or segmental dystonia, three
          developed isolated progressive hearing loss, and one displayed intellectual disability and short
          stature.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36483457
      reference_title: Adult-onset KMT2B-related dystonia.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the adult-onset focal/segmental presentation as a distinct subtype.
