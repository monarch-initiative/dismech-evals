      assertion_type: Treatment
      assertion:
        name: Bilateral Globus Pallidus Internus Deep Brain Stimulation
        description: 'Bilateral deep brain stimulation of the globus pallidus pars interna is the most
          effective intervention reported and produces a dramatic, long-lasting reduction in dystonia
          severity, in some cases restoring independent ambulation. Its benefit is regionally uneven:
          trunk and cervical dystonia improve most, laryngeal dystonia responds poorly, and gait improvement
          decays over years, with no patient in the longest-followed cohort maintaining a fully independent
          gait. Male sex and greater preoperative severity predict better response. Post-operative complications
          reported in the KMT2B cohorts are mild parkinsonism and freezing of gait, the latter compounding
          the poor and decaying gait response above rather than being a separate problem.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: bilateral globus pallidus internus deep brain stimulation
          term:
            id: NCIT:C21024
            label: Deep Brain Stimulation
        target_phenotypes:
