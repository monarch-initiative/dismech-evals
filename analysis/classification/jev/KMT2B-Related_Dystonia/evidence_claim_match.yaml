  987f43681109b7c397fa10a0c10b99184b439dea929ced45e436c17d3c8da778:
    claim:
      about:
        disease:
          name: KMT2B-Related Dystonia
          disease_term:
            preferred_term: KMT2B-related dystonia
            term:
              id: MONDO:0015004
              label: dystonia 28, childhood-onset
        context: []
      assertion_type: Genetic
      assertion:
        name: KMT2B
        gene_term:
          preferred_term: KMT2B
          term:
            id: hgnc:15840
            label: KMT2B
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        presence: PRESENT
        notes: 'variant_origin records the majority case only; the slot is single-valued and inherited
          alleles are well documented, including a nonsense variant co-segregating through a three-generation
          kindred. Heterozygous loss-of-function variants involving KMT2B account for approximately 88%
          of affected individuals; a heterozygous 19q13.11-19q13.12 deletion encompassing KMT2B accounts
          for approximately 12%. Variant class carries prognostic information for onset and systemic burden:
          deletions and protein-truncating variants give earlier dystonia onset and more systemic disease
          than missense variants. Whether it predicts deep brain stimulation response is not settled by
