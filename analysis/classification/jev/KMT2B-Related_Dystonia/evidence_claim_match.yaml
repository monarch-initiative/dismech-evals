  5b75cfbe70c683e530f7a99513db39a1293266e2c9b77457aa41f6b7a1b95df8:
    claim:
      about:
        disease:
          name: KMT2B-Related Dystonia
          disease_term:
            preferred_term: KMT2B-related dystonia
            term:
              id: MONDO:0015004
              label: dystonia 28, childhood-onset
        context:
        - path: /experimental_models/0
          value:
            name: Mll2 (Kmt2b) conditional-knockout mouse embryonic stem cells
            experimental_model_type: CELL_LINE
            description: Mouse embryonic stem cells carrying a conditional Mll2 allele, the gene encoding
              KMT2B, in which the enzyme can be depleted and then re-expressed while the chromatin state
              and DNA methylation of a CpG island promoter are followed over time. This is the experimental
              basis for the claim that KMT2B occupancy protects promoters from DNA methylation, and it
              is recorded here so that the mechanism the hypermethylation node declines to assert as human
              biology has a structural home rather than living only in that node's notes.
            cell_source: Mouse embryonic stem cell line with a conditional Mll2 (Kmt2b) allele
            culture_system: Monolayer embryonic stem cell culture with inducible Mll2 deletion and rescue
              by KMT2B re-expression
            organism:
              preferred_term: mouse
              term:
                id: NCBITaxon:10090
                label: Mus musculus
            publication: PMID:23358417
            notes: 'Recorded as an experimental model rather than an animal model because the system is
              a cultured cell line, not a whole organism. The wider claim often made from this literature,
              that KMT2B loss lets Polycomb repressive complex 2 and DNA methyltransferases reach loci
              they are normally excluded from, is not asserted here: this paper measures protection from
              DNA methylation and does not name PRC2, and no cited reference does so in quotable form.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Promoter DNA Hypermethylation
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: MOLECULAR
        description: 'Establishes the causal direction the patient data cannot: loss of KMT2B precedes
          promoter DNA methylation rather than accompanying it, and restoring the enzyme reverses the
          silencing. What it does not establish is that this is what happens in a KMT2B variant carrier.'
        limitations: A single CpG island promoter in mouse embryonic stem cells, under complete conditional
          loss of the gene, stands in for genome-wide promoter hypermethylation measured in the peripheral
          blood of humans carrying one working copy. Nothing in the system is neural, human, or heterozygous,
          and no dystonia-relevant readout exists in it.
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: The measurements are in mouse cells. Mouse and human differ in CpG island methylation
            dynamics at exactly the class of promoter under study, so the direction of the effect transfers
            more safely than its magnitude or its target set.
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: Neurons, the pallidum and the whole developmental trajectory of the disease lie
            outside the model. Embryonic stem cells report the enzyme's generic chromatin function, not
            its function in the cell types whose failure produces dystonia.
        - divergence_type: POPULATION_MISMATCH
          materiality: QUALIFYING
          description: The model applies complete conditional loss of Mll2, whereas the disease is heterozygous
            loss of function. Whether one remaining copy leaves the protective function partially intact
            is the quantitative question the model is not set up to answer.
        readouts:
        - name: MagohB CpG island promoter DNA methylation after KMT2B depletion
          target: Promoter DNA Hypermethylation
          direction: INCREASED
          interpretation: Promoter methylation rises once KMT2B is lost and the active marks have gone,
            which is the molecular event the human episignature measures at genome scale.
        - name: Promoter reactivation after KMT2B re-expression
          target: Promoter DNA Hypermethylation
          direction: RESTORED
          interpretation: The rescue arm, which is what makes the relationship causal rather than correlative
            in this system.
      selected_evidence:
        snippet: Our study provides a paradigm for the idea that KMT2 proteins are crucial components
          for establishing and maintaining the transcriptionally active and unmethylated state of CpG
          island promoters.
        supports: SUPPORT
