  2539f035e0114acf7cc375a66e1dc46bbbb4ef8f31aa45eaf51252b477a9be6b:
    claim:
      about:
        disease:
          name: KMT2B-Related Dystonia
          disease_term:
            preferred_term: KMT2B-related dystonia
            term:
              id: MONDO:0015004
              label: dystonia 28, childhood-onset
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KMT2B Haploinsufficiency
        description: Heterozygous loss-of-function variants in KMT2B, or heterozygous deletions of 19q13.11-19q13.12
          that remove one copy of the gene, halve the dose of the KMT2B histone methyltransferase. Truncating
          alleles introduce a premature termination codon and reduce KMT2B transcript in patient fibroblasts;
          microdeletion carriers show the same dystonic presentation, which is the independent argument
          that gene dosage rather than a mutant protein product is the lesion. Missense alleles are presumed
          to act by the same route, but for those the haploinsufficiency claim is inferred rather than
          measured.
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        biological_scale: MOLECULAR
        genes:
        - preferred_term: KMT2B
          term:
            id: hgnc:15840
            label: KMT2B
        molecular_functions:
        - preferred_term: histone H3K4 methyltransferase activity
          term:
            id: GO:0042800
            label: histone H3K4 methyltransferase activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Suggestive of haploinsufficiency, we found significantly decreased total mRNA levels
          of KMT2B in mutant fibroblasts.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
