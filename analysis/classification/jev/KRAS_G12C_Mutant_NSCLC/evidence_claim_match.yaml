              label: lung adenocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KRAS G12C Oncogenic Mutation
        genetic_context:
          variant_origin: SOMATIC
        description: The KRAS G12C mutation substitutes cysteine for glycine at codon 12, impairing GTPase
          activity and trapping KRAS in the active GTP-bound state. However, unlike other KRAS mutations,
          G12C retains some GTPase activity, cycling between active (GTP-bound) and inactive (GDP-bound)
          states. This cycling creates a therapeutic window for covalent inhibitors that bind the mutant
          cysteine in the GDP-bound state.
        cell_types:
        - preferred_term: type II pneumocyte
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        biological_processes:
        - preferred_term: small GTPase mediated signal transduction
          modifier: INCREASED
          term:
            id: GO:0007264
            label: small GTPase mediated signal transduction
      selected_evidence:
        snippet: The KRAS glycine-to-cysteine mutation (G12C) composes approximately 44% of KRAS mutations
          in non-small cell lung cancer, with mutant KRasG12C present in approximately 13% of all patients
          with lung adenocarcinoma.
        supports: SUPPORT
