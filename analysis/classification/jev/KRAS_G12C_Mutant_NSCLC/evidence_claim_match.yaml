      assertion_type: Biochemical
      assertion:
        name: KRAS Mutation Testing
        notes: KRAS mutation testing is part of standard molecular profiling for advanced NSCLC. Methods
          include PCR-based assays and next-generation sequencing. G12C is the most common KRAS mutation
          in NSCLC (~40% of KRAS mutations). Testing should distinguish G12C from other KRAS mutations
          (G12D, G12V) which are not targetable with current approved agents.
      selected_evidence:
        snippet: pathologists, medical oncologists, and community practitioners will need to incorporate
          routine testing for emerging biomarkers such as MET amplification, ERBB2 (alias HER2), and KRAS
          mutations, particularly KRAS G12C, considering the promising development of direct inhibitors
          of KRasG12C protein.
        supports: SUPPORT
