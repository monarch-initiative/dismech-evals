      assertion_type: Genetic
      assertion:
        name: KRAS
        gene_term:
          preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        association: Somatic Activating Mutation
        inheritance:
        - name: Somatic
        notes: KRAS (12p12.1) encodes a small GTPase in the RAS family. G12C is the most common KRAS mutation
          in NSCLC, resulting from a G>T transversion associated with smoking. Other common KRAS mutations
          include G12D and G12V. KRAS mutations are generally mutually exclusive with EGFR, ALK, and ROS1
          alterations.
      selected_evidence:
        snippet: Over 80% of oncogenic KRAS mutations occur at codon 12, where the glycine residue is
          substituted by different amino acids, leading to genomic heterogeneity of KRas-mutant tumors.
        supports: SUPPORT
