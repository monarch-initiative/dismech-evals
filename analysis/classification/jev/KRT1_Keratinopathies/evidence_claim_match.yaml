      assertion:
        name: Epidermolytic Ichthyosis
        display_name: Epidermolytic Ichthyosis (Generalized)
        subtype_term:
          preferred_term: KRT1-associated epidermolytic ichthyosis
          term:
            id: MONDO:0700249
            label: epidermolytic hyperkeratosis 1
        description: Classic generalized form characterized by congenital erythroderma, blistering and
          erosions at birth, evolving into widespread ichthyosiform hyperkeratosis with palmoplantar keratoderma.
          Caused by heterozygous missense mutations at highly conserved helix boundary motifs of KRT1.
          MONDO separates the KRT1 form of epidermolytic hyperkeratosis (MONDO:0700249) from the KRT10
          form (MONDO:0958184); this row is the KRT1 form.
        genes:
