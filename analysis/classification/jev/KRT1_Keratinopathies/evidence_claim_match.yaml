  186e149dd0acd6eae6785b7e651d9ae3bf5c46ebcbde54cc9b5b2a104c40dbe5:
    claim:
      about:
        disease:
          name: KRT1 Keratinopathies
          disease_term:
            preferred_term: KRT1 keratinopathies
        context: []
      assertion_type: Genetic
      assertion:
        name: KRT1 dominant-negative allelic series
        gene_term:
          preferred_term: KRT1
          term:
            id: hgnc:6412
            label: KRT1
        association: Causative
        notes: Heterozygous dominant-negative mutations in KRT1 cause the full spectrum of KRT1 keratinopathies.
          Mutations at helix boundary motifs (1A, 2B domains) cause severe generalized EI; scattered mutations
          elsewhere produce variable phenotypes including isolated PPK. Variants truncating the V2 tail
          domain are reported in ichthyosis hystrix of Curth-Macklin. Approximately 50% of cases are de
          novo. Complete penetrance. KRT1 causes every subtype listed in `has_subtypes`, and `Genetic.subtype`
          is single-valued, so the reciprocal link to each subtype row is carried by that row's own `genes`
          descriptor rather than by a foreign key here.
        inheritance:
        - name: Autosomal Dominant
        features: 'Dominant-negative mechanism: mutant keratin 1 is incorporated into heterodimers with
          keratin 10, disrupting filament assembly. Genotype-phenotype correlations show helix boundary
          mutations associated with severe EI, 2B domain mutations with cyclic ichthyosis, and V2 tail
          mutations with Curth-Macklin type. The V2 tail correlation rests on a background statement rather
          than on a primary result: the paper cited for it reports a de novo KRT10 three-base-pair deletion
          in its own Curth-Macklin patient.'
      selected_evidence:
        snippet: Genetically, this is an autosomal dominant disease with complete penetrance; however,
          50% are spontaneous mutations. The clinical phenotype is a result of alterations in the gene(s)
          for keratin 1 and/or 10.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15663649
