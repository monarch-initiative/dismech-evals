        context: []
      assertion_type: Subtype
      assertion:
        name: Annular Epidermolytic Ichthyosis
        display_name: Annular Epidermolytic Ichthyosis / Cyclic Ichthyosis
        subtype_term:
          preferred_term: KRT1-associated annular epidermolytic ichthyosis
          term:
            id: MONDO:0859574
            label: ichthyosis, annular epidermolytic, 2
        description: Distinct phenotype with neonatal erythema and erosions that improve, followed by
          palmoplantar hyperkeratosis and dramatic episodic flares of annular, polycyclic erythematous
          plaques with scale. Flares last weeks to months with intervening periods of near-normal skin.
          Caused by mutations in the 2B domain of keratin K1. MONDO splits annular epidermolytic ichthyosis
          (MONDO:0011870) into a KRT10 form, MONDO:0100303, and a KRT1 form, MONDO:0859574; this row is
          the KRT1 form.
        genes:
        - preferred_term: KRT1
          term:
            id: hgnc:6412
            label: KRT1
        inheritance:
        - name: Autosomal dominant inheritance
          description: Affected members of two reported families carry heterozygous K1 variants at a single
            codon that were absent from unaffected relatives and controls, which is the pattern of a dominant
            allele rather than a recessive one.
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Three affected individuals exhibit dramatic episodic flares of annular, polycyclic erythematous
          plaques with scale, which coalesce to involve most of the body surface.
        supports: SUPPORT
