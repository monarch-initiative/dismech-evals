            id: hgnc:6412
            label: KRT1
        inheritance:
        - name: Autosomal dominant inheritance
          description: Generalized epidermolytic ichthyosis segregates as an autosomal dominant trait
            with complete penetrance, and about half of probands carry a de novo variant.
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Epidermolytic hyperkeratosis is a rare autosomal dominant pathology of cornification
          caused by mutations in keratins 1 and 10.
        supports: SUPPORT
