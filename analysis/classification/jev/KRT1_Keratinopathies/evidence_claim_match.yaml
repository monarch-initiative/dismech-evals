  38a6aa8bb89e166b9cf9d28ba98bf098018b6d07bd9912ba43f20d0dcbbfa032:
    claim:
      about:
        disease:
          name: KRT1 Keratinopathies
          disease_term:
            preferred_term: KRT1 keratinopathies
        context: []
      assertion_type: Subtype
      assertion:
        name: Ichthyosis Hystrix Curth-Macklin
        display_name: Ichthyosis Hystrix of Curth-Macklin
        subtype_term:
          preferred_term: ichthyosis hystrix of Curth-Macklin
          term:
            id: MONDO:0007808
            label: ichthyosis hystrix of Curth-Macklin
        description: Rare variant characterized by generalized spiky or verrucous hyperkeratosis and severe
          palmoplantar keratoderma. Distinguished from classic EI by the presence of binucleated cells
          and absence of typical tonofilament clumping. Reported KRT1 variants truncate the V2 tail domain.
          MONDO asserts KRT1 as the causal gene of MONDO:0007808, and the paper cited below reports a
          sporadic patient whose causal variant was instead a de novo three-base-pair deletion in KRT10,
          so the V2 tail of either keratin of the K1/K10 pair can produce this phenotype.
        genes:
        - preferred_term: KRT1
          term:
            id: hgnc:6412
            label: KRT1
      selected_evidence:
        snippet: Ichthyosis Hystrix of Curth-Macklin (IH-CM) is a rare manifestation of epidermolytic
          ichthyosis (EI) that is characterised by generalised spiky or verrucous hyperkeratosis.
        supports: SUPPORT
    origin:
