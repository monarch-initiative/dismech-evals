  8935558e8a238e08184071dc39bf14d976071e0b7ddbbe085bf06e1bdcf91d44:
    claim:
      about:
        disease:
          name: KRT74-Related Pure Hair-Nail Ectodermal Dysplasia
          disease_term:
            preferred_term: ectodermal dysplasia 7, hair/nail type
            term:
              id: MONDO:0013975
              label: ectodermal dysplasia 7, hair/nail type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Keratin-74 Intermediate Filament Instability
        biological_scale: MOLECULAR
        description: KRT74 encodes a type II keratin that heterodimerizes with a type I partner to build
          intermediate filaments in the hair follicle inner root sheath and in nail-forming epithelium.
          The p.Phe274Ser substitution alters a conserved residue in the coil 1B rod domain required for
          long-range keratin dimerization, destabilizing filament assembly. In patient tissue the protein
          is undetectable, so the operative lesion is absence of keratin-74 rather than incorporation
          of a poison subunit - the mechanistic difference from the dominant KRT74 woolly-hair alleles,
          which act dominant-negatively.
        molecular_functions:
        - preferred_term: structural constituent of cytoskeleton
          term:
            id: GO:0005200
            label: structural constituent of cytoskeleton
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: intermediate filament organization
          term:
            id: GO:0045109
            label: intermediate filament organization
          modifier: DECREASED
        notes: The structural claim rests on domain position and residue conservation plus loss of immunostaining.
          No direct biochemical filament-assembly assay was performed for p.Phe274Ser, so the precise
          step at which assembly fails remains inferred rather than measured.
      selected_evidence:
        snippet: The transition alters the highly conserved Phe274 residue in the coil 1B domain required
          for long-range dimerization of keratins, suggesting that the mutation compromises the stability
          of intermediate filaments.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24714551
      reference_title: 'Autosomal recessive transmission of a rare KRT74 variant causes hair and nail
        ectodermal dysplasia: allelism with dominant woolly hair/hypotrichosis.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'States the proposed molecular defect: impaired keratin dimerization and intermediate
        filament instability.'
