          disease_term:
            preferred_term: ectodermal dysplasia 7, hair/nail type
            term:
              id: MONDO:0013975
              label: ectodermal dysplasia 7, hair/nail type
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: 'Diagnosis starts from congenital hypotrichosis plus nail dystrophy, with deliberate
          examination of the appendages that should be normal - skin, teeth, and sweating - and a three-generation
          pedigree. Confirmation is molecular: a hereditary hypotrichosis / ectodermal-dysplasia panel
          containing KRT74, KRT85, and HOXC13, or exome sequencing when the phenotype is nonspecific.
          Because ECTD7 is recessive, the diagnosis requires two pathogenic or likely pathogenic KRT74
          alleles in trans, so parental segregation or phasing is part of the confirmation rather than
          an optional extra. Single-gene KRT74 sequencing is efficient when the phenotype and family structure
          are strongly suggestive; genome sequencing is reasonable after a negative panel or exome, though
          its incremental yield here is unknown.'
        notes: Chromosomal microarray, karyotyping, FISH, mitochondrial sequencing, repeat-expansion testing,
          and metabolomic or proteomic testing are not first-line absent a separate indication. Trichoscopy
          and light microscopy may document shaft fragility but no KRT74-specific pattern is validated.
          Keratin-74 immunohistochemistry on a hair or skin biopsy showed loss of staining in the reported
          family and is mechanistically informative, but it is research-supportive rather than a standardized
          clinical assay.
      selected_evidence:
        snippet: Whole exome sequencing of affected individuals revealed homozygosity for a rare c.821T>C
          variant (p.Phe274Ser) in the KRT74 gene that segregates AR PHNED in the family.
        supports: SUPPORT
