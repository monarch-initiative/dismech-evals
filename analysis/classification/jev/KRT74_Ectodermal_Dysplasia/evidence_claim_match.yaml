  71bea617bd0cae3b2107b862adb78a0670096fa9dd55b3f0c8d82780b920ba2c:
    claim:
      about:
        disease:
          name: KRT74-Related Pure Hair-Nail Ectodermal Dysplasia
          disease_term:
            preferred_term: ectodermal dysplasia 7, hair/nail type
            term:
              id: MONDO:0013975
              label: ectodermal dysplasia 7, hair/nail type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inner Root Sheath and Nail Epithelium Keratin Deficiency
        biological_scale: CELLULAR
        description: 'Keratin-74 is normally expressed in the hair follicle inner root sheath and, in
          the nail unit, in the nail matrix, nail bed, and hyponychium. Its absence deprives exactly those
          compartments of mechanical support during the keratinization that shapes the emerging hair shaft
          and nail plate. This expression map is why the phenotype is restricted to hair and nails: the
          protein is simply not required in the ectodermal derivatives that PHNED spares.'
        cell_types:
        - preferred_term: Hair follicle cell
          term:
            id: CL:0002559
            label: hair follicle cell
        - preferred_term: Nail matrix keratinocyte
          term:
            id: CL:4052064
            label: nail matrix keratinocyte
        biological_processes:
        - preferred_term: keratinization
          term:
            id: GO:0031424
            label: keratinization
          modifier: DECREASED
      selected_evidence:
        snippet: Immunohistochemical (IHC) analyses confirmed a strong keratin-74 expression in the nail
          matrix, the nail bed and the hyponychium of mouse distal digits, as well as in normal human
          hair follicles.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
