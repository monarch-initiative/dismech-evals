            term:
              id: MONDO:0013975
              label: ectodermal dysplasia 7, hair/nail type
        context: []
      assertion_type: Genetic
      assertion:
        name: KRT74 Biallelic Loss-of-Function Variant
        gene_term:
          preferred_term: KRT74
          term:
            id: hgnc:28929
            label: KRT74
        relationship_type: CAUSATIVE
        variants:
        - name: c.821T>C (p.Phe274Ser) coil 1B missense
          description: Homozygous missense variant (dbSNP rs147962513, transcript NM_175053) replacing
            a phenylalanine conserved across species and in 25 of 26 human type II keratins. Phe274 lies
            in the coil 1B rod domain required for long-range keratin dimerization, and patient hair follicles
            and epidermis showed no detectable keratin-74, indicating loss of function rather than a dominant-negative
            effect. This is the only ECTD7 allele reported to date.
          type: MISSENSE
        notes: 'No contemporary ClinVar assertion or formal ACMG/AMP classification for p.Phe274Ser was
          established by the Edison deep-research review; a diagnostic laboratory should classify the
          variant independently against current population and functional data. The reported allele frequency
          (~0.0002) came from the historical Exome Variant Server and should be rechecked against current
          gnomAD before clinical reporting.

          Locus discrepancy, deliberately preserved: the quoted Raykova 2014 sentence above says the family
          was "linked to the keratin gene cluster on 12p11.1", whereas KRT74 and the type II keratin cluster
          are on 12q, and the rest of this entry and the PHNED grouping use 12q12-q14.1. The snippet is
          a verbatim quote that validates against the cached abstract, so the discrepancy is almost certainly
          a paper-side error. Do not "correct" the snippet to match the surrounding prose - that would
          make it a misquote.'
      selected_evidence:
        snippet: We investigated a consanguineous Pakistani family with AR PHNED linked to the keratin
          gene cluster on 12p11.1 but without detectable mutations in KRT85 and HOXC13.
        supports: SUPPORT
