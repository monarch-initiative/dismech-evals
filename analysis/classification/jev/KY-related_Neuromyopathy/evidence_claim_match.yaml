  735dc4dee2599985500d9bc057e26286ebae8cfe11f41682fb4b481f7fc6b82c:
    claim:
      about:
        disease:
          name: KY-related Neuromyopathy
          disease_term:
            preferred_term: KY-related neuromyopathy
            term:
              id: MONDO:1010194
              label: KY-related neuromyopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: KY
        gene_term:
          preferred_term: KY
          term:
            id: hgnc:26576
            label: KY
        association: Causative
        relationship_type: CAUSATIVE
        features: KY (kyphoscoliosis peptidase, chromosome 3q22.2) encodes a transglutaminase-like Z-disc
          protein. Biallelic loss-of-function variants cause the disease; reported alleles include the
          frameshift c.1071delG (p.Thr358Leufs*3), nonsense variants p.Tyr135Ter and p.Arg139Ter, a complex
          frameshift p.Val18TyrfsTer56 in the spastic-paraplegia kindred, and missense/splice variants
          (p.Cys243Arg and the c.710+1G>A splice variant) shown by immunoblot to markedly reduce protein
          abundance. The predicted catalytic triad is dispensable for KY's muscle-fiber-size function,
          consistent with a structural rather than enzymatic loss of function.
        variants:
        - name: c.1071delG (p.Thr358Leufs*3)
          description: Homozygous truncating frameshift in the Swedish index case; the mutant transcript
            is expressed in skeletal muscle, consistent with loss of function.
        - name: c.415C>T (p.Arg139Ter)
          description: Homozygous nonsense variant in an Iranian patient with lower-limb myopathy and
            equinovarus.
        - name: c.727T>C (p.Cys243Arg)
          description: Homozygous missense variant in two Turkish brothers; immunoblot showed markedly
            reduced KY protein, supporting loss of function.
        - name: c.51_52ins(28) (p.Val18fs56*)
          description: Homozygous complex insertion/frameshift in the Bedouin hereditary-spastic-paraplegia
            kindred; truncating loss of function.
      selected_evidence:
        snippet: Mutations in KY cause Myofibrillar Myopathy-7 (MFM-7) and Hereditary Spastic Paraplegia
          (HSP).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
