      reference: PMID:25273096
      reference_title: Histone deacetylase inhibition rescues structural and functional brain deficits
        in a mouse model of Kabuki syndrome.
      evidence_source: MODEL_ORGANISM
      explanation: Demonstrates that HDAC inhibitor treatment can rescue neurogenesis and memory deficits
        in a Kabuki syndrome mouse model.
