      assertion_type: Pathophysiology
      assertion:
        name: Chromatin dysregulation from KMT2D and KDM6A haploinsufficiency
        genes:
        - preferred_term: KMT2D
          term:
            id: hgnc:7133
            label: KMT2D
        - preferred_term: KDM6A
          term:
            id: hgnc:12637
            label: KDM6A
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        description: Kabuki syndrome is a disorder of epigenetic regulation in which loss of KMT2D or
          KDM6A function perturbs COMPASS-associated chromatin control. Truncating KMT2D variants frequently
          undergo nonsense-mediated decay, reducing KMT2D dosage and dysregulating developmental target
          genes. KDM6A lesions disrupt a cooperating histone demethylase in the same chromatin-regulatory
          pathway.
        cell_types:
        - preferred_term: neural crest cell
          term:
            id: CL:0011012
            label: neural crest cell
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
        - preferred_term: regulation of gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
      selected_evidence:
        snippet: Kabuki syndrome (KS) is a multiple congenital anomalies syndrome characterized by characteristic
          facial features and varying degrees of mental retardation, caused by mutations in KMT2D/MLL2
          and KDM6A/UTX genes.
        supports: SUPPORT
