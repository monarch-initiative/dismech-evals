      assertion_type: Treatment
      assertion:
        name: HDAC Inhibitor Therapy (Experimental)
        description: Histone deacetylase inhibitors such as AR-42 have shown preclinical promise in rescuing
          structural and functional brain deficits in Kmt2d haploinsufficient mouse models. By promoting
          histone acetylation, HDAC inhibitors can partially compensate for the reduced H3K4 methylation
          caused by KMT2D deficiency.
        treatment_term:
          preferred_term: HDAC inhibitor therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: In vitro reporter alleles demonstrated a reduction in histone 4 acetylation and histone
          3 lysine 4 trimethylation (H3K4me3) activity in mouse embryonic fibroblasts from Kmt2d(+/βGeo)
          mice. These activities were normalized in response to AR-42, a histone deacetylase inhibitor.
          In vivo, deficiency of H3K4me3 in the dentate gyrus granule cell layer of Kmt2d(+/βGeo) mice
          correlated with reduced neurogenesis and hippocampal memory defects. These abnormalities improved
          upon postnatal treatment with AR-42. Our work suggests that a reversible deficiency in postnatal
          neurogenesis underlies intellectual disability in Kabuki syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
