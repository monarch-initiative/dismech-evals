            description: A naturally occurring ovine mutation in the orthologous DLK1-DIO3 region that
              causes postnatal muscle hypertrophy with large cis changes in expression of DLK1, PEG11
              (RTL1) and maternal transcripts. Full-length PEG11 protein is overexpressed in callipyge
              skeletal muscle. It shows that PEG11/RTL1 overexpression affects skeletal muscle, but it
              is not a model of the human syndrome as a whole.
            genes:
            - preferred_term: PEG11
              term:
                id: hgnc:14665
                label: RTL1
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: RTL1 Dosage Excess
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: TISSUE
        limitations: The callipyge phenotype is postnatal muscle hypertrophy rather than the fetal muscle
          and placental defects of KOS, and DLK1 overexpression is a competing effector.
      selected_evidence:
        snippet: Using immunological and mass spectrometry approaches we have directly identified the
          full-length PEG11 protein from postnatal nuclear preparations of callipyge skeletal muscle and
          conclude that its over-expression may be involved in inducing muscle hypertrophy.
        supports: SUPPORT
