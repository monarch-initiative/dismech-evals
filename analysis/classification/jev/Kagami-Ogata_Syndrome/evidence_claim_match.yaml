        subtype_term:
          preferred_term: paternal uniparental disomy of chromosome 14
          term:
            id: MONDO:0011975
            label: paternal uniparental disomy of chromosome 14
        description: Both chromosomes 14 are paternal, so both IG-DMR and MEG3-DMR are methylated, maternally
          expressed genes are absent and RTL1 expression rises about five-fold with doubled DLK1. Robertsonian
          13;14 translocations and i(14q) chromosomes are recognized predisposing rearrangements.
      selected_evidence:
        snippet: Upd(14)pat accounts for approximately two-thirds of KOS patients, and epimutations and
          microdeletions are identified with a similar frequency.
        supports: SUPPORT
