        description: 'Methylation analysis of the IG-DMR and MEG3-DMR (MEG3:TSS-DMR) detects all three
          molecular classes: hypermethylation of the maternal DMRs confirms the diagnosis, after which
          UPD, epimutation and deletion are distinguished by genotyping and copy-number analysis. Karyotyping
          is suggested to detect Robertsonian translocations predisposing to UPD. Prenatal ultrasound
          can detect polyhydramnios and the thoracic and abdominal features from about 25 weeks of gestation;
          prenatal methylation testing of fetal DNA is not recommended because of false negatives.'
      selected_evidence:
        snippet: When hypermethylation is found for either of the two DMRs of maternal origin, this confirms
          the diagnosis of KOS.
        supports: SUPPORT
