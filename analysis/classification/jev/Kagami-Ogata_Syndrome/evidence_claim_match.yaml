      assertion_type: Genetic
      assertion:
        name: RTL1
        gene_term:
          preferred_term: RTL1
          term:
            id: hgnc:14665
            label: RTL1
        presence: Positive
        association: Paternally expressed retrotransposon-derived gene overexpressed in KOS
        features: RTL1 (PEG11/SIRH2) dosage rises about 2.5-fold to five-fold when the maternal RTL1as
          microRNAs are lost. RTL1 overproduction is considered the primary driver of the placental, thoracic
          and muscle phenotype.
        notes: 'relationship_type is left unset because no GeneDiseaseRelationshipEnum value describes
          an imprinted dosage gene: KOS is caused by the parent-of-origin state of the 14q32.2 region
          (UPD14, DMR methylation or deletion), not by sequence variants in RTL1, so CAUSATIVE would overstate
          a Mendelian relationship.'
      selected_evidence:
        snippet: RTL1 expression level becomes ~2.5 times increased in the absence of functional RTL1as-encoded
          microRNAs that act as a trans-acting repressor for RTL1
        supports: SUPPORT
