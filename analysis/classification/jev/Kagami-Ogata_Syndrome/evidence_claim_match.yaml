      assertion:
        name: Temple syndrome
        disease_term:
          preferred_term: Temple syndrome
          term:
            id: MONDO:0100507
            label: multiple congenital anomalies due to 14q32.2 paternally expressed gene defect
        description: The reciprocal 14q32.2 imprinting disorder, caused by maternal UPD14 or loss of the
          paternal contribution, with loss rather than excess of RTL1 and DLK1 and a phenotype of growth
          failure, hypotonia and early puberty.
        distinguishing_features:
        - Opposite parent-of-origin defect (maternal UPD14, paternal deletion, or IG-DMR/MEG3-DMR hypomethylation).
        - Growth failure with small hands and feet instead of preserved birth size, bell-shaped thorax
          and abdominal wall defects.
      selected_evidence:
        snippet: TS most frequently arises from maternal UPD14 or epimutations/deletions on the paternal
          chromosome, whereas KOS most frequently arises from paternal UPD14 or epimutations/deletions
          on the maternal chromosome.
        supports: SUPPORT
