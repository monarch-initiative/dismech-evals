          with UPD(14)pat or epimutation and about 2.5-fold with deletions that spare one paternal-type
          RTL1 copy. Excess RTL1, together with absent maternal transcripts, is considered the primary
          factor behind the phenotype; clinical severity tracks the degree of RTL1 overproduction.
        genes:
        - preferred_term: RTL1
          term:
            id: hgnc:14665
            label: RTL1
      selected_evidence:
        snippet: Actually, quantitative PCR analyses have indicated ~5 times, rather than 2 times, increased
          RTL1 expression level in fresh placentas with upd(14)pat, as well as doubled DLK1 expression
          level and absent MEGs expression.
        supports: SUPPORT
