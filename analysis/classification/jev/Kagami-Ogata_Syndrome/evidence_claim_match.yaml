      assertion_type: Definition
      assertion:
        name: Clinical and molecular definition
        definition_type: CASE_DEFINITION
        description: Kagami-Ogata syndrome is diagnosed in a person with the characteristic facial gestalt
          and increased coat-hanger angle of the ribs in whom molecular testing shows deficient expression
          of the maternal 14q32.2 allele, through paternal UPD14, maternal IG-DMR/MEG3-DMR hypermethylation,
          or a maternally inherited deletion or rearrangement of the region.
      selected_evidence:
        snippet: 'The diagnosis of Kagami-Ogata syndrome is established in a proband with suggestive findings
          and findings on molecular genetic testing that suggest deficient expression of the RTL1 antisense
          (RTL1as) allele of maternal origin due to one of the following: paternal uniparental disomy
          of chromosome 14'
        supports: SUPPORT
