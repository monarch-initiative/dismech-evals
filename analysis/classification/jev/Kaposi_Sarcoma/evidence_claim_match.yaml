      assertion_type: InfectiousAgent
      assertion:
        name: Human Herpesvirus 8 (HHV-8/KSHV)
        infectious_agent_term:
          preferred_term: Human gammaherpesvirus 8
          term:
            id: NCBITaxon:37296
            label: Human gammaherpesvirus 8
        description: 'HHV-8 (KSHV) is the causative agent of all forms of Kaposi sarcoma. The virus encodes
          multiple oncoproteins that drive transformation: vGPCR (viral G protein-coupled receptor) activates
          angiogenic signaling; vFLIP activates NF-kappaB for cell survival; vCyclin drives cell cycle
          progression; LANA maintains viral latency and inhibits p53 and Rb tumor suppressors. The virus
          establishes latent infection in endothelial cells, with lytic reactivation contributing to paracrine
          signaling and tumor progression.'
      selected_evidence:
        snippet: HHV8 is the etiological agent of Kaposi sarcoma, and of rare B cell lymphoproliferative
          disorders mostly observed in immunocompromised hosts (patients with AIDS, transplant organ recipients)
          such as primary effusion lymphoma and the plasma cell variant of multicentric Castleman disease.
        supports: SUPPORT
