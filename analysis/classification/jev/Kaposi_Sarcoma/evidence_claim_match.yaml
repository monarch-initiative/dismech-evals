  cd247153bb2d45b3ee118133a2163d5e27248ec565100c437aa6c639f03ca90b:
    claim:
      about:
        disease:
          name: Kaposi Sarcoma
          disease_term:
            preferred_term: Kaposi sarcoma
            term:
              id: MONDO:0005055
              label: Kaposi's sarcoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immunosuppression-Mediated Loss of CD8+ T-Cell Control of HHV-8
        description: In solid-organ transplant recipients, chronic immunosuppressive therapy impairs the
          CD8+ T-cell and NK-cell surveillance that maintains HHV-8 latency in the immunocompetent host.
          The cited review names calcineurin inhibitors, corticosteroids and T-cell-depleting agents as
          the agent classes that impair that control.
        notes: mTOR inhibitors are deliberately absent from the agent list. The same review describes
          them as exerting antiproliferative and antiangiogenic effects that may counter these mechanisms,
          and recommends conversion to sirolimus or everolimus as treatment for post-transplant Kaposi
          sarcoma - so they belong with this entry's Reduction of Immunosuppression treatment, not with
          the agents that drive reactivation.
        cell_types:
        - preferred_term: CD8-positive T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        biological_processes:
        - preferred_term: negative regulation of viral genome replication
          modifier: DECREASED
          term:
            id: GO:0045071
            label: negative regulation of viral genome replication
      selected_evidence:
        snippet: In immunocompetent hosts, CD8+ T‐cells and NK cells maintain viral latency, but chronic
          immunosuppression particularly with calcineurin inhibitors, corticosteroids, or T‐cell–depleting
          agents impairs this control, allowing viral reactivation or donor‐derived primary infection
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42549899
      reference_title: HHV-8 Infection in Solid-Organ Transplant-Pathogenesis, Epidemiology, Clinical
        Manifestations and Management.
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: Names both the effector populations that maintain latency and the three agent classes
        whose use impairs that control, which is what this node asserts.
