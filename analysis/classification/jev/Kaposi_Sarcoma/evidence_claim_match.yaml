  83d6182471e498fcd0e7edff9bde64e8a624c954fbaf73cda1cba918b54b1802:
    claim:
      about:
        disease:
          name: Kaposi Sarcoma
          disease_term:
            preferred_term: Kaposi sarcoma
            term:
              id: MONDO:0005055
              label: Kaposi's sarcoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HHV-8 Lytic Reactivation in Endothelial Cells
        description: With immune control lost, HHV-8 in the infected endothelial lineage switches from
          the latent programme to lytic replication. Lytic gene products, vGPCR and vIL-6 among them,
          drive cytokine release and angiogenic signalling, which is the route by which reactivation accelerates
          Kaposi sarcoma progression in transplant recipients.
        notes: No downstream edge is drawn to vFLIP-Mediated NF-kappaB Activation. The cited review classifies
          vFLIP with LANA-1 and vCyclin as a latent protein and vGPCR with vIL-6 as lytic, and this entry's
          own HHV-8 Latent Infection of Endothelial Cells node expresses vFLIP latently, so a claim that
          lytic reactivation raises vFLIP abundance would contradict both.
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: release from viral latency
          modifier: INCREASED
          term:
            id: GO:0019046
            label: release from viral latency
      selected_evidence:
        snippet: Latent proteins (LANA‐1, vCyclin, vFLIP) promote cell survival, whereas lytic proteins
          (vIL‐6, vGPCR) drive cytokine release and angiogenesis through IL‐6, IL‐10, VEGF, and PDGF
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42549899
      reference_title: HHV-8 Infection in Solid-Organ Transplant-Pathogenesis, Epidemiology, Clinical
        Manifestations and Management.
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: Identifies vGPCR as a lytic rather than latent product and names the angiogenic and
        cytokine output that the downstream edge carries.
