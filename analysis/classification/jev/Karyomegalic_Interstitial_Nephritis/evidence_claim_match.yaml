              label: karyomegalic interstitial nephritis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic FAN1 Loss of Function
        description: Karyomegalic interstitial nephritis is caused by biallelic loss-of-function variants
          in FAN1 (FANCD2/FANCI-associated nuclease 1), a structure-specific DNA repair nuclease. Loss
          of FAN1 activity abolishes its role in the repair of DNA interstrand crosslinks and in the protection
          and restart of stalled replication forks. KIN is genetically and clinically distinct from Fanconi
          anemia.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: structure-specific 5'-flap DNA endonuclease activity
          term:
            id: GO:0017108
            label: 5'-flap endonuclease activity
          modifier: LOSS_OF_FUNCTION
        genetic_context:
          gene:
            preferred_term: FAN1
            term:
              id: hgnc:29170
              label: FAN1
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic germline loss-of-function FAN1 variants cause KIN. Reported pathogenic
            alleles span truncating and missense changes and include the homozygous nonsense variant c.2260C>T
            (p.Arg754Ter), the recurrent European founder frameshift c.2616delA (p.Asp873ThrfsTer17),
            and the novel frameshift c.2603delT (p.Leu868ArgfsTer22).
      selected_evidence:
        snippet: By exome sequencing, we identified mutations in FAN1 as a cause of karyomegalic interstitial
          nephritis (KIN), a disorder that serves as a model for renal fibrosis.
        supports: SUPPORT
    origin:
