      assertion_type: Treatment
      assertion:
        name: Kidney Transplantation
        description: 'Renal transplantation restores renal function in KIN reaching end-stage disease,
          but carries two disease-specific hazards. First, related donors who are heterozygous FAN1 carriers
          should be avoided: transplantation from a carrier sibling has been followed by karyomegalic
          changes in the graft (donor-derived and/or recurrent KIN), so familial heterozygote donation
          should be discouraged and donors genetically screened. Second, KIN patients are at risk of fatal
          post-transplant infection, with deaths from overwhelming respiratory sepsis reported soon after
          transplantation, warranting careful adaptation of immunosuppression.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Kidney Transplantation
          term:
            id: NCIT:C15265
            label: Kidney Transplantation
      selected_evidence:
        snippet: Our patient underwent a live unrelated donor renal transplant in January 2023 and has
          been asymptomatic since ten months.
        supports: SUPPORT
