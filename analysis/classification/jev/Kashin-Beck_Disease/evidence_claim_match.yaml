      assertion_type: Discussion
      assertion:
        discussion_id: kbd_vascular_direction
        kind: INTERPRETATION
        prompt: Is the epiphyseal plate in Kashin-Beck disease under-vascularised or over-vascularised?
        rationale: 'Two curated observations point opposite ways, and this entry records both rather than
          choosing. The 2001 histology of phalanges from affected children found the proximal cartilage
          end plate unvascularised, and proposed that the disease develops from a failure of metaphyseal
          angiogenesis. The 2026 type H vessel work found the opposite in the rat - vessels proliferating
          at the epiphyseal plate, delivering more toxin, with the loop demonstrated pharmacologically
          in both directions. They are not necessarily in conflict: different species, different bones,
          different stages, and "vascularisation of the cartilage end plate" and "type H vessel density
          at the plate" are not the same measurement. But nothing curated here reconciles them, and the
          pathograph currently carries only the proliferative reading as an edge.'
        attaches_to:
        - pathophysiology#Type H Vessel Proliferation at the Epiphyseal Plate
        - pathophysiology#Endochondral Ossification Failure at the Growth Plate
      selected_evidence:
        snippet: These observations suggest that Kashin-Beck disease could develop from an alteration
          of the angiogenesis of the metaphyseal cartilage resulting in degeneration with consequent joint
          dysplasia, which may be associated with a decrease in growth of the diaphyseal bones.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
