          with the clinical finger grading, so the two scales are not interchangeable.
        notes: The same paper reports that ankle radiographic grade correlates only weakly with the clinical
          grading of the fingers, and that ankle pain and finger grading are essentially uncorrelated.
          That is recorded here rather than in the description because it qualifies the method rather
          than describing it.
      selected_evidence:
        snippet: The X-ray grading of adult KBD ankles was conducted using the Kellgren-Lawrence grading
          as a reference.
