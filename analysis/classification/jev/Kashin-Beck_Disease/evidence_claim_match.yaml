  90c7f0ac8909cb5df69754b5a1d092ffb2a5658bc09323ce88c36dabea0747ed:
    claim:
      about:
        disease:
          name: Kashin-Beck Disease
          disease_term:
            preferred_term: Kashin-Beck disease
            term:
              id: MONDO:0005610
              label: Kashin-Beck disease
        context: []
      assertion_type: AnimalModel
      assertion:
        name: T-2 toxin plus selenium-deficient diet rat
        species: Rat
        genotype: Wild type
        description: 'Sprague-Dawley rats fed a selenium-deficient diet for four weeks and then exposed
          to T-2 toxin for four more. The field''s workhorse model, and the one that makes the compound-etiology
          hypothesis tractable: the deep-zone lesion that resembles the human disease appears only in
          the groups given both.'
        publication: PMID:22258458
        modeled_mechanisms:
        - target: Mixed-Mode Chondrocyte Death in Deep and Middle Cartilage Zones
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Apoptosis and necroptosis co-exist in the middle zone of the model's cartilage,
            as they do in children with the disease, and the deep-zone chondronecrosis is described as
            very similar to the human lesion.
          limitations: A four-week rodent exposure is not a childhood in an endemic village, and the model
            delivers a fixed toxin dose rather than the variable, seasonal contamination of a real grain
            store. It also cannot address the fulvic-acid or iodine hypotheses, since neither water composition
            nor iodine status is a variable in it.
          divergences:
          - divergence_type: TEMPORAL_SCOPE
            materiality: QUALIFYING
            description: Weeks of controlled feeding stand in for years of intermittent childhood exposure
              during active growth; the model compresses the timescale the disease is defined on.
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: Drinking-water composition and iodine status are outside the model, so it cannot
              speak to two of the four hypotheses this entry curates.
        - target: Endochondral Ossification Failure at the Growth Plate
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: TISSUE
          description: The rat's growth-plate chondronecrosis is explicitly not similar to the human lesion,
            which is the failure this entry records rather than smooths over. The primary report attributes
            it to the rat's growth plates never closing.
          limitations: The rat does not close its growth plates, so the epiphyseal closure that defines
            the human childhood disease cannot occur. Any inference from this model to the growth-plate
            node is therefore unsafe, and the model's value is at the articular cartilage instead.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: INVALIDATING
            description: Rat epiphyseal growth plates remain open through life. The human disease is defined
              by damage to a plate that then closes early, and the model has no counterpart to that event.
        - target: Selenoenzyme Antioxidant Capacity Deficit
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: 'The model reproduces the biochemical deficit directly: antioxidant enzyme activity
            and mRNA down, lipid peroxidation up, in both serum and cartilage.'
          limitations: The measurements are of the model's own biochemistry; no matching serum or cartilage
            antioxidant panel from patients is curated in this entry, so the correspondence to human tissue
            is assumed rather than shown here.
      selected_evidence:
        snippet: In conclusion, the rhesus monkeys administrated endemic water and grain were susceptible
          animals to replicate KBD. The rats treated with T-2 toxin combined with Se/nutrition deficiency
          could be a suitable and widely used animal model.
        supports: SUPPORT
    origin:
