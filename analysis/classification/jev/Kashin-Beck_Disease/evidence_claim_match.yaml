        context: []
      assertion_type: Treatment
      assertion:
        name: Grain Replacement
        description: Replacing the locally grown, mycotoxin-contaminated staple grain with grain from
          outside the endemic area. Tied with comprehensive multi-component programmes as the most effective
          primary prevention tested, at a pooled odds ratio of 0.15 for new incidence in healthy children.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: replacement of the contaminated staple grain supply
          term:
            id: NCIT:C15843
            label: Preventive Intervention
        notes: '`therapeutic_modality: BEHAVIORAL` deliberately, where `Drinking Water Improvement` below
          is `OTHER`: the enum''s `BEHAVIORAL` description explicitly covers dietary intervention, and
          what the household eats changes here. Replacing a village water supply changes nothing about
          what anyone does.'
      selected_evidence:
        snippet: The pooled odds ratios (ORs) and confidence intervals (95% CIs) for primary prevention
          new incidence in healthy children following interventions to comprehensive measures, change
          of grain, salt-rich selenium, and improvements of water were 0.15 (0.02, 0.95), 0.15 (0.03,
          0.70), 0.19 (0.09, 0.38), and 0.20 (0.09, 0.42), respectively.
        supports: SUPPORT
