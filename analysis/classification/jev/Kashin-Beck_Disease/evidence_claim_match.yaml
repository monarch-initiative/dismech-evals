      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: iodine_deficiency
        hypothesis_label: Iodine deficiency and hypothyroidism
        status: ALTERNATIVE
        description: 'The Tibetan arm of the etiology, and the one this entry previously omitted. Endemic
          areas around Lhasa are iodine-deficient as well as selenium-poor, and low urinary iodine - not
          low serum selenium - is the exposure that survived multivariate adjustment in the Tibetan survey.
          Correcting iodine, not selenium, was what let growth-retarded children recover height. Curated
          ALTERNATIVE: the epidemiological association is strong and replicated in an intervention, but
          no cartilage-level mechanism linking thyroid status to the growth-plate lesion is curated here.'
      selected_evidence:
        snippet: In areas where severe selenium deficiency is endemic, iodine deficiency is a risk factor
          for Kashin-Beck disease.
        supports: SUPPORT
