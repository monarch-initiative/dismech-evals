  ee3862299b1bc1ca9866ead48c9c0b272057147774f29bcf07cfa7a1c04201fe:
    claim:
      about:
        disease:
          name: Kashin-Beck Disease
          disease_term:
            preferred_term: Kashin-Beck disease
            term:
              id: MONDO:0005610
              label: Kashin-Beck disease
        context: []
      assertion_type: Treatment
      assertion:
        name: Arthrodesis and Reconstructive Surgery of the Damaged Joint
        description: Surgical salvage of an end-stage joint. The curated case is a conservative tibiotalocalcaneal
          fusion for talar avascular necrosis with ankle and subtalar arthritis in a 50-year-old patient,
          achieving bony union and a plantigrade foot at four months. Recorded because a disease whose
          adult burden is fixed joint deformity has a surgical arm, and this entry previously had none.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: tibiotalocalcaneal arthrodesis
          term:
            id: NCIT:C52007
            label: Arthrodesis
        notes: '`NCIT:C52007` (Arthrodesis) replaces the `NCIT:C16186` (Orthopedic Surgical Procedure)
          this record first carried. `C52007` sits directly under `C16186` and is reachable from `NCIT:C25218`,
          so it is the more specific term that still accurately represents the claim, which is what the
          ontology contract asks for. NCIT does carry `NCIT:C220188` (Tibiotalar Arthrodesis), but that
          names a tibia-talus fusion and the procedure here is tibiotalo*calcaneal* - a different, larger
          fusion, not a narrower case of it - so binding it would be wrong rather than merely specific.
          The full specificity stays in `preferred_term`.

          This is one patient. The evidence base for surgery in this disease is a case literature, which
          is exactly what the network meta-analysis says, and both are recorded here rather than only
          the encouraging half. The case is also unusual on its own terms - its authors note talar avascular
          necrosis is rarely reported in this disease - so it should not be read as the typical surgical
          indication.'
      selected_evidence:
        snippet: A conservative tibiotalocalcaneal fusion attempting to preserve as much viable talar
          body as possible was performed using a humeral locking plate and 2 cannulated compression screws.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/8
      evidence_path: /treatments/8/evidence/0
      context_paths:
      - /name
      - /disease_term
