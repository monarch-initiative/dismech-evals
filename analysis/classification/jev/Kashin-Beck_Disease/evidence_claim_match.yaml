      assertion_type: Environmental
      assertion:
        name: Habitual consumption of grain contaminated with Fusarium T-2 trichothecene mycotoxin
        description: Grain grown and stored in endemic highland areas carries T-2 toxin from Fusarium
          species. The toxin is directly chondrotoxic, and replacing the grain supply is the single most
          effective preventive measure tested - which is the strongest practical argument that this exposure
          is doing real causal work rather than travelling with something else.
        exposure_term:
          preferred_term: dietary exposure to Fusarium T-2 trichothecene mycotoxin in stored grain
          term:
            id: ECTO:0000524
            label: exposure to mycotoxin
        exposure_classifications:
          hazard_agent_type:
          - classification_value: BIOLOGICAL
            notes: Classified biological because the agent is a fungal secondary metabolite, on the same
              reasoning that makes `Byssinosis` BIOLOGICAL for bacterial endotoxin, rather than CHEMICAL
              as for the mineral-dust entries.
          exposure_route:
          - classification_value: ORAL
          exposure_duration:
          - classification_value: CHRONIC
          exposome_domain:
          - classification_value: SPECIFIC_EXTERNAL
        notes: 'No IARC group is recorded: IARC has not classified T-2 toxin in a group this entry would
          be entitled to assert, and Kashin-Beck disease is not a neoplastic outcome.'
      selected_evidence:
        snippet: Gradually, four etiological hypotheses have been formed, including water of organic poisoning
          hypothesis represented by fulvic acid (FA), biogeochemical hypothesis represented by selenium
          (Se) deficiency, food mycotoxin poisoning hypothesis represented by T-2 toxin poisoning and
          compound etiology theory hypothesis.
        supports: SUPPORT
    origin:
