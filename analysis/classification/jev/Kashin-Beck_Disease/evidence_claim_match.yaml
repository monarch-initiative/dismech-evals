      assertion_type: Discussion
      assertion:
        discussion_id: kbd_etiology_unresolved
        kind: CONTROVERSY
        prompt: Which environmental factor - selenium deficiency, iodine deficiency, T-2 toxin, a water
          constituent, or an obligate combination - actually causes Kashin-Beck disease?
        rationale: 'Seventy years of work has produced four standing single-factor hypotheses and no resolution,
          which is why this entry curates all of them alongside the compound reading rather than asserting
          one. Recorded as a CONTROVERSY rather than a knowledge gap: the positions are published and
          in live disagreement, not merely absent. Each has real support and a real problem. Selenium
          deficiency has the selenoprotein association data and the preventive trials - but soil selenium
          is as low in non-endemic villages, and a randomised trial found selenium useless for established
          disease once iodine was replaced. Iodine deficiency survives multivariate adjustment where selenium
          does not, and its replacement restored growth - but no cartilage-level mechanism connects it
          to the lesion. T-2 toxin has the best animal model and the most effective intervention - but
          the model needs a deficient diet alongside it, and the growth-plate lesion it produces is explicitly
          unlike the human one. Fulvic acid has the water-improvement result and a 1999 free-radical mechanism,
          and almost nothing since. The gap matters because the disease is being eliminated by measures
          that address all of them at once, so the natural experiment that would separate them is closing.'
        attaches_to:
        - pathophysiology#Chronic Dietary Selenium Deficiency
        - pathophysiology#Dietary T-2 Toxin Exposure
        - pathophysiology#Iodine Deficiency and Hypothyroidism
        - pathophysiology#Fulvic Acid Free-Radical Generation in Cartilage
        - mechanistic_hypotheses#compound_etiology
      selected_evidence:
        snippet: Although none of the competing theories prevails when they are compared using a predefined
          and standard set of causality criteria (temporality, strength of the association, biological
          gradient, experimental evidence, biological plausibility, coherence, specificity and analogy),
          none should be discounted.
        supports: SUPPORT
