              label: Kashin-Beck disease
        context: []
      assertion_type: Environmental
      assertion:
        name: Residence on selenium-poor soil with correspondingly low dietary selenium
        description: Endemic areas sit on soils low in selenium, and the population eats what grows there.
          This is an exposure by absence, which is why it is curated separately from the mycotoxin rather
          than folded into a single "endemic diet" entry - the interventions that address it, selenium
          salt and supplementation, are different interventions.
        exposure_term:
          preferred_term: low dietary selenium intake from selenium-poor soil
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
            notes: Recorded CHEMICAL because the agent is an element, though the hazard is its absence
              rather than its presence - a case the vocabulary does not distinguish.
          exposure_route:
          - classification_value: ORAL
          exposure_duration:
          - classification_value: CHRONIC
          exposome_domain:
          - classification_value: GENERAL_EXTERNAL
            notes: Recorded GENERAL_EXTERNAL rather than SPECIFIC_EXTERNAL because the determinant is
              the regional geochemistry of the food supply, not a discrete personal exposure.
        notes: '`exposure_term` is left unbound. ECTO was searched for a selenium-deficiency exposure
          and has none: `ECTO:0900038` (exposure to selenium via ingestion), `ECTO:9000950` (exposure
          to selenium) and `ECTO:9000192` (exposure to selenium ion) all denote the presence of the element,
          which is the opposite of the exposure here. ECTO does carry the pattern this needs elsewhere
          - `ECTO:0400019` is "exposure to decreased protein in food" - so an "exposure to decreased selenium
          in food" term is the natural new-term request, and that template is recorded here so the next
          curator does not have to rediscover it. A wrong binding would be worse than none.'
      selected_evidence:
        snippet: The results showed that the average soil selenium content in both endemic and non-endemic
          villages across the six provinces was below 0.2 mg/kg.
        supports: SUPPORT
