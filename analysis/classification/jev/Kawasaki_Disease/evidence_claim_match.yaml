            description: An acute febrile vasculitis of childhood primarily affecting medium-sized arteries
              with risk of coronary artery complications.
            term:
              id: MONDO:0012727
              label: Kawasaki disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_kawasaki_hif2_hypoxia_signaling
        prompt: What is the role of hypoxia-inducible factor 2 (HIF2) signaling in Kawasaki disease coronary
          arteritis, vascular remodeling, and thrombosis? Does HIF2 activation represent a primary mechanism
          in KD pathogenesis or a secondary consequence of inflammatory hypoxia?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Vascular Inflammation
        rationale: While the canonical KD pathophysiology centers on immune dysregulation (IL-1β/IL-6/Th17/NLRP3
          inflammasome) driving endothelial activation and neutrophilic vasculitis, the specific role
          of the hypoxia-inducible factor pathway in coronary complications remains unexplored in human
          KD. Recent preclinical evidence (conditional Vhl deletion in Wt1+ cardiac vascular cells) demonstrates
          that HIF2α activation alone is sufficient to trigger coronary artery dilation, pericardial hemorrhage,
          thrombosis, and systemic inflammation recapitulating key KD phenotypes. Human KD coronary lesions
          show HIF2 and HIF1 expression in inflammatory infiltrates and remodeling zones. However, the
          upstream trigger(s) of VHL/HIF2 dysregulation in KD vasculature, whether HIF2 is a primary driver
          or amplifier of immune-mediated vascular injury, and whether HIF stabilization/inhibition is
          a therapeutic target remain unknown. The gap spans mechanistic questions (does KD-associated
          hypoxic microenvironment or cytokine signaling directly activate HIF2?) and translational questions
          (can HIF2 inhibitors prevent coronary complications in IVIG-resistant KD?).
        proposed_experiments:
        - experiment_id: exp_kd_hif2_patient_cohorts
          name: Characterize VHL/HIF2 pathway activation in KD patient samples
          description: Perform immunohistochemistry and immunofluorescence on archived KD coronary biopsy/autopsy
            specimens to quantify HIF1α/HIF2α nuclear translocation, VHL expression, and HIF target gene
            transcripts (VEGFA, BNIP3, CAIX) in coronary lesions versus control arteries. Correlate HIF
            pathway activation with severity of vasculitis, thrombosis, and IVIG-responsiveness in a prospective
            cohort.
          experiment_type:
            preferred_term: immunohistochemistry
        - experiment_id: exp_kd_hif2_mechanism_inflammatory_hypoxia
          name: Test whether KD patient plasma induces HIF2 activation in endothelial cells
          description: Culture coronary artery endothelial cells (CAECs) from healthy controls or patient
            iPSC-derived sources and expose them to serum from acute-phase KD patients versus controls.
            Measure HIF2α nuclear translocation, target gene induction (VEGFA, CAIX), and endothelial
            barrier function via TEER and permeability assays. Determine if hypoxia versus inflammatory
            cytokines (IL-1β, IL-6, TNF-α) preferentially activate HIF2 and whether HIF2 inhibition prevents
            CAEC dysfunction induced by KD plasma.
          experiment_type:
            preferred_term: in vitro cell culture experiment
        - experiment_id: exp_kd_hif2_therapeutic_validation
          name: Test HIF2 inhibition as a therapeutic strategy in KD animal models
          description: Use established KD-like mouse models (IL-1β transgenic, TNF-inducible, or Candida
            wall component injection) and administer HIF2-selective inhibitors (e.g., PT2385 or belzutifan/PT2977)
            or genetic Hif2a heterozygosity. Assess whether HIF2 modulation reduces coronary lesions,
            systemic inflammation, NLRP3 inflammasome activation, and thrombosis. Prioritize IVIG-resistant
            cohorts to test HIF2 inhibition as an adjunctive strategy for refractory KD.
          experiment_type:
            preferred_term: in vivo animal model experiment
      selected_evidence:
        snippet: Human KD cardiac samples showed expression of HIF2 in coronary lesions and surrounding
          inflammatory infiltrates, confirming hypoxia pathway activation in severe KD.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42253052
      reference_title: Activation of HIF2 in Cardiac Vasculature Leads to Arterial Remodeling, Dilation,
        Thrombosis, and Inflammation, Recapitulating Cardiac Involvement in Kawasaki Disease.
      evidence_source: HUMAN_CLINICAL
      explanation: Immunohistochemistry on human KD cardiac samples confirmed HIF2 expression in coronary
        lesions and surrounding inflammatory infiltrates, supporting the translational relevance of the
        hypoxia pathway axis in severe human KD.
