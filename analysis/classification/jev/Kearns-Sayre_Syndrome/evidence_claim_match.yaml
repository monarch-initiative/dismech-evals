            preferred_term: Kearns-Sayre syndrome
            term:
              id: MONDO:0010787
              label: Kearns-Sayre syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Single Large-Scale mtDNA Deletion in Post-Mitotic Tissues
        description: Kearns-Sayre syndrome is caused by a single large-scale deletion of mitochondrial
          DNA (1.1-10 kb), usually sporadic and heteroplasmic. The most common single lesion is the ~4.9
          kb "common deletion" (m.8470_13446). Deleted genomes are detected in affected tissues such as
          skeletal muscle; the proportion of deleted mtDNA, rather than a nuclear-gene defect, determines
          whether high-energy post-mitotic tissues cross the bioenergetic threshold.
        role: trigger
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: mitochondrial DNA metabolic process
          term:
            id: GO:0032042
            label: mitochondrial DNA metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: seven of seven patients with Kearns-Sayre syndrome (KSS).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
