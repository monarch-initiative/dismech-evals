        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Secondary Cellular Stress Response
        description: 'Beyond the primary bioenergetic deficit, KSS cells show relatively underemphasized
          secondary responses: reactive oxygen species overproduction, mitochondrial protein-synthesis
          inhibition, dysregulated autophagy, and apoptosis, with oligodendrocyte involvement and myelin
          vacuolation/demyelination. This cellular injury drives the downstream CNS white-matter pathology
          (bilateral globus pallidus and white-matter lesions on brain imaging).'
        role: consequence
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: reactive oxygen species metabolic process
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
          modifier: INCREASED
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: ABNORMAL
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: little attention has been paid to other reports on ROS overproduction, protein synthesis
          inhibition, myelin vacuolation, demyelination, autophagy, apoptosis, and involvement of lipid
          raft and oligodendrocytes in KSS
        supports: SUPPORT
