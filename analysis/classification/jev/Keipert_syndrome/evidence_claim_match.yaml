  887b6e391375633714278e9338c5f6bcde5a9ee977fa28b2a766356516321280:
    claim:
      about:
        disease:
          name: Keipert syndrome
          disease_term:
            preferred_term: Keipert syndrome
            term:
              id: MONDO:0009720
              label: Keipert syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GPC4 loss of function
        description: Keipert syndrome is caused by pathogenic GPC4 variants that destabilize or truncate
          glypican 4, a cell-surface heparan sulfate proteoglycan that regulates growth-factor signaling
          during development. Pathogenic alleles include final-exon C-terminal truncating variants (which
          cause loss of N-linked glycosylation at Asn514 and the glycosylphosphatidylinositol [GPI] anchor
          site at Ser529 and reduce protein stability) as well as earlier nonsense and canonical splice-site
          variants, perturbing morphogenetic signaling gradients required for normal craniofacial, lacrimal,
          and limb patterning.
        gene:
          preferred_term: GPC4
          description: Glypican 4 cell-surface heparan sulfate proteoglycan.
          modifier: DECREASED
          term:
            id: hgnc:4452
            label: GPC4
        genes:
        - preferred_term: GPC4
          term:
            id: hgnc:4452
            label: GPC4
      selected_evidence:
        snippet: Overall, we have shown that pathogenic variants in GPC4 cause a loss of function that
          results in Keipert syndrome
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
