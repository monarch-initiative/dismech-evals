          3 trial failed to confirm overall benefit; these remain investigational outside Japan. Note
          that the relationship between androgens and muscle is complex, as testosterone levels correlate
          positively with muscle strength in patients.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
