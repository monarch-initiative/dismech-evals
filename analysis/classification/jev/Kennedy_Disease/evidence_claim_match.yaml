          - preferred_term: dutasteride
            term:
              id: CHEBI:521033
              label: dutasteride
      selected_evidence:
        snippet: The direct correlation of testosterone levels with muscle strength indicates that androgens
          may have a positive effect on muscle function in spinal and bulbar muscular atrophy patients,
          in addition to the toxic effects described in animal models.
        supports: SUPPORT
