        mechanism_confidence: PROVISIONAL
        description: Gap-junction communication in the human corneal epithelium is carried by Cx26, Cx30,
          Cx31.1 and Cx43. The common D50N mutant fails to form corneal gap-junction plaques, and the
          resulting epithelial dysfunction produces recurrent epithelial defects, corneal surface instability,
          limbal stem cell deficiency, and the progressive stromal vascularization that defines the "keratitis"
          of KID and can end in scarring and blindness.
