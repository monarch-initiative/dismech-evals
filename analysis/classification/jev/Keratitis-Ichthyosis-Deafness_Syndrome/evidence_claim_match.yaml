              label: autosomal dominant keratitis-ichthyosis-hearing loss syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous Gain-of-Function GJB2 Missense Variant
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: The initiating lesion. A single GJB2 allele carries a missense change that substitutes
          a conserved residue in the cytoplasmic N-terminus or first extracellular loop of connexin 26
          - the domains controlling channel gating and permeability. Unlike the recessive loss-of-function
          alleles at this locus, which give nonsyndromic deafness only, these alleles produce a channel
          that is still made and delivered but behaves aberrantly. p.D50N is by far the most common; p.S17F
          and p.G12R are recurrent; p.G45E and p.A88V cause a lethal neonatal form.
        genes:
        - preferred_term: GJB2
          term:
            id: hgnc:4284
            label: GJB2
        genetic_context:
          genes:
          - preferred_term: GJB2
            term:
              id: hgnc:4284
              label: GJB2
          zygosity: HETEROZYGOUS
          variant_origin: DE_NOVO
          functional_impact_category: GAIN_OF_FUNCTION
          notes: 'Recorded as GAIN_OF_FUNCTION at the variant level: the mutant subunit adds a pathological
            activity (aberrant hemichannel opening) rather than merely failing, which is what distinguishes
            syndromic KID alleles from the recessive nonsyndromic null alleles at the same locus. Several
            alleles additionally exert a dominant-negative effect on co-expressed connexins (see downstream
            nodes), so a single category cannot capture every allele''s full behaviour.'
      selected_evidence:
        snippet: Since nonsyndromic deafness is predominantly a loss-of-function disorder, it follows
          that the syndromic mutants must show an alteration, or gain, of function to cause skin disease.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19939300
      reference_title: Connexin-26 mutations in deafness and skin disease.
      evidence_source: OTHER
      explanation: States the loss-of-function-versus-gain-of-function logic that classifies KID alleles
        as gain-of-function. INDIRECT because it is a review's inference from the genotype-phenotype pattern
        rather than a direct assay of one allele.
