      assertion_type: Discussion
      assertion:
        discussion_id: kid_homomeric_vs_heteromeric_mechanism
        kind: CONTROVERSY
        prompt: Is the pathogenic hemichannel in KID homomeric Cx26, or does it require heteromeric assembly
          with Cx43/Cx30?
        attaches_to:
        - pathophysiology#Hyperactive Connexin 26 Hemichannels
        - pathophysiology#Aberrant Heteromeric Interaction with Cx43 and Cx30
        rationale: 'Most alleles form hyperactive homomeric hemichannels, which is the canonical account,
          but S17F forms non-functional homomeric hemichannels yet causes severe disease, and only becomes
          hyperactive when co-expressed with Cx43 or Cx30. Whether the heteromeric route is a special
          case for a few alleles or the general mechanism for all N-terminal syndromic mutations is unresolved,
          and it matters for therapy: an allele-agnostic hemichannel blocker versus an allele-specific
          silencing approach make different bets on this question.'
      selected_evidence:
        snippet: some syndromic mutations, like Cx26S17F, lead to non-functional HCs, but they still developed
          a severe KID syndrome phenotype
        supports: SUPPORT
    origin:
