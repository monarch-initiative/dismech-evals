        mechanism_confidence: ESTABLISHED
        description: 'The hyperproliferative, poorly differentiated epidermis produces a defective stratum
          corneum: transgenic KID mice show impaired epidermal calcium homeostasis and an abnormal stratum-corneum
          lipid composition that degrades the water barrier, clinically visible as erythrokeratoderma,
          ichthyosiform scaling, palmoplantar keratoderma and follicular hyperkeratosis. This entry does
          NOT conform to the epidermal_cornification_failure module: that module scopes itself to primary
          lesions of the terminal cornification enzymes/structural proteins (TGM1, FLG, ALOX, ABCA12,
          STS, SPINK5), whereas here the barrier failure is secondary to connexin-driven keratinocyte
          dysregulation.'
        locations:
        - preferred_term: epidermis
          term:
            id: UBERON:0001003
            label: skin epidermis
        biological_processes:
        - preferred_term: establishment of skin barrier
          term:
            id: GO:0061436
            label: establishment of skin barrier
          modifier: DECREASED
      selected_evidence:
        snippet: Transgenic mouse models expressing connexin26 KID mutations reproduce human phenotypes
          and present impaired epidermal calcium homeostasis and abnormal lipid composition of the stratum
          corneum affecting the water barrier.
        supports: SUPPORT
