        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hyperactive Connexin 26 Hemichannels
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Connexins oligomerise into hexameric hemichannels (connexons); in non-junctional
          membrane an undocked hemichannel connects the cytoplasm to the extracellular space. Syndromic
          Cx26 mutants form hemichannels that open when they should be closed. The two best-characterised
          aberrations are loss of the normal restraint by extracellular calcium (the channels stay open
          at physiological Ca2+, as for A40V and D50N) and, for some alleles, a channel that is itself
          directly permeable to calcium (G45E). The result is an inappropriate conductance across the
          plasma membrane that has been measured as increased whole-cell hemichannel current for D50N,
          D50A, A88V, G12R, G45E and A40V, and which accelerates cell death in low extracellular calcium.
        molecular_functions:
        - preferred_term: gap junction hemichannel activity
          term:
            id: GO:0055077
            label: gap junction hemi-channel activity
          modifier: GAIN_OF_FUNCTION
        biological_processes:
        - preferred_term: calcium ion transmembrane transport
          term:
            id: GO:0070588
            label: calcium ion transmembrane transport
          modifier: INCREASED
      selected_evidence:
        snippet: A40V produces leaky hemichannels, whereas G45E provides a route for excessive entry of
          Ca(2+).
        supports: SUPPORT
    origin:
