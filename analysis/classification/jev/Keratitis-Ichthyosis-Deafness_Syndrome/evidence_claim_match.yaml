        name: Autosomal dominant
        description: A single heterozygous GJB2 (or, rarely, GJB6) missense variant is sufficient. Most
          cases are sporadic de novo events - more than 90% of published cases - but vertical transmission
          through affected pedigrees is documented, and the recurrence of an identical allele in siblings
          of unaffected parents has been traced to germline (gonadal) mosaicism, which is important for
          genetic counselling of the lethal neonatal form.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
      selected_evidence:
        snippet: One of these mutations was detected in six unrelated sporadic case subjects and also
          segregated in one family with vertical transmission of KID. These results indicate the presence
          of a common, recurrent mutation and establish its autosomal dominant nature.
        supports: SUPPORT
