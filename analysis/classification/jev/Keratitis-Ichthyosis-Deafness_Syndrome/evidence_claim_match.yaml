        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: Barrier failure plus a keratinocyte-intrinsic immune defect predisposes to chronic
          mucocutaneous candidiasis and recurrent bacterial superinfection. Beyond the physical barrier,
          KID keratinocytes down-regulate immune response-associated genes (IL15, CCL5, IL1A, IL23R, TLR5),
          and their hemichannels amplify inflammatory ATP signalling in response to Staphylococcus aureus
          peptidoglycan. Chronic infection and inflammation, together with the intrinsic proliferative
          drive, create the microenvironment in which squamous cell carcinoma arises.
