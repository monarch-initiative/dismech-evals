          and first extracellular loop of connexin 26. p.D50N is by far the commonest (~86% of a European
          cohort); p.S17F is recurrent and associated with a more severe skin phenotype and tongue carcinoma;
          p.G12R and p.A40V occur; p.G45E and p.A88V cause a lethal neonatal form. The same gene carries
          the recessive nonsyndromic loss-of-function alleles (DFNB1) and the dominant nonsyndromic form
          (DFNA3A), which are separate KB entries - a heterozygous GJB2 variant is assigned to this entry
          only with the syndromic skin/eye phenotype.
