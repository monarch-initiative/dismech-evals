      assertion_type: Discussion
      assertion:
        discussion_id: kid_cochlear_hemichannel_to_deafness
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does supporting-cell hemichannel hyperactivity actually cause the human sensorineural
          deafness of KID, given that the direct demonstration is in a mouse cochlea and Cx26 is absent
          from hair cells?
        attaches_to:
        - pathophysiology#Cochlear Supporting Cell Hemichannel Hyperactivity
        - pathophysiology#Sensorineural Hair Cell Dysfunction
        rationale: 'The cochlear mechanism rests on a Cx26-S17F knock-in mouse showing hyperactive supporting-cell
          hemichannels and stereocilia loss, plus a single human temporal bone (G45E) showing neuroepithelial
          dysplasia. No coupling or hemichannel measurement exists in a human KID cochlea, and the causal
          step from a supporting-cell leak to hair cell death is inferred rather than measured in human
          tissue. It is a mismatch, not an absence of evidence: the mouse result is clean but is one allele
          in one species.'
        proposed_experiments:
        - experiment_id: kid_cochlear_supporting_cell_readout
          name: Supporting-cell hemichannel activity and hair cell survival across KID alleles
          description: Measure supporting-cell hemichannel current and hair cell survival in cochlear
            explants carrying the common human KID alleles (D50N, S17F) at native connexin stoichiometry,
            and test whether a hemichannel blocker preserves hair cells.
          would_support:
          - pathophysiology#Cochlear Supporting Cell Hemichannel Hyperactivity
          supporting_outcome:
          - Hyperactive supporting-cell hemichannels and hair cell loss are reproduced by the common human
            alleles and are prevented by hemichannel blockade.
          would_refute:
          - pathophysiology#Cochlear Supporting Cell Hemichannel Hyperactivity
          refuting_outcome:
          - Supporting-cell hemichannel activity is normal for the common alleles, so the deafness requires
            a mechanism other than the supporting-cell leak.
      selected_evidence:
        snippet: GJB2 mutations can cause deafness in KID syndrome, and possibly in other GJB2 mutant
          phenotypes, by disrupting cochlear differentiation.
        supports: SUPPORT
        directness: INDIRECT
