        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cochlear Supporting Cell Hemichannel Hyperactivity
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: Cx26 is not expressed in cochlear hair cells but is expressed throughout the non-sensory
          (supporting) epithelial cells. In a Cx26-S17F knock-in mouse cochlea, supporting cells develop
          hyperactive hemichannels - forming with Cx30, and insensitive to hemichannel blockers, calcium
          and lanthanum - that admit excess calcium and cause cellular damage, accompanied by loss of
          hair cell stereocilia. This relocates the syndromic deafness lesion to a leaky hemichannel in
          the supporting-cell network rather than to loss of potassium recycling, the account for the
          recessive nonsyndromic form.
        cell_types:
        - preferred_term: organ of Corti supporting cell
          term:
            id: CL:0002490
            label: organ of Corti supporting cell
        locations:
        - preferred_term: spiral organ of Corti
          term:
            id: UBERON:0002227
            label: spiral organ of cochlea
        molecular_functions:
        - preferred_term: gap junction hemichannel activity
          term:
            id: GO:0055077
            label: gap junction hemi-channel activity
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: cochlear explants from a constitutive knock-in Cx26S17F mouse or conditional in vitro
          cochlear expression of Cx26S17F produces hyperactive HCs in supporting cells of the organ of
          Corti. These conditions also produce loss of hair cells stereocilia.
        supports: SUPPORT
