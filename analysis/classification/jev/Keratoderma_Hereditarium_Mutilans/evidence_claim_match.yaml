            label: keratinocyte differentiation
      selected_evidence:
        snippet: 'Mutant loricrin, as a dominant negative disrupter, is not likely to affect cornified
          cell envelope crosslinking directly, but seems to interfere with nuclear/nucleolar functions
          of differentiating keratinocytes.

          '
        supports: SUPPORT
