      assertion:
        name: Differential diagnosis among palmoplantar keratodermas and ichthyoses
        diagnosis_term:
          preferred_term: diagnostic procedure of skin
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        description: 'Distinguish keratoderma hereditarium mutilans from other hereditary and acquired
          palmoplantar keratodermas, including Bart-Pumphrey syndrome, Clouston syndrome, Olmsted syndrome,
          Mal de Meleda, and generalized ichthyoses, using pseudoainhum severity, starfish keratoses,
          hearing status, ichthyosis, family history, and molecular results.

          '
        results: 'The combination of pseudoainhum with subtype-specific hearing loss or ichthyosis guides
          whether the diagnosis is classic GJB2-associated Vohwinkel syndrome, LOR-associated loricrin
          keratoderma, or another palmoplantar keratoderma/ichthyosis syndrome.

          '
      selected_evidence:
        snippet: 'A PPK may be an isolated finding or part of a syndrome with extracutaneous involvement.

          '
        supports: SUPPORT
