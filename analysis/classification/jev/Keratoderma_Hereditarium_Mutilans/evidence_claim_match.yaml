          '
        results: 'Classic GJB2-associated disease is suggested by the full triad of honeycomb-pattern
          PPK, pseudoainhum, and sensorineural hearing loss; the LOR-associated variant is suggested by
          honeycomb PPK and pseudoainhum with ichthyosis and without deafness.

          '
      selected_evidence:
        snippet: 'loricrin keratoderma, presents as a honeycomb PPK with pseudoainhum with the addition
          of ichthyosis; deafness is not a feature of this ichthyosiform variant.

          '
