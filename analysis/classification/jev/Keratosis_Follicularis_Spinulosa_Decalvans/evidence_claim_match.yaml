          modifier: DECREASED
        biological_processes:
        - preferred_term: sterol metabolic process
          term:
            id: GO:0016125
            label: sterol metabolic process
          modifier: DECREASED
        - preferred_term: endoplasmic reticulum unfolded protein response
          term:
            id: GO:0030968
            label: endoplasmic reticulum unfolded protein response
          modifier: ABNORMAL
      selected_evidence:
        snippet: MBTPS2 is required for cleavage of sterol regulatory element-binding proteins (SREBPs).
          In vitro functional expression studies of the c.1523A>G mutation showed that sterol responsiveness
          was reduced by half.
        supports: SUPPORT
