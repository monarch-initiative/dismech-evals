        description: MBTPS2 encodes site-2 protease, an intramembrane protease required for regulated
          cleavage of membrane-tethered transcription factors including SREBP and ATF6. KFSD-associated
          MBTPS2 missense variants reduce sterol responsiveness and plausibly perturb lipid homeostasis
          and unfolded-protein responses in follicular keratinocytes.
        genes:
        - preferred_term: MBTPS2
