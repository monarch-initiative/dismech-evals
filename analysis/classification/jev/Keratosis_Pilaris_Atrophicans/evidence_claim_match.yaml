                mapping_justification: MONDO models "ulerythema ophryogenesis" (MONDO:0018086) and "keratosis
                  pilaris atrophicans faciei" (MONDO:0859588) as two separate is-a children of keratosis
                  pilaris atrophicans, but the clinical and dermatology literature treats "ulerythema
                  ophryogenes" as the classic/eponymous name for the same faciei variant (e.g. PMID:24801913
                  writes "ulerythema ophryogenes (keratosis pilaris atrophicans faciei)"). closeMatch
                  records this near-synonymy without asserting formal ontological identity.
            description: Ulerythema ophryogenes (UO) begins with erythematous, keratotic follicular papules
              of the lateral eyebrows and cheeks that progress to perifollicular scarring, sparse or absent
              lateral eyebrows, and (rarely) extension to the forehead or scalp; eyelashes are typically
              spared. Most cases are sporadic, but autosomal dominant familial transmission has been reported.
              The same phenotype is a recognized, frequent cutaneous marker of monosomy 18p (five reported
              cases as of 2014) and of RAS-MAPK pathway dysregulation in the RASopathies, occurring in
              up to 90% of molecularly-confirmed cardiofaciocutaneous syndrome (see kb/groupings/RASopathies.yaml).
