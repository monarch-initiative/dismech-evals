      assertion:
        name: Chondrodysplasia punctata, including Conradi's disease
        disease_term:
          preferred_term: chondrodysplasia punctata
          term:
            id: MONDO:0019701
            label: chondrodysplasia punctata
        description: 'Not a theoretical differential: the review literature records that the shared features
          - midface hypoplasia, abnormal cartilage calcification, brachytelephalangism, peripheral pulmonary
          stenosis - have caused Keutel syndrome to be misdiagnosed as chondrodysplasia punctata. Since
          the ISDS nosology places Keutel syndrome inside the CDP group, this is a differential within
          a family rather than across families.'
        distinguishing_features:
        - Keutel syndrome has multiple peripheral pulmonary artery stenoses in almost all patients; these
          are not a feature of the other CDPs
        - Keutel syndrome calcifies cartilage that should never mineralize (larynx, trachea, ears, nose)
          rather than showing transient epiphyseal stippling that resolves
        - Keutel syndrome is autosomal recessive with normal serum calcium and phosphate and no diagnostic
          sterol or plasmalogen abnormality
      selected_evidence:
        snippet: are also observed in other disorders (for example, chondrodysplasia punctata or Conradi's
          disease), leading to the misdiagnosis of some forms of KS into another disease (Say et al.,
          1973)
        supports: SUPPORT
