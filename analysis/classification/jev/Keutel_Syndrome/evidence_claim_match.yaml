      assertion_type: Pathophysiology
      assertion:
        name: Loss of Active Inhibition of Extracellular Matrix Calcification
        biological_scale: TISSUE
        description: 'The central mechanistic claim of this disorder, and the one that generalized beyond
          it: extracellular matrix calcification in soft tissue is actively inhibited, not merely not
          induced. MGP is expressed by the two cell types that build an uncalcified matrix - vascular
          smooth muscle cells and chondrocytes - and those are exactly the tissues that mineralize when
          it is lost.'
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: biomineral tissue development
          modifier: INCREASED
          term:
            id: GO:0031214
            label: biomineral tissue development
        - preferred_term: extracellular matrix organization
          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: These results indicate that ECM calcification must be actively inhibited in soft tissues.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
