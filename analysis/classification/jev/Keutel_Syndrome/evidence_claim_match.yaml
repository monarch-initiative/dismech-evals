              label: Keutel syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vitamin_k_dependence_therapeutic_angle
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Matrix Gla Protein Loss of Function
        prompt: Does the vitamin-K dependence of MGP carboxylation offer any therapeutic leverage in patients
          whose MGP variants leave a partially functional protein?
        rationale: MGP requires vitamin-K-dependent gamma-carboxylation to bind mineral, so its activity
          has a cofactor-dependent step that a null allele destroys but a hypomorphic one might only limit.
          The reported MGP variants include a missense change alongside frameshift and splice alleles,
          and intrafamilial phenotypic variability has been described - both consistent with a range of
          residual function. Whether vitamin K status modifies the phenotype in such patients has not,
          as far as this entry's sources go, been tested. The question is worth recording because it is
          one of the few angles on a disorder for which only symptomatic treatment exists, and because
          the same vitamin-K axis connects this entry to CDPX1, the other brachytelephalangic entity in
          the same nosology group, whose enzyme is warfarin-sensitive and which has vitamin-K-deficiency
          phenocopies.
      selected_evidence:
        snippet: All members of this family have glutamic acid residues modified to gamma-carboxyglutamic
          acids (Gla) by a specific gamma-carboxylase using vitamin K as a cofactor.
        supports: SUPPORT
