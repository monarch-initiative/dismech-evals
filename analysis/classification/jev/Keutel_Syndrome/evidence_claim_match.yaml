  43f834339b0e63214184d49ab4160a245c4f3abe46820df5f733a01df5a6ff4b:
    claim:
      about:
        disease:
          name: Keutel Syndrome
          disease_term:
            preferred_term: Keutel syndrome
            term:
              id: MONDO:0009495
              label: Keutel syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Matrix Gla Protein Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic MGP variants produce a non-functional matrix Gla protein. MGP is a 10-kD
          extracellular matrix protein of the Gla family - the family that also contains osteocalcin and
          the vitamin-K-dependent coagulation factors - whose glutamate residues are gamma-carboxylated
          using vitamin K as cofactor. It is the gamma-carboxyglutamate residues that give the mature
          protein its high affinity for calcium, phosphate, and hydroxyapatite, so a protein that is not
          properly made or not properly carboxylated cannot bind the mineral it is meant to control.
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          gene:
            preferred_term: MGP
            term:
              id: hgnc:7060
              label: MGP
          description: Biallelic germline loss-of-function variants. The three variants in the original
            mapping study - a single-base deletion, a splice-acceptor change, and a missense change -
            all predict a non-functional protein, and parental consanguinity is common.
        biological_processes:
        - preferred_term: peptidyl-glutamic acid carboxylation
          term:
            id: GO:0017187
            label: peptidyl-glutamic acid carboxylation
        - preferred_term: negative regulation of biomineral tissue development
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0070168
            label: negative regulation of biomineral tissue development
      selected_evidence:
        snippet: 'Mutational analysis of MGP in three unrelated probands identified three different mutations:
          c.69delG, IVS1-2A-->G and c.113T-->A. All three mutations predict a non-functional MGP.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9916809
      reference_title: Mutations in the gene encoding the human matrix Gla protein cause Keutel syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes loss of function of MGP as the molecular lesion in three unrelated families.
