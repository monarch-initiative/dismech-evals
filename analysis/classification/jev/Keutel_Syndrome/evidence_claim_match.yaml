      assertion_type: Discussion
      assertion:
        discussion_id: mgp_inhibition_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Active Inhibition of Extracellular Matrix Calcification
        - treatments#Symptomatic management of hypertension and respiratory complications
        prompt: By what molecular mechanism does matrix Gla protein prevent calcification of cartilage
          and vascular matrix?
        rationale: 'That MGP is a calcification inhibitor is established from both directions - the null
          mouse calcifies spontaneously, and the human loss-of-function disorder reproduces it - and the
          physical basis is at least sketched, since gamma-carboxyglutamate residues bind calcium, phosphate,
          and hydroxyapatite. What is not established is how that binding translates into inhibition:
          whether MGP sequesters mineral ions, caps nascent hydroxyapatite crystals, antagonizes BMP signalling
          in the matrix, or acts by some combination. The review that marks the syndrome''s fiftieth year
          states the gap plainly and draws the practical consequence - it is why there is no cure and
          why treatment is symptomatic. This is an unusually well-posed gap: the disorder, the knockout,
          and the protein''s chemistry are all in hand, and what is missing is the step between them.'
      selected_evidence:
        snippet: the mechanisms explaining how MGP prevents abnormal calcification remain poorly understood.
          This has negative implication for the development of a cure for KS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33996798
      reference_title: Keutel Syndrome, a Review of 50 Years of Literature.
      evidence_source: HUMAN_CLINICAL
      explanation: States the gap and links it directly to the absence of a therapy.
