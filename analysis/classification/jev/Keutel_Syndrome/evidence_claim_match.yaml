      assertion_type: ProgressionInfo
      assertion:
        phase: Long-term - good prognosis, determined by pulmonary complications
        notes: Unlike most entries in its nosology group, Keutel syndrome is not lethal and most patients
          do well. What sets life expectancy is the severity of the pulmonary complications, which is
          why surveillance is directed at the pulmonary arteries, the airway, and hearing rather than
          at the skeleton.
      selected_evidence:
        snippet: The prognosis of KS is good in most patients and their life expectancy mostly depends
          on the severity of the pulmonary complications.
        supports: SUPPORT
