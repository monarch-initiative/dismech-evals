            term:
              id: MONDO:0018864
              label: Kikuchi-Fujimoto disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: immune_dysregulation
        hypothesis_label: Exuberant CD8 T-cell and interferon-driven immune response
        status: CANONICAL
        description: KFD is modeled as an exaggerated but self-limited cell-mediated immune response in
          which CD8-positive cytotoxic T cells and histiocytes drive apoptotic (karyorrhectic) necrosis,
          with a plasmacytoid dendritic cell and type I interferon component, sitting on a mechanistic
          spectrum toward systemic lupus erythematosus. This is the best-supported framework, but the
          precise trigger and initiating antigen remain unproven.
      selected_evidence:
        snippet: In histiocytic necrotizing lymphadenitis (HNL), apoptosis is the main form of cell death.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9839173
      reference_title: Perforin and Fas pathways of cytotoxic T-cells in histiocytic necrotizing lymphadenitis.
      evidence_source: IN_VITRO
      explanation: Immunohistochemical and flow-cytometric analysis of HNL nodal tissue establishes apoptosis
        as the principal form of cell death, the basis of the immune-dysregulation model.
