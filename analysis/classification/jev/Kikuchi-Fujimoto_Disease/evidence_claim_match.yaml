      assertion_type: Discussion
      assertion:
        discussion_id: kfd_sle_association
        kind: INTERPRETATION
        status: OPEN
        prompt: How should the strong but longitudinal association between Kikuchi-Fujimoto disease and
          systemic lupus erythematosus be modeled and surveilled?
        rationale: 'KFD has a well-recognized, complex association with systemic lupus erythematosus (SLE):
          SLE may precede, develop after, or occur concurrently with KFD. Recurrent KFD, higher ANA positivity,
          and low C4 mark an intermediate status toward overt autoimmune disease, so KFD patients warrant
          long-term follow-up with ANA and complement monitoring for evolving SLE. This is modeled as
          a discussion rather than a structured comorbidity because KFD-SLE is a longitudinal association/overlap
          rather than a fixed co-occurrence.'
      selected_evidence:
        snippet: Both Kikuchi-Fujimoto disease and systemic lupus erythematosus share an obscure and complex
          relationship as systemic lupus erythematosus may occasionally precede, develop subsequently,
          or sometimes be associated concurrently with Kikuchi-Fujimoto disease.
        supports: SUPPORT
