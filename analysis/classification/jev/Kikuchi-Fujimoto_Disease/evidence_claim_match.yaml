      assertion_type: Genetic
      assertion:
        name: HLA-DPB1
        notes: 'KFD is not a Mendelian disorder and has no causal gene. The principal genetic signal is
          an HLA class II susceptibility association: the HLA-DPB1*0202 allele (and HLA-DPA1*01) is significantly
          over-represented in Japanese KFD patients relative to controls. These are common germline population
          variants conferring susceptibility, not pathogenic mutations, and their higher frequency in
          East Asians may contribute to the observed Asian predominance.'
        gene_term:
          preferred_term: HLA-DPB1
          term:
            id: hgnc:4940
            label: HLA-DPB1
        variant_origin: GERMLINE
        relationship_type: RISK_FACTOR
      selected_evidence:
        snippet: we found DPA1*01 and DPB1*0202 allele frequencies in HLA class II genes are significantly
          higher in HNL patients than in normal controls
        supports: SUPPORT
