  5fcf462653a59a3f3f7d552e6e9af15264c0d886d75e1e6ea1ee3ac50b420b19:
    claim:
      about:
        disease:
          name: Kikuchi-Fujimoto Disease
          disease_term:
            preferred_term: Kikuchi-Fujimoto disease
            term:
              id: MONDO:0018864
              label: Kikuchi-Fujimoto disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CD8 T-Cell- and Histiocyte-Mediated Apoptotic Necrosis
        description: In KFD lesions, an exaggerated cell-mediated immune response produces apoptotic cell
          death driven predominantly by CD8-positive cytotoxic T cells, acting through the Fas-Fas ligand
          and perforin/granzyme pathways. Histiocytes (macrophages) act as enhancers and phagocytose the
          apoptotic debris, generating paracortical foci of necrosis rich in karyorrhectic (nuclear) debris
          characteristically without neutrophils.
        cell_types:
        - preferred_term: CD8-positive cytotoxic T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        - preferred_term: Histiocyte (macrophage)
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: Apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
        - preferred_term: T cell mediated cytotoxicity
          term:
            id: GO:0001913
            label: T cell mediated cytotoxicity
          modifier: INCREASED
        - preferred_term: Extrinsic (Fas) apoptotic signaling
          term:
            id: GO:0097191
            label: extrinsic apoptotic signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Two molecular mechanisms of T-cell-mediated cytotoxicity, one perforin-based and the
          other Fas-based, have been demonstrated, and both systems induce apoptosis of the target cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9839173
      reference_title: Perforin and Fas pathways of cytotoxic T-cells in histiocytic necrotizing lymphadenitis.
      evidence_source: IN_VITRO
      explanation: Immunohistochemistry of HNL nodal tissue shows Fas/FasL- and perforin/granzyme-positive
        cells confined to necrotizing lesions, with CD8-positive lymphocytes as effector and target cells
        and histiocytes as enhancers, supporting CD8 T-cell-driven apoptotic necrosis.
