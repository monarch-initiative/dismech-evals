      assertion_type: Pathophysiology
      assertion:
        name: Klebsiella FMN Riboswitch-Gated Riboflavin Supply (Investigational Target)
        role: therapeutic_vulnerability
        conforms_to: bacterial_riboswitch_targeting#Riboswitch-Gated Essential Gene Expression (Riboswitch
          Target)
        description: 'K. pneumoniae depends on a flavin mononucleotide riboswitch to gate expression of
          its riboflavin biosynthesis genes, and that regulatory RNA is a candidate antibacterial target
          rather than a mechanism of disease. It is recorded here because the vulnerability is specific
          to this organism in a way that does not generalize: the FMN riboswitch aptamer is poorly conserved
          across Gram-negative genera, and K. pneumoniae sits at 90 percent identity to the E. coli element
          while Acinetobacter baumannii sits at 61 percent, which is why the riboswitch-ligand compound
          series reaches Enterobacteriaceae and not the other Gram-negative ESKAPE pathogens. Entirely
          investigational: the evidence is in vitro susceptibility of multidrug-resistant clinical isolates,
          no riboswitch-targeting compound has entered clinical development, and nothing here is a treatment
          option. The resistance frequency reported for this target in K. pneumoniae is of the same order
          as in E. coli, so target-site mutation is an expected liability rather than a remote one.'
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Extensive panels of MDR clinical isolates of E. coli (n=42) and K. pneumoniae (n=54)
          were assessed for their susceptibility to (-)3, also called Ribocil C-PA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32432858
      reference_title: Gram-Negative Antibiotic Active Through Inhibition of an Essential Riboswitch.
      evidence_source: IN_VITRO
      explanation: Establishes that a riboswitch-targeting compound was tested against a large panel of
        multidrug-resistant K. pneumoniae clinical isolates, which is the basis for recording this organism's
        FMN riboswitch as a candidate target.
