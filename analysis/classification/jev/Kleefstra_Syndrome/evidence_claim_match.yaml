            id: hgnc:13726
            label: KMT2C
        features: 'Heterozygous loss-of-function mutations in KMT2C (MLL3), encoding a histone H3 lysine
          4 methyltransferase, cause Kleefstra syndrome 2 (MONDO:0054701). Phenotypically overlaps with
          Kleefstra syndrome 1 but involves a distinct chromatin-modifying gene on a different chromosome.

          '
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
