      assertion_type: Pathophysiology
      assertion:
        name: EHMT1 haploinsufficiency and epigenetic dysregulation
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        description: 'EHMT1 (also known as GLP) encodes a SET domain-containing histone methyltransferase
          that forms a heterodimeric complex with EHMT2 (G9a). This complex catalyzes mono- and dimethylation
          of histone H3 at lysine 9 (H3K9me1/me2), an epigenetic mark associated with transcriptional
          silencing at euchromatic loci. Haploinsufficiency of EHMT1 leads to reduced H3K9me2 levels,
          resulting in aberrant gene expression across multiple tissues, particularly in the developing
          brain. The minimal critical region for the syndrome has been narrowed to less than 1 Mb comprising
          EHMT1.

          '
        genes:
        - preferred_term: EHMT1
          term:
            id: hgnc:24650
            label: EHMT1
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
