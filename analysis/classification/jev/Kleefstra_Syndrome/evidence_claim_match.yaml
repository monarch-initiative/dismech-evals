      assertion_type: Pathophysiology
      assertion:
        name: KMT2C haploinsufficiency and reduced H3K4 methylation
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        biological_scale: MOLECULAR
        description: 'KMT2C (MLL3) is a trithorax-related histone H3 lysine 4 methyltransferase. Heterozygous
          protein-truncating variants, and rare missense variants in its functional domains, reduce the
          dose of the enzyme; haploinsufficiency is the proposed mechanism. This is the opposite chromatin
          arm from EHMT1: EHMT1 writes the repressive H3K9me1/me2 mark, KMT2C writes the permissive H3K4
          mark, and the two genes therefore reach a shared neurodevelopmental transcriptional phenotype
          from opposite directions rather than through one pathway. The strongest evidence that this is
          a real and separable molecular lesion is a disorder-specific DNA methylation episignature that
          classifies KMT2C variants and separates this disorder from EHMT1-related Kleefstra syndrome
          1.

          '
        genes:
        - preferred_term: KMT2C
          term:
            id: hgnc:13726
            label: KMT2C
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        molecular_functions:
        - preferred_term: histone H3K4 methyltransferase activity
          term:
            id: GO:0042800
            label: histone H3K4 methyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: peptidyl-lysine methylation
          term:
            id: GO:0018022
            label: peptidyl-lysine methylation
          modifier: DECREASED
        notes: Deliberately not given a `downstream` edge to the NMDAR or REST/NRSF nodes. Both of those
          are EHMT1-specific results - patient-derived neuronal networks and EHMT1-deficient mice for
          the first, EHMT1-dependent miRNA derepression for the second - and no published work places
          KMT2C on either. Drawing such an edge would assert a shared effector pathway the sources do
          not support, so this node reaches the shared phenotypes directly and the causal links are typed
          INDIRECT_UNKNOWN_INTERMEDIATES to record that the intervening steps are not curated.
      selected_evidence:
        snippet: Trithorax-related H3K4 methyltransferases, KMT2C and KMT2D, are critical epigenetic modifiers.
          Haploinsufficiency of KMT2C was only recently recognized as a cause of neurodevelopmental disorder
          (NDD)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39013459
      reference_title: Pathogenic variants in KMT2C result in a neurodevelopmental disorder distinct from
        Kleefstra and Kabuki syndromes.
      evidence_source: HUMAN_CLINICAL
      explanation: States the enzyme identity and the haploinsufficiency mechanism this node asserts.
