          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: Neuronal networks of patient-derived cells exhibit network bursting with a reduced rate,
          longer duration, and increased temporal irregularity compared to control networks
        supports: SUPPORT
