          keys on, but a reader should not infer that KMT2C and EHMT1 produce one clinical entity.

          Second, ClinGen does not carry an assertion for this pair. Its only KMT2C gene-disease validity
          row - checked against the ClinGen gene-validity download retrieved 2026-09-19 - is KMT2C against
          syndromic intellectual disability (MONDO:0000508, Definitive, autosomal dominant). That is a
          strong statement about the gene and a silence about the Kleefstra syndrome 2 label, which is
          consistent with the renaming argument above.

          '
      selected_evidence:
        snippet: We ascertained 98 individuals with rare KMT2C variants, including 75 with protein-truncating
          variants (PTVs). Notably, ∼15% of KMT2C PTVs were inherited.
