              label: Kleefstra syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NMDAR-mediated neuronal network dysfunction
        description: 'In EHMT1-deficient human cortical neurons, reduced H3K9me2 at the GRIN1 promoter
          leads to upregulation of NMDA receptor subunit 1 (NMDAR1/GluN1), driving aberrant neuronal network
          activity with reduced burst rate, longer burst duration, and increased temporal irregularity.
          Pharmacological inhibition of NMDARs rescues the network phenotype, establishing a direct mechanistic
          link between EHMT1 deficiency and NMDAR hyperfunction that provides a potential basis for targeted
          therapeutic approaches.

          '
        cell_types:
        - preferred_term: excitatory cortical neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
