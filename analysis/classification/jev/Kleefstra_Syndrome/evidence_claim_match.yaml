        context: []
      assertion_type: Pathophysiology
      assertion:
        name: REST/NRSF dysregulation via miRNA derepression
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental
          Transcriptional Program
        description: 'EHMT1 deficiency leads to derepression of multiple miRNAs that target the neuronal
          transcriptional repressor REST/NRSF. EHMT1 normally maintains H3K9me2 marks at miRNA transcription
          start sites, keeping them silenced. When EHMT1 is haploinsufficient, these miRNAs are upregulated,
          reducing REST protein levels and prematurely de-repressing neuronal gene programs. This disrupts
          the timing of neurodevelopment and contributes to the aberrant neuronal differentiation seen
          in Kleefstra syndrome.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: neuron differentiation
          term:
            id: GO:0030182
            label: neuron differentiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: reduced EHMT1 activity decreases NRSF/REST protein leading to abnormal neuronal gene
          expression and progression of neurodevelopment in human iPSC
        supports: SUPPORT
    origin:
