              label: Klinefelter syndrome
        context:
        - path: /pathophysiology/1
          value:
            name: X-chromosome Inactivation Escape / Gene Dosage Imbalance
            description: In 47,XXY, the inactive X chromosome (Xi) does not fully silence expression of
              a subset of X-linked escape genes (notably DDX3X, USP9X, KDM6A, and other dosage-sensitive
              loci). The resulting bi-allelic expression of these genes elevates effective gene dosage
              above the typical male single-X level, contributing to neurodevelopmental, cognitive, and
              metabolic phenotypes independent of androgen deficiency. The Xi also exerts trans regulatory
              effects on active-X and autosomal gene expression, broadening the molecular impact of sex-chromosome
              aneuploidy beyond classic escape.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Tall Stature
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - pseudoautosomal SHOX-region dosage
        description: Extra sex-chromosome dosage, including pseudoautosomal-region effects, contributes
          to tall stature in Klinefelter syndrome.
      selected_evidence:
        snippet: The typical symptoms are a tall stature, narrow shoulders, broad hips, sparse body hair,
          gynecomastia, small testes, absent spermatogenesis, normal to moderately reduced Leydig cell
          function, increased secretion of follicle-stimulating hormone, androgen deficiency, and normal
          to slightly decreased verbal intelligence.
        supports: SUPPORT
    origin:
