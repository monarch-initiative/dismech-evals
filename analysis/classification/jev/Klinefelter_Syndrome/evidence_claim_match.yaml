        context: []
      assertion_type: Pathophysiology
      assertion:
        name: X-chromosome Inactivation Escape / Gene Dosage Imbalance
        description: In 47,XXY, the inactive X chromosome (Xi) does not fully silence expression of a
          subset of X-linked escape genes (notably DDX3X, USP9X, KDM6A, and other dosage-sensitive loci).
          The resulting bi-allelic expression of these genes elevates effective gene dosage above the
          typical male single-X level, contributing to neurodevelopmental, cognitive, and metabolic phenotypes
          independent of androgen deficiency. The Xi also exerts trans regulatory effects on active-X
          and autosomal gene expression, broadening the molecular impact of sex-chromosome aneuploidy
          beyond classic escape.
      selected_evidence:
        snippet: Fourteen X chromosomal genes were downregulated in 45,X and upregulated in 47,XXY, respectively,
          in all three tissues (AKAP17A,CD99,DHRSX,EIF2S3,GTPBP6,JPX,KDM6A,PP2R3B,PUDP,SLC25A6,TSIX,XIST,ZBED1,ZFX).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1186/s13073-023-01169-4
      reference_title: X chromosome dosage and the genetic impact across human tissues
      evidence_source: HUMAN_CLINICAL
      explanation: Viuff et al. 2023 directly demonstrates that KDM6A and 13 other X-chromosomal genes
        are upregulated in 47,XXY across blood, fat, and muscle tissues — supporting the X-dosage / escape-gene
        axis of the canonical hypothesis with tissue-spanning evidence.
