        genes:
        - preferred_term: COL2A1
        description: 'Knock-in mouse model carrying a Col2a1 p.Gly1170Ser missense mutation. Homozygous
          mice display a chondrodysplasia phenotype with misfolded procollagen retained in dilated ER,
          activation of the ER stress-UPR-apoptosis cascade, and absence of the hypertrophic zone in growth
          plate cartilage. Heterozygous mice have normal phenotypes with limited ER stress and no abnormal
          apoptosis, paralleling the variable expressivity observed in type II collagenopathies.

          '
        associated_phenotypes:
        - Chondrodysplasia
        - ER stress
        - Growth plate disorganization
      selected_evidence:
        snippet: a col2a1 p.Gly1170Ser mutated mouse model was constructed and in homozygotes, the chondrodysplasia
          phenotype was observed. Misfolded procollagen was largely synthesized and retained in dilated
          endoplasmic reticulum and the endoplasmic reticulum stress (ERS)-unfolded protein response (UPR)-apoptosis
          cascade was activated.
        supports: SUPPORT
