              id: MONDO:0007987
              label: Kniest dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Growth Plate Dysgenesis
        description: 'The endochondral growth plate in Kniest dysplasia is profoundly disorganized. Extensive
          vacuolar changes occur throughout the growth plate and in the lacunae of degenerating chondrocytes.
          The vacuolar lesions contain chondroitin sulfate but little keratan sulfate or collagen, suggesting
          a sequence of events initiated by cellular accumulation of abnormal material and progressing
          to cellular and matrix degeneration. The proliferative and hypertrophic zones are shortened
          or indistinguishable, and cartilage matrix deposition is markedly impaired with fewer and less
          elaborate collagen fibrils than normal. This growth plate disorganization directly accounts
          for the severe short stature.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
