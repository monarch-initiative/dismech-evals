          that disrupts splicing and can produce Kniest dysplasia, with mosaicism in a parent producing
          a milder Stickler-like phenotype.

          '
      selected_evidence:
        snippet: Analysing COL2A1 in both patients, we detected the same 28 basepair deletion spanning
          the 3'-exon/intron boundary of exon 12 in mother and daughter.
        supports: SUPPORT
