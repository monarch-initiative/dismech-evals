          term:
            id: GO:0051216
            label: cartilage development
        - preferred_term: ECM Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: there appears to be a sequence of events initiated by cellular accumulation of a substance
          and progressing to cellular and matrix degeneration.
        supports: SUPPORT
