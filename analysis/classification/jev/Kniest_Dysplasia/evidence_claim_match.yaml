        description: 'Autosomal dominant inheritance, with most cases arising from de novo mutations.
          Parental somatic mosaicism has been documented, where a parent carrying the mutation in mosaic
          form presents with a milder phenotype such as Stickler syndrome or mild spondyloepiphyseal dysplasia.
          Variable expressivity is observed.

          '
      selected_evidence:
        snippet: Six dominant disease-causing COL2A1 variants were detected. In three cases, testing of
          parental samples revealed that the disease-causing variant was not present in either parent.
        supports: SUPPORT
