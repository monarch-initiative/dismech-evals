          description: 'The characteristic Kniest dysplasia variant class consists of small in-frame deletions
            or splice-site variants that shorten the type II collagen triple helix, especially across
            the exon 12 to exon 24 region, producing shortened collagen monomers with dominant-negative
            effects on fibril assembly.

            '
        - name: COL2A1 exon 12 splice-boundary deletion
          description: 'A recurrent 28-base-pair deletion spanning the COL2A1 exon 12/intron 12 boundary
            that disrupts splicing and can produce Kniest dysplasia, with mosaicism in a parent producing
            a milder Stickler-like phenotype.

            '
        - name: COL2A1 intron 20 splice-site mutation c.1266+2T>A
          description: 'A splice-site variant that causes both intron retention and exon skipping in the
            triple-helical region, producing out-of-frame transcript and in-frame deletion consequences
            in adult Kniest dysplasia.

            '
      selected_evidence:
        snippet: Most variants (38/44, 86%) were located in the triple helical domain of the collagen
          chain and glycine substitutions were mainly observed in severe phenotypes, whereas arginine
          to cysteine changes were more often encountered in moderate phenotypes.
        supports: SUPPORT
