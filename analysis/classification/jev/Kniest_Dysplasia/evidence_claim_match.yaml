            name: COL2A1 Mutations
            association: Causative
            notes: 'Heterozygous mutations in COL2A1, characteristically exon-skipping splice-site mutations
              and small in-frame deletions in the triple-helical domain. Mutations spanning exons 12 through
              24 are particularly associated with the Kniest phenotype. These produce shortened or structurally
              abnormal collagen alpha chains that are incorporated into fibrils but cause a dominant-negative
              effect on fibril assembly. Both missense mutations and splice-site mutations have been documented;
              splice mutations can produce both out-of-frame transcripts (leading to premature stop codons)
              and in-frame deletions. Most cases are de novo, though parental somatic mosaicism has been
              demonstrated. In a large French series, 86% of COL2A1 variants were in the triple-helical
              domain, with glycine substitutions in severe phenotypes.

              '
          role: ancestor
      assertion_type: Variant
