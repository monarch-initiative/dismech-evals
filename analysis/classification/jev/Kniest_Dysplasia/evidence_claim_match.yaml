  d7004470e0cb9da4693ba88ead0c70c3693efd3f4a62b16898e000f8cacc2802:
    claim:
      about:
        disease:
          name: Kniest Dysplasia
          disease_term:
            preferred_term: Kniest dysplasia
            term:
              id: MONDO:0007987
              label: Kniest dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intracellular Procollagen Retention and ER Stress
        description: 'Mutant type II procollagen accumulates in dilated endoplasmic reticulum of chondrocytes,
          triggering ER stress. Mutant chains undergo post-translational overmodification (excess hydroxylation
          and glycosylation) due to delayed folding. The ER proteostasis response appears to be allele-specific
          across the COL2A1 spectrum: a Col2a1 p.Gly1170Ser mouse model and patient-derived COL2A1 iPSC/induced
          chondrogenic models activate the canonical UPR, whereas an iPSC-derived human cartilage model
          of the milder p.Arg719Cys allele (precocious osteoarthritis with mild spondyloepiphyseal dysplasia,
          not Kniest) showed ER retention and ER distention without detectable UPR activation. Whether
          Kniest-causing triple-helical deletions behave like the UPR-activating or the surveillance-failure
          allele class has not been tested directly; the intensity of ER stress varies by allele and zygosity.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Response to ER Stress
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
        - preferred_term: Protein Folding
          term:
            id: GO:0006457
            label: protein folding
        cellular_components:
        - preferred_term: rough endoplasmic reticulum
          term:
            id: GO:0005791
            label: rough endoplasmic reticulum
      selected_evidence:
        snippet: Misfolded procollagen was largely synthesized and retained in dilated endoplasmic reticulum
          and the endoplasmic reticulum stress (ERS)-unfolded protein response (UPR)-apoptosis cascade
          was activated.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
