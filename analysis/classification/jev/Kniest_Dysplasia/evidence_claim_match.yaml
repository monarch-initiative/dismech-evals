  4fb1d43b879f2077252b3ac100411d8a58fa09904f4557afb8aac97c058af53e:
    claim:
      about:
        disease:
          name: Kniest Dysplasia
          disease_term:
            preferred_term: Kniest dysplasia
            term:
              id: MONDO:0007987
              label: Kniest dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Type II Collagen Fibril Assembly
        description: 'Collagen fibrils in Kniest dysplasia cartilage are much thinner than normal, of
          irregular shape, and lack the characteristic banding pattern. The C-propeptide of type II collagen
          (chondrocalcin) is absent from the extracellular matrix of epiphyseal cartilages, instead being
          abnormally retained in intracellular vacuolar sites. This imperfect fibril assembly produces
          the characteristic "Swiss cheese" cartilage histology with large empty spaces from collagen
          fibril fragmentation and disintegration.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Collagen Biosynthesis
          term:
            id: GO:0032964
            label: collagen biosynthetic process
        - preferred_term: Cartilage Development
          term:
            id: GO:0051216
            label: cartilage development
        - preferred_term: ECM Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
        - preferred_term: Protein Folding
          term:
            id: GO:0006457
            label: protein folding
        cellular_components:
        - preferred_term: extracellular matrix
          term:
            id: GO:0031012
            label: extracellular matrix
          modifier: DECREASED
      selected_evidence:
        snippet: Pathologic findings included a disorganized physeal growth plate, soft crumbly cartilage
          with a "Swiss-cheese" appearance, and diastase resistant intracytoplasmic inclusions in the
          resting chondrocytes. Transmission electronmicroscopy showed dilated cisternae of rough endoplasmic
          reticulum with finely granular material of accumulated protein. Scanning electronmicroscopy
          documented striking fragmentation and disintegration of collagen fibrils resulting in a web-like
          pattern and large open cyst-like spaces, and deficiency and disorganization of the collagen
          fibrils.
        supports: SUPPORT
    origin:
