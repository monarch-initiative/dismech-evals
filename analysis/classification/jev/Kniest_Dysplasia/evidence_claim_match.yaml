  c52d7be229fbbdddf16fd99c1346aaad42998f6e84b2740227e250876b1a7dda:
    claim:
      about:
        disease:
          name: Kniest Dysplasia
          disease_term:
            preferred_term: Kniest dysplasia
            term:
              id: MONDO:0007987
              label: Kniest dysplasia
        context: []
      assertion_type: Genetic
      assertion:
        name: COL2A1 Mutations
        association: Causative
        notes: 'Heterozygous mutations in COL2A1, characteristically exon-skipping splice-site mutations
          and small in-frame deletions in the triple-helical domain. Mutations spanning exons 12 through
          24 are particularly associated with the Kniest phenotype. These produce shortened or structurally
          abnormal collagen alpha chains that are incorporated into fibrils but cause a dominant-negative
          effect on fibril assembly. Both missense mutations and splice-site mutations have been documented;
          splice mutations can produce both out-of-frame transcripts (leading to premature stop codons)
          and in-frame deletions. Most cases are de novo, though parental somatic mosaicism has been demonstrated.
          In a large French series, 86% of COL2A1 variants were in the triple-helical domain, with glycine
          substitutions in severe phenotypes.

          '
        variants:
        - name: COL2A1 in-frame deletions between exons 12 and 24
          description: 'The characteristic Kniest dysplasia variant class consists of small in-frame deletions
            or splice-site variants that shorten the type II collagen triple helix, especially across
            the exon 12 to exon 24 region, producing shortened collagen monomers with dominant-negative
            effects on fibril assembly.

            '
        - name: COL2A1 exon 12 splice-boundary deletion
          description: 'A recurrent 28-base-pair deletion spanning the COL2A1 exon 12/intron 12 boundary
            that disrupts splicing and can produce Kniest dysplasia, with mosaicism in a parent producing
            a milder Stickler-like phenotype.

            '
        - name: COL2A1 intron 20 splice-site mutation c.1266+2T>A
          description: 'A splice-site variant that causes both intron retention and exon skipping in the
            triple-helical region, producing out-of-frame transcript and in-frame deletion consequences
            in adult Kniest dysplasia.

            '
      selected_evidence:
        snippet: We studied a 2-year-old girl presenting with manifestations of Kniest dysplasia and her
          mother showing a Stickler phenotype. Analysing COL2A1 in both patients, we detected the same
          28 basepair deletion spanning the 3'-exon/intron boundary of exon 12 in mother and daughter.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7981752
      reference_title: Kniest and Stickler dysplasia phenotypes caused by collagen type II gene (COL2A1)
        defect.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies a 28bp deletion at the exon 12 splice boundary in COL2A1 causing Kniest
        dysplasia, establishing that exon-boundary mutations leading to exon skipping cause the disorder.
