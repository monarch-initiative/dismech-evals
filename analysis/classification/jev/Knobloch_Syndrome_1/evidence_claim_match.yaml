      assertion:
        name: Loss of Collagen XVIII from Basement Membranes
        description: Collagen XVIII is a heparan sulfate proteoglycan of basement membranes. In the eye
          it is present in every basement membrane except Descemet's membrane, including the inner limiting
          membrane, Bruch's membrane and the iris pigment epithelium basement membrane; it is also present
          in the choroid plexus epithelial basement membrane and the developing cortex. Its absence alters
          basement membrane structure in each of these sites.
