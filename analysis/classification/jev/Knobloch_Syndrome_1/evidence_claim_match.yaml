        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Most pathogenic variants are frameshift, nonsense or splice variants. Some affect only
          the short isoform and others abolish all three isoforms; patients lacking all isoforms have
          more severe ocular disease. The c.3514_3515delCT deletion in exon 41 (as numbered in PMID:12415512)
          recurs on different haplotypes.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_ae24ab5e-a4a9-45eb-a52d-18e6dfebae53-2023-02-28T100000.000Z
        variants:
        - name: c.3514_3515delCT
          description: Recurrent two-base deletion in exon 41, found on three unrelated alleles embedded
            in different haplotypes, so it has arisen more than once.
      selected_evidence:
        snippet: All are truncating mutations leading to deficiency of one or all collagen XVIII isoforms
          and endostatin.
        supports: SUPPORT
