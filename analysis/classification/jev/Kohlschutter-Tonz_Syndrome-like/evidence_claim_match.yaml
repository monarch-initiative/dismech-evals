              label: Kohlschutter-Tonz syndrome-like
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SATB1 CUT-Domain Missense Hyperbinding to Chromatin
        biological_scale: MOLECULAR
        description: Heterozygous missense variants clustered in the CUT1 and CUT2 DNA-binding domains
          of SATB1 make the protein bind chromatin more strongly than wild-type SATB1 in cell-based assays.
          Because the variant protein is present and more active rather than absent, this is an altered/increased
          function mechanism, unlike the haploinsufficiency that underlies the milder allelic DEFDA.
        role: trigger
        genes:
        - preferred_term: SATB1
          term:
            id: hgnc:10541
            label: SATB1
        genetic_context:
          gene:
            preferred_term: SATB1
            term:
              id: hgnc:10541
              label: SATB1
          allele_type: missense
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: CUT1/CUT2 missense variants with stronger chromatin binding and increased transcriptional
            repression in functional assays; described as gain-of-function in later literature. Most are
            de novo, although inherited cases occur.
        molecular_functions:
        - preferred_term: chromatin binding
          term:
            id: GO:0003682
            label: chromatin binding
          modifier: INCREASED
      selected_evidence:
        snippet: In vitro functional studies have demonstrated that missense variants can cause stronger
          chromatin binding and increase transcriptional repression, while LoF/PTVs are mislocalized in
          the cell nucleus and may have variable effects on SATB1 transcriptional activity
        supports: SUPPORT
