          and inter-ameloblast adhesion, retain amelogenin intracellularly, and deposit a thin layer of
          hypomineralized, non-prismatic enamel. SATB1-dependent Eps8 expression is implicated in forming
          the apical secretory protrusion. Whether the same cellular defect underlies the dental anomalies
          of patients with CUT-domain missense variants is untested.
