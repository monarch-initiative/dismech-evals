            id: MONDO:0043339
            label: lathyrism
        distinguishing_features:
        - Causative exposure is grass pea (Lathyrus sativus) beta-ODAP, not cyanogenic bitter cassava.
        - Clinically near-identical upper-motor-neuron spastic paraparesis, so dietary history is the
          key discriminator.
      selected_evidence:
        snippet: Other toxic etiologies of TSP include lathyrism and fluorosis.
        supports: SUPPORT
