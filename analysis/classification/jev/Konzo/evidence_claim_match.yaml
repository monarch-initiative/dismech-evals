  eb0db8754ae36f26f4c4e2d1bc3a23e92c89ef885c971012eeacb7c625b85d74:
    claim:
      about:
        disease:
          name: Konzo
          disease_term:
            preferred_term: konzo
            term:
              id: MONDO:0022666
              label: cassavism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Cyanide Detoxification with Low Sulfur Amino Acid Intake
        description: Cyanide is normally detoxified to thiocyanate by sulfurtransferase enzymes that require
          a sulfur donor supplied by dietary sulfur-containing amino acids (methionine, cysteine). In
          konzo-affected populations the bitter-cassava diet is protein-poor and deficient in sulfur amino
          acids, so a high cyanide intake is paired with low capacity to detoxify it. Children with konzo
          have measurably lower cyanide detoxification rates than controls, and worse nutritional status
          (stunting/wasting) distinguishes konzo patients from equally cyanide-exposed healthy individuals,
          implicating impaired detoxification and malnutrition as the decisive co-factors.
        biological_processes:
        - preferred_term: sulfur amino acid metabolic process
          modifier: DECREASED
          term:
            id: GO:0000096
            label: sulfur amino acid metabolic process
        - preferred_term: detoxification
          modifier: DECREASED
          term:
            id: GO:0098754
            label: detoxification
      selected_evidence:
        snippet: High cyanide consumption with low dietary sulfur intake due to almost exclusive consumption
          of insufficiently processed bitter cassava roots was proposed as the cause of Konzo
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20619859
      reference_title: 'Etiology of Konzo, epidemic spastic paraparesis associated with cyanogenic glycosides
