      assertion:
        name: Neurolathyrism
        description: 'Neurolathyrism is the closest mimic of konzo: an epidemic, abrupt-onset, symmetric
          upper-motor-neuron spastic paraparesis affecting young people during food shortages. It is caused
          by the excitatory amino acid neurotoxin beta-ODAP in grass pea (Lathyrus sativus) rather than
          by cassava-derived cyanide, so dietary history is the key discriminator.'
        disease_term:
          preferred_term: neurolathyrism
