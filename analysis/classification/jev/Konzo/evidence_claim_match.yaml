        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
      selected_evidence:
        snippet: Konzo is a toxico-nutritional upper motor neuron disease causing a spastic paraparesis
