        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cyanogenic Glucoside (Linamarin) and Cyanide Exposure from Bitter Cassava
        description: The initiating exposure of konzo is high dietary intake of the cyanogenic glucoside
          linamarin from insufficiently processed bitter cassava roots. During digestion linamarin is
          hydrolysed by the enzyme linamarase to cyanohydrins, which break down to toxic cyanide, so a
          monotonous diet of poorly processed bitter cassava delivers a high chronic cyanide load. Epidemiological
          studies associate urinary linamarin and its cyanide metabolite thiocyanate with the occurrence
          of konzo, and outbreaks cluster geographically and seasonally with high cyanide exposure.
        chemical_entities:
        - preferred_term: linamarin
          term:
            id: CHEBI:16441
            label: linamarin
        - preferred_term: cyanide
          term:
            id: CHEBI:17514
            label: cyanide
        biological_processes:
        - preferred_term: cyanide metabolic process
          modifier: INCREASED
          term:
            id: GO:0019499
            label: cyanide metabolic process
      selected_evidence:
        snippet: Cassava contains cyanogenic glucosides which are hydrolysed by an enzyme linamarase to
          produce cyanohydrins which breakdown to toxic cyanide.
        supports: SUPPORT
    origin:
