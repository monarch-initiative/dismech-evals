      assertion:
        name: Upper Motor Neuron and Corticospinal Tract Injury
        description: 'Inadequately detoxified cyanide and its metabolites selectively injure upper motor
          neurons and their corticospinal (pyramidal) tract axons, with sparing of lower motor neurons,
          sensory pathways, and sphincter function. Proposed effector mechanisms include excitotoxicity
          and oxidative stress: cyanide is a mitochondrial toxin, and cassava-cyanide metabolites (thiocyanate,
          cyanate) act on neurons, with cyanate inducing reactive oxygen species, caspase activation,
          and depolarizing currents through ionotropic glutamate receptors in spinal cord neurons.'
        cell_types:
        - preferred_term: upper motor neuron
          term:
            id: CL:0008048
            label: upper motor neuron
