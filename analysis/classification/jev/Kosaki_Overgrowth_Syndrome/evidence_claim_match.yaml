      assertion_type: Genetic
      assertion:
        name: PDGFRB Gain-of-Function Mutations
        gene_term:
          preferred_term: PDGFRB
          term:
            id: hgnc:8804
            label: PDGFRB
        association: Causative
        features: Heterozygous activating missense variants in PDGFRB cause constitutive receptor activation.
          The germline P584R mutant identified in overgrowth syndrome is a stronger oncogene than the
          germline R561C mutant associated with myofibromatosis, and this difference in potency may explain
          the distinct overgrowth phenotype. The two recurrent KOGS variants, p.(Pro584Arg) and p.(Trp566Arg),
          lie in the juxtamembrane autoinhibitory domain of PDGFRB that normally restrains receptor autoactivation.
      selected_evidence:
        snippet: the germline mutant identified in overgrowth syndrome, P584R, was a stronger oncogene
          than the germline R561C mutant associated with myofibromatosis.
        supports: SUPPORT
