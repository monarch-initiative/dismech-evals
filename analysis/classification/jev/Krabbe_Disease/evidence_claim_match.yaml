              id: MONDO:0009499
              label: Krabbe disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cell-Autonomous Neuronal Toxicity
        description: Psychosine injures neurons directly, in parallel with rather than downstream of oligodendrocyte
          and Schwann cell death. Induced neurons converted from adult-onset Krabbe patient fibroblasts
          show neurite fragmentation and abnormal neuritic branching alongside the expected loss of GALC
          activity and rise in psychosine, and psychosine applied to neurons from healthy individuals
          is sufficient to reproduce those defects. In the twitcher mouse, psychosine concentrates in
          presynaptic membranes and synaptic vesicles, and hippocampal neurons show cell-autonomous reductions
          in paired-pulse facilitation and excitatory postsynaptic potential amplitude. This arm means
          Krabbe disease is not exclusively a disorder of myelinating glia, and it is one candidate explanation
          for why transplantation does not fully arrest progression.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: neuron projection development
          term:
            id: GO:0031175
            label: neuron projection development
        - preferred_term: synaptic vesicle cycle
          term:
            id: GO:0099504
            label: synaptic vesicle cycle
      selected_evidence:
        snippet: directly converted KD iNeurons showed not only diminished GALC activity and increased
          psychosine levels, as expected, but also neurite fragmentation and abnormal neuritic branching
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
