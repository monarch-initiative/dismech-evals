  c72d4d334ff7adda019d3d685fe4b3fcf78aa14774e26a88f678cba44c27e0d4:
    claim:
      about:
        disease:
          name: Krabbe Disease
          disease_term:
            preferred_term: Krabbe disease
            term:
              id: MONDO:0009499
              label: Krabbe disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_krabbe_psychosine_depletion_discordance
        prompt: Why do three independent ways of removing psychosine from the twitcher mouse give three
          different outcomes, and which non-psychosine product of GALC activity accounts for the demyelination
          that survives psychosine elimination?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#canonical_galc_deficiency_psychosine_demyelination_model
        - pathophysiology#Psychosine Accumulation
        - pathophysiology#Demyelination
        - pathophysiology#GalCer-Driven Macrophage Pathology
        rationale: 'Acid ceramidase ablation eliminates psychosine and rescues the twitcher phenotype,
          but saposin-D ablation also eliminates psychosine while leaving late-stage demyelination intact
          and shortening lifespan, and a UGT8 inhibitor cuts psychosine 72-86% without changing survival.
          The three results cannot all be explained by psychosine being the operative toxin, so the sufficiency
          half of the canonical model is unsettled even though its upstream half is quantitatively validated.
          This is not a bookkeeping detail: whether a psychosine-lowering drug can work as monotherapy
          depends on the answer, and substrate reduction therapy is already curated in this entry as an
          investigational strategy aimed at psychosine biogenesis. No head-to-head comparison of the two
          knockout crosses exists; the three studies used different genetic backgrounds, endpoints, and
          time points, so the discordance may be partly methodological.'
        proposed_experiments:
        - experiment_id: exp_krabbe_matched_background_sphingolipidomic_comparison
          name: Matched-background lipidomic comparison of psychosine-null twitcher crosses
          description: Generate ACDase-knockout and saposin-D-knockout twitcher crosses on one congenic
            background and profile brain, spinal cord, and sciatic nerve at matched pre-symptomatic, early,
            and late time points. Quantify the full sphingolipid panel, not psychosine alone, so that
            species differing between a rescued and an unrescued psychosine-null animal can be identified.
            Score demyelination, globoid cell burden, and survival in the same animals.
          experiment_type:
            preferred_term: comparative mass-spectrometry lipidomics of matched mouse crosses
          decision_criterion: A non-psychosine lipid that tracks with rescue across the two crosses nominates
            the missing toxic species and would justify a distinct pathophysiology node. If the two crosses
            are lipidomically indistinguishable, the discordance is not metabolic and attention should
            move to the macrophage and saposin-D-dependent arms.
          would_support:
          - pathophysiology#GalCer-Driven Macrophage Pathology
          supporting_outcome:
          - Galactosylceramide or another GALC substrate remains elevated in the unrescued psychosine-null
            cross and tracks with globoid cell burden and demyelination severity.
          refuting_outcome:
          - Both psychosine-null crosses show the same lipid profile and the same demyelination, which
            would place the difference outside sphingolipid metabolism altogether.
      selected_evidence:
        snippet: The demyelination observed in Twi/Sap-D KO mice may be mediated by a psychosine-independent,
          Sap-D-dependent mechanism
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
