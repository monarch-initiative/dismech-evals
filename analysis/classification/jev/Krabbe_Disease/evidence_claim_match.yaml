  57efacb15a60a143bc29a336978447a78be2bbc5e3faa9acd08e5cb790e7c9f2:
    claim:
      about:
        disease:
          name: Krabbe Disease
          disease_term:
            preferred_term: Krabbe disease
            term:
              id: MONDO:0009499
              label: Krabbe disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_krabbe_neuronal_arm_human_relevance
        prompt: Does cell-autonomous neuronal toxicity contribute materially to disease in human Krabbe
          patients in vivo, or is it a property of converted-cell and rodent systems that does not scale
          to the infantile disease where demyelination dominates?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cell-Autonomous Neuronal Toxicity
        rationale: 'The evidence for the neuronal arm is real but narrow in a specific way. The human
          data come from induced neurons converted from the fibroblasts of two adult-onset compound heterozygotes,
          a culture system with no oligodendrocytes and no in vivo context, while the functional electrophysiology
          comes from twitcher mouse hippocampus. Human neuropathology of Krabbe disease has been reported
          mainly in terms of white matter, globoid cells, and gliosis, and no in vivo rescue experiment
          has isolated the neuronal contribution. Getting this right matters clinically rather than only
          descriptively: if neurons are injured independently of myelin, that is a candidate explanation
          for the residual progression seen after hematopoietic stem cell transplantation, and it would
          argue that restoring GALC to the myelinating and phagocytic compartments alone is not enough.'
        proposed_experiments:
        - experiment_id: exp_krabbe_neuron_specific_galc_restoration
          name: Cell-type-restricted GALC restoration and human neuronal neuropathology
          description: In twitcher mice, restore GALC conditionally in neurons alone, in oligodendrocytes
            alone, and in the myeloid compartment alone, then compare survival, demyelination, and synaptic
            physiology against global restoration. In parallel, apply single-nucleus transcriptomics and
            synaptic and neuritic histopathology to post-mortem infantile and late-onset human Krabbe
            brain, using infant controls, to establish whether the neuronal signature seen in culture
            is present in human tissue.
          experiment_type:
            preferred_term: conditional cell-type-restricted rescue with human post-mortem validation
          decision_criterion: Neuron-restricted GALC restoration that improves synaptic physiology or
            survival, together with a matching neuronal signature in human tissue, would establish the
            arm as disease-relevant in humans. Absence of a neuronal signature in human brain, or no benefit
            from neuron-restricted rescue, would confine the finding to the model systems that generated
            it.
          would_support:
          - pathophysiology#Cell-Autonomous Neuronal Toxicity
          supporting_outcome:
          - Neuron-restricted GALC restoration measurably improves synaptic function or survival, and
            human Krabbe brain shows neuritic and synaptic pathology beyond what demyelination accounts
            for.
          refuting_outcome:
          - Neuron-restricted restoration changes nothing while glial or myeloid restoration reproduces
            the benefit of global restoration, and human tissue shows no neuron-intrinsic pathology.
      selected_evidence:
        snippet: Collectively, these findings identify presynaptic sphingolipid accumulation and impaired
          vesicle docking and fusion as shared mechanisms contributing to synaptic failure in several
          inherited sphingolipidoses, with potential relevance in adult-onset neurodegenerative diseases
          where lysosomal function is also compromised.
        supports: SUPPORT
