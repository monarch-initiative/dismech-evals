    evidence_metadata:
      reference: PMID:27780934
      reference_title: Patient fibroblasts-derived induced neurons demonstrate autonomous neuronal defects
        in adult-onset Krabbe disease.
      evidence_source: IN_VITRO
      explanation: 'Neurons converted directly from the fibroblasts of two adult-onset Krabbe patients
        carry a neuronal phenotype in a system that contains no oligodendrocytes, so the defect cannot
        be secondary to demyelination. Scope caveat: both donors were adult-onset compound heterozygotes,
        so extrapolation to infantile disease is an inference.'
