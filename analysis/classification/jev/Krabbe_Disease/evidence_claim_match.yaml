      reference_title: Macrophages Expressing GALC Improve Peripheral Krabbe Disease by a Mechanism Independent
        of Cross-Correction.
      evidence_source: IN_VITRO
      explanation: Direct experimental demonstration that GalCer accumulation in GALC-deficient macrophages
        — independent of psychosine — drives globoid-cell transformation and exacerbates the GLD phenotype,
        supporting a parallel macrophage-autonomous arm of the canonical model.
