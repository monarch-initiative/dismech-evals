    evidence_metadata:
      reference: PMID:37337846
      reference_title: Genetic ablation of Saposin-D in Krabbe disease eliminates psychosine accumulation
        but does not significantly improve demyelination.
      evidence_source: MODEL_ORGANISM
      explanation: Refutes the sufficiency half of this hypothesis as written. Saposin-D ablation leaves
        very little psychosine in the CNS or PNS of twitcher mice and does delay early demyelination,
        yet late-stage demyelination is comparable and survival is worse. Psychosine accumulation therefore
        cannot by itself account for progressive demyelination; the upstream GALC arm is untouched by
        this result.
