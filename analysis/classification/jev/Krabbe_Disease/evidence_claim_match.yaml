          infiltration of CD8-positive T lymphocytes, an adaptive immune component whose burden tracks
          with clinical severity and neuropathology (greater in a more rapidly fatal early-infantile case
          than in a slower-progressing infantile case). This extends the Krabbe neuroinflammatory picture
          beyond the innate arm to include adaptive immunity.
