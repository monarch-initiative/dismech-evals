      assertion_type: Treatment
      assertion:
        name: Substrate Reduction Therapy (Investigational)
        description: Because psychosine is generated catabolically by acid ceramidase (ACDase) deacylating
          galactosylceramide, ACDase inhibition is an emerging substrate reduction strategy that uncouples
          GALC deficiency from psychosine synthesis. Genetic ablation of ACDase in the twitcher mouse
          eliminates psychosine accumulation and rescues the phenotype, and pharmacological ACDase inhibition
          with carmofur lowers psychosine and extends twitcher lifespan. This approach is preclinical/investigational.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: carmofur
            term:
              id: CHEBI:31360
              label: Carmofur
      selected_evidence:
        snippet: 'genetic loss of ACDase activity (Farber disease) in the GALC-deficient mouse model of
          human GLD (twitcher) eliminates psychosine accumulation and cures GLD

          '
        supports: SUPPORT
