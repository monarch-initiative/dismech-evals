      assertion_type: Pathophysiology
      assertion:
        name: GalCer-Driven Macrophage Pathology
        description: GALC-deficient macrophages cannot degrade galactosylceramide (GalCer); when exposed
          to GalCer they are transformed into globoid cells and drive a more severe phenotype, independent
          of psychosine-induced oligodendrocyte demyelination. This identifies a parallel disease arm
          driven by macrophage-autonomous GalCer storage and explains why HSCT (delivering healthy phagocytic
          macrophages) reduces nerve globoid cells without requiring efficient enzyme cross-correction.
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
      selected_evidence:
        snippet: macrophages require GALC to degrade myelin, as Galc-deficient macrophages are transformed
          into globoid cells by exposure to galactosylceramide and produce a more severe GLD phenotype
        supports: SUPPORT
