        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_galc_deficiency_psychosine_demyelination_model
        hypothesis_label: Canonical GALC Deficiency / Psychosine-Mediated Demyelination Model
        status: CANONICAL
        description: Krabbe disease (globoid cell leukodystrophy) is an autosomal recessive lysosomal
          storage disorder caused by loss-of-function variants in GALC encoding galactocerebrosidase.
          Loss of GALC activity prevents lysosomal hydrolysis of galactosylceramide but, critically, also
          fails to clear its toxic deacylated lyso-derivative galactosylsphingosine (psychosine). Psychosine
          accumulation in oligodendrocytes and Schwann cells triggers apoptosis of myelin-forming cells,
          secondary lipid-laden multinucleated macrophages (globoid cells), and progressive CNS and peripheral
          demyelination. The infantile form (~85% of cases) presents in the first 6 months with irritability,
          hypertonia, opisthotonus, seizures, blindness, and death by age 2-3 in untreated patients. Pre-symptomatic
          hematopoietic stem cell transplantation (the only available disease-modifying therapy), the
          twitcher mouse model (Galc^trs/trs) faithfully recapitulating the human phenotype, and AAV-GALC
          gene therapy corroborate the GALC-deficiency / psychosine-toxicity / demyelination axis as the
          canonical pathogenic mechanism.
        notes: 'Retained as CANONICAL with required expansion to multi-mechanism framework. The 2026 openscientist
          hypothesis-search report (kb/hypotheses/Krabbe_Disease/canonical_galc_deficiency_psychosine_demyelination_model)
          finds SUPPORTED with significant qualifications. The core GALC-deficiency → psychosine-accumulation
          → demyelination cascade is quantitatively validated: residual GALC activity across 31 missense
          variants correlates with age of onset (Pearson r > 0.94); acid ceramidase ablation in twitcher
          mice eliminates psychosine and reportedly CURES GLD; gene therapy (AAV-GALC) corrects metabolism
          and extends survival in mouse and canine models; psychosine is validated as a newborn-screening
          biomarker. Critical refinement: PSYCHOSINE IS NECESSARY BUT NOT SUFFICIENT — (1) saposin-D ablation
          in twitcher mice eliminates psychosine accumulation yet fails to prevent late-stage demyelination
          (and even shortens lifespan); (2) a UGT8 inhibitor reduces psychosine by 72–86% without extending
          lifespan. The canonical model must expand to incorporate parallel/downstream mechanisms: (a)
          galactosylceramide-driven globoid-cell macrophage pathology; (b) neuroinflammation including
          adaptive immunity; (c) cell-autonomous neuronal dysfunction (not just oligodendrocyte/Schwann-cell
          death); (d) autophagy dysregulation; (e) UPR / ER stress; (f) emerging α-synuclein aggregation
          and sphingolipid fibril formation. GALC has critical functions beyond psychosine degradation.
          Pre-symptomatic HSCT remains the only disease-modifying therapy and validates the upstream GALC
          axis even though it does not fully prevent downstream cell-autonomous and inflammatory cascades.'
      selected_evidence:
        snippet: residual GALC activity strongly correlated with the age of disease-onset in reported
          cases (Pearson's r > 0.94, p < 0.0001), suggesting that enzyme activity resulting from MMV expression
          in this model may serve as a readout for clinical prognostication
        supports: SUPPORT
