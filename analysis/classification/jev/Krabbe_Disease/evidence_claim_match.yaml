      reference_title: Quantification profiles of enzyme activity, secretion, and psychosine levels of
        Krabbe disease galactosylceramidase missense variants.
      evidence_source: IN_VITRO
      explanation: Supplies the quantitative dose-response that this entry's notes previously asserted
        without a citation. A panel of 31 GALC missense variants expressed in a GALC-knockout human oligodendrocytic
        line ties residual enzyme activity to reported age of onset. The correlation is against onset
        ages taken from published case reports rather than a prospective cohort.
