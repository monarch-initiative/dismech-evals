              label: Kummell disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Basivertebral foramen microcirculation compromise
        description: 'The basivertebral foramen is a biomechanical weak point where stresses concentrate
          and fracture lines propagate. Specific morphological characteristics of the basivertebral foramen,
          including trapezoidal or irregular shapes and reduced height, are associated with Kummell disease.
          Single-holed basivertebral foramina predominate in affected patients (97% vs 76% in controls),
          suggesting that fewer septations contribute to microcirculatory compromise and structural vulnerability.

          '
        locations:
        - preferred_term: Vertebral body
          term:
            id: UBERON:0001075
            label: bony vertebral centrum
        biological_processes:
        - preferred_term: Angiogenesis
          term:
            id: GO:0001525
            label: angiogenesis
          modifier: DECREASED
        cell_types:
        - preferred_term: Endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: In patients with osteoporosis, the incidence of vertebral Kummell's disease can be associated
          with the morphological characteristics of the basivertebral foramen, as observed in the CT scan.
          Furthermore, the vertebral body with trapezoidal-shaped and irregular-shaped basivertebral foramen
          and boneless septum in the foramen is highly susceptible to Kummell's disease.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37353769
      reference_title: Correlation analysis between morphologic characteristics of the thoracolumbar basivertebral
        foramen and Kummell's disease in patients with osteoporosis using imaging techniques.
      evidence_source: HUMAN_CLINICAL
      explanation: CT imaging study demonstrates that basivertebral foramen morphology is a risk factor
        for Kummell disease, supporting the microcirculation compromise mechanism.
