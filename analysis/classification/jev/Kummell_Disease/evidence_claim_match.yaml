  9a2f645951c0405102515bc37eeecbaa83e9ac6b95d8f74dabf30e6b4c6cee5c:
    claim:
      about:
        disease:
          name: Kummell Disease
          disease_term:
            preferred_term: Kummell disease
            term:
              id: MONDO:0003940
              label: Kummell disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intravertebral vacuum cleft formation
        description: 'Gas accumulation (primarily nitrogen) within the necrotic vertebral body creates
          the characteristic vacuum cleft sign visible on radiographs and CT. This vacuum phenomenon results
          from the inability of the necrotic bone to heal, creating a fluid-filled or gas-filled cavity
          within the vertebral body. The cleft typically changes in size with spinal position, enlarging
          in extension and compressing in flexion, reflecting nonunion or pseudarthrosis within the vertebral
          body. Gas clefts appear hypointense on both T1 and T2 MRI, while fluid-filled clefts are T1-hypointense
          and T2-hyperintense.

          '
      selected_evidence:
        snippet: Kümmell's disease (KD) is a rare clinical entity characterized by delayed post-traumatic
          vertebral body collapse, in which an intravertebral vacuum cleft (IVC) is formed.
        supports: SUPPORT
    origin:
