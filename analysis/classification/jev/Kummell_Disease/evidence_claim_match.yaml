  db1b5bb6aa93545e24481ab66ec249ebf0c126568f606e44a034ce47a4d6764f:
    claim:
      about:
        disease:
          name: Kummell Disease
          disease_term:
            preferred_term: Kummell disease
            term:
              id: MONDO:0003940
              label: Kummell disease
        context: []
      assertion_type: Treatment
      assertion:
        name: Percutaneous kyphoplasty
        description: 'Balloon kyphoplasty involves percutaneous placement of an inflatable balloon tamp
          into the vertebral body to restore height before cement injection. Provides comparable pain
          relief and height restoration to vertebroplasty. Achieves fewer cement leakages than vertebroplasty
          but at higher cost and longer operative time. The relationship between cement distribution and
          the intravertebral cleft is an important factor affecting long-term outcomes.

          '
        context: Stage I-III disease without neurological deficits
        treatment_term:
          preferred_term: orthopedic procedure
          term:
            id: NCIT:C16186
            label: Orthopedic Surgical Procedure
        target_phenotypes:
        - preferred_term: Back pain
          term:
            id: HP:0003418
            label: Back pain
        - preferred_term: Kyphosis
          term:
            id: HP:0002808
            label: Kyphosis
        - preferred_term: Vertebral compression fracture
          term:
            id: HP:0002953
            label: Vertebral compression fracture
        notes: 'Fewer cement leakages (8.6%) compared to vertebroplasty (26.3%) but higher cost and longer
          operative time. Cement distribution relative to the cleft is critical: diffuse distribution
          around the cleft yields better outcomes than cement confined within the cleft. Liquid-filled
          IVCs with fibrosclerotic rims can limit cement dispersion and increase recollapse risk. PKP
          is also effective for stage III without neurological injury, though intact posterior walls yield
          better long-term vertebral height maintenance.

          '
      selected_evidence:
        snippet: PKP has a significant advantage over PVP in term of the fewer cement leakages.
        supports: SUPPORT
