      assertion_type: Pathophysiology
      assertion:
        name: Vertebral body avascular necrosis
        description: 'Following minor spinal trauma, disruption of the intraosseous blood supply to the
          vertebral body leads to ischemic necrosis of cancellous bone. The osteoporotic vertebral body
          is particularly vulnerable due to its already compromised trabecular architecture and vascular
          supply. The necrotic bone fails to heal through normal reparative processes, resulting in progressive
          structural weakening and eventual collapse of the vertebral body. Histopathological examination
          confirms bone necrosis in affected vertebrae.

          '
        locations:
        - preferred_term: Vertebral body
          term:
            id: UBERON:0001075
            label: bony vertebral centrum
        biological_processes:
        - preferred_term: Ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: ABNORMAL
        - preferred_term: Bone resorption
          term:
            id: GO:0045453
            label: bone resorption
          modifier: INCREASED
        cell_types:
        - preferred_term: Osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: Osteoclast
          term:
            id: CL:0000092
            label: osteoclast
      selected_evidence:
        snippet: Kummell's disease is an avascular necrosis of the vertebral body, secondary to a vertebral
          compression fracture. This entity is characterised by the gradual development in time of a vertebral
          body collapse following a trivial spinal trauma, involving a worsening back pain associated
          with a progressive kyphosis.
        supports: SUPPORT
