      assertion_type: Treatment
      assertion:
        name: Posterior spinal fusion
        description: 'Surgical stabilization with instrumented posterior osteotomy and spinal fusion is
          required for severe kyphotic deformity with neurological compromise (stage III). Posterior approaches
          are generally preferred over anterior reconstruction in patients with advanced age, serious
          comorbidities, and severe osteoporosis. Both anterior and posterior approaches improve pain,
          neurological dysfunction, and imaging outcomes.

          '
        context: Stage III disease with neurological deficits or severe kyphotic deformity
        treatment_term:
          preferred_term: orthopedic procedure
          term:
            id: NCIT:C16186
            label: Orthopedic Surgical Procedure
        target_phenotypes:
        - preferred_term: Myelopathy
          term:
            id: HP:0002196
            label: Myelopathy
        - preferred_term: Kyphosis
          term:
            id: HP:0002808
            label: Kyphosis
        notes: 'Posterior osteotomy is preferred over anterior reconstruction due to lower implant-related
          complication rates (14.3% vs 21.6%) and suitability for patients with severe osteoporosis. Anterior
          reconstruction more often requires a second surgery. Long-segment fixation provides greater
          stability in osteoporotic bone.

          '
      selected_evidence:
        snippet: This systematic review demonstrated that both AR and PO could improve pain, neurological
          dysfunction and imaging outcomes. However, serious comorbidities, multilevel corpectomies and/or
          severe osteoporosis highly required PO.
        supports: SUPPORT
