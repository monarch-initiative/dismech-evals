          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: HIF-1α/RANKL/Notch1 pathway bidirectionally regulates the differentiation of macrophages
          into osteoclasts under different conditions. In addition, HIF-1α is also regulated by many factors,
          including hypoxia, cofactor activity, non-coding RNA, trace elements, etc. As a pivotal pathway
          for coupling angiogenesis and osteogenesis, HIF-1α has been widely studied in bone metabolic
          diseases such as bone defect, osteoporosis, osteonecrosis of the femoral head, fracture, and
          nonunion.
        supports: SUPPORT
