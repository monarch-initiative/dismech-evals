      assertion_type: Prevalence
      assertion:
        population: Elderly with osteoporotic vertebral fractures
        percentage: 6.3
        notes: 'In one institutional series, 130 of 2074 OVCF patients (6.3%) were diagnosed with KD.
          The disease predominantly affects elderly patients (mean age ~79 years), especially postmenopausal
          women, and is most common at the thoracolumbar junction (T10-L2) with T12 being the most frequently
          affected level. Multi-level (double vertebrae) involvement occurs rarely but is associated with
          older age, lower BMD, and greater kyphotic deformity.

          '
      selected_evidence:
        snippet: Although more than a century has passed from its initial description, only few cases
          have been reported in the literature, whereas the main pathologic eliciting event is still under
          investigation.
        supports: SUPPORT
