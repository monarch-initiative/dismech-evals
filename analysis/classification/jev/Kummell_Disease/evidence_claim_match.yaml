      assertion:
        name: Spinal metastatic disease
        description: 'Vertebral collapse from metastatic malignancy can mimic Kummell disease on imaging.
          Intravertebral vacuum phenomena occur rarely in metastatic disease. Paravertebral soft tissue
          masses, irregular vertebral destruction, and multi-level involvement favor metastatic disease
          over Kummell disease.

          '
        distinguishing_features:
        - Paravertebral soft tissue mass or abscess typically present
        - Multi-level vertebral involvement common
        - History of primary malignancy
        - Bone scan shows multiple areas of uptake
      selected_evidence:
        snippet: although this radiographic sign is indicative of osteonecrosis, it is not pathognomonic
          and may be seen in an osteoporotic compression fracture, long-term corticosteroid therapy, myeloma,
          bone metastasis, acute fracture, osteomyelitis, alcoholism, diabetes mellitus, and arteriosclerosis
        supports: SUPPORT
