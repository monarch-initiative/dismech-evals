      assertion_type: Treatment
      assertion:
        name: Percutaneous vertebroplasty
        description: 'Percutaneous injection of polymethylmethacrylate (PMMA) bone cement into the collapsed
          vertebral body to stabilize the fracture and provide pain relief. Particularly effective in
          Kummell disease when cement can fill the intravertebral cleft. Pain relief is thought to be
          due to the elimination of motion at the fracture site by cementing. Use of rotary cutters before
          cement injection to destroy the IVC structure may improve outcomes.

          '
        context: Stage I-II disease without neurological deficits
        treatment_term:
          preferred_term: orthopedic procedure
          term:
            id: NCIT:C16186
            label: Orthopedic Surgical Procedure
        target_phenotypes:
        - preferred_term: Back pain
          term:
            id: HP:0003418
            label: Back pain
        - preferred_term: Vertebral compression fracture
          term:
            id: HP:0002953
            label: Vertebral compression fracture
        notes: 'Faster and less expensive than kyphoplasty with comparable pain relief and height restoration.
          Higher cement leakage rate (26.3%) compared to kyphoplasty (8.6%). Rotary cutter modification
          (RC-PVP) may improve cement interdigitation and clinical outcomes.

          '
      selected_evidence:
        snippet: RC-PVP, with the destruction of IVC, may lead to better clinical outcomes with fewer
          complications.
        supports: SUPPORT
