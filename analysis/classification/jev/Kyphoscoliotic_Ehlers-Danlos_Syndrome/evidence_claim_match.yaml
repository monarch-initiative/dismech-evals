          name: Kyphoscoliotic Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: Kyphoscoliotic Ehlers-Danlos Syndrome
            term:
              id: MONDO:0016002
              label: Ehlers-Danlos syndrome, kyphoscoliotic type 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical Suggestive Criteria (2017 International EDS Classification)
        description: 'kEDS is one of the 13 EDS subtypes for which the 2017 International EDS Classification
          defines a set of clinical criteria suggestive of the diagnosis. As with nearly all non-hypermobile
          EDS subtypes, these clinical criteria are suggestive only: definitive diagnosis of both kEDS-PLOD1
          and kEDS-FKBP14 requires molecular confirmation of biallelic pathogenic variants. For FKBP14-kEDS
          specifically, the clinical criteria require congenital muscular hypotonia together with congenital
          or early-onset kyphoscoliosis, plus generalized joint hypermobility or further gene-specific/supportive
          features; a subsequent 23-patient cohort refined these into explicit major criteria (severe
          generalized hypotonia at birth with improvement in infancy and delayed motor milestones; early-onset
          progressive kyphoscoliosis; joint hypermobility without pronounced contractures; foot deformities;
          and a normal or decreased urinary lysyl:hydroxylysyl pyridinoline ratio) and minor criteria
          (hyperelastic skin with follicular hyperkeratosis and easy bruising; myopathy; and hearing impairment).

          '
      selected_evidence:
        snippet: the major diagnostic criteria are (i) severe generalized hypotonia at birth with marked
          muscle weakness that improves in infancy, and delayed gross motor milestones; (ii) early-onset
          progressive (kypho)scoliosis; (iii) joint hypermobility without pronounced contractures; (iv)
          foot deformities; and (v) normal or decreased ratio of lysyl pyridinoline to hydroxylysyl pyridinoline
          in urine. Minor criteria include (i) hyperelastic skin with follicular hyperkeratosis, easy
          bruising, and occasional abnormal scarring; (ii) myopathy as seen clinically by reduced strength
          and endurance and confirmed in some patients by histology and muscle imaging; and (iii) hearing
          impairment that is predominantly sensorineural and may not be present in all individuals.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/2
      context_paths:
