        name: CNS neoplasm
        frequency: VERY_RARE
        notes: 'The band and the clinical importance point in opposite directions and should not be conflated.
          VERY_RARE reflects how few L-2-HGA patients develop a CNS tumour in absolute terms; the clinically
          actionable fact is that their lifetime risk is markedly ELEVATED relative to the general population,
          which is why this entry carries neuroimaging surveillance as a treatment. A reader should not
          take VERY_RARE as a reason to omit surveillance.

          '
        description: 'L2HGA patients have a significantly increased lifetime risk of central nervous system
          tumors, including malignant glioma. Despite the theoretical epigenetic effects of L-2-HG on
          TET enzymes, L2HGA-associated tumors do not typically show IDH-mutant-like methylation profiles,
          suggesting a distinct oncogenetic mechanism.

