              label: L2HGDH
        features: 'L2HGDH encodes a mitochondrial FAD-dependent enzyme that catalyzes oxidation of L-2-hydroxyglutarate
          to alpha-ketoglutarate. Biallelic pathogenic variants including missense, nonsense, frameshift,
          and splice site mutations have been reported. The enzyme functions as a metabolite-repair enzyme
          clearing an aberrant byproduct of L-malate dehydrogenase activity. Consanguinity is a significant
          risk factor given the autosomal recessive inheritance.

          '
