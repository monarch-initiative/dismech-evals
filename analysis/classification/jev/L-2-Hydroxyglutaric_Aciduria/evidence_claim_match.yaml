      assertion:
        phase: Slowly progressive neurological deterioration
        age_range: Childhood through adulthood
        notes: 'The course is slowly progressive over years to decades. The tone abnormality itself evolves:
          hypotonia predominates in earlier stages and spasticity in later stages, so a patient assessed
          once may be mischaracterised. About a quarter of patients experience frank neurological decompensation
          in the sense of losing acquired milestones - unassisted walking, speech - which is a loss of
          function rather than a metabolic crisis.

          '
      selected_evidence:
        snippet: Hypotonia was most prevalent in the earlier stages and spasticity in the latter stages
          of disease in their cohort.
        supports: SUPPORT
