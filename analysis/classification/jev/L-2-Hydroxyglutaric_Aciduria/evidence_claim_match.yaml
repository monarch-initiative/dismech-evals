            term:
              id: MONDO:0009370
              label: L-2-hydroxyglutaric aciduria
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: L2HGDH enzymatic deficiency
        biological_scale: MOLECULAR
        notes: 'No module conformance is asserted in this entry, deliberately. metabolic_intoxication_decompensation
          is the module this disorder would be grouped with on biochemical classification - it is an organic
          aciduria caused by an enzyme deficiency with metabolite accumulation - but it lacks the feature
          that module models. There is no catabolic trigger, no acidotic episode and no metabolic emergency:
          L-2-HGA is a slowly progressive neurodegenerative disease. Where the literature uses the word
          "decompensation" for this disorder it means loss of acquired milestones, not a metabolic crisis.
          The progression section states this explicitly so the distinction is visible to readers, not
          only to curators.

          '
        description: 'Biallelic pathogenic variants in L2HGDH reduce mitochondrial L-2-hydroxyglutarate
          dehydrogenase metabolite-repair activity, impairing conversion of L-2-hydroxyglutarate back
          to 2-ketoglutarate.

          '
        genes:
        - preferred_term: L2HGDH
          term:
            id: hgnc:20499
            label: L2HGDH
        molecular_functions:
        - preferred_term: L-2-hydroxyglutarate dehydrogenase metabolite-repair activity
          term:
            id: GO:0047545
            label: (S)-2-hydroxyglutarate dehydrogenase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: organic acid metabolic process
          term:
            id: GO:0006082
            label: organic acid metabolic process
          modifier: DECREASED
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: L-2-HG accumulates in L-2-HGA patients when L-2-HGDH is impaired
        supports: SUPPORT
