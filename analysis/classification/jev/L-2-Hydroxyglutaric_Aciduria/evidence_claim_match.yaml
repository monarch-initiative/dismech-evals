              label: L-2-hydroxyglutaric aciduria
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Insidious childhood onset
        age_range: Infancy to early childhood
        notes: 'Onset is insidious rather than acute. Unlike the organic acidemias with which it is grouped
          biochemically, L-2-HGA has NO acute metabolic decompensation crises - there is no catabolic
          trigger, no acidotic episode, and no metabolic emergency to recognise. Presentation is instead
          delayed mental and motor development, which virtually all patients display.

          '
      selected_evidence:
        snippet: Several clinical reports of L-2-HGA have appeared since the index case in 1980 (Barth
          et al 1993; Barbot et al 1997; Achouri et al 2004; Topcu et al 2005; Steenweg et al 2009, 2010).
          The phenotype is homogeneous (Table 5). Steenweg and co-workers described the largest cohort
          of 106 patients. An insidious onset of disease starting in childhood, developmental delay, epilepsy
          and cerebellar ataxia were the cardinal clinical signs (Steenweg et al 2010). Accordingly, the
          course of the disease is slowly progressive. Therefore, mild L-2-HGA patients often remain undiagnosed
          until adolescence or even adulthood. Virtually all patients display delayed mental and motor
          development, and about two-third of them epilepsy and cerebellar dysfunction. ... Acute metabolic
          derangement has not been reported in L-2-HGA, although rapid deterioration has been noted in
          nine cases, in relation to brain tumors (Moroni et al 2004; Haliloglu et al 2008; Aghili et
          al 2009).
        supports: SUPPORT
    origin:
