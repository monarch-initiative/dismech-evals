      assertion_type: Genetic
      assertion:
        name: L1CAM
        gene_term:
          preferred_term: L1CAM
          term:
            id: hgnc:6470
            label: L1CAM
        association: Loss-of-function and missense variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: X-linked recessive inheritance
          inheritance_term:
            preferred_term: X-linked recessive inheritance
            term:
              id: HP:0001419
              label: X-linked recessive inheritance
        notes: 'More than 280 distinct L1CAM variants have been reported, approximately 50% missense,
          with many "private" to individual families. Variant types include missense, nonsense, frameshift,
          splice-altering, and structural variants/CNVs. Even synonymous (silent) coding variants can
          be pathogenic when they activate a cryptic splice site and cause in-frame exon deletion, so
          silent variants detected on exome sequencing should not be dismissed. A genotype-phenotype trend
          exists: truncating variants (especially extracellular-domain truncations producing absent/non-detectable
          protein) are associated with severe phenotypes and higher infant mortality, whereas missense
          and cytoplasmic-domain variants tend to produce milder phenotypes.'
      selected_evidence:
        snippet: Its mutations result in L1 syndrome which is associated with brain malformation and nervous
          developmental delay.
        supports: SUPPORT
    origin:
