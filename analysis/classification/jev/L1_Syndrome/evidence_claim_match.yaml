      assertion_type: Pathophysiology
      assertion:
        name: Impaired Axon Guidance and Neurite Outgrowth
        description: L1 normally promotes neurite outgrowth, axon guidance/pathfinding, and neuronal migration.
          A 2023 mechanistic study showed that the L1-70 fragment binds LC3 (an autophagy-related protein)
          via an extracellular LC3-interacting region (LIR) motif in the fourth fibronectin type III domain,
          and that this interaction is required for L1-mediated neurite outgrowth and neuronal survival,
          linking L1CAM processing to autophagy-related machinery. Loss of L1 function therefore impairs
          the formation of major axon tracts.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: axon guidance
          term:
            id: GO:0007411
            label: axon guidance
          modifier: ABNORMAL
        - preferred_term: neuron projection development
          term:
            id: GO:0031175
            label: neuron projection development
          modifier: DECREASED
        - preferred_term: neuron migration
          term:
            id: GO:0001764
            label: neuron migration
          modifier: ABNORMAL
      selected_evidence:
        snippet: The disruption of the L1-LC3 interaction reduces L1-mediated neurite outgrowth and neuronal
          survival.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37569906
      reference_title: Interaction of L1CAM with LC3 Is Required for L1-Dependent Neurite Outgrowth and
        Neuronal Survival.
      evidence_source: IN_VITRO
      explanation: In vitro evidence that an L1CAM-dependent interaction is required for neurite outgrowth
        and neuronal survival, supporting impaired neurite outgrowth as a consequence of L1 dysfunction.
