      assertion_type: Pathophysiology
      assertion:
        name: Defective L1CAM Neural Cell Adhesion
        description: Loss-of-function or hypomorphic variants in L1CAM impair the function of the L1 cell
          adhesion molecule, a single-pass transmembrane glycoprotein of the immunoglobulin superfamily
          expressed in neurons and Schwann cells. L1 is essential for nervous system development, mediating
          cell adhesion, signaling, and membrane trafficking. Mutations are distributed across the functional
          protein domains; the precise mechanisms by which they cause loss of L1 function are incompletely
          understood.
        gene:
          preferred_term: L1CAM
          description: L1 cell adhesion molecule, an Ig-superfamily neuronal cell adhesion molecule.
          modifier: ABNORMAL
          term:
            id: hgnc:6470
            label: L1CAM
        cell_types:
