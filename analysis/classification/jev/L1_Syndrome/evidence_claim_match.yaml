            label: nervous system development
          modifier: ABNORMAL
        - preferred_term: myelination
          term:
            id: GO:0042552
            label: myelination
          modifier: ABNORMAL
      selected_evidence:
        snippet: The responsible gene, L1CAM, encodes the L1 protein which is a member of the immunoglobulin
          superfamily of neuronal cell adhesion molecules. The L1 protein is expressed in neurons and
