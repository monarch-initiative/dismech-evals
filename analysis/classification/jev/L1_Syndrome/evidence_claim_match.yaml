          term:
            id: GO:0001764
            label: neuron migration
          modifier: ABNORMAL
      selected_evidence:
        snippet: L1-70 interacts with LC3 via the extracellular LIR motif in the fourth fibronectin type
          III domain
        supports: SUPPORT
