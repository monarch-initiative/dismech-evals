            term:
              id: MONDO:0859573
              label: bent bone dysplasia syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disordered Chondrogenesis and Skeletal Mineralization
        biological_scale: TISSUE
        description: 'LAMA5 is expressed throughout cartilage — growth plate, articular chondrocytes,
          perichondrium — as well as in periosteum, trabecular bone, ligament and muscle, and PYK2 and
          FYN share that distribution. Losing the adhesion axis in those tissues yields under-mineralized,
          sharply angulated long bones with abnormal cortices, an under-mineralized calvarium, platyspondyly
          with coronal clefts and hypoplastic acetabula. The paper also raises a mechanical contribution:
          the contractures and elbow fusions imply abnormal muscle function, and altered mechanical force
          during development is an established route to bone bending.'
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: skeletal system development
          term:
            id: GO:0001501
            label: skeletal system development
          modifier: DECREASED
        - preferred_term: biomineral tissue development
          term:
            id: GO:0031214
            label: biomineral tissue development
          modifier: DECREASED
      selected_evidence:
        snippet: Radiographic findings included under-mineralization of the calvarium (Fig. 1a-b and S1),
          distinctly bent, under-mineralized long bones, particularly of the femora, with mid-diaphyseal
          angulation (Fig. 1c-e and S1), platyspondyly with coronal clefts (Fig. 1f-g and S1), hypoplastic
          acetabular roofs with femoral head dislocation, (Fig. 1e and S1), and bilateral upper and lower
          extremity contractures (Fig. 1h-j and S1).
        supports: SUPPORT
