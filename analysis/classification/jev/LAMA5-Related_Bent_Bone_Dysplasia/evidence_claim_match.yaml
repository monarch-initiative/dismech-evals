      about:
        disease:
          name: LAMA5-Related Bent Bone Dysplasia
          disease_term:
            preferred_term: bent bone dysplasia syndrome 2
            term:
              id: MONDO:0859573
              label: bent bone dysplasia syndrome 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bbds2_muscle_contribution_to_bone_bending
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Disordered Chondrogenesis and Skeletal Mineralization
        prompt: How much of the long-bone angulation is cell-autonomous to cartilage and bone, and how
          much is secondary to abnormal muscle function acting on a developing skeleton?
        rationale: LAMA5 is expressed in muscle as well as cartilage and bone, the affected siblings had
          arthrogryposis, elbow fusions and no respiratory effort at birth, and altered mechanical force
          during development is an established route to bone bending. If the mechanical contribution is
          substantial, the disorder is partly a neuromuscular one and the pathograph as curated understates
          that arm. No muscle histology or function data are reported.
      selected_evidence:
        snippet: Thus, the potential for abnormal muscular function due to loss of LAMA5 is of particular
          interest in this disorder since muscle defects have also been speculated to contribute to bending
          of appendicular bones by altered mechanical forces during development
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
