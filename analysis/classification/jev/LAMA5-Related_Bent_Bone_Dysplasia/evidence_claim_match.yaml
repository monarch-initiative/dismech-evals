      assertion_type: Discussion
      assertion:
        discussion_id: bbds2_single_kindred_gene_disease_validity
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#LAMA5
        prompt: Is LAMA5 established as the cause of a bent-bone dysplasia, or is the gene-disease relationship
          still limited by resting on one kindred with two SIFT-benign missense alleles?
        rationale: Everything known about this disorder comes from three siblings in one family. The functional
          case is strong — reduced LAMA5 protein in three patient tissue types, a concordant gene-edited
          line, and a coherent signaling pathway — but neither allele is a null, both are called benign
          by at least one predictor, and no second family has been reported in the five years since. A
          second unrelated kindred, or a ClinGen Gene-Disease Validity assertion, would settle it. The
          ISDS committee listed the disorder in 2023 on this evidence, which is itself an expert judgement
          worth recording.
      selected_evidence:
        snippet: We identified three siblings from a single nonconsanguineous family (International Skeletal
          Dysplasia Registry reference number R03–206) with skeletal defects that did not phenotypically
          or radiographically match any of the currently classified skeletal disorders.
        supports: SUPPORT
