            label: actin cytoskeleton organization
          modifier: DECREASED
      selected_evidence:
        snippet: These results confirmed a disruption in cellular focal adhesion properties in LAMA5 defective
          cells by altered cytoskeletal architecture, vinculin localization, and diminished cell healing.
        supports: SUPPORT
