      assertion_type: Genetic
      assertion:
        name: LAMA5
        gene_term:
          preferred_term: LAMA5
          term:
            id: hgnc:6485
            label: LAMA5
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'LAMA5 encodes the alpha-5 laminin chain of the basement membrane. The two causal alleles
          in the delineating kindred are c.4213G>A (p.Ala1405Thr), inherited from the father and carried
          also by one unaffected sibling, and c.6157C>T (p.Arg2053Cys), inherited from the mother. Both
          are rare in gnomAD (allele frequencies 0.0006 and 0.0003) and neither has been seen homozygous.
          Both were called benign by SIFT, which is why the protein-level work in patient chondrocytes,
          fibroblasts and cartilage carries the pathogenicity argument rather than prediction.

          Gene-disease validity here rests on a single kindred plus functional work. No ClinGen Gene-Disease
          Validity assertion for LAMA5 and this phenotype was found. Two earlier LAMA5 reports describe
          unrelated phenotypes and do not contribute to this gene-disease relationship.'
      selected_evidence:
        snippet: These reports illustrate the potential for defective LAMA5 to produce disease, though
          the phenotypes differ from each other and our findings.
        supports: SUPPORT
