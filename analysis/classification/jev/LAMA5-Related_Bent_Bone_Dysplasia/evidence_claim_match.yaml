  78ea7319711fee1bebd18eebc03e7abffd9212d12de136dbc0d3157f814bf181:
    claim:
      about:
        disease:
          name: LAMA5-Related Bent Bone Dysplasia
          disease_term:
            preferred_term: bent bone dysplasia syndrome 2
            term:
              id: MONDO:0859573
              label: bent bone dysplasia syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Noncanonical Beta-1 Integrin Focal Adhesion Signaling Failure
        biological_scale: CELLULAR
        description: 'Reduced alpha-5 laminin in the basement membrane leaves beta-1 integrin without
          its ligand, and the focal adhesion complex fails — but not by the textbook route. Phosphorylated
          FAK, the canonical integrin transducer, is unchanged in both patient chondrocytes and the hypomorphic
          cell line. What falls instead is PYK2, the FAK paralogue whose expression is largely confined
          to bone and cartilage, together with the skeletally enriched SRC-family kinase FYN and the downstream
          phospho-p130CAS and phospho-paxillin. The unchanged FAK is the load-bearing negative result:
          it is what makes this a distinct, tissue-restricted signaling axis rather than generic integrin
          failure, and it is why the disorder is skeletal despite LAMA5 being expressed almost everywhere.'
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: cell-matrix adhesion
          term:
            id: GO:0007160
            label: cell-matrix adhesion
          modifier: DECREASED
        - preferred_term: integrin-mediated signaling pathway
          term:
            id: GO:0007229
            label: integrin-mediated signaling pathway
          modifier: DECREASED
        - preferred_term: focal adhesion assembly
          term:
            id: GO:0048041
            label: focal adhesion assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Loss of LAMA5 altered β1 integrin signaling through the non-canonical kinase PYK2 and
          the skeletal enriched SRC kinase, FYN.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
