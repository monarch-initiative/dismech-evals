      assertion_type: Discussion
      assertion:
        discussion_id: bbds2_wnt_to_mineralization_step_unproven
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Diminished Canonical WNT Signaling
        prompt: Does the reduced canonical WNT signaling actually cause the under-mineralization in this
          disorder, or is it a parallel consequence of FYN loss that happens to be measurable?
        rationale: The WNT node was investigated because under-mineralization was seen radiographically
          and WNT is known to drive mineralization — the reasoning runs from phenotype to candidate pathway.
          What was then measured is reduced TCF/LEF reporter activity and reduced LRP6 phosphorylation
          in chondrocytes and HeLa cells, which establishes that WNT output falls but not that this fall
          produces the bone phenotype. No rescue of mineralization by restoring WNT, and no skeletal model
          of Lama5 deficiency, is reported.
      selected_evidence:
        snippet: Based on the radiographic phenotype that included decreased mineralization of the axial
          and appendicular bone, we investigated whether altered WNT signaling could contribute to the
          phenotype since loss of WNT signaling negatively impacts skeletal mineralization
        supports: SUPPORT
