        gene_term:
          preferred_term: LAMB1
          term:
            id: hgnc:6486
            label: LAMB1
        relationship_type: CAUSATIVE
        notes: 'Biallelic (homozygous or compound-heterozygous) loss-of-function variants in LAMB1 (laminin
          subunit beta-1) cause cobblestone brain malformation; LAMB1 is localized to the pial basement
          membrane. The disorder is transmitted as an autosomal-recessive trait, and nearly all reported
          families are consanguineous. A genotype-phenotype correlation is emerging: homozygous frameshift/truncating
          (complete loss-of-function) alleles produce the most severe, congenital-onset disease, whereas
          missense/in-frame (hypomorphic) alleles produce milder, sometimes adult-onset leukoencephalopathy.

          '
        variants:
        - name: c.1378T>C (p.Cys460Arg)
          description: 'Homozygous missense variant in an EGF-like repeat; associated with the mild, adult-onset
            leukoencephalopathy end of the recessive spectrum.

            '
          type: missense
          clinical_significance: LIKELY_PATHOGENIC
        - name: c.2690+1G>A
          description: 'Splice-site variant identified (compound heterozygous) by prenatal whole-exome
            sequencing in fetuses with congenital hydrocephalus.

            '
          type: splice site
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: Here we report homozygous deleterious mutations in LAMB1, encoding laminin subunit beta-1,
          in two families with autosomal-recessive COB.
        supports: SUPPORT
