  14e1cc7a6a7c7bfb5bbf3826cf081c2ae27ddc9f5cd551ba08cbdc6325f22ac3:
    claim:
      about:
        disease:
          name: LAMB1-Related Cobblestone Lissencephaly
          disease_term:
            preferred_term: cobblestone lissencephaly without muscular or ocular involvement
            term:
              id: MONDO:0014077
              label: cobblestone lissencephaly without muscular or ocular involvement
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_lamb1_pial_boundary_human_model_translatability
        prompt: No mouse model of laminin beta-1 loss in the pial basement membrane exists; the rodent
          evidence for this entry's boundary-failure chain comes from other laminin chains (a laminin
          gamma1 nidogen-binding-site deletion, and Lamb2/Lamc3 double-null mice). Does that cross-chain
          evidence license the LAMB1-specific mechanism in humans, given that laminin-chain redundancy
          and heterozygous dosage sensitivity plainly differ between the two systems?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Pial Basement Membrane Breach
        - pathophysiology#Radial-Glial Basal Endfoot Detachment
        - pathophysiology#Neuronal Overmigration Through the Pial Surface
        rationale: 'The pial-boundary mechanism this entry curates — basement-membrane discontinuity,
          radial-glial endfoot retraction, and neuronal overmigration past the pial surface — is directly
          demonstrated in mice, but in every available model the perturbed subunit is a laminin chain
          other than beta-1: a targeted deletion of the nidogen-binding site of laminin gamma1, and ablation
          of the beta2 and gamma3 chains. For LAMB1 itself the human mechanism is inferred from protein
          localization ("LAMB1 is localized to the pial basement membrane, suggesting that defective connection
          ... leads to this malformation"), not from a Lamb1 model. Two concrete mismatches follow. First,
          laminin heterotrimers are combinatorial and partly redundant, so which pial-basement-membrane
          functions specifically require beta-1 rather than being buffered by another beta chain cannot
          be read off the gamma1 or beta2/gamma3 models. Second, the beta2/gamma3 model is dose-sensitive
          — heterozygous mice already show cortical laminar disruption — whereas human heterozygous LAMB1
          carriers are clinically and radiologically unaffected, so mouse allele dosage does not map onto
          the strictly recessive human disease. This is a model-translatability gap, not an absence of
          mechanism evidence.'
        proposed_experiments:
        - experiment_id: exp_lamb1_organoid_pial_ecm_chain_specificity
          experiment_design: TARGETED_PERTURBATION
          name: LAMB1 chain-specificity test in human cortical organoids with a pial-like ECM interface
          description: Build isogenic human iPSC-derived cortical organoids carrying biallelic LAMB1 loss-of-function
            and hypomorphic missense alleles, cultured against a defined laminin-rich pial-like extracellular-matrix
            interface, and compare them with LAMB2 and LAMC1 perturbations in the same background. Score
            basement-membrane continuity, radial-glial basal endfoot anchoring, and neuronal overmigration
            past the matrix boundary, and ask whether other beta chains compensate for beta-1 loss. Heterozygous
            lines are included to test directly whether the mouse dosage sensitivity has a human counterpart.
          experiment_type:
            preferred_term: isogenic human cortical organoid chain-substitution experiment
          model_systems:
          - name: Human cortical organoid with engineered pial-like laminin ECM interface
            description: Human iPSC-derived cortical organoids with an engineered laminin-rich pial-like
              matrix boundary, in isogenic LAMB1 wild-type, heterozygous, and biallelic-variant states.
            experimental_model_type: ORGANOID
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: cortical radial glial cell
              term:
                id: CL:0013000
                label: forebrain radial glial cell
            cell_source: CRISPR-engineered or patient-derived human induced pluripotent stem cells
            culture_system: Three-dimensional cortical organoids at a defined laminin-rich matrix boundary
          perturbations:
          - name: LAMB1 allelic series with LAMB2 and LAMC1 comparators
            target: pathophysiology#Laminin Beta-1 Deficiency in the Pial Basement Membrane
            genes:
            - preferred_term: LAMB1
              term:
                id: hgnc:6486
                label: LAMB1
            description: Biallelic null, biallelic hypomorphic missense, and heterozygous LAMB1 states,
              with LAMB2 and LAMC1 perturbations in the same isogenic background as chain-specificity
              comparators.
          readouts:
          - name: Basement-membrane continuity at the pial-like boundary
            target: pathophysiology#Pial Basement Membrane Breach
            biological_processes:
            - preferred_term: basement membrane organization
              term:
                id: GO:0071711
                label: basement membrane organization
              modifier: DECREASED
            direction: DECREASED
            interpretation: A beta-1-specific loss of continuity that other beta chains do not rescue
              would establish chain specificity in a human system.
          - name: Neuronal overmigration past the matrix boundary
            target: pathophysiology#Neuronal Overmigration Through the Pial Surface
            biological_processes:
            - preferred_term: neuron migration
              term:
                id: GO:0001764
                label: neuron migration
              modifier: INCREASED
            direction: INCREASED
            interpretation: Overmigration confined to biallelic lines, with unaffected heterozygotes,
              would show that the mouse heterozygous phenotype has no human counterpart.
          decision_criterion: Chain specificity is supported if biallelic LAMB1 loss breaches the matrix
            boundary and drives overmigration where LAMB2 perturbation in the same background does not;
            the mouse dosage mismatch is confirmed if heterozygous LAMB1 organoids are indistinguishable
            from wild type.
      selected_evidence:
        snippet: In segments with a disrupted basement membrane, radial glia cells were retracted from
          the pial surface, and radially migrating neurons, including Cajal-Retzius cells and cortical
          plate neurons, passed the meninges or terminated their migration prematurely.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12122064
      reference_title: A critical function of the pial basement membrane in cortical histogenesis.
      evidence_source: MODEL_ORGANISM
      explanation: Demonstrates this entry's endfoot-detachment and overmigration chain in mouse, but
        in a laminin gamma1 nidogen-binding-site mutant rather than in a Lamb1 model — the substitution
