  5be432eba1e69281f3cce432652c096eead5dc2b59a589ace3c77de83a083679:
    claim:
      about:
        disease:
          name: LAMB1-Related Cobblestone Lissencephaly
          disease_term:
            preferred_term: cobblestone lissencephaly without muscular or ocular involvement
            term:
              id: MONDO:0014077
              label: cobblestone lissencephaly without muscular or ocular involvement
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_lamb1_allelic_spectrum_phenotype_determinants
        prompt: Why does biallelic LAMB1 loss produce a phenotypic range as wide as lethal fetal hydranencephaly,
          classic congenital cobblestone lissencephaly with hydrocephalus, and adult-onset leukoencephalopathy
          with no cortical dysgenesis at all — and is the truncating-versus-missense correlation this
          entry records actually established, or an artifact of a cohort of about a dozen patients?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Laminin Beta-1 Deficiency in the Pial Basement Membrane
        - pathophysiology#Cobblestone Cortical Malformation
        rationale: 'The reported LAMB1 phenotypic spectrum spans an extraordinary range for a single gene:
          at the severe end, fetal hydranencephaly incompatible with life; in the middle, the cobblestone
          malformation with hydrocephalus that defines this entry; and at the mild end, an adult-onset
          leukoencephalopathy in which cortical dysgenesis was explicitly absent. The entry''s genetic
          notes describe the truncating-versus-hypomorphic gradient as "emerging", which is the right
          hedge — the whole reported cohort was about eleven patients and eleven variants, far too small
          to establish a genotype-phenotype rule, and it does not explain how a biallelic LAMB1 genotype
          can spare the cortical malformation entirely. Whether the determinant is residual laminin beta-1
          function, compensating laminin chains, modifier background, or developmental timing of pial
          basement-membrane assembly is unresolved. This is the disease-level instance of the non-one-to-one
          gene-to-phenotype mapping that the cortical malformation review flags as a general gap for malformations
          of cortical development, and it bounds what this entry may claim: the cobblestone malformation
          is not an obligate consequence of biallelic LAMB1 loss.'
        proposed_experiments:
        - experiment_id: exp_lamb1_genotype_stratified_registry_and_residual_function
          experiment_design: HUMAN_OBSERVATIONAL
          name: Genotype-stratified LAMB1 registry with residual laminin beta-1 function assay
          description: Assemble a multi-centre registry of all biallelic LAMB1 cases with standardised
            fetal and postnatal neuroimaging review, and pair each genotype with a quantitative assay
            of residual laminin beta-1 protein and heterotrimer assembly in patient fibroblasts or iPSC-derived
            cells. Test whether measured residual function, rather than variant class alone, separates
            the hydranencephaly, cobblestone, and isolated-leukoencephalopathy presentations, and whether
            laminin beta-2 upregulation tracks with the milder outcomes.
          experiment_type:
            preferred_term: genotype-stratified natural history study with functional assay
          decision_criterion: The correlation is established if residual laminin beta-1 function separates
            the three presentation classes with no overlap; it is refuted if patients with indistinguishable
            residual function fall on opposite ends of the cortical-malformation spectrum, which would
            point to modifiers or developmental timing instead.
      selected_evidence:
        snippet: Herein we present LAMB1 as a monogenic cause of fetal hydranencephaly which was incompatible
          with life.
        supports: SUPPORT
