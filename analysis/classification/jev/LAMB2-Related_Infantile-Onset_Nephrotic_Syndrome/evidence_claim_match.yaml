        biological_scale: TISSUE
        description: Without laminin beta2 the GBM fails the developmental switch from laminin beta1 to
          beta2 and stays rich in beta1. It is ultrastructurally intact and contains normal collagenous
          components, but shows ectopic deposition of several laminins and mislocalized anionic sites.
          Laminin beta1 is marginally increased but does not compensate.
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
        biological_processes:
        - preferred_term: glomerular basement membrane development
          modifier: ABNORMAL
          term:
            id: GO:0032836
            label: glomerular basement membrane development
      selected_evidence:
        snippet: In both Pierson syndrome and the Lamb2(-/-) mouse model for this disease, laminin β1
          (Lamβ1), a structurally similar homolog of Lamβ2, is marginally increased in the GBM, but it
          fails to fully compensate for the loss of Lamβ2, leading to the filtration barrier defects and
          nephrotic syndrome.
        supports: SUPPORT
