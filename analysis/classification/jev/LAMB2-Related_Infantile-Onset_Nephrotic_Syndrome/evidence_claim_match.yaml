              id: MONDO:0013621
              label: LAMB2-related infantile-onset nephrotic syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: Isolated LAMB2 nephropathy
        display_name: Isolated or oligosymptomatic LAMB2 nephropathy
        description: Congenital or later-onset nephrotic syndrome, steroid-resistant nephrotic syndrome,
          or isolated proteinuria and hematuria without microcoria, with absent or minor ocular changes
          and without neurologic abnormalities. At least one allele is usually a missense, small in-frame
          or leaky splice variant, and kidney disease starts later and progresses more slowly than in
          Pierson syndrome. Patients without congenital eye anomalies remain at risk of later retinal
          detachment. Among patients with isolated nephrotic syndrome, LAMB2 variants are rare. No separate
          MONDO term exists for this form.
        genes:
        - preferred_term: LAMB2
          term:
            id: hgnc:6487
            label: LAMB2
      selected_evidence:
        snippet: These findings demonstrate that the spectrum of LAMB2-associated disorders is broader
          than previously anticipated and includes congenital nephrotic syndrome without eye anomalies
          or with minor ocular changes different from those observed in Pierson syndrome.
        supports: SUPPORT
