          description: Recurrent LN-domain missense variant seen in five unrelated families, on a shared
            haplotype in three families of Portuguese origin, and associated with Pierson syndrome; it
            markedly reduces laminin beta2 expression.
          gene:
            preferred_term: LAMB2
            term:
              id: hgnc:6487
              label: LAMB2
          clinical_significance: PATHOGENIC
          type: missense_variant
        - name: p.Arg246Gln (R246Q)
          description: Homozygous LN-domain missense variant at the same codon as R246W, found in siblings
            with isolated congenital nephrotic syndrome; in transgenic mice it impairs laminin-521 secretion.
          gene:
            preferred_term: LAMB2
            term:
              id: hgnc:6487
              label: LAMB2
          clinical_significance: PATHOGENIC
          type: missense_variant
        - name: p.Cys321Arg (C321R)
          description: Missense variant at an invariant cysteine of the first EGF-like domain, causing
            congenital nephrotic syndrome with only mild extrarenal features; it causes podocyte ER stress
            in transgenic mice.
          gene:
            preferred_term: LAMB2
            term:
              id: hgnc:6487
              label: LAMB2
          clinical_significance: PATHOGENIC
          type: missense_variant
      selected_evidence:
        snippet: Our current data suggest that human laminin beta2 deficiency is consistently and specifically
          associated with this particular oculorenal syndrome.
        supports: SUPPORT
