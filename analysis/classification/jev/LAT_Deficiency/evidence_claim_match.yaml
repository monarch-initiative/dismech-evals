    claim:
      about:
        disease:
          name: LAT Deficiency
          disease_term:
            preferred_term: LAT deficiency
            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Lat-null mouse
        species: Mouse
        genotype: Lat knockout (Lat-/-)
        publication: PMID:10204488
        description: The original null model. Thymocyte development is blocked within the CD4-CD8- double-negative
          compartment and no mature peripheral T cells appear, while B cells are normal. It established
          that LAT is required for T-cell development, and its block is more complete than any human patient's.
        modeled_mechanisms:
        - target: Arrest of Thymic T Cell Development
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Reproduces the requirement for LAT in thymic development, and locates the checkpoint,
            but at a severity the human disease does not reach.
          limitations: Mice lacking LAT, and mice in which all four cytoplasmic tyrosines are replaced,
            have no peripheral T cells at all. Patients homozygous for an allele that removes the same
            four tyrosines still produce mature T cells, and in one kindred those T cells were present
            in normal numbers for years. A study reading peripheral T-cell numbers off this model would
            describe a more absolute deficit than patients have.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The murine developmental block is complete at the DN3 stage; the human block
              is partial and variable despite an allele that removes the same four phosphorylation sites.
              No compensating adaptor has been found to explain the difference, so the divergence is unexplained
              rather than attributable to a known paralogue.
      selected_evidence:
        snippet: To probe the role of LAT in T cell development, the LAT gene was disrupted by targeting.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
