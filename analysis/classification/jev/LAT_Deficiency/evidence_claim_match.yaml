  905a4f3a067d50c5d7d437ebf278b58b275282aecfc8f9609ec5b7d73c3067c6:
    claim:
      about:
        disease:
          name: LAT Deficiency
          disease_term:
            preferred_term: LAT deficiency
            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: non_t_lineage_contribution_is_uncharacterised
        kind: KNOWLEDGE_GAP
        prompt: Does loss of LAT contribute to disease through mast cells, megakaryocytes or platelets,
          in which the adaptor is also expressed but in which no patient has been studied?
        attaches_to:
        - pathophysiology#Reduced Cytotoxic Degranulation
        - phenotypes#Decreased natural killer cell degranulation
        rationale: 'LAT is expressed in mast cells, natural killer cells, megakaryocytes, platelets and
          early B cells as well as in T cells. The only non-T lineage in which LAT-deficient patients
          have been assessed is the NK compartment, where degranulation and cytotoxicity were reduced
          but not absent. No report gives platelet function, bleeding history, mast-cell function or allergic
          history in a LAT-deficient patient, so whether the expression pattern translates into clinical
          features outside the T-cell compartment is unknown.

          This is worth recording rather than leaving implicit because the inference is tempting and unsupported:
          an adaptor expressed in platelets is not thereby a platelet disease, and the thrombocytopenia
          the patients did have was autoantibody-mediated, which is a T-cell-driven route to the same
          laboratory finding. Distinguishing the two would need platelet function testing in a patient,
          which nobody has published.'
      selected_evidence:
        snippet: Finally, the degranulation of LATmut CTLs after stimulation with anti-CD3/anti-CD28 beads
          (Fig. 6 D) and of patient-derived NK cells after stimulation with the K562 cell line was reduced
          (Fig. 6 E), although not absent.
        supports: SUPPORT
