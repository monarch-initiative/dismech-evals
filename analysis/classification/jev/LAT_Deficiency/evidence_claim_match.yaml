          term:
            id: CL:0000893
            label: thymocyte
      selected_evidence:
        snippet: Flow cytometric analysis revealed normal B cell populations but the absence of any mature
          peripheral T cells. Intrathymic development was blocked within the CD4- CD8- stage.
        supports: SUPPORT
        directness: INDIRECT
