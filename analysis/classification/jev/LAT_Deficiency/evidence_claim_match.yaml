      assertion_type: Genetic
      assertion:
        name: LAT
        gene_term:
          preferred_term: LAT
          term:
            id: hgnc:18874
            label: LAT
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'LAT encodes the linker for activation of T cells, a transmembrane adaptor with a short
          extracellular segment, a transmembrane domain and a long cytoplasmic tail carrying the tyrosines
          Y132, Y171, Y191 and Y226. All reported disease-causing alleles are homozygous truncating variants
          that remove some or all of those tyrosines: c.268_269delGG in exon 5, an independent frameshift
          abolishing protein expression, and p.Y207fsTer33. The c.268_269delGG transcript is present at
          normal levels and the truncated protein can be expressed from a transgene, so this is a loss
          of adaptor function rather than a loss of the transcript.'
      selected_evidence:
        snippet: '12 homozygous variants remained, but only chr16:28997725 deletion (del) GG (RefSeq accession
          no. NM_001014987.1: c.268_269del) segregated with the disease in the family.'
        supports: SUPPORT
