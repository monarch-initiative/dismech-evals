          name: LAT Deficiency
          disease_term:
            preferred_term: LAT deficiency
            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: il6_dependence_of_the_lymphoproliferative_arm_is_untested_in_patients
        kind: EMERGING_HYPOTHESIS
        prompt: Is the lymphoproliferative arm of human LAT deficiency IL-6 dependent, as it is in the
          LatY136F mouse, and would IL-6 blockade therefore be a rational bridge to transplant?
        attaches_to:
        - pathophysiology#Loss of LAT-Dependent Restraint on T Cell Responses
        - pathophysiology#Polyclonal Lymphoproliferation
        rationale: 'In the LatY136F mouse the mutant T cells overproduce IL-6, and crossing the strain
          onto an IL-6-deficient background showed that IL-6 is required for the uncontrolled early T-cell
          expansion; the reduction came from impaired cell survival rather than from a further developmental
          block or more regulatory T cells. Aged IL-6-deficient LatY136F mice eventually hyperproliferated
          and developed splenomegaly, but with diminished isotype switching and autoantibody production,
          so IL-6 loss delays and attenuates the syndrome rather than abolishing it.

          Nothing equivalent has been measured in patients: no IL-6 level, no IL-6 pathway readout, and
          no anti-IL-6 exposure is reported in any of the three kindreds. The hypothesis is recorded because
          the autoimmune arm is what kills these children before transplant and there is an approved drug
          class against this target, not because human evidence supports it. Any use would be off-label,
          unstudied in this disease, and taken on a mouse result obtained with a different allele.'
      selected_evidence:
        snippet: By crossing LATY136F mice with IL-6-deficient mice, we demonstrated that IL-6 is required
          for uncontrolled T cell expansion during the early stage of disease development.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26034173
      reference_title: The Importance of IL-6 in the Development of LAT-Mediated Autoimmunity.
      evidence_source: MODEL_ORGANISM
      explanation: The genetic experiment behind the hypothesis. INDIRECT because it is a mouse result
        on a different allele from the human disease-causing ones, and the inference to patients is untested.
