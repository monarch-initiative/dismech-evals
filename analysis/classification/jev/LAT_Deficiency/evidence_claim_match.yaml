            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: scid_versus_cid_presentation_is_not_yet_explained
        kind: OPEN_QUESTION
        prompt: Why does the same class of truncating LAT allele produce absent T cells and typical SCID
          in one pedigree and present-but-declining T cells with severe autoimmunity in another?
        attaches_to:
        - pathophysiology#Arrest of Thymic T Cell Development
        - pathophysiology#Loss of LAT-Dependent Restraint on T Cell Responses
        rationale: 'IUIS records both presentations in a single row, and this entry follows that by curating
          them together. But the two kindreds are genuinely different at the bedside: one presented as
          T-negative SCID with normal B and NK cells, the other with normal T-cell numbers, lymphoproliferation
          and life-threatening autoimmune cytopenias from five months of age. Both alleles are truncating.

          Three explanations are available and none can be chosen with three kindreds. The alleles truncate
          at different positions, so a residual product retaining some proximal function is possible in
          one and not the other. The CID kindred''s own course shows that T-cell numbers fall with time,
          so the difference may be partly one of when the patients were ascertained. And modifier or environmental
          contributions cannot be excluded in pedigrees of this size. Recording the question rather than
          a `has_subtypes` split keeps the entry from asserting a stratification the evidence does not
          yet support.'
      selected_evidence:
        snippet: LAT deficiency | LAT | AR | 617514 | Normal to low | Normal to low | High | Typical SCID
          or CID, the latter with adenopathy, splenomegaly, recurrent infections, autoimmunity
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
