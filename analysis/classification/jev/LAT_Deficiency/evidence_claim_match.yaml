  490aa48bc232565e8ce8d008b4824a41b0662f2e429641758c638c0b29062a47:
    claim:
      about:
        disease:
          name: LAT Deficiency
          disease_term:
            preferred_term: LAT deficiency
            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic LAT Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: Homozygous truncating LAT variants. The reported alleles are the exon 5 two-base
          deletion c.268_269delGG, which frameshifts at codon 89 and truncates the protein after 100 of
          233 residues; an independent frameshift producing a premature stop codon with complete loss
          of LAT protein expression; and p.Y207fsTer33. All remove some or all of the cytoplasmic tyrosines.
          The c.268_269delGG transcript is present at normal levels and the truncated protein can be expressed
          from a transgene, so the lesion is in the protein's adaptor function rather than in transcription.
        genes:
        - preferred_term: LAT
          term:
            id: hgnc:18874
            label: LAT
          modifier: LOSS_OF_FUNCTION
        genetic_context:
          description: Germline biallelic truncating LAT alleles, homozygous in every reported patient,
            with the parents heterozygous and unaffected wherever they were tested.
          allelic_events:
          - FRAMESHIFT_VARIANT
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: This mutation caused a deletion of guanosines 268/269 in exon 5 of LAT, leading to a
          frame shift and a premature stop codon after 303 bp (Fig. 2 A).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
