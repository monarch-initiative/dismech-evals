      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: All reported patients are homozygous for truncating LAT variants; the first kindred
          was born to consanguineous parents of Arab origin, and in the third report the parents were
          confirmed heterozygous by Sanger sequencing. Heterozygous carriers are clinically well; in the
          Keller kindred the heterozygous parents and sister had normal lymphocyte subsets, normal immunoglobulins
          and normal TCR-induced phosphorylation of ZAP-70, ITK and ERK, arguing against a dominant-negative
          effect of the truncated protein.
      selected_evidence:
        snippet: In T cells of the heterozygous parents and sister, the phosphorylation of ZAP70, ITK,
          ERK, and Ca2+ mobilization was found to be normal (not depicted), indicating that there is no
          dominant-negative effect of the mutation in the heterozygous situation.
        supports: SUPPORT
    origin:
