          about how many T cells a patient will have, nor about anything that depends on having a peripheral
          T-cell compartment, which includes the whole autoimmune arm of the human disease. For that arm
          the tyrosine knock-in strains are the better read.'
      selected_evidence:
        snippet: It is possible that some LAT-related molecule might compensate for the loss of LAT function
          in the human, but efforts to identify such molecules were not productive.
        supports: SUPPORT
