              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: residual_calcium_and_nfkb_signalling_is_unexplained
        kind: KNOWLEDGE_GAP
        prompt: How do patient T cells lacking all four LAT phosphotyrosines still mobilise calcium and
          activate NF-kappaB after receptor cross-linking, when the same allele abolishes both in a reconstituted
          LAT-deficient T-cell line?
        attaches_to:
        - pathophysiology#Failure of TCR Signalosome Assembly
        - pathophysiology#Abolished TCR-Induced ERK Activation
        rationale: 'Calcium mobilisation downstream of the receptor is supposed to require PLC-gamma1
          recruited to the LAT phosphotyrosine at position 132. In the patients'' own memory CD4 and CD8
          T cells, and in their gamma-delta T cells, calcium flux after CD3 cross-linking was within the
          range of healthy controls across independent experiments, and IkappaB-alpha degradation proceeded
          normally, while ERK phosphorylation was absent. The same patient allele expressed in LAT-deficient
          Jurkat cells abolished calcium flux, so this is a difference between primary human T cells and
          the cell line rather than between the mutant and the wild-type protein.

          A partial account exists for why ERK and calcium come apart: the three distal tyrosines recruit
          Grb2-SOS1 and are required for Ras activation, so a route to PLC-gamma1 that bypasses LAT would
          give inositol trisphosphate and calcium without giving ERK. What is missing is the route itself.
          Resolving it matters beyond this disease, because the textbook non-redundancy of LAT in calcium
          signalling is what the patients contradict.'
      selected_evidence:
        snippet: However, to our surprise, Ca2+ mobilization after CD3 cross-linking was normal in primary
          T cells of the index patient, and the sustained T cell differentiation in LAT-deficient patients
          supports the notion of a preserved residual TCR signal in vivo.
        supports: SUPPORT
