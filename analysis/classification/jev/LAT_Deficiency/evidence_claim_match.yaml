  a612141f6c43098dc6d9c0b070d302365a7fc8796537e1ee8b2ea3998806a5f8:
    claim:
      about:
        disease:
          name: LAT Deficiency
          disease_term:
            preferred_term: LAT deficiency
            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the LAT Cytoplasmic Phosphotyrosine Docking Sites
        biological_scale: MOLECULAR
        description: 'LAT works by being phosphorylated. ZAP-70, activated at the engaged receptor, phosphorylates
          the tyrosines of the LAT cytoplasmic tail; the resulting phosphotyrosine motifs are SH2-domain
          binding sites for PLC-gamma1, Grb2 and Gads, with Gads in turn recruiting SLP-76. Truncated
          LAT retains its extracellular and transmembrane segments and reaches the membrane but presents
          no phosphotyrosines, so the adaptor function is lost while upstream events are untouched: ZAP-70
          phosphorylation is normal in cells expressing the mutant protein.'
        genes:
        - preferred_term: LAT
          term:
            id: hgnc:18874
            label: LAT
          modifier: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: signaling adaptor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0035591
            label: signaling adaptor activity
        - preferred_term: SH2 domain binding
          modifier: DECREASED
          term:
            id: GO:0042169
            label: SH2 domain binding
      selected_evidence:
        snippet: We show that this protein is phosphorylated by ZAP-70/Syk protein tyrosine kinases leading
          to recruitment of multiple signaling molecules.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9489702
      reference_title: 'LAT: the ZAP-70 tyrosine kinase substrate that links T cell receptor to cellular
        activation.'
      evidence_source: IN_VITRO
      explanation: The original identification of LAT as the ZAP-70 substrate whose phosphorylation recruits
        downstream molecules, which is the function the truncation removes.
