  e2723cbc6d73376b399925de627e4cf181f2e20031f92b070785ae76b690c3e1:
    claim:
      about:
        disease:
          name: LAT Deficiency
          disease_term:
            preferred_term: LAT deficiency
            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mouse_null_overstates_the_human_developmental_block
        kind: HUMAN_MODEL_MISMATCH
        prompt: Can the LAT-null mouse be used to predict the T-cell compartment of a person with LAT
          deficiency, when the same loss of all four cytoplasmic tyrosines abolishes peripheral T cells
          in the mouse but not in patients?
        attaches_to:
        - pathophysiology#Arrest of Thymic T Cell Development
        - animal_models#Lat-null mouse
        rationale: 'This is the mismatch the first human report was built around, and it is not a difference
          of degree at the margins. Mice lacking LAT, and mice in which all four tyrosines are replaced
          by phenylalanine, arrest at the DN3 stage and have no peripheral T cells. The patients in the
          first kindred carry an allele that removes those same four tyrosines and still had mature T
          cells in normal numbers at presentation, with the numbers falling only over subsequent years.

          Two candidate explanations were tested and neither survived. A compensating adaptor was sought:
          SIT, TRIM, LAX, LIME and PAG were not differentially expressed in the patients'' T cells, NTAL/LAB
          protein was undetectable, and CD6 transduced into LAT-deficient Jurkat cells did not restore
          calcium mobilisation. Reversion of the mutation and alternative splicing were both excluded,
          by sequencing of sorted T cells and by RNA sequencing. So the residual development is unexplained
          rather than explained by a known substitute.

          The practical consequence is narrow enough to use. The null mouse is informative about where
          in thymic development LAT acts and about what the adaptor does biochemically; it is not informative
          about how many T cells a patient will have, nor about anything that depends on having a peripheral
          T-cell compartment, which includes the whole autoimmune arm of the human disease. For that arm
          the tyrosine knock-in strains are the better read.'
      selected_evidence:
        snippet: LAT knockout mice (Zhang et al., 1999b) and mice with targeted replacement of all four
          tyrosine residues (Sommers et al., 2001) lack peripheral T cells because of a block at the double-negative
          3 stage, whereas in humans, T cells lacking all four equivalent tyrosine residues were still
          present, although with a severely disturbed differentiation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
