  0edb53936110a546f273a94c8386c3f6d8491c7b45ee2931f3740a5faf408140:
    claim:
      about:
        disease:
          name: LAT Deficiency
          disease_term:
            preferred_term: LAT deficiency
            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of LAT-Dependent Restraint on T Cell Responses
        biological_scale: CELLULAR
        description: 'The counterintuitive arm of the disease. LAT is not only a positive conductor of
          receptor signals; it is also a negative regulator of TCR signalling and T-cell homeostasis,
          and T cells deprived of it mount self-perpetuating responses. Mouse genetics shows this directly:
          deleting LAT from post-thymic CD4 T cells, or replacing the PLC-gamma1 docking tyrosine, produces
          a lymphoproliferative disorder with excessive cytokine production and autoantibodies rather
          than a quiescent immunodeficiency, and the expansion is receptor-independent rather than driven
          by self-reactive clones. The patients show the corresponding clinical picture, with lymphoproliferation
          and severe autoimmune cytopenias from the first year of life.'
        biological_processes:
        - preferred_term: T cell homeostasis
          modifier: DECREASED
          term:
            id: GO:0043029
            label: T cell homeostasis
        cell_types:
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
      selected_evidence:
        snippet: The fact that such LAT-independent signals result in lymphoproliferative disorders with
          excessive cytokine production demonstrates that LAT constitutes a key negative regulator of
          the triggering module and of the LAT-independent branches of the TCR signaling cassette.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19682930
      reference_title: Loss of the LAT adaptor converts antigen-responsive T cells into pathogenic effectors
        that function independently of the T cell receptor.
      evidence_source: MODEL_ORGANISM
      explanation: States the negative-regulator role that makes autoimmunity a predicted rather than
        paradoxical consequence of losing LAT. INDIRECT because the demonstration is in conditionally
        LAT-deleted mouse T cells.
