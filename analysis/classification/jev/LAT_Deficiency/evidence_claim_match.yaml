        biological_scale: CELLULAR
        description: 'LAT is required for the signals that carry thymocytes through development. In mice
          the requirement is absolute and the block sits at the CD25+CD44- DN3 stage, with no peripheral
          T cells at all. In people the block is partial and variable: one pedigree had absent T cells
          with preserved B and NK cells, a T-B+NK+ SCID immunophenotype, while in the kindred with the
          exon 5 truncation T cells were present in normal numbers at presentation and fell over years.
          Both are recorded here; the species difference is taken up in `discussions`.'
        biological_processes:
        - preferred_term: T cell differentiation in thymus
          modifier: DECREASED
          term:
            id: GO:0033077
