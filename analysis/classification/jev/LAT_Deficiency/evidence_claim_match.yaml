            term:
              id: MONDO:0044721
              label: severe combined immunodeficiency due to LAT deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the LAT Cytoplasmic Phosphotyrosine Docking Sites
        biological_scale: MOLECULAR
        description: 'LAT works by being phosphorylated. ZAP-70, activated at the engaged receptor, phosphorylates
          the tyrosines of the LAT cytoplasmic tail; the resulting phosphotyrosine motifs are SH2-domain
          binding sites for PLC-gamma1, Grb2 and Gads, with Gads in turn recruiting SLP-76. Truncated
          LAT retains its extracellular and transmembrane segments and reaches the membrane but presents
          no phosphotyrosines, so the adaptor function is lost while upstream events are untouched: ZAP-70
          phosphorylation is normal in cells expressing the mutant protein.'
        genes:
        - preferred_term: LAT
          term:
            id: hgnc:18874
            label: LAT
          modifier: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: signaling adaptor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0035591
            label: signaling adaptor activity
        - preferred_term: SH2 domain binding
          modifier: DECREASED
          term:
            id: GO:0042169
            label: SH2 domain binding
      selected_evidence:
        snippet: These Tyr(P) motifs serve as binding sites for SH2 domain-containing proteins, including
          PLC-γ1, Grb2, and Gads (14–16), allowing the nucleation of multiple signaling complexes on LAT,
          which are essential for downstream signaling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26354432
      reference_title: 'The linker for activation of T cells (LAT) signaling hub: from signaling complexes
        to microclusters.'
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      explanation: Names the partners the phosphotyrosine motifs recruit, which is what the patients'
        truncated protein cannot do. Graded OTHER with quote_role REVIEW_SYNTHESIS because the sentence
        is a review's synthesis of work it did not perform.
