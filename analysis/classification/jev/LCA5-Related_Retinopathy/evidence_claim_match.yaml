        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Lebercilin Loss and Bulge Region Ciliary Axoneme Disruption
        biological_scale: MOLECULAR
        description: LCA5 encodes lebercilin, a ciliary protein that localizes, together with retinitis
          pigmentosa 1 protein (RP1) and the intraflagellar transport (IFT) proteins IFT81 and IFT88,
          to the "bulge region" of the photoreceptor outer-segment connecting-cilium axoneme -- a site
          distal to the CEP290 transition zone that is required for outer-segment membrane disc formation.
          Biallelic loss-of-function LCA5 variants (nonsense, frameshift, or splicing-disrupting) abolish
          lebercilin function and destabilize this bulge region.
        gene:
          preferred_term: LCA5
          modifier: DECREASED
          term:
            id: hgnc:31923
            label: LCA5
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        biological_processes:
        - preferred_term: cilium assembly
          term:
            id: GO:0060271
            label: cilium assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Lebercilin localizes to the connecting cilia of photoreceptors and to the microtubules,
          centrioles and primary cilia of cultured mammalian cells.
        supports: SUPPORT
