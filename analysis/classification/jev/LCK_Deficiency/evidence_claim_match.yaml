        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        variants:
        - name: c.1022T>C (p.Leu341Pro)
          description: Homozygous through uniparental disomy; weakly expressed, no kinase activity.
        - name: c.188-2A>G (splice acceptor)
          description: Homozygous in three siblings with atypical epidermodysplasia verruciformis; causes
            exon 3 skipping, frameshift and mRNA decay.
        - name: c.1393T>C (p.Cys465Arg)
          description: Second complete-loss allele; no LCK protein detected.
        - name: c.1129dupA (p.Ser377fs)
          description: Truncating frameshift in two cousins; reduced expression of a truncated, kinase-deficient
            protein.
        - name: c.1318C>T (p.Pro440Ser)
          description: Hypomorphic missense in two siblings; residual TCR signalling and proliferation.
      selected_evidence:
        snippet: We report a new form of T-cell immunodeficiency caused by a LCK gene defect, highlighting
          the essential role of Lck in human T-cell development and responses.
        supports: SUPPORT
