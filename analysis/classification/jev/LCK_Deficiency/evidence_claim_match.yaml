            biological_scale: CELLULAR
            description: 'With partial LCK function (p.P440S), conventional T cells can mature but regulatory
              T cells cannot. In mice, Treg numbers are reduced in both the knockout and the P440S knock-in;
              what sets P440S apart is that conventional T cells keep enough function to cause disease
              once Treg number and function are deficient. The published human cases disagree on Treg
              numbers: IUIS lists low Treg, while the complete-loss p.C465R patient had an increased Treg
              percentage among a reduced T-cell pool, so this node is supported for the hypomorphic allele
              rather than for the disease as a whole.'
            cell_types:
