        association: Causative
        relationship_type: CAUSATIVE
        features: Biallelic loss-of-function variants, ranging from complete loss (p.L341P, p.C465R) through
          a truncating frameshift to a hypomorphic missense (p.P440S) and a splice-acceptor variant with
          residual isoform expression. Expressivity tracks residual LCK function.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
