      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Quality Control and Fatty Acid Oxidation
        description: 'Lipin-1-deficient myoblasts have reduced phosphatidylinositol-3-phosphate near autophagosomes
          and late endosomes, which prevents Armus recruitment, locks Rab7 in its active state and blocks
          vesicle clearance by lysosomal fusion, so damaged mitochondria and their oxidised DNA are not
          cleared. Muscle-specific knockout mice have abundant but abnormal mitochondria attributed to
          impaired autophagy, and an adult patient showed markedly reduced fat oxidation during exercise.

          '
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: mitophagy
          term:
            id: GO:0000423
            label: mitophagy
          modifier: DECREASED
        - preferred_term: fatty acid beta-oxidation
          term:
            id: GO:0006635
            label: fatty acid beta-oxidation
          modifier: DECREASED
      selected_evidence:
        snippet: We find that lipin1-deficient myoblasts exhibit a reduction in phosphatidylinositol-3-phosphate
          close to autophagosomes and late endosomes that prevents the recruitment of the GTPase Armus,
          locks Rab7 in the active state, inhibits vesicle clearance by fusion with lysosomes, and alters
          their positioning and function.
        supports: SUPPORT
