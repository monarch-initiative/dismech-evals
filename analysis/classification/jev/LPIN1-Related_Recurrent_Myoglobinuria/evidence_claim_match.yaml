          testing for the recurrent intragenic deletion allows fast diagnosis before biopsy. Rare compound
          heterozygous variants need functional confirmation. A large LPIN1 deletion can be missed by
          DNA sequencing and detected only by mRNA analysis, so a negative panel in a typical case does
          not exclude the diagnosis.

          '
