          patient adipose tissue develops normally, and patient myoblasts show only minor changes in lipin-1
          target gene expression. Findings from mice, including the SR-stress branch and TUDCA/bezafibrate
          responses, therefore need human confirmation.

          '
      selected_evidence:
        snippet: However, that mouse model is confounded by lipodystrophy not phenocopied in people.
        supports: SUPPORT
