            term:
              id: MONDO:0009992
              label: myoglobinuria, acute recurrent, autosomal recessive
        context: []
      assertion_type: Genetic
      assertion:
        name: LPIN1
        gene_term:
          preferred_term: LPIN1
          term:
            id: hgnc:13345
            label: LPIN1
        relationship_type: CAUSATIVE
        notes: 'Biallelic LPIN1 (2p25.1) variants cause the disease; most are nonsense, frameshift or
          splice variants or intragenic deletions, with a minority of missense and in-frame changes that
          need functional support. A recurrent intragenic deletion, c.2295-866_2410-30del (p.Glu766_Ser838del),
          on a shared haplotype accounted for 47% of mutated alleles in Caucasian patients and fails to
          complement pah1-deficient yeast. Heterozygous carriers may have exercise-induced myalgia and
          one carrier of a pathogenic allele developed statin-induced myopathy. Adipose tissue develops
          normally despite loss of lipin-1, unlike the lipodystrophy of Lpin1-null mice.

          '
        variants:
        - name: c.2295-866_2410-30del (p.Glu766_Ser838del)
          description: 'Recurrent intragenic deletion found in 8 of 17 mutation-positive patients in the
            French cohort, all Caucasian, on a common haplotype suggesting a founder effect; the deleted
            protein is unable to complement pah1-deficient yeast. Its high frequency makes targeted testing
            a fast first diagnostic step.

            '
          type: deletion
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Mutations in the LPIN1 gene cause recurrent rhabdomyolysis in childhood, and a carrier
          state may predispose for statin-induced myopathy.
        supports: SUPPORT
