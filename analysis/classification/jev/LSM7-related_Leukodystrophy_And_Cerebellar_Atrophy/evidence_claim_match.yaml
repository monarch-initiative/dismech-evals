          disease_term:
            preferred_term: LSM7-related leukodystrophy and cerebellar atrophy
            term:
              id: MONDO:0978294
              label: LSM7-related leukodystrophy and cerebellar atrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_lsm7_splicing_versus_mrna_decay
        prompt: Is LSM7-related leukodystrophy driven by loss of LSM2-8 / U6 snRNP splicing function,
          loss of LSM1-7 mRNA decapping and decay, or both?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired U6 snRNP and Tri-snRNP Association
        - pathophysiology#Impaired LSM1-7 Mediated mRNA Decapping and Decay
        - mechanistic_hypotheses#lsm2_8_splicing_defect
        - mechanistic_hypotheses#lsm1_7_mrna_decay_defect
        rationale: The only molecular readout is HEK293 pull-down showing both rings misassemble and lose
          both decay (PATL1, EDC4) and tri-snRNP partners. No study has measured U6 snRNA levels, splicing,
          or mRNA decay in patient cells or in oligodendrocytes, so neither arm can yet be preferred.
        proposed_experiments:
        - experiment_id: lsm7_patient_cell_rna_processing
          name: Splicing and mRNA decay profiling in LSM7 patient-derived glia
          description: Measure U6 snRNA abundance, transcriptome-wide splicing and mRNA half-lives in
            patient fibroblasts and iPSC-derived oligodendrocytes and neurons carrying biallelic LSM7
            variants, against isogenic corrected controls.
          would_support:
          - pathophysiology#Impaired U6 snRNP and Tri-snRNP Association
          - pathophysiology#Impaired LSM1-7 Mediated mRNA Decapping and Decay
          supporting_outcome:
          - Reduced U6 snRNA with intron retention or exon skipping supports the splicing arm.
          - Stabilized oligoadenylated mRNAs with delayed decapping support the decay arm.
      selected_evidence:
        snippet: The identification of more affected individuals is needed before the molecular mechanisms
          of mRNA decay and splicing regulation are added to the categories of biological dysfunctions
          implicated in leukodystrophies
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
