    claim:
      about:
        disease:
          name: LSM7-related Leukodystrophy and Cerebellar Atrophy
          disease_term:
            preferred_term: LSM7-related leukodystrophy and cerebellar atrophy
            term:
              id: MONDO:0978294
              label: LSM7-related leukodystrophy and cerebellar atrophy
        context: []
      assertion_type: Genetic
      assertion:
        name: LSM7
        gene_term:
          preferred_term: LSM7
          term:
            id: hgnc:20470
            label: LSM7
        association: Causative biallelic missense variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: No ClinGen gene-disease validity assertion exists for LSM7, so gene_disease_validity is
          left absent. Only two genotyped affected individuals are published.
        variants:
        - name: p.Asp41Asn
          description: LSM7 c.121G>A (NM_016199.2), found homozygous in the first reported individual
            and in trans with p.Arg69Trp in the second. Asp41 is a conserved RNA-contacting residue in
            Sm motif I.
          clinical_significance: PATHOGENIC
        - name: p.Arg69Trp
          description: LSM7 c.205C>T, maternally inherited in the second reported individual. Arg69 makes
            polar contacts with LSM5 in both rings; tryptophan removes them in structural modelling. Not
            functionally tested.
        - name: p.Arg69Pro
          description: LSM7 c.206G>C, carried heterozygously by both parents of a family with recurrent
            fetal deaths; no fetus was genotyped, so its homozygous effect is presumed. Impairs ring assembly
            in HEK293 cells.
      selected_evidence:
        snippet: we confirm that LSM7 disruption causes a neurodevelopmental disorder characterized by
          leukodystrophy and cerebellar atrophy
        supports: SUPPORT
