      assertion_type: Pathophysiology
      assertion:
        name: Innate immune activation and cytokine release
        description: 'Following pathogen entry, resident macrophages in the labyrinth transition to proinflammatory
          states and secrete tumor necrosis factor-alpha (TNF-alpha), interleukin-1 beta (IL-1beta), and
          interleukin-6 (IL-6). These cytokines drive endothelial activation and initiate the inflammatory
          cascade. In viral labyrinthitis, the NLRP3 inflammasome is activated, promoting IL-1beta maturation
          through caspase-1 and triggering reactive oxygen species production, which contributes to oxidative
          stress in cochlear and vestibular structures.

          '
        cell_types:
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
