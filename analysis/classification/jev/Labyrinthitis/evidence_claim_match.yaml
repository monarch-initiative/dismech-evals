      assertion:
        name: Vestibular neuroepithelial damage
        description: 'Inflammatory mediators, leukocyte infiltration, and oxidative stress damage the
          vestibular sensory epithelium. Hair cells in the cristae ampullares and maculae undergo injury
          and apoptosis, producing acute unilateral vestibular loss. The resulting vestibular tone asymmetry
          generates the characteristic acute vestibular syndrome with severe vertigo, spontaneous nystagmus,
          and postural imbalance.

          '
        locations:
