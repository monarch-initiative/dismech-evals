              id: MONDO:0002008
              label: labyrinthitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pathogen entry into the inner ear
        description: 'Infectious agents reach the labyrinth through three main routes: (1) tympanogenic
          spread from the middle ear, where bacterial toxins or organisms cross the round or oval window
          membrane during otitis media; (2) meningitic spread via the cochlear aqueduct during bacterial
          meningitis; and (3) hematogenous or neurogenic spread, particularly for viral agents such as
          herpes simplex virus. In serous labyrinthitis, only toxins and inflammatory mediators cross
          the round window membrane without direct bacterial invasion, producing reversible dysfunction.
          In suppurative labyrinthitis, bacteria directly invade the perilymphatic space, causing severe
          purulent inflammation.

          '
        locations:
        - preferred_term: Round window of inner ear
          term:
            id: UBERON:0002502
            label: round window of inner ear
        - preferred_term: Membranous labyrinth
          term:
            id: UBERON:0001849
            label: membranous labyrinth
      selected_evidence:
        snippet: The differential impacts of toxic versus inflammatory mediators on inner ear physiology
          may render early combination therapy with antibiotics and glucocorticoids particularly efficacious.
        supports: SUPPORT
