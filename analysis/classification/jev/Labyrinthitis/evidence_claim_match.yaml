      assertion:
        name: Endolymphatic hydrops
        description: 'Post-inflammatory disruption of endolymph homeostasis can lead to endolymphatic
          hydrops. Damage to the stria vascularis impairs potassium recycling and the endocochlear potential,
          while injury to the endolymphatic sac or duct reduces endolymph reabsorption. The resulting
          fluid accumulation contributes to fluctuating hearing loss, tinnitus, and episodic vertigo in
          some patients during recovery or as a long-term sequela.

          '
      selected_evidence:
        snippet: Recent investigation of secondary endolymphatic hydrops has brought attention to traumatic
          and inflammatory insults as causes for secondary endolymphatic hydrops.
        supports: SUPPORT
