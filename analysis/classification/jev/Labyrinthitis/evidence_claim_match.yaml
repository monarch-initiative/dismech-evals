      assertion_type: Pathophysiology
      assertion:
        name: Leukocyte recruitment and infiltration
        description: 'Cytokine and chemokine signaling drives sequential recruitment of leukocytes into
          the perilymphatic spaces. Neutrophils are the first to arrive, peaking at approximately day
          1. CCR2-positive monocytes and macrophages follow, with CX3CR1-positive resident macrophages
          also expanding. Lymphocytes increase subacutely by days 4-7, and the myeloid infiltrate peaks
          around day 14 in experimental models. Both CCR2 and CX3CR1 chemokine receptor pathways modulate
          the severity of cochlear inflammation and subsequent tissue remodeling.

          '
        locations:
