              id: MONDO:0002008
              label: labyrinthitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Blood-labyrinth barrier disruption
        description: 'The blood-labyrinth barrier (BLB), a specialized non-fenestrated microvascular barrier
          of the stria vascularis and cochlear capillaries, is disrupted by the inflammatory response.
          Pericyte and endothelial cell dysfunction under inflammatory and oxidative stress increases
          permeability, permitting serum proteins and leukocytes into cochlear fluids. In experimental
          meningitis, barrier disruption is detectable by 3 days post-infection and may restore by 7 days,
          but the transient breach amplifies inflammatory injury and impairs strial ion homeostasis.

          '
        locations:
        - preferred_term: Stria vascularis of cochlear duct
          term:
            id: UBERON:0002282
            label: stria vascularis of cochlear duct
        cell_types:
        - preferred_term: Pericyte
          term:
            id: CL:0000669
            label: pericyte
        - preferred_term: Endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Regulation of vascular permeability
          term:
            id: GO:0043114
            label: regulation of vascular permeability
          modifier: ABNORMAL
      selected_evidence:
        snippet: pericytes, a type of vascular mural cell specialized to maintain the integrity and function
          of the microvasculature, may play a crucial role in the development and progression of inner
          ear disorders
        supports: SUPPORT
