        description: 'In the most severe cases, labyrinthine fibrosis progresses to neo-ossification,
          with new bone formation visible by 14 days post-infection. Osteoblast-like cells deposit mineralized
          tissue within the perilymphatic spaces, progressively obliterating the cochlear lumen. This
          labyrinthitis ossificans is most prominent in the scala tympani basal turn and causes permanent
          profound sensorineural hearing loss. The obliteration of cochlear architecture can prevent or
          severely complicate cochlear implantation, making early diagnosis and intervention critical.

          '
