          inflammatory damage, loss of neurotrophic support from damaged hair cells, and disruption of
          the cochlear microenvironment. Spiral ganglion neuron loss is a major determinant of permanent
          sensorineural hearing loss and limits the efficacy of cochlear implantation, as the implant
          relies on surviving neurons for electrical stimulation.

          '
