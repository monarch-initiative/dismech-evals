      assertion_type: Pathophysiology
      assertion:
        name: Aberrant glycogen chain length and hyperphosphorylation
        description: 'Combined loss of laforin''s phosphatase activity and malin-mediated restraint on
          glycogen synthesis produces glycogen molecules with overlong glucan chains and elevated covalently-bound
          phosphate. Unlike normally branched soluble glycogen, these aberrant chains form double helices,
          extrude water, and precipitate. The resulting insoluble polyglucosan material progressively
          aggregates into Lafora bodies. Recent evidence indicates that abnormal chain length, more than
          hyperphosphorylation, is the proximal driver of insolubility.

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: Glycogen metabolic process
          term:
            id: GO:0005977
            label: glycogen metabolic process
        chemical_entities:
        - preferred_term: poorly branched hyperphosphorylated glycogen
          term:
            id: CHEBI:28087
            label: glycogen
          modifier: ABNORMAL
      selected_evidence:
        snippet: Individuals with LD develop cytoplasmic, aberrant glycogen inclusions in nearly all tissues
          that more closely resemble plant starch than human glycogen.
        supports: SUPPORT
