        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of laforin glycogen phosphatase activity
        description: 'Biallelic loss-of-function variants in EPM2A abolish laforin''s dual-specificity
          glycogen phosphatase activity. Laforin normally binds glycogen via its carbohydrate-binding
          domain and dephosphorylates it; loss of this activity leads to glycogen hyperphosphorylation
          and, downstream, to abnormal chain length and insolubility. Laforin also serves as the glycogen-targeting
          subunit that recruits malin to glycogen, so its loss disrupts the laforin-malin complex at glycogen.

          '
        gene:
          preferred_term: EPM2A
          description: Laforin, a dual-specificity glycogen phosphatase
          modifier: DECREASED
          term:
            id: hgnc:3413
            label: EPM2A
        cell_types:
