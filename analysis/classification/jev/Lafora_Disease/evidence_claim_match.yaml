  f755bec1ee121ebed93042f6a6e271a6e15e1fe6fdf4815b12eee288cf00f429:
    claim:
      about:
        disease:
          name: Lafora_Disease
          disease_term:
            preferred_term: Lafora disease
            term:
              id: MONDO:0009697
              label: Lafora disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reactive astrogliosis and neuroinflammation
        description: 'Astrocytic and neuronal Lafora bodies induce reactive astrogliosis and activate
          microglia. RNA-Seq of Epm2a-/- and Epm2b-/- mouse brains shows age-progressive upregulation
          of inflammatory mediators, dominated by TNF and IL-6/JAK2 signaling. Activation of a non-canonical
          inflammasome, elevated CXCL10 and S100B, miR-155/miR-146a upregulation, and infiltration of
          peripheral T-lymphocytes into brain parenchyma all contribute to a glia-driven inflammatory
          milieu. Sphingosine-1-phosphate receptor modulation (fingolimod) reduces this inflammation and
          improves behavior in Epm2b-/- mice, supporting causal contribution of neuroinflammation to disease
          severity.

          '
        cell_types:
        - preferred_term: Astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: Microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: Neuroinflammatory response
          term:
            id: GO:0150076
            label: neuroinflammatory response
        - preferred_term: Inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
      selected_evidence:
        snippet: in both models of LD, we found a common set of upregulated genes, most of them encoding
          mediators of inflammatory response; second, there was a progression with the age in the appearance
          of these inflammatory markers, starting at 3 months of age; and third, reactive glia was responsible
          for the expression of these inflammatory genes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31808062
      reference_title: 'Reactive Glia-Derived Neuroinflammation: a Novel Hallmark in Lafora Progressive
        Myoclonus Epilepsy That Progresses with Age.'
      evidence_source: MODEL_ORGANISM
      explanation: Defines reactive glia-derived neuroinflammation as a novel, age-progressive hallmark
        of Lafora disease in two independent mouse models.
