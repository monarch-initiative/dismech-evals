        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of laforin-malin complex regulation of glycogen synthesis
        description: 'Malin (NHLRC1) is an E3 ubiquitin ligase that, in complex with laforin at glycogen,
          ubiquitinates substrates including PTG/PPP1R3C (a glycogen synthase activator) and glycogen
          synthase itself, restraining glycogen synthesis. Biallelic loss-of-function variants in NHLRC1,
          or loss of laforin (which targets malin to glycogen), inactivate this complex. Consequently,
          malin substrates such as PTG accumulate and drive excessive glycogen synthesis with abnormal
          architecture. Laforin also becomes sequestered in the insoluble polysaccharide fraction, where
          it is functionally inert.

          '
        gene:
          preferred_term: NHLRC1
          description: Malin, an E3 ubiquitin ligase that partners with laforin
          modifier: DECREASED
          term:
            id: hgnc:21576
            label: NHLRC1
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: Protein ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
        - preferred_term: Glycogen biosynthetic process
          term:
            id: GO:0005978
            label: glycogen biosynthetic process
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
          modifier: DECREASED
        chemical_entities:
        - preferred_term: glycogen
          term:
            id: CHEBI:28087
            label: glycogen
          modifier: ABNORMAL
      selected_evidence:
        snippet: NHLRC1 (also called EPM2B), which encodes malin, a putative E3 ubiquitin ligase with
          a RING finger domain and six NHL motifs. Laforin and malin colocalize to the ER, suggesting
          they operate in a related pathway protecting against polyglucosan accumulation and epilepsy.
        supports: SUPPORT
