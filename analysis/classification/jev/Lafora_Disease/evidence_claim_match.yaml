        description: 'PTG (PPP1R3C) is a glycogen synthase activator that targets protein phosphatase
          1 to glycogen. In normal cells, malin-mediated ubiquitination restrains PTG and glycogen synthase
          (GYS1) activity. With loss of laforin/malin function, PTG accumulates and a small pool of overactive
          GYS1 elongates glycogen chains beyond the threshold at which they remain soluble. Genetic depletion
          of PTG or constitutive/inducible knockout of GYS1 in mouse models prevents Lafora body formation
          and rescues seizure susceptibility, neurodegeneration, and behavioral abnormality, establishing
          GYS1-driven excessive glycogen synthesis as a critical and pharmacologically targetable node
          upstream of polyglucosan formation.

          '
