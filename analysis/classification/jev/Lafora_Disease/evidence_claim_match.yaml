      assertion:
        name: Synaptic dysfunction and cortical hyperexcitability
        description: 'Lafora body burden, perisynaptic astrocyte dysfunction, and inflammatory cytokines
          progressively destabilize cortical excitation/inhibition balance. Patients with Lafora body
          disease exhibit sustained sensorimotor cortex hyperexcitability with prolonged facilitation,
          consistent with severe impairment of inhibitory mechanisms. Hippocampal synaptic plasticity
          is disrupted in malin-knockout mice and is rescued when glycogen synthesis is reduced. The resulting
          hyperexcitability underlies the action and stimulus-sensitive myoclonus, photosensitive seizures,
          occipital (visual-hallucinatory) seizures, and progression to refractory epilepsy that defines
          the clinical syndrome.

          '
        cell_types:
        - preferred_term: Pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        - preferred_term: Interneuron
          term:
            id: CL:0000099
            label: interneuron
        - preferred_term: Astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: Transmission of nerve impulse
          term:
            id: GO:0019226
            label: transmission of nerve impulse
        - preferred_term: Regulation of long-term neuronal synaptic plasticity
          term:
            id: GO:0048169
            label: regulation of long-term neuronal synaptic plasticity
      selected_evidence:
        snippet: The LBD findings highlight sustained hyperexcitability of the sensorimotor cortex in
          response to afferent stimuli, which fit with a more severe impairment of inhibitory mechanisms.
        supports: SUPPORT
