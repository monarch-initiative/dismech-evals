          diagnosis options. Counseling should now incorporate genotype-based prognostic information:
          biallelic protein-truncating variants in NHLRC1 are associated with worse survival (HR 2.88;
          95% CI 1.23-6.78), while homozygous NHLRC1 p.Asp146Asn carries a more favorable prognosis.

          '
