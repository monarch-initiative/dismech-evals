              label: Lafora disease
        context: []
      assertion_type: Treatment
      assertion:
        name: Glycogen synthase 1 (GYS1) antisense oligonucleotide therapy (experimental)
        description: 'Substrate reduction therapy using antisense oligonucleotides targeting GYS1 mRNA
          to lower brain glycogen synthesis and prevent Lafora body formation. Preclinical Gys1-ASO administration
          in Epm2b-/- mice reduced GYS1 protein, glycogen aggregation, Lafora body burden, and epileptiform
          discharges. ION283 (intrathecal ASO) is now in a Phase 1/2 clinical trial in patients aged 10-18
          with genetically confirmed EPM2A or NHLRC1 disease (NCT06609889). This represents the first
          disease-modifying strategy advanced to clinical trials in Lafora disease.

          '
        treatment_term:
          preferred_term: antisense oligonucleotide therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: This work provides proof of concept that a Gys1-ASO halts disease progression of EPM2B
          mutations of Lafora disease.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37700152
      reference_title: Gys1 antisense therapy prevents disease-driving aggregates and epileptiform discharges
