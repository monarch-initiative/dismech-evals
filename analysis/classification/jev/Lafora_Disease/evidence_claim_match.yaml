          value:
            name: Loss of laforin-malin complex regulation of glycogen synthesis
            description: 'Malin (NHLRC1) is an E3 ubiquitin ligase that, in complex with laforin at glycogen,
              ubiquitinates substrates including PTG/PPP1R3C (a glycogen synthase activator) and glycogen
              synthase itself, restraining glycogen synthesis. Biallelic loss-of-function variants in
              NHLRC1, or loss of laforin (which targets malin to glycogen), inactivate this complex. Consequently,
              malin substrates such as PTG accumulate and drive excessive glycogen synthesis with abnormal
              architecture. Laforin also becomes sequestered in the insoluble polysaccharide fraction,
              where it is functionally inert.

              '
