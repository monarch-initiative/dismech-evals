      assertion:
        name: Amifampridine (3,4-Diaminopyridine)
        description: 'Potassium channel blocker that prolongs the presynaptic action potential, widening
          the window for calcium entry and so increasing acetylcholine release. It works downstream of
          the lesion without correcting it - the antibody is untouched.

          The efficacy trial used a randomised withdrawal design rather than a conventional placebo start,
          because the drug had been in use for thirty years without conclusive evidence and withholding
          it de novo was not acceptable. Patients stable on 3,4-DAP were tapered to placebo or continued:
          none of the 14 continued on drug deteriorated by more than 30% on timed up-and-go, against 72%
          of the 18 tapered to placebo.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
