  04e5a5cb181f4cdd23953c2a07451346fe1554ccc793d4e925242c59ee27911c:
    claim:
      about:
        disease:
          name: Lambert-Eaton Myasthenic Syndrome
          disease_term:
            preferred_term: Lambert-Eaton myasthenic syndrome
            term:
              id: MONDO:0018556
              label: Lambert-Eaton myasthenic syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Anti-P/Q-Type VGCC Autoantibody Production
        biological_scale: MOLECULAR
        description: 'Autoantibodies directed against P/Q-type voltage-gated calcium channels localised
          in the presynaptic motor nerve terminal and in the autonomic nervous system. Detectable in about
          90% of patients.

          The shared distribution of the target across motor and autonomic terminals is the reason autonomic
          symptoms belong to this disease rather than accompanying it: one antigen, two systems. Quantitative
          autonomic testing bears this out - 93% of patients have an abnormal composite autonomic score,
          so dysautonomia is near-universal rather than occasional.

          One caveat belongs on the shared-antigen account rather than beside it. In the same series no
          autoantibody correlated with the severity of autonomic dysfunction, and the N-type channel antibodies
          that would be the obvious mediator of autonomic transmission were found in only a minority.
          The antigen is shared; the quantitative link between antibody and autonomic severity is not
          established.'
        molecular_functions:
        - preferred_term: calcium ion transmembrane transporter activity
          term:
            id: GO:0015085
            label: calcium ion transmembrane transporter activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: calcium transport via high voltage-gated calcium channel
          term:
            id: GO:0061577
            label: calcium ion transmembrane transport via high voltage-gated calcium channel
          modifier: DECREASED
      selected_evidence:
        snippet: These antibodies can be detected in about 90% of patients
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38494285
      reference_title: Lambert-Eaton myasthenic syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The detection rate, which is what makes serology a practical diagnostic rather than
