  4f4281eb65c65ec40e995f5a5f02f7fa56f47b81c8682e3c2b89ff83a1b82723:
    claim:
      about:
        disease:
          name: Lambert-Eaton Myasthenic Syndrome
          disease_term:
            preferred_term: Lambert-Eaton myasthenic syndrome
            term:
              id: MONDO:0018556
              label: Lambert-Eaton myasthenic syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_antibody_negative_lems
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What accounts for the roughly one in ten patients with clinical and electrophysiological
          LEMS in whom P/Q-type VGCC antibodies are not detected?
        attaches_to:
        - pathophysiology#Anti-P/Q-Type VGCC Autoantibody Production
        rationale: 'The cited review reports antibody detection in about 90% of patients, which leaves
          a seronegative remainder that the entry''s mechanism does not explain. The possibilities are
          not equivalent and they are not distinguished by the evidence curated here: assay insensitivity
          for low-titre or conformation-dependent antibodies; antibodies against a different presynaptic
          target not covered by the standard assay; or a genuinely distinct presynaptic disorder sharing
          the phenotype.

          The second possibility is not merely speculative. In a series of 20 patients, six had antibodies
          against synaptotagmin, a synaptic vesicle protein rather than a calcium channel, and three of
          those six showed no cross-reactivity with any VGCC subtype at all. So antibodies to non-channel
          presynaptic proteins do occur in LEMS, and can occur without accompanying channel antibodies
          - which is the seronegative case this gap is about. What is not established is how much of the
          seronegative remainder they account for, since that study predates current assays and was not
          designed to sample it.

          Note what this does not affect. Tumour screening is driven by the DELTA-P score, which is purely
          clinical and contains no serology at all, so a VGCC-seronegative patient enters that pathway
          with nothing missing. SOX1 antibodies are a separate marker of the paraneoplastic form and a
          different antigen entirely - a nuclear SCLC tumour antigen, not the presynaptic calcium channel
          - so seronegativity for VGCC says nothing about SOX1 status either.'
        proposed_experiments:
        - experiment_id: seronegative_lems_target_discovery
          name: Antigen discovery in seronegative clinically defined LEMS
          description: Screen serum from patients meeting clinical and electrophysiological criteria for
            LEMS but negative on standard P/Q-type VGCC radioimmunoassay against presynaptic terminal
            proteins, with passive transfer to test whether any candidate reproduces the release deficit.
      selected_evidence:
        snippet: These antibodies can be detected in about 90% of patients
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
