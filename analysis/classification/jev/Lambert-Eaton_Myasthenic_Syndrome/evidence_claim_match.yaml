      assertion_type: Pathophysiology
      assertion:
        name: Reduced Calcium-Dependent Acetylcholine Release
        conforms_to: neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release
        biological_scale: CELLULAR
        description: 'Loss of functional presynaptic calcium channels reduces calcium influx on depolarisation,
          and acetylcholine release is steeply calcium-dependent. The result is a quantal release deficit
          at an otherwise intact neuromuscular junction: the postsynaptic receptor, the acetylcholinesterase
          and the muscle are all normal.

          Two clinical signs follow directly from this and from nothing else. Sustained or repeated activity
          transiently accumulates presynaptic calcium, which partially overcomes the deficit - so strength
          and reflexes briefly improve after exertion, the reverse of myasthenia gravis. And on repetitive
          nerve stimulation the same physiology produces an increment at high frequency against a decrement
          at low frequency, which the cited review reports as a highly sensitive diagnostic pairing.'
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: acetylcholine secretion, neurotransmission
          term:
            id: GO:0014055
            label: acetylcholine secretion, neurotransmission
          modifier: DECREASED
      selected_evidence:
        snippet: the presence of decrement and increment upon repetitive nerve stimulation is also a highly
          sensitive diagnostic test
        supports: SUPPORT
