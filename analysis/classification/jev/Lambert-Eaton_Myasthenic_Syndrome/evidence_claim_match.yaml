      assertion_type: Definition
      assertion:
        definition_type: PHENOTYPE_ALGORITHM
        name: DELTA-P score for small-cell lung carcinoma prediction in LEMS
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'A clinical score that allocates one point for each of a set of features present
          at or within three months of onset, to estimate the probability that a patient with LEMS has
          an underlying small-cell lung carcinoma and so to set the intensity of tumour screening.

          Seven independent predictors of small-cell lung carcinoma were identified: age at onset, smoking
          behaviour, weight loss, Karnofsky performance status, bulbar involvement, male sexual impotence,
          and SOX1 antibodies. The score built from them contains only six items, and the seventh is the
          one deliberately left out. SOX1 serology is excluded, so the maximum score is 6 and the instrument
          is purely clinical - which is what the source means by calling it "the simple clinical DELTA-P
          score", and what makes it usable at the bedside before any antibody result returns.

          The six scored items are age at onset at least 50 years, smoking at diagnosis, weight loss of
          at least 5%, bulbar involvement, erectile dysfunction, and Karnofsky performance status below
          70, each present at or within three months of onset. Several are the disease''s own phenotypes,
          which is what makes the score a mechanism-adjacent instrument rather than a generic risk calculator:
          the paraneoplastic form declares itself partly through a more aggressive neurological presentation.'
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: Derived in a nationwide cohort of 107 Dutch patients and validated in a separate
            cohort of 112 British patients, with tumour status as the reference standard.
      selected_evidence:
        snippet: We derived a prediction score for SCLC in LEMS in a nationwide cohort of 107 Dutch patients,
          and validated it in a similar cohort of 112 British patients
        supports: SUPPORT
