              label: Lambert-Eaton myasthenic syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Small-Cell Lung Carcinoma Ectopic Antigen Expression and Anti-Tumour Immune Response
        role: trigger
        biological_scale: ORGANISM
        description: 'Half to two thirds of LEMS is paraneoplastic, and in those patients the tumour is
          not a comorbidity but the origin of the autoimmunity. Small-cell lung carcinoma is a neuroendocrine
          tumour that expresses neuronal antigens ectopically, and the immune response mounted against
          them cross-reacts with the same antigens at the presynaptic terminal. SOX1 is the clearest worked
          case: it was identified as a highly immunogenic SCLC tumour antigen, and antibodies against
          it are found in 64% of patients with LEMS and SCLC and in none with idiopathic LEMS.

          The clinical corollary is the one that makes this node worth curating separately. The anti-tumour
          response that produces the neurological disease also restrains the tumour: patients with SCLC-LEMS
          survive markedly longer than patients with SCLC alone. The autoimmunity is, on the tumour''s
          terms, partly protective.

          Roughly 40-50% of LEMS has no tumour. This node is therefore a trigger for one form of the disease
          and absent in the other, and both converge on the antibody node below.'
      selected_evidence:
        snippet: Probing of the fetal brain expression library with AGNA sera resulted in the isolation
          of SOX1, a highly immunogenic tumor antigen in SCLC
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18032743
      reference_title: SOX1 antibodies are markers of paraneoplastic Lambert-Eaton myasthenic syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies a specific SCLC tumour antigen driving an antibody response in LEMS, which
        is the mechanism this node asserts.
