        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sleep-Activated Epileptiform Activity and ESES/CSWS
        description: 'Pathological hyperexcitability produces marked activation of focal, typically perisylvian/centrotemporal,
          spike-and-wave discharges during non-REM (slow-wave) sleep, reaching continuous or near-continuous
          spike and waves during slow sleep (electrical status epilepticus in sleep, ESES/CSWS). This
          sleep-potentiated epileptiform activity in language cortex is thought to disrupt the maturation
          and function of language networks during a critical developmental window.

          '
        cell_types:
        - preferred_term: Cortical glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: Membrane depolarization / neuronal hyperexcitability
          term:
            id: GO:0051899
            label: membrane depolarization
          modifier: INCREASED
      selected_evidence:
        snippet: It is thought to be the result of an epileptogenic lesion arising in speech cortex during
          a critical period of development.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
