      assertion_type: Pathophysiology
      assertion:
        name: Language Regression
        description: 'Sleep-activated epileptiform disruption of perisylvian language cortex produces
          acquired loss of previously developed language, characteristically beginning with impaired auditory
          verbal comprehension (auditory verbal agnosia) and progressing to broader receptive and expressive
          language loss, sometimes with associated behavioral and cognitive regression.

          '
      selected_evidence:
        snippet: Epilepsy-aphasia syndromes (EAS) are a group of rare, severe epileptic encephalopathies
          of unknown etiology with a characteristic electroencephalogram (EEG) pattern and developmental
          regression particularly affecting language.
        supports: SUPPORT
