      assertion_type: Pathophysiology
      assertion:
        name: GRIN2A/NMDA Receptor Dysfunction
        description: 'In approximately 20% of LKS/epilepsy-aphasia spectrum cases, de novo or inherited
          pathogenic variants in GRIN2A alter the function of the GluN2A (NR2A) subunit of the NMDA glutamate
          receptor. Disrupted NMDA receptor signaling perturbs excitatory glutamatergic neurotransmission
          and synaptic plasticity in cortical neurons, providing the molecular substrate for the epileptic
          encephalopathy.

          '
        cell_types:
        - preferred_term: Cortical glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: NMDA receptor (ionotropic glutamate receptor) signaling
          term:
            id: GO:0035235
            label: ionotropic glutamate receptor signaling pathway
          modifier: ABNORMAL
        - preferred_term: Glutamatergic synaptic transmission
          term:
            id: GO:0035249
            label: synaptic transmission, glutamatergic
          modifier: ABNORMAL
      selected_evidence:
        snippet: about 20% of cases of LKS, CSWSS and electroclinically atypical rolandic epilepsy often
          associated with speech impairment can have a genetic origin sustained by de novo or inherited
          mutations in the GRIN2A gene (encoding the N-methyl-D-aspartate (NMDA) glutamate receptor α2
          subunit, GluN2A)
        supports: SUPPORT
