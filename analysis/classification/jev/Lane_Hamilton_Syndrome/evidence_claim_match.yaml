      about:
        disease:
          name: Lane Hamilton Syndrome
          disease_term:
            preferred_term: Lane Hamilton syndrome
            term:
              id: MONDO:0800124
              label: Lane Hamilton syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Idiopathic pulmonary hemosiderosis (IPH) without celiac disease
        disease_term:
          preferred_term: pulmonary hemosiderosis
          term:
            id: MONDO:0008346
            label: pulmonary hemosiderosis
        description: 'Idiopathic pulmonary hemosiderosis (IPH) is a rare bleeding disorder of the lungs
          presenting with similar pulmonary manifestations to Lane Hamilton Syndrome: diffuse alveolar
          hemorrhage, hemoptysis, iron-deficiency anemia, and hemosiderin-laden macrophages on BAL. However,
          IPH occurs in the absence of underlying celiac disease or gluten sensitivity. IPH patients lack
          serologic evidence of celiac disease (negative anti-tTG and endomysial antibodies) and do not
          respond to gluten-free diet.

          '
        distinguishing_features:
        - Negative celiac disease serology (anti-tTG, endomysial antibodies)
        - No villous atrophy or duodenal histology changes on small bowel biopsy
        - No improvement with gluten-free diet alone
        - Requires corticosteroids and/or immunosuppressive therapy from disease onset
      selected_evidence:
        snippet: Nearly one-third of pediatric patients with IPH test positive for Celiac disease (CD)
          serology. Several hypothetical mechanisms have been proposed to unify the coexistence of these
          two entities, also referred to as Lane-Hamilton syndrome (LHS).
        supports: SUPPORT
