        disease_term:
          preferred_term: anti-glomerular basement membrane disease
          term:
            id: MONDO:0009303
            label: anti-glomerular basement membrane disease
        description: Goodpasture syndrome is an autoimmune condition causing pulmonary-renal vasculitis
          with diffuse alveolar hemorrhage and rapidly progressive glomerulonephritis. While it presents
          with hemoptysis and alveolar hemorrhage similar to Lane Hamilton Syndrome, Goodpasture syndrome
          features anti-GBM antibody positivity, linear IgG deposition on basement membranes, and acute
          progression without association with celiac disease.
        distinguishing_features:
        - Positive anti-glomerular basement membrane (anti-GBM) antibodies
        - Linear IgG deposition on basement membrane by immunofluorescence
        - Rapidly progressive glomerulonephritis with renal dysfunction
        - No association with celiac disease or gluten exposure
        - Presents acutely; more severe at onset than Lane Hamilton Syndrome
      selected_evidence:
        snippet: Pulmonary renal syndromes may share common features due to similarities between the glomerular
          basement membrane and the alveolar basement membrane, such as type IV collagen, which is implicated
          in Goodpasture's syndrome.
        supports: SUPPORT
