              id: MONDO:0800124
              label: Lane Hamilton syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Gluten-triggered intestinal autoimmunity in celiac disease
        description: 'Lane Hamilton Syndrome begins with celiac disease, an autoimmune condition triggered
          by gluten ingestion in genetically predisposed individuals. Gluten exposure activates intestinal
          immune responses with increased intraepithelial lymphocytes, villous atrophy, and crypt hyperplasia
          in the small intestine, particularly the duodenum. This localized intestinal autoimmunity generates
          systemic immune activation and circulating autoantibodies, including anti-tissue transglutaminase
          (anti-tTG) and anti-endomysial antibodies.

          '
        cell_types:
        - preferred_term: T lymphocyte
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: antigen processing and presentation
          term:
            id: GO:0019882
            label: antigen processing and presentation
        - preferred_term: immune response
          term:
            id: GO:0006955
            label: immune response
      selected_evidence:
        snippet: Celiac disease (CD) and IPH diagnosis was made concurrently in 46 patients, whereas in
          21 patients, the diagnosis of LHS was delayed for 2.5y (3 months-11 years).
        supports: SUPPORT
