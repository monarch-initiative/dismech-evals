  e4e6a016d28fdd59ae22da0c72a96c9623385d21bcfba60dbc349d68564a564d:
    claim:
      about:
        disease:
          name: Lane Hamilton Syndrome
          disease_term:
            preferred_term: Lane Hamilton syndrome
            term:
              id: MONDO:0800124
              label: Lane Hamilton syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Alveolar hemorrhage and hemosiderin accumulation
        description: 'Increased capillary permeability allows red blood cells and hemoglobin to escape
          into the alveolar space, causing diffuse alveolar hemorrhage (DAH). Alveolar macrophages rapidly
          phagocytose the extravasated erythrocytes and break down hemoglobin, converting iron and heme
          into hemosiderin. These hemosiderin-laden macrophages (HLM) accumulate in alveolar spaces and
          can be detected via bronchoalveolar lavage (BAL) or lung biopsy, serving as a hallmark histologic
          finding of prior alveolar bleeding.

          '
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        - preferred_term: pulmonary alveolar type 2 cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        biological_processes:
        - preferred_term: heme catabolic process
          term:
            id: GO:0042167
            label: heme catabolic process
        - preferred_term: iron ion homeostasis
          term:
            id: GO:0006879
            label: intracellular iron ion homeostasis
      selected_evidence:
        snippet: 'Lane-Hamilton syndrome: A rare cause of recurrent alveolar hemorrhage in an adult'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
