  b9d4755367e677a07671c990342fa2bedc771209488bebf6ce65d657d32339e5:
    claim:
      about:
        disease:
          name: Lane Hamilton Syndrome
          disease_term:
            preferred_term: Lane Hamilton syndrome
            term:
              id: MONDO:0800124
              label: Lane Hamilton syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immune-mediated increase in pulmonary capillary permeability
        description: 'Systemic immune mediators generated by intestinal celiac disease act on the pulmonary
          microvasculature, increasing capillary endothelial permeability without causing vasculitis or
          immune complex deposition. Mediators such as histamine (released by eosinophils and basophils),
          eosinophil cationic protein (ECP), and vascular endothelial growth factor (VEGF) increase endothelial
          gap formation between capillary endothelial cells. This allows erythrocyte extravasation into
          the alveolar space in the absence of structural vascular damage or capillaritis.

          '
        cell_types:
        - preferred_term: capillary endothelial cell
          term:
            id: CL:0002144
            label: capillary endothelial cell
        - preferred_term: eosinophil
          term:
            id: CL:0000041
            label: mature eosinophil
        - preferred_term: basophil
          term:
            id: CL:0000767
            label: basophil
        biological_processes:
        - preferred_term: regulation of vascular permeability
          term:
            id: GO:0043114
            label: regulation of vascular permeability
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
      selected_evidence:
        snippet: The association of pulmonary hemosiderosis with celiac disease (Lane-Hamilton syndrome)
          is extremely rare.
        supports: NO_EVIDENCE
