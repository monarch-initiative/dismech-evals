    claim:
      about:
        disease:
          name: Langer Mesomelic Dysplasia
          disease_term:
            preferred_term: Langer mesomelic dysplasia
            term:
              id: MONDO:0009588
              label: Langer mesomelic dysplasia
        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant Growth Hormone Therapy
        description: rhGH is licensed and effective for SHOX-deficient short stature, with a reported
          final-height gain of 7 to 10 cm — but that evidence is entirely from heterozygous patients.
          In LMD the one documented treated case, an individual with combined LMD and Turner syndrome,
          showed a biochemical response with rising IGF-1 and no height-velocity response at all, with
          the height deficit widening over four years. Complete SHOX deficiency plausibly removes the
          growth plate substrate on which GH acts, so the extrapolation from LWD is not merely unproven
          but has been contradicted once. Offer it, if at all, with that explicitly on the table.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Growth hormone therapy
          term:
            id: NCIT:C15599
            label: Hormone Replacement Therapy
          therapeutic_agent:
          - preferred_term: recombinant human growth hormone
            term:
              id: NCIT:C837
              label: Somatropin
      selected_evidence:
        snippet: Short-statured prepubertal patients with genetically confirmed SHOX deficiency (n = 49)
          or Turner syndrome (n = 24) who participated in the extension.
        supports: SUPPORT
