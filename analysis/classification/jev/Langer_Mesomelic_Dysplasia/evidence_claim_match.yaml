        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Zeugopod-Restricted SHOX Expression Domain
        biological_scale: TISSUE
        description: 'Why the middle limb segment and not the whole limb. In human embryos SHOX and its
          paralog SHOX2 occupy complementary limb domains: SHOX in the zeugopod (forearm, lower leg),
          SHOX2 more proximally in the stylopod. The paralog therefore cannot compensate where SHOX is
          lost, and the deficit is confined to the segment SHOX alone patterns. This is the anatomical
          explanation of "mesomelic", and it is a positional argument rather than a severity one.'
        biological_processes:
        - preferred_term: limb development
          modifier: DECREASED
          term:
            id: GO:0060173
            label: limb development
      selected_evidence:
        snippet: 'In human embryos, SHOX and SHOX2 display complementary expression profiles during limb
          development: SHOX is detected in the middle portion of the limb corresponding to the mesomelic
          segments, whereas SHOX2 is expressed more proximally'
        supports: SUPPORT
