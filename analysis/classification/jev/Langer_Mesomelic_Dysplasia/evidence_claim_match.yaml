        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disorganized Growth Plate Chondrocyte Maturation
        biological_scale: CELLULAR
        description: 'SHOX-deficient growth plates lose their normal parallel columnar arrangement of
          chondrocytes, with tandem stacking replaced by a side-by-side arrangement, an expanded hypertrophic
          layer, and evidence of abnormal endochondral ossification. Unusually for a disorder this rare,
          the lesion has been described in LMD tissue itself and not only inferred from the heterozygous
          state: fetal growth plates from terminated LMD pregnancies show shortened, side-by-side chondrocyte
          columns in the proliferative zone and enlarged reserve-zone chondrocytes, with mutant SHOX protein
          still detectable across all three zones.'
        cell_types:
        - preferred_term: Growth plate chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        - preferred_term: Hypertrophic chondrocyte
          term:
            id: CL:0000743
            label: hypertrophic chondrocyte
        biological_processes:
        - preferred_term: Growth plate chondrocyte differentiation
          modifier: DECREASED
          term:
            id: GO:0003418
            label: growth plate cartilage chondrocyte differentiation
        - preferred_term: Endochondral bone morphogenesis
          modifier: DECREASED
          term:
            id: GO:0060350
            label: endochondral bone morphogenesis
      selected_evidence:
        snippet: A widespread disorganisation of physeal anatomy was revealed with disruption of the normal
          parallel columnar arrangement of chondrocytes. Tandem stacking of maturing chondrocytes within
          columns was replaced by a side-by-side arrangement.
        supports: SUPPORT
