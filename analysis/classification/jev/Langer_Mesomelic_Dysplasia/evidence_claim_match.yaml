        - preferred_term: Endochondral bone morphogenesis
          modifier: DECREASED
          term:
            id: GO:0060350
            label: endochondral bone morphogenesis
      selected_evidence:
        snippet: significant cellular disorganization was evident in the proliferative zone, where chondrocyte
