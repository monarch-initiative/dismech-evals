          name: Langer Mesomelic Dysplasia
          disease_term:
            preferred_term: Langer mesomelic dysplasia
            term:
              id: MONDO:0009588
              label: Langer mesomelic dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Zeugopod-Restricted SHOX Expression Domain
        biological_scale: TISSUE
        description: 'Why the middle limb segment and not the whole limb. In human embryos SHOX and its
          paralog SHOX2 occupy complementary limb domains: SHOX in the zeugopod (forearm, lower leg),
          SHOX2 more proximally in the stylopod. The paralog therefore cannot compensate where SHOX is
          lost, and the deficit is confined to the segment SHOX alone patterns. This is the anatomical
          explanation of "mesomelic", and it is a positional argument rather than a severity one.'
        biological_processes:
        - preferred_term: limb development
          modifier: DECREASED
          term:
            id: GO:0060173
            label: limb development
      selected_evidence:
        snippet: conditional Shox2 inactivation in murine limbs, a species that has lost the SHOX gene
          during evolution, leads to severe stylopodial (humerus, femur) shortening, with relative sparing
          of the zeugopod, confirming the complementary segmental roles of these paralogs
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42553923
      reference_title: 'Langer mesomelic dysplasia as a rare manifestation of SHOX deficiency: a narrative
        review.'
      evidence_source: MODEL_ORGANISM
      explanation: 'The reciprocal experiment: removing the proximal paralog produces the proximal phenotype,
        corroborating the segmental division of labour.'
