              id: MONDO:0009588
              label: Langer mesomelic dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of SHOX Chondrogenic Target Regulation
        biological_scale: MOLECULAR
        description: SHOX does not act alone on one target. It directly induces NPPB (natriuretic peptide
          B / BNP), whose co-expression with SHOX in prehypertrophic and hypertrophic chondrocytes places
          the pair in growth plate regulation; it interacts with SOX5 and SOX6 to regulate aggrecan synthesis
          and cartilage matrix assembly; and in a chondrogenic context it represses FGFR3, itself a negative
          regulator of endochondral growth. Losing SHOX therefore removes a growth-promoting input and
          simultaneously de-represses a growth-inhibiting one — a plausible reason the biallelic phenotype
          is disproportionately severe rather than simply twice as bad.
        biological_processes:
        - preferred_term: Regulation of chondrocyte gene expression by SHOX
          modifier: DECREASED
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: The SHOX protein also directly induces transcription of the NPPB gene, encoding the natriuretic
          peptide BNP, a direct SHOX target whose co-expression with SHOX in prehypertrophic and hypertrophic
          chondrocytes implicates this axis in growth plate regulation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42553923
      reference_title: 'Langer mesomelic dysplasia as a rare manifestation of SHOX deficiency: a narrative
