        description: SHOX lies in pseudoautosomal region 1, which escapes X inactivation and recombines
          between X and Y, so SHOX alleles follow autosomal rules in both sexes. LMD requires two defective
          SHOX alleles. The characteristic pedigree is two LWD parents with a 25% risk per pregnancy of
          an LMD child; consanguinity and pseudodominant transmission (an affected parent mating with
          a heterozygous carrier) both occur.
      selected_evidence:
        snippet: If both parents have SHOX deficiency, the offspring have a 50% chance of having a SHOX
          deficiency disorder, a 25% chance of having Langer type of mesomelic dwarfism, and a 25% chance
          of having neither condition.
