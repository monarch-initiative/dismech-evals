      assertion_type: Discussion
      assertion:
        discussion_id: lcnec_molecular_subtype_binary
        kind: KNOWLEDGE_GAP
        prompt: Does the type I / type II (or SCLC-like / NSCLC-like) molecular classification of LCNEC
          hold up as a binary, and should it direct first-line therapy prospectively?
        attaches_to:
        - pathophysiology#RB1 Biallelic Inactivation
        - pathophysiology#STK11 and KEAP1 Biallelic Inactivation
        rationale: 'The subgroup framework rests on retrospective cohorts, and the one treatment-relevant
          finding (RB1 wild-type tumours doing better with NSCLC-type than with SCLC-type chemotherapy)
          comes from a registry analysis, not a randomised trial. The two branches are reported as mutually
          exclusive in 82% of cases, which leaves a substantial residue that fits neither, and the discordance
          between the genomic label and the transcriptional phenotype suggests a continuum of neuroendocrine
          differentiation rather than two classes. The largest clinical genomic series to date makes the
          residue explicit: of 1,426 profiled LCNEC samples, 557 were SCLC-like, 530 NSCLC-like, 25 carcinoid-like
          and 314 could not be classified at all. No prospective biomarker-stratified trial has yet tested
          assigning chemotherapy by RB1 status.'
        proposed_experiments:
        - experiment_id: lcnec_rb1_stratified_chemotherapy_trial
          name: Prospective RB1-stratified chemotherapy trial in advanced LCNEC
          description: Randomise patients with advanced LCNEC to platinum-etoposide versus platinum plus
            gemcitabine or taxane, stratified prospectively by RB1 mutation and Rb immunohistochemistry,
            with overall survival as the primary endpoint.
      selected_evidence:
        snippet: Under this schema, 530 samples were classified as NSCLC-like and 314 remained unclassified.
        supports: SUPPORT
