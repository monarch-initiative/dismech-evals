      assertion_type: Diagnosis
      assertion:
        name: Combined morphologic and immunohistochemical diagnosis
        description: Diagnosis requires neuroendocrine morphology, a high mitotic rate and neuroendocrine
          differentiation confirmed by immunohistochemistry (CD56, chromogranin A, synaptophysin). Because
          neuroendocrine morphology is often absent on small biopsies, positivity for at least two of
          three neuroendocrine markers substantially improves sensitivity and is the practical diagnostic
          rule on biopsy material.
      selected_evidence:
        snippet: In NSCLC devoid of obvious morphological squamous or adenocarcinoma features, positive
          staining in greater than or equal to two of three neuroendocrine IHC stains supports the diagnosis
          of LCNEC.
        supports: SUPPORT
