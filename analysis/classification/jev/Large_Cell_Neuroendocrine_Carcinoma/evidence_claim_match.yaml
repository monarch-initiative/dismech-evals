          burden is what generates the tumour-suppressor loss-of-function events that define both molecular
          subgroups.
      selected_evidence:
        snippet: On average, LCNECs exhibited an exonic mutation rate of 8.6 non-synonymous mutations
          per million base pairs and a C:G > A:T transversion rate of 38.7%
        supports: SUPPORT
