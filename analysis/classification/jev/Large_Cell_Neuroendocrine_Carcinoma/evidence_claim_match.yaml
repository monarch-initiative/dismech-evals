        context: []
      assertion_type: Subtype
      assertion:
        name: Cervical LCNEC
        display_name: Cervical large cell neuroendocrine carcinoma
        description: LCNEC arising in the uterine cervix, one of the recognised gynaecological high-grade
          neuroendocrine carcinomas. Unlike the smoking-driven pulmonary form, cervical LCNEC is associated
          with high-risk HPV. A reported HPV18-positive case also showed a very low tumour mutational
          burden (1.21/Mb), the opposite of the high TMB that characterises pulmonary LCNEC - a concrete
          reason not to generalise the pulmonary mechanism or the pulmonary immunotherapy rationale across
          sites. That is a single case, so it is recorded here as a caution rather than an established
          site difference.
        subtype_term:
          preferred_term: cervical large cell neuroendocrine carcinoma
          term:
            id: MONDO:0006138
            label: cervical large cell neuroendocrine carcinoma
      selected_evidence:
        snippet: Biopsy showed chromogranin A and synaptophysin positivity, diffuse p16, and Ki-67%~80%.
        supports: SUPPORT
    origin:
