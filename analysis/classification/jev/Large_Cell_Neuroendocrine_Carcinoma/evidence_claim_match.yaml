      assertion_type: AnimalModel
      assertion:
        name: Quadruple tumour-suppressor knockout mouse (Rb1/Rbl1/Pten/Trp53)
        species: Mouse
        genotype: Rbl1-null; Rb1, Pten and Trp53 conditional alleles deleted by adenoviral Cre
        publication: PMID:31611390
        description: The first defined mouse model of LCNEC. In an Rbl1-null background, deletion of Rb1,
          Pten and Trp53 by broadly targeted Ad-CMVcre produces LCNEC, whereas the identical genetic lesion
          delivered to basal cells by Ad-K5cre produces small cell lung carcinoma instead. This makes
          cell of origin, not genotype, the determinant of which high-grade neuroendocrine carcinoma develops.
        modeled_mechanisms:
        - target: Loss of G1/S Cell-Cycle Checkpoint Control
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Combined Rb1/Rbl1/Trp53 inactivation reproduces the checkpoint-loss lesion that
            defines the SCLC-like branch of human LCNEC.
          limitations: The model adds Rbl1 (p130) and Pten inactivation, which are not established recurrent
            drivers of human LCNEC, so the genotype is broader than the human lesion set. The tumours
            are also induced synchronously in immunocompetent mice rather than arising through decades
            of carcinogen exposure.
        - target: Neuroendocrine Lineage Programme Expression
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The model reproduces the neuroendocrine carcinoma lineage and shows that restricting
            the same lesions to basal cells yields SCLC instead, directly demonstrating cell-of-origin
            control of the neuroendocrine phenotype.
          limitations: The experiment establishes that cell of origin determines which tumour type arises,
            but it does not model the ASCL1/DLL3/NOTCH transcriptional subgrouping that distinguishes
            human type I from type II LCNEC.
      selected_evidence:
        snippet: So far, a defined model of LCNEC has not been reported.
        supports: SUPPORT
