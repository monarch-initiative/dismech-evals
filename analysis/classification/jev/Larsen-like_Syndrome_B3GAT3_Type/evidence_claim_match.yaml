      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: subdomain_severity_gradient
        hypothesis_label: Catalytic-subdomain location determines phenotype severity
        status: EMERGING
        description: 'Across the small published cohort, variants in the acceptor-substrate-binding subdomain
          of the GlcAT-I catalytic domain (p.Gly223Ser, p.Leu224Gln, p.Arg277Gln, p.Arg297Trp) segregate
          with the severe end of the spectrum — multiple fractures, craniosynostosis, cardiovascular malformation,
          and in the p.Gly223Ser cases death before one year — whereas donor-subdomain variants (p.Pro140Leu,
          p.Thr139Met, p.Arg161Trp) produce milder, sometimes purely skeletal disease. A compound heterozygote
          carrying one variant in each subdomain had an intermediate phenotype. The correlation rests
          on very few patients and is not yet supported by a systematic activity-versus-severity assay
          series, so it should be treated as emerging rather than as an established genotype-phenotype
          rule.

          '
      selected_evidence:
        snippet: The heterogeneous LK phenotypes, ranging from mild to severe and even lethal presentations,
          seem to be related to specific B3GAT3 mutations, though there has been a limited number of patients
          and pathogenic variants described so far
        supports: SUPPORT
