        description: 'Proteoglycan-rich cardiac jelly and valve interstitial matrix are required for endocardial
          cushion remodelling and semilunar/atrioventricular valve morphogenesis, and proteoglycans are
          structural constituents of the aortic media. GlcAT-I deficiency therefore yields bicuspid aortic
          valve, mitral valve prolapse, atrial and ventricular septal defects, and progressive aortic
          root dilatation. Cardiovascular involvement is the feature that most sharply distinguishes B3GAT3-related
          disease from the B4GALT7/B3GALT6 spondylodysplastic Ehlers-Danlos linkeropathies, and it is
          genotype-dependent: the Nias p.Pro140Leu donor-subdomain family had no detectable cardiac phenotype.

          '
