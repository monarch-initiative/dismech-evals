          term:
            id: UBERON:0000946
            label: cardiac valve
        - preferred_term: aorta
          term:
            id: UBERON:0000947
            label: aorta
      selected_evidence:
        snippet: Concerning cardiovascular involvement, anomalies such as septal defects, aortic valve
          dysplasia, aortic root and ascending aorta dilatation, and mitral valve prolapse, are more recurrent
          in B3GAT3-related disorders as well as in SOS.
        supports: SUPPORT
