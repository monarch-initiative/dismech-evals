  7ab79527c7dedc954597ca52b2aa1eb1c799733acf3c2b7f5155cc7339493caf:
    claim:
      about:
        disease:
          name: Larsen-like Syndrome B3GAT3 Type
          disease_term:
            preferred_term: Larsen-like syndrome, B3GAT3 type
            term:
              id: MONDO:0009511
              label: Larsen-like syndrome, B3GAT3 type
        context: []
      assertion_type: Genetic
      assertion:
        name: B3GAT3
        notes: 'B3GAT3 (11q12.3) encodes beta-1,3-glucuronyltransferase 3 / glucuronosyltransferase-I
          (GlcAT-I), a cis- and cis-medial Golgi enzyme that transfers UDP-glucuronic acid onto the Gal-Gal-Xyl-Ser
          trisaccharide, completing the tetrasaccharide linker that all glycosaminoglycan chains are built
          upon. Reported disease alleles are predominantly missense substitutions in the glycosyltransferase
          catalytic domain (p.Arg277Gln — the original United Arab Emirates founder allele; p.Pro140Leu
          in the Nias/Indonesia clan; p.Gly223Ser in the severe craniosynostosis/fracture phenotype; p.Thr139Met
          recurrent in the Turkish population; p.Pro82Leu in a geroderma-like case; p.Arg161Trp and p.Arg297Trp
          in a compound heterozygote), together with a start-loss null allele (p.Met1?), a missense p.Leu224Gln
          with ~3% residual activity, and an in-frame p.Leu21del.

          '
        gene_term:
          preferred_term: B3GAT3
          term:
            id: hgnc:923
            label: B3GAT3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: We identified linkage to chromosome 11 and detected a mutation (c.830G>A, p.Arg277Gln)
          in B3GAT3, the gene coding for glucuronosyltransferase-I (GlcAT-I).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
