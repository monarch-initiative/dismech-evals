          term:
            id: MONDO:0007738
            label: spondyloepiphyseal dysplasia with congenital joint dislocations
        description: 'CHST3-related skeletal dysplasia (also called autosomal recessive Larsen syndrome,
          or humero-spinal dysostosis) is the closest recessive phenocopy: congenital large-joint dislocations,
          short stature and clubfoot in an autosomal recessive glycosaminoglycan-pathway disorder.

          '
        distinguishing_features:
        - CHST3 encodes carbohydrate sulfotransferase 3 (C6ST-1), which 6-O-sulfates already-polymerized
          chondroitin — a downstream chain-modification step, not the shared tetrasaccharide linker that
          B3GAT3 completes, so heparan sulfate synthesis is spared.
        - CHST3 disease is dominated by progressive spinal and epiphyseal involvement and does not carry
          the B3GAT3 pattern of radioulnar synostosis with congenital cardiac valve and great-vessel malformation.
      selected_evidence:
        snippet: The linker region is completed by the transfer of glucuronic acid (GlcA) catalyzed by
          glucuronosyltransferase I (GlcAT-I encoded by B3GAT3), upon which polymerization of the HS or
          CS/DS chains begins.
        supports: SUPPORT
