      assertion_type: Pathophysiology
      assertion:
        name: GlcAT-I Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic B3GAT3 missense, start-loss, or in-frame deletion variants reduce or abolish
          the galactosylgalactosylxylosylprotein 3-beta-glucuronosyltransferase activity of GlcAT-I. Disease-associated
          substitutions cluster in the two functional halves of the catalytic domain: the donor (UDP-GlcA)
          substrate-binding subdomain (p.Pro140Leu, p.Thr139Met, p.Arg161Trp) and the acceptor substrate-binding
          subdomain (p.Arg277Gln, p.Gly223Ser, p.Leu224Gln, p.Arg297Trp). Reduced activity is demonstrable
          both in patient-derived cells and for recombinant mutant protein.

          '
        gene:
          preferred_term: B3GAT3
          term:
            id: hgnc:923
            label: B3GAT3
        molecular_functions:
        - preferred_term: glucuronosyltransferase-I (GlcAT-I) activity
          term:
            id: GO:0015018
            label: galactosylgalactosylxylosylprotein 3-beta-glucuronosyltransferase activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: Further studies demonstrated that GlcAT-I resides in the cis and cis-medial Golgi apparatus
          and is expressed in the affected tissues, i.e., heart, aorta, and bone.
        supports: SUPPORT
