        description: 'All glycosaminoglycan chains — heparan sulfate and chondroitin/dermatan sulfate
          alike — are built on a single shared GlcA-Gal-Gal-Xyl tetrasaccharide linker attached to a serine
          of the proteoglycan core protein. GlcAT-I catalyzes the final, committing step of linker assembly,
          so its deficiency is a bottleneck upstream of every downstream GAG polymerase and sulfotransferase.
          This shared-bottleneck position is what defines the "linkeropathy" disease class and explains
          why one enzyme defect produces a pleiotropic connective tissue phenotype.

          '
        biological_processes:
