          extracellular matrix formation around chondrocytes, recapitulating the cartilage arm of the
          human disease. Biochemically the model is informative but not a straightforward mirror of the
          human data: chondroitin sulfate biosynthesis is virtually abolished while about half of normal
          heparan sulfate output persists, whereas human patient fibroblasts show a more balanced reduction
          across dermatan, chondroitin and heparan sulfate proteoglycans. The model has not been reported
          to reproduce the human cardiac valve and great-vessel malformations.

          '
