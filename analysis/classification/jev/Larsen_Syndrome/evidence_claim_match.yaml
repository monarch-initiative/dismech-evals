        description: 'Cervical spine imaging and neurologic review should be performed early and before
          anesthesia or major orthopedic procedures because cervical kyphosis and instability can be under-recognized
          and can cause myelopathy or paralysis. Airway planning should account for laryngotracheomalacia
          when present.

          '
        diagnosis_term:
          preferred_term: clinical imaging procedure
          term:
            id: NCIT:C17369
            label: Imaging Procedure
        results: 'Radiographs or other cervical spine imaging may identify cervical kyphosis or instability
          requiring urgent surgical planning; airway assessment guides anesthesia strategy when laryngotracheomalacia
          is present.

          '
      selected_evidence:
        snippet: Therefore, all patients with Larsen syndrome should be screened with radiographs at the
          first visit to detect cervical kyphosis early so that posterior alone fusion is possible.
        supports: SUPPORT
