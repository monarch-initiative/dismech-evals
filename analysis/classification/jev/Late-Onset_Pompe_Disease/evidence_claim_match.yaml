        description: The aorta accumulated the least glycogen of any smooth-muscle tissue measured and
          did not accumulate more between 6 and 15 months, and the authors state that this does not support
          the glycogen-to-wall-weakness hypothesis. The only aortic change seen was tunica media remodeling
          at 15 months. Note the study assayed glycogen and wall histology; it did not report vessel-calibre
          measurements, so what is recorded here is failure to reproduce the storage-driven wall lesion
          rather than a measured absence of dilatation.
        limitations: This is a negative result about the aorta specifically, in a model whose lifespan
          (6-9 months untreated, examined to 15 months) is far shorter than the decades over which human
          aortic dilatation develops, so failure to recapitulate may reflect insufficient time rather
          than a wrong mechanism. It is recorded because it is the main reason the human arteriopathy
          node is marked PROVISIONAL, not as a refutation of the mechanism.
        readouts:
        - name: Aortic PAS-positive glycogen deposits at 6 and 15 months
          target: Dilative Arteriopathy of the Aorta and Intracranial Arteries
          description: Periodic acid-Schiff histology of aortic sections in Gaa-/- mice at two ages, scored
            for glycogen deposit number and size.
          direction: UNCHANGED
          interpretation: Aortic glycogen did not increase with age, which is why the authors declined
            to attribute aortic wall weakness to glycogen accumulation in this model.
      selected_evidence:
        snippet: the limited PAS+ present at both 6 and 15 months in the aorta of Gaa-/- mice does not
          corroborate our hypothesis that glycogen accumulation is responsible for aortic wall weakness
