      assertion:
        name: Relative Cardiac Sparing
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        description: 'Absence of hypertrophic cardiomyopathy is a defining feature of LOPD and part of
          its formal case definition, not merely a statistical tendency. Residual GAA activity is sufficient
          to keep cardiomyocyte glycogen storage subclinical, so the cardiorespiratory collapse that kills
          untreated infants does not occur; the respiratory system, not the heart, becomes the life-limiting
          organ. This node is curated as a mechanistic contrast rather than as a claim that the myocardium
          is entirely normal - adult arteriopathy and rare conduction findings are described in the umbrella
          Pompe disease entry.

          '
        cell_types:
        - preferred_term: Cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: late-onset Pompe disease (LOPD) (i.e., individuals with onset before age 12 months without
          cardiomyopathy, and all individuals with onset after age 12 months)
        supports: SUPPORT
