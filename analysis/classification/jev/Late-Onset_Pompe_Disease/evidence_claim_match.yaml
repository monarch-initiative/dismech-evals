        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lopd_autophagic_mistargeting_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Autophagic Mistargeting of Endocytosed Recombinant Enzyme
        prompt: Does autophagic mistargeting of endocytosed recombinant GAA, demonstrated in single fibers
          of the GAA knockout mouse, account for the therapeutic ceiling observed in treated human LOPD
          skeletal muscle?
        rationale: 'The mistargeting mechanism is directly imaged in live single muscle fibers of GAA
          knockout mice, which model complete rather than partial enzyme deficiency. LOPD muscle retains
          residual enzyme and accumulates storage over decades, so the extent of autophagic buildup -
          and therefore how much of the human treatment ceiling it explains - is not established from
          the mouse data alone. The human counterpart evidence in this entry is indirect: fat fraction
          continues to rise and some patients still progress to ventilation on therapy, which is consistent
          with the mechanism but does not measure enzyme trafficking in human muscle.

          '
        proposed_experiments:
        - experiment_id: lopd_rhgaa_trafficking_in_patient_myofibers
          name: Trafficking of labelled rhGAA in LOPD patient muscle biopsy fibers
          description: Assess whether endocytosed recombinant GAA reaches lysosomes or is retained in
            autophagic compartments in myofibers from genotyped LOPD patients, stratified by residual
            enzyme activity and by duration of enzyme replacement therapy.
      selected_evidence:
        snippet: These findings may explain why ERT often falls short of reversing the disease process
          and point toward new avenues for the development of pharmacological intervention.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
