      assertion:
        name: Anaesthetic and cardiovascular agent precautions
        description: 'This is a negative recommendation rather than an intervention. Anaesthesia carries
          disproportionate risk in LOPD because reduced cardiovascular return combines with the underlying
          respiratory insufficiency, and GeneReviews advises using it only when absolutely necessary.
          Positioning matters for the same reason: because vital capacity falls on lying flat, LOPD patients
          should not be laid completely supine. Digoxin, inotropes, diuretics, and afterload-reducing
          agents can worsen left ventricular outflow obstruction; that caution is inherited from Pompe
          disease generally and is less applicable to the typically cardiac-spared LOPD patient, so it
          is recorded here as context rather than as an LOPD-specific claim.

          '
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: avoidance of high-risk agents and circumstances
          term:
            id: NCIT:C15747
            label: Supportive Care
