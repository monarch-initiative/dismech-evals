          ancestry, but it is not the only one: several other splice-site variants are similarly associated
          with the late-onset phenotype, whereas two non-splice-site (typically null) alleles produce
          infantile disease.

          '
        variants:
        - name: c.-32-13T>G (IVS1)
          description: 'Intron-1 variant 13 nucleotides upstream of GAA exon 2. It weakens the exon 2
            splice acceptor, causing partial and complete exon 2 skipping, while permitting a low level
            of correctly spliced wild-type transcript - the "leaky" behaviour that yields residual enzyme
            and late-onset disease.

            '
          clinical_significance: PATHOGENIC
          regulatory_category: mLOE
      selected_evidence:
        snippet: Our study concluded that Italian patients exhibited a characteristic genetic profile
          similar to that of the broader European population, with the c.-32-13T>G variant being the most
          prevalent.
        supports: SUPPORT
