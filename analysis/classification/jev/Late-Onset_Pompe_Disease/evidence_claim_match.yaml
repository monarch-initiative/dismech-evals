  46c551b9952e59e28f36f2fbda7dad8c929d5add2bdc43bc7f4d71a0ddf12bc0:
    claim:
      about:
        disease:
          name: Late-Onset Pompe Disease
          disease_term:
            preferred_term: Late-onset Pompe disease
            term:
              id: MONDO:0018485
              label: glycogen storage disease due to acid maltase deficiency, late-onset
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Pseudodeficiency alleles as a false-positive trap
        description: 'A reduced GAA activity result with no pathogenic genotype may reflect a pseudodeficiency
          allele rather than disease. The best-characterized example is GAA c.271G>A (p.Asp91Asn), which
          depresses measured enzyme activity but has been formally reviewed as benign for Pompe disease.
          This is the specific reason molecular confirmation - and, when the genotype does not explain
          the phenotype, broader genetic analysis - is required rather than optional.

          '
        diagnosis_term:
          preferred_term: GAA variant classification
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: Low measured GAA activity without two pathogenic variants should raise a pseudodeficiency
          allele and prompt variant curation against ACMG-AMP criteria, not a diagnosis of Pompe disease.
        notes: The preprint additionally reports a patient homozygous for c.271G>A whose symptoms were
          ultimately explained by a PABPN1 variant, which is the clinical shape of the error this entry
          is guarding against.
      selected_evidence:
        snippet: Rarely, positive DBS with no pathogenic variant may also be related to pseudodeficiency
          alleles
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/3
      evidence_path: /diagnosis/3/evidence/0
