        context: []
      assertion_type: Diagnosis
      assertion:
        name: Sitting and supine forced vital capacity
        description: 'Spirometry performed in both the sitting and the supine position is the routine
          diaphragm-specific measurement in LOPD. Because the diaphragm is disproportionately affected,
          vital capacity falls on lying flat, so a supine drop identifies diaphragm weakness that a seated
          measurement alone can miss. It is recommended at least annually.

          '
        diagnosis_term:
          preferred_term: sitting and supine spirometry
          term:
            id: NCIT:C38081
            label: Pulmonary Function Test
        results: A fall in forced vital capacity from sitting to supine indicates diaphragmatic weakness;
          an FVC below 40% predicted should prompt referral to a home ventilation team.
      selected_evidence:
        snippet: Due to the involvement of diaphragm, pulmonary function in supine position may be more
          affected than in upright position.
        supports: SUPPORT
