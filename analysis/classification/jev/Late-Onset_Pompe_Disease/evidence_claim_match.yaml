  7b6164ff97c7d35169385cda8362357a3624ca55d020e78a8898935087134372:
    claim:
      about:
        disease:
          name: Late-Onset Pompe Disease
          disease_term:
            preferred_term: Late-onset Pompe disease
            term:
              id: MONDO:0018485
              label: glycogen storage disease due to acid maltase deficiency, late-onset
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Gaa-/- global knockout mouse (smooth muscle characterization)
        species: Mouse
        genotype: Gaa-/- (targeted disruption of exon 6), homozygous null
        background: B6;129
        publication: PMID:33883348
        genes:
        - preferred_term: GAA
          term:
            id: hgnc:4065
            label: GAA
        description: 'The most widely used Pompe mouse, a global Gaa knockout that survives into adulthood
          without treatment. This entry curates the study that characterized its smooth muscle rather
          than its skeletal muscle, because that is what bears on the extra-muscular arms of LOPD. Glycogen,
          lysosomes and autophagosomes accumulate across aortic, tracheal, esophageal, gastric and bladder
          smooth muscle, with the gastrointestinal and genitourinary tissues most affected. The model''s
          central limitation for late-onset disease is genetic: a global null has essentially no residual
          enzyme, whereas LOPD is defined by partial activity from a leaky splice allele, so the mouse
          is genotypically closer to infantile-onset disease and its tempo cannot be read across.

          '
        modeled_mechanisms:
        - target: Lysosomal Glycogen Accumulation in Vascular and Visceral Smooth Muscle
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Quantitative glycogen assay, PAS histology and LAMP1/LC3 immunoblotting all show
            the storage-plus-vacuolar-accumulation lesion in the same smooth-muscle beds implicated by
            human autopsy.
          limitations: A global null has no residual GAA, whereas LOPD is defined by partial activity
            from a leaky splice allele, so the model reproduces the lesion but not the late-onset tempo
            or threshold. Aortic glycogen was the lowest of the tissues measured and did not increase
            between 6 and 15 months, so the vascular half of this node is the weakest part of the match.
          readouts:
          - name: Tissue glycogen content in smooth-muscle organs
            target: Lysosomal Glycogen Accumulation in Vascular and Visceral Smooth Muscle
            description: Enzymatic glycogen quantification of aorta, trachea, esophagus, stomach and bladder
              in 6-month-old Gaa-/- versus wild-type mice, normalized to protein.
            direction: INCREASED
            interpretation: Direct measurement of the storage lesion this node asserts, in the smooth
              muscle beds relevant to the vascular and visceral arms of LOPD.
          - name: LAMP1 abundance in smooth-muscle organs
            target: Lysosomal Glycogen Accumulation in Vascular and Visceral Smooth Muscle
            description: Western blot quantification of the lysosomal membrane protein LAMP1, normalized
              to loading control, as a proxy for lysosomal expansion.
            direction: INCREASED
            interpretation: Lysosomal expansion is the cellular consequence of the glycogen load and grounds
              the glycogen-distended lysosome annotation on this node.
        - target: Dilative Arteriopathy of the Aorta and Intracranial Arteries
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The aorta accumulated the least glycogen of any smooth-muscle tissue measured and
            did not accumulate more between 6 and 15 months, and the authors state that this does not
            support the glycogen-to-wall-weakness hypothesis. The only aortic change seen was tunica media
            remodeling at 15 months. Note the study assayed glycogen and wall histology; it did not report
            vessel-calibre measurements, so what is recorded here is failure to reproduce the storage-driven
            wall lesion rather than a measured absence of dilatation.
          limitations: This is a negative result about the aorta specifically, in a model whose lifespan
            (6-9 months untreated, examined to 15 months) is far shorter than the decades over which human
            aortic dilatation develops, so failure to recapitulate may reflect insufficient time rather
            than a wrong mechanism. It is recorded because it is the main reason the human arteriopathy
            node is marked PROVISIONAL, not as a refutation of the mechanism.
          readouts:
          - name: Aortic PAS-positive glycogen deposits at 6 and 15 months
            target: Dilative Arteriopathy of the Aorta and Intracranial Arteries
            description: Periodic acid-Schiff histology of aortic sections in Gaa-/- mice at two ages,
              scored for glycogen deposit number and size.
            direction: UNCHANGED
            interpretation: Aortic glycogen did not increase with age, which is why the authors declined
              to attribute aortic wall weakness to glycogen accumulation in this model.
      selected_evidence:
        snippet: In conclusion, GAA deficiency results in significant glycogen accumulation in the airway,
          vascular, GI and GU smooth muscle.
        supports: SUPPORT
