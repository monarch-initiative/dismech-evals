        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lopd_presymptomatic_ert_initiation
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Incomplete Response to Enzyme Replacement Therapy
        prompt: When should enzyme replacement therapy be started in a person with a confirmed LOPD genotype
          who has no symptoms, as is now routine after newborn screening or family cascade testing?
        rationale: 'Newborn screening and family screening increasingly identify LOPD before any clinical
          sign. Because LOPD is defined by a decades-long latency, the conventional trigger for treatment
          - symptom onset - may come after irreversible myofiber loss, but treating a pre-symptomatic
          patient commits them to lifelong infusions with cost, infusion-reaction risk, and immunogenicity.
          Guidance is not settled: European recommendations favour monitoring asymptomatic cases with
          minimal muscle MRI findings, while other guidance would start therapy once any muscle involvement
          (for example paraspinal) is detectable. Siblings sharing a genotype can differ markedly in age
          at presentation and MRI burden, so genotype alone does not resolve the question.

          '
      selected_evidence:
        snippet: The dilemma is when to start Enzyme Replacement Therapy (ERT) in patients without any
          clinical sign of the disease, considering its important benefits in terms of loss of muscle
          but also its very high cost, risk of side effects, and long-term immunogenicity.
        supports: SUPPORT
