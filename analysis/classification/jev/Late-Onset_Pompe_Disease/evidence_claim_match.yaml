  2c0edb079cd083845179fce63a4af96485139bd871a27c1c9e28951640b04061:
    claim:
      about:
        disease:
          name: Late-Onset Pompe Disease
          disease_term:
            preferred_term: Late-onset Pompe disease
            term:
              id: MONDO:0018485
              label: glycogen storage disease due to acid maltase deficiency, late-onset
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Leaky GAA Splicing and Partial Residual Enzyme Activity
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The LOPD-defining lesion is partial rather than complete loss of acid alpha-glucosidase.
          The commonest LOPD allele, c.-32-13T>G (IVS1), sits in intron 1 and weakens the splice acceptor
          of GAA exon 2. Most transcripts from that allele are aberrantly spliced (partial or complete
          exon 2 skipping), but a low level of correctly spliced, fully functional transcript escapes.
          That residual activity - conventionally quoted as roughly 1-30% of normal, though see the caveat
          in the biochemical section and in notes - is what shifts the phenotype from infantile to late
          onset. In the great majority of LOPD patients the leaky allele is carried in trans with a second,
          more deleterious pathogenic variant, so the leaky allele is the one setting how much enzyme
          the patient makes.

          '
        gene:
          preferred_term: GAA
          description: Acid alpha-glucosidase, the lysosomal enzyme that hydrolyzes alpha-1,4 and alpha-1,6
            glycosidic bonds of glycogen.
          modifier: DECREASED
          term:
            id: hgnc:4065
            label: GAA
        molecular_functions:
        - preferred_term: acid alpha-glucosidase activity
          modifier: DECREASED
          term:
            id: GO:0004558
            label: alpha-1,4-glucosidase activity
        biological_processes:
        - preferred_term: GAA pre-mRNA splicing at the exon 2 acceptor
          modifier: DECREASED
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
        genetic_context:
          gene:
            preferred_term: GAA
            term:
              id: hgnc:4065
              label: GAA
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Compound heterozygosity for the leaky c.-32-13T>G intron-1 splice variant and a
            second, more deleterious pathogenic GAA variant.
      selected_evidence:
        snippet: which weakens the splice acceptor of GAA exon 2 and induces partial and complete exon
          2 skipping. It also allows a low level of leaky wild-type splicing, leading to a childhood/adult
          phenotype.
        supports: SUPPORT
