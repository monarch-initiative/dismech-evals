            term:
              id: MONDO:0018485
              label: glycogen storage disease due to acid maltase deficiency, late-onset
        context: []
      assertion_type: Genetic
      assertion:
        name: GAA leaky splice-site variants
        gene_term:
          preferred_term: GAA
          term:
            id: hgnc:4065
            label: GAA
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'The LOPD genotype is defined by retention of at least one allele that still produces some
          functional enzyme. c.-32-13T>G is by far the commonest such allele in populations of European
          ancestry, but it is not the only one: several other splice-site variants are similarly associated
          with the late-onset phenotype, whereas two non-splice-site (typically null) alleles produce
          infantile disease.

          '
        variants:
        - name: c.-32-13T>G (IVS1)
          description: 'Intron-1 variant 13 nucleotides upstream of GAA exon 2. It weakens the exon 2
            splice acceptor, causing partial and complete exon 2 skipping, while permitting a low level
            of correctly spliced wild-type transcript - the "leaky" behaviour that yields residual enzyme
            and late-onset disease.

            '
          clinical_significance: PATHOGENIC
          regulatory_category: mLOE
      selected_evidence:
        snippet: Of the definite LOPD participants, 8 (89%) were Caucasian and were heterozygous for the
          common leaky (IVS1) splice site mutation in the GAA gene (c -32-13T>G), with a second mutation
          that was previously confirmed to be pathogenic.
        supports: SUPPORT
    origin:
