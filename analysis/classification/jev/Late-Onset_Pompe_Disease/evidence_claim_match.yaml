        description: 'Newborn screening measures GAA activity in dried blood spots and is designed to
          catch infantile-onset disease early enough for enzyme replacement therapy to work. Its consequence
          for LOPD is a distinct and growing group: children identified pre-symptomatically who cannot
          be told when, or whether, they will become symptomatic. Current screening cannot separate infantile-onset
          from late-onset disease, so these are patients in waiting requiring long-term monitoring.

          '
        diagnosis_term:
          preferred_term: newborn screening for Pompe disease
          term:
            id: NCIT:C81178
            label: Newborn Screening
        results: An out-of-range newborn screen requires confirmatory enzyme and molecular testing; a
          confirmed child without infantile-onset features enters long-term surveillance rather than immediate
          treatment.
      selected_evidence:
        snippet: Newborn screening (NBS) for Pompe disease is possible by measuring GAA activity in dried
          blood spots with different methods (tandem-mass spectrometry, fluorometry, microfluidics)
