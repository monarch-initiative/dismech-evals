          term:
            id: NCIT:C38056
            label: Electromyography
        results: Paraspinal electrophysiological myotonia in the absence of clinical myotonia strengthens
          the case for GAA testing; a normal study does not exclude LOPD.
      selected_evidence:
        snippet: EMG and peripheral nerve conduction studies are optional and may be considered at diagnosis
          as a supportive element.
        supports: SUPPORT
