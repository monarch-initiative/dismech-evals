        mechanism_confidence: ESTABLISHED
        description: 'Residual GAA activity is exhausted in smooth muscle as well as in skeletal muscle.
          Autopsy of a woman with LOPD demonstrated lysosomal glycogen inside vascular smooth muscle cells
          by transmission electron microscopy, alongside involvement of the bladder, intestine, and esophagus.
          This is a distinct cellular compartment from the skeletal and respiratory myofiber storage that
          dominates the LOPD clinical picture, and it is the substrate for the disease''s two extra-muscular
          arms: the dilative arteriopathy of large arteries, and the gastrointestinal and genitourinary
          symptoms that patients report independently of limb weakness. Smooth-muscle storage is the reason
          LOPD is a systemic lysosomal disease rather than a pure myopathy.

          '
        cell_types:
