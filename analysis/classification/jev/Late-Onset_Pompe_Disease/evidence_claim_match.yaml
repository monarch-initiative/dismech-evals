            description: 'Progressive dilatation, ectasia and aneurysm formation affecting the ascending
              thoracic aorta and the intracranial arteries, with the vertebrobasilar system most often
              involved, together with a small-vessel component that shows up as white matter hyperintensity
              and cerebellar and brainstem microbleeds. It is the second organ system LOPD damages after
              muscle, and it is largely uncoupled from myopathy severity: patients are identified on surveillance
              imaging rather than by limb weakness, and enzyme replacement therapy did not change vessel
              calibre over a year of follow-up in the one series that looked. The node is recorded as
              PROVISIONAL rather than ESTABLISHED because the causal step from smooth-muscle glycogen
              to wall weakness is inferred rather than demonstrated - one aortic specimen showed connective-tissue
              changes resembling a fibrillinopathy rather than a storage lesion, and the Gaa-/- mouse
              accumulates little aortic glycogen, which led that study''s authors to decline to attribute
              aortic wall weakness to glycogen accumulation (see animal_models).

