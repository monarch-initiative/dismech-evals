      - /disease_term
    evidence_metadata:
      reference: PMID:17008131
      reference_title: Autophagy and mistargeting of therapeutic enzyme in skeletal muscle in Pompe disease.
      evidence_source: MODEL_ORGANISM
      explanation: The authors present the mechanism as an explanation that "may" account for the therapeutic
        shortfall, which is the translational uncertainty recorded here.
