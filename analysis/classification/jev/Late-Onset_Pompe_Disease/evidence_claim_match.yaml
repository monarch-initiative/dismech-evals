      assertion:
        name: Recognition of the LOPD red-flag presentation
        description: 'Because LOPD presents insidiously with non-specific complaints, the rate-limiting
          step is clinical suspicion rather than any assay. Unexplained proximal or axial weakness, restrictive
          respiratory insufficiency, hyperCKemia, and exercise intolerance are the agreed red flags that
          should trigger GAA testing; reduced pulmonary function specifically in the supine position is
          the LOPD-typical modifier. Normal CK, EMG, or muscle biopsy do not exclude the diagnosis.

          '
        diagnosis_term:
          preferred_term: LOPD red-flag case finding
          term:
            id: NCIT:C15419
            label: Disease Screening
        results: Any of these red flags in an adult or older child without a better explanation should
          prompt a dried blood spot GAA assay rather than further undirected neuromuscular workup.
      selected_evidence:
        snippet: proximal limb girdle weakness and/or axial muscle weakness with or without reduced pulmonary
          function, in particular when in supine position should be considered as red flags for LOPD patients
        supports: SUPPORT
