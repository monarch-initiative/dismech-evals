        context: []
      assertion_type: Diagnosis
      assertion:
        name: Skeletal muscle MRI for disease burden
        description: 'Skeletal muscle MRI documents muscle trophism and fatty degeneration and is used
          to map disease burden rather than to make the diagnosis. Whole-body protocols cover muscle groups
          a targeted study would miss, and quantitative muscle MRI is offered to late-onset patients as
          an addition to annual assessment. The supine position required for imaging is itself a hazard
          in patients with diaphragm weakness.

          '
        diagnosis_term:
          preferred_term: skeletal muscle magnetic resonance imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        results: A characteristic pattern of fatty replacement in paraspinal, pelvic, and thigh muscle
          supports the diagnosis and quantifies burden for follow-up.
        notes: MetabERN cautions that the supine position needed for MRI may aggravate respiratory failure,
          which is a real constraint in exactly the LOPD patients whose burden most needs mapping.
      selected_evidence:
        snippet: Whole-body MRI protocols are more inclusive than standard MRI protocols focusing on specific
          anatomical regions (e.g., paraspinal muscles, tongues, pelvis, thigh), enabling evaluation of
          relevant muscle groups beyond the pelvis and proximal lower extremities
        supports: SUPPORT
