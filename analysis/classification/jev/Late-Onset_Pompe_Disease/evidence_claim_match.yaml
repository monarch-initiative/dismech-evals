          expression is dilatation of the ascending thoracic aorta. It is distinct from the hypertrophic
          cardiomyopathy of infantile-onset disease - the LOPD myocardium is typically spared - and it
          is specific enough to LOPD that GeneReviews adds aortic assessment to the annual echocardiogram
          for this group. Its mechanism is now curated on this entry: it is the aortic expression of the
          dilative arteriopathy node, downstream of lysosomal glycogen storage in vascular smooth muscle.
          That causal step is recorded as PROVISIONAL rather than established - see the arteriopathy node
          and the Gaa-/- mouse link for the evidence that qualifies it.

          '
        phenotype_term:
          preferred_term: Dilatation of the ascending thoracic aorta
