        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autophagic Mistargeting of Endocytosed Recombinant Enzyme
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'Skeletal myofibers in Pompe disease develop large autophagic areas alongside glycogen-filled
          lysosomes. These areas trap endocytosed recombinant human GAA in a partially processed form
          so that it never reaches the lysosome, which is a mechanistic explanation for why enzyme replacement
          therapy is far more effective in cardiac than in skeletal muscle and why it slows rather than
          arrests the LOPD myopathy. Because LOPD is a decades-long disease treated for decades, this
          therapeutic ceiling is a defining clinical problem of the late-onset form.

          '
        cell_types:
        - preferred_term: Skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: autophagy
          modifier: INCREASED
          term:
            id: GO:0006914
            label: autophagy
        - preferred_term: endosomal transport of endocytosed enzyme
          modifier: DECREASED
          term:
            id: GO:0016197
            label: endosomal transport
      selected_evidence:
        snippet: The therapy, which relies on receptor-mediated endocytosis of recombinant human GAA (rhGAA),
          appears to be effective in cardiac muscle, but less so in skeletal muscle.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
