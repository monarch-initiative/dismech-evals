        context: []
      assertion_type: Diagnosis
      assertion:
        name: Dried blood spot GAA activity as first-line screen
        description: 'A GAA enzyme assay on a dried blood spot is the first-line test: cheap, minimally
          invasive, and fast. It is explicitly a screening test and is never sufficient for a definitive
          diagnosis. Modern assays include acarbose to competitively inhibit maltase-glucoamylase, which
          otherwise confounds activity measured at acidic pH; poor spotting, humidity, and heat during
          shipping are recognized preanalytical causes of spurious results.

          '
        diagnosis_term:
          preferred_term: dried blood spot acid alpha-glucosidase assay
          term:
            id: NCIT:C15419
            label: Disease Screening
        results: Reduced GAA activity on dried blood spot is a positive screen that must be referred on
          for confirmation; a normal result in a patient with strong red flags does not close the question.
      selected_evidence:
        snippet: A GAA enzyme assay in dried blood spot assay can be used as a first line test. However,
          this test is not sufficient for a definitive diagnosis.
        supports: SUPPORT
