  d236d155d9a05367845cca3f60ce9df6445e968652214307e075c3ac4c1c0210:
    claim:
      about:
        disease:
          name: Late-Onset Pompe Disease
          disease_term:
            preferred_term: Late-onset Pompe disease
            term:
              id: MONDO:0018485
              label: glycogen storage disease due to acid maltase deficiency, late-onset
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Lipofuscin-loaded autolysosomes in skeletal muscle
        description: 'Muscle biopsies from adult-onset, juvenile-onset, and newborn-screening-detected
          LOPD patients on enzyme replacement therapy contain areas of autophagic buildup filled with
          large autofluorescent inclusions identified as lipofuscin. These lipofuscin-loaded lysosomes
          and autolysosomes are the dominant pathology that persists in myofibers after enzyme replacement
          therapy, and are proposed to aggravate the lysosomal and autophagic abnormalities that caused
          them.

          '
        diagnostic: false
      selected_evidence:
        snippet: 'Late-onset Pompe disease (LOPD) is a debilitating progressive muscle disorder that can
          occur anytime from early childhood to late adulthood. ... In this study, we examined the clinical
          status and muscle pathology of 22 LOPD patients and one atypical infantile patient on ERT to
          understand the reasons for muscle resistance to ERT. ... The patients were divided into three
          groups for analysis, based on the age of onset and diagnosis: adult-onset patients, juvenile-onset
          patients, and those identified through newborn screening (NBS). The areas of autophagic buildup
          found in patients'' biopsies of all three groups, contained large autofluorescent inclusions
          which we show are made of lipofuscin, an indigestible intralysosomal material typically associated
          with ageing. These inclusions, analysed by staining, spectral analysis, time-resolved Fluorescence
          Lifetime Imaging (FLIM), and Second Harmonic Generation (SHG) imaging, were the major pathology
          remaining in many fibers after ERT. ... The muscle biopsy, in spite of its shortcomings, allowed
          us to recognize an underreported, ERT-resistant pathology in LOPD; numerous lysosomes and autolysosomes
          loaded with lipofuscin appear to be a hallmark of LOPD skeletal muscle. Lipofuscin accumulation
          - a result of inefficient lysosomal degradation - may in turn exacerbate both lysosomal and
          autophagic abnormalities.'
        supports: SUPPORT
    origin:
      assertion_path: /histopathology/0
      evidence_path: /histopathology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24383498
      reference_title: 'The value of muscle biopsies in Pompe disease: identifying lipofuscin inclusions
        in juvenile- and adult-onset patients.'
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the LOPD study, retains its atypical infantile comparator and age/diagnosis
        groups, and connects persistent inclusions to lipofuscin-loaded lysosomes/autolysosomes. The final
        possible feedback mechanism retains the source's may qualification.
