  e7bfe72767e0880892976b80d38ff5e0879f8774c6623ed8dc3b935f4824f73e:
    claim:
      about:
        disease:
          name: Late Complement Component Deficiency
          disease_term:
            preferred_term: immunodeficiency due to a late component of complement deficiency
            term:
              id: MONDO:0015700
              label: immunodeficiency due to a late component of complement deficiency
        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum CH50 (total classical pathway haemolytic activity)
        presence: DECREASED
        notes: 'CH50 is the screening test that finds this disease. Because it measures lysis — the whole
          classical cascade through to the membrane attack complex — a terminal-component defect abolishes
          it even though every classical component upstream of C5 is intact. That is the diagnostic signature
          of the terminal arm and the reason CH50 is ordered after a first invasive neisserial infection.

          Two exceptions, and both matter at the bedside because each one lets a real case slip past a
          normal-looking result. Subtotal deficiency of C5, C6 or C7 leaves a low but detectable CH50,
          as the cited cohort reports. And C9 deficiency is a partial exception in its own right: see
          the C9 subtype of this entry, which records that some cases retain residual haemolytic activity
          relative to the other terminal component defects, because C9 is the last component to polymerise
          and C5b-8 has limited lytic capacity without it. A detectable CH50 therefore does not exclude
          terminal complement deficiency, and does not exclude C9 deficiency in particular.'
      selected_evidence:
        snippet: Terminal pathway deﬁciency (TPD) was deﬁned by undetectable CH50 and AP50 activities
          (below 10% of normal values).
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/0
      context_paths:
