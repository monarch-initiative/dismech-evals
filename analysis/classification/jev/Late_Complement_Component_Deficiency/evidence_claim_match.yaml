            term:
              id: MONDO:0015700
              label: immunodeficiency due to a late component of complement deficiency
        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum AP50 (alternative pathway haemolytic activity)
        presence: DECREASED
        notes: 'AP50 is abnormal alongside CH50 in terminal deficiency, and the pairing is what localizes
          the lesion. The two assays share only the terminal components, so simultaneous loss of both
          places the defect at or below C5, whereas an isolated CH50 fall with preserved AP50 indicates
          an early classical defect such as C2 deficiency.

          Scope limit. The ESID guideline cited below notes that few standardized complement tests are
          available beyond C3 and C4 levels, so a section built on CH50 and AP50 covers the assays that
          localize the lesion rather than the full diagnostic workup; component-level quantitation and
          genetic confirmation follow, and are curated in this entry''s `genetic:` section.'
      selected_evidence:
        snippet: Terminal pathway deﬁciency (TPD) was deﬁned by undetectable CH50 and AP50 activities
          (below 10% of normal values).
        supports: SUPPORT
