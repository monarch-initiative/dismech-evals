          term:
            id: hgnc:1353
            label: C8B
        - preferred_term: C9
          term:
            id: hgnc:1358
            label: C9
      selected_evidence:
        snippet: Patients with terminal pathway C-deficiency have a 1,000- to 10,000-fold-higher risk
