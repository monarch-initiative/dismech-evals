              term:
                id: hgnc:1353
                label: C8B
            - preferred_term: C9
              term:
                id: hgnc:1358
                label: C9
            notes: 'Each of these genes enters the assembly sequence at a different point - C5 as the
              convertase substrate, C6 and C7 binding the resulting C5b, C8 next, and C9 polymerising
              into the pore - and this node''s description records which step each occupies. They are
              nonetheless bound to one node rather than to six per-component nodes, because the next step
              in this entry''s pathograph is the same whichever component is missing: no MAC pore forms,
