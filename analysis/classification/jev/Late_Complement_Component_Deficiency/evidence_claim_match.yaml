  ee30a1c13a4fbdb01a4ad60fab36f4252da950fedd83149c34b7fe6d784e19ea:
    claim:
      about:
        disease:
          name: Late Complement Component Deficiency
          disease_term:
            preferred_term: immunodeficiency due to a late component of complement deficiency
            term:
              id: MONDO:0015700
              label: immunodeficiency due to a late component of complement deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Membrane Attack Complex Assembly
        description: The terminal pathway is initiated when C5 convertase cleaves C5 into C5a and C5b;
          C5b sequentially binds C6 and C7, then C8, and finally multiple C9 molecules polymerize to form
          the lytic membrane attack complex (MAC; C5b-9) pore. Deficiency of any terminal component prevents
          MAC assembly, producing absent or markedly reduced classical (CH50) and alternative (AH50) pathway
          hemolytic activity.
        genes:
        - preferred_term: C5
          term:
            id: hgnc:1331
            label: C5
        - preferred_term: C6
          term:
            id: hgnc:1339
            label: C6
        - preferred_term: C7
          term:
            id: hgnc:1346
            label: C7
        - preferred_term: C8A
          term:
            id: hgnc:1352
            label: C8A
        - preferred_term: C8B
          term:
            id: hgnc:1353
            label: C8B
        - preferred_term: C9
          term:
            id: hgnc:1358
            label: C9
        notes: 'Each of these genes enters the assembly sequence at a different point - C5 as the convertase
          substrate, C6 and C7 binding the resulting C5b, C8 next, and C9 polymerising into the pore -
          and this node''s description records which step each occupies. They are nonetheless bound to
          one node rather than to six per-component nodes, because the next step in this entry''s pathograph
          is the same whichever component is missing: no MAC pore forms, and serum loses bactericidal
          activity against Neisseria. Splitting would produce six nodes with one shared successor and
          no differentiating downstream claim. The one place where the component does change the downstream
          picture is C5, whose loss also abolishes C5a generation; that is stated in the C5 subtype row.'
        biological_processes:
        - preferred_term: Activation of Membrane Attack Complex
          term:
            id: GO:0001905
            label: activation of membrane attack complex
          modifier: DECREASED
        - preferred_term: Complement Activation
          term:
            id: GO:0006956
            label: complement activation
          modifier: DECREASED
      selected_evidence:
        snippet: Disseminated Neisseria infections result from terminal pathway defects (i.e., C5, C6,
          C7, C8, and C9).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39294906
