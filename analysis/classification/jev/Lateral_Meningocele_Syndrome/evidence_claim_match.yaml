      assertion_type: AnimalModel
      assertion:
        name: Notch3 6691-TAATGA knock-in mouse
        species: Mus musculus
        genotype: Notch3 tm1.1Ecan (em1Ecan) heterozygous, tandem stop codon at bases 6691-6696 upstream
          of the PEST domain
        publication: PMID:30042232
        description: A CRISPR/Cas9 knock-in that truncates Notch3 upstream of the PEST domain, reproducing
          the LMS variant class. Heterozygous mice have cancellous and cortical osteopenia with increased
          osteoclastogenesis and RANKL expression, but no neurological phenotype or meningoceles. The
          osteopenia is reversed by an anti-Notch3 negative regulatory region antibody and the cortical
          osteopenia is ameliorated by a mutation-specific Notch3 antisense oligonucleotide.
        modeled_mechanisms:
        - target: Increased Osteoclastogenesis and Bone Resorption
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The model shows RANKL-driven osteoclastogenesis and osteopenia.
          limitations: Human bone phenotype data in LMS are limited to case reports, so how faithfully
            mouse osteopenia represents the human skeletal disease is uncertain; female mice recover bone
            mass with maturation.
        - target: Dural Ectasia and Lateral Meningocele Formation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: No neurological alterations or meningoceles were reported in the model.
          limitations: The defining human lesion is absent, so the model cannot be used to study meningocele
            formation or the connective tissue phenotype.
      selected_evidence:
        snippet: In conclusion, a Notch3 ASO that downregulates Notch3 mutant expression specifically
          ameliorates the cortical osteopenia in Notch3em1Ecan mice.
        supports: SUPPORT
