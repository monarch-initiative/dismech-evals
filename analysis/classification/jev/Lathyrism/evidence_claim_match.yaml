        description: Excitotoxic calcium injury and oxidative stress drive degeneration of upper motor
          neurons, including the large Betz cells of the motor cortex, and their corticospinal (pyramidal)
          axons, with relative sparing of lower motor neurons and sensory pathways. The resulting upper
          motor neuron syndrome manifests as spastic paraparesis. In rat models of neurolathyrism, motor
          neurons are depleted in lumbosacral spinal segments. Once established, the deficit is permanent.
        cell_types:
        - preferred_term: Betz cell
          term:
            id: CL:0008049
