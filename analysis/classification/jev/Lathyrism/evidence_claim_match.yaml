            name: Neurolathyrism
            display_name: Neurolathyrism
            description: The principal human form, caused by chronic dietary exposure to the excitotoxic
              amino acid beta-ODAP in grass pea (Lathyrus sativus). Produces a permanent spastic paraparesis
              from selective degeneration of upper motor neurons and the corticospinal tracts, with characteristic
              sparing of sensory systems. Onset is typically abrupt, often after a period of heavy grass
              pea consumption during famine, and predominantly affects males aged 15-30. Disability is
              clinically graded in stages (I-IV), from walking-stick dependence to a bedridden, contracted
              state.
          role: subtype
      assertion_type: Prevalence
      assertion:
        subtype: Neurolathyrism
