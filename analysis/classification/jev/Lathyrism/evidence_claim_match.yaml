        context: []
      assertion_type: Environmental
      assertion:
        name: Grass pea (Lathyrus sativus) overconsumption
        description: Sustained heavy dietary reliance on grass pea — typically over weeks to months during
          drought and famine when other crops fail — is the cause of neurolathyrism. Risk rises with feeding
