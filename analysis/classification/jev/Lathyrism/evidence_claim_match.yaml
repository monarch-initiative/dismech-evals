        rate_per_100000: 6600.0
        percentage: 6.6
        notes: Community-based cross-sectional survey; 56 of 470 participants (11.9%) reported neurolathyrism,
          with an estimated population-level prevalence of 6.6%.
      selected_evidence:
        snippet: 56 (11.9%)
        supports: SUPPORT
