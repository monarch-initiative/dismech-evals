      assertion_type: Pathophysiology
      assertion:
        name: Ferrochelatase Inhibition
        conforms_to: heme_biosynthesis_porphyria#Heme Biosynthesis Enzymatic Block
        description: Lead also inhibits ferrochelatase, the terminal enzyme of heme biosynthesis, which
          normally inserts iron into protoporphyrin IX. The reaction is carried out in the mitochondria
          of the nucleated erythroid precursors, not in the mature anucleate erythrocyte; blocking it
          leaves protoporphyrin IX to chelate zinc into the vacant iron site, and the resulting zinc protoporphyrin
          persists in the circulating red cells the entry measures as its biomarker. This is a second,
          independent instance of the module's enzymatic-block lesion, acting at the terminal step of
          the pathway rather than at ALAD.
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
        biological_processes:
        - preferred_term: heme biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0006783
            label: heme biosynthetic process
        - preferred_term: porphyrin-containing compound metabolic process
          modifier: ABNORMAL
          term:
            id: GO:0006778
            label: porphyrin-containing compound metabolic process
      selected_evidence:
        snippet: Delta-aminolevulinate dehydratase, coproporphyrin oxidase, and ferrochelatase activities
          are reduced; delta-aminolevulinate synthetase activity is increased.
        supports: SUPPORT
