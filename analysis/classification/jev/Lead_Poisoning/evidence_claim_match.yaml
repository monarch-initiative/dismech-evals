              id: MONDO:0018019
              label: lead poisoning
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Arsenic Poisoning
        description: Arsenic poisoning can overlap with lead poisoning through gastrointestinal symptoms
          and neuropathy, but chronic arsenic exposure more strongly features characteristic skin findings
          and carcinogenic sequelae.
        distinguishing_features:
        - Chronic arsenic exposure causes hyperpigmentation and palmoplantar keratoses
        - Arsenic exposure is strongly associated with skin, lung, and bladder cancer
        - Lead poisoning more characteristically shows basophilic stippling, lead-line gingival changes,
          and ALAD inhibition
      selected_evidence:
        snippet: We describe a 47-year-old patient with chronic anaemia with basophilic stippling of erythrocytes,
          recurrent abdominal colics, discoloration of gums, sensitive polyneuropathy to the four limbs,
          hyperuricaemia, hepatosteatosis with raised transaminases, and a long ignored history of lead
          exposure in a battery recycling plant.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/1
      context_paths:
