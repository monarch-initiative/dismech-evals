  da55823ffd8df2dfb430f0d2dfce4d022b64858fd268ca7d6b9c4b9cb72a7eda:
    claim:
      about:
        disease:
          name: Lead Poisoning
          disease_term:
            preferred_term: lead poisoning
            term:
              id: MONDO:0018019
              label: lead poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lead_neurovisceral_mechanism_gap
        prompt: Is lead colic actually caused by ALA-mediated neurovisceral toxicity, or is that mechanism
          carried over from the inherited porphyrias by analogy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#ALA-Mediated Neurovisceral Neurotoxicity
        rationale: 'The three edges out of this node -- to Abdominal pain, Constipation, and Peripheral
          neuropathy -- all rest on a single sentence from an ALAD-deficiency porphyria case report stating
          that lead produces the same biochemical and neurological picture. That sentence is an analogy,
          not a measurement: no source found for this entry demonstrates in lead-exposed patients that
          circulating ALA is what produces the colic, and the classic presentation has been attributed
          to precursor neurotoxicity for decades largely on the strength of the porphyria resemblance.
          The node is modeled with INDIRECT directness and INDIRECT_UNKNOWN_INTERMEDIATES edges for this
          reason. Lead also acts on the same neurons by calcium mimicry, which this entry models separately,
          so the two routes are not distinguishable from the evidence currently cited. A study correlating
          ALA levels with colic severity in lead-exposed patients, independent of blood lead, would settle
          it.'
      selected_evidence:
        snippet: The same biochemical abnormalities and neurological symptoms are seen with ALAD inhibition
          by lead poisoning and by succinylacetone in hereditary tyrosinemia type 2.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.3389/fgene.2022.867856
      reference_title: 'Case Report: Lack of Response to Givosiran in a Case of ALAD Porphyria'
      evidence_source: OTHER
      explanation: 'The strongest basis available for the node, and the reason the gap is recorded: it
        establishes the resemblance between lead and ALAD-deficiency porphyria without showing that ALA
        is the mediator in lead poisoning.'
