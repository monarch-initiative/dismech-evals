      assertion_type: DifferentialDiagnosis
      assertion:
        name: Arsenic Poisoning
        description: Arsenic poisoning can overlap with lead poisoning through gastrointestinal symptoms
          and neuropathy, but chronic arsenic exposure more strongly features characteristic skin findings
          and carcinogenic sequelae.
        distinguishing_features:
        - Chronic arsenic exposure causes hyperpigmentation and palmoplantar keratoses
        - Arsenic exposure is strongly associated with skin, lung, and bladder cancer
        - Lead poisoning more characteristically shows basophilic stippling, lead-line gingival changes,
          and ALAD inhibition
      selected_evidence:
        snippet: It is proven fact that uptake of inorganic As for a long period can lead to chronic As
          poisoning and a variety of adverse health effects such as skin, lung and bladder cancer, in
          addition to cardiovascular diseases, diabetes and gastrointestinal symptoms.
        supports: SUPPORT
