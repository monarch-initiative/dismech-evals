        description: Lead inhibits delta-aminolevulinic acid dehydratase (ALAD), a zinc-dependent heme
          biosynthetic enzyme. This is an early and sensitive biochemical lesion of lead exposure and
          contributes to defective heme production. ALAD is cytosolic, so the block is both present and
          routinely assayed in the mature erythrocyte; the erythroid precursors are listed alongside because
          that is where the reduced flux actually costs the cell its heme.
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
        biological_processes:
        - preferred_term: heme biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0006783
            label: heme biosynthetic process
      selected_evidence:
        snippet: ALAD is a zinc metalloenzyme whose inhibition by lead is the first and most sensitive
          indicator of lead exposure and whose decreased activity has been implicated in the pathogenesis
          of lead poisoning.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
