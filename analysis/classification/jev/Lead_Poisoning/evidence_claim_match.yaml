            term:
              id: MONDO:0018019
              label: lead poisoning
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cadmium Poisoning
        description: Cadmium poisoning overlaps with lead toxicity through chronic occupational exposure
          and proximal tubular nephrotoxicity, but the renal phenotype and associated laboratory findings
          differ.
        disease_term:
          preferred_term: cadmium poisoning
          term:
            id: MONDO:0043523
            label: cadmium poisoning
        distinguishing_features:
        - Cadmium causes Fanconi syndrome with low-molecular-weight proteinuria and beta2-microglobulinuria
        - Lead nephropathy instead is associated with hyperuricemia, gout, and hypertension
        - Proximal tubule nuclear inclusion bodies are characteristic of early lead nephropathy
      selected_evidence:
        snippet: Cadmium in sufficient cumulative dosage leads to the production of the Fanconi syndrome,
          a generalized proximal tubular reabsorptive defect thought to be related to inhibition of both
          ATP production and Na-K-ATPase activity. On the other hand, lead accumulation in the proximal
          tubule leads to hyperuricaemia and gout, presumably by inhibiting uric acid secretion, and diminished
          glomerular filteration rate (GFR).
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
