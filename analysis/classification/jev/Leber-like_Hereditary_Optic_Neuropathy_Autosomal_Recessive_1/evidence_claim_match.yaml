            term:
              id: MONDO:0958183
              label: Leber-like hereditary optic neuropathy, autosomal recessive 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: arlhon_sex_dependent_incomplete_penetrance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a recessive disease with a defined biallelic genotype show incomplete penetrance
          and a strong male predominance, and what is the modifier?
        attaches_to:
        - pathophysiology#DNAJC30 Loss of Function
        - pathophysiology#Retinal Ganglion Cell Degeneration
        rationale: 'This is the entity''s most conspicuous anomaly. Incomplete penetrance and a sex bias
          are expected in the mitochondrial form and are among the oldest puzzles in LHON, but they are
          not what a biallelic recessive genotype normally produces. Here they are not merely present
          but more extreme than in the mitochondrial form: roughly 97 percent of homozygous males but
          only 43 percent of homozygous females expressed a phenotype in the founding cohort, a ten to
          one ratio of affected males to affected females against five to one in mtLHON. Asymptomatic
          homozygous carriers exist and have been confirmed in a second cohort.

          Three explanations were tested and eliminated in the founding study. The amount of DNAJC30 protein
          and message does not differ by sex, so it is not a dosage effect on the chaperone itself. Whole
          exome data from patients carried no rare biallelic variants in other complex I subunit or assembly
          genes, so a second nuclear locus was not detected. No rare mtDNA variants were found either.
          The one positive association is with mitochondrial haplogroup J, which was over-represented
          among arLHON patients relative to the European background, mirroring its role in the mitochondrial
          form; but that is a partial and correlative finding on small numbers, not a mechanism.

          The gnomAD allele frequency of the founder variant is equal in males and females, which is the
          observation that makes the sex bias a downstream phenomenon rather than an ascertainment artefact.
          So the modifier acts somewhere between having the genotype and losing vision, and it is unidentified.
          Note also that the penetrance figures are acknowledged overestimates, drawn from a small number
          of pedigrees with few unaffected siblings of known carrier status.'
        proposed_experiments:
        - experiment_id: arlhon_biobank_penetrance
          name: Population-based penetrance estimate from unselected founder-population biobank genotypes
          description: Identify p.(Tyr51Cys) homozygotes in an unselected Eastern European biobank rather
            than through affected probands, and determine visual status and age. This is the design that
            removes the ascertainment bias the founding authors flag, and it is the only way to get a
            penetrance figure that is not an overestimate.
        - experiment_id: arlhon_rgc_modifier_assay
          name: Hormonal and oxidative-stress modifier testing in patient-derived retinal ganglion cells
          description: Differentiate retinal ganglion cells from patient and control induced pluripotent
            stem cells and test whether oestrogen exposure, or graded oxidative challenge, shifts the
            complex I N module turnover defect or cell survival. A sex-hormone effect acting downstream
            of the chaperone would fit both the equal allele frequency between sexes and the absence of
            a sex difference in DNAJC30 expression.
      selected_evidence:
        snippet: we measured DNAJC30 expression on the RNA and protein level in over 75 and 100 controls,
          respectively; however, we did not detect a significant difference
        supports: SUPPORT
