      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mitochondrial (maternally inherited) Leber hereditary optic neuropathy
        description: Clinically the same disease. Subacute painless bilateral central visual loss in a
          young adult, incomplete penetrance, male predominance, response to idebenone. It is caused instead
          by one of three mitochondrial DNA point mutations in complex I subunit genes, accounts for roughly
          90 percent of LHON, and was for a century the only recognised form.
        distinguishing_features:
        - Family history. Maternal transmission points to the mitochondrial form; an affected sibling
          with unaffected parents, or no family history at all, points here.
        - Testing. Full mitochondrial DNA sequencing separates them, and because DNAJC30 has a single
          exon both can be sequenced in parallel rather than in sequence.
        - Onset and outcome. Onset in arLHON is earlier and more tightly clustered, bilateral onset is
          more common, and both spontaneous and treated recovery rates are higher.
        - Mechanism, in a research setting. The complex I N module turnover defect is present in arLHON
          cells and absent in mitochondrial LHON cells.
      selected_evidence:
        snippet: This defect was not found in mtLHON (n = 3) and is therefore specific to arLHON
        supports: SUPPORT
