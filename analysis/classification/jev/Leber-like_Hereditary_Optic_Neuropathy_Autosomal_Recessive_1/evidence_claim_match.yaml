          had a Leigh-like course with earlier onset than the missense cohort. It is mechanistically the
          most informative allele in the gene: it abolishes the protein outright in cells, which is what
          establishes loss of function rather than a dominant-negative or aberrant activity as the disease
          mechanism.'
        gene:
          preferred_term: DNAJC30
          term:
            id: hgnc:16410
            label: DNAJC30
        clinical_significance: PATHOGENIC
        type: nonsense_variant
      selected_evidence:
        snippet: Exome sequencing analysis of his peripheral blood sample revealed a homozygous nonsense
          germline variant, c.24G>A (p.W8X) in the DNAJC30 gene, proven to result in a complete loss of
          DNAJC30 protein expression in cells.
        supports: SUPPORT
