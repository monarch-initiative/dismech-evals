        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Nadir and spontaneous recovery
        notes: This phase is what most distinguishes arLHON prognostically, and it is partly independent
          of treatment. In the Central European cohort only one of 35 patients received idebenone, and
          he had already recovered before starting it; clinically relevant recovery nonetheless occurred
          in 45 percent, at a median of 19 months from onset. Median visual acuity improved from 1.3 logMAR
          at nadir to 0.5 logMAR at last visit. The founding cohort likewise reported recovery in 50 percent
          of untreated eyes. Recovery is therefore a feature of the natural history and not solely a drug
          effect, which is why the treated figures under Idebenone should not be read as the treatment's
          attributable benefit.
      selected_evidence:
        snippet: Only one patient received idebenone over a period of 6 months. He developed a CRR even
          before the start of idebenone therapy.
        supports: SUPPORT
