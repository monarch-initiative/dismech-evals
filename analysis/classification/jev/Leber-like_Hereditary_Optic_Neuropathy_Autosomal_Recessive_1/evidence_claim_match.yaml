  f606d212392b245ba1cb3b6d2c3061556003b7220cd2d0b50eb201f82dae4c27:
    claim:
      about:
        disease:
          name: Leber-like Hereditary Optic Neuropathy, Autosomal Recessive 1
          disease_term:
            preferred_term: Leber-like hereditary optic neuropathy, autosomal recessive 1
            term:
              id: MONDO:0958183
              label: Leber-like hereditary optic neuropathy, autosomal recessive 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: arlhon_leigh_branch_determinant
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What decides whether a patient with biallelic DNAJC30 variants develops an isolated optic
          neuropathy or Leigh syndrome, and does that also explain why idebenone helps the first and not
          the second?
        attaches_to:
        - pathophysiology#Subacute Necrotizing Encephalopathy of Basal Ganglia and Brainstem
        - pathophysiology#Reduced Complex I-Dependent Respiration and ATP Output
        rationale: 'The same p.(Tyr51Cys) homozygous genotype produces isolated adult-onset optic neuropathy
          in most patients and childhood Leigh syndrome in a few, and the two branches respond to treatment
          differently. The leading hypothesis is digenic: a heterozygous variant in another complex I
          gene supplies a second hit that tips the phenotype. That hypothesis has direct support in one
          report, where two siblings with the Leigh presentation carried a novel heterozygous NDUFS8 variant
          in addition to their DNAJC30 alleles.

          The evidence against treating it as settled is equally direct. In the one DNAJC30 Leigh patient
          given idebenone, reanalysis of genome sequencing and mtDNA found no second variant in any gene
          linked to Leigh syndrome, LHON or the respiratory chain complexes, and the drug failed. The
          authors offer two alternatives that the data cannot distinguish: an undetected second hit in
          a gene not yet associated with mitochondrial disease or missed because filtering targets rare
          variants, or a genuine difference in cellular biology between the two phenotypes that has nothing
          to do with a second locus.

          Truncating alleles complicate the picture further. Both patients homozygous for the p.(Trp8*)
          nonsense variant had a Leigh-like course with markedly earlier onset than the missense cohort,
          which suggests residual chaperone function may matter independently of any second gene. Whether
          allele severity and a second hit are competing or additive explanations is untested.'
        proposed_experiments:
        - experiment_id: arlhon_leigh_second_hit_search
          name: Systematic second-hit search across all DNAJC30 Leigh cases
          description: Apply uniform genome sequencing with relaxed allele-frequency filtering, plus copy-number
            and mitochondrial heteroplasmy analysis, to every reported DNAJC30 Leigh patient and to matched
            DNAJC30 optic-only patients. The digenic hypothesis predicts an excess of heterozygous complex
            I variants in the Leigh group; the current evidence for it rests on a single sibling pair.
        - experiment_id: arlhon_allelic_series_repair_assay
          name: Genotype-stratified complex I repair assay across the allelic series
          description: Measure N module subunit turnover and complex I activity in cells carrying missense,
            in-frame deletion and truncating DNAJC30 alleles, and test whether residual repair capacity
            separates the optic-only from the Leigh cases independently of any second variant.
      selected_evidence:
        snippet: Identification of a candidate heterozygous variant in NDUFS8 supports the hypothesis
          of digenic inheritance.
        supports: SUPPORT
    origin:
