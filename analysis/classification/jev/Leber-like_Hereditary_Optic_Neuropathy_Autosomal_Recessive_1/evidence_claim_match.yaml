          entity from the nuclear subunit deficiencies. The amount of assembled complex I is not reduced;
          if anything patient fibroblasts show a slight increase in complex I subunit abundance, without
          a matching rise in transcript levels, which is itself the signal that the problem is degradation
          rather than synthesis. What is lost is the quality of the enzyme that is present: the complex
          accumulates with damaged N module subunits still in place and reduced catalytic competence.
          Complex I activity is specifically affected while complex IV and complex V activities are not,
          so the lesion is not a general respiratory chain failure.'
