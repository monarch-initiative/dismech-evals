          have confirmed true biallelism in compound heterozygotes. The recessive mode is the whole point
          of the entity: it removes the maternal family history that had been treated as a prerequisite
          for a LHON diagnosis, and it changes recurrence counselling from maternal-line risk to a one-in-four
          sibling risk.'
