        - path: /experimental_models/0
          value:
            name: DNAJC30 patient-derived skin fibroblast lines
            experimental_model_type: PRIMARY_CELL_CULTURE
            cell_source: Patient-derived, from individuals carrying p.Tyr51Cys, p.Pro78Ser or p.Leu101Gln
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_types:
            - preferred_term: Fibroblast
              term:
                id: CL:0000057
                label: fibroblast
            publication: PMID:33465056
            description: 'Six fibroblast lines spanning all three DNAJC30 alleles known at the time, compared
              against seven control lines and against three mitochondrial LHON lines. The mtLHON comparison
              arm is what makes this model discriminating rather than merely descriptive: it shows the
              turnover defect is specific to the nuclear disease.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Complex I N-Module Subunit Exchange
        relationship: MEASURES
        fidelity: MODERATE
        description: Pulse stable isotope labelling combined with mass spectrometry of assembled respiratory
          chain complexes measures the turnover of individual complex I subunits, which is the defect
          this node asserts.
        limitations: Fibroblasts are not the affected cell type. Retinal ganglion cells are, and the complex
          I dependent respiration defect in fibroblasts is subtle, which the reporting authors attribute
          to the maintenance rather than structural role of the protein. A fibroblast measurement therefore
