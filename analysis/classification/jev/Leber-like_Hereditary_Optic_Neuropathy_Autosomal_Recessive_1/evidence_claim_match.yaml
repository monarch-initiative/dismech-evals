      assertion_type: Treatment
      assertion:
        name: Idebenone
        description: 'Idebenone is a short-chain benzoquinone that, once reduced, can accept electrons
          and deliver them to complex III, routing around the defective complex I. It is authorised for
          LHON by the European Medicines Agency and is given at 900 mg per day. Its use here is not merely
          inherited from the mitochondrial form: the arLHON cohorts report a treated recovery rate above
          that reported for mtLHON, which makes reaching a DNAJC30 diagnosis prognostically as well as
          genetically consequential. The important qualification is that the reported benefit is in the
          optic phenotype. In the one published patient with DNAJC30-associated Leigh syndrome treated
          with idebenone, the drug neither halted neurological progression nor prevented new lesions on
          imaging.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: idebenone
            term:
              id: CHEBI:31687
              label: idebenone
      selected_evidence:
        snippet: The autosomal recessive LHON patients demonstrate an earlier age of disease onset and
          a higher rate of idebenone-treated and spontaneous recovery of vision in comparison to reported
          figures for maternally inherited disease.
        supports: SUPPORT
