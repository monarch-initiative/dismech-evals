          and continue. Structural loss is progressive even in patients whose visual acuity is improving,
          so optical coherence tomography and visual function diverge in this phase. Visual function itself,
          once recovered, remained stable over follow-up of twelve and fourteen years in the two patients
          followed longest.
      selected_evidence:
        snippet: Presented are two autosomal recessive LHON (arLHON, OMIM:619382) cases with the same
          DNAJC30:c.152G>A pathogenic variant and different degrees of spontaneous visual recovery despite
          progressive RNFL thinning during a long-term follow-up.
        supports: SUPPORT
