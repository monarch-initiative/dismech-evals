              label: Leber-like hereditary optic neuropathy, autosomal recessive 1
        context: []
      assertion_type: Subtype
      assertion:
        name: Optic
        display_name: Isolated optic neuropathy presentation
        subtype_frequency: 24 of 28 homozygous p.Tyr51Cys carriers in the founder-variant cohort
        description: 'The usual presentation, seen in the great majority of reported carriers of biallelic
          DNAJC30 variants: subacute, painless, bilateral central visual loss from retinal ganglion cell
          degeneration, onset typically in the second or third decade, without extraocular involvement.
          This is the arm that shows the idebenone responsiveness and the spontaneous visual recovery
          distinguishing arLHON from the maternally inherited form. Note that this is a recognized presentation
          of one genotype, not a mechanistically separate entity: what selects it rather than the Leigh
          arm is unresolved and is curated as the open question arlhon_leigh_branch_determinant.'
      selected_evidence:
        snippet: Herein, we characterize 28 so far unreported individuals from 26 families carrying a
          homozygous DNAJC30 p.Tyr51Cys founder variant, 24 manifesting with LHON, two manifesting with
          Leigh syndrome, and two remaining asymptomatic.
        supports: SUPPORT
