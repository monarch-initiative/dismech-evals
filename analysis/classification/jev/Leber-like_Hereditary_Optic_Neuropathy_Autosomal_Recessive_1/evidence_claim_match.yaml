              label: Leber-like hereditary optic neuropathy, autosomal recessive 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Complex I N-Module Subunit Exchange
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'Complex I subunits do not all turn over at the same rate. Those of the N module,
          where NADH is oxidized and reactive oxygen species are generated, are exchanged individually
          and rapidly, which maintains a functional enzyme at a fraction of the energetic cost of rebuilding
          it. In control fibroblasts five subunits (NDUFV3, NDUFS4, NDUFS6, NDUFA6 and NDUFA7) turn over
          more than a quarter of their pool in twelve hours, against under a tenth for the rest of the
          complex. Four of those five are direct interaction partners of DNAJC30 in protein interaction
          data, and in patient fibroblasts and in a DNAJC30 knockout line their turnover is selectively
          and significantly slowed. The selectivity is the load-bearing observation: of 145 protein complexes
          surveyed in the knockout, only complex I, and within it only the N module, showed altered turnover.
          The proposal is that DNAJC30 hands damaged subunits to the CLPXP protease, with which it co-occurs
          evolutionarily.'
        biological_processes:
        - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
          modifier: DECREASED
          term:
            id: GO:0006515
            label: protein quality control for misfolded or incompletely synthesized proteins
        protein_complexes:
        - preferred_term: NADH dehydrogenase complex
          term:
            id: GO:0030964
            label: NADH dehydrogenase complex
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: we verified that among all captured protein complexes (n = 145), only mitochondrial complex
          I, and specifically the complex I N-module, had significantly altered turnover due to the knockout
          of DNAJC30
        supports: SUPPORT
