          Patients are investigated for and treated as demyelinating disease before the diagnosis is reached,
          sometimes for years.
        distinguishing_features:
        - Fluorescein angiography shows no leakage in this disorder, unlike inflammatory disc swelling.
        - Pain on eye movement is characteristically absent, though it has been reported in at least one
          genetically confirmed arLHON patient, so its presence does not exclude the diagnosis.
        - Aquaporin-4 and myelin oligodendrocyte glycoprotein antibodies are negative, and intravenous
          corticosteroids do not improve vision.
      selected_evidence:
        snippet: the swelling of the retinal nerve fiber layer, which, unfortunately, is often mistakenly
          considered a sign of an inflammatory process
        supports: SUPPORT
