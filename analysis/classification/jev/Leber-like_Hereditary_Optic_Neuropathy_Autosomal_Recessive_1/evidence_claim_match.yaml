        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DNAJC30 Loss of Function
        conforms_to: complex_i_deficiency#Complex I Biogenesis or Repair Failure
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'DNAJC30 is a single-exon nuclear gene encoding a DnaJ/HSP40 family co-chaperone
          expressed mainly in neurons. Disease alleles are biallelic and are dominated by one founder
          missense change, c.152A>G p.(Tyr51Cys), which lies in the J domain; the rarer p.(Pro78Ser),
          p.(Leu101Gln) and p.(His77del) alleles lie in the same domain, while p.(Glu204*) truncates upstream
          of the transmembrane domain. Truncating alleles are informative about the mechanism because
          they abolish the protein outright: the p.(Trp8*) nonsense allele produced no detectable DNAJC30
          protein in transfected cells, so the disease state is loss of the chaperone, not a gain of an
          aberrant activity. Heterozygous carriers, including carriers of outright loss-of-function alleles
          in population databases, are healthy.'
        genes:
        - preferred_term: DNAJC30
          term:
            id: hgnc:16410
            label: DNAJC30
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: Biallelic germline DNAJC30 variants, most often homozygosity for the Eastern European
            founder allele c.152A>G p.(Tyr51Cys), less often compound heterozygosity or homozygosity for
            a truncating allele.
        molecular_functions:
        - preferred_term: protein folding chaperone
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0044183
            label: protein folding chaperone
      selected_evidence:
        snippet: Of the 33 subjects, 29 harbored the same NM_032317.2 c.152A>G (7:73097602, NP_115693.2
          p.Tyr51Cys) homozygous variant
        supports: SUPPORT
