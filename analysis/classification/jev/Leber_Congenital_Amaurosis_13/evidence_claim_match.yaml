  bc26ec6861a648f15765de39d8d247d95b87eb98491c5ec674a51661ecc23ea1:
    claim:
      about:
        disease:
          name: Leber Congenital Amaurosis 13
          disease_term:
            preferred_term: RDH12-associated retinal degeneration
            term:
              id: MONDO:0012990
              label: Leber congenital amaurosis 13
        context: []
      assertion_type: Genetic
      assertion:
        name: RDH12
        gene_term:
          preferred_term: RDH12
          term:
            id: hgnc:19977
            label: RDH12
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'A short-chain dehydrogenase/reductase on chromosome 14, highly expressed in photoreceptor
          inner segments.

          Two things about variant interpretation in this gene are worth stating explicitly. First, residual
          in vitro activity does not exclude pathogenicity: T49M and I51N retain significant activity
          on purified protein and still fail in cells, because of reduced NADPH affinity and much lower
          expression. Second, the gene''s phenotypic range is wide - EOSRD/LCA is the commonest presentation,
          but retinitis pigmentosa, cone-rod dystrophy and macular dystrophy are all attributed to it,
          and autosomal dominant RP as well. A biallelic RDH12 genotype therefore does not by itself predict
          the LCA phenotype.

          Third, and usefully for a diagnostic laboratory: functional assay does separate the pathogenic
          changes from the polymorphisms here. In a survey of 119 patients across LCA, retinitis pigmentosa
          and cone-rod dystrophy, the RDH12 mutants associated with LCA were inactive or had only residual
          activity when expressed in COS-7 and Sf9 cells, while the changes that proved polymorphic were
          fully active. That is the mirror image of the first point rather than a contradiction of it:
          residual in vitro activity does not exclude pathogenicity, but full in vitro activity has so
          far tracked with benignity.

          Severity is associated with genotype in some cases, per the natural-history review, but no allele-level
          rule has been established.

          A nomenclature trap for anyone reading the older literature: the 2005 biochemical characterisation
          refers to RDH12 as linked to "Leber''s congenital amaurosis 3", not 13. LCA3 is now assigned
          to SPATA7. A search on the old designation will return the wrong gene.'
      selected_evidence:
        snippet: The severity is associated with genotype in some cases.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
