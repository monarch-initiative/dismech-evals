        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of All-Trans-Retinal Clearance in the Photoreceptor Inner Segment
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The step that defines the disease, and the one that separates it from every visual-cycle
          LCA. Photoactivated rhodopsin releases all-trans-retinal in the outer segment, where RDH8 reduces
          it; that is the visual cycle. Under continuous illumination some of that retinal leaks into
          the inner segment, and clearing it there is RDH12''s job.

          Single-cell imaging in knockout mice separated the two enzymes cleanly. Rdh8-deficient outer
          segments failed to reduce all-trans-retinal; Rdh12-deficient outer segments were unaffected.
          The leak of retinoids from outer to inner segment occurs in wild-type cells too, but in cells
          lacking either enzyme it is mainly all-trans-retinal rather than retinol. And wild-type rods
          could reduce moderate retinal loads inside the cell, an ability lost by cells deficient in either
          enzyme.

          Biochemically RDH12 is well suited to it: purified human RDH12 has its highest catalytic efficiency
          for all-trans-retinal, and it also recognises C9 aldehydes - lipid peroxidation products - as
          substrates.'
        molecular_functions:
        - preferred_term: all-trans-retinol dehydrogenase (NADP+) activity
          term:
            id: GO:0052650
            label: all-trans-retinol dehydrogenase (NADP+) activity
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: retinal metabolic process
          term:
            id: GO:0042574
            label: retinal metabolic process
          modifier: DECREASED
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        locations:
        - preferred_term: photoreceptor inner segment layer
          term:
            id: UBERON:0003925
            label: photoreceptor inner segment layer
      selected_evidence:
        snippet: Outer segments of rods deficient in Rdh8 failed to reduce all-trans-retinal, but those
          deficient in Rdh12 were unaffected.
        supports: SUPPORT
