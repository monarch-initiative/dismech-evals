      assertion_type: Pathophysiology
      assertion:
        name: Early Macular Atrophy
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: 'The feature that makes this genotype therapeutically distinct, curated as its own
          node for that reason rather than folded into the degeneration above. Macular atrophy was universal
          in the natural-history cohort - all 57 subjects - and was seen in children as young as two.
          It takes a characteristic form: petal-shaped and coloboma-like, with a variegated watercolour-like
          pattern on widefield imaging in 13 of 23 imaged subjects, and peripapillary sparing in 18 of
          23.

          Its consequence is that gene supplementation, which works for RPE65 because macular structure
          there is relatively preserved, has to reach this retina before the macula is gone. Other LCA
          forms often look relatively normal on fundoscopy in childhood despite severe visual dysfunction;
          this one does not.'
        locations:
        - preferred_term: macula lutea
          term:
            id: UBERON:0000053
            label: macula lutea
      selected_evidence:
        snippet: Macular atrophy was a universal clinical finding in all subjects, as young as 2 years
          of age.
        supports: SUPPORT
