  a04b2c8c0d024616c2a3874a2fad4bdc8f91c97a7d0fc7967f38de95982e8b5e:
    claim:
      about:
        disease:
          name: Leber Congenital Amaurosis 13
          disease_term:
            preferred_term: RDH12-associated retinal degeneration
            term:
              id: MONDO:0012990
              label: Leber congenital amaurosis 13
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinaldehyde and Aldehyde Toxicity in the Inner Segment
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'Unreduced all-trans-retinal is a reactive aldehyde, and it accumulates in the compartment
          that holds the photoreceptor''s mitochondria and endoplasmic reticulum. RDH12 also reduces C9
          aldehydes - lipid peroxidation products - so the same loss removes a second arm of aldehyde
          defence, and at saturating peroxidic-aldehyde concentrations in cells under oxidative stress
          this may be a substantial part of its role.

          The light dependence follows directly. Rdh12-null mice show increased susceptibility to light-induced
          photoreceptor apoptosis, and the authors of that study concluded that the severe visual impairment
          of humans with null RDH12 mutations may likely be caused by light damage.

          That mouse inference needs a caveat stated here and not only in the discussion it attaches to:
          Rdh12-null mice do not develop retinal degeneration. Two knockout lines were made and both have
          normal retinal histology. So the model supports the *susceptibility* claim - accumulated all-trans-retinal,
          slower ERG recovery after bleaching, more light damage - and does not support the step from
          susceptibility to the degeneration humans have. The node is graded PROVISIONAL for that reason.'
        biological_processes:
        - preferred_term: aldehyde metabolic process
          term:
            id: GO:0006081
            label: aldehyde metabolic process
          modifier: DYSREGULATED
        - preferred_term: cellular response to light stimulus
          term:
            id: GO:0071482
            label: cellular response to light stimulus
          modifier: DYSREGULATED
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: accelerated 11-cis-retinal production and increased susceptibility to light-induced photoreceptor
          apoptosis were also observed in Rdh12(-/-) mice, suggesting that RDH12 plays a unique, nonredundant
          role in the photoreceptor inner segments to regulate the flow of retinoids in the eye
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
