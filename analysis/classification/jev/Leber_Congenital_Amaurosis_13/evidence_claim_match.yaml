      assertion_type: Treatment
      assertion:
        name: Light Exposure Reduction
        description: 'A mechanistically motivated intervention with no clinical evidence behind it. The
          Rdh12-null mouse is highly susceptible to light-induced photoreceptor apoptosis, and the authors
          of that study concluded that the severe visual impairment of humans with null RDH12 mutations
          may likely be caused by light damage - because the retinal that overwhelms the inner segment
          is generated by illumination.

          No human study has tested whether reducing light exposure alters the course. It is recorded
          here because the mechanistic case is unusually direct and because tinted lenses are low-risk;
          it should not be presented to a family as established.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: behavioral intervention
          term:
            id: NCIT:C15184
            label: Behavioral Intervention
      selected_evidence:
        snippet: Thus, severe visual impairments of individuals with null mutations in RDH12 may likely
          be caused by light damage(1).
