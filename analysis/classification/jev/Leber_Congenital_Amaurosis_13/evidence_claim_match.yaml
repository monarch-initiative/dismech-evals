      assertion:
        name: Pregabalin (Investigational Retinal Scavenger)
        description: 'The one therapeutic candidate in this literature that targets the toxic species
          rather than the missing gene. Pregabalin is a retinaldehyde scavenger, and in the mutant RDH12
          cell lines it attenuated all-trans-retinal-induced ER stress.

          Two limits on how far to read that. The experiment is in HEK-293 cells expressing mutant RDH12,
          not in photoreceptors; and the endpoint is a stress marker, not photoreceptor survival. It is
          included because a scavenger strategy is genotype-agnostic in a way gene supplementation is
          not - it does not depend on delivering a transgene to photoreceptors that may already be lost
          - which is exactly the constraint the macular-atrophy timing imposes on the gene-therapy route.'
        therapeutic_modality: SMALL_MOLECULE
