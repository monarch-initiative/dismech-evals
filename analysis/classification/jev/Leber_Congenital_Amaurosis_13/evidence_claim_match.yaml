  d925cf9ff141284324c6e1ea39750edc73d3703d8137a18d20dc07f814f59e89:
    claim:
      about:
        disease:
          name: Leber Congenital Amaurosis 13
          disease_term:
            preferred_term: RDH12-associated retinal degeneration
            term:
              id: MONDO:0012990
              label: Leber congenital amaurosis 13
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Rdh12-null mouse
        species: Mouse
        genotype: Rdh12-/- (targeted deletion)
        publication: PMID:17032653
        description: 'The model most of this disease''s mechanistic literature runs through, and the one
          whose limitation is easiest to lose. Two independent knockout lines were made. Both have normal
          retinal histology and no retinal degeneration, which is the defining human phenotype.

          What the model does show is the biochemistry: slower kinetics of all-trans-retinal reduction
          with delayed dark adaptation, accelerated 11-cis-retinal production, accumulated all-trans-retinal,
          slower ERG recovery after bleaching, and markedly increased susceptibility to light-induced
          photoreceptor apoptosis. So it is a good model of the enzymatic deficit and not a model of the
          disease.'
        modeled_mechanisms:
        - target: Failure of All-Trans-Retinal Clearance in the Photoreceptor Inner Segment
          relationship: RECAPITULATES
          fidelity: HIGH
          description: The enzymatic deficit itself is faithfully reproduced - slowed all-trans-retinal
            reduction and altered retinoid flow in the inner segment.
          limitations: Faithful for the biochemistry only. Nothing about this link should be read as support
            for the downstream degeneration, which the model does not have.
          readouts:
          - name: Kinetics of all-trans-retinal reduction
            target: Failure of All-Trans-Retinal Clearance in the Photoreceptor Inner Segment
            direction: DECREASED
            interpretation: Slowed reduction with delayed dark adaptation, the direct functional consequence
              of losing the enzyme.
        - target: Photoreceptor Degeneration
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The model does not develop retinal degeneration. Two knockout lines were generated
            and both showed normal retinal histology with no apparent signs of degeneration - against
            a human disease defined by universal macular atrophy from age two and a non-recordable ERG
            from age one.
          limitations: 'This is the central translational problem for RDH12 and it constrains everything
            preclinical. The gene-therapy vector study says so in its own abstract: efficacy was demonstrated
            in an animal model that does not exhibit a retinal degeneration phenotype, with reconstituted
            reductase activity and reduced light-damage susceptibility as the endpoints rather than rescue
            of degeneration. Any efficacy claim derived from this model is a claim about biochemistry,
            not about vision.'
          readouts:
          - name: Retinal histology
            target: Photoreceptor Degeneration
            direction: UNCHANGED
            interpretation: Normal retinal histology in both knockout lines - a real negative result,
              recorded as UNCHANGED rather than omitted.
      selected_evidence:
        snippet: Although Rdh12-deficient (Rdh12-/-) mice do not exhibit retinal degeneration, functional
          deficits relevant to visual cycle function can be demonstrated.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
