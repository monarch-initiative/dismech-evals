        context: []
      assertion_type: Treatment
      assertion:
        name: AAV Gene Supplementation (Investigational)
        description: 'A gene therapy vector for RDH12-associated retinal dystrophy has been developed,
          and preclinical work plus a prospective natural-history study are described as preparing the
          foundation for trials. Nothing has been shown to work in patients.

          The specific obstacle for this genotype is timing rather than vector design. Macular atrophy
          is universal and documented from age two; supplementation can only preserve photoreceptors that
          still exist. That is the reason the natural-history studies exist at all - to identify outcome
          measures, since the ERG is already non-recordable and visual acuity does not fall until later.'
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
