  799517074c7c4826f4260f2ef8bdcc1fe8de4faf9e9168a59ea3c7c3b77570b8:
    claim:
      about:
        disease:
          name: Leber Congenital Amaurosis 13
          disease_term:
            preferred_term: RDH12-associated retinal degeneration
            term:
              id: MONDO:0012990
              label: Leber congenital amaurosis 13
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lca13_rdh12_null_mouse_does_not_degenerate
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do Rdh12-null mice have normal retinal histology when humans with the same enzymatic
          loss are blind in childhood?
        attaches_to:
        - pathophysiology#Retinaldehyde and Aldehyde Toxicity in the Inner Segment
        - pathophysiology#Photoreceptor Degeneration
        - animal_models#Rdh12-null mouse
        - treatments#AAV Gene Supplementation (Investigational)
        - treatments#Light Exposure Reduction
        rationale: 'This is the central translational problem for RDH12 and it constrains almost everything
          preclinical in this entry, which is why it attaches to five places rather than sitting under
          one node.

          The evidence is positive on both sides and disagrees. Two independent Rdh12 knockout mouse lines
          were generated; both have normal retinal histology and no apparent signs of retinal degeneration.
          They do reproduce the biochemistry - accumulated all-trans-retinal, slower ERG recovery after
          bleaching, increased susceptibility to light-induced photoreceptor apoptosis, and in the second
          line increased RPE A2E - so the enzymatic deficit translates and the tissue outcome does not.
          Humans with the same loss have universal macular atrophy from age two and a non-recordable ERG
          from age one.

          Three candidate explanations are worth separating rather than assuming. Species differences
          in retinal illumination and outer-segment retinoid flux, so the mouse never accumulates enough
          substrate. Redundancy from another mouse reductase, absent or weaker in humans. Or a lifespan
          mismatch, the mouse not living long enough to accumulate the damage - which the zebrafish result
          argues against being the whole story, since that model shows early degenerative change at twelve
          months.

          Two practical consequences, and they are why this is graded a mismatch rather than a curiosity.
          First, the aldehyde toxicity node is PROVISIONAL rather than ESTABLISHED because its step to
          degeneration rests on a model that does not degenerate. Second, the AAV gene-therapy programme
          states in its own abstract that efficacy was demonstrated in an animal model that does not exhibit
          a retinal degeneration phenotype - so what was shown is reconstituted reductase activity and
          reduced light-damage susceptibility, not rescue of vision, and there is currently no preclinical
          model in which rescuing the human phenotype could be demonstrated. The same applies to light
          avoidance, whose entire evidential basis is that mouse.'
        proposed_experiments:
        - experiment_id: lca13_mouse_retinoid_load_vs_human
          experiment_design: DESCRIPTIVE_PROFILING
          name: Comparative all-trans-retinal load in Rdh12-null mouse and human retina
          description: Quantify all-trans-retinal and its adducts in Rdh12-null mouse retina under cyclic
            and constant light against post-mortem RDH12 patient retina, to test whether the mouse is
            protected by a lower substrate load rather than by a different downstream response.
          would_support:
          - pathophysiology#Retinaldehyde and Aldehyde Toxicity in the Inner Segment
          supporting_outcome:
          - All-trans-retinal load is substantially lower in the null mouse retina than in human RDH12
            retina, placing the species difference upstream in substrate flux rather than in the death
            pathway.
          refuting_outcome:
          - Comparable retinoid loads in both, which would locate the difference in a downstream protective
            mechanism the mouse has and humans lack, and make the mouse unsuitable for efficacy testing
            on any endpoint downstream of substrate clearance.
      selected_evidence:
        snippet: Macular atrophy was a universal clinical finding in all subjects, as young as 2 years
          of age.
        supports: SUPPORT
