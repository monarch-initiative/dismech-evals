  4939d3f5998e5774d3300ee3e5f7df14be77d74aefcc487846988c34b61ea5d1:
    claim:
      about:
        disease:
          name: Leber Congenital Amaurosis 13
          disease_term:
            preferred_term: RDH12-associated retinal degeneration
            term:
              id: MONDO:0012990
              label: Leber congenital amaurosis 13
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinoic Acid Overproduction
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'A second, non-obvious consequence of the same enzymatic loss, and a candidate mechanism
          of cell death in its own right. In living cells RDH12 acts exclusively as a retinaldehyde *reductase*,
          despite being bidirectional in vitro - so it pulls retinoid homeostasis toward retinol and away
          from all-trans-retinal, which is the substrate for retinoic acid synthesis. Losing it lets bioactive
          retinoic acid rise.

          The evidence that this is not incidental: the reductase activity protects cells from retinaldehyde-induced
          death specifically at high retinaldehyde concentrations, and the protective effect correlates
          with lower retinoic acid levels in RDH12-expressing cells.

          Graded PROVISIONAL rather than ESTABLISHED because it rests on one cell-based study and no one
          has measured retinoic acid in an RDH12-deficient retina.'
        biological_processes:
        - preferred_term: retinoid metabolic process
          term:
            id: GO:0001523
            label: retinoid metabolic process
          modifier: DYSREGULATED
      selected_evidence:
        snippet: in living cells, RDH12 acts exclusively as a retinaldehyde reductase, shifting the retinoid
          homeostasis toward the increased levels of retinol and decreased levels of bioactive retinoic
          acid
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
