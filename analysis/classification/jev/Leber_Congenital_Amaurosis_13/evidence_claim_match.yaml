      assertion_type: Pathophysiology
      assertion:
        name: Endoplasmic Reticulum and Oxidative Stress
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'What the accumulated aldehyde does to the cell, and the arm with the clearest therapeutic
          handle. In HEK-293 lines expressing wild-type RDH12, the enzyme protects against all-trans-retinal
          toxicity and oxidative stress. Lines expressing mutant RDH12 have reduced protein expression
          and activity, cannot protect, and instead show oxidative and endoplasmic reticulum stress with
          upregulation of sXBP1, CHOP and ATF4 - the IRE1, ATF6 and PERK arms of the unfolded protein
          response respectively, and CHOP in particular is the pro-apoptotic output of that response.

          Graded PROVISIONAL: this is a heterologous expression system, not a photoreceptor, and the transcriptional
          response has not been demonstrated in an RDH12-deficient retina. It is curated as a distinct
          node rather than folded into the aldehyde toxicity above because it is the step pregabalin acts
          on, and because its addition is what stops the two-way question about which toxic species kills
          the cell from reading as a false binary - stress signalling is the shared downstream consequence
          either way.'
        biological_processes:
        - preferred_term: response to endoplasmic reticulum stress
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
          modifier: INCREASED
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
      selected_evidence:
        snippet: Mutant RDH12 cells displayed reduced protein expression and activity, with an inability
          to protect cells from atRAL toxicity, inducing oxidative and endoplasmic reticulum (ER) stress,
          with upregulation of sXBP1, CHOP, and ATF4.
        supports: SUPPORT
