      assertion_type: Pathophysiology
      assertion:
        name: TUBB4B Variant Microtubule and Axonemal Dysfunction
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        role: trigger
        description: Heterozygous TUBB4B variants at Arg391 produce a beta-tubulin that still folds and
          co-assembles into the microtubule lattice but dampens microtubule growth dynamics. Because TUBB4B
          is a cilia-enriched isotype required for centriole and axoneme formation, the dominant-negative
          variants perturb centriole and cilium biogenesis, the shared upstream lesion of the ciliopathies.
          The original delineation favored a pure microtubule-dynamics defect; later structure-function
          work reframed the lesion as an organelle-specific ciliary one.
        cell_types:
        - preferred_term: ciliated cell
          term:
            id: CL:0000064
            label: ciliated cell
        biological_processes:
        - preferred_term: axoneme assembly
          term:
            id: GO:0035082
            label: axoneme assembly
          modifier: ABNORMAL
        - preferred_term: cilium assembly
          term:
            id: GO:0060271
            label: cilium assembly
          modifier: DECREASED
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: the dynamics of growing MTs were consistently altered, showing that the mutations have
          a significant dampening impact on normal MT growth
        supports: SUPPORT
