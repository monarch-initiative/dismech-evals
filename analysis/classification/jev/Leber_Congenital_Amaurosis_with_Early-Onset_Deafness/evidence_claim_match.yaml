  c83f80fe57b132fc6fb69e7eb323b0774c12f1b518c8d012615f42d99c4eec2f:
    claim:
      about:
        disease:
          name: Leber Congenital Amaurosis with Early-Onset Deafness
          disease_term:
            preferred_term: Leber congenital amaurosis with early-onset deafness
            term:
              id: MONDO:0060650
              label: Leber congenital amaurosis with early-onset deafness
        context: []
      assertion_type: Genetic
      assertion:
        name: TUBB4B
        association: Pathogenic heterozygous (dominant-negative) variants, recurrently at Arg391
        gene_term:
          preferred_term: TUBB4B
          term:
            id: hgnc:20771
            label: TUBB4B
        notes: TUBB4B encodes a cilia-enriched beta-tubulin isotype. The Arg391 residue contributes to
          the longitudinal alpha/beta-tubulin binding interface within the microtubule protofilament;
          recurrent Arg391 substitutions dampen microtubule growth dynamics and, through dominant-negative
          incorporation into the microtubule lattice, perturb centriole and cilium biogenesis. TUBB4B
          is distinct from the paralog TUBB4A, whose variants cause hypomyelinating leukodystrophy and
          dystonia; the two genes should not be conflated.
      selected_evidence:
        snippet: Using exome sequencing in a multiplex family and three simplex case subjects with an
          atypical association of LCA with early-onset hearing loss, we identified two heterozygous mutations
          affecting Arg391 in β-tubulin 4B isotype-encoding (TUBB4B).
        supports: SUPPORT
