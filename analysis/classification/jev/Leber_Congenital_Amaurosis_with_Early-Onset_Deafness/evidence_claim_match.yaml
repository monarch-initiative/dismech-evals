      assertion:
        name: Photoreceptor Connecting Cilium Degeneration
        conforms_to: ciliopathy_dysfunction#Photoreceptor Connecting Cilium Degeneration
        role: consequence
        description: The photoreceptor outer segment is a specialized non-motile sensory cilium connected
          to the cell body by a connecting cilium through which all phototransduction cargo is trafficked.
          TUBB4B-dependent ciliary microtubule defects impair outer-segment morphogenesis and maintenance,
          causing the severe, early photoreceptor degeneration of Leber congenital amaurosis.
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        biological_processes:
        - preferred_term: photoreceptor cell maintenance
          term:
            id: GO:0045494
            label: photoreceptor cell maintenance
          modifier: DECREASED
      selected_evidence:
        snippet: Leber congenital amaurosis (LCA) is a neurodegenerative disease of photoreceptor cells
          that causes blindness within the first year of life.
        supports: SUPPORT
