      assertion_type: Pathophysiology
      assertion:
        name: Penetrance Modulation by Genetic Background and Environmental Triggers
        biological_scale: ORGANISM
        description: 'LHON is not a deterministic monogenic disease. Most carriers of a primary mtDNA
          variant never lose vision; conversion is gated by additional factors that act on the bioenergetic
          threshold of the retinal ganglion cell. Three modifier classes are established. (1) mtDNA haplogroup
          background: risk of visual failure is higher for m.11778G>A on haplogroup J2 and for m.14484T>C
          on haplogroup J1, higher for m.3460G>A on haplogroup K, and significantly lower for m.11778G>A
          on haplogroup H, with MT-CYB substitutions offering a mechanistic explanation. (2) Sex: males
          are affected several times more often than females, an asymmetry not explicable by maternal
          transmission alone. The size of that excess is contested: GeneReviews gives four to five times,
          whereas the Australian registry figures below imply a ratio closer to three. (3) Environmental
          exposure: smoking is strongly and consistently associated with visual loss independent of sex
          and alcohol, with clinical penetrance reaching 93% in men who smoked; heavy alcohol intake shows
          a weaker trend. This node is the mechanistic bridge between genotype and the observed low penetrance
          (17.5% of males and 5.4% of females in a contemporary Australian registry cohort). Those two
          penetrance figures are not in conflict and must not be compared directly: the 93% figure is
          conditional on smoking and comes from LHON-affected pedigrees ascertained through probands,
          whereas the 17.5%/5.4% figures are unconditional lifetime risks from a registry that includes
          4,948 largely asymptomatic carriers. The registry authors state explicitly that historically
          higher male rates are not supported by their data. The same ascertainment caveat separates the
          clinical carrier prevalence recorded under `prevalence` (11.82 per 100,000) from the population-genomic
          susceptibility estimate of roughly 1 in 1,000.

          '
        cell_types:
        - preferred_term: Retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
      selected_evidence:
        snippet: haplogroup J (J2 for 11778G-->A and J1 for 14484T-->C) and when the 3460G-->A
        supports: SUPPORT
