      assertion_type: Inheritance
      assertion:
        name: Mitochondrial inheritance
        description: 'Classical LHON is caused by pathogenic variants in the mitochondrial genome and
          is transmitted exclusively down the maternal line. An affected or carrier woman transmits the
          variant to all of her offspring; an affected man transmits it to none. Most carriers are homoplasmic,
          but heteroplasmy occurs in a minority and means that a maternal relative of a proband may not
          carry the variant at all — molecular testing of each at-risk relative is therefore required
          rather than assumed transmission. Penetrance is incomplete and both sex- and age-dependent.

          '
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
      selected_evidence:
        snippet: transmitted strictly by maternal inheritance.
        supports: SUPPORT
