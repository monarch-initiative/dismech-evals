      assertion_type: Discussion
      assertion:
        discussion_id: gap_lhon_penetrance_determinants
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'What determines which carriers of a primary LHON mtDNA variant convert to visual loss,
          and can conversion risk be predicted prospectively for an individual?

          '
        attaches_to:
        - pathophysiology#Penetrance Modulation by Genetic Background and Environmental Triggers
        rationale: 'Primary LHON susceptibility variants occur in roughly 1 in 1,000 people — far more
          common than manifest disease — and even the best-characterised modifiers (mtDNA haplogroup,
          sex, smoking) leave most of the variance in conversion unexplained. No validated biomarker predicts
          conversion, and contemporary registry estimates of lifetime risk (17.5% in males, 5.4% in females)
          are substantially lower than older textbook figures, which has direct consequences for genetic
          counselling and for powering prevention trials in asymptomatic carriers.

          '
        proposed_experiments:
        - experiment_id: exp_lhon_carrier_conversion_cohort
          name: Prospective biomarker cohort of asymptomatic LHON mtDNA carriers
          description: 'Follow a large multicentre cohort of asymptomatic primary-variant carriers with
            serial spectral-domain OCT (peripapillary RNFL, macular GCL), colour vision, contrast sensitivity,
            and electrophysiology (PERG/photopic negative response) to identify structural or functional
            changes that precede conversion, and estimate their positive predictive value for visual loss.

            '
          experiment_type:
            preferred_term: prospective longitudinal biomarker cohort study
          decision_criterion: 'Identification of a pre-conversion measure whose change predicts subsequent
            visual loss with clinically useful sensitivity and specificity.

            '
          supporting_outcome:
          - Conversion is preceded by a detectable subclinical structural or functional decline that can
            be used to time intervention.
          refuting_outcome:
          - Conversion is abrupt and unheralded by any measurable pre-clinical change, making carrier
            surveillance non-informative.
        - experiment_id: exp_lhon_nuclear_modifier_gwas
          name: Nuclear modifier association study in discordant carrier sibships
          description: 'Perform genome-wide (or exome-wide) association and rare-variant burden testing
            on affected versus unaffected carriers drawn from the same pedigrees, matched for mtDNA haplogroup
            and smoking exposure, to identify nuclear loci that modulate conversion independently of the
            known mtDNA and environmental modifiers.

            '
          experiment_type:
            preferred_term: within-family genetic modifier association study
          decision_criterion: 'Replicated association of one or more nuclear loci with conversion after
            conditioning on haplogroup and smoking.

            '
          supporting_outcome:
          - Nuclear genetic background is a material determinant of LHON penetrance.
          refuting_outcome:
          - Residual penetrance variance is environmental or stochastic rather than nuclear-genetic.
      selected_evidence:
        snippet: women, older adults, and younger children are also at risk.
        supports: SUPPORT
