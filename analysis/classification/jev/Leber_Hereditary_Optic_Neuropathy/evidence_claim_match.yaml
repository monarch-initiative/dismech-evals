      assertion:
        name: Inflammatory Optic Neuritis
        description: 'The most frequent and most consequential misdiagnosis. LHON is commonly mistaken
          for inflammatory optic neuritis associated with multiple sclerosis, AQP4-NMOSD, or MOGAD, which
          delays appropriate treatment.

          '
        distinguishing_features:
        - LHON is painless, whereas inflammatory optic neuritis is typically painful on eye movement.
        - LHON shows peripapillary telangiectasia and RNFL pseudoedema without fluorescein leakage.
        - Early macular ganglion cell loss on OCT favours LHON.
        - Corticosteroids and plasma exchange treat inflammatory optic neuritis but not LHON.
      selected_evidence:
        snippet: Misdiagnosis, often as inflammatory optic neuritis, delays treatment, compounded
        supports: SUPPORT
