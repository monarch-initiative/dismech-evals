            label: NQO1
        relationship_type: MODIFIER
        variant_origin: GERMLINE
        association: 'NQO1 is not a cause of LHON but a pharmacogenetic modifier of treatment response.
          Idebenone must be reduced by the cytosolic NAD(P)H oxidoreductase I (NQO1) before it can shuttle
          electrons to complex III; two polymorphic variants drastically reduce NQO1 protein levels in
          the homozygous or compound heterozygous state, which hampers that reduction. In a retrospective
          analysis of a large idebenone-treated LHON cohort, patients carrying those genotypes had the
          poorest therapy response, particularly on the m.3460G>A/MT-ND1 background. The authors frame
          this as grounds to *consider* NQO1 genotype alongside the mtDNA mutation, not as validated genotype-guided
          prescribing.

          '
      selected_evidence:
        snippet: "two polymorphic variants drastically reduce NQO1 protein levels when homozygous \nor\
          \ compound heterozygous. This hampers idebenone reduction."
        supports: SUPPORT
