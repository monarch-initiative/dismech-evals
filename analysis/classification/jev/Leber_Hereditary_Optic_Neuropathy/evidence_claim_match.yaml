              label: Leber hereditary optic neuropathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_lhon_gene_therapy_effect_identifiability
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Does intravitreal allotopic MT-ND4 gene therapy produce a real treatment effect over
          natural history, given that sham-injected fellow eyes improved to the same degree as treated
          eyes?

          '
        attaches_to:
        - pathophysiology#Complex I Subunit Missense Mutation
        rationale: 'In RESCUE and REVERSE the within-patient design was invalidated by bilateral improvement
          after unilateral injection, plausibly explained by contralateral vector transfer demonstrated
          in nonhuman primates. Without an independent untreated control arm, the durable improvement
          observed to five years cannot be cleanly separated from spontaneous recovery. This is the central
          unresolved question for LHON gene therapy.

          '
        proposed_experiments:
        - experiment_id: exp_lhon_gt_independent_control_trial
          name: Gene therapy trial with a between-patient untreated comparator
          description: 'Run a randomised trial in which the comparator is an independent untreated (or
            rigorously matched external natural-history) group of patients rather than the fellow eye,
            stratified by genotype and time from symptom onset, so that the treatment effect is identifiable
            in the presence of contralateral vector spread.

            '
          experiment_type:
            preferred_term: randomised controlled trial with between-patient comparator
          decision_criterion: 'A statistically significant difference in best-corrected visual acuity
            between treated patients and the independent untreated comparator.

            '
          supporting_outcome:
          - Allotopic ND4 gene therapy confers visual benefit beyond spontaneous recovery.
          refuting_outcome:
          - The observed improvement reflects natural history rather than the vector.
      selected_evidence:
        snippet: Unexpectedly, sustained visual improvement was observed in both
        supports: SUPPORT
