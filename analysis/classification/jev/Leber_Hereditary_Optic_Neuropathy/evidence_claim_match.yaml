  54509c56ceceb5cc402532828d032076585ab142c040cc352af11d03c8681f9c:
    claim:
      about:
        disease:
          name: Leber Hereditary Optic Neuropathy
          disease_term:
            preferred_term: Leber hereditary optic neuropathy
            term:
              id: MONDO:0010788
              label: Leber hereditary optic neuropathy
        context: []
      assertion_type: Treatment
      assertion:
        name: Idebenone
        description: 'Idebenone is a short-chain benzoquinone/coenzyme Q10 analogue that, after NQO1-mediated
          reduction, can accept electrons and deliver them to complex III, partly bypassing the defective
          complex I while also limiting oxidative injury. It is the only disease-specific drug authorised
          for LHON (European Medicines Agency, under exceptional circumstances), given at 900 mg/day (300
          mg three times daily). The pivotal RHODOS randomised placebo-controlled trial did not meet its
          primary endpoint but favoured idebenone in secondary analyses, particularly in patients with
          discordant visual acuities at baseline; the later externally controlled LEROS study met its
          primary endpoint and confirmed long-term efficacy in the subacute/dynamic and chronic phases,
          with effect size varying by disease phase and causative variant. Benefit is greatest when treatment
          begins within the first year of visual loss.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: idebenone
            term:
              id: CHEBI:31687
              label: idebenone
        notes: 'LEROS is an externally (natural-history) controlled open-label study, not a contemporaneous
          randomised comparison; its effect estimates should be read with that limitation in mind. Response
          is also modified by NQO1 genotype (see the NQO1 record under `genetic` and the `gap_lhon_nqo1_idebenone_pharmacogenetics`
          discussion): idebenone requires NQO1-mediated reduction, and in the unreduced oxidized state
          it inhibits complex I rather than bypassing it.

          '
      selected_evidence:
        snippet: statistical significance in the intention to treat population.
        supports: SUPPORT
