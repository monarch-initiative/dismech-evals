          ATP-generating capacity of oxidative phosphorylation is reduced. The severity of the biochemical
          lesion is not uniform across the three primary variants: transmitochondrial cybrid work cited
          here shows a frank assembly and catalytic-activity defect for m.3460G>A, whereas m.11778G>A
          and m.14484T>C are generally reported to impair coupling efficiency and raise ROS with comparatively
          better preserved catalytic activity — that second half is the wider literature''s consensus
          and is not curated here against a cited source. The node should therefore be read as a shared
          functional endpoint rather than an identical molecular block. Idebenone''s therapeutic rationale
          is to accept electrons via NQO1 and deliver them downstream to complex III, partly bypassing
          this block.

