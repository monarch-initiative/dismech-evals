        description: 'Axon-caliber spectra generated from electron micrographs show a marked diminution
          of the first peak (axons under 1 micron in diameter) with relative emphasis of a second peak
          around 2 microns, indicating preferential loss of the smallest axons — the P-cell population
          that forms the papillomacular bundle — and relative preservation of the larger M-cell fibers.
          This is the histopathological basis for the clinical combination of dyschromatopsia and central
          scotoma with preserved pupillary responses.

          '
        diagnostic: false
        notes: 'Based on ultrastructural study of two molecularly characterised LHON optic nerves; the
