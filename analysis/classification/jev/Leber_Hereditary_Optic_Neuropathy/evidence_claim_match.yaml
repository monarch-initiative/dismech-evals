      assertion_type: Pathophysiology
      assertion:
        name: Complex I Electron Transfer Deficiency
        biological_scale: MOLECULAR
        description: 'Mutant complex I transfers electrons from NADH to ubiquinone inefficiently. Proton
          pumping across the inner membrane falls, the NADH/NAD+ redox couple shifts, and the coupled
          ATP-generating capacity of oxidative phosphorylation is reduced. The severity of the biochemical
          lesion is not uniform across the three primary variants: transmitochondrial cybrid work cited
          here shows a frank assembly and catalytic-activity defect for m.3460G>A, whereas m.11778G>A
          and m.14484T>C are generally reported to impair coupling efficiency and raise ROS with comparatively
          better preserved catalytic activity — that second half is the wider literature''s consensus
          and is not curated here against a cited source. The node should therefore be read as a shared
          functional endpoint rather than an identical molecular block. Idebenone''s therapeutic rationale
          is to accept electrons via NQO1 and deliver them downstream to complex III, partly bypassing
          this block.

          '
        biological_processes:
        - preferred_term: mitochondrial electron transport, NADH to ubiquinone
          term:
            id: GO:0006120
            label: mitochondrial electron transport, NADH to ubiquinone
          modifier: DECREASED
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: mitochondrial gene mutations that hinder oxidative phosphorylation and increase
