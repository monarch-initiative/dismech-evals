              label: Leber hereditary optic neuropathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_lhon_nqo1_idebenone_pharmacogenetics
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Is NQO1 genotype a clinically actionable predictor of idebenone response in LHON?

          '
        attaches_to:
        - pathophysiology#Complex I Electron Transfer Deficiency
        rationale: 'Idebenone''s mechanism requires NQO1-mediated reduction before it can shuttle electrons
          to complex III, so variants lowering NQO1 protein levels are a mechanistically coherent candidate
          explanation for non-response — and the unreduced, oxidized drug actively inhibits complex I,
          so the stakes are higher than simple inefficacy. Aleo et al. (2024) demonstrated both the molecular
          effect and a corresponding clinical signal, but the clinical arm was a retrospective analysis
          of an already-treated cohort rather than a prospective genotype-stratified trial, and the authors
          themselves put it no more strongly than "suggest consideration". Whether NQO1 genotype should
          actually gate or modify prescribing is unresolved.

          '
        proposed_experiments:
        - experiment_id: exp_lhon_nqo1_stratified_idebenone_trial
          name: NQO1-genotype-stratified prospective idebenone trial
          description: 'Prospectively stratify LHON patients starting idebenone by NQO1 genotype/protein
            level and compare pre-specified visual-acuity response endpoints between strata, with paired
            measurement of NQO1 protein and idebenone reduction capacity in patient-derived cells.

            '
          experiment_type:
            preferred_term: prospective pharmacogenetic stratified interventional study
          decision_criterion: 'A clinically meaningful difference in idebenone response between low-NQO1
            and normal-NQO1 strata.

            '
          supporting_outcome:
          - NQO1 genotype should guide idebenone prescribing or dosing in LHON.
          refuting_outcome:
          - NQO1 status does not usefully predict idebenone response, and non-response is driven by other
            factors.
      selected_evidence:
        snippet: can neither predict nor understand the non-responders.
        supports: SUPPORT
