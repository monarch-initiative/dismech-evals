      assertion_type: Treatment
      assertion:
        name: Genetic Counselling and Cascade Testing
        description: 'Counselling must explain strict maternal transmission for mtDNA LHON, the inability
          of affected males to transmit, the sex- and age-dependent incomplete penetrance, and the different
          (autosomal recessive) risks of arLHON. Because heteroplasmy means a maternal relative may not
          carry the variant, each maternal family member seeking risk advice should undergo molecular
          testing rather than being assumed to be a carrier. Once the maternal variant is known, prenatal
          testing and preimplantation genetic testing are technically possible, but counselling must be
          explicit that a positive prenatal result is hard to interpret — mutational load in amniocytes
          and chorionic villi may not reflect other fetal or adult tissues, and the presence of the variant
          does not predict whether, when, how severely, or how fast visual loss will occur.

          '
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Genetic Counseling
