        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tissue-Selective Neuronal Bioenergetic Vulnerability
        biological_scale: CELLULAR
        description: 'Two neuronal populations with disproportionately high, spatially distributed ATP
          demand are selectively vulnerable to the complex I defect: retinal ganglion cells, whose long,
          partly unmyelinated intraretinal axons (as in classical LHON) impose an especially high energy
          burden, and striatal projection neurons of the basal ganglia. Why these two populations specifically
          decompensate, while most other tissues remain clinically unaffected, is not fully resolved,
          but tissue- and cell-type-specific mutant load (heteroplasmy) is the best-supported explanation:
          a Japanese series found homoplasmic mutant load producing infantile dystonia while a heteroplasmic
          variant of the same mutation produced later-onset truncal ataxia and parkinsonism, and involvement
          of the visual pathway is generally a later event than dystonia in patients who develop both.

          '
        cell_types:
        - preferred_term: Retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        - preferred_term: Medium spiny neuron
          term:
            id: CL:1001474
            label: medium spiny neuron
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: The involvement of visual pathways in 14459G>A-mutated patients is generally a later
          event in contrast to dystonia that develops in the early childhood.
        supports: SUPPORT
