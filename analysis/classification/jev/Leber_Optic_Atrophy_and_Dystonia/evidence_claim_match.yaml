          term:
            id: hgnc:7455
            label: MT-ND1
        - preferred_term: MT-ND3
          term:
            id: hgnc:7458
            label: MT-ND3
        - preferred_term: MT-ND4
          term:
            id: hgnc:7459
            label: MT-ND4
