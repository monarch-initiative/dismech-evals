      assertion:
        name: Complex I Assembly and Coenzyme Q-Binding Site Defect
        biological_scale: MOLECULAR
        description: 'Transmitochondrial cybrid experiments — in which patient Epstein-Barr-virus-transformed
          lymphoblasts were enucleated and fused to a mtDNA-deficient recipient cell line — assign a partial
          complex I biochemical defect directly to the ND6 m.14459G>A mutation, separating the mtDNA effect
          from nuclear genetic background. Submitochondrial particles from patient cell lines showed a
          60% reduction in complex I-specific activity relative to controls, with normal activity for
          complexes II+III, III, and IV; cybrid lines carrying the mutation showed a smaller but still
          significant 39% reduction. Kinetic analysis found a reduced Vmax with unchanged Km, and specific
          activity was inhibited by increasing concentrations of a reduced coenzyme Q analog (decylubiquinol),
          suggesting the mutation alters the coenzyme Q-binding site of the enzyme rather than abolishing
          catalysis outright.

          '
        molecular_functions:
        - preferred_term: NADH dehydrogenase (ubiquinone) activity
          term:
            id: GO:0008137
            label: NADH dehydrogenase (ubiquinone) activity
          modifier: DECREASED
        cellular_components:
