            term:
              id: MONDO:0010772
              label: Leber optic atrophy and dystonia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MT-ND6 m.14459G>A Missense Mutation
        biological_scale: MOLECULAR
        description: 'The initiating lesion is most often a homoplasmic or heteroplasmic G-to-A transition
          at mtDNA position 14459 within MT-ND6, encoding NADH:ubiquinone oxidoreductase core subunit
          6 of respiratory-chain complex I. The substitution changes a moderately conserved alanine to
          a valine at ND6 residue 72 (p.Ala72Val), within the most evolutionarily conserved region of
          the protein. Rarer alternate lesions at other complex I loci (MT-ND1, MT-ND3, MT-ND4, or a second
          MT-ND6 site) produce a mechanistically analogous complex I defect in individual families. Because
          mtDNA is present in every cell, the lesion itself is systemic; the resulting disease phenotype
          is not.

          '
        genes:
        - preferred_term: MT-ND6
          term:
            id: hgnc:7462
            label: MT-ND6
        - preferred_term: MT-ND1
          term:
            id: hgnc:7455
            label: MT-ND1
        - preferred_term: MT-ND4
          term:
            id: hgnc:7459
            label: MT-ND4
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
        molecular_functions:
        - preferred_term: NADH dehydrogenase (ubiquinone) activity
          term:
            id: GO:0008137
            label: NADH dehydrogenase (ubiquinone) activity
          modifier: DECREASED
      selected_evidence:
        snippet: a G-to-A transition at nucleotide pair (np) 14459, changed a moderately conserved alanine
          to a valine at NADH dehydrogenase subunit 6 (ND6) residue 72
        supports: SUPPORT
