              label: Leber optic atrophy and dystonia
        context: []
      assertion_type: Inheritance
      assertion:
        name: Mitochondrial inheritance
        description: 'LDYT is caused by pathogenic variants in the mitochondrial genome and is transmitted
          down the maternal line, most often the MT-ND6 m.14459G>A variant. Both homoplasmic and heteroplasmic
          transmission have been documented, and the same homoplasmic genotype can produce markedly different
          phenotypes (asymptomatic carriage, isolated dystonia, isolated optic neuropathy, or combined
          disease) even among siblings and other close maternal relatives within one pedigree, supporting
          a role for additional nuclear genetic modifiers. Heteroplasmic de novo occurrence has also been
          reported, in which the variant is undetectable in the unaffected mother''s blood, urine sediment,
          and cultured fibroblasts.

          '
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
      selected_evidence:
        snippet: A five-generation Hispanic family expressing maternally transmitted Leber hereditary
          optic neuropathy and/or early-onset dystonia associated with bilateral basal ganglia lesions
          was studied.
        supports: SUPPORT
