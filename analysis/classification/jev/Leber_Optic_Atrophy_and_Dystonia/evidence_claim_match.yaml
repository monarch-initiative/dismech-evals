  40a25d8251da99daa6e438fa8346fe55f87f4182ac278482e0ad9a025d2b1152:
    claim:
      about:
        disease:
          name: Leber Optic Atrophy and Dystonia
          disease_term:
            preferred_term: Leber optic atrophy and dystonia
            term:
              id: MONDO:0010772
              label: Leber optic atrophy and dystonia
        context: []
      assertion_type: Subtype
      assertion:
        name: Other Complex I Loci
        display_name: Rare Allelic and Locus Heterogeneity (ND1, ND3, ND4, second ND6 site)
        description: 'A small number of unrelated families with an LDYT-like phenotype (optic atrophy,
          spastic dystonia, and basal ganglia lesions) instead carry a different complex I mtDNA variant:
          a second MT-ND6 site (m.14596T>A), MT-ND4 m.11696A>G, or MT-ND1 m.3697G>A; a further variant,
          MT-ND3 m.10197G>A, has been reported as a rare primary LHON mutation. Double mutations (e.g.,
          co-occurring MT-ND4 and MT-ND6 common LHON variants) have also produced an LDYT-like optic-neuropathy-plus-dystonia
          picture, sometimes with additional multisystem features such as transverse myelitis, illustrating
          that the clinical syndrome has meaningful locus and allelic heterogeneity beyond the single
          dominant m.14459G>A variant.

          '
        genes:
        - preferred_term: MT-ND1
          term:
            id: hgnc:7455
            label: MT-ND1
        - preferred_term: MT-ND3
          term:
            id: hgnc:7458
            label: MT-ND3
        - preferred_term: MT-ND4
          term:
            id: hgnc:7459
            label: MT-ND4
      selected_evidence:
        snippet: 'The clinical characteristics of LDYT are: optic atrophy, spastic dystonia, basal ganglia
          lesions, and nearly absent complex I activity.'
        supports: SUPPORT
    origin:
