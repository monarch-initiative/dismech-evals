          spastic dystonia, and basal ganglia lesions) instead carry a different complex I mtDNA variant:
          a second MT-ND6 site (m.14596T>A), MT-ND4 m.11696A>G, or MT-ND1 m.3697G>A; a further variant,
          MT-ND3 m.10197G>A, has been reported as a rare primary LHON mutation. Double mutations (e.g.,
          co-occurring MT-ND4 and MT-ND6 common LHON variants) have also produced an LDYT-like optic-neuropathy-plus-dystonia
          picture, sometimes with additional multisystem features such as transverse myelitis, illustrating
          that the clinical syndrome has meaningful locus and allelic heterogeneity beyond the single
          dominant m.14459G>A variant.

          '
        genes:
