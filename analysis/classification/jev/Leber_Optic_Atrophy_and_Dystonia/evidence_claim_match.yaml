          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: Enzymologic analysis of mitochondrial NADH dehydrogenase (complex I) with submitochondrial
          particles isolated from Epstein-Barr virus-transformed lymphoblasts revealed a 60% reduction
          (P < 0.005) of complex I-specific activity in patient cell lines compared with controls, with
          no differences in enzymatic activity for complexes II plus III, III and IV.
