          variants classically produce the adult-onset hypertrophic phenotype of CMH4, while biallelic
          variants that abolish cMyBP-C more completely produce the severe neonatal noncompaction phenotype
          of LVNC10. Some monoallelic carriers and their relatives show overlapping or divergent hypertrophic/noncompaction
          phenotypes within the same family.'
        distinguishing_features:
        - Biallelic (homozygous/compound heterozygous) MYBPC3 genotype and severe neonatal onset in LVNC10,
          versus the classic monoallelic, adult-onset CMH4 presentation
        - Predominant imaging phenotype is noncompacted/hypertrabeculated myocardium in LVNC10 versus
          discrete left ventricular hypertrophy in CMH4
        - LVNC10 frequently co-occurs with congenital septal defects, which are not a feature of typical
          monoallelic CMH4
      selected_evidence:
        snippet: In contrast to heterozygous pathogenic mutations, homozygous or compound heterozygous
          truncating pathogenic MYBPC3 mutations cause severe neonatal cardiomyopathy with features of
          left ventricular noncompaction and septal defects in approximately 60% of patients.
