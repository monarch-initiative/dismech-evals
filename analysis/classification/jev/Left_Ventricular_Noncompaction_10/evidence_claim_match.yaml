      reference: CGGV:assertion_7e65896e-33f5-439d-8749-aba08a539dd0-2021-10-07T160000.000Z
      reference_title: MYBPC3 / hypertrophic cardiomyopathy (Definitive)
      evidence_source: OTHER
      explanation: 'NO_EVIDENCE, deliberately: a Definitive MYBPC3-hypertrophic-cardiomyopathy curation
        says nothing either way about MYBPC3 causing noncompaction. It is carried because the contrast
        is the point - this is the strength of evidence MYBPC3 carries for the phenotype it is actually
        established for, against which the noncompaction claims in this entry should be read, and leaving
        it out would make the AR/DCM row below look like the whole ClinGen picture.'
