      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sarcomeric_dose_continuum
        hypothesis_label: Graded cMyBP-C dose sets position on one sarcomeric-cardiomyopathy continuum
        status: CANONICAL
        description: 'The prevailing reading of MYBPC3 genotype-phenotype relations: hypertrophic, noncompaction,
          restrictive and dilated presentations are positions on a single continuum, and residual functional
          cMyBP-C is the variable that sets which one a carrier occupies: a single truncating allele gives
          adult hypertrophic disease, a biallelic genotype gives severe neonatal disease with noncompaction
          and septal defects. On this account nothing qualitatively different happens at the low-dose
          end, and the LVNC phenotype is what severe sarcomeric insufficiency looks like when it strikes
          during cardiac development.

          Only one point on that curve is actually measured anywhere in this entry: approximately 20%
          residual cMyBP-C in affected cardiac tissue from a compound heterozygote carrying a loss-of-function
          allele in trans with an unstable missense allele. That is one genotype, not the truncating/
          truncating configuration the biallelic subtype is defined by, and no residual-protein figure
          is available for the heterozygous state or for truncating homozygotes. The half-dose expectation
          that the model rests on is a haploinsufficiency inference, and the isogenic premature-termination-codon
          iPSC-CMs curated under `experimental_models` cut against it directly: MYBPC3 transcript fell
          while protein did not. The model''s other weakness is that it explains a severity gradient without
          explaining a change in kind, and one family carrying a single allele can display three different
          phenotypes among its members.'
      selected_evidence:
        snippet: This report confirms the concept of the phenotypic continuum of sarcomeric cardiomyopathies
          and describes possible phenotypic patterns and their transformation over time.
        supports: SUPPORT
