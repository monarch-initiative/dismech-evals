  a8cc378c67e1fab5b51fb92a6a9eac786f29740f5ae108911aa4dd13403bac4d:
    claim:
      about:
        disease:
          name: Left Ventricular Noncompaction 10
          disease_term:
            preferred_term: left ventricular noncompaction 10
            term:
              id: MONDO:0014163
              label: left ventricular noncompaction 10
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lvnc10_dose_phenotype_divergence
        prompt: Why does near-complete biallelic loss of cMyBP-C converge on a developmental compaction-failure
          phenotype, while partial monoallelic haploinsufficiency of the same protein converges on hypertrophic
          remodeling (CMH4)?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dose-Dependent Failure of Myocardial Compaction
        rationale: 'The clinical genetics literature robustly documents the correlation between MYBPC3
          allelic dose and phenotype (biallelic loss to severe neonatal noncompaction; monoallelic loss
          to adult hypertrophic disease), but the mechanistic step converting a quantitative cMyBP-C deficit
          into a qualitatively different developmental outcome (failure of fetal myocardial compaction,
          rather than postnatal hypertrophic remodeling) is not established in the cited literature. This
          differs from the CMH4 myosin super-relaxed-state mechanism, which explains hypercontractility
          from partial haploinsufficiency but has not been shown to explain the developmental compaction
          defect at near-complete loss.

          A candidate has since been added to this entry rather than left implicit: the homozygous cMyBP-C-deficient
          mouse shows that the same protein deficit reaches a different cellular endpoint at different
          allelic dose - hyperplasia through extended postnatal myocyte division at the null dose, hypertrophy
          at the heterozygous dose - and the authors attribute this to a normal inhibitory role of cMyBP-C
          in postnatal cytokinesis. That would supply the missing qualitative step, since the extended
          proliferative window overlaps the period of trabecular-to-compact remodeling. It does not close
          the gap: the mice develop dilation rather than noncompaction, no compaction measurement is reported,
          and the extrapolation from myocyte cell-cycle behaviour to ventricular wall architecture is
          the curator''s, not the paper''s. The hypothesis is carried as `mechanistic_hypotheses#cytokinesis_brake_release`
          with status EMERGING.'
        proposed_experiments:
        - experiment_id: lvnc10_dose_dependent_compaction_study
          name: Graded cMyBP-C dosage time-course of cardiac compaction
          description: In an iPSC-derived cardiac organoid or animal model system, titrate cMyBP-C dosage
            across a graded range from full-length wild-type to near-null and compare myofibrillogenesis
            and trabecular-to-compact remodeling outcomes across the dose range, to determine whether
            a distinct low-dose threshold specifically produces a compaction failure phenotype rather
            than a hypertrophic one.
          perturbations:
          - name: Graded reduction of cMyBP-C dosage
            target: pathophysiology#MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
            description: Titrate residual cMyBP-C from wild-type through the heterozygous (~50%) and compound
              heterozygous (~20%) levels to near-null.
          readouts:
          - name: Trabecular-to-compact myocardial remodeling
            target: pathophysiology#Dose-Dependent Failure of Myocardial Compaction
            description: Ratio of noncompacted to compacted myocardial layer, measured across the dosage
              range at the end of the compaction window.
            biological_processes:
            - preferred_term: heart trabecula morphogenesis
              term:
                id: GO:0061384
                label: heart trabecula morphogenesis
          - name: Postnatal cardiomyocyte proliferation
            target: pathophysiology#Dose-Dependent Failure of Myocardial Compaction
            description: Myocyte division and mononuclear-cell accumulation across the same dosage range,
              to test whether extended proliferation tracks the compaction outcome.
            biological_processes:
            - preferred_term: cardiac muscle cell proliferation
              term:
                id: GO:0060038
                label: cardiac muscle cell proliferation
          would_support:
          - mechanistic_hypotheses#cytokinesis_brake_release
          supporting_outcome:
          - 'A discontinuity: below some residual-protein threshold the noncompacted-to-compacted ratio
            rises sharply and tracks the extension of the postnatal proliferative window, rather than
            both changing smoothly with dose.'
          would_refute:
          - mechanistic_hypotheses#cytokinesis_brake_release
          refuting_outcome:
          - Compaction and proliferation both varying smoothly and proportionally with cMyBP-C dose, with
            no threshold, which would leave the phenotype difference quantitative and support the continuum
            account instead.
      selected_evidence:
        snippet: MYBPC has unexpected inhibitory functions during postnatal myocyte cytokinesis and cell
          cycle progression.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
