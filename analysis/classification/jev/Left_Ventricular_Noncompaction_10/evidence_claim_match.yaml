    claim:
      about:
        disease:
          name: Left Ventricular Noncompaction 10
          disease_term:
            preferred_term: left ventricular noncompaction 10
            term:
              id: MONDO:0014163
              label: left ventricular noncompaction 10
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Homozygous cMyBP-C-deficient mouse (Mybpc3 t/t)
        species: Mouse
        genotype: Mybpc3 t/t (homozygous cardiac myosin binding protein C-deficient)
        publication: PMID:26153423
        genes:
        - preferred_term: MYBPC3
          term:
            id: hgnc:7551
            label: MYBPC3
        description: 'The homozygous cMyBP-C-deficient mouse is the murine counterpart of the biallelic
          MYBPC3 allelic state that defines LVNC10, and is the only model in this entry that offers a
          candidate mechanism for the dose-phenotype divergence recorded in the open discussion below.
          These mice enlarge their hearts almost twofold shortly after birth, and the enlargement is driven
          by myocyte hyperplasia rather than hypertrophy: cMyBP-C-null myocytes complete an extra round
          of postnatal cell division and accumulate as supernumerary mononuclear cells, whereas the heterozygous
          state produces hypertrophy through increased cell size. The authors propose that cMyBP-C normally
          acts as an inhibitor of postnatal myocyte cytokinesis, so that near-complete loss releases a
          proliferative program at exactly the window in which the mammalian ventricle is finishing its
          trabecular-to-compact remodeling.'
        modeled_mechanisms:
        - target: MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The homozygous null genotype reproduces the allelic state the biallelic human genotype
            produces, and the paper makes the mono- versus bi-allelic dose contrast explicitly.
          limitations: Neither the cited abstract nor this entry has a residual-protein figure for the
            mouse, so "near-complete depletion" is inferred from the null genotype rather than measured;
            the readout available is gross cardiac enlargement, an organ-level proxy standing in for a
            molecular node. The mouse also survives to adulthood, where the equivalent human genotype
            is fatal within months.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The measured quantity is postnatal heart size. The node's quantity is residual
              functional cMyBP-C protein, which this report does not quantify in either species.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The murine allele is a targeted truncation rather than one of the human MYBPC3
              alleles curated here, and the mouse tolerates the null state into adulthood where human
              biallelic carriers do not survive infancy.
          readouts:
          - name: Postnatal heart size
            target: MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
            description: Gross cardiac enlargement measured in homozygous null mice shortly after birth,
              against wild-type littermates.
            direction: INCREASED
            interpretation: 'An organ-level proxy for the molecular node: it confirms the null genotype
              produces an overt cardiac phenotype in the neonatal window, matching the timing of the human
              biallelic presentation, but it does not measure residual cMyBP-C.'
        - target: Dose-Dependent Failure of Myocardial Compaction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: The model reproduces the allelic dose and the neonatal timing of the human compaction
            phenotype, and supplies a cellular mechanism - failure of postnatal myocyte cell-cycle exit
            - that could plausibly divert ventricular wall maturation. It does not reproduce the noncompaction
            phenotype itself.
          limitations: The mouse phenotype is cardiac dilation with myocyte hyperplasia, not a persistently
            hypertrabeculated, noncompacted ventricular wall; the abstract reports no trabecular-to-compact
            remodeling measurement. Homozygous null mice also survive into adulthood, where the human
            biallelic genotype is lethal within months. Treating the cytokinesis finding as the explanation
            of human compaction failure is an inference the cited work does not make.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The measured quantity is the number of postnatal myocyte divisions and the resulting
              count of mononuclear myocytes. The node's quantity is the extent of trabecular-to-compact
              remodeling of the ventricular wall. Extra cell divisions are a candidate upstream cause
              of a compaction defect, not a measurement of one.
          - divergence_type: SCALE_EXTRAPOLATION
            materiality: QUALIFYING
            description: The model observes cell-cycle behaviour in individual cardiomyocytes (CELLULAR);
              the node is the tissue-level architecture of the ventricular wall (TISSUE). The step from
              supernumerary myocytes to a noncompacted wall is not observed in this model.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Murine and human ventricular compaction differ in timing relative to birth, and
              the mouse null survives to adulthood while the equivalent human genotype is fatal in the
              first months of life, so the postnatal-proliferation window the model exploits may not be
              the window in which the human phenotype is set.
          readouts:
          - name: Mononuclear cardiomyocyte number in the postnatal window
            target: Dose-Dependent Failure of Myocardial Compaction
            description: Count of myocytes completing an additional postnatal division within 10 days
              of birth, compared with wild-type littermates.
            biological_processes:
            - preferred_term: cardiac muscle cell proliferation
              term:
                id: GO:0060038
                label: cardiac muscle cell proliferation
              modifier: INCREASED
            direction: INCREASED
            interpretation: 'The cellular readout standing in for the compaction node: extended postnatal
              proliferation is the model''s proposed route from cMyBP-C loss to abnormal ventricular wall
              maturation.'
      selected_evidence:
        snippet: MYBPC has unexpected inhibitory functions during postnatal myocyte cytokinesis and cell
          cycle progression.
        supports: SUPPORT
