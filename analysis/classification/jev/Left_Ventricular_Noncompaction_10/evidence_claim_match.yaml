              label: left ventricular noncompaction 10
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cytokinesis_brake_release
        hypothesis_label: Near-complete cMyBP-C loss releases an inhibitory brake on postnatal myocyte
          cytokinesis
        status: EMERGING
        description: 'A mechanistically distinct account of why the low-dose end diverges in kind rather
          than only in degree. In homozygous cMyBP-C-deficient mice, myocytes complete an extra round
          of division after birth and accumulate as supernumerary mononuclear cells; the heart enlarges
          by hyperplasia, whereas the heterozygous state enlarges it by hypertrophy. The authors conclude
          that cMyBP-C normally inhibits postnatal myocyte cytokinesis. If that inhibition is dose-sensitive,
          near-complete loss would extend the proliferative window across precisely the period in which
          the ventricle finishes converting trabecular to compact myocardium, offering a route from a
          quantitative protein deficit to a qualitatively different developmental outcome. This is a hypothesis
          about the human disease, not a finding in it: the mice develop dilation, not noncompaction,
          and no compaction measurement is reported. A zebrafish cMyBP-C knockout shows the same cardiomyocyte
          hyperplasia, so the proliferative response is at least conserved rather than murine. That strengthens
          the first half of the hypothesis and cuts against the second: in the fish the extra cardiomyocytes
          accompany a thicker, more compact ventricular wall, which is the opposite of a compaction failure.
          Whatever routes hyperplasia to noncompaction in humans, if anything does, is not supplied by
          either model.'
      selected_evidence:
        snippet: However, the mechanism leading to hypertrophic cardiomyopathy in heterozygous MYBPC3(+/-)
          individuals is myocyte hypertrophy (increased cell size), whereas the mechanism leading to cardiac
          dilation in homozygous Mybpc3(-/-) mice is primarily myocyte hyperplasia.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26153423
      reference_title: Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis.
      evidence_source: MODEL_ORGANISM
      explanation: The mono- versus bi-allelic divergence in cellular mechanism that this hypothesis generalizes
