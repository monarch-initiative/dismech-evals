      assertion:
        name: Mybpc3-targeted knock-in mouse (homozygous exon 6 G>A)
        species: Mouse
        genotype: Mybpc3 knock-in, homozygous G>A transition in exon 6
        publication: PMID:23716398
        genes:
        - preferred_term: MYBPC3
          term:
            id: hgnc:7551
            label: MYBPC3
        description: 'A homozygous Mybpc3 knock-in mouse carrying a single point mutation that generates
          three aberrant mRNAs, developed as a hypertrophic-cardiomyopathy model but genotypically in
          the biallelic regime this entry curates. It is included here for the therapeutic arm: AAV-delivered
          U7snRNA antisense constructs that mask splicing enhancers in exons 5 and 6 shifted splicing
          toward a functional variant and, injected in newborns, abolished cardiac dysfunction and prevented
          hypertrophy. This is the only demonstration in this entry that a biallelic Mybpc3 cardiac phenotype
          is preventable if the protein deficit is corrected in the neonatal window.'
        modeled_mechanisms:
        - target: Neonatal Structural Cardiac Failure
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Neonatal AAV-U7-AON treatment prevented the cardiac dysfunction and hypertrophy
            that this homozygous Mybpc3 genotype otherwise produces, establishing the neonatal window
            as a point of intervention on the organ-level failure node.
          limitations: The rescued phenotype is hypertrophy with cardiac dysfunction, not noncompaction,
            so the experiment shows that a biallelic Mybpc3 cardiac phenotype is correctable rather than
            that the human LVNC10 compaction defect specifically is. The authors also report the effect
            as transient and requiring optimization, and the construct is exon-6-specific, so it would
            not transfer to the human truncating alleles curated in this entry without redesign.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The corrected lesion is a mouse exon-6 splice-shifting point mutation. The human
              LVNC10 alleles are frameshift and nonsense variants distributed across the gene, for which
              this exon-skipping strategy offers no direct route.
          - divergence_type: TEMPORAL_SCOPE
            materiality: QUALIFYING
            description: The rescue is reported as transient, so the experiment bounds a short-term prevention
              window and says nothing about durable correction of the organ-level failure node.
          readouts:
          - name: Left ventricular hypertrophy and cardiac function after neonatal AAV-U7-AON
            target: Neonatal Structural Cardiac Failure
            description: Cardiac function and left ventricular hypertrophy assessed in homozygous KI mice
              injected as newborns with AAV-U7-AON-5+6.
            direction: RESTORED
            interpretation: Prevention of the organ-level failure phenotype when the protein deficit is
              corrected neonatally.
      selected_evidence:
        snippet: KI mice carry a homozygous G>A transition in exon 6, which results in three different
          aberrant mRNAs.
        supports: SUPPORT
