  c9bb845a4b2b3f1d3fed026c38e8cfa8a806112fba277923fb454ad6b07ba450:
    claim:
      about:
        disease:
          name: Left Ventricular Noncompaction 10
          disease_term:
            preferred_term: left ventricular noncompaction 10
            term:
              id: MONDO:0014163
              label: left ventricular noncompaction 10
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lvnc10_no_model_shows_noncompaction
        prompt: Does any available model system actually reproduce the noncompaction phenotype of LVNC10,
          or only the genotype and the lethality?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Dose-Dependent Failure of Myocardial Compaction
        - animal_models#Homozygous cMyBP-C-deficient mouse (Mybpc3 t/t)
        - animal_models#Compound heterozygous MYBPC3 cloned pig
        - animal_models#mybpc3 knockout zebrafish
        - experimental_models#Biallelic MYBPC3 truncating hiPSC line with isogenic control
        rationale: 'Of the models attached here, four reach a biallelic or null MYBPC3 state and none
          reaches the phenotype the entity is named for. The homozygous cMyBP-C-deficient mouse dilates;
          the compound heterozygous cloned pig hypertrophies and dies perinatally; the zebrafish knockout
          makes its ventricle *more* compact, with a thicker wall, which is the opposite failure; the
          biallelic hiPSC line is a resource report with no phenotype assayed, and its two-dimensional
          cardiomyocytes have no ventricular wall in which compaction could be scored. (The remaining
          human line, the premature-termination-codon iPSC-CMs, is heterozygous and does not reach the
          allelic state at all.) So the defining lesion of this entity - persistence of a noncompacted,
          hypertrabeculated ventricular wall - currently rests entirely on human imaging and autopsy,
          with no experimental system in which it can be perturbed or rescued.

          This is a mismatch worth stating rather than a gap in curation. The mouse and pig phenotypes
          are not merely weaker versions of the human one, they are different phenotypes, and in the zebrafish
          the difference is one of sign rather than degree. Species differences in the timing of ventricular
          compaction relative to birth are a plausible reason. Until a model reproduces the compaction
          defect, therapeutic inferences from the rescue experiments in this entry - the neonatal exon-skipping
          rescue and the Tet-Off reversibility result - bear on contractile and hypertrophic phenotypes,
          not on whether a compaction defect is preventable or reversible.

          Two 2024 human systems surfaced by the same deep-research pass were left out and the reason
          belongs here rather than nowhere: MYBPC3 p.D389V cardiac organoids showing mavacamten-reversible
          hypercontractility (doi:10.3390/cells13221913), and MYBPC3 c.1377delC iPSC-CM metabolic remodeling
          (doi:10.1038/s41598-024-62530-0). Both are heterozygous missense- or single-frameshift-allele
          HCM systems, further from the biallelic genotype than the lines curated above, and neither scores
          compaction. The organoid one is worth revisiting, since a cardiac organoid is exactly the system
          the experiment proposed below would need. The report also surfaced NCT06024759, a generic-LVNC
          risk registry with no MYBPC3-specific arm, which is why `clinical_trials` remains empty.'
        proposed_experiments:
        - experiment_id: lvnc10_compaction_competent_model
          name: Compaction-competent biallelic MYBPC3 model
          description: Establish a system in which trabecular-to-compact remodeling can be scored under
            a biallelic MYBPC3 genotype - an engineered heart tissue or cardiac organoid taken through
            the compaction window, or an embryonic time course in a species whose compaction completes
            prenatally as it does in humans - and determine whether the noncompacted phenotype appears
            at all.
          readouts:
          - name: Noncompacted-to-compacted layer ratio
            target: pathophysiology#Dose-Dependent Failure of Myocardial Compaction
            description: The imaging measurement used to diagnose the human phenotype, applied to the
              model system.
          would_refute:
          - pathophysiology#Dose-Dependent Failure of Myocardial Compaction
          refuting_outcome:
          - A biallelic model that completes normal compaction would argue the human noncompaction finding
            is a secondary or modifier-dependent feature rather than a direct consequence of cMyBP-C loss,
            which is what the population burden analysis already hints at for the monoallelic state.
      selected_evidence:
        snippet: Homozygous cardiac myosin binding protein C-deficient (Mybpc(t/t)) mice develop dramatic
          cardiac dilation shortly after birth; heart size increases almost twofold.
        supports: SUPPORT
        directness: INDIRECT
