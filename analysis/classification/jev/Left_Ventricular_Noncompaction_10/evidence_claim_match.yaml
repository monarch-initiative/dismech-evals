              case series of four unrelated neonates, combined with a literature review totaling 21 reported
              patients with biallelic truncating MYBPC3 mutations, found that all were diagnosed with
              severe cardiomyopathy and/or died within the first few months of life, with noncompaction
              features in three of the four newly reported cases and septal defects or a patent ductus
              arteriosus in 62% of the pooled cohort. Obligate heterozygous parents are typically asymptomatic
              or only mildly affected, so the phenotype behaves recessively at this severity threshold
              even though the single-allele state is itself the classic dominant CMH4 disease allele.'
