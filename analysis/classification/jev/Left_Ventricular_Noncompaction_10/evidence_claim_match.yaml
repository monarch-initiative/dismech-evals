      evidence_source: HUMAN_CLINICAL
      explanation: 'Support with a caveat: despite the article''s own title using "biallelic" to mean
        two genes (MYBPC3 plus MYH7), the genotype described is digenic rather than biallelic within MYBPC3
        itself - the proband carries a heterozygous MYBPC3 variant together with a separate heterozygous
        MYH7 variant, and her sister carries only the heterozygous MYBPC3 variant. It is curated here,
        not under the biallelic subtype, as further evidence that a single heterozygous MYBPC3 allele
        (optionally alongside a second cardiomyopathy-gene variant) associates with an LVNC phenotype
        in a family setting, consistent with the genetic-heterogeneity picture this subtype already documents.'
