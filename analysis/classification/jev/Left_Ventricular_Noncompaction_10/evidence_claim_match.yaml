          Cardiomyopathy 4); the LVNC10 phenotype is most consistently associated with biallelic (homozygous
          or compound heterozygous) truncating variants that produce a much greater loss of functional
          protein than the monoallelic haploinsufficiency state that typically causes CMH4.

          Qualification: a large rare-variant case-control study (840 LVNC cases vs. 125,748 gnomAD population
          controls) did not find MYBPC3 among the genes showing LVNC-specific enrichment - only truncating
          variants in MYH7, ACTN2, and PRDM16 were uniquely associated with LVNC in that analysis. This
          is consistent with the LVNC phenotype seen in MYBPC3 carriers more often reflecting the well-established
          MYBPC3-HCM relationship "showing through" as a noncompaction-type imaging finding, rather than
          MYBPC3 driving a population-validated, distinct LVNC etiology the way MYH7/ACTN2/PRDM16 do.
          It does not contradict the biallelic-dose evidence directly documenting near-complete cMyBP-C
          loss causing severe neonatal noncompaction (Wessels 2015; Kolokotronis 2019) - those are individually
          reported biallelic/compound-heterozygous pedigrees, a different allelic regime from a heterozygous-carrier
          case-control burden test - but it is a genuine caveat against treating monoallelic MYBPC3 as
          an LVNC-specific gene in the same sense as MYH7/ACTN2/PRDM16.

          ClinGen has never curated a MYBPC3-LVNC gene-disease relationship. What it has curated is the
          pair of relationships either side of this entity: an AD MYBPC3-hypertrophic-cardiomyopathy relationship
          classified Definitive, and - separately, and directly covering the biallelic regime this entry
          models - an AR MYBPC3-dilated-cardiomyopathy relationship classified only Limited. Because OMIM
          files LVNC10 with "cardiomyopathy, dilated, 1MM" under one MIM number, that AR/Limited row is
          the closest thing to an expert-panel verdict on the genotype curated here, and it is a weak
          one. Both assertions are cited below.'
      selected_evidence:
        snippet: MYBPC3 | HGNC:7551 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive |
          SOP8 | Hereditary Cardiovascular Disease Gene Curation Expert Panel | 2021-10-07T16:00:00.000Z
        supports: NO_EVIDENCE
