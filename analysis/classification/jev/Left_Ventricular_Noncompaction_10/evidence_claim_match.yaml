            description: 'MYBPC3 encodes cardiac myosin-binding protein C (cMyBP-C), a thick-filament
              accessory protein of the sarcomeric A band. As in CMH4, most MYBPC3 disease alleles are
              truncating (frameshift, nonsense, or splice variants), the truncated peptide is not stably
              detected in patient myocardium, and the operative consequence is reduced functional cMyBP-C
              protein rather than a dominant-negative poison peptide (see kb/disorders/Hypertrophic_Cardiomyopathy_4.yaml
              for the detailed nonsense-mediated-decay/proteasomal-degradation mechanism, which is shared
              with this entry). What differs in LVNC10 is allelic dose: a single truncating allele produces
              the classic CMH4 haploinsufficiency state (roughly 50% residual protein), while two loss-of-function
              alleles, or a loss-of-function allele combined with a destabilizing missense allele on the
              second copy, can reduce residual cMyBP-C to as little as ~20% of normal.'
