  e34f606a3664273608545fdf87dd0f1855d94c0cfc6ccff1cf34cd987b926958:
    claim:
      about:
        disease:
          name: Left Ventricular Noncompaction 10
          disease_term:
            preferred_term: left ventricular noncompaction 10
            term:
              id: MONDO:0014163
              label: left ventricular noncompaction 10
        context: []
      assertion_type: Subtype
      assertion:
        name: Monoallelic MYBPC3 LVNC
        display_name: Monoallelic (heterozygous) MYBPC3 LVNC
        description: A single heterozygous MYBPC3 variant - the same class of allele that underlies hypertrophic
          cardiomyopathy 4 (CMH4) - can also present with, or co-segregate with, a noncompaction phenotype
          rather than pure hypertrophy, particularly in families that also carry an unambiguous HCM phenotype
          in relatives. In a family-screening study of 143 noncompaction cardiomyopathy index cases, the
          specific subgroup with noncompaction co-occurring with left ventricular hypertrophy was significantly
          associated with MYBPC3 variants and with hypertrophic cardiomyopathy (without noncompaction)
          in relatives, distinguishing it from the MYH7-associated noncompaction-with-dilation subgroup.
          Case reports also document a single truncating MYBPC3 allele producing hypertrophic, noncompaction,
          and restrictive phenotypes across different members of one family.
      selected_evidence:
        snippet: NCCM with HCM (4%) was associated with MYBPC3 and HCM without NCCM in relatives (p <
          0.001).
        supports: SUPPORT
    origin:
