  5abc9720695a69bc07f5cc12ffc0abfb1d2112183676d890359c4dd8d231bc52:
    claim:
      about:
        disease:
          name: Left Ventricular Noncompaction 8
          disease_term:
            preferred_term: left ventricular noncompaction 8
            term:
              id: MONDO:0014152
              label: left ventricular noncompaction 8
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Prdm16Q187X knock-in mouse
        species: Mouse
        genotype: Prdm16Q187X knock-in (heterozygous Prdm16Q187X/WT and homozygous Prdm16Q187X/Q187X)
        genes:
        - preferred_term: PRDM16
          term:
            id: hgnc:14000
            label: PRDM16
        publication: PMID:38113297
        description: CRISPR-mediated knock-in of the patient-derived Q187X nonsense allele, generated
          alongside iPSC-cardiomyocytes from the proband carrying the same variant. It is the only mouse
          in this entry built on a specific human LVNC8 allele rather than on gene deletion (the zebrafish
          model also expresses a human truncation allele), which makes it the strongest available mammalian
          test of allele-level causality. Homozygotes are embryonically lethal with an underdeveloped
          compact myocardium; heterozygotes show fibrosis and age-dependent loss of TGF-beta expression,
          but smaller rather than dilated ventricles.
        modeled_mechanisms:
        - target: Failed Ventricular Compaction
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Homozygous Q187X animals fail to develop a normal compact myocardium, tying the
            human nonsense allele directly to the compaction defect.
          limitations: 'The compaction phenotype requires the homozygous state, which is embryonically
            lethal and has no human counterpart: LVNC8 patients are heterozygous. The allele''s compaction
            effect in mice is therefore demonstrated at a dose humans never carry.'
        - target: TGF-beta Signaling Dysregulation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: MOLECULAR
          description: 'Heterozygotes do show TGF-beta dysregulation, but in the opposite direction from
            this node: TGF-beta expression falls with age, where losing a repressor of TGFB3 predicts,
            and the node asserts, an increase.'
          limitations: 'This is a direction mismatch on the node''s asserted quantity rather than a missing
            measurement, which is why the link is FAILS_TO_RECAPITULATE and not PARTIALLY_RECAPITULATES:
            the model moves the opposite way. It also conflicts with the cardiac-specific Prdm16 null
            model below, where TGF-beta signaling is activated, and with the patient-derived iPSC-cardiomyocytes,
            whose proliferative deficit is attributed to TGF-beta activation. Allele class, dose, Cre
            driver and age at measurement all differ across these systems. This paper''s own proposal
            is that PRDM16 regulates TGF-beta bidirectionally in a temporally-dependent manner, which
            would reconcile them; until that is tested across models this link must not be used to infer
            the direction of the TGF-beta change in patients at any given stage. See discussion gap_lvnc8_tgfbeta_direction_conflict.'
          readouts:
          - name: Myocardial TGF-beta expression
            target: TGF-beta Signaling Dysregulation
            description: Transcriptional analysis of Prdm16Q187X/WT hearts across age.
            direction: DECREASED
            interpretation: An age-dependent fall in TGF-beta expression is the measured dysregulation
              in this model.
        - target: Myocardial Fibrosis
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: The genotype-matched heterozygote develops heightened myocardial fibrosis, the
            one component of the human phenotype this model reproduces cleanly.
          limitations: Fibrosis is reported qualitatively as heightened, without a quantitative collagen
            measure, and no human myocardial fibrosis data exist for PRDM16 carriers to compare against.
        - target: Left Ventricular Dilation and Systolic Dysfunction
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: The heterozygous state matching the human genotype produces smaller ventricular
            dimensions, the opposite of the ventricular dilation seen in patients carrying this class
            of variant.
          limitations: 'This is a substantive negative result, not a gap in phenotyping: the heterozygous
            Q187X mouse is the genotype-matched animal and it diverges in direction from the human phenotype
            on this node. Ventricular dimensions from this model must not be used to infer human chamber
            remodeling, and any therapeutic inference about reverse remodeling drawn from it would be
            inverted. Fibrosis is reproduced, so the model remains informative for the fibrotic component
            while failing on chamber size.'
          readouts:
          - name: Ventricular chamber dimensions
            target: Left Ventricular Dilation and Systolic Dysfunction
            description: Echocardiographic and histological ventricular dimensions in Prdm16Q187X/WT mice
              versus wild-type littermates.
            direction: DECREASED
            interpretation: Decreased chamber dimension in the model against dilation in patients is the
              direction mismatch that makes this a failure to recapitulate.
      selected_evidence:
        snippet: CRISPR (clustered regularly interspaced short palindromic repeats)-mediated knock-in
          mouse model hosting the Prdm16Q187X allele was generated and subjected to ECG, histological,
          and transcriptional analysis.
        supports: SUPPORT
