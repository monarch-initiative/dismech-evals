      assertion_type: Discussion
      assertion:
        discussion_id: gap_lvnc8_noncompaction_vs_dcm_nosology
        prompt: Is PRDM16-associated cardiomyopathy best classified as a form of left ventricular noncompaction,
          a form of dilated cardiomyopathy, or a single genotype that produces a phenotypic spectrum spanning
          both labels?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Failed Ventricular Compaction
        - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
        rationale: 'MONDO:0014152 is defined through the DCM axis ("any familial isolated dilated cardiomyopathy...caused
          by...PRDM16") even though its label and OMIM entry (615373) foreground noncompaction. The primary
          literature resolves this as a genuine spectrum rather than a labeling error: the founding report
          found PRDM16 mutations in both nonsyndromic LVNC and DCM cohorts, a large systematic rare-variant
          study found PRDM16 (with MYH7 and ACTN2) uniquely enriched in LVNC specifically among cardiomyopathy
          genes, a contemporary review reports that missense variants track with DCM while nonsense/frameshift
          variants track with LVNC, and mouse/human mechanistic work shows PRDM16 loss produces both noncompaction
          (failure of compact-myocardium specification) and LV dilation (impaired cardiomyocyte proliferation
          and TGF-beta-driven remodeling) from the same lesion. This dismech entry curates LVNC8 as its
          own genotype-defined node distinct from the polygenic LVNC umbrella entry, modeling both the
          noncompaction and the dilation/heart-failure branches as parallel downstream consequences of
          the same PRDM16 lesion rather than picking one label over the other.'
      selected_evidence:
        snippet: In contrast, truncating variants in MYH7, ACTN2, and PRDM16 were uniquely associated
          with LVNC and may reflect a distinct LVNC etiology.
        supports: SUPPORT
