        context: []
      assertion_type: AnimalModel
      assertion:
        name: Prdm16 cardiomyocyte-specific deletion mouse (conduction-system phenotype)
        species: Mouse
        genotype: Prdm16lox/lox;Sm22alpha-Cre (called Prdm16cKO in the paper), deleting Prdm16 exon 9
          in cardiomyocytes from early cardiac development onward
        genes:
        - preferred_term: PRDM16
          term:
            id: hgnc:14000
            label: PRDM16
        publication: PMID:39304345
        description: 'An independently generated cardiomyocyte-specific Prdm16 deletion, analysed by combined
          single-cell RNA and ATAC sequencing. It is kept separate from the Prdm16cKO model above because
          it interrogates a different arm of the mechanism: rather than the compact-versus-trabecular
          axis, it establishes that PRDM16 suppresses conduction-system and atrial fates, and that its
          loss expands the distal ventricular conduction system. This is the only in vivo source for the
          conduction and arrhythmia arm of this entry.'
        modeled_mechanisms:
        - target: Ventricular Conduction System Hyperplasia and Atrial-Fate Derepression
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: TISSUE
          description: Developmental myocardial Prdm16 loss expands the distal ventricular conduction
            system, the structural change this node asserts.
          limitations: 'The Sm22alpha-Cre driver is not cardiomyocyte-exclusive: the authors report that
            it also eliminates PRDM16 in smooth muscle cells, and argue the cardiomyocyte loss is the
            primary culprit on the grounds that smooth muscle coverage was unaffected. Deletion is also
            developmental, where patients carry partial lifelong haploinsufficiency; whether that produces
            conduction-system expansion of comparable extent has not been shown, and no human histological
            counterpart is available.'
          readouts:
          - name: Distal ventricular conduction system extent
            target: Ventricular Conduction System Hyperplasia and Atrial-Fate Derepression
            description: Histological and single-cell assessment of conduction-system tissue within the
              ventricular myocardium.
            direction: INCREASED
            interpretation: Hyperplasia of the distal conduction system is the direct measurement behind
              this node.
        - target: Arrhythmia and Ventricular Pre-excitation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The model develops abnormal postnatal electrophysiology and premature death, giving
            an in vivo arrhythmic phenotype downstream of the conduction-system expansion.
          limitations: The model reports abnormal electrophysiology and premature death, not ventricular
            pre-excitation specifically. The accessory-pathway phenotype that names this node is documented
            in a human PRDM16 carrier and has no demonstrated counterpart in this mouse, so the model
            supports the arrhythmia half of the node and not the pre-excitation half.
          readouts:
          - name: Postnatal cardiac electrophysiology
            target: Arrhythmia and Ventricular Pre-excitation
            description: Electrophysiological assessment of postnatal hearts after cardiomyocyte-specific
              Prdm16 deletion.
            direction: ALTERED
            interpretation: Abnormal postnatal electrophysiology culminating in premature death is the
              arrhythmic outcome this model reports.
      selected_evidence:
        snippet: By combined RNA+ATAC single-cell sequencing, we found that PRDM16 favors ventricular
          working cardiomyocyte identity, by opposing the activity of master regulators of ventricular
          conduction and atrial fate.
        supports: SUPPORT
