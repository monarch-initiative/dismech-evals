      assertion_type: Discussion
      assertion:
        discussion_id: gap_lvnc8_tgfbeta_direction_conflict
        prompt: Does loss of PRDM16 raise or lower TGF-beta signaling in the myocardium, and which direction
          operates in human LVNC8?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#TGF-beta Signaling Dysregulation
        - pathophysiology#Impaired Cardiomyocyte Proliferation
        rationale: 'The mechanistic premise is that PRDM16 represses TGFB transcription, so losing it
          should de-repress the pathway. A cardiac-specific Prdm16 null mouse shows exactly that: raised
          Tgfb1-3 transcripts and increased phospho-Smad2. The heterozygous Prdm16Q187X knock-in, which
          is the genotype-matched model for a human LVNC8 patient, instead shows an age-dependent loss
          of TGF-beta expression. Human patient-derived iPSC-cardiomyocytes sit on the activation side,
          since their proliferative deficit is attributed to abnormal activation of TGF-beta signalling.
          The models differ in allele class (complete cardiac null versus heterozygous nonsense), dose,
          Cre driver, and the age at which TGF-beta was measured, and no study has compared them directly.
          Cre driver is worth naming among these: the authors of the ventricular-identity study state
          that using different Cre driver strains made the phenotypic outcome of Prdm16 animal studies
          highly heterogeneous, and the 1p36 cohort paper reports that Myh6-Cre knockouts alone gave hypertrophy
          in one model and LV dilation in another. A reconciliation has in fact been proposed: the Q187X
          paper concludes that PRDM16 regulates TGF-beta bidirectionally in a temporally-dependent manner,
          which would make activation and age-dependent loss two phases of one mechanism rather than a
          contradiction. That proposal is this entry''s leading candidate but has not been tested against
          the other models, so the sign at any given developmental stage in patients remains open. This
          matters beyond bookkeeping because TGF-beta inhibition reversed the proliferative phenotype
          in the iPSC system and so is the one mechanistically motivated therapeutic direction in this
          entry; a mistaken sign would point that intervention the wrong way. Note also that TGF-beta
          receptor inhibition did not reverse the conduction abnormality in the null mouse, so even where
          the pathway is activated it does not account for the whole phenotype.'
      selected_evidence:
        snippet: Possible explanations for these variations include efficiency of the Cre driver, the
          cell type(s) in which Prdm16 is deleted, the timing of deletion, and background genetic effects.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/4
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37395136
      reference_title: 'PRDM16 Deletion Is Associated With Sex-dependent Cardiomyopathy and Cardiac Mortality:
        A Translational, Multi-Institutional Cohort Study.'
      evidence_source: MODEL_ORGANISM
      explanation: 'Names the technical variables that plausibly generate divergence between Prdm16 knockout
        studies, which is why this discussion lists Cre driver and timing alongside allele class. Directness
        is INDIRECT: the authors offer these for phenotypic variation across Prdm16 models generally,
        not for the TGF-beta direction conflict specifically.'
