      assertion:
        name: TGF-beta Signaling Dysregulation
        biological_scale: MOLECULAR
        role: effector
        description: 'PRDM16 normally binds the TGFB3 promoter and represses its transcription. Loss of
          PRDM16 releases this repression, producing increased TGF-beta receptor signaling in cardiomyocytes.
          Because TGF-beta signaling has an antiproliferative effect on cardiomyocytes, its dysregulated
          increase reduces cardiomyocyte proliferative capacity during the developmental window when compaction
          normally occurs. The INCREASED modifier records the majority position, supported by the promoter-repression
          mechanism, by patient-derived iPSC-cardiomyocytes, and by TGF-beta activation in Prdm16-null
          hearts. It is not unanimous: the genotype-matched heterozygous Prdm16Q187X mouse instead loses
          TGF-beta expression with age, and that model is linked below as FAILS_TO_RECAPITULATE this node.
          The unresolved sign is tracked in discussion gap_lvnc8_tgfbeta_direction_conflict and matters
          because TGF-beta inhibition is the one mechanistically motivated therapeutic direction this
          entry identifies.'
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: Mechanistic studies were undertaken in H9c2 cardiomyoblasts to show that PRDM16 binds
          TGFB3 promoter and represses its transcription.
        supports: SUPPORT
