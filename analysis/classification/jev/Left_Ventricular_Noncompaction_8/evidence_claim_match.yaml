  62639734939650e5ad4baa4d8012fd0f3365798c0b1b716962d346e2ce2d8f01:
    claim:
      about:
        disease:
          name: Left Ventricular Noncompaction 8
          disease_term:
            preferred_term: left ventricular noncompaction 8
            term:
              id: MONDO:0014152
              label: left ventricular noncompaction 8
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_lvnc8_female_predominance
        prompt: Why is PRDM16-associated cardiomyopathy more severe in females, and does the sex effect
          seen in 1p36 deletion carriers extend to nonsyndromic LVNC8?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Left Ventricular Dilation and Systolic Dysfunction
        - pathophysiology#Cardiac Metabolic Dysregulation
        rationale: 'A female-predominant severity signal appears independently in two mouse lines and
          in patients. Monoallelic Prdm16csp1/wt mice show diminished systolic performance that is more
          pronounced in females, alongside sex-divergent cardiac metabolism: triacylglycerides accumulate
          only in male hearts, and metabolic modelling assigns reduced fatty acid utilisation to males
          and lower glucose utilisation to females. A separately generated cardiac-specific Prdm16 knockout
          shows sex differences in the incidence and severity of contractile dysfunction and fibrosis,
          with significantly elevated mortality in females. In the human 1p36 deletion cohort the same
          direction appears, 34.5% of PRDM16-deleted females developing cardiomyopathy versus 16.7% of
          males, though that comparison did not reach significance at the available sample size. What
          is missing is a mechanism connecting the sex-divergent substrate utilisation to the sex-divergent
          contractile outcome, and any test of the effect in nonsyndromic PRDM16 variant carriers, where
          every published cohort is too small to stratify by sex. Until then, sex should not be used to
          stratify surveillance in LVNC8.'
      selected_evidence:
        snippet: Among those PRDM16 deleted, 34.5% of females developed cardiomyopathy versus 16.7% of
