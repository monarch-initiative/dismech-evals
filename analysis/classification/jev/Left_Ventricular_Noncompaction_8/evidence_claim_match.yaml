      assertion_type: AnimalModel
      assertion:
        name: Cardiac-specific Prdm16 conditional knockout mouse (conduction and fibrosis phenotype)
        species: Mouse
        genotype: Cardiac-specific Prdm16 conditional knockout via alpha-MHC (Myh6)-Cre (Prdm16-null hearts);
          the driver is not named in this paper's own abstract-only record here and is attributed by PMID:37395136,
          which identifies its model as similar to Nam et al's Myh6-Cre knockout
        genes:
        - preferred_term: PRDM16
          term:
            id: hgnc:14000
            label: PRDM16
        publication: PMID:32083975
        description: 'Cardiac-restricted Prdm16 null model phenotyped by electrocardiography, fibrosis
          histology and left ventricular RNA sequencing. It is the only model in this entry that measures
          TGF-beta pathway activity in vivo and then tests it pharmacologically: TGF-beta signaling is
          activated in Prdm16-null hearts, but blocking the TGF-beta receptor does not rescue the conduction
          defect. That negative rescue result separates the fibrotic and conduction arms of the mechanism,
          and the accompanying ion-channel transcript dysregulation offers a TGF-beta-independent route
          to the arrhythmia node.'
        modeled_mechanisms:
        - target: TGF-beta Signaling Dysregulation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: TGF-beta signaling is activated in Prdm16-null hearts at both ligand transcript
            and downstream effector level, the direction predicted by PRDM16 acting as a repressor of
            TGFB transcription.
          limitations: 'This model''s direction conflicts with the Prdm16Q187X heterozygote, which shows
            age-dependent loss of TGF-beta expression. The two differ in allele class (complete cardiac
            null versus a heterozygous nonsense variant), dose and timepoint. The Q187X paper proposes
            that PRDM16 regulates TGF-beta bidirectionally in a temporally-dependent manner, which would
