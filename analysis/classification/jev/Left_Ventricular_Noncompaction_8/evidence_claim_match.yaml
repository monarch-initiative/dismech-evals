  e7f2badce9a5d5ec6279ba8d87a58f0511b02de39ae449ac7aa1f1c14c3aa683:
    claim:
      about:
        disease:
          name: Left Ventricular Noncompaction 8
          disease_term:
            preferred_term: left ventricular noncompaction 8
            term:
              id: MONDO:0014152
              label: left ventricular noncompaction 8
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Prdm16csp1/wt systemic monoallelic mouse
        species: Mouse
        genotype: Prdm16csp1/wt (systemic, monoallelic Prdm16 inactivation)
        genes:
        - preferred_term: PRDM16
          term:
            id: hgnc:14000
            label: PRDM16
        publication: PMID:37842925
        description: 'Systemic heterozygous Prdm16 inactivation, the closest genotype match in this entry
          to the human heterozygous state. Profiled by transcriptomics, proteomics and metabolomics in
          both sexes to capture the earliest pathological window rather than end-stage disease. It is
          the source of the metabolic arm of the LVNC8 mechanism and of the sex-dimorphism observation:
          female animals are more severely affected.'
        modeled_mechanisms:
        - target: Cardiac Metabolic Dysregulation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Metabolomic profiling of cardiac tissue defines the substrate-utilization and oxidative-stress
            changes this node asserts, at the earliest detectable stage.
          limitations: The metabolic phenotype is sex-dimorphic in this model and no equivalent human
            cardiac metabolomic data exist for PRDM16 carriers, so neither the magnitude nor the sex dependence
            has been confirmed in patients.
          readouts:
          - name: Cardiac glutathione and inosine monophosphate
            target: Cardiac Metabolic Dysregulation
            description: Targeted metabolomics of Prdm16csp1/wt cardiac tissue.
            direction: ALTERED
            interpretation: Falling glutathione with rising inosine monophosphate is read by the authors
              as oxidative stress plus dysregulated energetics, which is the content of this node.
          - name: Cardiac intermediary metabolite pools
            target: Cardiac Metabolic Dysregulation
            description: Untargeted metabolomics across amino acid, glycerol, glycolytic and tricarboxylic
              acid cycle pathways in both sexes.
            direction: DECREASED
            interpretation: Broad reduction across central carbon and amino acid metabolism is the substrate-utilization
              deficit underlying this node.
        - target: Left Ventricular Dilation and Systolic Dysfunction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Systolic performance is reduced, matching the human phenotype, but the hearts are
            hypoplastic rather than dilated.
          limitations: 'Only the systolic-dysfunction half of this node is reproduced. Chamber geometry
            moves the wrong way: hypoplastic hearts are not dilated hearts, the same divergence the Q187X
            heterozygote shows. Both monoallelic mouse models therefore fail on the dilation component,
            which is worth weighing before treating either as a model of the remodeling process.'
          readouts:
          - name: Systolic performance
            target: Left Ventricular Dilation and Systolic Dysfunction
            description: Echocardiographic systolic function in male and female Prdm16csp1/wt mice up
              to 8 months.
            direction: DECREASED
            interpretation: Diminished systolic performance is the component of this node the model does
              reproduce; the sex difference is a property of the model with no confirmed human counterpart.
      selected_evidence:
        snippet: This study performed in-depth pathophysiological and molecular analyses of male and female
          Prdm16csp1/wt mice that carry systemic, monoallelic Prdm16 gene inactivation.
        supports: SUPPORT
