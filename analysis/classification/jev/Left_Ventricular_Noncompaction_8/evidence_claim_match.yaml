            association study relative to gnomAD population controls (p = 4.0E-12), a far larger and better-controlled
            estimate than the single-center pediatric cohort above; the two are recorded separately because
            they measure different populations (pediatric referral cohort vs. multicenter case-control).
        notes: 'ClinGen classifies the PRDM16-dilated cardiomyopathy gene-disease relationship as Strong
          with autosomal dominant inheritance (see Dilated_Cardiomyopathy.yaml for the shared ClinGen
          assertion). A contemporary review reports a variant-class genotype-phenotype correlation: missense
          variants track with DCM, nonsense/frameshift (loss-of-function) variants track with LVNC, and
          PRDM16 is predicted to be highly loss-of-function-intolerant (see the discussions entry above
          and the PRDM16 Loss-of-Function Variant pathophysiology node).'
      selected_evidence:
        snippet: PRDM16 | HGNC:14000 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong
        supports: SUPPORT
