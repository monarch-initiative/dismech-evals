  184015f01fb52fdc6b58801c6d9da9c3f828ab1c4cc6a159a7d57092a19b8349:
    claim:
      about:
        disease:
          name: Left Ventricular Noncompaction 8
          disease_term:
            preferred_term: left ventricular noncompaction 8
            term:
              id: MONDO:0014152
              label: left ventricular noncompaction 8
        context: []
      assertion_type: Prevalence
      assertion:
        population: Molecularly confirmed PRDM16-associated LVNC (LVNC8)
        measure_type: UNKNOWN
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No prevalence or incidence estimate exists for molecularly confirmed LVNC8, so no band
          or rate is asserted for this entity. Two published figures bound it from either side and are
          recorded here with their evidence rather than as structured rates, because neither has LVNC8
          as its denominator and a structured band would misreport this rare Mendelian entity. Upper bound:
          pooled adult prevalence of the LVNC phenotype from all causes is 0.5%, of which PRDM16 explains
          only a fraction; the same review reports a 1.3% detection rate by cardiovascular magnetic resonance,
          which is a modality effect rather than a second estimate and shows how strongly LVNC ascertainment
          depends on imaging method and criteria. Penetrance, not prevalence: among 134 individuals with
          1p36 deletion syndrome, 29.1% of those whose deletion removed PRDM16 developed cardiomyopathy
          against 10.8% of those whose deletion spared it; the retrospective arm alone (n=71) gave 34.5%
          versus 7.7% without reaching significance. That is the contiguous-gene-deletion context and
          other genes in the interval may modify the risk, so it is not the penetrance of a nonsyndromic
          PRDM16 variant.'
      selected_evidence:
        snippet: The study showed a prevalence of LVNC of 0.5%, with cardiovascular magnetic resonance
          outperforming echocardiography in diagnosis with a detection rate of 1.3%.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/0
      context_paths:
