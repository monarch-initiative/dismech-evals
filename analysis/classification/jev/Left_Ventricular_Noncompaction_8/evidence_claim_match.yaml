      assertion_type: DifferentialDiagnosis
      assertion:
        name: 1p36 deletion syndrome
        description: A contiguous-gene deletion syndrome of the terminal short arm of chromosome 1 that
          includes PRDM16 within its cardiomyopathy critical region, together with craniofacial anomalies,
          intellectual disability, seizures, and other syndromic features not present in isolated LVNC8.
        distinguishing_features:
        - 1p36 deletion syndrome is a multigene contiguous deletion with extracardiac syndromic features;
          LVNC8 is a nonsyndromic, single-gene PRDM16 point-mutation or small-indel disorder confined
          to the cardiac phenotype.
        - Array CGH or chromosomal microarray identifying a terminal 1p36 deletion spanning PRDM16 (rather
          than an intragenic PRDM16 variant) indicates 1p36 deletion syndrome rather than LVNC8.
      selected_evidence:
        snippet: we identified a minimal deletion for the cardiomyopathy associated with 1p36del syndrome
          that included only the terminal 14 exons of the transcription factor PRDM16
