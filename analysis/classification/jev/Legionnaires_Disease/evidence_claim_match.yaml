        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Flagellin-Triggered NAIP5/NLRC4 Inflammasome Restriction
        role: host_defense
        description: 'Host innate immunity restricts intracellular Legionella replication through cytosolic
          sensing of bacterial flagellin. Flagellin is recognized by NAIP5 (BIRC1e), which nucleates the
          NLRC4 inflammasome, activating caspase-1 and pyroptotic death of the infected cell. In murine
          models this axis explains why most wild-type mouse strains are naturally non-permissive to L.
          pneumophila, whereas NAIP5-deficient A/J macrophages permit intracellular replication. The human
          relevance of this specific restriction pathway is inferred from these model-organism data.

          '
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        biological_processes:
        - preferred_term: NAIP5/NLRC4 inflammasome-mediated defense against Legionella
          term:
            id: GO:0042742
            label: defense response to bacterium
        - preferred_term: caspase-1-dependent pyroptotic response
          term:
            id: GO:0070269
            label: pyroptotic inflammatory response
      selected_evidence:
        snippet: only macrophages from A/J mice deficient in the NAIP5 (or Birc1e) pathway of the inflammasome
          allow an intracellular infection. The NAIP5 pathway is involved in the recognition of flagellin.
        supports: SUPPORT
    origin:
