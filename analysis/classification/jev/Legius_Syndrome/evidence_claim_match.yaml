  775e4961d2e16652a0ee009a0f76a180ba178e3ccd2f51cc3bda19c32396e5d4:
    claim:
      about:
        disease:
          name: Legius Syndrome
          disease_term:
            preferred_term: Legius syndrome
            description: An autosomal dominant RASopathy caused by heterozygous germline loss-of-function
              variants in SPRED1, producing the pigmentary features of neurofibromatosis type 1 without
              its tumor manifestations.
            term:
              id: MONDO:0012669
              label: Legius syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Neurofibromatosis type 1
        disease_term:
          preferred_term: neurofibromatosis type 1
          term:
            id: MONDO:0018975
            label: neurofibromatosis type 1
        description: The principal differential and the reason the disorder was originally named "NF1-like
          syndrome". The two are clinically indistinguishable in early childhood when only pigmentary
          findings are present, and about half of SPRED1-positive individuals satisfy the older NIH clinical
          criteria for NF1. Read the other way round, 1.9% (95% CI 1.2%-2.9%) of individuals carrying
          a clinical NF1 diagnosis by the NIH criteria in fact have Legius syndrome — the diagnostic yield
          of SPRED1 testing in that ascertained population, which is not a population prevalence and is
          recorded here rather than in `prevalence:`.
        distinguishing_features:
        - Legius syndrome lacks neurofibromas (cutaneous and plexiform), Lisch nodules, symptomatic optic
          pathway gliomas, and the distinctive NF1 osseous lesions.
        - The causal gene differs — SPRED1 rather than NF1 — although both converge on failure of neurofibromin-mediated
          RAS inactivation.
        - Legius syndrome is roughly 20-fold rarer (birth prevalence ~1/46,000-1/75,000 versus ~1/2,000-1/3,000
          for NF1).
      selected_evidence:
        snippet: Among 42 SPRED1-positive individuals from the clinical cohort, 20 (48%; 95% confidence
          interval ... 32%-64%) fulfilled National Institutes of Health (NIH) NF1 diagnostic criteria
          based on the presence of more than 5 CALMs with or without freckling or an NF1-compatible family
          history.
        supports: SUPPORT
