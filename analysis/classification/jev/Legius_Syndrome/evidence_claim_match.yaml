  2aaec274d93b3304783161f3180b55c15a0285d6de3ccaf5ba38dad97cfdb198:
    claim:
      about:
        disease:
          name: Legius Syndrome
          disease_term:
            preferred_term: Legius syndrome
            description: An autosomal dominant RASopathy caused by heterozygous germline loss-of-function
              variants in SPRED1, producing the pigmentary features of neurofibromatosis type 1 without
              its tumor manifestations.
            term:
              id: MONDO:0012669
              label: Legius syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neurofibromin Recruitment to Activated RAS
        biological_scale: MOLECULAR
        description: SPRED1 suppresses RAS-ERK signaling not by acting on RAS directly but by serving
          as a membrane-targeting adaptor for neurofibromin, the RAS-GAP encoded by NF1. The SPRED1 EVH1
          domain binds short N- and C-terminal helical extensions flanking the GAP-related domain (GRD)
          of neurofibromin — regions dispensable for GAP catalysis and absent from p120GAP, which explains
          the selectivity of SPRED1 for neurofibromin among RasGAPs. Pathogenic EVH1-domain missense variants
          found in Legius syndrome reduce GRD binding affinity and correspondingly abolish the ERK-suppressing
          activity of SPRED1, providing a direct molecular link between genotype and pathway dysregulation.
          Structural work confirms that SPRED1-mediated membrane targeting allows neurofibromin to engage
          activated KRAS simultaneously.
        genes:
        - preferred_term: SPRED1
          term:
            id: hgnc:20249
            label: SPRED1
        - preferred_term: NF1
          term:
            id: hgnc:7765
            label: NF1
        molecular_functions:
        - preferred_term: GTPase activator activity
          term:
            id: GO:0005096
            label: GTPase activator activity
          modifier: DECREASED
      selected_evidence:
        snippet: We show that Spred1 binding induces the plasma membrane localization of NF1, which subsequently
          down-regulates Ras-GTP levels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22751498
      reference_title: A shared molecular mechanism underlies the human rasopathies Legius syndrome and
        Neurofibromatosis-1.
      evidence_source: IN_VITRO
      explanation: Direct demonstration that SPRED1 acts as a membrane-targeting adaptor for neurofibromin,
        which is the claim this node makes; the EVH1-GRD interaction and structural papers establish the
        binding interface but not the membrane localization itself.
