              variants in SPRED1, producing the pigmentary features of neurofibromatosis type 1 without
              its tumor manifestations.
            term:
              id: MONDO:0012669
              label: Legius syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SPRED1
        gene_term:
          preferred_term: SPRED1
          term:
            id: hgnc:20249
            label: SPRED1
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: Heterozygous loss-of-function variants in SPRED1 (chromosome 15) cause Legius syndrome.
          The mutational spectrum is broad — 34 distinct SPRED1 variants were identified across 43 probands
          in the defining anonymous cohort — so there is no single recurrent variant, in contrast to the
          single recurrent SHOC2 p.Ser2Gly variant of NS/LAH. Pathogenic missense variants cluster in
          the EVH1 domain and act by weakening the neurofibromin GRD interaction. SPRED1 variants account
          for approximately 1% of sporadic and 19% of familial cases presenting with pigmentary features
          of NF1 only.
      selected_evidence:
        snippet: Further studies have shown that SPRED1 PVs account for 1% of sporadic cases and 19% of
          familial cases with pigmentary features of NF1 (CALMs and freckling) only.
        supports: SUPPORT
