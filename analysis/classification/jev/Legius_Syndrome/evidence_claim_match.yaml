      assertion_type: Pathophysiology
      assertion:
        name: Hippocampal Synaptic Plasticity Impairment
        biological_scale: CELLULAR
        description: Spred1-null mice show impaired performance in the Morris water maze and visual-discrimination
          T-maze with normal basic neuromotor and sensory abilities, together with defects in short- and
          long-term hippocampal synaptic plasticity including a disequilibrium between long-term potentiation
          and long-term depression in CA1. Increased ERK phosphorylation is measurable in Spred1-null
          slices after LTP induction, linking the plasticity defect to Ras/ERK hyperactivation. This is
          the candidate substrate for the learning disability, ADHD, and developmental delay reported
          in affected individuals, but the translational step from mouse hippocampal physiology to the
          human cognitive phenotype has not been directly demonstrated (see the HUMAN_MODEL_MISMATCH discussion).
        genes:
