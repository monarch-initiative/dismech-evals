  6895516d8fef0c28d3cb4620d0a0faf7a27d3778cd29923b3add2af6f47ab809:
    claim:
      about:
        disease:
          name: Legius Syndrome
          disease_term:
            preferred_term: Legius syndrome
            description: An autosomal dominant RASopathy caused by heterozygous germline loss-of-function
              variants in SPRED1, producing the pigmentary features of neurofibromatosis type 1 without
              its tumor manifestations.
            term:
              id: MONDO:0012669
              label: Legius syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_legius_human_model_cognitive_mechanism
        prompt: Does the hippocampal LTP/LTD disequilibrium seen in Spred1-null mice account for the learning
          disability and ADHD observed in humans with heterozygous SPRED1 loss of function?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Hippocampal Synaptic Plasticity Impairment
        rationale: 'The mechanistic account of the neurocognitive phenotype rests entirely on a mouse
          model, and two gaps separate it from the human disease. First is a dosage mismatch: the electrophysiology
          and behavioral deficits are reported in homozygous Spred1(-/-) animals, whereas humans with
          Legius syndrome are heterozygous. Second, no human study has demonstrated a corresponding hippocampal
          plasticity or ERK-signaling abnormality, so the inference from rodent CA1 physiology to human
          learning disability remains an extrapolation rather than a demonstrated mechanism. This matters
          therapeutically, because MEK-inhibitor-based cognitive rescue strategies proposed for RASopathies
          presuppose that the human deficit is ERK-driven in the same way.'
        proposed_experiments:
        - experiment_id: exp_legius_heterozygous_model_and_human_cognitive_phenotyping
          name: Heterozygous Spred1 model plus matched human cognitive-electrophysiological phenotyping
          description: Repeat the CA1 LTP/LTD and Morris water maze characterization in Spred1(+/-) animals
            to test whether the phenotype survives at the dosage that models human disease, and pair this
            with a prospective human cohort combining standardized neuropsychological testing, ADHD assessment,
            and non-invasive plasticity readouts in SPRED1 carriers versus NF1-matched and unaffected
            controls.
      selected_evidence:
        snippet: We investigated hippocampus-dependent learning and memory as well as synaptic plasticity
          in Spred1(-/-) mice, an animal model of this newly discovered human syndrome.
        supports: SUPPORT
