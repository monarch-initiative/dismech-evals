    claim:
      about:
        disease:
          name: Legius Syndrome
          disease_term:
            preferred_term: Legius syndrome
            description: An autosomal dominant RASopathy caused by heterozygous germline loss-of-function
              variants in SPRED1, producing the pigmentary features of neurofibromatosis type 1 without
              its tumor manifestations.
            term:
              id: MONDO:0012669
              label: Legius syndrome
        context: []
      assertion_type: Definition
      assertion:
        name: 2021 international consensus diagnostic criteria for Legius syndrome
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'The International Consensus Group on Neurofibromatosis Diagnostic Criteria (I-NF-DC)
          established the first formal diagnostic criteria for Legius syndrome in 2021. Unlike the NF1
          criteria, which can be met clinically, the Legius syndrome criteria require molecular confirmation:
          a heterozygous pathogenic SPRED1 variant at a ~50% variant allele fraction in apparently normal
          tissue, together with six or more bilaterally distributed café-au-lait macules and no NF1-related
          diagnostic criteria other than axillary or inguinal freckling. A child of an affected parent
          needs only one of these. Fewer than six café-au-lait macules does not exclude the diagnosis.'
        scope: Clinical and molecular diagnosis of non-mosaic Legius syndrome. Separate criteria exist
          for mosaic Legius syndrome, which is very rare.
        inclusion_criteria:
        - preferred_term: Six or more bilaterally distributed cafe-au-lait macules
          term:
            id: HP:0007565
            label: Multiple cafe-au-lait spots
          description: Six or more café-au-lait macules with a bilateral distribution. Fewer than six
            does not exclude the diagnosis.
        - preferred_term: Heterozygous pathogenic SPRED1 variant at ~50% variant allele fraction
          description: A heterozygous pathogenic variant in SPRED1 with a variant allele fraction of 50%
            in apparently normal tissue such as white blood cells. This molecular criterion is required
            and is what distinguishes the Legius syndrome criteria from the clinically satisfiable NF1
            criteria.
        exclusion_criteria:
        - preferred_term: Any NF1-related diagnostic criterion other than skinfold freckling
          description: Presence of any other NF1 diagnostic criterion — neurofibromas, Lisch nodules or
            choroidal abnormalities, optic pathway glioma, or a distinctive NF1 osseous lesion — excludes
            Legius syndrome. Axillary or inguinal freckling is the sole permitted exception.
        notes: The consensus group explicitly considered and rejected classifying Legius syndrome as an
          NF1 subtype, on the grounds that in the absence of neurofibromas it is inappropriate to consider
          it a type of neurofibromatosis.
      selected_evidence:
        snippet: 'A: The diagnostic criteria for Legius syndrome are met in an individual who does not
          have a parent diagnosed with Legius syndrome if the following CRITERIA are present:'
        supports: SUPPORT
