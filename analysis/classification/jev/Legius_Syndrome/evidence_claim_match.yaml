  0d34511fe099b4e1907be01034ac70f10ea7f6d5b36c1ab1cc4c0f2e81a9f9f6:
    claim:
      about:
        disease:
          name: Legius Syndrome
          disease_term:
            preferred_term: Legius syndrome
            description: An autosomal dominant RASopathy caused by heterozygous germline loss-of-function
              variants in SPRED1, producing the pigmentary features of neurofibromatosis type 1 without
              its tumor manifestations.
            term:
              id: MONDO:0012669
              label: Legius syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_legius_residual_tumor_risk
        prompt: Is the tumor risk in Legius syndrome truly at population baseline, or does the absence
          of tumors in published cohorts reflect limited sample size and incomplete adult follow-up?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#RAS-MAPK Pathway Hyperactivation
        rationale: 'The clinical management of Legius syndrome — developmental rather than oncologic surveillance
          — rests on the claim that SPRED1 loss does not confer the tumor predisposition of NF1. The strongest
          supporting observation is nonetheless a zero count in a modest cohort: 0 of 42 SPRED1-positive
          individuals, with a 95% confidence interval extending to 7%. A tumor risk anywhere below that
          upper bound is statistically compatible with the data, and the cohorts are weighted toward children,
          so adult-onset risk is especially poorly constrained. Because SPRED1 and NF1 converge on the
          same RAS-inactivation step, a mechanistic prior for some residual risk is not unreasonable,
          and resolving this determines whether any oncologic surveillance is warranted.'
        proposed_experiments:
        - experiment_id: exp_legius_population_scale_cancer_risk_ascertainment
          name: Genomic-ascertainment cohort of adult SPRED1 variant carriers
          description: Identify carriers of pathogenic and likely pathogenic germline SPRED1 variants
            in large unselected biobank/health-system genomic datasets rather than in neurofibromatosis
            clinics, and compare age-stratified adult cancer incidence against non-carrier controls. Genomic
            rather than clinical ascertainment removes the referral bias that inflates the apparent specificity
            of the pigmentary phenotype, and biobank scale provides the person-years needed to tighten
            the upper confidence bound well below 7%.
      selected_evidence:
        snippet: None of the 42 SPRED1-positive individuals (0%; 95% CI, 0%-7%) had discrete cutaneous
          or plexiform neurofibromas, typical NF1 osseous lesions, or symptomatic optic pathway gliomas.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19920235
      reference_title: Clinical and mutational spectrum of neurofibromatosis type 1-like syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the absence of NF1 tumor manifestations, but the reported confidence interval
        bounds the residual risk only loosely at 7%, which is what leaves this question open.
