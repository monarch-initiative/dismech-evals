            label: long-term synaptic potentiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Electrophysiological recordings on brain slices from these animals identified defects
          in short- and long-term synaptic hippocampal plasticity, including a disequilibrium between
          long-term potentiation (LTP) and long-term depression in CA1 region.
        supports: SUPPORT
