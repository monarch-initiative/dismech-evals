      assertion_type: Inheritance
      assertion:
        name: Maternal mitochondrial inheritance
        description: Leigh syndrome caused by mtDNA-encoded variants -- most commonly MT-ATP6 m.8993T>G/T>C
          -- is transmitted down the maternal line as maternally inherited Leigh syndrome (MILS). Severity
          tracks the heteroplasmy level, which segregates unpredictably between siblings through the mitochondrial
          bottleneck.
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
      selected_evidence:
        snippet: The 8993 T>G mutation in mitochondrial DNA has been associated with variable syndromes
          of differing severity ranging from maternally inherited Leigh's syndrome (MILS) to neuropathy
        supports: SUPPORT
