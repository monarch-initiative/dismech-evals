  04683638399b05e0652256cded8d365c99e3a2bd9d7887869a8a52a49c54f522:
    claim:
      about:
        disease:
          name: Leishmaniasis
          disease_term:
            term:
              id: MONDO:0011989
              label: leishmaniasis
            preferred_term: Leishmaniasis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Parasitological demonstration (microscopy and culture)
        description: Leishmania amastigotes are demonstrated by microscopy of stained smears, and parasites
          isolated by in vitro culture, from tissue. For visceral leishmaniasis the specimen is an aspirate
          of spleen, bone marrow or lymph node, bone marrow being the preferred first source, or buffy
          coat in immunocompromised patients; microscopy of aspirates is the classical confirmatory test,
          most sensitive on spleen. For cutaneous and mucosal leishmaniasis the specimen is lesion tissue.
          Culture also yields an isolate for species identification.
        measurements:
        - preferred_term: Leishmania microscopy
          term:
            id: LOINC:51709-4
            label: Leishmania sp identified in Specimen by Giemsa stain
        - preferred_term: Leishmania culture
          term:
            id: LOINC:51710-2
            label: Leishmania sp identified in Specimen by Organism specific culture
        notes: Two measurements, one per assay. Stain and culture are each test's identity, so the unspecified-specimen
          stain and culture codes are bound rather than the method-less tissue identification code, which
          would not say how the parasite was demonstrated, or the tissue-, blood- and bone-marrow-specific
          variants, which would split one test across specimens. Qualitative results; no reference_ranges.
      selected_evidence:
        snippet: The visualization of the amastigote form of the parasite by microscopic examination of
          aspirates from lymph nodes, bone marrow or spleen is the classical confirmatory test for VL.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
