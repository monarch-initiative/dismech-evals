  acf64df31954394b7386ebd3989bc7f83dcb346661c4d98ad735ba7008fa5615:
    claim:
      about:
        disease:
          name: Leishmaniasis
          disease_term:
            term:
              id: MONDO:0011989
              label: leishmaniasis
            preferred_term: Leishmaniasis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Leishmania nucleic acid amplification testing
        description: PCR detection of Leishmania DNA is the most sensitive test available, more sensitive
          than microscopy, and is performed on the same tissue specimens as microscopy and culture in
          both visceral and cutaneous disease. In visceral leishmaniasis it also performs well on peripheral
          blood. DNA-based assays also identify the infecting species.
        measurements:
        - preferred_term: Leishmania DNA
          term:
            id: LOINC:23159-7
            label: Leishmania sp DNA [Identifier] in Specimen by NAA with probe detection
        notes: The Monarch KG has no method-less Leishmania DNA presence code (searches "Leishmania DNA",
          "Leishmania sp DNA [Presence]", "Leishmania sp DNA [Presence] in Specimen", "Leishmania DNA
          Molecular genetics method"). The unspecified-specimen NAA code is bound because the test is
          run on tissue for cutaneous disease and on aspirate or blood for visceral disease; the blood-only
          presence codes would exclude lesion tissue. It is an identifier code with probe detection, the
          only unspecified-specimen Leishmania NAA code returned. Qualitative result; no reference_ranges.
      selected_evidence:
        snippet: Molecular amplification assays typically should be performed because they are the most
          sensitive Leishmania tests currently available
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
