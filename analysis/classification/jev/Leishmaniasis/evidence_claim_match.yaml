      assertion_type: Discussion
      assertion:
        discussion_id: leishmaniasis_th1_th2_murine_mismatch
        prompt: Does the murine Th1-control / Th2-progression dichotomy operate in human leishmaniasis,
          and which human immune correlates should replace it?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Th1-Polarized Cell-Mediated Response and Macrophage Activation
        - pathophysiology#Th2-Polarized Response and Permissive Disease Progression
        rationale: The Th1-protective / Th2-permissive polarization is established in the murine model,
          but the reviewed literature explicitly states that the Th1/Th2 dichotomy in the human system
          is not as distinct as in mice and that the murine model does not strictly apply to human leishmaniasis.
          Evidence therefore exists in a model system while its translational validity is the open question,
          which is a HUMAN_MODEL_MISMATCH rather than a plain KNOWLEDGE_GAP. Both polarization nodes are
          consequently curated with PARTIAL, MODEL_ORGANISM-sourced evidence.
        proposed_experiments:
        - experiment_id: exp_leish_human_th_polarization_cohort
          experiment_design: HUMAN_OBSERVATIONAL
          name: Human T-helper polarization versus outcome in leishmaniasis cohorts
          description: Longitudinally profile lesion- and blood-derived CD4 T-cell cytokine programs in
            human cutaneous, mucocutaneous, and visceral leishmaniasis cohorts, and test whether polarization
            state predicts cure versus progression as it does in the murine model.
          experiment_type:
            preferred_term: prospective clinical cohort immunophenotyping experiment
          readouts:
          - name: T-helper polarization state versus clinical outcome
            target: pathophysiology#Th1-Polarized Cell-Mediated Response and Macrophage Activation
        - experiment_id: exp_leish_cross_species_tcell_scrnaseq
          experiment_design: DESCRIPTIVE_PROFILING
          name: Cross-species single-cell comparison of the T-cell compartment
          description: Compare single-cell transcriptomes of the T-cell compartment in matched human lesions
            and murine infection models to determine which human immune states, if any, correspond to
            the murine Th1 and Th2 arms.
          experiment_type:
            preferred_term: cross-species single-cell transcriptomic comparison experiment
          readouts:
          - name: Correspondence of human T-cell states to murine Th1/Th2 arms
            target: pathophysiology#Th2-Polarized Response and Permissive Disease Progression
      selected_evidence:
        snippet: However, Th1 and Th2 dichotomy in the human system is not as distinct as in mice and
          the murine model does not strictly apply to human leishmaniasis.
        supports: SUPPORT
