        context: []
      assertion_type: Diagnosis
      assertion:
        name: Leishmania antibody serology
        description: Antibody detection by direct agglutination test (DAT), indirect fluorescent antibody,
          ELISA or western blot supports visceral leishmaniasis where parasitological and molecular tests
          cannot be done or are negative. Antibody persists for years after cure, so serology cannot diagnose
          relapse, and it may be undetectable in immunocompromised patients. Serology is not recommended
          for cutaneous leishmaniasis, for which available assays are neither sensitive nor specific.
        measurements:
        - preferred_term: Leishmania antibody
          term:
            id: LOINC:7958-2
            label: Leishmania sp Ab [Presence] in Serum
        notes: 'The method-less genus-level antibody presence code is bound rather than one code per method
          (agglutination, immunofluorescence, immunoassay) or per species. No reference_ranges: the DAT
          positivity titre is set per assay, and the 1:800 or 1:1600 single dilution the cited review
          gives is the operating cut-off of the fast agglutination screening test, a product format, not
          a guideline threshold for the disease.'
      selected_evidence:
        snippet: Serologic testing is recommended for persons with suspected VL in whom definitive diagnostic
          tests for the parasite (microscopic identification, culture, and molecular tests for parasite
          DNA) cannot be conducted or have negative results.
        supports: SUPPORT
    origin:
