        context: []
      assertion_type: Transmission
      assertion:
        name: Contiguous spread from an oropharyngeal focus to the internal jugular vein
        description: Lemierre syndrome is not transmitted between people. Fusobacterium necrophorum is
          already a member of the patient's own oropharyngeal flora; the syndrome begins when a tonsillar
          or pharyngeal infection extends locally into the parapharyngeal space and reaches the wall of
          the internal jugular vein, producing septic thrombophlebitis and then metastatic emboli.
        notes: The route is local extension from an endogenous focus, so there is no person-to-person
          transmission and no environmental or vector exposure to record. What can be acquired from another
          person is pharyngitis, not the syndrome.
      selected_evidence:
        snippet: The obligate Gram-negative anaerobic bacterium Fusobacterium necrophorum (FN), part of
          the oropharyngeal flora, constitutes the most common causative organism of this syndrome.
        supports: SUPPORT
