      assertion_type: Pathophysiology
      assertion:
        name: Fusobacterial leukotoxin immune evasion
        description: F. necrophorum virulence is dominated by leukotoxin, with endotoxin and other secreted
          products also implicated. Bovine leukocyte experiments show that purified leukotoxin activates
          polymorphonuclear leukocytes at low concentrations, induces apoptotic/programmed death at higher
          concentrations, and produces necrotic death at very high concentrations; this mechanism is strong
          model support for immune evasion but the human internal-jugular thrombus-initiation step remains
          inferred.
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: apoptotic process
          modifier: ABNORMAL
          term:
            id: GO:0006915
            label: apoptotic process
        - preferred_term: inflammatory response
          modifier: ABNORMAL
          term:
            id: GO:0006954
            label: inflammatory response
        molecular_functions:
        - preferred_term: toxin activity
          term:
            id: GO:0090729
            label: toxin activity
        chemical_entities:
        - preferred_term: lipopolysaccharide
          term:
            id: CHEBI:16412
            label: lipopolysaccharide
      selected_evidence:
        snippet: Among these, leukotoxin and endotoxin are believed to be more important than other toxins
          in overcoming the host's defence mechanisms to establish the infection.
        supports: SUPPORT
