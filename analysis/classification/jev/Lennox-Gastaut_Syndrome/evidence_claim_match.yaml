        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_lgs_convergent_syndrome_vs_disease
        prompt: Is Lennox-Gastaut syndrome a single disease with a unifying network mechanism, or a convergent
          electroclinical endpoint that many distinct etiologies reach when they perturb the immature
          brain — and what network property, if any, actually defines membership?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Heterogeneous Etiologic Brain Insult
        - pathophysiology#Diffuse Thalamocortical Network Dysfunction
        rationale: LGS is defined by a characteristic triad that appears despite highly diverse structural,
          genetic, and metabolic causes, which is why this entry models a heterogeneous insult converging
          on a shared network node rather than a single lesion. Whether there is a genuine unifying mechanism
          (a specific thalamocortical network signature that all cases share) or whether LGS is essentially
          a stereotyped way the immature network fails, with no deeper common cause, remains debated.
          The answer determines whether LGS should be modeled as one disease entity or as a syndromic
          label over many diseases, and whether a network-level therapeutic target could exist.
        proposed_experiments:
        - experiment_id: exp_lgs_shared_network_signature
          name: Cross-etiology network-signature comparison in LGS
          description: Using simultaneous EEG and functional MRI across patients with LGS of distinct
            etiologies (structural, genetic, post-infantile-spasms), test whether slow spike-and-wave
            and paroxysmal fast activity recruit the same thalamocortical hubs regardless of cause, and
            whether a shared network signature separates LGS from other generalized epilepsies.
          experiment_type:
            preferred_term: EEG-functional MRI network comparison experiment
          readouts:
          - name: Shared network recruitment
            target: pathophysiology#Diffuse Thalamocortical Network Dysfunction
            assays:
            - preferred_term: functional magnetic resonance imaging assay
            - preferred_term: electroencephalography
            direction: POSITIVE
          controls:
          - name: Non-LGS generalized epilepsy comparators
            description: Patients with other generalized epilepsies imaged under the same protocol.
          decision_criterion: A unifying-mechanism interpretation is supported if a common thalamocortical
            network is recruited across etiologies and distinguishes LGS from comparators; a purely convergent-label
            interpretation is favored if the network signature tracks etiology rather than the LGS diagnosis.
          would_support:
          - pathophysiology#Diffuse Thalamocortical Network Dysfunction
      selected_evidence:
        snippet: We previously found common cerebral networks involved during slow spike-and-wave (SSW)
          and generalized paroxysmal fast activity (PFA), characteristic interictal discharges.
        supports: SUPPORT
    origin:
