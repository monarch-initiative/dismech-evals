              id: MONDO:0016532
              label: Lennox-Gastaut syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Slow Spike-and-Wave Discharge Generation
        description: A defining electrographic feature of LGS is the diffuse slow (<2.5 Hz) spike-and-wave
          complex, reflecting pathological corticothalamic oscillation. This node captures the single
          concept of slow spike-and-wave generation, the substrate of atypical absence seizures.
        role: central_effector
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        notes: 'This entry assigns tonic and atonic seizures downstream of generalized paroxysmal fast
          activity, and atypical absence seizures downstream of slow spike-and-wave, following the ictal-correlate
          literature in which GPFA is the ictal signature of the tonic seizure. PMID:38976954 reports
          something different in kind: correlations pooled across studies, in which atonic, tonic and
          atypical absence seizures all correlate with SSW while myoclonic seizures correlate with GPFA.
          For the three seizure types where the two differ, that is close to the inverse of what is modeled
          here.

          The edge set is left unchanged. A pooled cross-study correlation with an interictal pattern
          is weaker warrant for a generator assignment than the ictal recordings the current edges rest
          on, and the review does not claim the correlates are seizure-type-specific. Recorded here so
          the next curator does not have to re-derive the discrepancy, and so that revisiting it is a
          deliberate decision rather than an accident.'
      selected_evidence:
        snippet: EEG showed slow background activity in 21/27 patients, diffuse slow spike-wave discharges
          (DSSW) during wakefulness in 22/27, and bursts of diffuse fast rhythms (DFR) in sleep in all
          patients.
        supports: SUPPORT
    origin:
