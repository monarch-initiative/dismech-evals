        prompt: Can any animal model reproduce the convergent LGS electroclinical syndrome (tonic seizures
          with generalized paroxysmal fast activity plus slow spike-and-wave), or do current single-gene
          models only capture one etiologic entry point into the syndrome?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Diffuse Thalamocortical Network Dysfunction
        - pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
        rationale: 'Because LGS is a convergent syndrome rather than a single-gene disease, a faithful
          model would need to reproduce the shared network phenotype, not just one causative lesion. Existing
          models (for example GABRB3 knock-in mice) recapitulate a single genetic etiology and some seizure
          features, but whether they reproduce the defining tonic-seizure and paroxysmal fast-activity
          network signature of human LGS is uncertain. This is a translational-validity gap, distinct
          from an absence of evidence: model data exist, but their fidelity to the convergent human syndrome
          is the open question.'
        proposed_experiments:
        - experiment_id: exp_lgs_model_network_phenotype_fidelity
          name: Network-phenotype fidelity testing across LGS etiologic models
          description: Phenotype several distinct LGS etiologic models (a GABA-A receptor model, an mTOR/structural
            model, and a synaptic model) with the same sleep-EEG and network readouts used clinically,
            testing whether any reproduces tonic seizures with sleep-activated fast activity and slow
            spike-and-wave.
          experiment_type:
            preferred_term: cross-model network phenotyping experiment
          readouts:
          - name: Tonic seizure and fast-activity phenotype
            target: pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
            assays:
            - preferred_term: electroencephalography
            direction: POSITIVE
          controls:
          - name: Wild-type littermates
            description: Matched wild-type animals recorded under identical protocols.
          decision_criterion: Human fidelity for a model is supported if it reproduces the sleep-activated
            paroxysmal fast activity and tonic seizure signature; models that show only isolated seizures
            without the network signature are flagged as capturing an etiologic entry point rather than
            the LGS syndrome.
          would_support:
          - pathophysiology#Diffuse Thalamocortical Network Dysfunction
      selected_evidence:
        snippet: GABRB3, with de novo mutations in four patients, and ALG13, with the same de novo mutation
          in two patients; both genes show clear statistical evidence of association with epileptic encephalopathy.
        supports: SUPPORT
