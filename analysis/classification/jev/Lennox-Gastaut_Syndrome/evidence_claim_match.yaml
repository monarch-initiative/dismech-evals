      assertion_type: Discussion
      assertion:
        discussion_id: gap_lgs_tonic_seizure_gpfa_circuit_mechanism
        prompt: What circuit generates the tonic seizures and their electrographic correlate, sleep-activated
          generalized paroxysmal fast activity — the near-specific hallmark of LGS — and why is it activated
          by non-REM sleep?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
        rationale: Generalized paroxysmal fast activity and tonic seizures are the most LGS-specific features,
          yet the circuit that produces them is poorly resolved. Competing accounts implicate thalamocortical
          mechanisms, brainstem arousal systems, and a sleep-state gating that selectively activates the
          discharge in non-REM sleep. Resolving the generator matters directly for neuromodulation targeting
          (for example centromedian thalamic stimulation) and for understanding why the hallmark seizure
          type is sleep-activated.
        proposed_experiments:
        - experiment_id: exp_lgs_gpfa_generator_localization
          name: Sleep-state localization of the paroxysmal fast activity generator
          description: Combine intracranial or high-density scalp recordings with sleep staging and thalamic
            recording where available to localize the onset of paroxysmal fast activity and test whether
            non-REM sleep gates a thalamocortical or brainstem generator.
          experiment_type:
            preferred_term: intracranial seizure-onset localization experiment
          readouts:
          - name: Fast-activity onset localization by sleep state
            target: pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
            assays:
            - preferred_term: electroencephalography
            direction: POSITIVE
          controls:
          - name: Wake-state recordings
            description: Matched recordings during wakefulness to isolate the sleep-gating effect.
          decision_criterion: A generator is supported if paroxysmal fast activity reproducibly arises
            from a defined thalamocortical or brainstem node under non-REM sleep and not during matched
            wakefulness.
          would_support:
          - pathophysiology#Generalized Paroxysmal Fast Activity and Tonic Seizure Generation
      selected_evidence:
        snippet: We previously found common cerebral networks involved during slow spike-and-wave (SSW)
          and generalized paroxysmal fast activity (PFA), characteristic interictal discharges.
        supports: SUPPORT
