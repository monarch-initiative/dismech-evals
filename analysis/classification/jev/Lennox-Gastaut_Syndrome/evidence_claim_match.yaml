      assertion_type: Genetic
      assertion:
        name: Genetically heterogeneous developmental and epileptic encephalopathy genes
        notes: LGS has no single causative gene. A minority of cases carry pathogenic variants in developmental
          and epileptic encephalopathy genes (reported examples include SCN1A, SCN2A, SCN8A, STXBP1, CHD2,
          DNM1, GABRB3, FOXG1, ALG13, and others); many cases are structural or of unknown cause. Most
          cases are sporadic, and when monogenic the causative variants are typically de novo. Contributing
          genes are named here rather than asserting a single Mendelian locus.
      selected_evidence:
        snippet: GABRB3, with de novo mutations in four patients, and ALG13, with the same de novo mutation
          in two patients; both genes show clear statistical evidence of association with epileptic encephalopathy.
        supports: SUPPORT
