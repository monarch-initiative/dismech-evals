      assertion_type: Pathophysiology
      assertion:
        name: Heterogeneous Etiologic Brain Insult
        description: LGS is not caused by a single lesion. A structurally, genetically, metabolically,
          or acquired-injury-based insult to the developing brain (e.g., hypoxic-ischemic encephalopathy,
          cortical malformation, tuberous sclerosis, CNS infection, or a monogenic developmental and epileptic
          encephalopathy variant) supplies the upstream cause. This node captures the single concept of
          the initiating brain insult; its diverse specific causes converge downstream on a shared network
          disorder.
        role: trigger
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: 'The etiology of LGS is often divided into two groups: identifiable (genetic-structural-metabolic)
          in 65 to 75% of the patients and LGS of unknown cause in others.'
        supports: SUPPORT
