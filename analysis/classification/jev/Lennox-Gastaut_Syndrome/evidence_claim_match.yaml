      assertion:
        name: Share of childhood epilepsy
        description: 'LGS accounts for a small share of childhood epilepsy, but the published figures
          span an order of magnitude: 1% to 10% of all childhood epilepsies. The bounds here are that
          full reported range rather than any single study''s estimate; 3% is a commonly cited point value
          inside it. Camfield attributes the spread to how widely prevalence rates vary between reports,
          and differing case definitions and ascertainment are the usual explanation rather than genuinely
          different populations. This is a proportion of children who already have epilepsy, not a population
          prevalence, and must not be compared with the rate under `prevalence`.'
        minimum_value: 1.0
        maximum_value: 10.0
        unit: percent of childhood epilepsies
      selected_evidence:
        snippet: Lennox-Gastaut syndrome occurs in 3% of children with epilepsy
        supports: SUPPORT
