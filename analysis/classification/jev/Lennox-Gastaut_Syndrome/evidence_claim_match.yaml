          Part would overstate the genetic axis for the syndrome as a whole.
      selected_evidence:
        snippet: '(3) developmental and/or epileptic encephalopathies, comprising five syndromes: epilepsy
          with myoclonic-atonic seizures, Lennox-Gastaut syndrome, developmental and/or epileptic encephalopathy
          with spike-and-wave activation in sleep, hemiconvulsion-hemiplegia-epilepsy syndrome, and febrile
          infection-related epilepsy syndrome'
        supports: SUPPORT
