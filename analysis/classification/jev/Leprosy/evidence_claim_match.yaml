      assertion:
        name: M. leprae Adhesion to Schwann Cells via Laminin-Dystroglycan
        description: M. leprae targets the peripheral nerve by binding the basal-lamina protein laminin-alpha2,
          which bridges the bacterium to the alpha/beta-dystroglycan complex on the Schwann cell surface.
          This receptor-mediated adhesion mediates neural invasion and Schwann cell injury, the molecular
          basis of the peripheral neuropathy that defines leprosy.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: Adhesion of symbiont to host cell
          term:
            id: GO:0044650
            label: adhesion of symbiont to host cell
      selected_evidence:
        snippet: M. leprae/laminin-alpha2 complexes bind to alpha/beta dystroglycan complexes expressed
          on the Schwann cell surface.
        supports: SUPPORT
