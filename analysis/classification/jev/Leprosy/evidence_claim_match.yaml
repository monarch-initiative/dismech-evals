      assertion:
        name: Host T Cell Response Determines the Tuberculoid-Lepromatous Spectrum
        description: The clinical form of leprosy is set by the quality of the host T cell response. A
          Th1-polarized, strong cell-mediated response restricts the bacilli, producing the paucibacillary
          tuberculoid pole; a predominant Th2/humoral response fails to contain the organism, producing
          the multibacillary lepromatous pole, with unstable borderline forms in between.
        cell_types:
        - preferred_term: T-helper 1 cell
          term:
            id: CL:0000545
            label: T-helper 1 cell
        - preferred_term: T-helper 2 cell
          term:
            id: CL:0000546
            label: T-helper 2 cell
        biological_processes:
        - preferred_term: T-helper 1 type immune response
          term:
            id: GO:0042088
            label: T-helper 1 type immune response
        - preferred_term: Type 2 immune response
          term:
            id: GO:0042092
            label: type 2 immune response
      selected_evidence:
        snippet: Th1-type immune response helps to kill the bacteria, but hosts are encroached upon when
          Th2-type response is predominant.
        supports: SUPPORT
