      assertion_type: Pathophysiology
      assertion:
        name: Mycobacterial Tetrahydrofolate Synthesis (Dapsone/DHPS Target)
        description: Dapsone, a sulfone, inhibits dihydropteroate synthase (DHPS) in the M. leprae de
          novo folate pathway, the same enzyme targeted by sulfonamides. Blocking THF synthesis is bacteriostatic
          and contributes the second arm of multidrug therapy alongside rifampicin.
        role: therapeutic_vulnerability
        conforms_to: bacterial_folate_synthesis_inhibition#Bacterial Tetrahydrofolate Synthesis (Antifolate
          Target)
        biological_processes:
        - preferred_term: Tetrahydrofolate Biosynthetic Process
          term:
            id: GO:0046654
            label: tetrahydrofolate biosynthetic process
      selected_evidence:
        snippet: An additional anti-folate target is dihyropteroate synthase (DHPS), which is unique to
          prokaryotes as they cannot acquire folate through dietary means.
        supports: SUPPORT
