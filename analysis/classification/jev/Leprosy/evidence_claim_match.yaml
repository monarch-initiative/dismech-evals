      assertion_type: Pathophysiology
      assertion:
        name: Intracellular Residence in Macrophages and Schwann Cells (Cell-Penetrant Drug Requirement)
        description: M. leprae is an obligate intracellular pathogen that survives within macrophages
          and Schwann cells. Effective therapy requires agents that reach the intracellular organism;
          rifampicin and dapsone penetrate host cells, whereas cell-wall-active beta-lactams are not used
          — the lifestyle gating that constrains drug choice.
        role: intrinsic_resistance
        conforms_to: intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion
        biological_processes:
        - preferred_term: Biological Process Involved in Interaction with Host
          term:
            id: GO:0051701
            label: biological process involved in interaction with host
      selected_evidence:
        snippet: The intracellular location of some microorganisms allow them to resist antibiotics with
          poor ability to penetrate eukaryotic cell membranes, such as the beta-lactam compounds.
        supports: SUPPORT
