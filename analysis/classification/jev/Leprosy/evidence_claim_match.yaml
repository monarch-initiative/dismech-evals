      assertion_type: Pathophysiology
      assertion:
        name: Mycobacterial RNA Polymerase (Rifampicin Target)
        description: Mycobacterium leprae depends on DNA-dependent RNA polymerase for transcription. Rifampicin,
          the most potent bactericidal component of multidrug therapy, binds the RpoB beta subunit and
          blocks RNA elongation. Because a single rpoB mutation confers high-level resistance, rifampicin
          is always given with dapsone and clofazimine — the rationale for combination MDT.
        role: therapeutic_vulnerability
        conforms_to: bacterial_rna_polymerase_inhibition#Bacterial RNA Polymerase (Rifamycin Target)
        biological_processes:
        - preferred_term: DNA-Templated Transcription
          term:
            id: GO:0006351
            label: DNA-templated transcription
      selected_evidence:
        snippet: The most clinically important and extensively studied class of antibiotics known to inhibit
          bacterial RNAP are the rifamycins.
        supports: SUPPORT
