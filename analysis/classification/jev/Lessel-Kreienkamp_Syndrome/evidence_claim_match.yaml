      assertion:
        name: AGO2 Gain-of-Function Missense Variants
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        role: trigger
        description: Most LESKRES missense and in-frame alleles (for example p.Leu192Pro, p.Ala367Pro,
          p.Thr357Met, p.Phe182del) produce a stably folded AGO2 that still binds and uses miRNA guides
          but has altered conformational dynamics around the L1 linker, helix-7 and PIWI loops. Kinetic,
          RNA Bind-n-Seq and knock-in mouse data led the authors to classify these alleles as gain of
          function, and they correlate with more severe clinical courses. The original 2020 cohort paper
          had described the tested alleles as loss of function, in the sense of excluding a dominant-negative
          effect; that earlier framing is recorded below as contrary evidence.
        genes:
        - preferred_term: AGO2
          term:
            id: hgnc:3263
            label: AGO2
        genetic_context:
          gene:
            preferred_term: AGO2
            term:
              id: hgnc:3263
              label: AGO2
          allele_type: missense
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Heterozygous, mostly de novo missense variants and single-residue in-frame deletions
            clustering in the L1 linker, helix-7 and PIWI-domain loops.
      selected_evidence:
        snippet: The combined results suggest patient mutations impact AGO2 targeting dynamics in a gain-of-function
          manner, leading to deregulation of the neuronal transcriptome and the observed neurodevelopmental
          anomalies.
        supports: SUPPORT
    origin:
