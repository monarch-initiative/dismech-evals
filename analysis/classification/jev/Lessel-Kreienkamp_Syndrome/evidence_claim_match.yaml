      assertion_type: Pathophysiology
      assertion:
        name: AGO2 Loss-of-Function Alleles
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        role: trigger
        description: A minority of LESKRES alleles abolish AGO2 function. The PIWI-domain missense p.Gly733Arg
          fails in almost every functional assay and does not bind target mRNAs, and a de novo 235.3-kb
          deletion removing the first three AGO2 exons (and part of PTK2) is predicted to cause haploinsufficiency.
          The mechanistic study associates this class with milder phenotypes than the gain-of-function
          class.
        genes:
