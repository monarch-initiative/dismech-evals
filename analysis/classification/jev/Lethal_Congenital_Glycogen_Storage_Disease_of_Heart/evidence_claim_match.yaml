  cf0a837904d4f922d883f064a686fe0571d55b681cbfa94383abbb11c3778792:
    claim:
      about:
        disease:
          name: Lethal Congenital Glycogen Storage Disease of Heart
          disease_term:
            preferred_term: lethal congenital glycogen storage disease of heart
            term:
              id: MONDO:0009867
              label: lethal congenital glycogen storage disease of heart
        context: []
      assertion_type: Genetic
      assertion:
        name: PRKAG2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        gene_term:
          preferred_term: PRKAG2
          term:
            id: hgnc:9386
            label: PRKAG2
        notes: PRKAG2 encodes the gamma-2 regulatory subunit of AMPK. Reported lethal alleles are the
          recurrent p.Arg531Gln and two substitutions at arginine 384 (p.Arg384Thr, p.Arg384Gly), all
          in the nucleotide-binding CBS domains. `variant_origin` is DE_NOVO because the cases are sporadic
          and parental testing, where done, found the variant absent (one R531Q trio, the R384G case;
          father only for R384T). No ClinGen gene-disease validity record for MONDO:0009867 is cached,
          so `gene_disease_validity` is not recorded.
        case_fractions:
        - population: Sporadic, unrelated patients with fatal congenital nonlysosomal cardiac glycogenosis
          case_fraction_percent: 60.0
          cohort_size: 5
          notes: Three of five patients carried PRKAG2 R531Q. A single small series; the PRKAG2-negative
            cases show the disorder is genetically heterogeneous.
        variants:
        - name: p.Arg531Gln
          description: Recurrent CBS-domain missense allele (c.1592G>A) found as an identical heterozygous
            substitution in unrelated sporadic patients, de novo where parents were tested. The recombinant
            protein loses more than 100-fold of its binding affinity for AMP and ATP while gaining basal
            kinase activity. Every reported carrier with fetal or infantile presentation died within months.
            At the same codon, p.Arg531Gly causes a hypertrophy-free childhood-onset pre-excitation phenotype
            (see `PRKAG2_Cardiac_Syndrome`).
        - name: p.Arg384Thr
          description: Heterozygous substitution of an arginine in the N-terminal AMP-binding CBS domain,
            reported in an infant who died at 5 months with massive cardiac glycogen storage. Like R531Q
            it reduces AMP and ATP binding; in intact cells it prevented activation of the heterotrimer
            by metabolic stress. Absent from the father, the only parent tested.
        - name: p.Arg384Gly
          description: De novo likely pathogenic c.1150A>G substitution at the same arginine 384, reported
            in a pregnancy presenting with nonimmune hydrops fetalis, bradycardia and cardiomyopathy.
      selected_evidence:
        snippet: Our studies confirm that mutations in PRKAG2 can cause fatal infantile cardiomyopathy,
          often associated with apparent PHK deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17667862
      reference_title: Fatal infantile cardiac glycogenosis with phosphorylase kinase deficiency and a
        mutation in the gamma2-subunit of AMP-activated protein kinase.
      evidence_source: HUMAN_CLINICAL
      explanation: An independent case with a second PRKAG2 allele confirms PRKAG2 as a cause of the fatal
        infantile form and frames the phosphorylase kinase deficiency as apparent.
