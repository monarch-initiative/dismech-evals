        phase: Early childhood mortality
        age_range: First 30 months of life in the index pedigree
        notes: 'In the index consanguineous pedigree every affected child died within the first 30 months.
          Death in early life is the rule across the whole reported series, but not always that early:
          the two siblings of the third family died of respiratory failure at 6 years and at 2.5 years,
          the second family''s patient was alive and under investigation at 21 months, the fourth patient
          was still being evaluated at 5.5 years, and the fifth was alive and ventilator-dependent at
          16 months when reported. So the MONDO label "lethal polymalformative syndrome" describes the
          index family''s tempo rather than the whole published series, and the OMIM title, which names
          early death without asserting uniform lethality, is closer to what has been reported. No survival
          analysis is possible from a dozen patients across five families, and none is attempted here.

          Mortality is recorded here rather than as a phenotype because HP:0003819 ("Death in childhood")
          sits under Age of death, within Clinical modifier, rather than under Phenotypic abnormality,
          and so is not a valid phenotype_term in this schema. The same reasoning is recorded in DTYMK-Related_Neurodegeneration
          and Neurodevelopmental_Disorder_with_Epilepsy_Spasticity_and_Brain_Atrophy.'
