  274b4773a63096eb1cb6ffe71d182140f750877108432ab41ed929cd37f914f7:
    claim:
      about:
        disease:
          name: Lethal Polymalformative Syndrome, Boissel Type
          disease_term:
            preferred_term: lethal polymalformative syndrome, Boissel type
            term:
              id: MONDO:0013050
              label: lethal polymalformative syndrome, Boissel type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic FTO missense variant
        biological_scale: MOLECULAR
        description: 'Five homozygous missense alleles have been reported: R316Q, S319F, R322Q and H271P
          in the catalytic domain, and R96P in the substrate-recognition lid outside the catalytic site.
          Four of the five have been characterised biochemically and reduce or abolish FTO demethylase
          activity, so the characterised alleles converge on the same molecular consequence from two different
          parts of the protein. H271P has not been assayed for demethylase activity in the report describing
          it; the case for it rests on homozygosity in a consanguineous patient, absence from population
          databases, and its location in the catalytic domain.'
        genes:
        - preferred_term: FTO
          term:
            id: hgnc:24678
            label: FTO
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          allele_type: SNV
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous missense alleles, four of the five with demonstrated loss of enzymatic
            function; the fifth (H271P) has not been directly assayed. No truncating or null allele has
            been reported in this disease, which leaves open whether complete absence of FTO protein is
            compatible with human life.
      selected_evidence:
        snippet: Loss-of-function resulting from the patient's R96P missense variant was demonstrated
          with in vitro biochemical characterization of demethylase activity, resulting in a 90% reduction
          in function of the fat mass and obesity-associated protein compared to wild-type.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
