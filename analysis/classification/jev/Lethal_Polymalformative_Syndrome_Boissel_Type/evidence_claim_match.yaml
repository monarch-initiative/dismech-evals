  64b17817584a1350249159b3a5f14502949409bd13a96cba1aa47d38cd1bfd6b:
    claim:
      about:
        disease:
          name: Lethal Polymalformative Syndrome, Boissel Type
          disease_term:
            preferred_term: lethal polymalformative syndrome, Boissel type
            term:
              id: MONDO:0013050
              label: lethal polymalformative syndrome, Boissel type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_fto_null_mouse_lacks_malformations
        prompt: Fto-null mice are viable with growth retardation and no reported central nervous system
          or cardiovascular malformation, while homozygous human missense carriers have a severe malformation
          syndrome. Is the difference species-specific, or an artefact of comparing a complete null with
          a hypomorphic missense allele?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of central nervous system development
        - pathophysiology#Failure of cardiovascular development
        - animal_models#Mouse
        - animal_models#Zebrafish
        rationale: 'The mouse reproduces the growth arm of the human phenotype and not the malformation
          arm, which is the arm this entry''s central pathophysiology node asserts. The zebrafish, by
          contrast, does reproduce the malformation arm - growth retardation, craniofacial dysmorphism,
          microcephaly and neural crest defects - so the mismatch is not simply "no model shows malformations".
          It is that the two models disagree with each other, and the mouse disagrees with itself: the
          same Fto knockouts that show no reported CNS or cardiovascular malformation do show tissue-specific
          ciliary abnormality. Three readings are open and nobody has separated them. The developmental
          requirement for FTO may differ across species; the mouse comparison may be wrong in kind, since
          every human patient carries a missense allele with residual protein and no human null has ever
          been reported; or mouse malformations may simply not have been looked for, since the null was
          made and phenotyped to study energy homeostasis. The absence of any reported human null allele
          is itself notable and could mean complete FTO loss is not viable in humans. No knock-in animal
          carrying a patient missense allele has been reported in any species.'
        proposed_experiments:
        - experiment_id: exp_fto_patient_allele_knockin_mouse
          name: Knock-in mouse carrying a patient FTO missense allele
          description: Generate mice homozygous for an orthologous R316Q or R96P allele and compare them
            with Fto nulls and wild-type littermates for survival, growth, brain and cardiac morphology,
            and craniofacial measurements.
          would_support:
          - pathophysiology#Failure of central nervous system development
          - pathophysiology#Failure of cardiovascular development
          supporting_outcome:
          - Malformations in the knock-in that are absent from the null would show the comparison, not
            the species, was the problem, and would make the missense alleles something other than simple
            loss of function.
          refuting_outcome:
          - A knock-in phenotype indistinguishable from the null, with no malformation in either, would
            locate the difference in the species and would mean mouse is not a usable model for the developmental
            arm of this disease.
          decision_criterion: Divergence between knock-in and null in malformation readouts resolves towards
            an allele-comparison artefact; convergence resolves towards a species difference.
      selected_evidence:
        snippet: Here we show that the loss of Fto in mice leads to postnatal growth retardation and a
          significant reduction in adipose tissue and lean body mass.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19234441
      reference_title: Inactivation of the Fto gene protects from obesity.
      evidence_source: MODEL_ORGANISM
      explanation: The reported null-mouse phenotype, which contains growth retardation and not malformation.
        This is the observation the mismatch rests on.
