            term:
              id: MONDO:0013050
              label: lethal polymalformative syndrome, Boissel type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Wnt pathway imbalance and defective ciliogenesis
        biological_scale: CELLULAR
        description: 'Loss of Fto shifts the balance between the two branches of Wnt signalling - canonical
          signalling falls because beta-catenin fails to translocate to the nucleus, while the non-canonical
          Wnt/calcium branch is activated through CaMKII and PKC-delta - and produces short, absent or
          disorganised cilia. In zebrafish this is accompanied by growth retardation, craniofacial dysmorphism,
          aberrant neural crest cell migration, microcephaly, situs inversus and renal cystogenesis, and
          Fto knockout mice show tissue-specific ciliary abnormality. This is the only worked-out route
          from FTO loss to a developmental phenotype, and it has been shown only in model systems: no
          patient tissue has been examined for either the Wnt shift or the ciliary defect.'
        biological_processes:
        - preferred_term: canonical Wnt signaling pathway
          modifier: DECREASED
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
        - preferred_term: Wnt signaling pathway, calcium modulating pathway
          modifier: INCREASED
          term:
            id: GO:0007223
            label: Wnt signaling pathway, calcium modulating pathway
        - preferred_term: cilium assembly
          modifier: DECREASED
          term:
            id: GO:0060271
            label: cilium assembly
        - preferred_term: neural crest cell migration
          modifier: ABNORMAL
          term:
            id: GO:0001755
            label: neural crest cell migration
        cell_types:
        - preferred_term: neural crest cell
          term:
            id: CL:0011012
            label: neural crest cell
      selected_evidence:
        snippet: Canonical Wnt signalling is down regulated by abrogated β-Catenin translocation to the
          nucleus whilst non-canonical Wnt/Ca(2+) pathway is activated via its key signal mediators CaMKII
          and PKCδ.
        supports: SUPPORT
    origin:
