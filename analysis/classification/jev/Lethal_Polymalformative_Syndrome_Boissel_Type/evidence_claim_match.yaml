          the case count is not a count of independent observations. No prevalence, incidence, or carrier
          frequency has been estimated for this disease and none is inferred here.
      selected_evidence:
        snippet: Pathogenically viable human variants in FTO appear to be exceedingly rare, with only
          11 cases of FTO malformation syndrome currently reported in the literature.
        supports: SUPPORT
