      assertion_type: AnimalModel
      assertion:
        name: fto-deficient zebrafish
        species: Zebrafish
        genotype: fto loss of function
        publication: PMID:24503721
        description: Loss of fto in zebrafish produces growth retardation, craniofacial dysmorphism, aberrant
          neural crest cell migration, microcephaly, situs inversus and renal cystogenesis, with short,
          absent or disorganised cilia. This is the only model that reproduces the malformation arm of
          the human phenotype.
        modeled_mechanisms:
        - target: Wnt pathway imbalance and defective ciliogenesis
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The model in which the Wnt and ciliary mechanism was established, and in which
            it is linked to organ-level malformation.
          limitations: 'Fidelity is MODERATE rather than HIGH because the perturbation is loss of function
            in a fish, whereas every human patient carries a homozygous missense allele with residual
            protein, and because two of the fish phenotypes - situs inversus and renal cystogenesis -
            are not reported in the human syndrome. Nothing has been shown in patient tissue: no human
            sample has been examined for either the Wnt shift or the ciliary defect.'
        - target: Failure of central nervous system development
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Microcephaly and neural crest defects in the fish correspond to human features;
            the structural brain malformations that dominate the human neurological phenotype are not
            reported in the model.
          limitations: The fish phenotype contains microcephaly and craniofacial dysmorphism but no counterpart
            of the ventriculomegaly, cortical atrophy, Dandy-Walker anomaly or epilepsy seen in patients,
            and it adds situs inversus and renal cystogenesis, which the human syndrome does not show.
            The perturbation is also loss of function in a fish, whereas every human patient carries a
            homozygous missense allele with residual protein. The correspondence is partial in both directions.
        - target: Impaired prenatal and postnatal growth
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Growth retardation is the first developmental defect named in the fish and is the
            human feature the two animal models agree on.
          limitations: The fish is a loss-of-function perturbation rather than a patient missense allele,
            and the report does not separate prenatal from postnatal growth in the way the human reports
            do.
      selected_evidence:
        snippet: Furthermore, we present the first evidence that FTO plays a role in development and cilia
          formation/function.
        supports: SUPPORT
