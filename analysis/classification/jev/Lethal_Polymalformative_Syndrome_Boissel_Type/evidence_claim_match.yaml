      - /disease_term
    evidence_metadata:
      reference: PMID:26287746
      reference_title: FTO Obesity Variant Circuitry and Adipocyte Browning in Humans.
      evidence_source: IN_VITRO
      explanation: The mechanism worked out to the level of a single base and a repressor motif, confirming
        the obesity association operates through IRX3 and IRX5 rather than through FTO.
