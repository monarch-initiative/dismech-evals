  c2ef6a9fb08c45c0fe502f746b3f534169ae5b52e52f2da469bc1a95b4cc784e:
    claim:
      about:
        disease:
          name: Lethal Polymalformative Syndrome, Boissel Type
          disease_term:
            preferred_term: lethal polymalformative syndrome, Boissel type
            term:
              id: MONDO:0013050
              label: lethal polymalformative syndrome, Boissel type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_fto_obesity_locus_is_a_different_molecule
        prompt: Is the large FTO obesity literature relevant evidence for this disease?
        kind: INTERPRETATION
        status: RESOLVED
        resolution_note: No. It is evidence about a different molecule and should not be cited here.
        attaches_to:
        - genetic#FTO
        rationale: 'Recorded because it is the retrieval trap this entry exists inside, and because the
          next curator will hit it. Searching FTO returns overwhelmingly the common intron-1 variants
          associated with body mass index. Those variants do not act on FTO protein function: the obesity-associated
          interval is a long-range regulatory landscape for the neighbouring homeobox genes IRX3 and IRX5,
          and the obesity-associated SNPs correlate with IRX3 expression rather than FTO expression in
          human brain. So an obesity-locus citation is not weak evidence for this disease; it is evidence
          about a regulatory element that happens to sit inside this gene. This is marked RESOLVED rather
          than OPEN because the question has an answer, and the answer is what governed which citations
          this entry accepts.'
      selected_evidence:
        snippet: Consistent with this, obesity-associated single nucleotide polymorphisms are associated
          with expression of IRX3, but not FTO, in human brains.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24646999
      reference_title: Obesity-associated variants within FTO form long-range functional connections with
        IRX3.
      evidence_source: IN_VITRO
      explanation: 'The cleanest statement of the point: the obesity variants track IRX3 expression and
        not FTO expression. This is why an obesity citation cannot support a claim about FTO protein function.'
