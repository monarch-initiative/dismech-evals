  7c43e89ab68748294cc1654399ae94b2a6b3ab3aa3ef5e4abdf403f7fee50862:
    claim:
      about:
        disease:
          name: Lethal Polymalformative Syndrome, Boissel Type
          disease_term:
            preferred_term: lethal polymalformative syndrome, Boissel type
            term:
              id: MONDO:0013050
              label: lethal polymalformative syndrome, Boissel type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_fto_substrate_responsible_for_malformation
        prompt: Which FTO demethylase activity does the malformation phenotype depend on - 3-methylthymidine
          in single-stranded DNA, N6-methyladenosine in mRNA, or something else?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of FTO 2-oxoglutarate-dependent demethylase activity
        rationale: The assay used has changed with the field rather than with the disease. The 2009 index
          report assayed 3-methylthymidine turnover in single-stranded DNA, following the 2007 characterisation
          of FTO, and predates the 2011 identification of FTO as the first mRNA m6A demethylase. The 2023
          report assayed m6A. No study has tested which activity the developmental phenotype requires,
          and the alleles do not separate the question because they reduce both. This matters for whether
          the disease belongs with the epitranscriptomic disorders or with the nucleic-acid repair dioxygenases,
          which are different mechanistic neighbourhoods, and it is the reason no module conformance is
          declared on the enzymatic node.
        proposed_experiments:
        - experiment_id: exp_fto_substrate_separating_alleles
          name: Substrate-separating FTO allele series in a developmental model
          description: Identify or engineer FTO variants that dissociate m6A RNA demethylase activity
            from 3-methylthymidine DNA demethylase activity, then express each in a human developmental
            model alongside the patient alleles and a null, and compare transcriptome-wide m6A, DNA methyl-lesion
            burden, and developmental readouts.
          would_support:
          - pathophysiology#Loss of FTO 2-oxoglutarate-dependent demethylase activity
          supporting_outcome:
          - A developmental phenotype tracking one activity and not the other would identify the substrate
            the disease depends on and would let the enzymatic node be bound to a specific molecular function
            rather than the generic dioxygenase term.
          refuting_outcome:
          - A phenotype requiring loss of both activities would show the question is malformed and that
            FTO's developmental role is not reducible to one substrate.
          decision_criterion: Segregation of the developmental readout with one activity resolves the
            gap; a requirement for both leaves the enzymatic node correctly generic.
      selected_evidence:
        snippet: We find that recombinant murine Fto catalyzes the Fe(II)- and 2OG-dependent demethylation
          of 3-methylthymine in single-stranded DNA, with concomitant production of succinate, formaldehyde,
          and carbon dioxide.
        supports: SUPPORT
