  cfccfdac4acb486e1750ada4c5223f12a531aec7877069e89e6c41cc7b691367:
    claim:
      about:
        disease:
          name: Leukocyte Adhesion Deficiency 1
          disease_term:
            preferred_term: leukocyte adhesion deficiency 1
            term:
              id: MONDO:0007293
              label: leukocyte adhesion deficiency 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ITGB2 Loss-of-Function Variants
        role: trigger
        biological_scale: MOLECULAR
        description: Both copies of ITGB2 at 21q22.3 carry variants that abolish or cripple CD18. The
          original molecular study resolved five distinct beta-subunit phenotypes across patients - absent
          mRNA and precursor, low mRNA and precursor, an aberrantly large precursor, an aberrantly small
          precursor, and a grossly normal precursor - which is why surface expression ranges from undetectable
          to near-normal-but-nonfunctional. Most missense variants cluster in the conserved betaI domain
          encoded by exons 5-9, the ligand-binding face of the receptor.
        genetic_context:
          gene:
            preferred_term: ITGB2
            term:
              id: hgnc:6155
              label: ITGB2
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous or compound heterozygous. Loss of function is established at the protein
            level rather than inferred from variant class - mutant beta precursors fail to associate with
            the alpha subunit, which is the defining biochemical result.
      selected_evidence:
        snippet: Here we demonstrate that the primary defect in LAD is in the beta subunit gene.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:3594570
      reference_title: Heterogeneous mutations in the beta subunit common to the LFA-1, Mac-1, and p150,95
        glycoproteins cause leukocyte adhesion deficiency.
      evidence_source: IN_VITRO
      explanation: Assigns the primary lesion to the shared beta subunit gene rather than to any individual
        alpha chain.
