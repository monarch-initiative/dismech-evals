        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated IL-23/IL-17 Axis at Barrier Sites
        role: effector
        biological_scale: TISSUE
        description: Tissue macrophages normally down-regulate IL-23 production when they phagocytose
          transmigrated apoptotic neutrophils. In LAD1 those neutrophils never arrive, so the brake is
          never applied and an otherwise physiological IL-23 response to the local microbiome runs unchecked,
          driving T-cell-derived IL-17 to high levels at the gingiva and skin. The elevation is compartmentalised
          rather than systemic - plasma IL-17 and IL-23 are low or absent - which matters because it means
          this is a local immunopathology, not a circulating inflammatory syndrome.
        cell_types:
        - preferred_term: gingival CD4+ T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: interleukin-17 production
          term:
            id: GO:0032620
            label: interleukin-17 production
          modifier: INCREASED
      selected_evidence:
        snippet: These data reveal that the elevated expression of IL-17 in LAD-I is compartmentalized
          rather than systemic.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24670684
      reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease
