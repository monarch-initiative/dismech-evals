  be03d85f74a0b4e4fe5fe1328f432ee605524fca84593d13e379bdaa63efa0c9:
    claim:
      about:
        disease:
          name: Leukocyte Adhesion Deficiency 1
          disease_term:
            preferred_term: leukocyte adhesion deficiency 1
            term:
              id: MONDO:0007293
              label: leukocyte adhesion deficiency 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Beta-2 Integrin Heterodimer Assembly
        role: central_effector
        biological_scale: MOLECULAR
        description: CD18 is the common beta chain of four heterodimers - LFA-1 (CD11a/CD18), Mac-1 (CD11b/CD18),
          p150,95 (CD11c/CD18) and CD11d/CD18. The alpha and beta subunits pair inside the cell before
          trafficking to the surface, so when the beta chain is absent or malformed the alpha chains cannot
          reach the membrane either. One gene defect therefore removes a whole receptor family, which
          is why the phenotype is broader than any single-integrin knockout would predict.
        cellular_components:
        - preferred_term: beta-2 integrin complex
          term:
            id: GO:0008305
            label: integrin complex
          modifier: DECREASED
        - preferred_term: LFA-1 (CD11a/CD18)
          term:
            id: GO:0034687
            label: integrin alphaL-beta2 complex
          modifier: DECREASED
        molecular_functions:
        - preferred_term: alpha/beta integrin subunit pairing
          term:
            id: GO:0046982
            label: protein heterodimerization activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Since the β and α subunits pair intracellularly, a decreased or mutated β subunit also
          leads to a decreased expression of the α subunit at the cell surface.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35408940
      reference_title: 'Understanding the Role of LFA-1 in Leukocyte Adhesion Deficiency Type I (LAD I):
        Moving towards Inflammation?'
      evidence_source: OTHER
      explanation: The intracellular-pairing requirement that makes a beta-chain defect take all four
        alpha chains down with it.
