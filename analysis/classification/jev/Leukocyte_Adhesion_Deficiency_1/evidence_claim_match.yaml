      assertion_type: Treatment
      assertion:
        name: Autologous Lentiviral ITGB2 Gene Therapy (Marnetegragene Autotemcel)
        therapeutic_modality: GENE_THERAPY
        description: 'Autologous CD34+ haematopoietic stem cells transduced ex vivo with a self-inactivating
          lentiviral vector carrying human ITGB2, given after myeloablative busulfan conditioning. The
          point of the approach is that it removes the two problems that limit allogeneic transplantation
          in this disease - donor availability and alloreactivity - and the phase 1-2 result bears that
          out: nine children with severe LAD-I, no graft failure, no adverse events attributed to the
          gene therapy itself, and 100% HSCT-free survival at one year. Serious adverse events were attributable
          to the busulfan conditioning rather than to the product, which is the expected pattern and the
          remaining cost of the approach.'
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: HSCT-free survival was 100% (95% confidence interval [CI], 66 to 100) at 1 year after
          infusion (P<0.001).
