            preferred_term: leukocyte adhesion deficiency 1
            term:
              id: MONDO:0007293
              label: leukocyte adhesion deficiency 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling and Prenatal Diagnosis
        therapeutic_modality: BEHAVIORAL
        description: 'Autosomal recessive inheritance carries a 25% recurrence risk per pregnancy for
          carrier couples. Because consanguinity is common in the reported families and ITGB2 sequencing
          is established, carrier testing and prenatal or preimplantation diagnosis are informative where
          the family allele is known. Molecular confirmation also has a direct therapeutic consequence
          here: genetic diagnosis is best practice before allogeneic transplantation and mandatory before
          gene therapy.'
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Moreover, the prenatal diagnosis would benefit families with a history of LAD-I.
        supports: SUPPORT
