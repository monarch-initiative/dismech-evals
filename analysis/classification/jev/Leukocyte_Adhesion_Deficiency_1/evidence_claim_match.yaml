        name: Antimicrobial Prophylaxis and Aggressive Infection Management
        therapeutic_modality: SMALL_MOLECULE
        description: Continuous antibacterial and antifungal prophylaxis, with hospital-based aggressive
          management and often prolonged or repeated courses for intercurrent infection. Trimethoprim-sulfamethoxazole
          is the prophylactic agent in the published cases. This is the standard of care while awaiting
          definitive therapy, and its limits are well documented - prophylaxis since infancy did not prevent
          progressive periodontal disease in any patient in the characterised cohort, because the periodontal
          arm is inflammatory rather than infective.
        treatment_term:
