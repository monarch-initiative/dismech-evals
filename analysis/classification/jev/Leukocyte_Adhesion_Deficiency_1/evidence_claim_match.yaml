            name: Failed Beta-2 Integrin Heterodimer Assembly
            role: central_effector
            biological_scale: MOLECULAR
            description: CD18 is the common beta chain of four heterodimers - LFA-1 (CD11a/CD18), Mac-1
              (CD11b/CD18), p150,95 (CD11c/CD18) and CD11d/CD18. The alpha and beta subunits pair inside
              the cell before trafficking to the surface, so when the beta chain is absent or malformed
              the alpha chains cannot reach the membrane either. One gene defect therefore removes a whole
              receptor family, which is why the phenotype is broader than any single-integrin knockout
              would predict.
