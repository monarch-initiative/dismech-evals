  19c8c913f89c21779499299333bd157f7549981e711a07c69ed67239577ffa10:
    claim:
      about:
        disease:
          name: Leukocyte Adhesion Deficiency 1
          disease_term:
            preferred_term: leukocyte adhesion deficiency 1
            term:
              id: MONDO:0007293
              label: leukocyte adhesion deficiency 1
        context: []
      assertion_type: Treatment
      assertion:
        name: IL-12/IL-23 p40 Blockade with Ustekinumab
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: Ustekinumab binds the p40 subunit shared by IL-12 and IL-23 and so shuts down the
          IL-23-driven IL-17 response that produces the periodontal and cutaneous immunopathology. This
          is a mechanism-directed treatment rather than an empirical one - the target was chosen from
          the observation that LAD1 lesions carry an IL-23/IL-17 signature and that blocking that axis
          prevents bone loss in the corresponding mouse model. In the index case, psoriasis dosing produced
          resolution of refractory gingival inflammation and complete healing of a two-year non-healing
          sacral wound within 10 to 14 months. The 2026 consensus now recommends anti-inflammatory therapy
          of this kind as part of supportive care, and before transplantation to help engraftment.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ustekinumab
            term:
              id: NCIT:C84237
              label: Ustekinumab
        notes: The evidence base is one published index case plus expert consensus, not a trial. The 2017
          report itself notes that treatment of additional patients is needed to clarify the role of the
          drug and its long-term safety in patients who are already immunodeficient.
      selected_evidence:
        snippet: By 10 to 14 months, the wound was completely healed with minimal residual scarring
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28328326
      reference_title: Interleukin-12 and Interleukin-23 Blockade in Leukocyte Adhesion Deficiency Type
        1.
      evidence_source: HUMAN_CLINICAL
      explanation: Healing of a wound that had progressed for two years through antibiotics and repeated
        debridement, which is the strongest single observation in the report.
