      assertion_type: Genetic
      assertion:
        name: ITGB2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: ITGB2
          term:
            id: hgnc:6155
            label: ITGB2
        notes: 'ITGB2 at 21q22.3 encodes CD18, the beta-2 integrin subunit. Two things about the allelic
          spectrum matter clinically. First, the severity gradient is quantitative - residual surface
          CD18 sets the phenotype, and the same gene produces everything from neonatal lethal disease
          to a presentation deferred into adolescence. Second, reduced surface expression is the usual
          but not the only mechanism: a normal amount of non-functional protein occurs, which is why the
          consensus recommends CD11a/CD11b measurement and ITGB2 sequencing alongside CD18 flow cytometry
          rather than relying on the CD18 number alone. Most missense variants fall in the conserved betaI
          domain encoded by exons 5-9, which carries the ligand-binding MIDAS motif.'
      selected_evidence:
        snippet: In LAD-I, mutations are found in ITGB2, the gene that encodes the β subunit of the β(2)
          integrins.
        supports: SUPPORT
