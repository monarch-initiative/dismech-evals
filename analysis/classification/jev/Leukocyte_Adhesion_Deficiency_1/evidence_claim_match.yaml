          infection and often reaching values that would suggest leukaemia in another context. It is the
          most counterintuitive finding in the disease and the one most likely to mislead - the count
          is high precisely because the cells cannot get to where they are needed. It normalises after
          successful HSCT or gene therapy, which is the cleanest demonstration that it is a consequence
          of the adhesion defect.
