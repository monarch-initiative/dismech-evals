        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation
        therapeutic_modality: CELL_THERAPY
        description: 'The established curative treatment for severe LAD-I, replacing the patient''s CD18-deficient
          haematopoiesis with donor cells that express functional beta-2 integrins. The largest outcome
          series is an EBMT registry cohort of 84 LAD-I and LAD-III patients transplanted between 2007
          and 2017, with 3-year overall survival of 83%. The event-free figure is considerably lower and
          is where the real difficulty lies: 17% graft failure at 3 years and 24% grade II-IV acute GVHD
          at 100 days, with acute GVHD a significant risk factor for death. Outcomes are better in younger
          patients, which is why the consensus asks for transplantation as soon as possible after diagnosis
          and ideally at or before 13 months of age. The registry authors argue that LAD''s own inflammatory
          component contributes to these transplant complications, which is the rationale for anti-inflammatory
          pretreatment.'
        treatment_term:
          preferred_term: allogeneic hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: The curative treatment of LAD-I and LAD-III is allogeneic hematopoietic stem cell transplantation
          (allo-HSCT).
        supports: SUPPORT
