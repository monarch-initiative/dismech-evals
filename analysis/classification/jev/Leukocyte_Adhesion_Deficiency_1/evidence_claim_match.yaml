      assertion_type: Diagnosis
      assertion:
        name: Neutrophil Integrin Flow Cytometry (CD18, CD11a, CD11b)
        description: 'Flow cytometry of peripheral neutrophils for CD18 together with CD11a and CD11b.
          This is both the diagnostic test and the severity classifier. The expanded panel is not redundancy:
          a patient can have at least 2% CD18 yet under 2% CD11a or CD11b, and the consensus counts that
          combination as severe disease - so measuring CD18 alone misclassifies exactly the patients for
          whom the classification decides whether to transplant.'
        diagnosis_term:
          preferred_term: flow cytometry
          term:
            id: NCIT:C16585
            label: Flow Cytometry
      selected_evidence:
        snippet: Without routine newborn screening for LAD-I, flow cytometry to assess leukocyte integrin
          expression is typically prompted by presentation of early signs or symptoms
        supports: SUPPORT
