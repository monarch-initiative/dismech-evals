            term:
              id: MONDO:0030893
              label: leukoencephalopathy, progressive, infantile-onset, with or without deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oxidative Phosphorylation Deficiency
        biological_scale: CELLULAR
        description: Failure of mitochondrial translation leaves the respiratory chain short of its mitochondrially
          encoded subunits, giving a combined complex deficiency and a shift toward anaerobic metabolism.
          Clinically this surfaces as elevated lactate and pyruvate. The tissues that fail first are the
          ones with the highest oxidative demand, which is the conventional explanation for why a translation
          defect of this kind presents with cochlear and central nervous system disease; no source cited
          here demonstrates that ordering for KARS1 specifically.
        biological_processes:
        - preferred_term: aerobic respiration
          term:
            id: GO:0009060
            label: aerobic respiration
          modifier: DECREASED
      selected_evidence:
        snippet: We propose that mitochondrial translation deficiency is the probable disease culprit
          in this and possibly other patients with mutations in KARS.
        supports: SUPPORT
    origin:
