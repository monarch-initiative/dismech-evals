  d8cc3a30d072ea0213cba2b36fd77237536617b47d5e1852005017d41ea4a48b:
    claim:
      about:
        disease:
          name: Leukoencephalopathy With Thalamus And Brainstem Involvement And High Lactate
          disease_term:
            preferred_term: leukoencephalopathy-thalamus and brainstem anomalies-high lactate syndrome
            term:
              id: MONDO:0013971
              label: leukoencephalopathy-thalamus and brainstem anomalies-high lactate syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Cognate amino acid (glutamate) supplementation
        description: Oral glutamate with a high-protein diet was given from birth to one antenatally diagnosed
          boy with EARS2 deficiency within an open series of patients with mitochondrial aminoacyl-tRNA
          synthetase deficiencies. After glutamate supplementation was stopped and his protein source
          was switched to a formula lacking L-glutamate, he developed progressive lactic acidosis and
          neurological regression. The rationale is that cognate amino acid deprivation reduced respiration
          in fibroblasts from patients with these deficiencies, including one EARS2 line. This is a single
          uncontrolled observation and is experimental.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: L-glutamic acid
            term:
              id: CHEBI:16015
              label: L-glutamic acid
      selected_evidence:
        snippet: Six hours after birth, he had his first seizure, after which anti‐epileptic medication,
          40 mg/kg/day glutamate and a high protein diet (3 g/kg/day) were initiated.
        supports: SUPPORT
