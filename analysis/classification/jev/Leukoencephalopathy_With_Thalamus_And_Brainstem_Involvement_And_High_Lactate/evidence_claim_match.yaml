          and declining lactate. Intermediate presentations between the two groups are described, and
          a later systematic review proposes a three-tier severe, moderate and mild clustering based on
          initial presentation.
      selected_evidence:
        snippet: In the mild form, clinical manifestations usually occur after the age of 6 months, with
          irritability and psychomotor regression, but clinical and biochemical improvement takes place
          from the second year of life without further clinical deterioration
