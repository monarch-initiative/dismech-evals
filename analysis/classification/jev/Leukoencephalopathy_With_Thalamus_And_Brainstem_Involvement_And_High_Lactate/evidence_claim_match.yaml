        variant_origin: GERMLINE
        presence: PRESENT
        notes: Variants are mostly missense, with start-loss, nonsense, splice and in-frame deletion alleles;
          severe null alleles tend to be combined with missense alleles. No genotype-phenotype correlation
          has been identified, and patients sharing a genotype can differ markedly. Fibroblast metabolomics
          separated variants from mild and severe patients in one study. Functionally damaging EARS2 variants
          have been found in a patient whose leukoencephalopathy with calcifications and cysts was explained
          by SNORD118, and in an adult with late-onset leukoencephalopathy whose causality the authors
          left open, so a functional defect in vitro does not by itself establish the diagnosis.
        variants:
        - name: c.1A>G (p.Met1?)
          description: Start-loss allele, compound heterozygous with p.Ile62Phe in a fatal neonatal-onset
            patient of Portuguese ancestry; previously reported in a single Portuguese patient, suggesting
            a possible founder allele.
        - name: p.Ile62Phe
          description: Novel missense allele in trans with p.Met1? in a fatal severe case; the patient's
            fibroblasts and muscle had markedly reduced EARS2 protein.
        - name: p.Lys65Glu
          description: Homozygous in two unrelated patients with a severe and fatal form.
        - name: p.Arg107Cys
          description: Recurrent allele; carried by two Turkish patients with shared facial features and
            by a Chinese patient with B-cell dysfunction, each with a different second allele.
        - name: p.Arg108Trp
          description: Homozygous in a girl with early-onset mild disease; also reported in trans with
            p.Gly110Ser in a patient without the typical MRI pattern.
        - name: p.Gly110Ser
          description: Recurrent allele found in multiple LTBL patients.
        - name: p.Gln126*
          description: Nonsense allele in trans with p.Gly224Ser in a severe patient with later cerebellar
            atrophy; the patient's fibroblasts had reduced respiration.
        - name: p.Gly224Ser
          description: Missense allele first reported in a mild patient and later in trans with p.Gln126*
            in a severe patient; relatively frequent in African populations in gnomAD despite its pathogenicity.
        - name: p.Gly301Ala
          description: Homozygous in a boy with intermediate disease and partial recovery.
        - name: p.Gly317Cys
          description: Homozygous in a neonate with fatal lactic acidosis and absent corpus callosum;
            EARS2 protein level was normal, so the allele is thought to impair catalysis rather than stability.
