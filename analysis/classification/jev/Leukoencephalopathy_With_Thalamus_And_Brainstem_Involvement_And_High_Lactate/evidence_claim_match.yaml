        name: Severe
        display_name: Severe LTBL
        description: Early (often neonatal or early-infantile) onset with delayed psychomotor development,
          hypotonia, seizures and persistently raised lactate, followed by clinical stagnation without
          recovery and progressive atrophy of the affected brain structures. Rapidly fatal neonatal cases
          with corpus callosum agenesis, lactic acidosis and liver involvement are reported at the far
          end of this group. No genotype-phenotype correlation separates the groups; the grouping is clinical
          and radiological.
      selected_evidence:
        snippet: those of the 'severe' group were characterized by clinical stagnation, brain atrophy
          on magnetic resonance imaging and persistent lactate increases
        supports: SUPPORT
