        context: []
      assertion_type: Treatment
      assertion:
        name: ISR Modulation (eIF2B activity enhancement, investigational)
        description: 'Disease-modifying approaches target the deregulated integrated stress response.
          The eIF2B activator ISRIB normalized ISR mRNA markers and ameliorated neuropathology in VWM
          mice, and the FDA-approved alpha2-agonist guanabenz, which modulates eIF2 phosphorylation/eIF2B
          activity, improved Bergmann glia and cerebellar myelin pathology in VWM mice. Guanabenz has
          since been taken into humans: a single-arm phase 1/2 trial in 33 children with early-childhood-onset
          VWM reported a significantly lower risk of losing the ability to walk with support than in 66
          matched untreated historical controls, at the cost of a substantial adverse-event burden dominated
          by transient hallucinations. The comparison was non-randomised and the authors call for confirmation
          in a long-term extension study, so guanabenz is an investigational therapy with the first human
          efficacy signal rather than an established one. The direct eIF2B activator fosigotifator (ABBV-CLS-7262)
          is in an ongoing open-label phase 1b/2 study. See the clinical_trials block.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: guanabenz
            term:
              id: CHEBI:5553
              label: Guanabenz
          - preferred_term: fosigotifator (ABBV-CLS-7262)
            term:
              id: CHEBI:759733
              label: fosigotifator
      selected_evidence:
        snippet: The compound ISRIB (for "ISR inhibitor") was administered to VWM mice to increase eIF2B
          activity.
        supports: SUPPORT
