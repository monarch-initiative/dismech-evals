        context:
        - path: /experimental_models/1
          value:
            name: VWM patient iPSC-derived rapid myelinating oligodendrocyte cerebral organoids
            description: Cerebral organoids from iPSCs of one EIF2B5-mutant and one EIF2B4-mutant VWM
              patient and two wild-type lines, built with a growth-factor protocol that yields mature
              astrocytes, oligodendrocytes and myelin within about eight weeks. Mutant organoids are smaller,
              carry more immature and dysfunctional astrocytes and oligodendrocytes, and form sparse,
              thinner myelin. Treatment with the eIF2B activator ISRIB lowers UPR markers and improves
              glial and myelin maturation.
            experimental_model_type: ORGANOID
            organism:
              preferred_term: human
