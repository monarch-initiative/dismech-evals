  795e9a15578c99f4aa602f83bfe85b5b5a305f78ef0e17526db7611e18c61c33:
    claim:
      about:
        disease:
          name: Leukoencephalopathy With Vanishing White Matter
          disease_term:
            preferred_term: leukoencephalopathy with vanishing white matter
            term:
              id: MONDO:0800448
              label: leukoencephalopathy with vanishing white matter
        context: []
      assertion_type: Definition
      assertion:
        name: 2025 VWM Consortium Consensus Diagnostic Recommendations
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'Delphi consensus recommendations of the international VWM clinical expert consortium
          (van Voorst et al., Neurology 2025). Diagnosis rests on the combination of clinical features,
          a characteristic brain MRI pattern, and genetic confirmation of biallelic pathogenic or likely
          pathogenic variants in one of EIF2B1-EIF2B5. MRI and genotype are weighed against each other:
          a typical MRI with a single variant prompts a search for a second variant in trans, while a
          typical MRI with no EIF2B1-5 variant makes VWM unlikely.'
        scope: Patients of any age with suspected vanishing white matter
        criteria_sets:
        - name: Combined clinical, MRI and genetic diagnosis
          description: All three elements together establish the diagnosis. Clinical features are chronic
            neurologic decline with superimposed subacute episodes of rapid deterioration provoked by
            stressors such as febrile infection or minor head trauma, at any age of onset.
          core_clinical_characteristics:
          - preferred_term: Progressive cerebellar ataxia
            description: Chronic neurologic decline, dominated by cerebellar ataxia and spasticity in
              childhood-onset disease; in adult-onset disease cognitive decline may dominate.
            term:
              id: HP:0002073
              label: Progressive cerebellar ataxia
          - preferred_term: Stressor-provoked episodes of acute neurologic deterioration
            description: Subacute episodes of rapid decline provoked by febrile infection, minor head
              trauma, anesthesia, surgery, or acute fright.
          imaging_requirements:
          - preferred_term: Characteristic VWM brain MRI pattern
            description: Bilateral confluent T2/FLAIR hyperintensity of the periventricular and deep cerebral
              white matter and the inner rim of the corpus callosum, sparing the subcortical white matter
              early, with progressive rarefaction and cystic degeneration of the affected white matter
              to a CSF-like signal in advanced disease (guideline Table 2 and Figures 1-2).
            term:
              id: HP:0002352
              label: Leukoencephalopathy
          laboratory_requirements:
          - preferred_term: Biallelic pathogenic or likely pathogenic EIF2B1-5 variants
            description: Genetic confirmation with biallelic pathogenic or likely pathogenic variants
              in a single EIF2B1-EIF2B5 gene. Most known pathogenic variants are missense; biallelic null
              variants have not been described.
          additional_requirements:
          - preferred_term: Search for a second variant in trans when only one is found
            description: With a typical MRI and a single pathogenic or likely pathogenic variant, a second
              variant in trans (even of uncertain significance) should be sought by Sanger sequencing,
              cDNA analysis, array CGH, MLPA, or long-read genome sequencing, with MRI and clinical review
              at a VWM expert center when the genotype is uncertain.
          exclusion_criteria:
          - preferred_term: No EIF2B1-5 variant despite a VWM-like MRI
            description: If the MRI pattern is consistent with VWM but no pathogenic or likely pathogenic
              EIF2B1-5 variant is found, VWM is unlikely and another diagnosis should be sought, most
              likely a mitochondrial leukoencephalopathy.
        notes: The guideline's Table 2 (brain MRI characteristics by subtype and disease stage) and eTable
          6 (all known EIF2B1-5 genotypes) are not present in the cached full text, so the imaging requirement
          is summarized from the Figure 1 legend and from the MRI evidence already cited on the Leukoencephalopathy
          phenotype (PMID:9109866); consult Table 2 directly for the stage-specific detail. The drug-class
          ISR categorization from the same guideline (Table 3) is curated separately in `environmental`,
          where only the anesthetic class is recorded because it is the only class with clinical evidence
          of provoking decline.
      selected_evidence:
        snippet: There was majority agreement that the diagnosis of VWM is based on a combination of clinical
          features, brain MRI characteristics, and genetic confirmation.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41232062
      reference_title: Consensus-Based Expert Recommendations for Diagnosis and Clinical Management of
        Vanishing White Matter.
      evidence_source: OTHER
      quote_role: PRIMARY_RESULT
      explanation: States the three-part structure of the consensus diagnostic definition.
