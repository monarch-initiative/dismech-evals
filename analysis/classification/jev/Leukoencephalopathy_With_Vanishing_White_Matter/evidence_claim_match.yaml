              term:
                id: CL:0000128
                label: oligodendrocyte
            conditions:
            - EIF2B5 compound heterozygous patient iPSC-derived organoid
            - EIF2B4 compound heterozygous patient iPSC-derived organoid
            - ISRIB treatment
            cell_source: Patient-derived iPSCs (EIF2B5 c.1827_1838del and c.1157G>A; EIF2B4 c.932T>C and
              c.1195A>C) and two wild-type iPSC lines
            culture_system: Rapid myelinating oligodendrocyte cerebral organoids
            publication: PMID:40296303
          role: ancestor
        - path: /experimental_models/1/modeled_mechanisms/1
          value:
