            target: Deregulated Integrated Stress Response
            direction: INCREASED
            interpretation: ISR activation in eif2b3 mutant zebrafish.
        - target: Progressive White Matter Rarefaction and Cavitation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Mutants show defective myelin development and glial cell differentiation.
          limitations: A developmental myelination defect in larvae, not progressive loss and cystic cavitation
            of established white matter. Abstract-level evidence only.
      selected_evidence:
        snippet: Using CRISPR, we generated two mutant alleles in zebrafish eif2b3, 10- and 16-bp deletions,
