          modifier: DECREASED
          term:
            id: GO:0048708
            label: astrocyte differentiation
      selected_evidence:
        snippet: In coculture, VWM astrocytes secreted factors that inhibited oligodendrocyte maturation,
          whereas WT astrocytes allowed normal maturation of VWM oligodendrocytes.
        supports: SUPPORT
