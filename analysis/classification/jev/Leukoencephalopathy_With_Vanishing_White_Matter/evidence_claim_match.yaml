  70199f22f125f62cc94d583db43802b4361f7e5851702a0e5863d3845bbfdc3a:
    claim:
      about:
        disease:
          name: Leukoencephalopathy With Vanishing White Matter
          disease_term:
            preferred_term: leukoencephalopathy with vanishing white matter
            term:
              id: MONDO:0800448
              label: leukoencephalopathy with vanishing white matter
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: eIF2B Translation Initiation Complex Deficiency
        description: 'Biallelic pathogenic variants in EIF2B1-EIF2B5 partially reduce the guanine nucleotide
          exchange activity of eIF2B, the five-subunit GEF that recycles inactive eIF2-GDP to active eIF2-GTP
          to permit translation initiation. eIF2B has an essential housekeeping role in translation and
          in its regulation during stress, yet the white matter (and ovaries) are selectively vulnerable.

          '
        genes:
        - preferred_term: EIF2B1
          term:
            id: hgnc:3257
            label: EIF2B1
        - preferred_term: EIF2B2
          term:
            id: hgnc:3258
            label: EIF2B2
        - preferred_term: EIF2B3
          term:
            id: hgnc:3259
            label: EIF2B3
        - preferred_term: EIF2B4
          term:
            id: hgnc:3260
            label: EIF2B4
        - preferred_term: EIF2B5
          term:
            id: hgnc:3261
            label: EIF2B5
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: translational initiation
          modifier: DECREASED
          term:
            id: GO:0006413
            label: translational initiation
        - preferred_term: translation
          modifier: ABNORMAL
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: We have identified mutations in EIF2B5 and EIF2B2, encoding the epsilon- and beta-subunits
          of the translation initiation factor eIF2B and located on chromosomes 3q27 and 14q24, respectively,
          as causing VWM.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11704758
      reference_title: Subunits of the translation initiation factor eIF2B are mutant in leukoencephalopathy
        with vanishing white matter.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies mutations in eIF2B subunit genes as the cause of VWM, establishing the primary
