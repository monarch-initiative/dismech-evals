          astrocytes secrete factors that inhibit oligodendrocyte maturation, while wild-type astrocytes
          permit normal maturation of mutant oligodendrocytes. Specialized astrocytes such as cerebellar
          Bergmann glia and retinal Mueller cells are also involved.

          '
        cell_types:
