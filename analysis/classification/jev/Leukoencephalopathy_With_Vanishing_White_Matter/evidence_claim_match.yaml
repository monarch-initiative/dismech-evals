  bf6601d0c2cc87cea7ef17a9a22f5a2e833e1720880e793fe37cd8379d003a5b:
    claim:
      about:
        disease:
          name: Leukoencephalopathy With Vanishing White Matter
          disease_term:
            preferred_term: leukoencephalopathy with vanishing white matter
            term:
              id: MONDO:0800448
              label: leukoencephalopathy with vanishing white matter
        context: []
      assertion_type: AnimalModel
      assertion:
        name: eif2b5 zc103 homozygous zebrafish
        species: Zebrafish
        genotype: eif2b5 zc103 homozygous (eif2b5 zc103/zc103; CRISPR in-frame deletion)
        publication: PMID:33300869
        description: CRISPR-generated eif2b5 mutant zebrafish, the homozygous-viable allele of the series
          in Keefe et al. 2020. Homozygotes survive to adulthood but are smaller, show increased CNS apoptosis
          including apoptotic oligodendrocyte precursor cells in the hindbrain, baseline ISR activation,
          and thinner myelin sheaths with reduced brain volume as adults. The same paper's more severe
          alleles (eif2b5 zc102, eif2b2 sa17223) die by about 10 days post fertilization. Keefe et al.
          found no swimming deficit in zc103 homozygotes at 5 days post fertilization, whereas the later
          lithium study reports reduced distance moved, moving time and velocity at 7 days.
        modeled_mechanisms:
        - target: Deregulated Integrated Stress Response
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: ISR transcripts (atf4, bip, chop II) are raised at baseline in eif2b5 and eif2b2
            mutant larvae, the constitutive ISR activation the node describes.
          limitations: Measured by whole-larva qRT-PCR, so the astrocyte-predominant pattern the node
            describes is not resolved. The authors attribute part of the ISR activation to a truncated
            eif2b5 transcript produced by intron 12 retention, a feed-forward mechanism not shown in patients.
          readouts:
          - name: ISR transcript levels (atf4, bip, chop II, perk)
            target: Deregulated Integrated Stress Response
            direction: INCREASED
            interpretation: Constitutive ISR activation in eif2b mutant larvae.
        - target: Progressive White Matter Rarefaction and Cavitation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Adult zc103 homozygotes have thinner myelin sheaths (raised G-ratio) in the optic
            nerve, disorganized myelinated axons in the optic tectum and reduced brain volume on MRI.
          limitations: The zebrafish show hypomyelination and reduced brain size, not the progressive
            rarefaction and cystic cavitation of cerebral white matter that define the human node. Teleosts
            have no cerebral hemispheric white matter comparable to the human centrum semiovale.
          readouts:
          - name: Myelin sheath thickness (G-ratio, adult optic nerve)
            target: Progressive White Matter Rarefaction and Cavitation
            direction: DECREASED
            interpretation: Thinner myelin in adult mutants, measured by transmission electron microscopy.
      selected_evidence:
        snippet: This created three alleles (zc101, zc103, and zc104) with in-frame deletions leading
          to loss of amino acids
        supports: SUPPORT
