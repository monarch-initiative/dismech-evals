        - Eif2b5 Arg191His/Arg191His mouse iPSC-derived astrocytes
        - astrocyte-oligodendrocyte coculture
        cell_source: Fibroblast-derived iPSCs from two VWM patients with EIF2B5 mutations (reported as
          1484A>G and 806G>A) and three controls; mouse iPSCs from wild-type and Eif2b5 R191H homozygous
          mice
        culture_system: Two-dimensional astrocyte subtype cultures and astrocyte-oligodendrocyte cocultures
        publication: PMID:31433864
        modeled_mechanisms:
