      assertion:
        name: eif2b5 zc103 zebrafish treated with lithium
        species: Zebrafish
        genotype: eif2b5 zc103 homozygous (eif2b5 zc103/zc103), 1 mM LiCl from 1 to 7 days post fertilization
        publication: PMID:38352041
        description: Lithium, an indirect eIF2B activator through GSK3-beta inhibition, was screened first
          in eif2b5 zc103 mutant zebrafish, where it improved swimming, and then in 2b4he2b5ho mice, where
          it did not help (see the mouse lithium entry above). The authors used the zebrafish as a rapid
          screening platform and conclude lithium is not a candidate for further development in VWM.
        modeled_mechanisms:
        - target: Cerebellar ataxia
          relationship: RESCUES
          fidelity: LOW
          description: Lithium improved distance moved, moving time and swimming velocity in mutant larvae
            without affecting wild-type larvae.
          limitations: The benefit did not carry over to 2b4he2b5ho mice, ISR markers were not measured
            in the fish, and lithium acts on several pathways besides GSK3-beta.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The model's quantity is total swimming movement of 7-day larvae in an automated
              tracking assay. The phenotype's quantity is cerebellar incoordination of gait and limbs
              in patients, which larval swimming does not separate from weakness or general motor slowing.
          readouts:
          - name: Larval swimming distance, moving time and velocity
            target: Cerebellar ataxia
            direction: RESTORED
            interpretation: Partial recovery of the mutant swimming deficit on lithium.
      selected_evidence:
        snippet: Lithium improved motor behavior in homozygous eif2b5 mutant zebrafish.
        supports: SUPPORT
