            term:
              id: MONDO:0800448
              label: leukoencephalopathy with vanishing white matter
        context: []
      assertion_type: ClinicalTrial
      assertion:
        name: EUCTR2017-001438-25-NL
        phase: PHASE_II
        status: COMPLETED
        description: Single-arm, open-label phase 1/2 trial of oral guanabenz in children with early-childhood-onset
          VWM, run at Amsterdam UMC with international recruitment (33 patients enrolled May 2021 to May
          2024, 31 completing; 4-year trial duration). The primary efficacy outcome was time to loss of
          walking with support, compared against untreated historical controls from the Vanishing White
          Matter Registry matched 1:2 on age of onset and disability at the same disease duration. This
          is the first human trial of ISR modulation in VWM. It is registered on the EU Clinical Trials
          Register (EudraCT 2017-001438-25) and CTIS (2023-503320-89-00), not on ClinicalTrials.gov, so
          it is keyed on its WHO ICTRP record.
        target_phenotypes:
        - preferred_term: Loss of walking with support (trial primary efficacy outcome)
          term:
            id: HP:0002540
            label: Inability to walk
        - preferred_term: Progressive cerebellar ataxia
          term:
            id: HP:0002073
            label: Progressive cerebellar ataxia
        - preferred_term: Spasticity
          term:
            id: HP:0001257
            label: Spasticity
        notes: 'Curated as PHASE_II because the ClinicalTrialPhaseEnum has no combined phase 1/2 value
          and the ICTRP record scores the trial "Therapeutic exploratory (Phase II): yes". The publication
          describes it as phase 1/2. Status is COMPLETED: the 4-year trial closed with the primary analysis
          published, although the authors call for a long-term extension study. The accompanying commentary
          (PMID:42586085) and the paediatric PK/PD analysis (PMID:42315850) are not curated here.

          '
      selected_evidence:
        snippet: 24 of these reactions were hallucinations, occurring in 18 (55%) of 33 patients; these
          occurred intermittently, occurred mostly within the first 4 months of treatment, and mostly
          resolved within 4 months after the first event.
        supports: SUPPORT
