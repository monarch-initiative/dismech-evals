        context: []
      assertion_type: Environmental
      assertion:
        name: Febrile infection
        description: 'Febrile infections are the most common trigger of an episode of rapid neurological
          deterioration in VWM, and the guideline states the mechanism explicitly: fever activates the
          integrated stress response, which the eIF2B defect has already deregulated. This is why the
          entry''s management side recommends vaccination, antipyretics, and a lower threshold for antibiotics.'
        notes: 'Left ontology-unbound deliberately. ECTO was searched for a class covering infection or
          fever as an exposure ("exposure to infection", "exposure to fever", "exposure to pathogen",
          "exposure to microbe", "exposure to increased body temperature"): the only hits are named-pathogen
          classes under ECTO:3000000 (exposure to organism) and named-virus classes under ECTO:3000001
          (exposure to virus). The curated exposure here is *any* febrile infection, and what the guideline
          says acts on the ISR is the fever, not the organism, so binding either parent would assert something
          narrower or broader than the evidence. Per the ontology-term contract, a free-text name is preferred
          to a wrong binding. ECTO:4000001 (exposure to increased temperature) is about ambient temperature,
          not body temperature, and is not a substitute.

          '
      selected_evidence:
        snippet: Fever activates the ISR, and febrile infections are the most common triggers for acute
          decline in patients with VWM.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
