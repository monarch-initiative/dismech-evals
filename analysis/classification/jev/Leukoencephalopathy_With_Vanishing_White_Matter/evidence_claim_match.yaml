  c210a405bad7be795705ca6430f43bf87366bdc7cca414af8e595607ab84da30:
    claim:
      about:
        disease:
          name: Leukoencephalopathy With Vanishing White Matter
          disease_term:
            preferred_term: leukoencephalopathy with vanishing white matter
            term:
              id: MONDO:0800448
              label: leukoencephalopathy with vanishing white matter
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: VWM patient iPSC-derived rapid myelinating oligodendrocyte cerebral organoids
        description: Cerebral organoids from iPSCs of one EIF2B5-mutant and one EIF2B4-mutant VWM patient
          and two wild-type lines, built with a growth-factor protocol that yields mature astrocytes,
          oligodendrocytes and myelin within about eight weeks. Mutant organoids are smaller, carry more
          immature and dysfunctional astrocytes and oligodendrocytes, and form sparse, thinner myelin.
          Treatment with the eIF2B activator ISRIB lowers UPR markers and improves glial and myelin maturation.
        experimental_model_type: ORGANOID
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        tissue_term:
          preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        conditions:
        - EIF2B5 compound heterozygous patient iPSC-derived organoid
        - EIF2B4 compound heterozygous patient iPSC-derived organoid
        - ISRIB treatment
        cell_source: Patient-derived iPSCs (EIF2B5 c.1827_1838del and c.1157G>A; EIF2B4 c.932T>C and c.1195A>C)
          and two wild-type iPSC lines
        culture_system: Rapid myelinating oligodendrocyte cerebral organoids
        publication: PMID:40296303
        modeled_mechanisms:
        - target: Astrocyte Dysfunction and Selective Glial Vulnerability
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Mutant organoids contain more immature and dysfunctional astrocytes and oligodendrocytes,
            matching the glial maturation failure the node describes, in a human three-dimensional system
            with both lineages present.
          limitations: Two patient lines and two wild-type lines, without isogenic controls. The organoids
            do not resolve which glial lineage drives the defect, and the accelerated growth-factor protocol
            enriches glia, which the authors note may exaggerate differences from wild type.
          readouts:
          - name: Immature astrocyte markers (nestin, GFAP-delta, alpha-B-crystallin)
            target: Astrocyte Dysfunction and Selective Glial Vulnerability
            direction: INCREASED
            interpretation: Mutant organoids carry more immature and dysfunctional glia than wild type.
          - name: Myelin G-ratio
            target: Astrocyte Dysfunction and Selective Glial Vulnerability
            direction: INCREASED
            interpretation: A higher G-ratio means thinner myelin, the downstream consequence of failed
              glial maturation in this model.
        - target: Deregulated Integrated Stress Response
          relationship: RESCUES
          fidelity: LOW
          description: ISRIB, an eIF2B activator, lowers ATF4 and XBP1-S expression and improves glial
            and myelin maturation in mutant organoids.
          limitations: The study reads out all three UPR arms (ATF4, ATF6-N, XBP1-S) rather than ISR-specific
            markers, and the authors note that VWM mouse models show no UPR activation, so this system
            may report a stress state the mice do not. A single ISRIB concentration was tested.
          readouts:
          - name: ATF4 and XBP1-S mRNA after ISRIB
            target: Deregulated Integrated Stress Response
            direction: DECREASED
            interpretation: Stress-response transcripts fall in mutant organoids on ISRIB treatment.
      selected_evidence:
        snippet: We constructed EIF2B4 and EIF2B5 mutants as well as wild-type rapid myelinating oligodendrocyte
          brain organoids using human induced pluripotent stem cells (iPSCs).
        supports: SUPPORT
