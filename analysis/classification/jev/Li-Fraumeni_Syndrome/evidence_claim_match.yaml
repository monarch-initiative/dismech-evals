      assertion_type: Treatment
      assertion:
        name: Metformin Chemoprevention (Investigational)
        description: Metformin is being evaluated as a precision-prevention agent in adults with LFS in
          the open-label randomized phase II MILI trial (224 participants randomized to oral metformin
          plus annual MRI surveillance vs surveillance alone; primary endpoint 5-year cumulative cancer-free
          survival). The rationale is the LFS-specific bioenergetic shift toward elevated mitochondrial
          oxidative phosphorylation, which can be pharmacologically attenuated by metformin (mitochondrial
          complex I inhibition, AMPK activation, mTORC1 suppression). Mouse-model and human pilot data
          show metformin reduces mitochondrial activity and delays tumorigenesis. This is an experimental
          intervention; it is not yet standard of care.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: metformin
            term:
              id: CHEBI:6801
              label: metformin
      selected_evidence:
        snippet: genetic or pharmacologic disruption of mitochondrial respiration improves cancer-free
          survival
        supports: SUPPORT
