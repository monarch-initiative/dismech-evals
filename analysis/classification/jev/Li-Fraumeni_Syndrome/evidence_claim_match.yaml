  aea0116f45145bfaf4b3888cc2aad362cb3deeb7b6b690de8724ca0246ba22ed:
    claim:
      about:
        disease:
          name: Li-Fraumeni Syndrome
          disease_term:
            preferred_term: Li-Fraumeni syndrome
            term:
              id: MONDO:0018875
              label: Li-Fraumeni syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Ferroptosis Surveillance
        description: Wild-type p53 transcriptionally represses SLC7A11, limiting cystine uptake via the
          xCT antiporter and sensitizing cells to ferroptosis - an iron-dependent, lipid-peroxidation-driven
          form of regulated cell death. Loss of p53 (or expression of certain mutant alleles that fail
          to repress SLC7A11) derepresses SLC7A11, increases intracellular GSH, blunts lipid peroxidation,
          and renders cells refractory to ROS-induced ferroptosis. This non-canonical tumor-suppressor
          activity is independent of cell-cycle arrest, apoptosis, and senescence and contributes to LFS
          tumor susceptibility and to the radiosensitivity of p53-wild-type tumors.
        biological_processes:
        - preferred_term: ferroptosis
          modifier: DECREASED
