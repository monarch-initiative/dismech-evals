      assertion_type: Phenotype
      assertion:
        category: Neoplastic
        name: Leukemia
        frequency: OCCASIONAL
        description: 'Acute leukemias (both ALL and AML) occur at increased frequency in LFS patients,
          often at young ages. Therapy-related MDS/AML is an additional risk after cytotoxic treatment
          of an earlier primary cancer, reflecting expansion of pre-existing TP53-mutant hematopoietic
          clones under selective pressure from chemotherapy and radiation. Within childhood B-cell ALL
          the association is concentrated in the hypodiploid subtype: germline pathogenic TP53 variants
          are enriched about fivefold relative to non-ALL controls, carriers present later in childhood,
          roughly two thirds of carrier cases are hypodiploid, and carriers have markedly worse event-free
          and overall survival together with a much higher incidence of second malignant neoplasms after
          ALL therapy.'
        phenotype_term:
          preferred_term: Acute leukemia
          term:
            id: HP:0002488
            label: Acute leukemia
      selected_evidence:
        snippet: Children with TP53 pathogenic variants were significantly older at ALL diagnosis (median
          age, 15.5 years v 7.3 years; P < .001) and were more likely to have hypodiploid ALL (65.4% v
          1.2%; P < .001).
        supports: SUPPORT
