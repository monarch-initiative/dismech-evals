        description: Multimodal cell-free DNA assays integrating targeted gene panels, shallow whole-genome
          sequencing, and methylation profiling have demonstrated proof-of-principle for early cancer
          detection in LFS, with positive predictive value 67.6% and negative predictive value 96.5% in
          a longitudinal cohort of 89 carriers, and detection of cancer-associated signal months before
          conventional imaging diagnosis. cfDNA surveillance is being developed as a complement to, not
          replacement for, the Toronto Protocol; it is not yet incorporated in standard guidelines.
        treatment_term:
          preferred_term: cancer screening
          term:
            id: NCIT:C15406
            label: Cancer Screening
      selected_evidence:
        snippet: Multimodal analysis increased our detection rate in patients with an active cancer diagnosis
          over uni-modal analysis and was able to detect cancer-associated signal(s) in carriers prior
          to diagnosis with conventional screening (positive predictive value = 67.6%, negative predictive
          value = 96.5%).
        supports: SUPPORT
