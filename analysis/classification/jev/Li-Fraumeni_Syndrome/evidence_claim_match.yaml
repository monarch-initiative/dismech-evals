      assertion_type: Pathophysiology
      assertion:
        name: Mutant p53 Stabilization and Gain-of-Function
        description: 'Hotspot missense alleles (R175H, R248W, R248Q, R273H, R273C, G245S) escape MDM2-mediated
          turnover and accumulate in tumor cells, particularly after LOH. Stabilized mutant p53 exerts
          two non-canonical activities: (1) dominant-negative inhibition of any residual wild-type p53
          by hetero-oligomerization, and (2) gain-of-function activities mediated by aberrant interaction
          with transcription factors (NF-kB, HIF-1alpha, SREBP1, p63, p73, EZH2) and cytoplasmic effectors.
          GOF mutant p53 drives metabolic reprogramming, cancer stem-cell expansion, EMT, immune evasion
          (PD-L1 upregulation, MHC-I downregulation), chemoresistance, and metastasis. Carriers of dominant-negative
          missense alleles develop their first tumor at younger ages than carriers of null alleles or
          genomic rearrangements.'
      selected_evidence:
        snippet: The mean age of tumor onset was statistically different (P < .05) between carriers harboring
          dominant-negative missense mutations (21.3 years) and those with all types of loss of function
          mutations (28.5 years) or genomic rearrangements (35.8 years).
        supports: SUPPORT
