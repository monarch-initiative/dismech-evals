      assertion_type: Pathophysiology
      assertion:
        name: Loss of Heterozygosity (Second Hit)
        conforms_to: germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type
          Allele
        description: 'Somatic loss of the remaining wild-type TP53 allele on chromosome 17p13.1 ("second
          hit") completes biallelic p53 inactivation and is observed in the vast majority of LFS-associated
          tumors. In pediatric adrenocortical carcinoma the second hit is typically copy-neutral LOH of
          chromosome 17 with selection against the wild-type allele, frequently combined with chromosome
          11p LOH and IGF2 over-expression. LOH is also a prerequisite for stabilization and gain-of-function
          activity of mutant p53 in vivo. The requirement is spectrum-dependent rather than absolute:
          in paired tumor-normal sequencing, LOH of the germline variant is near-universal in core LFS
          spectrum tumors but is found in fewer than half of the other tumors arising in the same carriers,
          some of which retain wild-type p53 expression and may be unrelated to the germline defect.'
      selected_evidence:
        snippet: Loss of heterozygosity of germline TP53 variant was observed in 96.0% (95% confidence
          interval [CI] = 79.7% to 99.9%) of core LFS spectrum-type tumors vs 45.5% (95% CI = 16.8% to
          76.6%) of other tumors
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
