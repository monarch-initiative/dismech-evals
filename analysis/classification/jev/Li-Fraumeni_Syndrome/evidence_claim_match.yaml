      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Mesenchymal Stem Cell Differentiation
        description: Mesenchymal stem cells (MSCs) and their osteoblast progeny are exquisitely dependent
          on p53 for proper lineage commitment. In LFS, iPSC-derived MSCs and osteoblasts show defective
          osteogenic differentiation, impaired upregulation of the imprinted long noncoding RNA H19, and
          reduced expression of its downstream effector DECORIN (DCN). The resulting expansion of transformation-competent
          mesenchymal progenitors gives rise to osteosarcoma (often in long bones during the adolescent
          growth spurt) and soft-tissue sarcomas (rhabdomyosarcoma in childhood, undifferentiated pleomorphic
          sarcoma in adults). LFS confers an estimated 500-fold increase in osteosarcoma incidence relative
          to the general population.
        cell_types:
