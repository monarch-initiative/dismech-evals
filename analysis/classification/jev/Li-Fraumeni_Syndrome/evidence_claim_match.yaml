      assertion:
        name: TP53 Genetic Testing
        notes: 'Molecular testing of TP53 identifies germline pathogenic variants including missense mutations
          (especially in the DNA-binding domain), nonsense mutations, frameshift mutations, and splice
          site variants. Certain mutations (R175H, R248W, R273H) have dominant-negative effects. A pathogenic
          TP53 variant found in blood is not automatically germline. In a paired tumor-normal series of
          cancer patients, a substantial minority of pathogenic TP53 variants detected in blood were clonal-hematopoiesis
          derived and a further fraction were mosaic, so orthogonal confirmation (paired tumor-normal
          sequencing, or testing a non-hematopoietic tissue such as cultured skin fibroblasts) is needed
          before committing a patient to lifelong surveillance. The error runs in both directions: in
          the same series a third of true germline carriers would not have been tested at all under phenotype-based
          criteria.'
      selected_evidence:
        snippet: Pathogenic/likely pathogenic TP53 variants were identified in 50 patients, 12 (24.0%)
          of which were clonal hematopoiesis related and 4 (8.0%) of which were mosaic.
        supports: SUPPORT
