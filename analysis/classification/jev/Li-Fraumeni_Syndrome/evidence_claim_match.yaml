        context: []
      assertion_type: Treatment
      assertion:
        name: Radiation Avoidance
        description: Radiation therapy should be avoided or attenuated when alternatives exist in LFS
          patients due to substantially elevated risk of radiation-induced secondary malignancies and
          shortened latency to second primary cancers. Diagnostic imaging should preferentially use MRI/ultrasound
          in lieu of CT or mammography. For breast cancer, mastectomy is generally preferred over lumpectomy
          plus adjuvant radiotherapy. TP53 testing is recommended before treatment initiation in any newly
          diagnosed cancer with suggestive phenotype to inform radiation-sparing management.
        notes: p53 is critical for radiation-induced apoptosis and cell cycle arrest. LFS patients are
          exquisitely sensitive to radiation-induced carcinogenesis.
      selected_evidence:
        snippet: in cancer patients with germline disease-causing TP53 variants, radiotherapy, and conventional
          genotoxic chemotherapy contribute to the development of subsequent primary tumours. It is critical
          to perform TP53 testing before the initiation of treatment in order to avoid in carriers, if
          possible, radiotherapy and genotoxic chemotherapies.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
