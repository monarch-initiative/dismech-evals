        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lfs_blood_tp53_variant_interpretation
        prompt: How should a pathogenic TP53 variant detected in blood be confirmed as constitutional,
          and how many carriers are missed by phenotype-based testing criteria?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - biochemical#TP53 Genetic Testing
        rationale: 'Blood-based TP53 testing misclassifies in both directions and neither error rate is
          calibrated for the settings in which testing is actually ordered. In a paired tumor-normal cancer
          cohort, roughly a quarter of pathogenic TP53 variants found in blood were clonal-hematopoiesis
          derived and a further fraction were mosaic, while a third of genuine germline carriers would
          never have been tested under phenotype-based criteria. That cohort is enriched for prior cytotoxic
          therapy and for age-related clonal hematopoiesis, so its proportions cannot be transferred to
          unselected or genome-first ascertainment, and no comparable estimate exists for those settings.
          The clinical stakes are asymmetric and both large: a false germline call commits a patient and
          their relatives to lifelong imaging and radiation avoidance, while a missed carrier forgoes
          surveillance of proven mortality benefit. Resolution would need prospective paired testing of
          blood against a non-hematopoietic tissue in a defined testing population, with the reclassification
          rate reported by ascertainment route and age.'
      selected_evidence:
        snippet: Our results indicate that some TP53 variants identified in blood-only sequencing are
          not germline and a substantial proportion of patients with LFS are missed based on current testing
          guidelines.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
