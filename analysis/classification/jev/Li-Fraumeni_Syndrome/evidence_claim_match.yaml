            id: GO:0001649
            label: osteoblast differentiation
      selected_evidence:
        snippet: LFS OBs exhibited impaired upregulation of the imprinted gene H19 during osteogenesis.
          Restoration of H19 expression in LFS OBs facilitated osteoblastic differentiation and repressed
          tumorigenic potential.
        supports: SUPPORT
