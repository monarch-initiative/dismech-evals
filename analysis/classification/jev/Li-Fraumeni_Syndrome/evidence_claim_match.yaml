              label: Li-Fraumeni syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of cGAS/STING Innate Immune Activation
        description: 'Alongside its cell-intrinsic programs, p53 recruits the innate immune system: it
          promotes TRIM24-dependent degradation of the cytosolic DNA exonuclease TREX1, so that cytosolic
          double-stranded DNA accumulates and engages the cGAS/STING sensor, inducing type I interferon.
          Loss of p53 leaves TREX1 intact, clears cytosolic DNA, and silences this interferon response,
          removing a non-cell-autonomous barrier to transformation that is independent of cell-cycle arrest,
          apoptosis, senescence, and ferroptosis. The pathway was defined in cell lines and mouse tumor
          models; whether it operates, and whether it is rate-limiting, in the tissues of germline TP53-heterozygous
          carriers has not been shown directly, so this arm is curated as an emerging rather than an established
          LFS mechanism (see the lfs_cgas_sting_human_validity discussion).'
        biological_processes:
        - preferred_term: cGAS/STING signaling pathway
          modifier: DECREASED
          term:
            id: GO:0140896
            label: cGAS/STING signaling pathway
      selected_evidence:
        snippet: p53-mediated induction of type I interferon (IFNB1) is suppressed by cGAS/STING knockout,
          and p53's tumor suppressor activities are compromised by the loss of signaling through the cGAS/STING
          pathway.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
