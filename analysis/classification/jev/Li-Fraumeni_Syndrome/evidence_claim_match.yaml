      - /disease_term
    evidence_metadata:
      reference: PMID:11498785
      reference_title: Relative frequency and morphology of cancers in carriers of germline TP53 mutations.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Documents the selectivity that is unexplained: the tumor types spared are the commonest
        adult carcinomas, so the pattern cannot be attributed to proliferative rate or baseline incidence
        alone.'
