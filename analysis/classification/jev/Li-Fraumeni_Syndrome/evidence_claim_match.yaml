              id: MONDO:0018875
              label: Li-Fraumeni syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lfs_cgas_sting_human_validity
        prompt: Does the p53 to TREX1 to cGAS/STING innate immune arm operate in the tissues of germline
          TP53-heterozygous carriers, and does losing it contribute materially to LFS tumorigenesis?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of cGAS/STING Innate Immune Activation
        rationale: 'The mechanism is well established in its own setting: p53 drives TRIM24-dependent
          TREX1 degradation, cytosolic dsDNA accumulates, cGAS/STING is engaged, type I interferon is
          induced, and p53 tumor suppression is impaired when that signalling is removed. Every step was
          shown in cell lines and mouse tumor models with manipulated p53 dosage, not in human tissue
          carrying a single germline TP53 variant. Two things are therefore open. It is unknown whether
          a heterozygous carrier has enough residual p53 to sustain the arm until the second hit, and
          it is unknown how much of the tumor predisposition this non-cell-autonomous route contributes
          relative to the cell-intrinsic checkpoints. This is the same evidential position the ferroptosis
          arm occupied before it was curated, and it is why the node is described as emerging. Resolution
          would need interferon and cytosolic DNA readouts in carrier-derived tissue, and a germline heterozygous
          animal in which the cGAS/STING arm alone is disabled.'
      selected_evidence:
        snippet: We report that p53 promotes the degradation of the DNA exonuclease TREX1, resulting in
          cytosolic dsDNA accumulation.
        supports: SUPPORT
    origin:
