              id: MONDO:0018875
              label: Li-Fraumeni syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neoplastic
        name: Multiple Primary Cancers
        frequency: FREQUENT
        description: Approximately 43% of LFS carriers who develop a first cancer go on to develop one
          or more additional independent primary cancers during their lifetime; the average number of
          tumors per affected carrier is ~1.7, and the average age-specific risk of a second cancer is
          comparable to that of the first. This metachronous/synchronous multi-primary pattern is a characteristic
          feature distinguishing LFS from sporadic disease and a major motivation for lifelong surveillance
          and radiation/genotoxin avoidance.
        phenotype_term:
          preferred_term: Multiple primary malignant neoplasms
          term:
            id: HP:0002664
            label: Neoplasm
          coarse_binding_basis: NO_HPO_TERM
          term_gap: HPO has no term for neoplasm multiplicity as such. Searches of "multiple primary",
            "metachronous" and "second primary malignancy" return nothing, and the closest descendants
            are anatomically restricted (HP:0007606 Multiple cutaneous malignancies; HP:0033714 Multiple
            meningiomas), so the HP:0002664 root is the best available binding while preferred_term carries
            the clinical concept. A term request has not yet been filed.
      selected_evidence:
        snippet: The 322 affected carriers developed 552 tumors, and 43% had developed multiple malignancies.
          The mean age of first tumor onset was 24.9 years, 41% having developed a tumor by age 18.
        supports: SUPPORT
