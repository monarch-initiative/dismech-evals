      assertion:
        name: Adrenocortical Tumorigenesis
        description: The fetal adrenal cortex is one of the most TP53-dependent tissues in development,
          and pediatric adrenocortical carcinoma (ACC) is so highly enriched for germline TP53 variants
          that any pediatric ACC is an indication for TP53 testing. ACC tumorigenesis in LFS combines
          somatic TP53 LOH on chromosome 17 (~76% of pediatric ACC) with copy-neutral LOH of chromosome
          11p with selection against the maternal allele, leading to biallelic IGF2 over-expression in
          the tumor. The Brazilian R337H founder allele in the oligomerization domain has attenuated penetrance
          for most LFS tumors but confers exceptionally high pediatric ACC risk in southern Brazil and
          is responsible for the majority of regional pediatric ACC and choroid plexus carcinoma cases.
