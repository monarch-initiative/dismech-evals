  2ac05b0e1021d458819e4253393c9edc06ab51b0f820eb78deab91b634519341:
    claim:
      about:
        disease:
          name: Li-Fraumeni Syndrome
          disease_term:
            preferred_term: Li-Fraumeni syndrome
            term:
              id: MONDO:0018875
              label: Li-Fraumeni syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lfs_tissue_specificity_mechanism
        prompt: Why does germline TP53 loss predispose to sarcoma, premenopausal breast cancer, adrenocortical
          carcinoma and brain tumors while leaving the common adult carcinomas of lung, colon, prostate,
          bladder, cervix and ovary at or near population risk?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Tumor Development
        rationale: 'p53 is expressed and functional in essentially every nucleated cell, yet the cancer
          risk it confers when lost is sharply tissue-selective. This entry''s Tumor Development node
          asserts a tropism explanation (which p53 activities each lineage most depends on, plus cooperating
          lesions such as 11p15 LOH/IGF2 in adrenal cortex and HER2 amplification in breast), but that
          is a restatement of the observation in mechanistic vocabulary rather than a demonstrated cause.
          What makes a mesenchymal progenitor or a fetal adrenocortical cell acutely p53-dependent, and
          a colonic crypt not, is not answered by the spectrum literature cited here, and the 2026 OpenScientist
          hypothesis-search run for this entry looked for a mechanistic account and reported finding none.
          The gap matters directly for surveillance design: a mechanistic account would predict which
          additional tissues warrant imaging, and would also bear on the unsettled question of whether
          carcinomas outside the classic spectrum belong in it at all, on which an older family-based
          cohort and recent ascertainment-corrected pedigree modelling disagree. Resolution would need
          lineage-resolved measurement of p53 pathway dependency, for example single-cell transcriptomic
          and chromatin profiling across many tissues in Trp53 heterozygous animals before tumors arise,
          rather than further tumor-spectrum epidemiology.'
      selected_evidence:
        snippet: Other common carcinomas including lung, colon, bladder, prostate, cervix and ovary did
          not occur to excess.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
