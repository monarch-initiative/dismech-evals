      explanation: Cohort analysis of 28 germline TP53 families against age, morphology, site and sex-specific
        population rates found breast carcinoma, soft tissue sarcoma, osteosarcoma, brain tumours, adrenocortical
        carcinoma, Wilms tumour and phyllodes tumour strongly in excess while lung, colon, bladder, prostate,
        cervix and ovary carcinomas were not. This establishes that the tumor spectrum is tissue-selective
        rather than a uniform increase in cancer risk, which is what this node's tropism claim asserts.
