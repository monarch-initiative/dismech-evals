      assertion_type: Discussion
      assertion:
        discussion_id: lfs_metformin_mechanism_unresolved
        prompt: By what mechanism does metformin reduce cancer incidence in TP53 carriers, and is that
          mechanism the mitochondrial one this entry attributes to it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Metformin Chemoprevention (Investigational)
        - pathophysiology#Increased Mitochondrial Oxidative Phosphorylation
        rationale: 'The rationale curated for metformin in this entry (complex I inhibition, AMPK activation,
          mTORC1 suppression, reversing the LFS bioenergetic shift) is a plausible reading of the mouse
          and human pilot data, but the MILI trial protocol states outright that metformin''s mechanism
          of anticancer activity in this setting is unclear and makes establishing it an exploratory endpoint
          rather than an assumption. Metformin has several candidate activities in this context, including
          systemic effects on insulin and IGF signalling that are not mitochondrial at all, and the LFS
          preclinical work does not discriminate among them. This matters for interpretation rather than
          for whether to run the trial: a null result would not by itself refute the OXPHOS axis, and
          a positive one would not by itself confirm it, unless the mechanistic endpoints resolve which
          activity is responsible.'
      selected_evidence:
        snippet: However, metformin’s mechanism of anticancer activity in this context is unclear.
        supports: SUPPORT
