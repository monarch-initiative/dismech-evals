      assertion:
        name: Tumor Development
        conforms_to: germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation
        description: The combination of impaired DNA damage response, loss of cell cycle checkpoints,
          defective apoptosis, failed ferroptosis, senescence escape, increased OXPHOS, aberrant stem-cell
          differentiation, and genomic instability creates a permissive environment for tumor development.
          Tissue tropism in LFS reflects which p53 activities are most critical for homeostasis in a given
          lineage; the most susceptible compartments are mesenchymal progenitors (sarcomas), mammary epithelium
          (HER2+ breast cancer), adrenocortical cells (with cooperating 11p15 LOH/IGF2), neuroepithelium
          (CNS tumors and choroid plexus carcinoma), and hematopoietic stem/progenitor cells (leukemia/MDS,
          especially after therapy-related stress).
        biological_processes:
