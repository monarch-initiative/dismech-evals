      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_tp53_loss_genome_instability_multitumor_model
        hypothesis_label: Canonical TP53 Loss-of-Function / Genome Instability / Multi-Tumor Predisposition
          Model
        status: CANONICAL
        description: 'Li-Fraumeni syndrome (LFS) is caused by germline heterozygous loss-of-function variants
          in TP53 on 17p13.1 encoding the p53 tumor suppressor. p53 is the central node of the genome
          guardian network, integrating signals of DNA damage, oncogenic stress, hypoxia, and ribosomal/nucleolar
          dysfunction to execute G1/G2 cell-cycle arrest, apoptosis, senescence, ferroptosis, and metabolic
          reprogramming via transcription of CDKN1A, BAX, PUMA, MDM2, and many other targets. Somatic
          biallelic TP53 inactivation accelerates accumulation of genomic instability, chromosomal aneuploidy,
          and oncogene activation, producing the LFS-defining early-onset cancer spectrum: sarcomas, breast
          cancers (young women), brain tumors, adrenocortical carcinoma, leukemia, and lung cancer. Mouse
          Trp53^+/- models recapitulate the cancer-prone phenotype, and clinical surveillance with whole-body
          MRI (Toronto protocol) reduces cancer-specific mortality, corroborating the TP53-loss / genome-instability
          axis as the canonical model.'
        notes: 'Retained as CANONICAL. The 2026 openscientist hypothesis-search report (kb/hypotheses/Li-Fraumeni_Syndrome/canonical_tp53_loss_genome_instability_multitumor_model)
          confirms TP53 loss-of-function → loss of genome-guardian activity → accelerated chromosomal
          instability and oncogene activation → broad pediatric/adult tumor predisposition spectrum (sarcomas,
          breast cancers, brain tumors, adrenocortical carcinoma, leukemia, lung cancer). Validated by
          mouse Trp53^+/- recapitulating the cancer-prone phenotype, >75% lifetime cancer risk in carriers,
          and the Toronto Protocol whole-body MRI surveillance significantly reducing cancer-specific
          mortality. Three refinements: (1) the second TP53 hit is not always required — heterozygous
          loss with dominant-negative or gain-of-function effects (R175H, R248Q hotspots) drives tumorigenesis
          through perturbation of cellular senescence, metabolic reprogramming, and stem-cell homeostasis;
          (2) phenotypic heterogeneity reflects modifier loci, MDM2 SNP309, and environmental DNA-damage
          exposure; (3) the canonical model emphasizes genome instability but p53 also coordinates ferroptosis,
          autophagy, and metabolic pathways now recognized as integral to tumor suppression. Investigational
          therapies targeting mutant p53 reactivation (eprenetapopt/APR-246, PC14586) and selective synthetic
          lethality (WEE1, ATR inhibitors) are validating the genome-instability axis pharmacologically.'
      selected_evidence:
        snippet: TP53 mutations and chromosome 17 LOH with selection against wild-type TP53 are observed
          in 28 ACTs (76%)
        supports: SUPPORT
