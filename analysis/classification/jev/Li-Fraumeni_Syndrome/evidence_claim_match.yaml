              label: Li-Fraumeni syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Radiation Hypersensitivity
        description: p53-deficient cells fail to undergo apoptosis or stable cell-cycle arrest after ionizing
          radiation, allowing radiation-damaged cells to survive and propagate mutations. In LFS, this
          manifests as shorter latency to second primary cancer after radiotherapy in children (median
          13.3 years with RT vs 25.1 years without RT, hazard ratio 7.9), with correspondingly worse survival
          after the second primary. Modern guidelines therefore recommend avoidance or attenuation of
          radiotherapy when alternatives exist (e.g., mastectomy preferred over breast-conserving therapy
          with adjuvant RT) and pre-treatment TP53 testing in patients with suggestive presentations.
      selected_evidence:
        snippet: After radiotherapy for the first cancer diagnosis, median time to second primary cancer
          diagnosis was 13.3 years and median survival 9.7 years. Where no radiotherapy was received,
          median time to second primary cancer diagnosis was 25.1 years (χ2 = 14.8, P < .0001; Hazard
          Ratio = 7.9 [95% CI = 2.8 to 22.6])
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/18
      evidence_path: /pathophysiology/18/evidence/0
