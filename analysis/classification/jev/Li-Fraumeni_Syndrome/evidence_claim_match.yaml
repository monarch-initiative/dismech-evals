    evidence_metadata:
      reference: PMID:34240179
      reference_title: Paired Tumor-Normal Sequencing Provides Insights Into the TP53-Related Cancer Spectrum
        in Patients With Li-Fraumeni Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that a pathogenic TP53 variant seen in blood is frequently somatic rather
        than constitutional, which is the basis for requiring orthogonal confirmation before a germline
        diagnosis. The denominator is 50 variants ascertained among 17,922 cancer patients undergoing
        paired tumor-normal sequencing, a population enriched for prior cytotoxic therapy and age-related
        clonal hematopoiesis, so the proportion should not be carried over to unselected germline testing.
