    evidence_metadata:
      reference: PMID:40059635
      reference_title: Radiotherapy results in decreased time to second cancer in children with Li Fraumeni
        syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Retrospective case-series of 47 children with LFS quantifying that radiotherapy for
        a first pediatric LFS cancer is associated with a near 8-fold higher hazard of second primary
        cancer and substantially shorter time to second cancer, providing direct human evidence that p53
        deficiency converts ionizing radiation into a clinically meaningful driver of subsequent malignancy.
