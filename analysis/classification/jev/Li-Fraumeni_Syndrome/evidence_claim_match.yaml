      explanation: First report that the TP53 PIN3 intron 3 duplication modifies age at first cancer in
        germline TP53 carriers, with an effect larger than that of the codon 72 polymorphism (8.3 years)
        or MDM2 SNP309 (12.5 years) in the same series. This is the citation for the modifier claim in
        the notes above. The comparison rests on 25 A1A1 against 7 A1A2 carriers within 135 Brazilian
        LFS/LFL patients, so the magnitude should be read as a single unreplicated estimate rather than
        a calibrated risk parameter.
