      assertion_type: Pathophysiology
      assertion:
        name: PISD deficiency
        description: Liberfarb syndrome is caused by pathogenic biallelic PISD variants that impair phosphatidylserine
          decarboxylase function in mitochondria. In the original Azorean, Portuguese, and Brazilian families,
          a homozygous 10-bp deletion in intron 8 (NM_014338.3:c.904-12_904-3delCTATCACCAC) disrupts the
          last splice acceptor site, causing intron 8 retention and reducing wild-type spliced PISD transcript
          levels to 5.7% in minigene assays.
        gene:
          preferred_term: PISD
          description: Mitochondrial phosphatidylserine decarboxylase.
          modifier: DECREASED
          term:
            id: hgnc:8999
            label: PISD
        genes:
        - preferred_term: PISD
          term:
            id: hgnc:8999
            label: PISD
        molecular_functions:
        - preferred_term: phosphatidylserine decarboxylase activity
          modifier: DECREASED
          term:
            id: GO:0004609
            label: phosphatidylserine decarboxylase activity
        biological_processes:
        - preferred_term: phospholipid biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0008654
            label: phospholipid biosynthetic process
        - preferred_term: phospholipid metabolic process
          modifier: ABNORMAL
          term:
            id: GO:0006644
            label: phospholipid metabolic process
        chemical_entities:
        - preferred_term: phosphatidyl-L-serine substrate
          term:
            id: CHEBI:18303
            label: phosphatidyl-L-serine
        - preferred_term: mitochondrial phosphatidylethanolamine
          modifier: DECREASED
          term:
            id: CHEBI:16038
            label: phosphatidylethanolamine
        locations:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: Quantitative PCR analyses in this in vitro model indicated that the proportion of correctly
          spliced mRNA transcripts from plasmids bearing the deletion was only 5.7% compared to transcripts
          from plasmids carrying the wild-type minigene (Fig. 3D).
        supports: SUPPORT
