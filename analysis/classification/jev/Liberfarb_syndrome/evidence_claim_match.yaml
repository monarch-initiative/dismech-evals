        association: Causal biallelic variant
        notes: Liberfarb syndrome is caused by biallelic pathogenic variants in PISD, which encodes mitochondrial
          phosphatidylserine decarboxylase, including the Portuguese founder splice-region deletion NM_014338.3:c.904-12_904-3delCTATCACCAC
          and compound heterozygous missense variants.
      selected_evidence:
        snippet: Affected individuals shared a 3.36-Mb region of autozygosity on chromosome 22q12.2, including
          a 10-bp deletion (NM_014338.3:c.904-12_904-3delCTATCACCAC), immediately upstream of the last
          exon of the PISD (phosphatidylserine decarboxylase) gene. Sequencing of PISD from paraffin-embedded
          tissue from the 1986 case revealed the identical homozygous variant.
        supports: SUPPORT
