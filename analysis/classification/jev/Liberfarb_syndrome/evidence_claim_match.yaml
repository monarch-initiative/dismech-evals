        description: Liberfarb syndrome is caused by pathogenic biallelic PISD variants that impair phosphatidylserine
          decarboxylase function in mitochondria. In the original Azorean, Portuguese, and Brazilian families,
          a homozygous 10-bp deletion in intron 8 (NM_014338.3:c.904-12_904-3delCTATCACCAC) disrupts the
          last splice acceptor site, causing intron 8 retention and reducing wild-type spliced PISD transcript
          levels to 5.7% in minigene assays.
