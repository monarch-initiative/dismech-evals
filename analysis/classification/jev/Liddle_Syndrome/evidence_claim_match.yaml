        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Primary aldosteronism
        description: 'Primary aldosteronism shares low-renin hypertension, hypokalemia, and metabolic
          alkalosis with Liddle syndrome, but is distinguished by elevated (rather than suppressed) plasma
          aldosterone and clinical responsiveness to mineralocorticoid receptor antagonists such as spironolactone.

          '
        distinguishing_features:
        - Suppressed or low plasma aldosterone concentration in Liddle syndrome versus elevated aldosterone
          in primary aldosteronism.
        - Lack of blood pressure or potassium response to spironolactone in Liddle syndrome, contrasted
          with response to ENaC blockers (amiloride or triamterene).
        - Pathogenic gain-of-function variant in SCNN1A, SCNN1B, or SCNN1G on molecular genetic testing.
        disease_term:
          preferred_term: primary aldosteronism
          term:
            id: MONDO:0001422
            label: primary aldosteronism
      selected_evidence:
        snippet: These features could resemble those of primary aldosteronism, but this disease was ruled
          out on the basis of suppressed plasma aldosterone.
        supports: SUPPORT
