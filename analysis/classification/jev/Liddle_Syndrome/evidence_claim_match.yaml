              label: Liddle syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Apparent mineralocorticoid excess
        description: 'Apparent mineralocorticoid excess (AME) is a monogenic differential diagnosis of
          Liddle syndrome excluded at the molecular level by the absence of pathogenic HSD11B2 variants
          on genetic panel testing and biochemically by a normal urinary tetrahydrocortisol plus allo-tetrahydrocortisol
          to tetrahydrocortisone ratio.

          '
        notes: 'AME is caused by biallelic HSD11B2 variants impairing 11-beta-hydroxysteroid dehydrogenase
          type 2 conversion of cortisol to cortisone, leading to cortisol-mediated activation of the mineralocorticoid
          receptor.

          '
        distinguishing_features:
        - Normal urinary tetrahydrocortisol + allo-tetrahydrocortisol to tetrahydrocortisone ratio in
          Liddle syndrome.
        - Absence of pathogenic HSD11B2 variants on genetic panel testing and presence of a heterozygous
          SCNN1A, SCNN1B, or SCNN1G variant.
        disease_term:
          preferred_term: apparent mineralocorticoid excess
          term:
            id: MONDO:0009025
            label: apparent mineralocorticoid excess
      selected_evidence:
        snippet: Although definitive biochemical exclusion of apparent mineralocorticoid excess (AME)
          and glucocorticoid-remediable aldosteronism (GRA) was not performed, no pathogenic variants
          were identified in HSD11B2, CYP11B1, or CYP11B2 on the comprehensive genetic panel, providing
          molecular-level exclusion of these conditions.
        supports: SUPPORT
