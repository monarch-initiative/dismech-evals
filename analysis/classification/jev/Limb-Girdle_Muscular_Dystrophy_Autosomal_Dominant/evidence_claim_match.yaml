              nuclear ribonucleoprotein D-like), an RNA-binding protein involved in transcription and
              RNA processing. Pathogenic mutations cluster in the prion-like domain (codon 378 is a mutational
              hotspot) and alter the protein's self-assembly properties. Cryo-EM evidence suggests LGMD-D3
              may be a loss-of-function disease associated with impaired fibrillation of the functional
              hnRNPDL-2 amyloid. Clinical features include adult-onset proximal limb-girdle weakness,
              rimmed vacuoles on biopsy, and finger/toe flexion limitation.
          role: subtype
