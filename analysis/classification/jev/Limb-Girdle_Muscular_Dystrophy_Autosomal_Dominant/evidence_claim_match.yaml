      assertion_type: Pathophysiology
      assertion:
        name: Progressive Proximal Myofiber Degeneration and Weakness
        description: 'The converging downstream consequence shared by all LGMD-D subtypes is progressive
          skeletal muscle fiber degeneration with inadequate regenerative response. Histologically, this
          manifests as dystrophic changes: increased fiber size variation, central nuclei, necrosis and
          regeneration, fibrofatty infiltration, and in LGMD-D1 and D3, rimmed vacuoles with protein aggregates.
          Clinically, the shared end result is progressive proximal pelvic and shoulder girdle weakness
          causing functional limitations including difficulty walking, climbing stairs, rising from a
          chair, and lifting arms. Serum creatine kinase is elevated in all subtypes, reflecting ongoing
          sarcolemmal injury.'
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        - preferred_term: skeletal muscle satellite cell
          term:
            id: CL:0000594
            label: skeletal muscle satellite cell
        biological_processes:
        - preferred_term: skeletal muscle tissue regeneration
          term:
            id: GO:0043403
            label: skeletal muscle tissue regeneration
          modifier: DECREASED
      selected_evidence:
        snippet: LGMD is defined as having onset >2 years of age with progressive proximal weakness, elevated
          serum creatine kinase levels and dystrophic features on muscle biopsy.
        supports: SUPPORT
