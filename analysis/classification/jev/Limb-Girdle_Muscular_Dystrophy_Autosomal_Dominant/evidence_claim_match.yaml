      assertion_type: Subtype
      assertion:
        name: LGMD-D1
        display_name: LGMD-D1 (DNAJB6-related)
        subtype_term:
          preferred_term: autosomal dominant limb-girdle muscular dystrophy type 1D
          term:
            id: MONDO:0021018
            label: autosomal dominant limb-girdle muscular dystrophy type 1D (DNAJB6)
        genes:
        - preferred_term: DNAJB6
          term:
            id: hgnc:14888
            label: DNAJB6
        description: LGMD-D1 is caused by heterozygous dominant missense mutations in DNAJB6 (DnaJ heat
          shock protein family member B6), an Hsp40 co-chaperone localized to the Z-disc in skeletal muscle.
          Pathogenic variants cluster in the G/F domain and impair the protein's anti-aggregation function.
          The muscle-expressed b-isoform (DNAJB6b) is primarily responsible for disease pathogenesis;
          mutations in DNAJB6b cause myofibrillar disorganization and inclusion formation at the Z-disc.
          Adult-onset slowly progressive proximal pelvic girdle weakness is characteristic; rimmed vacuoles
          and p62/ubiquitin-positive aggregates on biopsy.
      selected_evidence:
        snippet: LGMD1D is an autosomal dominant limb girdle muscular dystrophy caused by variants in
          the DNAJB6 gene. This is typically an adult-onset disorder characterized by moderately progressive
          proximal muscle weakness without respiratory or bulbar involvement
        supports: SUPPORT
