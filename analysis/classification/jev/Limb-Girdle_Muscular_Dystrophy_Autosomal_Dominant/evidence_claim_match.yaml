      assertion_type: Subtype
      assertion:
        name: LGMD-D3
        display_name: LGMD-D3 (HNRNPDL-related)
        subtype_term:
          preferred_term: autosomal dominant limb-girdle muscular dystrophy type 1G
          term:
            id: MONDO:0012193
            label: autosomal dominant limb-girdle muscular dystrophy type 1G
        genes:
        - preferred_term: HNRNPDL
          term:
            id: hgnc:5037
            label: HNRNPDL
        description: LGMD-D3 is caused by heterozygous missense mutations in HNRNPDL (heterogeneous nuclear
          ribonucleoprotein D-like), an RNA-binding protein involved in transcription and RNA processing.
          Pathogenic mutations cluster in the prion-like domain (codon 378 is a mutational hotspot) and
          alter the protein's self-assembly properties. Cryo-EM evidence suggests LGMD-D3 may be a loss-of-function
          disease associated with impaired fibrillation of the functional hnRNPDL-2 amyloid. Clinical
          features include adult-onset proximal limb-girdle weakness, rimmed vacuoles on biopsy, and finger/toe
          flexion limitation.
      selected_evidence:
        snippet: Twenty-four recessive LGMD (types R1-R24) and five dominant LGMD (types D1-D5) have been
          identified with characterization of mutations in various genes.
        supports: SUPPORT
