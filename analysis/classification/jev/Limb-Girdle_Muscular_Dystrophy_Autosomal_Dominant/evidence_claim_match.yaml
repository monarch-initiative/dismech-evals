            description: LGMD-D3 is caused by heterozygous missense mutations in HNRNPDL (heterogeneous
              nuclear ribonucleoprotein D-like), an RNA-binding protein involved in transcription and
              RNA processing. Pathogenic mutations cluster in the prion-like domain (codon 378 is a mutational
              hotspot) and alter the protein's self-assembly properties. Cryo-EM evidence suggests LGMD-D3
              may be a loss-of-function disease associated with impaired fibrillation of the functional
              hnRNPDL-2 amyloid. Clinical features include adult-onset proximal limb-girdle weakness,
              rimmed vacuoles on biopsy, and finger/toe flexion limitation.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: HNRNPDL Prion-Like Domain Mutation and Impaired Functional Fibrillation
        description: HNRNPDL (heterogeneous nuclear ribonucleoprotein D-like) is a ribonucleoprotein involved
          in transcription regulation and mRNA processing. The protein contains a prion-like domain (PLD)
          that enables regulated liquid-liquid phase separation and functional amyloid fibril assembly.
          The predominant human isoform hnRNPDL-2 forms stable, non-toxic, nucleic acid-binding functional
          amyloid fibrils. Pathogenic missense mutations in the PLD (codon 378 is a mutational hotspot)
          alter the protein's self-assembly properties. Cryo-EM structural evidence suggests that LGMD-D3
          may represent a loss-of-function disease caused by impaired fibrillation of hnRNPDL-2, rather
          than toxic aggregation. Alternatively, accelerated intrinsic self-aggregation may cause pathological
          aggregate accumulation; rimmed vacuoles on muscle biopsy are a consistent histological finding.
        subtypes:
        - LGMD-D3
