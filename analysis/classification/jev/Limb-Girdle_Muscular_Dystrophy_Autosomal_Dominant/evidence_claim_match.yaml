        name: DNAJB6b Co-Chaperone Dysfunction and Z-Disc Aggregate Formation
        description: DNAJB6 is an Hsp40 co-chaperone that suppresses aggregation of polyglutamine and
          amyloidogenic proteins. In skeletal muscle, the b-isoform (DNAJB6b) is sarcoplasmic and localizes
          to the Z-disc. Dominant missense mutations in the G/F domain impair DNAJB6b's anti-aggregation
          function, causing accumulation of protein aggregates at the Z-disc and myofibrillar disorganization.
          Inclusion bodies containing DNAJB6, Z-disc proteins (desmin), TDP-43, and RNA-binding proteins
          hnRNPA1/A2B1 form as sarcoplasmic stress granules. These aggregates disrupt sarcomere organization,
          leading to progressive myofiber dysfunction. The b-isoform is disease-specific; DNAJB6a mutations
          alone are insufficient to cause disease.
