            label: autosomal dominant limb-girdle muscular dystrophy type 1F
        genes:
        - preferred_term: TNPO3
          term:
            id: hgnc:17103
            label: TNPO3
        description: LGMD-D2 is caused by heterozygous mutations in TNPO3 (transportin-3), a nuclear import
          receptor for SR domain-containing serine/arginine-rich splicing factors. Pathogenic TNPO3 variants
          impair nuclear import of splicing factors such as SRSF1, leading to their cytoplasmic mislocalization
          and aggregation, myofibrillar disorganization, and progressive muscle weakness. The clinical
          presentation includes variable age of onset, proximal pelvic and shoulder girdle weakness, calf
          hypertrophy, and dysphagia.
      selected_evidence:
        snippet: LGMD D2 is a disease caused by TNPO3 mutation. We describe the expression of TNPO3 and
          selected proteins, likely modified by TNPO3 mutation, in muscle biopsies of affected patients.
        supports: SUPPORT
