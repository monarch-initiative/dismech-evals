        subtype_term:
          preferred_term: muscular dystrophy, limb-girdle, autosomal dominant 4
          term:
            id: MONDO:0029133
            label: muscular dystrophy, limb-girdle, autosomal dominant 4
        genes:
        - preferred_term: CAPN3
          term:
            id: hgnc:1480
            label: CAPN3
        description: LGMD-D4 is caused by heterozygous dominant-acting pathogenic variants in CAPN3 (calpain-3),
          a calcium-dependent cytoplasmic cysteine protease essential for sarcomere remodeling. CAPN3
          also causes autosomal recessive calpainopathy (LGMD-R1); the dominant form is clinically milder
          and more variable than the recessive form, ranging from near-asymptomatic to wheelchair dependence
          in late adulthood. Reduced calpain-3 immunoblot in muscle biopsy is a diagnostic feature. Dominant
          variants are thought to act via haploinsufficiency or dominant-negative mechanisms.
      selected_evidence:
        snippet: The autosomal dominant form of calpainopathy is clinically variable, ranging from almost
          asymptomatic to wheelchair dependence after age 60 years in a few individuals; phenotype is
          generally milder than the recessive form.
        supports: SUPPORT
