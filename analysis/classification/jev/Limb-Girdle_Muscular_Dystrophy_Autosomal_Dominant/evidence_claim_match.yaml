          to the nucleus. Pathogenic heterozygous TNPO3 variants reduce nuclear import of SR splicing
          factors, resulting in cytoplasmic mislocalization and sporadic cytoplasmic TNPO3 aggregates.
          Mislocalization of SRSF1 and altered sarcomeric alpha-actinin distribution indicate impaired
