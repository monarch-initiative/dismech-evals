              label: linear skin defects with multiple congenital anomalies 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HCCS Holocytochrome c-Type Synthase Deficiency
        biological_scale: MOLECULAR
        description: 'Segmental Xp22 monosomy or intragenic HCCS mutation removes or inactivates the mitochondrial
          heme lyase that covalently attaches the prosthetic heme group to apocytochrome c. Patient alleles
          fail to complement a yeast strain lacking the HCCS orthologue Cyc3p, and separate alleles fail
          by two different routes: a missense allele reaches mitochondria but is catalytically inactive,
          while a C-terminal truncation fails to be sorted to mitochondria at all.'
        genes:
        - preferred_term: HCCS
          term:
            id: hgnc:4837
            label: HCCS
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        molecular_functions:
        - preferred_term: holocytochrome-c synthase activity
          term:
            id: GO:0004408
            label: holocytochrome-c synthase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Functional analysis demonstrates that both mutant proteins (R217C and Delta 197-268)
          were unable to complement a Saccharomyces cerevisiae mutant deficient for the HCCS orthologue
          Cyc3p, in contrast to wild-type HCCS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
