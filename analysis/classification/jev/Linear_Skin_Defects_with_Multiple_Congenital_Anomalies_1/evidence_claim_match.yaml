      assertion_type: Genetic
      assertion:
        name: HCCS pathogenic variants and Xp22 deletions
        gene_term:
          preferred_term: HCCS
          term:
            id: hgnc:4837
            label: HCCS
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Two lesion classes cause MLS1: segmental Xp22 monosomy encompassing HCCS (terminal deletions
          of 11 Mb or more down to submicroscopic losses of roughly 850 kb), and intragenic HCCS point
          mutations including p.Arg217Cys, p.Arg197Ter and p.Glu159Lys. Point mutations have been de novo
          in the reported index patients, but inherited mutations occur, and clinically normal carrier
          relatives have been documented.'
      selected_evidence:
        snippet: In two female patients, from two families, with MLS and a normal karyotype, we identified
          heterozygous de novo point mutations--a missense mutation (p.R217C) and a nonsense mutation
          (p.R197X)--in the HCCS gene.
        supports: SUPPORT
