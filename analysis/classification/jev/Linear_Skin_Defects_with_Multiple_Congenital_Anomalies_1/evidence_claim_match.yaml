        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical criteria with molecular confirmation
        description: The clinical diagnosis rests on two major criteria, microphthalmia/anophthalmia and
          linear skin defects, confirmed molecularly. Importantly, patients with a molecular diagnosis
          have been reported with only one of the two major criteria, so requiring both will miss cases.
          Molecular confirmation is by testing COX7B, HCCS or NDUFB11; this entry covers the HCCS-associated
          form.
      selected_evidence:
        snippet: 'However, persons with a molecular diagnosis of MLS syndrome in whom only one of the
          two major criteria was present have been reported: some show characteristic skin defects without
          ocular abnormalities and others show eye abnormalities without skin defects.'
        supports: SUPPORT
