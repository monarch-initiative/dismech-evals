              label: lipoic acid synthetase deficiency
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Lipoyl transferase 1 deficiency
        description: 'LIPT1 catalyzes the transfer of the lipoyl moiety from lipoyl-GCSH to the E2 subunits
          of 2-oxoacid dehydrogenases downstream of LIAS. Consequently, LIPT1 deficiency impairs PDH,
          alpha-KGDH, and BCKDH lipoylation and causes lactic acidosis and Leigh-like encephalopathy,
          but spares lipoylation of GCSH and therefore presents with normal plasma and CSF glycine levels.

          '
        disease_term:
          preferred_term: lipoyl transferase 1 deficiency
          term:
            id: MONDO:0014576
            label: lipoyl transferase 1 deficiency
        distinguishing_features:
        - Normal plasma and cerebrospinal fluid glycine levels (spared glycine cleavage system H-protein
          lipoylation) in LIPT1 deficiency
        - Hyperglycinemia and deficient glycine cleavage activity in LIAS deficiency
      selected_evidence:
        snippet: Immunostaining analysis showed that lipoylated E2-PDH and E2-KGDH were extremely reduced
          in this patient. However, the absence of glycine elevation, the normal activity of the glycine
          cleavage system and the normal lipoylation of the H protein suggested a defect of lipoic acid
          transfer to particular proteins rather than a general impairment of lipoic acid biosynthesis
          as the potential cause of the disease.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
