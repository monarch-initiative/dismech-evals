        context:
        - path: /pathophysiology/0
          value:
            name: Defective lipoic acid synthesis via LIAS deficiency
            description: 'LIAS encodes lipoic acid synthetase, a mitochondrial iron-sulfur cluster enzyme
              that inserts two sulfur atoms into octanoyl-GCSH to generate lipoyl-GCSH. This is the second
              step in the lipoylation pathway, after LIPT2-mediated octanoyl transfer and before LIPT1-mediated
              lipoyl relay to the E2 subunits of alpha-ketoacid dehydrogenases. LIAS deficiency, like
              LIPT2 deficiency, abolishes lipoylation of all downstream targets including the glycine
              cleavage system. This disrupts pyruvate dehydrogenase, alpha-ketoglutarate dehydrogenase,
              branched-chain ketoacid dehydrogenase, and glycine cleavage, causing combined lactic acidosis
              and hyperglycinemia.

              '
            genes:
            - preferred_term: LIAS
              term:
                id: hgnc:16429
                label: LIAS
            gene:
              preferred_term: LIAS
              description: Lipoic acid synthetase, inserts sulfur atoms into octanoyl-GCSH to form lipoyl-GCSH
                in the mitochondrial lipoylation pathway.
              modifier: DECREASED
              term:
                id: hgnc:16429
                label: LIAS
