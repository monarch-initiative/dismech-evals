      assertion_type: Pathophysiology
      assertion:
        name: ECM1 Loss of Function
        biological_scale: MOLECULAR
        description: 'Lipoid proteinosis is caused by biallelic (homozygous or compound heterozygous)
          loss-of-function mutations in ECM1, which encodes the secreted glycoprotein extracellular matrix
          protein 1. The gene was mapped to 1q21 and identified as causal by genome-wide linkage and candidate-gene
          sequencing in consanguineous families, with recurrent founder alleles in some populations (e.g.,
          the Q276X nonsense allele in Namaqualand, South Africa).

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: we identified six different homozygous loss-of-function mutations in the extracellular
          matrix protein 1 gene (ECM1)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
