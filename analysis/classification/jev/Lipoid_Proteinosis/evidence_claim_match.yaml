      assertion_type: Pathophysiology
      assertion:
        name: Loss of ECM1-Mediated Matrix Interactions
        biological_scale: MOLECULAR
        description: 'ECM1 normally participates in the structural organization of the dermis through
          protein-protein interactions with perlecan, fibulin, and matrix metalloproteinase-9, and it
          binds glycosaminoglycans. Loss of these interactions disrupts extracellular-matrix and basement-membrane
          physiology, the proposed proximate basis of the tissue pathology.

          '
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: DECREASED
        - preferred_term: basement membrane organization
          term:
            id: GO:0071711
            label: basement membrane organization
          modifier: DECREASED
      selected_evidence:
        snippet: the ECM1 protein can normally bind to various extracellular matrix proteins and glycosaminoglycans
          as well as certain enzymes, including matrix metalloproteinase 9. Loss of key protein-protein
          interactions may underscore some of the disease pathophysiology
        supports: SUPPORT
