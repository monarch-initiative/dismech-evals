        name: Impaired Fear Processing
        biological_scale: ORGANISM
        description: 'Bilateral amygdala damage in lipoid proteinosis produces a distinctive neurobehavioral
          phenotype in which affected individuals fail to induce or experience fear in response to normally
          frightening stimuli, while other basic emotions are preserved. Lipoid-proteinosis patients with
          bilateral amygdala calcification have served as key human models of amygdala function in fear
          processing.

          '
      selected_evidence:
        snippet: On no occasion did SM exhibit fear, and she never endorsed feeling more than minimal
          levels of fear.
        supports: SUPPORT
