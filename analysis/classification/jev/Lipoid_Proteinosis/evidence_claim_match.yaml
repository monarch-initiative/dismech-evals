          consequences of ECM1 loss (e.g., perivascular matrix and basement-membrane dysfunction, microvascular
          changes, or direct effects on neuronal/glial extracellular matrix) contribute?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Bilateral Amygdala and Medial Temporal Lobe Calcification
        - pathophysiology#Impaired Fear Processing
        rationale: The causal edge from amygdala calcification to the neurobehavioral phenotype is modeled
          as INDIRECT_UNKNOWN_INTERMEDIATES because the mechanism is not established. Authoritative review
          explicitly states that, beyond the foci of calcification, the cause of the neurologic abnormalities
          in lipoid proteinosis is unknown. Resolving whether calcification is the proximate cause or
          a marker of a broader ECM1-dependent CNS process would sharpen the mechanism model and determine
          whether the neuropsychiatric burden is potentially modifiable.
      selected_evidence:
        snippet: Beyond the foci of calcification, the cause of the neurologic abnormalities in lipoid
          proteinosis is unknown
        supports: SUPPORT
