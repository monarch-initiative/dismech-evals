      assertion_type: Genetic
      assertion:
        name: APOE
        gene_term:
          preferred_term: APOE
          term:
            id: hgnc:613
            label: APOE
        relationship_type: CAUSATIVE
        notes: Heterozygous missense substitutions (often arginine to proline) and small in-frame deletions
          or duplications in APOE near the LDL-receptor-binding region. APOE Sendai (Arg145Pro) is a founder
          allele in eastern Japan and APOE Kyoto (Arg25Cys) the commonest Chinese allele. Names here use
          mature-protein numbering; precursor numbering, which includes the 18-residue signal peptide,
          adds 18 (Kyoto is p.R43C, Sendai p.R163P).
      selected_evidence:
        snippet: We determined the haplotype structure of APOE-Sendai in 13 patients from 9 unrelated
          families with LPG, and found that the haplotype of all APOE-Sendai mutations was identical,
          suggesting that APOE-Sendai mutation is common in Japanese patients probably through a founder
          effect.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
