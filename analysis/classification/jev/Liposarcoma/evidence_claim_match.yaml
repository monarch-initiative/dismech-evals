      assertion_type: Pathophysiology
      assertion:
        name: FUS::DDIT3 Fusion Oncoprotein in Myxoid Liposarcoma
        genetic_context:
          variant_origin: SOMATIC
        description: Myxoid liposarcoma is driven by the FUS::DDIT3 fusion protein, formed by the t(12;16)(q13;p11)
          translocation and present in over 90% of cases (a minority instead carry EWSR1::DDIT3). FUS::DDIT3
          acts as an aberrant transcription factor that inhibits adipocyte differentiation and promotes
          tumor growth and invasive migration. Trabectedin detaches FUS-DDIT3 from its DNA binding sites,
          reactivating adipogenesis - providing the mechanistic basis for its unusual efficacy in this
          subtype.
        cell_types:
        - preferred_term: adipocyte progenitor
          term:
            id: CL:0002570
            label: mesenchymal stem cell of adipose tissue
        gene_products:
        - preferred_term: FUS/DDIT3 fusion protein
          term:
            id: NCIT:C99280
            label: FUS/DDIT3 Fusion Protein
        - preferred_term: EWSR1/DDIT3 fusion protein
          term:
            id: NCIT:C99201
            label: EWSR1/DDIT3 Fusion Protein
        biological_processes:
        - preferred_term: negative regulation of fat cell differentiation
          modifier: INCREASED
          term:
            id: GO:0045599
            label: negative regulation of fat cell differentiation
      selected_evidence:
        snippet: "The FUS::DDIT3 fusion protein, formed by the chromosomal translocation t (12;16) \n\
          (q13;p11), is found in over 90% of myxoid liposarcoma (MLS) cases and is a \ncrucial protein\
          \ in its development."
        supports: SUPPORT
