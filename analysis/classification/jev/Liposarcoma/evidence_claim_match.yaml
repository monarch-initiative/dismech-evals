      assertion_type: Pathophysiology
      assertion:
        name: Adipocytic Differentiation Block
        description: A hallmark of liposarcoma is the failure of tumor cells to complete normal adipogenic
          differentiation. In DDLPS, the adipogenic properties of ASC-like tumor cells are actively inhibited
          by a TGF-beta-high immunosuppressive tumor microenvironment. In myxoid liposarcoma, the FUS::DDIT3
          chimeric transcription factor blocks adipocyte differentiation. Restoring differentiation (e.g.,
          with trabectedin in MLS) is therapeutically exploitable.
        biological_processes:
        - preferred_term: negative regulation of fat cell differentiation
          modifier: INCREASED
          term:
            id: GO:0045599
            label: negative regulation of fat cell differentiation
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: "their adipogenic properties \nare inhibited by a TGF-β-high immunosuppressive tumor\
          \ micro-environment."
        supports: SUPPORT
