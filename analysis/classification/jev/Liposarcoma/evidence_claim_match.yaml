      assertion_type: Pathophysiology
      assertion:
        name: 12q13-15 (MDM2/CDK4) Amplification
        genetic_context:
          variant_origin: SOMATIC
        description: Well-differentiated and dedifferentiated liposarcomas exhibit the characteristic
          amplification of chromosome region 12q13-15, which contains the oncogenes MDM2 and CDK4 (and
          HMGA2). This copy-number amplification is the defining molecular event of the WDLPS/DDLPS lineage
          and is detected diagnostically by FISH/IHC to distinguish these tumors from benign lipoma.
        cell_types:
        - preferred_term: mesenchymal stem cell of adipose tissue
          term:
            id: CL:0002570
            label: mesenchymal stem cell of adipose tissue
        gene_products:
        - preferred_term: E3 ubiquitin-protein ligase MDM2
          term:
            id: NCIT:C17515
            label: E3 Ubiquitin-Protein Ligase MDM2
        - preferred_term: cyclin-dependent kinase 4
          term:
            id: NCIT:C17680
            label: Cyclin-Dependent Kinase 4
      selected_evidence:
        snippet: "WDLPS and DDLPS both exhibit the characteristic \namplification of chromosome region\
          \ 12q13-15, which contains the genes CDK4 and \nMDM2."
        supports: SUPPORT
