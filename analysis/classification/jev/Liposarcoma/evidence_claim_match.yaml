              id: MONDO:0005060
              label: liposarcoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: p53 Inactivation and Cell-Cycle Dysregulation
        description: Amplified MDM2 is an E3 ubiquitin ligase that targets the p53 tumor suppressor for
          degradation, abrogating p53-mediated apoptosis and cell-cycle arrest; amplified CDK4 phosphorylates
          RB to drive G1/S cell-cycle progression. The combined loss of these checkpoints permits uncontrolled
          proliferation and underpins the rationale for MDM2 inhibitors and CDK4/6 inhibitors in WDLPS/DDLPS.
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: "The most promising results were shown for CDK4/6 and \nMDM2 inhibitors"
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38254762
      reference_title: Genetic, Epigenetic and Transcriptome Alterations in Liposarcoma for Target Therapy
        Selection.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Indirect support: the therapeutic promise of CDK4/6 and MDM2 inhibitors implicates
        these as the actionable cell-cycle/p53 nodes in liposarcoma, consistent with their amplification
        driving cell-cycle dysregulation.'
