  e3d2aa6b96a48c3d1dfe2e84c8e58b45d97d3663d763f396edbeff2fb4b481cb:
    claim:
      about:
        disease:
          name: Lipoyl Transferase 1 Deficiency
          disease_term:
            preferred_term: lipoyl transferase 1 deficiency
            term:
              id: MONDO:0014576
              label: lipoyl transferase 1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective lipoyl relay via LIPT1 deficiency
        description: 'LIPT1 encodes lipoyltransferase 1, which transfers lipoyl groups from lipoyl-GCSH
          to the E2 subunits of pyruvate dehydrogenase, alpha-ketoglutarate dehydrogenase, and branched-chain
          ketoacid dehydrogenase. This is the final step in the mitochondrial lipoylation pathway. Crucially,
          LIPT1 is not required for lipoylation of GCSH itself, so the glycine cleavage system remains
          functional. This explains the distinctive biochemical signature: combined dehydrogenase deficiency
          with lactic acidosis but preserved glycine cleavage and normal glycine levels. The clinical
          consequence is a Leigh-like encephalopathy driven by energy failure rather than the combined
          energy failure plus glycine toxicity seen in LIPT2 and LIAS deficiency.

          '
        genes:
        - preferred_term: LIPT1
          term:
            id: hgnc:29569
            label: LIPT1
        gene:
          preferred_term: LIPT1
          description: Lipoyltransferase 1, transfers lipoyl groups from lipoyl-GCSH to E2 subunits of
            alpha-ketoacid dehydrogenases.
          modifier: DECREASED
          term:
            id: hgnc:29569
            label: LIPT1
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        molecular_functions:
        - preferred_term: lipoyltransferase activity
          term:
            id: GO:0017118
            label: lipoyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: Protein lipoylation
          modifier: DECREASED
          term:
            id: GO:0009249
            label: protein lipoylation
      selected_evidence:
        snippet: Immunostaining analysis showed that lipoylated E2-PDH and E2-KGDH were extremely reduced
          in this patient
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
