            label: cyclin-dependent protein serine/threonine kinase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Functional analysis of the p.V162SfsX19 mutation, using a yeast complementation assay,
          showed loss-of-function of the mutant CDK5 gene product, thereby implicating its role in the
          pathogenesis of autosomal recessive LCH in the studied family.
        supports: SUPPORT
