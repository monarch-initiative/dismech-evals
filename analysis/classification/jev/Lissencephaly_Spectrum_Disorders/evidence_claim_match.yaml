      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neuronal Migration
        description: Pathogenic variants in genes governing cytoskeletal dynamics and neuronal migration
          disrupt the long-range radial migration of postmitotic cortical neurons from the proliferative
          ventricular zone to their final laminar position. The resulting failure or delay of migration
          produces a thickened, smooth (agyric/pachygyric) cortex with disordered six-layered lamination.
        cell_types:
        - preferred_term: migrating cortical neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: radial glial progenitor
          term:
            id: CL:0000681
            label: radial glial cell
        biological_processes:
        - preferred_term: radial neuronal migration in cerebral cortex
          term:
            id: GO:0021799
            label: cerebral cortex radially oriented cell migration
          modifier: DECREASED
        - preferred_term: neuron migration
          term:
            id: GO:0001764
            label: neuron migration
          modifier: DECREASED
      selected_evidence:
        snippet: Lissencephaly ("smooth brain," from "lissos," meaning smooth, and "encephalos," meaning
          brain) is a severe developmental disorder in which neuronal migration is impaired, leading to
          a thickened cerebral cortex whose normally folded contour is simplified and smooth.
        supports: SUPPORT
