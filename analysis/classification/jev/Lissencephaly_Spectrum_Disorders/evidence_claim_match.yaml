      assertion_type: Pathophysiology
      assertion:
        name: LIS1-NUDEL-Dynein Nucleokinesis Failure
        conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule-Based Neuronal Motility
          Failure
        description: PAFAH1B1/LIS1 dosage loss disrupts a LIS1-NUDEL-cytoplasmic dynein heavy chain complex
          that normally regulates dynein on microtubules during neuronal migration. The resulting defect
          impairs centrosome-nucleus coupling and nucleokinesis in migrating cortical neurons, producing
          the classical type I lissencephaly/SBH migration-arrest branch. Mouse allelic series show that
          lower Pafah1b1 activity causes progressively more severe neuronal migration and brain-organization
          defects, matching the clinical severity gradient from pachygyria/SBH toward more severe lissencephaly.
        genes:
        - preferred_term: PAFAH1B1
          term:
            id: hgnc:8574
            label: PAFAH1B1
        - preferred_term: NDEL1
          term:
            id: hgnc:17620
            label: NDEL1
        cell_types:
        - preferred_term: migrating cortical neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: nucleokinesis during radial migration
          term:
            id: GO:0021817
            label: nucleokinesis involved in cell motility in cerebral cortex radial glia guided migration
          modifier: ABNORMAL
        - preferred_term: microtubule-based movement
          term:
            id: GO:0007018
            label: microtubule-based movement
          modifier: DYSREGULATED
      selected_evidence:
        snippet: we demonstrate that LIS1 directly interacts with the cytoplasmic dynein heavy chain (CDHC)
          and NUDEL
        supports: SUPPORT
