              phenotype is rescued either by the actin-binding domain of αN-catenin or by ARP2/3 inhibitors.
              This is an actin-side mechanism and is distinct from the microtubule and dynein lesions
              that the tubulin, PAFAH1B1 and DCX subtypes share.
