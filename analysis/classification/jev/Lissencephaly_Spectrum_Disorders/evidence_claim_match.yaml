        biological_processes:
        - preferred_term: microtubule severing
          term:
            id: GO:0051013
            label: microtubule severing
          modifier: DECREASED
        - preferred_term: mitotic spindle organization
          term:
            id: GO:0007052
            label: mitotic spindle organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Mitotic spindle formation is defective in patient-derived fibroblasts, a consequence
          of disrupted interactions of mutant KATNB1 with KATNA1, the catalytic subunit of Katanin, and
          other microtubule-associated proteins.
        supports: SUPPORT
