        description: CTNNA2 encodes αN-catenin, which binds actin and represses ARP2/3-driven actin branching.
          Biallelic truncating CTNNA2 alleles remove that repression, and the neuronal phenotype is rescued
          either by the actin-binding domain of αN-catenin or by ARP2/3 inhibitors. This is an actin-side
          mechanism and is distinct from the microtubule and dynein lesions that the tubulin, PAFAH1B1
          and DCX subtypes share.
        biological_scale: MOLECULAR
        genes:
