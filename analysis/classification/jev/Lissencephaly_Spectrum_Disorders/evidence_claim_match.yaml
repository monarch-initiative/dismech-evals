        description: KATNB1 encodes the regulatory p80 subunit of the microtubule-severing enzyme katanin.
          Biallelic deleterious KATNB1 alleles disrupt its interaction with the catalytic subunit KATNA1
          and with other microtubule-associated proteins, and patient-derived fibroblasts show defective
          mitotic spindle formation. The lesion is therefore in the dividing progenitor rather than in
          the locomotion of an already postmitotic neuron, which is consistent with microcephaly being
          what loss of the orthologs reproduces in zebrafish and flies.
        biological_scale: CELLULAR
        genes:
        - preferred_term: KATNB1
          term:
            id: hgnc:6217
            label: KATNB1
        cell_types:
