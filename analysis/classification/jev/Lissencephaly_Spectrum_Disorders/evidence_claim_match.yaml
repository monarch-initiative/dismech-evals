  11f92dd97877dd441b90772cede6b73fd4ef690a2b7df15b1febc6de9285e6ab:
    claim:
      about:
        disease:
          name: Lissencephaly Spectrum Disorders
          disease_term:
            preferred_term: lissencephaly spectrum disorders
            term:
              id: MONDO:0018838
              label: lissencephaly spectrum disorders
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pafah1b1_dcx_gradient_and_cellular_emphasis
        prompt: What explains the opposite anterior-posterior severity gradients and cellular emphasis
          between PAFAH1B1/LIS1 and DCX disease when both converge on microtubule-dependent neuronal migration
          failure?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#LIS1-NUDEL-Dynein Nucleokinesis Failure
        - pathophysiology#DCX Microtubule Stabilization Failure
        - pathophysiology#LIS1 Progenitor Spindle Orientation Defect
        rationale: 'PAFAH1B1/LIS1 and DCX share a migration-failure endpoint, but the human radiographic
          gradients and cellular branches differ: PAFAH1B1 has a LIS1/NUDEL/dynein motor branch plus a
          progenitor-spindle component, whereas DCX disease is typically anterior-predominant in males
          and SBH in heterozygous females. The unresolved issue is whether regional expression, different
          microtubule-motor versus lattice functions, X-inactivation mosaicism, or human-specific progenitor
          context best explains these genotype-specific patterns.'
        proposed_experiments:
        - experiment_id: exp_lis1_dcx_isogenic_organoid_gradient_comparison
          name: PAFAH1B1/DCX isogenic cortical-organoid gradient comparison
          description: Generate matched human iPSC-derived dorsal forebrain organoids with PAFAH1B1 haploinsufficiency,
            DCX loss, and isogenic correction or knock-in rescue. Compare regional patterning markers,
            radial-glial spindle orientation, nucleokinesis, migration speed, microtubule lattice stability,
            and mosaic DCX expression effects to distinguish regional-expression, progenitor-spindle,
            and X-inactivation models.
          experiment_type:
            preferred_term: isogenic cerebral organoid migration and progenitor assay
          model_systems:
          - name: Human iPSC-derived dorsal forebrain organoid LIS/SBH model
            description: Isogenic human cortical organoids carrying PAFAH1B1 haploinsufficiency or DCX
              loss/knock-in variants, with corrected and non-disease donor controls.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: radial glial cell
              term:
                id: CL:0000681
                label: radial glial cell
            - preferred_term: neuron
              term:
                id: CL:0000540
                label: neuron
            culture_system: Three-dimensional cerebral organoid with live-imaging and single-cell readouts
          perturbations:
          - name: PAFAH1B1 haploinsufficiency and DCX loss or mosaic knock-in
            description: CRISPR or patient-variant knock-in perturbations with isogenic repair, including
              mixed DCX-positive and DCX-negative neuronal populations to model female SBH mosaicism.
            target: pathophysiology#DCX Microtubule Stabilization Failure
          readouts:
          - name: Regional gradient and migration metrics
            target: pathophysiology#Impaired Neuronal Migration
            description: Quantify anterior/posterior patterning markers, radial-glial cleavage orientation,
              centrosome-nucleus coupling, nuclear translocation speed, tubulin polymerization/stability
              markers, and ectopic neuronal bands.
          controls:
          - name: Isogenic corrected controls
            description: Corrected PAFAH1B1 or DCX lines and non-disease donor organoids cultured in parallel.
          decision_criterion: A disease-specific gradient mechanism is supported if PAFAH1B1 and DCX perturbations
            diverge in regional patterning, progenitor-spindle, or mosaic migration readouts despite shared
            downstream dyslamination.
          would_support:
          - pathophysiology#LIS1-NUDEL-Dynein Nucleokinesis Failure
          - pathophysiology#DCX Microtubule Stabilization Failure
          - pathophysiology#LIS1 Progenitor Spindle Orientation Defect
      selected_evidence:
        snippet: These results suggest that LIS1 and NUDEL regulate CDHC activity during neuronal migration
          and axonal retrograde transport in a Cdk5/p35-dependent fashion.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11163259
      reference_title: A LIS1/NUDEL/cytoplasmic dynein heavy chain complex in the developing and adult
        nervous system.
      evidence_source: IN_VITRO
      explanation: Supports the LIS1/NUDEL/dynein branch as a distinct molecular mechanism within the
        shared migration-failure endpoint.
