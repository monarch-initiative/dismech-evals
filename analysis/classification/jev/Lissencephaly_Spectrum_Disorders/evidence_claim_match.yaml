        prompt: Does the germline Dcx-knockout mouse — the founding animal model of DCX disease — faithfully
          recapitulate the defining human DCX neocortical malformation (X-linked lissencephaly in hemizygous
          males, subcortical band heterotopia in heterozygous females), given that germline Dcx-null mice
          have a near-normal neocortex, that only acute in utero RNAi knockdown reproduces a radial-migration/heterotopia
          phenotype, and that even this RNAi phenotype forms in rat but not in mouse — so that the severity
          and very existence of the human neocortical lesion is systematically underdetermined by the
          standard mouse knockout and its faithful modeling may require an acute-knockdown, a redundancy-free
          (Dcx/Dclk compound), a rat, or a human-specific progenitor context?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#DCX Microtubule Stabilization Failure
        - pathophysiology#Impaired Neuronal Migration
        rationale: 'DCX is one of the most striking human/model discordances in the cortical malformation
          literature, and it bears directly on how strongly the mouse can validate the DCX branch of this
          entry. In humans, X-linked DCX mutations cause classic thick lissencephaly in males and subcortical
          band heterotopia in females — a severe, defining neocortical migration defect. Yet the germline
          Dcx-knockout mouse has neocortical lamination largely indistinguishable from wild type, with
          the migration/lamination phenotype restricted to the hippocampus; the neocortical malformation
          only appears when Dcx is acutely silenced by in utero RNAi rather than deleted in the germline.
          Two overlapping explanations are documented: (1) developmental compensation / genetic redundancy,
          whereby the paralog doublecortin-like kinase (Dclk) substitutes for Dcx in the germline knockout
          but not under acute knockdown, so that only Dcx/Dclk compound loss reproduces the migration
          defect; and (2) a genuine species difference, since the same in utero RNAi against Dcx induces
          band heterotopia in rat but fails to induce heterotopia in mouse. This is a concrete instance
          of two knowledge gaps flagged by the Romero, Bahi-Buisson & Francis 2018 cortical-malformation
          review that seeds this epic: that mouse models often fail to reproduce human MCD features, and
          that acute in utero knockdown can be more severe than germline knockout because of off-target
          effects, developmental compensation, or redundancy revealed only by double knockouts. Mechanistically
          it leaves open whether the human neocortical lesion reflects reduced Dcx/Dclk-family redundancy
          in human migrating neurons, a rat-like rather than mouse-like species requirement for Dcx in
          neocortical radial migration, or a human-specific progenitor/outer-radial-glia context — meaning
          the mouse germline knockout, taken alone, validates the DCX microtubule-stabilization mechanism
          only weakly for the human neocortical phenotype.'
        proposed_experiments:
        - experiment_id: exp_dcx_dclk_compound_perturbation_rat_vs_mouse
          name: Dcx germline-KO versus acute-knockdown and Dcx/Dclk compound loss, compared across rat
            and mouse
          description: Systematically dissociate the redundancy and species-difference hypotheses by comparing
            germline Dcx knockout, acute in utero RNAi knockdown, and Dcx/Dclk compound loss for their
            ability to produce neocortical band heterotopia and laminar displacement, run in parallel
            in rat and mouse embryos with rescue-by-Dcx-overexpression specificity controls. This tests
            whether faithful modeling of the human neocortical phenotype requires removing paralog compensation,
            using acute rather than germline perturbation, and/or a rat rather than mouse substrate.
          experiment_type:
            preferred_term: in vivo rodent neuronal-migration perturbation study
          model_systems:
          - name: Rat and mouse embryonic neocortex (in utero electroporation)
            description: Developing rat and mouse cortex perturbed by in utero electroporation of RNAi
              or gene-edited alleles, the paired system that first revealed the rat-versus-mouse discrepancy
              in Dcx-knockdown heterotopia formation.
            experimental_model_type: OTHER
        - experiment_id: exp_dcx_human_ipsc_mosaic_migration_assay
          name: Human iPSC-derived cortical model of DCX loss and female SBH mosaicism
          description: Generate isogenic DCX-null and DCX-variant human iPSC-derived cortical organoids/assembloids,
            including mixed DCX-positive and DCX-negative neuronal populations to model heterozygous-female
            mosaicism, and quantify radial migration, laminar positioning, and heterotopic-band formation
            to test whether a human progenitor/neuronal context reproduces the severe neocortical phenotype
            that the mouse germline knockout does not.
          experiment_type:
            preferred_term: iPSC cortical organoid migration assay
          model_systems:
          - name: Human iPSC-derived cortical organoid/assembloid DCX model
            description: Isogenic human cortical organoids or assembloids carrying DCX loss or patient
              variants with mosaic DCX expression, preserving human-specific cortical progenitor biology
              absent from the mouse.
            experimental_model_type: ORGANOID
