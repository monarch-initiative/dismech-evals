            id: hgnc:2961
            label: DYNC1H1
        conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
        description: Neuronal migration depends on microtubule and actin cytoskeletal dynamics and on
          the dynein motor and its regulators. Mutations in microtubule subunits (tubulins) and in microtubule/dynein-associated
          proteins such as PAFAH1B1 (LIS1) and DCX impair microtubule organization, transport and nucleokinesis,
          the coupling of the nucleus to the centrosome that drives forward movement of migrating neurons.
        cell_types:
        - preferred_term: migrating cortical neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: microtubule-based movement
          term:
            id: GO:0007018
            label: microtubule-based movement
          modifier: ABNORMAL
        - preferred_term: nucleokinesis during radial migration
          term:
            id: GO:0021817
            label: nucleokinesis involved in cell motility in cerebral cortex radial glia guided migration
          modifier: ABNORMAL
      selected_evidence:
        snippet: Since microtubule (MT) and actin-associated proteins play important functions in regulating
          the dynamics of MT and actin cytoskeletons during neuronal migration, genetic mutations or deletions
          of crucial genes involved in cytoskeletal processes lead to lissencephaly in human and neuronal
          migration defects in mouse.
        supports: SUPPORT
