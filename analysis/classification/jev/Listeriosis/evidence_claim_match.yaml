  6cadd90f04dfc74e004bb66b1c97f9a5096bb4ee39a4e17bf34804b39b4f0265:
    claim:
      about:
        disease:
          name: Listeriosis
          disease_term:
            preferred_term: listeriosis
            term:
              id: MONDO:0005828
              label: listeriosis
        context:
        - path: /discussions/0
          value:
            discussion_id: murine_e_cadherin_model_mismatch
            kind: HUMAN_MODEL_MISMATCH
            status: OPEN
            prompt: Does the internalin A arm of intestinal invasion, established in guinea pigs and in
              mice carrying humanised E-cadherin, hold in the human gut, and how much of the older mouse
              literature on oral listeriosis is host-artefact?
            attaches_to:
            - pathophysiology#Intestinal Epithelial Invasion by Internalins
            - pathophysiology#Placental Infection and Fetal Compromise
            rationale: Internalin A binds human E-cadherin and does not bind the murine protein, and one
              residue of E-cadherin decides it. Decades of oral-infection work in conventional mice therefore
              cannot speak to this step, and the evidence that it operates in vivo comes from the guinea
              pig and from a knock-in mouse engineered to carry the human receptor. Both are constructions
              designed to remove the mismatch, so the human claim rests on animals chosen or built for
              the purpose rather than on direct human observation. The mismatch is mechanistically load-bearing
              here because the same internalins are asserted to carry the organism across the placental
              and blood-brain barriers, and the human evidence for those crossings is a review statement
              rather than an experiment.
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: listeriosis_inla_placental_explant_trophoblast
        name: Trophoblast-stratified invasion in human placental explants
        description: Assay internalin binding and bacterial invasion in human placental explants, separating
          cytotrophoblast from syncytiotrophoblast, to test the reported susceptibility difference directly
          in human tissue rather than by inference from the mouse.
        decision_criterion: Invasion is measurable in cytotrophoblast and absent or markedly lower at
          the syncytiotrophoblast surface.
        would_support:
        - pathophysiology#Placental Infection and Fetal Compromise
        supporting_outcome:
        - A cytotrophoblast-restricted invasion pattern in human tissue would ground the tropism claim
          without relying on an engineered host.
        refuting_outcome:
        - Equal invasion of both populations would mean the entry's trophoblast distinction is a cell-culture
          artefact.
      selected_evidence:
        snippet: Syncytiotrophoblast cells are resistant to LM adhesion on their surface, whereas cytotrophoblast
          cells remain susceptible
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0/proposed_experiments/1
      evidence_path: /discussions/0/proposed_experiments/1/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /discussions/0
    evidence_metadata:
      reference: PMID:39458411
      reference_title: Listeria in Pregnancy-The Forgotten Culprit.
      evidence_source: IN_VITRO
      explanation: The claim this experiment would test in human placental tissue. As cited it rests on
        cultured cells rather than on explants.
