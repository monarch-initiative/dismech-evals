      assertion_type: Pathophysiology
      assertion:
        name: Intestinal Epithelial Invasion by Internalins
        biological_scale: CELLULAR
        description: InlA and InlB are surface proteins with leucine-rich repeats that bind host receptors
          and drive the bacterium into a cell that is not a phagocyte. InlA binds E-cadherin. The same
          family of proteins later carries the organism across the placental and blood-brain barriers,
          which is why one mechanism explains three tissue tropisms.
        cell_types:
        - preferred_term: intestinal epithelial cell
          term:
            id: CL:0002563
            label: intestinal epithelial cell
        biological_processes:
        - preferred_term: symbiont entry into host cell
          modifier: INCREASED
          term:
            id: GO:0046718
            label: symbiont entry into host cell
      selected_evidence:
        snippet: One key group of virulence factors are internalins (Inl, with InlA and InlB being the
          most known), which are surface proteins that mediate bacterial adherence and the invasion of
          host cells. These proteins interact with specific host–cell receptors, allowing LM to penetrate
          the intestinal epithelium and breach critical barriers such as the placental and blood–brain
          barriers.
        supports: SUPPORT
