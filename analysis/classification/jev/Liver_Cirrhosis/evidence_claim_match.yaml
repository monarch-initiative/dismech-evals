              microtissues)
            description: High-throughput microphysiological system built on a 384-well microplate of 168
              interconnected well pairs. HepaRG hepatocyte microtissues, with or without THP-1 monocytic
              cells, occupy the alpha well of each pair and hepatic stellate cell (hTERT-HSC) microtissues
              occupy the beta well, so hepatocellular injury and stellate activation are read out in separate
              but communicating compartments. A non-animal New Approach Methodology built to quantify
              the key events of the liver fibrosis Adverse Outcome Pathway under TGF-beta 1, methotrexate
              and acetaminophen challenge.
