      assertion:
        target: Hepatocyte Injury and Death
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - Lipid peroxidation of membrane polyunsaturated fatty acids
        - Loss of cellular calcium sequestration and homeostasis
        - Reactive aldehyde (4-hydroxynonenal) adduction of functional proteins
        description: Covalent adduction is one of several cooperating consequences of radical formation
          that together kill the hepatocyte; the cited review is explicit that no single one of them is
          the sole cause, which is why the edge is typed as having known omitted intermediates rather
          than DIRECT.
      selected_evidence:
        snippet: None of these processes per se is considered the ultimate cause of CCl4-induced cell
          death; it is by cooperation that they achieve a fatal outcome, provided the toxicant acts in
          a high single dose, or over longer periods of time at low doses.
        supports: SUPPORT
        directness: INDIRECT
