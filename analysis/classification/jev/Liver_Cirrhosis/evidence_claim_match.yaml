        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reactive Metabolite Formation and Covalent Protein Adduction
        biological_scale: MOLECULAR
        description: 'Cytochrome P450-dependent bioactivation of a haloalkane hepatotoxicant generates
          a carbon-centred radical that binds covalently to hepatic macromolecules. For carbon tetrachloride
          the proximate species is the trichloromethyl radical, which trichloromethylates microsomal protein
          and lipid, preferentially in the centrilobular zone where oxygen tension is lowest and the glutathione-dependent
          protective route is least effective. The adduction is a measured quantity rather than an asserted
          step: covalent binding of 14C from labelled CCl4 is quantified against oxygen tension, added
          glutathione, cytochrome P-450 induction and CCl4 dose, and the protein-bound label localises
          to the cytochrome P-450 apoprotein mass range.'
        notes: Curated for carbon tetrachloride specifically. The other prototypical stressors of the
          same initiating event adduct protein through different chemistries -- thioacetamide through
          acylation and amidination of lysine, allyl alcohol through acrolein Michael addition -- which
          the protein alkylation binding used here would not correctly describe, so they need their own
          nodes rather than being folded into this one. All evidence on this node is rat microsomal or
          rat in vivo; carbon tetrachloride is the classical experimental fibrogen and is now banned or
          severely restricted, so this node states a chemically initiated mechanism demonstrated in animals,
          not a measured contributor to the contemporary human cirrhosis burden.
        locations:
        - preferred_term: Liver
          term:
            id: UBERON:0002107
            label: liver
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: Trichloromethylation of hepatic microsomal protein
          term:
            id: GO:0008213
            label: protein alkylation
          modifier: INCREASED
        chemical_entities:
        - preferred_term: carbon tetrachloride
          term:
            id: CHEBI:27385
            label: tetrachloromethane
      selected_evidence:
        snippet: CCl4 is activated by cytochrome (CYP)2E1, CYP2B1 or CYP2B2, and possibly CYP3A, to form
          the trichloromethyl radical, CCl3*.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12708612
      reference_title: 'Hepatotoxicity and mechanism of action of haloalkanes: carbon tetrachloride as
