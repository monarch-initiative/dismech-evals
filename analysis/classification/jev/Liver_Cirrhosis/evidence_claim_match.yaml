            - preferred_term: HepaRG hepatocyte-like microtissue
              term:
                id: CL:0000182
                label: hepatocyte
            - preferred_term: hTERT-immortalized hepatic stellate cell
              term:
                id: CL:0000632
                label: hepatic stellate cell
            - preferred_term: THP-1 monocytic cell line
              term:
                id: CL:0000576
                label: monocyte
            conditions:
            - TGF-beta 1 stimulation
            - methotrexate exposure
            - acetaminophen exposure
            cell_source: Established human cell lines throughout - HepaRG hepatocyte-like cells, hTERT-immortalized
              hepatic stellate cells, and THP-1 monocytic cells.
            culture_system: 384-well Akura Twin microplate of 168 interconnected well pairs carrying 3D
              microtissues, with glucose and lactate sensors monitoring cell health
            publication: PMID:40754287
            notes: First liver fibrosis New Approach Methodology curated in this knowledge base. The same
              system is also recorded on the Drug-Induced Liver Injury Module for its methotrexate and
              acetaminophen challenge arms; this entry records the fibrosis arm. The paper frames its
              readouts explicitly as the key events of the liver fibrosis Adverse Outcome Pathway.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Hepatic Stellate Cell Activation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: TGF-beta 1 drives the hTERT-HSC compartment through the defining transition of this
          node, inducing the myofibroblast marker program and the matrix products that follow from it.
        limitations: The stellate compartment is an hTERT-immortalized line rather than primary quiescent
          stellate cells, and activation is driven by exogenous TGF-beta 1 rather than by signals arising
          from the injured hepatocyte compartment. The abstract reports marker expression and secreted
          matrix proteins, not deposited fibrillar collagen, matrix stiffening or stellate cell contraction.
        readouts:
