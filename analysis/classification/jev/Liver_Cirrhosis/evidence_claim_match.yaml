            notes: Human exposure is now rare -- the compound has been banned or severely restricted --
              and the evidence attached here is experimental rather than epidemiological. This entry is
              deliberately not asserting carbon tetrachloride as a contributor to the contemporary human
              cirrhosis burden; it records the exposure that supplies the initiating chemistry of the
              upstream adduction node.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Reactive Metabolite Formation and Covalent Protein Adduction
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: 'Administration of carbon tetrachloride is the route by which the hepatic adduct
          burden is established: the covalent binding measured on the target node only occurs where CCl4
          is supplied to a cytochrome P-450-competent liver, and it scales with the amount of that enzyme
          available to activate it. Britton et al. report the in vivo counterpart directly, with chlordecone
          raising hepatic cytochrome P-450 by 67% and increasing covalent binding of labelled CCl4 metabolites
          to microsomal protein and lipid in the intact rat; that sentence carries a bracketed isotope
          label the snippet validator strips, so the dose-response sentence from the same abstract is
          quoted below instead.'
      selected_evidence:
        snippet: This radical can bind to cellular molecules (nucleic acid, protein, lipid), impairing
          crucial cellular processes such as lipid metabolism, with the potential outcome of fatty degeneration
          (steatosis).
        supports: SUPPORT
        directness: DIRECT
