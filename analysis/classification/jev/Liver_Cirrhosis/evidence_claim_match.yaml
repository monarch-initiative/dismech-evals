      assertion:
        name: Splanchnic Vasodilation and Hyperdynamic Circulation
        conforms_to: portal_hypertension#Splanchnic Vasodilation and Hyperdynamic Circulation
        role: amplifier
        biological_scale: ORGANISM
        description: Arterial vasodilation in the splanchnic bed increases the volume of blood delivered
          into the portal system, while systemic vasodilation triggers compensatory cardiac output rise
          and sodium-retaining neurohormonal activation. This hyperdynamic circulatory syndrome aggravates,
          rather than compensates, the portal pressure raised by intrahepatic resistance, and is the arm
          nonselective beta-blockade acts on.
        biological_processes:
        - preferred_term: Vasodilation
          term:
            id: GO:0042311
            label: vasodilation
          modifier: INCREASED
        - preferred_term: Blood Vessel Diameter Maintenance
          term:
            id: GO:0097746
            label: blood vessel diameter maintenance
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Portal hypertension occurs due to increased resistance of the cirrhotic liver vasculature
          to portal blood flow and is further aggravated by the hyperdynamic circulatory syndrome.
        supports: SUPPORT
