            description: 'Carbon tetrachloride is the classical experimental hepatic fibrogen: a haloalkane
              bioactivated by hepatic cytochrome P-450 to a trichloromethyl radical that adducts hepatocellular
              macromolecules and, on repeated administration, drives the fibrogenic chain to cirrhosis.
              It is included here as the exposure that instantiates the chemically initiated arm of this
