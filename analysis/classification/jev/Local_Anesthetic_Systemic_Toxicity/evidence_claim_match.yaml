        context: []
      assertion_type: Discussion
      assertion:
        kind: KNOWLEDGE_GAP
        discussion_id: lipid_rescue_mechanism
        prompt: By what mechanism does intravenous lipid emulsion reverse local anesthetic cardiotoxicity
          - sequestration of the drug, a direct cardiotonic effect, post-conditioning, or some combination?
        attaches_to:
        - treatments#Intravenous Lipid Emulsion
        - pathophysiology#Myocardial Contractile Depression
        rationale: 'This is the unusual case of an antidote in routine guideline-endorsed use whose mechanism
          is still argued over. The "lipid sink" account - intravascular lipid sequestering drug away
          from target tissue - is the oldest and is supported by the cardiomyoblast work. Against it,
          a dose-response study in rats found recovery driven by a cardiotonic effect that the authors
          say complements rather than replaces sequestration, and the ASRA advisory names three mechanisms
          at once. Others have proposed that recovery is simply hemodilution. The question is not academic:
          if the sink dominates, the antidote should be reserved for the most lipophilic agents, and if
          inotropy dominates, it should not.'
      selected_evidence:
        snippet: This interim update summarizes recent scientific findings that have enhanced our understanding
          of the mechanisms that lead to lipid emulsion reversal of LAST, including rapid partitioning,
          direct inotropy, and post-conditioning.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29356773
      reference_title: 'The Third American Society of Regional Anesthesia and Pain Medicine Practice Advisory
