    evidence_metadata:
      reference: PMID:39398741
      reference_title: 'Local Anesthetic Systemic Toxicity in Pregnancy: A Retrospective Cohort Analysis.'
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: 'The discussion asks what determines which patients skip the prodrome. This is the
        one cited source that measures a population where they do: matched pregnant and nonpregnant cohorts,
        with the prodrome roughly six times less likely in pregnancy and cardiac depression twice as likely.
        It narrows the question rather than settling it - the authors offer gestational physiology and
        earlier detection as competing explanations for the same numbers, and a matched retrospective
        database cohort cannot separate them.'
