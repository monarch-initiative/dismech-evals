      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mitochondrial_bioenergetic_contribution
        hypothesis_label: Mitochondrial carnitine-acylcarnitine translocase inhibition
        status: ALTERNATIVE
        description: 'A second, parallel mechanism: local anesthetics with a cardiotoxic profile inhibit
          the carnitine-acylcarnitine translocase, cutting off long-chain fatty acid entry into the mitochondrial
          matrix and starving the myocardium of its main fuel. The potency ranking across agents tracks
          their clinical cardiotoxicity, which is the observation the hypothesis rests on. It is not a
          rival to sodium channel blockade so much as a proposed amplifier of it, and its quantitative
          contribution in a whole organism is unresolved.'
      selected_evidence:
        snippet: The authors hypothesize that differential inhibition of carnitine-stimulated pyruvate
          oxidation by various local anesthetics supports the clinical relevance of inhibition of carnitine-acylcarnitine
          translocase by local anesthetics with a cardiotoxic profile.
        supports: SUPPORT
    origin:
