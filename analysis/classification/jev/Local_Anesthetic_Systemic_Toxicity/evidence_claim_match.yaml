      assertion_type: Discussion
      assertion:
        kind: KNOWLEDGE_GAP
        discussion_id: classic_presentation_is_the_minority_picture
        prompt: Why does the classic progressive neurological-then-cardiovascular sequence describe only
          about three-fifths of published cases, and what determines which patients present with cardiovascular
          signs alone or after a delay?
        attaches_to:
        - pathophysiology#Cortical Disinhibition
        - phenotypes#Hypotension
        rationale: 'The textbook model this entry''s pathograph follows - rising concentration producing
          an ordered neurological sequence, with cardiovascular signs late - is the minority presentation
          in a 30-year review of published cases. The remainder were substantially delayed or purely cardiovascular
          with no central nervous system signs at all. The ASRA advisory reports the same drift and offers
          candidate explanations, all of them changes in practice rather than in biology: ultrasound guidance
          means fewer intravascular injections, infiltration techniques absorb more slowly, and continuous
          infusions accumulate. Whether the shift is entirely explained by technique or partly reflects
          who is now being affected is not settled; the advisory notes an increasing share of events outside
          hospitals and involving non-anesthesiologists.'
      selected_evidence:
        snippet: Sixty percent of cases followed the classic pattern of presentation. However, in the
          remainder of cases, symptoms were substantially delayed after the injection of local anesthetic,
          or involved only signs of cardiovascular compromise, with no evidence of central nervous system
          toxicity.
        supports: REFUTE
    origin:
