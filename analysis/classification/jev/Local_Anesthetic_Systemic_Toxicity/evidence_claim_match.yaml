      assertion:
        hypothesis_group_id: sodium_channel_cardiotoxicity
        hypothesis_label: Sodium channel blockade as the primary cardiotoxic mechanism
        status: CANONICAL
        description: Cardiac toxicity arises principally from blockade of the cardiac voltage-gated sodium
          channel Nav1.5, with the potency differences between agents explained by how fast each one leaves
          the channel. Reviews of the field describe the experimental data as mixed while still placing
          sodium channels first.
      selected_evidence:
        snippet: Regarding mechanism(s) of LAST, the evidence remains mixed, but it is likely that local
          anesthetic cardiotoxicity primarily arises from a blockade of sodium channels.
        supports: SUPPORT
