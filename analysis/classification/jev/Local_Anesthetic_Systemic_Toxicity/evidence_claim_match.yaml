      reference: PMID:10691241
      reference_title: Bupivacaine inhibits acylcarnitine exchange in cardiac mitochondria.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: 'The hypothesis in the originating authors'' own words, and quoted with "The authors
