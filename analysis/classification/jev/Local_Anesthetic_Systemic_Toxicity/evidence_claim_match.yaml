        rationale: Individually severe and occasionally fatal, but rare and getting rarer. Registry incidence
          is under one event per thousand peripheral nerve blocks and falling with ultrasound guidance;
          a single-centre series of 12,668 ultrasound-guided blocks recorded no cardiac arrests at all.
          Against that, events increasingly occur outside the operating theatre and in the hands of non-anesthesiologists,
          where the antidote and the expertise may not be at hand.
