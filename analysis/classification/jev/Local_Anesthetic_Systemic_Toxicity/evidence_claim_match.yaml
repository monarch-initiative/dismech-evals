      assertion_type: Pathophysiology
      assertion:
        name: Cortical GABAergic Interneuron Blockade
        biological_scale: CELLULAR
        description: 'Inhibitory tone is lost before excitatory transmission, which is why the first manifestation
          of a central nervous system overdose is excitation rather than sedation. The route is not purely
          sodium channel blockade of interneurons: cited experimental work attributes it to suppressed
          presynaptic GABA release and reduced GABA-A receptor currents as well. The sodium channel binding
          on this node is the shared class action, not the whole account.'
        cell_types:
        - preferred_term: cortical GABAergic interneuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        molecular_functions:
        - preferred_term: voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: DECREASED
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: At the molecular level, CNS toxicity involves more than sodium channel block.
        supports: REFUTE
