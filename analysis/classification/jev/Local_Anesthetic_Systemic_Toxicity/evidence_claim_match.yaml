      assertion_type: Pathophysiology
      assertion:
        name: Systemic Local Anesthetic Exposure
        biological_scale: ORGANISM
        description: An excessive free plasma concentration of local anesthetic, from inadvertent intravascular
          injection, rapid absorption from a vascular tissue bed, or cumulative overdose. Everything downstream
          is concentration-dependent, which is why the clinical picture is a sequence rather than a switch.
        chemical_entities:
        - preferred_term: bupivacaine
          term:
            id: CHEBI:3215
            label: bupivacaine
      selected_evidence:
        snippet: Their therapeutic effect is based mainly on reversible voltage-gated sodium channel inhibition,
          but toxicity is not limited to this mechanism.
        supports: SUPPORT
    origin:
