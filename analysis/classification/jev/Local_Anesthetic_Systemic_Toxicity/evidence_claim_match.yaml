    evidence_metadata:
      reference: PMID:17643405
      reference_title: Bupivacaine, but not lidocaine, disrupts cardiolipin-containing small biomimetic
        unilamellar liposomes.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: 'A second route to the same node, independent of the translocase arm upstream: direct
        disruption of the cardiolipin-rich inner mitochondrial membrane. INDIRECT because the preparation
        is a synthetic liposome rather than a mitochondrion in a myocyte, so it establishes the interaction
        and its agent selectivity but not that this is what happens in a poisoned heart. The selectivity
        is the reason it is carried at all: bupivacaine does it and lidocaine does not, which tracks their
        clinical cardiotoxicity in the same direction as the translocase potency series.'
