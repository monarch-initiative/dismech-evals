        display_name: Loeys-Dietz Syndrome Type 1 (TGFBR1)
        curated_in: Loeys-Dietz_Syndrome_1
        subtype_term:
          preferred_term: Loeys-Dietz syndrome 1
          term:
            id: MONDO:0012212
            label: Loeys-Dietz syndrome 1
        genes:
        - preferred_term: TGFBR1
          term:
            id: hgnc:11772
            label: TGFBR1
        subtype_frequency: 20-25%
        description: 'Caused by heterozygous mutations in TGFBR1, encoding the TGF-beta receptor type
          I kinase; most mutations cluster in the intracellular serine/threonine kinase domain and act
          through a mixture of haploinsufficiency and dominant-negative interference with the wild-type
          receptor rather than a single uniform mechanism. Often presents with more severe craniofacial
          features including craniosynostosis. Earlier cardiovascular surgery (mean age 16.9 years) and
          death (22.6 years) compared to type 2. Despite this, aortic specimens from TGFBR1-mutated individuals
          show a milder grade of cystic medial necrosis at histopathology than TGFBR2-mutated specimens,
          and a gene-based severity ranking places LDS1 among the more severe subtypes together with LDS2
          (LDS1 = LDS2 > LDS3 > LDS4 > LDS5).

          '
      selected_evidence:
        snippet: a splice donor site variation in intron 5 (c.973 + 1 G>A) in a familial case of LDS was
          defined
        supports: SUPPORT
