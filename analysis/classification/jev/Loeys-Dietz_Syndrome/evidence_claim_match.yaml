      assertion_type: IUISAssignment
      assertion:
        classification_value: combined immunodeficiency with syndromic features
        notes: 'IUIS 2022 Table 2 (combined immunodeficiencies with associated or syndromic features),
          sub-section 5, Hyper IgE Syndromes (HIES); listed as "Loeys-Dietz syndrome (TGFBR deficiency)"
          with TGFBR1 and TGFBR2 as the genetic defects. The placement looks surprising for a disease
          known primarily as an aortic-aneurysm connective-tissue disorder, but IUIS groups LDS with the
          hyper-IgE syndromes on the elevated-IgE / connective-tissue axis: the row''s immunologic phenotype
          is elevated IgE with eczema, food allergies, and recurrent respiratory infections alongside
          the hyperextensible joints, scoliosis, and retained primary teeth shared with AD-HIES.'
      selected_evidence:
        snippet: Loeys-Dietz syndrome (TGFBR deficiency) TGFBR1 AD 609192 Normal Normal Elevated IgE
        supports: SUPPORT
