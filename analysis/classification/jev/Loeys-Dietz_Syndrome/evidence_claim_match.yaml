      explanation: Histopathology of ascending aortic root tissue from 15 LDS patients documents diffuse
        medial degeneration with elastic-fiber fragmentation, supporting the elastin-integrity loss and
        wall weakening this node asserts. Graded PARTIAL because the same study reports *increased* medial
        collagen and extracellular-matrix *deposition* (fibrosis), not net collagen loss — so it supports
        the elastic-fiber-degradation arm but not a collagen-degradation reading of this node.
