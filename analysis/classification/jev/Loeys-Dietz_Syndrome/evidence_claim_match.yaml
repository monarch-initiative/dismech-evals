  3bd437454098fc1d581d9c15ca511bdc9862ea2c33908f51fa66e67fbe6a6248:
    claim:
      about:
        disease:
          name: Loeys-Dietz Syndrome
          disease_term:
            preferred_term: Loeys-Dietz syndrome
            term:
              id: MONDO:0018954
              label: Loeys-Dietz syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Marfan Syndrome
        disease_term:
          preferred_term: Marfan syndrome
          term:
            id: MONDO:0007947
            label: Marfan syndrome
        description: Autosomal dominant connective tissue disorder caused by FBN1 mutations encoding fibrillin-1.
          It shares aortic root aneurysm, scoliosis, pectus deformity, arachnodactyly and increased aortic-wall
          TGF-beta signaling with Loeys-Dietz syndrome, and both conform to the aortopathy_tgfbeta_dysregulation
          module, making it the principal alternative diagnosis when an aortopathy with marfanoid habitus
          is evaluated.
        distinguishing_features:
        - Ectopia lentis is a cardinal diagnostic feature of Marfan syndrome under the revised Ghent nosology
          and was absent in every proband of the original Loeys-Dietz cohort (0/16), so lens dislocation
          argues for Marfan syndrome.
        - Hypertelorism, bifid uvula or cleft palate, and generalized arterial tortuosity are characteristic
          of Loeys-Dietz syndrome and are not associated with Marfan syndrome.
        - Aneurysm and dissection in Loeys-Dietz syndrome occur at younger ages, at smaller aortic diameters,
          and throughout the arterial tree rather than being centered on the aortic root, warranting earlier
          surgical intervention than in Marfan syndrome.
        - Molecular testing is definitive - FBN1 in Marfan syndrome versus a TGF-beta pathway gene in
          Loeys-Dietz syndrome (TGFBR1, TGFBR2, SMAD3, TGFB2, TGFB3, SMAD2, IPO8).
        notes: Historical nosology note. TGFBR2-related aortopathy was originally labelled "Marfan syndrome
          type 2" (MFS2) after the second Marfan-overlapping locus was mapped to 3p24.2-p25, and reviews
          as recent as 2020 still present TGFBR1/TGFBR2 disease as a Marfan subtype. MONDO obsoleted that
          entity - MONDO:0017308 "obsolete Marfan syndrome type 2", subset speculative, definition "OBSOLETE.
          Hypothesized form of Marfan; dubious" - with no replacement term, and MONDO retired it as a
          dubious entity rather than asserting equivalence to Loeys-Dietz syndrome. The obsolete CURIE
          must not be cited as a term anywhere in the knowledge base. dismech models Loeys-Dietz syndrome
          as its own Disease entry and a sibling member of the Heritable_Thoracic_Aortic_Disease grouping,
          never as a Marfan subtype.
      selected_evidence:
        snippet: aortic root aneurysm and ectopia lentis are the cardinal clinical features
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
