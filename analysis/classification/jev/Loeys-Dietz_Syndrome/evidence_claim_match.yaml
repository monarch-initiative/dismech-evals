      assertion:
        target: Paradoxical TGF-beta Signaling
        relationship: RECAPITULATES
        fidelity: HIGH
        description: A TGFBR1-specific (LDS type 1) knock-in mouse carrying the human M318R kinase-domain
          missense mutation recapitulates the LDS vascular phenotype, unlike simple Tgfbr1 haploinsufficiency,
          and reproduces the paradoxical in vivo increase in aortic-wall TGF-beta/SMAD2 signaling despite
          diminished receptor response to exogenous ligand in vitro.
        limitations: The knock-in strain models a single TGFBR1 kinase-domain missense allele (M318R);
          the same study also generated a parallel Tgfbr2 knock-in strain and a Tgfbr2-overexpressing
          transgenic line, so some reported findings (e.g. losartan responsiveness) reflect the shared
          LDS mechanism across both receptor genotypes rather than a TGFBR1-exclusive result.
        readouts:
        - name: Aortic-wall Smad2 phosphorylation and TGF-beta target-gene output
          target: Paradoxical TGF-beta Signaling
          direction: INCREASED
          interpretation: Progressive upregulation of Smad2 phosphorylation and TGF-beta target-gene output
            in the aortic wall paralleled worsening aneurysm pathology in vivo, supporting a paradoxical
            signaling increase rather than the diminished signaling predicted from the receptor mutation
            alone.
      selected_evidence:
        snippet: Knockin and transgenic mice, but not haploinsufficient animals, recapitulated the LDS
          phenotype.
        supports: SUPPORT
