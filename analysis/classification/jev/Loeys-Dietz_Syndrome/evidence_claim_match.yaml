  97125b6a570903f6fce13cb4f31d50101de5a7d5d6d66ec2476bccc5d75d91a3:
    claim:
      about:
        disease:
          name: Loeys-Dietz Syndrome
          disease_term:
            preferred_term: Loeys-Dietz syndrome
            term:
              id: MONDO:0018954
              label: Loeys-Dietz syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: Loeys-Dietz Syndrome Type 2
        display_name: Loeys-Dietz Syndrome Type 2 (TGFBR2)
        curated_in: Loeys-Dietz_Syndrome_2
        subtype_term:
          preferred_term: Loeys-Dietz syndrome 2
          term:
            id: MONDO:0012427
            label: Loeys-Dietz syndrome 2
        genes:
        - preferred_term: TGFBR2
          term:
            id: hgnc:11773
            label: TGFBR2
        subtype_frequency: 55-60%
        description: 'Caused by heterozygous mutations in TGFBR2, encoding the TGF-beta receptor type
          II. Characterized kinase-domain variants impair canonical SMAD2/3 signaling and act through
          dominant-negative interference with the receptor complex rather than simple haploinsufficiency,
          which a Tgfbr2 knockin mouse corroborates in vivo. Aortic disease is severe: aortic specimens
          from TGFBR2-mutated individuals show uniformly higher-grade cystic medial necrosis than TGFBR1-mutated
          specimens, a paediatric TGFBR2 cohort showed larger aortic z-scores and stiffer, less distensible
          aortas at the annulus, sinotubular junction and ascending aorta than its TGFBR1 comparator,
          and the gene-based severity ranking places LDS2 alongside LDS1 as the most severe classes (LDS1
          = LDS2 > LDS3 > LDS4 > LDS5). Female TGFBR2 carriers were a higher-risk group for aortic dissection
          after initial surgery in one surgical series. An allele-specific ocular association has been
          reported for TGFBR2 Arg528 missense variants, which in two cases produced a familial exudative
          vitreoretinopathy-like retinal phenotype; this is not established as a general LDS2 feature.
          Two older descriptive claims are retained from the original entry but must be read with their
          provenance: "more prominent cutaneous features and phenotypic overlap with vascular Ehlers-Danlos
          syndrome", and later cardiovascular surgery (mean age 26.9 years) and death (31.8 years) than
          type 1, both derive from Loeys et al. 2006''s *clinically* defined type II cohort - selected
          for a vascular-Ehlers-Danlos-like, craniofacially spared presentation - and not from a TGFBR2-genotyped
          cohort. They should not be read as showing that TGFBR2 disease is milder or craniofacially spared:
          the paediatric genotyped comparison above found craniofacial features similar in the TGFBR1
          and TGFBR2 groups. Nosology note: "type 2" has a modern gene-based sense (the TGFBR2 class of
