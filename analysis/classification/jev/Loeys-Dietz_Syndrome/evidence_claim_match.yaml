            genes:
            - preferred_term: TGFBR1
              term:
                id: hgnc:11772
                label: TGFBR1
            subtype_frequency: 20-25%
            description: 'Caused by heterozygous mutations in TGFBR1, encoding the TGF-beta receptor type
              I kinase; most mutations cluster in the intracellular serine/threonine kinase domain and
              act through a mixture of haploinsufficiency and dominant-negative interference with the
              wild-type receptor rather than a single uniform mechanism. Often presents with more severe
              craniofacial features including craniosynostosis. Earlier cardiovascular surgery (mean age
              16.9 years) and death (22.6 years) compared to type 2. Despite this, aortic specimens from
              TGFBR1-mutated individuals show a milder grade of cystic medial necrosis at histopathology
              than TGFBR2-mutated specimens, and a gene-based severity ranking places LDS1 among the more
              severe subtypes together with LDS2 (LDS1 = LDS2 > LDS3 > LDS4 > LDS5).

              '
          role: subtype
      assertion_type: Genetic
      assertion:
        name: TGFBR1 Mutations (LDS Type 1)
        association: Causative
        subtype: Loeys-Dietz Syndrome Type 1
        notes: 'Heterozygous mutations in TGFBR1 encoding TGF-beta receptor type I. Most mutations cluster
          in the serine/threonine kinase domain. Accounts for 20-25% of LDS cases. Pathogenic variants
          act through a mixture of haploinsufficiency and, for a subset of kinase-domain missense variants,
          dominant-negative interference with the wild-type receptor.

          '
        variants:
        - name: Missense mutations in kinase domain (TGFBR1)
          description: 'Missense mutations in the intracellular kinase domain of TGFBR1 that impair receptor
            signaling.

            '
        - name: Dominant-negative kinase-domain missense variants (e.g., K232R, R487P)
          description: 'A subset of TGFBR1 missense variants, including K232R and R487P, do not simply
            inactivate the receptor but also interfere with the function of the co-expressed wild-type
            receptor, i.e. a dominant-negative effect layered on top of haploinsufficiency.

            '
      selected_evidence:
        snippet: We found a mutation in TGFBR1 or TGFBR2 in all probands with typical Loeys-Dietz syndrome
          (type I) and in 12 probands presenting with vascular Ehlers-Danlos syndrome (Loeys-Dietz syndrome
          type II)
        supports: SUPPORT
