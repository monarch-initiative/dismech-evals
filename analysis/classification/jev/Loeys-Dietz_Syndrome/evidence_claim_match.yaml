        - preferred_term: TGFB3
          term:
            id: hgnc:11769
            label: TGFB3
        - preferred_term: SMAD2
          term:
            id: hgnc:6768
            label: SMAD2
        conforms_to: aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation
        description: 'The six LDS genes all sit in the TGF-beta pathway: the receptors TGFBR1 and TGFBR2
          (Types 1-2), the ligands TGFB2 and TGFB3 (Types 4-5), and the intracellular effectors SMAD3
          and SMAD2 (Types 3 and 6). Although most variants are predicted to reduce pathway function,
          aortic-wall tissue from patients with TGFBR1/2, SMAD3, TGFB2 and TGFB3 variants paradoxically
          shows increased canonical and noncanonical TGF-beta signaling, with up-regulated TGF-beta ligand
          expression. This results in excessive SMAD2/3 phosphorylation and activation of ERK and p38
          MAPK downstream targets that promote extracellular matrix degradation. SMAD2 and SMAD3 therefore
          appear here in two roles: as the mutated gene in Types 6 and 3, and, as the wild-type protein,
          as the phosphorylated readout of the paradoxical signal. The cited sources do not establish
          the aortic-wall signaling state for SMAD2 variants specifically; SMAD2 is placed on this node
          as a pathway member, not on the strength of a measured paradox.

          '
        cell_types:
        - preferred_term: Vascular Smooth Muscle Cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: TGF-beta Signaling
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
        - preferred_term: SMAD Signaling
          term:
            id: GO:0060395
            label: SMAD protein signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: extracellular signal-regulated kinase (ERK) 1 and 2 and Smad2 are activated in a mouse
          model of MFS, and both are inhibited by therapies directed against TGFbeta
        supports: SUPPORT
