      assertion_type: Pathophysiology
      assertion:
        name: Disrupted TGF-beta-Dependent Craniofacial, Skeletal and Cardiac Development
        biological_scale: ORGANISM
        description: TGF-beta receptor signalling is required for cranial suture, palatal, skeletal and
          cardiovascular morphogenesis. The founding TGFBR1 families showed hypertelorism, exotropia,
          micrognathia and retrognathia, craniosynostosis and marked aortic and carotid tortuosity; across
          LDS1 and LDS2, cleft palate and craniosynostosis, cervical spine malformation and instability,
          skeletal fragility, enamel defects and congenital heart defects (bicuspid aortic valve, atrial
          septal defect, patent ductus arteriosus) are more frequent than in the general population. Whether
          skeletal fragility and the dental phenotype are developmental or acquired is not established;
          they are placed on this node because both sources present them as part of the TGF-beta developmental
          phenotype.
        biological_processes:
        - preferred_term: cranial suture morphogenesis
          term:
            id: GO:0060363
            label: cranial suture morphogenesis
          modifier: ABNORMAL
        - preferred_term: skeletal system development
          term:
            id: GO:0001501
            label: skeletal system development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Figure 2 Mutations in TGFBR1 cause multiple developmental anomalies.
        supports: SUPPORT
