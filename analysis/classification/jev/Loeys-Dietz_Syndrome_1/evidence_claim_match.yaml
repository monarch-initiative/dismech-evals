      assertion_type: Definition
      assertion:
        name: Molecular and clinical diagnosis
        definition_type: DIAGNOSTIC_CRITERIA
        description: Loeys-Dietz syndrome is diagnosed either clinically, in a proband with characteristic
          findings, or by a heterozygous pathogenic variant in one of the autosomal dominant LDS genes
          found in a proband with aortic root enlargement, type A dissection, other characteristic features
          or a family history of LDS. A heterozygous pathogenic TGFBR1 variant defines subtype 1. The
          revised nosology proposed by MacCarrick et al. treats an LDS-gene mutation together with documented
          aortic root enlargement or dissection as diagnostic irrespective of the severity of systemic
          features.
      selected_evidence:
        snippet: Given that vascular disease is the major concern for this patient group, and that patients
          with mutations in TGFBR1, TGFBR2, SMAD3, or TGFB2 show more widespread and/or aggressive vascular
          disease when compared with Marfan syndrome or thoracic aortic aneurysm and dissection, irrespective
          of the severity of systemic features, we propose a revised nosology
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/1
      context_paths:
