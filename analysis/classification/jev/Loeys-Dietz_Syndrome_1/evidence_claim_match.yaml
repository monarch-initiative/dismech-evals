      assertion_type: Genetic
      assertion:
        name: TGFBR1
        gene_term:
          preferred_term: TGFBR1
          term:
            id: hgnc:11772
            label: TGFBR1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: TGFBR1 (9q22.33) encodes the type I TGF-beta receptor. TGFBR1 accounts for roughly 20-25%
          of Loeys-Dietz syndrome overall. LDS alleles are heterozygous, mostly missense, concentrated
          in the serine/threonine kinase domain. ClinGen classifies TGFBR1 as Definitive for autosomal
          dominant Loeys-Dietz syndrome, but that assertion is recorded against the umbrella MONDO:0018954,
          not against MONDO:0012212, so no gene_disease_validity tier is copied onto this entry; no LDS1-specific
          ClinGen curation is in the cache. ClinGen separately classifies TGFBR1 for multiple self-healing
          squamous epithelioma (MONDO:0007566), a distinct disorder caused by truncating alleles.
        variants:
        - name: M318R
          description: Kinase-domain missense allele from the founding report; modelled by the Tgfbr1
            M318R/+ knock-in mouse.
        - name: A230T
          description: Missense allele modelled in patient-derived and gene-edited human iPSC vascular
            grafts, which dilated in vivo.
      selected_evidence:
        snippet: We sequenced all exons of TGFBR1 and found a unique missense mutation in each family
          (families 7–10) that affected evolutionarily conserved residues
        supports: SUPPORT
