  872a94a17f59b0908de3df4f861f352c52c3f76e89403cef5c1c5bf7bac29daa:
    claim:
      about:
        disease:
          name: Loeys-Dietz Syndrome 1
          disease_term:
            preferred_term: Loeys-Dietz syndrome 1
            term:
              id: MONDO:0012212
              label: Loeys-Dietz syndrome 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Prophylactic Aortic Root Replacement
        description: 'Elective (preferably valve-sparing) replacement of the aortic root and ascending
          aorta before dissection. The 2022 ACC/AHA guideline gives a TGFBR1-specific threshold: an aortic
          diameter of 4.5 cm or more without high-risk features (class 1), or 4.0 cm or more when high-risk
          features are present (class 2b) - high-risk features being severe extra-aortic features (craniosynostosis,
          cleft palate, hypertelorism, bifid uvula, marked tortuosity, widened scars, translucent skin),
