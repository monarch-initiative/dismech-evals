            term:
              id: MONDO:0012212
              label: Loeys-Dietz syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Cell-Autonomous TGF-beta Receptor Signaling
        biological_scale: CELLULAR
        description: 'Cells heterozygous for an LDS TGFBR1 allele respond less to exogenous TGF-beta in
          vitro, yet keep normal steady-state SMAD2 phosphorylation, which the knock-in study reads as
          chronic compensation. In the Tgfbr1 M318R/+ mouse the defect is lineage-dependent: aortic root
          smooth muscle cells derived from the second heart field show impaired SMAD2/3 activation together
          with higher angiotensin II type 1 receptor expression and higher TGF-beta ligand expression,
          whereas neighbouring cardiac neural crest-derived cells retain signalling potential. This cell-level
          deficit and its compensations are what set up the tissue-level paradox.'
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: DECREASED
        cell_types:
        - preferred_term: second heart field-derived aortic smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
      selected_evidence:
        snippet: While heterozygous mutant cells had diminished signaling in response to exogenous TGF-β
          in vitro, they maintained normal levels of Smad2 phosphorylation under steady-state culture
          conditions, suggesting a chronic compensation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
