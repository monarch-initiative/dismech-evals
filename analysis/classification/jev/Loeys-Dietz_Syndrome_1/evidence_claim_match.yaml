      assertion_type: Treatment
      assertion:
        name: Angiotensin Receptor Blocker Therapy
        description: 'An angiotensin receptor blocker, alone or with a beta blocker, at maximally tolerated
          doses is reasonable in Loeys-Dietz syndrome (ACC/AHA class 2a). Beyond lowering haemodynamic
          stress, the TGFBR1 knock-in mouse provides a pathway rationale: losartan''s efficacy tracked
          suppression of aortic SMAD2 phosphorylation and TGF-beta1 expression, and second heart field-derived
          smooth muscle cells of the Tgfbr1 mouse up-regulate the angiotensin II type 1 receptor. There
          are no randomised trials in Loeys-Dietz syndrome. Angiotensin receptor blockers are contraindicated
          in pregnancy.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: losartan
            term:
              id: CHEBI:6541
              label: losartan
          - preferred_term: angiotensin II receptor antagonist
            term:
              id: NCIT:C66930
              label: Angiotensin II Receptor Antagonist
      selected_evidence:
        snippet: There are no randomized trials of medications to reduce aortic growth or the risk of
          aortic dissection in patients with Loeys-Dietz syndrome.
        supports: SUPPORT
