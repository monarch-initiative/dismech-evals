      reference_title: 'Loeys-Dietz syndrome: a primer for diagnosis and management.'
      evidence_source: HUMAN_CLINICAL
      explanation: Source of the gene-based revised nosology in which a TGFBR1 mutation with vascular
        disease suffices, regardless of the craniofacial or cutaneous severity that defined the older
