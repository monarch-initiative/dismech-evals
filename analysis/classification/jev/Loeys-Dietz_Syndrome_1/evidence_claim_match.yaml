        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous TGFBR1 Kinase-Domain Variant
        biological_scale: MOLECULAR
        description: The primary lesion is a heterozygous germline TGFBR1 variant. In Loeys-Dietz syndrome
          these are non-truncating - mostly missense or in-frame changes - concentrated in the serine/threonine
          kinase domain (the founding M318R and D400G alleles lie in it, T200I at the junction with the
          glycine-serine-rich domain, R487P just C-terminal to it). Tested LDS alleles inactivate canonical
          TGF-beta signalling and exert a modest dominant-negative effect on co-expressed wild-type receptor.
          The non-truncating spectrum is what separates LDS1 from multiple self-healing squamous epithelioma,
          which is caused by truncating TGFBR1 alleles.
        genes:
        - preferred_term: TGFBR1
          term:
            id: hgnc:11772
            label: TGFBR1
        molecular_functions:
        - preferred_term: TGF-beta type I receptor kinase activity
          term:
            id: GO:0004675
            label: transmembrane receptor protein serine/threonine kinase activity
          modifier: DECREASED
      selected_evidence:
        snippet: We sequenced all exons of TGFBR1 and found a unique missense mutation in each family
          (families 7–10) that affected evolutionarily conserved residues
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
