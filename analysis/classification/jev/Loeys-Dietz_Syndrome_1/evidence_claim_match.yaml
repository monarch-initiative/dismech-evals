      assertion_type: Discussion
      assertion:
        discussion_id: lds1_sex_specific_aortic_risk
        kind: KNOWLEDGE_GAP
        status: RESOLVED
        prompt: Is aortic risk in TGFBR1-related Loeys-Dietz syndrome sex-dependent, and in which direction?
        attaches_to:
        - pathophysiology#Aortic and Arterial Dissection
        rationale: Reviews cited a family study reporting that in TGFBR1 families men are more likely
          than women to develop aneurysm and dissection and die younger, whereas in TGFBR2 disease the
          documented higher-risk group is women of small body size, which is what the 2022 ACC/AHA guideline
          encodes as a high-risk feature for TGFBR2 only. A sex effect bears on whether male TGFBR1 carriers
          warrant the lower 4.0 cm threshold.
        resolved_date: '2026-10-14T00:00:00Z'
        resolution_note: Two independent primary cohorts agree on the direction. The family study (30
          TGFBR1 versus 77 TGFBR2 carriers) found sex differences in presentation and survival in TGFBR1
          but not TGFBR2 families, with men dying younger. The Montalcino Aortic Consortium registry (176
          TGFBR1, 265 TGFBR2 carriers) found more type A dissection (30% vs 12%) and more aortic events
          (52% vs 30%) in male than female TGFBR1 carriers, and no sex effect in TGFBR2. The registry
          found no dissection at or below 45 mm in TGFBR1 carriers of either sex, so the sex effect concerns
          event frequency rather than a lower dissection diameter, and the registry authors suggested
          a less aggressive strategy may be pursued in women with TGFBR1 variants. Both studies are retrospective;
          the registry describes its analyses as exploratory, and neither tested a sex-specific surgical
          threshold.
      selected_evidence:
        snippet: Significant differences were identified in clinical presentation and survival based on
          gender in TGFBR1 families but not in TGFBR2 families.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
