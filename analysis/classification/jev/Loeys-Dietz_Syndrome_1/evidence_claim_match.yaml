              label: Loeys-Dietz syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aortic and Arterial Dissection
        biological_scale: ORGANISM
        conforms_to: aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture
        description: 'The lethal endpoint. In LDS1 and LDS2, type A dissection occurs at younger ages
          and smaller root diameters than in Marfan syndrome; in a management review pooling LDS types
          1-3, dissections have occurred at 3.9-4.0 cm, a figure not specific to TGFBR1 (see the registry
          result below). In a genotype-split surgical series, type B dissection at the time of initial
          surgery was much less common in TGFBR1 than TGFBR2 carriers (9.1% vs 54.5%). Dissection is not
          confined to the aorta: a TGFBR1 carrier presented with, and later had a recurrent, renal artery
          dissection. Risk is higher in male than female TGFBR1 carriers: in the international registry
          type A dissection affected 30% of men versus 12% of women, and any aortic event 52% versus 30%,
          with no such sex effect in TGFBR2 carriers. In the same registry no TGFBR1 carrier of either
          sex dissected at an aortic root diameter at or below 45 mm.'
      selected_evidence:
        snippet: The proportion of patients with a type A aortic dissection was also greater in males
          than in females in the cohort with a TGFBR1 mutation (30% vs 12%, p= 0.004), as was the proportion
          of patients with any aortic event (defined as surgery, dissection or rupture) (52% vs 30%, p=0.005)
          or just an aortic dissection (33% vs 15%, p = 0.01). These differences were not observed in
          the TGFBR2 mutation cohort.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
