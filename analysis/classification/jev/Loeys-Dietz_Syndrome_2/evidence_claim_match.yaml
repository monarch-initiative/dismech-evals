      assertion_type: Pathophysiology
      assertion:
        name: Progressive Aortic and Arterial Dilation
        biological_scale: ORGANISM
        conforms_to: aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm
        description: 'Aortic dilation in LDS2 begins in childhood and is larger than in LDS1: in a paediatric
          cohort TGFBR2 children had larger aortic z-scores at the annulus, sinuses of Valsalva and sinotubular
          junction, more often had aortic regurgitation, and nearly half had already undergone aortic
          surgery. Dilation is not confined to the aortic root. TGFBR2 variants also predispose to intracranial
          aneurysms and to aneurysms of other arteries; in a single-centre LDS cohort 15 TGFBR2 patients
          carried 33 extra-aortic arterial aneurysms, most of them across the LDS cohort in the arch vessels
          or cerebral circulation.'
      selected_evidence:
        snippet: Aortic z scores were significantly larger in the TGFBR2 group at the level of the aortic
          valve annulus (P = 0.007), sinuses of Valsalva (P = 0.001), sinotubular junction (P = 0.001),
          and ascending aorta (P = 0.054).
        supports: SUPPORT
