        diagnosis_term:
          preferred_term: Diagnostic Imaging Testing
          term:
            id: NCIT:C16502
            label: Diagnostic Imaging Testing
        description: Echocardiography of the aortic root and ascending aorta at least annually, and MR
          or CT angiography of the entire arterial tree, head to pelvis, at least every other year, with
          more frequent imaging by genotype, family history, vessel size or growth rate. Whole-tree imaging
          is required in LDS2 because TGFBR2 variants predispose to intracranial and other extra-aortic
          aneurysms and dissections that echocardiography cannot see.
      selected_evidence:
        snippet: Echocardiography to monitor the status of the aortic root and ascending aorta (at least
          annually) and magnetic resonance angiography or computerized tomography angiography to assess
          the entire arterial tree (at least every other year); more frequent imaging may be indicated
          based on genotype, family history, absolute vessel size or growth rate, or vascular pathology.
        supports: SUPPORT
