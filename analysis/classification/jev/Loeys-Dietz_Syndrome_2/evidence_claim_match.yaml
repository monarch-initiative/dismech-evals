        biological_scale: TISSUE
        conforms_to: aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation
        description: 'Despite a receptor defect that reduces acute signalling, tissue from individuals
          with TGFBR1 or TGFBR2 variants shows increased TGF-beta pathway output: nuclear enrichment of
          phosphorylated SMAD2 and raised expression of collagen and connective tissue growth factor.
          In LDS aortas pSMAD2 immunostaining is increased against controls, and in knockin mice the aortic
          increase is progressive and accompanied by TGF-beta1 ligand upregulation. This is the TGF-beta
          paradox shared across the Loeys-Dietz genes; the human tissue studies cited here pool TGFBR1
          and TGFBR2 patients.'
        cell_types:
