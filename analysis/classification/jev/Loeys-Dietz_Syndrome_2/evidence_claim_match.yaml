        conforms_to: aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening
        description: 'The aortic media in LDS shows diffuse medial degeneration with elastic fibre fragmentation,
          extracellular matrix deposition and increased medial collagen. Medial degeneration is more severe
          with TGFBR2 than with TGFBR1: in one surgical series every TGFBR2 specimen showed grade III
          cystic medial necrosis and grade III elastic fibre fragmentation, against one grade III cystic
          medial necrosis among the TGFBR1 specimens. Clinically the weakened wall is stiffer and less
          distensible; a paediatric echocardiographic cohort found lower distensibility and strain and
          a higher stiffness index at the annulus, sinotubular junction and ascending aorta in TGFBR2
          than in TGFBR1 children.'
        cell_types:
