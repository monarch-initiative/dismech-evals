      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous TGFBR2 Kinase-Domain Variant
        biological_scale: MOLECULAR
        description: The primary lesion is a heterozygous variant in TGFBR2, which encodes the type II
          TGF-beta receptor. In the receptor complex the type II receptor phosphorylates specific serine
          and threonine residues of the type I receptor (TGFBR1) to activate it, so the type II kinase
          is the entry point of the canonical pathway. Characterised LDS-associated TGFBR2 alleles are
          missense variants in the intracellular kinase domain that reduce kinase function and exert a
          dominant-negative effect on the receptor complex.
        genes:
        - preferred_term: TGFBR2
          term:
            id: hgnc:11773
            label: TGFBR2
        molecular_functions:
        - preferred_term: TGF-beta type II receptor kinase activity
          term:
            id: GO:0004675
            label: transmembrane receptor protein serine/threonine kinase activity
          modifier: DECREASED
      selected_evidence:
        snippet: TGFBR2 plays a vital role in activating TGFBR1 by phosphorylating specific serine and
          threonine residues.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
