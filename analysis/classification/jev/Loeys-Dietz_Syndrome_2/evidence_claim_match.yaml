        notes: 'TGFBR2 (HGNC:11773, chromosome 3p) encodes the type II TGF-beta receptor serine/threonine
          kinase. Heterozygous TGFBR2 variants define Loeys-Dietz syndrome 2. TGFBR2 is the most frequently
          involved LDS gene: a review subtype table gives it 55-60% of gene-defined LDS, and in a series
          of 24 novel LDS families 10 carried TGFBR2 variants, the largest single-gene share. Variants
          in the same gene are also reported in Marfan syndrome type 2 and in familial thoracic aortic
          aneurysm and dissection without syndromic features (for example R460C), which is relevant when
          a TGFBR2 variant is found in a patient without the LDS systemic picture.'
