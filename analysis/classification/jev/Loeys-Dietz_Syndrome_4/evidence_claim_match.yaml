      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: compensatory_ligand_overshoot
        hypothesis_label: Compensatory ligand overshoot (canonical model of the TGF-beta paradox)
        status: CANONICAL
        description: The canonical reconciliation of the LDS4 paradox. Loss of one TGFB2 allele lowers
          cellular TGF-beta 2; the aortic wall responds with autocrine and/or paracrine compensation -
          increased expression of TGF-beta 2 itself and a shift towards TGF-beta 1 - that overshoots,
          producing a net high-TGF-beta tissue signature (nuclear pSMAD2, CTGF) in the diseased aorta.
          Under this model the sequence is decrease first, secondary increase second, and it is the secondary
          excess that drives medial degeneration. Both 2012 defining papers converge on it, and the Tgfb2+/-
          mouse reproduces the same increase in canonical and non-canonical signalling.
      selected_evidence:
        snippet: the initial pathway driving disease is decreased cellular TGF-β2 levels leading to a
          secondary increase in TGF-β2 production in the diseased aorta
        supports: SUPPORT
