        description: Heterozygous TGFB2 variants are the genetic trigger of LDS4. The reported allelic
          spectrum is dominated by predicted loss-of-function classes - nonsense, frameshift, splice-site
          and whole- or partial-gene deletion - with a minority of missense alleles; deletions at 1q41
          encompassing the whole gene produce the same phenotype, which is the strongest human argument
          that the mechanism is simple haploinsufficiency rather than a dominant-negative protein. A substantial
          share of the reported variants fall in the latency-associated peptide (LAP) domain or the RKKR
          furin cleavage motif required to release the mature TGF-beta 2 cytokine from LAP. Where a frameshift
          escapes nonsense-mediated decay, the mutant transcript is present but the proprotein is degraded,
          so the net effect is still reduced cellular TGF-beta 2.
