      assertion_type: Phenotype
      assertion:
        category: Obstetric
        name: Pregnancy-Related Vascular and Uterine Complications
        description: 'Pregnancy and the early postpartum period carry increased risk of aortic dissection
          or rupture and of uterine rupture in Loeys-Dietz syndrome. The magnitude of that risk is contested
          and is not established for LDS4 specifically: the older case-based literature reported catastrophic
          peripartum events, while a systematic review of 522 Loeys-Dietz pregnancies put aortic dissection
          at about 4% and peripartum maternal mortality at about 1%, and a recent multicentre cohort observed
          no dissection, uterine rupture or maternal death during pregnancy or the first postpartum year.
          That cohort was dominated by TGFBR1, TGFBR2 and SMAD3 genotypes, so it does not settle the question
          for TGFB2. No frequency band is curated for this reason.'
        phenotype_term:
          preferred_term: Uterine rupture
          term:
            id: HP:0100718
            label: Uterine rupture
      selected_evidence:
        snippet: Another recent systematic review of 522 LDS pregnancies calculated an overall aortic
          dissection rate of about 4% and a maternal mortality rate of 1% in the peripartum period
        supports: SUPPORT
        directness: INDIRECT
