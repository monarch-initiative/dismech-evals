        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tgfb2_signaling_direction_paradox
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does heterozygous loss of function of TGFB2 produce aortic tissue with
          increased canonical and non-canonical TGF-beta signalling, and is that excess the cause of medial
          degeneration or a marker of it?
        attaches_to:
        - pathophysiology#Paradoxical Aortic TGF-beta Signaling Dysregulation
        rationale: 'Every measurement in LDS4 that is made in a peripheral cell shows less TGF-beta 2;
          every measurement made in the diseased aorta shows more TGF-beta signalling. Several non-exclusive
          explanations are on the table - relief of a canonical negative-feedback loop driving ligand
          expression and non-canonical overactivation; a shift in isoform usage towards TGF-beta 1; a
          non-cell-autonomous paracrine effect between smooth muscle populations of different embryonic
          origin at the transition zones where aneurysms form; and recruitment of angiotensin II or activin
          signalling. The 2018 mutation update states explicitly that the mechanism remains elusive. This
          is not an academic point: it determines whether a TGF-beta-directed therapy should augment or
          suppress signalling, and the observed excess may equally be a repair response to matrix damage
          rather than its cause.'
        proposed_experiments:
        - experiment_id: lds4_compartment_matched_signalling
          name: Compartment-matched signalling measurement
          description: Measure TGF-beta 2 ligand, pSMAD2 and pERK1/2 in aortic media, adventitia and dermal
            fibroblasts from the same TGFB2-variant individuals, to establish whether the direction of
            the signalling change is tissue-compartment-specific rather than a whole-organism property.
        - experiment_id: lds4_temporal_ordering_mouse
          name: Temporal ordering in the haploinsufficient mouse
          description: Determine in Tgfb2+/- mice whether the rise in aortic pSmad2/3 and Erk1/2 precedes
            or follows the first detectable elastic fibre fragmentation, to discriminate a causal excess
            from a reparative response.
      selected_evidence:
        snippet: Although TGFB2 mutations are predicted to result in haploinsufficiency, the exact mechanisms
          on how loss‐of‐function mutations lead to a paradoxical activation of TGF‐β signaling remain
          elusive.
        supports: SUPPORT
