        context: []
      assertion_type: ClinicalTrial
      assertion:
        name: NCT05472519
        phase: NOT_APPLICABLE
        status: COMPLETED
        description: 'I-LoDiS, a descriptive clinical-biological study of the immune subpopulations affected
          in Loeys-Dietz syndrome, measuring follicular helper T cells and intracellular phosphorylated
          SMAD2/3. It is the only registered study addressing the paradox curated in this entry - that
          an immunosuppressive cytokine pathway produces an atopic phenotype - and it reads out the same
          pSMAD2/3 signal whose direction is the subject of the tgfb2_signaling_direction_paradox discussion.
          It is not LDS4-specific: no TGFB2-restricted trial exists, and the registration names TGFBR1/TGFBR2
          as the primary genotypes.'
        target_phenotypes:
        - preferred_term: Allergic and inflammatory disease predisposition
          term:
            id: HP:0012393
            label: Allergy
        - preferred_term: Asthma
          term:
            id: HP:0002099
            label: Asthma
        notes: 'Included despite not being TGFB2-restricted because no LDS4-specific trial is registered
          and because its readouts bear directly on two curated open questions. Its evidence is marked
          OTHER throughout: a registration record describes a planned study, it is not study evidence,
          and no results are quoted here.'
      selected_evidence:
        snippet: The immuno-allergic complications appear paradoxical because of the major immunosuppressive
          role of this cytokine on lymphoid and myeloid immune lineages.
        supports: SUPPORT
