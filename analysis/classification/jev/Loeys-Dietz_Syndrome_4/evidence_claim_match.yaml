        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lds4_immune_dysregulation_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does disruption of the immunosuppressive TGF-beta pathway produce the
          allergic and inflammatory predisposition of Loeys-Dietz syndrome, and does TGFB2 ligand haploinsufficiency
          confer it as the receptor mutations do?
        attaches_to:
        - pathophysiology#Immune Dysregulation
        - phenotypes#Allergic and Inflammatory Predisposition
        rationale: 'TGF-beta restrains lymphoid and myeloid effector programmes, yet Loeys-Dietz patients
          show a strong predisposition to asthma, eczema, food allergy, eosinophilic gastrointestinal
          disease and inflammatory bowel disease - the immunological counterpart of the aortic signalling-direction
          paradox recorded separately. The evidence base is dominated by the TGFBR1/TGFBR2 genotypes:
          the I-LoDiS registration names the receptor genes as the primary causes, and no TGFB2-specific
          immunophenotyping study has been published, so both the mechanism and its applicability to ligand
          haploinsufficiency are open. The atopic phenotypes in this entry are curated from spectrum-level
          sources, so resolving this gap determines whether that extrapolation holds for LDS4.'
        proposed_experiments:
        - experiment_id: lds4_tgfb2_immunophenotyping
          name: Immunophenotyping of a molecularly confirmed TGFB2 cohort
          description: Extend I-LoDiS-style immunophenotyping - T-cell subsets, intracellular pSMAD2/3,
            atopy and gastrointestinal inflammation burden - to a molecularly confirmed TGFB2 cohort with
            receptor-genotype comparators, to establish whether ligand haploinsufficiency reproduces the
            receptor-mutant immune phenotype.
      selected_evidence:
        snippet: The immuno-allergic complications appear paradoxical because of the major immunosuppressive
          role of this cytokine on lymphoid and myeloid immune lineages.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
