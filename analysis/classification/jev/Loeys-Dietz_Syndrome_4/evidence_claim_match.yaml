  93e861f71f6da500910ddb47099d7229180dad8731926f1ddbc738790d2fa5ea:
    claim:
      about:
        disease:
          name: Loeys-Dietz Syndrome 4
          disease_term:
            preferred_term: Loeys-Dietz syndrome 4
            term:
              id: MONDO:0013897
              label: Loeys-Dietz syndrome 4
        context: []
      assertion_type: Genetic
      assertion:
        name: TGFB2
        gene_term:
          preferred_term: TGFB2
          term:
            id: hgnc:11768
            label: TGFB2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'TGFB2 (1q41) encodes the transforming growth factor beta 2 ligand. Heterozygous loss-of-function
          variants - nonsense, frameshift, splice-site, intragenic and whole-gene deletions, and a minority
          of missense alleles - cause LDS4. Thirty distinct variants had been catalogued by the 2018 mutation
          update. Reported alleles cluster in the latency-associated peptide domain and at the RKKR furin
          cleavage motif needed to release the mature cytokine, and 23% fall in the exons encoding the
          active cytokine itself. Deep-intronic and near-splice-site variants that shift acceptor choice
          are an under-recognised class and are a reason genome rather than panel sequencing resolves
          some families. Contiguous-gene deletions sit at the other end of the size range: a 4.7 Mb 1q41
          deletion encompassing TGFB2 has been reported with Loeys-Dietz features plus adult-onset osteoporosis
          (PMID:28544325), which is why deletion/duplication analysis is not optional in LDS4 testing
          and why the neurodevelopmental attribution question recorded in the discussions concerns deletion
          carriers specifically. That report is indexed as a Letter with no abstract in the reference
          cache, so it is carried as a top-level reference and a note rather than as an evidence item
          with a snippet that could not be verified.'
      selected_evidence:
        snippet: Here, we report heterozygous mutations or deletions in the gene encoding the TGF-β2 ligand
          for a phenotype within the LDS spectrum
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
