      assertion:
        target: Paradoxical Aortic TGF-beta Signaling Dysregulation
        relationship: RECAPITULATES
        fidelity: HIGH
        description: The heterozygous null genotype matches the human haploinsufficiency mechanism exactly,
          and the aortic tissue reproduces both the canonical and non-canonical signalling increase seen
          in patient aorta.
        limitations: Mice do not develop the craniofacial or articular features of LDS4, and the aortic
          phenotype has been characterised at fixed early timepoints rather than across the fourth-decade-equivalent
          natural history that defines the human disorder.
        readouts:
        - name: Aortic pSmad2/3 and pErk1/2 phosphorylation
          target: Paradoxical Aortic TGF-beta Signaling Dysregulation
          direction: INCREASED
          interpretation: Western blot of Tgfb2+/- aorta shows activation of both TGF-beta signalling
