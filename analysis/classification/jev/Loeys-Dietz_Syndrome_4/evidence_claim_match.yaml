      assertion_type: Treatment
      assertion:
        name: Allergy and Gastrointestinal Inflammation Management
        description: 'Standard treatment of allergic and gastrointestinal inflammatory complications,
          with referral to allergy/immunology in severe disease. Two LDS-specific caveats make this more
          than generic atopy care: the agents-to-avoid list for the aorta includes routine decongestants,
          which constrains symptomatic management, and the immuno-allergic phenotype is itself an active
          research question rather than settled biology. No disease-modifying therapy directed at the
          allergic arm exists.'
        therapeutic_modality: BEHAVIORAL
