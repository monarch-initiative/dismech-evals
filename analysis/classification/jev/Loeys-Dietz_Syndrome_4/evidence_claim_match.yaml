              label: Loeys-Dietz syndrome 4
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'LDS4 is inherited in an autosomal dominant manner. Heterozygous TGFB2 loss-of-function
          variants segregate with thoracic aortic disease in large multigenerational pedigrees, and whole-gene
          deletions at 1q41 produce the same phenotype through haploinsufficiency. Penetrance is incomplete
          and expressivity is highly variable even within a single family: reduced penetrance is more
          common in TGFB2 families than in the receptor-related Loeys-Dietz subtypes, so an obligate carrier
          may be entirely unaffected. This is the key practical consequence of the genetics - cascade
          testing, not clinical screening alone, is what identifies at-risk relatives. Transmission risk
          follows directly: each child of an affected individual has a 50% chance of inheriting the variant,
          roughly three quarters of Loeys-Dietz probands carry a de novo variant while roughly one quarter
          have an affected parent, and once the familial variant is known prenatal and preimplantation
          genetic testing are available.'
      selected_evidence:
        snippet: LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2 is
          inherited in an autosomal dominant manner.
        supports: SUPPORT
