            label: Loeys-Dietz syndrome
        description: The TGFBR1 (LDS1), TGFBR2 (LDS2), SMAD3 (LDS3), TGFB3 (LDS5), SMAD2 (LDS6) and IPO8
          subtypes share hypertelorism, bifid uvula/cleft palate, skeletal features, arterial tortuosity
          and aortic aneurysm with LDS4, and are distinguished by the causal gene together with severity
          and a few discriminating features.
        distinguishing_features:
        - The LDS1/LDS2 cardiovascular phenotype is more aggressive, with dissection at younger ages and
          smaller diameters; LDS4 aneurysms typically appear in the fourth decade.
        - Cervical spine instability, a recognised feature of the receptor-related subtypes, has not yet
          been reported in TGFB2 patients. GeneReviews lists it for the Loeys-Dietz spectrum as a whole,
          so the discrepancy is recorded as an open question in discussion lds4_cervical_spine_instability_subtype_status
          rather than curated as an LDS4 phenotype.
        - Reduced penetrance is more common in TGFB2 families than in the receptor-related subtypes.
        - Discrimination requires identification of the causal gene.
      selected_evidence:
        snippet: the clinical course somewhat differs depending on the causative gene, and in particular,
          the risk of dissection is not so high when the causative gene is any of the latter three genes
        supports: SUPPORT
