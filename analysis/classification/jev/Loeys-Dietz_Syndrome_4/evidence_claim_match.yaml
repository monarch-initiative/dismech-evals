        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tgfb2_deletion_neurodevelopmental_phenotype
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the hypotonia, gross motor delay and speech delay/intellectual disability reported
          in patients with 1q41 deletions encompassing TGFB2 attributable to TGFB2 haploinsufficiency
          itself, or to the neighbouring genes also removed by the deletion?
        attaches_to:
        - pathophysiology#TGFB2 Loss-of-Function Variant
        - phenotypes#Hypotonia and Gross Motor Delay
        rationale: 'Neurodevelopmental abnormalities are not a recognised feature of Loeys-Dietz syndrome,
          yet seven of nine reported patients with pure 1q41 deletions involving TGFB2 had hypotonia and
          gross motor delay and three had speech delay and/or intellectual disability. The smallest common
          deletion contains two genes, RRP15 and TGFB2, so the deletion series cannot on its own assign
          the phenotype to TGFB2. This matters directly for how an LDS4 diagnosis is counselled: whether
          a child with a whole-gene deletion carries a neurodevelopmental risk that a child with an intragenic
          TGFB2 point mutation does not.'
        proposed_experiments:
        - experiment_id: lds4_intragenic_vs_deletion_neurodev
          name: Intragenic-variant neurodevelopmental cohort comparison
          description: Systematically assess development in a cohort of patients with intragenic TGFB2
            loss-of-function variants and compare with the 1q41 whole-gene deletion series; a neurodevelopmental
            signal restricted to deletion carriers would implicate the contiguous genes rather than TGFB2.
        notes: The same attribution problem extends beyond neurodevelopment. A 4.7 Mb 1q41 deletion encompassing
          TGFB2 has been reported with Loeys-Dietz features together with adult-onset osteoporosis (PMID:28544325)
          - osteoporosis is not a recognised feature of LDS4 from intragenic variants either, so the deletion
          series may be accumulating a contiguous-gene phenotype rather than an expanded TGFB2 phenotype.
          That report is indexed as a Letter with no abstract, so it is recorded here and as a top-level
          reference rather than as an evidence item; the proposed intragenic-versus-deletion cohort comparison
          should score skeletal density alongside development.
      selected_evidence:
        snippet: 'The smallest deletion common to all patients is a 785 kb locus that contains two genes:
          RRP15 and TGFB2.'
        supports: SUPPORT
