        description: 'Preconception counselling on aortic and uterine rupture risk, review and substitution
          of angiotensin receptor blocker therapy before conception, and increased frequency of aortic
          imaging both during pregnancy and in the weeks after delivery. The postpartum arm matters as
          much as the antenatal one: reported Loeys-Dietz peripartum catastrophes cluster in late pregnancy
          and the puerperium, and in a recent cohort the vascular events that did occur around pregnancy
          were postpartum. No LDS4-specific pregnancy outcome rate exists, so this is spectrum-level management
          applied to a subtype whose own risk is uncharacterised.'
