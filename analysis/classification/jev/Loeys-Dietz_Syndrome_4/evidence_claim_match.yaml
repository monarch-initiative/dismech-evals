      assertion:
        name: Marfan syndrome
        disease_term:
          preferred_term: Marfan syndrome
          term:
            id: MONDO:0007947
            label: Marfan syndrome
        description: 'LDS4 is the Loeys-Dietz subtype most easily mistaken for Marfan syndrome: both feature
          aortic root aneurysm at the sinuses of Valsalva, pectus deformity, scoliosis, arachnodactyly
          and striae, and the LDS4 aortic phenotype is comparatively mild and late-onset. Patients have
          carried a clinical Marfan diagnosis for years before a TGFB2 lesion was found.'
        distinguishing_features:
        - Marfan syndrome is caused by FBN1 variants; LDS4 by TGFB2 variants or whole-gene deletion, so
          molecular testing - including copy-number analysis, since whole-gene deletions are a recognised
          LDS4 mechanism and are missed by sequencing alone - is the definitive discriminator.
        - Ectopia lentis is characteristic of Marfan syndrome and was not observed in the original TGFB2
          families.
        - Hypertelorism, bifid uvula and cleft palate point to the Loeys-Dietz spectrum rather than Marfan
          syndrome.
        - Widespread arterial tortuosity and aneurysm beyond the aortic root favour LDS4; in one reported
          case it was the appearance of iliac artery ectasia and tortuosity at age 38 that prompted revision
          of a Marfan diagnosis.
      selected_evidence:
        snippet: At the age of 38, the appearance of ectasia of the left common iliac artery and tortuosity
          of the iliac arteries suggested the presence of LDS4.
        supports: SUPPORT
