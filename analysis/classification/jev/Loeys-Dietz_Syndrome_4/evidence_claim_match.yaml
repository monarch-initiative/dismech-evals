        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular confirmation of a pathogenic TGFB2 variant
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: 'Sequence analysis of TGFB2, in practice through a multigene heritable thoracic aortic
          disease or connective-tissue panel that also covers TGFBR1, TGFBR2, SMAD2, SMAD3, TGFB3 and
          FBN1, identifies a heterozygous pathogenic or likely pathogenic TGFB2 variant. Deletion/duplication
          analysis is not optional in this subtype: whole-gene and contiguous 1q41 deletions are an established
          LDS4 mechanism that sequencing alone misses, and at least one reported patient carried a working
          diagnosis of Marfan syndrome until array CGH found the deletion. Testing rather than clinical
          criteria is frequently what establishes the diagnosis, because the cardiovascular phenotype
          is milder and later in onset than in TGFBR1/TGFBR2 disease and non-penetrance is comparatively
          common. A variant of uncertain significance alone does not establish the diagnosis; near-splice-site
          and deep-intronic alleles are a recognised source of such results and may need RNA-level characterisation.'
        results: A heterozygous pathogenic or likely pathogenic TGFB2 sequence variant, or a deletion
          encompassing TGFB2, in a compatible clinical or family context establishes LDS4.
      selected_evidence:
        snippet: Next Generation Sequencing (NGS) analysis, followed by Array-CGH, allowed the detection
          of a novel chromosomal deletion including the entire TGFB2 gene, confirming not only the clinical
          suspicion of LDS4
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34680857
      reference_title: 'Differential Diagnosis between Marfan Syndrome and Loeys-Dietz Syndrome Type 4:
        A Novel Chromosomal Deletion Covering TGFB2.'
      evidence_source: HUMAN_CLINICAL
      explanation: A worked case in which panel sequencing alone was insufficient and copy number analysis
        made the diagnosis - the direct support for requiring deletion/duplication coverage in the LDS4
        testing strategy.
