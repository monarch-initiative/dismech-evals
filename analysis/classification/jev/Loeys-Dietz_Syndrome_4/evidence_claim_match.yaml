      assertion_type: Phenotype
      assertion:
        category: Immunologic
        name: Allergic and Inflammatory Predisposition
        description: 'A strong predisposition to allergic and inflammatory disease is part of the Loeys-Dietz
          phenotype, covering reactions to food and environmental allergens as well as the organ-specific
          atopic and gastrointestinal manifestations recorded separately below. This is mechanistically
          striking rather than incidental: TGF-beta is an immunosuppressive cytokine, so atopy in a TGF-beta-pathway
          disorder is the immunological counterpart of the unresolved aortic signalling-direction paradox
          recorded in the discussions. No TGFB2-specific frequency has been reported, so no frequency
          band is curated.'
        phenotype_term:
          preferred_term: Allergic and inflammatory disease predisposition
          term:
            id: HP:0012393
            label: Allergy
      selected_evidence:
        snippet: Individuals with LDS can show a strong predisposition for allergic/inflammatory disease
          including asthma, eczema, and reactions to food or environmental allergens.
