  81f4aedada27a497b68eb6755d151404dcb0b861f76475a4741ec2f210e25f94:
    claim:
      about:
        disease:
          name: Loeys-Dietz Syndrome 4
          disease_term:
            preferred_term: Loeys-Dietz syndrome 4
            term:
              id: MONDO:0013897
              label: Loeys-Dietz syndrome 4
        context: []
      assertion_type: Treatment
      assertion:
        name: Angiotensin Receptor Blocker Therapy
        description: Angiotensin receptor blockers are used across the Loeys-Dietz spectrum to reduce
          haemodynamic stress on the aortic wall, and losartan additionally antagonises TGF-beta signalling
          - the pathway implicated in the disorder. Note that the direction of the underlying signalling
          defect in LDS4 is unresolved (see the tgfb2_signaling_direction_paradox discussion), so the
          rationale for TGF-beta-directed therapy here rests on the observed aortic high-TGF-beta tissue
          signature rather than on a settled model, and there are no TGFB2-specific efficacy trials. Critically,
          angiotensin receptor blockers are contraindicated in pregnancy, so the first-line medical therapy
          of LDS4 must be reviewed and switched before conception - in a disorder whose pregnancy risk
