  104ace4800c957ad8e49c790cf8d02dd7079d4362a20d590e18b6459c7d3fd46:
    claim:
      about:
        disease:
          name: Loeys-Dietz Syndrome 4
          disease_term:
            preferred_term: Loeys-Dietz syndrome 4
            term:
              id: MONDO:0013897
              label: Loeys-Dietz syndrome 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lds4_cervical_spine_instability_subtype_status
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does cervical spine malformation and/or instability occur in TGFB2-related Loeys-Dietz
          syndrome, or is it confined to the receptor-related subtypes?
        attaches_to:
        - pathophysiology#Reduced TGF-beta 2 Ligand Availability
        rationale: 'The two sources disagree in scope rather than in fact. GeneReviews lists cervical
          spine malformation and/or instability among the defining skeletal manifestations of Loeys-Dietz
          syndrome and recommends orthopaedic follow-up and, where necessary, surgical fixation - but
          that account is written across SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, TGFBR2 and IPO8 collectively
          and makes no per-gene assignment. The only TGFB2-specific statement in the literature runs the
          other way: the 2018 mutation update reports that cervical spine instability has not yet been
          seen in TGFB2/TGFB3 patients, and uses that absence as one of the features distinguishing the
          ligand-related from the receptor-related subtypes. Because a spectrum-level list cannot establish
          a feature in one subtype while the subtype-specific literature records it as unobserved, this
          manifestation is deliberately NOT curated as an LDS4 phenotype and no surgical-fixation treatment
          is curated for it; the distinguishing_features block records the negation instead. This is an
          absence of report rather than a demonstrated absence - LDS4 is rare, the published series are
          small, and no study has systematically imaged the cervical spine in a TGFB2 cohort - so the
          question is recorded as open rather than closed. The management consequence is real either way:
          if the feature does occur at low frequency in TGFB2 carriers it bears on neck positioning and
          intubation during the prophylactic aortic surgery that defines this disorder''s care pathway.'
        proposed_experiments:
        - experiment_id: lds4_cervical_spine_imaging_cohort
          name: Systematic cervical spine imaging in a TGFB2 cohort
          description: Perform flexion-extension radiography or cross-sectional cervical spine imaging
            prospectively in a molecularly confirmed TGFB2 cohort, with a TGFBR1/TGFBR2 comparison group
            ascertained the same way, to establish whether the reported absence in TGFB2 reflects a genuine
            genotype difference or ascertainment - existing TGFB2 reports are aortic-led and largely did
            not image the cervical spine.
        notes: 'Curation decision, recorded so the reasoning is not lost: the GeneReviews skeletal-manifestation
          and orthopaedic-management sentences were mined during review and are preserved above as INDIRECT
          evidence on this gap rather than being promoted to a phenotype and a treatment block, which
