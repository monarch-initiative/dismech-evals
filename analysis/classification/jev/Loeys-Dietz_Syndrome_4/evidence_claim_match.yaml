      assertion:
        hypothesis_group_id: tgfbr3_smc_differentiation
        hypothesis_label: TGFBR3-dependent aortic root smooth muscle differentiation defect
        status: EMERGING
        description: An emerging, developmentally framed alternative that does not require the paradox
          to be resolved at all. TGFB2 signal transduction in smooth muscle cells is distinctively TGFBR3
          (betaglycan)-dependent, and the TGFB2-TGFBR3 axis is enriched in the aortic root tunica media.
          Under this model, TGFB2 haploinsufficiency impairs the differentiation of second heart field-derived
          smooth muscle cells that build the root, yielding a regionally deficient media - which would
          explain both the root-predominant distribution of LDS4 aneurysm and, through redundancy among
          the TGF-beta isoforms, its milder aggressiveness compared with receptor-gene disease. The evidence
          is entirely from a human iPSC/CRISPR system; it has not been shown in patient aortic tissue,
          so this is recorded as EMERGING rather than as a competitor to the canonical model.
      selected_evidence:
        snippet: siRNA experiments revealed that TGFB2 distinctively displays TGFBR3 dependence for signal
          transduction, an understudied TGFβ receptor in TAAD
        supports: SUPPORT
