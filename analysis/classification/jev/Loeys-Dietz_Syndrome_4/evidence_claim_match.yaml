            term:
              id: MONDO:0013897
              label: Loeys-Dietz syndrome 4
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Baseline and serial whole-arterial-tree imaging
        diagnosis_term:
          preferred_term: Diagnostic Imaging Testing
          term:
            id: NCIT:C16502
            label: Diagnostic Imaging Testing
        description: 'Echocardiography measures the aortic root and ascending aorta at least annually,
          while MR or CT angiography from head to pelvis at least every other year identifies extra-aortic
          aneurysms, dissections and arterial tortuosity that echocardiography cannot see. This is not
          optional adjunct care in LDS4: the disorder''s arterial tortuosity and non-root aneurysms are
          invisible to echocardiography, descending aortic dissection can occur while root dilation is
          still mild, and in at least one reported case an extra-aortic finding on angiography is what
          corrected the diagnosis. Imaging frequency is increased for genotype, family history, absolute
          vessel size or growth rate, and during pregnancy and the postpartum weeks.'
        results: Aortic root and ascending aortic dimensions plus the presence, location and growth rate
          of aneurysm, dissection or tortuosity anywhere in the arterial tree, which together establish
          vascular extent and set surveillance interval and prophylactic repair timing.
        notes: 'Modelled in `diagnosis:` rather than `treatments:` deliberately, following the sibling
          LDS3 entry (Aneurysm-Osteoarthritis_Syndrome): echocardiography and MR/CT angiography are diagnostic
          procedures used for surveillance, not a device therapy, and nothing about them acts on a pathophysiology
          node.'
      selected_evidence:
        snippet: Echocardiography to monitor the status of the aortic root and ascending aorta (at least
          annually) and magnetic resonance angiography or computerized tomography angiography to assess
          the entire arterial tree (at least every other year)
        supports: SUPPORT
