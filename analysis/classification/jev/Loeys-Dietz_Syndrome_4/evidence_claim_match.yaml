      assertion_type: Definition
      assertion:
        name: Molecular and clinical diagnosis of LDS4
        definition_type: DIAGNOSTIC_CRITERIA
        description: The diagnosis of Loeys-Dietz syndrome is established by identification of a heterozygous
          pathogenic variant in one of the six Loeys-Dietz genes in a proband with aortic root enlargement,
          type A dissection, or other characteristic clinical features. LDS4 is the designation applied
          when that gene is TGFB2. Because the cardiovascular phenotype in TGFB2 families is milder and
          later-onset than in TGFBR1/TGFBR2 disease, and because non-penetrance is comparatively common,
          molecular testing rather than the clinical aortic threshold is frequently what establishes the
          diagnosis.
      selected_evidence:
        snippet: by the identification of a heterozygous pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3,
          TGFBR1, or TGFBR2 or biallelic pathogenic variants in IPO8 in a proband with aortic root enlargement,
          type A dissection, other characteristic clinical features of LDS, or a family history of an
          established diagnosis of LDS
        supports: SUPPORT
