          disease and inflammatory bowel disease - and this immune arm is modelled here as its own branch
          from the genetic lesion rather than as a consequence of the vascular disease. It is the immunological
          counterpart of the aortic signalling-direction paradox: TGF-beta is a major immunosuppressive
          cytokine, so an atopic, inflammation-prone phenotype in a TGF-beta-pathway disorder is itself
          paradoxical, and the registered I-LoDiS study exists to characterise which immune subpopulations
          are affected. The documentation is spectrum-level and dominated by the receptor genotypes; no
          TGFB2-specific immunophenotyping study has been published, which is recorded as an open question
