        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the paradoxical increase in aortic TGF-beta signalling seen in other Loeys-Dietz
          subtypes also occur in SMAD2-variant aortic tissue, or does losing the effector itself break
          the paradox?
        attaches_to:
        - pathophysiology#Impaired Canonical TGF-beta SMAD2 Signal Transduction
        rationale: 'The defining paradox of Loeys-Dietz syndrome is that loss-of-function variants in
          positive components of the TGF-beta pathway are accompanied by increased SMAD phosphorylation
          and increased TGF-beta-driven gene expression in the aortic media. That observation has been
          made for TGFBR1/2, SMAD3, TGFB2 and TGFB3 - but not for SMAD2, because no SMAD2-variant aortic
          tissue series has been published. The case matters mechanistically rather than merely completing
          a set: SMAD2 is itself the phosphorylated effector, so a readout of increased pSMAD2 cannot
          mean the same thing when the SMAD2 allele is the lesion. Curating this entry''s central signalling
          node as dysregulation rather than as loss of signalling is an inference from the other subtypes,
          and is flagged here rather than asserted. A further complication is that "increased aortic TGF-beta
          signalling" is not uniform across the aortic wall: in the Tgfbr1 mouse model of Loeys-Dietz
          syndrome the direction of the effect is lineage-specific, with second-heart-field derived aortic-root
          smooth muscle cells showing *defective* ligand-induced Smad2/3 activation while the neighbouring
          cardiac-neural-crest-derived cells retain signalling potential and show *increased* Smad2/3
          phosphorylation in vivo - and lineage-restricted deletion of Smad2 in the neural-crest compartment
          alone was protective. So a whole-tissue pSMAD2 readout can average two opposite lineage-level
          effects, which is a second reason the paradox cannot simply be assumed to carry over to a SMAD2
          lesion, and a reason any SMAD2 aortic-tissue study should be resolved by lineage rather than
          reported as a bulk measurement.'
