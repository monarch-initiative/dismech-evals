      assertion_type: Discussion
      assertion:
        discussion_id: lds6_severity_placement
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Where does SMAD2-related Loeys-Dietz syndrome sit in the LDS severity ranking, and can
          a SMAD2-specific surveillance and surgical-threshold protocol be justified?
        attaches_to:
        - pathophysiology#Progressive Aortic and Arterial Dilation
        - pathophysiology#Arterial Dissection and Rupture
        rationale: 'The Loeys-Dietz subtypes are informally ordered by severity, and that ordering drives
          imaging intervals and the diameter at which prophylactic repair is offered. LDS6 is the one
          subtype left unplaced: the published denominator is a few families and a handful of reported
          variants, so no genotype-specific growth rate, dissection diameter or age-at-event distribution
          exists. Management is therefore extrapolated wholesale from Loeys-Dietz syndrome generally.
          Because the gap is one of cohort size rather than of mechanism, it is closable by systematic
          registry accrual of SMAD2-positive probands rather than by new experimental work.'
        proposed_experiments:
        - experiment_id: smad2_registry_stratification
          name: SMAD2-stratified HTAD registry analysis
          description: Pool SMAD2-positive probands across heritable-thoracic-aortic-disease registries
            and report age at first aneurysm, aortic growth rate, diameter at dissection and extra-aortic
            arterial involvement, so that LDS6 can be placed against the other subtypes on the measures
            that actually govern management.
      selected_evidence:
        snippet: there are not enough data on LDS caused by heterozygous mutations in SMAD2 to place this
          form (LDS6) in this spectrum
        supports: SUPPORT
    origin:
