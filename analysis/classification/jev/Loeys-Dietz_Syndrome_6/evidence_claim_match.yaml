          dissection can occur at smaller diameters than in Marfan syndrome the Marfan thresholds are
          not transferable.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: surgical procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        notes: No SMAD2-specific operative diameter threshold has been published; decisions are individualised
          on absolute diameter, growth rate, body size, family history and pregnancy plans.
      selected_evidence:
        snippet: Natural history is significant for aortic dissection at smaller aortic diameter and arterial
          aneurysms throughout the arterial tree
        supports: SUPPORT
