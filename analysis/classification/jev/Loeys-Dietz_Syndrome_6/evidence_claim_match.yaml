            term:
              id: MONDO:0030500
              label: Loeys-Dietz syndrome 6
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: smad2_two_phenotype_split
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do heterozygous SMAD2 variants produce two developmentally distinct presentations
          - complex congenital heart disease with laterality defects on the one hand, and late-onset arterial
          aneurysm with connective-tissue findings on the other - and does allele class predict which
          a carrier gets?
        attaches_to:
        - pathophysiology#Disrupted SMAD2-Dependent Transcriptional Programme
        - pathophysiology#Impaired Cardiac Morphogenesis and Laterality Specification
        rationale: 'Two phenotypes have been delineated for the same gene at very different developmental
          stages, and the difference is not yet explained. The leading hypothesis is allele-class-specific
          molecular consequence: isogenic stem-cell models show that haploinsufficiency and missense alleles
          produce partly distinct chromatin-accessibility and transcription-factor-binding signatures.
          That is a plausible mechanism but not a demonstrated one, and it has not been tested against
          the clinical split - the aneurysm literature is dominated by MH2 missense alleles while truncating
          and splice alleles are prominent in the congenital-heart-disease series, but nobody has shown
          that the correlation holds prospectively or that it is causal rather than an artefact of how
          the two literatures ascertained their patients. The question is directly actionable: a truncating
          SMAD2 variant found on a congenital-heart-disease panel raises the question of whether that
          child needs lifelong aortic surveillance, and the answer is currently unknown.'
        proposed_experiments:
        - experiment_id: smad2_allele_class_phenotype
          name: Allele-class-stratified phenotype comparison
          description: Assemble all reported SMAD2 carriers, classify each allele as truncating, splice
            or MH2 missense, and test whether allele class predicts congenital heart disease versus late-onset
            aortopathy - including systematic aortic imaging of SMAD2-positive congenital-heart-disease
            probands, who have generally not been imaged for aneurysm.
      selected_evidence:
        snippet: Heterozygous SMAD2 loss-of-function and missense variants are identified in patients
          with congenital heart disease (CHD) or arterial aneurysms. Mechanisms that cause distinct cardiovascular
          phenotypes remain unknown.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40028843
      reference_title: Modeling SMAD2 Mutations in Induced Pluripotent Stem Cells Provides Insights Into
        Cardiovascular Disease Pathogenesis.
      evidence_source: IN_VITRO
      explanation: Confirms that the mechanism separating the two presentations was still unknown as of
        the most recent functional study.
