        context: []
      assertion_type: Genetic
      assertion:
        name: SMAD2
        gene_term:
          preferred_term: SMAD2
          term:
            id: hgnc:6768
            label: SMAD2
        association: Causative
        relationship_type: CAUSATIVE
        notes: SMAD2 (HGNC:6768, chromosome 18q) encodes a receptor-regulated SMAD with an N-terminal
          MH1 and a C-terminal MH2 domain. Heterozygous SMAD2 variants define Loeys-Dietz syndrome 6.
          The reported alleles fall into two groups. The aneurysm literature is dominated by missense
          variants, all of which so far lie in the MH2 domain that mediates oligomerisation with SMAD4
          and downstream transcriptional activation, plus one nonsense allele (c.612dup; p.Asn205*). The
          congenital-heart-disease literature reports truncating and splice alleles in addition to missense
          variants. Whether that difference in allele spectrum explains the two clinical presentations
          is open (see discussion `smad2_two_phenotype_split`). Gene identity for this entry was established
          from the MONDO:0030500 RO:0004003 causal-gene assertion verified with OAK, together with the
          OMIM:619656 cross-reference, rather than from any narrative source.
      selected_evidence:
        snippet: SMAD2 is a strong candidate gene for arterial aneurysms and dissections given its role
          in the TGF-β signaling pathway.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
