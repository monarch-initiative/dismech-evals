              label: Loeys-Dietz syndrome 6
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: smad2_no_viable_animal_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Can any existing animal model of SMAD2 loss address the LDS6 aortopathy, given that Smad2-null
          mouse embryos die before the aorta can be assessed?
        attaches_to:
        - pathophysiology#Aortic Medial Degeneration and Wall Weakening
        rationale: 'Every other Loeys-Dietz gene has a mouse model whose aorta was examinable and which
          reproduced aspects of the human aortopathy - Smad3 knockouts die of ruptured aneurysm, Tgfb2
          heterozygotes dilate the aortic root. Smad2 is the exception: knockout embryos die before E8.5
          from defective egg-cylinder elongation and germ-layer formation, so aortic size cannot be measured
          at all. This is a genuine model-fidelity gap rather than an absence of evidence - the null model
          exists and has been characterised, but the developmental stage at which it fails is upstream
          of the tissue in question, which is exactly why a SMAD2-specific aortic mechanism has never
          been tested in vivo. The available human-relevant functional models are instead iPSC-based and
          report on cardiac development rather than on the aortic wall.'
        proposed_experiments:
        - experiment_id: smad2_conditional_aortic_model
          name: Conditional and knock-in Smad2 aortic models
          description: Build smooth-muscle-lineage conditional Smad2 knockouts and knock-in mice carrying
            a human MH2 missense allele, bypassing the peri-implantation lethality, and phenotype the
            aorta for dilation, elastic fibre fragmentation and SMAD/ERK signalling.
      selected_evidence:
        snippet: Mouse models for SMAD2 have also been developed but Smad2 knockout mice embryos die before
          E8,5, due to defective egg cylinder elongation and germ layer formation, which entangles aortic
          size examination
        supports: SUPPORT
    origin:
