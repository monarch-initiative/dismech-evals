      assertion:
        name: Marfan syndrome
        disease_term:
          preferred_term: Marfan syndrome
          term:
            id: MONDO:0007947
            label: Marfan syndrome
        description: Several SMAD2-variant patients were clinically diagnosed as, or worked up for, Marfan
          syndrome before molecular testing - they share aortic root aneurysm and a marfanoid habitus.
          Marfan syndrome is the single most likely misassignment for the vascular presentation of LDS6.
        distinguishing_features:
        - Marfan syndrome is caused by FBN1 variants; LDS6 by SMAD2 variants, so molecular testing is
          definitive.
        - Ectopia lentis is a Marfan feature and is not part of the reported SMAD2 phenotype.
        - Hypertelorism and marked arterial tortuosity point away from Marfan syndrome and towards the
          Loeys-Dietz spectrum.
        - Aortic dissection in Loeys-Dietz syndrome can occur at smaller diameters and younger ages than
          in Marfan syndrome, so the distinction changes the surveillance and surgical thresholds applied.
      selected_evidence:
        snippet: aortic dissection can occur at smaller aortic diameters and at younger ages than observed
          in Marfan syndrome
        supports: SUPPORT
