      assertion_type: Definition
      assertion:
        name: Molecular and clinical diagnosis
        definition_type: DIAGNOSTIC_CRITERIA
        description: The diagnosis of Loeys-Dietz syndrome is established either clinically, in a proband
          with characteristic findings, or by identification of a heterozygous pathogenic variant in one
          of the six autosomal dominant LDS genes; SMAD2 is the gene defining subtype 6. In the absence
          of formal LDS diagnostic criteria, a pathogenic variant in an LDS gene together with arterial
          aneurysm or dissection is generally considered sufficient.
      selected_evidence:
        snippet: The diagnosis of LDS is established in (1) a proband with characteristic clinical findings
          or (2) by the identification of a heterozygous pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3,
          TGFBR1, or TGFBR2 or biallelic pathogenic variants in IPO8 in a proband with aortic root enlargement,
          type A dissection, other characteristic clinical features of LDS, or a family history of an
          established diagnosis of LDS.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
