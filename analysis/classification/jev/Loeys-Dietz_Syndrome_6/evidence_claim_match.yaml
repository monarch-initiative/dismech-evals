  c84f2703a8df292060276043363c529e229d2e15659c183d2720b74cedeb96db:
    claim:
      about:
        disease:
          name: Loeys-Dietz Syndrome 6
          disease_term:
            preferred_term: Loeys-Dietz syndrome 6
            term:
              id: MONDO:0030500
              label: Loeys-Dietz syndrome 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous SMAD2 Loss-of-Function Variant
        biological_scale: MOLECULAR
        description: 'The primary lesion is a heterozygous loss-of-function variant in SMAD2. Reported
          alleles include nonsense, frameshift and splice variants that remove one functional copy outright,
          and missense variants. The missense alleles reported in the aneurysm literature cluster in the
          MH2 domain - the conserved surface responsible for oligomerisation of SMAD2 with SMAD4 and for
          subsequent SMAD-dependent transcriptional activation - so an MH2 missense allele attacks the
          same step as haploinsufficiency, by disabling complex assembly rather than by removing protein.
          That clustering is not a property of SMAD2 missense variants in general: in a large congenital-heart-disease
          cohort the missense variants were instead concentrated in exon 4, and the modelled p.Arg114Cys
          allele lies in the MH1 domain.'
        genes:
        - preferred_term: SMAD2
          term:
            id: hgnc:6768
            label: SMAD2
      selected_evidence:
        snippet: No mutational hotspot is observed for SMAD2 and SMAD3 mutations, but the majority (100%
          and 63%) reside in the MH2 domain, a well conserved region responsible for the oligomerization
          of SMAD2 or SMAD3 with SMAD4 and subsequent Smad‐dependent activation of downstream transcription
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29392890
      reference_title: A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Gives the functional rationale for the MH2 clustering: this domain mediates SMAD2-SMAD4
        oligomerisation and downstream transcriptional activation, so MH2 missense alleles are predicted
        to be loss-of-function.'
