          description: Obtain aortic wall tissue at elective repair from SMAD2-variant patients and quantify
            pSMAD2, pSMAD3, pERK1/2 and CTGF against non-syndromic and other-LDS-subtype controls, to
            establish whether the TGF-beta paradox holds when the mutated gene is the effector itself.
            Resolve the readout by smooth-muscle-cell lineage (second heart field versus cardiac neural
            crest) rather than reporting a bulk aortic-wall value, since the two compartments move in
            opposite directions in the Tgfbr1 mouse model.
