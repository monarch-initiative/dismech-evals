      - /disease_term
    evidence_metadata:
      reference: PMID:20301312
      reference_title: Loeys-Dietz Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: GeneReviews names SMAD2 among the genes whose heterozygous pathogenic variants establish
        a molecular diagnosis of Loeys-Dietz syndrome. Quoted in full through the clinical qualifier,
        because the molecular finding is required to occur in a proband with aortic root enlargement,
        dissection, other characteristic features, or a positive family history - it is not sufficient
        on its own.
