          name: Loeys-Dietz Syndrome 6
          disease_term:
            preferred_term: Loeys-Dietz syndrome 6
            term:
              id: MONDO:0030500
              label: Loeys-Dietz syndrome 6
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: UNKNOWN
        notes: 'Loeys-Dietz syndrome 6 is ultra-rare and no population prevalence has been established;
          broader Loeys-Dietz prevalence figures must not be reassigned to the SMAD2 subtype. The published
          denominator for the vascular presentation is small: three families in the discovery report,
          five further families in the 2019 series, and a literature total of nine likely pathogenic variants
          in fifteen subjects at the time of the 2019 genotypic review. Separately, thirty participants
          carrying heterozygous SMAD2 loss-of-function or missense variants were identified in exome sequencing
          of 11,336 congenital-heart-disease participants, but that ascertainment is by congenital heart
          disease rather than by the LDS6 phenotype and the two counts should not be added together. The
          deep-research report additionally offered a figure of roughly 1-5% of all Loeys-Dietz syndrome
          being SMAD2-related; it was seen and deliberately not curated, because the figure is review-sourced
          rather than traceable to a denominator-bearing cohort, and a fraction-of-LDS share cannot be
          converted into an LDS6 population prevalence without an LDS prevalence that is itself unestablished.'
      selected_evidence:
        snippet: To date, 9 (likely) pathogenic variants in SMAD2 have now been described in 15 subjects
        supports: SUPPORT
