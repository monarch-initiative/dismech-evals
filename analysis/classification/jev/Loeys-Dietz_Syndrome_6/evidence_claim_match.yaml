        snippet: Aortic wall tissue of TGFBR1 or 2 mutant patients showed increased nuclear accumulation
          of phosphorylated SMAD2 (pSMAD2) and enhanced expression of TGF‐β driven gene products such
          as connective tissue growth factor (CTGF), illustrating enhanced TGF‐β signaling.
