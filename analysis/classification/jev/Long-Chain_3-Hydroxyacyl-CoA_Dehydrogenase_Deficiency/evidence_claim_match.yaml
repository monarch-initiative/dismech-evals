              label: long chain 3-hydroxyacyl-CoA dehydrogenase deficiency
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Chronic progressive course
        notes: 'Despite improved neonatal survival through NBS, 94% of screened individuals develop symptomatic
          disease. Long-term complications include myopathy (82%), metabolic decompensations (80%), cardiomyopathy
          (28%), hepatopathy (32%), retinopathy (17%), and neuropathy (22%). Hospitalization rates up
          to 2.4 per year. Dietary adherence decreases with age (75% in year 1 to 12% by age 10).

          '
      selected_evidence:
        snippet: "While NBS and early treatment result in improved (neonatal) \nsurvival, they cannot\
          \ reliably prevent long-term morbidity in screened \nindividuals with LCHAD/MTP deficiency,\
          \ highlighting the urgent need of better \ntherapeutic strategies and the development of disease\
          \ course-altering treatment."
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/0
      context_paths:
      - /name
      - /disease_term
