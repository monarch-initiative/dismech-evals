        inheritance:
        - name: Autosomal recessive
        variants:
        - name: HADHA c.1528G>C (p.Glu510Gln)
          description: 'The most common pathogenic variant in LCHADD, a founder mutation affecting the
            LCHAD catalytic site. This variant selectively impairs LCHAD activity while relatively preserving
            the other two TFP enzymatic functions (enoyl-CoA hydratase and 3-ketoacyl-CoA thiolase). Carrier
            frequency in Finland is 1:240.

            '
        features: 'LCHADD is caused by biallelic pathogenic variants in HADHA, which encodes the alpha-subunit
          of the mitochondrial trifunctional protein. The common c.1528G>C (p.Glu510Gln) founder mutation
          selectively reduces LCHAD catalytic activity. Other HADHA or HADHB variants that reduce multiple
          TFP enzyme activities cause the broader phenotype of mitochondrial trifunctional protein deficiency
          (MTPD), which has a similar but often more severe clinical course including earlier neuropathy
          onset.

          '
      selected_evidence:
        snippet: "Disease courses in screened individuals with LCHAD and MTP \ndeficiency were similar\
          \ except for neuropathy, occurring earlier in individuals \nwith MTP deficiency (median 3.9\
          \ vs. 11.4 years; p = 0.0447)."
        supports: SUPPORT
