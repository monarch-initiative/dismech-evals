      assertion:
        name: Amino-Acid-Insensitive mTORC1 Signaling
        biological_scale: CELLULAR
        conforms_to: mtorc1_hyperactivation#Constitutive mTORC1 Hyperactivation
        description: mTORC1 remains partly active and lysosome-associated after amino-acid withdrawal,
          with increased p70S6K and S6 phosphorylation. Unlike the module's canonical lesions, the driver
          here is an activated positive regulator (RagC) rather than loss of a negative regulator, and
          the gain in S6K signalling in patient fibroblasts is modest.
        genes:
        - preferred_term: RRAGC
          term:
            id: hgnc:19902
            label: RRAGC
        - preferred_term: MTOR
          term:
            id: hgnc:3942
            label: MTOR
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: TORC1 signaling
          term:
            id: GO:0038202
            label: TORC1 signaling
          modifier: INCREASED
        - preferred_term: cellular response to amino acid starvation
          term:
            id: GO:0034198
            label: cellular response to amino acid starvation
          modifier: DECREASED
      selected_evidence:
        snippet: Consistent with the GOF hypothesis of the S75Y variant, we found hyperactive mTORC1 signaling
          as indicated by significantly higher phosphorylation levels of p70S6 kinase (P-p70S6K) and ribosomal
          protein S6 (P-S6) in S75Y-overexpressed NRVCMs when compared to GFP-infected control cells
        supports: SUPPORT
