      assertion_type: Genetic
      assertion:
        name: RRAGC
        gene_term:
          preferred_term: RRAGC
          term:
            id: hgnc:19902
            label: RRAGC
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: Reported germline alleles (NM_022157.4) are c.224C>A p.(Ser75Tyr), c.269C>A p.(Thr90Asn),
          c.343T>C p.(Trp115Arg) (in two unrelated infants) and c.353C>T p.(Pro118Leu), all heterozygous
          missense changes in the nucleotide-binding domain. Thr90Asn, Trp115Arg and Pro118Leu were previously
          reported as somatic follicular lymphoma variants; RRAGC is mutated in 9-17% of follicular lymphomas.
          No ClinGen gene-disease validity record for RRAGC was found in the local cache.
        variants:
        - name: c.224C>A p.(Ser75Tyr)
          description: De novo P-loop variant in the index fetus with syndromic DCM, bilateral cataracts
            and facial dysmorphism.
        - name: c.343T>C p.(Trp115Arg)
          description: De novo in the Reijnders cohort; reported again in a male infant of consanguineous
            parents with fatal DCM at two months (parental testing not documented), classified likely
            pathogenic by the diagnostic laboratory.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: 'We identified 3 de novo missense variants in RRAGC (NM_022157.4: c.269C>A, p.(Thr90Asn),
          c.353C>T, p.(Pro118Leu), and c.343T>C, p.(Trp115Arg)), which were previously reported as occurring
          somatically in follicular lymphoma.'
        supports: SUPPORT
