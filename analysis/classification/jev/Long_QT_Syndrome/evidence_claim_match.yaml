  426265cb6b5793381ee3837051c8cb319597d3376086282cb883811673d4586e:
    claim:
      about:
        disease:
          name: Familial Long QT Syndrome
          disease_term:
            preferred_term: familial long QT syndrome
            term:
              id: MONDO:0019171
              label: familial long QT syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: QT-Prolonging Drug Unmasking of Reduced Repolarization Reserve
        conforms_to: xenobiotic_cardiac_channel_perturbation#Xenobiotic Cardiac Ion-Channel Perturbation
        role: trigger
        description: A QT-prolonging drug — most often an IKr/hERG (KCNH2) blocker — superimposed on a
          subclinical reduction in repolarization reserve precipitates marked QT prolongation and torsades
          de pointes. Individuals with a latent congenital LQTS genotype have diminished reserve, so a
          QT-prolonging drug can unmask an otherwise subclinical channelopathy. Drug-associated ("acquired")
          LQTS thus acts as a pharmacological provocation that surfaces latent congenital LQTS carriers;
          congenital LQTS gene variants are enriched among such patients. Unlike the Timothy-syndrome
          fever hypothesis, this drug-unmasking mechanism is well established.
        gene:
          preferred_term: KCNH2
          term:
            id: hgnc:6251
            label: KCNH2
        genes:
        - preferred_term: KCNE1
          term:
            id: hgnc:6240
            label: KCNE1
        - preferred_term: KCNE2
          term:
            id: hgnc:6242
            label: KCNE2
        notes: 'KCNE1 and KCNE2 are bound here rather than at the inherited repolarization node, and that
          placement is the finding rather than a convenience. Both encode ancillary beta subunits - minK
          on IKs, MiRP1 on IKr - and ClinGen''s long QT expert panel reached a split verdict on them:
          limited (KCNE1) or disputed (KCNE2) evidence as causes of unprovoked congenital LQTS, but strong
          evidence for specific risk alleles predisposing to the acquired, drug-provoked form that this
          node models. The cohort evidence already on this node points the same way, locating the congenital
          variants found in drug-associated torsades patients "predominantly in genes encoding ancillary
          subunits".

          Their `genetic:` records carry the LQT5 and LQT6 subtype keys and the corresponding ClinGen
          gradings; this binding adds the mechanism node where the evidence for them is strongest, and
          does not assert that either gene is an established cause of inherited LQTS.'
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: membrane repolarization during cardiac muscle cell action potential
          term:
            id: GO:0086013
            label: membrane repolarization during cardiac muscle cell action potential
          modifier: DECREASED
        molecular_functions:
        - preferred_term: monoatomic ion channel activity
          term:
            id: GO:0005216
            label: monoatomic ion channel activity
          modifier: ABNORMAL
        locations:
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
      selected_evidence:
        snippet: DNA variants in the coding regions of congenital long-QT disease genes predisposing to
          aLQTS can be identified in approximately 10% to 15% of affected subjects, predominantly in genes
          encoding ancillary subunits.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11997281
      reference_title: Allelic variants in long-QT disease genes in patients with drug-associated torsades
        de pointes.
      evidence_source: HUMAN_CLINICAL
      explanation: In a large cohort of drug-associated (acquired) LQTS/torsades patients, 10-15% carry
        congenital long-QT gene variants, establishing that QT-prolonging drugs unmask a latent congenital
        substrate.
