          summary. That is not a curation shortcut: the assertion''s report page returned HTTP 500 when
          the cache was built on 2026-09-19, so there was no narrative to ingest. The Adler et al. reappraisal
          quoted below is the published account of the same panel''s reasoning.'
      selected_evidence:
        snippet: ANK2 | HGNC:493 | long QT syndrome | MONDO:0002442 | AD | Disputed
        supports: SUPPORT
