            id: GO:0086012
            label: membrane depolarization during cardiac muscle cell action potential
          modifier: INCREASED
        locations:
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
        notes: CAV3, KCNJ2, ALG10B and TRDN are deliberately not bound here. CAV3 and ALG10B are graded
          Limited by ClinGen and this entry curates no mechanism for either; KCNJ2 carries the IK1 current
          and is the gene of Andersen-Tawil syndrome, curated separately; and TRDN acts on the calcium
