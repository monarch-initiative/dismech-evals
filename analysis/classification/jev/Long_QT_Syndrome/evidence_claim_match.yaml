      assertion_type: ComputationalModel
      assertion:
        name: CiPA IKr-Dynamic ORd Proarrhythmia Model
        description: Regulatory in-silico proarrhythmia model built on the O'Hara-Rudy ORd model by replacing
          the I_Kr formulation with a Markov model of dynamic drug-hERG (I_Kr) binding. Combined with
          multi-channel pharmacology (up to seven currents), it computes the net-charge metric qNet to
          stratify drug-induced torsades de pointes (TdP) risk. This is the acquired (drug-induced) long
          QT / proarrhythmia arm and is the consensus cell model of the FDA/HESI CiPA initiative.
        model_type: KINETIC
        repository_url: https://github.com/FDA/CiPA
        base_model: O'Hara-Rudy ORd human ventricular action potential model (PMID:21637795)
        publication: PMID:28878692
        perturbations:
        - preferred_term: KCNH2
          term:
            id: hgnc:6251
            label: KCNH2
        modeled_mechanisms:
        - target: Torsades de Pointes
          description: The qNet metric derived from this model classifies drug-induced torsades de pointes
            risk.
        findings:
        - statement: The CiPA initiative uses an in-silico cell model with multi-channel pharmacology
            to predict drug-induced torsades de pointes risk
        - statement: The qNet net-charge metric classifies drug-induced TdP risk across a range of concentrations
            and pacing rates
        variables:
        - name: qNet
          dataset_identifier: qNet
          description: Net electronic charge carried by the major inward and outward ionic currents over
            a steady-state action potential; lower qNet indicates higher drug-induced torsades de pointes
            risk.
          unit: microC/microF
          mappings_list:
          - preferred_term: Torsade de pointes
            description: 'qNet is an inverse risk metric: lower values indicate higher TdP liability.
              No clinical threshold is asserted here; CiPA uses ordinal high/intermediate/low risk categories
              rather than a single numeric cutoff.'
            term:
              id: HP:0001664
              label: Torsade de pointes
            threshold_direction: below
        notes: Consensus in-silico model of the FDA/HESI Comprehensive in vitro Proarrhythmia Assay (CiPA);
          reference implementation at github.com/FDA/CiPA. Optimized by Dutta et al. 2017 from the IKr-dynamic
          ORd model.
      selected_evidence:
        snippet: we modified the original O'Hara Rudy ventricular cell mathematical model to include a
          Markov model of IKr to represent dynamic drug-IKr interactions (IKr-dynamic ORd model)
        supports: SUPPORT
    origin:
      assertion_path: /computational_models/1
      evidence_path: /computational_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28878692
      reference_title: Optimization of an In silico Cardiac Cell Model for Proarrhythmia Risk Assessment.
      evidence_source: COMPUTATIONAL
      explanation: Documents that the CiPA proarrhythmia model is the ORd model extended with a dynamic
        drug-I_Kr (hERG) Markov model, tying acquired long QT and TdP risk to the same repolarization-reserve
        mechanism as congenital LQTS.
