      assertion_type: Pathophysiology
      assertion:
        name: Adrenergic Trigger Susceptibility
        description: Life-threatening events in familial LQTS are shaped by genotype-specific triggering
          circumstances. The classical LQT1-LQT3 subtypes differ in whether episodes cluster during exercise
          or rest/sleep, which informs risk stratification and anti-adrenergic management.
      selected_evidence:
        snippet: LQT1 patients experienced the majority of their events (62%) during exercise, and only
          3% occurred during rest/sleep. These percentages were almost reversed among LQT2 and LQT3 patients,
          who were less likely to have events during exercise (13%) and more likely to have events during
          rest/sleep (29% and 39%).
        supports: SUPPORT
