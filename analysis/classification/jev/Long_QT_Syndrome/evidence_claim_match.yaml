              label: familial long QT syndrome
        context: []
      assertion_type: ComputationalModel
      assertion:
        name: O'Hara-Rudy (ORd) Human Ventricular Action Potential Model
        description: Foundational system of ordinary differential equations for the undiseased human ventricular
          cardiomyocyte action potential, fit to human myocyte data for the major ionic currents (I_CaL,
          I_Kr, I_Ks, I_K1, I_to, late I_Na, I_NaCa, I_NaK) with intracellular Ca2+ and CaMKII handling.
          Long QT syndrome is simulated by reducing repolarizing K+ conductance (I_Kr for LQT2, I_Ks for
          LQT1) or increasing the persistent late Na+ current (LQT3); each perturbation prolongs action
          potential duration and, during slow pacing, generates early afterdepolarizations, the cellular
          substrate for torsades de pointes.
        model_type: KINETIC
        repository_url: https://models.cellml.org/e/71
        model_id: ohara_rudy_2011
        model_format: CellML
        publication: PMID:21637795
        perturbations:
        - preferred_term: KCNH2
          term:
            id: hgnc:6251
            label: KCNH2
        - preferred_term: KCNQ1
          term:
            id: hgnc:6294
            label: KCNQ1
        - preferred_term: SCN5A
          term:
            id: hgnc:10593
            label: SCN5A
        modeled_mechanisms:
        - target: Prolonged Ventricular Action Potential Duration
          description: APD90 computed from the simulated action potential is the single-cell correlate
            of prolonged ventricular repolarization in LQTS.
        - target: Early Afterdepolarizations
          description: I_Kr block during slow pacing induces early afterdepolarizations in the model,
            reproducing the arrhythmogenic trigger.
        findings:
        - statement: I_Kr block during slow pacing induces early afterdepolarizations in the model, the
            cellular trigger for torsades de pointes in LQT2 and drug-induced long QT
        variables:
        - name: Membrane potential
          dataset_identifier: v
          description: Transmembrane potential of the ventricular cardiomyocyte, the primary ODE state
            variable.
          unit: mV
        - name: Action potential duration at 90% repolarization (APD90)
          dataset_identifier: APD90
          description: Time from action potential upstroke to 90% repolarization; the single-cell correlate
            of the QT interval and the principal LQTS readout.
          unit: ms
          mappings_list:
          - preferred_term: Prolonged QTc interval
            description: APD90 is the cellular correlate of the clinical QT interval, not a direct QT
              measurement. Thresholds are illustrative, calibrated to ORd endocardial steady-state APD90
              (about 270 ms at 1 Hz pacing), not to clinical QTc reference values.
            term:
              id: HP:0005184
              label: Prolonged QTc interval
            threshold: 300
            threshold_direction: above
            severity_scale:
            - threshold: 300
              name: mild
            - threshold: 400
              name: moderate
            - threshold: 500
              name: severe
          notes: severity_scale thresholds (300/400/500) are APD90 values in milliseconds, calibrated
            to ORd endocardial steady-state and illustrative rather than clinical QTc cutoffs.
        notes: CellML encoding in the Physiome Model Repository (exposure e/71); original MATLAB from
          the Rudy Lab. Endocardial, midmyocardial, and epicardial cell variants are provided. Base model
          for the CiPA IKr-dynamic ORd and ToR-ORd refinements below.
      selected_evidence:
        snippet: an accurate model for the undiseased human ventricular action potential (AP) which reproduces
          a broad range of physiological behaviors is needed
        supports: SUPPORT
    origin:
      assertion_path: /computational_models/0
      evidence_path: /computational_models/0/evidence/0
