      assertion_type: Definition
      assertion:
        name: QT-prolonging-drug-associated torsade/marked-QTc case-finding query for latent congenital
          LQTS carriers
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        validation_status:
          status: UNVALIDATED
          rationale: 'Drug-induced (acquired) LQTS is an established provocation that enriches for congenital
            LQTS gene variants (~10-15% of drug-associated torsade patients), so the query is well grounded
            — but this specific computable EHR phenotype has not been evaluated against a genotyped gold
            standard for PPV/yield. Natural validation substrate: genotype-linked EHR biobanks where these
            studies originated (e.g. Vanderbilt BioVU / eMERGE, All of Us).'
        attaches_to:
        - pathophysiology#QT-Prolonging Drug Unmasking of Reduced Repolarization Reserve
        description: 'EHR/OMOP case-finding query: identify individuals who develop marked QTc prolongation
          or torsades de pointes after exposure to a known QT-prolonging (IKr/hERG-blocking) drug, without
          a prior LQTS diagnosis, as candidates for latent congenital LQTS warranting off-drug QTc reassessment
          and genetic evaluation. This is the pharmacological-trigger member of the trigger-provoked-latent-disease
          archetype (cf. the Timothy and Brugada fever queries); because drug-unmasking is established,
          derivation_basis is ESTABLISHED_CRITERIA.'
        scope: EHR/OMOP case-finding for latent congenital LQTS carriers; grounded in the established
          drug-unmasking / reduced-repolarization-reserve mechanism but not yet validated as a computable
          phenotype.
        criteria_sets:
        - name: Drug-associated marked QTc prolongation or torsade
          description: Marked QTc prolongation (or documented torsades de pointes) during exposure to
            a known QT-prolonging drug, in a patient without a prior LQTS diagnosis; reassess QTc off
            the drug and refer for LQTS genetic testing.
          inclusion_criteria:
          - preferred_term: QT-prolonging drug exposure
            description: Active exposure to a drug on a recognized QT-prolonging/torsadogenic list (index
              exposure).
          - preferred_term: Marked QTc prolongation or torsades de pointes
            description: Marked QTc prolongation on ECG, or a documented torsade/polymorphic VT, during
              the drug exposure.
          exclusion_criteria:
          - preferred_term: Pre-existing LQTS diagnosis
            description: Already-diagnosed congenital LQTS (not a latent-case-finding hit).
        notes: Pharmacological-trigger counterpart to the Timothy (MECHANISTIC_HYPOTHESIS) and Brugada
          (ESTABLISHED_CRITERIA, fever) queries — same trigger-provoked-latent-disease archetype with
          a drug as the provocation. See docs/hypothesis-based-phenotype-algorithms.md and docs/reports/hypothesis-driven-ehr-case-finding-2026-07-12.md.
      selected_evidence:
        snippet: DNA variants in the coding regions of congenital long-QT disease genes predisposing to
          aLQTS can be identified in approximately 10% to 15% of affected subjects, predominantly in genes
          encoding ancillary subunits.
        supports: SUPPORT
