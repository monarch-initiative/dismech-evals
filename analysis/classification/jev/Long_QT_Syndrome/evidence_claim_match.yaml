              label: familial long QT syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Resting electrocardiography with QTc and T-wave assessment
        description: Baseline 12-lead ECG remains the core diagnostic procedure for identifying QT prolongation
          and genotype-patterned T-wave abnormalities in suspected inherited long QT syndrome.
        results: Prolonged QTc with characteristic T-wave abnormalities supports inherited LQTS, but a
          normal QTc does not exclude the diagnosis in concealed carriers.
        diagnosis_term:
          preferred_term: clinical assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        measurements:
        - preferred_term: QTc
          term:
            id: LOINC:8636-3
            label: Q-T interval corrected
        reference_ranges:
        - loinc_term:
            id: LOINC:8636-3
            label: Q-T interval corrected
          unit: ms
          population: Guideline diagnostic QTc cut-off, as applied by Vink et al. (Circulation 2018) to
            1484 genotyped individuals from 265 families with LQT1, LQT2 or LQT3
          notes: 'LOINC:8636-3 names no correction formula; the formula-specific codes LOINC:76635-2 (Bazett)
            and LOINC:76634-5 (Fridericia) exist and are not bound, because the cited abstract reports
            that cut-off performance depends on the correction formula as well as on the QT measurement
            method, age and sex. The abstract calls 480 ms "the current guideline cutoff" without naming
            the guideline or writing an inequality; the band treats 480 ms as the lower, included boundary.
            The QTc point bands of the Schwartz score and the HRS/EHRA/APHRS 2013 QTc criterion are not
            recorded as ranges, because no cached text carries them: the Schwartz and Crotti review (PMID:18606002,
            full text) describes the point score and its probability categories but its Table 2 with the
            QTc points is not in the cached text; the Schwartz diagnostic-criteria update (PMID:8339437),
            the HRS/EHRA/APHRS consensus statement and its two executive summaries (PMID:24011539, PMID:23994779,
            PMID:23916535) and two ESC ventricular arrhythmia guidelines (PMID:26320108, PMID:36017572)
            returned no abstract text, and PubMed searches for LQTS abstracts quoting the Schwartz QTc
            bands returned none. Searched 2026-10-07.'
          interpretation_bands:
          - name: QTc at or above the guideline diagnostic cut-off
            lower_bound: 480
            unit: ms
            abnormal_flag: HIGH
            interpretation: Meets the guideline QTc cut-off for diagnosing LQTS; below it, LQTS is not
              excluded, since a share of gene carriers have a normal QTc.
        notes: NCIT does not provide an ECG-specific diagnostic term here, so the preferred term is narrowed
          in the name and description.
      selected_evidence:
        snippet: The signs of long QT syndrome are prolongation of the QT interval on the electrocardiogram
          and abnormalities of T wave morphology.
        supports: SUPPORT
