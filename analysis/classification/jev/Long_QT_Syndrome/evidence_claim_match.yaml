        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
        biological_scale: MOLECULAR
        description: 'The second route to a prolonged plateau, alongside reduced repolarizing potassium
          current and persistent late sodium current. Calmodulin, encoded identically by CALM1, CALM2
          and CALM3, pre-associates with the IQ motif of the Cav1.2 pore-forming alpha-1C subunit (CACNA1C)
          and, on binding calcium, drives calcium-dependent inactivation of the channel. Variants on either
          side of that interaction leave the channel open longer than it should be: CACNA1C gain-of-function
          variants impair inactivation directly, while arrhythmogenic calmodulin variants disrupt the
          calcium-sensing step that triggers it. Either way calcium influx during the plateau is prolonged
          and the ventricular action potential lengthens. Calmodulin variants can act on the repolarizing
          side as well, reducing activation of Kv7.1 (KCNQ1), so a single calmodulin lesion can reach
          the action potential by both routes.'
        genes:
        - preferred_term: CALM1
          term:
            id: hgnc:1442
