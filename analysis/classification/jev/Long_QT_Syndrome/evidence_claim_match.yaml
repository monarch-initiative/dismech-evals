  a61407b00d1f482b6d3cf95bb7271b5dbdd69c92ffca58990473342cba87d207:
    claim:
      about:
        disease:
          name: Familial Long QT Syndrome
          disease_term:
            preferred_term: familial long QT syndrome
            term:
              id: MONDO:0019171
              label: familial long QT syndrome
        context: []
      assertion_type: ComputationalModel
      assertion:
        name: Populations of Human Ventricular Action Potential Models (Passini 2017)
        description: In silico drug-trial framework in which the O'Hara-Rudy dynamic (ORd) human ventricular
          action potential model is expanded into a population of 1,213 control models whose ionic-current
          conductances vary, retaining only models consistent with human experimental recordings. Reference
          compounds are applied as multi-channel pore block (IC50 and Hill coefficient), and the occurrence
          of repolarization abnormalities across the population is used to predict clinical torsade de
          pointes risk. It models drug-induced (acquired) proarrhythmia in wild-type cells, not the inherited
          channel defects that define this entry; it is linked here through the drug-unmasking node that
          the two forms share.
        model_type: KINETIC
        base_model: O'Hara-Rudy ORd human ventricular action potential model (PMID:21637795)
        publication: PMID:28955244
        perturbations:
        - preferred_term: SCN5A
          term:
            id: hgnc:10593
            label: SCN5A
        - preferred_term: KCNH2
          term:
            id: hgnc:6251
            label: KCNH2
        - preferred_term: KCNQ1
          term:
            id: hgnc:6294
            label: KCNQ1
        - preferred_term: KCND3
          term:
            id: hgnc:6239
            label: KCND3
        - preferred_term: CACNA1C
          term:
            id: hgnc:1390
            label: CACNA1C
        - preferred_term: KCNJ2
          term:
            id: hgnc:6263
            label: KCNJ2
        modeled_mechanisms:
        - target: QT-Prolonging Drug Unmasking of Reduced Repolarization Reserve
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Models with low repolarization reserve are the population members most vulnerable
            to drug-induced repolarization abnormalities, which is the cellular form of the drug-unmasking
            mechanism.
          limitations: The low-reserve models arise from sampled variation in conductances in a control
            population. The authors present that range as standing in for loss- or gain-of-function channel
            changes such as those caused by mutations, but no LQTS genotype is modelled, so the model
            does not represent a specific latent congenital channelopathy. Drug action is static pore
            block without binding kinetics, and the readout is a single-cell action potential rather than
            the QT interval or an arrhythmia in tissue.
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: QUALIFYING
            description: Reduced repolarization reserve in the node comes from a latent congenital LQTS
              genotype or risk alleles such as KCNE1 and KCNE2 variants; in the model it comes from sampled
              conductance values, which the authors relate to channel gain or loss in general rather than
              to any specific variant, so no genotype that unmasks is represented.
          - divergence_type: SCALE_EXTRAPOLATION
            materiality: QUALIFYING
            description: The node's outcome is marked QT prolongation and torsade de pointes in a patient;
              the model observes only isolated ventricular myocyte action potentials and infers clinical
              risk from them.
        - target: Early Afterdepolarizations
          relationship: MEASURES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Repolarization abnormalities are scored in each model, and the definition used
            is representative of early afterdepolarizations.
          limitations: The score is a threshold rule on the membrane potential 150 ms after the action
            potential peak, not a direct detection of afterdepolarization events, and it is applied to
            drug-exposed wild-type models only.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The node is the afterdepolarization itself; the model reports a binary repolarization-abnormality
              flag defined by a positive voltage derivative at a fixed time point, which stands in for
              it.
        findings:
        - statement: Repolarization abnormalities in the model population predicted clinical torsade de
            pointes risk for 62 reference compounds with 89% accuracy.
        - statement: The in silico classification was more accurate than a published animal comparator,
            the rabbit isolated Langendorff heart (89% for 62 compounds against 75% for 64 compounds).
        - statement: Simulated action potential duration changes agreed with rabbit QT interval and hiPSC-cardiomyocyte
            calcium-transient changes for the compounds compared.
        notes: No FDA regulatory action on this model was found in the cited sources. Each compound is
          modelled as block of up to seven currents (INa, INaL, IKr, IKs, Ito, ICaL and IK1); the perturbations
          list the genes encoding the principal channel for each current.
      selected_evidence:
        snippet: A control population of 1,213 human ventricular AP models in agreement with experimental
          recordings was constructed.
        supports: SUPPORT
