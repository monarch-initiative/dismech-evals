      assertion:
        name: Heterozygous KCNQ1 Loss-of-Function Variant
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
        description: A heterozygous germline loss-of-function variant in KCNQ1 reduces the function of
          the Kv7.1 channel, the alpha subunit of the IKs channel complex. Two broad mechanisms are recognized.
          Truncating, frameshift, and splice variants are generally modelled as haploinsufficient, with
          at most about half the channel function lost. Missense variants and in-frame deletions are generally
          modelled as dominant negative, where the mutant subunit co-assembles with and impairs wild-type
          subunits, for example by a trafficking defect. Variant class and location (pore, transmembrane,
          C-terminal) modify arrhythmic risk.
        genes:
        - preferred_term: KCNQ1
          term:
            id: hgnc:6294
