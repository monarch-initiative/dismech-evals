              label: long QT syndrome 1
        context: []
      assertion_type: Genetic
      assertion:
        name: KCNQ1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: KCNQ1
          term:
            id: hgnc:6294
            label: KCNQ1
        association: Causative
        notes: Encodes the Kv7.1 alpha subunit of the IKs channel. The cached ClinGen gene-disease validity
          assertion (Definitive, AD) is for MONDO:0002442 long QT syndrome, not for this entry's MONDO:0100316,
          so it is cited as evidence and not recorded in gene_disease_validity.
        variants:
        - name: KCNQ1 A341V
          type: missense
          description: Recurrent transmembrane missense founder allele, prominent in South African families.
            Its mild dominant-negative effect does not explain its unusually severe clinical phenotype,
            an example of mutation-specific risk.
        - name: KCNQ1 R518X
          type: nonsense
          description: Swedish founder allele that causes recessive JLNS when biallelic and dominant LQTS
            with a mild phenotype when heterozygous.
        - name: KCNQ1 R190Q
          type: missense
          description: Missense allele with a dominant-negative trafficking defect, modelled in patient-derived
            cardiomyocytes.
      selected_evidence:
        snippet: In long-QT syndrome type 1, mutations occur in the KCNQ1 gene, which encodes the repolarizing
          potassium channel mediating the delayed rectifier I(Ks) current.
        supports: SUPPORT
