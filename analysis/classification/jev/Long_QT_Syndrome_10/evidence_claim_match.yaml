  33c29240782bb92fcd9d390291bfd1c85408f1910569fc61411ca9a15fc29e67:
    claim:
      about:
        disease:
          name: Long QT Syndrome 10
          disease_term:
            preferred_term: long QT syndrome 10
            term:
              id: MONDO:0012737
              label: long QT syndrome 10
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lqt10_scn4b_causality_unestablished
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do SCN4B variants cause long QT syndrome at all, or is L179F in the index family a rare
          variant co-occurring with a QT prolongation of other cause?
        rationale: The LQT10 designation rests on one missense variant in one family, found by candidate-gene
          screening and not seen in other genotype-negative LQTS patients (262 screened in the primary
          report), with no statistically significant segregation and no case-control data. The functional
          evidence is a single heterologous-expression study reporting an LQT3-like increase in late sodium
          current. Without segregation in further families or a rare-variant burden in LQTS cohorts, the
          causal edge from the SCN4B variant to the sodium current change, and from there to QT prolongation,
          is a hypothesis rather than an established mechanism.
        attaches_to:
        - genetic#SCN4B
        - pathophysiology#SCN4B L179F Sodium Channel Beta-4 Subunit Variant
        - mechanistic_hypotheses#scn4b_late_sodium_current
      selected_evidence:
        snippet: Further literature, including case-control studies, to extend the level of genetic evidence
          to support causality for these genes was absent.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
