        variant_origin: DE_NOVO
        gene_term:
          preferred_term: CALM1
          term:
            id: hgnc:1442
            label: CALM1
        association: Pathogenic Variants
        notes: CALM1 carries the LQT14 designation. ClinGen classifies CALM1 as Definitive for long QT
          syndrome (assertion against MONDO:0002442) and Moderate for CPVT (assertion against MONDO:0017990);
          neither is against MONDO:0014548, so both are cited as evidence here rather than recorded in
          gene_disease_validity. Variant origin is recorded as de novo for the long QT presentation; the
          CPVT-like N53I variant was inherited within a family. In the 2023 registry CALM1 carriers had
          the highest cardiac event rate of the three calmodulin genes (88%, against 70% for CALM2 and
