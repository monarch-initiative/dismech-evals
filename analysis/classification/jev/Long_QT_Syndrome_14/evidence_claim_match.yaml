          inactivation of Cav1.2 underlies CALM-LQTS. It reversed repolarization abnormalities in CALM1
          F142L patient-derived cardiomyocytes and reduced T-wave alternans in the CALM1 D130G founding
          proband, but in the pooled registry it was stopped in two of three patients (one ventricular
          fibrillation recurrence, one intolerance), and the registry judged the clinical data too limited
          for a conclusion.
