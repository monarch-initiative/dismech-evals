          cardiac arrest at 4 years, QTc 610 ms and speech and motor delay, found by exome sequencing
          of genetically elusive long QT syndrome. It lowers calcium-binding affinity about 11-fold and
          causes a dominant loss of Cav1.2 inactivation without affecting RyR2-mediated calcium release.
      selected_evidence:
        snippet: The p.E141G was not identified in either parent confirming a de novo occurrence in the
