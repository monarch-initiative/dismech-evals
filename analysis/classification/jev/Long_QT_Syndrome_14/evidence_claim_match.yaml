      assertion:
        name: Sporadic (de novo)
        inheritance_term:
          preferred_term: Sporadic
          term:
            id: HP:0003745
            label: Sporadic
        description: 'Long QT presentations of the calmodulin genes are typically sporadic: the variant
          arises de novo, and no other family member is affected. Both founding CALM1 probands carried
          a de novo variant. In the pooled CALM1-3 registry the culprit variant was de novo in 93% of
          genetically screened CALM-LQTS families; in the remaining two it was inherited from a parent
          with germline mosaicism. The 2023 registry update reports a falling de novo proportion (82%
          of pooled index cases) as milder familial cases are found.'
      selected_evidence:
        snippet: We discovered 3 heterozygous de novo mutations in either CALM1 or CALM2, 2 of the 3 human
          genes encoding calmodulin, in the 2 probands and in 2 additional subjects with recurrent cardiac
          arrest.
        supports: SUPPORT
