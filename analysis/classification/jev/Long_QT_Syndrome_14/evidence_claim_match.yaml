            CPVT-like arrhythmia in a large Swedish family; reduces calcium binding. Named as in the original
            report, which numbers residues without the initiator methionine (p.Asn54Ile with it counted).
        - name: p.Asn97Ser
          description: CALM1 c.293A>G de novo missense variant in an individual with CPVT; reduces calcium
            binding and interacts abnormally with the RyR2 calmodulin-binding domain. Named as in the
            original report, which numbers residues without the initiator methionine; with the methionine
            counted, as in the calmodulinopathy registry and in the D130G and F142L names used here, the
            same codon (c.293) is p.Asn98Ser (N98S), the registry's recurrent variant with long QT, CPVT,
            idiopathic ventricular fibrillation and sudden unexplained death phenotypes (counted across
            all three genes).
        - name: p.Asp130Gly
          description: CALM1 missense variant (D130G) at a calcium-chelating aspartate of the fourth EF-hand,
            de novo in the founding LQT14 proband and found in a second infant with recurrent cardiac
            arrest from age 1 month. The same substitution causes childhood LQTS from CALM2 and CALM3,
            and the registry found it only with the long QT phenotype.
        - name: p.Phe142Leu
          description: CALM1 missense variant (F142L) in the fourth EF-hand, found in an adopted boy with
            non-sustained ventricular tachycardia, T-wave alternans, QTc over 600 ms and ventricular fibrillation
            arrest. In his iPSC-derived cardiomyocytes it severely impairs calcium-dependent inactivation
            of the L-type current and prolongs repolarization without affecting IKs; the registry found
            F142L only with the long QT phenotype.
        - name: p.Glu141Gly
          description: CALM1 c.422A>G missense variant (E141G), de novo in a boy with syncope at 3 years,
            cardiac arrest at 4 years, QTc 610 ms and speech and motor delay, found by exome sequencing
            of genetically elusive long QT syndrome. It lowers calcium-binding affinity about 11-fold
            and causes a dominant loss of Cav1.2 inactivation without affecting RyR2-mediated calcium
            release.
