      assertion:
        name: Left Cardiac Sympathetic Denervation
        description: 'Surgical anti-adrenergic escalation, used mainly in high-risk paediatric LQTS patients,
          a group that includes calmodulinopathies. In calmodulinopathy it has not prevented recurrence:
          QTc stayed prolonged after LCSD in the CALM1 D130G founding proband, and arrhythmias recurred
          in all three pooled-registry CALM-LQTS patients followed after denervation. The 2023 registry
          update nonetheless proposes full-dose triple therapy (beta-blocker, sodium channel blocker and
          LCSD) for symptomatic patients, noting that none of its sudden deaths had received it.'
        treatment_term:
          preferred_term: left cardiac sympathetic denervation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        therapeutic_modality: SURGERY
      selected_evidence:
        snippet: Left cardiac sympathetic denervation was performed in 33 (8.9%), mainly high-risk patients,
          and was associated with >80% arrhythmia-free survival without major complications.
        supports: SUPPORT
        directness: INDIRECT
