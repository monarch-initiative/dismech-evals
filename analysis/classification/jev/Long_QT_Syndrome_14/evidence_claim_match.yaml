              in gene_disease_validity. Variant origin is recorded as de novo for the long QT presentation;
              the CPVT-like N53I variant was inherited within a family. In the 2023 registry CALM1 carriers
              had the highest cardiac event rate of the three calmodulin genes (88%, against 70% for CALM2
              and 57% for CALM3), counted over all phenotypes rather than long QT alone.
