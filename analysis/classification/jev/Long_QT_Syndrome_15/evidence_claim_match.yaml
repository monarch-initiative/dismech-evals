      assertion_type: AnimalModel
      assertion:
        name: Calm2 N98S heterozygous knock-in mouse
        species: Mouse
        genotype: Calm2 c.293A>G (p.N98S) heterozygous (Calm2N98S/+)
        background: C57BL/6J
        publication: PMID:37589122
        description: CRISPR/Cas9 knock-in of the recurrent human N98S calmodulin variant into mouse Calm2.
          Heterozygous mice have sinus bradycardia and develop arrhythmias after epinephrine and caffeine,
          but no QTc prolongation at baseline. The Calm2 model is milder than the matching Calm1 model,
          and flecainide did not prevent the induced arrhythmias.
        modeled_mechanisms:
        - target: Bradycardia
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Sinus bradycardia in heterozygous Calm2 N98S mice of both sexes.
          limitations: Mouse heart rate and pacemaker physiology differ from human; the human bradycardia
            is often fetal and accompanied by 2:1 block, which the model does not show.
        - target: Polymorphic Ventricular Tachycardia
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Ventricular arrhythmias, including sustained events in most males, appear only
            after epinephrine and caffeine challenge.
          limitations: Arrhythmias are pharmacologically provoked rather than spontaneous, and fewer male
            Calm2 mice than male Calm1 mice had sustained arrhythmias.
        - target: Prolonged QT Interval
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Baseline QTc is not prolonged; after epinephrine and caffeine, QTc prolongation
            was seen only in male Calm1 N98S mice.
          limitations: The model does not show the QT prolongation that defines LQT15, so it informs the
            adrenergic arrhythmia arm rather than the long QT arm. The human N98S variant itself is reported
            with long QT, CPVT and idiopathic ventricular fibrillation presentations.
      selected_evidence:
        snippet: Calm2 S/+ mice exhibited a less severe phenotype, with female Calm2 S/+ mice having the
          least severe arrhythmia susceptibility.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
