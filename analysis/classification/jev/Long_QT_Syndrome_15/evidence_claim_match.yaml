          adrenergically triggered. Response is variable and often insufficient. In the founding CALM2
          D96V proband esmolol and propranolol restored 1:1 atrioventricular conduction. Four of Makita's
          five CALM2 carriers responded to beta-blockers, but the Q136P carrier died suddenly on therapy.
          The Spanish paediatric registry pools calmodulinopathies with other high-risk genotypes.
        treatment_term:
          preferred_term: beta-blocker therapy
          term:
