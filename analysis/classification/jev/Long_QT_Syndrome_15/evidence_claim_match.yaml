              label: Beta-Adrenergic Antagonist
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: These data support the current genotype and QTc-guided management strategy, with beta-blockers
          as the cornerstone therapy and selective use of left cardiac sympathetic denervation and ICDs
          in high-risk profiles.
        supports: SUPPORT
        directness: INDIRECT
