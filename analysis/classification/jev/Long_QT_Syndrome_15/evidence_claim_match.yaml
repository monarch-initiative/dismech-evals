  b12b479a65e97e995f20fb2e5a14a680ec59e4e80da65e0c30efd767d0b3a33d:
    claim:
      about:
        disease:
          name: Long QT Syndrome 15
          disease_term:
            preferred_term: long QT syndrome 15
            term:
              id: MONDO:0014550
              label: long QT syndrome 15
        context: []
      assertion_type: Genetic
      assertion:
        name: CALM2
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        gene_term:
          preferred_term: CALM2
          term:
            id: hgnc:1445
            label: CALM2
        association: Pathogenic Variants
        notes: CALM2 carries the LQT15 designation. ClinGen classifies CALM2 as Definitive for long QT
          syndrome (assertion against MONDO:0002442) and Moderate for CPVT (assertion against MONDO:0017990);
          neither is against MONDO:0014550, so both are cited as evidence here rather than recorded in
          gene_disease_validity. In the 2023 registry CALM2 carriers had an intermediate cardiac event
          rate (70%, against 88% for CALM1 and 57% for CALM3), counted over all phenotypes.
        variants:
        - name: p.Asp96Val
          description: CALM2 missense variant (D96V) at a calcium-coordinating aspartate of the third
            EF-hand, de novo in a founding calmodulinopathy proband with fetal bradycardia, in-utero 2:1
            block, QTc 690 ms, T-wave alternans and cardiac arrest at three weeks. In guinea-pig ventricular
            myocytes it abolishes calcium-dependent inactivation of the L-type current.
        - name: p.Asp130Gly
          description: CALM2 missense variant (D130G) at a fourth-EF-hand aspartate. Patient-derived iPSC
            cardiomyocytes carrying it show prolonged action potentials and diminished calcium-dependent
            inactivation, rescued by CRISPR interference silencing of the mutant allele. The same substitution
            is a recurrent long-QT variant in CALM1 and CALM3.
        - name: p.Asn98Ser
          description: CALM2 missense variant (N98S) in the third EF-hand, de novo in a Japanese boy with
            long QT. The identical substitution in CALM1 was first reported in CPVT, so the same amino
            acid change gives different phenotypes from different calmodulin genes.
        - name: p.Asn98Ile
          description: CALM2 missense variant (N98I) in the third EF-hand, de novo in an English boy who
            had cardiac arrest at 17 months with bradycardia and QTc 555 ms.
        - name: p.Asp133His
          description: CALM2 missense variant at a calcium-coordinating residue of the fourth EF-hand,
            found in a girl with LQTS, fetal bradycardia, recurrent syncope, QTc 579 ms and multiple cardiac
            arrests. It impairs Cav1.2 calcium-dependent inactivation and reduces Kv7.1 activation. Makita
            et al. call the same substitution in the same patient D134H, counting the initiator methionine
            as residue 1.
        - name: p.Gln136Pro
          description: CALM2 missense variant (Q136P) in the fourth EF-hand, de novo in a girl with mixed
            LQTS and CPVT features who died suddenly during exertion at age 11 despite beta-blocker therapy.
        - name: p.Asp132Glu
          description: De novo CALM2 variant (D132E) in a patient with mixed CPVT and LQTS features; the
            same substitution occurred de novo in CALM3 in a CPVT patient.
      selected_evidence:
        snippet: CALM2 | HGNC:1445 | long QT syndrome | MONDO:0002442 | AD | Definitive
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: CGGV:assertion_86e4b783-3b60-4a1d-ab34-e61d27751ca6-2018-09-25T160000.000Z
      reference_title: CALM2 / long QT syndrome (Definitive)
      evidence_source: OTHER
      explanation: ClinGen classifies the CALM2-long QT syndrome relationship as definitive with autosomal
        dominant inheritance, against the broader long QT syndrome term.
