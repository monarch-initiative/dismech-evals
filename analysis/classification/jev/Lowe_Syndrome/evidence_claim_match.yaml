        description: Proximal tubular phosphate reabsorption fails, so filtered phosphate is lost in the
          urine and serum phosphate falls. This removes the phosphate substrate required for hydroxyapatite
          deposition and is the route by which Lowe syndrome enters the phosphopenic arm of the defective
          skeletal mineralization module, presenting in growing bone as renal rickets.
        biological_scale: ORGANISM
        cell_types:
        - preferred_term: epithelial cell of proximal tubule
          term:
            id: CL:0002306
            label: epithelial cell of proximal tubule
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
        biological_processes:
        - preferred_term: phosphate ion homeostasis
          modifier: DECREASED
          term:
            id: GO:0055062
            label: phosphate ion homeostasis
        notes: 'Arm assignment is phosphopenic, but not purely so. PMID:37508663 reports that Lowe patients
          usually develop rickets through impaired 1-alpha hydroxylase activation with normal 25-hydroxyvitamin
          D3 "in addition to renal hypophosphatemia", which is a calciopenic contribution running alongside
          the phosphate loss. A second node conforming to `defective_skeletal_mineralization#Calciopenic
          Substrate Deficiency` was deliberately not created here: the module requires the two arms to
          be kept separate, and the calciopenic claim currently rests on a single case report whose patient
          also had independent nutritional vitamin D deficiency, which confounds the raised parathyroid
          hormone. Revisit if cohort-level calcitriol data appear.

          Note also the tension between sources on how complete the tubulopathy is. GeneReviews describes
          it as "of the Fanconi type", while the cohort study PMID:18480301 curated on the `Renal tubular
          dysfunction` phenotype found a selective proximal tubulopathy rather than a full Fanconi syndrome.
          The phosphate-wasting branch is common to both descriptions, so the arm assignment does not
          depend on resolving that disagreement.'
      selected_evidence:
        snippet: Affected males have varying degrees of proximal renal tubular dysfunction of the Fanconi
          type, including low molecular-weight (LMW) proteinuria, aminoaciduria, bicarbonate wasting and
          renal tubular acidosis, phosphaturia with hypophosphatemia and renal rickets, hypercalciuria,
          sodium and potassium wasting, and polyuria.
        supports: SUPPORT
