      assertion_type: ProgressionInfo
      assertion:
        phase: Congenital ocular and neurologic onset
        age_range: Birth to early infancy
        notes: Dense congenital cataracts and severe hypotonia are typically present at birth, while proximal
          tubular dysfunction becomes clinically evident during the first weeks to months of life.
      selected_evidence:
        snippet: Bilateral cataract and severe hypotonia are present at birth. In the subsequent weeks
          or months, a proximal renal tubulopathy (Fanconi-type) becomes evident and the ocular picture
          may be complicated by glaucoma and cheloids.
        supports: SUPPORT
