        context: []
      assertion_type: Genetic
      assertion:
        name: RNU4ATAC
        gene_term:
          preferred_term: RNU4ATAC
          term:
            id: hgnc:34016
            label: RNU4ATAC
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Reported Lowry-Wood genotypes are compound heterozygous, for example n.51G>A with n.5A>C,
          n.111G>A with n.46G>A, and n.120T>G with n.114G>C. Several alleles are shared with MOPD I and
          Roifman syndrome, so the allele pair rather than any single variant decides the phenotype. RNU4ATAC
          is a small non-coding gene that standard exome capture may not cover, which is a recognized
          cause of missed diagnoses.
      selected_evidence:
        snippet: This report expands the phenotypic spectrum for biallelic RNU4ATAC disorder causing variants
          and is the first to establish the genetic cause for Lowry Wood syndrome.
        supports: SUPPORT
