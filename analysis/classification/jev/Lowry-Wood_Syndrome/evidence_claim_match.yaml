      assertion_type: Diagnosis
      assertion:
        name: Targeted RNU4ATAC Sequencing
        presence: Biallelic pathogenic variants in affected individuals
        description: Diagnosis is confirmed by finding biallelic pathogenic RNU4ATAC variants in a person
          with suggestive findings. Because exome capture designed around protein-coding exons may miss
          the gene, targeted or Sanger sequencing of RNU4ATAC is recommended when epiphyseal dysplasia
          occurs with microcephaly, intellectual disability, immunodeficiency, or retinal anomalies.
      selected_evidence:
        snippet: Since RNU4ATAC is not consistently targeted in standard exome capture methodologies that
          only target protein-coding exons, many such cases will be missed. Sanger sequencing of this
          locus is needed for a complete assessment.
