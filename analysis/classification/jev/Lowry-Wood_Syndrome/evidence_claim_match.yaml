      assertion_type: Discussion
      assertion:
        discussion_id: lws_rnu4atac_allele_phenotype_determinant
        kind: KNOWLEDGE_GAP
        prompt: What determines whether a biallelic RNU4ATAC genotype produces Lowry-Wood syndrome rather
          than Roifman syndrome or MOPD I, given that some alleles recur in all three?
        rationale: The proposed rule that two severe alleles give MOPD I and a severe plus a mild allele
          give Roifman syndrome did not fit the first molecularly confirmed Lowry-Wood patient, whose
          two variants both lie in regions predicted to matter for splicing. Variant severity alone does
          not explain the phenotype, and modifier genes or tissue-specific splicing thresholds remain
          open possibilities.
        attaches_to:
        - pathophysiology#Biallelic Hypomorphic RNU4ATAC Variants
      selected_evidence:
        snippet: The mechanism through which RNU4ATAC variants cause different clinical phenotypes is
          unclear.
        supports: SUPPORT
