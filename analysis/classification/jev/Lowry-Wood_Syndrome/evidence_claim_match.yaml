        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic RNU4ATAC Variants
        conforms_to: spliceosome_component_dysfunction#Germline Spliceosome Component Variant
        biological_scale: MOLECULAR
        role: trigger
        description: 'RNU4ATAC (2q14.2) is a non-protein-coding gene for U4atac snRNA. Lowry-Wood syndrome
          arises from biallelic variants that impair, but do not abolish, U4atac function. Compared with
          MOPD I, whose variants concentrate in the 5'' stem-loop needed for U4atac/U6atac.U5 tri-snRNP
          formation, the variants reported in Lowry-Wood syndrome are dispersed across the RNA and affect
          less conserved nucleotides, which fits its milder phenotype. The correlation is imperfect: the
          same alleles (for example n.46G>A and n.111G>A) recur across all three named RNU4ATAC phenotypes.'
        genes:
        - preferred_term: RNU4ATAC
          term:
            id: hgnc:34016
            label: RNU4ATAC
        molecular_functions:
        - preferred_term: U4atac base-pairing with U6atac snRNA
          term:
            id: GO:0030624
            label: U6atac snRNA binding
          modifier: DECREASED
      selected_evidence:
        snippet: Here, we describe three patients with Lowry Wood syndrome with biallelic RNU4ATAC pathogenic
          variants.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
