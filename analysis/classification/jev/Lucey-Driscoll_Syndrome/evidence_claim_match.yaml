          term:
            id: hgnc:12530
            label: UGT1A1
        association: Unknown
        relationship_type: UNKNOWN
        features: 'UGT1A1 encodes the enzyme whose activity is inhibited in this disorder, and MONDO and
          OMIM (237900) map the entity to UGT1A1 via a gene-disease link. No germline UGT1A1 variant is
          demonstrated to cause the disease, however: the cited review''s summary table gives the molecular
          defect as placental transfer of a maternal serum inhibitor of UGT1A1 and lists no inheritance
          pattern. The relationship is therefore recorded as UNKNOWN rather than CAUSATIVE, since the
          evidence establishes UGT1A1 only as the inhibited enzyme (already wired into the pathograph
          as the inhibited target) and not as a causal germline locus. Unlike Crigler-Najjar (constitutive
          UGT1A1 loss of function) and Gilbert syndrome (a promoter polymorphism), the mechanism here
          is transient inhibition of UGT1A1 by a maternal serum factor.'
      selected_evidence:
        snippet: In vitro testing demonstrated that sera of affected infants and their mothers contained
          an unidentified inhibitor of UGT1A1 activity.
        supports: SUPPORT
