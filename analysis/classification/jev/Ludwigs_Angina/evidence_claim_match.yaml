      assertion_type: Pathophysiology
      assertion:
        name: Oral Flora Peptidoglycan Cross-Linking (Beta-Lactam Target)
        description: The streptococci and oral anaerobes that drive Ludwig's angina build their peptidoglycan
          cell wall by penicillin-binding protein (PBP) transpeptidase cross-linking. This essential,
          bacteria-specific reaction is the target of the penicillin/beta-lactam component of empiric
          broad-spectrum therapy; culture series show the predominant streptococci remain penicillin-sensitive,
          so acylation of the PBP active site halts cross-linking and is bactericidal.
        role: therapeutic_vulnerability
        conforms_to: bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding
          Proteins
        biological_processes:
        - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
          term:
            id: GO:0009273
            label: peptidoglycan-based cell wall biogenesis
      selected_evidence:
        snippet: although glycan chain polymerization occurs in the absence of transpeptidation (for example,
          in the presence of penicillin), efficient transpeptidation requires ongoing GTase reactions
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22203377
      reference_title: From the regulation of peptidoglycan synthesis to bacterial growth and morphology.
      evidence_source: OTHER
      explanation: Establishes that beta-lactams (penicillin) act by blocking PBP transpeptidation, the
        cross-linking step this node represents. Evidence source is OTHER as this is a review article.
