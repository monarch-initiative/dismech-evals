              id: MONDO:0005138
              label: lung carcinoma
        context: []
      assertion_type: Biochemical
      assertion:
        name: Alveolar Type 2 and Respiratory Epithelial Plasma Proteomic Age Gap
        biomarker_term:
          preferred_term: alveolar type 2 and respiratory epithelial plasma proteomic aging clock (age
            gap)
          term:
            id: NCIT:C97139
            label: Proteomic Profile
        presence: Elevated
        context: Blood-based cell-type-specific aging clock. Plasma proteins are mapped to their putative
          cell of origin using Human Protein Atlas single-cell transcriptomic data, and a machine-learning
          model estimates the biological age of each cell type; the age gap is the difference between
          that estimate and chronological age. "Extreme" agers are those in the upper tail of the age-gap
          distribution.
        cell_types:
        - preferred_term: Alveolar type 2 cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        - preferred_term: Respiratory epithelial cell
          term:
            id: CL:0002368
            label: respiratory tract epithelial cell
        notes: 'The two signatures are strongest when concurrent (HR 8.39 for alveolar type 2 and 8.47
          for the respiratory epithelial lineage over 15 years of UK Biobank follow-up). Their practical
          claim is incremental value over smoking, the dominant established risk factor: current smokers
          with extreme aging in both compartments carried HR 15.33 versus HR 9.69 for current smoking
          alone, and the signatures stayed prognostic after adjustment for age, sex, smoking status and
          estimated pack-years. Alveolar type 2 extreme aging was also the most stable state measured,
          with 81% retention over a 10-year window, which matters for a marker proposed for surveillance
          rather than one-off testing.'
        readouts:
        - target: Oncogenic Driver Mutations in NSCLC
          relationship: PREDICTS
          direction: POSITIVE
          endpoint_context: PROGNOSTIC
          interpretation: An elevated alveolar type 2 age gap predicts incident lung cancer years before
            diagnosis. The link to the transformation node rests on alveolar type 2 cells being the cell
            of origin for lung adenocarcinoma, so an aged alveolar stem-cell compartment is a plausible
            substrate for driver-mutation acquisition - but the study measures a plasma protein signature,
            and does not show that the age gap predicts any specific driver lesion.
      selected_evidence:
        snippet: alveolar type 2 cell and respiratory epithelial lineage aging signatures retained independent
          prognostic value for incident lung cancer after adjustment for age, sex, smoking status and
          estimated pack-years
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42297981
      reference_title: Plasma proteomic signatures of cellular aging predict human disease.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Addresses the obvious confounder: the signal is not simply a proxy for cumulative
        tobacco exposure.'
