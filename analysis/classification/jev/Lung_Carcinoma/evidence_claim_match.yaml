      assertion:
        name: Bronchial Squamous Dysplasia (Premalignant Field)
        cell_types:
        - preferred_term: bronchial epithelial cell
          term:
            id: CL:0002328
            label: bronchial epithelial cell
        biological_scale: TISSUE
        description: Chronic tobacco-carcinogen exposure produces a field of bronchial squamous metaplasia
          and dysplasia — the endobronchial precursor lesions of invasive squamous cell lung carcinoma.
          Reduced airway prostacyclin (PGI2) signaling characterizes this premalignant epithelium, and
          its pharmacologic restoration can reverse dysplasia, providing the rationale for prostacyclin-analogue
          interception before invasive transformation.
      selected_evidence:
        snippet: We carried out a multicenter double-blind, randomized, phase II placebo-controlled trial
          of oral iloprost in current or former smokers with sputum cytologic atypia or endobronchial
          dysplasia.
        supports: SUPPORT
