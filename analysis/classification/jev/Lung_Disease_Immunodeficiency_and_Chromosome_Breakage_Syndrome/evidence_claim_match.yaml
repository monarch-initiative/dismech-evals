  7f7a0fbf532573a715a130f3d3774781990db480de8e6fb5ea5e037011968074:
    claim:
      about:
        disease:
          name: Lung Disease, Immunodeficiency, and Chromosome Breakage Syndrome
          disease_term:
            preferred_term: lung disease, immunodeficiency, and chromosome breakage syndrome
            term:
              id: MONDO:0014984
              label: lung disease, immunodeficiency, and chromosome breakage syndrome;
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NSMCE3 Missense Protein Destabilization
        biological_scale: MOLECULAR
        description: The patient missense variants sit in the C-terminal winged-helix B domain (p.Pro209Leu)
          and its extension (p.Leu264Phe) of NSMCE3. Both abolish binding to NSMCE4, and p.Pro209Leu also
          strongly reduces binding to NSMCE1 and makes the recombinant protein prone to C-terminal truncation.
          Endogenous NSMCE3 falls below the detection limit in patient fibroblasts; because loss of other
          SMC5/6 subunits is embryonic lethal in mice, the authors infer that some NSMCE3 persists at
          low level.
        genetic_context:
          gene:
            preferred_term: NSMCE3
            term:
              id: hgnc:7677
              label: NSMCE3
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Biallelic missense variants, homozygous p.Leu264Phe or compound heterozygous p.Leu264Phe/p.Pro209Leu.
            Partial rather than complete loss of function is the authors' inference from the embryonic
            lethality of SMC6 and NSMCE2 loss in mice; residual NSMCE3 was not directly measured.
        molecular_functions:
        - preferred_term: double-stranded DNA binding by the NSE1/NSE3/NSE4 module
          modifier: DECREASED
          term:
            id: GO:0003690
            label: double-stranded DNA binding
          description: NSE3 binds double-stranded DNA through its C-terminal winged-helix B domain, the
            domain carrying both patient variants, and this binding is needed to load SMC5/6 onto chromatin
            in fission yeast. Reduced DNA binding by the patient alleles is inferred from their location
            and from the loss of the module, not measured directly.
        genes:
        - preferred_term: NSMCE3
          term:
            id: hgnc:7677
            label: NSMCE3
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: The Leu264Phe mutation of the affected individuals A-D abolished binding of NSMCE3 to
          NSMCE4, while its interaction with NSMCE1 was only mildly affected.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
