        description: The founding report linked the lung disease to viral pneumonia in infants with a
          combined T and B cell defect. This motivated a trial of haematopoietic stem cell transplantation,
          which did not prevent fatal lung disease. Five later patients developed the same course without
          infection and with normal immune evaluations, so the immune defect is at most a contributing
          factor in some patients.
      selected_evidence:
        snippet: This disorder, designated LICS, which expands the spectrum of chromosomal breakage syndromes,
          is associated with progressive, severe PARDS following viral pneumonia, resulting in death in
          early childhood of the affected individuals described here.
