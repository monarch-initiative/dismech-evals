      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: intrinsic_systemic_lung_disease
        hypothesis_label: SMC5/6 destabilization causes lung injury independently of the immune defect
        status: EMERGING
        description: The later series reframed LICS as a childhood interstitial lung disease of undefined
          etiology driven by the systemic SMC5/6 defect rather than by immunodeficiency. Candidate routes
          named in the literature, none tested in lung tissue, include a specific consequence of losing
          the NSMCE3-NSMCE4 interface, and loss of the SMC5/6 complex's role in silencing transcription
          from viral circular DNA genomes, which could permit exaggerated viral or inflammatory responses.
      selected_evidence:
        snippet: Data on the function of the SMC5/6 complex suggests it plays a role in prevention of
          transcription from viral circular DNA genomes and that it thereby has a suppressive role in
          the development of viral infections and inflammatory processes
        supports: SUPPORT
    origin:
