      assertion_type: Discussion
      assertion:
        discussion_id: lics_lung_injury_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does SMC5/6 destabilization cause diffuse alveolar damage in infancy, and what part,
          if any, does the variable combined immunodeficiency play?
        attaches_to:
        - pathophysiology#Progressive Diffuse Alveolar Damage and Interstitial Lung Injury
        - mechanistic_hypotheses#immunodeficiency_triggered_lung_injury
        - mechanistic_hypotheses#intrinsic_systemic_lung_disease
        rationale: The founding report linked the lung disease to viral pneumonia in immunodeficient infants,
          but five later patients died of the same lung disease with normal immune studies and no infection,
          and stem cell transplantation did not prevent it. None of the cited studies examined which lung
          cell type is affected, whether alveolar epithelial cells accumulate DNA damage, or whether loss
          of SMC5/6 restriction of viral episomes contributes.
      selected_evidence:
        snippet: Although it is known that NSMCE3 is part of the SMC5-SMC6 complex involved in DNA repair,
          the exact pathophysiology of LICS has not yet been elucidated.
        supports: SUPPORT
