        description: 'Untargeted and targeted high-resolution mass-spectrometry lipidomics of the Lyme
          disease spirochete Borrelia burgdorferi, profiling more than 500 membrane and storage lipids
          and tracing their host/environmental origin versus residual de novo biosynthesis. Identifies
          discriminatory lipid uptake, cholesteryl ester and triglyceride accumulation in intracellular
          foci, and biosynthesis of eukaryotic-type lipids (bis(monoacylglycerol)phosphate and sulfoquinovosyl
          diacylglycerol), nominating lipid acquisition and synthesis pathways as survival-critical antimicrobial
          targets.

          '
        organism:
