      assertion_type: Pathophysiology
      assertion:
        name: Tick Saliva-Assisted Immune Evasion via Salp15-OspC
        description: 'During transmission, Borrelia burgdorferi co-opts components of Ixodes tick saliva
          to establish infection at the bite site. The spirochete selectively enhances tick expression
          of the 15-kDa salivary protein Salp15, which binds the spirochetal surface lipoprotein OspC
          and coats the organism. Salp15 (and its I. ricinus homologue Iric1) shields Borrelia from antibody-mediated
          killing and complement, giving the spirochete a marked infectivity advantage in the mammalian
          host; the bacterium thereby exploits a secreted arthropod protein to colonize the vertebrate
          dermis.

          '
        biological_processes:
        - preferred_term: Salp15-mediated protection from antibody-mediated killing
          term:
            id: GO:0042783
            label: symbiont-mediated evasion of host immune response
          modifier: INCREASED
        locations:
        - preferred_term: skin
          term:
            id: UBERON:0002097
            label: skin of body
      selected_evidence:
        snippet: Salp15 was then shown to adhere to the spirochaete, both in vitro and in vivo, and specifically
          interacted with B. burgdorferi outer surface protein C. The binding of Salp15 protected B. burgdorferi
          from antibody-mediated killing in vitro and provided spirochaetes with a marked advantage when
          they were inoculated into naive mice
        supports: SUPPORT
