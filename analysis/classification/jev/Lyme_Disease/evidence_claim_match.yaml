      assertion_type: Pathophysiology
      assertion:
        name: Borrelial Peptidoglycan Cross-Linking (Beta-Lactam Target)
        description: Borrelia burgdorferi maintains its peptidoglycan cell wall by penicillin-binding
          protein (PBP) transpeptidase cross-linking. This essential, bacteria-specific reaction is the
          target of the amoxicillin and ceftriaxone used to treat Lyme disease; beta-lactam acylation
          of the PBP active site halts cross-linking and is bactericidal against disseminating spirochetes.
          CNS penetration of ceftriaxone is what extends this mechanism to neuroborreliosis.
        role: therapeutic_vulnerability
        conforms_to: bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding
          Proteins
        biological_processes:
        - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
          term:
            id: GO:0009273
            label: peptidoglycan-based cell wall biogenesis
      selected_evidence:
        snippet: although glycan chain polymerization occurs in the absence of transpeptidation (for example,
          in the presence of penicillin), efficient transpeptidation requires ongoing GTase reactions
        supports: SUPPORT
