  bbb9ce9dbf6616e19a6850e6cd481186199fee9adc209800c0c831a7498edf34:
    claim:
      about:
        disease:
          name: Lyme Disease
          disease_term:
            preferred_term: Lyme disease
            term:
              id: MONDO:0019632
              label: Lyme disease
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serologic testing
        description: 'Diagnosis rests primarily on clinical evaluation, with serology reserved for suspected
          disseminated disease; testing is not indicated in early localized erythema migrans, where sensitivity
          is low and clinical diagnosis is reliable. In the United States serology follows a two-test
          algorithm: a sensitive first-tier enzyme immunoassay (EIA) or immunofluorescence assay for antibody
          to Borrelia burgdorferi, followed, for specimens that are positive or equivocal, by a second
          tier that detects IgM and IgG antibody separately. The standard second tier is an IgM and IgG
          western immunoblot; the modified two-tier algorithm substitutes a second EIA, which CDC accepts
          for assays FDA has cleared for that use.'
        diagnosis_term:
          preferred_term: serology testing
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        measurements:
        - preferred_term: Borrelia burgdorferi antibody (first-tier EIA or IFA)
          term:
            id: LOINC:11006-4
            label: Borrelia burgdorferi Ab [Presence] in Serum
        - preferred_term: Borrelia burgdorferi IgM antibody (second tier)
          term:
            id: LOINC:22135-8
            label: Borrelia burgdorferi IgM Ab [Presence] in Serum
        - preferred_term: Borrelia burgdorferi IgG antibody (second tier)
          term:
            id: LOINC:22128-3
            label: Borrelia burgdorferi IgG Ab [Presence] in Serum
        results: Two-tiered serologic result supporting suspected disseminated Lyme borreliosis.
        notes: 'Each tier is bound to the method-less qualitative serum code, because LOINC splits the
          same antibody by method and the algorithm allows more than one method at each tier. The method-specific
          second-tier codes (LOINC:6321-4 Borrelia burgdorferi IgM Ab [Presence] in Serum by Immunoblot
          and LOINC:6320-6 Borrelia burgdorferi IgG Ab [Presence] in Serum by Immunoblot) would name only
          the standard immunoblot second tier and exclude the modified EIA-EIA algorithm. No reference_ranges
          are recorded: the cited CDC recommendation defines the sequence of tests, not a numeric threshold,
          and the positivity cut-off of each EIA is set by its manufacturer.'
      selected_evidence:
        snippet: Serology is recommended only in suspected disseminated LB, characterized by compatible
          clinical signs and history of tick exposure.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41314468
      reference_title: 'Guidelines for Lyme borreliosis: Diagnostic strategies.'
      evidence_source: OTHER
      explanation: The Lyme borreliosis diagnostic-strategy guideline restricts serologic testing to suspected
        disseminated disease with compatible clinical signs and tick exposure.
