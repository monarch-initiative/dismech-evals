            term:
              id: MONDO:0019632
              label: Lyme disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tick-Borne Transmission and Enzootic Cycle
        description: 'Borrelia burgdorferi is maintained in an enzootic cycle between Ixodes ticks and
          small-mammal reservoirs such as the white-footed mouse; larval ticks acquire spirochetes by
          feeding on infected reservoirs and transmit them transstadially to the nymphal stage that bites
          humans. In the unfed tick midgut the spirochete expresses OspA (midgut adhesion) but not OspC.
          During the blood meal, host- and temperature-derived signals trigger a reciprocal antigenic
          switch in which OspA is downregulated and OspC is upregulated, accompanying spirochete migration
          from the midgut to the salivary glands and transmission into the vertebrate dermis; OspC expression
          peaks around 48 h of tick attachment and is required for early mammalian infectivity.

          '
        biological_processes:
        - preferred_term: OspA/OspC antigenic switch
          term:
            id: GO:0010468
            label: regulation of gene expression
        - preferred_term: response to temperature stimulus
          term:
            id: GO:0009266
            label: response to temperature stimulus
      selected_evidence:
        snippet: we integrate this large body of information into a cohesive picture of the molecular
          and cellular events that transpire as Lyme disease spirochaetes transit between their arthropod
          and vertebrate hosts during the enzootic cycle.
        supports: SUPPORT
