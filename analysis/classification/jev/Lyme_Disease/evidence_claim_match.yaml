        description: Borrelia burgdorferi depends on 70S-ribosome translation. Doxycycline, the first-line
          agent for early localized and early disseminated Lyme disease, binds the 30S subunit and arrests
          bacterial protein synthesis — a ribosomal target distinct from the PBP target of the beta-lactam
          alternatives.
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        biological_processes:
