      assertion:
        name: B. malayi
        display_name: Brugian filariasis due to Brugia malayi
        classification: etiologic_species
        geography:
        - Southeast Asia
        - South Asia
        description: Caused by Brugia malayi. It differs from the bancroftian stratum on presentation,
          in that adenolymphangitis is inguinal and elephantiasis is largely confined to the leg below
          the knee while genital lymphatics are spared, and on transmission, in that it is a rural infection
          carried by Mansonia as well as Anopheles and Aedes mosquitoes. It differs from both other strata
          in having a subperiodic form with a non-human reservoir, which is why transmission can be reduced
          but not eliminated where that form circulates.
      selected_evidence:
        snippet: In brugian filariasis, adenolymphangitis is most commonly observed at the inguinal region,
          and elephantiasis predominantly involves the leg below the knee.
        supports: SUPPORT
