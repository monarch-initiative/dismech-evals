      assertion:
        name: Bancroftian
        display_name: Bancroftian filariasis (Wuchereria bancrofti)
        classification: etiologic_species
        geography:
        - Sub-Saharan Africa
        - South Asia
        - Southeast Asia
        - Pacific Islands
        description: Caused by Wuchereria bancrofti, which accounts for the large majority of lymphatic
          filariasis worldwide. It is the stratum in which the lymphatics of the male genitalia are characteristically
          involved, so hydrocele and epididymo-orchitis are bancroftian rather than brugian features.
          It is also the only one of the three agents with an urban transmission cycle, in which Culex
          quinquefasciatus breeding in poorly drained urban water is the principal vector, while rural
          strains are carried primarily by Anopheles and Aedes species.
      selected_evidence:
        snippet: In bancroftian filariasis, the lymphatics of the male genitalia are frequently affected,
          leading to epididymo-orchitis and hydrocele.
        supports: SUPPORT
