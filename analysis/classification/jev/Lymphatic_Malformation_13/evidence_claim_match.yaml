    evidence_metadata:
      reference: PMID:26822228
      reference_title: THSD1 preserves vascular integrity and protects against intraplaque haemorrhaging
        in ApoE-/- mice.
      evidence_source: MODEL_ORGANISM
      explanation: In vivo loss of Thsd1 compromises endothelial barrier integrity (hemorrhage) without
        blocking vessel growth, consistent with an adhesion/barrier defect.
