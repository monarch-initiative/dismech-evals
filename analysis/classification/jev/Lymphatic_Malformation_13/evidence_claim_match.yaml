        biological_scale: TISSUE
        description: Impaired endothelial adhesion and barrier function in the lymphatic endothelium yields
          malformed, incompetent and leaky lymphatic vessels. In an affected child, lymphoscintigraphy
          and MR lymphangiography showed abnormal lymphatic flow with dermal backflow, abdominal and pedal
          lymphatic leakage, and narrowing of the thoracoabdominal thoracic duct. The lymphatic-endothelial-specific
          mechanism of THSD1 has not been directly demonstrated; it is inferred from the general endothelial
          barrier role and from the human lymphatic phenotype.
        cell_types:
