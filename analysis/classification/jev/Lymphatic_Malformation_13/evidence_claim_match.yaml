        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Endothelial Focal Adhesion and Barrier Integrity
        biological_scale: CELLULAR
        description: THSD1 maintains the endothelial barrier by activating FAK-PI3K signaling that drives
          Rac1-mediated actin cytoskeletal regulation of adherens junctions and focal adhesion assembly,
          and by suppressing autophagy-mediated turnover of adhesions. Loss of THSD1 destabilizes endothelial
          cell attachment and barrier integrity. The mechanism was defined in blood-vascular endothelium
          — Thsd1 knockdown causes severe hemorrhage in zebrafish embryos and the mouse retina, and the
          FAK-PI3K/Rac1 axis was shown in cultured human endothelial cells — and is extrapolated to the
          lymphatic endothelium whose failure produces the human phenotype.
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: focal adhesion assembly
          modifier: DECREASED
          term:
            id: GO:0048041
            label: focal adhesion assembly
        - preferred_term: establishment of endothelial barrier
          modifier: DECREASED
          term:
            id: GO:0061028
            label: establishment of endothelial barrier
      selected_evidence:
        snippet: Functional knockdown of Thsd1 in zebrafish embryos and in a murine retina vascularization
          model induced severe haemorrhaging without affecting neovascular growth.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
