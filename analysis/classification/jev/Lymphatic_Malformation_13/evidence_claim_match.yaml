        description: LMPHM13 is inherited in an autosomal recessive manner. Affected individuals carry
          biallelic (homozygous or compound heterozygous) loss-of-function THSD1 variants that co-segregate
          with disease in consanguineous families; a founder THSD1 mutation accounted for recurrent non-immune
          hydrops fetalis and embryonic lethality across several such families. This recessive lymphatic
          entity is distinct from the autosomal dominant THSD1-related intracranial aneurysm phenotype.
