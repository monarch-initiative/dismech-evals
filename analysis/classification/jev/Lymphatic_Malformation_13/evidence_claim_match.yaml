      assertion:
        name: THSD1 Loss of Function
        biological_scale: MOLECULAR
        description: THSD1 encodes a transmembrane cell-surface protein bearing a thrombospondin type
          1 domain, originally identified as a marker of hematopoietic and endothelial cells. Biallelic
          truncating (frameshift/nonsense) variants remove structural and functional domains and abolish
          THSD1 function. The recurrent human allele is a homozygous eight-nucleotide deletion (p.Arg388Glnfs*66)
          that produces a severely truncated protein.
        genes:
        - preferred_term: THSD1
          term:
            id: hgnc:17754
            label: THSD1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Molecular testing identified a homozygous eight nucleotide deletion in THSD1 gene (NM_199263:c.1163_1170delGGCCAGCC,
          p.Arg388Glnfs*66) as the underlying cause of this phenotype in the affected children.
        supports: SUPPORT
