        description: EBV-positive diffuse large B-cell lymphoma and the post-transplant lymphoproliferative
          disorders share EBV positivity and large atypical B cells. The separating features are the angiocentric
          architecture, the obligatory pulmonary involvement, and the absence of nodal and bone marrow
          disease.
        distinguishing_features:
        - Angiocentric and angiodestructive architecture with a reactive T-cell-rich background
        - Lung involvement in essentially every patient
        - Nodal or bone marrow involvement argues for an alternative diagnosis
      selected_evidence:
        snippet: Clinically, LYG universally involves the lungs with other common extranodal sites, including
          skin, central nervous system, liver, and kidneys. Nodal and/or bone marrow involvement is extremely
          rare and, if present, suggests an alternative diagnosis.
