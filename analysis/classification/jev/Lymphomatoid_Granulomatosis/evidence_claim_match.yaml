      assertion:
        name: Ineffective Angiocentric Reactive T-cell Response
        biological_scale: TISSUE
        description: A dense reactive T-cell infiltrate, CD4-predominant rather than CD8, gathers around
          and invades vessel walls without clearing the EBV-positive B cells. The interferon-inducible
          chemokines CXCL9 and CXCL10 localise to reactive cells in viable tissue at the edge of necrotic
          areas rather than to the malignant cells, which is the basis for attributing the vascular damage
          to the host response rather than to the tumour. The vascular injury is angiocentric and angiodestructive
          but is not a primary vasculitis - the vessel wall is damaged by lymphocytic invasion, not by
          an immune-mediated attack on the wall itself.
        cell_types:
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: chemokine-mediated signaling pathway
          modifier: INCREASED
          term:
            id: GO:0070098
            label: chemokine-mediated signaling pathway
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        locations:
        - preferred_term: blood vessel
          term:
            id: UBERON:0001981
            label: blood vessel
      selected_evidence:
        snippet: 14CXCL9 and CXCL10 localize to the reactive cells in the viable tissue surrounding areas
          of necrosis, suggesting that cells in the tumor microenvironment and not the malignant cells
          themselves are the principal source of chemokines, resulting in vascular damage and necrosis.14Thus
        supports: SUPPORT
