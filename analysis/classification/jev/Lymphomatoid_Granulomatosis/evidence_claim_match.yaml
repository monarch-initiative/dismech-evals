        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lyg_no_model_system
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do humanized-mouse models of EBV lymphoproliferation actually model lymphomatoid granulomatosis,
          or only the generic EBV-plus-immunosuppression axis?
        attaches_to:
        - pathophysiology#Ineffective Angiocentric Reactive T-cell Response
        rationale: No animal or in vitro model of this disease exists. Humanized mice reconstituted with
          human haematopoietic cells develop EBV-associated B-cell lymphoproliferation, and immunosuppression
          increases its frequency, so they model the upstream axis. They do not reproduce what actually
          defines the disease - the angiocentric and angiodestructive architecture, the lung-skin-CNS
          distribution, or the CD4-predominant reactive microenvironment. The entry therefore records
          no animal_models, and the tissue-level node has no experimental system behind it. This is flagged
          as a model mismatch rather than a plain knowledge gap because evidence exists in a model system
          whose fidelity to the human tissue phenotype is the open question.
      selected_evidence:
        snippet: Thus, many aspects of human EBV infection, including associated diseases (e.g., lymphoproliferative
          disease, hemophagocytic lymphohistiocytosis and erosive arthritis resembling RA), latent infection,
          and T-cell-mediated and humoral immune responses have been successfully reproduced in humanized
          mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25436886
      reference_title: Humanized mouse models of epstein-barr virus infection and associated diseases.
