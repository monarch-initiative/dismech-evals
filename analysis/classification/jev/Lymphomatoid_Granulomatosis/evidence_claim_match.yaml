              label: lymphomatoid granulomatosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Clonal Selection and High-Grade Transformation
        biological_scale: CELLULAR
        description: With continued proliferation under a persistent surveillance defect, the EBV-infected
          B-cell population shifts from polyclonal to monoclonal. Immunoglobulin gene rearrangement is
          clonal in 8% of grade 1, 50% of grade 2 and 69% of grade 3 lesions - a monotonic gradient that
          is the molecular reading of the grading system. At grade 3 the lesion is no longer separable
          from an EBV-positive large B-cell lymphoma, which is why the treatment strategy switches from
          restoring immunity to killing the clone. No recurrent chromosomal abnormality has been found,
          so this transformation is not anchored to a known cytogenetic driver.
        cell_types:
        - preferred_term: EBV-positive atypical B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: Immunoglobulin gene rearrangement studies were performed, and a higher percentage of
          clonal rearrangements were seen in LYG grade 2 (50%) and grade 3 (69%) as compared with grade
          1 (8%).
        supports: SUPPORT
