      assertion_type: Pathophysiology
      assertion:
        name: Defective EBV Immunosurveillance
        biological_scale: ORGANISM
        conforms_to: viral_oncogenesis#Persistent Oncogenic Virus Infection
        description: Latent EBV, carried by most of the adult population, escapes control in a host whose
          cell-mediated surveillance of EBV-infected B cells is quantitatively or qualitatively impaired.
          Every patient treated at the reporting national centre had moderately to severely reduced circulating
          CD3-positive T cells with the deficit falling more heavily on the CD8-positive compartment,
          and none had a recognised primary immunodeficiency - so the defect is inferred to be pre-existing
          and subtle rather than syndromic. Recognised syndromic and iatrogenic causes of the same defect
          exist and predispose to the disease.
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
