      assertion_type: ProgressionInfo
      assertion:
        phase: Grade transformation in both directions
        notes: Grade is not a fixed property of a patient. Low-grade disease can progress to high-grade
          disease after immune modulation, and high-grade disease can recur as low-grade disease after
          immunochemotherapy. Both directions are managed by crossing over to the other arm of therapy,
          which is a direct clinical consequence of the shared underlying defect in EBV surveillance.
      selected_evidence:
        snippet: Given the underlying defective immune surveillance of EBV, patients with high-grade disease
          may have a recurrence in the form of low-grade disease after immunochemotherapy, and those with
          low-grade disease may progress to high-grade disease after immune modulation, which can be effectively
          managed with crossover treatment.
        supports: SUPPORT
