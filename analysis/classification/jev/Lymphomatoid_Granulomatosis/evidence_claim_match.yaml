            label: viral latency
        - preferred_term: T cell mediated immunity
          modifier: DECREASED
          term:
            id: GO:0002456
            label: T cell mediated immunity
      selected_evidence:
        snippet: More recently, it has been hypothesized that patients with LYG have defective immune
          surveillance of EBV-infected B cells particularly by the CD8-positive T cells
        supports: SUPPORT
