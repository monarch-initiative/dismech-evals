              id: MONDO:0019466
              label: lymphomatoid granulomatosis
        context: []
      assertion_type: Subtype
      assertion:
        name: Grade 1
        display_name: Grade 1 (low grade)
        description: Polymorphous infiltrate with rare atypical medium-to-large lymphoid cells and a paucity
          of EBV-positive cells, fewer than five per high-power field. Necrosis is focal or absent and
          the infiltrate is usually polyclonal - only about 8% of grade 1 lesions carry a clonal immunoglobulin
          rearrangement. This is the grade treated as immune-dependent, and the grade hardest to diagnose
          because the EBV-positive cells can be sparse or absent.
        subtype_term:
          preferred_term: grade I lymphomatoid granulomatosis
          term:
            id: MONDO:0859747
            label: grade I lymphomatoid granulomatosis
      selected_evidence:
        snippet: Immunoglobulin gene rearrangement studies were performed, and a higher percentage of
          clonal rearrangements were seen in LYG grade 2 (50%) and grade 3 (69%) as compared with grade
          1 (8%).
        supports: SUPPORT
