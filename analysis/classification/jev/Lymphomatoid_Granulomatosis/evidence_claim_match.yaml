        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the specific immune defect that permits lymphomatoid granulomatosis in patients
          with no recognised primary immunodeficiency?
        attaches_to:
        - pathophysiology#Defective EBV Immunosurveillance
        rationale: 'The upstream node of this entry is a defect that has been measured only as an aggregate:
          reduced circulating T cells, falling more on the CD8 compartment, in patients who have no diagnosed
          immunodeficiency syndrome. It is inferred to be pre-existing and is described by its own authors
          as hypothesised. No causal gene, no functional assay and no biomarker identifies it in an individual
          patient, so the entry has a trigger node it cannot yet characterise molecularly.'
      selected_evidence:
        snippet: 10Taken together, these results suggest that the immunologic deficits are likely preexistent
          and that a quantitative and/or qualitative defect in mainly CD8+cytotoxic T cells may be a prerequisite
          for disease.
        supports: SUPPORT
