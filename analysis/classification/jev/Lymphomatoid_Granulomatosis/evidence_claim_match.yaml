        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lyg_grading_reproducibility
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How should treatment be allocated when the grading that selects the treatment arm is not
          reproducible between observers?
        attaches_to:
        - histopathology#Grade assignment by EBER-positive B-cell density
        - treatments#
        rationale: Grade decides whether a patient receives interferon alfa-2b or chemoimmunotherapy,
          and the toxicity difference between those arms is large - serious adverse events in 25% against
          64%. The pathologists who defined the grading system record in the same paper that it is inconsistent
          and poorly reproducible between observers, with grade 1 the hardest because the EBV-positive
          cells can be sparse or absent. No reproducibility study, quantitative EBER threshold or adjunct
          molecular assay has been published to close the gap.
      selected_evidence:
        snippet: However, in practice, the grading can be inconsistent and poorly reproducible among observers.
        supports: SUPPORT
