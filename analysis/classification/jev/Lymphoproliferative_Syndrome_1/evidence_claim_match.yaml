      assertion_type: Discussion
      assertion:
        discussion_id: murine_ebv_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does any available animal model reproduce the EBV-driven lymphoproliferation that defines
          human ITK deficiency?
        attaches_to:
        - pathophysiology#Impaired T-Cell Control of EBV
        rationale: Itk-/- mice recapitulate the iNKT-cell deficiency, CD4 lymphopenia and the TCR calcium/IFN-gamma
          signalling defects, but EBV does not infect mice. In preliminary MHV-68 (the closest murine
          EBV surrogate) experiments the authors saw no difference in lung or splenic viral load between
          Itk-/- and wild-type mice, so the central human phenotype — failure to control the gammaherpesvirus
          — is not demonstrated in the mouse.
      selected_evidence:
        snippet: There was no difference in the lytic viral tire in lungs between B6 and itk−/− infected
          mice; furthermore, there was no difference in the splenic genomic viral load between B6 and
          itk−/− mice at day 17.
        supports: SUPPORT
