        kind: OPEN_QUESTION
        status: OPEN
        prompt: Do lymphoma, hypogammaglobulinemia and immune dysregulation in ITK deficiency require
          EBV infection, or can they arise independently of it?
        attaches_to:
        - pathophysiology#Impaired T-Cell Control of EBV
        rationale: No symptomatic EBV-seronegative lymphoproliferation patient had been reported, suggesting
          EBV is necessary for the lymphoproliferative arm. Yet an EBV-naive patient had combined immunodeficiency
          with CD4 lymphopenia and absent iNKT cells as the predominant manifestation, and other EBV-naive
          patients developed severe tuberculosis, showing that some phenotypes are EBV-independent. Whether
          the malignant and antibody phenotypes can occur without EBV is unsettled.
      selected_evidence:
        snippet: we here had the unique opportunity to dissect EBV-dependent and EBV-independent ITK deficiency
          phenotypes.
        supports: SUPPORT
