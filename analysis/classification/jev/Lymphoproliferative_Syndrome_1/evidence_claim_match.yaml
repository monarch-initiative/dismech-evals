        context: []
      assertion_type: AnimalModel
      assertion:
        name: Itk-knockout mouse (Itk-/-)
        species: Mus musculus
        genotype: Itk null
        description: Itk-/- mice reproduce several features of human ITK deficiency — reduced, immature
          and dysfunctional NKT cells, decreased thymic and peripheral CD4 T cells, and impaired TCR-induced
          calcium release and effector cytokine production — but they do not model EBV, which does not
          infect mice.
        modeled_mechanisms:
        - target: Invariant NKT Cell Deficiency
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The knockout reproduces the reduced and immature NKT-cell compartment seen in patients.
          limitations: Residual NKT cells differ in degree from the near-complete human iNKT absence,
            and the mouse does not capture the EBV context in which the human deficit is observed.
        - target: Defective TCR-Induced Calcium Mobilization
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Itk-/- T cells show reduced TCR-induced calcium release, the defect rescued by
            wild-type ITK.
          limitations: Mouse T cells retain more residual TCR signalling than some human alleles, and
            RLK (TXK) partially compensates in mice.
      selected_evidence:
        snippet: Itk-/- mice have reduced numbers of NKT cells with a predominantly immature phenotype.
        supports: SUPPORT
