        description: Germline biallelic ITK variants abolish or destabilize the IL-2-inducible T-cell
          kinase, a Tec-family non-receptor tyrosine kinase expressed in T cells, NK cells, invariant
          NKT cells and mast cells. The index R335W allele is predicted to destabilize the SH2 domain
          and the mutant protein is nearly undetectable when expressed; other alleles truncate the protein
          or shorten its half-life.
