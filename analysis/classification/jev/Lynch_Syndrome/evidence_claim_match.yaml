  4ee994330a47ddb114c5f9ed814979bf9a734ce986b173a06598456e9da296db:
    claim:
      about:
        disease:
          name: Lynch Syndrome
          disease_term:
            preferred_term: Lynch syndrome
            term:
              id: MONDO:0005835
              label: Lynch syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: EPCAM Deletion
        subtype_term:
          preferred_term: Lynch syndrome 8
          term:
            id: MONDO:0013196
            label: Lynch syndrome 8
        description: Not a fifth mismatch repair gene. The lesion is a monoallelic deletion of the 3'
          end of EPCAM, which sits upstream of MSH2; none of the cited work attributes the disease to
          loss of EPCAM's own function. Deletion of EPCAM's polyadenylation signal causes transcriptional
          read-through and hypermethylation of the MSH2 promoter 15 kb downstream, so MSH2 is epigenetically
          silenced. Mismatch repair then fails by the same route as in MSH2-mutant Lynch syndrome, but
          the inactivation is reported specifically in cell lineages that express EPCAM.
        genes:
        - preferred_term: EPCAM
          term:
            id: hgnc:11529
            label: EPCAM
      selected_evidence:
        snippet: Germline mutations of 4 MMR genes, e.g., MLH1, MSH2, MSH6 and PMS2, had been identified
          as the cause of this disease, however, a novel mechanism, epigenetic inactivation of MSH2 gene
          due to hypermethylation of promotor region by the deletion of 3'part of epithelial cell adhesion
          molecule(EPCAM) gene which is located upstream of the MSH2 gene, has been reported in recent
          years.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/4
      evidence_path: /has_subtypes/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23411950
      reference_title: '[A novel genetic disorder of Lynch syndrome - EPCAM gene deletion].'
