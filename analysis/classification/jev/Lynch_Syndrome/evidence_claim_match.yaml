        snippet: 'Lynch syndrome represents 1-7% of all cases of colorectal cancer and is an autosomal-dominant
          inherited cancer predisposition syndrome caused by germline mutations in deoxyribonucleic acid
          (DNA) mismatch repair genes. Since the discovery of the major human genes with DNA mismatch
          repair function, mutations in five of them have been correlated with susceptibility to Lynch
          syndrome: mutS homolog 2 (MSH2); mutL homolog 1 (MLH1); mutS homolog 6 (MSH6); postmeiotic segregation
          increased 2 (PMS2); and postmeiotic segregation increased 1 (PMS1).'
        supports: SUPPORT
