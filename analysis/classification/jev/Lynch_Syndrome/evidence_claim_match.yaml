  2c2afaecddb1993dac55507db42ca90e5d564963666f5c7ca54caba61f717e66:
    claim:
      about:
        disease:
          name: Lynch Syndrome
          disease_term:
            preferred_term: Lynch syndrome
            term:
              id: MONDO:0005835
              label: Lynch syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_mmr_msi_carcinogenesis_model
        hypothesis_label: Canonical Mismatch Repair Loss / MSI Carcinogenesis Model
        status: CANONICAL
        description: Lynch syndrome is caused by germline heterozygous loss-of-function variants in the
          DNA mismatch repair genes MLH1, MSH2, MSH6, or PMS2, or by EPCAM 3' deletions that silence MSH2
          in epithelial tissue. Somatic biallelic MMR inactivation ('second hit') in intestinal, endometrial,
          and other epithelium produces microsatellite instability (MSI-H), accumulating insertion/deletion
          mutations at short tandem repeats and frameshift mutations in tumor suppressor genes (TGFBR2,
          BAX, MSH3) that drive colorectal, endometrial, ovarian, gastric, and urothelial carcinogenesis.
          The accelerated adenoma-carcinoma sequence in MMR-deficient colon (versus the Vogelstein chromosomal-instability
          path in FAP) explains the early-onset, right-sided, often poorly differentiated phenotype. MSI
          testing and IHC for MLH1/MSH2/MSH6/PMS2 are now standard tumor screening modalities. Immune
          checkpoint blockade (pembrolizumab, nivolumab) is highly effective in MSI-H tumors, corroborating
          that hypermutation-driven neoantigen load is mechanistically coupled to MMR loss and validates
          the MSI carcinogenesis axis of the canonical model.
        notes: 'Retained as CANONICAL with important qualifiers. The 2026 falcon hypothesis-search report
          (kb/hypotheses/Lynch_Syndrome/canonical_mmr_msi_carcinogenesis_model; openscientist timed out
          at 3600s) finds SUPPORTED. The germline MMR etiology, requirement for biallelic somatic inactivation
          in tumors/crypts, MSI-H / hypermutation phenotype, and predictive value of MSI/dMMR for immune
          checkpoint blockade (ICI) — particularly pembrolizumab, nivolumab + ipilimumab, dostarlimab
          — are strongly supported and remain standard-of-care in diagnostics and therapy selection. Three
          key qualifications: (1) phenocopies and etiologic heterogeneity — sporadic MSI via MLH1 hypermethylation
          ± BRAF V600E and ''double-somatic MMR'' tumors can mimic LS biology without germline LS, requiring
          BRAF/MLH1-methylation reflex testing; (2) diagnostic discordance / subtype nuance — universal
          tumor screening (UTS) can miss LS and dMMR can be functionally present with retained IHC expression;
          atypical patterns require reflex MSI-PCR / NGS per modern algorithms; (3) mechanism expansion
          beyond coding frameshifts — noncoding MSI (splicing-affecting intronic microsatellites) occurs
          very early in dMMR crypts and may contribute to initiation BEFORE classical coding driver accumulation,
          refining the canonical adenoma-carcinoma sequence. EPCAM 3'' deletions silencing MSH2 in epithelial
          tissue extend the canonical genetic etiology to non-MMR germline causes.'
      selected_evidence:
        snippet: Lynch syndrome represents 1-7% of all cases of colorectal cancer and is an autosomal-dominant
          inherited cancer predisposition syndrome caused by germline mutations in deoxyribonucleic acid
          (DNA) mismatch repair genes.
        supports: SUPPORT
