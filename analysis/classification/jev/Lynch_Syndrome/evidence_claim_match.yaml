          of the 3' end of EPCAM removes its polyadenylation signal; transcription reads through and the
          MSH2 promoter 15 kb downstream is inactivated by hypermethylation. The deleted region acts in
          cis on MSH2 rather than through loss of EPCAM's own function, so this node is modelled separately
          from the coding-variant route while feeding the same mismatch repair defect. MSH2 inactivation
          is reported specifically in cell lineages that express EPCAM.
        genes:
