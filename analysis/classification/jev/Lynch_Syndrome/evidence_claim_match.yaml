          modifier: DECREASED
          term:
            id: GO:0030846
            label: termination of RNA polymerase II transcription, poly(A)-coupled
        - preferred_term: epigenetic silencing of the MSH2 promoter
          modifier: ABNORMAL
          term:
            id: GO:0040029
            label: epigenetic regulation of gene expression
        cell_types:
