      assertion_type: IUISAssignment
      assertion:
        classification_value: immune dysregulation
        notes: IUIS 2022 IEI classification (Tangye et al., PMID:35748970), Table 4 "Diseases of immune
          dysregulation", section 1 "Familial Hemophagocytic Lymphohistiocytosis (FHL syndromes)" — the
          "SLC7A7 deficiency" row (AR, OMIM 222700). LPI is primarily a metabolic amino-acid-transport
          disorder; its IUIS membership rests on the macrophage phenotype the table cites for this row
          — a hyper-inflammatory response of macrophages (with normal NK cell function) and alveolar proteinosis
          — which is why IUIS files it with the FHL group rather than the metabolic nosologies.
      selected_evidence:
        snippet: SLC7A7 deficiency SLC7A7 AR 222700
        supports: SUPPORT
