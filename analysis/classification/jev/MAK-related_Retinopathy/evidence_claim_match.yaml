          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: One such mutation is a recently-identified Alu insertion into the Male Germ Cell-Associated
          Kinase (MAK) gene, which is missed by standard NGS-based variant callers.
        supports: SUPPORT
