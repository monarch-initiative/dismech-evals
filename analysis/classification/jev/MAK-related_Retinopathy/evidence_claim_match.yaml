        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic MAK Loss of Function
        biological_scale: MOLECULAR
        conforms_to: photoreceptor_degeneration#Photoreceptor Gene Defect
        description: Biallelic MAK variants remove MAK kinase function in photoreceptors. The exon 9 Alu
          insertion prevents the developmental switch to the retinal MAK transcript, so patient cells
          lack wild-type exon 9-containing transcript; nonsense, frameshift and splice-site variants are
          predicted null alleles; and two kinase-domain missense variants abolish kinase activity in vitro.
          MAK is a cilium-associated serine/threonine kinase expressed in rod and cone photoreceptors
          and in testis; it phosphorylates the N-terminal region of the axonemal microtubule-associated
          protein RP1 in mouse photoreceptor cilia.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: MAK
          term:
            id: hgnc:6816
            label: MAK
        molecular_functions:
        - preferred_term: protein serine/threonine kinase activity
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
          modifier: DECREASED
        cell_types:
        - preferred_term: rod photoreceptor cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: cone photoreceptor cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: Two of these mutations alter amino acids that are conserved in all known kinases, and
          an in vitro kinase assay indicates that these mutations result in a loss of kinase activity.
        supports: SUPPORT
