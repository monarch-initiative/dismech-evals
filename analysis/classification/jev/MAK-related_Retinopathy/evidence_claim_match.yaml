      assertion_type: Discussion
      assertion:
        discussion_id: mak_photoreceptor_cilium_length_in_patients
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Negative Regulation of Cilium Length
        prompt: Do photoreceptor connecting cilia lengthen in patients with MAK-related retinopathy, as
          they do in Mak-null mice, or fail to form axonemes as in zebrafish mak mutants?
        rationale: Mak-null mouse photoreceptors have elongated cilia, zebrafish mak mutants have no photoreceptor
          axonemes, and patient fibroblasts have longer primary cilia, but OCT in adult patients found
          no sign of ciliary elongation at a resolution that cannot see single cilia. Which ciliary defect
          the human photoreceptor has decides which model is the better proxy for testing therapies.
        proposed_experiments:
        - experiment_id: mak_patient_retinal_organoid_cilium_length
          name: Connecting cilium length in MAK patient retinal organoids
          description: Measure connecting cilium and axoneme length, IFT protein distribution and opsin
            localization in photoreceptors of retinal organoids from Alu-homozygous patient iPSCs against
            gene-corrected isogenic controls.
          would_support:
          - pathophysiology#Loss of Negative Regulation of Cilium Length
      selected_evidence:
        snippet: We conclude that either cilial elongation seen in young mice is not a feature of the
          adult human arRP MAK patients, or the effect becomes undetectable with noninvasive methods due
          to the simultaneous shortening of the OS.
        supports: SUPPORT
