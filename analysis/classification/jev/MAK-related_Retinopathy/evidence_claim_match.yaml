        description: Biallelic MAK variants confirm the diagnosis. The exon 9 Alu insertion is not called
          by standard NGS variant callers, so it needs a targeted assay (PCR or a read-level search for
          the junction sequence); targeted testing for the Alu insertion and DHDDS p.Lys42Glu is an efficient
          first step in patients of Jewish ancestry. Authors recommend including MAK in genetic testing
          of all patients with RP.
