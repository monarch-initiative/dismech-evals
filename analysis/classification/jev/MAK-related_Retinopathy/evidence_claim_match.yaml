      assertion_type: AnimalModel
      assertion:
        name: Mak knockout mouse
        species: Mouse
        genotype: Mak-/- (Mak-null)
        publication: PMID:21148103
        description: Mak-null mice have elongated photoreceptor connecting cilia, accumulation of IFT
          proteins at the ciliary tip, rhodopsin mislocalization and progressive photoreceptor degeneration.
          Fertility is not affected.
        modeled_mechanisms:
        - target: Loss of Negative Regulation of Cilium Length
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: CELLULAR
          description: Elongated photoreceptor cilia.
          limitations: Photoreceptor ciliary elongation has not been demonstrated in patients; OCT in
            adults found none, though single cilia are below its resolution, and zebrafish mak mutants
            lack axonemes instead.
        - target: Impaired Retrograde Intraflagellar Transport at the Photoreceptor Ciliary Tip
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: CELLULAR
          description: IFT proteins accumulate at photoreceptor ciliary tips.
          limitations: No human photoreceptor tissue has been examined for IFT accumulation.
        - target: Opsin Mislocalization to the Photoreceptor Inner Segment and Cell Body
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: CELLULAR
          description: Rhodopsin accumulates in photoreceptor cell bodies.
          limitations: No human photoreceptor tissue has been examined for opsin mislocalization.
        - target: Rod Photoreceptor Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Progressive photoreceptor degeneration.
          limitations: Degeneration in the mouse has been described as rapid, whereas patient symptoms
            usually begin in early to mid adulthood and progress slowly.
      selected_evidence:
        snippet: Interestingly, despite its original description as a gene that is important in spermatogenesis,
          deletion of the Mak gene in mice does not affect fertility
        supports: SUPPORT
