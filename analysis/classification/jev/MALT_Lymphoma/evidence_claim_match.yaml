            label: inflammatory response
      selected_evidence:
        snippet: Gastric mucosa-associated lymphoid tissue (MALT) lymphoma is a prototypical cancer that
          occurs in the setting of chronic inflammation and an important model for understanding how deregulated
          NF-κB transcriptional activity contributes to malignancy.
        supports: SUPPORT
