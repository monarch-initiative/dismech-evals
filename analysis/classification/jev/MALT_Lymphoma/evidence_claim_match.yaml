        description: Chronic B-cell receptor signaling and T-helper-cell-derived signals select and expand
          a clonal population of marginal-zone-derived memory B cells. At this stage proliferation remains
          dependent on the antigenic stimulus, which is why early gastric MALT lymphoma can regress after
          antigen removal.
        cell_types:
        - preferred_term: marginal zone B cell
          term:
            id: CL:0009060
            label: marginal zone B cell of lymph node
        biological_processes:
        - preferred_term: B cell receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0050853
            label: B cell receptor signaling pathway
        - preferred_term: B cell proliferation
          modifier: INCREASED
          term:
            id: GO:0042100
            label: B cell proliferation
      selected_evidence:
        snippet: Most gastric MALT lymphomas require ongoing antigenic stimulation for continued tumor
          growth, and Stage I disease is usually cured by eradicating the causative microorganism, Helicobacter
          pylori, with antibiotics.
        supports: SUPPORT
