      assertion:
        name: Germline Heterozygous FBN1 Variant
        biological_scale: MOLECULAR
        description: A heterozygous germline FBN1 variant. Reported MASS variants include missense changes,
          canonical and deep intronic splice variants, and a frameshifting insertion. A deep intronic
          variant in one MASS patient inserted ten intronic nucleotides into the mRNA and created a premature
          stop codon, so the mutant transcript is expected to be at least partly degraded or to encode
          a C-terminally truncated fibrillin-1.
        genes:
        - preferred_term: FBN1
          term:
            id: hgnc:3603
            label: FBN1
        molecular_functions:
        - preferred_term: extracellular matrix structural constituent
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
        genetic_context:
          variant_origin: GERMLINE
          description: Heterozygous; missense, splice and frameshift variants have been reported.
      selected_evidence:
        snippet: The c.6872-24T>A and c.7571-12T>A variants generate the retention of intronic nucleotides
          and lead to the introduction of a premature stop codon.
        supports: SUPPORT
