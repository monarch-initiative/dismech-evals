      assertion_type: Definition
      assertion:
        name: Revised Ghent nosology MASS phenotype
        definition_type: DIAGNOSTIC_CRITERIA
        description: Under the revised Ghent nosology (2010), MASS is diagnosed in a person with mitral
          valve prolapse, a systemic score of at least 5 points that includes at least one skeletal feature,
          an aortic root Z-score below 2, and no ectopia lentis. With a systemic score below 5 the same
          picture is mitral valve prolapse syndrome. Because the Marfan phenotype can emerge with age,
          the classification is provisional in young patients.
      selected_evidence:
        snippet: In contrast to MVPS the definition of MASS requires a systemic score ≥ 5 points.
        supports: SUPPORT
