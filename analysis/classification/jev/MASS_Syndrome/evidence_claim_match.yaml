        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: FBN1 variants reported with a MASS diagnosis include missense and splice variants (five
          probands in a Sri Lankan exome series, PMID:41502793) and a deep intronic variant, c.7571-12T>A,
          that activates a cryptic acceptor site and introduces a premature stop codon (PMID:31185693).
          OMIM's MASS allele is a 4-bp insertion at nucleotide 5138, as quoted from OMIM by PMID:34491247.
          No variant class is specific to MASS, and no genotype-phenotype rule separates it from the related
          FBN1 conditions (PMID:23794388). Not every patient meeting the clinical MASS criteria carries
          an FBN1 variant, so the clinical phenotype is probably genetically heterogeneous. HGNC lists
          MASS as an alias symbol of FBN1. No ClinGen classification exists for this gene and disease.
      selected_evidence:
        snippet: Subsequent medical genetics evaluation led ultimately to the diagnosis of the MASS phenotype
          and the discovery of an underlying FBN1 mutation.
        supports: SUPPORT
