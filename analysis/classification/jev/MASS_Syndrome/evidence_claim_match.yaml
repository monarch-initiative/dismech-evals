      assertion_type: Discussion
      assertion:
        discussion_id: why_fbn1_gives_mass_not_marfan
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#FBN1
        - pathophysiology#Dysregulated TGF-beta Signaling
        prompt: Why does an FBN1 variant produce MASS, with a normal lens and a non-progressive aortic
          root, in some people and Marfan syndrome in others, and is TGF-beta dysregulation part of the
          mitral valve disease in MASS?
        rationale: No genotype-phenotype rule separates MASS from Marfan syndrome. One splice-variant
          report speculates that MASS alleles preserve the TGF-beta binding domains of fibrillin-1 while
          aortic disease follows their loss, and a review proposes TGF-beta dysregulation as the driver
          of MASS mitral valve disease while noting it is untested. Neither has been examined in a series
          of MASS patients.
      selected_evidence:
        snippet: Among these clinically related conditions, there is no compelling evidence that genotype
          predicts phenotype, with the exception of neonatal Marfan syndrome, mutations in which cluster
          within FBN1 exons 24-32.
        supports: SUPPORT
    origin:
