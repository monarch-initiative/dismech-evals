              id: MONDO:0011695
              label: melanoma, uveal, susceptibility to, 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous Germline MBD4 Loss of Function
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        role: trigger
        biological_scale: MOLECULAR
        description: One constitutional MBD4 allele carries a truncating, canonical-splice or catalytically
          dead missense variant. Every cell keeps one functional allele, so the constitutional state is
          not itself a mutator state; it is a first hit awaiting loss of the wild-type allele in a uveal
          melanocyte. Recurrent alleles across unrelated carriers (c.1562-1G>T, c.1443delT, c.1706G>A,
          c.335+1G>A, c.939dup) suggest founder effects.
        genetic_context:
          gene:
            preferred_term: MBD4
            term:
              id: hgnc:6919
              label: MBD4
          variant_origin: GERMLINE
          allelic_hit_role: FIRST_HIT
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous germline loss-of-function variants, including frameshift, nonsense,
            canonical splice and glycosylase-dead missense (p.Arg468Trp) alleles.
        molecular_functions:
        - preferred_term: G/T mismatch-specific thymine-DNA glycosylase activity
          term:
            id: GO:0141016
            label: G/T mismatch-specific thymine-DNA glycosylase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Taken together, we thus identified 8 LoF germline variants in MBD4 among the 1093 consecutive
          UM case patients, including p. Arg468Trp with deleterious effect on MBD4 glycosylase activity
          (Table 1).
        supports: SUPPORT
    origin:
