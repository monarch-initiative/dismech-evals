        conforms_to: genome_instability_mutation#Mutator Phenotype and Chromosomal Instability
        role: central_effector
        biological_scale: CELLULAR
        description: 'Carrier tumors carry a median of about 243 exome variants against 16 in MBD4-proficient
          uveal melanoma, with 85-96% of single-nucleotide variants being CpG>TpG transitions against
          about a quarter in other uveal melanomas. The excess continues after dissemination: metastases
          from MBD4-deficient tumors are genetically heterogeneous and acquire new drivers (TP53, SMARCA4,
          GNAS), whereas MBD4-proficient metastases acquire few new variants. How the mutator contributes
          to malignant transformation, beyond accompanying it, has not been determined (see discussions).'
      selected_evidence:
        snippet: Tumors carrying deleterious MBD4 mutations were all associated with high tumor mutation
          burden and a CpG>TpG hypermutator phenotype.
