        description: Anti-PD-1 monotherapy or anti-PD-1 with anti-CTLA-4 for metastatic disease. In unselected
          metastatic uveal melanoma, response rates are below 5%; in MBD4-deficient tumors, a retrospective
          series of 12 patients (most of them germline carriers, some with somatic MBD4 loss only) reported
          a 50% response rate, and in a 300-patient retrospective cohort 3 of 5 MBD4-mutated patients
          responded against 4% of wild-type. The evidence is retrospective and rests on small numbers,
          and how checkpoint blockade should be sequenced with tebentafusp in HLA-A*02:01-positive carriers
          is unresolved.
        treatment_term:
          preferred_term: immune checkpoint inhibitor therapy
          term:
