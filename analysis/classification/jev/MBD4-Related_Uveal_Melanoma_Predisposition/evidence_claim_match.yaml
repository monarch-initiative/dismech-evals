        category: Neoplastic
        name: Uveal Melanoma
        description: The defining tumor. Primary uveal melanoma in carriers has been unilateral and single
          in nearly all reported cases, with one carrier with multiple uveal melanomas among 25 French
          carrier families. Carrier tumors are monosomy-3, hypermutated, and in the first series had metastasis-free
          and overall survival not different from MBD4-proficient monosomy-3 tumors. Median age at diagnosis
          was 55.5 years in the first eight carriers, not earlier than in non-carriers, and the discovery
          authors' model places the rate-limiting first step (a Gq-pathway activating mutation) upstream
          of any MBD4 effect, which they offer as the reason onset is not shifted earlier. No pediatric
          case was found in the sources cited here.
        phenotype_term:
          preferred_term: Uveal melanoma
          term:
            id: HP:0007716
            label: Uveal melanoma
          onset:
            onset_category: ADULT
      selected_evidence:
        snippet: One surprising observation for this new cancer-predisposing condition is the absence
          of early-onset UM.
        supports: SUPPORT
