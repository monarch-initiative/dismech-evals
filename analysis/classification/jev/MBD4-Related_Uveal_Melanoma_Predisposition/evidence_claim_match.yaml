        name: Autosomal dominant
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        description: 'One germline loss-of-function allele is sufficient for the increased risk, and offspring
          of a carrier have a 50% chance of inheriting it. Penetrance is low: with a population lifetime
          uveal melanoma risk of about 7.7 per 100,000, the 2021 relative risk of about 9 corresponds
          to a lifetime risk below 0.1%, which is consistent with the absence of familial or bilateral
          uveal melanoma among the first eight carriers. A familial case was later reported among 25 carrier
          families. Larger relative-risk estimates (31.44 in a 2026 update of the same French cohort)
          would raise this figure, and a Finnish series found no loss-of-function carrier at all, so no
          penetrance figure is recorded.'
      selected_evidence:
        snippet: In summary, we described here a novel autosomal-dominant syndrome that is caused by germline
          mutations of MBD4, characterized by a high RR of developing hypermutated UM and possibly other
          malignancies.
        supports: SUPPORT
