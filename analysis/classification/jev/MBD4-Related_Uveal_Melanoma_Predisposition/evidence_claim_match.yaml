          spiradenocarcinoma, colorectal, gastric and pancreatic tumors, and carrier families report breast,
          renal and colorectal cancers in relatives, but no case-control estimate exists for any of them
          in the sources cited here, and the breast cancer probands came from a series referred for suspected
          breast cancer predisposition. No phenotype other than uveal melanoma is recorded on this entry
          for that reason.
      selected_evidence:
        snippet: Monoallelic MBD4 pathogenic variant may explain some cases of familial and multiple uveal
          melanoma as well as various cancer types, expanding the tumor spectrum of this predisposition.
        supports: SUPPORT
