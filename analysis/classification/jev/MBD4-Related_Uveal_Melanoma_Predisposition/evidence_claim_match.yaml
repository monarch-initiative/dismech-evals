              label: Nivolumab
          - preferred_term: ipilimumab
            term:
              id: NCIT:C2654
              label: Ipilimumab
        therapeutic_modality: MONOCLONAL_ANTIBODY
      selected_evidence:
        snippet: The overall response rate was 50% (two complete, four partial) with a disease control
