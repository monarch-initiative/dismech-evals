  34f7206581e02671b5368f9eccdd3657fb48d5a80de1aa63e08a9673f5cf8f59:
    claim:
      about:
        disease:
          name: MBD5 Haploinsufficiency Syndrome
          disease_term:
            preferred_term: intellectual disability, autosomal dominant 1
            term:
              id: MONDO:0007974
              label: intellectual disability, autosomal dominant 1
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: MAND patient iPSC-derived neural progenitor cells
        description: 'Skin fibroblasts from three unrelated individuals with a 2q23.1 deletion and from
          four unrelated controls were reprogrammed to induced pluripotent stem cells and differentiated
          as a monolayer to PAX6-positive neural progenitor cells, which were then profiled by RNA sequencing.
          This is the entry''s only human cellular model: every other mechanistic measurement in the chromatin
          arm comes from the gene-trap mouse or from patient lymphoblastoid lines, and this system carries
          the human MBD5 dose in a neural lineage at an early developmental stage.

          The three donors'' deletions span 0.18, 0.73 and 3.43 Mb, so the smallest is close to an MBD5-only
          lesion and the largest removes a substantial interval around it. The authors state plainly that
          the dysregulated genes they report may not all follow from reduced MBD5 alone, which is why
          the transcriptome link below is recorded as a partial rather than a complete reproduction of
          the node.'
        experimental_model_type: IPSC_DERIVED_MODEL
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        cell_types:
        - preferred_term: PAX6-positive neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        conditions:
        - 2q23.1 deletion patient-derived neural progenitor cells
        - control neural progenitor cells from four unrelated donors
        cell_source: Primary skin fibroblasts from three individuals with a chromosomal microarray-confirmed
          2q23.1 deletion and four unrelated controls, reprogrammed to iPSCs with episomal plasmids and
          differentiated to neural progenitor cells
        culture_system: Two-dimensional neural induction monolayer culture, with chromosomal microarray
          and quantitative PCR repeated at the fibroblast, iPSC and neural progenitor stages to confirm
          the deletion was retained
        publication: PMID:34050248
        modeled_mechanisms:
        - target: MBD5 Haploinsufficiency
          relationship: MEASURES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: 'Confirms the node''s dose claim in human neural cells rather than inferring it:
            MBD5 mRNA is about half of control at the fibroblast, iPSC and neural progenitor stages of
            the same lines.'
          limitations: All three donors carry deletions rather than intragenic MBD5 alterations, so the
            model reports the dose produced by one of the two lesion classes this node covers. It measures
            mRNA only and says nothing about MBD5 protein.
          readouts:
          - name: MBD5 mRNA abundance in patient neural progenitor cells
            target: MBD5 Haploinsufficiency
            direction: DECREASED
            interpretation: The halved transcript dose this node asserts, measured in a human neural lineage.
        - target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Halving the human MBD5 dose in a neural lineage dysregulates several hundred genes
            in both directions, which is the transcriptional consequence this node asserts. It also names
            a specific de-repressed target, the forebrain transcription factor FOXG1, and places the affected
            genes among chromatin modifiers implicated in neurogenesis.
          limitations: 'The measurement is steady-state transcript abundance in a progenitor population,
            so the node''s cell-level claim about neurons is reached by inference: no post-mitotic neuron,
            circuit or brain tissue is in the model. Nothing here shows MBD5 occupying the loci whose
            expression changed, so the chromatin-mediated part of the node remains an interpretation of
            the gene list rather than a direct observation.'
          divergences:
          - divergence_type: POPULATION_MISMATCH
            materiality: QUALIFYING
            description: The three donors all carry contiguous 2q23.1 deletions, two of which extend well
              beyond MBD5, while the node is a single-gene claim that also covers intragenic MBD5 alterations.
              The authors state that the dysregulated genes may be due to reduced expression of other
              deleted genes in these samples.
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: Neural progenitor cells in monolayer carry none of the neuronal differentiation,
              synaptic or circuit context the node's downstream consequences depend on, and no brain region
              is represented.
          - divergence_type: SCALE_EXTRAPOLATION
            materiality: QUALIFYING
            description: The readouts are mRNA abundances, a molecular measurement, while the node states
              a cell-level programme of transcriptional regulation in neurons. The step from the gene
              list to the programme is inferential.
          readouts:
          - name: Differentially expressed genes in patient neural progenitor cells
            target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
            direction: ALTERED
            interpretation: Bidirectional dysregulation of several hundred genes, enriched for autism-associated
              genes, is the transcriptional disturbance this node describes.
          - name: FOXG1 mRNA abundance in patient neural progenitor cells
            target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
            direction: INCREASED
            interpretation: A named de-repressed target, confirmed by a second method, which turns the
              gene list into a specific regulatory claim.
        notes: 'Two further results from this study are deliberately not curated as readouts. Patient
          neural progenitor cells double more slowly than controls, which is a proliferation measurement
          rather than a transcriptional one and has no node here to attach to. The pathway enrichment
          the abstract reports, which places the differentially expressed genes alongside SFARI syndromic
          autism genes with transforming growth factor beta, Hippo signalling, DNA replication and cell
          cycle among the top terms, rests on supplementary tables that cannot be quoted, so only the
          abstract sentence naming the overlap would be citable and it asserts less than the tables do.

