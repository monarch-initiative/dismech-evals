  4aa521cc19b99dcaef499af8f32143130fbf7aa9e6f98e99f965fb78c73b1e80:
    claim:
      about:
        disease:
          name: MBD5 Haploinsufficiency Syndrome
          disease_term:
            preferred_term: intellectual disability, autosomal dominant 1
            term:
              id: MONDO:0007974
              label: intellectual disability, autosomal dominant 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mbd5_dosage_sensitivity_both_directions
        kind: KNOWLEDGE_GAP
        prompt: By what mechanism does MBD5 overexpression, in reciprocal 2q23.1 duplication, produce
          a phenotype overlapping the one caused by MBD5 haploinsufficiency?
        attaches_to:
        - pathophysiology#Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
        rationale: 'MBD5 is dosage-sensitive in both directions: deletion and duplication both cause neurodevelopmental
          disease with overlapping features, the duplication phenotype being somewhat milder. A model
          in which haploinsufficiency simply reduces a required activity does not explain why doubling
          that activity is also harmful. This entry curates the deletion side only; the shared mechanism
          that would account for both is not established, and this discussion marks that as a gap rather
          than leaving the asymmetry unremarked.'
      selected_evidence:
        snippet: The features associated with a deletion, mutation or duplication of MBD5 and the gene
          expression changes observed support MBD5 as a dosage-sensitive gene critical for normal development.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
