  e2fc277f11f9fcdffc250b4d6c178360c97885527106e4c4b8aa71c0f7231de2:
    claim:
      about:
        disease:
          name: MBD5 Haploinsufficiency Syndrome
          disease_term:
            preferred_term: intellectual disability, autosomal dominant 1
            term:
              id: MONDO:0007974
              label: intellectual disability, autosomal dominant 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MBD5 Haploinsufficiency
        biological_scale: MOLECULAR
        description: 'Deletion of, or a loss-of-function alteration within, one MBD5 allele halves MBD5
          mRNA. The critical-region mapping is what makes this node a single-gene claim rather than an
          inference about a deleted interval: MBD5 was the only locus defining the region shared by all
          deletions, and alterations disrupting MBD5 alone reproduce the full phenotype.'
        genes:
        - preferred_term: MBD5
          term:
            id: hgnc:20444
            label: MBD5
        notes: No methyl-CpG-binding molecular function is annotated on this node, and the absence is
          deliberate. MBD5 localises to non-heterochromatic active regions and its binding to methylated
          DNA has been questioned, so binding GO:0008327 here would assert the methyl-DNA-reading mechanism
          that the next node's description explicitly declines to claim. No term beats a term the cited
          evidence does not support.
      selected_evidence:
        snippet: We identified a single gene, methyl-CpG-binding domain 5 (MBD5), as the only locus that
          defined the critical region. Partial or complete deletion of MBD5 was associated with haploinsufficiency
          of mRNA expression, intellectual disability, epilepsy, and autistic features.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21981781
      reference_title: Assessment of 2q23.1 microdeletion syndrome implicates MBD5 as a single causal
        locus of intellectual disability, epilepsy, and autism spectrum disorder.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes MBD5 as the sole critical-region gene and links its deletion to reduced
