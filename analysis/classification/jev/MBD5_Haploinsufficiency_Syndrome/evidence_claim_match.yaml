        description: 'GeneReviews is explicit that these are treated in a routine manner - there is no
          MBD5-specific protocol. Recorded because the absence of a disease-specific approach is itself
          the clinically useful fact, and because the sleep disturbance in particular has a curated mechanism
          in this entry without a curated targeted therapy.

          "Routine" is not the same as "no agent preference", and the cohort literature supplies one that
          GeneReviews does not: valproate was the most consistently effective anti-seizure medication,
          while carbamazepine made seizures worse in one patient. A single patient is not a contraindication,
          but it is the only agent-specific caution available for this disorder and is recorded for that
          reason. The same cohort''s ketogenic-diet response in that patient is reported alongside it
          in the source.'
