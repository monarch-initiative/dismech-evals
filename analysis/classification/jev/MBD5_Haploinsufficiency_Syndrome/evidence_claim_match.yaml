      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
        biological_scale: CELLULAR
        description: 'MBD5 carries a methyl-CpG-binding domain and a PWWP domain and acts as an epigenetic
          regulator with transactivational activity. Halving its dose dysregulates the transcriptional
          programmes that chromatin readers coordinate during neuronal development. The mechanism here
          is less completely characterised than the genetics: MBD5''s own binding to methylated DNA has
          been questioned, so the node is stated at the level the evidence supports - a chromatin-associated
          transcriptional regulator whose dose matters - rather than as a specific methyl-DNA-reading
          mechanism.'
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: DECREASED
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: a region that includes MBD5, an important factor in methylation patterning and epigenetic
          regulation
        supports: SUPPORT
