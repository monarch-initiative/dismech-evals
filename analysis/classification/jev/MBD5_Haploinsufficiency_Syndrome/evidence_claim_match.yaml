      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Circadian Gene Expression
        biological_scale: CELLULAR
        description: 'MBD5 haploinsufficiency alters expression of the core circadian genes NR1D2, PER1,
          PER2 and PER3 in patient lymphoblastoid lines, and siRNA knockdown perturbs further circadian
          pathway genes. This node is what connects the disease''s most clinically useful phenotype to
          its molecular lesion. It also converts the Angelman/Rett/Smith-Magenis resemblance the entry
          narrates elsewhere from a diagnostic anecdote into a mechanistic claim: MBD5 and RAI1, the Smith-Magenis
          gene, carry conserved putative E boxes and their knockdowns perturb overlapping circadian and
          mTOR pathways.'
        biological_processes:
        - preferred_term: circadian rhythm
          term:
            id: GO:0007623
            label: circadian rhythm
          modifier: DYSREGULATED
      selected_evidence:
        snippet: circadian gene mRNA levels of NR1D2, PER1, PER2, and PER3 were altered in del 2q23.1
          lymphoblastoid cell lines (LCLs), signifying that haploinsufficiency of MBD5 can result in dysregulation
          of circadian rhythm gene expression
        supports: SUPPORT
