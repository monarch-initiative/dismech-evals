      assertion:
        target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: Halving the human MBD5 dose in a neural lineage dysregulates several hundred genes
          in both directions, which is the transcriptional consequence this node asserts. It also names
          a specific de-repressed target, the forebrain transcription factor FOXG1, and places the affected
          genes among chromatin modifiers implicated in neurogenesis.
        limitations: 'The measurement is steady-state transcript abundance in a progenitor population,
          so the node''s cell-level claim about neurons is reached by inference: no post-mitotic neuron,
          circuit or brain tissue is in the model. Nothing here shows MBD5 occupying the loci whose expression
          changed, so the chromatin-mediated part of the node remains an interpretation of the gene list
          rather than a direct observation.'
        divergences:
        - divergence_type: POPULATION_MISMATCH
          materiality: QUALIFYING
          description: The three donors all carry contiguous 2q23.1 deletions, two of which extend well
            beyond MBD5, while the node is a single-gene claim that also covers intragenic MBD5 alterations.
            The authors state that the dysregulated genes may be due to reduced expression of other deleted
            genes in these samples.
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: Neural progenitor cells in monolayer carry none of the neuronal differentiation,
            synaptic or circuit context the node's downstream consequences depend on, and no brain region
            is represented.
        - divergence_type: SCALE_EXTRAPOLATION
          materiality: QUALIFYING
          description: The readouts are mRNA abundances, a molecular measurement, while the node states
            a cell-level programme of transcriptional regulation in neurons. The step from the gene list
            to the programme is inferential.
        readouts:
        - name: Differentially expressed genes in patient neural progenitor cells
          target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
          direction: ALTERED
          interpretation: Bidirectional dysregulation of several hundred genes, enriched for autism-associated
            genes, is the transcriptional disturbance this node describes.
        - name: FOXG1 mRNA abundance in patient neural progenitor cells
          target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
          direction: INCREASED
          interpretation: A named de-repressed target, confirmed by a second method, which turns the gene
            list into a specific regulatory claim.
      selected_evidence:
        snippet: there was an even distribution of upregulated and downregulated genes, confirming that
          MBD5 can act as a positive and negative regulator of gene expression
        supports: SUPPORT
