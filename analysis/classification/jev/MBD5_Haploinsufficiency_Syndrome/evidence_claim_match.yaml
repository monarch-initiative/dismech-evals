  56a20e430be57cf070a4761b0b6a1a97d039b80e928e198a93d12a499b02664d:
    claim:
      about:
        disease:
          name: MBD5 Haploinsufficiency Syndrome
          disease_term:
            preferred_term: intellectual disability, autosomal dominant 1
            term:
              id: MONDO:0007974
              label: intellectual disability, autosomal dominant 1
        context: []
      assertion_type: Genetic
      assertion:
        name: MBD5
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        gene_term:
          preferred_term: MBD5
          term:
            id: hgnc:20444
            label: MBD5
        notes: 'Both whole-gene deletion and intragenic alterations cause the disease, including partial
          deletions of non-coding regions that routine diagnostic screening does not typically capture
          or call pathogenic. That detection gap is clinically material: a patient can be MBD5-haploinsufficient
          and test negative on a standard array.

          Origin is almost always de novo, which is what `variant_origin` records, but not invariably
          - transmission from a mildly affected parent is reported, and germline mosaicism in a clinically
          normal parent has now been demonstrated directly by deep-coverage sequencing. That is the case
          that makes "de novo" and "no recurrence risk" different statements: the family below had three
          affected siblings and two phenotypically normal parents, and only deep sequencing found the
          mosaic mother.

          Recurrence risk is not hypothetical here: mosaicism was found in 14% of families in the seizure
          cohort, identified through their having had two affected pregnancies. That is the number the
          counselling caveat is about.

          Not curated here, and the reasons differ. The variant-class breakdown across deletions, intragenic
          CNVs and sequence variants is in the deep-research report but is not quotable: the report attributes
          the ~5% sequence-variant figure to the Mullegama and Elsea MAND review, and that review''s full
          text - now fetched and cached - does not state the breakdown. So this is a genuine sourcing
          gap, not an unfetched reference. The ClinGen dosage-sensitivity assertion was previously blocked
          by a tooling failure rather than a research gap: `just clingen-dosage-refresh` aborted on a
          checksum mismatch against the pinned manifest. That was ordinary release drift behind an unversioned
          URL, and repinning the manifest cleared it, so the `CGDS:` assertion is now curated - the haploinsufficiency
          row on the top-level `inheritance:` block, and the triplosensitivity row on the bidirectional-dosage
          discussion, not in this `genetic:` record''s own evidence list. `just refresh-orphadata` still
          fails the same way, which is why this entry''s prevalence record remains a diagnostic yield
          rather than the Orphanet population class.'
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Deletions or mutations are almost always de novo although inheritance from mildly affected
          or mosaic parents has been reported.
        supports: SUPPORT
