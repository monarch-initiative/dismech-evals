              also names a specific de-repressed target, the forebrain transcription factor FOXG1, and
              places the affected genes among chromatin modifiers implicated in neurogenesis.
            limitations: 'The measurement is steady-state transcript abundance in a progenitor population,
              so the node''s cell-level claim about neurons is reached by inference: no post-mitotic neuron,
              circuit or brain tissue is in the model. Nothing here shows MBD5 occupying the loci whose
              expression changed, so the chromatin-mediated part of the node remains an interpretation
              of the gene list rather than a direct observation.'
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: FOXG1 mRNA abundance in patient neural progenitor cells
        target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
        direction: INCREASED
        interpretation: A named de-repressed target, confirmed by a second method, which turns the gene
          list into a specific regulatory claim.
      selected_evidence:
        snippet: MAND NPC RNA-seq data revealed significantly increased FOXG1 mRNA levels over the controls,
          which was confirmed by RT-qPCR
        supports: SUPPORT
