              label: peripheral neuropathy, autosomal recessive, with or without impaired intellectual
                development
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mcm3ap_genotype_phenotype_power
        kind: KNOWLEDGE_GAP
        prompt: Is the association between null MCM3AP alleles and worse cognitive and ambulatory outcome
          real, or an artifact of small cohorts?
        attaches_to:
        - genetic#MCM3AP
        rationale: 'Two separate lines point the same way: patient fibroblasts show that depleting alleles
          give more severe phenotypes than Sac3-domain alleles, and cohort analysis finds delayed independent
          walking in the null group. But the cohort''s intellectual disability and loss-of-ambulation
          comparisons did not reach statistical significance, and the authors say so. With fewer than
          thirty reported individuals in the largest retrospective series, the question is one of power
          rather than of contradictory evidence, and this entry quotes the non-significant result rather
          than rounding it up.

          A later retrospective analysis does report a domain-level correlation, at 100% early-onset symptoms,
          motor delay and cognitive abnormality for alleles outside the Sac3 domain against 26.7% and
          46.7% within it, and that result is curated in the genetic section rather than here. It narrows
          the gap without closing it: it is a different comparison from the null-versus-Sac3 severity
          question this discussion is about, it is retrospective over the same small published population,
          and it reports no significance test.'
      selected_evidence:
        snippet: The percentage of intellectual disability and loss of ambulation in the null group tended
          to be greater, although this failed to reach statistical significance.
        supports: SUPPORT
