                development
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mcm3ap_length_dependence_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Why does a general nuclear mRNA export defect produce a length-dependent peripheral neuropathy
          rather than a generalized cellular disease?
        attaches_to:
        - pathophysiology#Length-Dependent Peripheral Axonal Degeneration
        rationale: GANP and TREX-2 operate in every nucleus, so selective vulnerability of long peripheral
          axons is the central unexplained feature of this disease. The best available lead is that the
          transcriptome changes are structured by intron content rather than being uniform, which could
          concentrate the effect on a particular set of transcripts. But no work connects that transcript
          set to axonal length, and the original cohort paper presents the export-to-axonal-degeneration
          link as a suggestion. This entry types that edge as having unknown intermediates for that reason.
      selected_evidence:
        snippet: Thus our results suggest defective mRNA export from nucleus as a potential pathogenic
          mechanism of axonal degeneration in these patients.
        supports: SUPPORT
