    claim:
      about:
        disease:
          name: MCM3AP-Related Peripheral Neuropathy
          disease_term:
            preferred_term: MCM3AP-related peripheral neuropathy
            term:
              id: MONDO:0029131
              label: peripheral neuropathy, autosomal recessive, with or without impaired intellectual
                development
        context: []
      assertion_type: Genetic
      assertion:
        name: MCM3AP
        gene_term:
          preferred_term: MCM3AP
          term:
            id: hgnc:6946
            label: MCM3AP
        association: MCM3AP encodes GANP, the scaffold subunit of the TREX-2 nuclear mRNA export complex.
          Biallelic hypomorphic or loss-of-function variants cause childhood-onset recessive Charcot-Marie-Tooth
          neuropathy with or without impaired intellectual development.
        relationship_type: CAUSATIVE
        variants:
        - name: MCM3AP Sac3-domain missense variants
          description: Variants altering critical residues within the Sac3 mRNA-binding domain do not
            deplete GANP, and are associated with a milder phenotype than the depleting alleles. This
            is the structural basis of the reported genotype-phenotype correlation.
          clinical_significance: PATHOGENIC
        - name: MCM3AP null and depleting variants
          description: Splice, frameshift, nonsense and deletion alleles that reduce GANP protein. In
            cohort analysis these are associated with delayed independent walking, and with a numerically
            higher rate of intellectual disability and loss of ambulation.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: The identification of MCM3AP variants in affected individuals from multiple centres establishes
          it as a disease gene for childhood-onset recessively inherited Charcot-Marie-Tooth neuropathy
          with intellectual disability.
        supports: SUPPORT
