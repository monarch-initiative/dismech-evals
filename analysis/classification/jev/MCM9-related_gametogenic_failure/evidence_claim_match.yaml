        context: []
      assertion_type: Diagnosis
      assertion:
        name: Hormonal and gonadal evaluation
        description: Serum gonadotropins (FSH, LH) and sex-hormone levels are essential to characterize
          the endocrine phenotype in both sexes. In 46,XX individuals, elevated FSH and LH with low estradiol
          confirm hypergonadotropic hypogonadism consistent with primary ovarian insufficiency; ovarian
          reserve assessment (anti-Müllerian hormone, antral follicle count) may inform reproductive planning.
          In 46,XY individuals, gonadotropins and testosterone are typically within normal limits despite
          severe spermatogenic failure, so hormonal testing alone is insufficient to exclude the male
          disease branch and must be paired with semen analysis.
        diagnosis_term:
          preferred_term: hormonal evaluation
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: Premature ovarian failure (POF) is genetically heterogeneous and manifests as hypergonadotropic
          hypogonadism either as part of a syndrome or in isolation.
        supports: SUPPORT
