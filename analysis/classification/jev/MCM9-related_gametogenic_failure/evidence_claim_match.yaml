            term:
              id: MONDO:1060226
              label: MCM9-related gametogenic failure
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Andrological evaluation
        description: Male patients should undergo semen analysis as the primary assessment for spermatogenic
          failure. Non-obstructive azoospermia is the expected finding. If sperm retrieval is being considered,
          testicular biopsy can confirm Sertoli cell-only syndrome histology. Molecular diagnosis of biallelic
          MCM9 loss-of-function prior to invasive sperm retrieval can counsel on the likely poor outcome
          of microdissection TESE.
        diagnosis_term:
          preferred_term: clinical assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: Given the poor outcomes of microdissection testicular sperm extraction (micro-TESE) observed
          in both probands, we propose that biallelic LoF mutations in MCM9 may serve as non-invasive
          molecular biomarkers for predicting micro-TESE failure.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/3
      evidence_path: /diagnosis/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40593474
      reference_title: MCM9 deficiency impairs DNA damage repair during spermatogenesis, leading to Sertoli
        cell-only syndrome in humans.
      evidence_source: HUMAN_CLINICAL
      explanation: This supports pre-procedural molecular testing as part of the andrological evaluation
        to counsel on expected sperm-retrieval outcomes before invasive procedures.
