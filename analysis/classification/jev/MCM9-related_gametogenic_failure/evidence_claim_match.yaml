            label: Genetic Testing
      selected_evidence:
        snippet: A combination of SNP arrays, comparative genomic hybridization arrays, and whole-exome
          sequencing analyses identified homozygous pathogenic variants in MCM9, a gene implicated in
          homologous recombination and repair of double-stranded DNA breaks.
        supports: SUPPORT
