  abf9b446d93ea6939e80bc9e7a63ed92490894c3baf8ededfe13cd8b1a14a2d4:
    claim:
      about:
        disease:
          name: MCM9-related gametogenic failure
          disease_term:
            preferred_term: MCM9-related gametogenic failure
            term:
              id: MONDO:1060226
              label: MCM9-related gametogenic failure
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Hormonal and gonadal evaluation
        description: Serum gonadotropins (FSH, LH) and sex-hormone levels are essential to characterize
          the endocrine phenotype in both sexes. In 46,XX individuals, elevated FSH and LH with low estradiol
          confirm hypergonadotropic hypogonadism consistent with primary ovarian insufficiency; ovarian
          reserve assessment (anti-Müllerian hormone, antral follicle count) may inform reproductive planning.
          In 46,XY individuals, gonadotropins and testosterone are typically within normal limits despite
          severe spermatogenic failure, so hormonal testing alone is insufficient to exclude the male
          disease branch and must be paired with semen analysis.
        diagnosis_term:
          preferred_term: hormonal evaluation
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: In the male patient the homozygous MCM9 variant led to normal pubertal development and
          hormonal levels but caused a Sertoli-cell-only syndrome with non-obstructive azoospermia.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36769638
      reference_title: The Role of MCM9 in the Etiology of Sertoli Cell-Only Syndrome and Premature Ovarian
        Insufficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: This shows that male patients can have normal gonadotropin and testosterone profiles
        despite severe spermatogenic failure, informing the interpretation of hormonal assays in the male
        branch.
