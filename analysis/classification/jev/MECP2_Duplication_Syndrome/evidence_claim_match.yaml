      assertion_type: Pathophysiology
      assertion:
        name: MECP2 Overexpression and Neurodegeneration
        description: 'Duplication of the Xq28 region leads to overexpression of MECP2 protein, a multi-functional
          protein required for proper brain development and maintenance of brain function. MECP2 is dosage-sensitive;
          even a relatively modest increase causes severe neurological disease. Overexpression leads to
          neuronal death in specific brain regions including cortex, hippocampus, cerebellum, and spinal
          cord. Astrocytic dysfunction, including breakdown of glutamate homeostatic mechanisms, likely
          contributes to neuronal death.

          '
        cell_types:
