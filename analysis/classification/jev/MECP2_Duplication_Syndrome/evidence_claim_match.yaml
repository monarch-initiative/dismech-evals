  160ed26914098a28ccfb03d7bb067240b3639953d7ee2ad211b087eb9886f8ed:
    claim:
      about:
        disease:
          name: MECP2 Duplication Syndrome
          disease_term:
            preferred_term: MECP2 duplication syndrome
            term:
              id: MONDO:0010283
              label: syndromic X-linked intellectual disability Lubs type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immune Dysfunction
        description: 'MECP2 overexpression is associated with immunodeficiency characterized by IgA and
          IgG2 deficiency, low antibody titers against pneumococci, and elevated acute-phase responses.
          This leads to recurrent and often life-threatening respiratory infections, particularly with
          encapsulated bacteria. The IRAK1 gene, encoding interleukin-1 receptor-associated kinase 1,
          is frequently co-duplicated with MECP2, but IRAK1 duplication does not increase canonical NF-kB-induced
          inflammation at baseline, suggesting the immune dysfunction mechanism is more complex than simple
          innate immune pathway overactivation.

          '
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: Immune Response
          term:
            id: GO:0006955
            label: immune response
        locations:
        - preferred_term: Lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: increased susceptibility to infections in MECP2 duplication syndrome is associated with
          IgA/IgG2-deficiency, low antibody titers against pneumococci and elevated acute-phase responses
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25721700
