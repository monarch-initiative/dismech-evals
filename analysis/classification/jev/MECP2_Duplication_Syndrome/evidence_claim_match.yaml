      assertion_type: Genetic
      assertion:
        name: MECP2
        association: Causative
        gene_term:
          preferred_term: MECP2
          term:
            id: hgnc:6990
            label: MECP2
        notes: 'Xq28 duplication encompassing MECP2; duplications range from 64.6 kb to 16.5 Mb, classified
          as tandem duplications (48%), terminal duplications (22%), inverted triplications (20%), and
          other complex rearrangements (10%). 100% penetrant in males. Majority of cases are inherited
          from carrier mothers. Female carriers typically show skewed X-inactivation and are usually asymptomatic
          but may display neuropsychiatric phenotypes. Clinical severity correlates with MECP2 dosage
          and rearrangement structure, with triplications being most severe.

          '
      selected_evidence:
        snippet: Most of the reported cases are inherited, however, de novo cases have been documented.
          While carrier females have been reported to be unaffected, more recent research demonstrates
          that despite normal intelligence, female carriers display a range of neuropsychiatric phenotypes
        supports: SUPPORT
