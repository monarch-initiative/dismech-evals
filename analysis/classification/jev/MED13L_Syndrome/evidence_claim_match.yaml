        biological_scale: MOLECULAR
        description: 'The SCF-Fbw7 ubiquitin ligase binds CDK8-Mediator and targets both MED13 and MED13L
          for proteasomal degradation. This is the only characterised E3-ligase control of MED13L abundance,
          and because MED13/MED13L physically link the CKM to Mediator, Fbw7-dependent turnover sets the
          kinetics of CKM dissociation from the core complex. Loss of Fbw7 increases CKM-Mediator association,
          the reciprocal of the dosage reduction seen in MED13L syndrome.

          '
