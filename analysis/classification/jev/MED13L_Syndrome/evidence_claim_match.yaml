          modifier: DECREASED
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Based on these findings, heterozygous intragenic 12q24.21 deletion in the affected individual
          resulted in MED13L haploinsufficiency due to the premature termination of protein translation,
          therefore leading to MED13L haploinsufficiency syndrome.
        supports: SUPPORT
