            label: Autosomal dominant inheritance
        expressivity: VARIABLE
        description: 'MED13L syndrome is autosomal dominant with variable expressivity: variant class
          stratifies severity, and missense carriers, especially at the exon 15-17 hotspot, have more
          epilepsy, more cardiac defects and more severe global developmental delay than carriers of premature-truncating
          variants. Most probands carry a de novo variant; recurrence in siblings of unaffected parents
          is explained by parental gonadal or germinal mosaicism, documented directly at ~30-50% of sperm
          cells in one family. Recurrence risk counselling therefore cannot simply quote a de novo population
          baseline.

          '
      selected_evidence:
        snippet: MED13L syndrome is an autosomal dominant disorder.
