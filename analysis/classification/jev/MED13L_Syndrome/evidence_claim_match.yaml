        description: 'MED13L, like its paralog MED13, is the physical hinge of the Mediator CDK8 kinase
          module (CKM, comprising MED13/MED13L, MED12/MED12L, CDK8/CDK19 and cyclin C). The subunit adopts
          an Argonaute-like bi-lobal fold, and a large intrinsically disordered region within it forms
          the principal CKM contact with core Mediator. That same disordered region sterically occludes
          the RNA polymerase II and MED26 binding surfaces, so MED13L abundance and structural integrity
          gate reversible CKM-core docking and thereby the switch between Mediator''s repressive and permissive
          states.

          '
