        description: 'Heterozygous loss-of-function alleles — whole-gene and intragenic deletions, frameshift,
          nonsense, and canonical splice variants — halve functional MED13L dosage. The reduced pool of
          intact CKM dysregulates RNA polymerase II-dependent transcriptional programs during development.
          Dosage loss is sufficient to produce the syndrome: heterozygous Med13l mice reproduce growth,
          craniofacial, learning and motor phenotypes, while homozygous loss is embryonic/neonatal lethal.

          '
        genes:
        - preferred_term: MED13L
          term:
            id: hgnc:22962
            label: MED13L
        biological_processes:
        - preferred_term: transcription by RNA polymerase II
          term:
