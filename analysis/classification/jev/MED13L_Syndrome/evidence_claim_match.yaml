            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
      selected_evidence:
        snippet: We show that Fbw7, a tumor suppressor and ubiquitin ligase, binds to CDK8-Mediator and
          targets MED13/13L for degradation.
