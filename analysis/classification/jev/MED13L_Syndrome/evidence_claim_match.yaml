          name: MED13L Syndrome
          disease_term:
            preferred_term: MED13L syndrome
            term:
              id: MONDO:0014773
              label: cardiac anomalies - developmental delay - facial dysmorphism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cyclin C nuclear release and mitochondrial dysfunction
        biological_scale: CELLULAR
        description: 'Cyclin C is retained in the nucleus by the MED13L-anchored CKM. When MED13L is lost,
          cyclin C is aberrantly released to the cytoplasm even in unstressed cells, where its CKM-independent
          activity drives mitochondrial fission. Patient fibroblasts carrying a MED13L frameshift allele
          show mitochondrial fragmentation, a six-fold reduction in respiration, reduced mtDNA copy number
          and hypersensitivity to oxidative stress. This is a candidate secondary, bioenergetic arm of
          the disease; it has been demonstrated in fibroblasts, not neurons.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: mitochondrial fission
          term:
            id: GO:0000266
            label: mitochondrial fission
          modifier: INCREASED
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: DYSREGULATED
        notes: Demonstrated in a single patient fibroblast line. Retained as a mechanism node rather than
          folded into the haploinsufficiency node because it is the one MED13L mechanism with a pharmacological
          rescue already shown in patient-derived cells. The two downstream edges are explicitly inferential
          — the cyclin C release is shown in fibroblasts, not in neurons or muscle.
      selected_evidence:
        snippet: In addition, the fibroblasts exhibited reduced mtDNA copy number, reduction in mitochondrial
          membrane integrity, and hypersensitivity to oxidative stress.
        supports: SUPPORT
