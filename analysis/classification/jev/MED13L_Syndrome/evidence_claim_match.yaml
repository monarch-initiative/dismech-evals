        description: 'Reduced or dysfunctional MED13L dysregulates RNA polymerase II-dependent neurodevelopmental
          gene programs. Mechanistically, MED13L acts by priming transcriptional activation of key cortical
          developmental genes (including Neurod2, Sox5, Auts2 and Nfib), a priming step mediated by MED13L
          binding to core Mediator that licenses the complex to associate with RNA Pol II. Loss impairs
          neural progenitor differentiation and cortical neurogenesis, and reduces dendritic number and
          length in cortical pyramidal neurons — the cellular substrate for intellectual disability, motor
          speech impairment, and hypotonia.

          '
