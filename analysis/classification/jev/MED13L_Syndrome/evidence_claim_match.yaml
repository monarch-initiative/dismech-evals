  aa2bbbd49fdff24f92313ccc2ae4d5d4cfc0fdf2cbd58ef0f62269202ae17fc6:
    claim:
      about:
        disease:
          name: MED13L Syndrome
          disease_term:
            preferred_term: MED13L syndrome
            term:
              id: MONDO:0014773
              label: cardiac anomalies - developmental delay - facial dysmorphism syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: med13l_cyclin_c_mitochondrial
        hypothesis_label: Cyclin C nuclear release and mitochondrial fragmentation as a secondary disease
          mechanism
        status: EMERGING
        description: 'MED13L tethers the cyclin C-CDK8 kinase module to Mediator; cyclin C also has a
          CKM-independent cytoplasmic role driving stress-induced mitochondrial fission and regulated
          cell death. In patient fibroblasts carrying a MED13L frameshift allele, cyclin C is aberrantly
          cytoplasmic even without stress, with mitochondrial fragmentation and markedly reduced respiration;
          blocking cyclin C mitochondrial localisation partially rescues organelle function. If this operates
          in neurons it would add a bioenergetic component to the intellectual disability phenotype and
          would be pharmacologically approachable independently of transcription. Currently demonstrated
          only in fibroblasts from a single patient allele.

          '
        applies_to_subtypes:
        - Loss-of-function (deletion / truncating / splice)
        notes: Evidence is from one patient fibroblast line carrying a single frameshift allele. Whether
          the same cyclin C release occurs in MED13L-haploinsufficient neurons, and whether it contributes
          measurably to the neurodevelopmental phenotype, is untested.
      selected_evidence:
        snippet: Unstressed MED13L S1497 F/fs patient fibroblasts exhibited aberrant cytoplasmic cyclin
          C localization, mitochondrial fragmentation, and a 6-fold reduction in respiration.
        supports: SUPPORT
