      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cornelia de Lange syndrome
        description: MED13L variants have been recovered from cohorts clinically suspected of Cornelia
          de Lange syndrome but negative for cohesin-pathway genes, so MED13L belongs in the CdLS-like
          differential.
        distinguishing_features:
        - Classic CdLS features (synophrys, limb reduction defects, prenatal growth restriction) are not
          core MED13L features.
        - Resolved by identifying NIPBL or another cohesin-pathway variant.
        disease_term:
          preferred_term: Cornelia de Lange syndrome
          term:
            id: MONDO:0016033
            label: Cornelia de Lange syndrome
      selected_evidence:
        snippet: Systematic clinical evaluation of all patients using a recently proposed clinical scoring
          system showed that ZMYND11, MED13L, and PHIP abnormality may cause CdLS or CdLS-like.
        supports: SUPPORT
