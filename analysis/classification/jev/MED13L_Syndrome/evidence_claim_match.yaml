          morphogenesis, producing the craniofacial gestalt and the variable conotruncal and septal congenital
          heart defects seen in a minority of patients. Knockdown of the MED13L zebrafish orthologue med13b
          causes defective cranial neural crest migration and cartilage deformities that phenocopy the
          human craniofacial anomalies, and heterozygous Med13l mice show midfacial hypoplasia. The clinical
          impression of a neurocristopathy predates and motivated this mechanistic work.

          '
        cell_types:
