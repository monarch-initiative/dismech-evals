        name: iPSC-derived neural progenitor CRISPRi Perturb-seq platform
        description: A scalable Perturb-seq platform (CRISPRi perturbation plus single-cell RNA-seq) in
          human WTC11 induced pluripotent stem cells carrying dCas9-KRAB, differentiated to neural progenitor
          cells, applied to 60 high-confidence autism risk genes and read out with structural topic modelling
          to assess cell fate and differentiation stage simultaneously. MED13L is one of only four genes
          whose effect replicated in an independent dataset. This is the closest thing MED13L currently
          has to a human iPSC-derived neuronal model system, and it addresses the gap left by the cyclin-C
          work, which is fibroblast-only — but note it assays CRISPRi repression of the gene rather than
          patient variants, so it models dosage loss, not allele-specific effects.
        experimental_model_type: IPSC_DERIVED_MODEL
        cell_source: Human WTC11 iPSC line with dCas9-KRAB knocked into the CLYBL safe-harbour locus (Allen
          Institute), differentiated to neural progenitor cells
        culture_system: Monolayer forebrain-directed NPC differentiation (dual-SMAD inhibition), transduced
          with pooled sgRNA lentivirus in two independently differentiated biological replicates and read
          out by CROP-seq-style sgRNA-enriched single-cell RNA-seq
