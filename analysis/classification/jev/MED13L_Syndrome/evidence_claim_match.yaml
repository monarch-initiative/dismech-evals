              label: cardiac anomalies - developmental delay - facial dysmorphism syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: med13l_haploinsufficiency
        hypothesis_label: MED13L haploinsufficiency (dosage loss) as the primary disease mechanism
        status: CANONICAL
        description: 'Heterozygous deletion, frameshift, nonsense, and canonical-splice variants reduce
          functional MED13L dosage below a developmental threshold, reducing the pool of intact CKM available
          to dock on core Mediator and dysregulating CKM-gated RNA polymerase II transcription during
          development. Supported by the predominance of loss-of-function alleles among patients, a recognisable
          shared phenotype across deletion and truncating cases, and recapitulation in heterozygous Med13l
          mice with embryonic/neonatal lethality of the homozygous null.

          '
        applies_to_subtypes:
        - Loss-of-function (deletion / truncating / splice)
      selected_evidence:
        snippet: Both patients show features of the MED13L haploinsufficiency syndrome, except for the
          heart defects, thus further confirming the existence of the MED13L haploinsufficiency syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24781760
      reference_title: Further confirmation of the MED13L haploinsufficiency syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Independent splice and multi-exon deletion alleles reproduce the syndrome, confirming
