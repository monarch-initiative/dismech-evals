      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: med13l_med13_paralog_compensation
        hypothesis_label: MED13/MED13L paralog compensation modulates expressivity
        status: EMERGING
        description: 'MED13 and MED13L are mutually exclusive occupants of the same structural position
          in the CKM and are partially redundant: combined cardiomyocyte deletion of both is lethal where
          either single deletion is tolerated. Incomplete, tissue-dependent compensation by the intact
          paralog is a candidate explanation for the variable expressivity of MED13L syndrome — in particular
          for why cardiac involvement is penetrant in only a minority — and, if druggable, a candidate
          therapeutic axis. No direct human evidence links paralog expression level to phenotype severity.

          '
        notes: The available redundancy evidence is cardiac and murine. Whether the same buffering operates
          in developing human cortex, where the dominant MED13L phenotype arises, is untested.
      selected_evidence:
        snippet: Med13 and Med13L are mutually exclusive paralogs within the kinase submodule of the Mediator
          complex that have been shown to have partially redundant functions in embryonic development
          and transcription, but their combined roles have not been investigated in the adult heart.
        supports: SUPPORT
