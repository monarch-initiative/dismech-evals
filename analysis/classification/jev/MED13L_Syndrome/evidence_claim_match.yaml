        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: med13l_missense_non_haploinsufficient
        hypothesis_label: A subset of recurrent missense variants act through a mechanism other than simple
          dosage loss
        status: EMERGING
        description: 'Most pathogenic MED13L missense variants destabilise the protein and mislocalise
          it to the cytoplasm, behaving as loss-of-function. At least one recurrent exon-15 allele, p.Pro869Ser,
          retains comparatively stable expression and partial nuclear localisation while associating with
          a more severe, epilepsy-enriched phenotype than truncating alleles — a pattern more consistent
          with a dominant-negative or neomorphic effect on the assembled CKM than with haploinsufficiency.
          This remains an inference from cell-based localisation and stability assays plus genotype-phenotype
          correlation; no direct demonstration of dominant-negative action on Mediator function has been
          published.

          '
        applies_to_subtypes:
        - Missense (exon 15-17 and 25-31 hotspots)
        notes: Treat the severity stratification as preliminary. The same study that reports p.Pro869Ser
          as stable and nuclear reports four other missense alleles behaving as classic loss-of-function,
          so this hypothesis applies to specific alleles rather than to missense variants as a class.
      selected_evidence:
        snippet: We identified significant reductions in protein stability across these variants, with
          some exhibiting aberrant cytoplasmic localization, suggesting disruptions in structural integrity
          and function.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40500968
      reference_title: MED13L pathogenic missense variants impair protein stability and interaction, underlying
        diverse clinical outcomes.
      evidence_source: IN_VITRO
      explanation: Functional characterisation of five recurrent missense alleles showing heterogeneous,
        not uniformly loss-of-function, behaviour.
