              label: intellectual developmental disorder 61
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: med13_mir208a_metabolic_axis
        hypothesis_label: The cardiac miR-208a/MED13 metabolic axis as a systemic-phenotype modifier
        status: EMERGING
        description: 'In mice, cardiac MED13 acts through nuclear-receptor signalling to control systemic
          energy expenditure: cardiac MED13 overexpression or miR-208a inhibition confers resistance to
          diet-induced obesity, while cardiomyocyte MED13 deletion worsens it. If this axis is dosage-sensitive
          in humans, it offers a candidate explanation for the restricted growth reported in a subset
          of MRD61 patients that is independent of the neurodevelopmental phenotype, and predicts that
          variant class might track with growth and cardiac trajectory. No human data test this.

          '
        notes: Entirely murine. The human MRD61 growth phenotype is restricted growth rather than obesity,
          so the direction of any human effect is not established; this is a hypothesis about a candidate
          modifier axis, not a claimed mechanism.
      selected_evidence:
        snippet: Cardiac-specific overexpression of MED13 or pharmacologic inhibition of miR-208a in mice
          confers resistance to high-fat diet-induced obesity and improves systemic insulin sensitivity
          and glucose tolerance.
        supports: SUPPORT
    origin:
