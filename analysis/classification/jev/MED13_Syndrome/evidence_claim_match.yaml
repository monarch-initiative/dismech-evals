        description: The paralogous CKM-hinge disorder and the closest differential. MED13 and MED13L
          occupy the same structural position in the kinase module and produce overlapping intellectual
          disability with prominent speech impairment.
        distinguishing_features:
        - MED13L has a recognisable facial gestalt (bulbous nasal tip, depressed nasal bridge, hypotonic
          open mouth) and roughly four times as many reported cases.
