          slowing turnover of the product of the intact allele in a haploinsufficient cell could raise
          MED13 toward the diploid level and restore CKM occupancy. This is the one route from MED13 mechanism
          to a candidate therapeutic handle. The major caveat is target selectivity: FBXW7 is a broadly
          acting tumour suppressor, so non-selective inhibition of its ligase activity carries oncogenic
          risk and any viable strategy would need to spare its other substrates.

          '
      selected_evidence:
        snippet: Our results indicate that FBXW7 is inactivated by mutation in diverse human cancer types
          with an overall mutation frequency of approximately 6%.
        supports: REFUTE
    origin:
