        description: 'Autosomal dominant, with variants predominantly arising de novo. Two departures
          from a simple dominant model matter for counselling. First, penetrance is incomplete: a pathogenic
          MED13 variant has been documented in an affected proband inherited from an asymptomatic parent,
          in whom the variant had itself arisen de novo. Second, vertical transmission from an affected
          parent is documented in at least two families. A variant should therefore not be dismissed because
          a parent carries it and is unaffected, and parental testing is warranted even when the phenotype
          looks sporadic.

          '
      selected_evidence:
        snippet: 'The patients carried different variants (1 splice-site variant, 4 nonsense and 7 frameshift)
          in 11 genes: CAMTA1, MBD5, KMT2C, KMT2E, ZMIZ1, MN1, NDUFB11, CUL3, MED13, ARID2 and RERE.'
