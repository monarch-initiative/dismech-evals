  d1503130da395085781c50ea36fec591d5c292b01e0b333987a68dffdf9aef3c:
    claim:
      about:
        disease:
          name: MED13 Syndrome
          disease_term:
            preferred_term: Intellectual developmental disorder 61
            term:
              id: MONDO:0032485
              label: intellectual developmental disorder 61
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: med13_fbw7_degron_stabilisation
        hypothesis_label: Fbw7-degron stabilisation as a dosage-restoration strategy
        status: EMERGING
        description: 'If SCF-Fbw7-mediated turnover sets the steady-state level of MED13 protein, then
          slowing turnover of the product of the intact allele in a haploinsufficient cell could raise
          MED13 toward the diploid level and restore CKM occupancy. This is the one route from MED13 mechanism
          to a candidate therapeutic handle. The major caveat is target selectivity: FBXW7 is a broadly
          acting tumour suppressor, so non-selective inhibition of its ligase activity carries oncogenic
          risk and any viable strategy would need to spare its other substrates.

          '
      selected_evidence:
        snippet: MED13/13L physically link the CDK8 module to Mediator, and Fbw7 loss increases CDK8 module-Mediator
          association.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23322298
      reference_title: The SCF-Fbw7 ubiquitin ligase degrades MED13 and MED13L and regulates CDK8 module
        association with Mediator.
      evidence_source: IN_VITRO
      explanation: Demonstrates that reducing Fbw7 activity raises CKM-Mediator association, the effect
        the strategy would exploit.
