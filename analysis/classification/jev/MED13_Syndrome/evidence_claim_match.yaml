      assertion_type: Variant
      assertion:
        name: 17q23.2 800 kb deletion encompassing MED13
        description: 'De novo whole-gene deletion detected by array CGH in a child with moderate intellectual
          disability, short stature, mild dysmorphism and hearing loss. The authors attributed the cataract,
          hearing loss and semicircular canal dysplasia specifically to MED13 haploinsufficiency, making
          this the independent CNV support for a dosage mechanism. Caveat: the deletion spans six genes
          and the patient also carried a supernumerary marker chromosome 17, so attribution to MED13 alone
          is the authors'' inference rather than a demonstrated fact. Cataract and semicircular canal
          dysplasia are not curated as MED13 syndrome phenotypes on that basis.'
        clinical_significance: PATHOGENIC
        type: deletion
        gene:
          preferred_term: MED13
          term:
            id: hgnc:22474
            label: MED13
      selected_evidence:
        snippet: We cannot entirely exclude a minor role for the SMC(17), but we suggest that MED13 haploinsufficiency
          was responsible for the phenotype of the patient particularly the cataract, hearing loss and
          semicircular canal dysplasia.
        supports: SUPPORT
