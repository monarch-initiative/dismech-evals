      assertion_type: Pathophysiology
      assertion:
        name: MED13/MED13L paralog redundancy
        biological_scale: MOLECULAR
        description: 'MED13 and MED13L are mutually exclusive occupants of the same position in the CKM
          and are partially redundant, so the intact paralog buffers loss of the other in a tissue-dependent
          way. Combined cardiomyocyte deletion of both is lethal within weeks where either single deletion
          is tolerated, and in the early mouse embryo Med13l compensates for Med13 loss during oocyte
          growth but cannot rescue post-implantation development. This buffering is the most plausible
          explanation for why MED13 haploinsufficiency produces a predominantly neurodevelopmental phenotype
          with only mild, variable cardiac involvement, and it is the shared axis linking this entry to
          MED13L syndrome.

          '
        genes:
        - preferred_term: MED13
          term:
            id: hgnc:22474
            label: MED13
        - preferred_term: MED13L
          term:
            id: hgnc:22962
            label: MED13L
        biological_processes:
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: Med13 and Med13L are mutually exclusive paralogs within the kinase submodule of the Mediator
          complex that have been shown to have partially redundant functions in embryonic development
          and transcription, but their combined roles have not been investigated in the adult heart.
        supports: SUPPORT
