      assertion:
        name: MED13 heterozygous pathogenic variants
        association: Causative
        gene_term:
          preferred_term: MED13
          term:
            id: hgnc:22474
            label: MED13
        inheritance:
        - name: Autosomal Dominant
        features: 'MED13 syndrome is caused by heterozygous pathogenic variants in MED13. Most variants
          arise de novo, although parent-to-child transmission has been documented. Both truncating variants
          (frameshift, nonsense) causing haploinsufficiency and missense variants clustering at a conserved
          phosphodegron (p.Thr326/p.Pro327) and a C-terminal region have been identified. Six of 13 patients
          in the original cohort had truncating mutations and seven had non-truncating variants. To date
          approximately 26 cases have been reported worldwide.

          '
      selected_evidence:
        snippet: 'Six affected individuals had mutations that are predicted to truncate the MED13 protein,
          six had missense mutations, and one had an in-frame-deletion of one amino acid. Out of the seven
          non-truncating mutations, six clustered in two specific locations of the MED13 protein: an N-terminal
          and C-terminal region.'
        supports: SUPPORT
