        hypothesis_group_id: med13_haploinsufficiency
        hypothesis_label: MED13 haploinsufficiency as the mechanism for truncating alleles
        status: CANONICAL
        description: 'Heterozygous truncating MED13 variants and whole-gene 17q23.2 deletions reduce the
          pool of CDK8 kinase module available to dock on core Mediator. Supported by the predominance
          of de novo truncating alleles in the founding cohort, by an independent whole-gene deletion
          phenocopy, and by the explicit haploinsufficiency conclusion drawn from a functionally characterised
          frameshift case.

          '
        applies_to_subtypes:
        - Truncating (nonsense / frameshift / whole-gene deletion)
      selected_evidence:
        snippet: we suggest that MED13 haploinsufficiency was responsible for the phenotype of the patient
          particularly the cataract, hearing loss and semicircular canal dysplasia
        supports: SUPPORT
