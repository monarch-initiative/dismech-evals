      assertion:
        name: MED13 phosphodegron disruption and impaired protein turnover
        description: 'Several pathogenic missense variants cluster at a conserved phosphodegron (Thr326/Pro327)
          in MED13. This phosphodegron is normally recognized by the SCF-Fbw7 ubiquitin ligase complex,
          leading to MED13 ubiquitination and proteasomal degradation. Mutations at these residues may
          impair MED13 protein turnover, potentially resulting in gain-of-function or dominant-negative
          effects through accumulation of mutant protein.

          '
        biological_processes:
        - preferred_term: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
          term:
            id: GO:0031146
            label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
        - preferred_term: protein ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
      selected_evidence:
        snippet: The four N-terminal clustering mutations affect two adjacent amino acids that are known
          to be involved in MED13 ubiquitination and degradation, p.Thr326 and p.Pro327.
        supports: SUPPORT
