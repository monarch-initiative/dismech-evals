          DLD, not only for syndromic intellectual disability.

          '
        phenotype_term:
          preferred_term: Language impairment
          term:
            id: HP:0002463
            label: Language impairment
        notes: '`frequency` omitted deliberately. The cohort establishes that MED13 is recoverable through
          DLD ascertainment but reports one MED13 proband among 53, which quantifies the gene''s share
          of DLD cases rather than the frequency of language impairment among MED13 patients.'
      selected_evidence:
        snippet: We identified clinically significant variants in four probands, resulting in a 7.5% (4/53)
          molecular diagnostic yield. Those variants were in PAK2, MED13, PLCB4, and TNRC6B.
        supports: SUPPORT
