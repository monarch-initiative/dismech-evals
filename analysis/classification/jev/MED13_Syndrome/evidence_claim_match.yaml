              label: intellectual developmental disorder 61
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CKM hinge anchoring by MED13
        biological_scale: MOLECULAR
        description: 'MED13 is the hinge subunit that physically tethers the four-protein CDK8 kinase
          module (CKM: MED13, MED12, CDK8, cyclin C) to core Mediator. Structural work shows MED13 adopts
          an Argonaute-like bi-lobal fold, and that a large intrinsically disordered region within it
          forms a principal CKM-core interface which directly occludes the RNA polymerase II and MED26
          binding sites — making CKM docking a kinase-independent repressor of Mediator-dependent transcription.
          Division of labour within the module is asymmetric: MED12 activates CDK8 kinase activity, whereas
          MED13 mediates the association of the module with Mediator. This node is what MED13 dosage and
          structural integrity actually control, and is the mechanistic layer the previous version of
          this entry summarised only as "connective role".

          '
        genes:
        - preferred_term: MED13
          term:
            id: hgnc:22474
            label: MED13
        - preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
        - preferred_term: CDK8
          term:
            id: hgnc:1779
            label: CDK8
        biological_processes:
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
        molecular_functions:
        - preferred_term: transcription coregulator activity
          term:
            id: GO:0003712
            label: transcription coregulator activity
      selected_evidence:
        snippet: The CKM binds to multiple regions on cMED through both MED12 and MED13, including a large
          intrinsically disordered region (IDR) in the latter.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
