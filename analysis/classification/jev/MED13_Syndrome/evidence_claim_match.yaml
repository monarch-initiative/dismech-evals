        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CKM occupancy of core Mediator and bidirectional transcriptional control
        biological_scale: MOLECULAR
        description: 'CKM docking on core Mediator sterically blocks RNA polymerase II recruitment, and
          this repression is independent of CDK8 catalytic activity — MED12 and MED13, not kinase activity,
          are the critical subunits for it. The module is nevertheless not a pure repressor: CDK8 also
          acts as a context-dependent co-activator across the p53, Wnt/beta-catenin, serum-response, SMAD
          and thyroid-hormone-receptor programs. Consequently a perturbation of MED13 dosage dysregulates
          transcription bidirectionally at CKM-gated promoters and enhancers rather than simply de-repressing
          them, which is why MED13-related disease is a transcriptional dysregulation disorder and not
          a straightforward loss of repression.

          '
        genes:
        - preferred_term: MED13
          term:
            id: hgnc:22474
            label: MED13
        biological_processes:
        - preferred_term: negative regulation of DNA-templated transcription
          term:
            id: GO:0045892
            label: negative regulation of DNA-templated transcription
          modifier: DYSREGULATED
        - preferred_term: positive regulation of DNA-templated transcription
          term:
            id: GO:0045893
            label: positive regulation of DNA-templated transcription
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Here, we report that the ability of the Cdk8 module to prevent pol II interactions is
          independent of the Cdk8-dependent kinase activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
