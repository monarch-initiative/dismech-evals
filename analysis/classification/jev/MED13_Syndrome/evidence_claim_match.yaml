        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: med13_missense_altered_function
        hypothesis_label: Clustered missense variants act by altered function rather than simple dosage
          loss
        status: EMERGING
        description: 'Pathogenic MED13 missense variants cluster in two small regions — an N-terminal
          region containing the Thr326/Pro327 SCF-Fbw7 phosphodegron and a C-terminal region — plus a
          central pair of residues around 834/835. The clustering itself argues against simple loss of
          function, which would tolerate variants anywhere. Clinically, the most severe reported presentations
          (developmental and epileptic encephalopathy, neonatal multi-organ disease with mitochondrial
          pathology) have so far occurred with missense rather than truncating alleles. Degron-region
          variants are predicted to stabilise MED13 against Fbw7-mediated turnover, which would raise
          rather than lower CKM occupancy. This is structured inference from position and phenotype; no
          functional assay has yet demonstrated altered function for any MED13 missense allele.

          '
        applies_to_subtypes:
        - Missense (N-terminal degron, central 834/835, C-terminal clusters)
        notes: Kept as EMERGING rather than CANONICAL, and explicitly contested. The clustering and severity
          signals are real, but no functional data distinguish altered function from a severe hypomorph,
          ClinGen's expert-panel curation across the full allelic series concluded loss of function, and
          the same p.Pro835Ser allele has been reported with quite different clinical courses.
      selected_evidence:
        snippet: 'Out of the seven non-truncating mutations, six clustered in two specific locations of
          the MED13 protein: an N-terminal and C-terminal region.'
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
