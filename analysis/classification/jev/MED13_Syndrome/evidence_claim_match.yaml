          its downstream consequence is demonstrated in human MED13L-mutant fibroblasts (PMID:35198885,
          curated on the MED13L_Syndrome entry), but no study has shown stress-induced MED13 degradation
          or cyclin C release in MED13-haploinsufficient human cells. The single downstream edge is therefore
          a candidate explanation for the mitochondrial phenotype, not a demonstrated causal chain.
