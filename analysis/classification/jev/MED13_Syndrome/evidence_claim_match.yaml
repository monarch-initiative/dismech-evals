  8b12ab5f375c33b236731bfe3be69ac7d9d6a00ebb36b2f8b8b6c2b7d48aa765:
    claim:
      about:
        disease:
          name: MED13 Syndrome
          disease_term:
            preferred_term: Intellectual developmental disorder 61
            term:
              id: MONDO:0032485
              label: intellectual developmental disorder 61
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Stress-induced Med13 degradation and cyclin C release
        biological_scale: CELLULAR
        description: 'A conserved, non-transcriptional arm characterised in yeast: under oxidative or
          nutrient stress, Snf1/AMPK together with the cell-wall-integrity MAPK pathway drive degradation
          of Med13, and a Snx4/Ksp1-dependent selective-autophagy route provides a second, proteasome-independent
          clearance path. Destroying Med13 releases cyclin C from its Med13-dependent nuclear anchor to
          relocalise to mitochondria, where it promotes fission and sensitises cells to regulated cell
          death. If a mammalian counterpart exists in neurons, MED13-haploinsufficient cells would be
          predicted to sit closer to the cyclin-C release threshold. The same axis is directly demonstrated
          in human MED13L patient fibroblasts, which is the strongest argument that it is not purely a
          yeast phenomenon — but it has not been shown for MED13 in human cells.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: macroautophagy
          term:
            id: GO:0016236
            label: macroautophagy
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
        - preferred_term: mitochondrial fission
          term:
            id: GO:0000266
            label: mitochondrial fission
          modifier: INCREASED
        notes: Retained deliberately as a low-confidence node. The mechanism is established in yeast and
          its downstream consequence is demonstrated in human MED13L-mutant fibroblasts (PMID:35198885,
          curated on the MED13L_Syndrome entry), but no study has shown stress-induced MED13 degradation
          or cyclin C release in MED13-haploinsufficient human cells. The single downstream edge is therefore
          a candidate explanation for the mitochondrial phenotype, not a demonstrated causal chain.
      selected_evidence:
        snippet: Here, we describe a kinase-independent role of Ksp1 as a novel autophagic receptor protein
          for Ssn2/Med13, a known cargo of Snx4-assisted autophagy of transcription factors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37733395
      reference_title: Ksp1 is an autophagic receptor protein for the Snx4-assisted autophagy of Ssn2/Med13.
      evidence_source: MODEL_ORGANISM
      explanation: Documents the selective-autophagy clearance route for Med13, a proteasome-independent
        lever on Med13 protein level.
