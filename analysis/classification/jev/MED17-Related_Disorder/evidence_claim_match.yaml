  ec8693402e8705266028a0b2d9680eefcc9f642b2889b02e8576707074cb10ac:
    claim:
      about:
        disease:
          name: MED17-Related Disorder
          disease_term:
            preferred_term: Infantile cerebral and cerebellar atrophy with postnatal progressive microcephaly
            term:
              id: MONDO:0013351
              label: infantile cerebral and cerebellar atrophy with postnatal progressive microcephaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MED17 head-module Mediator dysfunction
        description: 'MED17 is a subunit of the head module of the Mediator complex, required for RNA
          polymerase II preinitiation. The recurrent p.Leu371Pro variant is a loss-of-function allele
          (it inactivated the homologous yeast SRB4 gene in complementation assays), disrupting Mediator-dependent
          transcription. The resulting phenotype is a severe, postnatal-onset neurodegenerative process.
          MED17 belongs to the group of Mediator complex-associated disease genes.

          '
        genes:
        - preferred_term: MED17
          term:
            id: hgnc:2375
            label: MED17
        biological_processes:
        - preferred_term: transcription by RNA polymerase II
          term:
            id: GO:0006366
            label: transcription by RNA polymerase II
        - preferred_term: regulation of gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
          modifier: DYSREGULATED
      selected_evidence:
        snippet: A corresponding mutation in the homologous S.cerevisiae gene SRB4 inactivated the protein,
          according to complementation assays.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
