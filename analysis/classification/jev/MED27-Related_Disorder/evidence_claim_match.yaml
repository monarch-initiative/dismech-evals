      assertion_type: Pathophysiology
      assertion:
        name: MED27 core Mediator dysfunction
        description: 'MED27 is a subunit of the structural core of the Mediator complex. Biallelic variants
          disrupt core-Mediator-dependent transcription of developmental gene-expression programs. The
          homogeneous phenotype and multiple biallelic families support a critical role for MED27 in normal
          human neural development, particularly for the cerebellum. MED27 belongs to the group of Mediator
          complex-associated disease genes.

          '
        genes:
        - preferred_term: MED27
          term:
            id: hgnc:2377
            label: MED27
        biological_processes:
