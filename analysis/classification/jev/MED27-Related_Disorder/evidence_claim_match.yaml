            id: GO:0010468
            label: regulation of gene expression
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Identification of multiple patients with biallelic MED27 variants supports the critical
          role of MED27 in normal human neural development, particularly for the cerebellum.
        supports: SUPPORT
