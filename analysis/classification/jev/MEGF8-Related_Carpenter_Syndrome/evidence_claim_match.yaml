        publication: PMID:32203821
        description: 'A spatial and temporal deletion series designed to ask where and when MEGF8 is required
          for the cardiovascular phenotype. Its most informative results are negative: no cardiac-lineage-restricted
          deletion reproduced the cardiovascular defects, and even ubiquitous deletion at E7.5 did not.
