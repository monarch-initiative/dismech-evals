              label: MEGF8-related Carpenter syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Left-Right Patterning
        biological_scale: ORGANISM
        description: 'Abnormal establishment of the left-right axis. The 2012 five-patient series reported
          complete situs inversus, dextrocardia or transposition of the great arteries in three of its
          cases; the 2024 eight-patient cohort found none of those, reporting left atrial isomerism, abdominal
          situs inversus, polysplenia and bowel malrotation instead. The two cohorts are recorded as they
          stand rather than averaged, which is why the phenotype is bound to the broader Heterotaxy term.
          Mouse conditional-deletion work places the requirement remarkably early: deletion at embryonic
          day 6.5, before symmetry break, produces laterality and aortic arch defects, whereas deletion
          at E7.5 does not, and no cardiac-lineage-restricted deletion produces cardiovascular defects
          at all. The cardiovascular disease therefore appears to be a downstream consequence of the laterality
          defect rather than an independent cardiac requirement for MEGF8.'
      selected_evidence:
        snippet: We describe five affected individuals with similar dysmorphic facies, and three of them
          had either complete situs inversus, dextrocardia, or transposition of the great arteries; similar
          cardiac abnormalities were previously identified in a mouse mutant for the orthologous Megf8.
        supports: SUPPORT
