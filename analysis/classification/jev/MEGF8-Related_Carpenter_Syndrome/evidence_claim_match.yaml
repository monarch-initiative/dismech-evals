      assertion:
        name: MEGF8 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic MEGF8 variants reduce the activity of a multidomain transmembrane protein
          that restrains two distinct signalling pathways. Reported alleles include nonsense, missense
          and splice-site changes, and the missense alleles are hypomorphic rather than null: in a zebrafish
          rescue assay they provide only weak rescue of a Megf8-knockdown gastrulation phenotype. No patient
          carries two complete loss-of-function alleles, which is interpreted as indicating that some
          residual MEGF8 function is required for survival.'
        genes:
        - preferred_term: MEGF8
          term:
            id: hgnc:3233
            label: MEGF8
      selected_evidence:
        snippet: we demonstrate in zebrafish that, in contrast to the wild-type protein, the proteins
          containing all three missense alterations provide only weak rescue of an early gastrulation
          phenotype induced by Megf8 knockdown
        supports: SUPPORT
