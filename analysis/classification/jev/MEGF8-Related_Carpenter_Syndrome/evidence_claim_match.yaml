      assertion:
        name: Excess Hedgehog Signalling via Failed Smoothened Degradation
        conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
        biological_scale: CELLULAR
        description: 'De-repressed Smoothened-dependent Hedgehog signal transduction. This is the arm
          that patterns the limb and, with nodal-family signalling, the left-right axis. Mouse genetics
          shows it is the arm responsible for the limb phenotype specifically: Megf8 mutant limb defects
          are Hedgehog-dependent and are rescued by Smoothened inhibition.'
        biological_processes:
        - preferred_term: smoothened signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007224
            label: smoothened signaling pathway
      selected_evidence:
        snippet: 'Using Megf8 mutant mice, we show tissue-specific specialization: limb defects are Hh-dependent
          and rescued by SMO inhibition, whereas craniosynostosis is BMP-driven and refractory to Hh blockade,
          with BMP type I receptor inhibition selectively rescuing the cranial phenotype.'
        supports: SUPPORT
    origin:
