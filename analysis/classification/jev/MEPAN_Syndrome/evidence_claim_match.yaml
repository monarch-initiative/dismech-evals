      assertion_type: Treatment
      assertion:
        name: Lipoic Acid Supplementation
        description: 'Because the mtFAS defect lowers lipoic acid synthesis, lipoic acid (with or without
          octanoic acid / medium-chain triglyceride supplementation) has been tried as a mechanism-targeted
          therapy. Evidence is limited and mixed: a single homozygous p.Asp304Tyr patient had controlled
          progression without developing optic atrophy on lipoic acid, but medium-chain triglyceride plus
          lipoic acid feeding did not prevent neurodegeneration in a Purkinje-cell Mecr-knockout mouse.
          It is investigational and should not be presented as established disease-modifying therapy.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: lipoic acid
            term:
              id: CHEBI:16494
              label: lipoic acid
      selected_evidence:
        snippet: With lipoic acid treatment, the disease progression was under control, and neither visual
          impairment nor optic atrophy was observed.
        supports: SUPPORT
