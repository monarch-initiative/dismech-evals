        name: Iron and Ceramide Dysregulation
        biological_scale: CELLULAR
        description: Downstream of the Fe-S cluster biogenesis defect, mecr-loss neurons accumulate free
          iron and elevated ceramide; lowering either iron or ceramide suppresses the neurodegenerative
          phenotype, and MEPAN patient fibroblasts replicate the elevated-ceramide/impaired-iron signature.
          This branch is established primarily in a Drosophila model with patient-fibroblast corroboration.
      selected_evidence:
