        context: []
      assertion_type: Inheritance
      assertion:
        name: Maternal mitochondrial inheritance with heteroplasmy
        description: MERRF is transmitted through the maternal line only, because sperm mitochondria are
          not passed to the embryo. A carrier mother transmits the variant to every one of her children,
          but the proportion of mutant genomes each child receives is set by a random bottleneck and subsequent
          mitotic segregation, so severity is not predictable from the mother's status. An affected father
          transmits nothing. This is the practical reason prenatal testing cannot forecast the phenotype.
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
      selected_evidence:
        snippet: A female with a mtDNA pathogenic variant (whether symptomatic or asymptomatic) transmits
          the pathogenic variant to all of her offspring.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/1
