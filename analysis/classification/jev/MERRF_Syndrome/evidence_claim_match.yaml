      assertion:
        name: Neuronal Energy Failure and Oxidative Stress
        biological_scale: CELLULAR
        description: 'Neurons are unusually vulnerable to a bioenergetic deficit because maintaining ionic
          gradients across a large membrane surface consumes most of their adenosine triphosphate budget,
          and because they cannot dilute a mutant load by dividing. As supply falls below demand, ion
          pumping falters, resting membrane potential drifts, calcium handling degrades, and cells that
          cross the failure point die. The result is two distinct downstream problems: surviving neurons
          that are too excitable, and populations of neurons that are simply lost.'
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
