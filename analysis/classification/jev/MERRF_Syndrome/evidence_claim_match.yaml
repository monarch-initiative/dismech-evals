              label: MERRF syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of aminoglycosides, linezolid, tobacco, and alcohol
        description: A second and mechanistically distinct avoidance rule. Aminoglycoside antibiotics
          and linezolid both act on the bacterial ribosome, and because the mitochondrial ribosome is
          an evolutionary descendant of the bacterial one they inhibit it too. In a patient whose mitochondrial
          translation is already failing that is a second hit on the very step this disease is defined
          by. Tobacco and alcohol are avoided as general mitochondrial toxins. This is curated separately
          from the valproate rule because the mechanism differs and because the clinical situations in
          which each gets violated differ.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: 'Agents/circumstances to avoid: Mitochondrial toxins (e.g., aminoglycoside antibiotics,
          linezolid, cigarettes, alcohol)'
        supports: SUPPORT
