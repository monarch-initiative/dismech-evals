              label: MERRF syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: merrf_regional_selectivity_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a mitochondrial variant present in every tissue produce degeneration confined
          to a reproducible set of structures, chiefly the dentate nucleus, red nucleus, pallidum, subthalamic
          nucleus, cerebellar cortex, and inferior olive, while sparing most of the brain?
        attaches_to:
        - pathophysiology#Neuronal Energy Failure and Oxidative Stress
        - pathophysiology#Degeneration of Dentate Nucleus and Cerebellar Circuitry
        rationale: 'The neuropathology of MERRF is strikingly stereotyped and was recognized as a distinct
          distribution before the causal variant was known, differing from dentatorubral-pallidoluysian
          atrophy, Machado-Joseph disease, and Friedreich ataxia despite overlapping anatomy. The most
          obvious explanation, that the vulnerable regions simply carry more mutant mitochondrial DNA,
          has been tested directly and fails. Microdissection of individual neuronal somas from a MERRF
          brain found uniformly high mutant load across every region examined, and the relationship to
          cell loss ran the wrong way: Purkinje cells carried the highest mutant load of all, 97.6 percent,
          yet lost only 7 percent of their number, while dentate nucleus neurons lost 46 percent. Mutant
          load also matched between neuronal somas and the surrounding neuropil and glia, so the selectivity
          is not a matter of which cells inherited the bad genomes. What remains are cell-intrinsic differences
          under nuclear control: differing bioenergetic demand, with fast-spiking projection neurons running
          closer to their ceiling; differing antioxidant reserve; and differing capacity for mitochondrial
          biogenesis or mitophagy. None of these has been discriminated in human tissue. Resolving it
          matters beyond MERRF, because the same puzzle of a ubiquitous lesion with focal degeneration
          recurs across mitochondrial disease and is what makes the genotype so poor a predictor of which
          neurological syndrome a carrier develops.'
        proposed_experiments:
        - experiment_id: exp_merrf_regional_bioenergetic_reserve_profiling
          name: Regional bioenergetic reserve profiling in vulnerable versus spared neurons
          description: Patient-derived induced pluripotent stem cell models differentiated into the vulnerable
            neuronal classes and into a spared comparator, matched for mutant load, with measurement of
            spare respiratory capacity, reactive oxygen species handling, and survival under metabolic
            stress.
          decision_criterion: If the vulnerable classes show a lower spare respiratory capacity and die
            preferentially at matched mutant load, intrinsic bioenergetic demand explains the selectivity.
            If they behave like the comparator, selectivity must come from mutant load distribution or
            the tissue environment rather than from cell-intrinsic demand.
      selected_evidence:
        snippet: The lesions were degenerative in nature, and their distribution was different from those
          of dentato-rubropallidoluysian atrophy, Joseph's disease or Friedreich's ataxia.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:3128314
      reference_title: An autopsy case of myoclonus epilepsy associated with ragged-red fibers (Fukuhara
        disease).
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the regional pattern is specific and reproducible enough to distinguish
        MERRF from anatomically neighbouring degenerations, which is what makes its unexplained selectivity
