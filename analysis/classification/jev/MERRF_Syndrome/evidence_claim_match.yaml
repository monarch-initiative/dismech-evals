        - target: Respiratory Chain Deficiency and Loss of Mitochondrial Membrane Potential
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Elevated lactate is the circulating readout of a blocked respiratory chain forcing
            pyruvate toward lactate.
      selected_evidence:
        snippet: The lactic acid level in the blood and cerebrospinal fluid (CSF) is elevated at rest
          in patients with MERFF and can increase moderately after physical activity
        supports: SUPPORT
