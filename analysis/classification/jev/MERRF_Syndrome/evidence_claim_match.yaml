  5bccbfa4503071df60c7aa9199e9f7c7483fba549b7769ba281e7716f79502fa:
    claim:
      about:
        disease:
          name: MERRF Syndrome
          disease_term:
            preferred_term: MERRF syndrome
            term:
              id: MONDO:0010790
              label: MERRF syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: merrf_disease_modifying_therapy_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Preclinical work rescues the MERRF defect in patient-derived cells by three independent
          routes: importing working transfer RNA, stimulating mitophagy with rapamycin, and cutting the
          mutant genome with a targeted nuclease to shift heteroplasmy. None has been tested in patients.
          What would it take to move any of them into a trial, and is a bioenergetic rescue still useful
          once neurons have been lost?'
        attaches_to:
        - pathophysiology#Defective Mitochondrial Protein Synthesis
        - pathophysiology#Respiratory Chain Deficiency and Loss of Mitochondrial Membrane Potential
        rationale: 'Treatment today is entirely symptomatic. Three cell-level strategies have shown genuine
          rescue rather than marginal improvement. Targeting a yeast-derived transfer RNA lysine into
          mitochondria restored translation, respiratory complex activity, membrane potential, and respiration
          rate in patient fibroblasts and cybrids, and the rescue disappeared when the transgene was knocked
          down, which is about as clean a causal demonstration as this system allows. Separately, chronic
          rapamycin, acting through enhanced clearance of damaged mitochondria rather than through biogenesis,
          completely rescued the bioenergetic defect at intermediate mutant load, while direct stimulation
          of biogenesis failed at high mutant load. The third route attacks the problem at its root: a
          mitochondria-targeted nuclease, a monomeric mitoTev-TALE hybrid small enough to be plausibly
          packaged into a viral vector, cut the mutant genome in patient-derived cybrids and shifted the
          heteroplasmy ratio toward wild type, with recovery of oxidative phosphorylation even in a clone
          at 91 percent mutant. These results share a limitation relevant to the clinic: they were obtained
          in dividing cells that can shift their heteroplasmy, whereas the neurons that matter are postmitotic
          and cannot dilute anything, and MERRF is a degenerative disease in which the target cells may
          be gone by the time of treatment. There is also a strong hint about timing, since rapamycin
          worked well at intermediate but only marginally at high mutant load, suggesting a window that
          closes. Neither strategy has a delivery route to the human central nervous system, and no biomarker
          exists that would show target engagement in brain.'
        proposed_experiments:
        - experiment_id: exp_merrf_mitophagy_modulation_in_postmitotic_neurons
          name: Mitophagy modulation in postmitotic patient-derived neurons
          description: Apply chronic mitophagy stimulation to induced pluripotent stem cell derived neurons
            from MERRF donors after terminal differentiation, spanning a range of mutant loads, measuring
