        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MT-TK m.8344A>G Heteroplasmic Point Variant
        biological_scale: MOLECULAR
        description: An adenine to guanine transition at position 8344 of the mitochondrial genome alters
          a conserved nucleotide in the T-psi-C loop of the transfer RNA for lysine. Because each cell
          carries hundreds to thousands of mitochondrial genomes, the variant is present as a mixture
          with normal genomes rather than in every copy, a state called heteroplasmy. The original pedigrees
          showed that retaining even a small fraction of normal genomes is strongly protective, which
          is the first hint that this is a dosage disease rather than a simple loss of function.
        genes:
        - preferred_term: MT-TK
          term:
            id: hgnc:7489
            label: MT-TK
      selected_evidence:
        snippet: An A to G transition mutation at nucleotide pair 8344 in human mitochondrial DNA (mtDNA)
          has been identified as the cause of MERRF.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:2112427
      reference_title: Myoclonic epilepsy and ragged-red fiber disease (MERRF) is associated with a mitochondrial
        DNA tRNA(Lys) mutation.
      evidence_source: HUMAN_CLINICAL
      explanation: The original identification of the variant as the cause of the syndrome, in three independent
        pedigrees and absent from controls.
