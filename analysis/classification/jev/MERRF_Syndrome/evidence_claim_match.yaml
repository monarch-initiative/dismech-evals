    evidence_metadata:
      reference: PMID:20301693
      reference_title: MERRF.
      evidence_source: OTHER
      explanation: Supports the all-or-none transmission from carrier mothers that distinguishes mitochondrial
        from Mendelian inheritance, and which is why asymptomatic carrier mothers still need counselling.
