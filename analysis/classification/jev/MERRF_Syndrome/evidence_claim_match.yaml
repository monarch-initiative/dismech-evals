        name: Degeneration of Dentate Nucleus and Cerebellar Circuitry
        biological_scale: TISSUE
        conforms_to: cerebellar_purkinje_degeneration#Loss of Cerebellar Cortical Output
        description: Autopsy studies show that the neuronal loss in MERRF is not diffuse but falls on
          a reproducible set of structures, with the dentate nucleus, red nucleus, globus pallidus, subthalamic
          nucleus, and pontine tegmentum degenerating alongside the cerebellar cortex and inferior olive.
          This is the classic dentatorubral and pallidoluysian distribution, and its selectivity is the
          central unexplained feature of the disease, since the causal variant is present throughout the
          body. Loss of dentate output disrupts the cerebello-thalamo-cortical loop, producing ataxia
          and contributing a subcortical component to the myoclonus.
        locations:
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
