      assertion_type: Pathophysiology
      assertion:
        name: Mitotic Segregation and Tissue Heteroplasmy Threshold
        biological_scale: CELLULAR
        description: Mitochondrial genomes are partitioned unequally at each cell division, so the mutant
          fraction drifts upward in some lineages and downward in others. Biochemical failure is not proportional
          to that fraction; it is switch-like. In cell lines derived from one patient, moving the mutant
          load across a narrow band collapsed the mitochondrial membrane potential far more sharply than
          it reduced enzyme activity, which is what a threshold looks like experimentally. Post-mitotic
          tissues with high and unremitting energy demand cross that threshold first.
        biological_processes:
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: indicate that the biochemical manifestation of the MERRF mutation exerts a very steep
          threshold of DeltaPsi inhibition
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
