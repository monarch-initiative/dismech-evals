        name: Genetic counselling for maternal transmission
        description: 'Counselling addresses the asymmetry of mitochondrial inheritance: an affected man
          transmits nothing, a carrier woman transmits to every child, and the mutant load a child receives
          cannot be predicted. Prenatal and preimplantation testing are technically available but cannot
          forecast phenotype, which is itself the counselling message.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Genetic Counseling
