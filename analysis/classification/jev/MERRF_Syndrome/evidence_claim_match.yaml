        description: Energy-starved cortical neurons cannot sustain the ion gradients that normally hold
          them below firing threshold, and inhibitory interneurons, which fire fast and are metabolically
          expensive, are thought to fail disproportionately. The network consequence is hypersynchronous
          discharge. In MERRF this expresses itself both as cortical myoclonus with a matching electroencephalographic
          correlate and as generalized seizures. Importantly not all the myoclonus in these patients is
          cortical; a substantial minority is generated below the cortex, which is modeled on the cerebellar
          and brainstem branch instead.
