      assertion_type: Pathophysiology
      assertion:
        name: Defective Mitochondrial Protein Synthesis
        biological_scale: MOLECULAR
        description: Thirteen respiratory chain subunits are encoded by the mitochondrial genome and must
          be built inside the organelle, using its own transfer RNAs. With lysine decoding crippled, synthesis
          of those subunits stalls, and every complex that depends on a mitochondrially encoded subunit
          is left incompletely assembled. Nuclear-encoded subunits are unaffected, which is why the biochemical
          signature is a mixed and partial deficiency rather than the clean absence of one enzyme.
        biological_processes:
        - preferred_term: mitochondrial translation
          term:
            id: GO:0032543
            label: mitochondrial translation
          modifier: DECREASED
      selected_evidence:
        snippet: Defective tRNALys severely impairs mitochondrial protein synthesis and respiratory chain
          when a high percentage of mutant heteroplasmy crosses the threshold for full-blown clinical
          phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35922766
      reference_title: Rapamycin rescues mitochondrial dysfunction in cells carrying the m.8344A > G mutation
        in the mitochondrial tRNA(Lys).
      evidence_source: IN_VITRO
      explanation: Links the translation defect to the respiratory chain defect and to the heteroplasmy
