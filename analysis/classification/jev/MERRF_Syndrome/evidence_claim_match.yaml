        biological_scale: TISSUE
        description: 'Muscle fibers respond to the energy shortfall by making more mitochondria, which
          accumulate under the sarcolemma and between myofibrils. Because the added organelles carry the
          same defect, the compensation is futile, and its only reliable product is a histological sign:
          the ragged red fiber seen on Gomori trichrome, typically accompanied by fibers that fail to
          stain for cytochrome c oxidase while staining strongly for succinate dehydrogenase. Notably
          the intramuscular blood vessels show the same pattern.'
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
