        description: 'The nearest mechanistic neighbour: another maternally inherited transfer RNA disease
          with the same wobble modification defect, differing in which transfer RNA is hit and in the
          resulting clinical emphasis. Overlap cases exist.'
        distinguishing_features:
        - Caused by m.3243A>G in MT-TL1 rather than m.8344A>G in MT-TK.
        - Stroke-like episodes in non-vascular territories are the cardinal feature.
        - Myoclonus and progressive myoclonic epilepsy are not the defining picture.
      selected_evidence:
        snippet: The MERRF mt tRNA(Lys) lacking the wobble modification cannot translate either of its
          codons (AAA and AAG), while the translational activity of MELAS mt tRNA(Leu(UUR)) lacking wobble
          modification is more depressed in decoding of UUG codon than UUA codon.
        supports: SUPPORT
