        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: merrf_heteroplasmy_phenotype_disconnect
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: If the m.8344A>G variant acts through a heteroplasmy threshold, why does the heteroplasmy
          level measured in accessible tissue fail to predict who develops MERRF, and is MERRF a discrete
          syndrome at all rather than one pole of a transfer RNA lysine disease spectrum?
        attaches_to:
        - pathophysiology#Mitotic Segregation and Tissue Heteroplasmy Threshold
        - pathophysiology#Progressive Myoclonic Epilepsy
        - genetic#MT-TK m.8344A>G
        rationale: 'The threshold model is well supported in cell culture, where membrane potential collapses
          steeply across a narrow band of mutant load. It does not transfer cleanly to patients. In a
          three-generation family, symptomatic members did carry significantly more mutant genomes than
          asymptomatic ones, yet asymptomatic relatives were found carrying up to 63 percent mutant genomes,
          and the authors concluded there is no absolute relationship between blood mutant load and clinical
          severity. A larger East Chinese cohort of transfer RNA lysine carriers found blood heteroplasmy
          of a similar high range in symptomatic and asymptomatic individuals alike, and, more strikingly,
          found that the classic MERRF syndrome was the exception rather than the rule: most symptomatic
          carriers had a myopathy with neuropathy picture and only about a quarter had myoclonus at all.
          A case report goes further still, describing a homoplasmic carrier whose course was milder and
          later than his heteroplasmic sister, the opposite of what a simple dosage model predicts. Three
          interpretations remain live. The first keeps the threshold model and blames the measurement,
          arguing that blood is the wrong tissue and that brain or muscle mutant load, ideally at single-cell
          resolution, would restore the correlation. The second holds that heteroplasmy is genuinely only
          one input, with nuclear background, mitochondrial haplogroup, and the cell''s capacity for compensatory
          biogenesis or mitophagy setting where the threshold sits. The third questions the nosology,
          treating MERRF as a named region of a continuous transfer RNA lysine phenotype landscape rather
          than an entity with its own mechanism. The stakes are practical: a blood heteroplasmy result
          is routinely used to counsel families, and on the second and third readings that number carries
          much less predictive weight than it appears to. The first reading is the weakest of the three,
          because the brain measurement it asks for has already been made: single neurons microdissected
          from a MERRF brain carried uniformly high mutant load across regions that differed several-fold
          in cell loss. Moving from blood to brain therefore does not rescue the dosage model, which pushes
          the weight of explanation onto the modifiers of the second reading and onto the nosological
          question of the third.'
