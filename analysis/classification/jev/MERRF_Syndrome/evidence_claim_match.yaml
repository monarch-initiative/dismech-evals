        description: Muscle biopsy shows a substantial proportion of ragged red fibers on Gomori trichrome,
          together with fibers lacking cytochrome c oxidase activity and strong succinate dehydrogenase
          reactivity, including in intramuscular blood vessels. The combination is the histological signature
          of a mitochondrially encoded translation defect, since succinate dehydrogenase is entirely nuclear-encoded
          and therefore spared.
