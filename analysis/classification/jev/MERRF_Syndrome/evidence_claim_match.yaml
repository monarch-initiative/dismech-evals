        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Transfer RNA Lysine Wobble Taurine Modification
        biological_scale: MOLECULAR
        description: 'Mitochondrial transfer RNAs carry a taurine-containing chemical tag on the wobble
          uridine, the flexible first base of the anticodon that lets one transfer RNA read more than
          one codon. The m.8344A>G variant abolishes this tag on transfer RNA lysine. The consequence
          is unusually complete: unlike the analogous MELAS variant, which mainly impairs one of its two
          codons, the untagged MERRF transfer RNA fails to decode either lysine codon.'
        biological_processes:
        - preferred_term: tRNA wobble uridine modification
          term:
            id: GO:0002098
            label: tRNA wobble uridine modification
          modifier: DECREASED
      selected_evidence:
        snippet: revealed the lack of a post-transcriptional taurine-modification at the anticodon wobble
          uridine in two mt tRNAs bearing typical pathogenic mutations
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17132941
      reference_title: Human mitochondrial diseases associated with tRNA wobble modification deficiency.
      evidence_source: IN_VITRO
      explanation: Direct demonstration in patient-derived material that the modification is missing,
        which is the molecular content of this node.
