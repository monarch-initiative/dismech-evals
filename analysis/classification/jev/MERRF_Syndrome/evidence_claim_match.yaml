            label: Genetic Counseling
      selected_evidence:
        snippet: because the mutational load in tissues sampled prenatally may shift in utero or after
          birth as a result of random mitotic segregation, prediction of the phenotype from prenatal studies
          is not possible.
        supports: SUPPORT
