      assertion_type: Treatment
      assertion:
        name: Subretinal AAV2 Gene Therapy (rAAV2-VMD2-hMERTK, Investigational)
        description: Subretinal injection of an AAV2 vector expressing human MERTK cDNA under the RPE-specific
          VMD2 (bestrophin-1) promoter, developed following preclinical proof-of-concept in the RCS rat.
          A completed phase I open-label dose-escalation trial (NCT01482195) in six patients (ages 14-54)
          demonstrated an acceptable ocular and systemic safety profile over 2-year follow-up; three of
          six patients showed measurable visual acuity improvement, though the improvement was lost by
          2 years in two of these patients, indicating that current vector/protocol approaches may provide
          only transient benefit. No gene therapy for MERTK-RP is FDA approved as of this writing.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: We demonstrate the potency of the vector in RCS rats by improved electroretinogram (ERG)
          responses in treated eyes compared with contralateral untreated controls.
        supports: SUPPORT
