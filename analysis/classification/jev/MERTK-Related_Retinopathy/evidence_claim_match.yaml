              label: MERTK-related retinopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: MERTK Biallelic Variants
        association: Causative
        gene_term:
          preferred_term: MERTK
          term:
            id: hgnc:7027
            label: MERTK
        features: Biallelic loss-of-function variants (nonsense, frameshift, splice-site, multi-exon structural
          deletions) and hypomorphic missense variants in MERTK, encoding a receptor tyrosine kinase of
          the TAM family (Tyro3/Axl/MERTK) expressed on the apical RPE surface, where it mediates ensheathment
          and engulfment of shed photoreceptor outer segments.
      selected_evidence:
        snippet: Mutation of a receptor tyrosine kinase gene, Mertk, in the Royal College of Surgeons
          (RCS) rat results in defective phagocytosis of photoreceptor outer segments by the retinal pigment
          epithelium (RPE) and retinal degeneration. We screened the human orthologue, MERTK, located
          at 2q14.1 (ref. 10), in 328 DNA samples from individuals with various retinal dystrophies and
          found three mutations in three individuals with retinitis pigmentosa (RP). Our findings are
          the first conclusive evidence implicating the RPE phagocytosis pathway in human retinal disease.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
