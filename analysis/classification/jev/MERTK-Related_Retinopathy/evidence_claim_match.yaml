        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Secondary Cone Degeneration
        description: Progressive loss of rod photoreceptors leads to non-cell-autonomous secondary cone
          degeneration. By the general mechanisms proposed for rod-cone dystrophies -- loss of rod-derived
          cone survival factors and elevated outer retinal oxygen tension after rod loss -- cone photoreceptors
          die, converting the initial rod-dominant disease into central vision impairment; disproportionately
          early macular involvement is a distinguishing clinical feature of MERTK-RP. (These downstream
          cone-death mechanisms are general RP biology, not specifically evidenced for MERTK-RP by the
          cited cohort, which documents the early macular involvement.)
        cell_types:
        - preferred_term: cone photoreceptor cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: Early macular involvement was present, in accordance with that of other reported patients
          with MERTK mutations.
        supports: SUPPORT
