            term:
              id: MONDO:0800394
              label: MERTK-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MERTK Loss of Function in RPE
        description: Biallelic MERTK variants abolish or severely reduce MERTK receptor tyrosine kinase
          activity on the apical surface of RPE cells. MERTK is activated by the bridging ligands Gas6
          and Protein S, which bind phosphatidylserine exposed on shed photoreceptor outer segment (POS)
          tips and signal through MERTK on the RPE apical surface, distinct from the parallel alphavbeta5
          integrin/MFG-E8 pathway that governs the timing of phagocytic uptake. Loss of MERTK abolishes
          the receptor-proximal signal that normally triggers ensheathment and engulfment of POS particles
          by the RPE.
        gene:
          preferred_term: MERTK
          modifier: ABSENT
          term:
            id: hgnc:7027
            label: MERTK
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        molecular_functions:
        - preferred_term: transmembrane receptor protein tyrosine kinase activity
          term:
            id: GO:0004714
            label: transmembrane receptor protein tyrosine kinase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: receptor-mediated endocytosis
          term:
            id: GO:0006898
            label: receptor-mediated endocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: MERTK ligands, GAS6 and PROS1, rather than alphaVbeta5 integrin receptor ligands, triggered
          POS ensheathment by human embryonic stem cell (hESC)-derived RPE.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
