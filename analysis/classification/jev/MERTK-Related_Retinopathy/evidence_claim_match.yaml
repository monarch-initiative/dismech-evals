  972da128e5af1bebde442a6a67d4d4d4cc8d520632bf790738049a30491a96c3:
    claim:
      about:
        disease:
          name: MERTK-Related Retinopathy
          disease_term:
            preferred_term: MERTK-related retinopathy
            term:
              id: MONDO:0800394
              label: MERTK-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RPE Phagocytic Failure and Outer Segment Debris Accumulation
        description: 'Without functional MERTK signaling, RPE cells fail to ensheath, fragment, and internalize
          the photoreceptor outer segment discs that are normally shed and engulfed each day as part of
          the outer segment renewal cycle. Undigested POS debris accumulates in the subretinal space between
          the RPE apical surface and the photoreceptor outer segments, visible clinically as subretinal
          hyper-reflective debris on OCT. This is a non-cell-autonomous mechanism: the primary molecular
          lesion is in the supporting RPE cell rather than in the photoreceptor itself, distinguishing
          MERTK-RP from most other retinitis pigmentosa genes that act intrinsically within rods and cones.'
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        cellular_components:
        - preferred_term: photoreceptor outer segment
          term:
            id: GO:0001750
            label: photoreceptor outer segment
        biological_processes:
        - preferred_term: phagocytosis, engulfment
          term:
            id: GO:0006911
            label: phagocytosis, engulfment
          modifier: DECREASED
      selected_evidence:
        snippet: RPE derived from human embryonic stem cells (hESCs), in which MERTK was knocked out using
          CRISPR/Cas9, or from an RP38 patient iPSC cell line with homozygous MERTK deletion, failed to
          ensheath, fragment, and internalize W-POS, which shows that MERTK is required for ensheathment
          and ensheathment-mediated fragmentation of POS, and implicates the loss of which in RP38 disease
          pathology and vision loss in patients.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
