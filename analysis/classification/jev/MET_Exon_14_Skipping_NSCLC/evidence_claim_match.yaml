          and degradation, leading to prolonged MET signaling after ligand stimulation.
        cell_types:
        - preferred_term: type II pneumocyte
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        biological_processes:
        - preferred_term: transmembrane receptor protein tyrosine kinase signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
      selected_evidence:
        snippet: MET exon 14 mutations were identified in 28 of 933 nonsquamous NSCLCs (3.0%) and were
          not seen in other cancer types in this study.
        supports: SUPPORT
