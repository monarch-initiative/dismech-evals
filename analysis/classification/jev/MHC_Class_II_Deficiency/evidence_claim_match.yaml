        - preferred_term: thymic epithelial cell
          term:
            id: CL:0002293
            label: epithelial cell of thymus
        notes: 'The name understates the lesion slightly. The original 30-patient series described not
          only profound loss of HLA class II expression but also inconsistent and incomplete class I expression,
          so the surface phenotype is not purely class II-restricted. The class II defect is the one that
