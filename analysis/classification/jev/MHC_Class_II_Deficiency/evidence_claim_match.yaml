      assertion_type: Treatment
      assertion:
        name: Hematopoietic cell transplantation
        description: Allogeneic hematopoietic cell transplantation is the only established curative therapy
          and can restore hematopoietic immune function, although outcomes depend on transplant strategy,
          donor type, infection burden, and residual nonhematopoietic thymic epithelial defects.
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: hematopoietic stem cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: 'Two obstacles are specific to this disorder rather than generic to transplantation. First,
          graft rejection: residual host immunity is adequate to reject even under immunosuppression,
          and donor antigen-presenting cells presenting donor antigen to recipient T cells has been proposed
          as the mechanism, so second transplants have been needed. Second, an irreducible ceiling: the
          thymic epithelium is not haematopoietic, so donor cells cannot restore MHC-II expression there.
          Survivors'' CD4 counts stay significantly below those of other transplanted patients, and mouse
          work frames this as the reason the benefit of transplantation is limited rather than complete.
          Neither obstacle prevents cure — post-2008 survival is 94%, with survivors off immunoglobulin
          and making protective vaccine responses.'
      selected_evidence:
        snippet: Hematopoietic cell transplantation (HCT) remains the only curative treatment for this
          condition, but transplant survival in the previously published result was poor.
