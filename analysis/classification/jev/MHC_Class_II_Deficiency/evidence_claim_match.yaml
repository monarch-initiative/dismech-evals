      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Untransplanted MHC class II deficiency killed patients at a mean age of four years,
          usually from overwhelming viral infection, on a background of recurrent respiratory and gastrointestinal
          infection, protracted diarrhoea, failure to thrive, and hepatobiliary disease. Transplantation
          is the only cure and was itself historically poor (33% survival before 2008), though contemporary
          strategies reach 94%. Burden is therefore high but sharply era- and access-dependent, and survivors
          still carry a residual CD4 deficit from the non-haematopoietic thymic epithelial component of
          the disease.
      selected_evidence:
        snippet: 'Prognosis was very poor: the mean age at the time of death was 4 years. The main cause
          of death was overwhelming viral infection.'
        supports: SUPPORT
