  e18e162e5fbd2af4fecdc32b3778cc09a3f7421aa6fba647f1462c4cd1af1e7c:
    claim:
      about:
        disease:
          name: MITF Waardenburg-Tietz Spectrum
          disease_term:
            preferred_term: MITF-related Waardenburg-Tietz spectrum
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MITF Loss of Function
        description: Pathogenic variants in the MITF gene reduce or abolish the transcriptional activity
          of the microphthalmia-associated transcription factor. MITF is a basic-helix-loop-helix-leucine
          zipper (bHLH-Zip) transcription factor that serves as the master regulator of melanocyte development
          and survival. In WS2A, haploinsufficiency from nonsense, frameshift, or splice-site mutations
          causes partial loss. In Tietz syndrome, missense mutations in the basic DNA-binding domain are
          proposed to act through a dominant-negative or altered DNA-binding mechanism. In COMMAD, biallelic
          mutations cause complete or near-complete loss.
        genes:
        - preferred_term: MITF
          term:
            id: hgnc:7105
            label: MITF
        cell_types:
        - preferred_term: melanocyte
          term:
            id: CL:0000148
            label: melanocyte
        - preferred_term: migratory neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        biological_processes:
        - preferred_term: melanocyte differentiation
          term:
            id: GO:0030318
            label: melanocyte differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: the phenotypes of the two families with WS2A in the present study are caused by loss-of-function
          mutations in one of the two alleles of the MITF gene, resulting in haploinsufficiency of the
          MITF protein, the protein necessary for normal development of melanocytes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
