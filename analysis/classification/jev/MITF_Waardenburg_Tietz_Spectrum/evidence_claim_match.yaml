            description: Visible pigmentation defects resulting from melanocyte deficiency. In WS2A, patchy
              depigmentation produces white forelock, skin patches, and heterochromia iridis. In Tietz
              syndrome, generalized hypopigmentation affects all pigmented tissues. In COMMAD, complete
              albinism occurs.
