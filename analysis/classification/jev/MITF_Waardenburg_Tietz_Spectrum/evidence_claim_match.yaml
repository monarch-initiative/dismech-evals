        variant_origin: GERMLINE
        notes: 'TYR is not an independent cause of MITF-related Waardenburg-Tietz disease. It is curated
          here as the second locus of the digenic WS2-with-ocular-albinism phenotype recorded in this
          entry''s `Digenic inheritance (WS2 with ocular albinism)` block: the hypomorphic TYR(R402Q)
          allele, which MITF transcriptionally regulates, combined with a heterozygous MITF loss-of-function
          allele. Biallelic TYR lesions on their own are curated in the Oculocutaneous_Albinism entry
          (OCA1A/OCA1B), not here.'
        features: TYR(R402Q), a common functionally significant polymorphism with moderately reduced tyrosinase
          catalytic activity, carried homozygously or heterozygously alongside a heterozygous MITF frameshift
          allele.
