          notes: Values are dB hearing level (HL). The source gives each grade as a closed range to one
            decimal place (Mild hearing loss 20.0 to 34.9 dB hearing level, and so on up to Complete or
            total hearing loss 95.0 dB hearing level or greater); the half-open bands here are the same
            partition. The source splits normal hearing into -10.0 to 4.9 and 5.0 to 19.9 dB hearing level;
            both are folded into one Normal hearing band. Its Unilateral category (below 20.0 dB in the
            better ear, 35.0 dB or greater in the worse ear) needs both ears and is not representable
            as a band. Severity is set only where the grade name is mild, moderate or severe. No MITF-WS2-specific
            severity figure was found in the cached sources for this entry; the grading itself is generic
            to hearing loss of any cause, not specific to Waardenburg syndrome.
        - unit: dB
