        snippet: Clinical presentation varies, but hallmark features include a broad nasal root, hypertelorism
          with dystopia of the lacrimal puncta, heterochromia or hypopigmented irides, medial eyebrow
          hypertrichosis, a white forelock, and congenital sensorineural hearing loss (SNHL).
        supports: SUPPORT
