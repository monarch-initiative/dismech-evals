      assertion:
        name: Pigmentary Abnormalities
        description: Visible pigmentation defects resulting from melanocyte deficiency. In WS2A, patchy
          depigmentation produces white forelock, skin patches, and heterochromia iridis. In Tietz syndrome,
          generalized hypopigmentation affects all pigmented tissues. In COMMAD, complete albinism occurs.
        notes: 'The distinction between WS2A (patchy) and Tietz (generalized) pigmentary changes reflects
          the mechanism: haploinsufficiency allows some melanocyte development (stochastic loss) whereas
          missense mutations in the basic domain may block melanocyte function more completely.'
      selected_evidence:
        snippet: The pigmentary features and complete penetrance make this syndrome distinct among syndromes
          with pigmentary anomalies and deafness, which characteristically have patchy depigmentation
          and variable penetrance
        supports: SUPPORT
