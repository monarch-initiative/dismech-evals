            '
        - name: c.158T>C (p.Leu53Pro)
          description: Missense MMACHC variant associated with mild clinical and biochemical phenotypes
            and marked response to intramuscular hydroxocobalamin monotherapy even when compound heterozygous
            with truncating c.271dupA.
        - name: c.80A>G (p.Gln27Arg)
