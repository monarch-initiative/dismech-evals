      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acquired or nutritional vitamin B12 deficiency
        description: Dietary or malabsorptive vitamin B12 deficiency can mimic cblC deficiency biochemically
          (elevated methylmalonic acid and total homocysteine) and clinically (megaloblastic anemia, subacute
          combined degeneration, neuropsychiatric symptoms), but serum vitamin B12 concentration is typically
          normal or elevated in cblC deficiency.
        distinguishing_features:
        - Serum vitamin B12 concentration is typically normal or elevated in cblC deficiency, whereas
          it is low in nutritional or malabsorptive vitamin B12 deficiency.
        - Persistent elevation of methylmalonic acid and total homocysteine despite normal serum B12 prompts
          plasma tHcy/MMA and MMACHC molecular testing.
      selected_evidence:
        snippet: Initial evaluations of adults with new onset of neuropsychiatric symptoms often include
          serum vitamin B12 levels. However, serum vitamin B12 level are often normal in cblC, and serum
          tHcy and MMA levels are not routinely ordered to evaluate for an intracellular vitamin B12 metabolism
          defect.
        supports: SUPPORT
