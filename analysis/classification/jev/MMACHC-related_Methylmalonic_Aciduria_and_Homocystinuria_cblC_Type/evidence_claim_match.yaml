          both methylcobalamin and adenosylcobalamin. Disease severity is strongly modified by genotype,
          with recurrent missense variants such as c.482G>A and c.158T>C associated with later onset or
          milder phenotypes and better hydroxocobalamin responsiveness, whereas homozygosity for truncating
          alleles such as c.271dupA is associated with severe early-onset neurodevelopmental and retinal
          morbidity.

          '
      selected_evidence:
        snippet: Cobalamin C is the most common inborn error of intracellular cobalamin metabolism caused
          by biallelic pathogenic variants in the MMACHC gene, leading to impaired conversion of dietary
          vitamin B12 into its two metabolically active forms, methylcobalamin and adenosylcobalamin.
        supports: SUPPORT
