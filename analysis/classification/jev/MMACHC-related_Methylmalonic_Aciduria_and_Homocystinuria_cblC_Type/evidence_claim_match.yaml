          heterogeneous neuropsychiatric abnormalities, spastic paraparesis/spinal cord degeneration,
          cognitive decline, renal thrombotic microangiopathy, or pulmonary hypertension. Diagnostic delay
          is common and is an independent risk factor for incomplete recovery, although prompt high-dose
          hydroxocobalamin and betaine therapy often yields marked biochemical and clinical improvement.
