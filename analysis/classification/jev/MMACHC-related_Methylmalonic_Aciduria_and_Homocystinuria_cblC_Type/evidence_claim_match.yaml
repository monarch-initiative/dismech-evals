      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other disorders of intracellular cobalamin metabolism
        description: Combined methylmalonic aciduria and homocystinuria or isolated remethylation defects
          can also arise from defects in lysosomal cobalamin export (LMBRD1/cblF, ABCD4/cblJ), downstream
          trafficking (MMADHC/cblD), cytosolic remethylation (MTR/cblG, MTRR/cblE), or transcriptional
          regulators of MMACHC (HCFC1/cblX, THAP11, ZNF143). Molecular genetic testing distinguishes MMACHC-related
          cblC from these complementation groups.
        distinguishing_features:
        - Biallelic pathogenic variants in MMACHC confirm cblC deficiency and exclude MMADHC (cblD), LMBRD1
          (cblF), ABCD4 (cblJ), and X-linked HCFC1 (cblX).
        - Complementation and molecular genetic testing distinguish MMACHC (cblC) from MMADHC (cblD-combined
          and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4 (cblJ), THAP11 (cblX-like),
          ZNF143 (cblX-like), and X-linked HCFC1 (cblX).
      selected_evidence:
        snippet: 'Diagnosis is confirmed by identification of biallelic pathogenic variants in one of
          the following genes (associated complementation groups indicated in parentheses): MMACHC (cblC),
          MMADHC (cblD-combined and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4
          (cblJ), THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which
          can show a cblC complementation class).'
        supports: SUPPORT
