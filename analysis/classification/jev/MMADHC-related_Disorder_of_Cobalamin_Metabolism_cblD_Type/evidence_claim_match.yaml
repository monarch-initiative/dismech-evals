  86a7145a679b767e6cbd76bdbe1b96dbca37787e6bb14234948c4059af8cfeba:
    claim:
      about:
        disease:
          name: MMADHC-related Disorder of Cobalamin Metabolism, cblD Type
          disease_term:
            preferred_term: homocystinuria-megaloblastic anemia cblD type
            term:
              id: MONDO:0700297
              label: homocystinuria-megaloblastic anemia cblD type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Cobalamin Branch-Point Trafficking
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: MMADHC normally partitions processed cobalamin between the mitochondrial and cytosolic
          routes. Losing it removes the switch, and which destination goes unserved depends on which part
          of the protein the variant disrupts.
        biological_processes:
        - preferred_term: cobalamin metabolic process
          modifier: DECREASED
          term:
            id: GO:0009235
            label: cobalamin metabolic process
      selected_evidence:
        snippet: 'Previously we have shown that in cblD patients three types of MMADHC mutations exist:
          1) null mutations N-terminal to Met116 cause isolated methylmalonic aciduria (cblD-MMA) due
          to AdoCbl deficiency; 2) null mutations across the C-terminus (p.Y140-R250) cause combined methylmalonic
          aciduria and homocystinuria (cblD-MMA/HC) due to AdoCbl and MeCbl deficiency; 3) missense mutations
          in a conserved C-terminal region (p.D246-L259) cause isolated homocystinuria (cblD-HC) due to
          MeCbl deficiency.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
