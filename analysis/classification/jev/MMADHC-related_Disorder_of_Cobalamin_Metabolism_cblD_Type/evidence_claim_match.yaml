        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Loss of Mitochondrial Cobalamin Routing
        - pathophysiology#Adenosylcobalamin Deficiency
        prompt: What does MMADHC do inside mitochondria, and what sets its split between the two compartments?
        rationale: 'The evidence for a mitochondrial role is strong on necessity and location and weak
          on mechanism. Necessity: N-terminal null alleles abolish adenosylcobalamin synthesis while sparing
          methylcobalamin synthesis, and strengthening MMADHC''s mitochondrial leader sequence shifts
          cofactor from the methylcobalamin to the adenosylcobalamin pool. Location: fractionation and
          immunofluorescence find the protein in both mitochondria and cytosol. Mechanism: every characterised
          MMADHC partner is cytosolic (MMACHC, methionine synthase and its reductase), and no interaction
          with the mitochondrial adenosyltransferase MMAB or the GTPase MMAA has been reported, so how
          cobalamin reaches MMAB after MMADHC enters the mitochondrion is not known.

          The determinant of the split is equally open. Mitochondrial membrane potential is one input:
          MMADHC is short-lived, collapse of the proton motive force stabilises it in the cytosol and
          raises methionine synthase activity, and LONP1 inhibition instead accumulates it inside mitochondria.
          That makes mitochondrial import, and LONP1-dependent turnover inside the organelle, candidate
          regulators of the split, but these results come from cell lines under pharmacological or mtDNA-depletion
          stress, not from cblD patient cells.'
      selected_evidence:
        snippet: The factors that determine the distribution of MMADHC between the cytoplasm and mitochondria
          remain unknown.
        supports: SUPPORT
    origin:
