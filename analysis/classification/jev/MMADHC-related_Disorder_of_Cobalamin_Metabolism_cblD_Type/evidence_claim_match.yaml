  eeb13d9bb1f87a5adbb8a77837cdc1ea4b4ef77952d6b21684736fae139cb555:
    claim:
      about:
        disease:
          name: MMADHC-related Disorder of Cobalamin Metabolism, cblD Type
          disease_term:
            preferred_term: homocystinuria-megaloblastic anemia cblD type
            term:
              id: MONDO:0700297
              label: homocystinuria-megaloblastic anemia cblD type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cbld_one_gene_three_biochemical_diseases
        kind: INTERPRETATION
        attaches_to:
        - pathophysiology#Failure of Cobalamin Branch-Point Trafficking
        - genetic#MMADHC
        prompt: Why does one gene produce three different biochemical diseases?
        rationale: 'Most inborn errors of metabolism give one metabolite signature because the affected
          protein does one job. MMADHC gives three because its job is to choose between two destinations,
          so a variant can remove one destination, the other, or both depending on where it falls.

          The evidence for this being a real domain effect rather than a description after the fact is
          that it was predicted and then tested. Systematic mutagenesis across p.P154-S287 in patient
          fibroblasts located a discrete region required for methylcobalamin synthesis, and truncations
          of graded length produced graded phenotypes between the isolated and combined pictures. That
          converts the three clinical classes from a taxonomy into a map of one protein.

          The history is worth keeping too: the cblD-variant patients were originally identified because
          their cells complemented cblE, cblG, cblA and cblB reference lines - that is, they behaved biochemically
          like those disorders while belonging genetically to none of them. Complementation analysis found
          the branch point before anyone knew what the gene was.'
      selected_evidence:
        snippet: These findings indicate heterogeneity within the previously defined cblD mutant class
          and point to further complexity of intracellular cobalamin metabolism.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
