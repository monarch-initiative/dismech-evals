      reference: PMID:15292234
      reference_title: The cblD defect causes either isolated or combined deficiency of methylcobalamin
        and adenosylcobalamin synthesis.
      evidence_source: IN_VITRO
      explanation: The conclusion that split cblD into biochemical variants, drawn from complementation
