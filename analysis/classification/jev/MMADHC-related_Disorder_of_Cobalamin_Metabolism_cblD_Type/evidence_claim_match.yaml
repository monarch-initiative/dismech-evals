    claim:
      about:
        disease:
          name: MMADHC-related Disorder of Cobalamin Metabolism, cblD Type
          disease_term:
            preferred_term: homocystinuria-megaloblastic anemia cblD type
            term:
              id: MONDO:0700297
              label: homocystinuria-megaloblastic anemia cblD type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cbld_ptc_readthrough
        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#
        - pathophysiology#Biallelic MMADHC Loss of Function
        prompt: Could premature termination codon readthrough restore MMADHC in patients?
        rationale: 'Most disease-associated MMADHC alleles create premature termination codons, which
          makes the gene a candidate for translational readthrough - forcing the ribosome past the stop
          codon to produce full-length protein. This has been shown for MMADHC in cells, with the effect
          depending on which specific PTC is present.

          Two things keep this a gap rather than a treatment. It has not been tested in patients, and
          the compounds used to induce readthrough in the published work are aminoglycosides, whose own
          toxicity is the subject of a separate disease entry in this knowledge base - a carrier of an
          MT-RNR1 variant given an aminoglycoside for readthrough would be at risk of exactly the ototoxicity
          that entry describes. Any clinical development would have to reckon with that, which is a reason
          to record the lead here rather than to present it as a prospect.'
      selected_evidence:
        snippet: Our results suggest that translational PTC readthrough-based interventions could complement
          current therapies for cblD patients carrying specific MMADHC PTC mutations.
        supports: SUPPORT
