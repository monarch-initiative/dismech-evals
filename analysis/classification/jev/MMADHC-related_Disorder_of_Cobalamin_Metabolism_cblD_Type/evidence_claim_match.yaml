        genetic_context:
          variant_origin: GERMLINE
          allele_type: nonsense or frameshift across the C-terminus (p.Y140-R250)
          genomic_contexts:
          - coding sequence
          allelic_hit_role: BIALLELIC_INACTIVATION
          functional_impact_category: LOSS_OF_FUNCTION
          notes: 'Loss of both functions. The longer the C-terminal truncation the more complete the loss:
            beyond twenty residues the cellular phenotype is combined, shorter ones give the isolated-homocystinuria
            picture.'
        description: Premature stops across the C-terminus remove the C-terminal domain from every product,
          so neither arm is served and both coenzymes are deficient.
      selected_evidence:
        snippet: 'Previously we have shown that in cblD patients three types of MMADHC mutations exist:
          1) null mutations N-terminal to Met116 cause isolated methylmalonic aciduria (cblD-MMA) due
          to AdoCbl deficiency; 2) null mutations across the C-terminus (p.Y140-R250) cause combined methylmalonic
          aciduria and homocystinuria (cblD-MMA/HC) due to AdoCbl and MeCbl deficiency; 3) missense mutations
          in a conserved C-terminal region (p.D246-L259) cause isolated homocystinuria (cblD-HC) due to
          MeCbl deficiency.'
        supports: SUPPORT
