      assertion:
        name: Complement-Dependent Cytotoxicity
        description: 'MOG-IgG (predominantly IgG1) bound to MOG on the surface of oligodendrocytes activates
          the classical complement pathway, leading to membrane attack complex formation and oligodendrocyte
          injury with secondary demyelination. Unlike AQP4-IgG NMOSD where astrocytes are the primary
          target, in MOGAD oligodendrocytes/myelin are directly targeted.

          '
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: complement activation
          term:
            id: GO:0006956
            label: complement activation
          modifier: INCREASED
      selected_evidence:
        snippet: MOG-IgG-mediated demyelination occurs via complement-dependent cytotoxicity (CDC), antibody-dependent
          cellular cytotoxicity (ADCC), enhanced cognate T-cell CNS infiltration and activation, and oligodendrocyte
          cytoskeleton disruption
        supports: SUPPORT
